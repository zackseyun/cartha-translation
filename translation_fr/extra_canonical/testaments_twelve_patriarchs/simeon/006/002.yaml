  text: Ἐὰν δὲ⁴ ἀφέλητε⁵ ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν⁶, Ὡς⁷ ῥόδον ἀνθήσει⁸ τὰ ὀστᾶ μου⁹ ἐν Ἰσραήλ, καὶ¹⁰ ὡς κρίνον *ἡ σάρξ μου¹⁰ ἐν Ἰακώβ, καὶ ἔσται¹¹ *ἡ ὀσμή μου ὡς¹² ὀσμὴ Λιβάνου,¹³ καὶ πληθυνθήσονται¹⁴ ἅγιοι¹⁵ *ἐξ ἐμοῦ¹⁶ *ἕως αἰῶνας¹⁷ αἰώνων¹⁷ καὶ *οἱ κλάδοι¹⁸ αὐτῶν¹⁹ εἰς μακρὰν ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: fr
  text: Mais si vous vous débarrassez de l’envie et de toute dureté de cœur, mes os fleuriront comme une rose en Israël, et ma chair comme un lis en Jacob. Mon parfum sera comme le parfum du Liban. Des saints issus de moi se multiplieront jusqu’aux siècles des siècles, et leurs branches s’étendront au loin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: la jalousie
  rationale: Le terme désigne ici l’envie jalouse; «jalousie» est naturel en français et convient au thème central du Testament de Siméon.
- source_word: σκληροκαρδίαν
  choice: dureté de cœur
  rationale: Expression française courante qui conserve l’image grecque du cœur endurci.
- source_word: ἀνθήσει
  choice: fleuriront
  rationale: Rend directement la métaphore de l’épanouissement végétal appliquée aux os.
- source_word: ῥόδον
  choice: rose
  rationale: Équivalent direct, sans préciser si le grec évoque une rose cultivée ou une autre fleur de type rosier.
- source_word: κρίνον
  choice: lis
  rationale: Équivalent traditionnel et intelligible; l’identification botanique exacte peut rester ouverte.
- source_word: ὀσμή
  choice: parfum
  rationale: Dans ce contexte floral et libanais, «parfum» restitue mieux la valeur positive d’odeur agréable que le neutre «odeur».
- source_word: ἅγιοι
  choice: des saints
  rationale: Le substantif pluriel désigne des personnes consacrées ou saintes; «saints» conserve cette portée sans ajout interprétatif.
- source_word: ἕως αἰῶνας αἰώνων
  choice: pour les siècles des siècles
  rationale: Formule française dignifiée qui reproduit l’intensification temporelle grecque.
- source_word: κλάδοι
  choice: branches
  rationale: Préserve l’image végétale et généalogique du texte source.
- source_word: εἰς μακράν
  choice: au loin
  rationale: Rend l’extension à grande distance sans imposer une direction ni une interprétation géographique.
theological_decisions:
- issue: Identité des «saints» issus de Siméon
  choice: Maintenir «des saints issus de moi» sans les identifier davantage
  alternative: Interpréter comme des descendants pieux, une lignée sacerdotale ou un groupe eschatologique précis
  rationale: Le grec affirme leur provenance et leur multiplication, mais ne précise pas leur identité ni leur fonction.
- issue: Sens de la floraison des os et de la chair
  choice: Conserver littéralement les images parallèles
  alternative: Les expliciter comme résurrection, prospérité posthume ou fécondité de la descendance
  rationale: Le passage permet plusieurs lectures symboliques; la traduction ne doit pas trancher silencieusement.
- issue: Référents de «leurs branches»
  choice: Conserver le pronom «leurs»
  alternative: Remplacer par «les branches de mes descendants»
  rationale: Le référent grammatical le plus proche est «les saints», mais la métaphore généalogique demeure ouverte.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe garde le parallélisme poétique du grec tout en divisant la longue période pour une lecture naturelle. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
