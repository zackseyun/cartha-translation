- from: Mais si vous ôtez de vous la jalousie et toute dureté de cœur, mes os fleuriront comme une rose en Israël, et ma chair comme un lis en Jacob. Mon parfum sera comme le parfum du Liban. Des saints issus de moi se multiplieront pour les siècles des siècles, et leurs branches s’étendront au loin.
  to: Mais si vous vous débarrassez de l’envie et de toute dureté de cœur, mes os fleuriront comme une rose en Israël, et ma chair comme un lis en Jacob. Mon parfum sera comme le parfum du Liban. Des saints issus de moi se multiplieront jusqu’aux siècles des siècles, et leurs branches s’étendront au loin.
