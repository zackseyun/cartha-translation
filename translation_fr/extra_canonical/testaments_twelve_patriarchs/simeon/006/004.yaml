  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: fr
  text: Alors, le pays de Cham disparaîtra, et tout peuple périra. Alors, toute la terre cessera de connaître les troubles, et tout ce qui est sous les cieux cessera de connaître la guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει
  choice: disparaîtra
  rationale: Le verbe signifie ici « cesser d’exister, disparaître »; ce choix convient au pays de Cham sans lui attribuer directement le même verbe qu’au peuple.
- source_word: ἡ γῆ Χάμ
  choice: le pays de Cham
  rationale: Dans ce contexte, γῆ désigne vraisemblablement le territoire associé à Cham; « pays » est plus naturel que « terre » pour cette première occurrence.
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: L’article et le singulier de λαός favorisent « tout le peuple », plutôt que « tous les peuples ».
- source_word: καταπαύσει ... ἀπό
  choice: connaîtra la fin de
  rationale: Cette formulation française naturelle rend l’idée de cessation et permet de conserver la terre comme sujet grammatical.
- source_word: πᾶσα ἡ ὑπ᾿ οὐρανῶν
  choice: tout ce qui est sous les cieux
  rationale: Le grec comporte une expression substantivée elliptique au féminin; la formulation française en préserve la portée générale sans ajouter un nom absent du texte.
theological_decisions:
- issue: Portée de « tout le peuple »
  choice: Conserver le singulier collectif
  alternative: « tous les peuples » ou « chaque peuple »
  rationale: Le texte grec transmis porte πᾶς ὁ λαός au singulier; la traduction évite d’universaliser explicitement au pluriel.
- issue: Référent de l’expression « sous les cieux »
  choice: Maintenir une expression générale et elliptique
  alternative: « toute la terre sous les cieux » ou « toute créature sous les cieux »
  rationale: Le substantif sous-entendu n’est pas assuré; il ne faut pas résoudre silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « Alors » reproduit la structure prophétique du grec. « Sous les cieux » conserve le pluriel de οὐρανῶν.
