source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἰδοὺ εἴρηκα¹ ὑμῖν πάντα², *ὅπως δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/001.yaml
  text: Behold, I have told you everything, so that I may be justified from your sin.
translation:
  language: fr
  text: Voici, je vous ai tout dit afin que je sois justifié à l’égard de votre péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Rend naturellement la particule grecque qui attire solennellement l’attention.
- source_word: εἴρηκα
  choice: j’ai dit
  rationale: Le passé composé français exprime ici l’accompli du parfait grec et sa pertinence présente.
- source_word: πάντα
  choice: tout
  rationale: Équivalent direct et idiomatique de « toutes choses » dans ce contexte.
- source_word: δικαιωθῶ
  choice: être justifié
  rationale: Conserve le sens judiciaire et théologique possible du verbe, sans le réduire à « être disculpé ».
- source_word: ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: quant à votre péché
  rationale: La préposition ἀπό avec le passif de δικαιόω est inhabituelle; « quant à » préserve le rapport au péché des destinataires sans imposer une idée précise de provenance, de séparation ou de disculpation.
theological_decisions:
- issue: Rapport entre la justification du locuteur et le péché des destinataires
  choice: afin d’être justifié quant à votre péché
  alternative: afin d’être dégagé de votre péché
  rationale: Le grec peut suggérer une justification ou une mise hors de cause par rapport à leur péché. La formulation retenue maintient cette tension sans affirmer que leur péché serait imputé au locuteur ni que celui-ci en serait moralement purifié.
translation_notes:
  register: Français moderne, sobre et digne. « Voici » garde la force déictique de Ἰδοὺ; la formulation légèrement formelle « justifié quant à » reflète l’expression grecque inhabituelle et son ambiguïté.
