revisions:
- from: Voici, je vous ai tout dit, afin d’être justifié quant à votre péché.
  to: Voici, je vous ai tout dit afin que je sois justifié à l’égard de votre péché.
  rationale: 'Révision limitée de la proposition finale pour améliorer l’idiomaticité française et expliciter le sujet de la forme passive. « À l’égard de » maintient l’ambiguïté du rapport exprimé par ἀπό : le texte ne dit pas explicitement si le locuteur est dégagé d’une responsabilité, justifié face au péché d’autrui, ou justifié en raison de celui-ci.'
