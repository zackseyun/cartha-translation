source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε δοθήσεται⁴⁸ πάντα τὰ πνεύματα τῆς πλάνης⁴⁹ εἰς καταπάτησιν⁵⁰ καὶ οἱ⁵¹ ἄνθρωποι⁵² βασιλεύσουσιν⁵³ τῶν⁵⁴ πονηρῶν πνευμάτων⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: fr
  text: Alors tous les esprits d’égarement seront livrés pour être foulés aux pieds, et les êtres humains régneront sur les esprits mauvais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεύματα τῆς πλάνης
  choice: esprits d’égarement
  rationale: Le génitif peut désigner des esprits caractérisés par l’égarement ou qui le suscitent. « D’égarement » conserve cette latitude mieux que « trompeurs ».
- source_word: εἰς καταπάτησιν
  choice: au piétinement
  rationale: Cette formulation rend la construction nominale grecque et l’idée d’un abaissement sous les pieds sans préciser silencieusement l’agent du piétinement.
- source_word: ἄνθρωποι
  choice: êtres humains
  rationale: Le terme grec est générique ici; « êtres humains » l’exprime clairement en français moderne sans le limiter aux hommes de sexe masculin.
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: domineront sur les esprits mauvais
  rationale: Dans cette construction, βασιλεύω exprime l’exercice de la domination. « Domineront sur » est naturel et garde l’image du renversement d’autorité.
- source_word: πονηρῶν πνευμάτων
  choice: esprits mauvais
  rationale: « Mauvais » rend simplement πονηρός sans ajouter une catégorie démonologique plus précise que le grec.
theological_decisions:
- issue: Agent du piétinement
  choice: Ne pas identifier explicitement l’agent
  alternative: « seront livrés pour être piétinés par les êtres humains »
  rationale: Le grec juxtapose la livraison des esprits au piétinement et la domination humaine, mais ne rattache pas grammaticalement de façon explicite les êtres humains comme agents de καταπάτησις.
- issue: Portée de ἄνθρωποι
  choice: Sens humain générique
  alternative: « les hommes »
  rationale: Rien dans le contexte fourni n’impose une référence exclusivement masculine; la traduction générique évite d’introduire cette restriction.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le parallélisme du grec ainsi que la formulation abstraite de εἰς καταπάτησιν, malgré son caractère légèrement marqué en français.
