  rationale: 'La révision améliore l’idiomaticité française tout en conservant le parallélisme et l’ambiguïté du grec : le texte ne désigne pas explicitement qui foule aux pieds ces esprits. Aucun ajout théologique n’est introduit. Aucun appel de note n’apparaît dans le texte français fourni, et les chiffres de l’édition grecque relèvent de son appareil éditorial ; aucune note française n’est donc requise.'
