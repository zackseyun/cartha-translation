  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: fr
  text: Alors, moi aussi, je me relèverai dans la joie et je bénirai le Très-Haut pour ses merveilles [car Dieu, ayant pris un corps et mangeant avec les êtres humains, a sauvé les êtres humains].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστησόμαι
  choice: je me relèverai
  rationale: Rend le futur moyen de ἀνίστημι tout en conservant la possible portée de résurrection du verbe sans l’expliciter davantage.
- source_word: εὐφροσύνῃ
  choice: dans la joie
  rationale: Expression française naturelle qui restitue l’idée de joie et d’allégresse.
- source_word: τὸν ὕψιστον
  choice: le Très-Haut
  rationale: Titre divin français établi et fidèle au superlatif grec substantivé.
- source_word: θαυμασίοις
  choice: merveilles
  rationale: Rend les actes extraordinaires de Dieu dans un registre biblique clair et actuel.
- source_word: σῶμα λαβών
  choice: ayant pris un corps
  rationale: Conserve étroitement la construction participiale et l’affirmation du texte sans lui imposer un vocabulaire doctrinal plus technique.
- source_word: συνεσθίων ἀνθρώποις
  choice: mangé avec les êtres humains
  rationale: Le préverbe συν- exprime le fait de manger avec d’autres; «êtres humains» traduit ἀνθρώποις de manière inclusive et non ambiguë.
- source_word: ἔσωσεν ἀνθρώπους
  choice: a sauvé les êtres humains
  rationale: Maintient le sens sotériologique direct du verbe et la répétition rhétorique de ἀνθρώποις / ἀνθρώπους.
theological_decisions:
- issue: Portée de ἀναστησόμαι
  choice: je me relèverai
  alternative: je ressusciterai
  rationale: «Se relever» préserve l’ambiguïté lexicale entre le fait de se lever et celui de ressusciter, alors que «ressusciter» trancherait explicitement.
- issue: Formulation de l’incarnation dans σῶμα λαβών
  choice: ayant pris un corps
  alternative: s’étant incarné
  rationale: La traduction retenue suit les mots du grec et évite d’importer un terme doctrinal qui préciserait davantage leur portée.
- issue: Délimitation de la clause finale
  choice: conserver les crochets autour de la clause
  alternative: intégrer la clause sans crochets
  rationale: Les crochets figurent dans le texte grec fourni et signalent une réserve éditoriale ou textuelle qu’il ne convient pas d’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec, notamment dans la proposition participiale, tout en demeurant naturelle. La répétition «êtres humains» est volontaire afin de préserver celle du texte source.
