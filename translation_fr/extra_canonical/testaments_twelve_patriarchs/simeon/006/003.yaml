review_pass:
  verdict: revise
  source_fidelity: La phrase suit bien la structure grecque et rend correctement σπέρμα (« descendance »), ἀπολεῖται / ἀπολοῦνται (« périra/périront ») et ἐξολοθρευθήσονται (« seront entièrement anéantis »). Cependant, ἐν τῷ Ἀμαλήκ est explicitement locatif (« en Amalec »). Le rendre par « parmi les Amalécites » interprète Amalec comme un groupe humain et transforme la relation locative en appartenance ethnique.
  naturalness: Le français est moderne, fluide et d’un registre approprié. La correction « aucun survivant ne restera en Amalec » demeure idiomatique tout en reproduisant plus exactement la formulation source.
  terminology: « Canaan », « Cappadociens » et « Hittites » sont appropriés. « Amalec » est la forme française biblique courante pour Ἀμαλήκ. « Descendance » convient à σπέρμα dans ce contexte collectif.
  issues:
