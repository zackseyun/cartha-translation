  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: fr
  text: Alors, la descendance de Canaan périra, et aucun survivant ne restera en Amalec ; tous les Cappadociens périront, et tous les Hittites seront entièrement anéantis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα Χαναάν
  choice: la descendance de Canaan
  rationale: Dans ce contexte collectif et généalogique, σπέρμα désigne la postérité ou la descendance plutôt qu’une semence au sens concret.
- source_word: ἐγκατάλειμμα
  choice: aucun survivant
  rationale: Le terme désigne ce qui reste après une destruction ; « survivant » rend naturellement le référent humain impliqué.
- source_word: ἐν τῷ Ἀμαλήκ
  choice: parmi les Amalécites
  rationale: La construction désigne vraisemblablement le peuple d’Amalek. Cette formulation française restitue la valeur locative de ἐν sans donner l’impression qu’Amalek est uniquement un territoire.
- source_word: ἐξολοθρευθήσονται
  choice: seront entièrement anéantis
  rationale: Le verbe renforcé exprime une destruction totale ; « entièrement » conserve cette intensité.
