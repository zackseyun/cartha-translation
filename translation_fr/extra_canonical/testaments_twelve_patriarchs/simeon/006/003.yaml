    issue: « parmi les Amalécites » interprète ἐν τῷ Ἀμαλήκ.
    rationale: Le grec dit littéralement qu’aucun reste ne sera « en Amalec ». Le texte peut désigner un lieu, un territoire ou une entité collective; la traduction ne doit pas trancher cette ambiguïté par « parmi les Amalécites ».
  revised_text: Alors, la descendance de Canaan périra, et aucun survivant ne restera en Amalec ; tous les Cappadociens périront, et tous les Hittites seront entièrement anéantis.
