base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
translation:
  language: fr
  text: 'VIII


    1 Lorsque Siméon eut achevé de donner ses instructions à ses fils, il s’endormit avec ses pères, âgé de cent vingt ans.


    2 Ils le déposèrent dans un cercueil de bois, afin de transporter ses ossements à Hébron. Ils les transportèrent en secret pendant une guerre des Égyptiens.[a]


    3 En effet, les Égyptiens gardaient les ossements de Joseph dans les tombeaux des rois.[b]


    4 Car les enchanteurs leur disaient que, lors de la sortie des ossements de Joseph[c], il y aurait dans tout le pays des ténèbres, une profonde obscurité et un grand fléau pour les Égyptiens, au point que, même avec une lampe, personne ne reconnaîtrait son frère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est condensée. Elle peut aussi se comprendre ainsi : « en secret pendant une guerre égyptienne » ou « en temps de guerre entre les Égyptiens ».'
    reason: alternative_reading
  - marker: b
    text: 'Le texte est difficile. Certains témoins portent « magasins » ou « chambres de réserve » au lieu de « tombeaux » : « les Égyptiens gardaient les ossements de Joseph dans les magasins des rois ».'
    reason: textual_variant
  - marker: c
    text: Voir Genèse 50.25 et Exode 13.19 au sujet du transport des ossements de Joseph.
    reason: cross_reference
lexical_decisions:
- source_word: συνετέλεσεν
  choice: eut achevé
  rationale: Le verbe marque ici l’achèvement des dernières instructions de Siméon; le passé antérieur convient à la succession narrative en français.
- source_word: ἐντελλόμενος
  choice: de donner ses commandements
  rationale: Cette formulation conserve l’autorité de l’exhortation paternelle sans employer le tour peu naturel « commander ses fils ».
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Le grec emploie l’euphémisme traditionnel de la mort; le conserver maintient la texture biblique sans l’expliciter doctrinalement.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: avec ses pères
  rationale: Le tour traditionnel français préserve la formule biblique de mort et de réunion aux ancêtres.
- source_word: θήκῃ ξυλίνῃ
  choice: un cercueil de bois
  rationale: Dans ce contexte funéraire, « cercueil » exprime clairement la fonction du contenant, tandis que « de bois » rend l’adjectif.
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  choice: afin de transporter ses ossements à Hébron
  rationale: « Transporter » rend naturellement le transfert vers le lieu de sépulture ancestral; la destination explicite en grec évite qu’il soit nécessaire de reproduire littéralement « faire monter ».
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  choice: en secret pendant une guerre des Égyptiens
  rationale: Le rendu maintient à la fois la clandestinité et l’expression comprimée et ambiguë concernant la guerre, sans imposer une reconstruction historique.
- source_word: ἐφύλαττον
  choice: gardaient
  rationale: L’imparfait français reflète l’action continue et « gardaient » peut désigner aussi bien la conservation que la surveillance des ossements.
- source_word: μνήμασι τῶν βασιλέων
  choice: dans les tombeaux des rois
  rationale: Ce rendu suit le sens funéraire direct du texte grec fourni, tandis que la variante « magasins » est signalée en note.
- source_word: ἐπαοιδοί
  choice: enchanteurs
  rationale: Le terme désigne des praticiens d’incantations; « enchanteurs » convient au cadre ancien et reste immédiatement compréhensible.
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: au départ des ossements de Joseph
  rationale: Cette formulation conserve l’image inhabituelle de la sortie ou du départ des ossements sans ajouter une destination absente de la proposition.
- source_word: σκότος καὶ γνόφος
  choice: des ténèbres, une profonde obscurité
  rationale: Le doublet grec est maintenu par deux termes distincts; « profonde » communique l’intensité de γνόφος dans un français naturel.
- source_word: πληγὴ μεγάλη
  choice: un grand fléau
  rationale: Dans ce contexte de jugement collectif, « fléau » exprime une calamité frappant l’Égypte sans limiter indûment le terme à une maladie.
- source_word: ὥστε μετὰ λύχνου μὴ ἐπιγινώσκειν ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: au point que, même avec une lampe, personne ne reconnaîtrait son frère
  rationale: Le tour consécutif est rendu directement; « personne » exprime idiomatiquement la portée distributive de ἕκαστος sous la négation.
theological_decisions:
- issue: Formule de mort ἐκοιμήθη
  choice: il s’endormit
  alternative: il mourut; il reposa
  rationale: Le texte emploie un euphémisme traditionnel. Le conserver respecte sa portée littéraire et théologique sans en tirer une affirmation doctrinale supplémentaire.
- issue: Sortie des ossements de Joseph et calamité annoncée
  choice: conserver l’annonce des enchanteurs comme une affirmation rapportée dans le récit
  alternative: reformuler l’annonce comme une prophétie certaine ou comme une simple croyance égyptienne
  rationale: La construction « les enchanteurs leur disaient que » attribue explicitement l’annonce à ces personnages. La traduction ne confirme ni ne récuse leur prétention.
- issue: Lieu où les Égyptiens gardaient les ossements de Joseph
  choice: les tombeaux des rois
  alternative: les magasins ou chambres de réserve des rois
  rationale: Le texte grec fourni porte μνήμασι, qui désigne normalement des tombeaux ou monuments funéraires. La difficulté textuelle est conservée en note plutôt que résolue par harmonisation.
translation_notes:
  register: Français international moderne, digne et narratif. Les formules bibliques « il s’endormit » et « avec ses pères » sont conservées, tandis que la syntaxe environnante reste accessible. Les ambiguïtés textuelles et historiques sont signalées en notes plutôt que lissées dans le corps du texte.
