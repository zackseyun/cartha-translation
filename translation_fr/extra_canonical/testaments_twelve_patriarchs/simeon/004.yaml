  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
translation:
  language: fr
  text: '1. Mon père ne cessait de m’interroger à mon sujet, parce qu’il m’avait vu abattu, et je lui disais : « Mon foie est gonflé. »[a] 2. Car j’étais plus affligé que tous les autres, parce que j’étais responsable de la vente de Joseph. 3. Lorsque nous descendîmes en Égypte et que Joseph m’attacha comme espion, je compris que je souffrais avec justice, et je ne m’en affligeai pas. 4. Mais Joseph était un homme bon ; il avait en lui l’Esprit de Dieu et, plein de compassion et de miséricorde, il ne garda aucune rancune contre moi, mais il m’aima avec mes frères. 5. Gardez-vous donc, mes enfants, de toute jalousie et de toute envie[d], et marchez dans la simplicité de cœur[b], afin que Dieu vous accorde, à vous aussi, faveur, gloire et bénédiction sur vos têtes, comme vous l’avez vu chez Joseph. 6. Toute sa vie, il ne nous fit aucun reproche à propos de cette affaire ; il nous aima comme sa propre âme, nous honora plus que ses fils et nous accorda richesses, troupeaux et récoltes. 7. Vous
    aussi, mes enfants, que chacun aime son frère d’un cœur bon, et l’esprit d’envie s’éloignera de vous. 8. Car l’envie rend l’âme sauvage et détruit le corps ; elle suscite colère et conflit dans les desseins, pousse à verser le sang, entraîne l’intelligence dans la démence, bouleverse l’âme et fait trembler le corps. 9. Même durant le sommeil, l’envie le dévore en lui présentant des visions mauvaises ; elle trouble son âme par des esprits mauvais, fait sursauter son corps et réveille son intelligence en plein trouble. Ainsi, il apparaît aux gens comme un esprit mauvais et venimeux.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon foie est gonflé » reproduit une ancienne manière corporelle d’exprimer l’angoisse ou la détresse intérieure ; Siméon donne à son père une explication physique de son air abattu.
    reason: cultural_note
  - marker: b
    text: L’expression « simplicité de cœur » peut aussi se traduire par « un cœur sans partage » ou « sincérité de cœur ».
    reason: lexical_alternative
  - marker: c
    text: La dernière proposition peut signifier soit que l’envieux apparaît aux autres comme un esprit mauvais et venimeux, soit que l’envie elle-même leur apparaît ainsi.
    reason: alternative_reading
  - marker: d
    text: Les mots « jalousie » et « envie » traduisent deux termes grecs proches (ζῆλος et φθόνος), tous deux employés ici en mauvaise part.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκυθρωπόν
  choice: abattu
  rationale: Exprime naturellement en français moderne un abattement visible que Jacob pouvait remarquer.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: Mon foie enfle
  rationale: Conserve l’image physiologique concrète de l’original au lieu de la remplacer par une paraphrase psychologique ; une note en explique la portée culturelle.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: la vente de Joseph
  rationale: Désigne précisément la vente dont Joseph fut victime, plutôt qu’une trahison indéterminée.
- source_word: δικαίως πάσχω
  choice: je souffrais avec justice
  rationale: Préserve la valeur morale et judiciaire de δικαίως sans expliciter davantage que le grec.
- source_word: ἀγαθὸς ἀνήρ
  choice: un homme bon
  rationale: Rendu simple et direct de l’appréciation morale portée sur Joseph.
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  choice: Il avait en lui l’Esprit de Dieu
  rationale: Rend clairement la présence divine exprimée par le grec tout en gardant sa formulation sobre.
- source_word: εὔσπλαγχνος καὶ ἐλεήμων
  choice: plein de compassion et de miséricorde
  rationale: Distingue les deux qualités voisines dans un français courant et digne.
- source_word: ἐμνησικάκησέν
  choice: ne garda aucune rancune
  rationale: Correspond à l’idée de ne pas entretenir le souvenir offensé du mal subi.
- source_word: ἁπλότητι καρδίας
  choice: avec un cœur sans partage
  rationale: Exprime l’intégrité et l’absence de duplicité visées par ἁπλότης dans une tournure française naturelle ; la note conserve les équivalents plus formels.
- source_word: ζήλου καὶ φθόνου
  choice: jalousie et envie
  rationale: Maintient les deux termes grecs apparentés, tous deux négatifs dans ce contexte.
- source_word: ψυχὴν αὐτοῦ
  choice: sa propre âme
  rationale: Préserve le vocabulaire anthropologique du texte, notamment son contraste ultérieur avec le corps et l’intelligence.
- source_word: εἰς αἵματα παροξύνει
  choice: pousse au meurtre
  rationale: Le pluriel αἵματα évoque le sang versé ; « meurtre » transmet ici cette conséquence violente de façon idiomatique.
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: entraîne l’intelligence dans la démence
  rationale: Dans ce contexte pathologique, ἔκστασις désigne une perte de maîtrise ou de raison, non une extase positive.
- source_word: ἐκθροεῖσθαι τὸ σῶμα ποιεῖ
  choice: fait sursauter son corps
  rationale: Conserve la réaction corporelle soudaine liée aux visions troublantes du sommeil.
- source_word: ἰοβόλον
  choice: venimeux
  rationale: Rend l’image d’un être qui lance ou répand du poison sans l’affaiblir en simple malveillance.
theological_decisions:
- issue: La nature de πνεῦμα θεοῦ en Joseph
  choice: l’Esprit de Dieu
  alternative: un esprit de Dieu ; l’esprit de Dieu
  rationale: Dans ce portrait moral de Joseph, l’expression désigne le plus naturellement la présence ou l’action divine. La majuscule signale cette lecture sans développer une doctrine absente du passage.
- issue: Le vocabulaire anthropologique de ψυχή
  choice: âme
  alternative: vie ; personne ; être
  rationale: Le chapitre distingue l’âme, le corps et l’intelligence dans une description morale et psychologique. « Âme » conserve cette texture conceptuelle.
- issue: L’agent de la dernière proposition
  choice: le pronom « il », renvoyant grammaticalement à l’envieux dans la traduction
  alternative: l’envie elle-même apparaît comme un esprit mauvais et venimeux
  rationale: Le grec permet une hésitation sur le référent implicite. Le texte principal retient l’envieux, tandis qu’une note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe testamentaire et les images corporelles de l’original sont conservées lorsque leur étrangeté porte du sens, avec notes explicatives. Les répétitions morales restent visibles sans imposer un vocabulaire confessionnel particulier.
