revisions:
- from: '1. Mon père ne cessait de m’interroger à mon sujet, parce qu’il m’avait vu abattu, et je lui disais : « Mon foie enfle. »[a] 2. Car je menais deuil plus que tous les autres, parce que j’étais responsable de la vente de Joseph. 3. Lorsque nous descendîmes en Égypte et que Joseph me fit attacher comme espion, je compris que je souffrais avec justice, et je ne m’en affligeai pas. 4. Mais Joseph était un homme bon. Il avait en lui l’Esprit de Dieu et, plein de compassion et de miséricorde, il ne garda aucune rancune contre moi, mais il m’aima avec mes frères. 5. Gardez-vous donc, mes enfants, de toute jalousie et de toute envie[d], et marchez avec un cœur sans partage[b], afin que Dieu vous accorde, à vous aussi, faveur, gloire et bénédiction sur vos têtes, comme vous l’avez vu dans le cas de Joseph. 6. De toute sa vie, il ne nous fit aucun reproche à propos de cette affaire. Au contraire, il nous aima comme sa propre âme, nous honora plus que ses fils et nous accorda richesses, troupeaux
    et récoltes. 7. Vous aussi, mes enfants, que chacun aime son frère d’un cœur bon, et l’esprit d’envie s’éloignera de vous. 8. Car l’envie rend l’âme sauvage et détruit le corps ; elle suscite colère et conflit dans les desseins, pousse au meurtre, entraîne l’intelligence dans la démence, bouleverse l’âme et fait trembler le corps. 9. Même durant le sommeil, l’envie le dévore en lui présentant des visions mauvaises ; elle trouble son âme par des esprits mauvais, fait sursauter son corps et réveille son intelligence en plein trouble. Ainsi, il apparaît aux gens comme un esprit mauvais et venimeux.[c]


    [a] « Mon foie enfle » reproduit une ancienne manière corporelle d’exprimer l’angoisse ou la détresse intérieure ; Siméon donne à son père une explication physique de son air abattu.


    [b] L’expression « un cœur sans partage » peut aussi se traduire par « simplicité de cœur » ou « sincérité de cœur ».


    [c] La dernière proposition peut signifier soit que l’envieux apparaît aux autres comme un esprit mauvais et venimeux, soit que l’envie elle-même leur apparaît ainsi.


    [d] Les mots « jalousie » et « envie » traduisent deux termes grecs proches (ζῆλος et φθόνος), tous deux employés ici en mauvaise part.'
