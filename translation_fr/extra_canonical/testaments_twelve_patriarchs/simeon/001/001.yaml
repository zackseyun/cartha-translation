source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Διαθήκη Συμεὼν τοῦ δευτέρου υἱοῦ Ἰακὼβ καὶ Λίας¹. I. *¹Ἀντίγραφον λόγων² Συμεών, ἃ³ ἐλάλησε τοῖς υἱοῖς αὐτοῦ⁴, *πρὸ τοῦ ἀποθανεῖν⁵ αὐτὸν⁶ *ἐν ἑκατοστῷ εἰκοστῷ ἔτει⁷ τῆς ζωῆς αὐτοῦ⁸ *ἐν ᾧ χρόνῳ⁹ ἀπέθανεν Ἰωσὴφ ὁ ἀδελφὸς αὐτοῦ¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/001.yaml
  text: A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died.
translation:
  language: fr
  text: Copie[a] des paroles de Siméon, qu’il adressa à ses fils avant de mourir, dans la cent vingtième année de sa vie, à l’époque où mourut son frère Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Recueil des paroles de Siméon».
    reason: Le grec Ἀντίγραφον peut désigner une copie écrite ou, dans ce contexte, un document consignant les paroles.
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Le terme désigne d’abord une copie ou transcription; ce choix conserve le caractère documentaire de l’introduction.
- source_word: λόγων
  choice: des paroles
  rationale: Rend naturellement le pluriel λόγων dans la formule «paroles de Siméon», sans le réduire à un discours unique.
- source_word: ἐλάλησε
  choice: adressa
  rationale: Dans le contexte de paroles prononcées à l’intention de ses fils, «adressa» est idiomatique tout en conservant l’acte de parler.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: dans la cent vingtième année de sa vie
  rationale: Traduction formellement fidèle de l’expression chronologique grecque, qui indique une année de vie plutôt qu’un âge formulé en années révolues.
- source_word: ἐν ᾧ χρόνῳ
  choice: à l’époque où
  rationale: Expression française naturelle qui préserve la relation temporelle générale du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le ton testamentaire et documentaire du grec sans archaïsmes inutiles.
