  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/002.yaml
  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
translation:
  language: fr
  text: 'Alors que Siméon était malade, ses fils vinrent lui rendre visite. Rassemblant ses forces, il s’assit, les embrassa affectueusement[a] et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est intensif et peut évoquer des baisers répétés ou particulièrement affectueux.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρρωστοῦντος
  choice: Alors que … était malade
  rationale: Le participe présent au génitif absolu fournit le cadre temporel de la scène.
- source_word: ἐπισκέψασθαι
  choice: rendre visite
  rationale: Dans ce contexte familial, l’infinitif exprime naturellement le fait de venir voir une personne malade.
- source_word: ἐνισχύσας
  choice: Rassemblant ses forces
  rationale: Cette formulation idiomatique rend l’idée qu’il reprend assez de force ou de courage pour se redresser.
- source_word: ἐκάθισε
  choice: il s’assit
  rationale: Le verbe signifie qu’il prit une position assise; le contexte de maladie peut suggérer qu’il se redressa, sans que cela doive être explicité.
- source_word: κατεφίλησεν
  choice: les embrassa affectueusement
  rationale: Le composé intensif peut évoquer des baisers appuyés, répétés ou affectueux; « affectueusement » transmet cette intensité sans imposer le nombre de baisers.
