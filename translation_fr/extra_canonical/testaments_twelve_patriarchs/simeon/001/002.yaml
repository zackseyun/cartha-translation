  text: '*¹Ἀρρωστοῦντος τοῦ Συμεὼν ἦλθον ἐπισκέψασθαι αὐτὸν οἱ υἱοὶ αὐτοῦ¹¹ καὶ¹² ἐνισχύσας ἐκάθισε¹³, καὶ κατεφίλησεν¹⁴ αὐτοὺς καὶ εἶπεν¹⁵.'
