  to: '**Testament de Siméon 3**


    1 Et maintenant, mes enfants, écoutez-moi et gardez-vous de l’esprit d’égarement[a] et de l’envie. 2 Car l’envie domine tout l’esprit de l’être humain et ne lui permet ni de manger, ni de boire, ni de faire quoi que ce soit de bon. 3 Elle l’incite sans cesse à tuer celui qu’on envie. Et tandis que celui qu’on envie ne cesse de s’épanouir, celui qui envie dépérit[b].


    4 Pendant deux ans donc, dans la crainte du Seigneur, j’ai affligé mon âme par le jeûne, et j’ai compris que la délivrance de l’envie vient par la crainte de Dieu. 5 Car si quelqu’un cherche refuge auprès du Seigneur, l’esprit mauvais s’enfuit loin de lui, et son esprit devient léger. 6 Dès lors, il éprouve de la compassion pour celui qu’on envie et pardonne à ceux qui l’aiment[c] ; ainsi, il cesse d’être envieux.'
  rationale: La révision élimine une opposition ajoutée, maintient en 3.6 le présent et l’indétermination du participe grec « celui qui est envié », et affine deux formulations pour une fidélité lexicale et un français plus naturel. Les trois ancres de note sont conservées et leurs notes demeurent adéquatement liées au texte.
