revisions:
- from: '**Testament de Siméon 3**


    1 Et maintenant, mes enfants, écoutez-moi et gardez-vous de l’esprit d’égarement[a] et de l’envie. 2 Car l’envie domine toute la pensée de l’être humain et ne lui permet ni de manger, ni de boire, ni de faire quoi que ce soit de bon. 3 Elle l’incite au contraire sans cesse à tuer celui qu’on envie. Et tandis que celui qu’on envie ne cesse de s’épanouir, celui qui envie dépérit[b].


