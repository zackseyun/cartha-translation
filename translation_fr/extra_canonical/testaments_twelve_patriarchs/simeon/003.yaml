  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
translation:
  language: fr
  text: '**Testament de Siméon 3**


    1 Et maintenant, mes enfants, écoutez-moi et gardez-vous de l’esprit d’égarement[a] et de l’envie. 2 Car l’envie domine tout l’esprit de l’être humain et ne lui permet ni de manger, ni de boire, ni de faire quoi que ce soit de bon. 3 Elle l’incite sans cesse à tuer celui qu’on envie. Et tandis que celui qu’on envie ne cesse de s’épanouir, celui qui envie dépérit[b].


    4 Pendant deux ans donc, dans la crainte du Seigneur, j’ai affligé mon âme par le jeûne, et j’ai compris que la délivrance de l’envie vient par la crainte de Dieu. 5 Car si quelqu’un cherche refuge auprès du Seigneur, l’esprit mauvais s’enfuit loin de lui, et son esprit devient léger. 6 Dès lors, il éprouve de la compassion pour celui qu’on envie et pardonne à ceux qui l’aiment[c] ; ainsi, il cesse d’être envieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esprit d’erreur » ou « esprit de tromperie ». Le grec πλάνη peut évoquer aussi bien la tromperie que le fait de s’égarer dans l’erreur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui qui est envié… celui qui envie ». Le grec souligne fortement le contraste entre la personne visée par l’envie et la personne envieuse.'
    reason: lexical_alternative
  - marker: c
    text: « Ceux qui l’aiment » peut désigner soit ceux qui aiment la personne enviée, soit ceux qui aiment l’homme en train d’être guéri de son envie ; le pronom grec est concis et son référent reste ambigu.
    reason: alternative_reading
lexical_decisions:
- source_word: φυλάξασθε
  choice: gardez-vous
  rationale: L’impératif moyen a une valeur réfléchie et appelle à une vigilance morale active ; « gardez-vous » conserve le ton paternel de l’exhortation.
- source_word: πνεῦμα τῆς πλάνης
  choice: esprit d’égarement
  rationale: πλάνη peut désigner l’erreur, la tromperie ou l’égarement. « Égarement » conserve à la fois l’idée de déviation et celle d’une influence qui induit en erreur.
- source_word: φθόνος
  choice: envie
  rationale: Le terme désigne ici le ressentiment hostile devant le bien d’autrui. « Envie » convient mieux que « jalousie » et reste constant dans tout le passage.
- source_word: κυριεύει πάσης τῆς διανοίας τοῦ ἀνθρώπου
  choice: domine toute la pensée de l’être humain
  rationale: κυριεύει exprime la domination, tandis que διάνοια désigne ici la faculté de penser et de vouloir. Cette formulation maintient la force de l’image sans alourdir le français.
- source_word: ὑποβάλλει
  choice: incite sans cesse
  rationale: Le verbe évoque une suggestion insistante ou une instigation intérieure ; « incite » rend clairement cette pression continue.
- source_word: ἀνελεῖν
  choice: tuer
  rationale: Le verbe exprime ici une issue violente et meurtrière ; « tuer » en préserve la dureté.
- source_word: ἀνθεῖ / μαραίνεται
  choice: s’épanouir / dépérit
  rationale: Ces verbes conservent l’opposition végétale entre floraison et flétrissement tout en étant naturels en français.
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  choice: j’ai affligé mon âme par le jeûne
  rationale: Cette traduction garde la gravité de l’expression ascétique et indique que le jeûne est le moyen employé.
- source_word: λύσις τοῦ φθόνου
  choice: la délivrance de l’envie
  rationale: λύσις évoque le fait d’être délié ou libéré. « Délivrance » exprime naturellement la sortie de l’emprise de l’envie.
- source_word: ἡ διάνοια γίνεται κούφη
  choice: sa pensée devient légère
  rationale: La formulation préserve l’image grecque d’un esprit rendu léger, sans la réduire explicitement à l’apaisement ou au soulagement.
- source_word: παύεται τοῦ φθόνου
  choice: il cesse d’être envieux
  rationale: Cette tournure française rend naturellement la cessation de l’envie sans introduire une idée absente du grec.
theological_decisions:
- issue: Traduction de κύριος et θεός dans un testament juif d’exhortation
  choice: le Seigneur / Dieu
  alternative: le SEIGNEUR / Dieu
  rationale: Le grec emploie κύριος puis θεός sans citation explicite d’un passage scripturaire portant le nom divin. « Le Seigneur » et « Dieu » suivent donc directement les désignations grecques.
- issue: Nature de τὸ πονηρὸν πνεῦμα
  choice: l’esprit mauvais
  alternative: un esprit mauvais ; le penchant mauvais
  rationale: L’article grec présente une expression définie, et le texte décrit le vice comme une puissance spirituelle agissante. La traduction maintient cette tension sans ramener l’expression à une simple métaphore psychologique.
- issue: Référent de αὐτόν en 3.6
  choice: ceux qui l’aiment
  alternative: ceux qui aiment la personne qu’il enviait
  rationale: Le pronom grec est syntaxiquement bref et son antécédent peut être compris comme l’homme guéri de l’envie ou comme la personne auparavant enviée. Le pronom français et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions structurantes autour de l’envie sont conservées, de même que les images de domination, d’épanouissement, de dépérissement et de légèreté de la pensée. « Celui qu’on envie » évite une nominalisation trop abstraite et maintient le parallélisme grec.
