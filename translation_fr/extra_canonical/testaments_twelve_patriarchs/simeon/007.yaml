base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
translation:
  language: fr
  text: 7 Et maintenant, mes enfants, écoutez Lévi et Juda, et ne vous élevez pas au-dessus de ces deux tribus, car d’elles se lèvera pour nous le salut [de Dieu].[a] 2 En effet, le Seigneur suscitera, de Lévi comme grand prêtre et de Juda comme roi, [Dieu et homme].[b] C’est lui qui sauvera [toutes les nations ainsi que][c] la lignée d’Israël.[d] 3 Voilà pourquoi je vous donne ces commandements, afin que vous les transmettiez, vous aussi, à vos enfants, pour qu’ils les gardent au fil de leurs générations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « de Dieu » sont signalés par des signes d’incertitude textuelle dans l’édition grecque utilisée.
    reason: textual_variant
  - marker: b
    text: L’expression « Dieu et homme » figure entre crochets dans le témoin grec, ce qui signale une incertitude textuelle ou un possible ajout ultérieur. Elle est conservée ici sans interprétation doctrinale.
    reason: textual_variant
  - marker: c
    text: Les mots « toutes les nations ainsi que » sont signalés comme incertains dans le témoin grec et pourraient constituer une expansion du texte.
    reason: textual_variant
  - marker: d
    text: Ou « le peuple d’Israël ». Le grec γένος met l’accent sur la parenté, la filiation ou l’appartenance à un même groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούσατε
  choice: écoutez
  rationale: L’impératif appelle une écoute attentive qui entraîne une réponse. « Écoutez » garde le ton direct sans imposer le sens plus absolu d’« obéissez ».
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: ne vous élevez pas au-dessus de
  rationale: Cette formulation conserve l’image de l’auto-exaltation et la relation comparative envers les deux tribus.
- source_word: γενεὰς
  choice: tribus
  rationale: Dans ce contexte, le terme désigne Lévi et Juda en tant que groupes de filiation au sein d’Israël, et non des générations chronologiques.
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  choice: le salut de Dieu
  rationale: La formulation solennelle conserve l’ambiguïté entre l’action salvatrice de Dieu et une éventuelle figure de salut.
- source_word: ἀναστήσει
  choice: suscitera
  rationale: « Susciter » rend naturellement l’idiome prophétique par lequel le Seigneur fait paraître ou établit un dirigeant.
- source_word: ἀρχιερέα
  choice: grand prêtre
  rationale: C’est le titre français usuel qui conserve la précision cultuelle de la fonction.
- source_word: βασιλέα
  choice: roi
  rationale: Le titre royal concret est maintenu sans l’atténuer en « dirigeant ».
- source_word: σώσει
  choice: sauvera
  rationale: Le verbe reprend en français le champ lexical du « salut » employé juste auparavant.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: la lignée d’Israël
  rationale: « Lignée » préserve la nuance de parenté et d’origine commune de γένος tout en évitant les connotations modernes ambiguës de « race ».
- source_word: φυλάξωσιν
  choice: les gardent
  rationale: Dans le contexte de commandements transmis, « garder » exprime à la fois leur conservation et leur mise en pratique.
theological_decisions:
- issue: Expression incertaine τοῦ Θεοῦ après τὸ σωτήριον
  choice: Retenue dans le texte sous la forme « [de Dieu] »
  alternative: Lire simplement « le salut »
  rationale: Les demi-crochets de l’édition signalent une incertitude textuelle. La traduction conserve donc les mots tout en rendant leur statut visible, sans décider silencieusement en faveur de leur authenticité.
- issue: Expression entre crochets Θεὸν καὶ ἄνθρωπον
  choice: Retenue sous la forme littérale « [Dieu et homme] »
  alternative: Omettre l’expression comme ajout secondaire, ou l’interpréter par « à la fois divin et humain »
  rationale: Le témoin grec fourni signale l’incertitude de l’expression. Une traduction littérale entre crochets préserve la tension théologique sans l’harmoniser avec une formulation doctrinale ultérieure.
- issue: Expression entre crochets πάντα τὰ ἔθνη καὶ
  choice: Retenue sous la forme « [toutes les nations ainsi que] »
  alternative: Omettre l’expression comme expansion secondaire, ou traduire ἔθνη par « païens »
  rationale: L’expression est présente mais signalée comme incertaine dans la source. « Nations » laisse ouverte sa portée universelle et les crochets indiquent clairement son statut textuel.
- issue: Référent singulier de οὗτος après les mentions de Lévi et de Juda
  choice: « quelqu’un […] C’est lui »
  alternative: Comprendre deux figures distinctes, un grand prêtre et un roi
  rationale: Le démonstratif singulier οὗτος favorise ici un référent singulier, mais la formulation maintient l’étrange double rattachement à Lévi et à Juda plutôt que de l’expliquer ou de le résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le ton testamentaire et prophétique est conservé sans archaïsmes inutiles. Les crochets dans le corps du texte rendent visibles les incertitudes de l’édition grecque; les notes les expliquent sans trancher au-delà des données disponibles.
