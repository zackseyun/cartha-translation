revisions:
- from: 7 Et maintenant, mes enfants, écoutez Lévi et Juda, et ne vous élevez pas au-dessus de ces deux tribus, car d’elles se lèvera pour nous le salut [de Dieu].[a] 2 En effet, le Seigneur suscitera quelqu’un issu de Lévi comme grand prêtre et de Juda comme roi, [Dieu et homme].[b] C’est lui qui sauvera [toutes les nations ainsi que][c] la lignée d’Israël.[d] 3 Voilà pourquoi je vous donne ces commandements, afin que vous les transmettiez, vous aussi, à vos enfants, pour qu’ils les gardent de génération en génération.
  to: 7 Et maintenant, mes enfants, écoutez Lévi et Juda, et ne vous élevez pas au-dessus de ces deux tribus, car d’elles se lèvera pour nous le salut [de Dieu].[a] 2 En effet, le Seigneur suscitera, de Lévi comme grand prêtre et de Juda comme roi, [Dieu et homme].[b] C’est lui qui sauvera [toutes les nations ainsi que][c] la lignée d’Israël.[d] 3 Voilà pourquoi je vous donne ces commandements, afin que vous les transmettiez, vous aussi, à vos enfants, pour qu’ils les gardent au fil de leurs générations.
  rationale: La révision conserve toutes les ambiguïtés et tous les segments marqués comme incertains par l’édition grecque. Elle évite surtout d’interpréter comme une ascendance double la construction grecque difficile associant Lévi au grand prêtre et Juda au roi, tout en conservant le démonstratif singulier de la phrase suivante. Les notes sont maintenues avec des ancres cohérentes et une description plus exacte du premier signe d’incertitude.
