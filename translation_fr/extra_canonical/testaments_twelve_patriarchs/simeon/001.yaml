base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
translation:
  language: fr
  text: 'Testament de Siméon, deuxième fils de Jacob et de Léa


    1. Copie[a] des paroles de Siméon, qu’il adressa à ses fils avant de mourir, dans la cent vingtième année de sa vie, à l’époque où mourut son frère Joseph. 2. Comme Siméon était malade, ses fils vinrent lui rendre visite. Rassemblant alors ses forces, il se redressa, les couvrit de baisers[b] et dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Relevé des paroles de Siméon. »'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec est intensif et peut évoquer des baisers répétés ou particulièrement affectueux.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Le terme désigne une reproduction écrite ou un relevé. « Copie » conserve le caractère documentaire de l’introduction sans préciser indûment sa nature archivistique.
- source_word: λόγων
  choice: des paroles
  rationale: « Paroles » convient à cette introduction testamentaire et rend le pluriel grec sans transformer celui-ci en discours constitué.
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: avant de mourir
  rationale: Formulation française naturelle qui exprime directement la relation temporelle de la construction grecque.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει
  choice: dans la cent vingtième année de sa vie
  rationale: Cette formulation préserve la notice chronologique solennelle plutôt que de la convertir simplement en âge révolu.
- source_word: ἐν ᾧ χρόνῳ
  choice: à l’époque où
  rationale: La locution conserve le lien temporel explicite entre le cadre de la déclaration de Siméon et la mort de Joseph.
- source_word: Ἀρρωστοῦντος
  choice: Comme Siméon était malade
  rationale: Le génitif absolu fournit la circonstance de la visite. Cette tournure est claire et naturelle en français.
- source_word: ἐπισκέψασθαι
  choice: lui rendre visite
  rationale: Le verbe décrit ici une visite motivée par la maladie et peut porter une nuance de sollicitude que le contexte laisse percevoir.
- source_word: ἐνισχύσας
  choice: Rassemblant alors ses forces
  rationale: Le participe suggère l’effort physique du malade avant qu’il ne se mette en position de parler.
- source_word: ἐκάθισε
  choice: il se redressa
  rationale: Dans ce contexte de maladie et de visite au chevet, le verbe indique vraisemblablement que Siméon se met assis. « Se redressa » exprime naturellement ce mouvement sans ajouter le mot « lit », absent du grec.
- source_word: κατεφίλησεν
  choice: les couvrit de baisers
  rationale: Le composé intensif peut évoquer des baisers répétés ou affectueux. Cette expression française en restitue la force dans la scène familiale.
theological_decisions:
- issue: Notice chronologique reliant les dernières paroles de Siméon à la mort de Joseph
  choice: Conserver explicitement les deux indications chronologiques dans le cadre narratif
  alternative: Considérer la mention de Joseph comme une glose éditoriale ou fondre les indications dans une paraphrase
  rationale: Le témoin grec présente la mention de la mort de Joseph comme partie intégrante de l’introduction. La traduction la maintient donc sans l’omettre ni chercher à harmoniser la chronologie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton testamentaire de l’introduction tout en évitant les calques. La numérotation du chapitre et des versets est explicitée, et tous les appels de notes figurent dans le texte.
