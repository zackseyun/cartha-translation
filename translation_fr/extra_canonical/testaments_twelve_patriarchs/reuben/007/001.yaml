lexical_decisions:
- source_word: ἐντειλάμενος
  choice: après avoir donné ces instructions
  rationale: Le participe aoriste indique ici une action antérieure à la mort de Ruben. « Donner ces instructions » rend naturellement l’idée de prescrire ou d’enjoindre dans ce contexte testamentaire.
- source_word: ταῦτα
  choice: ces instructions
  rationale: Le démonstratif renvoie au contenu des exhortations précédentes; l’explicitation par « instructions » évite en français la tournure moins naturelle « commander ces choses ».
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: à ses fils
  rationale: Équivalent direct et idiomatique du complément grec.
