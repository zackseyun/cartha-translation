  text: Et ils le déposèrent dans un cercueil jusqu’à
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθεντο
  choice: déposèrent
  rationale: Le moyen a ici un sens actif (« placer, déposer »). « Déposèrent » convient naturellement à la mise d’un corps dans un cercueil.
- source_word: σορῷ
  choice: dans un cercueil
  rationale: Dans ce contexte funéraire, σορός désigne un cercueil ou un sarcophage. « Cercueil » est le terme français courant et correspond à la traduction anglaise auditée.
- source_word: ἕως
  choice: jusqu’à
  rationale: La conjonction ouvre une proposition temporelle dont la suite n’est pas conservée dans l’extrait fourni; la traduction garde donc volontairement le fragment inachevé.
