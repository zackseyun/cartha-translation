  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
translation:
  language: fr
  text: Et Ruben mourut[a], après avoir donné ces ordres à ses fils. Ils le déposèrent dans un cercueil jusqu’à ce qu’on le fasse remonter d’Égypte et qu’on l’ensevelisse à Hébron[b], dans la grotte où reposaient ses pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin grec fourni pour ce chapitre est très bref et s’interrompt après « jusqu’à ». La suite de la notice funéraire est une complétion minimale fondée sur le contexte narratif du testament, et non la traduction d’un texte grec complet ici conservé.
    reason: textual_variant
  - marker: b
    text: Hébron et la grotte où reposaient les pères font écho à la tradition de l’ensevelissement des patriarches dans la Genèse.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέθανε
  choice: mourut
  rationale: Le verbe grec désigne simplement la mort; « mourut » le rend directement sans introduire d’euphémisme.
- source_word: ἐντειλάμενος
  choice: après avoir donné ces commandements
  rationale: Le participe exprime une action antérieure à la mort et conserve la force testamentaire de l’injonction.
- source_word: υἱοῖς
  choice: fils
  rationale: Le grec désigne précisément les fils, conformément au cadre patriarcal du testament.
- source_word: ἔθεντο
  choice: déposèrent
  rationale: Dans ce contexte funéraire, « déposèrent » est naturel et digne tout en restant proche du geste exprimé par le grec.
- source_word: σορῷ
  choice: cercueil
  rationale: Le terme désigne ici un contenant funéraire; « cercueil » est le mot moderne le plus clair sans la précision excessive de « sarcophage ».
- source_word: ἕως
  choice: jusqu’à ce que
  rationale: Cette locution conserve la valeur temporelle ouverte de ἕως, mot après lequel le témoin grec fourni s’interrompt.
theological_decisions:
- issue: Traitement du témoin grec très bref et interrompu après ἕως
  choice: Traduire directement le texte conservé, puis compléter minimalement la notice funéraire d’après le contexte narratif transmis, avec une note explicite.
  alternative: Laisser la phrase inachevée après « jusqu’à », ou reconstruire plus largement le passage à partir d’autres témoins.
  rationale: Laisser un fragment nu rendrait le chapitre peu intelligible, tandis qu’une reconstruction étendue dépasserait les données fournies. La formulation retenue distingue par une note ce qui est attesté dans l’extrait grec de ce qui relève de la complétion narrative minimale.
- issue: Portée de « ses pères » dans la notice d’ensevelissement
  choice: Conserver la formule familiale « ses pères » sans préciser davantage les patriarches concernés.
  alternative: Expliciter « ses ancêtres » ou nommer Abraham, Isaac et Jacob.
  rationale: La formulation maintient l’écho traditionnel et son caractère général sans ajouter au texte des identifications absentes de l’extrait.
translation_notes:
  register: Français international moderne, sobre et digne. « Donner ces commandements » garde la tonalité testamentaire; « déposer » et « ensevelir » conviennent à une notice funéraire sans archaïsme marqué. Les deux appels de note figurent dans le texte.
