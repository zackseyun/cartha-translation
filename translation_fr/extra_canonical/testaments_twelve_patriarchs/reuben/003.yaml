    issue: '3.8 : « il détourne son intelligence de la vérité »'
    rationale: Le participe σκοτίζων désigne l’action d’obscurcir ou d’enténébrer l’intelligence, non celle de la détourner. La traduction doit conserver cette image.
  - severity: low
    issue: '3.5–6 : formulation des actes du sixième esprit'
    rationale: Le grec emploie les infinitifs « façonner/inventer des paroles » et « cacher ses paroles » ; une coordination explicite rend mieux la structure. αὐτοῦ appelle aussi « sa propre parenté et sa propre maisonnée ».
  - severity: low
    issue: '3.6 : « l’amour du plaisir de son cœur »'
    rationale: La tournure française est lourde. « Le désir de plaisir de son cœur » conserve φιληδονία tout en étant plus idiomatique.
