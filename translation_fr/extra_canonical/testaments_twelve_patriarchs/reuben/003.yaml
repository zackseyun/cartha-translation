  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003.yaml
  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: fr
  text: '3.1 Outre tous ceux-là, il existe un huitième esprit, l’esprit du sommeil, avec lequel sont créées l’extase de la nature et l’image de la mort.


    3.2 À ces esprits se mêlent les esprits de l’égarement. 3.3 Le premier est l’esprit de l’immoralité sexuelle, qui réside dans la nature et dans les sens. Le deuxième est un esprit d’insatiabilité du ventre. 3.4 Le troisième est un esprit de querelle, dans le foie et dans la bile. Le quatrième est un esprit du désir de plaire et de sorcellerie, afin que, par une curiosité indiscrète, on paraisse séduisant. 3.5 Le cinquième est un esprit d’orgueil, afin qu’on se vante et ait de hautes pensées. Le sixième est un esprit de mensonge, dans la perdition et la jalousie[a], qui invente des paroles et cache ses paroles à sa propre parenté et à sa propre maisonnée. 3.6 Le septième est un esprit d’injustice, auquel s’associent les vols et les actes de cupidité[b], afin de satisfaire le désir de plaisir de son cœur. Car l’injustice collabore avec les autres esprits par les transactions.


    3.7 À tous ceux-là s’ajoute l’esprit du sommeil, qui est le huitième esprit d’égarement et d’illusion. 3.8 C’est ainsi que tout jeune homme court à sa perte : il obscurcit son intelligence loin de la vérité, ne comprend pas la loi de Dieu et n’écoute pas les avertissements de ses pères, comme moi aussi j’en ai souffert dans ma jeunesse.


    3.9 Et maintenant, mes enfants, aimez la vérité, et elle vous gardera. Écoutez les paroles de Ruben, votre père : je vous instruis. 3.10 Ne prêtez pas attention à l’apparence d’une femme, ne fréquentez pas une femme mariée et ne cherchez pas indiscrètement à connaître les affaires des femmes.'
