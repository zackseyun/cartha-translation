lexical_decisions:
- source_word: ἔκστασις φύσεως
  choice: l’extase de la nature
  rationale: Conserve l’expression grecque inhabituelle et son association au sommeil et à l’image de la mort, sans la réduire à une interprétation médicale précise.
- source_word: τῆς πλάνης
  choice: de l’égarement
  rationale: « Égarement » exprime le fait d’être détourné de la vérité tout en restant naturel en français; il convient mieux ici que le seul « erreur » intellectuel.
- source_word: πορνείας
  choice: de l’immoralité sexuelle
  rationale: Terme général et compréhensible qui reflète la portée éthique de πορνεία sans la limiter à la prostitution.
- source_word: ἀπληστείας γαστρός
  choice: d’insatiabilité du ventre
  rationale: Reproduit l’image corporelle et l’idée d’un appétit impossible à rassasier.
- source_word: ἀρεσκείας
  choice: du désir de plaire
  rationale: Rend l’orientation vers l’approbation et la mise en valeur de soi plus clairement que le calque « complaisance ».
- source_word: περιεργείας
  choice: par une curiosité indiscrète
  rationale: Le mot peut désigner une activité déplacée, indiscrète ou excessive; cette formulation convient au contexte d’apparence et anticipe l’emploi apparenté du v. 10.
- source_word: φαντασίας
  choice: d’illusion
  rationale: Préserve la nuance d’apparence mentale trompeuse; « imagination » serait trop neutre dans ce contexte.
- source_word: δοσοληψίας
  choice: par les transactions
  rationale: Le grec signifie littéralement le donner et le recevoir; « transactions » garde l’idée d’échanges sans présumer qu’ils sont tous commerciaux.
- source_word: ὑπάνδρου
  choice: une femme mariée
  rationale: Équivalent idiomatique moderne de la femme qui est sous l’autorité ou liée à un mari.
theological_decisions:
- issue: Nature des « esprits »
  choice: Maintien systématique du mot « esprit »
  alternative: Traduire certains emplois par « disposition », « impulsion » ou « vice »
  rationale: Le grec emploie πνεῦμα de manière répétée et construit une anthropologie dont le statut personnel ou dispositionnel reste ambigu; la traduction ne tranche donc pas.
- issue: Rapport entre sommeil, égarement et illusion au v. 7
  choice: « le huitième esprit d’égarement et d’illusion »
  alternative: « l’esprit du sommeil, lequel est égarement et illusion »
  rationale: La syntaxe transmise est difficile et présente des variantes; le choix suit la lecture structurante la plus cohérente sans identifier dogmatiquement le sommeil lui-même à l’égarement.
- issue: Loi de Dieu
  choice: « la loi de Dieu »
  alternative: « l’enseignement de Dieu »
  rationale: νόμος est conservé comme « loi », sans préciser davantage son étendue ou son statut théologique.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition rhétorique de « le premier… le deuxième… » et le vocabulaire corporel ont été conservés. Les formulations étranges mais significatives (« extase de la nature », localisation dans le foie et la bile) n’ont pas été normalisées selon une psychologie moderne. Les numéros de versets sont ajoutés pour repérage.
