  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: fr
  text: Car un ange de Dieu m’a aussi parlé à leur sujet et m’a enseigné que les femmes se laissent vaincre par l’esprit de l’inconduite sexuelle plus que les hommes. Dans leur cœur, elles trament des choses contre les hommes ; par leurs parures, elles égarent leurs pensées[a] ; par un regard, elles sèment d’abord le poison, puis, par l’acte, elles les font captifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elles égarent les pensées des hommes ». Le référent du pronom grec est ambigu.'
    reason: Préserve l’ambiguïté pronominale réelle tout en indiquant la lecture contextuellement probable.
lexical_decisions:
- source_word: ἡττῶνται
  choice: se laissent vaincre
  rationale: Rend le passif grec de manière naturelle, sans effacer l’idée de défaite ou de domination.
- source_word: τῷ πνεύματι τῆς πορνείας
  choice: par l’esprit de l’inconduite sexuelle
  rationale: « Inconduite sexuelle » exprime largement πορνεία sans le limiter à la prostitution ni à une catégorie moderne plus étroite.
- source_word: μηχανῶνται
  choice: elles trament
  rationale: Conserve l’idée de concevoir secrètement des desseins hostiles.
- source_word: διὰ τῆς κοσμήσεως
  choice: par leurs parures
  rationale: Dans ce contexte, κόσμησις désigne l’ornement ou la mise en beauté ; le pluriel français est idiomatique.
- source_word: τὸν ἰὸν ἐνσπείρουσι
  choice: elles sèment […] le poison
  rationale: Préserve l’image forte et concrète du grec.
- source_word: αἰχμαλωτίζουσιν
  choice: elles les font captifs
  rationale: Maintient la métaphore de la capture plutôt que de l’aplatir en « séduisent ».
theological_decisions:
- issue: Portée de l’affirmation sur les femmes et les hommes
  choice: Conserver l’énoncé comparatif général du texte
  alternative: L’atténuer ou le reformuler comme une observation limitée à certaines personnes
  rationale: Le grec formule explicitement cette comparaison ; la traduction ne doit ni l’approuver par amplification ni la neutraliser.
- issue: Référent de αὐτῶν dans « leurs pensées »
  choice: Maintenir l’ambiguïté dans le texte et la signaler en note
  alternative: Traduire explicitement « les pensées des hommes »
  rationale: La proximité grammaticale permet plusieurs lectures, même si le contexte favorise les pensées des hommes.
- issue: Relation entre πρῶτον et les deux actions finales
  choice: Rattacher « d’abord » à l’action de semer le poison, puis opposer « par l’acte »
  alternative: Ajouter « d’abord en pensée », comme dans la couche anglaise consultative
  rationale: Le texte grec fourni ne contient pas de terme explicite signifiant « pensée » à cet endroit ; l’ajout résoudrait indûment la construction.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la rudesse et la généralisation du texte ancien sans les renforcer. « Inconduite sexuelle » est employé dans un sens large ; « trament » et « font captifs » maintiennent les images du grec.
