base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: fr
  text: Car les femmes sont mauvaises, mes enfants ; et comme elles n’ont ni autorité ni pouvoir sur l’homme, elles usent de ruses par leur apparence afin de l’attirer à elles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραί
  choice: mauvaises
  rationale: Rend directement le jugement moral très dur du grec, sans l’atténuer ni l’amplifier.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Formule d’adresse naturelle et fidèle au pluriel grec.
- source_word: ἐξουσίαν ἢ δύναμιν
  choice: ni autorité ni pouvoir
  rationale: Conserve les deux notions coordonnées et rend naturellement la négation française.
- source_word: ἐπὶ τὸν ἄνδρα
  choice: sur l’homme
  rationale: Respecte l’article défini grec ; dans ce propos généralisant, « l’homme » désigne le partenaire masculin comme catégorie.
- source_word: δολιεύονται
  choice: elles usent de ruses
  rationale: Exprime l’action de recourir à la tromperie ou à la ruse sans surinterpréter un plan particulier.
- source_word: ἐν σχήμασιν
  choice: par leur apparence
  rationale: Dans le contexte, σχήματα renvoie aux formes ou à l’apparence extérieure employées comme moyen.
- source_word: ὅπως αὐτὸν πρὸς ἑαυτὰς ἐπισπάσωνται
  choice: afin de l’attirer à elles
  rationale: Reproduit le but et le mouvement vers elles exprimés par le grec.
theological_decisions:
- issue: Portée du jugement sur les femmes
  choice: 'Conserver la généralisation absolue du texte : « les femmes sont mauvaises »'
  alternative: Atténuer en « certaines femmes » ou contextualiser le jugement dans le corps du verset
  rationale: Le grec formule explicitement une généralisation sans restriction. La traduction doit préserver cette affirmation problématique comme donnée historique du texte, sans l’approuver ni la corriger silencieusement.
- issue: Sens de « l’homme »
  choice: Employer le singulier générique défini
  alternative: Employer « un homme » ou « les hommes »
  rationale: L’article de τὸν ἄνδρα soutient « l’homme » ; cette formulation maintient aussi l’ambiguïté entre l’homme en général et le partenaire masculin visé.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la vigueur polémique et la causalité de l’original tout en évitant un tour inutilement archaïque.
