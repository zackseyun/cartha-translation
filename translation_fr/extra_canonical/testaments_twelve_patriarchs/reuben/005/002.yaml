base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/002.yaml
  text: And the one whom they are not able to enchant by appearance, him they overcome through deceit.
translation:
  language: fr
  text: Et celui qu’elles ne parviennent pas à ensorceler par l’apparence, elles le vainquent par la tromperie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦ σχήματος
  choice: par l’apparence
  rationale: Dans ce contexte, σχῆμα désigne l’aspect extérieur ou la forme visible employée comme moyen de séduction; « apparence » est naturel en français et conserve cette portée.
- source_word: οὐκ ἰσχύουσιν
  choice: ne parviennent pas à
  rationale: Le verbe exprime ici l’incapacité effective; cette tournure française est plus idiomatique que « ne sont pas assez fortes pour ».
- source_word: καταγοητεῦσασθαι
  choice: ensorceler
  rationale: Le verbe évoque le fait de fasciner ou d’envoûter par des moyens trompeurs; « ensorceler » préserve la force de l’image sans en réduire le sens à une simple persuasion.
- source_word: δι᾿ ἀπάτης
  choice: par la tromperie
  rationale: ἀπάτη désigne la duperie ou la fraude; « tromperie » convient au registre et maintient le contraste entre apparence et ruse.
- source_word: καταγωνίζονται
  choice: elles le vainquent
  rationale: Le verbe signifie l’emporter sur quelqu’un, le terrasser ou le vaincre; « vainquent » restitue clairement l’issue du combat figuré.
theological_decisions:
- issue: Référent implicite du sujet féminin pluriel
  choice: Conserver « elles » sans expliciter le référent
  alternative: Nommer les femmes ou les puissances évoquées dans le contexte
  rationale: Le grec porte un sujet pluriel implicite déterminé par le contexte antérieur. L’expliciter dans ce verset introduirait une interprétation absente de la phrase source.
translation_notes:
  register: Français moderne, clair et digne. La reprise disloquée « celui que…, elles le… » conserve l’emphase du grec sur la personne visée tout en restant naturelle.
