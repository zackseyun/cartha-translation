source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: fr
  text: Ainsi donc, mes enfants, fuyez l’immoralité sexuelle, et ordonnez à vos femmes et à vos filles de ne pas orner leurs têtes ni leurs visages dans le but de tromper l’esprit ; car toute femme qui trompe par ces choses est gardée pour un châtiment éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  choice: l’immoralité sexuelle
  rationale: Terme français courant et suffisamment large pour rendre πορνεία sans le limiter au seul adultère ou à la prostitution.
- source_word: κοσμῶσι
  choice: orner
  rationale: Rend directement l’idée de parer ou d’embellir la tête et le visage, dans un registre digne et naturel.
- source_word: πρὸς ἀπάτην διανοίας
  choice: dans le but de tromper l’esprit
  rationale: Conserve la relation de but exprimée par πρός et l’ambiguïté de διάνοια, qui peut désigner l’esprit, la pensée ou l’intelligence.
- source_word: δολιευομένη ἐν τούτοις
  choice: qui use ainsi de tromperie
  rationale: Exprime naturellement le participe moyen et rattache ἐν τούτοις aux pratiques qui viennent d’être mentionnées, sans surinterpréter leur mécanisme.
- source_word: εἰς κόλασιν αἰώνιον τετήρηται
  choice: est gardée pour un châtiment éternel
  rationale: Préserve l’aspect résultatif du parfait τετήρηται et la destination introduite par εἰς.
theological_decisions:
- issue: Portée de πορνεία
  choice: immoralité sexuelle
  alternative: débauche / prostitution
  rationale: Le terme grec possède une portée générale dans ce contexte exhortatif ; une traduction plus étroite imposerait une précision absente du texte.
- issue: Nature de κόλασις αἰώνιος
  choice: châtiment éternel
  alternative: punition éternelle
  rationale: « Châtiment éternel » traduit sobrement l’expression sans préciser la nature ou les modalités du jugement.
- issue: Référent de διανοίας
  choice: l’esprit
  alternative: la pensée / l’intelligence
  rationale: Le génitif grec reste peu explicite quant à la personne dont l’esprit est trompé. La formulation française conserve cette indétermination autant que possible.
translation_notes:
  register: Français international moderne, direct et solennel. L’apostrophe « mes enfants » et l’impératif sont conservés. La formulation évite d’ajouter un sujet masculin à « l’esprit » ou de définir plus précisément la tromperie que ne le fait le grec transmis.
