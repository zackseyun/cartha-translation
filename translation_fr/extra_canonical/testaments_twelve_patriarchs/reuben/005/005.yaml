review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’exhortation à fuir la πορνεία, l’injonction concernant les épouses et les filles, l’ornement de la tête et du visage en vue de la tromperie, et la réserve pour un châtiment éternel sont tous conservés. Toutefois, δολιευομένη ἐν τούτοις est rendu plus directement par « qui trompe par ces choses » que par « qui use ainsi de tromperie », où « ainsi » est moins nettement rattaché aux éléments mentionnés.'
  naturalness: Le français est globalement naturel et de registre convenablement solennel. « Leurs têtes ni leurs visages » respecte mieux les pluriels grecs et sonne plus idiomatiquement dans cette formulation que les singuliers « leur tête ni leur visage ».
  terminology: « Immoralité sexuelle » rend de façon acceptable la portée large de πορνεία. « Châtiment éternel » est une traduction sobre et adéquate de κόλασις αἰώνιος. « Esprit » conserve raisonnablement l’ambiguïté de διανοίας sans en préciser le référent.
  issues:
  - severity: low
    issue: Nombre de « tête » et « visage »
    rationale: Le grec porte les pluriels τὰς κεφαλὰς et τὰς ὄψεις. Le français peut employer le singulier distributif, mais le pluriel préserve plus exactement la formulation source sans nuire au naturel.
  - severity: medium
    issue: Rendu de δολιευομένη ἐν τούτοις
    rationale: « Qui use ainsi de tromperie » exprime l’idée générale, mais « ainsi » ne rend pas explicitement ἐν τούτοις (« par/avec ces choses »), qui renvoie aux ornements précédemment évoqués.
  revised_text: Ainsi donc, mes enfants, fuyez l’immoralité sexuelle, et ordonnez à vos femmes et à vos filles de ne pas orner leurs têtes ni leurs visages dans le but de tromper l’esprit ; car toute femme qui trompe par ces choses est gardée pour un châtiment éternel.
