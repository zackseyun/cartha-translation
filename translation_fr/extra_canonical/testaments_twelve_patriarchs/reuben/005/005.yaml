  rationale: 'La révision conserve le sens et le registre du projet, tout en rétablissant les pluriels explicites du grec et en rendant plus précisément le lien entre la tromperie et « ces choses » (les ornements). Aucune note n’est nécessaire : le texte français préserve l’ambiguïté du génitif διανοίας et n’ajoute aucune interprétation doctrinale.'
