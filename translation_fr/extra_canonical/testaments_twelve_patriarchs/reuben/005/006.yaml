base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: fr
  text: C’est ainsi, en effet, qu’elles séduisirent les Veilleurs avant le déluge. Ceux-ci, en les regardant continuellement, en vinrent eux aussi à les désirer et conçurent cet acte dans leur esprit. Ils se transformaient en hommes et apparaissaient à elles pendant leur union avec leurs maris.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de la dernière phrase est difficile, et ses pronoms sont ambigus. Le verbe rendu par « apparaissaient » peut aussi suggérer qu’ils apparaissaient avec elles ou en leur présence ; la nature de cette apparition n’est pas précisée.
    reason: Signaler l’incertitude réelle concernant συνεφαίνοντο et le rattachement des pronoms, sans imposer une interprétation du phénomène décrit.
lexical_decisions:
- source_word: ἔθελξαν
  choice: séduisirent
  rationale: Le verbe exprime ici une attraction exercée sur les Veilleurs; « séduire » rend naturellement cette idée sans imposer le sens plus étroit d’« ensorceler ».
- source_word: Ἐγρηγόρους
  choice: Veilleurs
  rationale: Terme consacré et transparent pour désigner les êtres appelés « Watchers » dans la littérature juive ancienne; la majuscule signale qu’il s’agit d’un groupe déterminé.
- source_word: ἐπιθυμίᾳ
  choice: à les désirer
  rationale: Rend le désir suscité par le regard continuel; le contexte lui donne une portée sexuelle sans qu’il soit nécessaire de l’expliciter davantage.
- source_word: συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  choice: conçurent cet acte dans leur esprit
  rationale: Conserve l’image de la conception mentale et l’indétermination de πρᾶξις, tout en restant intelligible en français.
- source_word: μετεσχηματίζοντο εἰς ἄνδρα
  choice: prenaient l’apparence d’un homme
  rationale: Exprime un changement d’apparence ou de forme, plutôt qu’une incarnation définie; le singulier grec ἄνδρα est conservé.
- source_word: συνουσίᾳ
  choice: s’unissaient
  rationale: Dans ce contexte, le mot désigne les rapports conjugaux; cette formulation reste digne, claire et non clinique.
- source_word: συνεφαίνοντο
  choice: se manifestaient
  rationale: Rend l’idée d’apparaître ou de devenir visible sans préciser indûment la nature de cette manifestation.
theological_decisions:
- issue: Identité des sujets de μετεσχηματίζοντο et συνεφαίνοντο
  choice: Les Veilleurs sont compris comme ceux qui prennent une apparence humaine et se manifestent aux femmes.
  alternative: Les femmes pourraient être comprises comme changeant d’apparence, si l’on réattribue le sujet implicite.
  rationale: Le sujet grammatical le plus proche et la progression du passage favorisent les Veilleurs; la syntaxe demeure toutefois assez compacte pour justifier une note.
- issue: Nature de l’apparition pendant l’union conjugale
  choice: Le texte décrit une manifestation des Veilleurs aux femmes pendant leur union avec leurs maris.
  alternative: On pourrait comprendre une apparition conjointe ou une présence associée aux maris, selon la portée de συν- et les rattachements pronominaux.
  rationale: Cette lecture suit la construction la plus cohérente et la consultation anglaise auditée, sans expliquer le mécanisme de l’événement ni trancher sa nature physique, mentale ou visionnaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition logique (« aussi », « eux aussi ») du grec tout en évitant une syntaxe artificiellement calquée. Le vocabulaire ne précise ni la catégorie ontologique des Veilleurs ni la nature exacte de leur manifestation.
