  verdict: revise
  source_fidelity: 'La traduction suit globalement le grec : les femmes attirent les Veilleurs, le regard répété suscite le désir, puis ceux-ci conçoivent l’acte et se transforment avant d’apparaître aux femmes. Toutefois, « aussi » dans la première phrase n’est pas porté par le texte grec fourni et doit être retiré. La dernière proposition reste syntaxiquement ambiguë, particulièrement à cause de συνεφαίνοντο et des pronoms ; une note est donc justifiée.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « En les regardant continuellement » rend plus directement συνεχῶς que « à force de les regarder ». « Se transformaient en hommes » est plus proche de μετεσχηματίζοντο que « prenaient l’apparence d’un homme », sans rendre le français lourd.
  terminology: « Veilleurs » est le terme français établi pour Ἐγρήγοροι. « Désirer », « conçurent cet acte dans leur esprit » et « union avec leurs maris » conservent la retenue et l’indétermination du grec. La formulation révisée ne précise pas la nature de la transformation ni de l’apparition.
  issues:
