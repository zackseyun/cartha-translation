revisions:
- from: C’est ainsi, en effet, qu’elles séduisirent aussi les Veilleurs avant le déluge. Ceux-ci, à force de les regarder, en vinrent eux aussi à les désirer et conçurent cet acte dans leur esprit. Ils prenaient en effet l’apparence d’un homme et se manifestaient à elles pendant qu’elles s’unissaient à leurs maris.[a]
  to: C’est ainsi, en effet, qu’elles séduisirent les Veilleurs avant le déluge. Ceux-ci, en les regardant continuellement, en vinrent eux aussi à les désirer et conçurent cet acte dans leur esprit. Ils se transformaient en hommes et apparaissaient à elles pendant leur union avec leurs maris.[a]
  rationale: 'Révision limitée : suppression d’un « aussi » non exprimé dans le grec, rendu plus direct de l’action continue du regard et de la transformation, et note reformulée pour conserver l’ambiguïté de la dernière proposition. Le sens du passage et son registre demeurent inchangés.'
