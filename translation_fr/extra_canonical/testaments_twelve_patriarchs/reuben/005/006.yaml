    issue: « aussi » dans la première phrase
    rationale: Le grec cité porte Οὕτως γὰρ ἔθελξαν, sans καί ou autre élément correspondant à « aussi ». Le second « eux aussi » est en revanche justifié par κἀκεῖνοι.
  - severity: low
    issue: Rendu de μετεσχηματίζοντο
    rationale: « Prenaient l’apparence » peut affaiblir le verbe de transformation. « Se transformaient en hommes » rend plus directement le changement exprimé, tout en comprenant le singulier ἄνδρα dans un sens distributif naturel en français.
  - severity: low
    issue: Formulation de la note sur συνεφαίνοντο
    rationale: La note doit signaler l’ambiguïté sans présenter comme strictement littérale une paraphrase qui tranche déjà la valeur de συν-. La formulation révisée explicite sobrement les deux possibilités principales.
