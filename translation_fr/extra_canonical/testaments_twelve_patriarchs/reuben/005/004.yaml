  text: Οὐ γὰρ τὰς. δύναται γυνὴ *ἄνδρα βιάσαι εἰς πρόσωπον ἀλλ᾽ ἐν σχήματι β, Α, S¹ πορνικοῖς τοῦτον πανουργεύεται⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/004.yaml
  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: fr
  text: Car une femme ne peut contraindre un homme ouvertement ; mais, sous une apparence de prostituée, elle agit avec ruse contre lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιάσαι
  choice: contraindre
  rationale: Rend l’idée de recourir à la force ou à la contrainte sans préciser davantage la nature de celle-ci.
- source_word: εἰς πρόσωπον
  choice: ouvertement
  rationale: L’expression signifie littéralement « en face » ou « devant le visage » ; dans ce contexte, elle oppose l’action directe aux manœuvres rusées.
- source_word: ἐν σχήματι … πορνικοῖς
  choice: par des attitudes de prostituée
  rationale: « Attitudes » rend σχήμα, qui peut désigner la manière extérieure, l’allure ou le comportement ; « de prostituée » conserve le caractère explicitement sexuel et dépréciatif de πορνικός.
- source_word: πανουργεύεται
  choice: elle use de ruse contre lui
  rationale: Conserve à la fois l’idée d’une conduite rusée et son orientation hostile ou manipulatrice envers l’homme.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la généralisation et la tension morale du texte sans l’atténuer ni lui ajouter une interprétation confessionnelle. La ponctuation met en relief l’opposition entre contrainte ouverte et manœuvre indirecte.
