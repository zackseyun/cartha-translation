source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: fr
  text: Et ces femmes aussi, désirant en pensée l’apparence des Veilleurs, donnèrent naissance à des géants. Car les Veilleurs leur semblaient atteindre le ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖναι
  choice: Et ces femmes aussi
  rationale: Le démonstratif féminin pluriel renvoie aux femmes déjà évoquées; « aussi » rend la nuance additive de καί.
- source_word: τῇ διανοίᾳ
  choice: en pensée
  rationale: Expression française naturelle qui conserve l’idée d’un désir situé dans l’esprit ou la faculté mentale.
- source_word: τῆς φαντασίας αὐτῶν
  choice: leur apparence
  rationale: Dans ce contexte, φαντασία désigne vraisemblablement l’apparence ou la manifestation des Veilleurs; le possessif conserve la référence de αὐτῶν sans surcharge.
- source_word: ἔτεκον γίγαντας
  choice: donnèrent naissance à des géants
  rationale: Rend explicitement le sens obstétrical de τίκτω tout en gardant le terme traditionnel « géants ».
- source_word: οἱ Ἐγρήγοροι
  choice: les Veilleurs
  rationale: Équivalent français établi du titre angélique « ceux qui veillent »; la majuscule signale ici un groupe désigné.
- source_word: ἕως ... τοῦ οὐρανοῦ φθάνοντες
  choice: atteignant jusqu’au ciel
  rationale: Conserve l’image de personnages dont la stature ou l’apparition semble parvenir au ciel; « jusqu’à » rend la limite exprimée.
theological_decisions:
- issue: Nature de la conception des géants
  choice: Conserver le lien entre désir mental, apparence des Veilleurs et naissance sans expliquer le mécanisme
  alternative: Présenter explicitement une union physique ou une conception purement imaginaire
  rationale: Le grec formule une relation énigmatique et théologiquement tendue; la traduction ne doit pas trancher ce que le texte laisse inexpliqué.
- issue: Statut des Veilleurs
  choice: Employer le titre « Veilleurs » sans les identifier davantage
  alternative: Les qualifier d’anges déchus ou d’esprits
  rationale: Le passage les nomme mais ne précise pas ici leur nature ni leur statut moral.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du grec tout en évitant le calque lourd « dans leur intelligence ». L’imparfait « apparaissaient » rend naturellement l’aspect descriptif de Ἐφαίνοντο.
