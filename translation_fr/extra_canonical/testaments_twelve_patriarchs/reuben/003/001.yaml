base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: fr
  text: 'À tout cela s’ajoute un huitième esprit : l’esprit du sommeil, avec lequel furent créées l’extase[a] de la nature et l’image de la mort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἔκστασις peut évoquer une sortie de l’état ordinaire ou un état de stupeur; il ne désigne pas nécessairement une expérience mystique.
    reason: Éclaire le sens large du terme grec et évite que le sens moderne, souvent mystique, d’« extase » ne fixe indûment l’interprétation.
lexical_decisions:
- source_word: Ἐπὶ πᾶσιν δὲ τούτοις
  choice: En plus de tous ceux-là
  rationale: Rend l’idée d’ajout exprimée par ἐπὶ… δέ, tout en laissant « ceux-là » renvoyer naturellement aux esprits déjà énumérés.
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  choice: 'un huitième esprit : l’esprit du sommeil'
  rationale: La reprise explicative après les deux-points restitue naturellement en français la construction grecque et concorde avec le contexte d’une série d’esprits.
- source_word: ἔκστασις φύσεως
  choice: l’extase de la nature
  rationale: Conserve la formulation inhabituelle et l’ambiguïté du grec plutôt que de la réduire à l’inconscience ou au sommeil; une note prévient le seul sens mystique que « extase » pourrait suggérer aujourd’hui.
- source_word: εἰκὼν τοῦ θανάτου
  choice: l’image de la mort
  rationale: Équivalent direct et naturel qui préserve la comparaison implicite entre le sommeil et la mort.
theological_decisions:
- issue: Nature exacte de l’« extase de la nature »
  choice: Maintenir l’expression sans identifier précisément l’état décrit
  alternative: Traduire par « suspension de la nature », « perte de conscience naturelle » ou « sortie de la nature hors d’elle-même »
  rationale: Le grec ἔκστασις φύσεως est sémantiquement ouvert. Le contexte l’associe au sommeil et à l’image de la mort, mais ne justifie pas une définition physiologique ou théologique plus précise.
- issue: Rapport de l’esprit du sommeil à l’extase et à l’image de la mort
  choice: « Avec lui furent créées »
  alternative: « Par lui furent créées »
  rationale: μεθ’ οὗ exprime l’accompagnement (« avec lequel/lui »), non sans ambiguïté une causalité instrumentale; la traduction évite donc d’attribuer explicitement à cet esprit le rôle d’agent créateur.
translation_notes:
  register: Français moderne, sobre et digne. La phrase est divisée en deux pour la clarté, sans modifier les relations logiques du grec. Le passé simple « furent créées » convient au registre narratif et rend l’aoriste passif ἐκτίσθη.
