source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 10. Μὴ⁷¹ προσέχετε⁷² ὄψει⁷³ γυναικείᾳ⁷⁴ α ὄψιν. μήτε⁷⁵ συνδιάζετε⁷⁶ μετὰ *θηλείας ὑπάνδρου⁷⁷ μήτε⁷⁸ περιεργάζεσθε⁷⁹ πρᾶξιν⁸⁰ γυναικῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/010.yaml
  text: Do not look at a woman's appearance, nor associate with a married woman, nor pry into the affairs of women.
translation:
  language: fr
  text: Ne prêtez pas attention à l’apparence d’une femme; ne fréquentez pas non plus une femme mariée et ne vous mêlez pas des affaires des femmes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε … ὄψιν
  choice: fixez votre attention sur l’apparence
  rationale: Cette formulation exprime l’attention délibérée portée à l’aspect visible, plutôt qu’un simple regard fortuit.
- source_word: συνδιάζετε
  choice: vous liez
  rationale: Le verbe évoque ici le fait de fréquenter ou de s’associer étroitement à quelqu’un; «vous liez» reste naturel tout en conservant la portée relationnelle du grec.
- source_word: θηλείας ὑπάνδρου
  choice: une femme mariée
  rationale: ὑπάνδρου désigne littéralement une femme «sous l’autorité d’un mari», c’est-à-dire mariée; la traduction française courante évite un littéralisme archaïque.
- source_word: περιεργάζεσθε πρᾶξιν γυναικῶν
  choice: vous mêlez des affaires des femmes
  rationale: Le grec condamne une curiosité indiscrète ou une ingérence dans ce que font les femmes; cette expression française rend naturellement cette idée.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et exhortatif. Le parallélisme ternaire du grec est conservé, sans renforcer l’interdit au-delà de sa formulation ni atténuer son caractère direct.
