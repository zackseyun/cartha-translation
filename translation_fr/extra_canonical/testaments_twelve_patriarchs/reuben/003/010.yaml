  naturalness: La formulation actuelle est compréhensible, mais « Ne prêtez pas attention à l’apparence d’une femme » et « ne fréquentez pas ... une femme mariée » sont plus naturels en français moderne international, tout en gardant le ton exhortatif.
  terminology: « Femme mariée » rend correctement ὑπάνδρου. « Affaires des femmes » rend de façon acceptable πρᾶξιν γυναικῶν et conserve la généralité, sans imposer une interprétation plus précise de la nature de ces affaires.
