  text: With these spirits are mixed the spirits of error.
translation:
  language: fr
  text: À ces esprits se mêlent les esprits de l’égarement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμμίγνυται
  choice: se mêlent
  rationale: Rend naturellement en français l’idée d’association ou de mélange exprimée par le verbe grec, tout en respectant son accord avec le sujet neutre pluriel.
- source_word: τῆς πλάνης
  choice: de l’égarement
  rationale: « Égarement » conserve la portée de πλάνη, qui peut désigner le fait de s’écarter de la vérité ou d’être induit en erreur, sans réduire le sens à une simple erreur intellectuelle.
theological_decisions:
- issue: Nature des « esprits de l’égarement »
  choice: Conserver l’expression sans préciser s’il s’agit d’entités spirituelles, de dispositions ou de forces morales.
  alternative: Traduire ou expliciter par « esprits trompeurs » ou « mauvais penchants ».
  rationale: Le grec ne résout pas ici cette question; une explicitation imposerait une interprétation théologique absente du verset.
translation_notes:
  register: Français moderne, sobre et dignifié. La tournure « À ces esprits se mêlent… » garde l’ordre relationnel du grec tout en restant naturelle.
