  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’injustice est le septième esprit et elle est associée aux vols, à des pratiques cupides, et aux autres esprits. Toutefois, « afin d’assouvir l’amour du plaisir dans le cœur » ne rend pas clairement la relation, déjà textuellement difficile, entre φιληδονία et καρδίας ; « dans le cœur » introduit une localisation qui n’est pas établie. La révision conserve l’ambiguïté sans ajouter cette relation.'
  naturalness: Le registre est globalement moderne et approprié. La proposition finale de la première phrase est toutefois peu idiomatique et difficile à comprendre en français. « afin de satisfaire les plaisirs du cœur » est plus lisible tout en restant prudent face au grec perturbé.
  terminology: « injustice », « vols », « cupidité », « autres esprits » et « transactions » conviennent. La note sur δοσοληψία utilement maintient le sens littéral et l’extension commerciale possible.
