  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: fr
  text: 6 Le septième est l’esprit d’injustice, accompagné de vols et d’actes de cupidité, afin de satisfaire les plaisirs du cœur.[a] Car l’injustice collabore avec les autres esprits au moyen des transactions.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette proposition est incertain et syntaxiquement difficile; on peut aussi comprendre: «afin de satisfaire le désir de son cœur».'
    reason: Signaler la difficulté textuelle touchant ἐμπλήσει, ποιήσῃ et αὐτοῦ, sans déterminer avec une certitude excessive l’agent, le possesseur ou la construction exacte.
  - marker: b
    text: 'Littéralement: «par le donner et le recevoir»; l’expression peut désigner les échanges commerciaux.'
    reason: Préserver l’étendue de sens de δοσοληψία, plus large que le seul «achat et vente».
lexical_decisions:
- source_word: ἀδικίας
  choice: d’injustice
  rationale: Rend directement le nom grec, qui désigne ici le tort moral et les pratiques injustes.
- source_word: γρηπίσματα
  choice: actes de cupidité
  rationale: Le terme rare évoque des actes rapaces ou avides; cette formulation naturelle conserve l’idée d’une cupidité mise en pratique.
- source_word: φιληδονίαν
  choice: l’amour du plaisir
  rationale: Traduction transparente de l’idée littérale d’attachement ou d’amour pour le plaisir, sans la réduire à la seule sensualité sexuelle.
- source_word: συνεργεῖ
  choice: collabore avec
  rationale: Conserve l’idée que l’injustice agit conjointement avec les autres esprits.
- source_word: δοσοληψίας
  choice: transactions
  rationale: Le mot désigne littéralement le fait de donner et recevoir et, par extension, les échanges ou affaires; «transactions» convient au contexte sans imposer exclusivement l’achat et la vente.
theological_decisions:
- issue: Agent et finalité dans la proposition introduite par ἵνα
  choice: 'Formulation impersonnelle: «afin d’assouvir l’amour du plaisir dans le cœur»'
  alternative: «afin qu’il assouvisse l’amour du plaisir de son cœur»
  rationale: Le texte transmis de la proposition est grammaticalement perturbé et comporte des variantes. La formulation retenue préserve le lien final sans identifier avec une certitude excessive l’agent ni le possesseur du cœur.
- issue: Relation entre l’injustice et les autres esprits
  choice: «collabore avec les autres esprits»
  alternative: «agit avec les esprits restants»
  rationale: La traduction conserve la coopération explicite du grec sans développer une hiérarchie ou une doctrine particulière des esprits.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’énumération sentencieuse du passage tout en explicitant sobrement les difficultés du grec dans les notes.
