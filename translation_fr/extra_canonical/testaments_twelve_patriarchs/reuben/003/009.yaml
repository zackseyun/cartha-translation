  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: fr
  text: Et maintenant, mes enfants, aimez la vérité, et elle vous gardera. Écoutez les paroles de Ruben, votre père, tandis que je vous instruis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀλήθειαν ἀγαπᾶτε
  choice: aimez la vérité
  rationale: Rend directement l’impératif grec et conserve la vérité comme objet explicite de l’amour.
- source_word: φυλάξει ὑμᾶς
  choice: elle vous gardera
  rationale: « Gardera » respecte le sens de protection ou de préservation de φυλάσσω sans préciser un danger absent du texte.
- source_word: Ἀκούσατε λόγους Ῥουβὴμ
  choice: Écoutez les paroles de Ruben
  rationale: Formulation française naturelle qui suit l’impératif et l’expression grecque, sans ajouter d’article possessif.
- source_word: διδάσκω ὑμᾶς
  choice: tandis que je vous instruis
  rationale: Le grec transmis présente une syntaxe difficile; cette formulation rattache clairement le verbe à Ruben parlant à ses enfants, conformément au sens probable, sans effacer entièrement la transition abrupte.
