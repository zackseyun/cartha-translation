  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: fr
  text: Cinquièmement, un esprit d’orgueil, afin qu’on se vante et qu’on ait de hautes prétentions. Sixièmement, un esprit de mensonge, dans la ruine et la jalousie,[a] pour fabriquer des paroles et cacher ses paroles à sa parenté et aux gens de sa maison.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de l’expression « dans la ruine et la jalousie » est incertain; son lien exact avec ce qui précède ou ce qui suit demeure difficile à établir.
    reason: Signaler l’incertitude textuelle explicitement marquée dans l’édition source, sans résoudre la relation syntaxique.
  - marker: b
    text: 'Littéralement : « cacher ses paroles à sa parenté et aux gens de sa maison »; le texte grec présente aussi une incertitude autour du possessif.'
    reason: Rendre la portée la plus naturelle du possessif après λόγους, tout en signalant la difficulté textuelle, et distinguer γένος de οἰκεῖοι.
lexical_decisions:
- source_word: ὑπερηφανείας
  choice: orgueil
  rationale: Équivalent français naturel et direct, adapté à l’énumération des esprits.
- source_word: καυχᾶται
  choice: se vanter
  rationale: Rend clairement l’idée de tirer gloire de soi ou de se glorifier.
- source_word: μεγαλοφρονῇ
  choice: nourrir de hautes pensées
  rationale: Préserve l’image d’une pensée élevée ou démesurée sans préciser à tort s’il s’agit seulement d’arrogance.
- source_word: ψεύδους
  choice: mensonge
  rationale: Traduction directe du substantif grec.
- source_word: πλάττειν λόγους
  choice: fabriquer des paroles
  rationale: Conserve l’image de façonner ou inventer des propos; « fabriquer » suggère ici leur caractère trompeur sans réduire λόγους à de simples mots.
- source_word: κρύπτειν λόγους
  choice: cacher des paroles
  rationale: Rendu formel qui préserve la répétition de λόγους et l’ambiguïté entre propos et informations.
- source_word: γένους καὶ οἰκείων
  choice: sa famille et ses proches
  rationale: Distingue le groupe familial ou la parenté des personnes de la maison ou de l’entourage proche, dans un français naturel.
theological_decisions:
- issue: Lien syntaxique de ἵνα avec les comportements décrits
  choice: « qui pousse à »
  alternative: « afin qu’il se vante… »
  rationale: Exprime naturellement la fonction attribuée à chaque esprit, sans identifier plus précisément le sujet humain implicite.
- issue: Texte corrompu ou incertain autour de ἐν ἀπωλείᾳ καὶ ζήλῳ
  choice: Maintien littéral dans le texte avec note
  alternative: Réordonner ou interpréter la formule comme « menant à la ruine et à la jalousie »
  rationale: Le passage est signalé comme textuellement douteux; il convient de préserver sa tension plutôt que de reconstruire silencieusement son sens.
- issue: Référent du possessif associé à αὐτοῦ
  choice: Possessif implicite rendu par « sa »
  alternative: « de sa propre famille » ou omission du possessif
  rationale: Le texte transmis comporte une difficulté à cet endroit; le rendu garde le sens probable sans surcharger la formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure numérotée et le parallélisme sont conservés. Les formulations explicatives restent limitées afin de ne pas résoudre les ambiguïtés du texte grec.
