revisions:
- from: Cinquièmement, un esprit d’orgueil, qui pousse à se vanter et à nourrir de hautes pensées. Sixièmement, un esprit de mensonge, dans la ruine et la jalousie,[a] qui pousse à fabriquer des paroles et à cacher des paroles à sa famille et à ses proches.[b]
  to: Cinquièmement, un esprit d’orgueil, afin qu’on se vante et qu’on ait de hautes prétentions. Sixièmement, un esprit de mensonge, dans la ruine et la jalousie,[a] pour fabriquer des paroles et cacher ses paroles à sa parenté et aux gens de sa maison.[b]
  rationale: La révision corrige principalement la portée du possessif dans la dernière proposition et améliore le rendu de μεγαλοφρονῇ. Elle maintient la structure énumérative, la répétition de λόγους, ainsi que l’ambiguïté textuelle et syntaxique de la formule encadrée par des signes critiques dans l’édition grecque.
