  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: fr
  text: Troisièmement, un esprit de querelle dans le foie et dans la bile. Quatrièmement, un esprit de désir de plaire et de pratiques magiques, afin que, par une curiosité indiscrète, on paraisse beau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάχης
  choice: querelle
  rationale: Le génitif désigne ici la lutte ou le conflit. « Querelle » exprime naturellement une disposition conflictuelle sans imposer l’idée plus précise d’un combat physique.
- source_word: ἥπατι
  choice: foie
  rationale: Traduction anatomique directe de ἧπαρ, en conservant la localisation corporelle donnée par le texte.
- source_word: χόλῃ
  choice: bile
  rationale: Traduction littérale qui préserve l’imagerie physiologique ancienne et son association possible avec la colère.
- source_word: ἀρεσκείας
  choice: désir de plaire
  rationale: Le nom peut exprimer la complaisance, le fait de chercher à plaire ou de se rendre agréable. Cette formulation française est claire et garde cette orientation sans la réduire au seul étalage de soi.
- source_word: μαγγανείας
  choice: pratiques magiques
  rationale: Le terme renvoie à la magie, aux artifices ou aux enchantements. « Pratiques magiques » est intelligible et évite le sens plus étroit de « sorcellerie ».
- source_word: περιεργείας
  choice: curiosité indiscrète
  rationale: Le mot peut évoquer une activité déplacée, une ingérence curieuse ou des pratiques occultes. Dans cette phrase, « curiosité indiscrète » conserve l’idée de s’occuper abusivement de ce qui dépasse son rôle.
- source_word: ὡραῖος ὀφθῇ
  choice: on paraisse séduisant
  rationale: ὡραῖος signifie beau, attrayant ou dans la fleur de l’âge, tandis que ὀφθῇ marque l’apparence aux yeux d’autrui. « Paraisse séduisant » rend ensemble ces deux éléments.
theological_decisions:
- issue: Nature des « esprits » énumérés
  choice: Conserver « esprit » sans préciser s’il s’agit d’une entité personnelle ou d’une disposition intérieure.
  alternative: Traduire par « tendance » ou expliciter « esprit mauvais ».
  rationale: Le grec πνεῦμα permet ici plusieurs lectures dans le cadre de l’énumération. L’explicitation trancherait une ambiguïté que le texte ne résout pas à ce verset.
- issue: Portée de μαγγανείας
  choice: Employer le terme général « pratiques magiques ».
  alternative: « sorcellerie », « enchantement » ou « artifice ».
  rationale: Le choix retenu préserve la dimension occulte probable sans importer une catégorie confessionnelle ou juridique plus précise.
translation_notes:
  register: Français moderne international, digne et accessible. La structure ordinale et le parallélisme du grec sont conservés. L’imagerie corporelle ancienne reste littérale, tandis que les noms abstraits sont rendus par des expressions françaises naturelles.
