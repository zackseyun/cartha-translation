source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 3. Πρῶτον¹² *τὸ τῆς πορνείας πνεῦμα¹³ ἐν τῇ φύσει¹⁴ καὶ¹⁵ *ταῖς αἰσθήσεσιν¹⁶ ἔγκειται¹⁷. *Δεύτερον πνεῦμα¹⁸ ἀπλη- στείας¹⁹ γαστρός²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: fr
  text: Premièrement, l’esprit de l’immoralité sexuelle réside dans la nature et dans les sens. Deuxièmement, un esprit d’avidité du ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Rend le sens large de πορνεία sans le limiter à la prostitution ni à l’adultère.
- source_word: ἐν τῇ φύσει
  choice: dans la nature
  rationale: Conserve la formulation grecque et son ambiguïté quant à la nature humaine ou à la disposition naturelle.
- source_word: ταῖς αἰσθήσεσιν
  choice: dans les sens
  rationale: Équivalent français naturel qui désigne les facultés sensorielles.
- source_word: ἔγκειται
  choice: réside
  rationale: Exprime l’idée d’être situé ou implanté en quelque chose, dans un registre digne et courant.
- source_word: ἀπληστείας γαστρός
  choice: gloutonnerie
  rationale: Littéralement « avidité du ventre »; « gloutonnerie » rend naturellement en français l’appétit corporel excessif visé ici.
theological_decisions:
- issue: Portée de φύσις
  choice: nature
  alternative: constitution naturelle
  rationale: Le terme grec reste ouvert; la traduction littérale évite de trancher entre constitution humaine, disposition innée et nature corporelle.
- issue: Statut du second πνεῦμα
  choice: l’esprit de la gloutonnerie
  alternative: un esprit d’avidité du ventre
  rationale: L’article est absent en grec devant πνεῦμα, mais la construction énumérative (« premièrement… deuxièmement… ») identifie le deuxième élément de la série; l’article défini est naturel en français sans imposer qu’il s’agisse d’un être spirituel distinct.
translation_notes:
  register: Français moderne, clair et digne. La structure elliptique du second membre grec est légèrement régularisée en français, tout en conservant le parallélisme de l’énumération.
source_grounding:
  english_pob_role: consult_only
