  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: fr
  text: 7 À tout cela s’ajoute l’esprit du sommeil, qui est égarement et le huitième de l’imagination.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de la fin du verset est elliptique et probablement altéré. On pourrait aussi comprendre : « qui est le huitième esprit d’égarement et d’illusion ».'
    reason: Signaler une difficulté textuelle et syntaxique réelle, tout en conservant dans le texte principal l’ordre et l’ambiguïté de la forme grecque transmise.
lexical_decisions:
- source_word: Ἐπὶ πᾶσι δὲ τούτοις
  choice: À tous ceux-là
  rationale: Exprime naturellement l’idée que l’esprit du sommeil vient s’ajouter à tous les éléments précédemment mentionnés, sans alourdir la phrase.
- source_word: τὸ πνεῦμα τοῦ ὕπνου
  choice: l’esprit du sommeil
  rationale: Traduction directe qui conserve le vocabulaire et la personnification du grec.
- source_word: συνάπτεται
  choice: se joint
  rationale: Rend la valeur moyenne/passive du verbe et l’idée d’association ou d’ajout.
- source_word: πλάνης
  choice: égarement
  rationale: Le terme peut désigner l’erreur, l’illusion ou l’égarement; « égarement » préserve ici sa portée morale et cognitive.
- source_word: φαντασίας
  choice: de l’imagination
  rationale: Rend le génitif grec sans le réduire arbitrairement à une simple illusion; le mot peut évoquer l’imagination, l’apparence ou la représentation mentale.
theological_decisions:
- issue: Rapport entre l’esprit du sommeil, l’égarement et le « huitième »
  choice: 'Conserver la construction elliptique: « qui est égarement et le huitième de l’imagination »'
  alternative: « qui est le huitième esprit d’égarement et d’illusion »
  rationale: Le grec transmis ne dit pas explicitement « huitième esprit » et présente une syntaxe difficile. La traduction ne réorganise donc pas les termes en une taxonomie théologique plus nette que le texte source.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation inhabituelle de la dernière proposition est maintenue afin de ne pas résoudre silencieusement l’ellipse du grec.
