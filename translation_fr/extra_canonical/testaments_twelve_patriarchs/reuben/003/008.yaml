base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: fr
  text: 'Et c’est ainsi que tout jeune homme va à sa perte : il obscurcit son intelligence et l’éloigne de la vérité, ne comprenant pas la loi de Dieu et n’écoutant pas les avertissements de ses pères, comme moi aussi j’ai souffert dans ma jeunesse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλλυται
  choice: court à sa perte
  rationale: Le moyen/passif peut exprimer le fait de périr ou de se perdre. Cette tournure naturelle conserve l’idée d’une ruine progressive sans préciser indûment si elle est physique, morale ou spirituelle.
- source_word: σκοτίζων τὸν νοῦν αὐτοῦ ἀπὸ τῆς ἀληθείας
  choice: il détourne son esprit de la vérité
  rationale: 'Le grec transmis est textuellement difficile : σκοτίζων signifie littéralement « obscurcissant », tandis que ἀπὸ τῆς ἀληθείας marque l’éloignement de la vérité. La formulation française rend le mouvement intellectuel et moral sans produire l’expression peu naturelle « obscurcir loin de ».'
- source_word: συνιὼν ἐν τῷ νόμῳ τοῦ θεοῦ
  choice: comprend […] la loi de Dieu
  rationale: Le participe συνιὼν exprime l’intelligence ou la compréhension. La préposition ἐν peut suggérer « dans le cadre de » ou « au sujet de » ; en français courant, le complément direct restitue naturellement le sens.
- source_word: νουθεσίας πατέρων αὐτοῦ
  choice: les avertissements de ses pères
  rationale: νουθεσία désigne une admonestation, une mise en garde ou une instruction corrective. « Avertissements » convient au contexte moral et garde le pluriel collectif « pères ».
- source_word: ἐν τῷ νεωτερισμῷ μου
  choice: dans ma jeunesse
  rationale: Dans ce contexte, le terme renvoie à l’état ou aux égarements propres à la jeunesse. « Dans ma jeunesse » est idiomatique et concorde avec πᾶς νεώτερος.
theological_decisions:
- issue: Nature de la « perte » du jeune homme
  choice: Ne pas définir cette perte comme damnation, mort physique ou simple échec moral
  alternative: « est damné », « meurt » ou « se corrompt »
  rationale: ἀπόλλυται a une portée large et le verset ne tranche pas explicitement la nature ultime de la ruine évoquée.
- issue: Portée de « la loi de Dieu »
  choice: Conserver l’expression générale « la loi de Dieu »
  alternative: L’identifier explicitement à la Torah mosaïque ou à une règle morale particulière
  rationale: Le texte grec ne fournit ici aucune précision justifiant une identification confessionnelle ou historique plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression du grec — perte, éloignement de la vérité, incompréhension de la loi, refus des avertissements, témoignage personnel — tout en allégeant la chaîne participiale pour une lecture naturelle.
