  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005.yaml
  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
translation:
  language: fr
  text: 1. Car les femmes sont mauvaises, mes enfants ; et comme elles n’ont ni autorité ni pouvoir sur l’homme, elles usent de ruse par leur apparence[a] afin de l’attirer à elles. 2. Celui qu’elles ne parviennent pas à ensorceler par leur apparence, elles le dominent par la tromperie. 3. En effet, un ange de Dieu m’a aussi parlé d’elles et m’a enseigné que les femmes sont vaincues par l’esprit de l’immoralité sexuelle plus que l’homme. Dans leur cœur, elles élaborent des desseins contre les hommes ; par leurs parures, elles égarent leurs pensées et, par leur regard, elles sèment le poison ; elles les rendent d’abord captifs, puis par l’acte. 4. Car une femme ne peut pas contraindre ouvertement un homme, mais elle use de ruse contre lui par des manières de prostituée. 5. Fuyez donc l’immoralité sexuelle, mes enfants, et ordonnez à vos femmes et à vos filles de ne pas orner leur tête ni leur visage dans le but de tromper les esprits ; car toute femme qui use ainsi de tromperie est gardée
    pour un châtiment éternel. 6. C’est ainsi qu’elles ont aussi ensorcelé les Veilleurs[b] avant le déluge. À force de les regarder, ceux-ci en vinrent eux aussi à les désirer et conçurent l’acte dans leur pensée. Ils prenaient en effet la forme d’hommes et apparaissaient aux femmes pendant qu’elles s’unissaient à leurs maris. 7. Et elles aussi, désirant dans leur pensée l’apparence qu’ils avaient, enfantèrent des géants[c]. Car les Veilleurs leur apparaissaient comme s’élevant jusqu’au ciel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leur forme extérieure » aux versets 1-2 ; le terme grec peut désigner l’apparence, la forme ou la manière de se présenter.
    reason: lexical_alternative
  - marker: b
    text: Les « Veilleurs » sont des êtres célestes connus dans les traditions juives concernant l’époque antérieure au déluge ; voir la réception ancienne de Genèse 6, notamment dans 1 Hénoch.
    reason: cross_reference
  - marker: c
    text: Les versets 6-7 reflètent une tradition interprétative développée concernant le désir des Veilleurs et la naissance des géants.
    reason: cultural_note
  - marker: d
    text: 'La dernière proposition peut être comprise comme une hyperbole : les Veilleurs paraissaient aux femmes si grands qu’ils s’élevaient jusqu’au ciel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηραί
  choice: mauvaises
  rationale: Conserve le jugement moral abrupt du grec sans le réduire à « imparfaites » ; « mauvaises » est direct et naturel en français actuel.
- source_word: δολιεύονται
  choice: usent de ruse
  rationale: Exprime l’action trompeuse et calculée du verbe tout en restant idiomatique.
- source_word: σχήμασιν / τοῦ σχήματος
  choice: apparence
  rationale: Dans ce contexte, le terme désigne la présentation extérieure employée pour attirer ; une note conserve les autres nuances possibles.
- source_word: ἐπισπάσωνται
  choice: attirer à elles
  rationale: Préserve le mouvement vers soi exprimé par le verbe, dans une formulation française naturelle.
- source_word: καταγοητεῦσασθαι
  choice: ensorceler
  rationale: Maintient l’image forte de l’envoûtement ou de la fascination trompeuse, distincte de la simple séduction.
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  choice: sont vaincues par l’esprit de l’immoralité sexuelle
  rationale: Conserve à la fois le passif de domination et la texture spirituelle ou personnifiée de πνεῦμα.
- source_word: ἐν καρδίᾳ μηχανῶνται
  choice: dans leur cœur, elles élaborent des desseins
  rationale: Rend la délibération intérieure sans répéter exactement le vocabulaire de la ruse employé ailleurs.
- source_word: διὰ τῆς κοσμήσεως
  choice: par leurs parures
  rationale: Désigne concrètement l’ornementation comme moyen d’égarement.
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: par leur regard, elles sèment d’abord le poison
  rationale: Préserve la métaphore saisissante du poison semé par le regard et rattache naturellement πρῶτον à cette première étape.
- source_word: Ἐγρήγοροι
  choice: Veilleurs
  rationale: Terme traditionnel et transparent pour ces êtres célestes dans la littérature juive ancienne.
- source_word: γίγαντας
  choice: géants
  rationale: Équivalent direct qui maintient le lien avec la tradition antédiluvienne.
theological_decisions:
- issue: Généralisations sévères sur les femmes
  choice: Traduire directement la mise en garde attribuée à Ruben
  alternative: Limiter explicitement les affirmations aux seules femmes immorales
  rationale: Le grec formule des généralisations sans cette restriction. Les atténuer dans le corps du texte modifierait sa rhétorique difficile au lieu de la rendre avec transparence.
- issue: πνεῦμα τῆς πορνείας
  choice: l’esprit de l’immoralité sexuelle
  alternative: le penchant à la débauche
  rationale: « Esprit » conserve l’ambiguïté entre puissance spirituelle et force personnifiée, plutôt que de ramener le passage à la seule psychologie.
- issue: Tradition des Veilleurs et des géants
  choice: Conserver « Veilleurs » et « géants » dans le texte
  alternative: Les expliquer comme de simples hommes puissants
  rationale: Ces figures appartiennent au cadre interprétatif juif ancien explicitement présupposé par le passage ; elles ne doivent pas être rationalisées.
- issue: Apparition des Veilleurs lors de l’union conjugale
  choice: « apparaissaient aux femmes pendant qu’elles s’unissaient à leurs maris »
  alternative: « avaient des rapports avec elles sous la forme de leurs maris »
  rationale: La syntaxe grecque est difficile. Le choix suit de près l’idée d’une apparition concomitante sans affirmer davantage que le texte, tandis que l’alternative explicite une interprétation possible mais plus résolue.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe exhortative et les images fortes du texte sont conservées. Les formulations volontairement choquantes du témoin grec ne sont ni approuvées ni atténuées en traduction ; elles sont présentées comme le discours de Ruben. Les pronoms des versets 6-7 ont été légèrement explicités lorsque le français l’exigeait, sans supprimer l’ambiguïté de la scène.
