  verdict: revise
  source_fidelity: 'La structure est bien rendue : impératif suivi d’un infinitif négatif, puis proposition finale, et « ces femmes » reflète correctement le démonstratif féminin pluriel κἀκείνας. Toutefois, « recommandez » atténue ἐντέλλεσθε, qui exprime l’ordre ou l’injonction plutôt qu’une simple recommandation. « Ordonnez » restitue plus fidèlement la force de l’impératif. « Fréquenter les hommes » rend sobrement συνδιάζειν sans introduire une notion d’intimité qui n’est pas explicitée.'
  naturalness: La phrase révisée demeure naturelle en français moderne international. « Soient elles aussi pures dans leurs pensées » est clair, mais « pures dans leur esprit » serait plus idiomatique tout en gardant le domaine mental de τῇ διανοίᾳ. La formulation retenue conserve toutefois la précision plurielle et évite un sens spiritualisé de « esprit ».
  terminology: « Ordonnez » correspond au registre parénétique et injonctif du passage. « Ces femmes », « les hommes » et « pures dans leurs pensées » ne soulèvent pas de problème terminologique et ne surinterprètent pas le texte.
