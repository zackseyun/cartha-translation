  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/002.yaml
  text: And command those women likewise not to associate with men, so that they too may be pure in mind.
translation:
  language: fr
  text: Et ordonnez également à ces femmes de ne pas fréquenter les hommes, afin qu’elles aussi soient pures dans leurs pensées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκείνας
  choice: également à ces femmes
  rationale: Le pronom démonstratif féminin pluriel renvoie à des femmes déjà mentionnées; καί porte ici l’idée de « également ».
- source_word: ἐντέλλεσθε
  choice: recommandez
  rationale: L’impératif appelle à donner une instruction ferme; « recommandez » reste naturel en français sans alourdir la formulation.
- source_word: μὴ συνδιάζειν τοῖς ἀνδράσιν
  choice: de ne pas fréquenter les hommes
  rationale: « Fréquenter » rend l’idée générale d’association exprimée par συνδιάζειν, sans ajouter la notion d’intimité absente du texte.
- source_word: καθαρεύωσι τῇ διανοίᾳ
  choice: soient pures dans leurs pensées
  rationale: Cette formulation exprime la pureté dans la faculté de pensée ou la disposition intérieure, avec un français courant et digne.
theological_decisions:
- issue: Nature de la pureté demandée
  choice: pures dans leurs pensées
  alternative: pures d’esprit
  rationale: Le datif τῇ διανοίᾳ précise le domaine intérieur ou mental. « Dans leurs pensées » évite que « esprit » soit compris dans un sens ontologique ou spécifiquement théologique.
translation_notes:
  register: Français moderne, clair et digne. La coordination et la proposition finale du grec sont conservées, tout comme la référence démonstrative à « ces femmes ».
