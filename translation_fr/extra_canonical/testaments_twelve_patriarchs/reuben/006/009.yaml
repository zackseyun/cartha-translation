base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: fr
  text: 'Je vous adjure, par le Dieu du ciel : que chacun de vous pratique la vérité envers son prochain et ait de l’amour pour son frère.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς
  choice: Je vous adjure
  rationale: Rend la force solennelle du verbe grec sans l’affaiblir en une simple exhortation.
- source_word: τὸν Θεὸν τοῦ οὐρανοῦ
  choice: par le Dieu du ciel
  rationale: Le complément grec désigne celui par qui l’adjuration est faite; cette tournure est naturelle dans un registre français solennel.
- source_word: ποιεῖν ἀλήθειαν
  choice: pratique la vérité
  rationale: Conserve l’idée concrète de « faire la vérité » tout en employant une expression française intelligible et digne.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: envers son prochain
  rationale: Reproduit la relation exprimée par πρὸς et le sens éthique traditionnel de πλησίον.
- source_word: ἀγάπην ἔχειν
  choice: ait de l’amour pour
  rationale: Préserve la construction nominale du grec et exprime une disposition durable plutôt qu’un acte isolé.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Maintient le terme familial du texte sans préciser s’il s’agit d’un frère biologique ou d’un membre de la communauté.
theological_decisions:
- issue: Portée du mot « frère »
  choice: Conserver « son frère » sans explicitation
  alternative: son prochain / son compagnon dans la communauté
  rationale: Le grec ἀδελφός peut avoir un sens familial ou communautaire; la traduction conserve cette amplitude au lieu de la trancher.
translation_notes:
  register: Français moderne, solennel et accessible. Les deux propositions parallèles sont conservées, ainsi que le passage de « prochain » à « frère ». Le deux-points rend naturellement en français l’exhortation qui suit l’adjuration.
