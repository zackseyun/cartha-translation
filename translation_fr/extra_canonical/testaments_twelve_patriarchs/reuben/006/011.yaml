base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/011.yaml
  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: fr
  text: Car il bénira Israël et Juda, parce qu’en lui le Seigneur a choisi de régner devant tout le peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογήσει
  choice: il bénira
  rationale: Rend directement le futur grec et conserve le sens religieux courant de la bénédiction.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Préserve la formulation grecque ainsi que l’ambiguïté du référent masculin, sans l’expliciter.
- source_word: ἐξελέξατο
  choice: a choisi
  rationale: Traduit l’aoriste moyen par un passé composé naturel en français, sans ajouter un complément absent.
- source_word: βασιλεύειν
  choice: de régner
  rationale: Conserve l’infinitif et ne tranche pas artificiellement entre l’exercice direct de la royauté et son exercice par l’intermédiaire de la personne désignée.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: devant tout le peuple
  rationale: Reproduit fidèlement l’expression grecque dans un français clair et digne.
theological_decisions:
- issue: Sujet implicite de « régner »
  choice: Conserver « le Seigneur a choisi de régner »
  alternative: « le Seigneur l’a choisi pour régner »
  rationale: Dans la syntaxe grecque, le sujet naturel de l’infinitif non exprimé est celui du verbe principal, « le Seigneur ». L’alternative introduirait un pronom objet absent et résoudrait une tension que le texte laisse ouverte.
- issue: Référent de « en lui »
  choice: Maintenir le pronom sans identification
  alternative: Nommer Lévi, Juda ou une autre figure selon le contexte interprétatif
  rationale: Le verset seul ne nomme pas explicitement le référent; le préciser importerait une interprétation théologique.
translation_notes:
  register: Français moderne international, formulation sobre et dignifiée. La proximité avec l’ordre grec est maintenue là où elle reste naturelle, notamment afin de préserver l’ambiguïté de « en lui » et la relation syntaxique entre le choix du Seigneur et son règne.
