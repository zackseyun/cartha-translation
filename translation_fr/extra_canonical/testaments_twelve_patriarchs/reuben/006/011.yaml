  text: Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵.
