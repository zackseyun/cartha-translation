  text: until the completion of the times [of the high priest Messiah, of whom the Lord spoke].
translation:
  language: fr
  text: jusqu’à l’achèvement des temps [du grand prêtre oint[a], dont le Seigneur a parlé].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du grand prêtre Messie » ; le grec χριστός peut signifier « oint » ou servir de titre : « Messie, Christ ».'
    reason: Signaler l’ambiguïté lexicale et syntaxique de ἀρχιερέως χριστοῦ sans imposer une interprétation christologique précise.
lexical_decisions:
- source_word: τελειώσεως χρόνων
  choice: l’accomplissement des temps
  rationale: Reproduit le sens d’achèvement ou d’accomplissement porté par τελείωσις, avec le pluriel « temps » pour χρόνων.
- source_word: ἀρχιερέως χριστοῦ
  choice: du grand prêtre oint
  rationale: 'Les deux mots sont au génitif singulier et χριστός peut qualifier ἀρχιερεύς : il s’agit donc naturellement du grand prêtre ayant reçu l’onction, sans imposer que « Christ » soit ici un titre autonome.'
- source_word: ὃν εἶπε Κύριος
  choice: dont le Seigneur a parlé
  rationale: Cette formulation française naturelle rend le relatif masculin ὃν avec le verbe εἶπεν au sens de mentionner ou parler de quelqu’un.
theological_decisions:
- issue: Valeur de χριστοῦ dans ἀρχιερέως χριστοῦ
  choice: grand prêtre oint
  alternative: grand prêtre Messie / Christ, le grand prêtre
  rationale: La construction grecque permet de comprendre χριστοῦ comme un adjectif verbal qualifiant « grand prêtre ». Une note conserve toutefois la possibilité d’y voir le titre « Messie » ou « Christ », sans trancher une ambiguïté théologiquement significative.
translation_notes:
  register: Français moderne, sobre et digne. Les crochets de l’édition source sont conservés afin de signaler le caractère textuellement secondaire ou incertain de la proposition qu’ils encadrent.
