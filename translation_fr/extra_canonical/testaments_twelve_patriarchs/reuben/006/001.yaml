  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: fr
  text: Gardez-vous donc de l’immoralité sexuelle et gardez votre esprit pur. Préservez aussi vos sens de toute femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Terme français actuel et suffisamment large pour rendre πορνεία sans le limiter à la prostitution.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: gardez votre pensée pure
  rationale: Rend naturellement l’idée de demeurer purs dans la faculté intérieure de pensée, sans la tournure française lourde « soyez en train de purifier ».
- source_word: τὰς αἰσθήσεις ὑμῶν
  choice: vos sens
  rationale: Équivalent direct qui conserve la portée perceptive du grec αἰσθήσεις.
- source_word: ἀπὸ πάσης γυναικῶν
  choice: de toute femme
  rationale: Suit le sens apparent de la leçon grecque transmise malgré son irrégularité grammaticale, en accord avec la consultation anglaise.
theological_decisions:
- issue: Portée de πορνεία
  choice: immoralité sexuelle
  alternative: débauche / prostitution
  rationale: Le choix retenu préserve la portée générale du terme et n’impose pas une définition confessionnelle particulière.
- issue: Formulation générale concernant les femmes
  choice: de toute femme
  alternative: à l’égard de toutes les femmes
  rationale: La formulation conserve la rigueur et la tension du texte source, sans ajouter une restriction absente du grec.
translation_notes:
  register: Français international moderne, sobre et exhortatif. La répétition de « Gardez » reproduit l’insistance de φυλάξατε tout en restant claire pour un lectorat général.
