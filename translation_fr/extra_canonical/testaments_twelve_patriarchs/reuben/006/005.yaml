base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/005.yaml
  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: fr
  text: 'C’est pourquoi je vous le dis : vous envierez les fils de Lévi et chercherez à être élevés au-dessus d’eux ; mais, à cause de cela, vous ne l’emporterez pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλώσετε
  choice: vous envierez
  rationale: Dans ce contexte de rivalité avec les fils de Lévi, le verbe exprime l’envie plutôt qu’un zèle positif ; « envier » est précis et naturel en français moderne.
- source_word: ὑψωθῆναι ὑπὲρ αὐτούς
  choice: être élevés au-dessus d’eux
  rationale: Cette formulation conserve la voix passive de l’infinitif grec et la comparaison explicite introduite par ὑπέρ.
- source_word: οὐ ἰσχύσετε
  choice: vous ne l’emporterez pas
  rationale: Le verbe ἰσχύω évoque ici la capacité d’avoir le dessus ou de réussir ; « ne pas l’emporter » rend naturellement cette idée dans le contexte d’une rivalité.
theological_decisions:
- issue: Référent de « à cause de cela » (διὰ τοῦτο)
  choice: Conserver l’expression sans expliciter son référent
  alternative: « à cause de votre envie » ou « à cause de cette ambition »
  rationale: Le grec ne précise pas si l’expression renvoie à l’envie, à la volonté d’être élevés, ou à l’ensemble de cette conduite ; l’expliciter résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. La tournure « C’est pourquoi je vous le dis » évite la lourdeur d’un calque de Διὰ τοῦτο οὖν tout en conservant le lien logique. Le point-virgule met en relief le contraste introduit par ἀλλά.
