  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/007.yaml
  text: For to Levi God gave the priesthood, and to Judah with him the kingdom.
translation:
  language: fr
  text: Car Dieu a donné à Lévi le sacerdoce, et à Juda, avec lui, la royauté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec transmis dans l’extrait fourni est fortement tronqué ou altéré. La traduction suit la lecture attestée du verset dans l’édition indiquée : Dieu donne le sacerdoce à Lévi et la royauté à Juda « avec lui ».'
    reason: Signaler honnêtement l’état défectueux de la chaîne grecque fournie et la base de la restitution.
lexical_decisions:
- source_word: Λευί
  choice: Lévi
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: ἱερωσύνην
  choice: le sacerdoce
  rationale: Rend précisément la fonction et la dignité sacerdotales confiées à Lévi.
- source_word: Ἰούδᾳ
  choice: à Juda
  rationale: Forme française traditionnelle du nom propre.
- source_word: βασιλείαν
  choice: la royauté
  rationale: Désigne ici la dignité ou l’autorité royale plutôt qu’un territoire politique.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: Conserve le lien syntaxique et l’ambiguïté du grec sans préciser davantage la relation entre Lévi et Juda.
theological_decisions:
- issue: Rapport entre le sacerdoce de Lévi et la royauté de Juda
  choice: Maintenir « avec lui » sans explicitation
  alternative: Interpréter comme « aux côtés de Lévi » ou comme un partage institutionnel entre les deux tribus
  rationale: Le texte associe les deux attributions sans définir exactement leur articulation; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français moderne, sobre et digne. La tournure parallèle met en relief les deux attributions. « A donné » est naturel en français tout en conservant la valeur de l’aoriste grec.
