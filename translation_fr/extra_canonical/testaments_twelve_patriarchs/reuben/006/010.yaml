source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ πρὸς τὸν⁶⁵ Λευὶ ἐγγίσατε⁶⁶ ἐν ταπεινώσει καρδίας Γὑμῶν⌉⁶⁷, ἵνα * δέξησθε εὐλογίαν⁶⁸ ἐκ τοῦ⁶⁹ στόματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/010.yaml
  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: fr
  text: Et approchez-vous de Lévi dans l’humilité de votre cœur, afin que vous receviez une bénédiction de sa bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  choice: approchez-vous
  rationale: Rend directement l’impératif aoriste pluriel, avec une formulation naturelle en français.
- source_word: ἐν ταπεινώσει καρδίας ὑμῶν
  choice: avec un cœur humble
  rationale: Exprime idiomatiquement l’humilité intérieure indiquée par le grec, tout en conservant la référence explicite au cœur et à celui des destinataires.
- source_word: εὐλογίαν
  choice: une bénédiction
  rationale: Équivalent courant et théologiquement non restrictif du terme grec.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sa bouche
  rationale: Préserve l’image concrète de la bénédiction prononcée oralement par Lévi.
theological_decisions:
- issue: Nature et autorité de la bénédiction de Lévi
  choice: Conserver simplement « une bénédiction de sa bouche »
  alternative: Expliciter une bénédiction sacerdotale ou divine
  rationale: Le verset ne précise pas ici la nature exacte ni la source ultime de la bénédiction; l’explicitation introduirait une interprétation absente du texte.
translation_notes:
  register: Français moderne, digne et accessible. « Avec un cœur humble » est retenu plutôt que le calque plus lourd « dans l’humilité de votre cœur »; le pluriel des destinataires reste perceptible dans l’impératif « approchez-vous ».
