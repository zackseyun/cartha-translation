  text: For sexual immorality has within itself neither understanding nor godliness, and every jealousy dwells in its desire.
translation:
  language: fr
  text: Car l’immoralité sexuelle n’a en elle-même ni discernement ni piété, et toute jalousie habite dans son désir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  choice: immoralité sexuelle
  rationale: Expression française actuelle et suffisamment large pour désigner l’inconduite sexuelle visée par le grec.
- source_word: σύνεσιν
  choice: discernement
  rationale: Dans ce contexte moral, « discernement » rend la capacité de comprendre et de juger avec justesse, plus naturellement que « intelligence ».
- source_word: εὐσέβειαν
  choice: piété
  rationale: Équivalent français direct et digne, qui conserve la dimension religieuse du terme sans l’expliciter excessivement.
- source_word: ζῆλος
  choice: jalousie
  rationale: Le contexte négatif de l’affirmation favorise « jalousie », tout en reconnaissant que le terme grec peut aussi exprimer le zèle.
- source_word: ἐπιθυμίᾳ
  choice: désir
  rationale: Rend directement le grec et préserve l’ambiguïté entre désir au sens général et convoitise.
theological_decisions:
- issue: Portée de εὐσέβεια
  choice: piété
  alternative: respect de Dieu
  rationale: « Piété » préserve la formulation concise et la portée religieuse du grec sans transformer le nom abstrait en paraphrase.
- issue: Sens de ζῆλος
  choice: jalousie
  alternative: zèle
  rationale: La proximité de l’immoralité sexuelle et du désir donne au mot une valeur défavorable; « jalousie » convient mieux, sans introduire une doctrine particulière.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle « ni… ni… » et l’image selon laquelle la jalousie « habite » dans le désir sont conservées afin de respecter la force rhétorique du grec.
