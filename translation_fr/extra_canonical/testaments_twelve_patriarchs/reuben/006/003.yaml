revisions:
- from: Car les rencontres répétées, même si l’acte impie n’est pas commis, sont néanmoins pour elles une maladie incurable et, pour nous, un opprobre de Béliar qui mène à la perdition, ainsi qu’un opprobre éternel.[a]
  to: Car les rencontres répétées, même si l’acte impie n’est pas commis, sont néanmoins pour elles une maladie incurable et, pour nous, un opprobre de Béliar et un opprobre éternel, pour notre ruine.[a]
  rationale: La révision conserve les éléments lexicaux du texte grec et sa répétition rhétorique, tout en supprimant le relatif interprétatif. « Pour notre ruine » restitue la valeur destructive de εἰς ὄλεθρον de manière idiomatique, et la note signale honnêtement l’ordre et la condensation du grec.
