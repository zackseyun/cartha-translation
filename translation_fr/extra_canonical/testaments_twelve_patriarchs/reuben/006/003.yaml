id: T12P.REU.6.3
reference: Testament of Reuben 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: fr
  text: Car les rencontres répétées, même si l’acte impie n’est pas commis, sont néanmoins pour elles une maladie incurable et, pour nous, un opprobre de Béliar et un opprobre éternel, pour notre ruine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de la dernière proposition est très condensé. Littéralement : « pour nous, pour la ruine, un opprobre de Béliar et un opprobre éternel ». La portée exacte de « pour la ruine » est incertaine.'
    reason: Préserver l’ambiguïté syntaxique de εἰς ὄλεθρον, sans l’attacher explicitement à un seul des deux « opprobres ».
lexical_decisions:
- source_word: συνεχεῖς συντυχίαι
  choice: les rencontres répétées
  rationale: « Rencontres répétées » exprime naturellement la fréquence ou la continuité indiquée par συνεχεῖς, sans préciser davantage la nature des rencontres que ne le fait le grec.
- source_word: τὸ ἀσέβημα
  choice: l’acte impie
  rationale: Rend le substantif désignant un acte contraire à la piété, tout en conservant sa portée morale et religieuse.
- source_word: νόσος ἀνίατος
  choice: une maladie incurable
  rationale: Traduction directe de l’image médicale du texte grec.
- source_word: εἰς ὄλεθρον
  choice: qui mène à la perdition
  rationale: Exprime le mouvement vers une issue destructrice marqué par εἰς, sans réduire ὄλεθρος à une simple gêne ou honte.
- source_word: ὄνειδος
  choice: opprobre
  rationale: « Opprobre » conserve la force de la honte publique et du déshonneur exprimés par le terme grec.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec, sans harmonisation avec une autre forme biblique.
theological_decisions:
- issue: Rapport syntaxique entre « Béliar », « opprobre » et « perdition »
  choice: « un opprobre de Béliar qui mène à la perdition »
  alternative: « pour notre perdition, un opprobre de Béliar » ou « une honte destructrice causée par Béliar »
  rationale: Le grec est condensé. La traduction maintient le lien génitif naturel entre Βελίαρ et ὄνειδος, ainsi que la valeur finale ou résultative de εἰς ὄλεθρον, sans préciser si Béliar est l’auteur, la source ou le possesseur de l’opprobre.
- issue: Référent du féminin αὐταῖς
  choice: « pour elles »
  alternative: Nommer explicitement « les femmes »
  rationale: Le pronom féminin est conservé comme tel puisque le verset isolé ne nomme pas explicitement son référent; cela évite d’introduire une précision contextuelle absente de cette proposition.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition d’« opprobre » reproduit l’insistance du grec; « honte » aurait été plus courant, mais moins précis et moins solennel ici.
