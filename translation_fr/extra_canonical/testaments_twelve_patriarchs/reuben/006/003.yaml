    issue: Portée trop déterminée de « qui mène à la perdition »
    rationale: Le relatif introduit un lien syntaxique explicite entre εἰς ὄλεθρον et le seul « opprobre de Béliar », alors que le grec place εἰς ὄλεθρον avant « opprobre de Béliar et opprobre éternel » et ne permet pas de fixer ce rattachement avec certitude.
