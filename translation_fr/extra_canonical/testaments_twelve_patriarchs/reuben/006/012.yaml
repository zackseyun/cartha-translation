id: T12P.REU.6.12
reference: Testament of Reuben 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: fr
  text: Et prosternez-vous[a] devant sa descendance, car elle mourra pour vous dans des guerres visibles et invisibles. Et il y aura parmi vous un roi éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendez hommage à ». Le verbe grec peut aussi, selon le contexte, exprimer l’adoration.'
    reason: Signaler l’étendue sémantique de προσκυνέω et préserver l’ambiguïté théologique du texte.
lexical_decisions:
- source_word: προσκυνήσατε
  choice: prosternez-vous devant
  rationale: Rend concrètement le geste d’abaissement et d’hommage exprimé par le verbe grec, sans déterminer à lui seul si l’acte relève de l’adoration cultuelle.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: sa descendance
  rationale: Préserve la valeur collective ou représentative possible de σπέρμα, plutôt que d’imposer un descendant individuel.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Expression française naturelle qui conserve l’idée d’une mort en faveur des destinataires, sans préciser davantage sa nature.
- source_word: ἐν πολέμοις ὁρατοῖς καὶ ἀοράτοις
  choice: dans des guerres visibles et invisibles
  rationale: Traduction directe qui maintient le contraste énigmatique entre les deux types de conflits.
- source_word: βασιλεὺς αἰώνιος
  choice: un roi éternel
  rationale: Rend directement αἰώνιος et conserve le groupe nominal indéfini du grec.
theological_decisions:
- issue: Nature de l’hommage commandé par προσκυνέω
  choice: prosternez-vous devant
  alternative: adorez
  rationale: Le verbe peut désigner l’adoration ou un hommage marqué par la prosternation. La traduction choisie conserve cette amplitude sans imposer une lecture cultuelle.
- issue: Lien entre « sa descendance » et « un roi éternel »
  choice: 'Formulation existentielle : « il y aura parmi vous un roi éternel »'
  alternative: « elle sera parmi vous un roi éternel »
  rationale: Le dernier verbe grec n’a pas de sujet exprimé. La formulation retenue évite d’identifier grammaticalement avec certitude le roi à la descendance, tout en laissant cette lecture possible dans le contexte.
- issue: Valeur de σπέρμα
  choice: descendance
  alternative: descendant
  rationale: Le nom grec neutre peut avoir une portée collective ou viser une figure représentative. Le français « descendance » préserve mieux cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « Et » suit l’enchaînement grec. Le pronom féminin « elle » reprend grammaticalement « descendance », sans trancher entre un sens collectif et une figure individuelle représentative.
