  text: For God will execute vengeance on them, but you will die an evil death.
translation:
  language: fr
  text: Car Dieu exercera sa vengeance contre eux, mais vous, vous mourrez d’une mort funeste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν
  choice: exercera sa vengeance
  rationale: Cette tournure française naturelle rend l’expression grecque littérale « fera la vengeance » sans en atténuer la force judiciaire.
- source_word: αὐτῶν
  choice: contre eux
  rationale: Le génitif se comprend ici comme désignant ceux sur qui s’exerce la vengeance, conformément au contexte et à la syntaxe idiomatique du français.
- source_word: ἀποθανεῖτε θανάτῳ πονηρῷ
  choice: vous mourrez d’une mort funeste
  rationale: La formulation conserve la construction emphatique « mourir d’une mort »; « funeste » exprime ici le caractère mauvais, terrible ou malheureux de cette mort sans suggérer que la mort elle-même commet le mal.
theological_decisions:
- issue: L’agent et la cible de la vengeance
  choice: Dieu exerce sa vengeance contre eux
  alternative: Dieu accomplit leur vengeance
  rationale: Dans ce contexte, ἐκδίκησις avec αὐτῶν désigne le châtiment exercé sur eux plutôt qu’une vengeance qui leur appartiendrait; cette lecture évite une ambiguïté française trompeuse tout en maintenant Dieu comme agent explicite.
translation_notes:
  register: Français international moderne, digne et direct. Le redoublement « vous, vous mourrez » marque naturellement le contraste porté par ὑμεῖς δέ. Aucun marqueur de note n’est requis.
