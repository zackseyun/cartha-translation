  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006.yaml
  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
translation:
  language: fr
  text: '1. Gardez-vous donc de l’immoralité sexuelle et gardez votre esprit pur. Préservez aussi vos sens de toute femme. 2. Donnez également instruction aux femmes de ne pas fréquenter les hommes de trop près, afin qu’elles aussi gardent leur esprit pur. 3. Car les rencontres continuelles, même si l’acte impie n’est pas commis, sont néanmoins pour elles une maladie incurable, et pour nous un déshonneur funeste venant de Béliar[a], ainsi qu’un opprobre éternel. 4. En effet, l’immoralité sexuelle ne porte en elle ni intelligence ni respect de Dieu, et toute jalousie habite son désir.


    5. C’est pourquoi je vous le dis : vous envierez les fils de Lévi et vous chercherez à vous élever au-dessus d’eux, mais à cause de cela vous ne l’emporterez pas. 6. Car Dieu les vengera, tandis que vous mourrez d’une mort cruelle. 7. En effet, Dieu a donné à Lévi le sacerdoce et, avec lui, à Juda la royauté. 8. Ne vous élevez pas contre ces deux-là, car c’est d’eux que le Seigneur mènera à son accomplissement ce qui doit être annoncé[b].


    9. Je vous adjure, par le Dieu du ciel, de pratiquer chacun la vérité envers son prochain[c] et d’avoir chacun de l’amour pour son frère. 10. Approchez-vous de Lévi avec un cœur humble, afin de recevoir une bénédiction de sa bouche. 11. Car il bénira Israël et Juda, puisque c’est en lui que le Seigneur a choisi de régner devant tout le peuple. 12. Prosternez-vous devant sa descendance[d], car elle mourra pour vous au cours de guerres visibles et invisibles ; et, parmi vous, il y aura un roi éternel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Béliar » reproduit la forme grecque du nom ; certains lecteurs connaissent plutôt la forme « Bélial ».
    reason: lexical_alternative
  - marker: b
    text: 'Les versets 7–8 sont textuellement difficiles dans le témoin grec conservé. La traduction en donne le sens probable : Lévi reçoit le sacerdoce et Juda la royauté ; il ne faut s’élever contre aucune de ces deux lignées, dont procède l’accomplissement annoncé par le Seigneur.'
    reason: textual_variant
  - marker: c
    text: 'Littéralement : « faire la vérité » envers son prochain. Cet idiome signifie agir avec vérité et fidélité, et non simplement prononcer des paroles vraies.'
    reason: lexical_alternative
  - marker: d
    text: Se prosterner devant la « descendance » peut désigner l’hommage rendu à une lignée ou à l’un de ses représentants, sans signifier nécessairement une adoration divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξατε
  choice: Gardez-vous
  rationale: L’impératif exprime une vigilance active et personnelle ; « gardez-vous » convient au ton solennel de l’exhortation.
- source_word: πορνεία
  choice: immoralité sexuelle
  rationale: Cette expression actuelle conserve la portée générale du terme grec sans la limiter aux seules relations avant le mariage.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: gardez votre esprit pur
  rationale: « Esprit » rend naturellement διάνοια comme faculté intérieure de pensée, tandis que la formulation impérative est fluide en français.
- source_word: αἰσθήσεις
  choice: sens
  rationale: Le terme désigne ici les facultés de perception susceptibles d’alimenter le désir.
- source_word: συνδιάζειν
  choice: fréquenter … de trop près
  rationale: La formulation évoque une proximité sociale répétée sans faire du verbe une désignation explicite de l’acte sexuel.
- source_word: συνεχεῖς συντυχίαι
  choice: rencontres continuelles
  rationale: Le choix conserve l’idée d’un contact répété et persistant.
- source_word: ἀσέβημα
  choice: acte impie
  rationale: Cette traduction préserve la qualification religieuse et morale de l’acte.
- source_word: νόσος ἀνίατος
  choice: maladie incurable
  rationale: La métaphore pathologique du grec est conservée directement.
- source_word: Βελίαρ
  choice: Béliar
  rationale: La translittération suit la forme grecque Βελίαρ plutôt que de l’harmoniser avec la forme plus connue « Bélial ».
- source_word: σύνεσιν
  choice: intelligence
  rationale: Le mot conserve ici la dimension de compréhension et de discernement moral.
- source_word: εὐσέβειαν
  choice: respect de Dieu
  rationale: La formulation rend explicite et accessible l’orientation religieuse du terme sans ajouter une doctrine particulière.
- source_word: ζῆλος / ζηλώσετε
  choice: jalousie / vous envierez
  rationale: Le contexte décrit une rivalité négative envers les fils de Lévi ; le français demande des choix légèrement différents pour le nom et le verbe.
- source_word: ποιεῖν ἀλήθειαν
  choice: pratiquer la vérité
  rationale: La traduction garde l’idiome concret du grec tout en signalant par une note qu’il s’agit d’agir avec vérité et fidélité.
- source_word: προσκυνήσατε
  choice: Prosternez-vous devant
  rationale: Le verbe décrit un geste d’hommage ou de soumission ; cette traduction n’impose pas qu’il s’agisse d’un culte divin.
- source_word: σπέρμα
  choice: descendance
  rationale: « Descendance » exprime naturellement la lignée issue de Lévi tout en conservant l’ambiguïté quant à son référent précis.
theological_decisions:
- issue: Reconstitution des versets 7–8 dans un témoin grec difficile
  choice: Lévi reçoit le sacerdoce et Juda la royauté, puis vient l’interdiction de s’élever contre ces deux lignées.
  alternative: Laisser les versets sous une forme fragmentaire, ou annoncer plus généralement des dirigeants futurs sans nommer le sacerdoce et la royauté.
  rationale: Le texte grec fourni est lacunaire et corrompu à cet endroit, mais les éléments conservés et le contexte soutiennent ce sens traditionnel. L’incertitude est signalée plutôt que masquée.
- issue: Référent de « en lui » au verset 11
  choice: Conserver le pronom singulier sans expliciter davantage son antécédent.
  alternative: Remplacer le pronom par « Lévi », « Israël » ou une autre identification explicite.
  rationale: Le grec ἐν αὐτῷ laisse une ambiguïté contextuelle qu’une explicitation française résoudrait indûment.
- issue: Portée messianique et royale des versets 11–12
  choice: Conserver « sa descendance » et « un roi éternel » sans identifier explicitement cette descendance à une figure déterminée.
  alternative: Identifier expressément la descendance à la lignée sacerdotale de Lévi ou le roi à un Messie issu de Juda.
  rationale: Le passage rapproche Lévi et Juda et peut refléter plusieurs couches de tradition ; la traduction préserve cette tension théologique.
- issue: Nature de l’hommage rendu à la descendance
  choice: Traduire προσκυνήσατε par « Prosternez-vous devant » sans parler d’adoration.
  alternative: Employer « adorez » ou réduire le geste à « honorez ».
  rationale: Le verbe peut désigner une prosternation d’hommage devant une autorité humaine ; « prosternez-vous » conserve le geste et son ambiguïté sans imposer un culte divin.
translation_notes:
  register: Français international moderne, digne et exhortatif. La syntaxe reste proche du grec lorsque l’ambiguïté est théologiquement ou textuellement significative, mais les tournures sont adaptées pour être comprises à la lecture courante. Le tutoiement collectif est rendu par « vous », conformément au registre biblique français contemporain.
