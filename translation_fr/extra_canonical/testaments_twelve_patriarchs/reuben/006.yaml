  naturalness: Le français est moderne, digne et très lisible. « C’est en lui que » au v. 11 conserve l’ambiguïté voulue, et « Prosternez-vous devant » au v. 12 est un bon rendu non doctrinalement chargé. Au v. 8, une formulation explicitant « c’est d’eux que » est à la fois plus fidèle à la lecture adoptée et plus claire.
