  text: And rising up, he kissed them and said to them, “Hear, my brothers and my sons; listen to Reuben your father in what I command you.”
translation:
  language: fr
  text: 'Puis il se leva, les embrassa et leur dit : « Écoutez, mes frères et mes fils ; prêtez l’oreille à Ruben, votre père, au sujet de ce que je vous commande. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάς
  choice: il se leva
  rationale: Rend naturellement en français le participe aoriste exprimant l’action préalable.
- source_word: κατεφίλησεν
  choice: les embrassa
  rationale: Le verbe intensif désigne ici un geste d’affection ; « embrassa » est idiomatique et digne en français moderne.
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: Conserve l’impératif direct qui ouvre l’exhortation.
- source_word: ἐνωτίσασθε
  choice: prêtez attention à
  rationale: Distingue ce second impératif de « Écoutez » tout en exprimant l’idée d’une écoute attentive.
- source_word: ὅσα ἐγὼ ἐντέλλομαι ὑμῖν
  choice: dans ce que je vous commande
  rationale: Suit la relation syntaxique du texte transmis sans alourdir la formulation française.
theological_decisions:
- issue: Ruben se désigne à la troisième personne comme le père de ses auditeurs
  choice: Ruben, votre père
  alternative: moi, Ruben, votre père
  rationale: La formulation retenue préserve l’auto-désignation à la troisième personne attestée par le grec et évite d’ajouter un pronom explicatif absent.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme des deux impératifs est conservé, ainsi que les deux groupes d’adresse « mes frères et mes fils ».
