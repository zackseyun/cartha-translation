lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Rend directement l’idée d’une copie ou transcription d’un document.
- source_word: διαθήκης
  choice: testament
  rationale: Dans ce contexte littéraire, le terme désigne les dernières dispositions et exhortations attribuées à Ruben.
- source_word: ἐνετείλατο
  choice: ordonna
  rationale: Conserve la force du verbe grec, qui exprime un commandement ou une instruction faisant autorité.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: avant de mourir
  rationale: Formulation française naturelle qui conserve exactement le rapport temporel.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: dans la cent vingt-cinquième année de sa vie
  rationale: Reproduit l’expression grecque de l’année de vie plutôt que de la convertir en un âge formulé autrement.
