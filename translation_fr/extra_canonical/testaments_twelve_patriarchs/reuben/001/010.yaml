source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 10. Καὶ⁶⁴ οἶνον καὶ σίκερα οὐκ ἔπιον, καὶ κρέας⁶⁵ οὐκ εἰσῆλθεν *ἐν τῷ στόματί⁶⁶ μου· καὶ πᾶν⁶⁷ ἄρτον ἐπι- θυμίας⁶⁸ οὐκ ἔφαγον⁶⁹ *ἀλλ᾽ ἤμην⁷⁰ πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου⁷¹, μεγάλη γὰρ ἦν, *οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: fr
  text: Je n’ai bu ni vin ni boisson forte, aucune viande n’est entrée dans ma bouche, et je n’ai mangé aucun pain qui me faisait envie[a]. Mais j’étais dans le deuil à cause de mon péché, car il était grave, tel qu’il ne s’en était jamais produit en Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «aucun pain de désir»; il peut s’agir de pain désirable ou, plus largement, d’une nourriture dont il avait envie.'
    reason: Le groupe grec est inhabituel et peut évoquer soit du pain particulièrement recherché, soit une nourriture désirée; la note conserve cette ambiguïté lexicale.
lexical_decisions:
- source_word: σίκερα
  choice: boisson forte
  rationale: Le terme désigne une boisson enivrante distincte du vin; «boisson forte» conserve cette distinction sans préciser indûment sa composition.
- source_word: κρέας
  choice: viande
  rationale: Équivalent français direct et naturel dans ce contexte d’abstinence.
- source_word: ἄρτον ἐπιθυμίας
  choice: pain qui me faisait envie
  rationale: Cette formulation conserve l’image explicite du pain et la notion de désir, tout en évitant le calque peu naturel «pain de désir».
- source_word: πενθῶν
  choice: dans le deuil
  rationale: Le participe exprime un deuil ou une profonde affliction, et non simplement une tristesse passagère.
- source_word: ἁμαρτίᾳ
  choice: péché
  rationale: Rend le sens moral et religieux habituel du grec sans l’atténuer en «erreur».
theological_decisions:
- issue: Caractère sans précédent du péché de Ruben en Israël
  choice: tel qu’il ne s’en était jamais produit en Israël
  alternative: sans précédent en Israël
  rationale: La formulation retenue préserve la comparaison forte et quelque peu absolue du texte grec, sans expliquer ni limiter sa portée.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de «et» est légèrement allégée par la ponctuation, tandis que les images concrètes de l’abstinence et du deuil sont conservées.
