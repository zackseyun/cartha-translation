  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/009.yaml
  text: And after this, with the resolve of my soul, I repented before the Lord for seven years.
translation:
  language: fr
  text: Après cela, avec une ferme résolution intérieure, je me suis repenti devant le Seigneur pendant sept ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: Après cela
  rationale: Rend directement la succession temporelle exprimée par le grec.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: dans la ferme résolution de mon âme
  rationale: προαίρεσις désigne ici une décision intérieure délibérée ou une résolution; «ferme» explicite naturellement en français la détermination impliquée par le contexte pénitentiel.
- source_word: ἑπτὰ ἔτη
  choice: pendant sept ans
  rationale: Le complément exprime la durée de la repentance.
- source_word: μετενόησα
  choice: je me suis repenti
  rationale: Traduction courante de μετανοέω, qui conserve la dimension morale et spirituelle du changement de disposition.
- source_word: ἐνώπιον Κυρίου
  choice: devant le Seigneur
  rationale: Équivalent naturel et formel de l’expression grecque, sans ajout d’article là où le français biblique l’omet normalement.
theological_decisions:
- issue: Nature de la repentance prolongée
  choice: je me suis repenti […] pendant sept ans
  alternative: j’ai fait pénitence […] pendant sept ans
  rationale: Le grec μετανοέω met d’abord l’accent sur le repentir ou changement intérieur; «faire pénitence» pourrait importer plus précisément des pratiques religieuses non explicitées dans ce verset.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant la tournure moins naturelle «avec la résolution de mon âme».
