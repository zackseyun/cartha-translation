  source_fidelity: Le sens de la succession (« Après cela »), du repentir, de sa durée (« pendant sept ans ») et de son orientation « devant le Seigneur » est fidèlement rendu. La préposition ἐν et le syntagme ἐν προαιρέσει ψυχῆς μου expriment une disposition ou résolution intérieure délibérée; « avec une ferme résolution intérieure » le rend sans la construction française calquée « dans la ... de mon âme ».
