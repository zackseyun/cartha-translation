  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: fr
  text: 'Et il leur dit : « Mes enfants, voici que je meurs et que je prends le chemin de mes pères. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: Mes enfants
  rationale: Rend directement l’adresse affectueuse et solennelle du grec dans un français naturel.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la valeur présentative et emphatique de l’expression grecque sans recourir à l’archaïsme « voici, je ».
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: je prends le chemin de mes pères
  rationale: Reproduit l’image idiomatique de la mort comme départ sur le chemin suivi par les ancêtres, tout en restant intelligible en français moderne.
theological_decisions:
- issue: Sens de « mes pères »
  choice: Conserver « mes pères »
  alternative: mes ancêtres
  rationale: Le grec dit littéralement « mes pères ». Cette formulation maintient la portée familiale et traditionnelle de l’expression sans en préciser davantage le référent.
translation_notes:
  register: Français moderne, digne et accessible. La coordination répétée par « et que » reflète les deux verbes grecs, tandis que « prends le chemin » restitue naturellement l’image de πορεύομαι ὁδόν.
