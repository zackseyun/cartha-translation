  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: fr
  text: Et voici qu’aujourd’hui, je prends à témoin contre vous le Dieu du ciel, afin que vous ne marchiez pas dans l’ignorance de la jeunesse ni dans l’inconduite sexuelle, où je me suis laissé emporter, souillant ainsi le lit de mon père Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν
  choice: je prends à témoin contre vous le Dieu
  rationale: La construction exprime un appel solennel à Dieu comme témoin, avec une portée d’avertissement dirigée vers les fils de Ruben.
- source_word: πορευθῆτε
  choice: vous marchiez
  rationale: Conserve la métaphore biblique de la conduite de vie tout en restant intelligible en français moderne.
- source_word: ἀγνοίᾳ νεότητος
  choice: l’ignorance de la jeunesse
  rationale: Traduction directe qui maintient l’idée d’un manque de discernement propre à la jeunesse sans l’atténuer en simple inexpérience.
- source_word: πορνείᾳ
  choice: inconduite sexuelle
  rationale: Rend le sens large de conduite sexuelle illicite dans un français actuel et digne.
- source_word: ἐξεχύθην
  choice: je me suis laissé emporter
  rationale: Le passif littéral « j’ai été répandu » serait obscur en français; dans ce contexte, l’expression évoque un abandon débordant à l’inconduite.
- source_word: ἐμίανα κοίτην
  choice: souillant ainsi le lit
  rationale: Préserve l’image concrète et la gravité cultuelle et morale de μιαίνω; le participe français relie naturellement cet acte à l’inconduite précédente.
theological_decisions:
- issue: Portée de l’appel à Dieu comme témoin
  choice: contre vous
  alternative: devant vous
  rationale: Le datif ὑμῖν peut être compris de plusieurs façons, mais le contexte testamentaire d’avertissement et la valeur de ἐπιμαρτύρομαι soutiennent la nuance solennelle et accusatrice « contre vous ».
- issue: Rapport entre l’emportement et la souillure du lit paternel
  choice: où je me suis laissé emporter, souillant ainsi
  alternative: dans laquelle je me suis répandu et j’ai souillé
  rationale: Cette formulation rend la relation contextuelle sans transformer l’inconduite en agent explicite ni préciser davantage le mécanisme moral que ne le fait le grec.
translation_notes:
  register: Français international moderne, solennel et accessible. La syntaxe conserve le ton testamentaire et l’image biblique de « marcher », tout en évitant le littéralisme obscur de ἐξεχύθην.
