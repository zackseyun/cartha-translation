  source_fidelity: 'Le sens de la phrase grecque est bien conservé : le repère est fixé deux ans après la mort de Joseph, Ruben tombe malade, puis ses fils et ses petits-fils se réunissent pour le visiter. Le possessif αὐτοῦ est correctement rapporté à Ruben dans « Ses fils et les fils de ses fils ».'
