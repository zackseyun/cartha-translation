  text: Two years after the death of Joseph his brother, when Reuben had fallen sick, his sons and the sons of his sons gathered to visit him.
translation:
  language: fr
  text: Deux ans après la mort de son frère Joseph, Ruben tomba malade. Ses fils et les fils de ses fils se rassemblèrent alors pour lui rendre visite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς
  choice: Deux ans après la mort
  rationale: Rend naturellement la construction temporelle grecque; τελευτή désigne ici la mort.
- source_word: ἀρρωστήσαντος Ῥουβήμ
  choice: Ruben tomba malade
  rationale: Une proposition indépendante est plus claire en français moderne tout en conservant la circonstance temporelle de l’aoriste participial.
- source_word: συνήχθησαν
  choice: se rassemblèrent
  rationale: Préserve le sens de réunion exprimé par le verbe grec, avec une tournure idiomatique.
- source_word: ἐπισκέψασθαι αὐτόν
  choice: pour lui rendre visite
  rationale: Dans le contexte d’une maladie, cette expression rend le sens de venir voir ou visiter quelqu’un.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: Ses fils et les fils de ses fils
  rationale: Suit explicitement la formulation grecque et rattache les possessifs à Ruben.
