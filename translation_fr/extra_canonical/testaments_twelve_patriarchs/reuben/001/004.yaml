  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: fr
  text: 'Puis, voyant là Juda, Gad et Aser, ses frères, il leur dit : « Relevez-moi, afin que je dise à mes frères et à mes enfants ce que je garde caché dans mon cœur ; car voici que je m’éteins maintenant. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: voyant
  rationale: Rend directement le participe aoriste grec tout en s’intégrant naturellement à la narration française.
- source_word: Ἀναστήσατέ με
  choice: Relevez-moi
  rationale: Exprime l’ordre de redresser ou d’aider à se relever le mourant, sans suggérer ici une résurrection.
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου κρυπτά
  choice: ce qui est caché dans mon cœur
  rationale: Formulation française naturelle qui conserve l’image du contenu secret gardé dans le cœur.
- source_word: ἐκλείπω
  choice: je m’en vais
  rationale: Dans ce contexte de derniers instants, le verbe indique qu’il cesse de vivre ou disparaît. « Je m’en vais » rend dignement l’imminence de la mort sans la surinterpréter.
theological_decisions:
- issue: Sens de ἀναστήσατε dans une scène de mort
  choice: Relevez-moi
  alternative: Faites-moi lever
  rationale: Le contexte décrit une aide physique apportée à Ruben encore vivant ; la traduction évite de donner au verbe un sens technique de résurrection.
- issue: Degré d’explicitation de ἐκλείπω
  choice: je m’en vais
  alternative: je suis sur le point de mourir
  rationale: Le choix conserve l’euphémisme et une part de la latitude du grec, tout en étant immédiatement intelligible dans une scène d’adieu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité testamentaire sans calquer lourdement l’ordre grec. « Car voici que » conserve la force discursive de ἰδοὺ γάρ.
