base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: fr
  text: J’avais en effet trente ans lorsque j’ai fait le mal devant le Seigneur, et, pendant sept mois, je me suis affaibli au point d’en mourir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπραξα τὸ πονηρόν
  choice: j’ai fait le mal
  rationale: Rend naturellement l’expression grecque sans ajouter « la mauvaise chose » ni préciser davantage la nature du mal.
- source_word: ἐνώπιον Κυρίου
  choice: devant le Seigneur
  rationale: Conserve l’image relationnelle et judiciaire de l’expression grecque.
- source_word: ἐμαλακίσθην
  choice: je me suis affaibli
  rationale: Exprime l’affaiblissement physique indiqué par le passif grec dans un français courant et digne.
- source_word: ἕως θανάτου
  choice: au point d’en mourir
  rationale: Rend la progression jusqu’à la mort de manière idiomatique, sans affirmer explicitement que la mort a effectivement eu lieu.
theological_decisions:
- issue: Portée de τὸ πονηρόν
  choice: le mal
  alternative: la mauvaise action
  rationale: « Le mal » préserve la formulation générale du grec et évite d’imposer une interprétation plus précise.
- issue: Sens de ἕως θανάτου
  choice: au point d’en mourir
  alternative: jusqu’à la mort
  rationale: Dans ce contexte autobiographique, la formule décrit un affaiblissement potentiellement mortel; la traduction choisie maintient cette tension sans suggérer que Ruben est effectivement mort.
translation_notes:
  register: Français moderne international, simple et digne. La coordination et la ponctuation suivent de près le mouvement de la phrase grecque tout en restant naturelles.
