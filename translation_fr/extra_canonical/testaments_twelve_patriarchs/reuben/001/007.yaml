  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/007.yaml
  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: fr
  text: Or, je vous le dis, il m’a frappé d’un grave mal au flanc pendant sept mois. Si mon père Jacob n’avait pas prié le Seigneur en ma faveur, le Seigneur m’aurait ôté la vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  choice: il m’a frappé d’un mal terrible
  rationale: La tournure française conserve l’idée d’une atteinte sévère tout en évitant le calque peu naturel « frappé d’un grand coup »; πληγή peut désigner une plaie, un fléau ou une grave affliction.
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: au flanc
  rationale: λαγών désigne le flanc ou la région des reins; « au flanc » reste anatomiquement sobre et naturel sans préciser davantage que le grec.
- source_word: ἕως μῆνας ἑπτά
  choice: pendant sept mois
  rationale: Dans ce contexte de durée, le grec indique que l’affliction s’est prolongée jusqu’à une durée de sept mois; le français idiomatique exprime cette durée par « pendant sept mois ».
- source_word: ἀνελεῖν με
  choice: me faire mourir
  rationale: ἀναιρέω signifie ici ôter la vie ou mettre à mort. « Me faire mourir » rend clairement ce sens sans suggérer une destruction matérielle.
theological_decisions:
- issue: Valeur de ἤθελε dans l’apodose irréelle
  choice: le Seigneur m’aurait fait mourir
  alternative: le Seigneur aurait voulu me faire mourir
  rationale: Avec la condition irréelle « si… n’avait pas », ἤθελε suivi de l’infinitif fonctionne naturellement comme une expression périphrastique de ce qui se serait produit. La formulation retenue rend l’issue contrefactuelle sans attribuer séparément au Seigneur un simple désir non accompli.
- issue: Référent du sujet implicite de ἔπληξέ
  choice: il
  alternative: le Seigneur
  rationale: Le grec laisse le sujet sous-entendu. Le pronom préserve cette dépendance au contexte au lieu d’expliciter une identification absente de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est allégée en deux phrases pour rendre clairement l’affliction et la condition irréelle, tout en maintenant le sujet implicite du premier verbe.
