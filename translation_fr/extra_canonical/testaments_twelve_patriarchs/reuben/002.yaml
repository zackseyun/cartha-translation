revisions:
- from: 'Et maintenant, mes enfants, écoutez-moi vous raconter ce que j’ai vu au sujet des sept esprits d’égarement[a] pendant ma repentance. Sept esprits ont donc été donnés contre l’être humain, et ce sont les principes directeurs des œuvres propres à la jeunesse[b].


    Sept autres esprits lui ont été donnés lors de la création, afin que toute activité humaine réside en eux. Le premier est l’esprit de vie, par lequel la constitution de la personne est formée. Le deuxième est l’esprit de la vue, par lequel naît le désir. Le troisième est l’esprit de l’ouïe, par lequel vient l’instruction. Le quatrième est l’esprit de l’odorat, par lequel des sensations gustatives sont produites pour l’aspiration de l’air et le souffle[c]. Le cinquième est l’esprit de la parole, par lequel vient la connaissance. Le sixième est l’esprit du goût, par lequel on consomme aliments et boissons, et grâce auquel la force se forme, car les aliments sont le fondement de la force. Le septième est l’esprit de la procréation et des rapports sexuels, par lequel les péchés se rassemblent sous l’effet de l’amour du plaisir. C’est pourquoi cet esprit est le dernier dans la création et le premier dans la jeunesse : il est rempli d’ignorance et conduit le jeune homme comme un aveugle vers
    une fosse et comme une bête vers un précipice.'
