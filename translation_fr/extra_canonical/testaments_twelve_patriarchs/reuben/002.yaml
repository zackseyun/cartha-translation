  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002.yaml
  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, écoutez ce que j’ai vu au sujet des sept esprits d’égarement[a] lors de ma repentance. Sept esprits ont donc été donnés contre l’être humain, et ce sont les principes directeurs des œuvres propres à la jeunesse[b].


    Sept autres esprits lui ont été donnés lors de la création, afin que toute œuvre humaine se trouve en eux. Le premier est l’esprit de vie, par lequel la constitution de la personne est formée. Le deuxième est l’esprit de la vue, par lequel naît le désir. Le troisième est l’esprit de l’ouïe, par lequel vient l’instruction. Le quatrième est l’esprit de l’odorat, par lequel des goûts sont produits pour l’aspiration de l’air et le souffle[c]. Le cinquième est l’esprit de la parole, par lequel vient la connaissance. Le sixième est l’esprit du goût, par lequel se produit la consommation d’aliments et de boissons, et en lui se forme la force, car les aliments sont le fondement de la force. Le septième est l’esprit de la procréation et des rapports sexuels, par lequel les péchés se rassemblent par l’amour du plaisir. C’est pourquoi cet esprit est le dernier dans la création et le premier dans la jeunesse : il est rempli d’ignorance et conduit le jeune homme comme un aveugle vers une fosse et
    comme une bête vers un précipice.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esprits d’erreur » ou « esprits de tromperie ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les têtes des œuvres de la jeunesse ». L’expression semble désigner les sources principales ou les principes directeurs des actes propres à la jeunesse.'
    reason: lexical_alternative
  - marker: c
    text: La formulation grecque qui associe l’odorat, les goûts et l’aspiration de l’air est difficile et pourrait refléter un texte condensé ou instable.
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  choice: esprits d’égarement
  rationale: πλάνη peut exprimer l’égarement, l’erreur ou la tromperie. « Égarement » garde à la fois l’idée de déviation et celle d’une puissance qui induit en erreur, sans préciser indûment si ces esprits trompent activement.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: pendant ma repentance
  rationale: Dans ce cadre testamentaire et confessionnel, μετανοία désigne une repentance morale liée au péché reconnu, et non un simple changement d’avis.
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: contre l’être humain
  rationale: κατά avec le génitif marque ici l’opposition. « L’être humain » rend le singulier générique ἄνθρωπος en français international inclusif.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: les principes directeurs des œuvres propres à la jeunesse
  rationale: κεφαλαί est métaphorique et désigne les éléments principaux ou directeurs. νεωτερισμός renvoie ici aux comportements ou impulsions caractéristiques de la jeunesse, non à l’innovation en général.
- source_word: ἐπὶ τῆς κτίσεως
  choice: lors de la création
  rationale: La formule indique le moment ou le cadre de l’octroi de ces esprits et conserve la perspective cosmologique du passage.
- source_word: σύστασις
  choice: constitution de la personne
  rationale: σύστασις évoque la composition ou la structure constituée de l’être humain. L’ajout « de la personne » évite le sens politique moderne de « constitution ».
- source_word: ἐπιθυμία
  choice: désir
  rationale: Le mot peut être neutre ou négatif selon le contexte. « Désir » préserve cette amplitude sans le réduire d’emblée à la convoitise sexuelle.
- source_word: διδασκαλία
  choice: instruction
  rationale: L’ouïe est présentée comme le moyen par lequel une personne reçoit un enseignement; « instruction » convient à ce sens réceptif.
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: des sensations gustatives sont produites pour l’aspiration de l’air et le souffle
  rationale: Le grec est difficile et probablement instable. La traduction reste proche de ses éléments lexicaux tout en signalant en note l’obscurité du lien entre odorat, goûts et respiration.
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: le fondement de la force
  rationale: Dans ce contexte physiologique non technique, ὑπόστασις désigne ce qui soutient ou fonde la force. « Substance » risquerait d’importer une coloration théologique ultérieure.
- source_word: σπορᾶς καὶ συνουσίας
  choice: de la procréation et des rapports sexuels
  rationale: σπορά renvoie à l’engendrement ou à l’émission de semence et συνουσία à l’union sexuelle; la formulation choisie est explicite, digne et actuelle.
- source_word: διὰ τῆς φιληδονίας
  choice: sous l’effet de l’amour du plaisir
  rationale: φιληδονία désigne littéralement l’amour du plaisir. Cette traduction conserve la portée morale générale plutôt que de la limiter à la sensualité.
theological_decisions:
- issue: Sens de μετανοία dans le cadre confessionnel
  choice: pendant ma repentance
  alternative: lors de mon changement d’esprit
  rationale: Le locuteur interprète ce qu’il a vu à la lumière d’un péché reconnu; « repentance » conserve donc la dimension morale du contexte.
- issue: Statut du passage décrivant les sept esprits créés
  choice: inclus dans le texte principal
  alternative: relégué en note comme développement secondaire
  rationale: Le témoin grec fourni contient ce passage. Il convient de le traduire sans l’exclure sur la base d’une hypothèse rédactionnelle.
- issue: Nature des « esprits » donnés lors de la création
  choice: conserver le terme « esprits » sans les définir davantage
  alternative: les interpréter explicitement comme des facultés humaines
  rationale: La liste les associe clairement à des facultés, mais le texte les nomme πνεύματα. La traduction préserve cette formulation et son anthropologie particulière sans la systématiser.
- issue: Portée morale du désir et du plaisir
  choice: employer les termes généraux « désir » et « amour du plaisir »
  alternative: rendre par « convoitise » et « débauche »
  rationale: Le grec n’impose pas partout une qualification exclusivement sexuelle ou intrinsèquement mauvaise; le contexte fournit lui-même la progression vers le péché.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve la répétition structurante de « l’esprit » ainsi que les affirmations anthropologiques inhabituelles du grec. Les formulations explicitement sexuelles restent sobres. Les ambiguïtés lexicales ou textuelles importantes sont signalées sans harmonisation doctrinale.
