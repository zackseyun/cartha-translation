  rationale: Révision limitée pour améliorer l’exactitude et la fluidité sans résoudre les obscurités du témoin grec. Elle supprime une addition narrative, rend plus naturellement le cadre de la repentance, restitue plus exactement la construction étrange selon laquelle toute œuvre humaine est « en » les sept esprits créés, et préserve au sixième esprit la syntaxe passive et le locatif du grec. Les notes restent ancrées aux endroits pertinents et continuent de signaler l’incertitude de la phrase sur l’odorat.
