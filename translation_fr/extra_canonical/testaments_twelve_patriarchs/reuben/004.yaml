  terminology: Les noms Joseph, Béliar et Hadès sont bien traités. Les choix pour πορνεία, ἁπλότης καρδίας, φόβος κυρίου et φάρμακα sont recevables. Les notes sur la lacune des vv. 2–4, sur πρόσκομμα τῷ Βελίαρ et sur φάρμακα sont correctement ancrées. La note finale conserve à juste titre l’ambiguïté de la construction grecque.
