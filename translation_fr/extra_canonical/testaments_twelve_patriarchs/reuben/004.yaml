base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004.yaml
  text: '1[a]. Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.


    2[b]. For until my father''s death I did not have the boldness to look my father in the face.


    3. And because of the reproach of my sin, my mind was continually consumed within me.


    4. For seven months I was sick unto death, and after I had repented with purpose of soul before the Lord, the spirit of jealousy departed from me. Until now I have kept myself on guard, and I have not sinned.


    5. Therefore, my children, I tell you: keep everything that I command you, and you will certainly not sin.


    6. For the sin of sexual immorality is a pit for the soul, separating it from God and bringing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.


    7. For sexual immorality has destroyed many. Whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.


    8. For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from every kind of sexual immorality, and found favor before God and men.


    9. For the Egyptian woman did many things against him, and called in magicians and brought him potions; but Joseph guarded himself from every evil desire and did not accept the counsel of his soul toward wicked lust.


    10[c][d]. Therefore the God of your fathers delivered him from every hidden evil and from death.'
translation:
  language: fr
  text: '1. Ainsi donc, mes enfants, ne prêtez pas attention à la beauté des femmes et ne vous attardez pas sur leur conduite. Marchez plutôt dans la simplicité du cœur et dans la crainte du Seigneur, en vous appliquant aux bonnes œuvres, à l’étude et à vos troupeaux, jusqu’à ce que le Seigneur vous donne une épouse selon son vouloir, afin que vous ne souffriez pas comme moi.


    2. Jusqu’à la mort de mon père, en effet, je n’ai pas eu l’assurance de regarder mon père en face.[a]


    3. À cause de la honte attachée à mon péché, mon esprit se consumait sans cesse au-dedans de moi.


    4. Pendant sept mois, j’ai été malade au point d’en mourir. Après que je me suis repenti devant le Seigneur avec une ferme résolution intérieure, l’esprit de jalousie s’est éloigné de moi.[b] Jusqu’à maintenant, je me suis tenu sur mes gardes et je n’ai pas péché.


    5. C’est pourquoi, mes enfants, je vous le dis : gardez tout ce que je vous commande, et vous ne pécherez certainement pas.


    6. Car le péché d’inconduite sexuelle est une fosse pour l’âme : il la sépare de Dieu et la rapproche des idoles. C’est lui qui égare l’esprit et l’intelligence, et qui fait descendre les jeunes gens dans l’Hadès avant leur temps.


    7. L’inconduite sexuelle en a fait périr beaucoup. Qu’un homme soit vieux ou de noble naissance, riche ou pauvre, il s’attire le reproche des êtres humains et apporte une pierre d’achoppement à Béliar.[c]


    8. Vous avez entendu parler de Joseph : il s’est gardé d’une femme, a purifié ses pensées de toute inconduite sexuelle et a trouvé grâce devant Dieu et devant les êtres humains.


    9. L’Égyptienne a pourtant employé contre lui de nombreux moyens : elle a fait venir des magiciens et lui a présenté des potions.[d] Mais Joseph s’est gardé de tout mauvais désir et n’a pas accueilli le conseil de son âme qui le poussait à une convoitise mauvaise.


    10. C’est pourquoi le Dieu de vos pères l’a délivré de tout mal caché et de la mort.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni est endommagé ou tronqué à cet endroit. Le sens transmis est que, honteux de son péché, Ruben n’avait pas l’assurance de regarder son père en face jusqu’à la mort de celui-ci.
    reason: textual_variant
  - marker: b
    text: Dans la source fournie, le passage allant de la fin du verset 2 au milieu du verset 4 est lacunaire. La mention des sept mois de maladie, de la repentance et du départ de l’esprit de jalousie suit avec prudence le sens grec transmis pour cette section.
    reason: textual_variant
  - marker: c
    text: L’expression grecque traduite par « une pierre d’achoppement à Béliar » est difficile. Elle est conservée au plus près plutôt que remplacée par une paraphrase interprétative.
    reason: lexical_alternative
  - marker: d
    text: Le grec φάρμακα peut désigner des drogues, des remèdes, des potions ou des préparations magiques. La présence de magiciens dans le contexte appuie ici la traduction « potions ».
    reason: lexical_alternative
  - marker: e
    text: La syntaxe grecque de la fin du verset est difficile et peut aussi être comprise comme une référence à une mort mauvaise et cachée. La traduction retient prudemment deux dangers coordonnés.
    reason: textual_variant
lexical_decisions:
- source_word: προσέχετε
  choice: prêtez attention à
  rationale: L’impératif met en garde contre l’attention accordée à une beauté séduisante; cette formulation reste directe et naturelle.
- source_word: ἐννοεῖσθε
  choice: vous attardez sur
  rationale: Le verbe désigne ici une préoccupation intérieure prolongée, et non une simple perception.
- source_word: ἁπλότητι καρδίας
  choice: dans la simplicité du cœur
  rationale: La formulation conserve l’expression morale traditionnelle et son contraste avec un désir partagé ou détourné.
- source_word: φόβῳ κυρίου
  choice: dans la crainte du Seigneur
  rationale: Cette expression biblique reconnaissable préserve la force religieuse du grec sans l’atténuer en simple respect.
- source_word: γράμμασι
  choice: à l’étude
  rationale: Le sens littéral est « lettres »; dans cette série d’occupations disciplinées, le mot renvoie vraisemblablement à l’instruction ou à l’étude.
- source_word: σύζυγον
  choice: l’épouse
  rationale: Dans cette exhortation d’un père à ses fils, « épouse » rend directement le partenaire conjugal visé.
- source_word: παρρησίαν
  choice: l’assurance
  rationale: Le terme exprime la liberté confiante de paraître ou de parler ouvertement; le contexte est celui du courage de regarder son père en face.
- source_word: πορνεία
  choice: inconduite sexuelle
  rationale: Cette expression française actuelle garde la portée générale du terme sans la limiter à une seule forme de faute sexuelle.
- source_word: βόθρος
  choice: fosse
  rationale: Le choix maintient l’image concrète d’un piège profond menaçant l’âme.
- source_word: ᾅδην
  choice: l’Hadès
  rationale: La translittération préserve l’imagerie du monde des morts propre au texte sans introduire la charge doctrinale de « enfer ».
- source_word: φάρμακα
  choice: potions
  rationale: Le mot peut désigner des drogues, remèdes ou préparations magiques; la mention des magiciens favorise ici « potions ».
- source_word: Βελίαρ
  choice: Béliar
  rationale: La forme française translittère le nom grec et évite de le remplacer par une interprétation telle que « le diable ».
theological_decisions:
- issue: Rapport entre l’inconduite sexuelle et l’idolâtrie
  choice: elle sépare l’âme de Dieu et la rapproche des idoles
  alternative: elle conduit l’âme à l’idolâtrie
  rationale: Le grec exprime une séparation et un rapprochement. La traduction conserve ce mouvement sans transformer la proximité en identité doctrinale complète.
- issue: Sens de ᾅδης
  choice: l’Hadès
  alternative: le séjour des morts; l’enfer
  rationale: « Hadès » préserve le terme et l’imagerie du texte grec, tandis que « enfer » imposerait une interprétation eschatologique plus précise.
- issue: Expression difficile πρόσκομμα τῷ Βελίαρ
  choice: une pierre d’achoppement pour Béliar
  alternative: une occasion de chute venant de Béliar
  rationale: La relation exacte indiquée par le datif demeure obscure. La traduction suit étroitement la construction grecque et signale la difficulté en note.
- issue: Conseil intérieur au verset 9
  choice: le conseil de son âme qui le poussait à une convoitise mauvaise
  alternative: le dessein de son âme, un mauvais désir
  rationale: La syntaxe transmise est difficile. La formulation française rend le mouvement intérieur sans identifier l’âme elle-même au mal ni supprimer la tension du texte.
- issue: Conclusion du verset 10
  choice: de tout mal caché et de la mort
  alternative: de toute mort mauvaise et cachée
  rationale: La fin grecque est syntaxiquement resserrée et textuellement difficile. Le choix suit prudemment le sens attesté par la tradition consultée, avec une note transparente.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs gardent leur force exhortative; les termes bibliques structurants (« crainte du Seigneur », « grâce », « Hadès ») sont conservés. Les formulations archaïques ou confessionnellement chargées sont évitées, tandis que les difficultés textuelles des versets 2–4, 7, 9 et 10 sont rendues visibles.
