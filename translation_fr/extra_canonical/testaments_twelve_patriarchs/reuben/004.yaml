  - severity: low
    issue: Prédication au v. 7
    rationale: « Devient une pierre d’achoppement » transforme le verbe φέρει (« porte/apporte ») en verbe d’état. « Apporte une pierre d’achoppement à Béliar » conserve la formulation difficile tout en restant lisible.
