id: T12P.REU.2.4
reference: Testament of Reuben 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: fr
  text: Le premier est l’esprit de vie, avec lequel la constitution est formée. Le deuxième est l’esprit de la vue, avec lequel naît le désir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  choice: l’esprit de vie
  rationale: Rend directement l’expression grecque tout en conservant sa portée anthropologique dans l’énumération des esprits.
- source_word: σύστασις
  choice: l’organisme
  rationale: Dans ce contexte de formation de la personne, « organisme » exprime une constitution corporelle organisée plus naturellement que le calque ambigu « constitution ».
- source_word: κτίζεται
  choice: est constitué
  rationale: Conserve le passif et l’idée de formation ou de création, avec une formulation française naturelle.
- source_word: πνεῦμα ὁράσεως
  choice: l’esprit de la vue
  rationale: Traduction formellement proche qui maintient le lien avec la faculté de voir.
- source_word: ἐπιθυμία
  choice: le désir
  rationale: Terme général qui préserve l’ambivalence du grec, sans préciser indûment s’il s’agit de convoitise ou d’un désir neutre.
- source_word: γίνεται
  choice: naît
  rationale: Rend idiomatiquement l’idée qu’un désir vient à l’existence ou surgit.
theological_decisions:
- issue: Valeur morale de ἐπιθυμία
  choice: le désir
  alternative: la convoitise
  rationale: Le grec peut désigner un désir général ou mauvais selon le contexte; « désir » évite d’introduire ici une qualification morale que la phrase ne formule pas explicitement.
- issue: Nature de σύστασις
  choice: l’organisme
  alternative: la constitution
  rationale: Le contexte anthropologique favorise la constitution organisée de l’être humain, mais le texte ne précise pas « corps » ni « personne »; « organisme » reste concret sans ajouter l’un de ces référents.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle des deux phrases et la répétition de « avec lequel » reflètent μεθ’ ἧς sans lisser le rapport instrumental ou concomitant.
