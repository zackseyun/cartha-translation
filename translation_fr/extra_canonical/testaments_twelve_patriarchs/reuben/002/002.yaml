  text: Then seven spirits were given against man, and these are the heads of the works of youthfulness[b].
translation:
  language: fr
  text: Sept esprits furent donc donnés contre l’être humain, et ce sont eux qui sont à la tête des œuvres de la jeunesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est littéralement « les têtes des œuvres de la jeunesse ». Elle peut désigner les principales sources ou les principes directeurs des actes fautifs propres à la jeunesse; le terme traduit par « jeunesse » peut aussi évoquer la nouveauté ou un comportement novateur et turbulent.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: contre l’être humain
  rationale: Conserve la valeur hostile ou oppositive de κατά avec le génitif, tout en rendant ἄνθρωπος de manière générique en français moderne.
- source_word: αἱ κεφαλαὶ
  choice: ceux qui sont à la tête
  rationale: Exprime naturellement l’image des « têtes » comme principes directeurs ou sources principales sans en fixer excessivement le sens.
- source_word: τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: des œuvres de la jeunesse
  rationale: Préserve la construction génitive et l’idée contextuelle des actes propres à la jeunesse; une note signale l’ambiguïté de νεωτερισμός.
theological_decisions:
- issue: Nature et fonction des sept esprits
  choice: sept esprits furent donnés contre l’être humain
  alternative: sept esprits furent assignés à l’être humain
  rationale: Le grec κατὰ τοῦ ἀνθρώπου indique le plus naturellement une orientation hostile; la traduction ne précise ni leur origine ni leur statut théologique au-delà du texte.
translation_notes:
  register: Français moderne, international et digne. La formulation « ceux qui sont à la tête » garde la métaphore de la tête sous une forme idiomatique; « l’être humain » rend le générique sans limiter le propos au sexe masculin.
