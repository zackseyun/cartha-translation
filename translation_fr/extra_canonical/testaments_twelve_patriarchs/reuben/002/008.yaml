source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕβδομον πνεῦμα σπορᾶς καὶ συνουσίας²⁷, μεθ’ ἧς συνέρχονται²⁸ διὰ τῆς φιληδονίας²⁹ ἁμαρτίαι³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: fr
  text: Le septième est l’esprit de la procréation et de l’union sexuelle[a], à laquelle les péchés se joignent par amour du plaisir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vie commune », « fréquentation intime » ou « rapports sexuels ». Dans ce contexte, le terme grec évoque probablement l’union sexuelle.'
    reason: Signaler l’étendue sémantique de συνουσία et préserver l’ambiguïté réelle du mot tout en justifiant le choix contextuel du texte principal.
lexical_decisions:
- source_word: σπορᾶς
  choice: procréation
  rationale: Dans ce contexte, le terme désigne l’engendrement ou la reproduction plutôt que la simple semence; « procréation » est clair et digne en français moderne.
- source_word: συνουσίας
  choice: union sexuelle
  rationale: Le mot peut désigner la fréquentation ou l’union, mais, associé ici à σπορά et au plaisir, il a vraisemblablement un sens sexuel. « Union sexuelle » reste moins clinique que « rapports sexuels » tout en rendant ce sens explicite.
- source_word: συνέρχονται
  choice: se joignent
  rationale: Le verbe exprime l’idée de venir ou de se réunir avec. « Se joignent » conserve cette image sans suggérer que les péchés naissent nécessairement de l’union sexuelle.
- source_word: φιληδονίας
  choice: amour du plaisir
  rationale: Traduction directe du goût ou de l’amour du plaisir, sans ajouter une qualification morale absente du terme lui-même.
theological_decisions:
- issue: Rapport entre l’union sexuelle et les péchés
  choice: « à laquelle les péchés se joignent »
  alternative: « par laquelle les péchés surviennent »
  rationale: Le grec μεθ’ ἧς signifie littéralement « avec laquelle » et ne présente pas sans ambiguïté l’union sexuelle comme la cause instrumentale du péché. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la personnification des péchés et le lien grammatical de μεθ’ ἧς avec le nom féminin « union sexuelle ».
