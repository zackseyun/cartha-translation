  text: Καὶ ἕτερα¹³ ἑπτὰ πνεύματα ἐδόθη¹³ Γαὐτῷ¹¹⁴ *ἐπὶ τῆς κτίσεως¹⁵ τοῦ εἶναι ἐν αὐτοῖς πᾶν ἔργον ἀνθρώπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/003.yaml
  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: fr
  text: Et sept autres esprits lui furent donnés lors de la création, afin que toute œuvre humaine soit en eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερα ἑπτὰ πνεύματα
  choice: sept autres esprits
  rationale: Rend directement le grec et conserve le lien avec les esprits mentionnés dans le contexte précédent.
- source_word: ἐδόθη αὐτῷ
  choice: lui furent donnés
  rationale: Préserve le passif grec sans préciser l’agent implicite.
- source_word: ἐπὶ τῆς κτίσεως
  choice: lors de la création
  rationale: Expression française naturelle qui rend ici la valeur temporelle probable de ἐπί avec le génitif.
- source_word: πᾶν ἔργον ἀνθρώπου
  choice: toute activité humaine
  rationale: ἔργον désigne ici largement ce que l’être humain accomplit; «activité humaine» est plus naturel et inclusif que le calque «œuvre de l’homme».
- source_word: ἐν αὐτοῖς
  choice: par eux
  rationale: Dans ce contexte instrumental, le français «par eux» exprime naturellement que les activités humaines s’exercent au moyen de ces esprits.
theological_decisions:
- issue: Nature et fonction des sept esprits
  choice: Conserver «esprits» et leur rôle médiateur sans les identifier davantage
  alternative: Les interpréter comme des facultés, des dispositions ou des puissances particulières
  rationale: Le verset les appelle πνεύματα et ne donne pas ici assez d’éléments pour imposer une identification doctrinale précise.
- issue: Agent du don
  choice: Maintenir la tournure passive «furent donnés»
  alternative: Expliciter «Dieu lui donna»
  rationale: Le grec ne nomme pas l’agent; l’expliciter résoudrait une donnée laissée implicite par le texte.
translation_notes:
  register: Français moderne, clair et digne. La phrase garde la structure logique du grec tout en évitant le calque peu idiomatique «que toute œuvre de l’homme soit en eux».
