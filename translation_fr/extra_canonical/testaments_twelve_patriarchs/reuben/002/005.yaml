- from: Le troisième est l’esprit de l’ouïe, par lequel vient l’instruction. Le quatrième est l’esprit de l’odorat, avec lequel des goûts sont donnés pour aspirer l’air et respirer.[a]
  to: Le troisième est l’esprit de l’ouïe, par lequel vient l’instruction. Le quatrième est l’esprit de l’odorat, par lequel des goûts sont donnés en vue de l’aspiration de l’air et de la respiration.[a]
