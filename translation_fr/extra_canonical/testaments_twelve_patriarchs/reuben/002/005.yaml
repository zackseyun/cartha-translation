  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
translation:
  language: fr
  text: Le troisième est l’esprit de l’ouïe, par lequel vient l’instruction. Le quatrième est l’esprit de l’odorat, par lequel des goûts sont donnés en vue de l’aspiration de l’air et de la respiration.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation grecque qui associe l’odorat, les goûts, l’aspiration de l’air et la respiration est difficile et pourrait refléter un texte condensé ou instable.
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  choice: l’esprit de l’ouïe
  rationale: Rend formellement l’expression grecque tout en restant naturelle dans l’énumération des facultés sensorielles.
- source_word: μεθ’ ἧς γίνεται διδασκαλία
  choice: par lequel vient l’instruction
  rationale: Préserve le sens littéral de γίνεται et le lien entre l’ouïe et l’acquisition de l’instruction, sans préciser davantage le mécanisme.
- source_word: πνεῦμα ὀσφρήσεως
  choice: l’esprit de l’odorat
  rationale: Correspond directement à l’expression grecque et maintient le parallélisme avec « l’esprit de l’ouïe ».
- source_word: γεύσεις δεδομέναι
  choice: des goûts sont donnés
  rationale: Conserve le passif et la valeur de δεδομέναι plutôt que de le remplacer par « produits »; « goûts » maintient l’étrange association sensorielle du texte.
- source_word: εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: pour aspirer l’air et respirer
  rationale: Exprime naturellement en français la traction ou l’inspiration de l’air et la respiration, tout en évitant de surinterpréter une formulation grecque difficile.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de l’énumération est conservé, de même que l’étrangeté réelle de la seconde proposition; la note signale la difficulté textuelle sans la résoudre conjecturalement.
