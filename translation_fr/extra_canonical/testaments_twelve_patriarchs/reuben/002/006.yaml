  text: The fifth is the spirit of speech, by which knowledge comes to be.
translation:
  language: fr
  text: Le cinquième est l’esprit de la parole, par laquelle advient la connaissance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέμπτον πνεῦμα
  choice: Le cinquième est l’esprit
  rationale: Le grec présente elliptiquement le cinquième élément de l’énumération; l’ajout de « est » donne une phrase française naturelle sans modifier le sens.
- source_word: λαλιᾶς
  choice: de la parole
  rationale: Dans ce contexte, le terme désigne la faculté ou l’acte de parler; « parole » conserve une formulation sobre et digne.
- source_word: μεθ’ ἧς
  choice: par laquelle
  rationale: Littéralement « avec laquelle »; la tournure française exprime ici le moyen ou l’intermédiaire naturel associé à la parole.
- source_word: γίνεται γνῶσις
  choice: vient la connaissance
  rationale: Cette formulation garde l’idée dynamique de γίνομαι (« venir à l’existence, advenir ») sans réduire le texte à une simple acquisition personnelle du savoir.
