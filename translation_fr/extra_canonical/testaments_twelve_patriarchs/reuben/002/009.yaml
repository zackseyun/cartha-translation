base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: fr
  text: C’est pourquoi cet esprit est le dernier dans l’ordre de la création et le premier durant la jeunesse, parce qu’il est rempli d’ignorance. Celle-ci conduit le plus jeune comme un aveugle dans une fosse et comme une bête au bord d’un précipice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ἐστι τῆς κτίσεως
  choice: est le dernier dans l’ordre de la création
  rationale: Le génitif grec exprime ici vraisemblablement la place de cet esprit parmi les éléments créés; «dans l’ordre de» rend ce rapport clairement sans préciser davantage la cosmologie implicite.
- source_word: πρῶτον τῆς νεότητος
  choice: le premier durant la jeunesse
  rationale: La tournure conserve le contraste «dernier/premier» et comprend le génitif comme désignant la période où cet esprit se manifeste en premier, conformément au contexte.
- source_word: ἀγνοίας πεπλήρωται
  choice: il est rempli d’ignorance
  rationale: Traduction directe du parfait passif, avec un vocabulaire français courant qui préserve l’état résultant.
- source_word: τὸν νεώτερον
  choice: le plus jeune
  rationale: Le comparatif substantivé peut signifier «le plus jeune» ou «le jeune homme». «Le plus jeune» maintient explicitement la valeur comparative relevée par la révision anglaise.
- source_word: βόθρον
  choice: une fosse
  rationale: «Fosse» rend le creux profond ou le trou où tombe l’aveugle, sans imposer le sens plus spécialisé de «citerne».
- source_word: κτῆνος
  choice: une bête
  rationale: Le terme désigne un animal, souvent une bête domestique; «bête» convient à la comparaison et au registre proverbial.
- source_word: κρημνόν
  choice: un précipice
  rationale: Rend naturellement l’idée d’un escarpement ou d’un bord abrupt entraînant une chute.
theological_decisions:
- issue: Référent implicite du sujet neutre
  choice: cet esprit
  alternative: cela
  rationale: Le grec a un sujet neutre sous-entendu, tandis que le contexte et la consultation anglaise l’identifient à un esprit. L’ajout démonstratif assure la cohésion sans lui attribuer une identité doctrinale plus précise.
- issue: Sens de «dernier de la création»
  choice: position dans l’ordre de la création
  alternative: créé en dernier
  rationale: La formulation retenue garde une certaine ambiguïté entre rang et chronologie, plutôt que de transformer explicitement la phrase en affirmation sur le moment précis de sa création.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase grecque longue est divisée en deux pour améliorer la lisibilité, tout en conservant le contraste rhétorique «dernier/premier» et les deux comparaisons parallèles.
