  source_fidelity: 'Le sens de la phrase grecque est bien rendu : Ruben appelle ses enfants à entendre son témoignage au sujet de ce qu’il a vu concernant les sept « esprits de πλάνη », et ἐν τῇ μετανοίᾳ μου est conservé comme cadre de son repentir. La révision évite toutefois d’interpréter explicitement ἐν comme une durée (« au cours de »), alors que « dans » préserve mieux sa valeur circonstancielle et son ambiguïté.'
