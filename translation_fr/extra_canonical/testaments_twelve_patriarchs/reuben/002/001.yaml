source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ νῦν¹ ἀκούσατέ μου, τέκνα μου², ἃ³ εἶδον περὶ τῶν ἑπτὰ⁴ πνευμάτων τῆς πλάνης ἐν τῇ μετανοίᾳ μου⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/001.yaml
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance.
translation:
  language: fr
  text: Et maintenant, mes enfants, écoutez-moi vous parler de ce que j’ai vu au sujet des sept esprits d’égarement[a], dans mon repentir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esprits d’erreur », « esprits d’illusion » ou « esprits de tromperie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: écoutez-moi
  rationale: Rend naturellement l’impératif aoriste suivi du génitif de la personne entendue.
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Équivalent direct et naturel de l’adresse affectueuse τέκνα μου.
- source_word: πνευμάτων τῆς πλάνης
  choice: esprits d’égarement
  rationale: πλάνη peut désigner l’égarement, l’erreur ou l’illusion. « Égarement » conserve ici une portée à la fois morale et cognitive sans imposer l’idée plus volontaire de tromperie.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: au cours de ma repentance
  rationale: La construction ἐν avec le datif situe vraisemblablement la vision dans l’expérience ou la période de repentance de Ruben. « Repentance » conserve la dimension morale et religieuse de μετάνοια.
theological_decisions:
- issue: Rapport entre la vision et la repentance
  choice: au cours de ma repentance
  alternative: dans ma repentance
  rationale: La formulation française explicite sobrement une valeur temporelle ou circonstancielle probable de ἐν, tout en évitant d’affirmer que la repentance serait le contenu ou le moyen de la vision.
- issue: Nature de πλάνη
  choice: égarement
  alternative: erreur ; illusion ; tromperie
  rationale: Le grec demeure polysémique. Le texte principal retient le terme français le plus large, tandis que la note préserve les principales lectures concurrentes.
translation_notes:
  register: Français moderne, digne et accessible. La répétition « au sujet de… concernant » reflète la double relation grecque ἃ… περὶ, mais elle est légèrement lourde en français ; elle a été conservée pour maintenir clairement que Ruben demande d’écouter son témoignage sur ce qu’il a vu au sujet des sept esprits.
