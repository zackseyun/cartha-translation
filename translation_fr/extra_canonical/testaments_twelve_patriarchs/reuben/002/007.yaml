  naturalness: Le français est globalement naturel et sobre. « Grâce à ce goût » est plus clair et plus idiomatique que le relatif actuel, tout en évitant une lourde paraphrase. « Se développe » reste une restitution naturelle de κτίζεται dans ce contexte corporel.
