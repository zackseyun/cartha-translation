  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: fr
  text: Le sixième est l’esprit du goût ; grâce à ce goût, on consomme des aliments et des boissons, et la force s’y développe, car c’est dans les aliments que se trouve le fondement de la force.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα γεύσεως
  choice: l’esprit du goût
  rationale: Rend directement l’expression grecque tout en conservant le vocabulaire anthropologique de la série.
- source_word: μεθ’ ἧς
  choice: grâce auquel
  rationale: Exprime ici le moyen ou la faculté par laquelle l’action devient possible; l’accord au masculin renvoie naturellement en français à « l’esprit du goût » pris comme ensemble.
- source_word: γίνεται βρῶσις βρωμάτων τε καὶ πομάτων
  choice: on consomme aliments et boissons
  rationale: Formulation française naturelle qui rend l’idée de la prise de nourriture et de boisson sans reproduire la lourdeur littérale « se produit une consommation ».
- source_word: κτίζεται
  choice: se développe
  rationale: Le verbe signifie littéralement « est édifiée »; appliqué à la force corporelle, « se développe » restitue naturellement l’idée d’un accroissement progressif.
- source_word: ὑπόστασις
  choice: fondement
  rationale: Dans ce contexte concret, le terme désigne ce sur quoi repose la force, sans lui imposer un sens métaphysique technique.
theological_decisions:
- issue: Sens de πνεῦμα dans l’énumération des facultés humaines
  choice: esprit
  alternative: souffle; faculté
  rationale: « Esprit » maintient le terme récurrent et la possible dimension anthropologique du grec, sans réduire d’emblée πνεῦμα à une simple faculté physiologique.
- issue: Référent de ἐν αὐτῷ
  choice: s’y
  alternative: par lui; en lui
  rationale: Le pronom grec est masculin et son référent exact peut rester légèrement flottant; « s’y développe » préserve cette relative indétermination mieux qu’une explicitation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est allégée pour être immédiatement compréhensible, tout en gardant « esprit » et l’image du « fondement » afin de respecter les tensions lexicales du grec.
