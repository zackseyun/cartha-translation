  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001.yaml
  text: 'A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.


    2 Two years after the death of Joseph his brother, when Reuben had fallen sick, the sons of Joseph and the sons of his sons were gathered to visit him. 3 And he said to them, “My children, behold, I am dying, and I am going the way of my fathers.” 4 Then, seeing there Judah and Gad and Asher, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am failing.” 5 And rising up, he kissed them and said to them, “Hear, my brothers and my sons; pay attention to Reuben your father in the things that I command you.


    6 “And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was poured out and defiled the bed of my father Jacob. 7 And I tell you that he struck me with a severe blow in my loins for seven months; and if my father Jacob had not prayed for me to the Lord, the Lord would have been willing to destroy me. 8 For I was thirty years old when I did the evil thing before the Lord, and for seven months I was weakened to the point of death. 9 And after this, with the resolve of my soul, I repented before the Lord for seven years. 10 And I drank no wine or strong drink, and meat did not enter my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great—such a thing had not happened in Israel.”'
translation:
  language: fr
  text: 'Copie du testament de Ruben, contenant les instructions qu’il donna à ses fils avant de mourir, dans la cent vingt-cinquième année de sa vie.


    2 Deux ans après la mort de son frère Joseph, Ruben tomba malade. Les fils de Joseph et les fils de ses fils se réunirent pour lui rendre visite. 3 Il leur dit : « Mes enfants, voici que je vais mourir et suivre le chemin de mes pères. » 4 Voyant alors parmi eux ses frères Juda, Gad et Aser, il leur dit : « Relevez-moi, afin que je dise à mes frères et à mes enfants ce qui est caché dans mon cœur, car voici que déjà mes forces m’abandonnent. » 5 Une fois relevé, il les embrassa et leur dit : « Écoutez, mes frères et mes fils ; soyez attentifs aux instructions que moi, Ruben, votre père, je vous donne.


    6 Voici qu’aujourd’hui je prends à témoin contre vous le Dieu du ciel : ne marchez pas dans l’ignorance de la jeunesse ni dans l’immoralité sexuelle, dans laquelle je me suis abandonné et ai souillé le lit de mon père Jacob. 7 Je vous le dis : il m’a frappé au flanc d’un coup terrible pendant sept mois. Et si mon père Jacob n’avait pas prié le Seigneur pour moi, le Seigneur aurait voulu me faire périr. 8 En effet, j’avais trente ans lorsque j’ai commis ce mal devant le Seigneur, et pendant sept mois je suis resté faible au point d’en mourir. 9 Après cela, avec toute la détermination de mon âme, je me suis repenti devant le Seigneur durant sept ans. 10 Je n’ai bu ni vin ni boisson forte ; aucune viande n’est entrée dans ma bouche et je n’ai mangé aucun pain recherché. Au contraire, je portais le deuil à cause de mon péché, car il était grand : rien de pareil ne s’était encore produit en Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον διαθήκης
  choice: Copie du testament
  rationale: Rend directement le titre grec, avec « testament » au sens de dernières volontés et instructions.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: Ses fils et ses petits-fils
  rationale: Suit les référents explicites du texte grec principal et emploie une formulation française naturelle.
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: suivre le chemin de mes pères
  rationale: Conserve l’image traditionnelle de la mort tout en restant idiomatique en français.
- source_word: ἐξεχύθην
  choice: je me suis répandu
  rationale: Préserve la métaphore forte et inhabituelle du grec ainsi que son ambiguïté, sans la réduire à « je me suis laissé entraîner ».
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: au flanc
  rationale: λαγών désigne le flanc ou la région des reins ; « au flanc » est précis sans surinterprétation sexuelle ou anatomique.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: avec toute la détermination de mon âme
  rationale: Exprime la décision volontaire et résolue indiquée par προαίρεσις, en conservant ψυχή.
- source_word: σίκερα
  choice: boisson forte
  rationale: Désigne une boisson enivrante distincte du vin ; cette expression moderne évite un emprunt obscur.
- source_word: ἄρτον ἐπιθυμίας
  choice: pain qui faisait envie
  rationale: Conserve « pain » et l’idée d’un aliment désiré, sans transformer le syntagme en catégorie technique absente du grec.
theological_decisions:
- issue: Sujet non exprimé du verbe « frapper » en 1.7
  choice: il m’a frappé
  alternative: le Seigneur m’a frappé
  rationale: Le grec porte seulement un sujet implicite. Le contexte peut suggérer le Seigneur, mais la traduction ne l’explicite pas afin de préserver l’ambiguïté grammaticale.
- issue: Formulation de la volonté du Seigneur en 1.7
  choice: le Seigneur aurait voulu me faire périr
  alternative: le Seigneur m’aurait fait périr
  rationale: Conserve le verbe ἤθελε, qui exprime la volonté ou l’intention, sans l’aplanir en simple conséquence.
- issue: Repentance prolongée de Ruben
  choice: je me suis repenti devant le Seigneur durant sept ans
  alternative: j’ai fait pénitence devant le Seigneur durant sept ans
  rationale: « Se repentir » rend μετανοέω sans importer un système pénitentiel confessionnel particulier.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité testamentaire, tandis que les formulations trop calquées sont assouplies lorsque le sens grec reste intact. Les images théologiquement ou littérairement tendues, notamment « je me suis répandu », sont maintenues plutôt que résolues.
