    issue: Rendu de περὶ τῆς ἁμαρτίας μου par « à cause de mon péché »
    rationale: Dans cette construction, περί signifie d’abord « au sujet de / concernant ». « À cause de » peut être possible selon le contexte, mais introduit plus explicitement la causalité que ne le fait le grec.
  - severity: low
    issue: « Et jusqu’à maintenant »
    rationale: La formulation est intelligible, mais elle est moins naturelle que « Et maintenant encore » et ne rend pas aussi souplement l’insistance temporelle de ἕως νῦν.
  revised_text: Et maintenant encore, ma conscience me frappe au sujet de mon péché.
