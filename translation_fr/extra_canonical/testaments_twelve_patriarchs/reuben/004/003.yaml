lexical_decisions:
- source_word: ἕως νῦν
  choice: jusqu’à maintenant
  rationale: Rend directement la continuité temporelle exprimée par le grec.
- source_word: ἡ συνείδησίς μου
  choice: ma conscience
  rationale: Équivalent français naturel et précis de συνείδησις dans ce contexte moral.
- source_word: τύπτει με
  choice: me frappe
  rationale: Conserve l’image forte et concrète du verbe τύπτω sans l’interpréter plus largement comme « me tourmente ».
- source_word: περὶ τῆς ἁμαρτίας μου
  choice: à cause de mon péché
  rationale: Dans ce contexte, περί indique ce qui motive l’accusation de la conscience; « à cause de » est plus naturel en français que le calque « au sujet de ».
theological_decisions:
- issue: Nature de l’action de la conscience
  choice: me frappe
  alternative: me tourmente / m’accuse
  rationale: La formulation maintient la métaphore grecque et évite d’expliciter une fonction théologique précise de la conscience que le texte ne formule pas.
translation_notes:
  register: Français moderne, simple et digne. La tournure préserve la métaphore corporelle du grec tout en restant immédiatement intelligible.
