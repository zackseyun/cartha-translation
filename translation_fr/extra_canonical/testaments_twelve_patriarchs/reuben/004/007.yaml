source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ γὰρ πολλοὺς ἀπώλεσεν ἡ πορνεία· ὅτι κἂν *γέρων ᾖ τις⁵⁸, κἂν⁵⁹ εὐγενής, Γκἂν πλούσιος, κἂν πένης⁶⁰, *ὀνειδισμὸν ἑαυτῷ φέρει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων καὶ †πρόσκομμα τῷ Βελίαρ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: fr
  text: Car l’inconduite sexuelle en a fait périr beaucoup ; car qu’un homme soit âgé, de naissance noble, riche ou pauvre, il s’attire le déshonneur aux yeux des êtres humains et apporte une occasion de chute à Béliar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile ici : littéralement, « une pierre d’achoppement à Béliar ». Le rapport exact entre cette occasion de chute et Béliar demeure incertain.'
    reason: La formulation transmise πρόσκομμα τῷ Βελίαρ est sémantiquement tendue. La note conserve l’ambiguïté du datif sans imposer de correction conjecturale ni d’interprétation doctrinale.
lexical_decisions:
- source_word: πορνεία
  choice: l’inconduite sexuelle
  rationale: Terme français actuel et suffisamment large pour rendre l’immoralité sexuelle visée par πορνεία, sans la limiter à la prostitution.
- source_word: ἀπώλεσεν
  choice: a fait périr
  rationale: Conserve la force du verbe grec, qui peut exprimer la ruine ou la destruction, sans préciser indûment s’il s’agit de mort physique.
- source_word: εὐγενής
  choice: de naissance noble
  rationale: Rend clairement le statut de bonne ou noble naissance, plutôt qu’une qualité morale de noblesse.
- source_word: ὀνειδισμὸν ἑαυτῷ φέρει
  choice: il s’attire le déshonneur
  rationale: Expression française naturelle qui conserve l’idée qu’il fait venir sur lui-même l’opprobre.
- source_word: παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: parmi les êtres humains
  rationale: Rend idiomatiquement l’expression sémitisante « les fils des hommes » et le sens social de παρά dans ce contexte.
- source_word: πρόσκομμα
  choice: une occasion de chute
  rationale: Préserve l’image d’un obstacle qui fait trébucher, avec sa portée morale possible.
- source_word: Βελίαρ
  choice: Béliar
  rationale: Translittération française traditionnelle du nom propre grec, sans l’interpréter par un titre théologique.
theological_decisions:
- issue: Rapport entre l’homme déshonoré et Béliar dans πρόσκομμα τῷ Βελίαρ
  choice: devient une occasion de chute pour Béliar
  alternative: devient une pierre d’achoppement liée à Béliar / tombe dans le piège de Béliar
  rationale: Le datif τῷ Βελίαρ est conservé au plus près comme bénéficiaire ou référent de πρόσκομμα, malgré une formulation théologiquement difficile. La note signale l’incertitude au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation garde le lien explicatif introduit par γάρ. L’énumération est allégée naturellement sans perdre les quatre catégories du grec.
