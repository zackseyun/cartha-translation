    issue: Le rendu de πρόσκομμα τῷ Βελίαρ modifie le verbe grec.
    rationale: 'φέρει régit « déshonneur » et « pierre/occasion de chute » : le sujet apporte les deux. « Devient une occasion de chute » remplace cette action par un changement d’état et atténue la syntaxe difficile du texte.'
  - severity: low
    issue: « Parmi les êtres humains » est moins précis pour παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων.
    rationale: Dans ce contexte de honte publique, « aux yeux des êtres humains » rend plus naturellement l’idée d’opprobre devant/autrui.
