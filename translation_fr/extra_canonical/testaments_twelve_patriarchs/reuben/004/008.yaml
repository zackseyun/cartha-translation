source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἠκούσατε γὰρ περὶ Ἰωσὴφ πῶς ἐφύλαξεν ἑαυ- τὸν ἀπὸ⁶² γυναικός, καὶ τὰς ἐννοίας ἐκαθάρισεν⁶³ ἀπὸ πάσης⁶⁴ πορνείας, Γκαὶ⁶⁵ εὗρεν χάριν ἐνώπιον θεοῦ⁶⁶ καὶ ἀνθρώ- πων.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/008.yaml
  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: fr
  text: 'Car vous avez entendu parler de Joseph : comment il s’est gardé d’une femme, a purifié ses pensées de toute immoralité sexuelle et a trouvé grâce devant Dieu et devant les hommes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαξεν ἑαυτόν ἀπὸ γυναικός
  choice: il s’est gardé d’une femme
  rationale: Rend directement l’idée de se préserver ou de se tenir à l’écart d’une femme, sans préciser davantage l’identité ou le rôle de celle-ci.
- source_word: τὰς ἐννοίας
  choice: ses pensées
  rationale: Terme français courant qui exprime ici les pensées, dispositions ou intentions intérieures.
- source_word: ἀπὸ πάσης πορνείας
  choice: de toute immoralité sexuelle
  rationale: « Immoralité sexuelle » couvre la portée générale de πορνεία, tandis que « toute » traduit πάσης sans ajouter explicitement « toute forme de ».
- source_word: εὗρεν χάριν ἐνώπιον
  choice: a trouvé grâce devant
  rationale: Formulation biblique claire et naturelle, correspondant étroitement à l’expression grecque.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: Dieu et les hommes
  rationale: Conserve la coordination et le sens collectif d’ἀνθρώπων.
theological_decisions:
- issue: Nature de la purification intérieure de Joseph
  choice: a purifié ses pensées de toute immoralité sexuelle
  alternative: a purifié ses intentions de toute inconduite sexuelle
  rationale: La traduction maintient l’affirmation du texte sur la discipline intérieure sans développer une doctrine particulière de la pureté ou de la sanctification.
translation_notes:
  register: Français moderne, digne et accessible. La structure après les deux-points restitue naturellement le πῶς grec. Aucun marqueur de note n’est nécessaire.
