  text: For until my father's death I did not have the boldness to look my father in the face.
translation:
  language: fr
  text: Car, jusqu’à la mort de mon père, je n’ai pas eu l’assurance de le regarder en face[a] ; et jusqu’à présent, je me suis gardé et je n’ai pas péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec est lacunaire après « regarder vers ». La restitution « le regarder en face » exprime le sens probable d’après le contexte et la tradition textuelle, sans prétendre rétablir avec certitude les mots absents.
    reason: Signaler la lacune qui affecte l’objet du regard et distinguer clairement la restitution de la portion conservée du texte.
lexical_decisions:
- source_word: παρρησίαν
  choice: le courage
  rationale: Dans ce contexte de honte devant son père, le terme désigne l’assurance ou la hardiesse nécessaire pour soutenir son regard; « le courage » est naturel en français et conserve cette nuance.
- source_word: ἀτενίσαι
  choice: regarder
  rationale: Le verbe exprime un regard direct et soutenu. Avec « en face », « regarder » rend naturellement l’idée sans lourdeur.
- source_word: ἄχρι τελευτῆς τοῦ πατρός μου
  choice: jusqu’à la mort de mon père
  rationale: Traduction directe de la limite temporelle indiquée par le grec.
