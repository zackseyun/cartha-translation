  terminology: Aucun terme théologique technique ne pose problème. « Péché » rend directement ἥμαρτον. La note doit signaler la lacune précisément, tout en évitant de présenter la restitution comme certaine. Le marqueur est maintenu au point où la lacune affecte l’objet de « regarder ».
