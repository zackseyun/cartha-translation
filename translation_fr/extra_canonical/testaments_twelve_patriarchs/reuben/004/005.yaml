  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: fr
  text: 'C’est pourquoi, mes enfants, je vous le dis : gardez tout ce que je vous commande, et vous ne pécherez certainement pas.'
