lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement le lien conséquent exprimé par la locution grecque.
- source_word: φυλάξατε
  choice: gardez
  rationale: Conserve l’idée d’observer fidèlement des commandements, dans un registre biblique encore intelligible aujourd’hui.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Reproduit sans lourdeur la portée globale de l’expression grecque.
- source_word: οὐ μὴ ἁμάρτητε
  choice: vous ne pécherez certainement pas
  rationale: La négation renforcée οὐ μή exprime ici une dénégation catégorique; le futur français restitue naturellement la portée résultative de l’aoriste subjonctif grec.
theological_decisions:
- issue: Portée de l’affirmation finale sur l’absence de péché
  choice: vous ne pécherez certainement pas
  alternative: vous ne risquez pas de pécher
  rationale: La formulation retenue préserve la force de οὐ μή sans atténuer l’affirmation par une notion de simple risque absente du grec; elle laisse intacte la tension théologique du propos.
translation_notes:
  register: Français international moderne, digne et direct. L’adresse « mes enfants » et le verbe « garder » maintiennent la tonalité sapientielle et exhortative du texte.
