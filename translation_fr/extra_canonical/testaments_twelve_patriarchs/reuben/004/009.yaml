source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Καὶ γὰρ⁶⁷ πολλὰ ἐποίησεν αὐτῷ ἡ Αἰγυπτία, καὶ μάγους προσεκάλεσεν⁶⁸ καὶ *φάρμακα αὐτῷ προσήνεγκε⁶⁹, ἐπειδὴ γὰρ ἐφύλαξεν ἑαυτὸν Ἰωσὴφ ἀπὸ πάσης. β, Α, S¹ κυρίου. καὶ⁷⁰ οὐκ ἐδέξατο⁷¹ τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ⁷² ἐπιθυμίαν πονηράν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: fr
  text: 'En effet, l’Égyptienne lui fit bien des choses : elle fit venir des magiciens et lui apporta des potions. Car Joseph se garda de tout mauvais désir¹ et n’accepta pas le conseil de son âme en matière de désir mauvais.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: l’Égyptienne
  rationale: Désignation substantivée fidèle au grec et référence naturelle à la femme égyptienne du contexte.
- source_word: πολλὰ ἐποίησεν αὐτῷ
  choice: lui fit bien des choses
  rationale: Conserve l’expression générale et l’ambiguïté de αὐτῷ, sans préciser indûment qu’elle aurait agi « contre » lui.
- source_word: μάγους προσεκάλεσεν
  choice: elle fit venir des magiciens
  rationale: Rend le sens d’appeler auprès de soi ou de faire venir, dans un français courant.
- source_word: φάρμακα αὐτῷ προσήνεγκε
  choice: lui apporta des potions
  rationale: Dans ce contexte de magiciens et de séduction, « potions » exprime la valeur probable de φάρμακα sans imposer « poisons » ni « drogues ».
- source_word: ἐφύλαξεν ἑαυτὸν
  choice: se garda
  rationale: Reproduit la valeur réfléchie de l’expression et son idée de vigilance morale.
- source_word: ἐπιθυμίαν πονηράν
  choice: tout mauvais désir / un désir mauvais
  rationale: « Désir » reste suffisamment large et évite de réduire explicitement le terme à la seule convoitise sexuelle, même si le contexte la suggère.
- source_word: τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ
  choice: le conseil de son âme
  rationale: Maintient l’anthropologie et l’image intérieure du grec au lieu de les paraphraser en simple « impulsion ».
theological_decisions:
- issue: Rapport entre le conseil de l’âme et le mauvais désir
  choice: « le conseil de son âme qui le poussait à un désir mauvais »
  alternative: « le conseil de son âme pour un mauvais désir »
  rationale: La construction grecque transmise est difficile et possiblement perturbée. La formulation choisie rend intelligible le lien avec le désir mauvais tout en conservant l’idée théologiquement tendue d’un conseil venant de l’âme de Joseph, sans l’effacer.
- issue: Valeur des connecteurs γὰρ
  choice: « En effet » puis « Car »
  alternative: « Car » aux deux endroits
  rationale: Respecte la relation explicative marquée par le grec tout en évitant une répétition lourde en français.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement clarifiée en deux phrases, sans ajouter d’explication doctrinale. Le texte source présente une leçon manifestement difficile autour de « de toute… » et de la place de « désir mauvais » ; la traduction suit l’interprétation syntaxique reflétée par la couche anglaise auditée tout en préservant l’expression « conseil de son âme ».
