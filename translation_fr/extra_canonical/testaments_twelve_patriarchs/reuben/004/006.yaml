source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: fr
  text: 'Car le péché de l’immoralité sexuelle est une fosse pour l’âme : il la sépare de Dieu et l’attire vers les idoles, car cette immoralité sexuelle égare l’esprit et l’intelligence, et fait descendre les jeunes gens dans l’Hadès[a] avant leur heure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’Hadès désigne le séjour des morts.
    reason: Clarifie un terme grec translittéré sans l’assimiler au châtiment final.
lexical_decisions:
- source_word: ἡ ἁμαρτία τῆς πορνείας
  choice: le péché de l’immoralité sexuelle
  rationale: Rend explicitement la construction grecque et le champ sexuel de πορνεία dans un français moderne, sans la réduire au seul adultère.
- source_word: Βόθρος
  choice: une fosse
  rationale: Préserve l’image concrète d’un trou profond ou d’une fosse servant de piège ou conduisant à la ruine.
- source_word: προσεγγίζουσα τοῖς εἰδώλοις
  choice: l’attire vers les idoles
  rationale: Le participe décrit le péché rapprochant l’âme des idoles. « Attire vers » exprime naturellement ce mouvement en français sans suggérer une simple proximité statique.
- source_word: τὸν νοῦν καὶ τὴν διάνοιαν
  choice: l’esprit et l’intelligence
  rationale: Conserve les deux termes grecs et leur recoupement sémantique plutôt que de les fusionner en une seule faculté.
- source_word: εἰς ᾅδην
  choice: dans l’Hadès
  rationale: Translittère le nom grec du séjour des morts et évite de l’identifier sans nuance à l’enfer comme lieu de châtiment final.
- source_word: οὐκ ἐν καιρῷ αὐτῶν
  choice: avant leur heure
  rationale: Expression française naturelle pour une mort prématurée, correspondant littéralement à l’idée que ce n’est pas leur temps.
theological_decisions:
- issue: Rapport entre l’immoralité sexuelle, Dieu et les idoles
  choice: Le péché sépare l’âme de Dieu et l’attire vers les idoles.
  alternative: L’immoralité sexuelle équivaut elle-même à l’idolâtrie.
  rationale: Le grec décrit un mouvement d’éloignement de Dieu et de rapprochement des idoles, sans affirmer explicitement une identité absolue entre les deux péchés.
- issue: Sens de ᾅδης
  choice: Hadès, expliqué comme le séjour des morts
  alternative: enfer
  rationale: « Enfer » risquerait d’importer la notion plus précise de châtiment final, tandis que ᾅδης désigne ici le domaine des morts.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « C’est lui » maintient le péché comme sujet de l’égarement et de la descente prématurée. « Avant leur heure » restitue idiomatiquement l’idée de mourir avant le temps attendu.
