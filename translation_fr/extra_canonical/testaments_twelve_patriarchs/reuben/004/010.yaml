  text: Therefore the God of your fathers delivered him from every hidden evil death.
translation:
  language: fr
  text: C’est pourquoi le Dieu de vos pères l’a délivré de toute mort mauvaise et cachée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement en français la conséquence exprimée par la locution grecque.
- source_word: ὁ θεὸς τῶν πατέρων ὑμῶν
  choice: le Dieu de vos pères
  rationale: Conserve la formulation ancestrale et biblique du grec sans l’alourdir.
- source_word: ἐρρύσατο
  choice: l’a délivré
  rationale: Exprime l’idée d’arracher quelqu’un à un danger; « délivrer de » convient au complément grec introduit par ἀπό.
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  choice: de toute mort mauvaise et cachée
  rationale: Traite πονηροῦ et κεκρυμμένου comme des qualificatifs de θανάτου, conformément à leur accord au génitif singulier, sans scinder artificiellement la phrase en deux dangers distincts.
theological_decisions:
- issue: Rapport entre « mauvaise », « cachée » et « mort »
  choice: Les deux qualificatifs portent sur « mort ».
  alternative: « de tout mal caché et de la mort »
  rationale: Le grec présente une seule séquence au génitif après ἀπό; κεκρυμμένου s’accorde avec θανάτου, et rien ne justifie l’ajout d’un second complément distinct.
translation_notes:
  register: Français moderne, clair et digne. La tournure « Dieu de vos pères » conserve le registre scripturaire traditionnel tout en restant immédiatement compréhensible.
