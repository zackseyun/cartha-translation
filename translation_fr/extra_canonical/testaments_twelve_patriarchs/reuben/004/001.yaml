  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: fr
  text: Ainsi donc, mes enfants, ne prêtez pas attention à la beauté des femmes et ne vous attardez pas sur leurs actes. Mais marchez dans la simplicité du cœur, dans la crainte du Seigneur, en travaillant avec ardeur à de bonnes œuvres, à l’étude et auprès de vos troupeaux, jusqu’à ce que le Seigneur vous donne une épouse, celle qu’il veut lui-même, afin que vous ne souffriez pas comme moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητι καρδίας
  choice: avec un cœur sans détour
  rationale: Rend naturellement l’idée de simplicité, de sincérité et d’intégrité du cœur sans suggérer la naïveté.
- source_word: πράξεις
  choice: agissements
  rationale: Désigne ici les actes ou la conduite; « agissements » convient à l’avertissement du contexte tout en restant proche du grec.
- source_word: ἐν γράμμασι
  choice: à l’étude
  rationale: γράμματα peut désigner les lettres, les écrits ou l’instruction. Dans cette série d’occupations, « à l’étude » exprime clairement le sens probable d’apprentissage.
- source_word: σύζυγον
  choice: l’épouse
  rationale: Le nom peut signifier conjoint ou compagne; le contexte où Reuben s’adresse à ses fils et parle des femmes justifie ici « épouse ».
- source_word: ἣν αὐτὸς θέλει
  choice: qu’il veut lui-même
  rationale: Préserve la formulation de θέλει et son insistance, sans transformer explicitement la volonté du Seigneur en acte de sélection.
- source_word: μοχθοῦντες
  choice: en vous appliquant
  rationale: Communique l’idée d’un travail assidu dans plusieurs domaines, dans un français naturel.
theological_decisions:
- issue: Rôle du Seigneur dans le don d’une épouse
  choice: « jusqu’à ce que le Seigneur vous donne l’épouse qu’il veut lui-même »
  alternative: « jusqu’à ce que le Seigneur vous donne l’épouse qu’il choisit lui-même »
  rationale: Le grec affirme que le Seigneur donne et veut cette épouse, mais n’emploie pas directement un verbe signifiant « choisir »; la traduction conserve cette nuance.
- issue: Sens moral de la « simplicité du cœur »
  choice: « avec un cœur sans détour »
  alternative: « dans la simplicité du cœur »
  rationale: Cette formulation exprime l’intégrité intérieure sans imposer une doctrine particulière ni laisser entendre une déficience intellectuelle.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La syntaxe exhortative et l’enchaînement des occupations sont conservés, avec un léger ajustement idiomatique pour la fluidité.
