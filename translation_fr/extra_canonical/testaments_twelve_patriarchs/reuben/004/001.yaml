revisions:
- from: Ainsi donc, mes enfants, ne prêtez pas attention à la beauté des femmes et ne vous attardez pas sur leurs agissements. Mais marchez avec un cœur sans détour, dans la crainte du Seigneur, en vous appliquant aux œuvres bonnes, à l’étude et au soin de vos troupeaux, jusqu’à ce que le Seigneur vous donne l’épouse qu’il veut lui-même, afin que vous ne souffriez pas comme moi.
  to: Ainsi donc, mes enfants, ne prêtez pas attention à la beauté des femmes et ne vous attardez pas sur leurs actes. Mais marchez dans la simplicité du cœur, dans la crainte du Seigneur, en travaillant avec ardeur à de bonnes œuvres, à l’étude et auprès de vos troupeaux, jusqu’à ce que le Seigneur vous donne une épouse, celle qu’il veut lui-même, afin que vous ne souffriez pas comme moi.
  rationale: La révision élimine une connotation péjorative non explicitée par πράξεις, évite d’ajouter l’idée spécifique de « soin » aux troupeaux, et rapproche le rendu de ἁπλότητι καρδίας de la formulation grecque. Elle conserve l’ambiguïté contrôlée de θέλει (« veut » plutôt que « choisit ») et maintient un français moderne, clair et digne.
  reviewer_model: gpt-5.6-terra
