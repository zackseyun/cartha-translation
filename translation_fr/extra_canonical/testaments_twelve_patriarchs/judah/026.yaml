  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
translation:
  language: fr
  text: '26 Ainsi donc, mes enfants, observez toute la Loi du Seigneur, car elle est une espérance pour ceux qui aplanissent ses voies.


    2 Puis il leur dit : « Voici, j’ai cent dix-huit ans et je meurs aujourd’hui. 3 Que personne ne m’ensevelisse dans un vêtement somptueux. Transportez-moi plutôt à Hébron, là où reposent aussi mes pères. »


    4 Après avoir dit cela, il s’endormit[a]. Ses fils firent tout ce qu’il leur avait commandé et l’ensevelirent avec ses pères, à Hébron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Il s’endormit » est un euphémisme ancien et conventionnel signifiant qu’il mourut.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλάξατε
  choice: observez
  rationale: Dans le contexte de la Loi, « observer » exprime naturellement en français l’idée de garder fidèlement et de mettre en pratique.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: toute la Loi du Seigneur
  rationale: « Toute la Loi » conserve l’idée de totalité, tandis que la majuscule française signale ici le corpus normatif du Seigneur.
- source_word: ἐλπὶς
  choice: une espérance
  rationale: Ce choix conserve la portée positive et religieuse du nom grec sans le réduire à une simple possibilité.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: ceux qui rendent droites ses voies
  rationale: La formulation garde l’image concrète et la légère difficulté du grec, au lieu de la remplacer par une interprétation telle que « ceux qui suivent fidèlement ses voies ».
- source_word: ἀναγάγετε με
  choice: Emmenez-moi
  rationale: Le verbe comporte littéralement l’idée de faire monter ou de conduire vers le haut; en français, « emmenez-moi » rend naturellement l’ordre de transporter le corps jusqu’à Hébron sans imposer une topographie explicative.
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Le texte emploie l’euphémisme traditionnel du sommeil pour la mort; le conserver maintient le registre testamentaire.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: dans un vêtement somptueux
  rationale: Cette expression rend directement l’interdiction d’un vêtement coûteux ou luxueux destiné à l’ensevelissement.
theological_decisions:
- issue: Rapport entre la Loi du Seigneur et l’espérance
  choice: La Loi elle-même est présentée comme « une espérance » pour ceux qui rendent droites les voies du Seigneur.
  alternative: Reformuler en disant que l’espérance appartient à ceux qui observent la Loi avec droiture.
  rationale: La syntaxe grecque fait de « toute la Loi du Seigneur » l’antécédent naturel de « elle » et conserve une expression théologiquement dense sans la normaliser.
- issue: Formule décrivant la mort de Juda
  choice: Conserver « il s’endormit ».
  alternative: Traduire explicitement par « il mourut ».
  rationale: L’image du sommeil appartient au langage ancien de la mort et doit rester visible; une note évite toutefois toute méprise.
- issue: Étendue du chapitre selon la source grecque fournie
  choice: Ne traduire que les quatre versets attestés dans la colonne grecque primaire.
  alternative: Ajouter les phrases de la couche anglaise sur la vieillesse, la sainteté, la demeure sûre et le rassemblement final d’Israël.
  rationale: Ces phrases ne figurent pas dans le texte grec source fourni. Les introduire ferait passer des éléments d’une autre forme textuelle pour le contenu de cette édition.
translation_notes:
  register: Français international moderne, digne et lisible, avec maintien du ton d’exhortation patriarcale. « Mes enfants », « mes pères » et « il s’endormit » préservent la couleur testamentaire. La traduction suit prioritairement le grec fourni; elle n’intègre pas les éléments supplémentaires présents seulement dans la consultation anglaise.
