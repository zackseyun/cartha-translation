  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: fr
  text: '**Testament de Juda 24**


    **1.** Après cela, une étoile se lèvera pour vous, issue de Jacob, dans la paix. Un homme se lèvera de ma descendance, pareil à un soleil de justice. Il marchera avec les humains dans la douceur et la justice, et aucun péché ne sera trouvé en lui.


    **2.** Les cieux s’ouvriront au-dessus de lui pour répandre sur lui un esprit, bénédiction du Père qui est saint[a] ; et lui-même répandra sur vous un esprit de grâce.


    **3.** Vous serez pour lui des fils en vérité, et vous marcherez selon ses commandements, les premiers comme les derniers[b].


    **4.** [Il est le rejeton du Dieu Très-Haut et la source qui donne la vie à tous.][c]


    **5.** Alors le sceptre de ma royauté resplendira, et de votre racine surgira une souche.


    **6.** De cette souche poussera un bâton de justice pour les nations, afin de juger et de sauver tous ceux qui font appel au Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque est abrupte. On peut aussi comprendre : « pour répandre l’Esprit, bénédiction du Père qui est saint » ou « pour répandre l’Esprit de bénédiction du Père qui est saint ».'
    reason: Signaler une ambiguïté syntaxique et théologique réelle autour de πνεῦμα et εὐλογίαν.
  - marker: b
    text: L’expression « les premiers comme les derniers » est énigmatique ; elle peut qualifier l’ensemble des commandements, des plus anciens aux derniers.
    reason: Éviter de fixer silencieusement la portée de πρώτοις καὶ ἐσχάτοις.
  - marker: c
    text: Le verset 4 est transmis entre crochets dans l’édition grecque consultée, ce qui signale que son statut textuel est incertain.
    reason: Reproduire visiblement l’incertitude textuelle indiquée par la source.
lexical_decisions:
- source_word: ἄστρον
  choice: une étoile
  rationale: Le sens concret et le symbolisme royal de l’image sont conservés sans explicitation christologique ajoutée.
- source_word: σπέρματός μου
  choice: ma descendance
  rationale: Dans ce contexte généalogique, « descendance » rend naturellement le collectif σπέρμα sans l’ambiguïté physiologique de « semence ».
- source_word: ἥλιος δικαιοσύνης
  choice: un soleil de justice
  rationale: Traduction formelle de l’expression métaphorique, sans remplacer « justice » par une interprétation morale ou sotériologique plus étroite.
- source_word: πραότητι
  choice: douceur
  rationale: « Douceur » exprime ici une disposition non violente et humble ; « mansuétude » serait moins accessible en français courant.
- source_word: πνεῦμα
  choice: un esprit
  rationale: L’absence d’article et la syntaxe difficile conseillent de ne pas imposer par la majuscule une identification théologique que le grec ne marque pas explicitement.
- source_word: προστάγμασιν
  choice: commandements
  rationale: Le terme désigne des prescriptions ou ordres. « Commandements » est naturel dans ce registre tout en restant proche du grec.
- source_word: βλαστός
  choice: rejeton
  rationale: Ce mot préserve l’image végétale d’une jeune pousse issue d’une lignée.
- source_word: σκῆπτρον βασιλείας μου
  choice: le sceptre de ma royauté
  rationale: « Royauté » rend βασιλεία comme qualité ou pouvoir royal, sans limiter nécessairement le sens à un territoire politique.
- source_word: πυθμήν
  choice: une souche
  rationale: Le mot désigne la partie basse ou la base d’un arbre ; « souche » maintient la cohérence de la métaphore de la racine et de la pousse.
- source_word: ῥάβδος δικαιοσύνης
  choice: un bâton de justice
  rationale: « Bâton » conserve l’image de ῥάβδος et son possible double sens de pousse et d’instrument d’autorité, sans la confondre avec le « sceptre » précédent.
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: ceux qui font appel au Seigneur
  rationale: Cette formulation rend l’acte d’invoquer ou d’appeler le Seigneur sans réduire l’expression à une formule liturgique.
theological_decisions:
- issue: Identification de l’homme annoncé
  choice: Maintenir les images prophétiques sans nommer leur accomplissement
  alternative: Identifier explicitement cet homme au Messie ou à Jésus
  rationale: Le texte décrit la figure par des images messianiques, mais ne la nomme pas explicitement ; la traduction ne doit pas résoudre cette identification à la place du lecteur.
- issue: Nature de πνεῦμα au verset 2
  choice: Employer « un esprit » sans majuscule dans les deux occurrences
  alternative: Employer « l’Esprit » ou « le Saint-Esprit »
  rationale: Le grec ne porte pas de distinction typographique et sa construction est difficile. La minuscule préserve l’ambiguïté entre don spirituel et référent personnel divin.
- issue: Rapport entre jugement et salut au verset 6
  choice: 'Conserver les deux infinitifs coordonnés : « juger et sauver »'
  alternative: Comprendre le jugement comme condamnation des uns et le salut comme délivrance des autres
  rationale: Le grec associe les deux actes sans préciser leur articulation ni répartir leurs objets entre différents groupes.
- issue: Portée de « fils » au verset 3
  choice: Traduire littéralement « des fils »
  alternative: Neutraliser en « des enfants »
  rationale: υἱούς est explicitement masculin et peut avoir une portée statutaire ou filiale propre ; la formulation source est donc conservée.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe accessible. Les métaphores végétales, royales et lumineuses du grec sont maintenues. La numérotation suit les six unités du texte grec fourni plutôt que la consultation anglaise, qui omet l’ouverture et renumérote les unités suivantes.
