  text: So Dan and I, pretending to be allies to the Amorites, entered their city.
translation:
  language: fr
  text: Dan et moi, nous nous rendîmes chez les Amorites et, nous faisant passer auprès d’eux pour des alliés, nous entrâmes dans leur ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθέντες πρὸς Ἀμορραίους
  choice: nous nous rendîmes chez les Amorites
  rationale: Rend naturellement le mouvement vers les Amorites sans surinterpréter πρὸς.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: après nous être fait passer auprès d’eux pour des alliés
  rationale: Le participe indique une prétention feinte; αὐτοῖς renvoie aux Amorites et συμμάχους est l’attribut désignant le rôle d’alliés qu’ils prétendent avoir.
- source_word: εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν
  choice: nous entrâmes dans leur ville
  rationale: Traduction directe, avec le possessif renvoyant aux Amorites.
