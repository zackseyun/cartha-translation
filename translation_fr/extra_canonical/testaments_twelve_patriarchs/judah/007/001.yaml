  text: VII. Καὶ τῇ ἑξῆς ἐρρέθη πρὸς ἡμᾶς ὅτι Γαὰς πόλεως¹ βασιλεὺς ἐν λαῷ πολλῷ² ἔρχεται³ πρὸς ἡμᾶς.
