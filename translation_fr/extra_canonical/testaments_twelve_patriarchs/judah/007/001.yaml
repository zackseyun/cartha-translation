  source_fidelity: Le sens général est bien rendu. Toutefois, ἔρχεται est un présent (« vient »), et non un imparfait (« marchait ») ; de plus, « marcher » ajoute une nuance de déplacement militaire qui n’est pas exprimée par le verbe grec. La relation hostile de πρὸς ἡμᾶς est conservée par « contre nous », conformément à la traduction anglaise auditée.
