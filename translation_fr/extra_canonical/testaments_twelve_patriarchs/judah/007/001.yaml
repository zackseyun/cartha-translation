  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/001.yaml
  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: fr
  text: Le lendemain, on nous rapporta que le roi de la ville de Gaas venait contre nous avec une grande foule.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: le lendemain
  rationale: Dans ce contexte narratif, l’expression désigne naturellement le jour suivant.
- source_word: ἐρρέθη πρὸς ἡμᾶς
  choice: on nous rapporta
  rationale: Cette tournure impersonnelle restitue le passif grec avec un français naturel et conserve l’idée d’une information transmise.
- source_word: ἐν λαῷ πολλῷ
  choice: avec une foule nombreuse
  rationale: Le grec indique que le roi vient accompagné d’un grand nombre de personnes; « foule nombreuse » reste proche de λαός sans préciser indûment qu’il s’agit d’une armée.
- source_word: ἔρχεται πρὸς ἡμᾶς
  choice: marchait contre nous
  rationale: Le présent historique est rendu par l’imparfait dans le discours rapporté; « contre nous » exprime ici l’orientation hostile suggérée par le contexte et retenue par la couche anglaise auditée.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La formulation reste concise et n’ajoute aucune précision militaire absente du grec.
