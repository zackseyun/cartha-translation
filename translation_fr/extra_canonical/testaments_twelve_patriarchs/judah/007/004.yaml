lexical_decisions:
- source_word: ἐπροσεγγίσαμεν
  choice: nous nous approchâmes
  rationale: Rend naturellement l’aoriste de προσεγγίζω et conserve le mouvement vers Thamna.
- source_word: Θάμνῃ
  choice: Thamna
  rationale: Translittération traditionnelle du nom de lieu grec, cohérente avec la forme fournie dans la couche de consultation anglaise.
- source_word: πᾶσα ἡ ἀποσκευή
  choice: tous les bagages
  rationale: ἀποσκευή désigne ici l’ensemble des bagages ou du matériel transporté; le pluriel collectif est idiomatique en français.
- source_word: τῶν πολεμίων βασιλέων
  choice: des rois ennemis
  rationale: Conserve explicitement βασιλέων, absent de la formulation anglaise abrégée, et comprend πολεμίων comme adjectif qualifiant les rois.
