source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Νυκτὸς δὲ βαθείας⁷ ἤλθον⁸ πρὸς ἡμᾶς οἱ ἀδελφοί μου, καὶ ἀνοίξαντες τὰς πύλας αὐτοῖς, πάντας αὐτοὺς ἐξωλοθρεύσαμεν⁹ καὶ ἐπρονομεύσαμεν¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/003.yaml
  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: fr
  text: Au cœur de la nuit, mes frères vinrent nous rejoindre. Nous leur ouvrîmes les portes, puis nous les exterminâmes tous et nous nous livrâmes au pillage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et nous pillâmes »; le grec ne précise pas ce qui fut pillé.'
    reason: Signaler l’absence de complément dans la source et éviter de présenter comme explicite une restitution contextuelle.
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  choice: Au cœur de la nuit
  rationale: Expression française naturelle et digne qui rend l’idée d’une nuit avancée ou profonde.
- source_word: ἤλθον πρὸς ἡμᾶς
  choice: vinrent nous rejoindre
  rationale: Rend le mouvement vers le groupe de Juda sans la lourdeur de « vinrent vers nous ».
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  choice: Nous leur ouvrîmes les portes
  rationale: 'Conserve le datif αὐτοῖς : les portes sont ouvertes aux frères arrivés.'
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: nous les exterminâmes tous
  rationale: Restitue la force de ἐξολοθρεύω ainsi que l’insistance de πάντας αὐτούς.
- source_word: ἐπρονομεύσαμεν
  choice: nous nous livrâmes au pillage
  rationale: Exprime l’action de piller sans introduire un complément d’objet absent du texte grec.
theological_decisions:
- issue: Identité des personnes exterminées
  choice: Conserver le pronom « les » sans expliciter davantage son référent
  alternative: Nommer les habitants ou les ennemis
  rationale: Le texte grec emploie seulement αὐτούς; préciser l’identité du groupe résoudrait une référence que le verset laisse dépendre du contexte.
- issue: Éléments présents dans la consultation anglaise mais absents du grec fourni
  choice: Ne pas ajouter la destruction de trois murailles ni répéter « tout ce qui leur appartenait »
  alternative: Suivre intégralement le texte anglais consultatif
  rationale: La source grecque de ce segment s’arrête à ἐπρονομεύσαμεν et ne contient pas ces propositions; la traduction est donc fondée prioritairement sur le texte original fourni.
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsme excessif. Le passé simple convient au récit littéraire. La formulation suit le grec fourni plutôt que les éléments supplémentaires de la couche anglaise.
