  text: Then, being insulted by them, I became angry, and I rushed against them up to the summit. And they kept pelting me with stones and shooting arrows at me.
translation:
  language: fr
  text: Alors donc, comme ils m’insultaient, je me mis en colère et m’élançai contre eux jusqu’au sommet. Et eux me criblaient de pierres et me décochaient des flèches.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος παρ᾽ αὐτῶν
  choice: comme ils m’insultaient
  rationale: Rend naturellement le participe passif circonstanciel et l’idée d’outrage verbal ou humiliant, sans surcharger le français.
- source_word: ὠργίσθην
  choice: je me mis en colère
  rationale: Exprime l’entrée dans l’état de colère indiquée par l’aoriste.
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς
  choice: m’élançai contre eux
  rationale: Conserve l’impulsion énergique et la direction hostile du mouvement.
- source_word: ἐπὶ τὴν κορυφήν
  choice: jusqu’au sommet
  rationale: Préserve le sens spatial de progression vers la hauteur, sans préciser davantage un relief non nommé.
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: me criblaient de pierres
  rationale: Rend l’action répétée de lancer des pierres sur le narrateur; l’imparfait français reflète l’aspect imperfectif.
- source_word: τοξεύοντες
  choice: me décochaient des flèches
  rationale: Explicite en français idiomatique l’action de tirer à l’arc; le pronom objet est repris du contexte grec et de la coordination.
