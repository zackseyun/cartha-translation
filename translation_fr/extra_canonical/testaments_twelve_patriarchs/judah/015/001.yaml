id: T12P.JUD.15.1
reference: Testament of Judah 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας¹ γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: fr
  text: Celui qui se livre à l’immoralité sexuelle, alors qu’il est dépouillé, ne s’en rend pas compte ; et, alors qu’il est déshonoré, il n’en a pas honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας
  choice: Celui qui se livre à l’immoralité sexuelle
  rationale: Le participe substantivé désigne toute personne qui commet une faute sexuelle. « Se livrer à » rend l’acte sans restreindre indûment le terme à l’adultère ou à la prostitution.
- source_word: γυμνούμενος
  choice: qu’il est dépouillé
  rationale: Le participe passif signifie littéralement « étant mis à nu » ou « étant dépouillé ». « Dépouillé » préserve l’image et peut exprimer à la fois la perte et l’exposition, sans imposer le sens interprétatif plus étroit de « ruiné ».
- source_word: οὐκ αἰσθάνεται
  choice: ne se rend pas compte
  rationale: Rend naturellement l’idée de ne pas percevoir ou prendre conscience de ce qui arrive.
- source_word: ἀδοξῶν
  choice: quand il perd son honneur
  rationale: Le participe exprime le fait d’être sans gloire, déshonoré ou tombé dans le discrédit. Cette formulation française claire conserve l’idée de perte d’honneur.
- source_word: οὐκ αἰσχύνεται
  choice: il n’en éprouve aucune honte
  rationale: Exprime avec naturel l’absence de honte, le pronom « en » reliant cette réaction au déshonneur évoqué.
theological_decisions:
- issue: Portée de πορνεύσας
  choice: immoralité sexuelle
  alternative: débauche / fornication / adultère
  rationale: Le grec possède une portée générale dans le domaine des conduites sexuelles illicites. Le choix retenu évite de réduire le sens à une infraction particulière.
- issue: Image de γυμνούμενος
  choice: dépouillé
  alternative: mis à nu / ruiné
  rationale: « Dépouillé » maintient l’ambiguïté entre exposition honteuse et perte de biens ou de dignité; « ruiné » trancherait davantage que le grec.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe coordonnée du grec est légèrement réorganisée pour être naturelle, tout en conservant le parallélisme entre l’absence de perception et l’absence de honte.
