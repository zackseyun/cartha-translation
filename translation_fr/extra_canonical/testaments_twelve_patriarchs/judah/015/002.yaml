revisions:
- from: Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté, étant devenu esclave de l’immoralité sexuelle, comme cela m’est arrivé à moi aussi.
  to: Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté, après s’être asservi à l’immoralité sexuelle, comme moi aussi je l’ai subi.
  rationale: La révision ne change pas le sens du passage. Elle rend explicitement en français la voix active et l’antériorité du participe grec δουλεύσας, tout en préservant la répétition de πορνεία et l’ambiguïté de ἔπαθον quant à ce que Juda a précisément subi.
  reviewer_model: gpt-5.6-terra
