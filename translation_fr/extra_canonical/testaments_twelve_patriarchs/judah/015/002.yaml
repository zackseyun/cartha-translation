review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la condition royale, la conduite sexuelle illicite, la perte de la royauté et l’expérience personnelle de Juda sont tous conservés. Toutefois, δουλεύσας est un participe aoriste actif : il désigne celui qui s’est asservi à l’immoralité sexuelle, et non explicitement quelqu’un qui « est devenu esclave ».'
  naturalness: Le français du projet est clair et de registre moderne. « Après s’être asservi à » est à la fois naturel dans un registre scripturaire sobre et plus proche de la voix active ainsi que de la valeur antérieure du participe grec.
  terminology: « Immoralité sexuelle » rend de façon appropriée πορνεία sans restreindre indûment le terme à la prostitution ou à l’adultère. « Dépouillé de sa royauté » conserve la force de γυμνοῦται τῆς βασιλείας.
  issues:
  - severity: low
    issue: Rendu de δουλεύσας
    rationale: « étant devenu esclave de » explicite un résultat que le grec ne formule pas directement et atténue l’actif de δουλεύσας (« s’étant asservi / ayant été esclave au service de »). Une formulation active conserve mieux la métaphore et la relation grammaticale avec πορνείᾳ.
  revised_text: Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté, après s’être asservi à l’immoralité sexuelle, comme moi aussi je l’ai subi.
