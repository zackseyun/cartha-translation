source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: fr
  text: Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté, après s’être asservi à l’immoralité sexuelle, comme moi aussi je l’ai subi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύῃ / πορνείᾳ
  choice: se livre à l’immoralité sexuelle / l’immoralité sexuelle
  rationale: Le terme grec désigne largement une conduite sexuelle illicite. « Immoralité sexuelle » en conserve l’étendue sans la réduire à l’adultère ni employer le mot moderne plus étroit « prostitution ».
- source_word: γυμνοῦται τῆς βασιλείας
  choice: il est dépouillé de sa royauté
  rationale: Cette formulation préserve l’image forte de γυμνόω (« mettre à nu, dépouiller ») et rend βασιλεία comme la dignité ou condition royale perdue.
- source_word: δουλεύσας
  choice: étant devenu esclave de
  rationale: Le participe exprime l’asservissement à l’immoralité sexuelle; cette traduction garde la métaphore de l’esclavage et son lien avec la perte de la royauté.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: comme cela m’est arrivé à moi aussi
  rationale: ἔπαθον indique ce que Juda a lui-même subi ou éprouvé. La formulation française reste naturelle sans préciser davantage la nature exacte de cette expérience.
theological_decisions:
- issue: Rapport entre royauté et asservissement au péché sexuel
  choice: Conserver le contraste direct entre la perte de la royauté et l’esclavage à l’immoralité sexuelle.
  alternative: Interpréter la royauté au sens figuré ou expliquer explicitement une déchéance politique.
  rationale: Le grec ne détermine pas si la royauté est ici seulement institutionnelle, morale ou symbolique; la traduction préserve cette tension sans ajouter d’interprétation.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « l’immoralité sexuelle » est maintenue pour refléter celle de la racine grecque, tandis que « à moi aussi » conserve l’insistance de κἀγώ.
