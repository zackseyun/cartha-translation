base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: fr
  text: 'Et l’ange de Dieu me montra que les femmes dominent le roi et assujettissent le pauvre : au roi, elles enlèvent sa gloire ; à l’homme, sa force ; et au pauvre, le moindre soutien dans sa pauvreté.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de la dernière proposition est irrégulier et présente des variantes. Littéralement, il évoque « le moindre soutien de la pauvreté » ; le sens général demeure celui du maigre soutien dont dispose le pauvre.
    reason: Signaler honnêtement la difficulté textuelle et syntaxique de τὴν πτωχείας ἐλάχιστον στήριγμα sans surcharger le corps du texte.
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: dominent le roi
  rationale: Rend naturellement l’idée de prise d’ascendant exprimée par κρατέω avec le génitif, sans ajouter la notion de durée présente dans la consultation anglaise mais absente du grec.
- source_word: τοῦ πτωχοῦ κατακυριεύουσιν
  choice: assujettissent le pauvre
  rationale: κατακυριεύω exprime une domination forte, distincte du verbe précédent ; « assujettissent » conserve cette intensité.
- source_word: τὴν δόξαν
  choice: sa gloire
  rationale: Le possessif français explicite naturellement le génitif « du roi » sans modifier le sens.
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: à l’homme, sa force
  rationale: Suit la syntaxe grecque transmise, qui distingue « l’homme » du « roi » ; évite de fondre les deux en « un homme fort », interprétation de la consultation anglaise qui n’est pas imposée par le grec.
- source_word: πτωχείας ἐλάχιστον στήριγμα
  choice: le moindre soutien dans sa pauvreté
  rationale: Préserve ἐλάχιστον (« le moindre ») et comprend πτωχείας comme le cadre ou la relation du soutien, malgré l’irrégularité textuelle de la leçon.
theological_decisions:
- issue: Portée de l’affirmation sur la domination des femmes
  choice: Ne pas ajouter « pour toujours » ni « pareillement »
  alternative: « les femmes règnent pour toujours sur le roi comme sur le mendiant »
  rationale: Le texte grec fourni ne contient aucun équivalent explicite de « forever » ou « alike » ; la traduction reste donc attachée aux prédicats distincts κρατοῦσι et κατακυριεύουσιν.
- issue: Répartition des trois pertes
  choice: 'Conserver trois bénéficiaires syntaxiquement distincts : le roi, l’homme et le pauvre'
  alternative: Comprendre « la force de l’homme » comme « la puissance d’un homme fort » ou comme une seconde qualité du roi
  rationale: La construction transmise énumère τοῦ βασιλέως, τοῦ ἀνδρός et τοῦ πτωχοῦ. La formulation française maintient cette tension au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme marqué par les deux-points et les points-virgules rend l’énumération grecque lisible. « Pauvre » est préféré à « mendiant », puisque πτωχός désigne ici d’abord une personne indigente et que rien dans le verset n’exige explicitement l’acte de mendier.
