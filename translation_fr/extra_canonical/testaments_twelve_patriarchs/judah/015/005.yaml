  source_fidelity: 'Le texte français rend fidèlement les deux verbes distincts : κρατοῦσι, pour l’ascendant exercé sur le roi, et κατακυριεύουσιν, pour la domination plus appuyée sur le pauvre. Il ne reprend pas l’ajout « pour toujours » de la piste anglaise, absent du grec fourni. L’énumération conserve correctement les trois groupes génitivaux transmis : le roi et sa gloire, l’homme et sa force, le pauvre et son soutien minimal.'
  naturalness: Le français est moderne, lisible et d’un registre approprié au testament ancien. La ponctuation rend clairement l’énumération sans chercher à résoudre artificiellement la tension entre « le roi » et « l’homme ». « Assujettissent le pauvre » est idiomatique et restitue une domination forte.
  terminology: « Ange de Dieu », « gloire », « force », « pauvre » et « soutien » sont justes et cohérents. « Pauvre » est préférable à « mendiant », car πτωχός ne requiert pas ici le sens plus étroit de personne qui mendie. La note traite avec prudence l’irrégularité de la dernière expression et n’impose pas une restitution textuelle incertaine.
