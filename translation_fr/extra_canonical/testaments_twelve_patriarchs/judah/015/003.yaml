  source_fidelity: 'Le texte rend fidèlement la structure grecque : le parfait Δέδωκα est naturellement exprimé par « j’ai donné », et les trois objets ainsi que leurs explications introduites par τουτέστι(ν) sont tous conservés. « Bâton », « ceinture » et « diadème » correspondent précisément à ῥάβδος, ζώνη et διάδημα. Les gloses « soutien de ma tribu », « ma force » et « la gloire de ma royauté » reproduisent sans ajout interprétatif les trois identifications symboliques du grec.'
  naturalness: Le français est moderne, clair et d’un registre convenant à un testament ancien. La répétition de « c’est-à-dire » et les incises par tirets rendent bien le parallélisme explicatif insistant de l’original. La ponctuation est recevable en français éditorial.
  terminology: « Tribu » est le terme approprié pour φυλή dans ce cadre. « Diadème » préserve utilement la précision royale de διάδημα. « Royauté » est une traduction défendable et naturelle de βασιλεία ici, où le contexte peut viser la dignité ou l’exercice royal plutôt qu’un territoire; elle ne supprime aucune ambiguïté théologique pertinente.
