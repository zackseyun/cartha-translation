id: T12P.JUD.15.3
reference: Testament of Judah 15:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα⁸ γὰρ τὴν ῥάβδον μου, τουτέστι⁹ τὸ στήριγμα τῆς ἐμῆς φυλῆς¹⁰, καὶ τὴν ζώνην μου, τουτέστιν¹¹ τὴν δύναμιν, καὶ τὸ διάδημα¹², τουτέστιν¹³ τὴν δόξαν τῆς βασιλείας μου¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: fr
  text: Car j’ai donné mon bâton — c’est-à-dire le soutien de ma tribu —, ma ceinture — c’est-à-dire ma force —, et mon diadème — c’est-à-dire la gloire de ma royauté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: bâton
  rationale: Rend directement l’objet concret, ensuite interprété dans le texte comme le soutien de la tribu.
- source_word: στήριγμα
  choice: soutien
  rationale: Conserve le sens de ce qui sert d’appui ou de soutien, ainsi que le lien métaphorique avec le bâton.
- source_word: φυλῆς
  choice: tribu
  rationale: Équivalent naturel et historiquement approprié dans le contexte des tribus d’Israël.
- source_word: ζώνην
  choice: ceinture
  rationale: Traduction courante de l’objet porté autour de la taille, sans surinterpréter sa fonction symbolique.
- source_word: δύναμιν
  choice: force
  rationale: Exprime ici la puissance ou capacité personnelle symbolisée par la ceinture.
- source_word: διάδημα
  choice: diadème
  rationale: Préserve le terme royal précis plutôt que de le généraliser en « couronne ».
- source_word: δόξαν τῆς βασιλείας μου
  choice: la gloire de ma royauté
  rationale: « Royauté » rend βασιλεία comme dignité et pouvoir royal dans ce contexte, plutôt que comme territoire politique.
theological_decisions:
- issue: Portée symbolique des trois objets
  choice: Conserver les explications explicites du texte sans leur ajouter d’interprétation théologique.
  alternative: Identifier les objets à des réalités messianiques, morales ou institutionnelles plus précises.
  rationale: Le grec fournit lui-même chaque équivalence symbolique, mais ne développe pas davantage leur portée dans ce verset.
- issue: Sens de βασιλεία
  choice: royauté
  alternative: royaume
  rationale: Avec le possessif « ma » et l’expression « gloire de », le contexte paraît viser la dignité ou condition royale de Juda; « royaume » resterait possible, mais serait plus territorial.
translation_notes:
  register: Français moderne, digne et accessible. La structure ternaire et les gloses répétées par « c’est-à-dire » sont conservées afin de reproduire l’insistance et le parallélisme du grec.
