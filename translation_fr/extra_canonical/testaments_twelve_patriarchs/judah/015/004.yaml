  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: fr
  text: Et de fait, après m’être repenti de ces choses, je n’ai bu ni vin ni mangé de viande jusqu’à ma vieillesse, et je n’ai connu aucune joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Et de fait
  rationale: Rend la valeur confirmative de la particule sans introduire une opposition absente du grec.
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: après m’être repenti de ces choses
  rationale: Exprime le repentir impliqué par μετανοέω et le lien avec les faits précédemment évoqués.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: je n’ai consommé ni vin ni viande
  rationale: Le grec emploie littéralement « manger » avec le vin et la viande; « consommer » est naturel en français et s’applique aux deux compléments sans modifier le sens.
- source_word: ἕως γήρους μου
  choice: jusqu’à ma vieillesse
  rationale: Traduction directe qui conserve la limite temporelle, sans préciser si l’abstinence a cessé ensuite.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: je n’ai connu aucune joie
  rationale: L’expression grecque « voir la joie » est idiomatiquement rendue par « connaître la joie »; la négation et πᾶσαν donnent ici le sens d’une absence totale.
theological_decisions:
- issue: Nature de la réaction exprimée par μετανοήσας
  choice: repentir
  alternative: changement d’avis
  rationale: Dans ce contexte moral et pénitentiel, « se repentir » rend mieux le verbe que la formulation plus neutre « changer d’avis », sans ajouter de doctrine particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la syntaxe grecque tout en évitant l’expression peu naturelle « manger du vin ». Aucun marqueur de note n’est requis.
