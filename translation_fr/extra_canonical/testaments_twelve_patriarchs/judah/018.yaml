revisions:
- from: '**Testament de Juda 18**


    1. Je sais aussi quels maux vous commettrez dans les derniers jours[a]. 2. Gardez-vous donc, mes enfants, de l’immoralité sexuelle et de l’amour de l’argent, et écoutez Juda, votre père. 3. Car ces passions éloignent de la loi de Dieu, aveuglent le discernement de l’âme, enseignent l’orgueil et empêchent un homme de faire miséricorde à son prochain. 4. Elles privent son âme de toute bonté, le maintiennent dans les peines et les durs travaux, chassent loin de lui le sommeil et consument sa chair. 5. Elles font obstacle aux sacrifices offerts à Dieu, et cet homme ne se souvient pas de la bénédiction de Dieu. Il n’écoute pas quand un prophète parle et s’irrite contre les paroles de piété. 6. Car il est esclave de deux passions opposées et ne peut obéir à Dieu, parce qu’elles ont aveuglé son âme ; même en plein jour, il marche comme dans la nuit.'
  to: '**Testament de Juda 18**


    1. Je sais aussi quels maux vous commettrez dans les derniers jours[a]. 2. Gardez-vous donc, mes enfants, de l’immoralité sexuelle et de l’amour de l’argent, et écoutez Juda, votre père. 3. Car ces choses détournent de la loi de Dieu, aveuglent le jugement de l’âme, enseignent l’orgueil et ne permettent pas à l’homme d’avoir pitié de son prochain. 4. L’amour de l’argent prive son âme de toute bonté, le retient dans les peines et les durs travaux, chasse loin de lui le sommeil et consume sa chair. 5. Il entrave les sacrifices de Dieu, ne se souvient pas de la bénédiction de Dieu, n’écoute pas lorsqu’un prophète parle et s’irrite contre les paroles de piété. 6. Car l’homme est esclave de deux passions opposées et ne peut obéir à Dieu, parce que l’amour de l’argent a aveuglé son âme ; même en plein jour, il marche comme dans la nuit.'
  rationale: 'La révision rétablit le singulier du grec dans la chaîne descriptive qui suit la mention des deux vices. Elle identifie ce singulier comme « l’amour de l’argent », son antécédent textuel immédiat, notamment afin que le français ne produise pas un pronom singulier sans référent clair. Elle conserve l’ambiguïté plus large du texte : l’homme demeure « esclave de deux passions opposées », sans tentative de les identifier ou de les harmoniser. Elle restitue aussi le génitif non explicité de « sacrifices de Dieu » et préserve l’image finale, absente de l’anglais d’audit.'
