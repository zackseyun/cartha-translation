  text: '1. The Lord gave me favor because I obeyed my father. 2. Therefore I never grieved Jacob my father, for I did everything he told me. 3. And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me in the same way. 4. And I know what evils you will do in the last days.


    5. Guard yourselves, therefore, my children, from sexual immorality and from the love of money, and listen to Judah your father. 6. For these turn one away from the law of God, and blind the purpose of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor. 7. They deprive his soul of every goodness, and hold him fast in pains and labors; they drive sleep away from him, and consume his flesh. 8. They hinder the sacrifices of God, and he does not remember the blessing of God. He does not listen when a prophet speaks, and he resents words of godliness. 9. For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.'
translation:
  language: fr
  text: '**Testament de Juda 18**


    1. Je sais aussi quels maux vous commettrez dans les derniers jours[a]. 2. Gardez-vous donc, mes enfants, de l’immoralité sexuelle et de l’amour de l’argent, et écoutez Juda, votre père. 3. Car ces choses détournent de la loi de Dieu, aveuglent le jugement de l’âme, enseignent l’orgueil et ne permettent pas à l’homme d’avoir pitié de son prochain. 4. L’amour de l’argent prive son âme de toute bonté, le retient dans les peines et les durs travaux, chasse loin de lui le sommeil et consume sa chair. 5. Il entrave les sacrifices de Dieu, ne se souvient pas de la bénédiction de Dieu, n’écoute pas lorsqu’un prophète parle et s’irrite contre les paroles de piété. 6. Car l’homme est esclave de deux passions opposées et ne peut obéir à Dieu, parce que l’amour de l’argent a aveuglé son âme ; même en plein jour, il marche comme dans la nuit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots « dans les derniers jours » sont placés entre crochets dans l’édition grecque utilisée, ce qui signale une incertitude textuelle.
    reason: Signaler honnêtement le statut éditorial incertain de l’expression sans la retirer du texte principal.
lexical_decisions:
- source_word: πορνεία
  choice: immoralité sexuelle
  rationale: Terme français actuel et suffisamment large pour rendre la conduite sexuelle illicite visée par le grec sans la réduire à la prostitution.
- source_word: φιλαργυρία
  choice: amour de l’argent
  rationale: Rend directement le composé grec plutôt que le plus abstrait « avarice ».
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: le discernement de l’âme
  rationale: Exprime la faculté intérieure de délibérer et de juger, que les passions rendent aveugle.
- source_word: ἐλεῆσαι
  choice: faire miséricorde
  rationale: Conserve la force morale et relationnelle du verbe grec, au-delà d’une simple compassion ressentie.
- source_word: προσοχθίζει
  choice: s’irrite contre
  rationale: Le verbe indique une réaction d’agacement ou d’hostilité envers les paroles pieuses.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: même en plein jour, il marche comme dans la nuit
  rationale: Préserve l’image finale du texte grec, absente de la couche anglaise de consultation.
theological_decisions:
- issue: Référent des verbes décrivant l’action des vices
  choice: Employer d’abord le pluriel « ces passions / elles », puis désigner explicitement « cet homme » lorsque le grec passe à l’action de la personne asservie.
  alternative: Maintenir partout un sujet singulier indéfini ou attribuer toutes les actions aux deux passions.
  rationale: Le grec oscille entre les vices mentionnés et l’homme dominé par eux. La formulation française rend ce mouvement intelligible sans effacer la tension grammaticale.
- issue: Sacrifices de Dieu
  choice: « sacrifices offerts à Dieu »
  alternative: « sacrifices de Dieu »
  rationale: Le génitif peut désigner les sacrifices qui appartiennent à Dieu ou lui sont destinés. La formulation retenue communique naturellement ce rapport sans introduire une doctrine sacrificielle particulière.
- issue: Deux passions opposées
  choice: Conserver « deux passions opposées » sans expliquer leur opposition.
  alternative: Identifier ou harmoniser explicitement la nature de leur opposition.
  rationale: Le texte les qualifie d’opposées sans développer ce paradoxe; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La numérotation suit les six sections du chapitre grec fourni. La traduction repose sur ce texte grec plutôt que sur la couche anglaise, qui contient au début des éléments absents de la source grecque donnée et omet l’image finale du verset 6.
