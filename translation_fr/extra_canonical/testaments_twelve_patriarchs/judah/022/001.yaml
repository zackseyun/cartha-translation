source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐπάξει¹ δὲ αὐτοῖς Κύριος διαιρέσεις *κατ᾽ ἀλλήλων¹³, καὶ ἔσονται *συνεχεῖς ἔσονται³ ἐν Ἰσραήλ⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/001.yaml
  text: The Lord will bring divisions among them against one another, and continual wars will be in Israel.
translation:
  language: fr
  text: Le Seigneur fera venir sur eux des divisions qui les opposeront les uns aux autres, et elles seront continuelles en Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπάξει
  choice: suscitera parmi eux
  rationale: Le verbe signifie littéralement « fera venir / amènera sur ». Dans ce contexte, « suscitera parmi eux » exprime naturellement l’action causative sans alourdir la phrase.
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: des divisions qui les dresseront les uns contre les autres
  rationale: Cette formulation rend à la fois l’idée de dissensions et la valeur réciproque de κατ᾽ ἀλλήλων.
- source_word: συνεχεῖς
  choice: continuelles
  rationale: L’adjectif exprime ce qui se poursuit sans interruption ou de façon persistante.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Rendu direct du complément grec, qui peut désigner le peuple d’Israël dans son ensemble.
theological_decisions:
- issue: Référent implicite de συνεχεῖς
  choice: Reprendre explicitement « ces divisions »
  alternative: Introduire « des guerres continuelles », comme dans la consultation anglaise
  rationale: Le grec fourni ne comporte aucun substantif signifiant « guerres ». Le féminin pluriel συνεχεῖς s’accorde naturellement avec διαιρέσεις ; la reprise explicite évite une phrase française elliptique tout en restant fondée sur le texte source.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « divisions » explicite le lien grammatical du grec et évite d’importer la notion de « guerres », absente du texte source fourni.
