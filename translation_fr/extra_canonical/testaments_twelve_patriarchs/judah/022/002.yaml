  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: fr
  text: Et mon royaume prendra fin parmi les étrangers, jusqu’à ce que vienne le salut d’Israël,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλοις
  choice: étrangers
  rationale: Le terme désigne des personnes d’un autre peuple; « étrangers » conserve ici sa portée générale sans préciser indûment « Philistins » ou « nations ».
- source_word: συντελεσθήσεται
  choice: prendra fin
  rationale: Le passif futur exprime l’achèvement ou la cessation du royaume; cette formulation française est naturelle et fidèle au sens contextuel.
- source_word: τὸ σωτήριον
  choice: le salut
  rationale: Le substantif neutre désigne ici le salut ou la délivrance; « le salut » préserve la formulation théologique générale du grec.
theological_decisions:
- issue: Nature du « salut d’Israël »
  choice: Conserver l’expression sans identifier explicitement une personne ou un événement précis.
  alternative: « le Sauveur d’Israël » ou « la délivrance d’Israël »
  rationale: Le grec τὸ σωτήριον signifie « le salut / ce qui apporte le salut » et ne justifie pas à lui seul une identification personnelle; « salut » maintient l’ambiguïté théologique.
- issue: Valeur temporelle de ἕως τοῦ ἐλθεῖν
  choice: « jusqu’à ce que vienne »
  alternative: « jusqu’à la venue de »
  rationale: La proposition française reproduit clairement la limite temporelle sans déterminer si la situation cesse immédiatement ou seulement atteint alors son terme annoncé.
translation_notes:
  register: Français moderne, digne et accessible. La structure coordonnée et la virgule finale sont conservées parce que le verset fourni constitue une proposition qui se poursuit dans le contexte.
