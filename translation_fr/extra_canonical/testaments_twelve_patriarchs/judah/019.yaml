  text: My children[b][a], the love of money leads to idolatry.
translation:
  language: fr
  text: '19


    1 Mes enfants, l’amour de l’argent conduit à l’idolâtrie. Car, dans l’illusion que produit l’argent, ils appellent dieux ceux qui ne le sont pas, et l’amour de l’argent fait tomber celui qui le possède dans un état de délire.[a]


    2 À cause de l’argent, mes enfants, j’ai perdu mes enfants. Si mon repentir, mon humilité et les prières de mon père ne m’avaient pas secouru, je serais mort sans enfant. 3 Mais le Dieu de mes pères a eu compassion de moi, parce que j’avais fait cela dans l’ignorance.


    4 Car le prince de l’égarement m’a aveuglé, et j’ai été dans l’ignorance en tant qu’homme et en tant qu’être de chair corrompu par les péchés; j’ai reconnu ma propre faiblesse, alors que je me croyais invincible.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἔκστασις peut désigner une sortie de soi, un égarement profond, un état de stupeur ou de délire; le contexte lui donne ici un sens négatif.
    reason: lexical_alternative
  - marker: b
    text: 'La formulation grecque est condensée : littéralement, « j’ai été dans l’ignorance comme un homme et comme chair corrompue par les péchés ». La relation précise entre « homme », « chair » et la corruption par les péchés demeure ambiguë.'
    reason: source_ambiguity
lexical_decisions:
- source_word: φιλαργυρία
  choice: l’amour de l’argent
  rationale: Rend précisément l’attachement à l’argent exprimé par le composé grec, sans l’élargir au sens plus général de « cupidité ».
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: conduit à l’idolâtrie
  rationale: Le texte grec fourni contient le verbe explicite ὁδηγεῖ (« conduire ») et πρός marque ici la direction ou l’aboutissement, non une identité stricte entre les deux réalités.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: égarés par l’argent
  rationale: Formulation française naturelle qui conserve l’idée d’une erreur ou illusion produite par l’argent, tout en évitant une expression nominale obscure.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: tomber dans un état de délire
  rationale: Dans ce contexte moral négatif, ἔκστασις désigne une sortie de soi ou un dérèglement de l’esprit plutôt qu’une expérience mystique positive.
- source_word: ταπείνωσίς
  choice: humiliation
  rationale: Conserve le sens d’abaissement de soi dans une liste où figurent le repentir et les prières; « humilité » serait également possible mais décrirait davantage une disposition durable.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: le prince de l’égarement
  rationale: Préserve le titre personnel ἄρχων et la portée de πλάνη comme puissance d’erreur ou d’égarement, sans identifier davantage cette figure que ne le fait le texte.
- source_word: ἠγνόησα
  choice: j’étais sans discernement
  rationale: Rend l’absence de connaissance ou de compréhension dans une formulation compatible avec les compléments anthropologiques qui suivent.
- source_word: ἀκαταμάχητος
  choice: invincible
  rationale: Équivalent direct et idiomatique de ce qui ne peut être vaincu ou combattu avec succès.
theological_decisions:
- issue: Rapport entre l’amour de l’argent et l’idolâtrie
  choice: « conduit à l’idolâtrie »
  alternative: « est de l’idolâtrie »
  rationale: Le verbe ὁδηγεῖ présent dans la source affirme une progression ou une conduite vers l’idolâtrie; il ne formule pas une équation ontologique stricte.
- issue: Identité du « prince de l’égarement »
  choice: Conserver le titre sans explicitation
  alternative: L’identifier explicitement à Satan ou au diable
  rationale: Le texte présente une figure personnelle qui aveugle, mais ne la nomme pas davantage dans ce passage. La traduction préserve cette retenue.
- issue: Description de l’être humain et de la chair au verset 4
  choice: Maintenir les deux formulations, « comme un homme » et « comme un être de chair »
  alternative: Les fusionner en « à cause de ma faiblesse humaine »
  rationale: Le grec juxtapose ὡς ἄνθρωπος et ὡς σάρξ. Leur maintien conserve la tension anthropologique du texte sans l’expliquer selon un système doctrinal particulier.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse patriarcale « Mes enfants » et le parallélisme exhortatif sont conservés. Les formulations ont été légèrement déployées lorsque le grec est condensé, mais les ambiguïtés théologiques majeures sont maintenues ou signalées en note.
