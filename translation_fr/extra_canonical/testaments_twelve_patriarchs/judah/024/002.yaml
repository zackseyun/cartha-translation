source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔσεσθε αὐτῷ εἰς υἱοὺς¹⁷ ἐν ἀληθείᾳ¹⁸, *καὶ πορεύεσθε¹⁸ ἐν προστάγμασιν¹⁹ αὐτοῦ πρώτοις καὶ ἐσχάτοις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: fr
  text: Et vous serez pour lui des fils en vérité, et vous marcherez selon ses commandements, les premiers et les derniers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσεσθε αὐτῷ εἰς υἱούς
  choice: vous serez pour lui des fils
  rationale: Cette formulation conserve l’image filiale et rend naturellement en français la construction grecque exprimant la relation d’appartenance à son égard.
- source_word: ἐν ἀληθείᾳ
  choice: en vérité
  rationale: Traduction directe qui préserve l’ambiguïté entre sincérité, authenticité et conformité à la vérité.
- source_word: πορεύεσθε ἐν προστάγμασιν αὐτοῦ
  choice: vous marcherez selon ses commandements
  rationale: « Marcher » maintient la métaphore biblique de la conduite, tandis que « selon » exprime idiomatiquement la conformité aux prescriptions.
- source_word: πρώτοις καὶ ἐσχάτοις
  choice: les premiers comme les derniers
  rationale: Les adjectifs s’accordent avec « commandements » et désignent vraisemblablement leur totalité, sans réduire la formule à une simple chronologie.
theological_decisions:
- issue: Nature de la filiation exprimée par εἰς υἱούς
  choice: Conserver « des fils » sans préciser la nature de cette filiation
  alternative: « vous deviendrez ses fils » ou « vous serez vraiment ses enfants »
  rationale: Le grec affirme une relation filiale sans en expliciter le mécanisme ni la portée théologique; la traduction ne doit pas trancher davantage.
- issue: Portée de « les premiers et les derniers »
  choice: Rattacher explicitement la formule aux commandements tout en conservant ses deux pôles
  alternative: « tous ses commandements »
  rationale: La paraphrase par « tous » expliciterait probablement le sens, mais effacerait la forme rhétorique et sa possible nuance chronologique.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe demeure proche du grec sans calque maladroit; « marcher selon » conserve le registre scripturaire courant.
