source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ¹⁰ οἱ οὐρανοὶ ἐκχέαι¹⁴ πνεῦμα¹⁵ εὐλογίαν πατρὸς ἁγίου¹⁶, καὶ αὐτὸς ἐκχέει ἐφ᾽ ὑμᾶς πνεῦμα χάριτος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/001.yaml
  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: fr
  text: Les cieux s’ouvriront au-dessus de lui pour répandre un esprit, une bénédiction du Père saint, et lui-même répandra[a] sur vous un esprit de grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « répand » ; le présent grec peut donner à l’annonce future une force immédiate.'
    reason: Signale que ἐκχέει est au présent dans le grec, tandis que le futur français s’accorde avec le cadre prophétique de la phrase.
lexical_decisions:
- source_word: ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοί
  choice: les cieux s’ouvriront au-dessus de lui
  rationale: Rend directement l’image grecque de cieux qui s’ouvrent sur ou au-dessus de lui, contrairement à la consultation anglaise, qui omet cette proposition.
- source_word: πνεῦμα εὐλογίαν πατρὸς ἁγίου
  choice: un esprit, bénédiction du Père saint
  rationale: Conserve l’apposition du grec entre « esprit » et « bénédiction », sans imposer une identification plus précise; l’absence d’article favorise ici l’indéfini en français.
- source_word: πνεῦμα χάριτος
  choice: un esprit de grâce
  rationale: Traduction naturelle qui maintient le sens qualitatif du génitif χάριτος sans préciser indûment s’il s’agit de l’Esprit divin ou d’une disposition accordée.
- source_word: ἐκχέαι / ἐκχέει
  choice: pour répandre / répandra
  rationale: Maintient le verbe répété « répandre »; le second présent grec est rendu au futur selon le cadre prophétique français.
theological_decisions:
- issue: Identification de πνεῦμα avec le Saint-Esprit
  choice: esprit en minuscule
  alternative: Esprit avec une majuscule
  rationale: Le texte grec ne comporte pas d’article ni l’expression « Esprit saint »; la minuscule préserve l’ambiguïté entre l’Esprit divin et un don spirituel.
- issue: Relation entre « esprit » et « bénédiction »
  choice: 'apposition ouverte: « un esprit, bénédiction du Père saint »'
  alternative: « l’esprit de la bénédiction du Père saint »
  rationale: Le grec juxtapose les accusatifs πνεῦμα et εὐλογίαν; une apposition respecte cette tension syntaxique sans ajouter un lien génitif absent.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image cosmique, la répétition de « répandre » et les ambiguïtés du grec concernant « esprit ».
