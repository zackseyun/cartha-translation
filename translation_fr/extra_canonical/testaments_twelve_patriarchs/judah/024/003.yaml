  text: '[This is the shoot of the Most High God, a spring providing life to all flesh.]'
translation:
  language: fr
  text: '[Voici le rejeton du Dieu Très-Haut, et voici la source qui donne la vie à tous.]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστός
  choice: rejeton
  rationale: Rend l’image végétale d’une jeune pousse issue d’une souche, tout en conservant la possible portée dynastique du terme.
- source_word: πηγή
  choice: source
  rationale: Équivalent français direct et naturel de l’image grecque d’une source d’eau.
- source_word: παρέχουσα ζωήν
  choice: qui donne la vie
  rationale: Exprime clairement l’action de procurer ou d’accorder la vie dans un français courant et digne.
- source_word: πᾶσι
  choice: à tous
  rationale: Le grec transmis signifie simplement « à tous »; il ne contient pas le substantif « chair ».
theological_decisions:
- issue: Identification du rejeton et de la source
  choice: Conserver deux présentations parallèles avec « voici », sans préciser davantage leur référent.
  alternative: Identifier explicitement les deux images à une figure messianique particulière.
  rationale: Le verset emploie des images et des démonstratifs sans expliciter ici leur référent; la traduction préserve cette ouverture.
- issue: Portée de πᾶσι
  choice: « à tous »
  alternative: « à toute chair »
  rationale: « Toute chair » introduirait un élément absent du texte grec fourni et résoudrait indûment la portée du datif pluriel.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme du grec est conservé par la répétition de « voici ». Les crochets de l’édition source sont maintenus afin de signaler le statut textuel du passage.
