base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: fr
  text: Et d’elle germera un bâton de justice pour les nations, pour juger et sauver tous ceux qui invoquent le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ αὐτῆς
  choice: d’elle
  rationale: Conserve le pronom féminin du grec et son renvoi au contexte antérieur sans en préciser artificiellement l’antécédent.
- source_word: βλαστήσει
  choice: jaillira
  rationale: Rend naturellement l’idée de pousser ou de germer, avec une image végétale claire en français.
- source_word: ῥάβδος δικαιοσύνης
  choice: un rameau de justice
  rationale: Dans ce contexte de germination, « rameau » restitue mieux l’image végétale que « verge » ou « bâton », tout en conservant le génitif « de justice ».
- source_word: τοῖς ἔθνεσι
  choice: pour les nations
  rationale: Rend le datif de destination ou de bénéfice sans imposer ici le sens plus étroit de « païens ».
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: qui invoquent le Seigneur
  rationale: Formulation française courante qui conserve le sens religieux d’en appeler au Seigneur ou de prononcer son nom dans la prière.
theological_decisions:
- issue: Portée de πάντας τοὺς ἐπικαλουμένους
  choice: tous ceux qui invoquent le Seigneur
  alternative: tous les hommes qui invoquent le Seigneur
  rationale: Le grec exprime « tous ceux » sans substantif explicite; la traduction évite d’ajouter « hommes » et conserve la portée universelle de πάντας.
- issue: Relation entre jugement et salut
  choice: afin de juger et de sauver
  alternative: pour juger, puis sauver
  rationale: La coordination grecque καὶ ne précise ni succession ni opposition; la traduction maintient les deux actions parallèles sans résoudre leur tension théologique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant naturelle; l’imagerie végétale est préservée et aucune précision doctrinale absente du texte n’est ajoutée.
