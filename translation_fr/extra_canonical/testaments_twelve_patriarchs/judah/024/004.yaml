  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: fr
  text: Alors le sceptre de mon royaume resplendira, et de votre racine surgira une pousse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: resplendira
  rationale: Rend naturellement l’idée d’émettre soudainement ou vivement de la lumière, tout en conservant le registre royal et prophétique.
- source_word: σκῆπτρον βασιλείας μου
  choice: le sceptre de mon royaume
  rationale: Traduction formellement proche qui préserve l’image du sceptre comme symbole de la royauté ou de l’autorité royale.
- source_word: πυθμήν
  choice: une pousse
  rationale: Dans le parallélisme végétal avec ῥίζης, « pousse » exprime en français courant une nouvelle croissance issue de la racine; « souche » ou « tronc » seraient possibles lexicalement, mais moins naturels ici.
theological_decisions:
- issue: Portée messianique possible de l’image du sceptre et de la pousse
  choice: Conserver les images sans identifier explicitement leur référent
  alternative: Traduire ou développer le verset de manière explicitement messianique
  rationale: Le grec présente des images royales et végétales suggestives, mais ne nomme pas ici le personnage annoncé; la traduction préserve donc l’ouverture interprétative du texte.
- issue: Référent du pluriel ὑμῶν
  choice: votre racine
  alternative: ta racine
  rationale: Le pronom grec est au pluriel; le français maintient cette donnée plutôt que de l’assimiler à une adresse individuelle.
translation_notes:
  register: Français moderne, digne et accessible. Le futur prophétique et le parallélisme des deux membres sont conservés. « Resplendira » maintient l’éclat poétique de ἀναλάμψει sans alourdir la phrase.
