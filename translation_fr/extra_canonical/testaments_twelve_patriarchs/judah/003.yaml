  naturalness: Le français est globalement moderne et narratif. « Me précipitai seul contre » est plus naturel que « courus seul sur », et « en armure » rend plus précisément le grec sans alourdir le récit.
  terminology: Les noms Taphou, Achor et Bélisath sont conservés conformément au texte de base. « Litra », « coudée », « cuirasse » et « ange de puissance » sont appropriés. La note sur les douze coudées préserve correctement la difficulté syntaxique sans la dissimuler.
