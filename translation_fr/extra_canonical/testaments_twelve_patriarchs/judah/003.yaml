  - severity: low
    issue: Rendu de τεθωρακισμένοι au v. 1
    rationale: « En armes » peut désigner des hommes simplement armés, tandis que le participe renvoie plus précisément à l’équipement d’armure. « En armure » est naturel et plus fidèle.
