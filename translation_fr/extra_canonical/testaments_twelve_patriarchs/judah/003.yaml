base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003.yaml
  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
translation:
  language: fr
  text: '**Testament de Juda 3**


    **1.** Lorsque les deux rois des Cananéens vinrent en armure attaquer nos troupeaux, accompagnés d’une foule nombreuse, je me précipitai seul contre l’un des rois et lui mis les os en pièces.[a]


    **2.** Quant à l’autre roi, Taphou, je le tuai alors qu’il était assis sur son cheval ; ainsi, je dispersai tout son peuple.


    **3.** Je trouvai aussi le roi Achor, un géant, qui, monté sur un cheval, tirait des flèches devant lui et derrière lui. Je saisis une pierre de soixante litras[b] et en frappai le cheval, que je tuai.


    **4.** Après avoir combattu Achor pendant deux heures, je le tuai. Je fendis son bouclier en deux et lui tranchai les pieds.


    **5.** Pendant que je lui retirais sa cuirasse, voici que huit hommes, ses compagnons, se mirent à me combattre.


    **6.** J’enroulai alors mon vêtement autour de mon bras et leur lançai des pierres avec une fronde. J’en tuai quatre, et les autres prirent la fuite.


    **7.** Mon père Jacob tua Bélisath, le roi de tous les rois, un homme gigantesque, d’une force prodigieuse, qui mesurait douze coudées.[c]


    **8.** La terreur s’empara d’eux, et ils cessèrent de nous combattre.


    **9.** C’est pourquoi mon père était sans inquiétude dans les guerres lorsque j’étais avec mes frères.


    **10.** En effet, il avait vu à mon sujet, dans une vision, qu’un ange de puissance m’accompagnait en toutes choses, afin que je ne sois pas vaincu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tradition grecque de ce chapitre est textuellement embrouillée. Certains témoins donnent d’autres noms aux adversaires, notamment des formes telles que Chora ou Nachor, et certains répètent ou réorganisent des éléments du récit des combats.
    reason: textual_variant
  - marker: b
    text: La litra était une ancienne unité de poids. Le texte souligne surtout la masse extraordinaire de la pierre ; les équivalences modernes varient selon l’époque et le système de mesure.
    reason: cultural_note
  - marker: c
    text: 'Le grec de la fin du verset est difficile : il associe « la force » et « douze coudées » de manière abrupte. Comme la coudée est une mesure de longueur, la traduction comprend ces mots comme une indication de la taille du géant, tout en conservant la mention distincte de sa force.'
    reason: textual_difficulty
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: en armes
  rationale: Le participe désigne des hommes équipés d’une armure. « En armes » est naturel en français et n’impose pas que leur équipement se limite à une cuirasse.
- source_word: ποίμνια
  choice: troupeaux
  rationale: Le terme désigne les animaux gardés dans un cadre pastoral sans préciser ici leur espèce.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: je lui brisai les os
  rationale: Le texte grec fourni parle des os et emploie un verbe violent évoquant le déchirement ou la mise en pièces. Cette traduction suit cette leçon plutôt que la formulation différente de la couche anglaise.
- source_word: ἀνεῖλον
  choice: je tuai
  rationale: Ce verbe narratif signifie ici mettre à mort. « Tuer » reste clair, direct et actuel.
- source_word: διεσκόρπισα
  choice: je dispersai
  rationale: La traduction conserve l’image concrète de la dispersion sans préciser davantage le résultat militaire.
- source_word: γίγαντα
  choice: un géant / un homme gigantesque
  rationale: Le mot présente les adversaires comme des êtres d’une taille ou d’une puissance extraordinaire ; le choix conserve le registre héroïque du récit.
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: une pierre de soixante litras
  rationale: La translittération maintient l’unité ancienne et l’effet d’une masse extraordinaire sans proposer une conversion moderne incertaine.
- source_word: δέδωκα τῷ ἵππῳ καὶ ἀπέκτεινα αὐτόν
  choice: j’en frappai le cheval, que je tuai
  rationale: « Donner au cheval » a ici le sens idiomatique de lui porter le coup. Le pronom masculin renvoie le plus naturellement au cheval, puisque le combat contre Achor continue au verset suivant.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: leur lançai des pierres avec une fronde
  rationale: Le verbe indique explicitement l’emploi d’une fronde ; la formulation française rend à la fois l’arme et les projectiles.
- source_word: ἄγγελος δυνάμεως
  choice: un ange de puissance
  rationale: La traduction formelle conserve le génitif ambigu, qui peut caractériser la puissance de l’ange ou son appartenance à la sphère de la puissance.
- source_word: συνέπεταί μοι
  choice: m’accompagnait
  rationale: Le verbe évoque littéralement le fait de voler avec quelqu’un. Dans le contexte de la vision et de l’assistance angélique, « accompagner » communique naturellement la relation sans exclure cette image.
theological_decisions:
- issue: Identité des adversaires et enchaînement des combats aux versets 1 à 4
  choice: 'Suivre les noms et la succession du texte grec fourni : Taphou est tué, le cheval d’Achor est tué, puis Achor lui-même est tué après deux heures de combat.'
  alternative: D’autres témoins donnent des noms tels que Chora ou Nachor et peuvent déplacer ou répéter des éléments du récit.
  rationale: La traduction ne lisse pas la tradition manuscrite à partir de la couche anglaise et rend cohérent le référent immédiat du pronom au verset 3 sans supprimer l’instabilité textuelle signalée en note.
- issue: Fonction de l’ange au verset 10
  choice: Conserver « ange de puissance » et la proposition finale « afin que je ne sois pas vaincu ».
  alternative: 'Interpréter « de puissance » comme « puissant » ou reformuler la fin comme une simple conséquence : « de sorte que je n’étais jamais vaincu ».'
  rationale: La formulation retenue préserve l’ambiguïté du génitif et la tension entre assistance divine et prouesses personnelles, sans y importer une doctrine particulière.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent directes pour préserver la vigueur du récit héroïque. Les termes archaïsants inutiles ont été évités, tandis que les noms propres, l’unité « litra » et la « coudée » maintiennent la couleur ancienne. Les répétitions de « je tuai » et « combattre » sont volontairement conservées lorsqu’elles structurent le témoignage de Juda.
