base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/007.yaml
  text: For I said, “Perhaps she acted deceitfully, having received the pledge from another.”
translation:
  language: fr
  text: 'Car ils disaient : « Peut-être avait-elle agi avec tromperie, après avoir reçu les gages d’une autre femme, et avait-elle employé envers moi ses premières paroles. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque rendue par « avait-elle employé envers moi ses premières paroles » est difficile. Elle peut renvoyer à des paroles antérieures qu’elle avait déjà employées, sans préciser lesquelles.
    reason: Signaler l’ambiguïté réelle de τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ sans imposer une reconstruction du récit.
lexical_decisions:
- source_word: ἐν δολιότητι ἐποίησε
  choice: a-t-elle agi avec tromperie
  rationale: Rend directement l’idée d’agir de manière trompeuse, dans un français naturel, sans ajouter un objet absent du grec.
- source_word: παρὰ ἑτέρας
  choice: de quelqu’un d’autre
  rationale: Le grec indique une autre personne sans permettre de préciser davantage son identité; la formulation française préserve cette indétermination.
- source_word: τοὺς ἀρραβῶνας
  choice: les gages
  rationale: Dans le contexte, il s’agit d’objets remis comme garantie; « gages » conserve ce sens concret et le pluriel grec.
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: aurait repris avec moi ses premières paroles
  rationale: Cette formulation conserve l’allusion peu explicite à des paroles antérieures et place les deux actes sous la portée probable de « peut-être », sans prétendre identifier précisément ces paroles.
theological_decisions:
- issue: Portée de Μήποτε sur les deux propositions
  choice: 'Employer le conditionnel passé dans les deux membres : « elle aurait reçu… et aurait repris… »'
  alternative: 'Limiter l’incertitude au premier acte et traduire ensuite par un indicatif : « et elle a repris… »'
  rationale: La coordination grecque permet de comprendre que toute la supposition de Juda demeure incertaine; le français marque clairement cette portée sans résoudre l’obscurité du contenu.
translation_notes:
  register: Français international moderne, digne et lisible. Le discours intérieur est rendu par « je me disais »; la syntaxe française explicite la valeur hypothétique tout en conservant l’indétermination et l’obscurité du grec.
