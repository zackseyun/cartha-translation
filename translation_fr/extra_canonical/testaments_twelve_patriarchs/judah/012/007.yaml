  source_fidelity: 'Révision nécessaire : le texte grec fourni porte Ἔλεγον (« ils disaient »), à l’imparfait pluriel, et non un monologue à la première personne. La traduction doit suivre cette leçon source, même si la piste anglaise donne « I said ». Par ailleurs, ἑτέρας est féminin et se rend le plus exactement par « d’une autre [femme] »; « quelqu’un d’autre » efface cette indication grammaticale. Les deux propositions coordonnées restent sous la portée possible de Μήποτε.'
  naturalness: « Car ils disaient » et le discours direct au plus-que-parfait du subjonctif (« avait agi », « avait reçu », « avait employé ») donnent un français moderne et naturel, tout en exprimant une supposition portant sur des faits antérieurs. « Employer envers moi ses premières paroles » reste volontairement proche de la formulation grecque, dont le référent est obscur.
  terminology: « Gages » convient pour τοὺς ἀρραβῶνας, des objets remis en garantie. « Tromperie » rend δολιότης sans charger le sens. « Une autre femme » respecte le féminin substantivé ἑτέρας sans identifier cette femme ni reconstruire le récit.
