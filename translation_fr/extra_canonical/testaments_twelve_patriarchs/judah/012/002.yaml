  text: For it was a law of the Amorites that a widow should sit openly in prostitution.
translation:
  language: fr
  text: 2. En effet, chez les Amorites, la loi prescrivait qu’une veuve reste assise pendant sept jours près de la porte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νόμος
  choice: la loi
  rationale: Rend directement le grec νόμος, qui désigne ici une règle ou pratique normative.
- source_word: τὴν χηρεύουσαν
  choice: une veuve
  rationale: Expression naturelle en français pour « celle qui est veuve » ou « celle qui a perdu son mari ».
- source_word: προκαθεσθαι
  choice: s’assoie
  rationale: Le verbe signifie s’asseoir ou être assise en avant; la proximité de la porte est précisée séparément par παρὰ τὴν πύλην, sans aucune mention de prostitution dans cette source grecque.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: pendant sept jours
  rationale: Rend clairement la durée exprimée par ἐπί avec l’accusatif.
- source_word: παρὰ τὴν πύλην
  choice: près de la porte
  rationale: Traduction naturelle de la localisation indiquée par παρά avec l’accusatif; « porte » peut désigner une porte ou une porte de ville selon le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure « voulait que » exprime naturellement le caractère prescriptif de la loi sans alourdir la phrase. Le texte suit la source grecque fournie, qui parle de sept jours près de la porte et ne contient aucune référence à la prostitution.
