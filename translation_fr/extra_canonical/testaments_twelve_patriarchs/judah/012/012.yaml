  text: I was forty-six years old, and I spent seventy-three years in Egypt.
translation:
  language: fr
  text: J’avais quarante-six ans, et j’ai passé soixante-treize ans en Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤμην δὲ ἐγὼ ἐτῶν τεσσαράκοντα καὶ ἕξ
  choice: J’avais quarante-six ans
  rationale: Le tour grec exprime l’âge. En français courant, « avoir … ans » est la formulation naturelle. La particule δέ marque ici une transition légère et n’exige pas un « or » ou un « maintenant » explicite.
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: j’ai passé soixante-treize ans en Égypte
  rationale: Dans ce contexte, ποιέω avec une durée signifie passer ou accomplir une période de temps; « passer … ans » restitue clairement l’idiome. εἰς Αἴγυπτον est rendu idiomatiquement par « en Égypte ».
