    issue: « près de la porte de la ville » est moins précis que le grec πρὸς τὴν πύλην.
    rationale: πρός avec l’accusatif situe Tamar à la porte, ou en face de celle-ci, plutôt que simplement dans son voisinage. « à la porte de la ville » est plus fidèle et idiomatique.
  - severity: low
    issue: La relation d’Énan avec « la ville » est légèrement obscurcie.
    rationale: ἐν Ἐνὰν τῇ πόλει présente Énan en relation étroite avec la ville; « dans la ville d’Énan » conserve explicitement les deux éléments sans ajouter l’auberge absente du grec.
  revised_text: 12. Après cela, alors que Tamar était veuve depuis deux ans, elle apprit que je montais tondre les moutons ; elle se para d’une tenue nuptiale et s’assit à la porte de la ville d’Énan.
