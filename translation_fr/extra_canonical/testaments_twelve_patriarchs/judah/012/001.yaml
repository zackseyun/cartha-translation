  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/001.yaml
  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: fr
  text: 12. Après cela, alors que Tamar était veuve depuis deux ans, elle apprit que je montais tondre les moutons ; elle se para d’une tenue nuptiale et s’assit à la porte de la ville d’Énan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμάρ μετὰ ἔτη δύο
  choice: Tamar, qui était veuve depuis deux ans
  rationale: Le génitif absolu décrit l’état de veuvage de Tamar et sa durée; cette formulation est naturelle en français et conserve le repère temporel.
- source_word: ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα
  choice: je montais tondre les moutons
  rationale: ἀνέρχομαι exprime une montée et l’infinitif articulé au génitif en indique ici le but.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: Elle se para d’une tenue nuptiale
  rationale: La répétition étymologique de κοσμέω et κόσμος évoque l’action de se parer; «tenue nuptiale» rend le caractère associé aux noces sans préciser indûment un vêtement unique.
- source_word: ἐν Ἐνάν
  choice: à Énan
  rationale: Le texte grec présente Énan comme un nom de lieu; la translittération française reste proche de la forme source.
- source_word: τῇ πόλει πρὸς τὴν πύλην
  choice: près de la porte de la ville
  rationale: πρός avec l’accusatif situe Tamar auprès de la porte, tandis que τῇ πόλει est compris en apposition ou en relation locale avec Énan. Le grec fourni ne contient aucun terme signifiant «auberge».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase longue du grec est divisée en deux pour améliorer la lisibilité sans modifier la succession des événements. La traduction suit le grec α primaire plutôt que l’ajout inexpliqué «of the inn» de la couche anglaise.
