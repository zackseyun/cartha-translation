  text: '*Ἀλλ᾽ οὐδὲ⁵² ἤγγισα⁵³ αὐτῇ ἔτι⁵⁴ ἕως⁵⁵ τῆς ζωῆς μου⁵⁶.'
  language: Greek
base_translation:
