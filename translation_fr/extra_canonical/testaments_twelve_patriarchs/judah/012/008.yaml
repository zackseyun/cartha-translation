  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/008.yaml
  text: But I did not approach her again for the rest of my life, because I had done this abomination in all Israel.
translation:
  language: fr
  text: Mais je ne m’approchai plus d’elle jusqu’à la fin de ma vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « jusqu’à ma vie », expression comprise ici au sens de « jusqu’à la fin de ma vie » ou « tant que je vécus ». La phrase explicative figurant dans certaines formes du texte — « parce que j’avais commis cette abomination dans tout Israël » — est absente du texte grec suivi ici.'
    reason: Signaler à la fois la tournure grecque inhabituelle et l’expansion présente dans la version anglaise de consultation, sans l’introduire dans le corps du texte.
lexical_decisions:
- source_word: ἤγγισα αὐτῇ
  choice: je ne m’approchai … d’elle
  rationale: Rend directement le verbe grec « s’approcher » avec son complément au datif, sans préciser davantage la nature de l’approche.
- source_word: ἔτι
  choice: plus
  rationale: Après la négation, « ne… plus » exprime naturellement en français l’idée de « ne pas de nouveau / désormais ne plus ».
- source_word: ἕως τῆς ζωῆς μου
  choice: jusqu’à la fin de ma vie
  rationale: La tournure grecque est littéralement « jusqu’à ma vie », mais elle a ici une valeur temporelle couvrant le restant de la vie; l’explicitation « la fin de » produit un français clair sans ajouter l’énoncé absent de la clause anglaise supplémentaire.
theological_decisions:
- issue: Clause explicative présente dans l’anglais de consultation
  choice: Ne pas inclure « parce que j’avais commis cette abomination dans tout Israël »
  alternative: Ajouter cette proposition comme dans l’English POB
  rationale: Cette proposition ne figure pas dans le texte grec fourni. La traduction suit en priorité la source originale et n’importe pas une expansion issue de la couche anglaise.
- issue: Nature de l’approche envers la femme
  choice: Conserver le verbe général « s’approcher »
  alternative: Interpréter explicitement comme une relation sexuelle
  rationale: Le grec ἤγγισα demeure lexicalement général dans ce verset; le contexte peut suggérer davantage, mais la traduction préserve cette marge d’ambiguïté.
translation_notes:
  register: Français moderne, digne et lisible. Le passé simple convient au registre narratif de ce testament ancien. La formulation reste proche du grec tout en clarifiant l’idiome temporel final.
