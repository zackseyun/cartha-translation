  text: Et je pensais que personne ne savait que j’étais entré auprès d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνόμιζον
  choice: je pensais
  rationale: Rend naturellement l’imparfait grec, qui exprime ici ce que Juda croyait alors.
- source_word: οὐδεὶς ἔγνω
  choice: personne ne savait
  rationale: Dans ce contexte, γινώσκω au parfait/aoriste second renvoie au fait d’avoir connaissance de l’acte; le français idiomatique emploie « savait ».
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: j’étais allé vers elle
  rationale: Conserve l’expression grecque indirecte « entrer/aller vers elle » et son possible sous-entendu sexuel, sans l’expliciter ni l’atténuer davantage.
