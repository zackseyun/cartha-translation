  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: fr
  text: 'M’étant tourné vers elle, je lui dis : « Je viendrai vers toi. » Elle dit : « Que me donneras-tu ? » Je lui donnai mon bâton et mon diadème comme gage. Puis, quand je me fus uni à elle, elle devint enceinte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: Je me détournai vers elle
  rationale: Rend le mouvement exprimé par ἐκκλίνω et la direction marquée par πρός, dans un français narratif naturel.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Je viendrai vers toi
  rationale: Conserve l’euphémisme grec de l’approche sexuelle sans l’expliciter davantage.
- source_word: ῥάβδον
  choice: bâton
  rationale: Équivalent direct et contextuellement approprié de ῥάβδος.
- source_word: διάδημα
  choice: diadème
  rationale: Le texte grec fourni ne comporte qu’un diadème, sans « anneau » ni complément « de mon royaume »; la traduction suit donc strictement la colonne grecque primaire.
- source_word: εἰς ἀρραβῶνα
  choice: en gage
  rationale: Exprime la fonction de garantie ou de sûreté de l’objet remis.
- source_word: συνήλθον αὐτῇ
  choice: je me fus uni à elle
  rationale: Rend l’euphémisme sexuel de συνέρχομαι avec dignité et clarté, sans crudité.
- source_word: συνελήφθη
  choice: elle devint enceinte
  rationale: Rend sans ambiguïté le sens contextuel du passif de συλλαμβάνω.
theological_decisions:
- issue: Ajouts présents dans la couche anglaise mais absents du grec fourni
  choice: Omettre « mon anneau » et « de mon royaume »
  alternative: « mon bâton, mon anneau et le diadème de mon royaume »
  rationale: La source grecque primaire porte seulement τὴν ῥάβδον μου καὶ τὸ διάδημά μου, soit « mon bâton et mon diadème ». Aucun élément théologique ou harmonisant ne justifie d’importer les ajouts de la consultation anglaise.
translation_notes:
  register: Français international moderne, narratif et digne. Les euphémismes sexuels du grec sont préservés tout en restant compréhensibles. Ponctuation française avec espaces avant les deux-points et guillemets français.
