- from: 3 Ainsi, lorsque je fus ivre de vin, je ne la reconnus pas, et elle me trompa par sa beauté, grâce à l’apparence que lui donnait sa parure.
  to: 3 Ainsi donc, ivre de vin, je ne la reconnus pas, et sa beauté me trompa par l’apparence de sa parure.
  rationale: La révision rétablit le sujet grammatical grec, « sa beauté », et conserve la relation instrumentale entre cette beauté et l’apparence de la parure. Elle maintient aussi l’ivresse de Juda et son défaut de reconnaissance sans résoudre ou modifier la tension narrative du texte.
