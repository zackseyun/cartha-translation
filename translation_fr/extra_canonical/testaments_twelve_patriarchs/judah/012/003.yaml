  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/003.yaml
  text: So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment.
translation:
  language: fr
  text: 3 Ainsi donc, ivre de vin, je ne la reconnus pas, et sa beauté me trompa par l’apparence de sa parure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς … οἴνῳ
  choice: lorsque je fus ivre de vin
  rationale: Rend naturellement le participe aoriste passif et précise, comme le grec, que l’ivresse était due au vin.
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: je ne la reconnus pas
  rationale: ἐπιγινώσκω exprime ici le fait de reconnaître ou d’identifier la femme.
- source_word: ἠπάτησέ με
  choice: elle me trompa
  rationale: Conserve le sens actif de tromper ou abuser sans atténuer la responsabilité exprimée par la formulation grecque.
- source_word: τὸ κάλλος αὐτῆς
  choice: par sa beauté
  rationale: Le contexte donne à l’accusatif une valeur instrumentale, bien rendue en français par « par ».
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: grâce à l’apparence que lui donnait sa parure
  rationale: Rend διά avec sa valeur de moyen et exprime en français idiomatique le rapport entre l’apparence extérieure et la parure, sans réduire σχήμα à la seule forme physique.
theological_decisions:
- issue: Répartition de la responsabilité entre l’ivresse de Juda et la tromperie de la femme
  choice: Conserver côte à côte l’absence de reconnaissance due à l’ivresse et l’affirmation qu’elle le trompa
  alternative: Reformuler de manière à faire de l’ivresse l’unique cause de la méprise
  rationale: Le grec maintient ces deux éléments en tension; la traduction ne doit ni disculper entièrement Juda ni effacer l’action attribuée à la femme.
translation_notes:
  register: Français moderne, international et digne. La phrase reste narrative et claire; « parure » conserve le registre vestimentaire de κόσμησις, tandis que « l’apparence que lui donnait » évite une formulation littérale maladroite.
