source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καλέσας δὲ αὐτὴν⁴⁵, ἤκουσα καὶ τοὺς ἐν μυστηρίῳ λόγους⁴⁶, *οὓς καθεύδων σὺν αὐτῇ ἐν τῇ μέθῃ μου⁴⁷ ἐλάλησα. *Καὶ οὐκ ἠδυνήθην ἀνελεῖν αὐτήν, ὅτι παρὰ Κυρίου ἦν⁴⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: fr
  text: Après l’avoir fait venir, j’entendis aussi les paroles secrètes que j’avais prononcées alors que, dans mon ivresse, je dormais avec elle.[a] Je ne pus pas la tuer, car cela venait du Seigneur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « je dormais avec elle » peut aussi, dans ce contexte, avoir une connotation sexuelle.
    reason: Signaler une ambiguïté réelle de l’expression sans l’imposer dans le corps du texte.
  - marker: b
    text: 'Littéralement : « car c’était de la part du Seigneur » ; le sujet n’est pas exprimé en grec.'
    reason: Préserver l’indétermination grammaticale et théologique de la proposition finale.
lexical_decisions:
- source_word: Καλέσας δὲ αὐτήν
  choice: Après l’avoir fait venir
  rationale: Dans ce contexte, « faire venir » rend naturellement l’idée d’appeler quelqu’un auprès de soi, sans l’anachronisme possible de « appeler » en français moderne.
- source_word: τοὺς ἐν μυστηρίῳ λόγους
  choice: les paroles secrètes
  rationale: Cette formulation rend le caractère caché ou confidentiel des λόγοι sans développer au-delà du grec.
- source_word: καθεύδων σὺν αὐτῇ
  choice: je dormais avec elle
  rationale: La traduction conserve l’ambiguïté de l’expression grecque, qui peut évoquer le fait de dormir à ses côtés et, selon le contexte, une relation sexuelle.
- source_word: ἐν τῇ μέθῃ μου
  choice: dans mon ivresse
  rationale: Rendu direct et idiomatique de l’état d’ébriété exprimé par le grec.
- source_word: παρὰ Κυρίου ἦν
  choice: cela venait du Seigneur
  rationale: « Venir du Seigneur » rend la provenance exprimée par παρά avec le génitif, tandis que « cela » respecte l’absence de sujet explicite.
theological_decisions:
- issue: Référent implicite dans « παρὰ Κυρίου ἦν »
  choice: cela venait du Seigneur
  alternative: elle venait du Seigneur
  rationale: Le grec ne nomme pas le sujet de ἦν. Le neutre français « cela » préserve mieux l’ambiguïté entre la situation, l’événement ou une intervention divine, au lieu d’identifier nécessairement la femme comme sujet.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour être naturelle, tout en gardant l’enchaînement du grec et ses ambiguïtés principales.
