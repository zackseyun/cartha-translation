  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/005.yaml
  text: But I, not knowing what I had done, wanted to kill her. But she sent the pledges secretly and put me to shame.
translation:
  language: fr
  text: Mais moi, ne sachant pas ce que j’avais fait, je voulais la tuer. Mais elle envoya secrètement les gages et me fit honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγνοῶν
  choice: ignorant
  rationale: Le participe présent exprime l’absence de connaissance qui accompagne le désir d’agir; cette formulation conserve la relation circonstancielle sans la préciser davantage.
- source_word: ἀνελεῖν
  choice: la tuer
  rationale: Dans ce contexte, le verbe signifie mettre à mort; «la tuer» est direct, naturel et fidèle.
- source_word: τοὺς ἀρραβῶνας
  choice: les objets donnés en gage
  rationale: Le pluriel désigne les objets remis comme garantie ou signes de reconnaissance; la périphrase évite le sens moderne dominant de «fiançailles» associé à «arrhes».
- source_word: κατῄσχυνέ
  choice: me couvrit de honte
  rationale: Le verbe indique qu’elle l’a confondu et exposé à la honte grâce aux gages; cette traduction garde la force du grec sans ajouter de détail narratif.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de «Mais» reproduit les deux δέ et maintient l’enchaînement contrastif du grec. Aucun marqueur de note n’est nécessaire.
