- from: Mais moi, ignorant ce que j’avais fait, je voulais la tuer. Mais elle m’envoya secrètement les objets donnés en gage et me couvrit de honte.
  to: Mais moi, ne sachant pas ce que j’avais fait, je voulais la tuer. Mais elle envoya secrètement les gages et me fit honte.
  rationale: La révision supprime l’ajout du pronom indirect « m’ » après « envoya », conserve le pluriel et la portée de ἀρραβῶνας par « les gages », et emploie des formulations plus naturelles en français moderne sans modifier le sens ni résoudre davantage le contexte narratif.
