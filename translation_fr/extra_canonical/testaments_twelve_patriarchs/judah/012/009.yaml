  source_fidelity: 'Le sens de l’énoncé est correctement rendu : les personnes de la ville nient qu’une prostituée ait été à la porte, puis expliquent qu’elle venait d’ailleurs et n’y est restée qu’un bref moment. Le grec répète « à la porte » ; l’explicitation modérée « porte de la ville » rend le référent urbain de πύλη clair sans ajout de sens.'
  naturalness: Le projet est globalement naturel. Toutefois, « ne s’était assise que peu de temps à la porte » est moins idiomatique que de placer le complément de durée avec « pour peu de temps » et de reprendre le lieu par « s’y ».
