  text: Καίγε οἱ⁵⁷ ἐν τῇ πόλει⁵⁸ ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον⁶⁰, ὅτι ἐξ ἄλλου χωρίου⁶¹ ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ⁶² πύλῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/009.yaml
  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: fr
  text: Pourtant, les gens de la ville disaient qu’il n’y avait pas eu de prostituée à la porte de la ville, car elle était venue d’un autre endroit et ne s’y était assise que pour peu de temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: les gens de la ville
  rationale: Rend naturellement en français l’expression désignant les personnes qui se trouvaient ou habitaient dans la ville.
- source_word: τελεσικόμενον
  choice: prostituée
  rationale: Dans ce contexte, le terme désigne une femme qui se livre à la prostitution; « prostituée » est direct, actuel et conforme au contexte narratif.
- source_word: ἐν τῇ πύλῃ
  choice: à la porte
  rationale: La « porte » est celle de la ville; le français permet de conserver la formulation concise du grec sans explicitation inutile.
- source_word: πρὸς βραχύ
  choice: ne… que peu de temps
  rationale: Exprime clairement la brièveté du séjour tout en donnant une phrase française fluide.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « il n’y avait pas eu » préserve la portée du discours rapporté, tandis que la répétition de « à la porte » reflète celle du grec et maintient le lien avec le lieu recherché.
