  text: And after this we came into Egypt to Joseph because of the famine.
translation:
  language: fr
  text: Après cela, nous sommes venus en Égypte auprès de Joseph, à cause de la famine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Rend naturellement la succession temporelle exprimée par le grec, tout en conservant le démonstratif singulier collectif.
- source_word: ἤλθομεν εἰς Αἴγυπτον
  choice: nous sommes venus en Égypte
  rationale: Traduction directe du verbe de mouvement et de la destination; «venus» respecte le point de vue déictique du récit grec.
- source_word: πρὸς Ἰωσήφ
  choice: auprès de Joseph
  rationale: Conserve l’idée d’un déplacement vers Joseph sans réduire nécessairement la préposition à une simple destination géographique.
- source_word: διὰ τὸν λιμόν
  choice: à cause de la famine
  rationale: Exprime clairement la cause indiquée par διά suivi de l’accusatif.
