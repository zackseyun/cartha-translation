  source_fidelity: 'Le texte français rend fidèlement le grec : « Car » exprime γάρ, « il avait vu … dans une vision » rend εἶδε … ἐν ὁράματι avec une concordance des temps française naturelle, et « à mon sujet » préserve περὶ ἐμοῦ. « Un ange de puissance » conserve délibérément la formulation ouverte ἄγγελος δυνάμεως. La finale « afin que je ne sois pas vaincu » correspond au passif ἡττᾶσθαί μοι (« que je ne sois pas vaincu / soumis »), contrairement à l’audit anglais « touched », qui ne reflète pas le sens lexical direct du grec.'
  naturalness: Le français est moderne, clair et d’un registre convenant à un testament antique. « M’accompagnait en toutes circonstances » est idiomatique et exprime naturellement συνέπεταί μοι ἐν πᾶσι.
  terminology: « Ange de puissance » préserve la construction grecque sans définir indûment la nature ou la hiérarchie de l’ange. « Être vaincu » restitue précisément le vocabulaire de la défaite ou de la subjugation et maintient le passif sans introduire d’agent.
