source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: fr
  text: Car il avait vu à mon sujet, dans une vision, qu’un ange de puissance m’accompagnait en toutes circonstances, afin que je ne sois pas vaincu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος δυνάμεως
  choice: un ange de puissance
  rationale: Conserve la construction grecque et son possible sens d’un ange caractérisé par la puissance, sans préciser davantage son statut ou sa fonction.
- source_word: συνέπεταί μοι
  choice: m’accompagnait
  rationale: Rend naturellement l’idée d’aller avec quelqu’un ou de l’accompagner; l’imparfait français s’accorde avec la vision rapportée au passé.
- source_word: ἐν πᾶσι
  choice: en toutes circonstances
  rationale: Expression idiomatique française qui conserve la portée générale de «dans toutes choses».
- source_word: ἡττᾶσθαί
  choice: être vaincu
  rationale: Le verbe grec signifie être inférieur, défait ou vaincu; «être touché» ne rend pas son sens lexical direct.
theological_decisions:
- issue: Nature de la protection assurée par l’ange
  choice: afin que je ne sois pas vaincu
  alternative: afin que je ne subisse aucune défaite
  rationale: La formulation retenue préserve le passif et la finalité du grec, sans introduire un agresseur ni réduire la protection au fait de ne pas être touché.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe garde le lien causal («Car»), le cadre visionnaire et la formulation théologiquement ouverte «ange de puissance».
