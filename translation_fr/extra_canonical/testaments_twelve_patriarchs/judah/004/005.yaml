source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ὁ πατήρ μου *Ἰακὼβ⁴³ ἀνεῖλε τὸν †Βελισάθ⁴⁴, βασιλέα⁴⁵ *πάντων τῶν⁴⁶ βασιλέων, ἄνδρα γίγαντα τῇ ἰσχύι πηχῶν δώδεκα⁴⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/005.yaml
  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: fr
  text: Mon père Jacob tua Bélisath, le roi de tous les rois, un homme à la force gigantesque, haut de douze coudées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une mesure de longueur fondée sur la distance entre le coude et l’extrémité des doigts. Douze coudées correspondent approximativement à 5,3 mètres, selon la valeur retenue pour la coudée.
    reason: La mesure ancienne est conservée dans le texte ; la note fournit une approximation moderne sans imposer une valeur parfaitement fixe.
lexical_decisions:
- source_word: ἀνεῖλε
  choice: tua
  rationale: Le verbe signifie ici « tuer » ou « mettre à mort » ; « tua » est direct, naturel et fidèle au récit.
- source_word: βασιλέα πάντων τῶν βασιλέων
  choice: le roi de tous les rois
  rationale: Cette formulation traduit directement le grec transmis. La mention « père des rois » de la couche anglaise n’apparaît pas dans le texte grec fourni.
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  choice: un homme gigantesque par sa force
  rationale: La tournure conserve le lien explicite entre le caractère gigantesque et la force, sans réduire γίγαντα à la seule taille physique.
- source_word: πηχῶν δώδεκα
  choice: qui mesurait douze coudées
  rationale: Le grec donne littéralement « de douze coudées » ; le verbe « mesurait » explicite naturellement l’ellipse et le contexte indique la stature.
theological_decisions:
- issue: Titre royal superlatif
  choice: le roi de tous les rois
  alternative: le roi de tous, père des rois
  rationale: Le choix suit πάντων τῶν βασιλέων dans la source grecque et n’ajoute pas une relation de paternité absente du texte fourni.
translation_notes:
  register: Français moderne, clair et digne. Le nom propre est francisé graphiquement en « Bélisath ». Aucun connecteur temporel équivalent à « Then » n’est ajouté, puisqu’il est absent du grec fourni.
