  text: Καὶ ἀνῆλθον ἐγὼ¹⁰ ἐπὶ *τοῦ τείχους¹¹, καὶ¹² *ἀνεῖλον †τὸν βασιλέα αὐτῶν¹³, καὶ ἐλάβομεν *πᾶσαν τὴν αἰχμαλωσίαν¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/002.yaml
  text: And I went up upon the double wall and killed their king.
translation:
  language: fr
  text: Et moi, je montai sur la muraille[a], je tuai leur roi, et nous nous emparâmes de tous les captifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une variante textuelle porte : « sur la double muraille ».'
    reason: Le texte grec principal fourni lit τοῦ τείχους, « la muraille », tandis que la couche anglaise auditée et la révision signalent une lecture comportant δύο, « double ».
  - marker: b
    text: 'Ou : « de tout le butin humain » ; le grec peut désigner collectivement les personnes faites prisonnières.'
    reason: Signale l’étendue sémantique d’αἰχμαλωσία sans imposer une précision absente du grec.
lexical_decisions:
- source_word: ἀνῆλθον … ἐπὶ τοῦ τείχους
  choice: je montai sur la muraille
  rationale: Rend directement le mouvement ascendant et la construction avec ἐπί; le texte grec principal fourni porte le singulier « la muraille ».
- source_word: ἀνεῖλον
  choice: je tuai
  rationale: Traduction naturelle et précise de l’aoriste de ἀναιρέω dans ce contexte guerrier.
- source_word: ἐλάβομεν πᾶσαν τὴν αἰχμαλωσίαν
  choice: nous nous emparâmes de tous les captifs
  rationale: αἰχμαλωσία peut désigner collectivement les personnes emmenées captives; « nous nous emparâmes » conserve l’idée de prise exprimée par λαμβάνω sans réduire nécessairement le groupe à un simple butin matériel.
theological_decisions:
- issue: Nature de l’αἰχμαλωσία
  choice: tous les captifs
  alternative: tout le butin / toute la masse des prisonniers
  rationale: Le terme grec demeure quelque peu ouvert entre captivité, ensemble des captifs et prise de guerre. Le contexte favorise ici le sens collectif personnel, sans enjeu doctrinal.
translation_notes:
  register: Français moderne, narratif et digne. Le pronom emphatique ἐγώ est conservé par « Et moi ». La dernière proposition du grec, absente de la couche anglaise fournie, est rétablie. Le passé simple convient au registre narratif de ce testament ancien.
