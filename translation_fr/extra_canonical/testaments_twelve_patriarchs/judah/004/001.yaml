    issue: Incohérence de nombre dans l’action de se ranger en bataille
    rationale: παραταξάμενοι est un participe au pluriel et σὺν τοῖς ἀδελφοῖς μου inclut explicitement les frères de Juda. Le français doit donc employer « Nous nous rangeâmes », non « Je me rangeai ».
  - severity: low
    issue: Coordination finale à clarifier légèrement
    rationale: La reprise « en » doit porter explicitement sur les deux cents issus du millier poursuivi, tandis que les quatre rois sont ajoutés par coordination. Une virgule avant « ainsi que » rend cette structure plus lisible.
