  text: '*Καὶ μετὰ τοῦτο γέγονεν ἡμῖν κατὰ νότον¹ πόλεμος² *τοῦ ἐν Σικίμοις³· καὶ παραταξάμενοι *σὺν τοῖς ἀδελφοῖς⁴ μου ἐδιώξαμεν⁵ χιλίους⁶ καὶ ἀπεκτείναμεν⁷ ἐξ αὐτῶν διακοσίους⁸ *καὶ τέσσαρας βασιλεῖς⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/001.yaml
  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: fr
  text: Après cela, une guerre éclata contre nous au sud, plus importante que celle de Sichem. Nous nous rangeâmes en ordre de bataille avec mes frères ; nous poursuivîmes mille hommes et nous en tuâmes deux cents, ainsi que quatre rois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγονεν ἡμῖν ... πόλεμος
  choice: une guerre éclata contre nous
  rationale: Rend naturellement en français la survenue d’une guerre qui touche le groupe, sans calquer lourdement « il nous arriva une guerre ».
- source_word: κατὰ νότον
  choice: au sud
  rationale: Conserve l’indication géographique concise ; « vers le sud » serait également possible.
- source_word: τοῦ ἐν Σικίμοις
  choice: que celle de Sichem
  rationale: Le comparatif sous-entend « la guerre » ; le pluriel grec du toponyme est rendu par la forme française traditionnelle « Sichem ».
- source_word: παραταξάμενοι σὺν τοῖς ἀδελφοῖς μου
  choice: Je me rangeai en ordre de bataille avec mes frères
  rationale: Le participe au pluriel inclut Juda et ses frères ; une proposition personnelle est plus naturelle et rend clairement cette action préparatoire.
- source_word: ἐδιώξαμεν χιλίους
  choice: nous poursuivîmes mille hommes
  rationale: Le nom « hommes » est implicite dans l’adjectif numéral substantivé masculin et doit être explicité en français.
- source_word: ἀπεκτείναμεν ἐξ αὐτῶν διακοσίους καὶ τέσσαρας βασιλεῖς
  choice: en tuâmes deux cents ainsi que quatre rois
  rationale: « en » reprend les mille hommes et « ainsi que » clarifie que les quatre rois s’ajoutent aux deux cents, conformément à la coordination grecque.
