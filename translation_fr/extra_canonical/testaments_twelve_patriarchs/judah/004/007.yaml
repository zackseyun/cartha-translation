  text: Therefore my father was free from चिंता in the wars while I was with my brothers.
translation:
  language: fr
  text: C’est pourquoi mon père ne se faisait aucun souci pendant les guerres, lorsque j’étais avec mes frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμέριμνος
  choice: ne se faisait aucun souci
  rationale: Cette tournure française naturelle exprime l’absence d’inquiétude ou de préoccupation indiquée par l’adjectif grec.
- source_word: ἐν τοῖς πολέμοις
  choice: pendant les guerres
  rationale: Le contexte temporel est rendu idiomatiquement; « dans les guerres » serait moins naturel en français.
- source_word: ὅτε
  choice: lorsque
  rationale: La conjonction introduit ici la circonstance temporelle dans laquelle le père de Juda demeurait sans souci.
