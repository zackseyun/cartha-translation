  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/003.yaml
  text: And so we set Hebron free and took all the captives.
translation:
  language: fr
  text: Le lendemain, nous nous rendîmes à Aréta, une ville forte qui nous menaçait de mort. Mais Gad et moi nous approchâmes du côté est de la ville, tandis que Ruben et Lévi s’en approchèrent du côté ouest ; et ainsi nous libérâmes les captifs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: Le lendemain
  rationale: Expression temporelle idiomatique désignant le jour suivant.
- source_word: Ἀρετάν
  choice: Aréta
  rationale: Translittération française du nom propre grec, sans l’assimiler à Hébron, qui ne figure pas dans le texte source fourni.
- source_word: πόλιν κραταιάν
  choice: une ville fortifiée
  rationale: Dans ce contexte militaire, κραταιάν décrit vraisemblablement une ville forte et difficile à prendre plutôt qu’une ville simplement « puissante ».
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: qui nous menaçait de mort
  rationale: Rend directement la menace mortelle personnifiée attribuée à la ville.
- source_word: προσέφθημεν
  choice: arrivâmes les premiers
  rationale: Le verbe exprime ici l’idée de devancer les autres ou d’arriver avant eux.
- source_word: ἀπὸ ἀνατολῶν … ἀπὸ δυσμῶν
  choice: par l’est … par l’ouest
  rationale: Formulation française naturelle pour indiquer les côtés depuis lesquels les groupes abordent la ville.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: nous libérâmes les captifs
  rationale: Le singulier abstrait et collectif αἰχμαλωσίαν désigne ici l’ensemble des personnes retenues en captivité.
theological_decisions: []
translation_notes:
  register: 'Récit militaire en français moderne, clair et digne. Le grec fourni a été suivi en priorité : contrairement à la couche anglaise de consultation, il nomme Aréta, décrit l’approche de la ville par deux côtés et ne dit pas que la ville elle-même fut libérée ou prise.'
