- from: '1 Je savais que la lignée des Cananéens était mauvaise[a], mais la fougue de la jeunesse aveugla mon intelligence. 2 Quand je la vis verser du vin, je fus trompé et je la pris[b], sans que mon père ait donné son avis[c].[d] 3 Pendant mon absence, elle alla prendre pour Shéla une femme de Canaan. 4 Quand j’appris ce qu’elle avait fait, je la maudis dans l’angoisse de mon âme. 5 Et de fait, elle mourut dans sa méchanceté, avec ses fils.


