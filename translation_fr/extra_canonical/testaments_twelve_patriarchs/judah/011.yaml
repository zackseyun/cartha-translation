    reason: textual_uncertainty
lexical_decisions:
- source_word: πονηρὸν γένος τῶν Χαναναίων
  choice: la lignée des Cananéens était mauvaise
  rationale: «Lignée» rend le sens ancien de γένος, lié à l’ascendance ou au groupe humain, sans les connotations biologiques modernes de «race»; «mauvaise» conserve le jugement moral de πονηρός.
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: la fougue de la jeunesse
  rationale: Dans cet aveu rétrospectif, l’expression évoque l’élan irréfléchi propre à la jeunesse. «Fougue» est naturel en français tout en conservant cette force impulsive.
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: aveugla mon intelligence
  rationale: La traduction maintient l’image de l’aveuglement et désigne la faculté de comprendre exprimée par διάνοια.
- source_word: οἰνοχοοῦσαν
  choice: verser du vin
  rationale: Le participe désigne concrètement l’action de servir ou de verser du vin.
- source_word: ἠπατήθην
  choice: je fus trompé
  rationale: Le passif grec est conservé sans pour autant supprimer la responsabilité de Juda dans le récit.
- source_word: ἔλαβον αὐτήν
  choice: je la pris
  rationale: La formulation garde la brièveté abrupte du grec; le contexte suggère qu’il s’agit de la prendre pour femme, nuance signalée en note.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: sans que mon père ait donné son avis
  rationale: Cette formulation laisse ouverte la nuance entre conseil, délibération et approbation paternelle.
- source_word: ἀπόντος ἐμοῦ
  choice: pendant mon absence
  rationale: Rendu idiomatique et direct du génitif absolu.
- source_word: ἔλαβε τῷ Σηλὼμ γυναῖκα
  choice: prit pour Shéla une femme
  rationale: L’expression signifie obtenir ou choisir une épouse pour quelqu’un; la formulation française reste proche du tour patriarcal grec.
- source_word: ἐκ τῆς Χαναάν
  choice: de Canaan
  rationale: Cette formulation concise préserve le chevauchement possible entre provenance géographique et appartenance au peuple.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: dans l’angoisse de mon âme
  rationale: Le choix conserve la gravité affective et testamentaire de l’expression.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: avec ses fils
  rationale: υἱοί signifie ici littéralement «fils»; ce rendu est plus précis que le générique «enfants».
theological_decisions:
- issue: Jugement collectif porté sur les Cananéens
  choice: Traduire directement le jugement moral visant la lignée des Cananéens.
  alternative: «Le peuple cananéen était corrompu.»
  rationale: Le texte formule un jugement collectif caractéristique de sa rhétorique ancienne. «Lignée» le transmet sans lui superposer une théorie raciale moderne.
- issue: Portée conjugale de ἔλαβον αὐτήν
  choice: Conserver «je la pris» dans le texte principal et préciser en note le sens matrimonial probable.
  alternative: «Je la pris pour femme» ou «je l’épousai».
  rationale: Le contexte favorise nettement le mariage, mais le grec est délibérément bref; la traduction ne doit pas effacer cette rudesse.
- issue: Fragments textuellement corrompus après le verset 2
  choice: Ne pas reconstruire un récit incertain; signaler explicitement les fragments dans une note.
  alternative: Insérer une traduction conjecturale des mots concernant Er et la mort.
  rationale: La syntaxe transmise est gravement désarticulée. Une reconstruction dans le corps du texte donnerait à une conjecture le statut d’un texte assuré.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste sobre et testamentaire. «Lignée» évite l’ambiguïté moderne de «race»; «fougue de la jeunesse» rend naturellement l’élan irréfléchi; les formulations abruptes ou incertaines du grec sont conservées ou signalées plutôt que résolues silencieusement.
