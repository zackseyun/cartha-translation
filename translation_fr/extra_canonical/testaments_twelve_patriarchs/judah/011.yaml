  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
translation:
  language: fr
  text: '1 Je savais que la lignée des Cananéens était mauvaise[a], mais l’élan de ma jeunesse aveugla mon intelligence. 2 Quand je la vis verser du vin, je fus trompé et je la pris[b], sans que mon père ait été consulté à ce sujet[c]. [Le texte grec transmis est ici gravement corrompu.][d] 3 Pendant mon absence, elle prit pour Shéla une femme de Canaan. 4 Quand j’appris ce qu’elle avait fait, je la maudis dans l’angoisse de mon âme. 5 Et de fait, elle mourut dans sa méchanceté, avec ses fils.


    [a] Le grec γένος désigne ici une lignée ou un peuple ; on pourrait aussi traduire : « le peuple des Cananéens était mauvais ».


    [b] Dans ce contexte, « je la pris » signifie vraisemblablement « je la pris pour femme », mais le grec demeure plus abrupt.


    [c] La tournure grecque peut aussi signifier que Juda agit sans le conseil ou l’approbation de son père.


    [d] Après cette phrase, le texte grec transmis comporte plusieurs fragments gravement altérés, dont « mon fils Er ». Leur enchaînement et leur sens ne peuvent être établis avec assez de certitude pour être traduits dans le corps du texte.'
  philosophy: optimal-equivalence
  footnotes:
