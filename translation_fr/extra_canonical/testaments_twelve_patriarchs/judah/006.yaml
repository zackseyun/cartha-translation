  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
translation:
  language: fr
  text: '**Testament de Juda 6**


    1 Quand j’étais aux eaux de Chozéba[a], les gens de Jobel vinrent nous attaquer. 2 Nous engageâmes le combat et les mîmes en fuite. Nous tuâmes aussi les gens de Silom, leurs alliés, et ne leur laissâmes aucune voie de fuite. 3 Mais, le cinquième jour, les gens de Makir nous attaquèrent de nouveau. Nous nous jetâmes sur eux avec une puissante épée[b], nous prîmes le dessus et les tuâmes avant de gravir la montée[c]. 4 Lorsque nous arrivâmes à la ville, leurs femmes faisaient rouler sur nous des pierres depuis le sommet de la montagne où se trouvait la ville[d]. 5 Après avoir caché Siméon derrière eux[e], nous nous emparâmes de la hauteur et détruisîmes entièrement cette ville aussi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les noms Chozéba, Jobel et Silom transcrivent les formes grecques de ce témoin ; leur identification demeure incertaine.
    reason: cultural_note
  - marker: b
    text: 'Le grec de cette proposition est grammaticalement irrégulier : προσδίδωσι est un présent à la troisième personne du singulier dans un récit mené à la première personne du pluriel. La traduction en rend le sens tactique probable sans corriger silencieusement le texte.'
    reason: textual_variant
  - marker: c
    text: Le grec signifie le plus naturellement « avant que nous gravissions la montée ». On peut aussi comprendre, d’après le contexte, « avant qu’ils puissent gravir la montée ».
    reason: translation_ambiguity
  - marker: d
    text: Le texte grec répète l’article devant « ville » (τῇ τῇ πόλει), vraisemblablement par inadvertance. La traduction ne le rend qu’une fois.
    reason: textual_variant
  - marker: e
    text: Le texte grec est défectueux autour de Siméon (τὸν τε καὶ Συμεών) et le singulier du participe « ayant caché » ne s’accorde pas avec le sujet pluriel qui suit. La traduction conserve seulement le nom lisible, Siméon ; le texte transmis ne permet pas de déterminer si un autre nom ou groupe était initialement mentionné, ni à qui renvoie avec certitude « derrière eux ».
    reason: textual_variant
lexical_decisions:
- source_word: ὕδασι Χωζηβά
  choice: près des eaux de Chozéba
  rationale: Le pluriel ὕδασι est conservé par « eaux »; « près de » exprime naturellement en français la localisation associée à ce lieu d’eau, sans préciser s’il s’agit de sources ou de cours d’eau.
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: vinrent nous attaquer
  rationale: Cette formulation française rend à la fois le mouvement hostile dirigé contre le groupe et la finalité guerrière, sans la lourdeur de « vinrent contre nous pour la guerre ».
- source_word: συνάψαντες
  choice: nous engageâmes le combat
  rationale: Dans ce contexte militaire, συνάπτω désigne l’engagement du combat; la tournure est actuelle, claire et digne.
- source_word: ἐτρέψαμεν
  choice: les mîmes en fuite
  rationale: Le verbe signifie ici mettre en déroute ou faire fuir, plutôt que simplement faire reculer.
- source_word: διέξοδον
  choice: voie de fuite
  rationale: Le nom désigne une issue ou un passage permettant de sortir; « voie de fuite » conserve cette image concrète.
- source_word: περιγινόμεθα αὐτῶν
  choice: nous prîmes le dessus
  rationale: La locution exprime la supériorité remportée sur l’adversaire. Le présent grec au milieu d’un récit au passé est rendu selon la trame narrative française.
- source_word: τοῦ ὑψηλοῦ
  choice: la hauteur
  rationale: Le substantif neutre désigne le point élevé ou la position dominante dont les assaillants s’emparent.
- source_word: ἐξωλοθρεύσαμεν
  choice: détruisîmes entièrement
  rationale: Le préverbe intensif appelle une traduction plus forte que « détruisîmes », sans ajouter de précision absente du grec sur la manière de détruire la ville.
theological_decisions:
- issue: Sujet implicite de πρὸ τοῦ ἀναβῆναι τὴν ἀνάβασιν au verset 3
  choice: avant de gravir la montée
  alternative: avant qu’ils puissent gravir la montée
  rationale: Le sujet implicite de l’infinitif se rapporte le plus naturellement au sujet de ἀπεκτείναμεν, « nous ». La traduction ne transfère donc pas sans indication l’action aux ennemis, même si le contexte militaire pourrait susciter cette autre lecture.
- issue: Texte syntaxiquement altéré décrivant l’action contre Makir
  choice: Nous lançant contre eux avec une épée puissante
  alternative: il les livre à eux avec une épée puissante
  rationale: προσδίδωσι est un présent à la troisième personne du singulier, anormal dans cette narration à la première personne du pluriel et difficile à construire. La traduction restitue prudemment le mouvement tactique apparent sans prétendre que le texte transmis est grammaticalement intact.
- issue: Groupe de mots incomplet autour de Siméon au verset 5
  choice: Siméon et les autres
  alternative: … et Siméon
  rationale: Le grec τὸν τε καὶ Συμεών paraît corrompu ou lacunaire. « Les autres » représente avec réserve un élément masculin accusatif perdu ou défectueux; la note signale explicitement cette reconstruction minimale.
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsmes. Le passé simple convient à la succession rapide des actions guerrières, tandis que l’imparfait décrit la situation en cours au verset 4. Les toponymes sont translittérés d’après le grec (Chozéba, Jobel, Silom, Makir). Les irrégularités réelles du témoin sont signalées en notes plutôt que lissées sans explication.
