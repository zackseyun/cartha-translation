  terminology: 'Les noms propres translittérés sont cohérents avec le grec : Chozéba, Jobel, Silom, Makir et Siméon. « Mettre en fuite », « voie de fuite », « hauteur » et « détruire entièrement » conviennent au registre narratif et au sens des termes grecs.'
