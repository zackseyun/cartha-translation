    rationale: Le grec comprend une adresse aux enfants au milieu de la déclaration, mais le français peut la déplacer en tête sans modifier le sens. Cela évite que « mes enfants » soit momentanément lu comme objet avant sa répétition.
  - severity: low
    issue: Emphase de ἐγώ insuffisamment perceptible
    rationale: Le pronom grec « ἐγώ » est exprimé. L’ajout discret de « moi » dans une tournure française naturelle rend cette insistance sans surcharge.
