  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: fr
  text: Mes enfants, c’est à cause de l’argent que, moi, j’ai perdu mes enfants. Et si mon repentir, mon humiliation et les prières de mon père ne m’étaient pas venus en aide, je serais mort sans enfant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριον
  choice: argent
  rationale: Le grec désigne ici l’argent comme richesse ou moyen de paiement; «argent» conserve naturellement ce sens en français.
- source_word: ἀπώλεσα
  choice: j’ai perdu
  rationale: Cette traduction rend directement l’idée de perte sans préciser, au-delà du grec, la manière dont les enfants ont été perdus.
- source_word: μετάνοιά
  choice: repentir
  rationale: Le terme exprime un profond changement intérieur lié au regret de la faute; «repentir» convient au contexte moral et religieux.
- source_word: ταπείνωσίς
  choice: humiliation
  rationale: Choix proche du grec, qui peut évoquer l’abaissement de soi ou l’état d’humiliation; il préserve la distinction avec le repentir.
- source_word: συνεδράμον
  choice: ne m’étaient pas venus en aide
  rationale: Littéralement, les éléments mentionnés «accoururent ensemble»; l’expression française rend idiomatiquement leur concours secourable.
- source_word: ἄτεκνος
  choice: sans enfant
  rationale: Rend clairement l’adjectif grec signifiant «privé de descendance» ou «sans enfants».
theological_decisions:
- issue: Rapport entre repentir, humiliation, prières paternelles et délivrance
  choice: Conserver leur action conjointe sans expliquer le mécanisme de la délivrance
  alternative: Présenter les prières du père comme l’unique cause efficace du secours
  rationale: Le verbe grec met ensemble les trois éléments; le texte ne précise ni leur hiérarchie ni la manière dont ils ont agi.
translation_notes:
  register: Français moderne, clair et digne. L’adresse «mes enfants» est maintenue au milieu de la première proposition, conformément au grec, malgré la répétition volontaire de «enfants».
