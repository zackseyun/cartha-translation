  text: Διὰ τὸ ἀργύριον ἐγὼ¹⁰ τέκνα μου ἀπώλεσα τὰ τέκνα μου¹², καὶ εἰ μὴ ἡ¹³ μετάνοιά μου¹⁵ καὶ¹⁶ ἡ ταπείνωσίς μου¹⁷ καὶ¹⁷ ηὐχαι¹⁸ τοῦ πατρός μου συνεδράμον¹⁹, ἄτεκνος εἶχον ἀποθανεῖν.
