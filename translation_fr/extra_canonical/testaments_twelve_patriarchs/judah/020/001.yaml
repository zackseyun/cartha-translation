base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: fr
  text: Elle égare, car, dans l’illusion de l’argent, ils appellent dieux ceux qui ne le sont pas ; et elle fait tomber dans l’extase celui qui la possède[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἔκστασις peut désigner un état où l’on est hors de soi, et peut selon le contexte évoquer la stupeur, le trouble ou l’extase.
    reason: Préciser l’étendue sémantique du terme grec sans réduire son sens à une expérience mystique ou positive.
lexical_decisions:
- source_word: ὁδηγεῖ
  choice: Elle égare
  rationale: Dans ce contexte négatif, le verbe « conduire » a le sens de mener sur une fausse voie. Le sujet, sous-entendu dans le fragment grec, est repris par le pronom féminin « elle ».
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: aveuglés par l’argent
  rationale: La tournure grecque signifie littéralement « dans l’égarement/l’illusion de l’argent ». La formulation retenue exprime naturellement en français l’emprise trompeuse de l’argent sans préciser indûment s’il s’agit de sa possession ou de son amour.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: donnent le nom de dieux à ceux qui ne sont pas des dieux
  rationale: Cette formulation conserve l’insistance du grec sur l’attribution mensongère du nom de « dieux ».
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: tomber dans un état où il est hors de lui-même
  rationale: ἔκστασις désigne ici une sortie de son état normal, probablement un dérèglement ou un égarement, plutôt qu’une expérience mystique positive. « Hors de lui-même » garde l’image fondamentale et une part de l’ambiguïté.
theological_decisions:
- issue: Identification des prétendus dieux
  choice: Ne pas identifier davantage « ceux qui ne sont pas des dieux »
  alternative: Préciser qu’il s’agit d’idoles ou de personnes divinisées
  rationale: Le grec demeure général ; une précision imposerait une interprétation absente du texte.
- issue: Portée de ἔκστασις
  choice: Conserver l’idée générale d’un état hors de soi
  alternative: Traduire par « extase », « frénésie » ou « folie »
  rationale: « Extase » pourrait suggérer en français moderne une expérience mystique ou heureuse, tandis que « frénésie » ou « folie » fixerait trop étroitement le sens.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le pronom féminin du grec, dont l’antécédent se trouve dans le contexte précédent, ainsi que le contraste appuyé entre le nom de « dieux » et leur non-divinité.
