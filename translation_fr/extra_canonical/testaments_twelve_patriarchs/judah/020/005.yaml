  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: fr
  text: Et l’esprit de vérité accuse tous, et le pécheur est embrasé par son propre cœur, et il ne peut lever son visage vers le juge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: l’esprit de vérité
  rationale: Rend directement l’expression grecque, sans imposer par la majuscule une identification personnelle que le contexte immédiat ne tranche pas.
- source_word: κατηγορεῖ
  choice: accuse
  rationale: Conserve la valeur judiciaire naturelle du verbe grec.
- source_word: πάντων
  choice: tous les hommes
  rationale: Le génitif masculin pluriel désigne vraisemblablement toutes les personnes; cette explicitation évite en français l’ambiguïté de «tous» isolé.
- source_word: ἐμπεπύρισται
  choice: est dévoré par le feu
  rationale: Le parfait passif exprime un état résultant d’un embrasement; la formulation française conserve l’image du feu sans raideur excessive.
- source_word: ἐκ τῆς ἰδίας καρδίας
  choice: qui vient de son propre cœur
  rationale: Préserve l’origine intérieure indiquée par ἐκ et l’insistance de ἰδίας.
- source_word: ἆραι πρόσωπον
  choice: lever les yeux
  rationale: Expression française naturelle correspondant à l’idiome «lever la face», ici dans une situation de honte devant le juge.
- source_word: πρὸς τὸν κριτήν
  choice: vers le juge
  rationale: Rend explicitement le complément présent dans le grec fourni.
theological_decisions:
- issue: Statut personnel de «l’esprit de vérité»
  choice: minuscule à «esprit»
  alternative: «l’Esprit de vérité»
  rationale: Le grec ne comporte pas de distinction de casse équivalente permettant de décider à lui seul s’il s’agit d’une personne divine; la traduction préserve cette ouverture.
- issue: Portée de πάντων
  choice: «tous les hommes»
  alternative: «toutes choses»
  rationale: Avec κατηγορεῖ, l’accusation vise naturellement des personnes; toutefois, la forme grecque prise isolément peut aussi être comprise plus largement.
translation_notes:
  register: Français moderne, digne et accessible. La dernière proposition a été traduite intégralement, car «et il ne peut lever la face vers le juge» figure bien dans la source grecque fournie, malgré la révision anglaise qui la disait absente.
