revisions:
- from: Et l’esprit de vérité accuse tous les hommes. Le pécheur est dévoré par le feu qui vient de son propre cœur, et il ne peut lever les yeux vers le juge.
  to: Et l’esprit de vérité accuse tous, et le pécheur est embrasé par son propre cœur, et il ne peut lever son visage vers le juge.
  rationale: 'Révision limitée visant à préserver les indéterminations de πάντων et la formulation imagée de ἐμπεπύρισται ἐκ τῆς ἰδίας καρδίας, tout en conservant intégralement la clause finale attestée par le grec. Aucune note n’est nécessaire : les ambiguïtés sont maintenues dans le texte français sans surinterprétation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'La dernière proposition grecque est bien complète dans la source fournie : καὶ ἆραι πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται signifie qu’il ne peut lever son visage vers le juge. Le projet la restitue à juste titre, contrairement à la piste anglaise tronquée. Toutefois, « tous les hommes » restreint inutilement πάντων, dont le référent demeure grammaticalement non exprimé, et « dévoré par le feu qui vient de » développe l’image et le rapport causal au-delà du grec.'
  naturalness: La formulation est globalement naturelle, mais « le feu qui vient de son propre cœur » est plus explicatif et plus lourd que nécessaire. « Est embrasé par son propre cœur » rend naturellement l’image de feu et l’origine ou l’agent intérieur en français moderne soutenu.
  terminology: « l’esprit de vérité » conserve l’ambiguïté de casse du grec et convient. « Accuse » rend précisément κατηγορεῖ. « Lever son visage vers le juge » est plus proche de ἆραι πρόσωπον que « lever les yeux », tout en restant intelligible dans un registre scripturaire modéré.
  issues:
  - severity: medium
    issue: Restriction de πάντων par « tous les hommes »
    rationale: Le génitif pluriel πάντων ne précise pas son référent. Avec κατηγορεῖ, une portée personnelle est plausible, mais « tous » préserve mieux l’indétermination du texte sans imposer « hommes ».
  - severity: medium
    issue: Développement interprétatif de ἐμπεπύρισται ἐκ τῆς ἰδίας καρδίας
    rationale: « Est dévoré par le feu qui vient de son propre cœur » ajoute un agent explicitement nommé (« le feu ») et transforme l’expression concise du grec. « Est embrasé par son propre cœur » conserve l’imagerie ignée et la relation au cœur sans cette expansion.
  - severity: low
    issue: « Lever les yeux » remplace « lever le visage »
    rationale: L’expression française est naturelle, mais πρόσωπον désigne le visage. Employer « visage » maintient l’image de honte ou d’incapacité à se présenter devant le juge.
  revised_text: Et l’esprit de vérité accuse tous, et le pécheur est embrasé par son propre cœur, et il ne peut lever son visage vers le juge.
  revised_footnotes: []
  revision_rationale: 'Révision limitée visant à préserver les indéterminations de πάντων et la formulation imagée de ἐμπεπύρισται ἐκ τῆς ἰδίας καρδίας, tout en conservant intégralement la clause finale attestée par le grec. Aucune note n’est nécessaire : les ambiguïtés sont maintenues dans le texte français sans surinterprétation.'
