  text: Ἀλλ᾽ ὁ Θεὸς τῶν πατέρων μου²⁰ ἐλέησε με, ὅτι ἐν ἀγνωσίᾳ²¹ τοῦτο²² ἐποίησα.
  language: Greek
base_translation:
