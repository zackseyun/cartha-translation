  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/003.yaml
  text: But the God of my fathers had mercy on me, because I did this in ignorance.
translation:
  language: fr
  text: Mais le Dieu de mes pères a eu pitié de moi, parce que j’ai fait cela par ignorance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: le Dieu de mes pères
  rationale: Rend directement l’expression ancestrale grecque tout en conservant son registre biblique naturel en français.
- source_word: ἐλέησε με
  choice: a eu pitié de moi
  rationale: Exprime ici l’acte de compassion de Dieu de façon naturelle et fidèle; «m’a fait miséricorde» serait moins courant en français moderne.
- source_word: ἐν ἀγνωσίᾳ
  choice: sans savoir ce que je faisais
  rationale: Restitue idiomatiquement l’idée d’une action accomplie dans l’ignorance, sans suggérer nécessairement l’innocence ou l’absence de responsabilité.
- source_word: τοῦτο ἐποίησα
  choice: j’ai fait cela
  rationale: Conserve le démonstratif neutre et la formulation sobre du grec, dont le référent dépend du contexte.
theological_decisions:
- issue: Rapport entre l’ignorance de Juda et la compassion divine
  choice: Conserver le lien causal explicite sans déclarer que l’ignorance l’innocentait.
  alternative: «car je l’avais fait involontairement»
  rationale: Le grec parle d’ignorance, non nécessairement d’un acte involontaire; la traduction préserve donc la tension entre faute, ignorance et pitié divine.
translation_notes:
  register: Français moderne, clair et digne. La tournure «le Dieu de mes pères» conserve la résonance biblique, tandis que «sans savoir ce que je faisais» rend naturellement l’expression grecque sans surinterprétation.
