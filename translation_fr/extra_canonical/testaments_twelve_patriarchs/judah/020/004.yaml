base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: fr
  text: Car le prince de l’égarement m’a aveuglé, et j’ai manqué de discernement, comme un être humain, comme une chair corrompue dans les péchés ; j’ai reconnu ma propre faiblesse, me croyant invincible.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: le prince de l’égarement
  rationale: « Prince » conserve le rang exprimé par ἄρχων, tandis qu’« égarement » rend πλάνη sans limiter le sens au seul mensonge intentionnel.
- source_word: ἠγνόησα
  choice: je suis resté sans comprendre
  rationale: Rend naturellement l’idée d’ignorance ou de défaut de discernement dans ce contexte, sans ajouter un objet absent du grec.
- source_word: ὡς ἄνθρωπος
  choice: comme un être humain
  rationale: Formulation inclusive et courante qui conserve la comparaison anthropologique du grec.
- source_word: ὡς σὰρξ ἐν ἁμαρτίαις φθαρείς
  choice: comme une chair corrompue par les péchés
  rationale: Préserve l’image concrète de σάρξ et le pluriel « péchés », ainsi que le participe passif φθαρείς.
- source_word: ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν
  choice: j’ai alors reconnu ma propre faiblesse
  rationale: « Reconnu » exprime la prise de conscience portée par ἐπέγνων; « alors » explicite légèrement l’enchaînement narratif de καί.
- source_word: νομίζων ἀκαταμάχητος εἶναι
  choice: moi qui me croyais invincible
  rationale: Tournure française naturelle qui maintient la simultanéité circonstancielle du participe et le sens de « impossible à vaincre ».
theological_decisions:
- issue: Nature du « prince de l’égarement »
  choice: Maintenir le titre sans identifier explicitement le personnage
  alternative: « le diable » ou « Satan »
  rationale: Le grec emploie un titre descriptif et ne donne ici aucun nom propre; l’expliciter résoudrait indûment l’ambiguïté.
- issue: Portée de σάρξ
  choice: Conserver « chair »
  alternative: « être de chair » ou « nature pécheresse »
  rationale: « Chair » maintient la tension anthropologique du texte; « nature pécheresse » importerait une interprétation théologique plus précise que la formulation grecque.
translation_notes:
  register: Français moderne, digne et accessible. Les deux comparaisons introduites par ὡς sont conservées, malgré leur construction dense. La ponctuation répartit la longue phrase grecque en trois phrases pour améliorer la lisibilité sans modifier son déroulement logique.
