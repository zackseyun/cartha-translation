  source_fidelity: 'Le sens global est bien rendu : le titre descriptif ὁ ἄρχων τῆς πλάνης n’est pas surinterprété, l’ignorance/absence de discernement, la corruption de la chair dans les péchés, la reconnaissance de la faiblesse et la présomption d’invincibilité sont tous conservés. Toutefois, « Je suis resté sans comprendre » introduit une nuance durative qui n’est pas portée par l’aoriste ἠγνόησα, et « alors » ajoute une précision temporelle non exprimée par καί.'
