lexical_decisions:
- source_word: Τέκνα μου
  choice: Mes enfants
  rationale: Rend directement l’adresse affectueuse et solennelle du grec dans un français naturel.
- source_word: ἡ φιλαργυρία
  choice: l’amour de l’argent
  rationale: Exprime clairement le désir ou l’attachement à l’argent; « avarice » pourrait restreindre le sens à la réticence à dépenser.
- source_word: πρὸς εἰδωλολατρίαν
  choice: à l’idolâtrie
  rationale: Avec le verbe de mouvement ὁδηγεῖ, πρὸς indique ici la direction ou l’aboutissement.
- source_word: ὁδηγεῖ
  choice: conduit
  rationale: Conserve l’image grecque de guider ou mener vers une destination.
theological_decisions:
- issue: Rapport entre l’amour de l’argent et l’idolâtrie
  choice: conduit à l’idolâtrie
  alternative: est de l’idolâtrie
  rationale: Le grec exprime un mouvement vers l’idolâtrie, non une identification explicite des deux réalités.
