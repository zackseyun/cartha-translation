  to: '« Écoutez, mes enfants, votre père Juda. Je fus le quatrième fils de mon père Jacob. Léa, ma mère, me donna le nom de Juda, en disant : “Je rends grâce au Seigneur, parce qu’il m’a donné aussi un quatrième fils.” »'
  rationale: Révision limitée à l'ordre de l'adresse vocative afin de rendre clairement en français le rapport entre Juda et ses enfants. Le reste du texte est conservé, y compris la sobriété de « je fus », la désignation « le Seigneur » et l'allusion non explicitée entre le nom de Juda et l'action de grâce.
