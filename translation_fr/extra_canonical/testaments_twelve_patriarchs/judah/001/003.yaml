  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: fr
  text: '« Écoutez, mes enfants, votre père Juda. Je fus le quatrième fils de mon père Jacob. Léa, ma mère, me donna le nom de Juda, en disant : “Je rends grâce au Seigneur, parce qu’il m’a donné aussi un quatrième fils.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: Impératif direct et naturel, qui conserve l’appel solennel adressé aux enfants.
- source_word: ἐγενόμην
  choice: Je fus
  rationale: Dans ce contexte de rang filial, le verbe exprime le fait d’être devenu ou d’avoir été le quatrième fils; « je fus » reste sobre et fidèle sans surinterpréter le mode de naissance.
- source_word: ἐπωνόμασέν με Ἰούδαν
  choice: me donna le nom de Juda
  rationale: Formulation française naturelle pour l’acte de nommer, tout en conservant explicitement le nom Juda.
- source_word: Ἀνθομολογοῦμαι
  choice: Je rends grâce
  rationale: Le verbe peut exprimer la reconnaissance publique ou la louange; « rendre grâce » restitue ici naturellement la parole de Léa et son orientation vers le Seigneur.
- source_word: καὶ τέταρτον υἱόν
  choice: aussi un quatrième fils
  rationale: Conserve la valeur additive de καί ainsi que le rang ordinal indiqué par τέταρτον.
theological_decisions:
- issue: Titre divin Κυρίῳ
  choice: au Seigneur
  alternative: à l’Éternel
  rationale: Le texte grec porte le titre Κύριος sans reproduire ici un nom divin en hébreu; « le Seigneur » traduit directement la forme transmise sans importer une reconstruction confessionnelle.
- issue: Lien entre le nom Juda et l’action de grâce
  choice: Conserver le nom suivi de la déclaration de reconnaissance, sans ajouter d’explication étymologique
  alternative: Ajouter « Juda, c’est-à-dire louange »
  rationale: Le grec laisse percevoir l’allusion sans l’expliciter; une glose étymologique résoudrait ou amplifierait ce que le texte ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. La construction vocative abrupte « Juda, votre père » est conservée afin de respecter la formulation grecque, plutôt que d’ajouter « écoutez-moi », absent du texte source.
