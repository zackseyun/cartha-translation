  text: 'The Testament of Judah, the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.'
translation:
  language: fr
  text: 'Le Testament de Juda, le quatrième fils de Jacob et de Léa.


    1 Copie des paroles de Juda, qu’il adressa à ses fils avant de mourir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans le titre de cet écrit, le terme désigne les dernières déclarations et dispositions attribuées à Juda; « Testament » est naturel en français et conserve le genre littéraire traditionnel.
- source_word: Ἀντίγραφον
  choice: Copie
  rationale: Rend directement l’idée d’une transcription ou reproduction écrite, sans préciser la nature de son modèle.
- source_word: λόγων
  choice: paroles
  rationale: Le contexte présente un discours prononcé par Juda; « paroles » conserve le sens large du grec.
- source_word: ἐλάλησε
  choice: adressa
  rationale: La construction avec le destinataire au datif est rendue idiomatiquement par « adresser des paroles à », tout en conservant l’acte de parler.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: avant de mourir
  rationale: Formulation française naturelle qui reproduit clairement l’antériorité du discours par rapport à la mort de Juda.
