  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: fr
  text: 'Une fois devenu adulte, mon père pria pour moi en disant : « Tu seras roi et tu réussiras en tout. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: je fus devenu adulte
  rationale: Le verbe exprime ici l’arrivée à la maturité; cette formulation française est naturelle et convient au contexte autobiographique.
- source_word: ηὔξατό μοι
  choice: pria pour moi
  rationale: Le grec indique une prière ou un vœu formulé en faveur de Juda, plutôt qu’une bénédiction exprimée directement.
- source_word: Βασιλεὺς ἔσῃ
  choice: Tu seras roi
  rationale: Rend directement la prédiction au futur sans ajouter d’article indéfini inutile en français.
- source_word: κατευοδούμενος ἐν πᾶσιν
  choice: tu réussiras en toutes choses
  rationale: Le participe évoque le fait de connaître une marche favorable ou la réussite dans tous les domaines; une proposition coordonnée est plus naturelle en français.
theological_decisions:
- issue: Nature de l’acte du père
  choice: pria pour moi
  alternative: me bénit
  rationale: ηὔξατό μοι désigne plus précisément une prière ou un vœu fait pour quelqu’un; traduire par « bénit » risquerait de transformer cet acte en bénédiction formelle.
translation_notes:
  register: Français moderne, digne et accessible. Le passé antérieur littéraire a été évité au profit du passé simple dans la subordonnée, afin de conserver une narration soutenue sans archaïsme excessif.
