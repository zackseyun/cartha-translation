  text: I was keen in my youth, and I obeyed my father in every matter.
translation:
  language: fr
  text: Dans ma jeunesse, j’étais vif, et j’obéissais à mon père en toute chose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξύς
  choice: vif
  rationale: Le terme peut évoquer l’acuité, la vivacité ou l’ardeur. « Vif » conserve cette largeur de sens et convient naturellement à une qualité personnelle dans la jeunesse.
- source_word: ὑπήκουον
  choice: j’obéissais
  rationale: L’imparfait grec décrit une disposition ou une conduite habituelle dans le passé; l’imparfait français la rend directement.
- source_word: κατὰ πάντα λόγον
  choice: en toute chose
  rationale: L’expression signifie ici que Juda obéissait sur chaque parole, point ou affaire. « En toute chose » est idiomatique et préserve la portée générale sans réduire λόγος à la seule parole prononcée.
