base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017.yaml
  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: fr
  text: '**17** 1 Maintenant donc, je vous l’ordonne, mes enfants : n’aimez pas l’argent et ne portez pas vos regards sur la beauté des femmes. Car moi aussi, à cause de l’or et de la beauté, je me suis égaré avec Besoué, la Cananéenne.[a]


    2 Je sais qu’à cause de ces deux choses, ma descendance ira à sa perte dans l’immoralité sexuelle. Elles corrompront même des hommes sages parmi mes fils et feront décliner la royauté de Juda, que le Seigneur m’a donnée en raison de mon obéissance à mon père Jacob.


    3 Pour ma part, je n’ai jamais contredit Jacob, mon père, car je faisais tout ce qu’il me disait. 4 Abraham, mon ancêtre, m’a béni pour régner en Israël, et Jacob m’a béni de même. 5 Je sais aussi que la royauté s’élèvera de moi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Besoué » : nom propre transmis par le texte grec; l’identification exacte de cette femme cananéenne est incertaine.'
    reason: Le nom Βησουὲ est textuellement obscur et ne doit pas être harmonisé sans indication avec une autre femme du récit de Juda.
  - marker: b
    text: 'Ou : « le royaume naîtra de moi ». Le grec dit littéralement que « la royauté/le royaume s’élèvera de moi »; βασίλειον peut désigner la royauté ou le royaume.'
    reason: στήσεται est ici à comprendre avec τὸ βασίλειον comme sujet; la note explicite l’ambiguïté sémantique de βασίλειον sans convertir la phrase en passif.
lexical_decisions:
- source_word: ἀργύριον
  choice: l’argent
  rationale: Le terme désigne ici l’argent métal ou la richesse; « l’argent » conserve naturellement en français les deux associations pertinentes.
- source_word: ἐπιβλέπειν εἰς κάλλος γυναικῶν
  choice: se laisser séduire par la beauté des femmes
  rationale: La tournure grecque signifie littéralement porter son regard vers cette beauté; dans ce contexte d’avertissement moral, cette formulation française en exprime la visée sans réduire l’acte à un simple regard.
- source_word: γένος μου
  choice: ma descendance
  rationale: Dans ce contexte familial et prophétique, γένος désigne la lignée issue de Juda.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: ira à sa perte dans l’immoralité sexuelle
  rationale: Cette traduction conserve le lien difficile et potentiellement ambigu entre la perte et πορνεία, sans transformer celle-ci de manière certaine en cause, en nature ou en résultat de la perte.
- source_word: ἀλλοιώσουσι
  choice: corrompront
  rationale: Le verbe signifie changer ou altérer; appliqué à des sages sous l’influence de l’argent et de la beauté, « corrompre » rend clairement l’altération morale visée.
- source_word: βασιλείαν Ἰούδα
  choice: la royauté de Juda
  rationale: βασιλεία peut désigner le règne, la dignité royale ou le royaume. « Royauté » convient aux bénédictions dynastiques des versets 4-5 et évite d’imposer seulement une entité territoriale.
- source_word: παρελάλησα
  choice: j’ai désobéi
  rationale: Dans le parallélisme avec l’affirmation que Juda accomplissait tout ce que Jacob lui disait, le verbe exprime ici le fait d’aller contre la parole ou les ordres du père.
- source_word: στήσεται τὸ βασίλειον
  choice: la royauté sera établie
  rationale: Le passif futur exprime l’établissement durable du pouvoir royal; la formulation française conserve le passif du grec.
theological_decisions:
- issue: Origine et établissement de la royauté de Juda
  choice: Conserver à la fois le don du Seigneur, les bénédictions ancestrales et l’établissement futur de la royauté issue de Juda.
  alternative: Harmoniser ces affirmations en présentant Abraham ou Jacob comme l’unique médiateur explicite du don divin.
  rationale: Le texte juxtapose ces perspectives sans expliquer précisément leur articulation; la traduction maintient cette tension.
- issue: Référent du sujet pluriel au verset 2
  choice: Rendre le sujet par « Elles », renvoyant aux deux choses mentionnées, l’or/l’argent et la beauté.
  alternative: Employer un sujet humain indéfini, comme « des gens », ou faire de l’immoralité sexuelle le sujet.
  rationale: Le grec enchaîne directement τὰ δύο ταῦτα avec des verbes au pluriel; préserver ce lien respecte la personnification causale du texte.
- issue: Portée de la prophétie dynastique au verset 5
  choice: Traduire simplement que la royauté sera établie à partir de Juda.
  alternative: Identifier explicitement cette royauté à un roi ou à une figure messianique particulière.
  rationale: Le passage affirme une origine judéenne, mais ne nomme ici aucun souverain précis; l’explicitation théologique dépasserait la formulation grecque.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement pluriel est évité par des formulations impératives non marquées; « mes enfants » conserve l’adresse testamentaire. La numérotation des versets est rétablie pour l’ensemble du chapitre fourni. Les répétitions de « beauté », « bénir » et « royauté » sont maintenues lorsqu’elles structurent l’argument.
