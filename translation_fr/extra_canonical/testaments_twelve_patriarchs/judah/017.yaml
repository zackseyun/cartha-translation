review_pass:
  verdict: revise
  source_fidelity: 'Une correction est nécessaire aux vv. 1, 3 et surtout 5. ἐπιβλέπειν εἰς désigne le fait de porter/regarder vers, non directement le fait d’être séduit. παρελάλησα signifie plus précisément « contredire » ou « parler contre ». Au v. 5, στήσεται avec τὸ βασίλειον comme sujet est naturellement intransitif : « la royauté s’élèvera/naîtra de moi », et non un passif (« sera établie »).'
  naturalness: Le français est globalement fluide et digne. « Porter votre regard sur » est une formulation moderne plus fidèle que « vous laisser séduire par ». « S’élèvera de moi » conserve la concision solennelle et le caractère dynastique de la déclaration finale.
  terminology: « Argent », « beauté », « immoralisme sexuelle », « descendance », « royauté », « Seigneur » et « Cananéenne » conviennent. « Immoralité sexuelle » est conservé pour πορνεία, sans imposer une interprétation confessionnelle. Le nom obscur Besoué est maintenu avec une note.
  issues:
  - severity: medium
    issue: Le v. 1 rend ἐπιβλέπειν εἰς κάλλος γυναικῶν par « vous laisser séduire par la beauté des femmes ».
    rationale: Le grec exprime explicitement l’orientation du regard; la séduction est une inférence contextuelle. Une formulation centrée sur le regard préserve mieux le degré d’explicitation du texte.
  - severity: medium
    issue: Le v. 3 rend παρελάλησα par « j’ai désobéi ».
    rationale: Le verbe renvoie littéralement au fait de parler contre, de contredire. Le contexte implique l’obéissance, mais la traduction ne doit pas remplacer le terme verbal par cette seule implication.
  - severity: high
    issue: Le v. 5 rend στήσεται τὸ βασίλειον par « la royauté sera établie ».
    rationale: 'στήσεται est ici naturellement compris avec « la royauté/le royaume » comme sujet : elle s’élèvera, surgira ou naîtra de Juda. Le passif français introduit un agent d’établissement absent du grec.'
