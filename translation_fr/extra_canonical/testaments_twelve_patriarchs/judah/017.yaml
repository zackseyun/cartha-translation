    2 Je sais qu’à cause de ces deux choses, ma descendance ira à sa perte dans l’immoralité sexuelle. Elles corrompront même des hommes sages parmi mes fils et feront décliner la royauté de Juda, que le Seigneur m’a donnée parce que j’ai obéi à mon père.


