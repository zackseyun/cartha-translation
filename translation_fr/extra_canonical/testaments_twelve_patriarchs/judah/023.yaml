  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
translation:
  language: fr
  text: '**23** J’éprouve une grande tristesse, mes enfants, à cause des débauches et des pratiques magiques auxquelles vous vous livrerez dans le royaume : vous suivrez des ventriloques[a], des présages et des démons de l’égarement. **2** Vous ferez de vos filles des musiciennes et des prostituées[b], et vous vous mêlerez aux pratiques abominables des nations.


    **3** À cause de cela, le Seigneur fera venir sur vous la famine et la peste, la mort et une épée vengeresse, le siège, des chiens pour vous mettre en pièces, les outrages des ennemis, la destruction des ennemis[c], la gangrène des yeux, la mise à mort des tout-petits, le pillage de vos biens, l’incendie des temples de Dieu, la dévastation du pays et votre propre asservissement parmi les nations. **4** Ils castreront vos fils pour en faire les eunuques de leurs femmes.


    **5** Jusqu’à ce que le Seigneur vous visite, vous vous repentirez de tout votre cœur et marcherez selon tous ses commandements, et il vous ramènera de la captivité parmi les nations[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec signifie littéralement « ceux qui parlent du ventre ». Dans l’Antiquité, il pouvait désigner des médiums ou des personnes censées faire parler les morts ou des esprits.
    reason: cultural_note
  - marker: b
    text: Le grec dit littéralement « musiciennes et femmes publiques ». Dans ce contexte, « femmes publiques » désigne vraisemblablement des prostituées, tandis que les musiciennes sont probablement des femmes vouées au divertissement public.
    reason: lexical_alternative
  - marker: c
    text: L’expression grecque signifie littéralement « destruction des ennemis ». Le génitif peut désigner les ennemis comme ceux qui sont détruits, ou comme ceux par qui la destruction est causée; dans cette liste de malheurs, le sens précis demeure incertain.
    reason: ambiguity
  - marker: d
    text: 'La construction grecque du verset 5 est resserrée : le rapport temporel précis entre la visite du Seigneur, la repentance, l’obéissance et le retour de captivité demeure quelque peu ambigu.'
    reason: textual_syntax
lexical_decisions:
- source_word: ἀσελγείας
  choice: débauches
  rationale: Le terme désigne une conduite sensuelle éhontée et excessive. « Débauches » en conserve la portée morale et sexuelle sans alourdir la phrase.
- source_word: γοητείας
  choice: pratiques magiques
  rationale: Le mot vise des procédés de magie ou de sorcellerie illicites ; cette formulation est claire en français contemporain.
- source_word: ἐγγαστρομύθους
  choice: ventriloques
  rationale: Le grec signifie littéralement « ceux qui parlent du ventre » et désigne ici des médiums censés faire parler des esprits. Le terme concret est maintenu, avec une note culturelle.
- source_word: κληδόσι
  choice: présages
  rationale: Le terme désigne des signes ou paroles fortuites interprétés à des fins divinatoires.
- source_word: δαίμοσιν πλάνης
  choice: démons qui égarent
  rationale: Cette formulation rend le génitif par son effet probable tout en conservant l’agent démoniaque explicite.
- source_word: μουσικὰς καὶ δημοσίας
  choice: musiciennes et prostituées
  rationale: μουσικάς évoque des femmes vouées au divertissement musical, tandis que δημοσίας, littéralement « publiques », désigne vraisemblablement des prostituées. Une note signale la formulation littérale.
- source_word: ἐπιμιγήσεσθε
  choice: vous vous mêlerez
  rationale: Le choix conserve l’image du mélange ou de l’association sans préciser abusivement qu’il s’agit uniquement d’union sexuelle.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: une épée vengeresse
  rationale: Le participe qualifie naturellement l’épée comme instrument de châtiment ou de vengeance.
- source_word: κύνας εἰς διασπασμόν
  choice: des chiens qui vous mettront en pièces
  rationale: 'La construction exprime la destination ou l’effet : des chiens livrés à la mise en pièces. Le complément « vous » est explicité d’après le contexte du jugement.'
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: la gangrène des yeux
  rationale: σφακελισμός évoque la gangrène, la nécrose ou la mortification ; le rendu concret préserve l’image corporelle sévère.
- source_word: νηπίων ἀναιρέσεις
  choice: le meurtre des tout-petits
  rationale: ἀναίρεσις signifie ici mise à mort ; νήπια désigne de très jeunes enfants.
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: le pillage de vos biens
  rationale: τὰ ὑπάρχοντα désigne les possessions, et ἁρπαγή leur saisie violente.
- source_word: ἐπισκέψηται
  choice: intervienne en votre faveur
  rationale: Dans ce contexte de restauration, le verbe exprime une visite ou intervention divine attentive, et non une simple inspection.
- source_word: ἐν τελείᾳ καρδίᾳ
  choice: d’un cœur entier
  rationale: Le grec indique une disposition intérieure complète, sans partage ; l’expression est naturelle et digne en français.
theological_decisions:
- issue: Rapport entre le jugement, la repentance et l’intervention du Seigneur au verset 5
  choice: Le texte présente la repentance sincère et l’obéissance, puis le retour de captivité accompli par le Seigneur, sans construire un ordre doctrinal plus précis que la syntaxe grecque.
  alternative: « Jusqu’à ce que le Seigneur vous visite, après que vous vous serez repentis… » ou « jusqu’à ce que vous vous repentiez…, alors le Seigneur vous ramènera… »
  rationale: La phrase grecque est comprimée et coordonne des formes verbales dont le rapport temporel exact n’est pas entièrement explicite. La traduction conserve cette tension au lieu d’imposer un schéma causal ou chronologique.
- issue: Sens de « temples de Dieu »
  choice: 'Traduction littérale au pluriel : « temples de Dieu ».'
  alternative: « le temple de Dieu » ou « les sanctuaires de Dieu »
  rationale: Le source porte ναῶν θεοῦ au pluriel. Il ne convient pas de le singulariser pour l’harmoniser avec une conception particulière du sanctuaire.
- issue: Castration des fils et service auprès des femmes étrangères
  choice: « Ils castreront vos fils pour en faire les eunuques de leurs femmes. »
  alternative: « Ils retrancheront vos fils comme eunuques au service de leurs femmes. »
  rationale: Le verbe ἐκτέμνω est explicite. La traduction ne l’atténue pas et laisse intacte l’image humiliante du jugement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours paternel et prophétique conserve sa gravité ainsi que l’accumulation brutale des jugements. Les termes occultes et corporels ne sont pas édulcorés ; les ambiguïtés réelles sont signalées en notes plutôt que résolues silencieusement.
