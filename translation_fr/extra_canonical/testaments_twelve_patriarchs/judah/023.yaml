revisions:
- from: '**23** Une grande tristesse m’accable, mes enfants, à cause des débauches et des pratiques magiques auxquelles vous vous livrerez dans le royaume : vous suivrez des ventriloques[a], des présages et des démons qui égarent. 2 Vous ferez de vos filles des musiciennes et des prostituées[b], et vous vous mêlerez aux pratiques abominables des nations.


    3 À cause de cela, le Seigneur fera venir sur vous la famine et l’épidémie, la mort et une épée vengeresse, le siège, des chiens qui vous mettront en pièces, les outrages des ennemis, la destruction des ennemis[c], la gangrène des yeux, le meurtre des tout-petits, le pillage de vos biens, l’incendie des temples de Dieu, la dévastation du pays et votre propre asservissement parmi les nations. 4 Ils castreront vos fils pour en faire les eunuques de leurs femmes.


    5 Cela durera jusqu’à ce que le Seigneur intervienne en votre faveur, que vous vous repentiez d’un cœur entier en observant tous ses commandements, et qu’il vous ramène de la captivité parmi les nations[d].'
  to: '**23** J’éprouve une grande tristesse, mes enfants, à cause des débauches et des pratiques magiques auxquelles vous vous livrerez dans le royaume : vous suivrez des ventriloques[a], des présages et des démons de l’égarement. **2** Vous ferez de vos filles des musiciennes et des prostituées[b], et vous vous mêlerez aux pratiques abominables des nations.


    **3** À cause de cela, le Seigneur fera venir sur vous la famine et la peste, la mort et une épée vengeresse, le siège, des chiens pour vous mettre en pièces, les outrages des ennemis, la destruction des ennemis[c], la gangrène des yeux, la mise à mort des tout-petits, le pillage de vos biens, l’incendie des temples de Dieu, la dévastation du pays et votre propre asservissement parmi les nations. **4** Ils castreront vos fils pour en faire les eunuques de leurs femmes.


    **5** Jusqu’à ce que le Seigneur vous visite, vous vous repentirez de tout votre cœur et marcherez selon tous ses commandements, et il vous ramènera de la captivité parmi les nations[d].'
  rationale: La révision retire l’ajout interprétatif « Cela durera » et « en votre faveur », rend le génitif δαίμοσιν πλάνης de manière plus directe, et réorganise 23.5 pour refléter la coordination grecque sans imposer un ordre doctrinal ou causal. Les détails sévères de la liste sont maintenus, y compris le pluriel « temples de Dieu » et la formulation explicite concernant les eunuques.
  reviewer_model: gpt-5.6-terra
