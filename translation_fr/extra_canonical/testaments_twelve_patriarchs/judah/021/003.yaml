lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: ce qui est sur la terre
  rationale: Rend naturellement l’expression grecque désignant les réalités terrestres, sans ajouter une catégorie absente du texte.
- source_word: τὰ ἐν οὐρανοῖς
  choice: ce qui est dans les cieux
  rationale: Conserve le pluriel grec οὐρανοῖς et le parallélisme avec « sur la terre ».
theological_decisions:
- issue: Référents implicites de « il », « moi » et « lui »
  choice: Maintenir les pronoms sans explicitation
  alternative: Insérer les noms des personnes selon le contexte
  rationale: Le verset grec lui-même ne nomme pas les référents ; les expliciter ici résoudrait une donnée contextuelle que le texte laisse implicite.
translation_notes:
  register: Français moderne, sobre et digne. La construction elliptique du second membre est conservée afin de reproduire le parallélisme concis du grec.
