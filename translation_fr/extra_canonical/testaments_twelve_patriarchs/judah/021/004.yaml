  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/004.yaml
  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: fr
  text: Car c’est ainsi que le sacerdoce de Dieu surpasse la royauté terrestre, à moins que, par des péchés, il ne s’éloigne du Seigneur et ne tombe sous la domination de la royauté terrestre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: le sacerdoce de Dieu
  rationale: « Sacerdoce » rend naturellement l’institution ou la fonction sacerdotale désignée par ἱερατεία, tandis que le complément « de Dieu » est conservé sans explicitation.
- source_word: ὑπερέχει
  choice: surpasse
  rationale: Le verbe exprime ici une supériorité de rang ou d’autorité; « surpasse » garde cette comparaison directe.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: la royauté terrestre
  rationale: βασιλεία peut désigner le royaume ou le pouvoir royal. Le contexte oppose deux institutions ou autorités; « royauté » maintient ce parallélisme avec « sacerdoce ».
- source_word: διὰ ἁμαρτιῶν
  choice: par des péchés
  rationale: Le pluriel et le lien causal ou instrumental de διά sont maintenus sans réduire l’expression à une notion abstraite de péché.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: ne se détourne du Seigneur
  rationale: ἐκπίπτω avec ἀπό indique une rupture ou une déchéance par rapport au Seigneur. « Se détourner » est idiomatique en français tout en préservant l’idée d’éloignement.
- source_word: κυριευθῇ
  choice: ne tombe sous la domination de
  rationale: Le passif signifie être dominé ou assujetti. Cette formulation naturelle conserve l’inversion d’autorité exprimée dans le grec.
theological_decisions:
- issue: Nature conditionnelle de la supériorité du sacerdoce
  choice: « à moins que »
  alternative: « sauf s’il »
  rationale: ἐὰν μή introduit une exception conditionnelle réelle. La traduction conserve la tension selon laquelle le sacerdoce est supérieur, mais peut perdre cette position par les péchés.
- issue: Référent du sujet des verbes au singulier
  choice: maintenir « le sacerdoce » comme sujet implicite
  alternative: expliciter « celui qui exerce le sacerdoce »
  rationale: La grammaire grecque renvoie directement à ἡ ἱερατεία. Une personnalisation aurait interprété le texte au-delà de ce qu’il énonce.
- issue: Portée de « la royauté terrestre »
  choice: ne pas identifier une institution ou dynastie précise
  alternative: préciser « le pouvoir royal terrestre »
  rationale: Le texte établit une opposition générale entre sacerdoce divin et royauté terrestre; aucune identification confessionnelle ou historique supplémentaire n’est imposée.
translation_notes:
  register: Français moderne, digne et lisible. La phrase conserve la structure argumentative et la tension théologique du grec, tout en évitant un calque lourd. Aucun marqueur de note n’est requis.
