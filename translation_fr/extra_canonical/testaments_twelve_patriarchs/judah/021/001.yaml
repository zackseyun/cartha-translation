source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXI. Καὶ νῦν, τέκνα μου¹, παραγγέλλω ὑμῖν, ἀγαπᾶτε² τὸν Λευὶ³, ἵνα διαμείνητε⁴, καὶ⁵ μὴ ἐπαίρεσθε⁷ ἐπ᾽ αὐτὸν⁸, ἵνα μὴ ἐξολοθρευθῆτε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, je vous ordonne : aimez Lévi, afin que vous subsistiez, et ne vous élevez pas contre lui, de peur que vous ne soyez exterminés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: je vous donne ce commandement
  rationale: Rend explicitement l’acte d’ordonner, dans un français naturel et digne.
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: Impératif direct correspondant au grec, sans ajout interprétatif.
- source_word: διαμείνητε
  choice: vous subsistiez
  rationale: Exprime l’idée de continuer à exister ou de demeurer, tout en conservant l’ouverture du verbe grec quant à la nature précise de cette permanence.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: ne vous élevez pas contre lui
  rationale: Préserve à la fois l’image d’orgueil ou d’élévation et la valeur hostile de ἐπί avec l’accusatif dans ce contexte.
- source_word: ἐξολοθρευθῆτε
  choice: vous ne soyez exterminés
  rationale: Rend la force du passif, qui évoque une destruction complète, sans préciser un agent absent du texte.
theological_decisions:
- issue: Sens de la permanence promise par διαμείνητε
  choice: afin que vous subsistiez
  alternative: afin que vous demeuriez
  rationale: « Subsistiez » laisse entendre la continuité ou la survie suggérée par le contraste avec l’extermination, sans définir cette permanence en termes institutionnels, nationaux ou spirituels.
- issue: Rapport demandé envers Lévi
  choice: aimez Lévi
  alternative: soyez attachés à Lévi
  rationale: Le verbe ἀγαπάω est traduit directement par « aimer », sans transformer l’injonction en soumission ecclésiologique ou politique.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe impérative du grec et le parallélisme entre la promesse de subsister et la menace d’extermination sont conservés.
source_grounding:
  english_pob_role: consult_only
