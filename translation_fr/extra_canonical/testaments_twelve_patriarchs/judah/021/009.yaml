  text: Et il y aura de faux prophètes comme des tempêtes, et ils persécuteront tous les justes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταιγίδες
  choice: tempêtes
  rationale: Le terme désigne des tempêtes ou de violentes bourrasques; « tempêtes » conserve l’image de force soudaine et destructrice.
- source_word: ψευδοπροφῆται
  choice: faux prophètes
  rationale: Équivalent français direct et usuel, qui conserve la portée religieuse du terme grec.
- source_word: διώξουσιν
  choice: persécuteront
  rationale: Dans ce contexte où les justes sont pris pour cible, le verbe exprime une poursuite hostile et se rend naturellement par « persécuteront ».
- source_word: δικαίους
  choice: justes
  rationale: Rend le sens moral et religieux de ceux qui sont reconnus comme droits ou fidèles, sans préciser davantage leur identité.
theological_decisions:
- issue: Portée de πάντας τοὺς δικαίους
  choice: tous les justes
  alternative: tous ceux qui pratiquent la justice
  rationale: La formulation nominale conserve la concision et l’ambiguïté du grec quant à l’identité exacte des « justes ».
translation_notes:
  register: Français moderne, clair et digne. La structure coordonnée du grec est conservée, tandis que « il y aura de faux prophètes » offre une tournure française naturelle.
