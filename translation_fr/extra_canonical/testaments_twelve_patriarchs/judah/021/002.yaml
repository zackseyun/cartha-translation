source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ἐμοὶ γὰρ¹⁰ ἔδωκεν¹¹ ὁ Θεὸς¹² τὴν βασιλείαν, κἀκείνῳ¹² τὴν ἱερατείαν¹³, καὶ¹⁴ ὑπέταξε¹⁴ τὴν βασιλείαν τῇ ἱερωσύνῃ¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/002.yaml
  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: fr
  text: Car Dieu m’a donné la royauté, et à lui la prêtrise ; et il a soumis la royauté à la prêtrise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλείαν
  choice: la royauté
  rationale: Le terme désigne ici la dignité ou l’autorité royale confiée à Juda, plutôt qu’un territoire politique.
- source_word: ἱερατείαν / ἱερωσύνῃ
  choice: la prêtrise
  rationale: Cette formulation naturelle en français conserve le parallèle entre la fonction royale et la fonction sacerdotale, ainsi que la répétition du grec.
- source_word: ὑπέταξε
  choice: a soumis
  rationale: Rend directement l’idée de placer la royauté sous l’autorité ou l’ordre de la prêtrise, sans préciser davantage la nature de cette subordination.
theological_decisions:
- issue: Rapport entre royauté et prêtrise
  choice: « il a soumis la royauté à la prêtrise »
  alternative: « il a subordonné la royauté au sacerdoce »
  rationale: La traduction conserve sans l’atténuer l’affirmation théologique du texte selon laquelle la royauté est placée sous la prêtrise, tout en évitant d’en imposer une interprétation institutionnelle ultérieure.
- issue: Référent de « à lui »
  choice: Maintien du pronom « lui »
  alternative: Nommer explicitement Lévi
  rationale: Le grec emploie un pronom dont le référent dépend du contexte précédent ; le conserver respecte la cohésion du passage et n’ajoute aucun nom absent de ce verset.
translation_notes:
  register: Français moderne, digne et direct. Le parallélisme et la répétition du texte grec sont préservés. Le point-virgule clarifie l’articulation de la dernière proposition sans modifier son rapport logique.
