source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὅτι οἱ βασιλεύσουσιν⁵⁰ ὡς κήτη ἔσονται, *καταπίνοντες ἀνθρώπους⁵¹ ὡς ἰχθύας· υἱοὺς καὶ θυγατέρας ἐλευθέρους⁵² καταδουλώσουσιν⁵³, *οἴκους, ἀγρούς⁵⁴, ποίμνια, χρήματα ἁρπάσουσιν⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people servants, and they will seize houses, fields, flocks, and wealth.
translation:
  language: fr
  text: 'Car ceux qui régneront seront comme des monstres marins : ils engloutiront les gens comme des poissons. Ils réduiront en esclavage des fils et des filles de condition libre, et s’empareront de maisons, de champs, de troupeaux et de richesses.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βασιλεύσουσιν
  choice: ceux qui régneront
  rationale: Le participe substantivé futur désigne les futurs détenteurs du pouvoir royal; cette formulation conserve la valeur verbale sans imposer le substantif « rois ».
- source_word: κήτη
  choice: monstres marins
  rationale: Le terme désigne de grandes créatures de la mer, souvent redoutables; « monstres marins » rend naturellement la comparaison.
- source_word: ἀνθρώπους
  choice: les gens
  rationale: Le grec désigne ici des êtres humains en général, sans restriction de sexe.
- source_word: καταδουλώσουσιν
  choice: réduiront en esclavage
  rationale: Cette expression rend explicitement le caractère coercitif et l’entrée dans l’asservissement.
- source_word: ἐλευθέρους
  choice: de condition libre
  rationale: L’adjectif porte grammaticalement sur « fils et filles »; la traduction préserve cette portée plutôt que d’en faire les enfants de personnes libres.
- source_word: χρήματα
  choice: richesses
  rationale: Dans cette énumération de biens saisis, le mot désigne les ressources ou possessions de valeur.
theological_decisions:
- issue: Identité des futurs dirigeants
  choice: ceux qui régneront
  alternative: les rois
  rationale: Le grec exprime littéralement « ceux qui régneront »; conserver cette tournure évite de préciser davantage leur statut ou leur identité.
- issue: Portée de « libres »
  choice: des fils et des filles de condition libre
  alternative: des fils et des filles de personnes libres
  rationale: L’accord grec rattache ἐλευθέρους aux fils et aux filles eux-mêmes. La traduction suit cette syntaxe sans résoudre autrement leur situation sociale.
translation_notes:
  register: Français international moderne, clair et digne. L’image violente est conservée, ainsi que le parallélisme des deux propositions et l’énumération finale.
