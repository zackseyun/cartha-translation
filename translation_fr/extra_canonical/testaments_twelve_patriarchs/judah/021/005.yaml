  text: Ὁ γὰρ⁵ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ²⁸, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν³¹ ἐντρυφημάτων³² υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
translation:
  language: fr
  text: 'Car l’ange du Seigneur m’a dit : « Le Seigneur l’a choisi plutôt que toi pour s’approcher de lui, manger à sa table et lui offrir les prémices des délices des fils d’Israël.[a] Mais toi, tu seras roi de Jacob. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les prémices des délices des fils d’Israël » désigne probablement des produits de choix ou de riches premières offrandes provenant d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος
  choice: Le Seigneur l’a choisi plutôt que toi
  rationale: Rend directement le contraste comparatif de ὑπὲρ σέ sans préciser davantage la nature de la préférence.
- source_word: προσεγγίζειν αὐτῷ
  choice: pour s’approcher de lui
  rationale: Conserve le sens cultuel possible de l’approche tout en restant naturel en français et sans explicitation doctrinale.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: manger à sa table
  rationale: L’expression grecque, littéralement « manger sa table », est rendue par l’idiome français correspondant.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων υἱῶν Ἰσραήλ
  choice: les prémices des délices des fils d’Israël
  rationale: Préserve l’image cultuelle des prémices et la formulation inhabituelle mais intelligible de « délices », sans réduire celles-ci à des produits agricoles.
- source_word: Σὺ δὲ ἔσῃ βασιλεὺς Ἰακώβ
  choice: Mais toi, tu seras roi de Jacob
  rationale: Le pronom tonique restitue l’opposition marquée par Σὺ δέ; « Jacob » reste sans article comme dans la source.
theological_decisions:
- issue: Nature de l’approche et du repas auprès du Seigneur
  choice: Conserver « s’approcher de lui » et « manger à sa table » sans interprétation supplémentaire
  alternative: Expliciter un service sacerdotal ou une communion cultuelle
  rationale: Le contexte peut suggérer une fonction sacerdotale, mais ce verset l’exprime par des images qu’il convient de préserver sans résoudre leur portée.
- issue: Répartition des rôles entre « lui » et « toi »
  choice: Maintenir le contraste entre celui qui est choisi pour s’approcher et le destinataire qui sera roi
  alternative: Nommer explicitement Lévi et Juda
  rationale: Les référents sont contextuels dans le grec; les ajouter ici dépasserait la formulation du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du discours direct est fluidifiée, tandis que les images cultuelles et le contraste entre les deux personnes restent proches du grec.
