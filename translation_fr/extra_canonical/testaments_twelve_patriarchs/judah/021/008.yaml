  naturalness: Le texte est globalement naturel et de registre approprié. « Jusqu’à être élevés » est possible, mais « jusqu’à ce qu’ils soient élevés » est plus idiomatique et rend plus nettement la morphologie passive sans exclure la lecture moyenne signalée en note.
