source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ πολλῶν σάρκας ἀδίκως⁵⁵ κόρακας⁵⁵ ἐπὶ κακῷ⁶⁰ τῇ πλεονεξίᾳ ὑψούμενοι· καὶ προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ τοιούτου ἕως ὑψοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
translation:
  language: fr
  text: Et ils livreront injustement aux corbeaux[a] la chair de beaucoup de gens, s’élevant par avidité pour faire le mal. Ils progresseront dans le mal et dans une telle arrogance, jusqu’à ce qu’ils soient élevés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La première proposition grecque est grammaticalement abrupte et ne comporte pas de verbe exprimé pour l’action faite à la chair. « Ils livreront » restitue le sens probable de l’image : les corbeaux sont nourris de la chair de nombreuses victimes.'
    reason: textual_difficulty
  - marker: b
    text: 'Ou : « jusqu’à ce qu’ils s’élèvent eux-mêmes ». La forme grecque peut évoquer aussi bien l’auto-exaltation que le fait d’être élevé.'
    reason: preserved_ambiguity
lexical_decisions:
- source_word: κόρακας
  choice: aux corbeaux
  rationale: Le grec conservé nomme précisément les corbeaux, oiseaux associés ici aux cadavres; il ne contient pas le mot « ibis » présent dans la couche anglaise consultative.
- source_word: πλεονεξίᾳ
  choice: par avidité
  rationale: « Avidité » exprime le désir insatiable d’avoir davantage et convient au contexte moral, sans limiter indûment le terme à la seule cupidité financière.
- source_word: ὑπερηφανίᾳ
  choice: dans une telle arrogance
  rationale: Le terme désigne l’orgueil hautain; « arrogance » garde le lien avec le mouvement d’élévation répété dans la phrase.
- source_word: ὑψούμενοι / ὑψοῦνται
  choice: s’élevant / être élevés
  rationale: La répétition du même verbe grec est conservée autant que possible. La forme finale est passive ou moyenne et demeure volontairement ouverte.
theological_decisions:
- issue: Sens de l’élévation finale
  choice: jusqu’à être élevés
  alternative: jusqu’à s’élever eux-mêmes / jusqu’à être exaltés
  rationale: Le grec permet une lecture passive ou moyenne. La traduction conserve cette ambiguïté plutôt que de décider s’il s’agit d’auto-exaltation, de promotion ou d’un autre type d’élévation.
translation_notes:
  register: Français moderne, digne et directement intelligible. La construction difficile du grec est rendue par une légère explicitation signalée en note. L’image concrète des corbeaux et la répétition du vocabulaire de l’élévation sont préservées; « ibis » n’est pas retenu, car ce mot ne figure pas dans le texte grec fourni.
