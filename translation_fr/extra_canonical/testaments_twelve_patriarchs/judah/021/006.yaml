  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: fr
  text: 'Et tu seras parmi eux comme la mer. Car, de même qu’en elle se trouvent des justes et des injustes — les uns sont faits prisonniers, tandis que les autres s’enrichissent —, ainsi aussi, il y aura en toi des êtres humains de toute sorte : les uns courront des dangers[a] en étant faits prisonniers, tandis que les autres s’enrichiront en s’emparant des biens d’autrui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec transmis ici est incertain ; le sens « courront des dangers » repose sur une correction probable du texte.
    reason: Le manuscrit édité porte une forme signalée comme corrompue (†κωδυνεύσουσιν), probablement à comprendre comme une forme de κινδυνεύω, « être en danger ».
lexical_decisions:
- source_word: θάλασσα
  choice: la mer
  rationale: Équivalent direct qui conserve l’image centrale du texte.
- source_word: πᾶν γένος ἀνθρώπων
  choice: toute sorte d’êtres humains
  rationale: Ici, γένος désigne vraisemblablement les diverses catégories de personnes plutôt que des races au sens moderne; cette formulation naturelle évite une connotation biologique étrangère au contexte.
- source_word: αἰχμαλωτίζονται / αἰχμαλωτιζόμενοι
  choice: sont faits prisonniers
  rationale: Rend l’idée de capture sans imposer un contexte militaire plus précis que le grec.
- source_word: πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια
  choice: s’enrichiront en s’emparant des biens d’autrui
  rationale: Reproduit le lien entre enrichissement et appropriation prédatrice de ce qui appartient à d’autres.
- source_word: ἐν σοὶ
  choice: en toi
  rationale: Préserve l’adresse directe et la métaphore spatiale, sans expliciter abusivement son référent.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative et la tension morale entre captifs et personnes enrichies par la rapine sont conservées. Une légère explicitation (« se trouvent », « se trouvera ») rend en français la construction elliptique du grec sans en modifier le sens.
