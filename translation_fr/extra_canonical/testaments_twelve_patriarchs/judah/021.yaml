base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves over him, lest you be utterly destroyed. For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood. To me he gave the things on earth; to him, the things in the heavens. For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.


    For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer him the firstfruits of the delights of the sons of Israel[c]. But you shall be king of Jacob. And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.


    For the kings will be like sea-monsters, swallowing men like fish; they will enslave sons and daughters of free people, and they will seize houses, fields, flocks, and wealth. And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed. And there will be false prophets like storms[a],'
translation:
  language: fr
  text: '21 Et maintenant, mes enfants, je vous l’ordonne : aimez Lévi, afin que vous demeuriez, et ne vous élevez pas au-dessus de lui, de peur d’être entièrement détruits. 2 Car Dieu m’a donné la royauté, et à lui le sacerdoce, et il a soumis la royauté au sacerdoce. 3 À moi, il a donné ce qui est sur la terre ; à lui, ce qui est dans les cieux. 4 Car c’est ainsi que le sacerdoce de Dieu surpasse la royauté terrestre, à moins que, à cause des péchés, il ne tombe loin du Seigneur et ne tombe sous la domination de la royauté terrestre.


    5 En effet, l’ange du Seigneur m’a dit : « Le Seigneur l’a choisi plutôt que toi, pour s’approcher de lui, manger à sa table et lui offrir les prémices des délices des fils d’Israël[a]. Mais toi, tu seras roi de Jacob. » 6 Tu seras parmi eux comme la mer. Car, de même que dans la mer il y a des justes et des injustes, les uns étant emmenés captifs et les autres s’enrichissant, de même, en toi, il y aura des gens de toute sorte : les uns seront en péril, emmenés captifs, tandis que les autres s’enrichiront en s’emparant des biens d’autrui[b].


    7 Car ceux qui régneront seront comme des monstres marins : ils engloutiront les êtres humains comme des poissons ; ils réduiront en esclavage les fils et les filles de personnes libres, et s’empareront de maisons, de champs, de troupeaux et de richesses. 8 Ils livreront injustement aux corbeaux la chair d’un grand nombre[c] ; ils se grandiront dans leur avidité pour le mal, et progresseront dans le mal et dans l’orgueil jusqu’à s’élever toujours davantage. 9 Les faux prophètes seront comme des tempêtes, et ils persécuteront tous les justes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « prémices des délices des fils d’Israël » désignent vraisemblablement les meilleurs produits, offerts comme prémices par les Israélites.
    reason: cultural_note
  - marker: b
    text: Le texte grec de la comparaison avec la mer est difficile et paraît altéré à cet endroit. La traduction suit son mouvement général sans supprimer l’opposition entre ceux qui sont emmenés captifs et ceux qui s’enrichissent aux dépens d’autrui.
    reason: textual_variant
  - marker: c
    text: 'La phrase grecque est grammaticalement incomplète ou altérée : elle mentionne « la chair d’un grand nombre », « les corbeaux », le mal et l’avidité, mais le rapport exact entre ces termes n’est pas entièrement explicite. La traduction restitue prudemment l’image de cadavres livrés aux oiseaux charognards.'
    reason: textual_variant
lexical_decisions:
- source_word: παραγγέλλω
  choice: je vous l’ordonne
  rationale: Rend la force de l’injonction testamentaire, plus contraignante qu’un simple conseil.
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: Conserve l’impératif éthique direct et le sens courant du verbe.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: ne vous élevez pas au-dessus de lui
  rationale: Préserve l’image verticale de l’arrogance dirigée contre Lévi.
- source_word: ἐξολοθρευθῆτε
  choice: être entièrement détruits
  rationale: Exprime la gravité du verbe composé sans recourir à une tournure archaïque.
- source_word: βασιλεία
  choice: royauté
  rationale: Désigne ici la fonction et l’autorité royales attribuées à Juda, plutôt qu’un territoire.
- source_word: ἱερατεία / ἱερωσύνη
  choice: sacerdoce
  rationale: Terme français usuel et digne pour la charge sacerdotale attribuée à Lévi.
- source_word: ὑπέταξε
  choice: a soumis
  rationale: Maintient explicitement la relation hiérarchique formulée par le grec.
- source_word: τὰ ἐπὶ γῆς / τὰ ἐν οὐρανοῖς
  choice: ce qui est sur la terre / ce qui est dans les cieux
  rationale: Conserve le parallélisme et l’ampleur volontairement générale des deux domaines.
- source_word: ὑπερέχει
  choice: surpasse
  rationale: Exprime naturellement la supériorité comparative du sacerdoce.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: se détourne du Seigneur
  rationale: Rend l’idée de déchéance ou d’éloignement religieux dans un français naturel, sans préciser davantage la nature de cette rupture.
- source_word: κυριευθῇ
  choice: tombe sous la domination
  rationale: Fait ressortir le renversement par lequel le sacerdoce peut devenir assujetti à la royauté terrestre.
- source_word: προσεγγίζειν
  choice: s’approcher
  rationale: Garde la valeur cultuelle de l’accès sacerdotal auprès de Dieu.
- source_word: κήτη
  choice: monstres marins
  rationale: Rend les grandes créatures de la mer évoquées par le grec et convient à l’image de l’engloutissement.
- source_word: καταιγίδες
  choice: tempêtes
  rationale: Conserve la comparaison violente et déstabilisatrice appliquée aux faux prophètes.
theological_decisions:
- issue: Rapport entre la royauté de Juda et le sacerdoce de Lévi
  choice: Dieu attribue la royauté à Juda et le sacerdoce à Lévi, puis soumet la première au second.
  alternative: Présenter les deux fonctions comme simplement coordonnées, sans subordination.
  rationale: Le verbe ὑπέταξε énonce une véritable subordination ; la traduction ne l’atténue pas.
- issue: Condition limitant la supériorité du sacerdoce
  choice: Le sacerdoce surpasse la royauté terrestre, sauf s’il se détourne du Seigneur à cause des péchés et tombe sous la domination royale.
  alternative: Faire de la royauté terrestre le sujet de la chute ou considérer toute la proposition comme intraduisible.
  rationale: Le sujet grammatical le plus proche est le sacerdoce. La formulation conserve la tension selon laquelle sa prééminence peut être perdue par le péché.
- issue: Privilège cultuel de Lévi
  choice: Lévi est choisi pour s’approcher du Seigneur, manger à sa table et offrir les prémices.
  alternative: Comprendre uniquement une communion métaphorique, sans portée sacerdotale.
  rationale: L’enchaînement des actes et le contexte du sacerdoce donnent à ces expressions une nette portée cultuelle.
- issue: Portée de l’image de la mer
  choice: Juda et sa royauté deviennent le cadre où certains subissent la captivité tandis que d’autres s’enrichissent par la spoliation.
  alternative: Appliquer l’image exclusivement aux nations en général, sans lien particulier avec Juda.
  rationale: La formule ἐν σοὶ, « en toi », rattache directement cette réalité à Juda, tout en l’étendant à toutes sortes d’êtres humains.
- issue: Objet de la persécution finale
  choice: Les faux prophètes persécutent tous les justes.
  alternative: Arrêter le texte après la comparaison avec les tempêtes.
  rationale: La source grecque fournie contient explicitement καὶ πάντας τοὺς δικαίους διώξουσιν ; la traduction inclut donc cette proposition.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement et les impératifs conservent la voix testamentaire du père s’adressant à ses enfants. Les termes « royauté » et « sacerdoce » maintiennent la distinction institutionnelle du grec. Les passages manifestement altérés aux versets 6 et 8 sont traduits avec retenue et signalés en note plutôt que reconstruits à partir de formulations absentes de la source fournie.
