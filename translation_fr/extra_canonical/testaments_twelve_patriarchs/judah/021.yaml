review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire surtout aux v. 1 et 6 : διαμείνητε exprime le fait de demeurer ou de rester, non spécifiquement de « subsister », et ἐν αὐτοῖς signifie « parmi eux » plutôt que « au milieu d’eux ». Le reste rend globalement bien la hiérarchie entre royauté et sacerdoce, le privilège cultuel de Lévi et la dénonciation des abus royaux. Au v. 8, le grec transmis demeure syntaxiquement défectueux ; une restitution imagée et explicitement prudente est justifiée.'
  naturalness: Le français est soutenu, lisible et adapté au genre testamentaire. « Afin que vous demeuriez » et « parmi eux » sont plus idiomatiques tout en étant plus proches du grec. La révision du v. 8 évite de présenter comme certaine une syntaxe que le témoin grec ne permet pas d’établir.
  terminology: « Royauté », « sacerdoce », « prémices », « Seigneur », « justes » et « faux prophètes » sont appropriés et cohérents. « De préférence à toi » au v. 5 est remplacé par « plutôt que toi », formulation plus directe pour ὑπὲρ σέ dans ce contexte électif, sans surinterpréter le comparatif.
  issues:
  - severity: low
    issue: « afin de subsister » (v. 1) restreint légèrement διαμείνητε.
    rationale: Le verbe signifie d’abord demeurer, rester ou persévérer. « Afin que vous demeuriez » conserve l’ouverture du grec.
  - severity: low
    issue: « au milieu d’eux » (v. 6) est moins exact que « parmi eux ».
    rationale: ἐν αὐτοῖς indique que Juda sera parmi eux ; il ne requiert pas l’idée spatiale plus marquée de « au milieu ».
  - severity: medium
    issue: Le v. 8 reconstruit une relation syntaxique qui reste incertaine dans le grec transmis.
    rationale: La mention de la chair de beaucoup de personnes, des corbeaux, du mal et de l’avidité est assurée, mais la construction est altérée. Le texte révisé garde l’image minimale et la note explicite cette incertitude.
