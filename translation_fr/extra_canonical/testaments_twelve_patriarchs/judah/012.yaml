    reason: lexical_uncertainty
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: elle se para comme une mariée
  rationale: Rend le jeu de mots autour de la parure et la valeur nuptiale de νυμφικός dans un français naturel et digne.
- source_word: προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην
  choice: s’asseoir pendant sept jours près de la porte
  rationale: Suit la leçon grecque fournie, qui mentionne explicitement sept jours et ne contient ici aucun terme signifiant « prostitution ».
- source_word: τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: sa beauté me trompa à cause de l’apparence que lui donnait sa parure
  rationale: Conserve à la fois la beauté, l’apparence extérieure et la parure sans produire une tournure française pesante.
- source_word: ῥάβδον μου καὶ τὸ διάδημά μου
  choice: mon bâton et mon diadème
  rationale: Traduit exactement les deux objets de la leçon source ; celle-ci ne comporte ni bague ni complément « de mon royaume ».
- source_word: συνήλθον αὐτῇ
  choice: je m’unis à elle
  rationale: Exprime sobrement l’union sexuelle indiquée par le verbe dans ce contexte.
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: s’est-elle servie envers moi des paroles prononcées auparavant
  rationale: Rend la proposition présente dans la source tout en laissant ouverte l’identité précise des « paroles antérieures ».
- source_word: τελεσικόμενον
  choice: personne ne s’était prostitué
  rationale: Le mot est rare et textuellement difficile ; le contexte de la porte et de la rencontre sexuelle favorise ce sens, signalé toutefois en note.
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: je passai soixante-treize ans en Égypte
  rationale: Idiomatisme français correspondant à « faire/passer des années » dans un lieu.
theological_decisions:
- issue: παρὰ Κυρίου ἦν au verset 6
  choice: car cela venait du Seigneur
  alternative: car cela était de la part du Seigneur
  rationale: Préserve l’attribution à la providence ou à l’action divine sans affirmer que le Seigneur approuvait moralement l’acte.
- issue: Loi des Amorites au verset 2
  choice: traduire la leçon grecque sans introduire la prostitution
  alternative: interpréter la station à la porte comme une mise à disposition sexuelle
  rationale: La source fournie parle d’une veuve assise sept jours près de la porte, mais ne comporte aucun équivalent grec de « prostitution » ; il ne faut pas importer une expansion d’un autre témoin.
- issue: Langage royal au verset 4
  choice: conserver « diadème » sans ajouter « de mon royaume »
  alternative: harmoniser avec une tradition comportant une bague et un diadème royal
  rationale: La leçon grecque transmise ici contient διάδημα, mais non βασιλεία ; la traduction respecte exactement cette tension textuelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les euphémismes sexuels bibliques sont conservés sans archaïsme excessif. La traduction suit prioritairement la colonne grecque fournie et ne réintroduit pas les expansions de la couche anglaise lorsque celles-ci sont absentes de cette source.
