  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
translation:
  language: fr
  text: '1. Après cela, Tamar, veuve depuis deux ans, apprit que je montais tondre les brebis. Elle se para d’une parure nuptiale et s’assit à Énan, dans la ville, près de la porte. 2. En effet, la loi des Amorites prescrivait à une veuve de s’asseoir pendant sept jours près de la porte. 3. Comme j’étais ivre de vin, je ne la reconnus pas, et sa beauté me trompa par l’apparence de sa parure. 4. Je me détournai vers elle et lui dis : « Je vais venir vers toi. » Elle répondit : « Que me donneras-tu ? » Je lui donnai mon bâton et mon diadème en gage.[a] Puis, lorsque je m’unis à elle, elle devint enceinte. 5. Sans savoir ce que j’avais fait, je voulus la faire mourir. Mais elle m’envoya secrètement les gages et me couvrit de honte. 6. Je la fis appeler et j’entendis aussi les paroles secrètes que j’avais prononcées pendant que je dormais avec elle dans mon ivresse.[b] Je ne pus la faire mourir, car cela venait du Seigneur.[c] 7. Je me disais en effet : « Peut-être a-t-elle agi avec ruse, après
    avoir reçu les gages d’une autre femme, et s’est-elle servie envers moi des paroles prononcées auparavant. »[d] 8. Mais je ne m’approchai plus d’elle de toute ma vie. 9. Pourtant, les habitants de la ville disaient qu’aucun acte ne s’était accompli à la porte,[e] car elle était venue d’un autre endroit et ne s’était assise que peu de temps à la porte. 10. Je pensais donc que personne ne savait que j’étais allé vers elle. 11. Après cela, nous allâmes en Égypte auprès de Joseph, à cause de la famine. 12. J’avais alors quarante-six ans, et je passai soixante-treize ans en Égypte.'
  philosophy: optimal-equivalence
  footnotes:
