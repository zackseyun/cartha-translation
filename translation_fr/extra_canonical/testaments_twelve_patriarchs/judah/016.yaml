  text: '1[a]. Guard yourselves, therefore, my children, against the limit of wine; for in it there are four evil spirits: desire, heated passion, dissipation, and shameful gain[b].


    2. If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, lest you sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.


    4. Wine also reveals the mysteries of God and of men, just as I too revealed the commandments of God and the mysteries of Jacob my father to the Canaanite woman—things that God told me not to reveal.


    5[c]. And wine becomes the cause of war and turmoil.'
translation:
  language: fr
  text: '**Testament de Juda 16**


    **1.** Gardez-vous donc, mes enfants, de dépasser la limite du vin[a] ; car il renferme quatre esprits mauvais[b] : le désir, l’ardeur brûlante, le dérèglement et la recherche d’un gain honteux.


    **2.** Si vous buvez du vin dans la joie, faites-le avec retenue, dans la crainte de Dieu[c].


    **3.** Mais si vous voulez vivre dans la maîtrise de vous-mêmes, ne touchez absolument pas au vin, de peur de pécher par des paroles insolentes, des disputes, des calomnies et des transgressions des commandements de Dieu, et de périr avant votre heure.


    **4.** Le vin révèle aussi les mystères de Dieu et des êtres humains. Ainsi, moi aussi, j’ai révélé à la Cananéenne les commandements de Dieu et les mystères de Jacob, mon père — choses que Dieu m’avait dit de ne pas révéler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire par « la mesure du vin » ou « la frontière du vin » ; elle avertit vraisemblablement de ne pas franchir la limite qui lui convient.
    reason: lexical_alternative
  - marker: b
    text: Les « esprits mauvais » peuvent désigner des vices personnifiés ou des puissances spirituelles ; le grec ne tranche pas entre ces nuances.
    reason: lexical_alternative
  - marker: c
    text: 'La construction grecque est inhabituelle : elle dit littéralement quelque chose comme « il est retenu avec la crainte de Dieu ». Le sens général paraît être un appel à boire avec retenue dans la crainte de Dieu.'
    reason: textual_difficulty
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: dépasser la limite du vin
  rationale: ὅρος désigne une limite ou une frontière. La tournure française explicite naturellement l’idée contextuelle de ne pas franchir la limite propre à l’usage du vin, tout en conservant la métaphore concrète.
- source_word: πνεύματα πονηρά
  choice: esprits mauvais
  rationale: Traduction directe qui préserve à la fois la personnification des vices et la possibilité d’une portée spirituelle réelle, sans réduire l’expression à de simples impulsions psychologiques.
- source_word: ἐπιθυμίας
  choice: le désir
  rationale: Terme volontairement large, puisque le grec ne limite pas ici le désir au domaine sexuel.
- source_word: πυρώσεως
  choice: l’ardeur brûlante
  rationale: Le choix conserve l’image d’un embrasement ou d’une excitation enflammée tout en restant intelligible dans une liste de vices.
- source_word: ἀσωτίας
  choice: le dérèglement
  rationale: Le mot évoque une conduite dissipée, prodigue et sans frein. « Dérèglement » en restitue la portée morale générale sans la réduire à la débauche sexuelle.
- source_word: αἰσχροκερδίας
  choice: la recherche d’un gain honteux
  rationale: 'La formulation rend les deux éléments du composé grec : le gain et son caractère bas ou honteux.'
- source_word: αἰδούμενος μετὰ φόβου Θεοῦ
  choice: faites-le avec retenue, dans la crainte de Dieu
  rationale: La forme grecque est grammaticalement difficile après le verbe au pluriel. Cette traduction restitue l’exhortation à une conduite réservée et respectueuse sous la crainte de Dieu sans imposer un référent incertain au participe.
- source_word: σωφρόνως ζῆσαι
  choice: vivre dans la maîtrise de vous-mêmes
  rationale: σωφρόνως exprime une vie sensée, sobre et disciplinée ; cette formulation met en avant la maîtrise de soi sans créer un simple jeu de mots avec l’abstinence.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: ne touchez absolument pas au vin
  rationale: La force absolue de μηδ᾽ ὅλως et l’image concrète de ἐφάπτεσθε sont conservées.
- source_word: λόγοις ὕβρεως
  choice: des paroles insolentes
  rationale: ὕβρις évoque une parole arrogante, outrageante ou violente ; « insolentes » maintient ce registre moral fort.
- source_word: μυστήρια
  choice: mystères
  rationale: Le terme français garde l’idée de réalités ou d’informations cachées sans préciser indûment s’il s’agit de secrets ordinaires ou sacrés.
theological_decisions:
- issue: Nature des « esprits mauvais »
  choice: Conserver littéralement le langage spirituel et laisser la liste des vices en montrer les manifestations morales.
  alternative: Traduire par « mauvaises impulsions » ou « tendances mauvaises ».
  rationale: Le grec emploie explicitement πνεύματα. Le démystifier ferait disparaître une ambiguïté théologique véritable du texte.
- issue: Portée de l’interdiction du vin au verset 3
  choice: 'Rendre l’interdiction sous sa forme absolue : « ne touchez absolument pas au vin ».'
  alternative: Comprendre seulement une mise en garde contre l’excès.
  rationale: μηδ᾽ ὅλως ... ἐφάπτεσθε formule une abstention totale dans cette exhortation. La traduction ne doit pas l’atténuer, même si le verset 2 envisage la consommation avec retenue.
- issue: Tension entre consommation mesurée au verset 2 et abstention au verset 3
  choice: Maintenir les deux exhortations sans les harmoniser.
  alternative: Faire du verset 3 une simple interdiction de l’ivresse afin de supprimer la tension.
  rationale: Le texte permet d’abord de boire avec retenue, puis conseille une abstention absolue à ceux qui veulent vivre dans la maîtrise d’eux-mêmes. Cette progression ou tension appartient au passage.
- issue: Phrases présentes dans la couche anglaise mais absentes du témoin grec fourni
  choice: Ne pas inclure la suite développée du verset 2 ni un verset 5.
  alternative: Les reprendre depuis la consultation anglaise.
  rationale: Le texte grec primaire fourni s’arrête au verset 4 et ne contient ni « alors l’ivresse suit… » ni « le vin devient cause de guerre… ». Une traduction fondée sur cette source ne doit pas les introduire.
translation_notes:
  register: Français international moderne, digne et directement intelligible. Le texte conserve les images fortes du grec (« limite du vin », « esprits mauvais », « ne touchez absolument pas ») tout en adaptant les constructions difficiles à un français naturel. Les développements absents de la source grecque fournie n’ont pas été intégrés.
