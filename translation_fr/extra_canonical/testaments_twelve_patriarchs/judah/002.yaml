  text: II. *Καὶ ἔδωκέ μοι Κύριος¹ χάριν *ἐν πᾶσι τοῖς ἔργοις μου, ἐν τε² ἀγρῷ καὶ ἐν τῷ οἴκῳ. 2. Οἶδα³ ὅτι συνέδραμον⁴ ἐλάφῳ⁵ καὶ *ἐπίασα αὐτὴν καὶ ἐποίησα αὐτὴν βρῶμα τῷ πατρί μου καὶ ἔφαγεν⁶. 3. *Τὴν δὲ δορκάδα⁷ *διὰ τοῦ δρόμου⁸ ἐκράτουν, καὶ πᾶν ὃ ἦν ἐν τοῖς πεδίοις⁹ κατελάμβανον. 4. *Τὸν λέοντα¹¹ ἀπέκτεινα¹² καὶ ἀφειλόμην¹³ ἔριφον ἐκ τοῦ στόματος αὐτοῦ¹⁴. *Τὴν¹⁵ ἄρκον λαβὼν ἀπὸ τοῦ ποδὸς ἀπέλυσα¹⁶ *τὸν κρημνόν¹⁷, *καὶ συνετρίβη¹⁸. 5. *Τῷ ἀγρίῳ χοίρῳ²⁰ κατέδραμον, *καὶ προέλαβον²¹ ἐν τῷ τρέχειν με²² καὶ²³ κατεσπάραξα αὐτόν¹⁹. 6. *Πάρδαλις ἐν Χεβρὼν προσεπήδησεν ἐπὶ τὸν κύνα²⁴, καὶ πιάσας²⁵ αὐτὴν²⁶ ἀπὸ τῆς κέρκου²⁷ ἀπηκόντισα²⁸ *αὐτὴν ἐπὶ τὴν πέτραν, καὶ ἐρράγη εἰς δύο²⁹. 7. Βοῦν ἄγριον εὗρον τὴν χώραν νεμόμενον, καὶ κρατήσας³⁰ τῶν κεράτων³¹ καὶ³² κύκλῳ³³ συσσείσας³⁴ *καὶ σκοτίσας ῥίψας³⁵ *ἀνεῖλον³⁶ αὐτόν³⁷. 8. *Καὶ λέοντα³⁸ ἡμέρωσα³⁹.
