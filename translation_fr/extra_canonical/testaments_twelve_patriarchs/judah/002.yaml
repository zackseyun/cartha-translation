  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
translation:
  language: fr
  text: 2 Le Seigneur m’accorda sa faveur dans toutes mes entreprises[a], aux champs comme à la maison. Je sais que j’ai couru aux côtés d’une biche, que je l’ai attrapée, que j’en ai fait de la nourriture pour mon père et qu’il en a mangé. Je saisissais la gazelle en pleine course, et je rattrapais tout ce qui se trouvait dans les plaines. J’ai tué le lion et arraché un chevreau à sa gueule. J’ai saisi l’ours par la patte, je l’ai précipité du haut de l’escarpement, et il s’est fracassé. J’ai poursuivi le sanglier, je l’ai rattrapé dans ma course et je l’ai déchiré. À Hébron, un léopard bondit sur le chien ; je l’ai saisi par la queue et projeté contre le rocher, et il s’est fendu en deux. J’ai trouvé un bœuf sauvage qui paissait dans la contrée ; je l’ai saisi par les cornes, l’ai fait tournoyer, aveuglé, puis jeté à terre et tué[b]. J’ai même dompté un lion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de ce chapitre est parfois abrupt et difficile, surtout dans l’enchaînement des exploits. La traduction suit la colonne grecque principale sans ajouter l’épisode d’une jument sauvage, absent de cette source.
    reason: textual_variant
  - marker: b
    text: La construction grecque de cette dernière action est heurtée. Elle enchaîne le fait de faire tournoyer le bovin, de l’aveugler, de le jeter et de le tuer.
    reason: textual_difficulty
lexical_decisions:
- source_word: χάριν
  choice: faveur
  rationale: Dans ce récit de prouesses, le mot désigne la bienveillance accordée par le Seigneur et la réussite qui en découle ; « faveur » évite de surcharger le passage d’un sens doctrinal absent du contexte.
- source_word: ἐν πᾶσι τοῖς ἔργοις μου
  choice: dans toutes mes entreprises
  rationale: « Entreprises » exprime ici les actes et activités de Juda plus naturellement que le calque « œuvres », tout en gardant la portée générale du grec.
- source_word: ἐλάφῳ
  choice: une biche
  rationale: Le pronom féminin qui suit indique un cervidé femelle ; « biche » est précis et courant.
- source_word: διὰ τοῦ δρόμου
  choice: en pleine course
  rationale: La formule décrit la gazelle saisie pendant qu’elle court ; cette tournure française conserve le mouvement sans raideur.
- source_word: ἀφειλόμην
  choice: arraché
  rationale: Le verbe signifie retirer ou enlever ; devant la gueule d’un lion, « arracher » rend la force de l’action.
- source_word: κρημνόν
  choice: escarpement
  rationale: Le terme désigne un lieu abrupt ou un précipice ; « escarpement » permet naturellement l’expression « du haut de ».
- source_word: κατεσπάραξα
  choice: j’ai déchiré
  rationale: Le composé exprime une mise en pièces violente ; « déchirer » reste direct sans ajouter de détail anatomique.
- source_word: ἐρράγη εἰς δύο
  choice: il s’est fendu en deux
  rationale: Rend littéralement la rupture de l’animal en deux parties, avec le caractère abrupt du récit.
- source_word: βοῦν ἄγριον
  choice: un bœuf sauvage
  rationale: Le grec désigne un bovin non domestiqué sans imposer ici le sexe précis qu’exprimerait « taureau ».
- source_word: κύκλῳ συσσείσας καὶ σκοτίσας
  choice: l’ai fait tournoyer jusqu’à l’étourdir
  rationale: La séquence associe un mouvement circulaire violent à l’obscurcissement ou l’étourdissement qui en résulte ; cette formulation rend le lien naturel entre les deux.
- source_word: ἡμέρωσα
  choice: j’ai même dompté
  rationale: Le verbe signifie rendre apprivoisé ou docile. « Dompter » convient à un lion et garde la concision de l’exploit.
theological_decisions:
- issue: Rôle du Seigneur dans les prouesses de Juda
  choice: Le Seigneur accorde à Juda sa faveur dans toutes ses entreprises.
  alternative: Comprendre la phrase comme une simple formule générale de bénédiction, sans lien particulier avec les exploits racontés ensuite.
  rationale: L’ouverture attribue explicitement au Seigneur la faveur dont Juda bénéficie, tandis que la suite raconte ses actions à la première personne. La traduction maintient ensemble l’action divine et l’activité humaine sans préciser davantage leur rapport.
translation_notes:
  register: 'Français international actuel, narratif et digne. Les phrases brèves et l’accumulation des verbes à la première personne conservent le rythme abrupt du catalogue d’exploits. « Le Seigneur » rend le titre divin Κύριος. La traduction suit directement le grec fourni : elle ne reprend pas l’épisode de la jument sauvage présent dans la couche anglaise, et elle rétablit la mise à mort du bœuf ainsi que le domptage final du lion.'
