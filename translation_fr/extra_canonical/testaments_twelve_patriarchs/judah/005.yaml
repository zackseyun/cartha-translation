  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
translation:
  language: fr
  text: '1. Le lendemain, nous nous rendîmes à Aréta, une ville puissante qui nous menaçait de mort. Gad et moi nous nous approchâmes de la ville du côté est, tandis que Ruben et Lévi s’en approchèrent du côté ouest.


    2. Ceux qui se tenaient sur la muraille, voyant que nous étions seuls, furent attirés vers nous.


    3. Et la muraille se souleva brusquement[a].


    4. C’est ainsi que mes frères entrèrent secrètement dans la ville par les deux côtés de la muraille.


    5. Nous prîmes la ville au fil de l’épée ; ceux qui s’étaient réfugiés dans la tour, nous les brûlâmes au feu ; et ainsi nous les capturâmes tous, ainsi que tous leurs biens.


    6. Pendant que nous repartions, des hommes de Baboué[b] s’emparèrent de nos captifs. Quand nous le vîmes, nous engageâmes le combat contre eux.


    7. Nous les tuâmes tous et reprîmes nos captifs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « Et la muraille bondit » ou « se souleva brusquement ». Le texte paraît difficile. D’autres témoins donnent un récit différent ou plus développé, selon lequel les frères escaladèrent la muraille à l’aide de pieux ou de chevilles avant d’entrer dans la ville.'
    reason: textual_variant
  - marker: b
    text: Le nom grec est incertain. Le texte suivi ici porte Baboué ; d’autres témoins présentent notamment les formes Thapphoué ou Bathoué.
    reason: textual_variant
lexical_decisions:
- source_word: πόλιν κραταιάν
  choice: une ville puissante
  rationale: Le texte grec primaire ne présente ici qu’un seul adjectif. « Puissante » conserve la force militaire de κραταιός sans importer le doublet d’autres témoins.
- source_word: προσέφθημεν
  choice: arrivâmes les premiers
  rationale: Le verbe exprime l’idée de devancer ou d’arriver avant les autres. Cette traduction convient mieux au partage tactique entre l’est et l’ouest qu’un simple « attaquâmes », qui n’est pas explicite dans cette forme grecque.
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: se laissèrent attirer vers nous
  rationale: La tournure passive indique que les défenseurs furent attirés en direction du groupe de Juda, vraisemblablement dans le cadre d’une manœuvre, sans que le texte précise davantage le stratagème.
- source_word: ἀνεπήδησεν τὸ τεῖχος
  choice: la muraille se souleva brusquement
  rationale: Le sens littéral de ἀναπηδάω est « bondir, se dresser ou se soulever brusquement ». La formulation grecque est difficile ; la traduction conserve cette étrangeté au lieu de la remplacer silencieusement par une autre tradition textuelle.
- source_word: λάθρα
  choice: secrètement
  rationale: Ce terme rend explicite le caractère furtif de l’entrée des frères dans la ville.
- source_word: ἐν στόματι μαχαίρας
  choice: au fil de l’épée
  rationale: Expression française idiomatique qui restitue l’image sémitisante de la « bouche de l’épée » et sa violence militaire.
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: ceux qui s’étaient réfugiés dans la tour
  rationale: Le singulier πύργῳ est conservé, et le composé καταφεύγω exprime une fuite vers un lieu de refuge.
- source_word: πάντας ... καὶ πάντα τὰ αὐτῶν
  choice: tous les habitants et tous leurs biens
  rationale: Le premier πάντας désigne naturellement les personnes, tandis que πάντα τὰ αὐτῶν désigne tout ce qui leur appartenait. L’explicitation française évite une phrase obscure.
- source_word: αἰχμαλωσία
  choice: captifs
  rationale: Dans ce récit, le nom collectif désigne concrètement les personnes emmenées en captivité. « Captifs » est naturel et permet de garder le même référent aux versets 6 et 7.
- source_word: συνῆψαν πόλεμον
  choice: nous engageâmes le combat
  rationale: Cette locution militaire rend l’idée de nouer ou d’engager une bataille contre les assaillants.
theological_decisions:
- issue: Formulation difficile du verset 3 et récit de l’entrée dans la ville
  choice: Conserver dans le texte « la muraille se souleva brusquement », puis traduire sobrement l’entrée secrète des frères au verset 4.
  alternative: D’autres formes du récit parlent de frères escaladant la muraille au moyen de pieux ou de chevilles, sans contenir la proposition étrange sur la muraille qui se soulève.
  rationale: La colonne grecque primaire fournie porte explicitement ἀνεπήδησεν τὸ τεῖχος. Même si cette leçon est difficile ou possiblement altérée, elle ne doit pas être corrigée silencieusement à partir de la couche anglaise ou d’une autre recension. Une note signale donc l’incertitude textuelle.
- issue: Identité du groupe nommé au verset 6
  choice: Transcrire le nom de la leçon primaire sous la forme « Baboué ».
  alternative: D’autres témoins ou recensions donnent des formes telles que Thapphoué ou Bathoué.
  rationale: Le nom propre est textuellement instable et son identification reste incertaine. La traduction suit la forme grecque fournie tout en signalant les variantes, sans identifier arbitrairement le lieu ou le peuple.
- issue: Étendue de la violence finale
  choice: Traduire seulement « Nous les tuâmes tous et reprîmes nos captifs ».
  alternative: Une forme plus longue du récit ajoute l’incendie d’une ville et de tout ce qu’elle contenait.
  rationale: Ces détails supplémentaires ne figurent pas dans le texte grec primaire fourni. Ils ne sont donc pas introduits dans le corps de la traduction.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le ton historique sans archaïsmes excessifs. La traduction suit prioritairement la colonne grecque fournie, y compris ses leçons difficiles, et ne reprend pas les développements de la version anglaise lorsqu’ils sont absents de cette source.
