  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: fr
  text: Comme nous arrivions à la ville[a], leurs femmes faisaient rouler des pierres sur nous depuis le sommet de la montagne sur laquelle se trouvait la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte source porte τῇ τῇ πόλει, avec un redoublement manifestement accidentel de l’article au datif. La traduction lit simplement τῇ πόλει, « à la ville ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐκύλιον
  choice: faisaient rouler
  rationale: L’imparfait exprime une action en cours ou répétée; « faisaient rouler » indique aussi que les femmes mettaient délibérément les pierres en mouvement.
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: des pierres sur nous
  rationale: λίθους désigne des pierres, et ἐπί avec l’accusatif marque ici leur mouvement hostile en direction du groupe; le relief et la provenance précisés ensuite rendent clair le mouvement descendant.
- source_word: ἀπὸ τῆς κορυφῆς τοῦ ὄρους
  choice: depuis le sommet de la montagne
  rationale: κορυφή désigne le point culminant, tandis que ὄρος désigne une montagne ou une hauteur; cette formulation conserve précisément la position dominante.
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: sur laquelle la ville était bâtie
  rationale: La relative situe la ville sur la montagne. « était bâtie » rend naturellement en français la présence durable de la ville sur cette hauteur sans ajouter l’idée plus spécifique d’une forteresse.
