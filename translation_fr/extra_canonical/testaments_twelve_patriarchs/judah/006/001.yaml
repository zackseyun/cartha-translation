translation_notes:
  register: Français moderne, clair et digne. Les toponymes sont translittérés sous les formes «Chozéba» et «Jobel». La syntaxe conserve le lien circonstanciel entre la présence de Juda près des eaux et l'arrivée hostile du groupe.
