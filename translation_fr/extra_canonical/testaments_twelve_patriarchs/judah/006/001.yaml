  text: And as I was by the waters of Chozeba, those from Jobel came against us for battle.
translation:
  language: fr
  text: Et tandis que je me trouvais près des eaux de Chozéba, les gens de Jobel vinrent nous attaquer pour nous faire la guerre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤμην
  choice: tandis que je me trouvais
  rationale: Rend naturellement la proposition temporelle ou circonstancielle grecque sans la réduire à un simple événement ponctuel.
- source_word: ἐν τοῖς ὕδασι Χωζηβά
  choice: près des eaux de Chozéba
  rationale: Dans ce contexte géographique, ἐν peut indiquer la présence au bord ou aux environs des eaux; «près de» est idiomatique en français et évite de suggérer que Juda se trouvait immergé.
- source_word: οἱ ἀπὸ Ἰωβὴλ
  choice: les gens de Jobel
  rationale: Exprime clairement l'origine géographique du groupe tout en conservant Jobel comme nom propre.
- source_word: ἦλθον ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: vinrent nous attaquer pour nous faire la guerre
  rationale: Restitue le mouvement hostile de ἐπί avec l'intention guerrière exprimée par εἰς πόλεμον dans un français naturel.
