  text: Καὶ ὡς ἤμην ἐν τοῖς ὕδασι Χωζηβά¹, οἱ ἀπὸ †Ἰωβὴλ² ἦλθον ἐφ᾽³ ἡμᾶς εἰς πόλεμον.
