- from: Après avoir caché Siméon et les autres[a] derrière eux[b], nous nous sommes emparés de la hauteur et avons entièrement détruit cette ville aussi.
  to: Après avoir dissimulé Siméon et les autres[a] à l’arrière[b], nous nous sommes emparés de la hauteur et nous avons entièrement détruit cette ville aussi.
  rationale: La révision supprime un pronom français dont l’antécédent immédiat déforme la relation spatiale, tout en maintenant l’ambiguïté du grec quant au repère de l’action. Les notes sont ajustées afin de signaler le caractère elliptique du texte sans transformer une inférence contextuelle en donnée explicite.
