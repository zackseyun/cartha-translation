  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: fr
  text: Après avoir dissimulé Siméon et les autres[a] à l’arrière[b], nous nous sommes emparés de la hauteur et nous avons entièrement détruit cette ville aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque τὸν τε καὶ Συμεών est elliptique et difficile ; elle associe Siméon à une autre personne ou à un groupe qui n’est pas nommé explicitement. La traduction « Siméon et les autres » rend cette association sans en préciser les membres.
    reason: lexical_note
  - marker: b
    text: Le rare adverbe grec ἐξωπίσθεν signifie « par-derrière » ou « depuis l’arrière ». Le grec ne précise pas ici le repère ; dans le contexte, il peut évoquer une manœuvre sur les arrières des adversaires.
    reason: cultural_note
lexical_decisions:
- source_word: ὑποκρύψας
  choice: après avoir caché
  rationale: Le participe aoriste exprime une action tactique accomplie avant l’action principale. « Après avoir caché » est naturel en français et conserve l’idée d’une dissimulation délibérée.
- source_word: τὸν τε καὶ Συμεὼν
  choice: Siméon et les autres
  rationale: La formulation grecque est elliptique et associe Siméon à une autre personne ou à un groupe non nommé. Cette traduction rend l’ellipse intelligible sans identifier davantage les compagnons.
- source_word: ἐξωπίσθεν
  choice: derrière eux
  rationale: Cet adverbe rare indique une position ou une action par-derrière. Le pronom renvoie naturellement aux adversaires dans le contexte tactique, tout en laissant la note préciser la valeur du terme.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: nous nous sommes emparés de la hauteur
  rationale: ἐπιλαμβάνομαι avec le génitif signifie prendre ou saisir, et τὸ ὑψηλόν substantivé désigne la hauteur ou le terrain élevé. La formulation française convient au contexte militaire.
- source_word: ἐξωλοθρεύσαμεν
  choice: avons entièrement détruit
  rationale: Le composé intensif exprime une destruction complète. « Entièrement détruit » préserve cette force sans recourir à un terme plus interprétatif comme « exterminé ».
- source_word: καὶ ταύτην τὴν πόλιν
  choice: cette ville aussi
  rationale: « Aussi » conserve la valeur additive de καί et présente cette ville comme une conquête supplémentaire dans la série.
