  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: fr
  text: Mais ceux de Makir nous attaquèrent de nouveau le cinquième jour. En nous lançant contre eux avec une épée puissante[a], nous eûmes le dessus sur eux et les tuâmes avant qu’ils ne puissent gravir la montée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec προσδίδωσι, à la troisième personne du singulier au présent, s’accorde mal avec le récit à la première personne du pluriel et au passé. Il peut s’agir d’une formulation abrégée ou d’une altération de copie. La traduction restitue le sens apparent d’un engagement offensif contre l’ennemi, sans modifier le texte grec.
    reason: textual_variant
  - marker: b
    text: L’expression grecque signifie littéralement « avant de monter la montée ». Elle peut désigner une pente, un passage montant ou un accès fortifié que les ennemis cherchaient à atteindre ou à gravir.
    reason: lexical_note
lexical_decisions:
- source_word: ἐπῆλθον ἡμῶν
  choice: nous attaquèrent
  rationale: Avec un complément de personne au génitif, ἐπέρχομαι exprime ici une venue hostile. « Nous attaquèrent » restitue clairement la force militaire de l’expression.
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe indique que l’assaut se répète. « De nouveau » est naturel en français narratif.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: avec une épée puissante
  rationale: κραταιός signifie « fort, puissant » et μάχαιρα « épée ». La préposition ἐν a ici une valeur instrumentale; la formulation conserve le relief martial de l’original.
- source_word: περιγινόμεθα αὐτῶν
  choice: nous eûmes le dessus sur eux
  rationale: περιγίγνομαι suivi du génitif signifie prendre l’avantage ou l’emporter sur quelqu’un. Cette tournure française est précise et naturelle dans un récit de combat.
- source_word: ἀναβῆναι τὴν ἀνάβασιν
  choice: gravissent la montée
  rationale: La construction associe le verbe « monter » à un nom apparenté désignant une montée, une pente ou un accès. La traduction maintient cette répétition sémantique sans devenir artificielle.
