base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/002.yaml
  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: fr
  text: Puis, ayant engagé le combat, nous les avons mis en fuite. Nous avons tué leurs alliés venus de Silo et ne leur avons laissé aucun passage pour parvenir jusqu’à nous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucune voie pour entrer chez nous »; le grec indique un passage permettant de parvenir jusqu’à eux, plutôt qu’une voie de fuite.'
    reason: Le texte anglais de consultation interprète διέξοδον comme une voie d’évasion, mais le complément grec τοῦ εἰσελθεῖν πρὸς ἡμᾶς signifie «pour entrer/venir vers nous». La note signale l’ambiguïté de la scène sans substituer l’interprétation anglaise au grec.
lexical_decisions:
- source_word: συνάψαντες
  choice: ayant engagé le combat
  rationale: Le verbe employé absolument dans ce contexte militaire signifie que les deux camps en viennent aux prises; cette formulation française restitue naturellement le participe circonstanciel.
- source_word: ἐτρέψαμεν
  choice: nous les avons mis en fuite
  rationale: Dans l’usage militaire, τρέπω désigne la mise en déroute de l’adversaire; «mettre en fuite» demeure clair et précis.
- source_word: τοὺς ἀπὸ Σιλὼμ συμμάχους αὐτῶν
  choice: leurs alliés venus de Silo
  rationale: La construction désigne les alliés originaires de Silo. «Silo» est la forme française traditionnelle et courante du toponyme biblique.
- source_word: διέξοδον
  choice: aucun passage
  rationale: Le terme désigne une voie permettant de traverser ou d’atteindre un lieu. Le complément qui suit rend ici «passage» plus fidèle que «moyen de s’échapper».
- source_word: τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: pour parvenir jusqu’à nous
  rationale: Le grec exprime littéralement le fait d’entrer ou d’avancer vers les locuteurs, non une fuite. Cette traduction préserve cette orientation spatiale.
theological_decisions: []
