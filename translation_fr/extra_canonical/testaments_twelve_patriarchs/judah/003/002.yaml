  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/002.yaml
  text: And the other king, Taphou, while he was sitting on the horse, I killed; and so I scattered all his people.
translation:
  language: fr
  text: Quant à l’autre roi, Taphou, je le tuai alors qu’il était assis sur le cheval ; et ainsi, je dispersai tout son peuple.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν δὲ ἕτερον βασιλέα
  choice: Quant à l’autre roi
  rationale: La tournure détachée rend naturellement en français l’objet antéposé en grec et la particule δέ, sans alourdir la phrase.
- source_word: τὸν Ταφούα
  choice: Taphou
  rationale: Translittération française simple du nom grec Ταφούα, en accord avec la forme fournie par la couche de consultation.
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  choice: alors qu’il était assis sur le cheval
  rationale: Rend le participe circonstanciel et conserve l’article défini grec sans introduire le possessif « son », absent du texte source.
- source_word: ἀνεῖλον
  choice: je le tuai
  rationale: Le verbe αἱρέω à l’aoriste second avec ἀνά a ici le sens de tuer ou supprimer ; « tuai » est direct et naturel.
- source_word: διεσκόρπισα
  choice: je dispersai
  rationale: Correspond précisément à l’idée de mettre en fuite et de disséminer le peuple du roi.
