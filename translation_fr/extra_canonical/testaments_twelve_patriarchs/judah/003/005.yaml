  text: '*Ἐν δὲ²⁸ τῷ ἐκδύειν²⁹ με³⁰ τὸν θώρακα αὐτοῦ³¹, ἰδού, ἄνδρες ὀκτὼ³², ἑταῖροι³³ αὐτοῦ³⁴, *ἤρξαντο πολεμεῖν με³⁵.'
