  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/005.yaml
  text: And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.
translation:
  language: fr
  text: Pendant que je lui retirais sa cuirasse, voici que huit hommes, ses compagnons, se mirent à me combattre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἐκδύειν με τὸν θώρακα αὐτοῦ
  choice: Pendant que je lui retirais sa cuirasse
  rationale: La construction ἐν τῷ avec l’infinitif exprime ici la simultanéité. ἐκδύειν avec l’objet θώρακα signifie retirer ou dépouiller quelqu’un de sa cuirasse; la formulation française conserve clairement le possesseur et l’action.
- source_word: ἰδού
  choice: voici que
  rationale: Conserve l’effet narratif de brusque apparition ou de retournement marqué par l’impératif grec.
- source_word: ἄνδρες ὀκτώ, ἑταῖροι αὐτοῦ
  choice: huit hommes, ses compagnons
  rationale: Traduction directe qui maintient l’apposition grecque et identifie leur lien avec l’homme dépouillé.
- source_word: ἤρξαντο πολεμεῖν με
  choice: se mirent à me combattre
  rationale: Rend explicitement l’aspect inchoatif de ἤρξαντο et le sens martial de πολεμεῖν sans exagérer la nature précise de l’affrontement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « voici que » préserve la vivacité biblique du grec tout en restant compréhensible; aucune note n’est nécessaire.
