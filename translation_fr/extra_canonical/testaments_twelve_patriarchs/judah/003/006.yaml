  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/006.yaml
  text: But I wrapped my garment around my arm and slung four stones at them; from behind and in front around the waist of one seated on a horse, I picked up a stone of sixty litras and hurled it, struck the horse, and killed it. And I fought King Nahor for about two hours, and after smashing the shield into pieces, I cut off his feet, and so I killed him.
translation:
  language: fr
  text: Mais moi, j’enroulai mon vêtement autour de mon bras et leur lançai des pierres avec ma fronde. J’en tuai quatre, et les autres prirent la fuite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνελύθην … τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  choice: j’enroulai mon vêtement autour de mon bras
  rationale: La tournure grecque décrit le vêtement enveloppé autour de la χείρ, terme qui peut désigner la main ou, plus largement, le bras. « Autour de mon bras » est naturel en français dans ce contexte d’affrontement.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: leur lançai des pierres avec ma fronde
  rationale: Le verbe renvoie à l’action de lancer au moyen d’une fronde; cette formulation explicite naturellement l’instrument sans alourdir la phrase.
- source_word: τέσσαρας ἐξ αὐτῶν ἀνεῖλον
  choice: J’en tuai quatre
  rationale: ἀναιρέω signifie ici mettre à mort; τέσσαρας porte sur quatre individus parmi les adversaires, non sur quatre pierres.
- source_word: οἱ δὲ λοιποὶ ἔφυγον
  choice: et les autres prirent la fuite
  rationale: Rend clairement l’opposition entre les quatre tués et ceux qui restaient, dans un registre narratif digne et courant.
