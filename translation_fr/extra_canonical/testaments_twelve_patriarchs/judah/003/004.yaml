  text: And after fighting with Achor for two hours, I killed him; and splitting his shield into two pieces, I chopped off his feet.
translation:
  language: fr
  text: Après avoir combattu Akor† pendant deux heures, je le tuai ; puis, ayant fendu son bouclier en deux, je lui coupai les pieds.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀχὼρ
  choice: Akhor
  rationale: Translittération française du nom propre grec, avec « kh » pour rendre le χ.
- source_word: ἐπὶ ὥρας δύο
  choice: pendant deux heures
  rationale: Rend naturellement en français la durée indiquée par la préposition ἐπί avec l’accusatif.
- source_word: συνέκοψα τοὺς πόδας αὐτοῦ
  choice: je lui tranchai les pieds
  rationale: Le verbe συγκόπτω exprime ici une action violente de taille ou de mutilation ; « trancher » conserve cette force sans ajouter un détail anatomique absent du grec.
