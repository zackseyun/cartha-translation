  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: fr
  text: Je trouvai aussi le roi Achor, un géant, qui, à cheval, tirait des flèches devant lui et derrière lui. Je pris une pierre de soixante litras[a], la lançai sur le cheval et le tuai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « litra » est une ancienne unité de poids; sa valeur exacte peut varier selon le lieu et l’époque.
    reason: Évite de confondre cette unité de masse avec le litre moderne de volume et de proposer une conversion faussement précise.
  - marker: b
    text: 'Ou : « et tuai Achor ». Le pronom grec peut renvoyer soit au cheval, soit à Achor.'
    reason: Le texte grec laisse incertain le référent de αὐτόν; la traduction principale suit l’antécédent grammatical le plus proche sans supprimer l’autre lecture possible.
lexical_decisions:
- source_word: τὸν Ἀχὼρ βασιλέα γίγαντα
  choice: le roi Achor, un géant
  rationale: Respecte les titres et appositions du grec sans adopter la tournure moins naturelle « un homme géant ».
- source_word: βάλλοντα τόξα
  choice: tirait des flèches
  rationale: Le grec dit littéralement « lançant/tirant des arcs », tournure où « arcs » désigne naturellement les projectiles tirés à l’arc.
- source_word: ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: à cheval, ... devant lui et derrière lui
  rationale: Conserve les deux directions de tir et rattache explicitement ἐφ᾽ ἵππου à la position d’Achor.
- source_word: ἀνελάμενος λίθον
  choice: Je ramassai une pierre
  rationale: ἀναλαμβάνω exprime ici le fait de prendre ou soulever la pierre; « ramasser » est naturel dans le contexte.
- source_word: ἑξήκοντα λιτρῶν
  choice: de soixante litres
  rationale: Translittère l’unité ancienne λίτρα plutôt que de la convertir de manière incertaine en unité moderne.
- source_word: δέδωκα τῷ ἵππῳ
  choice: la lançai sur le cheval
  rationale: La leçon transmise signifie littéralement « je [la] donnai au cheval »; en contexte, elle décrit le coup porté avec la pierre.
- source_word: ἀπέκτεινα αὐτόν
  choice: le tuai
  rationale: Préserve le pronom masculin singulier et son ambiguïté référentielle, bien que le cheval soit l’antécédent grammatical immédiat.
