  verdict: revise
  source_fidelity: La version rétablit justement « roi », « géant », la position à cheval et les tirs dans les deux directions, absents de l’anglais de contrôle. Toutefois, « soixante litres » emploie une unité moderne de volume là où λίτρα désigne une unité ancienne de poids. « Je ramassai » est possible, mais « je pris » rend plus sobrement ἀνελάμενος sans ajouter l’idée que la pierre se trouvait au sol. La note finale préserve utilement l’ambiguïté de αὐτόν.
  naturalness: Le français est globalement naturel et narratif. « Litras » est préférable à « litres » afin d’éviter la confusion immédiate avec le litre moderne; la note peut alors expliquer qu’il s’agit d’une unité de poids.
  terminology: « roi Achor, un géant » est fidèle et idiomatique. « Tirait des flèches devant lui et derrière lui, à cheval » rend de façon claire l’action et les compléments grecs. La translittération « litras » maintient le terme de mesure sans conversion spéculative.
