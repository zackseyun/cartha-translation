source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ὅτε δὲ¹ *ἦλθον² οἱ δύο βασιλεῖς τῶν Χαναναίων τεθωρακισμένοι³ ἐπὶ τὰ *ποίμνια ἡμῶν⁴ καὶ λαὸς πολὺς⁵ *μετ᾽ αὐτῶν⁶, *κἀγὼ μόνος⁷ δραμὼν ἐπὶ τὸν βασιλέα⁸ †τὸν ἕνα⁹ καὶ κατεσπάραξα τὰ ὀστᾶ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/001.yaml
  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: fr
  text: Lorsque les deux rois des Cananéens vinrent en armes attaquer nos troupeaux, accompagnés d’une foule nombreuse, je courus seul contre l’un des rois et lui broyai les os.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: en armes
  rationale: Le participe signifie littéralement « revêtus d’une cuirasse ». « En armes » exprime naturellement en français leur équipement guerrier sans limiter indûment celui-ci à une cuirasse précise.
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  choice: attaquer nos troupeaux
  rationale: Avec un verbe de mouvement, ἐπί suivi de l’accusatif marque ici un mouvement hostile dirigé contre les troupeaux.
- source_word: λαὸς πολύς μετ᾽ αὐτῶν
  choice: accompagnés d’une foule nombreuse
  rationale: Restitue idiomatiquement la présence d’un grand nombre de gens avec les deux rois.
- source_word: κἀγὼ μόνος δραμών
  choice: je courus seul
  rationale: Conserve l’accent du grec sur l’action solitaire de Juda et la valeur circonstancielle du participe aoriste.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: lui broyai les os
  rationale: Le verbe transmis κατεσπάραξα évoque une action violente de déchirer ou mettre en pièces, et son complément explicite est « ses os ». Cette traduction suit le texte grec fourni plutôt que la formulation anglaise, qui suppose une autre lecture ou reconstruction.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve l’intensité guerrière et la concision du grec. Le texte grec fourni ne mentionne explicitement ni les tibias, ni le fait de renverser le roi, ni sa mort; ces éléments de la couche anglaise n’ont donc pas été importés.
