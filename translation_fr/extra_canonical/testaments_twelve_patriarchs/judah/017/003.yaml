id: T12P.JUD.17.3
reference: Testament of Judah 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὅτι καὶ¹⁶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν¹⁷ Ἰούδα σμικρυνθῆναι ποιήσουσιν¹⁸, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: fr
  text: Car ils pervertiront même des hommes sages parmi mes fils et feront décliner le royaume de Juda, que le Seigneur m’a donné en raison de mon obéissance à mon père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοιώσουσι
  choice: ils pervertiront
  rationale: Le verbe signifie littéralement « changer, altérer ». Appliqué à des hommes sages dans ce contexte négatif, « pervertir » exprime naturellement en français leur corruption morale ou leur détournement.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: feront décliner
  rationale: Cette construction causative signifie « feront devenir plus petit » ou « feront diminuer ». Pour un royaume, « feront décliner » rend clairement l’affaiblissement de sa puissance ou de son étendue.
- source_word: ἐν ὑπακοῇ
  choice: en raison de mon obéissance
  rationale: La préposition ἐν peut ici marquer la circonstance ou le fondement associé au don. Cette formulation française restitue le lien entre l’obéissance de Juda et le royaume reçu sans alourdir la phrase.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Le nom Κύριος figure explicitement dans le texte grec fourni et doit donc être traduit, malgré son omission dans la dernière révision anglaise.
- source_word: πατρός μου
  choice: mon père
  rationale: Le grec dit seulement « mon père » et ne donne pas ici le nom de Jacob; la traduction n’ajoute donc pas ce nom.
theological_decisions:
- issue: Auteur du don du royaume
  choice: « le Seigneur m’a donné »
  alternative: « il m’a donné »
  rationale: Le texte grec contient explicitement Κύριος. Employer seulement un pronom effacerait une identification présente dans la source.
- issue: Lien entre l’obéissance et le don
  choice: « en raison de mon obéissance »
  alternative: « dans mon obéissance »
  rationale: La formulation retenue indique le rapport exprimé par ἐν ὑπακοῇ tout en restant intelligible, sans développer davantage la nature théologique de ce rapport.
translation_notes:
  register: Français international moderne, digne et lisible. La coordination et le futur prophétique du grec sont conservés. Aucun nom propre absent du grec, tel que « Jacob », n’est ajouté.
