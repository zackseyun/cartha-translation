  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: fr
  text: 'Et maintenant, je vous ordonne, mes enfants : n’aimez pas l’argent et ne fixez pas votre regard sur la beauté des femmes ; car moi aussi, à cause de l’or et de la beauté, j’ai été entraîné vers Bésoué, la Cananéenne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: je vous donne cet ordre
  rationale: Rend clairement l’idée d’un commandement solennel adressé aux enfants, dans un français naturel.
- source_word: ἀργύριον
  choice: l’argent
  rationale: Le terme désigne littéralement l’argent comme métal et, par extension, la richesse; « l’argent » conserve ce double sens en français.
- source_word: ἐπιβλέπειν εἰς κάλλος γυναικῶν
  choice: vous laisser attirer par la beauté des femmes
  rationale: L’expression signifie porter un regard attentif ou convoiteur sur cette beauté; cette formulation naturelle en restitue l’avertissement moral sans le réduire au simple fait de regarder.
- source_word: ἐπλανήθην
  choice: je me suis égaré
  rationale: Préserve l’idée d’avoir été détourné du bon chemin sans préciser davantage la nature de l’égarement.
- source_word: εἰς Βησουὲ τὴν Χαναναίαν
  choice: auprès de Bésoué, la Cananéenne
  rationale: La préposition εἰς marque ici la direction ou le mouvement vers la personne; « auprès de » évite la tournure française maladroite « vers Bésoué » tout en maintenant le lien causal de l’égarement.
theological_decisions:
- issue: Nature de l’avertissement concernant la beauté des femmes
  choice: Ne pas se laisser attirer par leur beauté
  alternative: Ne pas poser son regard sur leur beauté
  rationale: Le grec peut évoquer le regard porté sur la beauté, mais le contexte d’égarement lui donne une portée morale. La traduction exprime cette portée sans condamner la simple perception visuelle.
- issue: Agent ou caractère de l’égarement
  choice: 'Forme pronominale : « je me suis égaré »'
  alternative: 'Passif : « j’ai été égaré » ou « j’ai été entraîné dans l’égarement »'
  rationale: Le passif grec ne nomme aucun agent. La formulation française choisie conserve cette indétermination et évite d’attribuer explicitement la faute à Bésoué.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme entre « l’argent » et « l’or », ainsi qu’entre la beauté en général et l’expérience personnelle de Juda, est conservé. Le nom propre est translittéré « Bésoué » d’après la forme grecque Βησουέ.
