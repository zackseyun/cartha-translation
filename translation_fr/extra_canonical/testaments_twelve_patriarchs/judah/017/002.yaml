review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : οἶδα (« je sais »), διὰ τὰ δύο ταῦτα (« à cause de ces deux choses »), τὸ γένος μου (« ma descendance ») et l''orientation funeste de ἔσται εἰς ἀπώλειαν sont conservés. Toutefois, le génitif πορνείας après ἀπώλειαν est syntaxiquement concis et son lien exact avec « destruction » n''est pas explicitement défini. Le rendre sans note par « par l’immoralité sexuelle » impose une lecture causale/instrumentale.'
  naturalness: La phrase est globalement naturelle et garde un registre prophétique sobre. « Vouée à la perdition par l’immoralité sexuelle » est cependant légèrement lourd et « par » peut faire entendre un moyen plus nettement que ne le fait le grec. « Une destruction liée à l’immoralité sexuelle » est fluide en français moderne tout en évitant de surdéterminer le génitif.
  terminology: « Descendance » convient à γένος dans ce contexte lignager. « Immoralité sexuelle » est un rendu moderne, suffisamment large et non confessionnel de πορνεία. « Destruction » rend directement ἀπώλεια et s'aligne sur l'audit anglais; il évite de charger le texte d'associations théologiques que « perdition » peut susciter.
  issues:
  - severity: medium
    issue: Le lien entre ἀπώλειαν et πορνείας est rendu de façon trop déterminée par « par l’immoralité sexuelle ».
    rationale: Le grec permet vraisemblablement une destruction causée par l’immoralité sexuelle, mais le génitif peut aussi caractériser la destruction plus largement. Une formulation relationnelle, accompagnée d'une note brève, conserve cette ambiguïté sans altérer le sens.
  revised_text: Et je sais que, à cause de ces deux choses, ma descendance sera vouée à une destruction liée à l’immoralité sexuelle¹.
  revised_footnotes:
  - marker: '1'
    text: Le grec dit littéralement « pour une destruction d’immoralité sexuelle ». Le génitif peut désigner une destruction causée par l’immoralité sexuelle ou une destruction caractérisée par elle; le texte ne précise pas davantage le lien.
    reason: Préserver l’ambiguïté syntaxique de πορνείας tout en maintenant une formulation française naturelle.
  revision_rationale: La révision remplace « perdition par » par « une destruction liée à » afin de rendre plus directement ἀπώλεια, d'améliorer la fluidité et de ne pas fixer sans réserve la valeur du génitif πορνείας. La note documente l'ambiguïté pertinente sans introduire d'interprétation doctrinale.
