revisions:
- from: Et je sais qu’à cause de ces deux choses, ma descendance sera vouée à la perdition par l’immoralité sexuelle.
  to: Et je sais que, à cause de ces deux choses, ma descendance sera vouée à une destruction liée à l’immoralité sexuelle¹.
  rationale: La révision remplace « perdition par » par « une destruction liée à » afin de rendre plus directement ἀπώλεια, d'améliorer la fluidité et de ne pas fixer sans réserve la valeur du génitif πορνείας. La note documente l'ambiguïté pertinente sans introduire d'interprétation doctrinale.
