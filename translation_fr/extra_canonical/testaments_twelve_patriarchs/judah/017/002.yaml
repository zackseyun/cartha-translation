source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα¹² ὅτι διὰ τὰ δύο ταῦτα ἔσται¹³ τὸ γένος μου¹⁴ *εἰς ἀπώλειαν πορνείας¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/002.yaml
  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: fr
  text: Et je sais que, à cause de ces deux choses, ma descendance sera vouée à une destruction liée à l’immoralité sexuelle¹.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: je sais
  rationale: Rend directement le parfait à valeur présente, qui exprime ici un savoir assuré.
- source_word: διὰ τὰ δύο ταῦτα
  choice: à cause de ces deux choses
  rationale: Avec l’accusatif, διά exprime la cause; «ces deux choses» conserve la référence contextuelle sans l’expliciter.
- source_word: τὸ γένος μου
  choice: ma descendance
  rationale: Dans ce contexte familial et prophétique, γένος désigne la lignée issue de Juda plutôt que le seul groupe ethnique contemporain.
- source_word: εἰς ἀπώλειαν
  choice: sera vouée à la perdition
  rationale: Cette formulation française naturelle conserve l’idée d’une orientation vers la ruine portée par la construction ἔσται εἰς, sans ajouter explicitement le moyen de sa réalisation.
- source_word: πορνείας
  choice: par l’immoralité sexuelle
  rationale: «Immoralité sexuelle» rend largement πορνεία dans un français moderne; «par» exprime le rapport probable de cause ou d’agent du génitif tout en évitant l’expression peu naturelle «la perdition de l’immoralité sexuelle».
theological_decisions:
- issue: Rapport entre ἀπώλεια et πορνεία
  choice: la perdition causée ou entraînée par l’immoralité sexuelle
  alternative: «la perdition de l’immoralité sexuelle», avec un génitif laissé formellement indéterminé
  rationale: Le génitif πορνείας peut être compris comme caractérisant la perdition ou comme indiquant sa cause. Le français exige ici un lien plus explicite; «par» retient la lecture causale la plus probable sans préciser une doctrine particulière du jugement.
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve le ton prophétique et solennel de l’original; «perdition» est retenu plutôt que le plus courant «destruction» afin d’exprimer une ruine grave sans suggérer uniquement une destruction matérielle.
