    3. Le lendemain, nous sommes allés à Aréta, une ville puissamment fortifiée qui nous menaçait de mort. Gad et moi avons atteint les premiers le côté est de la ville, tandis que Ruben et Lévi ont atteint le côté ouest. C’est ainsi que nous avons libéré les captifs.'
  to: '**Testament de Juda 4**


    1. Après cela, nous avons dû mener une guerre au sud, liée à celle de Sichem[a]. Je me suis rangé en ordre de bataille avec mes frères ; nous avons poursuivi mille hommes et nous en avons tué deux cents, ainsi que quatre rois.


    2. Je suis monté sur la muraille et j’ai tué leur roi[b] ; puis nous avons pris tous les captifs.


    3. Le lendemain, nous sommes allés à Aréta, une ville forte qui nous menaçait de mort. Gad et moi avons attaqué du côté est de la ville, tandis que Ruben et Lévi ont attaqué du côté ouest. C’est ainsi que nous avons libéré les captifs.'
  rationale: 'Révision limitée aux formulations qui ajoutaient un sens non assuré par le grec : Sichem n’est plus présenté comme le peuple ennemi, προσέφθημεν est rendu dans son contexte d’assaut, et κραταιά demeure non spécifiquement militaire. La division en trois unités, Aréta et le contenu bref du grec fourni sont maintenus, plutôt que la version anglaise divergente.'
