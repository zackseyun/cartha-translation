- from: '**Testament de Juda 4**


    1. Après cela, nous avons dû mener, au sud, une guerre[a] contre les gens de Sichem. Je me suis rangé en ordre de bataille avec mes frères ; nous avons poursuivi mille hommes, en avons tué deux cents, ainsi que quatre rois.


