  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004.yaml
  text: '1. And after this there came to us a greater war toward the south than the one at Shechem; and when I had drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.

    2. And I went up upon the wall and killed their king.

    3. And so we set Hebron free and took all the captives.

    4. But the rest fled.

    5. Then my father Jacob killed Belisath, king of all the kings, a man giant in strength, twelve cubits high.

    6. And terror fell upon them, and they stopped making war against us.

    7. Therefore my father was without anxiety in the wars while I was with my brothers.

    8. For he saw in a vision concerning me that an angel of power went along with me in all things, so that no one might touch me.'
translation:
  language: fr
  text: '**Testament de Juda 4**


    1. Après cela, nous avons dû mener une guerre au sud, liée à celle de Sichem[a]. Je me suis rangé en ordre de bataille avec mes frères ; nous avons poursuivi mille hommes et nous en avons tué deux cents, ainsi que quatre rois.


    2. Je suis monté sur la muraille et j’ai tué leur roi[b] ; puis nous avons pris tous les captifs.


    3. Le lendemain, nous sommes allés à Aréta, une ville forte qui nous menaçait de mort. Gad et moi avons attaqué du côté est de la ville, tandis que Ruben et Lévi ont attaqué du côté ouest. C’est ainsi que nous avons libéré les captifs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque est elliptique. Littéralement : « une guerre au sud, de celle à Sichem ». Elle peut désigner une guerre au sud en rapport avec celle qui eut lieu à Sichem ; certains témoins ou traductions comprennent un comparatif (« plus grande que celle de Sichem »), mais le mot « plus grande » ne figure pas dans le texte grec fourni.'
    reason: Préserver l’ambiguïté syntaxique sans introduire un adversaire (« les gens de Sichem ») ou le comparatif absent du texte fourni.
  - marker: b
    text: Les mots « leur roi » sont signalés comme textuellement incertains dans l’édition grecque.
    reason: Rendre visible l’obèle placé par l’édition devant τὸν βασιλέα αὐτῶν.
lexical_decisions:
- source_word: κατὰ νότον
  choice: au sud
  rationale: Rend directement l’orientation géographique sans ajouter le comparatif « plus grande », absent du texte grec fourni.
- source_word: τοῦ ἐν Σικίμοις
  choice: contre les gens de Sichem
  rationale: Le grec est elliptique et signifie littéralement « de celle/celui à Sichem ». Dans le contexte d’une guerre, cette formulation française exprime naturellement l’adversaire associé à Sichem, tout en signalant l’ellipse en note.
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: tous les captifs
  rationale: Le nom abstrait peut désigner collectivement les personnes emmenées en captivité ; « tous les captifs » est idiomatique et convient à la reprise de τὴν αἰχμαλωσίαν au verset 3.
- source_word: πόλιν κραταιάν
  choice: une ville puissamment fortifiée
  rationale: κραταιός indique ici la puissance ou la solidité de la ville ; dans un récit de siège, « puissamment fortifiée » transmet clairement la valeur contextuelle.
- source_word: προσέφθημεν
  choice: avons atteint les premiers
  rationale: Le verbe exprime l’idée de devancer ou d’arriver avant les autres ; cette traduction conserve la priorité temporelle.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως / ἀπὸ δυσμῶν
  choice: le côté est de la ville / le côté ouest
  rationale: Les expressions indiquent les directions depuis lesquelles les deux groupes abordent la ville ; cette formulation est naturelle en français.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: nous avons libéré les captifs
  rationale: La traduction explicite en français le sens collectif de « captivité » comme groupe de prisonniers délivrés.
theological_decisions:
- issue: Rapport entre la guerre au sud et Sichem
  choice: contre les gens de Sichem
  alternative: une guerre au sud, plus grande que celle de Sichem
  rationale: Le texte grec fourni ne contient aucun adjectif comparatif correspondant à « plus grande ». L’ellipse permet plusieurs analyses ; le texte principal suit la relation adversative la plus immédiatement intelligible et la note conserve l’ambiguïté.
- issue: Identification de la ville au verset 3
  choice: Aréta
  alternative: Hébron
  rationale: Le grec fourni lit explicitement Ἀρετάν. La leçon « Hébron » de la couche anglaise n’est donc pas importée dans la traduction française.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent des formes françaises transparentes : Juda, Sichem, Aréta, Gad, Ruben et Lévi. La numérotation suit les trois unités du texte grec fourni, plutôt que les huit versets de la couche anglaise, dont le contenu diverge après le début du chapitre.'
