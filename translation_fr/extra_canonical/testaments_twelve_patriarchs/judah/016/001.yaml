base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: fr
  text: 'Gardez-vous donc, mes enfants, de la limite en matière de vin, car le vin contient quatre esprits mauvais : le désir, l’embrasement, la débauche et l’avidité sordide.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε … τὸν ὅρον τοῦ οἴνου
  choice: Respectez … la limite en matière de vin
  rationale: Le moyen impératif de φυλάσσω peut appeler à veiller sur une limite ou à l’observer. Cette formulation française exprime naturellement l’idée de ne pas dépasser la mesure concernant le vin, sans remplacer l’image grecque de la limite.
- source_word: ἐπιθυμίας
  choice: le désir
  rationale: Rend directement le nom grec, sans préciser indûment la nature du désir.
- source_word: πυρώσεως
  choice: l’embrasement
  rationale: Conserve l’image de feu et l’intensification évoquée par le grec, tout en laissant ouverte la nature exacte de cet embrasement.
- source_word: ἀσωτίας
  choice: la débauche
  rationale: Exprime ici la conduite dissolue et sans retenue, sens bien attesté du terme.
- source_word: αἰσχροκερδίας
  choice: la cupidité sordide
  rationale: Réunit l’idée de recherche intéressée du gain et son caractère honteux ou vil.
theological_decisions:
- issue: Nature des « quatre esprits mauvais »
  choice: Conserver l’expression littérale « quatre esprits mauvais »
  alternative: Interpréter « esprits » comme de simples dispositions ou effets moraux
  rationale: Le texte personnifie ou présente ces réalités comme des esprits; la traduction ne tranche pas si cette désignation est littérale, rhétorique ou morale.
- issue: Référent de ἐν αὐτῷ
  choice: Employer « en lui », avec « vin » comme antécédent grammatical naturel
  alternative: Expliciter « dans le vin » ou rattacher le pronom à la limite
  rationale: Le masculin singulier grec renvoie naturellement au vin. Le pronom français préserve toutefois la forme du texte sans lourde explicitation.
translation_notes:
  register: Français international moderne, digne et accessible. L’image de la « limite » est maintenue malgré son caractère légèrement marqué; la liste conserve sa forme nominale et sa tension morale.
