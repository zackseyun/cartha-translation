  source_fidelity: Le grec dit littéralement que « le vin devient cause de guerre et de trouble/tumulte ». Le rendu proposé est fidèle dans l’ensemble. Toutefois, l’article défini grec ὁ οἶνος est mieux rendu en français générique par « le vin », et l’absence d’article devant αἴτιος favorise « cause » plutôt que « une cause ».
  naturalness: « Et le vin devient cause de guerre et de trouble » est concis, naturel dans un registre proverbial et fidèle à la formulation grecque. « Trouble » au singulier convient, mais « tumulte » rend plus directement ταραχή dans ce parallélisme avec « guerre ».
  terminology: « Guerre » rend πόλεμος avec exactitude. « Tumulte » rend ταραχή sans réduire le terme à un trouble intérieur ni l’élargir en une interprétation sociale déterminée. Aucun terme théologique ni nom propre n’est en jeu.
  issues:
