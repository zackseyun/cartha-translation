  - severity: low
    issue: « trouble » est possible, mais moins précis ici que « tumulte »
    rationale: ταραχή désigne une agitation, un désordre ou un tumulte ; avec πόλεμος, « tumulte » conserve mieux la dimension publique et concrète sans surinterprétation.
