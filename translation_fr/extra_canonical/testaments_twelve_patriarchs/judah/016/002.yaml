  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/002.yaml
  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: fr
  text: Si vous buvez du vin dans la joie, soyez réservés dans la crainte de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis est grammaticalement irrégulier : après « vous buvez » au pluriel, il porte littéralement « il est, se montrant réservé / honteux », au singulier. La traduction suit le sens exhortatif probable : « soyez réservés ».'
    reason: Signaler la discordance de nombre et la portée sémantique du participe grec, sans introduire une reconstruction textuelle comme certaine.
lexical_decisions:
- source_word: οἶνον
  choice: du vin
  rationale: Équivalent direct et naturel du grec, sans atténuer ni préciser davantage la boisson.
- source_word: ἐν εὐφροσύνῃ
  choice: dans la joie
  rationale: Rend le cadre festif et joyeux exprimé par εὐφροσύνη tout en conservant la tournure prépositionnelle du grec.
- source_word: αἰδούμενος
  choice: gardez de la retenue
  rationale: Le participe évoque la réserve, la pudeur ou le respect. « Gardez de la retenue » exprime naturellement en français l'exhortation comprise dans le contexte, sans réduire le terme à la seule modestie.
- source_word: μετὰ φόβου Θεοῦ
  choice: avec la crainte de Dieu
  rationale: Conserve l'expression théologique traditionnelle et la relation d'accompagnement marquée par μετά.
theological_decisions:
- issue: Rapport entre la consommation de vin et la crainte de Dieu
  choice: Le texte permet le vin dans la joie tout en exigeant la retenue liée à la crainte de Dieu.
  alternative: Comprendre le passage comme une interdiction générale du vin ou comme une approbation sans réserve.
  rationale: La proposition conditionnelle mentionne explicitement la consommation de vin, tandis que l'exhortation porte sur la retenue; aucune interdiction absolue ni approbation illimitée ne doit être importée.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement pluriel rend πίνητε. Seule la phrase attestée dans la source grecque fournie est traduite; la phrase supplémentaire de la couche anglaise n'a pas été ajoutée, faute de texte source correspondant.
