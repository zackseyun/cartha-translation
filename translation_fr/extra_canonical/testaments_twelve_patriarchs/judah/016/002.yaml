  - severity: low
    issue: La note décrit αἰδούμενος comme « ayant de la retenue », ce qui est une paraphrase plutôt qu'un littéral.
    rationale: Le participe moyen évoque plus précisément le fait d'éprouver ou de manifester réserve, pudeur ou honte. La note peut présenter cette plage sémantique et l'anomalie de nombre sans surinterpréter.
