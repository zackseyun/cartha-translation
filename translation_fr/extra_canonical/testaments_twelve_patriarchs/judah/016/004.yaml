  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/004.yaml
  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: fr
  text: Le vin révèle aussi les mystères de Dieu et des humains, tout comme moi aussi, j’ai révélé à la Cananéenne les commandements de Dieu et les mystères de Jacob, mon père — des choses que Dieu m’avait dit de ne pas révéler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: aussi
  rationale: Rend la valeur additive et légèrement emphatique de la particule sans alourdir la phrase française.
- source_word: μυστήρια
  choice: mystères
  rationale: Conserve le terme religieux et le possible sens de réalités ou secrets cachés, sans réduire celui-ci à de simples « secrets ».
- source_word: ἀνθρώπων
  choice: des humains
  rationale: Exprime le pluriel générique de manière inclusive et naturelle en français international moderne.
- source_word: τῇ Χαναναίτιδι
  choice: à la Cananéenne
  rationale: Le substantif féminin désigne une femme cananéenne; la majuscule convient ici à l’appellation ethnique substantivée.
- source_word: ἐντολὰς
  choice: commandements
  rationale: Correspond au sens normatif du grec dans un contexte religieux.
- source_word: ἃ μοι εἶπεν ὁ Θεὸς μὴ ἀποκαλῦψαι
  choice: des choses que Dieu m’avait dit de ne pas révéler
  rationale: Le plus-que-parfait explicite naturellement en français l’antériorité de l’interdiction divine par rapport à la révélation faite à la Cananéenne.
theological_decisions:
- issue: Nature des « mystères de Dieu et des humains »
  choice: Maintenir « mystères » sans préciser s’il s’agit de desseins divins, de secrets ou de réalités cachées.
  alternative: Traduire par « secrets de Dieu et des hommes ».
  rationale: Le grec μυστήρια conserve une portée religieuse et une ambiguïté que « secrets » restreindrait.
- issue: Rapport entre Dieu et les éléments révélés
  choice: Conserver la coordination « les commandements de Dieu et les mystères de Jacob » telle qu’elle apparaît dans le grec.
  alternative: Reformuler de façon à attribuer explicitement tous les mystères à Dieu ou tous les éléments à Jacob.
  rationale: La syntaxe distingue les commandements liés à Dieu des mystères liés à Jacob; il ne faut pas harmoniser théologiquement cette tension.
translation_notes:
  register: Français moderne, digne et accessible. Deux phrases évitent une période trop lourde, tandis que « Ainsi, moi aussi » rend la comparaison ὡς κἀγώ. Le tiret met en relief la relative finale qui précise le caractère interdit des révélations.
