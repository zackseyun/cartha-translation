source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: fr
  text: Mais si vous voulez vivre avec maîtrise de soi, ne touchez absolument pas au vin, afin de ne pas pécher par des paroles insolentes, des querelles, des calomnies et des transgressions des commandements de Dieu, et de ne pas périr avant votre temps.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφρόνως
  choice: dans la maîtrise de vous-mêmes
  rationale: Rend l’idée d’une vie sobre, sensée et disciplinée dans un français naturel, tout en conservant ici la dimension de maîtrise de soi liée au contexte du vin.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: ne touchez absolument pas au vin
  rationale: 'Reproduit directement l’interdiction emphatique : ne pas même entrer en contact avec le vin, au sens de s’en abstenir entièrement.'
- source_word: λόγοις ὕβρεως
  choice: des paroles insolentes
  rationale: ὕβρις désigne une insolence outrageante ou arrogante ; « paroles insolentes » reste clair et proche du grec.
- source_word: μάχαις
  choice: des querelles
  rationale: Dans cette liste de fautes favorisées par le vin, le terme évoque des disputes ou affrontements ; « querelles » convient au registre sans imposer nécessairement des combats physiques.
- source_word: συκοφαντίαις
  choice: des calomnies
  rationale: Rend l’accusation mensongère et malveillante exprimée par le terme grec.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: avant votre temps
  rationale: Expression française naturelle pour une mort qui survient hors du temps attendu ou assigné.
theological_decisions:
- issue: Portée de l’interdiction concernant le vin
  choice: Formuler une abstention totale sans l’ériger en doctrine universelle extérieure au verset
  alternative: Atténuer en « ne buvez pas trop de vin »
  rationale: Le grec μηδ᾽ ὅλως… ἐφάπτεσθε est catégorique dans cette exhortation précise ; la traduction doit en préserver la force.
- issue: Relation syntaxique entre les péchés énumérés et la mort prématurée
  choice: Conserver une seule chaîne finale sous « afin de ne pas »
  alternative: Séparer la mort prématurée en une affirmation indépendante
  rationale: Le grec coordonne ἁμαρτήσητε et ἀπολεῖσθε dans la même construction finale, ce que la formulation française maintient.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La formulation conserve l’exhortation solennelle et l’enchaînement du grec sans ajouter « boire », absent du texte grec fourni malgré sa présence dans la couche anglaise révisée.
