  source_fidelity: Les versets 1–4 rendent fidèlement les images et la progression du grec. Au verset 5, la traduction conserve avec justesse l'énoncé généralisant du témoin et signale la syntaxe difficile. Toutefois, « le peu de soutien que lui laisse sa pauvreté » ajoute une relation (« que lui laisse ») qui n'est pas exprimée par le grec, où le soutien est directement qualifié comme le très faible soutien « de sa pauvreté ».
  naturalness: Le français est moderne, clair et d'un registre approprié. « Consommé ni vin ni viande » est idiomatique et rend naturellement la coordination grecque. La légère révision au verset 5 rendra le dernier membre à la fois plus exact et plus concis.
  terminology: « Inconduite sexuelle », « dépouillé », « royauté », « esclave », « diadème », « repentir » et « soutien » sont cohérents avec le grec et avec le registre visé. Les notes préservent correctement l'incertitude syntaxique du verset 5 sans reconstruire le texte de manière excessive.
