  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
translation:
  language: fr
  text: '1. Celui qui se livre à l’inconduite sexuelle ne se rend pas compte qu’il est dépouillé, et il n’a pas honte d’être déshonoré. 2. En effet, même si quelqu’un est roi, s’il se livre à l’inconduite sexuelle, il est dépouillé de sa royauté, devenu esclave de cette inconduite, comme cela m’est arrivé à moi aussi. 3. Car j’ai donné mon bâton — c’est-à-dire le soutien de ma tribu —, ma ceinture — c’est-à-dire ma force —, et mon diadème — c’est-à-dire la gloire de ma royauté. 4. Pourtant, après m’être repenti de ces actes, je n’ai consommé ni vin ni viande jusqu’à ma vieillesse, et je n’ai connu aucune joie. 5. L’ange de Dieu m’a montré que les femmes prennent le dessus sur le roi et dominent le pauvre[a] : au roi, elles enlèvent sa gloire ; à l’homme, sa force ; et au pauvre, le très faible soutien de sa pauvreté[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de cette phrase est heurté. Il associe explicitement le roi et le pauvre à deux verbes de maîtrise ou de domination ; la traduction en conserve le parallélisme sans ajouter l’idée de « toujours ».
    reason: textual_difficulty
  - marker: b
    text: 'La fin du verset peut aussi être comprise en deux groupes seulement : « au roi, elles enlèvent la gloire de l’homme, sa force ; et au pauvre, le très faible soutien de sa pauvreté ». La ponctuation et les rapports syntaxiques du grec sont incertains.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: se livrer à l’inconduite sexuelle / cette inconduite
  rationale: « Inconduite sexuelle » exprime clairement la portée morale de la famille de πορνεία sans employer le terme aujourd’hui plus étroit « fornication ». La répétition française maintient le lien lexical du grec.
- source_word: γυμνούμενος / γυμνοῦται τῆς βασιλείας
  choice: être dépouillé / être dépouillé de sa royauté
  rationale: Le choix conserve l’image répétée du dénuement dans les versets 1 et 2. « Royauté » désigne ici la dignité et la condition personnelles du roi, plutôt que son territoire.
- source_word: δουλεύσας
  choice: devenu esclave de
  rationale: Cette formulation garde l’image forte de l’asservissement à l’inconduite, sans l’atténuer en simple dépendance.
- source_word: ῥάβδον
  choice: bâton
  rationale: « Bâton » convient au sens concret et à la glose immédiate « soutien de ma tribu » ; « sceptre » rendrait l’objet exclusivement royal.
- source_word: στήριγμα
  choice: soutien
  rationale: Le terme maintient la métaphore d’un appui, aussi bien au verset 3 qu’au verset 5.
- source_word: ζώνην
  choice: ceinture
  rationale: Terme moderne et direct, qui laisse à l’explication symbolique « ma force » toute sa portée.
- source_word: διάδημα
  choice: diadème
  rationale: Le mot français correspond précisément à l’insigne royal grec et préserve la série des trois objets symboliques.
- source_word: μετανοήσας
  choice: après m’être repenti
  rationale: Dans ce contexte de faute reconnue, suivie d’une longue abstinence, le participe porte naturellement un sens pénitentiel et non celui d’un simple changement d’avis.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: je n’ai consommé ni vin ni viande
  rationale: Le grec coordonne vin et viande sous le verbe « manger ». « Consommer » rend naturellement en français l’interdiction portant sur les deux.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: je n’ai connu aucune joie
  rationale: L’expression idiomatique française conserve la négation totale et traduit naturellement le grec littéral « je n’ai vu aucune joie ».
- source_word: κρατοῦσι / κατακυριεύουσιν
  choice: prennent le dessus sur / dominent
  rationale: Les deux verbes grecs de maîtrise sont distingués, tout en gardant leur progression vers une domination appuyée.
- source_word: ἐλάχιστον στήριγμα
  choice: le peu de soutien
  rationale: Cette expression rend l’idée du soutien minime qui reste au pauvre sans produire une tournure française artificielle.
theological_decisions:
- issue: Portée de μετανοήσας dans l’autodescription de Juda
  choice: après m’être repenti
  alternative: après avoir changé d’attitude à ce sujet
  rationale: La faute sexuelle, la remise des insignes et l’abstinence prolongée donnent au changement une dimension morale et pénitentielle. Le français « se repentir » convient ici sans imposer une construction doctrinale supplémentaire.
- issue: Caractère généralisant de l’avertissement au sujet des femmes
  choice: conserver l’énoncé comme un avertissement attribué à l’expérience et à la révélation rapportées par Juda
  alternative: neutraliser ou universaliser l’affirmation en parlant de la séduction en général
  rationale: Le texte grec nomme explicitement « les femmes ». La traduction ne corrige pas cette formulation ancienne, mais ne lui ajoute pas non plus une portée doctrinale universelle absente du passage.
- issue: Répartition des pertes au verset 5
  choice: 'trois groupes parallèles : le roi perd sa gloire, l’homme sa force, le pauvre son faible soutien'
  alternative: rattacher « l’homme » au roi et ne présenter que deux groupes
  rationale: La succession des génitifs et accusatifs soutient une structure ternaire, bien que la syntaxe transmise soit heurtée. Une note signale honnêtement l’incertitude.
translation_notes:
  register: Français international moderne, digne et direct. Les répétitions structurantes du grec — inconduite, dépouillement, soutien — sont maintenues. La formulation évite les archaïsmes (« fornication », « girdle »-équivalent) tout en conservant les images royales et l’intensité morale du passage.
