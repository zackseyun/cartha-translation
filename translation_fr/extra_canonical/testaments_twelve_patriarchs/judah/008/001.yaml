  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/001.yaml
  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: fr
  text: Pendant que j’étais là, Barsaba, le roi d’Adoullam, nous reçut et organisa pour nous un festin de boisson. Puis, après m’avoir pressé, il me donna pour femme sa fille, nommée Shoua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  choice: Pendant que j’étais là
  rationale: La tournure grecque est textuellement difficile, mais indique dans le contexte que Juda se trouvait auprès de la personne ou dans le lieu précédemment mentionné. Cette formulation naturelle conserve le sens temporel retenu sans alourdir le français.
- source_word: Βαρσαβὰ ... βασιλεὺς Ὀδολλὰμ
  choice: Barsaba, le roi d’Adoullam
  rationale: Respecte l’apposition et l’ordre du grec; les noms propres sont translittérés sous une forme adaptée au français.
- source_word: ἐποίησεν ἡμῖν πότον
  choice: organisa pour nous un banquet où l’on but
  rationale: πότος désigne une occasion festive centrée sur la boisson. « Banquet où l’on but » est intelligible et évite le calque peu naturel « festin de boisson ».
- source_word: παρακαλέσας
  choice: après m’avoir pressé d’accepter
  rationale: Le participe peut exprimer exhortation, invitation insistante ou persuasion. Le complément « d’accepter » reste contextuel mais prudent, sans préciser davantage ce que le grec laisse implicite.
- source_word: εἰς γυναῖκα
  choice: pour femme
  rationale: Expression française naturelle correspondant directement à la formule matrimoniale grecque.
- source_word: ὀνόματι Σαβά
  choice: nommée Shoua
  rationale: Rend simplement la formule « du nom de ». « Shoua » suit une translittération française reconnaissable du nom biblique, malgré la forme grecque Σαβά.
