  source_fidelity: 'Le sens général est bien rendu : Barsaba, roi d’Adoullam, reçoit Juda et ses compagnons, prépare une occasion de boisson, puis donne sa fille à Juda comme épouse après l’avoir exhorté/persuadé. Toutefois, « d’accepter » introduit un complément absent du grec et réduit indûment l’ambiguïté de παρακαλέσας.'
