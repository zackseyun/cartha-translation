source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: fr
  text: 'Tel est l’ivrogne, mes enfants : celui qui est ivre ne respecte personne. Car voici, l’ivresse m’a moi aussi égaré, jusqu’à ne pas avoir honte devant la foule de la ville : sous les yeux de tous, je me suis tourné vers Tamar, j’ai commis un grand péché et j’ai dévoilé le voile de l’impureté de mes fils[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le voile de l’impureté de mes fils ». Le sens précis de cette expression est incertain.'
    reason: Le grec τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου est obscur. La traduction conserve son image et son ambiguïté sans imposer une explication.
lexical_decisions:
- source_word: πάροινος
  choice: l’ivrogne
  rationale: Le terme désigne une personne adonnée au vin ou portée à l’ivresse ; « ivrogne » est direct, naturel et cohérent avec le participe qui suit.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: ne respecte personne
  rationale: αἰδέομαι associe retenue, respect et honte devant autrui. Ici, « respecter » exprime naturellement l’absence de considération provoquée par l’ivresse.
- source_word: ἐπλάνησεν
  choice: m’a égaré
  rationale: Le verbe signifie faire errer ou entraîner dans l’erreur. Le sujet implicite est rendu par « l’ivresse », repris du contexte immédiat, sans ajouter le commandement de Dieu absent du grec fourni.
- source_word: ἐξέκλινα πρὸς τὴν Θαμὰρ
  choice: je me suis détourné vers Tamar
  rationale: Traduction proche de l’expression grecque, qui présente l’acte comme une déviation en direction de Tamar. La formulation conserve une certaine retenue là où le texte ne dit pas explicitement « entrer chez » ou « coucher avec ».
- source_word: τὸ κάλυμμα ἀκαθαρσίας
  choice: la honte
  rationale: L’expression littérale, « le voile/la couverture d’impureté », est difficile et possiblement textuellement instable. « La honte » restitue ici l’idée d’une indignité sexuelle dévoilée, avec une note signalant le grec.
theological_decisions:
- issue: Mention d’un commandement de Dieu
  choice: Ne pas l’inclure
  alternative: « elle m’a aussi fait transgresser le commandement de Dieu »
  rationale: Cette proposition figure dans l’anglais de consultation, mais pas dans le texte grec fourni. La traduction privilégie l’attestation de la source originale.
- issue: Répétition de l’union avec Tamar dans l’anglais
  choice: Suivre la seule formulation grecque attestée
  alternative: Répéter à la fin « puisque je suis allé vers Tamar »
  rationale: La répétition finale de l’anglais n’a pas de correspondant dans le grec cité ; elle n’est donc pas importée.
- issue: Portée de l’impureté concernant les fils
  choice: Conserver l’énoncé énigmatique « de mes fils »
  alternative: Expliciter une conséquence généalogique ou sexuelle précise
  rationale: Le grec relie explicitement l’impureté ou la honte aux fils de Juda, sans expliquer précisément le rapport. La traduction préserve cette tension au lieu de la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse « mes enfants » et l’impératif « Voyez » gardent le ton d’exhortation testamentaire. Le texte suit le grec fourni plutôt que les expansions de la couche anglaise.
