    text: 'Littéralement : « le voile de l’impureté de mes fils ». Le sens précis de cette expression est incertain.'
    reason: Le grec τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου est obscur. La traduction conserve son image et son ambiguïté sans imposer une explication.
  revision_rationale: La révision conserve la fidélité du projet au texte grec attesté, en écartant les ajouts présents dans l’anglais de consultation. Elle remplace l’interprétation « honte » par la formulation grecque difficile, signalée en note, et ajuste légèrement l’expression relative à Tamar pour un français moderne plus naturel sans expliciter l’acte au-delà du grec.
