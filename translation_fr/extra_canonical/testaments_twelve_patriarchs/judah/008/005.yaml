  source_fidelity: 'Le projet suit correctement le grec transmis et résiste à juste titre aux ajouts de la piste anglaise (« ayant appris que je montais », remariage et prostitution). Toutefois, νόμος se rend plus fidèlement par « loi » que par « coutume » dans cette formulation explicite. La révision rend aussi plus directement la localisation : dans la ville, près de la porte.'
  naturalness: Le français est naturel, clair et de registre moderne soutenu. « Parure nuptiale » est légèrement plus proche de l’expression grecque tout en restant idiomatique. « Qu’une veuve s’assoie » convient à la construction après « c’était une loi ».
  terminology: Énan doit être conservé dans le texte, puisque c’est la forme du toponyme donnée par le grec. « Veuve » rend χηρεύουσαν sans harmoniser artificiellement la tension avec la parure nuptiale. Aucun terme théologique confessionnel n’est en jeu.
