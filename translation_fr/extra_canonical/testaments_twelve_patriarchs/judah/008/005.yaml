  - severity: low
    issue: La formulation de lieu peut être rapprochée de l’ordre du grec.
    rationale: Le grec situe d’abord la femme « dans la ville d’Énan », puis « près de la porte ». La formulation révisée conserve ces deux repères sans suggérer que le nom de la ville qualifie nécessairement la porte.
