revisions:
- from: Parée d’une tenue nuptiale, elle s’assit près de la porte de la ville d’Énan.[a] En effet, la coutume des Amorites voulait qu’une veuve s’assoie pendant sept jours près de la porte.[b]
  to: Parée d’une parure nuptiale, elle s’assit dans la ville d’Énan, près de la porte.[a] Car c’était une loi chez les Amorites qu’une veuve s’assoie pendant sept jours près de la porte.[b]
  rationale: 'La révision remplace « coutume » par « loi » pour rendre νόμος sans affaiblissement, et réorganise légèrement le premier repère spatial pour refléter le grec. Elle maintient les choix essentiels du projet : Énan, « veuve », l’acte de s’asseoir, et l’absence de toute mention non attestée de prostitution ou de la proposition circonstancielle ajoutée par l’anglais.'
