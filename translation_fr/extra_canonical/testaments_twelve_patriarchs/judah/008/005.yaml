base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: fr
  text: Parée d’une parure nuptiale, elle s’assit dans la ville d’Énan, près de la porte.[a] Car c’était une loi chez les Amorites qu’une veuve s’assoie pendant sept jours près de la porte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec de la ville est Énan; il correspond peut-être à Énaïm dans la tradition biblique.
    reason: Signaler sobrement l’incertitude toponymique sans substituer une identification au nom effectivement transmis.
  - marker: b
    text: Le grec dit littéralement qu’« une veuve » devait « s’asseoir » ou « prendre place » pendant sept jours près de la porte. Il ne mentionne pas explicitement la prostitution.
    reason: La version anglaise consultée interprète la scène comme une pratique liée au remariage et à la prostitution, mais ces précisions ne figurent pas dans le grec fourni.
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: Parée d’une tenue nuptiale
  rationale: Rend l’image concrète d’une femme qui s’est ornée d’une parure de noces, dans un français naturel et digne.
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: près de la porte de la ville d’Énan
  rationale: Conserve le toponyme attesté par le grec et traduit πρὸς τὴν πύλην sans préciser indûment si elle se trouvait juste devant ou à côté de la porte.
- source_word: Νόμος
  choice: coutume
  rationale: Dans ce contexte ethnographique, νόμος désigne vraisemblablement un usage établi plutôt qu’une loi écrite; « coutume » est idiomatique en français.
- source_word: τὴν χηρεύουσαν
  choice: une veuve
  rationale: Le grec désigne une femme en état de veuvage. Il ne signifie pas, dans la forme transmise, « celle qui allait se marier ».
- source_word: προκαθεσθαι
  choice: s’assoie
  rationale: Le verbe indique qu’elle devait prendre place ou rester assise en public; la formulation française évite d’ajouter une activité sexuelle absente du texte grec fourni.
theological_decisions:
- issue: La version anglaise ajoute l’idée de prostitution (« in fornication »).
  choice: Ne pas introduire la prostitution dans le corps du texte.
  alternative: « se livre à la prostitution pendant sept jours près de la porte »
  rationale: Le grec transmis dit seulement προκαθεσθαι, « s’asseoir/prendre place devant ou publiquement ». Ajouter la prostitution résoudrait le récit à partir du contexte plutôt que de traduire les mots attestés.
- issue: La version anglaise comprend χηρεύουσαν comme une femme sur le point de se marier.
  choice: Traduire par « une veuve ».
  alternative: « celle qui allait se marier »
  rationale: χηρεύουσαν se rapporte normalement au veuvage. La tension avec la « tenue nuptiale » est maintenue au lieu d’être harmonisée.
- issue: La version anglaise contient une proposition circonstancielle absente de l’extrait grec fourni (« ayant appris que je montais »).
  choice: Ne pas l’intégrer au texte français.
  alternative: « Ayant appris que je montais, elle… »
  rationale: La traduction est fondée sur le témoignage grec cité, qui commence par κοσμηθεῖσα. Une proposition non présente dans la source fournie ne doit pas être réintroduite à partir de la seule couche anglaise.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La phrase conserve la tension du grec entre la tenue nuptiale et le statut de veuve, tout en évitant les ajouts interprétatifs de la couche anglaise.
