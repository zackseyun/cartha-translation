revisions:
- from: Je sais que, à cause de ces deux choses, ma lignée ira à sa perte par l’immoralité sexuelle.[a] Elles détourneront même des hommes sages parmi mes fils et feront décliner le royaume de Juda, que le Seigneur m’a donné en raison de mon obéissance à mon père.
  to: Je sais que, à cause de ces deux choses, ma descendance ira à la perdition de l’immoralité sexuelle[a] ; elles altéreront même des hommes sages parmi mes fils et feront diminuer le royaume de Juda, que le Seigneur m’a donné dans mon obéissance à mon père.
  rationale: La révision conserve le renvoi contextuel non explicité aux « deux choses », rend ἀλλοιώσουσι sans restreindre son sens à un égarement moral, et garde une note pour la syntaxe condensée de εἰς ἀπώλειαν πορνείας. « Dans mon obéissance à mon père » reflète plus littéralement ἐν ὑπακοῇ πατρός μου tout en restant naturel dans le registre testamentaire.
