    issue: Rendu de ἀλλοιώσουσι
    rationale: « détourneront » interprète l’altération comme un égarement moral. Le grec dit plus largement « changer/altérer »; une traduction non interprétative est préférable.
  - severity: low
    issue: Lien syntaxique de « ces deux choses »
    rationale: Le français actuel sépare les deux effets en faisant de « Elles » un sujet très explicite après une première formulation causale. Une coordination des conséquences reflète plus naturellement la construction grecque.
