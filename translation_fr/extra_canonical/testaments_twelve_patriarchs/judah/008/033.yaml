id: T12P.JUD.8.33
reference: Testament of Judah 8:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: fr
  text: Je sais que, à cause de ces deux choses, ma descendance ira à la perdition de l’immoralité sexuelle[a] ; elles altéreront même des hommes sages parmi mes fils et feront diminuer le royaume de Juda, que le Seigneur m’a donné dans mon obéissance à mon père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est condensé et le groupe peut aussi se comprendre comme « ira vers une perdition liée à l’immoralité sexuelle » ou « vers la perdition de l’immoralité sexuelle ».
    reason: Préserver l’ambiguïté du génitif πορνείας dans εἰς ἀπώλειαν πορνείας sans imposer une analyse unique.
lexical_decisions:
- source_word: διὰ τὰ δύο ταῦτα
  choice: à cause de ces deux choses
  rationale: Conserve le renvoi contextuel aux deux dangers précédemment évoqués, sans les expliciter dans le verset lorsque le grec ne le fait pas.
- source_word: τὸ γένος μου
  choice: ma lignée
  rationale: Rend naturellement l’idée de descendance ou de peuple issu de Juda.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: ira à sa perte par l’immoralité sexuelle
  rationale: Reproduit le mouvement vers la ruine et comprend le génitif comme indiquant le moyen ou la cause, tout en signalant l’ambiguïté syntaxique en note.
- source_word: ἀλλοιώσουσι
  choice: détourneront
  rationale: Le verbe signifie littéralement changer ou altérer; dans ce contexte moral, « détourner » exprime une corruption de conduite sans préciser davantage sa nature.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: feront décliner
  rationale: Expression française naturelle pour l’idée de rendre moindre, d’affaiblir ou de réduire un royaume.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: en raison de mon obéissance à mon père
  rationale: Exprime la relation instrumentale ou circonstancielle entre le don du royaume et l’obéissance de Juda à son père.
theological_decisions:
- issue: Nature des « deux choses »
  choice: Maintenir le renvoi non explicité du grec
  alternative: Ajouter « l’or et la beauté des femmes » dans le corps du texte
  rationale: Le texte grec de ce verset dit seulement « ces deux choses »; leur identification relève du contexte et ne doit pas être incorporée comme si elle était formulée ici.
- issue: Rapport entre l’immoralité sexuelle et la perte
  choice: Traduire l’immoralité sexuelle comme cause ou moyen de la perte
  alternative: « une perte caractérisée par l’immoralité sexuelle » ou « la perdition de l’immoralité sexuelle »
  rationale: La construction grecque est condensée et peut recevoir plusieurs analyses; la traduction choisie est cohérente avec l’avertissement moral du contexte, tandis que la note conserve l’incertitude.
- issue: Don du royaume et obéissance
  choice: Présenter l’obéissance à son père comme la circonstance ou le motif associé au don
  alternative: « que le Seigneur m’a donné dans l’obéissance à mon père »
  rationale: La formulation française retenue est intelligible sans transformer cette déclaration testamentaire en doctrine générale du mérite.
translation_notes:
  register: Français moderne, digne et direct. La traduction suit prioritairement le texte grec de Charles XVII.2 plutôt que l’exhortation thématique plus développée de la couche anglaise. « Immoralité sexuelle » est préféré à « fornication », devenu moins transparent dans l’usage courant.
