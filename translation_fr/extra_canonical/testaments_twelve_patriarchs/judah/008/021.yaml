source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: fr
  text: 'Et voici en quoi consiste le discernement dans la consommation de vin : on boit tant qu’on garde sa retenue.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tant qu’il a de la retenue, il boit ». Le grec peut se comprendre comme une règle de conduite, sans employer explicitement le verbe « pouvoir ».'
    reason: Signaler l’ambiguïté entre l’indicatif descriptif et une portée implicitement permissive ou normative.
lexical_decisions:
- source_word: σύνεσις
  choice: discernement
  rationale: Le terme désigne l’intelligence pratique ou la prudence qui guide la conduite; « discernement » conserve cette nuance sans transformer la phrase en interdiction juridique.
- source_word: οἰνοποσία
  choice: consommation de vin
  rationale: Rend clairement le fait de boire du vin dans un registre moderne et digne.
- source_word: αἰδῶ (αἰδώς)
  choice: retenue
  rationale: Le mot peut évoquer la pudeur, le respect de soi ou le sens de la honte. « Retenue » convient ici au comportement lié au vin et évite la connotation principalement sexuelle que « pudeur » peut avoir en français moderne.
- source_word: πίνει
  choice: on boit
  rationale: Conserve l’indicatif présent du grec et sa formulation générale, sans lui imposer explicitement la valeur permissive « on peut boire ».
theological_decisions:
- issue: Portée morale de la phrase sur la consommation de vin
  choice: Présenter le discernement comme une consommation maintenue dans les limites de la retenue
  alternative: Formuler une permission explicite de boire tant que la personne ne tombe pas dans l’impudence
  rationale: Le grec formule sobrement le principe et ne mentionne ni égarement ni impudence comme proposition distincte. La traduction conserve donc sa tension entre description et norme sans développer davantage.
translation_notes:
  register: Français international moderne, sobre et sentencieux. L’emploi de « on » rend la portée générale du sujet implicite en grec; la phrase reste concise conformément au texte source.
