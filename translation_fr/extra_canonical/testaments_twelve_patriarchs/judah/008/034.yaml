source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: fr
  text: Car je sais qu’après ma mort, vous agirez au mépris de la loi et vous vous opposerez à Lévi. Mais vous ne pourrez pas l’emporter sur lui, car l’ange du Seigneur le guide, tandis que moi, l’esprit de tromperie m’a égaré.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset n’a pas de contrepartie directe dans le texte grec α édité par Charles. Il constitue dans le projet une transition homilétique vers le développement sur Lévi et Juda au chapitre 21; le témoin grec passe plutôt des chapitres 19–20 à l’exhortation « aimez Lévi » en 21.1.
    reason: Signaler avec transparence que la formulation traduite ne repose pas sur une phrase grecque correspondante dans le témoin source indiqué.
lexical_decisions:
- source_word: act lawlessly (project bridge; sans contrepartie grecque directe)
  choice: agir au mépris de la loi
  rationale: Cette formulation française naturelle conserve l’idée d’une conduite qui transgresse délibérément la loi, sans introduire un vocabulaire confessionnel.
- source_word: contend against Levi (project bridge; sans contrepartie grecque directe)
  choice: s’opposer à Lévi
  rationale: « S’opposer à » rend l’affrontement sans préciser indûment s’il est politique, religieux ou violent.
- source_word: prevail against him (project bridge; sans contrepartie grecque directe)
  choice: l’emporter sur lui
  rationale: Expression idiomatique qui garde le sens d’une incapacité à vaincre ou à prendre le dessus.
- source_word: the angel of the Lord guides him (project bridge; sans contrepartie grecque directe)
  choice: l’ange du Seigneur le guide
  rationale: Traduction directe et digne, qui ne développe pas la nature de cette direction.
- source_word: the spirit of deceit has misled me (project bridge; sans contrepartie grecque directe)
  choice: l’esprit de tromperie m’a égaré
  rationale: Conserve la personnification et l’ambiguïté de « spirit » ainsi que l’idée d’un égarement déjà subi.
theological_decisions:
- issue: Rapport entre la direction de Lévi et l’égarement de Juda
  choice: Conserver le contraste explicite au moyen de « tandis que »
  alternative: Juxtaposer les deux propositions sans connecteur
  rationale: Le contraste appartient au texte anglais du projet et met en tension la direction angélique de Lévi avec l’égarement de Juda, sans expliquer davantage leur causalité.
- issue: Statut de « l’esprit de tromperie »
  choice: Maintenir « l’esprit » sans préciser s’il s’agit d’un être personnel, d’une influence ou d’une disposition intérieure
  alternative: Traduire par « la tromperie » ou « un esprit trompeur »
  rationale: Cette solution préserve l’ambiguïté théologique au lieu de la résoudre.
- issue: Absence de contrepartie dans le témoin grec α
  choice: Conserver le verset demandé tout en signalant clairement son statut dans une note textuelle
  alternative: Omettre entièrement le verset
  rationale: Le texte appartient au projet éditorial fourni, mais l’honnêteté envers les témoins exige d’indiquer qu’il n’est pas attesté directement dans la source grecque citée.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme prophétique est conservé par deux phrases équilibrées. « Au mépris de la loi » évite le calque lourd « agir sans loi », tandis que « l’emporter sur lui » reste accessible. Puisqu’aucun texte grec direct n’est attesté pour ce verset, la traduction suit prudemment la formulation éditoriale anglaise tout en rendant son statut explicite en note.
