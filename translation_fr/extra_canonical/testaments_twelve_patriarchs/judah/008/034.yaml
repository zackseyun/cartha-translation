  naturalness: 'Le français est globalement clair et de registre approprié. Cependant, « tandis que moi, l’esprit de tromperie m’a égaré » est une construction inutilement heurtée : le pronom disloqué « moi » alourdit le contraste et peut faire hésiter sur le sujet.'
  terminology: « Lévi », « l’ange du Seigneur », « l’esprit de tromperie » et « l’emporter sur lui » sont justes, naturels et ne surinterprètent pas le texte. « Agir au mépris de la loi » rend convenablement l’idée anglaise de conduite sans loi.
