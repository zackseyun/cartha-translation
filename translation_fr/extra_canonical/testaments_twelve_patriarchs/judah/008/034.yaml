    reason: Signaler avec transparence que la formulation traduite ne repose pas sur une phrase grecque correspondante dans le témoin source indiqué.
  revision_rationale: La seule correction supprime le « moi » redondant dans la dernière proposition. Elle rétablit une syntaxe française fluide, tout en conservant exactement le contraste et l’ambiguïté de l’anglais du projet. La note textuelle reste nécessaire puisque le verset n’est pas directement attesté dans le témoin grec α cité.
