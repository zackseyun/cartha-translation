id: T12P.JUD.8.42
reference: Testament of Judah 8:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: fr
  text: Et j’ai appris tout le mal que vous ferez dans les derniers jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dans les derniers jours » est placée entre crochets par l’éditeur, qui la considère comme une interpolation chrétienne.
    reason: Signaler honnêtement le statut critique de la proposition grecque conservée selon la politique du projet.
lexical_decisions:
- source_word: ἔγνωκα
  choice: j’ai appris
  rationale: Le parfait grec exprime une connaissance acquise et désormais possédée. « J’ai appris » est naturel en français et n’ajoute pas la mention des livres d’Hénoch propre à l’autre recension.
- source_word: ὅσα κακὰ ποιήσετε
  choice: tout le mal que vous ferez
  rationale: Cette formulation rend directement l’étendue de ὅσα κακά et conserve le pluriel de ποιήσετε dans le pronom « vous », sans développer le texte par des actes ou des afflictions absents de la recension α.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: dans les derniers jours
  rationale: Expression eschatologique française courante, proche de la formulation grecque et suffisamment ouverte pour ne pas préciser davantage sa portée.
theological_decisions:
- issue: Mention des livres d’Hénoch le juste
  choice: Ne pas l’inclure
  alternative: « J’ai lu dans les livres d’Hénoch le juste »
  rationale: La mention appartient à la recension β. Le texte grec α fourni porte seulement Καὶ ἔγνωκα ; l’ajouter ferait primer la couche anglaise de consultation sur la source retenue.
- issue: Développement sur les fils qui se détournent du Seigneur et commettent toute méchanceté et toute affliction devant lui
  choice: Conserver la formulation générale « tout le mal que vous ferez »
  alternative: Développer explicitement l’apostasie des fils et leurs méfaits devant le Seigneur
  rationale: Ces précisions ne figurent pas dans la phrase grecque α donnée. La traduction maintient donc son accusation générale et son ambiguïté quant aux actes visés.
- issue: Statut de la formule eschatologique
  choice: La conserver dans le texte avec une note
  alternative: L’omettre comme interpolation chrétienne signalée par l’éditeur
  rationale: La politique du projet demande de préserver la proposition mise entre crochets, tout en rendant transparent son statut textuel.
translation_notes:
  register: Français moderne, sobre et digne. La phrase suit la recension grecque α plutôt que les développements de la recension β repris dans l’anglais de consultation. La coordination initiale Καί est rendue par « Et », conformément au mouvement discursif du testament.
