base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: fr
  text: Car j’ai donné mon bâton, c’est-à-dire le soutien de ma tribu, et ma ceinture, c’est-à-dire ma puissance, et mon diadème, c’est-à-dire la gloire de mon royaume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: bâton
  rationale: Rend directement l’objet remis, tout en laissant l’explication qui suit préciser sa portée symbolique.
- source_word: στήριγμα
  choice: soutien
  rationale: Exprime ce qui affermit ou maintient la tribu, dans un français naturel, sans surinterpréter la métaphore.
- source_word: ζώνην
  choice: ceinture
  rationale: Équivalent concret et courant du terme grec désignant ce qui entoure la taille.
- source_word: δύναμιν
  choice: puissance
  rationale: Conserve la force politique et symbolique du grec dans ce contexte royal.
- source_word: διάδημα
  choice: diadème
  rationale: Terme précis pour l’insigne de souveraineté mentionné dans le texte.
- source_word: βασιλείας
  choice: royauté
  rationale: Ici, le terme désigne vraisemblablement la dignité ou le pouvoir royal de Juda plutôt qu’un territoire; «royauté» préserve ce sens institutionnel.
theological_decisions:
- issue: Portée symbolique des trois objets
  choice: Conserver les identifications explicites du texte sans les développer
  alternative: Interpréter le bâton, la ceinture et le diadème comme des réalités messianiques ou dynastiques précises
  rationale: Le grec fournit lui-même les équivalences symboliques, mais ne justifie pas dans ce verset une identification doctrinale plus détaillée.
- issue: Sens de βασιλεία
  choice: royauté
  alternative: royaume
  rationale: La formule «gloire de ma royauté» s’accorde mieux avec le diadème comme insigne et avec le possessif «ma», tout en maintenant la dimension royale du terme.
translation_notes:
  register: Français moderne, digne et accessible. La structure explicative répétée «c’est-à-dire» est conservée, ainsi que l’enchaînement ternaire du grec.
