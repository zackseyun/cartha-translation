  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: fr
  text: À moi, il a donné ce qui est sur la terre ; à lui, ce qui est dans les cieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: ce qui est sur la terre
  rationale: Rend naturellement l’expression grecque tout en conservant sa portée générale et collective.
- source_word: τὰ ἐν οὐρανοῖς
  choice: ce qui est dans les cieux
  rationale: Le pluriel « les cieux » reflète le pluriel grec οὐρανοῖς sans préciser indûment la nature des réalités célestes.
theological_decisions:
- issue: Identité des référents des pronoms
  choice: Conserver « il », « moi » et « lui » sans explicitation
  alternative: Nommer les personnes auxquelles les pronoms renvoient
  rationale: Le verset grec isolé ne nomme pas les référents ; les expliciter résoudrait une ambiguïté que le texte conserve.
translation_notes:
  register: Formulation concise, solennelle et naturelle en français moderne. Le parallélisme du grec est préservé, avec ellipse du second verbe afin de reproduire son équilibre rhétorique.
