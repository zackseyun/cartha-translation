source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας, καὶ ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
  note: Greek from Charles XVIII.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/027.yaml
  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: fr
  text: Gardez-vous donc, mes enfants, de l’immoralité sexuelle et de l’amour de l’argent, et écoutez Juda, votre père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Gardez-vous
  rationale: Rend naturellement l’impératif moyen exprimant la vigilance et la préservation de soi.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Terme générique qui conserve la portée large de πορνεία sans la réduire à un seul comportement.
- source_word: φιλαργυρίας
  choice: amour de l’argent
  rationale: Traduction transparente du composé grec, qui désigne l’attachement avide à l’argent.
- source_word: ἀκούσατε
  choice: écoutez
  rationale: Conserve l’impératif direct; selon le contexte, l’écoute implique aussi de prêter attention et d’obéir.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Juda, votre père
  rationale: Reproduit l’auto-identification à la troisième personne dans un français clair et digne.
theological_decisions:
- issue: Portée morale de πορνεία
  choice: immoralité sexuelle
  alternative: débauche sexuelle / prostitution
  rationale: Le grec a une portée générale; une formulation large évite de limiter arbitrairement l’interdit.
- issue: Force de ἀκούσατε
  choice: écoutez
  alternative: obéissez à
  rationale: Le texte dit littéralement «écoutez». La dimension possible d’obéissance reste implicite plutôt que d’être imposée.
translation_notes:
  register: Français international moderne, direct et digne. L’adresse familiale «mes enfants» et l’auto-désignation «Juda, votre père» sont conservées. Aucun marqueur de note n’est requis.
