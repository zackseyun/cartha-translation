  rationale: 'Révision limitée visant à supprimer l’ajout implicite d’un lieu (« y ») et à rétablir le pluriel imagé des « yeux ». Le choix « ardeur du désir » est maintenu : le syntagme grec ὀργὴν ἐπιθυμίας est difficile et ne permet pas d’imposer avec certitude le sens étroit de « colère » ou une qualification doctrinale de la convoitise.'
