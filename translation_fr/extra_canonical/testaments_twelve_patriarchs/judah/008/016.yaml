source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: fr
  text: 'Et maintenant, mes enfants, je vous le dis : ne vous enivrez pas de vin. Car le vin détourne l’esprit de la vérité, suscite l’ardeur du désir et égare les yeux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: mes enfants
  rationale: Correspondance naturelle et directe de l’adresse affectueuse.
- source_word: μὴ μεθύσκεσθε οἴνῳ
  choice: ne vous enivrez pas de vin
  rationale: Rend clairement l’interdiction de l’ivresse causée par le vin, dans un français courant et digne.
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: détourne l’esprit de la vérité
  rationale: Conserve l’image d’une faculté intérieure déviée et éloignée de la vérité.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: y fait naître l’ardeur du désir
  rationale: La tournure grecque inhabituelle associe la force véhémente de ὀργή à ἐπιθυμία; «ardeur» préserve cette intensité sans imposer le sens étroit de «colère».
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: égare le regard
  rationale: Expression française naturelle qui conserve l’idée des yeux conduits dans l’erreur.
theological_decisions:
- issue: Portée de l’exhortation sur le vin
  choice: Interdiction de s’enivrer
  alternative: Interdiction absolue de boire du vin
  rationale: Le verbe μεθύσκεσθε désigne l’enivrement; le texte ne formule pas explicitement une abstinence totale.
- issue: Sens de ὀργὴν ἐπιθυμίας
  choice: l’ardeur du désir
  alternative: la colère du désir / une passion de convoitise
  rationale: Le syntagme est sémantiquement tendu. La traduction retient l’idée d’une impulsion intense sans préciser arbitrairement sa nature morale ou doctrinale.
translation_notes:
  register: 'Français international moderne, fluide et solennel sans archaïsme. La répétition explicative est légèrement resserrée dans la dernière proposition, tout en conservant la progression: esprit détourné, désir attisé, regard égaré.'
