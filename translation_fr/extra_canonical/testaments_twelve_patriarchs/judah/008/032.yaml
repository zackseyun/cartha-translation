revisions:
- from: Mes enfants, l’amour de l’argent conduit à l’idolâtrie, car, égarés par l’argent, les gens appellent dieux ceux qui ne le sont pas ; et cet amour fait perdre la raison[a] à celui qui le possède.
  to: Mes enfants, l’amour de l’argent conduit à l’idolâtrie, car, dans l’égarement causé par l’argent, on donne le nom de dieux à ceux qui n’en sont pas ; et cet amour fait perdre la raison[a] à celui qui le possède.
  rationale: La révision est limitée à la proposition introduite par « car ». Elle conserve l’ambiguïté de ἐν πλάνῃ ἀργυρίου, restitue la généralité du pluriel grec par une tournure française idiomatique, et ne modifie ni le sens global ni le registre du passage. La note existante est maintenue.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet suit fidèlement le grec fourni plutôt que la formulation anglaise consolidée : il conserve la progression φιλαργυρία → εἰδωλολατρία, l’attribution indue du nom de dieux, et la chute dans l’ἔκστασις. L’ajout anglais concernant le vin, l’immoralité sexuelle et la loi de Dieu n’a pas de base dans ce texte grec et doit donc rester absent. Une légère révision rend plus exactement ἐν πλάνῃ ἀργυρίου sans transformer l’ambiguïté du génitif en une affirmation trop précise sur l’agent de l’égarement.'
  naturalness: La formulation est globalement moderne et digne. « Les gens » est toutefois une explicitation un peu lourde d’un pluriel générique grec, et « égarés par l’argent » rattache plus étroitement l’égarement aux personnes que ne le fait nécessairement ἐν πλάνῃ ἀργυρίου. Une tournure impersonnelle française est plus fluide et plus proche de la portée générique du grec.
  terminology: « L’amour de l’argent », « conduit à l’idolâtrie » et « fait perdre la raison » conviennent dans ce contexte. La note sur ἔκστασις est utile et ne force pas un sens mystique. « Donner le nom de dieux à ceux qui n’en sont pas » conserve l’affirmation polémique du texte sans spéculer sur la nature précise des référents.
  issues:
  - severity: low
    issue: Rattachement interprétatif de « égarés par l’argent »
    rationale: Le grec ἐν πλάνῃ ἀργυρίου signifie littéralement « dans l’égarement/l’illusion de l’argent » et laisse la relation exacte du génitif ouverte. « Dans l’égarement causé par l’argent » rend le lien naturellement sans le surdéterminer.
  - severity: low
    issue: Explicitation par « les gens »
    rationale: Le verbe grec au pluriel a une valeur générique. Le français impersonnel « on donne le nom de… » est plus idiomatique et évite d’ajouter un groupe nominal non exprimé.
  revised_text: Mes enfants, l’amour de l’argent conduit à l’idolâtrie, car, dans l’égarement causé par l’argent, on donne le nom de dieux à ceux qui n’en sont pas ; et cet amour fait perdre la raison[a] à celui qui le possède.
