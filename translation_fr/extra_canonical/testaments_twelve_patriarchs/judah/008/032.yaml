source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: fr
  text: Mes enfants, l’amour de l’argent conduit à l’idolâtrie, car, dans l’égarement causé par l’argent, on donne le nom de dieux à ceux qui n’en sont pas ; et cet amour fait perdre la raison[a] à celui qui le possède.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fait tomber dans un état de sortie de soi » ; le grec peut évoquer la stupeur, le dérèglement ou la perte de maîtrise de soi.'
    reason: Signaler l’étendue sémantique de ἔκστασις sans imposer une interprétation mystique étrangère au contexte.
lexical_decisions:
- source_word: φιλαργυρία
  choice: l’amour de l’argent
  rationale: Rend directement le désir possessif et l’attachement à l’argent exprimés par le grec, dans une formulation française naturelle et traditionnelle.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: conduit à l’idolâtrie
  rationale: Conserve l’image grecque d’une conduite vers un aboutissement sans renforcer le lien en causalité absolue.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: égarés par l’argent
  rationale: Exprime naturellement l’idée d’égarement ou d’illusion liée à l’argent, tout en maintenant l’ambiguïté du génitif grec.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: les gens appellent dieux ceux qui ne le sont pas
  rationale: Restitue l’affirmation grecque selon laquelle certains attribuent le nom de dieux à des êtres qui ne sont pas réellement des dieux ; « les gens » explicite seulement le sujet indéfini du verbe pluriel.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: fait perdre la raison
  rationale: Dans ce contexte moral négatif, ἔκστασις évoque un état de dérèglement, de stupeur ou de sortie de soi plutôt qu’une expérience mystique positive.
theological_decisions:
- issue: Rapport entre l’amour de l’argent et l’idolâtrie
  choice: Maintenir « conduit à »
  alternative: « est de l’idolâtrie » ou « produit nécessairement l’idolâtrie »
  rationale: Le grec décrit une orientation ou un cheminement vers l’idolâtrie, et non une identité théologique explicite entre les deux.
- issue: Éléments présents dans l’anglais de consultation mais absents du grec fourni
  choice: Ne pas ajouter le vin, l’immoralité sexuelle ni la loi de Dieu
  alternative: Suivre la consolidation thématique de l’anglais POB
  rationale: Le témoin grec de ce passage ne contient que l’avertissement sur l’amour de l’argent, l’idolâtrie et la perte de raison. La traduction privilégie donc la preuve textuelle en langue originale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible, avec un point-virgule pour conserver la progression argumentative du grec. La traduction suit le texte grec plutôt que les ajouts récapitulatifs de la couche anglaise.
