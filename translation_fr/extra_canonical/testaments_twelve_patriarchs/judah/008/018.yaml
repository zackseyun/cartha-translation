source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: fr
  text: Car si quelqu’un boit du vin jusqu’à l’ivresse, le vin trouble son esprit par des pensées impures, échauffe son corps en vue de l’immoralité sexuelle et du plaisir, et cette personne commet le péché sans en avoir honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: jusqu’à l’ivresse
  rationale: Exprime naturellement le résultat ou le degré visé par la consommation de vin.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: par des pensées impures
  rationale: « Impures » restitue la souillure morale de ῥυπαροῖς dans un français actuel et digne.
- source_word: συνταράσσει τὸν νοῦν σου
  choice: trouble son esprit
  rationale: Le verbe marque une agitation profonde; la troisième personne harmonise le pronom avec l’indéfini « quelqu’un », malgré le « ton esprit » du grec transmis.
- source_word: εἰς πορνείαν
  choice: pour la débauche
  rationale: Préserve ici le sens large d’inconduite sexuelle de πορνεία sans le réduire à la prostitution ni à une union sexuelle précise.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: échauffe son corps … sous l’effet du plaisir
  rationale: Conserve l’image d’un corps excité ou enflammé en vue du plaisir, dans une formulation française naturelle.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: il commet le péché
  rationale: Rend directement l’acte pécheur, sans ajouter la condition absente du texte grec fourni.
theological_decisions:
- issue: Nature de πορνεία
  choice: débauche
  alternative: immoralité sexuelle; relation sexuelle illicite
  rationale: Le terme grec possède une portée sexuelle moralement négative mais ne précise pas ici une forme unique d’acte; « débauche » maintient cette latitude.
- issue: Agent des verbes « trouble » et « échauffe »
  choice: le vin, repris par « celui-ci »
  alternative: l’état d’ivresse; un sujet impersonnel
  rationale: La syntaxe grecque laisse le sujet immédiat non exprimé; le vin est le référent contextuel le plus naturel, mais la traduction évite d’introduire une causalité théologique supplémentaire.
- issue: Absence de condition circonstancielle
  choice: enchaînement direct vers le péché
  alternative: « si l’occasion du désir se présente » selon l’anglais de consultation
  rationale: La proposition conditionnelle de l’anglais n’apparaît pas dans le texte grec fourni; elle n’est donc pas importée.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le tour demeure proche de la progression grecque tout en évitant le calque. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est proposée.
