  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: fr
  text: Ne vous élevez donc pas au-dessus de Lévi ni contre moi, mais honorez pleinement le Seigneur dans les deux et, parmi les hommes, approchez-vous de Lévi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette phrase n’est pas attestée comme telle dans le témoin grec α. Elle réunit le thème « ne vous élevez pas » de 21.1 et le verbe « s’approcher » de 21.5 ; « honorez pleinement le Seigneur dans les deux » n’a pas de correspondant direct dans ce témoin. En 21.6, le texte grec poursuit plutôt : « Et tu seras parmi eux comme la mer… »'
    reason: Signaler honnêtement que le verset de projet est une composition paraphrastique et non la traduction d’une unité continue du texte grec fourni.
lexical_decisions:
- source_word: « ne vous élevez pas » (thème de XXI.1)
  choice: « Ne vous élevez donc pas au-dessus de Lévi »
  rationale: Formulation française naturelle qui conserve l’image de l’élévation orgueilleuse signalée par le témoin grec apparenté.
- source_word: προσεγγίζειν (XXI.5)
  choice: « approchez-vous de Lévi »
  rationale: Rend directement l’idée de s’approcher, sans préciser une alliance, une soumission ou une fonction cultuelle que le verbe seul n’impose pas.
- source_word: « in both » (ajout du texte de projet sans équivalent α direct)
  choice: « en l’un comme en l’autre »
  rationale: Préserve l’ambiguïté du référent double au lieu de l’identifier explicitement à Juda et Lévi.
theological_decisions:
- issue: Rapport entre Juda et Lévi
  choice: Conserver l’interdiction de s’élever au-dessus de Lévi et l’appel à s’en approcher.
  alternative: Développer ce rapport en doctrine explicite de suprématie sacerdotale ou royale.
  rationale: Le texte de projet exprime une relation d’honneur et de proximité, mais ne justifie pas à lui seul une construction confessionnelle plus précise.
- issue: Honneur rendu au Seigneur « en l’un comme en l’autre »
  choice: Maintenir la formule et son ambiguïté.
  alternative: Préciser « en Juda et en Lévi » ou supprimer la proposition faute d’attestation grecque directe.
  rationale: La traduction représente fidèlement le texte de projet demandé, tandis que la note signale avec transparence que cette proposition n’a pas de correspondant direct dans le témoin α.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif pluriel est conservé. La syntaxe reste proche du texte de projet tout en évitant une tournure artificielle; la note distingue clairement traduction de projet et attestation manuscrite.
