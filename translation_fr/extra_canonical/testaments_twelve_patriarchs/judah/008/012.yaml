source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: fr
  text: 'Les habitants de la ville disaient : « Il n’y avait pas de prostituée[a] à la porte de la ville ; une femme venue d’un autre endroit s’y était assise un court moment. » Et ils pensaient que personne ne savait que j’étais entré chez elle.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec transmis ici est difficile ; d’après le contexte, il désigne vraisemblablement une prostituée.
    reason: Signaler honnêtement l’incertitude lexicale du texte source.
  - marker: b
    text: 'Le grec fourni dit : « Et ils pensaient que personne ne savait que j’étais entré chez elle. » Il ne contient pas ici la phrase : « Je compris que j’avais péché… parce que j’avais honte. »'
    reason: Documenter l’écart substantiel entre la source grecque citée et la couche de consultation anglaise.
lexical_decisions:
- source_word: τελεσικόμενον
  choice: prostituée
  rationale: Le terme grec est textuellement difficile, mais le contexte de Juda et Tamar désigne une femme prise pour une prostituée. Ce rendu naturel suit le sens contextuel sans reprendre l’ajout anglais « ni aucune étrangère ».
- source_word: ἐν τῇ πύλῃ
  choice: à la porte de la ville
  rationale: Dans ce contexte urbain, πύλη désigne la porte de la ville, lieu public où la femme s’est assise.
- source_word: ἐξ ἄλλου χωρίου ἐλθοῦσα
  choice: une femme venue d’un autre endroit
  rationale: Rend explicitement le participe féminin et l’origine extérieure sans identifier nécessairement la femme comme une « étrangère » au sens ethnique.
- source_word: πρὸς βραχὺ ἐκαθέσθη
  choice: s’y était assise un court moment
  rationale: Conserve la brièveté exprimée par πρὸς βραχύ et la valeur passée du verbe.
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: j’étais entré chez elle
  rationale: Expression française naturelle qui garde l’énoncé indirect du grec; le contexte peut lui donner une connotation sexuelle sans que la traduction l’explicite.
theological_decisions:
- issue: Écart entre le grec fourni et l’English POB
  choice: Traduire les deux phrases effectivement attestées dans le grec fourni
  alternative: 'Suivre l’English POB : « Et je compris que j’avais péché… parce que j’avais honte »'
  rationale: La seconde moitié de l’anglais n’apparaît pas dans le texte grec cité, lequel dit plutôt que les habitants pensaient que personne ne connaissait l’entrée de Juda chez la femme. L’ajouter contredirait la priorité donnée à la source originale.
- issue: Qualification morale explicite de l’acte de Juda
  choice: Ne pas ajouter « j’avais péché »
  alternative: Introduire la confession de péché donnée dans l’English POB
  rationale: Cette confession peut appartenir à une autre forme textuelle ou à une consolidation thématique, mais elle n’est pas attestée par l’extrait grec soumis.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation demeure claire pour un large public, tout en conservant l’ambiguïté de « j’étais entré chez elle » et en signalant les difficultés textuelles sans harmonisation silencieuse.
