    issue: Rendu de Ἐπιγνούς par « Après l’avoir compris »
    rationale: Le grec ne donne aucun objet explicite. Le pronom français impose un référent et « comprendre » affaiblit la valeur de reconnaissance/perception accomplie. « Après avoir compris » reste sans objet explicite et est plus idiomatique.
  - severity: high
    issue: Rendu de ἢ ἐγώ par « ou bien moi »
    rationale: Dans ce contexte, ἤ se lit naturellement comme un comparatif elliptique (« plutôt que moi »), conformément à la leçon grecque telle qu’elle se présente. « Ou bien moi » produit une alternative artificielle et ne transmet pas la relation comparative attendue.
  - severity: medium
    issue: Rendu de δεδικαίωται par « est juste »
    rationale: Le parfait passif de δικαιόω signale qu’elle a été reconnue ou déclarée juste; le présent « est juste » efface la voix passive et l’aspect accompli.
