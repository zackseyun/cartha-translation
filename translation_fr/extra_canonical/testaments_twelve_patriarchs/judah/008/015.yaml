base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: fr
  text: 'Après avoir compris, je dis : « Tamar a été reconnue juste plutôt que moi. » Et je n’eus plus de relations avec elle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et je ne continuai plus à la connaître. » Ici, « connaître » désigne les relations sexuelles.'
    reason: Signaler l’euphémisme de l’original tout en donnant dans le texte principal un français actuel et clair.
lexical_decisions:
- source_word: Ἐπιγνοὺς
  choice: Après l’avoir compris
  rationale: Le participe signifie ici reconnaître ou prendre pleinement conscience. Le complément n’étant pas exprimé dans ce passage grec, la formulation française évite d’importer les « objets » mentionnés dans le récit biblique parallèle.
- source_word: Δεδικαίωται
  choice: est juste
  rationale: Le parfait passif de δικαιόω peut exprimer le fait d’être reconnu ou déclaré juste. « Est juste » conserve la portée judiciaire et morale sans ajouter le comparatif « plus juste », absent de ce texte grec.
- source_word: ἢ ἐγώ
  choice: ou bien moi
  rationale: Le grec transmis porte littéralement « ou moi », formulation difficile mais authentiquement ambiguë. Elle n’est pas harmonisée avec Genèse 38.26 (« plus juste que moi »).
- source_word: τοῦ γνῶναι αὐτήν
  choice: de relations avec elle
  rationale: Dans ce contexte, « connaître » est un euphémisme sémitique désignant les relations sexuelles. Le français explicite naturellement le sens sans crudité.
theological_decisions:
- issue: Comparaison entre la justice de Tamar et celle de Juda
  choice: « Tamar est juste, ou bien moi »
  alternative: « Tamar est plus juste que moi »
  rationale: L’alternative correspond au récit canonique et à l’anglais de consultation, mais le grec fourni dit Δεδικαίωται Θαμὰρ ἢ ἐγώ. La traduction conserve donc la tension et l’étrangeté de la leçon source plutôt que de l’harmoniser silencieusement.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe énigmatique de la déclaration sur la justice est volontairement préservée, tandis que l’euphémisme sexuel est rendu de manière intelligible et non vulgaire.
