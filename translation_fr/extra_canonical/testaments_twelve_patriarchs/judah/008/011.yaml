  verdict: revise
  source_fidelity: Le projet évite à juste titre les développements de Genèse 38 absents du grec fourni. Toutefois, οὐχ εὗρον est une 3e personne du pluriel (« ils ne trouvèrent pas »), non une 1re personne du pluriel, et le texte français « il ne la trouva pas » substitue indûment un sujet singulier.
  naturalness: La formulation révisée est concise, narrative et idiomatique en français moderne. Le sujet de l’envoi demeure implicite, comme en grec.
  terminology: « Gages » rend adéquatement τοὺς ἀρραβῶνας dans le sens d’objets remis en garantie. « Récupérer » exprime naturellement λαβεῖν dans ce contexte sans importer les détails de la tradition de la Genèse.
  issues:
