source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: fr
  text: J’envoyai pour récupérer les gages, mais ils ne la trouvèrent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπεμψα τοῦ λαβεῖν
  choice: J’envoyai quelqu’un reprendre
  rationale: La tournure exprime l’envoi d’une personne dans le but de récupérer quelque chose. « Reprendre » rend ici l’idée de récupérer les objets laissés en garantie.
- source_word: τοὺς ἀρραβῶνας
  choice: les gages
  rationale: Au pluriel, ἀρραβῶνας désigne les objets remis comme garantie, et non des « fiançailles » en français moderne.
- source_word: οὐχ εὗρον αὐτήν
  choice: il ne la trouva pas
  rationale: Le verbe grec est à la première personne du pluriel dans la forme transmise (« nous ne la trouvâmes pas »), mais le contexte de l’envoyé chargé de reprendre les gages peut expliquer une variation textuelle ou grammaticale. La formulation française suit le sens narratif immédiat sans ajouter les éléments issus de Genèse 38 qui sont absents de ce témoin grec.
theological_decisions:
- issue: Ajouts provenant de la tradition de Genèse 38
  choice: Ne pas ajouter le chevreau, l’interrogation des habitants ni la mention d’Énaïm
  alternative: 'Reprendre le texte anglais consolidé : « Après cela, j’envoyai le chevreau… » puis la question aux habitants'
  rationale: Ces détails figurent dans la tradition de Genèse 38 et dans la couche anglaise consultative, mais ils n’ont pas de correspondant dans le passage grec α fourni. La traduction privilégie donc le témoignage original indiqué.
translation_notes:
  register: Français moderne, simple et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La traduction reste concise comme le grec et n’importe pas les développements de Genèse 38 présents dans le texte anglais de consultation.
