    issue: Le sujet de εὗρον est rendu au singulier.
    rationale: εὗρον est formellement un aoriste actif de troisième personne du pluriel. Le rendre par « il ne la trouva pas » efface ce pluriel sans appui dans le texte fourni.
  - severity: medium
    issue: La note affirme à tort que le grec dit « nous ne la trouvâmes pas ».
    rationale: Cette traduction correspondrait à εὕρομεν, non à εὗρον. La note ne décrit donc pas exactement la forme grecque et sa justification du changement de personne est erronée.
  revised_text: J’envoyai pour récupérer les gages, mais ils ne la trouvèrent pas.
