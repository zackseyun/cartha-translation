source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: fr
  text: Et maintenant, mes enfants, je vous ordonne d’aimer Lévi, afin que vous demeuriez, et ne vous élevez pas contre lui, de peur d’être anéantis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: je vous donne cet ordre
  rationale: Rend clairement la force d’un commandement solennel tout en restant naturel en français moderne.
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: Équivalent direct de l’impératif grec, sans préciser davantage la nature de l’amour.
- source_word: ἵνα διαμείνητε
  choice: afin de subsister
  rationale: διαμένω exprime ici l’idée de demeurer, continuer d’exister ou survivre; « subsister » conserve cette portée sans réduire le sens à la seule vie biologique.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: ne vous élevez pas contre lui
  rationale: Préserve l’image grecque de l’élévation orgueilleuse dirigée contre Lévi, plutôt que de la paraphraser simplement par « ne vous opposez pas ».
- source_word: ἐξολοθρευθῆτε
  choice: être anéantis
  rationale: Exprime la destruction complète impliquée par le verbe grec au passif, dans un registre solennel et intelligible.
theological_decisions:
- issue: Lien entre l’amour de Lévi et la permanence des descendants de Juda
  choice: Conserver la relation finale « afin de subsister » sans l’expliquer
  alternative: Interpréter explicitement cette permanence comme la vie, la survie nationale ou la fidélité à l’ordre sacerdotal
  rationale: Le grec affirme un lien de finalité sans en définir précisément la nature; la traduction maintient cette tension.
- issue: Agent de l’anéantissement
  choice: Employer le passif « être anéantis » sans nommer l’agent
  alternative: Ajouter « par Dieu »
  rationale: Le texte grec utilise un passif sans agent explicite; il ne convient pas d’en introduire un dans le corps du texte.
translation_notes:
  register: Français moderne, digne et solennel. L’adresse familiale « mes enfants » et la cadence exhortative du grec sont conservées. Aucun marqueur de note n’est requis.
