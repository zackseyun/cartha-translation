source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: fr
  text: Ainsi donc, ivre de vin, je ne l’ai pas reconnue, et sa beauté m’a trompé par l’aspect de sa parure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οἴνῳ
  choice: ivre de vin
  rationale: Rend directement l’état exprimé par le participe grec et conserve la mention explicite du vin.
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: je ne l’ai pas reconnue
  rationale: Le verbe ἐπιγινώσκω signifie ici reconnaître ou identifier; cette formulation reste naturelle en français.
- source_word: ἠπάτησέ με
  choice: m’a trompé
  rationale: Rend le sens ordinaire de ἀπατάω sans ajouter l’idée explicite d’un égarement de l’esprit, absente du grec.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: à cause de l’apparence que lui donnait sa parure
  rationale: Exprime naturellement le rôle de l’aspect ou de la présentation produit par la parure, tout en évitant le calque peu clair «par la forme de son ornement».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La relation causale et la tension du récit sont conservées sans moralisation ajoutée.
