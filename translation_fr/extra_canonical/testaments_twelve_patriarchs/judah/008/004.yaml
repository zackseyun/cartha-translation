source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Μετὰ δὲ ταῦτα *χηρευούσης τῆς Θαμὰρ *μετὰ ἔτη δύο ἀκούσασα ὅτι ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα,'
  language: Greek
  note: 'Greek from Charles XII.1a (α): the Tamar narrative resumes. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/004.yaml
  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: fr
  text: Après cela, au bout de deux ans, Tamar, qui était veuve, apprit que je montais pour tondre les moutons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de ce verset s’achève ici sur une proposition qui se poursuit dans le verset suivant.
    reason: Signaler que la formulation suspendue appartient à la structure du texte source et non à une omission de la traduction.
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμάρ
  choice: Tamar, qui était veuve
  rationale: Rend naturellement en français la construction grecque au génitif absolu, sans ajouter d’information sur la cause de son veuvage.
- source_word: μετὰ ἔτη δύο
  choice: au bout de deux ans
  rationale: Exprime clairement l’intervalle temporel indiqué par le grec.
- source_word: ἀκούσασα
  choice: apprit
  rationale: Dans ce contexte, le participe signifie que Tamar reçut cette information; « apprit » est plus idiomatique que « ayant entendu ».
- source_word: ἀνέρχομαι
  choice: je montais
  rationale: Conserve la première personne du texte grec et la valeur de déplacement de « monter », sans suivre la reformulation divergente de la couche anglaise.
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: pour tondre les moutons
  rationale: Rend l’infinitif de but et le sens ordinaire de l’expression grecque.
