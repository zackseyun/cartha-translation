  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a servant to sexual immorality, as I myself also suffered.
translation:
  language: fr
  text: Celui qui se livre à l’immoralité sexuelle ne s’aperçoit pas qu’il est dépouillé, et, quand il est déshonoré, il n’a pas honte. Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté parce qu’il s’est fait l’esclave de l’immoralité sexuelle, comme moi aussi je l’ai subi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ
  choice: celui qui se livre à l’immoralité sexuelle / se livre à l’immoralité sexuelle
  rationale: Rend πορνεύω dans un français moderne et compréhensible, sans réduire le terme à un seul acte précis.
- source_word: γυμνούμενος / γυμνοῦται
  choice: est dépouillé
  rationale: Le sens littéral est « être mis à nu »; dans ce contexte de perte d’honneur et de royauté, « être dépouillé » conserve l’image et son effet social.
- source_word: οὐκ αἰσθάνεται
  choice: ne se rend pas compte
  rationale: Exprime l’absence de perception ou de conscience de l’état dans lequel la personne tombe.
- source_word: ἀδοξῶν
  choice: quand il perd son honneur
  rationale: Rend la privation de gloire, de considération ou d’honneur dans un français naturel.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: pour s’être asservi à l’immoralité sexuelle
  rationale: Préserve la métaphore forte de l’esclavage exprimée par δουλεύω ainsi que le lien causal avec la perte de la royauté.
- source_word: τῆς βασιλείας
  choice: de sa royauté
  rationale: Dans la construction avec γυμνοῦται, le terme désigne ici le statut ou la dignité royale dont le roi est dépouillé.
theological_decisions:
- issue: Rapport entre l’immoralité sexuelle et la perte de la royauté
  choice: Maintenir l’affirmation causale et la métaphore de l’asservissement
  alternative: Paraphraser comme une simple atteinte à la réputation du roi
  rationale: Le grec affirme explicitement que le roi est dépouillé de sa royauté en devenant esclave de l’immoralité sexuelle; la traduction ne doit ni atténuer ni systématiser davantage cette affirmation.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « l’immoralité sexuelle » est conservée pour reproduire l’insistance du grec. La formulation garde les images du dépouillement et de l’asservissement sans les rendre artificiellement littérales.
