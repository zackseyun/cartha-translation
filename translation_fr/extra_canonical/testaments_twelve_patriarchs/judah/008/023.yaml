revisions:
- from: Celui qui se livre à l’immoralité sexuelle ne se rend pas compte qu’il est dépouillé, et il n’éprouve aucune honte quand il perd son honneur. Car même si un homme est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté pour s’être asservi à l’immoralité sexuelle, comme cela m’est arrivé à moi aussi.
  to: Celui qui se livre à l’immoralité sexuelle ne s’aperçoit pas qu’il est dépouillé, et, quand il est déshonoré, il n’a pas honte. Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté parce qu’il s’est fait l’esclave de l’immoralité sexuelle, comme moi aussi je l’ai subi.
  rationale: La révision conserve le sens et la répétition intentionnelle de πορνεία, tout en rendant plus directement les participes grecs « étant dépouillé » et « étant déshonoré ». Elle exprime επίσης la causalité et la métaphore de δουλεύσας (« s’être fait l’esclave de ») sans ajouter de doctrine ni préciser indûment la nature de la perte royale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:10Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèlement rendu, y compris les images du dépouillement et de l’asservissement. Toutefois, ἀδοξῶν signifie plus directement « étant déshonoré / couvert de honte » que « quand il perd son honneur », et δουλεύσας exprime l’idée de s’être fait esclave ou d’avoir été au service de l’immoralité sexuelle. Une légère révision restitue ces nuances sans surinterprétation.
  naturalness: Le français du projet est moderne et clair. « Il n’éprouve aucune honte » est naturel, mais « il n’a pas honte » suit plus étroitement l’expression grecque et maintient le parallélisme. « Quelqu’un » rend aussi τις sans introduire inutilement « un homme ».
  terminology: « Immoralité sexuelle » constitue un rendu cohérent et suffisamment large de πορνεία/πορνεύω. « Royauté » rend convenablement βασιλεία dans le sens de dignité ou condition royale. « Se faire l’esclave de » conserve avec naturel la métaphore de δουλεύω.
  issues:
  - severity: low
    issue: Nuance de ἀδοξῶν
    rationale: « Quand il perd son honneur » explicite un résultat possible, mais le participe décrit directement l’état d’être déshonoré. « Quand il est déshonoré » est plus proche du grec.
  - severity: low
    issue: Rendu de δουλεύσας
    rationale: « Pour s’être asservi à » est compréhensible, mais peut sonner comme un passif ou une formulation abstraite. « Parce qu’il s’est fait l’esclave de » restitue explicitement l’agentivité et l’image servile du grec.
  revised_text: Celui qui se livre à l’immoralité sexuelle ne s’aperçoit pas qu’il est dépouillé, et, quand il est déshonoré, il n’a pas honte. Car même si quelqu’un est roi et se livre à l’immoralité sexuelle, il est dépouillé de sa royauté parce qu’il s’est fait l’esclave de l’immoralité sexuelle, comme moi aussi je l’ai subi.
  revised_footnotes: []
  revision_rationale: La révision conserve le sens et la répétition intentionnelle de πορνεία, tout en rendant plus directement les participes grecs « étant dépouillé » et « étant déshonoré ». Elle exprime επίσης la causalité et la métaphore de δουλεύσας (« s’être fait l’esclave de ») sans ajouter de doctrine ni préciser indûment la nature de la perte royale.
