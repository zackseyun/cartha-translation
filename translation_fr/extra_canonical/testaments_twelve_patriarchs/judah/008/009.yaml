  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: fr
  text: Et je lui ai donné mon bâton et mon diadème en gage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec dit seulement qu’il lui donna son bâton et son diadème en gage. La formulation anglaise du projet développe ici un dialogue et mentionne aussi une ceinture; ces éléments ne figurent pas dans cette clause grecque.
    reason: Signaler de façon transparente l’écart substantiel entre la source grecque et la couche anglaise consultative, lié au redécoupage du passage.
lexical_decisions:
- source_word: ῥάβδον
  choice: bâton
  rationale: Rend directement le terme grec désignant ici le bâton personnel remis comme objet de reconnaissance.
- source_word: διάδημα
  choice: diadème
  rationale: Conserve l’objet explicitement nommé dans le grec, sans ajouter « de mon royaume », absent de cette clause.
- source_word: ἀρραβῶνα
  choice: gage
  rationale: Dans ce contexte, le mot désigne un objet remis comme garantie; « en gage » est naturel et précis en français moderne.
theological_decisions:
- issue: Écart entre la source grecque et la couche anglaise consultative
  choice: Suivre la clause grecque, qui rapporte la remise du bâton et du diadème
  alternative: Reproduire le dialogue anglais et ajouter la ceinture ainsi que « de ton royaume »
  rationale: Le texte grec fourni ne contient ni dialogue, ni ceinture, ni complément royal dans cette clause. Ces éléments ne doivent pas être importés dans le verset traduit à partir de la source.
translation_notes:
  register: Français moderne, sobre et narratif. Le passé composé reflète directement le parfait grec dans un récit à la première personne; le vocabulaire concret de la source est conservé.
