  rationale: Suit la formulation du texte anglais du projet et la tradition de Genèse 38, tout en employant un français naturel.
- source_word: 'Genesis 38 tradition: עֵרָבוֹן / ἀρραβών'
  choice: un gage
  rationale: « Gage » désigne naturellement un objet remis comme garantie provisoire et conserve la portée concrète de l’échange.
