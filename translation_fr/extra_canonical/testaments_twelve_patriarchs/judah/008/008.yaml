  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: fr
  text: 'Et je lui dis : « Je t’enverrai un chevreau de mon troupeau. » Elle dit : « Me donneras-tu un gage jusqu’à ce que tu l’envoies ? »'
  philosophy: optimal-equivalence
