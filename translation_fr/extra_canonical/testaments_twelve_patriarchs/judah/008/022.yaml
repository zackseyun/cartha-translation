id: T12P.JUD.8.22
reference: Testament of Judah 8:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: fr
  text: Mais s’il dépasse la limite, l’esprit d’égarement s’introduit dans son esprit et pousse l’homme ivre à tenir des propos obscènes, à enfreindre la loi et à n’en éprouver aucune honte, mais plutôt à se vanter de son déshonneur et à l’estimer bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: dépasse la limite
  rationale: Rend directement l’idée de franchir une borne ou une mesure, ici dans le contexte de l’ivresse.
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: s’introduit dans son esprit
  rationale: Exprime l’irruption du mauvais esprit dans la faculté de pensée sans le surinterpréter comme une attaque explicite.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: l’esprit d’égarement
  rationale: « Égarement » conserve le champ sémantique de πλάνη, qui peut évoquer l’erreur, l’illusion ou la déviation.
- source_word: αἰσχρορρημονεῖν
  choice: tenir des propos obscènes
  rationale: Formulation française naturelle qui garde l’idée de paroles honteuses ou indécentes.
- source_word: παρανομεῖν
  choice: enfreindre la loi
  rationale: Le verbe signifie agir contrairement à la loi; cette traduction préserve sa portée morale et juridique.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: se vanter de son déshonneur
  rationale: 'Conserve le paradoxe du texte: l’homme tire fierté de ce qui devrait lui faire honte.'
- source_word: νομίζειν εἶναι καλόν
  choice: le trouver beau
  rationale: Suit le grec καλόν, « beau » ou « bon », plutôt que l’anglais de consultation « glory », qui ne correspond pas exactement au texte source.
theological_decisions:
- issue: Nature de « l’esprit d’égarement »
  choice: Maintien de la personnification sans préciser s’il s’agit d’un être spirituel distinct ou d’une influence morale
  alternative: « un esprit trompeur » ou « l’influence de l’égarement »
  rationale: Le grec emploie πνεῦμα avec l’article, mais le contexte fourni ne permet pas d’imposer une ontologie plus précise.
- issue: Sens normatif de παρανομεῖν
  choice: « enfreindre la loi »
  alternative: « commettre le mal »
  rationale: La traduction retenue garde la référence explicite à la loi contenue dans le composé grec, sans définir de quelle loi il s’agit.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la progression causale et l’accumulation du grec. « L’homme ivre » est préféré à « l’ivrogne », qui pourrait désigner une identité habituelle plutôt que l’état visé ici.
