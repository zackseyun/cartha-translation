source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: fr
  text: Car Dieu m’a donné la royauté, et à lui le sacerdoce ; et il a soumis la royauté au sacerdoce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: Dieu
  rationale: Le grec porte explicitement « Dieu », plutôt que « le Seigneur » dans la couche anglaise de consultation.
- source_word: τὴν βασιλείαν / ἡ βασιλεία
  choice: la royauté
  rationale: Dans la première proposition, le terme désigne l’autorité ou la fonction royale attribuée au locuteur. Conserver le même choix dans la seconde respecte la répétition grecque et exprime le rapport institutionnel avec le sacerdoce.
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: le sacerdoce / au sacerdoce
  rationale: Les deux substantifs grecs apparentés désignent ici la charge ou l’institution sacerdotale ; « sacerdoce » convient au registre historique et religieux.
- source_word: ὑπέταξε
  choice: a soumis
  rationale: Rend directement l’idée de placer sous l’autorité ou la subordination de, sans en atténuer la force.
theological_decisions:
- issue: Rapport entre royauté et sacerdoce
  choice: « il a soumis la royauté au sacerdoce »
  alternative: « il a placé la royauté sous l’autorité du sacerdoce »
  rationale: La formulation retenue préserve l’affirmation forte et la tension théologique du grec sans expliquer ni harmoniser la nature de cette subordination.
- issue: Identité du bénéficiaire du sacerdoce
  choice: « à lui »
  alternative: nommer explicitement Lévi
  rationale: Le grec emploie le pronom κἀκείνῳ. Garder le pronom respecte le texte fourni et son renvoi contextuel sans ajouter un nom absent du verset.
translation_notes:
  register: Français moderne, digne et accessible. La structure parallèle et la répétition de « royauté » et « sacerdoce » sont conservées. Aucun marqueur de note n’est requis.
