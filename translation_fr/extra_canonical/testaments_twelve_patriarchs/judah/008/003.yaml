source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
  note: 'Greek from Charles X.6 (α): Judah refuses to give Tamar to Shelah. Project ch.8 is a thematic consolidation; this verse re-flows narrative content from Charles ch.X.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: fr
  text: Je voulais aussi lui donner Shéla pour femme, mais sa mère ne l’a pas permis. Car elle avait mal agi, parce que Tamar n’était pas d’entre les filles de Canaan, comme elle-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤθελον
  choice: Je voulais
  rationale: Rend naturellement l’imparfait de volonté, qui décrit l’intention de Juda.
- source_word: τὸν Σηλὼμ
  choice: Shéla
  rationale: Emploie la forme française usuelle du nom biblique identifié dans ce passage, malgré la graphie grecque Σηλώμ.
- source_word: δοῦναι αὐτῇ
  choice: lui donner Shéla pour mari
  rationale: Le grec dit littéralement « le lui donner »; le contexte matrimonial permet d’expliciter sobrement « pour mari ».
- source_word: οὐκ ἀφῆκεν
  choice: ne l’a pas permis
  rationale: Exprime l’idée d’empêcher ou de ne pas autoriser l’action envisagée.
- source_word: Ἐπονηρεύσατο
  choice: avait agi avec malveillance
  rationale: Conserve la portée morale négative du verbe sans préciser indûment la forme exacte de la conduite mauvaise.
- source_word: ἐκ τῶν θυγατέρων τῶν Χαναναίων
  choice: issue des filles de Canaan
  rationale: Reproduit l’expression généalogique et collective du grec dans un français compréhensible.
theological_decisions:
- issue: Écart substantiel entre le grec fourni et la couche anglaise de consultation
  choice: Traduire le récit attesté par le texte grec, où la mère de Shéla s’oppose au mariage en raison de l’origine de Tamar
  alternative: Suivre l’anglais, où Juda refuse lui-même par crainte de la mort de Shéla et interprète ensuite les événements comme un jugement divin
  rationale: La consigne impose de traduire d’abord les données de la langue originale; les motifs du jugement divin et des actes commis à Timna ne figurent pas dans le grec fourni et ne doivent donc pas être importés.
- issue: Référent du sujet implicite dans Ἐπονηρεύσατο et de αὐτή
  choice: Comprendre les deux comme renvoyant à la mère de Shéla
  alternative: Laisser les référents entièrement implicites
  rationale: La mère est le sujet grammatical immédiatement précédent et la comparaison oppose l’origine non cananéenne de Tamar à celle de cette mère. La formulation française conserve néanmoins le pronom « elle ».
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche du grec tout en explicitant seulement le cadre matrimonial nécessaire à la compréhension. Aucun élément propre à la version anglaise divergente n’a été ajouté.
