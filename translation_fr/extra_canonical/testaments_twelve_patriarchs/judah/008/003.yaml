revisions:
- from: Je voulais aussi lui donner Shéla pour mari, mais sa mère ne l’a pas permis. Elle avait en effet agi avec malveillance, parce que Tamar n’était pas issue des filles de Canaan comme elle-même.
  to: Je voulais aussi lui donner Shéla pour femme, mais sa mère ne l’a pas permis. Car elle avait mal agi, parce que Tamar n’était pas d’entre les filles de Canaan, comme elle-même.
  rationale: La révision conserve le récit du texte grec et ne reprend aucun élément absent de celui-ci dans l’audit anglais. Elle améliore seulement l’idiomaticité du français pour l’expression matrimoniale et l’origine « d’entre les filles de Canaan ». Les pronoms et la comparaison finale conservent le renvoi contextuel à la mère de Shéla, sans ajouter d’explication doctrinale ou historique.
