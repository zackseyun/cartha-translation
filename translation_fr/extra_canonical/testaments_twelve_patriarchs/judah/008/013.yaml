id: T12P.JUD.8.13
reference: Testament of Judah 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: fr
  text: 'Quelques jours plus tard, on apprit que Tamar s’était prostituée et qu’elle était enceinte. Quand je l’appris, je dis : « Faites-la sortir, et qu’elle soit brûlée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινάς
  choice: Quelques jours plus tard
  rationale: Suit directement la leçon grecque α, « après quelques jours », sans importer les « trois mois » de la tradition de la Genèse ni de la couche anglaise de consultation.
- source_word: ἠκούσθη
  choice: on apprit
  rationale: Rend naturellement le passif impersonnel grec « il fut entendu/rapporté », sans ajouter de locuteur ni le contenu absent « ta belle-fille ».
- source_word: ἐκπεπόρνευκε
  choice: s’était prostituée
  rationale: Le parfait grec présente l’acte comme accompli avec une situation qui en résulte; cette formulation française demeure directe sans ajouter un jugement interprétatif.
- source_word: ἐν γαστρὶ ἔχει
  choice: était enceinte
  rationale: Équivalent français actuel et idiomatique de l’expression littérale « avoir dans le ventre ».
- source_word: καυθήτω
  choice: qu’elle soit brûlée
  rationale: Préserve le passif impératif et la dureté de la sentence sans préciser un mode d’exécution que le grec ne développe pas.
theological_decisions:
- issue: Ajouts narratifs provenant de Genèse 38 ou de la version anglaise
  choice: Ne conserver que les éléments attestés dans le texte grec fourni
  alternative: Ajouter « après trois mois », « ta belle-fille », « voici » et l’aveuglement orgueilleux de Juda
  rationale: Ces précisions ne figurent pas dans la leçon grecque α citée; les introduire remplacerait la source immédiate par une harmonisation avec une autre tradition.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct n’est ouvert qu’au commandement de Juda, conformément à la syntaxe grecque; le premier rapport demeure au discours indirect.
