  text: '*Καὶ ὡς συνήλθον αὐτῇ συνελήφθη. 5. Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα,'
  language: Greek
  note: 'Greek from Charles XII.4c-5a (α): the union and Judah''s unawareness. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: fr
  text: Et lorsque je me fus uni à elle, elle devint enceinte. Mais moi, j’ignorais ce que j’avais fait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec fourni dit simplement : « j’ignorais ce que j’avais fait ». Il ne mentionne ici ni le vin comme cause de cette ignorance ni le fait que Juda ne l’aurait pas reconnue en partant.'
    reason: Signaler sobrement que des précisions présentes dans la couche anglaise ne figurent pas dans l’extrait grec servant de source à ce verset.
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: je me fus uni à elle
  rationale: Le verbe συνέρχομαι avec le datif est ici un euphémisme pour une relation sexuelle. « S’unir à elle » reste digne et naturel tout en conservant l’expression indirecte du grec.
- source_word: συνελήφθη
  choice: elle devint enceinte
  rationale: Dans ce contexte, le passif de συλλαμβάνω signifie concevoir ou devenir enceinte. Cette formulation française est claire sans préciser explicitement « de moi », absent du texte grec fourni.
- source_word: Ἀγνοῶν δὲ ἐγώ
  choice: Quant à moi, j’ignorais
  rationale: Cette tournure restitue le contraste marqué par δέ et l’insistance du pronom ἐγώ.
- source_word: ὃ ἐποίησα
  choice: ce que j’avais fait
  rationale: Le plus-que-parfait rend naturellement en français l’antériorité de l’acte par rapport à l’ignorance rapportée.
theological_decisions:
- issue: Cause de l’ignorance de Juda
  choice: Ne pas attribuer explicitement son ignorance au vin
  alternative: « À cause du vin, je ne me rendis pas compte de ce que j’avais fait »
  rationale: Le fragment grec fourni dit seulement que Juda ignorait ce qu’il avait fait. La cause liée au vin appartient à un contexte textuel plus large ou à la couche anglaise, mais elle n’est pas exprimée dans cette unité source.
- issue: Reconnaissance de la femme au départ
  choice: Ne pas ajouter qu’il ne la reconnut pas en partant
  alternative: « et je ne la reconnus pas lorsque je partis »
  rationale: Cette proposition figure dans le texte anglais de consultation, mais pas dans le grec fourni. La traduction privilégie donc l’attestation directe de la source originale.
translation_notes:
  register: Français international moderne, digne et accessible. L’euphémisme sexuel du grec est conservé par « s’unir à elle ». La formulation suit strictement le fragment grec attesté, sans importer les expansions de la couche anglaise.
