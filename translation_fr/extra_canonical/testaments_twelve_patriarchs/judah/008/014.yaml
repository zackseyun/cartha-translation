  source_fidelity: 'Le projet suit fidèlement le grec α fourni : il rend ἀπέστειλε πρός με λέγουσα sans ajouter l’idée d’un envoi secret ni celle d’une sortie, traduit ἐν γαστρὶ ἔχω par « je suis enceinte », et maintient la liste et l’ordre δακτύλιος, ῥάβδος, διάδημα (« anneau, bâton, diadème »). Il convient de ne pas suivre ici la formulation anglaise lorsqu’elle reflète une autre couche textuelle.'
