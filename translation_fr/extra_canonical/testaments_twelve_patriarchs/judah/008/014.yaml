id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: fr
  text: 'Mais elle m’envoya dire : « Je suis enceinte de l’homme à qui appartiennent ces objets. Reconnais donc à qui appartiennent l’anneau, le bâton et le diadème. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε πρός με λέγουσα
  choice: elle m’envoya dire
  rationale: Rend naturellement l’idée d’envoyer un message à quelqu’un en disant, sans ajouter la notion de secret, absente du grec fourni.
- source_word: ἐν γαστρὶ ἔχω
  choice: je suis enceinte
  rationale: Expression française courante et exacte pour l’idiome grec signifiant littéralement « avoir dans le ventre ».
- source_word: ἐπίγνωθι
  choice: reconnais
  rationale: Impératif invitant Juda à identifier le propriétaire des objets; conserve la force de l’appel à reconnaître.
- source_word: ὁ δακτύλιος
  choice: l’anneau
  rationale: Correspond au grec de la recension α; évite de substituer la ceinture attestée dans une autre tradition ou un autre passage.
- source_word: ἡ ῥάβδος
  choice: le bâton
  rationale: Équivalent direct, adapté à l’objet personnel mentionné dans le récit.
- source_word: τὸ διάδημα
  choice: le diadème
  rationale: Transposition française précise du terme grec, qui désigne un bandeau ou insigne de rang.
theological_decisions:
- issue: Relation entre la grossesse et le propriétaire des objets
  choice: « de l’homme à qui appartiennent ces objets »
  alternative: « de l’homme dont ces objets sont à lui »
  rationale: Formulation française claire qui conserve l’identification probante voulue par le grec sans expliciter davantage l’identité de l’homme.
- issue: Divergence avec la couche anglaise consultative
  choice: Suivre l’ordre grec « anneau, bâton et diadème » et ne pas ajouter l’envoi secret ni la sortie de la femme
  alternative: 'Suivre l’anglais : « le bâton, la ceinture et le diadème », avec « comme on la faisait sortir » et « secrètement »'
  rationale: Le texte grec fourni ne contient ni la sortie ni le caractère secret et atteste explicitement δακτύλιος, ῥάβδος, διάδημα. La traduction privilégie donc la source originale indiquée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde l’ordre et le contenu de la recension grecque α fournie, tout en employant une syntaxe naturelle.
