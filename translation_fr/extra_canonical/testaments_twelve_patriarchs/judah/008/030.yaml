id: T12P.JUD.8.30
reference: Testament of Judah 8:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
  note: Greek from Charles XVIII.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: fr
  text: Il entrave les sacrifices offerts à Dieu et ne se souvient pas de la bénédiction de Dieu. Il n’écoute pas un prophète qui parle et s’irrite contre les paroles de piété.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμποδίζει
  choice: fait obstacle à
  rationale: Le grec est actif, « empêcher, entraver », plutôt que passif comme dans la consultation anglaise. Le complément implicite est rendu par « sacrifices offerts à Dieu » pour obtenir un français naturel.
- source_word: εὐλογίαν Θεοῦ
  choice: la bénédiction de Dieu
  rationale: Conserve le génitif grec sans trancher entre la bénédiction venant de Dieu et la bénédiction adressée à Dieu.
- source_word: οὐ μνημονεύει
  choice: ne se souvient pas de
  rationale: Rend directement le sens de μνημονεύω et préserve l’idée d’un oubli ou d’une absence de rappel.
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  choice: Il n’écoute pas le prophète qui parle
  rationale: Reproduit la construction au génitif absolu dans un ordre français idiomatique, sans ajouter l’idée qu’il entend effectivement le prophète.
- source_word: προσοχθίζει
  choice: s’irrite contre
  rationale: Exprime l’hostilité ou l’indignation marquée du verbe sans reprendre le doublet explicatif « offended and angered » de l’anglais.
- source_word: λόγους εὐσεβείας
  choice: les paroles de piété
  rationale: Rendu formel de l’expression, où εὐσέβεια désigne la piété ou la révérence religieuse.
theological_decisions:
- issue: Sens du génitif dans « εὐλογίαν Θεοῦ »
  choice: la bénédiction de Dieu
  alternative: le fait de bénir Dieu
  rationale: Le génitif grec est réellement ambigu. La formulation française conserve cette tension au lieu d’imposer une lecture objective ou subjective.
- issue: Objet de l’entrave aux sacrifices
  choice: Il fait obstacle aux sacrifices offerts à Dieu
  alternative: Il est empêché d’offrir des sacrifices à Dieu
  rationale: La forme grecque ἐμποδίζει est à la voix active. La traduction suit cette donnée plutôt que la lecture passive de la couche anglaise.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant une tournure artificielle. Aucun marqueur de note n’est requis puisqu’aucune note de bas de page n’est ajoutée.
