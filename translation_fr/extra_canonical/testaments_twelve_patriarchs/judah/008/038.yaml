review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle est bien rendue et la comparaison ajoutée dans la version anglaise est justement absente. Toutefois, « par des péchés » est moins exact que « à cause de péchés », et « à moins que » alourdit inutilement la construction grecque ἐὰν μὴ. La finale grecque demeure syntaxiquement difficile; la traduction doit en conserver l'incertitude au moyen d'une note.
  naturalness: Le français est globalement clair, mais « Car … ainsi » et l'enchaînement avec « à moins que » sont un peu raides. « En effet » et une condition introduite par « si elle ne » produisent une phrase moderne et naturelle, sans perte de sens.
  terminology: « Prêtrise de Dieu », « royauté terrestre », « Seigneur » et « dominée » rendent adéquatement les termes centraux. « Royauté terrestre » doit être maintenu dans la finale afin de ne pas introduire sans nécessité « pouvoir royal », qui déplace légèrement le référent.
  issues:
