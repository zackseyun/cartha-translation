source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: fr
  text: En effet, la prêtrise de Dieu surpasse ainsi la royauté terrestre, si elle ne déchoit pas du Seigneur à cause de péchés et n’est pas dominée par la royauté terrestre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque finale est difficile. Elle peut aussi se comprendre : « ne soit dominée par le détenteur de la royauté terrestre » ou « par celui qui exerce le pouvoir royal terrestre ».'
    reason: Signaler sans la trancher l’ambiguïté syntaxique de διὰ τοῦ τῆς ἐπιγείου βασιλείας.
lexical_decisions:
- source_word: ὑπερέχει
  choice: surpasse
  rationale: Exprime directement la supériorité de la prêtrise sans ajouter la comparaison entre le ciel et la terre, absente du texte grec fourni.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: la prêtrise de Dieu
  rationale: Rend formellement le génitif grec tout en gardant ouverte la nuance d’appartenance ou d’institution divine.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: la royauté terrestre
  rationale: « Royauté » rend ici βασιλεία comme autorité ou régime royal plutôt que comme territoire.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: se détourne du Seigneur
  rationale: Rend l’idée d’une déchéance ou d’une rupture par rapport au Seigneur dans un français naturel, sans faire de cette chute une simple perte de statut.
- source_word: κυριευθῇ
  choice: tombe sous la domination
  rationale: Conserve la force passive du verbe, qui signifie être dominé ou assujetti.
theological_decisions:
- issue: Caractère conditionnel de la supériorité sacerdotale
  choice: à moins que…
  alternative: si toutefois elle ne…
  rationale: 'Préserve la tension du grec : la prêtrise surpasse la royauté terrestre, mais le péché peut la faire déchoir et l’assujettir.'
- issue: Comparaison du ciel et de la terre dans la consultation anglaise
  choice: ne pas l’inclure
  alternative: « Comme le ciel est plus élevé que la terre… »
  rationale: Cette comparaison ne figure pas dans le texte grec source fourni et ne doit donc pas être ajoutée au corps de la traduction.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la structure argumentative grecque, tout en évitant un calque lourd. « Prêtrise » et « royauté » maintiennent le contraste institutionnel et théologique du passage.
