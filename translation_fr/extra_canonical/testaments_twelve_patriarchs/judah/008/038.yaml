    issue: Rendu de διὰ ἁμαρτιῶν
    rationale: '« Par des péchés » peut suggérer le moyen; διὰ avec le génitif exprime ici plus naturellement la cause : « à cause de péchés ».'
  - severity: low
    issue: Construction de la condition
    rationale: « À moins que … ne » est possible, mais « si elle ne … » reflète directement ἐὰν μὴ et améliore la fluidité sans modifier la portée conditionnelle.
  - severity: low
    issue: Cohérence du terme final
    rationale: « Pouvoir royal terrestre » dans le corps du texte s'écarte de « royauté terrestre » employé pour βασιλεία. Garder le même terme préserve le lien lexical, tandis que la note explique la difficulté syntaxique.
