revisions:
- from: Car la prêtrise de Dieu surpasse ainsi la royauté terrestre, à moins que, par des péchés, elle ne se détourne du Seigneur et ne tombe sous la domination du pouvoir royal terrestre[a].
  to: En effet, la prêtrise de Dieu surpasse ainsi la royauté terrestre, si elle ne déchoit pas du Seigneur à cause de péchés et n’est pas dominée par la royauté terrestre[a].
  rationale: La révision rend plus explicitement la valeur causale de διὰ ἁμαρτιῶν, simplifie la condition selon la syntaxe grecque et harmonise la traduction de βασιλεία. La note, correctement ancrée, conserve l’ambiguïté réelle de la construction finale sans imposer une interprétation.
