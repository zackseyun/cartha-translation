id: T12P.JUD.8.26
reference: Testament of Judah 8:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: fr
  text: Et l’ange de Dieu me montra que les femmes ont pouvoir sur le roi et dominent le pauvre. Au roi, elles enlèvent sa gloire ; à l’homme, sa force ; et au pauvre, jusqu’au moindre soutien de sa pauvreté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec de la dernière proposition est grammaticalement irrégulier ; littéralement, il évoque « le moindre soutien de la pauvreté ».
    reason: Signaler honnêtement la difficulté textuelle tout en donnant dans le corps une formulation française intelligible.
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: tiennent le roi sous leur pouvoir
  rationale: Rend naturellement l’idée de maîtrise ou d’emprise exprimée par κρατέω avec le génitif, sans ajouter la notion de durée absente du grec.
- source_word: κατακυριεύουσιν
  choice: dominent
  rationale: Conserve la force du verbe, qui indique l’exercice d’une autorité contraignante sur quelqu’un.
- source_word: τὴν δόξαν
  choice: sa gloire
  rationale: 'Le possessif français explicite le rapport génitif naturel: la gloire du roi.'
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: à l’homme, sa force
  rationale: Suit la distinction du texte grec entre le roi et l’homme, plutôt que d’identifier cet homme à un «homme fort» comme le fait la couche anglaise.
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: jusqu’au moindre soutien dans sa pauvreté
  rationale: Restitue le sens malgré la construction grecque irrégulière; «jusqu’au» exprime que même cette ressource minime est retirée.
theological_decisions:
- issue: Portée de l’affirmation sur «les femmes»
  choice: Conserver la formulation générale du texte
  alternative: Atténuer par «certaines femmes» ou préciser un contexte particulier
  rationale: Le grec emploie l’article et le pluriel αἱ γυναῖκες sans restriction explicite; une atténuation interprétative ne serait pas fondée sur la source fournie.
- issue: Notion de domination perpétuelle
  choice: Ne pas traduire «forever»
  alternative: «règnent toujours» ou «dominent pour toujours»
  rationale: Aucun terme grec ne correspond à «forever»; κρατοῦσι décrit ici l’emprise, non sa durée.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle «au roi… à l’homme… au pauvre…» préserve la progression rhétorique du grec. Le texte garde la dureté de la généralisation originale sans l’accentuer ni l’atténuer.
