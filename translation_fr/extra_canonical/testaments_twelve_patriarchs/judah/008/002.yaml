  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: fr
  text: Cette femme m’enfanta Er, Onan et Shéla. Le Seigneur fit mourir les deux premiers, car Shéla vécut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτεκέν μοι
  choice: Elle me donna
  rationale: Expression française naturelle qui conserve l’idée qu’elle enfanta ces fils à Juda.
- source_word: ἀνεῖλεν
  choice: fit mourir
  rationale: Rend clairement l’action causative attribuée au Seigneur, dans un registre digne, sans l’atténuer ni employer le plus abrupt « tua ».
- source_word: ἔζησεν
  choice: resta en vie
  rationale: Dans le contraste avec la mort des deux premiers, cette formulation exprime naturellement la survie de Shéla.
theological_decisions:
- issue: Motif de la mort d’Er et d’Onan
  choice: Ne pas ajouter de motif absent du texte grec fourni
  alternative: Reprendre l’expansion de la couche anglaise sur la méchanceté d’Er et l’acte d’Onan
  rationale: Le témoin grec cité dit seulement que le Seigneur fit mourir les deux premiers et que Shéla vécut. Ajouter l’expansion anglaise substituerait une forme textuelle non attestée ici à la source grecque désignée.
- issue: Agent de la mort
  choice: Conserver explicitement « Le Seigneur » comme sujet
  alternative: Employer une tournure passive telle que « les deux premiers moururent »
  rationale: Le grec attribue directement l’action à Κύριος; cette tension théologique ne doit pas être estompée.
translation_notes:
  register: Français international moderne, simple et digne. Les noms propres suivent les formes françaises bibliques usuelles. La relation logique introduite par γάρ est rendue par « tandis que », car le fait que Shéla resta vivant explique ici l’expression « les deux premiers » plutôt qu’une cause au sens strict.
