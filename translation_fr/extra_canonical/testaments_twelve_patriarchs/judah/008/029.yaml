- from: Elle prive son âme de toute bonté, le tient accablé de peines et de fatigues, chasse loin de lui le sommeil et consume sa chair.
  to: Cela prive son âme de toute bonté, l’accable de peines et de fatigues, chasse loin de lui le sommeil et consume sa chair.
  rationale: Révision limitée à la neutralisation du sujet elliptique, dont le genre ne peut être établi à partir de l’extrait grec, et à une formulation française plus directe pour συνέχει. Le parallélisme et les images corporelles du grec sont conservés; aucune note n’est nécessaire.
