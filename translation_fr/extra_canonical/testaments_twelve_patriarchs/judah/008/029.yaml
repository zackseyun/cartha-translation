source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: fr
  text: Cela prive son âme de toute bonté, l’accable de peines et de fatigues, chasse loin de lui le sommeil et consume sa chair.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: prive
  rationale: Rend directement l’idée de dépouiller ou de priver. Le sujet féminin singulier, fourni par le contexte antérieur de l’œuvre, est conservé par « elle ».
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: son âme
  rationale: Correspondance formelle naturelle en français, sans réduire ψυχή à la seule vie physique.
- source_word: πάσης ἀγαθότητος
  choice: toute bonté
  rationale: Préserve le sens moral et qualitatif de ἀγαθότης sans préciser indûment s’il s’agit de vertu, de bien ou de bienfait.
- source_word: συνέχει αὐτὸν
  choice: le tient accablé
  rationale: συνέχει exprime ici une contrainte persistante; cette formulation idiomatique conserve l’idée d’être maintenu sous l’emprise des souffrances.
- source_word: πόνοις καὶ μόχθοις
  choice: peines et fatigues
  rationale: Distingue les souffrances ou peines de πόνοι des labeurs épuisants de μόχθοι, dans un français courant et digne.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: chasse loin de lui le sommeil
  rationale: 'Le verbe rare ou textuellement difficile est rendu selon son sens contextuel manifeste: faire partir le sommeil de la personne.'
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: consume sa chair
  rationale: καταδαπανάω indique une consommation ou un épuisement complet; le singulier collectif « sa chair » est naturel en français pour le pluriel grec σάρκας.
theological_decisions: []
