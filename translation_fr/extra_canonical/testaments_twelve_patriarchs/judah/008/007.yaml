    issue: Ambiguïté française de « je me détournai vers elle »
    rationale: En français moderne, se détourner de quelqu’un signifie normalement s’en éloigner ou cesser de lui prêter attention. Le participe ἐκκλίνας indique bien un détour, mais πρὸς αὐτήν établit que le mouvement est dirigé vers elle. « Je me tournai vers elle » rend cette orientation sans contresens pragmatique.
