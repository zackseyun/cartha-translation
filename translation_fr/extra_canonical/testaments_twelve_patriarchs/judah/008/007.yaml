  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/007.yaml
  text: And I turned aside to her and said, "Let me go in to you." And she said, "What will you give me, that you may come in to me?"
translation:
  language: fr
  text: 'Alors je me tournai vers elle et lui dis : « Je vais entrer chez toi. » Elle répondit : « Que me donneras-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: je me détournai vers elle
  rationale: Rend le mouvement d’écart ou de détour exprimé par ἐκκλίνω, tout en conservant l’orientation vers la femme.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Je vais entrer chez toi
  rationale: Formulation naturelle qui préserve l’euphémisme sexuel du grec sans l’expliciter ni l’atténuer artificiellement.
- source_word: Τί μοι δώσεις;
  choice: Que me donneras-tu ?
  rationale: Traduction directe de la question grecque, sans ajouter la proposition explicative présente dans l’anglais mais absente de la source fournie.
theological_decisions:
- issue: Degré d’explicitation de la relation sexuelle
  choice: Conserver l’euphémisme « entrer chez toi »
  alternative: « coucher avec toi » ou « avoir des relations avec toi »
  rationale: Le grec emploie une expression indirecte; l’expliciter supprimerait une ambiguïté stylistique authentique et ajouterait une interprétation.
translation_notes:
  register: Français moderne, narratif et digne. Le discours reste bref comme dans le grec. Aucun ajout n’est fait à la seconde question.
