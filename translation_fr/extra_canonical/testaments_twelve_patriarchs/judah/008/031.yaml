source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: fr
  text: Car il est esclave de deux passions contraires et ne peut obéir à Dieu, parce que son âme a été aveuglée, et il marche de jour comme de nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν ἐναντίοις
  choice: passions opposées
  rationale: « Passions » conserve la force intérieure et moralement contraignante de πάθη, tandis qu’« opposées » rend directement ἐναντίοις.
- source_word: δουλεύει
  choice: est esclave de
  rationale: Cette formulation exprime naturellement en français l’asservissement indiqué par le verbe grec, plus fortement que « sert ».
- source_word: ὑπακοῦσαι
  choice: obéir
  rationale: Équivalent direct et courant du verbe grec, qui marque l’obéissance à Dieu.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: elles ont aveuglé son âme
  rationale: Le sujet pluriel implicite renvoie aux deux passions; le parfait français rend ici naturellement l’effet acquis de l’aoriste grec.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: il marche en plein jour comme dans la nuit
  rationale: « En plein jour » souligne le contraste imagé sans modifier son sens; « marche » conserve la métaphore de la conduite.
theological_decisions:
- issue: Rapport entre les deux passions et l’incapacité d’obéir à Dieu
  choice: Conserver l’enchaînement causal du grec sans préciser la nature des passions.
  alternative: Identifier explicitement les passions d’après le contexte élargi.
  rationale: Le verset fourni ne les nomme pas; les identifier ici importerait une interprétation contextuelle dans le texte.
- issue: Référent du sujet de « ont aveuglé »
  choice: Employer le pluriel « elles », renvoyant aux deux passions.
  alternative: Employer le singulier « cela » ou reformuler sans sujet explicite.
  rationale: ἐτύφλωσε est singulier dans le texte grec transmis, mais l’anglais audité et le sens immédiat rapportent l’aveuglement aux deux passions. Le français exige un sujet explicite; le pluriel rend le lien sémantique le plus naturel tout en suivant la compréhension du texte de consultation.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve l’image morale de l’âme aveuglée et de la marche nocturne en plein jour.
