base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: fr
  text: Après avoir bu du vin, je n’ai pas respecté le commandement de Dieu et j’ai pris pour femme une Cananéenne. En effet, celui qui boit du vin doit faire preuve d’un grand discernement[a], mes enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec fourni s’interrompt au milieu de cette proposition, littéralement : « En effet, grande… pour celui qui boit du vin, mes enfants. » La fin de la phrase est donc restituée d’après le sens transmis par la tradition éditoriale consultée.'
    reason: Signaler honnêtement que le prédicat de la seconde phrase est absent du fragment grec fourni et que « doit faire preuve d’un grand discernement » est une restitution.
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: Après avoir bu du vin
  rationale: Rend naturellement le participe aoriste circonstanciel et conserve le lien temporel et causal implicite avec la conduite qui suit.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: je n’ai pas respecté le commandement de Dieu
  rationale: Dans cette construction, le verbe exprime l’absence de considération ou de retenue devant le commandement; «je n’ai pas eu honte du commandement» serait trompeur en français.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: j’ai pris pour femme une Cananéenne
  rationale: Formulation française actuelle qui conserve l’expression sémitisante du mariage et l’identité cananéenne de la femme.
- source_word: Πολλὴ γὰρ τῷ πίνοντι οἶνον
  choice: En effet, celui qui boit du vin doit faire preuve d’un grand discernement
  rationale: Le grec fourni est tronqué après l’adjectif féminin πολλή; le sens complété est rendu d’après la couche de consultation anglaise auditée, sans présenter cette reconstruction comme textuellement certaine.
theological_decisions:
- issue: Portée du commandement de Dieu
  choice: Conserver la formulation générale «le commandement de Dieu»
  alternative: Préciser qu’il s’agit de l’interdiction d’épouser une Cananéenne
  rationale: Le texte relie les deux éléments mais ne définit pas explicitement le contenu du commandement; la traduction ne doit pas résoudre cette relation au-delà de ce qui est écrit.
translation_notes:
  register: Français international moderne, clair et digne. Le tour «pris pour femme» garde une légère couleur ancienne appropriée au testament patriarcal, tandis que «faire preuve d’un grand discernement» reste immédiatement compréhensible.
