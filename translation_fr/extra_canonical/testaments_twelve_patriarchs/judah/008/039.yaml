id: T12P.JUD.8.39
reference: Testament of Judah 8:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: fr
  text: 'Car l’ange du Seigneur m’a dit : « C’est lui[a] que le Seigneur a choisi plutôt que toi pour s’approcher de lui, manger à sa table et lui offrir les prémices des mets délicieux des fils d’Israël. Mais toi, tu seras roi de Jacob.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Lévi.
    reason: Le grec emploie seulement le pronom emphatique « lui »; le contexte en précise le référent.
  - marker: b
    text: Le texte grec utilisé s’arrête ici; il ne comporte pas les mots « comme un lion », présents dans certaines formulations inspirées de la tradition plus large du Testament de Juda.
    reason: Signaler avec transparence l’écart entre le témoin grec α et la version anglaise de consultation.
lexical_decisions:
- source_word: Αὐτὸν
  choice: C’est lui
  rationale: Conserve le pronom emphatique du grec plutôt que d’introduire directement le nom de Lévi dans le texte; le contexte identifie le référent.
- source_word: ὑπὲρ σὲ
  choice: plutôt que toi
  rationale: Exprime ici l’idée comparative de préférence ou de choix en faveur de l’un par rapport à l’autre.
- source_word: προσεγγίζειν αὐτῷ
  choice: pour s’approcher de lui
  rationale: Rend directement le langage cultuel de l’approche de Dieu sans en préciser davantage la fonction.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: manger à sa table
  rationale: Formulation française naturelle qui garde l’image de la table et la proximité qu’elle implique.
- source_word: ἀπαρχὰς … ἐντρυφημάτων
  choice: les prémices des mets délicieux
  rationale: Maintient à la fois la notion cultuelle des premières parts offertes et celle de mets agréables ou raffinés.
- source_word: βασιλεὺς Ἰακώβ
  choice: roi de Jacob
  rationale: Suit la formulation concise du témoin grec, où Jacob désigne collectivement sa descendance.
theological_decisions:
- issue: Identification de celui que le Seigneur a choisi
  choice: Maintenir « lui » dans le texte et identifier Lévi en note
  alternative: Traduire directement « Lévi » comme dans la version anglaise de consultation
  rationale: Le grec porte un pronom emphatique, non le nom propre; la note permet la compréhension sans effacer la forme du texte source.
- issue: Fonctions respectives de Lévi et de Juda
  choice: Conserver le contraste entre l’approche cultuelle de l’un et la royauté de l’autre
  alternative: Résumer par une royauté exercée ensemble auprès de Dieu
  rationale: Le grec distingue les rôles et ne dit pas que Juda sera roi « avec » Lévi.
- issue: Image finale du lion
  choice: Ne pas l’intégrer au texte
  alternative: Ajouter « comme un lion », selon la version anglaise du projet et la tradition thématique plus large
  rationale: La leçon grecque α citée s’achève sur « roi de Jacob » et ne contient pas ὡς λέων.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe garde le discours direct et le parallélisme des deux vocations. « Fils d’Israël » est conservé comme désignation traditionnelle du peuple, et « roi de Jacob » maintient la métonymie du grec.
