    issue: Accord verbal non conforme à la construction collective du grec
    rationale: Le brouillon emploie des verbes pluriels (« détournent », « aveuglent », etc.) après « ces choses », tandis que l’édition grecque donne systématiquement le singulier. « Tout cela » restitue naturellement en français ce pluriel neutre conçu comme un ensemble et permet de conserver le singulier.
