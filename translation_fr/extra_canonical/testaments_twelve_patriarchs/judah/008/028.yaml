id: T12P.JUD.8.28
reference: Testament of Judah 8:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: fr
  text: Car tout cela détourne de la loi de Dieu, aveugle le discernement de l’âme, enseigne l’orgueil et empêche un homme d’avoir compassion de son prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Conserve le renvoi pluriel au contexte antérieur sans en préciser artificiellement le contenu.
- source_word: ἀφιστᾷ
  choice: détournent
  rationale: Exprime naturellement l’idée d’éloigner ou de faire dévier de la loi de Dieu.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: le discernement de l’âme
  rationale: διαβούλιον désigne ici la faculté de délibération ou de jugement intérieur; « discernement » reste clair tout en préservant cette portée.
- source_word: ὑπερηφανίαν
  choice: l’orgueil
  rationale: Équivalent français courant et digne pour l’arrogance ou la hauteur condamnée par le texte.
- source_word: ἐλεῆσαι
  choice: avoir compassion de
  rationale: Rend la disposition et l’acte de miséricorde envers le prochain sans réduire le sens à une aide matérielle.
- source_word: τὸν πλησίον αὐτοῦ
  choice: son prochain
  rationale: Expression française consacrée et naturelle qui correspond précisément au rapport de proximité visé.
theological_decisions:
- issue: Sujet implicite de ἀφιστᾷ
  choice: Ne pas ajouter de complément humain après « détournent »
  alternative: « détournent une personne de la loi de Dieu »
  rationale: Le grec n’exprime pas explicitement l’objet de ce verbe. La formulation française permet de conserver cette ellipse sans imposer le genre ni expliciter davantage que la source.
- issue: Portée anthropologique de ψυχή
  choice: « âme »
  alternative: « être intérieur » ou « esprit »
  rationale: « âme » maintient le terme anthropologique traditionnel et la tension du texte sans l’identifier plus étroitement à l’intellect ou à l’esprit.
- issue: Référent de « ces choses »
  choice: Conserver le démonstratif non explicité
  alternative: Nommer les vices évoqués dans le contexte consolidé
  rationale: La source grecque renvoie simplement à ταῦτα; préciser le référent importerait une interprétation contextuelle absente du verset.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée du grec est légèrement fluidifiée, tout en conservant la progression des quatre effets. Aucun marqueur de note n’est nécessaire.
