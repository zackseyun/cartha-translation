revisions:
- from: Car c’est à cause de lui que le Seigneur choisira parmi vous la royauté, et parmi les descendants de Lévi le sacerdoce, afin que le Seigneur soit pour tous les peuples et pour la descendance d’Israël.[a]
  to: Car c’est à cause de lui que le Seigneur choisira parmi vous la royauté, et de Lévi le sacerdoce, afin que le Seigneur soit le Seigneur de tous les peuples et de la descendance d’Israël.[a]
  rationale: La révision retire l’ajout « descendants de », absent de la formulation anglaise, et améliore une tournure française sans résoudre les ambiguïtés du texte reçu. La note, correctement ancrée en fin de verset et fidèle à l’état du témoin α, est conservée.
