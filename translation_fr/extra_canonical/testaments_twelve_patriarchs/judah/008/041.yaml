  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: fr
  text: Car c’est à cause de lui que le Seigneur choisira parmi vous la royauté, et de Lévi le sacerdoce, afin que le Seigneur soit le Seigneur de tous les peuples et de la descendance d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset n’a pas de contrepartie directe dans le témoin grec α de l’édition Charles (1908). Sa formulation est une synthèse homilétique de thèmes présents ailleurs dans le Testament de Juda, notamment XXII.2-3, qui annonce la venue du salut d’Israël, et XXIV.6, qui parle de juger et de sauver tous ceux qui invoquent le Seigneur. Les précisions sur la royauté issue de Juda et le sacerdoce issu de Lévi ne se trouvent pas réunies dans un seul verset grec correspondant.
    reason: Signaler clairement que le texte français traduit la couche de consultation anglaise et une synthèse thématique, non un verset grec α directement attesté.
lexical_decisions:
- source_word: βασιλεία / ἱερωσύνη (thème absent de ce passage dans le témoin α)
  choice: royauté / sacerdoce
  rationale: Ces termes rendent avec dignité les deux institutions évoquées par la couche anglaise, sans préciser indûment une forme particulière de monarchie ou de prêtrise.
- source_word: ἔθνη / γένος Ἰσραήλ (formulation de la couche anglaise, sans équivalent α direct ici)
  choice: tous les peuples / la descendance d’Israël
  rationale: « Peuples » est naturel en français moderne pour les nations, tandis que « descendance » évite les connotations modernes et biologisantes de « race ».
- source_word: δι’ αὐτόν (présupposé par « because of him », sans texte grec direct pour ce verset)
  choice: à cause de lui
  rationale: Le pronom demeure volontairement non explicité afin de préserver l’ambiguïté de la formulation reçue.
theological_decisions:
- issue: Rapport entre la royauté de Juda et le sacerdoce de Lévi
  choice: Maintenir les deux fonctions parallèles sans expliquer leur rapport.
  alternative: Fusionner les deux fonctions, les hiérarchiser ou identifier explicitement leur accomplissement.
  rationale: La formulation transmise les juxtapose; toute harmonisation introduirait une lecture confessionnelle absente du témoin fourni.
- issue: Portée universelle et Israël
  choice: Conserver côte à côte « tous les peuples » et « la descendance d’Israël ».
  alternative: Absorber Israël dans l’ensemble des peuples ou opposer les deux groupes.
  rationale: Cette construction préserve la tension théologique de la couche anglaise sans résoudre la relation entre universalité et particularité d’Israël.
- issue: Absence de contrepartie directe dans le témoin grec α
  choice: Publier la formulation reçue avec une note critique explicite.
  alternative: La présenter sans réserve comme une traduction directe du grec, ou la supprimer.
  rationale: La note distingue honnêtement traduction et synthèse homilétique tout en conservant le verset demandé dans le projet.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Descendance d’Israël » remplace « race d’Israël », devenu trompeur en français actuel. La répétition de « le Seigneur » et l’ambiguïté de « lui » sont conservées pour ne pas lisser la formulation théologique.
