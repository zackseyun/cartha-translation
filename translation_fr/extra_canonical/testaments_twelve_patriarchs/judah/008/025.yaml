source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: fr
  text: 'Et, de fait, je me suis repenti de ces actes : je n’ai consommé ni vin ni viande jusqu’à ma vieillesse, et je n’ai connu aucune réjouissance.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Et, de fait
  rationale: Rend la valeur emphatique de καίγε dans un français naturel et soutenu.
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: je me suis repenti de ces actes
  rationale: Le participe aoriste est rendu par une proposition coordonnée; «ces actes» renvoie aux faits précédents sans atténuer la portée morale de μετανοέω.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: je n’ai consommé ni vin ni viande
  rationale: Le verbe ἐσθίω peut ici s’appliquer par extension au vin et à la viande; «consommer» évite l’incongruité de «manger du vin» tout en conservant le parallélisme.
- source_word: ἕως γήρους μου
  choice: jusqu’à ma vieillesse
  rationale: Traduction directe indiquant que l’abstinence s’est prolongée jusqu’au grand âge, sans préciser davantage le terme temporel.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: je n’ai connu aucune réjouissance
  rationale: «Connaître» rend idiomatiquement «voir» au sens d’éprouver ou de goûter; «réjouissance» conserve la nuance de joie festive d’εὐφροσύνη.
theological_decisions:
- issue: Nature et portée de la pénitence
  choice: Conserver l’énoncé factuel de repentance, d’abstinence et de privation de réjouissance
  alternative: Présenter ces pratiques comme une expiation méritoire ou une prescription religieuse générale
  rationale: Le grec rapporte la conduite personnelle de Juda sans expliciter sa valeur sotériologique ni en faire une règle universelle.
translation_notes:
  register: Français moderne, international et dignifié. La syntaxe reste proche du grec tout en évitant des tournures artificielles; aucune note n’est nécessaire.
