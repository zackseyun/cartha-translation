  source_fidelity: Le texte français rend fidèlement Καίγε comme une insistance («Et, de fait»), le participe μετανοήσας par une action antérieure de repentance, l’abstinence de vin et de viande, la borne temporelle ἕως γήρους μου, et la privation totale de joie exprimée par πᾶσαν εὐφροσύνην οὐκ εἶδον. «Ces actes» demeure un renvoi recevable à τούτοις dans son contexte.
