source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: fr
  text: Car l’esprit de l’immoralité sexuelle se sert du vin comme d’un serviteur pour le plaisir de l’esprit ; car tous deux font perdre le discernement à l’être humain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: l’esprit de l’immoralité sexuelle
  rationale: Rend littéralement l’idée d’un esprit caractérisé par la porneia, avec une expression moderne assez large pour ne pas réduire le terme à la seule prostitution.
- source_word: τὸν οἶνον ὡς διάκονον ἔχει
  choice: se sert du vin comme d’un serviteur
  rationale: Exprime la relation instrumentale du grec tout en conservant l’image personnifiée du vin au service de l’immoralité sexuelle.
- source_word: πρὸς τὴν ἡδονὴν τοῦ νοός
  choice: pour procurer du plaisir à l’esprit humain
  rationale: « Pour procurer » explicite la visée indiquée par πρός ; « esprit humain » distingue ici νοῦς du πνεῦμα personnifié de la première proposition.
- source_word: ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: détournent l’intelligence de l’être humain
  rationale: Préserve le mouvement exprimé par ἀφίστημι et traduit διάνοια par une faculté de discernement, sans ajouter un complément absent du grec.
theological_decisions:
- issue: Nature de « l’esprit de l’immoralité sexuelle »
  choice: Conserver la personnification sans préciser s’il s’agit d’une entité spirituelle autonome ou d’une disposition intérieure.
  alternative: Traduire par « la tendance à l’immoralité sexuelle » ou identifier explicitement un esprit mauvais.
  rationale: Le texte grec emploie πνεῦμα et laisse ouverte la portée exacte de cette expression ; la traduction ne doit pas résoudre cette ambiguïté.
- issue: Référent de « tous deux »
  choice: Laisser « tous deux » renvoyer naturellement à l’esprit de l’immoralité sexuelle et au vin.
  alternative: Remplacer par « l’immoralité sexuelle et le vin ».
  rationale: Le grec τὰ δύο ταῦτα maintient une reprise démonstrative et ne reformule pas les deux éléments.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale répétée du grec est rendue par « car » puis « en effet ». La personnification et la tension entre πνεῦμα, νοῦς et διάνοια sont conservées autant que possible sans lourdeur excessive.
