  text: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
translation:
  language: fr
  text: '1. Sachez donc, mes enfants, que deux esprits sont à l’œuvre auprès de l’être humain : l’esprit de vérité et l’esprit d’égarement. 2. Entre eux se trouve la conscience, et l’on peut pencher du côté que l’on veut.[a] 3. Chacun d’eux se reconnaît aux œuvres des humains, car il est écrit par le Seigneur dans leur poitrine, au milieu de leurs os.[b] 4. Il n’est pas de moment où un être humain puisse soustraire les œuvres des humains au regard du Seigneur, car elles sont inscrites devant lui dans leur poitrine, au milieu de leurs os.[c] 5. L’esprit de vérité accuse toutes choses ; le pécheur est consumé par son propre cœur et ne peut lever les yeux vers le juge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de ce verset est difficile : il dit littéralement qu’« entre eux » se trouve la conscience, puis emploie une relative dont le sujet de l’inclination n’est pas explicitement déterminé. La traduction conserve cette indétermination.'
    reason: textual_variant
  - marker: b
    text: Le grec des v. 3-4 est très obscur. Il dit d’abord que chacun des deux esprits se reconnaît d’après les œuvres humaines. Dans la proposition suivante, le référent de « il est écrit » n’est pas clairement exprimé; la traduction conserve l’image d’une inscription intérieure « par le Seigneur » sans décider davantage.
    reason: textual_variant
  - marker: c
    text: 'La première proposition grecque est corrompue ou lacunaire et contient littéralement l’idée qu’un être humain ne pourra pas « prendre » les œuvres des humains. La traduction suit le sens général, également retenu dans la tradition de traduction : les œuvres humaines ne peuvent être soustraites au regard du Seigneur. L’image finale de l’inscription « dans leur poitrine, au milieu de leurs os » demeure inhabituelle en grec.'
    reason: alternative_reading
lexical_decisions:
- source_word: δύο πνεύματα
  choice: deux esprits
  rationale: Le grec présente explicitement deux réalités morales et spirituelles. « Esprits » conserve cette formulation sans les réduire à de simples tendances psychologiques ni préciser leur statut ontologique.
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
  choice: sont à l’œuvre auprès de l’être humain
  rationale: Le verbe est difficile ici. Cette formulation exprime la présence active des deux esprits en rapport avec la personne, tout en évitant de décider s’ils agissent en elle ou autour d’elle.
- source_word: τὸ τῆς πλάνης
  choice: l’esprit d’égarement
  rationale: πλάνη désigne ici une déviation morale et spirituelle. « Égarement » garde l’idée de s’écarter de la vérité sans réduire le terme à une simple erreur intellectuelle ni supposer nécessairement une tromperie intentionnelle.
- source_word: συνείδησις
  choice: conscience
  rationale: Le terme désigne la faculté intérieure de discernement moral placée entre les deux orientations. Le texte grec fourni ne contient pas explicitement « de l’esprit » ou « de l’intelligence ».
- source_word: στῆθος τῶν ὀστέων
  choice: la poitrine, au milieu de leurs os
  rationale: Cette expression conserve l’image corporelle inhabituelle du grec. La rendre par « cœur » effacerait la métaphore d’une inscription intérieure et interpréterait davantage le texte.
- source_word: κατηγορεῖ
  choice: accuse
  rationale: Le verbe a une nette portée judiciaire, confirmée par la mention finale du juge. « Accuse » est direct et naturel en français.
- source_word: ἐμπεπύρισται
  choice: est consumé
  rationale: Le parfait passif évoque un pécheur embrasé ou brûlé de l’intérieur. « Est consumé » conserve l’intensité de l’image tout en restant idiomatique.
- source_word: ἆραι πρόσωπον
  choice: lever les yeux
  rationale: L’expression grecque signifie littéralement « lever le visage ». L’équivalent français « lever les yeux vers » rend naturellement l’incapacité à affronter le juge, sans perdre la scène judiciaire.
theological_decisions:
- issue: Nature des « deux esprits »
  choice: Maintenir le langage de deux esprits réellement actifs en rapport avec l’être humain.
  alternative: Les présenter comme de simples dispositions psychologiques, ou comme des êtres angéliques et démoniaques précisément définis.
  rationale: Le texte emploie πνεύματα et leur attribue une activité morale, mais ne définit pas davantage leur nature. La traduction conserve donc la tension sans imposer une ontologie ultérieure.
- issue: Liberté d’inclination de la conscience
  choice: Dire que la conscience peut pencher du côté qu’elle veut.
  alternative: Faire de l’être humain, de l’intelligence ou d’un esprit particulier le sujet explicite du choix.
  rationale: Le grec est syntaxiquement difficile, mais associe la conscience à une inclination volontaire entre les deux esprits. La formulation française préserve cette responsabilité intérieure sans développer une doctrine systématique de la volonté.
- issue: Accusation intérieure et jugement
  choice: Conserver ensemble l’accusation de l’esprit de vérité, la combustion venant du propre cœur du pécheur et l’impossibilité d’affronter le juge.
  alternative: Identifier l’accusateur à la seule conscience ou expliquer la combustion comme une peine divine externe.
  rationale: Le passage juxtapose ces images sans préciser leurs rapports. Les maintenir distinctes préserve sa tension morale et judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Être humain » rend ἄνθρωπος sans marquage sexué inutile. Les images concrètes et judiciaires du grec sont maintenues. La numérotation suit les cinq versets du texte grec fourni, qui correspondent aux v. 5-9 de la couche anglaise de consultation.
