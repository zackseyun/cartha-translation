  text: '*Καὶ οἱ ἔλαφοι⁴⁸ Ἰακὼβ⁴⁹ δραμοῦνται ἐν ἀγαλλιάσει⁴⁹, καὶ ἀετοὶ Ἰσραὴλ⁴⁹ πετασθήσονται ἐν χαρᾷ· [οἱ δὲ ἀσεβεῖς πενθήσουσι καὶ οἱ ἁμαρτωλοὶ κλαύσονται]⁵¹, καὶ πάντες οἱ λαοὶ δοξάσουσι Κύριον εἰς αἰῶνας⁵².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: fr
  text: Les cerfs de Jacob courront dans l’allégresse, et les aigles d’Israël s’envoleront dans la joie ; mais les impies seront dans le deuil et les pécheurs pleureront[a]. Tous les peuples glorifieront le Seigneur pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition « mais les impies seront dans le deuil et les pécheurs pleureront » est placée entre crochets dans l’édition grecque, ce qui signale une incertitude textuelle.
    reason: Préserver la transparence sur le statut éditorial de cette clause, absente de la couche anglaise consultative.
lexical_decisions:
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: les cerfs de Jacob
  rationale: Le texte grec de la colonne α porte explicitement « Jacob », contrairement à la couche anglaise consultative qui donne « Joseph ». « Cerfs » rend naturellement le pluriel ἔλαφοι dans ce contexte imagé.
- source_word: δραμοῦνται ἐν ἀγαλλιάσει
  choice: courront dans l’allégresse
  rationale: Cette formulation conserve le mouvement futur et la forte expression de joie sans alourdir la phrase.
- source_word: ἀετοὶ Ἰσραὴλ πετασθήσονται ἐν χαρᾷ
  choice: les aigles d’Israël prendront leur envol dans la joie
  rationale: « Prendront leur envol » exprime idiomatiquement πετασθήσονται tout en préservant l’image poétique des aigles.
- source_word: οἱ ἀσεβεῖς … οἱ ἁμαρτωλοὶ
  choice: les impies … les pécheurs
  rationale: Ces équivalents courants maintiennent la distinction entre ceux qui rejettent Dieu ou la piété et ceux qui commettent le péché.
- source_word: δοξάσουσι Κύριον εἰς αἰῶνας
  choice: glorifieront le Seigneur pour toujours
  rationale: Rendu français naturel et digne de la louange durable exprimée par le grec.
theological_decisions:
- issue: Identité patriarcale dans « οἱ ἔλαφοι Ἰακώβ »
  choice: Jacob
  alternative: Joseph
  rationale: La traduction suit d’abord le texte grec fourni, qui lit Ἰακώβ. La leçon « Joseph » de la version anglaise n’est donc pas importée.
- issue: Clause sur le deuil des impies et les pleurs des pécheurs
  choice: La conserver dans le texte avec un appel de note
  alternative: L’omettre comme dans la couche anglaise consultative
  rationale: La clause figure dans la source grecque fournie, mais entre crochets éditoriaux. Elle est donc traduite tout en signalant son statut textuel incertain.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique entre les cerfs de Jacob et les aigles d’Israël est conservé, ainsi que le contraste avec le sort des impies et des pécheurs.
