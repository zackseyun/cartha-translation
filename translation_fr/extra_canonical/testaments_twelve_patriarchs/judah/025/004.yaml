base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: fr
  text: Ceux qui sont morts dans la tristesse ressusciteront, et les pauvres, à cause du Seigneur[a], seront enrichis, et ceux qui meurent à cause du Seigneur[b] s’éveilleront à la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en raison du Seigneur ». Le grec exprime une cause ou un motif sans préciser davantage le rapport envisagé.'
    reason: Signale la portée causale de διὰ Κύριον sans imposer une interprétation théologique particulière.
  - marker: b
    text: 'Ou : « en raison du Seigneur ». L’expression grecque est la même que dans la proposition précédente et exprime une cause ou un motif; elle ne précise pas davantage la nature de cette mort.'
    reason: Préserve le parallélisme du grec et évite d’ajouter l’idée d’appartenance au Seigneur ou de martyre.
lexical_decisions:
- source_word: ἐν λύπῃ τελευτήσαντες
  choice: ceux qui seront morts dans la tristesse
  rationale: Rend le participe aoriste et la circonstance exprimée par ἐν λύπῃ sans ajouter « dans la joie », absent du texte grec fourni.
- source_word: ἀναστήσονται
  choice: ressusciteront
  rationale: Dans ce contexte eschatologique, le verbe désigne naturellement le relèvement d’entre les morts.
- source_word: οἱ πτωχοὶ … πλουτισθήσονται
  choice: les pauvres … seront enrichis
  rationale: Conserve l’opposition lexicale entre pauvreté et enrichissement ainsi que la voix passive du grec.
- source_word: οἱ ἀποθνήσκοντες
  choice: ceux qui meurent
  rationale: Reproduit la valeur du participe présent grec sans préciser indûment s’il s’agit uniquement de martyrs.
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  choice: se réveilleront pour la vie
  rationale: Préserve l’image du réveil et le mouvement ou résultat exprimé par εἰς ζωήν.
theological_decisions:
- issue: Sens de διὰ Κύριον dans les deux propositions
  choice: à cause du Seigneur
  alternative: pour le Seigneur / par le Seigneur
  rationale: La préposition διά avec l’accusatif exprime normalement la cause ou le motif. La formulation retenue conserve une certaine ouverture entre ce que le Seigneur suscite et ce qui est subi en raison de l’attachement à lui, sans transformer διά en agent explicite.
- issue: Ajout de la joie lors de la résurrection
  choice: aucun ajout
  alternative: ressusciteront dans la joie
  rationale: Le texte grec fourni dit seulement que ceux qui sont morts dans la tristesse ressusciteront; « dans la joie » ne figure pas dans cette source et ne doit donc pas être importé de la couche anglaise.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase grecque est répartie en deux phrases françaises pour plus de clarté, tout en maintenant le parallélisme. « Seront enrichis » est préféré à « deviendront riches » afin de conserver le passif, et « se réveilleront pour la vie » maintient l’image eschatologique du texte source.
