  terminology: « Ressusciteront », « seront enrichis » et « le Seigneur » sont appropriés. « À cause du Seigneur » reproduit sobrement διά Κύριον; aucune note ne doit convertir cette relation causale en appartenance au Seigneur ou en martyre explicite.
