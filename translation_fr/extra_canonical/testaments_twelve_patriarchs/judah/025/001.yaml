source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: fr
  text: 'Après cela, Abraham, Isaac et Jacob ressusciteront pour vivre. Mes frères et moi, nous serons des chefs en Israël : Lévi le premier, moi le deuxième, Joseph le troisième, Benjamin le quatrième, Siméon le cinquième, Issacar le sixième, et tous les autres dans l’ordre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεται … εἰς ζωήν
  choice: se relèveront pour la vie
  rationale: Cette formulation rend le mouvement de ἀνίστημι et sa finalité, tout en conservant la portée résurrectionnelle sans l’expliciter davantage que le grec.
- source_word: ἔξαρχοι
  choice: des chefs
  rationale: Le terme désigne des personnes qui occupent le premier rang ou dirigent. Le texte grec fourni ne comporte ni « sceptres » ni « tribus » ; « chefs en Israël » évite donc tout ajout.
- source_word: πάντες καθεξῆς
  choice: puis tous les autres dans l’ordre
  rationale: Rend naturellement l’idée d’une succession ordonnée englobant les frères non encore nommés.
theological_decisions:
- issue: Nature du relèvement d’Abraham, d’Isaac et de Jacob
  choice: se relèveront pour la vie
  alternative: ressusciteront pour vivre
  rationale: Le contexte peut évoquer la résurrection, mais la traduction retenue préserve la formulation imagée et la légère latitude lexicale de ἀνίστημι.
- issue: Fonction future de Juda et de ses frères
  choice: des chefs en Israël
  alternative: les dirigeants d’Israël
  rationale: L’indéfini correspond au prédicat grec et n’implique ni domination exclusive ni identification ajoutée avec les tribus ou des sceptres.
translation_notes:
  register: Français international moderne, clair et digne. La reprise détachée « Mes frères et moi, nous… » est idiomatique et met naturellement le groupe en relief. Les ordinaux sont formulés explicitement pour préserver la cadence de l’énumération grecque.
