  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: fr
  text: Et le Seigneur bénit Lévi ; l’ange de la présence me bénit ; les puissances de la gloire bénirent Siméon ; le ciel, Ruben ; la terre[a] ; la mer, Joseph ; les luminaires, Dan ; les délices, Nephtali ; le soleil, Gad ; la lune, Aser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec paraît incomplet à cet endroit : « la terre » n’est suivie d’aucun nom, tandis que Joseph est associé à « la mer ». D’autres formes de cette liste comportent ici plusieurs couples supplémentaires.'
    reason: Signaler une probable lacune ou corruption sans introduire dans le texte principal une reconstruction absente de la source grecque fournie.
lexical_decisions:
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: l’ange de la présence
  rationale: « Présence » exprime ici la présence personnelle et immédiate de Dieu sans réduire προσώπου au seul sens physique de « face ».
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: les puissances de la gloire
  rationale: Traduction formelle qui conserve l’expression cosmique ou angélique du grec sans en préciser abusivement le référent.
- source_word: αἱ φωστῆρες
  choice: les astres
  rationale: Dans cette série cosmique, le terme désigne naturellement les luminaires célestes ; « astres » est clair et actuel.
- source_word: ἡ τρυφή
  choice: les délices
  rationale: Le pluriel français rend naturellement l’idée d’agrément, de délice ou d’abondance portée par le singulier abstrait grec.
theological_decisions:
- issue: Agent des bénédictions après la première proposition
  choice: Répéter le verbe « bénir » dans les deux premières propositions, puis conserver l’ellipse de la liste
  alternative: Répéter « bénit » après chacun des sujets cosmiques
  rationale: Le grec n’énonce le verbe qu’une fois, mais son sens se prolonge dans la série. Une répétition limitée clarifie l’ouverture en français tout en préservant la forme solennelle et elliptique du passage.
- issue: Texte lacunaire après Ruben
  choice: Conserver « la terre » sans lui attribuer de fils et rattacher Joseph à « la mer »
  alternative: Reconstituer les couples « terre–Issacar, mer–Zabulon, montagnes–Joseph, tente–Benjamin » d’après une forme textuelle plus complète
  rationale: Le texte grec fourni ne contient ni Issacar, ni Zabulon, ni les montagnes, ni Benjamin ou la tente. Les ajouter dans le corps du texte reviendrait à substituer une reconstruction à la source primaire.
translation_notes:
  register: Français moderne, digne et lisible. La ponctuation en série conserve le caractère liturgique et elliptique du grec ; les noms suivent les formes françaises usuelles.
