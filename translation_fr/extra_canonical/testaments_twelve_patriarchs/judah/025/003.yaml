  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: fr
  text: Et vous serez le peuple du Seigneur, vous n’aurez qu’une seule langue, et il n’y aura là aucun esprit d’égarement de Béliar, car cet esprit sera jeté pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸν Κυρίου
  choice: le peuple du Seigneur
  rationale: Rend directement l’expression grecque et conserve sa portée d’appartenance collective.
- source_word: γλῶσσα μία
  choice: une seule langue
  rationale: Traduction naturelle de l’expression grecque, sans préciser si elle désigne une langue commune ou une parole unanime.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: esprit d’égarement venant de Béliar
  rationale: « Égarement » rend πλάνη sans le réduire à la seule tromperie; « venant de » laisse ouverte la nuance du génitif τοῦ Βελιάρ.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française courante qui rend la durée indéfinie ou perpétuelle de la formule grecque.
theological_decisions:
- issue: Destination du rejet de l’esprit d’égarement
  choice: Ne pas ajouter « dans le feu » au corps du texte
  alternative: « car il sera jeté dans le feu pour toujours »
  rationale: Le texte grec fourni ne contient pas εἰς τὸ πῦρ (« dans le feu »). L’anglais consultatif semble refléter une variante ou une supplétion; la traduction suit d’abord la source grecque donnée.
- issue: Référent du pronom implicite dans ἐμβληθήσεται
  choice: « il sera jeté », renvoyant à l’esprit d’égarement
  alternative: Formulation impersonnelle ou référence à Béliar
  rationale: L’antécédent grammatical le plus proche est πνεῦμα, neutre en grec mais masculin en français; la référence reste néanmoins légèrement implicite dans la source.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du grec tout en étant naturelle; « il n’y aura plus là » exprime la perspective future sans alourdir la phrase.
