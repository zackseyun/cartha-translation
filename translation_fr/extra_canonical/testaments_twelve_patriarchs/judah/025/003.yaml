- from: Et vous serez le peuple du Seigneur, avec une seule langue, et il n’y aura plus là d’esprit d’égarement venant de Béliar, car il sera jeté pour toujours.[a]
  to: Et vous serez le peuple du Seigneur, vous n’aurez qu’une seule langue, et il n’y aura là aucun esprit d’égarement de Béliar, car cet esprit sera jeté pour toujours.
