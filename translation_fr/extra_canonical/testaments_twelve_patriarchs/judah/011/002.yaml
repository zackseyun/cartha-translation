  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: fr
  text: Quand je la vis servir du vin, je fus trompé et je la pris, sans que mon père ait pris conseil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  choice: verser le vin
  rationale: Rend naturellement le participe présent désignant l’action de servir ou de verser du vin.
- source_word: ἠπατήθην
  choice: je fus trompé
  rationale: Conserve le passif grec et ne précise pas qui ou quoi a causé la tromperie.
- source_word: ἔλαβον αὐτήν
  choice: je la pris pour femme
  rationale: Dans ce contexte, l’expression désigne vraisemblablement l’union matrimoniale; cette tournure française reste proche de l’image littérale de «prendre» sans employer le plus interprétatif «je l’épousai».
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: sans que mon père ait donné son avis
  rationale: Expression française naturelle qui conserve comme sujet le père et rend l’idée qu’il n’a pas participé à la délibération, sans ajouter un complément absent du grec.
