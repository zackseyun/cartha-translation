source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἀγὼ ᾔδειν ὅτι πονηρὸν² γένος ἦν³ τῶν Χαναναίων⁴, ἀλλὰ τὸ διαβούλιον⁵ τῆς νεότητος ἐτύφλωσε τὴν διάνοιάν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/001.yaml
  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: fr
  text: Et moi, je savais que le peuple des Cananéens était mauvais, mais l’impulsion de la jeunesse a aveuglé mon intelligence.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀγώ
  choice: Et moi
  rationale: Conserve à la fois la coordination et l’emphase portée par καί + ἐγώ.
- source_word: πονηρὸν γένος
  choice: le peuple … était mauvais
  rationale: Dans ce contexte ethnique, γένος désigne le groupe ou le peuple. « Peuple » est plus naturel et moins chargé en français moderne que « race », tout en maintenant le jugement collectif exprimé par πονηρόν.
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: l’impulsion de la jeunesse
  rationale: διαβούλιον peut évoquer une intention, une résolution ou un mouvement intérieur. « Impulsion » rend ici naturellement l’élan irréfléchi associé à la jeunesse, sans introduire un projet mûrement délibéré.
- source_word: τὴν διάνοιάν μου
  choice: mon intelligence
  rationale: διάνοια désigne la faculté de comprendre ou de discerner; « intelligence » préserve cette dimension cognitive.
theological_decisions:
- issue: Jugement moral collectif porté sur les Cananéens
  choice: Conserver explicitement l’affirmation selon laquelle leur peuple était mauvais
  alternative: Atténuer en parlant seulement de certaines pratiques mauvaises
  rationale: Le grec attribue directement πονηρόν à γένος. Atténuer ou individualiser ce jugement modifierait le contenu du texte source.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’opposition entre la connaissance morale du locuteur et l’aveuglement provoqué par sa jeunesse.
