  text: But while I was away, she went and took for Shelah a wife from Canaan.
translation:
  language: fr
  text: Mais, en mon absence, elle partit prendre pour Shéla une femme de Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόντος ἐμοῦ
  choice: pendant mon absence
  rationale: Rend naturellement en français le génitif absolu indiquant que Juda était absent au moment de l’action.
- source_word: ἐπορεύθη καὶ ἔλαβε
  choice: alla prendre
  rationale: Conserve les deux verbes grecs dans une tournure française fluide, sans réduire l’expression au seul verbe « prit ».
- source_word: τῷ Σηλὼμ
  choice: pour Shéla
  rationale: 'Le datif indique ici le bénéficiaire : la femme est choisie pour Shéla. La forme française usuelle du nom biblique est retenue.'
- source_word: γυναῖκα ἐκ τῆς Χαναάν
  choice: une femme du pays de Canaan
  rationale: « Femme » préserve le sens de γυνή dans un contexte matrimonial, tandis que « du pays de Canaan » exprime clairement l’origine géographique.
