lexical_decisions:
- source_word: Καίγε
  choice: Et de fait
  rationale: Rend la particule emphatique grecque de manière naturelle en français, en confirmant avec force l’énoncé.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: dans sa méchanceté
  rationale: Conserve l’image et la valeur morale du grec πονηρία sans préciser indûment s’il s’agit d’un état, d’une conduite ou de ses conséquences.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: avec ses fils
  rationale: Traduit υἱοί par « fils », son sens explicite, plutôt que par le terme plus général « enfants ».
