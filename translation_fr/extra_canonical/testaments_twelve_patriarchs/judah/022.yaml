  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
translation:
  language: fr
  text: 22 Le Seigneur fera naître parmi eux des divisions qui les dresseront les uns contre les autres, et celles-ci seront continuelles en Israël[a]. 2 Ma royauté prendra fin parmi des peuples étrangers[b], jusqu’à ce que vienne le salut d’Israël[c], jusqu’à la venue du Dieu de justice, afin que Jacob repose en paix, ainsi que toutes les nations[d]. 3 Et lui préservera pour toujours la puissance de ma royauté[e] ; car le Seigneur m’a juré de ne jamais faire disparaître la royauté de ma descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis peut se comprendre : « et les divisions seront continuelles en Israël ». Certaines restitutions donnent : « et il y aura des guerres incessantes en Israël ».'
    reason: textual_ambiguity
  - marker: b
    text: 'Ou : « ma royauté sera menée à son accomplissement parmi des peuples étrangers » ; le verbe grec peut exprimer aussi bien l’achèvement que la fin.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la délivrance d’Israël ». L’expression peut aussi avoir une résonance messianique, sans désigner explicitement une personne.'
    reason: alternative_reading
  - marker: d
    text: « La venue » peut aussi se traduire par « la présence ». Le grec présente le repos de Jacob et de toutes les nations comme la finalité ou le résultat de cette venue ou présence.
    reason: lexical_alternative
  - marker: e
    text: Le pronom traduit par « lui » peut renvoyer à Dieu ou à la figure implicitement associée au salut annoncé ; le grec ne lève pas entièrement l’ambiguïté.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Ἐπάξει
  choice: fera naître
  rationale: Le futur de ἐπάγω exprime ici l’action de provoquer ou d’amener un état de fait. « Fera naître » est naturel en français et maintient l’action divine.
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: des divisions qui les dresseront les uns contre les autres
  rationale: La tournure développe en français idiomatique la réciprocité hostile de κατ᾽ ἀλλήλων, plutôt que de suggérer de simples différences internes.
- source_word: συνεχεῖς
  choice: continuelles
  rationale: Dans le texte grec fourni, l’adjectif pluriel peut reprendre directement « divisions » ; la traduction conserve donc cette syntaxe plutôt que de rétablir sans signalement un nom comme « guerres ».
- source_word: ἐν ἀλλοφύλοις
  choice: parmi des peuples étrangers
  rationale: ἀλλόφυλοι désigne ici plus vraisemblablement des populations étrangères que spécifiquement les Philistins. « Peuples étrangers » convient aussi à l’horizon ultérieur de « toutes les nations ».
- source_word: συντελεσθήσεται ἡ βασιλεία μου
  choice: ma royauté prendra fin
  rationale: Le passif de συντελέω peut exprimer l’achèvement ou la fin. Le contexte de divisions et de domination étrangère favorise la cessation, tout en laissant l’autre possibilité en note.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: le salut d’Israël
  rationale: Le neutre σωτήριον désigne normalement le salut ou la délivrance. Cette formulation ne tranche pas la possible portée messianique de l’expression.
- source_word: παρουσίας Θεοῦ τῆς δικαιοσύνης
  choice: la venue du Dieu de justice
  rationale: παρουσία peut signifier présence ou venue. Après ἐλθεῖν et dans cette annonce prophétique, « venue » est naturel ; le génitif τῆς δικαιοσύνης est rendu qualitativement par « de justice ».
- source_word: τοῦ ἡσυχάσαι
  choice: qui donnera … le repos
  rationale: L’infinitif peut exprimer le but ou le résultat de la venue. La proposition relative française transmet l’action sans imposer fortement l’une de ces nuances.
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: préservera … la puissance de ma royauté
  rationale: φυλάσσω signifie garder ou préserver, et κράτος la force ou puissance. La place de « pour toujours » suit naturellement la portée temporelle du grec.
- source_word: τὸ βασίλειον ἐκ τοῦ σπέρματός μου
  choice: la royauté de ma descendance
  rationale: βασίλειον renvoie ici au pouvoir royal ou à la dignité royale, tandis que σπέρμα désigne la lignée ou descendance. La formulation française évite l’idée spatiale d’un royaume retiré de l’intérieur de la descendance.
theological_decisions:
- issue: Référent de τὸ σωτήριον τοῦ Ἰσραήλ
  choice: le salut d’Israël
  alternative: la délivrance d’Israël ; le Sauveur d’Israël
  rationale: La forme grecque désigne le plus directement le salut ou la délivrance, mais peut recevoir une résonance messianique. Le texte principal conserve le substantif abstrait et la note signale la tension.
- issue: Sens de συντελεσθήσεται appliqué à la royauté de Juda
  choice: prendra fin
  alternative: sera menée à son accomplissement
  rationale: Le contexte négatif favorise l’idée de cessation parmi les étrangers, sans éliminer le sens lexical d’accomplissement, conservé en note.
- issue: Identité du sujet de φυλάξει au verset 3
  choice: Et lui préservera
  alternative: Et celui-ci préservera ; Et Dieu préservera
  rationale: Le pronom grec αὐτός est emphatique mais son antécédent peut être compris comme Dieu ou, selon la lecture de la phrase précédente, comme la figure associée au salut. « Lui » maintient cette ambiguïté sans nommer arbitrairement le sujet.
- issue: Portée universelle du repos
  choice: ainsi qu’à toutes les nations
  alternative: et toutes les nations
  rationale: Le grec coordonne Jacob et toutes les nations comme objets de l’action exprimée par ἡσυχάσαι. La traduction explicite seulement le complément sous-entendu en français, sans restreindre cette promesse à Israël.
translation_notes:
  register: Français international actuel, soutenu mais accessible, avec un ton testamentaire et prophétique. « Royauté » est préféré à « royaume » là où le contexte dynastique et les termes grecs variables visent le pouvoir royal. Les répétitions maladroites du témoin grec ne sont pas reproduites, mais son ambiguïté substantielle est conservée dans le texte ou signalée en note.
