  - severity: low
    issue: La note d indique que le grec rattache le repos à « cette venue ou présence », mais le texte principal le présente comme une relative dont Dieu est l’agent.
    rationale: La correction du texte principal doit être accompagnée d’une note formulée de façon cohérente avec la construction finale conservée.
