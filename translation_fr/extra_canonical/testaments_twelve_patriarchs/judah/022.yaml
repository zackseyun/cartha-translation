revisions:
- from: 22  Le Seigneur fera naître parmi eux des divisions qui les dresseront les uns contre les autres, et celles-ci seront continuelles en Israël[a]. 2 Ma royauté prendra fin parmi des peuples étrangers[b], jusqu’à ce que vienne le salut d’Israël[c], jusqu’à la venue du Dieu de justice, qui donnera à Jacob le repos dans la paix, ainsi qu’à toutes les nations[d]. 3 Et lui préservera pour toujours la puissance de ma royauté[e] ; car le Seigneur m’a juré de ne jamais faire disparaître la royauté de ma descendance.
  to: 22 Le Seigneur fera naître parmi eux des divisions qui les dresseront les uns contre les autres, et celles-ci seront continuelles en Israël[a]. 2 Ma royauté prendra fin parmi des peuples étrangers[b], jusqu’à ce que vienne le salut d’Israël[c], jusqu’à la venue du Dieu de justice, afin que Jacob repose en paix, ainsi que toutes les nations[d]. 3 Et lui préservera pour toujours la puissance de ma royauté[e] ; car le Seigneur m’a juré de ne jamais faire disparaître la royauté de ma descendance.
  rationale: 'Révision limitée de la seconde moitié du verset 2 : « afin que Jacob repose en paix, ainsi que toutes les nations » rend la valeur finale de τοῦ ἡσυχάσαι et conserve la coordination de Jacob avec toutes les nations, sans attribuer explicitement à Dieu une action que la construction grecque n’énonce pas sous cette forme. Toutes les ancres de notes restent présentes et les autres choix sûrs du projet sont conservés.'
  reviewer_model: gpt-5.6-terra
