  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
translation:
  language: fr
  text: 'Testament de Juda, quatrième fils de Jacob et de Léa.


    Copie des paroles que Juda adressa à ses fils avant de mourir.


    2 Ils se rassemblèrent donc et vinrent auprès de lui, et il leur dit :


    3 « Écoutez-moi, mes enfants, moi, Juda, votre père. Je fus le quatrième fils de mon père Jacob, et Léa, ma mère, me donna le nom de Juda en disant : “Je rends grâce au Seigneur, parce qu’il m’a aussi donné un quatrième fils.” 4 Dans ma jeunesse, j’étais vif, et j’obéissais à mon père en toute chose. 5 J’honorais ma mère ainsi que la sœur de ma mère[a]. 6 Lorsque je devins adulte, mon père pria pour moi en disant : “Tu seras roi et tu réussiras en toutes choses[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la sœur de ma mère », expression qui précise explicitement le lien de parenté plutôt que de dire simplement « ma tante ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi évoquer le fait d’être conduit vers la réussite ou de voir sa voie rendue prospère.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Dans le titre de cette œuvre, le mot désigne le discours d’adieu et les dernières volontés d’un patriarche, plutôt qu’une alliance.
- source_word: Ἀντίγραφον λόγων
  choice: Copie des paroles
  rationale: Cette expression conserve le cadre documentaire du texte et le caractère oral du discours transcrit.
- source_word: Ἀκούσατε
  choice: Écoutez
  rationale: Impératif français naturel, ferme et digne, adapté à l’exhortation solennelle d’un père.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: Je fus le quatrième fils
  rationale: Rend clairement le rang de naissance sans donner au verbe français « devenir » un relief artificiel.
- source_word: Ἀνθομολογοῦμαι
  choice: Je rends grâce
  rationale: Dans l’explication du nom de Juda, le verbe exprime une reconnaissance adressée à Dieu qui prend la forme de louange.
- source_word: ὀξὺς
  choice: vif
  rationale: Le terme peut évoquer la promptitude, l’énergie ou l’acuité. « Vif » conserve cette largeur de sens en français courant.
- source_word: κατὰ πάντα λόγον
  choice: en toute chose
  rationale: Dans le contexte de l’obéissance filiale, λόγος renvoie à tout ce que le père disait ou prescrivait; une traduction littérale par « toute parole » serait moins naturelle.
- source_word: ηὔξατό μοι
  choice: me bénit
  rationale: Même si la forme peut littéralement évoquer le fait de prier pour quelqu’un, la parole paternelle qui suit fonctionne ici comme une bénédiction.
- source_word: κατευοδούμενος
  choice: tu réussiras
  rationale: Le participe exprime l’idée de connaître une voie favorable, de prospérer ou de voir ses entreprises aboutir.
theological_decisions:
- issue: Traduction de Κυρίῳ dans la parole de Léa
  choice: au Seigneur
  alternative: à Seigneur
  rationale: Le mot est employé comme titre divin dans une formule de reconnaissance; l’article défini est requis par l’usage français naturel.
- issue: Portée de ὀξὺς dans le portrait de jeunesse de Juda
  choice: vif
  alternative: prompt; ardent; perspicace
  rationale: Le grec reste assez large. « Vif » ne réduit pas arbitrairement le trait à l’intelligence, à la vitesse ou au zèle.
- issue: Fonction de ηὔξατό μοι
  choice: me bénit
  alternative: pria pour moi
  rationale: La formulation grecque permet une lecture liée à la prière, mais la déclaration royale et prospère qui suit a la fonction littéraire d’une bénédiction paternelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours conserve une tonalité testamentaire solennelle sans tournures archaïques. Les relations de parenté explicites du grec sont maintenues, et les ambiguïtés lexicales importantes sont signalées en note.
