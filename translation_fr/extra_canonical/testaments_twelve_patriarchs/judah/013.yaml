  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013.yaml
  text: 'And now I command you[a], my children: hear Judah your father, and keep my words, with thoughts set on doing all the righteous requirements of the Lord and obeying the commands of God.


    Because I boasted that in wars the face of a beautiful woman had not deceived me, and I reproached Reuben my brother concerning Bilhah, my father’s wife, the spirit of jealousy and of sexual immorality arrayed themselves against me, until I sinned with Anan the Canaanite woman and with Tamar my daughter-in-law.


    For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, in the name of his daughter, he showed me an immeasurable abundance of gold, for he was a king. And he adorned her with gold and pearls[d][c][b], and made her pour wine for us at the banquet.'
translation:
  language: fr
  text: '13


    1 Et maintenant, mes enfants, voici ce que je vous ordonne : écoutez Juda, votre père,[a] et gardez mes paroles, afin de mettre en pratique toutes les justes prescriptions du Seigneur et d’obéir aux commandements de Dieu.


    2 Ne suivez pas vos désirs et ne marchez pas dans l’orgueil de votre cœur. Ne vous vantez ni de vos exploits ni de la vigueur de votre jeunesse, car cela aussi est mauvais aux yeux du Seigneur.


    3 En effet, moi aussi, je me suis vanté qu’à la guerre aucun beau visage de femme ne m’avait séduit,[b] et j’ai fait des reproches à mon frère Ruben au sujet de Bilha, femme de mon père.[c] C’est alors que l’esprit de jalousie et d’immoralité sexuelle se rangea en bataille contre moi, jusqu’à ce que je pèche avec la Cananéenne[d] et avec Tamar, ma belle-fille.


    4 J’avais dit à mon beau-père : « Je consulterai mon père, puis je prendrai ta fille. » Mais il ne le voulut pas. Pour me la donner,[e] il me montra plutôt une quantité d’or sans mesure, car il était roi. 5 Il la para d’or et de perles, puis, au banquet, il lui fit nous servir le vin dans toute sa beauté féminine.


    6 Le vin troubla ma vue, et le plaisir obscurcit mon cœur. 7 Épris d’elle, je succombai et m’unis à elle. Je transgressai le commandement du Seigneur et celui de mon père, et je la pris pour femme. 8 Le Seigneur me rendit selon le dessein de mon âme : je ne trouvai aucune joie dans ses enfants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’ouverture grecque est syntaxiquement difficile ; elle exhorte les enfants à écouter Juda en tant que père et à garder ses paroles.
    reason: textual_variant
  - marker: b
    text: 'Le texte grec transmis ici porte littéralement une forme positive, « un beau visage de femme m’a séduit », mais la phrase dépend d’un passage signalé comme corrompu et le contexte appelle vraisemblablement la négation : Juda se vantait auparavant de ne pas avoir été séduit.'
    reason: textual_variant
  - marker: c
    text: Bilha est la femme avec laquelle Ruben coucha selon Genèse 35.22.
    reason: cross_reference
  - marker: d
    text: Le grec fourni dit simplement « la Cananéenne ». Certaines traditions ou interprétations du passage donnent à cette femme un nom, mais celui-ci n’apparaît pas dans ce texte grec.
    reason: alternative_reading
  - marker: e
    text: L’expression grecque est difficile. Elle peut aussi se comprendre comme « en rapport avec le don de sa fille » ou comme une allusion à une richesse présentée à l’occasion du mariage proposé.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε τοὺς λόγους μου τοῦ ποιεῖν
  choice: gardez mes paroles, afin de mettre en pratique
  rationale: « Garder » conserve l’image testamentaire et biblique, tandis que la proposition finale exprime naturellement le rapport entre les paroles de Juda et leur mise en pratique.
- source_word: δικαιώματα Κυρίου
  choice: les justes prescriptions du Seigneur
  rationale: « Prescriptions » désigne des normes concrètes, et « justes » maintient la valeur morale de δικαιώματα sans recourir à un terme juridique opaque.
- source_word: ἐπιθυμίαι
  choice: désirs
  rationale: Le terme peut désigner des désirs ou convoitises. « Désirs » préserve ici sa portée générale, le contexte précisant leur caractère désordonné.
- source_word: ἔργοις καὶ ἰσχύι τῆς νεότητος
  choice: exploits ni de la vigueur de votre jeunesse
  rationale: « Exploits » convient au contexte guerrier et évite le français peu naturel « œuvres de votre jeunesse »; « vigueur » rend clairement ἰσχύς.
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: l’esprit de jalousie et de débauche sexuelle
  rationale: La formulation conserve la personnification du vice. « Débauche sexuelle » communique le sens de πορνεία dans un français actuel sans l’archaïsme de « fornication ».
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: se rangea en bataille contre moi
  rationale: Le singulier grec s’accorde avec « l’esprit » et la traduction garde la métaphore militaire du verbe.
- source_word: τὴν Χανανανίτην
  choice: la Cananéenne
  rationale: Le texte grec fourni porte un adjectif substantivé signifiant directement « la femme cananéenne »; il ne donne pas ici le nom « Anan ».
- source_word: εἰς δόσιν αὐτῆς
  choice: Pour me la donner
  rationale: Cette lecture relie la richesse montrée à l’offre de la fille en mariage, tout en signalant en note la difficulté de la construction.
- source_word: ἐν κάλλει γυναικῶν
  choice: dans toute sa beauté de femme
  rationale: Rend l’expression grecque sans transformer avec certitude la beauté en vêtements ou parure, déjà mentionnés dans la proposition précédente.
- source_word: συνέπεσα εἰς αὐτήν
  choice: je succombai et m’unis à elle
  rationale: La formulation conserve à la fois l’idée de chute morale et l’union sexuelle suggérée par le contexte.
- source_word: ἀνταπέδωκέ μοι κατὰ τὸ διαβούλιον τῆς ψυχῆς μου
  choice: me rendit selon le dessein de mon âme
  rationale: La traduction maintient la logique de rétribution et l’expression anthropologique du texte sans décider si le « dessein » désigne désir, décision ou calcul intérieur.
theological_decisions:
- issue: Personnification des vices
  choice: Conserver « l’esprit de jalousie et de débauche sexuelle » comme sujet personnel qui se range en bataille.
  alternative: 'Réduire l’expression à un état psychologique : « la jalousie et le désir s’emparèrent de moi ».'
  rationale: Le texte présente explicitement un πνεῦμα et emploie une métaphore de combat. La personnification appartient à sa représentation de la lutte morale et ne doit pas être aplatie.
- issue: Rapport entre faute morale et union sexuelle
  choice: Traduire συνέπεσα εἰς αὐτήν par « je succombai et m’unis à elle ».
  alternative: « je couchai avec elle » ou « je tombai sur elle ».
  rationale: La solution retenue communique l’acte et sa qualification confessionnelle tout en évitant soit une crudité absente du grec, soit un calque obscur.
- issue: Rétribution divine au verset 8
  choice: Garder l’affirmation directe selon laquelle le Seigneur rend à Juda selon le dessein de son âme.
  alternative: Expliciter en « le Seigneur me punit pour les mauvais désirs de mon âme ».
  rationale: Le grec affirme une rétribution mais ne contient ni le substantif « punition » ni l’adjectif « mauvais ». La traduction préserve donc la tension et laisse le contexte en déterminer la portée.
translation_notes:
  register: Français international moderne, digne et directement lisible. Le tutoiement familial est maintenu dans les paroles de Juda. Les termes bibliques établis (« Seigneur », « commandements », « transgressai ») sont conservés sans multiplier les archaïsmes. La numérotation suit les huit sections du texte grec.
