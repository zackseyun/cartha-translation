  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025.yaml
  text: '1. And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be chiefs of the tribes in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and so all the rest in order.


    2. And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.


    3. And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.


    4. And those who died in sorrow will rise in joy, and the poor for the Lord’s sake will be made rich, and those dying for the Lord’s sake will awake to life.


    5. And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.'
translation:
  language: fr
  text: '**Testament de Juda 25**


    **1.** Après cela, Abraham, Isaac et Jacob ressusciteront pour la vie. Mes frères et moi, nous serons des chefs en Israël : Lévi le premier, moi le deuxième, Joseph le troisième, Benjamin le quatrième, Siméon le cinquième, Issacar le sixième, puis tous les autres dans l’ordre.


    **2.** Le Seigneur bénit Lévi ; l’ange de la Présence, moi ; les puissances de la gloire, Siméon ; le ciel, Ruben ; la terre… ; la mer, Joseph[a] ; les luminaires, Dan ; les délices, Nephtali ; le soleil, Gad ; et la lune, Aser.


    **3.** Vous serez le peuple du Seigneur et vous aurez une seule langue. Là, il n’y aura aucun esprit d’égarement de Béliar, car il sera jeté pour toujours.


    **4.** Ceux qui seront morts dans la tristesse ressusciteront ; les pauvres à cause du Seigneur deviendront riches, et ceux qui meurent à cause du Seigneur se réveilleront pour la vie.


    **5.** Les cerfs de Jacob courront dans l’allégresse, et les aigles d’Israël prendront leur vol dans la joie. [Mais les impies seront dans le deuil et les pécheurs pleureront.][b] Tous les peuples glorifieront le Seigneur pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte grec de cette liste paraît incomplet ou altéré : aucun fils n’est nommé après « la terre », et plusieurs noms attendus dans la série manquent. La traduction conserve donc la rupture du texte au lieu de reconstituer silencieusement la liste à partir d’une autre forme textuelle.'
    reason: Signaler la difficulté matérielle du texte source et éviter d’importer les compléments présents dans la couche anglaise.
  - marker: b
    text: Cette phrase est placée entre crochets dans l’édition grecque, ce qui signale que son appartenance au texte est incertaine.
    reason: Préserver visiblement l’incertitude éditoriale de la source.
lexical_decisions:
- source_word: ἀναστήσεται / ἀναστήσονται
  choice: ressusciteront
  rationale: Dans ce contexte explicitement eschatologique de retour à la vie, « ressusciter » exprime naturellement le sens de « se relever » sans effacer la référence à la vie au v. 1.
- source_word: ἔξαρχοι
  choice: chefs
  rationale: Le terme désigne des dirigeants ou chefs. Le grec fourni ne comporte pas le mot « tribus » ; il n’a donc pas été ajouté.
- source_word: ἄγγελος τοῦ προσώπου
  choice: l’ange de la Présence
  rationale: Rendu formel qui conserve l’expression théologique grecque sans la paraphraser comme une simple proximité.
- source_word: πνεῦμα πλάνης
  choice: esprit d’égarement
  rationale: « Égarement » préserve la portée active et religieuse de πλάνη, qui peut couvrir erreur et tromperie.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression idiomatique française de durée perpétuelle. Le mot « feu », absent du texte grec fourni, n’est pas ajouté.
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: les cerfs de Jacob
  rationale: Suit directement la leçon grecque « Jacob », plutôt que « Joseph » dans la couche anglaise de consultation.
- source_word: πετασθήσονται
  choice: prendront leur vol
  rationale: Formulation française naturelle et digne pour l’action future des aigles.
theological_decisions:
- issue: Destination de l’esprit d’égarement de Béliar
  choice: « il sera jeté au loin pour toujours »
  alternative: « il sera jeté dans le feu pour toujours »
  rationale: Le grec fourni lit seulement ἐμβληθήσεται εἰς τὸν αἰῶνα et ne mentionne pas le feu. La traduction n’importe donc pas cet élément de la couche anglaise, tout en rendant la formulation grecque difficile de manière intelligible.
- issue: Résurrection de ceux qui meurent dans la tristesse
  choice: « ressusciteront » sans ajout de « dans la joie »
  alternative: « ressusciteront dans la joie »
  rationale: Le complément « dans la joie » ne figure pas dans le texte grec fourni ; la joie apparaît explicitement au verset suivant.
- issue: Clause concernant les impies et les pécheurs
  choice: conservée entre crochets dans le corps du texte
  alternative: omise comme dans la couche anglaise
  rationale: Elle est présente entre crochets dans l’édition grecque fournie. Les crochets et la note signalent honnêtement son statut textuel au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, courant et digne. La numérotation et le parallélisme des bénédictions sont conservés. Au verset 2, l’ellipse du verbe après la première proposition reproduit la structure rhétorique grecque ; une note avertit toutefois que la liste transmise est lacunaire. Les ajouts de la couche anglaise qui ne sont pas attestés dans le grec fourni (« tribus », plusieurs éléments de la liste, « feu », « dans la joie », « Joseph » au v. 5) n’ont pas été retenus.
