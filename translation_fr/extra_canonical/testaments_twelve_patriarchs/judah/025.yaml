  naturalness: Le français est moderne, clair et d’un registre approprié. La formulation elliptique de la liste du v. 2 reproduit utilement le parallélisme grec ; la note permet de ne pas faire passer cette rupture syntaxique pour une omission de traduction.
  terminology: Les choix « ressusciteront », « ange de la Présence », « esprit d’égarement », « Béliar » et « glorifieront » sont justes et cohérents. « Pour toujours » rend sobrement εἰς τὸν αἰῶνα sans spécifier un lieu ou un moyen de rejet.
