  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: fr
  text: '9 Pendant dix-huit ans, mon père vécut en paix avec son frère Ésaü, et les fils de celui-ci furent avec nous après que nous fûmes venus de Mésopotamie, de chez Laban.


    2 Au terme de ces dix-huit années, Ésaü, le frère de mon père, revint contre nous à la tête d’un peuple imposant et puissant.


    3 Jacob frappa Ésaü avec son arc, et le mort fut emporté au mont Séir.


    4 Nous poursuivîmes les fils d’Ésaü. Eux aussi avaient une ville fortifiée, mais nous ne pouvions pas y entrer. Nous l’encerclâmes donc et l’assiégeâmes.


    5 Comme ils n’ouvraient pas depuis vingt jours, tandis qu’ils étaient occupés, j’amenai une échelle. Après avoir placé mon bouclier au-dessus de ma tête, je montai en essuyant les pierres lancées depuis la muraille et tuai quatre des chefs de leur ville.


    6 Ruben et Gad en tuèrent six autres.


    7 Alors ils nous demandèrent la paix. Après avoir délibéré avec notre père, nous les reçûmes comme tributaires.


    8 Ils nous livrèrent cinq cents cors[a] de blé, cinq cents mesures d’huile[b] et cinq cents mesures de vin, jusqu’à la famine, lorsque nous descendîmes en Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le cor est une ancienne unité de capacité dont la valeur exacte a varié.
    reason: Le terme grec κόρος désigne une mesure ancienne peu familière au lecteur moderne et ne permet pas ici une conversion certaine.
  - marker: b
    text: Le mot grec désignant l’unité de mesure de l’huile est incertain dans le manuscrit.
    reason: La leçon ὕφης est signalée comme corrompue ou douteuse; « mesures » préserve le sens général sans imposer une identification conjecturale.
lexical_decisions:
- source_word: ἐποίησεν εἰρήνην
  choice: vécut en paix
  rationale: Exprime naturellement en français l’établissement et le maintien d’une relation pacifique pendant dix-huit ans, sans ajouter l’idée d’un traité formel.
- source_word: ἐπανῆλθεν ἡμῖν
  choice: revint contre nous
  rationale: Le contexte militaire donne au datif une valeur hostile; «revint contre nous» conserve aussi l’idée de retour portée par le verbe.
- source_word: λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: une troupe imposante et puissante
  rationale: «Troupe» convient au contexte guerrier; «imposante» restitue βαρεῖ sans le calque peu naturel «lourde».
- source_word: ἔπαισεν ἐν τόξῳ
  choice: frappa … avec son arc
  rationale: Suit le grec sans préciser une flèche que le texte ne nomme pas.
- source_word: ἤρθη ὁ νεκρὸς
  choice: le cadavre fut emporté
  rationale: Rend le passif et le sens concret du substantif, sans reprendre l’expansion interprétative de la couche anglaise.
- source_word: περικαθίσαντες … ἐπολιορκοῦμεν
  choice: Nous l’encerclâmes donc et l’assiégeâmes
  rationale: 'Formulation française fluide qui conserve les deux actions: prendre position autour de la ville et mener le siège.'
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: sous les pierres lancées du haut de la muraille
  rationale: Le verbe peut évoquer le fait de recevoir ou d’essuyer les projectiles; la formulation décrit la situation sans prétendre qu’il les attrapait.
- source_word: δυνάστας
  choice: chefs
  rationale: Désigne ici les hommes dominants ou dirigeants de la ville plutôt que de simples combattants puissants.
- source_word: ὑποφόρους
  choice: tributaires
  rationale: 'Élément absent de la consultation anglaise mais explicite dans le grec: ils sont reçus sous obligation de tribut.'
- source_word: κόρους
  choice: cors
  rationale: Conserve le nom de l’ancienne unité de capacité, accompagné d’une note explicative.
theological_decisions:
- issue: Récit de la mort d’Ésaü
  choice: Traduire seulement que Jacob le frappa avec son arc et que le cadavre fut emporté sur le mont Séir.
  alternative: Expliciter qu’Ésaü tomba, tué par l’arc de Jacob, et mourut sur le mont Séir.
  rationale: Le grec relie les événements mais ne contient pas toutes les précisions de l’expansion anglaise. La traduction conserve la tension et évite d’ajouter des circonstances non exprimées.
- issue: Statut accordé aux fils d’Ésaü après leur demande de paix
  choice: «nous les reçûmes comme tributaires»
  alternative: «nous les acceptâmes»
  rationale: ὑποφόρους précise leur statut politique et explique les livraisons du verset suivant; l’omettre atténuerait le texte source.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent accessibles sans moderniser les réalités anciennes. Les ajouts explicatifs de la couche anglaise ont été écartés lorsqu’ils dépassaient le grec, tandis que les éléments explicites du grec, notamment le statut de tributaires, ont été rétablis.
