  text: 'These two things turn away a man''s mind[a]. For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.


    Such is the wine-drinker, my children, because the one who gets drunk has regard for no one. For see, it also led me astray, so that I was not ashamed before the multitude of the city. In the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.


    After drinking wine, I was not ashamed of the commandment of God, and I took a Canaanite woman. For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink. But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and feel no shame[c][b], but even boast in his dishonor and think it good.'
translation:
  language: fr
  text: '14. Et maintenant, je vous le dis, mes enfants : ne vous enivrez pas de vin, car le vin détourne l’esprit de la vérité, y fait naître la colère du désir et égare les yeux. 2 En effet, l’esprit de l’immoralité sexuelle se sert du vin comme d’un serviteur pour le plaisir de l’esprit, car tous deux détournent la pensée de l’être humain. 3 Si quelqu’un boit du vin jusqu’à l’ivresse, celui-ci bouleverse son esprit par des pensées impures, échauffe son corps en vue du plaisir et de l’immoralité sexuelle, commet le péché et n’en éprouve aucune honte.


    4 Voilà ce qu’est l’homme adonné au vin, mes enfants, car celui qui s’enivre n’a d’égards pour personne. 5 Voyez : le vin m’a moi aussi égaré, au point que je n’ai pas eu honte devant la foule de la ville. Sous les yeux de tous, je me suis détourné vers Tamar, j’ai commis un grand péché et j’ai dévoilé le voile d’impureté de mes fils[a]. 6 Après avoir bu du vin, je n’ai pas eu honte du commandement de Dieu, et j’ai pris pour femme une Cananéenne.


    7 Celui qui boit du vin a besoin de beaucoup de discernement, mes enfants. Voici en quoi consiste le discernement dans la consommation du vin : tant qu’il garde le sens de la honte, qu’il boive[b]. 8 Mais s’il va au-delà de la limite, l’esprit de l’égarement[c] pénètre dans son esprit et pousse l’homme ivre à tenir des propos honteux, à agir contre la loi et à ne plus avoir honte, mais à se glorifier de son déshonneur et à le considérer comme une bonne chose.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai exposé la honte qui couvrait mes fils ». L’expression grecque est difficile ; elle peut évoquer l’impureté familiale rendue publique par le péché de Juda avec Tamar.'
    reason: lexical_alternative
  - marker: b
    text: La formule « tant qu’il garde le sens de la honte, qu’il boive » décrit la modération par la conservation de la retenue morale. La suite précise que le franchissement de la limite mène à la perte de toute honte.
    reason: cultural_note
  - marker: c
    text: 'Ou : « un esprit d’erreur ». Le grec peut désigner l’égarement, l’erreur ou la tromperie, sans préciser davantage la nature de cet esprit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: détourne l’esprit de la vérité
  rationale: Conserve le mouvement moral exprimé par διαστρέφει et la distinction entre l’esprit et la vérité, sans réduire le verbe à une simple altération cognitive.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: y fait naître la colère du désir
  rationale: Le grec associe de façon inhabituelle ὀργή et ἐπιθυμία. La traduction garde cette tension plutôt que de préciser arbitrairement « désir furieux » ou « désir violent ».
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: l’esprit de l’immoralité sexuelle
  rationale: « Immoralité sexuelle » rend πορνεία en français actuel sans l’archaïsme ni la restriction possible de « fornication »; « esprit » maintient la personnification du grec.
- source_word: διάνοια
  choice: pensée
  rationale: Dans 2.2, le terme désigne la faculté intérieure de réflexion que le vin et l’immoralité détournent. « Pensée » est naturel et évite de confondre systématiquement διάνοια, νοῦς et σύνεσις.
- source_word: συνταράσσει
  choice: bouleverse
  rationale: Le composé exprime une agitation profonde; « bouleverse » en garde la vigueur dans un français naturel.
- source_word: πάροινος
  choice: homme adonné au vin
  rationale: Le mot décrit quelqu’un que caractérise son rapport au vin. Cette formulation conserve l’idée d’habitude sans anticiper le terme explicite désignant l’homme ivre au verset 8.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: n’a d’égards pour personne
  rationale: L’expression vise la disparition de la retenue sociale et morale, sens plus large que le seul respect.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: j’ai dévoilé le voile d’impureté de mes fils
  rationale: La formulation demeure proche de l’image grecque, difficile et probablement métaphorique, sans lui imposer une interprétation familiale ou sexuelle précise.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: je n’ai pas respecté avec honte le commandement de Dieu
  rationale: La construction grecque est inhabituelle. Cette traduction garde le vocabulaire récurrent de la honte tout en faisant comprendre que Juda a méprisé la retenue imposée par le commandement.
- source_word: σύνεσις
  choice: discernement
  rationale: Le contexte porte sur la maîtrise de soi et le jugement pratique nécessaires face au vin; « discernement » est plus précis ici que le général « intelligence ».
- source_word: αἰδώς
  choice: sens de la honte
  rationale: L’expression désigne ici la retenue morale encore présente chez le buveur et prépare les mentions répétées de la honte perdue.
- source_word: αἰσχρορρημονεῖν
  choice: tenir des propos honteux
  rationale: Le verbe concerne le contenu honteux ou indécent des paroles, non seulement la manière de parler.
- source_word: παρανομεῖν
  choice: agir contre la loi
  rationale: Rend explicitement la composante νόμος du verbe sans introduire une loi particulière absente du contexte.
theological_decisions:
- issue: Nature de l’« esprit de l’immoralité sexuelle » et de l’« esprit de l’égarement »
  choice: Maintenir dans les deux cas le mot « esprit » et la personnification.
  alternative: Rendre ces expressions de manière abstraite, par « tendance à l’immoralité » et « égarement ».
  rationale: Le grec emploie explicitement πνεῦμα et présente cet esprit comme un agent. La traduction conserve cette représentation sans définir s’il s’agit d’un être personnel, d’une puissance morale ou d’une disposition intérieure.
- issue: Responsabilité du péché au verset 3
  choice: Conserver la chaîne verbale dont le sujet grammatical immédiat est le vin, tout en formulant en français « celui-ci » pour rendre le référent.
  alternative: Faire explicitement de la personne ivre le sujet de « commet le péché ».
  rationale: Le texte grec attribue rhétoriquement au vin les effets qui conduisent au péché. La formulation retenue préserve cette causalité sans nier la responsabilité humaine, que le passage suppose par ailleurs.
- issue: Confession de Juda concernant Tamar et ses fils
  choice: Garder l’image opaque du « voile d’impureté » dans le texte principal.
  alternative: Interpréter la phrase comme l’exposition publique de la honte familiale ou comme une allusion sexuelle précise.
  rationale: La syntaxe et l’image sont difficiles. Une traduction proche, accompagnée d’une note, respecte l’ambiguïté au lieu de résoudre une question que le grec ne tranche pas nettement.
- issue: Portée de « tant qu’il garde le sens de la honte, qu’il boive »
  choice: Traduire l’impératif tel quel et expliquer en note son lien avec la retenue.
  alternative: Le reformuler comme une interdiction générale de boire ou comme une approbation théologique explicite de la consommation modérée.
  rationale: Le passage formule lui-même une limite fondée sur la maîtrise de soi. Il ne convient ni d’effacer cette permission grammaticale ni d’en tirer une doctrine plus large que le texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsmes. L’adresse répétée « mes enfants » et le ton d’exhortation testamentaire sont conservés. Les répétitions portant sur le vin, l’esprit, le péché et la honte restent visibles. Les formulations grecques difficiles des versets 5 à 7 ne sont pas harmonisées avec une tradition confessionnelle particulière; elles sont rendues aussi clairement que possible et signalées en note lorsqu’une interprétation serait nécessaire.
