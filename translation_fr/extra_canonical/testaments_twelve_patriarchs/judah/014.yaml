  rationale: La révision corrige deux écarts sûrs sans résoudre les ambiguïtés du grec. « Serviteur » rend διάκονος dans son rôle instrumental. « Je n’ai pas eu honte du commandement de Dieu » conserve la construction inhabituelle et la répétition volontaire du thème de la honte, sans ajouter l’interprétation « transgresser » ou « mépriser ». « Son esprit » en v. 8 rend plus directement νοῦς et évite l’alternance non motivée avec « intelligence ».
