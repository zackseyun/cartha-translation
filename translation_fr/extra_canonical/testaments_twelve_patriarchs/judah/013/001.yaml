id: T12P.JUD.13.1
reference: Testament of Judah 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: fr
  text: 'Et maintenant, je vous donne cet ordre, mes enfants : écoutez Juda, votre père, et gardez mes paroles afin de mettre en pratique toutes les justes prescriptions du Seigneur et d’obéir aux commandements de Dieu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: je vous donne cet ordre
  rationale: Rend clairement l’acte solennel de commander, dans un français naturel.
- source_word: ἀκούσατε
  choice: écoutez
  rationale: Le verbe appelle ici non seulement à entendre, mais à prêter attention aux paroles du père.
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: gardez mes paroles
  rationale: Conserve l’image grecque de paroles à retenir et à observer, sans ajouter « dans vos cœurs », absent du texte grec fourni.
- source_word: τοῦ ποιεῖν
  choice: afin de mettre en pratique
  rationale: Exprime la valeur finale probable de l’infinitif articulé et rend naturellement l’idée sémitique de « faire » les prescriptions.
- source_word: δικαιώματα
  choice: justes prescriptions
  rationale: Préserve à la fois le caractère normatif du terme et son lien lexical avec ce qui est juste; « prescriptions » évite de le confondre avec ἐντολαί.
- source_word: ἐντολαῖς
  choice: commandements
  rationale: Équivalent français usuel et distinct de « prescriptions » pour δικαιώματα.
theological_decisions:
- issue: Distinction entre « Seigneur » et « Dieu »
  choice: Maintenir « du Seigneur » puis « de Dieu »
  alternative: Uniformiser les deux désignations divines
  rationale: Le grec emploie successivement Κυρίου et Θεοῦ; conserver cette variation respecte le texte sans lui imposer une harmonisation théologique.
- issue: Portée de δικαιώματα
  choice: « justes prescriptions »
  alternative: « décrets » ou « exigences de justice »
  rationale: Cette formulation garde la nuance juridique et morale sans décider si le terme désigne exclusivement une loi écrite ou, plus largement, les exigences divines.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’auto-désignation à la troisième personne (« Juda, votre père »), caractéristique du discours testamentaire, ainsi que le parallélisme entre les prescriptions du Seigneur et les commandements de Dieu.
