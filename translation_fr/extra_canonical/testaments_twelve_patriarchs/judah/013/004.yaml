  text: '*Ἔλεγον γὰρ τῷ πενθερῷ μου ὅτι συμβουλεύσομαι τῷ πατρί μου καὶ οὕτως λήψομαι³⁴ τὴν θυγατέρα σου⁵· ὁ δὲ οὐκ ἠθέλησεν, ἀλλ᾽ ἔδειξέ³⁵ μοι *εἰς δόσιν αὐτῆς³⁶ χρυσίου πλῆθος³⁷ ἄπειρον³⁸. *Βασιλεὺς γὰρ ἦν³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: fr
  text: 'Car je disais à mon beau-père : « Je consulterai mon père, puis je prendrai ta fille pour femme. » Mais il ne le voulut pas ; au contraire, il me montra une quantité incalculable d’or, en rapport avec le don de sa fille,[a] car il était roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre : « pour la donner » ou « comme don avec elle ». Elle indique un lien entre l’or et le don de la fille, sans en préciser clairement la nature.'
    reason: Conserver l’ambiguïté de εἰς δόσιν αὐτῆς et éviter d’imposer l’interprétation de la dot ou du prix de la fiancée.
lexical_decisions:
- source_word: συμβουλεύσομαι τῷ πατρί μου
  choice: je consulterai mon père
  rationale: Rend directement l’idée de demander l’avis du père, sans préciser d’avance le résultat de la consultation.
- source_word: λήψομαι τὴν θυγατέρα σου
  choice: je prendrai ta fille pour femme
  rationale: En contexte matrimonial, « prendre » signifie épouser ; l’ajout « pour femme » rend ce sens naturel et clair en français moderne.
- source_word: οὐκ ἠθέλησεν
  choice: il ne voulut pas attendre
  rationale: Le complément n’est pas exprimé en grec. Le contexte indique qu’il refuse la démarche proposée, c’est-à-dire d’attendre la consultation du père ; l’explicitation minimale évite un français obscur.
- source_word: χρυσίου πλῆθος ἄπειρον
  choice: une quantité incalculable d’or
  rationale: Préserve l’hyperbole de ἄπειρον (« sans limite, immense ») dans une formulation française idiomatique.
- source_word: Βασιλεὺς γὰρ ἦν
  choice: car il était roi
  rationale: Traduction directe, conservant le lien explicatif introduit par γάρ.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste simple. « Mon beau-père » correspond au terme relationnel grec, tandis que « prendre ta fille pour femme » explicite l’usage matrimonial sans alourdir le verset.
