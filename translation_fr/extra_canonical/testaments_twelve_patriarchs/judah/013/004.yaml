    issue: Ajout de « attendre »
    rationale: οὐκ ἠθέλησεν signifie seulement qu’il ne voulait pas/ne consentait pas ; le grec ne dit pas explicitement qu’il refusait d’attendre.
  - severity: medium
    issue: Interprétation trop déterminée de εἰς δόσιν αὐτῆς dans le texte principal
    rationale: « Pour me donner sa fille » interprète le rapport de l’or au don de la fille. La construction grecque est concise et son sens institutionnel exact demeure incertain ; cette réserve doit être maintenue dans la formulation principale comme dans la note.
