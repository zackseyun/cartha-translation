source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἐκόσμησεν αὐτὴν⁴⁰ ἐν χρυσίῳ καὶ μαργαρίταις, καὶ ἐποίησεν αὐτὴν οἰνοχοεῖν ἡμῖν⁴¹ ἐν τῷ δείπνῳ ἐν *κάλλει γυναικῶν⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/005.yaml
  text: And he adorned her with gold and pearls, and made her pour wine for us at the banquet.
translation:
  language: fr
  text: Il la para d’or et de perles, puis la fit nous servir du vin au banquet, dans la beauté des femmes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la beauté des femmes ». Le sens précis de cette expression est incertain ; elle peut évoquer la beauté ou la parure féminine.'
    reason: Le grec conserve une formule singulière, absente du texte anglais de consultation ; la note en indique le caractère littéral et l’ambiguïté.
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: para
  rationale: Le verbe signifie ici « orner, parer »; « para » convient naturellement aux bijoux mentionnés.
- source_word: οἰνοχοεῖν
  choice: servir le vin
  rationale: L’infinitif désigne l’action de verser le vin pour les convives; « servir le vin » est idiomatique en français sans perdre le sens.
- source_word: ἐν τῷ δείπνῳ
  choice: au banquet
  rationale: Dans ce contexte collectif et solennel, « banquet » rend mieux δείπνον qu’un simple « dîner ».
- source_word: ἐν κάλλει γυναικῶν
  choice: dans toute la beauté des femmes
  rationale: Cette formulation conserve le pluriel et l’expression inhabituelle du grec, sans la réduire silencieusement à une simple élégance vestimentaire.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La coordination est légèrement allégée par « puis », tandis que la proposition finale difficile du grec est maintenue dans le texte et explicitée en note.
