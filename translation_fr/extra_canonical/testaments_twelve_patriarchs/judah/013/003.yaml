  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: fr
  text: et je reprochais à Ruben, mon frère, ce qui concernait Bilha, la femme de mon père ; et l’esprit de jalousie et d’immoralité sexuelle se rangea contre moi, jusqu’à ce que je passe à l’acte avec la Cananéenne[a] et avec Tamar, ma belle-fille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est difficile et le texte transmis est incertain à cet endroit : littéralement, « jusqu’à ce que j’accomplisse » ou « mène à son terme », suivi d’une préposition inhabituelle dans cette construction; il porte ici « la Cananéenne ».'
    reason: Signaler à la fois la construction grecque obscure et la difficulté textuelle marquée dans l’édition, sans substituer un nom propre ni imposer l’interprétation « je péchai ».
lexical_decisions:
- source_word: ὠνείδιζον
  choice: je reprochais
  rationale: L’imparfait rend l’aspect imperfectif du verbe grec et conserve Juda comme sujet implicite dans le contexte.
- source_word: περὶ Βάλλας
  choice: ce qui concernait Bilha
  rationale: Rend naturellement περί avec le génitif sans préciser au-delà du grec la nature exacte du reproche.
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: l’esprit de jalousie et de débauche sexuelle
  rationale: Le grec présente un seul « esprit » déterminé par deux génitifs. « Débauche sexuelle » exprime πορνεία dans un français actuel sans le limiter à un acte particulier.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: se rangea contre moi
  rationale: Conserve l’image d’une force qui prend position en ordre de bataille contre Juda.
- source_word: συνετέλεσα εἰς
  choice: j’en vienne à l’accomplir
  rationale: Préserve le sens d’achèvement de συντελέω et rattache prudemment le pronom à la débauche sexuelle évoquée, sans ajouter explicitement « je péchai ».
- source_word: νύμφην
  choice: belle-fille
  rationale: Dans la relation entre Juda et Tamar, le terme désigne ici la femme de son fils, donc sa belle-fille.
theological_decisions:
- issue: Rapport entre le comportement de Juda et « l’esprit »
  choice: Conserver à la fois l’action hostile de l’esprit et l’aboutissement personnel exprimé à la première personne
  alternative: Présenter Juda soit comme pure victime, soit comme seul responsable sans influence extérieure
  rationale: Le grec maintient la tension entre une puissance qui se range contre Juda et l’acte qu’il dit lui-même avoir mené à son terme.
- issue: Nature morale de l’acte final
  choice: Ne pas introduire explicitement le mot « péché »
  alternative: Traduire « jusqu’à ce que je pèche avec… »
  rationale: Le contexte est moralement négatif, mais συνετέλεσα signifie proprement mener à terme ou accomplir; ajouter « pécher » résoudrait plus fortement que le texte la formulation grecque difficile.
translation_notes:
  register: 'Français international moderne, digne et lisible. La syntaxe a été légèrement divisée en deux phrases pour éviter une longue coordination, tout en conservant l’enchaînement causal et la tension du grec. Les noms suivent les formes françaises usuelles : Ruben, Bilha et Tamar.'
