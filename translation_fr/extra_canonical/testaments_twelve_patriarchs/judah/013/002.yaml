  language: fr
  text: Car moi aussi, je m’étais vanté de n’avoir pas été séduit, au cours des guerres, par le visage d’une belle femme[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec transmis porte littéralement : « le visage d’une belle femme m’avait séduit/trompé », sans négation; il est marqué comme textuellement incertain (†). La négation est ici une restitution fondée sur le sens probable de la vantardise et sur le contexte.'
    reason: Signaler que la négation ne figure pas dans le texte grec transmis, tout en conservant la restitution contextuelle adoptée dans la traduction.
lexical_decisions:
- source_word: ἐγκαυχησάμενος
  choice: après m’être vanté
  rationale: Le participe aoriste exprime ici une action antérieure et évoque le fait de se glorifier ou de se vanter.
- source_word: ἐν πολέμοις
  choice: pendant les guerres
  rationale: Cette formulation française naturelle conserve le cadre répété ou général suggéré par le pluriel grec.
- source_word: ἠπάτησέ με
  choice: ne m’avait pas séduit
  rationale: Le verbe ἀπατάω signifie tromper ou égarer; dans ce contexte où agit la beauté d’une femme, « séduire » rend naturellement l’idée sans la réduire à un sens exclusivement sexuel. La négation, absente du texte grec transmis ici, est signalée comme une restitution dans la note.
- source_word: πρόσωπον γυναικὸς εὐμόρφου
  choice: le visage d’une belle femme
  rationale: Traduction directe qui préserve l’image concrète du visage et le sens de εὔμορφος, « beau, bien formé ».
