review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « la donner à Shéla » inverse la construction du grec τὸν Σηλὼμ δοῦναι αὐτῇ (« lui donner Shéla »). Le reste suit fidèlement le texte, y compris la description non technique de l’acte et le jugement moral explicite.'
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. La finale « comme elle-même » est toutefois elliptique et peu idiomatique ; « comme elle l’était elle-même » restitue naturellement le prédicat sous-entendu.
  terminology: « s’unit à elle », « semence », « méchanceté » et « filles de Canaan » conviennent au registre et ne surinterprètent pas le grec. « Shéla » est une graphie française recevable de Σηλώμ.
  issues:
  - severity: high
    issue: Inversion des rôles dans « la donner à Shéla »
    rationale: 'Le grec a pour objet « Shéla » et pour destinataire « à elle » : Juda voulait donner Shéla à la femme. La formulation française du projet donne au contraire la femme à Shéla.'
  - severity: medium
    issue: Ellipse maladroite dans « comme elle-même »
    rationale: Le grec sous-entend « était », mais le français moderne requiert normalement de reprendre ce verbe. L'ajout ne résout ni ne supprime l'ambiguïté pronominale du texte source.
