  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: fr
  text: Quand je l’ai menacé, il s’unit à elle, mais répandit sa semence à terre, conformément à l’ordre de sa mère. Lui aussi mourut donc dans sa méchanceté. Je voulais également lui donner Shéla, mais sa mère ne le permit pas. En effet, elle agit avec méchanceté, parce qu’elle n’était pas l’une des filles de Canaan, comme elle l’était elle-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠπείλησα
  choice: je l’ai menacé
  rationale: Rend directement l’idée de menace exprimée par le verbe grec.
- source_word: συνῆλθε ... αὐτῇ
  choice: il s’unit à elle
  rationale: Expression française naturelle et digne pour désigner ici une union sexuelle, sans ajouter de précision absente du grec.
- source_word: διέφθειρε ... τὸ σπέρμα ... ἐπὶ τὴν γῆν
  choice: répandit sa semence à terre
  rationale: Rend concrètement l’action décrite tout en conservant le registre narratif du texte.
- source_word: ἐν πονηρίᾳ
  choice: dans sa méchanceté
  rationale: Préserve le jugement moral explicite et le lien avec le verbe Ἐπονηρεύσατο qui suit.
- source_word: τὸν Σηλὼμ δοῦναι αὐτῇ
  choice: la donner à Shéla
  rationale: Le grec dit littéralement donner Shéla à elle, mais le français idiomatique exprime le mariage envisagé en disant donner la femme à l’homme.
- source_word: οὐκ ἀφῆκεν
  choice: ne le permit pas
  rationale: Traduction naturelle du refus maternel sans préciser un objet que le grec laisse contextuel.
- source_word: ἐκ τῶν θυγατέρων τῶν Χαναναίων
  choice: l’une des filles de Canaan
  rationale: Conserve la formulation généalogique et ethnique du grec dans un français clair.
theological_decisions:
- issue: Référents féminins dans la dernière proposition
  choice: Conserver les pronoms « elle » et « elle-même »
  alternative: Nommer explicitement Tamar et la mère de Shéla
  rationale: Le grec conserve les référents sous forme pronominale. Les expliciter résoudrait une ambiguïté réelle du texte source et risquerait d’imposer une interprétation.
- issue: Nature précise de la faute sexuelle
  choice: Décrire l’acte sans lui attribuer une catégorie doctrinale
  alternative: Employer un terme théologique ou moral technique
  rationale: Le passage décrit l’acte et le qualifie de méchanceté, mais ne fournit pas ici de catégorie doctrinale plus précise.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec tout en évitant les tournures artificielles. L’ambiguïté des pronoms féminins de la dernière phrase est volontairement préservée.
