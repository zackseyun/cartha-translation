base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: fr
  text: Durant les jours de la chambre nuptiale, je lui donnai Onan en mariage léviratique. Pourtant, lui aussi, dans sa méchanceté, ne la connut pas, alors même qu’il avait passé une année avec elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: Pendant les jours de la chambre nuptiale
  rationale: Rend directement l’expression grecque tout en conservant son caractère nuptial et sa possible référence à la période des noces.
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  choice: je la donnai à Onan dans le cadre du lévirat
  rationale: Le verbe rare renvoie au mariage léviratique; la formulation française explicite cette institution sans alourdir le texte.
- source_word: ἐν πονηρίᾳ
  choice: dans sa méchanceté
  rationale: Conserve le jugement moral explicite du grec et rattache naturellement la faute à Onan.
- source_word: οὐκ ἔγνω αὐτήν
  choice: ne la connut pas
  rationale: Préserve l’euphémisme biblique de la connaissance sexuelle plutôt que d’en réduire la portée par une explicitation.
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: bien qu’il ait vécu avec elle pendant un an
  rationale: Rend idiomatiquement l’expression grecque «faire/passer une année avec elle» et la valeur concessive impliquée par le contexte.
theological_decisions:
- issue: Nature de la faute d’Onan
  choice: ne la connut pas
  alternative: n’eut pas de relations avec elle
  rationale: La traduction conserve l’ambiguïté et la formulation biblique du grec, sans préciser davantage la conduite sexuelle ni importer l’interprétation du récit de la Genèse.
- issue: Institution du lévirat
  choice: dans le cadre du lévirat
  alternative: comme épouse selon la coutume du beau-frère
  rationale: Le terme français «lévirat» désigne précisément l’institution en cause et évite une paraphrase susceptible d’ajouter des détails absents du verset.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au récit testamentaire; la phrase conserve l’euphémisme scripturaire «connaître» et explicite sobrement le sens institutionnel du verbe relatif au lévirat.
