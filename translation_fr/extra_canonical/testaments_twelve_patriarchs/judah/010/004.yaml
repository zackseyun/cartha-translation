revisions:
- from: Pendant les jours de la chambre nuptiale, je la donnai à Onan dans le cadre du lévirat. Mais lui aussi, dans sa méchanceté, ne la connut pas, bien qu’il ait vécu avec elle pendant un an.
  to: Durant les jours de la chambre nuptiale, je lui donnai Onan en mariage léviratique. Pourtant, lui aussi, dans sa méchanceté, ne la connut pas, alors même qu’il avait passé une année avec elle.
  rationale: La révision corrige l’inversion syntaxique majeure concernant le don d’Onan à la femme. Elle conserve l’euphémisme sexuel du grec, le sens institutionnel du lévirat et la relation concessive entre le refus de « connaître » la femme et l’année passée avec elle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:12Z'
review_pass:
  verdict: revise
  source_fidelity: Le complément datif αὐτῇ (« à elle ») et l’accusatif τὸν Αὐνάν (« Onan ») indiquent que Juda donne Onan à la femme, non l’inverse. Le projet inverse donc les rôles dans la première proposition. La seconde conserve correctement l’euphémisme οὐκ ἔγνω αὐτήν. Le participe ποιήσας appelle une formulation qui maintient le fait qu’il a passé une année avec elle, avec la tension concessive du contexte.
  naturalness: « Pendant les jours de la chambre nuptiale » est compréhensible mais très calqué. « Durant les jours de la chambre nuptiale » reste proche du grec tout en étant légèrement plus fluide. « Je lui donnai Onan en mariage léviratique » est naturel, précis et évite l’inversion des compléments. « Alors même qu’il avait passé une année avec elle » rend souplement la portée concessive du participe.
  terminology: « Mariage léviratique » rend avec exactitude le verbe relatif au lévirat. « Ne la connut pas » préserve l’euphémisme biblique sans imposer une interprétation supplémentaire. « Méchanceté » convient à πονηρία, mais le possessif n’est pas exprimé en grec ; « dans sa méchanceté » demeure ici une explicitation contextuelle acceptable.
  issues:
  - severity: high
    issue: Inversion des personnes dans l’attribution d’Onan
    rationale: Le grec ἐπεγυμβρεύσα αὐτῇ τὸν Αὐνάν a pour destinataire αὐτῇ (« à elle ») et pour objet τὸν Αὐνάν (« Onan »). « Je la donnai à Onan » renverse donc le sens syntaxique du texte source.
  - severity: low
    issue: Rendu du participe ποιήσας
    rationale: « Bien qu’il ait vécu avec elle » est possible, mais « alors même qu’il avait passé une année avec elle » reflète plus directement le participe aoriste et sa tension contextuellement concessive.
  revised_text: Durant les jours de la chambre nuptiale, je lui donnai Onan en mariage léviratique. Pourtant, lui aussi, dans sa méchanceté, ne la connut pas, alors même qu’il avait passé une année avec elle.
  revised_footnotes: []
