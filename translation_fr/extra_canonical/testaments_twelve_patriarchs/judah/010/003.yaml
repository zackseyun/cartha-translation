source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ¹⁴ αὐτὸς οὐκ ἔγνω αὐτὴν¹⁵ κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ¹⁵, οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ¹⁷ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/003.yaml
  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: fr
  text: Et lui, il n’eut pas de relations avec elle, par la ruse de sa mère, car il ne voulait pas avoir d’enfants avec elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτήν
  choice: il n’eut pas de relations avec elle
  rationale: Littéralement « il ne la connut pas » ; dans ce contexte, l’expression est un euphémisme sémitisant désignant les relations sexuelles. La formulation française explicite naturellement le sens sans en ajouter.
- source_word: κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ
  choice: à cause de la ruse de sa mère
  rationale: κατά peut ici exprimer la circonstance ou le motif. « À cause de » rend clairement le rôle de la ruse maternelle, tandis que « ruse » conserve la nuance négative de πανουργία.
- source_word: οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ αὐτῆς
  choice: car il ne voulait pas avoir d’enfants d’elle
  rationale: Traduction proche de la structure grecque. « D’elle » préserve l’idée d’une descendance issue de cette femme, sans préciser davantage le motif.
theological_decisions:
- issue: Nature exacte de la ruse de la mère
  choice: Ne pas l’expliciter
  alternative: Préciser qu’elle aurait conseillé ou organisé l’évitement de la conception
  rationale: Le grec attribue seulement la situation à la πανουργία de sa mère ; toute description du procédé dépasserait le texte.
translation_notes:
  register: Français moderne, sobre et narratif. L’euphémisme grec « connaître » est rendu selon son sens contextuel afin d’éviter en français une lecture purement cognitive. Le pronom initial αὐτός est légèrement mis en relief par « Et lui ».
