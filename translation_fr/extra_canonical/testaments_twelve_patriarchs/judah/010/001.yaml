  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/001.yaml
  text: After these things, Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram.
translation:
  language: fr
  text: Après cela, mon fils Er prit pour femme Tamar, fille d’Aram, venue de Mésopotamie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Rend naturellement la transition temporelle grecque sans l’alourdir.
- source_word: ἄγεται … ἑαυτῷ εἰς γυναῖκα
  choice: prit pour femme
  rationale: Expression française idiomatique correspondant à l’idée de prendre une femme en mariage; le moyen grec marque l’intérêt du sujet.
- source_word: ἐκ Μεσοποταμίας
  choice: venue de Mésopotamie
  rationale: Exprime clairement la provenance de Tamar tout en évitant une succession ambiguë de compléments nominaux.
- source_word: θυγατέρα Ἀράμ
  choice: fille d’Aram
  rationale: Conserve littéralement la relation exprimée par le grec sans déterminer si Aram désigne ici une personne ou une appartenance géographique ou ethnique.
