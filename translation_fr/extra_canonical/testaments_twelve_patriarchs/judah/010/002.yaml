lexical_decisions:
- source_word: πονηρός
  choice: mauvais
  rationale: Rend naturellement le jugement moral porté sur Er sans en préciser davantage la forme.
- source_word: ἐθανάτωσεν
  choice: le fit mourir
  rationale: Exprime directement le fait de causer sa mort dans un registre digne et naturel, sans atténuer l'action de l'ange.
- source_word: ἄγγελος Κυρίου
  choice: un ange du Seigneur
  rationale: Conserve l'absence d'article devant ἄγγελος et la formulation traditionnelle et intelligible de Κυρίου.
theological_decisions:
- issue: Identité de l'agent céleste
  choice: un ange du Seigneur
  alternative: l'ange du Seigneur
  rationale: Le grec présente ἄγγελος sans article; la traduction indéfinie préserve cette donnée sans identifier cet ange à une figure particulière.
