  to: Pendant dix-huit ans, mon père vécut en paix avec son frère Ésaü, et les fils de celui-ci étaient avec nous après notre arrivée de Mésopotamie, de chez Laban.
  rationale: La correction remplace « retour » par « arrivée », afin de ne pas introduire une information directionnelle que le grec ne donne pas. Elle remplace également « vécurent avec nous » par « étaient avec nous », formulation plus proche de la simple coexistence ou présence exprimée par μεθ᾽ ἡμῶν.
