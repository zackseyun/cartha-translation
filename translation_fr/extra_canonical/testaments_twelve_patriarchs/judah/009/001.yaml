  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/001.yaml
  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: fr
  text: Pendant dix-huit ans, mon père vécut en paix avec son frère Ésaü, et les fils de celui-ci étaient avec nous après notre arrivée de Mésopotamie, de chez Laban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνην ἐποίησεν
  choice: vécut en paix
  rationale: L’expression grecque signifie littéralement « fit la paix », mais, avec une durée de dix-huit ans, elle décrit naturellement le maintien de relations pacifiques.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: les fils de celui-ci
  rationale: Le pronom renvoie le plus naturellement à Ésaü; « celui-ci » évite en français une ambiguïté inutile avec le père de Juda.
- source_word: μεθ᾽ ἡμῶν
  choice: vécurent avec nous
  rationale: Le grec dit simplement « avec nous »; l’ajout du verbe « vécurent » produit une phrase française complète sans préciser davantage la nature de cette présence.
- source_word: μετὰ τὸ ἐλθεῖν ἡμᾶς
  choice: après notre retour
  rationale: Le sens littéral est « après que nous sommes venus »; dans ce contexte familial, « notre retour » est idiomatique et indique le déplacement vers le lieu où se déroule le récit.
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  choice: de chez Laban, en Mésopotamie
  rationale: La double construction avec ἀπό indique à la fois le lieu quitté et la personne auprès de qui ils se trouvaient; cette formulation naturelle conserve les deux éléments.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe a été légèrement réorganisée pour rendre naturellement la provenance double (« de Mésopotamie, de chez Laban ») sans modifier le contenu.
