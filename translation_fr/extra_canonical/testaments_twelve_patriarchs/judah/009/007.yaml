  text: Then they asked us for terms of peace, and after counsel had been taken with our father, we accepted them.
translation:
  language: fr
  text: Alors ils nous demandèrent des conditions de paix et, après qu’on eut tenu conseil avec notre père, nous les acceptâmes comme tributaires.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρὸς εἰρήνην
  choice: de faire la paix
  rationale: Cette expression désigne ce qui conduit à la paix, ici une demande d’accord ou de conditions de paix. La formulation verbale est naturelle en français.
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  choice: après avoir consulté notre père
  rationale: Rend de façon idiomatique la délibération menée avec le père, sans préciser davantage qui en prit l’initiative.
- source_word: ὑποδεξάμενοι αὐτοὺς ὑποφόρους
  choice: nous les acceptâmes comme tributaires
  rationale: ὑπόφορος indique une personne ou un peuple assujetti au paiement d’un tribut. Ce détail explicite du grec doit être conservé, bien qu’il soit absent de la version anglaise de consultation.
