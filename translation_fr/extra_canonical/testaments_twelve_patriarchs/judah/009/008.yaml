base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: fr
  text: Ils nous donnaient cinq cents cors[a] de blé, cinq cents baths[b] d’huile et cinq cents mesures[c] de vin, jusqu’à la famine, lorsque nous sommes descendus en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le cor était une ancienne unité de capacité pour les matières sèches; sa valeur exacte a varié selon les époques et les régions.
    reason: Éclairer une unité ancienne peu connue sans proposer une conversion moderne faussement précise.
  - marker: b
    text: Le bath était une ancienne unité de capacité pour les liquides. La forme grecque transmise à cet endroit est incertaine.
    reason: Rendre visible l’incertitude textuelle tout en expliquant l’unité retenue.
  - marker: c
    text: Le texte dit simplement « mesures »; l’unité exacte n’est pas certaine.
    reason: Préserver l’imprécision réelle du texte grec au lieu d’identifier arbitrairement une mesure particulière.
lexical_decisions:
- source_word: ἦσαν διδόντες
  choice: ils nous donnaient
  rationale: La périphrase à l’imparfait exprime une action habituelle ou continue; l’imparfait français la rend naturellement.
- source_word: πυροῦ
  choice: de blé
  rationale: Le terme désigne ici le blé comme produit mesuré.
- source_word: κόρους
  choice: kors
  rationale: Conservation du nom de l’unité ancienne plutôt que conversion conjecturale en unité moderne.
- source_word: ἐλαίου †ὕφης
  choice: baths d’huile
  rationale: « Baths » suit l’identification probable de l’unité de capacité pour les liquides, tout en signalant en note que la forme grecque transmise est incertaine.
- source_word: οἴνου *μέτρα
  choice: mesures de vin
  rationale: Le grec parle génériquement de mesures et présente en outre une incertitude textuelle; une unité plus précise ne doit pas être imposée.
- source_word: ἕως τοῦ λιμοῦ ὅτε κατήλθομεν εἰς Αἴγυπτον
  choice: jusqu’à la famine, époque où nous sommes descendus en Égypte
  rationale: Cette formulation conserve le lien temporel entre la famine et la descente en Égypte sans ajouter de relation causale explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms d’unités anciennes sont conservés et expliqués en notes; la tournure « époque où » évite l’ambiguïté maladroite de « jusqu’à la famine, quand » tout en maintenant la relation temporelle du grec.
