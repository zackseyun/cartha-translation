    text: 'Ou : « quatre de leurs chefs ».'
    reason: Le nom δυνάστας peut désigner des hommes puissants, des notables ou des dirigeants; le contexte ne permet pas de fixer avec certitude leur fonction.
  revision_rationale: La seule correction nécessaire supprime l’ajout non exprimé « nous » et formule explicitement la durée (« depuis vingt jours »). Le reste du texte et la note préservent la portée du grec et son ambiguïté sociale ou politique.
