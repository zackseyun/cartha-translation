base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: fr
  text: Comme, depuis vingt jours, ils n’avaient pas ouvert, alors qu’ils montaient la garde, j’amenai une échelle. Ayant placé mon bouclier au-dessus de ma tête, je montai tout en recevant les pierres qui venaient de la muraille, et je tuai quatre hommes puissants[a] dans leur ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quatre de leurs chefs ».'
    reason: Le nom δυνάστας peut désigner des hommes puissants, des notables ou des dirigeants; le contexte ne permet pas de fixer avec certitude leur fonction.
lexical_decisions:
- source_word: δρώντων αὐτῶν
  choice: alors qu’ils montaient la garde
  rationale: Dans le contexte d’un siège et d’une escalade sous les pierres, l’expression décrit leur surveillance active; cette formulation française est plus naturelle que « alors qu’ils regardaient ».
- source_word: προσάγω κλίμακα
  choice: j’amenai une échelle
  rationale: Rend simplement l’action d’apporter ou d’amener l’échelle sur place, sans ajouter l’idée de la dresser, que le grec n’énonce pas explicitement.
- source_word: τὴν ἀσπίδα ἐπὶ τῆς κεφαλῆς μου
  choice: mon bouclier au-dessus de ma tête
  rationale: Reproduit précisément la position protectrice du bouclier.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: tout en recevant les pierres qui venaient de la muraille
  rationale: Conserve l’image grecque des pierres reçues depuis la muraille sans préciser qu’elles étaient lancées, même si le contexte le suggère fortement.
- source_word: τέσσαρας πόλει αὐτῶν δυνάστας
  choice: quatre hommes puissants dans leur ville
  rationale: Préserve à la fois la localisation exprimée par πόλει αὐτῶν et le sens large de δυνάστας, sans imposer qu’il s’agisse nécessairement de dirigeants officiels.
