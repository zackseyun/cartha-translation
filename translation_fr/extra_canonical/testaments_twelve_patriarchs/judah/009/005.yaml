revisions:
- from: Comme ils ne nous avaient pas ouvert pendant vingt jours, alors qu’ils montaient la garde, j’amenai une échelle. Ayant placé mon bouclier au-dessus de ma tête, je montai tout en recevant les pierres qui venaient de la muraille, et je tuai quatre hommes puissants[a] dans leur ville.
  to: Comme, depuis vingt jours, ils n’avaient pas ouvert, alors qu’ils montaient la garde, j’amenai une échelle. Ayant placé mon bouclier au-dessus de ma tête, je montai tout en recevant les pierres qui venaient de la muraille, et je tuai quatre hommes puissants[a] dans leur ville.
  rationale: La seule correction nécessaire supprime l’ajout non exprimé « nous » et formule explicitement la durée (« depuis vingt jours »). Le reste du texte et la note préservent la portée du grec et son ambiguïté sociale ou politique.
