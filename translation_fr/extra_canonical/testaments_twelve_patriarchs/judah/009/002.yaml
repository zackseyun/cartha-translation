  text: And when the eighteen years were fulfilled, Esau, my father's brother, returned to us with a large and strong people.
translation:
  language: fr
  text: Quand les dix-huit années furent accomplies, Ésaü, le frère de mon père, revint vers nous avec un peuple nombreux et puissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληρωθέντων τῶν δεκαοκτὼ ἐτῶν
  choice: les dix-huit années furent accomplies
  rationale: Conserve l’image grecque de l’accomplissement d’une période tout en restant intelligible en français.
- source_word: ἐπανῆλθεν ἡμῖν
  choice: revint vers nous
  rationale: Rend le sens de retour exprimé par ἐπανῆλθεν et la relation indiquée par ἡμῖν, sans introduire l’idée non explicite d’une attaque.
- source_word: ὁ ἀδελφὸς τοῦ πατρός μου
  choice: le frère de mon père
  rationale: Traduction directe et naturelle de la désignation familiale.
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: avec un peuple nombreux et puissant
  rationale: Dans ce contexte collectif, βαρύς évoque vraisemblablement une force imposante ou un grand nombre plutôt qu’un poids littéral; ἰσχυρός est rendu par « puissant ».
