  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: fr
  text: Nous avons poursuivi les fils d’Ésaü ; eux aussi avaient une ville fortifiée, et nous n’avons pas pu y entrer. Mais, nous étant installés autour d’elle, nous l’avons assiégée.
