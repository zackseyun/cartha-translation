lexical_decisions:
- source_word: κατεδιώξαμεν
  choice: avons poursuivi
  rationale: Rend directement le verbe de poursuite, avec son caractère actif et soutenu.
- source_word: τοὺς υἱοὺς Ἡσαῦ
  choice: les fils d’Ésaü
  rationale: Conserve la désignation généalogique du grec sans la généraliser en « descendants ».
- source_word: πόλις ὀχυρά
  choice: ville fortifiée
  rationale: Équivalent français naturel et précis pour une ville munie de défenses.
- source_word: περικαθίσαντες
  choice: avons établi le siège autour d’elle
  rationale: Le participe évoque l’installation tout autour de la ville; une traduction idiomatique évite le calque peu naturel « nous étant assis autour ».
- source_word: ἐπολιορκοῦμεν
  choice: nous l’avons assiégée
  rationale: Exprime clairement l’action militaire durative décrite par l’imparfait grec.
