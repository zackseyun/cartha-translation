  text: And Jacob struck Esau with a bow, and he fell by Jacob's bow, dead on Mount Seir.
translation:
  language: fr
  text: Jacob atteignit Ésaü avec un arc, puis le mort fut soulevé[a] sur le mont Séir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut enlevé » ou « fut emporté ». Le grec dit littéralement : « fut soulevé » ; il ne dit pas qu’Ésaü tomba.'
    reason: Le passif grec ἤρθη peut recevoir plusieurs rendus contextuels. La note conserve cette ouverture tout en laissant le texte principal suivre le sens de base du verbe.
lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  choice: atteignit … avec un arc
  rationale: ἔπαισεν signifie « frappa » ou « atteignit » ; avec τόξον, « atteignit … avec un arc » exprime naturellement en français l’usage de l’arc sans ajouter explicitement une flèche absente du grec.
- source_word: ἤρθη ὁ νεκρός
  choice: le mort fut emporté
  rationale: Le passif ἤρθη peut signifier « fut soulevé », « fut enlevé » ou « fut emporté ». « Le mort fut emporté » conserve la mention substantivée du mort et donne un sens français naturel sans suivre l’anglais, dont « he fell » ne correspond pas au texte grec fourni.
- source_word: ἐν ὄρει Σεείρ
  choice: sur le mont Séir
  rationale: Formulation géographique française courante, correspondant à la localisation grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le nom « Ésaü » suit l’usage biblique français courant. La traduction privilégie ici le grec fourni plutôt que la reformulation anglaise.
