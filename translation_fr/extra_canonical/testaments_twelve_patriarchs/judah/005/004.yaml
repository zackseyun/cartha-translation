source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἀνεπήδησεν τὸ τεῖχος¹⁶. 4. *Καὶ οὕτως λάθρα οἱ ἀδελφοί μου ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους εἰσῆλθον εἰς τὴν πόλιν¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/004.yaml
  text: But all my brothers, having driven stakes into the wall from both sides, entered the city while they were unaware.
translation:
  language: fr
  text: Ainsi, mes frères entrèrent secrètement dans la ville par les deux côtés de la muraille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Exprime naturellement la manière ou la conséquence indiquée par l’adverbe grec.
- source_word: λάθρα
  choice: secrètement
  rationale: Rend explicitement l’idée d’une action accomplie en cachette, présente dans le texte grec.
- source_word: οἱ ἀδελφοί μου
  choice: mes frères
  rationale: Traduction directe; le grec fourni ne comporte pas de terme signifiant « tous ».
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  choice: par les deux côtés de la muraille
  rationale: Conserve la référence aux deux côtés sans ajouter les pieux mentionnés seulement dans la couche anglaise fournie.
- source_word: εἰσῆλθον εἰς τὴν πόλιν
  choice: entrèrent dans la ville
  rationale: Rend directement le mouvement d’entrée exprimé par le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et narratif. Le texte suit prioritairement le grec fourni, qui contient λάθρα (« secrètement »), mais ne contient ni « tous », ni l’action d’enfoncer des pieux, ni la proposition « tandis qu’ils ne s’en rendaient pas compte » présente dans la version anglaise de consultation.
