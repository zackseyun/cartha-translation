- from: Nous les avons tous tués[a], puis nous avons repris nos captifs.
  to: Nous les avons tous tués[a], et nous avons de nouveau repris nos captifs.
  rationale: La révision remplace « puis » par « de nouveau » afin de rendre explicitement πάλιν. Elle conserve « repris nos captifs », qui exprime naturellement en français la récupération de la captivité/des captifs désignée par τὴν αἰχμαλωσίαν ἡμῶν, sans suivre l'ajout non attesté dans le grec de la couche anglaise.
