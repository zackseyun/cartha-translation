source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἀπεκτείναμεν πάντας²⁵ καὶ πάλιν ἐλάβομεν τὴν αἰχμαλωσίαν ἡμῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/007.yaml
  text: And we killed them also, and burned the city, and everything in it.
translation:
  language: fr
  text: Nous les avons tous tués[a], et nous avons de nouveau repris nos captifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins omettent « tous ».
    reason: L’exposant ²⁵ attaché à πάντας dans l’édition signale une variante textuelle; la note préserve cette donnée sans surcharger le texte.
lexical_decisions:
- source_word: Ἀπεκτείναμεν
  choice: Nous avons tué
  rationale: Rend directement l’aoriste actif grec, qui décrit une action achevée.
- source_word: πάντας
  choice: tous
  rationale: Conserve l’étendue explicite de l’adjectif grec, dont le référent masculin pluriel dépend du contexte.
- source_word: πάλιν
  choice: puis
  rationale: Dans cette séquence narrative, le terme marque naturellement l’action suivante; « de nouveau » reste possible.
- source_word: ἐλάβομεν
  choice: nous avons repris
  rationale: Le verbe λαμβάνω signifie littéralement « prendre »; avec des captifs précédemment perdus, « reprendre » exprime naturellement la récupération sans ajouter d’action absente du grec.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: nos captifs
  rationale: Le substantif abstrait αἰχμαλωσία peut désigner collectivement les personnes emmenées en captivité. Cette formulation française est plus naturelle que « notre captivité » dans ce contexte.
theological_decisions:
- issue: Écart entre le grec fourni et la couche anglaise consultative
  choice: 'Suivre le grec: reprise des captifs'
  alternative: « brûlé la ville et tout ce qui s’y trouvait »
  rationale: La mention de l’incendie de la ville ne figure pas dans le texte grec cité et ne doit donc pas être introduite dans la traduction.
translation_notes:
  register: Français moderne, direct et narratif, avec une dignité sobre. La traduction suit prioritairement le grec fourni et n’intègre pas l’ajout divergent de la version anglaise.
