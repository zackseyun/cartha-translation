source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ κατελάβομεν αὐτὴν¹⁸ ἐν στόματι μαχαίρας¹⁹, καὶ τοὺς ἐν τῷ πύργῳ²⁰ καταφυγόντας ἐν πυρὶ ἐνεπρήσαμεν, καὶ οὕτως πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/005.yaml
  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: fr
  text: Nous nous en emparâmes par le tranchant de l’épée, et nous livrâmes aux flammes ceux qui s’étaient réfugiés dans la tour. Ainsi, nous les capturâmes tous, ainsi que tout ce qui leur appartenait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν στόματι μαχαίρας
  choice: par le tranchant de l’épée
  rationale: Rend naturellement en français l’expression idiomatique grecque, littéralement « par la bouche de l’épée », sans en affaiblir la violence.
- source_word: ἐν τῷ πύργῳ
  choice: dans la tour
  rationale: Conserve le singulier défini du grec.
- source_word: ἐν πυρὶ ἐνεπρήσαμεν
  choice: nous livrâmes aux flammes
  rationale: Expression française naturelle et soutenue qui communique clairement l’idée de brûler par le feu.
- source_word: καὶ πάντα τὰ αὐτῶν
  choice: avec tout ce qui leur appartenait
  rationale: Restitue la proposition finale présente dans le grec, qui désigne leurs biens ou possessions, mais absente de la couche anglaise fournie.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit. Le référent féminin de αὐτήν reste implicite dans « nous nous en emparâmes », ce qui évite d’ajouter « ville » sans le contexte immédiat. La dernière proposition du grec est conservée.
