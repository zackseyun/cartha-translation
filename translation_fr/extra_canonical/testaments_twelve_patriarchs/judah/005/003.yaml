  text: And those on the wall, thinking that we were alone, were drawn toward us.
translation:
  language: fr
  text: Et ceux qui étaient sur la muraille, pensant que nous étions seuls, furent attirés vers nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  choice: ceux qui étaient sur la muraille
  rationale: Rend naturellement la désignation substantivée et la position indiquée par ἐπί avec le génitif.
- source_word: ὅτι ἡμεῖς μόνοι ἐσμέν
  choice: pensant que nous étions seuls
  rationale: Dans ce contexte, ὅτι introduit le motif de leur réaction; le participe implicite « pensant » explicite sobrement ce rapport sans modifier le sens.
- source_word: ἐφειλκύσθησαν
  choice: furent attirés
  rationale: Conserve la forme passive et l'idée d'être amené ou entraîné dans une direction, sans ajouter l'idée d'une sortie ou d'une attaque.
- source_word: πρὸς ἡμᾶς
  choice: vers nous
  rationale: Reproduit directement le mouvement en direction du groupe, sans transformer πρὸς en « contre ».
