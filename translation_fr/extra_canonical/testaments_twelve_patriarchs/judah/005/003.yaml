  text: Καὶ²¹ οἱ ἐπὶ τοῦ τείχους¹², ὅτι ἡμεῖς μόνοι ἐσμὲν¹³, ἐφειλκύσθησαν¹⁴ πρὸς¹⁵ ἡμᾶς.
