translation_notes:
  register: Français international moderne, narratif et digne. La traduction suit prioritairement le grec fourni. Elle n’intègre pas les éléments supplémentaires de la couche anglaise (« après les avoir remis à nos fils » et « jusqu’à Thapphoué »), absents du texte grec cité.
