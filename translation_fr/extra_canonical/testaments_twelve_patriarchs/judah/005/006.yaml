  source_fidelity: Le projet suit le grec fourni et évite à juste titre les précisions de la couche anglaise (« remis à nos fils », « jusqu’à Thapphoué »), absentes de ce témoin. Le nom Βαβουὲ est explicitement marqué comme corrompu ou douteux (†) et la note le signale. La discordance entre ἡμεῖς (« nous ») et συνῆψαν (« ils engagèrent ») est également correctement identifiée; la traduction contextuelle au premier pluriel est défendable, à condition de la documenter.
  naturalness: « Quand nous le vîmes » est grammaticalement possible, mais « Voyant cela » rend plus naturellement le participe grec ἰδόντες sans donner à « le » un antécédent imprécis. « Alors que nous partions » est un peu plus direct que « Pendant que nous repartions », sans introduire l’idée supplémentaire d’un retour implicite dans « repartir ».
  terminology: « Captifs » rend adéquatement αἰχμαλωσία dans son emploi collectif concret. « Engager le combat contre eux » est idiomatique et fidèle à συνάπτειν πόλεμον μετὰ τινων. La translittération « Baboué » peut être conservée, avec la réserve textuelle indiquée.
