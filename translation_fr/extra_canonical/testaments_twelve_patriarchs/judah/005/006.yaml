  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: fr
  text: Alors que nous partions, des hommes de Baboué[a] s’emparèrent de nos captifs. Voyant cela, nous engageâmes le combat contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Baboué » est incertain dans le texte grec; une autre tradition le présente comme « Thapphoué ».
    reason: Le nom est signalé comme textuellement douteux dans l’édition, tandis que la couche anglaise atteste une autre forme.
  - marker: b
    text: 'Le grec transmis présente ici une discordance : il porte le pronom « nous », mais le verbe est à la troisième personne du pluriel (« ils engagèrent »). Le sens contextuel retenu est : « nous engageâmes le combat contre eux ».'
    reason: Cette note préserve une difficulté réelle du texte source au lieu de la corriger silencieusement.
lexical_decisions:
- source_word: ἀπιέναι
  choice: repartions
  rationale: Le verbe signifie ici « s’en aller, partir »; « repartir » convient naturellement au déplacement du groupe dans ce contexte.
- source_word: ἄνδρες Βαβουὲ
  choice: des hommes de Baboué
  rationale: Le nom propre est translittéré d’après le grec fourni, sans lui substituer silencieusement la forme différente de la couche anglaise.
- source_word: ἐπελάβοντο
  choice: s’emparèrent de
  rationale: Le moyen de ἐπιλαμβάνομαι exprime une prise effective ou une saisie; cette formulation convient à des captifs.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: nos captifs
  rationale: Le nom collectif abstrait « captivité » désigne ici concrètement le groupe emmené captif; « nos captifs » est idiomatique en français.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: nous engageâmes le combat contre eux
  rationale: L’expression signifie littéralement « nouer/engager le combat avec eux ». Le contexte et le pronom ἡμεῖς indiquent que le narrateur et les siens combattent les assaillants, malgré une discordance grammaticale dans le verbe transmis.
