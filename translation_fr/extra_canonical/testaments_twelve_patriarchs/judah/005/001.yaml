- source_word: πόλιν κραταιάν
  choice: une ville puissante
  rationale: κραταιός exprime ici la puissance ou la force de la ville; une formulation simple évite d'ajouter le doublet anglais « mighty and strong », absent du grec.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: qui nous menaçait de mort
  rationale: Formulation française idiomatique qui conserve la menace mortelle dirigée contre le groupe.
