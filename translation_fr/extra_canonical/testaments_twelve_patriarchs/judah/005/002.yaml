  text: But I and Gad attacked from the east of the city, and Reuben and Levi from the west.
translation:
  language: fr
  text: Mais Gad et moi, nous avons attaqué depuis l’est de la ville, et Ruben et Lévi depuis l’ouest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέφθημεν
  choice: nous avons attaqué
  rationale: Dans ce récit militaire, le verbe exprime le fait de prendre les devants ou de lancer l’attaque. « Nous avons attaqué » restitue naturellement le sens contextuel sans ajouter de précision tactique incertaine.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: la ville par l’est
  rationale: Cette tournure française naturelle indique le côté depuis lequel l’assaut est mené, tout en conservant l’orientation du grec.
- source_word: ἀπὸ δυσμῶν
  choice: par l’ouest
  rationale: Rend directement l’orientation opposée et reprend elliptiquement « la ville », comme le fait le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. L’ordre « Gad et moi » est idiomatique en français. La répétition de « l’attaquaient » explicite l’ellipse grecque et évite que « par l’ouest » soit rattaché de façon ambiguë au premier verbe.
