  text: Ὅτι¹⁰ ταῦτα¹¹ ἀφιστᾷ¹² τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ¹⁴ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν¹⁵ ἐκδιδάσκει, καὶ οὐκ ἀφίει¹⁶ ἄνδρα ἐλεῆσαι¹⁷ τὸν¹⁸ πλησίον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: fr
  text: Car tout cela détourne de la loi de Dieu, aveugle le discernement de l’âme, enseigne l’orgueil et ne permet pas à un homme de faire miséricorde à son prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: tout cela
  rationale: Le neutre pluriel renvoie collectivement aux réalités mentionnées auparavant; le français « tout cela » s’accorde naturellement avec la série de verbes au singulier dans le grec transmis.
- source_word: ἀφιστᾷ
  choice: détourne
  rationale: Rend l’idée d’éloigner quelqu’un d’une norme ou de l’amener à s’en écarter, sans préciser un sujet humain absent du grec.
- source_word: διαβούλιον τῆς ψυχῆς
  choice: le discernement de l’âme
  rationale: διαβούλιον désigne ici la faculté de délibérer ou de juger; « discernement » est naturel en français et évite le sens finaliste de « dessein ».
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: enseigne l’orgueil
  rationale: Traduction directe et idiomatique de l’action par laquelle ces réalités inculquent l’arrogance.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  choice: faire preuve de compassion envers son prochain
  rationale: Exprime la compassion active de ἐλεέω tout en conservant le terme relationnel traditionnel et intelligible « prochain ».
theological_decisions:
- issue: Agent humain implicite avec ἄνδρα
  choice: empêche de faire preuve de compassion
  alternative: ne permet pas à un homme de faire miséricorde
  rationale: L’infinitif français sans sujet exprimé transmet la portée générale de ἄνδρα sans donner au verset une restriction masculine étrangère à sa visée, tout en préservant l’idée d’empêchement.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la répétition structurante des verbes tout en évitant une lourdeur inutile; « âme », « loi de Dieu », « orgueil » et « prochain » maintiennent le registre moral et religieux du texte.
