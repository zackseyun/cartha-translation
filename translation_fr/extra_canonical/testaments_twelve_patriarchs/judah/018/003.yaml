  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: fr
  text: Et Abraham, mon ancêtre, m’a béni pour que je règne en Israël, et Jacob m’a béni de même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρόπατός μου
  choice: mon ancêtre
  rationale: « Ancêtre » rend naturellement πρόπατος en français moderne et convient à Abraham comme ascendant lointain de Juda.
- source_word: εὐλόγησέ με βασιλεύειν
  choice: m’a béni pour que je règne
  rationale: Cette tournure conserve le lien entre la bénédiction et le règne exprimé par l’infinitif βασιλεύειν, sans rendre la phrase artificielle en français.
- source_word: ἐν Ἰσραήλ
  choice: en Israël
  rationale: Rendu direct de la préposition et du nom, en préservant la portée potentiellement territoriale ou collective de l’expression.
- source_word: οὕτως
  choice: de même
  rationale: « De même » exprime clairement que Jacob a lui aussi béni Juda, avec un registre naturel et digne.
theological_decisions:
- issue: Rapport entre la bénédiction d’Abraham et le règne de Juda
  choice: pour que je règne
  alternative: en vue de régner
  rationale: Le texte présente le règne comme la visée ou le contenu prospectif de la bénédiction. La traduction n’ajoute ni accomplissement immédiat ni interprétation institutionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée par « et » suit la simplicité solennelle du grec; aucune note n’est nécessaire.
