  text: And I know what evils you will do in the last days.
translation:
  language: fr
  text: Et je sais tous les méfaits que vous commettrez dans les derniers jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « dans les derniers jours » est placée entre crochets dans l’édition grecque consultée, ce qui signale une incertitude textuelle.
    reason: Reproduit la réserve textuelle visible dans la source sans préciser, faute d’apparat fourni, la nature exacte de cette incertitude.
lexical_decisions:
- source_word: ἔγνωκα
  choice: je sais
  rationale: 'Le parfait grec a ici une valeur résultative : le locuteur a acquis cette connaissance et la possède désormais.'
- source_word: ὅσα κακὰ
  choice: quels maux
  rationale: Cette formulation naturelle en français conserve l’idée de l’ensemble des actes mauvais annoncés, sans surcharger le texte.
- source_word: ποιήσετε
  choice: vous commettrez
  rationale: Avec « maux », « commettre » rend idiomatiquement ποιέω tout en maintenant le futur de l’original.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: dans les derniers jours
  rationale: Traduction formellement proche de l’expression temporelle grecque et conforme à son registre eschatologique traditionnel.
theological_decisions:
- issue: Portée eschatologique de « derniers jours »
  choice: Conserver littéralement « dans les derniers jours »
  alternative: à la fin des temps
  rationale: Le grec parle de « jours » et peut désigner une période finale sans préciser davantage sa chronologie; la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. « Quels maux vous commettrez » est plus idiomatique que le calque « combien de maux vous ferez », tandis que « les derniers jours » préserve la formulation et la tension eschatologiques du grec.
