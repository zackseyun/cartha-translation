source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε⁵ οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας⁷, καὶ ἀκούσατε⁸ Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/005.yaml
  text: Guard yourselves, therefore, my children, from sexual immorality and the love of money, and listen to Judah your father.
translation:
  language: fr
  text: Gardez-vous donc, mes enfants, de l’immoralité sexuelle et de l’amour de l’argent, et écoutez Juda, votre père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Gardez-vous
  rationale: L’impératif moyen exprime ici l’idée de se tenir soi-même à l’écart d’un danger; « Gardez-vous » est naturel, direct et digne.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Le terme grec désigne largement les conduites sexuelles illicites; ce choix moderne conserve cette portée sans la réduire à la prostitution.
- source_word: φιλαργυρίας
  choice: amour de l’argent
  rationale: Rend directement l’attachement avide à l’argent exprimé par le grec, dans une formulation courante et intelligible.
- source_word: ἀκούσατε
  choice: écoutez
  rationale: Conserve l’impératif et peut inclure, selon le contexte, l’idée de prêter attention et d’obéir, sans expliciter indûment cette dernière nuance.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Juda, votre père
  rationale: Reproduit l’identification appositive du locuteur dans un ordre français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et solennel. La coordination grecque sous une seule préposition est rendue naturellement par « de… et de… », nécessaire en français devant les deux groupes nominaux.
