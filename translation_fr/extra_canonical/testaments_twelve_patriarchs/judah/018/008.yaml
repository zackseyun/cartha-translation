base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/008.yaml
  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: fr
  text: 8. Il[a] entrave les sacrifices de Dieu et ne se souvient pas de la bénédiction de Dieu. Il n’écoute pas quand un prophète parle et s’irrite contre les paroles de piété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici, comme dans toute la suite du verset, des verbes au singulier (« il »), bien que certaines traductions les rendent au pluriel.
    reason: Signaler l’écart avec la couche anglaise de consultation et expliquer le maintien du singulier, conformément à la morphologie grecque.
lexical_decisions:
- source_word: Θυσίας Θεοῦ
  choice: les sacrifices offerts à Dieu
  rationale: Le génitif grec peut être rendu littéralement par « sacrifices de Dieu », mais, en français courant, cette formule pourrait suggérer que Dieu les offre. « Offerts à Dieu » exprime naturellement leur destination cultuelle sans surinterpréter le texte.
- source_word: εὐλογίαν Θεοῦ
  choice: la bénédiction de Dieu
  rationale: 'Cette formulation préserve l’ambiguïté du génitif : bénédiction venant de Dieu ou bénédiction qui lui est adressée.'
- source_word: Προφήτου λαλοῦντος
  choice: quand un prophète parle
  rationale: Le génitif absolu indique la circonstance temporelle; cette tournure est naturelle et fidèle en français moderne.
- source_word: λόγους εὐσεβείας
  choice: les paroles de piété
  rationale: « Piété » rend εὐσέβεια sans lui imposer un contenu confessionnel plus précis.
- source_word: προσοχθίζει
  choice: s’irrite contre
  rationale: Le verbe exprime l’irritation, le mécontentement ou l’aversion envers ces paroles; « s’irrite contre » conserve cette force dans un registre digne et accessible.
theological_decisions:
- issue: Nombre grammatical du sujet
  choice: Employer le singulier « il »
  alternative: Employer le pluriel « ils », comme dans la couche anglaise révisée
  rationale: Les quatre verbes grecs (ἐμποδίζει, μνημονεύει, ἀκούει, προσοχθίζει) sont tous à la troisième personne du singulier. Le français suit donc le texte grec plutôt que d’harmoniser le verset au pluriel.
- issue: Sens du génitif dans « bénédiction de Dieu »
  choice: Conserver « de Dieu »
  alternative: Préciser « la bénédiction accordée par Dieu » ou « la bénédiction adressée à Dieu »
  rationale: Le grec ne tranche pas explicitement entre une bénédiction venant de Dieu et une bénédiction prononcée à son égard; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du parallélisme grec tout en évitant des génitifs cultuels potentiellement trompeurs. Le singulier est conservé conformément au texte source.
