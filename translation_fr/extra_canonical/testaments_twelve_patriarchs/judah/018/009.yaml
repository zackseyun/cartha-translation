revisions:
- from: Car il est asservi à deux passions contraires et ne peut obéir à Dieu, parce qu’elles[a] ont aveuglé son âme ; même en plein jour, il marche comme dans la nuit.
  to: Car il est asservi à deux passions contraires et ne peut obéir à Dieu, parce qu’il a aveuglé son âme ; il marche en plein jour comme dans la nuit.
  rationale: 'La correction remplace le sujet pluriel interprétatif par le singulier implicite du grec. Elle conserve l’enchaînement des deux actions au singulier et maintient la proposition finale attestée par la source grecque. Aucune note n’est nécessaire : le français « il » reflète la reprise normale du sujet sous-entendu, sans prétendre identifier plus précisément la cause ou la portée morale de l’aveuglement.'
