source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: fr
  text: Car il est asservi à deux passions contraires et ne peut obéir à Dieu, parce qu’il a aveuglé son âme ; il marche en plein jour comme dans la nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: passions
  rationale: Le terme désigne ici des impulsions ou dispositions qui dominent la personne ; « passions » conserve cette force morale sans préciser davantage leur nature.
- source_word: δουλεύει
  choice: est asservi
  rationale: Le verbe exprime le fait de servir comme esclave. « Est asservi » rend cette domination plus nettement que le simple « sert ».
- source_word: ὑπακοῦσαι
  choice: obéir
  rationale: Traduction directe du verbe exprimant l’écoute soumise et l’obéissance.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: ont aveuglé son âme
  rationale: Cette formulation conserve l’image de l’aveuglement intérieur et rattache naturellement l’action aux deux passions mentionnées, tout en signalant en note l’ambiguïté grammaticale du grec.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: même en plein jour, il marche comme dans la nuit
  rationale: Rend l’opposition jour-nuit et le sens concret de πορεύεται, tout en produisant une phrase française naturelle.
theological_decisions:
- issue: Cause de l’incapacité à obéir à Dieu
  choice: Les passions ont aveuglé l’âme de la personne.
  alternative: La personne elle-même, ou une réalité implicite au singulier, a aveuglé son âme.
  rationale: Le contexte immédiat présente les deux passions comme les puissances qui l’asservissent ; toutefois, le singulier du verbe grec empêche d’éliminer entièrement une autre compréhension, d’où la note.
translation_notes:
  register: Français moderne, digne et accessible. La traduction rétablit la proposition finale sur la marche en plein jour comme dans la nuit, présente dans le texte grec mais absente de la couche anglaise fournie.
