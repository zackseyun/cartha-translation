  text: The Lord gave me favor in obedience to my father,
translation:
  language: fr
  text: que le Seigneur m’a accordée dans l’obéissance à mon père,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: que… accordée
  rationale: Le pronom relatif féminin renvoie à un antécédent dans le contexte précédent; la forme française conserve ce lien sans ajouter ici un nom absent du segment grec.
- source_word: ἔδωκέ μοι
  choice: m’a accordée
  rationale: « Accorder » rend naturellement l’idée de donner une faveur ou un bien immatériel; l’accord au féminin reflète ἣν.
- source_word: Κύριος
  choice: le Seigneur
  rationale: Équivalent français courant et digne du titre grec.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: dans l’obéissance à mon père
  rationale: Cette formulation conserve la construction ἐν et évite de trancher entre circonstance, moyen et cause; « à mon père » exprime la relation impliquée par le génitif grec.
theological_decisions:
- issue: Rapport entre le don du Seigneur et l’obéissance au père
  choice: dans l’obéissance à mon père
  alternative: parce que j’ai obéi à mon père
  rationale: Le grec ne formule pas explicitement un rapport causal; la traduction retenue préserve donc sa portée plus ouverte.
translation_notes:
  register: Français moderne, digne et proche de la syntaxe grecque. Le début par un relatif et la virgule finale conservent le caractère fragmentaire du segment fourni et son rattachement au contexte.
