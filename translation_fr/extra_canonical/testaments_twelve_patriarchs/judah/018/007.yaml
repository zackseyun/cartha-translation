  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/007.yaml
  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: fr
  text: Elle prive son âme de toute bonté et le retient dans les peines et les travaux pénibles ; elle éloigne de lui le sommeil et consume sa chair.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: prive
  rationale: Rend directement l’idée de dépouiller ou de priver quelqu’un de quelque chose.
- source_word: ἀπὸ πάσης ἀγαθότητος
  choice: de toute bonté
  rationale: Conserve le sens large et potentiellement moral de ἀγαθότης sans le réduire à un bienfait particulier.
- source_word: συνέχει
  choice: retient
  rationale: Exprime l’idée d’être maintenu ou tenu sous l’emprise des souffrances.
- source_word: ἐν πόνοις καὶ μόχθοις
  choice: dans les peines et les travaux pénibles
  rationale: Distingue πόνοις, les peines ou souffrances, de μόχθοις, les labeurs éprouvants.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: éloigne de lui le sommeil
  rationale: Formulation française naturelle correspondant au fait de chasser ou faire disparaître le sommeil.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: consume sa chair
  rationale: Préserve la force du verbe intensif et rend le pluriel idiomatique σάρκας par le singulier collectif français « chair ».
theological_decisions:
- issue: Sujet grammatical implicite des verbes
  choice: Elle, au singulier
  alternative: Ils ou elles, au pluriel
  rationale: Tous les verbes grecs de ce verset sont au singulier ; le pronom reprend donc l’antécédent singulier du contexte plutôt que plusieurs agents.
translation_notes:
  register: Français moderne, international et digne. La phrase garde le parallélisme du grec tout en employant une syntaxe naturelle ; aucune ambiguïté supplémentaire n’est résolue au-delà du nombre grammatical explicite.
