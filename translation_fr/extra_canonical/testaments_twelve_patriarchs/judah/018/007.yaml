  verdict: approve
  source_fidelity: Le singulier féminin « Elle » reflète correctement les formes verbales grecques au singulier et conserve l’antécédent contextuel sans le préciser indûment. « prive son âme de toute bonté », « le retient dans les peines et les travaux pénibles », « éloigne de lui le sommeil » et « consume sa chair » rendent avec fidélité les quatre propositions grecques, y compris la force de καταδαπανᾷ. Le singulier collectif français « sa chair » est une transposition idiomatique recevable du pluriel grec τὰς σάρκας.
  naturalness: La formulation est claire, fluide et de registre soutenu sans archaïsme. Le parallélisme des propositions est bien préservé. « Peines et travaux pénibles » explicite utilement la distinction entre πόνοι et μόχθοι tout en restant naturel.
  terminology: « Âme », « bonté », « peines », « travaux pénibles », « sommeil » et « chair » sont des choix modernes et suffisamment larges. Ils ne surinterprètent pas le texte ni n’imposent de lecture doctrinale. Aucun nom propre, terme théologique technique ou ancre de note ne requiert d’ajustement.
