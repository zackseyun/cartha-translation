  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
translation:
  language: fr
  text: 10 Après cela[a], mon fils Er prit pour femme Tamar, fille d’Aram venue de Mésopotamie. 2 Er était méchant, et un ange du Seigneur le fit mourir. 3 Il ne la connut pas[b], à cause du dessein perfide de sa mère, car il ne voulait pas avoir d’enfants d’elle. 4 Pendant la période nuptiale, je donnai Onan à Tamar pour qu’il remplisse envers elle le devoir du beau-frère[c]. Pourtant, lui aussi, dans sa méchanceté[d], ne la connut pas, après avoir vécu un an avec elle. 5 Lorsque je le menaçai, il s’unit certes à elle, mais gâcha sa semence sur le sol, conformément à l’ordre de sa mère. Lui aussi mourut dans sa méchanceté. 6 Je voulais aussi donner Shéla à Tamar, mais sa mère ne le permit pas. En effet, elle agit avec méchanceté, parce que Tamar n’était pas une fille de Canaan, comme elle-même l’était.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains témoins grecs présentent de petites différences dans l’ordre et la chronologie des événements, notamment quant au moment de la mort d’Er et à celui où Onan fut uni à Tamar.
    reason: textual_variant
  - marker: b
    text: Le grec emploie littéralement le verbe « connaître », euphémisme biblique désignant ici les relations sexuelles.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit du devoir traditionnel selon lequel le frère d’un homme mort devait susciter une descendance à celui-ci par sa veuve ; voir Genèse 38.
    reason: cultural_note
  - marker: d
    text: La répétition des mots liés à la « méchanceté » associe dans un même schéma moral Er, Onan et l’opposition de leur mère.
    reason: cross_reference
lexical_decisions:
- source_word: πονηρός / ἐν πονηρίᾳ / ἐπονηρεύσατο
  choice: mauvais / dans sa méchanceté / agit avec méchanceté
  rationale: Conserve la forte qualification morale et la répétition lexicale qui relie Er, Onan et la conduite de leur mère, tout en évitant une formulation française artificielle.
- source_word: ἄγγελος Κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article ne contraint pas à identifier cet ange à une figure unique et déterminée; l’indéfini préserve la prudence du témoin grec.
- source_word: οὐκ ἔγνω αὐτήν
  choice: il n’eut pas de relations avec elle
  rationale: Rend clairement l’euphémisme biblique dans un français actuel et digne, sans laisser entendre une simple absence de connaissance personnelle.
- source_word: πανουργία
  choice: dessein perfide
  rationale: Exprime la ruse délibérée et manipulatrice attribuée à la mère.
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: avoir des enfants d’elle
  rationale: Préserve la perspective de filiation du grec dans une tournure française concise.
- source_word: ἐπεγυμβρευσα αὐτῇ
  choice: je donnai Onan à Tamar pour qu’il remplisse envers elle le devoir du beau-frère
  rationale: Explicite le sens léviratique du verbe grec sans réduire l’acte à un mariage générique.
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: pendant la période nuptiale
  rationale: Restitue le cadre des jours de la chambre nuptiale dans une expression naturelle en français moderne.
- source_word: συνῆλθε μὲν αὐτῇ
  choice: il s’unit bien à elle
  rationale: La construction μὲν…δὲ oppose l’union sexuelle au geste qui suit; « bien… mais » conserve cette articulation.
- source_word: διέφθειρε τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: répandit sa semence à terre
  rationale: Conserve l’image concrète et l’écho au récit de la Genèse sans employer une formulation clinique.
- source_word: οὐκ ἀφῆκεν
  choice: ne le permit pas
  rationale: Exprime simplement et nettement l’opposition de la mère au projet de Juda.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: une fille de Canaan
  rationale: Préserve l’expression familiale et ethnique de tonalité biblique tout en l’accordant naturellement au singulier exigé par Tamar.
theological_decisions:
- issue: Agent de la mort d’Er
  choice: Un ange du Seigneur le fait mourir.
  alternative: Le Seigneur le fait mourir directement; ou l’ange du Seigneur défini le tue.
  rationale: Le texte grec primaire nomme ἄγγελος Κυρίου et ne justifie ni une harmonisation avec un autre récit ni l’identification forcée à « l’ange du Seigneur ».
- issue: Mort d’Onan dans le texte primaire
  choice: Dire seulement qu’il mourut dans sa méchanceté.
  alternative: Ajouter que le Seigneur le frappa.
  rationale: La proposition sur une intervention directe du Seigneur, présente dans la couche anglaise consultative, ne figure pas dans le texte grec primaire fourni; elle n’est donc pas introduite dans le corps de la traduction.
- issue: Terminologie du lévirat
  choice: Expliciter le devoir du beau-frère dans le texte et l’expliquer en note.
  alternative: Employer seulement « épouser » ou un terme technique non expliqué.
  rationale: Le verbe grec désigne une obligation familiale précise, essentielle au récit de Tamar; l’explicitation rend le sens accessible sans imposer une interprétation doctrinale.
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction privilégie une équivalence optimale: elle garde les répétitions morales et les tensions du grec, mais explicite les euphémismes sexuels et la coutume du lévirat lorsque leur littéralité serait obscure. Les ajouts narratifs présents dans la couche anglaise mais absents du texte grec primaire fourni n’ont pas été intégrés.'
