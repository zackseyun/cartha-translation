source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Τὸν λέοντα¹¹ ἀπέκτεινα¹² καὶ ἀφειλόμην¹³ ἔριφον ἐκ τοῦ στόματος αὐτοῦ¹⁴. *Τὴν¹⁵ ἄρκον λαβὼν ἀπὸ τοῦ ποδὸς ἀπέλυσα¹⁶ *τὸν κρημνόν¹⁷, *καὶ συνετρίβη¹⁸.'
