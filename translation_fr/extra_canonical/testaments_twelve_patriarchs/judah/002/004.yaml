base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/004.yaml
  text: I caught a wild mare and, after seizing it, I subdued it.
translation:
  language: fr
  text: J’ai tué le lion et arraché un chevreau à sa gueule. Puis j’ai saisi l’ours par la patte, je l’ai lâché dans le ravin[a], et il s’est fracassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La construction grecque est abrupte; littéralement, on peut comprendre : « je l’ai lâché [vers] l’escarpement » ou « je l’ai laissé tomber du haut de l’escarpement ».'
    reason: Signaler l’ellipse ou l’irrégularité de la construction ἀπέλυσα τὸν κρημνόν sans la masquer ni imposer une reconstruction unique.
lexical_decisions:
- source_word: ἀπέκτεινα
  choice: j’ai tué
  rationale: Rend directement l’aoriste actif à la première personne, sans atténuer la mise à mort.
- source_word: ἀφειλόμην
  choice: arraché
  rationale: Le moyen ἀφαιρέομαι exprime ici l’action de retirer ou d’enlever quelque chose à un détenteur; « arraché » convient naturellement au sauvetage d’un chevreau pris dans la gueule du lion.
- source_word: ἔριφον
  choice: un chevreau
  rationale: Désigne un jeune bouc ou une jeune chèvre; « chevreau » conserve le sens sans préciser inutilement le sexe.
- source_word: στόματος
  choice: gueule
  rationale: Pour un animal, « gueule » est l’équivalent français naturel de « bouche ».
- source_word: ἄρκον
  choice: l’ours
  rationale: Le nom grec peut désigner un ours sans imposer ici son sexe; le masculin générique français évite d’ajouter « ourse » sans preuve contextuelle.
- source_word: ἀπὸ τοῦ ποδός
  choice: par la patte
  rationale: Littéralement « par le pied »; pour un ours, « patte » est idiomatique en français.
- source_word: ἀπέλυσα
  choice: je l’ai lâché
  rationale: Conserve le sens fondamental de « relâcher, laisser aller » plutôt que de renforcer en « précipiter ».
- source_word: κρημνόν
  choice: ravin
  rationale: Le terme désigne un escarpement ou un précipice; dans cette construction directionnelle difficile, « dans le ravin » produit un français clair tout en gardant l’idée de chute.
- source_word: συνετρίβη
  choice: il s’est fracassé
  rationale: Rend le passif de συντρίβω, qui exprime le fait d’être brisé ou broyé par le choc.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et énergique. La traduction suit le texte grec fourni, qui évoque un lion, un chevreau et un ours; le texte anglais de consultation (« wild mare ») ne correspond manifestement pas à ce passage grec et n’a donc pas été suivi.
