  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/002.yaml
  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: fr
  text: Je sais que j’ai couru avec une biche, que je l’ai attrapée, que je l’ai préparée comme nourriture pour mon père, et qu’il en a mangé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Je sais
  rationale: Rend directement le parfait à valeur présente du verbe grec.
- source_word: συνέδραμον ἐλάφῳ
  choice: j’ai couru aux côtés d’une biche
  rationale: Le verbe composé exprime le fait de courir avec ou aux côtés de l’animal; «biche» convient au datif féminin et reste naturel en français.
- source_word: ἐπίασα αὐτήν
  choice: je l’ai attrapée
  rationale: Traduction courante et concrète de l’acte de saisir ou capturer l’animal.
- source_word: ἐποίησα αὐτὴν βρῶμα
  choice: j’en ai fait un repas
  rationale: Exprime naturellement en français le sens littéral «je l’ai faite nourriture», sans suggérer que l’animal entier aurait été servi tel quel.
- source_word: ἔφαγεν
  choice: il en a mangé
  rationale: Le pronom «en» reprend la nourriture préparée et rend l’expression idiomatique en français.
