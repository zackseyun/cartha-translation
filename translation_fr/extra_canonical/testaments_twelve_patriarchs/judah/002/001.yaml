  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/001.yaml
  text: And the Lord gave me favor in all my works, in the field and in the house.
translation:
  language: fr
  text: Et le Seigneur m’accorda sa faveur dans toutes mes activités, aux champs et à la maison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν
  choice: sa faveur
  rationale: Dans la construction « donner faveur à quelqu’un », le terme désigne ici la bienveillance accordée par le Seigneur; « sa faveur » est naturel en français et garde clairement Dieu comme source.
- source_word: ἐν πᾶσι τοῖς ἔργοις μου
  choice: dans toutes mes activités
  rationale: ἔργα couvre ici l’ensemble de ce que Juda accomplit, ensuite précisé par les sphères des champs et de la maison. « Activités » restitue cette portée sans suggérer uniquement des œuvres morales.
- source_word: ἐν τε ἀγρῷ καὶ ἐν τῷ οἴκῳ
  choice: aux champs comme à la maison
  rationale: Cette formulation française naturelle conserve les deux domaines parallèles, rural et domestique, exprimés par τε…καί.
theological_decisions:
- issue: Nature de la faveur divine
  choice: Le Seigneur accorde sa faveur à Juda dans toutes ses activités.
  alternative: Le Seigneur fait réussir toutes les œuvres de Juda.
  rationale: Le grec affirme explicitement le don de χάρις, mais ne définit pas cette faveur comme une réussite matérielle absolue; la traduction évite donc de résoudre cette nuance.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au récit testamentaire. « Aux champs » est plus idiomatique que « dans le champ » tout en conservant le cadre agricole du grec.
