source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔδωκέ μοι Κύριος¹ χάριν *ἐν πᾶσι τοῖς ἔργοις μου, ἐν τε² ἀγρῷ καὶ ἐν τῷ οἴκῳ.'
  language: Greek
base_translation:
