  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/003.yaml
  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: fr
  text: Je saisissais la gazelle⁷ en pleine course⁸, et je rattrapais tout ce qui se trouvait dans les plaines⁹.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάδα
  choice: gazelle
  rationale: Équivalent français courant de δορκάς dans ce contexte animalier.
- source_word: διὰ τοῦ δρόμου
  choice: à la course
  rationale: La locution exprime ici le moyen ou la poursuite en courant; «à la course» est naturel en français et évite de réduire δρόμος au seul sens de «route».
- source_word: ἐκράτουν
  choice: je saisissais
  rationale: L’imparfait restitue l’aspect imperfectif du grec, tandis que «saisir» rend l’idée de prendre ou maîtriser.
- source_word: κατελάμβανον
  choice: je rattrapais
  rationale: Dans ce récit de prouesses physiques, καταλαμβάνω désigne le fait de rejoindre et d’atteindre ce que l’on poursuit.
- source_word: ἐν τοῖς πεδίοις
  choice: dans les plaines
  rationale: Rend directement le pluriel de πεδίον, qui désigne des étendues de terrain plat.
