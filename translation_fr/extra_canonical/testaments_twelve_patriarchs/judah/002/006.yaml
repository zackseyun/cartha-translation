  text: A leopard in Hebron sprang upon the dog, and I caught it by the tail and hurled it against the rock, and it was split in two.
translation:
  language: fr
  text: À Hébron, un léopard bondit sur le chien. Je l’attrapai par la queue et le projetai contre le rocher, et il se fendit en deux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάρδαλις
  choice: un léopard
  rationale: Équivalent français naturel et précis du nom de l’animal.
- source_word: προσεπήδησεν ἐπὶ τὸν κύνα
  choice: bondit sur le chien
  rationale: Rend directement le mouvement d’attaque exprimé par le verbe et la préposition.
- source_word: πιάσας αὐτὴν ἀπὸ τῆς κέρκου
  choice: Je l’attrapai par la queue
  rationale: Formulation française idiomatique qui conserve le participe grec dans la suite narrative.
- source_word: ἀπηκόντισα αὐτὴν ἐπὶ τὴν πέτραν
  choice: le projetai contre le rocher
  rationale: « Projeter » exprime un lancer violent, tandis que « contre » convient naturellement à l’impact sur la pierre.
- source_word: ἐρράγη εἰς δύο
  choice: il se fendit en deux
  rationale: Reproduit l’idée d’une rupture en deux parties sans ajouter de détail.
