  text: I ran down the wild boar, and I overtook it while I was running and tore it apart.
translation:
  language: fr
  text: J’ai pris le sanglier en chasse, je l’ai rattrapé tandis que je courais et je l’ai mis en pièces.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ ἀγρίῳ χοίρῳ
  choice: le sanglier
  rationale: L’expression désigne littéralement un porc sauvage; « sanglier » est le terme français naturel et précis.
- source_word: κατέδραμον
  choice: j’ai poursuivi
  rationale: Le verbe exprime ici l’action de courir après l’animal pour le rejoindre; « poursuivre » restitue naturellement ce mouvement sans anticiper le verbe suivant.
- source_word: προέλαβον
  choice: je l’ai rattrapé
  rationale: Dans ce contexte de poursuite, le verbe indique que Juda rejoint l’animal; cette traduction évite le peu naturel « devancer ».
- source_word: ἐν τῷ τρέχειν με
  choice: dans ma course
  rationale: Cette formulation rend la construction temporelle grecque, littéralement « pendant que je courais », de façon concise et naturelle.
- source_word: κατεσπάραξα αὐτόν
  choice: je l’ai mis en pièces
  rationale: Le verbe évoque une mise en pièces violente; cette expression française en conserve la force sans préciser un moyen absent du grec.
