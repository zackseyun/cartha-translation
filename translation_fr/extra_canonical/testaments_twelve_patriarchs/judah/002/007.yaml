    rationale: Le verbe grec relève de l’obscurcissement et, dans ce contexte, exprime l’aveuglement. « Étourdi » est une explicitation physiologique non indiquée et moins fidèle.
  - severity: low
    issue: « taureau sauvage » précise le sexe davantage que nécessaire
    rationale: Βοῦς peut désigner un bovin/ bœuf; « bœuf sauvage » est plus proche du terme-source et évite une précision supplémentaire.
