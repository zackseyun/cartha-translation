- from: J’ai trouvé un taureau sauvage qui paissait dans la contrée. Je l’ai saisi par les cornes, l’ai secoué en tous sens et étourdi, puis je l’ai jeté à terre et tué.
  to: J’ai trouvé un bœuf sauvage qui paissait dans la contrée ; l’ayant saisi par les cornes, je l’ai secoué en tous sens, aveuglé, jeté à terre et tué.
