  text: I found a wild ox grazing in the land, and, taking hold of its horns, I shook it all around and blinded it.
translation:
  language: fr
  text: J’ai trouvé un bœuf sauvage qui paissait dans la contrée ; l’ayant saisi par les cornes, je l’ai secoué en tous sens, aveuglé, jeté à terre et tué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοῦν ἄγριον
  choice: un taureau sauvage
  rationale: Dans ce récit de prouesse physique, « taureau sauvage » rend naturellement l’animal mâle puissant désigné par βοῦς avec l’adjectif ἄγριος.
- source_word: τὴν χώραν νεμόμενον
  choice: qui paissait dans la contrée
  rationale: Νέμομαι signifie ici « paître »; « la contrée » conserve la portée territoriale de χώρα sans suggérer nécessairement un champ cultivé.
- source_word: κρατήσας τῶν κεράτων
  choice: saisi par les cornes
  rationale: Tour français idiomatique qui exprime la prise ferme indiquée par κρατέω et le génitif τῶν κεράτων.
- source_word: κύκλῳ συσσείσας
  choice: secoué en tous sens
  rationale: Cette formulation restitue l’idée de secousses violentes et répétées tout autour, sans la lourdeur de « secoué circulairement ».
- source_word: σκοτίσας
  choice: étourdi
  rationale: Littéralement lié à l’obscurcissement, le verbe décrit vraisemblablement ici l’effet incapacitant des secousses; « étourdi » convient mieux au contexte que l’affirmation précise d’une cécité permanente.
- source_word: ῥίψας
  choice: jeté à terre
  rationale: Le complément « à terre », implicite dans la scène, rend clairement le mouvement de projection exprimé par ῥίπτω.
- source_word: ἀνεῖλον αὐτόν
  choice: tué
  rationale: Αναιρέω signifie ici mettre à mort; ce dernier acte, présent dans le grec fourni, doit être conservé malgré son omission dans la couche anglaise.
