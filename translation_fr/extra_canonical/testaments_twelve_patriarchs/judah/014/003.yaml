  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/003.yaml
  text: Such is the wine-drinker, my children, because the drunkard respects no one.
translation:
  language: fr
  text: Tel est celui qui s’adonne au vin, mes enfants, car l’homme ivre ne respecte personne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάροινος
  choice: celui qui s’adonne au vin
  rationale: Le terme désigne une personne portée sur le vin ou adonnée à la boisson; cette formulation naturelle conserve l’idée d’une conduite habituelle.
- source_word: ὁ μεθύων
  choice: l’homme ivre
  rationale: Le participe substantivé désigne celui qui est en état d’ivresse; «l’homme ivre» rend directement le sens sans ajouter l’idée explicite d’une habitude.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: ne respecte personne
  rationale: αἰδέομαι peut exprimer la retenue, les égards ou le respect envers autrui; ici, «ne respecte personne» est clair et idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. L’adresse «mes enfants» est conservée. La distinction entre πάροινος, qui évoque une disposition habituelle envers le vin, et μεθύων, qui décrit l’homme ivre, demeure perceptible.
