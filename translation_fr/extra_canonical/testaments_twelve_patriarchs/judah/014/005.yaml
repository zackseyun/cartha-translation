  text: After drinking the wine, I was not ashamed of the command of God, and I took a Canaanite woman.
translation:
  language: fr
  text: Après avoir bu le vin, je n’ai pas eu honte du commandement de Dieu, et j’ai pris pour femme une Cananéenne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: Après avoir bu le vin
  rationale: Le participe aoriste exprime ici une action antérieure; l’article défini grec est conservé naturellement en français.
- source_word: οὐκ ᾐσχύνθην
  choice: je n’ai pas eu honte
  rationale: Rend directement la négation et le sens de honte exprimé par le verbe, sans corriger l’énoncé difficile.
- source_word: τὴν ἐντολὴν τοῦ Θεοῦ
  choice: du commandement de Dieu
  rationale: « Commandement » est l’équivalent français courant et digne de ἐντολή dans un contexte religieux.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: j’ai pris pour femme une Cananéenne
  rationale: Cette tournure naturelle conserve l’idée matrimoniale de λαμβάνω avec γυνή et l’identité cananéenne de la femme.
theological_decisions:
- issue: Rapport énigmatique entre la honte et le commandement de Dieu
  choice: Conserver littéralement « je n’ai pas eu honte du commandement de Dieu »
  alternative: Expliciter une transgression, par exemple « je n’ai pas craint de désobéir au commandement de Dieu »
  rationale: Le grec transmis formule explicitement l’absence de honte à l’égard du commandement; expliciter une désobéissance résoudrait une difficulté que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation inhabituelle concernant le commandement est volontairement préservée afin de respecter l’ambiguïté du grec.
