- from: 'Car celui qui boit du vin, mes enfants, a besoin de beaucoup de discernement. Voici en quoi consiste le discernement dans la consommation du vin : tant qu’il garde sa retenue[a], il boit.'
  to: 'Car celui qui boit du vin, mes enfants, a besoin de beaucoup de discernement. Et voici le discernement pour boire du vin : tant qu’il a encore le sens de la honte[a], il boit.'
  rationale: La révision remplace une interprétation relativement étroite de αἰδώς par « sens de la honte », plus proche de sa valeur première dans ce contexte, et rend ἔχει par « a ». Elle maintient volontairement l’indicatif final « il boit », conformément au texte grec transmis, plutôt que de le transformer en impératif normatif. La note signale les nuances que le français ne peut condenser dans un seul mot.
