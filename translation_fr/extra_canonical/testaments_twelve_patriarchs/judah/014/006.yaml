base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: fr
  text: 'Car celui qui boit du vin, mes enfants, a besoin de beaucoup de discernement. Et voici le discernement pour boire du vin : tant qu’il a encore le sens de la honte[a], il boit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa pudeur », « son respect de lui-même » ou « son sentiment de honte ».'
    reason: Le grec αἰδώς couvre plusieurs nuances morales proches qu’un seul terme français ne restitue pas entièrement.
lexical_decisions:
- source_word: σύνεσις
  choice: discernement
  rationale: Le terme désigne ici l’intelligence pratique ou le bon jugement nécessaire pour régler sa consommation de vin ; « discernement » est naturel et conserve cette portée morale.
- source_word: οἰνοποσία
  choice: consommation du vin
  rationale: Cette expression rend clairement le fait de boire du vin, sans suggérer nécessairement l’ivresse.
- source_word: αἰδώς
  choice: retenue
  rationale: Dans ce contexte, le mot évoque la pudeur, le respect de soi ou le sentiment de honte qui freine un comportement inconvenant. « Retenue » exprime naturellement la fonction morale du terme sans en réduire la polysémie.
- source_word: πίνει
  choice: il boit
  rationale: Le texte grec transmis porte une forme indicative, « il boit », plutôt que l’impératif attendu « qu’il boive ». La traduction suit cette forme tout en laissant subsister la formulation sentencieuse et quelque peu abrupte de l’original.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La première proposition grecque est elliptique ; « a besoin de » explicite le rapport syntaxique sans modifier le sens. La dernière proposition conserve l’indicatif du texte grec, malgré la possibilité contextuelle d’une maxime normative.
