  text: '*Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν²⁹ μὴ αἰσχυνθῆναι τὸ πλῆθος³⁰ πόλεως⁴⁹ ὅτι ἐν⁵¹ ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν³² μεγάλην³³, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: fr
  text: 'Car voici : cela m’a égaré, moi aussi, au point que je n’ai pas éprouvé de honte de la foule de la ville. Sous les yeux de tous, je me suis détourné vers Tamar, j’ai commis un grand péché et j’ai dévoilé le voile d’impureté de mes fils.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai découvert le voile de l’impureté de mes fils » ; le sens précis de cette expression est incertain.'
    reason: Signale la formulation inhabituelle et maintient l'ambiguïté de l'image grecque sans en imposer une interprétation.
lexical_decisions:
- source_word: Ἰδοὺ γὰρ
  choice: Car voici
  rationale: Conserve à la fois la liaison explicative de γάρ et l’appel solennel à l’attention porté par ἰδού.
- source_word: κἀμὲ ἐπλάνησεν
  choice: cela aussi m’a égaré
  rationale: Le sujet n’est pas exprimé dans ce verset et dépend du contexte précédent; « cela » évite de l’identifier arbitrairement. « Aussi » rend καί dans κἀμέ.
- source_word: μὴ αἰσχυνθῆναι
  choice: au point que je n’ai pas éprouvé de honte
  rationale: Exprime naturellement en français le résultat de l’égarement sans ajouter une idée étrangère au grec.
- source_word: ἐν ὀφθαλμῶν πάντων
  choice: sous les yeux de tous
  rationale: Équivalent français idiomatique de l’expression signifiant que l’acte s’est produit au vu de tous.
- source_word: ἐξέκλινα πρὸς τὴν Θαμὰρ
  choice: je me suis détourné vers Tamar
  rationale: Préserve le mouvement moral et concret d’ἐκκλίνω ainsi que l’orientation exprimée par πρός.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: j’ai dévoilé le voile d’impureté de mes fils
  rationale: Maintient l’image volontairement difficile de l’action d’ôter ou de révéler un voile, au lieu de résoudre silencieusement la formule en « honte » ou « nudité ».
theological_decisions:
- issue: Référent du sujet implicite de ἐπλάνησεν
  choice: « cela »
  alternative: Nommer le vin, le désir ou une autre puissance évoquée par le contexte
  rationale: Le verset grec ne répète pas le sujet; le pronom neutre préserve cette dépendance contextuelle et évite une précision interprétative.
- issue: Sens de l’image finale liée à l’impureté des fils
  choice: Conserver l’expression métaphorique « voile d’impureté »
  alternative: Paraphraser par « j’ai exposé la honte de mes fils »
  rationale: La paraphrase serait plus fluide, mais elle supprimerait l’ambiguïté et la tension de la formulation grecque.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe suit la progression argumentative du grec, tandis que les expressions idiomatiques françaises (« sous les yeux de tous », « éprouver de la honte ») évitent une littéralité maladroite. L’étrangeté de la dernière image est néanmoins conservée et explicitée en note.
