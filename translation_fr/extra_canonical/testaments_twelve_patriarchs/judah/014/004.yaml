revisions:
- from: 'Car voici : cela aussi m’a égaré, au point que je n’ai pas éprouvé de honte devant la foule de la ville. En effet, sous les yeux de tous, je me suis détourné vers Tamar, j’ai commis un grand péché et j’ai dévoilé le voile d’impureté de mes fils.[a]'
  to: 'Car voici : cela m’a égaré, moi aussi, au point que je n’ai pas éprouvé de honte de la foule de la ville. Sous les yeux de tous, je me suis détourné vers Tamar, j’ai commis un grand péché et j’ai dévoilé le voile d’impureté de mes fils.[a]'
  rationale: La révision corrige la portée de κἀμέ en rendant « moi aussi » et supprime la liaison « En effet », qui n'est pas exprimée à cet endroit dans le grec fourni. Elle maintient le sujet implicite sous la forme neutre « cela », l'orientation de « se détourner vers Tamar », et l'image finale non résolue, avec son ancre de note correctement conservée.
