source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: fr
  text: Mais s’il franchit la limite, l’esprit de l’égarement pénètre dans sa pensée et pousse l’ivrogne à tenir des propos honteux, à agir au mépris de la loi et à ne pas en avoir honte, mais plutôt à se vanter de son déshonneur et à penser que c’est bien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: franchit la limite
  rationale: Rend directement l’idée de dépasser une frontière ou une borne, sans reprendre l’ajout explicatif anglais « goes on until » absent du grec.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: l’esprit de l’égarement
  rationale: « Égarement » conserve la portée de πλάνη, qui peut désigner l’erreur, la tromperie ou le fait d’être détourné du bon chemin.
- source_word: εἰς τὸν νοῦν αὐτοῦ
  choice: dans sa pensée
  rationale: Évite la répétition française ambiguë « l’esprit… dans son esprit » et traduit νοῦς comme la faculté de penser.
- source_word: αἰσχρορρημονεῖν
  choice: tenir des propos honteux
  rationale: Exprime le fait de parler d’une manière honteuse ou indécente sans limiter le terme aux seules obscénités.
- source_word: παρανομεῖν
  choice: agir au mépris de la loi
  rationale: Conserve la référence constitutive de παρανομεῖν à une conduite contraire à la loi.
- source_word: νομίζειν εἶναι καλόν
  choice: penser que c’est bien
  rationale: Formulation naturelle qui maintient l’implicite du grec quant à ce qui est jugé bon.
theological_decisions:
- issue: Agent et mode d’action de « l’esprit de l’égarement »
  choice: l’esprit de l’égarement pénètre dans sa pensée et pousse l’ivrogne
  alternative: un esprit de tromperie entre dans son esprit et fait agir l’ivrogne
  rationale: L’article grec favorise « l’esprit » plutôt que « un esprit ». La traduction conserve l’action personnelle attribuée à cet esprit sans préciser davantage sa nature ni importer une doctrine démonologique.
- issue: Référent de ce qui est tenu pour bon
  choice: penser que c’est bien
  alternative: considérer son déshonneur comme une bonne chose
  rationale: Le grec laisse le sujet logique de εἶναι καλόν implicite; la formulation retenue préserve cette légère ambiguïté entre le déshonneur et l’ensemble de la conduite décrite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la progression rhétorique du grec et son contraste entre honte et vantardise, tout en évitant une lourde répétition de « esprit ».
