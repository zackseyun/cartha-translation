  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: fr
  text: Car si quelqu’un boit du vin jusqu’à l’ivresse, il trouble ton esprit par des pensées impures, échauffe ton corps pour le plaisir et pour l’immoralité sexuelle, et commet le péché sans honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: jusqu’à l’ivresse
  rationale: Exprime naturellement en français le fait de boire au point de s’enivrer.
- source_word: διαλογισμοῖς ῥυπαροῖς
  choice: par des pensées impures
  rationale: « Pensées » convient ici aux raisonnements ou mouvements intérieurs, tandis qu’« impures » garde la force morale de ῥυπαροῖς sans recourir au peu naturel « sales ».
- source_word: συνταράσσει
  choice: bouleverse
  rationale: Rend l’idée d’une agitation profonde ou d’un trouble intérieur.
- source_word: πορνείαν
  choice: immoralité sexuelle
  rationale: Terme moderne et largement compréhensible couvrant le champ général de πορνεία sans le limiter à la prostitution.
- source_word: ἐκθερμαίνει
  choice: échauffe
  rationale: Conserve l’image physique et passionnelle du verbe grec.
- source_word: ἡδονήν
  choice: plaisir
  rationale: Équivalent direct qui préserve ici la connotation de jouissance corporelle donnée par le contexte.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: commet le péché
  rationale: Reproduit l’expression grecque au singulier et sa progression vers l’acte.
theological_decisions:
- issue: Référent des verbes au singulier après « le vin » et « le corps »
  choice: « celui-ci » renvoie au vin pour « bouleverse » et « échauffe », puis « il » renvoie à la personne qui commet le péché
  alternative: Faire du vin, de l’esprit ou du corps le sujet grammatical de toute la série
  rationale: 'Le grec présente un glissement ou une ambiguïté de sujet. La traduction française clarifie au minimum nécessaire : le vin provoque le trouble et l’échauffement, tandis que la responsabilité de commettre le péché appartient naturellement à la personne, sans attribuer artificiellement une action morale au corps.'
- issue: Portée morale de πορνεία
  choice: immoralité sexuelle
  alternative: débauche, fornication ou prostitution
  rationale: Le choix conserve la portée générale du terme sans imposer une catégorie confessionnelle ou juridique plus étroite.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase conserve la progression du texte grec : ivresse, pensées impures, excitation corporelle, acte pécheur et absence de honte.'
