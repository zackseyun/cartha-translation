revisions:
- from: Car si quelqu’un boit du vin jusqu’à l’ivresse, celui-ci bouleverse son esprit par des pensées impures, échauffe son corps pour qu’il recherche le plaisir dans l’immoralité sexuelle, et il commet le péché sans en avoir honte.
  to: Car si quelqu’un boit du vin jusqu’à l’ivresse, il trouble ton esprit par des pensées impures, échauffe ton corps pour le plaisir et pour l’immoralité sexuelle, et commet le péché sans honte.
  rationale: La révision rétablit les possessifs de deuxième personne attestés et retire l'ajout interprétatif « pour qu'il recherche ». Elle maintient le mouvement du grec et son ambiguïté de sujet, laquelle est expliquée par une note plutôt que normalisée dans le corps du texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend bien l''ivresse, les pensées impures, l''échauffement du corps et le péché. Il modifie toutefois la chaîne syntaxique difficile du grec : le texte porte « ton esprit » et « ton corps » (σου), tandis que le projet substitue « son esprit » et « son corps »; il introduit aussi « pour qu''il recherche », absent du texte. La référence exacte des verbes au singulier est syntaxiquement instable dans la tradition grecque et ne doit pas être résolue de façon interprétative.'
  naturalness: La formulation proposée est naturelle, mais sa clarification du sujet (« celui-ci », puis « il ») crée une lecture explicative qui dépasse le grec. La révision conserve une phrase française lisible tout en signalant l'anomalie pronominale par une note.
  terminology: « Immoralité sexuelle » est un rendu moderne recevable de πορνεία et ne restreint pas indûment le terme. « Pensées impures », « échauffe » et « commet le péché » conviennent. « Sans honte » reproduit plus directement οὐκ αἰσχύνεται que « sans en avoir honte ».
  issues:
  - severity: high
    issue: Les possessifs de deuxième personne sont remplacés par des possessifs de troisième personne.
    rationale: 'Le texte grec donné lit τὸν νοῦν σου et τὸ σῶμα, compris avec σου : « ton esprit » et « ton corps ». Le passage à « son » harmonise et interprète le texte au lieu d''en préserver la forme attestée.'
  - severity: medium
    issue: La traduction résout sans signalement la référence incertaine des verbes singuliers.
    rationale: Après « si quelqu'un boit », le grec enchaîne des verbes au singulier avec des pronoms de deuxième personne; attribuer les deux premiers au vin et le dernier au buveur est une explication plausible, mais non explicitée par la syntaxe source.
  - severity: medium
    issue: « Pour qu'il recherche le plaisir dans l'immoralité sexuelle » ajoute une relation de recherche et modifie la construction.
    rationale: ἐκθερμαίνει ... πρὸς ἡδονήν, καὶ εἰς πορνείαν exprime l'échauffement orienté vers le plaisir et vers la πορνεία; le grec ne dit pas explicitement « recherche » ni « dans ».
  revised_text: Car si quelqu’un boit du vin jusqu’à l’ivresse, il trouble ton esprit par des pensées impures, échauffe ton corps pour le plaisir et pour l’immoralité sexuelle, et commet le péché sans honte.
  revised_footnotes:
  - marker: a
    text: Le grec porte littéralement « ton esprit » et « ton corps », bien que la phrase commence par « si quelqu’un boit ». La référence des verbes au singulier est syntaxiquement difficile; elle peut viser l'effet du vin ou, dans la suite de la phrase, la personne qui boit.
    reason: Préserve et documente l'ambiguïté syntaxique du texte source sans imposer une résolution doctrinale ou éditoriale.
  revision_rationale: La révision rétablit les possessifs de deuxième personne attestés et retire l'ajout interprétatif « pour qu'il recherche ». Elle maintient le mouvement du grec et son ambiguïté de sujet, laquelle est expliquée par une note plutôt que normalisée dans le corps du texte.
