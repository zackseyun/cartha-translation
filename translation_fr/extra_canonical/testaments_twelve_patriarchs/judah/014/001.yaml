- source_word: τὰ δύο ταῦτα
  choice: ces deux choses
  rationale: Traduction directe qui conserve la référence contextuelle sans préciser arbitrairement la nature des deux éléments.
- source_word: ἀφιστῶσι
  choice: détournent
  rationale: Le verbe exprime l’action d’éloigner ou de faire dévier; « détournent » convient à son emploi avec l’esprit comme complément.
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: l’esprit humain
  rationale: Formulation française naturelle pour la faculté de pensée de l’être humain; elle garde la portée générique de ἄνθρωπος sans marquage masculin inutile.
