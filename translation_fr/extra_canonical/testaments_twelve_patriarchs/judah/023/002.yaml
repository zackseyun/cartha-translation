source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὰς θυγατέρας ὑμῶν μουσικὰς καὶ δημοσίας¹² ποιήσετε¹³, *καὶ ἐπιμιγήσεσθε¹⁴ ἐν βδελύγμασι ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: fr
  text: Vous ferez de vos filles des musiciennes et des prostituées[a], et vous vous mêlerez aux abominations des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des femmes publiques »; expression désignant ici des prostituées.'
    reason: Signale le sens littéral de δημοσίας tout en employant dans le texte une formulation française moderne et claire.
lexical_decisions:
- source_word: μουσικὰς
  choice: musiciennes
  rationale: Rend directement le terme grec désignant des femmes adonnées à la musique, sans préciser indûment si elles chantent ou jouent d’un instrument.
- source_word: δημοσίας
  choice: prostituées
  rationale: Dans ce contexte appliqué à des femmes, le grec « publiques » est un euphémisme pour des prostituées; « femmes publiques » serait aujourd’hui vieilli et moins immédiatement compréhensible.
- source_word: ἐπιμιγήσεσθε
  choice: vous vous mêlerez
  rationale: Conserve l’idée de se mêler ou de s’associer étroitement, sans transformer explicitement le verbe en « pratiquer » ou « participer ».
- source_word: βδελύγμασι ἐθνῶν
  choice: aux abominations des nations
  rationale: Préserve le substantif fortement chargé « abominations » et le terme traditionnel mais encore intelligible « nations ».
theological_decisions:
- issue: Nature de l’association avec les abominations
  choice: vous vous mêlerez aux abominations
  alternative: vous participerez aux pratiques abominables
  rationale: Le choix retenu maintient l’image et l’ambiguïté du verbe grec plutôt que d’expliciter l’association comme une participation active à des pratiques.
translation_notes:
  register: Français moderne, direct et solennel. Le parallélisme de la phrase grecque est conservé, ainsi que son vocabulaire moral fortement marqué.
