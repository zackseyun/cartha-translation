source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἀνθ᾽ ὧν ἐπάξει²⁵ Κύριος ἐφ᾽ ὑμᾶς²⁶ λιμὸν καὶ λοιμόν¹⁹, θάνατον καὶ ῥομφαίαν, ἐκδικοῦσαν²⁰, πολιορκίαν, καὶ κύνας εἰς διασπασμόν²⁰, καὶ ἐχθρῶν ὀνειδισμοὺς²², καὶ ἀπώλειαν²² ἐχθρῶν, καὶ²⁴ σφακελισμὸν *ὀφθαλμῶν²⁴, καὶ νηπίων ἀναιρέσεις²⁵, *ὑπαρχόντων ἁρπαγὴν²⁶, ναῶν θεοῦ ἐμπρησμόν²⁹, γῆς ἐρήμωσιν²⁹, ὑμῶν δὲ αὐτῶν³⁰ δουλείαν ἐν ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: fr
  text: À cause de ces choses, le Seigneur fera venir sur vous la famine et l’épidémie, la mort et l’épée vengeresse, le siège, des chiens qui vous déchireront, les insultes des ennemis, la destruction des ennemis[a], la gangrène des yeux, le massacre des nourrissons, le pillage des biens, l’incendie des temples de Dieu, la dévastation du pays et, pour vous-mêmes, l’esclavage parmi les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut signifier «la destruction des ennemis» ou «la destruction causée par des ennemis».
    reason: Le génitif ἐχθρῶν est formellement ambigu; la note préserve les deux lectures possibles sans résoudre silencieusement la tension.
lexical_decisions:
- source_word: Ἀνθ᾽ ὧν
  choice: À cause de ces choses
  rationale: Exprime naturellement le rapport causal du grec tout en conservant le renvoi au contexte antérieur.
- source_word: λοιμόν
  choice: épidémie
  rationale: Terme moderne et intelligible pour une maladie contagieuse frappant collectivement; «peste» serait possible mais plus spécifique en français actuel.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: l’épée vengeresse
  rationale: Conserve l’image de l’arme et la fonction punitive exprimée par le participe grec.
- source_word: κύνας εἰς διασπασμόν
  choice: des chiens qui vous déchireront
  rationale: Rend explicitement et naturellement en français la destination ou le résultat exprimé par εἰς avec le nom d’action.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: la gangrène des yeux
  rationale: σφακελισμός désigne la mortification ou gangrène des tissus; la formulation garde la violence concrète du texte.
- source_word: νηπίων ἀναιρέσεις
  choice: le massacre des nourrissons
  rationale: ἀναίρεσις signifie ici mise à mort; «massacre» convient à la série de calamités, et «nourrissons» rend νήπια sans l’élargir à tous les enfants.
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: le pillage des biens
  rationale: ὑπάρχοντα désigne les possessions et ἁρπαγή leur enlèvement violent.
- source_word: ὑμῶν δὲ αὐτῶν δουλείαν ἐν ἔθνεσι
  choice: et, pour vous-mêmes, l’esclavage parmi les nations
  rationale: Préserve l’insistance de αὐτῶν et la portée collective de ἔθνεσι sans ajouter une idée absente du grec.
theological_decisions:
- issue: Le Seigneur comme auteur des jugements annoncés
  choice: «le Seigneur fera venir sur vous»
  alternative: «le Seigneur permettra que viennent sur vous»
  rationale: Le verbe ἐπάξει présente directement le Seigneur comme celui qui fait venir ces fléaux; introduire la simple permission atténuerait le texte.
- issue: ναῶν θεοῦ au pluriel
  choice: «des temples de Dieu»
  alternative: «du temple de Dieu»
  rationale: Le grec transmis porte le pluriel ναῶν; la traduction le conserve malgré l’expression théologiquement inhabituelle, sans harmonisation implicite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue accumulation du grec est maintenue afin de préserver l’effet solennel et accablant de l’oracle. Le texte grec fourni est traduit dans son intégralité plutôt que de suivre la couche anglaise, qui abrège fortement et introduit des éléments absents de cette source grecque.
