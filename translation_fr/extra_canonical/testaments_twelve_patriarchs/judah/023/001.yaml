source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: fr
  text: Jusqu’à la venue du Dieu de justice[a], pour donner à Jacob et à toutes les nations le repos dans la paix. Et lui-même préservera pour toujours la puissance de ma royauté ; car le Seigneur m’a juré par serment de ne pas effacer pour toujours la royauté de ma descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Dieu de la justice » ; l’expression grecque peut désigner le Dieu caractérisé par la justice ou celui qui l’exerce.'
    reason: Préserver la nuance du génitif τῆς δικαιοσύνης sans réduire son sens à une seule analyse.
lexical_decisions:
- source_word: παρουσίας
  choice: venue
  rationale: Rend le sens courant de présence ou arrivée attendue dans ce contexte eschatologique, sans imposer un terme technique.
- source_word: Θεοῦ τῆς δικαιοσύνης
  choice: Dieu de justice
  rationale: Conserve directement la construction génitive grecque ; « justice » exprime ici la rectitude et le juste jugement.
- source_word: τοῦ ἡσυχάσαι
  choice: qui donnera le repos
  rationale: Exprime naturellement en français la valeur finale ou résultative de l’infinitif aoriste, littéralement « faire reposer ».
- source_word: φυλάξει κράτος
  choice: préservera … la puissance
  rationale: φυλάσσω signifie garder ou préserver, et κράτος désigne la force, la puissance ou la souveraineté.
- source_word: τῆς βασιλείας μου / τὸ βασίλειον
  choice: de ma royauté / la royauté
  rationale: Le contexte dynastique et la mention de la descendance favorisent « royauté », tout en gardant le lien avec l’idée de royaume.
- source_word: ἐκ τοῦ σπέρματός μου
  choice: de ma descendance
  rationale: Rend idiomatiquement le grec « hors de ma semence », c’est-à-dire parmi ou depuis les descendants de Juda.
theological_decisions:
- issue: Référent de αὐτός dans « καὶ αὐτὸς φυλάξει »
  choice: « lui-même », sans nommer explicitement le référent
  alternative: « Dieu préservera »
  rationale: Le pronom renvoie probablement au Dieu qui vient, mais le grec ne répète pas son nom ; la traduction conserve cette légère ambiguïté.
- issue: Portée de la promesse dynastique
  choice: « ne jamais faire disparaître la royauté de ma descendance »
  alternative: « ne pas effacer le royaume de ma descendance »
  rationale: Cette formulation respecte la promesse perpétuelle sans préciser de quelle manière théologique elle s’accomplit.
translation_notes:
  register: Français international moderne, digne et lisible. Le projet suit strictement l’extrait grec fourni. Les phrases supplémentaires de la couche anglaise concernant la douleur, l’immoralité sexuelle, les sorcelleries et les démons n’ont pas été reprises, car elles ne figurent pas dans le texte grec transmis ici.
