  text: '1. And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.


    2. So Dan and I, pretending to be Amorites as though allies, entered their city.


    3. And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering everything that belonged to them, we tore down their three walls.


    4. And we drew near to Thamna, where all their baggage was.


    5. Then, being insulted by them, I became angry, and I rushed up against them to the summit. And they kept hurling stones and shooting arrows at me.


    6. And if Dan my brother had not fought alongside me,'
translation:
  language: fr
  text: '**Testament de Juda 7**


    1 Le lendemain, on nous annonça que le roi de la ville de Gaas venait contre nous à la tête d’une foule nombreuse.


    2 Dan et moi, nous nous rendîmes donc chez les Amorites et, nous faisant passer auprès d’eux pour des alliés, nous entrâmes dans leur ville.


    3 Au cœur de la nuit, mes frères vinrent nous rejoindre. Nous leur ouvrîmes les portes, puis nous exterminâmes tous les habitants et pillâmes la ville.


    4 Nous nous approchâmes ensuite de Thamna, où se trouvaient tous les bagages des rois ennemis.


    5 Alors, comme ils m’insultaient, je me mis en colère et m’élançai contre eux jusqu’au sommet. Ils me lançaient des pierres avec leurs frondes et tiraient des flèches sur moi.


    6 Et si Dan, mon frère, n’avait pas combattu à mes côtés…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec fourni s’interrompt ici, au milieu de la phrase.
    reason: Signaler loyalement que le verset 6 est incomplet dans l’extrait source transmis.
lexical_decisions:
- source_word: ἐν λαῷ πολλῷ
  choice: à la tête d’une foule nombreuse
  rationale: L’expression indique que le roi arrive accompagné d’un grand nombre de personnes; cette tournure française est naturelle sans préciser indûment qu’il s’agit d’une armée.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: nous faisant passer auprès d’eux pour des alliés
  rationale: Le grec signifie que Juda et Dan feignent d’être des alliés aux yeux des Amorites, non qu’ils prétendent être eux-mêmes amorites.
- source_word: νυκτὸς βαθείας
  choice: au cœur de la nuit
  rationale: Rend idiomatiquement l’idée d’une nuit avancée ou profonde.
- source_word: ἐξωλοθρεύσαμεν
  choice: nous exterminâmes
  rationale: Conserve la force du verbe grec, qui exprime une destruction totale.
- source_word: ἐπρονομεύσαμεν
  choice: pillâmes la ville
  rationale: Le verbe signifie mettre au pillage ou prendre comme butin; « la ville » fournit en français le complément naturellement impliqué par le contexte, sans ajouter l’épisode des trois murailles absent du texte grec fourni.
- source_word: ἀποσκευή
  choice: bagages
  rationale: Désigne ici les bagages, l’équipement ou le train accompagnant les rois ennemis; « bagages » préserve cette portée générale.
- source_word: ἐπὶ τὴν κορυφήν
  choice: jusqu’au sommet
  rationale: Respecte le sens spatial de κορυφή sans identifier plus précisément le relief, que le texte ne nomme pas.
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: Ils me lançaient des pierres avec leurs frondes
  rationale: Explicite naturellement en français l’action du verbe dérivé de « fronde » tout en gardant les pierres comme projectiles.
theological_decisions:
- issue: Étendue du massacre au verset 3
  choice: « tous les habitants »
  alternative: « tous » ou « eux tous »
  rationale: Le masculin pluriel αὐτούς renvoie aux gens de la ville. La formulation française clarifie le référent sans étendre explicitement la destruction à leurs biens, contrairement à la couche anglaise.
- issue: Éléments narratifs présents dans la consultation anglaise mais absents du grec fourni
  choice: Ne pas ajouter la destruction de trois murailles ni une seconde proposition détaillant tout le butin
  alternative: Suivre intégralement le texte anglais
  rationale: La traduction repose d’abord sur le texte grec source. Le verset 3 fourni contient seulement l’extermination et le pillage; les ajouts anglais ne disposent pas ici d’un appui dans la colonne grecque transmise.
- issue: Phrase inachevée au verset 6
  choice: Conserver l’apodose absente au moyen de points de suspension et d’une note
  alternative: Compléter la conséquence d’après une autre édition ou la couche anglaise
  rationale: L’extrait grec s’arrête après la proposition conditionnelle. Il faut préserver cette lacune plutôt que fabriquer ou importer une suite non fournie.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le passé simple maintient le registre littéraire attendu d’un testament ancien, tandis que les formulations restent immédiatement compréhensibles. Les noms propres suivent les formes françaises données par la tradition du document: Juda, Dan, Gaas et Thamna.'
