base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: fr
  text: Après avoir dit cela, il s’endormit[a]. Ses fils firent tout ce qu’il leur avait commandé et l’ensevelirent avec ses pères à Hébron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : il mourut.'
    reason: Clarifie pour le lecteur moderne l’euphémisme grec tout en le conservant dans le texte principal.
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Conserve l’euphémisme grec de la mort et sa portée littéraire, plutôt que de l’expliciter directement par « il mourut ».
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  choice: tout ce qu’il leur avait commandé
  rationale: Rend naturellement en français l’idée qu’ils se conformèrent en tous points à ses instructions.
- source_word: ἔθαψαν
  choice: l’ensevelirent
  rationale: Terme français digne et précis pour l’acte de mettre au tombeau.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: avec ses pères
  rationale: Préserve l’expression généalogique traditionnelle du grec sans la réduire à une simple mention de ses ancêtres.
theological_decisions:
- issue: Euphémisme de la mort
  choice: Conserver « il s’endormit » dans le texte
  alternative: « il mourut »
  rationale: Le grec emploie explicitement le langage du sommeil. Le conserver évite d’effacer une image potentiellement significative, tandis qu’une note en précise le sens contextuel.
- issue: Éléments présents dans l’anglais mais absents du grec fourni
  choice: Ne pas inclure « dans une heureuse vieillesse », « le transportèrent » ni « là »
  alternative: Suivre intégralement la formulation anglaise
  rationale: Ces éléments ne figurent pas dans le texte grec cité. La traduction privilégie donc la source originale disponible.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suit étroitement le grec sans devenir artificielle. « Ses pères » est maintenu comme expression funéraire et familiale traditionnelle.
