translation:
  language: fr
  text: Que personne ne m’ensevelisse revêtu d’un vêtement somptueux ; mais transportez-moi à Hébron, où sont aussi mes pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνταφιάσει
  choice: m’ensevelisse
  rationale: Le verbe désigne ici l’action de préparer et de mettre au tombeau; «ensevelir» convient naturellement au contexte funéraire.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: dans un vêtement somptueux
  rationale: Rend directement l’idée d’un habit coûteux ou luxueux, sans préciser indûment sa forme.
- source_word: ἀναγάγετε
  choice: Ramenez-moi
  rationale: Dans ce contexte, le verbe exprime le transport de la dépouille vers Hébron; «ramener» est naturel en français et conserve l’idée d’un retour au lieu ancestral.
- source_word: οἱ πατέρες μου
  choice: mes pères
  rationale: Conserve la désignation familiale et ancestrale du grec, appropriée à l’inhumation auprès des patriarches.
theological_decisions:
- issue: Écart entre le grec fourni et la couche anglaise de consultation
  choice: Traduire le texte grec qui demande une sépulture simple et le transport à Hébron
  alternative: Suivre le texte anglais sur l’observance de la loi du Seigneur
  rationale: Le grec constitue ici la preuve textuelle originale fournie et forme une phrase complète; le texte anglais correspond manifestement à un autre passage malgré la révision signalée.
- issue: Ellipse dans «là où aussi mes pères»
  choice: Expliciter par «là où reposent aussi mes pères»
  alternative: Traduire littéralement «là où sont aussi mes pères»
  rationale: Le verbe est sous-entendu en grec. «Reposent» explicite naturellement le contexte funéraire sans ajouter de localisation ou de doctrine étrangère au texte.
translation_notes:
  register: Français moderne, digne et accessible. L’impératif et le contraste entre luxe funéraire et sépulture ancestrale sont conservés. Aucun marqueur de note n’est requis, les exposants de l’édition semblant être des renvois critiques non documentés dans les données fournies.
