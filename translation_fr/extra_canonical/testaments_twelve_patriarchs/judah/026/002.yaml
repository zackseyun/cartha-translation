review_pass:
  verdict: revise
  source_fidelity: Le projet suit correctement le grec fourni, et non la couche anglaise manifestement étrangère à ce verset. Il rend l’interdiction d’une sépulture avec un habit coûteux, puis la demande de transport à Hébron, où se trouvent aussi les pères du locuteur. Toutefois, «dans un vêtement» peut suggérer en français que le corps est placé à l’intérieur du vêtement plutôt qu’enseveli vêtu de celui-ci. De plus, «reposent» explicite l’ellipse grecque («où sont aussi mes pères») dans un sens funéraire plausible, mais non exprimé explicitement.
  naturalness: La formulation est globalement claire et digne. «Ensevelir revêtu d’un vêtement somptueux» est plus idiomatique et précis que «ensevelir dans un vêtement somptueux». «Transportez-moi à Hébron» convient naturellement pour le déplacement de la dépouille sans introduire le sens de retour que peut porter «ramenez-moi».
  terminology: «Ensevelir», «vêtement somptueux», «Hébron» et «mes pères» sont appropriés. «Mes pères» maintient la désignation ancestrale du grec sans la réduire à «ancêtres» ni la préciser comme «patriarches». Aucun terme théologique spécialisé n’est en jeu.
  issues:
  - severity: low
    issue: Expression spatiale ambiguë en français
    rationale: '«M’ensevelisse dans un vêtement somptueux» est grammatical, mais peut évoquer le fait d’être mis dans un vêtement plutôt qu’enterré vêtu de ce vêtement. Le grec ἐν ... ἐσθῆτι se rend plus nettement par «revêtu d’un vêtement». '
  - severity: low
    issue: Explicitation de l’ellipse finale
    rationale: «Là où reposent aussi mes pères» est contextuellement très vraisemblable, mais le grec dit seulement «où [sont] aussi mes pères». Conserver «où sont aussi mes pères» respecte l’ellipse et évite d’ajouter un prédicat explicite.
  - severity: medium
    issue: Divergence de la piste d’audit anglaise
    rationale: Le texte anglais fourni porte sur l’observance de la loi du Seigneur et ne correspond pas au grec de ce verset, qui forme une phrase complète sur l’ensevelissement et Hébron. La traduction française doit donc suivre le grec source.
