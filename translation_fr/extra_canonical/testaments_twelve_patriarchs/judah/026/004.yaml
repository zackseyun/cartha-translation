translation:
  language: fr
  text: 'Il leur dit : « Voici, j’ai cent dix-huit ans et je meurs aujourd’hui. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le fragment grec fourni n’est pas encore aligné verset par verset. Son contenu ne correspond pas au texte anglais actuellement associé à Testament de Juda 26.4; la présente traduction suit donc strictement le grec cité.
    reason: Signaler honnêtement l’incertitude de rattachement du fragment grec et la divergence substantielle avec la couche anglaise.
lexical_decisions:
- source_word: Ἰδοὺ ἐγώ
  choice: Voici, j’ai
  rationale: « Voici » rend l’appel d’attention de ἰδού, tandis que la formulation avec « j’ai » exprime naturellement en français l’accent mis sur le locuteur par ἐγώ.
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: cent dix-huit ans
  rationale: Expression française idiomatique et exacte de l’âge indiqué par le grec.
- source_word: ἀποθνῄσκω σήμερον
  choice: je meurs aujourd’hui
  rationale: Rend directement le présent ἀποθνῄσκω et l’adverbe σήμερον, sans transformer l’énoncé en futur.
theological_decisions:
- issue: Divergence entre le grec fourni et la couche anglaise consultative
  choice: Traduire le texte grec effectivement fourni
  alternative: 'Suivre l’anglais : « Ainsi donc, mes enfants, gardez toute la loi du Seigneur… »'
  rationale: Le grec cité parle de l’âge du locuteur et de sa mort ce jour-là; il ne contient ni exhortation aux enfants, ni loi, ni espérance. La priorité revient aux données de la langue source, tout en signalant l’incertitude d’alignement.
translation_notes:
  register: Français moderne, simple et digne. La tournure reste proche du grec tout en exprimant l’âge de manière naturelle. Aucun développement absent du texte source n’a été ajouté.
