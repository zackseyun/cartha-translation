  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: fr
  text: Gardez donc, mes enfants, toute la loi du Seigneur, car elle est une espérance pour ceux qui rendent droites ses voies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour ceux qui rendent droites ses voies » ou « dirigent ses voies droitement ». La construction grecque est inhabituelle; « ses voies » peut se comprendre, selon le texte transmis, comme renvoyant au Seigneur.'
    reason: La note explicite la formulation transitive inhabituelle du grec et son ambiguïté, sans la résoudre par une interprétation doctrinale ou par une correction conjecturale.
lexical_decisions:
- source_word: Φυλάξατε
  choice: Gardez
  rationale: L’impératif exprime l’observance fidèle de la loi; « gardez » conserve cette nuance biblique tout en restant clair en français moderne.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: toute la loi du Seigneur
  rationale: Rend directement l’idée d’intégralité portée par πάντα et respecte la construction grecque.
- source_word: ἐλπίς
  choice: une espérance
  rationale: Conserve le prédicat nominal grec sans transformer l’affirmation en promesse plus précise qu’elle ne l’est.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: pour ceux qui marchent droit dans ses voies
  rationale: Formulation française naturelle qui restitue l’idée de direction droite associée à κατευθύνω et l’image biblique des voies du Seigneur.
theological_decisions:
- issue: Rapport entre la loi du Seigneur et l’espérance
  choice: la loi « est une espérance »
  alternative: la loi « donne de l’espérance »
  rationale: Le grec emploie directement « est »; la traduction maintient cette affirmation sans en préciser ou en atténuer théologiquement le rapport.
- issue: Sens de l’expression concernant les voies du Seigneur
  choice: « marchent droit dans ses voies »
  alternative: « rendent droites ses voies »
  rationale: La traduction retenue exprime l’obéissance droite sans suggérer que les humains auraient à corriger les voies mêmes de Dieu; la note signale toutefois la forme plus littérale du grec.
translation_notes:
  register: Français moderne, digne et accessible. L’adresse « mes enfants » et l’expression « les voies du Seigneur » conservent la tonalité sapientielle et testamentaire du passage.
