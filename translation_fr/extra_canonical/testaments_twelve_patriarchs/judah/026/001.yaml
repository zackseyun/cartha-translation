    text: 'Littéralement : « pour ceux qui rendent droites ses voies » ou « dirigent ses voies droitement ». La construction grecque est inhabituelle; « ses voies » peut se comprendre, selon le texte transmis, comme renvoyant au Seigneur.'
    reason: La note explicite la formulation transitive inhabituelle du grec et son ambiguïté, sans la résoudre par une interprétation doctrinale ou par une correction conjecturale.
