- from: Gardez donc, mes enfants, toute la loi du Seigneur, car elle est une espérance pour ceux qui marchent droit dans ses voies.[a]
  to: Gardez donc, mes enfants, toute la loi du Seigneur, car elle est une espérance pour ceux qui rendent droites ses voies.[a]
  rationale: La révision conserve les termes et le registre du brouillon, mais rend dans le texte la transitivité inhabituelle de κατευθύνουσι τὰς ὁδοὺς αὐτοῦ. La note, correctement ancrée, fournit une explication limitée de l’étrangeté plutôt que de substituer au grec une lecture harmonisante telle que « marchent droit dans ses voies ».
  reviewer_model: gpt-5.6-terra
