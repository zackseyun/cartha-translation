lexical_decisions:
- source_word: brothers (and sisters)
  choice: frères et sœurs
  rationale: Rend explicitement le groupe mixte signalé par le témoin anglais, dans un français naturel.
- source_word: different ideas
  choice: des idées différentes
  rationale: Préserve l’indétermination du reproche d’André sans préciser arbitrairement qu’il s’agit d’idées étrangères, hétérodoxes ou contradictoires.
- source_word: adversaries
  choice: les adversaires
  rationale: Conserve le terme générique et sa possible portée théologique sans l’identifier au diable ou à un groupe déterminé.
- source_word: made her worthy
  choice: l’a jugée digne
  rationale: Expression française idiomatique qui garde l’idée d’une reconnaissance ou qualification accordée par le Sauveur.
- source_word: perfect Humanity
  choice: l’Humanité parfaite
  rationale: Maintient la majuscule du témoin et l’expression conceptuellement chargée, sans la réduire à la simple perfection morale.
- source_word: gospel
  choice: la bonne nouvelle
  rationale: Dans l’action de prêcher, le sens de message proclamé est plus transparent en français moderne que le seul terme technique « Évangile ».
theological_decisions:
- issue: Autorité de Marie et préférence du Sauveur
  choice: Conserver « il l’a aimée plus que nous »
  alternative: Atténuer en « il avait pour elle une affection particulière »
  rationale: La formulation comparative du témoin est théologiquement tendue et ne doit pas être adoucie.
- issue: Portée de « l’Humanité parfaite »
  choice: Maintenir une formulation substantivée et la majuscule
  alternative: Traduire par « l’être humain parfait » ou « la parfaite humanité » sans majuscule
  rationale: La source directe n’ayant pas encore été révisée, cette solution préserve le caractère possiblement technique de l’expression sans imposer une interprétation anthropologique précise.
- issue: Question de Pierre sur l’entretien privé
  choice: Rendre la phrase comme une question indignée mais ambiguë
  alternative: Affirmer explicitement que le Sauveur aurait parlé secrètement à Marie
  rationale: Le passage oppose connaissance des disciples et parole publique, mais sa syntaxe transmise par le témoin reste délicate ; la traduction évite de résoudre au-delà de l’évidence disponible.
translation_notes:
  register: Français international moderne, digne et lisible. Les échanges restent directs et chargés d’émotion. Projet provisoire fondé sur le témoin anglais public fourni, la vérification directe du copte et des fragments grecs étant encore en attente.
