  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: fr
  text: 'André répondit aux frères et aux sœurs : « Dites ce que vous voudrez au sujet de ce qu’elle a dit. Pour ma part, je ne crois pas que le Sauveur ait dit ces choses, car ces enseignements semblent exprimer des idées différentes. »


    Pierre exprima à son tour les mêmes réserves. Il les interrogea au sujet du Sauveur : « Il n’a tout de même pas parlé avec une femme à notre insu, plutôt qu’ouvertement avec nous, n’est-ce pas ? Allons-nous maintenant nous retourner et tous l’écouter ? L’a-t-il préférée à nous ? »


    Alors Marie pleura et dit à Pierre : « Mon frère Pierre, que vas-tu penser là ? Crois-tu vraiment que j’ai inventé cela moi-même dans mon cœur, ou que je mens au sujet du Sauveur ? »


    Lévi répondit à Pierre : « Pierre, tu as toujours été coléreux. Maintenant, je te vois contester cette femme comme le font les adversaires. Mais si le Sauveur l’a jugée digne, qui es-tu donc pour la rejeter ? Assurément, le Sauveur la connaît très bien. Voilà pourquoi il l’a aimée plus que nous.


    « Nous devrions plutôt avoir honte, nous revêtir de l’Humanité parfaite[a], nous l’approprier comme il nous l’a enseigné, et proclamer la bonne nouvelle, sans établir d’autre règle ni d’autre loi que ce qu’a dit le Sauveur. »


    Quand [Lévi eut dit cela][b], ils commencèrent à partir pour enseigner et proclamer la bonne nouvelle.


    L’Évangile


    selon


    Marie'
  philosophy: optimal-equivalence
