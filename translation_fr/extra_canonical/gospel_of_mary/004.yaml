base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: fr
  text: 'Le Désir dit : « Je ne t’ai pas vue descendre, mais maintenant je te vois monter. Pourquoi donc mens-tu, puisque tu m’appartiens ? »


    L’âme répondit : « Moi, je t’ai vu, mais toi, tu ne m’as ni vue ni connue. Pour toi, je n’étais qu’un vêtement, et tu ne m’as pas reconnue. » Après avoir dit cela, elle partit, remplie d’une grande joie.


    Elle arriva ensuite à la troisième puissance, appelée « Ignorance ». [Elle] interrogea l’âme et [dit] : « Où vas-tu ? Tu es liée dans la méchanceté. Puisque tu es liée, ne juge pas ! »[a]


    [Et] l’âme dit : « Pourquoi me juges-tu, puisque je n’ai pas jugé ? J’ai été liée, bien que je n’aie pas lié. Ils ne m’ont pas reconnue, mais moi, j’ai reconnu que tout se dissoudra : aussi bien ce qui est de la [terre] que ce qui est du [ciel]. »


    Après avoir vaincu la troisième puissance, l’âme monta et vit la quatrième puissance, qui prit sept formes :


    La première forme est Ténèbres ;

    la deuxième, Désir ;

    la troisième, Ignorance ;

    la quatrième, Zèle pour la mort ;

    la cinquième, Royaume de la chair ;

    la sixième, « Sagesse » insensée de la chair ;

    la septième, « Sagesse » de la colère.


    Telles sont les sept puissances du Courroux.


    Elles demandent à l’âme : « D’où viens-tu, meurtrière, et où vas-tu, conquérante de l’espace ? »


    L’âme répondit : « Ce qui me lie a été tué, ce qui m’entoure a été vaincu, mon désir a disparu et l’ignorance est morte. Dans un [monde], j’ai été libérée d’un monde, [et] dans une figure, d’une figure qui est au-dessus, ainsi que de la chaîne de l’oubli, qui n’existe que pour un temps. Désormais, je recevrai dans le silence le repos du temps, du moment de l’éon. »[b]


    Après avoir dit cela, Marie se tut, car c’était jusque-là que le Sauveur lui avait parlé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots placés entre crochets dans le texte signalent des éléments restitués ou incertains dans le témoin manuscrit tel qu’il est représenté par la traduction de consultation.
    reason: Préserver visiblement les signaux de restauration du témoin fourni sans les présenter comme du texte assuré.
  - marker: b
    text: La suite « dans un monde… dans une figure… » et la formule sur « le repos du temps, du moment de l’éon » sont particulièrement obscures. La traduction en conserve la tension; une vérification directe du copte et des fragments grecs reste nécessaire.
    reason: Avertir honnêtement de l’incertitude syntaxique et lexicale, puisque la révision directe des sources anciennes est indiquée comme encore en attente.
lexical_decisions:
- source_word: Desire (supplied English witness; Coptic/Greek review pending)
  choice: le Désir
  rationale: La majuscule maintient la personnification d’une puissance, tandis que le nom courant reste immédiatement compréhensible.
- source_word: power
  choice: puissance
  rationale: « Puissance » convient à une entité personnifiée et préserve la portée cosmologique du passage sans la réduire à une simple faculté.
- source_word: garment
  choice: vêtement
  rationale: Choix concret et non interprétatif, qui conserve l’image de quelque chose porté extérieurement.
- source_word: Zeal for Death
  choice: Zèle pour la mort
  rationale: Rendu volontairement proche du témoin, sans décider si le zèle vise la mort, lui appartient ou la provoque.
- source_word: Foolish “Wisdom” of Flesh
  choice: « Sagesse » insensée de la chair
  rationale: Les guillemets préservent l’ironie explicite du témoin et « insensée » évite un registre trop familier.
- source_word: Wrath
  choice: Courroux
  rationale: Le nom avec majuscule marque une puissance personnifiée; « courroux » garde un registre solennel distinct de la colère déjà nommée dans la septième forme.
- source_word: type
  choice: figure
  rationale: « Figure » conserve l’idée d’une forme ou configuration sans imposer le sens moderne, technique et potentiellement trompeur de « type ».
- source_word: age
  choice: éon
  rationale: Dans cette formule cosmologique obscure, « éon » préserve une possible portée temporelle et cosmique que « siècle » ou « éternité » trancherait trop vite.
theological_decisions:
- issue: Nature des puissances rencontrées par l’âme
  choice: Conserver leurs noms personnifiés avec des majuscules
  alternative: Les rendre comme de simples états psychologiques en minuscules
  rationale: Le récit les présente comme des interlocutrices et des puissances; les réduire à des états intérieurs résoudrait indûment la tension cosmologique et psychologique.
- issue: Rapport entre l’âme et le vêtement
  choice: Maintenir l’image sans expliquer ce que représente le vêtement
  alternative: Identifier explicitement le vêtement au corps
  rationale: Le passage fourni ne formule pas cette identification; l’ajouter importerait une interprétation doctrinale.
- issue: « Ce qui me lie a été tué »
  choice: Préserver le passif et l’absence d’agent nommé
  alternative: Identifier ce qui a été tué ou celui qui l’a tué
  rationale: Le témoin laisse l’agent et le référent indéterminés; cette ambiguïté doit rester ouverte.
- issue: Formule finale sur le repos, le temps et l’éon
  choice: Conserver une formulation dense et ouverte
  alternative: La paraphraser comme entrée certaine dans un repos éternel
  rationale: La syntaxe transmise est obscure et une paraphrase théologique trop nette effacerait cette difficulté réelle.
translation_notes:
  register: Français international actuel, digne et lisible, avec tutoiement cohérent dans les dialogues. La syntaxe reste fluide sauf là où l’obscurité du témoin paraît substantielle. Les majuscules distinguent les puissances personnifiées. Projet provisoire fondé sur le témoin anglais public fourni; il ne prétend pas remplacer la collation directe du Papyrus Berolinensis 8502,1 et des fragments grecs.
