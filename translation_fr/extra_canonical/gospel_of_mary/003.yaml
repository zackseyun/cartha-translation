translation:
  language: fr
  text: 'Alors Marie se leva et les salua tous. Elle dit à ses frères et sœurs[a] : « Ne pleurez pas, ne vous affligez pas et ne laissez pas vos cœurs se diviser, car sa grâce sera avec vous tous et vous protégera. Louons plutôt sa grandeur, car il nous a préparés et a fait de nous des êtres humains[b]. »


    Après avoir dit cela, Marie tourna leurs cœurs [vers] le Bien, et ils [commencèrent] à discuter des paroles du [Sauveur].


    Pierre dit à Marie : « Sœur, nous savons que le Sauveur t’aimait plus que toutes les autres femmes. Dis-nous les paroles du Sauveur dont tu te souviens : celles que tu connais, mais que nous ne connaissons pas et que nous n’avons pas entendues. »


    Marie répondit : « Je vais vous révéler ce qui vous est caché. » Puis elle commença à leur rapporter ces paroles : « Moi, dit-elle, j’ai vu le Seigneur dans une vision et je lui ai dit : “Seigneur, je t’ai vu aujourd’hui dans une vision.”


    « Il me répondit : “Heureuse es-tu, car tu n’as pas vacillé en me voyant. En effet, là où est l’intelligence[c], là est le trésor.”


    « Je lui dis : “Seigneur, celui qui voit une vision la voit-il dans l’âme ou dans l’esprit ?”


    « Le Sauveur répondit : “Ce n’est ni dans l’âme ni dans l’esprit qu’on voit, mais c’est l’intelligence, qui [se trouve] entre les deux, qui voit la vision, et c’est elle qui […]”[d]


    Les pages 11 à 14 manquent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin anglais porte littéralement « frères (et sœurs) »; la formulation française explicite ici un groupe mixte possible.
    reason: Signaler l’explicitation inclusive faite à partir du témoin provisoire.
  - marker: b
    text: L’expression peut aussi être comprise comme « nous a rendus humains » ou « a fait de nous des Humains ». Son sens précis devra être vérifié sur le copte et les fragments grecs.
    reason: Préserver l’ambiguïté anthropologique et signaler le caractère provisoire de la base.
  - marker: c
    text: Ou « pensée », « intellect ». Le mot désigne ici ce qui perçoit la vision et que le texte situe entre l’âme et l’esprit.
    reason: Documenter une décision lexicale importante en attente d’examen direct de la langue ancienne.
  - marker: d
    text: Le texte s’interrompt ici. Les crochets indiquent des mots rétablis ou incertains dans le témoin de travail; les pages 11 à 14 du manuscrit manquent.
    reason: Rendre visible la lacune matérielle et distinguer le texte conservé des restitutions.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: frères et sœurs
  rationale: Le français inclusif explicite naturellement le groupe visé sans recourir à une parenthèse lourde; une note signale la formulation du témoin de travail.
- source_word: the Good
  choice: le Bien
  rationale: La majuscule conserve la possible valeur substantivée ou transcendante de l’expression, sans la définir davantage.
- source_word: Humans
  choice: des êtres humains
  rationale: Cette formulation moderne conserve l’insistance du témoin sur l’humanité constituée ou accomplie, sans réduire le terme aux seuls hommes de sexe masculin.
- source_word: mind
  choice: l’intelligence
  rationale: « Intelligence » rend ici la faculté de perception et de discernement située entre l’âme et l’esprit; « pensée » ou « intellect » restent possibles lors de la révision copte/grecque.
- source_word: vision
  choice: vision
  rationale: Le même terme est maintenu dans tout le passage afin de préserver la cohérence de la question sur le mode de perception.
theological_decisions:
- issue: Nature de l’action « made us Humans »
  choice: « a fait de nous des êtres humains »
  alternative: « nous a rendus pleinement humains »
  rationale: La traduction retenue ne précise pas si le texte parle de création, de préparation spirituelle ou d’accomplissement anthropologique.
- issue: Rapport entre l’intelligence, l’âme et l’esprit
  choice: Conserver l’intelligence « entre les deux »
  alternative: Interpréter l’intelligence comme une faculté appartenant à l’un des deux
  rationale: Le passage établit une distinction énigmatique que la traduction ne doit pas harmoniser avec une anthropologie doctrinale particulière.
- issue: « where the mind is, there is the treasure »
  choice: « là où est l’intelligence, là est le trésor »
  alternative: « là où se trouve la pensée, là se trouve le trésor »
  rationale: La formulation parallèle et ambiguë est préservée sans identifier le trésor ni expliquer la relation.
- issue: Amour particulier du Sauveur pour Marie
  choice: « t’aimait plus que toutes les autres femmes »
  alternative: « t’aimait davantage que toutes les femmes »
  rationale: Le comparatif du témoin est conservé sans en tirer de conclusion sur le statut ou l’autorité de Marie.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste fluide, tandis que les crochets et l’ellipse conservent les signaux textuels du témoin. Projet provisoire fondé sur la traduction anglaise publique fournie; une vérification directe du copte et des fragments grecs demeure nécessaire.
