  source_fidelity: À partir du témoin anglais public fourni (la vérification directe du copte et des fragments grecs restant en attente), le texte français rend fidèlement les enchaînements, les impératifs, les répétitions et les ambiguïtés principales. « Faites vôtre ma paix » traduit naturellement l’appropriation active de « Acquire my peace »; « est en vous » conserve l’indétermination du pluriel; et « de peur d’être liés par elle » garde l’image de l’assujettissement sans la surinterpréter.
  naturalness: Le français est moderne, soutenu et fluide. La ponctuation dialoguée, les impératifs et les formulations telles que « aller vers les nations » et « proclamer la bonne nouvelle » sont idiomatiques. « Ils disaient » peut exprimer leur parole collective dans ce contexte narratif et ne crée pas de décalage de sens significatif.
  terminology: « Le Bienheureux », « Fils de l’humanité », « bonne nouvelle », « Royaume », « les nations » et « législateur » sont cohérents et respectent les choix explicités. Le maintien de « Fils de l’humanité », plutôt qu’une harmonisation avec « Fils de l’homme », est particulièrement approprié pour ce témoin provisoire. Aucun ancrage de note n’est requis par le passage fourni.
