base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: fr
  text: 'Après avoir dit cela, le Bienheureux les salua tous en disant : « Que la paix soit avec vous ! Faites vôtre ma paix. Veillez à ce que personne ne vous égare en disant : “Regardez par ici !” ou “Regardez par là !” Car le Fils de l’humanité est en vous. Suivez-le ! Ceux qui le cherchent le trouveront.


    « Allez donc proclamer la bonne nouvelle du Royaume. N’imposez aucune règle au-delà de ce que je vous ai donné et n’établissez pas de loi à la manière du législateur, de peur d’être liés par elle. » Après avoir dit cela, il partit.


    Mais ils furent accablés de chagrin et pleurèrent amèrement. Ils disaient : « Comment pouvons-nous aller vers les nations proclamer la bonne nouvelle du Royaume du Fils de l’humanité ? S’ils ne l’ont pas épargné, pourquoi nous épargneraient-ils ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Blessed One
  choice: le Bienheureux
  rationale: Conserve le titre honorifique du témoin fourni dans un français digne et naturel, sans préciser une identité que le passage laisse implicite.
- source_word: Acquire my peace
  choice: Faites vôtre ma paix
  rationale: Exprime l’appropriation active indiquée par « acquire » sans employer l’expression peu naturelle « acquérez ma paix ».
- source_word: Son of Humanity
  choice: Fils de l’humanité
  rationale: Préserve la formulation particulière du témoin anglais plutôt que de la normaliser en « Fils de l’homme », décision qui devra être vérifiée directement sur les témoins copte et grec.
- source_word: exists within you
  choice: est en vous
  rationale: Garde l’ambiguïté possible du pluriel entre présence intérieure et présence au milieu du groupe, sans l’expliciter artificiellement.
- source_word: Gentiles
  choice: les nations
  rationale: Rend le groupe des non-Juifs par une expression biblique claire et moins chargée que « païens ».
- source_word: gospel about the kingdom
  choice: la bonne nouvelle du Royaume
  rationale: Formulation française idiomatique qui conserve le Royaume comme contenu ou objet de la proclamation.
theological_decisions:
- issue: Localisation du Fils de l’humanité
  choice: « est en vous »
  alternative: « est au milieu de vous » ou « est à l’intérieur de vous »
  rationale: La formulation retenue maintient l’ambiguïté théologique et collective du témoin fourni au lieu de trancher entre intériorité individuelle et présence communautaire.
- issue: Nature des prescriptions interdites
  choice: « N’imposez aucune règle […] et n’établissez pas de loi »
  alternative: « Ne donnez aucun commandement […] »
  rationale: Distingue la règle de la loi et évite de transformer le propos en rejet général de tout commandement.
- issue: Risque lié à la loi
  choice: « de peur d’être liés par elle »
  alternative: « sinon elle vous condamnera »
  rationale: Conserve l’image de l’assujettissement présente dans le témoin sans introduire l’idée plus précise de condamnation.
- issue: Royaume du Fils de l’humanité
  choice: conserver « du Fils de l’humanité » dans la dernière question
  alternative: comprendre séparément « la bonne nouvelle du Royaume » puis « du Fils de l’humanité »
  rationale: Suit la syntaxe du témoin fourni tout en reconnaissant qu’une vérification directe du copte et du grec reste nécessaire.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Les répétitions structurantes ont été conservées. Cette rédaction demeure provisoire : elle repose sur le témoin anglais public fourni, la vérification directe des sources copte et grecque étant signalée comme encore à faire.'
