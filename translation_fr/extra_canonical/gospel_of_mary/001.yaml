  text: '“Then will [matter] be [destroyed], or not?”


    The Savior said, “Every nature, every form, every creature exists in and with each other, but they’ll dissolve again into their own roots, because the nature of matter dissolves into its nature alone. Anyone who has ears to hear should hear!”


    Peter said to him, “Since you’ve explained everything to us, tell us one more thing. What’s the sin of the world?”


    The Savior said, “Sin doesn’t exist, but you’re the ones who make sin when you act in accordance with the nature of adultery, which is called ‘sin.’ That’s why the Good came among you, up to the things of every nature in order to restore it within its root.”


    Then he continued and said, “That’s why you get sick and die, because [you love what tricks you. Anyone who] can understand should understand!


    “Matter [gave birth to] a passion that has no image because it comes from what’s contrary to nature. Then confusion arises in the whole body. That’s why I told you to be content at heart. If you’re discontented, find contentment in the presence of the various images of nature. Anyone who has ears to hear should hear!”'
translation:
  language: fr
  text: '« Alors, [la matière] sera-t-elle [détruite], ou non ? »[a]


    Le Sauveur répondit : « Toute nature, toute forme et toute créature existent les unes dans les autres et avec les autres ; mais elles se dissoudront de nouveau en leurs propres racines, car la nature de la matière se dissout uniquement dans sa propre nature. Que celui qui a des oreilles pour entendre entende ! »


    Pierre lui dit : « Puisque tu nous as tout expliqué, dis-nous encore une chose : qu’est-ce que le péché du monde ? »


    Le Sauveur répondit : « Le péché n’existe pas ; c’est vous qui produisez le péché lorsque vous agissez conformément à la nature de l’adultère, laquelle est appelée “péché”. Voilà pourquoi le Bien est venu parmi vous, jusqu’aux réalités de toute nature, afin de la rétablir dans sa racine. »[b]


    Puis il poursuivit : « Voilà pourquoi vous tombez malades et mourez : parce que [vous aimez ce qui vous trompe. Que celui qui] peut comprendre comprenne ![c]


    « La matière [a engendré] une passion dépourvue d’image, parce qu’elle vient de ce qui est contraire à la nature. Alors, le désordre se répand dans tout le corps. Voilà pourquoi je vous ai dit de garder un cœur serein. Si vous manquez de sérénité, trouvez-la en présence des diverses images de la nature. Que celui qui a des oreilles pour entendre entende ! »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots entre crochets signalent ici et plus bas un texte endommagé ou une restitution éditoriale dans le témoin utilisé.
    reason: Préserver visiblement le degré d’incertitude manuscrite.
  - marker: b
    text: Le référent de « la » dans « la rétablir » demeure incertain ; il pourrait renvoyer à la nature ou à une réalité évoquée dans la phrase.
    reason: Éviter de résoudre silencieusement une ambiguïté grammaticale et théologique.
  - marker: c
    text: Une partie de cette phrase est restituée ; son libellé exact reste donc incertain.
    reason: Avertir que l’enchaînement causal repose en partie sur une reconstruction.
  - marker: d
    text: « Garder un cœur serein » rend une invitation au contentement ou à la stabilité intérieure ; le sens précis devra être contrôlé sur le copte et les fragments grecs.
    reason: Signaler une décision idiomatique provisoire dans un passage conceptuellement difficile.
lexical_decisions:
- source_word: matter
  choice: matière
  rationale: Terme philosophique français courant, conservant la portée cosmologique du témoin anglais sans préciser davantage le concept avant vérification du copte et du grec.
- source_word: roots / root
  choice: racines / racine
  rationale: Maintient l’image de l’origine propre à chaque réalité ainsi que l’alternance entre pluriel et singulier du témoin.
- source_word: the Good
  choice: le Bien
  rationale: La majuscule et la substantivation préservent la possible valeur personnelle ou métaphysique sans trancher entre elles.
- source_word: adultery
  choice: adultère
  rationale: Conserve le terme moral et métaphorique du témoin plutôt que de l’interpréter comme simple corruption ou infidélité spirituelle.
- source_word: passion
  choice: passion
  rationale: Préserve le terme anthropologique ou philosophique, dont le sens exact peut aller du désir à l’affect subi.
- source_word: has no image
  choice: dépourvue d’image
  rationale: Rend l’expression littéralement tout en maintenant son caractère énigmatique.
- source_word: confusion
  choice: désordre
  rationale: Dans ce contexte corporel, « désordre » est naturel en français et garde l’idée d’une perturbation générale sans imposer un diagnostic.
- source_word: be content at heart
  choice: garder un cœur serein
  rationale: Formulation française naturelle et digne qui exprime un état intérieur d’apaisement ; elle évite le sens moderne trop matériel de « être satisfait ».
theological_decisions:
- issue: « Le péché n’existe pas »
  choice: Conserver l’affirmation absolue telle qu’elle apparaît, puis sa qualification par l’action humaine.
  alternative: 'Paraphraser : « Le péché n’existe pas par lui-même » ou « il n’existe pas de péché en soi ».'
  rationale: La paraphrase résoudrait une tension ontologique que le passage laisse ouverte.
- issue: Nature de « le Bien »
  choice: Employer « le Bien » sans l’identifier explicitement au Sauveur, à Dieu ou à un principe métaphysique.
  alternative: Traduire par « Celui qui est bon » ou « le Dieu bon ».
  rationale: Le témoin permet plusieurs lectures ; la traduction ne doit pas imposer une christologie ou une cosmologie particulière.
- issue: Référent de « la » dans « la rétablir dans sa racine »
  choice: Maintenir le pronom féminin singulier.
  alternative: Expliciter « toute nature », « chaque chose » ou « la création ».
  rationale: Le référent est grammaticalement et théologiquement incertain dans le témoin disponible ; l’ambiguïté est donc préservée.
- issue: « Nature de l’adultère »
  choice: Maintenir l’expression sans expliquer si elle désigne une faute sexuelle, une infidélité spirituelle ou un mélange contre nature.
  alternative: Choisir explicitement l’une de ces interprétations.
  rationale: Le passage semble employer « adultère » dans un cadre conceptuel plus large, mais la preuve source fournie ne permet pas d’en fixer la portée.
translation_notes:
  register: Français international moderne, oral mais digne. Les répétitions rhétoriques et les formules d’appel à entendre ou à comprendre sont conservées. Projet provisoire établi à partir du témoin anglais public fourni, la vérification directe du copte et des fragments grecs restant à effectuer ; les crochets sont maintenus pour les lacunes et restitutions.
