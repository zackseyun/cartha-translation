    Pour le moment, cependant, ne vous préoccupez pas de communiquer ceci à qui que ce soit parmi vous, car cela peut être utile.[a]


    Beaucoup examinent les questions au sujet desquelles je vous ai écrit. À ceux-là, je dis : Paix à eux, et grâce.


    Je vous salue, vous et ceux qui vous aiment d’un amour fraternel.


    Traité sur la résurrection'
  revised_footnotes:
