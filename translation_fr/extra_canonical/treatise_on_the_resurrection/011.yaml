translation:
  language: fr
  text: 'C’est grâce à la bonté de mon […] Seigneur Jésus-Christ que j’ai reçu tout cela. Je vous ai instruits de ces choses, vous et vos frères et sœurs, mes enfants, sans rien négliger de ce qui pouvait vous fortifier. Toutefois, si j’ai écrit quelque chose d’obscur dans mon explication de la parole, je vous l’expliquerai si vous me le demandez.


    Pour le moment, cependant, ne vous préoccupez pas de communiquer ceci à quelqu’un parmi vous, car cela peut être utile.[a]


    Beaucoup examinent les questions au sujet desquelles je vous ai écrit. À ceux-là, je dis : Que la paix et la grâce soient avec eux.


    Je vous salue, vous et ceux qui vous aiment d’un amour fraternel.


    Traité sur la résurrection'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation de cette phrase est incertaine dans le témoin disponible : elle peut sembler demander de ne pas diffuser le texte tout en affirmant qu’il peut être utile.'
    reason: Préserver une tension réelle du témoin anglais provisoire sans la résoudre par conjecture avant vérification directe du copte.
lexical_decisions:
- source_word: graciousness
  choice: bonté
  rationale: Rend naturellement l’idée de disposition bienveillante ou de faveur, sans imposer ici le vocabulaire théologique plus technique de « grâce », qui figure distinctement plus loin.
- source_word: the word
  choice: la parole
  rationale: Conserve la portée potentiellement technique ou théologique de l’expression, plutôt que de la réduire à « mon propos » ou « mon enseignement ».
- source_word: brothers and sisters
  choice: frères et sœurs
  rationale: Exprime explicitement la communauté mixte suggérée par le témoin anglais tout en gardant le langage familial.
- source_word: love of brothers and sisters
  choice: amour fraternel
  rationale: Formulation française courante et digne qui désigne l’affection entre membres d’une même communauté, sans limiter le référent aux hommes.
- source_word: Treatise on the Resurrection
  choice: Traité sur la résurrection
  rationale: Titre français direct, naturel et conforme au genre du document.
theological_decisions:
- issue: Rapport entre la bonté du Seigneur et la réception de l’enseignement
  choice: « grâce à la bonté de mon […] Seigneur Jésus-Christ »
  alternative: « de la grâce de mon […] Seigneur Jésus-Christ »
  rationale: Préserve l’affirmation que l’auteur tient son enseignement du Seigneur, tout en évitant d’identifier automatiquement le terme à une doctrine technique de la grâce sur la seule base du témoin anglais.
- issue: Sens de « la parole »
  choice: Conserver « la parole »
  alternative: « le message » ou « mon exposé »
  rationale: L’expression peut désigner le discours, le message ou une réalité théologiquement chargée; la traduction conserve cette ouverture.
- issue: Paix et grâce dans la salutation
  choice: « Que la paix et la grâce soient avec eux »
  alternative: « Paix à eux, et grâce »
  rationale: Donne une phrase idiomatique en français sans préciser davantage la source ou la nature de cette paix et de cette grâce.
translation_notes:
  register: Français international moderne, clair et digne, avec une tonalité épistolaire. Les crochets dans « mon […] Seigneur » signalent une lacune ou une restauration incertaine du manuscrit. Le texte reste provisoire, car la rédaction repose sur un témoin anglais du domaine public et la vérification directe du copte est encore à faire. Les éléments modernes de site web, de contact et de publicité placés après le titre ont été exclus comme paratexte éditorial.
