    text: 'La formulation de cette phrase est incertaine dans le témoin disponible : elle peut sembler demander de ne pas diffuser le texte tout en affirmant qu’il peut être utile.'
    reason: Préserver une tension réelle du témoin anglais provisoire sans la résoudre par conjecture avant vérification directe du copte.
  revision_rationale: 'La révision est limitée aux corrections sûres : maintien des marqueurs de lacune et de restitution, amélioration légère de l’idiome français et restitution plus proche de la formule finale de paix et de grâce. Elle ne tranche ni l’ambiguïté de l’injonction concernant la communication du texte ni la portée théologique de « la parole ».'
