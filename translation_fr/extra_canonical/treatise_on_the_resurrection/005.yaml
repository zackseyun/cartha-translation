review_pass:
  verdict: revise
  source_fidelity: La traduction suit fidèlement le témoin anglais fourni, y compris son insistance sur l’impossibilité d’une auto-résurrection et la formulation prédicative inhabituelle au sujet de l’« anéantissement de la mort ». Une légère révision rend explicitement le mouvement « de la mort à la vie » contenu dans la parenthèse du témoin, sans interprétation supplémentaire. La restauration signalée par <great> doit demeurer explicitement ancrée dans le texte français.
  naturalness: Le registre est moderne, soutenu et naturel. « Afin qu’ils ressuscitent au moins » est plus fluide que « afin qu’au moins ils ressuscitent ». « Se ramener lui-même de la mort à la vie, par lui-même » conserve volontairement la répétition emphatique du témoin tout en étant plus intelligible en français.
  terminology: « Relève de la foi », « Fils de l’homme » et « anéantissement de la mort » sont des choix adéquats. « Argumentation » conserve le terme conceptuel du témoin. Le nom « foi » pour belief et le verbe « croire » pour believe constituent une adaptation idiomatique française justifiée.
  issues:
  - severity: low
    issue: La parenthèse « to life from death » n’est pas pleinement rendue.
    rationale: « Se ramène lui-même à la vie » exprime le retour à la vie, mais ne mentionne pas explicitement le passage depuis la mort que le témoin isole entre parenthèses.
  - severity: low
    issue: La restauration éditoriale de l’adjectif final n’est pas visuellement repérable dans le corps du texte.
    rationale: Le témoin anglais place <great> entre chevrons. Un appel de note immédiatement après « grands » permet de conserver cette incertitude sans importer artificiellement les chevrons anglais dans la prose française.
  revised_text: 'Cependant, si certains ne croient pas, c’est parce qu’ils ne peuvent pas être convaincus. Car, mon fils, que les morts ressuscitent relève de la foi, et non de l’argumentation.


    Parmi les philosophes de ce monde, certains croient, afin qu’ils ressuscitent au moins. Que le philosophe qui est dans ce monde ne s’estime pas fondé à croire qu’il se ramène lui-même de la mort à la vie, par lui-même. Car, en raison de notre foi, nous connaissons le Fils de l’homme et nous croyons qu’il est ressuscité d’entre les morts, lui dont nous déclarons : « Il est devenu l’anéantissement de la mort. » Car grande est la foi, et grands[a] sont ceux qui croient.'
  revised_footnotes:
  - marker: a
    text: L’adjectif « grands » correspond à un mot donné comme rétabli (<great>) dans le témoin anglais fourni. La lecture directe du copte reste à vérifier.
    reason: Préserve et localise l’incertitude éditoriale signalée par le témoin, sans prétendre confirmer la restauration à partir du copte.
  revision_rationale: 'La révision est limitée à deux points : elle restitue explicitement « de la mort à la vie » et place l’ancre de note sur l’adjectif français correspondant au mot restauré dans le témoin. Elle conserve les ambiguïtés et la rhétorique du passage, sans tirer de conclusion doctrinale ni attribuer à la source copte une vérification qui n’a pas encore eu lieu.'
