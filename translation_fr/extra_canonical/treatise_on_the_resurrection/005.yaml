  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: fr
  text: 'Cependant, si certains ne croient pas, c’est parce qu’ils ne peuvent pas être convaincus. Car, mon fils, que les morts ressuscitent relève de la foi, et non de l’argumentation.


    Parmi les philosophes de ce monde, certains croient, afin qu’au moins ils ressuscitent. Que le philosophe qui est dans ce monde ne s’estime donc pas fondé à croire qu’il se ramène lui-même à la vie, par ses propres moyens. Car, en raison de notre foi, nous connaissons le Fils de l’homme et nous croyons qu’il est ressuscité d’entre les morts, lui dont nous déclarons : « Il est devenu l’anéantissement de la mort. » Car grande est la foi, et grands sont ceux qui croient.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le second « grands » traduit un mot rétabli par les éditeurs dans le témoin anglais; la lecture du copte reste à vérifier.
    reason: Le témoin signale explicitement la restauration par des chevrons autour de « great »; la note conserve cette incertitude textuelle sans alourdir le corps du texte.
lexical_decisions:
- source_word: pertains to faith
  choice: relève de la foi
  rationale: Expression française naturelle qui conserve l’opposition entre la foi et l’argumentation.
- source_word: argumentation
  choice: argumentation
  rationale: Maintient le terme conceptuel du témoin sans le réduire à la simple preuve ni l’élargir à toute forme de raison.
- source_word: returns himself (to life from death) by himself
  choice: se ramène lui-même à la vie, par ses propres moyens
  rationale: Rend explicitement les deux valeurs réfléchies signalées par le témoin tout en produisant une phrase française intelligible.
- source_word: Son of Man
  choice: Fils de l’homme
  rationale: Titre traditionnel et reconnaissable, sans interprétation christologique ajoutée.
- source_word: obliteration of death
  choice: anéantissement de la mort
  rationale: Préserve la force du substantif abstrait plutôt que de paraphraser par « celui qui a détruit la mort ».
- source_word: belief / believe
  choice: foi / croire
  rationale: Le français exige une variation idiomatique entre le nom et le verbe; « foi » convient au contexte religieux, tandis que « croire » conserve la formulation personnelle.
theological_decisions:
- issue: Rapport entre résurrection et foi
  choice: « relève de la foi, et non de l’argumentation »
  alternative: « est une question de foi, non de démonstration »
  rationale: La formulation retenue préserve la tension du texte sans affirmer que la résurrection serait irrationnelle ou impossible à défendre.
- issue: Capacité du philosophe à revenir à la vie
  choice: « qu’il se ramène lui-même à la vie, par ses propres moyens »
  alternative: « qu’il revient de lui-même à la vie »
  rationale: La répétition réfléchie du témoin semble insister sur l’absence d’auto-résurrection; cette nuance est conservée sans préciser qui opère la résurrection.
- issue: Formule sur le Christ et la mort
  choice: « Il est devenu l’anéantissement de la mort »
  alternative: « Il a anéanti la mort »
  rationale: La construction prédicative inhabituelle est maintenue, car la paraphrase alternative résoudrait la métaphore et modifierait son aspect.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour d’adresse « mon fils » et les répétitions rhétoriques sont conservés. Cette version demeure provisoire, car elle repose sur un témoin anglais du domaine public; une vérification directe du manuscrit copte est encore nécessaire.
