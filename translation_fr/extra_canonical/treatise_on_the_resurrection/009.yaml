base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: fr
  text: 'Mais que suis-je en train de vous dire ? Ceux qui sont vivants mourront-ils ? Comment peuvent-ils vivre dans une illusion ? Les riches sont devenus pauvres, et les rois ont été renversés. Tout est soumis au changement. Le monde est une illusion, si toutefois je n’exagère pas la situation.


    La résurrection, en revanche, n’a pas cette nature illusoire et passagère, car elle est la réalité qui demeure ferme. Elle est la révélation de ce qui existe, et même la transfiguration des choses et leur transformation en ce qui est nouveau. Car l’incorruptibilité [a] [descendra] sur ce qui est corruptible. La lumière se répandra sur les ténèbres et les engloutira. Alors la Plénitude comblera le Manque. Ce sont là des symboles et des images de la résurrection. C’est ainsi que se réalise ce qui est bon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin présente ici une lacune ou un passage endommagé avant la restitution éditoriale « descendra ».
    reason: Signaler à la fois l’état lacunaire du texte et le caractère restitué du verbe, dont les crochets sont conservés dans le corps du texte.
lexical_decisions:
- source_word: illusion
  choice: illusion
  rationale: Conserve le terme central du témoin tout en maintenant le contraste entre le monde changeant et la réalité ferme de la résurrection.
- source_word: imperishability
  choice: incorruptibilité
  rationale: Terme français théologique courant qui exprime l’état de ce qui n’est pas sujet à la corruption ou à la destruction.
- source_word: perishable
  choice: ce qui est corruptible
  rationale: Maintient l’opposition lexicale directe avec « incorruptibilité » sans préciser indûment le référent.
- source_word: Fullness
  choice: Plénitude
  rationale: La majuscule conserve la portée conceptuelle ou hypostasiée possible du terme dans le contexte du traité.
- source_word: Deficiency
  choice: Manque
  rationale: « Manque » est naturel et intelligible, tout en conservant l’opposition conceptuelle avec la « Plénitude ».
- source_word: swallowing it up
  choice: les engloutira
  rationale: Conserve l’image forte de la lumière absorbant ou abolissant les ténèbres.
theological_decisions:
- issue: Nature de la résurrection
  choice: « la réalité qui demeure ferme »
  alternative: « la vérité qui subsiste »
  rationale: « Réalité » suit le témoin fourni et évite de réduire l’énoncé à une simple proposition vraie.
- issue: Rapport entre résurrection et transformation
  choice: « la transfiguration des choses et leur transformation en ce qui est nouveau »
  alternative: « la transfiguration des réalités et un passage à la nouveauté »
  rationale: Préserve les deux notions distinctes, transfiguration et transformation, sans expliquer leur mécanisme.
- issue: Plénitude et Manque
  choice: Majuscules conceptuelles
  alternative: Minuscules descriptives
  rationale: Les majuscules signalent leur possible statut technique dans le traité sans imposer une identification doctrinale précise.
- issue: Phrase finale
  choice: « C’est ainsi que se réalise ce qui est bon »
  alternative: « Cela produit ce qui est bon »
  rationale: Rend naturellement une formule anglaise difficile tout en conservant l’idée d’un accomplissement du bien, sans préciser davantage sa causalité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe rhétorique du début est conservée. Les termes conceptuels « Plénitude » et « Manque » restent transparents sans ajout d’explication doctrinale. Traduction provisoire fondée sur le témoin anglais public fourni, la vérification directe du copte restant à effectuer.
