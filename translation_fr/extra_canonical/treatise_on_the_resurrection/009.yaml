review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le témoin anglais fourni, sous réserve que la vérification directe du copte est annoncée comme en attente. Une correction est nécessaire pour préserver exactement le signal de lacune : le témoin porte « [] [will descend] », non une lettre entre crochets. « Descendra sur les ténèbres » rend aussi plus directement le mouvement exprimé par « will flow down upon darkness ».'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Emplira le Manque » conserve plus nettement le parallélisme imagé et conceptuel de « the Fullness will fill the Deficiency ». « Cela conduit à ce qui est bon » est une conclusion française sobre qui n’explicite pas indûment le lien causal.
  terminology: « Incorruptibilité / corruptible », « Plénitude » et « Manque » sont des choix recevables et cohérents. Les majuscules aux deux derniers termes préservent leur possible valeur technique sans les interpréter. Les crochets de la lacune et de la restitution doivent rester visibles; l’appel de note est placé après le segment restitué, plutôt que de transformer la lacune en « [a] ».
  issues:
  - severity: medium
    issue: Signal de lacune altéré par « [a] »
    rationale: Le témoin anglais distingue une lacune vide « [] » et une restitution éditoriale « [will descend] ». La lettre « a » insérée dans les crochets ne correspond pas au témoin et rend ambigu le statut textuel de l’appel de note.
  - severity: low
    issue: « se répandra sur les ténèbres » atténue le mouvement descendant
    rationale: « Will flow down upon » comporte l’idée de descendre sur; « descendra sur » la conserve plus explicitement.
  - severity: low
    issue: « comblera le Manque » et « C’est ainsi que se réalise » interprètent légèrement la formulation finale
    rationale: « Emplira » et « Cela conduit à ce qui est bon » suivent plus étroitement les images et la portée causale non spécifiée du témoin.
  revised_text: 'Mais que suis-je en train de vous dire ? Ceux qui sont vivants mourront-ils ? Comment peuvent-ils vivre dans une illusion ? Les riches sont devenus pauvres, et les rois ont été renversés. Tout est soumis au changement. Le monde est une illusion, si vraiment je n’exagère pas la situation.


    La résurrection, en revanche, n’a pas cette nature (illusoire, passagère), car elle est la réalité qui demeure ferme. Elle est la révélation de ce qui existe, voire la transfiguration des choses et leur transformation en ce qui est nouveau. Car l’incorruptibilité [] [descendra] sur ce qui est corruptible.a La lumière descendra sur les ténèbres et les engloutira. Alors la Plénitude emplira le Manque. Ce sont là des symboles et des images de la résurrection. Cela conduit à ce qui est bon.'
  revised_footnotes:
  - marker: a
    text: Le témoin présente ici une lacune (« [] »), suivie d’une restitution éditoriale du verbe « [descendra] ».
    reason: Signaler l’état lacunaire du texte et le caractère restitué du verbe, sans introduire de contenu dans la lacune.
  revision_rationale: La révision rétablit le double marquage textuel du témoin — lacune vide puis restitution entre crochets — et ancre la note hors des crochets. Elle effectue également quelques ajustements prudents de littéralité et de style, sans résoudre les ambiguïtés conceptuelles du passage ni ajouter d’interprétation doctrinale.
