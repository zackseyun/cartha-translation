review_pass:
  verdict: revise
  source_fidelity: 'Le texte français suit fidèlement le témoin anglais fourni, y compris les temps accomplis de la citation apostolique, les métaphores du vêtement et des rayons, ainsi que la lacune signalée. La vérification directe du copte demeure toutefois en attente : l’évaluation de fidélité à la langue ancienne est donc nécessairement provisoire.'
  naturalness: 'La formulation est globalement naturelle et de registre soutenu moderne. Deux ajustements améliorent la netteté idiomatique : « déclaré » convient mieux que « effectivement dit », et l’analogie du soleil gagne à expliciter le passif sous-entendu (« comme les rayons le sont par le soleil »).'
  terminology: « Revêtons », « rayons éclatants », « coucher », « résurrection spirituelle », « âme » et « chair » préservent les images et les termes du témoin sans les interpréter doctrinalement. « Ciel » est maintenu pour heaven.
  issues:
  - severity: low
    issue: « l’apôtre l’a effectivement dit » est peu idiomatique en français contemporain.
    rationale: « Comme l’apôtre l’a déclaré » conserve l’insistance assertive de « in fact said » dans une tournure plus naturelle.
  - severity: low
    issue: « comme les rayons par le soleil » laisse elliptiques le rapport passif et l’analogie syntaxique.
    rationale: « comme les rayons le sont par le soleil » rend explicitement l’idée des rayons attirés par le soleil, sans modifier l’image ni prétendre résoudre son caractère littéraire.
  revised_text: 'Puis, comme l’apôtre l’a déclaré : « Nous avons souffert avec lui, nous sommes ressuscités avec lui et nous sommes montés au ciel avec lui. » Or, si nous vivons de manière visible dans ce monde, nous revêtons ce monde. Nous sommes ses rayons éclatants et nous demeurons avec lui jusqu’à notre coucher, c’est-à-dire jusqu’à notre mort dans cette vie. Par lui, nous sommes attirés vers le ciel, comme les rayons le sont par le soleil, sans que rien nous retienne. Telle est la résurrection spirituelle, [a] engloutissant l’âme tout comme elle engloutit la chair.'
  revised_footnotes:
