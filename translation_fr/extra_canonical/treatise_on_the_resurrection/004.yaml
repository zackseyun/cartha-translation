base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: fr
  text: 'Puis, comme l’apôtre l’a effectivement dit : « Nous avons souffert avec lui, nous sommes ressuscités avec lui et nous sommes montés au ciel avec lui. » Or, si nous vivons de manière visible dans ce monde, nous revêtons ce monde. Nous sommes ses rayons éclatants et nous demeurons avec lui jusqu’à notre coucher, c’est-à-dire jusqu’à notre mort dans cette vie. Par lui, nous sommes attirés vers le ciel, comme les rayons par le soleil, sans que rien nous retienne. Telle est la résurrection spirituelle, [a] engloutissant l’âme tout comme elle engloutit la chair.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le manuscrit présente ici une lacune ou un passage non restitué; sa longueur et son contenu sont incertains.
    reason: Le témoin fourni signale cet endroit par des crochets vides.
lexical_decisions:
- source_word: we wear this world
  choice: nous revêtons ce monde
  rationale: Conserve la métaphore vestimentaire du témoin anglais, plutôt que de l’aplanir en « appartenons à ce monde ».
- source_word: radiant beams
  choice: rayons éclatants
  rationale: Rend naturellement l’image lumineuse et maintient le lien avec le soleil dans la phrase suivante.
- source_word: until our setting
  choice: jusqu’à notre coucher
  rationale: Préserve la métaphore solaire, immédiatement explicitée dans le texte comme la mort dans cette vie.
- source_word: drawn to heaven
  choice: attirés vers le ciel
  rationale: Maintient le mouvement passif vers le ciel ainsi que l’analogie des rayons et du soleil.
- source_word: swallowing up
  choice: engloutissant
  rationale: Conserve la force et l’étrangeté de l’image sans en imposer une interprétation doctrinale.
theological_decisions:
- issue: La résurrection spirituelle et son rapport à l’âme et à la chair
  choice: Conserver « engloutissant l’âme tout comme elle engloutit la chair »
  alternative: Interpréter comme une transformation, un salut ou une destruction de l’âme et de la chair
  rationale: Le passage demeure théologiquement et syntaxiquement tendu; la traduction ne tranche pas la nature de cet « engloutissement ».
- issue: Participation aux souffrances, à la résurrection et à l’ascension du Christ
  choice: Employer trois formes composées parallèles avec « avec lui »
  alternative: Présenter ces actions comme futures ou purement symboliques
  rationale: Le témoin les formule comme des réalités accomplies et partagées; cette valeur est préservée sans explication confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. Les métaphores du vêtement, des rayons, du coucher solaire et de l’engloutissement sont conservées. Projet provisoire fondé sur le témoin anglais du domaine public; la vérification directe du copte reste à effectuer.
