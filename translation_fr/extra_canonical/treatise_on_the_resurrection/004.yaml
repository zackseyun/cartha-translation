    text: Le manuscrit présente ici une lacune ou un passage non restitué ; sa longueur et son contenu sont incertains.
    reason: Le témoin fourni signale cet endroit par des crochets vides.
  revision_rationale: Révision limitée à la fluidité française et à l’explicitation grammaticale de l’analogie des rayons et du soleil. La lacune, la syntaxe tendue qui la suit et l’ambiguïté théologique de « engloutissant » sont conservées. Aucun choix confessionnel n’est introduit.
