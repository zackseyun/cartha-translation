translation:
  language: fr
  text: 'Ne doute donc jamais de la résurrection, mon fils Rhéginos ! Car si, autrefois, tu ne vivais pas dans la chair, tu as revêtu la chair lorsque tu es entré dans ce monde.


    Pourquoi ne revêtirais-tu pas la chair lorsque tu retourneras et monteras dans l’éon[a] ? Ce qui est meilleur que la chair, c’est ce qui donne la vie. Ce qui est venu à l’existence pour toi ne t’appartient-il pas ? Et ce qui t’appartient n’existe-t-il pas avec toi ? Pourtant, tant que tu es dans ce monde, que te manque-t-il ? Voilà ce que tu t’efforces tant de découvrir.


    L’arrière-faix du corps, c’est la vieillesse[b], et tu es soumis à la condition mortelle. Ce qui te manque est un gain, car, si tu pars, tu ne perdras pas ce qu’il y a de meilleur. Ce qui est inférieur dépérit, mais il y a une grâce pour cela[c].


    Ainsi, rien ne peut nous racheter de ce monde[d]. Nous, cependant, nous sommes le Tout[e] ; nous sommes donc sauvés. Nous avons reçu le salut du commencement à la fin. Pensons ainsi. Comprenons ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Éon » peut désigner un âge, une réalité éternelle ou un domaine supramondain. Le terme technique est conservé en raison de l’incertitude du contexte.
    reason: Préserver l’ambiguïté cosmologique du terme transmis par le témoin anglais.
  - marker: b
    text: 'L’expression « l’arrière-faix du corps » est une image inhabituelle : elle présente ici la vieillesse comme ce qui vient après le corps ou comme son produit tardif.'
    reason: Éclairer une métaphore difficile sans lui substituer une interprétation unique.
  - marker: c
    text: Le pronom traduit par « cela » peut se rapporter à ce qui est inférieur, à son dépérissement ou, plus largement, à la condition corporelle.
    reason: Signaler l’incertitude du référent.
  - marker: d
    text: 'On pourrait aussi comprendre : « rien dans ce monde ne peut nous racheter ». Le témoin disponible permet difficilement de trancher avant vérification directe du copte.'
    reason: Faire apparaître une variante de compréhension qui modifie la portée de l’affirmation.
  - marker: e
    text: '« Le Tout » est un terme cosmologique ou métaphysique ; le texte affirme ici : « nous sommes le Tout », et non simplement que nous lui appartenons.'
    reason: Préserver la force et la tension théologique de la formulation.
lexical_decisions:
- source_word: flesh
  choice: chair
  rationale: « Chair » conserve la distinction conceptuelle du témoin entre la chair, le corps et ce qui leur est supérieur, sans la réduire au seul organisme physique.
- source_word: take on flesh
  choice: revêtir la chair
  rationale: Cette formulation naturelle et digne préserve l’idée d’assumer la chair plutôt que celle d’une simple acquisition matérielle.
- source_word: aeon
  choice: éon
  rationale: Le terme technique est conservé plutôt que ramené sans certitude à « éternité » ou « monde à venir » ; une note signale son amplitude possible.
- source_word: causes life
  choice: donne la vie
  rationale: « Donner la vie » exprime clairement la fonction vivifiante tout en évitant le tour français plus mécanique « cause la vie ».
- source_word: afterbirth
  choice: arrière-faix
  rationale: Le terme concret et métaphorique du témoin est maintenu, malgré son étrangeté, afin de ne pas effacer une image difficile du texte.
- source_word: the All
  choice: le Tout
  rationale: La majuscule marque un terme cosmologique ou métaphysique technique sans en imposer une interprétation doctrinale précise.
theological_decisions:
- issue: Nature de la résurrection et rapport à la chair
  choice: Conserver l’affirmation paradoxale d’un nouveau « revêtement » de la chair lors de l’ascension.
  alternative: Interpréter explicitement la résurrection comme purement spirituelle ou comme reprise littérale du même corps.
  rationale: Le passage associe résurrection, chair et réalité supérieure à la chair sans expliquer leur rapport ; la traduction maintient cette tension.
- issue: Sens de « ce qui te manque est un gain »
  choice: Traduire littéralement la formulation paradoxale.
  alternative: Expliciter le manque comme abandon du corps mortel ou comme acquisition spirituelle.
  rationale: Le référent exact du manque reste incertain dans le témoin ; l’explicitation trancherait indûment.
- issue: Affirmation « nous sommes le Tout »
  choice: Maintenir l’identification directe avec « le Tout ».
  alternative: Atténuer en « nous appartenons au Tout » ou « nous faisons partie du Tout ».
  rationale: L’identification porte une tension théologique réelle et ne doit pas être remplacée par une relation d’appartenance absente du témoin.
- issue: Logique de la rédemption hors de ce monde
  choice: Conserver « rien ne peut nous racheter de ce monde » malgré le contraste avec le salut affirmé ensuite.
  alternative: Reformuler « rien dans ce monde ne peut nous racheter » pour harmoniser la logique.
  rationale: La syntaxe du témoin peut produire un paradoxe intentionnel ou refléter une difficulté textuelle ; la traduction ne le résout pas silencieusement.
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. Les phrases exhortatives restent directes. Les termes techniques « éon » et « le Tout », ainsi que l’image étrange de l’« arrière-faix », sont conservés et annotés. Projet nécessairement provisoire : il repose sur le témoin anglais public fourni, la vérification directe du manuscrit copte étant annoncée comme encore en attente.'
