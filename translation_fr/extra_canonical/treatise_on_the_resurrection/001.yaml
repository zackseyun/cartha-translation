base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/001.yaml
  text: '[] My son Rheginos, some wish to learn many things. This is their objective when preoccupied with questions whose answers they lack. If they are successful with these, they tend to think of themselves as quite important. I, however, do not believe they have attained to the word of truth. Instead, they look out for their own satisfaction, when we have received (true satisfaction) through our Savior, our Lord Christ. [] We obtained it when we knew the truth and found our repose in it.


    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
translation:
  language: fr
  text: '[…] Mon fils Rhéginos, certains désirent apprendre beaucoup de choses. Tel est leur but lorsqu’ils se préoccupent de questions auxquelles ils n’ont pas de réponse. S’ils parviennent à les résoudre, ils ont tendance à se croire très importants. Pour ma part, cependant, je ne pense pas qu’ils soient parvenus à la parole de vérité. Ils recherchent plutôt leur propre satisfaction, alors que nous avons reçu la véritable satisfaction[a] par notre Sauveur, notre Seigneur Christ. […] Nous l’avons reçue lorsque nous avons connu la vérité et trouvé en elle notre repos.


    Cependant, puisque tu demandes avec courtoisie quelle est l’interprétation juste[b] de la résurrection, je t’écris ce qui est essentiel. Beaucoup, certes, n’y ajoutent aucune foi. Quelques-uns, cependant, la trouvent[c]. Examinons donc ce sujet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « véritable » explicite ici un élément présenté entre parenthèses dans le témoin anglais fourni.
    reason: Signaler honnêtement une précision éditoriale du témoin, la vérification directe du copte restant à effectuer.
  - marker: b
    text: Le témoin fourni présente « interprétation » comme une clarification éditoriale; le sens pourrait aussi être rendu par « quelle est la juste compréhension de la résurrection ».
    reason: Préserver l’incertitude signalée dans la base documentaire.
  - marker: c
    text: L’expression « la trouvent » est volontairement conservée. Elle peut évoquer le fait de découvrir ou d’atteindre la résurrection, sans que le témoin fourni permette de préciser davantage.
    reason: Ne pas résoudre silencieusement une expression théologiquement suggestive et ambiguë.
lexical_decisions:
- source_word: word of truth
  choice: parole de vérité
  rationale: Conserve l’expression conceptuelle du témoin sans la réduire à « vérité » ni préciser indûment s’il s’agit d’un enseignement, d’un message ou du Logos.
- source_word: repose
  choice: repos
  rationale: « Trouver en elle notre repos » garde la portée spirituelle du terme tout en restant naturel et digne en français.
- source_word: Savior, our Lord Christ
  choice: notre Sauveur, notre Seigneur Christ
  rationale: Respecte l’ordre et les titres du témoin, sans ajouter « Jésus », absent du texte fourni.
- source_word: put no faith in it
  choice: n’y ajoutent aucune foi
  rationale: Rend explicitement le registre de la foi plutôt qu’un simple refus intellectuel, tout en conservant le pronom dont l’antécédent demeure lié au propos sur la résurrection.
- source_word: find it
  choice: la trouvent
  rationale: Préserve la formulation brève et quelque peu énigmatique du témoin au lieu de l’interpréter comme « la comprennent » ou « y croient ».
theological_decisions:
- issue: Nature de la « parole de vérité »
  choice: Maintien de l’expression « parole de vérité »
  alternative: « véritable enseignement » ou « Logos de vérité »
  rationale: Le témoin ne permet pas de trancher entre message véridique, enseignement et éventuelle valeur hypostatique; la traduction conserve donc cette tension.
- issue: Rapport entre foi et découverte de la résurrection
  choice: « n’y ajoutent aucune foi » / « la trouvent »
  alternative: « n’y croient pas » / « la comprennent »
  rationale: La formulation choisie évite d’assimiler sans preuve le fait de « trouver » à une compréhension intellectuelle ou à une adhésion doctrinale précise.
- issue: Médiation du Sauveur
  choice: « par notre Sauveur »
  alternative: « grâce à notre Sauveur »
  rationale: « Par » conserve une médiation plus ouverte et n’explicite pas davantage son mode théologique.
translation_notes:
  register: Français international actuel, sobre et épistolaire, avec une dignité compatible avec un traité ancien. Les signes « […] » conservent les indications de lacune ou de restauration du témoin. Projet provisoire fondé sur le témoin anglais public fourni; une révision directe du copte du codex de Nag Hammadi I,4 reste nécessaire.
