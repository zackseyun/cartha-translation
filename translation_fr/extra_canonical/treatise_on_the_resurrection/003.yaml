id: TRES.003
reference: Treatise on the Resurrection — The Savior Swallowed Up Death
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  text: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: fr
  text: 'Je me rends compte que je donne [] la réponse dans un langage complexe. Pourtant, la parole de vérité n’a rien de difficile à comprendre. Mais la réponse est apparue afin que rien ne demeure caché, mais que tout ce qui concerne l’existence soit manifesté. Il en a résulté, d’une part, l’effacement du mal et, d’autre part, la révélation de ceux qui ont été choisis. Tout cela est l’émanation de la vérité et de l’esprit, la grâce venant de la vérité.


    Les gens ne pensent pas que tu ignores que le Sauveur a englouti la mort, puisqu’il a aboli le monde périssable. Il l’a transformé en un éon impérissable[a] et s’est relevé, engloutissant le visible au moyen de l’invisible et nous ouvrant ainsi la voie vers notre immortalité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un « éon » peut désigner un âge, une durée ou un ordre de réalité. Le terme est conservé ici pour ne pas réduire son sens possible.
    reason: Le terme conceptuel possède plusieurs valeurs dans la littérature ancienne et ne correspond pas exactement à un seul mot français courant.
lexical_decisions:
- source_word: word of truth
  choice: parole de vérité
  rationale: Expression française naturelle qui conserve la portée déclarative et théologique de « word » sans la réduire à une simple information.
- source_word: existence
  choice: existence
  rationale: Maintient le terme abstrait et sa portée générale, sans préciser un sens ontologique que le témoin ne tranche pas.
- source_word: obliteration
  choice: effacement
  rationale: Rend l’idée de suppression complète dans un français intelligible, tout en évitant une image excessivement matérielle.
- source_word: emanation
  choice: émanation
  rationale: Conserve le vocabulaire conceptuel propre au traité au lieu de l’interpréter comme simple effet ou création.
- source_word: swallowed up
  choice: englouti
  rationale: Préserve l’image forte et répétée de l’absorption de la mort puis du visible.
- source_word: dispensed with / did away with
  choice: a aboli
  rationale: Exprime la suppression du monde périssable sans ajouter de mécanisme théologique absent du témoin.
- source_word: aeon
  choice: éon
  rationale: Translittération française retenue afin de préserver l’ambiguïté entre âge, ordre cosmique et réalité durable.
- source_word: raised himself up
  choice: s’est relevé
  rationale: Conserve la forme réfléchie du témoin et son possible sens résurrectionnel sans l’expliciter davantage.
- source_word: paving the way
  choice: ouvrant ainsi la voie
  rationale: Formulation idiomatique française qui garde l’image d’un accès rendu possible.
theological_decisions:
- issue: Rapport entre le Sauveur et la résurrection
  choice: « s’est relevé »
  alternative: « s’est ressuscité » ou « a été relevé »
  rationale: Le témoin emploie une forme réfléchie; la traduction la conserve sans imposer ni une causalité doctrinale précise ni un passif absent.
- issue: Transformation du monde périssable
  choice: « Il l’a transformé en un éon impérissable »
  alternative: « Il est passé dans un âge impérissable »
  rationale: Le pronom objet restauré dans le témoin renvoie vraisemblablement au monde; la traduction maintient cette syntaxe tout en signalant par la note la difficulté d’« éon ».
- issue: Visible englouti par l’invisible
  choice: Conservation littérale de l’image
  alternative: Interprétation comme victoire du spirituel sur le matériel
  rationale: Le texte établit une tension cosmologique sans en donner ici une explication complète; aucune lecture doctrinale supplémentaire n’est importée.
- issue: Les choisis
  choice: « ceux qui ont été choisis »
  alternative: « les élus »
  rationale: La périphrase est claire en français courant et conserve l’idée d’une sélection sans charger le passage d’un vocabulaire confessionnel particulier.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe argumentative et les parallélismes sont conservés, mais légèrement fluidifiés. Les crochets vides [] sont maintenus pour signaler la lacune du manuscrit transmise par le témoin anglais. Projet provisoire fondé sur le témoin anglais du domaine public; révision directe du copte encore requise.
