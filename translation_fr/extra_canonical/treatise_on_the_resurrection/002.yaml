base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: fr
  text: Comment le Seigneur a-t-il prêché lorsqu’il vivait dans la chair, puis après s’être révélé comme Fils de Dieu ? Il a demeuré en ce lieu où vous demeurez, parlant de la loi des réalités naturelles, que, pour ma part, j’appelle « la mort ». Rhéginos, le Fils de Dieu était le Fils de l’homme. Il a assumé l’un et l’autre, possédant l’humanité et la divinité. Ainsi, d’une part, comme Fils de Dieu, il pouvait chasser la mort et, d’autre part, comme Fils de l’homme, il a apporté la restauration de la Plénitude.[a] Il en était ainsi parce que son origine était d’en haut, telle une semence de vérité, avant que sa structure inférieure[b] ne vienne à l’existence. Dans cette structure inférieure, de nombreuses puissances souveraines et divinités sont venues à l’existence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Plénitude » traduit ici un terme théologique ou cosmologique qui peut désigner la totalité accomplie; le sens précis devra être vérifié sur le texte copte.
    reason: Le terme semble technique et il importe de ne pas en imposer une interprétation confessionnelle ou systématique.
  - marker: b
    text: Le qualificatif « inférieure » est fourni entre parenthèses dans le témoin anglais consulté; sa présence et la portée exacte de « structure » devront être contrôlées sur le copte.
    reason: Le dossier indique qu’une révision directe de la langue source reste à faire; la note distingue donc le texte assuré de l’explicitation éditoriale.
lexical_decisions:
- source_word: lived in the flesh
  choice: vivait dans la chair
  rationale: Conserve le langage anthropologique et théologique concret du témoin sans le réduire à « vivait comme un être humain ».
- source_word: law of natural things
  choice: loi des réalités naturelles
  rationale: « Réalités naturelles » reste intelligible tout en préservant l’abstraction et l’ambiguïté de la formulation transmise.
- source_word: took both to himself
  choice: a assumé l’un et l’autre
  rationale: Rend l’idée d’une prise en soi de l’humanité et de la divinité, sans préciser davantage le rapport entre elles.
- source_word: Fullness
  choice: Plénitude
  rationale: La majuscule signale qu’il s’agit vraisemblablement d’un terme cosmologique ou théologique technique, sans imposer une définition doctrinale.
- source_word: dominions
  choice: puissances souveraines
  rationale: Exprime des autorités ou puissances dominantes sans les identifier à un ordre angélique précis.
theological_decisions:
- issue: Rapport entre « Fils de Dieu » et « Fils de l’homme »
  choice: « le Fils de Dieu était le Fils de l’homme »
  alternative: « le Fils de Dieu était aussi le Fils de l’homme »
  rationale: L’absence de « aussi » préserve la formulation abrupte du témoin et n’explicite pas artificiellement la relation entre les deux titres.
- issue: Humanité et divinité du Seigneur
  choice: « possédant l’humanité et la divinité »
  alternative: « étant humain et divin »
  rationale: La formulation nominale suit le témoin et évite de transformer ce passage en définition christologique plus systématique qu’il ne l’est.
- issue: Fonctions respectives des deux titres
  choice: 'Maintien du parallélisme : chasser la mort comme Fils de Dieu, restaurer la Plénitude comme Fils de l’homme'
  alternative: Fusionner les deux actions en une seule affirmation générale
  rationale: Le parallélisme et sa tension théologique appartiennent au texte transmis et ne doivent pas être harmonisés.
- issue: Structure « inférieure »
  choice: Conserver « inférieure » avec une note de prudence
  alternative: Omettre l’adjectif ou traduire par « corps »
  rationale: L’adjectif vient d’une explicitation éditoriale du témoin anglais; sa conservation provisoire est signalée plutôt que présentée comme assurée par le copte.
