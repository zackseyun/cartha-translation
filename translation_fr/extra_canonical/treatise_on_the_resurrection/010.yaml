  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing with others. Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
translation:
  language: fr
  text: 'Ainsi donc, ô Rhéginos, ne pense pas en vérités partielles et ne vis pas selon cette chair pour être d’accord avec les autres. Fuis plutôt les divisions et les servitudes, et tu feras dès maintenant l’expérience de la résurrection. Car si ce qui est mortel sait qu’il mourra, même après avoir passé de nombreuses années dans cette vie, il en arrive à ceci : pourquoi ne pas te considérer comme déjà ressuscité et parvenu au but[a] ?


    Si tu possèdes la résurrection, pourquoi continuer à agir comme si tu devais encore mourir ? Tu dois savoir que tu es déjà mort. Si tu l’ignores, c’est par manque d’entraînement[b]. Il convient à chacun de s’exercer de diverses manières ; alors ils seront libérés de cet élément[c], afin de ne pas tomber dans l’erreur, mais de recevoir de nouveau ce qui était dès le commencement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, selon le témoin anglais utilisé : « ressuscité et arrivé ». Le complément « au but » est implicite et demeure incertain en attendant l’examen direct du copte.'
    reason: Signaler une explicitation française nécessaire sans masquer l’incertitude textuelle.
  - marker: b
    text: Le terme rendu par « entraînement » peut évoquer une formation ou une discipline pratique ; la nature précise de cet exercice n’est pas indiquée ici.
    reason: Préserver l’ouverture du vocabulaire sans lui attribuer une pratique ascétique déterminée.
  - marker: c
    text: '« Cet élément » : expression volontairement conservée, dont le référent n’est pas précisé dans le témoin de travail.'
    reason: Maintenir une ambiguïté importante jusqu’à la révision sur le texte copte.
lexical_decisions:
- source_word: partial (truths)
  choice: vérités partielles
  rationale: Conserve la formulation inhabituelle et sa tension, sans préciser de quelles vérités il s’agit.
- source_word: bondages
  choice: servitudes
  rationale: Rend l’idée de conditions d’asservissement au pluriel, dans un registre digne et naturel.
- source_word: experience the resurrection now
  choice: faire dès maintenant l’expérience de la résurrection
  rationale: Préserve l’affirmation d’une expérience présente sans la réduire à une simple compréhension intellectuelle.
- source_word: having arrived
  choice: parvenu au but
  rationale: Produit un français intelligible tout en signalant en note que le complément « au but » est implicite.
- source_word: training / train
  choice: entraînement / s’exercer
  rationale: Maintient le lien lexical entre le manque de formation pratique et l’exercice requis, sans imposer une ascèse particulière.
- source_word: this element
  choice: cet élément
  rationale: Conserve l’expression ambiguë du témoin au lieu d’identifier arbitrairement son référent.
- source_word: what was from the beginning
  choice: ce qui était dès le commencement
  rationale: Préserve l’indétermination de l’objet reçu et la portée temporelle ou protologique de l’expression.
theological_decisions:
- issue: Résurrection présente
  choice: « tu feras dès maintenant l’expérience de la résurrection » et « déjà ressuscité »
  alternative: Interpréter ces expressions comme une simple anticipation symbolique de la résurrection future
  rationale: Le témoin affirme explicitement une possession ou une expérience actuelle ; la traduction conserve cette tension sans définir son rapport à une résurrection future.
- issue: Mort déjà accomplie
  choice: « tu es déjà mort »
  alternative: « tu es déjà mort au monde » ou « mort à la chair »
  rationale: Aucun complément explicatif n’apparaît dans le témoin fourni ; l’ajouter imposerait une lecture théologique.
- issue: Libération de « cet élément »
  choice: Maintien de la désignation indéterminée
  alternative: Identifier l’élément au corps, à la chair, au monde ou à un principe cosmique
  rationale: Le référent reste ambigu dans la base de rédaction et doit attendre l’examen direct du copte.
- issue: Retour à l’origine
  choice: « recevoir de nouveau ce qui était dès le commencement »
  alternative: Préciser qu’il s’agit d’un état, d’une nature, d’une connaissance ou d’un héritage originels
  rationale: La traduction garde l’objet implicite et évite d’importer un système doctrinal.
translation_notes:
  register: Français international moderne, sobre et dignifié. Le tutoiement est conservé dans l’adresse personnelle à Rhéginos, tandis que la dernière phrase suit le passage du singulier à une portée générale puis au pluriel présent dans le témoin. Projet provisoire fondé sur la traduction anglaise publique fournie ; une révision directe du copte du codex de Nag Hammadi I,4 reste nécessaire.
