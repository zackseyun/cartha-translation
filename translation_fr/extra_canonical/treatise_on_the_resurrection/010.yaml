review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit globalement le témoin anglais de travail et conserve justement les tensions importantes : expérience présente de la résurrection, mort déjà accomplie, « cet élément » indéterminé et objet non précisé « dès le commencement ». Toutefois, « parvenu au but » ajoute un complément absent du témoin (« having arrived ») et doit être retiré. « Même après avoir passé » inverse ou affaiblit la concession temporelle de « even though it passes many years ». Enfin, « Si tu l’ignores » transforme en conditionnelle l’assertion « You ignore this ».'
  naturalness: Le registre est sobre et adapté. « Ne pense pas en vérités partielles » est compréhensible mais peu idiomatique ; « ne pense pas en termes de vérités partielles » rend mieux l’expression inhabituelle sans la normaliser. « Te considérer comme ressuscité et comme étant parvenu » conserve l’ellipse volontaire du complément tout en restant lisible.
  terminology: « Rhéginos », « chair », « servitudes », « résurrection », « entraînement », « élément » et « dès le commencement » sont appropriés. Le lien entre « manque d’entraînement » et « s’exercer » est utilement maintenu. La note sur l’« élément » préserve correctement l’ambiguïté du témoin de travail.
  issues:
  - severity: medium
    issue: Ajout de « au but » après « parvenu »
    rationale: Le témoin dit seulement « having arrived » et ne précise aucun terme ni but. La note reconnaît l’ajout, mais une explicitation incertaine dans le texte principal ne doit pas remplacer l’ambiguïté source.
  - severity: medium
    issue: « même après avoir passé de nombreuses années »
    rationale: 'Le témoin exprime une concession : le mortel sait qu’il mourra, même s’il passe de nombreuses années dans cette vie. La formulation actuelle suggère plutôt une succession achevée (« après avoir passé »).'
  - severity: low
    issue: « Si tu l’ignores »
    rationale: 'Le témoin affirme directement : « You ignore this because of your lack of training. » Une conditionnelle ajoute une nuance non exprimée.'
  revised_text: 'Ainsi donc, ô Rhéginos, ne pense pas en termes de vérités partielles et ne vis pas selon cette chair pour être d’accord avec les autres. Fuis plutôt les divisions et les servitudes, et tu feras dès maintenant l’expérience de la résurrection. Car si ce qui est mortel sait qu’il mourra, même s’il passe de nombreuses années dans cette vie, il en arrive à ceci : pourquoi ne pas te considérer comme ressuscité et comme étant parvenu ?


    Si tu possèdes la résurrection, pourquoi continuer à agir comme si tu devais encore mourir ? Tu dois savoir que tu es déjà mort. Tu l’ignores à cause de ton manque d’entraînement[a]. Il convient à chacun de s’exercer de diverses manières ; alors ils seront libérés de cet élément[b], afin de ne pas tomber dans l’erreur, mais de recevoir de nouveau ce qui était dès le commencement.'
  revised_footnotes:
  - marker: a
    text: Le terme rendu par « entraînement » peut évoquer une formation ou une discipline pratique ; la nature précise de cet exercice n’est pas indiquée ici.
    reason: Préserver l’ouverture du vocabulaire sans lui attribuer une pratique ascétique déterminée.
  - marker: b
    text: '« Cet élément » : expression volontairement conservée, dont le référent n’est pas précisé dans le témoin de travail.'
    reason: Maintenir une ambiguïté importante jusqu’à la révision sur le texte copte.
  revision_rationale: La révision supprime l’explicitation non attestée « au but » et sa note, corrige la valeur concessive de la phrase sur les nombreuses années de vie, et restitue l’assertion directe concernant l’ignorance. Elle conserve les ambiguïtés du témoin anglais provisoire et les deux notes réellement nécessaires.
