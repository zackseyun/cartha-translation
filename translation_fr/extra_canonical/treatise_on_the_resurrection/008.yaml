lexical_decisions:
- source_word: discarding the body
  choice: lorsqu’il se dépouillera du corps
  rationale: Conserve l’image d’un corps déposé ou quitté sans expliciter davantage l’anthropologie du passage.
- source_word: continuing revelation
  choice: révélation continue
  rationale: Rend formellement une expression difficile et potentiellement technique, sans la réduire à une simple manifestation ponctuelle.
- source_word: illusion
  choice: illusion
  rationale: Préserve l’opposition répétée entre apparence irréelle et réalité, centrale dans le passage.
- source_word: has come to pass through
  choice: s’est accomplie par
  rationale: Exprime l’événement effectivement advenu et sa médiation par Jésus-Christ, sans préciser un mécanisme théologique absent du témoin.
- source_word: gospel
  choice: l’Évangile
  rationale: Le singulier désigne ici le récit évangélique connu de l’auteur plutôt qu’un titre de livre explicitement identifié.
theological_decisions:
- issue: Moment du salut après l’abandon du corps
  choice: le sera immédiatement
  alternative: est immédiatement sauvé
  rationale: Maintient la question temporelle du témoin et évite d’ajouter une doctrine détaillée de l’état post mortem.
- issue: Sort des membres visibles et vivants
  choice: Traduction littérale de la tension entre membres morts visibles et membres vivants en eux
  alternative: Interpréter les « membres » comme corps matériel et corps spirituel
  rationale: Le passage est lacunaire et obscur ; une explicitation doctrinale résoudrait indûment son ambiguïté.
- issue: Nature de la résurrection
  choice: une réalité, non une illusion
  alternative: une résurrection uniquement spirituelle ou uniquement corporelle
  rationale: Le texte affirme fortement sa réalité mais ne permet pas, dans cet extrait, d’en fixer plus précisément la modalité.
- issue: Médiation christologique
  choice: la résurrection qui s’est accomplie par notre Seigneur et Sauveur Jésus-Christ
  alternative: la résurrection de Jésus-Christ
  rationale: Conserve la syntaxe du témoin, qui peut viser une réalité de résurrection accomplie par le Christ plutôt que seulement sa propre résurrection.
