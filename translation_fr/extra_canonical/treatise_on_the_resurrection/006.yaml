base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: fr
  text: 'Ce qu’ont pensé ceux qui sont sauvés ne périra pas. L’intelligence de ceux qui ont connu [le salut] ne périra pas.[a] Nous avons donc été choisis pour le salut et la rédemption, car il avait été déterminé dès le commencement que nous ne tomberions pas dans la folie des ignorants, mais que nous entrerions dans la sagesse de ceux qui connaissent la vérité. La vérité qu’ils préservent ne peut pas se perdre et ne se perdra pas. Puissant est l’ordre de la Plénitude.[b] Faible est ce qui s’en est détaché et est devenu le monde.[c] Le Tout, cependant, est ce qui est préservé.[d] Il n’est pas venu à l’existence ; il existait déjà.[e]


    [a] Le texte transmis permet aussi de comprendre : « Ceux qui ont connu [le salut], leur intelligence ne périra pas. » Le mot « salut » est explicité dans le témoin de travail, mais sa présence dans le texte ancien reste à vérifier.

    [b] « Plénitude » traduit le terme désignant ici la totalité ou la plénitude divine ; « ordre » peut aussi être rendu par « système ».

    [c] On peut aussi traduire : « ce qui s’est séparé, devenant le monde ».

    [d] « Le Tout » désigne ici la totalité et conserve la formulation conceptuelle du passage.

    [e] Le témoin signale une lacune manuscrite entre « pas » et « venu à l’existence » ; une vérification directe du copte est nécessaire.'
