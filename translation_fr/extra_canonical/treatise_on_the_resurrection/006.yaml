lexical_decisions:
- source_word: mind
  choice: intelligence
  rationale: « Intelligence » rend ici la faculté de connaître et convient mieux au contexte sapientiel que « esprit », qui pourrait introduire une connotation ontologique non assurée.
- source_word: redemption
  choice: rédemption
  rationale: Terme théologique courant et distinct de « salut », maintenant le parallélisme du témoin.
- source_word: foolishness
  choice: folie
  rationale: Rend l’opposition conceptuelle avec la sagesse dans une langue naturelle et digne.
- source_word: system
  choice: ordre
  rationale: « Ordre » est plus idiomatique que « système » dans ce contexte cosmologique, tout en laissant l’autre possibilité en note.
- source_word: Fullness
  choice: Plénitude
  rationale: La majuscule signale l’emploi technique et cosmologique du terme sans l’expliquer doctrinalement.
- source_word: broke loose
  choice: s’en est détaché
  rationale: Préserve l’idée de séparation sans préciser indûment l’agent, la cause ou le mode de cette rupture.
- source_word: the All
  choice: le Tout
  rationale: Maintient le caractère technique de l’expression et sa distinction d’avec « la Plénitude ».
theological_decisions:
- issue: Nature de la prédétermination
  choice: « il avait été déterminé dès le commencement »
  alternative: « cela avait été prédestiné dès le commencement »
  rationale: La formulation impersonnelle préserve l’affirmation du texte sans identifier un agent ni importer une doctrine particulière de la prédestination.
- issue: Rapport entre la Plénitude, le monde et le Tout
  choice: Conserver les trois désignations distinctes
  alternative: Les harmoniser sous un seul terme cosmologique
  rationale: Le passage maintient une tension entre la Plénitude puissante, ce qui s’en détache pour devenir le monde, et le Tout préservé ; la traduction ne résout pas cette relation.
- issue: Connaître le salut
  choice: « connu [le salut] »
  alternative: « connu » sans complément
  rationale: Le complément est utile à la lecture mais demeure incertain ; les crochets et la note rendent cette incertitude visible.
