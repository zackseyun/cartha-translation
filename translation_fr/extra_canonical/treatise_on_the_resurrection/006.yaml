  naturalness: Le français est globalement clair, moderne et d’un registre convenablement sobre. La formulation déclarative « Le système de la Plénitude est fort » est plus naturelle que l’inversion « Puissant est l’ordre... », sans perdre le parallélisme du passage.
  terminology: « salut », « rédemption », « sagesse », « vérité », « Plénitude » et « le Tout » sont maintenus. La majuscule de « Plénitude » et de « Tout » conserve la distinction conceptuelle du témoin sans l’interpréter doctrinalement.
