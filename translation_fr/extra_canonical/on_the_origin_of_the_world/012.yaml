    issue: « la torpeur causée par les démons » résout une ambiguïté du témoin.
    rationale: L’anglais « the lethargy of the demons » peut indiquer une léthargie associée aux démons, leur léthargie, ou une léthargie relevant d’eux ; il ne dit pas explicitement qu’ils en sont la cause. La traduction doit conserver cette indétermination.
