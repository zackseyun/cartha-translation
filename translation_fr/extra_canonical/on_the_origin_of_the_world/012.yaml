translation:
  language: fr
  text: 'Ensuite, la Justice créa le Paradis. Il était beau et se trouvait au-delà de l’orbite de la lune et de celle du soleil, à l’intérieur du Pays des Délices, à l’est, parmi les pierres. Le désir demeure parmi les arbres beaux et délectables. Quant à l’arbre de la vie éternelle, il apparut, conformément à la volonté de Dieu, au nord du Paradis, afin que les âmes des saints deviennent immortelles — celles qui sortiront des formes façonnées, humbles, à l’accomplissement de l’âge.


    La couleur de l’arbre de vie ressemble au soleil, et ses branches sont belles. Ses feuilles ressemblent à celles du cyprès. Son fruit ressemble à une grappe de raisin blanc. Sa hauteur atteint le ciel. À côté de lui se trouve l’arbre de la connaissance, qui possède la puissance de Dieu. Son éclat ressemble à celui de la lune lorsqu’elle est pleinement lumineuse, et ses branches sont belles. Ses feuilles ressemblent à des feuilles de figuier. Son fruit ressemble à une datte bonne et délectable. Cet arbre se trouve au nord du Paradis, afin de tirer les âmes de la torpeur causée par les démons, pour qu’elles puissent s’approcher de l’arbre de vie, manger de son fruit et, de cette manière, dénoncer les Autorités et leurs anges.


    L’action de cet arbre est exposée en détail dans la sainte Écriture : « Tu es l’arbre de la connaissance qui se trouve dans le Paradis, celui dont le premier homme a mangé, qui lui a ouvert l’esprit ; alors il a aimé sa compagne et dénoncé [a] les autres formes étrangères, allant jusqu’à les mépriser. »


    Après cela, l’olivier poussa afin de consacrer les rois et les grands prêtres de justice qui devaient paraître dans les derniers jours. En effet, l’olivier apparut hors de la lumière du premier Adam pour fournir l’onction qu’ils devaient recevoir.'
