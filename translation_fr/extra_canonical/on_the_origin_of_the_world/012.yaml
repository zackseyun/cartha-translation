lexical_decisions:
- source_word: Justice
  choice: la Justice
  rationale: La personnification est conservée par la majuscule et l’article défini, sans identifier davantage cette figure.
- source_word: Paradise
  choice: le Paradis
  rationale: Terme religieux français courant, ici traité comme le nom du lieu décrit.
- source_word: Land of Delight
  choice: Pays des Délices
  rationale: Rend le nom propre et la notion de plaisir ou d’agrément sans l’aplatir en simple territoire agréable.
- source_word: satisfying
  choice: délectables
  rationale: Dans les descriptions des arbres et du fruit, ce choix exprime ce qui procure agrément et satisfaction tout en gardant un registre digne.
- source_word: lowly shaped forms
  choice: formes façonnées, humbles
  rationale: Conserve les deux éléments sémantiques difficiles du témoin anglais sans décider s’il s’agit de corps, d’images ou de créatures méprisées.
- source_word: knowledge
  choice: connaissance
  rationale: Équivalent traditionnel et non interprétatif pour le nom de l’arbre.
- source_word: authorities
  choice: Autorités
  rationale: La majuscule signale des puissances cosmiques personnifiées plutôt que de simples responsables humains.
- source_word: high priests
  choice: grands prêtres
  rationale: Expression française établie, plus naturelle ici que « souverains sacrificateurs ».
- source_word: anointing
  choice: onction
  rationale: Préserve le sens rituel et théologique lié à l’olivier et à la consécration.
theological_decisions:
- issue: Fonction salvatrice de l’arbre de la connaissance
  choice: Présenter l’arbre comme tirant les âmes de la torpeur et les conduisant vers l’arbre de vie
  alternative: Harmoniser le passage avec une lecture négative de l’arbre de la connaissance dans la Genèse
  rationale: Le texte attribue explicitement à cet arbre une action positive; cette tension théologique doit être conservée.
- issue: Identité des « Autorités »
  choice: Maintenir le titre générique « Autorités »
  alternative: Les identifier aux archontes ou à une catégorie doctrinale précise
  rationale: Le passage présente des puissances accompagnées de leurs anges, mais la traduction ne doit pas importer une systématisation extérieure.
- issue: Immortalité des âmes des saints
  choice: « deviennent immortelles »
  alternative: « soient sauvées » ou « reçoivent la vie éternelle »
  rationale: Le témoin parle directement de devenir sans mort; une reformulation sotériologique réduirait la précision et la tension du texte.
- issue: Le premier Adam et l’origine de l’olivier
  choice: Conserver littéralement l’apparition de l’olivier « hors de la lumière du premier Adam »
  alternative: Expliquer cette lumière comme substance, gloire ou émanation
  rationale: L’image demeure théologiquement ambiguë dans le témoin fourni et ne doit pas être résolue sans contrôle direct du copte.
translation_notes:
  register: Français international moderne, soutenu mais lisible. La syntaxe a été légèrement segmentée pour éviter la lourdeur du témoin anglais, tout en conservant ses répétitions descriptives et ses enchaînements théologiques. Projet provisoire fondé sur le témoin anglais public fourni; une révision directe du copte reste nécessaire.
