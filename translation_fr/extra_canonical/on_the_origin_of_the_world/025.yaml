  verdict: revise
  source_fidelity: 'Révision nécessaire. Le projet modifie deux lacunes explicites du témoin (« [] ») en y introduisant « [a] », et rend la restitution « [(as) one] » de manière incomplète. La révision conserve les lacunes et restaurations exactement comme des signaux textuels, sans les transformer en contenu. Quelques formulations sont aussi rapprochées du témoin : « fut trouvée », « furent enviés » et « censure ».'
  naturalness: Le français est globalement soutenu et naturel. Les retouches proposées améliorent la lisibilité sans résoudre artificiellement les passages endommagés ni préciser les relations cosmologiques ambiguës.
  terminology: « Éon », « archontes », « autorités », « perdition », « incorruptibilité », « Église », « races » et « Chaos » sont convenablement conservés. « Censure » est préférable à « condamnation » ici, car le témoin décrit une dénonciation/reproche plutôt qu’un jugement dont la portée serait fixée.
  issues:
  - severity: high
    issue: Les deux lacunes « [] » ont été altérées par l’insertion de « [a] ».
    rationale: Le témoin comporte une lacune vide après « [the Adam who] » et une autre après « blessed ». Les remplacer par une lettre de note simule un contenu absent et supprime le signal matériel de lacune.
  - severity: medium
    issue: La restitution « [(as) one] » est réduite à « [(un)] ».
    rationale: 'La composante « as/comme » fait partie de la restitution indiquée par le témoin. Il convient de conserver l’incertitude et l’expression complète : « [(comme) un] ».'
  - severity: low
    issue: « Ils suscitèrent leur jalousie » interprète davantage que « they were envied ».
    rationale: « Ils furent enviés » reproduit plus directement la voix passive et laisse l’identité des envieux implicite jusqu’à la phrase suivante.
  - severity: low
    issue: « Condamnant ainsi » renforce « as a censure ».
    rationale: « Comme une censure des archontes » conserve mieux l’image de reproche ou dénonciation sans imposer un sens judiciaire.
  revised_text: 'Nous allons maintenant examiner notre monde, afin d’achever avec précision la description de sa structure et de son gouvernement. Alors apparaîtra clairement comment fut trouvée la fidélité envers l’Éon invisible, elle qui s’est manifestée depuis la création jusqu’à l’accomplissement de l’âge.


    J’en viens donc aux thèmes principaux concernant l’homme immortel. Je parlerai des êtres qui lui appartiennent et montrerai comment ils sont ici.


    Lorsqu’une multitude d’humains fut venue à l’existence par la descendance de [l’Adam qui] [] avait été façonné, issu lui-même de la matière, et que le monde fut déjà entièrement peuplé, les archontes en étaient les maîtres ; c’est-à-dire qu’ils le maintenaient dans l’esclavage par l’ignorance. Pourquoi ? Voici la raison : le Père immortel sait qu’un manque de vérité est apparu parmi les Éons et dans leur univers. Lorsqu’il voulut réduire à néant les archontes de perdition au moyen des créatures qu’ils avaient façonnées, il envoya dans le monde de perdition vos ressemblances, c’est-à-dire les petits esprits bienheureux de l’innocence. La connaissance ne leur est pas étrangère, car toute connaissance réside en un seul ange qui leur est apparu. Celui-ci ne manque pas de pouvoir auprès du Père, afin qu’<il> leur donne la connaissance. Quand ils apparaissent dans le monde de perdition, ils révèlent aussitôt la structure de l’incorruptibilité, comme une censure des archontes et de leurs armées.


    Ainsi, lorsque les êtres bienheureux apparurent sous des formes façonnées par les autorités, ils furent enviés. Par jalousie, les autorités mêlèrent leur semence à la leur, dans l’intention de les souiller. Mais elles en furent incapables.


    Puis, lorsque les êtres bienheureux apparurent sous une forme lumineuse, ils apparurent selon plusieurs modes et provenaient de différents Éons, révélant leur connaissance à l’Église rendue visible par les formes façonnées de la perdition. On constata qu’elle contenait toute sorte de semence, parce que la semence des autorités avait été mêlée [à elle].


    Alors le Sauveur les créa tous [(comme) un], et leurs esprits sont manifestement supérieurs, étant bienheureux [] et choisis de diverses manières, ainsi que plusieurs autres êtres sans roi, supérieurs à tous ceux qui avaient existé avant eux.


    Il existe donc quatre races : trois appartiennent aux rois du huitième ciel, mais la quatrième race est sans roi, parfaite, et la plus élevée de toutes. Car ce sont eux qui entreront dans le Lieu saint de leur Père ; ils obtiendront le repos avec la quiétude, une gloire éternelle et inexprimable, ainsi qu’une joie infinie.


    De plus, ils sont rois dans le domaine de la mort, puisqu’ils sont immortels. Ils censureront les dieux du Chaos et leurs armées.'
