lexical_decisions:
- source_word: aeon
  choice: Éon / âge selon le contexte
  rationale: « Éon » désigne ici les réalités supracosmiques personnifiées, tandis que « âge » convient à l’expression temporelle « accomplissement de l’âge » ; cette distinction évite d’aplanir la polysémie.
- source_word: deathless
  choice: immortel
  rationale: Terme français naturel et digne, employé pour le Père, l’homme et les êtres qui ne connaissent pas la mort.
- source_word: archons
  choice: archontes
  rationale: Le terme technique est conservé, car « dirigeants » ou « puissances » effacerait son rôle cosmologique propre dans ce traité.
- source_word: authorities
  choice: autorités
  rationale: Permet de maintenir la distinction lexicale avec les « archontes », même si les groupes semblent se recouper.
- source_word: perdition
  choice: perdition
  rationale: Préserve le registre cosmologique et théologique du témoin sans préciser indûment s’il s’agit de destruction, de corruption ou de damnation.
- source_word: indestructibility
  choice: incorruptibilité
  rationale: Dans ce contexte cosmologique, « incorruptibilité » exprime mieux l’état opposé au monde matériel de corruption que le plus mécanique « indestructibilité ».
- source_word: church
  choice: Église
  rationale: Le féminin grammatical permet de conserver la reprise pronominale et le terme garde son sens d’assemblée manifestée, sans imposer une institution ultérieure.
- source_word: races
  choice: races
  rationale: Conserve la classification cosmologique du document ancien ; le mot désigne ici des catégories d’êtres, non les catégories raciales modernes.
- source_word: hosts
  choice: armées
  rationale: Rend naturellement l’idée de troupes ou puissances subordonnées associées aux archontes et aux dieux du Chaos.
theological_decisions:
- issue: Nature de la « fidélité envers l’Éon invisible »
  choice: Conserver « fidélité envers » sans identifier son sujet
  alternative: Traduire par « la foi en l’Éon invisible » ou « la fidélité de l’Éon invisible »
  rationale: Le témoin laisse ouverte la relation syntaxique et théologique ; la formulation retenue évite d’en faire explicitement une doctrine de foi ou un attribut de l’Éon.
- issue: Référent du pronom dans la transmission de la connaissance
  choice: Conserver la restauration <celui-ci> avec une note d’ambiguïté
  alternative: Identifier sans réserve le Père ou l’ange comme donateur
  rationale: Le texte transmis et sa restauration ne permettent pas de fixer sûrement le référent ; l’ambiguïté doit rester visible.
- issue: Les ressemblances envoyées dans le monde
  choice: Traduire littéralement « vos ressemblances »
  alternative: Interpréter comme « vos images », « vos semblables » ou « vos doubles célestes »
  rationale: Le passage peut décrire des images, des correspondants ou des formes apparentées ; aucune interprétation doctrinale unique n’est imposée.
- issue: Unification opérée par le Sauveur
  choice: Conserver le caractère restauré et incertain de « [(un)] »
  alternative: Écrire simplement « les unit tous »
  rationale: La formulation « fit tous comme un » repose sur un texte lacunaire ; une paraphrase ferme masquerait l’incertitude matérielle.
- issue: Statut de la quatrième race
  choice: « sans roi et parfaite »
  alternative: « autonome », « non gouvernée » ou « royale »
  rationale: La traduction garde le paradoxe du groupe sans roi dont les membres sont pourtant rois dans le domaine de la mort.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes cosmologiques spécialisés (« Éon », « archontes ») sont conservés pour éviter des équivalences doctrinalement réductrices. Les lacunes et restaurations du témoin anglais fondé sur le copte sont maintenues et expliquées ; une vérification directe du copte reste nécessaire.
