  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: fr
  text: 'Nous allons maintenant examiner notre monde, afin d’achever avec précision la description de sa structure et de son gouvernement. Alors apparaîtra clairement comment s’est manifestée la fidélité envers l’Éon invisible, depuis la création jusqu’à l’accomplissement de l’âge.


    J’en viens donc aux thèmes principaux concernant l’homme immortel. Je parlerai des êtres qui lui appartiennent et montrerai comment ils se trouvent ici.


    Lorsqu’une multitude d’humains fut venue à l’existence par la descendance de [l’Adam qui] [a] avait été façonné, jusque dans la matière, et que le monde fut déjà entièrement peuplé, les archontes en étaient les maîtres : ils le maintenaient dans l’esclavage par l’ignorance. Pourquoi ? Voici la raison : le Père immortel sait qu’un manque de vérité est apparu parmi les Éons et dans leur univers. Lorsqu’il voulut réduire à néant les archontes de perdition au moyen des créatures qu’ils avaient façonnées, il envoya dans le monde de perdition vos ressemblances, c’est-à-dire les petits esprits bienheureux de l’innocence. La connaissance ne leur est pas étrangère, car toute la connaissance réside en un seul ange qui leur est apparu. Celui-ci ne manque pas de pouvoir auprès du Père, afin que <celui-ci>[b] leur donne la connaissance. Quand ils apparaissent dans le monde de perdition, ils révèlent aussitôt l’ordre de l’incorruptibilité, condamnant ainsi les archontes et leurs armées.


    Ainsi, lorsque les êtres bienheureux apparurent sous des formes façonnées par les autorités, ils suscitèrent leur jalousie. Par jalousie, les autorités mêlèrent leur semence à la leur, dans l’intention de les souiller. Mais elles n’y parvinrent pas.


    Puis, lorsque les êtres bienheureux apparurent sous une forme lumineuse, ils se manifestèrent de plusieurs manières. Ils provenaient de différents Éons et révélaient leur connaissance à l’Église rendue visible par les formes façonnées de la perdition. Celle-ci contenait, constata-t-on, toute sorte de semence, parce que la semence des autorités avait été mêlée [à elle].[c]


    Alors le Sauveur les fit tous [(un)],[d] et leurs esprits sont manifestement supérieurs : ils sont bienheureux [a] et choisis de diverses manières. Il existe aussi plusieurs autres êtres sans roi, supérieurs à tous ceux qui avaient existé avant eux.


    Il existe donc quatre races. Trois appartiennent aux rois du huitième ciel, mais la quatrième race est sans roi et parfaite ; elle est la plus élevée de toutes. Ses membres entreront dans le Lieu saint de leur Père et obtiendront le repos et la quiétude, une gloire éternelle et inexprimable, ainsi qu’une joie infinie.


    De plus, ils sont rois au sein du domaine de la mort, puisqu’ils sont immortels. Ils condamneront les dieux du Chaos et leurs armées.'
