    Lorsque Pistis vit l’impiété de l’archonte suprême[a], elle entra dans une grande colère. Sans se rendre visible, elle dit : « Tu es dans l’erreur, Samaël » — c’est-à-dire « Dieu aveugle »[b]. « Il existe un homme immortel de lumière qui existait avant toi. Il se manifestera parmi les formes que tu as façonnées. Il te foulera aux pieds avec mépris, comme on foule un vase de potier, et tu seras précipité vers ta mère, l’Abîme, avec ceux qui t’appartiennent. Car lorsque toutes tes œuvres seront achevées, toute la déficience que la vérité aura mise au jour sera abolie. Elle cessera d’exister et sera comme si elle n’avait jamais existé. »


