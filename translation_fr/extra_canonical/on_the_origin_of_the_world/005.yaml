base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: fr
  text: 'Quand les cieux se furent établis, avec leurs armées et toute leur organisation, le Parent primordial devint arrogant. Toute l’armée des anges se prosterna devant lui, et tous les dieux et leurs anges lui offrirent louange et adoration. Il s’enorgueillit et ne cessa de se vanter devant eux : « Je me suffis à moi-même. »


    Il dit : « C’est moi qui suis Dieu, et en dehors de moi, rien d’autre n’existe. » En disant cela, il transgressa contre tous les êtres immortels doués de parole, et ceux-ci l’accusèrent à cause de cela.


    Lorsque Pistis vit l’impiété de l’archonte suprême[a], elle entra dans une grande colère. Sans se rendre visible, elle dit : « Tu es dans l’erreur, Samaël » — c’est-à-dire « Dieu aveugle »[b]. « Il existe un homme immortel de lumière qui était là avant toi. Il se manifestera parmi les formes que tu as façonnées. Il te foulera aux pieds avec mépris, comme on foule un vase de potier, et tu tomberas jusqu’auprès de ta mère, l’Abîme, avec ceux qui t’appartiennent. Car lorsque toutes tes œuvres seront achevées, toute la déficience que la vérité aura mise au jour sera abolie. Elle cessera d’exister et sera comme si elle n’avait jamais existé. »


    Après avoir dit cela, Pistis manifesta dans les eaux l’image de sa grandeur. Puis elle remonta et se retira dans sa lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un « archonte » est ici une puissance dirigeante du monde céleste inférieur; le terme grec signifie « chef » ou « gouvernant ».
    reason: Le terme technique est conservé dans le texte et brièvement expliqué pour les lecteurs modernes.
  - marker: b
    text: Le texte donne lui-même « Dieu aveugle » comme sens de « Samaël ». Cette explication interne est conservée sans trancher la question de l’étymologie historique du nom.
    reason: Évite de présenter comme certitude linguistique externe une interprétation fournie par l’œuvre elle-même.
lexical_decisions:
- source_word: Primal Parent
  choice: Parent primordial
  rationale: Conserve le titre cosmologique et son absence de genre grammatical explicite dans le témoin, autant que le permet le français.
- source_word: hosts
  choice: armées
  rationale: « Armées » restitue le sens de puissances célestes organisées; le contexte angélique évite une lecture purement militaire.
- source_word: government
  choice: organisation
  rationale: Terme naturel qui garde l’idée d’un ordre administratif ou d’une structure de gouvernement sans personnifier abusivement celle-ci.
- source_word: self-sufficient
  choice: Je me suffis à moi-même
  rationale: Expression française claire qui rend l’affirmation d’autosuffisance et l’arrogance du personnage.
- source_word: deathless ones who use verbal articulation
  choice: êtres immortels doués de parole
  rationale: Rend à la fois l’immortalité et la capacité de parole articulée, sans la formulation lourde « qui utilisent l’articulation verbale ».
- source_word: chief archon
  choice: archonte suprême
  rationale: Maintient le terme technique « archonte » tout en exprimant la primauté indiquée par « chief ».
- source_word: forms you have shaped
  choice: formes que tu as façonnées
  rationale: Préserve le champ lexical du façonnage, important pour l’image ultérieure du vase de potier.
- source_word: deficiency
  choice: déficience
  rationale: Conserve le terme cosmologique abstrait et sa possible portée technique plutôt que de le réduire à une simple faute morale.
- source_word: likeness of her greatness
  choice: l’image de sa grandeur
  rationale: « Image » exprime une manifestation ressemblante sans identifier pleinement l’apparition à Pistis elle-même.
theological_decisions:
- issue: Portée de la revendication divine du Parent primordial
  choice: « C’est moi qui suis Dieu, et en dehors de moi, rien d’autre n’existe »
  alternative: « Je suis Dieu, et il n’existe personne d’autre que moi »
  rationale: La formulation retenue préserve l’affirmation ontologique très large (« nothing else ») sans la limiter aux seuls êtres personnels.
- issue: Nature de l’homme de lumière
  choice: « un homme immortel de lumière »
  alternative: « l’Homme immortel de lumière »
  rationale: L’indéfini du témoin est conservé afin de ne pas imposer un titre technique ou une identification doctrinale absente des données fournies.
- issue: Moment de l’abolition de la déficience
  choice: « lorsque toutes tes œuvres seront achevées »
  alternative: « à l’achèvement de toutes tes œuvres »
  rationale: Cette lecture garde l’ambiguïté entre l’achèvement chronologique des œuvres et leur arrivée à terme, sans préciser qui les mène à leur accomplissement.
- issue: Condition invisible de Pistis
  choice: « Sans se rendre visible, elle dit »
  alternative: « Elle, l’invisible, dit »
  rationale: La formulation décrit son état dans la scène sans transformer nécessairement « invisible » en titre ontologique permanent.
- issue: Retour de Pistis dans sa lumière
  choice: « elle remonta et se retira dans sa lumière »
  alternative: « elle retourna en haut dans sa lumière »
  rationale: Conserve le mouvement ascendant et le retrait sans développer une cosmologie spatiale plus précise que le témoin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les titres et termes cosmologiques propres au traité sont préservés lorsqu’une simplification risquerait d’effacer sa pensée. Le projet reste provisoire, car le dossier fourni signale qu’une vérification directe du copte et des témoins apparentés est encore à effectuer.
