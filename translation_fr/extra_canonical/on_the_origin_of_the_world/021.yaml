  naturalness: Le français est généralement clair et d’un registre approprié. La correction proposée améliore certaines formulations sans lisser les étrangetés intentionnelles du récit, notamment l’adresse au singulier après la mention d’Adam et Ève.
  terminology: « archontes », « homme immortel », « homme véritable » et « la Bête » sont des choix appropriés. La note sur les archontes est sobre et non confessionnelle. Le crochet vide doit être maintenu et expliqué.
  issues:
  - severity: medium
    issue: Rendu de « would not ignore them »
    rationale: « Ne les laisserait pas de côté » peut suggérer qu’il ne les abandonnerait pas, tandis que le témoin dit qu’il ne les ignorerait pas.
  - severity: medium
    issue: Rendu de « reasoning will grow sober »
    rationale: « Retrouvera sa lucidité » présuppose que cette faculté possédait auparavant cette lucidité. Le témoin décrit plutôt un devenir sobre/lucide.
  - severity: medium
    issue: Rendu de « beautiful and satisfying, and she liked it »
    rationale: « Beau et désirable, et elle le désira » efface « satisfying » et crée une répétition absente du témoin. « Beau et agréable, et il lui plut » préserve mieux les deux notations.
  - severity: low
    issue: Accord référentiel de « l’être féminin qui s’était changée »
    rationale: Le noyau « être » est masculin ; une reformulation par « celle qui s’était changée » évite l’accord discordant tout en conservant le référent féminin.
  - severity: low
    issue: Mouvement vers les autorités
    rationale: Le témoin précise qu’ils se retirent « up to » leurs autorités. « Se retirèrent vers leurs autorités » rend au moins la direction, sans surinterpréter la hiérarchie.
