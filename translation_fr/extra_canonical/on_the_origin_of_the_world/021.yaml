lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Conserve le terme technique traditionnel de ce récit cosmologique plutôt que de le réduire à « chefs » ou « dirigeants ».
- source_word: deathless man
  choice: l’homme immortel
  rationale: Rend clairement l’absence de mort sans identifier cet être à une figure doctrinale particulière.
- source_word: real man
  choice: l’homme véritable
  rationale: Préserve l’opposition du passage entre l’être authentique et les êtres façonnés, sans l’expliquer davantage.
- source_word: Beast
  choice: la Bête
  rationale: La majuscule et l’appellation nominale rendent le fait que la créature est ici appelée par ce nom.
- source_word: your reasoning will grow sober
  choice: votre faculté de raisonner retrouvera sa lucidité
  rationale: Conserve la métaphore du retour à la sobriété tout en produisant une expression française intelligible.
- source_word: knowing the difference between evil and good humans
  choice: connaissant la différence entre les humains mauvais et les bons
  rationale: Suit la formulation inhabituelle du témoin fourni, qui qualifie les humains plutôt que de parler abstraitement du bien et du mal.
- source_word: acutely aware
  choice: pleinement conscients
  rationale: Exprime l’intensification finale de la conscience dans un français naturel et digne.
theological_decisions:
- issue: Identité de « l’homme véritable » et de « l’homme immortel »
  choice: Maintenir les désignations du récit sans les identifier explicitement.
  alternative: Les assimiler dans le texte ou dans une note à une figure théologique déterminée.
  rationale: Le passage laisse subsister une tension entre ces appellations; la traduction ne doit pas imposer une interprétation confessionnelle ou privée.
- issue: Portée de l’accusation de jalousie
  choice: Conserver le pronom « il » et l’accusation telle qu’elle apparaît dans le discours de la Bête.
  alternative: Identifier ou disculper explicitement Dieu, le démiurge ou un archonte.
  rationale: Il s’agit des paroles d’un personnage, et le référent ainsi que la valeur de son affirmation ne doivent pas être résolus silencieusement.
- issue: Effet du fruit
  choice: Conserver la présentation positive de l’éveil de l’intelligence et de la lumière de la connaissance.
  alternative: Réinterpréter cet éveil comme une chute, une tromperie ou une corruption.
  rationale: La logique propre à ce texte diffère de lectures théologiques ultérieures de la Genèse et doit être traduite sans harmonisation.
- issue: Formule sur la mort
  choice: « vous ne mourrez certainement pas »
  alternative: « de mort vous ne mourrez pas »
  rationale: La formulation retenue reproduit l’insistance de la négation dans un français naturel, sans faire de la tournure source une expression artificielle.
translation_notes:
  register: 'Français international moderne, courant mais soutenu, avec conservation des termes cosmologiques nécessaires. Cette version est provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte et des témoins apparentés restant à effectuer. Les répétitions et tensions du récit ont été maintenues lorsqu’elles participent à sa progression.'
