  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/021.yaml
  text: 'Allow me to say next that, once the archons had seen him and the female being who lived with him unknowingly going astray like beasts, they were extremely happy.


    When they learned that the deathless man would not ignore them, they became upset, because they would instead have to fear the female being who had turned herself into a tree. They said, “Perhaps this is the real man, this being who cast a mist over us and taught us that she who had been defiled resembles him. Then we will be defeated.”


    Then all seven devised schemes together. They nervously approached Adam and Eve and said to him, “You may eat the fruit of any of the trees created for you in Paradise. But concerning the tree of knowledge, restrain yourself and do not eat from it. If you eat, you will die.” After causing deep anxiety within them, they withdrew to their authorities.


    Then the cleverest of all creatures approached, the one called “Beast.” When he saw the likeness of their mother Eve, he said to her, “What did God say to you? Was it, ‘Do not eat from the tree of knowledge’?”


    She said, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    He said to her, “Do not be afraid. With death you will not die, because he knows that when you eat [] from it, your reasoning will become sober, and you will become like gods, knowing the difference between evil and good humans. In fact, he said this to you out of jealousy, to keep you from eating from it.”


    Eve now had confidence in the teacher’s words. She looked at the tree and recognized that it was beautiful and satisfying, and she desired it. She took some of its fruit and ate it. She also gave some to her husband, and he ate it as well. Then their minds were opened, because when they ate, the light of knowledge shone upon them. When they clothed themselves with embarrassment, they realized that they were naked without knowledge. When they became sober, they realized that they were naked, and they fell in love with each other. When they realized that those who had shaped them had the forms of beasts, they hated them. They had become acutely aware.'
translation:
  language: fr
  text: 'Permettez-moi maintenant de dire ceci : lorsque les archontes[a] virent l’homme et l’être féminin qui vivait avec lui s’égarer à leur insu comme des bêtes, ils furent transportés de joie.


    Mais quand ils apprirent que l’homme immortel ne les laisserait pas de côté, ils furent bouleversés, car c’était eux, au contraire, qui devraient craindre l’être féminin qui s’était changée en arbre. Ils dirent : « Peut-être est-ce là l’homme véritable, cet être qui a jeté un brouillard sur nous et nous a enseigné que celle qui avait été souillée lui ressemble. Alors, nous serons vaincus. »


    Tous les sept élaborèrent donc ensemble des stratagèmes. Ils s’approchèrent avec appréhension d’Adam et d’Ève et lui dirent : « Vous pouvez manger du fruit de tous les arbres créés pour vous dans le Paradis. Mais quant à l’arbre de la connaissance, retenez-vous et n’en mangez pas. Si vous en mangez, vous mourrez. » Après avoir fait naître en eux une profonde angoisse, ils se retirèrent auprès de leurs autorités.


    Alors s’approcha le plus rusé de tous les êtres vivants, celui qu’on appelle « la Bête ». Lorsqu’il vit l’image de leur mère Ève, il lui dit : « Que vous a dit Dieu ? A-t-il dit : “Ne mangez pas de l’arbre de la connaissance” ? »


    Elle répondit : « Il n’a pas seulement dit : “N’en mangez pas”, mais aussi : “N’y touchez pas, sinon vous mourrez.” »


    Il lui dit : « N’ayez pas peur : vous ne mourrez certainement pas. Car il sait que, lorsque vous en mangerez [b], votre faculté de raisonner retrouvera sa lucidité et vous deviendrez comme des dieux, connaissant la différence entre les humains mauvais et les bons. En réalité, c’est par jalousie qu’il vous a dit cela, pour vous empêcher d’en manger. »


    Ève eut alors confiance dans les paroles de celui qui l’instruisait. Elle regarda l’arbre et reconnut qu’il était beau et désirable, et elle le désira. Elle prit de son fruit et en mangea. Elle en donna aussi à son mari, et lui aussi en mangea. Alors leur intelligence s’ouvrit, car, lorsqu’ils eurent mangé, la lumière de la connaissance brilla sur eux. Lorsqu’ils se furent revêtus de honte, ils comprirent qu’ils étaient nus, dépourvus de connaissance. Quand ils retrouvèrent leur lucidité, ils comprirent qu’ils étaient nus et ils s’éprirent l’un de l’autre. Lorsqu’ils comprirent que ceux qui les avaient façonnés avaient des formes de bêtes, ils les prirent en haine. Ils étaient devenus pleinement conscients.'
