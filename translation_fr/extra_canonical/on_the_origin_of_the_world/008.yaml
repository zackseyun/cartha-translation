translation:
  language: fr
  text: 'Ainsi, lorsque le Père primordial du Chaos vit son fils Sabaoth et la gloire dans laquelle celui-ci demeurait, et qu’il comprit qu’il était le plus grand de toutes les autorités du Chaos, il devint jaloux de lui. Emporté par la fureur, il engendra la Mort à partir de sa propre mort. La Mort fut établie au-dessus du sixième ciel, parce que Sabaoth avait été élevé de ce lieu. C’est ainsi que fut complété le nombre des six autorités du Chaos.


    Puis la Mort, être androgyne, s’unit à sa propre nature et engendra sept enfants androgynes. Voici les noms des enfants mâles :


    Jalousie,

    Fureur,

    Larmes,

    Gémissement,

    Souffrance,

    Pleurs,

    Lamentation amère.


    Et voici les noms des enfants femelles :


    Fureur,

    Douleur,

    Désir,

    Gémissement,

    Malédiction,

    Amertume,

    Esprit de querelle.


    Ils s’unirent sexuellement les uns aux autres, et chacun engendra sept enfants, ce qui donna au total [a] quarante-neuf démons androgynes.


    Vous découvrirez leurs noms et leurs influences dans le Livre de Salomon.


    Face à eux, Zoé, qui demeurait avec Sabaoth, créa sept bonnes puissances androgynes. Voici les noms des mâles : Celui qui n’est pas jaloux, le Bienheureux, le Joyeux, le Véritable, Celui qui n’envie pas, le Bien-Aimé et le Fidèle. Quant aux femelles, voici leurs noms : Paix, Allégresse, Joie, Béatitude, Vérité, Amour et Pistis[b]. De ces puissances proviennent de nombreux esprits bons et purs.


    Vous découvrirez leurs influences et leurs effets dans le Livre des structures du destin du ciel situé sous les Douze[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin signale ici une lacune ou une restauration incertaine dans le manuscrit avant « quarante-neuf ».
    reason: Conserver de façon lisible le signal de dommage manuscrit représenté par des crochets vides dans le témoin.
  - marker: b
    text: Pistis est un mot grec qui peut signifier « foi » ou « fidélité »; il est conservé ici comme nom propre.
    reason: Préserver l’ambiguïté entre le nom d’une puissance et la notion personnifiée.
  - marker: c
    text: L’expression « les Douze » est obscure dans le témoin fourni; elle n’est pas explicitée ici.
    reason: Éviter d’identifier sans preuve les Douze à des cieux, signes ou puissances déterminés.
lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: Père primordial du Chaos
  rationale: Rend le titre cosmologique de manière claire et digne; « Père » s’accorde avec les pronoms masculins et avec la mention de son fils.
- source_word: Death
  choice: la Mort
  rationale: La majuscule marque qu’il s’agit d’une entité personnifiée et engendrée.
- source_word: androgynous
  choice: androgyne
  rationale: Conserve le terme technique et l’ambivalence sexuelle explicite du récit.
- source_word: mixed himself together with his (own) nature
  choice: s’unit à sa propre nature
  rationale: Formulation naturelle qui préserve l’énigmatique autorelation du témoin sans la préciser davantage.
- source_word: Lust
  choice: Désir
  rationale: Préserve une certaine latitude sémantique; « luxure » imposerait une qualification morale et sexuelle plus étroite.
- source_word: Argumentativeness
  choice: Esprit de querelle
  rationale: Exprime une disposition personnifiée à contester et à se quereller dans un français idiomatique.
- source_word: impacts
  choice: influences
  rationale: Dans ce contexte cosmologique, « influences » est plus naturel que le calque moderne « impacts ».
- source_word: Pistis
  choice: Pistis
  rationale: Conserve le nom grec traditionnel, potentiellement à la fois nom propre et notion de foi, plutôt que de trancher silencieusement.
- source_word: Structures of the Fate of Heaven Beneath the Twelve
  choice: Structures du destin du ciel situé sous les Douze
  rationale: Traduction formelle d’un titre obscur, en conservant « les Douze » comme désignation substantivée non explicitée.
theological_decisions:
- issue: Origine de la Mort à partir de la propre mort du Père primordial
  choice: « il engendra la Mort à partir de sa propre mort »
  alternative: « il produisit la Mort hors de lui-même »
  rationale: La formulation retenue garde la répétition et la tension métaphysique du témoin au lieu de les harmoniser.
- issue: Référent du pronom dans l’établissement au sixième ciel
  choice: « La Mort fut établie au-dessus du sixième ciel »
  alternative: « il fut établi au-dessus du sixième ciel »
  rationale: Le référent le plus proche est la Mort; le nom est répété en français pour éviter une ambiguïté grammaticale artificielle, sans modifier le rôle cosmologique.
- issue: Deux vertus proches dans la liste masculine
  choice: « Celui qui n’est pas jaloux » et « Celui qui n’envie pas »
  alternative: fusionner les deux en un seul équivalent
  rationale: Maintient la distinction lexicale du témoin entre jealousy et envy, même si elle demeure subtile en français.
- issue: Statut de Pistis
  choice: nom conservé sous la forme « Pistis » avec note
  alternative: traduire par « Foi »
  rationale: Évite de décider si le passage emploie un nom propre ou personnifie directement la foi.
- issue: Nature des « Douze »
  choice: « les Douze » sans identification
  alternative: « les douze cieux », « les douze signes » ou « les douze puissances »
  rationale: Le témoin fourni ne précise pas leur identité; toute explicitation importerait une interprétation cosmologique.
translation_notes:
  register: Français international moderne, narratif et digne. Les listes de noms personnifiés prennent une majuscule. La formulation reste volontairement étrange là où la cosmologie du texte l’est. Projet provisoire fondé sur le témoin anglais public fourni; une vérification directe du copte demeure nécessaire.
