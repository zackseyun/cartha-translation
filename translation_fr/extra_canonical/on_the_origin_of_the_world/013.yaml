base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: fr
  text: 'La Psyché primordiale aima Éros, qui demeurait avec elle, et elle répandit son sang sur lui ainsi que sur la terre. De ce sang, la première rose germa hors de la terre, surgissant du buisson d’épines comme une source de joie pour la lumière qui devait paraître du milieu du buisson.


    Ensuite, de belles fleurs au parfum agréable, de diverses espèces, germèrent de la terre à partir de chacune des filles vierges de Pronoia. Lorsqu’elles furent tombées amoureuses d’Éros, elles répandirent leur sang sur lui et sur la terre.


    Après elles, toutes les plantes, de diverses espèces, germèrent de la terre, portant en elles la semence des autorités et de leurs anges.


    Après elles, les autorités créèrent à partir des eaux diverses espèces d’animaux, notamment des reptiles et des oiseaux, qui portaient en eux la semence des autorités et de leurs anges.


    Cependant, avant tout cela, lorsqu’il était apparu le premier jour, il resta sur la terre environ deux jours, puis quitta la Pronoia inférieure dans le ciel et monta vers sa lumière. Aussitôt, les ténèbres obscurcirent le cosmos tout entier.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Psyche
  choice: Psyché
  rationale: Conserve le nom grec translittéré, plutôt que de le traduire par « âme », afin de préserver sa fonction de personnage et le réseau mythologique du passage.
- source_word: Eros
  choice: Éros
  rationale: Conserve le nom propre grec sous sa forme française usuelle, sans le réduire au nom commun « amour ».
- source_word: Pronoia
  choice: Pronoia
  rationale: Maintient le terme technique et le nom personnifié, dont la traduction par « Providence » pourrait imposer des connotations théologiques étrangères au contexte.
- source_word: authorities
  choice: autorités
  rationale: Rendu formel qui préserve la catégorie d’êtres cosmiques sans importer un terme confessionnel plus interprétatif comme « archontes » lorsque le témoin fourni dit « authorities ».
- source_word: cosmos
  choice: cosmos
  rationale: Préserve la portée cosmologique du terme et le registre du traité, plutôt que de choisir « monde », potentiellement plus étroit.
- source_word: thorn bush
  choice: buisson d’épines
  rationale: Rendu naturel qui conserve l’image végétale sans préciser indûment une espèce particulière.
theological_decisions:
- issue: Identité du référent du pronom masculin dans le dernier paragraphe
  choice: Maintien de « il » sans antécédent explicité
  alternative: Identifier « il » à Éros ou à la lumière
  rationale: Le témoin fourni laisse le référent ambigu; l’expliciter résoudrait sans preuve une tension réelle du texte.
- issue: Nature des « autorités » et de leurs anges
  choice: Terminologie descriptive neutre
  alternative: Employer « archontes », « puissances » ou ajouter une qualification morale
  rationale: Le passage les présente comme des acteurs cosmiques; aucune qualification confessionnelle ou morale supplémentaire ne doit être importée.
- issue: Rapport entre les filles vierges de Pronoia et les fleurs
  choice: « germèrent ... à partir de chacune des filles »
  alternative: Faire des fleurs elles-mêmes les filles de Pronoia
  rationale: Cette formulation suit la syntaxe du témoin tout en conservant l’étrangeté et l’éventuelle ambiguïté de la relation.
- issue: Localisation de la Pronoia inférieure
  choice: « la Pronoia inférieure dans le ciel »
  alternative: « le ciel de la Pronoia inférieure » ou « la Providence inférieure céleste »
  rationale: Le choix conserve la structure ambiguë du témoin concernant le rattachement de « dans le ciel ».
translation_notes:
  register: Français international moderne, digne et lisible. Les noms mythologiques grecs sont conservés; la répétition structurante de « Après elles » et la progression cosmologique sont maintenues. Le texte reste provisoire, car la révision directe du copte est signalée comme étant encore en attente.
