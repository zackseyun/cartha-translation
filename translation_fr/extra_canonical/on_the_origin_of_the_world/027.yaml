lexical_decisions:
- source_word: consummation of the age
  choice: accomplissement de l’âge
  rationale: Conserve le vocabulaire cosmologique du témoin sans réduire « age » à la seule notion de monde ou d’époque.
- source_word: archons
  choice: archontes
  rationale: Terme technique attendu dans ce corpus; une paraphrase comme « dirigeants » effacerait sa portée cosmologique.
- source_word: aeons
  choice: éons
  rationale: Maintient le terme technique distinct de « l’âge » dans les passages où il désigne les domaines ou ordres cosmiques.
- source_word: Primal Parent
  choice: Parent primordial
  rationale: Préserve le caractère inclusif et cosmologique de « Parent », sans imposer « Père » là où le témoin ne le fait pas.
- source_word: Abyss
  choice: Abîme
  rationale: La majuscule signale qu’il s’agit d’un lieu ou principe cosmologique déterminé.
- source_word: unbegotten one / unbegotten Father
  choice: celui qui n’a pas été engendré / Père non engendré
  rationale: Rend la distinction grammaticale du témoin tout en conservant l’idée d’absence d’engendrement.
- source_word: kingless aeon
  choice: éon sans roi
  rationale: Traduction transparente qui préserve l’expression inhabituelle et son ambiguïté théologique.
- source_word: deficiency
  choice: déficience
  rationale: Conserve le concept cosmologique technique plutôt que de le moraliser en « faute ».
theological_decisions:
- issue: Référents des pronoms dans la destruction cosmique
  choice: Conserver les changements de « elle » à « il » et les possessifs tels que les transmet le témoin
  alternative: Identifier explicitement chaque figure cosmologique
  rationale: Le témoin fourni laisse certains antécédents incertains; les expliciter résoudrait une ambiguïté réelle sans contrôle direct du copte.
- issue: Sort final des non-parfaits
  choice: Dire qu’ils reçoivent leur gloire mais n’entrent jamais dans l’éon sans roi
  alternative: Interpréter ce passage comme salut inférieur, condamnation ou réincorporation cosmique
  rationale: La traduction conserve la tension du texte sans importer une doctrine systématique.
- issue: Rôle des actes et de la connaissance
  choice: Coordonner simplement « ses actes et sa connaissance »
  alternative: Donner la priorité doctrinale à l’un des deux
  rationale: Le témoin les associe sans préciser leur rapport causal ou hiérarchique.
- issue: Humanité des anges, démons et archontes
  choice: Conserver « leur humanité »
  alternative: Paraphraser comme « les humains qui leur appartiennent » ou « leur condition humaine »
  rationale: L’expression est obscure et doit rester ouverte en attendant l’examen direct du copte.
