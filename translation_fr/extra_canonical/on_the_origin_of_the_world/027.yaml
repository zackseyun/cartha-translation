    issue: « le monde entier » pour « the entire place »
    rationale: Le témoin parle de « l’ensemble du lieu » et non du monde ; « monde » impose une portée cosmologique qui n’est pas explicitement formulée.
  - severity: medium
    issue: Altération des signaux textuels dans « leur mort [imminente…] »
    rationale: Le témoin distingue une restitution entre crochets, « (impending) », et une lacune vide « [] ». La formulation du projet fusionne et déplace ces signaux.
  - severity: low
    issue: « leurs temps » pour « their seasons »
    rationale: « Leurs saisons » conserve l’image et le lexique du témoin ; « temps » est plus abstrait et moins déterminé.
  - severity: low
    issue: Quelques verbes atténuent ou déplacent l’image du témoin
    rationale: « S’effondrera » pour « will plummet » et « jaillira » pour « will emerge » sont moins littéraux que « tombera » et « sortira ».
  revised_text: 'Avant l’achèvement de l’âge, tout le lieu tremblera sous un fort tonnerre. Alors les archontes seront attristés par [la crainte de] leur mort (imminente) [].[a] Les anges se lamenteront sur leur humanité, les démons pleureront sur leurs saisons, et leur humanité gémira et poussera des cris devant leur mort (imminente).


    Alors l’âge commencera, et ils seront troublés. Leurs rois s’enivreront de l’épée de feu et se feront la guerre les uns aux autres, de sorte que la terre s’enivrera de sang versé et que les mers seront troublées par ces guerres. Alors le soleil s’obscurcira, et la lune éclipsera sa lumière. Les étoiles du ciel cesseront de suivre leurs parcours, et un puissant grondement de tonnerre sortira d’une grande armée qui est au-dessus de toute armée du Chaos, là où se trouve le firmament de la femme.


    Après avoir produit la première création, elle déposera le feu sage du raisonnement et se revêtira d’une colère dépourvue de raison.


    Ensuite, elle harcèlera les dieux du Chaos, qu’elle a créés avec le Parent primordial. Elle les précipitera dans l’Abîme. Ils seront anéantis à cause de leur mal, car ils deviendront comme des volcans et se dévoreront les uns les autres, jusqu’à ce qu’ils soient détruits par la puissance du Parent primordial.


    Après les avoir détruits, il se retournera contre lui-même et se détruira lui-même, jusqu’à ce qu’il n’existe plus. Leurs cieux tomberont les uns sur les autres, et leurs armées seront dévorées par le feu. Leurs éons seront eux aussi renversés. Son ciel tombera et se brisera en deux. Ses [étoiles . . .] tomberont sur la terre, [et la terre ne pourra pas] les supporter.[b] Elles tomberont dans l’Abîme, et l’Abîme sera renversé. La lumière [vaincra] les ténèbres et les anéantira.[c] Elles deviendront comme [] quelque chose qui n’a jamais existé.[d] L’origine des ténèbres se dissipera, et la déficience sera déracinée et jetée dans les ténèbres. La lumière remontera vers sa racine, et la gloire de l’Inengendré apparaîtra. Elle remplira chaque éon lorsque les prophéties et les écrits des rois seront dévoilés et accomplis par ceux qu’on appelle parfaits.


    Cependant, ceux qui ne sont pas devenus parfaits dans le Père inengendré obtiendront leur gloire dans leurs éons et dans les royaumes des immortels, mais ils n’entreront jamais dans l’éon sans roi. En effet, chacun doit aller au lieu d’où il est venu. Par ses actes et sa connaissance, chacun révélera sa propre nature.'
