translation:
  language: fr
  text: 'Avant l’accomplissement de l’âge, le monde entier tremblera au fracas du tonnerre. Alors, les archontes seront saisis de tristesse à cause de [la peur de] leur mort [imminente…].[a] Les anges se lamenteront sur leur humanité, les démons pleureront sur leurs temps, et leur humanité gémira et poussera des cris devant leur mort imminente.


    Alors l’âge commencera, et ils seront bouleversés. Leurs rois seront enivrés par l’épée de feu et se feront la guerre, si bien que la terre s’enivrera du sang versé et que les mers seront agitées par ces guerres. Alors le soleil s’obscurcira, et la lune voilera sa lumière. Les étoiles du ciel cesseront de suivre leurs parcours, et un puissant coup de tonnerre jaillira d’une grande armée placée au-dessus de toutes les armées du Chaos, là où se trouve le firmament de la femme.


    Après avoir produit la première création, elle déposera le feu sage de la raison et se revêtira d’une colère privée de raison.


    Ensuite, elle poursuivra les dieux du Chaos, qu’elle avait créés avec le Parent primordial. Elle les précipitera dans l’Abîme. Ils seront anéantis à cause de leur mal, car ils deviendront comme des volcans et se dévoreront les uns les autres, jusqu’à ce que la puissance du Parent primordial les détruise.


    Après les avoir détruits, il se retournera contre lui-même et se détruira lui-même, jusqu’à ne plus exister. Leurs cieux tomberont les uns sur les autres, et leurs armées seront dévorées par le feu. Leurs éons seront eux aussi renversés. Son ciel s’effondrera et se brisera en deux. Ses [étoiles…] tomberont sur la terre, [et la terre sera incapable] de les supporter.[b] Elles tomberont dans l’Abîme, et l’Abîme sera renversé. La lumière [vaincra] les ténèbres et les anéantira.[c] Elles deviendront comme […] quelque chose qui n’a jamais existé.[d] L’origine des ténèbres se dissipera, et la déficience sera déracinée et jetée dans les ténèbres. La lumière remontera vers sa racine, et la gloire de celui qui n’a pas été engendré apparaîtra. Elle remplira chaque éon lorsque les prophéties et les écrits des rois seront dévoilés et accomplis par ceux qu’on appelle parfaits.


    Cependant, ceux qui ne sont pas devenus parfaits dans le Père non engendré recevront leur gloire dans leurs éons et dans les royaumes des immortels, mais ils n’entreront jamais dans l’éon sans roi. En effet, chacun doit aller au lieu d’où il est venu. Par ses actes et sa connaissance, chacun révélera sa propre nature.'
