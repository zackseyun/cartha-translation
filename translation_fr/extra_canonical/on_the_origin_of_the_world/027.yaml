  register: Français international moderne, soutenu mais accessible. Les termes cosmologiques propres au traité — archontes, Chaos, Abîme, éons — sont conservés. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et non sur une collation directe du copte; elle évite donc de régulariser les pronoms ou de combler silencieusement les lacunes.
