  footnotes:
  - marker: a
    text: Les mots entre crochets représentent une restitution éditoriale dans un passage endommagé.
    reason: Signaler que la formulation n’est pas intégralement assurée par le manuscrit.
  - marker: b
    text: Le manuscrit présente ici une lacune; une partie du texte manque.
    reason: Rendre visible l’état fragmentaire du témoin sans inventer de liaison.
  - marker: c
    text: Le terme transmis par le témoin anglais, « water hydri », est obscur et son identification demeure incertaine. Il est donc conservé sous la forme « hydri d’eau » dans l’attente d’une vérification directe du copte.
    reason: Éviter une interprétation zoologique ou cultuelle conjecturale.
  - marker: d
    text: 'Probable allusion au Psaume 92.13 (91.13 dans la Septante) : le mot grec phoinix peut désigner le palmier, tandis que ce texte le comprend comme le phénix.'
    reason: Expliquer l’écart avec la lecture biblique habituelle et le raisonnement symbolique du passage.
  - marker: e
    text: Le manuscrit présente ici une lacune; la relation exacte entre l’Égypte et le Paradis de Dieu reste donc partiellement incertaine.
    reason: Préserver l’incomplétude et l’ambiguïté syntaxique de la dernière phrase.
lexical_decisions:
- source_word: Sophia Zoe
  choice: Sophia Zoé
  rationale: Conserve les noms propres traditionnels et leur distinction, tout en francisant l’accentuation de Zoé.
- source_word: archons
  choice: archontes
  rationale: Terme technique courant en français pour les puissances dirigeantes de cette littérature; « dirigeants » effacerait sa portée cosmologique.
- source_word: plenary power
  choice: la plénitude de sa puissance
  rationale: Rend l’idée de puissance entière dans un registre digne, sans suggérer une catégorie juridique moderne.
- source_word: world of transgression
  choice: monde de la transgression
  rationale: Maintient la formulation cosmologique et morale sans réduire « transgression » à une faute particulière.
- source_word: imbued with spirit / soul
  choice: doués d’esprit / doués d’âme
  rationale: Préserve la distinction anthropologique entre esprit et âme sans imposer une terminologie confessionnelle plus technique.
- source_word: earthly
  choice: terrestres
  rationale: Rend la catégorie en parallèle avec les deux précédentes, sans ajouter « charnels », absent du témoin.
- source_word: consummation of the age
  choice: achèvement de l’âge
  rationale: Conserve « âge » plutôt que de l’interpréter systématiquement comme « fin du monde ».
- source_word: water hydri
  choice: « hydri d’eau »
  rationale: Le terme transmis est obscur; il est conservé et signalé plutôt que remplacé par une identification conjecturale.
- source_word: true man
  choice: homme véritable
  rationale: Garde l’ambiguïté entre un individu exemplaire, une figure rituelle ou une catégorie anthropologique.
- source_word: worm
  choice: ver
  rationale: Traduction directe qui maintient l’étrangeté de l’image de la créature issue du phénix.
- source_word: race
  choice: descendance
  rationale: Dans le contexte d’Adam, désigne sa postérité avec plus de naturel en français actuel et sans les connotations modernes de « race ».
theological_decisions:
- issue: Classification tripartite de l’humanité
  choice: « ceux qui sont doués d’esprit, ceux qui sont doués d’âme et ceux qui sont terrestres »
  alternative: « les spirituels, les psychiques et les matériels »
  rationale: La formulation descriptive reste compréhensible et reproduit la triple distinction sans importer un vocabulaire doctrinal technique.
- issue: Mort et retour à la vie du phénix
  choice: « se donne lui-même la mort et revient à la vie »
  alternative: « se suicide et se revivifie »
  rationale: Rend explicitement les deux actions du témoin avec un français naturel, sans atténuer l’affirmation inhabituelle.
- issue: Autorité du jugement
  choice: « jugement prononcé contre eux »
  alternative: « jugement décrété contre eux »
  rationale: Préserve l’existence d’un jugement préalable sans préciser qui le prononce, puisque le passage ne le dit pas ici.
- issue: Sophia et l’univers
  choice: « Sophia reçut l’univers »
  alternative: « Sophia obtint la maîtrise de l’univers »
  rationale: Ne précise ni possession ni souveraineté au-delà du verbe du témoin anglais, dont la vérification copte reste à faire.
- issue: Citation sur le juste et le phénix
  choice: « Le juste fleurira comme un phénix »
  alternative: « Le juste fleurira comme le palmier »
  rationale: Le texte exploite manifestement le sens « phénix » dans son argument symbolique; la note signale l’identification probable avec le Psaume 92.13 et l’ambiguïté lexicale.
- issue: Résurrection du phénix comme signe eschatologique
  choice: « symbole de ce qui arrivera lors de l’achèvement de l’âge »
  alternative: « symbole de la résurrection finale »
  rationale: Évite de définir plus précisément l’événement que ne le fait le passage.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Les termes techniques propres au traité (« archontes », « Sophia », « Sabaoth ») sont conservés. Les crochets et chevrons reproduisent les signaux éditoriaux du témoin fourni. Comme la révision directe du copte est annoncée comme restant à effectuer, les choix incertains sont explicitement signalés plutôt que normalisés.
