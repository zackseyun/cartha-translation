    Les deux taureaux d’Égypte ont eux aussi une signification symbolique : le soleil et la lune. Cela est un symbole de Sabaoth, parce que Sophia reçut l’univers dès le jour où elle façonna le soleil et la lune et apposa un sceau sur son ciel, jusqu’à la fin de l’âge.


