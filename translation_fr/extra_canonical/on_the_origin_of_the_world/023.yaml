base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: fr
  text: 'Ainsi, lorsque Sophia Zoé vit les archontes des ténèbres maudire ses compagnons, elle entra dans une grande fureur. Quittant le premier ciel avec la plénitude de sa puissance, elle poursuivit ces archontes, les chassa de [leurs] cieux et les précipita dans le monde de la transgression, pour qu’ils y demeurent sous la forme de démons mauvais sur la terre.


    [Elle envoya un oiseau][a], [passage manquant][b], qui devait passer ses mille ans dans le Paradis de leur monde : une créature vivante douée d’une âme, appelée « phénix ». Il se donne lui-même la mort et revient à la vie afin de témoigner du jugement prononcé contre eux, parce qu’ils ont maltraité Adam et sa descendance, jusqu’à l’achèvement de l’âge.


    Il existe trois sortes d’êtres humains, ainsi que leurs descendants, jusqu’à l’achèvement du monde : ceux qui sont doués d’esprit, ceux qui sont doués d’âme et ceux qui sont terrestres. De même, il y a trois phénix <dans> le Paradis : le premier est immortel et le deuxième vit mille ans. Quant au troisième, il est écrit dans l’Écriture sainte qu’il est consumé. De même encore, il existe trois baptêmes : le premier est spirituel, le deuxième est de feu et le troisième est d’eau.


    Tout comme le phénix symbolise les anges, l’« hydri d’eau » d’Égypte[c] symbolise ceux qui descendent dans le baptême d’un homme véritable.


    Les deux taureaux d’Égypte ont eux aussi une signification symbolique : le soleil et la lune. Ils sont un symbole de Sabaoth, parce que Sophia reçut l’univers dès le jour où elle façonna le soleil et la lune et apposa un sceau sur son ciel, jusqu’à la fin de l’âge.


    Le ver qui naît du phénix symbolise lui aussi un être humain, au sujet duquel il est écrit : « Le juste fleurira comme un phénix »[d]. Le phénix apparaît d’abord vivant, puis il meurt et ressuscite, devenant ainsi le symbole de ce qui arrivera lors de l’achèvement de l’âge.


    Ces puissants symboles sont apparus uniquement en Égypte, et nulle part ailleurs, pour indiquer [passage manquant][e] que celle-ci ressemble au Paradis de Dieu.'
