base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: fr
  text: 'Après le jour du repos, Sophia envoya sa fille Zoé, appelée Ève, comme enseignante, afin qu’elle fasse se lever Adam, qui était sans âme, et que ceux qu’il engendrerait deviennent des réceptacles de lumière.


    [Quand][a] Ève vit son compagnon étendu à terre, elle eut compassion de lui et dit : « Adam, vis ! Lève-toi sur la terre ! »


    Sa parole s’accomplit aussitôt en acte : Adam se leva et ouvrit rapidement les yeux. Lorsqu’il la vit, il dit : « Tu seras appelée “Mère des vivants”, parce que c’est toi qui m’as donné la vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « Quand » est une restitution éditoriale ; le texte transmis présente ici une lacune ou une incertitude.
    reason: Le témoin fourni signale « [When] [] ». La note conserve l’information textuelle sans reproduire un second crochet vide peu intelligible pour le lecteur.
lexical_decisions:
- source_word: Sophia
  choice: Sophia
  rationale: Conserve le nom grec sous sa forme traditionnelle afin de ne pas le réduire silencieusement au seul sens de « Sagesse ».
- source_word: Zoe
  choice: Zoé
  rationale: Adopte la forme française usuelle du nom grec signifiant « vie », tout en préservant son statut de nom propre.
- source_word: soulless
  choice: sans âme
  rationale: Rend directement la notion transmise par le témoin anglais sans l’atténuer en « inanimé » ou la préciser par une interprétation doctrinale.
- source_word: vessels of light
  choice: réceptacles de lumière
  rationale: Préserve l’image concrète et la portée cosmologique sans imposer « instruments » ni « demeures ».
- source_word: utterance
  choice: parole
  rationale: « Parole » est naturel et digne en français, tout en gardant l’idée d’un énoncé efficace.
- source_word: Mother of the Living
  choice: Mère des vivants
  rationale: Conserve l’écho étiologique entre Ève, la vie et ceux qui vivent.
theological_decisions:
- issue: État initial d’Adam
  choice: « Adam, qui était sans âme »
  alternative: « Adam inanimé »
  rationale: La formulation retenue conserve la tension anthropologique explicite du témoin au lieu de la résoudre en simple absence de mouvement.
- issue: Rôle d’Ève
  choice: « comme enseignante »
  alternative: « pour l’instruire »
  rationale: Préserve le titre ou rôle attribué à Zoé-Ève, sans restreindre d’avance l’identité de ceux qu’elle doit enseigner.
- issue: Efficacité de la parole d’Ève
  choice: « Sa parole s’accomplit aussitôt en acte »
  alternative: « Ses paroles produisirent immédiatement leur effet »
  rationale: Maintient le contraste théologique entre parole et acte présent dans le témoin.
- issue: Descendance d’Adam
  choice: « ceux qu’il engendrerait »
  alternative: « ses descendants »
  rationale: Conserve l’expression active et l’attribution de l’engendrement à Adam, sans expliciter davantage le mécanisme ou l’identité des êtres concernés.
translation_notes:
  register: Français international moderne, clair et digne. Les noms Sophia et Zoé sont conservés comme noms propres ; Ève suit la forme française traditionnelle. La ponctuation et les enchaînements ont été naturalisés avec prudence. Projet provisoire fondé sur le témoin anglais du domaine public, la vérification directe du copte restant à effectuer.
