review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire pour supprimer l’ajout « nécessaire » après « autorité », qui n’est pas dans le témoin, et pour rendre plus directement « written » et le nom Hieralias. Le reste suit globalement le témoin anglais fourni, tout en conservant les ambiguïtés cosmologiques.
  naturalness: Le français est globalement naturel et de registre approprié. « Comme elle le désirait » est plus idiomatique et plus proche de l’anglais que « Selon son désir ». La séquence sur les six éons et les ornements est ponctuée de manière à éviter d’attribuer grammaticalement la comparaison aux seuls ornements.
  terminology: Sophia, Pistis, éon, pauvreté, Chaos et huitième ciel sont conservés de façon cohérente. « Structure » restitue directement le terme du témoin; « Hieralias » est conservé sans francisation graphique non attestée.
  issues:
  - severity: medium
    issue: Ajout de « nécessaire »
    rationale: « Reçut de Pistis l’autorité nécessaire » introduit une qualification absente du témoin (« obtained authority from Pistis »).
  - severity: low
    issue: Rendu indirect de « structure » et « written »
    rationale: « Organisation » et « vous la trouverez décrite » interprètent légèrement le témoin, qui dit simplement « structure » et « you will find it written ». Une formulation plus directe est disponible en français.
  - severity: low
    issue: Graphie « Hiéralias »
    rationale: Le témoin fourni donne « Hieralias ». L’accent ajouté n’est pas justifié par les données disponibles et devrait être évité en l’absence de forme française établie.
  - severity: low
    issue: Portée grammaticale de la comparaison dans la phrase des éons
    rationale: Après « leurs ornements, au nombre de six », le relatif peut sembler renvoyer aux seuls ornements. « Le tout » maintient plus naturellement la portée collective du groupe antécédent, sans préciser davantage la cosmologie.
