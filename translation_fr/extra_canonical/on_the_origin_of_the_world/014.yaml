    Or, quand Adam de Lumière conçut le désir d’entrer dans sa lumière, c’est-à-dire dans le huitième ciel, il ne put le faire à cause de la pauvreté qui s’était mêlée à sa lumière. Il créa alors pour lui-même un éon immense. À l’intérieur de cet éon, il créa six éons et leurs ornements, au nombre de six; le tout était sept fois supérieur aux cieux du Chaos et à leurs ornements.


    Tous ces éons et leurs ornements subsistent dans l’infini qui s’étend entre le huitième ciel et le Chaos situé au-dessous. Ils sont comptés avec l’univers qui appartient à la pauvreté.


    Si vous souhaitez connaître leur structure, vous la trouverez écrite dans le Septième Monde du prophète Hieralias.'
