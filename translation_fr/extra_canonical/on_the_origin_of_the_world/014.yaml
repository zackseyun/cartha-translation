base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: fr
  text: '[] Selon son désir, Sophia, qui demeurait dans le ciel inférieur, reçut de Pistis l’autorité nécessaire. Elle forma de grands corps lumineux ainsi que toutes les étoiles, et elle les plaça dans le ciel afin qu’ils éclairent la terre et déterminent les signes du temps, les saisons, les années, les mois, les jours, les nuits, les minutes, et ainsi de suite. C’est ainsi que toute l’étendue du ciel fut ornée.


    Or, quand Adam de Lumière conçut le désir d’entrer dans sa lumière, c’est-à-dire dans le huitième ciel, il ne put le faire à cause de la pauvreté qui s’était mêlée à sa lumière. Il créa alors pour lui-même un éon immense. À l’intérieur de cet éon, il créa six éons et leurs ornements, au nombre de six, qui étaient sept fois supérieurs aux cieux du Chaos et à leurs ornements.


    Tous ces éons et leurs ornements subsistent dans l’infini qui s’étend entre le huitième ciel et le Chaos situé au-dessous. Ils sont comptés avec l’univers qui appartient à la pauvreté.


    Si vous souhaitez connaître leur organisation, vous la trouverez décrite dans le Septième Monde du prophète Hiéralias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sophia
  choice: Sophia
  rationale: Le nom propre est conservé plutôt que traduit par « Sagesse », afin de ne pas effacer sa fonction de personnage dans ce récit cosmologique.
- source_word: Pistis
  choice: Pistis
  rationale: Le nom propre est translittéré plutôt que rendu par « Foi », conformément à son emploi comme personnage.
- source_word: aeon
  choice: éon
  rationale: Le terme technique cosmologique est maintenu; « monde » ou « âge » réduirait ici son champ de sens.
- source_word: poverty
  choice: pauvreté
  rationale: La traduction littérale préserve le statut possiblement personnifié ou cosmologique du terme sans l’interpréter davantage.
- source_word: adornments
  choice: ornements
  rationale: Ce choix conserve la répétition et l’ambiguïté du témoin entre parure, ordre et contenu céleste.
- source_word: infinity
  choice: infini
  rationale: Le substantif cosmologique est conservé, plutôt que reformulé en simple espace illimité.
- source_word: structure
  choice: organisation
  rationale: Dans ce contexte, le mot désigne vraisemblablement l’agencement des éons et de leurs ornements; « organisation » reste naturel tout en évitant une précision architecturale excessive.
- source_word: eighth heaven
  choice: huitième ciel
  rationale: Traduction directe qui maintient la cosmologie stratifiée du passage.
theological_decisions:
- issue: Nature de Sophia, Pistis et de la pauvreté
  choice: Conserver les noms Sophia et Pistis, et traduire « poverty » littéralement par « pauvreté ».
  alternative: 'Traduire les trois notions comme des abstractions ordinaires: « Sagesse », « Foi » et « indigence ».'
  rationale: Le passage leur attribue une fonction cosmologique ou personnelle. La formulation retenue préserve cette tension sans imposer une doctrine précise.
- issue: Comparaison entre les éons et les cieux du Chaos
  choice: « sept fois supérieurs »
  alternative: « sept fois plus grands »
  rationale: Le témoin porte « superior/greater », qui peut viser le rang, la qualité ou la grandeur. « Supérieurs » conserve mieux cette indétermination.
- issue: Rapport des éons à l’univers de la pauvreté
  choice: « Ils sont comptés avec l’univers qui appartient à la pauvreté. »
  alternative: « Ils font partie de l’univers de la pauvreté. »
  rationale: La formulation plus formelle maintient la notion explicite de dénombrement ou de classement présente dans le témoin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les termes techniques de la cosmologie sont conservés lorsqu’une simplification résoudrait indûment l’ambiguïté. Les crochets initiaux sont maintenus comme signal éditorial d’une lacune ou d’une restauration dans le témoin. Projet provisoire fondé sur le témoin anglais public fourni; la vérification directe du copte reste à effectuer.
