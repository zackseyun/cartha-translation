  - severity: medium
    issue: Lacune vide transformée en points de suspension
    rationale: Le témoin et l'anglais POB conservent « [] ». Écrire « […] » suggère une étendue lacunaire et modifie la notation transmise.
  - severity: low
    issue: 'Accord grammatical : « esprits virginales »'
    rationale: « Esprits » est masculin ; il faut « esprits virginals ».
  - severity: low
    issue: Ponctuation de l'ancre a
    rationale: La séquence « —,[a] » est typographiquement fautive. La note peut être ancrée après le point sans changer la syntaxe volontairement difficile du témoin.
