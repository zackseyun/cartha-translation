  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: fr
  text: 'Sept entités androgynes se manifestèrent dans le Chaos. Elles portent à la fois leurs noms masculins et leurs noms féminins :


    Le nom féminin est Pronoia, Sambathas — ce qui signifie « semaine » —,[a]

    et son fils se nomme Yao ; son nom féminin est Domination.

    Sabaoth ; son nom féminin est Divinité.

    Adonaios ; son nom féminin est Royauté.

    Elaios ; son nom féminin est Jalousie.

    Oraios ; son nom féminin est Richesse.

    Et Astaphaios ; son nom [féminin] […] est Sophia.[b]


    Telles sont les sept puissances qui appartiennent aux sept cieux du Chaos. Elles naquirent comme entités androgynes, conformément à la structure impérissable qui existait avant elles et selon le désir de Pistis : la ressemblance de ce qui existait depuis le commencement devait régner jusqu’à la fin.


    Vous découvrirez la puissance qu’exercent ces noms, ainsi que la force des entités masculines, dans le livre La Nature archangélique du prophète Moïse ; quant à celle des noms des entités féminines, vous la découvrirez dans le Premier Livre de Noraia.


    Or Yaldabaoth, le Parent primordial, puisqu’il détenait de grandes autorités, créa par sa parole des cieux pour chacun de ses descendants. Il les fit bons, afin qu’ils leur servent de demeures. Dans chacun des cieux, il créa de grandes gloires, sept fois supérieures : des trônes, des palais, des temples, des chars et des esprits virginales, jusqu’à un être invisible, ainsi que leurs gloires. Chacun possédait tout cela dans son propre ciel : de puissantes armées de dieux, de seigneurs, d’anges et d’archanges, des myriades innombrables, afin qu’ils servent.


    Vous trouverez le récit de ces événements décrit avec exactitude dans la Première Narration d’Oraia.


    Et ils furent achevés, depuis ce ciel jusqu’au sixième ciel, celui de Sophia.


    Ce ciel et cette terre furent assaillis par l’auteur de méfaits qui demeurait au-dessous d’eux tous. Les six cieux tremblèrent violemment, car les armées du Chaos savaient qui avait assailli le ciel situé au-dessous d’eux. Lorsque Pistis prit conscience de la brèche causée par l’auteur de méfaits, elle envoya son esprit, le lia et le précipita dans le Tartare.


    Depuis ce jour, le ciel, avec […] sa terre, s’est affermi par l’action de Sophia, la fille de Yaldabaoth, qui demeure au-dessous d’eux tous.[c]'
