lexical_decisions:
- source_word: androgynous entities
  choice: entités androgynes
  rationale: Rend directement la nature double attribuée à ces puissances sans substituer un vocabulaire moderne lié à l’identité de genre.
- source_word: Rulership
  choice: Domination
  rationale: Conserve l’idée abstraite d’exercice du pouvoir et son rôle de nom féminin, sans préciser indûment s’il s’agit de souveraineté politique ou cosmique.
- source_word: deathless structure
  choice: structure impérissable
  rationale: « Impérissable » restitue l’incorruptibilité ou l’absence de mort dans un registre cosmologique naturel en français.
- source_word: verbal articulation
  choice: par sa parole
  rationale: Exprime clairement une création opérée par l’énonciation, tout en évitant d’ajouter une formule théologique absente du témoin.
- source_word: glories
  choice: gloires
  rationale: Maintient le terme technique et son pluriel étrange plutôt que de le réduire à « splendeurs » ou à des êtres glorieux.
- source_word: mischief-maker
  choice: auteur de méfaits
  rationale: Préserve la désignation fonctionnelle et péjorative sans identifier le personnage à une figure doctrinale précise.
- source_word: Tartaros
  choice: le Tartare
  rationale: Emploie la forme française conventionnelle du lieu cosmologique grec.
theological_decisions:
- issue: Relation entre Pronoia, Sambathas et le premier être de la liste
  choice: Conserver la syntaxe juxtaposée et ambiguë du témoin
  alternative: Identifier explicitement Sambathas comme nom masculin et Pronoia comme son nom féminin
  rationale: Le passage transmis est syntaxiquement difficile et l’extrait ne fournit pas assez d’éléments pour reconstruire avec certitude le membre manquant ou la relation exacte entre les noms.
- issue: Sens de la ressemblance qui doit régner
  choice: « la ressemblance de ce qui existait depuis le commencement devait régner »
  alternative: Faire de Pistis ou de la structure impérissable le sujet explicite du règne
  rationale: Le témoin attribue le règne à la « ressemblance » ; préciser davantage résoudrait une tension cosmologique que le texte laisse ouverte.
- issue: Agent de l’affermissement final
  choice: « par l’action de Sophia »
  alternative: « au moyen de Sophia » ou « grâce à Sophia »
  rationale: Cette formulation garde Sophia comme médiatrice ou agente sans donner à son intervention une valeur nécessairement positive que « grâce à » imposerait.
- issue: Nature des dieux et seigneurs célestes
  choice: Conserver « dieux » et « seigneurs » au pluriel
  alternative: Atténuer en « êtres divins » ou harmoniser avec une terminologie monothéiste
  rationale: Le pluriel appartient à la cosmologie propre du traité et ne doit pas être normalisé selon une doctrine extérieure.
translation_notes:
  register: Français international moderne, soutenu mais lisible. Les noms propres gnostiques sont translittérés sans francisation excessive. Les répétitions, les pluriels cosmologiques et les ambiguïtés du témoin sont conservés. Cette version demeure provisoire, car le dossier fourni repose sur un témoin anglais du domaine public et indique qu’une vérification directe du copte est encore à effectuer.
