    reason: Préserver explicitement le signal de dommage ou d’incertitude textuelle.
lexical_decisions:
- source_word: Primal Parent
  choice: Parent primordial
  rationale: Rend le titre cosmologique avec dignité tout en conservant son caractère générique et son ambiguïté de genre grammatical autant que le permet le français.
- source_word: Pronoia
  choice: Pronoia
  rationale: Conserve le nom technique grec plutôt que de le réduire à « Providence » ou « Prescience », qui imposerait une interprétation.
- source_word: human likeness
  choice: forme humaine
  rationale: « Forme » exprime une manifestation ressemblant à un être humain sans affirmer qu’il s’agit déjà d’un humain au sens ordinaire.
- source_word: hosts of the heavens
  choice: armées célestes
  rationale: Expression française naturelle qui garde la dimension collective et cosmique du terme.
- source_word: messenger
  choice: messager
  rationale: Évite « ange », interprétation possible mais plus déterminée que le témoin fourni.
- source_word: Adam of Light
  choice: Adam de Lumière
  rationale: Conserve le titre propre et son lien explicite avec la lumière.
- source_word: Adaman
  choice: Adaman
  rationale: Translittération conservée en raison du jeu de mots étymologique et mythologique difficile à reproduire en français.
- source_word: Adamantine
  choice: adamantine
  rationale: Terme rare mais exact, conservant l’association avec l’adamant et le jeu sur Adam/Adaman.
- source_word: authority
  choice: autorité
  rationale: Maintient le vocabulaire cosmologique technique sans préciser abusivement la nature de ces puissances.
- source_word: likeness of Pistis Sophia
  choice: forme de Pistis Sophia
  rationale: Préserve la distinction entre Pistis Sophia elle-même et sa manifestation ou représentation.
- source_word: holy water
  choice: eau sainte
  rationale: Suit l’ordre adjectival solennel du contexte et évite d’assimiler automatiquement l’expression à un usage liturgique ultérieur.
theological_decisions:
- issue: Identité du « messager »
  choice: Conserver « messager »
  alternative: « ange »
  rationale: Le passage ne permet pas d’identifier sans reste la figure à un ange au sens doctrinal classique.
- issue: Sens de Pronoia
  choice: Conserver le nom Pronoia
  alternative: « Providence » ou « Prescience »
  rationale: La translittération maintient la qualité de personnage hypostasié et l’éventail sémantique du terme.
- issue: Lien entre le sang de la vierge et la purification
  choice: Traduire directement « à cause du sang de la vierge »
  alternative: Expliciter un mécanisme sacrificiel ou rituel
  rationale: Le texte affirme une causalité sans en exposer le mécanisme; aucune doctrine ultérieure ne doit être introduite.
- issue: Référent de « elle » dans la phrase finale
  choice: Employer le féminin « elle », susceptible de renvoyer à l’eau
  alternative: Employer une tournure impersonnelle ou rapporter le pronom à une autre réalité
  rationale: Le témoin associe le pouvoir vivifiant à l’eau sainte; le français garde ce rattachement tout en laissant subsister la discontinuité signalée par la lacune.
- issue: Citation « through the waters »
  choice: « Cela est apparu à travers les eaux »
  alternative: « Il est apparu par les eaux »
  rationale: Le neutre « cela » préserve l’indétermination du sujet indiquée par les parenthèses du témoin anglais.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les noms et termes cosmologiques propres sont conservés lorsqu’une traduction risquerait d’imposer une lecture. Le projet reste provisoire, car la base fournie est un témoin anglais du copte et la révision directe de la langue source est annoncée comme en attente.
