base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: fr
  text: 'Lorsque le Parent primordial vit combien la lumière était belle dans son éclat, il fut saisi d’étonnement et éprouva une profonde honte. Tandis que cette lumière jaillissait, une forme humaine tout à fait merveilleuse se manifesta en elle. Personne ne la vit, sauf le Parent primordial et Pronoia, qui demeurait avec lui. Pourtant, sa lumière se manifesta à toutes les armées célestes, et elles en furent toutes troublées.


    Lorsque Pronoia vit alors ce messager, elle s’éprit de lui. Mais il la prit en aversion parce qu’elle demeurait dans les ténèbres. Elle voulut néanmoins l’étreindre, mais elle ne le put pas. Incapable d’apaiser son amour, elle répandit sa lumière sur la terre. Depuis ce jour, ce messager est appelé « Adam de Lumière », ce qui signifie, une fois traduit, « l’homme de sang rayonnant ». Et la terre fut étendue au-dessus de lui : le saint Adaman[a], ce qui signifie, une fois traduit, « la Terre sainte adamantine ».


    Depuis ce jour, toute autorité honore le sang de la vierge, et la terre a été purifiée à cause du sang de la vierge. De plus, l’eau a été purifiée par l’intermédiaire de la forme de Pistis Sophia, qui était apparue au Parent primordial au milieu des eaux. C’est donc à juste titre qu’il a été dit : « Cela est apparu à travers les eaux. » Parce qu’elle donne la vie à toute chose, […] [b] l’eau sainte purifie toute chose.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
