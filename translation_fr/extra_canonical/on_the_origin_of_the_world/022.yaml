  register: Français international moderne, digne et lisible, avec dialogues aérés et termes techniques conservés lorsqu’ils structurent la pensée du traité. Ce projet est établi à partir du témoin anglais public fourni; la consultation directe du copte du Codex de Nag Hammadi II,5 et des témoins apparentés reste à effectuer. Les deux lacunes signalées dans le témoin ont été converties en appels de note explicites.
