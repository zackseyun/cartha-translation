  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/022.yaml
  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
translation:
  language: fr
  text: 'Lorsque les archontes comprirent qu’Adam et Ève avaient enfreint les commandements qu’ils leur avaient donnés, ils vinrent dans le Paradis et s’approchèrent d’eux au milieu d’un tremblement de terre et de grandes menaces, afin de voir l’effet de l’aide qu’ils avaient reçue.[a] Adam et Ève se mirent à trembler violemment et se cachèrent sous les arbres du Paradis. Les archontes, ne sachant pas où ils étaient, dirent :


    « Adam, où es-tu ? »


    Il répondit :


    « Me voici. Je me suis caché parce que j’avais peur de vous et que j’avais honte. »


    Dans leur ignorance, ils lui dirent :


    « Qui t’a fait connaître la honte dont tu t’es revêtu, à moins que tu n’aies mangé de cet arbre ? »


    Il répondit :


    « La femme que vous m’avez donnée, c’est elle qui m’en a donné, et j’ai mangé. »


    Alors ils dirent à la femme : [b]


    « Qu’as-tu fait ? »


    Elle répondit :


    « C’est l’instructeur qui m’y a poussée, et j’ai mangé. »


    Les archontes s’approchèrent alors de l’instructeur. À cause de lui, leurs yeux s’embrumèrent, et ils furent incapables de faire quoi que ce soit contre lui. Comme ils étaient impuissants, ils le maudirent.


    Après cela, ils s’approchèrent de la femme et la maudirent, elle et ses descendants.


    Après la femme, ils maudirent Adam et, à cause de lui, la terre ainsi que les cultures. Ils maudirent tout ce qu’ils avaient créé. Ils ne possèdent aucune bénédiction : le bien ne peut pas provenir du mal.


    À partir de ce jour, les autorités comprirent véritablement qu’il existait quelque chose de plus puissant qu’elles.


    Elles savaient seulement que leurs commandements n’avaient pas été respectés. Une immense jalousie entra dans le monde uniquement à cause de l’homme qui ne meurt pas.


    Lorsque les archontes comprirent que leur Adam avait acquis une autre sorte de connaissance, ils voulurent le mettre à l’épreuve. Ils rassemblèrent tous les animaux domestiques, les bêtes sauvages de la terre et les oiseaux du ciel, puis les amenèrent devant Adam pour savoir comment il les appellerait. Quand il les eut vus, il donna des noms aux créatures qu’ils avaient faites.


    Ils furent troublés de voir qu’Adam surmontait toutes les épreuves. Ils se réunirent, élaborèrent des plans et dirent :


    « Voyez Adam ! Il est devenu comme l’un de nous, puisqu’il connaît la différence entre la lumière et les ténèbres. Peut-être sera-t-il maintenant trompé, comme dans le cas de l’arbre de la connaissance, et ira-t-il même jusqu’à s’approcher de l’arbre de la vie, à manger de son fruit, à devenir immortel et à devenir seigneur. Alors il nous prendra en aversion et nous méprisera, nous et toute notre gloire. Puis il nous condamnera avec notre univers. Venez, chassons-le [c] du Paradis et faisons-le descendre sur la terre d’où il a été tiré, afin que désormais il ne puisse rien connaître qui dépasse nos propres capacités. »


    C’est ainsi qu’ils chassèrent Adam du Paradis avec sa femme. Mais l’acte qu’ils avaient commis ne leur suffit pas : au contraire, ils prirent peur.


    Ils entrèrent dans le Paradis et s’approchèrent de l’arbre de la vie. Ils l’entourèrent de grands êtres redoutables, des créatures vivantes de feu appelées « chérubins ». Au milieu d’eux, ils placèrent une épée enflammée qui tournait continuellement d’une manière terrifiante, afin d’empêcher tout être terrestre de jamais entrer dans ce lieu.


    Parce que les archontes étaient devenus jaloux d’Adam, ils voulurent raccourcir leur durée de vie.[d] Mais ils ne le purent à cause du destin fixé dès le commencement, car une durée de vie de mille ans avait été attribuée à chacun, conformément à la révolution des corps lumineux. Pourtant, bien que les archontes n’aient pu accomplir leur dessein, chacun de ces artisans du mal retrancha dix ans, si bien que la durée de vie totale fut ramenée à neuf cent trente ans. Ces années s’écoulent dans la souffrance, la faiblesse et les troubles causés par la malveillance. Telle est la vie depuis ce jour jusqu’à l’achèvement de l’âge.'
