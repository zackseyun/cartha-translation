lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Terme technique usuel en français pour les puissances dirigeantes de ce traité; il évite de les assimiler sans justification à de simples chefs humains.
- source_word: Paradise
  choice: Paradis
  rationale: Conserve le cadre et l’écho scripturaires du récit, avec la majuscule comme nom du lieu.
- source_word: teacher
  choice: instructeur
  rationale: Rend la fonction d’enseignement sans imposer l’identité précise du personnage ni la valeur honorifique que pourrait suggérer « maître ».
- source_word: deathless man
  choice: l’homme qui ne meurt pas
  rationale: Formulation transparente qui préserve l’idée d’absence de mort sans l’identifier automatiquement à une doctrine particulière de l’immortalité.
- source_word: radiant bodies
  choice: corps lumineux
  rationale: Rendu assez littéral qui laisse ouverte la référence cosmologique aux astres.
- source_word: consummation of the age
  choice: achèvement de l’âge
  rationale: Préserve le vocabulaire eschatologique et la notion d’une époque qui atteint son terme, plutôt que de généraliser en « fin du monde ».
theological_decisions:
- issue: Nature du bien et des créateurs mauvais
  choice: '« Ils ne possèdent aucune bénédiction : le bien ne peut pas provenir du mal. »'
  alternative: « Ils n’ont aucune puissance de bénir » ou une reformulation harmonisée avec une doctrine ultérieure de la création
  rationale: Suit la tension théologique propre au traité sans l’atténuer ni l’harmoniser avec un autre cadre doctrinal.
- issue: Identité de l’instructeur
  choice: Le personnage reste désigné seulement comme « l’instructeur »
  alternative: L’identifier explicitement au serpent, au Christ ou à une autre figure
  rationale: Le passage fourni ne donne pas ici cette identification; la traduction conserve donc l’ambiguïté narrative.
- issue: « devenu comme l’un de nous »
  choice: Maintien direct de la parole plurielle des archontes
  alternative: Modifier le pluriel ou identifier son référent divin
  rationale: Préserve le remaniement polémique du langage de la Genèse propre au document.
- issue: Destin et durée de vie
  choice: Le destin est présenté comme fixé dès le commencement et contraignant les archontes
  alternative: Interpréter le destin comme décret d’un Dieu nommé ou comme simple loi naturelle
  rationale: Le texte ne précise pas ici l’auteur ou le statut métaphysique du destin.
