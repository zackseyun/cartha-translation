base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: fr
  text: 'Revenons aux archontes dont nous avons parlé précédemment, afin de donner une explication à leur sujet.


    Lorsque les sept archontes eurent été précipités de leurs cieux sur la terre, ils se façonnèrent une multitude d’anges démoniaques pour les servir. Ceux-ci enseignèrent à l’humanité diverses sortes d’erreurs, la magie, les potions, le culte des idoles, les effusions de sang, les autels, les temples, les sacrifices et les libations offertes à tous les démons terrestres. Ils collaboraient avec le destin, qui vint à l’existence par l’accord entre les dieux de l’injustice et ceux de la justice. Ainsi, une fois venu à l’existence, le monde s’égara et demeura sans cesse dans la confusion, car tous les humains sur terre adoraient des démons, depuis la création jusqu’à l’accomplissement de l’âge[a] : aussi bien les anges de justice que les humains d’injustice[b].


    Ainsi, le monde en vint à exister dans la confusion, l’ignorance et la stupeur. Tous s’étaient égarés jusqu’à l’apparition de l’homme véritable[c].


    Que cela suffise sur ce sujet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à la consommation de l’âge », c’est-à-dire jusqu’à son terme.'
    reason: Signaler le sens eschatologique possible d’une expression dont la traduction littérale peut sembler inhabituelle en français.
  - marker: b
    text: 'Le rattachement de cette dernière proposition est incertain : elle peut désigner ceux qui adoraient les démons ou préciser les êtres évoqués dans la phrase.'
    reason: Préserver l’ambiguïté grammaticale expressément relevée dans le dossier de traduction.
  - marker: c
    text: 'Ou : « l’être humain véritable ». Le texte fourni ne précise pas ici l’identité de cette figure.'
    reason: Conserver l’ambivalence anthropologique et éventuellement titulaire de l’expression sans imposer une identification.
lexical_decisions:
- source_word: archons
  choice: archontes
  rationale: Le terme technique « archontes » préserve la désignation propre à la cosmologie du traité, plutôt que de la réduire à « chefs » ou « autorités ».
- source_word: potions
  choice: potions
  rationale: Ce choix conserve la généralité du témoin disponible; « philtres » ou « drogues » préciseraient indûment leur nature ou leur usage.
- source_word: drink offerings / libations
  choice: libations
  rationale: « Libations » est le terme français courant et précis pour des offrandes liquides rituelles.
- source_word: fate
  choice: destin
  rationale: « Destin » rend naturellement la puissance cosmique personnifiée; le genre grammatical français impose le masculin dans les reprises éventuelles.
- source_word: consummation (of the age)
  choice: accomplissement de l’âge
  rationale: La formulation garde la portée eschatologique et la mention explicite de l’âge sans la paraphraser par « fin du monde ».
- source_word: true man
  choice: homme véritable
  rationale: « Homme véritable » conserve la valeur anthropologique ou titularisée possible de l’expression sans l’identifier explicitement à une figure déterminée.
theological_decisions:
- issue: Statut des archontes et des anges démoniaques
  choice: Conserver la cosmologie telle qu’elle est formulée
  alternative: Neutraliser ces êtres en parlant seulement de puissances ou de forces mauvaises
  rationale: Le passage présente ces figures comme des agents personnels; les atténuer imposerait une lecture étrangère au texte.
- issue: Personnification du destin
  choice: « le destin, qui vint à l’existence »
  alternative: « la fatalité, née de l’accord »
  rationale: La relative maintient la personnification et le récit d’origine attestés par le témoin.
- issue: Clause finale sur les anges de justice et les humains d’injustice
  choice: Maintenir la coordination après deux-points sans préciser davantage son rattachement
  alternative: Affirmer explicitement que ces deux groupes adoraient les démons, ou qu’ils constituent eux-mêmes les démons adorés
  rationale: Le témoin signale une ambiguïté grammaticale réelle; la traduction ne doit pas trancher silencieusement entre les rattachements possibles.
- issue: Identité de « l’homme véritable »
  choice: Ne pas identifier la figure
  alternative: Employer un titre christologique explicite ou une majuscule interprétative
  rationale: Le contexte fourni ne justifie pas à lui seul une identification confessionnelle ou doctrinale précise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été allégée en plusieurs phrases tout en conservant l’enchaînement cosmologique et rhétorique. Les termes techniques « archontes » et « libations » sont maintenus; les notes rendent visibles les ambiguïtés majeures. Le projet demeure provisoire, car le dossier indique qu’une vérification directe du copte est encore attendue.
