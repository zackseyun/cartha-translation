  rationale: Équivalent formel du terme désignant ces puissances cosmiques, sans importer le terme spécialisé « archontes » en l’absence de vérification copte directe.
theological_decisions:
- issue: Nature sexuée d’Éros
  choice: « son élément masculin » et « son élément féminin »
  alternative: « sa part masculine » et « sa part féminine »
  rationale: « Élément » préserve la formulation ontologique du témoin sans expliquer davantage le rapport entre les deux composantes.
- issue: Pronoia comme figure ou abstraction
  choice: Conserver « Pronoia » comme nom propre
  alternative: Traduire par « Providence » ou « Prescience »
  rationale: Le contexte personnifié et la portée technique du terme recommandent de préserver le nom et son ambiguïté conceptuelle.
- issue: Diffusion d’Éros sans diminution
  choice: Conserver l’analogie de la lampe et la répétition de « sans être diminué »
  alternative: Résumer comme une présence indivise
  rationale: 'L’image porte une tension métaphysique importante : Éros se communique à tous sans perte de substance.'
- issue: Enchaînement Terre–Femme–mariage–naissance–déclin
  choice: Maintenir les personnifications et la structure paratactique
  alternative: Transformer en explication causale continue
  rationale: La succession lapidaire du témoin doit rester ouverte quant à sa portée mythique, cosmologique ou étiologique.
- issue: Semence des autorités et de leurs anges
  choice: Préserver la formulation génitive et la lacune
  alternative: Préciser que les arbres tirent leur semence des autorités
  rationale: Le passage est textuellement endommagé et ne permet pas de résoudre sûrement le rapport syntaxique.
