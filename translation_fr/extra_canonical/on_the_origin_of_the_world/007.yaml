    Il siège sur un trône de lumière, <dans un> grand nuage qui le couvre. Personne ne demeurait avec lui à l’intérieur du nuage, excepté Sophia, <la fille de> Pistis. Elle l’instruisit au sujet de tous les êtres qui existent dans le huitième ciel, afin qu’il puisse en créer les ressemblances et que son règne dure jusqu’à l’achèvement des cieux du Chaos et de leurs armées.



