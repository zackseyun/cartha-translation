base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: fr
  text: 'Après cela, il créa une assemblée d’anges — des milliers innombrables et des myriades — qui ressemblait à l’assemblée du huitième ciel. Il créa aussi un premier-né appelé « Israël », c’est-à-dire « l’Homme qui voit Dieu », et un autre être appelé « Jésus Christ ». Celui-ci ressemble au sauveur qui demeure là-haut, dans le huitième ciel, et qui siège à sa droite sur un trône saint. À sa gauche, la Vierge de l’Esprit saint siège sur un trône et le glorifie. Devant elle se tiennent les sept vierges, tenant trente harpes, des lyres et des [a] trompettes, et elles le glorifient. Toutes les armées angéliques le glorifient et chantent ses louanges.


    Le lieu où il siège est un trône de lumière, <dans un> grand nuage qui le couvre. Personne ne demeurait avec lui à l’intérieur du nuage, excepté Sophia, <la fille de> Pistis. Elle l’instruisit au sujet de tous les êtres qui existent dans le huitième ciel, afin qu’il puisse en créer les ressemblances et que son règne dure jusqu’à l’achèvement des cieux du Chaos et de leurs armées.


    Or Pistis Sophia le sépara des ténèbres et l’appela à se tenir à sa droite, tandis qu’elle plaça le Parent primordial à sa gauche. Depuis ce jour, la droite est appelée « justice » et la gauche, « mal ». C’est pourquoi ils reçurent tous un éon dans l’assemblée de la justice, tandis que le mal domine toute réalité créée.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le témoin présente ici une lacune avant « trompettes »; les crochets signalent un texte manquant ou illisible.
