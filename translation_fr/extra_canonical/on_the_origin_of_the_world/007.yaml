  - marker: b
    text: 'La fin du passage est difficile : « se tient au-dessus de » peut aussi se comprendre comme « exerce son autorité sur ». Le chiffre de page manuscrit [5] n’est pas reproduit dans le corps du texte.'
    reason: Signaler l’ambiguïté de stands over et documenter l’omission du repère matériel qui ne fait pas partie de la phrase.
lexical_decisions:
- source_word: myriads
  choice: myriades
  rationale: Conserve le terme ancien désignant des multitudes immenses, sans le réduire nécessairement au nombre littéral de dizaines de milliers.
- source_word: eighth heaven
  choice: huitième ciel
  rationale: Rend directement la cosmologie propre au traité et évite une paraphrase interprétative.
- source_word: entity / being
  choice: être
  rationale: Terme français naturel et assez large pour les réalités célestes mentionnées, sans préciser indûment leur nature.
- source_word: Sophia / Pistis
  choice: Sophia / Pistis
  rationale: Conserve les noms techniques sous leur forme traditionnelle plutôt que de les traduire silencieusement par « Sagesse » et « Foi ».
- source_word: Primal Parent
  choice: Parent primordial
  rationale: Préserve l’indétermination de genre du titre anglais disponible et son caractère protologique.
- source_word: aeon
  choice: éon
  rationale: Maintient le terme cosmologique spécialisé, dont le sens peut englober un âge, un domaine ou une réalité céleste.
- source_word: consummation
  choice: achèvement
  rationale: Exprime l’arrivée au terme sans imposer la nuance plus destructrice de « fin » ou l’interprétation eschatologique de « consommation ».
- source_word: stands over
  choice: domine
  rationale: Rend l’idée de se tenir au-dessus avec autorité, tout en signalant dans la note l’ambiguïté de la formulation.
theological_decisions:
- issue: Rapport entre l’être nommé « Jésus Christ » et le sauveur du huitième ciel
  choice: « Celui-ci ressemble au sauveur »
  alternative: Identifier directement cet être au sauveur supérieur
  rationale: Le témoin distingue explicitement l’être créé de son modèle céleste; la traduction conserve cette distinction sans l’harmoniser avec une christologie extérieure au traité.
- issue: Valeur symbolique de la droite et de la gauche
  choice: « justice » et « mal »
  alternative: « droiture » et « méchanceté »
  rationale: Ces termes gardent la polarité cosmologique et morale du passage sans ajouter une explication doctrinale.
- issue: Identité de Sophia et Pistis Sophia
  choice: Conserver « Sophia, <la fille de> Pistis » puis « Pistis Sophia »
  alternative: Uniformiser les deux désignations en un seul nom
  rationale: La variation du témoin et la restitution éditoriale peuvent refléter une difficulté textuelle ou une distinction réelle; elles ne sont donc pas résolues silencieusement.
- issue: Portée de « all of them »
  choice: « ils reçurent tous »
  alternative: Nommer explicitement les anges ou l’ensemble des êtres créés
  rationale: L’antécédent est incertain dans le témoin; le pronom préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions liturgiques (« glorifie », « louanges »), les termes cosmologiques (« huitième ciel », « Chaos », « éon ») et les restitutions éditoriales entre chevrons sont conservés. Cette version demeure provisoire, car elle repose sur un témoin anglais du copte et attend une vérification directe dans les témoins coptes.
