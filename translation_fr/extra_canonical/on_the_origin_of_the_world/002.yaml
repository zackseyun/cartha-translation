  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: fr
  text: 'Après que la forme naturelle des êtres immortels eut achevé de se développer à partir de l’infini, une image appelée Sophia émana alors de Pistis.[a] Elle exerça sa volonté et devint un être créé semblable à la lumière primordiale. Aussitôt, sa volonté se manifesta sous la forme du ciel, avec une étendue incompréhensible, entre les êtres immortels et les êtres venus à l’existence par la suite, ressemblant à […] . Elle servit de voile séparant l’humanité des êtres d’en haut.


    Or, l’éon de la Vérité n’a pas d’ombre à l’extérieur, car la lumière infinie demeure partout en lui.[b] Son extérieur, cependant, est une ombre appelée « Ténèbres ». De cette ombre apparut une armée qui domina les ténèbres, et les armées venues à l’existence après elle appelèrent cette ombre « Chaos infini ». D’elle, toute sorte de divinité s’éleva […] avec le lieu tout entier. Il en résulte en outre que l’ombre est postérieure au premier être créé […]. Elle apparut <dans> l’Abîme et provenait de Pistis, mentionnée plus haut.[c]


    L’ombre comprit ensuite qu’il existait quelque chose de plus puissant qu’elle et devint envieuse. Devenue enceinte par sa propre volonté, elle enfanta aussitôt la jalousie. Depuis ce jour, la loi de la jalousie qui règne parmi tous les éons et leurs mondes est manifeste. Or, cette jalousie se révéla être un avorton dépourvu de tout esprit. Elle vint à l’existence comme une ombre au sein d’une immense substance aqueuse. Puis la bile issue de l’ombre fut projetée dans une région du Chaos.


    Depuis ce jour, une substance aqueuse est manifeste, et ce qui s’y enfonça jaillit au loin tout en restant visible dans le Chaos. Comme chez une femme qui met un enfant au monde, lorsque toute la matière accumulée en elle jaillit, ainsi la matière vint à l’existence à partir d’une ombre et fut expulsée loin d’elle, sans toutefois sortir du Chaos.


    La manifestation de Yaldabaoth


    La matière demeura donc dans le Chaos, dans l’une de ses régions. Après ces événements, Pistis arriva et se manifesta au-dessus de la matière du Chaos, qui avait été expulsée comme un fœtus avorté, puisqu’aucun esprit ne demeurait en elle : elle n’était qu’obscurité infinie et eau sans fond. Lorsque Pistis vit ce qui résultait de sa déficience, elle fut troublée. Son trouble se manifesta sous la forme d’un être créé effrayant qui se précipita vers elle dans le Chaos. Elle se tourna vers lui et souffla sur son visage, dans l’Abîme situé au-dessous de […] tous les cieux. Pistis Sophia voulut alors que l’être dépourvu d’esprit reçoive une forme et domine la matière ainsi que toutes ses armées. Pour la première fois, un archonte androgyne à l’apparence de lion se manifesta hors des eaux. Il possédait en lui-même une grande autorité, sans savoir d’où il était venu.[d]


    Tandis que Pistis Sophia le regardait se mouvoir dans les profondeurs aquatiques, elle lui dit : « Enfant, passe par ici », ce qui correspond à yalda-baoth.[e] Depuis ce jour, la loi de la parole articulée se manifesta et s’étendit aux dieux, aux anges et à l’humanité. Ce qui était venu à l’existence par la parole articulée fut mené à son accomplissement par les dieux, les anges et l’humanité.


    Or, l’archonte Yaltabaoth ignorait la puissance de Pistis. Il ne vit pas son visage, mais seulement, dans l’eau, l’image qui lui parlait. À cause de cette voix, il se donna le nom de « Yald<ab>aoth ».[f] Cependant, les parfaits l’appellent « Ariael », parce qu’il ressemblait à un lion.[g]


    Lorsqu’il eut acquis l’autorité sur la matière, Pistis Sophia remonta et se retira dans sa lumière.'
