id: ORIGW.002
reference: On the Origin of the World — The Emanation of Sophia and the Hosts
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  text: 'After the natural form of the deathless entities had finished evolving out of infinity, at that time a likeness, who is called Sophia, emanated from Pistis. She exerted her will and became a created entity like the primordial light, and straightaway her will displayed itself in the likeness of heaven, possessing an incomprehensible size which was between the deathless entities and those entities that came to be after they had, resembling [. . .]. She acted like a veil that separated humanity from the entities above.


    Now, the aeon of Truth possesses no external shadow, because the infinite light dwells inside it everywhere. However, its exterior is a shadow called by the name “Darkness,” from which appeared a host which ruled above the darkness, and the hosts that came to be after them called the shadow “Infinite Chaos,” from which every type of divinity sprung upwards [. . .] together with the entire place, with the additional result that shadow is subsequent to the first [] created entity. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow next realized that something more powerful than it existed, and grew envious, and when it had grown pregnant by its own will, it straightaway gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, regarding that jealousy, it was discovered to be an abortion lacking all spirit inside it. It came to be as a shadow inside an immense aqueous substance. The bile that had come to be from the shadow was next thrust into a section of Chaos.


    From that day, an aqueous substance has been evident, and that which sank down inside of it gushed away while it was visible inside Chaos. Like the case of a woman who gives birth to a child, when all her accumulated matter gushes out, even so, matter came to be from out of a shadow, and was propelled away from it, and it did not exit from Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter dwelt inside Chaos, dwelling inside one of its sections, and when these things had transpired, Pistis then arrived and manifested above the matter of Chaos, which had been ejected like an aborted fetus, given that nothing of spirit dwelt in it, because it was completely infinite darkness and bottomless water. When Pistis had seen what resulted from her defect, she then grew troubled, and the troubling manifested as a frightful created entity which hastened to her in the Chaos. She turned herself toward it and blew into its face inside the Abyss, which dwells beneath [] all the heavens, and when Pistis Sophia willed that the entity without spirit would be formed into a likeness and would rule over matter, as well as over all her hosts, an androgynous archon looking like a lion manifested itself for the first time from out of the waters, possessing great authority inside himself, and not knowing from where he had come to be.


    Now, as Pistis Sophia watched him moving around inside the watery depths, she said to him, “Child, pass over to here,” which is the same as yalda-baoth . From that day, the law of verbal articulation manifested itself, which extended to the gods, and to the angels, and to humanity, and what had come to be as a consequence of verbal articulation was completed by the gods, and the angels, and humanity.


    Now, regarding the archon Yaltabaoth, he was unaware of the force of Pistis, not seeing her face, but instead seeing in the water the likeness that conversed with him, and on account of that voice, he called himself “Yald<ab>aoth.” “Ariael,” however, is what the perfect ones call him, because he resembled a lion.


    Now, when he had gained authority over matter, Pistis Sophia retreated up into her light.'
