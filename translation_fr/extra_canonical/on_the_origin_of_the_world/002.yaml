  footnotes:
  - marker: a
    text: Pistis et Sophia sont des noms grecs qui signifient respectivement « Foi » et « Sagesse ». Ils sont conservés ici comme noms propres.
    reason: Aide lexicale utile sans imposer que chaque occurrence soit lue comme un simple nom commun.
  - marker: b
    text: Un « éon » peut désigner ici à la fois une réalité céleste, un domaine et une puissance personnifiée.
    reason: Le terme technique est polysémique et son ambiguïté doit rester visible.
  - marker: c
    text: Les points de suspension entre crochets signalent une lacune du manuscrit; les chevrons signalent une restitution éditoriale.
    reason: Explique les signes textuels conservés dans la traduction.
  - marker: d
    text: Un « archonte » est un dirigeant ou une puissance souveraine; dans ce récit, le mot désigne un être cosmique.
    reason: Clarifie un terme technique peu familier sans lui attribuer une identité doctrinale supplémentaire.
  - marker: e
    text: Le texte rapproche le nom yalda-baoth de l’appel « Enfant, passe par ici ». Cette étymologie traditionnelle est reproduite sans en garantir l’analyse linguistique.
    reason: Le jeu étymologique appartient au récit mais ne doit pas être présenté comme une conclusion philologique assurée.
  - marker: f
    text: Les chevrons à l’intérieur de « Yald<ab>aoth » indiquent des lettres restituées par l’éditeur du texte.
    reason: Préserve et explique le signal critique du témoin.
  - marker: g
    text: Les graphies Yaldabaoth, Yaltabaoth et yalda-baoth reflètent les formes variables transmises dans le témoin; elles n’ont pas été uniformisées.
    reason: Évite de masquer la variation textuelle et onomastique.
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Conserve le terme cosmologique technique, courant dans les traductions modernes des écrits gnostiques, sans le réduire à « âge » ou « monde ».
- source_word: Pistis / Sophia
  choice: Pistis / Sophia
  rationale: Conserve les noms propres grecs traditionnels; les traduire systématiquement par « Foi » et « Sagesse » ferait perdre leur fonction de figures personnifiées.
- source_word: host
  choice: armée
  rationale: Rend l’idée d’une troupe ou puissance organisée; « armée » est plus naturel ici que le calque « host », tout en laissant ouverte la nature de ces êtres.
- source_word: archon
  choice: archonte
  rationale: Maintient le titre cosmologique technique plutôt que de l’assimiler sans nuance à un roi, chef ou démon.
- source_word: likeness
  choice: image / forme
  rationale: « Image » est retenu lorsqu’il s’agit d’une manifestation ou d’un reflet; « forme » convient mieux à l’action de façonner. Cette variation contextuelle évite un français artificiel sans effacer le motif conceptuel.
- source_word: articulate speech
  choice: parole articulée
  rationale: Préserve la distinction entre simple voix et langage verbal formé, sans surinterpréter le passage comme une doctrine particulière du Logos.
- source_word: defect
  choice: déficience
  rationale: Terme volontairement sobre qui conserve la portée cosmologique et morale ambiguë du témoin, contrairement à « faute », plus explicitement culpabilisant.
- source_word: aborted fetus / abortion
  choice: fœtus avorté / avorton
  rationale: Rend l’imagerie biologique dure du texte sans l’atténuer; le choix varie selon la syntaxe française.
theological_decisions:
- issue: Statut de Pistis et de Sophia
  choice: Conserver Pistis et Sophia comme noms propres distincts, puis « Pistis Sophia » lorsque le témoin les associe.
  alternative: Traduire par « Foi » et « Sagesse », ou les identifier d’emblée comme une seule entité.
  rationale: Le passage entretient une relation complexe entre les deux appellations; la traduction ne doit pas résoudre cette tension.
- issue: Nature de l’ombre et du Chaos
  choice: Maintenir les personnifications et les rapports spatiaux tels qu’ils apparaissent.
  alternative: Les expliquer comme des métaphores psychologiques ou comme des substances littérales.
  rationale: Le texte présente une cosmologie mythique sans imposer explicitement l’une de ces lectures.
- issue: Origine et autorité de Yaldabaoth
  choice: Dire qu’il possède une grande autorité sans savoir d’où il vient, puis qu’il acquiert l’autorité sur la matière.
  alternative: Qualifier cette autorité d’illégitime, mauvaise ou divine.
  rationale: Ces évaluations peuvent être suggérées par le récit, mais ne doivent pas être ajoutées au texte.
- issue: « les parfaits »
  choice: Conserver l’expression comme désignation interne non expliquée.
  alternative: La remplacer par « les initiés », « les élus » ou « les gnostiques ».
  rationale: Ces équivalents préciseraient une identité communautaire que le passage fourni ne définit pas.
translation_notes:
  register: Français international moderne, soutenu mais lisible. La syntaxe a été légèrement allégée lorsque le témoin anglais était lourd, tout en préservant les répétitions conceptuelles, l’imagerie de l’enfantement, les personnifications et les ambiguïtés cosmologiques. Draft provisoire fondé sur le témoin anglais public fourni; une révision directe du copte reste nécessaire.
