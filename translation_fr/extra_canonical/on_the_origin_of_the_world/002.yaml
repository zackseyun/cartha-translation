review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire pour préserver exactement les signaux lacunaires du témoin : le premier « [] » et celui de « beneath [] all the heavens » avaient été remplacés à tort par « […] ». Quelques formulations ont aussi été rapprochées du témoin anglais fourni, notamment « Instead », l’appel adressé à Yaldabaoth et l’achèvement par la parole articulée. La révision demeure provisoire, car le contrôle direct du copte est signalé comme restant à faire.'
  naturalness: Le français est globalement naturel et de registre soutenu moderne. « Enfant, viens par ici » est plus idiomatique que « passe par ici » tout en conservant l’appel de déplacement. Les formulations cosmogoniques et l’imagerie corporelle restent volontairement proches du texte.
  terminology: Les termes techniques « éon », « archonte », « Pistis », « Sophia », ainsi que les graphies variables de Yaldabaoth, sont conservés. « Armée » rend ici host sans identifier doctrinalement ces groupes. Les notes maintiennent les ambiguïtés textuelles et onomastiques.
  issues:
  - severity: high
    issue: Les lacunes notées « [] » ont été transformées en « […] » à deux endroits.
    rationale: Le témoin distingue explicitement les ellipses entre crochets « [. . .] » des crochets vides « [] ». Cette distinction critique doit être conservée, spécialement dans « first [] created entity » et « beneath [] all the heavens ».
  - severity: medium
    issue: « La matière demeura donc » rendait « Instead » par une inférence causale.
    rationale: « Donc » ajoute une relation de conséquence absente du témoin. « En revanche » conserve mieux l’opposition discursive.
  - severity: low
    issue: « passe par ici » ne rendait pas naturellement l’injonction « pass over to here ».
    rationale: « viens par ici » est idiomatique en français et garde le mouvement vers la locutrice, sans prétendre résoudre l’étymologie narrative.
  - severity: low
    issue: « fut mené à son accomplissement » est plus interprétatif que nécessaire pour « was completed ».
    rationale: « fut achevé » est plus direct et évite une coloration théologique ajoutée.
  revised_text: 'Après que la forme naturelle des êtres immortels eut achevé de se développer à partir de l’infini, une image appelée Sophia émana alors de Pistis.[a] Elle exerça sa volonté et devint un être créé semblable à la lumière primordiale. Aussitôt, sa volonté se manifesta sous la forme du ciel, avec une étendue incompréhensible, entre les êtres immortels et les êtres venus à l’existence par la suite, ressemblant à […]. Elle servit de voile séparant l’humanité des êtres d’en haut.



