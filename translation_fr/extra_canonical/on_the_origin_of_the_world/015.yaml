translation:
  language: fr
  text: 'Avant qu’Adam de Lumière ne se retire à l’intérieur du Chaos, les autorités le remarquèrent et se moquèrent du Parent primordial, parce qu’il leur avait menti en disant : « C’est moi qui suis Dieu. Personne n’a existé avant moi. »


    Lorsqu’elles s’approchèrent de lui, elles demandèrent : « N’est-ce pas là le dieu qui a gâché notre œuvre ? »


    Il répondit : « Oui. Si vous voulez qu’il ne puisse plus gâcher notre œuvre, venez, créons un homme tiré de la terre pour qu’il nous serve, selon l’image de notre corps et selon la ressemblance [a] de cet être. Ainsi, lorsqu’il contemplera sa propre ressemblance, il en tombera amoureux et ne gâchera plus notre œuvre. Au contraire, nous ferons de ceux qui naissent de la lumière des serviteurs à notre service pendant toute la durée de cet éon. »


    Tout cela arriva conformément à la prescience de Pistis, afin que l’homme paraisse selon sa ressemblance, qu’il les dénonce à cause de la forme qu’elles avaient façonnée, et que cette forme devienne un lieu enfermant la lumière.


    Les autorités acquirent alors le savoir nécessaire pour créer l’homme. Sophia Zoé, qui demeure avec Sabaoth, avait prévu ce qu’elles allaient faire, et elle se moqua de leur décision, car elles sont aveugles. Agissant contre leurs propres intérêts, elles le créèrent dans l’ignorance, sans comprendre ce qu’elles étaient sur le point d’entreprendre.


    Elle les devança et fit d’abord son propre homme, afin qu’il puisse apprendre à la forme qu’elles avaient façonnée à les haïr et, de cette manière, à leur échapper.


    Voici comment le maître fut produit. Lorsque Sophia laissa descendre une goutte de lumière, celle-ci coula sur l’eau, et aussitôt apparut un être humain androgyne. Elle façonna d’abord cette goutte en un corps féminin. Puis, se servant de ce corps, elle lui donna la ressemblance de la mère qui était apparue auparavant, et elle l’acheva en douze mois.


    Un être humain androgyne avait été produit : les Grecs l’appellent Hermaphrodite, et les Hébreux appellent sa mère Ève de Zoé, c’est-à-dire l’enseignante de la vie. Son enfant est l’être créé qui est seigneur. Par la suite, les autorités [b] l’appelèrent « la Bête », afin qu’il puisse égarer les êtres créés qui avaient façonné. « La Bête » signifie « le Maître », car il se révéla le plus habile de tous les êtres.'
