lexical_decisions:
- source_word: authorities
  choice: les autorités
  rationale: Conserve le terme technique et la valeur collective du témoin, sans imposer « archontes » dans le corps du texte.
- source_word: Primal Parent
  choice: le Parent primordial
  rationale: Préserve la neutralité de genre et la portée cosmologique de l’expression.
- source_word: aeon
  choice: éon
  rationale: Maintient le terme cosmologique technique plutôt que de le réduire à « époque » ou « monde ».
- source_word: forethought
  choice: prescience
  rationale: Rend l’idée d’une connaissance ou anticipation préalable dans un français naturel, tout en évitant de préciser davantage le statut hypostatique éventuel.
- source_word: Pistis
  choice: Pistis
  rationale: Conserve le nom grec comme désignation propre plutôt que de le traduire par « Foi ».
- source_word: Sophia Zoe
  choice: Sophia Zoé
  rationale: Conserve les noms techniques tout en francisant l’accentuation de Zoé.
- source_word: teacher
  choice: le maître / l’enseignante
  rationale: 'Le contexte impose des formes distinctes : « le maître » pour l’être androgyne désigné au masculin grammatical, et « l’enseignante de la vie » dans la glose explicitement féminine.'
- source_word: androgynous human
  choice: un être humain androgyne
  rationale: Formulation inclusive et précise, préférable à « un homme androgyne », potentiellement réducteur.
- source_word: Hermaphrodites
  choice: Hermaphrodite
  rationale: Emploie la forme française conventionnelle du nom, comprise ici comme appellation propre.
- source_word: Beast
  choice: la Bête
  rationale: Préserve le titre symbolique et sa reprise interprétative.
theological_decisions:
- issue: Référent de « his likeness » dans le projet des autorités
  choice: « sa propre ressemblance »
  alternative: « la ressemblance de cet être »
  rationale: La syntaxe du témoin permet une tension référentielle. « Sa propre » rend le mécanisme de fascination sans identifier plus précisément l’antécédent.
- issue: Genre et identité du Parent primordial
  choice: « Parent primordial »
  alternative: « Père primordial »
  rationale: Le témoin dit « Parent » ; une masculinisation théologique ne serait pas justifiée par les données fournies.
- issue: Nature de Pistis, Sophia Zoé et Sabaoth
  choice: Noms propres non expliqués dans le texte
  alternative: Traduction ou identification doctrinale
  rationale: Le passage les traite comme des figures nommées ; leur attribuer une définition doctrinale résoudrait indûment les tensions du texte.
- issue: Ambiguïté du dernier paragraphe
  choice: Conserver la construction étrange « les êtres créés qui avaient façonné »
  alternative: Harmoniser en « les êtres créés que les autorités avaient façonnés »
  rationale: Le témoin signale explicitement une formulation ambiguë ; la traduction ne corrige donc pas silencieusement le sujet ou l’objet.
- issue: « created entity who is lord »
  choice: « l’être créé qui est seigneur »
  alternative: « la créature souveraine »
  rationale: La formulation littérale préserve l’énoncé énigmatique et évite d’identifier ce seigneur à une figure théologique précise.
translation_notes:
  register: Français international moderne, narratif et digne. Les termes cosmologiques techniques (« Chaos », « éon », « Pistis », « Sophia Zoé », « Sabaoth ») sont conservés. Le brouillon repose provisoirement sur le témoin anglais public fourni, la vérification directe du copte étant encore en attente ; les lacunes et ambiguïtés du témoin ne sont pas harmonisées.
