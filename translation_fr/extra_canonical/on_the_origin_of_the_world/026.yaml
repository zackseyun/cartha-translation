    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: fr
  text: 'Le Logos, supérieur à tout, fut envoyé dans ce seul but : annoncer ce qui était inconnu. Il dit : « Rien de ce qui est caché ne reste sans être révélé, et ce qui est inconnu sera connu. » Et ceux-ci[a] furent envoyés pour faire connaître ce qui est caché, notamment les sept autorités du Chaos et leur impiété. C’est ainsi qu’ils furent condamnés à mort.


    Lorsque tous les êtres parfaits apparurent sous les formes façonnées par les archontes, et lorsqu’ils révélèrent la vérité sans pareille, ils humilièrent toute la sagesse des dieux. Leur destinée se révéla être une condamnation[b], et leur armée dépérit. Leur domination se dissipa. Leur prévoyance fut réduite à néant, avec leur gloire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « ceux-ci » est incertain dans le témoin disponible.
    reason: Préserver l’ambiguïté réelle du pluriel plutôt que d’identifier sans preuve les personnes envoyées.
  - marker: b
    text: 'Ou : « un blâme », « une réprobation ». Le sens exact de l’expression demeure incertain.'
    reason: Le mot rendu par « censure » dans le témoin anglais couvre plusieurs nuances judiciaires ou réprobatrices.
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Conserve le terme traditionnel et sa portée conceptuelle, plutôt que de trancher entre « Parole », « Verbe » et « Raison ».
- source_word: all-superior
  choice: supérieur à tout
  rationale: Rend naturellement l’idée de suprématie universelle sans ajouter une nuance absente du témoin fourni.
- source_word: authorities
  choice: autorités
  rationale: Préserve le vocabulaire hiérarchique du texte et évite d’identifier plus précisément ces puissances sans appui direct.
- source_word: Chaos
  choice: Chaos
  rationale: Maintient le nom cosmologique avec une majuscule, comme dans le témoin.
- source_word: archons
  choice: archontes
  rationale: Terme établi en français pour les puissances dirigeantes de cette littérature; « dirigeants » serait trop général.
- source_word: host
  choice: armée
  rationale: Dans ce contexte de puissances et de domination, « armée » exprime plus clairement le collectif organisé que le littéral « troupe ».
- source_word: forethought
  choice: prévoyance
  rationale: Préserve l’idée d’une faculté ou puissance anticipatrice, sans l’assimiler d’office à la providence divine.
theological_decisions:
- issue: Référent du pluriel dans « these were dispatched »
  choice: ceux-ci furent envoyés
  alternative: ils furent envoyés / ces êtres furent envoyés
  rationale: Le référent demeure incertain dans le témoin anglais; le démonstratif conserve cette obscurité au lieu de l’attribuer arbitrairement au Logos, aux êtres parfaits ou à d’autres envoyés.
- issue: Portée de « their » dans la condamnation à mort
  choice: ils furent condamnés à mort
  alternative: ceux-ci furent condamnés à mort
  rationale: Le contexte suggère les sept autorités du Chaos, mais la chaîne référentielle n’est pas entièrement transparente; la formulation française ne précise pas davantage leur identité.
- issue: Sens de « fate ... a censure »
  choice: leur destinée se révéla être une condamnation
  alternative: leur sort fut reconnu comme un blâme
  rationale: « Condamnation » convient au mouvement judiciaire du passage, tout en signalant en note que le témoin permet une nuance de blâme ou de réprobation.
translation_notes:
  register: 'Français international moderne, digne et lisible. Les termes techniques « Logos » et « archontes » sont conservés en raison du cadre cosmologique du traité. Cette version reste provisoire : elle repose sur le témoin anglais public fourni, la vérification directe du copte étant encore en attente.'
