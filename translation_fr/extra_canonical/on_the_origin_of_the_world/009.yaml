lexical_decisions:
- source_word: Pistis
  choice: Pistis
  rationale: Conservation du nom grec traditionnel, qui peut aussi évoquer la foi ou la fidélité, sans réduire ici le personnage à une notion abstraite.
- source_word: Primal Parent
  choice: le Parent primordial
  rationale: Rend la fonction originelle et parentale tout en évitant de préciser un genre que le titre fourni ne fixe pas explicitement.
- source_word: deathless man of light
  choice: un homme de lumière, immortel
  rationale: Préserve les deux éléments distincts du syntagme — humanité lumineuse et absence de mort — dans un français naturel.
- source_word: denounce
  choice: accuser
  rationale: Dans ce contexte, « accuser » exprime clairement l’idée d’une dénonciation hostile devant d’autres êtres, sans ajouter de cadre judiciaire précis.
- source_word: eighth heaven
  choice: huitième ciel
  rationale: Maintient la cosmologie propre au texte au lieu de l’interpréter ou de la normaliser.
- source_word: behold
  choice: voici que
  rationale: Conserve la vivacité de l’interjection narrative dans un registre français digne et actuel.
theological_decisions:
- issue: La revendication de divinité exclusive du Parent primordial
  choice: « C’est moi qui suis Dieu. En dehors de moi, rien d’autre n’existe. »
  alternative: « Je suis Dieu, et il n’existe rien hormis moi. »
  rationale: La formulation retenue préserve l’insistance du texte et son ironie narrative, sans harmonisation avec une doctrine extérieure.
- issue: L’antériorité de l’homme de lumière
  choice: « avait existé avant lui »
  alternative: « était venu à l’existence avant lui »
  rationale: « Avait existé » laisse ouverte la manière dont cet être existe et n’introduit pas l’idée supplémentaire d’une création ou d’un commencement.
- issue: L’identité de Pistis comme donatrice du nom
  choice: « c’était elle qui lui avait donné un nom »
  alternative: « c’était elle qui l’avait nommé »
  rationale: La formulation suit de près le témoignage fourni et conserve la portée potentielle du don d’un nom dans la cosmologie du récit.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement segmentée pour la lisibilité, tout en conservant les répétitions, les tensions théologiques et la cosmologie du témoin. Traduction provisoire fondée sur le témoin anglais du domaine public fourni; la vérification directe du copte reste à effectuer.
