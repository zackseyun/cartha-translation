base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: fr
  text: 'Après avoir aperçu dans les eaux l’image de Pistis, le Parent primordial fut saisi d’une profonde tristesse, surtout lorsqu’il entendit sa voix : elle ressemblait à la première voix qui l’avait appelé depuis les eaux. Il gémit en comprenant que c’était elle qui lui avait donné un nom. Il eut honte de son péché. Et lorsqu’il apprit avec certitude qu’un homme de lumière, immortel, avait existé avant lui, il fut profondément troublé. En effet, il avait auparavant proclamé à tous les dieux et à leurs anges : « C’est moi qui suis Dieu. En dehors de moi, rien d’autre n’existe. » Car il avait craint qu’ils ne découvrent que quelqu’un d’autre avait existé avant lui et qu’ils ne l’accusent.


    Cependant, comme il manquait de discernement, il se moqua de la possibilité d’être accusé et agit avec témérité. Il dit : « Si [a] quelque chose existait avant moi, que cela paraisse, afin que nous contemplions sa lumière. » Et aussitôt, voici qu’une lumière jaillit du huitième ciel, au-dessus, et traversa tous les cieux de la terre.'
