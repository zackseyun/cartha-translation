  text: 'When Sabaoth, the son of Yaldabaoth, heard the voice of Pistis, he sang praises to her. At Pistis’s command, he denounced his father [and mother] [], and he praised her because she had taught them about the deathless man and his light. Then Pistis Sophia pointed her finger and poured some of the light from her own light onto him, as a denunciation of his father. When Sabaoth was illuminated, he received great authority over all the hosts of Chaos. From that day on, he has been called “Lord of Hosts.”


    He despised his father, the Darkness, and his mother, the Abyss. He hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters. Because of his light, all the authorities of Chaos became jealous of him. When they grew troubled, they waged a great war in the seven heavens.


    When Pistis Sophia witnessed the war, she sent seven archangels from her light to Sabaoth. They carried him up to the seventh heaven and stood before him as attendants. She also sent him three additional archangels and established for him the kingdom that is over everyone, so that he could dwell above the twelve gods of Chaos.


    Now, when Sabaoth had received the dwelling place of rest as a reward for his repentance, Pistis also gave him her daughter Zoe, together with great authority, so that she could teach him about everything that exists in the eighth heaven. Because he possessed authority, before anything else he built a palace for himself. It is immense and magnificent, seven times larger than all those that exist in the seven heavens. In front of [] his palace, he created an immense throne that stood on a four-faced chariot called “Cherubin.”


    The Cherubin have eight shapes on each of the four corners: forms of lions, calves, humans, and eagles, so that all the forms total sixty-four. Seven archangels stand in front of it. He [4] is the eighth, and he possesses authority. All the forms total seventy-two. In addition, the seventy-two gods derived their shape from this chariot so that they could rule over the seventy-two languages of the nations. At that throne he also created serpent-like angels called “Seraphin,” who always glorify him.'
translation:
  language: fr
  text: 'Quand Sabaoth, fils de Yaldabaoth, entendit la voix de Pistis, il chanta ses louanges. Sur l’ordre de Pistis, il dénonça son père [et sa mère] [a], et il la loua parce qu’elle leur avait enseigné ce qui concerne l’homme immortel et sa lumière. Alors Pistis Sophia pointa le doigt et répandit sur lui une part de la lumière provenant de sa propre lumière, en signe de condamnation de son père. Lorsque Sabaoth eut été illuminé, il reçut une grande autorité sur toutes les armées du Chaos. Depuis ce jour, on l’appelle « Seigneur des armées ».


    Il méprisa son père, les Ténèbres, et sa mère, l’Abîme. Il détesta sa sœur, la pensée du Premier Parent, qui s’était déplacée çà et là au-dessus des eaux. À cause de sa lumière, toutes les puissances du Chaos devinrent jalouses de lui. Dans leur agitation, elles déclenchèrent une grande guerre dans les sept cieux.


    Lorsque Pistis Sophia vit la guerre, elle envoya de sa lumière sept archanges auprès de Sabaoth. Ils l’emportèrent jusqu’au septième ciel et se tinrent devant lui pour le servir. Elle lui envoya encore trois autres archanges et établit pour lui le royaume qui domine tous les êtres, afin qu’il demeure au-dessus des douze dieux du Chaos.


    Quand Sabaoth eut reçu le lieu de repos en récompense de son repentir, Pistis lui donna aussi sa fille Zoé, avec une grande autorité, afin qu’elle lui enseigne tout ce qui existe dans le huitième ciel. Puisqu’il possédait l’autorité, il se construisit avant toute autre chose un palais. Celui-ci est immense et magnifique, sept fois plus grand que tous ceux qui existent dans les sept cieux. Devant [a] son palais, il créa un trône immense, placé sur un char à quatre faces appelé « Chérubin ».


    Le Chérubin possède huit figures à chacun de ses quatre angles : des figures de lions, de veaux, d’êtres humains et d’aigles, de sorte que l’ensemble compte soixante-quatre figures. Sept archanges se tiennent devant lui. Sabaoth est le huitième et il possède l’autorité. L’ensemble des figures atteint ainsi le nombre de soixante-douze. En outre, les soixante-douze dieux tirèrent leur forme de ce char afin de régner sur les soixante-douze langues des nations. Auprès de ce trône, Sabaoth créa aussi des anges semblables à des serpents, appelés « Séraphin », qui le glorifient sans cesse.'
