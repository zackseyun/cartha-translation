lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: Pistis / Pistis Sophia
  rationale: Les noms propres translittérés sont conservés afin de respecter la terminologie cosmologique du traité; leur sens possible (« Foi », « Foi-Sagesse ») n’est pas substitué au nom.
- source_word: deathless man
  choice: l’homme immortel
  rationale: Formulation française naturelle qui conserve le référent anthropologique et l’idée d’une vie impérissable.
- source_word: hosts of Chaos
  choice: armées du Chaos
  rationale: « Armées » préserve l’image militaire et permet de rendre le titre traditionnel « Seigneur des armées ».
- source_word: authorities
  choice: puissances
  rationale: Dans ce contexte cosmologique, « puissances » désigne naturellement des êtres ou pouvoirs célestes sans imposer une terminologie confessionnelle plus étroite.
- source_word: Primal Parent
  choice: Premier Parent
  rationale: Choix formel qui conserve l’indétermination de genre et la fonction d’origine du personnage.
- source_word: Cherubin / Seraphin
  choice: Chérubin / Séraphin
  rationale: Les formes sont traitées comme les noms singuliers du char et d’une catégorie d’anges dans ce passage, plutôt que normalisées d’office en pluriels bibliques français.
- source_word: repentance
  choice: repentir
  rationale: Le terme exprime le changement d’allégeance et le rejet du père sans préciser davantage le cadre doctrinal.
theological_decisions:
- issue: Rapport de Sabaoth aux armées du Chaos
  choice: « autorité sur toutes les armées du Chaos »
  alternative: « autorité contre toutes les armées du Chaos »
  rationale: Le témoin anglais présente une variation de nuance entre « against » et la révision POB « over ». « Sur » convient au titre qui suit et à l’autorité souveraine reçue, sans effacer le contexte d’opposition.
- issue: Statut du royaume établi pour Sabaoth
  choice: « le royaume qui domine tous les êtres »
  alternative: « le royaume qui est au-dessus de tous »
  rationale: La formulation française explicite sobrement la portée personnelle probable de « everyone », tout en maintenant la suprématie cosmique attribuée au royaume.
- issue: Nature de l’illumination
  choice: « eut été illuminé »
  alternative: « eut reçu la lumière »
  rationale: La voix passive conserve à la fois l’acte narratif de Pistis Sophia et la possible portée spirituelle du terme, sans l’interpréter doctrinalement.
- issue: Identité du huitième dans le décompte
  choice: « Sabaoth est le huitième »
  alternative: « Il est le huitième »
  rationale: Le nom est rétabli pour la clarté du français; le référent demeure celui indiqué par le contexte, sans conserver le chiffre parasite de pagination du témoin.
translation_notes:
  register: Français international moderne, narratif et digne. Les périodes ont été légèrement allégées pour la lisibilité, tout en maintenant les répétitions structurantes, les nombres, la hiérarchie cosmique et les tensions du texte. Traduction provisoire fondée sur le témoin anglais public fourni; une vérification directe du copte reste nécessaire.
