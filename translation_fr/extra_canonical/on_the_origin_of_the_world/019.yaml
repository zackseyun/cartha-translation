lexical_decisions:
- source_word: authorities
  choice: autorités
  rationale: Conserve le terme technique du témoin, sans l’interpréter d’emblée comme « puissances » ou « archontes ».
- source_word: shaped form
  choice: forme qu’elles avaient façonnée
  rationale: Rend à la fois l’objet formé et l’action créatrice revendiquée par les autorités.
- source_word: likeness
  choice: image
  rationale: « Image » est naturel en français et maintient la distinction narrative entre Ève et son double apparent.
- source_word: force
  choice: puissance
  rationale: Préserve la portée ontologique possible du terme plutôt que de réduire l’expression à la simple force physique.
- source_word: tree of knowledge
  choice: arbre de la connaissance
  rationale: Formulation française consacrée et directement intelligible.
- source_word: true man
  choice: homme véritable
  rationale: Maintient le caractère probablement technique de l’expression sans l’assimiler explicitement à un personnage déterminé.
- source_word: consummation (of the age)
  choice: accomplissement de l’âge
  rationale: Préserve le langage eschatologique et l’ambiguïté du témoin, plutôt que de substituer « fin du monde ».
- source_word: verbal articulation
  choice: expression de la parole
  rationale: Rend le lien avec la voix et la déclaration tout en évitant une tournure française excessivement technique.
theological_decisions:
- issue: Statut d’Ève comme « force »
  choice: « une puissance »
  alternative: « forte » ou « une force »
  rationale: Le contexte suggère une qualité ou entité dotée d’une portée cosmologique; « puissance » conserve cette tension.
- issue: Rapport entre Ève et la figure laissée auprès d’Adam
  choice: Maintenir constamment « image » sans expliquer le mécanisme
  alternative: « double », « apparence » ou « corps de substitution »
  rationale: Le texte distingue Ève de son image, mais n’explicite pas précisément la nature de celle-ci.
- issue: Domination d’Adam sur Ève
  choice: Présenter ce projet comme l’enseignement trompeur des autorités
  alternative: Harmoniser avec le récit de la Genèse ou en faire une prescription normative
  rationale: La voix narrative attribue explicitement ce projet aux autorités hostiles; la traduction ne doit ni l’approuver ni le réinterpréter.
- issue: « Leur propre corps »
  choice: Conserver littéralement le paradoxe
  alternative: Expliquer que l’image appartenait aux autorités ou provenait d’elles
  rationale: La relation exacte entre l’image et le corps des autorités demeure théologiquement et textuellement difficile.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement fluidifiées sans atténuer la violence du passage. La traduction demeure provisoire, car elle repose sur le témoin anglais public fourni; une vérification directe du copte est encore nécessaire. Le numéro de page manuscrite [13] n’est pas reproduit comme note textuelle, puisqu’il ne fait pas partie du contenu; en revanche, la lacune signalée par [] reçoit le marqueur [b].
