  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: fr
  text: 'Alors, on rapporta aux autorités que la forme qu’elles avaient façonnée était vivante et s’était dressée, et elles furent profondément troublées. Elles envoyèrent sept archanges pour apprendre ce qui s’était passé.


    Ils s’approchèrent d’Adam. Lorsqu’ils virent Ève parler avec lui, ils se dirent les uns aux autres : « Quelle sorte d’être est cette femme lumineuse ? Elle ressemble à cette image qui nous est apparue au sein de la lumière. Venez, saisissons-la et répandons notre semence en elle, afin qu’une fois souillée, elle ne puisse plus remonter dans sa lumière. Ceux qu’elle enfantera seront plutôt sous notre pouvoir. Mais n’en informons pas Adam, car il n’est pas des nôtres. Plongeons-le plutôt dans un profond sommeil et, pendant qu’il dormira, enseignons-lui qu’elle est issue de sa côte, afin que sa femme lui obéisse et qu’il soit son maître. »


    Parce qu’elle était une puissance[a], Ève se moqua de leur décision. Elle fit entrer une brume dans leurs yeux et laissa secrètement son image auprès d’Adam.


    Elle entra dans l’arbre de la connaissance et y demeura. Ils la poursuivirent, et elle leur révéla qu’elle était entrée dans l’arbre et qu’elle était devenue un arbre. Alors, saisis d’une grande peur, les êtres aveugles s’enfuirent.


    Après s’être remis de leur stupeur, ils s’approchèrent d’Adam. Voyant auprès de lui l’image de cette femme [b], ils furent profondément troublés : ils croyaient qu’elle était Ève elle-même et agirent sans retenue. Ils s’approchèrent d’elle, la saisirent et répandirent leur semence sur elle.


    Ils agirent ainsi avec perversité, la souillant par des moyens naturels et obscènes. Ils souillèrent d’abord le sceau de sa voix[c], celle qui leur avait parlé en disant : « Qu’est-ce qui existait avant vous ? » De cette manière, ils entendaient souiller, à l’accomplissement de l’âge[d], ceux qui pourraient déclarer, par l’expression de la parole, qu’ils étaient nés de l’homme véritable. Mais ils s’égarèrent, sans savoir qu’ils avaient souillé leur propre corps, car c’était l’image que les autorités et leurs anges avaient souillée de toutes les manières.'
