base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: fr
  text: 'Ève est la première vierge, celle qui, sans mari, mit au monde son premier enfant. Elle fut sa propre sage-femme, raison pour laquelle on considère qu’elle a dit :


    Je suis celle qui fait partie de ma mère,

    et je suis celle qui est la mère.

    Je suis celle qui est l’épouse ;

    je suis celle qui est la vierge.

    Je suis celle qui est enceinte ;

    je suis celle qui est la sage-femme.

    Je suis celle qui apaise les douleurs de l’enfantement.

    Mon mari est celui qui m’a mise au monde,

    et je suis celle qui est sa mère,

    et il est celui qui est mon père et mon seigneur.

    Il est celui qui est ma force.

    Tout ce qu’il veut, il le dit avec raison.[a]

    Je suis en train de devenir,

    bien que j’aie déjà mis au monde un homme comme seigneur.[b]


    Or, ces choses furent révélées, par la volonté de Sabaoth et de son Christ, aux âmes qui devaient entrer dans les formes façonnées par les autorités.[c] À leur sujet, la voix sainte dit : « Multipliez-vous et prospérez ; dominez sur tous les êtres créés. » Ce sont elles qui, conformément à leurs destinées, furent faites prisonnières par le Parent primordial. Elles furent ainsi enfermées dans les prisons que sont les formes façonnées <…>[d] jusqu’à l’accomplissement de l’âge.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Avec raison » peut aussi signifier « raisonnablement » ou « selon la raison ». La formulation demeure provisoire dans l’attente d’un examen direct du copte.
    reason: Préserver une ambiguïté lexicale potentiellement importante.
  - marker: b
    text: 'La relation exacte exprimée par « comme seigneur » est ambiguë : l’expression peut qualifier l’homme mis au monde ou décrire son statut.'
    reason: Signaler une ambiguïté syntaxique et théologique réelle.
  - marker: c
    text: L’expression « formes façonnées par les autorités » peut désigner des formes corporelles, mais le texte n’est pas explicité ici afin de ne pas devancer l’examen du copte.
    reason: Éviter une interprétation anthropologique prématurée.
  - marker: d
    text: Les chevrons signalent une lacune ou un texte endommagé dans le témoin.
    reason: Conserver visiblement l’état lacunaire du texte transmis.
  - marker: e
    text: « Âge » traduit ici un terme eschatologique qui peut aussi être rendu, selon le mot copte ou grec sous-jacent, par « monde » ou « éon ».
    reason: Documenter l’ambiguïté du vocabulaire temporel et cosmologique.
lexical_decisions:
- source_word: apart from a husband
  choice: sans mari
  rationale: Formulation française directe qui conserve l’affirmation paradoxale sans ajouter d’explication.
- source_word: served as her own midwife
  choice: fut sa propre sage-femme
  rationale: Rend naturellement l’image concrète de l’auto-assistance à l’accouchement.
- source_word: pains of travail
  choice: douleurs de l’enfantement
  rationale: Registre digne et intelligible, avec une portée légèrement plus littéraire que « douleurs de l’accouchement ».
- source_word: with reason
  choice: avec raison
  rationale: Préserve l’ambiguïté entre une parole rationnelle, justifiée ou liée à la Raison, sans imposer une lecture métaphysique.
- source_word: shaped forms of the authorities
  choice: formes façonnées par les autorités
  rationale: Conserve à la fois l’idée de formes modelées et l’agence des autorités ; la syntaxe française clarifie le rapport sans préciser la nature des formes.
- source_word: Primal Parent
  choice: Parent primordial
  rationale: Maintient le caractère générique et le titre cosmologique, sans choisir arbitrairement « Père » ou « Mère ».
- source_word: consummation of the age
  choice: accomplissement de l’âge
  rationale: Préserve le vocabulaire eschatologique et la possible tension entre achèvement, consommation et fin.
theological_decisions:
- issue: Identité et relations paradoxales d’Ève
  choice: Conserver littéralement les affirmations contradictoires de mère, épouse, vierge et enfantée
  alternative: Harmoniser les relations en les expliquant symboliquement
  rationale: Le paradoxe paraît constitutif du passage et ne doit pas être résolu par une interprétation confessionnelle.
- issue: « his Christ »
  choice: « son Christ »
  alternative: « son Messie » ou une reformulation identifiant davantage ce Christ
  rationale: Le titre traditionnel respecte la terminologie du témoin et laisse ouverte l’identité précise dans la cosmologie de l’œuvre.
- issue: Nature des formes façonnées
  choice: Ne pas les identifier explicitement aux corps
  alternative: Traduire « corps façonnés »
  rationale: Le témoin dit « shaped forms » ; rendre « corps » résoudrait une métaphore doctrinalement chargée avant vérification du copte.
- issue: Captivité selon les destinées
  choice: « conformément à leurs destinées »
  alternative: « selon leur sort »
  rationale: La formulation conserve l’idée d’un ordre assigné ou déterminé sans trancher le mécanisme théologique.
- issue: Langage de domination
  choice: « dominez sur tous les êtres créés »
  alternative: « régnez sur toute la création »
  rationale: La formulation garde la force de l’impératif et l’objet distributif du témoin sans l’assimiler complètement à une formule biblique connue.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition solennelle de « Je suis celle qui… » est maintenue comme structure poétique et rhétorique. Les titres cosmologiques prennent une majuscule lorsqu’ils fonctionnent comme des désignations propres. Ce projet reste provisoire, car les données fournies reposent sur un témoin anglais du domaine public et indiquent qu’une révision directe du copte est encore nécessaire.
