translation:
  language: fr
  text: 'Puis le Parent primordial exposa à ceux qui demeuraient avec lui son avis au sujet de l’homme. Alors, chacun d’eux lança son sperme au centre du nombril de la terre.


    À partir de ce jour, les sept archontes[a] façonnèrent ensemble l’homme et son corps à la ressemblance de leur propre corps ; cependant, son aspect ressemblait à celui de l’homme qui leur était apparu. Ils le façonnèrent partie par partie, et leur chef forma le cerveau ainsi que le système nerveux.


    Par la suite, il apparut semblable à celui qui avait existé avant lui. Il devint [b] un homme pourvu d’une âme, et on l’appela Adam, c’est-à-dire « Père », d’après le nom de celui qui avait existé avant lui. Quand ils eurent achevé Adam, il l’abandonna comme un récipient sans vie, car il avait pris forme à la manière d’un avorton, sans esprit en lui.


    Lorsque l’archonte en chef se rappela les paroles de Pistis[c], il craignit que l’homme véritable n’entre dans la forme qu’il avait façonnée et n’en devienne le maître. C’est pourquoi il s’éloigna pendant quarante jours de cette forme façonnée, qui était alors dépourvue d’âme ; il se retira et l’abandonna.


    Le quarantième jour, Sophia Zoé[d] envoya son souffle en Adam, qui était dépourvu d’âme. Celui-ci se mit à remuer sur le sol, mais il était incapable de se tenir debout.


    Puis les sept archontes arrivèrent. Quand ils le virent, ils furent profondément troublés. Ils s’approchèrent de lui, le saisirent, et il dit au souffle qui était en lui : « Qui es-tu ? Et d’où es-tu venu jusqu’ici ? »


    Le souffle répondit : « Je suis venu de la puissance de l’homme afin de ruiner votre œuvre. » En entendant cela, ils le glorifièrent, parce qu’il leur avait accordé un répit loin de la crainte et de l’angoisse dans lesquelles ils se trouvaient.


    Ils appelèrent alors ce jour « Repos », parce qu’ils s’étaient reposés de leur travail. Quand ils virent qu’Adam pouvait se tenir debout, ils se réjouirent ; ils le prirent, le placèrent dans le Paradis, puis remontèrent dans leurs cieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « archontes » sont des puissances dirigeantes du monde dans la cosmologie de ce récit.
    reason: Le terme technique est peu familier au lectorat moderne et ne doit pas être remplacé par une interprétation plus précise que le texte.
  - marker: b
    text: Les crochets signalent une lacune ou une restitution incertaine dans la tradition manuscrite.
    reason: La lacune visible dans le témoin doit être conservée et expliquée.
  - marker: c
    text: « Pistis » est un nom grec qui signifie « foi » ou « fidélité ». Il est conservé ici comme nom propre.
    reason: La translittération préserve le personnage nommé tout en donnant le sens du terme.
  - marker: d
    text: « Sophia Zoé » signifie en grec « Sagesse Vie », ou « Sagesse vivante » ; l’expression est conservée comme nom propre.
    reason: Le nom appartient au vocabulaire propre de l’œuvre et sa traduction directe pourrait effacer sa fonction onomastique.
lexical_decisions:
- source_word: Primal Parent
  choice: Parent primordial
  rationale: Conserve la désignation cosmologique et sa neutralité relative sans préciser un sexe ou une fonction que le témoin ne permet pas d’établir avec certitude.
- source_word: archons
  choice: archontes
  rationale: Maintient le terme technique traditionnel de cette littérature ; une note en donne le sens courant.
- source_word: sperm
  choice: sperme
  rationale: Rend explicitement l’image corporelle du témoin au lieu de l’atténuer par « semence ».
- source_word: likeness
  choice: aspect
  rationale: Évite de confondre la ressemblance visible avec la fabrication du corps à la ressemblance des corps des archontes, tout en gardant le contraste du passage.
- source_word: shaped form
  choice: forme façonnée
  rationale: Préserve la répétition conceptuelle autour du façonnage et le statut encore incomplet d’Adam.
- source_word: soul / spirit / breath
  choice: âme / esprit / souffle
  rationale: Conserve les trois termes distincts du témoin plutôt que de les harmoniser théologiquement.
- source_word: force of the man
  choice: puissance de l’homme
  rationale: « Puissance » convient au registre cosmologique et maintient l’ambiguïté de « l’homme », probablement une figure céleste dans le contexte.
- source_word: Rest
  choice: Repos
  rationale: Conserve l’étiologie du nom du jour et le jeu avec le fait de se reposer du travail.
theological_decisions:
- issue: Rapport entre l’homme façonné et l’homme antérieur ou véritable
  choice: Maintien de figures distinctes sans explication ajoutée
  alternative: Identifier explicitement l’homme antérieur à un Adam céleste ou à une figure doctrinale précise
  rationale: Le passage établit une distinction, mais le témoin fourni ne justifie pas l’importation d’une identification confessionnelle ou interprétative.
- issue: Distinction entre âme, esprit et souffle
  choice: Traduire chaque terme séparément
  alternative: Employer un seul terme, tel que « esprit », dans tous les cas
  rationale: La tension anthropologique du récit dépend de ces distinctions et ne doit pas être résolue silencieusement.
- issue: Référent du sujet dans « il l’abandonna »
  choice: Conserver le singulier ambigu
  alternative: Remplacer par « ils l’abandonnèrent » ou nommer l’archonte en chef
  rationale: Le témoin passe du pluriel au singulier sans lever complètement l’ambiguïté ; la traduction ne normalise donc pas le sujet.
- issue: « Adam » interprété comme « Père »
  choice: Conserver l’explication interne du récit
  alternative: Corriger selon l’étymologie hébraïque habituelle d’Adam
  rationale: Il s’agit de l’interprétation proposée par le document lui-même, même si elle ne correspond pas à l’étymologie hébraïque courante.
translation_notes:
  register: Français international moderne, soutenu mais lisible. La traduction demeure provisoire, car elle repose sur le témoin anglais public fourni et non sur une collation directe du copte, annoncée comme encore à venir. Les répétitions structurantes (« façonna », « âme », « se tenir debout », « repos ») et les changements de nombre ou de référent ont été conservés autant que le français naturel le permet.
