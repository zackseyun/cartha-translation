  terminology: '« Parent primordial », « archontes », « Pistis », « Sophia Zoé », « âme », « esprit » et « souffle » sont conservés. La note sur Sophia Zoé est ajustée : ζώη signifie « vie », et « Sagesse vivante » constitue une interprétation possible plutôt qu’une équivalence littérale.'
