review_pass:
  verdict: revise
  source_fidelity: 'La révision reste nécessairement provisoire, le copte n’étant pas fourni pour contrôle direct. Elle suit de près le témoin anglais : les catégories cosmologiques, la distinction entre les trois Adam et l’incertitude textuelle après « Sun-Day » sont conservées. « Prévoyance » rend plus exactement ici forethought que « prescience », qui peut réduire le terme à la seule connaissance anticipée.'
  naturalness: 'Le français est globalement clair et d’un registre approprié. Quelques formulations sont améliorées : « de Lumière » est plus direct pour of Light, et « d’eux-mêmes, ils firent naître » évite l’idiome potentiellement économique « de leur propre fonds » tout en conservant l’idée d’une production provenant de l’intérieur d’eux-mêmes.'
  terminology: « Archonte », « autorités », « Parent primordial », « Mère primordiale », « esprit », « âme », « homme de la Loi », « Jour du Soleil » et « Jour du Repos » sont maintenus. Les majuscules aux désignations cosmologiques sont cohérentes. La lacune/signal éditorial du témoin anglais est reproduit sans faire passer le crochet vide pour l’appel de note.
  issues:
  - severity: medium
    issue: « prescience » pour forethought
    rationale: « Prescience » désigne principalement une connaissance préalable. Forethought peut aussi exprimer une anticipation ou prévoyance qui oriente le déroulement; « prévoyance » conserve cette portée sans confondre ce terme avec le plan de la Justice.
  - severity: medium
    issue: Le crochet vide du témoin est confondu visuellement avec l’appel de note
    rationale: La séquence « [après] [a] » peut laisser croire que le second crochet appartient au texte lacunaire alors qu’il sert aussi d’ancre. Il faut préserver le crochet vide du témoin comme « [ ] » et placer un appel de note distinct.
  - severity: low
    issue: « De leur propre fonds »
    rationale: L’expression française peut évoquer des moyens financiers et est moins transparente pour « from inside them ». Une formulation explicitant l’origine intérieure est plus naturelle.
