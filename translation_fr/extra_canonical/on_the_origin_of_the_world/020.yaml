base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: fr
  text: 'Elle conçut d’abord Abel du premier archonte. Puis, des sept autorités et de leurs anges, elle eut les autres enfants. Tout se déroula conformément à la prescience du Parent primordial, afin que la Mère primordiale puisse porter en elle toute semence, mêlée et unie au destin de l’univers et à ses structures. Alors fut mis en œuvre, au sujet d’Ève, un plan conçu d’avance par la Justice : les formes façonnées des autorités deviendraient des lieux où la lumière serait enfermée, et, par leurs formes façonnées, la lumière les condamnerait.


    L’Adam primordial, celui de la Lumière, est animé par l’esprit, et il apparut le premier jour. Le deuxième Adam est animé par l’âme, et il apparut le sixième jour, appelé « Aphrodite ». Le troisième Adam est un être créé de la terre, c’est-à-dire l’homme de la Loi. Il apparut le huitième jour, appelé « Jour du Soleil », [après] [a] l’humble Jour du Repos. Les descendants de l’Adam terrestre se multiplièrent et remplirent la terre. De leur propre fonds, ils produisirent toutes sortes de savoir-faire techniques que possédait l’Adam animé par l’âme. Cependant, ils demeuraient tous dans l’ignorance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte transmis est lacunaire ou incertain à cet endroit. « après » correspond à une restitution proposée; les crochets du témoin signalent cette incertitude.
    reason: Le témoin fourni porte « [following] [] »; une note est nécessaire pour préserver honnêtement le signal de dommage ou de restitution manuscrite.
lexical_decisions:
- source_word: archon
  choice: archonte
  rationale: Terme technique courant en français pour les puissances dirigeantes de cette littérature; il préserve la portée cosmologique sans la réduire à « chef ».
- source_word: authorities
  choice: autorités
  rationale: Rend distinctement cette catégorie de puissances tout en conservant son ambiguïté entre pouvoir personnel et ordre cosmique.
- source_word: forethought
  choice: prescience
  rationale: Exprime une pensée ou connaissance préalable orientant les événements; « dessein préalable » aurait trop fusionné ce terme avec le plan ensuite attribué à la Justice.
- source_word: Primal Parent / Primal Mother
  choice: Parent primordial / Mère primordiale
  rationale: Maintient le parallélisme des titres et le caractère protologique du passage.
- source_word: imbued with spirit / imbued with soul
  choice: animé par l’esprit / animé par l’âme
  rationale: Formulation française naturelle qui conserve l’opposition anthropologique entre esprit et âme sans suggérer simplement un remplissage matériel.
- source_word: man of the Law
  choice: homme de la Loi
  rationale: Traduction formelle préservant le titre et son éventuelle portée théologique sans interprétation supplémentaire.
- source_word: Sun-Day / Rest-Day
  choice: Jour du Soleil / Jour du Repos
  rationale: Conserve les dénominations explicatives et leur jeu calendaire plutôt que de les remplacer silencieusement par dimanche et sabbat.
- source_word: technological skills
  choice: savoir-faire techniques
  rationale: Expression moderne et intelligible qui désigne des capacités artisanales ou techniques, sans l’anachronisme possible de « technologies ».
- source_word: dwelt in ignorance
  choice: demeuraient dans l’ignorance
  rationale: Préserve l’idée d’un état durable, importante dans le cadre cosmologique du texte.
theological_decisions:
- issue: Agent de la condamnation des autorités
  choice: « la lumière les condamnerait »
  alternative: « il/elle les condamnerait » ou « elles seraient condamnées »
  rationale: Le témoin anglais permet de rattacher « it » à la lumière; la formulation explicite ce référent probable tout en maintenant que la condamnation s’opère par les formes façonnées des autorités.
- issue: Nature des trois Adam
  choice: Conserver les catégories « esprit », « âme » et « terre » sans les harmoniser
  alternative: Les reformuler selon une anthropologie biblique ou confessionnelle standard
  rationale: Le passage présente une anthropologie tripartite propre qu’il faut laisser dans sa tension conceptuelle.
- issue: Rapport entre semence, destin et structures cosmiques
  choice: « toute semence, mêlée et unie au destin de l’univers et à ses structures »
  alternative: Faire de la Mère elle-même le seul élément mêlé et uni
  rationale: La syntaxe du témoin est ambiguë; l’accord français rattache naturellement les participes à « semence », sans développer une interprétation doctrinale absente.
- issue: Qualification du Jour du Repos
  choice: « l’humble Jour du Repos »
  alternative: « le sabbat inférieur » ou « le misérable sabbat »
  rationale: « humble » conserve le sens évaluatif de « lowly » sans durcir indûment le mépris ni importer le terme hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. Les titres cosmologiques prennent une majuscule lorsqu’ils fonctionnent comme des désignations propres. Les termes techniques « archonte », « autorités », « esprit » et « âme » sont maintenus afin de ne pas effacer le système conceptuel du traité. Cette version demeure provisoire, car elle repose sur le témoin anglais public fourni et non sur une révision directe du copte.
