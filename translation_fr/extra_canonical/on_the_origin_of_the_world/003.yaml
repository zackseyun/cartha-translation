base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: fr
  text: 'Lorsque l’archonte vit sa propre taille — bien qu’il ne vît personne d’autre que lui-même, puisqu’il ne voyait rien au-delà de l’eau et des ténèbres —, il s’imagina qu’il était le seul à exister. Son [...] fut mené à son terme au moyen d’une articulation verbale, laquelle [] se manifesta comme un esprit allant et venant au-dessus des eaux.[a] Quand cet esprit se fut manifesté, l’archonte sépara la substance aqueuse, et ce qui était sec fut mis à part en un autre lieu. À partir de la matière, il façonna pour lui-même une demeure qu’il appela « Ciel ». À partir de la matière, l’archonte façonna aussi un marchepied qu’il appela « Terre ».


    Une pensée vint alors à l’archonte, conforme à sa nature, et, au moyen d’une articulation verbale, il créa un être androgyne. Il ouvrit la bouche et lui adressa un roucoulement. Lorsque ses yeux s’ouvrirent, celui-ci regarda son père et lui fit entendre le son « iii ! ». Son père lui donna alors le nom de « Iii-a-o ».[b]


    Il créa ensuite le deuxième fils et lui adressa un roucoulement. Lorsque celui-ci ouvrit les yeux, il fit entendre à son père le son « è ! ». Son père lui donna le nom d’« Éloaï ».


    Il créa ensuite le troisième fils et lui adressa un roucoulement. Lorsque celui-ci ouvrit les yeux, il fit entendre à son père le son « asss ! ». Son père lui donna le nom d’« Astaphaïos ».


    Ces trois-là sont les fils de leur père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les signes « [...] » et « [] » signalent des lacunes ou des passages incertains dans le témoin fourni. La formulation demeure provisoire en attendant une vérification directe du copte.
    reason: Préserver visiblement l’état lacunaire du texte et signaler la limite documentaire de cette rédaction.
  - marker: b
    text: Les sons et les noms sont transcrits ici pour une lecture française. Leur forme exacte et leur éventuel jeu étymologique devront être vérifiés sur le texte copte et les autres témoins.
    reason: Le témoin anglais relie explicitement le cri du fils à son nom, mais ne fournit pas l’information philologique nécessaire pour fixer définitivement la vocalisation.
lexical_decisions:
- source_word: archon
  choice: archonte
  rationale: Terme français établi pour le titre de pouvoir « archon » dans les textes anciens; il conserve sa portée cosmologique sans l’interpréter comme « souverain » ou « démiurge ».
- source_word: verbal articulation
  choice: articulation verbale
  rationale: Rendu volontairement proche du témoin fourni afin de préserver l’idée énigmatique d’une production par la parole, sans la réduire à un simple « ordre ».
- source_word: spirit
  choice: esprit
  rationale: Conserve le sens personnel ou quasi personnel possible et l’écho du récit de création; « souffle » demeure une possibilité à vérifier sur le copte.
- source_word: androgyne
  choice: être androgyne
  rationale: Formulation naturelle en français qui garde explicitement la double caractérisation sexuelle du terme.
- source_word: cooing sound
  choice: roucoulement
  rationale: Restitue un son vocal doux et non articulé sans préciser davantage sa nature.
- source_word: footstool
  choice: marchepied
  rationale: Équivalent concret et traditionnel, maintenant l’image de la Terre placée sous le Ciel.
- source_word: Eee-a-o / Eloai / Astaphaios
  choice: Iii-a-o / Éloaï / Astaphaïos
  rationale: Francisation minimale de la notation phonétique et des accents pour guider la lecture, sans assimiler ces noms à des formes théologiques plus familières.
theological_decisions:
- issue: Rapport entre la parole et l’esprit au-dessus des eaux
  choice: Conserver « articulation verbale » et « esprit », ainsi que la construction où l’articulation se manifeste comme un esprit
  alternative: Interpréter comme une parole devenue souffle ou comme l’Esprit divin de Genèse 1
  rationale: Le passage évoque un récit de création mais son identification précise reste ambiguë; la traduction ne doit ni effacer l’écho biblique ni imposer une identité doctrinale.
- issue: Nature de l’androgyne créé
  choice: « un être androgyne » avec reprise au masculin grammatical
  alternative: Employer une périphrase explicitant deux sexes ou un pronom neutre
  rationale: Le français exige une reprise grammaticale, mais le mot « androgyne » maintient la tension du texte sans développer une anthropologie absente du témoin.
- issue: Statut des trois êtres créés
  choice: Conserver la désignation finale « les fils de leur père »
  alternative: Les appeler puissances, divinités ou archontes subordonnés
  rationale: Le témoin les nomme simplement fils; une qualification supplémentaire importerait une interprétation cosmologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe solennelle du récit de création est conservée sans archaïsmes inutiles. Les répétitions structurantes (« À partir de la matière », « Il créa ensuite ») sont maintenues. Cette version reste provisoire, car la documentation fournie indique qu’un contrôle direct de la langue source copte est encore attendu.
