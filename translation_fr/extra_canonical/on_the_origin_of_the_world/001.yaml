  naturalness: Le français est globalement clair et soutenu. Une légère révision rend la dernière phrase plus naturelle en français moderne (« à partir duquel » plutôt que « hors duquel »), tout en conservant l’image dynamique de « projeté ». La formulation « il est clair que celui-ci existait » est aussi remplacée par une formulation qui désigne explicitement l’être créé et évite une référence pronominale moins nette.
  terminology: « Chaos », « dieux cosmiques », « racine », « Ténèbres » et « être créé » sont des choix appropriés et cohérents. La majuscule et les guillemets de « Ténèbres » préservent son emploi comme désignation nominale. « Projeté » maintient la force inhabituelle du témoin sans interprétation doctrinale.
