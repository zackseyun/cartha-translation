lexical_decisions:
- source_word: Chaos
  choice: le Chaos
  rationale: Maintient le terme cosmologique personnifié ou technique du témoin, avec une majuscule, sans le réduire au simple désordre.
- source_word: cosmic gods
  choice: dieux cosmiques
  rationale: Reproduit la portée cosmologique du syntagme sans préciser indûment leur rang ou leur domaine.
- source_word: root
  choice: racine
  rationale: Conserve la métaphore d’origine profonde, distincte de la simple cause.
- source_word: Darkness
  choice: « Ténèbres »
  rationale: Le pluriel français est idiomatique dans un registre religieux; la majuscule et les guillemets signalent qu’il s’agit ici d’un nom.
- source_word: created entity
  choice: être créé
  rationale: Formulation naturelle et digne qui préserve l’idée d’une réalité créée sans imposer qu’elle soit humaine, angélique ou strictement personnelle.
- source_word: propelled
  choice: projeté
  rationale: Préserve l’image dynamique et inhabituelle du témoin anglais, plutôt que de la neutraliser par « issu » ou « engendré ».
theological_decisions:
- issue: Antériorité d’un être créé par rapport au Chaos
  choice: Affirmer que l’être créé existe depuis le commencement et précède le Chaos
  alternative: Identifier cet être ou expliquer sa relation au commencement absolu
  rationale: Le passage établit une chronologie cosmologique sans identifier encore cet être; la traduction conserve cette tension sans harmonisation doctrinale.
- issue: Nature du Chaos et des Ténèbres
  choice: Distinguer le Chaos, l’ombre nommée « Ténèbres » et l’être créé
  alternative: Traiter Chaos et Ténèbres comme des synonymes
  rationale: L’argument du texte dépend précisément de cette distinction causale.
- issue: Statut des dieux cosmiques
  choice: Traduire littéralement sans guillemets dépréciatifs
  alternative: Employer « prétendus dieux » ou « divinités »
  rationale: Le passage les contredit, mais le syntagme fourni ne permet pas d’ajouter un jugement ontologique explicite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions structurantes autour de l’existence, du Chaos et de l’être créé sont conservées. Cette version reste provisoire, car elle repose sur le témoin anglais public fourni; une vérification directe du copte est encore nécessaire.
