  text: '[] Given that everyone—both cosmic gods and humans—says that nothing existed before Chaos, in contrast to them, I will prove all of them to be in error, because they are ignorant of the origin of Chaos and of its root as well. The proof is here:


    When it comes to the topic of Chaos, how it pleases [] all people to claim that it is a type of darkness, when it actually originates from a shadow called by the name “Darkness,” and the shadow originates from a created entity that has existed from the beginning. Furthermore, it clearly existed before Chaos came to be, and the latter came to exist subsequent to the former created entity.


    Consequently, let us occupy ourselves with the realities of the case, and in addition to this, with the first created entity, out of which Chaos was propelled, and thus will the truth be clearly proven.'
translation:
  language: fr
  text: '[a] Puisque tous — dieux cosmiques aussi bien qu’êtres humains — affirment que rien n’existait avant le Chaos, je démontrerai, contre eux, qu’ils sont tous dans l’erreur, car ils ignorent l’origine du Chaos ainsi que sa racine. En voici la preuve :


    Pour ce qui est du Chaos, [b] tous se plaisent à prétendre qu’il est une sorte de ténèbres. Or, il provient en réalité d’une ombre appelée « Ténèbres », et cette ombre provient d’un être créé qui existe depuis le commencement. Il est donc clair que celui-ci existait avant que le Chaos ne vienne à l’existence, et que ce dernier est venu à l’existence après cet être créé.


    Examinons donc les réalités en question, ainsi que le premier être créé, hors duquel le Chaos fut projeté. Ainsi, la vérité sera clairement établie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le début du texte est lacunaire dans le témoin; la traduction commence là où le texte fourni devient lisible.
