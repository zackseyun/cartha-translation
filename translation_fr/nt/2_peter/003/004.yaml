source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: fr
  text: 'et disent : « Où est la promesse de sa venue[a] ? En effet, depuis que les ancêtres se sont endormis[b], tout reste inchangé depuis le commencement de la création. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présence » ou « arrivée ». Dans ce contexte, le mot grec παρουσία désigne la venue future attendue du Christ.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie l’image du sommeil comme euphémisme pour la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: et disent
  rationale: Le participe présent grec prolonge la description des moqueurs au verset précédent. En français courant, une proposition coordonnée avec un verbe conjugué rend ce mouvement plus naturellement que « et disant ».
- source_word: ἐπαγγελία
  choice: la promesse
  rationale: « Promesse » est le sens direct du terme et désigne ici l’assurance donnée concernant la venue attendue du Christ.
- source_word: παρουσίας
  choice: venue
  rationale: Dans ce contexte eschatologique, le mot désigne l’arrivée ou la venue attendue du Christ. « Venue » est naturel en français et conserve la dynamique du terme sans le réduire à une présence statique.
- source_word: ἀφ’ ἧς
  choice: depuis que
  rationale: Cette tournure française exprime clairement le point de départ temporel indiqué par l’expression grecque.
- source_word: οἱ πατέρες
  choice: les pères
  rationale: Le grec emploie l’article sans possessif. « Les pères » conserve cette formulation et son ambiguïté possible entre les ancêtres d’Israël et les générations antérieures évoquées par les moqueurs.
- source_word: ἐκοιμήθησαν
  choice: se sont endormis
  rationale: Le verbe grec emploie le sommeil comme euphémisme de la mort. La traduction maintient cette image au lieu de l’aplatir en « sont morts ».
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel grec a une portée globale. « Tout » est la formulation française la plus naturelle dans cette affirmation générale.
- source_word: οὕτως διαμένει
  choice: demeure ainsi
  rationale: Cette expression garde à la fois l’idée de continuité exprimée par διαμένει et la référence à un état inchangé portée par οὕτως.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: depuis le commencement de la création
  rationale: La formulation suit étroitement la construction grecque tout en étant idiomatique en français.
theological_decisions:
- issue: Sens de παρουσία dans le contexte eschatologique
  choice: sa venue
  alternative: sa présence ; son arrivée
  rationale: Le contexte porte sur l’accomplissement futur attendu et tourné en dérision par les moqueurs. « Venue » communique ce sens sans effacer les autres valeurs lexicales possibles, signalées en note.
- issue: Métaphore de la mort dans ἐκοιμήθησαν
  choice: se sont endormis
  alternative: sont morts
  rationale: Le texte source choisit une métaphore conventionnelle plutôt que le terme explicite pour mourir. La conserver respecte la texture du passage sans lui imposer une explication doctrinale.
- issue: Identité des οἱ πατέρες
  choice: les pères
  alternative: les ancêtres ; nos pères
  rationale: Le texte ne comporte aucun possessif et ne précise pas explicitement le groupe visé. « Les pères » préserve cette indétermination au lieu de trancher en faveur d’une identification particulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde le ton provocateur des moqueurs. « Les pères » conserve délibérément l’ambiguïté du grec, tandis que « tout demeure ainsi » reste proche de l’affirmation de continuité du texte source.
