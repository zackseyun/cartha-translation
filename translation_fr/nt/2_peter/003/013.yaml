id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: fr
  text: Mais, conformément à sa promesse, nous attendons de nouveaux cieux et une nouvelle terre, où la justice[a] habite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: de nouveaux cieux et une nouvelle terre
  rationale: « Nouveau » préserve la portée qualitative de καινός sans imposer l’interprétation plus précise de « renouvelé ». « Cieux » et « terre » maintient le langage cosmique biblique et l’écho d’Ésaïe 65.17 et 66.22.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la destruction évoquée au verset précédent.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: conformément à sa promesse
  rationale: κατά avec l’accusatif exprime l’accord avec une norme ou une parole donnée. Cette formulation est naturelle en français et conserve la référence à la promesse de Dieu.
- source_word: προσδοκῶμεν
  choice: nous attendons
  rationale: Le présent exprime une attente continue et confiante. Le français simple « nous attendons » convient au contexte futur.
- source_word: ἐν οἷς
  choice: où
  rationale: Le relatif grec pluriel renvoie collectivement aux nouveaux cieux et à la nouvelle terre. « Où » évite en français un accord difficile tout en désignant clairement la nouvelle création.
- source_word: δικαιοσύνη
  choice: la justice
  rationale: En français moderne, « justice » couvre naturellement ici à la fois ce qui est juste devant Dieu et l’ordre juste caractérisant la nouvelle création. « Droiture » demeure une nuance possible et est signalée en note.
- source_word: κατοικεῖ
  choice: habitera
  rationale: Le présent grec peut décrire la réalité caractéristique du monde attendu. Le futur est idiomatique en français puisque la principale porte sur une création à venir, et « habiter » conserve l’image d’une présence établie.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le contexte eschatologique
  choice: justice
  alternative: droiture
  rationale: '« Justice » est le correspondant français biblique le plus large et le plus naturel pour δικαιοσύνη dans ce contexte : il peut désigner tant la conformité à ce qui est droit devant Dieu que l’ordre juste de la nouvelle création. « Droiture » met davantage l’accent sur la qualité morale et reste une nuance légitime.'
- issue: Valeur temporelle de κατοικεῖ
  choice: habitera
  alternative: habite
  rationale: Le grec emploie le présent, mais il caractérise les cieux et la terre encore attendus. Le futur rend naturellement cette orientation eschatologique en français sans nier la force descriptive du présent grec.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le contraste, le langage cosmique biblique et l’image de la justice qui établit sa demeure, sans préciser si la création sera entièrement nouvelle ou renouvelée.
