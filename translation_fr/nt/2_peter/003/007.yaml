source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: fr
  text: Mais les cieux et la terre actuels sont réservés par la même parole, gardés pour le feu jusqu’au jour du jugement et de la destruction des personnes impies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Mais les cieux et la terre d’à présent
  rationale: « Mais » marque le contraste avec le monde ancien évoqué auparavant. « D’à présent » rend νῦν et désigne l’ordre créé actuel; le pluriel de οὐρανοί est conservé.
- source_word: τῷ αὐτῷ λόγῳ
  choice: par la même parole
  rationale: Le datif est compris comme instrumental, et « la même » conserve le renvoi à la parole efficace de Dieu mentionnée dans le contexte.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: sont mis en réserve
  rationale: Cette tournure exprime l’état présent résultant d’une action accomplie, conformément à la construction périphrastique au parfait.
- source_word: πυρὶ τηρούμενοι
  choice: gardés pour le feu
  rationale: τηρέω signifie ici garder ou réserver, tandis que le datif πυρί indique la destination. « Gardés » évite de répéter « réserve ».
- source_word: εἰς ἡμέραν κρίσεως
  choice: jusqu’au jour du jugement
  rationale: « Jusqu’au » rend naturellement la portée temporelle et le terme vers lequel cette conservation est orientée.
- source_word: καὶ ἀπωλείας
  choice: et de la destruction
  rationale: « Destruction » transmet clairement le sens d’ἀπώλεια sans lui imposer une définition théologique technique.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: des hommes impies
  rationale: « Impies » rend ἀσεβῶν. « Hommes » correspond à ἀνθρώπων, qui peut représenter ici les êtres humains en général; cette portée est explicitée en note.
theological_decisions:
- issue: Nature de la fin liée au feu
  choice: Le verset présente les cieux et la terre actuels comme gardés en vue d’un jugement futur par le feu, sans préciser s’il s’agit de leur anéantissement ou de leur renouvellement transformateur.
  alternative: Comprendre le passage soit comme un anéantissement cosmique total, soit comme une purification et une transformation de la création.
  rationale: Le complément « des hommes impies » rattache explicitement la destruction aux impies. La traduction ne tranche donc pas, au-delà de ce que dit le verset, la question du sort final de la création.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les deux participes et la progression du grec sans alourdir inutilement la phrase.
