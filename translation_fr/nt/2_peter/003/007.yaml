  naturalness: « Les cieux et la terre d’à présent » est lourd et inhabituel. « Les cieux et la terre actuels » est plus idiomatique tout en maintenant le contraste avec le monde antérieur. « Sont réservés » rend naturellement τεθησαυρισμένοι sans compromettre la distinction avec « gardés ».
  terminology: « Parole », « feu », « jugement » et « destruction » conviennent. Pour ἀνθρώπων, « personnes » rend mieux en français moderne la portée humaine générique que « hommes », qui risque d’être reçu comme exclusivement masculin. Aucune note n’est nécessaire si cette portée est rendue directement dans le texte.
