source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: fr
  text: Bien-aimés, c’est déjà la deuxième lettre que je vous écris. Dans l’une comme dans l’autre[a], je réveille votre esprit sincère par des rappels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans lesquelles » ; le pronom grec est pluriel et renvoie le plus naturellement aux deux lettres.
    reason: alternative_reading
  - marker: b
    text: Ou « votre esprit pur » ; le grec peut aussi désigner la pensée ou l’intelligence.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une affection profonde et conserve la portée épistolaire du terme grec, tout en restant intelligible en français courant.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: c’est déjà la deuxième lettre
  rationale: La syntaxe est réorganisée pour être naturelle en français, tandis que « déjà » rend ἤδη et que la lettre présente est clairement identifiée comme la deuxième.
- source_word: γράφω
  choice: que je vous écris
  rationale: Le présent français convient naturellement à l’acte épistolaire en cours et intègre explicitement le complément ὑμῖν.
- source_word: ἐν αἷς
  choice: Dans l’une comme dans l’autre
  rationale: Le relatif grec est au pluriel féminin et renvoie le plus naturellement aux deux lettres. Cette formulation française exprime clairement que la démarche décrite vaut pour chacune d’elles.
- source_word: διεγείρω
  choice: j’éveille
  rationale: Le verbe évoque l’action de réveiller ou de susciter une attention renouvelée. « J’éveille » garde cette image sans l’alourdir.
- source_word: ἐν ὑπομνήσει
  choice: par un rappel
  rationale: La préposition exprime ici le moyen ou la manière. La formulation est concise et fidèle au substantif ὑπόμνησις.
- source_word: εἰλικρινῆ διάνοιαν
  choice: votre pensée sincère
  rationale: διάνοια désigne la pensée, l’intelligence ou la disposition mentale, tandis que εἰλικρινής peut exprimer la sincérité ou la pureté. Le texte principal retient une formulation naturelle sans effacer l’autre nuance, signalée en note.
theological_decisions:
- issue: Référent du relatif pluriel ἐν αἷς
  choice: Le relatif renvoie aux deux lettres écrites aux destinataires.
  alternative: Le pluriel pourrait être compris de façon moins stricte comme renvoyant seulement à la lettre présente.
  rationale: L’accord féminin pluriel renvoie grammaticalement de la manière la plus directe aux deux lettres mentionnées. « Dans l’une comme dans l’autre » explicite ce rapport sans en tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Bien-aimés » conserve la chaleur solennelle de l’adresse ; le reste de la phrase privilégie une syntaxe claire tout en maintenant l’image de l’éveil et l’ambiguïté de εἰλικρινής entre sincérité et pureté.
