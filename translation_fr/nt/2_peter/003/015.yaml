id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: fr
  text: Considérez la patience de notre Seigneur comme un salut[a], tout comme notre frère bien-aimé Paul vous a lui aussi écrit, selon la sagesse qui lui a été donnée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme salut ». Le délai du Seigneur sert son dessein de salut ; il ne traduit pas de l’indifférence.'
    reason: clarification
  - marker: b
    text: La sagesse a vraisemblablement été donnée par Dieu, mais le grec ne précise pas qui l’a donnée.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: patience
  rationale: Le nom désigne ici la retenue patiente du Seigneur, particulièrement son délai avant le jugement. « Patience » est naturel en français moderne et convient au contexte.
- source_word: σωτηρίαν
  choice: un moyen de salut
  rationale: Le grec établit un rapport prédicatif avec la patience du Seigneur. « Un moyen de salut » exprime naturellement en français que ce délai sert le dessein salvateur, sans réduire σωτηρία à une simple occasion.
- source_word: ἡγεῖσθε
  choice: Considérez ... comme
  rationale: L’impératif demande aux lecteurs d’évaluer ou de tenir une réalité pour une autre; cette tournure restitue clairement la construction prédicative.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: « Seigneur » conserve le titre christologique usuel et la force de l’expression grecque.
- source_word: ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος
  choice: notre frère bien-aimé Paul
  rationale: Cette formulation préserve l’affection exprimée par ἀγαπητός tout en restant digne et idiomatique.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: selon la sagesse qui lui a été donnée
  rationale: « Selon » marque la conformité exprimée par κατά. Le passif est conservé sans préciser l’agent, comme dans le grec.
- source_word: ἔγραψεν ὑμῖν
  choice: vous l’a ... écrit
  rationale: Le passé composé est naturel en français pour évoquer un écrit antérieur toujours pertinent. Le pronom « l’ » reprend le même enseignement sans ajouter de contenu doctrinal.
- source_word: καθὼς καὶ
  choice: tout comme ... lui aussi
  rationale: La formulation garde à la fois la comparaison et la nuance additive des particules grecques.
theological_decisions:
- issue: Agent de la sagesse donnée à Paul
  choice: Conserver le passif « qui lui a été donnée » sans ajouter « par Dieu ».
  alternative: « selon la sagesse que Dieu lui a donnée »
  rationale: L’agent divin est vraisemblablement sous-entendu, mais il n’est pas exprimé dans le grec; la traduction maintient cette réserve.
- issue: Rapport entre la patience du Seigneur et le salut
  choice: « Considérez la patience ... comme un moyen de salut »
  alternative: « Considérez la patience ... comme le salut »
  rationale: Le grec associe directement la patience au salut dans sa finalité. La formulation française choisie évite l’impression d’une identité abstraite entre patience et salut, tout en conservant le dessein salvateur du délai.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans calque lourd; « bien-aimé » conserve la chaleur fraternelle du texte.
