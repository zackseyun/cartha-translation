source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: fr
  text: Le Seigneur ne tarde pas à accomplir la promesse, comme certains le pensent ; au contraire, il est patient envers vous[a], ne voulant pas que qui que ce soit périsse, mais que tous parviennent à la repentance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La portée de « qui que ce soit » et de « tous » reste formulée comme dans le grec. Les interprètes divergent : Pierre vise-t-il particulièrement ses lecteurs ou, plus largement, l’humanité ?'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: le Seigneur
  rationale: Rend naturellement le titre divin en français, avec l’article requis par l’usage.
- source_word: οὐ βραδύνει … τῆς ἐπαγγελίας
  choice: ne tarde pas à accomplir la promesse
  rationale: Le français demande ici une formulation idiomatique. « Accomplir » explicite la relation implicite entre le retard et la promesse sans préciser davantage son contenu.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: comme certains estiment qu’il tarde
  rationale: Préserve la reprise de l’idée de retard tout en évitant le tour peu naturel « considèrent un retard ».
- source_word: μακροθυμεῖ
  choice: fait preuve de patience
  rationale: Exprime la retenue patiente dans un français moderne et digne.
- source_word: εἰς ὑμᾶς
  choice: envers vous
  rationale: Conserve l’orientation de la patience vers les destinataires sans lui attribuer explicitement une valeur causale ou finale.
- source_word: μὴ βουλόμενός
  choice: il ne veut pas
  rationale: Rend directement la volonté ou le désir exprimé par βούλομαι, sans introduire une catégorie théologique technique.
- source_word: τινας ἀπολέσθαι
  choice: que certains périssent
  rationale: « Certains » maintient le parallélisme lexical avec πάντας et laisse ouverte la portée du groupe visé ; « périssent » conserve la gravité du verbe.
- source_word: πάντας
  choice: tous
  rationale: Préserve la formulation concise et non explicitée du grec.
- source_word: εἰς μετάνοιαν χωρῆσαι
  choice: parviennent à la repentance
  rationale: χωρέω décrit ici l’accès à un état ; « parvenir à » en conserve la nuance, tandis que « repentance » est le terme français courant dans ce contexte biblique.
theological_decisions:
- issue: Portée de « vous », « certains » et « tous »
  choice: Conserver les référents sans les restreindre ni les élargir dans la traduction.
  alternative: Comprendre « certains » et « tous » soit exclusivement des destinataires ou des élus, soit explicitement de toute l’humanité.
  rationale: Le grec ne précise pas davantage la portée de ces termes. La traduction maintient donc l’ambiguïté et la tension théologique du texte.
- issue: Force de βουλόμενος concernant la volonté divine
  choice: il ne veut pas
  alternative: il ne décrète pas / il ne souhaite pas
  rationale: « Veut » exprime la volition sans imposer une distinction systématique entre différents sens de la volonté divine.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde l’opposition rhétorique entre le retard apparent et la patience du Seigneur. Le point-virgule et les deux-points rendent lisible la progression logique sans supprimer l’ambiguïté théologique.
