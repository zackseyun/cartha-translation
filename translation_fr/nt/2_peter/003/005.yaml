  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: fr
  text: 'En effet, ils choisissent d’ignorer ceci : autrefois, il y avait des cieux et la terre, qui avait été formée hors de l’eau et au moyen de l’eau par la parole de Dieu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par l’ordre de Dieu ». Plus littéralement : « par la parole de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: En effet, ils choisissent d’ignorer ceci
  rationale: La tournure associe le fait de ne pas reconnaître quelque chose à une disposition volontaire. Cette formulation française exprime clairement les dimensions cognitive et volitive sans suggérer une simple ignorance accidentelle.
- source_word: οὐρανοὶ ἦσαν ἔκπαλαι
  choice: autrefois, il y avait des cieux
  rationale: Le pluriel « des cieux » respecte οὐρανοί, tandis que « autrefois » rend naturellement ἔκπαλαι. La construction existentielle est idiomatique en français.
- source_word: γῆ
  choice: la terre
  rationale: Malgré l’absence d’article en grec, le français désigne naturellement par « la terre » le monde créé dont parle l’argument; « une terre » risquerait de suggérer une planète parmi plusieurs.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: hors de l’eau et au moyen de l’eau
  rationale: « Hors de » préserve la valeur de provenance de ἐκ, et « au moyen de » explicite la valeur instrumentale probable de διά tout en maintenant la distinction entre les deux prépositions.
- source_word: συνεστῶσα
  choice: avait été formée
  rationale: Dans ce contexte de création, « formée » rend naturellement la constitution ou l’établissement de la terre. Le plus-que-parfait relie cette formation au passé ancien évoqué dans la proposition.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: par la parole de Dieu
  rationale: Le complément instrumental est rendu par « par ». « La parole de Dieu » conserve λόγος sans le réduire explicitement à un ordre ni en faire un titre christologique.
theological_decisions:
- issue: Faut-il rendre λόγῳ de manière à évoquer explicitement le Logos personnel ?
  choice: par la parole de Dieu
  alternative: sur l’ordre de Dieu
  rationale: Dans le contexte, il s’agit de l’efficacité créatrice de la parole divine, sans que λόγος soit explicitement employé comme titre du Fils. La traduction garde la formulation ouverte et n’ajoute aucune identification christologique absente du verset.
- issue: Rapport de la terre à l’eau dans ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: hors de l’eau et au moyen de l’eau
  alternative: de l’eau et à travers l’eau
  rationale: La traduction conserve les deux rapports prépositionnels sans imposer une reconstruction cosmologique plus précise que le texte grec.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe demeure lisible tout en conservant le pluriel « cieux », la distinction entre ἐκ et διά, et l’ambiguïté théologique de λόγος.
