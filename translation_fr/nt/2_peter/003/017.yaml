id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: fr
  text: Vous donc, bien-aimés, sachant cela d’avance, soyez sur vos gardes, de peur que, entraînés par l’égarement des sans-loi, vous ne perdiez votre propre fermeté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre propre stabilité » ou « votre propre constance ». Le grec στηριγμός désigne la fermeté, la stabilité ou la constance d’une position.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Vous donc
  rationale: Conserve la transition déductive marquée par οὖν et l’emphase du pronom explicite ὑμεῖς, dans un ordre français digne et intelligible.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Préserve l’affection pastorale et le registre épistolaire du vocatif grec.
- source_word: προγινώσκοντες
  choice: puisque vous en êtes avertis d’avance
  rationale: Le participe exprime une connaissance préalable qui, dans le contexte, a valeur d’avertissement; « en » renvoie naturellement aux faits déjà exposés.
- source_word: φυλάσσεσθε
  choice: soyez sur vos gardes
  rationale: Rend de façon idiomatique l’impératif présent moyen et son appel à une vigilance continue concernant les destinataires eux-mêmes.
- source_word: ἵνα μὴ
  choice: de peur que ... ne
  rationale: Expression française naturelle d’une mise en garde orientée vers l’évitement d’un résultat.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: par l’égarement de ceux qui méprisent toute règle
  rationale: πλάνη désigne l’erreur ou l’égarement. ἄθεσμοι caractérise des personnes qui refusent les normes établies; cette formulation évite le faux sens moderne que pourrait suggérer « sans-loi ».
- source_word: συναπαχθέντες
  choice: entraînés
  rationale: Préserve la voix passive et l’idée d’être emporté avec d’autres, sans alourdir la phrase française.
- source_word: ἐκπέσητε
  choice: vous ne perdiez
  rationale: Dans la construction avec le génitif, exprime le fait de déchoir d’une position ou de perdre sa fermeté, sans préciser davantage la portée doctrinale de la mise en garde.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: votre propre fermeté
  rationale: στηριγμός désigne la stabilité ou la fermeté; « fermeté » est naturel ici et ἰδίου est conservé par « propre ».
theological_decisions:
- issue: 'La portée de ἐκπέσητε : apostasie ou perte plus générale de fermeté'
  choice: « vous ne perdiez votre propre fermeté »
  alternative: « vous ne déchiez de votre propre fermeté » ou « vous ne tombiez de votre position ferme »
  rationale: Le grec formule une réelle possibilité de perdre une position stable, mais ne définit pas explicitement cette perte comme la perte du salut. La traduction maintient donc la force de l’avertissement sans trancher un débat doctrinal.
- issue: Le référent moral de ἀθέσμων
  choice: « ceux qui méprisent toute règle »
  alternative: « les hommes sans principes » ou « les impies »
  rationale: Le terme met l’accent sur le mépris des normes légitimes plutôt que sur une catégorie doctrinale précise; la formulation retenue conserve cette nuance morale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’adresse emphatique et affectueuse, tout en préférant des tours idiomatiques (« avertis d’avance », « soyez sur vos gardes »). La formulation évite d’attribuer à ἐκπέσητε une conclusion sotériologique plus précise que celle qu’impose le grec.
