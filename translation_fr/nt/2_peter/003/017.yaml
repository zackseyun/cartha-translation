- from: Vous donc, bien-aimés, puisque vous en êtes avertis d’avance, soyez sur vos gardes, de peur qu’entraînés par l’égarement de ceux qui méprisent toute règle, vous ne perdiez votre propre fermeté.[a]
  to: Vous donc, bien-aimés, sachant cela d’avance, soyez sur vos gardes, de peur que, entraînés par l’égarement des sans-loi, vous ne perdiez votre propre fermeté.[a]
  rationale: La révision rétablit une formulation plus directement fidèle à προγινώσκοντες et évite de surinterpréter ἀθέσμων. Elle conserve l’avertissement réel du texte et la neutralité doctrinale de « perdiez votre propre fermeté ». L’ancre de note demeure correctement placée sur le terme auquel elle se rapporte.
