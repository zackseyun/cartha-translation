  variant: modern international French
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: fr
  text: C’est pourquoi, bien-aimés, puisque vous attendez ces choses, faites tous vos efforts pour qu’il vous trouve sans tache et irréprochables dans la paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour être trouvés devant lui sans tache et irréprochables dans la paix ». Le datif grec peut désigner l’agent (« qu’il vous trouve ») ou exprimer la référence ou la présence (« devant lui »).'
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’attente du jour du Seigneur et des réalités promises dans le contexte précédent.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Conserve l’affection de l’adresse et le registre épistolaire digne du grec.
- source_word: ταῦτα προσδοκῶντες
  choice: puisque vous attendez ces choses
  rationale: Rend l’attente continue ainsi que la valeur circonstancielle, probablement causale, du participe, sans préciser davantage le référent de « ces choses ».
- source_word: σπουδάσατε
  choice: faites tous vos efforts
  rationale: Exprime clairement l’empressement et l’application énergique demandés par l’impératif.
- source_word: ἄσπιλοι καὶ ἀμώμητοι
  choice: sans tache et irréprochables
  rationale: Préserve à la fois l’image de l’absence de souillure et l’idée d’intégrité ne donnant prise à aucun reproche.
- source_word: αὐτῷ εὑρεθῆναι
  choice: pour qu’il vous trouve
  rationale: Transposition française naturelle de l’infinitif passif avec datif d’agent; le pronom garde implicite l’identité du sujet divin, comme dans le grec.
- source_word: ἐν εἰρήνῃ
  choice: dans la paix
  rationale: Reste proche du grec et préserve l’ouverture entre paix intérieure, relationnelle, communautaire ou situation de réconciliation.
theological_decisions:
- issue: Valeur du datif αὐτῷ et identité de son référent
  choice: « pour qu’il vous trouve »
  alternative: « pour être trouvés devant lui »
  rationale: Le datif peut marquer l’agent du passif ou la référence/la présence. Le texte principal retient l’agent, lecture naturelle dans cette construction, tout en laissant le référent divin implicite; l’autre analyse est signalée en note afin de préserver l’ambiguïté réelle.
- issue: Portée de ἐν εἰρήνῃ
  choice: « dans la paix » sans complément explicatif
  alternative: « en paix avec lui »
  rationale: Le grec ne précise ni l’objet ni la dimension de cette paix. Ajouter « avec lui » résoudrait indûment une formulation ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. « Bien-aimés » maintient la chaleur pastorale sans familiarité excessive. La virgule avant « dans la paix » aide à rattacher cette expression à l’état global dans lequel les destinataires doivent être trouvés, plutôt qu’aux seuls adjectifs.
