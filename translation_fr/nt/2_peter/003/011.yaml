  - severity: low
    issue: « sont ainsi en train de se dissoudre » est plus pesant que nécessaire.
    rationale: Le présent français « se dissolvent ainsi » exprime naturellement le participe présent passif dans ce contexte.
  revised_text: Puisque toutes ces choses se dissolvent ainsi[a], quel genre de personnes devez-vous être, dans une conduite sainte et pieuse,
