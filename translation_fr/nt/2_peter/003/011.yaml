  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: fr
  text: Puisque toutes ces choses se dissolvent ainsi[a], quel genre de personnes devez-vous être, dans une conduite sainte et pieuse,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sont détruites » ; le grec évoque plus littéralement des choses qui se « dissolvent » ou se « défont ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: toutes ces choses
  rationale: Le génitif renvoie aux réalités créées mentionnées dans le contexte immédiat. « Choses » explicite naturellement le référent sous-entendu en français.
- source_word: οὕτως
  choice: ainsi
  rationale: Cet adverbe précise la manière dont s’opère la dissolution. « Ainsi » est concis, naturel et fidèle à sa fonction.
- source_word: λυομένων
  choice: sont ... en train de se dissoudre
  rationale: Le participe présent passif de λύω évoque ici la désagrégation ou le dénouement de l’ordre présent. Cette formulation conserve à la fois l’aspect progressif et l’image de la dissolution sans renforcer le verbe en « détruire ».
- source_word: ποταποὺς
  choice: quelle sorte de personnes
  rationale: Dans cette question rhétorique, ποταπός porte sur la qualité des personnes que les destinataires doivent être. La formulation française conserve cette force éthique.
- source_word: δεῖ
  choice: devez-vous
  rationale: δεῖ exprime une nécessité. « Devez-vous » rend naturellement cette obligation morale dans la tournure interrogative française.
- source_word: ὑπάρχειν
  choice: être
  rationale: Avec δεῖ et ὑμᾶς, le verbe désigne ce que les destinataires sont appelés à être. « Être » est l’équivalent français le plus direct.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: par une conduite sainte
  rationale: ἀναστροφή désigne la conduite ou la manière de vivre. Le singulier collectif est idiomatique en français, et « par » exprime comment cette qualité personnelle se manifeste.
- source_word: εὐσεβείαις
  choice: une vie de piété
  rationale: εὐσέβεια désigne une dévotion respectueuse envers Dieu qui se manifeste dans la vie. « Une vie de piété » évite une coordination française maladroite tout en rendant sa portée pratique.
theological_decisions:
- issue: Description eschatologique du sort du monde présent
  choice: sont ainsi en train de se dissoudre
  alternative: sont ainsi détruites
  rationale: Le grec parle littéralement de déliaison ou de dissolution. Le contexte est celui du bouleversement eschatologique, mais la traduction ne doit pas intensifier le terme en choisissant d’emblée « détruire ».
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique est conservée et reçoit un point d’exclamation pour en faire ressortir la force exhortative, tout en maintenant la structure ouverte vers le verset suivant.
