  source_fidelity: 'Le sens général est bien rendu : la proposition génitive absolue introduit la dissolution de « toutes ces choses », suivie de la question sur le genre de personnes que les destinataires doivent être. Toutefois, « par une conduite sainte et une vie de piété » transforme trop librement le complément grec en indication de moyen et dilue la coordination des deux domaines éthiques. La ponctuation exclamative clôt aussi indûment une phrase qui reste grammaticalement ouverte vers le verset suivant.'
