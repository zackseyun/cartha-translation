  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: fr
  text: C’est par ces réalités[a] que le monde d’alors, submergé par l’eau, a péri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par ces moyens ». Le relatif grec est au pluriel et renvoie aux réalités mentionnées au verset précédent, sans préciser davantage son antécédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a été détruit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: C’est par eux que
  rationale: διά avec le génitif exprime ici le moyen. Le pronom relatif grec est au pluriel et renvoie, sans en préciser davantage la portée, aux réalités mentionnées au verset précédent. Le masculin pluriel français « eux » permet ce renvoi ouvert.
- source_word: ὁ τότε κόσμος
  choice: le monde d’alors
  rationale: Cette formulation naturelle conserve le contraste temporel entre le monde de l’époque du déluge et le monde présent évoqué dans le contexte.
- source_word: ὕδατι
  choice: par l’eau
  rationale: Le datif indique le moyen par lequel le monde a été submergé; « par l’eau » rend clairement cette valeur instrumentale.
- source_word: κατακλυσθεὶς
  choice: submergé
  rationale: Le participe passif aoriste décrit le monde comme ayant été recouvert ou englouti par les eaux. « Submergé » est courant, digne et évite d’ajouter le nom « déluge », absent de la proposition grecque.
- source_word: ἀπώλετο
  choice: a péri
  rationale: Le verbe moyen à sens intransitif signifie ici « périr » ou « être détruit ». « A péri » conserve la force du jugement sans imposer l’idée d’un anéantissement métaphysique.
theological_decisions:
- issue: Nature du jugement par les eaux
  choice: a péri
  alternative: a été détruit
  rationale: Le grec décrit la ruine catastrophique du monde d’alors, mais ne tranche pas en faveur d’un anéantissement absolu. « A péri » préserve cette tension.
- issue: Référent pluriel de δι’ ὧν
  choice: par eux
  alternative: par ces moyens
  rationale: Le relatif pluriel renvoie aux éléments du verset précédent, mais son antécédent précis peut être compris de plusieurs manières. La traduction conserve ce renvoi plutôt que de l’expliciter doctrinalement.
translation_notes:
  register: Français international moderne, naturel et soutenu. La phrase conserve le pronom pluriel et l’ambiguïté de son référent, ainsi que la nuance entre « périr » et « être détruit ».
