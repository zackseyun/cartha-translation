id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: fr
  text: pour que vous vous souveniez des paroles prononcées d’avance[b] par les saints prophètes, ainsi que du commandement du Seigneur et Sauveur transmis par vos apôtres[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du commandement de vos apôtres, venant du Seigneur et Sauveur ». L’enchaînement des génitifs grecs permet plusieurs formulations naturelles en français.
    reason: alternative_reading
  - marker: b
    text: Ou « des paroles dites auparavant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: pour que vous vous souveniez
  rationale: L’infinitif aoriste passif de forme, mais de sens déponent, exprime ici le but dans la continuité du verset précédent. Cette tournure est naturelle en français et conserve l’idée de garder consciemment en mémoire.
- source_word: προειρημένων ῥημάτων
  choice: des paroles prononcées d’avance
  rationale: Cette traduction exprime l’antériorité de l’énoncé sans réduire le verbe au sens plus étroit de prédiction prophétique.
- source_word: ῥημάτων
  choice: paroles
  rationale: « Paroles » convient à des propos énoncés et reste clair dans un registre biblique moderne.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: par les saints prophètes
  rationale: La construction passive et la qualification des prophètes sont rendues directement et naturellement.
- source_word: ἐντολῆς
  choice: commandement
  rationale: Le singulier grec est conservé, ainsi que la force d’une prescription revêtue d’autorité.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: de vos apôtres
  rationale: L’ordre et la relation génitive les plus immédiats relient « vos » aux apôtres, c’est-à-dire aux apôtres connus des destinataires ou envoyés auprès d’eux.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: venant du Seigneur et Sauveur
  rationale: « Venant de » indique que le commandement a pour source le Seigneur et Sauveur, tout en évitant de fournir un possessif absent du grec.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » conserve le titre néotestamentaire établi et sa portée d’autorité.
- source_word: σωτῆρος
  choice: Sauveur
  rationale: « Sauveur » est l’équivalent français courant et théologiquement adéquat dans ce contexte christologique.
theological_decisions:
- issue: Relation de ὑμῶν dans τῶν ἀποστόλων ὑμῶν
  choice: « vos » qualifie « apôtres »
  alternative: « le commandement qui vous a été donné par les apôtres »
  rationale: L’ordre des mots rattache le plus naturellement ὑμῶν à ἀποστόλων. L’expression désigne les apôtres liés aux destinataires sans suggérer une propriété au sens moderne.
- issue: Relation syntaxique de τοῦ κυρίου καὶ σωτῆρος
  choice: Le commandement vient du Seigneur et Sauveur et est communiqué par les apôtres
  alternative: Les apôtres sont ceux du Seigneur et Sauveur
  rationale: 'Le rattachement à ἐντολῆς donne une chaîne cohérente : le Seigneur et Sauveur est la source du commandement, tandis que les apôtres le transmettent. La note conserve l’autre formulation naturelle permise par l’enchaînement des génitifs.'
translation_notes:
  register: Français international moderne, clair et digne. « Prononcées d’avance » évite de limiter les paroles prophétiques à des prédictions, tandis que « commandement » maintient leur parallèle avec une parole apostolique revêtue d’autorité.
