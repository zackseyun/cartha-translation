  to: C’est ce qu’il fait aussi dans toutes ses lettres, où il parle de ces sujets. On y trouve certains passages difficiles à comprendre, que les personnes sans instruction[b] et instables déforment[c], comme elles le font aussi avec le reste des Écritures[a], pour leur propre destruction.
  rationale: La révision remplace le tour français peu naturel par une formulation idiomatique et rend ἀπώλειαν par « destruction », terme plus fidèle à la gravité du grec. Elle conserve l’ambiguïté lexicale de λοιπάς dans la note, les ancres de notes et l’implication textuelle du rapprochement des lettres avec les Écritures.
