id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: fr
  text: C’est ce qu’il fait aussi dans toutes ses lettres, où il parle de ces sujets. On y trouve certains passages difficiles à comprendre, que les personnes sans instruction[b] et instables déforment[c], comme elles le font aussi avec le reste des Écritures[a], pour leur propre destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les autres Écritures ». Le grec peut signifier « le reste » ou « les autres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ignorantes ».
    reason: lexical_alternative
  - marker: c
    text: Ou « tordent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: lettres
  rationale: « Lettres » est le terme courant et naturel en français moderne pour une correspondance écrite, contrairement à « épîtres », plus traditionnel.
- source_word: λαλῶν
  choice: où il parle
  rationale: Préserve l’idée littérale de « parler » tout en l’intégrant naturellement au contexte des lettres.
- source_word: περὶ τούτων
  choice: de ces sujets
  rationale: Renvoie clairement et naturellement aux questions évoquées dans le contexte précédent.
- source_word: δυσνόητά τινα
  choice: certains passages difficiles à comprendre
  rationale: « Certains passages » convient au contenu de lettres et restitue l’indéfini τινα ainsi que la difficulté de compréhension exprimée par δυσνόητα.
- source_word: ἀμαθεῖς
  choice: personnes sans instruction
  rationale: Exprime le manque d’enseignement ou de connaissance sans suggérer nécessairement l’analphabétisme ni employer le terme potentiellement méprisant « ignorants ».
- source_word: ἀστήρικτοι
  choice: instables
  rationale: Rend le manque d’affermissement personnel ou doctrinal sans préciser davantage que le grec.
- source_word: στρεβλοῦσιν
  choice: déforment
  rationale: Restitue l’image de quelque chose que l’on tord en une formulation idiomatique et claire en français.
- source_word: τὰς λοιπὰς γραφὰς
  choice: le reste des Écritures
  rationale: Le pluriel γραφαί désigne ici naturellement les Écritures, et λοιπάς présente ces écrits comme le reste ou les autres membres de cette catégorie.
- source_word: ἀπώλειαν
  choice: perte
  rationale: « Perte » garde la gravité et l’étendue sémantique de ἀπώλεια sans imposer le terme théologique marqué « perdition »; « destruction » demeure possible.
theological_decisions:
- issue: Statut scripturaire implicite dans τὰς λοιπὰς γραφὰς
  choice: le reste des Écritures
  alternative: les autres Écritures
  rationale: Cette formulation conserve l’implication naturelle selon laquelle les lettres de Paul sont rapprochées des autres écrits scripturaires, sans développer une affirmation doctrinale au-delà du texte grec.
- issue: Portée de ἀπώλεια
  choice: pour leur propre perte
  alternative: pour leur propre destruction
  rationale: « Perte » préserve la gravité du résultat tout en laissant ouverte la portée exacte du terme dans ce verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement réorganisée en deux phrases pour une lecture naturelle. « C’est ce qu’il fait » reprend le lien comparatif initial ὡς καί avec le verset précédent; le verset isolé dépend donc explicitement de son contexte. Tous les marqueurs de notes figurent immédiatement après les expressions concernées.
