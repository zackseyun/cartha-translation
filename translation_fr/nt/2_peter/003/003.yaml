  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: fr
  text: sachant avant tout que, dans les derniers jours, des moqueurs viendront en se moquant[a], vivant selon leurs propres désirs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des railleurs viendront avec raillerie ». Le grec emploie deux mots de même famille pour insister : « moqueurs » et « se moquant ».'
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « convoitises ». Le terme grec peut désigner toutes sortes de désirs intenses, et pas seulement le désir sexuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: sachant avant tout que
  rationale: Le participe grec est conservé par « sachant », tandis que « avant tout » rend naturellement πρῶτον. La tournure reste liée au contexte syntaxique précédent sans transformer le participe en impératif.
- source_word: ἐλεύσονται
  choice: viendront
  rationale: Le futur de ἔρχομαι se rend directement et naturellement par « viendront ».
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: dans les derniers jours
  rationale: Cette formulation française courante conserve la portée temporelle et eschatologique de l’expression grecque sans lui imposer un calendrier doctrinal précis.
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: des moqueurs viendront avec leurs moqueries
  rationale: « Moqueurs » et « moqueries » reproduisent l’insistance créée en grec par deux mots de même famille. L’expression demeure compréhensible en français moderne.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: selon leurs propres désirs
  rationale: « Désirs » garde l’étendue sémantique de ἐπιθυμίαι, qui désigne ici des aspirations moralement désordonnées sans être nécessairement limitées au domaine sexuel. « Leurs propres » préserve l’emphase possessive.
- source_word: πορευόμενοι
  choice: vivant
  rationale: Dans ce contexte, le participe décrit la conduite habituelle. « Vivant » exprime clairement cette valeur idiomatique en français, là où le calque « marchant » serait moins naturel.
theological_decisions:
- issue: Portée eschatologique de ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: dans les derniers jours
  alternative: à la fin des jours
  rationale: La traduction retient l’expression eschatologique conventionnelle tout en laissant ouverte la délimitation exacte de cette période; elle n’introduit aucun système particulier concernant la fin des temps.
- issue: Portée morale de ἐπιθυμίαι
  choice: leurs propres désirs
  alternative: leurs propres convoitises
  rationale: « Désirs » conserve le sens large du terme grec et le contexte fournit sa coloration négative. « Convoitises » rendrait cette valeur morale plus explicite, mais pourrait réduire indûment la gamme des aspirations visées.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « moqueurs… moqueries » est volontaire afin de conserver l’insistance lexicale du grec. « Vivant » privilégie une expression française naturelle de la conduite habituelle.
