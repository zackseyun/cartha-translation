id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: fr
  text: Mais le jour du Seigneur viendra comme un voleur ; ce jour-là, les cieux passeront avec fracas, les éléments[a], enflammés, seront dissous, et la terre et les œuvres qui s’y trouvent seront trouvées[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les corps célestes » ; le terme grec peut désigner plus précisément les composantes du cosmos dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « seront trouvées ». Certains comprennent cette expression au sens de « seront mises à nu » ou « seront dévoilées ».'
    reason: alternative_reading
  - marker: c
    text: 'De nombreux manuscrits portent : « seront consumées » au lieu de « seront trouvées ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: viendra
  rationale: Le futur de ἥκω signifie ici « venir »; cette formulation naturelle convient à l’attente eschatologique du jour du Seigneur.
- source_word: ἡμέρα κυρίου
  choice: le jour du Seigneur
  rationale: Expression eschatologique consacrée dans les écrits prophétiques et apostoliques; elle ne désigne pas ici un jour hebdomadaire de culte.
- source_word: κλέπτης
  choice: un voleur
  rationale: Le terme souligne le caractère inattendu de la venue et conserve l’image biblique habituelle.
- source_word: ἐν ᾗ
  choice: Ce jour-là
  rationale: Cette tournure française rattache clairement les événements cosmiques au jour qui vient d’être mentionné, sans la lourdeur de « dans lequel ».
- source_word: οἱ οὐρανοὶ
  choice: les cieux
  rationale: Le pluriel grec est conservé dans ce contexte cosmique.
- source_word: ῥοιζηδόν
  choice: avec fracas
  rationale: L’adverbe évoque un bruit impétueux, sifflant ou grondant; « avec fracas » est naturel, vif et solennel.
- source_word: παρελεύσονται
  choice: disparaîtront
  rationale: Dans ce contexte eschatologique, παρέρχομαι exprime la disparition ou le passage définitif; « disparaîtront » est idiomatique en français moderne.
- source_word: στοιχεῖα
  choice: les éléments
  rationale: Cette traduction large préserve l’indétermination du terme, qui peut désigner les composantes du cosmos ou, plus précisément, les corps célestes.
- source_word: καυσούμενα
  choice: embrasés
  rationale: Le participe décrit les éléments soumis au feu; « embrasés » restitue de façon concise le processus sans préciser d’agent.
- source_word: λυθήσεται
  choice: se dissoudront
  rationale: λύω évoque ici une désagrégation ou dissolution; cette traduction est plus précise que « seront détruits ».
- source_word: γῆ
  choice: la terre
  rationale: La portée cosmique du passage favorise « la terre » plutôt que « le pays ».
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: les œuvres qui s’y trouvent
  rationale: Cette formulation reste proche du grec et laisse ouvertes les nuances d’œuvres, d’actes ou de réalisations présents sur la terre.
- source_word: εὑρεθήσεται
  choice: sera mise au jour
  rationale: Dans cette clause difficile, « sera mise au jour » exprime l’idée d’être trouvée ou rendue manifeste en français intelligible, tout en signalant en note la traduction plus littérale et les variantes.
theological_decisions:
- issue: Sens de la proposition finale καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται
  choice: « la terre, avec les œuvres qui s’y trouvent, sera mise au jour »
  alternative: « sera trouvée »; selon une variante textuelle, « sera consumée »
  rationale: Le texte fourni porte εὑρεθήσεται, littéralement « sera trouvée ». « Sera mise au jour » conserve l’idée de manifestation sans adopter la variante « sera consumée ». Les notes rendent transparentes la difficulté interprétative et la variation manuscrite.
- issue: Référent de στοιχεῖα
  choice: « les éléments » sans précision supplémentaire
  alternative: « les corps célestes » ou « les composantes fondamentales de l’univers »
  rationale: Le contexte cosmique autorise plusieurs référents; la traduction générale évite de trancher ce que le grec laisse indéterminé.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe évite le calque lourd de ἐν ᾗ tout en maintenant le lien temporel. Le vocabulaire cosmique demeure volontairement non technique, et les notes préservent l’ambiguïté lexicale ainsi que la difficulté textuelle de la proposition finale.
