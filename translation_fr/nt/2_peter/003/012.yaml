reference: 2 Peter 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: fr
  text: tandis que vous attendez et hâtez la venue du jour de Dieu[a], à cause de ce jour les cieux, embrasés, se désagrégeront, et les éléments, enflammés[b], fondront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « attendez avec ardeur la venue du jour de Dieu ». Le verbe grec peut signifier soit « hâter », soit « attendre ou désirer avec ardeur ».'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « éléments » peut désigner les composantes fondamentales du monde ou, peut-être, les corps célestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: attendez
  rationale: Le participe présent exprime une attente continue et confiante, dans le prolongement de l’exhortation du verset précédent.
- source_word: σπεύδοντας
  choice: hâtez
  rationale: Avec « la venue » comme complément direct, ce rendu conserve le sens transitif naturel du grec et la tension théologique du passage; l’autre sens possible est signalé en note.
- source_word: παρουσίαν
  choice: venue
  rationale: Dans ce contexte eschatologique, « venue » exprime naturellement l’arrivée attendue sans réduire le terme à une simple présence statique.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: du jour de Dieu
  rationale: Le rendu formel préserve cette expression inhabituelle et ne la remplace pas par « jour du Seigneur ».
- source_word: δι’ ἣν
  choice: À cause de ce jour
  rationale: διά avec l’accusatif a ici une valeur causale; la reprise explicite de « jour » est plus claire en français que « à cause duquel ».
- source_word: οὐρανοὶ
  choice: les cieux
  rationale: Le pluriel du grec est conservé et convient au cadre cosmique du passage.
- source_word: πυρούμενοι
  choice: embrasés
  rationale: Ce participe passif indique que les cieux sont livrés au feu; « embrasés » est concis, naturel et garde cette nuance.
- source_word: λυθήσονται
  choice: se désagrégeront
  rationale: Le verbe décrit ici la décomposition ou le démantèlement de l’ordre cosmique plutôt qu’une annihilation métaphysique.
- source_word: στοιχεῖα
  choice: les éléments
  rationale: Ce choix large conserve l’ambiguïté entre les composantes fondamentales du monde et, éventuellement, les corps célestes.
- source_word: καυσούμενα
  choice: consumés par la chaleur
  rationale: Le participe exprime l’action intense du feu ou de la chaleur sur les éléments; ce rendu distingue clairement cette proposition de celle qui concerne les cieux.
- source_word: τήκεται
  choice: fondront
  rationale: Le verbe signifie fondre sous l’effet de la chaleur. Le futur français s’accorde naturellement avec les événements futurs coordonnés, malgré le présent grec à valeur vive.
theological_decisions:
- issue: Sens de σπεύδοντας τὴν παρουσίαν
  choice: hâtez la venue
  alternative: attendez avec ardeur la venue
  rationale: Le grec permet soit l’idée de hâter l’arrivée, soit celle de la désirer ardemment. Le texte principal retient la construction avec complément direct, tandis que la note préserve l’autre lecture sans résoudre artificiellement la tension.
- issue: Référent de στοιχεῖα
  choice: les éléments
  alternative: les corps célestes
  rationale: Le terme est discuté dans ce contexte eschatologique. Le rendre par « éléments » évite d’imposer une cosmologie particulière, et la note indique l’autre possibilité majeure.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement exhortatif du contexte et les images cosmiques du grec. « Se désagrégeront » évite la connotation chimique parfois étroite de « se dissoudront », tandis que les notes préservent les deux principales ambiguïtés exégétiques.
