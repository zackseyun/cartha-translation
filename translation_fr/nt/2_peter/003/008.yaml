id: 2PE.3.8
reference: 2 Peter 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: fr
  text: 'Mais que cette seule chose ne vous échappe pas[a], bien-aimés : auprès du Seigneur, un jour est comme mille ans[b][c], et mille ans comme un jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne soyez pas dans l’ignorance de cette seule chose ».'
    reason: lexical_alternative
  - marker: b
    text: 'La comparaison emploie « comme » : elle exprime une analogie, non une équivalence littérale entre un jour et mille ans.'
    reason: cultural_note
  - marker: c
    text: Écho au Psaume 90.4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν ... τοῦτο
  choice: cette seule chose
  rationale: Cette formulation conserve à la fois la valeur démonstrative de τοῦτο et l’accent porté par ἕν sur un point précis.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: que ... ne vous échappe pas
  rationale: λανθάνω désigne ici ce qui échappe à l’attention ou passe inaperçu. La tournure française garde la force impérative et le rapport avec ὑμᾶς.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Le vocatif exprime l’affection envers les destinataires croyants. « Bien-aimés » conserve le ton chaleureux et ecclésial dans un registre digne.
- source_word: παρὰ κυρίῳ
  choice: auprès du Seigneur
  rationale: παρά avec le datif peut exprimer la proximité ou le point de vue. « Auprès du Seigneur » préserve cette nuance sans la réduire exclusivement à « aux yeux du Seigneur ».
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: un jour est comme mille ans
  rationale: ὡς introduit une comparaison. « Comme » rend clairement l’analogie sans transformer les deux durées en équivalence littérale.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: et mille ans comme un jour
  rationale: La proposition française conserve le parallélisme inversé du grec et son ellipse verbale naturelle.
- source_word: χίλια ἔτη
  choice: mille ans
  rationale: Il s’agit de la traduction cardinale directe, sans paraphrase ni interprétation symbolique ajoutée.
theological_decisions:
- issue: Nature de la comparaison temporelle
  choice: Présenter l’énoncé comme une analogie concernant le rapport du Seigneur au temps.
  alternative: Comprendre un jour comme étant littéralement égal à mille ans, ou employer ce verset comme formule de conversion chronologique pour les prophéties.
  rationale: La répétition de ὡς (« comme ») marque une comparaison et non une identité mathématique. La traduction préserve cette distinction sans imposer de système eschatologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la phrase grecque est conservé, de même que l’adresse affectueuse « bien-aimés ». « Auprès du Seigneur » maintient volontairement la nuance relationnelle ou perspectivale de παρὰ κυρίῳ.
