id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: fr
  text: Mais grandissez dans la grâce et dans la connaissance de notre Seigneur et Sauveur Jésus le Messie[a]. À lui soit la gloire, maintenant et jusqu’au jour de l’éternité[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’usage français traditionnel : « Jésus-Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « maintenant et pour toujours ». Le grec dit plus littéralement : « maintenant et jusqu’au jour de l’éternité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: grandissez
  rationale: L’impératif présent actif à la deuxième personne du pluriel appelle à une croissance continue. « Grandissez » est naturel en français et n’explicite pas excessivement l’aspect verbal.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la mise en garde précédente; « Mais » rend clairement cette articulation.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: dans la grâce et dans la connaissance
  rationale: La répétition naturelle de « dans » en français clarifie que la croissance concerne ces deux domaines, sans modifier leur coordination grecque.
- source_word: χάριτι
  choice: grâce
  rationale: « Grâce » est le terme français courant et théologiquement établi pour ce sens néotestamentaire.
- source_word: γνώσει
  choice: connaissance
  rationale: Le terme désigne ici la connaissance du Christ; « connaissance » préserve ce sens sans le réduire à une simple compréhension intellectuelle ni l’interpréter davantage.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: de notre Seigneur et Sauveur Jésus le Messie
  rationale: L’article grec unique rattache naturellement les deux titres à une seule personne. « Seigneur » et « Sauveur » sont les équivalents usuels, tandis que « le Messie » traduit la valeur titulaire de Χριστός en français idiomatique.
- source_word: αὐτῷ ἡ δόξα
  choice: À lui soit la gloire
  rationale: Cette formule rend naturellement en français l’attribution doxologique dont le verbe est sous-entendu en grec.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: maintenant et jusqu’au jour de l’éternité
  rationale: Cette formulation conserve l’expression grecque inhabituelle et notamment ἡμέραν, « jour », au lieu de l’aplanir dans le simple adverbe « éternellement ».
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération traditionnelle convient au contexte doxologique français.
theological_decisions:
- issue: Rendu de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Χριστός conserve ici sa valeur de titre dans une confession christologique et une doxologie. « Jésus le Messie » en traduit le sens; la forme traditionnelle « Jésus-Christ » est signalée en note.
- issue: Référent de « notre Seigneur et Sauveur »
  choice: Les deux titres désignent la même personne, Jésus le Messie
  alternative: Une formulation française laissant le lien syntaxique moins explicite
  rationale: La construction grecque avec un seul article pour κύριος et σωτήρ indique fortement un référent unique. La traduction suit cette syntaxe sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la tension et le caractère inhabituel de « jour de l’éternité », tout en employant une syntaxe française naturelle. Tous les marqueurs de notes figurent dans le texte.
