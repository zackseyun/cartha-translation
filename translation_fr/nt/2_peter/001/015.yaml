id: 2PE.1.15
reference: 2 Peter 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: fr
  text: Et je ferai aussi tout mon possible pour qu’après mon départ[a], vous puissiez, en toute occasion, vous rappeler ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « après ma mort ». Le grec dit : « après mon départ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: je ferai tout mon possible
  rationale: Le futur de σπουδάζω exprime un effort zélé et soutenu. Cette tournure naturelle en français moderne en conserve l’intensité.
- source_word: δὲ καὶ
  choice: Et… aussi
  rationale: δὲ assure ici la continuité plutôt qu’une forte opposition, tandis que καὶ ajoute l’idée d’un effort supplémentaire à celui évoqué dans le contexte.
- source_word: ἑκάστοτε
  choice: en toute occasion
  rationale: Le terme désigne chaque occasion ou chaque fois que le besoin s’en présente. « En toute occasion » préserve cette portée sans suggérer nécessairement une action ininterrompue.
- source_word: ἔχειν ὑμᾶς
  choice: vous puissiez
  rationale: Dans cette construction, ἔχειν exprime la capacité ou la possibilité. « Vous puissiez » rend ce sens de façon idiomatique.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: après mon départ
  rationale: ἔξοδος désigne littéralement une sortie ou un départ et sert ici de manière voilée à parler de la mort prochaine de Pierre. « Départ » conserve la métaphore.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: vous rappeler ces choses
  rationale: Cette expression idiomatique signifie faire revenir quelque chose à la mémoire. « Se rappeler » est naturel en français et garde le caractère actif de l’évocation.
- source_word: τούτων
  choice: ces choses
  rationale: Le démonstratif renvoie aux réalités enseignées dans le contexte immédiat; « ces choses » en est la traduction la plus directe.
theological_decisions:
- issue: Sens de ἔξοδος à propos de la fin prochaine de Pierre
  choice: départ
  alternative: mort
  rationale: Le texte grec emploie une métaphore pour désigner la mort. Le texte principal la conserve, tandis que la note en explicite le sens contextuel sans imposer une nuance théologique supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la métaphore de ἔξοδος et rend l’infinitif final par une proposition de but claire.
