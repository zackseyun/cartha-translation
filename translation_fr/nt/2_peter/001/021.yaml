  to: En effet, ce n’est jamais par une volonté humaine[a] qu’une prophétie a été apportée ; mais des êtres humains ont parlé de la part de Dieu, portés par l’Esprit saint[b].
  rationale: La correction est limitée à une syntaxe française plus fluide pour la négation emphatique et à la précision de la note lexicale. Elle maintient le passif de ἠνέχθη, l’opposition entre l’absence d’origine dans la volonté humaine et la source divine, ainsi que l’action de l’Esprit sans la réduire à une dictée mécanique.
