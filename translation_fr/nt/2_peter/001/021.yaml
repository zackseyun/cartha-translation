  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la prophétie n’a pas son origine dans une volonté humaine, et des êtres humains parlent de la part de Dieu sous l’action de l’Esprit saint. Toutefois, « jamais une prophétie n’a été apportée » est une transposition française moins idiomatique de la négation grecque et affaiblit légèrement la relation naturelle entre « jamais » et le verbe passif.'
  naturalness: La reformulation proposée place « jamais » dans une construction française plus naturelle (« ce n’est jamais par ... qu’une prophétie a été apportée »), tout en gardant le passif. « Des êtres humains » est inclusif et exact pour ἄνθρωποι, bien qu’un peu plus soutenu que « des personnes » ; il convient au registre biblique moderne.
  terminology: « Prophétie », « volonté humaine », « de la part de Dieu » et « l’Esprit saint » sont appropriés. « Portés par l’Esprit saint » conserve utilement l’écho de φέρω entre le verbe principal et le participe, sans imposer une théorie de dictée. La note est corrigée afin de décrire le participe grec plutôt que de définir le verbe de façon imprécise.
