source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: fr
  text: En effet, ce n’est jamais par une volonté humaine[a] qu’une prophétie a été apportée ; mais des êtres humains ont parlé de la part de Dieu, portés par l’Esprit saint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la volonté d’un être humain ». Le grec emploie un singulier à portée générale.
    reason: lexical_alternative
  - marker: b
    text: Ou « emportés par l’Esprit saint ». Le participe grec signifie littéralement « étant portés » et souligne l’action directrice de l’Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: par une volonté humaine
  rationale: 'Le datif exprime ici le moyen ou l’impulsion : la prophétie ne tire pas son origine d’une volonté humaine. Cette formulation naturelle conserve le singulier grec et sa portée représentative.'
- source_word: ἠνέχθη
  choice: a été apportée
  rationale: Le passif de φέρω est conservé et fait écho au participe φερόμενοι plus loin. « Apportée » exprime la venue ou la production de la prophétie sans préciser davantage son mode d’origine.
- source_word: προφητεία
  choice: prophétie
  rationale: Terme français courant et traditionnel qui désigne ici la parole ou révélation prophétique en général.
- source_word: οὐ… ποτέ
  choice: jamais… n’a été
  rationale: « Jamais » rend naturellement la négation renforcée par ποτέ.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: par l’Esprit saint
  rationale: ὑπό avec le génitif marque l’agent. L’article français est requis pour désigner naturellement l’Esprit saint.
- source_word: φερόμενοι
  choice: portés
  rationale: Le participe reprend le verbe φέρω et représente l’action directrice de l’Esprit de manière concrète, sans la réduire à une simple influence intérieure.
- source_word: ἐλάλησαν
  choice: ont parlé
  rationale: Traduction directe et naturelle de λαλέω, sans surcharger le registre.
- source_word: ἀπὸ θεοῦ
  choice: de la part de Dieu
  rationale: ἀπό indique la source ou l’origine. « De la part de Dieu » marque clairement que le message vient de Dieu tout en distinguant cette source de l’action de l’Esprit exprimée par ὑπό.
- source_word: ἄνθρωποι
  choice: des êtres humains
  rationale: Le pluriel désigne les personnes qui ont parlé. « Êtres humains » conserve la portée humaine générique de ἄνθρωποι sans suggérer que l’énoncé doctrinal exclut les femmes.
theological_decisions:
- issue: Rapport entre l’action divine et l’action humaine dans la prophétie
  choice: La prophétie ne vient pas d’une volonté humaine ; cependant, de véritables êtres humains ont parlé de la part de Dieu tandis que l’Esprit saint les portait.
  alternative: Présenter la prophétie comme une dictée mécanique, ou comme le produit conjoint d’une initiative humaine autonome et d’une influence divine.
  rationale: Le grec maintient ensemble la réalité de la parole humaine (« ont parlé »), sa source divine (« de la part de Dieu ») et l’action déterminante de l’Esprit (« portés par l’Esprit saint »). La traduction ne résout pas artificiellement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique est conservée. « En effet » rend γάρ dans son lien explicatif avec le verset précédent. Le choix de « des êtres humains » évite un masculin potentiellement ambigu en français tout en respectant le sens générique du grec.
