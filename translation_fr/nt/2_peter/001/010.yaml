id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: fr
  text: C’est pourquoi, frères[a], appliquez-vous d’autant plus à affermir votre appel et votre élection ; car, si vous faites ces choses, vous ne trébucherez certainement jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit « frères », terme qui peut ici désigner l’ensemble de la communauté croyante.'
    reason: Préciser la forme grammaticale grecque et son possible emploi inclusif.
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement en français la déduction tirée de l’exhortation précédente.
- source_word: μᾶλλον
  choice: d’autant plus
  rationale: Rend la valeur comparative qui renforce l’impératif.
- source_word: ἀδελφοί
  choice: frères
  rationale: Respecte la forme masculine plurielle du grec ; dans ce type d’adresse épistolaire, le terme peut inclure toute la communauté croyante, ce que précise la note.
- source_word: σπουδάσατε
  choice: appliquez-vous
  rationale: Exprime l’empressement et l’effort sérieux demandés par l’impératif, dans un français courant et digne.
- source_word: βεβαίαν … ποιεῖσθαι
  choice: affermir
  rationale: Rend de façon concise l’idée de rendre ferme, d’établir ou de confirmer, sans suggérer que les destinataires font naître l’appel ou l’élection de Dieu.
- source_word: κλῆσιν
  choice: appel
  rationale: Terme français usuel pour l’appel de Dieu dans le Nouveau Testament.
- source_word: ἐκλογὴν
  choice: élection
  rationale: Conserve le terme théologique précis désignant le choix de Dieu, sans imposer un système doctrinal particulier.
- source_word: ταῦτα … ποιοῦντες
  choice: si vous faites ces choses
  rationale: Le participe prend ici naturellement une valeur conditionnelle et renvoie aux qualités et pratiques mentionnées dans le contexte précédent.
- source_word: οὐ μὴ
  choice: certainement jamais
  rationale: Reproduit la forte négation emphatique du grec.
- source_word: πταίσητέ
  choice: trébucherez
  rationale: Préserve la métaphore de la faute ou de la chute sans transformer le propos en affirmation explicite de perfection sans péché ou de perte finale du salut.
theological_decisions:
- issue: Sens d’« affermir votre appel et votre élection »
  choice: L’exhortation demande aux croyants de rendre fermes ou de confirmer dans leur vie leur appel et leur élection par une conduite persévérante.
  alternative: Comprendre que l’effort humain produit ou détermine lui-même l’appel et l’élection de Dieu.
  rationale: La construction grecque avec βεβαίαν et ποιεῖσθαι évoque le fait de rendre ferme ou de confirmer. La formulation conserve la tension du texte sans définir davantage le rapport entre l’action divine et la diligence humaine.
- issue: Portée de « vous ne trébucherez certainement jamais »
  choice: Conserver l’image générale du trébuchement dans la marche fidèle.
  alternative: Préciser soit qu’il s’agit de ne commettre aucun péché, soit exclusivement de ne jamais apostasier définitivement.
  rationale: Le verbe πταίω signifie couramment trébucher ou faillir. Le contexte ne justifie pas de réduire la promesse à une formulation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien logique avec le contexte, l’intensité de l’exhortation et la forte négation finale, tout en évitant un vocabulaire confessionnel surinterprété.
