source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: fr
  text: 'Sachez d’abord ceci : aucune prophétie de l’Écriture ne provient d’une interprétation personnelle[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’une explication personnelle ». Le mot grec traduit par « interprétation » peut aussi désigner une explication ou une résolution. L’expression est difficile ; dans le contexte, elle concerne la provenance de la prophétie.'
    reason: Préserver l’ambiguïté de ἰδίας ἐπιλύσεως tout en signalant, sans imposer une lecture doctrinale, que le contexte immédiat traite de l’origine de la prophétie.
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Sachez avant tout ceci
  rationale: Le participe grec fonctionne comme une exhortation liée au contexte. Cette formulation française est naturelle et conserve la priorité exprimée par πρῶτον.
- source_word: πᾶσα προφητεία γραφῆς
  choice: aucune prophétie de l’Écriture
  rationale: La construction grecque πᾶσα…οὐ signifie ici que toute prophétie est exclue de ce qui suit; en français courant, « aucune… ne » exprime clairement cette portée sans laisser entendre que seules certaines prophéties seraient concernées.
- source_word: ἰδίας ἐπιλύσεως
  choice: d’une interprétation personnelle
  rationale: ἰδίας désigne ce qui appartient en propre à quelqu’un, et ἐπίλυσις peut évoquer une interprétation, une explication ou une résolution. « interprétation personnelle » conserve le sens principal sans préciser abusivement de quelle personne il s’agit.
- source_word: οὐ γίνεται
  choice: n’est le fruit de
  rationale: γίνεται indique ici la provenance ou la manière dont la prophétie advient. « n’est le fruit de » rend cette idée idiomatiquement et prépare le contraste du verset suivant sur l’origine de la prophétie.
theological_decisions:
- issue: Portée de l’affirmation sur l’« interprétation personnelle »
  choice: La formulation porte d’abord sur la provenance de la prophétie, conformément à γίνεται et au contraste du verset 21.
  alternative: Comprendre le verset uniquement comme une interdiction faite au lecteur d’interpréter seul l’Écriture.
  rationale: Le contexte immédiat explique que la prophétie n’a pas été apportée par la volonté humaine. Toutefois, le terme ἐπίλυσις conserve une dimension d’interprétation ou d’explication, qui n’est donc pas effacée.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Sachez » évite un participe français lourd, tandis que « n’est le fruit de » exprime naturellement l’idée de provenance présente dans le contexte.
