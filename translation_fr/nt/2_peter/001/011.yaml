id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: fr
  text: Car c’est ainsi que l’entrée dans le royaume éternel de notre Seigneur et Sauveur Jésus le Messie[a] vous sera généreusement accordée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « Jésus-Christ ». Le titre grec Χριστός signifie « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: c’est ainsi
  rationale: Cette expression renvoie à la conduite décrite dans le contexte précédent et conserve la valeur démonstrative du grec dans un français naturel.
- source_word: γὰρ
  choice: Car
  rationale: Marque le lien explicatif avec l’affirmation précédente sans alourdir la phrase.
- source_word: πλουσίως
  choice: avec largesse
  rationale: Rend l’idée d’abondance et de générosité de l’adverbe tout en formant une expression française naturelle avec « accordée ».
- source_word: ἐπιχορηγηθήσεται
  choice: sera accordée
  rationale: Conserve le futur passif et exprime qu’une entrée sera fournie ou octroyée aux destinataires.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom placé devant « sera accordée » rend naturellement en français le datif désignant les bénéficiaires.
- source_word: ἡ εἴσοδος
  choice: l’entrée
  rationale: Rend directement le nom grec, qui peut désigner l’action d’entrer ou l’accès lui-même, sans trancher inutilement entre ces nuances.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: dans le royaume éternel
  rationale: « Entrée dans » est la construction française idiomatique correspondant à la direction exprimée par εἰς, et « éternel » rend αἰώνιος dans ce contexte eschatologique.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: de notre Seigneur et Sauveur
  rationale: La formulation conserve les deux titres et reflète la construction grecque qui les rapporte à une seule personne.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu selon son sens de titre, « Messie », plutôt que seulement translittéré; l’article français est requis pour porter naturellement ce titre.
theological_decisions:
- issue: Référent de « notre Seigneur et Sauveur »
  choice: Les deux titres désignent une seule personne, Jésus le Messie.
  alternative: On pourrait ponctuer ou comprendre les titres comme s’ils avaient des référents distincts, mais la syntaxe grecque ne favorise pas cette lecture.
  rationale: Un seul article grec régit deux noms personnels singuliers coordonnés par καί, suivis du nom Ἰησοῦ Χριστοῦ; la construction indique fortement un référent unique. La traduction suit cette syntaxe sans ajouter d’explication doctrinale au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « vous sera accordée avec largesse » maintient le passif du grec et son idée d’abondance sans devenir artificielle. L’ordre de la phrase garde « l’entrée » comme sujet grammatical, conformément au texte source.
