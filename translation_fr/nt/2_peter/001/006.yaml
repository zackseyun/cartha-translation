id: 2PE.1.6
reference: 2 Peter 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: fr
  text: à la connaissance, la maîtrise de soi ; à la maîtrise de soi, la persévérance[a] ; et à la persévérance, la piété[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « endurance », « constance » ou « endurance patiente » pour le grec ὑπομονή.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie une tournure elliptique : la chaîne des qualités commencée au verset précédent se poursuit, chaque qualité devant être accompagnée de la suivante.'
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: connaissance
  rationale: Le nom γνῶσις désigne directement la connaissance ; ce choix conserve aussi le lien lexical et structurel avec la qualité mentionnée au verset précédent.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: maîtrise de soi
  rationale: ἐγκράτεια exprime la capacité de gouverner ses désirs et ses impulsions. « Maîtrise de soi » est naturel en français moderne et plus précis ici que « tempérance ».
- source_word: ὑπομονήν / ὑπομονῇ
  choice: persévérance
  rationale: ὑπομονή évoque la constance qui tient bon dans l’épreuve. « Persévérance » rend cette dimension active sans réduire le terme à une patience passive.
- source_word: εὐσέβειαν
  choice: piété
  rationale: Dans ce contexte, εὐσέβεια désigne une disposition respectueuse envers Dieu qui se manifeste dans la conduite. « Piété » est le terme français concis qui conserve cette portée religieuse et éthique.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: à la ..., la ...
  rationale: La construction grecque est elliptique et poursuit l’exhortation du verset précédent à joindre une qualité à une autre. En français, « à la …, la … » préserve la chaîne condensée tout en restant intelligible.
- source_word: δέ
  choice: et
  rationale: δέ assure ici la progression de l’énumération plutôt qu’une opposition ; « et » convient donc à sa fonction additive.
theological_decisions:
- issue: Syntaxe elliptique de la chaîne des qualités
  choice: 'Conserver l’énumération condensée : « à la connaissance, la maîtrise de soi… »'
  alternative: 'Développer : « joignez à la connaissance la maîtrise de soi… »'
  rationale: Le grec dépend syntaxiquement de l’exhortation du verset précédent et n’en répète pas le verbe. La formulation retenue conserve cette ellipse et évite d’ajouter dans ce verset des mots seulement sous-entendus.
- issue: Portée de εὐσέβεια
  choice: piété
  alternative: attachement à Dieu
  rationale: « Piété » laisse au terme sa portée générale de révérence et de conduite conforme à cette révérence, sans le réduire à un sentiment intérieur ni expliciter davantage que le grec la relation à Dieu.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation met en relief la progression de la liste. « Maîtrise de soi » évite l’archaïsme de « tempérance » ; « piété », encore courant dans le registre biblique et religieux, conserve la concision du grec. Les deux marqueurs [a] et [b] figurent dans le texte.
