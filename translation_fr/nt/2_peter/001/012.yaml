id: 2PE.1.12
reference: 2 Peter 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: fr
  text: C’est pourquoi je veillerai toujours à vous rappeler ces choses, bien que vous les connaissiez et que vous soyez affermis dans la vérité présente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vérité que vous possédez maintenant »; ou « dans la vérité présente parmi vous ».
    reason: Alternative lexicale conservant les principaux sens possibles de παρούσῃ.
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de l’argument précédent.
- source_word: μελλήσω
  choice: je veillerai
  rationale: Le futur de μέλλω avec l’infinitif exprime ici une résolution suivie ou le souci d’agir, et non seulement une action imminente.
- source_word: ἀεὶ
  choice: toujours
  rationale: Conserve directement l’idée d’une action constante ou répétée.
- source_word: ὑπομιμνῄσκειν
  choice: à vous rappeler
  rationale: Rend simplement l’action de faire revenir à la mémoire; la continuité est déjà exprimée par « toujours ».
- source_word: περὶ τούτων
  choice: ces choses
  rationale: Complément naturel de « rappeler » en français; le sens est « au sujet de ces choses ».
- source_word: καίπερ
  choice: bien que
  rationale: Exprime clairement la concession introduite par le participe.
- source_word: εἰδότας
  choice: vous les connaissiez
  rationale: Le pronom « les » reprend explicitement « ces choses », comme l’exige ici un français naturel.
- source_word: ἐστηριγμένους
  choice: vous soyez affermis
  rationale: Préserve la voix passive et l’état durable résultant d’un affermissement antérieur.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: dans la vérité présente
  rationale: 'Traduction formellement proche qui conserve l’expression inhabituelle et son ambiguïté: vérité actuellement connue, détenue ou présente parmi les destinataires.'
theological_decisions:
- issue: Sens de « la vérité présente »
  choice: la vérité présente
  alternative: la vérité que vous possédez maintenant; la vérité présente parmi vous
  rationale: Le grec ne définit pas cette expression comme un terme doctrinal technique. La formulation retenue préserve son ouverture sémantique sans lui imposer une lecture confessionnelle ou chronologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Je veillerai » exprime une résolution continue sans suggérer à tort une imminence immédiate. « Affermis » garde la nuance biblique tout en restant compréhensible.
