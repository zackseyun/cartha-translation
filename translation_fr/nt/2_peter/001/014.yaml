  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: fr
  text: sachant que je vais bientôt quitter ma tente[a][b], comme notre Seigneur Jésus le Messie me l’a clairement fait savoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un nom qui signifie « action de déposer ou d’ôter ». Pierre évoque sa mort prochaine par l’image d’une demeure temporaire que l’on quitte.
    reason: lexical_alternative
  - marker: b
    text: Ou « le moment de quitter ma tente est proche ».
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe français conserve le lien syntaxique avec le verset précédent sans rendre explicitement causale une relation que le grec laisse implicite.
- source_word: ταχινή
  choice: bientôt
  rationale: Dans cette construction, l’adjectif indique que l’événement est proche ou doit survenir rapidement. « Bientôt » est naturel en français moderne, tandis qu’une formulation avec « proche » exigerait une nominalisation plus lourde.
- source_word: ἀπόθεσις
  choice: quitter
  rationale: Le grec désigne l’action de déposer ou d’enlever quelque chose. Avec « tente », « quitter » donne en français une métaphore intelligible de la mort sans remplacer directement l’image par son interprétation.
- source_word: σκηνώματός
  choice: ma tente
  rationale: « Tente » conserve l’image d’une demeure corporelle temporaire. « Corps » expliciterait le référent au prix de la métaphore, et « tabernacle » serait archaïque ou chargé d’associations étrangères au contexte.
- source_word: καθὼς καὶ
  choice: comme
  rationale: « Comme » introduit naturellement en français la comparaison ou la confirmation exprimée par cette locution.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est le titre français usuel et convient au contexte christologique.
- source_word: Ἰησοῦς Χριστὸς
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » en communique le sens en français courant plutôt que de le traiter comme un simple élément de nom.
- source_word: ἐδήλωσέν
  choice: m’a clairement fait savoir
  rationale: Cette formulation rend l’idée de faire connaître ou de rendre clair sans imposer le vocabulaire plus technique d’une révélation formelle.
- source_word: μοι
  choice: m’
  rationale: Le pronom datif est rendu naturellement comme complément indirect de « faire savoir ».
theological_decisions:
- issue: Métaphore de la mort prochaine de Pierre
  choice: Conserver l’image de quitter une tente
  alternative: Dire directement « je vais bientôt mourir » ou employer « mon départ »
  rationale: Le texte grec représente la vie corporelle comme un séjour sous une tente temporaire. La traduction garde cette image et laisse le contexte en fournir l’interprétation.
- issue: Valeur de Χριστός dans Ἰησοῦς Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le choix principal fait entendre le sens du titre grec plutôt que de le laisser fonctionner uniquement comme une désignation figée, tout en signalant la forme traditionnelle en note.
- issue: Nuance temporelle de ταχινή
  choice: L’événement aura lieu bientôt
  alternative: L’événement est proche ou surviendra rapidement
  rationale: Le grec permet une nuance de proximité temporelle ou de promptitude. Le texte principal emploie le français le plus naturel et la note préserve l’autre manière de formuler cette nuance.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la forme participiale qui la rattache au verset précédent. « Quitter ma tente » privilégie une image immédiatement compréhensible tout en maintenant la métaphore corporelle du grec.
