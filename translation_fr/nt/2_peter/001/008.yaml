id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: fr
  text: En effet, si ces choses sont présentes en vous et se développent[a], elles ne vous rendent ni inactifs ni stériles dans la connaissance[b] de notre Seigneur Jésus le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abondent » ou « se multiplient ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pleine connaissance » ou « connaissance approfondie ».
    reason: lexical_alternative
  - marker: c
    text: Le grec porte « Jésus Christ » ; « Messie » traduit ici le sens du titre grec Christos.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif renvoie aux qualités énumérées aux versets 5 à 7. « Ces choses » conserve ce lien sans expliciter davantage que le grec.
- source_word: ὑμῖν ὑπάρχοντα
  choice: sont présentes en vous
  rationale: Le participe avec le datif indique que ces qualités se trouvent chez les destinataires ou leur appartiennent. Cette formulation française exprime naturellement leur présence sans réduire le sens à une simple possession.
- source_word: πλεονάζοντα
  choice: se développent
  rationale: Le verbe peut exprimer aussi bien l’accroissement que l’abondance. « Se développent » convient au contexte de croissance morale, tandis que « abondent » est signalé en note.
- source_word: ἀργούς
  choice: inactifs
  rationale: Le terme désigne ici l’absence d’activité ou d’effet utile. « Inactifs » reste proche de l’image grecque sans imposer la nuance morale plus étroite de « paresseux ».
- source_word: ἀκάρπους
  choice: improductifs
  rationale: Le mot signifie littéralement « sans fruit ». « Improductifs » rend clairement le résultat visé, et l’image littérale est conservée en note.
- source_word: καθίστησιν
  choice: elles vous empêchent d’être
  rationale: 'Le verbe est ici résultatif et porte sur les deux adjectifs niés : la présence et la croissance de ces qualités font que les lecteurs ne sont ni inactifs ni improductifs.'
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: dans la connaissance
  rationale: La préposition marque ici le domaine ou le rapport dans lequel l’activité porte du fruit. « Dans la connaissance » est naturel et laisse ouverte la nuance plus forte d’ἐπίγνωσις.
- source_word: ἐπίγνωσιν
  choice: connaissance
  rationale: « Connaissance » est la traduction française la plus sobre; le sens possible de connaissance pleine ou approfondie est indiqué en note.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde sa valeur de titre. En français, « Jésus le Messie » en exprime naturellement le sens plutôt que de traiter « Christ » comme un simple nom propre.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: La traduction du titre fait entendre son sens messianique sans ajouter de précision doctrinale absente du texte.
- issue: Nuance d’ἐπίγνωσις
  choice: connaissance
  alternative: pleine connaissance
  rationale: Le terme peut suggérer une connaissance approfondie, mais cette intensification n’est pas certaine dans chaque emploi; elle est donc conservée comme possibilité en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la relation conditionnelle implicite des participes grecs, ainsi que le parallélisme entre « inactifs » et « improductifs ». Les notes préservent les principales nuances lexicales sans alourdir le texte.
