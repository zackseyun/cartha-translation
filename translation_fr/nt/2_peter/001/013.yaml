  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: fr
  text: Mais je considère qu’il est juste, aussi longtemps que je suis dans cette tente[a], de vous réveiller par le rappel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tente »; image de l’existence corporelle mortelle et provisoire de Pierre.
    reason: Préserver la métaphore grecque dans le texte tout en signalant sobrement son emploi figuré dans le contexte.
lexical_decisions:
- source_word: δίκαιον
  choice: juste
  rationale: Avec « j’estime », « juste » exprime naturellement ce qui est jugé bon et approprié, tout en conservant la portée morale du grec.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque une légère opposition ou une progression par rapport à l’affirmation précédente.
- source_word: ἡγοῦμαι
  choice: j’estime
  rationale: Le verbe exprime un jugement réfléchi plutôt qu’une simple impression.
- source_word: ἐφ’ ὅσον
  choice: aussi longtemps que
  rationale: 'Avec le verbe « être », l’expression a ici une valeur temporelle : durant tout le temps où la situation se prolonge.'
- source_word: σκηνώματι
  choice: tente
  rationale: Ce choix conserve l’image grecque d’une demeure provisoire, métaphore de la vie corporelle mortelle de Pierre, et prépare le verset suivant.
- source_word: διεγείρειν
  choice: tenir en éveil
  rationale: Le verbe signifie éveiller ou stimuler. Cette formulation française est naturelle dans le contexte d’une exhortation répétée.
- source_word: ἐν ὑπομνήσει
  choice: en vous rappelant ces choses
  rationale: 'La préposition indique ici le moyen : Pierre les maintient en éveil par le rappel. « Ces choses » explicite sobrement le contenu anaphorique implicite du nom grec dans le contexte.'
theological_decisions:
- issue: Référence métaphorique de « cette tente »
  choice: Conserver directement l’image « cette tente » dans le texte.
  alternative: Interpréter par « ce corps » ou employer « cette demeure ».
  rationale: Le grec présente la vie corporelle mortelle comme une demeure provisoire. Garder la métaphore préserve sa force et son lien avec l’idée de déposer la tente au verset suivant, sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore concrète de la tente et le jugement réfléchi exprimé par ἡγοῦμαι, tout en rendant l’exhortation dans un français idiomatique.
