reference: 2 Peter 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: fr
  text: 'Siméon Pierre, esclave et apôtre de Jésus le Messie, à ceux qui ont reçu en partage une foi aussi précieuse que la nôtre[a], dans la justice[b] de notre Dieu et Sauveur, Jésus le Messie[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une foi de même valeur que la nôtre » ou « qui jouit de la même dignité que la nôtre ». L’adjectif grec peut exprimer l’égalité de valeur, d’honneur ou de privilège.
    reason: lexical_alternative
  - marker: b
    text: Ou « par la justice » ou « grâce à la justice ». La préposition grecque peut indiquer soit la sphère, soit le moyen.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec désigne très probablement une seule personne : Jésus le Messie est appelé à la fois « notre Dieu » et « Sauveur ». Une autre analyse, moins probable, comprend deux personnes : « notre Dieu et le Sauveur Jésus le Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Syméon Pierre
  rationale: « Syméon » reproduit la forme grecque Συμεών du texte source, tandis que « Pierre » est la forme française établie de Πέτρος.
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme exprime l’appartenance entière à un maître, et non simplement l’exercice d’un service. Le choix conserve cette force dans l’autodésignation apostolique.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Terme français établi et précis pour la fonction de représentant envoyé et mandaté qui est en vue ici.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός porte le sens du titre « Messie »; l’article est ajouté conformément à l’usage naturel du français.
- source_word: τοῖς ... λαχοῦσιν
  choice: à ceux qui ont reçu en partage
  rationale: Cette formulation exprime une réception accordée plutôt qu’un acquis obtenu par effort, tout en laissant percevoir la nuance d’attribution de λαγχάνω.
- source_word: ἰσότιμον ... πίστιν
  choice: une foi aussi précieuse que la nôtre
  rationale: Formulation française naturelle qui communique l’égalité de valeur; une note conserve les nuances possibles d’égale dignité ou de même privilège.
- source_word: πίστιν
  choice: foi
  rationale: Dans ce contexte, πίστις désigne la foi commune reçue par les croyants; « foi » est le terme français le plus exact et le plus établi.
- source_word: ἐν δικαιοσύνῃ
  choice: dans la justice
  rationale: Le calque intelligible « dans » préserve l’ouverture de ἐν entre sphère et moyen, sans trancher silencieusement en faveur de « grâce à » ou « par ».
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » est le correspondant français courant de δικαιοσύνη et convient ici à la qualité ou à l’action juste de Dieu.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: de notre Dieu et Sauveur, Jésus le Messie
  rationale: 'L’article grec unique devant deux noms personnels singuliers coordonnés favorise fortement un seul référent : Jésus est à la fois Dieu et Sauveur. La ponctuation française rend cette lecture explicite sans ajouter de mots de fond.'
theological_decisions:
- issue: La désignation « notre Dieu et Sauveur, Jésus le Messie » renvoie-t-elle à une seule personne ou à deux ?
  choice: 'Un seul référent : Jésus est appelé « notre Dieu et Sauveur ».'
  alternative: 'Deux référents : « notre Dieu » d’une part, et « le Sauveur Jésus le Messie » d’autre part.'
  rationale: La construction grecque emploie un seul article pour deux substantifs personnels singuliers reliés par καί, puis les identifie par « Jésus le Messie »; elle favorise donc nettement la lecture à un seul référent. Comme l’autre analyse existe et présente une importance théologique, elle est signalée en note.
- issue: Valeur de ἐν dans « ἐν δικαιοσύνῃ »
  choice: Conserver dans le texte la nuance de sphère avec « dans la justice ».
  alternative: 'Comprendre une valeur instrumentale : « par » ou « grâce à la justice ».'
  rationale: Dans ce contexte, ἐν peut indiquer la sphère dans laquelle la foi est reçue ou le moyen par lequel elle l’est. Le texte principal ne ferme pas cette ambiguïté réelle, et la note donne les rendus instrumentaux possibles.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la forme d’adresse épistolaire du verset. « Esclave » est volontairement fort pour rendre l’appartenance exprimée par δοῦλος; « reçu en partage » évite de suggérer que la foi aurait été méritée. Les notes préservent les ambiguïtés lexicales et la lecture christologique minoritaire sans les introduire lourdement dans le texte principal.
