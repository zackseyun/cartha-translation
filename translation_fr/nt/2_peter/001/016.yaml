id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: fr
  text: En effet, ce n’est pas en suivant des mythes habilement inventés que nous vous avons fait connaître la puissance et la venue[a] de notre Seigneur Jésus le Messie, mais parce que nous avons été témoins oculaires de sa majesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la présence » ou « l’arrivée » de notre Seigneur Jésus le Messie. Le grec παρουσία peut désigner une présence, une arrivée ou, dans de nombreux contextes du Nouveau Testament, la venue du Messie.
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: des mythes habilement inventés
  rationale: Le participe parfait passif qualifie des récits fabriqués avec art. Cette formulation garde à la fois l’idée d’invention et celle d’habileté, dans un français naturel.
- source_word: ἐξακολουθήσαντες
  choice: en suivant
  rationale: Le participe exprime ici le moyen rejeté et forme un contraste net avec la proposition introduite par « mais ».
- source_word: ἐγνωρίσαμεν ὑμῖν
  choice: nous vous avons fait connaître
  rationale: Rend directement le sens de γνωρίζω et conserve le complément ὑμῖν dans une tournure française idiomatique.
- source_word: δύναμιν
  choice: la puissance
  rationale: Équivalent direct et usuel de δύναμις dans ce contexte christologique.
- source_word: παρουσίαν
  choice: la venue
  rationale: Dans ce contexte, παρουσία renvoie probablement à la venue du Messie, tout en pouvant lexicalement désigner sa présence ou son arrivée; cette ambiguïté est signalée en note.
- source_word: κυρίου
  choice: Seigneur
  rationale: Rend l’emploi titulaire courant de κύριος appliqué à Jésus.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός fonctionne comme un titre; « le Messie » en transmet le sens en français plutôt que de le translittérer.
- source_word: ἐπόπται γενηθέντες
  choice: après avoir été témoins oculaires
  rationale: ἐπόπται désigne ceux qui ont vu eux-mêmes. La formulation française exprime l’expérience directe sans suggérer que les auteurs se seraient eux-mêmes constitués témoins.
- source_word: μεγαλειότητος
  choice: majesté
  rationale: « Majesté » restitue le caractère élevé de μεγαλειότης et convient à la manifestation glorieuse évoquée.
- source_word: ἐκείνου
  choice: sa
  rationale: Le possessif français renvoie naturellement à Jésus le Messie, référent du démonstratif grec.
theological_decisions:
- issue: Sens de παρουσία dans un contexte christologique
  choice: venue
  alternative: présence ou arrivée
  rationale: L’usage néotestamentaire rend probable une référence à la venue eschatologique de Jésus, mais le mot peut aussi signifier « présence » ou « arrivée ». La note préserve cette latitude lexicale.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec porte ici sa valeur titulaire. « Le Messie » en rend explicitement le sens sans imposer une lecture confessionnelle particulière.
- issue: Relation des participes au verbe principal
  choice: contraste entre « en suivant » et « après avoir été témoins oculaires »
  alternative: « en devenant témoins oculaires »
  rationale: Le grec met les deux participes en contraste. Le français naturel exige toutefois d’éviter l’idée étrange d’un accès volontaire au statut de témoin; « après avoir été » conserve la réalité de l’expérience directe et sa relation au témoignage transmis.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure argumentative du grec tout en évitant les calques pesants. « Mythes » maintient le terme générique du texte source, et « témoins oculaires » souligne l’opposition entre récits fabriqués et expérience directe.
