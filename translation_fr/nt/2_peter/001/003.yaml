id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: fr
  text: Puisque sa puissance divine nous a fait don de tout ce qui concerne la vie et la piété, par la connaissance de celui qui nous a appelés par sa propre gloire et sa propre excellence[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour sa propre gloire et sa propre excellence ». En grec, le groupe au datif peut être compris de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Puisque
  rationale: Dans cette construction, le terme introduit le fondement de l’exhortation qui suit. « Puisque » exprime naturellement cette relation en français, sans alourdir la phrase.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: tout ce qui contribue à la vie et à l’attachement à Dieu
  rationale: « Tout ce qui contribue à » rend la tournure τὰ πρὸς sans ajouter explicitement l’idée de nécessité. « La vie » demeure volontairement large, tandis que « l’attachement à Dieu » communique le caractère religieux et pratique de εὐσέβεια dans un français actuel.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: sa puissance divine
  rationale: Cette formulation française naturelle conserve à la fois la possession exprimée par αὐτοῦ et le caractère divin exprimé par θείας.
- source_word: δεδωρημένης
  choice: nous a fait don
  rationale: Le verbe grec évoque un don accordé avec générosité. Le passé composé convient au parfait grec, qui présente un acte accompli dont l’effet demeure.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: par la connaissance
  rationale: « Par » marque le moyen, et « connaissance » évite de surcharger ἐπίγνωσις d’un sens technique tel que « pleine connaissance ».
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: de celui qui nous a appelés
  rationale: Cette expression rend clairement le participe substantivé et conserve la portée personnelle de l’appel.
- source_word: ἰδίᾳ
  choice: sa propre ... sa propre
  rationale: La répétition française rend sans ambiguïté l’insistance possessive de ἰδίᾳ pour les deux noms coordonnés.
- source_word: δόξῃ
  choice: gloire
  rationale: « Gloire » est le terme français établi pour la majesté ou la splendeur divine évoquée ici.
- source_word: ἀρετῇ
  choice: excellence
  rationale: « Excellence » rend la qualité éminente exprimée par ἀρετή sans réduire le terme à la seule vertu morale humaine.
- source_word: ζωὴν
  choice: vie
  rationale: Le grec n’ajoute aucun qualificatif; « vie » préserve donc ses résonances présentes et futures.
- source_word: εὐσέβειαν
  choice: attachement à Dieu
  rationale: Cette expression actuelle met en évidence l’orientation vers Dieu et ses implications pratiques, là où « piété » peut aujourd’hui paraître vieillissant ou évoquer une simple pratique dévotionnelle.
theological_decisions:
- issue: Valeur du datif dans ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: par sa propre gloire et sa propre excellence
  alternative: pour sa propre gloire et sa propre excellence
  rationale: Avec le texte grec fourni, le datif peut naturellement indiquer le moyen par lequel l’appel est lancé. Comme une lecture exprimant le but reste possible, elle est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule parce que le verset forme le début d’une construction qui se poursuit dans le contexte. Le choix « attachement à Dieu » évite l’archaïsme possible de « piété » tout en conservant l’orientation religieuse et éthique du terme grec.
