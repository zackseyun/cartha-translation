id: 2PE.1.17
reference: 2 Peter 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: fr
  text: 'En effet, il reçut de Dieu le Père honneur et gloire lorsqu’une voix lui fut adressée par la Gloire majestueuse[a] en ces termes : « Celui-ci est mon Fils, mon Bien-Aimé[b], en qui j’ai pris plaisir[c] » —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la Gloire majestueuse » est une manière révérencielle de désigner Dieu dans sa gloire.
    reason: clarification
  - marker: b
    text: 'Ou « mon Fils bien-aimé ». Le grec dit plus littéralement : « mon Fils, mon Bien-Aimé ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou « en qui je prends plaisir » ou « qui a toute ma faveur ». Le grec emploie littéralement un verbe au passé : « en qui j’ai pris plaisir ».'
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ
  choice: En effet, il reçut
  rationale: Le participe aoriste est rendu par un verbe conjugué, tandis que γάρ est conservé par « en effet ». Le passé simple convient au registre narratif soutenu sans rendre la phrase archaïque.
- source_word: παρὰ θεοῦ πατρὸς
  choice: de Dieu le Père
  rationale: παρά avec le génitif indique la source. « Dieu le Père » est la formulation française claire et habituelle.
- source_word: τιμὴν καὶ δόξαν
  choice: honneur et gloire
  rationale: Les deux noms sont maintenus distinctement et traduits dans leur sens direct.
- source_word: φωνῆς ἐνεχθείσης αὐτῷ
  choice: lorsqu’une voix lui fut adressée
  rationale: Le génitif absolu est rendu par une proposition temporelle. « Fut adressée » exprime naturellement en français le passif de φέρω appliqué à une voix ou déclaration.
- source_word: τοιᾶσδε
  choice: en ces termes
  rationale: L’expression annonce la citation qui suit et rend naturellement en français la valeur cataphorique de τοιᾶσδε.
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: par la Gloire majestueuse
  rationale: ὑπό marque ici l’agent. La majuscule signale que cette expression révérencielle désigne la présence glorieuse de Dieu sans remplacer l’image grecque par une explication.
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: Celui-ci est mon Fils, mon Bien-Aimé
  rationale: Cette formulation conserve l’apposition grecque ainsi que la répétition de μου, au lieu de fondre les deux expressions en « mon Fils bien-aimé ».
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: en qui j’ai pris plaisir
  rationale: « En qui » suit la construction avec εἰς, et le passé composé garde la valeur aoriste de εὐδόκησα tout en restant intelligible en français moderne.
theological_decisions:
- issue: Valeur de l’expression τῆς μεγαλοπρεποῦς δόξης
  choice: la Gloire majestueuse
  alternative: la gloire magnifique ; la Majesté divine
  rationale: Le choix préserve la circonlocution révérencielle probablement employée pour Dieu et évite d’expliciter davantage que le grec.
- issue: Structure de la déclaration concernant le Fils
  choice: Celui-ci est mon Fils, mon Bien-Aimé
  alternative: Celui-ci est mon Fils bien-aimé
  rationale: L’apposition maintient l’accent propre aux deux désignations et la répétition du possessif, sans ajouter de formulation doctrinale ultérieure.
- issue: Temps et construction de εὐδόκησα
  choice: en qui j’ai pris plaisir
  alternative: en qui je prends plaisir ; qui a toute ma faveur
  rationale: Le choix conserve à la fois la préposition grecque et l’aoriste. La note indique les formulations françaises plus idiomatiques sans effacer la tension grammaticale du texte.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple soutient le récit biblique sans vocabulaire archaïque. La phrase demeure ouverte par le tiret final, conformément à son lien syntaxique avec le verset suivant.
