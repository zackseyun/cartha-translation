id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: fr
  text: Par elles, il nous a accordé de précieuses et très grandes promesses, afin que, par ces promesses, vous ayez part à la nature divine[a], après avoir échappé à la corruption qui existe dans le monde à cause de la convoitise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous deveniez participants de la nature divine ». Cette expression parle d’une participation à ce qui vient de Dieu, sans signifier que les croyants deviennent divins par essence.
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause du désir » ou « dans le désir ». Le terme grec peut désigner le désir en général, mais il a ici une valeur négative en raison du contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: Par elles
  rationale: διά avec le génitif exprime ici le moyen. Le pronom reprend des réalités mentionnées au verset précédent sans préciser davantage son antécédent.
- source_word: τίμια καὶ μέγιστα
  choice: précieuses et très grandes
  rationale: « Précieuses » rend naturellement τίμια. Bien que μέγιστα soit un superlatif, « très grandes » en exprime ici la force de manière idiomatique en français.
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif désigne les bénéficiaires du don et s’intègre naturellement à la construction française « il nous a accordé ».
- source_word: ἐπαγγέλματα
  choice: promesses
  rationale: « Promesses » est le sens courant et contextuellement approprié de ἐπαγγέλματα.
- source_word: δεδώρηται
  choice: il nous a accordé
  rationale: Le parfait de δωρέομαι évoque un don généreusement consenti dont l’effet demeure. Le sujet implicite est repris du contexte.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution conserve clairement la valeur de but, avec une possible nuance de résultat.
- source_word: διὰ τούτων
  choice: par ces promesses
  rationale: Le démonstratif renvoie le plus naturellement aux promesses qui viennent d’être mentionnées. L’explicitation évite en français un pronom ambigu.
- source_word: γένησθε
  choice: vous deveniez
  rationale: Le verbe γίνομαι exprime un devenir plutôt qu’un simple état.
- source_word: θείας κοινωνοὶ φύσεως
  choice: participants de la nature divine
  rationale: « Participants » rend la notion de κοινωνός sans atténuer la forte affirmation du texte. « Nature divine » conserve l’expression grecque sans développement doctrinal.
- source_word: ἀποφυγόντες
  choice: ayant échappé
  rationale: Le participe aoriste est conservé sous une forme participiale qui n’impose pas une relation exclusivement temporelle ou causale.
- source_word: φθορᾶς
  choice: la corruption
  rationale: Dans ce contexte moral, « corruption » rend mieux φθορά que le seul sens physique de dégradation.
- source_word: ἐν τῷ κόσμῳ
  choice: qui existe dans le monde
  rationale: Cette proposition rattache explicitement le complément à « corruption », conformément à la construction grecque.
- source_word: ἐν ἐπιθυμίᾳ
  choice: à cause des mauvais désirs
  rationale: La préposition ἐν peut ici exprimer la sphère ou le moyen, tandis que le contexte donne à ἐπιθυμία une valeur morale négative. Le pluriel français est idiomatique et évite de réduire le terme au désir sexuel.
theological_decisions:
- issue: La participation à la nature divine (θείας κοινωνοὶ φύσεως)
  choice: participants de la nature divine
  alternative: ayant part à la nature divine
  rationale: La formulation préserve l’affirmation forte d’une participation réelle sans expliquer celle-ci à partir d’un système doctrinal ultérieur ni suggérer que les croyants deviennent divins par essence.
- issue: La valeur morale de ἐπιθυμία
  choice: mauvais désirs
  alternative: désir ; convoitise
  rationale: Le mot peut désigner un désir en général, mais son association avec la corruption du monde lui donne ici une valeur négative. « Mauvais désirs » rend ce contexte sans limiter indûment le sens au domaine sexuel.
- issue: Le rapport logique du participe ἀποφυγόντες
  choice: ayant échappé
  alternative: après avoir échappé ; en échappant
  rationale: Le participe peut évoquer une action antérieure ou associée au fait de devenir participants. La traduction participiale conserve cette souplesse plutôt que de fixer entièrement le rapport logique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec là où elle demeure naturelle, tandis que « par ces promesses » explicite un référent immédiat pour assurer la clarté. Les notes sont placées après les expressions auxquelles elles se rapportent.
