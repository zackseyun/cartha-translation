id: 2PE.1.18
reference: 2 Peter 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: fr
  text: Nous-mêmes, nous avons entendu cette voix portée du ciel, lorsque nous étions avec lui sur la montagne sainte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « apportée du ciel ».'
    reason: Alternative lexicale pour le participe passif ἐνεχθεῖσαν.
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: cette voix
  rationale: φωνή désigne ici la voix qui a prononcé la déclaration divine du verset précédent; « voix » est donc plus précis que « son ».
- source_word: ἡμεῖς
  choice: nous-mêmes
  rationale: Le pronom grec explicite renforce le sujet déjà marqué par le verbe et souligne la qualité de témoins directs.
- source_word: ἠκούσαμεν
  choice: avons entendue
  rationale: L’aoriste présente l’événement ponctuel où les témoins ont entendu la voix; l’accord du participe passé est requis puisque « cette voix » précède le verbe.
- source_word: ἐξ οὐρανοῦ
  choice: du ciel
  rationale: Expression française naturelle qui conserve l’idée d’origine indiquée par ἐκ.
- source_word: ἐνεχθεῖσαν
  choice: venir
  rationale: Le participe passif de φέρω indique que la voix est venue ou a été portée du ciel. « Entendue venir du ciel » est naturel en français sans préciser davantage l’agent implicite; l’alternative plus formelle est signalée en note.
- source_word: σὺν αὐτῷ ὄντες
  choice: lorsque nous étions avec lui
  rationale: La proposition temporelle restitue naturellement la valeur circonstancielle du participe; « lui » renvoie à Jésus dans le contexte.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: sur la montagne sainte
  rationale: « Sur » convient à l’usage français pour une montagne, et « sainte » conserve la qualification religieuse de ἁγίῳ sans identifier le lieu.
theological_decisions:
- issue: Identification de « la montagne sainte »
  choice: Référence descriptive à la montagne de la transfiguration de Jésus, sans identification géographique explicite.
  alternative: Identifier la montagne au mont Thabor ou au mont Hermon.
  rationale: Le texte grec qualifie la montagne de sainte mais ne la nomme pas; la traduction n’ajoute donc aucune identification traditionnelle ou conjecturale.
- issue: Sens passif de ἐνεχθεῖσαν appliqué à la voix
  choice: « venir du ciel », avec une note donnant « être portée du ciel »
  alternative: « apportée du ciel » ou « transmise du ciel »
  rationale: Le texte représente la voix comme portée depuis le ciel, sans nommer explicitement l’agent. Le français courant préfère « venir » dans cette construction, tandis que la note préserve la formulation passive plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre « cette voix, nous l’avons nous-mêmes entendue » maintient la mise en relief du complément et l’insistance portée par ἡμεῖς. « Montagne sainte » conserve le registre biblique sans archaïsme.
