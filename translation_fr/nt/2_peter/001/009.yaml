    rationale: Elle est compréhensible, mais elle calque la construction grecque et sonne moins naturelle que « ces choses font défaut ».
  - severity: low
    issue: Verbalisation de « purification »
    rationale: « Il a oublié qu’il a été purifié » reste sémantiquement proche, mais remplace le substantif grec par une proposition et explicite une structure que le texte ne formule pas ainsi.
  - severity: low
    issue: Coordination « aveugle et myope »
    rationale: Le grec emploie un prédicat suivi d’un participe. La virgule en français maintient plus clairement la seconde image comme qualification ou précision, sans résoudre leur tension.
  revised_text: 'Car celui à qui ces choses font défaut est aveugle, myope[a] : il a oublié la purification de ses péchés d’autrefois.'
