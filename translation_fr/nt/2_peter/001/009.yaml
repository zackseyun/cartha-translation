review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle, y compris la double image « aveugle / myope » et l’idée d’un oubli de la purification des péchés passés. Toutefois, « ces choses ne sont pas présentes » est un calque moins idiomatique de πάρεστιν, et la subordonnée « qu’il a été purifié » explicite et transforme inutilement le nom grec « purification ».
  naturalness: « Celui à qui ces choses font défaut » est plus naturel en français international moderne tout en conservant l’anaphore volontairement large de ταῦτα. La juxtaposition « aveugle, myope » rend mieux le participe μυωπάζων que la coordination « et ».
  terminology: « La purification de ses péchés d’autrefois » conserve la forme nominale de καθαρισμός et le rapport génitif sans ajouter de précision sur l’agent ou le moyen de la purification. « Péchés d’autrefois » rend πάλαι de façon naturelle.
