source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: fr
  text: 'Car celui à qui ces choses font défaut est aveugle, myope[a] : il a oublié la purification de ses péchés d’autrefois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne voyant que ce qui est proche » ; ou « à courte vue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: En effet, celui chez qui ces choses ne sont pas présentes
  rationale: La tournure conserve l’image grecque de qualités qui ne sont pas présentes chez quelqu’un, tout en restant naturelle en français. « Ces choses » renvoie sans les redéfinir aux qualités énumérées auparavant.
- source_word: τυφλός ἐστιν
  choice: est aveugle
  rationale: Traduction directe de la métaphore visuelle.
- source_word: μυωπάζων
  choice: et myope
  rationale: Le participe décrit ou précise l’aveuglement par l’idée d’une vision limitée à ce qui est proche. La coordination produit une formulation française naturelle sans effacer la tension entre « aveugle » et « myope ».
- source_word: λήθην λαβών
  choice: il a oublié
  rationale: L’expression grecque, littéralement « ayant reçu l’oubli », est rendue par son équivalent idiomatique courant.
- source_word: τοῦ καθαρισμοῦ
  choice: qu’il a été purifié
  rationale: La formulation verbale rend clairement l’expérience de purification visée par le nom grec, dans un français simple et fluide.
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: de ses péchés d’autrefois
  rationale: « D’autrefois » conserve la référence temporelle de πάλαι et « ses » respecte le référent individuel générique.
theological_decisions:
- issue: Rapport entre l’aveuglement et la myopie
  choice: est aveugle et myope
  alternative: est aveugle, ne voyant que ce qui est proche
  rationale: Le texte garde côte à côte les deux images du grec sans tenter de résoudre leur tension en faisant de l’une une simple explication de l’autre.
- issue: Sens du génitif après « purification »
  choice: il a été purifié de ses péchés
  alternative: la purification de ses péchés
  rationale: Le génitif peut désigner les péchés dont la personne a été purifiée. La tournure française retenue exprime ce rapport naturellement sans préciser ici le moyen ni le moment de cette purification.
- issue: Référent générique masculin singulier
  choice: celui… ses péchés
  alternative: quiconque… ses péchés
  rationale: Le singulier représentatif du grec est conservé. En français, « celui » est ici générique et ne vise pas exclusivement les hommes.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase préserve le renvoi anaphorique de « ces choses », la métaphore visuelle double et le caractère individuel générique de l’énoncé.
