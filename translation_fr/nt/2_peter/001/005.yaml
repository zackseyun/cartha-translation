id: 2PE.1.5
reference: 2 Peter 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: fr
  text: Pour cette raison même, faites tous vos efforts pour ajouter[c] à votre foi[a] la vertu[b], et à la vertu la connaissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confiance » ou « fidélité » pour « foi » (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Ou « excellence morale » pour « vertu » (ἀρετή).
    reason: lexical_alternative
  - marker: c
    text: Le verbe grec peut aussi être rendu par « fournir » ou « procurer »; il évoque le fait de pourvoir généreusement à quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Pour cette raison même
  rationale: Cette formulation française naturelle conserve le lien emphatique avec ce qui précède, exprimé par αὐτὸ τοῦτο et δέ.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: faites tous vos efforts
  rationale: La reformulation verbale rend naturellement en français l’action concomitante du participe aoriste et l’idée d’un empressement entier.
- source_word: ἐπιχορηγήσατε
  choice: ajouter
  rationale: Dans cette série progressive, « ajouter à » exprime clairement le rapport entre les qualités. Le sens plus littéral de fournir ou de procurer généreusement est signalé en note.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: à votre foi
  rationale: Bien que ἐν signifie formellement « dans », « ajouter à votre foi » est idiomatique en français et rend clairement la progression de la liste sans imposer une relation théologique plus précise.
- source_word: πίστει
  choice: foi
  rationale: « Foi » rend le sens lexical central de πίστις dans ce contexte, tout en laissant en note les nuances possibles de confiance et de fidélité.
- source_word: ἀρετήν
  choice: vertu
  rationale: « Vertu » est concis, digne et compréhensible; il désigne ici l’excellence du caractère sans développer le terme en paraphrase.
- source_word: γνῶσιν
  choice: connaissance
  rationale: « Connaissance » correspond directement au noyau sémantique de γνῶσις et préserve la progression des qualités.
theological_decisions:
- issue: Sens de πίστις dans la liste des qualités
  choice: foi
  alternative: fidélité ou confiance
  rationale: Le contexte permet des nuances qui se recouvrent. Le texte principal retient le terme français usuel « foi », tandis que la note préserve les autres possibilités sans trancher au-delà des données lexicales.
- issue: Relation exprimée par ἐν entre les qualités
  choice: ajouter à votre foi la vertu, et à la vertu la connaissance
  alternative: fournir la vertu dans votre foi, et la connaissance dans la vertu
  rationale: Le français idiomatique demande ici une restructuration. « Ajouter à » conserve la progression sans décider si chaque qualité est le fondement, le cadre ou l’accompagnement de la suivante; la nuance du verbe grec est documentée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est restructurée pour éviter le tour peu idiomatique « dans votre foi, la vertu », tout en conservant la chaîne ascendante du grec et ses principales ambiguïtés dans les notes.
