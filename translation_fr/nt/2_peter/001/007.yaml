id: 2PE.1.7
reference: 2 Peter 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: fr
  text: et à l’attachement à Dieu, l’affection fraternelle[a] ; et à l’affection fraternelle, l’amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour fraternel ». Le terme grec désigne l’affection portée à des frères, particulièrement aux autres croyants.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: attachement à Dieu
  rationale: Le terme désigne une dévotion respectueuse envers Dieu qui se manifeste dans la conduite. « Attachement à Dieu » exprime cette orientation et reste naturel en français moderne.
- source_word: φιλαδελφίαν
  choice: affection fraternelle
  rationale: Le terme évoque l’affection qui unit des frères et, dans l’usage chrétien, particulièrement les membres de la communauté croyante. Cette formulation le distingue du terme ἀγάπη qui suit.
- source_word: ἀγάπην
  choice: amour
  rationale: « Amour » est l’équivalent français direct et suffisamment large ; il conserve la progression après l’affection fraternelle sans préciser indûment sa portée.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: et à ..., ...
  rationale: Dans la chaîne commencée aux versets précédents, cette tournure française indique naturellement la qualité qu’il faut joindre à la précédente, tout en conservant le parallélisme.
- source_word: δέ
  choice: et
  rationale: La particule est ici connective et poursuit l’énumération, sans opposition marquée.
theological_decisions:
- issue: Distinction entre φιλαδελφία et ἀγάπη dans la suite des qualités
  choice: Traduire φιλαδελφία par « affection fraternelle » et ἀγάπη par « amour »
  alternative: Traduire φιλαδελφία par « amour fraternel » et ἀγάπη par « amour »
  rationale: Le grec emploie successivement deux termes apparentés mais distincts. « Affection fraternelle » préserve leur distinction ainsi que la progression rhétorique, sans imposer une définition doctrinale de la portée de ἀγάπη.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « l’affection fraternelle » conserve le parallélisme de l’original et son effet de chaîne. Le point-virgule rend clairement les deux membres coordonnés.
