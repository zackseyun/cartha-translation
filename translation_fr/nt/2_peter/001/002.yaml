id: 2PE.1.2
reference: 2 Peter 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: fr
  text: Que la grâce et la paix vous soient multipliées dans la connaissance[b] de Dieu et de Jésus notre Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la connaissance de Dieu et de Jésus notre Seigneur ». La préposition grecque peut indiquer la sphère (« dans ») ou le moyen (« par », « au moyen de »).'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la pleine connaissance ». Le mot grec ἐπίγνωσις peut désigner une connaissance plus pleine ou plus approfondie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Terme consacré des bénédictions épistolaires; « grâce » conserve à la fois la formule de salutation et l’idée de faveur divine.
- source_word: εἰρήνη
  choice: paix
  rationale: Rendu naturel et théologiquement riche, qui préserve aussi la résonance sémitique probable du terme.
- source_word: πληθυνθείη
  choice: vous soient multipliées
  rationale: L’optatif aoriste passif exprime ici un souhait ou une bénédiction. Le pluriel reprend ensemble « la grâce et la paix » et conserve le sens passif du verbe.
- source_word: ἐν
  choice: dans
  rationale: La préposition peut indiquer la sphère (« dans ») ou le moyen (« par »). « Dans » est le rendu direct qui maintient cette ouverture interprétative.
- source_word: ἐπιγνώσει
  choice: la connaissance
  rationale: Le terme peut évoquer une connaissance plus pleine ou approfondie, mais « connaissance » est ici le rendu français le plus naturel sans surinterprétation.
- source_word: θεοῦ
  choice: Dieu
  rationale: Complément au génitif de « connaissance ».
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Transcription française usuelle du nom propre.
- source_word: κυρίου
  choice: Seigneur
  rationale: Titre néotestamentaire usuel, qui conserve sa portée christologique.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: de Dieu et de Jésus notre Seigneur
  rationale: La répétition française de « de » indique naturellement que Dieu et Jésus dépendent tous deux de « connaissance », sans ajouter une distinction absente du grec.
theological_decisions:
- issue: Nuance de ἐπίγνωσις dans ce contexte spirituel
  choice: connaissance
  alternative: pleine connaissance; connaissance approfondie
  rationale: Le mot peut avoir une valeur renforcée, notamment dans 2 Pierre, mais le texte principal évite d’en faire un terme technique; la nuance possible est signalée en note.
- issue: Valeur de ἐν devant ἐπιγνώσει
  choice: dans la connaissance de Dieu et de Jésus notre Seigneur
  alternative: par la connaissance de Dieu et de Jésus notre Seigneur; au moyen de la connaissance de Dieu et de Jésus notre Seigneur
  rationale: Le grec permet de comprendre la préposition comme indiquant soit la sphère, soit le moyen. Le texte principal retient la formulation la plus directe sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure optative est rendue par « Que… soient », formule naturelle de bénédiction. « Multipliées » conserve l’image et la voix passive du grec.
