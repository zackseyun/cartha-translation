reference: 2 Peter 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: fr
  text: Et nous avons la parole prophétique, plus certaine encore[a]. Vous faites bien d’y prêter attention, comme à une lampe qui brille dans un lieu obscur, jusqu’à ce que le jour commence à poindre et que l’étoile du matin[b] se lève dans vos cœurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le comparatif grec peut soit souligner la sûreté particulière de la parole prophétique, soit suggérer que le témoignage apostolique la confirme.
    reason: alternative_reading
  - marker: b
    text: L’expression « étoile du matin » peut avoir une résonance messianique ; voir Apocalypse 22.16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: pour d’autant plus certaine
  rationale: Le comparatif est conservé sans ajouter explicitement l’idée qu’elle aurait été « rendue » plus certaine. Cette tournure française permet de rattacher sa certitude accrue au témoignage apostolique qui précède, tout en laissant ouverte l’autre compréhension possible.
- source_word: τὸν προφητικὸν λόγον
  choice: la parole prophétique
  rationale: Rendu direct et naturel qui conserve l’adjectif grec et la portée solennelle de λόγος.
- source_word: ᾧ καλῶς ποιεῖτε προσέχοντες
  choice: Vous faites bien d’y prêter attention
  rationale: Formulation française courante et digne, qui exprime l’approbation et l’attention soutenue indiquées par le grec.
- source_word: λύχνῳ φαίνοντι
  choice: une lampe qui brille
  rationale: Préserve simplement la comparaison et l’action continue du participe présent.
- source_word: ἐν αὐχμηρῷ τόπῳ
  choice: dans un lieu obscur
  rationale: « Obscur » convient à l’image de la lampe et rend le caractère sombre ou lugubre du lieu sans introduire l’idée moins probable d’insalubrité.
- source_word: ἡμέρα διαυγάσῃ
  choice: le jour commence à poindre
  rationale: Rend le début de l’illumination exprimé par le verbe et s’intègre naturellement à l’image de l’aube.
- source_word: φωσφόρος
  choice: l’étoile du matin
  rationale: Équivalent français usuel dans ce contexte astral; il garde intactes les résonances possibles sans identifier explicitement la figure.
- source_word: ἀνατείλῃ
  choice: se lève
  rationale: Verbe idiomatique pour le lever d’un astre, fidèle à l’imagerie céleste.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans vos cœurs
  rationale: Rendu direct qui conserve la référence biblique à l’être intérieur sans l’expliciter indûment.
theological_decisions:
- issue: Rapport entre le comparatif βεβαιότερον, le témoignage apostolique et la parole prophétique
  choice: « nous tenons la parole prophétique pour d’autant plus certaine »
  alternative: « nous avons la parole prophétique, qui est plus certaine » ou « nous avons la parole prophétique rendue plus certaine »
  rationale: Le grec permet soit de comprendre que l’expérience apostolique confirme la parole prophétique, soit de souligner que celle-ci est particulièrement sûre. Le texte principal suggère la première relation contextuelle sans introduire le verbe causal « rendre »; la note préserve explicitement l’ambiguïté.
- issue: Référent de φωσφόρος
  choice: Conserver l’image de « l’étoile du matin » sans identification explicite
  alternative: Identifier directement l’étoile au Messie ou y voir uniquement l’illumination eschatologique
  rationale: Le contexte et d’autres textes bibliques peuvent donner à l’image une résonance messianique, mais ce verset n’en nomme pas le référent. La traduction maintient donc l’image et sa tension théologique.
translation_notes:
  register: Français international actuel, clair et digne. La phrase grecque a été divisée en deux phrases pour une lecture naturelle. « D’autant plus certaine » maintient le comparatif et son lien contextuel sans surinterpréter le mécanisme de confirmation; les deux ambiguïtés théologiques principales sont conservées dans le texte et les notes.
