id: 2PE.2.19
reference: 2 Peter 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: fr
  text: Ils leur promettent la liberté, alors qu’ils sont eux-mêmes esclaves de la corruption ; car chacun est aussi réduit en esclavage par ce qui l’a vaincu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car ce par quoi quelqu’un a été vaincu, c’est aussi à cela qu’il a été asservi ».'
    reason: La formulation plus littérale conserve les deux datifs grecs et la valeur résultative du parfait, mais elle est moins naturelle en français.
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: la liberté
  rationale: « Liberté » est le terme français courant et maintient le contraste direct avec l’esclavage.
- source_word: ἐπαγγελλόμενοι
  choice: Ils leur promettent
  rationale: Le participe exprime bien l’action de faire une promesse ; une proposition principale est naturelle en français.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le statut d’asservissement est central dans l’opposition entre la liberté promise et la domination réelle ; « serviteurs » affaiblirait cette opposition.
- source_word: ὑπάρχοντες
  choice: alors qu’ils sont eux-mêmes
  rationale: Cette formulation rend l’état simultané des faux enseignants et souligne naturellement le contraste ironique.
- source_word: φθορᾶς
  choice: de la corruption
  rationale: « Corruption » conserve à la fois les connotations morales et l’idée de dégradation ou de ruine, sans trancher entre elles.
- source_word: ᾧ γάρ τις ἥττηται
  choice: car chacun est aussi réduit en esclavage par ce qui l’a vaincu
  rationale: La tournure française reformule la maxime générale sans restreindre τις à un genre précis ; « vaincu » préserve l’image de la défaite.
- source_word: τούτῳ καὶ δεδούλωται
  choice: est aussi réduit en esclavage par ce qui
  rationale: Le parfait passif indique un asservissement acquis dont l’état demeure. « Réduit en esclavage » maintient le lien lexical avec « esclaves ».
theological_decisions:
- issue: Rendre δοῦλοι et δεδούλωται dans le contraste entre fausse liberté et asservissement réel
  choice: « esclaves » et « réduit en esclavage »
  alternative: « serviteurs » et « assujetti »
  rationale: Les termes forts préservent l’ironie et la domination exprimées par le grec, sans adoucir la portée théologique du passage.
- issue: Portée de φθορά
  choice: « corruption »
  alternative: « dépravation », « destruction » ou « dégradation »
  rationale: Le mot grec peut évoquer la corruption morale aussi bien que la ruine. « Corruption » laisse subsister cette tension sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée dans la maxime finale afin d’éviter le pronom masculin générique et d’obtenir une formulation naturelle, tout en conservant la causalité, la défaite et l’asservissement.
