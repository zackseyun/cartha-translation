review_pass:
  verdict: approve
  source_fidelity: Le texte rend fidèlement le contraste de ἐλευθερίαν (« la liberté ») avec δοῦλοι τῆς φθορᾶς (« esclaves de la corruption »). La maxime finale conserve la relation entre la défaite (ἥττηται) et l’asservissement durable exprimé par le parfait passif δεδούλωται. La reformulation française « réduit en esclavage par ce qui l’a vaincu » est idiomatique tout en préservant le sens causal et la portée générique de τις.
  naturalness: Français moderne, fluide et d’un registre approprié. « Alors qu’ils sont eux-mêmes » exprime naturellement le contraste du participe ὑπάρχοντες. La formulation inclusive « chacun » évite sans difficulté un masculin générique et ne modifie pas la généralité du grec.
  terminology: « Esclaves » et « réduit en esclavage » maintiennent avec justesse la force et le lien lexical de δοῦλοι / δεδούλωται, conformément à l’opposition centrale du verset. « Corruption » est un choix suffisamment large pour φθορά et ne tranche pas indûment entre corruption morale, dégradation et ruine.
