id: 2PE.2.9
reference: 2 Peter 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: fr
  text: le Seigneur sait donc délivrer de l’épreuve les personnes pieuses[a], et garder les injustes en les châtiant jusqu’au jour du jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la tentation ». Le mot grec peut désigner soit une tentation, soit une épreuve ou une mise à l’épreuve ; ici, le contexte favorise la délivrance de l’épreuve.
    reason: lexical_alternative
  - marker: b
    text: Ou « garder les injustes pour le jour du jugement, afin qu’ils soient châtiés ». Le participe grec peut décrire un châtiment en cours ou un châtiment lié au jugement à venir.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: sait
  rationale: Avec les infinitifs « délivrer » et « garder », « sait » exprime naturellement en français la capacité et le savoir pratique du Seigneur, sans qu’il soit nécessaire d’ajouter « comment ».
- source_word: κύριος
  choice: le Seigneur
  rationale: Rendu français courant, digne et conforme au sens du titre κύριος dans ce contexte.
- source_word: εὐσεβεῖς
  choice: ceux qui lui sont attachés
  rationale: L’adjectif substantivé désigne les personnes caractérisées par leur respect et leur dévouement envers Dieu. Cette formulation naturelle explicite la relation implicite sans employer le peu courant « les pieux ».
- source_word: ἐκ πειρασμοῦ
  choice: de l’épreuve
  rationale: πειρασμός peut désigner une épreuve ou une tentation. Les exemples de Noé et de Lot dans le contexte favorisent ici l’épreuve, tout en laissant l’autre possibilité en note.
- source_word: ῥύεσθαι
  choice: délivrer
  rationale: ῥύομαι exprime le fait d’arracher à un danger. « Délivrer » est naturel dans ce registre et convient à l’intervention divine décrite.
- source_word: ἀδίκους
  choice: les injustes
  rationale: Ce substantif adjectival désigne ceux qui agissent contrairement à la justice; « les injustes » conserve à la fois la portée morale et judiciaire.
- source_word: εἰς ἡμέραν κρίσεως
  choice: jusqu’au jour du jugement
  rationale: Avec τηρεῖν, la préposition εἰς oriente la garde vers le jour futur du jugement; « jusqu’au » rend clairement cette borne temporelle dans le contexte.
- source_word: κολαζομένους
  choice: sous le châtiment
  rationale: Le participe présent peut décrire les injustes comme subissant déjà un châtiment pendant qu’ils sont gardés. La formulation maintient cet aspect duratif sans imposer un système doctrinal plus détaillé.
- source_word: τηρεῖν
  choice: garder
  rationale: τηρέω signifie garder, maintenir ou réserver. « Garder » reste assez large pour que le participe précise la situation punitive.
theological_decisions:
- issue: Sens de πειρασμός dans le contexte
  choice: épreuve
  alternative: tentation
  rationale: Le passage récapitule la délivrance de Noé et de Lot au milieu de circonstances hostiles et du jugement. « Épreuve » correspond mieux à ce contexte, tandis qu’une note préserve l’ambiguïté lexicale.
- issue: Valeur de κολαζομένους
  choice: un châtiment en cours avant le jour du jugement
  alternative: être gardés pour être châtiés au jour du jugement
  rationale: Le participe présent se prête à une lecture durative, mais sa relation syntaxique avec τηρεῖν et εἰς ἡμέραν κρίσεως permet aussi une orientation vers le châtiment futur. Le texte principal et la note conservent cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le parallélisme entre la délivrance des fidèles et la garde des injustes, ainsi que les ambiguïtés réelles de πειρασμός et κολαζομένους.
