  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: fr
  text: 'Ils ont les yeux pleins d’une femme adultère[a], sans jamais cesser de pécher[b] ; ils prennent au piège les personnes mal affermies. Ils ont le cœur entraîné à la cupidité : ce sont des enfants de malédiction.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « pleins d’adultère » ou « pleins de désir adultère ». Le grec dit littéralement « pleins d’une femme adultère », expression volontairement saisissante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui ne cessent pas de pécher » ou « sans relâche dans le péché ». Le grec emploie une tournure concise, littéralement « ne cessant pas de péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος
  choice: Ils ont les yeux pleins d’une femme adultère
  rationale: La formulation concrète et saisissante du grec, littéralement « pleins d’une femme adultère », est conservée plutôt que remplacée silencieusement par l’interprétation abstraite « pleins d’adultère ».
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: incapables de cesser de pécher
  rationale: Cette formulation rend le sens de ce qui ne s’arrête pas ou ne peut s’arrêter par rapport au péché. L’adjectif reste rattaché aux « yeux », conformément à la construction grecque.
- source_word: δελεάζοντες
  choice: ils attirent par un appât
  rationale: Le verbe évoque l’action d’appâter ou d’attirer dans un piège ; cette expression française conserve mieux cette nuance prédatrice que le simple verbe « séduire ».
- source_word: ψυχὰς ἀστηρίκτους
  choice: les personnes mal affermies
  rationale: ψυχαί désigne ici des êtres humains exposés à la tromperie, et ἀστήρικτοι ceux qui ne sont pas fermement établis. « Personnes mal affermies » est clair sans imposer une lecture technique du mot « âmes ».
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: le cœur exercé à la cupidité
  rationale: γεγυμνασμένην garde l’image d’un entraînement répété, tandis que « cupidité » exprime le désir avide d’avoir davantage.
- source_word: κατάρας τέκνα
  choice: des enfants de malédiction
  rationale: La construction génitive imagée est préservée. Elle désigne des personnes caractérisées par la malédiction ou qui y sont vouées, sans réduire l’expression à un simple adjectif.
theological_decisions:
- issue: Faut-il atténuer l’image sexuelle de μοιχαλίδος ?
  choice: Conserver dans le texte « une femme adultère ».
  alternative: Traduire de manière interprétative par « adultère » ou « désir adultère ».
  rationale: Le singulier concret appartient à la force accusatrice du texte grec. Une note fournit les formulations interprétatives sans effacer l’image originale.
- issue: Portée de κατάρας τέκνα
  choice: Conserver l’expression « enfants de malédiction ».
  alternative: Expliciter par « enfants maudits » ou « voués à la malédiction ».
  rationale: Le grec peut évoquer à la fois la caractérisation par la malédiction et le fait d’y être destiné. La formulation retenue maintient cette tension.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation transforme la chaîne participiale grecque en propositions lisibles tout en conservant son accumulation accusatrice. Les images inhabituelles de l’original sont maintenues et éclairées en notes.
