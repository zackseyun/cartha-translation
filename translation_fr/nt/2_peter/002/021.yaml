  source_fidelity: La comparaison irréelle, la répétition d’ἐπιγινώσκω, le singulier « commandement » et la transmission passive sont globalement bien rendus. Toutefois, « l’avoir connue et de se détourner » coordonne deux actions là où le grec présente explicitement le détournement comme postérieur à la connaissance (ἐπιγνοῦσιν). Une formulation temporelle est plus fidèle.
