id: 2PE.2.21
reference: 2 Peter 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: fr
  text: En effet, il aurait mieux valu pour eux ne pas avoir connu la voie de la justice[a] que, après l’avoir connue, de se détourner[b] du saint commandement qui leur avait été transmis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chemin de la justice ». Ici, « justice » désigne la conduite droite ; le mot grec peut aussi, selon le contexte, évoquer l’équité.
    reason: lexical_alternative
  - marker: b
    text: Ou « se détourner en revenant sur ses pas ». Le verbe grec souligne un mouvement de retour ou de recul.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui leur avait été remis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν
  choice: En effet, il aurait mieux valu
  rationale: Cette tournure française naturelle rend la valeur explicative de γάρ et le comparatif irréel portant sur le passé exprimé par κρεῖττον ἦν.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: avoir connu / l’avoir connue
  rationale: La répétition de « connaître » reproduit celle du verbe grec sans exagérer le préverbe ἐπι- par « connaître pleinement ». Le pronom féminin renvoie naturellement à « la voie ».
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: la voie de la justice
  rationale: « Voie » conserve la métaphore d’un chemin ou d’une manière de vivre. En français biblique moderne, « justice » exprime ici la conduite droite conforme à Dieu sans imposer une paraphrase doctrinale.
- source_word: ὑποστρέψαι ἐκ
  choice: se détourner de
  rationale: Cette expression idiomatique rend clairement l’éloignement et le renversement de direction. Une note conserve la nuance plus littérale du mouvement de retour portée par ὑποστρέφω.
- source_word: παραδοθείσης αὐτοῖς
  choice: qui leur avait été transmis
  rationale: « Transmis » rend le passif de παραδίδωμι et l’antériorité de la transmission, sans ajouter la nuance de responsabilité qu’aurait « confié ».
- source_word: ἁγίας ἐντολῆς
  choice: du saint commandement
  rationale: Le singulier est conservé, ainsi que la qualification religieuse et morale de ἁγίας. « Commandement » est digne, clair et courant dans ce contexte.
theological_decisions:
- issue: Le rapport entre la connaissance de la voie juste et le fait de s’en détourner
  choice: Décrire sans atténuation une connaissance réelle suivie d’un détournement, sans préciser les conséquences sotériologiques.
  alternative: Formuler le verset soit comme une perte explicite du salut, soit comme une simple exposition extérieure et superficielle.
  rationale: Le grec affirme qu’ils ont connu la voie de la justice puis se sont détournés du commandement reçu, mais il ne tranche pas à lui seul les débats doctrinaux sur l’apostasie, la persévérance ou la nature de leur profession de foi.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la comparaison du grec, la répétition de « connaître », le singulier « commandement » et la tension théologique du passage sans l’expliciter dans un sens confessionnel.
