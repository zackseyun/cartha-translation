reference: 2 Peter 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: fr
  text: Dans leur avidité, ils vous exploiteront par des discours inventés[a]. Depuis longtemps, leur jugement n’est pas inactif, et leur destruction ne sommeille pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « feront commerce de vous » : le grec emploie une métaphore commerciale pour décrire le fait de tirer profit de personnes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: dans leur avidité
  rationale: Le nom désigne l’avidité ou la convoitise et présente ici le mobile ou le cadre moral de leur conduite. « Dans leur avidité » reste proche de la construction grecque tout en étant naturel en français.
- source_word: πλαστοῖς λόγοις
  choice: par des discours inventés
  rationale: πλαστός évoque ce qui est façonné ou fabriqué. « Discours inventés » exprime des propos délibérément conçus, plutôt qu’une fausseté seulement générique.
- source_word: ἐμπορεύσονται
  choice: ils vous exploiteront
  rationale: 'Le verbe porte une métaphore commerciale : ces personnes traitent leurs auditeurs comme une source de profit. « Exploiteront » en communique clairement la portée en français moderne, tandis que la note conserve l’image littérale.'
- source_word: κρίμα
  choice: jugement
  rationale: Le terme peut désigner un verdict judiciaire ou la peine qui en découle. « Jugement » conserve cette amplitude sans préciser davantage la nature du châtiment.
- source_word: ἔκπαλαι
  choice: depuis longtemps
  rationale: L’adverbe souligne l’ancienneté du jugement annoncé. « Depuis longtemps » en restitue directement la valeur temporelle.
- source_word: οὐκ ἀργεῖ
  choice: n’est pas inactif
  rationale: ἀργέω signifie être inactif, oisif ou sans effet. Cette traduction maintient la personnification et évite de réduire l’expression à la seule idée d’un retard.
- source_word: ἀπώλεια
  choice: destruction
  rationale: Le mot désigne la destruction ou la ruine. « Destruction » est clair et conserve la gravité de l’avertissement sans en définir les modalités.
- source_word: οὐ νυστάζει
  choice: ne sommeille pas
  rationale: Le verbe signifie somnoler ou s’assoupir. « Ne sommeille pas » garde la vive personnification de la destruction et convient au registre digne du passage.
theological_decisions:
- issue: Nature du châtiment annoncé
  choice: Présenter directement le jugement et la destruction qui menacent les faux enseignants, sans définir les modalités ni la durée de ce châtiment.
  alternative: Interpréter « destruction » soit comme annihilation, soit comme simple ruine sans jugement final.
  rationale: Le verset affirme la certitude du jugement, mais ne précise pas à lui seul la mécanique ou la durée du châtiment. La traduction conserve donc la tension du texte sans importer un système doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. « Discours inventés » évite la lourdeur de « paroles fabriquées », tandis que « n’est pas inactif » et « ne sommeille pas » préservent les personnifications parallèles du grec.
