id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: fr
  text: Mais il y eut aussi de faux prophètes parmi le peuple, tout comme il y aura aussi parmi vous de faux enseignants, qui introduiront en secret des hérésies destructrices[a], reniant le Maître qui les a achetés[b] et s’attirant une destruction rapide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des factions destructrices ». Le mot grec peut désigner des partis ou des sectes, mais il évoque probablement ici des enseignements ou des mouvements qui conduisent à la destruction.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Seigneur qui les a rachetés ». Le grec dit littéralement « le Maître qui les a achetés » ; cette métaphore de l’achat est conservée sans trancher les débats théologiques sur sa nature ou sa portée.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: il y eut
  rationale: Cette tournure française naturelle présente l’apparition historique des faux prophètes sans alourdir le texte par un calque comme « vinrent à l’existence ».
- source_word: ψευδοπροφῆται
  choice: de faux prophètes
  rationale: Équivalent direct et courant du nom composé grec.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: Rend l’appartenance à la communauté visée tout en laissant au contexte l’identification du peuple d’Israël.
- source_word: ὡς καὶ ἐν ὑμῖν ἔσονται
  choice: tout comme il y aura parmi vous
  rationale: Conserve clairement le parallèle entre les faux prophètes du passé et les faux enseignants à venir.
- source_word: ψευδοδιδάσκαλοι
  choice: de faux enseignants
  rationale: Traduction transparente qui maintient le parallélisme avec « de faux prophètes ».
- source_word: παρεισάξουσιν
  choice: introduiront en secret
  rationale: Exprime à la fois l’introduction de ces hérésies et le caractère clandestin ou insidieux suggéré par le verbe grec.
- source_word: αἱρέσεις ἀπωλείας
  choice: des hérésies destructrices
  rationale: Le génitif indique des hérésies caractérisées par la destruction ou qui y conduisent. Cette formulation française reste concise et laisse en note le sens possible de factions ou de sectes.
- source_word: τὸν ... δεσπότην
  choice: le Maître
  rationale: « Maître » distingue δεσπότης de κύριος et conserve l’idée d’autorité et de possession exprimée dans le contexte.
- source_word: ἀγοράσαντα αὐτοὺς
  choice: qui les a achetés
  rationale: Préserve directement la métaphore commerciale du verbe ἀγοράζω sans la remplacer dans le texte par l’interprétation théologique plus précise « racheter ».
- source_word: ἀρνούμενοι
  choice: iront jusqu’à renier
  rationale: « Renier » exprime fortement le refus du Maître; « iront jusqu’à » rend naturellement la valeur intensive de καί dans l’enchaînement.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: attirant ainsi sur eux-mêmes une destruction rapide
  rationale: Conserve la force réflexive, la conséquence de leurs actes et l’idée d’une destruction qui survient promptement.
theological_decisions:
- issue: Sens de αἱρέσεις dans ce contexte
  choice: hérésies
  alternative: factions ou sectes
  rationale: L’introduction clandestine de ces αἱρέσεις est liée au reniement du Maître, ce qui met au premier plan leur contenu doctrinal destructeur. La note préserve néanmoins le sens collectif possible du terme.
- issue: Portée de τὸν ἀγοράσαντα αὐτοὺς δεσπότην
  choice: le Maître qui les a achetés
  alternative: le Seigneur qui les a rachetés
  rationale: La formulation principale conserve la métaphore exacte de l’achat et la tension théologique du texte sans trancher la nature ni la portée de cet achat.
- issue: Distinction entre δεσπότης et κύριος
  choice: Maître
  alternative: Seigneur ou Souverain
  rationale: « Maître » maintient une distinction lexicale utile et convient particulièrement à la métaphore selon laquelle ces personnes ont été achetées.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe a été divisée en deux phrases pour assurer la lisibilité sans rompre le rapport logique. Le vocabulaire demeure accessible, tandis que « renier », « Maître » et « hérésies » conservent la gravité théologique du passage.
