review_pass:
  verdict: revise
  source_fidelity: Le sens rétributif de ἀδικούμενοι μισθὸν ἀδικίας est bien rendu par « subissent le salaire de l’injustice », sans imposer davantage la relation du génitif. La proposition sur le plaisir pris à la débauche en plein jour, ainsi que la leçon SBLGNT ἀπάταις (« tromperies »), sont conservées. La variante ἀγάπαις est correctement signalée.
  naturalness: La formulation initiale « Taches et défauts, ils se délectent » est une apposition elliptique peu naturelle en français courant et ne rend pas explicitement la prédication nominale grecque. « Ce sont des taches et des défauts » est clair, idiomatique et garde l’image accusatrice. « En festoyant avec vous » conserve le lien participial sans alourdir la phrase.
  terminology: « Tromperies », « excès », « en plein jour », « taches et défauts » et « festoyant » conviennent à un français international moderne et au registre du passage. Le retrait de « leur » devant « injustice » évite d’expliciter dans le texte français une relation que le grec laisse syntaxiquement plus ouverte.
  issues:
  - severity: medium
    issue: Prédication elliptique dans « Taches et défauts, ils se délectent »
    rationale: Le grec σπίλοι καὶ μῶμοι fonctionne comme une qualification prédicative des personnes visées. En français moderne, l’ellipse produit un fragment abrupt; l’ajout de « Ce sont des » rend la proposition complète sans modifier le sens.
  - severity: low
    issue: Possessif ajouté dans « le salaire de leur injustice »
    rationale: Le grec dit littéralement « salaire de l’injustice / du mal », sans possessif. Le contexte concerne bien leur conduite, mais « de l’injustice » préserve plus exactement l’ambiguïté du génitif.
