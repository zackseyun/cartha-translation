source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: fr
  text: 'Ils subissent le salaire de l’injustice[a]. Ils considèrent comme un plaisir de se livrer aux excès en plein jour. Ce sont des taches et des défauts : ils se délectent de leurs tromperies[b] en festoyant avec vous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la rétribution de leur mauvaise conduite ».'
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits ont « leurs repas fraternels » au lieu de « leurs tromperies » : « ils se délectent de leurs repas fraternels en festoyant avec vous ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: ils subissent
  rationale: Dans ce contexte de rétribution, le participe passif exprime le fait d’éprouver les conséquences du mal commis, plutôt que d’être simplement lésé par autrui.
- source_word: μισθὸν ἀδικίας
  choice: le salaire de leur injustice
  rationale: « Salaire » conserve l’image de la rétribution portée par μισθός. « Injustice » garde la force morale de ἀδικία, et le possessif explicite naturellement en français le rapport avec leur conduite.
- source_word: ἡδονὴν ἡγούμενοι
  choice: ils considèrent comme un plaisir
  rationale: Cette formulation rend directement la construction qui signifie « tenir pour, considérer comme », avec ἡδονή comme attribut.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: se livrer aux excès en plein jour
  rationale: τρυφή évoque une vie de luxe et d’indulgence excessive; « en plein jour » fait ressortir le caractère éhonté suggéré par ἐν ἡμέρᾳ.
- source_word: σπίλοι καὶ μῶμοι
  choice: taches et défauts
  rationale: Le binôme conserve les images complémentaires de souillure et d’imperfection morale, dans un français clair et concis.
- source_word: ἐντρυφῶντες
  choice: ils se délectent
  rationale: Le verbe prolonge le thème de l’indulgence complaisante et produit en français une liaison naturelle avec « leurs tromperies ».
- source_word: ἀπάταις αὐτῶν
  choice: leurs tromperies
  rationale: Le texte SBLGNT porte ἀπάταις, qui désigne les tromperies ou les supercheries et convient au contexte des faux enseignants.
- source_word: συνευωχούμενοι ὑμῖν
  choice: pendant qu’ils festoient avec vous
  rationale: La traduction garde à la fois l’idée d’un repas festif pris en commun et la simultanéité exprimée par le participe.
theological_decisions:
- issue: Variante textuelle ἀπάταις / ἀγάπαις
  choice: ἀπάταις, traduit par « leurs tromperies » dans le texte principal
  alternative: ἀγάπαις, « leurs repas fraternels »
  rationale: Le texte grec fourni lit ἀπάταις et cette leçon s’accorde avec le portrait de personnes trompeuses. La variante ἀγάπαις est néanmoins significative, car elle peut désigner les repas communautaires chrétiens; elle est donc signalée en note sans être intégrée au texte principal.
- issue: Valeur rétributive de ἀδικούμενοι μισθὸν ἀδικίας
  choice: « Ils subissent le salaire de leur injustice »
  alternative: « Ils sont lésés, recevant le salaire de l’injustice »
  rationale: La traduction retenue comprend le passif dans le cadre du jugement et de la rétribution décrit par le contexte, tout en évitant d’en préciser davantage la nature.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le ton accusateur et les images du grec, tout en évitant un calque obscur. « En plein jour » rend explicitement l’idée de conduite éhontée, et « festoient avec vous » ne précise pas la nature du repas au-delà du texte.
