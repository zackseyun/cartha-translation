source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: fr
  text: Mais eux, semblables à des animaux dépourvus de raison — des êtres gouvernés par l’instinct[a], nés pour être capturés et détruits —, blasphèment au sujet de ce qu’ils ne comprennent pas[b] ; ils seront eux aussi détruits dans leur destruction[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque est condensée : elle décrit des animaux « nés par nature » pour être capturés et détruits, c’est-à-dire régis par leur nature ou leur instinct.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « profèrent des insultes au sujet de ce qu’ils ignorent ». Le verbe grec peut désigner le blasphème, la calomnie ou des paroles injurieuses.'
    reason: lexical_alternative
  - marker: c
    text: 'Le grec emploie successivement des mots de la même famille : « destruction » et « seront détruits ». La répétition est donc délibérément conservée.'
    reason: wordplay
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: animaux dépourvus de raison
  rationale: Cette formulation exprime l’absence de raison indiquée par ἄλογα sans suggérer seulement l’incapacité de parler. Elle reste naturelle en français moderne.
- source_word: γεγεννημένα φυσικὰ
  choice: des êtres gouvernés par l’instinct, nés
  rationale: La tournure grecque est très condensée. « Gouvernés par l’instinct » rend la force de φυσικά, tandis que « nés » conserve explicitement l’image de γεγεννημένα.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: pour être capturés et détruits
  rationale: εἰς exprime ici la destination ou l’issue. La formulation passive rend clairement ἅλωσις et le sens destructeur de φθορά dans l’image des animaux.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: ce qu’ils ne comprennent pas
  rationale: Le relatif neutre pluriel vise des réalités ou des sujets non précisés. « Ne comprennent pas » restitue l’idée d’ignorance sans identifier abusivement l’objet.
- source_word: βλασφημοῦντες
  choice: blasphèment
  rationale: Le verbe peut désigner des propos injurieux ou diffamatoires, mais « blasphèment » conserve sa force religieuse possible et l’indétermination de son objet.
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: ils seront eux aussi détruits dans leur destruction
  rationale: La répétition peu ordinaire conserve le jeu étymologique entre φθορά et φθαρήσονται ainsi que l’ambiguïté de la construction prépositionnelle. « Eux aussi » rend καί.
theological_decisions:
- issue: Portée de βλασφημοῦντες
  choice: Conserver « blasphèment » sans préciser l’objet du blasphème.
  alternative: « insultent » ou « calomnient » ce qu’ils ignorent
  rationale: Le grec ne nomme pas ici explicitement l’objet. La traduction retenue maintient la gravité du terme et évite de décider s’il s’agit d’êtres célestes, de réalités sacrées ou d’autres sujets.
- issue: Sens de φθορά et φθαρήσονται
  choice: Employer le champ lexical de la destruction et en conserver la répétition.
  alternative: Employer « corruption », « ruine » ou supprimer la répétition en disant simplement « ils périront ».
  rationale: L’image immédiate d’animaux destinés à être capturés et détruits favorise l’idée de destruction, mais la répétition grecque porte aussi une tension expressive qu’une paraphrase ferait disparaître.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les tirets structurent la comparaison très dense sans en relâcher la logique. La dernière répétition est inhabituelle en français, mais elle est gardée pour refléter le jeu verbal grec et signalée par une note.
