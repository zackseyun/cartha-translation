  verdict: revise
  source_fidelity: Le texte conserve correctement la structure conditionnelle ouverte, « n’a pas épargné », le péché des anges, le Tartare et la garde en attente du jugement. Toutefois, « à des chaînes » est syntaxiquement et sémantiquement moins juste ici ; « aux chaînes » rend mieux la remise en détention exprimée par παρέδωκεν avec le datif σειραῖς. « Où ils sont gardés » attribue en outre une valeur locative indue aux chaînes et obscurcit le rattachement de τηρουμένους aux anges.
  naturalness: 'La révision est plus idiomatique et plus nette en français moderne : « les a livrés aux chaînes de l’obscurité, pour être gardés en vue du jugement ». Elle évite l’antécédent ambigu de « où » tout en gardant la phrase suspendue, comme le grec.'
  terminology: « Tartare » est le terme précis à conserver pour ταρταρώσας. « Chaînes de l’obscurité » rend naturellement σειραῖς ζόφου sans réduire ζόφος à une simple obscurité ordinaire. « Jugement » préserve κρίσις sans anticiper une condamnation.
