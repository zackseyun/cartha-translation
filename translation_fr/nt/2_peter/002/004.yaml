source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: fr
  text: Car si Dieu n’a pas épargné les anges qui avaient péché, mais les a précipités dans le Tartare[a] et les a livrés aux chaînes de l’obscurité, pour être gardés en vue du jugement[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les a jetés en enfer ». Le verbe grec signifie précisément reléguer dans le Tartare ; le texte principal conserve donc ce terme plus exact.'
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « des fosses d’obscurité » au lieu de « des chaînes d’obscurité ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: n’a pas épargné
  rationale: Équivalent français naturel de φείδομαι dans un contexte de châtiment; il conserve l’idée que Dieu n’a pas retenu la sanction.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: les anges qui avaient péché
  rationale: La relative rend naturellement le participe aoriste et situe leur péché avant l’action principale, sans préciser davantage la nature de leur faute.
- source_word: ταρταρώσας
  choice: les a précipités dans le Tartare
  rationale: Le verbe rare ταρταρόω renvoie spécifiquement au Tartare. Le conserver évite de le réduire au terme théologique plus général « enfer ».
- source_word: σειραῖς ζόφου
  choice: à des chaînes d’obscurité
  rationale: « Chaînes » rend σειραί, tandis qu’« obscurité » exprime la noirceur oppressante de ζόφος dans un français naturel et digne.
- source_word: παρέδωκεν
  choice: livrés
  rationale: Dans ce contexte judiciaire, παραδίδωμι évoque la remise en détention ou sous garde.
- source_word: εἰς κρίσιν
  choice: en vue du jugement
  rationale: Cette formulation exprime la finalité ou l’échéance de la garde sans transformer κρίσις en condamnation déjà prononcée.
- source_word: τηρουμένους
  choice: où ils sont gardés
  rationale: Le présent passif indique leur maintien continu sous garde; la formulation française rattache clairement le participe aux anges sans supprimer l’image condensée du grec.
theological_decisions:
- issue: Rendre ταρταρώσας sans importer dans le texte une conception ultérieure et plus générale de l’enfer
  choice: précipités dans le Tartare
  alternative: jetés en enfer
  rationale: Le grec emploie un verbe propre au Tartare. Le terme précis préserve l’imagerie particulière du texte et évite une harmonisation doctrinale.
- issue: Rapport syntaxique entre le Tartare, les chaînes d’obscurité et la garde jusqu’au jugement
  choice: livrés à des chaînes d’obscurité, où ils sont gardés en vue du jugement
  alternative: précipités dans le Tartare, enchaînés dans l’obscurité jusqu’au jugement
  rationale: Le choix maintient les divers éléments de la formulation grecque sans décider si les chaînes sont strictement instrumentales, locatives ou figurées.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure ouverte, comme dans le grec, puisqu’elle introduit une proposition conditionnelle poursuivie dans les versets suivants. « Tartare » est conservé pour respecter la précision lexicale de la source.
