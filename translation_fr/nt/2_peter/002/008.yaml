source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: fr
  text: car, par ce qu’il voyait et entendait[a], ce juste, qui vivait au milieu d’eux, tourmentait jour après jour son âme juste par leurs actes contraires à la loi[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’ordre grec place littéralement « par la vue et l’ouïe » au début de la proposition ; le lien précis entre ce qu’il percevait et les actes contraires à la loi peut aussi se rendre : « il se tourmentait dans son âme juste par les actes contraires à la loi qu’il voyait et entendait ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « en raison de leurs actes contraires à la loi » ; le datif grec peut exprimer le moyen ou la cause.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: par ce qu’il voyait et entendait
  rationale: Les deux datifs désignent la perception visuelle et auditive; cette formulation naturelle conserve leur valeur instrumentale ou causale.
- source_word: ὁ δίκαιος
  choice: ce juste
  rationale: L’adjectif substantivé renvoie à Lot, déjà nommé dans le verset précédent. « Ce juste » garde la reprise anaphorique et la dignité du registre biblique.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: qui vivait au milieu d’eux
  rationale: Le participe indique une résidence durable parmi ces gens. La relative est plus naturelle en français qu’un participe présent tout en conservant l’aspect circonstanciel.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: jour après jour
  rationale: L’expression idiomatique marque une répétition continue et cumulative.
- source_word: ψυχὴν δικαίαν
  choice: son âme juste
  rationale: Cette traduction directe préserve la répétition de « juste » et désigne ici la vie intérieure de Lot sans imposer une anthropologie technique.
- source_word: ἀνόμοις ἔργοις
  choice: à cause de leurs actes contraires à la loi
  rationale: Le datif peut exprimer le moyen ou la cause. Cette formulation conserve la portée morale et juridique de ἄνομος, tandis que « leurs » explicite les auteurs d’après le contexte.
- source_word: ἐβασάνιζεν
  choice: tourmentait
  rationale: L’imparfait grec décrit une action prolongée; le verbe actif, plus fort qu’une simple affliction, est conservé.
theological_decisions:
- issue: Sens de ψυχή dans l’anthropologie du verset
  choice: « âme » au sens non spéculatif de vie intérieure ou de personne
  alternative: « être intérieur » ou « lui-même »
  rationale: Le texte décrit l’angoisse morale intérieure de Lot, sans définir techniquement le rapport entre le corps et l’âme.
- issue: Valeur de l’actif ἐβασάνιζεν
  choice: « tourmentait son âme »
  alternative: « son âme était tourmentée » ou « il se tourmentait intérieurement »
  rationale: La traduction retient la voix active inhabituelle du grec et évite de résoudre silencieusement sa tension expressive.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit autant que possible l’ordre grec sans devenir artificielle. La répétition de « juste » et la voix active de « tourmentait » sont volontairement préservées.
