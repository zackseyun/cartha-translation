  source_fidelity: 'Le texte rend correctement les éléments essentiels : les perceptions visuelle et auditive, le juste (Lot), sa résidence parmi eux, la répétition quotidienne, l’âme juste et la force durative de l’imparfait actif « tourmentait ». Toutefois, « à cause de » interprète le datif ἀνόμοις ἔργοις comme une cause de façon plus arrêtée que nécessaire. « Par » préserve plus directement la valeur instrumentale possible et la tension syntaxique du grec.'
