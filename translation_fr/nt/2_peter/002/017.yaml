id: 2PE.2.17
reference: 2 Peter 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: fr
  text: Ces gens-là sont des sources sans eau et des brumes poussées par la tempête[a] ; l’obscurité des ténèbres leur est réservée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nuages poussés par la tempête ». Le mot grec désigne plus précisément des brumes ou du brouillard, mais il est parfois rendu plus largement par « nuages ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la noirceur des ténèbres a été gardée pour eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: des sources sans eau
  rationale: πηγή désigne normalement une source ou une fontaine, et ἄνυδρος signifie « sans eau ». Cette formulation naturelle conserve l’ironie d’une source qui ne fournit pas ce qu’elle promet.
- source_word: ὁμίχλαι
  choice: des brumes
  rationale: ὁμίχλη désigne la brume ou le brouillard. « Brumes » restitue plus précisément le grec que le terme plus général « nuages ».
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: poussées par la tempête
  rationale: λαῖλαψ désigne une violente tempête de vent, et ἐλαύνω l’action de pousser ou d’emporter. La tournure garde la force passive de l’expression grecque.
- source_word: οἷς
  choice: leur
  rationale: Le pronom renvoie aux personnes introduites par Οὗτοι, et non aux images féminines intermédiaires. « Leur » exprime clairement ce référent personnel en français.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: l’obscurité des ténèbres
  rationale: ζόφος évoque une obscurité profonde et sinistre, tandis que σκότος signifie « ténèbres ». La formulation préserve les deux termes et leur effet intensif sans les fondre en un simple superlatif.
- source_word: τετήρηται
  choice: est réservée
  rationale: Le parfait passif de τηρέω indique que cette obscurité a été mise en réserve et le demeure. Le présent passif français exprime naturellement cet état résultant dans ce contexte de jugement.
theological_decisions:
- issue: Nature de la dernière proposition comme langage de jugement
  choice: Conserver une formulation passive sans nommer l’agent du jugement.
  alternative: Ajouter explicitement « par Dieu ».
  rationale: Le grec implique un jugement divin, mais n’en nomme pas l’agent. La traduction n’ajoute donc pas une précision doctrinale absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Ces gens-là » rend le démonstratif avec sa portée polémique sans lourdeur. Les métaphores restent concrètes, et la dernière proposition conserve la solennité ainsi que le passif du grec.
