  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: fr
  text: En effet, ils profèrent des paroles grandiloquentes et vides[a], et séduisent, au moyen des désirs de la chair[b] et de conduites débauchées[c], ceux qui échappent à peine[d] aux gens qui vivent dans l’égarement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des paroles prétentieuses et vides » ; littéralement : « des paroles démesurées de vanité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des désirs charnels ». Le mot grec traduit par « chair » est employé ici dans un contexte moral.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « des débauches » ou « des inconduites sensuelles ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « ceux qui viennent tout juste d’échapper ». Certains manuscrits portent : « ceux qui ont réellement échappé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: paroles grandiloquentes mais vides
  rationale: ὑπέρογκα évoque ce qui est excessif, pompeux ou prétentieux; puisque le mot dépend de « parler », « paroles » est explicité. ματαιότητος en caractérise le vide et l’inanité. La tournure française rend naturellement le contraste implicite entre l’emphase et l’absence de contenu.
- source_word: φθεγγόμενοι
  choice: par leurs paroles
  rationale: Le participe décrit le moyen associé à la séduction. La nominalisation évite la tournure plus lourde « en prononçant des paroles » tout en conservant le lien syntaxique.
- source_word: δελεάζουσιν
  choice: ils séduisent
  rationale: Le verbe désigne l’action d’attirer par un appât. « Séduisent » exprime ici l’attrait trompeur et moral sans ajouter explicitement l’image d’un piège.
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: au moyen des désirs de la chair
  rationale: ἐν est compris comme indiquant le moyen. « De la chair » conserve la métaphore grecque sans l’interpréter comme une catégorie doctrinale telle que « nature pécheresse ».
- source_word: ἀσελγείαις
  choice: de la débauche
  rationale: Le terme désigne une conduite sensuelle sans retenue. « Débauche » est clair, actuel et suffisamment fort; le singulier abstrait rend naturellement le pluriel grec.
- source_word: ὀλίγως
  choice: à peine
  rationale: L’adverbe peut exprimer une faible mesure et présente ici l’évasion comme précaire. Une note conserve l’autre compréhension temporelle possible, « depuis peu ».
- source_word: ἀποφεύγοντας
  choice: ceux qui échappent
  rationale: Le participe présent décrit des personnes en train d’échapper; la traduction n’en fait pas une délivrance déjà pleinement accomplie.
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: aux gens qui vivent dans l’égarement
  rationale: ἀναστρεφομένους concerne la manière habituelle de vivre, tandis que πλάνη désigne l’erreur ou l’égarement. La formulation française garde les personnes comme complément de l’évasion.
theological_decisions:
- issue: Sens moral de σάρξ
  choice: désirs de la chair
  alternative: désirs charnels; désirs de la nature pécheresse
  rationale: « Chair » préserve la métaphore et sa portée théologique sans réduire le terme au corps ni importer l’interprétation plus systématique de « nature pécheresse ».
- issue: État de ceux qui sont séduits
  choice: ceux qui échappent à peine
  alternative: ceux qui viennent tout juste d’échapper; ceux qui ont réellement échappé
  rationale: Le texte retenu comporte un participe présent et l’adverbe ὀλίγως. La traduction maintient donc une évasion en cours et précaire, sans décider si elle constitue une délivrance spirituelle définitive. La note signale à la fois la nuance temporelle possible et la variante manuscrite importante.
- issue: Rapport entre ἐπιθυμίαις σαρκὸς et ἀσελγείαις
  choice: les désirs de la chair et la débauche
  alternative: les désirs de la chair, manifestés dans des actes de débauche
  rationale: La coordination française laisse ouverte la relation précise entre les deux datifs; la note indique la lecture appositionnelle ou explicative sans l’imposer dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Grandiloquentes mais vides » rend l’emphase creuse sans archaïsme; « vivent dans l’égarement » exprime une conduite habituelle. Les notes préservent l’ambiguïté de ὀλίγως, la variante textuelle et la relation syntaxique entre les désirs et la débauche.
