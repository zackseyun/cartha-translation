id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: fr
  text: surtout ceux qui suivent la chair, animés d’un désir de souillure, et qui méprisent l’autorité[a]. Audacieux, présomptueux, ils ne tremblent pas lorsqu’ils injurient les êtres glorieux[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la seigneurie » ou « la domination ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression désigne probablement des êtres célestes glorieux, peut-être des anges ; littéralement : « les gloires ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: surtout
  rationale: Marque l’accent particulier porté sur ce groupe dans la continuité du verset précédent.
- source_word: ὀπίσω σαρκὸς
  choice: qui suivent la chair
  rationale: Conserve l’image et le terme théologiquement chargé « chair », tout en donnant en français une tournure naturelle.
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: poussés par le désir de se souiller
  rationale: Exprime le désir moralement mauvais et la souillure sans recourir à une formulation française trop abstraite.
- source_word: κυριότητος
  choice: toute autorité
  rationale: « Autorité » garde le référent ouvert; « toute » rend naturellement en français le nom sans article employé dans un sens général, sans identifier cette autorité à une personne précise.
- source_word: καταφρονοῦντας
  choice: qui méprisent
  rationale: Rend la forte idée de dédain actif.
- source_word: Τολμηταί
  choice: Audacieux
  rationale: Conserve la caractérisation brève et péjorative de personnes hardies jusqu’à la témérité.
- source_word: αὐθάδεις
  choice: obstinés
  rationale: Met en relief leur volonté propre et leur refus arrogant de toute contrainte; « présomptueux » recouperait trop fortement « audacieux ».
- source_word: δόξας
  choice: les êtres glorieux
  rationale: Signale le probable référent personnel et céleste tout en évitant de préciser qu’il s’agit d’anges.
- source_word: οὐ τρέμουσιν
  choice: ils ne tremblent pas
  rationale: Préserve l’image vive de l’absence de crainte ou de révérence.
- source_word: βλασφημοῦντες
  choice: lorsqu’ils injurient
  rationale: Le verbe français « injurier » convient à des êtres créés et rend ici la parole outrageante sans suggérer que Dieu seul en est nécessairement l’objet; la subordination garde la valeur concomitante du participe.
theological_decisions:
- issue: Référent de κυριότητος
  choice: l’autorité au sens général, sans référent précisé
  alternative: la seigneurie du Christ ou une domination céleste
  rationale: Le terme peut désigner autorité, domination ou seigneurie. Le contexte ne permet pas d’en fixer sûrement le détenteur; le texte principal maintient donc cette ouverture.
- issue: Référent de δόξας
  choice: des êtres glorieux non identifiés
  alternative: des anges, des majestés célestes ou des dignités
  rationale: Le verset suivant rend probable un référent céleste, mais δόξας ne nomme pas explicitement les anges. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme accusateur est maintenu par la phrase nominale « Audacieux, obstinés ». La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
