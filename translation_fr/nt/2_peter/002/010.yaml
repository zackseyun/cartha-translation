  naturalness: La phrase révisée demeure naturelle en français international moderne et conserve l’enchaînement syntaxique vers le verset suivant. « Présomptueux » rend plus exactement αὐθάδεις qu’« obstinés », en exprimant une assurance arrogante et centrée sur soi.
  terminology: « Chair », « souillure », « autorité » et « êtres glorieux » maintiennent les termes et les ambiguïtés importantes. « Injurer » convient ici à βλασφημοῦντες sans restreindre abusivement l’injure à Dieu.
