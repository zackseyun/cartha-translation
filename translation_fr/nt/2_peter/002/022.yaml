  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: fr
  text: 'Ce que dit le proverbe vrai leur est arrivé[a] : « Un chien retourne à ce qu’il a vomi »[b], et : « Une truie, après s’être lavée, retourne se vautrer dans la boue. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « La parole du proverbe vrai leur est arrivée. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Un chien, étant retourné à son propre vomi… et une truie qui s’est lavée, pour se vautrer dans la boue. » La première parole fait écho à Proverbes 26.11.'
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: Il leur est arrivé
  rationale: Le parfait grec décrit une réalité survenue dont l’effet demeure. Cette formulation française conserve le datif « leur » et rend naturellement cette portée résultative.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: ce que dit le proverbe véridique
  rationale: La construction grecque est elliptique. Cette formulation explicite seulement le contenu sous-entendu du proverbe, sans en développer l’interprétation.
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Un chien retourne à ce qu’il a vomi
  rationale: L’article indéfini rend la portée générale du style proverbial. « Ce qu’il a vomi » est plus naturel en français moderne que « son propre vomi » tout en conservant l’idée de ἴδιον.
- source_word: Ὗς λουσαμένη
  choice: Une truie, après s’être lavée
  rationale: « Truie » conserve le féminin explicite du grec. La tournure temporelle rend le participe aoriste et la forme moyenne de λουσαμένη sans lourdeur.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: retourne se vautrer dans la boue
  rationale: « Se vautrer » restitue l’image de κυλισμός, et « boue » rend βόρβορος dans un français actuel et expressif. Le verbe « retourne » est suppléé d’après le parallélisme proverbial.
theological_decisions:
- issue: Portée du proverbe appliqué aux personnes évoquées
  choice: Le contenu du proverbe s’est vérifié dans leur cas, sans explication doctrinale ajoutée.
  alternative: Le proverbe lui-même leur est arrivé.
  rationale: Le grec est elliptique. La traduction idiomatique garde l’image forte de la rechute tout en évitant de préciser une doctrine qui n’est pas explicitée dans ce verset.
- issue: Verbe sous-entendu dans la seconde maxime
  choice: Répéter « retourne » pour former une phrase française complète.
  alternative: 'Conserver l’ellipse : « et une truie lavée, au vautrement dans la boue ».'
  rationale: Le grec coordonne une seconde image elliptique. La répétition du verbe rend le parallélisme intelligible sans modifier le sens.
translation_notes:
  register: Français international moderne, naturel et digne. Les images volontairement crues du texte grec sont conservées sans vocabulaire archaïque. La syntaxe proverbiale est légèrement explicitée afin d’être immédiatement compréhensible.
