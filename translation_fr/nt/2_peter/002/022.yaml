  source_fidelity: Le sens général et les deux images proverbiales sont fidèlement rendus. « s’être lavée » respecte bien la forme moyenne de λουσαμένη, et l’ajout de « retourne » dans la seconde image explicite avec prudence l’ellipse grecque. La formulation « ce que dit le proverbe vrai » rend naturellement la construction elliptique τὸ τῆς ἀληθοῦς παροιμίας.
