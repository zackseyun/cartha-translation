id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: fr
  text: 'Mais il reçut une réprimande pour sa propre transgression : une bête de somme muette[a], parlant d’une voix humaine[b], mit un frein à la folie du prophète.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une bête de somme »; il s’agit de l’ânesse de Balaam (Nb 22.28–30).
    reason: cross_reference
  - marker: b
    text: Ou « avec une voix d’être humain ». Le grec oppose vraisemblablement la voix humaine à l’animal normalement privé de parole.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: fut repris
  rationale: La tournure française rend naturellement l’idée de réprimande ou de blâme exprimée par ἔλεγξις, tout en conservant la construction selon laquelle Balaam subit cette réprimande.
- source_word: ἰδίας παρανομίας
  choice: sa propre transgression
  rationale: « Transgression » exprime une conduite qui enfreint ce qui est juste ou permis, tandis que « propre » maintient l’insistance de ἰδίας sur la responsabilité personnelle.
- source_word: ὑποζύγιον ἄφωνον
  choice: une bête de somme muette
  rationale: « Bête de somme » conserve le terme générique désignant un animal qui porte une charge; « muette » fait ressortir le contraste ironique avec la parole qui suit.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: d’une voix humaine
  rationale: La formule indique la manière de parler et oppose la voix humaine à l’animal normalement privé de parole; elle n’implique pas spécifiquement une voix masculine.
- source_word: φθεγξάμενον
  choice: qui se mit à parler
  rationale: Le participe désigne ici une émission de paroles intelligibles. Cette formulation est naturelle en français et souligne l’événement extraordinaire.
- source_word: ἐκώλυσεν
  choice: arrêta
  rationale: κωλύω signifie empêcher, entraver ou retenir. Dans ce récit, « arrêta » exprime clairement que l’animal mit un frein à la conduite insensée du prophète.
- source_word: παραφρονίαν
  choice: folie
  rationale: « Folie » conserve la force du terme grec, qui dénote une conduite irrationnelle plutôt qu’une simple erreur de jugement.
theological_decisions:
- issue: Faut-il identifier explicitement ὑποζύγιον comme l’ânesse de Balaam ?
  choice: Conserver « bête de somme » dans le texte principal.
  alternative: « ânesse »
  rationale: Nombres 22 identifie clairement l’animal comme l’ânesse de Balaam, mais 2 Pierre emploie ici un terme générique. Le texte principal respecte ce choix lexical, et la note donne l’identification narrative.
- issue: Sens de ἀνθρώπου dans l’expression ἐν ἀνθρώπου φωνῇ
  choice: « humaine »
  alternative: « d’homme »
  rationale: Le contraste porte sur la parole humaine par opposition à l’animal muet, non sur le sexe de la personne dont la voix serait imitée.
- issue: Force de παραφρονία
  choice: « folie »
  alternative: « égarement » ou « déraison »
  rationale: Le mot grec caractérise fortement l’irrationalité du prophète. « Folie » préserve cette vigueur sans ajouter de diagnostic médical.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le terme générique pour l’animal, la responsabilité personnelle de Balaam et la forte qualification de sa conduite comme « folie ».
