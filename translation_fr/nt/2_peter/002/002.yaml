id: 2PE.2.2
reference: 2 Peter 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: fr
  text: Beaucoup les suivront dans leurs dérèglements[a] et, à cause d’eux, la voie de la vérité[b] sera calomniée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs débauches », « dans leurs conduites licencieuses » ou « dans leurs comportements éhontés ». Le terme grec désigne une conduite sans retenue et sans pudeur, souvent avec des connotations sexuelles.
    reason: lexical_alternative
  - marker: b
    text: Ou « la voie de vérité ». Cette expression désigne probablement la foi chrétienne et la manière de vivre qui lui correspond.
    reason: lexical_alternative
  - marker: c
    text: Ou « sera insultée », « sera blasphémée » ou « fera l’objet de paroles injurieuses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend naturellement l’adjectif quantitatif substantivé, sans exagérer sa portée.
- source_word: ἐξακολουθήσουσιν
  choice: les suivront
  rationale: Exprime le fait d’emboîter le pas aux faux enseignants mentionnés dans le contexte, tout en conservant la valeur prédictive du futur.
- source_word: αὐτῶν ταῖς ἀσελγείαις
  choice: dans leurs dérèglements
  rationale: Le pluriel « dérèglements » conserve celui du grec et désigne des conduites éhontées et sans retenue, souvent à caractère sexuel, sans limiter le terme au seul domaine sexuel.
- source_word: δι’ οὓς
  choice: à cause d’eux
  rationale: διά suivi de l’accusatif exprime ici la cause; le pronom renvoie naturellement aux personnes dont la conduite provoque cette réaction.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: la voie de la vérité
  rationale: Cette formulation préserve la métaphore et la construction génitive grecque, tout en restant idiomatique en français.
- source_word: βλασφημηθήσεται
  choice: sera calomniée
  rationale: Le verbe peut désigner des paroles injurieuses ou diffamatoires. « Calomniée » convient à la voie de la vérité comme objet et évite la tournure française moins naturelle « une voie sera blasphémée ».
theological_decisions:
- issue: Référent et portée de « la voie de la vérité »
  choice: Conserver « la voie de la vérité » comme désignation de la foi et de la manière de vivre chrétiennes conformes à la vérité.
  alternative: « la voie de vérité » ou « la vraie voie »
  rationale: La formulation retenue maintient l’image grecque et son ampleur, sans réduire l’expression à un système doctrinal ni résoudre entièrement la relation entre « voie » et « vérité ».
- issue: Portée morale de ἀσέλγεια
  choice: « dérèglements », terme large couvrant des conduites éhontées et sans retenue, souvent sexuelles
  alternative: « débauches », « conduites licencieuses » ou « comportements éhontés »
  rationale: Le mot grec comporte souvent des connotations sexuelles, mais sa portée peut être plus générale. Le choix retenu conserve cette latitude.
- issue: Force de βλασφημέω appliqué à la voie de la vérité
  choice: « sera calomniée »
  alternative: « sera blasphémée », « sera insultée » ou « fera l’objet de paroles injurieuses »
  rationale: Le contexte concerne le discrédit verbal jeté sur la foi et la conduite chrétiennes à cause de leurs prétendus représentants. « Calomniée » rend cette atteinte grave sans imposer au verbe son seul sens religieux français.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle. « Dérèglements » garde l’étendue morale du terme source, tandis que les notes signalent ses connotations possibles; « calomniée » rend idiomatiquement en français la violence verbale de βλασφημέω.
