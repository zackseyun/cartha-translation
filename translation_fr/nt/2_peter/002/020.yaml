id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: fr
  text: En effet, si, après avoir échappé aux souillures du monde grâce à la connaissance du Seigneur et Sauveur Jésus le Messie, ils se retrouvent de nouveau empêtrés dans ces souillures et sont vaincus, leur condition finale est devenue pire que la première.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: après avoir échappé
  rationale: Le participe aoriste présente l’action comme antérieure à l’enchevêtrement qui suit; cette tournure exprime naturellement ce rapport temporel.
- source_word: μιάσματα
  choice: souillures
  rationale: Le terme désigne ce qui pollue ou rend impur, ici dans un sens moral; «souillures» conserve cette image sans la réduire à une pollution matérielle.
- source_word: ἐν ἐπιγνώσει
  choice: grâce à la connaissance
  rationale: ἐν indique ici vraisemblablement le moyen ou la sphère de leur délivrance. «Connaissance» n’impose ni le sens de connaissance salvatrice ni celui de simple connaissance extérieure.
- source_word: κυρίου καὶ σωτῆρος
  choice: du Seigneur et Sauveur
  rationale: Les deux substantifs coordonnés sont rendus comme des titres appliqués à Jésus. L’absence d’article devant «Sauveur» donne en français une paire titulaire fluide.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici une valeur titulaire audible; «le Messie» en transmet le sens en français naturel.
- source_word: τούτοις
  choice: s’y
  rationale: Le pronom reprend les souillures du monde. «S’y» maintient cette anaphore sans répétition lourde.
- source_word: πάλιν ἐμπλακέντες
  choice: s’y laissent de nouveau prendre
  rationale: La tournure restitue l’image d’un nouvel enchevêtrement ou piège et s’intègre naturellement avec le complément pronominal.
- source_word: ἡττῶνται
  choice: sont vaincus
  rationale: Le verbe exprime le fait d’être défait ou dominé; «sont vaincus» en conserve directement la force passive.
- source_word: γέγονεν αὐτοῖς τὰ ἔσχατα
  choice: leur condition finale est devenue
  rationale: Le parfait décrit un état désormais établi. «Condition finale» rend idiomatiquement τὰ ἔσχατα sans lui imposer une référence eschatologique précise.
- source_word: χείρονα τῶν πρώτων
  choice: pire que la première
  rationale: La comparaison oppose la condition finale à la condition initiale; le féminin «première» reprend clairement «condition».
theological_decisions:
- issue: Nature de la «connaissance» et rapport avec l’apostasie
  choice: Conserver le terme non qualifié «connaissance».
  alternative: «pleine connaissance», «connaissance salvatrice» ou «simple connaissance extérieure»
  rationale: ἐπίγνωσις peut suggérer une connaissance réelle ou approfondie, mais le mot seul ne tranche pas la question de la régénération des personnes décrites. La formulation préserve donc la tension théologique du texte.
- issue: Valeur de Χριστός
  choice: «le Messie»
  alternative: «Christ»
  rationale: Dans cette suite de titres, la valeur messianique demeure perceptible; la traduction explicite le titre sans ajouter d’interprétation confessionnelle.
- issue: Portée de la condition finale
  choice: «condition finale» sans préciser davantage sa nature
  alternative: «fin éternelle» ou «état après la perte du salut»
  rationale: Le grec compare l’état ultérieur à l’état antérieur, mais ne définit pas ici à lui seul toutes les conséquences sotériologiques ou eschatologiques.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle et la progression du grec tout en évitant un calque pesant. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
