  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: fr
  text: et s’il n’a pas épargné le monde ancien, mais a préservé Noé, le huitième[a], héraut de la justice[b], lorsqu’il a fait venir le déluge sur un monde d’impies,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Noé, l’un des huit » ou « Noé, le huitième ». L’expression grecque est condensée et peut indiquer que Noé fut préservé avec sept autres personnes.
    reason: lexical_alternative
  - marker: b
    text: Ou « prédicateur de la justice » ou « héraut de la droiture ». Le terme grec désigne un annonceur public; « droiture » souligne la dimension morale de « justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: le monde ancien
  rationale: Expression naturelle en français moderne pour le monde des temps anciens, ici celui d’avant le déluge.
- source_word: οὐκ ἐφείσατο
  choice: n’a pas épargné
  rationale: Rend directement le sens judiciaire de φείδομαι dans cette série d’exemples.
- source_word: ὄγδοον Νῶε
  choice: Noé, lui huitième
  rationale: Conserve l’ordinal inhabituel et la formulation condensée du grec sans trancher entièrement entre « le huitième » et « l’un des huit ».
- source_word: δικαιοσύνης κήρυκα
  choice: proclamateur de la justice
  rationale: « Proclamateur » exprime la fonction publique du κῆρυξ; « justice » rend naturellement δικαιοσύνη en français tout en gardant sa portée morale.
- source_word: ἐφύλαξεν
  choice: a préservé
  rationale: Dans le contexte du jugement, le verbe indique que Noé a été gardé sain et sauf.
- source_word: κατακλυσμὸν
  choice: le déluge
  rationale: Le référent biblique précis est identifiable en français; « le déluge » est l’expression courante et digne.
- source_word: κόσμῳ ἀσεβῶν
  choice: un monde d’impies
  rationale: Préserve la structure avec le génitif et décrit un monde composé ou caractérisé par des personnes impies.
- source_word: ἐπάξας
  choice: lorsqu’il a fait venir
  rationale: Rend souplement le participe aoriste et sa relation temporelle avec le verbe principal.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: En français moderne, « justice » est le correspondant usuel de δικαιοσύνη et peut désigner ici la conduite conforme à ce qui est juste; « droiture » explicite davantage la dimension morale personnelle.
- issue: Rapport de Noé au groupe de huit
  choice: lui huitième
  alternative: l’un des huit
  rationale: La formulation retenue maintient la tension de l’expression grecque condensée au lieu d’en imposer une seule explicitation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste liée à la proposition conditionnelle du contexte. « Lui huitième » est volontairement inhabituel afin de conserver la formulation grecque ambiguë, avec clarification en note.
