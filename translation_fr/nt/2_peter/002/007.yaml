  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : Dieu délivre Lot, qualifié de juste, alors qu’il subissait continuellement les effets de la conduite marquée par l’ἀσέλγεια des ἄθεσμοι. « Accablait » exprime correctement la pression continue de καταπονούμενον, et « conduite débauchée » rend de façon recevable ἐν ἀσελγείᾳ. Toutefois, « ces gens » introduit une valeur démonstrative absente du grec ; le substantif pluriel τῶν ἀθέσμων se rend plus exactement par « des gens sans loi ».'
  naturalness: La phrase reste fluide et digne dans un français international moderne. L’apposition « Lot, un homme juste » est naturelle et conserve explicitement l’évaluation de δίκαιον. La relative avec « que ... accablait » est idiomatique. Le tiret final est approprié, puisque la phrase se poursuit au verset suivant.
  terminology: « Délivré », « homme juste », « conduite » et « gens sans loi » sont cohérents avec le registre biblique moderne et les nuances du grec. « Débauchée » est une option acceptable pour ἀσέλγεια, qui évoque une conduite effrontément immorale, sans exiger une limitation au domaine sexuel.
