id: 2PE.2.7
reference: 2 Peter 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: fr
  text: et il a délivré Lot, un homme juste, que la conduite débauchée des gens sans loi accablait[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tourmentait » ou « épuisait » moralement.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: un homme juste
  rationale: Rend explicitement l’évaluation morale appliquée à Lot, dans un français naturel, sans l’atténuer.
- source_word: Λὼτ
  choice: Lot
  rationale: Forme française traditionnelle du nom propre.
- source_word: καταπονούμενον
  choice: accablait
  rationale: Le participe présent passif exprime une détresse continue et intense causée par la conduite environnante; la tournure française active est idiomatique tout en conservant ce rapport causal.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: que la conduite ... accablait
  rationale: La préposition désigne la cause de la détresse de Lot, et ἀναστροφή désigne ici la conduite ou la manière de vivre.
- source_word: τῶν ἀθέσμων
  choice: de ces gens sans loi
  rationale: Préserve la nuance morale et normative de personnes qui méprisent ce qui est établi comme juste, tout en restant compréhensible en français courant.
- source_word: ἐν ἀσελγείᾳ
  choice: débauchée
  rationale: Qualifie naturellement « conduite » et exprime l’excès moral éhonté porté par ἀσέλγεια, sans réduire nécessairement le terme au seul domaine sexuel.
- source_word: ἐρρύσατο
  choice: il a délivré
  rationale: Exprime l’action de tirer quelqu’un du danger; « délivré » convient au registre biblique moderne sans être obscur.
- source_word: καὶ
  choice: et
  rationale: Conserve le lien de coordination avec le contexte précédent.
theological_decisions:
- issue: Qualification morale de Lot par rapport au récit de la Genèse
  choice: Conserver explicitement « Lot, un homme juste »
  alternative: Atténuer ou omettre l’évaluation morale en raison des actes de Lot rapportés dans la Genèse
  rationale: Le grec qualifie sans ambiguïté Lot de δίκαιος; la traduction doit préserver cette appréciation textuelle sans résoudre la tension avec le récit de la Genèse.
translation_notes:
  register: Français international moderne, digne et accessible. La structure a été légèrement réorganisée pour éviter une formulation lourde tout en maintenant la causalité du grec. Le tiret final conserve la continuité syntaxique avec le verset suivant.
