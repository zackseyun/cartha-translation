id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: fr
  text: et si, après avoir réduit en cendres les villes de Sodome et de Gomorrhe, il les a condamnées à la destruction[a], faisant d’elles un exemple pour ceux qui seraient impies[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les a condamnées à la destruction en les réduisant en cendres ».'
    reason: alternative_syntax
  - marker: b
    text: 'Ou : « faisant d’elles un exemple pour les impies à venir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: après avoir réduit en cendres
  rationale: Le participe aoriste de τεφρόω exprime le fait de réduire en cendres. « Après avoir » rend naturellement l’antériorité circonstancielle sans imposer exclusivement une nuance de moyen.
- source_word: καταστροφῇ
  choice: à la destruction
  rationale: 'Le datif complète naturellement κατέκρινεν et indique l’issue de la condamnation : elles ont été condamnées à la destruction.'
- source_word: κατέκρινεν
  choice: il les a condamnées
  rationale: Le verbe possède ici un sens judiciaire, que « condamner » rend directement.
- source_word: ὑπόδειγμα
  choice: un exemple
  rationale: « Exemple » conserve la portée générale du terme grec; le contexte de jugement lui donne implicitement une valeur d’avertissement.
- source_word: μελλόντων ἀσεβέσιν
  choice: pour ceux qui allaient vivre dans l’impiété
  rationale: Cette formulation exprime la perspective future de μελλόντων et la qualité morale et religieuse de ἀσεβέσιν, tout en restant naturelle en français.
- source_word: τεθεικώς
  choice: faisant d’elles
  rationale: Le participe parfait de τίθημι présente les villes comme établies durablement en exemple; « faisant d’elles » est idiomatique dans cette construction.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: les villes de Sodome et de Gomorrhe
  rationale: Cette formulation française naturelle conserve le pluriel grec et les noms propres traditionnels.
theological_decisions:
- issue: Sujet implicite hérité du contexte
  choice: il
  alternative: Dieu; le Seigneur
  rationale: Le grec poursuit une série de jugements divins sans répéter ici le sujet. Le pronom « il » préserve cet enchaînement sans ajouter un titre absent de la proposition.
- issue: Portée de ἀσεβέσιν
  choice: ceux qui allaient vivre dans l’impiété
  alternative: les impies; ceux qui seraient impies
  rationale: La formulation retenue communique la qualité personnelle et morale du terme et l’orientation future indiquée par μελλόντων, sans limiter l’impiété à un simple état abstrait.
- issue: Rapport circonstanciel de τεφρώσας avec κατέκρινεν
  choice: après avoir réduit en cendres
  alternative: en réduisant en cendres; après les avoir changées en cendres
  rationale: Le participe aoriste peut être compris temporellement ou comme indiquant le moyen. Le texte principal retient une relation temporelle naturelle et la note signale l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée par « et si » à la construction conditionnelle commencée dans le contexte. « Sodome » et « Gomorrhe » suivent les formes françaises usuelles; « vivre dans l’impiété » évite une tournure adjectivale peu naturelle tout en conservant la tension entre futurité et caractérisation morale.
