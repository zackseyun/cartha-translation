  source_fidelity: 'La traduction rend correctement les villes, la réduction en cendres, la condamnation à la destruction et leur fonction d’exemple. Toutefois, « vivre dans l’impiété » explicite davantage que le grec : ἀσεβέσιν désigne directement des personnes impies, sans verbe « vivre » ni substantif abstrait correspondant à « impiété ». « Ceux qui seraient impies » conserve plus exactement la caractérisation personnelle et la futurité relative de μελλόντων.'
