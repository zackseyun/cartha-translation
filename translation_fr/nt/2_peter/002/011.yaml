id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: fr
  text: alors que les anges, pourtant supérieurs en force et en puissance, ne prononcent contre eux[b] aucun jugement injurieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « blasphématoire » ou « outrageant ». L’adjectif grec peut désigner des paroles injurieuses, outrageantes ou diffamatoires.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « eux » renvoie probablement aux « êtres glorieux » du verset précédent, mais Pierre ne les identifie pas plus précisément ici.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: alors que
  rationale: Dans ce contexte, ὅπου introduit surtout un contraste avec le comportement décrit au verset précédent plutôt qu’un lieu précis. « Alors que » exprime naturellement cette valeur en français.
- source_word: ἄγγελοι
  choice: les anges
  rationale: Le contexte désigne des êtres célestes, non de simples messagers humains.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: en force et en puissance
  rationale: Les deux datifs indiquent sous quel rapport les anges sont supérieurs. Le doublet français conserve l’intensification du grec sans fusionner les deux termes.
- source_word: μείζονες ὄντες
  choice: pourtant supérieurs
  rationale: 'Le participe a ici une valeur concessive : malgré leur supériorité, les anges ne font pas ce que font les personnes évoquées auparavant.'
- source_word: οὐ φέρουσιν
  choice: ne prononcent… aucun
  rationale: Avec κρίσιν, φέρω signifie présenter ou formuler un jugement. « Prononcer un jugement » est idiomatique en français et conserve la nuance judiciaire.
- source_word: κατ’ αὐτῶν
  choice: contre eux
  rationale: Le pronom reprend vraisemblablement les êtres glorieux du verset précédent, mais le français conserve le pronom sans préciser davantage son référent.
- source_word: βλάσφημον
  choice: injurieux
  rationale: L’adjectif peut qualifier des paroles outrageantes, diffamatoires ou blasphématoires. « Injurieux » convient à un jugement formulé contre autrui sans limiter le terme à une offense dirigée contre Dieu.
- source_word: κρίσιν
  choice: jugement
  rationale: Le terme désigne ici une appréciation ou sentence de caractère judiciaire. « Jugement » en garde la portée générale.
theological_decisions:
- issue: Référent de αὐτῶν par rapport aux « êtres glorieux » du verset précédent
  choice: Le texte principal garde le simple pronom « eux ».
  alternative: Les anges déchus, des dignitaires humains ou, plus généralement, des êtres célestes glorieux.
  rationale: Le grec ne précise pas davantage l’antécédent dans ce verset. Le maintien du pronom préserve l’ambiguïté et évite d’imposer une identification doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. « Pourtant supérieurs » rend explicitement la concession du participe grec, tandis que « prononcer un jugement » évite le calque peu naturel « porter un jugement contre eux ». Les appels de note sont placés immédiatement après les expressions qu’ils expliquent.
