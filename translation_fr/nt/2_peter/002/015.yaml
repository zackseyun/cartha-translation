id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: fr
  text: Après avoir abandonné le droit chemin, ils se sont égarés en suivant le chemin de Balaam, fils de Bosor[a], qui a aimé le salaire de l’injustice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec porte « Bosor »; dans l’Ancien Testament, Balaam est habituellement appelé fils de Béor.
    reason: alternative_reading
  - marker: b
    text: 'On peut aussi comprendre : « ils se sont égarés, ayant suivi le chemin de Balaam »; le participe grec peut présenter l’action comme associée à l’égarement sans en préciser entièrement le rapport logique.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καταλιπόντες
  choice: Après avoir abandonné
  rationale: Le participe aoriste indique une action antérieure au verbe principal. « Abandonné » exprime une désertion volontaire, tandis que « après avoir » rend clairement le rapport temporel en français naturel.
- source_word: εὐθεῖαν ὁδὸν
  choice: le droit chemin
  rationale: Cette expression française courante conserve à la fois l’image concrète du chemin et sa portée morale, sans ajouter l’idée plus précise de « vérité ».
- source_word: ἐπλανήθησαν
  choice: ils se sont égarés
  rationale: Le pronominal français rend naturellement le sens passif ou intransitif du grec sans supposer un agent extérieur explicite.
- source_word: ἐξακολουθήσαντες
  choice: en suivant
  rationale: Le gérondif donne une phrase française fluide et exprime le lien étroit, probablement instrumental, entre le fait de suivre la voie de Balaam et l’égarement. Une autre analyse du participe est signalée en note.
- source_word: τῇ ὁδῷ
  choice: le chemin
  rationale: La répétition de « chemin » maintient le parallélisme avec εὐθεῖαν ὁδὸν et préserve la métaphore directrice du verset.
- source_word: τοῦ Βαλαὰμ τοῦ Βοσὸρ
  choice: de Balaam, fils de Bosor
  rationale: Le second génitif est naturellement compris comme une filiation. « Bosor » reproduit la forme du texte grec retenu, tandis que la forme vétérotestamentaire habituelle est indiquée en note.
- source_word: μισθὸν ἀδικίας
  choice: le salaire de l’injustice
  rationale: « Salaire » conserve l’idée de rétribution intéressée; « injustice » garde la portée morale large de ἀδικία et le registre biblique de l’expression.
- source_word: ἠγάπησεν
  choice: a aimé
  rationale: Le passé composé rend simplement l’aoriste et conserve sans paraphrase la force du verbe ἀγαπάω.
theological_decisions:
- issue: Métaphore morale de εὐθεῖαν ὁδὸν et τῇ ὁδῷ
  choice: Conserver le vocabulaire du chemin dans les deux occurrences.
  alternative: Interpréter par « la bonne conduite », « la voie de la vérité » ou une autre paraphrase morale.
  rationale: Le grec construit une opposition entre deux chemins. Garder cette image préserve la tension du texte sans préciser au-delà de ce qu’il dit.
- issue: Identification de Βοσόρ
  choice: Retenir « Bosor » dans le texte principal.
  alternative: Remplacer par « Béor », forme habituelle dans l’Ancien Testament.
  rationale: La priorité donnée au texte grec exige de conserver Βοσόρ. La note permet néanmoins au lecteur d’identifier la figure de Balaam sans corriger silencieusement le texte source.
- issue: Valeur syntaxique de ἐξακολουθήσαντες
  choice: Rendre dans le texte principal une nuance de moyen par « en suivant ».
  alternative: Rendre le participe de façon plus formelle et ambiguë par « ayant suivi » ou temporelle par « après avoir suivi ».
  rationale: Le rapport instrumental convient bien au contexte et produit un français naturel, mais la forme participiale grecque n’impose pas exclusivement cette analyse; la note préserve donc l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. « Le droit chemin » et la répétition de « chemin » maintiennent l’image biblique sans lourdeur archaïque. La formulation évite toute terminologie confessionnelle particulière.
