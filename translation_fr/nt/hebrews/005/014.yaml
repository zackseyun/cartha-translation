id: HEB.5.14
reference: Hebrews 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: fr
  text: Mais la nourriture solide est pour les personnes mûres, celles dont les facultés de perception[b] ont été entraînées par la pratique[a] à discerner le bien et le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’habitude » ou « par un usage habituel ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leurs sens » ; le mot désigne ici, par métaphore, les facultés qui permettent de percevoir et de juger.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: les personnes mûres
  rationale: Le génitif pluriel désigne implicitement des personnes et s’oppose aux petits enfants du verset précédent. « Personnes mûres » exprime la maturité sans suggérer une perfection morale absolue.
- source_word: στερεὰ τροφή
  choice: la nourriture solide
  rationale: Cette expression française naturelle conserve la métaphore qui oppose la nourriture solide au lait.
- source_word: διὰ τὴν ἕξιν
  choice: par la pratique
  rationale: ἕξις peut désigner l’habitude, l’exercice ou une disposition acquise. « Par la pratique » rend avec concision le moyen par lequel les facultés ont été formées, tout en laissant en note les nuances possibles.
- source_word: τὰ αἰσθητήρια
  choice: leurs facultés de perception
  rationale: Le terme désigne littéralement les organes ou facultés des sens, employés ici métaphoriquement. Cette formulation conserve l’image davantage que « discernement » tout en restant intelligible.
- source_word: γεγυμνασμένα ἐχόντων
  choice: ont exercé
  rationale: La tournure grecque décrit des personnes dont les facultés se trouvent dans un état acquis par l’entraînement. « Ont exercé » communique naturellement cet entraînement et son résultat.
- source_word: πρὸς διάκρισιν
  choice: à discerner
  rationale: 'Avec πρός, le nom διάκρισις indique ici la fonction ou le but de l’exercice : faire la distinction.'
- source_word: καλοῦ τε καὶ κακοῦ
  choice: le bien et le mal
  rationale: La formulation française consacrée rend clairement les deux pôles de la distinction morale sans ajout interprétatif.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque le contraste avec le lait destiné aux personnes inexpérimentées évoqué juste avant.
theological_decisions:
- issue: Sens de τελείων dans le contexte de la croissance spirituelle
  choice: les personnes mûres
  alternative: les parfaits
  rationale: Le contexte oppose l’immaturité à des facultés développées par l’exercice. « Mûres » préserve cette idée sans imposer la notion d’une perfection morale ou spirituelle absolue.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le contraste initial et la métaphore alimentaire. « Personnes mûres » évite l’ambiguïté potentiellement perfectionniste de « parfaits », tandis que « facultés de perception » préserve l’arrière-plan sensoriel du grec.
