  text: καίπερ ὢν υἱός, ἔμαθεν ἀφ’ ὧν ἔπαθεν τὴν ὑπακοήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/008.yaml
  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: fr
  text: Bien qu’étant Fils[a], il a appris l’obéissance à partir de ce qu’il a souffert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Bien qu’il soit le Fils. » Le grec porte simplement « Fils », sans article.'
    reason: alternative_reading
  - marker: b
    text: « Il a appris l’obéissance » évoque un apprentissage vécu dans la souffrance, non la correction d’une désobéissance antérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Bien que
  rationale: 'Cette locution introduit naturellement en français la concession : malgré sa condition de Fils, il a appris l’obéissance dans la souffrance.'
- source_word: ὢν
  choice: il soit
  rationale: Le participe présent de εἰμί est intégré à la proposition concessive française « bien que » avec le subjonctif présent.
- source_word: υἱός
  choice: Fils
  rationale: Le nom grec est sans article et employé comme attribut. En français, « être Fils » peut rester sans article et préserver cette forme, tandis que la majuscule indique la référence christologique.
- source_word: ἔμαθεν
  choice: il a appris
  rationale: L’aoriste de μανθάνω affirme un apprentissage réel ; le passé composé est naturel en français moderne et ne dissipe pas la tension du texte.
- source_word: ἀφ’ ὧν
  choice: par ce que
  rationale: Dans ce contexte, ἀπό avec le relatif désigne ce dont la souffrance a été le moyen ou l’expérience formatrice. « Par ce que » est idiomatique et conserve ce rapport sans surinterprétation.
- source_word: ἔπαθεν
  choice: il a souffert
  rationale: Le verbe πάσχω désigne les souffrances effectivement endurées ; la formulation simple garde la force du grec.
- source_word: τὴν ὑπακοήν
  choice: l’obéissance
  rationale: Le français emploie naturellement l’article défini avec ce nom abstrait. « Obéissance » exprime ici la soumission effective à la volonté de Dieu.
theological_decisions:
- issue: Rendre la condition filiale du Christ en rapport avec son apprentissage
  choice: Bien qu’il soit Fils
  alternative: Bien qu’il soit le Fils
  rationale: Le grec dit simplement « Fils », sans article. La formulation retenue préserve cette particularité ainsi que le contraste entre sa condition de Fils et son apprentissage, sans amoindrir ni expliquer l’une ou l’autre affirmation.
- issue: Déterminer si « il a appris l’obéissance » suppose une désobéissance antérieure
  choice: Conserver directement « il a appris l’obéissance »
  alternative: il a appris par expérience ce que coûte l’obéissance
  rationale: Le texte affirme qu’il a appris l’obéissance sans dire qu’il avait auparavant désobéi. La traduction maintient cette tension et la note précise seulement le caractère vécu de cet apprentissage, sans remplacer l’énoncé grec par une interprétation.
- issue: Rapport exprimé par ἀφ’ ὧν entre apprentissage et souffrance
  choice: par ce qu’il a souffert
  alternative: à partir de ce qu’il a souffert
  rationale: « Par » rend naturellement en français la souffrance comme expérience au travers de laquelle l’obéissance a été apprise. L’alternative est plus formelle, mais moins idiomatique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe concessive est naturelle, et les termes théologiquement chargés « Fils » et « obéissance » restent proches du grec. Les deux marqueurs de note figurent dans le texte.
