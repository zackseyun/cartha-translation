    issue: Rendu de ἀφ’ ὧν par « par ce qu’il a souffert »
    rationale: Cette tournure est possible, mais elle est moins idiomatique et visuellement ambiguë en français. « À partir de ce qu’il a souffert » exprime nettement le rapport de source ou de base indiqué par ἀπό sans imposer une interprétation plus étroite.
  - severity: low
    issue: Rendu de ὢν par « bien qu’il soit »
    rationale: Le subjonctif présent présente la qualité de Fils comme actuelle ou intemporelle. « Bien qu’étant Fils » reproduit plus directement la valeur participiale concomitante au procès passé, dans un français naturel.
