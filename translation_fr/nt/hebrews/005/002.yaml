  text: μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσι καὶ πλανωμένοις ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: fr
  text: capable d’agir avec douceur envers ceux qui sont dans l’ignorance et qui s’égarent[a], puisque lui aussi est entouré de faiblesse[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui sont égarés ». Le participe grec peut avoir une nuance passive.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « est entouré de » ou « est revêtu de » faiblesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: traiter avec mesure
  rationale: Le verbe exprime une attitude mesurée et indulgente, à distance aussi bien de la dureté que d’une compassion incontrôlée. « Traiter avec mesure » conserve cette nuance en français naturel.
- source_word: δυνάμενος
  choice: capable de
  rationale: Le participe présent indique une capacité qui caractérise le grand-prêtre dans le développement de la phrase.
- source_word: τοῖς ἀγνοοῦσι
  choice: ceux qui sont dans l’ignorance
  rationale: Cette formulation garde la valeur participiale sans transformer les personnes concernées en une catégorie sociale figée; elle peut viser l’ignorance fautive ou non sans la préciser davantage.
- source_word: πλανωμένοις
  choice: qui s’égarent
  rationale: Le participe peut décrire ceux qui s’écartent du bon chemin tout en laissant ouverte une nuance passive. Le texte principal reste idiomatique, et la note signale cette autre possibilité.
- source_word: ἐπεὶ
  choice: puisqu’il
  rationale: La conjonction introduit la raison pour laquelle le grand-prêtre peut agir avec mesure.
- source_word: καὶ αὐτὸς
  choice: lui-même, lui aussi
  rationale: Le redoublement français rend à la fois l’insistance portée sur la personne du grand-prêtre et l’idée qu’il partage la condition de ceux dont il s’occupe.
- source_word: περίκειται ἀσθένειαν
  choice: est entouré de faiblesse
  rationale: Cette traduction conserve l’image d’une faiblesse qui enveloppe la personne, tout en gardant à ἀσθένεια son sens large de fragilité humaine.
theological_decisions:
- issue: Nature de la faute évoquée par ἀγνοοῦσι καὶ πλανωμένοις
  choice: Une ignorance et un égarement exprimés en termes généraux
  alternative: Une désignation technique limitée aux péchés involontaires du système lévitique
  rationale: Le contexte sacerdotal peut évoquer les catégories lévitiques, mais les mots grecs ont une portée plus large. La traduction ne restreint donc pas explicitement l’énoncé à une catégorie sacrificielle technique.
- issue: Portée de ἀσθένεια chez le grand-prêtre
  choice: La faiblesse ou fragilité humaine au sens large
  alternative: Une faiblesse exclusivement physique ou exclusivement morale
  rationale: Le terme ne délimite pas ici la nature de la faiblesse. Le français « faiblesse » préserve cette amplitude et la tension du contexte.
translation_notes:
  register: Français international moderne, digne et lisible. La structure participiale s’insère dans la phrase commencée au verset précédent; la virgule finale signale cette continuité. Les notes préservent les images et ambiguïtés du grec sans alourdir le texte principal.
