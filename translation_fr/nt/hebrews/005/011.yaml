id: HEB.5.11
reference: Hebrews 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: fr
  text: À ce sujet, nous avons beaucoup à dire[a], et c’est difficile à expliquer[b], puisque vous êtes devenus lents à écouter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « À son sujet » : le pronom grec peut désigner personnellement Melchisédek, mais il peut aussi renvoyer plus largement au sujet qui vient d’être abordé.'
    reason: alternative_reading
  - marker: b
    text: Ou « difficile à interpréter » ou « difficile à exposer ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « lents quant à l’écoute »; l’expression évoque un manque de réceptivité à l’enseignement, non une déficience auditive.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: À ce sujet
  rationale: Cette formulation naturelle renvoie au thème qui vient d’être abordé, tout en laissant une note signaler que le pronom grec peut aussi désigner personnellement Melchisédek.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: nous avons beaucoup à dire
  rationale: La tournure française restitue idiomatiquement l’idée d’un ample développement à présenter, sans calquer littéralement « la parole est abondante pour nous ».
- source_word: δυσερμήνευτος λέγειν
  choice: c’est difficile à expliquer
  rationale: L’adjectif désigne ce qui est difficile à interpréter ou à exposer; associé à λέγειν, il porte ici sur la difficulté de communiquer clairement l’enseignement.
- source_word: ἐπεὶ
  choice: puisque
  rationale: 'La conjonction introduit la cause de la difficulté d’exposition: l’état des destinataires.'
- source_word: νωθροὶ γεγόνατε
  choice: vous êtes devenus lents
  rationale: « Êtes devenus » conserve la valeur résultative du parfait et indique une évolution vers cet état; « lents » exprime le manque de réactivité sans introduire explicitement l’idée de paresse morale.
- source_word: ταῖς ἀκοαῖς
  choice: à écouter
  rationale: Ce choix garde le champ métaphorique de l’audition tout en exprimant naturellement en français la lenteur à recevoir un enseignement.
theological_decisions:
- issue: Référent de Περὶ οὗ
  choice: Le sujet traité, rendu par « À ce sujet »
  alternative: Melchisédek personnellement, rendu par « À son sujet »
  rationale: Le nom de Melchisédek précède immédiatement, ce qui permet grammaticalement un référent personnel. Toutefois, la suite introduit plus naturellement un développement sur l’ensemble du thème. La note conserve l’ambiguïté réelle sans imposer une résolution doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure argumentative grecque, tandis que « à écouter » rend l’image auditive de manière naturelle et évite l’ambiguïté physique de « durs d’oreille ».
