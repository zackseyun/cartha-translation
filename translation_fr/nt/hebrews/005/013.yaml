source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: fr
  text: En effet, quiconque se nourrit de lait est sans expérience de la parole de justice[a], car il est un tout-petit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message de justice » ou « la parole concernant la justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς … ὁ μετέχων
  choice: quiconque se nourrit de
  rationale: « Quiconque » restitue la portée distributive de πᾶς avec le participe substantivé. « Se nourrit de » exprime naturellement en français la participation au lait dans cette métaphore pédagogique, sans en effacer l’image.
- source_word: γάλακτος
  choice: lait
  rationale: L’image concrète du lait, déjà établie par le contexte, est conservée sans paraphrase.
- source_word: ἄπειρος
  choice: inexpérimenté
  rationale: Le terme indique un manque d’expérience ou de maîtrise, non une ignorance absolue. « Inexpérimenté » garde cette nuance et convient à l’opposition entre immaturité et maturité.
- source_word: λόγου δικαιοσύνης
  choice: la parole de justice
  rationale: 'Cette formulation compacte maintient l’ambiguïté du génitif grec : il peut s’agir d’une parole caractérisée par la justice ou d’un message qui porte sur elle. Une note présente des formulations explicatives sans en imposer une.'
- source_word: νήπιος
  choice: un tout-petit
  rationale: Le mot désigne ici une personne encore immature. « Tout-petit » est naturel, digne et cohérent avec l’image du lait, tout en évitant le sens plus large d’« enfant ».
- source_word: γάρ … γάρ
  choice: en effet … car
  rationale: Les deux connecteurs ont une fonction explicative. La variation française rend clairement l’enchaînement argumentatif sans modifier sa logique.
theological_decisions:
- issue: Sens de λόγου δικαιοσύνης
  choice: la parole de justice
  alternative: le message de justice ; la parole concernant la justice
  rationale: Le génitif peut qualifier la parole ou en indiquer le contenu. Le texte principal conserve cette ouverture plutôt que de choisir silencieusement une seule interprétation.
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: ce qui est juste ; droiture
  rationale: « Justice » est le correspondant français habituel de δικαιοσύνη et peut couvrir ici une dimension morale, relationnelle ou judiciaire. Le contexte ne justifie pas de réduire le terme à une seule de ces dimensions.
- issue: Expression générique au masculin singulier
  choice: quiconque … il
  alternative: la personne qui … elle
  rationale: Le grec emploie une construction générique au masculin singulier. « Quiconque … il » en conserve le nombre et la forme sans limiter le propos aux hommes.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La structure explicative et la métaphore de l’alimentation sont conservées, tandis que la note maintient l’ambiguïté de λόγου δικαιοσύνης.
