id: HEB.5.10
reference: Hebrews 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: fr
  text: ayant été désigné par Dieu comme grand prêtre selon l’ordre de Melchisédek[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant été appelé par Dieu grand prêtre » ou « ayant été nommé grand prêtre par Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Cette expression fait écho au Psaume 110.4, où le sacerdoce est dit être « selon l’ordre de Melchisédek ».
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: ayant été désigné
  rationale: Le participe aoriste passif exprime l’acte par lequel Dieu nomme ou déclare publiquement la fonction de Jésus. « Désigné » conserve la voix passive et évite la nuance institutionnelle potentiellement plus forte de « nommé ».
- source_word: ὑπὸ τοῦ θεοῦ
  choice: par Dieu
  rationale: Ὑπό avec le génitif indique l’agent personnel. Le texte dit simplement « Dieu », sans préciser « le Père ».
- source_word: ἀρχιερεὺς
  choice: comme grand prêtre
  rationale: « Grand prêtre » est l’équivalent français usuel. La construction avec « comme » rend naturellement la désignation à cette fonction sans introduire d’article indéfini susceptible de suggérer qu’il ne serait qu’un grand prêtre parmi d’autres.
- source_word: κατὰ
  choice: selon
  rationale: Dans cette expression, κατά marque la conformité ou la correspondance; « selon » est à la fois précis, naturel et conforme à l’écho du Psaume 110.4.
- source_word: τὴν τάξιν
  choice: l’ordre
  rationale: Dans l’argumentation de l’épître, τάξις désigne l’ordre ou le type sacerdotal associé à Melchisédek, plutôt qu’une simple disposition ou succession. « Ordre » maintient aussi le lien traditionnel avec le Psaume 110.4.
- source_word: Μελχισέδεκ
  choice: Melchisédek
  rationale: Translittération française usuelle du nom propre biblique.
theological_decisions:
- issue: Le participe indique-t-il une nomination institutionnelle ou une désignation/déclaration divine?
  choice: ayant été désigné par Dieu comme grand prêtre
  alternative: ayant été appelé par Dieu grand prêtre; ayant été nommé grand prêtre par Dieu
  rationale: « Désigné » rend l’acte divin d’identifier ou de déclarer Jésus grand prêtre sans trancher au-delà du texte la question d’un changement de statut, ni imposer une nuance formelle d’installation.
- issue: Sens de « selon l’ordre de Melchisédek »
  choice: conserver la formule « selon l’ordre de Melchisédek »
  alternative: sur le modèle de Melchisédek; d’un rang semblable à celui de Melchisédek
  rationale: La formule préserve la polysémie de τάξις ainsi que l’écho explicite au Psaume 110.4, sans réduire l’expression à un simple modèle ni à un rang.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale est conservée parce que le verset prolonge la phrase précédente. « Grand prêtre » et « selon l’ordre de Melchisédek » maintiennent le vocabulaire biblique reconnu sans archaïsme excessif.
