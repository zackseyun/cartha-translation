  text: καὶ τελειωθεὶς ἐγένετο ⸂πᾶσιν τοῖς ὑπακούουσιν αὐτῷ⸃ αἴτιος σωτηρίας αἰωνίου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/009.yaml
  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: fr
  text: Et, après avoir été mené à son plein accomplissement[a], il est devenu pour tous ceux qui lui obéissent la source[b] d’un salut éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir été rendu parfait ». Le grec peut évoquer l’achèvement complet de sa mission sacerdotale et rédemptrice, plutôt qu’une amélioration morale.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’auteur » ou « la cause ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τελειωθεὶς
  choice: après avoir été conduit à l’accomplissement
  rationale: Le participe aoriste passif exprime ici l’aboutissement au but visé. Cette formulation conserve la voix passive et évite de suggérer une amélioration morale de Jésus, tout en restant naturelle en français.
- source_word: ἐγένετο
  choice: il est devenu
  rationale: Le verbe indique l’entrée dans l’état ou le rôle qui résulte de cet accomplissement; « est devenu » en rend directement le sens.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: pour tous ceux qui lui obéissent
  rationale: La préposition « pour » présente clairement les bénéficiaires. « Lui obéissent » conserve sans l’atténuer la valeur de ὑπακούω et le caractère présent ou habituel du participe.
- source_word: αἴτιος
  choice: la source
  rationale: Le terme désigne celui qui est à l’origine ou la cause de quelque chose. « La source » exprime cette causalité dans un français actuel sans la possible connotation littéraire de « l’auteur ».
- source_word: σωτηρίας αἰωνίου
  choice: d’un salut éternel
  rationale: « Salut » maintient le registre sotériologique du contexte, et « éternel » est l’équivalent français le plus naturel de αἰώνιος dans ce syntagme.
- source_word: καὶ
  choice: Et
  rationale: La conjonction relie simplement cette affirmation à ce qui précède, sans préciser davantage le rapport logique.
theological_decisions:
- issue: Sens christologique de τελειωθεὶς
  choice: après avoir été conduit à l’accomplissement
  alternative: après avoir été rendu parfait; après avoir été mené à son plein accomplissement
  rationale: Dans l’épître aux Hébreux, le terme évoque l’achèvement du parcours et de la mission sacerdotale et rédemptrice de Jésus. La traduction préserve cette visée sans laisser entendre qu’il serait passé d’une imperfection morale à la sainteté.
- issue: Portée de l’expression « tous ceux qui lui obéissent »
  choice: maintien explicite de l’obéissance
  alternative: tous ceux qui l’écoutent; tous ceux qui croient en lui
  rationale: Le grec parle expressément de ceux qui lui obéissent. La traduction ne réduit pas cette formulation à la seule croyance et ne l’élargit pas en un système doctrinal.
- issue: Valeur causale de αἴτιος
  choice: la source
  alternative: l’auteur; la cause
  rationale: « La source » attribue clairement au Christ l’origine du salut, tout en laissant en note les autres nuances lexicalement possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien avec le contexte précédent, la passivité de l’accomplissement, l’exigence d’obéissance et la portée théologique de « salut éternel ».
