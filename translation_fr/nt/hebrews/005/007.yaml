source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: fr
  text: lui qui, aux jours de sa chair, a offert des prières et des supplications, avec de grands cris et des larmes, à celui qui pouvait le sauver de la mort[a], et qui a été exaucé à cause de sa révérence[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le sauver de la mort » peut aussi se comprendre comme le sauver en le faisant sortir de la mort, c’est-à-dire par la résurrection.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « à cause de sa crainte respectueuse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: durant les jours de sa condition humaine
  rationale: Rend l’expression idiomatique de façon naturelle tout en conservant l’accent sur la condition incarnée et vulnérable de Jésus; «les jours de sa chair» serait plus formel, mais moins immédiatement intelligible en français courant.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: des prières et des supplications
  rationale: Distingue les deux termes grecs et conserve l’intensité particulière de ἱκετηρίας sans employer une tournure archaïque.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: à celui qui pouvait le sauver de la mort
  rationale: Reproduit le participe substantivé et maintient dans le texte la possibilité d’une préservation de la mort ou d’une délivrance hors de la mort.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: avec de grands cris et des larmes
  rationale: Expression française naturelle qui communique la force de κραυγῆς ἰσχυρᾶς, malgré le singulier collectif du grec.
- source_word: προσενέγκας
  choice: a présenté
  rationale: Convient aux prières et aux supplications en français moderne; le contexte sacerdotal peut laisser percevoir une nuance d’offrande sans qu’elle soit explicitée artificiellement.
- source_word: εἰσακουσθεὶς
  choice: a été exaucé
  rationale: Le verbe indique qu’il a été entendu favorablement; «exaucé» exprime cette valeur plus précisément que le simple «entendu».
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: à cause de son profond respect
  rationale: Exprime la révérence pieuse de Jésus sans ajouter explicitement l’idée de soumission; une note conserve l’autre traduction traditionnelle possible.
theological_decisions:
- issue: Sens de ἀπὸ τῆς εὐλαβείας appliqué à Jésus
  choice: à cause de son profond respect
  alternative: à cause de sa crainte respectueuse
  rationale: Le choix principal rend la révérence envers Dieu sans suggérer une peur fautive. La note préserve la valeur possible de crainte pieuse sans trancher excessivement.
- issue: Portée de «le sauver de la mort»
  choice: maintenir «le sauver de la mort» dans le texte
  alternative: le délivrer hors de la mort, c’est-à-dire par la résurrection
  rationale: ἐκ θανάτου peut évoquer soit le fait d’échapper à la mort, soit la délivrance qui en fait sortir. Le texte principal conserve cette tension et la note en explicite la seconde possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale grecque est transformée en verbes coordonnés pour assurer la fluidité, tout en conservant la dépendance syntaxique du verset envers le contexte précédent. «Condition humaine» explicite modérément l’expression littérale «chair» sans réduire celle-ci à la seule vie terrestre.
