reference: Hebrews 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: fr
  text: 'Ainsi, le Messie[a] ne s’est pas glorifié[b] lui-même pour devenir grand prêtre ; il l’a été par celui qui lui a dit : « Tu es mon Fils ; moi, aujourd’hui, je t’ai engendré[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le grec Χριστός est ici employé comme un titre.
    reason: alternative_reading
  - marker: b
    text: Ou « ne s’est pas attribué lui-même l’honneur ». Le verbe grec peut exprimer la gloire ou l’honneur.
    reason: lexical_alternative
  - marker: c
    text: Citation du Psaume 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Ainsi
  rationale: Introduit naturellement en français le parallèle avec l’affirmation précédente concernant l’appel du grand prêtre.
- source_word: ὁ Χριστὸς
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre dans un raisonnement sur la charge à laquelle Dieu établit son Fils ; « le Messie » en rend clairement le sens titulaire.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: ne s’est pas lui-même attribué l’honneur
  rationale: Cette formulation française naturelle conserve la construction réfléchie et le sens contextuel de δοξάζω, ici lié à l’honneur d’accéder à une charge.
- source_word: γενηθῆναι ἀρχιερέα
  choice: de devenir grand prêtre
  rationale: Rend directement l’entrée dans la fonction exprimée par γενηθῆναι avec l’attribut ἀρχιερέα.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: cet honneur lui est venu de celui qui lui a dit
  rationale: 'Explicite avec mesure l’ellipse grecque : le contraste oppose l’auto-attribution de l’honneur à l’action de celui qui prononce l’oracle. « Dit » est idiomatique pour l’introduction d’une citation.'
- source_word: Υἱός μου εἶ σύ
  choice: Tu es mon Fils
  rationale: Ordre naturel en français, qui conserve la déclaration filiale directe.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: moi, aujourd’hui, je t’ai engendré
  rationale: « Moi » conserve l’emphase de ἐγώ, tandis que « engendré » rend précisément γεννάω et préserve la portée intertextuelle et la tension théologique de la citation.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le mot a ici une valeur nettement titulaire, dans le cadre de l’établissement à une fonction. La variante traditionnelle est signalée sans imposer une lecture confessionnelle particulière.
- issue: Sens de « aujourd’hui, je t’ai engendré »
  choice: Conserver littéralement la formulation de la citation
  alternative: Préciser dans la traduction qu’il s’agit de l’intronisation, de la résurrection ou de la génération éternelle
  rationale: Le texte cite le Psaume 2.7 sans expliquer ici la portée temporelle ou métaphysique de « aujourd’hui ». La traduction ne doit pas trancher dans le texte principal entre ces interprétations théologiques.
- issue: Ellipse après ἀλλά
  choice: Rendre explicitement l’origine divine de l’honneur sans nommer le sujet
  alternative: Ajouter explicitement « Dieu l’a glorifié »
  rationale: Le grec laisse l’action contrastive implicite et désigne Dieu comme « celui qui lui a dit ». La formulation française clarifie le lien syntaxique tout en gardant cette désignation indirecte.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe explicite sobrement l’ellipse grecque, tandis que « engendré » maintient la forme solennelle de la citation et son ambiguïté théologique.
