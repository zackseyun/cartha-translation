  to: Car, alors que, compte tenu du temps écoulé, vous devriez être des enseignants, vous avez de nouveau besoin qu’on vous enseigne les premiers éléments des paroles de Dieu[a] ; vous en êtes arrivés à avoir besoin de lait, et non de nourriture solide.
