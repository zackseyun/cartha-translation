id: HEB.5.12
reference: Hebrews 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: fr
  text: Car, alors que, compte tenu du temps écoulé, vous devriez être des enseignants, vous avez de nouveau besoin qu’on vous enseigne les premiers éléments des paroles de Dieu[a] ; vous en êtes arrivés à avoir besoin de lait, et non de nourriture solide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « oracles de Dieu » ; elle désigne ici des déclarations ou révélations divines, et non des oracles païens.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι διδάσκαλοι
  choice: vous devriez être des enseignants
  rationale: Exprime l’attente et l’obligation liées à la maturité acquise, sans donner à ὀφείλοντες un ton excessivement juridique.
- source_word: διὰ τὸν χρόνον
  choice: vu le temps écoulé
  rationale: Rend explicitement l’idée du temps qui s’est écoulé et qui devrait avoir conduit les destinataires à la maturité.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: vous avez de nouveau besoin qu’on vous enseigne
  rationale: Formulation française naturelle qui conserve l’idée de régression ou de répétition portée par πάλιν.
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: les tout premiers éléments
  rationale: Réunit en français idiomatique l’idée des éléments rudimentaires (στοιχεῖα) et celle du commencement (ἀρχή), sans imposer un programme doctrinal précis.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: des paroles de Dieu
  rationale: λόγια désigne ici des paroles ou déclarations d’origine divine. « Paroles de Dieu » est clair en français moderne, tandis que la note conserve la nuance plus solennelle d’« oracles ».
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: vous en êtes arrivés à avoir besoin
  rationale: 'Restitue la valeur résultative du parfait : les destinataires ont atteint un état de dépendance qui subsiste.'
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: de lait, et non de nourriture solide
  rationale: Conserve sans l’expliciter la métaphore rhétorique opposant une instruction élémentaire à une instruction adaptée à la maturité.
theological_decisions:
- issue: Contraste métaphorique entre le lait et la nourriture solide
  choice: Conserver la métaphore sans en définir techniquement les composantes
  alternative: Paraphraser par « enseignement élémentaire » et « enseignement avancé »
  rationale: Le verset oppose deux degrés de maturité au moyen d’une image, mais ne fournit pas ici de cursus doctrinal précis. La métaphore préserve cette ouverture.
- issue: Portée de λόγια τοῦ θεοῦ
  choice: « paroles de Dieu », avec une note explicative
  alternative: « oracles de Dieu »
  rationale: La traduction retenue demeure accessible et évite que le lecteur associe spontanément le terme aux oracles païens, tout en signalant dans la note qu’il s’agit de déclarations ou révélations divines.
translation_notes:
  register: Français international moderne, naturel et digne. La première phrase est scindée pour rendre clairement le reproche, tandis que « pourtant » fait ressortir le contraste exprimé par la progression grecque. Le vocabulaire reste accessible sans effacer la solennité du passage.
