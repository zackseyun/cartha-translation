id: HEB.5.1
reference: Hebrews 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: fr
  text: En effet, tout grand prêtre, pris parmi les hommes, est établi en faveur des hommes[a] dans ce qui concerne Dieu, afin d’offrir des dons et des sacrifices pour les péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un terme qui peut désigner les êtres humains en général : le grand prêtre est pris parmi eux et établi en leur faveur.'
    reason: Préciser la portée représentative de ἀνθρώπων sans effacer le caractère masculin de l’office décrit.
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: En effet, tout grand prêtre
  rationale: « Tout » rend la portée distributive du singulier Πᾶς, tandis que « en effet » introduit naturellement en français l’explication signalée par γάρ. « Grand prêtre » est le terme précis et usuel pour l’office cultuel visé.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: pris parmi les hommes
  rationale: Le participe passif « pris » conserve la forme et l’idée de provenance sans préciser indûment le mode de sélection. Dans ce contexte historique, le grand prêtre est de sexe masculin; « hommes » peut également porter la valeur représentative plus large de ἄνθρωποι.
- source_word: ὑπὲρ ἀνθρώπων καθίσταται
  choice: est établi en faveur des hommes
  rationale: « Est établi » exprime la mise en fonction indiquée par καθίσταται. « En faveur de » conserve la nuance de bénéfice et de représentation de ὑπέρ sans la réduire à un simple « pour ».
- source_word: τὰ πρὸς τὸν θεόν
  choice: dans ce qui concerne Dieu
  rationale: Cette formulation française naturelle reste proche de l’idiome grec, qui désigne les réalités ou responsabilités orientées vers Dieu.
- source_word: ἵνα προσφέρῃ
  choice: afin d’offrir
  rationale: « Afin de » exprime clairement le but marqué par ἵνα avec le subjonctif, sans alourdir la phrase.
- source_word: δῶρά τε καὶ θυσίας
  choice: des dons et des sacrifices
  rationale: Les deux substantifs sont maintenus afin de préserver l’étendue du vocabulaire cultuel; en français, la simple coordination par « et » rend naturellement τε καί.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: pour les péchés
  rationale: Dans le contexte sacrificiel, « pour les péchés » est l’équivalent idiomatique de ὑπὲρ ἁμαρτιῶν et conserve son rapport volontairement concis aux péchés.
theological_decisions:
- issue: Portée du langage représentatif dans ἀνθρώπων
  choice: Employer « hommes » dans le texte principal, avec une note explicative
  alternative: « êtres humains » ou « personnes »
  rationale: Le passage parle d’un office historiquement masculin tout en employant ἄνθρωποι pour situer le grand prêtre au sein de l’humanité et décrire ceux en faveur desquels il agit. « Hommes » préserve cette tension, tandis que la note empêche de comprendre à tort que son ministère ne concernerait que les hommes de sexe masculin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche du mouvement de la phrase grecque, tout en plaçant « en effet » en tête pour une articulation naturelle. Le vocabulaire cultuel traditionnel (« grand prêtre », « dons », « sacrifices », « péchés ») est conservé.
