review_pass:
  verdict: revise
  source_fidelity: La première proposition rend bien οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν. En revanche, « on le reçoit seulement quand » ajoute à la fois le verbe « reçoit » et la restriction explicite « seulement quand », qui ne figurent pas dans le grec. Le participe passif καλούμενος exprime directement l’appel divin; il convient de le conserver sans transformer la phrase en condition explicitement restrictive.
  naturalness: « Personne ne s’attribue cet honneur ; on y est appelé par Dieu, comme Aaron l’a été lui aussi » est naturel en français international moderne. Le pronom « y » renvoie à la dignité ou fonction concernée et évite une reprise lourde. La reprise « l’a été » rend clairement l’appel sous-entendu pour Aaron.
  terminology: « honneur » conserve τιμή, et « cet honneur » explicite sobrement son référent contextuel. « Appelé par Dieu » rend fidèlement καλούμενος ὑπὸ τοῦ θεοῦ. Aaron est correctement conservé sans interprétation confessionnelle supplémentaire.
  issues:
  - severity: medium
    issue: Ajout de « seulement quand »
    rationale: Cette restriction conditionnelle explicite va au-delà de ἀλλὰ καλούμενος, qui oppose simplement l’auto-attribution à l’appel de Dieu.
  - severity: medium
    issue: Ajout de « on le reçoit »
    rationale: Le grec ne répète pas un verbe signifiant « recevoir »; il énonce que la personne est appelée par Dieu. Cette explicitation modifie légèrement la construction et affaiblit la voix passive de l’appel.
  revised_text: Personne ne s’attribue cet honneur[a] ; on y est appelé par Dieu, comme Aaron l’a été lui aussi.
