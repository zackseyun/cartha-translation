source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: fr
  text: Personne ne s’attribue cet honneur[a] ; on y est appelé par Dieu, comme Aaron l’a été lui aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’honneur ». Dans le contexte, il s’agit de la dignité ou de la fonction sacerdotale.'
    reason: Préciser que le grec emploie l’article défini et que le démonstratif français explicite la référence contextuelle.
lexical_decisions:
- source_word: τις avec οὐχ
  choice: Personne
  rationale: La négation suivie de l’indéfini s’exprime naturellement en français par le pronom universel négatif « personne ».
- source_word: ἑαυτῷ ... λαμβάνει
  choice: ne s’attribue
  rationale: Le tour réfléchi rend l’idée d’une appropriation personnelle de la dignité, tout en évitant le calque peu naturel « ne prend pour soi ».
- source_word: τὴν τιμήν
  choice: cet honneur
  rationale: « Honneur » traduit directement τιμή ; le démonstratif renvoie naturellement à la dignité sacerdotale évoquée dans le contexte immédiat.
- source_word: ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ
  choice: on le reçoit seulement quand on est appelé par Dieu
  rationale: La formulation française explicite le sujet générique et la condition impliquée par le participe passif, sans faire du prêtre l’agent de sa propre nomination. « Reçoit » est suppléé pour achever naturellement le contraste avec l’auto-attribution.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: comme Aaron l’a été lui aussi
  rationale: Le verbe sous-entendu est repris en français ; « lui aussi » restitue καί et souligne qu’Aaron a également été appelé par Dieu.
theological_decisions:
- issue: Nature de la dignité sacerdotale
  choice: L’honneur ne peut être assumé de sa propre initiative ; il dépend de l’appel de Dieu, Aaron servant de modèle.
  alternative: Comprendre la phrase comme une affirmation générale sur l’honneur, sans référence particulière à la fonction de grand-prêtre.
  rationale: Le contexte immédiat, Hébreux 5.1-5, traite du grand-prêtre. Le maintien du terme général « honneur », plutôt que « fonction », préserve toutefois la formulation du grec.
translation_notes:
  register: Français international moderne, digne et accessible. « S’attribuer cet honneur » est idiomatique et exprime clairement l’idée d’une dignité non assumée de sa propre initiative. Le point-virgule marque nettement le contraste.
