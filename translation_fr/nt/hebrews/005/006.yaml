  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: fr
  text: 'Comme il le dit aussi dans un autre passage[a] : « Tu es prêtre pour toujours, selon l’ordre de Melchisédek[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans un autre »; on peut aussi traduire « ailleurs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « suivant l’ordre de Melchisédek ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: comme… aussi
  rationale: Cette tournure française naturelle conserve à la fois la comparaison exprimée par καθώς et la valeur additive de καί; elle introduit une seconde citation biblique parallèle à la précédente.
- source_word: ἐν ἑτέρῳ
  choice: dans un autre passage
  rationale: Le grec dit littéralement « dans un autre », avec un nom sous-entendu. « Passage » explicite sobrement la référence à un autre endroit des Écritures.
- source_word: λέγει
  choice: il dit
  rationale: Le présent et le sujet personnel implicite sont conservés. Dans l’épître, les Écritures sont présentées comme une parole actuelle de Dieu; la traduction n’ajoute toutefois pas explicitement le nom « Dieu ».
- source_word: Σὺ ἱερεὺς
  choice: Tu es prêtre
  rationale: La deuxième personne du singulier et le titre sacerdotal sont rendus directement. En français, aucun article n’est requis après « être » devant un nom indiquant une fonction.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Expression française claire et idiomatique pour la durée perpétuelle indiquée par la formule grecque.
- source_word: κατὰ τὴν τάξιν
  choice: selon l’ordre de
  rationale: « Ordre » préserve l’idée d’un agencement, d’un rang ou d’une catégorie sacerdotale et maintient le lien terminologique important pour l’argument de l’épître.
- source_word: Μελχισέδεκ
  choice: Melchisédek
  rationale: Translittération française usuelle du nom propre biblique.
theological_decisions:
- issue: Référence du sujet dans la formule de citation
  choice: « il dit », avec Dieu comme locuteur implicite
  alternative: « il est dit », formulation impersonnelle renvoyant aux Écritures
  rationale: L’épître présente couramment les paroles scripturaires comme une parole actuelle de Dieu. « Il dit » conserve cette force personnelle sans introduire dans le texte un sujet nominal absent du grec.
- issue: Sens de τάξις dans la citation concernant Melchisédek
  choice: « ordre », compris comme ordre, rang ou catégorie sacerdotale
  alternative: « manière » ou « modèle »
  rationale: « Ordre » respecte le champ sémantique du terme et préserve la distinction sacerdotale sur laquelle repose l’argument de l’épître, sans réduire la relation à une simple ressemblance de comportement.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la formule de citation grecque, tandis que « passage » explicite l’ellipse nécessaire à la compréhension courante.
