id: HEB.5.3
reference: Hebrews 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: fr
  text: Et à cause de cette faiblesse, il est tenu d’offrir pour les péchés, tant pour le peuple que pour lui-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: à cause de cette faiblesse
  rationale: Le pronom féminin renvoie très probablement à ἀσθένεια (« faiblesse ») au verset précédent. L’explicitation assure en français une référence naturelle et claire.
- source_word: ὀφείλει
  choice: il est tenu
  rationale: Cette expression traduit une obligation réelle liée à la fonction sacerdotale, et non un simple conseil.
- source_word: καθὼς ... οὕτως καὶ
  choice: aussi bien que
  rationale: Cette tournure française naturelle maintient le parallèle entre le peuple et le grand prêtre lui-même, même si elle réorganise légèrement l’ordre grec.
- source_word: τοῦ λαοῦ
  choice: le peuple
  rationale: Dans ce contexte sacerdotal, le terme désigne le peuple de l’alliance sans qu’il soit nécessaire d’ajouter « d’Israël ».
- source_word: περὶ αὑτοῦ
  choice: pour lui-même
  rationale: Rend directement et naturellement le sens réfléchi.
- source_word: προσφέρειν
  choice: d’offrir des sacrifices
  rationale: Le contexte cultuel rend l’objet sacrificiel implicite. Son explicitation est nécessaire à un français idiomatique et ne dépasse pas le sens contextuel.
- source_word: περὶ ἁμαρτιῶν
  choice: pour les péchés
  rationale: Formulation concise qui conserve la portée générale de la construction sacrificielle sans la réduire techniquement à « sacrifice pour le péché ».
theological_decisions:
- issue: Antécédent de δι’ αὐτὴν
  choice: Expliciter « cette faiblesse », en référence au verset 2.
  alternative: Traduire « à cause de cela » et laisser l’antécédent implicite.
  rationale: L’accord féminin et la proximité de ἀσθένεια appuient fortement cette référence. L’explicitation évite en français une ambiguïté artificielle, tout en conservant le lien causal entre la faiblesse du grand prêtre et son obligation d’offrir pour lui-même.
- issue: Objet implicite de προσφέρειν
  choice: Ajouter « des sacrifices ».
  alternative: Traduire simplement « d’offrir pour les péchés ».
  rationale: Le cadre sacerdotal et sacrificiel fournit clairement l’objet sous-entendu. L’ajout produit un français courant sans imposer un type particulier de sacrifice.
- issue: Ordre du parallèle peuple / grand prêtre
  choice: « pour lui-même aussi bien que pour le peuple »
  alternative: « comme pour le peuple, de même aussi pour lui-même »
  rationale: La formulation choisie est plus naturelle en français tout en conservant l’idée théologiquement importante que le grand prêtre humain doit offrir également pour ses propres péchés.
translation_notes:
  register: Français moderne, digne et accessible. La phrase privilégie une syntaxe naturelle tout en préservant l’obligation sacerdotale, la causalité liée à la faiblesse et le parallèle entre le prêtre et le peuple.
