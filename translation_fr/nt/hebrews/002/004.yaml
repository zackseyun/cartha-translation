id: HEB.2.4
reference: Hebrews 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνεπιμαρτυροῦντος τοῦ θεοῦ σημείοις τε καὶ τέρασιν καὶ ποικίλαις δυνάμεσιν καὶ πνεύματος ἁγίου μερισμοῖς κατὰ τὴν αὐτοῦ θέλησιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: fr
  text: Dieu y joignait lui aussi son témoignage par des signes, des prodiges, divers miracles[a] et des distributions de l’Esprit Saint[b], selon sa volonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « diverses manifestations de puissance » ou « divers actes puissants ». Le terme grec peut désigner la puissance à l’œuvre et, dans ce contexte, des actes miraculeux.
    reason: lexical_alternative
  - marker: b
    text: Ou « des répartitions » ou « des parts de l’Esprit Saint ». Le texte grec n’ajoute pas explicitement le mot « dons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος τοῦ θεοῦ
  choice: Dieu y joignait lui aussi son témoignage
  rationale: Le participe au génitif exprime une action concomitante à celle du verset précédent. « Joignait lui aussi son témoignage » rend la valeur de συν- sans la réduire à un simple « aussi »; « y » rattache naturellement ce témoignage à la proclamation précédemment évoquée.
- source_word: σημείοις τε καὶ τέρασιν
  choice: par des signes, des prodiges
  rationale: « Par » marque clairement le moyen. Le couple traditionnel « signes et prodiges » conserve à la fois la fonction probante des actes et l’étonnement qu’ils suscitent.
- source_word: ποικίλαις δυνάμεσιν
  choice: divers miracles
  rationale: Dans ce contexte, δυνάμεις désigne vraisemblablement des manifestations surnaturelles de puissance. « Miracles » est clair en français courant, tandis qu’une note conserve les autres possibilités lexicales.
- source_word: πνεύματος ἁγίου μερισμοῖς
  choice: des distributions de l’Esprit Saint
  rationale: Le nom μερισμοί évoque des distributions, des répartitions ou des parts. Cette formulation n’ajoute pas le mot « dons », absent du grec, et maintient l’ambiguïté du génitif.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: selon sa volonté
  rationale: Rendu direct de κατά avec l’accusatif de conformité. Dans la syntaxe, le possessif renvoie le plus naturellement à Dieu.
theological_decisions:
- issue: Référent de « sa » dans « selon sa volonté »
  choice: Le possessif renvoie le plus naturellement à Dieu, sujet du témoignage.
  alternative: Il pourrait être rapporté plus librement à l’Esprit Saint, mais cette lecture est syntaxiquement moins probable.
  rationale: Dieu est le sujet directeur du participe et le possessif αὐτοῦ reprend naturellement ce sujet. La traduction garde toutefois la forme pronominale du grec sans explicitation doctrinale.
- issue: Nature des μερισμοί de l’Esprit Saint
  choice: Conserver « distributions de l’Esprit Saint » sans ajouter « dons ».
  alternative: « Dons de l’Esprit Saint » ou « dons répartis par l’Esprit Saint ».
  rationale: Le texte peut évoquer des dons ou des parts accordées, mais il ne contient pas explicitement le nom « dons » et ne tranche pas entièrement la valeur du génitif.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure liée au verset précédent, conformément à la structure participiale grecque. « Distributions » est volontairement plus formel afin de préserver la précision et l’ambiguïté de μερισμοῖς.
