id: HEB.2.9
reference: Hebrews 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: fr
  text: Mais nous voyons Jésus, qui a été abaissé pour un peu de temps au-dessous des anges, couronné de gloire et d’honneur à cause de la souffrance de la mort, afin que, sans Dieu[a], il goûte la mort pour tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits lisent : « par la grâce de Dieu » au lieu de « sans Dieu ».'
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: pour un peu de temps
  rationale: 'Dans la reprise du Psaume 8, l’expression est comprise temporellement : l’abaissement de Jésus au-dessous des anges est limité dans le temps. Cette traduction conserve toutefois la concision du grec.'
- source_word: παρ’ ἀγγέλους
  choice: au-dessous des anges
  rationale: Après ἐλαττόω, παρά avec l’accusatif a une valeur comparative. « Au-dessous des anges » exprime naturellement en français la position inférieure indiquée ici.
- source_word: ἠλαττωμένον
  choice: a été abaissé
  rationale: Le participe parfait passif décrit l’état résultant d’un abaissement. « A été abaissé » garde le passif et évite de réduire l’idée à une humiliation subjective.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: à cause de la souffrance de la mort
  rationale: διά avec l’accusatif indique ici le plus naturellement la cause de son couronnement. La formulation conserve le lien étroit, et quelque peu solennel, entre souffrance et mort.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: couronné de gloire et d’honneur
  rationale: Cette expression française naturelle préserve l’image royale de στεφανόω ainsi que les deux substantifs coordonnés.
- source_word: ὅπως
  choice: afin que
  rationale: « Afin que » rend clairement la valeur finale de la proposition sans trancher au-delà du grec entre but et résultat envisagé.
- source_word: χωρὶς θεοῦ
  choice: sans Dieu
  rationale: Le texte grec fourni, SBLGNT, porte χωρὶς θεοῦ, littéralement « sans Dieu » ou « à l’écart de Dieu ». Cette leçon difficile est donc retenue dans le texte principal, tandis que la variante ancienne et très répandue χάριτι θεοῦ est signalée en note.
- source_word: ὑπὲρ παντός
  choice: pour tous
  rationale: Dans ce contexte, ὑπέρ exprime la mort en faveur d’autrui et παντός a une portée distributive. « Pour tous » est idiomatique et garde ouverte l’étendue universelle de l’expression, même si le singulier grec peut littéralement signifier « pour chacun » ou, selon l’interprétation, « pour toute chose ».
- source_word: γεύσηται θανάτου
  choice: il goûte la mort
  rationale: L’expression conserve la métaphore grecque, intelligible en français biblique moderne, plutôt que de la réduire à « subir » ou « connaître » la mort.
theological_decisions:
- issue: Variante textuelle dans la proposition finale
  choice: sans Dieu
  alternative: par la grâce de Dieu
  rationale: Le SBLGNT fourni lit χωρὶς θεοῦ (« sans Dieu »), leçon théologiquement difficile mais textuellement attestée. De nombreux manuscrits et éditions critiques retiennent toutefois χάριτι θεοῦ (« par la grâce de Dieu »). Afin de traduire d’abord la source grecque indiquée sans effacer la tension, « sans Dieu » figure dans le texte et l’autre leçon est donnée en note.
- issue: Portée de ὑπὲρ παντός
  choice: pour tous
  alternative: pour toute chose / pour chacun
  rationale: Le contexte favorise une référence personnelle et distributive, mais la forme grecque au singulier permet une expression plus large. La traduction usuelle « pour tous » ne précise pas davantage l’application théologique de la mort de Jésus.
translation_notes:
  register: Français international actuel, digne et lisible. La structure place « Jésus » tôt dans la phrase pour éviter une lourdeur excessive, tout en maintenant les liens syntaxiques entre son abaissement, sa mort et son couronnement. La métaphore « goûter la mort » et la formulation solennelle « souffrance de la mort » sont conservées.
