    issue: Ponctuation et ordre des mots dans la proposition finale
    rationale: « Afin que, sans Dieu, il goûte » interrompt inutilement la construction. « Afin que, sans Dieu, il goûte » est grammaticalement possible mais moins naturel; « afin que, sans Dieu, il goûte » conserve aussi une virgule discutable. Placer le sujet immédiatement après « afin que » donne une lecture française plus fluide sans modifier le sens.
  - severity: low
    issue: Formulation quantitative de la note textuelle
    rationale: L’audit anglais indique seulement « Some manuscripts ». « Certains manuscrits » rapporte la variante de façon exacte et prudente, sans faire une affirmation non étayée sur le nombre de témoins.
