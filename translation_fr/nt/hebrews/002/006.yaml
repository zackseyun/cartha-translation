id: HEB.2.6
reference: Hebrews 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: fr
  text: 'Mais quelqu’un a rendu ce témoignage quelque part : « Qu’est-ce que l’être humain pour que tu te souviennes de lui, ou le fils de l’homme[a] pour que tu prennes soin de lui[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le Psaume 8.5, « le fils de l’homme » est une expression poétique qui désigne l’être humain; dans Hébreux, le contexte plus large contribue aussi à son application à Jésus.
    reason: cross_reference
  - marker: b
    text: Ou « pour que tu le visites » ou « que tu veilles sur lui ». Le verbe grec peut évoquer une attention bienveillante manifestée par une visite ou des soins.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: a rendu ce témoignage
  rationale: Le verbe exprime l’action de témoigner avec force. Cette tournure française est naturelle et convient à l’introduction d’un témoignage scripturaire.
- source_word: δέ
  choice: Mais
  rationale: La particule marque ici une transition légèrement contrastive avec l’affirmation précédente concernant la soumission du monde à venir.
- source_word: πού τις
  choice: quelqu’un… quelque part
  rationale: La combinaison indéfinie est conservée sans suggérer que l’auteur ignore l’origine de la citation; elle introduit simplement le témoignage sans nommer son auteur ni son emplacement.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Qu’est-ce que l’être humain
  rationale: ἄνθρωπος est générique dans ce parallélisme poétique. « L’être humain » exprime clairement cette portée universelle en français moderne tout en gardant le singulier représentatif.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: tu te souviennes de lui
  rationale: Le verbe signifie se souvenir ou garder présent à l’esprit. « Te souviennes de lui » est direct, compréhensible et fidèle.
- source_word: υἱὸς ἀνθρώπου
  choice: le fils de l’homme
  rationale: La formulation littérale préserve l’écho du Psaume 8 ainsi que la tension entre son sens humain générique et son application ultérieure à Jésus dans Hébreux.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: tu prennes soin de lui
  rationale: Le verbe peut désigner une visite attentive qui se manifeste par le souci et les soins. Cette formulation communique naturellement le sens contextuel sans réduire le terme à une simple visite.
theological_decisions:
- issue: La portée de l’expression « le fils de l’homme »
  choice: Conserver « le fils de l’homme » sans en faire explicitement un titre messianique par une majuscule.
  alternative: Traduire de façon entièrement générique (« un être humain ») ou employer « le Fils de l’homme » pour signaler directement un titre christologique.
  rationale: Dans le Psaume 8, l’expression forme un parallèle poétique désignant l’humanité; le contexte d’Hébreux lui donne aussi une portée christologique. La traduction conserve cette tension sans la résoudre prématurément.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est maintenu. « L’être humain » évite une ambiguïté de genre aujourd’hui courante avec « l’homme », tandis que « le fils de l’homme » est conservé comme expression scripturaire porteuse de son écho littéraire et théologique.
