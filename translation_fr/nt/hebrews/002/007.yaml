  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: fr
  text: Tu l’as abaissé, pour peu de temps, au-dessous des anges[a] ; tu l’as couronné de gloire et d’honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu l’as abaissé un peu au-dessous des anges. » L’expression grecque peut indiquer le degré plutôt que la durée.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: tu l’as abaissé … au-dessous
  rationale: 'Le verbe a ici un sens causatif et comparatif : rendre inférieur ou placer plus bas. « Abaisser au-dessous de » exprime naturellement ce rapport en français.'
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom masculin singulier renvoie à la figure humaine du psaume. Le pronom français conserve cette référence sans ajouter un nom absent du grec.
- source_word: βραχύ τι
  choice: pour un peu de temps
  rationale: L’expression peut indiquer la durée ou le degré. La valeur temporelle convient particulièrement au développement de l’épître, tandis que l’autre possibilité est conservée en note.
- source_word: παρ’ ἀγγέλους
  choice: au-dessous des anges
  rationale: Après ἐλαττόω, παρά avec l’accusatif marque la comparaison. En français, « au-dessous des anges » s’accorde idiomatiquement avec « abaisser ».
- source_word: δόξῃ
  choice: de gloire
  rationale: Le datif indique ce dont la personne est couronnée. La construction française usuelle est « couronner de gloire ».
- source_word: τιμῇ
  choice: et d’honneur
  rationale: τιμή désigne ici l’honneur ou la dignité conférée. « Gloire et honneur » restitue avec précision l’association des deux termes.
- source_word: ἐστεφάνωσας
  choice: tu l’as couronné
  rationale: Le passé composé rend naturellement en français moderne l’aoriste grec dans cette citation, sans imposer une valeur aspectuelle supplémentaire.
- source_word: αὐτόν
  choice: l’
  rationale: Le second pronom objet est maintenu dans la seconde proposition conformément à la structure grecque.
theological_decisions:
- issue: Sens de βραχύ τι dans la citation du Psaume 8 appliquée dans Hébreux
  choice: 'Lecture temporelle : « pour un peu de temps »'
  alternative: 'Lecture de degré : « un peu au-dessous des anges »'
  rationale: Le grec permet les deux analyses. Dans le contexte d’Hébreux 2, la lecture temporelle s’accorde bien avec l’abaissement temporaire suivi de l’exaltation, mais la note préserve l’ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les verbes grecs à la deuxième personne du singulier. La formulation garde le parallélisme poétique de la citation et place le marqueur [a] immédiatement après l’expression ambiguë.
