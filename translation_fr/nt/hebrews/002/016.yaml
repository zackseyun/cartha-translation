source:
  edition: SBLGNT
  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: fr
  text: Car, assurément, ce ne sont pas les anges qu’il aide[a], mais la descendance d’Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il saisit » ou « qu’il prend » ; le verbe grec peut signifier littéralement « saisir, prendre ». Dans ce contexte, il exprime vraisemblablement l’idée de venir en aide ou de secourir.
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: bien sûr
  rationale: 'Cette expression rend la nuance emphatique et inférentielle du grec : l’affirmation est présentée comme évidente pour les destinataires.'
- source_word: ἀγγέλων
  choice: des anges
  rationale: Le génitif pluriel désigne la catégorie mise en contraste avec la descendance d’Abraham.
- source_word: ἐπιλαμβάνεται
  choice: vient aider
  rationale: Dans ce contexte, le verbe désigne vraisemblablement le fait de saisir quelqu’un pour lui porter secours. « Vient aider » exprime naturellement cette intervention secourable, tandis que le sens plus littéral est conservé en note.
- source_word: σπέρματος Ἀβραὰμ
  choice: la descendance d’Abraham
  rationale: Le nom collectif σπέρμα peut désigner la semence, la postérité ou les descendants. « La descendance » conserve une forme collective naturelle en français sans imposer un pluriel explicatif.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Car ... ce ne sont pas ... mais ...
  rationale: La construction française met nettement en relief le contraste entre les anges et la descendance d’Abraham.
theological_decisions:
- issue: Sens de ἐπιλαμβάνεται dans l’œuvre salvatrice du Fils
  choice: Le Fils vient en aide à la descendance d’Abraham plutôt qu’aux anges.
  alternative: Le Fils saisit ou prend en charge la descendance d’Abraham, formulation parfois comprise comme évoquant l’assomption de la nature humaine.
  rationale: Le contexte immédiat souligne la solidarité du Fils avec les humains et son action salvatrice. Le sens idiomatique « venir en aide » convient bien, mais le sens concret « saisir » demeure lexicalement possible et est donc signalé en note afin de préserver la tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Bien sûr » restitue l’emphase sans lourdeur ; « la descendance d’Abraham » reste collective et naturelle. Le pronom « il » conserve la continuité du contexte sans ajouter ici le nom du sujet.
