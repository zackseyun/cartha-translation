  terminology: « Anges » et « descendance d’Abraham » sont exacts. « Aide » est un bon rendu contextuel de ἐπιλαμβάνεται; l’alternative plus littérale doit rester formulée sans lui attribuer l’idée spécifique de prendre quelqu’un par la main. « Prend en charge » est trop interprétatif et est à retirer de la note.
