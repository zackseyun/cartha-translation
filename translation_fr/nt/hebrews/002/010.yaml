reference: Hebrews 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: fr
  text: En effet, il convenait à celui pour qui et par qui tout existe, en conduisant beaucoup de fils à la gloire, de mener à l’accomplissement, par les souffrances, le pionnier de leur salut.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Beaucoup de fils » reprend la formulation grecque et souligne la filiation ainsi que l’héritage ; l’expression englobe tous les enfants de Dieu, et pas seulement les hommes.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’initiateur », « le chef » ou « le fondateur » de leur salut.
    reason: lexical_alternative
  - marker: c
    text: « Mener à l’accomplissement » signifie ici amener au but prévu par les souffrances, et non corriger un défaut moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: il convenait
  rationale: Rend naturellement l’imparfait impersonnel de πρέπω et exprime ce qui était approprié au dessein de Dieu.
- source_word: αὐτῷ
  choice: celui
  rationale: Le pronom renvoie à Dieu dans le contexte; «celui» s’intègre naturellement aux deux relatives qui l’identifient.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: pour qui et par qui tout existe
  rationale: Distingue la finalité exprimée par δι’ ὃν de l’agence exprimée par δι’ οὗ, tout en restant idiomatique en français.
- source_word: πολλοὺς υἱοὺς
  choice: beaucoup de fils
  rationale: Conserve le terme filial masculin du grec et son arrière-plan de filiation et d’héritage; une note précise sa portée inclusive.
- source_word: εἰς δόξαν
  choice: à la gloire
  rationale: Exprime avec concision le mouvement vers la gloire indiqué par εἰς.
- source_word: ἀγαγόντα
  choice: en conduisant
  rationale: Préserve le lien participial avec τελειῶσαι sans imposer une valeur exclusivement finale qui n’est pas explicitement marquée.
- source_word: ἀρχηγὸν
  choice: le pionnier
  rationale: Évoque celui qui ouvre la voie et la parcourt en tête; le mot conserve les dimensions d’initiation et de direction propres à ἀρχηγός.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: de leur salut
  rationale: Rend directement et naturellement la construction génitive.
- source_word: διὰ παθημάτων
  choice: par les souffrances
  rationale: Conserve le pluriel concret de παθημάτων et la fonction de moyen ou de parcours exprimée par διά.
- source_word: τελειῶσαι
  choice: mène à l’accomplissement
  rationale: Rend l’idée d’amener au but prévu sans suggérer la correction d’un défaut moral; la tournure reste compatible avec l’usage cultuel et vocationnel du verbe dans Hébreux.
theological_decisions:
- issue: Sens de τελειῶσαι appliqué au pionnier du salut
  choice: mène à l’accomplissement
  alternative: rende parfait; mène à la perfection; consacre pleinement
  rationale: Le verbe indique ici l’aboutissement au but ou l’achèvement de la vocation par les souffrances, sans impliquer une déficience morale préalable. La traduction garde ouverte la portée fonctionnelle et cultuelle du terme dans Hébreux.
- issue: Portée de πολλοὺς υἱοὺς
  choice: beaucoup de fils
  alternative: beaucoup d’enfants
  rationale: «Fils» préserve la formulation grecque ainsi que les résonances de filiation et d’héritage, tandis qu’une note explicite que le groupe ne se limite pas aux hommes.
- issue: Relation syntaxique de ἀγαγόντα avec τελειῶσαι
  choice: en conduisant beaucoup de fils à la gloire
  alternative: afin de conduire beaucoup de fils à la gloire
  rationale: La construction participiale grecque ne spécifie pas sans ambiguïté une simple finalité. «En conduisant» conserve le rapport circonstanciel étroit sans le résoudre en proposition finale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’architecture solennelle du grec, avec une ponctuation qui clarifie les relatives. «Pionnier» est actuel et expressif; les principales possibilités sémantiques figurent en note.
