revisions:
- from: En effet, il convenait que celui pour qui et par qui tout existe, en conduisant beaucoup de fils à la gloire, mène à l’accomplissement, par les souffrances, le pionnier de leur salut.[a][b][c]
  to: En effet, il convenait à celui pour qui et par qui tout existe, en conduisant beaucoup de fils à la gloire, de mener à l’accomplissement, par les souffrances, le pionnier de leur salut.[a][b][c]
  rationale: La révision se limite à remplacer « il convenait que celui … mène » par « il convenait à celui … de mener ». Elle clarifie la syntaxe française tout en reflétant plus directement ἔπρεπεν αὐτῷ … τελειῶσαι. La relation participiale « en conduisant » est conservée, sans la réduire à une proposition de but. Une légère révision de ponctuation dans les notes améliore la typographie française sans modifier leur contenu.
