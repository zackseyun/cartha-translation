  source_fidelity: 'Le sens fondamental est fidèlement rendu : la double relation de toutes choses à Dieu (« pour qui » / « par qui »), la conduite de nombreux fils vers la gloire, l’ἀρχηγός du salut et l’accomplissement par les souffrances sont préservés. La valeur non exclusivement finale du participe ἀγαγόντα est aussi respectée par « en conduisant ».'
  naturalness: La formulation actuelle « il convenait que celui … mène » est grammaticalement possible, mais elle est sensiblement moins naturelle et rend moins clairement la construction grecque avec datif αὐτῷ et infinitif τελειῶσαι. En français moderne, « il convenait à celui … de mener » est plus idiomatique, plus net syntaxiquement et conserve la solennité du verset.
  terminology: « Pionnier » rend bien les dimensions d’initiateur et de guide d’ἀρχηγός. « Beaucoup de fils » conserve la désignation masculine υἱούς et ses résonances filiales; la note en explique adéquatement la portée. « Mener à l’accomplissement » est défendable pour τελειῶσαι et la note évite à juste titre de lui imposer l’idée d’une correction morale.
