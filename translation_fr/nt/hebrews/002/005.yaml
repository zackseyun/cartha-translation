id: HEB.2.5
reference: Hebrews 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: fr
  text: En effet, ce n’est pas à des anges qu’il a soumis le monde à venir, dont nous parlons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: En effet, ce n’est pas
  rationale: γάρ relie le verset à l’argument précédent en introduisant une explication; «En effet» rend ce lien naturellement, tandis que «ce n’est pas» porte clairement la négation.
- source_word: ἀγγέλοις
  choice: à des anges
  rationale: Dans le contexte immédiat de l’épître, il s’agit des êtres célestes, non de messagers humains.
- source_word: ὑπέταξεν
  choice: a soumis
  rationale: Le verbe exprime la mise sous autorité ou domination; «soumettre» conserve directement cette idée.
- source_word: τὴν οἰκουμένην
  choice: le monde
  rationale: οἰκουμένη peut désigner le monde habité; ici, «le monde» est naturel en français et reçoit sa précision eschatologique du participe qui suit.
- source_word: τὴν μέλλουσαν
  choice: à venir
  rationale: Le participe marque la réalité future; l’expression française consacrée et naturelle «le monde à venir» en préserve la portée sans préciser indûment sa nature.
- source_word: περὶ ἧς λαλοῦμεν
  choice: celui dont nous parlons
  rationale: Cette formulation moderne rattache sans ambiguïté la proposition au «monde à venir» et conserve le présent de l’échange en cours.
theological_decisions:
- issue: Référent du «monde à venir»
  choice: Une réalité mondiale ou un ordre futur, sans identification doctrinale plus précise
  alternative: La terre habitée en général, ou spécifiquement l’ère de l’Évangile
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν désigne naturellement le monde qui doit venir. La traduction conserve cette orientation eschatologique tout en laissant ouverte la définition exacte de cette réalité.
translation_notes:
  register: Français international moderne, digne et accessible. «En effet» explicite le lien argumentatif; la dislocation «ce n’est pas à des anges que…» reproduit l’accent mis sur les anges. Le démonstratif «celui» évite que la relative soit comprise comme portant sur les anges.
