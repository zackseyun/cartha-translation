source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: fr
  text: Comment échapperons-nous si nous négligeons un si grand salut ? Ce salut[a], qui a commencé par être proclamé par le Seigneur, nous a été confirmé par ceux qui l’avaient entendu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lequel, ayant commencé par être proclamé par le Seigneur, nous a été confirmé par ceux qui l’avaient entendu »'
    reason: Alternative syntaxique plus proche de la proposition relative grecque introduite par ἥτις, tout en conservant la valeur inchoative de ἀρχὴν λαβοῦσα λαλεῖσθαι.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: Comment échapperons-nous
  rationale: Conserve la question rhétorique au futur et sa forte valeur d’avertissement sans la transformer en affirmation explicite.
- source_word: τηλικαύτης ἀμελήσαντες σωτηρίας
  choice: si nous négligeons un si grand salut
  rationale: Le participe aoriste prend naturellement ici une valeur conditionnelle; « un si grand salut » garde l’emphase de τηλικαύτης.
- source_word: ἥτις
  choice: Ce salut
  rationale: La reprise nominale clarifie l’antécédent du relatif et rend la phrase naturelle en français; la construction relative plus formelle est signalée en note.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: annoncé d’abord
  rationale: Rend idiomatiquement l’expression inchoative « ayant reçu un commencement pour être dit », c’est-à-dire dont l’annonce a commencé, sans produire une formulation française pesante.
- source_word: διὰ τοῦ κυρίου
  choice: par le Seigneur
  rationale: Avec le passif « annoncé », le français emploie naturellement « par » pour l’agent; le titre « Seigneur » est conservé.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: par ceux qui l’avaient entendu
  rationale: Le plus-que-parfait situe leur audition avant la confirmation; le pronom « l’ » explicite sobrement que ces témoins avaient entendu le Seigneur.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: nous a été confirmé
  rationale: Formulation française naturelle qui conserve le passif et la transmission du message jusqu’aux destinataires.
theological_decisions:
- issue: Référent de τοῦ κυρίου
  choice: « le Seigneur » désigne Jésus, entendu par les témoins
  alternative: Une référence plus générale à Dieu comme Seigneur
  rationale: L’enchaînement entre l’annonce par le Seigneur et sa confirmation par ceux qui l’ont entendu renvoie fortement au ministère de Jésus, sans qu’il soit nécessaire d’ajouter son nom dans le texte.
- issue: Portée de la question d’avertissement
  choice: Maintien d’une question rhétorique au futur
  alternative: « Nous n’échapperons certainement pas si… »
  rationale: La forme interrogative grecque laisse subsister toute la tension de l’avertissement au lieu d’en faire une déclaration explicite.
- issue: Antécédent et structure de ἥτις
  choice: Reprise explicite par « Ce salut »
  alternative: « lequel, après avoir d’abord été annoncé… »
  rationale: La reprise est plus naturelle en français moderne tout en conservant le salut comme sujet de la proposition explicative; la structure relative possible est donnée en note.
translation_notes:
  register: Français international moderne, digne et direct. La virgule finale est maintenue parce que le verset se poursuit syntaxiquement en Hébreux 2.4. « Annoncé » est plus idiomatique que « dit » pour le message du salut, tandis que la note préserve la structure relative de l’original.
