id: HEB.2.15
reference: Hebrews 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: fr
  text: et libérer tous ceux qui, par peur de la mort, étaient toute leur vie assujettis à l’esclavage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: libérer
  rationale: Le verbe signifie délivrer ou affranchir d’un état contraignant. « Libérer » est naturel, précis et répond directement à l’image de l’esclavage.
- source_word: τούτους, ὅσοι
  choice: tous ceux qui
  rationale: Cette formulation française rend naturellement le démonstratif suivi du relatif et conserve la portée inclusive de ὅσοι.
- source_word: φόβῳ θανάτου
  choice: par peur de la mort
  rationale: « Par » laisse ouvertes les nuances de cause et de moyen du datif, tout en donnant une expression française courante.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: toute leur vie
  rationale: Cette expression idiomatique restitue clairement la durée entière de l’existence sans calquer lourdement le grec.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: étaient assujettis à l’esclavage
  rationale: ἔνοχος exprime ici l’état de personnes soumises ou tenues sous une domination. « Assujettis à l’esclavage » conserve à la fois la sujétion réelle et la force de δουλεία.
- source_word: δουλείας
  choice: esclavage
  rationale: Le terme désigne un état d’asservissement. « Esclavage » en préserve la force concrète mieux que « servitude », potentiellement plus atténué.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie directement cette proposition à celle du verset précédent.
theological_decisions:
- issue: Nature de l’esclavage associé à la peur de la mort
  choice: La traduction parle d’un esclavage réel lié à la peur de la mort, sans préciser davantage son mécanisme doctrinal.
  alternative: Expliciter un esclavage au diable, au péché ou à la condition mortelle.
  rationale: Bien que le contexte précédent mentionne le diable et la puissance de la mort, cette proposition dit seulement que ces personnes étaient assujetties à l’esclavage par peur de la mort. La formulation conserve cette tension sans ajouter un complément absent du grec.
translation_notes:
  register: Français international moderne, digne et accessible. « Assujettis » est soutenu mais courant dans ce contexte et maintient la relation explicite avec l’esclavage. Aucun appel de note n’est nécessaire.
