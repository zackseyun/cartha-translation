  source_fidelity: 'Le texte rend correctement la chaîne syntaxique grecque : « et » maintient le lien avec le verset précédent ; « libérer » traduit justement ἀπαλλάξῃ ; « tous ceux qui » exprime naturellement τούτους, ὅσοι ; « par peur de la mort » préserve la nuance causale/instrumentale de φόβῳ θανάτου ; et « toute leur vie » rend la durée de διὰ παντὸς τοῦ ζῆν. « Étaient … assujettis à l’esclavage » restitue de manière fidèle l’état de sujétion exprimé par ἔνοχοι ἦσαν δουλείας, sans en préciser indûment le mécanisme.'
