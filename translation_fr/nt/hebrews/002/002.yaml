reference: Hebrews 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: fr
  text: Car si le message prononcé par l’intermédiaire des anges s’est avéré solide[a], et si toute transgression et toute désobéissance ont reçu une juste rétribution[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement de la Loi, comprise dans la tradition juive comme ayant été transmise par l’intermédiaire des anges. Comparer Actes 7:53 et Galates 3:19.
    reason: cross_reference
  - marker: b
    text: Ou « une juste compensation » ou « une rétribution méritée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: le message prononcé par l’intermédiaire des anges
  rationale: « Message » rend λόγος comme une communication divine, tandis que « prononcé » reflète λαληθείς. « Par l’intermédiaire de » conserve la médiation exprimée par διά sans attribuer aux anges l’origine du message.
- source_word: ἀγγέλων
  choice: anges
  rationale: Le contexte d’Hébreux 2 et la tradition de la médiation de la Loi désignent vraisemblablement des êtres célestes, non de simples messagers humains.
- source_word: ἐγένετο βέβαιος
  choice: s’est révélé ferme
  rationale: 'Cette formulation garde la valeur résultative de l’expression : le message a montré son caractère établi, valide et effectif, sans réduire le sens à une simple confirmation intellectuelle.'
- source_word: πᾶσα παράβασις καὶ παρακοὴ
  choice: toute transgression et toute désobéissance
  rationale: « Transgression » exprime le franchissement d’une limite ou la violation d’un commandement; « désobéissance » rend la non-écoute impliquée par παρακοή. La répétition de « toute » restitue naturellement la portée distributive de πᾶσα sur les deux noms singuliers.
- source_word: ἔλαβεν
  choice: ont reçu
  rationale: Le verbe conserve l’image judiciaire selon laquelle chaque acte reçoit la conséquence qui lui revient. L’accord au pluriel est naturel en français avec les deux sujets coordonnés.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: une juste rétribution
  rationale: « Rétribution » préserve la notion de retour ou de paiement contenue dans μισθαποδοσία, tandis que « juste » rend ἔνδικον. Le contexte indique que cette rétribution est punitive sans obliger à remplacer le terme plus large par « châtiment ».
theological_decisions:
- issue: Nature du « message prononcé par l’intermédiaire des anges »
  choice: Conserver l’expression générale du grec dans le texte, avec une note signalant l’allusion probable à la Loi.
  alternative: Traduire explicitement « la Loi transmise par des anges ».
  rationale: Le contexte évoque très probablement la Loi du Sinaï selon la tradition juive, mais le grec dit seulement « le message ». La traduction ne doit pas rendre explicite ce que le texte laisse implicite.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure conditionnelle suspendue qui se poursuit au verset suivant. « Par l’intermédiaire de » est plus précis ici que le simple « par », et « rétribution » maintient la portée judiciaire tout en restant proche de l’image grecque de la contrepartie.
