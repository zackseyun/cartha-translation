id: HEB.2.14
reference: Hebrews 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: fr
  text: Ainsi donc, puisque les enfants ont en commun le sang et la chair[a], lui aussi a pris part, de manière semblable, aux mêmes réalités, afin que, par la mort, il réduise à l’impuissance celui qui détient le pouvoir de la mort, c’est-à-dire le diable[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit souvent : « la chair et le sang ». Le grec dit littéralement : « le sang et la chair ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il détruise ». Le verbe grec peut signifier « rendre impuissant », « rendre inopérant » ou « abolir », sans impliquer nécessairement l’anéantissement.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Ainsi donc, puisque
  rationale: « Ainsi donc » conserve la portée déductive de οὖν, tandis que « puisque » exprime la valeur causale de ἐπεί et rattache naturellement le verset au raisonnement précédent.
- source_word: τὰ παιδία
  choice: les enfants
  rationale: Rendu direct qui renvoie aux enfants mentionnés dans le contexte sans préciser davantage leur identité.
- source_word: κεκοινώνηκεν
  choice: ont en commun
  rationale: Le parfait exprime une participation dont l’état demeure. La tournure française actuelle « ont en commun » rend naturellement cette communauté de condition.
- source_word: αἵματος καὶ σαρκός
  choice: le sang et la chair
  rationale: Conserve l’ordre grec et le sens concret des deux noms. « Chair » désigne ici la réalité corporelle humaine, non une prétendue nature pécheresse.
- source_word: παραπλησίως
  choice: de manière semblable
  rationale: Exprime une ressemblance étroite sans transformer l’adverbe en affirmation d’identité absolue.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: a pris part aux mêmes réalités
  rationale: Distingue μετέχω du verbe κοινωνέω de la première proposition, tout en conservant leur parallélisme. « Réalités » reprend clairement le sang et la chair sans suggérer de simples objets.
- source_word: ἵνα
  choice: afin que
  rationale: Marque explicitement le but dans un registre français naturel et digne.
- source_word: διὰ τοῦ θανάτου
  choice: par la mort
  rationale: Rend la valeur instrumentale de διά avec le génitif de façon concise.
- source_word: καταργήσῃ
  choice: réduise à l’impuissance
  rationale: Exprime l’idée de priver d’efficacité ou de pouvoir sans laisser entendre l’anéantissement du diable.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: celui qui détient le pouvoir de la mort
  rationale: « Détient » rend ἔχοντα et « pouvoir » restitue clairement κράτος dans ce contexte, sans préciser au-delà du texte la nature ou les limites de ce pouvoir.
- source_word: τοῦτ’ ἔστι
  choice: c’est-à-dire
  rationale: Introduit naturellement en français l’identification explicative qui suit.
- source_word: τὸν διάβολον
  choice: le diable
  rationale: Correspond à l’appellation personnelle établie dans l’usage néotestamentaire plutôt qu’à une simple glose étymologique comme « le calomniateur ».
theological_decisions:
- issue: Participation du Christ à la condition humaine
  choice: « lui aussi a pris part, de manière semblable, aux mêmes réalités »
  alternative: « lui aussi a partagé leur humanité »
  rationale: La formulation suit les termes grecs, maintient le parallélisme avec les enfants et préserve la nuance de παραπλησίως sans importer une formulation doctrinale postérieure ni affaiblir la réalité de cette participation.
- issue: Effet de la mort du Christ sur le diable
  choice: « réduise à l’impuissance »
  alternative: « détruise » ou « rende inopérant »
  rationale: καταργέω peut signifier priver de force ou d’efficacité, abolir ou neutraliser. Le choix évite de trancher en faveur d’un anéantissement, tandis que la note conserve l’autre traduction traditionnelle possible.
- issue: Le pouvoir de la mort détenu par le diable
  choice: « celui qui détient le pouvoir de la mort »
  alternative: « celui qui exerçait l’empire de la mort »
  rationale: Le présent grec ἔχοντα est conservé et la formulation ne définit pas la source, l’étendue ni le caractère ultime de ce pouvoir, questions que le verset ne résout pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la longue progression argumentative du grec tout en restant lisible. L’ordre inhabituel « le sang et la chair » est maintenu dans le texte et expliqué en note; « réduire à l’impuissance » privilégie la précision sémantique sans imposer une conclusion doctrinale.
