id: HEB.2.12
reference: Hebrews 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: fr
  text: 'en disant : « J’annoncerai ton nom à mes frères[a] ; au milieu de l’assemblée[b], je chanterai tes louanges. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à mes frères et sœurs » ; le grec dit littéralement « frères », mais, dans ce contexte familial, le terme peut inclure tous les croyants.
    reason: lexical_alternative
  - marker: b
    text: Ou « au milieu de la communauté réunie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit directement la citation et se rend naturellement ainsi en français.
- source_word: Ἀπαγγελῶ
  choice: J’annoncerai
  rationale: Le verbe exprime une déclaration ouverte et publique ; « annoncer » conserve cette force sans alourdir le vers.
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: La formulation littérale est conservée ; dans l’usage biblique, le « nom » peut évoquer l’identité révélée, le caractère et la réputation, sans qu’il faille expliciter ces nuances dans le texte.
- source_word: τοῖς ἀδελφοῖς μου
  choice: à mes frères
  rationale: Le masculin pluriel du grec est préservé dans le texte principal. Le contexte familial peut inclure l’ensemble des croyants, ce qu’indique la note.
- source_word: ἐν μέσῳ
  choice: au milieu de
  rationale: Cette tournure assez littérale reste claire et maintient le registre poétique de la citation.
- source_word: ἐκκλησίας
  choice: l’assemblée
  rationale: Dans cette citation du Psaume 22, le mot désigne le peuple rassemblé. « Assemblée » évite d’introduire inutilement le sens institutionnel que peut prendre « Église ».
- source_word: ὑμνήσω σε
  choice: je chanterai tes louanges
  rationale: Cette expression française naturelle conserve explicitement l’idée d’une louange chantée portée par le verbe grec.
theological_decisions:
- issue: Portée familiale de ἀδελφοῖς
  choice: mes frères
  alternative: mes frères et sœurs
  rationale: Le texte principal conserve la forme masculine du grec, tandis qu’une note signale que, dans le contexte, le terme peut désigner tous les croyants, hommes et femmes.
- issue: Sens de ἐκκλησία dans une citation de l’Ancien Testament
  choice: l’assemblée
  alternative: la communauté réunie
  rationale: « Assemblée » représente le peuple de Dieu rassemblé sans imposer au passage une conception institutionnelle ultérieure de l’Église.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et le ton poétique de la citation sont préservés sans archaïsme.
