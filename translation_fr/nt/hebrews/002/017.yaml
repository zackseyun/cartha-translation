id: HEB.2.17
reference: Hebrews 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: fr
  text: C’est pourquoi il devait devenir en tout semblable à ses frères[a], afin de devenir un grand-prêtre miséricordieux et fidèle dans le service de Dieu, pour faire l’expiation des péchés du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à ses frères et sœurs » : le grec emploie le masculin pluriel « frères », terme familial qui peut inclure ici les hommes et les femmes.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut aussi évoquer le fait d’effacer les péchés ou d’apaiser Dieu à leur sujet.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de l’argument précédent.
- source_word: ὤφειλεν
  choice: il devait
  rationale: Exprime la nécessité liée au dessein salvateur sans suggérer à tort une contrainte extérieure.
- source_word: κατὰ πάντα
  choice: en tout
  rationale: Formulation idiomatique et ample qui conserve la portée globale de la ressemblance.
- source_word: τοῖς ἀδελφοῖς
  choice: à ses frères
  rationale: Conserve le pluriel familial masculin du grec et son lien avec le contexte; la portée potentiellement inclusive est signalée en note.
- source_word: ὁμοιωθῆναι
  choice: devenir semblable
  rationale: Rend le passif grec de manière naturelle tout en exprimant l’entrée réelle dans la condition humaine décrite par le contexte.
- source_word: ἵνα
  choice: afin de
  rationale: Exprime clairement le but.
- source_word: ἐλεήμων
  choice: miséricordieux
  rationale: Terme français courant dans un registre biblique digne, qui convient au contexte sacerdotal.
- source_word: πιστὸς
  choice: fidèle
  rationale: Préserve l’idée de fidélité et de fiabilité dans l’accomplissement de la charge sacerdotale.
- source_word: ἀρχιερεὺς
  choice: grand-prêtre
  rationale: Équivalent français standard du titre sacerdotal.
- source_word: τὰ πρὸς τὸν θεόν
  choice: dans le service de Dieu
  rationale: Rend naturellement l’expression idiomatique grecque désignant le domaine des fonctions sacerdotales orientées vers Dieu.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: pour faire l’expiation de
  rationale: Formulation accessible dans ce contexte cultuel; elle décrit le traitement sacerdotal des péchés sans imposer à elle seule une théorie précise de l’expiation.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: des péchés du peuple
  rationale: Reproduit clairement l’objet de l’acte sacerdotal et le génitif désignant le peuple concerné.
theological_decisions:
- issue: Sens de ἱλάσκεσθαι dans le contexte de l’expiation
  choice: faire l’expiation des péchés
  alternative: obtenir le pardon des péchés; apaiser Dieu au sujet des péchés
  rationale: « Faire l’expiation » convient au cadre sacerdotal et laisse ouverte la tension lexicale entre effacement des péchés et dimension propitiatoire; la note conserve les principales nuances.
- issue: Portée du terme familial ἀδελφοῖς
  choice: ses frères
  alternative: ses frères et sœurs
  rationale: Le texte principal garde la forme masculine plurielle du grec, tandis que la note indique qu’elle peut désigner l’ensemble de la famille concernée.
translation_notes:
  register: Français international moderne, digne et lisible. « Grand-prêtre » et « faire l’expiation » maintiennent le cadre cultuel; « dans le service de Dieu » évite le calque peu naturel « dans les choses relatives à Dieu ». Les deux notes préservent les ambiguïtés lexicale et théologique pertinentes.
