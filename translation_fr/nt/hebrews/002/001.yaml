  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: fr
  text: C’est pourquoi nous devons prêter une attention d’autant plus grande à ce que nous avons entendu, de peur que nous ne partions à la dérive[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « que nous ne passions à côté de ce que nous avons entendu » ; autre compréhension possible : « que nous ne laissions échapper ce que nous avons entendu ». Le verbe grec évoque l’idée de dériver, de passer à côté ou de laisser échapper quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Expression française naturelle qui marque clairement la conséquence tirée de l’argument précédent.
- source_word: δεῖ
  choice: nous devons
  rationale: Rend directement la nécessité exprimée par δεῖ et intègre naturellement ἡμᾶς comme sujet en français.
- source_word: περισσοτέρως
  choice: d’autant plus grande
  rationale: Conserve la valeur comparative et intensive de l’adverbe tout en formant une expression française idiomatique avec « attention ».
- source_word: προσέχειν ἡμᾶς
  choice: nous devons prêter une attention
  rationale: « Prêter attention » exprime clairement l’idée de diriger son esprit vers quelque chose et convient au ton exhortatif.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: à ce que nous avons entendu
  rationale: Formulation naturelle qui conserve le contenu indéterminé du participe substantivé et la pertinence présente de ce qui a été entendu.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Introduit en français soutenu mais courant le résultat redouté, sans transformer l’avertissement en affirmation certaine.
- source_word: παραρυῶμεν
  choice: nous ne partions à la dérive
  rationale: Préserve l’image d’un mouvement progressif et dangereux sans préciser au-delà du grec la nature doctrinale de cet éloignement.
theological_decisions:
- issue: Nature de l’avertissement imagé exprimé par παραρυῶμεν
  choice: Présenter les auditeurs comme risquant de « partir à la dérive »
  alternative: « passer à côté » ou comprendre que les choses entendues « nous échappent »
  rationale: La première personne du pluriel et le contexte d’exhortation favorisent l’image des auditeurs qui dérivent, mais le verbe autorise d’autres nuances. La note les conserve sans trancher une question doctrinale sur l’apostasie.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « de peur que… ne » maintient le ton solennel de l’avertissement sans archaïsme marqué ; le « ne » est explétif et n’ajoute pas une seconde négation.
