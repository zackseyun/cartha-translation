id: HEB.2.18
reference: Hebrews 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: fr
  text: En effet, puisqu’il a lui-même souffert lorsqu’il a été tenté[a], il peut venir en aide à ceux qui sont tentés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mis à l’épreuve » dans les deux cas : « puisqu’il a lui-même souffert lorsqu’il a été mis à l’épreuve, il peut venir en aide à ceux qui sont mis à l’épreuve ». Le verbe grec peut signifier « tenter » ou « mettre à l’épreuve », selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: puisque
  rationale: Cette expression a ici une valeur causale et introduit le fondement de la capacité du Fils à venir en aide aux autres. « Puisque » restitue cette relation clairement et naturellement en français.
- source_word: γὰρ
  choice: en effet
  rationale: La particule introduit une explication de l’affirmation précédente. « En effet » préserve ce lien sans redoubler maladroitement la valeur causale déjà exprimée par « puisque ».
- source_word: πέπονθεν
  choice: il a souffert
  rationale: Le parfait présente une souffrance réellement vécue dont la portée demeure. Le passé composé français exprime naturellement cette expérience accomplie et pertinente pour le présent.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom est emphatique et souligne que le Fils a personnellement connu cette souffrance.
- source_word: πειρασθείς
  choice: lorsqu’il a été tenté
  rationale: Le participe situe la souffrance dans l’expérience de la tentation ou de l’épreuve. « Tenté » convient au contexte et au parallèle d’Hébreux 4.15, tandis que « mis à l’épreuve » demeure une possibilité signalée en note.
- source_word: δύναται
  choice: il peut
  rationale: Cette formulation française naturelle exprime pleinement la capacité présente du Fils.
- source_word: τοῖς πειραζομένοις
  choice: ceux qui sont tentés
  rationale: Le participe présent désigne les personnes qui subissent actuellement la tentation ou l’épreuve. La tournure française conserve cette portée sans substantivation peu naturelle.
- source_word: βοηθῆσαι
  choice: venir en aide
  rationale: 'Cette expression rend le sens concret de βοηθέω : apporter du secours à quelqu’un qui en a besoin. Elle est claire, actuelle et digne.'
theological_decisions:
- issue: Sens de πειράζω appliqué à Jésus et aux croyants
  choice: être tenté
  alternative: être mis à l’épreuve
  rationale: « Être tenté » préserve le sens néotestamentaire courant et le lien avec Hébreux 4.15, sans suggérer que Jésus ait cédé au péché. Comme le verbe grec peut également désigner une mise à l’épreuve, cette autre lecture est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » assure le lien explicatif avec le verset précédent, tandis que « venir en aide » garde la dimension concrète du secours apporté.
