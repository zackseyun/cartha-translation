source:
  edition: SBLGNT
  text: καὶ πάλιν· Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ· καὶ πάλιν· Ἰδοὺ ἐγὼ καὶ τὰ παιδία ἅ μοι ἔδωκεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: fr
  text: 'Et encore : « Moi, je mettrai ma confiance en lui[a]. » Et encore : « Me voici, moi et les enfants que Dieu m’a donnés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je serai confiant en lui » ou « je serai dans la confiance en lui ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec ne nomme pas le locuteur de ces paroles; dans le contexte, l’épître les applique au Fils.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Et encore
  rationale: Cette formule introduit une nouvelle citation. Aucun verbe comme « il dit » n’est exprimé dans le grec, il n’est donc pas ajouté.
- source_word: Ἐγὼ
  choice: Moi, je
  rationale: Le pronom grec explicite est emphatique. « Moi, je » rend cette insistance de façon naturelle en français.
- source_word: ἔσομαι πεποιθὼς
  choice: je mettrai ma confiance
  rationale: La tournure périphrastique associe le futur de « être » au participe parfait de πείθω et exprime une attitude assurée de confiance. La formulation retenue est idiomatique tout en conservant l’orientation future.
- source_word: ἐπ’ αὐτῷ
  choice: en lui
  rationale: Avec « mettre sa confiance », le français emploie naturellement « en ». Le pronom masculin est conservé sans expliciter son référent.
- source_word: Ἰδοὺ
  choice: Me voici
  rationale: Dans cette construction avec le pronom de première personne, « Me voici » restitue naturellement la force présentative de ἰδού et garde le ton solennel de la citation.
- source_word: τὰ παιδία
  choice: les enfants
  rationale: Le terme désigne ici des enfants dans un rapport relationnel; « les enfants » est clair, naturel et suffisamment large.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: que Dieu m’a donnés
  rationale: Le relatif français « que » convient aux personnes comme aux choses et reprend « les enfants ». Le passé composé exprime naturellement en français le don accompli dont le résultat demeure pertinent; l’accord « donnés » suit la grammaire française.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction française habituelle de θεός; l’article grec n’exige pas ici d’article devant le nom propre en français.
theological_decisions:
- issue: Voix christologique des citations
  choice: Conserver les citations à la première personne sans nommer le locuteur dans le texte principal.
  alternative: Ajouter « il dit », « le Fils dit » ou « le Messie dit ».
  rationale: Dans le contexte, l’auteur de l’épître applique ces paroles au Fils, mais le grec du verset ne nomme pas le locuteur. La traduction laisse donc le contexte porter cette identification sans l’insérer dans le texte.
- issue: Référent du pronom αὐτῷ
  choice: Traduire simplement par « lui ».
  alternative: Expliciter « Dieu ».
  rationale: Même si le contexte permet de comprendre le référent, le grec emploie un pronom. Le conserver respecte la formulation de la citation et évite de lever une implicitation du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Les deux « Et encore » maintiennent la structure répétée du grec. « Moi, je » et « Me voici, moi » préservent l’insistance des pronoms explicites sans ajouter d’identification interprétative.
