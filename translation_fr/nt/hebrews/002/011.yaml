id: HEB.2.11
reference: Hebrews 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: fr
  text: En effet, celui qui sanctifie et ceux qui sont sanctifiés sont tous issus d’un seul[a]. C’est pourquoi il n’a pas honte de les appeler ses frères[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « issus d’un seul Père », « d’une même origine » ou « d’un même ancêtre ». Le grec ne précise pas à qui ou à quoi renvoie « un seul ».
    reason: alternative_reading
  - marker: b
    text: Le grec emploie le masculin pluriel « frères » ; dans ce contexte, ce terme peut désigner l’ensemble de la famille des croyants, femmes comprises.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: celui qui sanctifie
  rationale: Le participe présent actif substantivé désigne celui qui accomplit l’action. « Sanctifie » conserve le terme théologique établi tout en restant compréhensible.
- source_word: οἱ ἁγιαζόμενοι
  choice: ceux qui sont sanctifiés
  rationale: Le participe présent passif peut exprimer une action en cours ou un état. Cette formulation française naturelle conserve le lien lexical avec « sanctifie » sans imposer plus fortement que le grec l’idée d’un processus progressif.
- source_word: ἐξ ἑνὸς
  choice: issus d’un seul
  rationale: Le grec ne précise pas le référent de « un ». « Issus d’un seul » préserve cette indétermination tout en exprimant naturellement en français l’idée d’une origine commune.
- source_word: πάντες
  choice: tous
  rationale: Le terme englobe à la fois celui qui sanctifie et ceux qui sont sanctifiés et conserve leur inclusion commune.
- source_word: δι’ ἣν αἰτίαν
  choice: C’est pourquoi
  rationale: Cette tournure française rend naturellement la conséquence introduite par l’expression grecque.
- source_word: οὐκ ἐπαισχύνεται
  choice: il n’a pas honte
  rationale: Rendu idiomatique qui préserve la nuance d’honneur et de honte du verbe grec.
- source_word: ἀδελφοὺς αὐτοὺς καλεῖν
  choice: de les appeler ses frères
  rationale: « Ses frères » est la formulation française naturelle dans ce contexte familial; le masculin pluriel du grec est maintenu, avec une note sur sa portée contextuelle possible.
theological_decisions:
- issue: Référent de ἐξ ἑνὸς et identité du sujet implicite de « il »
  choice: Le texte garde « un seul » sans en préciser le référent; « il » renvoie contextuellement à celui qui sanctifie, le Fils.
  alternative: « issus d’un seul Père », « issus d’une même origine » ou « issus d’un même ancêtre »
  rationale: Le contexte permet d’identifier celui qui sanctifie au Fils, mais le grec ne dit pas si « un seul » désigne Dieu, un ancêtre ou une origine commune. La traduction conserve cette tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le vocabulaire de la sanctification ainsi que l’ambiguïté de l’origine commune. La ponctuation finale maintient le lien syntaxique avec le verset suivant.
