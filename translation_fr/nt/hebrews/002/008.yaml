    issue: La proposition finale « nous ne voyons pas encore que tout lui soit soumis » emploie une subordonnée au subjonctif qui ne rend pas aussi nettement le participe parfait passif ὑποτεταγμένα.
    rationale: Le grec dit littéralement que « toutes choses » ne sont pas encore vues comme étant dans l’état d’avoir été soumises à lui. La tournure infinitive française « voir tout lui être soumis » préserve mieux cet état et évite une nuance modalisante inutile.
