id: HEB.2.8
reference: Hebrews 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: fr
  text: « Tu as tout soumis sous ses pieds. » En effet, en lui soumettant tout[a], Dieu n’a rien laissé qui ne lui soit soumis[b]. Pourtant, maintenant, nous ne voyons pas encore tout lui être soumis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les pronoms « ses » et « lui » reprennent le Psaume 8. Dans son sens premier, le psaume peut désigner l’humanité ; dans l’application qu’en fait l’épître aux Hébreux, ils peuvent désigner Jésus.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction possible : « En effet, lorsqu’il lui a soumis toutes choses ». La construction grecque peut recevoir un sens plus nettement temporel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale. « Tout » est naturel en français et conserve cette universalité.
- source_word: ὑπέταξας
  choice: tu as soumis
  rationale: L’aoriste actif reprend le langage du Psaume 8; « soumettre » préserve le champ lexical de la subordination.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: sous ses pieds
  rationale: Expression française consacrée et naturelle pour évoquer la domination, tout en maintenant l’allusion scripturaire.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: en lui soumettant
  rationale: Cette formulation garde la valeur circonstancielle, ici explicative, de la construction grecque sans exclure sa nuance temporelle.
- source_word: γὰρ
  choice: en effet
  rationale: Introduit l’explication de la citation précédente avec un enchaînement argumentatif naturel en français.
- source_word: οὐδὲν ἀφῆκεν
  choice: n’a rien laissé
  rationale: Rend directement l’expression grecque et souligne l’absence de toute exception.
- source_word: ἀνυπότακτον
  choice: qui ne lui soit soumis
  rationale: Formulation idiomatique qui conserve la répétition du champ lexical de ὑποτάσσω.
- source_word: νῦν δὲ
  choice: pourtant, maintenant
  rationale: Marque clairement le contraste entre l’affirmation scripturaire et ce qui est actuellement observable.
- source_word: οὔπω ὁρῶμεν
  choice: nous ne voyons pas encore
  rationale: Reproduit naturellement l’idée d’un accomplissement qui n’est pas encore visible.
- source_word: ὑποτεταγμένα
  choice: soit soumis
  rationale: Dans la construction avec « voir que », le subjonctif français exprime naturellement l’état résultant visé par le parfait passif grec.
theological_decisions:
- issue: Référent de αὐτοῦ / αὐτῷ
  choice: Conserver les pronoms « ses » et « lui », avec une note qui expose la double portée contextuelle.
  alternative: Expliciter « l’être humain » ou « Jésus » dans le corps du texte.
  rationale: Le Psaume 8 parle d’abord de l’être humain, tandis que l’épître applique son propos de manière culminante à Jésus. Ne pas remplacer les pronoms préserve la progression et la tension théologique du passage.
- issue: Sujet implicite de ἀφῆκεν
  choice: Expliciter « Dieu ».
  alternative: Employer seulement « il », au risque d’une ambiguïté référentielle peu naturelle en français.
  rationale: Dans l’argument, celui qui soumet toutes choses est Dieu. L’explicitation clarifie la syntaxe française sans trancher le référent du pronom αὐτῷ.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « soumettre » est volontaire afin de refléter le réseau lexical grec. La citation conserve le tutoiement adressé à Dieu, conformément à la forme du Psaume 8.
