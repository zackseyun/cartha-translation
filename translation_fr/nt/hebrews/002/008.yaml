  verdict: revise
  source_fidelity: Le sens général et le réseau lexical de ὑποτάσσω sont bien rendus. Toutefois, la dernière proposition grecque est une construction « voir + objet + participe » et désigne l’état présent résultant de la soumission (ὑποτεταγμένα). La formulation française proposée avec « que tout lui soit soumis » est moins directe et son subjonctif peut affaiblir cet énoncé d’état.
  naturalness: Le français est globalement clair et d’un registre approprié. « Nous ne voyons pas encore tout lui être soumis » est à la fois plus idiomatique dans ce contexte et plus proche de la syntaxe et de l’aspect du grec.
  terminology: « Soumis » et « soumettre » conservent de façon cohérente la répétition lexicale du texte grec. Les pronoms sont justement maintenus sans imposer l’identification du bénéficiaire de la soumission.
  issues:
