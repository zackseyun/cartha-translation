source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: fr
  text: Mais vous vous êtes approchés du mont Sion, de la cité du Dieu vivant, la Jérusalem céleste, et de myriades[a] d’anges réunis en assemblée de fête[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Myriades » peut désigner des dizaines de milliers ou, plus généralement, une multitude innombrable.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de myriades d’anges, d’une assemblée de fête ». La syntaxe grecque permet de rattacher « assemblée de fête » soit aux anges, soit à un nouvel élément de l’énumération.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque l’opposition forte avec l’approche du Sinaï décrite dans le contexte précédent.
- source_word: προσεληλύθατε
  choice: vous vous êtes approchés
  rationale: Le parfait exprime une approche accomplie dont le résultat demeure; le passé composé français en conserve naturellement la portée présente.
- source_word: Σιὼν ὄρει
  choice: du mont Sion
  rationale: Le datif régi par προσέρχομαι est rendu par «de» après «s’approcher»; «mont Sion» est la formulation française usuelle.
- source_word: πόλει θεοῦ ζῶντος
  choice: de la cité du Dieu vivant
  rationale: Le génitif marque ici l’appartenance, et «Dieu vivant» conserve l’expression biblique forte. «Cité» maintient un registre élevé sans être archaïque.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: la Jérusalem céleste
  rationale: L’expression est en apposition à «la cité du Dieu vivant» et rend directement l’adjectif ἐπουράνιος.
- source_word: μυριάσιν ἀγγέλων
  choice: de myriades d’anges
  rationale: «Myriades» garde à la fois l’idée de dizaines de milliers et celle d’une multitude innombrable, tout en préservant le registre élevé.
- source_word: πανηγύρει
  choice: en assemblée de fête
  rationale: Le nom désigne un rassemblement public et festif. Cette formulation le rattache naturellement aux anges sans effacer la possibilité d’une autre analyse syntaxique.
theological_decisions:
- issue: Relation syntaxique de πανηγύρει
  choice: 'Le rattacher aux anges: «des myriades d’anges en assemblée de fête»'
  alternative: 'En faire un élément distinct de l’énumération: «des myriades d’anges, d’une assemblée de fête»; il peut aussi être coordonné à l’assemblée des premiers-nés au verset 23.'
  rationale: Le rattachement au groupe immédiatement précédent donne un sens cohérent et naturel, mais la série de datifs grecque demeure ambiguë; l’autre lecture est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et lisible. «Cité» et «myriades» maintiennent le relief solennel du passage sans archaïsme. La répétition de «de» rend clairement la série des compléments régis par «vous vous êtes approchés».
