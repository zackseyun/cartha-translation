id: HEB.12.18
reference: Hebrews 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: fr
  text: En effet, vous ne vous êtes approchés ni de ce qu’on peut toucher[a], ni d’un feu ardent, ni de l’obscurité, ni des ténèbres, ni d’une tempête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une montagne que l’on peut toucher ». Le contexte renvoie au mont Sinaï, mais le mot « montagne » n’est pas exprimé dans le texte grec de ce verset.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: En effet, vous ne… ni
  rationale: « En effet » rend la valeur explicative de γάρ. La négation grecque portant sur toute l’énumération est exprimée naturellement en français par « ne… ni ».
- source_word: προσεληλύθατε
  choice: vous ne vous êtes approchés
  rationale: Le passé composé rend le parfait grec et son résultat présent, tandis que « s’approcher » conserve l’image d’un accès à une réalité sacrée.
- source_word: ψηλαφωμένῳ
  choice: de ce qu’on peut toucher
  rationale: Le participe désigne ici une réalité tangible sans nommer explicitement une montagne. Cette formulation préserve l’indétermination du grec.
- source_word: κεκαυμένῳ πυρί
  choice: d’un feu ardent
  rationale: Cette expression française naturelle communique l’état d’un feu qui brûle avec intensité.
- source_word: γνόφῳ
  choice: de l’obscurité
  rationale: Le terme évoque une obscurité épaisse. « Obscurité » permet de le distinguer du terme suivant tout en conservant leur accumulation rhétorique.
- source_word: ζόφῳ
  choice: des ténèbres
  rationale: « Ténèbres » exprime le caractère profond et menaçant de cette noirceur et forme un couple distinct avec « obscurité ».
- source_word: θυέλλῃ
  choice: d’une tempête
  rationale: « Tempête » est le terme moderne et courant pour une violente perturbation atmosphérique.
theological_decisions:
- issue: Faut-il expliciter « la montagne » comme objet de l’approche ?
  choice: Ne pas ajouter « montagne » dans le texte principal ; conserver une réalité tangible non précisée.
  alternative: « d’une montagne que l’on peut toucher »
  rationale: Le Sinaï est impliqué par le contexte, mais le nom ὄρος (« montagne ») ne figure pas dans le texte grec de ce verset. La traduction principale évite donc de résoudre ce que le grec laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. La série « ne… ni… ni… » transpose naturellement la négation suivie des καί répétés, tout en conservant le rythme solennel de l’énumération.
