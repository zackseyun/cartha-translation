id: HEB.12.10
reference: Hebrews 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: fr
  text: En effet, eux nous imposaient leur discipline pour quelques jours[a], selon ce qui leur semblait bon[b] ; mais lui nous discipline pour notre bien, afin que nous ayons part à sa sainteté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour peu de temps ».'
    reason: La locution grecque peut désigner idiomatiquement une courte période, tout en évoquant littéralement « quelques jours ».
  - marker: b
    text: 'Ou : « selon ce qu’ils jugeaient bon » ou « selon ce qui leur paraissait juste ».'
    reason: Le grec met l’accent sur l’appréciation subjective des pères terrestres, sans nécessairement valider leur jugement.
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: pour quelques jours
  rationale: Cette formulation conserve l’image temporelle grecque et souligne la durée limitée de la discipline exercée par les pères terrestres.
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: selon ce qui leur semblait bon
  rationale: Le grec renvoie à leur propre appréciation de ce qui convenait, sans affirmer que leur jugement était nécessairement juste.
- source_word: ἐπαίδευον
  choice: nous imposaient leur discipline
  rationale: Dans le contexte, παιδεύω désigne la formation et la correction parentales, et non le seul châtiment. Cette tournure est plus naturelle en français moderne que « nous disciplinaient ».
- source_word: ὁ δὲ
  choice: mais lui nous discipline
  rationale: Le sujet implicite est Dieu. Le pronom « lui » maintient l’implicite du grec tout en marquant nettement le contraste avec les pères terrestres.
- source_word: ἐπὶ τὸ συμφέρον
  choice: pour notre bien
  rationale: La formule exprime que la discipline divine vise ce qui nous est réellement bénéfique.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: afin que nous ayons part à
  rationale: Cette traduction naturelle conserve la valeur de but de la construction grecque et le sens de participation de μεταλαμβάνω.
- source_word: ἁγιότητος αὐτοῦ
  choice: sa sainteté
  rationale: « Sainteté » rend directement la qualité divine désignée par ἁγιότης, tandis que le possessif conserve la formulation pronominale du grec.
theological_decisions:
- issue: Référent du sujet singulier contrastif ὁ δὲ
  choice: Le sujet est Dieu, désigné par « lui » plutôt que nommé explicitement.
  alternative: Traduire explicitement « mais Dieu » pour faciliter la compréhension hors contexte.
  rationale: Hébreux 12.5-11 établit clairement le contraste entre les pères terrestres et Dieu comme Père. La formulation pronominale reste intelligible tout en respectant l’implicite grec.
- issue: Participation à « sa sainteté »
  choice: Conserver l’idée d’avoir part à la sainteté de Dieu sans en préciser le mécanisme doctrinal.
  alternative: Limiter l’expression soit à un statut de sainteté déjà accordé, soit à un processus progressif de sanctification.
  rationale: Le verset présente cette participation comme le but de la discipline divine, mais ne définit pas ici précisément ses modalités. La traduction préserve cette tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Imposer leur discipline » rend naturellement la dimension parentale de παιδεύω ; la reprise « lui nous discipline » maintient le contraste et explicite en français l’action sous-entendue dans le second membre.
