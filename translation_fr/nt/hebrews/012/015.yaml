  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: fr
  text: Veillez à ce que personne ne soit privé de la grâce de Dieu[a], à ce qu’aucune racine d’amertume, en poussant, ne cause du trouble et que, par elle, beaucoup ne soient souillés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne manque d’obtenir la grâce de Dieu ». L’expression grecque peut désigner le fait de ne pas atteindre ce qui est offert aussi bien que celui d’en être privé.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « racine d’amertume » fait probablement écho à Deutéronome 29.18, où une racine produisant du poison symbolise une infidélité à l’alliance qui se propage au sein de la communauté.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Veillez attentivement
  rationale: Le participe présent exprime une vigilance active exercée au sein de la communauté. L’impératif français s’intègre naturellement à l’exhortation du contexte.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: à ce que personne ne passe à côté de la grâce de Dieu
  rationale: L’expression grecque peut évoquer le fait de ne pas atteindre ce qui est offert ou d’en être privé. « Passer à côté de » conserve l’idée d’un manquement sans trancher les débats doctrinaux sur l’apostasie ou la persévérance.
- source_word: χάριτος
  choice: grâce
  rationale: « Grâce » est le terme français courant qui préserve ici la portée théologique et relationnelle de χάρις.
- source_word: ῥίζα πικρίας
  choice: racine d’amertume
  rationale: Cette traduction proche du grec maintient l’image végétale et l’écho probable à Deutéronome 29.17 selon la numérotation française courante (29.18 dans certaines traditions).
- source_word: ἄνω φύουσα
  choice: ne pousse
  rationale: Le verbe décrit une racine qui germe et croît vers le haut. « Pousser » rend l’image de manière simple et naturelle en français.
- source_word: ἐνοχλῇ
  choice: ne cause du trouble
  rationale: Le verbe désigne le fait de troubler, gêner ou perturber; cette formulation conserve sa portée communautaire.
- source_word: δι’ αὐτῆς
  choice: par elle
  rationale: Le pronom féminin renvoie le plus naturellement à la « racine » et διά exprime ici le moyen ou l’intermédiaire.
- source_word: μιανθῶσιν πολλοί
  choice: beaucoup ne soient souillés
  rationale: « Souillés » conserve la forte connotation morale ou cultuelle de μιαίνω, plutôt que de réduire l’effet à une simple perturbation sociale.
theological_decisions:
- issue: La nature du manquement par rapport à la grâce de Dieu
  choice: ne passe à côté de la grâce de Dieu
  alternative: ne manque d’obtenir la grâce de Dieu; ne soit privé de la grâce de Dieu
  rationale: Le grec permet de comprendre qu’une personne n’atteint pas ce qui lui est offert ou qu’elle se trouve privée de la grâce. La formulation choisie maintient l’avertissement sans décider si le texte décrit précisément une grâce jamais reçue, une perte du salut ou une exclusion communautaire.
- issue: La force de la souillure produite dans la communauté
  choice: soient souillés
  alternative: soient contaminés; soient corrompus
  rationale: Le verbe grec porte une charge morale ou cultuelle forte. « Souillés » préserve cette gravité ainsi que le registre biblique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « à ce que » garde la structure exhortative, tandis que « racine d’amertume », « grâce » et « souillés » préservent les images et le registre bibliques sans archaïsme excessif.
