reference: Hebrews 12:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: fr
  text: Veillez à ne pas refuser celui qui parle. En effet, si ceux qui ont refusé celui qui les avertissait sur la terre[a] n’ont pas échappé, à plus forte raison n’échapperons-nous pas, nous, si nous nous détournons de celui qui parle depuis les cieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut désigner une instruction ou un avertissement communiqué avec une autorité divine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à plus forte raison, nous qui nous détournons de celui qui est depuis les cieux » ; le grec sous-entend ici le verbe « échapper » employé dans la proposition précédente. L’activité de parole est comprise par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Veillez à
  rationale: L’impératif pluriel introduit une exhortation pressante. « Veillez à » en rend naturellement la force sans ajouter l’idée plus alarmiste de « prenez garde ».
- source_word: μὴ παραιτήσησθε
  choice: ne pas refuser
  rationale: παραιτέομαι signifie ici refuser ou rejeter. « Refuser » convient à une parole adressée aux auditeurs et permet de reprendre le même verbe dans la proposition suivante.
- source_word: τὸν λαλοῦντα
  choice: celui qui parle
  rationale: Le participe présent évoque une parole en cours. Cette formulation garde cette immédiateté sans préciser explicitement l’identité du locuteur.
- source_word: ἐξέφυγον
  choice: n’ont pas échappé
  rationale: Le verbe exprime le fait d’échapper aux conséquences ou au jugement. Le complément demeure implicite comme en grec.
- source_word: ἐπὶ γῆς
  choice: sur la terre
  rationale: Cette traduction conserve le contraste spatial avec ἀπ’ οὐρανῶν sans identifier plus précisément le lieu à la montagne du Sinaï.
- source_word: παραιτησάμενοι
  choice: ceux qui ont refusé
  rationale: Le participe aoriste est rendu par une proposition relative naturelle en français et maintient la répétition lexicale avec « ne pas refuser ».
- source_word: χρηματίζοντα
  choice: celui qui les avertissait
  rationale: Dans ce contexte, χρηματίζω désigne une communication faisant autorité, notamment un avertissement divin. « Les » explicite l’objet sous-entendu nécessaire en français.
- source_word: πολὺ μᾶλλον
  choice: à plus forte raison
  rationale: Cette locution française exprime clairement l’argument du moindre au plus grand dans une phrase négative.
- source_word: ἀποστρεφόμενοι
  choice: si nous nous détournons
  rationale: Le participe qualifie « nous » et indique la situation dans laquelle l’avertissement s’applique. La tournure conditionnelle rend l’ellipse intelligible en français sans transformer le propos en affirmation que tous se détournent effectivement.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: celui qui parle depuis les cieux
  rationale: Le grec dit littéralement « celui qui vient/est depuis les cieux », avec l’activité de parole ou d’avertissement comprise par le contexte. « Parle » reprend le début du verset tout en conservant le contraste entre la terre et les cieux.
theological_decisions:
- issue: Identité de celui qui parle et avertit
  choice: Employer les descriptions génériques « celui qui parle » et « celui qui les avertissait » sans ajouter « Dieu » ou « Christ ».
  alternative: Identifier explicitement Dieu comme locuteur, ou identifier le locuteur céleste au Christ.
  rationale: Le contexte implique une parole divine, mais le verset lui-même ne donne ici ni nom ni titre. La formulation retenue préserve cette réserve et laisse le contexte guider l’identification.
- issue: Ellipse du verbe dans la seconde partie de la comparaison
  choice: Répéter explicitement « n’échapperons-nous pas » en français.
  alternative: 'Conserver une construction littérale elliptique : « à plus forte raison, nous qui nous détournons… »'
  rationale: Le grec sous-entend ἐξέφυγον dans la seconde proposition. Le rétablissement du verbe est nécessaire à une phrase française claire et ne modifie pas la portée de l’avertissement.
- issue: Valeur du participe ἀποστρεφόμενοι
  choice: Le rendre par « si nous nous détournons ».
  alternative: 'Le rendre de manière descriptive : « nous qui nous détournons ».'
  rationale: La tournure conditionnelle fait ressortir la logique de l’avertissement sans affirmer au-delà du texte que l’auteur et tous ses destinataires se détournent déjà du locuteur céleste.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « refuser » reflète celle du grec ; « à plus forte raison » rend naturellement le raisonnement comparatif. « Les cieux » conserve le pluriel formel de ἀπ’ οὐρανῶν, tandis que les notes signalent les principales ambiguïtés lexicales et syntaxiques.
