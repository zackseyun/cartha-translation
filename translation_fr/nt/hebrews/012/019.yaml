source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: fr
  text: ni au son d’une trompette, ni à une voix qui prononçait des paroles. Ceux qui l’entendirent[a] supplièrent qu’aucune parole ne leur soit plus adressée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, si le pronom grec renvoie plus largement à l’ensemble de la manifestation du Sinaï : « Ceux qui entendirent cela supplièrent qu’aucune parole ne leur soit plus adressée. »'
    reason: alternative_reading
  - marker: b
    text: Voir Exode 20.18-19 et Deutéronome 5.23-27, où les Israélites demandent à ne plus entendre directement la voix de Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: au son d’une trompette
  rationale: Cette formulation rend directement le phénomène sonore exprimé par ἦχος et conserve l’image concrète de la trompette sans préciser une intensité que le grec ne formule pas.
- source_word: φωνῇ ῥημάτων
  choice: à une voix porteuse de paroles
  rationale: La tournure garde le caractère inhabituel et saisissant de l’expression grecque tout en restant intelligible en français. Elle indique qu’il s’agit d’une parole articulée, et non d’un simple bruit, sans ajouter explicitement un verbe comme « prononcer ».
- source_word: ἧς
  choice: l’
  rationale: Dans « ceux qui l’entendirent », le pronom renvoie le plus naturellement à la voix, antécédent féminin singulier le plus proche. Une note conserve la possibilité d’un renvoi plus large à la manifestation du Sinaï.
- source_word: οἱ ἀκούσαντες
  choice: ceux qui l’entendirent
  rationale: Cette formulation naturelle restitue précisément le participe substantivé et identifie les Israélites comme les personnes ayant entendu.
- source_word: παρῃτήσαντο
  choice: supplièrent
  rationale: Dans ce contexte, le verbe exprime une demande pressante visant à ne plus subir une adresse divine directe. « Supplièrent » en rend l’urgence mieux que le simple « demandèrent ».
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: qu’aucune parole de plus ne leur soit adressée
  rationale: La formulation exprime clairement l’idée idiomatique de ne rien ajouter davantage, préserve le passif du grec et maintient λόγος sous la forme « parole ».
- source_word: καὶ … καὶ
  choice: ni … ni
  rationale: Les coordinations poursuivent en français la série négative commencée au verset précédent par l’idée de ne pas s’être approché de ces réalités. « Ni … ni » rend naturellement cette portée syntaxique dans le contexte.
theological_decisions:
- issue: Référent de ἧς
  choice: Le pronom est rattaché directement à « une voix porteuse de paroles ».
  alternative: Le relatif peut englober plus largement toute la manifestation sonore du Sinaï, notamment le son de la trompette et la voix.
  rationale: L’accord féminin singulier et la proximité grammaticale favorisent φωνή comme antécédent. Toutefois, le contexte permet de comprendre que les Israélites ont reculé devant l’ensemble de la manifestation; cette possibilité est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Voix porteuse de paroles » conserve volontairement une légère étrangeté correspondant à l’expression grecque, tandis que la seconde phrase emploie une syntaxe française claire. Les deux « ni » dépendent de la négation et de l’énumération commencées au verset 18.
