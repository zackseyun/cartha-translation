  source_fidelity: 'Le sens général est bien rendu : la série négative dépend du contexte du verset précédent, et la demande qu’aucune parole supplémentaire ne soit adressée aux auditeurs correspond à μὴ προστεθῆναι αὐτοῖς λόγον. Toutefois, « voix porteuse de paroles » est une formulation moins directe et moins idiomatique pour φωνῇ ῥημάτων. La note a décrit en outre une alternative qui transforme indûment la demande de ne plus recevoir de parole en une demande que la manifestation cesse de s’adresser à eux.'
  naturalness: « Au son d’une trompette » est naturel. « Une voix qui prononçait des paroles » conserve l’effet concret de l’expression grecque tout en étant idiomatique en français moderne. La séparation en deux phrases est acceptable et permet à « l’ » de renvoyer clairement à la voix.
  terminology: « Trompette », « voix », « paroles » et « adressée » conviennent au registre solennel et accessible. « Supplièrent » rend de façon recevable la force contextuelle de παρῃτήσαντο sans imposer une interprétation doctrinale.
