id: HEB.12.9
reference: Hebrews 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: fr
  text: De plus, nous avions nos pères selon la chair[a] comme éducateurs[b], et nous les respections. Ne nous soumettrons-nous pas bien davantage au Père des esprits[c], et ne vivrons-nous pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les pères de notre chair » ; on pourrait aussi traduire : « nos pères humains ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui nous disciplinaient » ou « ceux qui nous corrigeaient ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression « Père des esprits » peut désigner plus précisément le Père de nos esprits, par contraste avec nos pères humains ; le grec conserve toutefois une portée plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: De plus
  rationale: Le terme ajoute un nouvel élément au raisonnement a fortiori plutôt qu’il ne marque simplement une succession chronologique.
- source_word: τοὺς τῆς σαρκὸς ἡμῶν πατέρας
  choice: nos pères selon la chair
  rationale: Cette formulation naturelle mais proche du grec désigne les pères liés à notre existence corporelle et préserve le contraste explicite avec le « Père des esprits », sans donner à σάρξ le sens de nature pécheresse.
- source_word: παιδευτὰς
  choice: éducateurs
  rationale: Le nom désigne ceux qui forment par l’éducation et la discipline. « Éducateurs » maintient ce champ sémantique sans suggérer uniquement une fonction punitive.
- source_word: ἐνετρεπόμεθα
  choice: nous les respections
  rationale: Dans ce contexte, le verbe exprime la déférence ou le respect accordé aux pères qui exercent la discipline.
- source_word: οὐ πολὺ μᾶλλον
  choice: Ne devons-nous pas, à bien plus forte raison
  rationale: Cette tournure française restitue clairement la question rhétorique et la progression du moindre au plus grand.
- source_word: ὑποταγησόμεθα
  choice: nous soumettre
  rationale: Le futur passif grec a ici le sens de se placer sous l’autorité de quelqu’un ; « nous soumettre » est idiomatique et conserve cette portée.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: au Père des esprits
  rationale: La traduction garde la construction large du grec sans préciser qu’il s’agit seulement de « nos » esprits ni de tous les êtres spirituels.
- source_word: ζήσομεν
  choice: et vivre
  rationale: L’infinitif coordonné après « devons-nous » rend naturellement en français la conséquence exprimée par le futur grec.
theological_decisions:
- issue: Sens de « Père des esprits »
  choice: Conserver le titre large « Père des esprits »
  alternative: « Père de nos esprits » ou « Père des êtres spirituels »
  rationale: Le contexte oppose les pères humains à Dieu, mais le génitif grec ne précise pas la portée du mot « esprits ». La traduction préserve donc cette ambiguïté théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « selon la chair » reste compréhensible dans ce contexte et permet de conserver le contraste structurant du grec. « Éducateurs » évite le caractère excessivement sévère de « maîtres de discipline » tout en restant lié au thème de l’éducation corrective dans Hébreux 12.
