id: HEB.12.1
reference: Hebrews 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: fr
  text: Ainsi donc, nous aussi, puisque nous sommes entourés d’une si grande nuée de témoins, débarrassons-nous de tout poids et du péché qui nous entrave aisément[a], et courons avec persévérance la course qui nous est proposée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du péché qui s’attache si étroitement à nous » ou « du péché qui nous prend si facilement au piège ». L’adjectif grec est rare et peut évoquer ce qui entrave, prend au piège ou s’attache étroitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Ainsi donc
  rationale: Cette locution marque naturellement en français la conclusion tirée de l’argument précédent, en particulier des exemples de foi du chapitre 11.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: une si grande nuée de témoins
  rationale: « Nuée » conserve l’image d’une multitude immense, tandis que « témoins » laisse ouverte la question de savoir s’ils témoignent par leur vie ou s’ils sont aussi envisagés comme spectateurs.
- source_word: περικείμενον ἡμῖν
  choice: nous sommes entourés
  rationale: Cette formulation française naturelle préserve l’image spatiale d’une multitude disposée tout autour.
- source_word: ὄγκον ... πάντα
  choice: tout poids
  rationale: « Poids » conserve l’image athlétique de ce qui alourdit et ralentit, sans limiter le terme aux seuls obstacles moraux.
- source_word: ἀποθέμενοι
  choice: débarrassons-nous
  rationale: Le participe grec est intégré à l’exhortation principale pour produire une phrase française fluide tout en exprimant l’abandon résolu de ce qui entrave.
- source_word: τὴν εὐπερίστατον ἁμαρτίαν
  choice: du péché qui nous entrave si facilement
  rationale: Dans l’image de la course, « entrave » exprime clairement le danger pratique. Comme l’adjectif grec rare peut aussi évoquer ce qui s’attache étroitement ou prend au piège, l’ambiguïté est signalée en note.
- source_word: δι’ ὑπομονῆς
  choice: avec persévérance
  rationale: « Persévérance » exprime l’endurance constante au milieu des difficultés et convient à l’appel à poursuivre la course.
- source_word: τρέχωμεν
  choice: courons
  rationale: L’impératif exhortatif à la première personne du pluriel rend directement le subjonctif hortatif grec.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: la course placée devant nous
  rationale: Bien que ἀγών puisse désigner une lutte ou une épreuve, le verbe « courir » favorise ici « course ». « Placée devant nous » conserve l’idée d’un parcours qui nous est assigné.
theological_decisions:
- issue: Sens de « témoins » par rapport à Hébreux 11
  choice: Les personnes dont la vie rend témoignage à la foi, l’image de la multitude environnante renforçant l’exhortation
  alternative: Des spectateurs célestes qui regardent principalement les croyants courir
  rationale: Le contexte immédiat renvoie aux figures du chapitre 11, dont la fidélité témoigne de la foi persévérante. La traduction garde simplement « témoins » et ne tranche pas la question de leur rôle éventuel de spectateurs.
- issue: Référence du « péché » au singulier avec article
  choice: Le péché envisagé concrètement comme une réalité qui entrave
  alternative: Un péché particulier non nommé, éventuellement l’incrédulité
  rationale: Le texte ne nomme aucun péché précis. Traduire « le péché » respecte l’article grec sans imposer une identification doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » maintient la force poétique de la métaphore biblique sans devenir obscure. La structure exhortative est rendue avec deux verbes coordonnés, « débarrassons-nous » et « courons », pour une lecture claire à voix haute.
