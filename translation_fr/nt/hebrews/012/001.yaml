  terminology: « Nuée de témoins », « tout poids », « le péché », « persévérance » et « course » sont des choix justes et cohérents avec le registre biblique moderne. « Le péché qui nous entrave si facilement » est possible, mais « qui nous entrave aisément » est plus naturel dans cette construction; la note maintient les autres sens lexicaux plausibles.
