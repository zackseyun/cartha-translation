id: HEB.12.23
reference: Hebrews 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: fr
  text: et de l’assemblée des premiers-nés qui sont inscrits dans les cieux[a], et de Dieu, juge de tous, et des esprits des justes amenés à la perfection,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans le ciel ». Le grec emploie le pluriel : « dans les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assemblée
  rationale: « Assemblée » exprime ici la communauté rassemblée dans la Sion céleste sans imposer les connotations institutionnelles que peut prendre « Église ».
- source_word: πρωτοτόκων
  choice: premiers-nés
  rationale: Le pluriel grec désigne collectivement ceux qui ont le statut ou les privilèges du premier-né; le français conserve ce pluriel sans ajouter « fils ».
- source_word: ἀπογεγραμμένων
  choice: qui sont inscrits
  rationale: Le parfait passif évoque une inscription accomplie dont le résultat demeure. La proposition relative est naturelle en français et garde l’image d’un registre.
- source_word: ἐν οὐρανοῖς
  choice: dans les cieux
  rationale: Ce choix conserve le pluriel grec et convient au registre élevé du passage; le singulier français plus idiomatique est signalé en note.
- source_word: κριτῇ θεῷ πάντων
  choice: Dieu, juge de tous
  rationale: L’apposition rend clairement l’identité et la fonction judiciaire de Dieu tout en maintenant la série régie par l’idée de s’approcher au verset précédent.
- source_word: πνεύμασι
  choice: esprits
  rationale: Le sens lexical direct est conservé, sans préciser davantage l’état de ces personnes que ne le fait le texte.
- source_word: δικαίων
  choice: des justes
  rationale: La tournure substantivée est naturelle, inclusive et directe en français; elle ne limite pas le groupe aux hommes.
- source_word: τετελειωμένων
  choice: amenés à la perfection
  rationale: Cette formulation rend le parfait passif et préserve le thème de l’accomplissement ou de la perfection propre à l’épître aux Hébreux.
theological_decisions:
- issue: Identité des « premiers-nés »
  choice: Désignation collective de personnes partageant le statut et l’héritage du premier-né.
  alternative: Référence au Christ, le Premier-né, l’assemblée étant comprise comme lui appartenant.
  rationale: Le pluriel πρωτοτόκων favorise nettement un référent collectif. La traduction conserve ce pluriel sans développer une interprétation doctrinale.
- issue: Référent des « esprits des justes amenés à la perfection »
  choice: Les esprits de personnes justes parvenues à l’état d’accomplissement évoqué par le texte.
  alternative: L’ensemble des justes, qu’ils soient ou non dans un état désincarné.
  rationale: « Esprits des justes » évoque naturellement des personnes humaines dans leur état spirituel, mais la traduction n’ajoute aucune doctrine détaillée sur leur état intermédiaire.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la structure cumulative du passage et son lien avec le verbe « vous vous êtes approchés » du verset 22. Le pluriel « les cieux » maintient la forme grecque, tandis que la note donne l’expression française plus courante.
