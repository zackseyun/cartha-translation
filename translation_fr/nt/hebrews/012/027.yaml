reference: Hebrews 12:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: fr
  text: Cette expression, « encore une fois », indique la suppression des choses qui sont ébranlées — en tant que choses qui ont été faites[a] — afin que demeurent les choses qui ne sont pas ébranlées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des choses créées ». Le grec dit littéralement « en tant que choses qui ont été faites ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « les choses qui ne peuvent pas être ébranlées » ; autre traduction possible : « ce qui est inébranlable ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Cette expression, « encore une fois »
  rationale: L’article neutre substantivise les mots cités et δέ marque ici une transition explicative légère. « Cette expression » montre naturellement que l’auteur interprète la citation précédente.
- source_word: δηλοῖ
  choice: indique
  rationale: Le verbe introduit la déduction tirée de l’expression citée. « Indique » est clair et conserve la portée explicative.
- source_word: τῶν σαλευομένων
  choice: des choses qui sont ébranlées
  rationale: Cette formulation rend le participe présent passif et maintient son parallélisme avec τὰ μὴ σαλευόμενα.
- source_word: μετάθεσιν
  choice: la suppression
  rationale: Dans ce contexte, le terme désigne le fait d’écarter ou d’enlever les réalités ébranlables, et non un simple changement.
- source_word: ὡς πεποιημένων
  choice: en tant que choses qui ont été faites
  rationale: La formulation conserve ὡς ainsi que la valeur du participe parfait passif, qui présente ces réalités comme appartenant à l’ordre de ce qui a été fait.
- source_word: ἵνα μείνῃ
  choice: afin que demeurent
  rationale: « Afin que » exprime la finalité ou le résultat visé, tandis que « demeurent » convient au registre biblique moderne sans être archaïque.
- source_word: τὰ μὴ σαλευόμενα
  choice: celles qui ne sont pas ébranlées
  rationale: Cette traduction conserve la négation du participe et le contraste formel avec les choses qui sont ébranlées, sans introduire explicitement l’idée d’incapacité.
theological_decisions:
- issue: Faut-il rendre τὰ μὴ σαλευόμενα par une incapacité à être ébranlé ou conserver la négation participiale ?
  choice: celles qui ne sont pas ébranlées
  alternative: celles qui ne peuvent pas être ébranlées / ce qui est inébranlable
  rationale: Le grec oppose directement les choses « ébranlées » aux choses « non ébranlées ». La traduction retenue préserve cette tension sans anticiper la formulation du royaume inébranlable au verset suivant.
- issue: Portée de ὡς πεποιημένων
  choice: en tant que choses qui ont été faites
  alternative: comme des choses créées
  rationale: La formulation choisie reste proche du grec et n’explicite pas davantage que le texte le rapport entre le caractère créé de ces choses et leur suppression.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre ce qui est ébranlé et ce qui ne l’est pas est conservé, tout comme l’ambiguïté entre simple non-ébranlement et impossibilité d’être ébranlé.
