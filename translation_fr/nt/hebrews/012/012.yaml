  text: Διὸ τὰς παρειμένας χεῖρας καὶ τὰ παραλελυμένα γόνατα ἀνορθώσατε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: fr
  text: C’est pourquoi[a], relevez vos mains défaillantes et vos genoux affaiblis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation fait écho à Ésaïe 35.3 dans la tradition grecque et emploie une image corporelle pour évoquer un courage et une endurance renouvelés.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Cette conjonction marque la conséquence à tirer de l’exposé précédent. « C’est pourquoi » exprime clairement et naturellement ce lien logique.
- source_word: παρειμένας χεῖρας
  choice: vos mains qui retombent
  rationale: Le participe évoque des mains relâchées, laissées pendantes. Cette formulation conserve l’image corporelle tout en restant naturelle en français; le possessif explicite convient à l’adresse directe aux destinataires.
- source_word: παραλελυμένα γόνατα
  choice: vos genoux affaiblis
  rationale: Le participe parfait décrit des genoux devenus faibles ou défaillants. « Affaiblis » préserve l’image de l’épuisement sans suggérer à tort une paralysie clinique.
- source_word: ἀνορθώσατε
  choice: fortifiez
  rationale: L’impératif appelle une action résolue. Bien que le verbe signifie littéralement redresser ou relever, « fortifiez » rend ici l’appel au regain de courage et d’endurance, tandis que les parties du corps maintiennent la métaphore.
theological_decisions:
- issue: Portée de l’exhortation exprimée par l’image de la faiblesse corporelle
  choice: Rendre le commandement comme un appel à retrouver force et persévérance, tout en conservant les images des mains et des genoux.
  alternative: 'Traduire plus formellement : « relevez les mains qui retombent et les genoux affaiblis ».'
  rationale: Le contexte immédiat porte sur l’endurance, la discipline et la persévérance. L’écho probable à Ésaïe 35.3 soutient le maintien de l’image corporelle, sans réduire le propos à une posture physique littérale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image biblique sans archaïsme; « fortifiez » explicite naturellement sa portée exhortative.
