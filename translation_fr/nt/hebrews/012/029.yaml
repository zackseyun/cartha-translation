  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: fr
  text: Car notre Dieu est un feu dévorant[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Écho à Deutéronome 4.24, où Dieu est décrit comme « un feu dévorant ».
    reason: cross_reference
  - marker: b
    text: 'Ou : « un feu qui consume ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car
  rationale: γὰρ relie cette affirmation à l’exhortation et à l’avertissement précédents avec une valeur explicative. « Car » rend naturellement cette relation en français; καὶ est absorbé dans la tournure plutôt que traduit séparément.
- source_word: ὁ θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Cette formulation idiomatique conserve la valeur possessive ainsi que la portée communautaire et relationnelle de l’expression grecque.
- source_word: πῦρ
  choice: feu
  rationale: La traduction littérale maintient l’image forte et l’écho scripturaire de Deutéronome 4.24, sans transformer la métaphore en comparaison.
- source_word: καταναλίσκον
  choice: dévorant
  rationale: Le participe présent qualifie le feu comme consumant ou détruisant entièrement. « Dévorant » est une expression française naturelle et digne qui préserve la force active de l’image; « qui consume » explicite davantage la construction.
theological_decisions:
- issue: Description métaphorique de Dieu comme feu
  choice: 'Conserver directement la métaphore : « notre Dieu est un feu dévorant »'
  alternative: « notre Dieu est comme un feu dévorant » ou « notre Dieu est un feu qui consume »
  rationale: Le grec présente une proposition équative sans marque explicite de comparaison. La métaphore directe doit donc être maintenue, avec toute sa force dans le contexte d’avertissement, sans être atténuée en simple comparaison.
translation_notes:
  register: Français international moderne, concis et solennel. « Feu dévorant » est idiomatique et conserve la formulation biblique traditionnelle sans archaïsme marqué. Les deux appels de note figurent immédiatement après l’expression concernée.
