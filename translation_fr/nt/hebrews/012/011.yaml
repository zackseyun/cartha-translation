source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: fr
  text: Toute discipline ne semble pas, sur le moment, être une joie, mais une tristesse ; plus tard, cependant, elle produit pour ceux qui ont été entraînés par elle un fruit paisible de justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « droiture ». Ici, le mot grec traduit par « justice » peut désigner la rectitude morale produite par la discipline de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: discipline
  rationale: Dans le contexte d’Hébreux 12, le terme désigne l’action éducative et corrective d’un père, ici celle de Dieu. « Discipline » conserve cette portée formatrice sans la réduire à un châtiment.
- source_word: πρὸς μὲν τὸ παρόν
  choice: sur le moment
  rationale: Cette expression marque la perspective immédiate et temporaire, mise en contraste avec ὕστερον (« plus tard »).
- source_word: οὐ δοκεῖ
  choice: semble être
  rationale: Le verbe exprime la manière dont la discipline est perçue au moment où elle est vécue, plutôt qu’une affirmation absolue sur sa nature.
- source_word: χαρᾶς … ἀλλὰ λύπης
  choice: non pas une source de joie, mais de tristesse
  rationale: Le grec emploie les noms « joie » et « tristesse ». L’ajout idiomatique de « source de » permet de conserver ces noms dans un français naturel.
- source_word: ὕστερον δὲ
  choice: plus tard, cependant
  rationale: La formulation rend à la fois la succession temporelle et le contraste avec l’expérience présente.
- source_word: καρπὸν εἰρηνικόν
  choice: un fruit paisible
  rationale: L’adjectif qualifie directement le fruit comme empreint de paix. Cette formulation préserve cette relation sans affirmer seulement que le fruit produit la paix.
- source_word: γεγυμνασμένοις
  choice: ceux qui ont été entraînés
  rationale: Le parfait passif évoque des personnes durablement formées par un entraînement répété. « Entraînés » conserve aussi l’arrière-plan athlétique du verbe.
- source_word: ἀποδίδωσιν
  choice: produit
  rationale: Avec « fruit », le verbe exprime naturellement le résultat que la discipline finit par donner.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est l’équivalent français courant de δικαιοσύνη et peut ici désigner la qualité morale droite issue de la discipline. « Droiture » est signalé en note pour expliciter cette nuance contextuelle.
theological_decisions:
- issue: Sens de παιδεία dans l’action de Dieu envers ses enfants
  choice: discipline formatrice, comprenant correction et entraînement
  alternative: châtiment ou simple instruction
  rationale: Hébreux 12.5-10 présente cette action dans une relation filiale et l’oriente vers la sainteté et la maturité. « Discipline » maintient la tension entre correction et formation sans lui donner un sens purement rétributif.
- issue: Sens de δικαιοσύνης
  choice: justice
  alternative: droiture
  rationale: Le terme grec possède une portée qui inclut justice et rectitude. Dans ce contexte, il désigne vraisemblablement la vie droite produite par la discipline ; la note conserve explicitement cette nuance sans réduire le champ du mot dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La structure « sur le moment… plus tard » fait ressortir le contraste temporel du grec. « Source de » évite une tournure nominale raide, tandis que « fruit paisible de justice » conserve l’image et l’ambiguïté théologique du texte.
