  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: fr
  text: 'Sa voix a alors ébranlé la terre, mais maintenant il a promis en disant : « Encore une fois, moi, j’ébranlerai non seulement la terre, mais aussi le ciel. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation d’Aggée 2.6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Sa voix
  rationale: Le génitif relatif renvoie à Dieu dans le contexte précédent. La reprise possessive est naturelle en français et maintient clairement le lien entre Dieu et sa voix.
- source_word: ἐσάλευσεν
  choice: avait ébranlé
  rationale: « Ébranler » exprime avec dignité et force la secousse provoquée par la voix divine. Le plus-que-parfait situe naturellement cet événement avant la promesse désormais en vigueur.
- source_word: τὴν γῆν
  choice: la terre
  rationale: En opposition au ciel, γῆ désigne ici la terre dans son ampleur cosmique, non un territoire particulier.
- source_word: τότε, νῦν δὲ
  choice: alors, mais maintenant
  rationale: Cette formulation conserve nettement le contraste temporel entre l’événement passé et la promesse présente.
- source_word: ἐπήγγελται
  choice: il a fait cette promesse
  rationale: Le parfait indique une promesse faite dont la validité demeure. Cette tournure est idiomatique en français et introduit clairement la citation.
- source_word: Ἔτι ἅπαξ
  choice: Encore une fois
  rationale: Cette expression rend le sens temporel et emphatique de la formule prophétique sans lourdeur.
- source_word: ἐγὼ σείσω
  choice: moi, j’ébranlerai
  rationale: Le pronom disjoint « moi » préserve l’emphase du pronom grec explicite ἐγώ, tandis qu’« ébranlerai » reprend le motif de la secousse cosmique.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: non seulement… mais aussi
  rationale: Cette corrélation française correspond directement et naturellement à la construction grecque.
- source_word: τὸν οὐρανόν
  choice: le ciel
  rationale: Le singulier avec article est rendu naturellement par « le ciel » et maintient l’opposition cosmique avec « la terre ».
theological_decisions:
- issue: Référent du possessif et sujet de la promesse
  choice: Dieu est celui dont la voix a ébranlé la terre et qui fait maintenant la promesse.
  alternative: Une formulation impersonnelle laissant le sujet moins explicite.
  rationale: Le contexte immédiat et la citation d’Aggée identifient Dieu comme locuteur, sans qu’il soit nécessaire d’ajouter une précision doctrinale.
- issue: Portée de « la terre » et du « ciel »
  choice: Conserver la paire cosmique « la terre… le ciel ».
  alternative: Employer « le pays… le ciel visible » ou « le sol… le ciel ».
  rationale: L’opposition grecque présente les deux grands domaines de la création et ne doit pas être réduite à un phénomène local.
translation_notes:
  register: Français international moderne, clair et digne. « Ébranler » conserve la force de l’image tout en évitant un registre trop familier. La répétition d’« ébranler » relie délibérément l’événement passé à la promesse future.
