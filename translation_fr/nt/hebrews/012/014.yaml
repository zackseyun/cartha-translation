id: HEB.12.14
reference: Hebrews 12:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: fr
  text: Recherchez la paix avec tous, ainsi que la sainteté[a], sans laquelle personne ne verra le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la sanctification ». Le terme grec peut désigner soit la sainteté comme qualité de vie, soit l’état ou le processus par lequel on est rendu saint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: la paix
  rationale: Dans l’expression « avec tous », le terme désigne naturellement des relations paisibles avec les autres, et non un simple sentiment intérieur.
- source_word: διώκετε
  choice: Recherchez
  rationale: Le verbe appelle une recherche active et persévérante. « Recherchez » est naturel dans une exhortation française et peut régir à la fois « la paix » et « la sainteté ».
- source_word: μετὰ πάντων
  choice: avec tous
  rationale: Cette formulation concise conserve la portée universelle de l’expression grecque, qui vise toutes les personnes.
- source_word: τὸν ἁγιασμόν
  choice: la sainteté
  rationale: ἁγιασμός peut désigner la sainteté comme réalité vécue ou la sanctification comme état ou processus. « La sainteté » est claire, naturelle et adaptée au contexte exhortatif, tandis qu’une note conserve l’autre possibilité.
- source_word: οὗ χωρὶς
  choice: sans laquelle
  rationale: Le pronom relatif masculin singulier renvoie naturellement à ἁγιασμός, rendu par le féminin français « sainteté » ; « sans laquelle » exprime directement cette relation.
- source_word: οὐδεὶς ὄψεται
  choice: personne ne verra
  rationale: Cette traduction rend simplement et directement la négation absolue et le futur du verbe « voir ».
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Le titre est conservé sans préciser davantage son référent, conformément au degré de détermination du texte grec.
theological_decisions:
- issue: Sens de ἁγιασμός dans cette exhortation
  choice: « la sainteté »
  alternative: « la sanctification »
  rationale: Le contexte appelle les destinataires à rechercher une réalité de vie consacrée à Dieu. « Sainteté » communique cette idée sans imposer un vocabulaire théologique technique, tandis que la note signale que le grec peut aussi évoquer l’état ou le processus de sanctification.
- issue: Référent de « le Seigneur »
  choice: Maintien du titre « le Seigneur » sans identification explicite
  alternative: « Dieu » ou « le Seigneur Jésus »
  rationale: Le grec ne précise pas davantage le référent. La traduction préserve donc l’ambiguïté et les résonances théologiques du titre au lieu de les trancher.
translation_notes:
  register: Français international moderne, clair et digne. La structure coordonnée conserve les deux compléments du même impératif. Le marqueur de note est placé immédiatement après « sainteté », terme auquel il se rapporte.
