id: HEB.12.16
reference: Hebrews 12:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: fr
  text: Veillez à ce que personne ne se livre à l’immoralité sexuelle ni ne soit profane[a] comme Ésaü, qui vendit ses droits de premier-né en échange d’un seul repas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : qui ne respecte pas les choses saintes.'
    reason: Cette variante explicite le sens contextuel de βέβηλος, que le mot français « profane » peut ne pas communiquer immédiatement à tous les lecteurs.
lexical_decisions:
- source_word: πόρνος
  choice: se livre à l’immoralité sexuelle
  rationale: Le nom grec désigne une personne sexuellement immorale. Cette tournure est claire en français moderne et évite « débauché », qui peut évoquer plus largement les excès ou la dépravation.
- source_word: βέβηλος
  choice: profane
  rationale: Le terme qualifie ce qui est étranger au sacré ou traite sans respect les réalités saintes. « Profane » conserve cette portée religieuse sans renforcer le grec jusqu’à « impie » ou « sans Dieu ».
- source_word: τὰ πρωτοτόκια
  choice: ses droits de premier-né
  rationale: Le pluriel grec désigne l’ensemble des privilèges attachés au rang de premier-né; la formulation française usuelle en rend bien le sens.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: en échange d’un seul repas
  rationale: Rend explicitement la valeur d’échange de ἀντί et l’insistance de μιᾶς sur l’unique repas.
theological_decisions:
- issue: Portée de « comme Ésaü »
  choice: Rattacher directement la comparaison à « profane », sans affirmer explicitement qu’Ésaü est donné comme exemple d’immoralité sexuelle.
  alternative: Comprendre Ésaü comme exemple à la fois de l’immoralité sexuelle et du caractère profane.
  rationale: La proximité syntaxique de ὡς Ἠσαῦ avec βέβηλος favorise ce rattachement, tandis que le récit de Genèse mentionné dans la suite illustre précisément son mépris du droit d’aînesse. La formulation n’ajoute donc pas à son sujet une accusation sexuelle que le verset n’explicite pas.
- issue: Force religieuse de βέβηλος
  choice: Conserver « profane » et expliciter en note l’idée de mépris des choses saintes.
  alternative: Traduire « sans Dieu » ou « impie ».
  rationale: βέβηλος met l’accent sur l’absence de respect pour ce qui est sacré; « sans Dieu » risquerait de transformer cette attitude en une affirmation plus générale sur la croyance ou la relation à Dieu.
translation_notes:
  register: Français international moderne, clair et digne. « Veillez à ce que » restitue la dépendance de μή τις envers l’exhortation du contexte précédent et permet au verset de se lire naturellement de façon autonome. Le passé simple « vendit » convient au bref rappel narratif dans un registre biblique actuel sans archaïsme marqué.
