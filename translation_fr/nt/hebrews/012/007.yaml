source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: fr
  text: Endurez en vue de votre formation[a]. Dieu vous traite comme des fils[b]. En effet, quel fils un père ne discipline-t-il pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Endurez cela comme une discipline. » Le grec peut aussi être compris comme un constat : « Vous endurez en vue de votre formation. »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « fils ». L’image prolonge l’analogie entre un père et ses fils ; son application ne se limite pas aux hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: en vue de votre éducation
  rationale: La préposition εἰς peut exprimer ici le but ou le résultat. « En vue de votre éducation » conserve ce rapport sans réduire παιδεία à une simple punition ; le possessif, naturel en français, explicite seulement les bénéficiaires déjà indiqués par le contexte.
- source_word: ὑπομένετε
  choice: Endurez
  rationale: La forme grecque peut être comprise comme un impératif ou un indicatif. Dans l’enchaînement exhortatif du passage, l’impératif est naturel et n’ajoute aucun complément absent du grec.
- source_word: ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός
  choice: Dieu vous traite comme des fils
  rationale: Cette formulation française rend l’emploi idiomatique de προσφέρεται et conserve la comparaison familiale explicite entre Dieu, le père et les fils.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: En effet, quel fils n’est pas éduqué par son père ?
  rationale: La tournure passive est plus naturelle en français que le calque de la construction grecque. « Éduqué » maintient le lien lexical avec παιδεία et inclut l’idée de formation, avec sa dimension corrective dans le contexte.
theological_decisions:
- issue: Langage familial masculin dans l’analogie père-fils
  choice: Conserver « fils » dans le texte principal
  alternative: « enfants »
  rationale: L’argument repose explicitement sur l’image d’un père et de ses fils. Le terme masculin est donc conservé, tout en précisant en note que l’application concerne l’ensemble des croyants.
- issue: Valeur de l’épreuve comme παιδεία divine
  choice: « éducation »
  alternative: « discipline » ou « correction »
  rationale: « Éducation » rend la portée formative de παιδεία sans exclure sa dimension corrective. « Correction » serait trop étroit, tandis que « discipline » peut évoquer en français moderne surtout un ensemble de règles ou une matière d’étude.
- issue: Mode de ὑπομένετε
  choice: 'Lecture impérative : « Endurez »'
  alternative: 'Lecture indicative : « Vous endurez »'
  rationale: La forme permet grammaticalement les deux analyses. Le contexte soutient l’exhortation, mais l’autre possibilité est conservée en note afin de ne pas effacer l’ambiguïté réelle.
translation_notes:
  register: Français international actuel, digne et accessible. « Endurez » garde la force exhortative ; « éducation » exprime la formation parentale, y compris sa dimension corrective, sans la connotation exclusivement punitive que « discipline » peut prendre en français.
