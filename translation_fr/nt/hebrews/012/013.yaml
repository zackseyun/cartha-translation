  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: fr
  text: Et faites pour vos pieds des sentiers droits[a], afin que ce qui est boiteux ne se détourne pas[b], mais soit plutôt guéri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation fait écho à Proverbes 4.26 et prolonge l’image d’une marche bien dirigée.
    reason: cross_reference
  - marker: b
    text: Ou « ne se démette pas » ou « ne se déboîte pas » ; le verbe grec peut prendre une nuance médicale dans cette image du corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: chemins
  rationale: Le mot désigne une piste ou une trace, voire une ornière. « Chemins » est naturel en français moderne et conserve l’image de la conduite.
- source_word: ὀρθὰς
  choice: droits
  rationale: L’adjectif évoque un trajet rectiligne et correctement orienté; « droits » convient à l’écho de Proverbes 4.26.
- source_word: ποιεῖτε
  choice: tracez
  rationale: L’impératif présent appelle une action suivie. Dans l’expression française, « tracez des chemins » rend naturellement l’idée de faire ou d’aménager une voie.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: pour vos pieds
  rationale: Le datif indique ici ce en vue de quoi les chemins sont tracés et maintient l’image corporelle.
- source_word: τὸ χωλὸν
  choice: ce qui est boiteux
  rationale: Le neutre substantivé demeure volontairement général. Cette formulation préserve l’ambiguïté entre une faiblesse corporelle figurée, une personne vulnérable ou une part affaiblie, sans imposer un référent précis.
- source_word: ἐκτραπῇ
  choice: ne se détourne pas
  rationale: Le verbe peut signifier s’écarter d’une voie et, dans un emploi médical, se démettre ou se déboîter. Le texte principal conserve l’image du chemin, tandis que la note signale la nuance médicale.
- source_word: ἰαθῇ
  choice: soit guéri
  rationale: Le verbe signifie normalement guérir; ce choix conserve pleinement la métaphore corporelle et l’objectif de restauration.
- source_word: μᾶλλον
  choice: plutôt
  rationale: L’adverbe marque le contraste entre l’issue à éviter et celle qui est recherchée.
theological_decisions:
- issue: Sens métaphorique ou strictement physique de l’image corporelle
  choice: Conserver le langage corporel sans déterminer si la faiblesse est physique, spirituelle ou communautaire.
  alternative: Interpréter explicitement « ce qui est boiteux » comme les croyants spirituellement faibles ou comme toute personne vulnérable.
  rationale: Le grec emploie une image corporelle dans une exhortation et ne précise pas son référent. Maintenir cette tension évite d’introduire une interprétation doctrinale ou pastorale plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. « Tracez des chemins droits » est idiomatique tout en restant proche de l’image grecque. Le neutre « ce qui est boiteux » préserve mieux que « le boiteux » l’indétermination grammaticale et théologique de τὸ χωλόν.
