  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: fr
  text: 'Et ce qui apparaissait était si terrifiant que Moïse dit[b] : « Je suis terrifié et je tremble. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis rempli de crainte et je tremble. » Le grec emploie deux termes distincts, l’un exprimant une peur intense, l’autre le tremblement.'
    reason: lexical_alternative
  - marker: b
    text: Cette formulation ne cite pas mot pour mot l’Ancien Testament, mais rappelle la réaction de peur de Moïse liée aux événements du Sinaï ; voir Deutéronome 9.19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: Et
  rationale: Conjonction qui poursuit la description du Sinaï dans les versets précédents.
- source_word: οὕτω φοβερὸν ἦν
  choice: était si terrifiant
  rationale: La tournure française avec « si » restitue naturellement le degré exprimé par οὕτω et la force de φοβερόν.
- source_word: τὸ φανταζόμενον
  choice: ce qui apparaissait
  rationale: 'Ce choix reste proche du participe grec et préserve son ouverture : il peut désigner ce qui se donnait visiblement à voir, la manifestation ou le spectacle.'
- source_word: Μωϋσῆς εἶπεν
  choice: Moïse dit
  rationale: Formulation narrative simple et directe, avec la forme française usuelle du nom.
- source_word: Ἔκφοβός εἰμι καὶ ἔντρομος
  choice: Je suis terrifié et tremblant
  rationale: 'La traduction maintient les deux termes coordonnés : une peur intense et le tremblement qui l’accompagne, sans les fondre en une seule expression.'
theological_decisions:
- issue: Rapport de la déclaration avec le récit du Sinaï
  choice: Présenter sans détour ces paroles comme une déclaration de Moïse devant la manifestation terrifiante.
  alternative: Les qualifier dans le texte principal de résumé libre de la réaction de Moïse ou les rattacher explicitement à Deutéronome 9.19.
  rationale: Le grec attribue directement la déclaration à Moïse. La question de son rapport exact avec les formulations de l’Ancien Testament est signalée en note, sans harmonisation dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Ce qui apparaissait » conserve mieux que « le spectacle » ou « la vue » la forme participiale et l’ambiguïté de la manifestation visible. Les deux adjectifs de la déclaration finale sont maintenus pour respecter le parallélisme grec.
