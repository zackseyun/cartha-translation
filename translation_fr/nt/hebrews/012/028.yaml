    reason: alternative_reading
  revision_rationale: La révision corrige la modalité verbale afin de refléter les subjonctifs grecs et affine le rendu de εὐλάβεια. Elle conserve délibérément « la grâce » dans le texte et l’alternative « soyons reconnaissants » en note, préservant l’ambiguïté lexicale et le lien grammatical possible entre χάριν et δι’ ἧς. La virgule finale est maintenue, car le verset se poursuit syntaxiquement au verset 29.
