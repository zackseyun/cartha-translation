  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: fr
  text: Ainsi, puisque nous recevons un royaume inébranlable, ayons la grâce[a], par laquelle nous puissions servir Dieu d’une manière qui lui soit agréable, avec révérence et crainte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soyons reconnaissants ». L’expression grecque ἔχωμεν χάριν peut signifier littéralement « ayons la grâce » ou, de manière idiomatique, « ayons de la reconnaissance », c’est-à-dire « soyons reconnaissants ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Ainsi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent sur l’ébranlement et la disparition des réalités créées.
- source_word: βασιλείαν ἀσάλευτον
  choice: un royaume inébranlable
  rationale: « Royaume » rend directement βασιλεία, et « inébranlable » maintient le contraste contextuel avec tout ce qui peut être ébranlé.
- source_word: παραλαμβάνοντες
  choice: puisque nous recevons
  rationale: Le participe présent exprime ici la circonstance qui fonde l’exhortation; cette formulation conserve à la fois sa valeur logique et son aspect en cours.
- source_word: ἔχωμεν χάριν
  choice: ayons la grâce
  rationale: Cette traduction conserve le sens lexical de χάρις et permet au relatif féminin qui suit de désigner naturellement la grâce comme moyen du service offert à Dieu. L’expression grecque pouvant aussi être idiomatique, le sens « soyons reconnaissants » est signalé en note.
- source_word: δι’ ἧς
  choice: par laquelle
  rationale: Le pronom relatif féminin renvoie naturellement à « la grâce » et conserve la valeur instrumentale de διά avec le génitif.
- source_word: λατρεύωμεν
  choice: nous pouvons servir
  rationale: Dans l’usage biblique, le verbe désigne souvent le service religieux rendu à Dieu. « Servir Dieu » garde cette portée sans la réduire au seul culte intérieur.
- source_word: εὐαρέστως
  choice: d’une manière qui lui soit agréable
  rationale: Cette tournure française naturelle explicite que le service est évalué comme agréable à Dieu, sans ajouter d’idée étrangère au texte.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: avec respect et crainte
  rationale: « Respect » exprime la retenue révérencieuse d’εὐλάβεια, tandis que « crainte » conserve la force de δέος devant la sainteté et la majesté divines.
theological_decisions:
- issue: Sens de χάριν dans ἔχωμεν χάριν
  choice: la grâce
  alternative: la reconnaissance; soyons reconnaissants
  rationale: La syntaxe immédiate favorise « grâce », puisque δι’ ἧς peut alors désigner celle-ci comme le moyen par lequel le service est rendu à Dieu. Le sens idiomatique « reconnaissance » reste néanmoins plausible et ancien; il est donc conservé en note afin de ne pas supprimer la tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Inébranlable » préserve l’image dominante du contexte. La formulation « ayons la grâce » est volontairement proche du grec malgré son caractère moins idiomatique, afin de maintenir le lien grammatical avec « par laquelle » et de ne pas trancher silencieusement le débat lexical.
