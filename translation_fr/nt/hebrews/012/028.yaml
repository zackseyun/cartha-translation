revisions:
- from: Ainsi, puisque nous recevons un royaume inébranlable, ayons la grâce[a], par laquelle nous pouvons servir Dieu d’une manière qui lui soit agréable, avec respect et crainte.
  to: Ainsi, puisque nous recevons un royaume inébranlable, ayons la grâce[a], par laquelle nous puissions servir Dieu d’une manière qui lui soit agréable, avec révérence et crainte,
  rationale: La révision corrige la modalité verbale afin de refléter les subjonctifs grecs et affine le rendu de εὐλάβεια. Elle conserve délibérément « la grâce » dans le texte et l’alternative « soyons reconnaissants » en note, préservant l’ambiguïté lexicale et le lien grammatical possible entre χάριν et δι’ ἧς. La virgule finale est maintenue, car le verset se poursuit syntaxiquement au verset 29.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:42:23Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’inférence (διό), la réception présente du royaume inébranlable, ainsi que l’ambiguïté réelle de ἔχωμεν χάριν, conservée par une note. Toutefois, « nous pouvons servir » est un indicatif de capacité et ne rend pas la valeur exhortative/subjonctive de λατρεύωμεν, coordonné au subjonctif exhortatif ἔχωμεν.
  naturalness: L’ensemble est clair et d’un registre moderne approprié. « Avec révérence et crainte » est plus précis et plus naturellement religieux que « avec respect et crainte » pour εὐλαβείας καὶ δέους. La formulation « par laquelle nous puissions servir » maintient le lien instrumental avec « la grâce » tout en rendant la modalité du grec.
  terminology: « Royaume inébranlable », « grâce » et « servir Dieu » sont défendables et fidèles. Le choix de « grâce » ne doit pas éliminer l’alternative idiomatique « reconnaissance / soyons reconnaissants », qui est adéquatement signalée en note. « Révérence et crainte » préserve mieux la distinction entre εὐλάβεια et δέος.
  issues:
  - severity: medium
    issue: « nous pouvons servir » ne rend pas le subjonctif λατρεύωμεν.
    rationale: Cette tournure exprime une capacité déclarative, tandis que le grec poursuit l’exhortation après ἔχωμεν χάριν. Le subjonctif français « nous puissions servir » restitue mieux la portée visée, sans imposer une analyse plus étroite du lien entre les deux verbes.
  - severity: low
    issue: « respect » atténue εὐλάβεια.
    rationale: Le respect est possible, mais « révérence » exprime plus directement la retenue respectueuse devant Dieu et se distingue mieux de la « crainte » qui rend δέος.
