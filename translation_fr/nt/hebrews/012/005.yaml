id: HEB.12.5
reference: Hebrews 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: fr
  text: 'Et vous avez oublié l’exhortation qui s’adresse à vous comme à des fils : « Mon fils[a], ne prends pas à la légère la discipline[b] du Seigneur[c], et ne perds pas courage lorsqu’il te reprend. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon enfant ». Le grec dit littéralement « Mon fils », reprenant la formulation des Proverbes et le langage représentatif de la filiation dans ce passage.
    reason: lexical_alternative
  - marker: b
    text: La « discipline » peut aussi désigner la formation ou l’instruction, et non seulement une punition.
    reason: lexical_alternative
  - marker: c
    text: Citation de Proverbes 3.11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: vous avez oublié
  rationale: Le parfait exprime l’état présent résultant de l’oubli; cette formulation naturelle conserve la force du reproche.
- source_word: παρακλήσεως
  choice: l’exhortation
  rationale: Dans l’introduction à cet avertissement tiré des Proverbes, « exhortation » rend la dimension d’encouragement et d’admonestation.
- source_word: ἥτις ὑμῖν ... διαλέγεται
  choice: qui s’adresse à vous
  rationale: Cette tournure française restitue naturellement l’idée d’une parole de l’Écriture qui interpelle directement ses destinataires.
- source_word: ὡς υἱοῖς
  choice: comme à des fils
  rationale: Le masculin explicite fait écho au vocabulaire filial de la citation et au développement de l’épître; il est donc conservé.
- source_word: Υἱέ μου
  choice: Mon fils
  rationale: Le vocatif masculin singulier préserve le libellé et le lien intertextuel avec Proverbes 3.11.
- source_word: ὀλιγώρει
  choice: ne prends pas à la légère
  rationale: Cette expression actuelle traduit l’idée de tenir pour peu ou de traiter comme insignifiant, sans renforcer le verbe jusqu’à « mépriser ».
- source_word: παιδείας
  choice: la discipline
  rationale: « Discipline » peut englober aussi bien la formation que la correction, ce qui maintient l’étendue sémantique du terme dans ce contexte.
- source_word: κυρίου
  choice: du Seigneur
  rationale: La construction génitive est rendue directement et le titre κύριος par « Seigneur ».
- source_word: ἐκλύου
  choice: ne perds pas courage
  rationale: La formulation exprime l’abattement intérieur et le risque de défaillance sous la correction.
- source_word: ἐλεγχόμενος
  choice: lorsqu’il te reprend
  rationale: « Reprendre » rend ici l’idée de réprimande corrective dans un cadre parental, sans l’exagérer.
theological_decisions:
- issue: Langage filial genré dans l’exhortation
  choice: Conserver « fils » et « Mon fils » dans le texte principal
  alternative: « enfants » et « Mon enfant »
  rationale: Le grec emploie délibérément le vocabulaire masculin de la filiation, hérité des Proverbes et repris dans l’argument de l’épître. Une note précise sa portée représentative pour l’ensemble des destinataires.
- issue: Sens de παιδεία dans la relation entre Dieu et les croyants
  choice: « discipline »
  alternative: « formation », « instruction » ou « correction »
  rationale: Le terme réunit la formation éducative et la correction. « Discipline » conserve cette tension au lieu de le réduire soit à une punition, soit à un simple enseignement.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier est conservé à l’intérieur de la citation, tandis que le pluriel « vous » désigne les destinataires de l’épître. Les marqueurs de notes suivent immédiatement les éléments auxquels ils se rapportent.
