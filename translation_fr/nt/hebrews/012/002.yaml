  source_fidelity: 'Le sens général est fidèlement rendu : l’attention fixée sur Jésus, son rôle à l’égard de la foi, son endurance de la croix, la honte écartée et son exaltation sont tous préservés. Toutefois, « qui lui était réservée » ajoute l’idée d’une joie spécialement réservée ou promise, alors que προκειμένης signifie plus directement « placée/proposée devant lui ».'
