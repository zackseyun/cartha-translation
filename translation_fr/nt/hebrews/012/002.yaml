  terminology: « Initiateur » et « celui qui mène la foi à son accomplissement » rendent de façon recevable ἀρχηγός et τελειωτής sans imposer une lecture confessionnelle. « La foi » conserve correctement l’absence de possessif explicite ; les possibilités « notre foi » et « fidélité » sont utilement signalées. « Sans tenir compte de la honte » est une bonne équivalence de καταφρονήσας.
