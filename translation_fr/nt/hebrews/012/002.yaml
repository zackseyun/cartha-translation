reference: Hebrews 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: fr
  text: gardant les yeux fixés sur Jésus[a], l’initiateur et celui qui mène la foi à son accomplissement. En vue de la joie qui lui était proposée, il a enduré la croix sans tenir compte de la honte[b], et il a pris place à la droite du trône de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus, l’initiateur de notre foi et celui qui la mène à son accomplissement », ou : « Jésus, l’initiateur de la fidélité et celui qui la mène à son accomplissement ». L’expression grecque est concise, et le mot traduit par « foi » peut aussi désigner la fidélité ou, ici, la foi des croyants.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « en méprisant la honte ». L’idée est qu’il a considéré la honte attachée à la crucifixion comme négligeable, et non comme déterminante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: gardant les yeux fixés sur
  rationale: Cette formulation naturelle exprime une attention soutenue et dirigée vers Jésus, avec l’idée implicite de détourner le regard des distractions.
- source_word: ἀρχηγὸν
  choice: l’initiateur
  rationale: Le terme désigne celui qui ouvre la voie ou qui est à l’origine de quelque chose. « Initiateur » reste accessible et convient à la relation avec la foi sans réduire le mot au sens littéraire d’« auteur ».
- source_word: τελειωτὴν
  choice: celui qui mène … à son accomplissement
  rationale: Cette périphrase rend clairement l’action de conduire quelque chose à son terme ou à sa pleine réalisation, là où « perfectionneur » serait peu naturel en français courant.
- source_word: τῆς πίστεως
  choice: la foi
  rationale: Le grec ne porte aucun possessif explicite. « La foi » conserve donc la concision et l’ambiguïté de la construction, tandis que les lectures « notre foi » et « fidélité » sont signalées en note.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: En vue de la joie qui lui était réservée
  rationale: « En vue de » présente la joie placée devant Jésus comme la perspective motivant son endurance. « Qui lui était réservée » restitue naturellement en français l’image de ce qui se trouvait devant lui.
- source_word: ὑπέμεινεν
  choice: a enduré
  rationale: Le verbe exprime la persévérance ferme sous l’épreuve; « endurer » est concis et reprend le thème majeur du contexte.
- source_word: σταυρὸν
  choice: la croix
  rationale: Malgré l’absence d’article en grec, le contexte désigne sans équivoque la crucifixion de Jésus; l’article défini est naturel en français.
- source_word: αἰσχύνης καταφρονήσας
  choice: sans tenir compte de la honte
  rationale: Le participe indique qu’il a considéré la honte comme négligeable ou non déterminante. Cette formulation évite que « méprisant la honte » soit compris comme une valorisation morale du mépris.
- source_word: ἐν δεξιᾷ … τοῦ θρόνου τοῦ θεοῦ
  choice: à la droite du trône de Dieu
  rationale: Cette traduction conserve la structure grecque et l’image de la place d’honneur et d’autorité.
- source_word: κεκάθικεν
  choice: il s’est assis
  rationale: Le passé composé rend une action accomplie dont le résultat demeure, conformément à la valeur du parfait grec.
theological_decisions:
- issue: Sens de τῆς πίστεως après ἀρχηγὸν καὶ τελειωτὴν
  choice: Jésus est présenté comme l’initiateur et celui qui mène la foi à son accomplissement.
  alternative: Jésus est l’initiateur et celui qui mène soit « notre foi », soit « la fidélité » à son accomplissement.
  rationale: La construction grecque est compacte et n’explicite ni possessif ni objet humain. Le texte principal garde « la foi », tandis que la note préserve les autres lectures possibles sans trancher doctrinalement.
- issue: Valeur de ἀντὶ dans ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: La joie placée devant Jésus est la perspective en vue de laquelle il endure la croix.
  alternative: Jésus endure la croix « au lieu de » la joie placée devant lui.
  rationale: Bien que ἀντί puisse marquer la substitution, le contexte de la course, de l’endurance et du but à atteindre favorise ici la perspective motivante. La lecture de substitution demeure lexicalement possible, mais elle est moins probable dans ce contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement exhortatif du participe initial et les images de la course, de la croix et de l’intronisation. Les périphrases « celui qui mène … à son accomplissement » et « sans tenir compte » privilégient la clarté idiomatique sans effacer les ambiguïtés signalées en notes.
