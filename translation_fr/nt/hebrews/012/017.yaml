source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: fr
  text: Vous savez, en effet, que plus tard, lorsqu’il voulut hériter de la bénédiction, il fut rejeté, car il ne trouva aucune possibilité de repentance[a], bien qu’il l’ait recherchée avec des larmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne trouva pas de place pour la repentance ». Cette expression peut signifier qu’il ne trouva aucune possibilité de revenir sur l’issue; elle peut aussi être comprise comme l’impossibilité d’obtenir qu’Isaac change d’avis. Le grec emploie le terme habituel pour « repentance ».'
    reason: alternative_reading
  - marker: b
    text: Le pronom peut renvoyer à la bénédiction ou à la repentance — ou à la possibilité de repentance exprimée dans la phrase; le grec ne permet pas de trancher avec certitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: vous savez
  rationale: Le parfait οἶδα a ici un sens présent et fait appel à ce que les destinataires savent déjà.
- source_word: μετέπειτα
  choice: plus tard
  rationale: Rend naturellement l’adverbe temporel indiquant un moment postérieur.
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: hériter de la bénédiction
  rationale: Conserve le vocabulaire de l’héritage et l’allusion à la bénédiction paternelle d’Ésaü.
- source_word: ἀπεδοκιμάσθη
  choice: il fut rejeté
  rationale: Exprime le refus sans lui imposer un sens sotériologique technique.
- source_word: μετανοίας ... τόπον
  choice: possibilité de changer la situation
  rationale: Dans ce contexte, l’expression désigne la possibilité d’un changement ou d’un revirement; cette formulation française reste naturelle tout en évitant de suggérer sans nuance qu’Ésaü ne pouvait pas se repentir moralement.
- source_word: μετὰ δακρύων
  choice: avec larmes
  rationale: Traduction concise et digne de la manière dont la recherche fut menée.
- source_word: ἐκζητήσας αὐτήν
  choice: bien qu’il l’ait recherchée
  rationale: Le pronom féminin « l’ » maintient en français une part de l’ambiguïté entre la bénédiction et la possibilité de changement.
theological_decisions:
- issue: Sens de μετανοίας τόπον et référent de αὐτήν
  choice: Le texte principal parle d’une « possibilité de changer la situation » et conserve le pronom « l’ ».
  alternative: « Il ne trouva aucune possibilité de repentance »; ou comprendre qu’il ne put amener Isaac à changer d’avis.
  rationale: Le grec peut viser l’impossibilité de renverser l’issue, un changement d’avis d’Isaac, ou être lu avec le sens habituel de repentance. Le pronom αὐτήν peut renvoyer à la bénédiction ou au changement recherché. Les notes exposent ces possibilités sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif et solennel. Les deux appels de note figurent dans le texte et rendent explicites les ambiguïtés lexicale et référentielle du grec.
