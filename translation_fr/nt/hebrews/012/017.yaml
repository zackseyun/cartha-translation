  source_fidelity: 'La traduction de « δυνατότητα de changer la situation » ne rend pas explicitement μετανοίας (« repentance ») et oriente le sens vers le seul renversement de l’issue. Le grec conserve une formulation ambiguë : Esau « ne trouva pas de place/possibilité pour la repentance », expression qui peut être comprise soit comme une possibilité de repentir, soit, selon une lecture contextuelle, comme la possibilité d’obtenir le changement d’avis d’Isaac. Le pronom αὐτήν demeure ambigu entre « la bénédiction » et « la repentance » (ou la possibilité ainsi exprimée).'
  naturalness: Le français est globalement fluide et d’un registre approprié. « Avec des larmes » est plus idiomatique en français moderne que « avec larmes ». « Aucune possibilité de repentance » est clair, tout en gardant le terme théologique du grec; la note explicite l’idiome sans le résoudre dans le texte.
  terminology: Il convient de conserver « repentance » pour μετανοίας dans le texte principal. « Bénédiction », « hériter » et « fut rejeté » rendent correctement les termes grecs et l’allusion à Ésaü, sans surinterprétation doctrinale.
