id: HEB.12.8
reference: Hebrews 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: fr
  text: Mais si vous êtes privés de l’éducation dont tous ont bénéficié, alors vous êtes des enfants illégitimes et non des fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: éducation
  rationale: Dans ce contexte, le terme désigne l’action éducative et corrective d’un père. « Éducation » conserve cette portée plus large que la seule punition, tout en restant naturel en français moderne.
- source_word: μέτοχοι γεγόνασι
  choice: ont part
  rationale: Cette tournure idiomatique rend l’idée d’être devenus participants à cette éducation sans alourdir la phrase.
- source_word: νόθοι
  choice: enfants illégitimes
  rationale: Le mot désigne des enfants nés hors d’une union reconnue et, dans le cadre ancien, dépourvus du statut filial légitime. Cette formulation évite le terme aujourd’hui fortement injurieux « bâtards ».
- source_word: υἱοί
  choice: fils
  rationale: Le contexte repose sur le statut de fils reconnus et sur l’éducation paternelle; « fils » préserve donc l’image et le contraste juridique et familial du grec.
theological_decisions:
- issue: Portée de πάντες (« tous »)
  choice: tous
  alternative: tous les enfants de Dieu
  rationale: Le texte grec laisse le référent implicite. La traduction conserve cette concision et n’ajoute pas une identification théologique absente du verset.
- issue: Nature de παιδεία
  choice: éducation
  alternative: discipline / correction
  rationale: « Éducation » maintient ensemble formation et correction paternelles, conformément au champ sémantique et au contexte, sans réduire le terme à un châtiment.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « êtes » est évitée dans la seconde proposition, tandis que le contraste entre enfants illégitimes et fils est conservé.
source_grounding:
  english_pob_role: consult_only
