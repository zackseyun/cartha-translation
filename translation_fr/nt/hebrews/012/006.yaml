id: HEB.12.6
reference: Hebrews 12:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: fr
  text: Car le Seigneur discipline celui qu’il aime, et il flagelle[a] tout fils[b] qu’il accueille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fouette ». Le verbe grec est très fort et décrit une discipline sévère.
    reason: lexical_alternative
  - marker: b
    text: « Tout fils » suit la formulation grecque. Dans ce contexte, l’expression a une portée représentative et désigne ceux que Dieu reconnaît comme ses enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: celui qu’… / qu’
  rationale: Le pronom relatif introduit une affirmation générale tout en gardant une référence personnelle au singulier. « Celui qu’il aime » et « qu’il accueille » sont naturels en français.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison qui fonde l’exhortation précédente. « Car » en conserve clairement la valeur explicative.
- source_word: ἀγαπᾷ
  choice: aime
  rationale: « Aime » est l’équivalent français direct, courant et digne de ἀγαπάω.
- source_word: κύριος
  choice: le Seigneur
  rationale: L’article est requis par l’usage français devant ce titre, dont la portée théologique est ainsi préservée.
- source_word: παιδεύει
  choice: discipline
  rationale: Dans ce contexte, le verbe désigne une formation corrective, et non un simple châtiment. « Discipline » conserve à la fois les dimensions éducative et corrective.
- source_word: μαστιγοῖ
  choice: flagelle
  rationale: Le verbe grec est fort et évoque littéralement les coups de fouet. « Flagelle » maintient la sévérité de l’image sans l’atténuer.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ poursuit et complète la première proposition plutôt qu’il n’établit une opposition marquée.
- source_word: πάντα υἱὸν
  choice: tout fils
  rationale: Cette formulation reproduit le masculin singulier du grec et conserve l’image de la filiation qui structure le contexte. Une note précise sa portée représentative.
- source_word: παραδέχεται
  choice: accueille
  rationale: Le verbe exprime ici le fait de recevoir favorablement quelqu’un. « Accueille » rend naturellement cette nuance relationnelle en français.
theological_decisions:
- issue: Rendu de υἱός dans le contexte de la discipline et de la filiation divines
  choice: tout fils
  alternative: tout enfant
  rationale: Le grec emploie explicitement υἱός, et le contexte d’Hébreux 12 développe l’image de la filiation. Le texte principal conserve donc « fils », tandis qu’une note en explicite la portée représentative pour l’ensemble des enfants de Dieu.
- issue: Force de μαστιγοῖ appliqué à la discipline divine
  choice: flagelle
  alternative: fouette ; châtie sévèrement
  rationale: Le texte emploie une image volontairement dure. « Flagelle » en préserve la force et maintient la tension entre l’amour du Seigneur et le caractère douloureux de sa discipline, sans l’adoucir ni l’expliquer à sa place.
translation_notes:
  register: Français international moderne, clair et digne. « Discipline » garde la dimension formative de παιδεύει, tandis que « flagelle » préserve sans l’atténuer la violence de l’image grecque. La syntaxe reste concise afin de conserver le parallélisme des deux propositions.
