  naturalness: Français international moderne, clair et d’un registre approprié à l’épître. « Sang de l’aspersion » est une formulation biblique établie et compréhensible, utile pour conserver l’imagerie rituelle; la note la rend accessible. « Ainsi qu’au » évite une coordination pesante sans atténuer le lien syntaxique.
