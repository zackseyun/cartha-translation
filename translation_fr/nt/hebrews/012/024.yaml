id: HEB.12.24
reference: Hebrews 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: fr
  text: et à Jésus, médiateur d’une alliance nouvelle, ainsi qu’au sang de l’aspersion[a], qui parle mieux qu’Abel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « sang de l’aspersion » désigne le sang sacrificiel appliqué par aspersion, image associée à l’établissement de l’alliance et à la purification.
    reason: cultural_note
  - marker: b
    text: Ou « que le sang d’Abel ». Le grec dit simplement « qu’Abel » et fait probablement allusion au sang d’Abel qui criait depuis le sol (Genèse 4.10).
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκης νέας
  choice: d’une alliance nouvelle
  rationale: Dans l’épître aux Hébreux, διαθήκη désigne l’alliance biblique. L’absence d’article est naturellement rendue par « une », tandis que l’ordre « alliance nouvelle » garde une expression française fluide et solennelle.
- source_word: μεσίτῃ
  choice: médiateur
  rationale: « Médiateur » exprime précisément le rôle de celui qui intervient entre les parties et conserve la portée juridique et théologique du terme.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: αἵματι ῥαντισμοῦ
  choice: au sang de l’aspersion
  rationale: Cette formulation conserve l’image rituelle du sang appliqué par aspersion, sans la réduire à une simple effusion de sang. La note en éclaire le sens pour le lecteur moderne.
- source_word: κρεῖττον
  choice: mieux
  rationale: Le neutre κρεῖττον fonctionne ici adverbialement avec « parle » ; « mieux » est naturel en français tout en maintenant le thème de la supériorité qui traverse l’épître.
- source_word: λαλοῦντι
  choice: qui parle
  rationale: La proposition relative rend naturellement le participe présent qui qualifie le sang et en préserve la personnification.
- source_word: παρὰ τὸν Ἅβελ
  choice: qu’Abel
  rationale: Le grec nomme simplement Abel, sans ajouter explicitement « le sang d’Abel ». La traduction concise préserve cette ellipse et son ambiguïté.
theological_decisions:
- issue: Référent de la comparaison avec Abel
  choice: Le texte principal conserve la formulation elliptique « mieux qu’Abel ».
  alternative: « mieux que le sang d’Abel » ou « annonce de meilleures choses que le sang d’Abel »
  rationale: Le passage évoque très probablement le sang d’Abel criant depuis le sol (Genèse 4.10), mais le grec dit seulement « Abel ». Ne pas expliciter dans le texte principal évite de résoudre une ambiguïté réelle ; la note signale l’allusion probable.
- issue: Valeur de διαθήκη
  choice: « alliance »
  alternative: « testament »
  rationale: Le contexte de l’épître et l’arrière-plan scripturaire concernent l’établissement d’une relation d’alliance, et non d’abord un testament au sens moderne.
translation_notes:
  register: Français international moderne, digne et lisible. « Ainsi qu’au » évite une succession lourde de « et à » tout en maintenant la coordination. La tournure inhabituelle « mieux qu’Abel » est volontairement conservée afin de respecter l’ellipse du grec, avec clarification en note.
