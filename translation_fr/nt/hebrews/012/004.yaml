id: HEB.12.4
reference: Hebrews 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὔπω μέχρις αἵματος ἀντικατέστητε πρὸς τὴν ἁμαρτίαν ἀνταγωνιζόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: fr
  text: Vous n’avez pas encore résisté jusqu’au sang dans votre lutte contre le péché.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « jusqu’à verser votre sang ». Le grec dit plus littéralement « jusqu’au sang » : il s’agit de résister au point que le sang soit versé.'
    reason: Précision sur l’idiome grec et variante de traduction plus explicite.
lexical_decisions:
- source_word: οὔπω
  choice: pas encore
  rationale: Cet adverbe temporel indique que la limite évoquée n’a pas encore été atteinte.
- source_word: μέχρις αἵματος
  choice: jusqu’au sang
  rationale: Cette formulation française conserve l’image concise et frappante du grec, qui évoque une résistance allant jusqu’à l’effusion de sang, sans préciser s’il s’agit de blessures ou de la mort.
- source_word: ἀντικατέστητε
  choice: vous avez résisté
  rationale: L’aoriste indicatif à la deuxième personne du pluriel exprime ici l’opposition ou la résistance; « résister » convient au contexte de lutte.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: contre le péché
  rationale: La préposition πρός avec l’accusatif marque ici l’opposition. L’article grec n’a pas besoin d’être reproduit de façon distincte en français.
- source_word: ἀνταγωνιζόμενοι
  choice: dans votre lutte
  rationale: Le participe présent, issu du vocabulaire du combat ou de la compétition, décrit le cadre continu dans lequel s’exerce cette résistance.
theological_decisions:
- issue: Référent du « péché » dans le contexte
  choice: Conserver le terme général « le péché »
  alternative: Préciser qu’il s’agit de l’opposition pécheresse des persécuteurs, du péché personnel ou de la tentation d’abandonner la foi
  rationale: Le contexte associe l’endurance face à l’hostilité et le rejet du péché, mais le verset ne restreint pas explicitement le référent. La formulation générale préserve cette tension.
- issue: Portée de « jusqu’au sang »
  choice: Maintenir l’image sans l’identifier exclusivement au martyre
  alternative: Traduire explicitement « jusqu’à verser votre sang » ou « jusqu’à mourir »
  rationale: Le grec indique la limite du sang versé, mais ne tranche pas entre blessure violente et mort. « Jusqu’au sang » conserve cette ambiguïté.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve l’imagerie de combat du texte grec. « Jusqu’au sang » est intelligible en français biblique courant, tandis que la note explicite l’idiome sans réduire sa portée au seul martyre.
