reference: Hebrews 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: fr
  text: Car considérez celui qui a enduré de la part des pécheurs une telle opposition contre eux-mêmes[a], afin que vous ne vous lassiez pas en perdant courage intérieurement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « contre lui-même ». Le texte du SBLGNT porte « contre eux-mêmes »; cette leçon plurielle est difficile dans le contexte. La variante singulière comprend l’opposition comme dirigée contre Jésus.
    reason: textual_variant
  - marker: b
    text: 'Ou : « en défaillant intérieurement »; littéralement, « défaillant quant à vos âmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: Considérez
  rationale: L’impératif appelle à une réflexion attentive et délibérée. « Considérez » est naturel, digne et conserve la force exhortative.
- source_word: τοιαύτην
  choice: une telle
  rationale: Cette expression qualifie l’opposition sans préciser davantage s’il s’agit surtout de sa nature ou de son intensité.
- source_word: ὑπομεμενηκότα
  choice: a enduré
  rationale: Le participe parfait présente l’endurance passée de Jésus comme durablement pertinente pour les destinataires.
- source_word: ὑπὸ τῶν ἁμαρτωλῶν
  choice: de la part des pécheurs
  rationale: Cette formulation exprime clairement l’agent de l’opposition et conserve la désignation morale directe du grec.
- source_word: εἰς ἑαυτοὺς ἀντιλογίαν
  choice: opposition … contre eux-mêmes
  rationale: « Opposition » rend ici le large champ de ἀντιλογία. Le texte SBLGNT porte le pluriel ἑαυτούς, « eux-mêmes »; la traduction principale le conserve malgré la difficulté contextuelle, tandis que la variante « contre lui-même » est signalée en note.
- source_word: κάμητε
  choice: vous ne vous lassiez pas
  rationale: Le verbe désigne le fait de se fatiguer ou de se lasser; la formulation convient à l’exhortation à persévérer.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: en vous laissant décourager intérieurement
  rationale: La tournure française exprime l’affaiblissement du courage dans la vie intérieure sans employer « âme » de façon artificielle. Une traduction plus formelle est donnée en note.
theological_decisions:
- issue: Référent de « celui »
  choice: Conserver « celui », avec Jésus comme référent contextuel
  alternative: Répéter explicitement « Jésus »
  rationale: Hébreux 12.2 identifie Jésus comme le modèle considéré, mais le verset 3 emploie un participe substantivé plutôt que son nom. La traduction préserve cette forme sans rendre le référent obscur.
- issue: Référent du pronom réfléchi dans εἰς ἑαυτούς
  choice: 'Suivre le texte SBLGNT : « contre eux-mêmes »'
  alternative: 'Variante manuscrite : « contre lui-même »'
  rationale: Le pluriel du texte édité produit une expression difficile, mais il ne convient pas de le remplacer silencieusement par la variante contextuellement plus aisée. La note présente celle-ci et indique que, dans le contexte, l’opposition vise Jésus.
translation_notes:
  register: Français international moderne, courant et digne. La structure exhortative reste concise. La leçon difficile du SBLGNT est maintenue dans le texte principal plutôt que corrigée d’après le contexte; les crochets [a] et [b] renvoient aux notes correspondantes.
