  to: Car considérez celui qui a enduré de la part des pécheurs une telle opposition contre eux-mêmes[a], afin que vous ne vous lassiez pas en perdant courage intérieurement[b].
  rationale: La correction rend γάρ par « Car », conserve explicitement la leçon plurielle difficile de l’édition source et formule la note sans substituer silencieusement la variante plus aisée. Elle remplace aussi une expression passive (« en vous laissant décourager ») par « en perdant courage », plus conforme à ἐκλυόμενοι, tout en préservant la référence à la vie intérieure exprimée par ταῖς ψυχαῖς ὑμῶν.
