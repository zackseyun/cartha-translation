review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le lien explicatif de γάρ, l'incapacité exprimée par οὐκ ἔφερον, la condition emphatique κἄν, ainsi que le futur passif λιθοβοληθήσεται. Toutefois, « l’ordre qui leur était donné » ajoute un destinataire explicite que le grec ne formule pas et réduit légèrement la portée neutre du participe substantivé τὸ διαστελλόμενον.
  naturalness: Le français est globalement naturel et de registre approprié. « Ils ne pouvaient pas supporter ce qui était ordonné » est à la fois plus idiomatique dans ce contexte et plus proche de l'indétermination du grec. Dans la citation, « Si même un animal touche » restitue plus directement la condition que « Même si ».
  terminology: '« Animal », « montagne » et « sera lapidé » sont exacts et adaptés au français international moderne. La note doit rendre la variante sans ajouter l''idée explicite de mise à mort : « ou percé d’une flèche » correspond mieux à « or shot with an arrow » que « ou tué d’une flèche ».'
  issues:
