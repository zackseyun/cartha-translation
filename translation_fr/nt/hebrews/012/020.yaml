revisions:
- from: 'En effet, ils ne supportaient pas l’ordre qui leur était donné : « Même si un animal touche la montagne[a], il sera lapidé. »'
  to: 'En effet, ils ne pouvaient pas supporter ce qui était ordonné : « Si même un animal touche la montagne[a], il sera lapidé. »'
  rationale: La révision conserve le sens et la syntaxe générale du texte grec, tout en évitant d'ajouter « qui leur était donné » à τὸ διαστελλόμενον. Elle rend la condition κἄν de manière plus directe et ajuste la note de variante afin de ne pas surinterpréter son libellé.
