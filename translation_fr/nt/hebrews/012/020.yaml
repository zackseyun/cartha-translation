    issue: Destinataire ajouté dans « l’ordre qui leur était donné »
    rationale: τὸ διαστελλόμενον signifie littéralement « ce qui était ordonné/prescrit »; le contexte permet d'inférer les destinataires, mais le grec ne les exprime pas dans cette formulation.
  - severity: low
    issue: Formulation de la variante textuelle
    rationale: « Tué d’une flèche » explicite un résultat qui n'est pas exprimé directement par la formulation anglaise de l'audit ni requis pour traduire la variante; « percé d’une flèche » préserve mieux la formulation.
