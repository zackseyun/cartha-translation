reference: Hebrews 12:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: fr
  text: 'En effet, ils ne pouvaient pas supporter ce qui était ordonné : « Si même un animal touche la montagne[a], il sera lapidé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ajoutent : « ou percé d’une flèche », en écho à Exode 19.12-13.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: ils ne supportaient pas
  rationale: Avec la négation, φέρω exprime ici l’incapacité à supporter ou à endurer. « Ne supportaient pas » est naturel en français moderne et conserve la force du contexte.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit l’explication de l’affirmation précédente. « En effet » rend clairement ce lien logique en français courant.
- source_word: τὸ διαστελλόμενον
  choice: l’ordre qui leur était donné
  rationale: Le participe substantivé désigne une directive formulée avec autorité. Cette expression française rend l’aspect verbal et la valeur injonctive sans préciser davantage que le grec.
- source_word: Κἂν
  choice: Même si
  rationale: 'κἄν introduit une condition à nuance emphatique : l’interdiction s’applique jusqu’à un animal. « Même si » restitue cette force de façon idiomatique.'
- source_word: θηρίον
  choice: un animal
  rationale: θηρίον peut désigner une bête ou un animal. Dans ce contexte général, « un animal » est clair et n’impose pas l’idée d’un animal uniquement sauvage.
- source_word: θίγῃ
  choice: touche
  rationale: L’aoriste subjonctif dans cette proposition conditionnelle se rend naturellement par le présent en français.
- source_word: τοῦ ὄρους
  choice: la montagne
  rationale: Le contexte identifie le mont Sinaï, mais le grec dit simplement « la montagne » ; la traduction conserve cette formulation.
- source_word: λιθοβοληθήσεται
  choice: il sera lapidé
  rationale: Le futur passif est rendu directement par « sera lapidé », qui conserve la valeur passive et judiciaire sans archaïsme.
theological_decisions:
- issue: Rapport avec le commandement donné au Sinaï
  choice: Traduire uniquement la formulation attestée dans le texte grec fourni.
  alternative: Ajouter « ou tué d’une flèche » d’après certaines traditions manuscrites et l’écho d’Exode 19.12-13.
  rationale: Le SBLGNT fourni s’arrête à « il sera lapidé ». La traduction n’harmonise donc pas le verset avec une forme développée présente dans certains manuscrits, mais signale cette variante en note.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » assure une transition naturelle avec le verset précédent ; « l’ordre qui leur était donné » évite une tournure lourde tout en conservant la valeur continue du participe grec.
