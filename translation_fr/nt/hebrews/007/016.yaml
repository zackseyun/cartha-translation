id: HEB.7.16
reference: Hebrews 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: fr
  text: lui qui l’est devenu, non selon une loi fondée sur un commandement relatif à la chair[a], mais selon la puissance d’une vie indestructible[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon une loi d’un commandement relatif à la chair ». Autres traductions possibles : « selon une loi imposant une exigence physique » ou « selon une loi fondée sur un commandement corporel ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « d’une vie sans fin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: lui qui
  rationale: Le pronom relatif renvoie à celui dont parle le verset précédent; « lui qui » maintient clairement ce lien dans ce fragment de phrase.
- source_word: γέγονεν
  choice: l’est devenu
  rationale: Le parfait exprime un état présent résultant d’un événement antérieur. Le pronom « l’ » reprend sans la préciser la fonction sacerdotale indiquée par le contexte.
- source_word: κατὰ νόμον
  choice: selon une loi fondée sur
  rationale: κατά avec l’accusatif indique ici la norme ou le fondement. L’article indéfini rend le caractère anarthre de νόμον; « fondée sur » explicite sobrement le rapport génitif avec ἐντολῆς dans un français naturel.
- source_word: ἐντολῆς σαρκίνης
  choice: un commandement relatif à la chair
  rationale: Cette formulation conserve l’image de la chair sans donner à « charnel » son sens moral courant en français. Dans le contexte, elle évoque une disposition extérieure, corporelle et généalogique.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: mais selon la puissance
  rationale: La répétition de « selon » maintient le parallélisme antithétique des deux emplois de κατά.
- source_word: ζωῆς ἀκαταλύτου
  choice: d’une vie indestructible
  rationale: ἀκατάλυτος désigne ce qui ne peut être dissous, détruit ou aboli. « Indestructible » conserve une portée plus large que la seule durée sans fin.
theological_decisions:
- issue: Sens de σαρκίνης en contraste avec ἀκαταλύτου
  choice: « relatif à la chair », au sens corporel, extérieur ou généalogique
  alternative: « charnel », « physique » ou « corporel »
  rationale: Le contexte oppose une qualification sacerdotale régie par une disposition concernant la condition corporelle et la lignée à la puissance d’une vie indestructible. Une formulation suggérant le péché importerait une affirmation absente du texte.
- issue: Portée de ἀκαταλύτου
  choice: « indestructible »
  alternative: « sans fin »
  rationale: « Indestructible » exprime l’impossibilité d’être détruit ou aboli, tandis que « sans fin » met surtout l’accent sur la durée. La variante traditionnelle est signalée en note.
- issue: Complément implicite de γέγονεν
  choice: « l’est devenu »
  alternative: « est devenu prêtre »
  rationale: Le grec laisse le prédicat sous-entendu à partir du contexte. Le pronom français rend la phrase intelligible sans inscrire explicitement dans ce verset les mots « devenu prêtre ».
translation_notes:
  register: Français international moderne, digne et lisible. La formulation évite « charnel », souvent compris aujourd’hui dans un sens moral ou sexuel, tout en conservant explicitement l’image biblique de la chair. Le début reste un fragment relatif, conformément à la syntaxe grecque et à son lien avec le verset précédent.
