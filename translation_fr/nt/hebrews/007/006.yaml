source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: fr
  text: Mais celui qui n’est pas rattaché à leur généalogie[a] a reçu d’Abraham la dîme[b] et a béni celui qui possède les promesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui dont la généalogie n’est pas établie à partir des leurs ». Il s’agit des descendants de Lévi mentionnés dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « a reçu d’Abraham un dixième ». Le verbe grec désigne le fait de prendre ou de recevoir un dixième.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Mais celui dont la généalogie ne se rattache pas à eux
  rationale: La formulation rend le participe passif substantivé et le lien généalogique exprimé par ἐξ, tout en restant naturelle en français. « Eux » renvoie, dans le contexte, aux descendants de Lévi, sans ajouter d’affirmation sur la nature ou l’origine de Melchisédek.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: a prélevé la dîme sur Abraham
  rationale: Le passé composé rend naturellement le parfait grec et sa portée actuelle dans l’argument. « Prélever la dîme sur » indique clairement qu’Abraham est celui qui la donne; une note conserve l’autre nuance possible, recevoir le dixième.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: celui qui possède les promesses
  rationale: Le présent français correspond au participe présent grec ἔχοντα. Le pluriel « les promesses » est conservé et désigne les promesses faites à Abraham.
- source_word: εὐλόγηκεν
  choice: a béni
  rationale: Le passé composé est le rendu français naturel du parfait dans ce récit et maintient la pertinence de la bénédiction pour l’argument en cours.
theological_decisions:
- issue: Portée de l’absence de rattachement généalogique
  choice: La phrase présente Melchisédek comme extérieur à la lignée généalogique lévitique.
  alternative: Comprendre plus largement qu’il ne descend pas d’eux.
  rationale: Le contexte porte sur le droit sacerdotal fondé sur la généalogie. La traduction conserve ce contraste sans en tirer de conclusion métaphysique sur Melchisédek.
translation_notes:
  register: Français international moderne, digne et accessible. « Se rattacher à » exprime naturellement le lien généalogique; « prélever la dîme » conserve le vocabulaire biblique tout en explicitant le sens du verbe grec.
