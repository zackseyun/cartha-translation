id: HEB.7.26
reference: Hebrews 7:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: fr
  text: 'Car c’est bien un tel grand prêtre qu’il nous fallait : saint, innocent, sans souillure, séparé des pécheurs[a] et devenu plus élevé que les cieux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression souligne sa pureté et sa position distincte en tant que grand prêtre; elle peut aussi se traduire par « mis à part des pécheurs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « élevé au-dessus des cieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: un tel
  rationale: Reprend de manière naturelle en français le type de grand prêtre décrit dans le contexte précédent.
- source_word: γὰρ … καὶ ἔπρεπεν
  choice: C’est bien … qu’il nous fallait
  rationale: Cette tournure française exprime le lien explicatif de γάρ, l’insistance probable de καί et la convenance exprimée par ἔπρεπεν, sans lourdeur littérale.
- source_word: ἡμῖν
  choice: il nous fallait
  rationale: Le datif indique que ce grand prêtre convient à notre besoin; la construction française rend cette relation avec clarté.
- source_word: ἀρχιερεύς
  choice: grand prêtre
  rationale: Terme français consacré et précis pour la fonction cultuelle dont traite l’épître.
- source_word: ὅσιος
  choice: saint
  rationale: Dans cette série de qualités sacerdotales, « saint » exprime clairement la consécration et la pureté morale, tout en restant digne et courant.
- source_word: ἄκακος
  choice: innocent
  rationale: Rend l’absence de mal et de malveillance; « inoffensif » serait trop faible et « sans malice » plus étroit.
- source_word: ἀμίαντος
  choice: sans souillure
  rationale: Conserve l’image de pureté morale et cultuelle dans une formulation française naturelle.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: séparé des pécheurs
  rationale: Rend directement le participe parfait et son état résultant, sans préciser indûment si la séparation est morale, cultuelle, spatiale ou liée à l’exaltation.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: devenu plus élevé que les cieux
  rationale: Préserve le comparatif et le mouvement résultatif de γενόμενος sans introduire explicitement une voix passive absente du grec.
theological_decisions:
- issue: Sens de « séparé des pécheurs »
  choice: Conserver la formulation directe « séparé des pécheurs » et signaler sa portée contextuelle en note.
  alternative: « mis à part des pécheurs » ou une explicitation exclusivement morale ou postérieure à l’ascension
  rationale: La série souligne la pureté et la dignité sacerdotales de Jésus, mais le texte ne définit pas à lui seul toutes les dimensions de cette séparation. La traduction garde donc la tension sans nier ses relations terrestres avec les pécheurs.
- issue: Portée de γενόμενος dans l’exaltation
  choice: « devenu plus élevé que les cieux »
  alternative: « élevé au-dessus des cieux » ou « étant plus élevé que les cieux »
  rationale: « Devenu » reflète le participe aoriste et présente l’accès à une position exaltée dans l’histoire du salut, sans suggérer un changement de nature divine ni préciser une agence que la forme grecque n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La structure emphatique « C’est bien … qu’il nous fallait » évite un calque lourd tout en conservant l’explication et l’insistance du grec. Les termes de pureté restent distincts et gardent leur résonance sacerdotale.
