id: HEB.7.8
reference: Hebrews 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: fr
  text: Ici, des hommes qui meurent reçoivent les dîmes ; mais là, celui dont il est attesté qu’il vit les reçoit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque présente cela comme un témoignage rendu à son sujet : elle n’affirme pas directement que Melchisédek est littéralement immortel.'
    reason: Préserver la portée du passif μαρτυρούμενος et éviter de résoudre une ambiguïté théologique que le texte maintient.
lexical_decisions:
- source_word: ὧδε … ἐκεῖ
  choice: ici … là
  rationale: Conserve le contraste déictique et rhétorique entre la situation des prêtres lévitiques et la présentation scripturaire de Melchisédek.
- source_word: δεκάτας
  choice: les dîmes
  rationale: Terme français courant et précis pour le prélèvement cultuel évoqué dans le contexte.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: des hommes qui meurent
  rationale: Rend directement le participe présent et souligne leur condition mortelle sans transformer l’expression en abstraction.
- source_word: λαμβάνουσιν
  choice: reçoivent
  rationale: Traduction simple qui n’ajoute aucune nuance de contrainte ou de collecte administrative.
- source_word: μαρτυρούμενος ὅτι ζῇ
  choice: il est attesté qu’il vit
  rationale: Maintient la formulation passive liée au témoignage ainsi que le présent de ζῇ, sans convertir le propos en affirmation explicite d’une immortalité intrinsèque.
theological_decisions:
- issue: Nature du contraste entre les prêtres lévitiques et Melchisédek
  choice: Le texte oppose des prêtres humains qui meurent à Melchisédek, dont il est attesté qu’il vit.
  alternative: Le verset affirmerait directement que Melchisédek possède personnellement une immortalité littérale et continue.
  rationale: La formulation passive μαρτυρούμενος présente le fait sous la forme d’un témoignage scripturaire. La traduction conserve cette tension sans préciser au-delà du grec la nature de la vie attribuée à Melchisédek.
translation_notes:
  register: Français international moderne, sobre et digne. « Des hommes qui meurent » est plus concret que « des hommes mortels » et reproduit la forme participiale du grec. La ponctuation met clairement en relief le contraste « ici… là ».
