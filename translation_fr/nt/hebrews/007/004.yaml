source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: fr
  text: Considérez donc combien cet homme est grand, à qui Abraham, le patriarche, a donné un dixième[a] du butin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la dîme ». Le grec dit littéralement « un dixième ».
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne le butin de guerre et peut évoquer la part la meilleure ou choisie du butin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Considérez
  rationale: L’impératif présent pluriel invite les lecteurs à examiner attentivement la portée du fait énoncé. « Considérez » restitue naturellement cette exhortation.
- source_word: δὲ
  choice: donc
  rationale: La particule marque ici une transition légère liée au raisonnement. « Donc » rend ce lien sans introduire un contraste appuyé.
- source_word: πηλίκος
  choice: combien … est grand
  rationale: Le terme exprime la grandeur ou l’importance. Cette tournure exclamative conserve la force rhétorique du grec sans préciser indûment la nature de cette grandeur.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif masculin renvoie à Melchisédek dans le contexte précédent. « Cet homme » est naturel en français et n’ajoute aucune identification étrangère au passage.
- source_word: ᾧ
  choice: lui
  rationale: La relation exprimée par le pronom relatif grec est rendue par la reprise disloquée « lui », qui produit une phrase française claire et met en relief le destinataire du don.
- source_word: δεκάτην
  choice: le dixième
  rationale: Le grec désigne littéralement une dixième part. « Le dixième » évite d’introduire dans le texte principal les connotations institutionnelles que peut porter « dîme ».
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: ἔδωκεν
  choice: a donné
  rationale: Rend simplement l’aoriste actif de δίδωμι et situe naturellement l’acte dans le passé.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: du butin
  rationale: Dans ce contexte, ἀκροθίνια désigne le butin, avec une nuance possible de part la meilleure ou choisie. « Du butin » exprime sûrement le sens principal sans imposer la nuance discutée.
- source_word: ὁ πατριάρχης
  choice: le patriarche
  rationale: Titre qui souligne le statut ancestral d’Abraham. Le terme français est courant dans le registre biblique et demeure compréhensible.
theological_decisions:
- issue: Référent et portée évaluative du verset
  choice: Le texte souligne la grandeur de Melchisédek en relevant qu’Abraham lui-même, qualifié de patriarche, lui a donné un dixième du butin.
  alternative: Expliciter que la réception du dixième établit la supériorité de Melchisédek sur Abraham.
  rationale: Le raisonnement environnant conduit vers une question de supériorité, mais ce verset formule directement un appel à mesurer la grandeur de Melchisédek à partir du geste d’Abraham. La traduction laisse au contexte le soin de développer l’inférence théologique.
- issue: Valeur temporelle de la copule sous-entendue
  choice: « est grand »
  alternative: « était grand »
  rationale: Le grec ne contient pas de copule exprimée. Le présent français convient à l’évaluation rhétorique actuelle de Melchisédek par l’auteur, tandis que le passé est réservé à l’acte historique d’Abraham.
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « Abraham, le patriarche, lui a donné… » conserve l’accent rhétorique sur le statut d’Abraham tout en évitant une longue proposition relative. Les deux marqueurs de note figurent immédiatement après les expressions concernées.
