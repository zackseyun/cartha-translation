source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: fr
  text: C’est pourquoi il peut aussi sauver pleinement[a] ceux qui s’approchent de Dieu par lui, puisqu’il est toujours vivant pour intercéder en leur faveur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sauver pour toujours » ; traditionnellement : « sauver parfaitement » ou « sauver jusqu’au bout ».'
    reason: Alternative lexicale reflétant les nuances possibles de εἰς τὸ παντελές.
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence tirée de ce qui précède au sujet du sacerdoce permanent de Jésus.
- source_word: καὶ
  choice: aussi
  rationale: Conserve la valeur additive qui relie cette capacité de sauver à la permanence de son sacerdoce.
- source_word: σῴζειν
  choice: sauver
  rationale: Terme courant et théologiquement approprié dans ce contexte sotériologique.
- source_word: εἰς τὸ παντελές
  choice: pleinement
  rationale: Exprime d’abord l’étendue complète du salut tout en laissant en note la nuance temporelle possible.
- source_word: δύναται
  choice: peut
  rationale: Rend clairement la capacité de Jésus, fondée ici sur son sacerdoce durable.
- source_word: τοὺς προσερχομένους
  choice: ceux qui s’approchent
  rationale: Préserve la notion récurrente dans Hébreux d’un accès cultuel et relationnel à Dieu.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: Exprime avec concision la médiation de Jésus dans l’accès à Dieu.
- source_word: τῷ θεῷ
  choice: de Dieu
  rationale: Avec « s’approcher », le français idiomatique emploie « s’approcher de Dieu ».
- source_word: πάντοτε ζῶν
  choice: puisqu’il est toujours vivant
  rationale: Rend la durée continue de sa vie et explicite la valeur causale du participe dans son contexte.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: pour intercéder
  rationale: Rend naturellement la finalité de sa vie permanente et le rôle d’intercession.
- source_word: ὑπὲρ αὐτῶν
  choice: en leur faveur
  rationale: Met en évidence la représentation et le bénéfice exprimés par ὑπέρ.
theological_decisions:
- issue: Portée sémantique de εἰς τὸ παντελές
  choice: « pleinement » dans le texte principal
  alternative: « pour toujours » ou, traditionnellement, « parfaitement / jusqu’au bout »
  rationale: L’expression peut désigner la totalité ou la permanence. Le contexte appuie à la fois l’efficacité complète du salut et sa durée, puisque Jésus demeure vivant. Le texte principal retient la complétude, tandis que la note conserve la lecture temporelle sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « S’approchent de Dieu » maintient le vocabulaire cultuel caractéristique de l’épître ; « intercéder en leur faveur » reste clair sans archaïsme.
