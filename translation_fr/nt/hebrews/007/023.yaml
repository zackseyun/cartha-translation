  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: fr
  text: De plus, ces prêtres sont devenus nombreux[a], parce que la mort les empêche de rester en fonction[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « il y a eu de nombreux prêtres ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de rester » ; dans ce contexte, il s’agit de rester dans la fonction sacerdotale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: De plus
  rationale: Ce connecteur naturel maintient le fil de l’argument et introduit le premier volet du contraste avec le verset suivant.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: ces prêtres sont devenus nombreux
  rationale: La formulation conserve l’idée de pluralité et la valeur résultative de γεγονότες. « Ces prêtres » renvoie naturellement aux prêtres évoqués dans le contexte, tandis que μέν prépare le contraste du verset 24.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: parce que la mort les empêchait
  rationale: διά suivi de l’infinitif articulé exprime la cause. La tournure française active est naturelle tout en gardant la mort comme ce qui fait obstacle.
- source_word: παραμένειν
  choice: de rester en fonction
  rationale: Dans ce contexte sacerdotal, le verbe désigne le fait de continuer dans la charge. « En fonction » explicite sobrement ce sens contextuel.
theological_decisions:
- issue: Contraste entre la pluralité des prêtres mortels et le sacerdoce durable de Jésus
  choice: Le texte souligne que les prêtres sont nombreux parce que la mort interrompt leur service, préparant ainsi le contraste du verset suivant.
  alternative: Nommer explicitement les prêtres lévitiques ou développer dans le texte la permanence du sacerdoce de Jésus.
  rationale: Le grec ne dit pas explicitement « lévitiques » dans ce verset. La traduction conserve la progression de l’argument sans y importer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « Prêtres » est retenu pour ἱερεῖς, et « rester en fonction » rend explicite le contexte sans ajouter l’adjectif « lévitique » absent du verset.
