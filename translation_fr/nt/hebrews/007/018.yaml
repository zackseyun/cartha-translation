id: HEB.7.18
reference: Hebrews 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: fr
  text: En effet, le commandement antérieur est abrogé[a] en raison de sa faiblesse et de son inutilité[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il y a abrogation du commandement antérieur ».'
    reason: La note conserve la construction nominale du grec, tandis que le texte principal emploie une tournure française plus naturelle.
  - marker: b
    text: C'est-à-dire incapable d'amener à la perfection dont parle le contexte (voir Hébreux 7.19), et non que la révélation antérieure de Dieu aurait été mauvaise en elle-même.
    reason: Cette précision contextuelle prévient une généralisation indue tout en maintenant la force des mots grecs.
lexical_decisions:
- source_word: ἀθέτησις
  choice: est abrogé
  rationale: Le nom grec exprime la mise hors vigueur ou l'annulation. La tournure verbale « est abrogé » est naturelle en français moderne et conserve la portée juridique du terme.
- source_word: μὲν γὰρ
  choice: En effet
  rationale: γάρ introduit l'explication, tandis que μέν prépare le contraste développé au verset suivant. « En effet » rend clairement le lien explicatif sans alourdir la phrase par « d'une part ».
- source_word: γίνεται
  choice: est
  rationale: Dans cette construction, γίνομαι signale qu'une abrogation a lieu. La formulation passive « est abrogé » transpose naturellement l'ensemble ἀθέτησις γίνεται.
- source_word: προαγούσης ἐντολῆς
  choice: le commandement antérieur
  rationale: Le participe προαγούσης signifie « qui précède » ou « qui est venu auparavant ». « Antérieur » exprime cette priorité temporelle sans préciser au-delà du texte l'étendue exacte du commandement.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: en raison de sa faiblesse et de son inutilité
  rationale: La construction donne la cause et substantive les deux adjectifs. Cette traduction en conserve la formulation forte et le parallélisme.
- source_word: ἀσθενές
  choice: faiblesse
  rationale: Le mot indique un manque de force ou d'efficacité; le substantif français reproduit la construction grecque.
- source_word: ἀνωφελές
  choice: inutilité
  rationale: Le terme désigne ce qui ne procure pas d'avantage ou n'atteint pas le résultat recherché. « Inutilité » en est l'équivalent direct, dont la portée contextuelle est précisée en note.
theological_decisions:
- issue: Portée de la critique du commandement antérieur
  choice: Conserver les termes forts « faiblesse » et « inutilité », tout en précisant en note leur rapport à l'incapacité d'amener à la perfection évoquée dans le contexte.
  alternative: Comprendre le verset comme déclarant mauvaise ou absolument sans valeur toute la révélation antérieure, ou au contraire atténuer sa véritable appréciation négative.
  rationale: Hébreux 7.11 et 7.19 situent l'affirmation dans l'argument relatif au sacerdoce et à la perfection. La traduction ne doit ni généraliser la critique au-delà du contexte ni en émousser la force.
translation_notes:
  register: Français international moderne, digne et accessible. « Abrogé » conserve la nuance juridique sans être excessivement technique. La virgule finale respecte le fait que la proposition se poursuit au verset 19.
