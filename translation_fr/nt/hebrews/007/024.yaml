  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: fr
  text: Mais lui, puisqu’il demeure pour toujours, possède un sacerdoce permanent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sacerdoce immuable » ou « un sacerdoce qui ne se transmet pas ». L’adjectif grec peut exprimer l’une ou l’autre nuance. Dans ce contexte, puisque Jésus vit pour toujours, son sacerdoce ne passe pas à un autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais lui
  rationale: L’article substantivé désigne Jésus par contraste avec les nombreux prêtres du verset précédent; « Mais lui » rend naturellement cette opposition.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: puisqu’il demeure
  rationale: διά suivi de l’infinitif articularisé exprime ici la cause. « Puisqu’il demeure » conserve le lien causal et l’idée de continuité.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée sans fin; « pour toujours » est clair et naturel en français moderne.
- source_word: ἀπαράβατον
  choice: permanent
  rationale: L’adjectif peut évoquer ce qui ne change pas ou ce qui ne passe pas à un autre. Dans le contexte de prêtres mortels et remplacés, « permanent » exprime la continuité du sacerdoce de Jésus sans éliminer les nuances possibles, signalées en note.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: possède un sacerdoce
  rationale: ἔχω exprime la possession ou la détention de la fonction sacerdotale. « Possède » est naturel et met en valeur le fait que ce sacerdoce demeure le sien.
- source_word: ἱερωσύνην
  choice: sacerdoce
  rationale: Le nom désigne la dignité ou la fonction de prêtre; « sacerdoce » est le terme français courant dans ce contexte biblique.
theological_decisions:
- issue: Sens de ἀπαράβατον appliqué au sacerdoce de Jésus
  choice: « permanent » dans le texte principal
  alternative: « immuable » ou « qui ne se transmet pas »
  rationale: Le contexte souligne que Jésus demeure pour toujours, contrairement aux prêtres qui meurent et sont remplacés. « Permanent » rend cette idée sans imposer une précision doctrinale plus étroite; la note conserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste concise et suit le contraste argumentatif du passage; la note préserve les nuances de ἀπαράβατον.
