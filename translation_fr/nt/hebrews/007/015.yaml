  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: fr
  text: Et cela est encore plus évident si un autre prêtre[a] surgit à la ressemblance de Melchisédek[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un prêtre différent » : ἕτερος peut souligner la distinction, et non seulement l’ajout d’un prêtre de plus.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « à la ressemblance de Melchisédek » reprend la formulation et le raisonnement tirés du Psaume 110,4 dans ce chapitre.
