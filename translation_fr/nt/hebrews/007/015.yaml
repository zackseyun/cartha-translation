lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: encore plus
  rationale: Cette expression comparative renforce l’affirmation précédente. « Encore plus » en restitue naturellement la progression en français.
- source_word: κατάδηλόν
  choice: évident
  rationale: L’adjectif signifie « manifeste, évident ». « Évident » est clair et actuel, sans redoubler l’intensification déjà exprimée par περισσότερον ἔτι.
- source_word: εἰ
  choice: si
  rationale: Même si la proposition peut avoir une valeur argumentative proche de « puisque », « si » conserve la forme conditionnelle du grec et son ambiguïté.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: à la ressemblance de
  rationale: Cette formulation conserve l’idée de conformité ou de similitude tout en restant idiomatique en français et en maintenant l’écho au raisonnement fondé sur le Psaume 110.4.
- source_word: Μελχισέδεκ
  choice: Melchisédek
  rationale: Translittération française conventionnelle du nom propre.
- source_word: ἀνίσταται
  choice: se lève
  rationale: Le verbe décrit ici la venue ou l’apparition d’un prêtre. « Se lève » préserve l’image verbale sans imposer explicitement le sens de résurrection.
- source_word: ἱερεὺς ἕτερος
  choice: un autre prêtre
  rationale: « Un autre prêtre » est naturel et rend la distinction d’avec le sacerdoce précédent; la nuance possible de différence de nature est signalée en note.
theological_decisions:
- issue: Nuance de ἕτερος par rapport au sacerdoce
  choice: un autre prêtre
  alternative: un prêtre différent
  rationale: Le passage présente un prêtre distinct de l’ordre lévitique et conforme à la ressemblance de Melchisédek. « Un autre prêtre » garde une formulation idiomatique sans accentuer au-delà du grec la différence de nature; l’autre possibilité est conservée en note.
- issue: Valeur argumentative de εἰ
  choice: si
  alternative: puisque / quand
  rationale: La conjonction peut introduire ici un fait tenu pour établi dans l’argumentation, mais sa forme demeure conditionnelle. La traduction « si » préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « c’est encore plus évident » rend directement ἐστιν et l’intensification grecque. « À la ressemblance de » conserve la précision intertextuelle tout en évitant une formulation inutilement archaïque.
