id: HEB.7.11
reference: Hebrews 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: fr
  text: Si la perfection avait été atteinte par le sacerdoce lévitique — car c’est sur la base de ce sacerdoce que le peuple avait reçu la Loi[a] —, pourquoi serait-il encore nécessaire qu’un autre prêtre se lève selon l’ordre de Melchisédek et ne soit pas appelé selon l’ordre d’Aaron[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « car c’est sous ce sacerdoce que le peuple avait reçu la Loi ». Le grec peut exprimer que la législation donnée au peuple était fondée sur le sacerdoce lévitique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’un autre prêtre se lève dans l’ordre de Melchisédek et ne soit pas appelé selon l’ordre d’Aaron ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: accomplissement parfait
  rationale: L’expression conserve à la fois l’idée d’achèvement et la portée cultuelle et théologique du terme dans l’épître, sans la réduire à la perfection morale.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: par le sacerdoce lévitique
  rationale: « Par » exprime naturellement en français le moyen indiqué par διά avec le génitif.
- source_word: ἐπ’ αὐτῆς
  choice: sur lui
  rationale: Le pronom renvoie le plus naturellement au sacerdoce lévitique ; la formulation garde l’image d’un fondement tout en restant idiomatique.
- source_word: νενομοθέτηται
  choice: reposait la législation donnée au peuple
  rationale: Cette formulation rend l’état résultant de l’acte de légiférer et évite le calque peu naturel « le peuple avait été légiféré ».
- source_word: τίς ἔτι χρεία
  choice: pourquoi aurait-il encore été nécessaire
  rationale: La tournure française restitue clairement la force de la question rhétorique et la nécessité encore supposée.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: selon l’ordre de Melchisédek
  rationale: Formulation consacrée qui préserve l’idée de modèle, de rang ou de catégorie exprimée par κατά et τάξις.
- source_word: ἕτερον ... ἱερέα
  choice: un autre prêtre
  rationale: Le contraste avec l’ordre d’Aaron suffit à faire entendre qu’il s’agit d’un prêtre d’un autre type.
- source_word: ἀνίστασθαι
  choice: se lève
  rationale: La traduction conserve le registre biblique et l’idée d’apparition ou d’établissement sans imposer ici un sens de résurrection.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: au lieu d’être désigné selon l’ordre d’Aaron
  rationale: « Être désigné » exprime naturellement la manière dont ce prêtre est nommé ou classé ; « au lieu de » rend en français le contraste de la question.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melchisédek / Aaron
  rationale: Graphies françaises usuelles des noms bibliques.
theological_decisions:
- issue: Sens de τελείωσις dans l’argument sacerdotal de l’épître
  choice: accomplissement parfait
  alternative: perfection ; plein accès à Dieu
  rationale: La traduction laisse au contexte le soin de préciser cet accomplissement, tout en conservant sa portée cultuelle et salvifique plutôt que de le réduire à une amélioration morale.
- issue: Référent de αὐτῆς dans ἐπ’ αὐτῆς νενομοθέτηται
  choice: le sacerdoce lévitique
  alternative: la Loi ; l’organisation de l’alliance en général
  rationale: « Sacerdoce » est l’antécédent féminin le plus proche dans le grec, et la parenthèse explique son rapport structurel avec la législation du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. « Sacerdoce » et « ordre » sont maintenus en raison de leur précision dans cet argument cultuel. La longue question grecque est conservée, avec une parenthèse marquée par des tirets pour en clarifier la structure.
