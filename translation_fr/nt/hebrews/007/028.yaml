id: HEB.7.28
reference: Hebrews 7:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: fr
  text: En effet, la Loi établit comme grands prêtres des hommes sujets à la faiblesse, tandis que la parole du serment prononcé après la Loi établit un Fils[a], qui a été rendu parfait pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Fils ». Le grec porte « un Fils » sans article, ce qui souligne le contraste avec « des hommes », tout en désignant Jésus dans le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « mené à l’accomplissement pour toujours » ; dans ce contexte sacerdotal, le verbe peut aussi évoquer le fait d’être consacré ou pleinement qualifié pour sa fonction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: la Loi
  rationale: Le terme désigne ici la Loi mosaïque, en particulier ses dispositions relatives au sacerdoce. La majuscule signale naturellement cette référence précise en français biblique.
- source_word: καθίστησιν
  choice: établit comme
  rationale: Dans ce contexte institutionnel, cette expression rend l’idée de nommer ou d’investir dans la fonction de grand prêtre.
- source_word: ἀνθρώπους
  choice: des hommes
  rationale: Le terme renvoie concrètement aux hommes qui ont successivement exercé la grande prêtrise lévitique et prépare le contraste avec « un Fils ».
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: C’est la désignation française courante des titulaires successifs de la haute fonction sacerdotale.
- source_word: ἔχοντας ἀσθένειαν
  choice: sujets à la faiblesse
  rationale: Cette formulation naturelle conserve le substantif « faiblesse » et exprime la fragilité humaine ainsi que la vulnérabilité évoquées dans Hébreux.
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: la parole du serment
  rationale: La traduction conserve le registre scripturaire de λόγος et désigne la déclaration divine formulée sous serment.
- source_word: τῆς μετὰ τὸν νόμον
  choice: prononcé après la Loi
  rationale: Le participe ajouté en français explicite naturellement que le serment est postérieur à la Loi, conformément à l’argument fondé sur le Psaume 110.
- source_word: υἱόν
  choice: un Fils
  rationale: L’absence d’article en grec et le contraste qualitatif avec « des hommes » sont préservés, tandis que la majuscule indique la référence christologique claire dans le contexte.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique rend la durée permanente du sacerdoce du Fils.
- source_word: τετελειωμένον
  choice: qui a été rendu parfait
  rationale: La formulation rend explicitement le participe parfait passif et conserve le champ sémantique de l’accomplissement ou de l’achèvement sans le réduire à la seule consécration sacerdotale.
theological_decisions:
- issue: Valeur de υἱόν sans article dans son contraste avec ἀνθρώπους
  choice: un Fils
  alternative: le Fils
  rationale: « Un Fils » respecte la forme grecque et met en relief la qualité de Fils par opposition aux simples hommes, sans nier que le contexte désigne le Fils unique.
- issue: Portée de τετελειωμένον dans la théologie sacerdotale d’Hébreux
  choice: qui a été rendu parfait pour toujours
  alternative: qui a été consacré pour toujours
  rationale: Le choix maintient la tension entre perfection, accomplissement et aptitude sacerdotale, plutôt que de fixer le verbe dans un seul sens cultuel.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste rhétorique entre la Loi et le serment, ainsi qu’entre les grands prêtres humains et le Fils. La répétition d’« établit » explicite en français le verbe sous-entendu dans le second membre grec.
