source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: fr
  text: En effet, la loi n’a rien amené à la perfection[a], mais une espérance meilleure a été introduite[b], par laquelle nous nous approchons de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’a rien conduit à son accomplissement » ; le verbe grec exprime le fait d’amener à la perfection ou au but visé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais l’introduction d’une espérance meilleure ». Le grec ne comporte pas ici de verbe exprimé. Le pronom relatif peut renvoyer à cette espérance ou, grammaticalement, à son introduction.'
    reason: ellipsis_and_ambiguity
lexical_decisions:
- source_word: οὐδὲν
  choice: rien
  rationale: Complément d’objet de ἐτελείωσεν, « rien » conserve la négation absolue sans suggérer que la loi n’avait aucune fonction d’aucune sorte.
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’explication de l’affirmation précédente et convient au français moderne soutenu.
- source_word: ἐτελείωσεν
  choice: a amené à la perfection
  rationale: Rend l’idée d’atteindre le but ou l’état accompli, importante dans Hébreux, tout en restant plus naturelle que « a perfectionné » avec le complément « rien ».
- source_word: ὁ νόμος
  choice: la loi
  rationale: Désigne ici la loi mosaïque, notamment son système sacerdotal; la minuscule n’ajoute pas une distinction absente du grec.
- source_word: ἐπεισαγωγὴ
  choice: a été introduite
  rationale: La proposition grecque est elliptique et nominale; cette formulation verbale naturelle exprime l’introduction ou l’instauration de l’espérance sans préciser indûment l’agent.
- source_word: δὲ
  choice: mais
  rationale: Marque nettement le contraste entre l’incapacité de la loi à mener à la perfection et l’introduction d’une meilleure espérance.
- source_word: κρείττονος ἐλπίδος
  choice: une espérance meilleure
  rationale: Conserve le comparatif récurrent de l’épître et l’indétermination de la construction grecque.
- source_word: δι’ ἧς
  choice: par elle
  rationale: Le pronom féminin renvoie le plus naturellement à l’espérance et exprime le moyen par lequel l’accès à Dieu est rendu possible.
- source_word: ἐγγίζομεν
  choice: nous nous approchons
  rationale: Expression française actuelle qui conserve l’idée cultuelle et relationnelle de s’approcher de Dieu.
- source_word: τῷ θεῷ
  choice: de Dieu
  rationale: Complément idiomatique du verbe français « s’approcher ».
theological_decisions:
- issue: Sens de τελειόω concernant la loi
  choice: La loi n’a rien amené à la perfection.
  alternative: La loi n’a rien accompli; la loi n’a rendu personne parfait.
  rationale: Cette formulation conserve la portée d’achèvement et de perfection propre au vocabulaire d’Hébreux, sans transformer le propos en affirmation générale selon laquelle la loi n’aurait absolument rien accompli.
- issue: Construction elliptique après la proposition sur la loi
  choice: mais une espérance meilleure a été introduite
  alternative: mais il y a l’introduction d’une espérance meilleure
  rationale: Le grec juxtapose un groupe nominal sans verbe exprimé. Le passif français explicite minimalement la relation tout en conservant le contraste et sans nommer d’agent.
- issue: Référent de δι’ ἧς
  choice: L’espérance meilleure est le moyen par lequel nous nous approchons de Dieu.
  alternative: L’introduction de cette espérance est le moyen par lequel nous nous approchons de Dieu.
  rationale: Le féminin singulier peut grammaticalement renvoyer à ἐλπίδος ou à ἐπεισαγωγή. Le sens favorise l’espérance, mais la note signale l’autre rattachement possible afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » assure naturellement la liaison argumentative; « amené à la perfection » maintient le terme théologique central sans lourdeur excessive. La syntaxe passive rend lisible l’ellipse grecque, qui est documentée en note.
