id: HEB.7.12
reference: Hebrews 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: fr
  text: En effet, lorsque le sacerdoce est changé, il se produit nécessairement aussi un changement de loi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un changement de la Loi », avec une référence explicite à la Loi de Moïse, qui établissait le sacerdoce lévitique.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: puisque … est changé
  rationale: Le participe au génitif absolu exprime ici la circonstance qui fonde la nécessité logique énoncée ensuite. « Puisque » rend naturellement cette valeur causale, et « est changé » conserve la portée générale du déplacement d'un ordre sacerdotal à un autre.
- source_word: ἱερωσύνης
  choice: le sacerdoce
  rationale: Le terme désigne l'institution ou la fonction sacerdotale, et non un acte isolé accompli par un prêtre.
- source_word: ἐξ ἀνάγκης
  choice: nécessairement
  rationale: Cette formulation claire et actuelle exprime la nécessité logique qui relie le changement de sacerdoce au changement de loi.
- source_word: νόμου
  choice: de loi
  rationale: 'L''absence d''article en grec permet de garder une formulation légèrement ouverte : il s''agit de l''ordre légal qui régit le sacerdoce, dans le contexte de la Loi de Moïse.'
- source_word: μετάθεσις
  choice: un changement
  rationale: Le nom, apparenté au verbe précédent, établit un parallèle conceptuel entre le changement du sacerdoce et celui de la loi. « Changement » évite de préciser indûment s'il s'agit d'un transfert, d'une modification ou d'un remplacement.
- source_word: γίνεται
  choice: il se produit
  rationale: Cette tournure française rend naturellement la survenue nécessaire du changement, tout en gardant le caractère argumentatif de la phrase.
- source_word: καὶ
  choice: aussi
  rationale: L'adverbe marque que le changement de loi accompagne nécessairement celui du sacerdoce.
- source_word: γὰρ
  choice: En effet
  rationale: « En effet » relie naturellement le verset à l'argument précédent comme une explication, dans un registre français soutenu mais courant.
theological_decisions:
- issue: Portée de νόμος par rapport au sacerdoce
  choice: « de loi » dans le texte principal, pour désigner l'ordre légal régissant le sacerdoce tout en incluant naturellement la Loi mosaïque dans le contexte
  alternative: « de la Loi », avec une référence explicite à la Loi de Moïse
  rationale: Le contexte concerne bien le cadre mosaïque et le sacerdoce lévitique, mais le grec νόμου est sans article. La traduction principale conserve donc une certaine ouverture sans nier la référence contextuelle; la note signale la lecture plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La structure argumentative est rendue avec « En effet » et « puisque », tandis que la répétition de « changement » préserve le lien lexical entre μετατιθεμένης et μετάθεσις.
