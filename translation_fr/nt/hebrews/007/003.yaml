source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: fr
  text: sans père, sans mère, sans généalogie[a], n’ayant ni commencement de jours ni fin de vie, mais rendu semblable au Fils de Dieu, il demeure prêtre à perpétuité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans généalogie consignée ». Le récit de la Genèse ne fournit pas de généalogie pour Melchisédek ; l’épître met ce silence à profit dans son rapprochement avec le Fils de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour toujours », « continuellement » ou « sans interruption ». L’expression souligne le caractère durable de sa prêtrise telle que l’Écriture la présente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: sans père
  rationale: Rend directement l’adjectif privatif et maintient le parallélisme avec « sans mère »; la note précise la portée possible liée au récit généalogique.
- source_word: ἀμήτωρ
  choice: sans mère
  rationale: Traduction directe qui conserve la symétrie de la série grecque.
- source_word: ἀγενεαλόγητος
  choice: sans généalogie
  rationale: Formulation concise et proche du grec, sans intégrer dans le corps du texte l’explication selon laquelle il s’agit d’une généalogie non consignée.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: n’ayant ni commencement de jours ni fin de vie
  rationale: Préserve la construction participiale, la double négation et le registre élevé de l’expression grecque.
- source_word: ἀφωμοιωμένος
  choice: rendu semblable
  rationale: Le participe parfait passif appelle une formulation qui conserve l’idée de mise en ressemblance, plutôt qu’une simple ressemblance intrinsèque, et distingue Melchisédek du Fils.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: au Fils de Dieu
  rationale: Rend naturellement en français le titre christologique défini.
- source_word: μένει
  choice: il demeure
  rationale: Exprime l’état continu indiqué par le présent de μένω et convient au registre de l’argument.
- source_word: ἱερεὺς
  choice: prêtre
  rationale: Équivalent direct; après « demeure », le français n’exige pas d’article indéfini.
- source_word: εἰς τὸ διηνεκές
  choice: à perpétuité
  rationale: Exprime la continuité durable de la prêtrise tout en évitant de résoudre au-delà du texte la nature exacte de cette permanence.
theological_decisions:
- issue: Melchisédek est-il décrit comme littéralement éternel et sans parents, ou selon la manière dont le récit biblique le présente à des fins typologiques ?
  choice: Conserver sans atténuation les expressions « sans père », « sans mère », « sans généalogie » et « ni commencement… ni fin », tout en rendant le passif « rendu semblable au Fils de Dieu ».
  alternative: Expliciter dans le texte principal « sans généalogie consignée » ou interpréter Melchisédek comme une apparition préincarnée du Fils.
  rationale: Le grec formule les descriptions de manière absolue, mais ἀφωμοιωμένος marque une ressemblance avec le Fils plutôt qu’une identité. La traduction maintient donc la tension du texte; la note signale l’interprétation fondée sur le silence de la Genèse sans l’imposer au corps du verset.
- issue: Portée temporelle de εἰς τὸ διηνεκές
  choice: à perpétuité
  alternative: pour toujours; continuellement; pour tout le temps
  rationale: La formule souligne le caractère durable et ininterrompu de la prêtrise. « À perpétuité » conserve cette force sans préciser davantage si l’énoncé porte sur l’être de Melchisédek ou sur sa présentation scripturaire.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme ternaire initial et les parallélismes du grec sont conservés. « Rendu semblable » maintient la voix passive et la distinction entre Melchisédek et le Fils; « à perpétuité » garde la solennité et la durée de l’expression finale.
