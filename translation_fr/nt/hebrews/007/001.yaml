reference: Hebrews 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: fr
  text: En effet, ce Melchisédek, roi de Salem, prêtre du Dieu Très-Haut, alla à la rencontre d’Abraham qui revenait du massacre des rois, et il le bénit,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: En effet, ce
  rationale: γάρ introduit l’explication développée à partir de 6.20; « en effet » marque naturellement ce lien en français. Le démonstratif « ce » conserve l’insistance de Οὗτος devant le nom propre.
- source_word: Μελχισέδεκ
  choice: Melchisédek
  rationale: Translittération française traditionnelle du nom, qui maintient le lien reconnaissable avec Genèse 14.
- source_word: βασιλεὺς Σαλήμ
  choice: roi de Salem
  rationale: Traduction directe et forme traditionnelle française du toponyme biblique.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: prêtre du Dieu Très-Haut
  rationale: Rend ὕψιστος comme titre divin et suit une formulation française naturelle, sans ajouter de nuance doctrinale.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: alla à la rencontre d’Abraham
  rationale: Le participe aoriste désigne l’action de Melchisédek. « Aller à la rencontre de » exprime plus précisément συνάντάω qu’un simple « rencontrer », tout en restant idiomatique.
- source_word: ὑποστρέφοντι
  choice: qui revenait
  rationale: Le participe présent se rapporte à Abraham et présente son retour comme en cours au moment de la rencontre.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: après avoir abattu les rois
  rationale: κοπή évoque littéralement l’action de tailler ou d’abattre. Cette formulation conserve la force militaire du terme sans employer « massacre », qui pourrait suggérer une tuerie indiscriminée, ni « défaite », qui en atténuerait le sens.
- source_word: καὶ εὐλογήσας αὐτόν
  choice: et il le bénit
  rationale: Le second participe aoriste est coordonné au premier. Une proposition verbale explicite donne une syntaxe française claire et conserve la succession des actions.
theological_decisions:
- issue: Traduction du titre divin τοῦ θεοῦ τοῦ ὑψίστου
  choice: du Dieu Très-Haut
  alternative: du Dieu, le Très-Haut
  rationale: « Dieu Très-Haut » est la forme française naturelle du titre et respecte la relation grammaticale grecque sans trancher au-delà du texte.
- issue: Portée de κοπή dans le récit du combat
  choice: après avoir abattu les rois
  alternative: après avoir vaincu les rois
  rationale: Le choix retient la force littérale de κοπή. Il ne cherche toutefois pas à préciser si chacun des rois a personnellement été tué, détail que la formulation condensée du texte ne développe pas.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule, comme le texte source, puisque la construction se poursuit au verset 2. Aucun appel de note n’est nécessaire dans le texte, puisqu’aucune note n’est proposée.
