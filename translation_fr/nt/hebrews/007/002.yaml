id: HEB.7.2
reference: Hebrews 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: fr
  text: à qui Abraham donna aussi un dixième de tout[a]. Tout d’abord, son nom se traduit « roi de justice »[b] ; ensuite, il est aussi roi de Salem, c’est-à-dire « roi de paix ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la dîme de tout ». Le grec dit littéralement « un dixième ».
    reason: lexical_alternative
  - marker: b
    text: Ou « roi de droiture ». Le mot grec peut désigner la justice ou la droiture.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: à qui
  rationale: Le pronom relatif au datif renvoie à Melchisédek, bénéficiaire de la part remise par Abraham.
- source_word: δεκάτην
  choice: le dixième
  rationale: Rend directement la fraction exprimée par le grec, sans remplacer celle-ci dans le texte principal par le terme plus interprétatif « dîme ».
- source_word: ἀπὸ πάντων
  choice: de tout
  rationale: Formulation française naturelle qui exprime la part prélevée sur l’ensemble.
- source_word: ἐμέρισεν
  choice: attribua
  rationale: Conserve l’idée d’assigner une part, tout en restant plus naturel en français que « répartit » lorsqu’un bénéficiaire unique est indiqué.
- source_word: πρῶτον μὲν
  choice: Tout d’abord
  rationale: Marque clairement le premier volet de l’explication en deux temps.
- source_word: ἑρμηνευόμενος
  choice: son nom se traduit
  rationale: Le participe porte sur l’interprétation du nom Melchisédek ; l’explicitation de « son nom » produit un français clair sans modifier le sens.
- source_word: βασιλεὺς δικαιοσύνης
  choice: roi de justice
  rationale: En français moderne, δικαιοσύνη se rend naturellement ici par « justice », notamment dans l’explication étymologique d’un nom ; « roi de droiture » demeure une possibilité.
- source_word: ἔπειτα δὲ καὶ
  choice: ensuite, il est aussi
  rationale: Préserve la progression et la valeur additive du grec dans une syntaxe française fluide.
- source_word: βασιλεὺς Σαλήμ
  choice: roi de Salem
  rationale: Salem est conservé comme nom propre de lieu.
- source_word: ὅ ἐστιν
  choice: c’est-à-dire
  rationale: Introduit naturellement en français la glose explicative du nom Salem.
- source_word: βασιλεὺς εἰρήνης
  choice: roi de paix
  rationale: Rend directement le titre explicatif fondé sur le sens de Salem.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le titre βασιλεὺς δικαιοσύνης
  choice: justice
  alternative: droiture
  rationale: « Justice » couvre naturellement en français la qualité morale et l’ordre juste évoqués par δικαιοσύνη. « Droiture » souligne davantage la rectitude morale ; cette possibilité est conservée en note afin de ne pas réduire la portée du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent, comme dans le grec. Les titres explicatifs sont placés entre guillemets, tandis que « roi de Salem » désigne directement la fonction de Melchisédek.
