source:
  edition: SBLGNT
  text: καὶ ὡς ἔπος εἰπεῖν, δι’ Ἀβραὰμ καὶ Λευὶ ὁ δεκάτας λαμβάνων δεδεκάτωται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/009.yaml
  text: And[a], so to speak, through Abraham even Levi, who receives tithes, has paid tithes[b],
translation:
  language: fr
  text: Et, pour ainsi dire[a], par l’intermédiaire d’Abraham, même Lévi, qui reçoit les dîmes, a payé la dîme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si l’on peut dire » ; « en quelque sorte ».
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie un parfait passif, littéralement difficile à rendre en français. Il présente Lévi comme ayant payé la dîme par l’intermédiaire d’Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: pour ainsi dire
  rationale: Expression idiomatique qui nuance la formulation; « pour ainsi dire » est naturel en français moderne et conserve cette réserve rhétorique.
- source_word: δι’ Ἀβραὰμ
  choice: par Abraham
  rationale: 'διά suivi du génitif exprime ici une médiation: l''acte de Lévi est attribué à celui-ci par l''intermédiaire de son ancêtre Abraham.'
- source_word: καὶ Λευὶ
  choice: même Lévi
  rationale: 'καί a ici une valeur emphatique: l''argument s''étend, de façon frappante, jusqu''à Lévi lui-même.'
- source_word: ὁ δεκάτας λαμβάνων
  choice: qui reçoit les dîmes
  rationale: Le participe présent substantivé caractérise Lévi selon la fonction durable de l'ordre sacerdotal qui reçoit les dîmes.
- source_word: δεκάτας
  choice: les dîmes / la dîme
  rationale: Le terme désigne les dixièmes cultuels. Le pluriel convient à la fonction habituelle de réception, tandis que le singulier collectif est idiomatique pour l'acte de paiement.
- source_word: δεδεκάτωται
  choice: a payé la dîme
  rationale: Le parfait passif grec est très condensé et littéralement inhabituel en français (« a été soumis à la dîme »). Le rendu actif exprime clairement le rôle de Lévi comme payeur dans l'argument, tout en signalant la forme grecque en note.
theological_decisions:
- issue: Participation représentative de Lévi à l'acte d'Abraham
  choice: La formulation affirme que Lévi a payé la dîme par Abraham, tout en maintenant la réserve « pour ainsi dire ».
  alternative: Comprendre que Lévi était collectivement présent dans son ancêtre, ou que l'affirmation est seulement rhétorique et figurée.
  rationale: Le texte établit une participation médiatisée sans en définir le mécanisme doctrinal. « Par Abraham » et « pour ainsi dire » préservent ensemble cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Pour ainsi dire » conserve la nuance rhétorique; « a payé la dîme » évite un passif littéral obscur, expliqué en note.
