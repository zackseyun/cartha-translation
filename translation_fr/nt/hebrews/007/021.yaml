  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: fr
  text: 'mais celui-ci est devenu prêtre avec un serment, par celui qui lui a dit : « Le Seigneur a juré[a] et ne changera pas d’avis : Tu es prêtre pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Le Seigneur jura. » L’aoriste grec ὤμοσεν peut se rendre par « a juré » ou par « jura ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: mais celui-ci
  rationale: L’expression reprend par contraste le prêtre évoqué au verset précédent. « Celui-ci » conserve mieux cette opposition que le simple pronom « il ».
- source_word: μετὰ ὁρκωμοσίας
  choice: avec un serment
  rationale: La tournure exprime la circonstance ou le moyen et maintient le contraste avec les prêtres établis sans serment au verset 20.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: par l’intermédiaire de celui qui lui a dit
  rationale: διά suivi du génitif marque ici l’agent ou l’intermédiaire. Cette formulation conserve la structure grecque tout en restant naturelle en français.
- source_word: Ὤμοσεν κύριος
  choice: Le Seigneur a juré
  rationale: Le passé composé rend naturellement l’aoriste dans ce contexte et peut suggérer la portée toujours actuelle du serment, sans l’imposer grammaticalement.
- source_word: κύριος
  choice: Seigneur
  rationale: Le texte grec porte κύριος. « Seigneur » est donc retenu, même si la citation de Psaume 110.4 correspond ultimement au nom divin dans le texte hébreu.
- source_word: οὐ μεταμεληθήσεται
  choice: ne changera pas d’avis
  rationale: Le verbe désigne ici l’absence de revirement dans l’intention déclarée, non une repentance morale. La formulation est claire et actuelle.
- source_word: Σὺ ἱερεὺς
  choice: Tu es prêtre
  rationale: Le verbe « être », sous-entendu en grec, doit être exprimé en français pour identifier naturellement la fonction sacerdotale du destinataire.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Dans cette expression idiomatique, la durée est sans fin. « Pour toujours » est la formulation française la plus naturelle.
theological_decisions:
- issue: La citation de Psaume 110.4 concernant le sacerdoce du Fils
  choice: La traduction souligne que ce sacerdoce est établi par le serment de Dieu et demeure pour toujours.
  alternative: Une traduction plus formelle pourrait employer le passé simple « Le Seigneur jura » au lieu de « Le Seigneur a juré ».
  rationale: Dans son contexte, le raisonnement de l’épître oppose les prêtres lévitiques, établis sans serment, à celui qui est établi par le serment divin. La traduction maintient ce contraste sans ajouter de formulation doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’opposition argumentative et la formulation médiatrice du grec, tout en suppléant naturellement « est devenu prêtre » à partir du contexte immédiat.
