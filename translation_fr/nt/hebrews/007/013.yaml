revisions:
- from: Car celui à propos de qui ces paroles sont dites appartient à une autre tribu[a], dont personne n’a jamais servi à l’autel[b].
  to: Car celui à propos de qui ces paroles sont dites appartient à une autre tribu[a], dont aucun membre n’a servi à l’autel[b].
  rationale: La révision explicite que l’absence de service à l’autel concerne les membres de l’autre tribu, conformément au relatif grec renvoyant à « tribu ». Elle améliore aussi une alternative de note qui était trop calquée, sans modifier le sens du passage ni imposer une interprétation de la filiation.
