id: HEB.7.13
reference: Hebrews 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: fr
  text: Car celui à propos de qui ces paroles sont dites appartient à une autre tribu[a], dont aucun membre n’a servi à l’autel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été associé à une autre tribu » ou « est issu d’une autre tribu ». Le verbe grec peut exprimer la participation ou l’association ; ici, il s’agit de l’appartenance tribale.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’est consacré au service de l’autel » ou « a officié à l’autel ». L’expression grecque désigne le fait de s’attacher au service lié à l’autel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: à propos de qui
  rationale: Avec λέγεται ταῦτα, ἐπί suivi de l’accusatif marque ici la personne concernée par les paroles.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication qui fonde l’affirmation précédente et conserve le mouvement argumentatif.
- source_word: λέγεται ταῦτα
  choice: ces paroles sont dites
  rationale: Conserve le passif présent et la valeur plurielle de ταῦτα dans un français naturel.
- source_word: φυλῆς ἑτέρας
  choice: une autre tribu
  rationale: φυλή désigne ici l’une des tribus d’Israël, et ἑτέρας la distingue de la tribu sacerdotale évoquée dans l’argument.
- source_word: μετέσχηκεν
  choice: appartient à
  rationale: Dans ce contexte, le parfait exprime une affiliation tribale établie et toujours pertinente; le présent français la rend naturellement sans transformer le verbe en terme explicite de filiation.
- source_word: ἀφ’ ἧς
  choice: dont
  rationale: Le relatif renvoie à la tribu et introduit naturellement en français la personne qui en est issue.
- source_word: οὐδεὶς
  choice: personne… jamais
  rationale: La négation discontinue française exprime clairement qu’aucun membre de cette tribu n’a accompli ce service.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: a servi à l’autel
  rationale: Dans ce contexte cultuel, προσέχω évoque le fait de s’attacher au service de l’autel; cette formulation française reste claire sans préciser indûment les actes sacerdotaux accomplis.
- source_word: θυσιαστηρίῳ
  choice: autel
  rationale: Équivalent français habituel et précis dans le contexte sacrificiel.
theological_decisions:
- issue: Lien de Jésus avec une tribu non lévitique dans l’argument sur le sacerdoce
  choice: Exprimer l’appartenance à une autre tribu sans expliciter davantage la filiation.
  alternative: « descend d’une autre tribu » ou « est issu d’une autre tribu »
  rationale: Le verset contribue à montrer que le sacerdoce de Jésus ne relève pas de la lignée lévitique, mais μετέσχηκεν exprime directement la participation ou l’appartenance, non le concept précis de descendance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère explicatif du verset; « appartient à » et « a servi à l’autel » privilégient la clarté tout en signalant en notes les nuances lexicales du grec.
