review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : la personne concernée relève d’une tribu autre que la tribu sacerdotale, et aucun membre de cette tribu n’a exercé de service à l’autel. Toutefois, « personne » après « dont » laisse moins explicite que le grec le lien avec les membres de la tribu. « Aucun membre » rend clairement l’implication de ἀφ’ ἧς sans ajouter de notion doctrinale.'
  naturalness: Le français est globalement naturel et de registre approprié. « Dont aucun membre n’a servi à l’autel » est plus net et plus idiomatique dans ce contexte que « dont personne n’a jamais servi à l’autel ».
  terminology: « Tribu », « appartient à » et « autel » sont appropriés. « Servi à l’autel » restitue sobrement le sens cultuel de προσέσχηκεν τῷ θυσιαστηρίῳ. La première alternative de la note a, « a eu part à une autre tribu », est un calque peu naturel et doit être remplacée.
  issues:
  - severity: low
    issue: Référent implicite de ἀφ’ ἧς insuffisamment explicité
    rationale: Dans « dont personne n’a jamais servi », le lien entre « personne » et les membres de la tribu demeure elliptique. « Dont aucun membre n’a servi » rend explicitement, mais sans surcharge interprétative, le sens de « de laquelle personne [n’a servi] ».
  - severity: low
    issue: Alternative lexicale peu idiomatique dans la note a
    rationale: « A eu part à une autre tribu » n’est pas une formulation française naturelle pour l’association ou l’affiliation tribale. « A été associé à une autre tribu » conserve la possibilité lexicale tout en restant lisible.
