  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: fr
  text: 'En effet, il est attesté : « Tu es prêtre pour toujours selon l’ordre de Melchisédek. »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la manière de Melchisédek ».'
    reason: lexical_alternative
  - marker: b
    text: Citation du Psaume 110.4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: il est attesté
  rationale: Le présent passif employé de manière impersonnelle introduit le témoignage de l’Écriture sans en préciser artificiellement le sujet.
- source_word: γὰρ
  choice: En effet
  rationale: La conjonction apporte une justification à l’affirmation précédente ; « En effet » exprime naturellement ce lien argumentatif en français.
- source_word: ὅτι
  choice: ':'
  rationale: La conjonction introduit ici le contenu d’une citation directe ; les deux-points sont plus naturels en français.
- source_word: Σὺ
  choice: Tu
  rationale: Le pronom de deuxième personne du singulier conserve l’adresse directe et emphatique de la citation.
- source_word: ἱερεὺς
  choice: prêtre
  rationale: Ce terme désigne précisément un prêtre ; il ne faut pas l’élargir ici en « grand prêtre ».
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique indique une durée perpétuelle ; « pour toujours » est clair et naturel en français contemporain.
- source_word: κατὰ τὴν τάξιν
  choice: selon l’ordre de
  rationale: Cette formulation conserve l’idée de conformité à un ordre, une catégorie ou un modèle, tout en restant traditionnelle et intelligible.
- source_word: Μελχισέδεκ
  choice: Melchisédek
  rationale: Le nom propre est translittéré selon sa forme française usuelle.
theological_decisions:
- issue: Rendre la désignation sacerdotale du psaume sans importer une explication doctrinale ultérieure
  choice: « Tu es prêtre pour toujours selon l’ordre de Melchisédek »
  alternative: « Tu es grand prêtre pour toujours selon l’ordre de Melchisédek »
  rationale: Le grec porte « prêtre », non « grand prêtre ». Bien que l’épître présente ailleurs Jésus comme grand prêtre, ajouter ici « grand » dépasserait le texte source.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure impersonnelle « il est attesté » préserve le passif grec, tandis que « selon l’ordre de » maintient la formulation sacerdotale sans en réduire l’ambiguïté à la seule idée de ressemblance.
