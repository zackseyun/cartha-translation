id: HEB.7.22
reference: Hebrews 7:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: fr
  text: C’est dans cette mesure que Jésus est devenu le garant d’une meilleure alliance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « testament ». Le mot grec peut désigner une alliance ou, dans certains contextes, un testament; ici, « alliance » convient mieux au raisonnement sur le sacerdoce et le serment.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: dans cette mesure
  rationale: L’expression indique le degré ou l’étendue et relie le verset à la supériorité exposée juste avant. « Dans cette mesure » conserve ce lien comparatif dans un français naturel.
- source_word: κρείττονος
  choice: meilleure
  rationale: Le comparatif « meilleure » rend clairement le terme récurrent de l’épître et convient à la comparaison entre deux dispositions.
- source_word: διαθήκης
  choice: alliance
  rationale: Dans le contexte du sacerdoce et du serment divin, « alliance » désigne au mieux la relation établie par Dieu. Le sens possible de « testament » est signalé en note sans être imposé au texte.
- source_word: γέγονεν
  choice: est devenu
  rationale: Le parfait exprime un fait accompli dont le résultat demeure. Le passé composé français communique naturellement cet état résultant.
- source_word: ἔγγυος
  choice: garant
  rationale: Le mot désigne une personne qui apporte une garantie. « Garant » est précis, actuel et plus naturel que des termes juridiques vieillis.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française consacrée du nom propre grec.
theological_decisions:
- issue: Sens de διαθήκη en Hébreux 7.22
  choice: alliance
  alternative: testament
  rationale: Le raisonnement immédiat porte sur le sacerdoce de Jésus confirmé par serment et sur un ordre supérieur; « alliance » correspond donc mieux au contexte. La polysémie grecque est néanmoins conservée dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre de la phrase met en relief le lien logique avec les versets précédents, tandis que « garant » conserve la fonction personnelle attribuée à Jésus.
