  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: fr
  text: Car il est évident que notre Seigneur est issu de Juda[a], une tribu dont Moïse n’a rien dit au sujet des prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a surgi de Juda ». Le verbe grec évoque l’idée de se lever ou de surgir ; ici, il indique l’origine dans la tribu de Juda, et non principalement la résurrection.'
    reason: Alternative lexicale préservant l’image de ἀνατέλλω et clarifiant sa portée contextuelle.
lexical_decisions:
- source_word: πρόδηλον
  choice: il est évident
  rationale: Cette tournure impersonnelle exprime naturellement en français moderne un fait tenu pour manifeste.
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve le lien explicatif avec l’argument qui précède et convient au registre soutenu du passage.
- source_word: ἐξ Ἰούδα
  choice: de Juda
  rationale: La préposition marque ici l’origine ou l’ascendance. La mention immédiate de la tribu rend inutile l’ajout interprétatif « de la tribu de ».
- source_word: ἀνατέταλκεν
  choice: est issu
  rationale: Dans ce contexte de filiation tribale, cette formulation française exprime clairement l’origine tout en évitant que « s’est levé » soit compris d’abord comme une allusion à la résurrection. Une note conserve l’image grecque de la levée ou de la germination.
- source_word: ὁ κύριος ἡμῶν
  choice: notre Seigneur
  rationale: Cette formulation naturelle conserve le titre κύριος sans expliciter le nom de Jésus, que le contexte permet d’identifier.
- source_word: εἰς ἣν φυλήν
  choice: tribu au sujet de laquelle
  rationale: Cette formulation reprend clairement Juda comme tribu et introduit de manière idiomatique le silence de Moïse à son propos.
- source_word: περὶ ἱερέων οὐδὲν
  choice: rien dit concernant des prêtres
  rationale: Le grec parle de prêtres au pluriel, et non du concept abstrait de sacerdoce. « Concernant » maintient un registre digne sans être archaïque.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Moïse n’a rien dit
  rationale: « Dire » rend naturellement λαλέω dans cette construction négative française.
theological_decisions:
- issue: Référent de « notre Seigneur »
  choice: Conserver « notre Seigneur » sans ajouter « Jésus »
  alternative: Expliciter « notre Seigneur Jésus »
  rationale: Le contexte identifie le Seigneur à Jésus et oppose son origine judéenne à l’ordre sacerdotal lévitique, mais le texte grec ne donne pas ici le nom de Jésus.
- issue: Portée de ἀνατέταλκεν
  choice: Comprendre le verbe comme une image d’apparition ou de croissance exprimant l’origine judéenne
  alternative: Le rendre par « est ressuscité », ou par « s’est levé » sans clarification
  rationale: L’argument immédiat porte sur l’appartenance tribale. La traduction principale évite une fausse lecture centrée sur la résurrection, tandis que la note préserve l’image lexicale.
translation_notes:
  register: Français international moderne, clair et digne. « Car » marque l’enchaînement logique; « est issu » est idiomatique pour l’ascendance, tandis que la note restitue la métaphore grecque.
