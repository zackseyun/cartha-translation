  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: fr
  text: Or, sans aucune contestation[a], le moindre est béni par le supérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans la moindre contradiction » ou « sans aucun doute ».
    reason: Alternative lexicale pour ἀντιλογία et pour la valeur idiomatique de l’expression entière.
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Or, sans aucune contestation
  rationale: χωρίς avec le génitif exprime l’absence, πάσης donne la portée « aucune », et ἀντιλογία désigne ici la contestation ou la contradiction. « Or » rend la légère transition marquée par δέ sans créer une opposition forte.
- source_word: τὸ ἔλαττον
  choice: le moins important
  rationale: Le comparatif substantivé neutre désigne de manière générale celui qui occupe le rang inférieur. Cette formulation française est naturelle et évite l’idée de moindre valeur morale que pourrait suggérer « l’inférieur ».
- source_word: ὑπὸ τοῦ κρείττονος
  choice: par le plus important
  rationale: ὑπό avec le génitif indique l’agent. Le comparatif substantivé κρείττονος renvoie ici à celui qui occupe le rang supérieur; le parallélisme « moins important / plus important » préserve directement la comparaison.
- source_word: εὐλογεῖται
  choice: est béni
  rationale: Le présent passif indique que le sujet reçoit une bénédiction. Dans le contexte de Melchisédek bénissant Abraham, « est béni » garde le sens religieux et l’aspect général de l’énoncé.
theological_decisions:
- issue: Nature de la comparaison entre celui qui bénit et celui qui est béni
  choice: 'Le texte énonce un principe général de rang : celui qui occupe une position moindre est béni par celui qui occupe une position plus élevée.'
  alternative: Il ne s’agirait que d’une convention sociale, sans portée théologique.
  rationale: Dans Hébreux 7, ce principe soutient l’argument relatif à la supériorité de Melchisédek sur Abraham. La traduction conserve la comparaison de statut sans préciser au-delà du texte la nature exacte de cette supériorité.
translation_notes:
  register: Français international moderne, clair et digne. « Or » assure une transition discursive légère. Le couple « le moins important / le plus important » est idiomatique et symétrique, tout en conservant la comparaison de rang sans connotation morale.
