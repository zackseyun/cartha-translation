source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: fr
  text: Et ceux qui, parmi les fils de Lévi, reçoivent la prêtrise ont l’ordre, selon la Loi, de prélever la dîme auprès du peuple, c’est-à-dire auprès de leurs frères[a], bien qu’eux aussi soient issus d’Abraham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les autres Israélites ». Le grec dit littéralement « leurs frères », terme masculin de parenté désignant ici les autres membres du peuple.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sortis des reins d’Abraham » ; autrement dit : « descendants d’Abraham ».'
    reason: literal_rendering
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: ceux des fils de Lévi
  rationale: Conserve le sens partitif de ἐκ et le langage de filiation, en visant précisément ceux de la lignée de Lévi qui accèdent à la fonction sacerdotale.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: qui reçoivent la prêtrise
  rationale: « Reçoivent » exprime l’attribution de la fonction plutôt qu’une prise d’autorité personnelle; « prêtrise » est naturel et digne en français moderne.
- source_word: ἐντολὴν ἔχουσιν
  choice: ont […] le commandement
  rationale: Maintient la construction nominale grecque et la portée juridique de ἐντολή.
- source_word: ἀποδεκατοῦν
  choice: prélever la dîme sur
  rationale: Le verbe désigne ici l’action de percevoir le dixième auprès d’autrui, non celle de donner soi-même la dîme.
- source_word: τὸν λαὸν
  choice: le peuple
  rationale: Rend directement λαός; l’apposition suivante précise qu’il s’agit des autres membres du peuple d’Israël.
- source_word: κατὰ τὸν νόμον
  choice: selon la Loi
  rationale: Exprime la conformité à la Loi mosaïque; la majuscule signale ce référent déterminé sans l’expliciter davantage.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Formulation française naturelle pour introduire l’apposition explicative.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: leurs frères
  rationale: Conserve le terme masculin de parenté employé par le grec; une note précise son sens collectif et communautaire.
- source_word: καίπερ
  choice: bien que
  rationale: Rend clairement la valeur concessive du participe.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: soient issus d’Abraham
  rationale: Exprime naturellement en français la descendance physique. La note conserve l’image corporelle littérale importante pour le raisonnement du passage.
theological_decisions:
- issue: Langage de parenté dans le contexte collectif d’Israël
  choice: leurs frères
  alternative: les autres Israélites
  rationale: Le texte grec emploie le masculin ἀδελφούς dans un sens familial et communautaire. Le texte principal garde cette forme, tandis que la note en explicite l’étendue référentielle.
- issue: Image corporelle de la descendance d’Abraham
  choice: soient issus d’Abraham
  alternative: soient sortis des reins d’Abraham
  rationale: La formulation principale est idiomatique et intelligible en français contemporain, sans nier la descendance physique; la traduction littérale est fournie en note afin de préserver l’image rhétorique grecque.
translation_notes:
  register: Français international moderne, naturel et soutenu. « Prêtrise », « commandement » et « dîme » conservent le registre religieux et juridique du passage. L’image archaïque des « reins » est placée en note pour garder sa valeur exégétique sans alourdir le texte principal.
