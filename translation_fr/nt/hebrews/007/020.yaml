  source_fidelity: 'Le texte rend correctement la structure inachevée de la phrase grecque : Καὶ est conservé, καθ’ ὅσον garde sa valeur argumentative, et οὐ χωρὶς ὁρκωμοσίας est bien exprimé par « ne s’est pas fait sans serment ». La parenthèse conserve γάρ et le μέν anticipatif (« d’une part »), dont le second membre se poursuit au verset suivant. « Sont devenus prêtres » rend adéquatement εἰσὶν ἱερεῖς γεγονότες.'
  naturalness: Le français est moderne, clair et d’un registre approprié à l’argumentation de l’épître. La formulation volontairement suspendue, y compris la parenthèse non close, est justifiée par la continuité syntaxique avec les versets suivants. « Ceux-là » est un peu démonstratif, mais il reproduit sans surinterpréter le renvoi contextuel du grec.
  terminology: « Serment » est un équivalent naturel et fidèle de ὁρκωμοσία dans les deux occurrences. « Prêtres » est correct pour ἱερεῖς. La note signale de façon utile que le terme peut viser le serment ou l’acte de le prêter, sans imposer une distinction absente du contexte immédiat.
