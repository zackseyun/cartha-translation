id: HEB.7.20
reference: Hebrews 7:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ καθ’ ὅσον οὐ χωρὶς ὁρκωμοσίας (οἱ μὲν γὰρ χωρὶς ὁρκωμοσίας εἰσὶν ἱερεῖς γεγονότες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/020.yaml
  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: fr
  text: Et, dans la mesure où cela ne s’est pas fait sans serment (car, d’une part, ceux-là sont devenus prêtres sans serment[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans prestation de serment » ou « sans serment solennel ».'
    reason: L’expression ὁρκωμοσία peut désigner le serment lui-même ou l’acte de prêter serment.
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: Le connecteur est conservé afin de rattacher explicitement cette proposition au raisonnement précédent.
- source_word: καθ’ ὅσον
  choice: dans la mesure où
  rationale: Cette tournure conserve la valeur argumentative et proportionnelle de l’expression grecque, dont la conséquence apparaît au verset 22.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: cela ne s’est pas fait sans serment
  rationale: La double négation est maintenue. « Cela » explicite sobrement en français l’établissement comme prêtre sous-entendu par le contexte.
- source_word: οἱ μὲν γὰρ
  choice: car, d’une part, ceux-là
  rationale: « Car » rend la fonction explicative de γάρ, tandis que « d’une part » préserve l’anticipation du contraste μέν…δέ poursuivi au verset suivant. « Ceux-là » renvoie aux prêtres précédemment évoqués sans les identifier davantage dans le texte.
- source_word: χωρὶς ὁρκωμοσίας
  choice: sans serment
  rationale: La formulation répétée reste cohérente avec la première occurrence; elle est concise et naturelle en français.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: sont devenus prêtres
  rationale: Le passé composé rend la construction périphrastique qui présente leur accession accomplie à la prêtrise et l’état qui en résulte.
theological_decisions:
- issue: Référent du contraste entre les prêtres antérieurs et le prêtre établi par serment
  choice: Le texte évoque « ceux-là » comme les prêtres déjà mentionnés et réserve le second terme du contraste au verset suivant.
  alternative: Préciser directement « les prêtres lévitiques » ou « Jésus ».
  rationale: Le contexte établit ce contraste, mais le présent verset ne nomme pas explicitement les groupes. La traduction évite donc d’ajouter une précision théologique absente de cette proposition.
- issue: Portée de καθ’ ὅσον
  choice: Conserver la tournure proportionnelle « dans la mesure où ».
  alternative: Employer la tournure purement causale « puisque ».
  rationale: La formulation retenue préserve le lien gradué avec la conclusion du verset 22 au lieu de réduire l’expression à une simple cause.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase et la parenthèse restent volontairement ouvertes, puisque la syntaxe grecque se poursuit aux versets 21-22. « D’une part » conserve le contraste formel annoncé par μέν, malgré son caractère légèrement plus littéraire.
