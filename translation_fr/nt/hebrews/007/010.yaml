id: HEB.7.10
reference: Hebrews 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔτι γὰρ ἐν τῇ ὀσφύϊ τοῦ πατρὸς ἦν ὅτε συνήντησεν αὐτῷ ⸀Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: fr
  text: En effet, il était encore dans les reins de son père lorsque Melchisédek rencontra celui-ci[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « il était encore dans le corps de son ancêtre ». Le grec dit littéralement « dans les reins de son père », expression qui évoque ici la descendance ancestrale.'
    reason: Alternative lexicale explicitant un idiome grec tout en signalant son image littérale.
lexical_decisions:
- source_word: ἔτι
  choice: encore
  rationale: Exprime la situation qui demeurait vraie au moment de la rencontre.
- source_word: γὰρ
  choice: En effet
  rationale: Marque le lien explicatif avec le verset précédent de façon naturelle en français.
- source_word: ἐν τῇ ὀσφύϊ
  choice: dans les reins
  rationale: Conserve l'image concrète grecque, qui désigne ici l'origine procréative et la descendance ancestrale.
- source_word: τοῦ πατρὸς
  choice: de son père
  rationale: Respecte la formulation grecque sans remplacer le terme par le nom explicite d'Abraham.
- source_word: ἦν
  choice: était
  rationale: Rend directement l'imparfait du verbe être.
- source_word: ὅτε
  choice: lorsque
  rationale: Introduit naturellement le moment de la rencontre dans un registre digne et courant.
- source_word: συνήντησεν
  choice: rencontra
  rationale: Rend sobrement l'aoriste du verbe signifiant rencontrer.
- source_word: αὐτῷ
  choice: celui-ci
  rationale: Renvoie sans ajout explicatif au père, c'est-à-dire Abraham dans le contexte, tout en évitant en français l'ambiguïté excessive de deux pronoms masculins successifs.
- source_word: Μελχισέδεκ
  choice: Melchisédek
  rationale: Suit la forme française traditionnelle et largement reconnue de ce nom propre.
theological_decisions:
- issue: Représentation idiomatique de la descendance de Lévi à partir d'Abraham
  choice: Conserver dans le texte l'expression concrète « dans les reins de son père »
  alternative: « dans le corps de son ancêtre » ou « dans la descendance de son ancêtre »
  rationale: L'argument présente Lévi comme étant en Abraham au sens ancestral et procréatif. Garder l'image rend visible la logique de l'auteur sans lui substituer une explication théologique.
- issue: Identification du « père »
  choice: Traduire « son père » sans insérer le nom d'Abraham
  alternative: « son ancêtre Abraham »
  rationale: Même si le contexte identifie clairement Abraham, le grec dit littéralement « son père »; cette formulation préserve le degré d'explicitation du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » assure la liaison argumentative; « celui-ci » clarifie que Melchisédek rencontre le père mentionné, sans ajouter le nom d'Abraham. L'image inhabituelle des « reins » est maintenue et expliquée en note.
