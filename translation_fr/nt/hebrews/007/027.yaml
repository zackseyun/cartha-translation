source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: fr
  text: Il n’a pas besoin, jour après jour[a], comme les grands prêtres, d’offrir des sacrifices, d’abord pour ses propres péchés, puis pour ceux du peuple[b] — car cela, il l’a fait une fois pour toutes[c] en s’offrant lui-même[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quotidiennement ». L’expression grecque évoque une nécessité répétée chaque jour.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « puis ceux du peuple »; le mot « péchés » est sous-entendu en grec.
    reason: source_ellipsis
  - marker: c
    text: Ou « une fois, définitivement ».
    reason: lexical_alternative
  - marker: d
    text: Ou « lorsqu’il s’est offert lui-même » ou « après s’être offert lui-même ».
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: jour après jour
  rationale: Cette expression naturelle rend la répétition quotidienne exprimée par l’idiome grec, sans suggérer simplement une fréquence habituelle.
- source_word: ἀνάγκην
  choice: besoin
  rationale: Dans la construction ἔχει ἀνάγκην, « avoir besoin » est l’équivalent français le plus naturel et conserve l’idée de nécessité.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: comme les grands prêtres
  rationale: Le pluriel du grec est conservé et la comparaison avec les grands prêtres lévitiques reste explicite.
- source_word: πρότερον ... ἔπειτα
  choice: d’abord ... puis
  rationale: Ce couple rend clairement l’ordre successif des offrandes sacrificielles.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: pour ses propres péchés
  rationale: Avec le vocabulaire sacrificiel, ὑπέρ se rend naturellement par « pour ».
- source_word: θυσίας ἀναφέρειν
  choice: offrir des sacrifices
  rationale: Dans ce contexte cultuel, ἀναφέρω désigne l’action d’offrir un sacrifice; la formulation française est précise et courante.
- source_word: τῶν τοῦ λαοῦ
  choice: ceux du peuple
  rationale: La formulation conserve l’ellipse grecque, où « péchés » est sous-entendu, tout en restant immédiatement compréhensible en français.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: car cela, il l’a fait
  rationale: « Cela » préserve le renvoi anaphorique de τοῦτο sans en préciser artificiellement la portée.
- source_word: ἐφάπαξ
  choice: une fois pour toutes
  rationale: Cette expression rend à la fois l’unicité et le caractère définitif de l’acte.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: en s’offrant lui-même
  rationale: La tournure conserve la valeur sacrificielle de ἀναφέρω et laisse entendre le rapport de moyen ou de circonstance du participe aoriste.
theological_decisions:
- issue: Portée de « cela » dans la proposition explicative
  choice: La traduction conserve le pronom démonstratif sans expliciter son référent.
  alternative: Préciser que « cela » désigne uniquement l’offrande pour les péchés du peuple.
  rationale: Le grec laisse formellement ouverte la portée immédiate de τοῦτο. Le contexte de l’épître distingue Jésus des grands prêtres pécheurs, mais la traduction ne doit pas remplacer le démonstratif par une interprétation explicitée.
- issue: Nature sacrificielle de l’offrande de Jésus
  choice: « en s’offrant lui-même »
  alternative: « en se donnant lui-même »
  rationale: Le verbe grec reprend le vocabulaire de l’offrande sacrificielle; « se donnant » en atténuerait la portée sacerdotale.
- issue: Relation exprimée par le participe ἀνενέγκας
  choice: La principale retient une valeur de moyen avec « en s’offrant ».
  alternative: 'Valeur temporelle : « lorsqu’il s’est offert »; participe antérieur : « après s’être offert ».'
  rationale: Le participe peut être compris comme exprimant le moyen ou la circonstance temporelle. La note maintient cette diversité possible sans imposer une analyse unique.
translation_notes:
  register: Français international moderne, digne et accessible. « Grands prêtres » et « offrir des sacrifices » maintiennent le registre sacerdotal sans archaïsme. Le tiret signale la proposition explicative parenthétique du grec tout en préservant la continuité de la phrase.
