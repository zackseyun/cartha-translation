  text: 'en disant[a] : « Assurément, je te bénirai abondamment et je te multiplierai abondamment. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « bénissant, je te bénirai, et multipliant, je te multiplierai » ; les deux répétitions sont emphatiques et font écho à Genèse 22.17.'
    reason: Préserve la construction grecque redoublée et son lien intertextuel, tout en expliquant l’emphase rendue idiomatiquement dans le texte.
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit directement le contenu du serment divin et maintient le lien syntaxique avec le verset précédent.
- source_word: Εἰ μὴν
  choice: Assurément
  rationale: Dans cette formule de serment, l’expression grecque marque une affirmation solennelle et énergique, non une condition.
- source_word: εὐλογῶν εὐλογήσω
  choice: je te bénirai abondamment
  rationale: La reprise du même verbe est une tournure emphatique issue de la formulation sémitique reprise par la Septante. L’adverbe transmet cette insistance dans un français naturel.
- source_word: σε
  choice: te
  rationale: Le pronom de la deuxième personne du singulier désigne Abraham, destinataire de la promesse citée.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux volets parallèles de la promesse.
- source_word: πληθύνων πληθυνῶ σε
  choice: je rendrai ta descendance très nombreuse
  rationale: Au sens littéral, le grec dit « je te multiplierai »; dans la promesse faite à Abraham, cette expression signifie qu’il deviendra nombreux par sa descendance. La formulation retenue est claire en français moderne tout en conservant l’idée d’une multiplication fortement affirmée.
theological_decisions:
- issue: Expression de la promesse faite sous serment à Abraham
  choice: Rendre les deux constructions redoublées par des formulations françaises intensives, tout en explicitant la descendance dans le second membre.
  alternative: « Assurément, te bénissant, je te bénirai, et te multipliant, je te multiplierai. »
  rationale: Le calque reproduirait la forme grecque, elle-même tributaire de la tournure emphatique de Genèse 22.17, mais serait artificiel et obscur en français actuel. La traduction conserve la solennité, le parallélisme et l’intensité sans transformer l’affirmation en interprétation doctrinale.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Assurément » convient au langage du serment; les adverbes et la formulation sur la descendance rendent l’emphase sans calque pesant.
