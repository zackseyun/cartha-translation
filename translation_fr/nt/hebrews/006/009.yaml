source:
  edition: SBLGNT
  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: fr
  text: Mais, en ce qui vous concerne, bien-aimés, nous sommes convaincus de réalités meilleures, liées au salut[a], même si nous parlons ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui accompagnent le salut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: nous sommes convaincus
  rationale: Le parfait exprime un état de conviction établi; cette formulation est naturelle en français moderne et conserve l’assurance de l’auteur.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec le sévère avertissement des versets précédents.
- source_word: περὶ ὑμῶν
  choice: en ce qui vous concerne
  rationale: Rend directement περί avec le génitif dans un registre à la fois digne et courant.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Le vocatif exprime une affection profonde; « bien-aimés » en préserve la chaleur et la gravité communautaire.
- source_word: τὰ κρείσσονα
  choice: des choses meilleures
  rationale: L’adjectif comparatif neutre substantivé garde ainsi sa force comparative sans préciser ce que sont ces réalités.
- source_word: ἐχόμενα σωτηρίας
  choice: qui se rattachent au salut
  rationale: Cette expression rend le lien avec le salut sans imposer une relation plus précise de preuve, d’effet ou de cause; l’autre sens plausible, « qui accompagnent le salut », est signalé en note.
- source_word: εἰ καὶ
  choice: même si
  rationale: Rend naturellement la valeur concessive de l’expression grecque.
- source_word: οὕτως
  choice: ainsi
  rationale: Renvoie de façon concise à la teneur et à la manière du sévère avertissement précédent.
- source_word: λαλοῦμεν
  choice: nous parlons
  rationale: Traduction simple et directe du présent de λαλέω.
theological_decisions:
- issue: Rapport entre ἐχόμενα et σωτηρίας dans le contexte d’un passage d’avertissement
  choice: « qui se rattachent au salut »
  alternative: « qui accompagnent le salut »; « qui conduisent au salut »
  rationale: Le texte affirme que les destinataires sont associés à des réalités liées au salut, sans définir celles-ci comme preuves, accompagnements, effets ou causes. La traduction maintient cette tension théologique et évite de trancher un débat doctrinal ultérieur.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la première proposition a été légèrement réorganisé pour éviter une tournure lourde, tout en conservant l’accent pastoral de « bien-aimés » et le contraste avec l’avertissement précédent.
