id: HEB.6.10
reference: Hebrews 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: fr
  text: Car Dieu n’est pas injuste au point d’oublier votre œuvre et l’amour que vous avez manifesté pour son nom[a], en ayant servi les saints[b] et en continuant de les servir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de son nom » ou « pour l’honneur de son nom ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « les saints » désigne les croyants, le peuple saint de Dieu, et non une catégorie de personnes canonisées ultérieurement.
    reason: cultural_note
  - marker: c
    text: Le grec distingue le service déjà accompli du service qui se poursuit encore.
    reason: aspectual_note
lexical_decisions:
- source_word: ἄδικος
  choice: injuste
  rationale: « Injuste » exprime naturellement l’idée que Dieu ne manquerait pas à la justice en oubliant leur œuvre.
- source_word: ἐπιλαθέσθαι
  choice: oublier
  rationale: Ce choix conserve le sens direct du verbe, tout en laissant entendre que Dieu ne négligera pas de prendre leurs actes en considération.
- source_word: ἔργου
  choice: œuvre
  rationale: Le singulier collectif désigne ici l’ensemble de leur activité fidèle; « œuvre » garde la forme du grec et convient au registre biblique moderne.
- source_word: ἀγάπης
  choice: amour
  rationale: Équivalent direct et naturel de ἀγάπη dans ce contexte de dévouement concret.
- source_word: ἐνεδείξασθε
  choice: vous avez manifesté
  rationale: Le verbe signifie rendre visible ou démontrer; « manifesté » exprime une preuve concrète de l’amour.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: pour son nom
  rationale: Cette formulation concise préserve le motif biblique du « nom » et peut exprimer l’orientation vers lui, l’honneur qui lui est rendu ou l’action accomplie à cause de lui.
- source_word: διακονήσαντες
  choice: en servant
  rationale: Le participe aoriste renvoie au service déjà accompli; le contexte temporel est rendu par contraste avec « en continuant ».
- source_word: τοῖς ἁγίοις
  choice: les saints
  rationale: Le terme désigne les membres du peuple saint de Dieu, c’est-à-dire les croyants, sans référence à une catégorie postérieure de personnes canonisées.
- source_word: διακονοῦντες
  choice: en continuant à les servir
  rationale: Cette formulation rend explicitement l’aspect présent du participe et son contraste avec le service déjà accompli.
theological_decisions:
- issue: La justice de Dieu et la valeur des œuvres des croyants
  choice: Le texte affirme que Dieu, parce qu’il est juste, n’oublie pas leur œuvre et leur amour.
  alternative: Comprendre que les œuvres humaines placent Dieu sous une obligation méritoire de salut ou de récompense.
  rationale: Le verset relie explicitement la mémoire divine à sa justice, mais ne précise ni que ces œuvres procurent le salut ni la nature d’une éventuelle récompense. La traduction conserve cette tension sans ajouter de doctrine.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « n’est pas injuste au point de » rend clairement la construction infinitive grecque. « Œuvre » et « saints » maintiennent le vocabulaire biblique, avec une note pour prévenir un contresens culturel. Les deux participes sont formulés de manière à préserver le contraste entre action passée et action en cours.
