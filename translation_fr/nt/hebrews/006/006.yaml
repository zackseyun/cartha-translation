    rationale: La formule évoque facilement un intérêt commercial ou une action menée à titre personnel. « Pour eux-mêmes » rend naturellement le datif réfléchi ἑαυτοῖς sans ajouter cette connotation.
  - severity: low
    issue: « pour les amener à la repentance »
