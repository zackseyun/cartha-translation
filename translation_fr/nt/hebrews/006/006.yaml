  naturalness: 'La phrase reste volontairement fragmentaire, conformément à la dépendance envers Hébreux 6.4. La révision améliore les collocations françaises modernes : « ont fait défection » et « pour eux-mêmes ». « Les renouveler de nouveau en vue de la repentance » conserve plus précisément le lien entre ἀνακαινίζειν et εἰς μετάνοιαν que « les amener à la repentance ».'
  terminology: « Repentance » et « le Fils de Dieu » sont appropriés au registre biblique moderne. « Faire défection » évite de transformer le texte principal en étiquette théologique technique (« apostasie »), tout en gardant la gravité du verbe; l’alternative est signalée en note.
  issues:
