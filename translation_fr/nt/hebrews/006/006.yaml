source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: fr
  text: et qui ont fait défection[a], de les renouveler de nouveau en vue de la repentance[b], puisqu’ils crucifient de nouveau pour eux-mêmes le Fils de Dieu et l’exposent publiquement à la honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sont gravement détournés » ou « ont apostasié ». Le verbe grec désigne ici une défection grave.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « alors qu’ils crucifient de nouveau pour eux-mêmes le Fils de Dieu et l’exposent publiquement à la honte ». Les participes grecs peuvent exprimer une circonstance contemporaine aussi bien qu’une explication.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: qui sont tombés dans l’apostasie
  rationale: Le participe aoriste désigne ici une défection grave. Cette formulation française exprime clairement la portée du verbe sans préciser la nature doctrinale ou le caractère définitif de cette apostasie.
- source_word: πάλιν ἀνακαινίζειν
  choice: de les renouveler encore
  rationale: « Renouveler » conserve l’image lexicale d’un retour à un état antérieur, et « encore » rend la répétition exprimée par πάλιν.
- source_word: εἰς μετάνοιαν
  choice: pour les amener à la repentance
  rationale: La préposition εἰς indique le but ou le résultat. Cette tournure est naturelle en français et évite de laisser entendre que les personnes elles-mêmes sont le complément implicite de « repentance ».
- source_word: ἀνασταυροῦντας
  choice: puisqu’ils crucifient de nouveau
  rationale: Le participe présent peut expliquer la situation décrite; « de nouveau » rend le préfixe ἀνα- sans employer le rare « recrucifier ».
- source_word: ἑαυτοῖς
  choice: pour leur propre compte
  rationale: Le datif réflexif marque vraisemblablement la relation ou l’intérêt propre. La formulation conserve cette nuance tout en restant intelligible.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Traduction directe et consacrée du titre christologique.
- source_word: παραδειγματίζοντας
  choice: l’exposent publiquement à la honte
  rationale: Le verbe évoque une exposition publique au déshonneur; cette formulation en conserve les dimensions publique et sociale.
theological_decisions:
- issue: Dépendance syntaxique envers Hébreux 6.4-6
  choice: Le verset commence par « et » et conserve une construction dépendante du contexte précédent.
  alternative: Répéter ici « il est impossible » pour produire une phrase autonome.
  rationale: Dans le grec, l’infinitif dépend de l’affirmation d’impossibilité commencée au verset 4. Ne pas la répéter respecte la délimitation fournie et la syntaxe du passage.
- issue: Nature de la défection
  choice: « tombés dans l’apostasie » exprime une rupture grave sans en définir le statut sotériologique ni le caractère irréversible en soi.
  alternative: « se sont détournés » ou « ont commis une apostasie définitive ».
  rationale: Le verbe porte un avertissement fort, mais ne tranche pas à lui seul les débats ultérieurs sur la persévérance, la foi apparente ou la perte du salut.
- issue: Valeur des participes ἀνασταυροῦντας et παραδειγματίζοντας
  choice: Lecture explicative avec « puisqu’ils ».
  alternative: Lecture temporelle avec « tant qu’ils » ou « alors qu’ils ».
  rationale: Les participes peuvent indiquer la raison de l’impossibilité ou une circonstance contemporaine. Le texte principal retient la valeur explicative, tandis que la note signale l’autre possibilité réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure volontairement rattachée aux versets précédents. « Repentance » est conservé comme terme biblique courant; les notes préservent l’ambiguïté syntaxique et la gravité lexicale sans imposer une lecture confessionnelle.
