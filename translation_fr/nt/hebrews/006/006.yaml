  to: et qui ont fait défection[a], de les renouveler de nouveau en vue de la repentance[b], puisqu’ils crucifient de nouveau pour eux-mêmes le Fils de Dieu et l’exposent publiquement à la honte.
  rationale: La révision conserve la construction dépendante de 6.4, la répétition de πάλιν, la direction vers la repentance et l’ambiguïté raisonnable des participes finaux. Elle corrige des formulations françaises moins idiomatiques ou inutilement connotées, sans résoudre les débats théologiques associés au passage.
