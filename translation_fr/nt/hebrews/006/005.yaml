  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: fr
  text: et ont goûté la bonne parole de Dieu et les puissances[a] du monde à venir[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les miracles » ou « les actes puissants ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de l’ère à venir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: bonne
  rationale: Avec « parole », « bonne » exprime naturellement la valeur bénéfique et excellente de καλός sans surinterprétation.
- source_word: γευσαμένους
  choice: ont goûté
  rationale: Cette formulation conserve la métaphore de γεύομαι et poursuit naturellement en français la série participiale du contexte, sans préciser la profondeur de l’expérience.
- source_word: θεοῦ ῥῆμα
  choice: la parole de Dieu
  rationale: Cette expression française naturelle rend ῥῆμα et le génitif θεοῦ comme désignant la parole qui vient de Dieu.
- source_word: δυνάμεις
  choice: les puissances
  rationale: Le pluriel « puissances » maintient ouverte la possibilité de forces, de manifestations de puissance ou d’actes miraculeux, au lieu de réduire le sens aux seuls miracles.
- source_word: τε
  choice: et
  rationale: « Et » rend simplement et naturellement la fonction coordinatrice de τε.
- source_word: μέλλοντος αἰῶνος
  choice: du monde à venir
  rationale: « Le monde à venir » est une expression eschatologique française courante pour αἰών, tout en gardant en note l’équivalent plus formel « l’ère à venir ».
theological_decisions:
- issue: Sens de « goûter » dans le contexte du passage d’avertissement
  choice: Conserver « ont goûté » sans amplifier ni minimiser l’expérience.
  alternative: « ont fait l’expérience de » ou « n’ont fait que goûter »
  rationale: La métaphore grecque ne tranche pas à elle seule la question débattue de la profondeur de la participation des personnes décrites. La traduction préserve donc cette tension.
- issue: Portée de δυνάμεις dans le contexte eschatologique
  choice: Traduire par « puissances ».
  alternative: « miracles » ou « actes puissants »
  rationale: Le terme peut viser des manifestations miraculeuses liées à l’irruption du monde futur, mais son sens peut être plus large. « Puissances » conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste liée syntaxiquement aux versets précédents et se termine donc par une virgule. Les notes suivent l’ordre des expressions auxquelles elles se rapportent.
