id: HEB.6.1
reference: Hebrews 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: fr
  text: C’est pourquoi, laissant derrière nous l’enseignement élémentaire au sujet du Messie[a], laissons-nous porter vers la maturité[b], sans poser de nouveau le fondement de la repentance qui détourne des œuvres mortes, et de la foi en Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «l’enseignement élémentaire du Messie» ou «le message des commencements concernant le Messie».
    reason: La chaîne de génitifs τῆς ἀρχῆς τοῦ Χριστοῦ permet plusieurs formulations proches.
  - marker: b
    text: Ou «vers la perfection» ou «vers l’état accompli».
    reason: τελειότης peut désigner la maturité, l’accomplissement ou la perfection.
  - marker: c
    text: Littéralement, «la foi dirigée vers Dieu»; on pourrait aussi traduire «la confiance en Dieu».
    reason: ἐπί avec l’accusatif conserve une nuance d’orientation vers Dieu.
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion exhortative tirée du contexte précédent.
- source_word: ἀφέντες
  choice: laissant derrière nous
  rationale: Conserve la valeur participiale et exprime un dépassement des rudiments sans suggérer leur rejet.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: l’enseignement élémentaire au sujet du Messie
  rationale: Dans ce contexte, λόγος désigne l’enseignement ou le message, et τῆς ἀρχῆς les notions initiales; «au sujet du Messie» rend clairement le rapport génitival sans en masquer l’ambiguïté, signalée en note.
- source_word: ἐπὶ τὴν τελειότητα
  choice: vers la maturité
  rationale: Exprime ici l’accès à un état accompli ou adulte, par contraste avec l’enseignement élémentaire, sans imposer l’idée de perfection absolue.
- source_word: φερώμεθα
  choice: laissons-nous porter
  rationale: Préserve la forme passive du grec, contrairement à une simple formulation active telle que «avançons».
- source_word: θεμέλιον καταβαλλόμενοι
  choice: sans poser de nouveau le fondement
  rationale: Maintient la métaphore de la construction dans une formulation française naturelle.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: de la repentance qui détourne des œuvres mortes
  rationale: «Repentance» garde le sens religieux de μετανοία; la relative explicite naturellement en français la séparation exprimée par ἀπό, tandis que «œuvres mortes» conserve la métaphore sans la résoudre.
- source_word: πίστεως ἐπὶ θεόν
  choice: de la foi en Dieu
  rationale: Formulation française idiomatique pour la foi orientée vers Dieu; la nuance directionnelle est indiquée en note.
theological_decisions:
- issue: Le fait de «laisser» l’enseignement initial signifie-t-il l’abandonner?
  choice: La formulation décrit le dépassement de cet enseignement comme centre d’attention, et non son rejet.
  alternative: Abandonner l’enseignement au sujet du Messie.
  rationale: La suite, qui demande de ne pas poser de nouveau le fondement, présente ces éléments comme acquis et appelle à progresser à partir d’eux.
- issue: τελειότης désigne-t-il la maturité ou la perfection?
  choice: maturité
  alternative: perfection; état accompli
  rationale: Le contraste avec les rudiments favorise l’idée de maturité, mais les autres possibilités lexicales sont conservées en note.
- issue: Faut-il conserver le passif de φερώμεθα?
  choice: laissons-nous porter
  alternative: avançons; allons de l’avant
  rationale: Le passif grec est théologiquement et rhétoriquement significatif; il ne convient pas de le transformer sans nécessité en action purement autonome.
- issue: Sens de «œuvres mortes»
  choice: Conserver l’expression sans définir si ces œuvres sont stériles, liées à la mort ou produisant la mort.
  alternative: œuvres stériles; œuvres qui conduisent à la mort
  rationale: Le grec reste condensé et susceptible de plusieurs nuances; la traduction ne doit pas en imposer une seule.
translation_notes:
  register: Français international moderne, digne et accessible. Le passif exhortatif «laissons-nous porter» conserve une particularité importante du grec. La phrase reste ample comme l’original, tout en étant ponctuée naturellement.
