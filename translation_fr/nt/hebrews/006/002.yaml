source:
  edition: SBLGNT
  text: βαπτισμῶν ⸀διδαχὴν ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς ⸀τε νεκρῶν καὶ κρίματος αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: fr
  text: l’enseignement sur les ablutions[a], l’imposition des mains, la résurrection des morts et le jugement éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « baptêmes ». Le pluriel grec peut désigner plus largement des lavages rituels, et pas nécessairement le baptême chrétien en particulier.
    reason: Alternative lexicale et préservation de l’ambiguïté du pluriel grec.
lexical_decisions:
- source_word: βαπτισμῶν
  choice: ablutions
  rationale: Le pluriel grec peut désigner plus largement des lavages rituels, et pas nécessairement le baptême chrétien. « Ablutions » conserve cette portée cultuelle et le pluriel sans suggérer des baptêmes chrétiens répétés.
- source_word: διδαχὴν
  choice: l’enseignement
  rationale: Le nom poursuit la liste des éléments fondamentaux commencée au verset précédent. « L’enseignement sur » introduit naturellement les génitifs qui suivent.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: l’imposition des mains
  rationale: Expression française courante et digne pour cette pratique, correspondant directement à la construction grecque.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: la résurrection des morts
  rationale: Rendu français établi qui préserve la valeur collective de νεκρῶν.
- source_word: κρίματος αἰωνίου
  choice: le jugement éternel
  rationale: Traduit κρίμα comme « jugement », sans le réduire à la seule condamnation, et rend αἰώνιος par son équivalent eschatologique naturel.
- source_word: τε ... τε καὶ
  choice: énumération coordonnée par des virgules et « et »
  rationale: Les particules structurent l’énumération; une coordination française simple en restitue naturellement la fonction.
theological_decisions:
- issue: Sens de βαπτισμῶν dans la liste des enseignements élémentaires
  choice: « ablutions »
  alternative: « baptêmes »
  rationale: Le pluriel et l’usage lexical permettent, et favorisent probablement ici, le sens de lavages rituels. Le choix principal évite d’imposer une lecture sacramentelle précise, tandis que la note conserve l’autre possibilité.
- issue: Portée de κρίματος αἰωνίου
  choice: « jugement éternel »
  alternative: « condamnation éternelle »
  rationale: Le grec parle de jugement et n’en précise pas ici l’issue. La traduction ne restreint donc pas indûment le terme à la condamnation.
translation_notes:
  register: Français international moderne, clair et digne. « Ablutions » est légèrement soutenu, mais reste précis et largement compréhensible dans un contexte religieux; la note donne l’alternative « baptêmes ».
