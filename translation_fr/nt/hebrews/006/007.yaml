id: HEB.6.7
reference: Hebrews 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: fr
  text: En effet, une terre qui boit la pluie tombant souvent sur elle et qui produit une végétation utile à ceux pour qui elle est aussi cultivée reçoit une bénédiction de Dieu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des plantes », « de l’herbe » ou « une récolte » au lieu de « une végétation ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à ceux par qui elle est cultivée »; toutefois, « pour qui elle est cultivée » reflète mieux ici διά suivi de l’accusatif.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: terre
  rationale: Dans cette métaphore agricole, « terre » désigne naturellement une étendue cultivable, sans la portée cosmique que pourrait avoir le même mot dans d’autres contextes.
- source_word: πιοῦσα
  choice: qui boit
  rationale: Cette formulation conserve l’image vive et personnifiée du grec plutôt que de l’aplatir par « absorbe ».
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: la pluie tombant souvent sur elle
  rationale: La tournure est naturelle en français et conserve à la fois la fréquence exprimée par πολλάκις et le mouvement de la pluie vers la terre.
- source_word: τίκτουσα
  choice: qui produit
  rationale: « Produit » est une expression française actuelle et naturelle pour ce que fait une terre féconde, tout en gardant le sens génératif du participe.
- source_word: βοτάνην
  choice: une végétation
  rationale: « Végétation » préserve la portée assez large du terme grec, qui peut désigner des plantes, de l’herbe ou une production végétale sans préciser une culture particulière.
- source_word: εὔθετον
  choice: utile
  rationale: Le terme exprime ce qui est approprié à un usage; « utile » convient clairement au contexte agricole.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: à ceux pour qui elle est aussi cultivée
  rationale: διά avec l’accusatif indique ici le plus naturellement la raison ou le bénéficiaire (« pour qui »), plutôt que les agents qui cultivent la terre. « Aussi » rend καί.
- source_word: γεωργεῖται
  choice: elle est aussi cultivée
  rationale: « Cultivée » rend largement et naturellement le travail agricole de la terre, sans le limiter au labour.
- source_word: μεταλαμβάνει
  choice: reçoit
  rationale: Dans ce contexte, « reçoit » exprime simplement et idiomatiquement l’obtention de la bénédiction.
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: une bénédiction de Dieu
  rationale: L’article indéfini est naturel en français pour le nom comptable « bénédiction »; « de Dieu » rend clairement l’origine exprimée par ἀπό.
theological_decisions:
- issue: Métaphore agricole dans le contexte de l’avertissement
  choice: Conserver directement la métaphore sans ajouter de conclusion doctrinale sur la persévérance ou l’apostasie.
  alternative: Interpréter explicitement la terre féconde comme les vrais croyants ou comme les croyants approuvés par Dieu.
  rationale: Le verset présente le côté positif de l’analogie agricole, mais ne définit pas lui-même l’identité doctrinale précise de la terre ou de ses bénéficiaires. La traduction laisse donc subsister la tension du passage.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la personnification de la terre qui « boit » la pluie, ainsi que la structure proverbiale et agricole du grec. Les deux notes signalent une latitude lexicale réelle et l’ambiguïté possible du rapport entre les bénéficiaires et les cultivateurs.
