id: HEB.6.19
reference: Hebrews 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: fr
  text: Cette espérance, nous l’avons comme une ancre pour l’âme, sûre et solide, qui pénètre dans le lieu intérieur, au-delà du rideau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le lieu intérieur, derrière le voile »; ou : « à l’intérieur du voile ».'
    reason: Alternative lexicale et syntaxique pour εἰς τὸ ἐσώτερον τοῦ καταπετάσματος.
lexical_decisions:
- source_word: ἣν
  choice: Cette espérance
  rationale: Le pronom relatif féminin reprend explicitement « l’espérance » du verset précédent. La reprise nominale est naturelle en français et clarifie l’antécédent sans rompre le lien contextuel.
- source_word: ὡς ἄγκυραν
  choice: comme une ancre
  rationale: ὡς introduit ici une comparaison; « comme une ancre » conserve directement la métaphore.
- source_word: ἔχομεν
  choice: nous l’avons
  rationale: Le présent « avoir » rend simplement le verbe grec; le pronom reprend « cette espérance ».
- source_word: τῆς ψυχῆς
  choice: pour l’âme
  rationale: Dans la métaphore, le génitif indique naturellement ce que l’ancre stabilise. « Pour l’âme » est plus idiomatique en français que « de l’âme », tout en conservant ψυχή sans le réduire à la seule vie psychique.
- source_word: ἀσφαλῆ
  choice: sûre
  rationale: Le terme exprime la sécurité et la fiabilité; « sûre » convient à l’image de l’ancre et reste distinct de βεβαίαν.
- source_word: τε καὶ
  choice: et
  rationale: La coordination grecque associe étroitement les deux qualités. En français, « sûre et solide » rend cette association plus naturellement qu’une tournure lourde avec « à la fois ».
- source_word: βεβαίαν
  choice: solide
  rationale: Le mot évoque ce qui est ferme et stable. « Solide » prolonge naturellement l’image nautique sans se confondre avec « sûre ».
- source_word: εἰσερχομένην
  choice: qui pénètre
  rationale: Le participe s’accorde avec « ancre ». Une proposition relative est idiomatique en français; « pénètre » exprime le mouvement vers l’intérieur sans expliquer davantage la métaphore.
- source_word: εἰς τὸ ἐσώτερον
  choice: dans le lieu intérieur
  rationale: L’adjectif substantivé désigne l’espace intérieur du sanctuaire. « Le lieu intérieur » préserve la formulation sans identifier explicitement le Saint des saints.
- source_word: τοῦ καταπετάσματος
  choice: au-delà du rideau
  rationale: Le génitif délimite ici l’espace intérieur situé de l’autre côté du rideau du sanctuaire. « Au-delà du rideau » rend clairement cette relation spatiale, tandis que la note conserve d’autres formulations possibles.
theological_decisions:
- issue: Imagerie cultuelle du sanctuaire céleste
  choice: « le lieu intérieur, au-delà du rideau »
  alternative: « l’intérieur du voile » ou « derrière le voile »
  rationale: La formulation conserve l’image du sanctuaire et l’accès au-delà de sa séparation, sans préciser prématurément le référent ni ajouter une interprétation doctrinale. « Rideau » est courant et concret; la note signale « voile », terme traditionnel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’image frappante d’une ancre qui entre au-delà du rideau, sans la rationaliser ni expliciter davantage le sanctuaire.
