source:
  edition: SBLGNT
  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: fr
  text: là où Jésus est entré comme précurseur pour nous[a], lui qui est devenu grand prêtre pour toujours selon l’ordre de Melchisédek[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en notre faveur ». L’expression grecque peut désigner une action accomplie au bénéfice d’autres personnes ; ici, elle souligne que Jésus est entré comme leur représentant.
    reason: lexical_alternative
  - marker: b
    text: Cette expression reprend le Psaume 110.4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: là où
  rationale: Renvoie au lieu situé au-delà du rideau, mentionné au verset précédent, tout en conservant la valeur locative du grec.
- source_word: πρόδρομος
  choice: en précurseur
  rationale: Désigne celui qui entre le premier et ouvre ainsi la voie à ceux qui le suivront.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: Formulation française naturelle qui garde la notion de bénéfice et de représentation sans imposer ici le sens plus étroit de « à notre place ».
- source_word: εἰσῆλθεν
  choice: est entré
  rationale: Le passé composé rend naturellement l’aoriste grec et présente l’entrée de Jésus comme un fait accompli dont la portée demeure.
- source_word: ἀρχιερεὺς γενόμενος
  choice: lui qui est devenu grand prêtre
  rationale: Conserve le sens verbal du participe tout en l’appliquant clairement à l’accès de Jésus à la fonction sacerdotale.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: selon l’ordre de Melchisédek
  rationale: Rend la correspondance ou l’ordre sacerdotal exprimé par le grec et maintient l’écho du Psaume 110.4.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Équivalent idiomatique et clair de l’expression grecque marquant une permanence sans fin.
theological_decisions:
- issue: Portée christologique de γενόμενος (« devenu »)
  choice: lui qui est devenu grand prêtre
  alternative: lui qui a été établi grand prêtre
  rationale: Le propos concerne l’entrée de Jésus dans sa fonction sacerdotale, non un commencement d’existence ni un changement de nature. La formulation conserve néanmoins le verbe grec au lieu de le remplacer par une interprétation explicative.
- issue: Valeur de ὑπὲρ ἡμῶν
  choice: pour nous
  alternative: en notre faveur ; à notre place
  rationale: Le contexte présente Jésus entrant le premier au bénéfice des croyants et comme leur représentant. « Pour nous » préserve cette amplitude sans réduire l’expression à une formule substitutive plus précise que le verset.
translation_notes:
  register: Français international actuel, digne et accessible. « Précurseur » conserve l’image de celui qui entre le premier pour ouvrir la voie. La tournure « lui qui est devenu » évite une succession de participes peu naturelle en français tout en maintenant le lien avec la proposition principale.
