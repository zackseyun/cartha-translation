reference: Hebrews 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: fr
  text: afin que vous ne deveniez pas lents, mais des imitateurs de ceux qui, par la foi[a] et la patience, héritent des promesses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la confiance et la patience », voire « par la fidélité et la patience ». Le mot grec traduit par « foi » peut, selon le contexte, évoquer aussi la confiance ou la fidélité.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique possible de πίστις.
lexical_decisions:
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Cette tournure française naturelle conserve la nuance de but ou de résultat et relie le verset à l’exhortation précédente.
- source_word: νωθροὶ
  choice: lents à agir
  rationale: L’expression rend l’idée d’une réaction ou d’un effort spirituel émoussé et tardif, sans l’archaïsme d’« indolents » ni la condamnation morale plus appuyée de « paresseux ».
- source_word: γένησθε
  choice: deveniez
  rationale: Le verbe garde ici sa valeur d’entrée dans un état et exprime l’avertissement de ne pas devenir tels.
- source_word: μιμηταὶ
  choice: que vous imitiez
  rationale: La formulation verbale est idiomatique en français tout en préservant l’appel explicite à prendre d’autres croyants pour modèles.
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: « Foi » est le rendu français usuel de πίστις et conserve ici l’idée large de confiance en Dieu, sans exclure une nuance de fidélité.
- source_word: μακροθυμίας
  choice: patience
  rationale: Le terme désigne la capacité d’attendre et de persévérer dans la durée; « patience » est clair, actuel et n’empiète pas indûment sur le vocabulaire plus spécifique de l’endurance.
- source_word: κληρονομούντων
  choice: héritent
  rationale: Le présent français caractérise naturellement ces personnes comme celles qui reçoivent les promesses en héritage.
- source_word: τὰς ἐπαγγελίας
  choice: des promesses
  rationale: Le pluriel explicite est conservé et maintient l’écho du thème des promesses divines dans l’épître.
theological_decisions:
- issue: Sens de πίστις dans une exhortation où confiance et fidélité peuvent se recouvrir
  choice: foi
  alternative: confiance ou fidélité
  rationale: « Foi » préserve l’étendue théologique et la cohérence lexicale du terme sans trancher artificiellement entre confiance en Dieu et fidélité vécue; la possibilité de ces nuances est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Lents à agir » rend concrètement νωθροί pour un lectorat ordinaire. La structure a été légèrement verbalisée (« que vous imitiez ») afin d’éviter la lourdeur de « deveniez… des imitateurs », tout en conservant le contraste et le sens du grec.
