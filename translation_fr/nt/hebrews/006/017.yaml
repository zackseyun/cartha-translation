id: HEB.6.17
reference: Hebrews 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: fr
  text: Ainsi, Dieu, voulant montrer plus clairement aux héritiers de la promesse le caractère immuable de son dessein[a], l’a garanti par un serment[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’immutabilité de son conseil ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « est intervenu par un serment » ou « s’est porté garant par un serment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Ainsi
  rationale: La locution reprend le raisonnement précédent et introduit la manière dont Dieu a voulu donner une assurance supplémentaire. « Ainsi » rend clairement ce lien logique en français moderne.
- source_word: περισσότερον
  choice: plus clairement
  rationale: Avec ἐπιδεῖξαι, le comparatif intensifie la manifestation du dessein divin. « Plus clairement » est naturel et exprime que Dieu voulait en donner une démonstration particulièrement nette.
- source_word: βουλόμενος
  choice: voulant
  rationale: Le participe exprime ici une intention délibérée de Dieu, et non un simple souhait incertain.
- source_word: ἐπιδεῖξαι
  choice: montrer
  rationale: « Montrer » restitue directement le sens du verbe; l’intensification est portée par « plus clairement ».
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: aux héritiers de la promesse
  rationale: Cette formulation conserve l’image juridique et testamentaire de κληρονόμοις ainsi que le génitif explicite « de la promesse ».
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: le caractère immuable de son dessein
  rationale: Le neutre substantivé τὸ ἀμετάθετον désigne la qualité de ce qui ne peut être changé. « Dessein » rend la décision réfléchie exprimée par βουλή sans recourir au terme plus technique « conseil ».
- source_word: ἐμεσίτευσεν
  choice: l’a garanti
  rationale: Le verbe évoque littéralement une intervention en qualité de médiateur ou de garant. Dans ce contexte, « l’a garanti » exprime clairement la fonction d’assurance du serment; le pronom reprend le caractère immuable du dessein divin.
- source_word: ὅρκῳ
  choice: par un serment
  rationale: Le datif est instrumental et indique le moyen par lequel Dieu a apporté cette garantie.
theological_decisions:
- issue: Exprimer l’immutabilité du dessein de Dieu sans introduire une catégorie métaphysique étrangère au verset
  choice: le caractère immuable de son dessein
  alternative: l’immutabilité de son conseil
  rationale: La formulation retenue affirme pleinement que le dessein divin ne change pas, tout en restant accessible et proche de la construction grecque.
- issue: Déterminer la portée de ἐμεσίτευσεν associé au serment divin
  choice: l’a garanti par un serment
  alternative: est intervenu par un serment
  rationale: Le contexte souligne l’assurance supplémentaire donnée aux héritiers. « Garanti » rend cette fonction sans laisser entendre qu’un tiers aurait servi de médiateur entre Dieu et lui-même; la note conserve toutefois la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’enchaînement solennel du grec tout en évitant les formulations archaïques. Les notes sont placées après les expressions auxquelles elles se rapportent.
