id: HEB.6.15
reference: Hebrews 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὕτως μακροθυμήσας ἐπέτυχεν τῆς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: fr
  text: Et ainsi, après avoir patienté, il obtint la promesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il reçut ce qui avait été promis ». Le grec dit plus littéralement « il obtint la promesse ».
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ οὕτως
  choice: Et ainsi
  rationale: Rend le lien avec ce qui précède ainsi que l’idée de manière ou de conséquence, dans un français naturel et digne.
- source_word: μακροθυμήσας
  choice: après avoir patienté
  rationale: Le participe aoriste exprime ici naturellement une circonstance temporelle. « Patienter » fait ressortir l’attente persévérante impliquée par μακροθυμέω sans alourdir la phrase.
- source_word: ἐπέτυχεν
  choice: obtint
  rationale: Le verbe exprime le fait d’atteindre ou d’obtenir. « Obtint » préserve cette nuance et s’accorde avec le complément « la promesse ».
- source_word: τῆς ἐπαγγελίας
  choice: la promesse
  rationale: Cette traduction formelle conserve le nom grec au singulier et son lien lexical avec la promesse divine mentionnée dans le contexte, sans identifier explicitement la promesse à son plein accomplissement.
theological_decisions:
- issue: Le texte affirme-t-il qu’Abraham a reçu le plein accomplissement de la promesse, ou qu’il a obtenu la promesse elle-même ?
  choice: il obtint la promesse
  alternative: il reçut ce qui avait été promis
  rationale: Le grec dit littéralement qu’il « obtint la promesse ». Garder cette formulation préserve l’ambiguïté entre la parole promise et son contenu réalisé, sans imposer l’idée d’un accomplissement intégral.
translation_notes:
  register: Français international moderne, sobre et accessible. Le passé simple convient au registre narratif digne de la traduction biblique, tandis que « après avoir patienté » reste courant et clair.
