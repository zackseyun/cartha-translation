id: HEB.6.18
reference: Hebrews 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: fr
  text: afin que, par deux choses immuables, dans lesquelles il est impossible que Dieu mente, nous ayons un ferme encouragement, nous qui avons fui pour trouver refuge, à saisir l’espérance qui nous est proposée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat découlant du verset précédent et appelle naturellement le subjonctif en français.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: par deux réalités immuables
  rationale: « Réalités » garde la portée assez large de πράγματα tout en renvoyant naturellement à la promesse et au serment de Dieu; « immuables » exprime ce qui ne peut être changé.
- source_word: ἐν οἷς
  choice: dans lesquelles
  rationale: Conserve le lien relatif explicite avec les deux réalités précédentes sans préciser davantage leur identité.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: il est impossible que Dieu mente
  rationale: Reproduit la construction impersonnelle et solennelle du grec sans l’élargir en affirmation philosophique.
- source_word: ἰσχυρὰν παράκλησιν
  choice: un puissant encouragement
  rationale: παράκλησις désigne ici l’encouragement ou le réconfort qui affermit; « encouragement » convient au mouvement du passage, et « puissant » rend l’intensité de ἰσχυράν.
- source_word: ἔχωμεν
  choice: nous ayons
  rationale: Le subjonctif français après « afin que » rend naturellement le subjonctif grec de but ou de résultat.
- source_word: οἱ καταφυγόντες
  choice: nous qui avons fui pour trouver refuge
  rationale: Préserve à la fois l’idée de fuite et celle de recherche d’un lieu sûr, plutôt que de réduire l’expression au seul fait de se réfugier.
- source_word: κρατῆσαι
  choice: à saisir
  rationale: 'Rend l’action vive de prendre fermement ou de s’emparer de quelque chose; une note signale le sens possible de persévérance: « rester fermement attachés ».'
- source_word: τῆς προκειμένης ἐλπίδος
  choice: l’espérance qui nous est proposée
  rationale: Exprime l’espérance placée devant les destinataires et offerte à leur saisie dans un français naturel.
theological_decisions:
- issue: Métaphores du refuge et de la saisie de l’espérance
  choice: Conserver « avons fui pour trouver refuge » et « saisir l’espérance »
  alternative: « nous qui avons cherché refuge » et « rester fermement attachés à l’espérance »
  rationale: Le grec associe une image d’asile à l’action énergique de saisir ou de tenir fermement l’espérance. La traduction maintient cette imagerie sans la remplacer par une formulation abstraite sur l’assurance.
- issue: Impossibilité pour Dieu de mentir
  choice: « il est impossible que Dieu mente »
  alternative: « Dieu ne peut pas mentir »
  rationale: La formulation retenue suit la construction impersonnelle du texte et affirme la véracité divine sans ajouter d’explication doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « nous qui…, nous ayons » est idiomatique et clarifie la longue phrase grecque. Les images concrètes du refuge et de la saisie sont conservées, tandis que les notes rendent visibles les principales possibilités lexicales.
