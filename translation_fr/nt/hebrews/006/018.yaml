  source_fidelity: 'Le sens du grec est bien conservé : le but introduit par ἵνα, les deux éléments inchangeables, l''impossibilité du mensonge divin, l''encouragement, la fuite vers un refuge et l''acte énergique de saisir l''espérance sont tous présents. « Choses » rend πράγματα plus directement et plus naturellement que « réalités », sans identifier indûment les deux éléments.'
