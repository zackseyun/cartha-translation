    rationale: πράγματα est volontairement général (« choses », « affaires », « faits »). En français moderne, « choses » conserve mieux cette généralité; « réalités » peut suggérer plus spécifiquement des réalités existentielles ou objectives.
  - severity: low
    issue: La construction « nous qui avons fui pour trouver refuge, nous ayons » est pesante.
    rationale: Le double « nous » est possible, mais inutile dans une phrase déjà longue. Le déplacement du groupe participial après le verbe principal maintient son rôle de qualification du sujet tout en améliorant la lisibilité.
