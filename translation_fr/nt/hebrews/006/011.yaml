id: HEB.6.11
reference: Hebrews 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιθυμοῦμεν δὲ ἕκαστον ὑμῶν τὴν αὐτὴν ἐνδείκνυσθαι σπουδὴν πρὸς τὴν πληροφορίαν τῆς ἐλπίδος ἄχρι τέλους,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/011.yaml
  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: fr
  text: Nous désirons que chacun de vous fasse preuve du même zèle, jusqu’à la fin[b], en vue de la pleine assurance[a] de l’espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleine certitude de l’espérance ». Le terme grec peut désigner la plénitude de la certitude ou de l’assurance.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’au terme ». L’expression souligne la persévérance jusqu’à l’accomplissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: nous désirons
  rationale: Le verbe exprime ici un désir pastoral vif et sincère. « Nous désirons » en garde la force sans suggérer une convoitise ni adopter un ton trop familier.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: La particule marque une transition légère avec ce qui précède. En français, l’enchaînement reste naturel sans connecteur explicite ; « mais » créerait un contraste trop prononcé.
- source_word: ἕκαστον ὑμῶν
  choice: chacun de vous
  rationale: Cette formulation naturelle conserve la portée distributive de l’expression et souligne que l’exhortation s’adresse personnellement à tous.
- source_word: τὴν αὐτὴν
  choice: du même
  rationale: L’expression renvoie au zèle déjà manifesté dans l’amour et le service évoqués au verset précédent.
- source_word: ἐνδείκνυσθαι
  choice: fasse preuve
  rationale: « Faire preuve de » rend naturellement l’idée de manifester concrètement ou de démontrer une qualité.
- source_word: σπουδὴν
  choice: zèle
  rationale: Dans ce contexte, le mot désigne un empressement sérieux et persévérant. « Zèle » est courant, digne et moins administratif que « diligence » en français moderne.
- source_word: πρὸς
  choice: afin que
  rationale: La préposition indique ici une orientation ou un but. La proposition finale rend clairement ce rapport en français naturel.
- source_word: πληροφορίαν
  choice: soit pleinement assurée
  rationale: Cette tournure exprime la plénitude de conviction ou d’assurance sans imposer exclusivement une lecture psychologique ou objective.
- source_word: ἐλπίδος
  choice: son espérance
  rationale: Le nom désigne l’attente confiante fondée sur la promesse de Dieu. Le possessif relie naturellement cette espérance à « chacun de vous ».
- source_word: ἄχρι τέλους
  choice: jusqu’à la fin
  rationale: La formule conserve la valeur temporelle et l’appel implicite à persévérer jusqu’à l’achèvement.
theological_decisions:
- issue: Rapport entre la pleine assurance de l’espérance et la persévérance
  choice: « afin que son espérance soit pleinement assurée jusqu’à la fin »
  alternative: « en vue de la pleine assurance de l’espérance jusqu’à la fin »
  rationale: La formulation française exprime une espérance parvenue à une pleine assurance et maintenue jusqu’à la fin, sans la réduire soit à un sentiment intérieur de certitude du salut, soit à la seule réalisation objective de la promesse.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire preuve du même zèle » reprend clairement l’attitude mentionnée dans le contexte. La syntaxe explicite le rapport de but porté par πρὸς tout en préservant la tension entre assurance subjective et certitude attachée à l’espérance.
