id: HEB.6.4
reference: Hebrews 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: fr
  text: Car il est impossible, pour ceux qui ont été une fois éclairés[a], qui ont goûté le don céleste[b] et qui ont eu part à l’Esprit Saint[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Éclairés » peut désigner largement le fait de recevoir une lumière ou un enseignement spirituel ; certains y voient plus précisément la conversion ou l’illumination liée au baptême.
    reason: alternative_reading
  - marker: b
    text: Ou « ont fait l’expérience du don céleste ». Le verbe signifie littéralement « goûter » et peut désigner une expérience réelle, pas seulement un bref échantillon.
    reason: lexical_alternative
  - marker: c
    text: Ou « sont devenus participants de l’Esprit Saint » ou « ont participé à l’Esprit Saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: il est impossible
  rationale: L’adjectif prédicatif placé en tête reçoit en français le sujet impersonnel « il », tout en gardant son emphase.
- source_word: γὰρ
  choice: car
  rationale: Ce connecteur explicatif rattache naturellement la proposition à l’avertissement précédent.
- source_word: ἅπαξ φωτισθέντας
  choice: ont été une fois éclairés
  rationale: Cette formulation conserve l’antériorité, la valeur passive et la métaphore de la lumière sans l’identifier explicitement à la conversion ou au baptême.
- source_word: γευσαμένους
  choice: ont goûté
  rationale: Le sens concret du verbe est conservé; dans ce contexte, il peut désigner une expérience réelle, sans en déterminer à lui seul l’étendue.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: le don céleste
  rationale: Rendu concis et naturel qui ne précise pas l’identité du don au-delà du grec.
- source_word: τε ... καὶ
  choice: qui ... et qui
  rationale: La coordination cumulative des participes est rendue par une structure française fluide et parallèle.
- source_word: μετόχους γενηθέντας
  choice: ont eu part
  rationale: Cette locution française exprime naturellement l’entrée dans une participation réelle, sans introduire une conclusion systématique sur sa nature exacte.
- source_word: πνεύματος ἁγίου
  choice: à l’Esprit Saint
  rationale: Le complément de participation est idiomatiquement introduit par « à »; les majuscules indiquent le référent divin personnel.
theological_decisions:
- issue: Portée de φωτισθέντας
  choice: Conserver la métaphore générale « éclairés »
  alternative: « convertis » ou « illuminés par le baptême »
  rationale: Le grec ne définit pas explicitement cette illumination comme la conversion ou le baptême; le texte garde donc l’ambiguïté.
- issue: Portée de γευσαμένους
  choice: Traduire littéralement par « ont goûté »
  alternative: « ont fait l’expérience de » ou « n’ont fait que goûter superficiellement »
  rationale: Le verbe peut désigner une expérience véritable, mais ne tranche pas à lui seul la profondeur ou la nature salvifique de cette expérience.
- issue: Nature de la participation à l’Esprit Saint
  choice: « ont eu part à l’Esprit Saint »
  alternative: « sont devenus participants de l’Esprit Saint » ou formulation explicitant une pleine habitation salvifique
  rationale: La traduction affirme la participation exprimée par le grec sans résoudre par avance le débat théologique sur l’apostasie et la persévérance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste volontairement ouverte par la virgule finale, puisque Hébreux 6.4 n’est que le début d’une longue proposition qui se poursuit dans les versets suivants. Les termes retenus préservent les métaphores et les tensions théologiques du grec.
