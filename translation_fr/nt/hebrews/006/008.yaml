source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: fr
  text: Mais si elle produit des épines et des chardons, elle est sans valeur[a] et près d’être maudite ; sa fin est d’être brûlée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejetée ».
    reason: Alternative lexicale pour ἀδόκιμος, qui peut désigner ce qui ne résiste pas à l’épreuve et, par conséquent, ce qui est rejeté.
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: produit
  rationale: Le participe présent féminin reprend la terre du verset précédent. « Produit » est naturel pour une terre et conserve l’idée de ce qu’elle fait pousser.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec la terre féconde du verset 7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: des épines et des chardons
  rationale: Cette expression française courante maintient les deux sortes de végétation nuisible de l’image agricole.
- source_word: ἀδόκιμος
  choice: sans valeur
  rationale: Dans l’image agricole, le terme qualifie une terre qui ne résiste pas à l’épreuve de son utilité. « Sans valeur » préserve ce sens évaluatif sans imposer d’emblée le sens plus fort de « rejetée ».
- source_word: κατάρας ἐγγύς
  choice: près d’être maudite
  rationale: Formulation française naturelle qui exprime la proximité de la malédiction sans affirmer qu’elle a déjà eu lieu.
- source_word: ἧς τὸ τέλος
  choice: elle finira
  rationale: Le relatif féminin renvoie à la terre implicite. Cette tournure rend naturellement en français l’idée de son issue finale.
- source_word: εἰς καῦσιν
  choice: par être brûlée
  rationale: La tournure conserve l’image du brûlage et sa portée de résultat ou de destination sans l’expliciter comme une doctrine particulière du jugement.
theological_decisions:
- issue: Faut-il répéter explicitement « la terre » comme sujet ?
  choice: Employer le pronom féminin « elle », qui reprend la terre du verset précédent.
  alternative: « Mais la terre qui produit… »
  rationale: Le grec ne répète pas le nom, mais le participe féminin en maintient clairement le référent. Le pronom assure la continuité sans ajout explicatif.
- issue: Comment rendre ἀδόκιμος ?
  choice: « sans valeur » dans le texte, avec « rejetée » en note.
  alternative: « rejetée »
  rationale: Le contexte immédiat porte sur l’utilité agricole, tandis que « rejetée » peut suggérer une conclusion théologique plus appuyée. La note conserve néanmoins cette possibilité lexicale réelle.
- issue: Faut-il expliciter εἰς καῦσιν comme le jugement final ?
  choice: 'Conserver l’image : « elle finira par être brûlée ».'
  alternative: « elle est destinée au jugement par le feu »
  rationale: Le texte évoque le brûlage sans préciser lui-même tout le référent doctrinal de l’image ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le féminin « elle » reprend naturellement « la terre » du verset 7. La dernière proposition est formulée idiomatiquement tout en conservant l’image agricole et son caractère menaçant.
