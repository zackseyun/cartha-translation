  variant: modern international French
source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: fr
  text: 'En effet, lorsque Dieu fit la promesse à Abraham[a], comme il ne pouvait jurer par personne de plus grand, il jura par lui-même[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « lorsque Dieu promit à Abraham ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « comme il n’avait personne de plus grand par qui jurer ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’exemple d’Abraham comme explication et appui de l’argument précédent; cette formulation est naturelle en français moderne.
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: lorsque Dieu fit la promesse à Abraham
  rationale: Le participe aoriste désigne l’acte par lequel Dieu a fait une promesse, et le datif indique Abraham comme destinataire. La tournure conserve le lien circonstanciel sans alourdir la phrase.
- source_word: ἐπεὶ
  choice: comme
  rationale: 'La conjonction a ici une valeur causale: l’absence de quelqu’un de plus grand explique pourquoi Dieu jure par lui-même.'
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: par personne de plus grand
  rationale: Dans le contexte d’un serment, le pronom renvoie naturellement à une personne ou autorité invoquée comme garante.
- source_word: εἶχεν ... ὀμόσαι
  choice: il ne pouvait jurer
  rationale: Rend idiomatiquement la construction grecque exprimant l’absence de quelqu’un de plus grand par qui Dieu aurait pu jurer.
- source_word: ὤμοσεν καθ’ ἑαυτοῦ
  choice: il jura par lui-même
  rationale: Préserve la répétition du verbe jurer et rend l’expression grecque propre aux serments sans ajouter d’explication doctrinale.
theological_decisions:
- issue: Nature du serment de Dieu
  choice: Dieu jure par lui-même parce qu’il ne peut jurer par personne de plus grand.
  alternative: Dieu prête serment en son propre nom, faute d’une autorité supérieure.
  rationale: La formulation retenue suit directement le texte et maintient l’affirmation de la suprématie unique de Dieu sans la développer au moyen de catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, digne et accessible. « Fit la promesse » explicite l’objet implicite du participe; « promit » reste une solution plus concise. Le passé simple convient au registre narratif soutenu de la traduction. Le deux-points final respecte le fait que la citation du serment se poursuit au verset suivant.
