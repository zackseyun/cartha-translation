source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: fr
  text: En effet, les êtres humains jurent par quelqu’un de plus grand qu’eux, et, pour eux, le serment est la garantie qui met fin à tout différend[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à toute objection » ou « à toute controverse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωποι
  choice: les êtres humains
  rationale: Le pluriel est générique et désigne l’humanité en général, sans référence particulière aux hommes de sexe masculin. « Les êtres humains » rend clairement cette portée et maintient le contraste implicite avec Dieu dans le contexte.
- source_word: κατὰ τοῦ μείζονος
  choice: par quelqu’un de plus grand qu’eux
  rationale: Dans le cadre d’un serment, κατά suivi du génitif désigne l’autorité invoquée. Cette formulation française exprime naturellement le comparatif sans préciser un référent absent du grec.
- source_word: ὀμνύουσιν
  choice: jurent
  rationale: Le présent exprime une pratique générale. « Jurer par quelqu’un » est ici une tournure française directe et idiomatique.
- source_word: πάσης ... ἀντιλογίας
  choice: toute contestation
  rationale: Dans ce contexte social ou juridique, ἀντιλογία désigne une opposition, une objection ou un différend. « Contestation » conserve cette amplitude sans réduire le terme à une contradiction logique.
- source_word: πέρας
  choice: met fin
  rationale: La formulation verbale rend naturellement en français l’idée de « terme » ou de « fin » tout en conservant la fonction du serment qui clôt la contestation.
- source_word: εἰς βεβαίωσιν
  choice: en servant de garantie
  rationale: βεβαίωσις exprime la confirmation, la validation ou l’assurance ferme. « En servant de garantie » restitue la fonction confirmatrice du serment sans créer un complément implicite ambigu.
- source_word: ὁ ὅρκος
  choice: le serment
  rationale: L’article grec convient ici à une affirmation générale sur le rôle reconnu du serment; le français emploie naturellement « le serment » dans ce sens générique.
theological_decisions:
- issue: Référence générique à l’humanité dans une maxime
  choice: les êtres humains
  alternative: les hommes
  rationale: Le grec ἄνθρωποι vise les humains en général et non spécifiquement les personnes de sexe masculin. La traduction choisie transmet exactement cette portée générique sans introduire de distinction absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure d’une maxime générale. « Met fin » et « en servant de garantie » rendent de façon naturelle la relation entre πέρας et εἰς βεβαίωσιν, tandis que la note préserve l’étendue sémantique de ἀντιλογία.
