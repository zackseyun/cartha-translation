  naturalness: La formulation est globalement naturelle. « Les jours d’autrefois » et « un grand combat fait de souffrances » sont naturels dans un registre biblique moderne et rendent plus directement les relations du grec.
  terminology: « Éclairés » conserve utilement la métaphore de φωτισθέντες sans identifier cette expérience à la conversion, au baptême ou à l’instruction. « Combat » restitue bien l’image de lutte présente dans ἄθλησις.
