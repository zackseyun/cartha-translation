id: HEB.10.32
reference: Hebrews 10:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: fr
  text: 'Mais rappelez-vous les jours d’autrefois : après avoir été éclairés[a][b], vous avez enduré un grand combat fait de souffrances[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque vous avez été éclairés ». Le participe grec peut indiquer ici une action antérieure au combat ou situer le moment où celui-ci a eu lieu.
    reason: lexical_alternative
  - marker: b
    text: L’expression « avoir été éclairés » peut désigner largement le fait d’avoir reçu une lumière spirituelle. Elle a aussi été mise en rapport avec la conversion, le baptême ou l’instruction dans la foi.
    reason: alternative_reading
  - marker: c
    text: 'On pourrait aussi traduire : « un dur combat de souffrances ». Le nom grec évoque une lutte ou une compétition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: rappelez-vous
  rationale: L’impératif présent appelle les destinataires à se remémorer leur expérience passée. « Rappelez-vous » exprime naturellement cette exhortation en français.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition légèrement contrastive après l’avertissement précédent.
- source_word: τὰς πρότερον ἡμέρας
  choice: les premiers jours
  rationale: Cette expression désigne la période antérieure qui a suivi leur illumination. « Les premiers jours » est idiomatique et évoque leurs débuts dans la foi sans préciser davantage leur durée.
- source_word: ἐν αἷς
  choice: ': après avoir été…'
  rationale: L’expression relative a une valeur temporelle. La ponctuation française et la proposition infinitive rendent le lien avec les jours rappelés sans conserver une tournure artificielle comme « dans lesquels ».
- source_word: φωτισθέντες
  choice: après avoir été éclairés
  rationale: Le participe aoriste passif conserve la métaphore de la lumière et présente cette illumination comme antérieure au combat enduré, tout en laissant ouverte son identification précise.
- source_word: πολλὴν ἄθλησιν
  choice: un grand combat
  rationale: ἄθλησις évoque un combat ou une épreuve comparable à une compétition. « Un grand combat » conserve cette image et l’intensité de πολλήν dans une formulation naturelle.
- source_word: ὑπεμείνατε
  choice: vous avez enduré
  rationale: Le verbe exprime le fait de tenir ferme sous l’épreuve. « Endurer » convient directement au contexte de souffrance.
- source_word: παθημάτων
  choice: au milieu des souffrances
  rationale: Le génitif caractérise le combat par les souffrances qui le composent ou l’accompagnent. Cette formulation française reste naturelle sans réduire le terme à un seul type d’épreuve.
theological_decisions:
- issue: Sens de φωτισθέντες dans ce contexte d’exhortation
  choice: Conserver la métaphore « avoir été éclairés » sans l’identifier à un événement doctrinal précis.
  alternative: « après votre conversion », « après votre baptême » ou « après avoir reçu la lumière de l’Évangile »
  rationale: Le texte indique une illumination spirituelle antérieure, mais ne dit pas explicitement s’il s’agit de la conversion, du baptême ou de l’instruction dans la foi. La métaphore préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’image de l’illumination et celle du combat, tout en évitant de préciser ce que le grec laisse ouvert.
