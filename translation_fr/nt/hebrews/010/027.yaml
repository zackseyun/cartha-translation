id: HEB.10.27
reference: Hebrews 10:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: fr
  text: mais une terrible attente du jugement et l’ardeur d’un feu qui va dévorer les adversaires.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβερὰ
  choice: terrible
  rationale: L’adjectif qualifie l’attente et exprime ce qui inspire l’effroi; « terrible » est naturel, sobre et soutenu en français.
- source_word: δέ
  choice: mais seulement
  rationale: δέ marque ici le contraste avec « il ne reste plus de sacrifice » au verset précédent; « mais seulement » rend clairement que cette attente est ce qui reste, sans introduire une idée étrangère.
- source_word: τις ἐκδοχὴ
  choice: l’attente
  rationale: ἐκδοχή désigne l’attente de ce qui vient. Le pronom indéfini τις n’a pas besoin d’une traduction autonome en français, où « une certaine attente » serait pesant et pourrait suggérer la certitude plutôt que l’indétermination.
- source_word: κρίσεως
  choice: du jugement
  rationale: « Jugement » conserve la portée judiciaire du terme sans préciser davantage la nature ou la durée du châtiment.
- source_word: πυρὸς ζῆλος
  choice: l’ardeur d’un feu
  rationale: ζῆλος peut exprimer une ardeur intense ou une fureur jalouse. « L’ardeur d’un feu » garde l’image condensée et sa possible personnification, dans un français naturel.
- source_word: ἐσθίειν
  choice: dévorer
  rationale: Le verbe signifie littéralement manger; appliqué au feu, « dévorer » restitue plus vivement cette image que le terme plus abstrait « consumer ».
- source_word: μέλλοντος
  choice: qui va
  rationale: Cette tournure rend l’imminence exprimée par μέλλω tout en restant idiomatique en français moderne.
- source_word: τοὺς ὑπεναντίους
  choice: les adversaires
  rationale: « Adversaires » conserve le registre soutenu et désigne ceux qui se dressent en opposition, sans les identifier plus précisément que le grec.
theological_decisions:
- issue: Nature de l’image du jugement
  choice: Conserver l’image saisissante d’un feu qui dévore.
  alternative: Expliciter un châtiment éternel ou réduire le feu à une simple métaphore.
  rationale: Le verset annonce un jugement divin sévère, mais n’en définit pas ici toutes les modalités ni la durée; la traduction ne tranche donc pas au-delà du texte.
- issue: Valeur de πυρὸς ζῆλος
  choice: l’ardeur d’un feu
  alternative: la fureur du feu
  rationale: « Ardeur » préserve le champ sémantique de ζῆλος et l’ambiguïté entre intensité brûlante et zèle personnifié, tandis que « fureur » interpréterait plus nettement l’expression comme colère.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent par « mais seulement ». « Dévorer » maintient la vigueur concrète de l’image grecque sans ajouter de précision doctrinale.
