  - severity: medium
    issue: 'Construction ambiguë : « purifié par aspersion d’une conscience mauvaise »'
    rationale: En français, le complément « d’une conscience mauvaise » peut se lire comme dépendant du nom « aspersion ». Or ἀπὸ συνειδήσεως πονηρᾶς exprime la séparation ou purification par rapport à une conscience mauvaise. Une formulation où « d’une conscience mauvaise » dépend directement de « purifié » est plus fidèle et claire.
  - severity: low
