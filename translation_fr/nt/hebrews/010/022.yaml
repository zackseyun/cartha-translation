review_pass:
  verdict: revise
  source_fidelity: La proposition rend correctement l’exhortation au subjonctif, la certitude de la foi, ainsi que les deux participes parfaits et l’imagerie de purification. Toutefois, « donc » n’est pas exprimé dans le grec de ce verset, et « purifié par aspersion d’une conscience mauvaise » attache de façon ambiguë « d’une conscience mauvaise » à « aspersion » plutôt qu’à la purification/séparation exprimée par ἀπό.
  naturalness: « Approchons-nous » et « dans la pleine assurance de la foi » sont naturels dans un registre biblique moderne. « Un cœur sincère » est plus idiomatique en français international que « un cœur vrai ». La reformulation de la purification rend la relation syntaxique claire sans perdre l’image d’aspersion.
  terminology: « Conscience mauvaise », « eau pure » et le maintien non confessionnel de l’image du lavage sont appropriés. « Par l’aspersion » préserve le vocabulaire cultuel sans identifier le lavage au baptême.
