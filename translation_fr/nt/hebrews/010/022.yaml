source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: fr
  text: Approchons-nous avec un cœur sincère[a], dans la pleine assurance de la foi, le cœur purifié d’une conscience mauvaise[b] par l’aspersion[d], et le corps lavé d’une eau pure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un cœur vrai » ou « avec un cœur authentique ».
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une conscience coupable ». Le grec dit littéralement « mauvaise » et peut avoir une portée plus large que la seule culpabilité.
    reason: lexical_alternative
  - marker: c
    text: Cette image peut évoquer le langage des purifications rituelles et peut aussi être entendue comme une allusion au baptême, mais le verset n’identifie pas explicitement ce lavage.
    reason: cultural_note
  - marker: d
    text: Littéralement, « le cœur ayant été aspergé d’une conscience mauvaise » ; la préposition grecque exprime ici l’éloignement ou la purification par rapport à cette conscience. L’aspersion conserve une image cultuelle de purification.
    reason: translation_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Approchons-nous donc
  rationale: Le subjonctif présent à valeur exhortative appelle une exhortation collective. « Approchons-nous » est naturel en français et conserve le contexte d’accès à Dieu. « Donc » explicite sobrement le lien exhortatif avec le contexte immédiat sans modifier le contenu de l’appel.
- source_word: ἀληθινῆς καρδίας
  choice: avec un cœur vrai
  rationale: « Vrai » préserve les sens possibles de ἀληθινός — vrai, authentique, sincère — sans réduire l’expression à la seule sincérité subjective.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: dans la pleine assurance de la foi
  rationale: Cette formulation conserve l’idée de plénitude et de certitude portée par πληροφορία ainsi que le génitif compact πίστεως, sans préciser abusivement si la foi produit cette assurance ou en constitue la sphère.
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: le cœur purifié par aspersion
  rationale: Le parfait passif décrit un état résultant. « Par aspersion » maintient l’image cultuelle, tandis que « purifié » rend explicite en français la portée purificatrice indiquée par le contexte et la construction avec ἀπό.
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: d’une conscience mauvaise
  rationale: « Mauvaise » rend formellement πονηρά et garde une portée morale et cultuelle plus large que « coupable », qui limiterait le sens à la culpabilité ressentie ou constatée.
- source_word: λελουσμένοι τὸ σῶμα
  choice: le corps lavé
  rationale: Le participe parfait parallèle exprime un état acquis. Le singulier distributif français correspond naturellement au singulier grec dans une exhortation collective.
- source_word: ὕδατι καθαρῷ
  choice: d’une eau pure
  rationale: « Eau pure » est une expression française naturelle qui conserve à la fois le sens concret et la nuance de pureté rituelle de καθαρός.
theological_decisions:
- issue: Identification du lavage à l’eau avec le baptême chrétien
  choice: Conserver l’image de purification sans identifier explicitement le lavage au baptême dans le texte principal
  alternative: Rendre la formule de manière explicitement baptismale, ou au contraire comme une purification uniquement intérieure et métaphorique
  rationale: Le langage peut évoquer les purifications rituelles et peut aussi être entendu comme une allusion au baptême, mais le verset ne nomme pas explicitement celui-ci. La formulation maintient donc cette ouverture.
- issue: Sens de συνειδήσεως πονηρᾶς
  choice: une conscience mauvaise
  alternative: une conscience coupable
  rationale: Le grec qualifie la conscience de « mauvaise » et ne désigne pas explicitement la culpabilité. La traduction retenue préserve l’ampleur morale et rituelle de l’expression.
- issue: Portée de l’aspersion
  choice: le cœur purifié par aspersion d’une conscience mauvaise
  alternative: le cœur aspergé, loin d’une conscience mauvaise
  rationale: La formulation française communique le résultat purificateur de l’aspersion tout en conservant l’image cultuelle et le complément introduit par ἀπό, sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement exhortatif et le parallélisme entre le cœur purifié par aspersion et le corps lavé. Le singulier distributif « le cœur… le corps » évite une lourdeur tout en restant proche du grec.
