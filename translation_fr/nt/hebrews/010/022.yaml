revisions:
- from: Approchons-nous donc avec un cœur vrai[a], dans la pleine assurance de la foi, le cœur purifié par aspersion[d] d’une conscience mauvaise[b], et le corps lavé d’une eau pure[c].
  to: Approchons-nous avec un cœur sincère[a], dans la pleine assurance de la foi, le cœur purifié d’une conscience mauvaise[b] par l’aspersion[d], et le corps lavé d’une eau pure[c].
  rationale: La révision supprime l’inférence non exprimée « donc », adopte « un cœur sincère » pour une expression française moderne et naturelle, et replace « d’une conscience mauvaise » auprès de « purifié » afin de refléter clairement la fonction de ἀπό. « Par l’aspersion » conserve l’image et l’ordre sémantique de la purification sans en préciser indûment le référent rituel ou baptismal.
