id: HEB.10.3
reference: Hebrews 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν αὐταῖς ἀνάμνησις ἁμαρτιῶν κατ’ ἐνιαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/003.yaml
  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: fr
  text: Mais, dans ces sacrifices, il y a un rappel des péchés, année après année[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque année ».
    reason: Variante lexicale naturelle pour l’expression temporelle κατ’ ἐνιαυτόν.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: 'Conjonction adversative qui rattache ce verset à l’affirmation précédente : les sacrifices ne peuvent rendre parfaits ceux qui rendent un culte. « Mais » exprime simplement et naturellement ce contraste.'
- source_word: ἐν αὐταῖς
  choice: dans ces sacrifices
  rationale: Le pronom féminin pluriel renvoie aux sacrifices mentionnés dans le contexte immédiat. Expliciter le référent en français évite une formulation ambiguë sans ajouter de contenu.
- source_word: ἀνάμνησις
  choice: un rappel
  rationale: Le nom désigne l’action de ramener quelque chose à la mémoire. « Un rappel » est courant en français moderne et conserve l’idée que les sacrifices remettent les péchés en mémoire plutôt qu’ils ne les ôtent.
- source_word: ἁμαρτιῶν
  choice: des péchés
  rationale: Le génitif dépend de ἀνάμνησις et indique ce qui est rappelé. « Des péchés » en donne une traduction directe et naturelle.
- source_word: κατ’ ἐνιαυτόν
  choice: année après année
  rationale: Cette expression temporelle marque une récurrence annuelle. « Année après année » souligne la répétition continue qui joue un rôle central dans l’argument du passage.
theological_decisions:
- issue: Référent de αὐταῖς
  choice: Rendre le pronom par « dans ces sacrifices », en explicitant son antécédent.
  alternative: 'Conserver un simple pronom : « en eux » ou « en elles ».'
  rationale: Le contexte immédiat parle des sacrifices continuellement offerts. L’explicitation clarifie le français tout en préservant le contraste entre leur répétition et l’absence de purification définitive.
- issue: Portée de κατ’ ἐνιαυτόν
  choice: « année après année », pour faire ressortir la récurrence annuelle.
  alternative: « chaque année » ou « annuellement ».
  rationale: Toutes ces formulations expriment la périodicité annuelle, mais « année après année » rend plus perceptible la répétition sur laquelle repose l’argument de l’épître, sans préciser davantage le rite concerné.
- issue: Fonction du rappel des péchés
  choice: Conserver la formulation sobre « il y a un rappel des péchés ».
  alternative: Préciser que les sacrifices « rappellent » ou « remettent en mémoire » les péchés.
  rationale: La construction nominale respecte l’ambiguïté du grec quant à l’agent et au fonctionnement exact de ce rappel, sans imposer une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La structure existentielle « il y a un rappel » reste proche du grec tout en étant intelligible; l’explicitation de « sacrifices » assure la cohérence avec le contexte.
