id: HEB.10.19
reference: Hebrews 10:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν, ἀδελφοί, παρρησίαν εἰς τὴν εἴσοδον τῶν ἁγίων ἐν τῷ αἵματι Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: fr
  text: Ainsi donc, frères[a], puisque nous avons l’assurance d’entrer dans les lieux saints[b] par le sang de Jésus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs »; le grec dit « frères », terme qui peut ici désigner collectivement toute l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: Ou « le sanctuaire »; dans le contexte de l’image du tabernacle employée dans Hébreux, l’expression désigne les lieux saints de la présence de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: puisque nous avons
  rationale: Le participe fournit ici le fondement de l’exhortation qui suit. Cette tournure française naturelle en exprime la valeur logique ou causale.
- source_word: οὖν
  choice: Ainsi donc
  rationale: L’expression marque clairement la conclusion tirée du développement précédent.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel grec est conservé dans le texte principal; dans ce type d’adresse, il peut représenter l’ensemble de l’assemblée, ce que précise la note.
- source_word: παρρησίαν
  choice: l’assurance
  rationale: Dans ce contexte, le terme désigne la confiance franche et libre avec laquelle les croyants peuvent s’approcher de Dieu. « Assurance » est naturel en français et ne suggère pas une témérité irrévérencieuse.
- source_word: εἰς τὴν εἴσοδον
  choice: d’entrer dans
  rationale: La construction nominale grecque est rendue idiomatiquement par un infinitif français, tout en conservant l’idée d’accès ou d’entrée.
- source_word: τῶν ἁγίων
  choice: les lieux saints
  rationale: Dans l’imagerie cultuelle de l’épître, l’expression renvoie aux lieux saints de la présence de Dieu. Le pluriel transparent évite de préciser indûment qu’il s’agit seulement du lieu très saint.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: par le sang de Jésus
  rationale: « Par » exprime naturellement le moyen ou le fondement de l’accès, tout en maintenant la force sacrificielle de l’expression.
theological_decisions:
- issue: Portée de τῶν ἁγίων
  choice: référence spatiale et cultuelle aux lieux saints de la présence de Dieu
  alternative: le sanctuaire; le lieu très saint; les saints
  rationale: Le contexte soutenu du tabernacle dans Hébreux favorise une référence au domaine saint où Dieu est présent. « Le lieu très saint » serait plus précis que le grec, tandis que « les saints » romprait l’image cultuelle immédiate.
- issue: Valeur représentative de ἀδελφοί
  choice: conserver « frères » dans le texte et signaler en note que l’adresse peut inclure toute l’assemblée
  alternative: frères et sœurs; membres de la famille de Dieu
  rationale: Cette solution préserve la forme masculine du grec sans masquer sa possible portée collective dans l’adresse à la communauté.
- issue: Nature de la παρρησία
  choice: assurance confiante permettant l’entrée
  alternative: hardiesse; liberté d’accès
  rationale: Le terme évoque une liberté confiante devant Dieu. « Assurance » garde cette force sans présenter l’accès comme une audace présomptueuse.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste ouverte sur l’exhortation du verset suivant, comme dans le grec. « L’assurance d’entrer » privilégie une formulation courante tout en conservant la relation logique et l’imagerie cultuelle du texte source.
