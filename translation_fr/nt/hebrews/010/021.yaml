  naturalness: Le français est fluide, moderne et convient à une phrase dont la syntaxe se poursuit depuis les versets précédents. « La maison de Dieu » conserve une formulation biblique naturelle.
  terminology: « Grand prêtre » est la seule formulation française naturelle pour prêtre qualifié de « grand », même si elle peut évoquer le titre technique habituellement rendu par ἀρχιερεύς. La note distingue utilement ces emplois sans imposer une lecture doctrinale. « Maison de Dieu » préserve l’ambivalence de οἶκος; la note indique bien le sens communautaire possible.
