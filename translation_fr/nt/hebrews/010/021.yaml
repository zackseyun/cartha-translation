id: HEB.10.21
reference: Hebrews 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἱερέα μέγαν ἐπὶ τὸν οἶκον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/021.yaml
  text: and a great priest over the house of God[b][a],
translation:
  language: fr
  text: et puisque nous avons un grand prêtre établi sur la maison de Dieu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Dieu » peut aussi désigner sa maisonnée, c’est-à-dire son peuple. Le grec dit littéralement « un grand prêtre », et non le titre habituel traduit par « grand prêtre » ou « souverain sacrificateur » ailleurs dans l’épître.
    reason: Ambiguïté lexicale et distinction entre une description (« un prêtre grand ») et le titre technique de grand prêtre.
lexical_decisions:
- source_word: καὶ
  choice: et puisque nous avons
  rationale: La conjonction coordonne ce second motif à la construction commencée au verset 19. La reprise de « puisque nous avons » rend en français la syntaxe suspendue du passage et produit un fragment lisible dans son contexte.
- source_word: ἱερέα
  choice: prêtre
  rationale: Ἱερεύς signifie « prêtre ». Le terme technique ἀρχιερεύς (« grand prêtre » au sens de souverain sacrificateur) n'est pas employé ici.
- source_word: μέγαν
  choice: grand
  rationale: L'adjectif exprime la grandeur ou l'éminence du prêtre sans être fondu dans un titre technique.
- source_word: ἐπὶ
  choice: établi sur
  rationale: Avec l'accusatif, la préposition exprime ici l'autorité ou la responsabilité exercée à l'égard de la maison. « Établi sur » est naturel et explicite cette relation sans la surinterpréter.
- source_word: τὸν οἶκον
  choice: la maison
  rationale: Οἶκος peut désigner une maison ou une maisonnée. « Maison » conserve la métaphore biblique et permet le sens communautaire attesté dans Hébreux 3.2-6.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif indique simplement que la maison appartient à Dieu.
theological_decisions:
- issue: Faut-il rendre ἱερέα μέγαν par le titre technique « grand prêtre » ?
  choice: un grand prêtre
  alternative: un souverain sacrificateur / un grand prêtre comme titre technique
  rationale: Le contexte de l'épître présente clairement Jésus comme grand prêtre, mais le grec emploie ici ἱερεύς avec l'adjectif μέγας, et non le titre habituel ἀρχιερεύς. En français, « un grand prêtre » peut préserver la composition adjectivale, tandis que l'article indéfini et la note signalent qu'il ne s'agit pas nécessairement du titre lexical technique.
- issue: Portée de « maison de Dieu »
  choice: conserver la métaphore « maison »
  alternative: la famille de Dieu / le peuple de Dieu
  rationale: La formule peut évoquer la communauté appartenant à Dieu, mais la traduction littérale maintient volontairement la métaphore et sa résonance avec Hébreux 3.2-6.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation s'intègre à la longue phrase commencée au verset 19. « Établi sur » évite la tournure peu naturelle « prêtre sur la maison » tout en conservant l'idée d'autorité. La note réunit les deux précisions nécessaires sans multiplier les appels de note dans ce verset très bref.
