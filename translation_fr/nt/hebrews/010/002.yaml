id: HEB.10.2
reference: Hebrews 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: fr
  text: Sinon, n’aurait-on pas cessé de les offrir, puisque ceux qui rendent un culte, une fois purifiés[a], n’auraient plus aucune conscience de leurs péchés[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fois pour toutes purifiés ». Dans ce contexte, « une fois » peut exprimer le caractère définitif et non répétable de la purification.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’auraient plus éprouvé de culpabilité à cause de leurs péchés ». Le terme grec peut désigner la conscience, la perception intérieure ou le sentiment de culpabilité lié aux péchés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Sinon
  rationale: Dans ce raisonnement contrefactuel, le terme introduit la conséquence qui se produirait si les sacrifices pouvaient réellement rendre parfaits ceux qui s’approchent. « Sinon » exprime naturellement ce lien logique en français.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: n’aurait-on pas cessé de les offrir
  rationale: La tournure française conserve la question rhétorique et sa valeur irréelle. Le passage du passif grec à l’indéfini « on » est naturel en français et renvoie clairement aux sacrifices mentionnés dans le contexte.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: puisque … n’auraient plus eu
  rationale: La construction introduit la raison de l’arrêt hypothétique des offrandes. « Puisque » marque clairement cette justification, tandis que « plus » rend ἔτι sous la négation.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: conscience de leurs péchés
  rationale: συνείδησις peut désigner la conscience morale, la conscience que l’on a de quelque chose ou le sentiment intérieur de culpabilité. La formulation retenue préserve cette amplitude sans laisser entendre une perte de toute sensibilité morale.
- source_word: τοὺς λατρεύοντας
  choice: ceux qui rendent un culte
  rationale: Le participe substantivé désigne les personnes qui accomplissent le service cultuel. Cette formulation garde le sens verbal et convient au contexte sacrificiel.
- source_word: ἅπαξ κεκαθαρισμένους
  choice: une fois purifiés
  rationale: Le participe parfait passif présente une purification accomplie dont l’effet demeure. « Une fois » rend ἅπαξ sans imposer dans le texte principal la nuance plus forte, mais contextuellement possible, de « une fois pour toutes ».
theological_decisions:
- issue: Portée de συνείδησιν ἁμαρτιῶν après la purification
  choice: « conscience de leurs péchés », avec une note indiquant la possible nuance de culpabilité
  alternative: « sentiment de culpabilité lié à leurs péchés »
  rationale: Le raisonnement porte sur la conscience durable du péché devant Dieu, non sur l’abolition de toute conscience morale. Une formulation moins explicative dans le texte principal préserve l’ambiguïté lexicale réelle.
- issue: Force de ἅπαξ
  choice: « une fois » dans le texte principal
  alternative: « une fois pour toutes »
  rationale: Le contexte permet une nuance définitive et non répétable, mais le mot seul ne contraint pas à l’expliciter. La note signale donc cette possibilité sans la transformer en seule lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique demeure nette; la syntaxe française évite un passif lourd tout en conservant le raisonnement contrefactuel du grec.
