  terminology: «Marchepied» conserve l’image de ὑποπόδιον et l’écho au Psaume 110. Le passif «soient placés» ne spécifie pas indûment l’agent. La note lexicale est resserrée afin de ne pas présenter «avec assurance» comme une traduction explicite du participe.
