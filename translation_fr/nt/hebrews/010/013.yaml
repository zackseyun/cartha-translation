  text: τὸ λοιπὸν ἐκδεχόμενος ἕως τεθῶσιν οἱ ἐχθροὶ αὐτοῦ ὑποπόδιον τῶν ποδῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/013.yaml
  text: from then on waiting until his enemies are made a footstool for his feet[b][a],
translation:
  language: fr
  text: Désormais, il attend jusqu’à ce que ses ennemis soient placés comme un marchepied sous ses pieds[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «attendant» ou «dans l’attente». Le participe grec exprime une attente continue et peut aussi comporter une nuance d’expectative.
    reason: lexical_alternative
  - marker: b
    text: 'Cette formulation fait écho au Psaume 110.1 : «Assieds-toi à ma droite, jusqu’à ce que je fasse de tes ennemis un marchepied pour tes pieds.»'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: désormais
  rationale: 'L’expression neutre avec article a ici une valeur adverbiale et temporelle : elle désigne la période qui suit l’offrande accomplie et la séance à la droite de Dieu.'
- source_word: ἐκδεχόμενος
  choice: dans l’attente
  rationale: Le participe décrit une attente continue et peut aussi comporter une nuance d’expectative assurée; cette formulation française reste naturelle sans suggérer l’incertitude.
- source_word: ἕως
  choice: que
  rationale: Après «dans l’attente», le français exprime naturellement la limite temporelle par «que»; la notion de «jusqu’à ce que» demeure implicite dans la locution.
- source_word: τεθῶσιν
  choice: soient placés
  rationale: Le subjonctif passif aoriste de τίθημι est rendu par un subjonctif passif français, ce qui conserve l’action exercée sur les ennemis sans préciser explicitement son agent.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: ses ennemis
  rationale: Rendu direct et idiomatique du groupe nominal grec avec possessif.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: comme un marchepied sous ses pieds
  rationale: «Marchepied» restitue l’image concrète de l’ὑποπόδιον, tandis que «sous ses pieds» exprime naturellement en français la relation formulée par le génitif grec et maintient l’écho du Psaume 110.1.
theological_decisions:
- issue: Image de l’intronisation messianique provenant du Psaume 110.1
  choice: Conserver l’image concrète des ennemis placés comme un marchepied sous les pieds du Messie.
  alternative: Paraphraser par «jusqu’à ce que ses ennemis soient vaincus» ou «soumis».
  rationale: L’image du marchepied est intentionnelle et porte l’écho intertextuel du Psaume 110.1; une paraphrase en termes de victoire ou de soumission supprimerait une partie de sa force christologique sans y être contrainte par le grec.
- issue: Agent du passif τεθῶσιν
  choice: Maintenir le passif «soient placés» sans nommer l’agent.
  alternative: Expliciter «jusqu’à ce que Dieu place ses ennemis».
  rationale: Le contexte et la citation du psaume orientent vers l’action divine, mais le verset grec emploie un passif sans exprimer l’agent; la traduction préserve cette formulation.
translation_notes:
  register: Français international moderne, sobre et digne. «Désormais dans l’attente» s’intègre à la phrase commencée au verset précédent. L’image biblique du marchepied est conservée plutôt que remplacée par une explication.
