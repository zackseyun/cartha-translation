id: HEB.10.11
reference: Hebrews 10:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: fr
  text: Et chaque prêtre se tient debout, jour après jour, pour accomplir son service et offrir maintes fois les mêmes sacrifices, qui ne peuvent jamais enlever les péchés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: chaque prêtre
  rationale: Avec un nom singulier, πᾶς a ici une valeur distributive. « Chaque prêtre » est naturel en français et n’introduit pas l’idée de grand prêtre, absente du grec.
- source_word: ἕστηκεν
  choice: se tient debout
  rationale: Le parfait exprime l’état ou la posture du prêtre. Cette formulation préserve le contraste immédiat avec le Messie qui s’assied au verset suivant.
- source_word: καθ’ ἡμέραν
  choice: jour après jour
  rationale: Cette expression rend clairement la répétition quotidienne et soutenue du service sacerdotal.
- source_word: λειτουργῶν
  choice: pour accomplir son service
  rationale: Le participe désigne ici l’exercice du service cultuel. La formulation reste compréhensible sans perdre la nuance sacerdotale donnée par le contexte.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: les mêmes sacrifices
  rationale: La traduction directe conserve l’accent mis sur la répétition des mêmes offrandes sacrificielles.
- source_word: πολλάκις
  choice: maintes fois
  rationale: L’expression rend la récurrence répétée avec une dignité adaptée au registre biblique, sans être obscure.
- source_word: προσφέρων
  choice: offrir
  rationale: Dans un contexte sacrificiel, προσφέρω signifie normalement « offrir ».
- source_word: αἵτινες
  choice: qui
  rationale: Le relatif renvoie aux sacrifices et introduit l’explication de leur incapacité; « qui » reproduit naturellement ce lien en français.
- source_word: οὐδέποτε δύνανται
  choice: ne peuvent jamais
  rationale: La formulation conserve sans l’atténuer l’incapacité absolue affirmée par le grec.
- source_word: περιελεῖν ἁμαρτίας
  choice: enlever les péchés
  rationale: περιαιρέω signifie ôter ou enlever. « Enlever les péchés » est direct, naturel et respecte l’image de suppression sans imposer un terme doctrinal plus technique.
theological_decisions:
- issue: Relation entre la posture du prêtre et l’argument d’Hébreux 10
  choice: « se tient debout »
  alternative: « se tient » ou « est là »
  rationale: La mention explicite de la posture préserve le contraste littéraire et théologique avec le Messie assis au verset 12, sans ajouter d’interprétation au texte.
- issue: Portée de l’inefficacité des sacrifices
  choice: « ne peuvent jamais enlever les péchés »
  alternative: « ne peuvent jamais régler pleinement le problème des péchés »
  rationale: Le grec affirme une incapacité absolue dans l’argument de l’auteur. Une formulation plus faible ou explicative atténuerait cette affirmation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement du grec, la répétition du ministère sacerdotal et le contraste implicite entre la station debout des prêtres et la position assise du Messie au verset suivant. Aucun marqueur de note n’est requis, car « enlever » rend directement περιελεῖν et ne nécessite pas ici de variante distincte.
