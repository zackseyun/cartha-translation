source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: fr
  text: d'une part, exposés publiquement aux insultes et aux détresses[a], d'autre part, devenus solidaires de ceux qui étaient ainsi traités[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus imagée : « livrés en spectacle » sous les insultes et les détresses.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « de ceux qui vivaient ou se conduisaient ainsi » ; le participe grec peut désigner une manière de vivre, mais le contexte de persécution favorise ici le sens « étaient ainsi traités ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: tantôt ... tantôt
  rationale: Cette tournure française naturelle rend la structure corrélative qui présente les deux formes de leur endurance passée.
- source_word: ὀνειδισμοῖς
  choice: insultes
  rationale: Le terme désigne des outrages verbaux qui couvrent de honte; « insultes » est actuel, clair et précis.
- source_word: θλίψεσιν
  choice: détresses
  rationale: Le mot évoque des pressions et des épreuves pénibles. « Détresses » en conserve la gravité sans préciser indûment la forme des souffrances.
- source_word: θεατριζόμενοι
  choice: exposés publiquement
  rationale: Le verbe évoque une mise en spectacle devant le public. La formulation retenue exprime clairement cette exposition humiliante, tandis que l'image plus vive est signalée en note.
- source_word: κοινωνοὶ
  choice: solidaires
  rationale: Le nom exprime ici une participation concrète au sort d'autrui, et non une simple proximité amicale. « Solidaires » rend cette association active dans l'épreuve.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: de ceux qui étaient ainsi traités
  rationale: Même si le participe peut désigner une manière de vivre ou de se conduire, le contexte immédiat de persécution favorise le sens de personnes subissant le même traitement.
- source_word: γενηθέντες
  choice: devenus
  rationale: Le participe aoriste indique qu'ils sont entrés dans cette solidarité; « devenus » s'intègre naturellement à la construction française.
theological_decisions:
- issue: Sens de ἀναστρεφομένων dans ce contexte
  choice: ceux qui étaient ainsi traités
  alternative: ceux qui se conduisaient ou vivaient ainsi
  rationale: Les insultes et les détresses mentionnées dans le premier membre rendent probable une référence au traitement subi par d'autres croyants. L'autre valeur lexicale réelle est maintenue en note afin de ne pas effacer l'ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale conserve le lien avec le verset précédent. « Tantôt ... tantôt » est idiomatique, et « devenus solidaires » souligne une participation concrète sans ajouter de précision confessionnelle.
