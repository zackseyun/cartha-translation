source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: fr
  text: '« Voici l’alliance que je conclurai avec eux après ces jours-là, dit le Seigneur : en mettant mes lois sur leurs cœurs, je les inscrirai dans leur esprit,[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut rendre la construction plus librement : « je mettrai mes lois sur leurs cœurs et je les inscrirai dans leur esprit ».'
    reason: La note signale la formulation française plus fluide qui transforme le participe grec en verbe au futur, sans l’adopter dans le texte principal.
lexical_decisions:
- source_word: διαθήκη
  choice: alliance
  rationale: Dans la citation de Jérémie, le terme désigne l’alliance établie par Dieu; « alliance » en conserve la portée intertextuelle et théologique.
- source_word: διαθήσομαι
  choice: je conclurai
  rationale: Dans une formule d’alliance, « conclure une alliance » est idiomatique en français et exprime clairement l’acte d’établir cette alliance.
- source_word: πρὸς αὐτούς
  choice: avec eux
  rationale: Dans ce contexte relationnel, πρὸς se rend naturellement par « avec ».
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: après ces jours-là
  rationale: Cette formulation conserve directement l’expression temporelle de la citation sans l’expliciter.
- source_word: κύριος
  choice: le Seigneur
  rationale: « Le Seigneur » est l’équivalent français courant de κύριος dans le Nouveau Testament grec.
- source_word: διδοὺς
  choice: en mettant
  rationale: Le participe est conservé plutôt que transformé silencieusement en un second verbe au futur; « mettre » convient à l’image des lois placées sur les cœurs.
- source_word: νόμους
  choice: lois
  rationale: Le pluriel explicite du grec est maintenu, ainsi que le lien lexical avec νόμος.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: sur leurs cœurs
  rationale: « Sur » préserve l’image de surface portée par ἐπί, et le pluriel de καρδίας est respecté.
- source_word: διάνοιαν
  choice: esprit
  rationale: Ici, διάνοια désigne la faculté intérieure de pensée et de compréhension; « esprit » est naturel en français et reste assez large.
- source_word: ἐπιγράψω
  choice: j’inscrirai
  rationale: « Inscrire » rend l’idée d’écrire sur ou dans un support et maintient la métaphore de l’écriture.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom reprend « mes lois »; le pronom français en conserve l’anaphore sans répétition inutile.
theological_decisions:
- issue: Syntaxe interne de la citation de Jérémie
  choice: Conserver le participe (« en mettant mes lois »), suivi du futur (« je les inscrirai »).
  alternative: 'Harmoniser en deux verbes au futur : « je mettrai… et je les inscrirai… »'
  rationale: Le grec d’Hébreux emploie effectivement un participe puis un verbe au futur. La traduction garde cette différence au lieu de l’aligner silencieusement sur une forme plus familière de la citation.
- issue: Rapport entre le cœur et l’esprit
  choice: Préserver les deux images parallèles sans les fusionner ni préciser davantage leur distinction.
  alternative: Interpréter « cœur » comme les émotions et « esprit » comme l’intellect.
  rationale: Le texte ne définit pas ici une anthropologie technique; une distinction explicative importerait une interprétation absente du verset.
translation_notes:
  register: Français moderne, international et digne. « Voici » convient à la formule déclarative; « conclure une alliance » est idiomatique. Le participe grec est maintenu malgré une légère densité syntaxique, tandis que « dans leur esprit » évite l’expression peu naturelle « sur leur esprit » en français.
