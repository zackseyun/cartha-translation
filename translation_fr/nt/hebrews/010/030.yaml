  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: fr
  text: 'Car nous connaissons celui qui a dit : « À moi la vengeance ; c’est moi qui rendrai », et encore[a] : « Le Seigneur jugera son peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces paroles font écho à Deutéronome 32,35-36. Dans leur contexte d’origine, « juger » peut inclure aussi bien le châtiment que la défense de son peuple ; ici, le contexte d’avertissement met l’accent sur le jugement de Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: Car nous connaissons
  rationale: οἶδα a ici le sens présent de « connaître », et γάρ maintient le lien explicatif avec le verset précédent.
- source_word: τὸν εἰπόντα
  choice: celui qui a dit
  rationale: Rend naturellement le participe aoriste substantivé et conserve la référence personnelle à Dieu comme auteur des paroles citées.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: À moi la vengeance
  rationale: Conserve la formulation elliptique, solennelle et emphatique du grec sans ajouter un verbe absent du texte.
- source_word: ἐγὼ ἀνταποδώσω
  choice: c’est moi qui rendrai à chacun ce qui lui est dû
  rationale: La tournure clivée rend l’emphase du pronom ἐγώ ; « rendre ce qui est dû » exprime clairement l’idée de rétribution portée par ἀνταποδίδωμι, sans la limiter à une revanche humaine.
- source_word: καὶ πάλιν
  choice: et encore
  rationale: Formule française naturelle pour introduire une seconde citation, sans ajouter de verbe.
- source_word: Κρινεῖ κύριος
  choice: Le Seigneur jugera
  rationale: « Jugera » préserve la portée judiciaire de κρίνω et son amplitude possible, notamment châtiment ou justification, tandis que « Seigneur » est l’équivalent normal de κύριος.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: Traduction française idiomatique qui conserve la portée collective et l’arrière-plan d’alliance.
theological_decisions:
- issue: Portée de la vengeance divine
  choice: « À moi la vengeance » et « je rendrai à chacun ce qui lui est dû »
  alternative: « La vengeance m’appartient ; je rétribuerai »
  rationale: La traduction maintient l’affirmation que la rétribution appartient à Dieu, tout en évitant d’assimiler sa justice à une vengeance humaine arbitraire.
- issue: Portée de κρίνω dans la citation de Deutéronome
  choice: « Le Seigneur jugera son peuple »
  alternative: « Le Seigneur fera justice à son peuple » ou « défendra son peuple »
  rationale: Le contexte d’avertissement d’Hébreux 10 souligne le jugement divin. « Jugera » conserve toutefois l’ambivalence légitime du langage judiciaire, qui peut comprendre condamnation et justification, sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation et le rythme maintiennent le caractère solennel des citations. L’emphase de ἐγώ est rendue par « c’est moi qui ». Le seul appel de note [a] figure dans le texte principal.
