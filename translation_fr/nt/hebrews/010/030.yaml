  terminology: « Le Seigneur jugera son peuple » est fidèle à Κρινεῖ κύριος τὸν λαὸν αὐτοῦ et conserve, sans la résoudre, l’amplitude judiciaire de la citation deutéronomique. « Vengeance » convient à ἐκδίκησις dans cette citation.
