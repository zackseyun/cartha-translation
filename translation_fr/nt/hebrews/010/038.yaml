source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: fr
  text: Mais mon juste vivra par la foi[a] ; et s’il recule[b], mon âme ne trouve aucun plaisir en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la confiance » ou « par la fidélité ». Le mot grec pistis peut exprimer ces nuances ; le texte principal retient « foi ».
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent simplement « le juste » au lieu de « mon juste ». Le singulier masculin grec a ici une portée représentative et ne vise pas nécessairement les hommes seulement.
    reason: textual_variant_and_cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Mais mon juste
  rationale: L’adjectif substantivé désigne ici une personne caractérisée par la justice. « Mon juste » rend avec concision l’article, l’adjectif et le possessif du texte SBLGNT, sans ajouter un nom masculin comme « homme ».
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: La préposition ἐκ exprime ici le fondement ou le moyen. « Par la foi » est naturel en français et conserve le rendu principal de πίστις, tandis que les sens possibles de confiance et de fidélité sont signalés en note.
- source_word: ζήσεται
  choice: vivra
  rationale: Le futur de ζάω est rendu directement par le futur simple français.
- source_word: ὑποστείληται
  choice: recule
  rationale: Dans ce contexte d’exhortation à persévérer, le verbe évoque le fait de se retirer ou de battre en retraite. « Reculer » est clair, actuel et préserve la force de l’avertissement.
- source_word: οὐκ εὐδοκεῖ
  choice: ne prend aucun plaisir
  rationale: Cette formulation restitue le sens de satisfaction ou d’agrément exprimé par εὐδοκέω, tout en gardant la construction personnelle du grec.
- source_word: ἡ ψυχή μου
  choice: mon âme
  rationale: Le grec dit explicitement « mon âme ». Le maintien de cette expression conserve l’écho scripturaire et évite de l’aplatir en un simple « je ».
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: « En lui » correspond directement à ἐν avec le datif après εὐδοκέω et reste idiomatique dans ce registre.
theological_decisions:
- issue: Sens de πίστις dans ἐκ πίστεως
  choice: foi
  alternative: confiance ou fidélité
  rationale: Le contexte permet de discuter les nuances de foi, de confiance et de fidélité. Le texte principal retient « foi », sans trancher silencieusement la question, puisque les autres possibilités figurent en note.
- issue: Référent du sujet dans « s’il recule »
  choice: Le même référent singulier que « mon juste » demeure grammaticalement possible et naturel
  alternative: Une personne indéfinie distincte pourrait être comprise
  rationale: Le grec enchaîne les deux propositions au singulier sans marquer explicitement un changement de sujet. La traduction conserve donc cette tension et n’atténue pas l’avertissement pour des raisons doctrinales.
- issue: Genre grammatical et portée représentative
  choice: Ne pas ajouter de pronom genré en français
  alternative: « s’il se dérobe » ou une explicitation comme « cet homme »
  rationale: Le français permet avec « s’il recule » de respecter le singulier grammatical sans insérer « il » comme pronom autonome ni exclure la portée représentative. « Mon juste » reste masculin en accord avec la forme grecque substantivée.
- issue: Variante textuelle concernant μου
  choice: Inclure « mon » selon le SBLGNT fourni
  alternative: « le juste » dans certains manuscrits
  rationale: Le texte source demandé contient μου. La variante est toutefois pertinente et signalée en note afin de documenter l’attestation de la leçon sans possessif.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule conserve l’articulation serrée des deux propositions. « Mon juste » est légèrement marqué mais naturel dans un registre scripturaire ; il évite l’ajout de « homme » et suit précisément la leçon SBLGNT.
