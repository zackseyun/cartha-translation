lexical_decisions:
- source_word: ἣν
  choice: qu’il
  rationale: Le pronom relatif reprend le chemin évoqué dans la proposition et maintient le lien syntaxique avec le verset précédent sans préciser davantage l’antécédent.
- source_word: ἐνεκαίνισεν
  choice: a inauguré
  rationale: Le verbe exprime la mise en service nouvelle, avec une possible résonance cultuelle; « inaugurer » conserve cette nuance mieux que le simple « ouvrir ».
- source_word: ἡμῖν
  choice: pour nous
  rationale: Le datif marque ici l’avantage ou le bénéfice.
- source_word: ὁδὸν
  choice: chemin
  rationale: « Chemin » convient naturellement au sens concret comme à l’image d’un accès auprès de Dieu.
- source_word: πρόσφατον
  choice: nouveau
  rationale: Dans ce contexte, l’adjectif désigne un chemin nouvellement établi; « nouveau » est clair et idiomatique.
- source_word: ζῶσαν
  choice: vivant
  rationale: Cette traduction directe préserve l’image sans l’interpréter comme « qui donne la vie ».
- source_word: διὰ τοῦ καταπετάσματος
  choice: à travers le rideau
  rationale: Le terme désigne le rideau intérieur du sanctuaire; « rideau » est actuel et compréhensible, tandis que « voile » reste une possibilité traditionnelle signalée en note.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Formule française naturelle pour introduire une explication ou une identification.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: sa chair
  rationale: Le génitif est en apposition à « rideau ». « Chair » garde la transparence lexicale et l’identification métaphorique sans substituer « corps ».
theological_decisions:
- issue: Identification métaphorique du rideau à la chair de Jésus
  choice: « le rideau, c’est-à-dire sa chair »
  alternative: « le rideau, c’est-à-dire à travers sa chair »
  rationale: La construction grecque place « sa chair » en apposition explicative à « rideau ». Ne pas répéter « à travers » préserve cette identification et l’ambiguïté de la métaphore sans imposer une analyse théologique supplémentaire.
- issue: Traduction de σάρξ
  choice: chair
  alternative: corps
  rationale: Le mot renvoie ici à la réalité corporelle de Jésus. « Chair » correspond directement au grec et conserve la portée théologique du terme.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure liée au contexte précédent, comme dans le grec. « Rideau » est préféré à « voile » dans le texte principal pour sa clarté actuelle; la note conserve l’expression traditionnelle et signale la portée syntaxique possible.
