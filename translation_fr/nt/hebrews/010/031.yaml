source:
  edition: SBLGNT
  text: φοβερὸν τὸ ἐμπεσεῖν εἰς χεῖρας θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: fr
  text: C’est une chose redoutable que de tomber entre les mains du Dieu vivant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est terrifiant de tomber entre les mains du Dieu vivant. »'
    reason: Alternative lexicale possible pour φοβερὸν, exprimant plus directement l’effroi.
lexical_decisions:
- source_word: φοβερὸν
  choice: une chose redoutable
  rationale: L’adjectif prédicatif exprime ce qui inspire la crainte ou l’effroi. « Une chose redoutable » garde la gravité solennelle du grec dans un français naturel, sans intensifier autant que « terrifiant ».
- source_word: τὸ ἐμπεσεῖν
  choice: que de tomber
  rationale: L’article suivi de l’infinitif aoriste substantive l’action. La tournure française « c’est une chose… que de tomber » reproduit naturellement cette construction et conserve l’idée forte de tomber sous le pouvoir de quelqu’un.
- source_word: εἰς χεῖρας
  choice: entre les mains
  rationale: En français, l’expression idiomatique est « tomber entre les mains de ». Elle conserve l’image biblique des mains tout en évoquant, sans l’expliciter, le fait de se trouver sous le pouvoir et le jugement de Dieu.
- source_word: θεοῦ
  choice: Dieu
  rationale: 'Le génitif dépend de « mains » : « les mains de Dieu ». Aucun ajout interprétatif n’est nécessaire.'
- source_word: ζῶντος
  choice: vivant
  rationale: Le participe présent qualifie Dieu. « Le Dieu vivant » est l’expression biblique française consacrée et souligne sa présence réelle et agissante.
theological_decisions:
- issue: Portée de l’avertissement
  choice: Une déclaration générale et solennelle sur le caractère redoutable de tomber sous le pouvoir judiciaire du Dieu vivant
  alternative: Une référence limitée à une discipline temporelle, ou une affirmation existentielle sans connotation de jugement
  rationale: Le contexte conclut un passage d’avertissement, et l’expression « tomber entre les mains de » porte une forte connotation de pouvoir et de jugement. La traduction préserve cette gravité sans ajouter le mot « jugement », absent du grec, et maintient ainsi la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image biblique et le rythme sentencieux de l’original. « Redoutable » maintient la solennité sans paraître archaïque; la note signale l’alternative plus intense « terrifiant ».
