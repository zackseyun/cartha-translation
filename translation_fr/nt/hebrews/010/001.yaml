id: HEB.10.1
reference: Hebrews 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: fr
  text: En effet, la loi ne possède qu’une ombre des biens à venir, et non l’image même des réalités[a]. Elle ne peut jamais, par les mêmes sacrifices que l’on offre continuellement, année après année, mener à la perfection[b] ceux qui s’approchent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la forme même des réalités ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rendre parfaits » ou « mener à l’accomplissement ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit ici de ceux qui s’approchent de Dieu pour lui rendre un culte.
    reason: cultural_note
lexical_decisions:
- source_word: Σκιὰν
  choice: une ombre
  rationale: Le sens concret d’« ombre » conserve la métaphore et son contraste avec εἰκών, sans expliciter excessivement l’idée de préfiguration.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: des biens à venir
  rationale: Cette tournure française naturelle maintient l’orientation future du participe sans préciser indûment le calendrier eschatologique.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: et non l’image même des réalités
  rationale: « L’image même » rend l’emphase de αὐτήν et conserve le terme εἰκών; « réalités » fait ressortir le contraste avec l’ombre tout en restant compatible avec le sens large de πραγμάτων.
- source_word: κατ’ ἐνιαυτὸν
  choice: année après année
  rationale: La formulation souligne la répétition annuelle au cœur de l’argument.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: par les mêmes sacrifices
  rationale: « Par » exprime la valeur instrumentale du datif, et « mêmes » maintient l’accent sur la répétition des sacrifices identiques.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: que l’on offre continuellement
  rationale: Le pronom indéfini respecte l’absence de sujet exprimé en grec; « continuellement » rend εἰς τὸ διηνεκές sans identifier explicitement les officiants.
- source_word: οὐδέποτε δύναται
  choice: elle ne peut jamais
  rationale: Cette expression idiomatique conserve à la fois l’incapacité exprimée par δύναται et la négation absolue de οὐδέποτε.
- source_word: τελειῶσαι
  choice: mener à la perfection
  rationale: Cette traduction garde le vocabulaire théologique de la perfection tout en évoquant l’atteinte du but, plutôt qu’une simple absence de défaut moral.
- source_word: τοὺς προσερχομένους
  choice: ceux qui s’approchent
  rationale: La formulation préserve l’idée cultuelle de s’approcher de Dieu sans ajouter dans le corps du texte un complément seulement implicite.
theological_decisions:
- issue: Le contraste entre l’ombre et l’image dans la théologie cultuelle
  choice: La loi ne possède qu’une ombre des biens futurs, non l’image même des réalités.
  alternative: La loi est une représentation symbolique des biens futurs.
  rationale: Le grec oppose explicitement σκιά à εἰκών. La traduction maintient cette opposition sans dévaloriser le rôle donné à la loi ni l’identifier à la réalité définitive.
- issue: La portée de τελειῶσαι dans le contexte sacrificiel de l’épître
  choice: mener à la perfection
  alternative: rendre parfaits; mener à l’accomplissement
  rationale: Dans Hébreux, le verbe désigne l’accès au but voulu, notamment dans le rapport à Dieu. La formulation conserve la résonance de « perfection » sans imposer le sens étroit de perfection morale absolue.
- issue: Le complément implicite de τοὺς προσερχομένους
  choice: ceux qui s’approchent, avec une note indiquant qu’il s’agit de s’approcher de Dieu dans le culte
  alternative: ceux qui s’approchent de Dieu
  rationale: Le contexte soutient fortement l’approche cultuelle de Dieu, mais le complément n’est pas exprimé dans le grec; la note permet de préserver à la fois le texte et sa nuance contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque très longue est divisée en deux phrases pour la lisibilité, sans modifier son enchaînement logique. Le vocabulaire d’« ombre », d’« image », de « réalités » et de « perfection » est conservé afin de respecter les tensions conceptuelles propres à Hébreux.
