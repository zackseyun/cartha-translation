  variant: modern international French
source:
  edition: SBLGNT
  text: ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ εὐδόκησας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/006.yaml
  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: fr
  text: Tu n’as pris plaisir ni aux sacrifices entièrement brûlés ni aux sacrifices pour le péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: holocaustes
  rationale: Dans le vocabulaire sacrificiel biblique français, « holocaustes » désigne précisément les offrandes entièrement consumées par le feu. Le contexte empêche ici la confusion avec le sens historique moderne du mot.
- source_word: καὶ
  choice: ni… ni…
  rationale: Avec la négation οὐκ, la coordination est rendue naturellement en français par « ni… ni… », sans modifier les deux catégories coordonnées.
- source_word: περὶ ἁμαρτίας
  choice: sacrifices pour le péché
  rationale: Dans ce contexte cultuel, l’expression grecque est idiomatique et désigne des sacrifices offerts pour le péché; cette formulation reste explicite et naturelle.
- source_word: οὐκ εὐδόκησας
  choice: Tu n’as pris plaisir
  rationale: Cette formulation conserve la deuxième personne du singulier, l’aspect verbal passé et le sens évaluatif de εὐδοκέω, sans renforcer indûment l’idée d’émotion.
theological_decisions:
- issue: Terminologie sacrificielle dans la citation du Psaume 40 selon la Septante
  choice: 'Conserver deux catégories cultuelles précises : « holocaustes » et « sacrifices pour le péché ».'
  alternative: « offrandes entièrement brûlées et offrandes pour le péché »
  rationale: L’argument de l’épître distingue des sacrifices déterminés; les remplacer par un terme générique atténuerait cette précision. La traduction n’ajoute aucune interprétation doctrinale à l’affirmation selon laquelle Dieu n’y a pas pris plaisir.
translation_notes:
  register: Français international moderne, clair et digne. « Holocaustes » est retenu comme terme cultuel biblique précis; la note explicite l’autre rendu possible de l’expression περὶ ἁμαρτίας.
