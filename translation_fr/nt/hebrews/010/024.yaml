  text: καὶ κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/024.yaml
  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: fr
  text: et soyons attentifs les uns aux autres, afin de nous stimuler mutuellement à l’amour et aux bonnes œuvres,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous encourager vivement » ou « nous provoquer » à l’amour et aux bonnes œuvres. Le nom grec παροξυσμός peut désigner une forte stimulation ou provocation.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: veillons
  rationale: Le subjonctif présent à valeur exhortative appelle une attention réfléchie et soutenue portée aux autres. « Veillons les uns sur les autres » est naturel en français et conserve cette dimension d’attention, sans réduire le verbe à une simple observation.
- source_word: ἀλλήλους
  choice: les uns sur les autres
  rationale: Rend la réciprocité communautaire du pronom. Avec « veiller », cette formulation est idiomatique et indique que chacun porte attention aux autres.
- source_word: εἰς
  choice: afin de
  rationale: La préposition introduit ici la visée ou le résultat recherché. « Afin de » exprime clairement cette orientation en français.
- source_word: παροξυσμὸν
  choice: nous inciter
  rationale: Le nom désigne une stimulation ou une provocation forte. La tournure verbale « nous inciter » restitue naturellement en français l’effet réciproque recherché, tout en conservant une certaine vigueur.
- source_word: ἀγάπης
  choice: l’amour
  rationale: Équivalent courant et direct de ἀγάπη en français moderne.
- source_word: καλῶν ἔργων
  choice: belles œuvres
  rationale: « Belles œuvres » conserve la valeur qualitative de καλός, qui peut signifier beau, noble ou bon, ainsi que le lien lexical avec ἔργον. Cette expression reste digne et compréhensible, sans introduire une doctrine du mérite.
- source_word: καὶ
  choice: et
  rationale: Le premier καί relie l’exhortation au contexte précédent; le second coordonne l’amour et les belles œuvres.
theological_decisions:
- issue: Connotation potentiellement négative de παροξυσμός
  choice: nous inciter à l’amour et aux belles œuvres
  alternative: nous provoquer à l’amour et aux belles œuvres; nous stimuler à l’amour et aux belles œuvres
  rationale: Le terme grec est vigoureux et peut ailleurs évoquer l’irritation ou la provocation. Ici, l’amour et les belles œuvres orientent clairement l’action vers un but positif. Le texte principal emploie donc « inciter », tandis que la note préserve l’intensité et l’ambiguïté lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la coordination initiale avec le contexte. « Veillons les uns sur les autres » exprime une attention active et réciproque; « belles œuvres » maintient la nuance de καλός sans coloration confessionnelle particulière.
