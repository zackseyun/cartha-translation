id: HEB.10.4
reference: Hebrews 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: fr
  text: En effet, il est impossible que le sang des taureaux et des boucs enlève les péchés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ôte les péchés » ou « fait disparaître les péchés ».
    reason: Alternative lexicale permettant de refléter l’étendue de sens du verbe grec ἀφαιρεῖν.
lexical_decisions:
- source_word: ἀδύνατον
  choice: il est impossible
  rationale: L’adjectif prédicatif employé avec l’infinitif exprime ici une impossibilité absolue; cette tournure est naturelle en français.
- source_word: γὰρ
  choice: En effet
  rationale: La particule introduit l’explication de l’affirmation précédente; « En effet » rend clairement ce lien argumentatif.
- source_word: αἷμα
  choice: le sang
  rationale: Le terme concret appartient au langage sacrificiel central dans l’argument de l’épître et ne doit pas être remplacé par « sacrifice » ou « mort ».
- source_word: ταύρων
  choice: des taureaux
  rationale: Le génitif pluriel dépend de « sang »; « taureaux » conserve la désignation précise des animaux.
- source_word: τράγων
  choice: des boucs
  rationale: Le grec désigne des chèvres mâles; « boucs » est précis, naturel et adapté au contexte sacrificiel.
- source_word: ἀφαιρεῖν
  choice: enlève
  rationale: Le verbe signifie ôter ou retirer. « Enlever les péchés » conserve sa force concrète et s’intègre naturellement à la phrase française.
- source_word: ἁμαρτίας
  choice: les péchés
  rationale: Le pluriel explicite du grec est maintenu plutôt que ramené à l’abstrait singulier « le péché ».
theological_decisions:
- issue: Efficacité des sacrifices d’animaux dans l’argument de l’épître
  choice: Le verset affirme que le sang des animaux ne peut enlever les péchés, sans préciser davantage la portée de cette impossibilité.
  alternative: Expliquer qu’il procurait une purification rituelle ou une couverture temporaire sans suppression définitive des péchés.
  rationale: La formulation reste proche du grec et préserve la tension théologique du contexte sans introduire dans le texte une explication doctrinale qui n’y est pas explicitement formulée.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » assure un enchaînement argumentatif naturel; « taureaux et boucs » conserve la précision du vocabulaire sacrificiel.
source_grounding:
  english_pob_role: consult_only
