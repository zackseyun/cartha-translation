reference: Hebrews 10:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: fr
  text: En effet, vous avez partagé les souffrances des prisonniers[a] et vous avez accepté avec joie qu’on vous dépouille de vos biens, sachant que vous possédez vous-mêmes un bien meilleur, qui demeure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous avez eu compassion des prisonniers ». Le verbe grec peut exprimer la compassion, mais il peut aussi désigner le fait de prendre part à leurs souffrances. Certains manuscrits portent : « vous avez partagé mes chaînes ».'
    reason: lexical_and_textual_alternative
  - marker: b
    text: 'Certains manuscrits ajoutent : « dans les cieux » — « un bien meilleur dans les cieux, et qui demeure ».'
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: des prisonniers
  rationale: Le nom désigne des personnes détenues ou enchaînées. « Des prisonniers » est direct, naturel et conserve le pluriel du grec.
- source_word: συνεπαθήσατε
  choice: vous avez partagé les souffrances de
  rationale: Le verbe peut exprimer la compassion ou la solidarité dans la souffrance. Dans ce contexte de persécution, cette formulation met en avant une solidarité concrète sans exclure la compassion.
- source_word: ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν
  choice: qu’on vous dépouille de vos biens
  rationale: ἁρπαγή évoque une prise violente ou injuste. La tournure verbale française « qu’on vous dépouille » rend naturellement cet acte subi, tandis que « vos biens » traduit le participe substantivé désignant les possessions matérielles.
- source_word: μετὰ χαρᾶς προσεδέξασθε
  choice: vous avez accepté avec joie
  rationale: La formulation conserve l’idée d’accueillir ou d’accepter volontairement l’épreuve, sans laisser entendre que les destinataires approuvaient l’injustice elle-même.
- source_word: γινώσκοντες
  choice: sachant
  rationale: Le participe présent préserve à la fois le lien temporel et la nuance causale avec l’acceptation joyeuse de la perte.
- source_word: ἔχειν ἑαυτοὺς
  choice: vous avez vous-mêmes
  rationale: Cette tournure maintient l’insistance portée par le pronom réfléchi du texte retenu, sans transformer le verbe en une notion plus interprétative.
- source_word: κρείττονα ὕπαρξιν
  choice: un bien meilleur
  rationale: « Meilleur » respecte le thème comparatif récurrent de l’épître. Ici, « un bien » désigne naturellement en français quelque chose que l’on possède et fait écho aux biens matériels précédemment perdus.
- source_word: μένουσαν
  choice: qui demeure
  rationale: La proposition relative rend clairement l’idée de permanence exprimée par μένω, tout en préservant la formulation concrète et sobre du grec.
theological_decisions:
- issue: Portée de la solidarité envers les croyants emprisonnés
  choice: La traduction présente les destinataires comme ayant partagé les souffrances des prisonniers.
  alternative: « Vous avez eu compassion des prisonniers. »
  rationale: συμπαθέω peut désigner la compassion, mais le contexte de persécution et la construction avec le datif permettent de mettre en relief une solidarité coûteuse et concrète, sans réduire le verbe à un sentiment intérieur.
- issue: Nature du « bien meilleur, qui demeure »
  choice: La traduction conserve une désignation générale, sans préciser son lieu ni l’identifier explicitement à un héritage ou à une récompense.
  alternative: « Un bien meilleur dans les cieux » ou « un meilleur héritage ».
  rationale: Le texte SBLGNT retenu ne contient pas de complément indiquant les cieux. La traduction maintient donc l’ouverture du texte et n’ajoute pas une identification théologique plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. « Qu’on vous dépouille de vos biens » évite le tour plus lourd « le pillage de vos biens », tandis que « un bien meilleur, qui demeure » conserve le contraste lexical et théologique entre les possessions perdues et la possession durable.
