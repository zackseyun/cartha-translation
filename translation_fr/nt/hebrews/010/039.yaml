  source_fidelity: La première opposition est correctement comprise comme une appartenance à la catégorie de ceux qui reculent, avec la perte/destruction comme aboutissement. En revanche, « et préservent leur vie » transforme la seconde expression grecque, nominale et orientée par εἰς (« vers/en vue de la préservation ou acquisition de la vie »), en une action directement attribuée aux croyants. La révision maintient la construction catégorielle et le lien de finalité/résultat sans surinterpréter περιποίησις.
  naturalness: « De ceux qui » est une explicitation française naturelle du génitif catégoriel. « Pour la préservation de leur vie » est sobre, clair et conserve le parallélisme avec « leur perte »; il évite aussi de faire de la préservation une action autonome des sujets.
  terminology: « Foi » rend normalement πίστις, tandis que la note conserve la possible nuance de fidélité persévérante. « Vie » convient pour ψυχή dans ce contexte, sans imposer le sens étroit d’une âme désincarnée. La note sur περιποίησις est corrigée afin d’éviter « gagner sa vie », expression française moderne susceptible d’évoquer le fait de gagner son salaire.
  issues:
