  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: fr
  text: Mais nous ne sommes pas de ceux qui reculent pour aller à leur perte[a], mais de ceux qui ont la foi[b], pour la préservation de leur vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se retirent et vont à la destruction ». Le terme grec peut désigner un recul ou un retrait ; certains y voient ici plus précisément l’abandon de la foi.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ceux qui demeurent fidèles ». Le mot grec traduit par « foi » peut aussi évoquer une fidélité persévérante.
    reason: alternative_reading
  - marker: c
    text: Littéralement « pour la préservation de l’âme ». L’expression grecque peut aussi signifier « pour l’acquisition de l’âme » ou « de la vie » ; ici, « âme » peut désigner la vie ou la personne tout entière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mais nous
  rationale: Le pronom explicite souligne le contraste avec l’avertissement précédent, et δέ reçoit ici sa valeur adversative naturelle.
- source_word: οὐκ ἐσμὲν ὑποστολῆς
  choice: nous ne sommes pas de ceux qui reculent
  rationale: Le génitif exprime l’appartenance à une catégorie. Cette formulation est idiomatique en français et rend ὑποστολή comme un mouvement de retrait sans préciser excessivement qu’il s’agit nécessairement d’une apostasie complète.
- source_word: εἰς ἀπώλειαν
  choice: et vont à leur perte
  rationale: εἰς indique l’aboutissement du recul. « Aller à sa perte » exprime naturellement en français cette orientation vers la destruction.
- source_word: ἀλλὰ πίστεως
  choice: mais de ceux qui ont la foi
  rationale: La construction catégorielle sous-entendue est explicitée pour un français naturel. « Foi » conserve le sens principal de πίστις, tout en laissant sa nuance de fidélité persévérante à la note.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: et préservent leur vie
  rationale: Dans son opposition à ἀπώλεια, περιποίησις prend naturellement le sens de préservation. Ici ψυχή désigne vraisemblablement la vie ou la personne elle-même, plutôt que l’âme conçue étroitement comme une partie immatérielle.
theological_decisions:
- issue: Sens de πίστις dans son contraste avec ὑποστολή
  choice: la foi
  alternative: la fidélité
  rationale: Le contexte met en contraste le recul et la foi persévérante. Le texte principal conserve « foi », sans exclure la nuance de fidélité indiquée en note.
- issue: Sens de περιποίησις ψυχῆς
  choice: préservent leur vie
  alternative: obtiennent le salut de leur âme / gagnent leur vie
  rationale: L’opposition immédiate avec la perte favorise le sens de préservation. La formulation ne présente pas cette préservation comme un salut mérité et évite de réduire ψυχή à la seule âme immatérielle.
translation_notes:
  register: Français international moderne, sobre et digne. La structure grecque très condensée est explicitée par « de ceux qui » dans les deux membres. « Préservent leur vie » évite un emploi moderne trop étroit d’« âme », tandis que la traduction plus formelle est conservée en note.
