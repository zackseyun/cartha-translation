- from: Mais nous ne sommes pas de ceux qui reculent et vont à leur perte[a], mais de ceux qui ont la foi et préservent leur vie[b][c].
  to: Mais nous ne sommes pas de ceux qui reculent pour aller à leur perte[a], mais de ceux qui ont la foi[b], pour la préservation de leur vie[c].
  rationale: La révision rétablit une expression nominale pour περιποίησις et marque explicitement son orientation par « pour », tout en conservant « vie » comme rendu contextuel de ψυχή. Les ancres sont rattachées aux mots qu’elles expliquent et la note lexicale est formulée sans idiome français trompeur.
