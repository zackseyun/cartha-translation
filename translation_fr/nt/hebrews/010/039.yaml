    rationale: '« Et préservent leur vie » modifie la forme et resserre la relation sémantique : le grec exprime « foi pour/en vue de la préservation (ou acquisition) de la vie/âme ». Une formulation nominale préserve mieux l’ambiguïté et le parallélisme.'
  - severity: low
    issue: L’ancre de la note sur πίστις est placée après « vie » plutôt qu’après « foi ».
    rationale: L’ancre doit suivre le terme commenté, afin que la note sur la nuance de πίστις soit correctement rattachée.
  - severity: low
