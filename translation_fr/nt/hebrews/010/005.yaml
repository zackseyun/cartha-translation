  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: fr
  text: 'C’est pourquoi, en entrant dans le monde, il dit : « Tu n’as voulu ni sacrifice ni offrande, mais tu m’as préparé un corps[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’épître aux Hébreux reprend ici la formulation grecque du Psaume 40.7 : « tu m’as préparé un corps ». Le texte hébreu du Psaume 40.7 dit : « tu m’as ouvert les oreilles ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque l’inférence qui relie ce verset à l’argument précédent, dans un français naturel et soutenu.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: en entrant dans le monde
  rationale: Conserve la valeur circonstancielle du participe présent sans imposer un temps passé absent du grec.
- source_word: λέγει
  choice: il dit
  rationale: Maintient le présent grec employé pour introduire la parole scripturaire.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: ni sacrifice ni offrande
  rationale: Dans la portée de la négation, la coordination française « ni… ni… » est idiomatique et garde distincts les deux termes cultuels.
- source_word: οὐκ ἠθέλησας
  choice: tu n’as voulu
  rationale: Rend directement la volonté ou le désir exprimé par θέλω, avec une formulation française naturelle.
- source_word: σῶμα δὲ κατηρτίσω μοι
  choice: mais tu m’as préparé un corps
  rationale: Exprime le contraste de δέ, le sens de préparation de καταρτίζω et le datif d’intérêt μοι sans développer davantage le texte.
theological_decisions:
- issue: La formulation de la citation du Psaume 40.7 dans Hébreux diffère du texte hébreu du psaume.
  choice: 'Traduire le texte grec d’Hébreux : « tu m’as préparé un corps »'
  alternative: « tu m’as ouvert les oreilles », d’après le texte hébreu du Psaume 40.7
  rationale: La traduction suit en priorité le texte grec du verset d’Hébreux, qui porte σῶμα (« corps »), tout en signalant en note la variante significative du texte hébreu du psaume sans les harmoniser.
translation_notes:
  register: Français international moderne, naturel et digne. La construction participiale est conservée par « en entrant », et la citation garde son caractère poétique sans archaïsme.
