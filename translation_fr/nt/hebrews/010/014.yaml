id: HEB.10.14
reference: Hebrews 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: fr
  text: Car, par une seule offrande, il a rendu parfaits pour toujours ceux qui sont sanctifiés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont rendus saints ».
    reason: Alternative lexicale pour ἁγιαζομένους ; elle explicite le sens de « sanctifiés » tout en conservant le passif.
lexical_decisions:
- source_word: μιᾷ
  choice: une seule
  rationale: Le datif féminin singulier modifie « offrande ». « Une seule » souligne naturellement en français l’unicité de l’offrande dans le contexte.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison explicative qui appuie l’argument précédent.
- source_word: προσφορᾷ
  choice: offrande
  rationale: « Offrande » correspond directement au terme grec et conserve sa portée, sans le préciser davantage par « sacrifice ».
- source_word: τετελείωκεν
  choice: il a rendu parfaits
  rationale: Le parfait grec exprime un acte accompli dont le résultat demeure. Cette formulation conserve le lien lexical avec la perfection tout en étant naturelle en français.
- source_word: εἰς τὸ διηνεκές
  choice: pour toujours
  rationale: Dans Hébreux, cette expression indique une validité durable et sans fin. « Pour toujours » est clair et idiomatique.
- source_word: τοὺς ἁγιαζομένους
  choice: ceux qui sont en train d’être sanctifiés
  rationale: Le participe présent passif est rendu de manière à préserver explicitement son aspect en cours et la réception de l’action.
theological_decisions:
- issue: Rapport entre la perfection accomplie et la sanctification en cours
  choice: Maintenir côte à côte « il a rendu parfaits » et « sont en train d’être sanctifiés ».
  alternative: Traduire de manière à présenter soit les deux actions comme entièrement accomplies, soit la perfection comme un simple processus inachevé.
  rationale: Le grec associe délibérément le résultat accompli et durable de τετελείωκεν au participe présent passif ἁγιαζομένους. La traduction conserve cette tension sans l’harmoniser selon un système doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. « Une seule offrande » est idiomatique et met nettement en relief l’unicité. La tournure « en train d’être sanctifiés » est légèrement explicite, mais elle préserve l’aspect progressif du participe grec.
