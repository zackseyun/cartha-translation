id: HEB.10.29
reference: Hebrews 10:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: fr
  text: À votre avis, combien plus sévère sera le châtiment que méritera celui qui a foulé aux pieds le Fils de Dieu, qui a tenu pour profane[a] le sang de l’alliance par lequel il a été sanctifié[b], et qui a outragé[c] l’Esprit de la grâce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « commun » ; ou « impur » (c’est-à-dire non saint).'
    reason: lexical_alternative
  - marker: b
    text: Dans la syntaxe grecque, le sujet implicite de « a été sanctifié » se rapporte naturellement à la personne décrite dans le verset ; certains interprètes comprennent toutefois le référent autrement.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « insulté » ; « traité avec un mépris arrogant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ … χείρονος
  choice: combien plus sévère
  rationale: Cette tournure française naturelle restitue la force comparative de la question rhétorique grecque sans recourir au calque maladroit « de combien pire ».
- source_word: ἀξιωθήσεται τιμωρίας
  choice: le châtiment que méritera
  rationale: Le grec signifie littéralement « sera jugé digne d’un châtiment ». La formulation retenue conserve le sens judiciaire tout en restant idiomatique en français moderne.
- source_word: καταπατήσας
  choice: a foulé aux pieds
  rationale: Conserve l’image vigoureuse du grec et l’idée d’un profond mépris.
- source_word: υἱὸν τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Rendu direct et traditionnel du titre christologique.
- source_word: κοινὸν
  choice: profane
  rationale: Dans l’opposition implicite avec ce qui est saint ou consacré, « profane » communique mieux que « commun » la portée sacrilège du terme, tout en signalant les autres possibilités en note.
- source_word: ἡγησάμενος
  choice: a tenu pour
  rationale: Expression française naturelle qui rend le jugement ou l’évaluation délibérée exprimée par le verbe grec.
- source_word: αἷμα τῆς διαθήκης
  choice: le sang de l’alliance
  rationale: Préserve la formulation biblique et ses résonances sacrificielles et covenantales.
- source_word: ἐν ᾧ
  choice: par lequel
  rationale: 'Rend la valeur instrumentale la plus naturelle dans le contexte : la sanctification s’effectue par le sang de l’alliance.'
- source_word: ἡγιάσθη
  choice: il a été sanctifié
  rationale: Conserve la voix passive et le vocabulaire théologique récurrent de l’épître, sans paraphrase doctrinale.
- source_word: ἐνυβρίσας
  choice: a outragé
  rationale: Exprime plus fortement qu’un simple manque de respect le traitement insultant et méprisant désigné par le grec.
theological_decisions:
- issue: Référent du sujet implicite de ἡγιάσθη (« il a été sanctifié »)
  choice: La proposition est rendue directement par « par lequel il a été sanctifié », son sujet se rapportant naturellement, dans le fil syntaxique, à la personne décrite.
  alternative: Certains comprennent autrement le référent, notamment comme le Christ, ou proposent une lecture liée à la communauté de l’alliance.
  rationale: La traduction suit la syntaxe immédiate sans ajouter une précision qui trancherait la discussion théologique sur l’apostasie et la persévérance. La note reconnaît l’existence d’autres interprétations.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure cumulative et la force rhétorique du grec, tout en réorganisant légèrement l’ouverture pour obtenir une question naturelle en français. Les termes « sang de l’alliance », « sanctifié » et « Esprit de la grâce » maintiennent les liens lexicaux et théologiques propres à l’épître.
