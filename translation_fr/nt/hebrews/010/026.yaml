id: HEB.10.26
reference: Hebrews 10:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: fr
  text: Car si nous continuons à pécher délibérément après avoir reçu la connaissance de la vérité[a], il ne reste plus de sacrifice pour les péchés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pleine connaissance de la vérité ». Le mot grec peut désigner une connaissance plus complète ou décisive.
    reason: Alternative lexicale pour ἐπίγνωσις, dont la nuance renforcée est possible sans être obligatoire dans le texte principal.
lexical_decisions:
- source_word: Ἑκουσίως
  choice: délibérément
  rationale: Ce terme exprime le caractère volontaire et intentionnel de l’action dans un français moderne, sans la tonalité juridique ou vieillie que pourrait avoir « volontairement » dans ce contexte.
- source_word: γὰρ
  choice: Car
  rationale: Conserve le lien explicatif avec l’argument qui précède.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: si nous continuons à pécher
  rationale: Le participe présent suggère ici une action persistante ou répétée. La tournure conditionnelle rend naturellement en français la construction grecque au génitif absolu.
- source_word: μετὰ τὸ λαβεῖν
  choice: après avoir reçu
  rationale: La préposition suivie de l’infinitif substantivé marque une action antérieure accomplie; cette formulation française en préserve clairement la succession temporelle.
- source_word: ἐπίγνωσιν
  choice: la connaissance
  rationale: « Connaissance » est naturel et lexicalement sûr. Une nuance de connaissance pleine ou décisive est possible, mais non imposée; elle est signalée en note.
- source_word: τῆς ἀληθείας
  choice: de la vérité
  rationale: Rend directement le génitif défini, probablement relatif dans le contexte à la vérité du message reçu.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Exprime clairement qu’à partir de là, aucun sacrifice ne demeure disponible.
- source_word: περὶ ἁμαρτιῶν
  choice: pour les péchés
  rationale: Dans le langage sacrificiel, περί avec le génitif peut désigner ce pour quoi le sacrifice est offert. « Pour les péchés » est idiomatique et conserve cette portée cultuelle.
- source_word: ἀπολείπεται
  choice: il reste
  rationale: La construction impersonnelle est naturelle en français et restitue le sens de ce qui demeure ou est laissé.
- source_word: θυσία
  choice: de sacrifice
  rationale: Après la négation « il ne reste plus de », le français exige naturellement le partitif réduit « de ». Le nom conserve le vocabulaire sacrificiel central dans l’argument de l’épître.
theological_decisions:
- issue: Aspect et portée pastorale de ἁμαρτανόντων
  choice: « si nous continuons à pécher délibérément », désignant une conduite persistante
  alternative: « si nous péchons volontairement », qui pourrait être compris comme un seul acte isolé
  rationale: Le participe présent soutient une action en cours ou persistante. La formulation maintient la gravité de l’avertissement sans affirmer qu’il vise nécessairement un unique péché commis après la réception de la vérité.
- issue: Portée de ἐπίγνωσις dans le contexte de l’avertissement
  choice: « la connaissance de la vérité », sans préciser le statut spirituel exact des personnes concernées
  alternative: « la pleine connaissance de la vérité » ou « la connaissance salvatrice de la vérité »
  rationale: Le texte affirme que cette connaissance a été reçue, mais ne définit pas explicitement ici sa profondeur sotériologique. La traduction ne tranche donc pas entre les diverses compréhensions théologiques des destinataires.
- issue: Sens absolu de l’absence de sacrifice
  choice: Conserver « il ne reste plus de sacrifice pour les péchés » sans ajout explicatif
  alternative: Préciser qu’il n’existe « aucun autre » sacrifice en dehors de celui du Christ
  rationale: Cette interprétation s’accorde avec l’argument général de l’épître, mais le verset lui-même ne contient pas le mot « autre ». Le texte traduit préserve donc la formulation et la tension de l’original.
translation_notes:
  register: Français international moderne, clair et digne. « Continuer à pécher » rend la valeur durative sans lourdeur; « délibérément » maintient l’intentionnalité. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
