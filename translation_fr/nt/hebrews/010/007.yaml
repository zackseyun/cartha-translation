id: HEB.10.7
reference: Hebrews 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: fr
  text: 'Alors j’ai dit : « Me voici, je suis venu — dans le rouleau du livre[a], il est écrit à mon sujet — pour faire ta volonté, ô Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne un rouleau portant un texte, et non un livre relié de forme moderne.
    reason: Précision historique et lexicale sur κεφαλίς et βιβλίον.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Introduit naturellement en français la réponse citée et conserve la progression temporelle.
- source_word: εἶπον
  choice: j’ai dit
  rationale: Le passé composé convient au français moderne pour cet aoriste dans une formule narrative introduisant des paroles.
- source_word: Ἰδοὺ
  choice: Me voici
  rationale: Rend la force présentative et solennelle de l’expression tout en s’accordant naturellement avec l’idée d’arrivée portée par ἥκω.
- source_word: ἥκω
  choice: je suis venu
  rationale: 'Ce présent grec a couramment une valeur résultative : le locuteur est arrivé et se tient désormais présent.'
- source_word: ἐν κεφαλίδι βιβλίου
  choice: dans le rouleau du livre
  rationale: Dans cette expression, κεφαλίς désigne le rouleau portant le texte, non un titre ou un chapitre. La formulation conserve de près l’image et la structure grecques.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée qui rend le parfait passif et l’autorité durable de ce qui demeure écrit.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Équivalent français précis et naturel de περί avec le génitif.
- source_word: τοῦ ποιῆσαι
  choice: pour faire
  rationale: L’infinitif articulé exprime ici le but de la venue ; « pour faire » le rend directement.
- source_word: ὁ θεός
  choice: ô Dieu
  rationale: Le nominatif grec a ici une fonction vocative. « Ô Dieu » marque clairement l’adresse directe et maintient le registre solennel.
- source_word: τὸ θέλημά σου
  choice: ta volonté
  rationale: Rend avec précision le terme θέλημα et conserve sa portée théologique sans paraphrase.
theological_decisions:
- issue: Référence messianique à la première personne dans la citation du psaume
  choice: Conserver la déclaration à la première personne sans identifier explicitement le locuteur dans ce verset.
  alternative: Ajouter dans le texte que le locuteur est le Messie ou le Christ.
  rationale: Le contexte de l’épître applique ces paroles au Fils, mais le verset lui-même demeure une déclaration à la première personne. La traduction laisse le contexte établir cette application christologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Me voici » préserve la solennité scripturaire sans employer un archaïsme obscur ; les tirets rendent l’incise grecque lisible tout en maintenant son rapport avec la venue du locuteur.
