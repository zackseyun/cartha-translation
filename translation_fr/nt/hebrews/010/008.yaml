id: HEB.10.8
reference: Hebrews 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: fr
  text: 'Après avoir dit plus haut : « Tu n’as voulu ni sacrifices ni offrandes, ni holocaustes[a] ni sacrifices pour le péché[b], et tu n’y as pas pris plaisir » — lesquels sont offerts conformément à la Loi[c] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire des offrandes entièrement consumées sur l’autel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « offrandes pour le péché ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit ici de la Loi de Moïse.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Après avoir dit plus haut
  rationale: Cette tournure renvoie naturellement à la citation qui précède dans l’argument et rend la construction participiale en français courant.
- source_word: Θυσίας καὶ προσφορὰς
  choice: sacrifices ni offrandes
  rationale: Ces termes usuels conservent le vocabulaire cultuel; la coordination négative française exige ici « ni… ni » après « tu n’as voulu ».
- source_word: ὁλοκαυτώματα
  choice: holocaustes
  rationale: Dans le vocabulaire biblique français, « holocauste » désigne précisément une offrande entièrement consumée sur l’autel.
- source_word: περὶ ἁμαρτίας
  choice: sacrifices pour le péché
  rationale: L’expression grecque désigne ici une catégorie sacrificielle; cette formulation reste explicite sans imposer un terme technique moins transparent.
- source_word: οὐκ ἠθέλησας
  choice: tu n’as voulu
  rationale: « Vouloir » rend directement θέλω et convient au parallélisme de la citation, sans réduire le propos à une simple préférence affective.
- source_word: οὐδὲ εὐδόκησας
  choice: et tu n’y as pas pris plaisir
  rationale: Cette expression distingue εὐδοκέω du verbe précédent et reprend naturellement en français l’ensemble des sacrifices énumérés.
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: bien qu’ils soient offerts conformément à la Loi
  rationale: 'Le relatif a ici une valeur explicative susceptible de souligner la tension: ces sacrifices ne plaisent pas à Dieu bien qu’ils soient prescrits et offerts selon la Loi. « Conformément à » exprime précisément κατά.'
theological_decisions:
- issue: Préserver la tension entre le refus divin exprimé dans la citation et le statut légal des sacrifices
  choice: « bien qu’ils soient offerts conformément à la Loi »
  alternative: « lesquels sont offerts conformément à la Loi »
  rationale: La formulation met en lumière, sans la résoudre doctrinalement, la tension explicite du contexte entre l’absence de plaisir divin et l’offrande légale de ces sacrifices.
- issue: Rendre les catégories sacrificielles sans importer une interprétation doctrinale ultérieure
  choice: « sacrifices », « offrandes », « holocaustes », « sacrifices pour le péché »
  alternative: « sacrifices, dons, offrandes entièrement brûlées et offrandes concernant le péché »
  rationale: Les termes choisis identifient clairement les catégories cultuelles évoquées tout en restant naturels et accessibles au lectorat francophone moderne.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure ouverte par un tiret final, puisque le verset fait partie d’une construction qui se poursuit au verset suivant. La majuscule à « Loi » signale ici la Loi mosaïque, explicitée en note.
