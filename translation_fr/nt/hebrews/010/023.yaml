source:
  edition: SBLGNT
  text: κατέχωμεν τὴν ὁμολογίαν τῆς ἐλπίδος ἀκλινῆ, πιστὸς γὰρ ὁ ἐπαγγειλάμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: fr
  text: Restons fermement attachés à la confession de l’espérance, sans fléchir, car celui qui a promis est fidèle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέχωμεν
  choice: Tenons fermement
  rationale: Le subjonctif présent à valeur exhortative appelle une exhortation communautaire. « Tenons fermement » est naturel en français et exprime la persévérance dans l’attachement.
- source_word: τὴν ὁμολογίαν τῆς ἐλπίδος
  choice: à l’espérance que nous proclamons
  rationale: Cette formulation rend naturellement en français l’idée d’une espérance publiquement professée, sans ajouter de possessif absent du grec. Elle évite aussi le tour moins courant « la confession de l’espérance ».
- source_word: ἀκλινῆ
  choice: sans fléchir
  rationale: L’adjectif signifie littéralement « qui ne penche pas, inébranlable ». Le complément adverbial se rapporte naturellement à l’exhortation et conserve l’image de la fermeté.
- source_word: πιστὸς
  choice: fidèle
  rationale: « Fidèle » exprime à la fois la fiabilité de celui qui promet et la résonance théologique habituelle du terme.
- source_word: ὁ ἐπαγγειλάμενος
  choice: celui qui a fait la promesse
  rationale: Le participe aoriste substantivé désigne celui qui a promis antérieurement. Cette traduction laisse son identité implicite, comme le grec.
theological_decisions:
- issue: Identité de « celui qui a fait la promesse »
  choice: Le référent, Dieu, reste implicite.
  alternative: « Dieu, qui a fait la promesse »
  rationale: Le contexte permet d’identifier Dieu, mais le texte grec ne le nomme pas ici. Le laisser implicite respecte la formulation source.
- issue: Rapport entre la proclamation et l’espérance
  choice: « l’espérance que nous proclamons »
  alternative: « la confession de l’espérance » ou « la confession de notre espérance »
  rationale: Le génitif grec peut être rendu comme désignant le contenu de la confession. La formulation retenue exprime ce rapport sans imposer un possessif absent du texte.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure concise et exhortative. « Proclamons » rend la dimension déclarée ou publique de ὁμολογία, tandis que « sans fléchir » préserve l’appel à une constance inébranlable.
