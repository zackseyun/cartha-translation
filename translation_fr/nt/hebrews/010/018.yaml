id: HEB.10.18
reference: Hebrews 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: fr
  text: Là où il y a pardon de ces choses[a], il n’y a plus d’offrande pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom renvoie aux péchés et aux actes contraires à la loi mentionnés au verset précédent.
    reason: Préciser le référent contextuel du démonstratif grec sans le remplacer dans le texte par une interprétation.
lexical_decisions:
- source_word: ὅπου
  choice: Là où
  rationale: Introduit la situation dans laquelle l’affirmation suivante est vraie; « là où » est naturel en français et conserve la formulation générale du grec.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici une légère transition logique. En français, l’enchaînement avec le contexte suffit, sans ajouter artificiellement « or » ou « mais ».
- source_word: ἄφεσις
  choice: sont pardonnées
  rationale: La tournure verbale française exprime clairement l’idée de pardon ou de remise tout en produisant une phrase naturelle.
- source_word: τούτων
  choice: ces fautes
  rationale: Le démonstratif renvoie aux péchés et aux actes contraires à la loi mentionnés au verset précédent. « Fautes » rend ce référent de manière concise, avec une note signalant la forme plus littérale.
- source_word: οὐκέτι
  choice: il n’y a plus
  rationale: Exprime nettement la cessation indiquée par le grec.
- source_word: προσφορὰ
  choice: offrande
  rationale: Conserve le terme cultuel général sans le restreindre au mot « sacrifice ».
- source_word: περὶ ἁμαρτίας
  choice: pour le péché
  rationale: Rend le sens sacrificiel de la locution sans préciser davantage que le grec s’il s’agit techniquement d’un sacrifice pour le péché.
theological_decisions:
- issue: Portée de la cessation des offrandes
  choice: Le texte affirme qu’une fois ces fautes pardonnées, il n’y a plus d’offrande pour le péché.
  alternative: Comprendre que toute forme d’offrande, quelle qu’elle soit, est abolie, ou limiter l’énoncé aux seuls rites lévitiques sans portée plus large.
  rationale: Le contexte oppose les sacrifices répétés à l’efficacité du sacrifice unique du Christ. La traduction conserve l’affirmation précise concernant l’offrande pour le péché sans étendre ni restreindre explicitement sa portée.
translation_notes:
  register: Français moderne, clair et digne. « Là où » garde la structure de l’original; « ces fautes sont pardonnées » évite la lourdeur de « il y a pardon de celles-ci » tout en explicitant sobrement le référent immédiat.
