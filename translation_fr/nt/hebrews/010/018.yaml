  naturalness: « Là où il y a pardon de ces choses » est une formulation française moderne, sobre et suffisamment naturelle dans ce contexte argumentatif. « Il n’y a plus d’offrande pour le péché » est clair et respecte le registre cultuel de προσφορά περὶ ἁμαρτίας.
  terminology: « Pardon » rend bien ἄφεσις; « offrande » conserve la généralité cultuelle de προσφορά. « Ces choses » préserve le démonstratif sans substituer un terme interprétatif tel que « fautes ».
