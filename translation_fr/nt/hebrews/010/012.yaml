id: HEB.10.12
reference: Hebrews 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: fr
  text: Mais lui, après avoir offert un seul sacrifice pour les péchés, valable pour toujours[a], s’est assis à la droite de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir offert pour toujours un seul sacrifice pour les péchés ». L’expression grecque peut aussi être rattachée à « s’est assis » : « s’est assis pour toujours à la droite de Dieu ».'
    reason: alternative_reading
  - marker: b
    text: L’expression « à la droite de Dieu » fait écho au Psaume 110.1, un texte essentiel dans la lettre aux Hébreux pour présenter l’élévation du Messie.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: lui
  rationale: Le pronom disjoint garde une valeur démonstrative et contrastive naturelle en français, en opposant Jésus aux prêtres du verset précédent, sans la lourdeur de « celui-ci ».
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec les prêtres qui se tiennent chaque jour debout et offrent sans cesse les mêmes sacrifices.
- source_word: μίαν ... θυσίαν
  choice: un seul sacrifice
  rationale: « Un seul » met clairement en relief l’unicité du sacrifice face à la multiplicité des offrandes répétées.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: pour les péchés
  rationale: Formulation française naturelle exprimant la destination sacrificielle; le pluriel du grec est conservé.
- source_word: προσενέγκας
  choice: après avoir offert
  rationale: Rend l’antériorité du participe aoriste par rapport au verbe principal tout en restant fluide en français.
- source_word: εἰς τὸ διηνεκές
  choice: valable pour toujours
  rationale: Exprime naturellement la portée durable du sacrifice dans ce contexte, sans rendre la phrase française ambiguë au point de rattacher spontanément l’expression au seul geste d’offrir; une note conserve les autres rattachements syntaxiques possibles.
- source_word: ἐκάθισεν
  choice: s’est assis
  rationale: Conserve l’action accomplie et le contraste contextuel avec les prêtres qui restent debout.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: à la droite de Dieu
  rationale: Formule française consacrée, claire et proche du grec, qui préserve l’écho du Psaume 110.1.
theological_decisions:
- issue: Rattachement de εἰς τὸ διηνεκές
  choice: 'Rattaché principalement à la validité durable de l’unique sacrifice: « un seul sacrifice… valable pour toujours »'
  alternative: L’expression peut qualifier plus étroitement l’offrande (« ayant offert pour toujours un seul sacrifice ») ou se rattacher à l’action de s’asseoir (« s’est assis pour toujours »).
  rationale: Le contexte oppose l’efficacité permanente du sacrifice unique aux sacrifices répétés. Toutefois, l’ordre et la syntaxe du grec permettent une certaine ambiguïté; la note la signale plutôt que de l’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. « Mais lui » rend le contraste sans archaïsme; « valable pour toujours » explicite sobrement l’efficacité durable du sacrifice, tandis que la note préserve l’ambiguïté syntaxique réelle.
