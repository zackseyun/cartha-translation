  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: fr
  text: 'L’Esprit saint nous en rend aussi témoignage[a] ; car, après avoir dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: "Ou « l’Esprit saint nous atteste aussi cela ».\0"
    reason: Alternative lexicale et syntaxique pour μαρτυρεῖ avec son datif ; « cela » renvoie anaphoriquement au témoignage introduit et développé dans le contexte.
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: rend témoignage
  rationale: Le présent « rend témoignage » conserve l’image du témoin et convient naturellement au registre biblique français.
- source_word: δὲ
  choice: aussi (avec liaison implicite)
  rationale: δέ assure ici une transition légère plutôt qu’une opposition marquée ; le français n’exige pas nécessairement une conjonction initiale.
- source_word: ἡμῖν
  choice: nous
  rationale: Avec « rendre témoignage », le pronom indirect « nous » exprime que le témoignage est adressé à l’auteur et à ses destinataires.
- source_word: καὶ
  choice: aussi
  rationale: '« Aussi » garde la valeur additive de καί : l’Esprit saint vient confirmer le témoignage déjà invoqué.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Forme française actuelle et usuelle du titre, avec une majuscule au nom et une minuscule à l’adjectif.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: car, après avoir dit
  rationale: Cette formulation rend la succession temporelle de l’infinitif articulé sans expliciter son sujet, comme le grec, tout en préparant la citation suivante.
theological_decisions:
- issue: Action personnelle de l’Esprit saint dans le témoignage
  choice: L’Esprit saint aussi nous en rend témoignage
  alternative: L’Esprit saint aussi témoigne pour nous
  rationale: La formulation retenue présente l’Esprit saint comme l’auteur actif du témoignage et évite « pour nous », qui pourrait suggérer qu’il plaide en notre faveur plutôt qu’il ne s’adresse à nous.
- issue: Référent du témoignage exprimé par μαρτυρεῖ
  choice: nous en rend témoignage
  alternative: nous rend témoignage
  rationale: Le pronom « en » relie naturellement le témoignage au contenu exposé dans le contexte, sans préciser davantage que le grec ce dont l’Esprit témoigne.
translation_notes:
  register: Français international moderne, digne et fluide. Le point-virgule et les deux-points maintiennent le verset comme introduction inachevée à la citation qui suit. « Rendre témoignage » préserve la coloration juridique du verbe grec sans archaïsme excessif.
