source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: fr
  text: Quiconque a rejeté la loi de Moïse meurt sans pitié sur la déposition de deux ou trois témoins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est mis à mort ». Le grec dit littéralement « meurt », mais le contexte évoque une exécution judiciaire sous la loi de Moïse.'
    reason: Alternative lexicale précisant la portée judiciaire du verbe.
lexical_decisions:
- source_word: ἀθετήσας
  choice: a rejeté
  rationale: Le participe aoriste de ἀθετέω exprime le rejet ou la mise à l’écart d’une autorité. « A rejeté » est naturel en français et conserve l’idée de répudiation, sans réduire le sens à une simple infraction.
- source_word: τις
  choice: Quiconque
  rationale: Le pronom indéfini a ici une portée générale. « Quiconque » rend cette valeur clairement et convient au registre juridique de la phrase.
- source_word: νόμον Μωϋσέως
  choice: la loi de Moïse
  rationale: Cette formulation française courante suit directement la construction génitive grecque et évite le terme plus technique « loi mosaïque ».
- source_word: χωρὶς οἰκτιρμῶν
  choice: sans pitié
  rationale: Le pluriel grec désigne ici l’absence de toute compassion dans l’application du jugement. « Sans pitié » est idiomatique et ferme dans ce contexte judiciaire.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: sur la déposition de deux ou trois témoins
  rationale: Avec le datif, ἐπί indique le fondement du jugement. « Sur la déposition de » explicite naturellement en français la valeur probatoire des témoins sans ajouter une nouvelle condition.
- source_word: ἀποθνῄσκει
  choice: meurt
  rationale: Le présent de l’indicatif énonce une conséquence légale générale. « Meurt » correspond directement au verbe grec, tandis que le contexte fait comprendre qu’il s’agit d’une exécution judiciaire.
theological_decisions:
- issue: Faut-il expliciter que ἀποθνῄσκει désigne ici une mise à mort judiciaire ?
  choice: Conserver « meurt » dans le texte principal.
  alternative: « est mis à mort »
  rationale: L’arrière-plan de la loi de Moïse et la déposition de témoins impliquent une peine capitale, mais le grec emploie le simple verbe « mourir », non une tournure causative explicite. La traduction garde donc la retenue du texte source, et la note signale l’autre rendu possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la brièveté et la gravité judiciaires du grec. « Quiconque » et « sur la déposition de » donnent une tournure juridique naturelle sans technicité excessive.
