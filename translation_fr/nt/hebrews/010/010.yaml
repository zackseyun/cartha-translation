id: HEB.10.10
reference: Hebrews 10:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: fr
  text: C’est en vertu de cette volonté[a] que nous avons été sanctifiés par l’offrande du corps de Jésus le Messie[b], une fois pour toutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « dans cette volonté ». Il s’agit de la volonté de Dieu mentionnée dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Jésus-Christ ». Le mot grec Χριστός signifie « Messie » et peut fonctionner ici comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: en vertu de cette volonté
  rationale: La locution renvoie à la volonté de Dieu mentionnée dans le contexte. « En vertu de » exprime naturellement en français sa valeur instrumentale, tandis que la note conserve la formulation grecque plus littérale.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: nous avons été sanctifiés
  rationale: Cette construction périphrastique au parfait présente une action accomplie dont le résultat demeure. Le passé composé français en garde mieux la force que le simple présent.
- source_word: διὰ τῆς προσφορᾶς
  choice: par l’offrande
  rationale: Avec le génitif, διά indique ici le moyen. « Par » rend cette relation avec concision, et « offrande » correspond directement à προσφορά sans expliciter davantage que le texte son caractère sacrificiel.
- source_word: τοῦ σώματος
  choice: du corps
  rationale: Cette formulation reproduit le groupe nominal explicite du grec et maintient l’accent sur la réalité corporelle de l’offrande.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici son sens de titre. « Le Messie » le rend de manière transparente et idiomatique en français, tandis que la note signale la forme traditionnelle.
- source_word: ἐφάπαξ
  choice: une fois pour toutes
  rationale: Cette expression française rend le caractère unique, définitif et non répétable de l’offrande.
theological_decisions:
- issue: Aspect et portée de la sanctification
  choice: « nous avons été sanctifiés », pour exprimer une action accomplie dont l’effet demeure
  alternative: « nous sommes sanctifiés » ou « nous sommes en train d’être sanctifiés »
  rationale: Le grec emploie un parfait périphrastique, non un présent progressif. La traduction conserve cette valeur grammaticale sans imposer une conception doctrinale particulière de la sanctification.
- issue: Valeur de ἐν ᾧ θελήματι
  choice: 'Comprendre la volonté comme fondement ou moyen : « en vertu de cette volonté »'
  alternative: « dans cette volonté »
  rationale: Le contexte favorise une valeur instrumentale, mais la note conserve la forme plus littérale afin de ne pas masquer l’éventuelle nuance de sphère.
- issue: Titre christologique Χριστός
  choice: « le Messie »
  alternative: « Christ »
  rationale: Le terme grec peut être entendu comme un titre. Le traduire en préserve le sens, tout en signalant en note la forme traditionnelle française.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure emphatique « C’est en vertu de… que » clarifie le lien logique sans effacer l’ambiguïté du grec, conservée en note. Le vocabulaire « sanctifiés » et « offrande » maintient le registre théologique et cultuel du passage.
