  text: ἔτι γὰρ μικρὸν ὅσον ὅσον, ὁ ἐρχόμενος ἥξει καὶ οὐ χρονίσει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/037.yaml
  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: fr
  text: Car, encore très peu de temps[a], celui qui vient[b] viendra et ne tardera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « encore un peu, autant qu’autant » ; cette tournure insistante signifie qu’il reste très peu de temps.'
    reason: lexical_alternative
  - marker: b
    text: Cette phrase reprend Habacuc 2.3-4 selon sa forme grecque, avec une adaptation. « Celui qui vient » peut, dans ce contexte, être compris comme une désignation du Messie attendu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Car encore
  rationale: « Car » conserve le lien explicatif de γάρ avec l’exhortation précédente, tandis que « encore » rend la nuance temporelle de ἔτι.
- source_word: μικρὸν ὅσον ὅσον
  choice: un tout petit peu de temps
  rationale: Cette formulation française naturelle rend l’insistance de l’expression idiomatique répétée, qui souligne l’extrême brièveté du délai.
- source_word: ὁ ἐρχόμενος
  choice: celui qui vient
  rationale: L’expression conserve directement le participe substantivé grec et laisse au contexte sa possible portée messianique, sans l’imposer par une majuscule ou un titre ajouté.
- source_word: ἥξει
  choice: viendra
  rationale: Le futur exprime une venue à venir; « viendra » préserve aussi l’écho verbal avec « celui qui vient ».
- source_word: οὐ χρονίσει
  choice: il ne tardera pas
  rationale: Rend clairement en français moderne l’idée de ne pas différer ou prendre du retard.
theological_decisions:
- issue: Faut-il rendre ὁ ἐρχόμενος comme un titre messianique explicite ou comme une proposition participiale?
  choice: celui qui vient
  alternative: Celui qui vient / celui qui doit venir
  rationale: Le contexte permet vraisemblablement une référence messianique, mais le grec reste formellement un participe substantivé. La traduction directe préserve à la fois cette forme et la portée christologique que le contexte peut lui donner, sans la rendre typographiquement obligatoire.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « un tout petit peu de temps » restitue l’insistance de l’idiome sans reproduire lourdement sa répétition. La ponctuation met en relief la citation et maintient le parallélisme verbal entre « vient » et « viendra ».
