source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: fr
  text: ne délaissons pas notre rassemblement[a], comme certains en ont l’habitude, mais encourageons-nous les uns les autres, et cela d’autant plus que vous voyez le Jour[b] approcher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’abandonnons pas notre rassemblement » ou « ne négligeons pas de nous rassembler ».
    reason: lexical_alternative
  - marker: b
    text: « Le Jour » désigne probablement le jour à venir du Seigneur ou le jour du jugement final.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: ne délaissons pas
  rationale: Le participe négatif poursuit l’exhortation du verset précédent. « Délaisser » peut exprimer aussi bien la négligence persistante que l’abandon, sans imposer l’idée d’une apostasie totale.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: nos rassemblements
  rationale: Le nom désigne l’action de se réunir, et le réfléchi en marque la dimension communautaire. Le pluriel est naturel en français pour parler des réunions régulières, sans introduire la notion institutionnelle de « culte ».
- source_word: καθὼς ἔθος τισίν
  choice: comme certains en ont l’habitude
  rationale: Cette formulation actuelle conserve la notion d’habitude et la réprimande mesurée du grec.
- source_word: παρακαλοῦντες
  choice: encourageons-nous les uns les autres
  rationale: Dans ce contexte de persévérance communautaire, le verbe évoque l’encouragement et l’exhortation. La réciprocité, implicite en grec, doit être exprimée pour obtenir un français naturel.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: et cela d’autant plus que
  rationale: Cette tournure rend naturellement la progression proportionnelle exprimée par la construction corrélative grecque.
- source_word: βλέπετε
  choice: vous voyez
  rationale: Le verbe est rendu directement, sans préciser ce qui permet aux destinataires de percevoir l’approche du Jour.
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: le Jour approcher
  rationale: La formulation conserve l’image temporelle de l’approche. La majuscule signale le sens eschatologique probable sans développer le texte en « Jour du Seigneur » ou « jour du jugement ».
theological_decisions:
- issue: Référence eschatologique de « τὴν ἡμέραν »
  choice: « le Jour », avec une majuscule
  alternative: « le jour », « le Jour du Seigneur » ou « le jour du jugement »
  rationale: Le contexte indique vraisemblablement le jour eschatologique reconnu par les lecteurs. La majuscule en signale la portée tout en préservant l’absence de précision dans le grec.
- issue: Objet réciproque de παρακαλοῦντες
  choice: expliciter « les uns les autres »
  alternative: 'laisser l’objet implicite : « mais encourageons »'
  rationale: La communauté qui se rassemble constitue naturellement l’objet réciproque de l’action. L’explicitation est nécessaire à la clarté du français et n’ajoute aucune orientation doctrinale.
- issue: Rapport syntaxique avec le verset précédent
  choice: rendre les participes grecs par des impératifs inclusifs poursuivant l’exhortation
  alternative: 'traduire littéralement par des participes : « ne délaissant pas… mais nous encourageant… »'
  rationale: Les participes dépendent de l’exhortation de Hébreux 10.24. Des impératifs inclusifs restituent en français moderne cette force exhortative et produisent une phrase autonome intelligible.
translation_notes:
  register: Français international moderne, digne et directement accessible. Le verset reste une exhortation communautaire sans employer des termes institutionnels comme « office » ou « culte ». « Délaisser » maintient ouverte la nuance entre négligence et abandon. La minuscule initiale reflète la continuité syntaxique avec le verset précédent.
