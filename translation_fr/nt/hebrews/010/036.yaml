id: HEB.10.36
reference: Hebrews 10:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: fr
  text: Car vous avez besoin de persévérance pour qu’après avoir fait la volonté de Dieu, vous receviez la promesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui a été promis ».'
    reason: La construction grecque peut désigner soit la promesse, soit la réalité promise et reçue.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: persévérance
  rationale: ὑπομονή désigne la constance qui tient bon sous l’épreuve. « Persévérance » est naturel en français moderne et exprime une endurance active sans ajouter d’interprétation.
- source_word: χρείαν ἔχετε
  choice: vous avez besoin de
  rationale: L’expression signifie « avoir besoin de ». Cette formulation française est directe, naturelle et conserve l’accent porté sur la nécessité.
- source_word: ἵνα
  choice: pour que
  rationale: ἵνα introduit ici le but ou le résultat visé. « Pour que » rend clairement ce lien en français courant.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: la volonté de Dieu
  rationale: Cette traduction directe du groupe génitif conserve la formulation biblique usuelle et sa dignité.
- source_word: ποιήσαντες
  choice: après avoir fait
  rationale: Le participe aoriste présente normalement l’action comme antérieure à celle du verbe principal. « Après avoir fait » explicite naturellement cette relation temporelle.
- source_word: κομίσησθε
  choice: vous receviez
  rationale: Dans ce contexte, κομίζω signifie recevoir ou obtenir ce qui est accordé. « Recevoir » est clair et idiomatique.
- source_word: τὴν ἐπαγγελίαν
  choice: la promesse
  rationale: ἐπαγγελία désigne littéralement « la promesse », tout en pouvant, avec κομίζω, évoquer ce qui a été promis. Le texte principal préserve la formulation et l’ambiguïté grecques.
theological_decisions:
- issue: ἐπαγγελίαν désigne-t-il la promesse elle-même ou l’accomplissement promis ?
  choice: la promesse
  alternative: ce qui a été promis
  rationale: Le grec dit littéralement « la promesse », mais l’association avec « recevoir » peut désigner par métonymie la réalité promise. Garder « la promesse » dans le texte évite de résoudre silencieusement cette tension ; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien logique introduit par γάρ (« Car ») ainsi que l’antériorité du participe ποιήσαντες.
