  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: fr
  text: Et je ne me souviendrai plus de leurs péchés ni de leurs actes contraires à la loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, traditionnellement : « de leurs iniquités ». Le terme grec désigne des actes qui enfreignent la loi ou la volonté de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction initiale est conservée, car la phrase poursuit la citation commencée dans le contexte précédent.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: de leurs péchés
  rationale: « Péchés » rend directement le pluriel de ἁμαρτία dans un français courant et bibliquement transparent.
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: ni de leurs actes contraires à la loi
  rationale: Après une proposition négative, « ni » coordonne naturellement les deux compléments en français. « Actes contraires à la loi » exprime le sens concret du pluriel ἀνομίαι sans recourir au terme moins transparent « iniquités ».
- source_word: οὐ μὴ μνησθήσομαι ἔτι
  choice: je ne me souviendrai plus
  rationale: La tournure française rend ensemble la négation grecque fortement appuyée οὐ μή et ἔτι. Elle conserve l'image biblique du souvenir sans l'expliquer comme un oubli cognitif.
theological_decisions:
- issue: Le non-souvenir divin des péchés
  choice: Conserver littéralement l'expression « je ne me souviendrai plus »
  alternative: Paraphraser par « je ne leur tiendrai plus compte »
  rationale: Le texte parle du souvenir divin dans le cadre de la promesse d'alliance. La formulation retenue préserve cette image et sa tension théologique, sans prétendre que Dieu perd la connaissance des faits ni réduire explicitement l'expression à une seule interprétation.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du grec tout en employant la coordination négative idiomatique « ni ». Le vocabulaire évite à la fois l'archaïsme non expliqué et la paraphrase théologique.
