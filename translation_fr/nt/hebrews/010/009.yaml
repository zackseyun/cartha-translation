source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: fr
  text: 'Alors il a dit : « Voici, je suis venu pour faire ta volonté. » Il supprime le premier afin d’établir le second[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le premier » et « le second » peuvent désigner le premier ordre sacrificiel et la réalité nouvelle dans laquelle la volonté de Dieu s’accomplit par l’offrande du Messie. Ils peuvent aussi renvoyer plus étroitement aux deux déclarations de la citation précédente.
    reason: ambiguïté du référent
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle et argumentative par rapport à la citation précédente.
- source_word: εἴρηκεν
  choice: il a dit
  rationale: Le passé composé rend naturellement le parfait grec dans ce contexte tout en gardant la pertinence présente de la parole citée.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Interjection française courante, digne et adaptée au registre scripturaire, qui attire l’attention sur la déclaration.
- source_word: ἥκω
  choice: je suis venu
  rationale: Exprime l’arrivée accomplie et la présence qui en résulte, sens idiomatique du présent grec ἥκω.
- source_word: τοῦ ποιῆσαι
  choice: pour faire
  rationale: Rend explicitement et naturellement la valeur de but de l’infinitif grec articulé.
- source_word: τὸ θέλημά σου
  choice: ta volonté
  rationale: Équivalent précis et traditionnel qui conserve la portée théologique de θέλημα sans paraphrase.
- source_word: ἀναιρεῖ
  choice: Il supprime
  rationale: Rend le présent grec et l’idée de faire disparaître ou d’écarter, sans préciser davantage que le texte la nature de ce qui est supprimé.
- source_word: τὸ πρῶτον
  choice: le premier
  rationale: Conserve l’adjectif substantivé et la concision ambiguë du grec, sans introduire dans le texte principal un référent interprétatif.
- source_word: ἵνα
  choice: afin de
  rationale: Exprime clairement le rapport de but introduit par ἵνα.
- source_word: τὸ δεύτερον
  choice: le second
  rationale: Préserve le parallélisme avec « le premier » et l’absence de substantif explicite dans le grec.
- source_word: στήσῃ
  choice: établir
  rationale: Rend le sens contextuel de mettre en place ou rendre effectif, en contraste avec « supprimer ».
theological_decisions:
- issue: Référent du « premier » et du « second »
  choice: Maintenir dans le texte la formulation concise « le premier » et « le second ».
  alternative: Expliciter soit le premier système sacrificiel et l’accomplissement de la volonté de Dieu, soit les deux déclarations du psaume, soit l’ancienne et la nouvelle alliance.
  rationale: Hébreux 10.8-10 favorise un contraste entre les sacrifices antérieurs et l’accomplissement de la volonté de Dieu dans l’offrande du Messie, mais le grec ne nomme pas directement les deux éléments. La formulation retenue préserve cette tension et laisse le contexte guider l’interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. « Voici » maintient le relief de la citation biblique; « il a dit » reste naturel, tandis que « le premier » et « le second » conservent volontairement la concision du grec.
