id: HEB.10.35
reference: Hebrews 10:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ἀποβάλητε οὖν τὴν παρρησίαν ὑμῶν, ἥτις ἔχει ⸂μεγάλην μισθαποδοσίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/035.yaml
  text: Therefore[a], do not throw away your boldness, which has a great reward,
translation:
  language: fr
  text: Ne rejetez donc pas votre assurance[a], qui comporte une grande récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hardiesse » ou « confiance ». Le terme grec peut désigner une liberté confiante et ouverte, notamment lorsqu’on s’approche de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: Ne rejetez pas
  rationale: L’aoriste subjonctif avec μή exprime une interdiction. « Rejeter » conserve l’idée d’un abandon volontaire et énergique, plutôt que celle d’une simple perte involontaire.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence de ce qui précède; « donc » exprime naturellement ce lien logique en français moderne.
- source_word: τὴν παρρησίαν ὑμῶν
  choice: votre assurance
  rationale: Dans l’épître aux Hébreux, παρρησία évoque une liberté confiante et ouverte, notamment devant Dieu. « Assurance » est naturel en français et peut désigner à la fois la confiance intérieure et la liberté d’agir ou de parler.
- source_word: ἥτις ἔχει
  choice: qui porte en elle
  rationale: Le grec dit littéralement « qui a ». « Qui porte en elle » rend clairement et naturellement la relation entre cette assurance persévérante et la récompense, sans affirmer qu’elle la produit par elle-même.
- source_word: μεγάλην μισθαποδοσίαν
  choice: une grande récompense
  rationale: μισθαποδοσία désigne une rétribution ou une récompense. « Grande récompense » est clair, digne et adapté au sens positif du contexte.
theological_decisions:
- issue: Sens de παρρησία en Hébreux 10.35
  choice: assurance
  alternative: hardiesse; pleine confiance
  rationale: Le mot peut désigner la liberté confiante devant Dieu aussi bien que le courage de persévérer ouvertement dans la foi. « Assurance » préserve cette amplitude; la note signale les nuances possibles sans réduire le terme à un simple sentiment intérieur.
- issue: Rapport entre l’assurance et la récompense
  choice: qui porte en elle une grande récompense
  alternative: qui a une grande récompense; qui sera largement récompensée
  rationale: Cette formulation conserve l’énoncé présent du grec et son lien étroit entre l’assurance et la récompense, sans préciser indûment le mécanisme ni le moment de la rétribution.
translation_notes:
  register: Français international moderne, exhortatif et digne. La phrase conserve la force volontaire de l’interdiction et place « donc » naturellement après le verbe, conformément à l’usage français.
