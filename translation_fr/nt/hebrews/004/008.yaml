id: HEB.4.8
reference: Hebrews 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: fr
  text: En effet, si Josué leur avait donné le repos[a], il n’aurait pas parlé, par la suite, d’un autre jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En grec, le nom est Ἰησοῦς, une forme qui peut désigner Jésus ou Josué ; ici, le contexte renvoie à Josué, fils de Noun.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Josué
  rationale: La forme grecque peut désigner Jésus ou Josué. Ici, l’argument porte sur l’entrée d’Israël dans le pays sous la conduite de Josué; « Josué » rend donc clairement le référent contextuel.
- source_word: κατέπαυσεν
  choice: avait donné le repos
  rationale: 'Le verbe a ici un sens causatif: faire cesser, mettre au repos ou donner le repos. Cette formulation française est naturelle et maintient le lien lexical avec le thème du repos dans le passage.'
- source_word: οὐκ ἂν ... ἐλάλει
  choice: il ne parlerait pas
  rationale: La construction exprime la conséquence irréelle de la condition passée. Le conditionnel présent avec « parler » rend naturellement en français le fait que le discours ultérieur n’aurait pas lieu si la condition avait été réalisée.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: d’un autre jour
  rationale: La formulation conserve l’indétermination du grec et le raisonnement selon lequel la promesse vise encore un jour ultérieur.
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: Cette traduction garde explicitement la succession temporelle marquée par le grec, sans préciser davantage ce que le texte laisse général.
- source_word: γὰρ
  choice: En effet
  rationale: « En effet » introduit naturellement en français l’explication qui appuie l’affirmation précédente.
theological_decisions:
- issue: Référent de Ἰησοῦς en Hébreux 4.8
  choice: Josué, fils de Noun
  alternative: Jésus
  rationale: Le contexte concerne l’installation d’Israël dans le pays et montre que Josué n’a pas épuisé la promesse du repos. Toutefois, puisque le grec emploie la même forme de nom pour Jésus et Josué, cette donnée est signalée en note.
- issue: Sujet implicite de ἐλάλει
  choice: Conserver le pronom « il » sans identifier explicitement le sujet
  alternative: Expliciter « Dieu » ou « David »
  rationale: Le grec ne nomme pas ici le sujet. Le pronom préserve cette continuité et évite d’introduire dans le texte une identification interprétative supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Donner le repos » est conservé afin de maintenir le motif théologique et lexical du repos. La syntaxe conditionnelle reste naturelle sans ajouter un sujet explicite absent du grec.
