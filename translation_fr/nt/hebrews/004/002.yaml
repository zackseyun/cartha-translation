source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: fr
  text: Car nous aussi, la bonne nouvelle nous a été annoncée, tout comme à eux. Mais le message qu’ils ont entendu ne leur a servi à rien, parce qu’ils n’ont pas été unis par la foi à ceux qui ont entendu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Variante textuelle et traduction traditionnelle possible : « parce que le message n’était pas mêlé à la foi chez ceux qui l’avaient entendu ».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: nous avons reçu l’annonce d’une bonne nouvelle
  rationale: La périphrase parfaite passive exprime une annonce reçue dans le passé dont la portée demeure. Cette formulation conserve l’idée verbale sans imposer ici le sens technique ultérieur d’« Évangile ».
- source_word: καθάπερ κἀκεῖνοι
  choice: tout comme eux
  rationale: Comparaison française naturelle qui établit le parallèle avec la génération du désert.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: le message qu’ils ont entendu
  rationale: Rend naturellement le génitif grec en présentant λόγος comme le contenu proclamé et ἀκοή comme l’audition de ce message.
- source_word: ὠφέλησεν
  choice: ne leur a servi à rien
  rationale: Expression française courante indiquant que le message ne leur a procuré aucun avantage réel, tout en évitant d’expliciter davantage la nature de cet avantage.
- source_word: συγκεκερασμένους
  choice: unis
  rationale: Le participe évoque littéralement le mélange ou l’association. « Unis » rend ici son emploi métaphorique et s’accorde, dans le texte retenu, avec le pronom désignant les personnes.
- source_word: πίστει
  choice: par la foi
  rationale: Le datif indique vraisemblablement le moyen ou le domaine de l’union. « Foi » reste le terme français théologique usuel tout en laissant ouverte la nuance de confiance.
- source_word: τοῖς ἀκούσασιν
  choice: à ceux qui ont écouté
  rationale: « Écouté » peut suggérer une audition attentive et réceptive, contraste pertinent dans le contexte, sans s’éloigner du verbe ἀκούω.
theological_decisions:
- issue: Sens de πίστις
  choice: la foi
  alternative: la confiance
  rationale: Le contexte oppose la simple réception auditive du message à une réponse croyante. « Foi » convient sans définir de manière confessionnelle la nature précise de cette réponse.
- issue: Interprétation de la proposition finale
  choice: les destinataires du message n’ont pas été unis par la foi à ceux qui ont écouté
  alternative: le message n’a pas été mêlé à la foi chez ceux qui l’ont entendu
  rationale: 'L’accusatif masculin pluriel συγκεκερασμένους du SBLGNT s’accorde le plus naturellement avec ἐκείνους : ce sont donc les personnes qui n’ont pas été unies. La variante textuelle soutenant la formulation traditionnelle est signalée en note afin de préserver l’ambiguïté textuelle et théologique.'
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue période grecque. Le texte principal suit strictement l’accord grammatical de la leçon du SBLGNT fournie, tandis que la note conserve la variante traditionnelle.
