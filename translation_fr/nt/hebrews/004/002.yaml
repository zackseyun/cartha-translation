  - severity: low
    issue: « Nous avons reçu l’annonce d’une bonne nouvelle » est plus indirect que nécessaire.
    rationale: Le grec exprime directement que la bonne nouvelle a été proclamée aux destinataires. La voix passive française conserve mieux cette orientation.
