  source_fidelity: 'Le texte principal suit correctement la leçon du SBLGNT : συγκεκερασμένους, accusatif masculin pluriel, se rapporte naturellement à ἐκείνους (« eux »). La comparaison avec la génération du désert, l’inefficacité du message entendu et le rôle de la foi sont préservés. « La bonne nouvelle nous a été annoncée » rend plus directement la périphrase parfaite passive εὐηγγελισμένοι que « nous avons reçu l’annonce d’une bonne nouvelle ».'
  naturalness: 'La formulation révisée est plus idiomatique et directe en français international moderne. La note actuelle contient toutefois une tournure peu naturelle et sémantiquement imprécise (« le message ... ne s’est pas mêlé à la foi ») : dans la lecture variante, le message est dit « mêlé à la foi », non qu’il se mêle lui-même.'
  terminology: « Bonne nouvelle », « message », « foi » et « unis » sont appropriés, accessibles et non confessionnellement surinterprétatifs. « Ont entendu » conserve l’ambiguïté de ἀκούω sans attribuer explicitement une réception croyante aux personnes désignées.
