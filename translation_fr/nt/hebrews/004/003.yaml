source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: fr
  text: 'En effet, nous qui avons cru entrons dans le repos, comme il l’a dit : « Comme j’ai juré dans ma colère : “Ils n’entreront certainement pas dans mon repos”[a] », bien que ses œuvres aient été achevées dès la fondation du monde.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « S’ils entreront dans mon repos ». Il s’agit d’une formule de serment signifiant : « Ils n’entreront certainement pas dans mon repos » ou « Ils n’y entreront jamais ».'
    reason: La note préserve la forme conditionnelle inhabituelle du grec tout en expliquant sa valeur idiomatique négative.
  - marker: b
    text: 'Ou : « bien que ses œuvres eussent été achevées dès la fondation du monde ».'
    reason: Cette variante fait ressortir l’antériorité que le contexte associe au participe grec dans le cadre de la création.
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: nous entrons
  rationale: Le présent de l’indicatif garde la portée actuelle ou générale du grec et préserve la tension entre l’entrée présente dans le repos et son accomplissement futur.
- source_word: οἱ πιστεύσαντες
  choice: nous qui avons cru
  rationale: Le participe aoriste désigne ceux qui ont placé leur foi, tandis que la première personne du verbe inclut l’auteur parmi eux.
- source_word: κατάπαυσιν
  choice: le repos
  rationale: Dans le contexte, il s’agit du repos précis de Dieu déjà au centre de l’argument; « le repos » est naturel et suffisamment ouvert pour conserver ses dimensions présentes et eschatologiques.
- source_word: καθὼς εἴρηκεν
  choice: comme il l’a dit
  rationale: Le passé composé français rend naturellement le parfait grec et la validité durable de la parole citée.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Ainsi, j’ai juré dans ma colère
  rationale: ὡς introduit ici le contenu ou la manière solennelle du serment; « Ainsi » convient à la citation psalmique. « Colère » est le terme français courant et digne pour ὀργή, sans atténuer sa portée judiciaire.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Ils n’entreront certainement pas dans mon repos
  rationale: La construction εἰ suivie du futur reproduit une formule sémitique de serment qui exprime une négation catégorique. La traduction en donne le sens tout en signalant la forme littérale en note.
- source_word: καίτοι τῶν ἔργων ... γενηθέντων
  choice: bien que ses œuvres aient été achevées
  rationale: καίτοι marque une concession et le génitif absolu présente les œuvres comme déjà accomplies. Le possessif explicite leur appartenance à Dieu, indiquée par le contexte.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: depuis la fondation du monde
  rationale: Cette formulation française traditionnelle et intelligible rend l’idée de l’établissement ou de la création du monde ainsi que le point de départ temporel.
theological_decisions:
- issue: Force de la formule de serment du Psaume 95
  choice: 'Traduire son sens comme une négation catégorique : « Ils n’entreront certainement pas dans mon repos »'
  alternative: 'Conserver la forme littérale elliptique : « S’ils entrent dans mon repos »'
  rationale: Dans cette formule de serment héritée de l’hébreu, la proposition conditionnelle sous-entend une imprécation et signifie une exclusion certaine. La note conserve toutefois la forme grecque et son ambiguïté de surface.
- issue: Temporalité de l’entrée des croyants dans le repos
  choice: 'Employer le présent : « nous entrons »'
  alternative: « nous entrerons » ou « nous sommes en train d’entrer »
  rationale: Le présent grec affirme l’entrée des croyants sans la réduire à un événement exclusivement futur ni imposer une valeur progressive. Il préserve ainsi la tension présente et future du passage.
- issue: Rapport entre le repos divin et les œuvres de la création
  choice: 'Maintenir la concession : « bien que ses œuvres aient été achevées »'
  alternative: « et pourtant ses œuvres avaient été achevées »
  rationale: La formulation ne tranche pas au-delà du texte la manière exacte dont le repos offert se rapporte au repos de Dieu après la création; elle conserve le lien argumentatif établi par καίτοι.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « nous qui avons cru, nous entrons » est conservée pour rendre clairement l’apposition grecque et l’inclusion de l’auteur. Le vocabulaire reste accessible, tandis que la citation garde sa solennité.
