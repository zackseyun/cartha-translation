id: HEB.4.11
reference: Hebrews 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: fr
  text: Faisons donc tous nos efforts pour entrer dans ce repos, afin que personne ne tombe en suivant le même exemple de désobéissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le même exemple d’incrédulité ». Le mot grec désigne plus directement la désobéissance, mais il peut être compris ici à la lumière du refus de la génération du désert de faire confiance à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: Faisons tous nos efforts
  rationale: Le subjonctif aoriste à valeur exhortative appelle à une action résolue. Cette tournure française actuelle exprime le zèle et l’application portés par σπουδάζω.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conclusion pratique tirée du développement précédent sur le repos de Dieu et l’échec de la génération du désert.
- source_word: εἰσελθεῖν
  choice: pour entrer
  rationale: L’infinitif complète l’exhortation et en indique naturellement le but.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: ce repos
  rationale: Le démonstratif renvoie au repos précis développé dans le contexte. « Ce repos » est plus idiomatique en français que « ce repos-là » tout en gardant le lien anaphorique.
- source_word: ἵνα μὴ
  choice: afin que personne ne
  rationale: Cette formulation rend la finalité négative et conserve la force solennelle de l’avertissement.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: en suivant le même exemple
  rationale: ὑπόδειγμα désigne ici l’exemple ou le précédent fourni par la génération du désert. La tournure « en suivant » rend idiomatiquement la relation exprimée par ἐν sans transformer l’exemple en simple ressemblance abstraite.
- source_word: πέσῃ
  choice: ne tombe
  rationale: Le subjonctif dans la proposition introduite par ἵνα μή exprime l’issue que l’exhortation cherche à éviter.
- source_word: τῆς ἀπειθείας
  choice: de désobéissance
  rationale: ἀπείθεια désigne directement la désobéissance, même si, dans Hébreux, celle-ci est étroitement liée au manque de foi. Le génitif est conservé comme complément d’« exemple ».
theological_decisions:
- issue: Rapport entre ἀπείθεια et le refus de croire de la génération du désert
  choice: Traduire ἀπείθεια par « désobéissance » dans le texte principal.
  alternative: « incrédulité » ou « refus de croire »
  rationale: Dans l’argument d’Hébreux, incrédulité et désobéissance sont intimement liées, mais le sens lexical le plus direct de ἀπείθεια est « désobéissance ». La note signale l’autre compréhension sans effacer cette tension.
translation_notes:
  register: Français international moderne, clair et digne. L’exhortation collective reste énergique, et le vocabulaire du « repos » conserve le terme clé du contexte sans en préciser excessivement la nature.
