id: HEB.4.1
reference: Hebrews 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: fr
  text: Craignons donc que, tandis que la promesse d’entrer dans son repos demeure encore[a], l’un de vous ne paraisse avoir manqué le but[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors qu’une promesse d’entrer dans son repos subsiste ». La construction grecque est concise et peut être comprise comme décrivant la circonstance présente.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ne paraisse pas être parvenu jusqu’à lui ». Le verbe grec exprime ici le fait de ne pas atteindre le but visé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: Craignons
  rationale: Le subjonctif d’exhortation appelle directement la communauté à la crainte. « Craignons » conserve la force de l’avertissement, sans l’atténuer en simple prudence.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée de l’échec d’Israël évoqué précédemment et assure une articulation logique naturelle en français.
- source_word: μήποτε
  choice: que… ne
  rationale: Après un verbe de crainte, cette construction française exprime naturellement le risque redouté et maintient la portée d’avertissement.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: tandis que la promesse… demeure encore
  rationale: Rend la circonstance exprimée par le génitif absolu et la persistance actuelle de la promesse, sans en faire explicitement la cause de l’exhortation.
- source_word: ἐπαγγελίας
  choice: la promesse
  rationale: Terme courant et central dans le raisonnement de l’auteur; l’article français est requis dans cette formulation naturelle.
- source_word: εἰσελθεῖν
  choice: d’entrer
  rationale: L’infinitif dépend naturellement de « promesse » en français et conserve l’idée d’accès au repos.
- source_word: κατάπαυσιν
  choice: repos
  rationale: « Repos » est le terme contextuellement approprié en Hébreux 3–4 et préserve le développement théologique sans le réduire à un simple arrêt d’activité.
- source_word: αὐτοῦ
  choice: son
  rationale: Conserve le pronom grec plutôt que d’expliciter « Dieu », dont le contexte fournit l’antécédent.
- source_word: δοκῇ
  choice: ne paraisse
  rationale: Préserve la nuance d’apparence ou d’évaluation portée par δοκέω, sans trancher entre apparence seulement et constat réel.
- source_word: τις ἐξ ὑμῶν
  choice: l’un de vous
  rationale: Restitue de façon idiomatique le singulier indéfini et la construction partitive, en gardant la portée individuelle de l’avertissement.
- source_word: ὑστερηκέναι
  choice: être resté en arrière
  rationale: Rend l’idée de ne pas avoir atteint le but. Cette formulation conserve aussi l’ambiguïté syntaxique du grec quant au complément implicite, sans ajouter explicitement « ce repos ».
theological_decisions:
- issue: Faut-il atténuer la crainte en simple prudence?
  choice: Conserver l’exhortation forte « Craignons »
  alternative: « Veillons » ou « Prenons garde »
  rationale: Le grec emploie directement φοβηθῶμεν. La traduction garde donc le sérieux de l’avertissement sans résoudre par avance les questions doctrinales relatives à la persévérance ou à l’apostasie.
- issue: Faut-il expliciter le repos comme le repos eschatologique de Dieu?
  choice: Traduire simplement « son repos »
  alternative: « le repos de Dieu » ou « son repos sabbatique »
  rationale: Le pronom est explicite en grec et son référent ressort du contexte. Ne pas développer davantage respecte la progression et la tension théologiques du chapitre.
- issue: Faut-il présenter l’échec redouté comme certain ou comme une apparence?
  choice: Maintenir « ne paraisse être resté en arrière »
  alternative: « n’ait pas réussi à l’atteindre »
  rationale: δοκῇ introduit une nuance réelle de sembler ou de paraître. La conserver évite de trancher une ambiguïté interprétative du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Craignons » assume le registre solennel imposé par l’avertissement, tandis que la syntaxe reste courante. Les notes signalent les ambiguïtés lexicales et syntaxiques sans surcharger le texte principal.
