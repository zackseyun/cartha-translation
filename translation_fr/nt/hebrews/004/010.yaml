source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: fr
  text: En effet, celui qui est entré dans son repos[a] s’est lui aussi reposé[b] de ses œuvres, comme Dieu s’est reposé des siennes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant le référent probable : « dans le repos de Dieu ». Le possessif grec peut être compris autrement, mais le contexte d’Hébreux 3–4 renvoie très probablement au repos de Dieu.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « a cessé de faire ses œuvres ». Le verbe grec est de la même famille que le mot traduit par « repos » ; la traduction principale conserve donc le vocabulaire répété du repos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: celui qui est entré
  rationale: L’article suivi du participe aoriste désigne une personne de manière substantivée. Cette formulation conserve la valeur générique au singulier et présente l’entrée comme accomplie.
- source_word: γὰρ
  choice: En effet
  rationale: La particule introduit l’explication qui fonde l’exhortation précédente. « En effet » exprime naturellement ce lien argumentatif en français.
- source_word: κατάπαυσιν
  choice: repos
  rationale: Dans Hébreux 3–4, ce terme majeur renvoie au repos de Dieu et fait écho à son repos après la création. « Repos » maintient ce fil thématique.
- source_word: αὐτοῦ (après κατάπαυσιν)
  choice: son
  rationale: Le pronom grec peut grammaticalement renvoyer à la personne ou à Dieu. Le possessif français « son » préserve cette ambiguïté formelle, tandis que le contexte favorise le repos de Dieu.
- source_word: καὶ αὐτὸς
  choice: lui aussi
  rationale: Cette expression rend à la fois la valeur additive de καί et l’emphase portée par αὐτός, dans un français naturel.
- source_word: κατέπαυσεν
  choice: s’est reposé
  rationale: Le verbe est apparenté à κατάπαυσις. Employer « reposé » après « repos » conserve cette répétition lexicale importante, tout en laissant « a cessé » comme autre possibilité.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: de ses œuvres
  rationale: « Œuvres » rend directement ἔργα sans limiter le sens à des actes méritoires ou à des travaux physiques. La préposition « de » convient avec « se reposer ».
- source_word: ὥσπερ
  choice: comme
  rationale: Le terme établit une comparaison nette entre le repos de la personne et celui de Dieu. « Comme » l’exprime sobrement et naturellement.
- source_word: ἀπὸ τῶν ἰδίων
  choice: des siennes
  rationale: L’adjectif grec substantivé reprend elliptiquement les œuvres de Dieu. « Des siennes » reproduit cette reprise sans répétition lourde.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction française standard de θεός. La répétition de « s’est reposé » explicite en français le verbe sous-entendu dans la comparaison grecque.
theological_decisions:
- issue: Référent de « son repos » (αὐτοῦ)
  choice: Dans le contexte, « son repos » désigne très probablement le repos de Dieu dans lequel entre la personne.
  alternative: Le possessif pourrait désigner le propre repos de la personne qui entre.
  rationale: Hébreux 3–4 parle à plusieurs reprises du repos de Dieu, enraciné dans son repos après la création, et la fin du verset compare explicitement ce repos à celui de Dieu. Le texte principal conserve néanmoins le possessif « son » afin de ne pas éliminer l’ambiguïté grammaticale du grec.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le singulier générique, la répétition thématique de « repos » et l’ambiguïté du possessif, sans introduire d’interprétation confessionnelle.
