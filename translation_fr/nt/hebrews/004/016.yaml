id: HEB.4.16
reference: Hebrews 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: fr
  text: Approchons-nous donc avec assurance[a] du trône de la grâce, afin de recevoir miséricorde et de trouver grâce pour être secourus au moment opportun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec hardiesse ». Le terme grec peut exprimer à la fois la confiance, la liberté de parole et la hardiesse dans la démarche.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour être secourus au moment où nous en avons besoin ». L’expression grecque désigne plus littéralement un secours qui vient au bon moment.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: Approchons-nous
  rationale: Le subjonctif présent a une valeur exhortative. « Approchons-nous » est naturel en français moderne et conserve l’idée de s’avancer vers Dieu.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement la conséquence tirée de l’enseignement précédent sur Jésus, le grand-prêtre.
- source_word: μετὰ παρρησίας
  choice: avec assurance
  rationale: παρρησία évoque une démarche libre, confiante et hardie. « Avec assurance » exprime cette liberté d’accès sans suggérer la présomption; une note signale la nuance de hardiesse.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: du trône de la grâce
  rationale: Cette formulation conserve le génitif et la métaphore du texte grec sans préciser indûment la relation entre le trône et la grâce.
- source_word: ἵνα
  choice: afin de
  rationale: « Afin de » rend clairement la valeur de but introduite par ἵνα.
- source_word: λάβωμεν ἔλεος
  choice: recevoir compassion
  rationale: « Recevoir » rend directement λαμβάνω. « Compassion » exprime ici ἔλεος dans un français naturel et distingue ce terme de χάρις, rendu par « grâce ».
- source_word: χάριν εὕρωμεν
  choice: trouver grâce
  rationale: La traduction conserve le verbe distinct « trouver » et le terme théologiquement important « grâce ».
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: pour être secourus au moment opportun
  rationale: La tournure rend explicitement l’idée d’un secours qui intervient au bon moment, portée par εὔκαιρος, tout en restant idiomatique en français.
theological_decisions:
- issue: Nuance de παρρησία dans l’accès à Dieu
  choice: avec assurance
  alternative: avec hardiesse
  rationale: « Assurance » communique un accès confiant et libre grâce au ministère sacerdotal de Jésus, sans réduire le terme à un sentiment intérieur. La note préserve sa nuance plus forte de hardiesse.
- issue: Traduction de χάρις
  choice: grâce
  alternative: faveur
  rationale: « Grâce » conserve le lien lexical avec « le trône de la grâce » et la densité théologique du terme, sans dépasser le sens contextuel de bienveillance divine.
- issue: Moment du secours exprimé par εὔκαιρος
  choice: au moment opportun
  alternative: au moment où nous en avons besoin
  rationale: Le choix principal met l’accent, comme le grec, sur le caractère opportun du secours. L’alternative traditionnelle est signalée sans être introduite silencieusement dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore du trône, la progression « recevoir… trouver » et l’ambiguïté féconde de παρρησία. Les marqueurs [a] et [b] figurent dans le texte principal.
