lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ailleurs
  rationale: Dans cette formule de citation, le groupe renvoie à un autre endroit du texte scripturaire. « Ailleurs » est naturel en français et exprime clairement cette valeur contextuelle.
- source_word: πάλιν
  choice: encore
  rationale: Le mot signale une nouvelle citation ou un nouvel appel à l’Écriture.
- source_word: Εἰ εἰσελεύσονται
  choice: Ils n’entreront certainement pas
  rationale: La construction conditionnelle grecque reproduit une formule de serment sémitique qui exprime ici une négation catégorique.
- source_word: κατάπαυσίν
  choice: repos
  rationale: « Repos » conserve le terme clé du raisonnement d’Hébreux 3–4 et convient à l’expression du repos de Dieu.
- source_word: μου
  choice: mon
  rationale: Le possessif est maintenu directement, puisque Dieu parle de son propre repos dans la citation.
theological_decisions:
- issue: Interprétation de la formule de serment Εἰ εἰσελεύσονται
  choice: Ils n’entreront certainement pas dans mon repos
  alternative: S’ils entrent dans mon repos
  rationale: Bien que la forme grecque soit littéralement conditionnelle, elle reprend une tournure de serment d’origine hébraïque qui équivaut à une forte négation. La traduction communique cette force sans ajouter d’interprétation doctrinale.
translation_notes:
