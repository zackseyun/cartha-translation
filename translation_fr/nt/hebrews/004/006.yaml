id: HEB.4.6
reference: Hebrews 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: fr
  text: Ainsi donc, puisqu’il reste à certains d’y entrer, et que ceux à qui la bonne nouvelle avait été annoncée auparavant n’y sont pas entrés à cause de leur désobéissance[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « manque de foi ». Le mot grec peut désigner le refus de croire tel qu’il se manifeste dans la désobéissance.
    reason: Alternative lexicale reflétant le chevauchement de sens de ἀπείθεια entre incrédulité et désobéissance.
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Ainsi donc, puisque
  rationale: Cette formulation conserve à la fois la portée déductive de οὖν et la valeur explicative ou causale de ἐπεί, tout en reliant naturellement le verset au raisonnement précédent.
- source_word: ἀπολείπεται
  choice: il reste
  rationale: Le présent passif exprime qu’une possibilité demeure ouverte. « Il reste » est naturel en français et préserve cette continuité.
- source_word: τινὰς
  choice: à certains
  rationale: Le pronom indéfini désigne des personnes sans les identifier. Avec l’infinitif « entrer », « il reste à certains d’y entrer » restitue clairement la construction grecque.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: d’y entrer
  rationale: Le pronom adverbial « y » renvoie naturellement en français au repos de Dieu mentionné dans le contexte, sans répéter un nom absent de cette proposition grecque.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: ceux à qui la bonne nouvelle avait été annoncée auparavant
  rationale: Cette traduction conserve la voix passive de εὐαγγελισθέντες, rend πρότερον par « auparavant » et évite le terme ecclésiastique ou potentiellement anachronique « évangélisés ».
- source_word: οὐκ εἰσῆλθον
  choice: ne sont pas entrés
  rationale: Cette formulation traduit directement l’aoriste nié, sans ajouter l’idée d’un échec involontaire.
- source_word: δι’ ἀπείθειαν
  choice: à cause de leur désobéissance
  rationale: ἀπείθεια désigne fondamentalement la désobéissance ou le refus d’écouter, tout en pouvant inclure ici le manque de foi. Le possessif « leur » est requis par l’usage naturel du français.
theological_decisions:
- issue: Sens de ἀπείθεια dans l’avertissement concernant l’entrée dans le repos
  choice: à cause de leur désobéissance
  alternative: à cause de leur manque de foi
  rationale: Le terme grec associe le refus de croire au refus d’obéir. Le texte principal retient son sens central de « désobéissance », tandis que la note préserve le chevauchement sémantique avec le manque de foi sans réduire l’un à l’autre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure syntaxiquement ouverte, conformément au grec et à la poursuite du raisonnement au verset suivant. Le pronom « y » maintient le renvoi contextuel au repos de Dieu sans explicitation superflue.
