id: HEB.4.14
reference: Hebrews 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: fr
  text: Ainsi donc, puisque nous avons un grand-prêtre éminent qui a traversé les cieux, Jésus, le Fils de Dieu, restons fermement attachés à notre confession de foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Ainsi donc, puisque nous avons
  rationale: Le participe fournit le fondement de l’exhortation, tandis que οὖν marque la déduction tirée de ce qui précède. Cette formulation rend les deux rapports logiques dans un français naturel.
- source_word: ἀρχιερέα μέγαν
  choice: un grand-prêtre éminent
  rationale: « Grand-prêtre » est le titre sacerdotal usuel en français. « Éminent » distingue l’adjectif μέγαν du premier élément lexicalisé de « grand-prêtre » et en conserve la valeur qualitative.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: qui a traversé les cieux
  rationale: Le passé composé exprime l’action accomplie du parfait grec, dont la portée demeure dans le contexte. « Traversé » conserve l’idée d’un passage à travers, et « les cieux » maintient le pluriel grec.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: Jésus, le Fils de Dieu
  rationale: Le nom et le titre christologique sont rendus directement, sans paraphrase ni réduction.
- source_word: κρατῶμεν
  choice: restons fermement attachés
  rationale: Le subjonctif exhortatif appelle la communauté à une persévérance continue. Cette tournure est actuelle, claire et soutenue.
- source_word: τῆς ὁμολογίας
  choice: à ce que nous confessons
  rationale: La paraphrase légère évite l’ambiguïté moderne de « confession » en français, qui peut désigner un aveu ou un sacrement, tout en conservant l’idée de la foi publiquement professée.
theological_decisions:
- issue: Rendu du titre υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  alternative: le Fils qui vient de Dieu
  rationale: La formulation traditionnelle traduit formellement le titre christologique explicite sans en préciser davantage la relation.
- issue: Portée cosmologique de τοὺς οὐρανούς
  choice: les cieux
  alternative: le ciel
  rationale: Le pluriel du texte est conservé afin de préserver son imagerie sans imposer une cosmologie systématisée.
- issue: Sens de ὁμολογία
  choice: ce que nous confessons
  alternative: notre confession de foi
  rationale: La formulation choisie maintient l’objet de la confession suffisamment ouvert, comme en grec, tout en indiquant qu’il s’agit de l’engagement professé par la communauté.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression logique, le pluriel « les cieux » et la solennité de l’exhortation. « Grand-prêtre éminent » évite que « grand grand-prêtre » ou le simple « grand-prêtre » efface l’adjectif μέγας.
