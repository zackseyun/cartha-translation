- from: Ainsi donc, puisque nous avons un grand-prêtre éminent qui a traversé les cieux — Jésus, le Fils de Dieu —, restons fermement attachés à ce que nous confessons.
  to: Ainsi donc, puisque nous avons un grand-prêtre éminent qui a traversé les cieux, Jésus, le Fils de Dieu, restons fermement attachés à notre confession de foi.
  rationale: La révision conserve toutes les décisions lexicales essentielles du projet, tout en rétablissant explicitement le substantif correspondant à ὁμολογία et en simplifiant la ponctuation de l’apposition. Aucun ajout doctrinal ou cosmologique n’est introduit.
