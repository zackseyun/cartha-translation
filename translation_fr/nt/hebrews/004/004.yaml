id: HEB.4.4
reference: Hebrews 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: fr
  text: 'Car il a dit quelque part[a], au sujet du septième jour : « Et Dieu s’est reposé[b] le septième jour de toutes ses œuvres. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans un certain passage ». Le grec dit littéralement « quelque part » : cette introduction ne précise pas l’emplacement de la citation dans l’Écriture, mais n’exprime pas d’incertitude quant à son autorité.'
    reason: lexical_alternative
  - marker: b
    text: Ou « a cessé ». Le verbe peut souligner l’arrêt d’une activité; « s’est reposé » maintient ici le lien avec Genèse 2.2 et avec le thème du repos de Dieu en Hébreux 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: il a dit
  rationale: Le parfait grec présente une parole prononcée dans le passé qui demeure pertinente. Le passé composé français convient naturellement à l’introduction d’une citation toujours valable.
- source_word: γάρ
  choice: Car
  rationale: La conjonction introduit l’appui scripturaire donné à l’affirmation précédente.
- source_word: που
  choice: quelque part
  rationale: Le terme introduit de façon non spécifique le lieu scripturaire de la citation, sans mettre en doute son autorité.
- source_word: περὶ τῆς ἑβδόμης
  choice: au sujet du septième jour
  rationale: L’adjectif féminin substantivé sous-entend « jour »; celui-ci est explicité en français pour que la phrase soit claire.
- source_word: οὕτως
  choice: '[rendu par les deux-points]'
  rationale: En français moderne, les deux-points introduisent naturellement la teneur de la citation et rendent ici la fonction de οὕτως sans alourdir la phrase par « de cette manière ».
- source_word: Καὶ
  choice: Et
  rationale: La conjonction appartient à la citation de la Genèse et est donc conservée.
- source_word: κατέπαυσεν
  choice: s’est reposé
  rationale: Ce choix rend le verbe naturellement dans le contexte de Genèse 2.2 et maintient le lien lexical avec le thème du repos développé en Hébreux 3–4; l’idée de cessation est signalée en note.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: le septième jour
  rationale: En français, un complément temporel désignant un jour se construit naturellement sans préposition dans cette formulation.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: de toutes ses œuvres
  rationale: « De » exprime ce dont Dieu a cessé ou s’est reposé, tandis que le pluriel « œuvres » conserve celui du grec.
theological_decisions:
- issue: La cessation sabbatique de Dieu et le thème du repos en Hébreux
  choice: s’est reposé
  alternative: a cessé [d’agir/de travailler]
  rationale: « S’est reposé » préserve le lien avec Genèse 2.2 et avec l’argument sur le repos de Dieu en Hébreux 3–4, sans devoir suggérer que Dieu était fatigué. La note conserve la nuance possible de cessation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en employant les conventions naturelles du français pour introduire une citation biblique. « Œuvres » conserve le pluriel grec et le registre scripturaire sans archaïsme marqué.
