source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: fr
  text: 'De nouveau, Dieu fixe un jour particulier, « Aujourd’hui », en disant par David, bien longtemps après, comme cela a déjà été dit :


    « Aujourd’hui, si vous entendez sa voix,

    ne durcissez pas vos cœurs. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: De nouveau
  rationale: Marque la reprise de l’argument et la désignation renouvelée d’un jour par Dieu.
- source_word: τινὰ ὁρίζει ἡμέραν
  choice: Dieu fixe un jour particulier
  rationale: « Fixe » exprime l’acte autoritatif de déterminer ou désigner ce jour ; « particulier » conserve l’idée d’un jour précis sans encore le nommer. Le sujet « Dieu », implicite dans le contexte, est explicité pour éviter en français une ambiguïté artificielle du pronom.
- source_word: Σήμερον
  choice: aujourd’hui
  rationale: Désigne le jour nommé dans la citation du Psaume 95 et garde sa force d’appel présent, sans le réduire à une simple date calendaire.
- source_word: ἐν Δαυὶδ λέγων
  choice: lorsqu’il dit par David
  rationale: Rend naturellement l’idée que Dieu parle par l’intermédiaire de David, tout en signalant en note la formulation plus littérale et son possible sens textuel.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: bien longtemps après
  rationale: Expression française naturelle qui souligne le long intervalle évoqué par le texte.
- source_word: καθὼς προείρηται
  choice: comme cela a déjà été dit
  rationale: Le parfait passif renvoie à une parole antérieure qui demeure pertinente dans l’argument.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: si vous entendez sa voix
  rationale: Préserve l’image biblique de l’écoute, avec sa portée implicite d’accueil et de réponse, sans la paraphraser directement par « obéir ».
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: ne rendez pas votre cœur insensible
  rationale: Rend l’appel à ne pas s’endurcir dans une formulation actuelle et intelligible. Le singulier collectif « votre cœur » est idiomatique en français et désigne la disposition intérieure de chacun.
theological_decisions:
- issue: Portée d’« aujourd’hui » dans l’argument sur le repos de Dieu
  choice: Le conserver comme le jour que Dieu désigne pour entendre sa voix et lui répondre, sans en limiter la portée à une date historique.
  alternative: Le comprendre uniquement comme le jour où le psaume a été prononcé, ou exclusivement comme un jour eschatologique.
  rationale: L’auteur souligne qu’un appel divin demeure formulé longtemps après la génération du désert. La traduction conserve cette tension temporelle sans imposer une construction doctrinale plus précise que le texte.
- issue: Sens de ἐν Δαυὶδ
  choice: « par David »
  alternative: « en David », au sens de « dans le psaume associé à David »
  rationale: « Par David » est clair et naturel pour le lecteur moderne, mais la note maintient visible l’ambiguïté de l’expression grecque et évite de trancher excessivement la question de l’attribution du psaume.
- issue: Sujet de ὁρίζει
  choice: Expliciter « Dieu »
  alternative: Employer « il », en laissant le lecteur retrouver l’antécédent dans le contexte immédiat.
  rationale: Le contexte identifie Dieu comme celui qui fixe le jour. L’explicitation rend le verset autonome et naturel en français sans modifier la relation théologique exprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La citation poétique est disposée en lignes distinctes. « Cœur insensible » communique l’endurcissement intérieur sans jargon, tandis que la formulation conserve la solennité de l’avertissement.
