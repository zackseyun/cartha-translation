  to: 'De nouveau, Dieu fixe un jour particulier, « Aujourd’hui », en disant par David, bien longtemps après, comme cela a déjà été dit :


    « Aujourd’hui, si vous entendez sa voix,

    ne durcissez pas vos cœurs. »'
  rationale: La révision restitue le pluriel de « vos cœurs » et le verbe précis « endurcir », sans modifier l’ambiguïté de ἐν Δαυὶδ ni la portée argumentative d’« Aujourd’hui ». Elle resserre aussi la syntaxe afin de mieux suivre le participe grec « en disant ».
