review_pass:
  verdict: revise
  source_fidelity: La structure et le sens général sont fidèles. Toutefois, « ne rendez pas votre cœur insensible » atténue et singularise indûment le pluriel grec τὰς καρδίας ὑμῶν; « n’endurcissez pas vos cœurs » correspond directement au verbe σκληρύνω et conserve l’expression biblique établie. « en disant par David » rend plus nettement la construction participiale λέγων que « lorsqu’il dit par David ».
  naturalness: Le français est globalement clair et moderne. « N’endurcissez pas vos cœurs » est à la fois idiomatique, accessible et plus naturel dans ce registre solennel que « ne rendez pas votre cœur insensible ».
  terminology: « Aujourd’hui », « entendre sa voix » et « endurcir les cœurs » préservent les termes et l’imagerie de la citation du Psaume. La note maintient à juste titre l’ambiguïté de ἐν Δαυὶδ sans imposer une théorie d’attribution.
  issues:
  - severity: medium
    issue: Rendu de τὰς καρδίας ὑμῶν
    rationale: Le texte grec emploie le pluriel (« vos cœurs »). Le singulier collectif français est possible, mais ici il s’accompagne de « insensible », qui affaiblit le lexique précis de l’endurcissement et éloigne la formulation de la citation reprise en Hébreux.
  - severity: low
    issue: Articulation de λέγων avec la précision temporelle
    rationale: « En disant par David, bien longtemps après » reflète plus directement le participe λέγων et le complément μετὰ τοσοῦτον χρόνον, tout en restant fluide en français.
