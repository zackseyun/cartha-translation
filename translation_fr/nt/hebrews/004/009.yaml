  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: fr
  text: Il reste donc un repos sabbatique[a] pour le peuple de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une observance du sabbat ». Le terme grec σαββατισμός est rare et fait explicitement écho au sabbat ; ici, il désigne probablement un repos de caractère sabbatique qui demeure pour le peuple de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Ainsi donc
  rationale: Cette locution marque naturellement en français la conclusion tirée de l’argument précédent.
- source_word: ἀπολείπεται
  choice: subsiste
  rationale: Le présent indique que ce repos demeure encore disponible ou réservé; « subsiste » exprime cette continuité avec concision.
- source_word: σαββατισμός
  choice: repos de sabbat
  rationale: Ce nom rare évoque explicitement le sabbat tout en désignant, dans le contexte, un repos semblable à celui du sabbat. Cette formulation conserve à la fois l’écho lexical et la portée plus large du passage.
- source_word: τῷ λαῷ
  choice: pour le peuple
  rationale: 'Le datif exprime ici naturellement le bénéficiaire: ce repos subsiste pour le peuple.'
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Cette formulation simple rend fidèlement le génitif de relation ou d’appartenance.
theological_decisions:
- issue: Sens de σαββατισμός en Hébreux 4.9
  choice: Un repos de type sabbatique qui subsiste pour le peuple de Dieu
  alternative: L’observance littérale du sabbat; ou un repos purement métaphorique dépourvu de toute résonance sabbatique
  rationale: Le terme renvoie explicitement au sabbat, tandis que le contexte associe le repos de Dieu, le septième jour et le repos promis. « Repos de sabbat » préserve cette tension sans réduire le sens à une pratique hebdomadaire ni effacer son ancrage sabbatique.
translation_notes:
  register: Français international moderne, naturel et digne. « Ainsi donc » maintient le lien argumentatif; « repos de sabbat » reste accessible tout en conservant l’écho inhabituel et théologiquement chargé du grec.
