id: HEB.4.12
reference: Hebrews 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: fr
  text: Car la parole de Dieu est vivante et agissante[a], plus tranchante que toute épée à deux tranchants. Elle pénètre jusqu’à la séparation de l’âme et de l’esprit, des articulations et de la moelle[b] ; elle est capable de juger les pensées et les intentions du cœur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « efficace » ou « à l’œuvre ».
    reason: lexical_alternative
  - marker: b
    text: La mention de « l’âme et de l’esprit » n’impose pas ici une doctrine particulière sur les composantes de l’être humain ; l’image souligne jusqu’où la parole de Dieu peut pénétrer.
    reason: alternative_reading
  - marker: c
    text: Ou « elle discerne les pensées et les intentions du cœur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: vivante
  rationale: Rend directement la vitalité continue attribuée à la parole de Dieu, dans une formulation française naturelle et consacrée par l’usage.
- source_word: γὰρ
  choice: Car
  rationale: Conserve la valeur explicative du lien avec l’exhortation précédente.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Rendu transparent qui ne limite pas le référent à l’Écriture, à la prédication, à une déclaration divine particulière ou au Logos personnel.
- source_word: ἐνεργὴς
  choice: agissante
  rationale: Exprime que la parole est à l’œuvre. « Efficace » reste possible, mais met davantage l’accent sur le résultat.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: plus tranchante que toute épée à deux tranchants
  rationale: Préserve clairement la comparaison et l’image des deux tranchants dans un français actuel.
- source_word: διϊκνούμενος
  choice: elle pénètre
  rationale: Restitue le mouvement de pénétration profonde tout en maintenant l’image de l’épée.
- source_word: ἄχρι μερισμοῦ
  choice: jusqu’à la séparation
  rationale: Conserve l’idée d’étendue portée jusqu’au point de séparation, sans préciser excessivement la manière dont les éléments nommés sont séparés.
- source_word: ψυχῆς καὶ πνεύματος
  choice: de l’âme et de l’esprit
  rationale: Rendu lexical direct qui préserve les deux termes sans imposer une théorie particulière de la composition humaine.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: des articulations et de la moelle
  rationale: « Moelle » au singulier collectif est plus idiomatique en français moderne, tandis que le parallélisme corporel et l’image de pénétration profonde sont conservés.
- source_word: κριτικὸς
  choice: capable de juger
  rationale: Exprime la capacité d’évaluer portée par l’adjectif grec ; « discerner » est une autre traduction naturelle possible.
- source_word: ἐνθυμήσεων
  choice: pensées
  rationale: Terme français courant et suffisamment large pour les réflexions et raisonnements intérieurs.
- source_word: ἐννοιῶν
  choice: intentions
  rationale: Distingue ce terme de « pensées » en faisant ressortir les visées et dispositions intérieures.
theological_decisions:
- issue: Référent de « la parole de Dieu »
  choice: Conserver la désignation générale « la parole de Dieu ».
  alternative: Préciser qu’il s’agit de l’Écriture, d’une promesse ou sentence prononcée par Dieu, de la prédication, ou du Fils comme Logos.
  rationale: Le contexte souligne la parole prononcée par Dieu et son efficacité, mais le grec ne justifie pas ici une identification dogmatique plus étroite.
- issue: Portée anthropologique de « l’âme et l’esprit »
  choice: Maintenir les deux termes sans en tirer une définition technique de la nature humaine.
  alternative: Comprendre la formule comme l’affirmation de composantes humaines distinctes et séparables, ou la paraphraser entièrement comme une référence à l’intériorité profonde.
  rationale: La métaphore insiste sur la portée pénétrante de la parole de Dieu. La traduction doit conserver la formulation tout en évitant de trancher un débat anthropologique que le verset ne tranche pas explicitement.
- issue: Force de κριτικὸς
  choice: « capable de juger »
  alternative: « qui discerne »
  rationale: Le choix principal garde l’idée d’évaluation ou de jugement, tandis que l’alternative souligne davantage le discernement intérieur.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux propositions pour éviter une accumulation lourde, tout en conservant la progression du grec. « Agissante », « à deux tranchants » et « capable de juger » restent précis sans adopter un registre technique ou confessionnel.
