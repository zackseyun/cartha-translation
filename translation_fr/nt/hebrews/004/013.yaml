id: HEB.4.13
reference: Hebrews 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: fr
  text: Aucune créature ne lui est cachée ; au contraire, tout est nu et mis à découvert à ses yeux[a]. C’est à lui que nous devons rendre compte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec rare traduit par « mis à découvert » peut évoquer un cou dégagé ou renversé ; il souligne ici une exposition complète devant Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement, la formule grecque peut se comprendre : « celui avec qui nous avons affaire » ; elle peut aussi évoquer celui à qui s’adresse notre parole ou notre affaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: κτίσις
  choice: créature
  rationale: Le singulier a une valeur générique et désigne tout être ou toute chose créée. « Créature » reste concis et exprime clairement la dépendance envers le Créateur.
- source_word: ἀφανὴς
  choice: cachée
  rationale: Dans ce contexte, le mot évoque ce qui échappe au regard ou à l’examen, non une invisibilité métaphysique.
- source_word: ἐνώπιον αὐτοῦ
  choice: ne lui est cachée
  rationale: La tournure française intègre naturellement « devant lui » à l’idée de dissimulation et prépare la mention explicite de ses yeux.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée universelle. « Tout » est naturel en français et conserve cette ampleur.
- source_word: γυμνὰ
  choice: nu
  rationale: Le terme maintient l’image forte d’une exposition totale, sans protection ni dissimulation.
- source_word: τετραχηλισμένα
  choice: mis à découvert
  rationale: Ce participe parfait rare décrit un état d’exposition complète, peut-être avec l’image du cou dégagé ou renversé. « Mis à découvert » en exprime le résultat sans imposer une étymologie discutée.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: à ses yeux
  rationale: Traduction directe et idiomatique qui conserve le motif du regard divin.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: C’est à lui que nous devons rendre compte
  rationale: La formule grecque est condensée, littéralement proche de « vers qui, pour nous, est la parole/l’affaire ». Dans ce contexte d’examen divin, la reddition de comptes en rend clairement la force, tandis que les autres lectures sont signalées en note.
theological_decisions:
- issue: Sens de πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 'La proposition exprime notre responsabilité devant Dieu : « C’est à lui que nous devons rendre compte. »'
  alternative: « celui avec qui nous avons affaire » ou « celui à qui s’adresse notre parole/notre affaire »
  rationale: Le contexte immédiat souligne que rien n’échappe au discernement de Dieu. La traduction retenue préserve la portée d’avertissement sans préciser davantage la nature du jugement ; une note maintient l’ambiguïté réelle de l’expression grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite une longue proposition relative peu naturelle en français. « Au contraire » rend la force adversative de δέ après la négation, et les notes conservent les deux principales difficultés lexicales du verset.
