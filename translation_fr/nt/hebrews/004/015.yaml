id: HEB.4.15
reference: Hebrews 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: fr
  text: En effet, nous n’avons pas un grand-prêtre incapable de compatir à nos faiblesses, mais un grand-prêtre qui a été mis à l’épreuve[a] en tout, comme nous, sans péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui a été tenté ». Le verbe grec peut désigner aussi bien la mise à l’épreuve que la tentation.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « à l’exception du péché ». Cette expression exclut le péché de la similitude et des épreuves évoquées.'
    reason: ambiguity
lexical_decisions:
- source_word: ἀρχιερέα
  choice: grand-prêtre
  rationale: Terme français courant et précis pour la fonction cultuelle qui occupe une place centrale dans l’argumentation de l’épître aux Hébreux.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: incapable de compatir
  rationale: Conserve la litote grecque οὐ… μὴ δυνάμενον et exprime la capacité de partager la souffrance et la faiblesse d’autrui, plutôt qu’une simple pitié.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: à nos faiblesses
  rationale: Désigne largement la fragilité et la vulnérabilité humaines, sans limiter le sens à la maladie physique.
- source_word: πεπειρασμένον
  choice: qui a été mis à l’épreuve
  rationale: Le verbe peut évoquer l’épreuve ou la tentation. « Mis à l’épreuve » rend ici la réalité des épreuves subies sans atténuer la déclaration finale concernant l’absence de péché; l’autre nuance est signalée en note.
- source_word: κατὰ πάντα
  choice: en tout
  rationale: Formulation française concise qui exprime l’étendue complète de l’expérience évoquée.
- source_word: καθ’ ὁμοιότητα
  choice: comme nous
  rationale: Dans le contexte, cette expression de similitude appelle naturellement la comparaison avec les humains auxquels l’auteur s’adresse. « Comme nous » rend l’implicite sans alourdir le français.
- source_word: χωρὶς ἁμαρτίας
  choice: sans péché
  rationale: Rend directement l’exception décisive qui qualifie la similitude précédemment affirmée, tout en laissant ouverte la portée syntaxique exacte de la formule.
theological_decisions:
- issue: Sens de πεπειρασμένον par rapport à l’absence de péché du Christ
  choice: qui a été mis à l’épreuve
  alternative: qui a été tenté
  rationale: Le grec permet les deux nuances. Le texte principal privilégie l’épreuve, tandis que la note conserve explicitement la possibilité de la tentation afin de ne pas supprimer la tension lexicale.
- issue: Comparaison exprimée par καθ’ ὁμοιότητα
  choice: comme nous
  alternative: selon la ressemblance
  rationale: « Comme nous » explicite avec naturel la comparaison suggérée par le contexte. La formulation grecque littérale serait peu idiomatique et obscure en français courant.
- issue: Portée de χωρὶς ἁμαρτίας
  choice: sans péché
  alternative: à l’exception du péché
  rationale: « Sans péché » préserve une formulation concise et théologiquement non réductrice. Une note indique que le grec peut aussi être compris comme excluant le péché du domaine de l’épreuve ou de la similitude.
translation_notes:
  register: Français international moderne, digne et accessible. La structure négative (« nous n’avons pas… incapable ») maintient la litote du grec. La répétition de « grand-prêtre » après « mais » clarifie en français le référent sous-entendu sans ajouter un nouvel acteur.
