id: HEB.13.20
reference: Hebrews 13:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: fr
  text: Que le Dieu de paix[a], qui a ramené d’entre les morts notre Seigneur Jésus, le grand berger des brebis, par le sang d’une alliance éternelle,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui a ramené d’entre les morts notre Seigneur Jésus […] dans le sang de l’alliance éternelle ». Le grec permet de rattacher de façons légèrement différentes l’expression « par/dans le sang d’une alliance éternelle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Que le
  rationale: δέ marque ici la transition vers une bénédiction formulée comme un souhait. Le français naturel peut laisser cette transition implicite, tandis que « Que » rend la valeur optative de la phrase qui se poursuit au verset suivant.
- source_word: θεὸς τῆς εἰρήνης
  choice: le Dieu de paix
  rationale: Le génitif caractérise Dieu par la paix ou l’associe à elle. « Le Dieu de paix » est fidèle, idiomatique et digne.
- source_word: ὁ ἀναγαγὼν
  choice: qui a ramené
  rationale: ἀνάγω signifie faire monter, conduire ou ramener. Dans ce contexte de résurrection, « ramener d’entre les morts » conserve davantage l’image verbale que le simple « ressusciter », tout en restant naturel.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Formule grecque courante de résurrection; « d’entre les morts » rend la valeur de ἐκ et le pluriel substantivé νεκρῶν.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: le grand berger des brebis
  rationale: Cette formulation conserve la métaphore pastorale, l’intensité de μέγαν et la référence explicite aux brebis.
- source_word: ἐν αἵματι
  choice: par le sang
  rationale: ἐν peut ici exprimer le moyen ou le fondement. « Par le sang » est concis et naturel, sans préciser excessivement le rapport théologique.
- source_word: διαθήκης αἰωνίου
  choice: d’une alliance éternelle
  rationale: Dans l’épître aux Hébreux, διαθήκη désigne une alliance. L’absence d’article grec permet naturellement « une alliance éternelle », sans exclure l’allusion à l’alliance connue des lecteurs.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: notre Seigneur Jésus
  rationale: Cette tournure française rend directement le titre κύριος, le possessif ἡμῶν et le nom Jésus.
theological_decisions:
- issue: Rattachement de ἐν αἵματι διαθήκης αἰωνίου
  choice: 'Rattaché principalement à l’action de Dieu qui ramène Jésus d’entre les morts : « par le sang d’une alliance éternelle »'
  alternative: Rattaché principalement à « le grand berger des brebis », ou rendu « dans le sang de l’alliance éternelle »
  rationale: L’ordre grec permet plusieurs rattachements. La traduction principale suit la lecture instrumentale la plus naturelle dans la bénédiction, tandis que la note signale l’ambiguïté sans imposer une explication des mécanismes de la résurrection ou de l’expiation.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par une virgule parce que la bénédiction se poursuit au verset 21. Le vocabulaire biblique « berger », « brebis », « alliance » et « Seigneur » est conservé sans archaïsme.
