  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: fr
  text: N’oubliez pas de pratiquer l’hospitalité, car certains ont ainsi accueilli des anges sans le savoir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « certains ont accueilli des messagers sans le savoir ». Le mot grec peut désigner des anges ou des messagers, mais « anges » correspond mieux à l’allusion probable ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: l’hospitalité
  rationale: Le nom désigne l’accueil bienveillant des étrangers. « L’hospitalité » est l’expression française naturelle et établie, même si l’idée d’accueillir des inconnus y est moins explicite que dans le grec.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: N’oubliez pas
  rationale: L’impératif présent appelle à ne pas laisser tomber cette pratique. « N’oubliez pas » restitue directement le verbe tout en constituant une exhortation naturelle en français.
- source_word: διὰ ταύτης
  choice: en la pratiquant
  rationale: Le pronom féminin renvoie à l’hospitalité et διά exprime ici le moyen. Cette formulation explicite naturellement en français qu’il s’agit de la pratique de l’hospitalité.
- source_word: ἔλαθόν … ξενίσαντες
  choice: ont accueilli … sans le savoir
  rationale: La construction avec λανθάνω et le participe indique que l’accueil a eu lieu à l’insu des personnes concernées. « Sans le savoir » en rend clairement la valeur idiomatique.
- source_word: τινες
  choice: certains
  rationale: Le pronom indéfini pluriel désigne un nombre non précisé de personnes; « certains » convient au registre narratif et exhortatif.
- source_word: ξενίσαντες
  choice: ont accueilli
  rationale: Le verbe signifie recevoir ou héberger comme hôtes. « Accueilli » évite le sens moderne possible de « divertir » et garde le lien naturel avec l’hospitalité.
- source_word: ἀγγέλους
  choice: des anges
  rationale: Le mot peut désigner des messagers humains ou célestes, mais l’allusion probable aux récits de la Genèse où des visiteurs célestes sont accueillis favorise « anges ». L’autre sens est conservé en note.
theological_decisions:
- issue: Sens de ἀγγέλους
  choice: anges, au sens d’êtres célestes
  alternative: messagers, éventuellement humains
  rationale: L’allusion vraisemblable à l’accueil de visiteurs célestes dans les récits patriarcaux favorise « anges », sans supprimer l’ambiguïté lexicale du grec, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la brièveté de l’exhortation grecque; « en la pratiquant » rend explicite le renvoi pronominal sans ajouter d’interprétation doctrinale.
