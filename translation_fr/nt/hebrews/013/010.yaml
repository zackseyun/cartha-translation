review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : possession présente d’un « autel », absence de droit d’y manger pour les personnes engagées dans le service cultuel de la σκηνή. Toutefois, « sanctuaire sous la tente » n’est pas une représentation fidèle ni naturelle de σκηνή : le mot désigne ici la tente sanctuaire / le tabernacle, non un sanctuaire situé « sous » une tente.'
  naturalness: « Ceux qui assurent le service au tabernacle » est plus idiomatique et plus concis en français moderne que « dans le sanctuaire sous la tente ». La tournure traditionnelle « un autel dont … n’ont pas le droit de manger » conserve la formulation imagée du grec sans expliciter abusivement ce qui est mangé.
  terminology: « Autel », « droit » et « tabernacle » sont appropriés dans ce contexte cultuel. « Tabernacle » est un terme établi, compréhensible dans un registre biblique international moderne, et évite la paraphrase inexacte du projet.
