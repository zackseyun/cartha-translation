- from: Nous avons un autel dont ceux qui assurent le service dans le sanctuaire sous la tente[a] n’ont pas le droit de manger[b].
  to: Nous avons un autel[b] dont ceux qui assurent le service au tabernacle[a] n’ont pas le droit de manger.
  rationale: La révision remplace une paraphrase spatialement inexacte par « au tabernacle », qui rend directement σκηνή dans son contexte cultuel. Elle préserve l’image volontairement non spécifiée de l’autel et de l’action de manger, sans imposer de référent théologique ni ajouter « sacrifices ». Les notes sont maintenues, avec des ancres placées sur les mots auxquels elles se rapportent.
