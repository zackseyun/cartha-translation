  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: fr
  text: Nous avons un autel[b] dont ceux qui assurent le service au tabernacle[a] n’ont pas le droit de manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui accomplissent le service dans la tente ». L’expression désigne ceux qui exercent le service cultuel dans le sanctuaire de l’ancienne alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'L’« autel » a été compris de diverses manières : comme le Christ lui-même, la croix, l’autel céleste ou les bienfaits du sacrifice offert par le Christ. Ici, le grec énonce cette image sans la préciser davantage.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: Nous avons
  rationale: Le présent de l’indicatif est conservé simplement; l’auteur s’inclut avec ses destinataires dans cette réalité présente.
- source_word: θυσιαστήριον
  choice: un autel
  rationale: « Autel » rend directement le nom grec et préserve son image cultuelle sans l’identifier dans le texte principal à la croix, au Christ ou au sacrifice.
- source_word: ἐξ οὗ
  choice: dont
  rationale: Avec « manger », le relatif français « dont » exprime naturellement la provenance, au sens de « à partir duquel », sans alourdir la phrase.
- source_word: φαγεῖν
  choice: manger
  rationale: L’infinitif aoriste est rendu par le verbe courant « manger »; la construction française avec « avoir le droit de » est naturelle.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: n’ont pas le droit
  rationale: Dans ce contexte cultuel, ἐξουσία désigne le droit ou la prérogative reconnue de prendre part à ce qui vient de l’autel.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: ceux qui assurent le service dans le sanctuaire sous la tente
  rationale: λατρεύω désigne ici le service cultuel. σκηνή évoque le sanctuaire de l’ancienne alliance établi sous une tente; cette formulation française rend le référent clairement sans employer le terme moins courant « tabernacle » dans le texte principal.
theological_decisions:
- issue: Référent de « l’autel » en Hébreux 13.10
  choice: Conserver le terme concret « autel » sans préciser son référent dans le texte principal.
  alternative: Le Christ lui-même, la croix, l’autel céleste ou les bienfaits sacrificiels de l’offrande du Christ.
  rationale: Le grec laisse ici l’image sans explication précise. La traduction maintient donc l’ambiguïté et la tension théologique au lieu d’imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Sanctuaire sous la tente » explicite sobrement l’image de σκηνή, tandis que la note fournit le terme traditionnel « tabernacle ». La syntaxe reste concise et conserve l’image de manger de ce qui vient de l’autel.
