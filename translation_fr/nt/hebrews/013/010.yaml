    rationale: Cette expression suggère un sanctuaire placé sous une tente, alors que σκηνή renvoie à la tente sanctuaire, traditionnellement le « tabernacle ». Elle ajoute une relation spatiale absente du grec et sonne peu naturelle.
  - severity: low
    issue: Ancrage de la note interprétative sur « l’autel »
    rationale: La note b traite du référent de « autel » ; l’ancrer immédiatement après ce mot rend son rattachement clair, plutôt qu’après « manger ».
