source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: fr
  text: 'Ne vous laissez pas entraîner par toutes sortes d’enseignements étrangers, car il est bon que le cœur soit affermi par la grâce, et non par des aliments[a] : ceux qui ont réglé leur conduite sur eux n’en ont tiré aucun profit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « aliments » désignent probablement des pratiques ou observances alimentaires; le grec dit simplement « aliments ».
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « ceux qui marchaient en eux n’ont pas bénéficié ». « Marcher » désigne ici la manière de vivre ou de se conduire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: toutes sortes d’enseignements étrangers
  rationale: « Toutes sortes de » rend naturellement ποικίλαις, tandis qu’« étrangers » conserve l’idée d’enseignements étrangers au message reçu sans évoquer nécessairement leur origine ethnique.
- source_word: μὴ παραφέρεσθε
  choice: Ne vous laissez pas entraîner
  rationale: Cette tournure garde la valeur passive et l’image d’être emporté hors de la bonne direction, tout en étant idiomatique en français.
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: que le cœur soit affermi par la grâce
  rationale: « Affermi » exprime l’établissement solide indiqué par βεβαιόω; « cœur » et « grâce » sont conservés en raison de leur poids biblique et théologique.
- source_word: οὐ βρώμασιν
  choice: et non par des aliments
  rationale: Le texte dit simplement « aliments ». La traduction n’explicite donc pas dans le corps du verset s’il s’agit de prescriptions alimentaires, de repas rituels ou d’autres observances liées à la nourriture.
- source_word: ἐν οἷς οἱ περιπατοῦντες
  choice: ceux qui ont réglé leur conduite sur eux
  rationale: Le sens métaphorique de περιπατέω concerne la manière de vivre. Cette formulation française évite l’inintelligible « marcher dans des aliments » tout en conservant l’idée d’une conduite organisée en fonction d’eux.
- source_word: οὐκ ὠφελήθησαν
  choice: n’en ont tiré aucun profit
  rationale: Cette expression française naturelle communique clairement l’absence de bénéfice, même si elle transpose la forme passive grecque.
theological_decisions:
- issue: Référent des « aliments » et contraste avec la grâce
  choice: Conserver le terme général « aliments » dans le texte et signaler en note son probable rapport avec des pratiques alimentaires.
  alternative: Préciser « prescriptions alimentaires », « repas sacrificiels » ou « observances alimentaires » dans le texte principal.
  rationale: βρώμασιν ne désigne explicitement que des aliments. Le contexte peut suggérer des pratiques cultuelles ou alimentaires, mais ne permet pas d’en imposer une définition plus étroite.
- issue: Sens de « cœur »
  choice: Conserver « cœur » comme désignation biblique du centre de la vie intérieure.
  alternative: Paraphraser par « esprit », « être intérieur » ou « conscience ».
  rationale: καρδία porte une richesse anthropologique et théologique que ces paraphrases réduiraient.
- issue: Relation entre les aliments et la conduite
  choice: Comprendre περιπατοῦντες au sens métaphorique de régler sa conduite sur ces aliments ou pratiques.
  alternative: Rendre littéralement « ceux qui marchaient en eux » ou plus largement « ceux qui s’en occupaient ».
  rationale: L’emploi métaphorique de περιπατέω pour la conduite est courant; la formulation retenue reste reliée aux aliments sans limiter le propos à une simple préoccupation occasionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement argumentatif grec, avec une ponctuation qui clarifie le lien entre les aliments et ceux qui fondaient sur eux leur conduite.
