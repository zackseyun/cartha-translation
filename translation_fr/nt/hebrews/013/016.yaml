id: HEB.13.16
reference: Hebrews 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: fr
  text: Et n’oubliez pas de faire le bien et de partager[a], car de tels sacrifices plaisent à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner la communion, la générosité ou une contribution. Ici, il évoque probablement le partage concret de ses ressources avec les autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: faire le bien
  rationale: Cette expression naturelle en français moderne rend le caractère actif de la bienfaisance désignée par le nom grec.
- source_word: κοινωνίας
  choice: partager
  rationale: Dans son association avec « faire le bien » et avec les « sacrifices », le terme évoque probablement le partage concret de ressources, tout en restant assez large pour ne pas le limiter à l’aumône.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: n’oubliez pas
  rationale: Cette traduction suit directement le sens lexical du verbe grec et, dans cette exhortation, implique naturellement de ne pas omettre ces actes.
- source_word: τοιαύταις ... θυσίαις
  choice: de tels sacrifices
  rationale: Cette formulation concise conserve explicitement la métaphore cultuelle appliquée aux actes de bienfaisance et de partage.
- source_word: εὐαρεστεῖται
  choice: prend plaisir
  rationale: Le verbe passif exprime que Dieu trouve son agrément dans ces sacrifices. « Prend plaisir » est idiomatique et évite une construction française plus lourde.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction française habituelle du sujet grec.
- source_word: δὲ
  choice: Et
  rationale: La conjonction relie cette exhortation au contexte précédent sans marquer ici une forte opposition.
theological_decisions:
- issue: Nature des « sacrifices » dans le verset
  choice: Référence métaphorique aux actes de bienfaisance et de partage comme sacrifices agréables à Dieu
  alternative: Comprendre surtout l’aumône comme équivalent cultuel, ou réduire l’expression à une conduite éthique générale sans véritable portée sacrificielle
  rationale: Le grec qualifie explicitement ces actes de « sacrifices ». La traduction garde cette image sans la restreindre à l’aumône ni en effacer la dimension cultuelle.
translation_notes:
  register: Français international moderne, naturel et digne. « N’oubliez pas » préserve la forme lexicale du grec tout en portant clairement la force pratique de l’exhortation. Le marqueur [a] est placé immédiatement après le terme concerné.
