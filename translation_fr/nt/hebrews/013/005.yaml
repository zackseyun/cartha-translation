source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: fr
  text: 'Que votre manière de vivre soit exempte de l’amour de l’argent[a] ; contentez-vous de ce que vous avez, car lui-même a dit : « Je ne te laisserai jamais et je ne t’abandonnerai jamais. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que votre conduite soit libre de l’amour de l’argent. »'
    reason: lexical_alternative
  - marker: b
    text: Cette promesse fait écho aux assurances données dans l’Ancien Testament, notamment en Deutéronome 31.6, 8 et en Josué 1.5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: libre de l’amour de l’argent
  rationale: L’adjectif nie précisément l’attachement à l’argent. Cette formulation conserve ce sens spécifique sans l’élargir à toute forme d’avidité.
- source_word: ὁ τρόπος
  choice: votre conduite
  rationale: Dans ce contexte, τρόπος désigne la manière de vivre. « Votre conduite » est naturel, direct et suffisamment large.
- source_word: ἀρκούμενοι
  choice: contentez-vous
  rationale: Le participe a ici une valeur exhortative liée à la proposition initiale. L’impératif français exprime clairement cette force et reste idiomatique.
- source_word: τοῖς παροῦσιν
  choice: de ce que vous avez
  rationale: Littéralement, il s’agit des choses présentes ou disponibles. Dans ce contexte matériel, « ce que vous avez » en donne le sens naturel sans limiter explicitement la formule aux seuls biens.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: car lui-même a dit
  rationale: Le pronom emphatique est conservé sans ajouter « Dieu », absent du grec. Le passé composé rend la parole antérieure dont la validité demeure.
- source_word: Οὐ μή σε ἀνῶ
  choice: Je ne te laisserai jamais
  rationale: La tournure οὐ μή porte une négation fortement emphatique. « Jamais » en restitue naturellement la force.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: et je ne t’abandonnerai jamais
  rationale: ἐγκαταλείπω signifie laisser derrière soi ou abandonner. « Abandonner » est actuel, solennel et distinct du premier verbe.
theological_decisions:
- issue: Identification de celui qui parle dans la citation
  choice: Conserver « lui-même » sans insérer « Dieu »
  alternative: « car Dieu lui-même a dit »
  rationale: Le contexte désigne clairement Dieu, mais le grec emploie αὐτός et non θεός. La traduction préserve donc la formulation du texte sans rendre implicite le référent totalement obscur.
- issue: Force des négations emphatiques
  choice: Répéter « jamais » avec chacun des deux verbes
  alternative: « Je ne te laisserai ni ne t’abandonnerai jamais »
  rationale: Les deux constructions οὐ μή donnent à chacune des promesses une forte valeur négative. La répétition française préserve cette insistance sans reproduire artificiellement la forme grecque.
- issue: Nombre dans l’exhortation et la promesse
  choice: Employer « votre » pour l’assemblée, puis « te » dans la citation
  alternative: Uniformiser au pluriel
  rationale: L’exhortation vise collectivement les destinataires, tandis que le texte grec de la promesse emploie le singulier σε. Le changement de nombre est donc conservé.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule distingue les deux volets complémentaires de l’exhortation. « Abandonner » est préféré à « délaisser », plus littéraire et moins courant aujourd’hui.
