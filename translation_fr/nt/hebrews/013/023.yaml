  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: fr
  text: Sachez que notre frère Timothée a été libéré[a]. Avec lui, s’il arrive bientôt, je vous verrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été relâché », peut-être après une détention. Le verbe peut aussi signifier « a été envoyé ailleurs » ou « a reçu congé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Sachez
  rationale: L’impératif présent pluriel introduit une information destinée aux lecteurs. « Sachez » en conserve directement la force tout en restant naturel dans un registre épistolaire.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: notre frère
  rationale: Cette expression conserve le langage familial chrétien et désigne précisément Timothée.
- source_word: Τιμόθεον
  choice: Timothée
  rationale: Forme française traditionnelle et courante du nom personnel grec.
- source_word: ἀπολελυμένον
  choice: a été libéré
  rationale: Le participe parfait passif indique une action accomplie dont le résultat demeure pertinent. « A été libéré » correspond au sens contextuel le plus probable sans préciser explicitement une détention que le texte ne nomme pas.
- source_word: μεθ’ οὗ
  choice: avec lui
  rationale: Le pronom relatif renvoie à Timothée. En français, « avec lui » s’intègre naturellement à la proposition principale et évite la lourdeur de « avec lequel ».
- source_word: ἐὰν τάχιον ἔρχηται
  choice: s’il vient assez tôt
  rationale: La construction exprime une condition concernant la venue de Timothée. Le comparatif τάχιον peut ici avoir le sens idiomatique de « assez tôt » ou « bientôt »; « assez tôt » rend clairement le lien entre son arrivée à temps et la visite commune.
- source_word: ὄψομαι ὑμᾶς
  choice: j’irai vous voir
  rationale: Le futur de ὁράω signifie littéralement « je vous verrai ». Dans ce contexte de déplacement, « j’irai vous voir » est un français naturel qui conserve l’idée de voir les destinataires sans employer le plus interprétatif « je vous rendrai visite ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase a été divisée en deux pour une lecture naturelle. La note maintient l’ambiguïté lexicale de ἀπολελυμένον sans présenter l’emprisonnement comme certain.
