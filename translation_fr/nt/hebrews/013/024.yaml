id: HEB.13.24
reference: Hebrews 13:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: fr
  text: Saluez tous vos responsables et tous les saints. Ceux qui sont originaires d’Italie vous saluent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceux qui sont en Italie vous saluent. » L’expression grecque peut désigner des personnes originaires d’Italie ou des personnes qui s’y trouvent.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif aoriste de ἀσπάζομαι demande de transmettre une salutation. « Saluez » est direct, naturel et conserve la force impérative.
- source_word: πάντας
  choice: tous
  rationale: Le pluriel accusatif avec l’article désigne l’ensemble de chacun des deux groupes; « tous » le rend clairement.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: vos responsables
  rationale: Le participe désigne ceux qui dirigent la communauté. « Responsables » convient au cadre ecclésial sans suggérer des gouvernants politiques ni préciser indûment leur fonction.
- source_word: τοὺς ἁγίους
  choice: les saints
  rationale: « Les saints » conserve la désignation néotestamentaire des croyants comme personnes consacrées à Dieu et reste compréhensible dans un registre biblique digne.
- source_word: ἀσπάζονται
  choice: vous saluent
  rationale: Le présent de ἀσπάζομαι exprime ici les salutations transmises dans la lettre; « vous saluent » suit naturellement l’usage épistolaire français.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Ceux qui sont d’Italie
  rationale: ἀπό avec le génitif indique normalement l’origine ou la provenance. Cette formulation française rend ce sens tout en laissant ouverte la question de leur lieu actuel.
theological_decisions:
- issue: Référent de οἱ ἀπὸ τῆς Ἰταλίας
  choice: Ceux qui sont d’Italie
  alternative: Ceux qui sont en Italie
  rationale: Le sens le plus direct de ἀπό est l’origine, mais la formule peut être comprise comme désignant des croyants situés en Italie. L’ambiguïté relative au lieu de rédaction est donc signalée sans être tranchée.
translation_notes:
  register: Français international moderne, simple et digne. « Responsables » évite la connotation politique de « dirigeants » ou « chefs ». La note conserve l’ambiguïté géographique du grec.
