id: HEB.13.14
reference: Hebrews 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: fr
  text: Car nous n’avons pas ici de cité qui demeure, mais nous recherchons celle qui est à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car… n’avons pas
  rationale: « Car » rend la valeur explicative de γάρ et relie le verset à l’exhortation précédente; la négation οὐ est naturellement exprimée par « ne… pas ».
- source_word: ἔχομεν
  choice: nous avons
  rationale: Le présent de ἔχω se rend simplement et naturellement par « avoir ».
- source_word: ὧδε
  choice: ici
  rationale: « Ici » conserve le sens déictique sans expliciter abusivement « sur la terre ».
- source_word: μένουσαν
  choice: qui demeure
  rationale: Le participe présent qualifie la cité comme durable ou permanente; « qui demeure » reste proche de la forme grecque tout en étant naturel en français.
- source_word: πόλιν
  choice: cité
  rationale: « Cité » maintient l’image concrète de πόλις et convient au registre biblique sans la remplacer par une interprétation comme « patrie ».
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » marque clairement le contraste entre l’absence d’une cité permanente ici et la recherche de la cité future.
- source_word: τὴν μέλλουσαν
  choice: celle qui est à venir
  rationale: Le participe féminin renvoie à πόλιν; « celle qui est à venir » conserve cette reprise implicite et l’orientation future de μέλλω.
- source_word: ἐπιζητοῦμεν
  choice: nous recherchons
  rationale: « Rechercher » exprime naturellement l’idée de chercher avec application portée par ἐπιζητέω, sans ajouter une intensité excessive.
theological_decisions:
- issue: Nature de l’image de la « cité »
  choice: Conserver « cité » sans l’identifier davantage dans le texte principal.
  alternative: « le ciel », « la cité céleste » ou « la Jérusalem céleste »
  rationale: Le verset oppose une cité qui ne demeure pas ici à celle qui est à venir. Bien que l’épître développe ailleurs l’image de la cité céleste, préciser ici « ciel » ou « Jérusalem » irait au-delà de la formulation du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique du grec est conservée. « Cité » garde l’image biblique concrète, tandis que « qui demeure » et « qui est à venir » préservent le parallélisme des deux participes.
