id: HEB.13.22
reference: Hebrews 13:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: fr
  text: Je vous en prie, frères[a], accueillez avec patience cette parole d’exhortation[b], car je ne vous ai écrit que brièvement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères », terme qui peut désigner inclusivement toute l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: « Parole d’exhortation » peut aussi se traduire par « message d’encouragement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Je vous en prie
  rationale: Dans cette demande personnelle, παρακαλέω exprime un appel pressant. « Je vous en prie » est naturel en français et conserve le ton earnest sans devenir autoritaire.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici une transition légère. Le français n’exige pas de connecteur explicite, et « mais » suggérerait un contraste trop fort.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif grec est grammaticalement masculin. Le texte principal en garde la forme, tandis qu’une note signale sa possible portée inclusive pour toute l’assemblée.
- source_word: ἀνέχεσθε
  choice: accueillez avec patience
  rationale: ἀνέχομαι demande ici aux destinataires de recevoir patiemment le message. Cette formulation transmet mieux le sens contextuel que le plus négatif « supportez ».
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: cette parole d’exhortation
  rationale: λόγος désigne le message communiqué, et παράκλησις peut associer exhortation et encouragement. « Cette » explicite naturellement en français le renvoi contextuel à l’écrit présent, sans modifier son référent.
- source_word: καὶ γὰρ
  choice: car
  rationale: L’ensemble introduit la justification de la demande. « Car » en restitue sobrement la valeur explicative.
- source_word: διὰ βραχέων
  choice: brièvement
  rationale: L’expression idiomatique signifie « en peu de mots » ou « brièvement ».
- source_word: ἐπέστειλα ὑμῖν
  choice: je ne vous ai écrit
  rationale: Le passé composé convient à une lettre désormais reçue par les lecteurs. Avec « que brièvement », la négation restrictive rend naturellement l’idée de brièveté sans nier l’acte d’écrire.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί
  choice: frères
  alternative: frères et sœurs
  rationale: La forme masculine du grec est conservée dans le texte, sans exclure que l’adresse vise l’ensemble d’une assemblée mixte; cette possibilité est indiquée en note.
- issue: Nuance de παράκλησις
  choice: exhortation
  alternative: encouragement
  rationale: Le contexte appelle les destinataires à recevoir un message qui les presse et les fortifie. « Exhortation » garde la force de l’appel, tandis que la nuance d’encouragement est préservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement pluriel reflète l’adresse à la communauté. La phrase demeure concise, avec une demande chaleureuse plutôt qu’un ordre abrupt.
