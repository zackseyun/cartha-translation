id: HEB.13.18
reference: Hebrews 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: fr
  text: Priez pour nous, car nous sommes convaincus d’avoir une bonne conscience[a], puisque nous voulons bien nous conduire en toutes choses.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «une conscience tranquille».
    reason: lexical_alternative
  - marker: b
    text: Ou «désirant nous conduire honorablement en toutes choses».
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Priez
  rationale: L’impératif présent à la deuxième personne du pluriel appelle à la prière; «Priez» est naturel en français et n’explicite pas excessivement l’aspect continu possible.
- source_word: περὶ ἡμῶν
  choice: pour nous
  rationale: Avec le verbe prier, περί suivi du génitif se rend idiomatiquement par «pour».
- source_word: πειθόμεθα
  choice: nous sommes convaincus
  rationale: Cette formulation conserve la force cognitive de πείθω et exprime une conviction établie, sans la réduire à une simple assurance subjective.
- source_word: καλὴν συνείδησιν
  choice: une bonne conscience
  rationale: Traduction directe qui préserve l’adjectif général καλὴν; «la conscience tranquille» serait plus idiomatique, mais aussi plus interprétatif.
- source_word: ἔχομεν
  choice: avoir
  rationale: L’infinitif français dépend de «sommes convaincus de» et rend simplement le présent grec «nous avons».
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Expression française compréhensible et digne qui conserve la portée globale du pluriel neutre grec.
- source_word: καλῶς
  choice: bien
  rationale: L’adverbe «bien» garde la largeur sémantique de καλῶς; «honorablement» préciserait davantage le sens moral.
- source_word: θέλοντες
  choice: puisque nous voulons
  rationale: Le participe présent exprime ici vraisemblablement la disposition qui explique ou caractérise l’affirmation précédente; la proposition française en clarifie naturellement le rapport.
- source_word: ἀναστρέφεσθαι
  choice: nous conduire
  rationale: Le verbe concerne la conduite ou la manière de vivre; «nous conduire» en préserve la nuance éthique dans un français naturel.
theological_decisions:
- issue: Rapport de la proposition participiale finale avec l’affirmation d’une bonne conscience
  choice: 'Rapport explicatif ou causal: «puisque nous voulons bien nous conduire en toutes choses»'
  alternative: 'Rapport plus formel et moins explicité: «désirant bien nous conduire en toutes choses»'
  rationale: Le participe θέλοντες permet plusieurs nuances circonstancielles. «Puisque» rend intelligible le lien probable sans transformer la déclaration en prétention à une conduite parfaite ou sans péché.
translation_notes:
  register: Français international moderne, clair et digne. «Bonne conscience» conserve la formulation grecque, tandis que «bien nous conduire» exprime naturellement la dimension éthique de ἀναστρέφεσθαι. Les notes signalent les principales possibilités lexicales et syntaxiques sans imposer une lecture confessionnelle.
