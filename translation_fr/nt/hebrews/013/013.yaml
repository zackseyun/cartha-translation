  variant: modern international French
source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: fr
  text: Ainsi donc, sortons du camp pour aller vers lui[a], en portant son opprobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hors du campement ». Cette expression rappelle les sacrifices de Lévitique 16 et le rejet subi par Jésus hors de la ville.
    reason: Alternative lexicale et arrière-plan intertextuel.
lexical_decisions:
- source_word: τοίνυν
  choice: Ainsi donc
  rationale: Cette particule marque la conclusion tirée de l’argument précédent, notamment des versets 11–12. « Ainsi donc » rend clairement cette valeur déductive en français naturel.
- source_word: ἐξερχώμεθα
  choice: sortons
  rationale: Le subjonctif présent à la première personne du pluriel a ici une valeur exhortative. « Sortons » la restitue directement, sans tournure archaïque.
- source_word: πρὸς αὐτὸν
  choice: vers lui
  rationale: πρός suivi de l’accusatif exprime un mouvement en direction d’une personne. « Vers lui » préserve explicitement cette orientation.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: hors du camp
  rationale: παρεμβολή peut désigner un camp ou un campement. « Hors du camp » conserve l’image cultuelle et biblique développée dans les versets précédents.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: son opprobre
  rationale: ὀνειδισμός désigne l’opprobre, le déshonneur ou les insultes subies. « Son opprobre » conserve la formulation possessive du grec ainsi que sa portée sociale et théologique, sans expliciter davantage la relation.
- source_word: φέροντες
  choice: en portant
  rationale: Le participe présent décrit l’action qui accompagne la sortie vers lui. « En portant » préserve l’image concrète et la valeur durative, sans la réduire à la seule idée d’endurer.
theological_decisions:
- issue: Référent de « lui »
  choice: Conserver le pronom, dont le référent est Jésus dans le contexte immédiat de 13.12.
  alternative: Remplacer le pronom par « Jésus ».
  rationale: Le grec emploie un pronom et le contexte en indique clairement le référent. Le conserver évite une explicitation inutile.
- issue: Sens de « hors du camp »
  choice: Maintenir l’image du camp dans sa forme concrète.
  alternative: Paraphraser par « hors de l’institution religieuse » ou « hors de la communauté ».
  rationale: L’expression évoque les sacrifices lévitiques et l’exclusion subie par Jésus. Une paraphrase trancherait la portée de l’image et en réduirait la richesse intertextuelle.
- issue: Portée de « son opprobre »
  choice: Conserver le possessif et l’ambiguïté relationnelle du grec.
  alternative: Préciser « les insultes dirigées contre lui » ou « le déshonneur qu’il a subi ».
  rationale: Le texte appelle les croyants à s’associer à l’opprobre de Jésus, mais ne développe pas grammaticalement le type exact de relation exprimé par le possessif. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et exhortatif. « Opprobre » est un terme soutenu mais encore intelligible; il conserve mieux que des paraphrases l’idée conjointe de honte publique, d’insulte et de rejet. Le marqueur de note est placé après « camp », expression qu’il explique.
