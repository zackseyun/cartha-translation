base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: fr
  text: Que l’amour fraternel demeure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour entre frères et sœurs dans la foi » ; le terme grec désigne l’affection familiale au sein de la communauté croyante, et non uniquement l’amour entre hommes.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: l’amour fraternel
  rationale: Le nom grec désigne l’affection propre aux frères et sœurs et, dans l’usage chrétien ancien, l’amour familial entre membres de la communauté croyante. « Amour fraternel » conserve cette métaphore familiale en français naturel.
- source_word: μενέτω
  choice: demeure
  rationale: Le présent impératif de μένω appelle au maintien continu d’une réalité déjà présente. « Que… demeure » exprime à la fois l’exhortation et la durée.
- source_word: Ἡ
  choice: l’
  rationale: L’article défini présente cet amour fraternel comme une vertu reconnue des destinataires; le français le rend naturellement par l’article défini élidé.
theological_decisions:
- issue: Portée de φιλαδελφία et langage familial genré
  choice: « amour fraternel » dans le texte, avec une note précisant sa portée inclusive
  alternative: « amour entre croyants » ou « affection familiale entre croyants »
  rationale: La formulation retenue préserve l’image familiale du grec sans limiter le commandement aux hommes. La note prévient une lecture moderne trop étroite.
translation_notes:
  register: Formulation brève, digne et courante. « Demeure » garde la nuance de continuité et le ton exhortatif du grec; « amour fraternel » est idiomatique tout en conservant la métaphore familiale.
