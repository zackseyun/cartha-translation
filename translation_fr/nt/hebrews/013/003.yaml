source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: fr
  text: Souvenez-vous de ceux qui sont en prison[a], comme si vous étiez enchaînés avec eux, et de ceux qui sont maltraités, puisque vous aussi êtes dans un corps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec évoque littéralement le fait d’être liés avec les prisonniers, ou liés à eux.
    reason: lexical_alternative
  - marker: b
    text: Ou, peut-être, « dans le corps », au sens d’appartenir au corps du Christ. Il est toutefois plus probable qu’il s’agisse ici de la condition corporelle commune et de sa vulnérabilité.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Souvenez-vous
  rationale: L’impératif présent appelle à une attention durable. « Souvenez-vous » est naturel en français et peut inclure l’idée de garder activement à l’esprit.
- source_word: τῶν δεσμίων
  choice: de ceux qui sont en prison
  rationale: δέσμιος désigne une personne liée ou détenue. Cette formulation moderne exprime clairement la situation, tandis que l’image des liens est reprise dans la proposition suivante.
- source_word: ὡς συνδεδεμένοι
  choice: comme si vous étiez enchaînés avec eux
  rationale: Le participe évoque littéralement le fait d’être lié avec quelqu’un. Cette formulation rend à la fois l’image concrète et l’identification solidaire demandée.
- source_word: τῶν κακουχουμένων
  choice: de ceux qui sont maltraités
  rationale: Le participe passif désigne des personnes qui subissent de mauvais traitements ou l’oppression de la part d’autrui.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: puisque vous aussi, vous êtes dans un corps
  rationale: La traduction conserve l’expression littérale « dans un corps » et rend la valeur motivante de ὡς dans le contexte. Elle évoque principalement la vulnérabilité corporelle commune sans effacer une possible résonance ecclésiale.
theological_decisions:
- issue: Sens de ἐν σώματι (« dans un corps »)
  choice: La condition corporelle et la vulnérabilité humaines partagées
  alternative: L’appartenance au corps du Christ
  rationale: Le contexte immédiat invite à s’identifier aux détenus et aux personnes maltraitées en raison d’une commune exposition corporelle à la souffrance. La formulation littérale maintient toutefois l’ouverture à une éventuelle résonance communautaire.
translation_notes:
  register: Français international actuel, digne et accessible. « Enchaînés avec eux » conserve l’image grecque des liens; « dans un corps » préserve l’ambiguïté interprétative sans imposer une lecture confessionnelle.
