source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: fr
  text: 'Ainsi, avec assurance, nous pouvons dire : « Le Seigneur est mon secours ; je n’aurai pas peur. Que peut me faire un être humain[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Que me fera un être humain ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit ici la conséquence de l’affirmation précédente. « Ainsi » exprime naturellement cette valeur consécutive et inférentielle en français.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: avec assurance, nous pouvons dire
  rationale: Le participe θαρροῦντας exprime l’assurance ou le courage avec lesquels les destinataires parlent. La tournure « nous pouvons dire » rend naturellement en français la construction consécutive avec ὥστε et l’infinitif.
- source_word: Κύριος
  choice: Le Seigneur
  rationale: Rend le titre divin de manière usuelle, claire et digne.
- source_word: ἐμοὶ βοηθός
  choice: mon secours
  rationale: Le datif ἐμοὶ indique une aide accordée au locuteur. « Mon secours » conserve la formulation nominale, concise et solennelle de la citation, même si βοηθός peut aussi désigner personnellement « celui qui vient en aide ».
- source_word: οὐ φοβηθήσομαι
  choice: je n’aurai pas peur
  rationale: Rend directement le futur de φοβέομαι dans un français moderne et naturel.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Que peut me faire un être humain ?
  rationale: La question rhétorique exprime l’impuissance ultime de tout adversaire humain. Le présent modal français « peut » en communique naturellement la portée ; la note conserve le futur formel du grec. « Un être humain » rend sans ambiguïté le singulier générique ἄνθρωπος.
theological_decisions:
- issue: Portée générique de ἄνθρωπος
  choice: un être humain
  alternative: un homme
  rationale: Dans ce contexte, ἄνθρωπος désigne de façon représentative tout être humain, et non spécifiquement un individu de sexe masculin. La traduction choisie préserve cette portée générique sans ajouter d’interprétation doctrinale.
- issue: Valeur du futur rhétorique ποιήσει
  choice: Que peut me faire un être humain ?
  alternative: Que me fera un être humain ?
  rationale: Le verbe grec est au futur, mais la question est rhétorique et nie la capacité réelle d’un adversaire humain à inspirer une crainte ultime. « Peut » exprime cette force idiomatiquement en français, tandis que la note signale la forme plus littérale.
- issue: Nature de l’aide divine dans βοηθός
  choice: Le Seigneur est mon secours
  alternative: Le Seigneur est celui qui me vient en aide
  rationale: « Mon secours » maintient la forme prédicative et la concision de la citation. Il ne réduit pas l’aide à une abstraction, puisque le sujet personnel demeure « le Seigneur ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le rythme solennel de la citation tout en employant des formulations courantes. Les guillemets français et les espaces typographiques suivent l’usage éditorial français.
