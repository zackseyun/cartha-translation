id: HEB.13.12
reference: Hebrews 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: fr
  text: C’est pourquoi Jésus, lui aussi, a souffert hors de la porte[b], afin de sanctifier le peuple par son propre sang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendre saint » ou « consacrer », pour « sanctifier ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « hors de la porte » désigne probablement le lieu situé à l’extérieur de Jérusalem où Jésus a souffert et fait écho aux restes des sacrifices brûlés hors du camp dans le contexte précédent.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Cette locution marque naturellement en français la conséquence tirée de l’argument précédent.
- source_word: καὶ
  choice: lui aussi
  rationale: Cette formulation rattache explicitement Jésus au modèle sacrificiel évoqué auparavant, sans donner à la particule une emphase excessive.
- source_word: ἵνα ἁγιάσῃ
  choice: afin de sanctifier
  rationale: La construction exprime le but. « Sanctifier » conserve la portée cultuelle et théologique du verbe tout en restant intelligible en français actuel.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: par son propre sang
  rationale: « Par » exprime ici le moyen, tandis que « son propre » préserve l’insistance de ἰδίου et l’image sacrificielle.
- source_word: τὸν λαόν
  choice: le peuple
  rationale: Le grec est défini mais ne précise pas explicitement « de Dieu » ; la traduction évite donc d’ajouter cette interprétation au texte.
- source_word: ἔξω τῆς πύλης
  choice: hors de la porte
  rationale: Le singulier du grec est conservé. Dans le contexte, il s’agit de la porte de la ville, mais « ville » n’est pas exprimé dans le texte source.
- source_word: ἔπαθεν
  choice: a souffert
  rationale: Rendu direct de l’aoriste de πάσχω, naturel et fidèle en français.
theological_decisions:
- issue: Rendu de ἁγιάζω dans un contexte sacrificiel
  choice: sanctifier
  alternative: rendre saint ; consacrer
  rationale: « Sanctifier » maintient le registre cultuel et conventionnel de l’épître sans réduire le terme à une transformation seulement morale ni imposer une doctrine confessionnelle particulière.
- issue: Étendue de τὸν λαόν
  choice: le peuple
  alternative: le peuple de Dieu
  rationale: Le contexte indique probablement le peuple de l’alliance, mais le grec dit seulement « le peuple » ; la formulation retenue préserve cette sobriété.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le lien logique avec le contexte, le parallèle sacrificiel et l’ordre rhétorique général du grec. Les marqueurs [a] et [b] figurent tous deux dans le texte principal, placés auprès des expressions qu’ils expliquent.
