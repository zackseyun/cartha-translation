id: HEB.13.7
reference: Hebrews 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: fr
  text: Souvenez-vous de vos responsables, qui vous ont annoncé la parole de Dieu. Considérez attentivement l’issue[a] de leur manière de vivre et imitez leur foi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Issue » peut aussi se traduire par « fin »; selon certaines interprétations, le mot désigne plus précisément la manière dont ces responsables sont morts.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur fidélité ». Le mot grec peut désigner la foi ou la fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Souvenez-vous
  rationale: L’impératif présent appelle à garder ces personnes en mémoire. « Souvenez-vous » est naturel en français et peut exprimer cette démarche durable dans le contexte.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: de vos responsables
  rationale: Le terme désigne les personnes qui exerçaient une fonction reconnue de direction dans la communauté. « Responsables » exprime cette autorité sans connotation politique excessive.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: qui vous ont annoncé la parole de Dieu
  rationale: « Annoncé » rend naturellement l’acte de communiquer la parole de Dieu sans préciser indûment qu’il s’agissait d’une proclamation publique. L’expression biblique « la parole de Dieu » conserve la construction du grec.
- source_word: ἀναθεωροῦντες
  choice: Considérez attentivement
  rationale: Le participe évoque une observation réfléchie et soutenue, et non un simple regard. Une proposition impérative coordonnée produit une phrase française claire tout en maintenant le lien avec l’exhortation principale.
- source_word: τὴν ἔκβασιν
  choice: l’issue
  rationale: « Issue » peut désigner l’aboutissement ou la fin de leur parcours sans affirmer explicitement que le texte vise leur mort ou leur martyre.
- source_word: τῆς ἀναστροφῆς
  choice: de leur manière de vivre
  rationale: L’expression désigne la conduite ou le comportement manifesté au cours de la vie. « Manière de vivre » est actuelle, claire et assez large pour inclure les actes comme l’orientation générale de l’existence.
- source_word: μιμεῖσθε
  choice: imitez
  rationale: Ce verbe rend directement l’impératif grec et conserve la force de l’appel à prendre ces responsables pour modèles.
- source_word: τὴν πίστιν
  choice: leur foi
  rationale: « Foi » est le rendu français usuel de πίστις. Dans ce contexte humain, le mot grec peut aussi évoquer la fidélité; cette possibilité est conservée en note.
theological_decisions:
- issue: Sens de πίστις comme qualité humaine à imiter
  choice: leur foi
  alternative: leur fidélité
  rationale: Les lecteurs sont appelés à imiter ce qui caractérisait leurs responsables. Le grec permet ici de comprendre soit leur foi, soit leur fidélité. Le texte principal retient le sens usuel « foi », tandis que la note préserve l’autre lecture possible.
- issue: Portée de ἔκβασις et possible allusion à la mort des responsables
  choice: l’issue
  alternative: la fin, éventuellement la manière dont ils sont morts
  rationale: Le terme peut désigner l’aboutissement de leur parcours et certains l’appliquent plus précisément à leur mort. « Issue » conserve cette amplitude sans introduire dans le texte une mort ou un martyre qui ne sont pas explicitement mentionnés.
translation_notes:
  register: Français international moderne, digne et accessible. « Responsables » convient mieux au cadre communautaire que « dirigeants » ou « chefs », qui peuvent paraître plus politiques ou autoritaires. La syntaxe en deux phrases rend clairement les exhortations sans effacer la relation logique portée par le participe grec.
