source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: fr
  text: Laissez-vous convaincre par vos responsables et cédez-leur[a], car ils veillent sur vos âmes comme devant en rendre compte, afin qu’ils le fassent avec joie et non en gémissant ; cela ne vous serait d’aucun profit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Obéissez à vos responsables et soumettez-vous à eux. » Le grec traduit par « laissez-vous convaincre » peut aussi avoir le sens d’« obéir », tandis que le second verbe signifie céder ou se soumettre.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: Πείθεσθε
  choice: Laissez-vous convaincre par
  rationale: L’impératif moyen-passif peut exprimer le fait de se laisser persuader et, par extension, d’obéir. Cette formulation conserve la nuance relationnelle sans réduire l’exhortation à une simple exécution d’ordres; l’autre sens plausible est signalé en note.
- source_word: ἡγουμένοις
  choice: vos responsables
  rationale: Le participe désigne ici les personnes reconnues qui conduisent la communauté. « Responsables » est courant en français moderne et n’ajoute pas une idée autoritaire étrangère au terme.
- source_word: ὑπείκετε
  choice: cédez-leur
  rationale: Le verbe exprime l’idée de céder, de faire place ou de s’en remettre à quelqu’un. « Cédez-leur » maintient une distinction avec Πείθεσθε, même si la tournure est volontairement soutenue.
- source_word: ἀγρυπνοῦσιν
  choice: ils veillent
  rationale: Le verbe évoque littéralement une vigilance qui tient éveillé. « Veillent » conserve cette image et convient naturellement à la responsabilité pastorale.
- source_word: ψυχῶν
  choice: âmes
  rationale: ψυχή peut désigner l’âme, la vie ou la personne. « Âmes » préserve ici le poids spirituel de l’expression sans exclure la personne dans son ensemble.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: comme devant en rendre compte
  rationale: La formulation rend la responsabilité future des responsables et conserve le caractère comparatif ou qualificatif de ὡς avec le participe futur.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Rendu direct et naturel de la locution prépositionnelle grecque.
- source_word: στενάζοντες
  choice: en gémissant
  rationale: Cette traduction garde l’image concrète du gémissement plutôt que de l’atténuer en simple tristesse.
- source_word: ἀλυσιτελὲς
  choice: d’aucun profit
  rationale: L’adjectif signifie « sans avantage » ou « sans bénéfice ». Cette expression française reste proche du sens sans l’intensifier en « nuisible ».
theological_decisions:
- issue: Nature de l’exhortation envers les responsables de la communauté
  choice: Le texte appelle à se laisser convaincre et à céder aux responsables reconnus, dans le cadre de leur vigilance et de leur responsabilité devant Dieu.
  alternative: Traduire comme un ordre d’obéissance absolue aux responsables.
  rationale: Les deux verbes Πείθεσθε et ὑπείκετε expriment une disposition réceptive et conciliante, mais ne justifient pas de renforcer le texte en une soumission sans réserve. La motivation donnée est la vigilance de responsables qui devront rendre compte.
- issue: Référent de τοῦτο dans la dernière proposition
  choice: Conserver le démonstratif général « cela ».
  alternative: L’expliciter comme « leur tâche accomplie en gémissant » ou comme « votre refus de céder ».
  rationale: Le grec laisse au démonstratif un référent contextuel qui peut englober la situation précédente. « Cela » préserve cette relative indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. « Responsables » convient à des dirigeants reconnus d’une communauté sans préciser une fonction ecclésiastique particulière. La phrase a été divisée en deux pour préserver sa clarté, et « cette tâche » reprend naturellement l’activité de vigilance mentionnée auparavant.
