  source_fidelity: 'Le sens général est fidèlement rendu : les deux impératifs sont distingués, la vigilance exercée « sur vos âmes », la responsabilité de rendre compte, ainsi que le contraste entre joie et gémissement sont conservés. Toutefois, « Ainsi, qu’ils puissent accomplir cette tâche » transforme légèrement la subordonnée finale ἵνα… ποιῶσιν (« afin qu’ils fassent cela ») en souhait et ajoute « cette tâche », qui n’est pas exprimé dans le grec.'
