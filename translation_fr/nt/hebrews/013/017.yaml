  terminology: « Responsables » est un bon équivalent non confessionnel de ἡγούμενοι. « Laissez-vous convaincre » préserve la nuance de Πείθεσθε, tandis que « cédez-leur » maintient la distinction avec ὑπείκετε, quoique dans un registre légèrement soutenu. « Âmes » reflète de manière recevable ψυχῶν dans ce contexte. La note conserve à juste titre l’alternative plus forte « obéissez ».
