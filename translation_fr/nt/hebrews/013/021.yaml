source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: fr
  text: qu’il vous rende aptes à accomplir sa volonté en toute bonne chose, en produisant en nous ce qui est agréable à ses yeux par Jésus le Messie, à qui[a] soit la gloire pour toujours. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « À qui » peut désigner précisément Jésus le Messie ; selon une autre compréhension, ces mots renvoient au Dieu de paix, sujet de la prière.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: qu’il vous rende aptes
  rationale: Dans cette prière de bénédiction, le verbe demande que Dieu prépare pleinement les croyants et leur donne la capacité nécessaire pour obéir. « Rendre aptes » exprime naturellement cette idée sans imposer le sens contextuellement moins probable de « restaurer ».
- source_word: ἐν παντὶ ἀγαθῷ
  choice: à tout ce qui est bon
  rationale: Cette formulation reste proche du grec tout en étant naturelle après « rendre aptes ». Elle évite d’ajouter « œuvre », absent du texte retenu.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: pour faire sa volonté
  rationale: « Pour faire » restitue simplement la valeur de but de l’infinitif articulé, et « sa volonté » correspond directement à θέλημα αὐτοῦ.
- source_word: ποιῶν ἐν ἡμῖν
  choice: produisant en nous
  rationale: Le participe décrit l’action de Dieu qui fait naître ou accomplit intérieurement chez les croyants ce qui lui plaît. « Produisant » conserve le lien participial et distingue cette action du premier « faire ».
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: ce qui lui est agréable
  rationale: Cette tournure idiomatique exprime ce qui est plaisant aux yeux de Dieu sans la lourdeur de « agréable devant lui ».
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: διά avec le génitif indique ici la médiation. Χριστός garde sa valeur de titre messianique dans cette bénédiction et est donc rendu par « le Messie ».
- source_word: ᾧ ἡ δόξα
  choice: à qui soit la gloire
  rationale: La proposition relative doxologique est conservée sans expliciter son antécédent, afin de ne pas trancher l’ambiguïté du grec.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: L’expression idiomatique désigne une durée sans fin. « Pour toujours » est clair, digne et n’ajoute pas une répétition absente du grec.
theological_decisions:
- issue: Antécédent de ᾧ (« à qui ») dans la doxologie
  choice: Conserver la proposition relative « à qui soit la gloire » et signaler l’ambiguïté.
  alternative: Préciser que la gloire revient soit à Jésus le Messie, soit au Dieu de paix qui demeure le sujet de la prière.
  rationale: Le relatif peut se rapporter au nom le plus proche, Jésus le Messie, mais il peut aussi reprendre Dieu, sujet principal de la bénédiction. Le français conserve cette tension sans la résoudre.
translation_notes:
  register: Français international actuel, naturel et digne. La structure de bénédiction est maintenue, avec un vocabulaire accessible. Le participe « produisant » préserve le mouvement syntaxique du grec, tandis que la note garde ouverte l’ambiguïté de la doxologie.
