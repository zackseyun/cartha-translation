id: HEB.13.15
reference: Hebrews 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: fr
  text: Par lui, offrons donc sans cesse[a] à Dieu un sacrifice de louange, c’est-à-dire le fruit de lèvres[b] qui confessent son nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « continuellement » ou « en tout temps ».
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions précisent « le fruit de nos lèvres », mais « nos » n’est pas exprimé dans le grec.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui reconnaissent son nom ». Le verbe grec peut désigner une confession ou une reconnaissance déclarée publiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: Par lui
  rationale: διά avec le génitif exprime ici le moyen ou la médiation. « Par lui » est naturel en français et conserve la portée médiatrice du contexte sans expliciter le référent dans le texte.
- source_word: οὖν
  choice: donc
  rationale: La particule marque la conséquence tirée de l’exposé précédent. « Donc » rend clairement ce lien logique.
- source_word: ἀναφέρωμεν
  choice: offrons
  rationale: Le subjonctif présent à la première personne du pluriel a une valeur exhortative. « Offrons » la restitue naturellement et garde la nuance cultuelle du verbe.
- source_word: θυσίαν αἰνέσεως
  choice: un sacrifice de louange
  rationale: Cette formulation idiomatique conserve à la fois la métaphore sacrificielle et l’écho scripturaire.
- source_word: διὰ παντός
  choice: sans cesse
  rationale: L’expression signifie « continuellement » ou « en tout temps ». « Sans cesse » est concise et naturelle dans cette exhortation.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif désigne le destinataire de l’offrande.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: La formule introduit l’explication de ce qui constitue le sacrifice de louange.
- source_word: καρπὸν χειλέων
  choice: le fruit de lèvres
  rationale: Le choix conserve la métaphore et son arrière-plan scripturaire. Le possessif « nos » n’est pas exprimé dans le grec.
- source_word: ὁμολογούντων
  choice: qui reconnaissent ouvertement
  rationale: Le participe qualifie les lèvres et évoque une confession ou reconnaissance déclarée. Cette formulation française rend la dimension publique sans lui donner le sens moderne d’un aveu de faute.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: son nom
  rationale: Après ὁμολογέω, le datif est rendu idiomatiquement comme complément direct en français. « Son nom » désigne la personne telle qu’elle est publiquement reconnue.
theological_decisions:
- issue: Référent de « lui » dans δι’ αὐτοῦ
  choice: 'Le pronom renvoie au Christ et conserve le sens de médiation : la louange est offerte à Dieu par lui.'
  alternative: Expliciter « par Jésus » ou laisser le pronom sans relever sa portée médiatrice.
  rationale: Le contexte immédiat, notamment les versets précédents, désigne Jésus et sa médiation. Garder le pronom respecte la formulation grecque sans ajouter un nom absent du verset.
- issue: Portée du langage sacrificiel
  choice: Conserver « offrons » et « un sacrifice de louange ».
  alternative: Aplanir l’image en traduisant simplement « louons Dieu ».
  rationale: Le verset présente délibérément la louange sous une forme sacrificielle. Maintenir cette image préserve la continuité conceptuelle développée dans l’épître sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exhortative reste fluide, tandis que les images bibliques de l’offrande, du sacrifice et du fruit des lèvres sont conservées. « Reconnaissent ouvertement » évite que « confessent » soit compris uniquement comme l’aveu d’une faute.
