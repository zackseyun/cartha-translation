id: HEB.13.8
reference: Hebrews 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: fr
  text: Jésus le Messie est le même hier, aujourd’hui et pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ est le même hier, aujourd’hui et pour toujours. » Le titre grec Χριστός peut être rendu par « Christ » ou traduit par « Messie ».
    reason: Signaler l’autre rendu français traditionnel du titre grec sans effacer sa valeur messianique.
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et courante du nom propre grec.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le titre grec Χριστός désigne l’Oint, le Messie. En français, l’article rend le titre naturel après le nom « Jésus », sans en faire un simple nom de famille.
- source_word: ἐχθὲς
  choice: hier
  rationale: Adverbe temporel direct, conservé dans la séquence qui souligne la continuité.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent français direct, mis en parallèle avec « hier ».
- source_word: ὁ αὐτός
  choice: est le même
  rationale: L’expression prédicative grecque signifie « le même » ; le verbe « est » est nécessaire en français.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Expression française naturelle de la durée perpétuelle indiquée par la locution grecque, préférable ici au calque « pour les siècles ».
- source_word: καὶ … καὶ … καὶ
  choice: …, … et …
  rationale: La coordination temporelle est rendue selon l’usage français naturel ; la série « hier, aujourd’hui et pour toujours » conserve le rythme et la progression du grec sans répéter artificiellement toutes les conjonctions.
theological_decisions:
- issue: Portée christologique de l’affirmation sur la constance de Jésus
  choice: Affirmer simplement que Jésus le Messie demeure le même à travers le temps.
  alternative: Développer explicitement une doctrine de l’immutabilité ou de la divinité du Christ.
  rationale: Le verset peut soutenir de telles conclusions théologiques, mais la traduction ne doit pas ajouter au texte une explication doctrinale qu’il n’énonce pas directement.
- issue: Valeur de Χριστός
  choice: Traduire le titre par « le Messie ».
  alternative: Transcrire le titre sous la forme traditionnelle « Christ ».
  rationale: « Messie » rend explicitement le sens titulaire de Χριστός, tandis que la note conserve l’autre formulation française traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la brièveté, le parallélisme temporel et l’ambiguïté légitime du titre Χριστός.
