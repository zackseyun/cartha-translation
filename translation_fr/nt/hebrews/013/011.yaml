id: HEB.13.11
reference: Hebrews 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: fr
  text: En effet, les corps des animaux dont le sang est apporté dans les lieux saints[a] pour le péché par le grand prêtre sont entièrement brûlés[b] hors du camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le sanctuaire ». Le grec dit littéralement « dans les lieux saints », expression cultuelle désignant l’espace sacré du sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « sont entièrement consumés par le feu ». Le verbe grec peut souligner que les corps sont complètement brûlés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: le corps des animaux dont…
  rationale: La construction relative suivie de la reprise démonstrative désigne collectivement les animaux sacrifiés. Le singulier collectif « le corps » rend naturellement en français l’accord singulier du verbe grec, tout en gardant explicite l’antécédent.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ explique et justifie l’affirmation précédente. « En effet » marque clairement ce lien dans un français actuel et soutenu.
- source_word: εἰσφέρεται
  choice: est apporté dans
  rationale: Le présent passif décrit l’introduction rituelle du sang dans l’espace sacré; « est apporté » exprime naturellement cette action et l’agence est ensuite indiquée par « par le grand prêtre ».
- source_word: τὸ αἷμα
  choice: le sang
  rationale: Le terme a son sens concret et sacrificiel; aucune paraphrase n’est nécessaire.
- source_word: περὶ ἁμαρτίας
  choice: pour le péché
  rationale: Cette formulation conserve la relation large au péché sans préciser davantage « en sacrifice pour le péché », interprétation possible mais plus étroite que l’expression grecque elle-même.
- source_word: εἰς τὰ ἅγια
  choice: dans les lieux saints
  rationale: Le pluriel substantivé désigne l’espace sacré du sanctuaire. « Les lieux saints » préserve le pluriel et évite de limiter indûment la référence au seul lieu très saint.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: par le grand prêtre
  rationale: διά avec le génitif exprime ici l’agent de l’action passive; « par » est la tournure française naturelle.
- source_word: κατακαίεται
  choice: est entièrement brûlé
  rationale: Le composé κατακαίω peut exprimer une combustion complète. « Entièrement brûlé » conserve cette force lexicale sans lourdeur.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: hors du camp
  rationale: « Le camp » est le terme consacré et précis pour le campement d’Israël évoqué par le cadre rituel; « hors de » convient au registre biblique tout en restant courant.
theological_decisions:
- issue: Portée cultuelle de εἰς τὰ ἅγια
  choice: dans les lieux saints
  alternative: dans le sanctuaire; dans le lieu très saint
  rationale: Dans Hébreux, τὰ ἅγια peut désigner avec une certaine souplesse le domaine sacré du sanctuaire. Le texte évoque le rituel d’expiation, mais ne contraint pas ici à la désignation plus étroite « lieu très saint ».
- issue: Sens de περὶ ἁμαρτίας
  choice: pour le péché
  alternative: en sacrifice pour le péché
  rationale: La traduction retenue préserve la relation sacrificielle au péché sans transformer explicitement la locution en nom technique d’un type d’offrande.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le lien explicatif avec le contexte et le vocabulaire cultuel sans archaïsme inutile. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
