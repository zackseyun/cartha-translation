  source_fidelity: 'La traduction rend fidèlement les éléments essentiels : γάμος (« mariage »), ἐν πᾶσιν (« par tous »), κοίτη (« lit conjugal »), ἀμίαντος (« sans souillure »), la distinction entre πόρνοι et μοιχοί, ainsi que le futur κρινεῖ (« jugera »). La lecture exhortative est légitime dans le contexte et l’ambiguïté syntaxique de la première proposition est correctement signalée. Toutefois, « reste sans souillure » introduit légèrement l’idée de demeurer dans un état antérieur, absente du grec verbless ; « soit sans souillure » reproduit plus exactement le parallélisme exhortatif retenu.'
