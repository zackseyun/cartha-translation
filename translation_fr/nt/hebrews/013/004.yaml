  terminology: Les termes principaux sont cohérents et non confessionnels. « Lit conjugal » exprime avec retenue la métonymie sexuelle de κοίτη. « Adultères » maintient la spécificité de μοιχούς, distinct de la catégorie plus large des personnes engagées dans l’immoralité sexuelle. Les deux notes sont correctement ancrées et préservent les alternatives pertinentes.
