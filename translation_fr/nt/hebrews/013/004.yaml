source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: fr
  text: Que le mariage soit honoré par tous[a][b], et que le lit conjugal soit sans souillure, car Dieu jugera ceux qui se livrent à l’immoralité sexuelle et les adultères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le mariage est digne d’honneur chez tous. » Le grec n’a pas de verbe explicite dans la première proposition ; celle-ci peut donc se comprendre soit comme une exhortation, soit comme une affirmation.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « parmi tous » au lieu de « par tous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: soit honoré
  rationale: Le terme désigne ce qui est précieux, estimé ou digne d’honneur. La tournure « soit honoré » conserve cette nuance et, dans la suite d’exhortations d’Hébreux 13, rend naturellement la valeur exhortative probable.
- source_word: γάμος
  choice: le mariage
  rationale: Dans ce contexte, le mot désigne le mariage comme institution ou état, et non la cérémonie des noces.
- source_word: ἐν πᾶσιν
  choice: par tous
  rationale: Le pluriel renvoie très probablement à des personnes. « Par tous » exprime clairement que tous sont appelés à honorer le mariage, tout en signalant en note l’autre formulation possible.
- source_word: κοίτη
  choice: le lit conjugal
  rationale: Le mot signifie littéralement « lit » et peut désigner par métonymie les relations sexuelles. Associé au mariage, « lit conjugal » transmet clairement et dignement la référence aux relations sexuelles dans le mariage.
- source_word: ἀμίαντος
  choice: reste sans souillure
  rationale: Cette formulation conserve les résonances morales et cultuelles de ce qui est non souillé, pur ou sans tache, dans un français naturel.
- source_word: πόρνους
  choice: ceux qui se livrent à l’immoralité sexuelle
  rationale: Le terme désigne largement les personnes qui pratiquent l’immoralité sexuelle. Cette expression actuelle évite le mot vieilli et potentiellement trop étroit « fornicateurs ».
- source_word: μοιχούς
  choice: les adultères
  rationale: Le terme désigne précisément les personnes qui commettent l’adultère et maintient la distinction avec la catégorie plus large qui précède.
- source_word: κρινεῖ
  choice: jugera
  rationale: Le futur indique un jugement divin à venir. « Jugera » n’anticipe pas l’issue du jugement comme le ferait « condamnera ».
- source_word: γάρ
  choice: car
  rationale: La conjonction introduit la raison qui fonde l’exhortation et « car » en préserve clairement le lien logique.
theological_decisions:
- issue: Valeur déclarative ou exhortative de la première proposition sans verbe explicite
  choice: 'Lecture exhortative : « Que le mariage soit honoré »'
  alternative: 'Lecture déclarative : « Le mariage est digne d’honneur »'
  rationale: Le grec ne contient aucun verbe explicite, de sorte que les deux lectures sont grammaticalement possibles. La succession d’exhortations éthiques en Hébreux 13 favorise ici la lecture exhortative, mais l’ambiguïté réelle est conservée en note.
- issue: Portée de ἐν πᾶσιν
  choice: 'Agent universel : « par tous »'
  alternative: 'Sphère sociale : « parmi tous » ou « chez tous »'
  rationale: La construction peut mettre l’accent soit sur toutes les personnes qui doivent honorer le mariage, soit sur le milieu dans lequel il doit être tenu en honneur. Le texte principal retient la formulation française la plus directe et la variante est donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le ton solennel de l’avertissement, distingue l’immoralité sexuelle au sens large de l’adultère et évite le vocabulaire archaïque.
