  to: Que le mariage soit honoré par tous[a][b], et que le lit conjugal soit sans souillure, car Dieu jugera ceux qui se livrent à l’immoralité sexuelle et les adultères.
  rationale: La seule correction nécessaire remplace « reste » par « soit » afin d’éviter une nuance aspectuelle non exprimée dans le texte grec et de maintenir le parallélisme de l’exhortation française. Les notes, leurs marqueurs et le reste de la formulation sont conservés.
