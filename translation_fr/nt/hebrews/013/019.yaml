id: HEB.13.19
reference: Hebrews 13:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: fr
  text: Et je vous demande avec d’autant plus d’insistance de le faire, afin que je vous sois rendu plus tôt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que je puisse revenir auprès de vous plus tôt ». Le grec évoque le fait d’être rendu aux destinataires ou rétabli auprès d’eux, sans préciser la situation exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: avec d’autant plus d’insistance
  rationale: L’adverbe comparatif renforce la demande. Cette formulation française naturelle conserve à la fois l’intensité et la valeur comparative.
- source_word: δὲ
  choice: Et
  rationale: Ici, δέ assure une liaison légère avec l’exhortation précédente, sans marquer une opposition forte.
- source_word: παρακαλῶ
  choice: je vous demande
  rationale: Dans ce contexte, le verbe exprime une demande pressante. L’intensité est rendue explicitement par « avec d’autant plus d’insistance ».
- source_word: τοῦτο ποιῆσαι
  choice: de le faire
  rationale: Le démonstratif renvoie à la demande de prière formulée juste avant. « Le faire » est idiomatique et conserve ce renvoi.
- source_word: ἵνα
  choice: afin que
  rationale: Cette conjonction exprime ici le but recherché.
- source_word: τάχιον
  choice: plus tôt
  rationale: L’adverbe comparatif signifie « plus vite » ou « plus tôt » ; cette dernière expression convient naturellement à une réunion espérée.
- source_word: ἀποκατασταθῶ
  choice: je vous sois rendu
  rationale: Le passif peut désigner le fait d’être rétabli auprès des destinataires ou de leur être rendu, sans préciser les circonstances. La formulation retenue préserve le passif et cette indétermination.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif désigne les destinataires auprès desquels l’auteur espère être ramené ; la construction « vous être rendu » l’exprime naturellement.
theological_decisions:
- issue: Nature du retour espéré par l’auteur
  choice: Une restitution ou un retour général auprès des destinataires, sans indication de la circonstance exacte
  alternative: Une libération de prison, un retour de voyage, une guérison ou un rétablissement dans le ministère
  rationale: Le grec ἀποκατασταθῶ ὑμῖν ne précise ni la cause de l’absence ni le moyen du retour. La traduction évite donc d’imposer un scénario historique ou théologique particulier.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère personnel et pressant de la demande, tandis que la note maintient l’ambiguïté du verbe grec.
