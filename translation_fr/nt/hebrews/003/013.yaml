id: HEB.3.13
reference: Hebrews 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: fr
  text: 'Mais encouragez-vous les uns les autres[b] chaque jour, tant qu’il est encore possible de dire : « Aujourd’hui »[a], afin qu’aucun de vous ne soit endurci par la tromperie du péché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Aujourd’hui » fait écho au Psaume 95 et désigne le temps présent où il faut répondre à l’appel de Dieu.
    reason: cross_reference
  - marker: b
    text: Ou « exhortez-vous les uns les autres ». Selon le contexte, le verbe grec peut signifier encourager, exhorter, presser ou consoler.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec l’avertissement du verset précédent, dans un français naturel.
- source_word: παρακαλεῖτε
  choice: encouragez-vous
  rationale: Le verbe peut exprimer l’encouragement, l’exhortation ou l’appel pressant. « Encouragez-vous » convient à l’action mutuelle et continue destinée à soutenir la persévérance, tandis qu’une note conserve l’autre nuance principale.
- source_word: ἑαυτοὺς
  choice: les uns les autres
  rationale: Bien que le pronom soit formellement réfléchi, l’impératif pluriel lui donne ici une valeur réciproque, rendue naturellement en français.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: chaque jour
  rationale: Exprime clairement la répétition quotidienne sans alourdir la phrase.
- source_word: ἄχρις οὗ
  choice: aussi longtemps que
  rationale: Met en valeur la durée de la période pendant laquelle l’appel demeure actuel, plutôt qu’un simple terme chronologique.
- source_word: τὸ Σήμερον καλεῖται
  choice: 'il est dit : « Aujourd’hui »'
  rationale: Cette formulation française naturelle conserve la tournure impersonnelle et met « Aujourd’hui » en relief comme expression scripturaire renvoyant au Psaume 95.
- source_word: σκληρυνθῇ
  choice: ne soit endurci
  rationale: Conserve le passif grec et la gravité de l’image biblique sans préciser indûment l’agent du durcissement.
- source_word: τις ἐξ ὑμῶν
  choice: aucun de vous
  rationale: Après la négation introduite par ἵνα μή, cette formulation distributive est fidèle et idiomatique.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: par la tromperie du péché
  rationale: Le datif est compris comme instrumental. « Tromperie » préserve l’idée que le péché égare, sans développer l’image au-delà du grec.
theological_decisions:
- issue: Portée réciproque de l’exhortation
  choice: « les uns les autres »
  alternative: « vous-mêmes »
  rationale: Le contexte communautaire et l’impératif pluriel indiquent une action mutuelle; la traduction évite une lecture purement individuelle.
- issue: Sens de « Aujourd’hui »
  choice: Expression mise entre guillemets et reliée au temps présent de l’appel divin
  alternative: Simple indication du jour courant
  rationale: Le contexte immédiat cite le Psaume 95. Les guillemets signalent l’écho scripturaire sans enfermer l’expression dans une interprétation plus étroite.
- issue: Agent et processus du durcissement
  choice: 'Maintien du passif : « soit endurci »'
  alternative: « s’endurcisse »
  rationale: Le passif grec laisse ouverte la question de l’agent tout en présentant la tromperie du péché comme le moyen du durcissement; cette tension est préservée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le contraste, la réciprocité de l’impératif, l’écho scripturaire d’« Aujourd’hui » et le passif du durcissement.
