  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: fr
  text: 'Pendant quarante ans[a], je me suis donc irrité contre cette génération et j’ai dit : « Ils s’égarent toujours dans leur cœur[b], mais ils n’ont pas connu mes voies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La place de « pendant quarante ans » dans la citation peut aussi permettre de le rattacher à ce qui précède : « Ils ont vu mes œuvres pendant quarante ans. C’est pourquoi… »'
    reason: ambiguïté_syntaxique
  - marker: b
    text: Littéralement « dans le cœur », au singulier ; la génération peut être envisagée ici comme un tout collectif.
    reason: alternative_lexicale
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Pendant quarante ans
  rationale: L’accusatif exprime une durée; « pendant » la rend clairement et naturellement en français.
- source_word: διὸ
  choice: c’est pourquoi
  rationale: Cette locution conserve la valeur consécutive ou inférentielle du connecteur grec.
- source_word: προσώχθισα
  choice: j’ai été profondément irrité
  rationale: Le verbe exprime une vive aversion ou un fort mécontentement. Cette formulation en garde l’intensité sans imposer le sens plus précis de « détester ».
- source_word: τῇ γενεᾷ ταύτῃ
  choice: contre cette génération
  rationale: Après « être irrité », « contre » est idiomatique en français et désigne clairement l’objet du mécontentement.
- source_word: Ἀεὶ πλανῶνται
  choice: Ils s’égarent toujours
  rationale: « S’égarer » rend naturellement l’idée d’une déviation persistante, ici de portée morale et spirituelle.
- source_word: τῇ καρδίᾳ
  choice: dans leur cœur
  rationale: Le singulier grec est conservé; il peut présenter la génération comme une collectivité.
- source_word: αὐτοὶ δὲ οὐκ ἔγνωσαν
  choice: mais ils n’ont pas connu
  rationale: « Mais » exprime le contraste de δέ, tandis que « connaître » préserve la portée potentiellement relationnelle du verbe sans la réduire à la compréhension intellectuelle.
- source_word: τὰς ὁδούς μου
  choice: mes voies
  rationale: « Voies » maintient la métaphore biblique des manières d’agir de Dieu et du chemin qu’il prescrit.
theological_decisions:
- issue: Intensité du mécontentement divin exprimé par προσώχθισα
  choice: j’ai été profondément irrité
  alternative: j’ai été en colère; j’ai pris cette génération en aversion
  rationale: Le choix exprime un mécontentement divin intense sans l’atténuer en simple contrariété ni le préciser excessivement comme de la haine.
- issue: Singulier collectif dans τῇ καρδίᾳ
  choice: dans leur cœur
  alternative: dans leurs cœurs
  rationale: Le singulier de la source est préservé afin de laisser ouverte la lecture collective de la génération, malgré la possibilité d’un pluriel plus courant en français.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La ponctuation conserve la continuité de la citation. « Profondément irrité » explicite l’intensité lexicale tout en restant accessible; « voies » garde la métaphore biblique traditionnelle et intelligible.
