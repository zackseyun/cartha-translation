  rationale: La révision remplace le relatif qui faisait du cœur le sujet de l’éloignement par une construction où « l’un de vous » demeure le référent naturel de « se détournant ». Elle conserve l’ambiguïté modérée de ἐν τῷ + infinitif sans imposer le terme technique « apostasier » ni une relation causale plus précise. L’appel de note [b] est déplacé vers le groupe textuel réellement commenté.
