source:
  edition: SBLGNT
  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: fr
  text: Prenez garde, frères et sœurs[a], de peur que l’un de vous n’ait un cœur mauvais et incrédule[b] en se détournant du Dieu vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « frères »; ce masculin pluriel peut désigner ici l’ensemble des croyants, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un cœur mauvais, marqué par l’incrédulité, en s’éloignant du Dieu vivant »; on peut aussi traduire « en abandonnant le Dieu vivant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Prenez garde
  rationale: L’impératif présent pluriel introduit un avertissement soutenu. « Prenez garde » est naturel, digne et conserve l’idée de vigilance.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Le masculin pluriel grec peut s’adresser à l’ensemble des croyants. En français actuel, « frères et sœurs » rend explicitement cette portée sans suggérer que seuls des hommes sont visés.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: qu’aucun de vous n’ait
  rationale: Cette formulation française idiomatique conserve la portée distributive de ἔν τινι ὑμῶν et la possibilité redoutée introduite par μήποτε.
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: un cœur mauvais et incrédule
  rationale: « Cœur » garde l’image biblique du centre intérieur de la pensée, de la volonté et des affections. Le génitif ἀπιστίας caractérise ici le cœur par l’incrédulité; la formulation adjectivale est naturelle en français.
- source_word: ἐν τῷ ἀποστῆναι
  choice: qui se détourne
  rationale: Le verbe exprime l’éloignement ou la rupture avec Dieu. « Se détourner » reste sérieux sans imposer le terme théologique plus technique « apostasier »; le relatif explicite en français le lien avec le cœur incrédule tout en laissant ouverte la nuance de manifestation ou de conséquence.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: du Dieu vivant
  rationale: L’expression biblique établie « le Dieu vivant » rend la référence définie et le contraste implicite avec ce qui est sans vie.
theological_decisions:
- issue: 'Sens de ἀπιστίας : incrédulité ou infidélité'
  choice: incrédule
  alternative: infidèle
  rationale: Le contexte d’Hébreux 3 met particulièrement en avant le refus de croire la parole de Dieu. « Incrédule » convient donc au discours, tout en laissant subsister la dimension morale signalée par « mauvais ».
- issue: Force théologique de ἀποστῆναι
  choice: se détourner
  alternative: apostasier / abandonner
  rationale: « Se détourner » transmet la gravité d’une rupture avec le Dieu vivant sans transformer le verbe en catégorie doctrinale technique ni résoudre les débats sur l’apostasie.
- issue: Portée de l’adresse ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Dans ce contexte communautaire, le masculin pluriel grec peut inclure les femmes. La traduction principale rend cette portée explicite, tandis que la note signale la forme exacte du grec.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite le littéralisme peu naturel « de peur qu’il y ait en quelqu’un de vous » tout en conservant l’avertissement adressé à chaque membre de la communauté. Les marqueurs [a] et [b] figurent dans le texte principal.
