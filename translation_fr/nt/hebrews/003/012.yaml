  source_fidelity: La traduction rend correctement l’avertissement de βλέπετε, l’adresse communautaire, la portée distributive de μήποτε ἔσται ἔν τινι ὑμῶν, « cœur », « mauvais », « incrédule » et « le Dieu vivant ». Toutefois, « qui se détourne » fait grammaticalement du « cœur » le sujet de ἀποστῆναι, alors que l’infinitif vise la personne susceptible d’avoir ce cœur. La construction ἐν τῷ ἀποστῆναι doit rester liée à l’éloignement de l’un des destinataires, sans trancher indûment entre circonstance, expression ou conséquence.
  naturalness: « Prenez garde, frères et sœurs » est naturel et de registre biblique moderne. « De peur que l’un de vous n’ait … en se détournant » est une formulation française claire et soutenue, qui préserve mieux le lien syntaxique du grec que le relatif du projet. Le déplacement de l’appel de note évite qu’une note sur le cœur et l’éloignement paraisse qualifier seulement « Dieu vivant ».
  terminology: « Cœur mauvais et incrédule », « se détourner » et « le Dieu vivant » sont justes, naturels et théologiquement non techniques. « Frères et sœurs » explicite de façon recevable l’auditoire communautaire potentiellement mixte; la note conserve l’information que le grec porte le masculin pluriel ἀδελφοί.
