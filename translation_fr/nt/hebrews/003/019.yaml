  text: καὶ βλέπομεν ὅτι οὐκ ἠδυνήθησαν εἰσελθεῖν δι’ ἀπιστίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/019.yaml
  text: And we see that they were not able to enter because of unbelief[a].
translation:
  language: fr
  text: Et nous voyons qu’ils n’ont pas pu entrer à cause de leur incrédulité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « infidélité ». Le terme grec peut désigner non seulement l’absence de foi, mais aussi un refus de faire confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: donc
  rationale: Dans cette phrase conclusive, καί relie le constat à l’argument précédent. « Donc » rend naturellement en français cette progression logique sans alourdir la phrase.
- source_word: βλέπομεν
  choice: nous voyons
  rationale: Le présent actif à la première personne du pluriel est rendu directement, ce qui conserve la conclusion rhétorique vive de l’auteur.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce qui est constaté et se rend naturellement par « que ».
- source_word: οὐκ ἠδυνήθησαν
  choice: ils n’ont pas pu
  rationale: Cette formulation idiomatique conserve nettement l’idée d’incapacité exprimée par δύναμαι.
- source_word: εἰσελθεῖν
  choice: entrer
  rationale: Le verbe garde sa formulation générale, en lien avec l’entrée dans le pays et le repos développée dans le contexte, sans explicitation ajoutée.
- source_word: δι’
  choice: à cause de
  rationale: Avec l’accusatif, διά exprime ici la cause. « À cause de » est clair et naturel en français moderne.
- source_word: ἀπιστίαν
  choice: leur incrédulité
  rationale: « Incrédulité » exprime le refus ou l’absence de foi et de confiance dans la promesse de Dieu. Le possessif est idiomatique en français et désigne clairement la disposition des personnes concernées.
theological_decisions:
- issue: Sens de ἀπιστία en relation avec πίστις
  choice: incrédulité
  alternative: manque de fidélité
  rationale: Le contexte immédiat insiste sur le refus de croire et de faire confiance à la parole de Dieu, ce que « incrédulité » rend clairement. Toutefois, le terme peut aussi évoquer une infidélité ou un refus déloyal de faire confiance; cette nuance est conservée en note afin de ne pas réduire la tension sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise suit la structure grecque tout en employant l’idiome courant « n’ont pas pu ». « Donc » marque la portée conclusive du verset dans son contexte.
