  text: πιστὸν ὄντα τῷ ποιήσαντι αὐτὸν ὡς καὶ Μωϋσῆς ⸀ἐν τῷ οἴκῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: fr
  text: Il est fidèle à celui qui l’a établi[a], comme Moïse l’était lui aussi dans sa maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à celui qui l’a fait ». Le verbe grec peut signifier « faire », mais il a probablement ici le sens d’« établir » ou de « charger d’une mission ».
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « dans toute sa maison », en écho étroit à Nombres 12.7. La maison est vraisemblablement celle de Dieu.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: Il est fidèle
  rationale: Le participe grec se rapporte à Jésus mentionné au verset précédent. Une proposition avec un verbe conjugué est plus naturelle en français moderne et exprime ici la fidélité, non le fait de croire.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: à celui qui l’a établi
  rationale: Dans ce contexte de mission et de responsabilité au sein de la maison de Dieu, « établir » rend le sens contextuel de ποιέω sans suggérer sans nécessité que le Fils aurait été créé. La possibilité lexicale « fait » est signalée en note.
- source_word: ὡς καὶ
  choice: comme … lui aussi
  rationale: Cette tournure française restitue clairement la comparaison et la valeur de καί.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: dans sa maison
  rationale: Le texte de la SBLGNT ne comporte pas ici de terme signifiant « toute ». « Maison » conserve l’image développée dans les versets suivants, tandis que le possessif maintient la formulation et la possible tension référentielle du grec.
theological_decisions:
- issue: Sens de ποιήσαντι à propos de Jésus
  choice: établi
  alternative: fait
  rationale: « Fait » est lexicalement possible, mais « établi » correspond mieux au contexte de la fonction confiée à Jésus et évite d’imposer au passage l’idée qu’il aurait été créé. La note conserve l’autre possibilité.
- issue: Référent du possessif dans « sa maison »
  choice: conserver le possessif sans expliciter son référent
  alternative: dans la maison de Dieu
  rationale: Le contexte et l’écho à Nombres 12.7 orientent vers la maison de Dieu, mais le grec emploie un simple possessif. Le maintenir préserve la formulation et évite de résoudre explicitement ce que le texte laisse implicite.
- issue: Présence de « toute » devant « maison »
  choice: 'suivre le texte principal de la SBLGNT : « dans sa maison »'
  alternative: dans toute sa maison
  rationale: Le texte grec fourni omet l’adjectif, tandis qu’une variante manuscrite l’ajoute en écho plus exact à Nombres 12.7. La variante est documentée en note plutôt qu’intégrée au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. « Établi » convient au registre biblique courant sans être archaïque. La répétition « comme Moïse l’était lui aussi » rend explicitement l’ellipse grecque tout en restant naturelle. L’image de la « maison » est conservée en vue du développement des versets suivants.
