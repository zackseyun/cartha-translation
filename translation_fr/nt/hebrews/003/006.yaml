    text: Littéralement « le sujet de fierté de l’espérance »; on peut aussi comprendre « l’assurance de l’espérance » ou « la joie fière de l’espérance ».
    reason: lexical_alternative
  revision_rationale: La révision replace explicitement « en tant que Fils » dans sa relation avec l’autorité exercée sur la maison. Elle remplace aussi l’explicitation causale de la fierté par une formulation qui préserve davantage la relation concise et quelque peu ouverte entre καύχημα et ἐλπίς. Les ancres de notes restent attachées aux termes qu’elles expliquent.
