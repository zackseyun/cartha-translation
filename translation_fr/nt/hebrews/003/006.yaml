id: HEB.3.6
reference: Hebrews 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: fr
  text: Mais le Messie[a], lui, est à la tête de sa maison en tant que Fils. Cette maison, c’est nous, si nous retenons fermement notre assurance[b] et notre sujet de fierté dans l’espérance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός peut signifier « Messie » ou fonctionner comme la désignation « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « notre hardiesse ». Le mot grec peut évoquer la franchise, la liberté de parole ou une confiance courageuse.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « le sujet de fierté de l’espérance »; on peut aussi comprendre « l’assurance de l’espérance » ou « la joie fière de l’espérance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Dans le contraste avec Moïse, le titre garde ici sa portée messianique. « Christ » demeure possible et est signalé en note.
- source_word: δὲ
  choice: Mais … lui
  rationale: Exprime naturellement en français le contraste avec Moïse évoqué au verset précédent.
- source_word: ὡς υἱὸς
  choice: comme un Fils
  rationale: Conserve la valeur comparative de ὡς et rend le référent christologique par la majuscule sans ajouter d’article défini absent du grec.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: à la tête de sa maison
  rationale: Exprime l’autorité ou la responsabilité exercée sur la maison tout en conservant la métaphore de οἶκος. Le possessif reste volontairement non explicité quant à son référent.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Et sa maison, c’est nous
  rationale: Formulation française naturelle qui maintient l’identification métaphorique de la communauté à la maison.
- source_word: ἐὰν
  choice: si
  rationale: Préserve la condition réelle du grec sans la renforcer ni en résoudre les implications théologiques.
- source_word: παρρησίαν
  choice: assurance
  rationale: Dans ce contexte, désigne une confiance ouverte et courageuse; « assurance » est idiomatique en français, tandis que « hardiesse » est signalé comme nuance possible.
- source_word: καύχημα
  choice: la fierté que nous donne
  rationale: Restitue l’idée de ce dont on se glorifie ou tire fierté, sans la connotation souvent négative de « vantardise » en français moderne.
- source_word: τῆς ἐλπίδος
  choice: notre espérance
  rationale: Le possessif, implicite dans le cadre à la première personne du pluriel, produit une formulation française naturelle.
- source_word: κατάσχωμεν
  choice: nous retenons fermement
  rationale: Rend l’idée de conserver avec persévérance et la force exhortative du verbe dans Hébreux.
theological_decisions:
- issue: 'Valeur de Χριστός : titre ou désignation proche d’un nom propre'
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte comparant Moïse au Fils favorise la force titulaire, mais l’autre lecture reste légitime et figure en note.
- issue: Référent du possessif dans « sa maison »
  choice: maintenir le possessif sans identifier explicitement son référent
  alternative: la maison de Dieu / sa propre maison
  rationale: La syntaxe et le contexte permettent de relier la maison à Dieu ou au Fils; la traduction conserve cette tension au lieu de la trancher.
- issue: Portée de la proposition conditionnelle
  choice: si nous retenons fermement
  alternative: pourvu que nous retenions fermement
  rationale: « Si » traduit directement ἐὰν et maintient la tension relative à la persévérance sans imposer un cadre doctrinal particulier.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la maison est conservée; le contraste rhétorique avec Moïse est rendu par « Mais … lui ». Les formulations évitent à la fois l’archaïsme et la résolution implicite des ambiguïtés christologiques et conditionnelles.
