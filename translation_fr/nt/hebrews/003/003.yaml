id: HEB.3.3
reference: Hebrews 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: fr
  text: Car celui-ci a été jugé digne d’une gloire plus grande que Moïse, dans la mesure où celui qui a construit une maison a plus d’honneur que la maison elle-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: celui-ci
  rationale: Le démonstratif renvoie à Jésus, nommé au verset précédent, tout en conservant la forme démonstrative du grec.
- source_word: ἠξίωται
  choice: a été jugé digne
  rationale: Rend le parfait passif et l’idée d’une dignité reconnue ou attribuée.
- source_word: δόξης
  choice: gloire
  rationale: Équivalent direct et théologiquement non réducteur de δόξα.
- source_word: καθ’ ὅσον
  choice: dans la mesure où
  rationale: Conserve explicitement le rapport de mesure ou de proportion introduit par l’expression grecque, sans le réduire à une simple comparaison.
- source_word: κατασκευάσας
  choice: construit
  rationale: Dans l’image de la maison, « construire » est naturel et rend le sens contextuel de κατασκευάζω.
- source_word: οἴκου
  choice: maison
  rationale: Maintient l’image concrète du grec et sa possible portée plus large dans le contexte sans l’expliciter ici.
- source_word: τιμὴν ἔχει
  choice: reçoit plus d’honneur
  rationale: Formulation française naturelle pour la supériorité d’honneur reconnue au constructeur; le comparatif πλείονα est rendu par « plus ».
theological_decisions:
- issue: Identification de « celui-ci »
  choice: Conserver « celui-ci » plutôt que d’insérer « Jésus » ou « Christ »
  alternative: « Jésus a été jugé digne… »
  rationale: Le référent contextuel est clair, mais le maintien du démonstratif respecte la formulation grecque et évite une explicitation absente du verset.
- issue: Rapport entre le constructeur et la maison
  choice: Conserver l’analogie sans identifier explicitement ici le constructeur à Dieu ou au Christ
  alternative: Expliciter une christologie de la création ou attribuer directement la construction à Dieu
  rationale: Le verset formule une comparaison dont le développement se poursuit au verset suivant; l’expliciter ici résoudrait prématurément une tension interprétative.
- issue: Valeur de καθ’ ὅσον
  choice: « dans la mesure où »
  alternative: « de même que » ou « tout comme »
  rationale: La traduction retenue préserve la nuance proportionnelle du grec et le lien argumentatif entre la gloire supérieure et l’honneur supérieur du constructeur.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « maison » est conservée pour la clarté de l’analogie; « elle-même » souligne naturellement le contraste sans ajouter de contenu doctrinal.
