  rationale: 'La révision limite les changements aux deux écarts lexicaux sûrs : « a construit » rend l’aoriste de κατασκευάσας, et « a plus d’honneur » rend directement τιμὴν ἔχει. L’ambiguïté volontaire concernant l’identité du constructeur est préservée.'
