    rationale: Le grec κατασκευάσας est un participe aoriste, décrivant celui qui a construit ou bâti la maison, non l’activité présente de construire.
  - severity: low
    issue: « reçoit plus d’honneur » pour ἔχει
    rationale: ἔχει signifie littéralement « a » ; « reçoit » introduit une nuance d’attribution qui n’est pas exprimée par le verbe grec.
  revised_text: Car celui-ci a été jugé digne d’une gloire plus grande que Moïse, dans la mesure où celui qui a construit une maison a plus d’honneur que la maison elle-même.
