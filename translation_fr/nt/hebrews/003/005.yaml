  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: fr
  text: Moïse, pour sa part, a été fidèle dans toute sa maison[a], comme serviteur, en témoignage de ce qui devait être dit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans toute sa maisonnée ». Le grec conserve l’image de la « maison », reprise dans les versets suivants.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ce qui serait dit par la suite ». La formulation grecque renvoie à des paroles encore futures du point de vue de Moïse, sans en préciser ici l’auteur ni le contenu.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ … μὲν
  choice: Moïse, pour sa part
  rationale: « Pour sa part » marque naturellement en français le premier volet du contraste que δέ poursuivra au verset suivant; le lien avec le contexte est conservé sans alourdir la phrase par un « et » peu idiomatique.
- source_word: πιστὸς
  choice: fidèle
  rationale: « Fidèle » exprime la fiabilité de Moïse dans le service qui lui est confié et correspond au vocabulaire du contexte.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: dans toute sa maison
  rationale: Cette formulation conserve l’image de la « maison », reprise de Nombres 12.7 et développée dans les versets suivants, sans la réduire à une habitation matérielle.
- source_word: ὡς θεράπων
  choice: comme serviteur
  rationale: θεράπων désigne ici un serviteur ou assistant dans une fonction honorable. « Serviteur » évite la nuance plus forte d’« esclave » et prépare le contraste avec le Fils.
- source_word: εἰς μαρτύριον
  choice: afin de témoigner
  rationale: La tournure exprime clairement en français la fonction de témoignage attachée au service fidèle de Moïse.
- source_word: τῶν λαληθησομένων
  choice: de ce qui serait dit par la suite
  rationale: Le participe futur passif est rendu sans préciser explicitement l’auteur des paroles. « Par la suite » fait ressortir l’orientation vers une parole encore future du point de vue de Moïse.
theological_decisions:
- issue: Sens de « sa maison »
  choice: Conserver « maison » comme métaphore biblique de la sphère dans laquelle Moïse sert.
  alternative: Traduire « dans toute sa maisonnée » ou « parmi tous les membres de sa maison ».
  rationale: Le contexte identifie progressivement cette maison au peuple de Dieu. La formulation retenue préserve à la fois l’écho de Nombres 12.7 et le développement théologique d’Hébreux 3, sans trancher prématurément le référent du possessif.
- issue: Statut de Moïse exprimé par θεράπων
  choice: « serviteur »
  alternative: « assistant » ou « ministre »
  rationale: Le terme présente Moïse dans une fonction de service honorable, mais distincte de celle du Fils au verset suivant. « Serviteur » maintient cette tension sans importer la notion plus marquée d’esclavage.
- issue: Référent de « ce qui serait dit »
  choice: Ne pas identifier explicitement ces paroles dans le corps du texte.
  alternative: Préciser qu’il s’agit de la révélation divine ultérieure centrée sur le Fils.
  rationale: Le grec laisse le référent implicite. La traduction conserve cette ouverture tout en indiquant l’orientation future de la phrase.
translation_notes:
  register: Français international moderne, digne et accessible. « Pour sa part » rend le contraste discursif avec le verset suivant; « maison » maintient l’image structurante du passage. La phrase reste fluide tout en conservant le passif et l’indétermination du grec dans la dernière proposition.
