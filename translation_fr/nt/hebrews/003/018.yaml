id: HEB.3.18
reference: Hebrews 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: fr
  text: Et à qui a-t-il juré qu’ils n’entreraient pas dans son repos, sinon à ceux qui ont désobéi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut souligner le refus d’obéir. Dans ce contexte, cette désobéissance est étroitement liée au manque de foi (voir Hébreux 3.19).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: à qui
  rationale: Le datif pluriel interrogatif désigne des personnes. « À qui » est la formulation française naturelle et conserve la question rhétorique.
- source_word: δὲ
  choice: Et
  rationale: Ici, δέ poursuit la série de questions du passage sans marquer nécessairement une forte opposition.
- source_word: ὤμοσεν
  choice: a-t-il juré
  rationale: L’aoriste de ὀμνύω désigne un serment solennel ; le passé composé convient naturellement à la question en français.
- source_word: μὴ εἰσελεύσεσθαι
  choice: qu’ils n’entreraient pas
  rationale: L’infinitif après ὀμνύω exprime le contenu du serment. Le discours indirect au conditionnel est idiomatique en français.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: dans son repos
  rationale: κατάπαυσις désigne le repos de Dieu, thème central de cette section. « Entrer dans son repos » est naturel et maintient l’image de l’entrée.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Dans cette question rhétorique, εἰ μή introduit la seule réponse possible ; « sinon » en restitue clairement la force.
- source_word: τοῖς ἀπειθήσασιν
  choice: à ceux qui ont désobéi
  rationale: Le participe aoriste de ἀπειθέω évoque un refus d’obéir. Le passé composé rend l’acte de désobéissance sans le réduire au seul manque de foi.
theological_decisions:
- issue: Sens de ἀπειθήσασιν dans l’avertissement
  choice: ceux qui ont désobéi
  alternative: ceux qui n’ont pas cru
  rationale: Le contexte associe étroitement désobéissance et incrédulité, notamment au verset 19, mais le mot employé ici est ἀπειθέω. La traduction conserve donc la distinction lexicale et la tension du passage.
translation_notes:
  register: Français international moderne, clair et digne. La structure interrogative et la solennité du serment sont conservées. Le marqueur de note est placé après « désobéi », terme auquel la note se rapporte.
