id: HEB.3.1
reference: Hebrews 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: fr
  text: Ainsi donc, frères saints[a], vous qui avez part à un appel céleste[b], considérez Jésus, l’apôtre et le grand-prêtre de notre confession[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne toute la communauté croyante, femmes comprises.
    reason: cultural_note
  - marker: b
    text: 'Ou : « vous qui participez à l’appel céleste ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « considérez celui que nous confessons : Jésus, l’apôtre et le grand-prêtre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Ainsi donc
  rationale: Marque la conséquence tirée de l’argument précédent, notamment de 2.17-18, dans un français naturel et soutenu.
- source_word: ἀδελφοὶ ἅγιοι
  choice: frères saints
  rationale: Conserve la forme masculine du grec et la qualification communautaire et cultuelle « saints »; le contexte montre que l’adresse vise toute la communauté croyante.
- source_word: κλήσεως ἐπουρανίου μέτοχοι
  choice: vous qui avez part à un appel céleste
  rationale: La proposition relative est idiomatique en français et maintient l’idée de participation exprimée par μέτοχοι ainsi que l’ambiguïté d’ἐπουρανίου quant à l’origine ou au caractère de l’appel.
- source_word: κατανοήσατε
  choice: considérez
  rationale: Rend l’impératif de réflexion attentive sans ajouter une intensité absente du lexème.
- source_word: ἀπόστολον
  choice: apôtre
  rationale: Conserve le titre inhabituellement appliqué à Jésus et son sens de personne envoyée, sans le réduire à une paraphrase.
- source_word: ἀρχιερέα
  choice: grand-prêtre
  rationale: Terme français établi pour la fonction cultuelle qui constitue un thème majeur de l’épître.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: de la foi que nous professons
  rationale: Rend naturellement en français la confession publique et commune exprimée par ὁμολογία, sans la réduire à un sentiment intérieur.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Forme française traditionnelle du nom grec.
theological_decisions:
- issue: Portée genrée de ἀδελφοί
  choice: « frères » dans le texte, avec une note précisant la portée communautaire inclusive
  alternative: « frères et sœurs »
  rationale: La forme grecque est masculine plurielle, tout en servant ici à interpeller l’ensemble de la communauté croyante; la note préserve les deux données.
- issue: ἀπόστολος appliqué à Jésus
  choice: Conserver « apôtre »
  alternative: « envoyé »
  rationale: Le texte attribue explicitement ce titre à Jésus. Le conserver maintient sa force littéraire et théologique sans imposer une explication.
- issue: Rapport syntaxique de τῆς ὁμολογίας ἡμῶν
  choice: 'Relier le complément aux deux titres : « l’apôtre et le grand-prêtre de la foi que nous professons »'
  alternative: '« considérez celui que nous confessons : Jésus, l’apôtre et le grand-prêtre »'
  rationale: Le génitif suit naturellement les deux substantifs coordonnés, mais une lecture où Jésus est lui-même l’objet de la confession reste syntaxiquement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde les titres théologiques du grec et emploie une syntaxe française fluide sans effacer les ambiguïtés réelles.
