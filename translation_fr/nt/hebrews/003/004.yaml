id: HEB.3.4
reference: Hebrews 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: fr
  text: En effet, toute maison est construite par quelqu’un, mais celui qui a tout[a] construit, c’est Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes choses ».
    reason: Alternative lexicale pour πάντα, qui peut se rendre par le collectif « tout » ou par « toutes choses ».
lexical_decisions:
- source_word: πᾶς
  choice: toute
  rationale: 'Avec le singulier οἶκος, πᾶς a une valeur distributive : « toute maison » exprime naturellement une vérité générale.'
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit l’explication de l’affirmation précédente ; « En effet » marque clairement ce lien logique en français moderne.
- source_word: οἶκος
  choice: maison
  rationale: « Maison » conserve l’image architecturale et le jeu contextuel de l’épître, sans réduire le terme au sens de « maisonnée ».
- source_word: κατασκευάζεται
  choice: est construite
  rationale: Le présent passif indique l’action d’un constructeur ; « est construite » est naturel et maintient l’image du bâtiment.
- source_word: ὑπό τινος
  choice: par quelqu’un
  rationale: ὑπό suivi du génitif exprime l’agent, tandis que τις demeure indéfini.
- source_word: ὁ δὲ
  choice: mais celui qui
  rationale: δέ marque ici un contraste ou une progression légère, et l’article avec le participe se rend naturellement par « celui qui ».
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel πάντα a une portée globale. « Tout » est idiomatique en français et n’ajoute pas une précision cosmologique absente du grec.
- source_word: κατασκευάσας
  choice: a construit
  rationale: Cette formulation conserve le même champ lexical que « est construite » et exprime l’action du participe aoriste.
- source_word: θεός
  choice: Dieu
  rationale: θεός identifie explicitement celui qui a construit tout ce qui existe.
theological_decisions:
- issue: Identification de Dieu comme celui qui a construit toutes choses
  choice: « celui qui a tout construit, c’est Dieu »
  alternative: « Dieu est celui qui a tout construit »
  rationale: La tournure retenue garde la progression du grec, de la règle générale à l’identification culminante de Dieu, sans ajouter d’explication métaphysique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « construire » préserve l’analogie du texte grec ; la dislocation « c’est Dieu » donne une conclusion naturelle et emphatique sans modifier le contenu.
