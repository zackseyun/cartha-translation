id: HEB.3.8
reference: Hebrews 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: fr
  text: n’endurcissez pas vos cœurs comme lors de la rébellion[a], comme au jour de la mise à l’épreuve dans le désert,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant les noms de lieux hébreux à l’arrière-plan du Psaume 95.8 : « comme à Mériba, au jour de Massa dans le désert ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: n’endurcissez pas
  rationale: Le subjonctif aoriste actif avec μή exprime ici une interdiction directe. Cette formulation française conserve la responsabilité des destinataires.
- source_word: τὰς καρδίας ὑμῶν
  choice: vos cœurs
  rationale: « Cœurs » désigne ici l’être intérieur, notamment la volonté, la pensée et les dispositions. Le possessif maintient l’adresse directe à la communauté.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: comme lors de la rébellion
  rationale: παραπικρασμός évoque une provocation rebelle. « Lors de la rébellion » rend naturellement l’événement et sa portée morale sans substituer au grec le nom de lieu hébreu Mériba.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: comme au jour de la mise à l’épreuve
  rationale: κατά introduit ici le second élément de la comparaison, tandis que πειρασμός désigne l’épisode où Dieu fut mis à l’épreuve. La formulation conserve le parallélisme du grec et évite de réduire le terme à la tentation intérieure.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Dans le contexte français biblique, « désert » désigne naturellement la région inhabitée où Israël a erré et conserve la résonance historique du récit.
theological_decisions:
- issue: Rendu de l’allusion historique au Psaume 95.8
  choice: Traduire les noms grecs de manière descriptive par « la rébellion » et « le jour de la mise à l’épreuve ».
  alternative: « comme à Mériba, au jour de Massa dans le désert »
  rationale: Hébreux cite la formulation grecque de la Septante, qui interprète les noms de lieux hébreux par des noms communs. La priorité donnée au texte grec justifie leur traduction descriptive dans le corps du verset, tandis qu’une note préserve l’arrière-plan hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « comme » conserve le parallélisme de la citation grecque. « Mise à l’épreuve » explicite le sens contextuel de πειρασμός, et « désert » est plus idiomatique que « région sauvage » dans ce récit biblique.
