translation:
  language: fr
  text: où vos ancêtres m’ont mis à l’épreuve lors d’une mise à l’épreuve[a] et ont vu mes œuvres[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’ont éprouvé en me mettant à l’épreuve » ou « m’ont soumis à l’épreuve ». L’expression grecque est difficile et peut indiquer la manière ou le moyen.
    reason: lexical_alternative
  - marker: b
    text: 'Certaines traductions donnent à la proposition suivante un sens concessif : « et pourtant ils ont vu mes œuvres » ou « bien qu’ils aient vu mes œuvres ». Le grec dit simplement « et ont vu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: où
  rationale: L’adverbe relatif renvoie au cadre spatial du désert mentionné au verset précédent. « Où » conserve cette valeur sans la transformer en « lorsque ».
- source_word: ἐπείρασαν
  choice: ont mis à l’épreuve
  rationale: Le verbe exprime ici le fait de tester Dieu, avec la nuance provocatrice portée par le contexte du Psaume 95. Cette tournure est naturelle en français et garde l’idée de mise à l’épreuve.
- source_word: οἱ πατέρες ὑμῶν
  choice: vos ancêtres
  rationale: Dans ce contexte historique, « vos ancêtres » transmet naturellement la référence aux générations antérieures d’Israël. Le littéral « vos pères » demeure possible, mais il est moins idiomatique en français international courant.
- source_word: ἐν δοκιμασίᾳ
  choice: dans une épreuve
  rationale: La formule est syntaxiquement difficile et peut indiquer la circonstance, la manière ou le moyen. « Dans une épreuve » préserve la préposition et l’ambiguïté davantage qu’une formulation purement instrumentale.
- source_word: καὶ εἶδον
  choice: et ont vu
  rationale: Le grec coordonne simplement les deux propositions par καί. Le texte principal n’ajoute donc pas une valeur concessive qui reste seulement implicite dans le contexte.
- source_word: τὰ ἔργα μου
  choice: mes œuvres
  rationale: « Mes œuvres » conserve la forme lexicale et la résonance biblique du grec, en désignant les actes de Dieu accomplis au désert.
theological_decisions:
- issue: Objet sous-entendu de ἐπείρασαν
  choice: m’ont mis à l’épreuve
  alternative: ont mis à l’épreuve
  rationale: Même si le pronom objet n’est pas exprimé dans cette proposition grecque, Dieu en est clairement le référent dans la citation et dans son contexte psalmique. L’expliciter produit un français naturel sans ajouter une affirmation doctrinale étrangère au passage.
- issue: Rapport logique introduit par καί
  choice: et ont vu
  alternative: bien qu’ils aient vu / et pourtant ils ont vu
  rationale: Le contexte peut suggérer une concession, mais le grec porte simplement « et ». La traduction maintient cette coordination et signale l’interprétation concessive en note.
translation_notes:
  register: Français moderne, international et digne. « Ancêtres » évite le caractère aujourd’hui moins naturel de « pères » dans une référence généalogique collective. La répétition « mis à l’épreuve dans une épreuve » est conservée malgré sa légère lourdeur afin de refléter la difficulté et la proximité lexicale des deux termes grecs, avec des solutions plus idiomatiques données en note.
