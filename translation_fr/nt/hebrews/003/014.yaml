id: HEB.3.14
reference: Hebrews 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: fr
  text: Car nous avons part au Christ[a], si du moins nous conservons fermement jusqu’à la fin l’assurance initiale[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous sommes devenus participants au Christ », « associés au Christ » ou « nous avons part au Christ ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « le commencement de l’assurance ».'
    reason: source_structure
  - marker: c
    text: 'Ou : « confiance ». Le terme grec peut aussi signifier, selon le contexte, « réalité » ou « substance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: participants
  rationale: Le terme désigne ceux qui ont part à quelque chose ou qui y participent. « Participants » conserve ce sens sans introduire l’idée plus étroite de simples compagnons.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication ou le fondement de l’exhortation précédente.
- source_word: τοῦ Χριστοῦ
  choice: du Christ
  rationale: Dans le français chrétien courant, « le Christ » rend naturellement le titre Χριστός et convient à la construction avec « participants ».
- source_word: γεγόναμεν
  choice: nous sommes devenus
  rationale: Le parfait exprime un état présent résultant d’un événement antérieur; cette formulation en préserve à la fois l’entrée dans cet état et le résultat durable.
- source_word: ἐάνπερ
  choice: si du moins
  rationale: Cette tournure rend la valeur conditionnelle renforcée de la particule, plus précisément qu’un simple « si ».
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: l’assurance que nous avions au commencement
  rationale: Cette formulation française naturelle exprime l’assurance initiale visée par le syntagme grec, tout en signalant en note sa structure plus littérale et son ambiguïté.
- source_word: ὑποστάσεως
  choice: assurance
  rationale: Dans ce contexte, le mot désigne vraisemblablement une disposition assurée ou confiante. « Assurance » est clair, tandis que « confiance » est conservé en note comme autre possibilité.
- source_word: μέχρι τέλους
  choice: jusqu’à la fin
  rationale: La locution marque la persévérance pendant toute la durée envisagée.
- source_word: βεβαίαν κατάσχωμεν
  choice: nous gardons ferme
  rationale: Le verbe exprime le fait de conserver ou de retenir, et l’adjectif qualifie ce qui demeure stable. La tournure garde l’image de fermeté sans surinterpréter la condition.
theological_decisions:
- issue: Condition et persévérance
  choice: 'Conserver une condition réelle : « si du moins nous gardons… »'
  alternative: Présenter la persévérance soit uniquement comme preuve d’une participation antérieure, soit uniquement comme moyen de maintenir cette participation.
  rationale: Le grec énonce une condition sans trancher à lui seul les débats théologiques ultérieurs sur la persévérance, l’apostasie ou l’assurance du salut.
- issue: Sens de la participation au Christ
  choice: « participants du Christ »
  alternative: « compagnons du Christ » ou « associés au Christ »
  rationale: 'La formulation retenue maintient ouverte la portée du génitif : participation au Christ ou association avec lui, sans la réduire à une simple relation de compagnonnage.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe principale privilégie la clarté idiomatique; les notes préservent la structure grecque et les principales possibilités lexicales.
