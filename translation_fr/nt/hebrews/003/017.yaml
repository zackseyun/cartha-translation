  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: fr
  text: Et contre qui s’est-il mis en colère pendant quarante ans ? N’est-ce pas contre ceux qui ont péché et dont les corps sont tombés dans le désert[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont les cadavres sont tombés dans le désert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσώχθισεν
  choice: s’est-il indigné
  rationale: Le verbe exprime la colère ou une vive indignation envers quelqu’un. « S’est-il indigné » convient au registre digne de l’épître et évite de réduire le sens à une simple irritation.
- source_word: τεσσεράκοντα ἔτη
  choice: pendant quarante ans
  rationale: L’accusatif indique ici la durée ; cette formulation est naturelle en français.
- source_word: ἁμαρτήσασιν
  choice: ceux qui avaient péché
  rationale: Le participe aoriste désigne ceux qui ont commis le péché évoqué. Le plus-que-parfait situe naturellement cet acte avant la chute de leurs corps dans le désert.
- source_word: κῶλα
  choice: corps
  rationale: Le terme désigne littéralement les membres, puis, dans ce contexte de mort et de jugement, les corps abattus. « Corps » reste clair et naturel, tandis qu’une note conserve la force de l’autre rendu possible.
- source_word: ἔπεσεν
  choice: sont tombés
  rationale: Ce rendu préserve l’image verbale du grec et son allusion à la mort sans ajouter explicitement « morts ».
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme français courant pour le cadre des pérégrinations d’Israël et rend naturellement ἔρημος dans ce contexte.
theological_decisions:
- issue: Référent du sujet implicite de προσώχθισεν
  choice: « il » renvoie à Dieu
  alternative: Répéter explicitement « Dieu »
  rationale: Le contexte identifie Dieu comme sujet. Le pronom conserve l’implicite du grec tout en donnant une phrase française naturelle.
- issue: Portée de la question rhétorique
  choice: Conserver « N’est-ce pas… ? »
  alternative: Transformer en affirmation directe
  rationale: La forme interrogative soutient l’argument exhortatif du passage et ne doit pas être aplatie en simple déclaration.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux questions rhétoriques est conservée, ainsi que l’allusion sobre mais nette au jugement dans le désert.
