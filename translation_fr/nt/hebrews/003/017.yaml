revisions:
- from: Et contre qui s’est-il indigné pendant quarante ans ? N’est-ce pas contre ceux qui avaient péché et dont les corps sont tombés dans le désert[a] ?
  to: Et contre qui s’est-il mis en colère pendant quarante ans ? N’est-ce pas contre ceux qui ont péché et dont les corps sont tombés dans le désert[a] ?
  rationale: La révision rend προσώχθισεν par une expression française moderne et directe de la colère, évite de surinterpréter l’aoriste par un plus-que-parfait et simplifie la note afin qu’elle reflète l’alternative lexicale pertinente dans le contexte de mort au désert.
