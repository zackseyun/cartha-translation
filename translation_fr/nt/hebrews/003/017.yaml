review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les deux questions rhétoriques, la durée de quarante ans, le péché et la chute des corps dans le désert sont conservés. Toutefois, « s’est-il indigné » est plus étroit et plus soutenu que προσώχθισεν, qui exprime ici la colère de Dieu ; « s’est-il mis en colère » rend plus directement le verbe et s’accorde avec l’écho scripturaire du contexte. Le plus-que-parfait « avaient péché » impose une antériorité que le participe aoriste ne requiert pas ; « ont péché » est plus neutre.'
  naturalness: La formulation est globalement naturelle en français international moderne. « S’est-il mis en colère » est plus idiomatique que « s’est-il indigné » dans cette question. « Dans le désert » est naturel et approprié au cadre biblique.
  terminology: « Corps » est un bon choix principal pour κῶλα dans ce contexte. La note peut signaler « cadavres », mais l’explication « désigne littéralement les membres du corps » est un peu trop littérale et peut brouiller le sens contextuel ; il vaut mieux indiquer que le grec peut évoquer les corps morts.
  issues:
  - severity: medium
    issue: Rendu de προσώχθισεν par « s’est-il indigné »
    rationale: Le grec désigne la colère ou l’irritation envers un groupe. « S’est-il mis en colère » est plus direct, plus courant et plus proche du choix de l’audit anglais (« was he angry »), sans affaiblir le sens.
  - severity: low
    issue: Plus-que-parfait « avaient péché »
    rationale: Le participe aoriste ne marque pas nécessairement une antériorité temporelle stricte par rapport à la chute des corps. « Ont péché » préserve mieux l’aspect sans explicitation temporelle.
  - severity: low
    issue: Explication de note sur κῶλα
    rationale: κῶλα signifie littéralement « membres », mais l’usage contextuel vise les corps des morts. Une note centrée sur l’alternative contextuelle est plus claire.
  revised_text: Et contre qui s’est-il mis en colère pendant quarante ans ? N’est-ce pas contre ceux qui ont péché et dont les corps sont tombés dans le désert[a] ?
  revised_footnotes:
  - marker: a
    text: 'Ou : « dont les cadavres sont tombés dans le désert ».'
    reason: lexical_alternative
