  text: ἐν τῷ λέγεσθαι· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, Μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: fr
  text: 'comme il est dit : « Aujourd’hui, si vous entendez sa voix, n’endurcissez pas vos cœurs comme lors de la révolte[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme lors de la provocation », selon une formulation traditionnelle de la citation du Psaume 95.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: pendant qu’il est dit
  rationale: La construction ἐν + infinitif articulé a ici une valeur temporelle ou circonstancielle. Le présent passif souligne que la parole citée continue d’être proclamée et de s’appliquer.
- source_word: Σήμερον
  choice: Aujourd’hui
  rationale: Équivalent temporel direct et naturel, qui conserve l’urgence de l’exhortation du psaume.
- source_word: ἐὰν … ἀκούσητε
  choice: si vous entendez
  rationale: Le conditionnel grec avec le subjonctif aoriste se rend naturellement ainsi en français. « Entendre » préserve aussi la tension entre perception et accueil obéissant de la voix.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sa voix
  rationale: Traduction idiomatique du génitif grec, maintenant le caractère personnel de l’appel divin.
- source_word: Μὴ σκληρύνητε
  choice: n’endurcissez pas
  rationale: Cette défense traduit directement le verbe grec et conserve l’écho de la formulation de Psaume 95. Elle présente l’endurcissement comme une action dont les destinataires sont responsables.
- source_word: τὰς καρδίας ὑμῶν
  choice: vos cœurs
  rationale: 'Le pluriel du texte grec est conservé. « Cœur » garde ici son sens biblique large : le centre intérieur de la pensée, de la volonté et des dispositions.'
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: comme lors de la révolte
  rationale: παραπικρασμός évoque la contestation rebelle d’Israël au désert. « Révolte » en exprime clairement la portée dans un français moderne, tandis que « provocation » est signalé en note.
theological_decisions:
- issue: Rendu de παραπικρασμός dans la citation de Psaume 95
  choice: révolte
  alternative: provocation
  rationale: Le terme désigne la résistance d’Israël à Dieu au désert, avec sa dimension morale et communautaire. « Révolte » rend ce sens plus immédiatement intelligible aujourd’hui; « provocation », formulation traditionnelle plus proche de l’étymologie et de certaines versions du psaume, reste possible et figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe initiale demeure volontairement proche de la construction temporelle grecque, même si elle est plus soutenue que la tournure française courante « comme il est dit ». Le pluriel « vos cœurs » et l’image biblique de l’endurcissement sont conservés.
