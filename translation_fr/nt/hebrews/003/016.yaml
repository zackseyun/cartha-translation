  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: fr
  text: Car qui donc sont ceux qui, après avoir entendu, se sont révoltés[a] ? N’était-ce pas tous ceux qui étaient sortis d’Égypte sous la conduite de Moïse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont provoqué (Dieu) » ou « ont exaspéré (Dieu) ». Le verbe grec peut être rendu plus littéralement ainsi; dans ce contexte, il désigne la rébellion d’Israël dans le désert.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες γὰρ
  choice: Qui donc
  rationale: Le pronom interrogatif pluriel introduit une question rhétorique, tandis que γάρ rattache cette question à l’argument précédent. « donc » rend naturellement ce lien explicatif en français.
- source_word: ἀκούσαντες
  choice: après avoir entendu
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal sans préciser explicitement ce qui a été entendu; la traduction conserve cette ellipse.
- source_word: παρεπίκραναν
  choice: se sont révoltés
  rationale: Dans le contexte de la génération du désert, le verbe désigne une provocation de Dieu prenant la forme d’une rébellion. Cette formulation transmet clairement la portée narrative tout en signalant en note le sens plus littéral.
- source_word: ἀλλ’ οὐ πάντες
  choice: N’était-ce pas tous
  rationale: Dans cette question rhétorique, ἀλλά introduit la réponse attendue. La tournure négative française en restitue naturellement la force sans ajouter un « mais » lourd.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: ceux qui étaient sortis d’Égypte
  rationale: Le participe substantivé désigne les personnes sorties d’Égypte; le plus-que-parfait français situe clairement cet exode avant leur révolte.
- source_word: διὰ Μωϋσέως
  choice: sous la conduite de Moïse
  rationale: διά avec le génitif exprime ici l’intermédiaire humain par lequel la sortie d’Égypte s’est accomplie. Cette expression est plus naturelle en français que « par Moïse » et évite l’ambiguïté d’une sortie physiquement opérée à travers lui.
theological_decisions:
- issue: Sens de παραπικραίνω dans le contexte de la génération du désert
  choice: se sont révoltés
  alternative: ont provoqué / ont exaspéré
  rationale: Le contexte présente la désobéissance d’Israël comme une provocation rebelle envers Dieu. « Se sont révoltés » rend cette portée sans nommer explicitement Dieu, que le grec laisse ici sous-entendu; la note conserve les possibilités lexicales plus littérales.
- issue: Portée de πάντες
  choice: tous ceux qui étaient sortis d’Égypte
  alternative: introduire une exception explicite pour Josué et Caleb
  rationale: Le texte formule lui-même une généralisation rhétorique. La traduction la conserve sans résoudre dans le corps du verset la tension avec les exceptions connues du récit biblique.
translation_notes:
  register: Français moderne, international et digne. Les deux questions rhétoriques sont conservées. « Sous la conduite de Moïse » exprime naturellement l’intermédiaire humain, tandis que l’ellipse sur l’objet de l’écoute et la généralisation « tous » restent intactes.
