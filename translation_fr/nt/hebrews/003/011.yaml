  text: ὡς ὤμοσα ἐν τῇ ὀργῇ μου· Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/011.yaml
  text: as I swore in my wrath[a], ‘They shall never enter my rest.’
translation:
  language: fr
  text: 'comme j’ai juré dans ma colère : « Ils n’entreront certainement pas dans mon repos. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « S’ils entrent dans mon repos », formule de serment signifiant : « Ils n’entreront certainement pas dans mon repos. »'
    reason: La note conserve la forme conditionnelle littérale inhabituelle et en explique la valeur idiomatique de négation solennelle.
lexical_decisions:
- source_word: ὡς
  choice: comme
  rationale: Introduit naturellement en français la déclaration citée, dans la continuité du contexte.
- source_word: ὤμοσα
  choice: je l’ai juré
  rationale: Rend directement l’aoriste de ὀμνύω et conserve la solennité du serment.
- source_word: ἐν τῇ ὀργῇ μου
  choice: dans ma colère
  rationale: « Colère » est courant, digne et suffisamment fort dans ce contexte de jugement divin, sans archaïsme inutile.
- source_word: Εἰ εἰσελεύσονται
  choice: Ils n’entreront certainement pas
  rationale: Explicite la valeur négative catégorique de la formule sémitique de serment εἰ suivie du futur, qu’un calque conditionnel rendrait trompeuse en français.
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: dans mon repos
  rationale: Préserve le motif théologique du « repos » développé dans Hébreux, sans le réduire à un lieu, au ciel ou à une expérience intérieure.
theological_decisions:
- issue: Valeur de la formule de serment Εἰ εἰσελεύσονται
  choice: « Ils n’entreront certainement pas dans mon repos »
  alternative: « S’ils entrent dans mon repos »
  rationale: La formulation grecque reproduit une formule de serment elliptique qui exprime une négation solennelle. La traduction choisie en communique la force tout en signalant la forme littérale en note.
- issue: Sens de κατάπαυσις
  choice: « repos »
  alternative: « lieu de repos »
  rationale: « Repos » maintient l’ambiguïté féconde et la continuité avec l’argument de l’épître, sans imposer une identification doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et solennel. « Colère » est préféré à « courroux », plus littéraire et moins accessible. Le marqueur de note est placé après la citation entière.
