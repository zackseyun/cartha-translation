  text: Διό, καθὼς λέγει τὸ πνεῦμα τὸ ἅγιον· Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/007.yaml
  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: fr
  text: 'C’est pourquoi, comme le dit l’Esprit Saint : « Aujourd’hui, si vous entendez sa voix, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: C’est pourquoi
  rationale: Cette locution marque naturellement en français la conclusion tirée de l’argument précédent.
- source_word: καθὼς
  choice: comme
  rationale: Dans cette formule d’introduction à une citation, « comme » est naturel et conserve le lien établi par le grec sans l’alourdir.
- source_word: λέγει
  choice: dit
  rationale: Le présent français maintient le présent grec de la formule de citation et présente la parole de l’Écriture comme actuelle.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Rendu français standard et précis de l’expression grecque, sans ajout d’emphase.
- source_word: Σήμερον
  choice: Aujourd’hui
  rationale: Équivalent temporel direct, placé en tête de la citation comme dans le grec.
- source_word: ἐὰν
  choice: si
  rationale: La conjonction « si » rend directement la condition introduite par ἐὰν.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sa voix
  rationale: Avec le verbe « entendre », cette formulation rend naturellement le génitif objet du grec et conserve la dimension personnelle de « voix ».
- source_word: ἀκούσητε
  choice: vous entendez
  rationale: Le présent français convient naturellement à cette proposition conditionnelle. « Écoutez » introduirait ici une valeur impérative qui n’est pas explicitement portée par la forme grecque.
theological_decisions:
- issue: Attribution de la parole dans la citation du Psaume
  choice: La citation est directement présentée comme une parole de l’Esprit Saint.
  alternative: L’Esprit Saint parle par l’intermédiaire de l’Écriture ou du psalmiste.
  rationale: Le grec affirme explicitement « l’Esprit Saint dit ». La traduction conserve cette attribution directe sans développer une doctrine de l’inspiration au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation laisse la citation ouverte, puisque la proposition se poursuit au verset suivant.
