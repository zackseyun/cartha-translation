source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: fr
  text: 'Mais au sujet du Fils, il dit : « Ton trône, ô Dieu[a], demeure pour toujours et à jamais, et le sceptre de la droiture[b] est le sceptre de ton royaume. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, moins probable : « Dieu est ton trône pour toujours et à jamais. » La syntaxe grecque a fait l’objet de débats, mais l’adresse directe « Ton trône, ô Dieu » convient mieux au contexte et à la portée de la citation.'
    reason: alternative_reading
  - marker: b
    text: 'On pourrait aussi traduire : « le sceptre de la justice ». Le mot grec peut désigner la droiture ou la rectitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Mais au sujet du Fils, il dit
  rationale: Dans cette série de citations, πρός avec l’accusatif peut introduire ce qui est dit au Fils ou à son sujet. Cette formulation française explicite naturellement le verbe de parole sous-entendu et marque le contraste avec les anges.
- source_word: υἱόν
  choice: le Fils
  rationale: L’article grec indique ici un emploi défini et titulaire; « le Fils » conserve ce titre christologique.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Ton trône, ô Dieu
  rationale: ὁ θεός se comprend le plus naturellement comme une adresse directe dans le contexte de la citation et de l’argument d’Hébreux 1. L’autre analyse syntaxiquement possible est signalée en note.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: pour toujours et à jamais
  rationale: Cette tournure idiomatique exprime une durée sans fin. La formulation choisie est naturelle, solennelle et rend la force intensive de l’expression grecque.
- source_word: ῥάβδος
  choice: sceptre
  rationale: Dans ce contexte royal, ῥάβδος désigne l’insigne de l’autorité souveraine plutôt qu’un simple bâton.
- source_word: τῆς εὐθύτητος
  choice: de la droiture
  rationale: εὐθύτης désigne la rectitude ou la droiture. « Droiture » en restitue le sens direct dans un français courant et digne.
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: le sceptre de ton royaume
  rationale: βασιλεία peut désigner le royaume, la royauté ou le règne. « Ton royaume » conserve ici l’image royale et la structure du grec.
theological_decisions:
- issue: Faut-il comprendre ὁ θεός comme une adresse directe au Fils ou comme le sujet d’une proposition (« Dieu est ton trône »)?
  choice: 'Adresse directe : « Ton trône, ô Dieu »'
  alternative: « Dieu est ton trône pour toujours et à jamais »
  rationale: L’adresse directe correspond le mieux à la force de la citation dans l’argument d’Hébreux 1 et à la lecture habituelle de sa source grecque. La syntaxe ayant toutefois fait l’objet de débats, l’autre lecture est conservée en note sans effacer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « ô Dieu » est légèrement solennelle mais reste appropriée à une citation poétique et permet de rendre sans équivoque le vocatif retenu. Les deux notes sont appelées dans le texte principal.
