id: HEB.1.6
reference: Hebrews 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: fr
  text: 'Et lorsqu’il introduit de nouveau le Premier-né dans le monde[a], il dit : « Et que tous les anges de Dieu[b] l’adorent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et de nouveau, lorsqu’il introduit le Premier-né dans le monde, il dit : “Que tous les anges de Dieu l’adorent.” » En grec, « de nouveau » peut se rapporter soit à « introduit », soit à « il dit ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « tous les anges qui appartiennent à Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: lorsque
  rationale: Introduit une proposition temporelle. « Lorsque » convient à l’événement envisagé ici et garde un registre digne et naturel.
- source_word: δὲ
  choice: Et
  rationale: Marque une transition légère dans l’argument, sans imposer un contraste fort.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rattaché dans le texte principal à « introduit », conformément à une lecture naturelle de sa place dans la phrase. Son rattachement possible à « il dit » est signalé en note.
- source_word: εἰσαγάγῃ
  choice: introduit
  rationale: Rend l’idée de faire entrer ou d’amener dans un domaine. « Introduit » est idiomatique en français et conserve la portée solennelle du passage.
- source_word: τὸν πρωτότοκον
  choice: le Premier-né
  rationale: Conserve le titre christologique et ses résonances de filiation et de prééminence, sans les expliciter au-delà du grec.
- source_word: εἰς τὴν οἰκουμένην
  choice: dans le monde
  rationale: Rend naturellement οἰκουμένη, le monde habité, sans lourdeur inutile.
- source_word: λέγει
  choice: il dit
  rationale: Reproduit la formulation grecque sans ajouter « dans l’Écriture ». Dans le contexte de la série de citations, le sujet implicite est Dieu.
- source_word: Καὶ
  choice: Et
  rationale: Conserve la conjonction qui ouvre la citation grecque, même si elle peut sembler légèrement redondante en français.
- source_word: προσκυνησάτωσαν
  choice: que … adorent
  rationale: Exprime la valeur impérative du verbe et, dans le contexte de l’honneur rendu au Fils par tous les anges, sa force cultuelle.
- source_word: αὐτῷ
  choice: l’
  rationale: Le datif régi par προσκυνέω se rend naturellement en français par le complément direct de « adorer ».
- source_word: πάντες ἄγγελοι θεοῦ
  choice: tous les anges de Dieu
  rationale: Rend directement et naturellement la construction génitive grecque.
theological_decisions:
- issue: Rattachement syntaxique de πάλιν
  choice: « de nouveau » modifie « introduit »
  alternative: '« de nouveau » introduit « il dit » : « Et de nouveau, lorsqu’il introduit… il dit »'
  rationale: Les deux analyses sont grammaticalement possibles. Le texte principal suit l’ordre grec et une lecture courante, tandis que la note préserve l’ambiguïté réelle.
- issue: Portée de προσκυνέω à l’égard du Fils
  choice: « adorer »
  alternative: « se prosterner devant » ou « rendre hommage à »
  rationale: Dans l’argument d’Hébreux 1 sur la supériorité du Fils sur les anges, « adorer » exprime le mieux la force du commandement adressé à tous les anges, sans réduire le geste à un simple hommage.
translation_notes:
  register: Français international moderne, clair et digne. La structure de la citation et l’ambiguïté syntaxique de πάλιν sont conservées; le titre « Premier-né » est marqué par une majuscule en raison de son emploi référentiel pour le Fils dans le contexte.
