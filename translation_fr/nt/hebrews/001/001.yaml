source:
  edition: SBLGNT
  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: fr
  text: Autrefois, Dieu a parlé aux pères en de nombreuses parties[a] et de bien des manières, par les prophètes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en de nombreuses portions ». Le grec distingue cette expression de « de bien des manières » et peut souligner la révélation donnée en diverses parties.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans les prophètes »; on peut aussi traduire « par l’intermédiaire des prophètes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: à maintes reprises
  rationale: L’adverbe évoque une révélation donnée en une pluralité de parties ou d’occasions. « À maintes reprises » est naturel en français et reste distinct de la diversité des modes exprimée par πολυτρόπως; une note conserve le sens plus formel « en de nombreuses parties ».
- source_word: πολυτρόπως
  choice: de bien des manières
  rationale: Cette expression française courante rend clairement la diversité des modes de communication et maintient le contraste avec Πολυμερῶς.
- source_word: πάλαι
  choice: Autrefois
  rationale: « Autrefois » exprime sobrement l’époque ancienne et prépare le contraste temporel avec le verset 2, sans archaïsme excessif.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Rendu direct du sujet nominatif.
- source_word: λαλήσας
  choice: a parlé
  rationale: Le participe aoriste dépend syntaxiquement du verbe principal du verset 2. La forme finie est plus naturelle lorsque le verset est présenté seul, tout en permettant de conserver le contraste avec la parole donnée dans le Fils.
- source_word: τοῖς πατράσιν
  choice: à nos pères
  rationale: Dans ce contexte historique partagé entre l’auteur et ses destinataires, le possessif implicite est idiomatique en français. « Pères » conserve la formulation genrée et la portée historico-religieuse du grec; « ancêtres » est signalé en note.
- source_word: ἐν τοῖς προφήταις
  choice: par les prophètes
  rationale: 'La préposition ἐν a ici une valeur instrumentale ou médiatrice: Dieu est celui qui parle, les prophètes étant ses intermédiaires. « Par » est concis et naturel; le littéral « dans les prophètes » est indiqué en note.'
theological_decisions:
- issue: Relation du participe λαλήσας avec Hébreux 1.2
  choice: Employer au verset 1 la forme finie « Dieu a parlé », tout en gardant ouverte la construction qui se poursuit au verset 2.
  alternative: 'Traduire plus formellement: « Dieu, après avoir parlé autrefois… »'
  rationale: Le grec fait dépendre le participe du verbe principal du verset 2. La forme finie évite qu’un verset isolé paraisse grammaticalement incomplet, sans expliciter ni renforcer la progression théologique au-delà du texte.
- issue: Portée de Πολυμερῶς
  choice: « à maintes reprises », avec le sens partitif conservé en note
  alternative: « en de nombreuses parties » ou « de façon fragmentaire »
  rationale: Le mot peut mettre l’accent sur les multiples portions de la révélation antérieure plutôt que seulement sur sa répétition. La formulation retenue demeure naturelle et ne qualifie pas cette révélation d’inférieure ou d’incomplète; la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et lisible. La cadence « à maintes reprises et de bien des manières » reproduit le parallélisme des deux adverbes grecs sans les confondre. Le marqueur [c] doit accompagner l’expression concernée dans le texte publié.
