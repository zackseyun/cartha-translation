source:
  edition: SBLGNT
  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: fr
  text: Il est devenu d’autant supérieur aux anges que le nom dont il a hérité est plus excellent que le leur.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’autant meilleur que les anges […] plus éminent que le leur ».'
    reason: lexical_alternative
  - marker: b
    text: Dans la suite du passage, ce « nom » est précisé par la désignation et le statut filial du Fils.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: d’autant ... que
  rationale: Cette tournure corrélative exprime naturellement en français une comparaison proportionnelle entre la supériorité du Fils et l’excellence du nom reçu en héritage.
- source_word: κρείττων
  choice: supérieur
  rationale: Dans la comparaison avec les anges, « supérieur » indique clairement une prééminence de rang ou de statut, sans suggérer une supériorité morale.
- source_word: γενόμενος
  choice: Il est devenu
  rationale: Le passé composé rend l’aoriste de façon naturelle et présente l’accès à cet état de supériorité sans introduire l’idée qu’il aurait été créé.
- source_word: τῶν ἀγγέλων
  choice: aux anges
  rationale: Le génitif suivant le comparatif se rend idiomatiquement par « aux anges » en français.
- source_word: διαφορώτερον
  choice: plus excellent
  rationale: Le comparatif exprime ici une distinction éminente. « Plus excellent » conserve le registre soutenu de l’épître et s’accorde avec la comparaison de supériorité.
- source_word: παρ’ αὐτοὺς
  choice: que le leur
  rationale: Le français demande de reprendre « nom » au moyen du pronom possessif « le leur »; cette formulation conserve clairement les anges comme second terme de la comparaison.
- source_word: κεκληρονόμηκεν
  choice: dont il a hérité
  rationale: Le passé composé reflète l’état présent résultant exprimé par le parfait grec, tandis que la relative est naturelle avec le nom français « héritage ».
- source_word: ὄνομα
  choice: le nom
  rationale: Le contexte qui suit précise ce nom. L’article défini convient en français sans expliciter prématurément qu’il s’agit du titre filial.
theological_decisions:
- issue: Portée christologique de γενόμενος (« il est devenu »)
  choice: Traduire directement le changement de statut exprimé par le participe, dans le cadre de l’exaltation du Fils.
  alternative: « ayant été fait », formulation susceptible d’être comprise à tort comme une affirmation de création.
  rationale: Le texte établit la prééminence du Fils sur les anges. La traduction conserve le mouvement verbal sans lui faire dire qu’il serait passé de la non-divinité à la divinité.
- issue: Sens du « nom »
  choice: Conserver « le nom » et laisser les versets suivants en préciser le contenu filial et le statut.
  alternative: Expliciter dans le verset « le titre de Fils » ou comprendre seulement « honneur » ou « rang ».
  rationale: Le grec dit simplement « nom ». La formulation littérale préserve la progression du passage et sa densité sémantique sans anticiper sur les citations suivantes.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « d’autant… que » préserve la comparaison proportionnelle du grec; « supérieur » évite une lecture morale de κρείττων, tandis que « plus excellent » maintient le registre élevé de l’épître.
