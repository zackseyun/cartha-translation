  source_fidelity: La traduction rend fidèlement la participiale génόμενος (« Il est devenu »), la comparaison corrélative τοσούτῳ…ὅσῳ (« d’autant… que »), la prééminence de κρείττων sur les anges, ainsi que le parfait κεκληρονόμηκεν par « dont il a hérité ». « Que le leur » reprend correctement le nom implicitement attribué aux anges. Elle ne résout pas indûment la portée christologique du participe ni le contenu du « nom ».
  naturalness: Le français est naturel, clair et d’un registre soutenu approprié à l’épître. « D’autant supérieur aux anges que » exprime de manière recevable la proportion comparative grecque. « Plus excellent » est légèrement élevé, mais idiomatique dans ce registre et cohérent avec la solennité du texte.
  terminology: « Supérieur » convient bien à κρείττων dans une comparaison de rang, sans connotation morale excessive. « Le nom » conserve l’ouverture sémantique du grec; la note b l’éclaire contextuellement sans le paraphraser dans le corps du verset. Les ancres a et b sont placées après la proposition entière à laquelle elles se rapportent.
