id: HEB.1.7
reference: Hebrews 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: fr
  text: 'Et au sujet des anges, il dit : « Il fait de ses anges des vents[a], et de ses serviteurs une flamme de feu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des esprits » : le mot grec peut signifier soit « vents », soit « esprits ».'
    reason: Lecture alternative préservant une ambiguïté lexicale et interprétative réelle.
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: au sujet des anges
  rationale: 'Avec λέγει, πρός introduit ici le sujet des paroles citées plutôt que leurs destinataires : la citation parle des anges, elle ne leur est pas directement adressée.'
- source_word: λέγει
  choice: il dit
  rationale: Le présent de la formule de citation est conservé, conformément à l’usage du Nouveau Testament qui présente l’Écriture comme une parole actuelle.
- source_word: Ὁ ποιῶν
  choice: Il fait de
  rationale: Cette tournure française naturelle rend la valeur verbale du participe grec et permet de conserver la construction parallèle des deux compléments.
- source_word: ἀγγέλους
  choice: anges
  rationale: Dans le contexte d’Hébreux 1, il s’agit des êtres célestes mis en contraste avec le Fils, et non de simples messagers humains.
- source_word: πνεύματα
  choice: vents
  rationale: Le mot grec peut désigner des vents ou des esprits. « Vents » correspond bien à l’arrière-plan du Psaume 104 et au parallèle poétique avec la flamme de feu; l’autre sens est maintenu en note.
- source_word: λειτουργοὺς
  choice: serviteurs
  rationale: Le terme désigne ceux qui accomplissent un service, parfois officiel ou sacré. « Serviteurs » reste digne et compréhensible sans suggérer à tort la fonction ecclésiastique ou politique que « ministres » évoque souvent en français moderne.
- source_word: πυρὸς φλόγα
  choice: une flamme de feu
  rationale: Le singulier et l’image poétique du grec sont conservés directement.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le possessif français renvoie naturellement à Dieu dans le contexte de la citation.
theological_decisions:
- issue: Sens de πνεύματα dans la citation du Psaume 104.4
  choice: vents
  alternative: esprits
  rationale: L’arrière-plan hébreu et le parallélisme avec « une flamme de feu » favorisent « vents », mais le grec demeure réellement ambigu. La note préserve donc l’autre lecture sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme poétique de la citation tout en évitant les connotations institutionnelles modernes de « ministres ».
