id: HEB.1.10
reference: Hebrews 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: fr
  text: 'Et : « Toi, Seigneur, au commencement[a], tu as posé les fondations de la terre, et les cieux sont l’œuvre de tes mains. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dès l’origine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Et
  rationale: Introduit une citation supplémentaire dans la série. Le simple « Et » conserve la valeur connective sans expliciter davantage le rapport.
- source_word: Σὺ
  choice: Toi
  rationale: Le pronom grec explicite est emphatique. « Toi » en tête de l’adresse en rend naturellement l’insistance en français.
- source_word: κατ’ ἀρχάς
  choice: au commencement
  rationale: Expression temporelle désignant l’origine ou le point de départ. « Au commencement » est naturel, digne et adapté au contexte de la création, tout en laissant en note l’autre nuance possible.
- source_word: κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος. « Seigneur » conserve l’adresse directe et la portée du titre dans la citation.
- source_word: τὴν γῆν
  choice: la terre
  rationale: Dans ce contexte de création, en parallèle avec « les cieux », γῆ désigne la terre plutôt qu’un territoire particulier.
- source_word: ἐθεμελίωσας
  choice: tu as posé les fondations de
  rationale: Cette formulation préserve clairement la métaphore architecturale du verbe θεμελιόω et reste idiomatique en français.
- source_word: ἔργα
  choice: l’œuvre
  rationale: Le grec emploie le pluriel, mais le français dit naturellement « les cieux sont l’œuvre de tes mains ». Le collectif conserve le sens de ce qui a été façonné.
- source_word: τῶν χειρῶν σού
  choice: de tes mains
  rationale: Le rendu direct conserve l’image anthropomorphique de la citation plutôt que de la remplacer par une abstraction telle que « ton ouvrage ».
- source_word: οἱ οὐρανοί
  choice: les cieux
  rationale: Le pluriel français correspond au pluriel grec et convient au langage biblique de la création, en parallèle avec « la terre ».
theological_decisions:
- issue: Application au Fils, en Hébreux 1, des paroles du Psaume adressées au Seigneur
  choice: Maintenir l’adresse directe « Toi, Seigneur » sans l’atténuer.
  alternative: Employer une formulation plus neutre qui réduirait la portée christologique de la citation.
  rationale: Le grec porte explicitement κύριε au vocatif dans une citation que le contexte applique au Fils. La traduction conserve ce fait textuel sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre « Toi, Seigneur » garde l’emphase grecque; « poser les fondations » conserve l’image concrète sans archaïsme. Le marqueur [a] figure immédiatement après l’expression concernée.
