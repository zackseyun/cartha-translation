source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: fr
  text: Tu as aimé la justice et haï le mépris de la loi ; c’est pourquoi Dieu, ton Dieu, t’a oint d’une huile de joie, plus que tes compagnons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπησας
  choice: tu as aimé
  rationale: Le passé composé rend naturellement en français l’aoriste dans cette citation et garde la portée actuelle de l’action.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: En français moderne, « justice » couvre ici naturellement la droiture morale et la conformité à ce qui est juste, sans imposer le sens principalement judiciaire que le mot peut parfois évoquer.
- source_word: ἐμίσησας
  choice: détesté
  rationale: « Détester » conserve l’opposition morale forte avec « aimer » et s’emploie naturellement en français courant.
- source_word: ἀνομίαν
  choice: le mépris de la loi
  rationale: Cette formulation exprime l’idée d’ἀνομία comme rejet ou violation de la loi plus clairement que « iniquité », devenu peu transparent, tout en restant distincte de la simple méchanceté.
- source_word: διὰ τοῦτο
  choice: c’est pourquoi
  rationale: La locution marque clairement et naturellement le lien causal ou conséquentiel.
- source_word: ἔχρισέν
  choice: t’a consacré par l’onction
  rationale: Cette formulation préserve à la fois l’acte d’oindre et sa portée royale ou consécratoire, là où le seul verbe « oindre » est moins immédiatement accessible à de nombreux lecteurs.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Dieu, ton Dieu
  rationale: La répétition et l’apposition du grec sont conservées sans développement doctrinal.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: une huile de joie
  rationale: « Huile de joie » conserve l’image scripturaire et exprime clairement la réjouissance intense portée par ἀγαλλίασις.
- source_word: παρὰ τοὺς μετόχους σου
  choice: plus que tes compagnons
  rationale: Dans cette construction comparative, παρά indique une supériorité relative ; « compagnons » rend naturellement la relation exprimée par μέτοχοι sans connotation commerciale.
theological_decisions:
- issue: Portée de δικαιοσύνη dans cette citation royale et messianique
  choice: justice
  alternative: droiture
  rationale: « Justice » est le correspondant français le plus direct et naturel, capable d’inclure ici la qualité morale ; « droiture » expliciterait davantage cet aspect mais rétrécirait la polysémie du terme.
- issue: Force christologique de « Dieu, ton Dieu » à propos du Fils
  choice: conserver littéralement « Dieu, ton Dieu »
  alternative: ajouter une explication des relations entre le Père et le Fils
  rationale: La formulation grecque maintient une tension théologique que la traduction ne doit ni atténuer ni expliquer par une paraphrase doctrinale.
- issue: Image de l’onction messianique
  choice: consacré par l’onction avec une huile de joie
  alternative: oint d’une huile de joie
  rationale: Le choix retenu rend intelligible l’acte tout en préservant explicitement l’image de l’onction et sa résonance royale ou messianique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe du texte. La syntaxe conserve le parallélisme solennel de la citation, tandis que « mépris de la loi » évite l’archaïsme d’« iniquité ».
