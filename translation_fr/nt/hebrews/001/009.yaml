revisions:
- from: Tu as aimé la justice et détesté le mépris de la loi ; c’est pourquoi Dieu, ton Dieu, t’a consacré par l’onction avec une huile de joie, plus que tes compagnons.
  to: Tu as aimé la justice et haï le mépris de la loi ; c’est pourquoi Dieu, ton Dieu, t’a oint d’une huile de joie, plus que tes compagnons.
  rationale: 'La révision remplace la périphrase interprétative et redondante de l’onction par le verbe français direct « oindre », qui correspond à χρίω et conserve l’image de l’huile. Elle emploie aussi « haï » pour maintenir la vigueur du contraste grec. Le reste du texte est conservé : il rend le sens source sans résoudre la tension christologique ni ajouter d’explication confessionnelle.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:40:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure de la citation, l’adresse directe, la répétition « Dieu, ton Dieu », le lien causal et la comparaison avec les compagnons sont bien préservés. « Justice » est un rendu défendable de δικαιοσύνη, et « mépris de la loi » exprime de façon accessible l’idée d’ἀνομία. En revanche, « t’a consacré par l’onction avec » développe et reformule excessivement ἔχρισέν … ἔλαιον, tout en produisant une construction redondante : le grec dit directement que Dieu l’a oint d’une huile de joie.'
  naturalness: Le français est globalement clair et digne. « T’a oint d’une huile de joie » est à la fois plus concis, plus naturel dans un contexte scripturaire et plus fidèle à l’image concrète du texte. « Haï » maintient le parallélisme solennel et la force lexicale de ἐμίσησας mieux que « détesté », sans être archaïque.
  terminology: « Justice » peut convenir ici sans imposer une lecture strictement judiciaire ; aucune note n’est nécessaire. « Mépris de la loi » est une explicitation acceptable de l’ἀνομία et évite l’opacité relative d’« iniquité ». Le verbe « oindre » doit être conservé, car il rend directement χρίω et préserve l’imagerie royale et messianique sans paraphrase doctrinale.
  issues:
  - severity: medium
    issue: Paraphrase redondante de l’onction
    rationale: « T’a consacré par l’onction avec une huile » ajoute l’idée de consécration et double inutilement l’onction et l’huile, alors que ἔχρισέν σε … ἔλαιον signifie directement « t’a oint d’une huile ». Cette correction améliore simultanément la fidélité et la fluidité.
  - severity: low
    issue: Force du verbe exprimant la haine
    rationale: « Détesté » est possible, mais « haï » restitue plus exactement la force et le parallélisme élevé de ἐμίσησας dans cette citation scripturaire.
  revised_text: Tu as aimé la justice et haï le mépris de la loi ; c’est pourquoi Dieu, ton Dieu, t’a oint d’une huile de joie, plus que tes compagnons.
  revised_footnotes: []
  revision_rationale: 'La révision remplace la périphrase interprétative et redondante de l’onction par le verbe français direct « oindre », qui correspond à χρίω et conserve l’image de l’huile. Elle emploie aussi « haï » pour maintenir la vigueur du contraste grec. Le reste du texte est conservé : il rend le sens source sans résoudre la tension christologique ni ajouter d’explication confessionnelle.'
