  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: fr
  text: en ces derniers jours, il nous a parlé en son Fils[a], qu’il a établi héritier de toutes choses et par qui il a aussi fait les âges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par son Fils ». Le grec dit littéralement « en Fils » : « Fils » est sans article, ce qui met en relief la manière et le caractère culminant de la parole de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Ou « l’univers » ou « les mondes ». Le grec « les âges » peut désigner les âges eux-mêmes et, par extension, l’ensemble de l’ordre créé.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: en ces jours qui sont les derniers
  rationale: Cette formulation française naturelle conserve à la fois la référence aux « jours-ci » et leur caractère ultime, sans réduire l’expression à une simple époque récente.
- source_word: ἐλάλησεν ἡμῖν
  choice: il nous a parlé
  rationale: Le passé composé exprime en français un acte accompli dont la portée demeure actuelle et s’intègre naturellement au contraste avec le verset précédent.
- source_word: ἐν υἱῷ
  choice: en un Fils
  rationale: Le choix garde la préposition ἐν et l’absence d’article devant υἱῷ. Bien que cette tournure soit marquée en français, elle restitue le caractère particulier et culminant de la parole divine sans ajouter « son » ou l’article défini.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: qu’il a établi héritier de toutes choses
  rationale: « Établir » rend ici τίθημι dans le sens de conférer une fonction ou une position; « toutes choses » préserve l’étendue générale de πάντων dans un registre biblique clair.
- source_word: δι’ οὗ
  choice: par qui
  rationale: Dans cette proposition relative, « par qui » exprime naturellement en français l’intermédiation ou l’agentivité de διά avec le génitif.
- source_word: ἐποίησεν
  choice: a fait
  rationale: « Faire » conserve la portée large de ποιέω sans introduire le verbe plus spécifique « créer », même si le contexte est cosmologique.
- source_word: τοὺς αἰῶνας
  choice: les âges
  rationale: La traduction formelle préserve la dimension temporelle du grec et son extension possible à l’ensemble de l’ordre créé; une note donne les formulations françaises plus interprétatives.
theological_decisions:
- issue: Force christologique de ἐν υἱῷ
  choice: en un Fils
  alternative: par un Fils; dans le Fils; par son Fils
  rationale: La formulation conserve l’expression grecque sans article et la nuance modale de ἐν. Elle ne transforme pas silencieusement le syntagme en une désignation possessive ou définie, tout en laissant le contexte identifier clairement ce Fils.
- issue: Portée de τοὺς αἰῶνας dans le rôle créateur du Fils
  choice: les âges
  alternative: l’univers; les mondes
  rationale: Le terme grec peut désigner les âges et, par extension, l’ordre créé. Le texte principal en garde l’ampleur temporelle et cosmique, tandis que la note signale les équivalents qui explicitent la dimension cosmologique.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure volontairement marquée « en un Fils » et l’expression « les âges » maintiennent les particularités et l’ambiguïté féconde du grec; les notes accompagnent le lecteur sans imposer une seule explicitation.
