  text: αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/011.yaml
  text: They will perish[a], but you remain; and they all will wear out like a garment[b],
translation:
  language: fr
  text: Eux périront, mais toi, tu demeures ; ils vieilliront tous comme un vêtement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils s’useront tous comme un vêtement ». Cette image reprend Psaumes 102.26-28 et oppose le caractère passager de la création à la permanence de celui à qui le texte s’adresse.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: Eux
  rationale: Le pronom autonome et placé en tête est emphatique. « Eux » rend naturellement le contraste marqué avec « toi » et renvoie aux cieux et à la terre du verset précédent.
- source_word: ἀπολοῦνται
  choice: périront
  rationale: Le futur de ἀπόλλυμι indique ici que les réalités créées arriveront à leur fin. « Périront » conserve la force du grec sans préciser un agent destructeur absent du texte.
- source_word: σὺ δὲ
  choice: mais toi
  rationale: Cette formulation préserve à la fois le pronom explicite et l’opposition forte entre la création passagère et celui à qui le texte s’adresse.
- source_word: διαμένεις
  choice: tu demeures
  rationale: διαμένω exprime la continuité et la permanence. « Demeurer » convient au registre du passage tout en restant clair en français actuel.
- source_word: πάντες
  choice: tous
  rationale: Le masculin pluriel reprend collectivement les cieux et la terre mentionnés auparavant. Placé après le verbe, « tous » garde une formulation française naturelle.
- source_word: ὡς ἱμάτιον
  choice: comme un vêtement
  rationale: ἱμάτιον désigne largement un vêtement ou manteau. « Vêtement » conserve l’image sans la limiter à une pièce particulière.
- source_word: παλαιωθήσονται
  choice: vieilliront
  rationale: Le passif de παλαιόω signifie devenir vieux, vieillir ou s’user avec le temps. « Vieilliront » rend directement le verbe et conserve l’image d’un vêtement soumis au vieillissement; « s’useront » est signalé en note comme autre traduction naturelle.
theological_decisions:
- issue: Identité de la personne interpellée et portée christologique
  choice: Maintenir l’adresse directe au Fils par « toi, tu demeures »
  alternative: Remplacer le pronom par une désignation explicative telle que « le Fils »
  rationale: Dans le contexte d’Hébreux 1, l’auteur applique au Fils cette citation du Psaume 102. La traduction conserve cette adresse et sa portée christologique sans introduire dans le verset une désignation qui ne figure pas dans le grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le double contraste « Eux… mais toi, tu… » reproduit l’emphase des pronoms grecs. « Vieilliront » a été retenu dans le texte pour sa proximité avec παλαιωθήσονται, tandis que « s’useront » explicite en note la nuance suggérée par l’image du vêtement.
