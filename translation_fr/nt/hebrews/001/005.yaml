id: HEB.1.5
reference: Hebrews 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: fr
  text: 'Car auquel des anges Dieu a-t-il jamais dit : « Tu es mon Fils ; aujourd’hui, je t’ai engendré »[a] ? Et encore : « Je serai pour lui un père, et il sera pour moi un fils »[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Je t’ai engendré » reprend le Psaume 2.7. La formule a été comprise en rapport avec l’intronisation royale, la résurrection ou la relation éternelle du Fils avec le Père ; la traduction en conserve les termes sans choisir entre ces interprétations.
    reason: cross_reference
  - marker: b
    text: 'Citation de 2 Samuel 7.14. On peut traduire plus couramment : « Je serai son père, et il sera mon fils. »'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι γὰρ ... τῶν ἀγγέλων
  choice: Car auquel des anges
  rationale: 'La tournure conserve le lien explicatif de γάρ et la construction interrogative avec le génitif partitif : il s’agit de demander auquel, parmi les anges, ces paroles ont été adressées.'
- source_word: εἶπέν ποτε
  choice: a-t-il jamais dit
  rationale: « Jamais » rend naturellement ποτέ dans cette question rhétorique et exprime l’absence de toute occurrence.
- source_word: ἀγγέλων
  choice: anges
  rationale: Dans le contexte d’Hébreux 1, le terme désigne les êtres célestes et non des messagers humains.
- source_word: Υἱός μου εἶ σύ
  choice: Tu es mon Fils
  rationale: Cette formulation naturelle garde l’adresse directe et la valeur titulaire de « Fils » dans l’argument christologique immédiat.
- source_word: σήμερον γεγέννηκά σε
  choice: aujourd’hui, je t’ai engendré
  rationale: Le passé composé rend convenablement le parfait grec en français. « Engendré » préserve la métaphore filiale et royale du Psaume 2 sans imposer une interprétation doctrinale précise.
- source_word: καὶ πάλιν
  choice: Et encore
  rationale: Cette formule introduit clairement une autre citation scripturaire.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Je serai pour lui un père
  rationale: La formulation conserve la construction relationnelle solennelle εἰς πατέρα tout en restant intelligible en français moderne.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: et il sera pour moi un fils
  rationale: Le parallélisme avec le premier membre est maintenu, ainsi que la tournure relationnelle de la formule d’alliance.
theological_decisions:
- issue: Sens de « aujourd’hui, je t’ai engendré »
  choice: Conserver littéralement la formule sans préciser son référent théologique
  alternative: L’expliciter comme intronisation royale, résurrection, incarnation ou relation éternelle du Fils au Père
  rationale: La citation du Psaume 2.7 porte une profondeur et une tension interprétatives que la traduction ne doit pas trancher.
- issue: Présentation de la filiation dans les deux citations
  choice: Écrire « Fils » dans l’adresse directe de la première citation et « fils » dans la formule de la seconde
  alternative: Uniformiser les deux occurrences avec une majuscule ou une minuscule
  rationale: Cette distinction rend l’emploi titulaire immédiat de la première citation tout en préservant la formulation d’alliance reprise de 2 Samuel 7.14 dans la seconde.
- issue: Sujet implicite de εἶπεν
  choice: Expliciter « Dieu »
  alternative: Employer seulement « a-t-il » en laissant l’antécédent dépendre du contexte précédent
  rationale: 'Le grec permet de récupérer le sujet dans le contexte. Son explicitation en français clarifie la question sans modifier son sens : c’est Dieu qui prononce les citations.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe des citations garde une légère solennité biblique, notamment « pour lui un père », tandis que le cadre narratif reste naturel. Les marqueurs [a] et [b] figurent dans le texte principal.
