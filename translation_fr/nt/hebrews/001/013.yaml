  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: fr
  text: 'Mais auquel des anges a-t-il jamais dit : « Assieds-toi à ma droite jusqu’à ce que je fasse de tes ennemis un marchepied sous tes pieds » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Mais auquel des anges
  rationale: 'Avec un verbe de parole, πρός introduit le destinataire : « à qui ». « Mais » rend la valeur contrastive de δέ et poursuit l’opposition entre le Fils et les anges.'
- source_word: εἴρηκέν ποτε
  choice: a-t-il jamais dit
  rationale: Le passé composé rend naturellement le parfait εἴρηκεν, tandis que ποτέ est exprimé par « jamais » dans cette question rhétorique.
- source_word: Κάθου
  choice: Assieds-toi
  rationale: Impératif français direct et naturel, convenant à l’oracle royal cité.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Expression française consacrée et idiomatique pour la place d’honneur évoquée par cette formule d’intronisation.
- source_word: ἕως ἂν θῶ
  choice: jusqu’à ce que je fasse de
  rationale: Cette construction française rend la limite future exprimée par ἕως ἂν avec le subjonctif et permet de conserver l’image prédicative du marchepied.
- source_word: τοὺς ἐχθρούς σου
  choice: tes ennemis
  rationale: Rendu direct du groupe nominal grec.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: un marchepied pour tes pieds
  rationale: Ce choix préserve l’image scripturaire concrète de la soumission des ennemis, sans la remplacer par une explication abstraite.
theological_decisions:
- issue: Préserver la portée christologique de la citation du Psaume 110.1 sans l’expliciter au-delà du texte
  choice: Conserver l’oracle direct d’intronisation et l’image du marchepied, adressés dans l’argument au Fils seul parmi les êtres comparés aux anges.
  alternative: 'Paraphraser : « jusqu’à ce que je soumette complètement tes ennemis » ou ajouter explicitement « Dieu » comme sujet.'
  rationale: L’argument de l’épître repose sur les mots mêmes de la citation et sur le contraste rhétorique avec les anges. La formulation retenue garde l’imagerie royale ainsi que le sujet implicite du grec, identifiable dans le contexte, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, de même que la citation directe et son image royale. « Marchepied » est courant et plus naturel ici que le calque « escabeau de tes pieds ».
