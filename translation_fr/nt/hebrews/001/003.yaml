id: HEB.1.3
reference: Hebrews 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: fr
  text: Lui qui est le rayonnement de sa gloire et l’empreinte exacte de son être, et qui soutient toutes choses par sa parole puissante, après avoir accompli par lui-même[a] la purification des péchés, s’est assis à la droite de la Majesté dans les hauteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « par lui-même »; l’expression est retenue ici conformément au texte du SBLGNT.
    reason: textual_variant
  - marker: b
    text: 'Ou : « là-haut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: rayonnement
  rationale: « Rayonnement » conserve l’image d’un éclat qui émane de la gloire divine, sans suggérer le simple reflet extérieur que pourrait évoquer « reflet ».
- source_word: χαρακτήρ
  choice: empreinte exacte
  rationale: Cette expression garde l’image concrète d’une marque produite par un sceau et souligne la correspondance précise.
- source_word: ὑπόστασις
  choice: être
  rationale: « Être » exprime ici la réalité profonde de Dieu sans imposer au texte le vocabulaire métaphysique plus technique élaboré ultérieurement.
- source_word: φέρων
  choice: soutient
  rationale: Le participe présent indique une action continue; « soutient » est naturel en français et rend l’idée de maintien actif.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: La formulation conserve la portée globale du grec sans la limiter au seul univers matériel.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: par sa parole puissante
  rationale: Cette tournure française naturelle rend le génitif de qualité ou d’origine sans l’expression peu idiomatique « la parole de sa puissance ».
- source_word: δι’ αὑτοῦ
  choice: par lui-même
  rationale: Avec l’accomplissement de la purification comme contexte, « par lui-même » exprime naturellement en français le moyen personnel; la présence discutée du syntagme est signalée en note.
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: la purification des péchés
  rationale: « Purification » préserve la nuance cultuelle et sacrificielle, tandis que le complément français garde la formulation ouverte du grec.
- source_word: ποιησάμενος
  choice: après avoir accompli
  rationale: Le participe aoriste désigne une action antérieure au fait de s’asseoir; « accompli » convient à l’acte de purification sans en atténuer la portée.
- source_word: ἐν δεξιᾷ
  choice: à la droite
  rationale: Expression française consacrée et naturelle pour la position d’honneur indiquée par le grec.
- source_word: ἐν ὑψηλοῖς
  choice: dans les hauteurs
  rationale: La traduction conserve l’image spatiale et le pluriel substantivé du grec; « au plus haut des cieux » serait plus interprétatif.
theological_decisions:
- issue: Portée ontologique de ὑπόστασις
  choice: être
  alternative: nature, substance ou réalité profonde
  rationale: « Être » maintient la forte affirmation concernant le rapport du Fils à Dieu tout en évitant de faire dépendre la traduction d’une terminologie conciliaire ultérieure.
- issue: Force christologique de ἀπαύγασμα et χαρακτήρ
  choice: rayonnement de sa gloire et empreinte exacte de son être
  alternative: reflet de sa gloire et représentation de sa nature
  rationale: Le choix retenu préserve les métaphores vigoureuses du texte et leur affirmation d’une correspondance exacte, sans les réduire à une représentation extérieure.
- issue: Variante textuelle δι’ αὑτοῦ
  choice: inclure « par lui-même » dans le texte
  alternative: omettre l’expression
  rationale: Le SBLGNT imprimé inclut δι’ αὑτοῦ; sa traduction figure donc dans le texte principal, tandis que son omission dans des témoins est documentée en note.
- issue: Référent des pronoms αὐτοῦ
  choice: conserver les pronoms « sa » sans expliciter « Dieu »
  alternative: expliciter « la gloire de Dieu », « l’être de Dieu » et « sa puissance »
  rationale: Le contexte permet d’identifier le référent, mais le verset grec maintient les pronoms; les conserver évite une explicitation inutile et respecte la cohésion avec le verset précédent.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve l’ampleur rhétorique du grec tout en employant des tours français naturels. « Lui qui » rattache clairement le verset à son antécédent, et les notes ne portent que sur la variante textuelle réelle et une possibilité de traduction de ἐν ὑψηλοῖς.
