  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: fr
  text: Ne sont-ils pas tous des esprits au service, envoyés pour servir ceux qui vont hériter du salut[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui hériteront du salut ». L’expression grecque est orientée vers l’avenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πάντες
  choice: Ne sont-ils pas tous
  rationale: Rend la question rhétorique qui appelle une réponse affirmative et conserve la portée inclusive de πάντες.
- source_word: λειτουργικὰ πνεύματα
  choice: des esprits au service de Dieu
  rationale: λειτουργικός évoque un service officiel ou sacré. L’ajout de « Dieu », implicite dans ce contexte céleste, permet un français naturel et évite que « esprits de service » soit obscur.
- source_word: εἰς διακονίαν
  choice: pour servir
  rationale: Exprime clairement la finalité de l’envoi, dans un français moderne, sans connotation ecclésiastique indue.
- source_word: ἀποστελλόμενα
  choice: envoyés
  rationale: Le participe passif qualifie les esprits; « envoyés » en conserve le sens sans alourdir la phrase.
- source_word: διὰ τοὺς
  choice: en faveur de ceux
  rationale: Avec l’accusatif, διά marque ici les bénéficiaires du service; « en faveur de » restitue cette valeur.
- source_word: μέλλοντας κληρονομεῖν
  choice: qui vont hériter
  rationale: « vont hériter » garde l’orientation future et prospective de μέλλω tout en préservant l’image de l’héritage.
- source_word: σωτηρίαν
  choice: du salut
  rationale: « Salut » est le terme français établi et convient à la portée eschatologique du passage.
theological_decisions:
- issue: Portée de μέλλοντας κληρονομεῖν σωτηρίαν
  choice: ceux qui vont hériter du salut
  alternative: ceux qui hériteront du salut
  rationale: La formulation retenue conserve la nuance prospective de μέλλω sans introduire une idée explicite de prédestination ni préciser davantage les modalités de cet héritage.
- issue: Référent du service sacré dans λειτουργικὰ πνεύματα
  choice: au service de Dieu
  alternative: chargés d’un service
  rationale: Le contexte identifie les anges comme serviteurs de Dieu, et cette explicitation rend l’expression idiomatique en français; elle ne transforme pas leur service en fonction ecclésiastique.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et l’image de l’héritage sont conservées; la syntaxe évite un calque lourd du participe grec.
