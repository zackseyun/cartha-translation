id: HEB.1.12
reference: Hebrews 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: fr
  text: Et, comme un manteau, tu les enrouleras ; comme un vêtement, ils seront changés. Mais toi, tu restes le même, et tes années ne prendront pas fin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tes années ne cesseront pas » ; autre traduction possible : « tes années ne s’épuiseront pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: comme un manteau
  rationale: La comparaison et l’image d’un vêtement extérieur enveloppant sont rendues naturellement, dans un registre poétique digne.
- source_word: ἑλίξεις
  choice: tu les enrouleras
  rationale: Le futur actif évoque l’action de rouler ou replier. « Enrouler » conserve nettement l’image appliquée à la création.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom masculin pluriel renvoie aux éléments de la création mentionnés dans le contexte précédent.
- source_word: ὡς ἱμάτιον
  choice: comme un vêtement
  rationale: Cette formulation préserve le singulier et le parallélisme de la seconde comparaison vestimentaire.
- source_word: ἀλλαγήσονται
  choice: ils seront changés
  rationale: Le futur passif est conservé sans préciser davantage la nature du changement.
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: Mais toi, tu restes le même
  rationale: « Mais toi » marque le contraste, tandis que « tu restes le même » exprime en français naturel la permanence indiquée par ὁ αὐτός dans ce contexte.
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: tes années ne prendront pas fin
  rationale: Cette expression communique clairement le sens temporel de ἐκλείπω — cesser ou arriver à son terme — tout en maintenant la métaphore des années.
theological_decisions:
- issue: Langage de permanence divine dans une citation appliquée au Fils
  choice: Mais toi, tu restes le même
  alternative: Mais toi, tu es le même
  rationale: La traduction préserve le contraste entre la création qui change et l’identité durable du destinataire, sans introduire de terminologie doctrinale technique absente du grec.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme vestimentaire ainsi que le contraste entre la création changeante et le destinataire permanent sont conservés. Le point-virgule respecte le mouvement de la phrase grecque.
