  text: τῶν ἁγίων λειτουργὸς καὶ τῆς σκηνῆς τῆς ἀληθινῆς, ἣν ἔπηξεν ὁ κύριος, ⸀οὐκ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/002.yaml
  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: fr
  text: ministre des lieux saints[a] et du véritable tabernacle, que le Seigneur a dressé[b], et non un être humain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le sanctuaire » ; l’expression grecque peut désigner les lieux saints du sanctuaire plutôt que des personnes saintes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a établi » ; le verbe grec peut évoquer l’action de fixer ou de monter une tente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: des lieux saints
  rationale: Dans le contexte cultuel d’Hébreux, le pluriel substantivé désigne le plus naturellement les lieux saints du sanctuaire céleste. Cette formulation conserve le pluriel grec sans le confondre avec les personnes saintes.
- source_word: λειτουργὸς
  choice: ministre
  rationale: Le terme désigne quelqu’un qui accomplit un service officiel, ici de caractère sacerdotal et cultuel. « Ministre » rend cette fonction avec concision et dignité.
- source_word: σκηνῆς
  choice: tabernacle
  rationale: Dans Hébreux, le mot évoque le tabernacle mosaïque et son correspondant céleste. « Tabernacle » conserve cette résonance biblique et cultuelle mieux que le terme générique « tente ».
- source_word: ἀληθινῆς
  choice: véritable
  rationale: Le mot qualifie ce qui correspond pleinement à la réalité ultime, par contraste implicite avec la copie terrestre. « Véritable » préserve ce sens sans explicitation excessive.
- source_word: ἔπηξεν
  choice: a dressé
  rationale: Le verbe signifie fixer, assembler ou dresser, notamment une tente. « A dressé » est naturel en français avec « tabernacle » et maintient l’image concrète.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Cette traduction usuelle conserve le titre κύριος et son article.
- source_word: οὐκ ἄνθρωπος
  choice: et non un être humain
  rationale: ἄνθρωπος désigne ici l’être humain en contraste avec le Seigneur. Cette formulation rend explicitement la portée générique du singulier et garde l’opposition concise.
theological_decisions:
- issue: Référent de τῶν ἁγίων et rapport avec le sanctuaire céleste
  choice: les lieux saints, dans un cadre cultuel et céleste
  alternative: les saints, c’est-à-dire des personnes saintes
  rationale: Hébreux 8.1-5 décrit le ministère sacerdotal du Messie dans le sanctuaire céleste. « Les lieux saints » maintient ce cadre sans transformer le passage en une affirmation sur un ministère exercé auprès de personnes.
- issue: Portée de ἄνθρωπος
  choice: un être humain, au sens générique
  alternative: un homme
  rationale: L’opposition porte sur l’œuvre du Seigneur par rapport à celle d’un humain, non sur le sexe masculin. « Un être humain » exprime précisément la portée générique du grec.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la structure appositionnelle du verset dans son contexte, le vocabulaire cultuel et l’opposition finale abrupte entre le Seigneur et l’être humain.
