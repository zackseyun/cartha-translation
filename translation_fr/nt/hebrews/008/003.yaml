id: HEB.8.3
reference: Hebrews 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: fr
  text: En effet, tout grand prêtre est établi pour présenter des dons et des sacrifices ; il est donc nécessaire que celui-ci aussi ait quelque chose à présenter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que celui-ci aussi ait quelque chose qu’il puisse présenter ». Le grec laisse le référent de « celui-ci » implicite ; dans le contexte, il s’agit de Jésus en tant que grand prêtre.'
    reason: Ambiguïté syntaxique et référent contextuel implicite.
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: En effet, tout grand prêtre
  rationale: « Tout grand prêtre » rend la valeur distributive de πᾶς avec le singulier. « En effet » exprime naturellement en français le lien explicatif marqué par γάρ.
- source_word: εἰς τὸ προσφέρειν
  choice: pour présenter
  rationale: La construction εἰς τό suivie de l’infinitif exprime ici le but. « Pour présenter » est naturel et convient au contexte cultuel.
- source_word: δῶρά τε καὶ θυσίας
  choice: des dons et des sacrifices
  rationale: Les deux catégories cultuelles restent distinctes. En français, la coordination simple rend naturellement τε καὶ sans qu’il soit nécessaire d’alourdir la phrase avec « à la fois ».
- source_word: καθίσταται
  choice: est établi
  rationale: Dans ce contexte sacerdotal, le passif désigne l’installation dans une fonction. « Est établi » conserve cette nuance institutionnelle et le registre de l’épître.
- source_word: ὅθεν
  choice: donc
  rationale: Le terme introduit une conséquence logique. « Donc » la signale clairement et avec concision.
- source_word: ἀναγκαῖον ἔχειν
  choice: il est nécessaire que … ait
  rationale: Cette tournure française rend idiomatiquement la construction impersonnelle de nécessité, avec le subjonctif requis.
- source_word: τι
  choice: quelque chose
  rationale: Le pronom indéfini désigne une offrande non précisée.
- source_word: καὶ τοῦτον
  choice: que celui-ci aussi
  rationale: « Celui-ci » préserve la valeur démonstrative de τοῦτον sans expliciter dans le texte le référent contextuel, Jésus ; « aussi » rend καί.
- source_word: ὃ προσενέγκῃ
  choice: à présenter
  rationale: L’infinitif français rattaché à « quelque chose » exprime naturellement l’action envisagée, sans surinterpréter la nuance potentielle du subjonctif aoriste.
theological_decisions:
- issue: Référent de τοῦτον (« celui-ci »)
  choice: Conserver « celui-ci » dans le texte et préciser en note qu’il s’agit, dans le contexte, de Jésus en tant que grand prêtre.
  alternative: Remplacer le démonstratif par « Jésus », « le Christ » ou « lui ».
  rationale: Le contexte identifie clairement le référent, mais le grec emploie un démonstratif. Le maintenir évite d’ajouter une identification explicite absente de la formulation du verset.
- issue: Terminologie cultuelle
  choice: Maintenir les deux catégories « dons » et « sacrifices ».
  alternative: Employer « offrandes et sacrifices » ou regrouper les deux termes en « offrandes sacrificielles ».
  rationale: Le texte énonce un principe général relatif au sacerdoce et distingue δῶρα de θυσίαι. La traduction ne doit ni fusionner ces termes ni développer ici la doctrine de l’offrande du Christ.
translation_notes:
  register: Français moderne, international et digne. « Grand prêtre » est le terme biblique usuel. « Présenter » permet de rendre le même verbe grec dans ses deux occurrences tout en restant naturel dans un contexte cultuel.
