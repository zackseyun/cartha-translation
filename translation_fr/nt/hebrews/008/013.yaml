  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: fr
  text: En disant « nouvelle »[a], il a rendu la première ancienne[b]. Or ce qui devient ancien et vieillit est près de disparaître[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsqu’il dit ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec cite seulement « nouvelle », en écho à l’expression « alliance nouvelle » de la citation précédente (Jérémie 31.31). « La première » désigne donc la première alliance.
    reason: cross_reference
  - marker: c
    text: 'Ou : « est près de s’effacer » ou « est sur le point de disparaître ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: En disant
  rationale: La construction ἐν avec l’infinitif substantivé exprime ici la circonstance, avec une possible nuance de moyen. « En disant » demeure naturel en français et conserve cette souplesse.
- source_word: Καινὴν
  choice: « nouvelle »
  rationale: L’adjectif féminin est employé elliptiquement et reprend l’expression « alliance nouvelle » de la citation précédente. Le conserver seul respecte la concision du grec.
- source_word: πεπαλαίωκεν
  choice: a rendu … ancienne
  rationale: Le parfait indique une action accomplie dont le résultat demeure. Cette formulation garde en outre le lien lexical avec παλαιούμενον dans la proposition suivante, sans réduire d’emblée le sens à la seule notion moderne d’obsolescence.
- source_word: τὴν πρώτην
  choice: la première
  rationale: L’adjectif substantivé renvoie, dans le contexte, à la première alliance. Le nom sous-entendu n’est pas ajouté au texte principal.
- source_word: τὸ δὲ παλαιούμενον
  choice: Or ce qui devient ancien
  rationale: Le participe présent décrit un processus en cours et reprend le même champ lexical que πεπαλαίωκεν.
- source_word: γηράσκον
  choice: prend de l’âge
  rationale: Cette expression française naturelle conserve l’image du vieillissement et complète sans lourdeur « devient ancien ».
- source_word: ἐγγὺς ἀφανισμοῦ
  choice: est près de disparaître
  rationale: La construction marque la proximité d’une disparition. L’infinitif français rend naturellement le nom grec ἀφανισμός dans ce contexte.
theological_decisions:
- issue: Sujet implicite de « en disant »
  choice: il
  alternative: Dieu ; l’Écriture
  rationale: Le grec ne nomme pas le sujet et renvoie au locuteur de la citation de Jérémie. Le pronom préserve cette économie sans trancher explicitement entre Dieu parlant et l’Écriture citée.
- issue: Statut de la première alliance
  choice: a rendu la première ancienne
  alternative: a rendu la première dépassée / obsolète
  rationale: Le choix retenu préserve le jeu lexical grec entre le parfait πεπαλαίωκεν et le participe παλαιούμενον, ainsi que la progression vers le vieillissement et la disparition, sans affaiblir l’argument du passage ni lui ajouter une formulation doctrinale plus technique.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition « ancienne / devient ancien » est volontaire : elle reflète la reprise lexicale du grec. « Prend de l’âge » conserve l’image organique de γηράσκον sans tournure archaïque.'
