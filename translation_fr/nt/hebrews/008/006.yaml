id: HEB.8.6
reference: Hebrews 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: fr
  text: Mais maintenant, il a obtenu un ministère d’autant plus excellent qu’il est aussi le médiateur d’une alliance meilleure[a], qui a été instituée sur de meilleures promesses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi signifier « testament » dans certains contextes; ici, « alliance » correspond à la promesse de la nouvelle alliance citée dans les versets suivants.
    reason: alternative_reading
  - marker: b
    text: Ou « a été établie »; le verbe grec évoque une institution ou une mise en vigueur de caractère légal.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Rend directement le contraste adversatif et temporel avec le service des prêtres terrestres évoqué auparavant.
- source_word: διαφορωτέρας
  choice: d’autant plus excellent
  rationale: Le comparatif exprime ici une supériorité qualitative; « excellent » convient au registre soutenu de l’épître et s’intègre naturellement à la construction corrélative.
- source_word: τέτυχεν
  choice: il a obtenu
  rationale: 'Le parfait présente un résultat acquis qui demeure: le Christ a reçu ce ministère et le possède maintenant.'
- source_word: λειτουργίας
  choice: un ministère
  rationale: Dans le contexte, le terme désigne un service sacré et sacerdotal. « Ministère » le rend sans expliciter davantage que le grec.
- source_word: ὅσῳ καὶ
  choice: d’autant plus… qu’il est aussi
  rationale: Cette construction française conserve le rapport proportionnel entre l’excellence du ministère et la supériorité de l’alliance.
- source_word: κρείττονός … διαθήκης
  choice: d’une alliance meilleure
  rationale: « Meilleure » reprend le vocabulaire comparatif caractéristique d’Hébreux; « alliance » correspond au contexte immédiat de la nouvelle alliance annoncée par Jérémie.
- source_word: μεσίτης
  choice: médiateur
  rationale: Terme précis et courant pour celui qui intervient entre les parties d’une alliance.
- source_word: ἥτις
  choice: qui
  rationale: Introduit naturellement en français la proposition descriptive renvoyant à l’alliance.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: sur de meilleures promesses
  rationale: Préserve l’image des promesses comme fondement de l’alliance, ainsi que la répétition de l’idée de supériorité.
- source_word: νενομοθέτηται
  choice: a été instituée
  rationale: Le parfait passif indique une mise en vigueur dont l’effet demeure. « Instituée » conserve la nuance normative et juridique sans la lourdeur de « légiférée ».
theological_decisions:
- issue: Sens de διαθήκη en Hébreux 8.6
  choice: alliance
  alternative: testament
  rationale: Le développement cite immédiatement la promesse de la nouvelle alliance en Jérémie et traite de sa médiation sacerdotale. « Alliance » convient donc au contexte, tout en signalant en note l’autre sens possible du terme grec.
- issue: Force juridique de νενομοθέτηται
  choice: a été instituée
  alternative: a été établie / mise en vigueur par une disposition légale
  rationale: La traduction retient l’idée d’une alliance officiellement instituée sans imposer une conception théologique plus précise de son mode de promulgation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la logique comparative serrée du grec grâce à « d’autant plus… que », tout en évitant une formulation excessivement littérale.
