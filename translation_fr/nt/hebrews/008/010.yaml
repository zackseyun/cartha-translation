id: HEB.8.10
reference: Hebrews 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: fr
  text: 'Car voici l’alliance que je conclurai avec la maison d’Israël après ces jours-là, dit le Seigneur : je mettrai mes lois dans leur intelligence et je les inscrirai sur leur cœur. Je serai leur Dieu, et ils seront mon peuple.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec emploie un participe : « mettant mes lois dans leur intelligence, et je les inscrirai sur leur cœur ».'
    reason: La note conserve la construction grecque inhabituelle, que le texte principal rend plus naturellement par deux verbes au futur.
lexical_decisions:
- source_word: διαθήκη
  choice: alliance
  rationale: Dans cette citation de Jérémie, le mot désigne l’alliance établie par Dieu, non un testament. « Alliance » conserve l’arrière-plan prophétique et l’usage biblique français.
- source_word: διαθήσομαι
  choice: je conclurai
  rationale: Dans un contexte d’alliance, διατίθεμαι signifie établir ou conclure une alliance. « Conclure une alliance » est à la fois naturel et précis en français.
- source_word: οἴκῳ Ἰσραήλ
  choice: la maison d’Israël
  rationale: Cette expression maintient la formulation collective et l’écho direct à Jérémie.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: après ces jours-là
  rationale: Rendu direct de l’expression temporelle prophétique, sans en préciser indûment la période.
- source_word: κύριος
  choice: le Seigneur
  rationale: Le grec porte κύριος. « Le Seigneur » convient au texte néotestamentaire tout en conservant la portée divine de la citation.
- source_word: διδοὺς
  choice: je mettrai
  rationale: Le participe grec, littéralement « mettant » ou « donnant », est rendu par un futur coordonné pour produire une phrase française naturelle. Une note signale la construction grecque.
- source_word: νόμους
  choice: lois
  rationale: Le pluriel explicite du grec est conservé.
- source_word: διάνοιαν
  choice: intelligence
  rationale: Le terme désigne la faculté de comprendre et de penser. « Intelligence » est idiomatique ici et se distingue de « cœur » dans le membre parallèle.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: sur leur cœur
  rationale: « Sur » respecte l’image de l’inscription. Le singulier distributif français « leur cœur » est naturel pour parler du cœur de chacun.
- source_word: ἐπιγράψω
  choice: j’inscrirai
  rationale: « Inscrire » rend avec précision l’image d’un texte écrit sur un support et reste naturel en français contemporain.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: je serai leur Dieu
  rationale: Formulation française naturelle de la formule relationnelle de l’alliance.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: ils seront mon peuple
  rationale: Cette formulation conserve la réciprocité de la formule d’alliance.
theological_decisions:
- issue: Continuité avec la promesse d’alliance de Jérémie
  choice: Conserver « alliance », « maison d’Israël », « mes lois », « leur cœur », « leur Dieu » et « mon peuple ».
  alternative: Employer une paraphrase contemporaine qui atténue les formulations prophétiques.
  rationale: La force du passage dépend de son lien manifeste avec la promesse de Jérémie; ces formulations le préservent sans ajouter d’interprétation confessionnelle.
- issue: Construction mixte du grec διδοὺς… ἐπιγράψω
  choice: Employer deux futurs coordonnés dans le texte et signaler en note le participe grec.
  alternative: Reproduire littéralement « mettant mes lois… et je les inscrirai ».
  rationale: La reproduction littérale serait maladroite en français et pourrait obscurcir le sens. Le lissage grammatical n’élimine pas la donnée textuelle, puisqu’elle est conservée en note.
- issue: Portée de « après ces jours-là »
  choice: Maintenir l’expression sans identifier explicitement les jours concernés.
  alternative: Paraphraser par une période historique ou eschatologique déterminée.
  rationale: Le grec laisse l’expression dépendre du contexte prophétique; la traduction ne doit pas trancher une question chronologique ou théologique que le verset ne précise pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide tout en maintenant le vocabulaire traditionnel de l’alliance et les échos à Jérémie. Le point médian de la citation est rendu par deux phrases pour éviter une coordination trop lourde.
