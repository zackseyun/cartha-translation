source:
  edition: SBLGNT
  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: fr
  text: En effet, si cette première alliance[a] avait été irréprochable, aucune place n’aurait été recherchée pour une seconde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « cette première »; le mot « alliance » est sous-entendu d’après le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « aucune place n’aurait été recherchée pour une seconde »; le sens peut aussi être « on n’aurait pas cherché d’occasion pour une seconde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: En effet, si
  rationale: γάρ rattache le verset à l’argument précédent en introduisant une explication, tandis que εἰ conserve la force conditionnelle. « En effet, si » est naturel en français moderne.
- source_word: ἡ πρώτη ἐκείνη
  choice: cette première alliance
  rationale: Le syntagme grec signifie littéralement « cette première » au féminin et renvoie, dans le contexte immédiat, à l’alliance. Le nom est explicité en français pour éviter une ellipse peu naturelle.
- source_word: ἦν ἄμεμπτος
  choice: avait été irréprochable
  rationale: ἄμεμπτος désigne ce qui ne donne prise à aucun reproche. Le plus-que-parfait français convient à cette condition contraire aux faits sans préciser en quoi consistait le défaut évoqué.
- source_word: οὐκ ἂν … ἐζητεῖτο
  choice: on n’aurait pas cherché
  rationale: La négation avec ἄν exprime la conséquence irréelle. Le pronom indéfini « on » rend naturellement le passif grec sans désigner un agent absent du texte.
- source_word: τόπος
  choice: à faire place
  rationale: Avec ζητέω, τόπος forme ici une expression évoquant la place, l’occasion ou la possibilité accordée à autre chose. « Chercher à faire place » préserve l’image tout en restant idiomatique.
- source_word: δευτέρας
  choice: à une seconde
  rationale: L’adjectif féminin substantivé renvoie lui aussi à une alliance. L’ellipse est naturelle en français puisque « alliance » vient d’être explicitement mentionné.
theological_decisions:
- issue: Explicitation du mot « alliance », absent de ce verset en grec
  choice: cette première alliance
  alternative: cette première
  rationale: Le féminin ἡ πρώτη ἐκείνη reprend l’alliance mentionnée dans le contexte immédiat. L’explicitation clarifie le référent sans ajouter de proposition doctrinale.
- issue: Nature du défaut de la première alliance
  choice: avait été irréprochable
  alternative: avait été sans défaut
  rationale: La formulation conserve la portée conditionnelle de ἄμεμπτος sans déterminer si le reproche concerne l’alliance elle-même, sa mise en œuvre ou les personnes qui y participent; le verset suivant développe l’argument.
- issue: Sens de « place » pour une seconde
  choice: cherché à faire place à une seconde
  alternative: cherché une occasion pour une seconde
  rationale: Cette formulation maintient l’image de τόπος sans transformer explicitement la seconde alliance en simple remplacement ni préciser qui en recherche la place.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « faire place à » conserve l’image grecque tout en évitant un calque passif peu naturel. Les deux adjectifs féminins renvoient à « alliance », explicitée une seule fois dans le corps du texte.
