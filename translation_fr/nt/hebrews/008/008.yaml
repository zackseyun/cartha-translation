  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: fr
  text: 'Car c’est en leur adressant des reproches qu’il dit : « Voici que des jours viennent, dit le Seigneur, où je conclurai une alliance nouvelle avec la maison d’Israël et avec la maison de Juda, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος … αὐτοὺς
  choice: en leur adressant des reproches
  rationale: Rend explicitement le participe grec et son objet humain, tout en conservant le lien causal introduit par γάρ.
- source_word: Ἰδού
  choice: Voici que
  rationale: Formule française naturelle et digne qui garde la valeur d’annonce solennelle du grec.
- source_word: συντελέσω … διαθήκην καινήν
  choice: je conclurai une alliance nouvelle
  rationale: « Conclure une alliance » est l’expression française idiomatique correspondant ici à l’action d’établir formellement l’alliance; « nouvelle » conserve l’ordre conceptuel et le sens de καινήν.
- source_word: ἐπὶ τὸν οἶκον
  choice: avec la maison
  rationale: Dans cette construction relative à une alliance, ἐπί désigne les parties envers lesquelles l’alliance est établie; « avec » est naturel en français et conforme au sens contextuel.
theological_decisions:
- issue: Référent de « leur » dans μεμφόμενος … αὐτούς
  choice: Conserver le pronom personnel « leur » sans expliciter davantage son référent
  alternative: « en adressant des reproches au peuple »
  rationale: Le texte grec emploie un pronom masculin pluriel. L’expliciter comme « le peuple » lèverait une référence que le verset lui-même laisse implicite.
- issue: Portée de l’« alliance nouvelle »
  choice: Nommer sans paraphrase la maison d’Israël et la maison de Juda
  alternative: Les remplacer ou les élargir par une désignation interprétative du peuple de Dieu
  rationale: La traduction garde les destinataires expressément nommés dans la citation et n’importe aucune conclusion ecclésiologique.
translation_notes:
  register: Français international moderne, lisible et solennel. La ponctuation présente clairement l’introduction de la citation; le vocabulaire reste courant sans affaiblir le registre scripturaire.
