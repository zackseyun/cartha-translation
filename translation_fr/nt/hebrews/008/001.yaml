id: HEB.8.1
reference: Hebrews 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: fr
  text: Le point essentiel de ce qui est dit[a], c’est que nous avons un tel grand prêtre, qui s’est assis à la droite du trône de la Majesté dans les cieux[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le résumé » ou « le point principal » de ce qui est dit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au ciel » ; le grec porte littéralement « dans les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: le point essentiel
  rationale: Dans cette transition argumentative, le terme désigne le point principal ou la synthèse, et non un « chapitre » au sens littéral.
- source_word: δὲ
  choice: marqué par la construction française, sans mot autonome
  rationale: δέ introduit ici une transition légère. En français, la formulation initiale et la tournure « c’est que » assurent naturellement cette transition sans ajouter « maintenant ».
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: de ce qui est dit
  rationale: Cette formulation conserve le présent passif et reste naturelle, tout en laissant ouverte la portée entre les propos en cours et l’argument exposé.
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: nous avons un tel grand prêtre
  rationale: La traduction garde le renvoi de τοιοῦτον au grand prêtre décrit précédemment et rend directement la possession exprimée par ἔχομεν.
- source_word: ἐκάθισεν
  choice: s’est assis
  rationale: Le passé composé exprime en français l’acte accompli de prendre place, sans développer explicitement sa portée théologique.
- source_word: ἐν δεξιᾷ
  choice: à la droite
  rationale: Cette locution française traditionnelle et intelligible conserve l’image biblique du lieu d’honneur et d’autorité.
- source_word: τῆς μεγαλωσύνης
  choice: de la Majesté
  rationale: La majuscule signale la désignation révérencielle de Dieu tout en conservant la périphrase du grec plutôt que de la remplacer par « Dieu ».
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel français correspond au pluriel grec et demeure naturel dans le registre biblique moderne.
theological_decisions:
- issue: Explicitation du référent de « la Majesté »
  choice: Conserver « la Majesté » comme désignation révérencielle.
  alternative: « Dieu » ou « la Majesté suprême »
  rationale: Le texte grec emploie une périphrase élevée plutôt que θεός ; la conserver évite une explicitation absente de la source.
- issue: Portée théologique de l’acte de s’asseoir
  choice: Traduire simplement par « s’est assis ».
  alternative: « a pris place après avoir achevé son œuvre »
  rationale: Le contexte de l’épître permet de comprendre l’accomplissement de l’œuvre sacerdotale, mais le verset ne doit pas être développé par une explication doctrinale ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure disloquée « Le point essentiel…, c’est que… » rend naturellement la structure grecque. « Grand prêtre » est écrit sans trait d’union selon l’usage français courant. La virgule finale signale que la phrase se poursuit au verset suivant.
