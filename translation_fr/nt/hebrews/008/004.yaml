source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: fr
  text: S’il était sur terre, il ne serait même pas prêtre, puisqu’il y en a qui présentent les dons[a] conformément à la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les offrandes ». Le grec dit littéralement « les dons », terme couramment employé dans un contexte sacrificiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: S’il
  rationale: La combinaison introduit une transition logique et une condition. En français, « S’il » rend naturellement la condition sans alourdir la phrase par des particules supplémentaires.
- source_word: ἦν
  choice: était
  rationale: Avec la proposition principale comportant ἄν, l’imparfait exprime ici une condition contraire au fait; la construction française « s’il était… il ne serait pas » en restitue clairement la valeur.
- source_word: ἐπὶ γῆς
  choice: sur terre
  rationale: Cette expression naturelle en français marque le contraste contextuel entre la sphère terrestre et la sphère céleste.
- source_word: οὐδ’ ἂν ἦν
  choice: il ne serait même pas
  rationale: « Même pas » conserve l’insistance de οὐδέ dans l’apodose conditionnelle.
- source_word: ἱερεύς
  choice: prêtre
  rationale: Terme français courant et précis pour la fonction cultuelle désignée.
- source_word: ὄντων τῶν προσφερόντων
  choice: puisqu’il y a ceux qui présentent
  rationale: Le génitif absolu fournit ici la circonstance qui justifie l’affirmation précédente. « Puisque » exprime cette valeur causale, tandis que « ceux qui présentent » évite d’ajouter explicitement un nom absent du grec.
- source_word: κατὰ νόμον
  choice: conformément à la Loi
  rationale: La formule indique que les dons sont présentés selon les prescriptions de la Loi mosaïque. La majuscule signale cette référence déterminée sans développer davantage.
- source_word: τὰ δῶρα
  choice: les dons
  rationale: « Dons » conserve le sens lexical de δῶρα et sa nuance cultuelle dans ce contexte, sans confondre le nom avec le verbe προσφέρω, rendu par « présentent ».
theological_decisions:
- issue: Sujet implicite de la proposition conditionnelle
  choice: Employer « il », qui renvoie à Jésus, sujet du contexte immédiat.
  alternative: Répéter explicitement « Jésus » ou « le Messie ».
  rationale: Le français exige un sujet exprimé. Le pronom respecte l’ellipse grecque et renvoie naturellement à l’antécédent contextuel sans ajouter une identification dans le verset lui-même.
- issue: Valeur de la condition
  choice: 'Rendre la construction comme une condition contraire au fait : « S’il était… il ne serait même pas… »'
  alternative: Employer une formulation moins nettement irréelle, telle que « S’il est… il n’est pas… ».
  rationale: La structure εἰ avec l’imparfait, suivie de ἄν et de l’imparfait, appelle naturellement en français une hypothèse irréelle au présent.
- issue: Identité de « ceux qui présentent »
  choice: Conserver la désignation générale du grec sans ajouter « les prêtres ».
  alternative: Traduire « puisqu’il y a déjà des prêtres qui présentent… ».
  rationale: Le contexte permet de comprendre qu’il s’agit des prêtres, mais le substantif n’est pas exprimé dans cette proposition. La formulation retenue préserve cette économie et évite une explicitation doctrinale inutile.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la logique conditionnelle et l’insistance du grec. Le marqueur de note est placé après « dons », terme auquel la variante lexicale se rapporte.
