- from: S’il était sur terre, il ne serait même pas prêtre, puisqu’il y a ceux qui présentent les dons[a] conformément à la Loi.
  to: S’il était sur terre, il ne serait même pas prêtre, puisqu’il y en a qui présentent les dons[a] conformément à la Loi.
  rationale: Remplacement de « puisqu’il y a ceux qui présentent » par « puisqu’il y en a qui présentent », formulation idiomatique qui préserve le génitif absolu causal ainsi que l’absence, dans le grec, d’un substantif identifiant explicitement les offrants. La note et son ancrage sont maintenus.
