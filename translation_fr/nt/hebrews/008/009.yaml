id: HEB.8.9
reference: Hebrews 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: fr
  text: non pas comme l’alliance que j’ai conclue avec leurs pères, le jour où je les ai pris par la main[a] pour les faire sortir du pays d’Égypte. En effet, ils ne sont pas demeurés dans mon alliance, et moi, je me suis désintéressé d’eux[b], dit le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « où j’ai saisi leur main ».'
    reason: lexical_alternative
  - marker: b
    text: 'La citation suit ici le texte grec repris dans Hébreux : « je me suis désintéressé d’eux ». Le texte hébreu de Jérémie 31.32 présente un sens différent, souvent traduit par « bien que je fusse leur époux » ou « bien que je fusse leur maître ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: alliance
  rationale: Dans Hébreux et dans la citation de Jérémie 31, le terme désigne l’engagement d’alliance de Dieu, non un testament.
- source_word: ἐποίησα
  choice: j’ai conclue
  rationale: En français, « conclure une alliance » est l’expression naturelle correspondant à ποιέω avec διαθήκη.
- source_word: πατράσιν
  choice: pères
  rationale: Le grec emploie un pluriel masculin désignant les pères d’Israël; « pères » en conserve la forme et la portée historique.
- source_word: ἐν ἡμέρᾳ
  choice: le jour où
  rationale: Cette tournure garde l’image temporelle concrète tout en étant idiomatique en français.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: où je les ai pris par la main
  rationale: La formulation française naturelle conserve l’image de Dieu prenant son peuple par la main; une note signale la formulation plus littérale.
- source_word: ἐξαγαγεῖν
  choice: pour les faire sortir
  rationale: ἐξάγω exprime ici l’action de faire sortir d’Égypte; cette traduction s’accorde naturellement avec l’image précédente.
- source_word: γῆς Αἰγύπτου
  choice: du pays d’Égypte
  rationale: « Pays d’Égypte » rend explicitement γῆς sans alourdir le français.
- source_word: ἐνέμειναν
  choice: ne sont pas demeurés dans
  rationale: Le verbe exprime le fait de rester ou de persévérer dans un engagement; « demeurer dans l’alliance » garde cette nuance relationnelle.
- source_word: κἀγὼ
  choice: et moi
  rationale: Cette traduction respecte la simple coordination du grec sans introduire explicitement une conséquence absente de la conjonction.
- source_word: ἠμέλησα αὐτῶν
  choice: je me suis désintéressé d’eux
  rationale: La tournure rend l’idée de ne plus se soucier d’eux ou de ne plus leur accorder d’attention, sans renforcer indûment le verbe en rejet actif.
- source_word: λέγει κύριος
  choice: dit le Seigneur
  rationale: Formule française courante de citation prophétique, fidèle au présent λέγει et au titre κύριος.
theological_decisions:
- issue: Sens de ἠμέλησα αὐτῶν dans une citation où le texte grec d’Hébreux et le texte hébreu de Jérémie 31.32 divergent
  choice: je me suis désintéressé d’eux
  alternative: bien que je fusse leur époux / leur maître
  rationale: Le texte grec d’Hébreux porte clairement ἠμέλησα αὐτῶν et doit gouverner la traduction. La note conserve toutefois la différence intertextuelle importante avec le texte hébreu de Jérémie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la citation grecque, tandis que « prendre par la main » et « conclure une alliance » assurent un français naturel. Les marqueurs [a] et [b] figurent dans le texte.
