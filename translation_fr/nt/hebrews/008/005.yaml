source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: fr
  text: 'Ils accomplissent leur service dans une copie et une ombre des réalités célestes, comme Moïse avait reçu de Dieu l’instruction[a] au moment où il allait construire le tabernacle[b]. Car il est dit : « Veille à tout faire d’après le modèle qui t’a été montré sur la montagne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait été averti par Dieu »; le verbe grec peut mettre l’accent sur un avertissement ou une mise en garde d’origine divine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « achever le tabernacle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ils
  rationale: Le pronom reprend naturellement en français les prêtres mentionnés dans le contexte, sans surcharger la nuance qualitative du relatif grec.
- source_word: ὑποδείγματι καὶ σκιᾷ
  choice: dans ce qui est une copie et une ombre
  rationale: « Copie » exprime la correspondance de la réalité terrestre avec la réalité céleste, tandis que « ombre » conserve la métaphore et l’infériorité suggérée par le texte. La tournure française explicite seulement le rapport syntaxique nécessaire à la clarté.
- source_word: λατρεύουσιν
  choice: accomplissent leur service
  rationale: Le verbe désigne ici le service cultuel des prêtres. Le contexte rend inutile l’ajout interprétatif de « culte » ou « adoration ».
- source_word: τῶν ἐπουρανίων
  choice: des réalités célestes
  rationale: « Réalités » évite l’expression peu naturelle « choses célestes » tout en conservant la portée large du neutre pluriel et sans réduire le sens à un simple lieu.
- source_word: κεχρημάτισται
  choice: avait reçu de Dieu l’instruction
  rationale: La formulation rend explicite la source divine impliquée et conserve la dimension directive du verbe; sa possible nuance d’avertissement est signalée en note.
- source_word: μέλλων ἐπιτελεῖν τὴν σκηνήν
  choice: au moment où il allait construire le tabernacle
  rationale: La tournure prospective de μέλλων est conservée. Dans ce contexte, « construire » rend naturellement l’exécution de l’ouvrage, tandis que la valeur possible d’achèvement de ἐπιτελεῖν est donnée en note.
- source_word: Ὅρα
  choice: Veille
  rationale: L’impératif introduit une consigne insistante; « Veille » est idiomatique en français et garde la nuance d’admonition.
- source_word: ποιήσεις πάντα
  choice: à tout faire
  rationale: Après « Veille », l’infinitif est la formulation française naturelle de l’ordre exprimé par le futur grec à valeur impérative.
- source_word: κατὰ τὸν τύπον
  choice: d’après le modèle
  rationale: « Modèle » désigne clairement la forme révélée que la construction terrestre doit reproduire.
theological_decisions:
- issue: Rapport entre le sanctuaire terrestre et les réalités célestes
  choice: « une copie et une ombre des réalités célestes »
  alternative: « une représentation et une ombre des choses célestes »
  rationale: La traduction maintient à la fois la correspondance réelle et l’infériorité du service terrestre, sans réduire celui-ci à un symbole arbitraire ni définir davantage la nature des réalités célestes.
- issue: Portée de κεχρημάτισται
  choice: « avait reçu de Dieu l’instruction »
  alternative: « avait été averti par Dieu »
  rationale: Le choix principal conserve la communication divine et sa force directive. La note maintient ouverte la nuance d’avertissement présente dans le verbe et renforcée par l’impératif de la citation.
- issue: Identité du sujet de φησίν
  choice: « Il lui dit en effet »
  alternative: « car il est dit »
  rationale: Le pronom conserve la formulation personnelle du grec et renvoie naturellement à Dieu, source de l’instruction, sans ajouter un nom absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Tabernacle » est retenu comme terme biblique établi pour la tente-sanctuaire mosaïque. Les marqueurs de note sont placés immédiatement après les expressions auxquelles leurs variantes se rapportent.
