revisions:
- from: 'Ils accomplissent leur service dans ce qui est une copie et une ombre des réalités célestes, comme Moïse en avait reçu de Dieu l’instruction[a] au moment où il allait construire le tabernacle[b]. Il lui dit en effet : « Veille à tout faire d’après le modèle qui t’a été montré sur la montagne. »'
  to: 'Ils accomplissent leur service dans une copie et une ombre des réalités célestes, comme Moïse avait reçu de Dieu l’instruction[a] au moment où il allait construire le tabernacle[b]. Car il est dit : « Veille à tout faire d’après le modèle qui t’a été montré sur la montagne. »'
  rationale: La révision corrige la représentation de φησίν en évitant de lui attribuer un temps passé et un complément indirect non formulés dans le grec. Elle allège aussi légèrement la première proposition, sans modifier le sens ni résoudre au-delà du texte l’identité du locuteur de la citation. Les ancres et les deux notes restent correctement rattachées aux expressions concernées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:42:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : le service sacerdotal se rapporte à une copie et une ombre des réalités célestes, et la citation conserve l’ordre de conformité au modèle révélé. Toutefois, « Il lui dit » transforme le φησίν grec (« il dit ») en un verbe au passé et ajoute une relation indirecte que le grec ne formule pas explicitement. Une formulation citationnelle impersonnelle permet de conserver l’absence de sujet exprimé tout en restant idiomatique.'
  naturalness: Le français est globalement moderne et clair. « Dans ce qui est une copie et une ombre » est compréhensible, mais « dans une copie et une ombre » rend plus directement la construction cultuelle sans l’explicitation lourde de « ce qui est ». « Il lui dit en effet » est moins naturel dans l’enchaînement d’une citation scripturaire que « Car il est dit ».
  terminology: « Copie », « ombre », « réalités célestes », « tabernacle » et « modèle » sont des choix justes et cohérents. « Accomplissent leur service » convient au service cultuel. La note sur κεχρημάτισται préserve adéquatement la nuance possible d’avertissement, et celle sur ἐπιτελεῖν conserve l’alternative « achever ».
  issues:
  - severity: medium
    issue: « Il lui dit en effet » ne reflète pas adéquatement φησίν.
    rationale: φησίν est au présent et son sujet n’est pas exprimé. Le passé « dit » et le complément « lui » introduisent une précision syntaxique absente du grec. « Car il est dit » est une manière française naturelle de rattacher la citation sans déterminer indûment le sujet.
  - severity: low
    issue: La formulation « dans ce qui est une copie et une ombre » est plus paraphrastique que nécessaire.
    rationale: Elle reste défendable, mais « dans une copie et une ombre des réalités célestes » exprime plus directement le rapport du service cultuel à la copie et à l’ombre, tout en étant naturel dans le registre biblique moderne.
  revised_text: 'Ils accomplissent leur service dans une copie et une ombre des réalités célestes, comme Moïse avait reçu de Dieu l’instruction[a] au moment où il allait construire le tabernacle[b]. Car il est dit : « Veille à tout faire d’après le modèle qui t’a été montré sur la montagne. »'
