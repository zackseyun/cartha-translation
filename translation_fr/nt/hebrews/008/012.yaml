id: HEB.8.12
reference: Hebrews 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: fr
  text: Car je serai clément à l’égard de leurs injustices[a], et je ne me souviendrai plus jamais de leurs péchés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leurs actes injustes ». Le pluriel grec peut désigner des injustices concrètes ou des actes mauvais.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la tournure grecque marque une négation très forte : « je ne me souviendrai certainement plus de leurs péchés ». Dans le contexte de l’alliance, cette expression affirme un pardon entier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans cette citation, ὅτι introduit l’explication ou le fondement de la promesse précédente. « Car » en conserve naturellement la valeur explicative.
- source_word: ἵλεως ἔσομαι
  choice: je serai clément
  rationale: ἵλεως exprime une disposition favorable et miséricordieuse, ici dans le contexte du pardon. « Je serai clément » reste proche de la forme grecque sans recourir à un terme théologique technique.
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: à l’égard de leurs injustices
  rationale: Le datif dépend de ἵλεως. Le pluriel ἀδικίαις peut désigner des injustices ou des actes injustes; « leurs injustices » préserve le pluriel et évite d’ajouter un nom absent du grec.
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination simple.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: de leurs péchés
  rationale: ἁμαρτία se traduit normalement par « péché »; le pluriel grec est conservé.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: je ne me souviendrai plus jamais
  rationale: La construction οὐ μή avec le subjonctif exprime une négation future très forte, tandis que ἔτι signifie « encore » ou « désormais ». « Plus jamais » rend clairement cette insistance en français courant.
theological_decisions:
- issue: Portée du non-souvenir divin
  choice: Conserver l’image biblique selon laquelle Dieu ne se souviendra plus jamais des péchés
  alternative: Expliciter dans le texte principal que Dieu ne les imputera plus ou qu’il les pardonnera pleinement
  rationale: La formulation grecque exprime le pardon de l’alliance par le langage du souvenir sans expliquer directement son rapport à la connaissance divine. Le texte principal conserve cette image et la note en indique la portée contextuelle sans remplacer l’idiome biblique.
translation_notes:
  register: Français international moderne, digne et accessible. « Clément » maintient la structure et la retenue du grec, tandis que « plus jamais » rend sans lourdeur la forte négation originale.
