  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: fr
  text: 'Et personne n’enseignera jamais son concitoyen ni son frère en disant : « Connais le Seigneur ! » Car tous me connaîtront, du plus petit au plus grand parmi eux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: aucun n’enseignera plus
  rationale: La double négation οὐ μή avec le subjonctif aoriste exprime une négation future appuyée. En français, « aucun n’enseignera plus » restitue naturellement cette cessation certaine dans le cadre de la nouvelle alliance.
- source_word: ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: son concitoyen ni son frère
  rationale: Après « aucun », la répétition distributive de ἕκαστος peut être allégée sans perdre le sens. « Concitoyen » traduit précisément πολίτης, tandis que « frère » conserve la forme masculine et le langage familial du texte grec.
- source_word: Γνῶθι τὸν κύριον
  choice: Connais le Seigneur !
  rationale: L’impératif aoriste Γνῶθι est rendu directement par l’impératif français « Connais ». « Seigneur » est l’équivalent établi de κύριος et convient à cette citation d’alliance.
- source_word: πάντες εἰδήσουσίν με
  choice: tous me connaîtront
  rationale: Cette formulation conserve πάντες, le futur de οἶδα et l’objet explicite « me », dans un ordre naturel en français.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: du plus petit au plus grand parmi eux
  rationale: La formule désigne l’ensemble du groupe à travers toute l’échelle des positions ou des conditions. « Parmi eux » rattache clairement αὐτῶν aux personnes concernées sans limiter l’expression au seul âge.
theological_decisions:
- issue: Traduction de πολίτην dans la citation de Jérémie 31.34
  choice: concitoyen
  alternative: prochain
  rationale: Le texte grec de l’épître aux Hébreux porte πολίτην, « concitoyen », alors que la formulation de Jérémie est souvent rendue par « prochain ». La primauté du texte grec conservé justifie « concitoyen » dans le corps du verset, avec l’autre formulation signalée en note.
- issue: Langage familial masculin dans ἀδελφόν
  choice: frère
  alternative: frère ou sœur
  rationale: Le grec emploie un nom masculin singulier dans une construction distributive. « Frère » en préserve la forme et l’image familiale, sans nier que la promesse vise toute la communauté de l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite la répétition lourde de « chacun » grâce à « aucun », tout en conservant la portée distributive. La ponctuation met nettement en relief l’exhortation citée.
