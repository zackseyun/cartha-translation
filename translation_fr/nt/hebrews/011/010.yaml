id: HEB.11.10
reference: Hebrews 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: fr
  text: Car il attendait la cité qui a des fondations[a], celle dont Dieu est l’architecte et le bâtisseur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la cité ayant les fondations ». Le pluriel peut souligner sa permanence et sa stabilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le concepteur et le constructeur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: attendait
  rationale: L’imparfait exprime une attente continue dans le passé; « attendait » est naturel et conserve cet aspect duratif.
- source_word: γὰρ
  choice: Car
  rationale: Marque le lien explicatif avec le séjour d’Abraham évoqué au verset précédent.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: la cité qui a des fondations
  rationale: Conserve la construction participiale, l’article défini et le pluriel « fondations », tout en restant idiomatique en français.
- source_word: θεμελίους
  choice: fondations
  rationale: Équivalent courant qui maintient le pluriel grec et l’image de stabilité opposée aux tentes du contexte.
- source_word: πόλιν
  choice: cité
  rationale: « Cité » convient au registre biblique digne et au motif théologique de la cité de Dieu, sans être archaïque ni ajouter l’adjectif « céleste ».
- source_word: ἧς
  choice: celle dont
  rationale: Reprend clairement « la cité » et introduit naturellement en français la relation exprimée par le génitif relatif.
- source_word: τεχνίτης
  choice: architecte
  rationale: Dans cette paire, « architecte » met en valeur la conception et distingue le terme de δημιουργός.
- source_word: δημιουργός
  choice: bâtisseur
  rationale: Dans le contexte d’une cité, « bâtisseur » maintient l’image de construction et complète naturellement « architecte ».
- source_word: ὁ θεός
  choice: Dieu
  rationale: Rend directement le sujet explicite de la proposition grecque.
theological_decisions:
- issue: Nature de la cité promise
  choice: la cité qui a des fondations
  alternative: la cité céleste; la cité aux fondations permanentes
  rationale: Le verset caractérise la cité par ses fondations et par l’action de Dieu, mais ne la qualifie pas explicitement de « céleste » ici. La formulation préserve donc l’image et l’ouverture du texte.
- issue: Rapport entre τεχνίτης et δημιουργός
  choice: architecte et bâtisseur
  alternative: concepteur et créateur; artisan et constructeur
  rationale: La paire choisie distingue la conception de la réalisation sans imposer à δημιουργός le sens théologique plus chargé de « Créateur ».
translation_notes:
  register: Français international moderne, naturel et digne. « Cité » conserve la portée solennelle du motif sans expliciter une identification théologique absente du verset. Les deux notes sont signalées dans le texte principal.
