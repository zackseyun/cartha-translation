id: HEB.11.27
reference: Hebrews 11:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: fr
  text: Par la foi, il quitta l’Égypte[a] sans craindre la colère du roi, car il tint ferme, comme s’il voyait celui qui est invisible[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation grecque peut renvoyer soit à la fuite de Moïse devant le pharaon (Exode 2), soit à la sortie d’Égypte avec Israël (Exode 12–14) ; elle ne précise pas elle-même l’épisode.
    reason: cross_reference
  - marker: b
    text: 'On pourrait aussi traduire : « l’Invisible » ou « celui qu’on ne voit pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen ou la manière. « Par la foi » reprend naturellement le motif structurant d’Hébreux 11.
- source_word: κατέλιπεν
  choice: il quitta
  rationale: Dans ce contexte, καταλείπω signifie partir d’un lieu. « Il quitta » est direct, naturel et n’ajoute pas l’idée plus forte d’un abandon.
- source_word: μὴ φοβηθεὶς
  choice: sans craindre
  rationale: Cette tournure française rend avec concision le participe grec négatif et son lien circonstanciel avec le verbe principal.
- source_word: τὸν θυμὸν τοῦ βασιλέως
  choice: la colère du roi
  rationale: θυμός désigne une vive colère. « Colère » est actuel et digne, sans la coloration parfois théologique de « courroux » ni l’intensification de « fureur ».
- source_word: τὸν ἀόρατον
  choice: celui qui est invisible
  rationale: L’adjectif substantivé et articulé désigne une personne. Cette formulation explicite naturellement cette valeur tout en conservant le paradoxe de voir l’invisible.
- source_word: ὡς ὁρῶν
  choice: comme s’il voyait
  rationale: Cette formulation rend la valeur comparative de ὡς avec le participe et demeure idiomatique en français. Elle ne prétend pas à une vision physique, mais maintient l’image vive du texte.
- source_word: ἐκαρτέρησεν
  choice: il tint ferme
  rationale: καρτερέω exprime une endurance résolue et persistante. « Il tint ferme » convient au contexte de la menace royale et reste naturel en français moderne.
theological_decisions:
- issue: Épisode historique visé par « il quitta l’Égypte »
  choice: Le texte principal ne précise pas s’il s’agit de la fuite de Moïse ou de la sortie d’Égypte avec Israël.
  alternative: Identifier explicitement soit la fuite racontée en Exode 2, soit l’exode raconté en Exode 12–14.
  rationale: Le grec dit seulement qu’il quitta l’Égypte. Comme l’épisode précis est discuté et que la formulation ne le tranche pas, la traduction conserve cette ambiguïté.
- issue: Nature de la perception de celui qui est invisible
  choice: Conserver la comparaison paradoxale « comme s’il voyait celui qui est invisible ».
  alternative: Interpréter explicitement cette perception comme une vision spirituelle ou comme une simple certitude intérieure.
  rationale: Le texte associe volontairement « voyant » et « invisible » sans expliquer le mode de perception. La traduction préserve cette tension plutôt que de la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le rythme narratif du grec ainsi que le paradoxe final, sans employer de vocabulaire confessionnel spécialisé.
