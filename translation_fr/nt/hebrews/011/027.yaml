  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : πίστει (« Par la foi »), κατέλιπεν (« il quitta »), μὴ φοβηθεὶς (« sans craindre »), τὸν θυμὸν τοῦ βασιλέως (« la colère du roi ») et ἐκαρτέρησεν (« il tint ferme »). La comparaison paradoxale ὡς ὁρῶν τὸν ἀόρατον est correctement conservée par « comme s’il voyait celui qui est invisible », sans expliquer indûment la nature de cette perception.'
  naturalness: Le français est moderne, clair et suffisamment soutenu pour le registre de l’épître. « Il tint ferme » est idiomatique et exprime bien l’endurance résolue, tandis que « comme s’il voyait » est une formulation française naturelle pour la comparaison grecque.
  terminology: « Foi », « colère », « roi » et « celui qui est invisible » sont justes et ne portent pas de surcharge confessionnelle. Les notes conservent à bon droit l’ambiguïté historique concernant le départ d’Égypte et signalent une alternative lexicale recevable pour τὸν ἀόρατον.
