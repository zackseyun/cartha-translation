source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: fr
  text: Et que dirai-je encore ? Car le temps me manquerait[a] si je devais raconter l’histoire de Gédéon, Barak, Samson, Jephté, David, Samuel et les prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Car le temps me manquera si je raconte… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Et que dirai-je encore ?
  rationale: Cette question rhétorique naturelle en français conserve l’élan du discours et introduit les autres exemples sans laisser entendre que l’auteur attend une réponse.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: En effet, le temps me manquerait
  rationale: « En effet » rend la valeur explicative de γάρ. Le conditionnel français exprime naturellement la portée rhétorique et hypothétique du futur grec dans ce contexte.
- source_word: διηγούμενον περὶ
  choice: si je racontais ce qui concerne
  rationale: Cette formulation rend le participe de circonstance et περί sans réduire l’expression à une simple mention; elle reste claire et idiomatique.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gédéon, Barak, Samson, Jephté, David, Samuel
  rationale: Les noms suivent leurs formes françaises usuelles, avec « Barak » conservé par translittération courante.
- source_word: τε καὶ
  choice: ainsi que
  rationale: Cette locution garde la nuance de liaison additive entre David et Samuel sans surcharger la phrase.
- source_word: τῶν προφητῶν
  choice: les prophètes
  rationale: Le groupe nominal défini est rendu directement et désigne collectivement les figures prophétiques.
theological_decisions:
- issue: Portée de l’affirmation sur le temps
  choice: 'Une formulation rhétorique au conditionnel : « le temps me manquerait »'
  alternative: 'Le futur plus formel : « le temps me manquera »'
  rationale: Le futur grec présente ce qui arriverait si l’auteur poursuivait son récit. Le conditionnel français conserve cette fonction discursive sans transformer l’énoncé en affirmation absolue.
- issue: Regroupement de Samuel et des prophètes
  choice: « David, ainsi que Samuel et les prophètes »
  alternative: « David, Samuel et les prophètes »
  rationale: La traduction maintient la légère articulation additive de τε καὶ, tout en laissant Samuel distinct du groupe collectif des prophètes sans trancher la question de sa classification.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant la question rhétorique, la relation explicative et la légère nuance additive de la liste.
