source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: fr
  text: Par la foi, il a célébré la Pâque et fait l’aspersion du sang[a], afin que le destructeur des premiers-nés ne les touche pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’application du sang ». Le terme grec désigne le geste rituel par lequel le sang est placé ; « aspersion » est la traduction cultuelle traditionnelle, tandis qu’« application » peut correspondre plus précisément au récit de la Pâque.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen. Cette formulation naturelle reprend le refrain qui structure Hébreux 11.
- source_word: πεποίηκεν
  choice: il a célébré
  rationale: Dans ce contexte cultuel, ποιέω désigne l’accomplissement de la Pâque. « Célébrer » est idiomatique en français et n’impose pas l’idée plus précise d’une institution.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Le terme peut désigner la fête, le rite ou le repas pascal. « La Pâque » conserve cette amplitude.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: accompli l’aspersion du sang
  rationale: πρόσχυσις désigne l’application rituelle du sang. « Aspersion » est le terme cultuel traditionnel; le verbe ajouté permet une coordination française naturelle avec « célébré ».
- source_word: ἵνα μὴ
  choice: afin que ... ne ... pas
  rationale: Cette tournure conserve clairement la valeur finale de la proposition grecque.
- source_word: ὁ ὀλοθρεύων
  choice: le destructeur
  rationale: Le participe substantivé signifie « celui qui détruit ». « Le destructeur » reste concis et n’ajoute pas l’identification interprétative « ange ».
- source_word: τὰ πρωτότοκα
  choice: les premiers-nés
  rationale: L’adjectif neutre pluriel est employé substantivement. Le français « les premiers-nés » en conserve la portée sans préciser davantage leur identité.
- source_word: θίγῃ
  choice: ne les touche pas
  rationale: Le verbe signifie littéralement « toucher ». Le contexte rend ce contact funeste, mais la traduction garde le terme concret et l’allusion au récit de l’Exode.
- source_word: αὐτῶν
  choice: les
  rationale: Le pronom renvoie aux personnes associées à Moïse dans le contexte. Le pronom français évite d’ajouter explicitement « les Israélites », absent du grec.
theological_decisions:
- issue: Identité du sujet sous-entendu de πεποίηκεν
  choice: Le pronom « il » renvoie à Moïse.
  alternative: Remplacer le pronom par « Moïse ».
  rationale: Le contexte immédiat d’Hébreux 11 identifie Moïse comme sujet. Garder « il » respecte toutefois la formulation grecque et la continuité du passage.
- issue: Sens de πίστις
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: Dans Hébreux 11, le thème explicite et récurrent est la foi. « Fidélité » déplacerait ici le sens, tandis que « confiance » serait possible mais moins cohérent avec le refrain du chapitre.
- issue: Identité de ὁ ὀλοθρεύων
  choice: le destructeur
  alternative: l’ange destructeur
  rationale: Le grec ne dit pas explicitement « ange ». La traduction évite donc d’introduire cette identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reprend le refrain « Par la foi » d’Hébreux 11. « Premiers-nés » suit l’orthographe rectifiée et demeure naturel dans un registre biblique contemporain.
