source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: fr
  text: Par la foi, Rahab, la prostituée, ne périt pas avec ceux qui avaient désobéi, car elle avait accueilli les espions paisiblement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant accueilli les espions en paix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen ou le fondement de l’action exemplaire de Rahab et reprend la formule structurante d’Hébreux 11.
- source_word: Ῥαὰβ
  choice: Rahab
  rationale: Translittération française usuelle du nom propre.
- source_word: ἡ πόρνη
  choice: la prostituée
  rationale: Rend directement πόρνη dans un français moderne, clair et non euphémistique; « courtisane » atténuerait le sens et « femme de mauvaise vie » serait daté.
- source_word: οὐ συναπώλετο
  choice: ne périt pas avec
  rationale: Le verbe composé exprime le fait de périr avec d’autres; la construction française avec « avec » conserve naturellement cette valeur collective.
- source_word: τοῖς ἀπειθήσασιν
  choice: ceux qui avaient désobéi
  rationale: Le participe aoriste de ἀπειθέω porte une idée de refus et de désobéissance. Le plus-que-parfait situe naturellement leur désobéissance avant la destruction, sans réduire le terme à la seule incroyance.
- source_word: δεξαμένη
  choice: car elle avait accueilli
  rationale: Le participe aoriste donne ici la circonstance explicative de sa délivrance. « Accueilli » convient idiomatiquement à la réception de personnes, tandis que « car » explicite sans excès la relation causale probable.
- source_word: τοὺς κατασκόπους
  choice: les espions
  rationale: Équivalent français courant et précis dans le contexte du récit de Josué.
- source_word: μετ’ εἰρήνης
  choice: dans la paix
  rationale: Conserve l’expression prépositionnelle et son idiome biblique; elle peut désigner un accueil pacifique ou favorable, nuance signalée en note.
theological_decisions:
- issue: Sens de πίστις dans la formule exemplaire d’Hébreux 11
  choice: foi
  alternative: confiance; fidélité
  rationale: Dans la construction πίστει suivie du nom d’un exemple, « par la foi » est la formulation française naturelle et cohérente avec le chapitre. « Confiance » est possible sur le plan conceptuel, tandis que « fidélité » déplacerait ici l’accent.
- issue: Portée de ἀπειθέω
  choice: avaient désobéi
  alternative: n’avaient pas cru; avaient refusé de croire
  rationale: Le verbe peut associer incrédulité et désobéissance. « Désobéi » maintient sa force morale et volitive sans trancher explicitement en faveur d’une simple absence de croyance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la concision de l’original, le terme direct « prostituée » et l’idiome « dans la paix », tout en donnant en note une formulation française plus courante.
