id: HEB.11.3
reference: Hebrews 11:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: fr
  text: Par la foi, nous comprenons que les âges[a] ont été établis par la parole de Dieu, de sorte que ce qui se voit n’est pas venu à l’existence à partir de choses visibles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mondes » ou « l’univers ». Le grec dit « les âges »; ce terme peut désigner l’ordre du monde dans son déploiement à travers le temps.
    reason: Alternative lexicale permettant de conserver l’étendue temporelle et cosmique de αἰῶνες.
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen. Cette formulation concise et naturelle reprend aussi la structure récurrente du chapitre.
- source_word: νοοῦμεν
  choice: nous comprenons
  rationale: Le verbe désigne une saisie intellectuelle plutôt qu’une perception par les sens.
- source_word: κατηρτίσθαι
  choice: ont été formés
  rationale: Le parfait passif évoque une réalité constituée et mise en ordre. « Formés » reste naturel sans préciser indûment le processus matériel.
- source_word: τοὺς αἰῶνας
  choice: les siècles
  rationale: Le pluriel αἰῶνες signifie littéralement les âges ou les ères, mais peut désigner l’ensemble du monde créé dans son déploiement temporel. « Les siècles » conserve cette ampleur temporelle et cosmique; une note signale les autres traductions possibles.
- source_word: ῥήματι θεοῦ
  choice: par la parole de Dieu
  rationale: Le datif est instrumental; ῥῆμα désigne ici la parole prononcée ou l’énoncé de Dieu.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: de sorte que ... n’est pas venu à l’existence
  rationale: La construction exprime ici le résultat. Cette formulation restitue γίνομαι sans ajouter une terminologie métaphysique absente du texte.
- source_word: ἐκ φαινομένων
  choice: à partir de choses visibles
  rationale: Le participe renvoie à ce qui apparaît ou est visible, en contraste avec « ce qui se voit ».
- source_word: τὸ βλεπόμενον
  choice: ce qui se voit
  rationale: Le participe substantivé au singulier a une portée collective et désigne largement l’ordre visible.
theological_decisions:
- issue: Portée de αἰῶνες dans le contexte de la création
  choice: « les siècles », avec une note explicative
  alternative: « les mondes » ou « l’univers »
  rationale: Le grec peut englober l’ordre du monde à travers le temps. La traduction retenue préserve cette amplitude sans réduire le propos au seul cosmos matériel.
- issue: Rapport entre le monde visible et son origine
  choice: Ne pas expliciter la création à partir de rien
  alternative: Formuler directement une création ex nihilo
  rationale: Le verset affirme précisément que ce qui se voit ne provient pas de choses visibles. Cette affirmation est compatible avec la création à partir de rien, mais le texte grec n’en donne pas ici la formulation doctrinale complète.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation demeure proche de la structure grecque tout en restant intelligible; la difficulté réelle de « les siècles » est compensée par la note.
