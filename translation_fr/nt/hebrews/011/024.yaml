source:
  edition: SBLGNT
  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: fr
  text: Par la foi[a], Moïse, devenu adulte, refusa d’être appelé fils de la fille de Pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « par fidélité » ou « par confiance » ; grec πίστει. Le texte principal reprend ici la formule récurrente du chapitre : « Par la foi ».'
    reason: Alternative lexicale pour πίστει, dont le champ sémantique peut inclure la foi, la fidélité ou la confiance.
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen ou le fondement de l’action. « Par la foi » reprend naturellement en français la formule récurrente d’Hébreux 11.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: μέγας γενόμενος
  choice: devenu adulte
  rationale: Dans ce contexte, l’expression désigne l’accès à l’âge adulte plutôt qu’une grandeur de rang ou de réputation.
- source_word: ἠρνήσατο
  choice: refusa
  rationale: Le verbe exprime le refus délibéré d’accepter l’appellation ou l’identité indiquée par l’infinitif qui suit.
- source_word: λέγεσθαι
  choice: d’être appelé
  rationale: Rend directement l’infinitif passif et demeure naturel en français.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: fils de la fille du pharaon
  rationale: La tournure restitue l’identité précise attribuée à Moïse sans ajouter en français un article devant « fils », inutile après « être appelé ».
- source_word: Φαραώ
  choice: pharaon
  rationale: Forme française usuelle du titre; la minuscule convient lorsqu’il s’agit du titre générique.
theological_decisions:
- issue: Sens de πίστις dans la formule récurrente d’Hébreux 11
  choice: foi
  alternative: fidélité ou confiance
  rationale: Le contexte du chapitre met en avant des actes accomplis par la foi. « Foi » est donc le meilleur choix principal, tandis que les nuances possibles de fidélité et de confiance sont signalées en note.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque tout en employant l’expression idiomatique « devenu adulte ». « Le pharaon » est retenu comme titre générique naturel en français.
