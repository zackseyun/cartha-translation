id: HEB.11.1
reference: Hebrews 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: fr
  text: La foi est l’assurance[a] des choses qu’on espère, la preuve[b] de celles qu’on ne voit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la réalité » ou « la substance » des choses qu’on espère.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’élément probant » ou « la conviction » concernant celles qu’on ne voit pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: foi
  rationale: Dans ce contexte, le nom désigne la confiance placée en Dieu et en ses promesses. « Foi » est le terme français naturel et théologiquement non restrictif ici.
- source_word: ἐλπιζομένων
  choice: des choses qu’on espère
  rationale: Le participe présent passif substantivé désigne ce qui fait l’objet de l’espérance. Cette formulation française est naturelle et conserve la relation avec ὑπόστασις.
- source_word: ὑπόστασις
  choice: assurance
  rationale: Le mot peut évoquer l’assurance, la réalité ou la substance. « Assurance » rend ici la confiance ferme associée à la foi sans imposer une interprétation métaphysique; les autres possibilités sont signalées en note.
- source_word: πραγμάτων
  choice: de celles
  rationale: Le pronom reprend « choses » dans le premier membre et rend le pluriel de πρᾶγμα sans répétition lourde.
- source_word: ἔλεγχος
  choice: preuve
  rationale: Le terme peut désigner une preuve, un élément probant ou la conviction qui en résulte. « Preuve » préserve sa force objective, tandis que les autres nuances sont indiquées en note.
- source_word: οὐ βλεπομένων
  choice: qu’on ne voit pas
  rationale: Cette proposition relative rend directement le participe passif nié et demeure naturelle en français moderne.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque ici une transition légère. En français, le lien avec le contexte peut rester implicite sans ajouter un marqueur temporel absent du grec.
theological_decisions:
- issue: Sens de ὑπόστασις en Hébreux 11.1
  choice: assurance
  alternative: réalité; substance; confiance ferme
  rationale: Le contexte présente la foi dans sa portée concrète et exhortative. « Assurance » conserve cette force sans réduire le terme à une définition ontologique; l’ambiguïté lexicale authentique est préservée en note.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance; fidélité
  rationale: Il n’existe ici aucune construction qui imposerait le sens de « fidélité ». « Foi » exprime le mieux l’attitude de confiance décrite dans le chapitre.
- issue: Portée de ἔλεγχος
  choice: preuve
  alternative: élément probant; conviction
  rationale: Le grec permet une nuance objective ou subjective. Le texte principal retient la force probante du terme, sans exclure la conviction qui en découle, mentionnée en note.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle de la phrase grecque est conservée, avec le pronom « celles » pour éviter une répétition peu naturelle. Aucun connecteur temporel n’est ajouté pour δὲ.
