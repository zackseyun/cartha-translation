id: HEB.11.9
reference: Hebrews 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: fr
  text: Par la foi, il séjourna dans la terre promise comme dans une terre étrangère, habitant sous des tentes avec Isaac et Jacob, ses cohéritiers de la même promesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen; cette formulation naturelle reprend aussi le motif structurant d’Hébreux 11.
- source_word: παρῴκησεν
  choice: il séjourna
  rationale: Le verbe désigne le fait de résider en un lieu sans y être chez soi ni en être originaire. « Séjourna » exprime ce statut provisoire sans ajouter explicitement un statut juridique d’étranger.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: dans la terre promise
  rationale: Avec un verbe de résidence, εἰς peut indiquer le lieu où l’on vient demeurer. « Terre promise » est une tournure française claire qui conserve le lien entre cette terre et la promesse.
- source_word: ὡς ἀλλοτρίαν
  choice: comme dans une terre étrangère
  rationale: ἀλλοτρίαν qualifie la terre comme appartenant à d’autres ou étrangère. La formulation conserve la comparaison introduite par ὡς et l’idée qu’Abraham n’y vivait pas en propriétaire établi.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: habitant sous des tentes
  rationale: Le participe circonstanciel décrit concrètement la manière dont Abraham séjourna dans le pays; « sous des tentes » est l’expression française idiomatique.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: avec Isaac et Jacob
  rationale: μετά suivi du génitif signifie simplement « avec »; les noms suivent leur forme française traditionnelle.
- source_word: τῶν συγκληρονόμων
  choice: cohéritiers
  rationale: Le terme désigne ceux qui partagent un même héritage. « Cohéritiers » est précis, actuel et suffisamment accessible.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: de la même promesse
  rationale: La construction souligne qu’Isaac et Jacob participaient exactement à la promesse reçue par Abraham, sans préciser davantage son contenu.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Abraham, nommé dans le verset précédent
  alternative: Répéter explicitement « Abraham » dans ce verset
  rationale: Le grec laisse le sujet implicite et le contexte immédiat l’identifie sans ambiguïté. Le pronom « il » préserve la continuité du texte.
- issue: Rapport d’Abraham à la terre promise
  choice: Conserver la tension entre terre promise et terre étrangère
  alternative: Expliquer qu’il y vivait sans encore en posséder l’accomplissement
  rationale: Le texte juxtapose délibérément la promesse et la condition d’étranger. Une explication supplémentaire résoudrait une tension que le verset maintient.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique soutenu. La répétition de « terre » maintient le contraste rhétorique du grec; aucune note n’est nécessaire, puisque la formulation principale en conserve le sens et l’ambiguïté.
