id: HEB.11.7
reference: Hebrews 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: fr
  text: Par la foi, Noé, averti[a] au sujet de réalités encore invisibles, construisit, dans une crainte respectueuse[b], une arche pour le salut de sa maisonnée. Par elle[c], il condamna le monde et devint héritier de la justice qui est selon la foi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « instruit par une révélation divine » ou « ayant reçu un avertissement divin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « saisi de révérence » ou « mû par une sainte crainte ».
    reason: lexical_alternative
  - marker: c
    text: « Par elle » renvoie le plus naturellement à l’arche ; certains comprennent toutefois l’expression plus largement, comme désignant la foi de Noé ou sa réponse obéissante.
    reason: alternative_reading
  - marker: d
    text: Ou « droiture ». L’expression grecque signifie littéralement « la justice selon la foi » et ne précise pas davantage la nature de cette relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen et reprend la formule structurante d’Hébreux 11. « Foi » conserve le sens de la réponse confiante de Noé.
- source_word: χρηματισθεὶς
  choice: averti
  rationale: Au passif, le verbe désigne une communication ou un avertissement d’origine divine. Le texte principal n’ajoute pas explicitement « par Dieu », absent du grec, tandis que la note en précise la nuance.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: au sujet de réalités qu’on ne voyait pas encore
  rationale: Cette formulation conserve la temporalité de μηδέπω et le caractère encore invisible des événements annoncés, dans un français naturel.
- source_word: εὐλαβηθεὶς
  choice: fut mû par une crainte respectueuse
  rationale: Le terme évoque une réaction de révérence prudente, et non une simple terreur. « Fut mû » rend sa fonction participiale et son effet sur l’action de Noé.
- source_word: κατεσκεύασεν
  choice: construisit
  rationale: Dans le contexte de l’arche, le verbe décrit sa fabrication concrète et délibérée.
- source_word: κιβωτὸν
  choice: une arche
  rationale: C’est l’équivalent français établi dans le récit de Noé.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: pour le salut de sa maisonnée
  rationale: « Salut » maintient à la fois l’idée immédiate de délivrance et la portée théologique du terme; « maisonnée » rend οἶκος plus exactement que la seule famille nucléaire.
- source_word: δι’ ἧς
  choice: Par elle
  rationale: Le pronom féminin renvoie le plus naturellement à l’arche, l’antécédent grammatical le plus proche, tout en laissant subsister l’ambiguïté signalée en note.
- source_word: κατέκρινεν τὸν κόσμον
  choice: il condamna le monde
  rationale: Rendu direct du verbe et de son complément; l’obéissance de Noé manifeste la condamnation du monde incrédule.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: de la justice qui est selon la foi
  rationale: « Justice » est l’équivalent français théologique usuel de δικαιοσύνη. La formulation conserve la construction de κατά sans la réduire à une causalité plus précise que le grec.
- source_word: ἐγένετο κληρονόμος
  choice: devint héritier
  rationale: Expression française naturelle du statut résultant indiqué par le grec.
theological_decisions:
- issue: Origine implicite de l’avertissement (χρηματισθεὶς)
  choice: Ne pas ajouter « par Dieu » dans le texte principal
  alternative: « averti par Dieu » ou « ayant reçu un avertissement divin »
  rationale: Le contexte et l’usage du verbe impliquent une communication divine, mais l’agent n’est pas nommé dans le grec. La note rend cette implication sans l’insérer dans le texte.
- issue: Nuance de εὐλαβηθεὶς
  choice: « fut mû par une crainte respectueuse »
  alternative: « avec révérence » ou « saisi d’une crainte religieuse »
  rationale: Le choix maintient ensemble la crainte, la révérence et l’action obéissante, sans réduire le terme à la peur.
- issue: Antécédent de δι’ ἧς
  choice: « Par elle », renvoyant le plus naturellement à l’arche
  alternative: La foi de Noé ou, plus largement, sa réponse obéissante
  rationale: L’arche est l’antécédent féminin le plus proche dans la syntaxe grecque, mais la portée argumentative du passage permet une compréhension plus large, conservée en note.
- issue: Sens de δικαιοσύνη
  choice: « justice »
  alternative: « droiture » ou « juste statut »
  rationale: « Justice » garde la densité théologique et relationnelle du terme, tandis que la construction « selon la foi » est conservée afin de ne pas définir plus précisément que le texte la relation entre foi et justice.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement du grec tout en étant divisée en deux phrases pour la lisibilité. « Maisonnée » garde l’étendue de οἶκος; « réalités » évite un vague « choses » sans préciser indûment les événements encore invisibles.
