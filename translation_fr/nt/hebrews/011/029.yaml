  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: fr
  text: Par la foi, ils traversèrent la mer Rouge comme à travers une terre sèche[a] ; les Égyptiens, en tentant de faire de même, furent engloutis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mer des Roseaux ». Le grec porte ici « mer Rouge » (Ἐρυθρὰν Θάλασσαν), tandis que l’expression hébraïque correspondante dans le récit de l’Exode est parfois comprise comme signifiant « mer des Roseaux ».
    reason: Alternative lexicale liée à l’appellation grecque du présent verset et à l’interprétation de l’expression hébraïque correspondante dans l’Exode.
lexical_decisions:
- source_word: Πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen. « Par la foi » reprend naturellement la formule directrice de tout le chapitre 11.
- source_word: διέβησαν
  choice: ils traversèrent
  rationale: Le verbe désigne le passage d’un côté à l’autre ; « traversèrent » est précis et naturel en français.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: la mer Rouge
  rationale: Le texte grec porte explicitement l’appellation grecque conventionnelle « mer Rouge ». La question du nom hébreu sous-jacent est signalée en note.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: comme sur la terre ferme
  rationale: Cette tournure conserve la comparaison introduite par ὡς et rend idiomatiquement le passage à travers la mer sur un sol devenu sec.
- source_word: ἧς πεῖραν λαβόντες
  choice: qui tentèrent d’en faire autant
  rationale: L’expression idiomatique πεῖραν λαμβάνειν signifie « tenter, essayer ». « En faire autant » rattache clairement la tentative des Égyptiens à la même traversée, sans reproduire lourdement le génitif relatif grec.
- source_word: οἱ Αἰγύπτιοι
  choice: les Égyptiens
  rationale: Désignation directe des poursuivants égyptiens dans le récit de l’Exode.
- source_word: κατεπόθησαν
  choice: furent engloutis
  rationale: Le passif de καταπίνω évoque littéralement le fait d’être avalé ou englouti. « Furent engloutis » préserve cette image plus directement que « se noyèrent ».
theological_decisions:
- issue: Sens de πίστις dans la formule répétée d’Hébreux 11
  choice: foi
  alternative: confiance ; fidélité
  rationale: Dans ce chapitre, Πίστει constitue une formule programmatique. « Foi » en conserve le motif théologique établi, tandis que « confiance » exprimerait une nuance possible mais plus étroite ici.
- issue: Rapport entre la traversée d’Israël et la tentative des Égyptiens
  choice: qui tentèrent d’en faire autant
  alternative: ayant tenté cette traversée ; s’étant risqués à la traverser
  rationale: Le génitif relatif ἧς se rattache vraisemblablement à la traversée ou à la voie offerte par la mer. La formulation choisie préserve ce lien sans décider plus précisément si l’antécédent grammatical implicite est la mer, la terre ferme ou l’expérience de la traversée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. Le point-virgule et « mais » rendent nettement le contraste entre la traversée accomplie par la foi et l’échec des Égyptiens.
