  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: fr
  text: Il avait estimé que Dieu est capable même de relever d’entre les morts ; c’est ainsi qu’il le reçut en retour, de manière figurée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans une parabole ». Ou : « figurativement ». Isaac lui fut rendu comme s’il revenait d’entre les morts, non par une résurrection effective.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: Il avait estimé
  rationale: Le participe aoriste moyen décrit le raisonnement intérieur d’Abraham. Le plus-que-parfait français marque naturellement l’antériorité de cette réflexion par rapport au fait de recevoir Isaac en retour.
- source_word: ἐκ νεκρῶν ἐγείρειν
  choice: relever d’entre les morts
  rationale: Formulation française courante du langage de résurrection, tout en conservant la valeur plurielle et le mouvement exprimé par ἐκ.
- source_word: δυνατὸς ὁ θεός
  choice: Dieu est capable
  rationale: Le présent respecte la construction grecque et présente la puissance de Dieu comme une réalité générale, non seulement passée.
- source_word: ὅθεν
  choice: de là
  rationale: Cette expression concise conserve la valeur de provenance ou de conséquence de l’adverbe relatif, sans trancher entièrement entre « de là » et « c’est pourquoi ».
- source_word: ἐν παραβολῇ
  choice: de façon figurée
  rationale: Rendu idiomatique qui indique une correspondance analogique avec une résurrection, sans prétendre qu’Isaac est effectivement ressuscité.
- source_word: ἐκομίσατο
  choice: il le reçut aussi en retour
  rationale: Le moyen et le contexte expriment qu’Abraham a recouvré Isaac après l’avoir pour ainsi dire livré à la mort. « Reçut en retour » garde l’idée de réception sans remplacer le pronom grec par le nom d’Isaac.
- source_word: καὶ ἐκ νεκρῶν
  choice: même … d’entre les morts
  rationale: 'Le premier καί a ici une force intensive : la capacité divine s’étend même à la résurrection des morts.'
- source_word: καὶ ἐν παραβολῇ
  choice: aussi … de façon figurée
  rationale: Le second καί est rendu avec sa valeur additive, reliant le retour figuré d’Isaac au raisonnement d’Abraham.
theological_decisions:
- issue: Nature du retour d’Isaac
  choice: Abraham reçoit Isaac en retour de façon figurée, comme s’il revenait d’entre les morts.
  alternative: Comprendre ἐν παραβολῇ comme « dans une parabole », avec un accent plus explicite sur la typologie.
  rationale: Isaac n’a pas connu une résurrection effective. La formulation grecque établit toutefois une analogie réelle avec la résurrection ; la traduction préserve cette tension sans définir davantage sa portée typologique.
- issue: Valeur de ὅθεν
  choice: Conserver par « de là » le lien possible avec la provenance figurée aussi bien qu’avec la conséquence du raisonnement.
  alternative: Traduire uniquement par « c’est pourquoi », en donnant au terme une valeur strictement déductive.
  rationale: Dans ce contexte, ὅθεν peut évoquer le point d’où Abraham reçoit Isaac, mais aussi introduire la conséquence de sa conviction. Le français « de là » laisse subsister cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. « Relever d’entre les morts » reprend le registre biblique courant sans archaïsme ; « de façon figurée » rend naturellement une expression grecque qui serait raide si elle était calquée littéralement.
