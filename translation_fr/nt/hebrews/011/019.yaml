  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Abraham raisonne que Dieu peut relever d’entre les morts et reçoit Isaac en retour dans un sens figuré. Toutefois, « de là » est peu naturel en français dans cette articulation et ne rend pas clairement le lien consécutif/analogique de ὅθεν.'
  naturalness: « De là, il le reçut aussi en retour » est raide et ambigu en français moderne. « C’est ainsi qu’il le reçut en retour, de manière figurée » est idiomatique tout en maintenant le lien avec le raisonnement et l’analogie de résurrection. « Aussi » est inutile dans cette formulation française et alourdit la phrase.
  terminology: « Relever d’entre les morts » convient au registre biblique moderne et conserve le langage de résurrection. « De manière figurée » rend correctement ἐν παραβολῇ sans imposer une lecture typologique détaillée.
