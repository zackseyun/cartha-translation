    rationale: Bien que littéralement apparenté à ὅθεν, « de là » ne s’emploie pas naturellement ici en français et laisse le rapport logique insuffisamment clair. « C’est ainsi que » rend le lien sans réduire ὅθεν à une conséquence strictement logique.
  - severity: low
    issue: Position et redondance de « aussi »
    rationale: Le δεύτερο καί est additif, mais « aussi » dans « il le reçut aussi en retour » est lourd et non nécessaire en français. Le rapport demeure exprimé par « C’est ainsi que » et le contexte.
