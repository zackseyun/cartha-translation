  to: Il avait estimé que Dieu est capable même de relever d’entre les morts ; c’est ainsi qu’il le reçut en retour, de manière figurée[a].
  rationale: La révision remplace l’expression française maladroite « de là » par « c’est ainsi que », qui rend de façon naturelle le lien introduit par ὅθεν tout en préservant sa relation avec la conviction d’Abraham et la réception figurée d’Isaac. La note est regroupée sur l’expression qui traduit ἐν παραβολῇ ; l’ancienne note sur « de là » n’est plus pertinente.
