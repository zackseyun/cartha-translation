id: HEB.11.8
reference: Hebrews 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: fr
  text: C’est par la foi qu’Abraham, lorsqu’il fut appelé, obéit en partant vers un lieu qu’il devait recevoir en héritage. Il partit sans savoir où il allait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: C’est par la foi
  rationale: Le datif exprime ici le moyen ou le principe de l’action. « Par la foi » est le rendu français usuel et convient à la confiance avec laquelle Abraham répond à l’appel.
- source_word: καλούμενος
  choice: lorsqu’il fut appelé
  rationale: Le participe présent passif a une valeur circonstancielle. Ce rendu naturel conserve sa force temporelle sans préciser davantage l’enchaînement des événements.
- source_word: ὑπήκουσεν
  choice: obéit
  rationale: Le verbe exprime l’obéissance ou la conformité à ce qui a été demandé. « Obéit » est direct, actuel et digne.
- source_word: ἐξελθεῖν
  choice: en partant
  rationale: L’infinitif complète « obéit » et précise en quoi consistait son obéissance. « En partant » rend ce rapport idiomatiquement tout en permettant de reprendre « partit » dans la proposition suivante.
- source_word: τόπον
  choice: un lieu
  rationale: Le lieu reste indéterminé pour Abraham au moment de son départ. « Un lieu » respecte cette indétermination.
- source_word: ἤμελλεν λαμβάνειν
  choice: qu’il devait recevoir
  rationale: μέλλω suivi de l’infinitif marque ici une réalité future. « Devait recevoir » exprime cette perspective sans imposer une nuance de prédestination.
- source_word: εἰς κληρονομίαν
  choice: en héritage
  rationale: Expression française naturelle indiquant que le lieu serait reçu à titre d’héritage.
- source_word: ἐξῆλθεν
  choice: Il partit
  rationale: « Partit » reprend le verbe choisi pour ἐξελθεῖν et conserve ainsi la répétition et le mouvement narratif du grec.
- source_word: μὴ ἐπιστάμενος
  choice: sans savoir
  rationale: Le participe négatif décrit une circonstance accompagnant le départ. « Sans savoir » est concis et idiomatique.
- source_word: ποῦ ἔρχεται
  choice: où il allait
  rationale: Dans ce contexte de déplacement vers une destination inconnue, le présent grec se rend naturellement en français par l’imparfait « allait ».
theological_decisions:
- issue: Sens de πίστις dans la réponse d’Abraham
  choice: foi
  alternative: confiance ; fidélité
  rationale: Le contexte met en avant la réponse confiante d’Abraham à l’appel reçu. « Foi » conserve le terme théologique central du chapitre sans réduire son sens à la seule fidélité humaine.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La tournure emphatique « C’est par la foi que » met en relief Πίστει, comme dans la série rhétorique du chapitre. La répétition « partant… partit » reflète celle de ἐξελθεῖν… ἐξῆλθεν. La ponctuation en deux phrases évite une coordination lourde tout en conservant la progression de l’original.
