  source_fidelity: 'Le sens fondamental est bien rendu : Πίστει introduit le moyen/la disposition (« Par la foi »), εὐλόγησεν est correctement traduit par « bénit », et les deux bénéficiaires sont nommés. Cependant, « ce qui allait arriver » peut suggérer des événements simplement imminents ou déterminés, tandis que μελλόντων désigne plus sobrement des réalités/choses à venir.'
