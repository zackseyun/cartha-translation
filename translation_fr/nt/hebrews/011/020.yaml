  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: fr
  text: Par la foi, Isaac bénit Jacob et Ésaü aussi au sujet de réalités à venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Par la foi
  rationale: Rend naturellement le datif de moyen ou de fondement et maintient la formule récurrente du chapitre.
- source_word: περὶ μελλόντων
  choice: au sujet de ce qui allait arriver
  rationale: Préserve l'idée de réalités futures depuis le point de vue d'Isaac, sans préciser indûment leur contenu.
- source_word: εὐλόγησεν
  choice: bénit
  rationale: Correspond au sens religieux et performatif de la bénédiction prononcée par Isaac.
- source_word: καὶ
  choice: même
  rationale: Dans καὶ περὶ μελλόντων, la valeur adverbiale intensive convient au placement du mot et souligne que la bénédiction portait jusque sur l'avenir.
theological_decisions:
- issue: Portée prophétique des bénédictions d'Isaac
  choice: 'Formulation générale : « au sujet de ce qui allait arriver »'
  alternative: « concernant les choses à venir »
  rationale: Le texte affirme une orientation vers l'avenir sans définir ici si chaque détail est une prophétie explicite; la traduction conserve cette retenue.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste brève et claire, avec « même » pour conserver l'accent du καὶ textuellement attesté.
