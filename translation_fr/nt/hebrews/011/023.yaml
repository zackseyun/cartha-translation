id: HEB.11.23
reference: Hebrews 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: fr
  text: Par la foi, à sa naissance, Moïse fut caché pendant trois mois par ses parents, parce qu’ils virent que l’enfant était beau[a] et qu’ils ne craignirent pas l’édit du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remarquable » ou « exceptionnel ». Le grec ἀστεῖον fait écho à Exode 2.2 et à Actes 7.20.
    reason: L’adjectif grec possède une gamme de sens allant de la beauté visible à une qualité remarquable; la note préserve cette nuance lexicale et le lien intertextuel.
lexical_decisions:
- source_word: Πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen ou le principe d’action et reprend le motif récurrent d’Hébreux 11. « Par la foi » est la formulation française naturelle et traditionnelle.
- source_word: Μωϋσῆς γεννηθεὶς
  choice: à sa naissance, Moïse
  rationale: Le participe aoriste passif γεννηθείς reçoit une valeur temporelle. Cette formulation naturelle conserve Moïse comme sujet grammatical de la proposition principale.
- source_word: ἐκρύβη τρίμηνον
  choice: fut caché pendant trois mois
  rationale: Le passif de l’original est maintenu, et « pendant » rend explicitement l’accusatif de durée.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: par ses parents
  rationale: Dans ce contexte, le pluriel πατέρων désigne collectivement le père et la mère. « Ses parents » est exact et idiomatique en français.
- source_word: διότι εἶδον
  choice: parce qu’ils virent
  rationale: διότι introduit le motif de leur action, et le passé simple convient au registre narratif digne du passage.
- source_word: ἀστεῖον τὸ παιδίον
  choice: que l’enfant était beau
  rationale: ἀστεῖος peut décrire ce qui est beau, charmant, remarquable ou exceptionnel. « Beau » rend directement l’apparence favorable de l’enfant sans en faire explicitement un signe surnaturel.
- source_word: οὐκ ἐφοβήθησαν
  choice: ils ne craignirent pas
  rationale: Cette formulation concise conserve le contraste entre la foi et la crainte.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: l’édit du roi
  rationale: διάταγμα désigne un ordre officiel. « Édit » exprime clairement le caractère royal et contraignant de cet ordre.
theological_decisions:
- issue: Motivation des parents lorsqu’ils cachent Moïse
  choice: 'Présenter leur action comme relevant de la foi, tout en conservant les deux éléments énoncés : ils voient que l’enfant est beau et ils ne craignent pas l’édit royal.'
  alternative: Comprendre la beauté de l’enfant comme l’unique motif, ou comme un signe divin particulier révélé dans son apparence.
  rationale: Toute la phrase est placée sous « Par la foi », mais le texte mentionne aussi l’apparence de l’enfant et l’absence de crainte. La traduction maintient ces éléments sans préciser davantage leur rapport ni attribuer à son apparence une portée miraculeuse que le grec n’énonce pas.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre littéraire accessible. La structure passive et la mise en tête de « Par la foi » préservent l’organisation et l’accent du grec sans lourdeur excessive.
