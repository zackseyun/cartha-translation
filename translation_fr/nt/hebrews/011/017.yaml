source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: fr
  text: Par la foi, Abraham, alors qu’il était mis à l’épreuve, a offert Isaac ; lui qui avait reçu les promesses offrait son fils unique[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son fils sans pareil » ou « son fils unique en son genre ». Le terme grec peut souligner le caractère unique ou singulier d’Isaac, notamment en rapport avec les promesses, sans préciser à lui seul qu’il était le seul fils biologique d’Abraham.
    reason: Alternative lexicale et clarification prudente de la portée de μονογενής.
lexical_decisions:
- source_word: Πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen ; « Par la foi » est naturel en français et conserve la formule récurrente du chapitre.
- source_word: προσενήνοχεν
  choice: a offert
  rationale: Le parfait de προσφέρω présente l’acte comme accompli et significatif. Le passé composé convient au récit rétrospectif français, tandis que le contexte sacrificiel donne à « offrir » toute sa force.
- source_word: πειραζόμενος
  choice: mis à l’épreuve
  rationale: Le participe présent passif décrit Abraham au moment de l’épreuve. Cette formulation conserve le passif sans suggérer une incitation au mal, que pourrait évoquer « tenté ».
- source_word: μονογενῆ
  choice: fils unique
  rationale: μονογενής souligne le caractère unique, sans porter nécessairement sur l’engendrement. « Fils unique » est la formulation française usuelle ; la note précise l’unicité particulière d’Isaac, puisque Abraham avait aussi Ismaël.
- source_word: προσέφερεν
  choice: offrait
  rationale: L’imparfait grec est rendu par l’imparfait français, ce qui préserve l’aspect inaccompli et distingue cette forme du parfait précédent.
- source_word: ἀναδεξάμενος
  choice: avait accueilli
  rationale: Le verbe peut exprimer un accueil ou une réception assumée. « Avait accueilli » est naturel avec les promesses et rend la nuance du moyen plus nettement que le simple « reçu ».
- source_word: ἐπαγγελίας
  choice: les promesses
  rationale: Le pluriel grec est conservé et renvoie à l’ensemble des promesses divines faites à Abraham.
- source_word: καὶ
  choice: ;
  rationale: En français, le point-virgule rend naturellement la reprise appositive introduite par καί sans alourdir la phrase par deux coordinations successives.
theological_decisions:
- issue: Le sens de μονογενῆ appliqué à Isaac alors qu’Abraham avait aussi Ismaël
  choice: « son fils unique » avec une note expliquant l’unicité particulière d’Isaac
  alternative: « son fils sans pareil », « son fils unique en son genre » ou « son fils unique-engendré »
  rationale: Le texte met en relief Isaac comme fils singulier lié aux promesses, sans nier l’existence d’Ismaël. La formulation idiomatique est conservée dans le texte, et l’ambiguïté réelle est explicitée sans imposer une construction doctrinale ultérieure.
- issue: Rapport aspectuel entre προσενήνοχεν et προσέφερεν
  choice: « a offert » puis « offrait »
  alternative: 'Employer deux passés composés : « a offert … a offert »'
  rationale: La distinction française reflète la différence entre le parfait et l’imparfait grecs et maintient la tension entre l’acte considéré comme accompli et la scène envisagée dans son déroulement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure rhétorique grecque, tout en employant une ponctuation naturelle. « Mis à l’épreuve » évite la connotation morale trompeuse de « tenté », et la répétition d’« offrir » préserve l’écho intentionnel du texte source.
