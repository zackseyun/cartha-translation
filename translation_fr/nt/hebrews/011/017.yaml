  rationale: La révision remplace une nuance interprétative par le rendu plus direct « avait reçu », explicite la circonstance progressive de l’épreuve et reformule la note afin qu’elle explique l’enjeu lexical de μονογενής sans promouvoir une étymologie ou une formulation française peu naturelle. Le contraste « a offert / offrait » et l’ambiguïté contrôlée de « fils unique » sont conservés.
