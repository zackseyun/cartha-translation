  naturalness: La phrase est claire et d’un registre moderne et digne. L’ajout de « alors qu’il était » rend plus explicitement la valeur circonstancielle et progressive du participe grec. « Avait reçu les promesses » est plus idiomatique et moins interprétatif que « avait accueilli les promesses ».
  terminology: « Fils unique » est une traduction française usuelle de μονογενής, mais sa portée doit être expliquée avec prudence, Isaac n’étant pas le seul fils biologique d’Abraham. La note doit éviter de présenter « unique-engendré » comme une option lexicale française recommandable ou comme un sens imposé par le grec.
