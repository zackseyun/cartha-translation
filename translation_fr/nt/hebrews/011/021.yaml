  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: fr
  text: Par la foi, Jacob, au moment de mourir, bénit chacun des fils de Joseph et se prosterna en adoration, appuyé sur l’extrémité de son bâton.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « sur l’extrémité de son bâton ». La construction peut décrire la posture de Jacob. En Genèse 47.31, le texte hébreu porte : « au chevet de son lit », tandis que le texte grec porte : « bâton ».'
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: 'Le datif exprime ici le moyen ou la manière : Jacob agit par la foi. Cette formulation reprend naturellement le motif directeur d’Hébreux 11.'
- source_word: ἀποθνῄσκων
  choice: au moment de mourir
  rationale: Le participe présent est contemporain des verbes principaux et situe les actes de Jacob à l’approche de sa mort, dans un français naturel.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: chacun des fils de Joseph
  rationale: 'Cette formulation conserve la valeur distributive de ἕκαστον avec le génitif partitif : chaque fils reçoit personnellement la bénédiction.'
- source_word: εὐλόγησεν
  choice: bénit
  rationale: « Bénir » est le terme français courant et précis dans ce contexte patriarcal.
- source_word: προσεκύνησεν
  choice: adora Dieu
  rationale: Le verbe désigne ici un acte religieux d’adoration. L’ajout explicatif de « Dieu » rend clair que le bâton n’est pas l’objet de l’adoration, sans modifier le référent implicite dans le contexte.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: en s’appuyant sur le haut de son bâton
  rationale: Cette traduction exprime naturellement la posture probablement décrite par la phrase grecque et évite de faire du bâton l’objet de l’adoration. La construction demeure toutefois susceptible d’une autre analyse, signalée en note.
theological_decisions:
- issue: Rapport entre l’adoration de Jacob et son bâton dans la dernière proposition
  choice: Jacob adore Dieu en s’appuyant sur le haut de son bâton.
  alternative: Jacob se prosterne vers le haut de son bâton ; d’après le texte hébreu de Genèse 47.31, il se prosterne au chevet de son lit.
  rationale: Le texte grec d’Hébreux porte bien « bâton », conformément à la forme grecque de Genèse 47.31, tandis que le texte hébreu de la Genèse porte « lit ». La traduction principale présente la phrase comme une indication de posture, sans suggérer que le bâton recevait l’adoration, et la note conserve les ambiguïtés syntaxique et intertextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Au moment de mourir » est plus idiomatique que le calque « mourant ». La formulation explicite le destinataire implicite de l’adoration pour éviter une lecture idolâtre, tandis que la note préserve l’ambiguïté grammaticale et la différence entre les formes grecque et hébraïque de Genèse 47.31.
