revisions:
- from: Par la foi, Jacob, au moment de mourir, bénit chacun des fils de Joseph, puis adora Dieu en s’appuyant sur le haut de son bâton.[a]
  to: Par la foi, Jacob, au moment de mourir, bénit chacun des fils de Joseph et se prosterna en adoration, appuyé sur l’extrémité de son bâton.[a]
  rationale: La révision retire l’ajout interprétatif « Dieu » et le connecteur séquentiel « puis », afin de suivre plus étroitement le grec. Elle conserve une expression française claire de προσκυνέω et présente l’expression relative au bâton comme une posture, sans en faire l’objet de l’adoration. La note préserve la différence significative entre le texte hébreu de Genèse et la tradition grecque reprise en Hébreux.
