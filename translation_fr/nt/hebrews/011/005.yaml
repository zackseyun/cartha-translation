  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: fr
  text: Par la foi, Hénoc fut enlevé[b] afin de ne pas voir la mort[a], et on ne le trouvait pas, parce que Dieu l’avait enlevé. En effet, avant son enlèvement, il avait reçu le témoignage qu’il avait plu à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : connaître la mort, en faire l’expérience.'
    reason: Explicitation de l’expression grecque « voir la mort ».
  - marker: b
    text: 'Ou : transporté.'
    reason: Signale une autre traduction possible du verbe grec sans imposer une explication supplémentaire.
lexical_decisions:
- source_word: Πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen ou la disposition qui caractérise Hénoc. « Par la foi » est naturel, précis et cohérent avec le fil conducteur d’Hébreux 11.
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: fut enlevé / avait enlevé / enlèvement
  rationale: Cette famille de mots décrit le fait que Dieu retire Hénoc de sa vie terrestre. La répétition de la même racine française maintient la cohésion lexicale sans préciser un mécanisme que le verset n’explicite pas.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: afin de ne pas voir la mort
  rationale: La construction peut exprimer le but ou le résultat. « Afin de » convient au contexte, tandis que « voir la mort » conserve l’image grecque, explicitée en note.
- source_word: οὐχ ηὑρίσκετο
  choice: on ne le trouvait plus
  rationale: Cette tournure française rend naturellement l’imparfait et laisse indéterminée, comme le grec, l’identité de ceux qui auraient pu le chercher.
- source_word: μεμαρτύρηται
  choice: il avait reçu le témoignage
  rationale: Le parfait passif indique qu’un témoignage favorable avait été rendu à Hénoc avant son enlèvement. Cette formulation garde l’idée de témoignage, importante dans Hébreux 11.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: qu’il avait plu à Dieu
  rationale: Le parfait infinitif renvoie à ce qui était attesté au sujet d’Hénoc avant son enlèvement. La formulation est idiomatique et fidèle au sens.
theological_decisions:
- issue: Nature de l’enlèvement d’Hénoc
  choice: Dire simplement que Dieu l’a « enlevé »
  alternative: Préciser qu’il a été emporté au ciel ou expliquer le mécanisme de cet événement
  rationale: Le texte affirme l’action de Dieu et le fait qu’Hénoc n’a pas vu la mort, mais il n’en décrit pas davantage les modalités. La traduction ne doit pas ajouter ces précisions.
- issue: Sens de « voir la mort »
  choice: Conserver l’expression imagée dans le texte
  alternative: Traduire directement par « connaître la mort » ou « faire l’expérience de la mort »
  rationale: L’image grecque reste intelligible en français et préserve la texture du texte; son sens idiomatique est indiqué en note.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé simple « fut enlevé » convient à la narration biblique sans être obscur; l’imparfait « on ne le trouvait plus » rend naturellement l’état décrit. Les répétitions autour d’« enlevé » sont conservées afin de refléter la répétition grecque.
