  rationale: La révision améliore la fluidité sans modifier le sens. Elle conserve le pluriel de « promesses », la personnification figurée exprimée par « les ont saluées », la portée publique de ὁμολογήσαντες par « ont déclaré », et le présent de εἰσιν. « Résidents temporaires » rend naturellement παρεπίδημοι sans surinterpréter le terme comme un exil forcé.
