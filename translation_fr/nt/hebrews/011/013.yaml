id: HEB.11.13
reference: Hebrews 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: fr
  text: Tous ceux-là sont morts dans la foi, sans avoir reçu les promesses ; mais ils les ont vues de loin et les ont saluées[a], et ils ont déclaré qu’ils sont des étrangers et des résidents temporaires[b] sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ont accueillies » ou « les ont embrassées ». Le verbe grec signifie habituellement saluer ou accueillir ; il est employé ici de manière figurée à propos des promesses aperçues de loin.
    reason: lexical_alternative
  - marker: b
    text: Ou « étrangers de passage ». Le terme grec désigne des personnes qui résident dans un lieu sans y avoir une appartenance pleinement établie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: C’est dans la foi que
  rationale: Cette tournure française naturelle conserve l’idée d’une mort vécue dans la sphère et l’attitude de la foi, plutôt que de présenter la foi uniquement comme le moyen de mourir.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: sans avoir reçu les promesses
  rationale: Le participe négatif est rendu avec naturel tout en conservant le pluriel explicite de « promesses ».
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: ils les ont vues de loin
  rationale: Rend directement l’image spatiale et figurée de promesses aperçues à distance.
- source_word: ἀσπασάμενοι
  choice: les ont saluées
  rationale: « Saluer » est le correspondant lexical le plus proche et garde vive la personnification des promesses ; « accueillir » ou « embrasser » expliciterait davantage la réaction positive.
- source_word: ὁμολογήσαντες
  choice: reconnaissant
  rationale: Dans ce contexte, le verbe désigne l’aveu ou la déclaration ouverte de leur condition. « Reconnaissant » est idiomatique en français sans imposer le sens religieux moderne de « confesser ».
- source_word: ξένοι
  choice: étrangers
  rationale: Conserve le sens de personnes qui n’appartiennent pas pleinement au lieu où elles se trouvent.
- source_word: παρεπίδημοί
  choice: résidents de passage
  rationale: Exprime le séjour sans appartenance durable ni statut pleinement établi, sans ajouter nécessairement l’idée d’un bannissement propre à « exilés ».
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Le contexte envisage largement leur condition terrestre, plutôt qu’un territoire particulier.
theological_decisions:
- issue: Portée de πίστις dans Κατὰ πίστιν
  choice: dans la foi
  alternative: par la foi ; dans une attitude de confiance
  rationale: « Dans la foi » préserve la foi comme posture persistante au moment de la mort, sans réduire la construction à une simple causalité instrumentale.
- issue: Image figurée de l’accueil des promesses
  choice: les ont saluées
  alternative: les ont accueillies ; les ont embrassées
  rationale: 'La formulation maintient l’image audacieuse du grec : les promesses encore lointaines sont traitées comme des personnes que l’on salue. Les autres nuances légitimes sont signalées en note.'
- issue: Condition exprimée par παρεπίδημοί
  choice: résidents de passage
  alternative: étrangers de passage ; exilés
  rationale: Le terme indique une résidence sans enracinement ni pleine appartenance. « Exilés » pourrait suggérer à tort une expulsion forcée que le mot n’exige pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase garde la progression des participes grecs tout en évitant une accumulation pesante de formes composées. La personnification des promesses et la distinction entre « étrangers » et « résidents de passage » sont conservées.
