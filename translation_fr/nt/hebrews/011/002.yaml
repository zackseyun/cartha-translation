id: HEB.11.2
reference: Hebrews 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/002.yaml
  text: For by this the elders received approval[a][b][c].
translation:
  language: fr
  text: C’est en effet par elle que les anciens ont reçu un témoignage favorable[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « ont été reconnus dignes d’approbation » ou « ont reçu un bon témoignage ».'
    reason: lexical_alternative
  - marker: b
    text: '« Par elle » : c’est-à-dire par la foi évoquée au verset précédent.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: par elle
  rationale: Le pronom féminin renvoie naturellement à « la foi » au verset 1. « Par elle » rend de façon concise la valeur instrumentale probable de ἐν, sans répéter explicitement le nom.
- source_word: γὰρ
  choice: en effet
  rationale: « En effet » marque naturellement en français le lien explicatif par lequel le verset 2 appuie l’affirmation précédente.
- source_word: ἐμαρτυρήθησαν
  choice: ont reçu un témoignage favorable
  rationale: Cette formulation conserve la notion centrale de témoignage portée par μαρτυρέω ainsi que la valeur favorable du verbe dans ce contexte, sans préciser explicitement l’auteur du témoignage.
- source_word: οἱ πρεσβύτεροι
  choice: les anciens
  rationale: Dans ce contexte, le terme désigne les personnes des générations passées qui seront données en exemples, et non les responsables d’une communauté. « Les anciens » reste proche du grec tout en étant idiomatique.
theological_decisions:
- issue: Référent de ταύτῃ
  choice: Le pronom « elle » renvoie naturellement à la foi mentionnée en 11.1.
  alternative: Le démonstratif peut viser plus largement la réalité décrite dans tout le verset 1.
  rationale: L’accord au féminin singulier avec πίστις et le développement du chapitre favorisent le renvoi à la foi. Le pronom maintient toutefois la formulation anaphorique du grec plutôt que d’insérer directement « la foi ».
- issue: Auteur du témoignage favorable
  choice: Ne pas ajouter « de Dieu » dans le texte principal.
  alternative: Expliciter que les anciens ont reçu l’approbation de Dieu.
  rationale: Le contexte du chapitre suggère fortement Dieu comme auteur du témoignage, mais il n’est pas nommé dans ce verset. La traduction évite donc de résoudre par ajout ce qui reste implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est en effet par elle que » reproduit l’accent mis sur le moyen, tandis que « témoignage favorable » préserve le champ lexical du témoignage, important dans l’ensemble du chapitre.
