source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: fr
  text: C’est pourquoi, d’un seul homme[a], alors même qu’il était déjà comme mort, sont nés des descendants aussi nombreux que les étoiles du ciel et aussi innombrables que le sable au bord de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un seul »; il s’agit d’Abraham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de ce qui précède au sujet de la foi et de la naissance promise.
- source_word: ἀφ’ ἑνὸς
  choice: d’un seul homme
  rationale: Le masculin et le contexte désignent Abraham. L’ajout de « homme » explicite le référent sans modifier le sens.
- source_word: ἐγεννήθησαν
  choice: sont nés des descendants
  rationale: Exprime idiomatiquement le résultat de l’engendrement tout en fournissant en français le sujet implicite requis par le contexte.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: lui qui était déjà comme mort
  rationale: Rend la métaphore de l’impuissance liée au grand âge sans suggérer qu’Abraham était littéralement mort; « déjà » traduit ici la portée de l’état accompli.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: aussi nombreux que les étoiles du ciel
  rationale: Conserve explicitement l’idée de multitude dans une formulation française naturelle et digne.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: aussi innombrables que le sable au bord de la mer
  rationale: « Au bord de la mer » rend naturellement l’image littérale de la lèvre ou lisière de la mer, et « innombrables » conserve l’insistance sur l’impossibilité de compter.
theological_decisions:
- issue: Référent de « d’un seul »
  choice: Abraham est explicitement présenté comme « un seul homme ».
  alternative: Conserver simplement « d’un seul », avec un référent moins explicite.
  rationale: La forme masculine grecque et le contexte immédiat identifient Abraham; cette explicitation ne rajoute aucun contenu doctrinal.
- issue: Portée de νενεκρωμένου
  choice: Métaphore de l’état d’Abraham, que son grand âge avait rendu incapable d’engendrer selon les possibilités humaines normales.
  alternative: Comprendre l’expression comme une mort ou une mise à mort physique littérale.
  rationale: Le contexte porte sur la naissance miraculeuse d’une descendance malgré l’âge d’Abraham et de Sara; « comme mort » préserve à la fois la force de l’image et son caractère métaphorique.
translation_notes:
  register: Français international moderne, naturel et soutenu. La répétition « aussi… aussi… » maintient le parallélisme des deux comparaisons. Le texte conserve l’image forte de l’homme « comme mort » tout en évitant une lecture littérale.
