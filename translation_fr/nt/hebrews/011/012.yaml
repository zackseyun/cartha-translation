revisions:
- from: C’est pourquoi, d’un seul homme[a], lui qui était déjà comme mort, sont nés des descendants aussi nombreux que les étoiles du ciel et aussi innombrables que le sable au bord de la mer.
  to: C’est pourquoi, d’un seul homme[a], alors même qu’il était déjà comme mort, sont nés des descendants aussi nombreux que les étoiles du ciel et aussi innombrables que le sable au bord de la mer.
  rationale: La révision conserve l’explicitation contextuellement sûre d’Abraham par « un seul homme » et la métaphore « comme mort ». Elle remplace l’incise relative par « alors même qu’il était », qui rend plus naturellement l’intensification de καὶ ταῦτα et évite une rupture syntaxique. La note est resserrée afin de ne pas se présenter comme une traduction plus littérale de l’ensemble de la proposition tout en n’en citant qu’un élément.
