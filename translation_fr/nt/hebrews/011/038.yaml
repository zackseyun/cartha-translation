source:
  edition: SBLGNT
  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: fr
  text: — eux dont le monde n’était pas digne — errant dans les déserts[a], les montagnes, les grottes et les trous du sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les lieux déserts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: eux dont
  rationale: Le pronom relatif au génitif renvoie aux fidèles persécutés mentionnés auparavant. « Eux dont » conserve ce lien et introduit naturellement en français l’évaluation qui suit.
- source_word: ἄξιος
  choice: digne
  rationale: « Digne » restitue directement le jugement de valeur exprimé par ἄξιος sans le réduire à une simple idée de mérite.
- source_word: κόσμος
  choice: le monde
  rationale: Dans ce contexte, κόσμος désigne largement le monde humain qui a rejeté ces fidèles. « Le monde » garde cette portée sans ajouter d’interprétation.
- source_word: ἐπὶ ἐρημίαις
  choice: dans les déserts
  rationale: Avec ἐπί et le datif dans ce contexte d’errance, le sens est locatif. « Dans les déserts » est concret, clair et naturel.
- source_word: πλανώμενοι
  choice: errant
  rationale: Le participe décrit une existence instable et contrainte, sans lieu fixe. « Errant » convient au registre soutenu mais accessible du passage.
- source_word: ὄρεσι
  choice: les montagnes
  rationale: ὄρος désigne ordinairement une montagne ou une hauteur. Le pluriel « les montagnes » est ici la traduction la plus directe.
- source_word: σπηλαίοις
  choice: les grottes
  rationale: « Grottes » est le terme courant et précis pour ces abris naturels.
- source_word: ὀπαῖς τῆς γῆς
  choice: les cavités du sol
  rationale: ὀπή désigne un trou, une ouverture ou une cavité, et τῆς γῆς précise qu’il s’agit du sol ou de la terre. « Cavités du sol » conserve l’image concrète dans un français naturel.
theological_decisions:
- issue: Référent et portée de « le monde n’était pas digne d’eux »
  choice: La proposition est conservée comme un jugement moral qui oppose l’indignité du monde à la valeur des fidèles persécutés.
  alternative: Comprendre la formule plus neutralement comme une simple incompatibilité entre les fidèles et le monde.
  rationale: Le grec énonce une évaluation forte, et non une simple observation sociale. La traduction maintient cette tension sans développer une affirmation doctrinale qui dépasserait le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets préservent la parenthèse emphatique du grec, tandis que l’énumération reste fluide et concrète.
