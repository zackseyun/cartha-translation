source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: fr
  text: Or, sans la foi[a], il est impossible de lui plaire, car celui qui s’approche de Dieu doit croire qu’il existe[b] et qu’il est celui qui récompense[c] ceux qui le recherchent avec ardeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « la confiance ». Dans certains contextes, πίστις peut signifier « fidélité », mais ici l’explication qui suit met l’accent sur le fait de croire en Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qu’il est ». La formulation grecque est concise et peut aussi être rendue ainsi.'
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « qu’il récompense » ou « qu’il se révèle être celui qui récompense ». Le grec emploie un verbe qui signifie littéralement « devenir » et exprime ici ce que Dieu se révèle être pour ceux qui le recherchent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: Or, sans la foi
  rationale: χωρίς exprime l’absence ou la séparation, tandis que δέ assure ici une transition légère. « Or » relie naturellement l’affirmation à ce qui précède sans créer une opposition trop forte. Dans ce contexte, πίστις désigne la foi en Dieu, comme le montre le verbe πιστεῦσαι qui suit.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: il est impossible de lui plaire
  rationale: La tournure impersonnelle française rend directement l’adjectif ἀδύνατον suivi de l’infinitif. Le pronom « lui » renvoie naturellement à Dieu, explicité dans la proposition suivante.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: car … doit croire
  rationale: γάρ introduit la raison de l’affirmation précédente et δεῖ exprime une nécessité réelle. « Doit croire » est à la fois précis et idiomatique.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: celui qui s’approche de Dieu
  rationale: Le participe présent προσερχόμενον évoque le mouvement de venir vers Dieu ou de s’en approcher. « S’approche de Dieu » conserve cette image et convient au registre de l’épître.
- source_word: ὅτι ἔστιν
  choice: qu’il existe
  rationale: Dans ce contexte, ἔστιν affirme la réalité de Dieu. « Qu’il existe » exprime clairement ce sens en français, tandis que le rendu plus littéral « qu’il est » demeure signalé en note.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: ceux qui le recherchent avec ardeur
  rationale: ἐκζητέω est plus intensif que le simple ζητέω. « Rechercher avec ardeur » restitue cette idée d’une recherche soutenue sans suggérer qu’elle serait méritoire.
- source_word: μισθαποδότης γίνεται
  choice: qu’il récompense
  rationale: μισθαποδότης désigne celui qui accorde une récompense, et γίνεται présente ce que Dieu se révèle être envers ceux qui le recherchent. La formulation verbale est naturelle en français; la forme grecque plus explicite est conservée en note.
theological_decisions:
- issue: Sens de πίστις dans une affirmation théologiquement importante
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: L’explication immédiate par πιστεῦσαι, « croire », oriente ici vers la foi ou la confiance placée en Dieu plutôt que vers la fidélité comme qualité morale. « Foi » préserve le terme biblique établi sans imposer une définition confessionnelle particulière.
- issue: Portée de γίνεται dans l’expression μισθαποδότης γίνεται
  choice: qu’il récompense
  alternative: qu’il est celui qui récompense; qu’il se révèle celui qui récompense; qu’il devient celui qui récompense
  rationale: Le grec emploie γίνεται plutôt qu’une simple copule. Dans cette construction, il peut exprimer ce que Dieu se révèle être pour ceux qui le recherchent, sans nécessairement suggérer un changement de nature en Dieu. Le texte principal privilégie une formulation française fluide, tandis que la note maintient la tension lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression logique du grec et le vocabulaire traditionnel de la « foi », tout en évitant les formulations nominales peu naturelles comme « un rémunérateur ». Les trois appels de note sont placés immédiatement après les expressions concernées.
