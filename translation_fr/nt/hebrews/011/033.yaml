id: HEB.11.33
reference: Hebrews 11:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: fr
  text: qui, par la foi, conquirent des royaumes, pratiquèrent la justice[a], obtinrent des promesses et fermèrent la bouche des lions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firent ce qui est juste » ou « agirent avec droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: La construction διά avec le génitif exprime ici le moyen par lequel ces personnes ont agi. « Par la foi » est naturel en français et maintient le thème directeur d’Hébreux 11.
- source_word: κατηγωνίσαντο βασιλείας
  choice: conquirent des royaumes
  rationale: Le verbe évoque le fait de l’emporter dans un conflit ou de soumettre un adversaire. « Conquirent » conserve la force militaire et politique de l’expression.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: pratiquèrent la justice
  rationale: Le verbe ἐργάζομαι désigne ici une action effective. En français biblique moderne, « pratiquer la justice » exprime naturellement le fait d’agir avec droiture, sans réduire δικαιοσύνη à son seul sens judiciaire.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: obtinrent des promesses
  rationale: Cette formulation reste proche du grec et n’explicite pas davantage si les personnes reçurent les promesses elles-mêmes ou leur accomplissement, préservant ainsi la tension présente dans l’ensemble du chapitre.
- source_word: ἔφραξαν στόματα λεόντων
  choice: fermèrent la bouche des lions
  rationale: « Fermèrent » restitue l’image concrète du verbe φράσσω. Le singulier distributif « la bouche des lions » est idiomatique en français tout en gardant l’image du texte grec.
theological_decisions:
- issue: Sens de πίστις dans l’énumération d’Hébreux 11
  choice: foi
  alternative: confiance ; fidélité
  rationale: Dans ce chapitre, le terme désigne principalement la confiance active placée en Dieu. « Foi » conserve le terme théologique courant sans exclure cette dimension de confiance.
- issue: Portée de δικαιοσύνη dans ce contexte non paulinien
  choice: justice
  alternative: droiture ; ce qui est juste
  rationale: Le terme peut désigner la conduite droite aussi bien que la justice. « Pratiquer la justice » maintient cette amplitude morale et concrète; la note signale une autre formulation possible.
- issue: Rapport entre les promesses obtenues ici et Hébreux 11:39
  choice: obtinrent des promesses
  alternative: virent s’accomplir des promesses
  rationale: Le grec permet de comprendre qu’ils atteignirent ce qui avait été promis, mais la formulation retenue évite d’affirmer que toutes les promesses divines furent alors pleinement accomplies.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La cadence de l’énumération grecque est conservée par une suite de verbes au passé simple, adaptée au registre narratif biblique.
