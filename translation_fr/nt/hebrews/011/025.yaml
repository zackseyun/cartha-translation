source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: fr
  text: préférant subir de mauvais traitements avec le peuple de Dieu plutôt que de jouir pour un temps du péché,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plutôt que de connaître le plaisir passager du péché ».'
    reason: Alternative lexicale qui explicite le nom ἀπόλαυσις et rend πρόσκαιρος par « passager ».
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: préférant
  rationale: Le participe aoriste moyen exprime un choix personnel délibéré entre deux possibilités; « préférant » rend naturellement en français sa combinaison avec μᾶλλον et maintient le lien participial avec Moïse au verset précédent.
- source_word: συγκακουχεῖσθαι
  choice: être maltraité avec
  rationale: Cette formulation conserve à la fois l'idée de mauvais traitements et la solidarité exprimée par le préfixe συν-.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: le peuple de Dieu
  rationale: Expression sobre et traditionnelle qui reproduit directement la construction génitive grecque.
- source_word: ἢ
  choice: plutôt que
  rationale: Introduit clairement en français le second terme du choix comparatif.
- source_word: πρόσκαιρον
  choice: pour un temps
  rationale: Cette locution rend la durée limitée sans préciser à quel point elle est brève et s'intègre naturellement à l'infinitif « jouir ».
- source_word: ἔχειν … ἀπόλαυσιν
  choice: jouir
  rationale: Le français idiomatique exprime par le verbe « jouir » l'ensemble formé en grec par « avoir » et le nom « jouissance », en évitant la lourdeur de « avoir une jouissance ».
- source_word: ἁμαρτίας
  choice: du péché
  rationale: Le génitif est conservé sans définir davantage la nature du péché ni les avantages particuliers auxquels il pourrait renvoyer.
theological_decisions:
- issue: Nature de l'autre possibilité offerte à Moïse
  choice: Un contraste moral entre la solidarité avec le peuple de Dieu et la jouissance passagère du péché, sans préciser les actes concernés.
  alternative: Le péché pourrait désigner plus précisément les privilèges et les compromis liés à la cour du pharaon, ou plus largement les plaisirs coupables associés à l'Égypte.
  rationale: Le grec ne précise pas le contenu du péché; la traduction en préserve donc la portée ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation participiale conserve la continuité syntaxique avec le verset précédent; « être maltraité avec » maintient explicitement l'idée de souffrance partagée.
