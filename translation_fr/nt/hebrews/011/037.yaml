  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: fr
  text: Ils furent lapidés, sciés en deux; ils moururent sous les coups de l’épée[a]; ils allèrent de lieu en lieu, vêtus de peaux de moutons et de peaux de chèvres, démunis, opprimés, maltraités—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou plus simplement : « ils moururent par l’épée ». Le grec comporte le mot φόνος, « meurtre » ou « massacre », qui souligne la violence de leur mort.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: ils furent lapidés
  rationale: Le passif français rend directement l’aoriste passif de λιθάζω sans ajouter explicitement qu’ils furent tués.
- source_word: ἐπρίσθησαν
  choice: sciés en deux
  rationale: πρίζω signifie « scier »; « en deux » exprime naturellement en français le supplice évoqué dans cette série.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: ils moururent, massacrés à coups d’épée
  rationale: « Ils moururent » préserve l’actif de ἀπέθανον, tandis que « massacrés à coups d’épée » restitue la force violente de φόνος et l’instrument μαχαίρης dans un français naturel.
- source_word: περιῆλθον
  choice: ils allèrent de lieu en lieu
  rationale: Cette formulation exprime le déplacement répété de περιέρχομαι sans imposer la nuance plus interprétative d’une errance désorientée.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: vêtus de peaux de moutons et de peaux de chèvres
  rationale: L’ajout idiomatique de « vêtus » explicite la fonction vestimentaire évidente des peaux tout en conservant le parallélisme des deux expressions.
- source_word: ὑστερούμενοι
  choice: démunis
  rationale: Le terme exprime ici le manque des choses nécessaires; « démunis » est actuel, clair et suffisamment fort.
- source_word: θλιβόμενοι
  choice: opprimés
  rationale: Le participe passif évoque des personnes soumises à la pression et à la détresse; « opprimés » convient au contexte de persécution.
- source_word: κακουχούμενοι
  choice: maltraités
  rationale: « Maltraités » rend simplement et naturellement l’idée de subir de mauvais traitements.
theological_decisions:
- issue: Force de l’expression violente ἐν φόνῳ μαχαίρης
  choice: ils moururent, massacrés à coups d’épée
  alternative: ils moururent par l’épée
  rationale: φόνος renforce l’idée de mise à mort violente au-delà d’un simple complément instrumental. Le texte principal conserve cette intensité sans transformer ἀπέθανον en pur passif.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. Le tiret final est conservé, car la phrase se poursuit au verset suivant.
