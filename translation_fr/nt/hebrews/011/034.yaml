source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: fr
  text: ils éteignirent la force du feu, échappèrent au tranchant de l’épée[a], furent rendus forts, eux qui étaient faibles, devinrent puissants au combat et mirent en fuite des armées étrangères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les bouches de l’épée », expression qui désigne son tranchant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des campements étrangers » ; le terme peut désigner les forces militaires qui y campent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: éteignirent
  rationale: Le verbe σβέννυμι signifie éteindre ou étouffer un feu. « Éteignirent » conserve l’image concrète et vigoureuse du grec.
- source_word: δύναμιν πυρός
  choice: la puissance du feu
  rationale: δύναμις désigne ici la puissance ou la force agissante du feu. La formulation conserve cette nuance au lieu de réduire l’expression à « le feu ».
- source_word: ἔφυγον
  choice: échappèrent
  rationale: Dans ce contexte, le verbe exprime le fait d’échapper effectivement au danger, et non simplement de prendre la fuite.
- source_word: στόματα μαχαίρης
  choice: au tranchant de l’épée
  rationale: Littéralement « aux bouches de l’épée », expression imagée désignant son tranchant. Le singulier collectif est naturel en français.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: furent rendus forts malgré leur faiblesse
  rationale: Le passif de δυναμόω indique une force reçue. ἀπό marque littéralement le point de départ (« à partir de la faiblesse »), mais « malgré leur faiblesse » exprime naturellement en français le contraste et le passage implicite de la faiblesse à la force.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: devinrent vaillants au combat
  rationale: γίνομαι marque l’entrée dans un état; ἰσχυρός signifie fort ou puissant. « Vaillants au combat » évite une répétition pesante de « forts » tout en conservant le sens militaire.
- source_word: παρεμβολὰς
  choice: armées
  rationale: παρεμβολή signifie d’abord camp ou campement, mais peut désigner par métonymie les forces qui y campent; ici, le contexte militaire favorise « armées ».
- source_word: ἔκλιναν
  choice: mirent en fuite
  rationale: κλίνω signifie faire tourner ou reculer. Dans un contexte de guerre, « mettre en fuite » rend clairement la déroute imposée à l’ennemi.
- source_word: ἀλλοτρίων
  choice: étrangères
  rationale: L’adjectif désigne ce qui appartient à d’autres ou ce qui est étranger. Accordé à « armées », il restitue naturellement le génitif grec.
theological_decisions:
- issue: Degré de littéralité dans l’énumération des délivrances et victoires obtenues par la foi
  choice: Conserver les images historiques, physiques et militaires concrètes
  alternative: Généraliser en parlant de victoires sur les dangers et les ennemis
  rationale: Le passage évoque des actes concrets associés à l’histoire d’Israël et à l’endurance fidèle. La traduction ne spiritualise donc pas le feu, l’épée, la faiblesse, le combat ni les forces étrangères.
- issue: Agent implicite du passif ἐδυναμώθησαν
  choice: Préserver le passif « furent rendus forts » sans nommer explicitement l’agent
  alternative: Ajouter « Dieu les rendit forts » ou employer « reprirent des forces »
  rationale: Le contexte de la foi peut inviter à comprendre l’action de Dieu, mais le grec ne nomme pas l’agent. Le passif maintient cette ouverture sans imposer une explicitation théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La cadence de l’énumération est conservée par une série de verbes au passé simple. « Vaillants » apporte une variation naturelle après « forts » sans affaiblir l’idée de puissance au combat.
