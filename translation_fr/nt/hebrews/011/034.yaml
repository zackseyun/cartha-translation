    issue: « malgré leur faiblesse » pour ἀπὸ ἀσθενείας
    rationale: ἀπό indique l’origine ou le point de départ de l’affermissement, non une simple opposition concessive. La formulation actuelle peut signifier qu’ils sont restés faibles tout en étant forts.
  - severity: low
    issue: « vaillants » pour ἰσχυροί
    rationale: Le terme grec vise la force ou la puissance; « vaillants » peut réduire le sens à la bravoure.
  - severity: low
    issue: La note a traduit στόματα au singulier
    rationale: στόματα est pluriel; la note doit dire « les bouches de l’épée », même si le texte principal emploie à juste titre le singulier idiomatique « tranchant ».
