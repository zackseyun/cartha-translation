  text: ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον, ἔτι δὲ δεσμῶν καὶ φυλακῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: fr
  text: D’autres subirent les moqueries et les coups de fouet[a], et même les chaînes et la prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «connurent l’épreuve des moqueries et des coups de fouet, et même celle des chaînes et de la prison». Le grec dit plus littéralement: «reçurent l’épreuve de…»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: D’autres
  rationale: Désigne un autre groupe dans l’énumération des fidèles qui ont souffert et marque naturellement le contraste avec les exemples précédents.
- source_word: ἐμπαιγμῶν
  choice: les moqueries
  rationale: Rend le mépris et la dérision publics dans un français moderne et naturel.
- source_word: μαστίγων
  choice: les coups de fouet
  rationale: Désigne clairement des coups infligés avec un fouet; cette formulation est plus immédiatement compréhensible que «flagellations» tout en gardant la gravité du supplice.
- source_word: πεῖραν ἔλαβον
  choice: subirent
  rationale: L’expression signifie littéralement «reçurent l’épreuve de». «Subirent» exprime naturellement le fait d’endurer ces traitements sans transformer explicitement ceux-ci en mise à l’épreuve divine.
- source_word: ἔτι δὲ
  choice: et même
  rationale: Conserve la progression emphatique vers d’autres formes de persécution.
- source_word: δεσμῶν
  choice: les chaînes
  rationale: Équivalent concret, clair et évocateur des liens ou entraves imposés aux prisonniers.
- source_word: φυλακῆς
  choice: la prison
  rationale: Dans la coordination avec «les chaînes», «la prison» rend simplement et naturellement l’incarcération.
theological_decisions:
- issue: Valeur de πεῖραν ἔλαβον
  choice: Traduction idiomatique par «subirent», avec indication en note du sens plus littéral.
  alternative: «furent éprouvés par» ou «connurent l’épreuve des»
  rationale: Le grec peut présenter ces souffrances comme une épreuve, mais la phrase n’identifie pas explicitement celui qui éprouve. La traduction évite donc d’ajouter une interprétation théologique tout en préservant cette nuance dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif soutenu de l’énumération. «Coups de fouet» privilégie la clarté concrète; la note conserve la formulation grecque inhabituelle et sa possible nuance d’épreuve.
