id: HEB.11.15
reference: Hebrews 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: fr
  text: Et s’ils avaient gardé en mémoire ce pays[a] d’où ils étaient sortis, ils auraient eu l’occasion d’y retourner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette contrée » ou « cette patrie ». Le grec désigne le lieu terrestre qu’ils avaient quitté.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: avaient gardé en mémoire
  rationale: Dans cette condition irréelle, le présent grec évoque une pensée qui serait demeurée tournée vers le lieu quitté. Cette formulation française rend cette continuité sans réduire le verbe à de la nostalgie.
- source_word: ἐκείνης
  choice: ce pays
  rationale: Le démonstratif féminin renvoie au pays mentionné au verset précédent. « Pays » exprime ici un territoire d’origine sans lui donner nécessairement un sens politique.
- source_word: ἀφ’ ἧς
  choice: d’où
  rationale: Cette tournure française naturelle conserve clairement l’idée de provenance.
- source_word: ἐξέβησαν
  choice: ils étaient sortis
  rationale: Le plus-que-parfait convient à l’antériorité de leur départ, tandis que « sortir » préserve davantage que « quitter » l’image du mouvement hors d’un lieu.
- source_word: εἶχον ἂν
  choice: ils auraient eu
  rationale: Le conditionnel passé rend naturellement l’apodose irréelle exprimée par l’imparfait grec accompagné de ἄν.
- source_word: καιρὸν
  choice: l’occasion
  rationale: Dans ce contexte, καιρός désigne une possibilité favorable ou concrète, non simplement une durée.
- source_word: ἀνακάμψαι
  choice: d’y retourner
  rationale: Le verbe exprime le retour vers le lieu quitté. Le pronom « y » explicite naturellement en français que le retour aurait eu ce pays pour destination.
- source_word: καὶ εἰ μὲν
  choice: Et s’ils
  rationale: Cette formulation relie la proposition au raisonnement précédent. La particule μέν structure l’opposition avec la suite sans exiger ici un équivalent français distinct.
theological_decisions:
- issue: Nature du pays gardé en mémoire
  choice: Le lieu terrestre que les patriarches avaient quitté, implicitement opposé au pays meilleur et céleste des versets environnants.
  alternative: Une ancienne manière de vivre prise au sens figuré plutôt qu’un véritable lieu d’origine.
  rationale: Hébreux 11.13-16 emploie un langage spatial concret et oppose le pays d’origine des patriarches au pays meilleur qu’ils recherchent. La traduction conserve cette image sans l’allégoriser.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle française rend clairement l’irréel du passé, et « avaient gardé en mémoire » conserve l’idée d’une pensée durable sans surinterprétation affective.
