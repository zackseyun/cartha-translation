id: HEB.11.40
reference: Hebrews 11:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: fr
  text: car Dieu avait prévu pour nous quelque chose de meilleur[a], afin qu’ils ne soient pas amenés à la perfection sans nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait pourvu pour nous à quelque chose de meilleur ». Le participe grec peut évoquer à la fois le fait de voir d’avance et celui de prévoir ou préparer selon un dessein.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne parviennent pas à l’accomplissement indépendamment de nous ».
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: avait prévu
  rationale: Le verbe exprime littéralement l’idée de voir d’avance et peut, dans ce contexte, inclure celle de pourvoir ou de préparer selon un dessein préalable. « Avait prévu » reste naturel en français et préserve cette amplitude.
- source_word: κρεῖττόν τι
  choice: quelque chose de meilleur
  rationale: Cette formulation rend l’indéfini τι et conserve « meilleur », terme comparatif caractéristique de l’épître aux Hébreux.
- source_word: περὶ ἡμῶν
  choice: pour nous
  rationale: Avec προβλέπω, περί désigne ici ce que Dieu avait en vue à notre égard; « pour nous » en donne une expression française idiomatique sans exclure la nuance de « à notre sujet ».
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: « Afin que » garde clairement la valeur de visée ou de résultat intentionnel de la proposition grecque.
- source_word: χωρὶς ἡμῶν
  choice: sans nous
  rationale: « Sans nous » rend directement χωρίς et exprime que leur accomplissement ne devait pas se produire séparément du nôtre.
- source_word: τελειωθῶσιν
  choice: soient amenés à la perfection
  rationale: Cette tournure passive conserve à la fois les idées de perfection et d’achèvement portées par τελειόω dans l’épître, sans réduire le terme à la seule perfection morale.
- source_word: τοῦ θεοῦ
  choice: Dieu
  rationale: Le génitif absolu grec est rendu naturellement en français par une proposition causale introduite par « car ».
theological_decisions:
- issue: Sens de τελειωθῶσιν dans le cadre de l’accomplissement du salut
  choice: soient amenés à la perfection
  alternative: parviennent à l’accomplissement
  rationale: La formulation retenue laisse subsister la tension entre perfection, achèvement et accomplissement final, importante dans l’usage de τελειόω en Hébreux.
- issue: Portée de προβλεψαμένου
  choice: avait prévu
  alternative: avait pourvu à
  rationale: Le grec peut évoquer la prévision préalable tout en impliquant, dans le contexte, le dessein ou la disposition divine. Le texte principal garde la valeur lexicale directe et la note signale la nuance contextuelle de provision.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien causal avec le contexte précédent et le caractère collectif de l’accomplissement, tout en évitant de préciser au-delà du grec la nature de la « perfection ».
