id: HEB.11.16
reference: Hebrews 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: fr
  text: Mais en réalité, ils aspirent à une meilleure patrie, c’est-à-dire une patrie céleste. C’est pourquoi Dieu n’a pas honte d’être appelé leur Dieu, car il leur a préparé une ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mais en réalité
  rationale: Marque le contraste logique avec l’hypothèse du verset précédent plutôt qu’un simple repère temporel; cette tournure est naturelle en français moderne.
- source_word: κρείττονος
  choice: meilleure
  rationale: Rend directement le comparatif « meilleure, supérieure » et conserve le vocabulaire contrastif récurrent de l’épître.
- source_word: ὀρέγονται
  choice: ils aspirent à
  rationale: Exprime un désir profond orienté vers un but, tout en restant digne et idiomatique.
- source_word: κρείττονος ... ἐπουρανίου
  choice: une patrie meilleure, c’est-à-dire céleste
  rationale: Les adjectifs féminins au génitif supposent le nom féminin πατρίς du contexte. « Patrie » reprend précisément ce terme et conserve sa dimension d’appartenance sans ajouter d’explication.
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Signale clairement la conséquence tirée de leur aspiration à la patrie céleste.
- source_word: οὐκ ἐπαισχύνεται
  choice: n’a pas honte
  rationale: Équivalent français direct qui préserve la dimension d’honneur et de relation.
- source_word: ἐπικαλεῖσθαι αὐτῶν
  choice: d’être appelé leur Dieu
  rationale: Rend la désignation relationnelle et l’écho à la formule biblique sans la développer en paraphrase.
- source_word: ἡτοίμασεν
  choice: il leur a préparé
  rationale: Le passé composé présente naturellement en français une action accomplie dont le résultat demeure pertinent.
- source_word: πόλιν
  choice: une ville
  rationale: Conserve l’image eschatologique concrète et respecte le caractère non articulé du nom grec.
theological_decisions:
- issue: Nom sous-entendu avec κρείττονος et ἐπουρανίου
  choice: Rétablir « patrie » d’après πατρίδα au verset 14
  alternative: Employer « pays » ou laisser le nom implicite
  rationale: Le genre féminin des adjectifs renvoie naturellement à πατρίς dans le contexte. « Patrie » est l’équivalent lexical précis en français et maintient la cohérence du passage.
- issue: Formule relationnelle « leur Dieu »
  choice: Conserver littéralement « être appelé leur Dieu »
  alternative: Paraphraser par « les reconnaître comme son peuple »
  rationale: Le texte parle de la manière dont Dieu est désigné; l’élargir à la reconnaissance de son peuple ajouterait une formulation théologique qui n’est pas explicite ici.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant le calque; « aspirent à » communique l’élan de ὀρέγονται, et « patrie » assure la reprise contextuelle explicite sans nécessiter de note.
