id: HEB.11.22
reference: Hebrews 11:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: fr
  text: Par la foi, Joseph, à l’approche de sa mort[a], évoqua la sortie[b] des fils d’Israël et donna des instructions au sujet de ses ossements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors qu’il allait mourir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’exode ». Il s’agit du départ futur des fils d’Israël hors d’Égypte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Reprend la formule récurrente d’Hébreux 11 et exprime ici le moyen ou le fondement de l’action de Joseph.
- source_word: τελευτῶν
  choice: à l’approche de sa mort
  rationale: Rend naturellement le participe présent employé pour Joseph à la fin de sa vie, sans suggérer nécessairement qu’il était dans les derniers instants de l’agonie.
- source_word: περὶ τῆς ἐξόδου
  choice: la sortie
  rationale: Conserve le sens concret de départ hors d’Égypte et fait écho au vocabulaire biblique de l’Exode, sans transformer ici le nom commun en titre propre.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Préserve l’expression familiale explicite du grec plutôt que de l’aplanir en « Israélites ».
- source_word: ἐμνημόνευσεν
  choice: évoqua
  rationale: Avec περί, le verbe signifie faire mention de ou parler de, et non simplement se souvenir intérieurement.
- source_word: ἐνετείλατο
  choice: donna des instructions
  rationale: Exprime clairement l’acte de prescrire ou d’ordonner, dans un français actuel qui ne durcit pas indûment le ton.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: au sujet de ses ossements
  rationale: Maintient l’image concrète des os, importante pour l’allusion au commandement de Joseph, tout en employant le terme français naturel dans un contexte funéraire.
theological_decisions:
- issue: Sens de πίστις dans Hébreux 11
  choice: foi
  alternative: fidélité ; confiance
  rationale: La formule répétée du chapitre met en avant la foi par laquelle les personnages ont agi. « Foi » conserve aussi la cohérence lexicale et théologique du passage sans imposer ici le sens de fidélité.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. « Fils d’Israël » conserve la forme grecque, tandis que « ossements » est plus idiomatique que « os » dans ce contexte.
