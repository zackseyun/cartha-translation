id: HEB.11.14
reference: Hebrews 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: fr
  text: En effet, ceux qui parlent ainsi montrent clairement qu’ils recherchent une patrie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur propre pays » ou « leur terre natale ». Le v. 16 précise que la patrie espérée est céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Marque naturellement en français le lien explicatif avec le verset précédent, sans alourdir la phrase.
- source_word: τοιαῦτα
  choice: ainsi
  rationale: Dans « parlent ainsi », reprend de manière idiomatique les déclarations qui précèdent, avec le sens de « disent de telles choses ».
- source_word: λέγοντες
  choice: ceux qui parlent
  rationale: Rend le participe présent substantivé par une proposition relative naturelle, tout en conservant sa portée générale.
- source_word: ἐμφανίζουσιν
  choice: montrent clairement
  rationale: Exprime l’idée de rendre manifeste ou évident ce que leurs paroles révèlent.
- source_word: ὅτι
  choice: que
  rationale: Introduit directement le contenu rendu manifeste.
- source_word: πατρίδα
  choice: une patrie
  rationale: Le nom désigne le pays auquel une personne appartient ou aspire à appartenir. « Patrie » est digne, courant dans le registre biblique français et conserve l’indétermination du grec sans préciser encore si elle est terrestre ou céleste.
- source_word: ἐπιζητοῦσιν
  choice: recherchent
  rationale: Conserve l’idée d’une quête active et continue, plus précise ici que le simple désir.
theological_decisions:
- issue: Nature de la πατρίς recherchée par les patriarches
  choice: une patrie
  alternative: une patrie céleste / leur pays d’origine
  rationale: Le verset affirme seulement qu’ils recherchent une patrie. La traduction ne précise pas prématurément sa nature; le verset suivant indique qu’il s’agit finalement d’une patrie meilleure, céleste.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » assure la cohésion argumentative; « parlent ainsi » évite le tour plus lourd « disent de telles choses ». Le marqueur [a] figure immédiatement après le terme annoté.
