revisions:
- from: Par la foi, Abel offrit à Dieu un sacrifice meilleur que celui de Caïn[a]. Par ce sacrifice, il reçut le témoignage qu’il était juste[b], Dieu rendant témoignage au sujet de ses offrandes. Et, par ce moyen[c], bien qu’il soit mort, il parle encore.
  to: Par la foi, Abel offrit à Dieu un sacrifice meilleur que celui de Caïn[a] ; par elle, il fut attesté comme juste, Dieu rendant témoignage au sujet de ses offrandes. Et par elle, après sa mort, il parle encore[c].
  rationale: La révision conserve le vocabulaire du témoignage et les termes cultuels, tout en évitant de lever l’ambiguïté réelle des deux pronoms féminins. « Il fut attesté comme juste » est plus idiomatique que « il reçut le témoignage qu’il était juste » et demeure fidèle au passif de μαρτυρέω. « Après sa mort » exprime clairement l’antériorité du participe aoriste sans imposer une nuance concessive.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:42:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Abel offre par la foi un sacrifice supérieur à celui de Caïn, reçoit le témoignage qu’il est juste, et continue de parler après sa mort. Toutefois, « Par ce sacrifice » pour δι’ ἧς interprète inutilement le relatif, dont l’antécédent peut être la foi aussi bien que le sacrifice. « Par ce moyen » dans la dernière proposition est vague et ne préserve pas de manière satisfaisante le pronom grec ; « par elle » maintient mieux l’ambiguïté, même si l’antécédent reste implicite. Enfin, le subjonctif présent « bien qu’il soit mort » est moins précis que le participe aoriste, qui situe la mort comme accomplie.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Il reçut le témoignage qu’il était juste » est compréhensible, mais « il fut attesté comme juste » est plus concis et plus proche de la construction grecque, tout en gardant le motif du témoignage. La phrase peut demeurer une seule période sans devenir lourde.
  terminology: « Foi », « sacrifice », « juste », « témoignage » et « offrandes » conviennent. « Attesté comme juste » rend naturellement ἐμαρτυρήθη εἶναι δίκαιος sans imposer une lecture judiciaire ou confessionnelle.
  issues:
  - severity: medium
    issue: « Par ce sacrifice » rend δι’ ἧς de façon trop déterminée.
    rationale: Le relatif féminin peut grammaticalement reprendre θυσίαν, mais l’enchaînement rhétorique de Πίστει et l’ambiguïté signalée par l’audit anglais justifient de ne pas fixer le référent dans le texte français.
  - severity: medium
    issue: « Par ce moyen » pour δι’ αὐτῆς affaiblit le lien pronominal et son ambiguïté.
    rationale: Cette expression démonstrative et abstraite ne correspond pas bien au pronom féminin grec. « Par elle » permet de laisser ouvert le renvoi à la foi ou au sacrifice.
  - severity: low
    issue: « Bien qu’il soit mort » emploie un subjonctif présent alors que la mort est présentée comme antérieure et accomplie.
    rationale: « Après sa mort » ou « bien qu’il soit mort » est possible idiomatiquement, mais « après sa mort » rend plus nettement la valeur antérieure de ἀποθανών sans ajouter une force concessive non explicitement marquée.
  revised_text: Par la foi, Abel offrit à Dieu un sacrifice meilleur que celui de Caïn[a] ; par elle, il fut attesté comme juste, Dieu rendant témoignage au sujet de ses offrandes. Et par elle, après sa mort, il parle encore[c].
  revised_footnotes:
  - marker: a
    text: Ou « un sacrifice plus grand que celui de Caïn ». Le comparatif grec peut évoquer la qualité (« meilleur ») ou l’importance, voire la quantité (« plus grand »).
    reason: lexical_alternative
  - marker: c
    text: Le pronom « elle » peut renvoyer soit à la foi d’Abel, soit à son sacrifice ; le grec ne permet pas de trancher avec certitude.
    reason: alternative_reading
  revision_rationale: La révision conserve le vocabulaire du témoignage et les termes cultuels, tout en évitant de lever l’ambiguïté réelle des deux pronoms féminins. « Il fut attesté comme juste » est plus idiomatique que « il reçut le témoignage qu’il était juste » et demeure fidèle au passif de μαρτυρέω. « Après sa mort » exprime clairement l’antériorité du participe aoriste sans imposer une nuance concessive.
