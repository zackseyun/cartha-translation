source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: fr
  text: Par la foi, Abel offrit à Dieu un sacrifice meilleur que celui de Caïn[a] ; par elle, il fut attesté comme juste, Dieu rendant témoignage au sujet de ses offrandes. Et par elle, après sa mort, il parle encore[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sacrifice plus grand que celui de Caïn ». Le comparatif grec peut évoquer la qualité (« meilleur ») ou l’importance, voire la quantité (« plus grand »).
    reason: lexical_alternative
  - marker: c
    text: Le pronom « elle » peut renvoyer soit à la foi d’Abel, soit à son sacrifice ; le grec ne permet pas de trancher avec certitude.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen. « Foi » correspond au thème directeur d’Hébreux 11 et décrit la réponse confiante d’Abel.
- source_word: πλείονα θυσίαν
  choice: un sacrifice meilleur
  rationale: Le comparatif πλείων peut porter sur la qualité ou sur l’importance. Dans ce contexte, « meilleur » est naturel et s’accorde avec le langage comparatif de l’épître, sans ajouter l’idée interprétative d’acceptabilité.
- source_word: παρὰ Κάϊν
  choice: que celui de Caïn
  rationale: παρά après un comparatif introduit le terme de comparaison. L’ajout idiomatique de « celui de » indique clairement que le sacrifice d’Abel est comparé à celui de Caïn.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: offrit à Dieu
  rationale: Dans un contexte sacrificiel, προσφέρω désigne naturellement l’action d’offrir.
- source_word: δι’ ἧς
  choice: Par ce sacrifice
  rationale: Le relatif féminin grec renvoie grammaticalement à θυσίαν, « sacrifice ». La reprise nominale évite une tournure française lourde tout en conservant ce lien.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: il reçut le témoignage qu’il était juste
  rationale: Cette formulation française naturelle préserve à la fois le passif, le motif du témoignage récurrent dans le chapitre et la qualification d’Abel comme juste.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: Dieu rendant témoignage au sujet de ses offrandes
  rationale: Le génitif absolu est rendu par une proposition circonstancielle. « Au sujet de » exprime la relation marquée par ἐπί, et « offrandes » convient au sens cultuel de δῶρα.
- source_word: δι’ αὐτῆς
  choice: par ce moyen
  rationale: Cette expression garde autant que possible l’indétermination du pronom grec, qui peut reprendre la foi d’Abel ou son sacrifice, sans favoriser artificiellement l’un des deux en raison du genre grammatical français.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: bien qu’il soit mort, il parle encore
  rationale: La tournure concessive fait ressortir naturellement le contraste entre la mort passée d’Abel et la portée toujours actuelle de son témoignage.
theological_decisions:
- issue: Référent de δι’ αὐτῆς dans la dernière proposition
  choice: Maintenir l’indétermination avec « par ce moyen »
  alternative: « par la foi » ou « par son sacrifice »
  rationale: Le pronom féminin grec peut reprendre soit la foi, thème dominant du chapitre, soit le sacrifice, antécédent féminin plus proche. Le texte principal ne tranche donc pas une ambiguïté réelle.
- issue: Portée de ἐμαρτυρήθη
  choice: « il reçut le témoignage qu’il était juste »
  alternative: « il fut reconnu comme juste » ou « il fut déclaré juste »
  rationale: La formulation retenue conserve le vocabulaire du témoignage, important dans Hébreux 11, sans transformer le verbe en déclaration judiciaire explicite ni en simple approbation.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en trois phrases allège la longue période grecque sans en modifier la progression. « Offrandes » est préféré à « dons » dans ce contexte cultuel, et l’ambiguïté finale est explicitement préservée.
