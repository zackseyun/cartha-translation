  terminology: '« Par la foi », « fidèle » et « concevoir » conviennent au registre et au vocabulaire du passage. La note doit éviter de faire du « dépôt de semence » une explication française prétendument transparente : il s’agit d’une formulation littérale inhabituelle, dont l’interprétation fait débat.'
