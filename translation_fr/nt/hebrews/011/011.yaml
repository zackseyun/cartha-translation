source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: fr
  text: Par la foi, même Sara a reçu la capacité de concevoir un enfant[a], alors qu’elle avait dépassé l’âge où cela était normalement possible, parce qu’elle a estimé fidèle celui qui avait promis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « a reçu une capacité pour le dépôt de semence ». L’expression grecque est inhabituelle et son sens exact est discuté ; dans le contexte, elle renvoie à la possibilité d’avoir une descendance.'
    reason: Conserver la formulation inhabituelle de l’original et signaler l’ambiguïté de l’expression sans imposer une interprétation.
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif exprime ici le moyen et reprend la formule caractéristique d’Hébreux 11. « Par la foi » est naturel en français et conserve le terme théologique central du passage.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: Sara elle-même
  rationale: Le pronom intensif met Sara en relief comme exemple personnel de foi. « Elle-même » en restitue clairement l’insistance sans alourdir la phrase.
- source_word: δύναμιν ... ἔλαβεν
  choice: a reçu la capacité
  rationale: La tournure rend directement l’idée de recevoir la puissance ou l’aptitude nécessaire. « Capacité » convient mieux que « puissance » à la conception d’un enfant en français courant.
- source_word: εἰς καταβολὴν σπέρματος
  choice: de concevoir un enfant
  rationale: L’expression grecque, rare et difficile, signifie dans ce contexte que Sara a été rendue capable d’avoir un enfant. La formulation idiomatique française garde Sara comme sujet ; le tour plus littéral est signalé en note.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: même au-delà de l’âge où cela était normalement possible
  rationale: παρά avec l’accusatif marque le dépassement d’une limite, tandis que καιρός désigne le moment approprié et ἡλικία l’âge ou l’étape de la vie. La formulation est claire sans fixer un âge précis absent du grec.
- source_word: ἐπεὶ
  choice: parce que
  rationale: La conjonction introduit la raison pour laquelle Sara a reçu cette capacité.
- source_word: πιστὸν
  choice: fidèle
  rationale: « Fidèle » exprime la fiabilité de Dieu tout en conservant la portée théologique du mot grec.
- source_word: ἡγήσατο
  choice: a estimé
  rationale: Le verbe décrit un jugement réfléchi. « Estimer » restitue ce sens évaluatif dans un registre digne et naturel.
- source_word: τὸν ἐπαγγειλάμενον
  choice: celui qui avait fait la promesse
  rationale: Le participe substantivé désigne Dieu par son acte de promettre. Cette traduction suit la construction grecque sans ajouter son nom dans le texte.
theological_decisions:
- issue: Sujet grammatical et sens de l’action de Sara dans une proposition syntaxiquement difficile
  choice: 'Sara est le sujet : elle a reçu la capacité de concevoir un enfant.'
  alternative: Abraham serait implicitement le sujet principal, ou l’expression désignerait plus généralement l’établissement d’une descendance.
  rationale: Dans la forme grecque fournie, αὐτῇ Σάρρᾳ désigne le plus naturellement Sara comme sujet de ἔλαβεν. Bien que καταβολὴ σπέρματος puisse évoquer littéralement le dépôt de semence, le contexte porte sur la capacité miraculeuse de Sara à avoir un enfant malgré son âge. La note préserve toutefois l’étrangeté de l’expression source.
- issue: Sens de πιστός appliqué à celui qui a promis
  choice: fidèle
  alternative: digne de confiance ; fiable
  rationale: Le verset fonde la foi de Sara sur la constance de celui qui a promis. « Fidèle » garde cette richesse théologique sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé favorise une lecture actuelle ; la syntaxe conserve l’accent sur la foi de Sara et sur la fidélité de celui qui a promis.
