  text: ⸀καὶ πάντες μαρτυρηθέντες διὰ τῆς πίστεως οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: fr
  text: Et tous ceux-là, bien qu’ayant reçu un témoignage favorable par leur foi[a], n’ont pas reçu la promesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant reçu approbation » ou « ayant été attestés favorablement ». Le participe grec souligne qu’un témoignage favorable a été rendu à ces personnes par le moyen de la foi.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’ont pas obtenu la promesse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάντες
  choice: Et tous ceux-là
  rationale: « Et » conserve le lien simple avec ce qui précède, tandis que « tous ceux-là » reprend naturellement en français les personnes énumérées dans le chapitre.
- source_word: μαρτυρηθέντες
  choice: bien qu’ils aient reçu un témoignage favorable
  rationale: Le participe passif exprime le témoignage favorable rendu à ces personnes. « Bien que » explicite la valeur concessive créée par le contraste contextuel avec le fait qu’elles n’ont pas reçu la promesse.
- source_word: διὰ τῆς πίστεως
  choice: grâce à leur foi
  rationale: διά avec le génitif indique ici le moyen. « Grâce à leur foi » est naturel en français et précise que la foi est celle des personnes mentionnées, sans changer le sens.
- source_word: οὐκ ἐκομίσαντο
  choice: n’ont pas reçu
  rationale: Le moyen de κομίζω peut signifier recevoir ou obtenir ce qui est promis. « N’ont pas reçu » est clair et conserve la formulation sobre du grec.
- source_word: τὴν ἐπαγγελίαν
  choice: la promesse
  rationale: Le singulier défini est conservé sans l’expliciter comme l’accomplissement ou l’objet promis, afin de laisser le contexte préciser sa portée.
theological_decisions:
- issue: Sens de « la promesse »
  choice: la promesse
  alternative: ce qui avait été promis ; l’accomplissement de la promesse
  rationale: Le grec garde une formulation compacte. La traduction ne précise donc pas s’il s’agit de la chose promise ou de son accomplissement, préservant ainsi la tension théologique éclairée par le verset suivant.
- issue: Source du témoignage favorable
  choice: Ne pas ajouter explicitement « de Dieu »
  alternative: ayant reçu l’approbation de Dieu
  rationale: Le contexte suggère fortement Dieu comme auteur du témoignage, mais le passif grec ne le nomme pas ici. La traduction évite de rendre explicite ce qui demeure implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « reçu un témoignage favorable » conserve le motif récurrent du témoignage dans Hébreux 11, tandis que les notes présentent des équivalents possibles sans alourdir le texte principal.
