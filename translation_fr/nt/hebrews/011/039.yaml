  source_fidelity: 'Le sens général est fidèle : tous les croyants mentionnés ont reçu un témoignage favorable au moyen de la foi, sans recevoir « la promesse ». Toutefois, l’alternative « reconnus dignes d’approbation » ajoute l’idée d’être jugés dignes, qui n’est pas portée par μαρτυρηθέντες.'
  naturalness: Le texte principal est clair et naturel en français international moderne. La construction participiale « bien qu’ayant reçu » rend plus directement la forme participiale grecque et évite une subordonnée verbale un peu plus lourde.
  terminology: « Témoignage favorable » conserve utilement le motif de μαρτυρέω dans Hébreux 11 sans expliciter Dieu comme auteur du témoignage. « La promesse » préserve à juste titre le singulier défini et son ouverture interprétative. « Par leur foi » rend sobrement le moyen exprimé par διά avec le génitif.
