source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: fr
  text: Il considéra l’opprobre du Messie[a] comme une richesse supérieure aux trésors d’Égypte, car il regardait vers la récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « l’opprobre du Messie » peut désigner l’opprobre subi pour le Messie, celui que l’on partage avec l’oint de Dieu, ou celui qui, selon l’épître aux Hébreux, trouve son accomplissement dans le Messie. Le grec ne précise pas davantage ce rapport.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: une richesse plus grande
  rationale: Le comparatif exprime une valeur supérieure et maintient le contraste direct avec les trésors de l’Égypte.
- source_word: ἡγησάμενος
  choice: Il considéra … comme
  rationale: ἡγέομαι signifie ici « considérer, tenir pour ». Une proposition avec un verbe conjugué est naturelle en français et conserve l’évaluation faite par Moïse.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: les trésors de l’Égypte
  rationale: Cette formulation idiomatique rend directement le génitif grec.
- source_word: τὸν ὀνειδισμὸν
  choice: l’opprobre
  rationale: « Opprobre » exprime la honte publique, les insultes et le mépris attachés à l’identification avec quelqu’un, sans réduire le terme à un seul aspect.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en rend la valeur titulaire tout en préservant la formulation théologique du grec.
- source_word: ἀπέβλεπεν
  choice: il gardait les yeux fixés sur
  rationale: L’imparfait grec indique une orientation soutenue. Cette expression française naturelle conserve l’idée d’une attention durable.
- source_word: τὴν μισθαποδοσίαν
  choice: la récompense
  rationale: Le nom désigne la rétribution ou récompense attendue. « Récompense » est clair et convient au contexte de la foi persévérante.
theological_decisions:
- issue: Le rapport entre Moïse et « l’opprobre du Messie »
  choice: Conserver littéralement le génitif « l’opprobre du Messie »
  alternative: l’opprobre subi pour le Messie ; l’opprobre partagé avec l’oint de Dieu ; l’opprobre qui annonce le Messie
  rationale: Le génitif grec ne définit pas précisément ce rapport. La traduction garde donc l’ambiguïté et la tension christologique du texte au lieu d’imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et lisible. « Opprobre » est légèrement soutenu mais précis et bien établi dans le registre biblique. « Gardait les yeux fixés sur » rend concrètement l’orientation continue exprimée par l’imparfait grec.
