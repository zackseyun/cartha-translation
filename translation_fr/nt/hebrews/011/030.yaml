  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: fr
  text: Par la foi[a], les murailles de Jéricho tombèrent après avoir été encerclées pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au moyen de la foi ». Le datif grec πίστει peut exprimer le moyen ou la manière ; le texte conserve la formule récurrente d’Hébreux 11.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Par la foi
  rationale: Le datif peut exprimer le moyen ou la manière. « Par la foi » conserve l’ambiguïté relative du grec ainsi que la formule récurrente d’Hébreux 11.
- source_word: τὰ τείχη Ἰεριχὼ
  choice: les murailles de Jéricho
  rationale: τεῖχος désigne ici l’enceinte fortifiée d’une ville. « Murailles » est plus naturel que « murs » pour Jéricho et rend correctement le rapport avec le nom propre.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: L’aoriste de πίπτω signifie simplement « tomber ». « S’effondrèrent » serait possible, mais préciserait davantage la manière dont les murailles sont tombées.
- source_word: κυκλωθέντα
  choice: après qu’on en eut fait le tour
  rationale: Le participe aoriste passif de κυκλόω présente l’action comme antérieure à la chute. Cette tournure française naturelle garde les murailles comme objet de l’action sans nommer les acteurs, que le grec ne précise pas ici.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: pendant sept jours
  rationale: ἐπί suivi de l’accusatif marque ici une durée ou une étendue temporelle. « Pendant sept jours » est idiomatique et correspond à l’allusion narrative à Josué 6.
theological_decisions:
- issue: Sens de πίστις en Hébreux 11.30
  choice: foi
  alternative: confiance ; fidélité
  rationale: Dans la formule répétée d’Hébreux 11, « foi » est le terme français le plus direct et le plus traditionnel. Le contexte ne justifie pas de substituer « fidélité », tandis que « confiance » réduirait quelque peu la portée possible du mot.
- issue: Valeur du datif πίστει
  choice: Par la foi
  alternative: Dans la foi ; au moyen de la foi
  rationale: Le grec permet une nuance instrumentale ou modale. Le texte principal ne tranche pas excessivement entre ces valeurs et la note signale explicitement l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La tournure impersonnelle « on en eut fait le tour » évite d’ajouter dans le texte principal des acteurs que le grec ne nomme pas.
