id: HEB.11.35
reference: Hebrews 11:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: fr
  text: Des femmes ont reçu leurs morts rendus à la vie[a] ; mais d’autres ont été torturés[b], sans accepter la libération, afin d’obtenir une résurrection meilleure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « par résurrection ». Il s’agit ici de personnes mortes rendues à la vie et à leurs proches.
    reason: clarification
  - marker: b
    text: Le verbe grec désigne un supplice corporel sévère. Il a été associé à divers instruments de torture, mais la méthode exacte n’est pas certaine.
    reason: cultural_note
  - marker: c
    text: Cette « résurrection meilleure » est mise en contraste avec le retour précédent à une vie encore mortelle ; elle renvoie à une espérance de résurrection au-delà de la mort.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: ont retrouvé
  rationale: Avec « leurs morts » et « par une résurrection », le verbe exprime le fait de recevoir de nouveau des proches qui avaient été perdus par la mort. « Retrouver » rend naturellement cette restitution en français.
- source_word: γυναῖκες
  choice: Des femmes
  rationale: Le pluriel désigne des femmes, sans imposer le sens plus précis d’« épouses ».
- source_word: ἐξ ἀναστάσεως
  choice: par une résurrection
  rationale: La préposition exprime ici la source ou le moyen par lequel les morts leur ont été rendus. L’article indéfini convient à ces retours particuliers à la vie et prépare le contraste avec « une résurrection meilleure ».
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: leurs morts
  rationale: Expression française naturelle pour les personnes décédées qui leur appartenaient affectivement, sans préciser davantage le lien familial.
- source_word: ἄλλοι δὲ
  choice: mais d’autres
  rationale: « Mais » fait ressortir le contraste entre ceux qui ont connu une délivrance et ceux qui ont accepté la souffrance et la mort.
- source_word: ἐτυμπανίσθησαν
  choice: ont été torturés
  rationale: Le verbe évoque un supplice corporel violent, peut-être infligé sur un instrument particulier, mais la méthode exacte reste incertaine ; le terme général évite une précision non assurée.
- source_word: οὐ προσδεξάμενοι
  choice: ont refusé
  rationale: Le participe indique qu’ils n’ont pas accepté ce qui leur était offert. « Ont refusé » est direct et naturel dans ce contexte.
- source_word: τὴν ἀπολύτρωσιν
  choice: la libération
  rationale: Dans ce contexte, il s’agit d’être relâché et soustrait au supplice ou à la mort, plutôt que de la rédemption au sens sotériologique.
- source_word: ἵνα
  choice: afin de
  rationale: Cette tournure exprime clairement le but de leur refus.
- source_word: κρείττονος ἀναστάσεως
  choice: une résurrection meilleure
  rationale: « Meilleure » correspond au vocabulaire comparatif caractéristique de l’épître et conserve le contraste formulé par le texte.
- source_word: τύχωσιν
  choice: obtenir
  rationale: Le verbe signifie ici parvenir à recevoir ou atteindre quelque chose ; « obtenir » s’emploie naturellement avec « une résurrection meilleure ».
theological_decisions:
- issue: Sens de ἀπολύτρωσιν dans le contexte
  choice: libération temporelle du supplice ou de la mort
  alternative: rédemption au sens théologique plus large
  rationale: Le contexte immédiat présente des fidèles qui refusent une possibilité d’échapper au supplice. « Libération » conserve ce sens narratif sans importer une affirmation sotériologique qui n’est pas exigée ici.
- issue: Portée de « résurrection meilleure »
  choice: résurrection supérieure aux retours temporaires à la vie évoqués dans la première proposition
  alternative: résurrection simplement plus favorable, sans contraste défini avec les exemples précédents
  rationale: La construction du verset oppose les morts rendus à des femmes à l’espérance pour laquelle d’autres acceptent le martyre. La traduction garde ce contraste tout en laissant la note expliquer sa portée eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste rhétorique du grec. « Retrouvé leurs morts » est plus idiomatique que « reçu leurs morts », tandis que « par une résurrection » maintient explicitement le motif de la résurrection. Les marqueurs de notes suivent l’ordre d’apparition dans le texte.
