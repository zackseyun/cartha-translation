revisions:
- from: Des femmes ont retrouvé leurs morts par une résurrection[a] ; mais d’autres ont été torturés[b] et ont refusé la libération, afin d’obtenir une résurrection meilleure[c].
  to: Des femmes ont reçu leurs morts rendus à la vie[a] ; mais d’autres ont été torturés[b], sans accepter la libération, afin d’obtenir une résurrection meilleure[c].
  rationale: La révision rend plus nettement le fait de recevoir de nouveau les morts rendus à la vie, et surtout la nuance de refus d’une libération offerte. Elle conserve « libération » et « résurrection meilleure », qui sont fidèles au contexte et au vocabulaire de l’épître, sans imposer d’interprétation doctrinale. Les notes sont conservées, avec une formulation historique plus prudente concernant le supplice.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:42:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le contraste entre des femmes qui récupèrent leurs morts rendus à la vie et d’autres qui refusent une libération pour obtenir une résurrection supérieure est conservé. Toutefois, « ont refusé la libération » peut, en français, suggérer qu’ils refusaient activement la libération elle-même, tandis que le participe grec exprime plus explicitement le refus d’accepter une libération qui leur était proposée. « sans accepter la libération » reflète mieux cette relation sans alourdir le texte.'
  naturalness: Le français est globalement naturel et de registre approprié. « Des femmes ont retrouvé leurs morts » est compréhensible, mais « ont reçu leurs morts rendus à la vie » restitue plus clairement le mouvement de ἔλαβον et l’effet de la résurrection, sans la nuance potentiellement affective ou fortuite de « retrouver ».
  terminology: '« Libération » convient pour ἀπολύτρωσις dans ce contexte et évite à juste titre « rédemption ». « Une résurrection meilleure » est fidèle à κρείττονος ἀναστάσεως et préserve le comparatif caractéristique de l’épître. La note sur le supplice doit cependant éviter de présenter comme probable un dispositif précis : le sens de ἐτυμπανίσθησαν est celui d’un supplice violent, tandis que la technique exacte demeure discutée.'
  issues:
  - severity: medium
    issue: Rendu de οὐ προσδεξάμενοι
    rationale: « ont refusé la libération » est possible, mais ne rend pas aussi explicitement que le grec l’idée de ne pas accepter une libération offerte. « sans accepter la libération » maintient la dépendance participiale et la nuance contextuelle.
  - severity: low
    issue: Formulation de ἔλαβον ... ἐξ ἀναστάσεως
    rationale: « ont retrouvé leurs morts par une résurrection » est intelligible, mais « ont reçu leurs morts rendus à la vie » est plus explicite et plus proche de la restitution exprimée par ἔλαβον, tout en conservant l’ambiguïté modeste de la construction grecque.
  - severity: low
    issue: Note culturelle sur ἐτυμπανίσθησαν
    rationale: L’évocation d’un chevalet ou d’un tambour est très conjecturale. Une note plus sobre signale le supplice corporel sévère et l’incertitude sur la méthode, sans fixer d’instrument.
