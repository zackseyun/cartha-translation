  text: πρὸς ὃν ἐλαλήθη ὅτι Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/018.yaml
  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: fr
  text: 'lui à qui il avait été dit : « C’est par Isaac que ta descendance sera appelée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « En Isaac, une semence sera appelée pour toi. »'
    reason: Signaler la forme plus littérale de Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα et le terme collectif « semence ».
lexical_decisions:
- source_word: πρὸς ὃν
  choice: lui à qui
  rationale: Cette tournure rattache le relatif à Abraham, mentionné dans le contexte, tout en introduisant naturellement en français le destinataire de la parole.
- source_word: ἐλαλήθη
  choice: il avait été dit
  rationale: Le plus-que-parfait passif rend l'antériorité de la parole reçue par rapport à l'épreuve racontée dans le contexte et conserve la formulation passive du grec.
- source_word: ὅτι
  choice: ponctuation introductive de la citation
  rationale: En français, les deux-points et les guillemets introduisent naturellement le contenu de la parole sans qu'il soit nécessaire de traduire ὅτι par « que ».
- source_word: Ἐν Ἰσαὰκ
  choice: par Isaac
  rationale: Dans cette citation de Genèse 21.12, « par Isaac » exprime naturellement la lignée par laquelle la descendance promise sera reconnue, sans réduire ἐν à une localisation.
- source_word: κληθήσεταί
  choice: sera appelée
  rationale: Le futur passif conserve au plus près le verbe καλέω et son ambiguïté entre appellation et désignation/reconnaissance.
- source_word: σοι
  choice: ta
  rationale: 'Le datif a ici une valeur possessive naturelle en français : « ta descendance ».'
- source_word: σπέρμα
  choice: descendance
  rationale: « Descendance » rend clairement le collectif singulier dans un français moderne et digne; « postérité » est plus traditionnel et « semence » risquerait d'être opaque dans le texte principal.
theological_decisions:
- issue: La désignation de la lignée promise par Isaac
  choice: « C’est par Isaac que sera appelée ta descendance »
  alternative: « En Isaac une descendance sera appelée pour toi »
  rationale: La formulation retenue exprime la lignée issue d'Isaac tout en maintenant le passif « sera appelée ». Elle n'explicite pas davantage la nature de cette désignation et préserve ainsi la tension du texte.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste étroitement liée au verset précédent; « lui à qui » reflète cette dépendance syntaxique. La tournure emphatique « C’est par Isaac que » clarifie l’idiome sans développer son interprétation.
