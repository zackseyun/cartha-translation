id: HEB.9.14
reference: Hebrews 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: fr
  text: À combien plus forte raison le sang du Messie — qui, par l’Esprit éternel, s’est offert lui-même à Dieu sans défaut — purifiera-t-il notre conscience des œuvres mortes, afin que nous rendions un culte au Dieu vivant[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par un esprit éternel ». La formule grecque peut recevoir un sens plus général, bien qu’elle soit comprise ici comme une référence à l’Esprit Saint.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: combien plus… !
  rationale: Rend l’argument a fortiori et sa force rhétorique en français naturel, en continuité avec le verset précédent.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: le sang du Messie
  rationale: Conserve l’image sacrificielle de αἷμα et rend Χριστός comme un titre, « Messie ».
- source_word: διὰ πνεύματος αἰωνίου
  choice: par l’Esprit éternel
  rationale: « Par » exprime ici le moyen ou l’agent de l’offrande. La majuscule retient comme lecture principale une référence à l’Esprit Saint, sans nier l’ambiguïté de la formule grecque.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: s’est offert lui-même
  rationale: Le verbe « offrir » convient au contexte cultuel et sacrificiel; « lui-même » maintient l’insistance du pronom réfléchi.
- source_word: ἄμωμον
  choice: sans défaut
  rationale: Expression claire qui préserve l’arrière-plan des victimes sacrificielles exemptes de défaut.
- source_word: καθαριεῖ
  choice: purifiera
  rationale: Respecte le futur grec et s’intègre au vocabulaire de purification cultuelle du passage.
- source_word: τὴν συνείδησιν ἡμῶν
  choice: notre conscience
  rationale: Rend directement le singulier collectif du texte grec.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: des œuvres mortes
  rationale: Traduction proche du grec, qui conserve la densité et l’ambiguïté théologiques de l’expression également employée en Hébreux 6.1.
- source_word: εἰς τὸ λατρεύειν
  choice: afin que nous rendions un culte
  rationale: Exprime la finalité et fait entendre la dimension cultuelle de λατρεύω, plus nettement que le seul verbe « servir ».
- source_word: θεῷ ζῶντι
  choice: au Dieu vivant
  rationale: Formulation française idiomatique et bibliquement établie pour cette désignation définie de Dieu.
theological_decisions:
- issue: Référent de πνεύματος αἰωνίου
  choice: l’Esprit éternel
  alternative: un esprit éternel
  rationale: La lecture comme référence à l’Esprit Saint est retenue dans le texte principal, mais l’absence d’article et la portée sémantique de πνεῦμα permettent une lecture plus générale; celle-ci est donc signalée en note.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme est rendu selon son sens titulaire, « l’Oint / le Messie », plutôt que simplement translittéré comme un nom propre.
- issue: Portée de λατρεύειν
  choice: rendre un culte
  alternative: servir
  rationale: Le contexte du sanctuaire et des sacrifices favorise la nuance cultuelle, tout en comprenant le culte comme service rendu à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve l’élan de l’argument a fortiori, tandis que les tirets isolent la proposition relative sans obscurcir la phrase principale. Le point d’exclamation rend la valeur rhétorique de πόσῳ μᾶλλον.
