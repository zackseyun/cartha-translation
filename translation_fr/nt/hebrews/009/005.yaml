  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: fr
  text: Au-dessus de l’arche se trouvaient les chérubins de gloire, qui couvraient de leur ombre le couvercle d’expiation[a]. Il n’est pas possible maintenant de parler de tout cela en détail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, traditionnellement : « le propitiatoire », c’est-à-dire le couvercle de l’arche. Le terme grec peut aussi être rendu par « moyen d’expiation ».'
    reason: Le terme ἱλαστήριον désigne ici le couvercle de l’arche; la note préserve le terme cultuel traditionnel et une autre possibilité de traduction sans déplacer le sens contextuel du verset.
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Au-dessus de l’arche
  rationale: Le pronom féminin renvoie à l’arche mentionnée dans le contexte précédent. La répétition explicite du référent est naturelle en français et évite une ambiguïté de pronom.
- source_word: Χερουβὶν δόξης
  choice: les chérubins de gloire
  rationale: « Chérubins » est le terme biblique français usuel. Le complément « de gloire » conserve la formulation grecque compacte et son lien possible avec la gloire divine, sans la réduire à « glorieux ».
- source_word: κατασκιάζοντα
  choice: qui couvraient de leur ombre
  rationale: Cette expression rend concrètement l’action des chérubins étendant leurs ailes au-dessus du couvercle, tout en conservant l’image de l’ombre présente dans le verbe grec.
- source_word: τὸ ἱλαστήριον
  choice: le couvercle d’expiation
  rationale: Dans ce contexte mobilier, le mot désigne concrètement le couvercle de l’arche. « D’expiation » maintient sa portée cultuelle et théologique sans transformer cet objet en sacrifice abstrait.
- source_word: περὶ ὧν
  choice: de tout cela
  rationale: La tournure renvoie collectivement aux éléments du sanctuaire qui viennent d’être énumérés. « De tout cela » est idiomatique et garde cette portée plurielle.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: il n’est pas possible maintenant de parler … en détail
  rationale: 'La formulation conserve l’impersonnel grec, l’idée de limitation présente et le sens de κατὰ μέρος : exposer point par point ou en détail.'
theological_decisions:
- issue: Sens de ἱλαστήριον dans la description du sanctuaire
  choice: couvercle d’expiation
  alternative: propitiatoire ; moyen d’expiation ; sacrifice expiatoire
  rationale: Le contexte désigne nécessairement l’objet matériel situé sur l’arche et sous les chérubins. La traduction principale indique donc qu’il s’agit d’un couvercle, tout en conservant avec « d’expiation » la fonction cultuelle exprimée par le terme grec. La note signale le terme français traditionnel et la portée sémantique plus large sans imposer une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement grec sans être artificielle ; le vocabulaire biblique traditionnel est conservé lorsqu’il demeure compréhensible, et le terme technique « propitiatoire » est expliqué en note.
