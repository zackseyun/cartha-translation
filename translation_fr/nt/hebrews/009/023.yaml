id: HEB.9.23
reference: Hebrews 9:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: fr
  text: Il fallait donc que les représentations[a] des réalités qui sont dans les cieux soient purifiées[b] par ces sacrifices, mais que les réalités célestes elles-mêmes soient purifiées par des sacrifices[c] meilleurs que ceux-ci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « copies », « modèles » ou « figures ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nettoyées ». Le verbe relève ici du langage rituel de la purification.
    reason: lexical_alternative
  - marker: c
    text: Le grec emploie le pluriel « sacrifices », bien que le contexte de la lettre aux Hébreux mette l’accent sur l’offrande du Messie accomplie une fois pour toutes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Il fallait donc
  rationale: Cette tournure impersonnelle naturelle exprime la nécessité et le lien logique avec ce qui précède. L’imparfait convient à l’explication rétrospective des rites évoqués dans le contexte.
- source_word: τὰ μὲν ὑποδείγματα
  choice: les représentations
  rationale: Le terme désigne ici des réalités terrestres qui correspondent aux réalités célestes. « Représentations » reste clair sans suggérer nécessairement des reproductions exactes.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: des réalités qui sont dans les cieux
  rationale: Cette formulation conserve la construction relative et le pluriel de « cieux », tout en employant « réalités » plutôt que le très vague « choses » dans un français naturel.
- source_word: τούτοις καθαρίζεσθαι
  choice: soient purifiées par ces sacrifices
  rationale: Le verbe appartient au vocabulaire de la purification rituelle. Le démonstratif instrumental est explicité par « sacrifices » d’après le contexte immédiat, afin d’éviter une formulation française obscure.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: mais les réalités célestes elles-mêmes
  rationale: « Elles-mêmes » restitue l’emphase de αὐτά et maintient le contraste entre les représentations terrestres et les réalités célestes, sans préciser davantage leur référent.
- source_word: κρείττοσι θυσίαις παρὰ ταύτας
  choice: par des sacrifices meilleurs que ceux-ci
  rationale: La comparaison est conservée directement, et le pluriel de θυσίαις est maintenu malgré l’accent mis ailleurs dans l’épître sur l’offrande unique du Messie.
theological_decisions:
- issue: Le référent des « réalités célestes » et leur purification
  choice: Conserver l’affirmation selon laquelle les réalités célestes elles-mêmes doivent être purifiées.
  alternative: Identifier explicitement ces réalités au sanctuaire céleste, au peuple céleste, ou reformuler pour éviter de parler d’une purification céleste.
  rationale: Le grec applique le langage de la purification aux représentations terrestres comme aux réalités célestes. La traduction préserve cette tension sans imposer une explication interprétative.
- issue: Le pluriel « sacrifices » en rapport avec l’offrande unique du Messie
  choice: Maintenir le pluriel « sacrifices » dans le texte principal.
  alternative: Employer le singulier « sacrifice » pour harmoniser le verset avec l’offrande unique soulignée ailleurs dans Hébreux.
  rationale: θυσίαις est explicitement au pluriel. Le conserver respecte le texte source et évite une harmonisation théologique silencieuse.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste formel entre les représentations terrestres et les réalités célestes. « Réalités » évite la lourdeur de « choses » sans déterminer précisément la nature des éléments célestes.
