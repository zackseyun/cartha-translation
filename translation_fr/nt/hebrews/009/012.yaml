source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: fr
  text: Ce n’est pas non plus par le sang de boucs et de veaux, mais par son propre sang, qu’il est entré une fois pour toutes dans les lieux saints[a], ayant obtenu une rédemption éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le sanctuaire ». Le grec emploie ici l’expression cultuelle au pluriel « les lieux saints ». Certaines traductions précisent « dans le lieu très saint », mais cette formulation est plus interprétative que ne l’exige le texte grec.
    reason: Signaler une autre traduction possible de l’expression cultuelle plurielle sans imposer un référent plus précis.
lexical_decisions:
- source_word: οὐδὲ
  choice: Ce n’est pas non plus
  rationale: Cette tournure reprend naturellement en français le contraste commencé au verset précédent et conserve la valeur connective de οὐδὲ.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: par le sang de boucs et de veaux
  rationale: Avec le génitif, διά exprime ici le moyen. « Par » est naturel en français et permet de reproduire exactement le contraste avec « par son propre sang ».
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: mais par son propre sang
  rationale: La répétition de « par » reflète celle de διά, tandis que « son propre sang » conserve l’insistance possessive de ἰδίου sans préciser davantage le mécanisme sacrificiel.
- source_word: εἰσῆλθεν
  choice: il est entré
  rationale: Le passé composé rend naturellement en français l’acte accompli exprimé par l’aoriste.
- source_word: ἐφάπαξ
  choice: une fois pour toutes
  rationale: Cette expression rend le caractère unique, décisif et non répétable de l’entrée.
- source_word: εἰς τὰ ἅγια
  choice: dans les lieux saints
  rationale: Le pluriel français suit la forme grecque et préserve l’imagerie cultuelle sans imposer la précision interprétative « lieu très saint ».
- source_word: αἰωνίαν λύτρωσιν
  choice: une rédemption éternelle
  rationale: Cette formulation courante et digne exprime une rédemption dont la valeur demeure pour toujours.
- source_word: εὑράμενος
  choice: ayant obtenu
  rationale: Dans ce contexte, εὑρίσκω signifie idiomatiquement obtenir ou acquérir. Le participe français conserve le lien circonstanciel du grec sans le réduire explicitement à une simple cause, un moyen ou un résultat.
theological_decisions:
- issue: Sens de l’entrée du Christ par son propre sang
  choice: Le texte affirme qu’il est entré par son propre sang, en contraste avec le sang animal, sans décrire plus précisément comment ce sang intervient dans son entrée.
  alternative: Comprendre qu’il est entré en transportant ou en présentant littéralement son sang, ou seulement après l’avoir versé.
  rationale: La répétition de διά avec le génitif favorise une expression de moyen rendue uniformément par « par ». La traduction maintient ainsi le contraste sacrificiel tout en évitant d’ajouter un mécanisme que le grec n’explicite pas.
- issue: Portée de τὰ ἅγια
  choice: les lieux saints
  alternative: le sanctuaire ; le lieu très saint
  rationale: Le grec emploie une forme plurielle pouvant désigner cultuellement le sanctuaire. « Les lieux saints » en conserve la forme et l’ambiguïté, tandis que « le lieu très saint » préciserait excessivement le référent.
- issue: Relation de εὑράμενος avec l’entrée
  choice: ayant obtenu une rédemption éternelle
  alternative: obtenant ainsi une rédemption éternelle ; après avoir obtenu une rédemption éternelle
  rationale: Le participe aoriste peut suggérer une relation accomplie, mais sa valeur logique exacte n’est pas explicitée. La construction participiale française évite de trancher nettement entre antériorité, moyen et résultat.
translation_notes:
  register: Français international moderne, digne et accessible. La construction clivée « Ce n’est pas… mais… qu’il est entré » maintient clairement le double complément introduit par διά. Le vocabulaire cultuel « sang », « lieux saints » et « rédemption » est conservé en raison de son importance contextuelle.
