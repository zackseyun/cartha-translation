id: HEB.9.1
reference: Hebrews 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶχε μὲν ⸀οὖν ἡ πρώτη δικαιώματα λατρείας τό τε ἅγιον κοσμικόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: fr
  text: Même la première alliance avait des prescriptions pour le culte et un sanctuaire terrestre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première » — c’est-à-dire la première alliance; certains comprennent l’expression plus généralement comme « la première disposition ».
    reason: alternative_reading
  - marker: b
    text: Ou « un sanctuaire appartenant à ce monde »; le sens est probablement ici « terrestre », par contraste avec les réalités célestes évoquées plus loin dans le chapitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: avait
  rationale: L’imparfait introduit la description de ce qui caractérisait la première réalité évoquée; « avait » conserve simplement la valeur possessive.
- source_word: μὲν οὖν
  choice: Même
  rationale: Dans ce contexte, la combinaison assure la transition tout en marquant une légère insistance ou concession. « Même » rend cette nuance naturellement, sans ajouter un « maintenant » temporel absent du grec.
- source_word: ἡ πρώτη
  choice: la première alliance
  rationale: Le nom est sous-entendu en grec. Le féminin « la première » renvoie très probablement à l’alliance mentionnée en Hébreux 8.13; « alliance » est donc explicité pour que le français soit intelligible.
- source_word: δικαιώματα
  choice: des prescriptions
  rationale: Dans ce cadre cultuel, le terme désigne des règles établies qui régissent le culte. « Prescriptions » est actuel, précis et digne.
- source_word: λατρείας
  choice: pour le culte
  rationale: Le génitif indique ici le domaine ou la finalité des prescriptions. « Pour le culte » exprime clairement le service religieux rendu à Dieu.
- source_word: τό τε ἅγιον
  choice: un sanctuaire
  rationale: L’expression désigne le lieu sacré, dont les différentes parties seront décrites dans les versets suivants. « Sanctuaire » évite de limiter prématurément le sens à une seule pièce.
- source_word: κοσμικόν
  choice: terrestre
  rationale: Le mot situe le sanctuaire dans l’ordre créé et terrestre, par contraste avec les réalités célestes développées ensuite. « Terrestre » évite la connotation morale négative que pourrait avoir « mondain ».
theological_decisions:
- issue: Référent implicite de ἡ πρώτη
  choice: la première alliance
  alternative: « la première » ou « la première disposition »
  rationale: Le contexte immédiat oppose la première alliance à la nouvelle. L’explicitation est nécessaire en français, mais une note conserve l’ellipse et l’interprétation plus générale possibles.
- issue: Sens de κοσμικόν
  choice: terrestre
  alternative: « appartenant à ce monde » ou « mondain »
  rationale: Le contraste porte vraisemblablement sur le sanctuaire terrestre face aux réalités célestes, non sur une opposition morale entre spiritualité et mondanité.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la concision du grec, explicite l’ellipse « alliance » pour l’intelligibilité et maintient en notes les principales ambiguïtés lexicales.
