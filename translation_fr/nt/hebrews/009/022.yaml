id: HEB.9.22
reference: Hebrews 9:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: fr
  text: D’après la Loi, presque tout est purifié avec du sang, et sans effusion de sang, il n’y a pas de pardon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rémission ». Le terme grec peut désigner une libération ou un pardon ; ici, il s’agit du pardon des péchés.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: presque
  rationale: 'L’adverbe limite explicitement la portée de l’affirmation : la purification prescrite par la Loi ne faisait pas absolument toujours intervenir du sang.'
- source_word: ἐν αἵματι
  choice: avec du sang
  rationale: La préposition a ici une valeur instrumentale. « Avec du sang » exprime naturellement en français le moyen rituel de purification.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel désigne globalement les réalités ou objets rituels concernés. Avec « presque », « presque tout » est la formulation française la plus naturelle.
- source_word: καθαρίζεται
  choice: est purifié
  rationale: Le présent passif décrit ce qui se fait habituellement selon la Loi. « Purifié » convient au contexte cultuel et reste clair en français moderne.
- source_word: κατὰ τὸν νόμον
  choice: D’après la Loi
  rationale: κατά exprime ici la conformité aux prescriptions de la Loi mosaïque. « D’après la Loi » est idiomatique et n’ajoute pas d’interprétation.
- source_word: χωρὶς
  choice: sans
  rationale: Rend directement le sens privatif du terme grec.
- source_word: αἱματεκχυσίας
  choice: effusion de sang
  rationale: Le nom désigne le fait de verser du sang et conserve ici sa résonance sacrificielle. « Effusion de sang » est une expression française établie et précise.
- source_word: οὐ γίνεται
  choice: il n’y a pas
  rationale: Avec le nom abstrait ἄφεσις, le verbe exprime que le pardon ne se produit pas ou n’advient pas. La tournure existentielle est naturelle en français.
- source_word: ἄφεσις
  choice: pardon
  rationale: Dans ce contexte sacrificiel, le mot renvoie au pardon des péchés. « Pardon » est clair et actuel, tandis que « rémission » est plus traditionnel et moins courant.
theological_decisions:
- issue: Sens de ἄφεσις dans le contexte sacrificiel
  choice: pardon
  alternative: rémission, libération
  rationale: Le contexte de l’argument sur les sacrifices indique le pardon des péchés, sans exiger l’importation d’un système doctrinal particulier. La note conserve l’éventail lexical du terme grec.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la restriction importante exprimée par « presque » et le caractère sentencieux de la seconde proposition.
