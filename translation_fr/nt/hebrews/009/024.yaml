id: HEB.9.24
reference: Hebrews 9:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: fr
  text: Car le Messie[a] n’est pas entré dans des lieux saints faits de main d’homme[b], copies[c] des réalités véritables, mais dans le ciel même, afin de paraître maintenant en présence de Dieu[d] en notre faveur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le grec Χριστός est ici compris comme un titre.
    reason: alternative_reading
  - marker: b
    text: Littéralement « faits de mains »; c’est-à-dire construits par des êtres humains.
    reason: lexical_alternative
  - marker: c
    text: Ou « représentations » ou « contreparties ». Le terme grec désigne ce qui correspond aux réalités célestes véritables.
    reason: lexical_alternative
  - marker: d
    text: Littéralement « devant la face de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: le Messie
  rationale: Le terme grec est rendu comme un titre dans ce contexte où la fonction messianique et sacerdotale est au premier plan. « Christ » reste une traduction possible.
- source_word: χειροποίητα
  choice: faits de main d’homme
  rationale: Cette expression conserve le contraste biblique entre une construction humaine et la réalité céleste, tout en restant claire en français moderne.
- source_word: ἅγια
  choice: des lieux saints
  rationale: Le pluriel neutre désigne ici les espaces sacrés du sanctuaire. Le pluriel grec est conservé sans préciser indûment une chambre particulière.
- source_word: ἀντίτυπα
  choice: copies
  rationale: Dans ce contexte, les lieux saints terrestres correspondent aux réalités célestes et les reproduisent. « Copies » exprime clairement ce rapport, sans exclure la nuance de représentations correspondantes.
- source_word: τῶν ἀληθινῶν
  choice: des réalités véritables
  rationale: La substantivation française rend le pluriel grec et indique qu’il s’agit des réalités ultimes, par contraste avec leur copie terrestre.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: le ciel même
  rationale: « Même » rend la valeur intensive de la construction et souligne l’entrée dans la réalité céleste elle-même.
- source_word: ἐμφανισθῆναι
  choice: afin de paraître
  rationale: L’infinitif exprime ici le but de l’entrée dans le ciel. « Paraître » reste proche du grec sans ajouter explicitement l’idée de se présenter.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: en présence de Dieu
  rationale: Cette tournure française idiomatique communique l’accès personnel et immédiat à Dieu; l’image littérale du visage est signalée en note.
- source_word: ὑπὲρ ἡμῶν
  choice: en notre faveur
  rationale: La formulation garde la portée représentative et médiatrice de ὑπέρ sans imposer une théorie plus précise que le texte.
theological_decisions:
- issue: Terminologie cultuelle de ἅγια
  choice: des lieux saints
  alternative: le sanctuaire; le lieu saint
  rationale: Le grec est au pluriel et peut désigner les espaces sacrés dans leur ensemble. Le conserver maintient l’imagerie du tabernacle sans restreindre prématurément le référent.
- issue: Titre christologique Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans l’argument sur l’accomplissement et l’entrée sacerdotale, le sens titulaire demeure perceptible. La note conserve l’autre rendu français traditionnel.
- issue: Portée médiatrice de ὑπὲρ ἡμῶν
  choice: en notre faveur
  alternative: pour nous
  rationale: Ce choix met en évidence l’action représentative en faveur des croyants sans préciser davantage le mécanisme théologique.
- issue: Relation entre le sanctuaire terrestre et les réalités célestes
  choice: copies des réalités véritables
  alternative: représentations des réalités véritables; réalités correspondantes
  rationale: Le texte affirme une correspondance entre le terrestre et le céleste. « Copies » rend le contraste sans traiter le terrestre comme faux ou dépourvu de fonction.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste serré entre les lieux saints terrestres et le ciel même. Le vocabulaire cultuel reste accessible sans effacer le pluriel grec ni surinterpréter la relation entre copie et réalité.
