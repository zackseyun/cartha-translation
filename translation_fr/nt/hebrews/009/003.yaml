lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: Derrière le second rideau
  rationale: Avec l’accusatif, μετά exprime ici une relation spatiale dans la description du sanctuaire. « Derrière » est naturel en français et καταπέτασμα désigne le rideau intérieur séparant les deux parties de la tente.
- source_word: δὲ
  choice: omis comme connecteur explicite
  rationale: δέ assure une transition légère dans la description. En français, l’enchaînement est suffisamment clair sans « et » ou « mais », qui risqueraient de surcharger ou d’accentuer le lien.
- source_word: σκηνὴ
  choice: la partie de la tente
  rationale: Dans ce contexte, σκηνή désigne la seconde section de la tente-sanctuaire. « Partie de la tente » garde l’image de la tente tout en évitant de faire croire qu’une tente distincte se trouvait derrière le rideau.
- source_word: ἡ λεγομένη
  choice: appelée
  rationale: Rend directement et naturellement le participe attributif grec.
- source_word: Ἅγια Ἁγίων
  choice: le lieu très saint
  rationale: Cette tournure restitue en français courant la valeur superlative de l’expression sémitique littéralement « Saint des saints » et identifie clairement l’espace intérieur du sanctuaire.
theological_decisions:
- issue: Traduction de l’expression cultuelle Ἅγια Ἁγίων
  choice: le lieu très saint
  alternative: le Saint des saints
  rationale: « Le lieu très saint » est immédiatement compréhensible en français moderne et préserve la référence à la partie la plus sacrée du sanctuaire. La formule traditionnelle et plus littérale est conservée en note.
translation_notes:
  register: Français international moderne, simple et digne. La formulation explicite que σκηνή désigne ici une partie de la tente-sanctuaire, sans remplacer l’image cultuelle par le terme plus interprétatif « pièce ».
