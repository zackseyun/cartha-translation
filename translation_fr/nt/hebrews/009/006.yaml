id: HEB.9.6
reference: Hebrews 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: fr
  text: Ces dispositions étant ainsi mises en place, les prêtres entrent continuellement dans la première partie du tabernacle[a] pour y accomplir les actes du culte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la première tente » ou « dans la première pièce ». Le grec σκηνή désigne le tabernacle; dans ce contexte, il peut désigner sa première section.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour accomplir les fonctions rituelles » ou « pour assurer le service du culte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Ces dispositions étant ainsi mises en place
  rationale: Le génitif absolu fournit le cadre de l’action. « Ces dispositions » renvoie naturellement aux éléments et à leur agencement décrits auparavant, tandis que « mises en place » évite de limiter κατεσκευασμένων à la seule construction matérielle.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: dans la première partie de la tente sacrée
  rationale: Dans ce contexte, πρώτη σκηνή désigne la première section du sanctuaire. La formulation rend cette valeur contextuelle tout en conservant l’image de la tente portée par σκηνή.
- source_word: διὰ παντὸς
  choice: continuellement
  rationale: L’expression indique une pratique habituelle et répétée, par contraste avec l’accès annuel mentionné au verset suivant, sans suggérer une présence physique ininterrompue.
- source_word: εἰσίασιν
  choice: entrent
  rationale: Le présent décrit l’usage habituel; le présent français le rend directement.
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Il s’agit des prêtres ordinaires, qui seront distingués du grand prêtre au verset suivant.
- source_word: τὰς λατρείας
  choice: les actes du culte
  rationale: Le pluriel désigne les différentes fonctions cultuelles accomplies dans le sanctuaire; cette expression est claire et évite le sens moderne ambigu de « services ».
- source_word: ἐπιτελοῦντες
  choice: pour accomplir
  rationale: La tournure française exprime naturellement l’activité exercée par les prêtres lors de leurs entrées, sans surcharger le participe grec.
theological_decisions:
- issue: Référent de σκηνή dans la description du sanctuaire
  choice: la première partie de la tente sacrée
  alternative: le premier tabernacle; la première tente; la première pièce
  rationale: Le contexte oppose les deux sections de la tente-sanctuaire. « Première partie » explicite le référent contextuel sans effacer le sens fondamental de σκηνή ni faire croire à deux tabernacles distincts.
- issue: Portée de διὰ παντός dans le ministère sacerdotal
  choice: continuellement
  alternative: en tout temps; régulièrement
  rationale: Le terme marque l’accès répété et habituel des prêtres à la première section, en contraste avec l’accès restreint du grand prêtre à la seconde; il ne signifie pas nécessairement « sans interruption ».
translation_notes:
  register: Français international moderne, clair et digne. « Tente sacrée » garde l’image concrète de σκηνή tout en signalant le cadre cultuel; « actes du culte » reste compréhensible sans évoquer principalement une célébration chrétienne moderne.
