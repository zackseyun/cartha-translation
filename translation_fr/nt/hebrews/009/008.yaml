id: HEB.9.8
reference: Hebrews 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: fr
  text: L’Esprit Saint indique ainsi que le chemin d’accès aux lieux saints[a] n’a pas encore été révélé tant que la première tente demeure en place[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sanctuaire ». L’expression grecque peut désigner globalement les lieux sacrés; certains la comprennent plus précisément comme « le chemin d’accès au lieu très saint ».
    reason: alternative_reading
  - marker: b
    text: Ou « tant que la première tente subsiste encore ». L’expression peut désigner son existence continue ou le maintien de son statut.
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: indique ainsi
  rationale: Le participe présent au génitif a ici une valeur explicative. « Indique ainsi » rend naturellement en français le lien avec l’organisation du sanctuaire décrite auparavant.
- source_word: πνεύματος τοῦ ἁγίου
  choice: l’Esprit Saint
  rationale: C’est la désignation française courante et directe du référent néotestamentaire.
- source_word: μήπω πεφανερῶσθαι
  choice: n’a pas encore été révélé
  rationale: Le parfait passif exprime l’état résultant d’une révélation qui n’a pas encore eu lieu; le passé composé passif en conserve la portée actuelle.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: le chemin d’accès aux lieux saints
  rationale: Dans ce contexte cultuel, ὁδός désigne le moyen d’entrer ou d’accéder au sanctuaire. « Lieux saints » conserve le pluriel grec sans limiter arbitrairement le référent au seul lieu très saint.
- source_word: πρώτης σκηνῆς
  choice: la première tente
  rationale: « Tente » rend directement σκηνή et correspond à la première partie de la tente-sanctuaire décrite dans le contexte immédiat.
- source_word: ἐχούσης στάσιν
  choice: demeure en place
  rationale: Cette formulation exprime la persistance ou le maintien de la première tente tout en laissant ouverte la nuance entre existence matérielle et statut cultuel.
- source_word: ἔτι
  choice: tant que … demeure
  rationale: Dans cette construction circonstancielle, « tant que » exprime naturellement la durée continue marquée par ἔτι.
theological_decisions:
- issue: Référent de τῶν ἁγίων
  choice: les lieux saints, c’est-à-dire l’espace du sanctuaire
  alternative: les saints
  rationale: Le contexte porte sur la disposition de la tente et sur l’accès sacerdotal; le sens est donc spatial et cultuel, non une référence aux croyants.
- issue: Étendue du sanctuaire visé
  choice: les lieux saints au sens large
  alternative: le lieu très saint en particulier
  rationale: Le contexte peut orienter vers la partie intérieure du sanctuaire, mais le pluriel grec n’impose pas cette précision. Le texte principal préserve donc cette latitude.
- issue: Portée de ἐχούσης στάσιν
  choice: maintien en place de la première tente
  alternative: existence matérielle de la tente seulement
  rationale: L’expression peut évoquer à la fois la présence de la tente et le maintien de son ordre cultuel. « Demeure en place » évite de trancher inutilement.
translation_notes:
  register: Français international moderne, clair et digne. « Première tente » garde l’image concrète du sanctuaire mobile, tandis que « demeure en place » conserve la possible nuance institutionnelle sans produire une tournure artificielle.
