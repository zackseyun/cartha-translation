  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: fr
  text: En effet, une première tente fut aménagée[a]. Elle contenait le porte-lampes, la table et la présentation des pains[b] ; elle est appelée « le Lieu saint »[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut préparée » ou « fut installée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la présentation des pains » ; autre traduction traditionnelle : « les pains de la Présence ».'
    reason: lexical_alternative
  - marker: c
    text: Le grec porte une forme plurielle, littéralement « les lieux saints », qui désigne ici la première partie de la tente.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ
  choice: tente
  rationale: Dans ce contexte cultuel, « tente » désigne la tente-sanctuaire et conserve l’image concrète de la σκηνή mosaïque. « Tabernacle » est possible, mais moins immédiatement accessible en français moderne.
- source_word: κατεσκευάσθη
  choice: fut aménagée
  rationale: Le verbe peut évoquer la préparation, l’installation ou l’équipement. « Fut aménagée » convient à la présentation d’un espace avec son mobilier sans réduire le sens à sa seule construction.
- source_word: ἡ πρώτη
  choice: une première tente
  rationale: Le grec dit littéralement « la première », mais le contexte et le verset suivant montrent qu’il s’agit de la première partie de la tente. La formulation conserve la désignation de l’auteur sans ajouter « pièce » au texte.
- source_word: λυχνία
  choice: porte-lampes
  rationale: Il s’agit du support destiné aux lampes à huile. « Porte-lampes » évite l’anachronisme de « chandelier », qui peut suggérer des bougies.
- source_word: τράπεζα
  choice: table
  rationale: Équivalent direct et naturel du meuble cultuel désigné.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: les pains présentés
  rationale: L’expression grecque évoque la disposition ou la présentation des pains. Cette formulation naturelle maintient l’idée de l’acte cultuel sans imposer dans le corps du texte l’expression interprétative « pains de la Présence ».
- source_word: ἥτις λέγεται Ἅγια
  choice: elle est appelée « le lieu saint »
  rationale: Le relatif renvoie à la première tente ou partie décrite. Bien que Ἅγια soit formellement pluriel, le contexte désigne le premier espace sacré, traditionnellement appelé « le lieu saint ».
theological_decisions:
- issue: Valeur spatiale de ἡ πρώτη
  choice: une première tente
  alternative: la première partie de la tente
  rationale: Le texte emploie σκηνή plutôt qu’un nom signifiant explicitement « pièce » ou « partie ». La traduction garde cette formulation tout en laissant le contexte préciser qu’il s’agit du premier compartiment.
- issue: Traduction de Ἅγια
  choice: le lieu saint
  alternative: les lieux saints / le sanctuaire
  rationale: Le pluriel grec peut être reproduit plus littéralement, mais ici il nomme le premier compartiment en contraste avec l’espace intérieur du verset suivant. Le singulier contextuel rend clairement cette distinction sans ajout doctrinal.
- issue: Désignation des pains
  choice: les pains présentés
  alternative: les pains de la Présence
  rationale: La construction grecque met en avant leur présentation ou disposition. L’alternative traditionnelle et intertextuelle est signalée en note afin de préserver les deux façons légitimes de comprendre l’expression.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase grecque est divisée en deux pour éviter une relative française ambiguë. Le vocabulaire cultuel reste concret, tandis que les formes plus traditionnelles ou plus littérales sont conservées en notes.
