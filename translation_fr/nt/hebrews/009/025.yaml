id: HEB.9.25
reference: Hebrews 9:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: fr
  text: Ce n’était pas non plus pour s’offrir lui-même à maintes reprises, comme le grand prêtre entre chaque année dans le sanctuaire[a] avec du sang qui n’est pas le sien,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les lieux saints » ; dans ce contexte cultuel, certains comprennent plus précisément « le lieu très saint ».
    reason: alternative lexicale et préservation de l’ambiguïté du pluriel grec
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Ce n’était pas non plus pour
  rationale: 'Cette formulation française naturelle poursuit la construction de la phrase précédente et conserve la négation du but : l’entrée du Christ n’avait pas pour but une offrande répétée de lui-même.'
- source_word: πολλάκις
  choice: à maintes reprises
  rationale: Cette expression rend clairement l’idée de répétition et prépare le contraste avec l’entrée annuelle du grand prêtre.
- source_word: προσφέρῃ ἑαυτόν
  choice: s’offrir lui-même
  rationale: Le verbe garde son sens sacrificiel, tandis que « lui-même » préserve la valeur réfléchie et souligne le contraste avec le sang appartenant à un autre.
- source_word: ὥσπερ
  choice: comme
  rationale: « Comme » introduit simplement et naturellement la comparaison explicite du grec.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: C’est l’appellation française courante et précise de cette fonction cultuelle juive.
- source_word: εἰσέρχεται
  choice: entre
  rationale: Le présent est conservé pour exprimer l’action coutumière du grand prêtre.
- source_word: εἰς τὰ ἅγια
  choice: dans le sanctuaire
  rationale: Dans l’usage cultuel de l’épître, le pluriel grec désigne le lieu saint ou sanctuaire. Cette formulation est naturelle en français, tandis que la note conserve la forme littérale et l’interprétation plus précise possible.
- source_word: κατ’ ἐνιαυτὸν
  choice: chaque année
  rationale: Cette tournure idiomatique exprime clairement la périodicité annuelle et répétée.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: avec du sang qui n’est pas le sien
  rationale: « Avec » rend ici le moyen employé, et la proposition relative exprime naturellement que ce sang appartient à un autre, en contraste avec l’offrande que le Christ fait de lui-même.
theological_decisions:
- issue: Portée de la comparaison entre le Christ et le grand prêtre lévitique
  choice: Le verset oppose l’offrande non répétée du Christ à l’entrée annuelle répétée du grand prêtre avec le sang d’un autre.
  alternative: On peut comprendre « le sanctuaire » plus précisément comme le lieu très saint.
  rationale: Le contexte immédiat met en contraste l’offrande du Christ avec le ministère cultuel annuel du grand prêtre. La traduction maintient ce contraste sans développer une formulation doctrinale absente du verset.
- issue: Référent de τὰ ἅγια
  choice: le sanctuaire
  alternative: les lieux saints ; le lieu très saint
  rationale: Le pluriel grec peut servir de désignation cultuelle du sanctuaire. Dans le cadre de l’entrée annuelle du grand prêtre, il peut viser plus particulièrement le lieu très saint, mais le texte principal ne tranche pas explicitement en faveur de cette précision.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent, comme dans le grec, d’où la virgule finale. « À maintes reprises » et « chaque année » rendent nettement le contraste entre répétition possible et pratique annuelle.
