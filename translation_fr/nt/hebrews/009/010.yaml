id: HEB.9.10
reference: Hebrews 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: fr
  text: 'Ils ne concernent que des aliments, des boissons et diverses ablutions : ce sont des prescriptions relatives à la chair, imposées jusqu’au temps de la remise en ordre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: des aliments, des boissons
  rationale: Rend directement les datifs grecs après ἐπί dans un français naturel.
- source_word: διαφόροις βαπτισμοῖς
  choice: diverses ablutions
  rationale: Dans ce contexte rituel, βαπτισμοῖς désigne différents lavages ou purifications, non le baptême chrétien; «ablutions» conserve cette portée cultuelle.
- source_word: δικαιώματα σαρκὸς
  choice: prescriptions relatives à la chair
  rationale: Évite «charnelles», qui pourrait suggérer à tort une conduite pécheresse, et conserve le sens de règles portant sur la sphère corporelle ou extérieure.
- source_word: καιροῦ διορθώσεως
  choice: temps de la remise en ordre
  rationale: διορθώσεως évoque l'action de rectifier ou de mettre les choses en ordre; cette formulation évite les connotations institutionnelles modernes de «réforme».
- source_word: ἐπικείμενα
  choice: imposées
  rationale: Exprime l'idée d'obligations en vigueur et pesant sur les personnes jusqu'au temps fixé.
theological_decisions:
- issue: Portée de «chair» dans δικαιώματα σαρκὸς
  choice: prescriptions relatives à la chair
  alternative: prescriptions charnelles
  rationale: Le génitif renvoie ici vraisemblablement au domaine corporel et rituel. La traduction choisie ne transforme pas ces prescriptions en règles moralement mauvaises.
- issue: Sens eschatologique ou historique de διορθώσεως
  choice: remise en ordre
  alternative: réforme
  rationale: La formulation garde ouverte l'identification précise du temps visé tout en exprimant le remplacement ou la rectification de l'ordre cultuel antérieur.
- issue: Relation syntaxique de δικαιώματα σαρκὸς avec la liste précédente
  choice: apposition explicative introduite par «ce sont»
  alternative: 'simple juxtaposition: «prescriptions relatives à la chair»'
  rationale: Le grec est compact et appositionnel. L'explicitation française rend la relation intelligible sans décider que les prescriptions constituent une catégorie entièrement séparée.
translation_notes:
  register: Français moderne, digne et accessible. «Ablutions» est légèrement soutenu mais précis dans un contexte cultuel. La phrase reste liée au contexte précédent par le pronom «Ils», comme l’est le fragment grec.
