  naturalness: Le français est moderne, clair et de registre biblique approprié. La formulation en deux phrases est naturelle. La reprise pronominale doit être féminine pour être cohérente avec la section du sanctuaire décrite dans le contexte immédiat.
  terminology: « Autel d’or pour l’encens », « arche de l’alliance », « manne » et « tablettes de l’alliance » sont des choix justes. La note conserve convenablement l’ambiguïté réelle de θυμιατήριον entre l’autel à encens et le brûle-parfum.
