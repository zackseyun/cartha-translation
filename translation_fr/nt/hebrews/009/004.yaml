source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: fr
  text: Elle contenait l’autel d’or pour l’encens[a] et l’arche de l’alliance, entièrement recouverte d’or. Dans celle-ci se trouvaient une jarre d’or contenant la manne, le bâton d’Aaron qui avait bourgeonné et les tablettes de l’alliance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le brûle-parfum d’or ». Le terme grec peut désigner un autel à encens ou un récipient dans lequel on brûle l’encens.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: Il contenait l’autel d’or pour l’encens
  rationale: θυμιατήριον peut désigner un objet servant à brûler l’encens, notamment un autel ou un brûle-parfum. Dans cette description du sanctuaire, « l’autel d’or pour l’encens » est un référent naturel. Le participe ἔχουσα reprend le lieu mentionné dans le contexte précédent; une phrase autonome avec « Il contenait » est naturelle en français.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: l’arche de l’alliance
  rationale: Expression française consacrée et exacte pour le coffre sacré; « alliance » convient ici mieux que « testament ».
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: entièrement recouverte d’or
  rationale: Cette formulation exprime clairement la couverture sur tous les côtés indiquée par πάντοθεν et l’état résultant porté par le participe parfait passif.
- source_word: ἐν ᾗ
  choice: Dans celle-ci se trouvaient
  rationale: Le pronom relatif féminin singulier renvoie à l’arche. « Celle-ci » évite toute ambiguïté en français et le pluriel convient à l’énumération qui suit.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: une jarre d’or contenant la manne
  rationale: στάμνος désigne un récipient tel qu’une jarre; « contenant » rend naturellement ἔχουσα, sans ajouter de précision absente du grec.
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: le bâton d’Aaron qui avait bourgeonné
  rationale: « Bâton » est courant et adapté à ῥάβδος. Le plus-que-parfait situe naturellement en français l’événement antérieur exprimé par le participe aoriste.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: les tablettes de l’alliance
  rationale: Traduction directe, sans ajouter « de pierre », détail connu du contexte biblique mais non exprimé dans ce verset.
theological_decisions:
- issue: Sens de θυμιατήριον dans la description du sanctuaire
  choice: l’autel d’or pour l’encens
  alternative: le brûle-parfum d’or
  rationale: Le terme grec possède une réelle ambiguïté lexicale et peut désigner soit un autel lié à l’encens, soit un récipient servant à le brûler. Le texte principal retient le référent cultuel le plus naturel dans une liste du mobilier du sanctuaire, tandis que la note conserve explicitement l’autre possibilité sans trancher silencieusement le débat.
- issue: Rapport entre l’arche et les objets énumérés après ἐν ᾗ
  choice: Dans celle-ci se trouvaient
  alternative: auprès de celle-ci se trouvaient
  rationale: Le sens ordinaire de ἐν ᾗ est « dans laquelle ». Malgré les questions soulevées par les récits de l’Ancien Testament sur l’emplacement de certains objets, la traduction conserve l’affirmation propre à ce verset au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, clair et digne. Les termes bibliques établis « arche de l’alliance » et « manne » sont conservés. La ponctuation répartit la longue proposition grecque en deux phrases pour assurer une lecture naturelle sans modifier ses rapports syntaxiques.
