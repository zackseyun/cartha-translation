source:
  edition: SBLGNT
  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: fr
  text: Mais dans la seconde partie[a], seul le grand prêtre entre une fois par an, et non sans sang, qu’il offre pour lui-même et pour les fautes du peuple commises par ignorance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la seconde tente », « la seconde pièce » ou « la seconde section » ; il s’agit de la partie intérieure du tabernacle.
    reason: lexical_alternative
  - marker: b
    text: Ou « les péchés involontaires du peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Mais dans la seconde partie
  rationale: Le grec est elliptique et renvoie à la seconde partie de la tente décrite en Hébreux 9.2-3. « Partie » reste naturel tout en évitant de préciser excessivement s’il s’agit d’une pièce, d’une section ou de la seconde tente.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: une fois par an
  rationale: Équivalent idiomatique français qui exprime exactement la fréquence annuelle.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: seul le grand prêtre
  rationale: Cette formulation française exprime clairement que l’accès est réservé au grand prêtre.
- source_word: οὐ χωρὶς αἵματος
  choice: jamais sans apporter du sang
  rationale: « Jamais sans » rend naturellement la litote grecque. L’ajout d’« apporter » explicite le mouvement d’entrée déjà contenu dans la construction, sans transformer le sang en une offrande distincte.
- source_word: ὃ προσφέρει
  choice: qu’il offre
  rationale: « Offrir » porte ici le sens sacrificiel normal de προσφέρει et conserve le lien direct avec le sang.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: pour lui-même
  rationale: Rendu français naturel de ὑπέρ dans ce contexte sacrificiel, sans surinterpréter la relation représentative.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: les péchés commis par le peuple sans le savoir
  rationale: Cette formulation rend la faute morale exprimée par ἀγνοήματα ainsi que son caractère non délibéré ou commis dans l’ignorance.
theological_decisions:
- issue: Nature de ἀγνοήματα dans le contexte sacrificiel
  choice: les péchés commis par le peuple sans le savoir
  alternative: les péchés involontaires du peuple ; les fautes commises dans l’ignorance par le peuple
  rationale: Le terme désigne des fautes caractérisées par l’ignorance ou l’absence d’intention, et non un simple manque d’information. Le texte garde ainsi sa portée morale et sacrificielle sans imposer une distinction doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle. « Grand prêtre » est préféré à « souverain sacrificateur », plus ancien et moins courant.
