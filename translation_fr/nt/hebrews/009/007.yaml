  source_fidelity: La structure spatiale, la restriction au grand prêtre, la fréquence annuelle et la double portée sacrificielle sont bien rendues. Toutefois, « jamais sans apporter du sang » renforce inutilement la litote grecque (οὐ χωρὶς αἵματος) par « jamais » et ajoute « apporter », alors que le verbe suivant exprime déjà explicitement l’offrande.
