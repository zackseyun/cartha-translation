  rationale: La révision conserve l’ellipse spatiale du grec et ses ambiguïtés lexicales, tout en rétablissant la litote « non sans sang » sans ajout de mouvement ni d’intensification. Elle rend ἀγνοημάτων par « fautes ... commises par ignorance », formulation naturelle qui préserve le sens moral et sacrificiel du terme.
