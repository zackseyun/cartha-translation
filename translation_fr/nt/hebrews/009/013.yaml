    issue: Coordination par « ainsi que » suivie d’un pluriel
    rationale: Le grec coordonne explicitement le sang et la cendre par καὶ… καὶ. En français, « ainsi que » peut suggérer un ajout secondaire et rend l’accord pluriel de « sanctifient » stylistiquement moins immédiat. « Et » reproduit mieux la structure source.
  - severity: low
    issue: « En vue de la pureté » est légèrement moins direct
    rationale: πρός avec καθαρότης indique ici le résultat ou la finalité cultuelle. « Pour la pureté de la chair » conserve le nom « pureté » tout en étant plus idiomatique et direct.
