  verdict: revise
  source_fidelity: 'Le sens cultuel est bien rendu : le sang des boucs et des taureaux, la cendre de la génisse, les personnes rituellement souillées, la sanctification et la pureté de la chair correspondent au grec. La tournure « dont on asperge » exprime naturellement en français l’usage rituel de la cendre, sans attribuer de manière artificielle une action personnelle à la cendre.'
  naturalness: Le français est globalement clair et moderne. Toutefois, « ainsi que » atténue la coordination grecque καὶ… καὶ et rend l’accord pluriel de « sanctifient » moins net. Une coordination simple par « et » est à la fois plus fidèle et plus fluide. « Pour la pureté de la chair » rend plus directement πρὸς τὴν… καθαρότητα que « en vue de ».
  terminology: « Boucs », « taureaux », « génisse », « souillés », « sanctifient » et « chair » conviennent au registre sacrificiel et maintiennent les distinctions lexicales importantes. Les notes sont utiles et ne surinterprètent pas le verset.
  issues:
