source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: fr
  text: Car si le sang des boucs et des taureaux et la cendre d’une génisse, dont on asperge ceux qui ont été souillés[a], les sanctifient pour la pureté de la chair[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont devenus impurs » ; il s’agit ici d’une souillure rituelle.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire une pureté extérieure et corporelle selon les rites de l’ancienne alliance, par contraste avec la purification de la conscience au verset 14.
    reason: cultural_note
  - marker: c
    text: Allusion au rite de purification utilisant la cendre d’une génisse, décrit en Nombres 19.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Car si
  rationale: Conserve à la fois le lien argumentatif avec ce qui précède et la construction conditionnelle qui se poursuit au verset 14.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: le sang des boucs et des taureaux
  rationale: Rend directement le langage sacrificiel; «boucs» exprime naturellement en français le sexe indiqué par τράγων.
- source_word: σποδὸς δαμάλεως
  choice: la cendre d’une génisse
  rationale: «Génisse» est le terme précis pour la jeune femelle bovine et maintient l’allusion au rite de Nombres 19.
- source_word: ῥαντίζουσα τοὺς κεκοινωμένους
  choice: dont on asperge ceux qui ont été souillés
  rationale: Formulation française naturelle qui rattache sans ambiguïté l’aspersion à la cendre, tout en conservant l’action rituelle et l’état résultant exprimé par le participe parfait.
- source_word: ἁγιάζει
  choice: les sanctifient
  rationale: Maintient le vocabulaire cultuel et théologique. Le pluriel est requis en français par les deux réalités coordonnées, le sang et la cendre; le pronom «les» explicite l’objet déjà exprimé dans la relative.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: en vue de la pureté de la chair
  rationale: Conserve la valeur orientée de πρός, le nom abstrait καθαρότης et le terme «chair», sans réduire silencieusement l’expression à une simple propreté physique.
theological_decisions:
- issue: Portée de «sanctifient» dans les rites de l’ancienne alliance
  choice: Conserver «sanctifient», avec une portée cultuelle précisée par le contexte et la note
  alternative: «purifient rituellement»
  rationale: Le grec emploie ἁγιάζει, tandis que la fin du verset limite explicitement son effet à la pureté de la chair. Remplacer le verbe par «purifient» effacerait une distinction lexicale importante.
- issue: Sens de σάρξ
  choice: «chair», au sens corporel et extérieur dans ce contexte rituel
  alternative: «corps» ou «nature pécheresse»
  rationale: Le contraste avec la conscience au verset 14 exige ici le domaine extérieur et rituel, non le sens paulinien possible de nature pécheresse. Garder «chair» préserve néanmoins la formulation et le contraste du texte.
- issue: Agent grammatical de l’aspersion
  choice: «la cendre d’une génisse dont on asperge…»
  alternative: «la cendre d’une génisse qui asperge…» ou «répandue par aspersion sur…»
  rationale: Le participe grec est grammaticalement actif et se rapporte à «cendre», mais le français attribuerait difficilement à la cendre elle-même l’action consciente d’asperger. La tournure avec «dont on asperge» restitue l’acte rituel sans faire de la génisse l’agent.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule parce que la proposition conditionnelle commencée ici reçoit sa principale au verset 14. «En vue de» conserve une légère solennité adaptée au raisonnement cultuel sans devenir archaïque.
