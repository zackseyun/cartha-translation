revisions:
- from: Car si le sang des boucs et des taureaux, ainsi que la cendre d’une génisse dont on asperge ceux qui ont été souillés[a], les sanctifient en vue de la pureté de la chair[b][c],
  to: Car si le sang des boucs et des taureaux et la cendre d’une génisse, dont on asperge ceux qui ont été souillés[a], les sanctifient pour la pureté de la chair[b][c],
  rationale: La révision remplace « ainsi que » par « et » afin de reproduire la coordination des deux éléments rituels dans le grec et de rendre le pluriel de « sanctifient » pleinement naturel. Elle remplace également « en vue de » par « pour », qui exprime plus directement la relation indiquée par πρός sans modifier le sens. La phrase demeure ouverte, conformément à la condition dont l’apodose se trouve au verset 14.
