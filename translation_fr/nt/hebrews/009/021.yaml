id: HEB.9.21
reference: Hebrews 9:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: fr
  text: De même, il aspergea de sang tant le tabernacle[a] que tous les objets du service sacré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tente ». Le terme grec désigne ici le tabernacle, la tente-sanctuaire mosaïque.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les ustensiles du service » ou « tous les objets du culte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: sanctuaire mobile
  rationale: Dans ce contexte, le mot désigne la tente-sanctuaire mosaïque. « Sanctuaire mobile » en exprime clairement la fonction et la nature pour un lectorat moderne; « tente » reste possible plus littéralement.
- source_word: σκεύη
  choice: objets
  rationale: Le terme désigne collectivement les récipients, ustensiles et autres équipements employés dans le culte. « Objets » évite de limiter le sens aux seuls vases.
- source_word: λειτουργία
  choice: service sacré
  rationale: Ici, le terme renvoie au service cultuel accompli dans le sanctuaire. « Service sacré » est clair, naturel et conserve la valeur religieuse spécialisée.
- source_word: αἷμα
  choice: sang
  rationale: Il s’agit littéralement du sang sacrificiel dans le contexte rituel.
- source_word: ὁμοίως
  choice: De même
  rationale: Cette expression rattache l’action à l’aspersion précédemment décrite au verset 19.
- source_word: ἐράντισεν
  choice: il aspergea
  rationale: « Asperger » est le verbe français courant et précis pour l’application rituelle d’un liquide par projection.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule est faiblement connective ici; la coordination de la phrase et « De même » rendent naturellement son rôle discursif sans alourdir le français.
- source_word: πάντα τὰ σκεύη
  choice: tous les objets
  rationale: Cette formulation conserve la portée exhaustive de πάντα avec le pluriel.
theological_decisions:
- issue: Rapport avec le rituel mosaïque rapporté dans l’Exode
  choice: Présenter sans développement explicatif l’affirmation récapitulative selon laquelle Moïse aspergea de sang le sanctuaire mobile et tout son matériel cultuel.
  alternative: Ajouter une harmonisation ou une explication historique des différences apparentes avec les récits de l’Exode.
  rationale: Le grec formule une affirmation concise. La traduction doit préserver cette formulation et ne pas résoudre dans le texte principal les questions intertextuelles qu’elle peut soulever.
translation_notes:
  register: Français international moderne, digne et accessible. « Sanctuaire mobile » explicite le référent cultuel sans recourir dans le texte principal au terme plus traditionnel et moins immédiatement transparent « tabernacle ». La structure « ainsi que » rend la coordination appuyée de καί…καί.
