id: HEB.9.9
reference: Hebrews 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: fr
  text: 'Cette disposition est une parabole pour le temps présent[a] : en vertu de laquelle sont offerts des dons et des sacrifices qui ne peuvent rendre parfait, quant à la conscience, celui qui rend un culte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un symbole » ou « une figure » pour le temps présent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: C’est
  rationale: Le pronom reprend la disposition du sanctuaire évoquée auparavant et introduit son explication; cette tournure française rend le lien sans alourdir la phrase.
- source_word: παραβολὴ
  choice: une parabole
  rationale: « Parabole » conserve la portée figurative et la correspondance typologique du terme grec; les équivalents contextuels sont signalés en note.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: pour le temps présent
  rationale: Rend naturellement la période alors en cours dans l’argument, sans préciser indûment s’il s’agit seulement du moment immédiat ou de l’âge présent.
- source_word: καθ’ ἣν
  choice: conformément à celle-ci
  rationale: Exprime le rapport entre la disposition figurative et les offrandes cultuelles décrites, tout en laissant l’antécédent féminin « parabole » explicite.
- source_word: δῶρά τε καὶ θυσίαι
  choice: des dons et des sacrifices
  rationale: Préserve les deux catégories cultuelles coordonnées; le français n’exige pas de rendre τε καὶ par « à la fois… et ».
- source_word: προσφέρονται
  choice: on offre
  rationale: Le présent rend l’activité cultuelle en cours; la construction impersonnelle française restitue naturellement le passif grec.
- source_word: μὴ δυνάμεναι
  choice: qui ne peuvent
  rationale: Exprime directement l’incapacité des dons et des sacrifices, avec une syntaxe naturelle en français.
- source_word: κατὰ συνείδησιν
  choice: quant à la conscience
  rationale: Délimite le domaine dans lequel la perfection n’est pas atteinte, sans réduire la conscience à la seule sincérité subjective.
- source_word: τελειῶσαι
  choice: rendre parfait
  rationale: Conserve le vocabulaire théologiquement chargé de la perfection et de l’accomplissement dans l’épître aux Hébreux.
- source_word: τὸν λατρεύοντα
  choice: celui qui rend un culte
  rationale: Restitue le participe singulier et sa nuance de service cultuel plus précisément que le simple verbe « adorer ».
theological_decisions:
- issue: Sens de παραβολή dans un contexte cultuel et typologique
  choice: parabole
  alternative: symbole; figure
  rationale: « Parabole » maintient la forme lexicale et la tension typologique du grec sans réduire la disposition terrestre à un symbole abstrait; les autres rendus plausibles sont conservés en note.
- issue: Portée de la perfection mentionnée
  choice: rendre parfait, quant à la conscience
  alternative: purifier la conscience; donner une conscience parfaite
  rationale: Le grec affirme une incapacité à mener l’adorateur à la perfection dans le domaine de la conscience, sans employer ici le verbe « purifier » ni définir davantage la nature de cette perfection.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le vocabulaire distinctif d’Hébreux (« rendre parfait ») tout en évitant une syntaxe excessivement calquée sur le grec.
