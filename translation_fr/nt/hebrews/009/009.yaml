    rationale: La tournure peut fonctionner, mais « Cette disposition est » identifie plus clairement l’antécédent contextuel du relatif grec et facilite la lecture autonome du verset.
  revised_text: 'Cette disposition est une parabole pour le temps présent[a] : en vertu de laquelle sont offerts des dons et des sacrifices qui ne peuvent rendre parfait, quant à la conscience, celui qui rend un culte.'
