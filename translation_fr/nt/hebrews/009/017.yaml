reference: Hebrews 9:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: fr
  text: En effet, une alliance[a] est valable en cas de morts[b], puisqu’elle n’a jamais force tant que celui qui l’a établie est vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En effet, un testament n’est valable qu’après un décès, puisqu’il n’a jamais force tant que celui qui l’a fait est vivant. » Le terme grec peut désigner soit une alliance, soit un testament.'
    reason: alternative_reading
  - marker: b
    text: L’expression grecque traduite par « en cas de morts » est très condensée. Elle peut renvoyer soit à des personnes décédées, dans le cadre d’un testament, soit à des victimes mortes lors de la ratification d’une alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: alliance
  rationale: « Alliance » correspond au cadre dominant d’Hébreux 8–10, marqué par la première et la nouvelle alliance ainsi que par leur inauguration sanglante. Le sens possible de « testament » est conservé en note.
- source_word: ἐπὶ νεκροῖς
  choice: quand il y a des morts
  rationale: Cette formulation française garde le pluriel et le caractère elliptique du grec sans trancher entre des personnes décédées et les morts liées à la ratification sacrificielle d’une alliance.
- source_word: βεβαία
  choice: est ferme
  rationale: « Ferme » exprime qu’une alliance est établie et possède une force effective, tout en évitant de répéter « en vigueur » dans la proposition suivante.
- source_word: ἐπεὶ
  choice: puisque
  rationale: « Puisque » introduit naturellement en français la justification donnée par la seconde proposition.
- source_word: μήποτε
  choice: jamais
  rationale: Dans ce contexte, le terme exprime l’absence totale de mise en vigueur pendant que l’auteur de l’acte vit.
- source_word: ἰσχύει
  choice: n’entre … en vigueur
  rationale: Cette expression idiomatique rend la force opérante ou juridique du verbe dans le contexte.
- source_word: ὅτε ζῇ
  choice: tant que … est vivant
  rationale: La tournure marque clairement toute la durée de la vie, en contraste avec la mort évoquée auparavant.
- source_word: ὁ διαθέμενος
  choice: celui qui l’a établie
  rationale: Cette désignation reste compatible aussi bien avec celui qui établit une alliance qu’avec celui qui fait un testament; elle évite de choisir d’avance entre les deux lectures.
theological_decisions:
- issue: 'Sens de διαθήκη en Hébreux 9.17 : alliance ou testament'
  choice: Le texte principal porte « alliance ».
  alternative: On peut comprendre et traduire « testament ».
  rationale: Le contexte large d’Hébreux 8–10 est celui des alliances et du sang qui les inaugure. Toutefois, le vocabulaire des versets 16–17 permet une lecture testamentaire; la note la conserve explicitement afin de ne pas effacer cette tension réelle.
- issue: Portée de l’expression ἐπὶ νεκροῖς
  choice: La formulation ouverte « quand il y a des morts » est maintenue.
  alternative: L’expression peut viser soit le décès associé à un testament, soit les victimes mortes lors de la ratification d’une alliance.
  rationale: Le grec est bref, elliptique et discuté. Une explicitation dans un seul sens imposerait une interprétation que la formulation source ne tranche pas clairement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste volontairement concise. « Est ferme » et « entre en vigueur » conservent la nuance institutionnelle ou juridique, tandis que les notes rendent explicites les deux principales lectures sans en imposer une.
