  source_fidelity: Le choix d’« alliance » pour διαθήκη respecte le cadre immédiat, et la note conserve à juste titre la lecture « testament ». La phrase ἐπὶ νεκροῖς reste délibérément elliptique et doit éviter de désigner explicitement un groupe de personnes ou un événement unique. « En cas de morts » est plus proche de cette ouverture que « quand il y a des morts ».
  naturalness: « Quand il y a des morts » est peu idiomatique dans ce contexte juridique et donne à la phrase une tonalité circonstancielle maladroite. « Est valable en cas de morts » est concis, naturel dans un registre soutenu moderne, et conserve l’opacité voulue. « N’a jamais force » rend bien ἰσχύει sans répéter « valable ».
  terminology: « Alliance », « testament », « valable » et « entrer en vigueur » sont appropriés. La note b doit parler de « décès » et de « victimes mortes », plutôt que de « morts liées », formulation imprécise et peu naturelle.
