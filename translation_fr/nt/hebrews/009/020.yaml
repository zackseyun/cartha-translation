  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· Τοῦτο τὸ αἷμα τῆς διαθήκης ἧς ἐνετείλατο πρὸς ὑμᾶς ὁ θεός·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/020.yaml
  text: saying[a], “This is the blood of the covenant that God commanded for you.”
translation:
  language: fr
  text: 'en disant : « Voici le sang de l’alliance que Dieu vous a prescrite.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que Dieu a prescrite pour vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit la citation et maintient explicitement son lien syntaxique avec l’action du verset précédent.
- source_word: Τοῦτο
  choice: Voici
  rationale: Dans cette déclaration accompagnant un geste rituel, « Voici » rend naturellement la présentation déictique exprimée par Τοῦτο, sans alourdir la phrase par une copule.
- source_word: αἷμα
  choice: sang
  rationale: Équivalent direct qui conserve l’image concrète du sang sacrificiel employé pour ratifier l’alliance.
- source_word: διαθήκης
  choice: alliance
  rationale: L’allusion à Exode 24 concerne l’alliance mosaïque; « testament » introduirait ici un sens juridique inadéquat.
- source_word: ἧς
  choice: que
  rationale: Le pronom relatif au génitif renvoie à « alliance ». Le français peut naturellement construire « l’alliance que Dieu vous a prescrite », tout en plaçant les destinataires dans le complément indirect.
- source_word: ἐνετείλατο
  choice: a prescrite
  rationale: Le verbe désigne le fait de commander ou de donner des instructions. « Prescrire une alliance à quelqu’un » est ici plus naturel que « commander une alliance » et conserve l’idée d’une disposition imposée par Dieu.
- source_word: πρὸς ὑμᾶς
  choice: vous
  rationale: 'Le pronom est rendu comme complément indirect de « prescrire » : l’alliance a été prescrite aux destinataires. Une note signale l’autre nuance contextuelle possible, « pour vous ».'
- source_word: ὁ θεός
  choice: Dieu
  rationale: Rendu français usuel de θεός dans ce contexte, sans ajout de titre.
theological_decisions:
- issue: Sens de διαθήκη dans la scène de ratification par le sang
  choice: alliance
  alternative: testament
  rationale: Le verset reprend Exode 24.8 et évoque la conclusion de l’alliance mosaïque. « Alliance » respecte ce contexte immédiat et évite d’importer le sens de dernières volontés.
- issue: Forme de la déclaration introduite par Τοῦτο
  choice: Voici le sang de l’alliance
  alternative: Ceci est le sang de l’alliance
  rationale: La copule est implicite en grec. « Voici » constitue en français une présentation idiomatique qui conserve la force déictique de Τοῦτο sans modifier le contenu théologique.
- issue: Rapport de πρὸς ὑμᾶς à l’alliance commandée
  choice: que Dieu vous a prescrite
  alternative: que Dieu a prescrite pour vous
  rationale: Le grec peut indiquer que l’ordre est adressé au peuple ou formulé à son égard. Le texte principal retient la construction française la plus directe, tandis que la note préserve la nuance alternative.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « En disant » conserve le lien participial avec le verset précédent; « Voici » convient à la proclamation rituelle. La ponctuation française et les guillemets français sont employés.
