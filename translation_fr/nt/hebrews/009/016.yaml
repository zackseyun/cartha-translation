  text: ὅπου γὰρ διαθήκη, θάνατον ἀνάγκη φέρεσθαι τοῦ διαθεμένου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: fr
  text: Car là où il y a une alliance[a], il faut que la mort de celui qui l’a établie soit intervenue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car là où il y a un testament, il faut que la mort du testateur soit établie. » Le mot grec traduit par « alliance » peut aussi signifier « testament » ; beaucoup comprennent les versets 16–17 dans ce sens juridique.'
    reason: Lecture alternative fondée sur la polysémie de διαθήκη et sur l’interprétation juridique fréquente de ces versets.
lexical_decisions:
- source_word: διαθήκη
  choice: alliance
  rationale: « Alliance » correspond au fil conducteur d’Hébreux 8–10 et à l’arrière-plan de Jérémie 31. Le sens juridique possible de « testament » est conservé en note afin de ne pas supprimer l’ambiguïté réelle du grec.
- source_word: θάνατον
  choice: la mort
  rationale: Équivalent français direct de θάνατος; il s’agit ici de la mort effective dont la nécessité est affirmée.
- source_word: ἀνάγκη
  choice: il est nécessaire
  rationale: Cette tournure française naturelle exprime fidèlement la nécessité portée par le nom prédicatif grec.
- source_word: φέρεσθαι
  choice: que soit produite
  rationale: Le passif de φέρω signifie littéralement « être porté, apporté ou produit ». « Soit produite » conserve ici l’idée que la mort doit être présentée comme un fait pertinent, sans ajouter explicitement la notion d’une preuve établie.
- source_word: τοῦ διαθεμένου
  choice: de celui qui l’a établie
  rationale: Le participe désigne celui qui a disposé ou établi la διαθήκη. Cette formulation reste naturelle en français et convient au sens principal « alliance » sans imposer dans le texte le terme juridique « testateur ».
- source_word: ὅπου γὰρ
  choice: Car là où
  rationale: « Car » garde la valeur explicative de γάρ, et « là où » rend directement ὅπου.
theological_decisions:
- issue: Faut-il comprendre διαθήκη comme « alliance » ou comme « testament » en Hébreux 9.16 ?
  choice: « alliance » dans le texte principal, avec « testament » en note
  alternative: « testament » dans le texte principal, avec « testateur » pour τοῦ διαθεμένου
  rationale: Le contexte global d’Hébreux 8–10 est dominé par l’alliance, sa médiation et son inauguration sacrificielle. Toutefois, les versets 16–17 permettent une lecture juridique fondée sur le testament; la note préserve donc cette tension interprétative sans la trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La construction reste volontairement proche de l’argument grec. « Que soit produite la mort » est légèrement formel, mais rend l’expression inhabituelle φέρεσθαι sans expliquer excessivement le texte.
