id: HEB.9.19
reference: Hebrews 9:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: fr
  text: En effet, après que Moïse eut énoncé à tout le peuple chacun des commandements conformément à la Loi, il prit le sang des veaux[a], avec de l’eau, de la laine écarlate et de l’hysope, et en aspergea le rouleau lui-même ainsi que tout le peuple,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeunes taureaux ». Le mot grec peut désigner des veaux ou de jeunes taureaux dans un contexte sacrificiel.
    reason: Préserver une autre traduction lexicale possible de μόσχων.
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: En effet, après que ... eut énoncé ... chacun des commandements
  rationale: Le génitif absolu est rendu par une proposition temporelle antérieure. « Chacun des commandements » conserve la valeur distributive de πάσης, tandis qu’« énoncé » exprime clairement la proclamation orale.
- source_word: κατὰ τὸν νόμον
  choice: conformément à la Loi
  rationale: Κατά avec l’accusatif indique ici la conformité. Cette formulation française est naturelle sans ajouter l’idée plus interprétative d’une exigence explicite.
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: Moïse ... à tout le peuple
  rationale: La tournure active est plus naturelle en français et conserve Moïse comme agent ainsi que la totalité de l’auditoire.
- source_word: λαβὼν τὸ αἷμα τῶν μόσχων
  choice: il prit le sang des veaux
  rationale: Le participe aoriste est rendu par un verbe conjugué dans la succession narrative. μόσχος peut désigner un veau ou un jeune taureau; le sens direct « veaux » est retenu, avec l’autre possibilité en note.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: avec de l’eau, de la laine écarlate et de l’hysope
  rationale: La formulation conserve les trois éléments du grec et l’imagerie rituelle, dans un français actuel et précis.
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: le rouleau lui-même ainsi que tout le peuple
  rationale: « Rouleau » reflète la forme matérielle probable du document ancien; « lui-même » garde l’emphase de αὐτό, et « ainsi que » rend la coordination τε ... καί.
- source_word: ἐράντισεν
  choice: en aspergea
  rationale: « Asperger » est le verbe français courant pour l’action rituelle de répandre un liquide en gouttelettes. Le pronom « en » reprend naturellement le sang accompagné des éléments mentionnés.
theological_decisions:
- issue: Rapport avec le récit d’Exode 24 et désignation des animaux sacrifiés
  choice: Traduire le texte grec de l’épître tel qu’il se présente, sans l’harmoniser ni l’étoffer à partir de l’Exode.
  alternative: Employer « jeunes taureaux » dans le texte principal ou ajouter des précisions tirées du récit de l’Exode.
  rationale: La formulation condensée d’Hébreux doit garder sa forme propre. La possibilité lexicale « jeunes taureaux » est signalée en note sans imposer une harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste soutenue sans être archaïque. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
