id: HEB.9.26
reference: Hebrews 9:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: fr
  text: Autrement, il aurait dû souffrir bien des fois depuis la fondation du monde. Mais maintenant, à la fin des temps[a], il s’est manifesté une fois pour toutes afin de supprimer le péché[b] par le sacrifice de lui-même[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’accomplissement des temps » ou « à la fin des âges ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin d’écarter le péché » ou « afin d’annuler le péché ».
    reason: lexical_alternative
  - marker: c
    text: Ou « par son sacrifice ». Le grec dit plus littéralement « par le sacrifice de lui-même ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Autrement
  rationale: Dans le raisonnement, ἐπεί introduit la conséquence hypothétique qui découlerait d’offrandes répétées. « Autrement » rend clairement cette valeur inférentielle.
- source_word: ἔδει αὐτὸν πολλάκις παθεῖν
  choice: il aurait dû souffrir bien des fois
  rationale: Le conditionnel passé exprime la nécessité hypothétique portée par l’imparfait ἔδει; « bien des fois » prépare le contraste avec ἅπαξ.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: depuis la fondation du monde
  rationale: Cette formulation conserve l’image de la fondation et exprime naturellement en français une durée commençant à l’origine du monde.
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: La formule marque à la fois le contraste avec l’hypothèse précédente et le moment décisif de la manifestation du Christ.
- source_word: ἅπαξ
  choice: une fois pour toutes
  rationale: Dans ce contexte sacrificiel, cette expression fait ressortir le caractère unique et non répétable de l’acte, en contraste direct avec πολλάκις.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: à l’accomplissement des siècles
  rationale: « Accomplissement » conserve l’idée de culmination portée par συντέλεια, tandis que « des siècles » respecte le pluriel de αἰώνων sans réduire l’expression à la seule fin chronologique du monde.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: afin d’abolir le péché
  rationale: ἀθέτησις peut désigner la mise à l’écart, l’annulation ou l’abolition. Le verbe « abolir » exprime ici l’efficacité décisive visée, tout en conservant le singulier collectif « le péché ».
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: par le sacrifice de lui-même
  rationale: Cette formulation conserve le nom θυσία et rend explicite que le Christ est lui-même ce qui est offert, plutôt que de laisser « son sacrifice » indéterminé.
- source_word: πεφανέρωται
  choice: il s’est manifesté
  rationale: Le passé composé rend naturellement en français l’acte accompli dont la portée demeure; « se manifester » correspond au sens de φανερόω et convient au contexte.
theological_decisions:
- issue: Portée de ἅπαξ dans l’œuvre sacrificielle du Christ
  choice: « une fois pour toutes »
  alternative: « une fois »
  rationale: Le contraste immédiat avec « bien des fois » et l’argument du chapitre appuient une expression soulignant le caractère définitif et non répétable du sacrifice, sans ajouter une conclusion étrangère au texte.
- issue: Valeur du singulier ἁμαρτίας
  choice: « le péché »
  alternative: « les péchés »
  rationale: Le singulier grec présente le péché comme une réalité globale que le sacrifice met à l’écart; le conserver évite de réduire le propos à une simple liste d’actes particuliers.
- issue: Relation exprimée par αὐτοῦ dans διὰ τῆς θυσίας αὐτοῦ
  choice: « par le sacrifice de lui-même »
  alternative: « par son sacrifice »
  rationale: Le contexte de l’offrande du Christ lui-même favorise la formulation réflexive, tout en signalant en note la traduction plus concise grammaticalement possible.
translation_notes:
  register: Français international moderne, clair et digne. Le verset garde la structure argumentative, le contraste entre répétition et unicité, ainsi que le vocabulaire temporel et sacrificiel du grec. « Accomplissement des siècles » est volontairement plus solennel que la langue courante afin de préserver la portée eschatologique de l’expression.
