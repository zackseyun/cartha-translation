reference: Hebrews 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: fr
  text: Mais le Messie est venu comme grand prêtre des biens qui se sont réalisés ; par le tabernacle plus grand et plus parfait, qui n’est pas fait de main d’homme, c’est-à-dire qui n’est pas de cette création—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le terme fonctionne ici comme un titre; « le Messie » en rend clairement la valeur dans un français moderne.
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec le sanctuaire terrestre et le ministère évoqués auparavant.
- source_word: παραγενόμενος
  choice: est venu
  rationale: Rend directement l’idée de venue et de présence du Messie dans son rôle de grand prêtre, sans surinterpréter le participe.
- source_word: ἀρχιερεὺς
  choice: grand prêtre
  rationale: Équivalent français établi pour cette fonction cultuelle.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: des biens qui se sont réalisés
  rationale: Suit γενομένων, « qui sont advenus / se sont réalisés », tout en offrant une formulation française naturelle et en la distinguant de la variante « à venir ».
- source_word: διὰ τῆς ... σκηνῆς
  choice: en passant par la ... tente
  rationale: « Tente » restitue le sens de σκηνή et son arrière-plan du sanctuaire mobile; « en passant par » prépare naturellement la continuation de la phrase au verset 12.
- source_word: μείζονος καὶ τελειοτέρας
  choice: plus grande et plus parfaite
  rationale: Conserve les deux comparatifs et le vocabulaire thématique de la perfection dans l’épître.
- source_word: οὐ χειροποιήτου
  choice: qui n’est pas faite de main d’homme
  rationale: Expression biblique française claire qui souligne l’absence de fabrication humaine.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Introduit explicitement la précision qui suit.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: qui n’appartient pas à cette création
  rationale: Exprime naturellement que cette tente ne relève pas de l’ordre créé présent, sans préciser davantage sa nature.
theological_decisions:
- issue: Valeur textuelle et temporelle de τῶν γενομένων ἀγαθῶν
  choice: des biens qui se sont réalisés
  alternative: des biens à venir
  rationale: Le texte principal suit le SBLGNT, qui lit γενομένων et présente ces biens comme déjà advenus. La variante μελλόντων, largement attestée et traditionnellement connue, est signalée en note sans être introduite dans le texte.
- issue: Relation syntaxique de διὰ τῆς ... σκηνῆς
  choice: en passant par la tente…, avec une phrase laissée ouverte vers le verset 12
  alternative: rattacher « par la tente » à la venue du Messie
  rationale: La construction se poursuit avec le verbe principal du verset 12. Le tiret final et la formulation retenue évitent de faire de la tente le moyen par lequel le Messie serait venu ou apparu.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset demeure syntaxiquement ouvert, conformément au grec, puisque la phrase se poursuit au verset 12. « Tente » est retenu plutôt que « tabernacle » pour sa clarté immédiate, tout en conservant l’image du sanctuaire mobile.
