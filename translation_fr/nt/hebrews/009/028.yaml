revisions:
- from: De même, le Messie, après avoir été offert une fois pour porter les péchés d’un grand nombre, apparaîtra une seconde fois, sans rapport avec le péché[a], à ceux qui l’attendent ardemment, en vue du salut.
  to: De même, le Messie, après avoir été offert une fois pour porter les péchés de beaucoup, apparaîtra une seconde fois, sans rapport avec le péché[a], à ceux qui l’attendent ardemment, en vue du salut.
  rationale: La seule correction nécessaire remplace « d’un grand nombre » par « de beaucoup », afin de rendre πολλῶν sans intensification ajoutée. Le reste du texte et la note préservent de manière satisfaisante la concision et la tension interprétative de χωρὶς ἁμαρτίας.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:42:00Z'
review_pass:
  verdict: revise
  source_fidelity: La structure comparative, la voix passive de « après avoir été offert », l’unicité de l’offrande, l’attente fervente et la finalité du salut sont bien rendues. Toutefois, « d’un grand nombre » amplifie πολλῶν (« de beaucoup / de nombreux ») par l’ajout non exprimé de l’idée de grandeur.
  naturalness: Le français est actuel, clair et d’un registre biblique sobre. « Les péchés de beaucoup » est un peu plus littéral que « d’un grand nombre », mais reste naturel dans ce contexte et évite l’amplification.
  terminology: « Le Messie », « porter les péchés », « apparaîtra », « sans rapport avec le péché » et « en vue du salut » conviennent. La note distingue utilement la formulation littérale de l’explication contextuelle, sans imposer cette dernière comme seule traduction.
  issues:
  - severity: medium
    issue: « d’un grand nombre » traduit πολλῶν
    rationale: πολλῶν signifie « de beaucoup / de nombreux »; « grand » ajoute une notion d’ampleur qui n’est pas lexicalement présente. Il convient de conserver « beaucoup ».
  revised_text: De même, le Messie, après avoir été offert une fois pour porter les péchés de beaucoup, apparaîtra une seconde fois, sans rapport avec le péché[a], à ceux qui l’attendent ardemment, en vue du salut.
