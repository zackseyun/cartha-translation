id: HEB.9.28
reference: Hebrews 9:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: fr
  text: De même, le Messie, après avoir été offert une fois pour porter les péchés de beaucoup, apparaîtra une seconde fois, sans rapport avec le péché[a], à ceux qui l’attendent ardemment, en vue du salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à part du péché ». Autrement dit, il n’apparaîtra pas de nouveau pour porter le péché comme lors de son offrande.'
    reason: Précise une expression grecque concise dont une traduction strictement littérale serait peu naturelle et potentiellement obscure en français.
lexical_decisions:
- source_word: οὕτως καὶ
  choice: De même
  rationale: Introduit naturellement en français la comparaison avec le sort humain évoqué au verset précédent.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre dans l’argument relatif à l’accomplissement du salut; « le Messie » en restitue clairement la valeur.
- source_word: ἅπαξ
  choice: une fois
  rationale: Rend directement l’adverbe sans ajouter explicitement « une fois pour toutes », bien que cette portée puisse découler du contexte de l’épître.
- source_word: προσενεχθεὶς
  choice: après avoir été offert
  rationale: Préserve la voix passive du participe aoriste et marque clairement l’antériorité de l’offrande par rapport à l’apparition future.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: pour porter les péchés d’un grand nombre
  rationale: « Pour » exprime le but, tandis que « porter les péchés » conserve les résonances sacrificielles et isaïennes de ἀναφέρω.
- source_word: ἐκ δευτέρου
  choice: une seconde fois
  rationale: Expression française naturelle qui maintient le contraste avec la première venue et l’offrande déjà mentionnée.
- source_word: χωρὶς ἁμαρτίας
  choice: sans rapport avec le péché
  rationale: Formulation française concise qui évite l’ambiguïté trompeuse de « sans péché », laquelle pourrait être comprise comme une affirmation portant seulement sur l’absence de péché en Christ. Une note conserve la forme plus littérale et précise l’interprétation contextuelle possible.
- source_word: ὀφθήσεται
  choice: apparaîtra
  rationale: Le futur passif de ὁράω prend ici le sens usuel d’une manifestation visible; « apparaîtra » convient au contexte eschatologique.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: à ceux qui l’attendent ardemment
  rationale: « Ardemment » rend la nuance d’attente intense et confiante portée par ἀπεκδέχομαι, sans la connotation parfois négative d’« impatience ».
- source_word: εἰς σωτηρίαν
  choice: en vue du salut
  rationale: Conserve la valeur de but de εἰς et la formulation concise du grec sans expliciter qui apporte ou reçoit le salut.
theological_decisions:
- issue: Sens de χωρὶς ἁμαρτίας lors de la seconde apparition
  choice: sans rapport avec le péché
  alternative: à part du péché; non pour porter de nouveau le péché
  rationale: La seconde apparition est mise en contraste avec l’offrande unique destinée à porter les péchés. Le texte principal reste concis et ne développe pas entièrement ce rapport, tandis que la note signale la formulation littérale et l’explication contextuelle sans transformer celle-ci en traduction unique.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la structure comparative et le mouvement théologique du grec, tout en évitant les tournures archaïques et les explicitations doctrinales non exigées par le texte.
