  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: fr
  text: C’est pourquoi même la première alliance n’a pas été inaugurée sans sang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans sang ». Le grec dit simplement « la première » ; dans le contexte, il s’agit de la première alliance. Certains traduisent : « le premier testament ».'
    reason: La note conserve la formulation concise du grec et signale à la fois le nom sous-entendu et l’autre rendu possible dans le contexte.
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent sur l’alliance, la mort et le sang.
- source_word: οὐδὲ
  choice: même… n’a pas
  rationale: Cette tournure française rend la valeur emphatique de « pas même » tout en gardant une syntaxe fluide.
- source_word: ἡ πρώτη
  choice: la première alliance
  rationale: L’adjectif féminin substantivé renvoie, dans le contexte, à l’alliance évoquée auparavant. Le nom implicite est explicité pour assurer la clarté.
- source_word: χωρὶς αἵματος
  choice: sans effusion de sang
  rationale: Dans le contexte rituel d’Exode 24, il ne s’agit pas seulement de la présence de sang, mais de son emploi sacrificiel. « Effusion de sang » exprime cette portée de façon naturelle, tout en signalant en note la formulation plus littérale.
- source_word: ἐγκεκαίνισται
  choice: n’a pas été inaugurée
  rationale: Le verbe désigne la mise en vigueur ou l’inauguration cérémonielle. Le passé composé passif est naturel en français et conserve l’idée d’un acte accompli dont la portée demeure.
theological_decisions:
- issue: Référent de « la première »
  choice: la première alliance
  alternative: « la première » ou « le premier testament »
  rationale: Le contexte immédiat et l’allusion à Exode 24 favorisent l’alliance. Traduire seulement « la première » serait obscur en français, tandis que « testament » imposerait ici une autre nuance possible de διαθήκη sans nécessité.
translation_notes:
  register: Français international moderne, clair et digne. « Inaugurée » maintient la dimension cérémonielle sans réduire l’action à une simple ratification juridique.
