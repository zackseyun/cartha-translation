source:
  edition: SBLGNT
  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: fr
  text: Et tout comme il est réservé aux êtres humains de mourir une seule fois, après quoi vient le jugement,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: tout comme
  rationale: Dans ce contexte, l’expression introduit la comparaison qui se poursuit au verset 28. « Tout comme » l’annonce naturellement en français.
- source_word: ἀπόκειται
  choice: il est réservé
  rationale: Le verbe exprime ici ce qui attend les êtres humains, ce qui leur est fixé. « Il est réservé » conserve l’image lexicale tout en restant idiomatique.
- source_word: τοῖς ἀνθρώποις
  choice: aux êtres humains
  rationale: Le pluriel grec est générique et désigne l’humanité, sans restriction aux hommes de sexe masculin. Cette formulation moderne en rend exactement la portée.
- source_word: ἅπαξ
  choice: une seule fois
  rationale: L’adverbe indique une occurrence unique. « Une seule fois » est naturel et précis, sans lui donner ici le sens plus fort de « une fois pour toutes ».
- source_word: ἀποθανεῖν
  choice: de mourir
  rationale: Traduction directe et naturelle de l’infinitif complément de ἀπόκειται.
- source_word: μετὰ δὲ τοῦτο
  choice: après quoi vient
  rationale: La tournure marque la succession entre la mort et le jugement. L’ajout idiomatique de « vient » ne précise pas davantage la nature du jugement.
- source_word: κρίσις
  choice: le jugement
  rationale: Le nom désigne l’acte de juger ou l’évaluation judiciaire. « Le jugement » préserve sa portée sans le réduire à la condamnation.
theological_decisions:
- issue: Portée générique de ἀνθρώποις
  choice: « êtres humains », pour désigner explicitement toute l’humanité
  alternative: « hommes », susceptible en français moderne d’être compris comme exclusivement masculin
  rationale: Le grec emploie un masculin pluriel de portée générique. La traduction inclusive exprime cette portée sans modifier le référent.
- issue: Nature du jugement après la mort
  choice: « le jugement », sans autre qualification
  alternative: « la condamnation » ou « le jugement dernier »
  rationale: Le verset affirme qu’un jugement suit la mort, mais ne précise ici ni son résultat ni tous ses détails eschatologiques. La formulation conserve cette réserve.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde son caractère introductif et sa virgule finale, puisqu’elle ouvre la comparaison achevée au verset 28.
