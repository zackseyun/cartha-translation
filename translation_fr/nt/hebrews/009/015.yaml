id: HEB.9.15
reference: Hebrews 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: fr
  text: C’est pourquoi il est le médiateur d’une alliance nouvelle[a], afin que, une mort étant intervenue pour le rachat des transgressions commises sous la première alliance, ceux qui ont été appelés reçoivent la promesse de l’héritage éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un testament nouveau ». Le mot grec διαθήκη peut désigner une alliance ou un testament; Hébreux 9.16-17 exploite ce chevauchement de sens, mais « alliance » convient le mieux ici au contraste avec la première alliance.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Expression causale naturelle en français moderne, qui relie explicitement le verset à l’argument précédent.
- source_word: διαθήκης καινῆς
  choice: d’une alliance nouvelle
  rationale: « Alliance » convient au contraste avec la première alliance et au contexte biblique, tandis que le sens possible de « testament » est conservé en note.
- source_word: μεσίτης
  choice: médiateur
  rationale: Terme précis et courant pour celui qui intervient entre des parties afin d’établir leur relation.
- source_word: θανάτου γενομένου
  choice: puisqu’une mort a eu lieu
  rationale: Rend la valeur circonstancielle du génitif absolu et présente la mort comme le fait accompli qui fonde le résultat énoncé.
- source_word: εἰς ἀπολύτρωσιν
  choice: pour libérer
  rationale: Exprime ici la délivrance obtenue au prix d’une mort dans une formulation française claire; le contexte sacrificiel en conserve la portée rédemptrice.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: des transgressions commises sous la première alliance
  rationale: « Sous » rend la sphère ou la période de la première alliance; « commises » explicite naturellement en français le rapport avec les transgressions.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: l’héritage éternel promis
  rationale: 'Cette restructuration naturelle traite le génitif comme indiquant le contenu de la promesse sans changer le sens: l’héritage éternel est ce qui a été promis.'
- source_word: οἱ κεκλημένοι
  choice: ceux qui ont été appelés
  rationale: 'Préserve la valeur du participe parfait passif: ces personnes ont reçu l’appel et demeurent dans cette condition.'
- source_word: λάβωσιν
  choice: peuvent recevoir
  rationale: Après la proposition de but introduite par ὅπως, cette formulation exprime le résultat visé sans suggérer une simple capacité autonome.
theological_decisions:
- issue: Référent du sujet sous-entendu de ἐστίν
  choice: « il est », renvoyant au Christ dans le contexte immédiat
  alternative: Reformuler sans sujet explicite
  rationale: Le français exige un sujet; le contexte précédent identifie clairement le Christ, sans qu’il soit nécessaire d’ajouter son nom dans le verset.
- issue: Sens de διαθήκη
  choice: « alliance » dans le texte principal
  alternative: « testament »
  rationale: Le contraste entre l’alliance nouvelle et la première alliance commande ici « alliance », mais le chevauchement sémantique exploité en Hébreux 9.16-17 mérite d’être signalé.
- issue: Rapport entre ἐπαγγελίαν et κληρονομίας
  choice: « l’héritage éternel promis »
  alternative: « la promesse de l’héritage éternel »
  rationale: La formulation choisie comprend l’héritage comme le contenu promis et évite une tournure française susceptible de faire de la « promesse » l’objet reçu indépendamment de l’héritage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien causal avec le contexte, le vocabulaire juridique et religieux essentiel, ainsi que l’ambiguïté réelle de διαθήκη au moyen d’une note.
