revisions:
- from: 'Voilà pourquoi il est le médiateur d’une alliance nouvelle[a] : puisqu’une mort a eu lieu pour libérer des transgressions commises sous la première alliance, ceux qui ont été appelés peuvent recevoir l’héritage éternel promis.'
  to: C’est pourquoi il est le médiateur d’une alliance nouvelle[a], afin que, une mort étant intervenue pour le rachat des transgressions commises sous la première alliance, ceux qui ont été appelés reçoivent la promesse de l’héritage éternel.
  rationale: La révision rétablit explicitement la dépendance finale de la phrase, conserve « promesse » comme objet de « reçoivent », et emploie « rachat » pour ἀπολύτρωσις. La note existante est conservée, car elle signale de façon adéquate l’alternative sémantique de διαθήκη sans l’imposer au texte principal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:41:34Z'
review_pass:
  verdict: revise
  source_fidelity: La structure de but introduite par ὅπως doit être rendue plus nettement. Le texte grec fait recevoir aux appelés « la promesse de l’héritage éternel »; la reformulation actuelle « l’héritage éternel promis » explicite une interprétation possible, mais ne conserve pas aussi directement τὴν ἐπαγγελίαν. « Peuvent recevoir » peut aussi évoquer une capacité plutôt que le but visé.
  naturalness: Le français est globalement naturel et de registre approprié. « C’est pourquoi » est légèrement plus neutre et international que « Voilà pourquoi ». La construction révisée demeure claire tout en respectant l’enchaînement du grec.
  terminology: « Médiateur », « alliance », « transgressions », « première alliance » et « héritage éternel » sont appropriés. « Rachat » rend plus précisément ἀπολύτρωσις que le verbe plus général « libérer ». La note sur διαθήκη est pertinente et son ancrage est correct.
  issues:
  - severity: medium
    issue: La proposition de but ὅπως est insuffisamment marquée par « peuvent recevoir ».
    rationale: Le présent français peut se lire comme une capacité. « afin que ... reçoivent » rend explicitement le but/résultat visé par le subjonctif grec.
  - severity: medium
    issue: « l’héritage éternel promis » ne reproduit pas explicitement « la promesse de l’héritage éternel ».
    rationale: Bien que le sens contextuel soit proche, τὴν ἐπαγγελίαν est l’objet direct de λάβωσιν. La formulation révisée préserve ce nom et la relation génitivale sans décider de reformuler l’objet reçu.
  - severity: low
    issue: « pour libérer » est plus général que ἀπολύτρωσις.
    rationale: « pour le rachat » conserve le registre rédempteur et le nom abstrait du grec, sans imposer une théorie particulière de l’expiation.
  revised_text: C’est pourquoi il est le médiateur d’une alliance nouvelle[a], afin que, une mort étant intervenue pour le rachat des transgressions commises sous la première alliance, ceux qui ont été appelés reçoivent la promesse de l’héritage éternel.
  revised_footnotes:
  - marker: a
    text: Ou « d’un testament nouveau ». Le mot grec διαθήκη peut désigner une alliance ou un testament; Hébreux 9.16-17 exploite ce chevauchement de sens, mais « alliance » convient le mieux ici au contraste avec la première alliance.
    reason: alternative_reading
  revision_rationale: La révision rétablit explicitement la dépendance finale de la phrase, conserve « promesse » comme objet de « reçoivent », et emploie « rachat » pour ἀπολύτρωσις. La note existante est conservée, car elle signale de façon adéquate l’alternative sémantique de διαθήκη sans l’imposer au texte principal.
