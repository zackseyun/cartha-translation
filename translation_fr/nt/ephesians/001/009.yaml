  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: fr
  text: Nous ayant fait connaître le mystère de sa volonté, conformément à son bon dessein, qu’il s’était proposé en lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qu’il s’était proposé dans le Christ » ; certains comprennent « en lui » au sens réflexif : « en lui-même ».'
    reason: 'Le référent de ἐν αὐτῷ demeure ambigu : le pronom peut être compris comme renvoyant au Christ ou, dans une lecture réflexive, à Dieu lui-même.'
lexical_decisions:
- source_word: γνωρίσας
  choice: Il nous a fait connaître
  rationale: Le participe aoriste grec dépend de la phrase commencée auparavant. En français courant, une proposition principale explicite restitue plus naturellement son sens et son sujet implicite, Dieu, sans ajouter d’idée de révélation absente du verbe.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom au datif désigne les destinataires de ce que Dieu fait connaître; la construction française « faire connaître à quelqu’un » l’intègre naturellement sous la forme « nous ».
- source_word: τὸ μυστήριον τοῦ θελήματος αὐτοῦ
  choice: le mystère de sa volonté
  rationale: « Mystère » conserve le sens paulinien d’un dessein divin auparavant caché et désormais dévoilé; « volonté » traduit directement θέλημα sans le confondre avec le dessein mentionné ensuite.
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: conformément à son dessein bienveillant
  rationale: κατά exprime ici la conformité. εὐδοκία associe intention favorable et bon plaisir; « dessein bienveillant » est naturel en français moderne et conserve ces deux dimensions sans suggérer un plaisir arbitraire.
- source_word: ἣν προέθετο
  choice: qu’il avait formé
  rationale: Le plus-que-parfait marque l’antériorité du dessein divin. « Former un dessein » rend idiomatiquement l’idée de se proposer ou d’établir une intention.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: La traduction garde le pronom grec sans trancher son référent. Dans le contexte, il peut renvoyer au Christ, tandis qu’une lecture réflexive rapportée à Dieu demeure possible.
theological_decisions:
- issue: Référent de ἐν αὐτῷ
  choice: Le texte principal conserve « en lui », susceptible de renvoyer au Christ.
  alternative: « en lui-même », avec un sens réflexif rapporté à Dieu.
  rationale: Le pronom grec ne nomme pas explicitement son référent. Le contexte christologique favorise une référence au Christ, mais la lecture réflexive est grammaticalement défendable; la note préserve donc cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. « Dessein bienveillant » évite l’expression vieillie « bon plaisir » tout en conservant l’idée d’une intention favorable. La syntaxe grecque participiale est transformée en phrase autonome pour une lecture naturelle du verset isolé.
