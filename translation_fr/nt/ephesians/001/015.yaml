id: EPH.1.15
reference: Ephesians 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: fr
  text: C’est pourquoi, moi aussi, ayant entendu parler de votre foi dans le Seigneur Jésus[a] et de votre amour pour tous les saints[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre confiance dans le Seigneur Jésus » ; dans certains contextes, le nom grec peut aussi exprimer la « fidélité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « votre amour envers tous les saints ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette expression renvoie à la bénédiction qui précède et introduit naturellement en français la réaction de Paul.
- source_word: κἀγώ
  choice: moi aussi
  rationale: 'La contraction de καί et ἐγώ a une valeur additive : Paul se joint personnellement à la réponse évoquée.'
- source_word: ἀκούσας
  choice: ayant entendu parler de
  rationale: Le participe aoriste est conservé par une tournure participiale française naturelle, qui indique ce que Paul a appris.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: votre foi
  rationale: L’expression désigne ici la foi qui caractérise les destinataires ; « votre foi » est la formulation française la plus claire.
- source_word: πίστιν
  choice: foi
  rationale: Dans ce contexte, le nom désigne principalement la relation croyante des destinataires au Seigneur Jésus, tout en pouvant comporter ailleurs les nuances de confiance ou de fidélité.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: dans le Seigneur Jésus
  rationale: « Dans » conserve la préposition grecque et l’expression paulinienne, sans la remplacer par une orientation plus explicite comme « envers ».
- source_word: κυρίῳ
  choice: Seigneur
  rationale: « Seigneur » rend le titre christologique courant κύριος sans en affaiblir la portée.
- source_word: ἀγάπην
  choice: amour
  rationale: « Amour » est l’équivalent moderne, direct et naturel de ἀγάπη.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: pour tous les saints
  rationale: « Pour » exprime naturellement en français la direction de l’amour vers ses bénéficiaires, tandis que « saints » conserve la désignation paulinienne des croyants.
- source_word: ἁγίους
  choice: saints
  rationale: Le terme garde la désignation collective traditionnelle de ceux qui sont consacrés à Dieu, sans suggérer ici une canonisation ultérieure.
theological_decisions:
- issue: Sens de πίστις dans la relation au Seigneur Jésus
  choice: foi
  alternative: confiance ; fidélité
  rationale: La construction désigne le plus directement la foi des destinataires dans le Seigneur Jésus. « Confiance » expliciterait une dimension réelle du terme, tandis que « fidélité » est lexicalement possible dans certains contextes mais moins probable ici.
- issue: Traduction du titre κύριος appliqué à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre français établi qui préserve le poids christologique de κύριος ; « Maître » en réduirait ici la portée possible.
- issue: Désignation des croyants par ἅγιοι
  choice: saints
  alternative: ceux qui appartiennent à Dieu ; personnes saintes
  rationale: « Saints » maintient le vocabulaire paulinien de consécration collective. Dans ce contexte, le mot vise l’ensemble des croyants et non une catégorie ultérieure de personnes canonisées.
translation_notes:
  register: Français international moderne, digne et lisible. La structure participiale et la virgule finale sont conservées parce que le verset se poursuit syntaxiquement au verset suivant. « Saints » est maintenu comme terme paulinien collectif, éclairé par la note théologique plutôt que paraphrasé dans le texte.
