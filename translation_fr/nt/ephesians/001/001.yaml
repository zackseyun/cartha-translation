id: EPH.1.1
reference: Ephesians 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: fr
  text: 'Paul, apôtre de Jésus le Messie[c] par la volonté de Dieu, aux saints qui sont [à Éphèse][a] et fidèles en Jésus le Messie[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits anciens omettent « à Éphèse », ce qui a conduit certains à comprendre cette lettre comme destinée à une circulation plus large plutôt qu'à la seule Église d'Éphèse.
    reason: textual_variant
  - marker: b
    text: 'Ou : « croyants en Jésus le Messie ».'
    reason: lexical_alternative
  - marker: c
    text: Le grec porte littéralement « Christ Jésus » ; « Messie » rend ici Χριστός comme un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Dans cette formule d’ouverture, le terme désigne la mission et l’autorité reconnues de Paul; « apôtre » en conserve le sens technique.
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: de Jésus le Messie / en Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. « Jésus le Messie » est plus naturel en français que « Messie Jésus », tout en exprimant clairement ce titre.
- source_word: διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Cette tournure française rend naturellement διά avec le génitif dans une formule où la mission apostolique découle de la volonté divine.
- source_word: ἁγίοις
  choice: saints
  rationale: Dans les adresses pauliniennes, le mot désigne collectivement ceux qui sont consacrés à Dieu; « saints » est concis, reconnu et fidèle au registre de la lettre.
- source_word: τοῖς οὖσιν
  choice: qui sont
  rationale: Cette traduction directe conserve le participe de εἰμί sans lui ajouter l’idée de résidence ou de présence.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[à Éphèse]'
  rationale: Les crochets maintiennent visiblement l’incertitude textuelle signalée dans le texte grec fourni.
- source_word: πιστοῖς
  choice: fidèles
  rationale: Le terme peut signifier « fidèles » ou « croyants ». Le choix « fidèles » préserve sa forme adjectivale et sa nuance possible de fidélité, sans exclure l’autre sens, signalé en note.
theological_decisions:
- issue: Valeur de Χριστός dans la salutation paulinienne
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le terme fonctionne ici comme un titre. La formulation retenue rend cette valeur explicite tout en restant naturelle en français.
- issue: Présence de ἐν Ἐφέσῳ
  choice: Conserver « à Éphèse » entre crochets
  alternative: Omettre « à Éphèse »
  rationale: Des témoins anciens importants omettent ces mots. Les crochets préservent cette incertitude au lieu de trancher silencieusement.
- issue: Sens de πιστοῖς
  choice: fidèles
  alternative: croyants
  rationale: Les deux sens sont lexicalement possibles. Le texte principal retient « fidèles » et la note maintient l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme épistolaire de la salutation. La répétition de « qui sont » rend explicite le lien grammatical entre les destinataires, leur localisation textuellement incertaine et leur fidélité, sans effacer l’ambiguïté de πιστοῖς.
