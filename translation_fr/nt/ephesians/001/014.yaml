source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: fr
  text: qui est l’acompte de notre héritage, en vue de la rédemption de la possession[a], à la louange de sa gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’acquisition » ou « de l’entrée en possession ». Le grec peut évoquer soit une possession acquise, notamment celle de Dieu, soit l’acquisition pleine de l’héritage.
    reason: Préserve l’ambiguïté de τῆς περιποιήσεως sans imposer un référent ou une interprétation théologique dans le texte.
lexical_decisions:
- source_word: ἀρραβών
  choice: acompte
  rationale: Désigne un premier versement qui garantit le paiement complet à venir; « acompte » est naturel en français moderne et conserve l’idée de garantie anticipée.
- source_word: κληρονομία
  choice: héritage
  rationale: Équivalent direct qui garde la portée eschatologique du bien promis aux croyants.
- source_word: ἀπολύτρωσις
  choice: libération
  rationale: Le terme grec évoque une délivrance obtenue par rachat; ici, « libération » produit une formulation française claire sans imposer dans le texte le mécanisme seulement implicite.
- source_word: περιποίησις
  choice: ce que Dieu s’est acquis
  rationale: Dans ce contexte, le mot désigne vraisemblablement le peuple ou la possession acquise par Dieu. La tournure explicite le possesseur requis en français tout en évitant l’expression obscure « la possession ».
- source_word: εἰς
  choice: en vue de
  rationale: Préserve l’orientation vers l’accomplissement futur plutôt qu’une simple causalité.
theological_decisions:
- issue: Référent de ὅ
  choice: « qui », renvoyant à l’Esprit Saint mentionné au verset précédent
  alternative: '« lequel » ou une reprise nominale: « cet Esprit »'
  rationale: Le relatif masculin grec s’accorde avec πνεῦμα compris personnellement dans le contexte. « Qui » maintient le lien syntaxique et le caractère personnel sans alourdir la phrase.
- issue: Sens de τῆς περιποιήσεως
  choice: « de ce que Dieu s’est acquis »
  alternative: « de notre pleine possession » ou « de la possession »
  rationale: Le génitif peut se comprendre comme la possession acquise par Dieu ou comme l’entrée des croyants en possession de l’héritage. Le contexte biblique favorise la première lecture, mais l’expression reste assez générale pour ne pas identifier plus précisément l’objet acquis.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste un fragment relatif parce qu’elle poursuit directement Éphésiens 1.13. « Acompte » est préféré à « arrhes », plus traditionnel mais moins transparent pour de nombreux lecteurs contemporains.
