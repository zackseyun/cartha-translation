review_pass:
  verdict: revise
  source_fidelity: La relative et « acompte de notre héritage » rendent fidèlement ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν. « En vue de » restitue bien l’orientation de εἰς. En revanche, « ce que Dieu s’est acquis » tranche une ambiguïté réelle de τῆς περιποιήσεως et ajoute explicitement « Dieu », absent de ce groupe génitival. Le grec peut désigner une possession acquise/appartenant à Dieu ou l’acquisition/entrée en possession de l’héritage.
  naturalness: La formulation est fluide et le fragment relatif convient, puisqu’il poursuit la phrase du verset précédent. « La rédemption de la possession » est soutenu mais clair dans ce registre biblique; une note permet d’en expliciter l’ambiguïté sans paraphraser le texte.
  terminology: « Acompte », « héritage », « rédemption » et « gloire » sont des équivalents modernes et suffisamment précis. « Rédemption » rend mieux ἀπολύτρωσις que « libération » en conservant le terme théologique et le champ du rachat, sans en préciser indûment le mécanisme.
  issues:
