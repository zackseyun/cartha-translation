    issue: Interprétation non signalée de τῆς περιποιήσεως
    rationale: « Ce que Dieu s’est acquis » choisit la lecture de la possession de Dieu, ajoute le possesseur et ne préserve pas l’autre lecture possible, celle de l’acquisition ou de l’entrée en possession. Le texte principal doit rester plus neutre; la note peut présenter les possibilités.
  - severity: low
    issue: Affaiblissement du terme ἀπολύτρωσις
    rationale: « Libération » est possible, mais « rédemption » correspond plus directement au vocabulaire paulinien et maintient l’arrière-plan de délivrance par rachat.
