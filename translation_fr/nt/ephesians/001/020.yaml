id: EPH.1.20
reference: Ephesians 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: fr
  text: qu’il a déployée dans le Messie[a] lorsqu’il l’a ressuscité d’entre les morts et l’a fait asseoir à sa droite dans les lieux célestes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dans le Christ».
    reason: alternative_reading
  - marker: b
    text: Ou «parmi les réalités célestes».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: qu’
  rationale: Le pronom relatif féminin renvoie à une réalité féminine du contexte précédent, vraisemblablement la puissance ou la force en action; l’élision donne une liaison naturelle en français.
- source_word: ἐνήργηκεν
  choice: a déployée
  rationale: Le verbe exprime une action efficace et opérante. «Déployer» convient à la puissance évoquée dans le contexte et conserve l’idée de sa mise en œuvre effective.
- source_word: ἐν τῷ Χριστῷ
  choice: dans le Messie
  rationale: La préposition ἐν est conservée et Χριστός est compris ici comme un titre messianique.
- source_word: ἐγείρας αὐτὸν
  choice: lorsqu’il l’a ressuscité
  rationale: Le participe aoriste indique ici la circonstance dans laquelle cette puissance a été déployée; «lorsque» rend ce rapport sans imposer une causalité exclusive.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette tournure française naturelle représente le pluriel grec et l’idée que Jésus a été relevé du milieu des morts.
- source_word: καθίσας
  choice: et l’a fait asseoir
  rationale: Le participe coordonné à ἐγείρας décrit l’action de Dieu qui donne au Messie sa place; la formulation française exprime clairement la valeur transitive du verbe.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: à sa droite
  rationale: Expression française idiomatique correspondant à la place d’honneur, sans expliciter davantage sa portée théologique.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: dans les lieux célestes
  rationale: Le neutre pluriel substantivé désigne la sphère céleste. Cette formulation demeure concrète, claire et bien établie en français biblique moderne.
theological_decisions:
- issue: Valeur de Χριστῷ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme peut être entendu comme le titre royal et messianique ou comme une désignation devenue quasi nominale. Le texte retient le sens titulaire tout en signalant l’autre rendu courant.
- issue: Portée de ἐν τοῖς ἐπουρανίοις
  choice: dans les lieux célestes
  alternative: dans les réalités célestes
  rationale: La construction grecque désigne une sphère céleste sans nom exprimé. «Lieux célestes» préserve la nuance locative, tandis que l’alternative rappelle que le grec peut viser plus largement le domaine ou les réalités célestes.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset étant syntaxiquement lié au contexte précédent, la traduction conserve l’ouverture par un pronom relatif et l’accord féminin de «déployée». Les formulations traditionnelles ne sont retenues que lorsqu’elles restent claires aujourd’hui.
