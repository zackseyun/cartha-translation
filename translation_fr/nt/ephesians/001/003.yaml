id: EPH.1.3
reference: Ephesians 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: fr
  text: Béni soit le Dieu et Père de notre Seigneur Jésus le Messie[a], qui nous a bénis de toute bénédiction spirituelle[b] dans les réalités célestes[c], dans le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « Jésus-Christ » et, à la fin du verset, « en Christ ». Le titre grec Χριστός signifie « Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « toute bénédiction de l’Esprit ». L’adjectif grec peut signifier « spirituelle » au sens large ou « qui relève de l’Esprit ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans les lieux célestes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Béni soit
  rationale: Cette formule exclamative et doxologique rend naturellement l’adjectif prédicatif grec et exprime la louange adressée à Dieu.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: le Dieu et Père
  rationale: L’article grec porte sur les deux noms coordonnés. La formulation française conserve à la fois l’identité divine et la relation paternelle exprimées par le texte.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » rend le titre κύριος dans son emploi christologique courant.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est ici rendu selon son sens de titre, « Messie »; l’article ajouté en français permet une expression idiomatique sans prétendre reproduire un article grec absent.
- source_word: ὁ εὐλογήσας
  choice: qui nous a bénis
  rationale: Le passé composé présente l’acte accompli de Dieu avec sa portée actuelle et conserve le lien lexical entre « béni » et « bénédiction ».
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: de toute bénédiction spirituelle
  rationale: Après « bénir », « de » exprime en français le contenu de la bénédiction. « Toute » garde la portée de πάσῃ, tandis que « spirituelle » préserve l’étendue sémantique de πνευματικῇ.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: dans les réalités célestes
  rationale: L’adjectif neutre pluriel substantivé désigne la sphère céleste sans nom exprimé. « Réalités célestes » demeure lisible et évite de rendre l’expression nécessairement géographique.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: La formulation compacte conserve la préposition ἐν et le titre messianique, sans expliciter davantage la nature de cette relation.
theological_decisions:
- issue: Rendu de Χριστός dans les formules pauliniennes
  choice: « le Messie » dans « Jésus le Messie » et « dans le Messie »
  alternative: « Christ » dans « Jésus-Christ » et « en Christ »
  rationale: Le titre grec signifie « Messie ». Le traduire en conserve la valeur messianique; la forme traditionnelle est signalée en note afin de ne pas masquer l’équivalence.
- issue: Sens de πνευματικῇ
  choice: spirituelle
  alternative: de l’Esprit
  rationale: L’adjectif peut qualifier les bénédictions comme spirituelles ou les rapporter plus précisément à l’Esprit. Le texte principal maintient cette amplitude, et la note indique la lecture plus précise.
- issue: Portée de ἐν Χριστῷ
  choice: dans le Messie
  alternative: par le Messie / en union avec le Messie
  rationale: La traduction conserve la formule paulinienne concise et sa tension théologique sans décider si ἐν exprime principalement la sphère, l’union ou le moyen.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la cadence de bénédiction et la répétition grecque « béni / bénis / bénédiction ». « Réalités célestes » rend l’expression éphésienne sans lui imposer un sens exclusivement spatial.
