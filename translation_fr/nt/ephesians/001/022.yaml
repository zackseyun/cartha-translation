id: EPH.1.22
reference: Ephesians 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: fr
  text: Il a tout soumis sous ses pieds[a] et l’a donné à l’Église comme chef au-dessus de tout[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation fait écho au Psaume 8.7, où tout est placé sous les pieds de celui qui exerce la domination.
    reason: cross_reference
  - marker: b
    text: 'Ou : « pour l’Église » ; le datif grec τῇ ἐκκλησίᾳ peut exprimer aussi bien le bénéficiaire que le destinataire.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel désigne ici la totalité de ce qui existe. « Tout » est naturel en français et conserve la portée universelle du grec.
- source_word: ὑπέταξεν
  choice: a soumis
  rationale: Le verbe exprime l’action de placer sous autorité. « A soumis » préserve directement la force de l’aoriste actif et le rapport de subordination.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: sous ses pieds
  rationale: La traduction littérale maintient l’image biblique de domination et son écho au Psaume 8.6.
- source_word: αὐτὸν ἔδωκεν
  choice: l’a donné
  rationale: 'Cette formulation conserve le sens ordinaire de δίδωμι et permet de laisser ouverte la nuance du datif τῇ ἐκκλησίᾳ : destinataire ou bénéficiaire.'
- source_word: κεφαλὴν
  choice: comme chef
  rationale: « Comme chef » rend naturellement en français le complément attributif tout en maintenant la métaphore de la tête associée à l’autorité et à la prééminence.
- source_word: ὑπὲρ πάντα
  choice: au-dessus de tout
  rationale: Dans ce contexte, ὑπέρ indique une position de suprématie. « Au-dessus de tout » suit de près l’image spatiale du grec sans limiter la portée universelle.
- source_word: τῇ ἐκκλησίᾳ
  choice: à l’Église
  rationale: Le datif peut désigner le destinataire ou le bénéficiaire. « À l’Église » rend directement la construction avec « donner », tandis qu’une note signale la possibilité « pour l’Église ».
theological_decisions:
- issue: Rapport entre la suprématie du Christ sur toutes choses et son don à l’Église
  choice: Dieu donne à l’Église le Christ, qui est chef au-dessus de tout.
  alternative: Dieu établit le Christ chef au-dessus de tout pour le bien de l’Église.
  rationale: La syntaxe relie naturellement « chef » à « au-dessus de tout », tandis que le datif peut marquer soit le destinataire, soit le bénéficiaire. Le texte principal et la note préservent cette tension sans trancher au-delà du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Église » conserve le terme chrétien établi ; « chef » reste compréhensible tout en préservant la métaphore de κεφαλή. La ponctuation allégée respecte le mouvement de la phrase grecque.
