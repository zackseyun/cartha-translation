  yaml_path: translation/nt/ephesians/001/008.yaml
  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: fr
  text: qu’il a répandue en abondance sur nous, en toute sagesse et intelligence[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il a fait abonder envers nous ».'
    reason: Alternative lexicale plus littérale pour le sens causatif de ἐπερίσσευσεν et la direction exprimée par εἰς ἡμᾶς.
  - marker: b
    text: L’expression « en toute sagesse et intelligence » peut décrire soit la manière dont Dieu a répandu sa grâce, soit la sagesse et l’intelligence associées à ce qu’il a donné aux croyants.
    reason: Le rattachement syntaxique de l’expression est ambigu en grec.
lexical_decisions:
- source_word: ἧς
  choice: qu’… répandue
  rationale: Le pronom relatif au génitif renvoie à la grâce mentionnée au verset 7. La forme française « qu’… répandue » reprend naturellement cet antécédent féminin.
- source_word: ἐπερίσσευσεν
  choice: a répandue avec abondance
  rationale: 'Le verbe a ici un sens causatif et transitif : Dieu a fait abonder sa grâce en faveur des croyants. Cette formulation française exprime la surabondance sans lourdeur excessive.'
- source_word: εἰς ἡμᾶς
  choice: sur nous
  rationale: La préposition indique que la grâce abondante est dirigée vers ses bénéficiaires. « Sur nous » s’accorde naturellement avec le verbe « répandre ».
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: en toute sagesse et intelligence
  rationale: 'La traduction proche de la forme grecque conserve l’ambiguïté syntaxique : ces qualités peuvent caractériser la manière d’agir de Dieu ou être associées au don reçu par les croyants. « Intelligence » distingue φρόνησις de σοφία tout en restant naturel en français moderne.'
theological_decisions:
- issue: Rattachement de « en toute sagesse et intelligence »
  choice: La formulation reste syntaxiquement ouverte.
  alternative: Préciser soit que Dieu a répandu sa grâce avec sagesse et intelligence, soit que la grâce accordée apporte aux croyants sagesse et intelligence.
  rationale: Le grec permet les deux rattachements. Ne pas les départager préserve une ambiguïté réelle du texte sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Répandue sur nous avec abondance » conserve l’image de profusion et s’intègre au mouvement de la phrase commencée au verset précédent.
