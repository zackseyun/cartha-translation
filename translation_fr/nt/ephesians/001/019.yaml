id: EPH.1.19
reference: Ephesians 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: fr
  text: et quelle est l’incomparable grandeur de sa puissance envers nous qui croyons[a], conformément à l’action de la vigueur de sa force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en nous qui croyons ». Le grec dit littéralement « envers nous » ; « en nous » explicite davantage l’idée que la puissance de Dieu agit au-dedans des croyants.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον μέγεθος
  choice: l’incomparable grandeur
  rationale: Cette expression rend l’idée d’une grandeur qui dépasse toute comparaison, sans renforcer le grec jusqu’à « infinie » ou « incommensurable ».
- source_word: δύναμις
  choice: puissance
  rationale: « Puissance » est le terme français naturel pour la capacité effective de Dieu et permet de préserver l’accumulation des termes de force dans la proposition.
- source_word: εἰς ἡμᾶς
  choice: envers nous
  rationale: Ce choix conserve l’orientation exprimée par εἰς sans préciser indûment si cette puissance agit intérieurement en nous ou extérieurement en notre faveur.
- source_word: τοὺς πιστεύοντας
  choice: qui croyons
  rationale: La proposition relative rend naturellement en français le participe présent substantivé tout en conservant sa valeur verbale.
- source_word: κατά
  choice: conformément à
  rationale: 'Ici, κατά indique une correspondance ou une mesure : la puissance dirigée vers les croyants correspond à l’action puissante de Dieu.'
- source_word: ἐνέργεια
  choice: action
  rationale: « Action » exprime une activité effective sans les connotations modernes potentiellement trompeuses du mot « énergie ».
- source_word: κράτος
  choice: vigueur
  rationale: « Vigueur » désigne ici une force qui se manifeste et permet de distinguer κράτος de δύναμις et de ἰσχύς.
- source_word: ἰσχύς
  choice: force
  rationale: « Force » rend naturellement l’idée de puissance intrinsèque et maintient l’accumulation rhétorique des termes apparentés.
- source_word: καὶ τί
  choice: et quelle est
  rationale: Le verbe sous-entendu par la syntaxe de la phrase plus large est explicité pour obtenir un français clair.
theological_decisions:
- issue: Accumulation de δύναμις, ἐνέργεια, κράτος et ἰσχύς
  choice: 'Conserver quatre expressions liées mais distinctes : « puissance… action… vigueur… force »'
  alternative: Fondre l’ensemble dans une formule plus fluide telle que « toute l’efficacité de sa grande puissance »
  rationale: L’accumulation voulue par Paul souligne l’ampleur et l’efficacité de la puissance divine. La conserver évite de réduire sa force rhétorique ou d’attribuer à chaque mot une valeur théologique technique.
- issue: Orientation de la puissance divine dans εἰς ἡμᾶς
  choice: « envers nous qui croyons »
  alternative: « en nous qui croyons » ou « pour nous qui croyons »
  rationale: La préposition grecque est εἰς et non ἐν. « Envers nous » préserve le mouvement ou l’orientation sans trancher entre action intérieure et bienfait accordé.
translation_notes:
  register: Français international moderne, digne et lisible. La légère densité de « l’action de la vigueur de sa force » est maintenue afin de refléter l’accumulation rhétorique inhabituelle du grec plutôt que de l’aplanir.
