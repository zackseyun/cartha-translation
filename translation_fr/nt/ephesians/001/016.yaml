translation:
  language: fr
  text: Je ne cesse de rendre grâce pour vous et de faire mention de vous dans mes prières[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en me souvenant de vous dans mes prières ». L’expression grecque signifie littéralement « faire mention [de vous] dans mes prières ».'
