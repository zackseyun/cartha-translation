lexical_decisions:
- source_word: οὐ παύομαι
  choice: Je ne cesse
  rationale: Le présent exprime une action continue. « Je ne cesse » conserve le relief de la formulation grecque tout en restant naturel en français.
- source_word: εὐχαριστῶν
  choice: de rendre grâce
  rationale: Le participe présent dépend de « je ne cesse » et désigne l’action de remercier Dieu. « Rendre grâce » est une expression française courante, digne et explicite dans ce contexte.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Avec le génitif, ὑπέρ désigne ici les personnes au sujet desquelles ou en faveur desquelles Paul remercie Dieu. « Pour vous » préserve cette légère latitude sémantique.
- source_word: μνείαν ποιούμενος
  choice: de faire mention de vous
  rationale: L’expression grecque signifie littéralement « faire mention ». L’ajout de « vous », implicite dans le contexte, rend la phrase complète en français sans résoudre l’expression en simple souvenir intérieur.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: dans mes prières
  rationale: La préposition indique ici le cadre ou l’occasion où cette mention a lieu. « Dans mes prières » est la tournure française la plus naturelle.
