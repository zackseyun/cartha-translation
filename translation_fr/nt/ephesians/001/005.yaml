  rationale: 'Révision limitée à la syntaxe française : « à l’adoption comme fils par Jésus, le Messie » reflète plus directement la séquence εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ et clarifie que Jésus est le médiateur de l’adoption. Les notes existantes restent exactes, leurs ancres sont conservées, et la nuance disputée de εἰς αὐτόν n’est pas résolue au-delà de ce que permet le texte.'
