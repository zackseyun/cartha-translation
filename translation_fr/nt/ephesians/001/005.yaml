id: EPH.1.5
reference: Ephesians 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: fr
  text: Il nous a prédestinés à l’adoption comme fils par Jésus, le Messie, pour lui-même, selon le bon plaisir de sa volonté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προορίσας
  choice: Il nous a prédestinés
  rationale: « Prédestiner » rend directement l’idée de déterminer d’avance portée par προορίζω, sans atténuer un terme théologiquement disputé. Le participe aoriste est rendu par un verbe conjugué afin que le verset soit naturel en français, tout en restant lié au sujet divin du contexte.
- source_word: εἰς υἱοθεσίαν
  choice: à être adoptés comme ses fils
  rationale: Cette formulation exprime à la fois l’adoption et le statut filial et successoral contenu dans υἱοθεσία. Le masculin « fils » correspond à la forme grecque et désigne ici le statut accordé à tous les croyants, sans limiter son application aux hommes.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: Avec le génitif, διά indique ici le moyen ou l’intermédiaire. « Messie » traduit le titre Χριστός, tandis que l’article rend la tournure française idiomatique.
- source_word: εἰς αὐτόν
  choice: pour lui-même
  rationale: La formule présente Dieu comme la finalité de l’adoption. « Pour lui-même » restitue naturellement cette valeur finale, tout en signalant en note la nuance directionnelle possible.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: selon le bon plaisir
  rationale: κατά exprime la conformité, et εὐδοκία une volonté favorable, un agrément ou un bon plaisir. La formulation conserve la densité du grec sans transformer le terme en « dessein ».
- source_word: τοῦ θελήματος αὐτοῦ
  choice: de sa volonté
  rationale: Traduction directe du groupe génitif, qui préserve le sens ordinaire de θέλημα sans l’élargir en « projet » ou « dessein ».
theological_decisions:
- issue: Sens doctrinal de προορίσας
  choice: prédestinés
  alternative: destinés d’avance
  rationale: Le terme français traditionnel est lexicalement exact et maintient la force théologique du grec, sans préciser le mécanisme, les conditions ni l’étendue de cette prédestination.
- issue: Nuance genrée et juridique de υἱοθεσία
  choice: adoptés comme ses fils
  alternative: adoptés comme ses enfants
  rationale: « Fils » conserve la composante filiale masculine et la notion de statut successoral du terme grec. Le contexte n’autorise toutefois pas à réserver cette adoption aux croyants de sexe masculin.
- issue: Traduction du titre Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός est rendu comme un titre porteur de sens plutôt que comme un simple élément du nom.
- issue: Valeur de εἰς αὐτόν
  choice: pour lui-même
  alternative: vers lui
  rationale: La valeur finale est naturelle dans ce contexte, mais la préposition εἰς permet également de percevoir Dieu comme le but vers lequel conduit l’adoption; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale grecque est transformée en proposition verbale autonome pour la lisibilité du verset. Le vocabulaire théologique traditionnel n’est conservé que lorsqu’il rend précisément le grec; les notes explicitent les nuances juridiques, titulaires et prépositionnelles sans résoudre les tensions du texte.
