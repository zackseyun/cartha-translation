id: EPH.1.17
reference: Ephesians 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: fr
  text: pour que le Dieu de notre Seigneur Jésus le Messie[a], le Père de gloire[b], vous donne un esprit[c] de sagesse et de révélation dans la connaissance que vous avez de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « Jésus-Christ ». Le titre grec Χριστός signifie « Messie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le Père glorieux ». L’expression grecque signifie littéralement « le Père de gloire ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’Esprit de sagesse et de révélation ». Le grec πνεῦμα peut désigner soit un esprit ou une disposition accordés par Dieu, soit l’Esprit Saint.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: pour que
  rationale: Introduit ici le contenu et la visée de la prière commencée au verset précédent; « pour que » conserve naturellement la valeur subordonnante et finale en français.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: le Dieu de notre Seigneur
  rationale: Rend directement le groupe grec tout en conservant la relation théologique exprimée sans l’expliciter davantage.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre; « le Messie » en transmet le sens en français courant, tandis que la forme traditionnelle est signalée en note.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: le Père de gloire
  rationale: Conserve le génitif grec et sa densité sémantique au lieu de le réduire d’emblée à l’adjectif « glorieux ».
- source_word: δώῃ ὑμῖν
  choice: vous donne
  rationale: Après « pour que », le subjonctif français rend naturellement le subjonctif grec dans ce contexte de prière.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: un esprit de sagesse et de révélation
  rationale: La formulation sans article en grec permet d’entendre une disposition accordée par Dieu, sans exclure une référence à l’Esprit Saint; la note maintient cette ambiguïté.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: dans la connaissance de lui
  rationale: Reste proche de la construction grecque et préserve la relation exacte entre sagesse, révélation et connaissance, même si une formulation comme « pour mieux le connaître » serait plus fluide mais aussi plus interprétative.
theological_decisions:
- issue: πνεῦμα désigne-t-il une disposition spirituelle ou l’Esprit Saint?
  choice: un esprit de sagesse et de révélation
  alternative: l’Esprit de sagesse et de révélation
  rationale: L’absence d’article et la construction génitivale autorisent les deux compréhensions. Le texte principal ne tranche pas par une majuscule doctrinale, et la note conserve explicitement l’autre lecture.
- issue: Valeur de Χριστός dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le rendu principal traduit le titre grec plutôt que de le laisser sous sa forme traditionnelle devenue presque nominale; la note fournit cette forme traditionnelle.
- issue: Sens du génitif dans ὁ πατὴρ τῆς δόξης
  choice: le Père de gloire
  alternative: le Père glorieux
  rationale: Le génitif peut être compris de plusieurs manières. Le calque français, intelligible et solennel, évite de réduire cette richesse à une seule qualification adjectivale.
translation_notes:
  register: Français international moderne, digne et lisible. La structure subordonnée est maintenue parce que le verset poursuit la phrase et la prière du contexte précédent. « Père de gloire » et « dans la connaissance de lui » privilégient ici la proximité formelle afin de préserver les ambiguïtés réelles du grec.
