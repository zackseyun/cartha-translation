id: EPH.1.18
reference: Ephesians 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: fr
  text: les yeux de votre cœur ayant été éclairés, afin que vous sachiez quelle est l’espérance de son appel, quelle est la richesse de la gloire de son héritage parmi les saints[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son héritage dans les saints » ou « son héritage au milieu de son peuple saint ».'
    reason: La préposition grecque ἐν peut ici se comprendre comme « dans » ou « parmi », et « les saints » peut aussi se rendre par « son peuple saint ».
lexical_decisions:
- source_word: πεφωτισμένους
  choice: ayant été éclairés
  rationale: Le participe parfait passif exprime un éclairage reçu dont l’effet demeure. La tournure française conserve à la fois la voix passive et cette valeur résultative.
- source_word: ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: les yeux de votre cœur
  rationale: La métaphore paulinienne est conservée plutôt que réduite à « intelligence » ou « esprit ».
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: afin que vous sachiez
  rationale: Cette formulation française rend naturellement la valeur de but de la construction grecque.
- source_word: ἐλπὶς
  choice: espérance
  rationale: « Espérance » est le terme français courant dans ce contexte paulinien et désigne une attente confiante.
- source_word: κλήσεως αὐτοῦ
  choice: son appel
  rationale: La formulation concise préserve le vocabulaire paulinien sans expliciter indûment si le génitif met l’accent sur l’auteur ou le contenu de l’appel.
- source_word: πλοῦτος τῆς δόξης
  choice: richesse glorieuse
  rationale: Cette formulation naturelle rend l’abondance qualifiée par la gloire. La construction grecque plus littérale serait « richesse de la gloire ».
- source_word: κληρονομίας αὐτοῦ
  choice: son héritage
  rationale: 'Le possessif conserve l’ouverture du grec : il peut s’agir de l’héritage qui appartient à Dieu ou de celui qu’il accorde.'
- source_word: ἐν τοῖς ἁγίοις
  choice: parmi les saints
  rationale: « Parmi » rend naturellement la portée collective possible de ἐν, tandis que « saints » conserve le terme biblique sans le paraphraser dans le texte principal.
theological_decisions:
- issue: Le rapport entre Dieu, l’héritage et les saints
  choice: son héritage parmi les saints
  alternative: son héritage dans les saints ; son héritage au milieu de son peuple saint
  rationale: 'Le génitif αὐτοῦ et la préposition ἐν permettent plusieurs nuances : l’héritage peut être compris comme appartenant à Dieu, comme venant de lui, ou comme se trouvant dans ou parmi les saints. Le texte principal ne tranche pas cette tension.'
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore des « yeux du cœur » et la structure participiale sont maintenues afin de respecter l’image et l’aspect verbal du grec. La virgule finale signale que le verset se poursuit dans la phrase de Paul.
