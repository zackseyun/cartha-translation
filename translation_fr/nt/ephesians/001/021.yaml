id: EPH.1.21
reference: Ephesians 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: fr
  text: bien au-dessus de toute domination, de toute autorité, de toute puissance et de toute souveraineté[a], et de tout nom qui est nommé[b], non seulement dans l’âge présent, mais aussi dans l’âge à venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute principauté, de toute autorité, de toute puissance et de toute seigneurie ». Les termes grecs peuvent désigner des rangs ou des sphères d’autorité, notamment des puissances cosmiques ou spirituelles.
    reason: lexical_alternative
  - marker: b
    text: Ou « de tout titre qui est attribué ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: bien au-dessus
  rationale: Exprime naturellement en français l’élévation et la supériorité marquées par le terme grec.
- source_word: πάσης ἀρχῆς
  choice: toute domination
  rationale: Dans ce contexte, ἀρχή désigne une puissance dirigeante ou une sphère de gouvernement; « domination » garde la portée catégorielle sans préciser s’il s’agit d’êtres humains ou spirituels.
- source_word: ἐξουσίας
  choice: toute autorité
  rationale: Rend l’idée d’autorité exercée ou déléguée tout en restant distinct de δύναμις.
- source_word: δυνάμεως
  choice: toute puissance
  rationale: Équivalent français courant qui conserve la distinction avec l’autorité.
- source_word: κυριότητος
  choice: toute souveraineté
  rationale: Rend la notion de seigneurie ou de maîtrise comme catégorie d’autorité, sans employer une formulation artificielle.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: tout nom qui puisse être nommé
  rationale: Préserve la répétition rhétorique du grec et sa portée englobante; le modal français exprime ici naturellement tout nom susceptible d’être prononcé ou attribué, sans limiter le sens au seul titre.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: non seulement… mais aussi
  rationale: Correspondance française directe et idiomatique de la construction corrélative grecque.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: dans le temps présent
  rationale: αἰών désigne ici l’ordre temporel actuel par contraste avec celui qui vient; « temps » est clair pour le lectorat moderne et évite le sens spatial de « monde ».
- source_word: ἐν τῷ μέλλοντι
  choice: dans le temps à venir
  rationale: Rend explicitement l’ellipse grecque, où αἰών est sous-entendu, et maintient le contraste eschatologique.
theological_decisions:
- issue: Nature des réalités désignées par ἀρχή, ἐξουσία, δύναμις et κυριότης
  choice: Les rendre comme de larges catégories de domination et d’autorité, sans préciser dans le texte principal qu’elles sont humaines, angéliques ou cosmiques.
  alternative: Les identifier explicitement comme puissances cosmiques ou comme rangs angéliques.
  rationale: Le contexte peut viser notamment des puissances spirituelles ou cosmiques, mais le grec ne précise pas ici leur nature. La formulation retenue préserve cette amplitude et ne tranche pas une question que le verset laisse ouverte.
- issue: Portée de παντὸς ὀνόματος ὀνομαζομένου
  choice: Conserver l’idée englobante de tout nom susceptible d’être nommé.
  alternative: Interpréter explicitement « nom » comme « titre attribué ».
  rationale: « Nom » peut inclure un titre, un rang ou une dignité, mais le grec emploie le terme général ὄνομα. Le texte principal n’en réduit donc pas la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La série nominale conserve les distinctions du grec sans employer un vocabulaire excessivement technique. « Le temps présent… le temps à venir » communique clairement le contraste entre les deux âges.
