  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: fr
  text: Comme il nous a choisis en lui avant la fondation du monde, pour que nous soyons saints et irréprochables devant lui, dans l’amour.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « dans l’amour » peut aussi être rattachée au verset suivant : « Dans l’amour, il nous a destinés d’avance… »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sans défaut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: C’est ainsi que
  rationale: Rattache naturellement le choix divin à la bénédiction évoquée dans le contexte précédent, tout en conservant la valeur relationnelle de καθὼς.
- source_word: ἐξελέξατο
  choice: il nous a choisis
  rationale: Rend directement l’acte divin de choisir sans introduire les connotations systématiques que pourrait porter « élus » dans certains contextes confessionnels.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Conserve la formulation paulinienne compacte et son possible éventail relationnel, sans la développer en « en union avec lui ».
- source_word: πρὸ καταβολῆς κόσμου
  choice: avant la fondation du monde
  rationale: Équivalent français établi, proche de l’image grecque et clairement temporel.
- source_word: εἶναι ἡμᾶς
  choice: pour que nous soyons
  rationale: Exprime naturellement en français la visée du choix; la construction grecque peut aussi se rendre plus formellement par « afin d’être », mais cette formulation explicite clairement que « nous » est le sujet de l’infinitif.
- source_word: ἁγίους
  choice: saints
  rationale: Conserve les résonances morales et cultuelles du terme grec.
- source_word: ἀμώμους
  choice: irréprochables
  rationale: Rend idiomatiquement l’absence de défaut ou de reproche, tout en signalant en note l’image plus littérale.
- source_word: κατενώπιον αὐτοῦ
  choice: devant lui
  rationale: Traduction concise qui conserve l’idée de présence et de responsabilité devant Dieu.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: Maintient la phrase à sa place grecque, à la fin du verset, sans éliminer son rattachement syntaxique possible au verset suivant.
theological_decisions:
- issue: Portée doctrinale de ἐξελέξατο
  choice: il nous a choisis
  alternative: il nous a élus
  rationale: « Choisis » exprime fidèlement l’action divine sans importer à lui seul une formulation confessionnelle ultérieure.
- issue: Rattachement syntaxique de ἐν ἀγάπῃ
  choice: 'ponctuer avec le verset 4 : « devant lui, dans l’amour »'
  alternative: 'rattacher au verset 5 : « Dans son amour, il nous a destinés d’avance… »'
  rationale: Le grec permet les deux rattachements. Le texte principal respecte la position transmise de l’expression et la note préserve explicitement l’autre analyse.
- issue: Valeur de l’infinitif εἶναι
  choice: pour que nous soyons
  alternative: afin d’être
  rationale: La formulation retenue présente naturellement le contenu ou la visée du choix sans trancher plus précisément entre finalité et résultat.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la densité paulinienne tout en étant naturelle; la virgule avant « dans l’amour » rend lisible la phrase sans supprimer l’ambiguïté, explicitée en note.
