review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le choix, l’union « en lui », l’antériorité à la fondation du monde, ainsi que la visée d’être saints et irréprochables. Toutefois, « C’est ainsi que » affaiblit et réoriente légèrement la valeur comparative de καθὼς (« comme / de même que »).
  naturalness: Le français est globalement clair et moderne. « Comme il nous a choisis… » conserve ici la dépendance syntaxique avec la bénédiction du verset précédent, comme le fait le grec. La ponctuation avant « dans l’amour » permet de garder la position et l’ambiguïté de l’expression.
  terminology: « Choisis », « saints », « irréprochables », « devant lui » et « dans l’amour » sont fidèles et de registre approprié. La note d’alternative ne doit pas ajouter le possessif « son », absent de ἐν ἀγάπῃ.
  issues:
  - severity: medium
    issue: Rendu de καθὼς
    rationale: « C’est ainsi que » suggère plus naturellement une conséquence ou une manière (« de cette façon »), tandis que καθὼς introduit une comparaison/connexion avec la bénédiction du verset 3. « Comme » préserve cette valeur, même si la phrase demeure volontairement dépendante du contexte précédent.
  - severity: low
    issue: Possessif ajouté dans la note sur ἐν ἀγάπῃ
    rationale: La formulation « Dans son amour » interprète l’amour comme étant explicitement celui de Dieu. Le grec dit seulement « dans l’amour »; la note doit conserver cette absence de possessif.
