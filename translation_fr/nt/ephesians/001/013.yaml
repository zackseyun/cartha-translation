id: EPH.1.13
reference: Ephesians 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: fr
  text: En lui[a], vous aussi, après avoir entendu la parole de vérité, la bonne nouvelle[b] de votre salut, en lui, après avoir cru, vous avez été marqués du sceau de l’Esprit Saint promis[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en qui »; le pronom renvoie au Christ.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’Évangile de votre salut ».
    reason: lexical_alternative
  - marker: d
    text: Littéralement « l’Esprit Saint de la promesse »; c’est-à-dire l’Esprit que Dieu avait promis, ou l’Esprit associé à la promesse.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui / en lui
  rationale: Le relatif renvoie au Christ dans le contexte. « En lui » est naturel en français et conserve le thème paulinien de l’union avec le Christ; sa seconde occurrence est rattachée à « cru » sans effacer l’ambiguïté syntaxique.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Conserve la valeur additive de καί et l’inclusion des destinataires après le « nous » des versets précédents.
- source_word: ἀκούσαντες
  choice: après avoir entendu
  rationale: Rend la forme participiale aoriste comme antérieure au verbe principal, tout en restant idiomatique et sans construire un ordre doctrinal plus précis que le grec.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: la parole de vérité
  rationale: Traduction proche de l’expression grecque, intelligible en français actuel et attentive à ses échos pauliniens.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: la bonne nouvelle de votre salut
  rationale: « Bonne nouvelle » communique directement le sens de εὐαγγέλιον; « l’Évangile » est signalé en note comme équivalent traditionnel.
- source_word: πιστεύσαντες
  choice: après avoir cru
  rationale: Comme pour ἀκούσαντες, la formulation exprime naturellement une action antérieure au scellement, sans imposer une chronologie théologique détaillée.
- source_word: ἐσφραγίσθητε
  choice: vous avez été marqués du sceau
  rationale: Cette expression française rend clairement l’image du sceau, de l’identification et de l’authentification, avec un passif qui n’explicite pas l’agent sous-entendu.
- source_word: τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: du sceau de l’Esprit saint promis
  rationale: La formulation identifie l’Esprit comme la marque du scellement et rend naturellement le génitif condensé « de la promesse » comme « promis », tout en conservant en note une traduction plus formelle.
theological_decisions:
- issue: Rapport entre entendre, croire et être marqué du sceau
  choice: Les deux participes sont rendus par « après avoir », indiquant une antériorité naturelle par rapport au verbe principal.
  alternative: « quand vous avez entendu… quand vous avez cru » peut présenter ces actes comme plus étroitement concomitants.
  rationale: Les participes aoristes précédant le verbe fini suggèrent naturellement une séquence, mais le verset ne doit pas être chargé d’un système confessionnel concernant le moment exact du don de l’Esprit.
- issue: Fonction de la seconde expression ἐν ᾧ
  choice: « après avoir cru en lui »
  alternative: « en lui… vous avez été marqués du sceau »
  rationale: La proximité de πιστεύσαντες permet naturellement de comprendre « croire en lui », tandis que la répétition de ἐν ᾧ peut aussi encadrer toute l’action dans le Christ. Une note préserve cette portée possible.
- issue: Sens de « l’Esprit de la promesse »
  choice: « l’Esprit saint promis »
  alternative: « l’Esprit saint de la promesse »
  rationale: Le grec est condensé et peut désigner l’Esprit que Dieu avait promis ou l’Esprit associé à la promesse. Le texte principal emploie le français le plus naturel, et la note garde la forme génitivale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la longue progression paulinienne tout en recourant à une syntaxe française fluide. « Esprit saint » suit l’usage typographique courant avec une minuscule à l’adjectif.
