  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: fr
  text: afin que nous qui avons auparavant espéré dans le Messie soyons à la louange de sa gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que nous qui avons été les premiers à espérer dans le Messie soyons à la louange de sa gloire ».'
