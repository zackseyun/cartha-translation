  verdict: revise
  source_fidelity: Le sens téléologique de εἰς τὸ εἶναι et la formule εἰς ἔπαινον δόξης αὐτοῦ sont conservés. Toutefois, « servions à la louange » remplace l’idée explicite d’« être » par celle de « servir », et « qui avions d’avance placé notre espérance » emploie un plus-que-parfait sans repère passé explicite tout en alourdissant le participe grec. « avons auparavant espéré » rend sobrement l’antériorité du parfait προηλπικότας sans imposer l’identification du groupe.
  naturalness: « Afin que nous qui avons auparavant espéré dans le Messie soyons à la louange de sa gloire » relève d’un registre biblique soutenu, mais reste naturel et intelligible en français international moderne. L’absence de virgules présente la relative comme définissant le « nous », conformément à la fonction du participe dans la phrase.
  terminology: « Messie » respecte le rendu titulaire de Χριστός adopté par le projet. « Espérer dans le Messie », « louange » et « gloire » maintiennent les termes théologiques sans paraphrase doctrinale.
  issues:
  - severity: medium
    issue: « servions à la louange » atténue le verbe εἶναι.
    rationale: Le grec exprime que le groupe « soit » pour/à la louange de la gloire de Dieu. « Servir à » est idiomatique, mais introduit une action de service qui n’est pas formulée dans le texte source.
  - severity: medium
    issue: Le plus-que-parfait « avions d’avance placé » est temporellement et stylistiquement moins approprié.
    rationale: Le parfait προηλπικότας exprime une espérance antérieure avec portée présente. Sans point de référence narratif, le plus-que-parfait français est moins net. « Avons auparavant espéré » préserve l’antériorité sans surinterpréter le préfixe προ-.
  - severity: low
    issue: Les virgules autour de la relative affaiblissent sa valeur identificatrice.
    rationale: τοὺς προηλπικότας caractérise le « nous » visé. Une relative sans virgules rend mieux cette fonction, sans trancher l’identité historique précise de ce groupe.
