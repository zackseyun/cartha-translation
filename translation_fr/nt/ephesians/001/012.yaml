lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: afin que … servions
  rationale: La préposition εἰς avec l’infinitif articulé exprime ici le but ou le résultat. La tournure française « afin que » restitue naturellement cette visée; « servions à » évite le calque peu idiomatique « soyons pour ».
- source_word: ἡμᾶς
  choice: nous
  rationale: Le pronom est à l’accusatif comme sujet de l’infinitif grec; la restructuration en proposition française exige « nous » comme sujet.
- source_word: εἰς ἔπαινον
  choice: à la louange
  rationale: Cette formule récurrente d’Éphésiens indique la finalité. « Servir à la louange » est naturel, digne et conserve le lien avec ἔπαινος.
- source_word: δόξης αὐτοῦ
  choice: de sa gloire
  rationale: Le génitif est conservé directement. « Gloire » maintient la portée théologique du terme sans l’expliciter abusivement.
- source_word: τοὺς προηλπικότας
  choice: qui avions d’avance placé notre espérance
  rationale: Le participe parfait de προελπίζω exprime une espérance antérieure dont l’effet demeure. « D’avance » préserve la valeur du préfixe προ- sans décider si le groupe fut chronologiquement le tout premier à espérer.
- source_word: ἐν τῷ Χριστῷ
  choice: dans le Messie
  rationale: Χριστός est rendu comme un titre. Avec « placer son espérance », « dans le Messie » exprime naturellement l’objet et le centre de cette espérance tout en gardant la formulation paulinienne.
theological_decisions:
- issue: Le participe προηλπικότας désigne-t-il simplement ceux qui avaient espéré auparavant, ou ceux qui furent les premiers à espérer?
  choice: Traduire prudemment « qui avions d’avance placé notre espérance » dans le texte principal.
  alternative: « qui avons été les premiers à espérer dans le Messie »
  rationale: Le préfixe προ- marque l’antériorité, mais ne tranche pas à lui seul entre une espérance préalable et la priorité d’un groupe, souvent compris comme les croyants juifs. La traduction principale maintient cette tension; la lecture plus précise figure en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La proposition relative est ponctuée comme une précision descriptive du « nous », tandis que la note conserve la possibilité d’une identification plus nettement distinctive. « Servir à la louange » privilégie l’idiome français sans affaiblir la relation de but ou de résultat.
