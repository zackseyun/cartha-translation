  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: fr
  text: à la louange de la gloire de sa grâce, dont il nous a gratifiés[a] dans le Bien-aimé[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il nous a généreusement accordée » ou « par laquelle il nous a accordé sa faveur ». Le verbe grec est apparenté au mot traduit par « grâce » et exprime l’action favorable de Dieu envers nous.
    reason: alternative_lexicale
  - marker: b
    text: « Le Bien-aimé » désigne le Fils, c’est-à-dire le Messie.
    reason: référence_christologique
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: à la louange
  rationale: Cette tournure française naturelle exprime le but ou le résultat marqué par εἰς et conserve le caractère doxologique de l’expression.
- source_word: δόξης
  choice: de la gloire
  rationale: « Gloire » est le correspondant usuel de δόξα dans ce contexte paulinien et en préserve la portée théologique.
- source_word: τῆς χάριτος αὐτοῦ
  choice: de sa grâce
  rationale: « Grâce » rend le sens salvifique de χάρις et permet de faire entendre, autant que possible en français, son lien avec le verbe apparenté qui suit.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: dont il nous a comblés
  rationale: « Combler quelqu’un de » rend naturellement l’action bienveillante exprimée par χαριτόω; « dont » renvoie explicitement à la grâce, sans réduire celle-ci au seul pardon.
- source_word: ἐν
  choice: dans
  rationale: Le sens fondamental de ἐν est conservé, laissant ouvertes les nuances de sphère, d’union ou de médiation présentes dans l’expression.
- source_word: τῷ ἠγαπημένῳ
  choice: le Bien-aimé
  rationale: Le participe substantivé fonctionne ici comme un titre désignant le Christ. « Le Bien-aimé » conserve cette forme sans ajouter « Fils », absent du verset.
theological_decisions:
- issue: Lien entre χάρις et χαριτόω
  choice: sa grâce, dont il nous a comblés
  alternative: sa grâce, par laquelle il nous a accordé sa faveur / sa grâce qu’il nous a accordée
  rationale: Le français ne permet pas de reproduire sans lourdeur la parenté lexicale grecque. La reprise pronominale par « dont » rattache clairement l’action divine à la grâce, tandis que « comblés » exprime le don bienveillant sans limiter la grâce au pardon.
- issue: Portée christologique de τῷ ἠγαπημένῳ
  choice: dans le Bien-aimé
  alternative: dans son Fils bien-aimé / en celui qu’il aime
  rationale: Le référent est le Christ, mais le grec emploie un participe substantivé plutôt que le mot « Fils ». La traduction conserve donc le titre et n’explicite pas dans le corps du texte ce que celui-ci laisse implicite.
- issue: Nuance de ἐν devant le titre christologique
  choice: dans le Bien-aimé
  alternative: par le Bien-aimé / en union avec le Bien-aimé
  rationale: « Dans » préserve la formulation grecque et sa richesse théologique sans trancher entre sphère, union et moyen.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « dont il nous a comblés » reste idiomatique tout en maintenant le lien étroit entre la grâce et l’action gracieuse de Dieu. La virgule finale est conservée parce que le verset appartient à une phrase plus longue.
