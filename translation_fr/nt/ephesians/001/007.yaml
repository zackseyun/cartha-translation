  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: fr
  text: En lui, nous avons la rédemption par son sang, le pardon des fautes, selon la richesse de sa grâce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui
  rationale: Le pronom relatif renvoie au Bien-Aimé du verset précédent. « En lui » est naturel en français moderne et conserve le sens d’union ou de relation au Christ.
- source_word: ἔχομεν
  choice: nous avons
  rationale: Le présent de l’indicatif exprime une réalité actuelle; cette formulation est directe et idiomatique.
- source_word: ἀπολύτρωσιν
  choice: la rédemption
  rationale: Le terme désigne une libération obtenue à grand prix. « Rédemption » en préserve la portée lexicale et théologique.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: par son sang
  rationale: διά avec le génitif indique ici le moyen. La formulation conserve l’image concrète, sacrificielle et covenantale du sang sans la remplacer par une interprétation comme « sa mort ».
- source_word: ἄφεσιν
  choice: le pardon
  rationale: Dans ce contexte, le terme désigne la remise des fautes. « Pardon » est clair, actuel et convient au complément qui suit.
- source_word: παραπτωμάτων
  choice: de nos fautes
  rationale: παράπτωμα désigne des actes fautifs ou des offenses. « Fautes » est naturel en français international; le possessif explicite le rapport déjà porté par « nous » sans modifier le référent.
- source_word: κατὰ τὸ πλοῦτος
  choice: selon la richesse
  rationale: κατά avec l’accusatif exprime ici la norme ou la mesure. Le singulier « richesse » suit la forme grecque attestée et évoque l’abondance de la grâce.
- source_word: χάριτος
  choice: de sa grâce
  rationale: « Grâce » conserve le terme paulinien central qui désigne la faveur généreuse de Dieu.
theological_decisions:
- issue: Rapport entre « la rédemption » et « le pardon de nos fautes »
  choice: Maintien de l’apposition sans ajout explicatif
  alternative: « la rédemption, c’est-à-dire le pardon de nos fautes »
  rationale: Le second groupe nominal explique naturellement le premier, mais le grec n’emploie pas de formule équivalant à « c’est-à-dire ». L’apposition préserve donc sa concision et une légère ouverture quant au rapport exact.
- issue: Langage de l’expiation dans « par son sang »
  choice: Conservation de l’expression concrète « par son sang »
  alternative: « par sa mort » ou « par sa mort sacrificielle »
  rationale: Le texte mentionne explicitement le sang. Le remplacer par « mort » atténuerait l’imagerie sacrificielle et introduirait une paraphrase interprétative.
translation_notes:
  register: Français moderne, international et digne. Syntaxe proche du grec tout en restant naturelle. Aucun marqueur de note n’est nécessaire, car aucune variante française importante ne demande ici d’être signalée.
