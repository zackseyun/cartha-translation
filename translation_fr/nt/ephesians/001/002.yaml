id: EPH.1.2
reference: Ephesians 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: fr
  text: Grâce et paix à vous de la part de Dieu notre Père et du Seigneur Jésus, le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ». Le grec Χριστός peut fonctionner comme le titre « Messie » ou, dans certains contextes, comme une désignation proche d’un nom propre, « Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: la grâce
  rationale: Dans la salutation paulinienne, le terme désigne à la fois une faveur accordée par Dieu et une bénédiction; « grâce » en conserve la portée sans paraphrase.
- source_word: ὑμῖν
  choice: vous soient données
  rationale: Le datif indique les destinataires. La formulation optative française rend naturellement la bénédiction exprimée par la phrase nominale grecque.
- source_word: εἰρήνη
  choice: la paix
  rationale: Ce choix conserve le sens courant du mot ainsi que son arrière-plan probable de shalom dans une salutation juive.
- source_word: ἀπὸ
  choice: de la part de
  rationale: La préposition indique ici la source de la grâce et de la paix; cette tournure est naturelle dans une salutation française et porte sur Dieu le Père comme sur le Seigneur Jésus.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Dieu notre Père
  rationale: La séquence est comprise comme une apposition, « Dieu, qui est notre Père », sans ajouter une conjonction absente du grec.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » rend la force du titre christologique de κύριος dans ce contexte.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: « Messie » traduit le titre Χριστός et en rend le sens perceptible; l’article et la virgule sont requis par une expression française naturelle, bien qu’ils ne correspondent pas à des éléments distincts du grec.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: Χριστός peut encore être entendu comme le titre « Messie », tout en ayant dans certaines expressions une fonction proche de celle d’un nom. Le texte retient le sens du titre et signale l’autre rendu courant en note.
- issue: Source commune de la grâce et de la paix
  choice: « de la part de » régit à la fois Dieu notre Père et le Seigneur Jésus
  alternative: Répéter « de la part de » devant le Seigneur Jésus
  rationale: Une seule occurrence de ἀπό introduit les deux termes coordonnés. Le français permet de conserver cette structure et l’association étroite des deux sources nommées.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase verbale avec « Que… soient données » explicite naturellement en français la valeur de bénédiction de la construction nominale grecque, sans modifier son contenu. « De la part de » évite l’ambiguïté peu naturelle de « venant de » tout en marquant clairement la source.
