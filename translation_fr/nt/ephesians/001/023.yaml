translation:
  language: fr
  text: qui est son corps, la plénitude de celui qui remplit tout en tous[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « qui remplit toutes choses en tous ».'
    reason: lexical_alternative
  - marker: b
    text: Le participe grec peut aussi être compris comme « celui qui est rempli », bien que la plupart des interprètes lui donnent ici le sens de « celui qui remplit ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: qui
  rationale: Le pronom relatif renvoie à « l’Église » au verset 22. « Qui » est naturel en français et évite de surcharger la nuance qualitative possible de ἥτις.
- source_word: τὸ σῶμα αὐτοῦ
  choice: son corps
  rationale: Traduction directe de la métaphore paulinienne qui décrit la relation entre l’Église et le Messie.
- source_word: τὸ πλήρωμα
  choice: la plénitude
  rationale: Ce terme conserve la densité et l’ambiguïté de πλήρωμα, sans décider si l’Église est ce qui est rempli ou ce qui constitue en un sens un complément.
- source_word: τοῦ ... πληρουμένου
  choice: de celui qui remplit
  rationale: Bien que le participe soit morphologiquement moyen/passif, le sens actif ou déponent « qui remplit » convient le mieux au contexte. La lecture passive possible est signalée en note.
- source_word: τὰ πάντα
  choice: tout
  rationale: « Tout » rend naturellement en français l’expression neutre plurielle de portée universelle.
- source_word: ἐν πᾶσιν
  choice: en tous
  rationale: Cette formulation proche du grec préserve l’ambiguïté entre une référence aux êtres, aux réalités ou à une totalité plus générale, plutôt que de la réduire à « de toute manière ».
theological_decisions:
- issue: Sens de πλήρωμα dans la relation entre l’Église et le Messie
  choice: Conserver « la plénitude » sans expliciter davantage la relation.
  alternative: « ce qui est rempli » ou « le complément »
  rationale: Le grec permet plusieurs compréhensions proches. Une traduction interprétative fermerait prématurément la tension théologique du texte.
- issue: Valeur du participe πληρουμένου
  choice: Adopter le sens actif « celui qui remplit ».
  alternative: « celui qui est rempli »
  rationale: Le contexte favorise nettement le sens actif, mais la morphologie permet une lecture passive qui mérite d’être conservée en note.
- issue: Portée de ἐν πᾶσιν
  choice: Traduire par « en tous ».
  alternative: « de toute manière » ou « en tout »
  rationale: « En tous » reflète étroitement l’expression grecque et en maintient la formulation dense et ouverte.
translation_notes:
  register: Français moderne, digne et concis. « La plénitude » maintient le vocabulaire théologiquement dense du grec. L’expression « tout en tous » est volontairement formelle afin de préserver l’ambiguïté de la formule originale.
