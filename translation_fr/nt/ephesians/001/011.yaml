id: EPH.1.11
reference: Ephesians 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: fr
  text: En lui, nous avons aussi été faits son héritage[a], ayant été prédestinés selon le projet de celui qui accomplit toutes choses selon le dessein de sa volonté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous avons aussi reçu un héritage ». Le verbe grec peut signifier soit recevoir un héritage, soit être attribués à Dieu pour devenir son bien propre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui
  rationale: Le pronom relatif renvoie au Christ dans le contexte précédent. « En lui » est naturel en français et conserve l’idée d’union avec le Christ.
- source_word: ἐκληρώθημεν
  choice: nous avons aussi été faits héritage
  rationale: Le passif peut décrire les croyants comme le peuple attribué à Dieu, son héritage. Comme le verbe peut aussi signifier qu’ils ont reçu un héritage, cette autre lecture est conservée en note.
- source_word: προορισθέντες
  choice: ayant été prédestinés
  rationale: Le participe exprime une détermination préalable. « Prédestinés » en garde directement la force sans développer un système théologique au-delà du texte.
- source_word: κατὰ πρόθεσιν
  choice: selon le projet
  rationale: πρόθεσις désigne ici une intention arrêtée ou un dessein. « Projet » est actuel, digne et naturel.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: de celui qui accomplit toutes choses
  rationale: « Accomplit » rend clairement l’action efficace exprimée par ἐνεργέω, tandis que « toutes choses » en conserve la portée générale.
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: selon la décision de sa volonté
  rationale: βουλή évoque une résolution réfléchie. « Décision » restitue cette nuance en français moderne, et « de sa volonté » préserve le rapport génitif avec θέλημα.
theological_decisions:
- issue: Sens de ἐκληρώθημεν
  choice: Les croyants ont été faits héritage, c’est-à-dire attribués à Dieu comme son peuple.
  alternative: Les croyants ont reçu un héritage.
  rationale: La forme passive et l’arrière-plan biblique du peuple de Dieu comme son héritage appuient la lecture retenue, mais le grec permet réellement l’autre compréhension; la note préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe participiale est maintenue afin de préserver le lien logique avec la prédestination, et l’ambiguïté principale du verbe ἐκληρώθημεν est explicitement conservée en note.
