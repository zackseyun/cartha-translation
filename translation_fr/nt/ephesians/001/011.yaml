review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement la construction principale : l’union au Christ, le passif de ἐκληρώθημεν, la prédestination, le dessein divin et l’action universelle de Dieu. La note conserve à juste titre l’autre sens possible de ἐκληρώθημεν. « Décision » est cependant un peu réducteur pour βουλή, qui comporte l’idée d’un dessein ou d’une résolution délibérée.'
  naturalness: « Nous avons aussi été faits héritage » est peu idiomatique en français moderne, notamment sans complément qui indique de qui les croyants sont l’héritage. « Nous avons aussi été faits son héritage » est plus naturel tout en conservant le passif et la lecture principale.
  terminology: « Prédestinés », « projet », « accomplit toutes choses » et « volonté » conviennent au registre. « Dessein de sa volonté » exprime plus adéquatement βουλὴ τοῦ θελήματος αὐτοῦ que « décision de sa volonté » et évite une formulation française quelque peu lourde.
  issues:
  - severity: medium
    issue: Formulation elliptique de « faits héritage »
    rationale: En français, « être fait héritage » sans possessif est inhabituel et laisse l’expression inachevée. Le possessif « son » rend explicite, conformément au contexte et à la lecture retenue, que les croyants sont l’héritage de Dieu, sans supprimer l’alternative en note.
  - severity: low
    issue: « Décision » pour βουλή
    rationale: Le mot est possible, mais « dessein » préserve mieux la nuance de résolution réfléchie et s’intègre plus naturellement avec « de sa volonté ».
  revised_text: En lui, nous avons aussi été faits son héritage[a], ayant été prédestinés selon le projet de celui qui accomplit toutes choses selon le dessein de sa volonté.
