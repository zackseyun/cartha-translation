- from: En lui, nous avons aussi été faits héritage[a], ayant été prédestinés selon le projet de celui qui accomplit toutes choses selon la décision de sa volonté.
  to: En lui, nous avons aussi été faits son héritage[a], ayant été prédestinés selon le projet de celui qui accomplit toutes choses selon le dessein de sa volonté.
  rationale: La révision améliore l’idiomaticité de la lecture principale de ἐκληρώθημεν en indiquant que les croyants sont l’héritage de Dieu, tout en maintenant l’ambiguïté lexicale par la note. « Dessein » rend plus précisément βουλή dans l’expression finale.
