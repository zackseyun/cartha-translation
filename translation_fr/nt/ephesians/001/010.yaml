id: EPH.1.10
reference: Ephesians 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: fr
  text: pour l’administration de la plénitude des temps, afin de réunir toutes choses dans le Messie[a] — celles qui sont dans les cieux et celles qui sont sur la terre — en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « récapituler toutes choses dans le Messie » ; ou « réunir toutes choses sous une seule tête dans le Messie ». Le verbe grec peut évoquer l’idée de récapituler ou de rassembler sous une tête.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: mise en œuvre
  rationale: Dans ce contexte, le nom désigne l’exécution ordonnée du dessein divin. « Mise en œuvre » est plus naturel en français actuel que « administration », tout en évitant de réduire le terme au seul « plan ».
- source_word: πληρώματος τῶν καιρῶν
  choice: à l’accomplissement des temps
  rationale: Cette formulation rend la pleine mesure de périodes déterminées arrivée à son terme. Elle communique mieux en français le sens temporel de πληρώματος que le calque peu naturel « plénitude des temps ».
- source_word: ἀνακεφαλαιώσασθαι
  choice: réunir
  rationale: Le verbe peut exprimer l’idée de récapituler, de rassembler en un tout ou de réunir sous une tête. « Réunir » offre un texte principal clair sans trancher entièrement entre les nuances, que la note explicite.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Le neutre pluriel articulé a ici une portée cosmique et globale, convenablement conservée par la tournure française traditionnelle mais toujours intelligible.
- source_word: ἐν τῷ Χριστῷ
  choice: dans le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en exprime le sens plutôt que de le traiter simplement comme un nom propre.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: celles qui sont dans les cieux
  rationale: La formulation conserve le pluriel grec et la localisation dans le domaine céleste.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: celles qui sont sur la terre
  rationale: La traduction rend directement la localisation terrestre, en contraste avec les cieux.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le pronom renvoie naturellement au Messie. La reprise finale est maintenue afin de conserver l’insistance du grec.
theological_decisions:
- issue: Valeur de Χριστῷ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme garde ici sa force de titre messianique; « le Messie » la rend explicitement sans ajouter de contenu confessionnel.
- issue: Sens de ἀνακεφαλαιώσασθαι
  choice: réunir toutes choses
  alternative: récapituler toutes choses; réunir toutes choses sous une seule tête
  rationale: Le verbe associe potentiellement l’idée de rassemblement en un tout et celle d’une tête qui ordonne l’ensemble. Le texte principal reste naturel, tandis que la note préserve cette tension lexicale et théologique.
- issue: Rapport entre οἰκονομία et πλήρωμα τῶν καιρῶν
  choice: mise en œuvre prévue à l’accomplissement des temps
  alternative: administration de la plénitude des temps
  rationale: La formulation choisie comprend l’expression comme la réalisation ordonnée du dessein divin au moment où les temps atteignent leur pleine mesure, sans transformer explicitement οἰκονομία en « plan ».
translation_notes:
  register: Français international actuel, digne et accessible. Le deux-points clarifie que l’infinitif grec expose le contenu ou le but de la mise en œuvre. La répétition finale « en lui » est conservée malgré sa légère redondance en français, car elle porte l’insistance du texte source.
