  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: fr
  text: Enfin[a], soyez fortifiés dans le Seigneur et dans la force de sa puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour le reste » ou « Désormais ». L’expression grecque introduit la conclusion de la lettre. Le verbe peut aussi se traduire plus idiomatiquement : « fortifiez-vous dans le Seigneur », mais « soyez fortifiés » en conserve la nuance passive.'
    reason: alternative_translation
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Enfin
  rationale: Marque naturellement en français l’introduction de la dernière grande section de la lettre, tout en reflétant la valeur transitionnelle de l’expression grecque.
- source_word: ἐνδυναμοῦσθε
  choice: fortifiez-vous
  rationale: Cette formulation française naturelle peut exprimer l’exhortation à recevoir sa force du Seigneur dans le contexte, sans suggérer nécessairement une force produite de manière autonome. Une note signale la traduction passive plus explicite.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Conserve le langage paulinien de sphère et de relation exprimé par ἐν, sans préciser indûment un sens instrumental comme « par le Seigneur ».
- source_word: κράτει
  choice: puissance
  rationale: κράτος désigne ici une puissance effective ou déployée. « Puissance » permet de conserver l’accumulation emphatique des termes grecs tout en les distinguant.
- source_word: ἰσχύος
  choice: force
  rationale: ἰσχύς évoque la force ou la vigueur. Le syntagme « la puissance de sa force » reste intelligible et reproduit la formulation intensifiée du grec.
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif renvoie naturellement au Seigneur mentionné juste avant, sans répétition inutile.
theological_decisions:
- issue: Voix et source de la force dans ἐνδυναμοῦσθε
  choice: « fortifiez-vous », compris dans le contexte comme une exhortation à puiser ou recevoir sa force dans le Seigneur
  alternative: « soyez fortifiés »
  rationale: La forme grecque peut être analysée comme passive ou moyenne. La traduction principale privilégie un français actuel et idiomatique, tandis que la note préserve explicitement la nuance passive et la dépendance envers le Seigneur.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est l’équivalent normal dans ce contexte paulinien et renvoie naturellement au Christ exalté, sans ajout interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. « Fortifiez-vous » est plus naturel que « soyez fortifiés » dans une exhortation, tandis que « la puissance de sa force » conserve volontairement l’accumulation solennelle des termes de puissance du grec.
