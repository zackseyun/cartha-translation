source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: fr
  text: 'En toute circonstance[a], prenez le bouclier de la foi : avec lui, vous pourrez éteindre toutes les flèches enflammées[b] du Mauvais[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « en toutes choses ».'
    reason: alternative_reading
  - marker: b
    text: 'Le mot grec désigne plus généralement des projectiles ; traduction traditionnelle : « traits enflammés ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « du mal » ; le grec peut être compris soit personnellement, soit abstraitement.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: En toute circonstance
  rationale: 'L’expression est comprise ici dans un sens adverbial adapté à la série d’exhortations : la foi doit être saisie comme protection en toute situation. La formulation française est naturelle sans effacer les autres analyses possibles.'
- source_word: ἀναλαβόντες
  choice: prenez
  rationale: Le participe aoriste exprime une action qui accompagne l’exhortation précédente. L’impératif français restitue clairement cette valeur d’action associée dans le contexte, sans lourdeur syntaxique.
- source_word: θυρεὸν
  choice: bouclier
  rationale: θυρεός désigne un bouclier, notamment un grand bouclier de protection. Le terme français courant suffit à préserver l’image militaire sans explicitation excessive.
- source_word: τῆς πίστεως
  choice: de la foi
  rationale: Le génitif qualifie métaphoriquement le bouclier. « Foi » demeure le choix le plus direct pour πίστις dans ce contexte de confiance défensive en Dieu.
- source_word: ἐν ᾧ
  choice: avec lui
  rationale: Le pronom renvoie au bouclier et la préposition a une valeur instrumentale. « Avec lui » est idiomatique en français et exprime clairement le moyen.
- source_word: δυνήσεσθε
  choice: vous pourrez
  rationale: Le futur grec exprime la capacité à venir. « Vous pourrez » en conserve à la fois le temps et la nuance.
- source_word: βέλη
  choice: flèches
  rationale: βέλη est un terme général pour des projectiles, mais « flèches » rend immédiatement intelligible l’image antique en français moderne. La portée plus générale du grec est signalée en note.
- source_word: τοῦ πονηροῦ
  choice: du Mauvais
  rationale: L’adjectif substantivé avec article se comprend probablement comme une désignation personnelle dans ce contexte de combat spirituel. La majuscule rend cette lecture visible sans nommer davantage le personnage.
- source_word: πεπυρωμένα
  choice: enflammées
  rationale: Le participe parfait passif signifie que les projectiles ont été mis en feu. « Enflammées » conserve l’image de manière concise et naturelle.
- source_word: σβέσαι
  choice: éteindre
  rationale: Le verbe désigne l’action d’éteindre un feu. Le français « éteindre » est courant et s’accorde directement avec les flèches enflammées.
theological_decisions:
- issue: Sens de τοῦ πονηροῦ
  choice: du Mauvais
  alternative: du mal
  rationale: Le cadre du combat spirituel et des attaques hostiles favorise la lecture personnelle, mais la forme grecque peut aussi recevoir un sens abstrait. Cette ambiguïté réelle est conservée en note.
- issue: Sens de πίστις
  choice: la foi
  alternative: la confiance ; la fidélité
  rationale: Dans cette métaphore, « foi » exprime adéquatement l’attitude par laquelle le croyant s’appuie sur Dieu. « Confiance » expliciterait un aspect du sens, tandis que « fidélité » est lexicalement possible, mais aucune de ces options ne s’impose ici au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image militaire et la force exhortative du passage. Le deux-points rend explicite le lien instrumental entre le bouclier et l’action d’éteindre, sans ajouter de contenu théologique.
