id: EPH.6.13
reference: Ephesians 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: fr
  text: C’est pourquoi, prenez l’armure complète de Dieu[a], afin de pouvoir résister au jour mauvais[b] et, après avoir tout accompli[c], tenir ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’armure de Dieu ». Le terme grec désigne tout l’équipement d’un soldat.
    reason: lexical_alternative
  - marker: b
    text: Le « jour mauvais » peut désigner de manière générale un temps d’épreuve ou d’intense opposition du mal, sans nécessairement se limiter à un événement précis de la fin des temps.
    reason: alternative_reading
  - marker: c
    text: Ou « après avoir tout fait » ou « après avoir tout mené à bien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de l’exhortation précédente.
- source_word: ἀναλάβετε
  choice: prenez
  rationale: L’impératif signifie prendre ou saisir l’équipement; « prenez » est naturel et convient à l’image militaire sans confondre ce verbe avec « revêtir ».
- source_word: τὴν πανοπλίαν
  choice: toute l’armure
  rationale: πανοπλία désigne l’équipement complet du soldat; la tournure française exprime clairement cette totalité.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: 'Le génitif reste volontairement ouvert: l’armure peut être comprise comme appartenant à Dieu, venant de lui ou étant fournie par lui.'
- source_word: ἵνα δυνηθῆτε
  choice: afin de pouvoir
  rationale: Rend à la fois le but introduit par ἵνα et la capacité exprimée par δύναμαι.
- source_word: ἀντιστῆναι
  choice: résister
  rationale: Dans ce contexte militaire, le verbe exprime l’opposition et le maintien face à l’attaque.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: au jour mauvais
  rationale: Formulation solennelle et concise qui conserve le caractère ouvert de l’expression grecque.
- source_word: ἅπαντα κατεργασάμενοι
  choice: après avoir tout accompli
  rationale: Le participe peut évoquer le fait d’accomplir, de mener à bien ou d’exécuter tout ce qui est requis; cette traduction conserve cette amplitude sans affirmer explicitement une victoire.
- source_word: στῆναι
  choice: tenir ferme
  rationale: Dans l’image militaire, στῆναι évoque le fait de rester debout et de garder sa position; « tenir ferme » restitue naturellement cette force en français.
theological_decisions:
- issue: Sens du « jour mauvais »
  choice: Une période d’épreuve ou d’intense opposition du mal, laissée générale
  alternative: Un jour eschatologique précis
  rationale: L’expression grecque n’impose pas à elle seule un unique événement de la fin des temps; la traduction en préserve l’ouverture.
- issue: Valeur du génitif dans « l’armure de Dieu »
  choice: Conserver la formulation large « de Dieu »
  alternative: « l’armure fournie par Dieu » ou « l’armure appartenant à Dieu »
  rationale: Le génitif grec permet plusieurs nuances connexes qu’une paraphrase plus précise trancherait indûment.
- issue: Portée de κατεργασάμενοι
  choice: « après avoir tout accompli » sans préciser victoire ou simple préparation
  alternative: « après avoir tout surmonté »
  rationale: Le verbe peut signifier accomplir ou mener à bien; « surmonter » introduirait une idée explicite de victoire qui n’est pas certaine ici.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’image militaire, la solennité de « jour mauvais » et les ambiguïtés du génitif « de Dieu » et du participe κατεργασάμενοι.
