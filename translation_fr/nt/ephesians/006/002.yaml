  text: τίμα τὸν πατέρα σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: fr
  text: « Honore ton père et ta mère » — c’est le premier commandement assorti d’une promesse[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le premier commandement dans une promesse » ; le sens semble être qu’il s’agit du premier commandement accompagné d’une promesse.'
    reason: La construction grecque ἐν ἐπαγγελίᾳ est inhabituelle et peut être rendue plus formellement, mais « assorti d’une promesse » en exprime clairement le sens probable.
lexical_decisions:
- source_word: τίμα
  choice: Honore
  rationale: L’impératif appelle à témoigner concrètement de l’honneur, et non simplement à éprouver du respect. « Honore » conserve aussi la formulation traditionnelle du Décalogue.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ton père et ta mère
  rationale: Traduction directe, naturelle et précise des termes familiaux grecs, avec le possessif porté par l’ensemble coordonné.
- source_word: ἥτις ἐστὶν
  choice: c’est
  rationale: Cette tournure française reprend naturellement le commandement cité et introduit le commentaire explicatif de Paul.
- source_word: ἐντολὴ πρώτη
  choice: le premier commandement
  rationale: « Commandement » garde la résonance du Décalogue, tandis que « premier » respecte la valeur ordinale de πρώτη sans lui donner le sens de « principal ».
- source_word: ἐν ἐπαγγελίᾳ
  choice: assorti d’une promesse
  rationale: La formulation rend idiomatiquement l’idée d’un commandement accompagné d’une promesse, tout en signalant dans une note la construction grecque plus littérale.
theological_decisions:
- issue: Sens de « premier commandement » et rapport avec la promesse
  choice: le premier commandement assorti d’une promesse
  alternative: le premier commandement dans une promesse ; le premier commandement de la seconde table
  rationale: La traduction exprime le sens contextuel probable sans imposer un système confessionnel de numérotation du Décalogue. Elle ne fait pas non plus de « premier » un synonyme de « principal ».
translation_notes:
  register: Français moderne, international et digne. Les guillemets marquent la citation du Décalogue, et les tirets rendent le caractère explicatif de la proposition, qui se poursuit au verset suivant.
