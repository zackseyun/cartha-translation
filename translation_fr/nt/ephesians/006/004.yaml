id: EPH.6.4
reference: Ephesians 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: fr
  text: Et vous, pères[a], ne poussez pas vos enfants à la colère[b], mais élevez-les dans la discipline et l’instruction du Seigneur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit précisément « pères », et non le terme général « parents ».
    reason: source_scope
  - marker: b
    text: Ou « n’exaspérez pas vos enfants ». Le verbe grec signifie susciter la colère ou provoquer du ressentiment.
    reason: lexical_alternative
  - marker: c
    text: L’expression « du Seigneur » peut désigner une discipline et une instruction qui viennent du Seigneur, lui appartiennent, le concernent ou sont dirigées par lui.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: pères
  rationale: Le nom grec est un masculin pluriel qui désigne ici précisément les pères. La traduction conserve cette adresse particulière sans l’élargir à « parents ».
- source_word: παροργίζετε
  choice: ne poussez pas … à la colère
  rationale: Le verbe exprime le fait de susciter la colère ou le ressentiment. Cette formulation française en rend clairement la valeur causative.
- source_word: τέκνα
  choice: enfants
  rationale: Ce terme désigne naturellement les enfants au sein d’une famille, sans distinction de sexe.
- source_word: ἐκτρέφετε
  choice: élevez-les
  rationale: Dans le contexte de l’éducation familiale, le verbe signifie nourrir et prendre soin jusqu’à l’âge adulte, donc « élever ».
- source_word: παιδείᾳ
  choice: discipline
  rationale: Le terme englobe la formation, l’encadrement et la correction qui façonnent l’enfant. « Discipline » conserve cette dimension formative et corrective.
- source_word: νουθεσίᾳ
  choice: avertissements
  rationale: Le mot désigne une parole qui guide, reprend ou met en garde. « Avertissements » distingue cette dimension verbale de la discipline, tout en restant compréhensible.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Ce génitif peut exprimer la source, l’appartenance, le caractère ou l’orientation. La formulation compacte « du Seigneur » préserve cette pluralité de sens.
theological_decisions:
- issue: Portée de l’adresse πατέρες
  choice: L’adresse vise explicitement les « pères ».
  alternative: « parents »
  rationale: Même si le principe peut avoir une application plus large, le texte grec nomme les pères; la traduction ne généralise donc pas l’adresse.
- issue: Valeur du génitif κυρίου
  choice: « du Seigneur »
  alternative: « venant du Seigneur », « au sujet du Seigneur » ou « conforme au Seigneur »
  rationale: Le grec ne précise pas si le Seigneur est surtout la source, le contenu, le possesseur ou la norme de cette discipline et de ces avertissements. La traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et directement intelligible. L’apostrophe « Et vous, pères » restitue naturellement la coordination grecque. Le vocabulaire conserve le caractère à la fois formateur et correctif de l’éducation évoquée, sans réduire « discipline » à une punition.
