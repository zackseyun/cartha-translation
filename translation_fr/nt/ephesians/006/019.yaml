id: EPH.6.19
reference: Ephesians 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: fr
  text: Priez aussi pour moi, afin qu’un message me soit donné lorsque j’ouvre la bouche[a], pour faire connaître avec assurance[b] le mystère de l’Évangile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que la parole me soit donnée quand j’ouvre la bouche »; littéralement : « dans l’ouverture de ma bouche ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec hardiesse », « avec franchise » ou « ouvertement ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de la Bonne Nouvelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: Priez aussi pour moi
  rationale: Le grec est elliptique (« et pour moi ») et reprend la demande de prière du verset précédent. La restitution du verbe en français rend cette continuité explicite sans ajouter une nouvelle idée.
- source_word: ἵνα μοι δοθῇ λόγος
  choice: afin qu’un message me soit donné
  rationale: ἵνα introduit le but ou le contenu de la prière. Ici, λόγος désigne une parole porteuse de sens, le contenu à communiquer, plutôt que le Logos comme titre.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: lorsque j’ouvre la bouche
  rationale: Cette tournure conserve l’image grecque tout en exprimant naturellement en français le moment où Paul commence à parler.
- source_word: ἐν παρρησίᾳ
  choice: avec assurance
  rationale: παρρησία évoque une parole ouverte, franche et courageuse. « Avec assurance » demeure naturel et ne réduit pas le terme à la seule témérité.
- source_word: γνωρίσαι
  choice: pour faire connaître
  rationale: L’infinitif exprime ici la finalité de la parole donnée; « faire connaître » en conserve directement le sens.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: le mystère de l’Évangile
  rationale: « Mystère » conserve le terme paulinien pour le dessein divin autrefois caché et désormais révélé; « Évangile » rend εὐαγγέλιον dans son sens théologiquement dense et courant.
theological_decisions:
- issue: Sens de λόγος dans la demande de Paul
  choice: un message
  alternative: une parole; des paroles; les mots
  rationale: « Un message » exprime naturellement le contenu que Dieu donne à Paul de communiquer, sans faire de λόγος un titre christologique ni formuler une doctrine particulière de l’inspiration.
- issue: Portée de παρρησία
  choice: avec assurance
  alternative: avec hardiesse; avec franchise; ouvertement
  rationale: Ce choix garde ensemble la liberté, la franchise et le courage de la proclamation. Il évite de ramener le terme à un simple sentiment intérieur de confiance.
- issue: Ellipse initiale de καὶ ὑπὲρ ἐμοῦ
  choice: restitution de « Priez » à partir du verset précédent
  alternative: et pour moi
  rationale: Le grec dépend syntaxiquement de l’exhortation à prier en Éphésiens 6.18. Rétablir le verbe en français produit une phrase intelligible tout en respectant cette dépendance contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase rétablit sobrement le verbe sous-entendu par le contexte précédent. L’image de l’ouverture de la bouche et le terme paulinien « mystère » sont conservés, tandis que la syntaxe reste naturelle.
