  - severity: medium
    issue: Construction « disponibilité de l’Évangile »
    rationale: Cette chaîne nominale est peu idiomatique et ne communique pas clairement le rapport génitif condensé du grec. « que donne l’Évangile » fournit une relation sobre et naturelle, sans réduire le sens à la proclamation.
