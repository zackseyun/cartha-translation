  source_fidelity: Le participe aoriste moyen ὑποδησάμενοι désigne l’action de chausser les pieds, et le texte conserve correctement cette image. ἑτοιμασία renvoie plus directement à la préparation ou à l’état de préparation qu’à la « disponibilité », terme français susceptible d’évoquer surtout le fait d’être accessible ou libre. La relation précise entre « préparation » et « Évangile de paix » demeure condensée en grec; une formulation française légèrement explicative est préférable à une chaîne nominale peu idiomatique.
  naturalness: « Chaussez vos pieds de la disponibilité de l’Évangile de paix » est grammaticalement possible, mais « disponibilité de l’Évangile » est peu naturel et sémantiquement imprécis en français moderne. « La préparation que donne l’Évangile de paix » est clair, conserve l’image de l’équipement et évite de présenter comme explicite une mission de proclamation.
  terminology: « Évangile de paix » rend adéquatement εὐαγγέλιον τῆς εἰρήνης et maintient le terme paulinien. « Préparation » est le terme principal le plus sûr pour ἑτοιμασία; la note peut signaler « disponibilité » et les lectures interprétatives sans les imposer.
