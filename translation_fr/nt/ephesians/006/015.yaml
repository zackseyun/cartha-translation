  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: fr
  text: et chaussez vos pieds de la préparation que donne l’Évangile de paix[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de la disponibilité »; peut-être « de la disponibilité à annoncer l’Évangile de paix » ou « de l’assise ferme que donne l’Évangile de paix ».

      '
    reason: La construction grecque autour de ἑτοιμασία est condensée. Elle peut désigner la préparation ou la disponibilité, et a aussi été comprise comme la disposition à proclamer ou comme une assise ferme fournie par l’Évangile.
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: chaussez
  rationale: Le verbe signifie mettre des chaussures ou des sandales. « Chaussez » conserve l’image concrète de l’équipement des pieds; l’impératif français restitue naturellement la valeur exhortative du participe grec dans son contexte.
- source_word: τοὺς πόδας
  choice: vos pieds
  rationale: Le grec nomme explicitement les pieds. Le possessif, implicite en grec, est nécessaire en français courant.
- source_word: ἐν
  choice: de
  rationale: Dans cette métaphore d’équipement, ἐν introduit ce dont les pieds sont chaussés. « Chausser de » est idiomatique et maintient le lien avec l’image.
- source_word: ἑτοιμασίᾳ
  choice: disponibilité
  rationale: Le nom peut désigner le fait d’être prêt, la préparation ou, éventuellement, une assise ferme. « Disponibilité » exprime ici l’état de celui qui est prêt sans préciser à quoi, ce que le grec ne dit pas explicitement.
- source_word: εὐαγγελίου
  choice: Évangile
  rationale: « Évangile » est le terme paulinien consacré, intelligible en français moderne, et conserve la densité théologique du nom grec.
- source_word: τῆς εἰρήνης
  choice: de paix
  rationale: Cette formulation rend directement le génitif qui qualifie l’Évangile, compris comme l’Évangile caractérisé par la paix ou qui l’annonce.
theological_decisions:
- issue: Sens de ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: les pieds équipés de la disponibilité associée à l’Évangile de paix
  alternative: la disponibilité à annoncer l’Évangile de paix; l’assise ferme que procure l’Évangile de paix
  rationale: La construction grecque est condensée et ne précise ni que cette disponibilité consiste à proclamer l’Évangile, ni qu’elle désigne une stabilité donnée par celui-ci. Le texte principal garde donc la chaîne nominale ouverte, tandis que la note signale les principales interprétations.
translation_notes:
  register: Français international moderne, digne et direct. « Chaussez vos pieds » conserve volontairement la métaphore corporelle et militaire. La formulation légèrement inhabituelle « disponibilité de l’Évangile » préserve l’ambiguïté du génitif grec au lieu d’imposer une interprétation.
