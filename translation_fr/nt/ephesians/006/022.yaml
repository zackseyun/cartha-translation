id: EPH.6.22
reference: Ephesians 6:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: fr
  text: 'Je l’ai envoyé vers vous dans ce but précis : afin que vous sachiez ce qui nous concerne[a] et qu’il encourage vos cœurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comment nous allons » ou « quelle est notre situation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: Je l’ai envoyé vers vous
  rationale: Le pronom relatif renvoie à Tychique au verset précédent. Le passé composé rend naturellement l’aoriste épistolaire en français, et « vers vous » conserve la direction exprimée par πρός.
- source_word: εἰς αὐτὸ τοῦτο
  choice: précisément dans ce but
  rationale: Cette formulation naturelle restitue l’idée de but et l’insistance portée par αὐτὸ τοῦτο.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: que vous sachiez ce qui nous concerne
  rationale: La formulation suit de près le grec et préserve l’ampleur de l’expression, qui peut viser aussi bien la situation personnelle que les circonstances de Paul et de ses compagnons.
- source_word: παρακαλέσῃ
  choice: qu’il encourage
  rationale: Dans ce contexte pastoral, παρακαλέω désigne vraisemblablement l’encouragement ou le réconfort; « encourage » demeure naturel sans exclure la nuance de consolation.
- source_word: τὰς καρδίας ὑμῶν
  choice: votre cœur
  rationale: Le singulier collectif est idiomatique en français pour parler du cœur des destinataires et conserve l’image anthropologique biblique.
theological_decisions:
- issue: Sens de τὰ περὶ ἡμῶν
  choice: ce qui nous concerne
  alternative: comment nous allons ; quelle est notre situation
  rationale: Le grec ne précise pas s’il s’agit surtout de l’état personnel des envoyeurs ou de leurs circonstances. Une formulation générale conserve cette ambiguïté réelle.
- issue: Nuance de παρακαλέω
  choice: encourage
  alternative: réconforte ; exhorte
  rationale: La mention du cœur et le contexte d’information pastorale favorisent l’encouragement, tout en laissant subsister une nuance possible de réconfort.
translation_notes:
  register: Français international moderne, clair et digne. La structure à deux propositions de but est conservée; le vocabulaire évite de préciser davantage que le grec la nature des nouvelles concernant Paul et ses compagnons.
