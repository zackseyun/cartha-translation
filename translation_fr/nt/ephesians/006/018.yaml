language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: fr
  text: Priez en tout temps, dans l’Esprit[a], par toute prière et toute supplication. À cette fin, restez vigilants avec une entière persévérance et des supplications[c] pour tous les saints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en esprit ». Le grec peut recevoir un sens plus général, mais le contexte renvoie probablement à l’Esprit Saint.
    reason: alternative_reading
  - marker: b
    text: Ici, les « saints » sont tous ceux qui appartiennent à Dieu, c’est-à-dire l’ensemble des croyants.
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « avec une entière persévérance dans la supplication ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: avec toutes sortes de prières et de supplications
  rationale: διά avec le génitif exprime ici le moyen. « Avec » s’intègre naturellement à l’exhortation, tandis que « toutes sortes de » rend la portée distributive de πάσης dans un français courant. « Prières » garde le terme général et « supplications » désigne plus précisément les demandes pressantes.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: priant en toute occasion
  rationale: Le participe présent conserve le mouvement syntaxique du grec. « En toute occasion » exprime naturellement la totalité des moments ou circonstances visée par παντὶ καιρῷ.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: Dans le contexte immédiat et dans l’usage paulinien, πνεῦμα désigne très probablement l’Esprit Saint. La majuscule indique ce sens probable sans dissimuler l’autre lecture possible, signalée en note.
- source_word: εἰς αὐτὸ
  choice: À cette fin
  rationale: Cette expression française rend avec concision l’orientation vers le but exprimée par εἰς αὐτό et relie la vigilance à la prière qui précède.
- source_word: ἀγρυπνοῦντες
  choice: restez vigilants
  rationale: Le verbe évoque une vigilance soutenue, littéralement le fait de rester éveillé. La forme exhortative explicite naturellement en français la valeur du participe dans ce contexte.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: avec une entière persévérance et des supplications
  rationale: Cette formulation maintient la coordination explicite par καί et rend προσκαρτέρησις par la constance soutenue. La possibilité de comprendre les deux termes comme une unité, « persévérer dans la supplication », est conservée en note.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: pour tous les saints
  rationale: Dans l’usage paulinien, οἱ ἅγιοι désigne l’ensemble du peuple consacré à Dieu. « Saints » conserve le terme biblique reçu, avec une note empêchant son interprétation comme catégorie restreinte de croyants.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit Saint (« dans l’Esprit »)
  alternative: l’esprit humain ou une disposition spirituelle (« en esprit »)
  rationale: La proximité de « l’épée de l’Esprit » au verset précédent et l’usage paulinien favorisent une référence à l’Esprit Saint. Toutefois, l’absence d’article en grec permet une lecture plus générale, qui est donc signalée.
- issue: Sens de ἅγιοι
  choice: tous les croyants en tant que peuple saint de Dieu
  alternative: une catégorie ultérieure et restreinte de saints officiellement reconnus
  rationale: Chez Paul, le terme désigne normalement toute la communauté des personnes appartenant à Dieu, non un groupe distingué par une procédure ecclésiastique postérieure.
- issue: Rapport entre προσκαρτερήσει et δεήσει
  choice: 'deux éléments coordonnés : persévérance et supplications'
  alternative: 'une expression unifiée : persévérance dans la supplication'
  rationale: καί soutient une traduction coordonnée, mais le contexte autorise aussi que la persévérance qualifie l’activité de supplication. La note préserve cette ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée à l’exhortation précédente par l’ouverture « avec », conformément à la syntaxe continue du passage. « Supplications » est légèrement soutenu mais courant dans le registre de la prière et permet de distinguer δέησις de προσευχή.
