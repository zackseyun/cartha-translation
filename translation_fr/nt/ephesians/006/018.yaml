    issue: Portée de πάσης dans l’ouverture
    rationale: « Avec toutes sortes de prières » peut évoquer principalement différents types de prières. « Par toute prière et toute supplication » rend plus directement la portée exhaustive/distributive de πάσης, sans imposer l’idée de catégories.
  - severity: low
    issue: Construction française des participes
    rationale: Après « priant », le passage à « restez vigilants » après un point est grammaticalement possible dans une adaptation, mais produit une articulation moins homogène. Deux impératifs coordonnés rendent naturellement la force exhortative contextuelle des participes grecs.
