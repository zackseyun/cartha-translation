  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: fr
  text: Prenez aussi le casque du salut[a] et l’épée de l’Esprit, qui est la parole de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Recevez le casque du salut ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la parole prononcée de Dieu » ; le grec rhêma peut mettre l’accent sur une parole prononcée ou un message.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: recevez
  rationale: L’impératif aoriste moyen, à la deuxième personne du pluriel, peut signifier « recevoir » ou « prendre ». « Recevez » garde l’idée d’accueillir ou de prendre ce qui est fourni, tout en restant naturel dans l’image de l’armure.
- source_word: περικεφαλαίαν
  choice: casque
  rationale: Équivalent français direct et courant du terme militaire désignant la protection de la tête.
- source_word: τοῦ σωτηρίου
  choice: du salut
  rationale: Cette formulation respecte le génitif grec et le vocabulaire paulinien, sans préciser davantage la relation exacte entre le casque et le salut.
- source_word: μάχαιραν
  choice: épée
  rationale: Le mot grec désigne une arme blanche, souvent une épée courte. « Épée » est l’équivalent français le plus clair sans imposer une précision absente du contexte immédiat.
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Dans ce contexte paulinien, le référent le plus naturel est l’Esprit Saint. La majuscule l’indique sans préciser si le génitif exprime la provenance, l’appartenance ou le moyen.
- source_word: ὅ ἐστιν
  choice: qui est
  rationale: La proposition relative explique l’image de l’épée. Le neutre grec peut reprendre conceptuellement l’objet métaphorique, tandis que le français exige ici l’accord avec « épée ».
- source_word: ῥῆμα θεοῦ
  choice: la parole de Dieu
  rationale: ῥῆμα peut désigner une parole prononcée, une déclaration ou un message. « La parole de Dieu » est naturelle et reconnaissable, tandis qu’une note conserve la nuance possible d’une parole énoncée.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: l’Esprit Saint
  alternative: l’esprit humain ou une réalité spirituelle générique
  rationale: Dans l’image paulinienne de l’armure de Dieu, l’expression désigne très probablement l’épée qui relève de l’Esprit ou qu’il fournit, surtout puisque la proposition suivante l’identifie à la parole de Dieu. Le texte principal ne tranche pas la nuance précise du génitif.
- issue: Rapport entre l’épée et la parole de Dieu
  choice: identification métaphorique conservée par « qui est »
  alternative: explication instrumentale ou attribution explicite à l’Esprit
  rationale: Le grec affirme simplement l’identification explicative sans détailler comment l’Esprit se rapporte à la parole. La traduction préserve cette tension plutôt que de l’expliciter.
translation_notes:
  register: Français international moderne, digne et accessible. « Recevez aussi » rend le καί initial tout en reliant naturellement ce verset à l’énumération précédente. Les formulations traditionnelles « casque du salut », « épée de l’Esprit » et « parole de Dieu » sont conservées parce qu’elles sont à la fois exactes et courantes.
