id: EPH.6.14
reference: Ephesians 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: fr
  text: Tenez donc ferme, après avoir ceint votre taille de vérité et revêtu la cuirasse de la justice[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cuirasse de la droiture ». Le mot grec peut exprimer aussi bien la justice que la qualité de ce qui est droit.
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: Tenez donc ferme
  rationale: L’impératif appelle les destinataires à prendre et garder position. « Tenez ferme » est idiomatique en français et exprime ici naturellement le sens contextuel de στῆτε, sans ajouter une action étrangère à la métaphore.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement et naturellement la conséquence de l’exhortation précédente.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: après avoir ceint votre taille
  rationale: Le participe aoriste décrit l’équipement préalable associé à l’ordre de tenir ferme. « Ceindre » conserve l’image antique sans introduire explicitement une ceinture absente du grec; « votre taille » rend l’expression de manière moderne.
- source_word: ἐν ἀληθείᾳ
  choice: de vérité
  rationale: Dans la construction française « ceindre sa taille de… », ce choix garde la vérité comme moyen ou élément dont on se ceint, tout en laissant ouvertes les nuances de vérité objective et de sincérité.
- source_word: ἐνδυσάμενοι
  choice: après avoir… revêtu
  rationale: « Revêtir » est un verbe français naturel et digne pour enfiler un vêtement ou une pièce d’armure; le participe coordonné dépend du même « après avoir ».
- source_word: τὸν θώρακα
  choice: la cuirasse
  rationale: « Cuirasse » est le terme français courant pour la protection militaire du torse et maintient clairement l’image de l’armure.
- source_word: τῆς δικαιοσύνης
  choice: de la justice
  rationale: δικαιοσύνη peut désigner la justice, la droiture ou la conformité à ce qui est juste. En français biblique moderne, « justice » conserve cette amplitude mieux que « droiture » dans cette formule paulinienne.
theological_decisions:
- issue: Portée de δικαιοσύνη dans la métaphore de l’armure
  choice: justice
  alternative: droiture
  rationale: « Justice » est le terme français établi et assez large pour évoquer à la fois le juste statut, la conduite droite et l’action conforme au droit. La note préserve « droiture », qui peut mieux faire ressortir la dimension morale personnelle sans trancher la tension paulinienne.
- issue: Nature de ἀλήθεια
  choice: vérité
  alternative: sincérité
  rationale: Le texte reste formulé de façon à ne pas décider si Paul vise principalement la vérité divine reçue ou l’intégrité véridique du croyant.
translation_notes:
  register: Français international moderne, digne et accessible. « Ceint » conserve la métaphore vestimentaire antique avec concision; « tenez ferme » rend idiomatiquement l’appel contextuel à maintenir sa position. La virgule finale est conservée puisque le verset se poursuit grammaticalement au verset 15.
