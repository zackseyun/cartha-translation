id: EPH.6.12
reference: Ephesians 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: fr
  text: Car notre lutte n’est pas contre la chair et le sang[a], mais contre les dominations, contre les autorités, contre les maîtres du monde de ces ténèbres[b], contre les forces spirituelles du mal dans les réalités célestes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « notre lutte n’est pas contre le sang et la chair ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « contre les maîtres du monde de ces présentes ténèbres ». Le mot « présentes » explicite une nuance possible, sans être exprimé séparément dans le grec.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans les lieux célestes » ou « dans les sphères célestes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: lutter
  rationale: Le terme évoque la lutte au corps à corps. La tournure « avoir à lutter » conserve cette image tout en étant naturelle en français moderne.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: contre la chair et le sang
  rationale: Cette expression française établie désigne ici des êtres humains; l’ordre idiomatique français est préférable à l’ordre grec « sang et chair ».
- source_word: ἀρχάς
  choice: dominations
  rationale: Dans ce contexte paulinien, le pluriel désigne des puissances dirigeantes supra-humaines. « Dominations » conserve la distinction avec ἐξουσίαι et reste un terme biblique intelligible.
- source_word: ἐξουσίας
  choice: autorités
  rationale: Le mot exprime l’autorité ou le pouvoir exercé et forme un couple distinct avec « dominations ».
- source_word: κοσμοκράτορας
  choice: maîtres du monde
  rationale: Ce rendu fait entendre la composition du terme rare, « ceux qui dominent le monde », sans employer le calque français peu naturel « cosmocrates ».
- source_word: τοῦ σκότους τούτου
  choice: de ces ténèbres
  rationale: Le génitif rattache naturellement ces maîtres au domaine caractérisé par les ténèbres. Le démonstratif est conservé sans ajouter « présentes », absent du grec.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: les forces spirituelles du mal
  rationale: L’adjectif neutre substantivé désigne ici des réalités ou puissances spirituelles; « forces » rend le référent compréhensible sans préciser indûment leur organisation.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: dans les réalités célestes
  rationale: La formule récurrente d’Éphésiens désigne la sphère céleste. « Réalités célestes » demeure assez large pour ne pas la réduire à de simples lieux physiques.
theological_decisions:
- issue: Nature des adversaires mentionnés
  choice: Le texte désigne principalement des puissances spirituelles supra-humaines.
  alternative: Les termes pourraient aussi être compris comme incluant leurs manifestations dans des pouvoirs et structures terrestres.
  rationale: L’accumulation des termes, surtout κοσμοκράτορας et τὰ πνευματικὰ τῆς πονηρίας, oriente vers des adversaires spirituels, sans obliger la traduction à exclure toute manifestation terrestre.
- issue: Sens de σάρξ dans l’expression
  choice: « chair » est conservé dans l’expression « la chair et le sang », qui renvoie aux êtres humains.
  alternative: « des êtres humains » expliciterait l’idiome, tandis que « nature pécheresse » serait inadapté ici.
  rationale: σάρξ ne désigne pas ici une inclination morale pécheresse, mais la condition humaine corporelle au sein d’une expression idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme anaphorique de πρὸς (« contre ») est conservé. Les termes désignant les puissances restent distincts, et l’ambiguïté spatiale ou sphérique de ἐν τοῖς ἐπουρανίοις est signalée en note.
