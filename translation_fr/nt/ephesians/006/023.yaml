id: EPH.6.23
reference: Ephesians 6:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: fr
  text: Paix aux frères[a], et amour avec la foi[b], de la part de Dieu le Père et du Seigneur Jésus le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux frères et sœurs ». Le grec dit littéralement « frères », un pluriel masculin qui peut désigner ici l’ensemble de la communauté croyante.
    reason: alternative_reading
  - marker: b
    text: Ou « avec la fidélité » ou « avec la confiance ». Le mot grec peut avoir ces sens, bien que « foi » soit ici la traduction retenue.
    reason: lexical_alternative
  - marker: c
    text: 'Grec : « Jésus Christ ». « Le Messie » traduit ici le titre Χριστός afin d’en rendre le sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Paix
  rationale: Le nom employé seul forme une bénédiction elliptique. « Paix » en conserve la concision sans ajouter de verbe absent du grec.
- source_word: τοῖς ἀδελφοῖς
  choice: aux frères
  rationale: ἀδελφοῖς est un pluriel masculin qui, dans ce contexte, peut désigner l’ensemble de la communauté croyante. Le texte principal respecte la forme grecque et une note explicite sa portée possible.
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est l’équivalent français courant de ἀγάπη et maintient le lien lexical avec l’usage paulinien du terme.
- source_word: μετὰ πίστεως
  choice: avec la foi
  rationale: μετά suivi du génitif exprime ici l’accompagnement. « Foi » est le sens par défaut de πίστις, sans exclure les nuances de confiance ou de fidélité signalées en note.
- source_word: ἀπὸ
  choice: de la part de
  rationale: Cette tournure française exprime naturellement la source personnelle de la bénédiction tout en conservant le sens d’origine porté par ἀπό.
- source_word: θεοῦ πατρὸς
  choice: Dieu le Père
  rationale: Le grec ne comporte pas « notre » ; « Dieu le Père » en respecte précisément la formulation.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français établi de κύριος dans ce contexte christologique.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » en traduit le sens plutôt que de le translittérer.
theological_decisions:
- issue: Traduction de Χριστοῦ dans la bénédiction finale
  choice: le Messie
  alternative: Christ
  rationale: Χριστός est rendu selon son sens de titre messianique. L’article, nécessaire en français idiomatique, ne correspond pas à un article grec ajouté mais à la syntaxe naturelle du titre en français.
- issue: Portée de l’adresse ἀδελφοῖς
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal reproduit le masculin pluriel grec, tandis que la note préserve la possibilité bien attestée d’une adresse à toute la communauté, femmes comprises.
- issue: Sens de πίστις
  choice: foi
  alternative: fidélité ou confiance
  rationale: « Foi » demeure le rendu contextuel par défaut, mais le champ sémantique du terme grec permet aussi « fidélité » ou « confiance » ; ces nuances sont donc conservées en note.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve la brièveté de la bénédiction grecque. « De la part de » est plus naturel en français que le simple « de » pour marquer la source personnelle des dons, tandis que les notes maintiennent les ambiguïtés lexicales et la portée inclusive possible de l’adresse.
