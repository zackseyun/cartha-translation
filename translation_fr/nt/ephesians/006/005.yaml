id: EPH.6.5
reference: Ephesians 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: fr
  text: Esclaves, obéissez à vos maîtres selon la chair[a], avec crainte et tremblement, dans la sincérité de votre cœur, comme au Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vos maîtres sur le plan purement humain ou terrestre.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Christ »; le terme est rendu ici par « Messie » parce qu’il fonctionne comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: Esclaves
  rationale: Dans ce code domestique, le terme désigne des personnes juridiquement asservies; « esclaves » rend cette réalité sans l’atténuer par « serviteurs ».
- source_word: ὑπακούετε
  choice: obéissez
  rationale: L’impératif présent appelle à l’obéissance; « obéissez » est direct et naturel dans ce contexte.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Cette formulation conserve le contraste grec entre l’autorité humaine et terrestre des maîtres et la relation au Messie, sans réduire d’emblée l’expression à une seule paraphrase.
- source_word: κυρίοις
  choice: maîtres
  rationale: Dans le rapport social évoqué, κύριοι désigne les maîtres de personnes esclaves, et non le Seigneur au sens divin.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: avec crainte et tremblement
  rationale: La traduction garde la force de cette expression paulinienne et ses échos dans d’autres passages.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: dans la sincérité de votre cœur
  rationale: ἁπλότης exprime ici une disposition sincère, sans duplicité; cette tournure est claire et digne en français actuel.
- source_word: ὡς τῷ Χριστῷ
  choice: comme au Messie
  rationale: ὡς garde une valeur comparative, tandis que Χριστός est rendu selon son sens de titre, « Messie ».
theological_decisions:
- issue: Traduction de Χριστῷ
  choice: Messie
  alternative: Christ
  rationale: Le mot grec fonctionne ici comme un titre; « Messie » en traduit le sens plutôt que de reprendre sa forme traditionnelle francisée.
- issue: Traduction de δοῦλοι dans un contexte d’esclavage
  choice: Esclaves
  alternative: Serviteurs
  rationale: Le cadre domestique met en jeu des personnes placées sous l’autorité de maîtres; « serviteurs » risquerait de masquer cette réalité sociale.
- issue: Portée de κατὰ σάρκα
  choice: selon la chair
  alternative: humains / terrestres
  rationale: La formulation littérale préserve la tension entre la relation sociale présente et la relation au Messie; une note en explicite le sens probable sans fermer l’expression.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en restant lisible. « Selon la chair » conserve volontairement l’expression source, expliquée en note; « esclaves » évite d’adoucir la réalité historique.
