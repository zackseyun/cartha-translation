  source_fidelity: 'Le texte rend fidèlement la structure et les éléments essentiels du grec : le but (« Pour que »), l’insistance sur les destinataires (« vous aussi »), les deux renseignements concernant Paul, et l’assurance que Tychique les leur communiquera pleinement. « Quelle est ma situation » est une explicitation idiomatique raisonnable de τὰ κατ’ ἐμέ, sans restreindre indûment le sens. La légère force connective de δέ peut rester implicite en français.'
  naturalness: La phrase est naturelle, claire et d’un registre biblique moderne approprié. La construction avec l’incise appositive « Tychique, le frère bien-aimé et fidèle serviteur dans le Seigneur » est fluide. « Vous fera tout savoir » est idiomatique et rend bien πάντα γνωρίσει ὑμῖν.
  terminology: « Tychique » est la forme française usuelle. « Frère bien-aimé », « fidèle serviteur » et « Seigneur » sont précis et cohérents avec le contexte. « Serviteur » rend διάκονος sans présumer qu’il s’agit du titre ecclésial ultérieur; la note préserve correctement les possibilités « ministre » et « diacre ».
