id: EPH.6.21
reference: Ephesians 6:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: fr
  text: Pour que vous sachiez, vous aussi, quelle est ma situation et ce que je fais, Tychique, le frère bien-aimé et fidèle serviteur dans le Seigneur[a], vous fera tout savoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fidèle ministre»; selon le contexte, le grec διάκονος peut aussi désigner un «diacre».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Pour que
  rationale: ἵνα exprime ici le but; δέ assure une transition légère que le français rend naturellement par l’enchaînement contextuel, sans imposer un contraste marqué.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: vous sachiez, vous aussi
  rationale: La reprise du pronom avec καί met les destinataires en relief et signifie qu’eux aussi doivent être informés.
- source_word: τὰ κατ’ ἐμέ
  choice: quelle est ma situation
  rationale: L’expression idiomatique désigne ce qui concerne Paul, autrement dit sa situation. Cette formulation française est naturelle tout en conservant la portée générale de l’expression.
- source_word: τί πράσσω
  choice: ce que je fais
  rationale: πράσσω désigne ici les activités ou occupations de Paul; la traduction directe reste claire et naturelle.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: vous fera tout savoir
  rationale: γνωρίζω signifie faire connaître ou informer. Cette tournure idiomatique conserve πάντα, «tout».
- source_word: Τυχικὸς
  choice: Tychique
  rationale: Forme française traditionnelle et établie du nom grec Τυχικός.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: le frère bien-aimé
  rationale: La formulation conserve à la fois l’affection exprimée par ἀγαπητός et la désignation fraternelle chrétienne; l’individu désigné est masculin.
- source_word: πιστὸς διάκονος
  choice: fidèle serviteur
  rationale: διάκονος désigne ici la fonction de service de Tychique sans établir sans ambiguïté qu’il occupe la charge ecclésiale plus tard appelée diaconat.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La locution paulinienne est conservée sans expliciter outre mesure la nature exacte de la relation ou de la sphère exprimée par ἐν.
theological_decisions:
- issue: Sens de διάκονος appliqué à Tychique
  choice: serviteur
  alternative: ministre; diacre
  rationale: Le contexte présente Tychique comme un collaborateur fidèle chargé de renseigner les destinataires. «Serviteur» exprime cette fonction sans transformer le terme en titre ecclésiastique certain; une note préserve les autres valeurs possibles.
- issue: Traduction de ἀδελφός
  choice: frère
  alternative: membre de la famille croyante
  rationale: Tychique est un collaborateur masculin individuel; «frère» est donc précis et conserve l’image familiale du texte.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: Dans cette formule paulinienne, κύριος est le titre habituel renvoyant au Christ; «Seigneur» en maintient la portée théologique sans paraphrase.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’ordre argumentatif grec tout en évitant une formulation lourdement littérale comme «les choses me concernant». «Tychique» suit l’usage français établi.
