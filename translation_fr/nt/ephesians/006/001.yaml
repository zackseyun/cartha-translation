source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: fr
  text: Enfants, obéissez à vos parents dans le Seigneur[a], car cela est juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en tant que personnes qui appartiennent au Seigneur » ou « dans l’union avec le Seigneur ». L’expression « dans le Seigneur » peut indiquer la sphère ou la manière de cette obéissance; elle peut aussi laisser entendre que celle-ci reste soumise à la fidélité envers le Seigneur.
    reason: alternative lexicale et ambiguïté syntaxique
lexical_decisions:
- source_word: τέκνα
  choice: Enfants
  rationale: Le vocatif pluriel s’adresse directement aux enfants du foyer. « Enfants » est naturel, précis et conserve la relation familiale sans explicitation inutile.
- source_word: ὑπακούετε
  choice: obéissez
  rationale: L’impératif présent exprime une obéissance attentive et concrète, et non le simple fait d’entendre. « Obéissez » rend clairement la force de l’exhortation.
- source_word: γονεῦσιν
  choice: parents
  rationale: Le pluriel désigne collectivement le père et la mère; « parents » est l’équivalent français idiomatique et exact.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: 'Cette formulation compacte conserve l’expression paulinienne et son ouverture sémantique : elle peut évoquer la sphère, la manière ou le cadre de l’obéissance liée au Seigneur.'
- source_word: δίκαιον
  choice: juste
  rationale: Dans ce contexte éthique, le terme qualifie ce qui est moralement droit et convenable. « Juste » est clair, actuel et naturel en français.
theological_decisions:
- issue: Portée de l’expression « dans le Seigneur »
  choice: 'Rattacher l’expression au commandement : « obéissez à vos parents dans le Seigneur », tout en maintenant son ouverture interprétative.'
  alternative: Comprendre soit « vous qui êtes dans le Seigneur, obéissez à vos parents », soit « obéissez à vos parents comme il convient dans le Seigneur ».
  rationale: Le grec rattache le plus naturellement ἐν κυρίῳ à l’impératif, mais n’en précise pas entièrement la nuance. La traduction littérale préserve la tension entre l’identité des enfants dans le Seigneur, la sphère ou la manière de leur obéissance, et une possible limite implicite tenant à leur fidélité au Seigneur.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe directe conserve la forme d’interpellation et d’exhortation du grec. « Dans le Seigneur » est maintenu plutôt que paraphrasé afin de préserver la densité théologique et l’ambiguïté authentique de l’expression.
