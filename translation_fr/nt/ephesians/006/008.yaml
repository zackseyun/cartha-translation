  source_fidelity: 'Le texte rend fidèlement la structure essentielle du grec : le participe introductif (« sachant »), la portée distributive de ἕκαστος (« chacun »), l’indéfini ὃ ἂν (« quel que soit »), le bien accompli, la reprise démonstrative (« le »), la réception en retour auprès du Seigneur, et l’antithèse de statut « esclave ou libre ». « Du Seigneur » exprime correctement la source marquée par παρὰ avec le génitif.'
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Chacun, quel que soit le bien qu’il fasse » est une formulation naturelle qui conserve l’accent distributif. « Le recevra en retour » est un peu littéral, mais reste compréhensible et rend utilement la correspondance exprimée par κομίσεται sans explicitation indue.
  terminology: « Seigneur » convient à κύριος dans ce contexte paulinien, et « esclave ou libre » conserve sans euphémisme l’opposition sociale δοῦλος / ἐλεύθερος. Le vocabulaire de la récompense n’est relégué qu’en note comme possibilité lexicale, ce qui préserve la relative ouverture du verbe grec.
