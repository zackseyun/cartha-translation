id: EPH.6.8
reference: Ephesians 6:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: fr
  text: sachant que chacun, quel que soit le bien qu’il fasse, le recevra en retour du Seigneur[a], qu’il soit esclave ou libre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en sera récompensé par le Seigneur ». Le verbe grec peut désigner le fait de recevoir en retour ce qui correspond à son action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe garde le lien avec l’exhortation précédente sans rendre explicitement causale une relation qui peut seulement être implicite.
- source_word: ἕκαστος
  choice: chacun
  rationale: Ce choix conserve l’accent distributif et la place saillante de « chacun » dans la proposition grecque.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: quel que soit le bien qu’il fasse
  rationale: La tournure rend l’indétermination exprimée par ἄν et conserve ἀγαθόν comme qualification morale de l’acte.
- source_word: τοῦτο κομίσεται
  choice: le recevra en retour
  rationale: Le pronom « le » renvoie au bien accompli, tandis que « en retour » exprime la valeur de rétribution ou de correspondance possible de κομίζω sans imposer une image strictement commerciale.
- source_word: παρὰ κυρίου
  choice: du Seigneur
  rationale: παρά avec le génitif indique ici la source. « Seigneur » préserve le titre paulinien et sa portée probablement christologique.
- source_word: δοῦλος
  choice: esclave
  rationale: L’opposition explicite avec ἐλεύθερος rend centrale la condition sociale; « esclave » ne masque pas cette réalité historique.
- source_word: ἐλεύθερος
  choice: libre
  rationale: Dans l’expression antithétique, « libre » désigne naturellement une personne de condition libre.
theological_decisions:
- issue: Portée de la rétribution divine
  choice: le recevra en retour du Seigneur
  alternative: en sera récompensé par le Seigneur
  rationale: La formulation retenue préserve la correspondance entre le bien accompli et ce qui est reçu, tout en évitant de préciser au-delà du texte la nature de la rétribution.
- issue: Traduction de δοῦλος dans le code domestique
  choice: esclave
  alternative: serviteur
  rationale: Le contraste avec la personne libre exige de conserver la distinction juridique et sociale du texte plutôt que de l’atténuer.
- issue: Référent de κυρίου
  choice: Seigneur
  alternative: maître
  rationale: Même si le contexte mentionne des maîtres humains, la source de la rétribution est ici le Seigneur; le titre conserve la portée divine et probablement christologique sans la réduire à la métaphore domestique.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe conserve l’accent grec sur « chacun » tout en restant naturelle; le masculin grammatical singulier a ici une valeur représentative.
