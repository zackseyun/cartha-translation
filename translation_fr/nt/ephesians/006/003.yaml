  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα εὖ σοι γένηται καὶ ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: fr
  text: afin que tout aille bien pour toi et que tu vives longtemps sur la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dans le pays», en écho à la formulation du cinquième commandement en Exode 20.12 et Deutéronome 5.16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat lié à la promesse du commandement; cette tournure est naturelle et digne en français.
- source_word: εὖ σοι γένηται
  choice: tout aille bien pour toi
  rationale: Rend naturellement l’expression idiomatique grecque selon laquelle les choses se passent bien pour quelqu’un.
- source_word: καὶ
  choice: et
  rationale: Coordonne simplement les deux éléments de la promesse.
- source_word: ἔσῃ μακροχρόνιος
  choice: que tu vives longtemps
  rationale: Le grec signifie littéralement «que tu sois de longue vie»; la formulation verbale choisie est l’équivalent français le plus naturel.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Suit la portée ordinaire du grec tel qu’il se présente dans Éphésiens, sans y réintroduire explicitement la notion plus particulière du pays.
theological_decisions:
- issue: Portée de ἐπὶ τῆς γῆς par rapport à la promesse du cinquième commandement
  choice: sur la terre
  alternative: dans le pays
  rationale: Le texte grec d’Éphésiens emploie une formulation générale. La traduction la conserve, tandis qu’une note signale l’écho possible du Décalogue et son langage relatif au pays.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes grecques σοι et ἔσῃ et assure la continuité avec l’adresse personnelle du commandement cité.
