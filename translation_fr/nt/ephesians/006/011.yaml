id: EPH.6.11
reference: Ephesians 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: fr
  text: Revêtez-vous de l’armure complète de Dieu[a], afin de pouvoir tenir ferme face aux manœuvres[b] du diable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout l’équipement de Dieu ». Le mot grec désigne l’équipement complet d’un soldat.
    reason: lexical_alternative
  - marker: b
    text: Ou « ruses », « procédés trompeurs » ou « stratégies » du diable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Revêtez-vous de
  rationale: L’impératif aoriste moyen, à la deuxième personne du pluriel, appelle les destinataires à prendre eux-mêmes cet équipement. « Revêtez-vous de » est naturel dans l’image militaire et conserve la force du commandement.
- source_word: πανοπλίαν
  choice: l’armure complète
  rationale: Le terme désigne l’équipement complet d’un soldat lourdement armé, et non la seule protection corporelle. « Armure complète » exprime clairement cette totalité en français courant.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: 'Le génitif reste volontairement large : l’armure appartient à Dieu et/ou est fournie par lui. « De Dieu » n’impose pas une seule de ces nuances.'
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: afin de pouvoir tenir ferme
  rationale: La construction avec πρὸς et l’infinitif articulé exprime ici le but. « Afin de pouvoir » le rend clairement, tandis que « tenir ferme » restitue dans ce contexte militaire l’idée de conserver sa position.
- source_word: μεθοδείας
  choice: manœuvres
  rationale: Le mot évoque des procédés calculés, rusés et trompeurs. « Manœuvres » convient à l’image du combat et reste naturel; une note signale d’autres rendus possibles.
- source_word: τοῦ διαβόλου
  choice: du diable
  rationale: Dans ce contexte de combat spirituel, διάβολος fonctionne comme la désignation personnelle de l’adversaire mauvais. « Le diable » est le rendu français établi sans ajouter de précision doctrinale.
theological_decisions:
- issue: Référent et rendu de διάβολος
  choice: le diable, adversaire mauvais personnel
  alternative: le calomniateur
  rationale: Le contexte immédiat du combat spirituel en Éphésiens 6 favorise la désignation d’un adversaire personnel plutôt qu’un nom commun visant un calomniateur humain. Le rendu ne développe pas davantage son identité.
- issue: Relation exprimée par τοῦ θεοῦ
  choice: de Dieu
  alternative: fournie par Dieu
  rationale: Le génitif peut suggérer à la fois l’appartenance et la provenance. La formulation retenue préserve cette ouverture au lieu de choisir explicitement l’une des deux.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. L’impératif pluriel est conservé. « Revêtez-vous » maintient l’image du vêtement et de l’équipement; « tenir ferme » explicite sobrement la valeur contextuelle de στῆναι. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
