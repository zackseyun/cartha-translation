source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: fr
  text: non pas seulement quand on vous regarde[a], comme des personnes qui cherchent à plaire aux autres, mais comme des esclaves du Messie[b], faisant la volonté de Dieu de toute votre âme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « selon un service sous les yeux » : un service accompli seulement sous le regard d’un surveillant.'
    reason: lexical_alternative
  - marker: b
    text: Ou « du Christ ». Le grec Christos signifie « Messie », c’est-à-dire « Oint ».
    reason: alternative_reading
  - marker: c
    text: Ou « de bon cœur » ou « du fond de l’âme » ; littéralement « venant de l’âme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: seulement quand on vous regarde
  rationale: Le composé rare évoque littéralement un « service sous les yeux », c’est-à-dire un travail accompli pour l’apparence lorsque quelqu’un surveille. La formulation française explicite naturellement ce sens, tandis que la note conserve l’image grecque.
- source_word: ἀνθρωπάρεσκοι
  choice: ceux qui cherchent à plaire aux hommes
  rationale: Cette expression rend le désir d’obtenir l’approbation humaine. « Hommes » désigne ici les êtres humains en général et s’insère naturellement dans la phrase.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le contexte immédiat s’adresse à des esclaves et le terme souligne ici leur appartenance au Messie; « esclaves » conserve donc la force sociale et rhétorique de δοῦλοι.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre désignant l’Oint. « Messie » en transmet le sens plutôt que de le traiter uniquement comme un nom propre traditionnel.
- source_word: ποιοῦντες
  choice: faisant
  rationale: Le participe exprime simplement l’action d’accomplir la volonté de Dieu, en continuité avec l’exhortation du contexte.
- source_word: θέλημα
  choice: volonté
  rationale: « Volonté » est l’équivalent français usuel et précis pour ce que Dieu veut voir accompli.
- source_word: ἐκ ψυχῆς
  choice: du fond de l’âme
  rationale: Cette expression française naturelle conserve le mot « âme » et exprime l’engagement intérieur et sincère porté par la tournure grecque.
theological_decisions:
- issue: Traduction de δοῦλοι dans le cadre des relations entre esclaves et maîtres
  choice: esclaves du Messie
  alternative: serviteurs du Christ
  rationale: Puisque les destinataires immédiats sont de véritables esclaves et que Paul redéfinit leur appartenance en relation avec le Messie, « esclaves » préserve la tension et la portée du texte sans l’atténuer.
- issue: Valeur titulaire de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme grec signifie « Oint » et peut fonctionner comme un titre. « Messie » rend cette valeur explicitement, tandis qu’une note signale la traduction traditionnelle « Christ ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation principale privilégie l’intelligibilité de l’expression rare ὀφθαλμοδουλία, tout en en conservant l’image dans une note. « Esclaves » maintient la dureté historique et rhétorique du contexte; « du fond de l’âme » reste idiomatique sans effacer ψυχή.
