id: EPH.6.9
reference: Ephesians 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: fr
  text: 'Et vous, maîtres, agissez de même envers eux[a] : renoncez aux menaces[b], sachant que leur Maître comme le vôtre est dans les cieux[c] et qu’il ne fait preuve d’aucune partialité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faites de même à leur égard » ou « traitez-les de la même manière ». Le grec reprend étroitement l’instruction précédente et souligne la réciprocité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « relâchant la menace » ; le sens est de cesser ou d’abandonner la pratique des menaces.
    reason: lexical_alternative
  - marker: c
    text: Le grec porte le pluriel « dans les cieux ».
    reason: source_form
lexical_decisions:
- source_word: κύριοι
  choice: maîtres
  rationale: Dans ce code domestique, le terme désigne les maîtres humains par rapport aux esclaves mentionnés juste avant. « Maîtres » conserve la réalité sociale ancienne sans l’anachronisme d’« employeurs ».
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: agissez de même envers eux
  rationale: Cette formulation française naturelle conserve le rappel réciproque des instructions précédentes et rend πρός par « envers ».
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: renoncez aux menaces
  rationale: 'Le participe précise la manière d’obéir à l’impératif principal : abandonner la pratique des menaces. En français, un second impératif coordonné exprime clairement cette force.'
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe grec est conservé et présente la connaissance qui motive les commandements.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: leur Maître comme le vôtre
  rationale: '« Maître » maintient ici le jeu rhétorique du même lemme κύριος : les maîtres terrestres ont eux-mêmes un Maître céleste. La majuscule signale le référent divin sans effacer l’écho lexical.'
- source_word: ἐν οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel français est naturel dans un registre biblique digne et correspond directement au pluriel grec.
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: il ne fait preuve d’aucune partialité
  rationale: Cette tournure idiomatique exprime l’absence de favoritisme chez Dieu tout en gardant le substantif judiciaire et théologique « partialité ».
theological_decisions:
- issue: Même terme κύριος appliqué aux maîtres humains et au Maître céleste
  choice: Rendre κύριοι et κύριος par « maîtres » et « Maître »
  alternative: Employer « Seigneur » pour le référent divin
  rationale: Le contexte fonde l’exhortation sur le fait que les maîtres terrestres sont eux aussi soumis à un Maître céleste. Conserver le même mot français préserve ce contraste rhétorique sans nier que κύριος puisse ailleurs être le titre « Seigneur ».
- issue: Rapport social du code domestique
  choice: Conserver « maîtres »
  alternative: Moderniser en « employeurs » ou préciser « propriétaires »
  rationale: « Employeurs » transformerait anachroniquement l’institution évoquée, tandis que « propriétaires » serait plus étroit que le terme relationnel grec. « Maîtres » maintient la portée historique et éthique du texte.
- issue: Impartialité divine
  choice: Dire qu’il ne fait preuve d’« aucune partialité »
  alternative: Dire qu’il n’a « aucun favoritisme »
  rationale: « Partialité » restitue naturellement le caractère impartial du jugement divin et conserve une tonalité plus judiciaire, sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset garde la reprise directe « Et vous, maîtres », la réciprocité de l’exhortation et le jeu entre les maîtres terrestres et leur Maître céleste. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
