  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: fr
  text: Servez avec bonne volonté, comme pour le Seigneur et non pour des êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: de bon gré
  rationale: Cette expression rend de façon naturelle la disposition favorable et volontaire exprimée par εὔνοια, sans réduire celle-ci à une simple émotion.
- source_word: δουλεύοντες
  choice: Servez
  rationale: Le participe de δουλεύω désigne ici le fait d’accomplir un service dans la condition d’esclave, déjà explicite dans le contexte immédiat. L’impératif français restitue naturellement sa valeur d’exhortation dans la continuité de la phrase précédente.
- source_word: ὡς
  choice: comme pour
  rationale: Cette tournure exprime la manière et l’orientation du service sans introduire l’idée irréelle que pourrait suggérer « comme si ».
- source_word: τῷ κυρίῳ
  choice: le Seigneur
  rationale: « Seigneur » conserve le titre christologique et maintient la distinction avec les maîtres humains du contexte.
- source_word: ἀνθρώποις
  choice: des êtres humains
  rationale: Le pluriel ἀνθρώποις désigne ici les humains par contraste avec le Seigneur. Cette formulation moderne évite que « hommes » soit compris comme visant exclusivement le sexe masculin.
theological_decisions:
- issue: Rendu de κύριος dans le contexte du rapport entre esclaves et maîtres
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » préserve la portée christologique du terme et évite de confondre celui-ci avec les maîtres terrestres mentionnés dans le passage.
- issue: Force à donner à la nuance servile de δουλεύοντες
  choice: Servez
  alternative: Servez comme des esclaves
  rationale: Le contexte identifie déjà les destinataires comme esclaves. Expliciter de nouveau leur statut dans ce verset alourdirait le français, tandis que « servez » transmet clairement l’action demandée sans dissimuler le cadre du passage.
translation_notes:
  register: Français international moderne, direct et digne. « De bon gré » est idiomatique sans être familier; « des êtres humains » rend explicitement le contraste générique avec le Seigneur.
