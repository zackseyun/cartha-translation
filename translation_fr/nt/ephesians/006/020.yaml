  text: ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει, ἵνα ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: fr
  text: pour lequel[a] je suis ambassadeur dans les chaînes[b], afin que j’en parle avec assurance[c], comme je dois parler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom grec est neutre et renvoie probablement au « mystère de la bonne nouvelle » mentionné au verset précédent. Certains comprennent toutefois le référent de manière plus personnelle : « pour qui ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « dans une chaîne » ; « dans les chaînes » est l’expression française habituelle pour parler de l’emprisonnement.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « en cela ». Le pronom grec est neutre et renvoie probablement à la bonne nouvelle ou à son mystère ; certains l’ont toutefois compris au sens personnel : « en lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: pour lequel
  rationale: Le pronom relatif est au génitif singulier neutre et renvoie très probablement au « mystère de la bonne nouvelle » du verset précédent. En français, « mystère » étant masculin, « lequel » s’accorde naturellement avec cet antécédent.
- source_word: πρεσβεύω
  choice: je suis ambassadeur
  rationale: Le verbe désigne l’action d’un ambassadeur ou d’un envoyé officiel. Cette formulation conserve l’image forte et paradoxale d’un représentant officiel emprisonné.
- source_word: ἐν ἁλύσει
  choice: dans les chaînes
  rationale: Le grec emploie le singulier, mais le pluriel est l’expression française naturelle pour évoquer la détention tout en conservant l’image concrète des liens.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit ici le but recherché par la demande de prière.
- source_word: ἐν αὐτῷ
  choice: j’en parle
  rationale: Le pronom grec est neutre et renvoie probablement au mystère de la bonne nouvelle. La tournure française « en parler » exprime naturellement le lien avec ce message sans lui donner artificiellement un référent personnel.
- source_word: παρρησιάσωμαι
  choice: je parle avec assurance
  rationale: Le verbe exprime une parole franche, ouverte et courageuse. « Avec assurance » rend cette idée sans limiter le sens au seul courage intérieur.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: comme je dois parler
  rationale: Cette formulation conserve la nécessité ou l’obligation exprimée par δεῖ et la répétition du champ lexical de la parole présente dans le grec.
theological_decisions:
- issue: Référent de οὗ et de αὐτῷ
  choice: Les deux pronoms sont compris comme renvoyant au mystère de la bonne nouvelle mentionné au verset 19.
  alternative: Comprendre plus librement le référent comme une personne et traduire notamment ἐν αὐτῷ par « en lui ».
  rationale: Dans le texte grec fourni, les deux formes sont grammaticalement neutres. Le lien avec le « mystère de la bonne nouvelle » est donc le plus direct et évite d’introduire un référent personnel que la morphologie ne signale pas.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec, tandis que « j’en parle » et « dans les chaînes » assurent une expression idiomatique. La répétition de « parler » est conservée afin de refléter le texte source.
