  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: fr
  text: Que la grâce soit avec tous ceux qui aiment notre Seigneur Jésus le Messie dans l’incorruptibilité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « d’un amour impérissable »; autre possibilité : « dans la sincérité » ou « avec un amour qui ne meurt pas ». L’expression grecque, littéralement « dans l’incorruptibilité », est concise et ambiguë.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: la grâce
  rationale: Dans cette bénédiction finale paulinienne, « grâce » rend directement le nom grec et conserve le registre épistolaire.
- source_word: μετὰ πάντων
  choice: soit avec tous ceux
  rationale: La phrase grecque est sans verbe; le français exprime naturellement le souhait de bénédiction par le subjonctif « soit ». « Tous ceux » introduit la proposition participiale qui suit.
- source_word: ἀγαπώντων
  choice: qui aiment
  rationale: Le participe présent substantivé désigne ceux dont l’amour pour le Seigneur constitue une disposition durable; la relative est naturelle en français.
- source_word: κύριον ἡμῶν
  choice: notre Seigneur
  rationale: « Seigneur » est le rendu français usuel de κύριος comme titre christologique, et l’ordre français naturel place le possessif devant le nom.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre; « le Messie » en communique le sens en français moderne plutôt que de le traiter comme un simple nom propre.
- source_word: ἐν ἀφθαρσίᾳ
  choice: dans l’incorruptibilité
  rationale: Ce rendu formel conserve la concision et l’ambiguïté du grec, qui ne précise pas nettement si l’incorruptibilité caractérise l’amour, la manière d’aimer ou la sphère de la bénédiction.
theological_decisions:
- issue: Portée et sens de ἐν ἀφθαρσίᾳ
  choice: Maintenir dans le texte « dans l’incorruptibilité », formulation littérale et ambiguë.
  alternative: « d’un amour impérissable », « avec une fidélité incorruptible » ou « avec un amour qui ne meurt pas ».
  rationale: Le grec ne dit pas explicitement quel élément est qualifié par ἐν ἀφθαρσίᾳ. Une reformulation fluide centrée sur l’amour trancherait une question que le texte laisse ouverte; la note fournit donc les principales interprétations.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure de bénédiction « Que la grâce soit… » est naturelle dans ce contexte. Le syntagme final est volontairement plus formel afin de ne pas effacer l’ambiguïté de l’original; la note en donne des formulations françaises plus idiomatiques.
