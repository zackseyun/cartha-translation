source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: fr
  text: Car, par lui, nous avons les uns comme les autres accès, dans un seul Esprit, auprès du Père[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Parce que, par lui, nous avons accès… »
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « accès » peut aussi signifier « introduction » ou « approche ».
    reason: lexical_alternative
  - marker: c
    text: Ou « par un seul Esprit » ; « dans un seul Esprit » conserve la formulation grecque, qui peut exprimer soit le moyen, soit la sphère.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit l’explication ou le fondement de l’affirmation précédente. « Car » exprime naturellement ce rapport en français; « parce que » reste possible.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: διά avec le génitif marque ici l’intermédiaire ou le moyen. « Par lui » conserve le rôle médiateur du Christ sans alourdir la phrase.
- source_word: ἔχομεν
  choice: nous avons
  rationale: Le présent de l’indicatif énonce une réalité commune actuelle. « Nous avons » en est l’équivalent français direct et naturel.
- source_word: τὴν προσαγωγὴν
  choice: accès
  rationale: προσαγωγή peut désigner l’accès, l’introduction ou l’approche auprès d’une personne de haut rang. « Accès » rend clairement le privilège durable évoqué ici sans limiter l’image à une présentation initiale.
- source_word: οἱ ἀμφότεροι
  choice: les uns comme les autres
  rationale: L’expression renvoie aux deux ensembles auparavant séparés, Juifs et non-Juifs, tout en maintenant le « nous » inclusif. Cette tournure française est plus naturelle ici que « nous deux », qui pourrait suggérer seulement deux individus.
- source_word: ἐν ἑνὶ πνεύματι
  choice: dans un seul Esprit
  rationale: La traduction conserve la préposition ἐν et laisse ouverte sa nuance de moyen ou de sphère. Dans ce contexte paulinien, « Esprit » désigne très probablement l’Esprit saint.
- source_word: πρὸς τὸν πατέρα
  choice: auprès du Père
  rationale: Avec l’idée d’accès, « auprès du Père » exprime naturellement l’orientation vers sa présence. Cette formulation évite l’ajout de « Dieu », absent du grec.
theological_decisions:
- issue: Référent de « un seul Esprit »
  choice: l’Esprit saint
  alternative: un même esprit humain ou une disposition commune
  rationale: Le contexte associe « par lui » — le Christ —, « dans un seul Esprit » et « auprès du Père ». La majuscule indique le référent le plus probable sans ajouter d’explication au texte.
- issue: Portée de προσαγωγή
  choice: accès commun auprès du Père
  alternative: introduction formelle dans la présence du Père
  rationale: Le terme peut comporter une image de cour ou de culte, mais « accès » communique le privilège partagé et possiblement continu sans préciser excessivement la métaphore.
- issue: Valeur de ἐν devant « un seul Esprit »
  choice: « dans », pouvant exprimer la sphère ou le moyen
  alternative: « par », exprimant explicitement le moyen
  rationale: Le français « dans » suit la formulation grecque et préserve la tension sémantique; la note signale la traduction instrumentale possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Les uns comme les autres » rend idiomatiquement les deux groupes inclus dans le « nous »; « auprès du Père » convient naturellement à la construction avec « accès ». La ponctuation met en relief l’inclusion commune sans modifier les rapports syntaxiques.
