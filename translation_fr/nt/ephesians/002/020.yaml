id: EPH.2.20
reference: Ephesians 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: fr
  text: ayant été édifiés sur le fondement des apôtres et des prophètes[a], Jésus le Messie lui-même[b] étant la pierre angulaire,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « des apôtres et des prophètes » peut désigner le fondement associé à leur témoignage, le fondement posé par eux ou le fondement qu’ils constituent ; le génitif grec ne précise pas davantage.
    reason: lexical_alternative
  - marker: b
    text: Ou « Christ Jésus ». Le titre grec Χριστός est rendu ici par « Messie » pour en conserver le sens.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: ayant été édifiés
  rationale: Le participe aoriste passif désigne les destinataires comme intégrés à l’édifice de Dieu. « Ayant été édifiés » conserve la voix passive et le lien participial avec la phrase environnante.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: sur le fondement
  rationale: Avec le datif, ἐπί exprime ici l’appui ou la position dans la métaphore architecturale. « Sur le fondement » est naturel et précis en français.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: des apôtres et des prophètes
  rationale: 'Le génitif grec reste volontairement non précisé : il peut désigner le fondement associé à leur témoignage, posé par eux, ou constitué par eux.'
- source_word: ὄντος
  choice: étant
  rationale: Le participe du génitif absolu est conservé afin de ne pas ajouter une relation logique absente du grec.
- source_word: ἀκρογωνιαίου
  choice: la pierre angulaire
  rationale: Équivalent français courant du terme architectural désignant la pierre déterminante de l’angle; « clé de voûte » changerait l’image.
- source_word: αὐτοῦ
  choice: lui-même
  rationale: Le pronom renvoie à Χριστοῦ Ἰησοῦ et porte une valeur emphatique rendue naturellement par « lui-même ».
- source_word: Χριστοῦ Ἰησοῦ
  choice: le Messie Jésus
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en exprime le sens, tandis que la note signale la formulation traditionnelle « Christ Jésus ».
theological_decisions:
- issue: Sens du « fondement des apôtres et des prophètes »
  choice: 'Maintenir le génitif large : « le fondement des apôtres et des prophètes »'
  alternative: « le fondement posé par les apôtres et les prophètes » ou « le fondement constitué par les apôtres et les prophètes »
  rationale: Le grec ne précise pas si les apôtres et les prophètes posent le fondement, en constituent le contenu personnel, ou lui sont associés par leur témoignage. La traduction préserve cette tension.
- issue: Valeur de Χριστός
  choice: le Messie Jésus
  alternative: Christ Jésus
  rationale: Dans ce contexte théologique, Χριστός demeure intelligible comme titre; « Messie » en communique le sens sans réduire le mot à un nom propre.
translation_notes:
  register: Français international moderne, digne et accessible. Le fragment participial et la virgule finale sont conservés parce que le verset dépend syntaxiquement de son contexte. « Édifiés » maintient la métaphore de la construction; « construits » serait plus courant, mais moins naturel dans ce registre biblique.
