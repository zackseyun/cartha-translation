  text: not from works[a], so that no one may boast.
translation:
  language: fr
  text: cela ne vient pas des œuvres[a], afin que personne ne puisse se vanter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela n’est pas issu des œuvres ». La préposition grecque indique la source ou l’origine; certains comprennent aussi une nuance de moyen : « cela ne s’obtient pas par les œuvres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: cela ne vient pas de
  rationale: La négation porte sur l’expression de provenance introduite par ἐξ. En français, « ne vient pas de » exprime naturellement la source tout en assurant la continuité avec la proposition précédente.
- source_word: ἔργων
  choice: œuvres
  rationale: « Œuvres » correspond au terme paulinien sans le restreindre aux œuvres de la Loi, aux bonnes œuvres ou, plus largement, aux efforts humains.
- source_word: ἵνα μή
  choice: afin que… ne…
  rationale: Cette tournure française conserve la valeur de but, avec une possible nuance de résultat, de la construction grecque.
- source_word: τις
  choice: personne
  rationale: Après la négation, « personne » rend de façon idiomatique l’indéfini grec sans marquage de genre.
- source_word: καυχήσηται
  choice: puisse se vanter
  rationale: « Se vanter » rend directement le verbe καυχάομαι; « puisse » convient au subjonctif dans la proposition de but.
theological_decisions:
- issue: Sens des « œuvres »
  choice: Conserver le terme général « œuvres ».
  alternative: « œuvres de la Loi », « efforts humains » ou « bonnes œuvres »
  rationale: Le grec dit seulement ἔργων. Une précision supplémentaire résoudrait dans la traduction une question interprétative que le texte laisse ouverte.
- issue: Rapport logique introduit par ἵνα
  choice: Employer « afin que » pour exprimer principalement le but.
  alternative: « de sorte que » pour privilégier le résultat
  rationale: ἵνα peut présenter une finalité et, selon l’analyse du contexte, une conséquence. « Afin que » garde ici la force la plus courante de la construction sans nier une nuance résultative.
translation_notes:
  register: Français international moderne, clair et digne. Le démonstratif « cela » reprend naturellement, dans ce fragment de verset, ce qui précède. La formulation conserve le vocabulaire théologique de Paul sans ajouter « de la Loi » ni « bonnes ».
