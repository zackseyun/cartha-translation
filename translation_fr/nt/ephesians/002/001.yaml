  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: fr
  text: Quant à vous, vous étiez morts à cause de vos fautes et de vos péchés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « morts dans vos fautes et vos péchés » ; le grec peut indiquer la cause de cette mort ou la situation dans laquelle ils se trouvaient.'
    reason: Préserver l’ambiguïté sémantique du datif grec.
lexical_decisions:
- source_word: παραπτώμασιν
  choice: fautes
  rationale: « Fautes » rend l’idée d’écarts ou de transgressions sans confondre entièrement le terme avec ἁμαρτίαις.
- source_word: ἁμαρτίαις
  choice: péchés
  rationale: « Péchés » est le terme français naturel et précis pour les actes et l’état de rébellion envers Dieu.
- source_word: νεκρούς
  choice: morts
  rationale: Le terme conserve sans atténuation la métaphore forte de la mort spirituelle.
- source_word: τοῖς… καὶ ταῖς…
  choice: à cause de
  rationale: Le datif peut exprimer la cause ou la sphère; « à cause de » donne ici une phrase française claire tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Rapport entre la mort et les fautes/péchés
  choice: morts à cause de vos fautes et de vos péchés
  alternative: morts dans vos fautes et vos péchés
  rationale: Le grec permet une nuance causale ou sphérique. Le texte retient la lecture causale naturelle en français et préserve l’ambiguïté dans une note.
- issue: Forme participiale grecque et syntaxe française
  choice: vous étiez morts
  alternative: étant morts
  rationale: Le participe ὄντας dépend d’une construction qui se poursuit au-delà de ce verset. Une proposition verbale autonome respecte le découpage du verset et produit un français naturel, sans modifier le constat théologique.
translation_notes:
  register: Français international moderne, sobre et digne. « Quant à vous » restitue la mise en relief de ὑμᾶς, tandis que « vous étiez morts » forme une phrase intelligible dans le découpage isolé du verset.
