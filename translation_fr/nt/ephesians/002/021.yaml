id: EPH.2.21
reference: Ephesians 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: fr
  text: En lui, tout l’édifice[a], bien assemblé, grandit pour devenir un temple saint dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque édifice ». L’expression grecque peut désigner soit l’édifice tout entier, soit chaque édifice; le texte principal suit l’image contextuelle d’un temple unifié.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui
  rationale: Le relatif renvoie le plus naturellement au Christ mentionné au verset précédent. « En lui » conserve la portée personnelle et relationnelle de la formule paulinienne.
- source_word: πᾶσα οἰκοδομὴ
  choice: tout l’édifice
  rationale: La construction grecque peut être comprise collectivement ou distributivement. Le contexte de l’unification en un seul peuple et de l’image d’un temple unique favorise ici le sens collectif.
- source_word: συναρμολογουμένη
  choice: bien assemblé
  rationale: Le participe présent passif décrit un processus continu par lequel les différentes parties sont ajustées et unies en un ensemble cohérent, tout en préservant la métaphore architecturale.
- source_word: αὔξει
  choice: grandit
  rationale: Le présent indique une croissance en cours. « Grandit » rend naturellement l’image organique appliquée à l’édifice.
- source_word: εἰς
  choice: pour devenir
  rationale: La préposition marque ici le but ou le résultat de la croissance. Cette formulation est plus naturelle en français que le calque « grandit en ».
- source_word: ναὸν ἅγιον
  choice: un temple saint
  rationale: ναός désigne le sanctuaire du temple. « Temple saint » reste clair en français courant et conserve directement la qualification de sainteté.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La traduction littérale préserve l’ampleur de la formule, qui peut exprimer la sphère, l’union ou la relation au Seigneur sans trancher davantage.
theological_decisions:
- issue: 'Antécédent de ᾧ : le Christ personnellement ou l’image de l’édifice'
  choice: 'Référence personnelle au Christ : « En lui »'
  alternative: 'Référence impersonnelle : « En celui-ci » ou « dans lequel »'
  rationale: Le contexte immédiat désigne Jésus-Christ lui-même comme pierre angulaire, et la reprise « en lui » au verset suivant confirme une référence christologique personnelle.
- issue: Sens collectif ou distributif de πᾶσα οἰκοδομὴ
  choice: 'Sens collectif : « tout l’édifice »'
  alternative: 'Sens distributif : « chaque édifice »'
  rationale: Le contexte met l’accent sur l’unité des Juifs et des non-Juifs en un peuple et un temple. Cependant, la forme grecque sans article permet réellement la lecture distributive, qui est donc signalée en note.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la métaphore mêlant assemblage architectural et croissance organique. « Bien assemblé » est idiomatique sans surcharger le texte, et « dans le Seigneur » maintient la formulation théologiquement ouverte de Paul.
