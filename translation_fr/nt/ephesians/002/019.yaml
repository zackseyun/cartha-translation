id: EPH.2.19
reference: Ephesians 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: fr
  text: Ainsi donc, vous n’êtes plus des étrangers ni des résidents étrangers[a] ; mais vous êtes concitoyens des saints[b] et membres de la maisonnée de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « immigrés résidents ». Le terme grec désigne des personnes vivant dans un pays sans y jouir de la pleine citoyenneté.
    reason: lexical_alternative
  - marker: b
    text: Ici, « saints » désigne des personnes mises à part pour Dieu, et non une catégorie particulière de personnes canonisées.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Cette locution française rend naturellement les deux particules qui introduisent une conclusion tirée de l’argument précédent.
- source_word: οὐκέτι
  choice: vous n’êtes plus
  rationale: Rend clairement la négation temporelle et le changement de statut.
- source_word: ξένοι
  choice: étrangers
  rationale: Conserve l’idée de personnes étrangères au groupe ou qui ne lui appartiennent pas, en contraste avec la citoyenneté et la maison.
- source_word: πάροικοι
  choice: résidents étrangers
  rationale: Exprime la situation de personnes établies dans un lieu sans y posséder la pleine citoyenneté, tout en distinguant le terme de ξένοι.
- source_word: συμπολῖται
  choice: concitoyens
  rationale: Rend de façon concise et idiomatique la citoyenneté partagée exprimée par le composé grec.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Respecte la forme génitive et préserve l’étendue potentiellement ambiguë du référent sans la limiter dans le corps du texte.
- source_word: οἰκεῖοι
  choice: membres de la maison
  rationale: Explicite en français courant l’appartenance au foyer ou à la maisonnée évoquée par le terme grec.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le complément du nom est la tournure française naturelle pour exprimer ici l’appartenance de la maison à Dieu.
theological_decisions:
- issue: Référent de « les saints » (τῶν ἁγίων)
  choice: Conserver « les saints » dans le texte, au sens des personnes consacrées à Dieu, sans préciser davantage leur identité.
  alternative: Traduire « le peuple saint de Dieu », « les croyants juifs » ou comprendre une référence aux anges.
  rationale: Dans le contexte, Paul décrit l’intégration de ses destinataires au peuple et à la maison de Dieu. Le terme général maintient toutefois l’ambiguïté réelle quant à l’étendue exacte du groupe.
- issue: Rapport exprimé par le génitif τῶν ἁγίων
  choice: « concitoyens des saints »
  alternative: « concitoyens avec les saints »
  rationale: Le génitif grec peut naturellement marquer le groupe auquel appartient la citoyenneté partagée. La formulation retenue reste proche de la syntaxe source sans changer le sens en appartenance exclusive aux saints.
translation_notes:
  register: Français international moderne, digne et accessible. « Résidents étrangers » conserve la nuance civique de πάροικοι ; « membres de la maison de Dieu » rend explicite la métaphore familiale sans l’aplatir. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
