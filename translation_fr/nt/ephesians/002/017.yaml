base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: fr
  text: Il est venu vous annoncer[b] la paix, à vous qui étiez loin[a], et la paix à ceux qui étaient près.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, ceux qui étaient loin sont les non-Juifs, et ceux qui étaient près, les Juifs (voir Éphésiens 2.11-13).
    reason: cross_reference
  - marker: b
    text: 'Ou : « annoncer la bonne nouvelle de la paix ». Le verbe grec signifie souvent « annoncer une bonne nouvelle », mais ici son complément est simplement « la paix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Il est venu
  rationale: Le participe aoriste exprime ici une action préparatoire ou concomitante. Cette formulation naturelle conserve l’image de la venue sans alourdir la phrase.
- source_word: εὐηγγελίσατο
  choice: annoncer
  rationale: Le verbe signifie annoncer une bonne nouvelle. Comme son complément direct est ici « la paix », « annoncer » convient naturellement tout en gardant le sens de proclamation; une note signale la nuance de bonne nouvelle.
- source_word: εἰρήνην
  choice: la paix
  rationale: Équivalent direct qui conserve les résonances de réconciliation et de bien-être global dans le contexte.
- source_word: ὑμῖν
  choice: à vous
  rationale: Rend directement le datif et maintient l’adresse aux destinataires.
- source_word: τοῖς μακρὰν
  choice: vous qui étiez loin
  rationale: Préserve la métaphore de l’éloignement ainsi que le lien syntaxique entre « vous » et ce premier groupe.
- source_word: τοῖς ἐγγύς
  choice: ceux qui étaient près
  rationale: Conserve le parallélisme et le contraste avec ceux qui étaient loin, sans expliciter dans le texte leur identité contextuelle.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: La répétition coordonne les deux groupes et reflète simplement la structure grecque.
theological_decisions:
- issue: Identité de ceux qui étaient loin et de ceux qui étaient près
  choice: Conserver les catégories métaphoriques « loin » et « près » dans le texte.
  alternative: Expliciter « les non-Juifs » et « les Juifs ».
  rationale: Le contexte désigne respectivement les non-Juifs et les Juifs, mais le verset emploie lui-même une métaphore. La traduction préserve donc la rhétorique de Paul et place l’explication en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme du grec et sa métaphore spatiale, tout en évitant d’introduire l’interprétation contextuelle directement dans le verset.
