source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: fr
  text: alors même que nous étions morts dans nos fautes, il nous a rendus à la vie avec le Messie[a] — c’est par grâce que vous avez été sauvés —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « Messie »; il est traditionnellement rendu par « Christ ».
    reason: Signaler la traduction traditionnelle tout en explicitant le sens du titre grec.
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: alors même que nous étions morts
  rationale: La construction participiale peut être temporelle ou concessive. « Alors même que » conserve ces deux nuances en soulignant que l’action de Dieu intervient dans cet état de mort, sans transformer explicitement le participe en proposition causale.
- source_word: τοῖς παραπτώμασιν
  choice: dans nos fautes
  rationale: Le datif peut désigner la sphère ou le domaine dans lequel nous étions morts. « Dans nos fautes » reste proche de cette formulation; « nos » est explicité naturellement d’après le sujet à la première personne du pluriel et le contexte immédiat.
- source_word: συνεζωοποίησεν
  choice: il nous a fait revivre avec
  rationale: Le verbe composé exprime le fait de donner la vie et l’association. « Faire revivre avec » rend ces deux éléments, la personne avec laquelle cette vie est donnée étant précisée par le complément suivant.
- source_word: τῷ Χριστῷ
  choice: le Messie
  rationale: 'Χριστός garde ici sa valeur de titre messianique. Le datif est compris comme associatif: Dieu nous fait revivre avec le Messie.'
- source_word: χάριτί
  choice: par grâce
  rationale: Le datif indique ici le moyen ou le fondement. « Par grâce » est une expression française établie, précise et accessible.
- source_word: ἐστε σεσῳσμένοι
  choice: vous êtes sauvés
  rationale: La périphrase au parfait présente un salut accompli dont l’état présent demeure. « Vous êtes sauvés » conserve clairement cet état résultant ainsi que la voix passive.
theological_decisions:
- issue: Traduction de Χριστῷ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme fonctionne ici comme un titre. « Le Messie » en rend le sens, tandis que la note signale la formulation traditionnelle « le Christ » sans imposer une différence théologique.
- issue: Valeur de χάριτί ἐστε σεσῳσμένοι
  choice: conserver l’incise entre tirets
  alternative: intégrer l’expression sans ponctuation marquée
  rationale: L’insertion abrupte anticipe le développement des versets 8–9 et met la grâce en relief. Les tirets préservent cet effet rhétorique sans ajouter d’explication.
- issue: Nuance temporelle ou concessive du participe ὄντας
  choice: alors même que
  alternative: quand / tandis que
  rationale: « Alors même que » garde ensemble la circonstance temporelle et la portée concessive probable, sans trancher plus que ne le permet la construction grecque.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme de la phrase grecque est conservé, notamment par l’incise finale entre tirets. « Fautes » est préféré à « transgressions », plus technique, et « faire revivre » à une formulation plus abstraite comme « vivifier ».
