id: EPH.2.12
reference: Ephesians 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: fr
  text: qu’en ce temps-là, vous étiez sans le Messie[a], tenus à l’écart de la communauté d’Israël et étrangers aux alliances de la promesse[b], sans espérance et sans Dieu[c] dans le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans Christ ». Le titre grec Χριστός peut se traduire des deux manières ; ici, « Messie » en souligne le sens dans le contexte d’Israël et des alliances.
    reason: alternative_reading
  - marker: b
    text: Ou « aux alliances de promesse ».
    reason: lexical_alternative
  - marker: c
    text: Ou « impies ». Ici, l’expression peut désigner le fait d’être sans le vrai Dieu plutôt qu’un athéisme philosophique.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: sans le Messie
  rationale: Dans ce contexte lié à Israël et aux alliances, Χριστός fonctionne comme un titre. « Messie » en restitue le sens juif et messianique, tandis que la note conserve « Christ » comme traduction possible.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: séparés de la communauté d’Israël
  rationale: Le participe parfait passif décrit un état durable de séparation. « Communauté » rend ici la réalité collective et civique de πολιτεία sans réduire le terme au seul statut juridique individuel.
- source_word: ξένοι
  choice: étrangers à
  rationale: Le terme désigne ceux qui restent en dehors d’une sphère sociale et relationnelle; cette tournure française convient naturellement avec « alliances ».
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: aux alliances de la promesse
  rationale: Le pluriel « alliances » et le singulier « promesse » sont tous deux conservés, de même que le rapport génitif concis et légèrement ouvert du grec.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: sans espérance
  rationale: Cette formulation actuelle et concise exprime fidèlement l’absence d’espérance décrite par le participe grec.
- source_word: ἄθεοι
  choice: sans Dieu
  rationale: Dans ce contexte, le mot décrit la condition de personnes privées de relation avec Dieu plutôt qu’une adhésion à l’athéisme philosophique moderne.
- source_word: ἐν τῷ κόσμῳ
  choice: dans le monde
  rationale: La traduction directe convient au monde comme cadre de l’existence humaine.
theological_decisions:
- issue: Valeur de Χριστός dans le contexte paulinien
  choice: le Messie
  alternative: Christ
  rationale: La proximité d’Israël, des alliances et de la promesse met en relief la valeur titulaire et juive du terme; la variante traditionnelle est signalée sans effacer cette dimension.
- issue: Portée de ἄθεοι
  choice: sans Dieu
  alternative: impies
  rationale: « Sans Dieu » préserve l’idée de privation ou d’absence de relation avec le vrai Dieu, sans importer la catégorie moderne d’un athéisme doctrinal.
- issue: Rapport entre les alliances et la promesse
  choice: les alliances de la promesse
  alternative: les alliances liées à la promesse
  rationale: La formulation retenue conserve la densité et l’ambiguïté relative du génitif grec au lieu d’en préciser arbitrairement la nature.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression du grec et son vocabulaire relationnel et collectif, tout en évitant les archaïsmes et les catégories philosophiques anachroniques.
