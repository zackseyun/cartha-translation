  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: fr
  text: 'Car c’est lui-même qui est notre paix : il a fait des deux un[a] et a abattu, dans sa chair[c], le mur qui les séparait — la barrière qu’était l’hostilité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des deux un ». Les deux désignent ici les Juifs et les non-Juifs.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le mur médian de la clôture — l’hostilité ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « dans sa chair »; l’expression renvoie ici à ce qu’il a accompli corporellement, notamment par sa mort, et non à la suppression de son humanité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν
  choice: Car c’est lui-même qui est notre paix
  rationale: « Lui-même » conserve l’insistance de αὐτός, tandis que « car » maintient le lien explicatif avec ce qui précède.
- source_word: τὰ ἀμφότερα ἓν
  choice: il a fait des deux un seul peuple
  rationale: « Des deux » reste proche du grec; « un seul peuple » explicite naturellement l’unité collective des Juifs et des non-Juifs indiquée par le contexte.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: le mur qui les séparait, la barrière
  rationale: Cette formulation française rend l’image d’un mur médian formant une séparation, sans imposer un référent historique précis.
- source_word: λύσας
  choice: il a abattu
  rationale: Pour un mur, « abattre » exprime naturellement le démantèlement ou la suppression suggérés par λύω.
- source_word: τὴν ἔχθραν
  choice: l’hostilité
  rationale: Terme moderne et clair qui conserve l’idée d’opposition relationnelle.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: dans sa chair
  rationale: Rendu formel de σάρξ qui préserve la concrétude corporelle et évite l’interprétation erronée « nature pécheresse ».
theological_decisions:
- issue: Référent de « des deux »
  choice: « un seul peuple », avec une note identifiant les Juifs et les non-Juifs
  alternative: Laisser simplement « des deux un »
  rationale: Le contexte immédiat désigne les deux ensembles; l’explicitation produit un français naturel sans introduire une distinction étrangère au passage.
- issue: Rapport de « l’hostilité » avec le mur et l’action
  choice: Présenter « l’hostilité » comme une explication de la barrière
  alternative: Rattacher « l’hostilité » à la proposition suivante ou en faire un objet entièrement distinct
  rationale: L’apposition rend la construction grecque et préserve la continuité de la pensée, sans confondre l’hostilité avec la chair du Christ.
- issue: Portée de « dans sa chair »
  choice: Le placer près du verbe « a abattu »
  alternative: « la barrière — l’hostilité dans sa chair »
  rationale: Cette position évite de suggérer que l’hostilité résidait dans la chair du Christ, tout en conservant une certaine ambiguïté syntaxique présente dans le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue l’apposition « l’hostilité » de « dans sa chair » afin d’éviter une lecture trompeuse, tout en gardant l’image concrète du mur et de la barrière.
