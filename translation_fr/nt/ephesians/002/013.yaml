source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: fr
  text: Mais maintenant, dans le Messie Jésus, vous qui étiez autrefois loin[a] avez été rapprochés[b] par le sang du Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éloignés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « vous êtes devenus proches ».
    reason: lexical_alternative
  - marker: c
    text: Ou « au moyen du sang du Messie »; littéralement, « dans le sang du Messie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Rend à la fois la transition adversative marquée par δέ et le contraste temporel appuyé par νυνί avec la situation antérieure.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Dans » conserve le langage paulinien d’union et d’appartenance; « Messie » traduit Χριστός comme titre plutôt que de le traiter comme un nom propre.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: vous qui autrefois étiez
  rationale: Formulation française naturelle qui préserve le contraste avec l’état passé exprimé par ποτε et ὄντες.
- source_word: μακρὰν
  choice: loin
  rationale: Équivalent français direct et idiomatique de l’adverbe de distance, apte à porter ici sa portée relationnelle sans l’expliciter excessivement.
- source_word: ἐγενήθητε ἐγγὺς
  choice: vous êtes devenus proches
  rationale: Rend directement le changement d’état exprimé par γίνομαι et évite d’introduire explicitement un agent que la forme grecque ne nomme pas.
- source_word: ἐν τῷ αἵματι
  choice: par le sang
  rationale: Comprend ἐν dans un sens instrumental et exprime naturellement en français le moyen de ce rapprochement, tout en signalant en note l’autre nuance possible.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Traduit Χριστός selon sa valeur titulaire et maintient la cohérence avec la première occurrence du verset.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός garde ici sa portée de titre. « Messie » en communique le sens plutôt que de recourir à la forme traditionnellement translittérée « Christ ».
- issue: Valeur de ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: par le sang du Messie
  alternative: dans le sang du Messie / au moyen du sang du Messie
  rationale: 'La valeur instrumentale convient au contexte et reste théologiquement sobre: le texte présente le sang du Messie comme le moyen du rapprochement sans développer davantage la théorie de l’expiation.'
- issue: Voix et agent dans ἐγενήθητε ἐγγὺς
  choice: vous êtes devenus proches
  alternative: vous avez été rapprochés
  rationale: La formulation retenue reflète directement le changement d’état exprimé par l’aoriste de γίνομαι et n’ajoute pas un agent grammatical explicite; l’alternative française peut mieux faire sentir l’action subie, mais interprète davantage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition de « Messie » et le langage spatial « loin/proches », essentiel au contraste du texte. Les notes préservent les principales ambiguïtés lexicales et grammaticales sans alourdir le corps du verset.
