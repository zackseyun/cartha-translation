source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: fr
  text: et de les réconcilier tous deux avec Dieu en un seul corps, par la croix, en y mettant à mort l’hostilité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: réconcilier
  rationale: Rend le verbe de réconciliation avec Dieu de façon naturelle et précise, dans la continuité syntaxique du contexte.
- source_word: τοὺς ἀμφοτέρους
  choice: tous deux
  rationale: Conserve la référence aux deux groupes mentionnés dans le contexte, sans les expliciter dans ce verset.
- source_word: ἐν ἑνὶ σώματι
  choice: en un seul corps
  rationale: Préserve l’image corporelle et l’unité produite sans préciser abusivement si le corps désigne ici le corps du Christ ou la communauté unifiée.
- source_word: τὴν ἔχθραν
  choice: l’hostilité
  rationale: Exprime la relation d’inimitié sans la réduire à un simple sentiment personnel.
- source_word: ἀποκτείνας
  choice: en tuant
  rationale: Maintient la force de l’image de mise à mort employée par le grec.
- source_word: ἐν αὐτῷ
  choice: par elle
  rationale: Interprète le pronom comme renvoyant à la croix et ἐν dans un sens instrumental, conformément au contexte immédiat, tout en évitant le peu naturel « en elle ».
theological_decisions:
- issue: Référent de « un seul corps »
  choice: Laisser l’expression non explicitée
  alternative: « dans son seul corps » ou « en formant un seul corps »
  rationale: Le grec dit simplement ἐν ἑνὶ σώματι. Une explicitation trancherait une ambiguïté interprétative entre le corps crucifié du Christ et le corps uni constitué des deux groupes.
- issue: Référent et valeur de ἐν αὐτῷ
  choice: « par elle », renvoyant à la croix
  alternative: « en lui », renvoyant au corps ou au Christ
  rationale: Le féminin français « elle » reprend naturellement « la croix » et reflète la lecture instrumentale retenue par le texte de consultation, mais le grec permet une discussion sur le référent du pronom.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure grecque tout en évitant une syntaxe artificielle. « Tous deux » suppose le contexte précédent, comme le texte source.
