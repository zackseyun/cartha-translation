  source_fidelity: Le sens général est fidèle. Toutefois, « pour accomplir de bonnes œuvres » explicite ἐπὶ ἔργοις ἀγαθοῖς par un infinitif absent du grec et anticipe inutilement l’action ensuite exprimée par « afin que nous les pratiquions ». « Pour de bonnes œuvres » reproduit plus directement la construction de but, tout en restant naturel en français biblique actuel.
  naturalness: « Car nous sommes son ouvrage » et « en Jésus le Messie » sont clairs et d’un registre international actuel. « Pour de bonnes œuvres » est idiomatique dans ce contexte et évite la répétition conceptuelle « accomplir / pratiquer ». La note explique utilement l’image grecque de la marche.
  terminology: « Ouvrage » rend bien ποίημα. « Créés », « Jésus le Messie », « bonnes œuvres » et « préparées d’avance » sont fidèles aux termes et à leur registre. Le titre « Messie » est correctement traduit plutôt que remplacé par une simple translittération traditionnelle.
