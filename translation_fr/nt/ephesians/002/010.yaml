  rationale: La révision remplace seulement l’infinitif interprétatif « accomplir » par « pour de bonnes œuvres », plus proche de ἐπὶ ἔργοις ἀγαθοῖς. Elle maintient la distinction du grec entre la finalité de la création et le but selon lequel les croyants doivent vivre dans ces œuvres. La note et son ancre restent appropriées.
