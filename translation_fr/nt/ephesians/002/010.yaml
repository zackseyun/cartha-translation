source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: fr
  text: Car nous sommes son ouvrage, créés en Jésus le Messie pour de bonnes œuvres, que Dieu a préparées d’avance afin que nous les pratiquions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que nous marchions en elles ». Dans cet emploi, « marcher » désigne la manière de vivre ou de se conduire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ γάρ ἐσμεν ποίημα
  choice: Car nous sommes son ouvrage
  rationale: « Car » maintient le lien explicatif avec le contexte précédent. « Son ouvrage » présente les croyants comme ce que Dieu a réalisé, en conservant le sens concret de ποίημα sans suggérer un mécanisme impersonnel.
- source_word: κτισθέντες
  choice: créés
  rationale: Le participe aoriste passif exprime l’action créatrice dont les croyants sont les bénéficiaires. Le participe français s’intègre naturellement à la proposition principale.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: « Messie » traduit la valeur de titre de Χριστός, tandis que l’ordre français « Jésus le Messie » est plus naturel et intelligible que « le Messie Jésus ». « En » conserve la formulation paulinienne sans expliciter davantage la nature de cette union.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: pour accomplir de bonnes œuvres
  rationale: Avec le datif, ἐπί indique ici la visée de la création. Cette formulation française exprime clairement ce but tout en conservant le vocabulaire éthique des « bonnes œuvres ».
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: que Dieu a préparées d’avance
  rationale: Le relatif renvoie aux bonnes œuvres. « D’avance » rend explicitement le préverbe προ- sans développer une doctrine dépassant l’énoncé du texte.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: afin que nous les pratiquions
  rationale: La proposition exprime le but. « Les pratiquions » rend naturellement en français le sens métaphorique de « marcher dans » ces œuvres; la note conserve l’image grecque.
theological_decisions:
- issue: Valeur de Χριστός comme titre
  choice: Jésus le Messie
  alternative: Jésus-Christ / le Christ Jésus
  rationale: Le choix traduit Χριστός comme le titre « Messie » plutôt que de le traiter comme un simple élément du nom. L’ordre a été adapté à l’usage naturel du français sans modifier la relation entre le titre et Jésus.
- issue: Rapport entre la préparation divine et la conduite humaine
  choice: que Dieu a préparées d’avance, afin que nous les pratiquions
  alternative: que Dieu a préparées d’avance pour que nous marchions en elles
  rationale: La formulation maintient à la fois l’initiative préalable de Dieu et la vocation des croyants à agir, sans trancher des débats théologiques plus larges que le texte.
translation_notes:
  register: Français international actuel, clair et digne. « Son ouvrage » conserve l’image de l’œuvre façonnée par Dieu; « de bonnes œuvres » reste immédiatement compréhensible. La métaphore de la marche, peu naturelle dans la phrase française, est signalée en note.
