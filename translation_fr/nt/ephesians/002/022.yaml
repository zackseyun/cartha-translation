source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: fr
  text: En lui, vous aussi, vous êtes édifiés ensemble pour devenir une habitation pour Dieu dans l’Esprit[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans cet édifice », si le relatif renvoie à l’ensemble de la construction plutôt que directement au Christ.
    reason: alternative_reading
  - marker: b
    text: Ou « dans l’esprit » ou « par l’Esprit ». L’expression peut indiquer la sphère dans laquelle Dieu habite ou l’action de l’Esprit Saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui
  rationale: Le relatif renvoie très probablement au Christ dans le fil des versets 20–21. Le français « en lui » conserve cette relation personnelle et la formulation paulinienne.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: « Aussi » rend la valeur additive de καί, tandis que le pronom explicite ὑμεῖς maintient l’insistance sur les destinataires.
- source_word: συνοικοδομεῖσθε
  choice: vous êtes édifiés ensemble
  rationale: Le présent passif exprime un processus en cours; « ensemble » rend le préfixe συν-. « Édifiés » s’inscrit naturellement dans l’image de la construction, bien qu’il soit légèrement soutenu.
- source_word: εἰς κατοικητήριον
  choice: pour devenir une demeure
  rationale: εἰς indique ici le but ou le résultat. « Pour devenir » l’explicite naturellement en français, et « demeure » conserve l’image concrète d’un lieu où Dieu habite.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est conservé par la tournure française naturelle « une demeure de Dieu », qui peut désigner la demeure où Dieu habite sans surdéterminer la relation.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: Dans ce contexte ecclésial et cultuel, πνεῦμα désigne très probablement l’Esprit Saint. « Dans » préserve la préposition et laisse subsister le chevauchement possible entre sphère et moyen.
theological_decisions:
- issue: Référent de ἐν ᾧ
  choice: 'Le Christ : « En lui »'
  alternative: 'L’ensemble de l’édifice : « En celui-ci » ou « dans cet édifice »'
  rationale: Le contexte immédiat présente le Christ comme pierre angulaire et répète « en lui » au verset 21. Toutefois, la forme grecque permet aussi grammaticalement un renvoi à l’édifice; cette possibilité est signalée en note.
- issue: Sens de ἐν πνεύματι
  choice: 'Référence à l’Esprit Saint : « dans l’Esprit »'
  alternative: « spirituellement » ou « par l’Esprit »
  rationale: Le langage de demeure divine et l’usage paulinien favorisent la référence à l’Esprit Saint. La traduction maintient néanmoins ἐν par « dans », sans réduire la formule à la seule idée de moyen.
translation_notes:
  register: Français moderne, digne et accessible. « Édifiés ensemble » préserve avec précision la métaphore architecturale et l’aspect collectif; « pour devenir » rend clairement le but ou le résultat exprimé par εἰς. Les deux notes conservent les ambiguïtés réelles du grec.
