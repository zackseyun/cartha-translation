id: EPH.2.6
reference: Ephesians 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: fr
  text: il nous a ressuscités avec lui et nous a fait asseoir avec lui dans les lieux célestes, dans le Messie Jésus[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en Christ Jésus ».
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγειρεν
  choice: nous a ressuscités avec lui
  rationale: Le préfixe συν- exprime une participation commune. « Avec lui » en rend clairement la valeur associative, tandis que « ressuscités » convient au contexte de la résurrection du Messie.
- source_word: συνεκάθισεν
  choice: nous a fait asseoir avec lui
  rationale: Cette formulation rend le sens causatif du verbe et sa composante συν- sans préciser indûment qu’il s’agirait d’une intronisation.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: dans les lieux célestes
  rationale: L’expression désigne la sphère céleste. « Les lieux célestes » est une formulation française claire, traditionnelle et suffisamment proche de la tournure grecque substantivée.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Messie » traduit le titre Χριστός plutôt que de le reproduire sous la forme « Christ ». La préposition « dans » conserve la formulation paulinienne dense et son langage d’union, sans l’expliciter excessivement.
- source_word: καὶ … καὶ
  choice: et … et
  rationale: La répétition coordonne les deux actions divines et maintient leur progression cumulative.
theological_decisions:
- issue: Participation des croyants aux actes accomplis avec le Messie
  choice: Rendre deux fois la valeur de συν- par « avec lui »
  alternative: « nous a ressuscités ensemble et nous a fait asseoir ensemble »
  rationale: Le référent implicite est le Messie évoqué dans le contexte. « Avec lui » exprime naturellement en français la participation commune indiquée par les verbes composés, sans ajouter une interprétation étrangère au texte.
- issue: Valeur de Χριστός dans ἐν Χριστῷ Ἰησοῦ
  choice: « dans le Messie Jésus »
  alternative: « en Christ Jésus »
  rationale: Le choix principal rend explicitement le sens titulaire de Χριστός. L’alternative est signalée parce qu’elle est courante en français et conserve davantage la forme traditionnelle du nom composé.
- issue: Portée de ἐν dans l’expression finale
  choice: Conserver « dans »
  alternative: « unis au Messie Jésus »
  rationale: Le grec permet un langage dense d’incorporation ou d’union au Messie. La traduction conserve cette tension sans réduire la préposition à une paraphrase théologique unique.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste un segment coordonné à ce qui précède, d’où l’initiale minuscule et la virgule finale. « Dans le Messie Jésus » est volontairement plus marqué que l’usage ecclésial courant, afin de traduire Χριστός comme titre et de préserver la construction grecque.
