  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: fr
  text: Mais Dieu, riche en miséricorde, à cause de son grand amour pour nous,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste décisif avec la situation humaine décrite aux versets précédents.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: qui est riche en compassion
  rationale: Cette formulation naturelle en français conserve l’image grecque de la richesse et rend ἔλεος par « compassion », terme courant qui exprime la bonté active envers des personnes dans la détresse.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: à cause du grand amour
  rationale: Avec l’accusatif, διά indique la cause. « Grand amour » rend naturellement l’intensité exprimée par πολλήν, tandis que le possessif est implicite dans la construction française et repris par le sujet divin.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: dont il nous a aimés
  rationale: 'Ce tour conserve la proposition relative ainsi que la répétition voulue entre le nom ἀγάπη et le verbe ἀγαπάω : « amour… aimés ».'
theological_decisions:
- issue: Maintien de la répétition apparentée « amour… aimés »
  choice: « le grand amour dont il nous a aimés »
  alternative: « son grand amour pour nous »
  rationale: Le grec emploie délibérément un nom et un verbe de même racine. La légère solennité de la formulation française préserve cette insistance sans ajouter d’interprétation.
- issue: Rapport entre la compassion et l’amour
  choice: 'Conserver les deux notions distinctes : « riche en compassion, à cause du grand amour »'
  alternative: Les fusionner, par exemple en « à cause de son amour compatissant »
  rationale: Le texte grec associe la compassion et l’amour sans les identifier. Les maintenir séparés respecte sa texture théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La virgule finale est maintenue parce que le verset forme une proposition suspendue qui se poursuit au verset 5. « Qui est riche » est plus naturel en français que le calque participial « étant riche », tout en conservant le lien descriptif et causal du grec.
