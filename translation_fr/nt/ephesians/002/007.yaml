source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: fr
  text: afin de montrer, dans les siècles à venir, l’extraordinaire richesse de sa grâce dans sa bonté envers nous, dans le Messie Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le Messie Jésus »; on traduit souvent : « en Jésus-Christ ».'
    reason: La formulation française retenue conserve l’ordre des mots grecs et la valeur titulaire de Χριστός, tout en signalant la tournure traditionnelle.
lexical_decisions:
- source_word: ἵνα
  choice: afin de
  rationale: Introduit le but, avec une formulation française naturelle qui conserve la valeur finale de la proposition.
- source_word: ἐνδείξηται
  choice: montrer
  rationale: Rend le sens de faire voir ou manifester publiquement, sans alourdir la phrase.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: dans les siècles à venir
  rationale: Conserve le pluriel de αἰῶσιν et l’orientation future exprimée par ἐπερχομένοις; cette tournure est idiomatique en français.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: l’incomparable richesse
  rationale: Le singulier « richesse » correspond à πλοῦτος, tandis que « incomparable » exprime ce qui dépasse toute mesure ou comparaison.
- source_word: τῆς χάριτος αὐτοῦ
  choice: de sa grâce
  rationale: « Grâce » est le terme français courant et suffisamment large pour le don et la faveur de Dieu dans ce contexte paulinien.
- source_word: ἐν χρηστότητι
  choice: par sa bonté
  rationale: Exprime naturellement en français la manière dont Dieu manifeste la richesse de sa grâce; χρηστότης désigne ici une bonté bienveillante et généreuse.
- source_word: ἐφ’ ἡμᾶς
  choice: envers nous
  rationale: Conserve l’orientation bienveillante vers les bénéficiaires indiquée par ἐπί avec l’accusatif.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: Rend Χριστός comme le titre « Messie », garde l’ordre grec et préserve, sans l’expliciter davantage, la formule paulinienne d’inclusion ou d’union « dans » le Messie.
theological_decisions:
- issue: Valeur de ἐν dans ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: en union avec le Messie Jésus
  rationale: La traduction conserve la formulation relationnelle dense de Paul et évite de réduire ἐν à une seule explication théologique.
- issue: Statut de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός demeure ici un titre porteur de sens. « Messie » en donne le contenu en français au lieu de le traiter comme un simple élément de nom.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le mouvement final du grec, le pluriel temporel et la densité de la formule « dans le Messie », tout en rendant ἐν χρηστότητι par une relation de moyen naturelle en français.
