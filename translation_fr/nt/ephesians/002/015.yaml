source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: fr
  text: ayant aboli la loi des commandements formulés en prescriptions[a], afin de créer les deux en lui-même en un seul homme nouveau[b], faisant la paix,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi des commandements dans les prescriptions » ou « constituée de prescriptions »; traditionnellement, « dans les ordonnances ».
    reason: lexical_alternative
  - marker: b
    text: '« Un seul homme nouveau » est une image collective au singulier; autre traduction possible : « une seule humanité nouvelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν
  choice: la loi des commandements
  rationale: Cette formulation conserve le rapport génitif du grec et le caractère formel et covenantiel d’ἐντολή, sans imposer par la majuscule une interprétation plus large que celle qu’indique la qualification qui suit.
- source_word: ἐν δόγμασιν
  choice: formulés en prescriptions
  rationale: δόγμα désigne ici des prescriptions ou décrets. « Formulés en prescriptions » rend lisible en français le lien avec les commandements, tout en signalant en note les autres analyses grammaticales possibles.
- source_word: καταργήσας
  choice: ayant aboli
  rationale: Le participe aoriste exprime une action décisive liée à la proposition finale qui suit. « Aboli » préserve la force du verbe sans étendre son objet au-delà de la formulation précise du verset.
- source_word: ἵνα
  choice: afin de
  rationale: Rend naturellement la valeur finale de la conjonction grecque.
- source_word: τοὺς δύο
  choice: à partir des deux
  rationale: Conserve le numéral explicite, qui renvoie aux deux groupes du contexte, tout en donnant une construction française intelligible avec le verbe « créer » et le résultat introduit par εἰς.
- source_word: κτίσῃ
  choice: créer
  rationale: « Créer » garde la nuance forte de création nouvelle portée par κτίζω.
- source_word: ἐν αὑτῷ
  choice: en lui-même
  rationale: Le pronom réfléchi est rendu explicitement et situe en Christ l’acte unificateur décrit.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: un seul homme nouveau
  rationale: Cette traduction maintient l’image grecque, singulière et représentative, sans remplacer dans le texte l’image de l’homme nouveau par son interprétation collective.
- source_word: ποιῶν εἰρήνην
  choice: faisant ainsi la paix
  rationale: Le participe présent est conservé; « ainsi » explicite sobrement son lien avec l’action créatrice précédente sans ajouter une idée étrangère.
theological_decisions:
- issue: Portée collective de ἕνα καινὸν ἄνθρωπον
  choice: un seul homme nouveau
  alternative: une seule humanité nouvelle
  rationale: Le contexte associe Juifs et non-Juifs dans une réalité collective, mais le grec emploie une image personnelle au singulier. Le texte principal conserve donc cette tension, tandis que la note donne l’interprétation collective possible.
- issue: Force de καταργήσας à propos de la loi
  choice: ayant aboli
  alternative: ayant rendu sans effet
  rationale: Le terme grec est fort, et son objet est précisément « la loi des commandements formulés en prescriptions ». Cette traduction ne transforme pas la phrase en affirmation générale sur toute expression de la volonté divine.
- issue: Rapport syntaxique de ἐν αὑτῷ avec la création et son résultat
  choice: créer en lui-même, à partir des deux, un seul homme nouveau
  alternative: créer les deux en lui-même pour en faire un seul homme nouveau
  rationale: La place des compléments grecs permet plusieurs agencements français proches. Le texte choisi rattache naturellement « en lui-même » à « créer » et présente « un seul homme nouveau » comme le résultat, sans exclure l’autre disposition syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste au participe et commence par une minuscule afin de respecter son intégration syntaxique au contexte immédiat. « Prescriptions » est plus courant et moins marqué confessionnellement qu’« ordonnances ». L’expression « un seul homme nouveau » conserve volontairement l’image paulinienne, éclairée par une note.
