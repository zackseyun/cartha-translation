  verdict: revise
  source_fidelity: 'Le sens général est bien conservé : καταργήσας, la finalité introduite par ἵνα, la création des deux et l’image de l’« homme nouveau » sont rendus. Toutefois, « à partir des deux » affaiblit et modifie légèrement la construction grecque : τοὺς δύο est l’objet direct de κτίσῃ, et εἰς indique le résultat (« les deux ... en/pour un seul homme nouveau »).'
  naturalness: Le français est globalement moderne et clair. « Créer en lui-même, à partir des deux, un seul homme nouveau » est cependant moins direct et présente « les deux » comme une matière d’origine plutôt que comme les personnes/groupes que le Christ crée en une réalité nouvelle. « Faire ainsi la paix » est naturel, mais « faisant la paix » suffit et suit plus étroitement ποιῶν εἰρήνην.
  terminology: « La loi des commandements formulés en prescriptions » est une bonne solution pour τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν. « Prescriptions » convient à δόγμα dans ce contexte. « Un seul homme nouveau » préserve correctement l’image singulière et collective de ἕνα καινὸν ἄνθρωπον. « En lui-même » rend bien le réfléchi αὑτῷ.
