  rationale: 'La révision remplace « à partir des deux » par « les deux ... en un seul homme nouveau », afin de conserver la relation syntaxique entre l’objet τοὺς δύο, le verbe κτίσῃ et le complément de résultat εἰς ἕνα καινὸν ἄνθρωπον. Elle retire aussi « ainsi », ajout interprétatif non nécessaire. La note c est supprimée : elle n’est plus nécessaire au texte retenu et son agencement « pour en faire » explicite davantage le rapport de résultat que ne le fait le grec.'
