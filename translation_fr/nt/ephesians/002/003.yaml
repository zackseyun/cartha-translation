reference: Ephesians 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: fr
  text: Parmi eux[a], nous avons tous, nous aussi, vécu autrefois selon les désirs de notre chair[b], en accomplissant les volontés de la chair et des pensées[c] ; et nous étions par nature des enfants de colère[d], tout comme les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans lesquels ». Le grec peut renvoyer soit aux personnes caractérisées par la désobéissance, soit au domaine des fautes et des péchés mentionnés auparavant.'
    reason: alternative_reading
  - marker: b
    text: Le mot « chair » peut ici être compris au sens moral de « nature pécheresse », mais la traduction conserve le terme employé par Paul sans en réduire la portée.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « faisant les volontés de la chair et des pensées ».'
    reason: literal_rendering
  - marker: d
    text: 'Ou : « des personnes exposées à la colère ». « Enfants de colère » traduit littéralement l’expression grecque et laisse ouverte sa nuance exacte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Parmi eux
  rationale: Le relatif peut renvoyer personnellement aux « fils de la désobéissance » du verset précédent. « Parmi eux » exprime naturellement cette lecture tout en signalant l’autre possibilité en note.
- source_word: ἀνεστράφημέν
  choice: nous vivions
  rationale: Le verbe désigne ici la conduite ou la manière de vivre. « Nous vivions » est naturel en français moderne et convient à l’évocation d’un ancien mode de vie.
- source_word: ποτε
  choice: autrefois
  rationale: Le terme marque clairement l’état passé, antérieur au changement décrit dans le contexte.
- source_word: ἐπιθυμίαις
  choice: désirs
  rationale: « Désirs » garde la portée générale du mot et n’en limite pas indûment le sens aux convoitises sexuelles.
- source_word: σάρξ
  choice: chair
  rationale: « Chair » conserve le terme paulinien et sa tension anthropologique et morale, sans l’interpréter d’emblée comme une « nature pécheresse ».
- source_word: ποιοῦντες
  choice: accomplissant
  rationale: Dans ce contexte de conduite habituelle, « accomplissant » exprime la mise en pratique effective des volontés mentionnées, sans ajouter une idée étrangère.
- source_word: θελήματα
  choice: volontés
  rationale: Le pluriel « volontés » maintient la nuance volitive du grec et le distingue des « désirs » de la proposition précédente.
- source_word: διανοιῶν
  choice: pensées
  rationale: Le pluriel grec peut désigner les pensées, dispositions mentales ou raisonnements. « Pensées » est concis et laisse cette amplitude ouverte.
- source_word: τέκνα ὀργῆς
  choice: enfants de colère
  rationale: Cette formulation conserve l’idiome sémitisant du grec et ne tranche pas entre caractérisation, condition et exposition au jugement.
- source_word: φύσει
  choice: par nature
  rationale: La traduction formelle habituelle préserve la portée théologique débattue du terme sans la réduire à « de naissance ».
- source_word: οἱ λοιποί
  choice: les autres
  rationale: Expression française naturelle qui désigne le reste de l’humanité évoqué par la comparaison.
theological_decisions:
- issue: Sens moral de σάρξ dans l’anthropologie paulinienne
  choice: chair
  alternative: nature pécheresse
  rationale: Le contexte donne au mot une force morale, mais « nature pécheresse » imposerait une interprétation anthropologique plus précise que le grec. « Chair » préserve le vocabulaire et la tension de Paul.
- issue: Portée de τέκνα φύσει ὀργῆς
  choice: nous étions par nature des enfants de colère
  alternative: nous étions par naissance des objets de colère
  rationale: La formulation retenue suit de près le grec et évite de résoudre les débats sur la condition humaine, l’origine de cette condition et le rapport au jugement divin.
- issue: Référent de ἐν οἷς
  choice: Parmi eux
  alternative: Dans lesquels
  rationale: Le contexte immédiat favorise un renvoi personnel aux personnes caractérisées par la désobéissance, mais l’accord grammatical permet aussi un renvoi à la sphère des fautes et des péchés ; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le mouvement cumulatif de la phrase grecque, tandis que le point-virgule clarifie la transition vers l’affirmation finale. Les expressions théologiquement chargées « chair », « par nature » et « enfants de colère » sont volontairement maintenues sans paraphrase doctrinale.
