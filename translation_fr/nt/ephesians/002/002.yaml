  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: fr
  text: dans lesquels vous avez autrefois marché[a], selon le cours de ce monde[b], selon le prince de la puissance de l’air[c], l’esprit qui agit maintenant dans les fils de la désobéissance[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « marcher » signifie vivre ou se conduire d’une certaine manière.
    reason: clarification_metaphor
  - marker: b
    text: 'Ou : « selon l’ère de ce monde ». Le grec emploie « ère » (αἰών), soulignant l’époque ou le modèle du monde présent.'
    reason: lexical_alternative
  - marker: c
    text: « L’air » reprend le langage cosmologique ancien désignant la sphère associée aux puissances spirituelles hostiles.
    reason: cultural_note
  - marker: d
    text: « Fils de la désobéissance » est une expression qui désigne des personnes caractérisées par la désobéissance ; on peut aussi traduire « enfants de la désobéissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: dans lesquels
  rationale: Le relatif renvoie aux fautes et aux péchés du verset précédent et conserve la valeur de sphère exprimée par ἐν.
- source_word: ποτε περιεπατήσατε
  choice: vous marchiez autrefois
  rationale: « Marcher » conserve la métaphore paulinienne de la conduite habituelle, tandis qu’« autrefois » situe clairement cette manière de vivre dans le passé.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: en suivant l’ère de ce monde
  rationale: « Ère » rend αἰών sans le confondre avec κόσμος, rendu par « monde » ; « en suivant » exprime ici la conformité indiquée par κατά dans un français naturel.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: le chef de la puissance de l’air
  rationale: « Chef » exprime le statut dirigeant de ἄρχων sans l’archaïsme possible de « prince ». « Puissance » garde ouverte la nuance d’autorité, de pouvoir ou de domaine portée par ἐξουσία, et « air » traduit directement ἀήρ.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: l’esprit qui agit maintenant
  rationale: La minuscule convient à la puissance spirituelle hostile du contexte. La relative rend naturellement le participe présent et son activité actuelle et continue.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: dans les fils de la désobéissance
  rationale: Cette formulation conserve l’idiome sémitisant et le substantif masculin υἱοί, sans réduire l’expression à une simple qualification morale.
theological_decisions:
- issue: Rapport entre « l’esprit qui agit maintenant » et « le chef de la puissance de l’air »
  choice: 'Maintenir une relation appositionnelle par la virgule : « l’esprit » précise la puissance hostile qui vient d’être évoquée.'
  alternative: Comprendre soit une seconde désignation personnelle de Satan, soit une force spirituelle impersonnelle placée sous son autorité.
  rationale: La chaîne de génitifs et les articles grecs permettent l’apposition, mais ne définissent pas entièrement l’identité ou l’ontologie de cet esprit. La formulation préserve cette tension.
- issue: Portée de « fils de la désobéissance »
  choice: Conserver l’expression masculine et idiomatique dans le texte principal.
  alternative: « enfants de la désobéissance » ou « ceux qui désobéissent ».
  rationale: Le grec emploie υἱοί, « fils », dans une tournure qui caractérise des personnes par la désobéissance. Une note en explicite la portée sans neutraliser le texte.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore de la marche, la distinction entre « ère » et « monde », ainsi que l’expression « fils de la désobéissance » sont conservées, avec des notes pour éviter l’opacité. La ponctuation maintient le lien appositionnel sans trancher au-delà du grec.
