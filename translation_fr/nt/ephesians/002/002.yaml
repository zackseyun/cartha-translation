  verdict: revise
  source_fidelity: Révision nécessaire. « Vous marchiez » (imparfait) ne rend pas précisément l’aoriste περιεπατήσατε, qui présente cette conduite passée comme un fait global ; « vous avez autrefois marché » le reflète mieux. « Selon le cours de ce monde » rend idiomatiquement κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου tout en conservant, par note, la nuance d’αἰών.
  naturalness: « En suivant l’ère de ce monde » est compréhensible mais peu idiomatique en français moderne. « Selon le cours de ce monde » est plus naturel dans ce registre. « Prince de la puissance de l’air » est une collocation biblique française établie et plus fluide que « chef de la puissance ».
  terminology: « Air », « esprit » (minuscule) et « fils de la désobéissance » sont maintenus. La note sur « cours » préserve la distinction lexicale entre αἰών et κόσμος, sans imposer une interprétation doctrinale de l’esprit ou du prince.
  issues:
  - severity: medium
    issue: Temps verbal de « vous marchiez »
    rationale: περιεπατήσατε est un aoriste, non un imparfait. Le passé composé français rend mieux l’action/conduite située dans le passé, tandis que « autrefois » conserve ποτε.
  - severity: low
    issue: Formulation « en suivant l’ère de ce monde »
    rationale: Cette expression est moins naturelle en français moderne. « Selon le cours de ce monde » est idiomatique et la note explicite que le grec emploie αἰών (« ère »).
  - severity: low
    issue: « Chef de la puissance de l’air »
    rationale: La formulation est possible, mais « prince de la puissance de l’air » est plus naturelle dans le registre biblique et traduit exactement la fonction dirigeante de ἄρχων, sans définir davantage cette puissance.
