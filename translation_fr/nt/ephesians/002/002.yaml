  to: dans lesquels vous avez autrefois marché[a], selon le cours de ce monde[b], selon le prince de la puissance de l’air[c], l’esprit qui agit maintenant dans les fils de la désobéissance[d].
  rationale: La révision corrige la valeur de l’aoriste, améliore l’idiomaticité française de la double construction en κατά et emploie une désignation française plus naturelle pour ἄρχων. La virgule maintient le rapport étroit, sans le définir au-delà du grec, entre « le prince de la puissance de l’air » et « l’esprit qui agit maintenant ». Les notes sont réancrées de façon univoque et conservent l’explication de la métaphore, de la nuance d’αἰών, du langage cosmologique ancien et de l’idiome « fils de la désobéissance ».
