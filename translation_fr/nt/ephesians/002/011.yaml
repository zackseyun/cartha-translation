source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: fr
  text: C’est pourquoi, souvenez-vous qu’autrefois vous, les non-Juifs selon la chair[a], qui êtes appelés « l’incirconcision » par ce qu’on appelle « la circoncision », faite de main dans la chair[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « selon la chair » renvoie ici à la condition corporelle et à l’identité ethnique de non-Juifs, et non à une nature moralement mauvaise.
    reason: clarification_lexicale
  - marker: b
    text: « L’incirconcision » et « la circoncision » sont ici des désignations collectives à portée ethnique et religieuse, et non de simples descriptions anatomiques. Littéralement, le grec parle de la circoncision « faite de main » dans la chair.
    reason: note_culturelle_et_littérale
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée du développement précédent.
- source_word: μνημονεύετε
  choice: souvenez-vous
  rationale: Rend l’impératif présent pluriel par la tournure française courante, sans surtraduire son aspect.
- source_word: ποτὲ ὑμεῖς
  choice: qu’autrefois, vous
  rationale: Conserve le contraste temporel et met « vous » en relief, comme le fait l’ordre grec.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans l’opposition ethnique et religieuse du passage, le terme désigne les personnes qui ne sont pas juives; « les nations » serait ici moins immédiatement clair.
- source_word: ἐν σαρκί
  choice: selon la chair
  rationale: Maintient le terme paulinien tout en indiquant qu’il s’agit ici du statut corporel et ethnique, non d’une disposition morale.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: appelés « l’incirconcision »
  rationale: Préserve le passif et le caractère collectif, conventionnel et potentiellement dépréciatif de cette désignation.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: par ceux qu’on appelle « la circoncision »
  rationale: Rend explicite en français que le nom abstrait désigne collectivement les circoncis, tout en conservant la répétition de « appeler » et la distance rhétorique du grec.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: faite dans la chair par des mains humaines
  rationale: Rattache clairement l’adjectif à « circoncision » et restitue l’idée d’une marque corporelle produite par l’action humaine.
theological_decisions:
- issue: Sens de σάρξ dans ce contexte
  choice: selon la chair
  alternative: physiquement / quant à leur condition corporelle
  rationale: Le contexte concerne l’identité corporelle et ethnique, non la nature pécheresse; conserver « chair » maintient néanmoins le vocabulaire et la tension du texte.
- issue: Portée de λεγομένης appliqué à περιτομή
  choice: ceux qu’on appelle « la circoncision »
  alternative: la prétendue « circoncision » / ce qu’on appelle « la circoncision »
  rationale: Cette formulation préserve la symétrie entre les deux groupes et une certaine distance rhétorique, sans imposer un ton sarcastique ni une critique antijuive plus forte que le grec.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase reste ouverte par un tiret, conformément à la syntaxe qui se poursuit au verset suivant. Les guillemets signalent des étiquettes collectives, et les tirets isolent sans ambiguïté la précision relative au caractère corporel et humain de la circoncision.
