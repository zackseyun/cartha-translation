  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: fr
  text: 'Car c’est par la grâce que vous avez été sauvés, au moyen de la foi[a]. Cela ne vient pas de vous : c’est le don de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « foi » peut aussi être comprise comme la « confiance »; dans certains contextes, le mot grec peut également signifier « fidélité ». Le mot « Cela » qui suit renvoie probablement à l’ensemble de la réalité évoquée — être sauvé par la grâce au moyen de la foi — plutôt qu’à la foi seule.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: χάριτί
  choice: grâce
  rationale: Dans l’usage paulinien, χάρις désigne couramment la faveur bienveillante et non méritée de Dieu. « Grâce » conserve ce sens établi sans le paraphraser.
- source_word: ἐστε σεσῳσμένοι
  choice: vous avez été sauvés
  rationale: La construction périphrastique au parfait exprime une action accomplie dont le résultat demeure. Le passé composé passif rend naturellement en français l’acte de salut accompli et sa portée présente.
- source_word: διὰ πίστεως
  choice: au moyen de la foi
  rationale: διά avec le génitif indique ici le moyen. « Au moyen de » explicite cette relation sans faire de la foi la source du salut; πίστις est rendu par le terme français courant « foi ».
- source_word: τοῦτο
  choice: Cela
  rationale: Le démonstratif grec neutre renvoie vraisemblablement à l’ensemble de la réalité qui précède — être sauvé par la grâce au moyen de la foi — plutôt qu’à χάρις ou πίστις prises isolément, toutes deux féminines en grec. « Cela » préserve la concision et l’étendue possible du référent.
- source_word: οὐκ ἐξ ὑμῶν
  choice: ne vient pas de vous
  rationale: ἐκ avec le génitif marque l’origine. Cette formulation française moderne nie clairement que la réalité du salut ait sa source dans les destinataires.
- source_word: θεοῦ τὸ δῶρον
  choice: c’est le don de Dieu
  rationale: La proposition nominale grecque identifie la réalité précédente comme don de Dieu. L’ajout de « c’est » est nécessaire à une expression française naturelle et n’ajoute pas de contenu interprétatif.
theological_decisions:
- issue: Référent de τοῦτο (« cela ») par rapport à la grâce, à la foi et au salut
  choice: '« Cela » renvoie probablement à l’ensemble de la réalité précédente : le fait d’être sauvé par la grâce au moyen de la foi.'
  alternative: « Cela » pourrait être compris comme renvoyant plus étroitement à la foi elle-même, ou à la grâce.
  rationale: Le neutre τοῦτο ne s’accorde naturellement ni avec χάρις ni avec πίστις, deux noms féminins; il reprend donc probablement la proposition ou l’idée précédente dans son ensemble. La traduction garde néanmoins un démonstratif non développé afin de ne pas éliminer toute ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Car c’est par la grâce que… » conserve l’accent grec placé sur la grâce. « Au moyen de la foi » rend clairement la valeur instrumentale de διά et évite l’ambiguïté possible de « par la grâce… par la foi ». Le démonstratif « Cela » maintient le lien large et compact avec la proposition précédente.
