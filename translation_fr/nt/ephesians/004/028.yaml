review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : cessation du vol, effort de travail, activité bonne accomplie de ses propres mains, et but de partager avec une personne dans le besoin. Toutefois, « produisant » restreint inutilement ἐργαζόμενος à la fabrication ou à la production, et « avec ardeur » peut évoquer le zèle plus que la peine ou l’effort inhérents à κοπιάτω.'
  naturalness: La phrase est globalement claire et idiomatique. « Se donner de la peine » rend plus naturellement la nuance de travail pénible ou soutenu, tandis que « en faisant de ses propres mains ce qui est bien » évite la formulation légèrement raide « produisant ... ce qui est bon ».
  terminology: « Celui qui vole », « ne vole plus », « de ses propres mains », « partager » et « celui qui est dans le besoin » sont appropriés en français international moderne. « Ce qui est bien » convient ici à τὸ ἀγαθόν sans le réduire à un métier ou à une production particulière.
  issues:
  - severity: low
    issue: « produisant » est trop spécifique pour ἐργαζόμενος.
    rationale: Le participe signifie travailler, faire ou accomplir; il ne suppose pas nécessairement la production d’un objet matériel.
  - severity: low
    issue: « avec ardeur » ne rend pas exactement la nuance de κοπιάτω.
    rationale: Le verbe met l’accent sur la peine et l’effort du travail. « Se donner de la peine » le restitue avec davantage de précision et de naturel.
  - severity: low
    issue: La note b qualifie de littérale une formulation qui ne l’est pas tout à fait.
    rationale: τῷ χρείαν ἔχοντι signifie plus précisément « à celui qui a besoin » ou « à celui qui est dans le besoin »; « un besoin » est une paraphrase acceptable, mais non une littéralité stricte.
  revised_text: Que celui qui vole ne vole plus, mais qu’il se donne plutôt de la peine en faisant de ses propres mains ce qui est bien[a], afin qu’il ait de quoi partager avec celui qui est dans le besoin[b].
