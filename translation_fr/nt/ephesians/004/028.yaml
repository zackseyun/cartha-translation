id: EPH.4.28
reference: Ephesians 4:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: fr
  text: Que celui qui vole ne vole plus, mais qu’il se donne plutôt de la peine en faisant de ses propres mains ce qui est bien[a], afin qu’il ait de quoi partager avec celui qui est dans le besoin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « travaillant à ce qui est bon ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à celui qui a besoin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: celui qui vole
  rationale: Le participe présent substantivé désigne la personne qui se livre au vol, sans lui imposer l’étiquette plus figée de « voleur ».
- source_word: μηκέτι κλεπτέτω
  choice: ne vole plus
  rationale: Cette tournure française naturelle exprime à la fois la cessation exigée par μηκέτι et la force impérative du grec.
- source_word: μᾶλλον δὲ
  choice: mais… plutôt
  rationale: La formulation conserve le contraste correctif marqué entre le vol et le travail honnête.
- source_word: κοπιάτω
  choice: qu’il travaille… avec ardeur
  rationale: κοπιάω désigne un travail demandant un réel effort; « avec ardeur » en garde la force sans rendre la phrase pesante.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: produisant de ses propres mains ce qui est bon
  rationale: Cette formulation relie naturellement le participe, le moyen exprimé par « ses propres mains » et l’objet substantivé τὸ ἀγαθόν, tout en conservant la portée assez large de « ce qui est bon ».
- source_word: ἵνα ἔχῃ
  choice: afin d’avoir de quoi
  rationale: « Afin de » marque clairement le but, tandis que « de quoi » explicite idiomatiquement les ressources sous-entendues par l’infinitif qui suit.
- source_word: μεταδιδόναι
  choice: partager avec
  rationale: Le verbe évoque le fait de faire part à autrui de ce que l’on possède; « partager avec » en restitue la dimension généreuse et relationnelle.
- source_word: τῷ χρείαν ἔχοντι
  choice: celui qui est dans le besoin
  rationale: La tournure rend clairement le destinataire décrit par le participe grec, dans un français courant et respectueux.
theological_decisions:
- issue: Finalité éthique du travail
  choice: Le travail honnête remplace le vol et permet de partager avec la personne dans le besoin.
  alternative: Faire porter l’accent principal sur l’autosuffisance ou sur la restitution.
  rationale: La proposition finale introduite par ἵνα présente explicitement le partage avec la personne dans le besoin comme but. Le soutien de soi peut être sous-entendu, mais il n’est pas placé au premier plan; la restitution n’est pas explicitement mentionnée.
translation_notes:
  register: Français international moderne, clair et digne. L’exhortation garde sa force sans recourir à une formulation archaïque. « Avec ardeur » exprime la nuance d’effort de κοπιάω, et « ce qui est bon » préserve l’étendue sémantique de τὸ ἀγαθόν.
