revisions:
- from: Que celui qui vole ne vole plus, mais qu’il travaille plutôt avec ardeur, produisant de ses propres mains ce qui est bon[a], afin d’avoir de quoi partager avec celui qui est dans le besoin[b].
  to: Que celui qui vole ne vole plus, mais qu’il se donne plutôt de la peine en faisant de ses propres mains ce qui est bien[a], afin qu’il ait de quoi partager avec celui qui est dans le besoin[b].
  rationale: La révision conserve l’ambiguïté et la portée de τὸ ἀγαθόν, tout en rendant plus exactement la nuance d’effort de κοπιάτω et en évitant de limiter l’activité décrite à la production matérielle. Les ancres de notes sont maintenues auprès des expressions auxquelles elles se rapportent.
