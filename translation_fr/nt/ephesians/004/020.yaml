  text: ὑμεῖς δὲ οὐχ οὕτως ἐμάθετε τὸν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: fr
  text: Mais vous, ce n’est pas ainsi que vous avez appris le Messie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le grec dit littéralement : « vous avez appris le Messie » ou « vous avez appris le Christ ».'
    reason: Signale le rendu courant alternatif de Χριστός et explique la construction grecque inhabituelle conservée dans le texte principal.
lexical_decisions:
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom pluriel est exprimé dans le grec pour mettre les destinataires en contraste avec les non-Juifs décrits auparavant. En français, « Mais vous » conserve naturellement cette insistance.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une opposition nette avec la conduite évoquée dans les versets précédents.
- source_word: οὐχ οὕτως
  choice: ce n’est pas ainsi
  rationale: Cette tournure française idiomatique conserve la négation et la valeur de manière de οὕτως, sans préciser davantage en quoi consiste le contraste.
- source_word: ἐμάθετε
  choice: vous avez appris à connaître
  rationale: Le verbe signifie fondamentalement « apprendre ». Comme son complément est une personne, « apprendre à connaître » rend l’expression compréhensible en français moderne tout en maintenant l’idée d’un apprentissage; « vous avez été enseignés » introduirait à tort un passif.
- source_word: τὸν Χριστόν
  choice: le Messie
  rationale: Χριστός désigne ici la personne messianique reçue dans la proclamation. « Le Messie » conserve la valeur du titre et l’article grec; « le Christ » demeure une traduction traditionnelle possible.
theological_decisions:
- issue: Valeur titulaire ou quasi nominale de Χριστόν
  choice: le Messie
  alternative: le Christ
  rationale: Le choix principal rend explicitement le sens messianique de Χριστός sans ajouter le nom de Jésus, absent du verset. La traduction traditionnelle « le Christ » est signalée en note parce que le terme grec peut aussi fonctionner de manière quasi nominale dans ce contexte.
- issue: Expression inhabituelle ἐμάθετε τὸν Χριστόν
  choice: appris à connaître le Messie
  alternative: appris le Messie
  rationale: Le grec présente directement le Messie comme objet de l’apprentissage, formulation théologiquement dense et inhabituelle. Le français exige ici une légère explicitation pour rester naturel; « à connaître » ne réduit toutefois pas l’expression à une simple acquisition d’informations ni ne la transforme en enseignement passif.
translation_notes:
  register: Français international moderne, courant et digne. « Mais vous » porte le contraste emphatique; « ce n’est pas ainsi » reste idiomatique. La virgule finale conserve le lien syntaxique avec la suite de la phrase au verset 21.
