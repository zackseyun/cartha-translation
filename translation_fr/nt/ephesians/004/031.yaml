source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: fr
  text: Que toute amertume, fureur, colère, éclat de voix et parole injurieuse soient ôtés de parmi vous[a], avec toute malveillance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « calomnie » ou « propos outrageants » ; traditionnellement « blasphème ». Dans ce contexte, le grec désigne probablement des paroles nuisibles envers autrui.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: toute
  rationale: La répétition de « toute » devant chaque élément rend la portée distributive et exhaustive de πᾶσα dans cette liste.
- source_word: πικρία
  choice: amertume
  rationale: Terme français courant qui désigne ici un ressentiment intérieur durable et corrosif.
- source_word: θυμός
  choice: fureur
  rationale: « Fureur » évoque une passion violente ou explosive et permet de distinguer θυμός du terme ὀργή qui suit.
- source_word: ὀργή
  choice: colère
  rationale: Rendu naturel et direct, distinct de « fureur » sans imposer une différence plus précise que le contexte.
- source_word: κραυγή
  choice: éclat de voix
  rationale: Dans cette liste de comportements nuisibles, l’expression désigne des cris hostiles; « éclat de voix » conserve l’idée d’une manifestation bruyante sans l’archaïsme de « clameur ».
- source_word: βλασφημία
  choice: parole injurieuse
  rationale: Le mot peut désigner une parole diffamatoire, insultante ou blasphématoire. Dans ce contexte relationnel, « parole injurieuse » rend sa portée nuisible sans la limiter à une accusation mensongère.
- source_word: ἀρθήτω
  choice: disparaissent
  rationale: Le singulier impératif passif porte sur l’ensemble de la liste. Cette formulation française naturelle exprime l’ordre d’en éliminer tous les éléments, même si elle ne reproduit pas formellement le passif grec.
- source_word: ἀφ’ ὑμῶν
  choice: du milieu de vous
  rationale: Cette expression rend la séparation demandée et laisse entendre la conduite personnelle aussi bien que la vie de la communauté.
- source_word: σὺν πάσῃ κακίᾳ
  choice: ainsi que toute méchanceté
  rationale: « Ainsi que » restitue l’accompagnement exprimé par σύν; « méchanceté » désigne ici une disposition malveillante, et non le mal au sens le plus général.
theological_decisions:
- issue: Sens de βλασφημία dans cette liste de vices
  choice: parole injurieuse visant principalement les relations humaines
  alternative: blasphème dirigé contre Dieu; calomnie; propos outrageant
  rationale: Les termes voisins décrivent des attitudes et des expressions destructrices au sein des relations. Le contexte favorise donc le sens de parole nuisible envers autrui, tout en justifiant une note qui signale la gamme sémantique du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La série répétée de « toute » donne à l’exhortation un rythme solennel et souligne son caractère exhaustif. « Éclat de voix » et « parole injurieuse » évitent à la fois l’archaïsme et une précision excessive.
