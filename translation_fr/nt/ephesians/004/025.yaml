id: EPH.4.25
reference: Ephesians 4:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: fr
  text: C’est pourquoi, après avoir rejeté le mensonge[a], que chacun dise la vérité à son prochain, car nous sommes membres les uns des autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la fausseté ».'
    reason: Variante lexicale permettant de faire ressortir le sens collectif ou abstrait de τὸ ψεῦδος.
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Cette locution marque clairement la conséquence tirée de l’exhortation précédente, dans un français actuel et soutenu.
- source_word: ἀποθέμενοι
  choice: après avoir rejeté
  rationale: Le participe aoriste évoque l’abandon résolu du mensonge comme préalable à l’ordre principal. Cette formulation française conserve ce rapport sans alourdir la phrase.
- source_word: τὸ ψεῦδος
  choice: le mensonge
  rationale: Le singulier avec article peut désigner le mensonge comme conduite générale. « Le mensonge » est direct, naturel et maintient le contraste avec « la vérité »; « la fausseté » reste possible.
- source_word: λαλεῖτε ἀλήθειαν ἕκαστος
  choice: que chacun dise la vérité
  rationale: La formulation distributive rend à la fois l’impératif pluriel et ἕκαστος dans un français idiomatique, tout en conservant « la vérité » comme objet direct.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: à son prochain
  rationale: Bien que μετά avec le génitif exprime littéralement l’association (« avec »), le français dit naturellement « dire la vérité à quelqu’un ». « Son prochain » préserve la portée éthique et relationnelle de πλησίον.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit clairement le motif de l’exhortation et convient au registre digne du passage.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: nous sommes membres les uns des autres
  rationale: Cette traduction conserve la métaphore corporelle de μέλη ainsi que la réciprocité exprimée par ἀλλήλων, sans explicitation interprétative.
theological_decisions:
- issue: Portée de τὸ ψεῦδος
  choice: le mensonge, compris comme conduite générale
  alternative: la fausseté
  rationale: Le contexte immédiat oppose la tromperie à la parole vraie au sein de la communauté. L’article et le singulier permettent néanmoins une formulation plus abstraite, signalée en note.
- issue: Langage distributif dans l’exhortation
  choice: que chacun dise la vérité à son prochain
  alternative: dites la vérité les uns aux autres
  rationale: Le singulier distributif du grec est conservé sans limiter l’exhortation à un sexe; la formulation évite aussi de remplacer « prochain » par une réciprocité qui anticiperait la proposition suivante.
- issue: Métaphore de l’appartenance corporelle
  choice: membres les uns des autres
  alternative: parties les uns des autres
  rationale: « Membres » maintient l’image du corps et la tension de l’expression grecque, selon laquelle les croyants ne sont pas seulement membres d’un même groupe, mais membres les uns des autres.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe avec « que chacun dise » restitue naturellement l’impératif distribué, tandis que « après avoir rejeté » garde la valeur préalable du participe aoriste.
