id: EPH.4.10
reference: Ephesians 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: fr
  text: Celui qui est descendu est aussi celui-là même qui est monté bien au-dessus de tous les cieux[a], afin de remplir toutes choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dessus de tous les cieux ». L’expression peut souligner son exaltation au-dessus de tout domaine céleste.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin d’accomplir toutes choses ». Le verbe grec peut, dans certains contextes, signifier « accomplir », mais « remplir » convient mieux ici au contexte immédiat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Celui qui est descendu
  rationale: Le participe aoriste substantivé désigne une personne; une proposition relative au passé composé est naturelle en français moderne et conserve cette valeur.
- source_word: αὐτός ἐστιν καὶ
  choice: est aussi celui-là même
  rationale: Cette formulation maintient l’insistance de αὐτός sur l’identité entre celui qui est descendu et celui qui est monté.
- source_word: ὁ ἀναβὰς
  choice: celui qui est monté
  rationale: Le participe substantivé est rendu parallèlement à ὁ καταβὰς, ce qui préserve la structure et le contraste du grec.
- source_word: ὑπεράνω
  choice: bien au-dessus
  rationale: L’expression rend naturellement l’idée d’une position nettement supérieure, à la fois spatiale et liée à l’exaltation.
- source_word: πάντων τῶν οὐρανῶν
  choice: de tous les cieux
  rationale: Le pluriel du grec est conservé, sans réduire l’expression à un seul ciel ni préciser davantage sa cosmologie.
- source_word: ἵνα
  choice: afin de
  rationale: La locution exprime clairement la visée ou le but introduit par ἵνα.
- source_word: πληρώσῃ
  choice: remplir
  rationale: Dans ce contexte, πληρόω signifie le plus naturellement « remplir »; l’alternative « accomplir » demeure lexicalement possible et est signalée en note.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Cette formulation conserve la portée globale et ouverte du neutre pluriel grec sans la restreindre aux personnes ni l’expliciter comme l’univers.
theological_decisions:
- issue: Identité de celui qui descend et de celui qui monte
  choice: L’identité emphatique de la même personne dans la descente et la montée est explicitement conservée par « celui-là même ».
  alternative: Une formulation moins appuyée, telle que « est aussi celui qui », qui atténuerait la force de αὐτός.
  rationale: Le pronom emphatique αὐτός et les deux participes substantivés parallèles soulignent que le sujet des deux mouvements est le même; la traduction préserve cette donnée christologique sans ajouter d’explication.
- issue: Portée de τὰ πάντα
  choice: « toutes choses » maintient la portée complète mais non précisée de l’expression.
  alternative: « tous les êtres », « tout l’univers » ou « tout », qui préciseraient ou reformuleraient davantage le champ de l’expression.
  rationale: Le grec demeure très large. La traduction évite de trancher entre une portée cosmique, personnelle ou plus générale.
- issue: Sens de πληρώσῃ
  choice: « remplir » est retenu dans le texte principal.
  alternative: « accomplir » est signalé en note comme possibilité lexicale.
  rationale: Le contexte immédiat d’exaltation et de plénitude favorise « remplir », mais la polysémie du verbe ne doit pas être dissimulée.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la descente et de la montée est préservé, ainsi que l’emphase sur l’identité du sujet. « Celui-là même » est soutenu sans être archaïque; « toutes choses » conserve la résonance ample du grec.
