id: EPH.4.15
reference: Ephesians 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: fr
  text: Mais en disant la vérité dans l’amour[a], grandissons à tous égards[b] vers celui qui est la tête, le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en étant vrais » ou « en pratiquant la vérité »; le verbe grec peut inclure aussi bien des paroles vraies qu’une conduite conforme à la vérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « en toutes choses »; plus littéralement, « toutes choses ».
    reason: lexical_alternative
  - marker: c
    text: Grec « Christ »; rendu ici par « le Messie » parce que le terme fonctionne comme un titre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: en disant la vérité
  rationale: Le participe peut englober la parole vraie et une conduite conforme à la vérité. Dans le contexte immédiat, qui oppose cette attitude aux enseignements trompeurs, « en disant la vérité » est une formulation française naturelle; la portée plus large est conservée en note.
- source_word: δὲ
  choice: mais
  rationale: La particule marque ici un contraste modéré avec l’instabilité et la tromperie décrites au verset précédent.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: Cette traduction conserve à la fois l’idée de manière et celle de sphère exprimées par ἐν suivi du datif.
- source_word: αὐξήσωμεν
  choice: grandissons
  rationale: Le subjonctif à la première personne du pluriel a une valeur d’exhortation; l’impératif français « grandissons » la rend clairement.
- source_word: εἰς αὐτόν
  choice: vers celui
  rationale: « Vers » préserve le mouvement directionnel de εἰς sans transformer explicitement l’image en incorporation.
- source_word: τὰ πάντα
  choice: à tous égards
  rationale: L’accusatif a ici une valeur adverbiale et exprime une croissance complète, sous tous ses aspects. Une traduction plus littérale est donnée en note.
- source_word: κεφαλή
  choice: tête
  rationale: Le terme direct maintient la métaphore du corps sans imposer les interprétations débattues de source ou d’autorité.
- source_word: Χριστός
  choice: le Messie
  rationale: Le terme fonctionne ici comme un titre en apposition à « la tête »; « le Messie » en exprime clairement la valeur.
theological_decisions:
- issue: Portée sémantique de ἀληθεύοντες
  choice: « en disant la vérité » dans le texte principal
  alternative: « en étant vrais » ou « en pratiquant la vérité »
  rationale: Le contexte met en avant l’enseignement faux et la tromperie, ce qui favorise la parole vraie, mais le verbe grec peut aussi désigner plus largement une conduite conforme à la vérité. La note maintient cette ambiguïté.
- issue: Force interprétative de κεφαλή
  choice: traduction simple par « tête »
  alternative: « source » ou « autorité »
  rationale: La métaphore paulinienne est conservée sans trancher entre des interprétations théologiques que le seul mot grec ne résout pas.
- issue: Sens directionnel de εἰς αὐτόν
  choice: « vers celui »
  alternative: « en lui » ou « jusqu’à lui »
  rationale: « Vers » garde la direction du mouvement de croissance sans expliciter davantage que le grec la relation au Messie.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’exhortation collective, la métaphore de la tête et le mouvement vers le Messie. Les notes signalent les principales ambiguïtés lexicales sans alourdir le texte.
