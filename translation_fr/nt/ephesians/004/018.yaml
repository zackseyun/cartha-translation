id: EPH.4.18
reference: Ephesians 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: fr
  text: Ils ont l’intelligence obscurcie[a] et sont étrangers à la vie de Dieu[b][c], à cause de l’ignorance qui est en eux, à cause de l’endurcissement de leur cœur[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pensée obscurcie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « exclus de la vie de Dieu » ou « séparés de la vie de Dieu ».
    reason: lexical_alternative
  - marker: c
    text: « La vie de Dieu » peut désigner soit la vie propre à Dieu, soit la vie qui vient de Dieu.
    reason: alternative_reading
  - marker: d
    text: Ou « l’insensibilité de leur cœur ». Le grec emploie « cœur » au singulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: Ils ont l’intelligence obscurcie
  rationale: Le parfait passif décrit un état résultant. Cette formulation française naturelle conserve le sens passif et rend διάνοια par « intelligence », ici la faculté de comprendre.
- source_word: ἀπηλλοτριωμένοι
  choice: sont étrangers à
  rationale: Le parfait passif exprime un état durable de séparation. « Être étrangers à » est idiomatique en français et préserve la dimension relationnelle sans la réduire à une exclusion juridique.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: à la vie de Dieu
  rationale: La formulation proche du grec maintient l’ambiguïté du génitif entre la vie propre à Dieu et la vie qui vient de Dieu.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: à cause de l’ignorance qui est en eux
  rationale: διά avec l’accusatif indique ici la cause, et la relative conserve l’idée que cette ignorance réside en eux.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: à cause de l’endurcissement de leur cœur
  rationale: « Endurcissement » rend naturellement πώρωσις et en conserve la métaphore. Le singulier « cœur » reflète le grec, où il désigne collectivement l’être intérieur.
theological_decisions:
- issue: Sens de « la vie de Dieu »
  choice: Conserver « la vie de Dieu » sans préciser la relation exprimée par le génitif.
  alternative: « la vie qui vient de Dieu » ou « la vie propre à Dieu »
  rationale: Le grec admet ces nuances étroitement liées; la traduction ne doit pas trancher une ambiguïté réelle.
- issue: Singulier collectif de « cœur »
  choice: Employer « leur cœur ».
  alternative: « leurs cœurs »
  rationale: καρδίας est au singulier avec un référent pluriel. Le singulier collectif reste naturel en français et représente fidèlement la forme grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination explicite « et sont » restitue naturellement les participes grecs. « Intelligence obscurcie », « étrangers à » et « endurcissement du cœur » gardent les images et la tension du texte sans surcharge archaïque.
