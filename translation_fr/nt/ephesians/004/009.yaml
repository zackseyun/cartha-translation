id: EPH.4.9
reference: Ephesians 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: fr
  text: Que signifie « il est monté », sinon qu’il est aussi descendu dans les régions inférieures de la terre ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les régions inférieures, c’est-à-dire la terre » ; l’expression peut désigner simplement sa descente sur la terre ou, plus précisément, sa descente dans le séjour des morts.
    reason: 'Lecture alternative : le rapport du génitif « de la terre » avec « les régions inférieures » est ambigu.'
lexical_decisions:
- source_word: Ἀνέβη
  choice: il est monté
  rationale: Rend l’aoriste de ἀναβαίνω et reprend naturellement en français le mouvement vertical de la citation, en parallèle avec « il est descendu ».
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: Que signifie… sinon que
  rationale: Formulation française idiomatique qui conserve la question argumentative et l’inférence tirée du mot cité.
- source_word: καὶ κατέβη
  choice: il est aussi descendu
  rationale: « Aussi » exprime la valeur additive de καί et maintient le contraste entre montée et descente.
- source_word: εἰς
  choice: dans
  rationale: Avec « descendre », « dans » exprime naturellement en français le mouvement vers l’intérieur d’un domaine.
- source_word: τὰ κατώτερα μέρη
  choice: les régions inférieures
  rationale: « Régions » rend μέρη avec naturel dans ce contexte spatial, tandis qu’« inférieures » conserve la valeur comparative de κατώτερα sans identifier précisément le lieu.
- source_word: τῆς γῆς
  choice: de la terre
  rationale: 'Conserve le génitif grec et son ambiguïté possible : régions situées dans la terre, ou régions inférieures, à savoir la terre.'
theological_decisions:
- issue: Interprétation de εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: dans les régions inférieures de la terre
  alternative: dans les régions inférieures, c’est-à-dire la terre ; ou, plus précisément, dans le séjour des morts
  rationale: Le grec permet plusieurs constructions. Le texte principal reste transparent et ne tranche pas entre la venue sur terre et une descente dans le domaine des morts ; la note expose les principales possibilités.
translation_notes:
  register: Français international moderne, clair et digne. Les guillemets français signalent le terme repris de la citation précédente. La formulation préserve l’image verticale et l’ambiguïté théologique du grec.
