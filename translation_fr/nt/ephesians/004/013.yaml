id: EPH.4.13
reference: Ephesians 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: fr
  text: jusqu’à ce que nous parvenions tous à l’unité de la foi[a] et de la connaissance[b] du Fils de Dieu, à l’état d’homme adulte[c], à la mesure de la stature[d] de la plénitude du Messie[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de foi». L’expression peut désigner soit la foi commune professée par les croyants, soit leur foi au sens plus général.
    reason: alternative_reading
  - marker: b
    text: Ou «de la pleine connaissance» ou «de la connaissance profonde».
    reason: lexical_alternative
  - marker: c
    text: Ou «à la pleine maturité». Le grec dit littéralement «à un homme adulte» et emploie une image masculine singulière pour représenter la maturité collective de toute l’Église.
    reason: lexical_alternative
  - marker: d
    text: Ou «de la maturité».
    reason: lexical_alternative
  - marker: e
    text: Grec «Christ», titre qui signifie «Messie» ou «Oint».
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι καταντήσωμεν οἱ πάντες
  choice: jusqu’à ce que nous parvenions tous
  rationale: Rend le but visé par le processus décrit au verset précédent; «parvenir» convient à l’idée figurée d’atteindre un objectif, et «tous» conserve l’inclusion explicite de toute la communauté.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: à l’unité de la foi
  rationale: Conserve le mouvement vers un but ainsi que le terme théologiquement chargé «foi», sans trancher entièrement entre le contenu commun de la foi et la confiance exercée par les croyants.
- source_word: ἐπιγνώσεως
  choice: connaissance
  rationale: Traduction française claire et sobre; l’éventuelle nuance intensive est signalée en note sans être imposée au texte.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: du Fils de Dieu
  rationale: Rend directement le titre christologique et son rapport génitif avec «connaissance».
- source_word: εἰς ἄνδρα τέλειον
  choice: à l’état d’homme adulte
  rationale: Préserve l’image masculine singulière d’un homme arrivé à maturité tout en produisant une tournure française naturelle; «adulte» convient mieux ici que «parfait», puisque le contexte porte sur la croissance collective.
- source_word: εἰς μέτρον ἡλικίας
  choice: à la mesure de la stature
  rationale: Maintient la métaphore corporelle de croissance et de mesure; «maturité» demeure une autre interprétation possible de ἡλικία.
- source_word: τοῦ πληρώματος
  choice: de la plénitude
  rationale: Conserve le substantif paulinien dense et sa portée théologique sans l’aplatir en paraphrase.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre désignant l’Oint de Dieu; «Messie» rend explicitement cette valeur titulaire.
theological_decisions:
- issue: Sens de τῆς πίστεως
  choice: la foi comprise principalement comme la foi commune confessée par l’Église
  alternative: la foi ou la confiance exercée par les croyants
  rationale: L’article et le contexte d’unité collective favorisent le sens communautaire ou objectif, mais la formulation du texte et la note préservent l’ambiguïté réelle.
- issue: Image de εἰς ἄνδρα τέλειον
  choice: l’état d’homme adulte, image singulière de la maturité collective
  alternative: la pleine maturité; un homme accompli ou parfait
  rationale: Le grec emploie ἀνήρ au masculin singulier pour représenter la communauté entière; l’image est conservée sans faire de «parfait» une affirmation de perfection absolue.
- issue: Valeur de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Le contexte théologique permet de percevoir nettement le titre de l’Oint; la forme traditionnelle «Christ» reste indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression ternaire introduite par εἰς et les métaphores de croissance, de mesure et de plénitude, tout en évitant une syntaxe artificiellement calquée sur le grec.
