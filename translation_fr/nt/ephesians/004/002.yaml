  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: fr
  text: en toute humilité et douceur, avec patience, vous supportant les uns les autres dans l’amour,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: en toute humilité
  rationale: « En toute humilité » rend naturellement μετά avec le génitif et conserve la portée intensive de πάσης. « Humilité » exprime clairement l’attitude intérieure désignée par ταπεινοφροσύνη.
- source_word: καὶ πραΰτητος
  choice: et douceur
  rationale: « Douceur » rend la maîtrise bienveillante exprimée par πραΰτης sans la connotation parfois négative de « faiblesse » associée à d’autres formulations.
- source_word: μετὰ μακροθυμίας
  choice: avec patience
  rationale: μακροθυμία désigne ici la patience durable envers autrui, notamment la lenteur à s’irriter. « Avec patience » est actuel et précis.
- source_word: ἀνεχόμενοι
  choice: vous supportant
  rationale: Le participe présent exprime une attitude continue. « Vous supportant » conserve le lien syntaxique avec l’exhortation du contexte et le sens d’endurance mutuelle, sans adopter le tour familier « vous tolérant » ou « vous accommodant ».
- source_word: ἀλλήλων
  choice: les uns les autres
  rationale: Cette expression française rend clairement la réciprocité du pronom ἀλλήλων.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: '« Dans l’amour » traduit directement ἐν avec le datif et préserve l’ambiguïté entre sphère et manière : l’endurance mutuelle s’exerce dans le cadre de l’amour et sous son influence.'
theological_decisions:
- issue: Traduction de ἀγάπη
  choice: amour
  alternative: charité
  rationale: « Amour » est le terme français moderne et général qui correspond à ἀγάπη dans ce contexte éthique. « Charité » pourrait suggérer principalement l’aide matérielle ou un registre confessionnel traditionnel.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale est conservée afin de maintenir le lien de ce fragment avec l’exhortation commencée au verset précédent. La ponctuation finale par une virgule reflète la continuité de la phrase grecque.
