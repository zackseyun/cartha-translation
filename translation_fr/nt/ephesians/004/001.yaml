reference: Ephesians 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: fr
  text: Je vous exhorte donc, moi, le prisonnier dans le Seigneur[a], à vivre d’une manière digne de l’appel que vous avez reçu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prisonnier du Seigneur » ou « prisonnier à cause du Seigneur ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « à marcher d’une manière digne de l’appel auquel vous avez été appelés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Je vous exhorte
  rationale: Le verbe introduit ici un appel pastoral pressant. « Exhorter » en conserve la force sans suggérer un ordre autoritaire.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français la conséquence pratique tirée de l’enseignement qui précède.
- source_word: ἐγὼ
  choice: moi
  rationale: Le pronom grec, exprimé alors que la forme verbale suffirait, met Paul en relief; « moi » préserve cette insistance.
- source_word: δέσμιος
  choice: le prisonnier
  rationale: Le terme désigne directement une personne détenue ou enchaînée; « prisonnier » est précis et courant.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette traduction conserve la formulation paulinienne et son amplitude relationnelle, sans la réduire à la cause de l’emprisonnement.
- source_word: ἀξίως
  choice: d’une manière digne
  rationale: Cette tournure française exprime une conduite qui correspond à l’appel reçu, sans laisser entendre que les destinataires doivent se rendre eux-mêmes dignes de cet appel.
- source_word: περιπατῆσαι
  choice: à vivre
  rationale: Le verbe « marcher » est employé métaphoriquement pour la manière de vivre. « Vivre » communique clairement ce sens en français moderne; la métaphore est signalée en note.
- source_word: κλήσεως
  choice: de l’appel
  rationale: Dans ce contexte paulinien, le nom désigne l’appel de Dieu adressé aux croyants; « appel » en est l’équivalent français naturel et théologiquement ouvert.
- source_word: ἧς ἐκλήθητε
  choice: que vous avez reçu
  rationale: La formulation rend en français idiomatique le jeu grec entre « appel » et « appeler ». Une traduction plus formelle est donnée en note afin de rendre visible cette répétition.
theological_decisions:
- issue: Sens de ὁ δέσμιος ἐν κυρίῳ
  choice: le prisonnier dans le Seigneur
  alternative: le prisonnier du Seigneur; prisonnier à cause du Seigneur
  rationale: Le grec rattache l’emprisonnement de Paul au Seigneur sans préciser s’il s’agit principalement d’appartenance, d’union, de sphère ou de cause. La formulation retenue préserve cette tension.
- issue: Rapport entre la conduite et l’appel
  choice: vivre d’une manière digne de l’appel
  alternative: se rendre digne de l’appel
  rationale: ἀξίως demande une conduite conforme à l’appel reçu; il ne dit pas que cette conduite mérite l’appel ni qu’elle en constitue la condition.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’insistance de « moi » ainsi que l’expression théologiquement dense « dans le Seigneur ». « Vivre » évite que la métaphore de la marche paraisse artificielle dans le texte courant, tandis que la note en préserve la forme grecque.
