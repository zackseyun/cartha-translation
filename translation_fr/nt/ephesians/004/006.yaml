  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: fr
  text: un seul Dieu et Père de tous[a], qui est au-dessus de tous, agit par tous et est en tous.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Père de tous les êtres humains » ou « Père de toutes choses »; le grec répète « tous » sans nom explicite.
    reason: lexical_alternative
  - marker: b
    text: Ou « en chacun ». Certains manuscrits portent « en vous tous ».
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: un seul
  rationale: Dans la série confessionnelle du contexte (« un seul corps », « un seul Esprit », « un seul Seigneur »), « un seul » exprime naturellement en français la valeur emphatique de l'unité.
- source_word: θεὸς καὶ πατὴρ
  choice: Dieu et Père
  rationale: Rend directement les deux désignations coordonnées, avec « Père » comme titre divin.
- source_word: πάντων
  choice: de tous
  rationale: Conserve l'absence de nom explicite en grec et laisse ouverte la portée personnelle ou universelle de la formule.
- source_word: ὁ ἐπὶ πάντων
  choice: qui est au-dessus de tous
  rationale: ἐπί avec le génitif exprime ici la suprématie; « au-dessus de » est idiomatique et maintient la répétition de « tous ».
- source_word: διὰ πάντων
  choice: agit par tous
  rationale: διά avec le génitif indique le moyen ou l'intermédiaire. L'ajout minimal de « agit » rend la proposition naturelle en français tout en explicitant sobrement l'activité implicite.
- source_word: ἐν πᾶσιν
  choice: demeure en tous
  rationale: « Demeure » permet une formulation française complète et digne, tout en conservant l'idée de présence intérieure portée par ἐν; la note signale la variante textuelle.
theological_decisions:
- issue: Portée des formes répétées πάντων / πᾶσιν
  choice: Conserver « tous » sans préciser de groupe ou de catégorie dans le texte principal.
  alternative: « tous les croyants », « tout le monde » ou « toutes choses »
  rationale: Le contexte immédiat concerne l'unité de l'Église, mais le grec n'énonce aucun nom qui limiterait explicitement la portée. La traduction préserve donc cette tension.
- issue: Nature de l'activité exprimée par διὰ πάντων et ἐν πᾶσιν
  choice: Employer « agit par tous » et « demeure en tous ».
  alternative: 'Formulation elliptique: « par tous et en tous »'
  rationale: Le grec est elliptique après « qui est »; le français demande plus naturellement un apport verbal. Ces verbes expriment respectivement l'activité et la présence sans introduire de précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition de « tous » reproduit le rythme du grec; « un seul » souligne la confession d'unité du contexte.
