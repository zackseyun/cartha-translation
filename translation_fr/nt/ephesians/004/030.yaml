id: EPH.4.30
reference: Ephesians 4:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: fr
  text: Et n’attristez pas l’Esprit Saint de Dieu, en qui vous avez été marqués d’un sceau pour le jour de la rédemption.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au jour de la rédemption ». Le grec dit littéralement « pour le jour de la rédemption » (εἰς ἡμέραν ἀπολυτρώσεως), expression qui peut aussi être comprise dans un sens temporel orienté vers l’avenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: attristez
  rationale: Avec μή, l’impératif présent exprime ici une défense. « N’attristez pas » rend naturellement la peine causée à une personne et conserve la force relationnelle du grec.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: l’Esprit Saint de Dieu
  rationale: Cette formulation conserve toute l’expression grecque, y compris le génitif « de Dieu », dans un français clair et digne.
- source_word: ἐν ᾧ
  choice: en qui
  rationale: Le pronom grec est neutre par accord grammatical avec πνεῦμα, mais son référent est personnel dans ce contexte. « En qui » conserve à la fois la préposition et cette référence personnelle, sans transformer explicitement la relation en moyen ou en agent.
- source_word: ἐσφραγίσθητε
  choice: vous avez été marqués d’un sceau
  rationale: Cette tournure rend clairement l’aoriste passif et maintient l’image concrète du sceau. Elle est plus immédiatement compréhensible en français moderne que le seul verbe « sceller », qui peut évoquer principalement le fait de fermer hermétiquement.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: pour le jour de la rédemption
  rationale: « Pour » préserve la valeur d’orientation ou de but de εἰς, tandis que le contexte permet de comprendre ce jour comme déterminé malgré l’absence d’article en grec. La note signale la lecture temporelle possible.
theological_decisions:
- issue: Référence personnelle à l’Esprit Saint dans la proposition relative
  choice: « en qui »
  alternative: « dans lequel » ou « par lequel »
  rationale: « En qui » respecte la référence personnelle suggérée par le fait que l’Esprit peut être attristé, tout en conservant la préposition grecque et sans imposer une interprétation strictement instrumentale.
- issue: Rapport entre le sceau et le jour de la rédemption
  choice: « pour le jour de la rédemption »
  alternative: « jusqu’au jour de la rédemption »
  rationale: Cette formulation garde la valeur prospective et orientée vers un but de εἰς sans trancher des questions doctrinales plus larges concernant le mécanisme ou la durée du sceau.
translation_notes:
  register: Français international moderne, naturel et digne. « Marqués d’un sceau » maintient la métaphore biblique tout en évitant l’ambiguïté courante de « scellés » au sens de « fermés hermétiquement ».
