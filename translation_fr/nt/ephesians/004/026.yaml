  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: fr
  text: Mettez-vous en colère et ne péchez pas[a]. Que le soleil ne se couche pas sur votre colère[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Si vous vous mettez en colère, ne péchez pas. » Le grec emploie formellement l’impératif (« Mettez-vous en colère »), mais certains le comprennent ici dans un sens concessif.'
    reason: alternative_reading
  - marker: b
    text: Paul fait probablement écho au Psaume 4.5 dans la version grecque ancienne, où la colère est associée à l’ordre de ne pas pécher.
    reason: cross_reference
  - marker: c
    text: 'Ou : « sur votre irritation », « sur votre exaspération ». Le terme grec peut désigner la colère, l’irritation ou ce qui la provoque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Mettez-vous en colère
  rationale: L’impératif grec est conservé, ainsi que l’écho probable au Psaume 4. La tournure française exprime naturellement l’entrée ou l’état de colère sans transformer d’emblée la proposition en condition.
- source_word: καὶ μὴ ἁμαρτάνετε
  choice: mais ne péchez pas
  rationale: La prohibition est rendue directement. « Mais » explicite en français le contraste implicite entre la colère et l’interdiction de pécher, sans supprimer la tension du grec.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Que le soleil ne se couche pas
  rationale: Cette tournure rend naturellement en français l’impératif grec à la troisième personne et conserve l’image du coucher du soleil.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: sur votre colère
  rationale: « Colère » est ici le choix le plus clair et naturel; le nom grec peut aussi évoquer l’irritation, l’exaspération ou ce qui provoque la colère.
theological_decisions:
- issue: L’ouverture est-elle un commandement ou une concession conditionnelle?
  choice: 'Impératif : « Mettez-vous en colère »'
  alternative: 'Concessif : « Si vous vous mettez en colère »'
  rationale: 'La forme grecque est impérative. La conserver maintient la tension du texte : la colère n’est pas simplement approuvée, puisqu’elle est aussitôt limitée par l’interdiction de pécher et par l’image du coucher du soleil.'
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif initial et l’image concrète du soleil sont préservés; les variantes interprétatives sont signalées en notes plutôt qu’intégrées silencieusement au texte.
