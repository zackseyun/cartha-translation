  source_fidelity: Le texte rend fidèlement l’impératif présent γίνεσθε (« Soyez »), les deux qualités χρηστοί et εὔσπλαγχνοι (« bons », « compatissants »), ainsi que le participe χαριζόμενοι avec la réciprocité plurielle de ἑαυτοῖς (« vous pardonnant les uns aux autres »). « Tout comme » exprime naturellement la comparaison de καθὼς καὶ sans surcharge. « Dans le Messie » conserve la préposition ἐν et la valeur titulaires de Χριστός, sans trancher indûment la nuance relationnelle ou instrumentale.
