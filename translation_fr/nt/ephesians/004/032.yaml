id: EPH.4.32
reference: Ephesians 4:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: fr
  text: Soyez bons les uns envers les autres, compatissants, vous pardonnant les uns aux autres, tout comme Dieu vous a pardonné dans le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le Messie ».
    reason: La préposition grecque ἐν peut ici être comprise comme exprimant la sphère (« dans le Messie ») ou le moyen (« par le Messie »).
lexical_decisions:
- source_word: γίνεσθε
  choice: Soyez
  rationale: L’impératif présent appelle à une disposition continue. « Soyez » est plus naturel en français dans cette exhortation, même si « devenez » reste possible.
- source_word: εἰς ἀλλήλους
  choice: les uns envers les autres
  rationale: Cette tournure française exprime naturellement l’orientation relationnelle et la réciprocité.
- source_word: χρηστοί
  choice: bons
  rationale: Dans ce contexte éthique et interpersonnel, « bons » rend la bienveillance active du terme sans langage technique.
- source_word: εὔσπλαγχνοι
  choice: compatissants
  rationale: Le mot désigne une compassion profonde et sincère. « Compatissants » est actuel, digne et distinct de « bons ».
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: vous pardonnant les uns aux autres
  rationale: Dans ce contexte, χαρίζομαι signifie pardonner, comme le confirme l’action divine donnée en modèle. Le réfléchi pluriel ἑαυτοῖς a ici un sens réciproque.
- source_word: καθὼς καὶ
  choice: tout comme
  rationale: « Tout comme » conserve la comparaison appuyée sans produire la lourdeur de « comme aussi » en français.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: La traduction maintient la préposition ἐν et rend Χριστός comme un titre, « le Messie », plutôt que comme un nom propre opaque.
- source_word: ἐχαρίσατο ὑμῖν
  choice: vous a pardonné
  rationale: Le contexte de remise des offenses appelle « pardonner ». Le passé composé convient à l’acte accompli ayant une portée présente.
theological_decisions:
- issue: Sens de ἐν Χριστῷ
  choice: dans le Messie
  alternative: par le Messie
  rationale: « Dans le Messie » préserve au plus près la formulation grecque et sa portée théologique, tandis que « par le Messie » explicite une nuance instrumentale possible sans épuiser le sens de ἐν.
- issue: Rendu de Χριστῷ
  choice: le Messie
  alternative: Christ
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » en communique directement le sens au lecteur francophone.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression de l’exhortation grecque tout en évitant les calques lourds. « Les uns envers les autres » et « les uns aux autres » maintiennent explicitement la réciprocité.
