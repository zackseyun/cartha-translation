  terminology: « Le Messie » traduit de manière transparente le titre Χριστός, conformément au choix terminologique fourni. « Compatissants » distingue bien εὔσπλαγχνοι de « bons », et « pardonner » est le sens contextuellement approprié de χαρίζομαι. L’ancre de note après « le Messie » correspond correctement au syntagme ἐν Χριστῷ; la note préserve une lecture instrumentale possible sans la présenter comme certaine.
