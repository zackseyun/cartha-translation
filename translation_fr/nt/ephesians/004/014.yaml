id: EPH.4.14
reference: Ephesians 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: fr
  text: afin que nous ne soyons plus des enfants, ballottés par les vagues et emportés à tout vent d’enseignement, par la tromperie des humains[a], par leur ruse en vue de la manœuvre de l’égarement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le jeu de dés des humains », image évoquant la tricherie ou la tromperie.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « en vue de la manœuvre de l’erreur » ou « de la tromperie ». Le grec exprime de manière condensée l’orientation de la ruse vers un procédé organisé d’égarement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: afin que nous ne soyons plus
  rationale: « Afin que » conserve la valeur de but ou de résultat de ἵνα, tandis que le subjonctif français rend naturellement ὦμεν après cette locution.
- source_word: νήπιοι
  choice: des enfants
  rationale: Le terme désigne ici métaphoriquement des personnes immatures. « Enfants » est naturel et moins restrictif que « nourrissons ».
- source_word: κλυδωνιζόμενοι
  choice: ballottés par les vagues
  rationale: Cette formulation garde explicitement l’image maritime portée par le verbe grec.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: emportés çà et là par tout vent d’enseignement
  rationale: « Emportés çà et là » exprime le mouvement passif et instable; « enseignement » rend διδασκαλία sans lui imposer le sens plus technique de « doctrine ».
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: sous l’effet de la tromperie des humains
  rationale: κυβεία évoque littéralement le jeu de dés, puis la tricherie ou la fraude. La traduction exprime son sens contextuel tout en signalant l’image dans une note.
- source_word: ἐν πανουργίᾳ
  choice: et de leur ruse
  rationale: πανουργία désigne une habileté sans scrupules. L’ajout de « leur » clarifie en français le lien contextuel avec les humains sans changer l’agent.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: au service des manœuvres de l’égarement
  rationale: Cette traduction fait entendre l’orientation ou la finalité indiquée par πρός, tout en conservant la relation volontairement dense entre les manœuvres et πλάνη.
theological_decisions:
- issue: Sens de διδασκαλία
  choice: enseignement
  alternative: doctrine
  rationale: « Enseignement » est le sens courant et suffisamment large du terme; le contexte ne contraint pas à employer le terme ecclésiastique plus technique « doctrine ».
- issue: Sens de πλάνη
  choice: égarement
  alternative: erreur ou tromperie
  rationale: πλάνη peut désigner l’erreur, l’égarement ou la tromperie. « Égarement » préserve cette amplitude et la métaphore implicite du fait de s’écarter, sans décider à lui seul si l’accent porte sur l’état d’erreur ou sur l’action de tromper.
- issue: Force de πρός dans la proposition finale
  choice: au service de
  alternative: en vue des / selon les
  rationale: Le grec est condensé et peut exprimer l’orientation, le but ou l’aboutissement. « Au service de » communique une ruse orientée vers des manœuvres trompeuses sans préciser outre mesure la relation syntaxique.
translation_notes:
  register: Français international moderne, naturel et digne. Les images du mouvement marin et du vent sont conservées. La phrase reste liée à ce qui précède, conformément à la fonction de ἵνα. Les notes ne sont placées qu’aux deux expressions grecques dont l’image ou la relation syntaxique risqueraient autrement d’être masquées.
