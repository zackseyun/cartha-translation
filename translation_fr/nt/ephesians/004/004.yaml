  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: fr
  text: Il y a un seul corps et un seul Esprit[a], tout comme vous aussi avez été appelés à une seule espérance, celle de votre appel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un seul esprit ». Le mot grec peut désigner « esprit » ou « Esprit » ; dans cette formule d’unité, il renvoie très probablement à l’Esprit Saint.'
    reason: Alternative lexicale et ambiguïté de capitalisation absente du grec ancien.
lexical_decisions:
- source_word: ἓν
  choice: un seul / une seule
  rationale: La tournure française « un seul » exprime naturellement l’insistance sur l’unité portée par l’adjectif répété.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent direct qui conserve la métaphore collective sans l’expliciter davantage.
- source_word: πνεῦμα
  choice: Esprit
  rationale: Dans la formule d’unité d’Éphésiens 4.4-6, le référent le plus probable est l’Esprit Saint; la majuscule française rend cette lecture, tandis qu’une note préserve l’autre possibilité lexicale.
- source_word: καθὼς καὶ
  choice: tout comme vous aussi
  rationale: Cette formulation conserve à la fois la comparaison introduite par καθώς et la valeur de καί liée aux destinataires.
- source_word: ἐκλήθητε
  choice: avez été appelés
  rationale: Le passé composé passif est idiomatique en français et maintient l’agent implicite du passif grec.
- source_word: ἐν
  choice: dans
  rationale: Le choix conserve la construction grecque plutôt que de la reformuler par « à ».
- source_word: μιᾷ ἐλπίδι
  choice: une seule espérance
  rationale: « Une seule » reprend clairement le motif répété de l’unité, avec le nom français usuel « espérance ».
- source_word: τῆς κλήσεως ὑμῶν
  choice: celle qui est attachée à votre appel
  rationale: Cette formulation rend le génitif associatif en français naturel tout en conservant le lien lexical entre l’appel reçu et l’espérance.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit Saint, signalé par la majuscule
  alternative: un esprit commun ou une même réalité spirituelle parmi les croyants
  rationale: La suite « un seul corps… un seul Esprit… un seul Seigneur… un seul Dieu et Père » favorise fortement la référence à l’Esprit Saint. Comme le grec ancien ne distingue pas les majuscules de cette manière et que πνεῦμα peut aussi signifier « esprit », la note maintient l’ambiguïté lexicale réelle.
- issue: Rapport entre l’espérance et l’appel
  choice: l’espérance attachée à l’appel
  alternative: l’espérance à laquelle les destinataires ont été appelés
  rationale: Le génitif τῆς κλήσεως peut désigner l’espérance associée à l’appel. La traduction évite de transformer sans nécessité le génitif en destination tout en produisant une phrase française intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « un seul / une seule » reproduit l’insistance rhétorique du grec. « Appelés » et « appel » maintiennent volontairement le lien lexical entre ἐκλήθητε et κλήσεως.
