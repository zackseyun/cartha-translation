  text: μηδὲ δίδοτε τόπον τῷ διαβόλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/027.yaml
  text: and do not give place to the devil[a].
translation:
  language: fr
  text: et ne donnez aucune prise au diable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne donnez pas de place au diable »; autre traduction possible : « ne laissez au diable aucune occasion d’agir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: et ne… pas
  rationale: Dans le contexte, la conjonction poursuit la série d’exhortations. « Et ne… pas » en restitue naturellement la valeur connective et prohibitive.
- source_word: δίδοτε
  choice: donnez
  rationale: Le présent impératif de δίδωμι signifie directement « donner »; ce verbe est conservé dans l’expression française « donner prise à ».
- source_word: τόπον
  choice: prise
  rationale: Le sens premier est « lieu, place », mais ici le mot désigne l’espace ou l’occasion laissée à quelqu’un pour agir. « Donner prise à » exprime ce sens en français courant sans introduire l’image militaire plus marquée de « tête de pont ».
- source_word: τῷ διαβόλῳ
  choice: au diable
  rationale: Avec l’article, διάβολος désigne ici l’adversaire personnel; « le diable » est la désignation française usuelle et contextuellement appropriée.
theological_decisions:
- issue: Faut-il comprendre διάβολος comme un nom commun (« calomniateur ») ou comme la désignation de l’être mauvais personnel (« le diable »)?
  choice: le diable
  alternative: le calomniateur
  rationale: Dans cette exhortation paulinienne, l’expression désigne vraisemblablement l’adversaire personnel plutôt qu’un calomniateur humain. « Le diable » rend ce référent probable sans développer le texte.
translation_notes:
  register: Français moderne, clair et digne. « Donner prise à » conserve le verbe « donner » tout en rendant idiomatiquement la valeur figurée de τόπον; la note préserve la formulation littérale et une autre possibilité de traduction.
