id: EPH.4.24
reference: Ephesians 4:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: fr
  text: et à revêtir l’homme nouveau[a], créé selon Dieu[b], dans la justice[c] et la sainteté de la vérité[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’être nouveau » ou « la personne nouvelle ». Le grec dit littéralement « l’homme nouveau », en correspondance avec « l’homme ancien » dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « conformément à Dieu »; le sens peut aussi être « à l’image de Dieu ».
    reason: lexical_alternative
  - marker: c
    text: Le mot grec peut évoquer ici la droiture aussi bien que la justice.
    reason: semantic_range
  - marker: d
    text: Ou « dans la vraie justice et la vraie sainteté »; ou encore « dans la justice et la sainteté qui viennent de la vérité ». Le grec permet de comprendre le complément comme indiquant la qualité ou la source.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: revêtir
  rationale: « Revêtir » conserve de façon concise et naturelle la métaphore du vêtement, en parallèle avec l’action de se dépouiller dans le contexte immédiat.
- source_word: καινὸν ἄνθρωπον
  choice: l’homme nouveau
  rationale: Cette formulation garde le substantif ἄνθρωπος et son lien explicite avec « l’homme ancien » du contexte. En français biblique courant, l’expression peut avoir une portée représentative plutôt que désigner exclusivement un homme de sexe masculin.
- source_word: κατὰ θεὸν
  choice: selon Dieu
  rationale: 'Le tour formel préserve la concision et l’ouverture sémantique de κατά avec l’accusatif : conformité à Dieu, correspondance à son modèle ou ressemblance avec lui.'
- source_word: κτισθέντα
  choice: créé
  rationale: Le participe passif qualifie « l’homme nouveau » et conserve directement le langage de la création.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » est l’équivalent français usuel de δικαιοσύνη et peut exprimer ici tant la rectitude que la justice au sens moral.
- source_word: ὁσιότητι
  choice: sainteté
  rationale: « Sainteté » rend naturellement la qualité de ce qui est conforme à Dieu et consacré à lui.
- source_word: τῆς ἀληθείας
  choice: de la vérité
  rationale: Le génitif est conservé afin de ne pas décider silencieusement s’il exprime la qualité, la source ou le rapport à la vérité; il peut porter sur la justice et la sainteté ensemble.
theological_decisions:
- issue: Portée anthropologique de καινὸν ἄνθρωπον
  choice: l’homme nouveau
  alternative: l’être nouveau; la personne nouvelle
  rationale: Le choix maintient le motif paulinien de l’« homme ancien » et de l’« homme nouveau », sans réduire l’expression au seul « moi » individuel. Une note signale des formulations françaises moins marquées par le genre.
- issue: Sens de κατὰ θεὸν
  choice: selon Dieu
  alternative: à l’image de Dieu; conformément à Dieu
  rationale: « Selon Dieu » laisse subsister la tension entre ressemblance, modèle et conformité, alors que les autres formulations explicitent davantage.
- issue: Rapport syntaxique de τῆς ἀληθείας
  choice: la justice et la sainteté de la vérité
  alternative: la vraie justice et la vraie sainteté; la justice et la sainteté qui viennent de la vérité
  rationale: La formulation retenue reproduit le génitif et évite de trancher entre un sens qualitatif et un sens de provenance. La note propose les deux principales explicitations.
translation_notes:
  register: Français international moderne, digne et lisible. « Revêtir » et « l’homme nouveau » maintiennent l’image et le motif du texte grec. Le tour volontairement dense « de la vérité » est conservé dans le texte principal, tandis que la note en explicite les lectures possibles sans en imposer une.
