  text: and to be renewed in the spirit of your mind,[a]
translation:
  language: fr
  text: et à être renouvelés dans l’esprit de votre intelligence,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’esprit de votre intelligence ». L’expression désigne plus probablement la disposition intérieure ou l’orientation de votre intelligence qu’une référence directe au Saint-Esprit.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: être renouvelés
  rationale: L’infinitif présent passif est conservé. « Être renouvelés » exprime naturellement l’action reçue et s’insère dans la suite infinitive du contexte. Le présent peut suggérer un processus continu sans qu’il soit nécessaire de l’expliciter.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ relie avec souplesse les éléments d’une même séquence plutôt qu’il ne marque une forte opposition.
- source_word: τῷ πνεύματι
  choice: dans l’esprit
  rationale: Le datif est compris comme indiquant la sphère ou le domaine du renouvellement. La minuscule préserve la lecture la plus naturelle, celle de la disposition intérieure, sans exclure silencieusement l’autre compréhension possible.
- source_word: νοὸς
  choice: intelligence
  rationale: Dans l’expression « l’esprit de votre intelligence », « intelligence » désigne la faculté intérieure de comprendre et de penser. Ce choix conserve la structure inhabituelle du grec plus nettement que « manière de penser ».
- source_word: ὑμῶν
  choice: votre
  rationale: Le possessif renvoie à l’ensemble des destinataires. Le français emploie naturellement le singulier collectif « votre intelligence » dans ce contexte.
theological_decisions:
- issue: πνεύματι désigne-t-il directement le Saint-Esprit ou la disposition intérieure de l’intelligence humaine ?
  choice: 'La disposition intérieure : « l’esprit de votre intelligence »'
  alternative: « par l’Esprit dans votre intelligence » ou une formulation faisant directement référence au Saint-Esprit
  rationale: Le génitif τοῦ νοὸς ὑμῶν qualifie le plus naturellement πνεύματι. Le texte principal garde donc l’expression anthropologique, tandis qu’une note signale l’autre compréhension possible sans imposer une précision absente du grec.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « l’esprit de votre intelligence », volontairement proche du grec, préserve l’ambiguïté et la tension de l’expression originale.
