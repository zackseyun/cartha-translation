id: EPH.4.12
reference: Ephesians 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: fr
  text: pour la préparation des saints, pour l’œuvre du ministère[a], pour l’édification du corps du Messie[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’œuvre du service ». Le grec διακονία peut signifier « service » ou « ministère ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en préserver la valeur de titre.
    reason: alternative_reading
  - marker: c
    text: 'Le grec peut aussi être compris comme une progression : « pour préparer les saints à l’œuvre du ministère, en vue de l’édification du corps du Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: pour la préparation
  rationale: Καταρτισμός désigne l’action de préparer, d’équiper ou de rendre apte. « Préparation » conserve la forme nominale et reste naturelle en français, sans suggérer une perfection morale achevée.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Dans les lettres de Paul, οἱ ἅγιοι désigne les croyants consacrés à Dieu. « Les saints » conserve ce terme paulinien établi, sans limiter son sens aux personnes canonisées.
- source_word: εἰς ἔργον διακονίας
  choice: pour l’œuvre du ministère
  rationale: Διακονία peut désigner le service ou le ministère. « Ministère » convient au contexte ecclésial, tandis que la note maintient explicitement l’autre possibilité lexicale.
- source_word: εἰς οἰκοδομὴν
  choice: pour l’édification
  rationale: Οἰκοδομή évoque métaphoriquement la construction et le développement de la communauté. « Édification » préserve cette métaphore biblique dans un registre digne et intelligible.
- source_word: τοῦ σώματος τοῦ Χριστοῦ
  choice: du corps du Messie
  rationale: Σῶμα est rendu littéralement par « corps ». Χριστός fonctionne ici comme un titre; « Messie » en conserve le sens plutôt que de le traiter seulement comme un nom propre.
theological_decisions:
- issue: Rapport syntaxique entre les trois groupes exprimant le but
  choice: 'Les trois groupes sont présentés comme des buts coordonnés : « pour la préparation…, pour l’œuvre…, pour l’édification… »'
  alternative: 'Comprendre une progression : les saints sont préparés pour accomplir l’œuvre du ministère, laquelle édifie le corps du Messie.'
  rationale: La suite grecque πρός… εἰς… εἰς… permet les deux analyses. La répétition de « pour » reproduit sa structure sans trancher implicitement la question de savoir qui accomplit l’œuvre du ministère; une note expose la lecture progressive.
- issue: Rendu du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: « Messie » rend la valeur titulaire de Χριστός; « Christ » demeure une traduction traditionnelle possible et figure en note.
translation_notes:
  register: Français international moderne, sobre et digne. La structure nominale et la répétition de « pour » maintiennent au plus près l’ambiguïté syntaxique du grec. « Saints », « ministère » et « édification » sont des termes bibliques établis; leurs risques d’interprétation trop étroite sont compensés par les notes.
