id: EPH.4.17
reference: Ephesians 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: fr
  text: 'Voici donc ce que je dis et atteste dans le Seigneur : vous ne devez plus vivre comme vivent les non-Juifs[a], dans la futilité de leur pensée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations » ; certaines traductions ont « les païens ».
    reason: Alternative lexicale pour ἔθνη, qui peut désigner les nations ou, dans l’usage juif et paulinien, les non-Juifs.
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Voici donc ce que je dis
  rationale: « Donc » conserve la transition déductive avec ce qui précède, tandis que « voici ce que » rend naturellement Τοῦτο comme objet anticipé de λέγω.
- source_word: μαρτύρομαι
  choice: atteste
  rationale: Le verbe exprime ici une affirmation personnelle et solennelle. « Atteste » en garde la force sans transformer explicitement le propos en simple insistance.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La formulation conserve l’expression grecque et laisse ouverte sa nuance de sphère, d’union ou d’autorité.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: vous ne devez plus vivre
  rationale: L’infinitif a ici une force exhortative, rendue explicitement par « devez ». Dans ce contexte éthique, « vivre » communique naturellement en français moderne le sens métaphorique de περιπατεῖν.
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: comme vivent les non-Juifs
  rationale: La répétition de « vivre » reflète celle de περιπατέω. « Les non-Juifs » conserve la catégorie ethnique et liée à l’alliance que peut désigner ἔθνη, sans ajouter la connotation religieuse plus forte de « païens ».
- source_word: ἐν ματαιότητι
  choice: dans la futilité
  rationale: « Futilité » exprime l’inconsistance, la vacuité et l’absence de but associées à ματαιότης.
- source_word: τοῦ νοὸς αὐτῶν
  choice: de leur pensée
  rationale: Le singulier collectif « leur pensée » reflète le grec et désigne ici leur manière de penser, sans anticiper excessivement le vocabulaire du verset suivant.
theological_decisions:
- issue: Sens de ἔθνη dans un contraste moral adressé à une communauté comprenant largement des non-Juifs
  choice: les non-Juifs
  alternative: les nations ; les païens
  rationale: « Non-Juifs » préserve la catégorie paulinienne sans introduire d’emblée le jugement religieux plus marqué de « païens ». Le contraste porte sur une manière de vivre dont les destinataires doivent se détourner, non sur une condamnation ontologique de toute personne non juive.
- issue: Force de l’infinitif περιπατεῖν après λέγω καὶ μαρτύρομαι
  choice: vous ne devez plus vivre
  alternative: que vous ne viviez plus
  rationale: La tournure avec « devez » rend clairement l’urgence exhortative de la construction, sans lui imposer une catégorie théologique étrangère au texte.
- issue: Nuance de ἐν κυρίῳ
  choice: dans le Seigneur
  alternative: par le Seigneur ; devant le Seigneur
  rationale: La traduction formelle maintient l’ambiguïté possible entre la sphère d’appartenance au Seigneur et l’autorité sous laquelle Paul parle.
translation_notes:
  register: Français international moderne, digne et direct. « Vivre » privilégie la compréhension immédiate du sens éthique de la métaphore grecque, tandis que la répétition du verbe préserve le parallélisme. La ponctuation garde le caractère solennel de l’exhortation.
