id: EPH.4.3
reference: Ephesians 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: fr
  text: vous appliquant avec zèle à préserver l’unité de l’Esprit par le lien de la paix[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous efforçant de maintenir » ou « veillant avec soin à préserver ».
    reason: lexical_alternative
  - marker: b
    text: « L’Esprit » désigne très probablement ici l’Esprit Saint; certains comprennent toutefois « l’esprit » au sens plus général d’un esprit partagé entre les croyants.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: vous appliquant avec zèle
  rationale: Le participe présent exprime une diligence active et soutenue. Cette tournure française s’insère naturellement dans le prolongement de l’exhortation des versets précédents.
- source_word: τηρεῖν
  choice: à préserver
  rationale: Le verbe désigne ici le maintien attentif d’une unité déjà donnée, et non sa création.
- source_word: τὴν ἑνότητα
  choice: l’unité
  rationale: « Unité » est l’équivalent français direct, clair et usuel de ἑνότης.
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Dans le contexte immédiat d’Éphésiens, le référent le plus probable est l’Esprit Saint. La majuscule signale ce choix tout en laissant l’autre compréhension en note.
- source_word: ἐν
  choice: par
  rationale: Dans cette expression, ἐν peut indiquer le moyen ou l’élément au moyen duquel l’unité est préservée. « Par » est naturel en français et rend bien cette relation.
- source_word: τῷ συνδέσμῳ
  choice: le lien
  rationale: σύνδεσμος désigne ce qui relie ou tient ensemble. « Lien » conserve la métaphore sans archaïsme.
- source_word: τῆς εἰρήνης
  choice: de la paix
  rationale: Le génitif est conservé sans préciser au-delà du texte si la paix constitue, produit ou caractérise ce lien.
theological_decisions:
- issue: Référent de πνεύματος
  choice: l’Esprit Saint
  alternative: l’esprit partagé par les croyants
  rationale: Les emplois voisins dans Éphésiens, notamment en 4.4 et 4.30, favorisent nettement une référence à l’Esprit Saint, mais la possibilité plus générale mérite d’être signalée.
- issue: Nature de l’unité
  choice: une unité déjà donnée qu’il faut préserver
  alternative: une unité que les croyants doivent créer
  rationale: τηρεῖν signifie garder ou préserver; le texte exhorte donc à maintenir cette unité plutôt qu’à la produire.
- issue: Valeur de ἐν dans ἐν τῷ συνδέσμῳ
  choice: 'moyen : « par le lien »'
  alternative: 'sphère : « dans le lien »'
  rationale: Les deux nuances sont possibles. « Par le lien de la paix » est plus idiomatique en français, sans trancher la nature exacte du rapport génitif avec « paix ».
translation_notes:
  register: Français international moderne, digne et accessible. La construction participiale maintient le lien syntaxique avec l’exhortation commencée aux versets précédents. « Préserver » met en évidence une unité déjà existante, tandis que « lien de la paix » conserve la métaphore grecque.
