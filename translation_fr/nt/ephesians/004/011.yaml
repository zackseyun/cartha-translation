id: EPH.4.11
reference: Ephesians 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: fr
  text: Et c’est lui qui a donné les uns comme apôtres, les autres comme prophètes, les autres comme évangélistes, et les autres comme bergers[a] et enseignants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pasteurs ». Le mot grec signifie littéralement « bergers ».
    reason: lexical_alternative
  - marker: b
    text: L’article grec unique placé devant « bergers et enseignants » peut signaler un lien particulièrement étroit entre ces fonctions, sans nécessairement en faire une seule et même fonction.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction courante qui maintient le lien avec le contexte précédent.
- source_word: αὐτὸς
  choice: c’est lui qui
  rationale: La tournure française met naturellement en relief le sujet et rend l’emphase du pronom grec.
- source_word: ἔδωκεν
  choice: a donné
  rationale: Rend directement δίδωμι sans réduire le sens à « a établi » ou « a nommé ».
- source_word: τοὺς μὲν … τοὺς δὲ
  choice: les uns comme … les autres comme
  rationale: Cette distribution idiomatique en français reproduit la série grecque et indique que ces personnes sont données dans ces fonctions.
- source_word: ἀποστόλους
  choice: apôtres
  rationale: Équivalent français établi et précis du terme grec.
- source_word: προφήτας
  choice: prophètes
  rationale: Équivalent direct et usuel.
- source_word: εὐαγγελιστάς
  choice: évangélistes
  rationale: Terme français établi, concis et adapté à cette liste de fonctions.
- source_word: ποιμένας
  choice: bergers
  rationale: Préserve l’image concrète du grec ποιμήν; « pasteurs » demeure une possibilité contextuelle signalée en note.
- source_word: διδασκάλους
  choice: enseignants
  rationale: Rend clairement la fonction de ceux qui enseignent dans un français moderne, sans connotation de titre ecclésiastique ajoutée.
theological_decisions:
- issue: Traduction de ποιμένας comme métaphore ou comme titre ecclésiastique traditionnel
  choice: bergers
  alternative: pasteurs
  rationale: « Bergers » conserve la métaphore du texte grec, tandis que « pasteurs » est une traduction traditionnelle et contextuellement possible, indiquée en note sans être imposée au texte.
- issue: Rapport syntaxique entre « bergers » et « enseignants »
  choice: Maintenir les deux noms coordonnés sans trancher leur statut institutionnel
  alternative: les comprendre comme une seule catégorie de « bergers-enseignants », ou comme deux groupes entièrement distincts
  rationale: L’article grec unique suggère un lien particulièrement étroit, mais ne suffit pas à imposer dans la traduction une seule fonction ecclésiale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure distributive « les uns… les autres… » garde le mouvement de l’énumération; « c’est lui qui » conserve l’emphase de αὐτός. Les notes préservent l’alternative traditionnelle « pasteurs » et l’ambiguïté syntaxique du dernier groupe.
