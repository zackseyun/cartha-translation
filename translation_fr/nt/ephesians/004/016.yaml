revisions:
- from: C’est de lui que le corps tout entier, bien assemblé et uni grâce à chaque articulation qui lui apporte son soutien[a], assure sa propre croissance pour se construire lui-même dans l’amour, par l’activité de chaque partie selon sa mesure[b].
  to: C’est de lui que le corps tout entier, bien assemblé et uni grâce à chaque articulation qui lui apporte son soutien[a], selon l’activité à la mesure de chacune de ses parties[b], produit sa propre croissance pour sa propre édification dans l’amour.
  rationale: La révision maintient les choix lexicaux prudents du projet, mais replace le complément exprimant le fonctionnement mesuré de chaque partie auprès de l’action principale. « Produit sa propre croissance » traduit plus directement ποιεῖται, et « pour sa propre édification » conserve le sens réflexif et la métaphore de οἰκοδομή dans un français contemporain.
