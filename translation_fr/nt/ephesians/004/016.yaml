language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: fr
  text: C’est de lui que le corps tout entier, bien assemblé et uni grâce à chaque articulation qui lui apporte son soutien[a], selon l’activité à la mesure de chacune de ses parties[b], produit sa propre croissance pour sa propre édification dans l’amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire par « chaque jointure qui fournit », « chaque ligament de soutien » ou « chaque lien qui assure l’approvisionnement ».
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « selon l’activité dans la mesure de chaque partie ».'
    reason: source_form
lexical_decisions:
- source_word: ἐξ οὗ
  choice: C’est de lui que
  rationale: Le relatif renvoie personnellement au Christ mentionné au verset précédent. Cette tournure française exprime clairement que le corps tire de lui sa croissance.
- source_word: πᾶν τὸ σῶμα
  choice: le corps tout entier
  rationale: Rendu idiomatique du collectif singulier, en conservant l’image corporelle.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: bien assemblé et uni
  rationale: Les deux participes décrivent à la fois l’ajustement des parties et la cohésion du corps, sans surcharger la phrase française.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: grâce à chaque articulation qui lui apporte son soutien
  rationale: « Articulation » maintient l’image concrète du corps, tandis que la proposition relative rend la notion d’apport ou de soutien portée par ἐπιχορηγία.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: par l’activité de chaque partie selon sa mesure
  rationale: La formulation indique que chaque partie agit de manière proportionnée, tout en évitant d’ajouter l’idée interprétative de mesure « convenable » ou « propre ».
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: assure sa propre croissance
  rationale: Cette expression française naturelle conserve le corps comme agent grammatical de sa croissance et évite la répétition lourde de « corps ».
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: pour se construire lui-même
  rationale: Le choix conserve la métaphore de la construction ainsi que la valeur réflexive de ἑαυτοῦ.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: Rendu direct, naturel et cohérent avec le vocabulaire paulinien du contexte.
theological_decisions:
- issue: Source et agent de la croissance du corps
  choice: La croissance vient du Christ, tandis que le corps assure sa croissance par l’activité de chacune de ses parties.
  alternative: Présenter le Christ seul comme agent immédiat de toute la croissance, ou rendre l’antécédent de manière impersonnelle.
  rationale: Le contexte identifie le référent de ἐξ οὗ au Christ, mais la syntaxe fait du corps le sujet de ποιεῖται. La traduction maintient ensemble la source christologique et la participation active de tout le corps.
- issue: Portée de l’image des articulations
  choice: Conserver une articulation corporelle qui apporte du soutien.
  alternative: Employer « ligament », « lien » ou « point de contact qui fournit ».
  rationale: Le grec permet plusieurs nuances anatomiques ou fonctionnelles. « Articulation » préserve l’image sans imposer une précision médicale excessive, et la note signale les autres possibilités.
- issue: Rapport entre l’activité et la mesure de chaque partie
  choice: Rattacher explicitement l’activité à chaque partie et indiquer qu’elle s’exerce selon sa mesure.
  alternative: Rattacher la proposition aux articulations ou traduire par « le bon fonctionnement de chaque partie ».
  rationale: Cette lecture suit l’ordre et le sens les plus probables du grec sans introduire le jugement qualitatif « bon » ou « convenable », absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les métaphores du corps et de la construction, tout en allégeant les répétitions qui seraient maladroites en français. Les notes rendent visibles les principales ambiguïtés lexicales et syntaxiques.
