reference: Ephesians 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: fr
  text: Mais à chacun de nous la grâce a été donnée selon la mesure du don du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ ». Le grec Χριστοῦ porte le titre « Messie », traditionnellement rendu par « Christ ».'
    reason: Signaler l’équivalent traditionnel du titre grec sans effacer son sens.
lexical_decisions:
- source_word: Ἑνὶ δὲ ἑκάστῳ ἡμῶν
  choice: Mais à chacun de nous
  rationale: La combinaison distributive ἑνὶ…ἑκάστῳ souligne l’attribution individuelle au sein de la communauté. « À chacun de nous » restitue naturellement cette insistance en français; « mais » marque le passage de l’unité évoquée auparavant à la diversité des dons.
- source_word: ἐδόθη ἡ χάρις
  choice: la grâce a été donnée
  rationale: Le passé composé passif rend naturellement l’aoriste en français moderne. L’article est conservé, conformément à l’usage français avec le nom abstrait « grâce », sans réduire celle-ci explicitement à une catégorie doctrinale particulière.
- source_word: κατὰ τὸ μέτρον
  choice: selon la mesure
  rationale: κατά avec l’accusatif exprime ici une norme ou une proportion. « Selon la mesure » conserve cette relation sans préciser indûment s’il s’agit d’une quantité, d’une part attribuée ou d’un critère.
- source_word: τῆς δωρεᾶς
  choice: du don
  rationale: « Don » rend directement δωρεά et convient au contexte de ce qui est librement accordé, sans la lourdeur de « don gratuit » après « grâce a été donnée ».
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Du Messie » en rend le contenu sémantique tout en laissant au génitif sa souplesse relationnelle.
theological_decisions:
- issue: Sens de χάρις dans le contexte
  choice: Conserver « la grâce » sans explicitation dans le verset
  alternative: « un don de grâce » ou « une capacité accordée par grâce »
  rationale: Le contexte suivant concerne des dons et des fonctions différenciés, mais le terme garde une portée théologique plus large. La traduction ne doit pas décider à la place du texte qu’il s’agit exclusivement d’une aptitude au ministère.
- issue: Relation exprimée par τοῦ Χριστοῦ
  choice: « du Messie »
  alternative: « donné par le Messie » ou « appartenant au Messie »
  rationale: Le génitif peut évoquer la source, l’auteur ou l’appartenance du don. La formulation française conserve cette ambiguïté au lieu de la résoudre.
- issue: Rendu de Χριστός
  choice: « Messie »
  alternative: « Christ »
  rationale: Dans cette construction, le titre demeure sémantiquement perceptible. « Messie » traduit le titre plutôt que de le traiter comme un simple nom propre; une note signale la forme traditionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en étant idiomatique. « À chacun de nous » est naturel et suffisamment emphatique; « selon la mesure du don » conserve la densité et l’ambiguïté relationnelle du texte source.
