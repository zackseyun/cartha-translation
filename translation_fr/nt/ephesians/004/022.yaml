source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: fr
  text: à vous dépouiller[a], pour ce qui est de votre conduite passée, du vieil homme, qui se corrompt selon les désirs de la tromperie[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « vous dépouiller du vieil homme ». « Le vieil homme » désigne ici l’ancienne manière humaine d’être et de vivre, et non uniquement un homme au sens masculin.
    reason: alternative_reading
  - marker: b
    text: Littéralement « les désirs de la tromperie ». Le génitif peut désigner des désirs façonnés par la tromperie ou relevant d’elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: à vous dépouiller
  rationale: L’infinitif aoriste moyen exprime l’action d’enlever ou d’abandonner. « Se dépouiller » conserve l’image du vêtement, reprise par « revêtir » au verset 24, et s’intègre à la syntaxe dépendant du verset précédent.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: pour ce qui est de votre conduite passée
  rationale: ἀναστροφή désigne la conduite ou la manière de vivre, tandis que κατά marque ici vraisemblablement le domaine ou la référence. Cette formulation française est naturelle et évite de faire de la conduite passée la norme de l’action.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: du vieil homme
  rationale: Cette traduction conserve l’expression anthropologique masculine et représentative du grec, ainsi que ses possibles résonances collectives, sans la réduire d’emblée au seul « moi » individuel.
- source_word: τὸν φθειρόμενον
  choice: qui se corrompt
  rationale: Le participe présent passif décrit un processus continu de dégradation. Le pronominal français rend naturellement ce processus sans préciser un agent que le grec ne nomme pas.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: sous l’influence des désirs trompeurs
  rationale: κατά indique ici une influence directrice ou une conformité. « Désirs trompeurs » rend naturellement le génitif τῆς ἀπάτης, tout en gardant l’idée de désirs façonnés par la tromperie.
theological_decisions:
- issue: Sens de τὸν παλαιὸν ἄνθρωπον
  choice: le vieil homme
  alternative: l’ancien moi
  rationale: « Le vieil homme » maintient la forme représentative de ἄνθρωπος et les possibles dimensions adamique et collective de l’expression paulinienne. La note précise qu’elle ne vise pas uniquement les personnes de sexe masculin.
- issue: Force de l’infinitif ἀποθέσθαι
  choice: à vous dépouiller
  alternative: que vous vous dépouilliez ; vous être dépouillés
  rationale: L’infinitif est conservé comme contenu de l’enseignement évoqué au verset 21. Cette solution ne tranche pas indûment entre instruction, exhortation et événement de conversion.
- issue: Valeur de φθειρόμενον
  choice: qui se corrompt
  alternative: qui est corrompu ; qui va à sa perte
  rationale: Le présent participial suggère un processus en cours. La traduction préserve cette progression sans décider si l’accent porte surtout sur la corruption morale ou sur la destruction finale.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure syntaxiquement ouverte parce que le verset dépend du contexte précédent. « Se dépouiller » et « revêtir » au verset 24 préservent la métaphore vestimentaire.
