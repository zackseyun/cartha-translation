  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: fr
  text: Eux qui sont devenus insensibles[a] se sont livrés à la débauche[b], pour pratiquer toutes sortes d’impuretés avec avidité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : ayant perdu toute sensibilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : à une conduite sans retenue.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : dans la cupidité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Eux qui
  rationale: Le pronom relatif renvoie aux non-Juifs mentionnés dans le contexte précédent. « Eux qui » conserve ce lien et la nuance descriptive du grec.
- source_word: ἀπηλγηκότες
  choice: sont devenus insensibles
  rationale: Le participe parfait exprime une perte de sensibilité ayant abouti à un état durable. Cette formulation évoque l’endurcissement moral du contexte sans le réduire à une absence d’émotion.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: se sont livrés
  rationale: Le pronom réfléchi et le verbe expriment un abandon volontaire. « Se sont livrés » est naturel en français et en garde la force.
- source_word: τῇ ἀσελγείᾳ
  choice: à la débauche
  rationale: Le terme désigne une conduite éhontée et sans retenue, souvent dans le domaine sexuel sans s’y limiter nécessairement. « Débauche » est courant, fort et adapté au contexte.
- source_word: εἰς ἐργασίαν
  choice: pour pratiquer
  rationale: La tournure exprime ici le but ou le résultat orienté vers une activité. Le verbe « pratiquer » rend cela plus naturellement qu’un calque nominal.
- source_word: ἀκαθαρσίας πάσης
  choice: toutes sortes d’impuretés
  rationale: Cette formulation française rend la portée exhaustive et distributive de πάσης tout en restant fluide.
- source_word: ἐν πλεονεξίᾳ
  choice: avec avidité
  rationale: πλεονεξία évoque le désir avide d’obtenir toujours davantage. Ici, la préposition indique vraisemblablement la manière dont les impuretés sont pratiquées, tout en laissant possible la notion générale de cupidité.
theological_decisions:
- issue: Portée morale et psychologique de ἀπηλγηκότες
  choice: devenus insensibles
  alternative: ayant perdu toute sensibilité
  rationale: Le contexte décrit une insensibilité éthique qui mène à l’abandon au mal. La traduction évite aussi bien une lecture purement émotionnelle qu’un ajout explicatif excessif.
- issue: Étendue du sens de ἀσέλγεια
  choice: débauche
  alternative: conduite sans retenue
  rationale: Le mot peut inclure l’immoralité sexuelle, mais désigne plus largement une conduite éhontée et débridée. Le choix principal garde la force du vice sans préciser une catégorie unique.
- issue: Fonction et nuance de ἐν πλεονεξίᾳ
  choice: avec avidité
  alternative: dans la cupidité
  rationale: La construction peut décrire la manière insatiable de poursuivre l’impureté ou nommer plus directement la cupidité. Le texte principal privilégie la première relation contextuelle, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve son rattachement au verset précédent par « Eux qui ». Le vocabulaire reste direct sans être clinique ni inutilement technique.
