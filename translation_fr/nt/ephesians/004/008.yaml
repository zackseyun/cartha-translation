  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: fr
  text: 'C’est pourquoi il est dit : « Étant monté en haut, il a fait captive la captivité[a] et il a donné des dons aux êtres humains. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « il a emmené avec lui une foule de captifs » ou « il a emmené des captifs ». Le grec emploie une expression cognate très vive, qui fait écho au Psaume 68.19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Cette locution conserve la valeur déductive qui relie la citation à l’argument précédent.
- source_word: λέγει
  choice: il est dit
  rationale: Le verbe n’a pas de sujet explicite. La tournure impersonnelle française renvoie naturellement à l’Écriture sans ajouter un sujet absent du grec.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Monté dans les hauteurs
  rationale: Cette formulation concise conserve la construction participiale, l’idée d’une ascension accomplie et l’écho poétique du psaume.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: il a emmené captive la captivité
  rationale: La formulation maintient l’expression apparentée et saisissante du grec, ainsi que son écho au Psaume 68. Une formulation française plus idiomatique est signalée en note.
- source_word: ἔδωκεν δόματα
  choice: il a donné des dons
  rationale: La répétition étymologique possible en français reste claire et conserve le vocabulaire du don, important dans le contexte immédiat.
- source_word: τοῖς ἀνθρώποις
  choice: aux êtres humains
  rationale: ἄνθρωποι désigne ici les humains en général. Cette traduction moderne exprime directement la portée générique sans la restreindre aux hommes de sexe masculin.
theological_decisions:
- issue: Identité des captifs et sens de la captivité
  choice: 'Conserver l’image ouverte : « il a emmené captive la captivité »'
  alternative: « il a emmené avec lui une foule de captifs »
  rationale: Le grec reprend une expression dense du psaume sans identifier explicitement les captifs. La traduction principale ne tranche donc pas entre les diverses lectures théologiques possibles.
- issue: Portée de τοῖς ἀνθρώποις
  choice: « aux êtres humains »
  alternative: « aux hommes »
  rationale: Le nom grec peut être générique dans ce contexte. La formulation choisie rend cette portée sans introduire de restriction masculine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la citation garde une tonalité poétique et biblique, tandis que « aux êtres humains » communique sans ambiguïté la portée générique du grec.
