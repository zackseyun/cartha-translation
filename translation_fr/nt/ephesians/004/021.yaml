  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: fr
  text: si du moins vous l’avez entendu[a] et avez été instruits en lui, comme la vérité se trouve en Jésus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez entendu parler de lui ». Le grec dit plus littéralement « vous l’avez entendu » ; cela peut laisser entendre qu’en recevant la proclamation apostolique, les destinataires ont entendu le Christ lui-même.
    reason: alternative_reading
  - marker: b
    text: Les expressions « en lui » et « en Jésus » peuvent évoquer une sphère, une union ou une association étroite ; le grec garde une nuance plus large que le simple sens « par lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: si du moins
  rationale: Cette tournure conserve la forme conditionnelle et la légère insistance de γε, sans transformer explicitement la proposition en affirmation causale.
- source_word: αὐτὸν ἠκούσατε
  choice: vous l’avez entendu
  rationale: Le grec emploie αὐτόν comme complément direct, sans préposition signifiant « au sujet de ». La formulation française garde cette expression frappante et peut évoquer le Christ entendu à travers sa proclamation.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: « En lui » préserve la valeur large de ἐν, qui peut évoquer la sphère, l’union ou l’association étroite, plutôt que de la réduire à l’idée d’agent exprimée par « par lui ».
- source_word: ἐδιδάχθητε
  choice: avez été instruits
  rationale: Le passif rend directement l’aoriste passif grec. « Instruits » est naturel en français dans ce contexte de formation reçue.
- source_word: καθώς
  choice: comme
  rationale: « Comme » rend simplement la relation comparative introduite par καθώς, tout en maintenant le lien avec l’affirmation qui suit.
- source_word: ἀλήθεια
  choice: la vérité
  rationale: En français, le nom abstrait requiert naturellement l’article défini dans cette construction, même si le grec est sans article.
- source_word: ἐν τῷ Ἰησοῦ
  choice: en Jésus
  rationale: La formulation conserve le nom personnel « Jésus » ainsi que la préposition ἐν, sans préciser excessivement s’il s’agit de sphère, d’union ou de présence incarnée de la vérité.
theological_decisions:
- issue: Faut-il rendre αὐτὸν ἠκούσατε par « vous l’avez entendu » ou par « vous avez entendu parler de lui » ?
  choice: vous l’avez entendu
  alternative: vous avez entendu parler de lui
  rationale: Le complément direct favorise la traduction littérale. Celle-ci conserve l’idée possible que, dans la proclamation apostolique, les destinataires ont véritablement entendu le Christ lui-même, sans imposer cette explication comme seul sens.
- issue: 'Comment rendre les deux expressions avec ἐν : ἐν αὐτῷ et ἐν τῷ Ἰησοῦ ?'
  choice: en lui / en Jésus
  alternative: par lui / dans l’union avec Jésus
  rationale: La répétition de « en » maintient le parallélisme grec et laisse ouvertes les nuances pauliniennes de sphère, d’union ou d’association, au lieu de les résoudre en simple moyen ou agent.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle et le parallélisme des deux expressions avec « en », tout en employant une syntaxe naturelle. La virgule finale respecte le fait que ce verset se poursuit dans la phrase suivante.
