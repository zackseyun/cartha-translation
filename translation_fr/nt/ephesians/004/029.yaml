  to: Qu’aucune parole pourrie ne sorte de votre bouche[a], mais seulement une parole qui soit bonne, propre à édifier selon le besoin[b], afin qu’elle fasse du bien à ceux qui l’entendent[c].
  rationale: La correction remédie aux deux expressions françaises les moins naturelles sans modifier le sens du passage. « Édifier » est une métaphore française usuelle correspondant à οἰκοδομή; « selon le besoin » conserve la concision et la légère densité syntaxique du grec. Le texte principal rend la fonction concrète de χάρις dans cette exhortation par « fasse du bien », et la note maintient la résonance lexicale de « grâce ». Les ancres a, b et c restent chacune attachées au segment pertinent et sont séquentielles.
