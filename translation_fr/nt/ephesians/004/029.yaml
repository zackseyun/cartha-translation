  terminology: « Parole pourrie » préserve avec justesse la métaphore de σαπρός. « Édifier » est ici le meilleur équivalent français de l’image métaphorique d’οἰκοδομή. Pour χάρις, le texte principal privilégie le bénéfice gracieux communiqué aux auditeurs, sans imposer une lecture doctrinale; la note signale les autres valeurs possibles.
