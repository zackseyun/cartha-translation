source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: fr
  text: Qu’aucune parole pourrie ne sorte de votre bouche[a], mais seulement une parole qui soit bonne, propre à édifier selon le besoin[b], afin qu’elle fasse du bien à ceux qui l’entendent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parole corrompue » ou « propos malsain ». Le grec dit littéralement « aucune parole pourrie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « propre à édifier comme le besoin l’exige » ou « adaptée au besoin ». La relation entre « édifier » et « besoin » est exprimée de manière condensée en grec.
    reason: lexical_alternative
  - marker: c
    text: Ou « afin qu’elle donne une grâce à ceux qui l’entendent ». Le mot grec peut signifier « grâce », « faveur » ou « bienfait ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: aucune parole pourrie
  rationale: Sous la négation, πᾶς avec le singulier a ici le sens distributif de « aucune ». « Parole pourrie » conserve l’image vive de σαπρός, littéralement « pourri », tout en désignant une parole mauvaise ou nuisible.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: ne sorte de votre bouche
  rationale: La tournure rend naturellement en français l’impératif négatif et préserve l’image corporelle de paroles qui sortent de la bouche. Le singulier collectif « votre bouche » correspond à la formulation grecque.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: mais seulement une parole bonne
  rationale: La proposition grecque est elliptique et reprend λόγος. L’ajout explicite de « parole » donne une phrase française claire, tandis que « seulement » exprime la restriction impliquée par l’opposition.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: qui serve à construire selon le besoin
  rationale: « Construire » conserve la métaphore de οἰκοδομή sans recourir au terme ecclésiastique « édification ». « Selon le besoin » maintient la formulation grecque compacte et son lien syntaxique légèrement ambigu avec la construction.
- source_word: ἵνα δῷ χάριν
  choice: afin qu’elle apporte une grâce
  rationale: « Apporter » est plus idiomatique que « donner » avec une parole comme sujet. « Une grâce » préserve la portée relationnelle et théologique possible de χάρις sans imposer le sens doctrinal plus défini que pourrait suggérer « la grâce ».
- source_word: τοῖς ἀκούουσιν
  choice: à ceux qui l’entendent
  rationale: Cette formulation naturelle rend le participe présent et explicite que les personnes concernées entendent la parole prononcée.
theological_decisions:
- issue: Sens de χάριν dans une exhortation concernant la parole
  choice: une grâce
  alternative: un bienfait
  rationale: Dans ce contexte, χάρις peut désigner une grâce, une faveur ou un bienfait. « Une grâce » conserve le vocabulaire paulinien et sa résonance théologique, tout en laissant la note signaler le sens concret de bienfait sans faire de la parole humaine la source de la grâce salvatrice.
translation_notes:
  register: Français international moderne, accessible et digne. La traduction conserve la métaphore frappante de la parole « pourrie » et celle de la construction. La syntaxe reste concise, tandis que les notes présentent les formulations françaises plus interprétatives.
