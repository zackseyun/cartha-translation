  text: εἷς κύριος, μία πίστις, ἓν βάπτισμα·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/005.yaml
  text: one Lord[a], one faith, one baptism;
translation:
  language: fr
  text: un seul Seigneur, une seule foi[a], un seul baptême ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une seule confiance » ou « une seule fidélité » ; toutefois, « foi » convient le mieux à l’unité commune soulignée ici.
    reason: alternative lexicale
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: un seul / une seule
  rationale: Les trois formes du même adjectif cardinal s’accordent respectivement avec des noms masculins, féminin et neutre en grec. La répétition de « seul » rend clairement l’insistance sur l’unité et conserve le parallélisme ternaire.
- source_word: κύριος
  choice: Seigneur
  rationale: Dans ce contexte paulinien, κύριος est un titre christologique et non une simple désignation de maître. « Seigneur » est le rendu français courant et digne.
- source_word: πίστις
  choice: foi
  rationale: Ici, le mot désigne le plus naturellement la foi commune qui unit les croyants, tout en pouvant lexicalement évoquer la confiance ou la fidélité.
- source_word: βάπτισμα
  choice: baptême
  rationale: « Baptême » est le terme français précis et usuel pour le rite désigné par βάπτισμα, sans en préciser le mode ni l’efficacité.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Conserver « Seigneur », qui renvoie le plus naturellement à Jésus-Christ dans la progression d’Éphésiens 4.4-6.
  alternative: Une référence plus générale à Dieu.
  rationale: La séquence « un seul Esprit », « un seul Seigneur », puis « un seul Dieu et Père » favorise le référent christologique, sans qu’il soit nécessaire de l’expliciter dans le texte.
- issue: Sens de « un seul baptême »
  choice: Traduire de façon neutre par « un seul baptême ».
  alternative: Préciser soit une compréhension sacramentelle, soit un baptême principalement spirituel ou métaphorique.
  rationale: Le verset affirme l’unité sans trancher les débats sur le mode, l’efficacité ou la portée exacte du baptême.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève et ternaire du grec est conservée. L’ajout idiomatique de « seul » après chaque article cardinal renforce naturellement en français l’idée d’unicité exprimée par la répétition grecque.
