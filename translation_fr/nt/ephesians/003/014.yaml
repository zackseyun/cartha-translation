  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: fr
  text: C’est pourquoi je plie les genoux devant le Père,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: C’est pourquoi
  rationale: Cette expression idiomatique indique le motif de la prière et rattache naturellement la phrase au contexte précédent.
- source_word: κάμπτω τὰ γόνατά μου
  choice: je plie les genoux
  rationale: Cette formulation conserve l’image corporelle explicite du grec tout en étant naturelle en français; «je m’agenouille» en condenserait légèrement l’expression.
- source_word: πρὸς
  choice: devant
  rationale: Dans l’expression française «plier les genoux devant quelqu’un», «devant» rend naturellement l’orientation vers la personne à laquelle la prière s’adresse, sans la tournure peu idiomatique «vers le Père».
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Le contexte de prière désigne Dieu et favorise l’emploi titulaire de «Père», avec la majuscule conforme à l’usage français.
theological_decisions:
- issue: Faut-il rendre πατέρα comme un titre divin?
  choice: le Père
  alternative: le père
  rationale: Paul décrit une prière adressée à Dieu, et le verset suivant développe précisément le langage de la paternité. «Le Père» explicite par l’usage typographique français le référent déjà indiqué par le contexte, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve le lien argumentatif et l’image concrète de la posture de prière. La virgule finale reflète le fait que la phrase se poursuit au verset suivant.
