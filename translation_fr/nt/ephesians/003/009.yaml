source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: fr
  text: et de faire connaître à tous quelle est l’administration du mystère[a], caché depuis les âges[b] en Dieu, qui a créé toutes choses,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la gestion du mystère » ou « le plan du mystère ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « depuis les âges »; ou « depuis toujours », de manière plus interprétative.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: mettre en lumière
  rationale: Cette expression conserve la métaphore de l’illumination tout en introduisant naturellement la proposition qui expose ce qui doit être révélé.
- source_word: πάντας
  choice: pour tous
  rationale: Le pluriel masculin désigne ici l’ensemble des personnes. « Pour tous » exprime cette portée universelle dans un français naturel.
- source_word: τίς ἡ οἰκονομία
  choice: en quoi consiste la mise en œuvre
  rationale: οἰκονομία peut évoquer l’administration, la gestion, la disposition ou le plan. « Mise en œuvre » rend ici l’idée de réalisation ordonnée du mystère sans introduire un sens confessionnel technique.
- source_word: μυστήριον
  choice: mystère
  rationale: Dans l’usage paulinien, il s’agit d’un dessein divin autrefois caché et désormais révélé. « Mystère » préserve cette résonance et le lien lexical avec le contexte.
- source_word: ἀποκεκρυμμένου
  choice: tenu caché
  rationale: Le participe parfait passif décrit un état de dissimulation résultant d’une action antérieure. « Tenu caché » rend clairement cette valeur.
- source_word: ἀπὸ τῶν αἰώνων
  choice: depuis des siècles
  rationale: Cette formulation française naturelle conserve l’idée d’une dissimulation remontant aux âges passés, sans transformer explicitement ceux-ci en éternité.
- source_word: ἐν τῷ θεῷ
  choice: en Dieu
  rationale: La préposition ἐν indique directement que le mystère était caché en Dieu; « auprès de Dieu » affaiblirait cette formulation.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: qui a créé toutes choses
  rationale: La proposition relative rend naturellement le participe substantivé décrivant Dieu, tandis que « toutes choses » correspond à τὰ πάντα.
theological_decisions:
- issue: Sens de οἰκονομία par rapport au mystère
  choice: mise en œuvre
  alternative: administration, gestion ou plan
  rationale: Le terme peut désigner l’organisation ou la réalisation du mystère, et non seulement son contenu. « Mise en œuvre » maintient cette dimension active sans importer le sens technique d’un système théologique ultérieur.
- issue: Valeur temporelle de ἀπὸ τῶν αἰώνων
  choice: depuis des siècles
  alternative: depuis les âges ou depuis toujours
  rationale: Le grec parle des « âges » et n’affirme pas explicitement « depuis l’éternité ». Le choix principal reste idiomatique en français tout en évitant de trancher en faveur de cette interprétation plus forte.
translation_notes:
  register: Français international moderne, digne et accessible. « Mettre en lumière » conserve l’image grecque; « mise en œuvre » évite à la fois le jargon bureaucratique d’« administration » et une réduction du terme au seul « plan ». La virgule finale respecte le fait que le verset s’insère dans une phrase plus longue.
