id: EPH.3.20
reference: Ephesians 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: fr
  text: À celui qui peut faire infiniment plus que tout ce que nous demandons ou concevons[a], selon la puissance qui agit en nous[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « imaginons »; le verbe grec désigne ici ce que l’esprit peut penser ou concevoir.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi nous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: À celui qui peut
  rationale: Le participe substantivé au datif introduit le destinataire de la doxologie qui se poursuit au verset 21. Cette formulation en conserve la syntaxe sans ajouter explicitement « Dieu ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ assure une transition légère vers la doxologie. En français, l’enchaînement contextuel suffit et l’ajout de « maintenant » introduirait une nuance temporelle absente.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: infiniment plus que tout
  rationale: Cette tournure française naturelle rend ensemble l’idée de dépassement et la forte intensification portée par l’adverbe composé.
- source_word: ποιῆσαι
  choice: faire
  rationale: « Faire » conserve la portée large et simple de ποιέω sans préciser indûment la nature de l’action.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: tout ce que nous demandons ou concevons
  rationale: « Concevoir » exprime ici ce que l’esprit peut former ou envisager, tout en maintenant la distinction avec ce qui est demandé.
- source_word: κατὰ τὴν δύναμιν
  choice: selon la puissance
  rationale: κατά avec l’accusatif indique ici la norme ou la mesure, plutôt que le simple moyen; « selon » préserve cette nuance.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: qui agit en nous
  rationale: Cette expression rend naturellement l’activité présente et effective de la puissance, tout en conservant le sens direct de ἐν ἡμῖν.
theological_decisions:
- issue: Référent implicite du destinataire de la doxologie
  choice: « À celui qui peut »
  alternative: « À Dieu qui peut »
  rationale: Le contexte désigne clairement Dieu, mais le grec ne répète pas ici le nom θεός. La traduction garde donc le référent implicite et respecte la continuité syntaxique avec le verset 21.
- issue: Nature de la puissance à l’œuvre chez les croyants
  choice: « la puissance qui agit en nous »
  alternative: « la puissance qui agit parmi nous »
  rationale: « En nous » conserve le sens le plus direct du grec sans imposer une explication confessionnelle de la manière dont cette puissance divine opère.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par une virgule parce que la doxologie se poursuit au verset 21. L’intensification grecque est rendue sans tournure artificielle par « infiniment plus que tout ».
