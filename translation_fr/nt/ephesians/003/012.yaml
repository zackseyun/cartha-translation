  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: fr
  text: En lui, nous avons la liberté de nous approcher de Dieu avec confiance, par la foi en lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par sa fidélité ». L’expression grecque peut désigner soit la foi placée en lui, soit sa propre fidélité.'
    reason: Lecture alternative d’une construction grecque ambiguë.
lexical_decisions:
- source_word: ἐν ᾧ
  choice: En lui
  rationale: Le pronom relatif masculin renvoie naturellement au Christ mentionné dans le contexte précédent. « En lui » conserve le sens personnel et l’idée d’union avec le Christ.
- source_word: παρρησίαν
  choice: la liberté
  rationale: Le nom exprime ici la liberté, la franchise ou l’assurance sans crainte. Dans la formulation « la liberté de nous approcher », il reste distinct de πεποίθησις tout en produisant un français naturel.
- source_word: προσαγωγὴν
  choice: de nous approcher de Dieu
  rationale: Dans cet emploi paulinien, le mot désigne l’accès auprès de Dieu. L’explicitation « de Dieu » rend la destination implicite claire en français, et la tournure verbale évite le peu naturel « avoir un accès ».
- source_word: ἐν πεποιθήσει
  choice: avec confiance
  rationale: Cette expression indique la manière assurée dont cet accès s’exerce. « Avec confiance » est idiomatique et préserve sa distinction avec παρρησία.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: par la foi en lui
  rationale: Le génitif αὐτοῦ peut désigner la foi dirigée vers le Christ ou sa propre fidélité. Le texte principal retient la lecture objective, courante et adaptée au contexte de l’accès des croyants, tandis que l’autre lecture est signalée en note.
theological_decisions:
- issue: Interprétation de διὰ τῆς πίστεως αὐτοῦ
  choice: par la foi en lui
  alternative: par sa fidélité
  rationale: La construction grecque est réellement ambiguë entre la foi placée dans le Christ et la fidélité du Christ. La première lecture figure dans le texte principal sans exclure la seconde, conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation associe παρρησία et προσαγωγή en une expression française naturelle, sans effacer la confiance exprimée séparément par πεποίθησις.
