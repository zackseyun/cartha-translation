id: EPH.3.18
reference: Ephesians 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: fr
  text: afin que vous ayez la force de saisir, avec tous les saints, quelle est la largeur, la longueur, la hauteur et la profondeur[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas ici ce que décrivent ces dimensions ; beaucoup comprennent que la pensée se poursuit au verset suivant avec l’amour du Messie.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit naturellement en français le but ou le résultat de la prière précédente, tout en conservant la valeur télique du grec.
- source_word: ἐξισχύσητε
  choice: vous ayez la force
  rationale: Exprime la force ou la capacité suffisante pour accomplir l’action indiquée par l’infinitif qui suit, sans alourdir la phrase.
- source_word: καταλαβέσθαι
  choice: de saisir
  rationale: Dans ce contexte, le verbe désigne l’acte de parvenir à appréhender ou comprendre une réalité. « Saisir » est naturel, actuel et conserve la vigueur de l’expression grecque.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: avec tous les saints
  rationale: Préserve l’idée de participation commune marquée par σύν ainsi que le terme paulinien établi pour désigner les croyants consacrés à Dieu.
- source_word: τί
  choice: ce que sont
  rationale: Introduit correctement en français l’objet de « saisir » devant une série de quatre dimensions, sans transformer l’interrogatif en appréciation quantitative.
- source_word: τὸ πλάτος
  choice: la largeur
  rationale: Équivalent français direct et contemporain du terme dimensionnel πλάτος.
- source_word: μῆκος
  choice: la longueur
  rationale: Équivalent dimensionnel direct de μῆκος.
- source_word: ὕψος
  choice: la hauteur
  rationale: Équivalent dimensionnel direct de ὕψος.
- source_word: βάθος
  choice: la profondeur
  rationale: Équivalent dimensionnel direct de βάθος.
theological_decisions:
- issue: Référent des quatre dimensions
  choice: Laisser implicite dans le texte principal ce dont il s’agit de saisir la largeur, la longueur, la hauteur et la profondeur.
  alternative: Préciser qu’il s’agit de l’amour du Messie, du projet sauveur de Dieu ou de sa plénitude.
  rationale: Le grec de ce verset ne donne pas explicitement le référent des quatre dimensions. Ajouter « de l’amour du Messie » anticiperait le verset suivant et trancherait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Ayez la force de saisir » maintient l’idée d’une capacité accordée dans le cadre de la prière. La série des quatre dimensions reste volontairement sans complément explicite, conformément au grec.
