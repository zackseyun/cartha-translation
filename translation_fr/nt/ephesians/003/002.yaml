  source_fidelity: La relative τῆς δοθείσης μοι est au génitif féminin et se rapporte grammaticalement à τῆς χάριτος (« la grâce »), non à οἰκονομίαν (« l’administration », accusatif). Le projet fait accorder « confiée » avec « mission » et déplace donc indûment l’antécédent. La révision rétablit l’accord et maintient εἴ γε comme condition rhétorique ainsi que εἰς ὑμᾶς (« pour vous »).
  naturalness: « L’administration de la grâce de Dieu » est un français moderne et international, suffisamment clair dans ce contexte et moins pesant que « la mission de gérer ». La phrase conserve volontairement son caractère de proposition dépendante, comme dans le grec.
  terminology: « Grâce de Dieu » conserve le vocabulaire paulinien. « Administration » rend οἰκονομία sans imposer le sens plus abstrait de « plan » ni employer une formulation qui ferait de la grâce un objet à « gérer » de manière peu naturelle.
  issues:
