source:
  edition: SBLGNT
  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: fr
  text: si du moins[a] vous avez entendu parler de l’administration[b] de la grâce de Dieu qui m’a été donnée pour vous,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si vraiment vous avez entendu parler ». Le grec conserve une forme conditionnelle, même si, dans ce contexte, Paul semble tenir cela pour acquis.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « l’intendance » ou « la mission ». Le terme grec peut désigner la gestion ou l’administration d’une responsabilité confiée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: si du moins
  rationale: 'Conserve la forme conditionnelle grecque et sa nuance rhétorique : Paul suppose vraisemblablement que ses lecteurs sont au courant, sans effacer l’ambiguïté grammaticale.'
- source_word: ἠκούσατε
  choice: vous avez entendu parler
  rationale: Cette tournure française naturelle rend l’aoriste comme un fait passé pertinent dans le contexte présent et convient à ce dont les lecteurs ont eu connaissance.
- source_word: οἰκονομίαν
  choice: la mission de gérer
  rationale: Exprime de manière accessible la responsabilité d’administration confiée à Paul, sans réduire le terme au plan divin abstrait.
- source_word: χάριτος τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: Préserve le vocabulaire paulinien habituel et le rapport génitif, qui peut désigner la grâce venant de Dieu et lui appartenant.
- source_word: τῆς δοθείσης μοι
  choice: qui m’a été confiée
  rationale: Le passif maintient l’idée d’un don ou d’une charge reçue. En français, « confiée » s’accorde naturellement avec « mission » tout en laissant la grâce définir le contenu de cette mission.
- source_word: εἰς ὑμᾶς
  choice: pour vous
  rationale: Rend clairement l’orientation et le bénéfice de la mission de Paul envers les destinataires.
theological_decisions:
- issue: Référent de « l’administration de la grâce de Dieu »
  choice: La formule désigne la mission confiée à Paul de gérer et d’annoncer la grâce de Dieu au bénéfice des destinataires.
  alternative: Elle pourrait désigner plus abstraitement l’administration ou le plan salvifique de Dieu lui-même.
  rationale: Le contexte immédiat met en avant le ministère confié à Paul envers les non-Juifs. « mission de gérer » garde la notion de responsabilité reçue sans nier le plan divin plus large.
- issue: Valeur de εἴ γε
  choice: Une condition rhétorique que Paul tient probablement pour vraie.
  alternative: 'Une condition réelle exprimant une incertitude : « si vraiment » ou « si toutefois ».'
  rationale: « Si du moins » préserve la forme conditionnelle et la tension du grec, au lieu de transformer l’hypothèse en affirmation catégorique.
- issue: Antécédent de τῆς δοθείσης
  choice: En français, la relative se rattache grammaticalement à la mission, comprise comme la gestion de la grâce confiée à Paul.
  alternative: La relative peut être comprise comme qualifiant directement la grâce donnée à Paul.
  rationale: La construction grecque permet une relation étroite entre la charge et la grâce. La note signale cette ambiguïté plutôt que de la résoudre silencieusement.
translation_notes:
  register: Français moderne, international et digne. « Mission de gérer » est plus immédiatement compréhensible que le rare « intendance », tout en conservant la notion de responsabilité confiée. La phrase reste ouverte, conformément à sa fonction syntaxique dans le passage.
