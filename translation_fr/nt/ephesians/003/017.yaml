id: EPH.3.17
reference: Ephesians 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: fr
  text: afin que le Messie[a] habite dans vos cœurs par la foi[b], vous qui êtes enracinés et fondés dans l’amour[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « Messie » ou « Oint ».
    reason: alternative_reading
  - marker: b
    text: Ou « par la confiance ». Le mot grec peut exprimer la foi, la confiance ou, dans certains contextes, la fidélité.
    reason: lexical_alternative
  - marker: c
    text: L’expression « dans l’amour » se rattache très probablement à « enracinés et fondés » ; certains la rattachent toutefois à « habite dans vos cœurs ».
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: habite
  rationale: L’infinitif aoriste dépend de la prière précédente et exprime le but ou le résultat. « Habiter » évoque une demeure réelle et durable sans surcharger l’expression.
- source_word: τὸν Χριστόν
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Le Messie » en restitue le sens plutôt que de simplement translittérer le grec.
- source_word: διὰ τῆς πίστεως
  choice: par la foi
  rationale: La préposition διά avec le génitif indique ici le moyen. « Foi » est le sens contextuel le plus naturel de πίστις, même si « confiance » reste possible.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans vos cœurs
  rationale: Cette expression anthropologique désigne l’être intérieur dans son ensemble, et non les seules émotions. La formulation française traditionnelle demeure claire et naturelle.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: La préposition décrit le domaine ou le sol métaphorique dans lequel les croyants sont enracinés et fondés.
- source_word: ἐρριζωμένοι
  choice: vous qui êtes enracinés
  rationale: Le participe parfait passif décrit l’état présent résultant d’une action accomplie. L’ajout de « vous qui êtes » rend la construction naturelle en français tout en conservant cette valeur.
- source_word: τεθεμελιωμένοι
  choice: fondés
  rationale: Le terme conserve la métaphore architecturale, mise en parallèle avec la métaphore végétale d’« enracinés ».
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte permet de comprendre Χριστός comme un titre. « Le Messie » en communique directement le sens sans introduire de lecture confessionnelle particulière.
- issue: Sens de πίστις dans διὰ τῆς πίστεως
  choice: par la foi
  alternative: par la confiance
  rationale: Le contexte présente la foi comme le moyen par lequel le Messie habite dans les cœurs. « Confiance » est lexicalement possible, mais moins attendu ici.
- issue: Rattachement de ἐν ἀγάπῃ
  choice: rattaché à « enracinés et fondés »
  alternative: rattaché à « habite dans vos cœurs »
  rationale: L’ordre des mots et le mouvement de la phrase favorisent le rattachement aux participes suivants, sans exclure totalement l’autre analyse.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les deux métaphores coordonnées, végétale (« enracinés ») et architecturale (« fondés »). « Vous qui êtes » explicite sobrement le lien participial grec et évite en français un participe détaché ambigu. La virgule finale signale que la pensée se poursuit au verset suivant.
