id: EPH.3.11
reference: Ephesians 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: fr
  text: selon le dessein éternel[a] qu’il a accompli dans[b] le Messie[c] Jésus, notre Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le dessein des âges ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par ». La préposition grecque signifie « dans », mais peut aussi avoir ici un sens instrumental.'
    reason: alternative_reading
  - marker: c
    text: 'Grec : « Christ »; le terme est traduit ici par « Messie » parce qu’il fonctionne comme un titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: selon
  rationale: Avec l’accusatif πρόθεσιν, κατά exprime la conformité; « selon » est naturel et fidèle en français.
- source_word: πρόθεσιν
  choice: dessein
  rationale: « Dessein » exprime une intention délibérée et convient au registre théologique sans être excessivement technique.
- source_word: τῶν αἰώνων
  choice: éternel
  rationale: Littéralement « des âges », le génitif qualifie ici le dessein divin dans sa portée temporelle; « éternel » donne un français naturel, tandis qu’une note conserve l’expression grecque.
- source_word: ἣν ἐποίησεν
  choice: qu’il a accompli
  rationale: Le relatif renvoie à « dessein »; dans ce contexte, ποιέω indique sa mise à exécution plutôt que la simple action de le « faire ».
- source_word: ἐν
  choice: dans
  rationale: « Dans » conserve la valeur première de ἐν et laisse ouverte une éventuelle nuance instrumentale, signalée en note.
- source_word: Χριστῷ
  choice: Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en restitue le sens et l’arrière-plan juif.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: κυρίῳ ἡμῶν
  choice: notre Seigneur
  rationale: Traduction directe et consacrée du titre κύριος accompagné du possessif ἡμῶν.
theological_decisions:
- issue: Sens de τῶν αἰώνων dans πρόθεσιν τῶν αἰώνων
  choice: le dessein éternel
  alternative: le dessein des âges
  rationale: « Éternel » exprime naturellement en français la portée temporelle de la formule, sans masquer sa forme littérale, donnée en note.
- issue: Valeur de ἐν τῷ Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: par le Messie Jésus
  rationale: La traduction retient la valeur directe de ἐν et ne tranche pas silencieusement en faveur d’un sens instrumental.
- issue: Rendu de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot demeure ici un titre porteur de sens; « Messie » le rend explicitement sans ajouter de particularité confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la tension de la préposition grecque ἐν et explicite en notes les principales possibilités lexicales.
