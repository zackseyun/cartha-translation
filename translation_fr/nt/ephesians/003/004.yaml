id: EPH.3.4
reference: Ephesians 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: fr
  text: En lisant cela, vous pouvez saisir comment je comprends le mystère du Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ». Le titre grec Χριστός peut être traduit par « Messie » ou, selon l’usage traditionnel, par « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: En lisant cela
  rationale: La tournure renvoie à ce que Paul vient d’écrire et présente la lecture comme le moyen de saisir sa pensée. Elle restitue naturellement en français le lien de πρὸς ὃ avec le participe ἀναγινώσκοντες.
- source_word: δύνασθε
  choice: vous pouvez
  rationale: Le verbe exprime ici la capacité; « vous pouvez » est direct, naturel et fidèle.
- source_word: νοῆσαι τὴν σύνεσίν μου
  choice: saisir comment je comprends
  rationale: Cette formulation restitue à la fois l’acte de perception exprimé par νοῆσαι et la compréhension de Paul exprimée par σύνεσίν μου, sans la répétition lourde « comprendre ma compréhension ».
- source_word: ἐν τῷ μυστηρίῳ
  choice: le mystère
  rationale: Après « comprendre », le français introduit directement l’objet. La notion de domaine portée par ἐν est intégrée à la tournure idiomatique.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en transmet le sens, tandis que la forme traditionnelle « Christ » est signalée en note.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme fonctionne comme un titre. « Messie » en rend explicitement le sens sans trancher la relation exacte du génitif entre le mystère et le Messie.
- issue: Relation exprimée par τοῦ dans « μυστηρίῳ τοῦ Χριστοῦ »
  choice: mystère du Messie
  alternative: mystère concernant le Messie
  rationale: Le génitif grec peut évoquer un mystère concernant le Messie ou lié à lui. Le génitif français conserve cette concision et cette part d’ambiguïté.
translation_notes:
  register: Français international actuel, clair et digne. La nominalisation grecque est légèrement restructurée pour éviter une répétition peu naturelle tout en conservant les deux idées de perception et de compréhension.
source_grounding:
  english_pob_role: consult_only
