id: EPH.3.7
reference: Ephesians 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: fr
  text: dont je suis devenu serviteur, selon le don de la grâce de Dieu qui m’a été accordée, selon l’action de sa puissance —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont j’ai été fait serviteur » avec une nuance passive plus explicite.'
    reason: Alternative lexicale et grammaticale pour ἐγενήθην.
lexical_decisions:
- source_word: οὗ
  choice: dont
  rationale: 'Le pronom relatif au génitif renvoie à εὐαγγέλιον (« Évangile ») au verset précédent. « Dont » exprime naturellement en français le lien : Paul est devenu serviteur de cet Évangile.'
- source_word: ἐγενήθην
  choice: je suis devenu
  rationale: L’aoriste de γίνομαι exprime ici l’entrée de Paul dans cette fonction. « Je suis devenu » est naturel et conserve une certaine ouverture quant à l’agent, tandis que le contexte attribue clairement cette vocation à la grâce et à la puissance de Dieu.
- source_word: διάκονος
  choice: serviteur
  rationale: Le terme désigne ici celui qui se met au service de l’Évangile. « Serviteur » rend ce sens fonctionnel sans suggérer nécessairement une charge ecclésiale ultérieure, comme pourrait le faire « diacre ».
- source_word: κατὰ τὴν δωρεὰν
  choice: selon le don
  rationale: κατά avec l’accusatif indique ici la norme, la mesure ou le fondement. « Selon le don » conserve la structure grecque et son lien avec l’initiative divine.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: de la grâce de Dieu
  rationale: 'Cette formulation garde la chaîne génitive et laisse ouverte la relation exacte entre le don et la grâce : le don procède de la grâce ou consiste en elle.'
- source_word: τῆς δοθείσης μοι
  choice: qui m’a été accordée
  rationale: Le participe féminin se rapporte grammaticalement à « grâce ». « Accordée » exprime avec naturel le don gracieux tout en conservant la voix passive.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: selon l’action
  rationale: ἐνέργεια désigne une puissance à l’œuvre, une activité efficace. « Action » est idiomatique en français et évite la lourdeur de « fonctionnement » ou le technicisme d’« opération ».
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: de sa puissance
  rationale: « Puissance » est le correspondant français courant de δύναμις dans ce contexte paulinien et souligne la capacité divine effectivement à l’œuvre.
theological_decisions:
- issue: Nature du rôle de Paul exprimé par διάκονος
  choice: serviteur
  alternative: ministre ; diacre
  rationale: Le passage décrit le service confié à Paul à l’égard de l’Évangile sans désigner explicitement une fonction ecclésiastique institutionnelle. « Serviteur » préserve cette portée générale.
- issue: Agent implicite dans ἐγενήθην
  choice: je suis devenu
  alternative: j’ai été fait
  rationale: La forme grecque permet de comprendre une nuance passive, mais « je suis devenu » ne tranche pas artificiellement la question dans le verbe lui-même. Les expressions suivantes indiquent néanmoins que la grâce et la puissance de Dieu sont à l’origine de ce service.
- issue: Rapport entre le don et la grâce
  choice: le don de la grâce de Dieu
  alternative: le don accordé par la grâce de Dieu
  rationale: Le génitif grec peut décrire la grâce comme le contenu ou la source du don. La formulation retenue conserve cette densité et cette ambiguïté plutôt que de l’expliciter dans un seul sens.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « selon » reproduit le parallélisme des deux groupes introduits par κατά. Le tiret final conserve la continuité syntaxique avec le verset suivant.
