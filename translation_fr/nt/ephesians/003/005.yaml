id: EPH.3.5
reference: Ephesians 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: fr
  text: qui n’a pas été porté à la connaissance des êtres humains dans les autres générations comme il a été révélé maintenant à ses saints apôtres et à ses saints prophètes dans l’Esprit[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’Esprit » ; l’expression grecque peut désigner la sphère dans laquelle la révélation a lieu ou le moyen par lequel elle est donnée.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: qui
  rationale: Le pronom relatif neutre renvoie au mystère mentionné au verset précédent. « qui » maintient le lien relatif sans répéter explicitement l’antécédent.
- source_word: ἑτέραις γενεαῖς
  choice: dans les autres générations
  rationale: Le datif a ici une valeur temporelle. « autres » reflète directement ἑτέραις, tandis que le contexte indique qu’il s’agit des générations antérieures.
- source_word: οὐκ ἐγνωρίσθη
  choice: n’a pas été porté à la connaissance
  rationale: Cette formulation conserve le passif et la valeur factitive de γνωρίζω (« faire connaître »), tout en étant naturelle en français.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: des êtres humains
  rationale: L’expression grecque, littéralement « aux fils des hommes », est un sémitisme désignant les humains en général. La traduction idiomatique évite en français moderne une formulation susceptible d’être comprise comme limitée aux hommes de sexe masculin.
- source_word: ὡς νῦν
  choice: comme il a maintenant été
  rationale: '« comme » conserve la comparaison de manière ou de degré : le mystère n’avait pas été communiqué auparavant de la façon dont il l’est désormais.'
- source_word: ἀπεκαλύφθη
  choice: révélé
  rationale: « révéler » rend le terme paulinien de dévoilement et conserve la voix passive.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: à ses saints apôtres et prophètes
  rationale: L’adjectif « saints » porte naturellement sur les deux groupes coordonnés, et « ses » conserve αὐτοῦ sans préciser davantage son référent.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: Le contexte de révélation divine favorise une référence à l’Esprit Saint. « dans » conserve la préposition ἐν et laisse ouverte sa nuance exacte de sphère ou de moyen.
theological_decisions:
- issue: Référent et fonction de πνεύματι
  choice: l’Esprit Saint, avec « dans l’Esprit »
  alternative: « par l’Esprit »; éventuellement « en esprit »
  rationale: Dans ce contexte de révélation accordée aux apôtres et prophètes, l’Esprit Saint est le référent le plus probable. La formulation « dans l’Esprit » préserve toutefois l’ambiguïté réelle entre sphère et moyen, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure sémitique littérale « fils des hommes » est rendue par son sens inclusif « êtres humains » dans le texte principal. La phrase demeure liée au verset précédent, conformément au pronom relatif grec.
