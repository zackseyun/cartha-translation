  terminology: « porté à la connaissance », « révélé » et « l’Esprit » conviennent au registre et au vocabulaire paulinien. « Êtres humains » rend fidèlement le sens collectif de l’expression sémitisante τοῖς υἱοῖς τῶν ἀνθρώπων.
