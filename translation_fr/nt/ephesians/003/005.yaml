  source_fidelity: La structure relative, le passif de γνωρίζω, la comparaison introduite par ὡς νῦν, et la référence probable à l’Esprit sont bien rendus. Toutefois, dans « ses saints apôtres et prophètes », la portée de « saints » peut être comprise en français comme ne qualifiant que « apôtres », alors que ἁγίοις qualifie les deux substantifs coordonnés.
