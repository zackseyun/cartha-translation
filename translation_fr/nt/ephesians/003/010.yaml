id: EPH.3.10
reference: Ephesians 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: fr
  text: afin que, maintenant, par l’intermédiaire de l’Église, la sagesse de Dieu dans toute sa diversité[a] soit portée à la connaissance des principautés et des autorités dans les lieux célestes[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque désigne une sagesse aux multiples aspects, richement variée.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les réalités célestes »; l’expression désigne la sphère céleste.
    reason: lexical_alternative
  - marker: c
    text: Les « principautés et autorités dans les lieux célestes » désignent probablement des puissances cosmiques ou spirituelles, plutôt que de simples autorités humaines.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but; « afin que » en conserve clairement la valeur finale.
- source_word: γνωρισθῇ
  choice: soit portée à la connaissance
  rationale: L’aoriste passif subjonctif est rendu par une tournure passive française naturelle, qui conserve l’idée de faire connaître.
- source_word: νῦν
  choice: maintenant
  rationale: Rend directement l’adverbe temporel et souligne l’étape présente du dessein évoqué.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: aux principautés et aux autorités
  rationale: « Principautés » maintient le vocabulaire cosmique paulinien, tandis qu’« autorités » rend la notion d’autorité exercée sans préciser indûment la nature de ces puissances.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: dans les lieux célestes
  rationale: Expression française établie et compréhensible qui conserve la valeur locative ou sphérique de la formule propre à Éphésiens.
- source_word: διὰ τῆς ἐκκλησίας
  choice: par l’intermédiaire de l’Église
  rationale: Rend explicitement la valeur instrumentale de διά avec le génitif et évite que « par l’Église » soit compris comme désignant l’agent ultime.
- source_word: ἡ πολυποίκιλος σοφία
  choice: la sagesse … dans toute sa diversité
  rationale: Exprime naturellement en français l’idée d’une sagesse richement variée, aux multiples aspects, sans employer un terme rare ou opaque.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Génitif indiquant simplement que cette sagesse est celle de Dieu.
theological_decisions:
- issue: Identité des « principautés et autorités »
  choice: Conserver les désignations générales dans le texte tout en signalant leur probable portée cosmique ou spirituelle.
  alternative: Les identifier explicitement comme des puissances angéliques, ou les comprendre comme des autorités humaines.
  rationale: Le complément « dans les lieux célestes » favorise nettement une référence à des puissances suprahumaines, mais le grec ne les qualifie pas directement d’anges; la traduction préserve cette retenue.
- issue: Rôle de l’Église
  choice: La sagesse divine est portée à la connaissance de ces puissances par l’intermédiaire de l’Église.
  alternative: Comprendre l’Église comme l’agent autonome qui enseigne directement ces puissances.
  rationale: La tournure instrumentale conserve l’Église comme moyen dans le dessein de Dieu sans ajouter un mécanisme absent du texte.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la structure de but et l’ordre théologique du grec, avec une légère explicitation idiomatique pour l’instrumentalité et pour πολυποίκιλος.
