id: EPH.3.16
reference: Ephesians 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: fr
  text: afin qu’il vous accorde, selon la richesse de sa gloire, d’être puissamment fortifiés par son Esprit dans votre être intérieur,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans l’homme intérieur »; cette expression désigne la personne dans sa dimension intérieure.'
    reason: Précision sur la formulation littérale et sur le caractère représentatif de ἄνθρωπος.
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: afin qu’il vous accorde
  rationale: ἵνα introduit ici le contenu et la visée de la prière, tandis que δῷ exprime le don demandé. « Afin que » conserve la subordination, et « accorde » convient naturellement à une requête adressée à Dieu.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: selon la richesse de sa gloire
  rationale: κατά avec l’accusatif indique la mesure ou la norme. « Selon » évite l’idée d’une simple portion, et le singulier « richesse » reflète le texte grec de la SBLGNT tout en restant idiomatique en français.
- source_word: δυνάμει κραταιωθῆναι
  choice: d’être fortifiés avec puissance
  rationale: Le passif de κραταιόω est conservé par « être fortifiés ». Le datif δυνάμει exprime le moyen ou la manière; « avec puissance » maintient explicitement le motif paulinien de la puissance sans réduire l’expression à « fortement ».
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: par son Esprit
  rationale: διά avec le génitif marque ici le moyen ou l’agent. « Par » est naturel en français; la majuscule à « Esprit » indique le référent divin fortement soutenu par le contexte paulinien.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: dans votre être intérieur
  rationale: L’expression désigne la dimension intérieure de la personne. « Être intérieur » rend le sens inclusif de ἄνθρωπος en français moderne, tandis que « dans » exprime naturellement la sphère ou le lieu visé par l’affermissement.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’Esprit de Dieu (« son Esprit »)
  alternative: son esprit, compris comme une influence ou une puissance divine impersonnelle
  rationale: Le possessif renvoie à Dieu, et le contexte de l’épître soutient fortement une action divine exercée par son Esprit. La traduction ne développe pas davantage la formulation grecque.
- issue: Sens de ἔσω ἄνθρωπον
  choice: l’être intérieur, c’est-à-dire la personne dans sa dimension intérieure
  alternative: l’homme intérieur
  rationale: ἄνθρωπος est ici un singulier représentatif et non une désignation réservée aux hommes. « Être intérieur » conserve le contraste anthropologique sans introduire une restriction masculine.
- issue: Rapport exprimé par εἰς
  choice: la sphère ou la dimension dans laquelle les destinataires sont fortifiés (« dans »)
  alternative: le mouvement ou le but (« jusque dans » ou « pour ce qui est de » l’être intérieur)
  rationale: La préposition permet une nuance de direction ou de visée, mais une traduction strictement spatiale serait peu naturelle. « Dans » préserve la localisation intérieure tout en laissant ouverte la nuance de but.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste subordonnée afin de s’intégrer à la prière commencée dans les versets précédents. « Fortifiés avec puissance » conserve volontairement la proximité des deux termes grecs liés à la force, malgré une légère redondance en français.
