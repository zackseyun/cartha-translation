id: EPH.3.8
reference: Ephesians 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: fr
  text: 'À moi, qui suis le plus petit de tous les saints, cette grâce a été accordée : annoncer aux non-Juifs[a] la richesse insondable du Messie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux nations ». Ici, le terme désigne les peuples non juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « du Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: le plus petit
  rationale: Cette forme intensive, littéralement inhabituelle, exprime l’extrême humilité de Paul. « Le plus petit » est naturel en français et garde la force rhétorique dans le contexte.
- source_word: ἁγίων
  choice: les saints
  rationale: Dans l’usage paulinien, le terme désigne les croyants comme peuple consacré à Dieu. « Les saints » reste concis, digne et lexicalement proche du grec.
- source_word: χάρις
  choice: grâce
  rationale: Le mot évoque ici à la fois la faveur divine et la mission accordée à Paul. « Grâce » conserve cette densité théologique.
- source_word: ἔθνεσιν
  choice: les non-Juifs
  rationale: Dans ce contexte, le terme désigne les peuples autres que le peuple juif. « Les non-Juifs » rend clairement cette distinction en français courant.
- source_word: εὐαγγελίσασθαι
  choice: annoncer
  rationale: L’infinitif exprime la mission d’annoncer la bonne nouvelle. Avec pour objet « la richesse insondable », « annoncer » est naturel et évite une formulation inutilement lourde.
- source_word: ἀνεξιχνίαστον
  choice: insondable
  rationale: Le terme désigne ce qu’on ne peut explorer ou comprendre jusqu’au bout. « Insondable » conserve l’image et demeure idiomatique.
- source_word: πλοῦτος
  choice: richesse
  rationale: Le singulier grec désigne l’abondance inépuisable qui se trouve dans le Messie. Le singulier français suit directement le texte source.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en traduit le sens, tandis que « Christ » demeure une possibilité traditionnelle signalée en note.
theological_decisions:
- issue: Rendu de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le grec porte le titre de l’oint. « Messie » en exprime le sens sans ajouter de précision doctrinale, et la forme traditionnelle « Christ » est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure met en relief le contraste entre l’humilité de Paul et la grâce de sa mission. Le deux-points rend naturellement la valeur explicative de l’infinitif grec.
