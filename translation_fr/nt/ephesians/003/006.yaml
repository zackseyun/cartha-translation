  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: fr
  text: à savoir que les non-Juifs[a] partagent le même héritage, font partie du même corps et participent à la promesse en Jésus le Messie[b], par l’Évangile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations ». Ici, le terme désigne les peuples non juifs que Dieu associe à son peuple dans sa promesse de salut.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « en Jésus-Christ » ou « dans le Christ Jésus ». Le grec Χριστός est rendu ici par « Messie » afin de préserver sa valeur de titre.'
    reason: alternative_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans ce contexte paulinien, le terme désigne les peuples autres que le peuple juif, et non les nations comme entités politiques.
- source_word: συγκληρονόμα
  choice: partagent avec eux le même héritage
  rationale: Cette formulation naturelle rend la valeur du préfixe συν-, qui exprime un héritage reçu en commun.
- source_word: σύσσωμα
  choice: forment avec eux un même corps
  rationale: Le terme rare exprime l’intégration commune dans un seul corps; la formulation conserve clairement l’image corporelle.
- source_word: συμμέτοχα τῆς ἐπαγγελίας
  choice: ont part avec eux à la promesse
  rationale: La tournure idiomatique française rend la participation commune exprimée par συμμέτοχα tout en conservant le singulier « la promesse ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: L’ordre est adapté au français naturel, tandis que « le Messie » préserve la valeur titulaire de Χριστός dans cet argument sur l’accomplissement de la promesse.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: par l’Évangile
  rationale: διά avec le génitif indique ici le moyen par lequel les non-Juifs accèdent à cette participation commune.
- source_word: εἶναι
  choice: à savoir que
  rationale: L’infinitif précise le contenu du mystère mentionné au verset précédent; « à savoir que » explicite naturellement ce lien en français.
theological_decisions:
- issue: 'Valeur de Χριστός : titre messianique ou forme devenue quasi nominale'
  choice: Jésus le Messie
  alternative: Jésus-Christ / le Christ Jésus
  rationale: Le contexte porte sur l’intégration des non-Juifs à la promesse divine accomplie dans le Messie; la force du titre demeure donc pertinente.
- issue: Référent de τὰ ἔθνη
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contraste contextuel concerne l’inclusion des personnes d’origine non juive avec les croyants d’origine juive; « les non-Juifs » évite une lecture géopolitique.
- issue: Référent implicite du préfixe συν- dans les trois termes composés
  choice: avec eux, c’est-à-dire avec les croyants d’origine juive dans le contexte
  alternative: maintenir seulement des composés techniques comme « cohéritiers » et « coparticipants »
  rationale: Le grec souligne trois fois une participation commune sans répéter explicitement le groupe de comparaison. La formulation française en déploie le sens sans modifier l’égalité affirmée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « avec eux » restitue le rythme des trois composés grecs en συν- par des tournures françaises naturelles; « Évangile » conserve le terme biblique courant.
