  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: fr
  text: À lui soit la gloire dans l’Église et dans le Messie Jésus[a], à travers toutes les générations, aux siècles des siècles. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ Jésus ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en préserver le sens.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: À lui soit la gloire
  rationale: La formule grecque est sans verbe. Le français doxologique « À lui soit la gloire » exprime naturellement l’attribution ou le souhait implicite sans préciser indûment la nuance.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: dans l’Église
  rationale: « Église » est le terme français courant pour la communauté des croyants dans cet emploi paulinien. « Dans » maintient le parallèle des deux groupes introduits par ἐν.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: et dans le Messie Jésus
  rationale: La préposition est conservée pour reproduire le parallélisme. Χριστός est rendu selon son sens de titre, « Messie », tandis que Ἰησοῦ est rendu par le nom français usuel « Jésus ».
- source_word: εἰς πάσας τὰς γενεὰς
  choice: à travers toutes les générations
  rationale: Dans cette expression temporelle, εἰς marque l’extension dans le temps. Cette formulation française en communique clairement la portée continue.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Cette tournure doxologique exprime une durée sans fin. La formulation retenue conserve l’image grecque des âges tout en restant familière dans un registre biblique français.
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération liturgique consacrée et immédiatement comprise en français.
theological_decisions:
- issue: Valeur de Χριστός dans Χριστῷ Ἰησοῦ
  choice: le Messie Jésus
  alternative: Christ Jésus
  rationale: « Messie » rend explicitement le titre grec et son sens, sans changer le référent. La forme traditionnelle « Christ Jésus » demeure signalée en note afin de reconnaître l’usage français largement établi.
- issue: Rapport entre l’Église et le Messie dans la doxologie
  choice: dans l’Église et dans le Messie Jésus
  alternative: par l’Église et par le Messie Jésus
  rationale: La traduction conserve ἐν et le parallélisme syntaxique, sans trancher en faveur d’une valeur instrumentale plus interprétative.
translation_notes:
  register: Français international moderne, digne et doxologique. La majuscule à « Église » signale ici la communauté universelle plutôt qu’un bâtiment ou une assemblée locale. Le point d’exclamation rend la force de l’acclamation sans modifier son contenu.
