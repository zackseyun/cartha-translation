id: EPH.3.3
reference: Ephesians 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: fr
  text: C’est par révélation[a] que le mystère m’a été fait connaître[b], comme je l’ai écrit plus haut en quelques mots[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon une révélation » ou « au moyen d’une révélation ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « m’a été révélé » ; grec : « m’a été fait connaître ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « brièvement » ou « en peu de mots ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: par révélation
  rationale: Cette expression rend naturellement en français le moyen ou le mode de la communication, tout en laissant ouverte la nuance plus formelle « selon une révélation ».
- source_word: ἐγνωρίσθη μοι
  choice: m’a été fait connaître
  rationale: Le passif grec est conservé sans préciser l’agent implicite. Cette formulation évite aussi de confondre le verbe avec le nom « révélation » déjà présent.
- source_word: τὸ μυστήριον
  choice: le mystère
  rationale: Dans cet usage paulinien, « mystère » désigne une réalité ou un dessein divin auparavant caché puis dévoilé. Le terme établi préserve la catégorie théologique sans en anticiper l’explication contextuelle.
- source_word: καθὼς
  choice: comme
  rationale: Conjonction comparative simple et naturelle qui relie cette affirmation à ce que Paul a déjà écrit.
- source_word: προέγραψα
  choice: je l’ai écrit plus haut
  rationale: Dans le contexte, le verbe renvoie vraisemblablement à un passage antérieur de la lettre. « Plus haut » est idiomatique en français et ne suppose pas un autre écrit.
- source_word: ἐν ὀλίγῳ
  choice: en quelques mots
  rationale: Cette expression française naturelle conserve l’idée d’une mention concise; « brièvement » reste une possibilité.
theological_decisions:
- issue: Sens de μυστήριον dans l’usage paulinien
  choice: Conserver « le mystère » sans en expliciter ici le contenu.
  alternative: « le secret » ou « le dessein caché de Dieu »
  rationale: Le verset nomme cette réalité sans encore la définir pleinement. Une paraphrase importerait dans ce verset une explication donnée par le contexte.
- issue: Agent du passif ἐγνωρίσθη
  choice: Ne pas nommer explicitement l’agent.
  alternative: « Dieu m’a fait connaître »
  rationale: Le contexte implique une révélation divine, mais le grec emploie un passif et ne nomme pas ici l’agent; la traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, naturel et digne. La construction clivée « C’est par révélation que… » met en relief κατὰ ἀποκάλυψιν, placé en tête dans le grec, sans ajouter d’information. Tous les marqueurs de notes figurent dans le texte.
