source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: fr
  text: C’est pourquoi moi, Paul, le prisonnier du Messie Jésus[a] pour vous, les non-Juifs—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Christ Jésus ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τούτου χάριν
  choice: C’est pourquoi
  rationale: Cette locution renvoie au raisonnement précédent et introduit sa conséquence. « C’est pourquoi » en restitue naturellement la valeur logique en français.
- source_word: ἐγὼ Παῦλος
  choice: moi, Paul
  rationale: Le pronom grec explicite met Paul en relief. « moi, Paul » conserve cette insistance sans alourdir excessivement la phrase.
- source_word: ὁ δέσμιος
  choice: le prisonnier
  rationale: Le nom désigne directement une personne détenue. « Le prisonnier » est précis et laisse au complément qui suit sa portée théologique.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Χριστός est ici le titre de Jésus. « Messie » en traduit le sens, tandis que le génitif « du » préserve l’ambiguïté entre appartenance, service et emprisonnement lié à Jésus.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Dans ce contexte, ὑπέρ exprime que l’emprisonnement de Paul est en faveur des destinataires ou lié à leur cause. Le français simple « pour vous » conserve cette latitude.
- source_word: τῶν ἐθνῶν
  choice: les non-Juifs
  rationale: En apposition à « vous », le terme désigne ici les personnes issues des peuples autres qu’Israël, plutôt que des États ou des nations au sens politique. « Les non-Juifs » est clair et courant en français moderne.
theological_decisions:
- issue: Χριστός comme titre messianique ou forme traditionnelle devenue quasi nominale
  choice: Messie Jésus
  alternative: Christ Jésus
  rationale: Le texte grec emploie Χριστός comme titre associé à Jésus. Le texte principal en donne donc le sens par « Messie », tout en signalant la formulation traditionnelle en note.
- issue: Rapport exprimé par « prisonnier du Messie Jésus »
  choice: Maintien du génitif français « du »
  alternative: prisonnier à cause du Messie Jésus
  rationale: Le génitif grec peut évoquer l’appartenance au Messie, le service qu’on lui rend ou le fait d’être emprisonné à cause de lui. Une explicitation causale trancherait indûment cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La construction interrompue et le tiret final sont conservés, puisque Paul suspend ici sa phrase avant de reprendre son propos plus loin.
