  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: fr
  text: C’est pourquoi je vous demande de ne pas vous décourager à cause des souffrances que j’endure pour vous[a], car elles sont votre gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « de ne pas perdre courage devant les souffrances que j’endure pour vous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « votre honneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence tirée du développement précédent.
- source_word: αἰτοῦμαι
  choice: je vous demande
  rationale: Le destinataire implicite de la demande est explicité en français d’après le contexte et la construction infinitive.
- source_word: μὴ ἐγκακεῖν
  choice: de ne pas vous décourager
  rationale: ἐγκακέω désigne ici la perte de courage; « se décourager » est actuel, clair et idiomatique.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: à cause des souffrances que j’endure
  rationale: Avec un verbe exprimant le découragement, ἐν peut indiquer la circonstance qui en est l’occasion. La formulation française rend ce rapport sans atténuer la gravité de θλῖψις.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Préserve de façon concise l’idée que Paul souffre en faveur des destinataires, sans préciser davantage le mécanisme de cette représentation.
- source_word: ἥτις
  choice: cela
  rationale: Le pronom grec est au singulier malgré le pluriel « souffrances »; « cela » renvoie naturellement à l’ensemble de la situation et conserve l’étendue possible du référent.
- source_word: δόξα ὑμῶν
  choice: votre gloire
  rationale: « Gloire » garde le poids rhétorique et théologique de δόξα, plutôt que de réduire le sens à la seule réputation ou à un motif de fierté.
theological_decisions:
- issue: Référent de ἥτις ἐστὶν δόξα ὑμῶν
  choice: « cela » renvoie aux souffrances de Paul pour les destinataires, envisagées comme une réalité globale
  alternative: La proposition peut viser plus largement le ministère de Paul et les souffrances qui l’accompagnent en leur faveur.
  rationale: Le singulier ἥτις invite à reprendre conceptuellement toute la situation plutôt qu’à imposer un simple accord avec le pluriel « souffrances ». « Cela » préserve cette tension et évite de restreindre artificiellement le référent.
translation_notes:
  register: Français international moderne, digne et accessible. « Se décourager » et « souffrances » sont courants sans être familiers; « votre gloire » conserve volontairement la formulation théologiquement dense du texte grec.
