id: EPH.3.15
reference: Ephesians 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: fr
  text: de qui toute famille dans les cieux et sur la terre reçoit son nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute la famille dans les cieux et sur la terre » ; ou, de manière plus interprétative : « de qui toute paternité dans les cieux et sur la terre tire son nom ».'
    reason: 'Lecture alternative : πᾶσα peut être comprise collectivement, et πατριά peut être rendue de façon abstraite pour faire ressortir son lien étymologique avec « Père ».'
lexical_decisions:
- source_word: ἐξ οὗ
  choice: de qui
  rationale: 'La préposition ἐξ avec le pronom relatif au génitif indique naturellement l’origine : « de qui ». Cette formulation préserve le lien avec le Père mentionné au verset précédent sans expliciter davantage que le grec la relation de dérivation.'
- source_word: πᾶσα
  choice: toute
  rationale: 'Avec un nom singulier sans article, πᾶσα a ici vraisemblablement une valeur distributive : « toute famille », au sens de « chaque famille ». La possibilité collective « toute la famille » est conservée en note.'
- source_word: πατριά
  choice: famille
  rationale: πατριά désigne normalement un groupe familial, un clan ou une lignée. « Famille » est le terme français courant le plus large et conserve, dans la mesure du possible, l’écho avec « Père » au verset précédent. « Paternité » rendrait ce jeu étymologique plus visible, mais imposerait un sens abstrait moins probable.
- source_word: ἐν οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel « les cieux » correspond au grec οὐρανοῖς et reste naturel dans le registre biblique français contemporain.
- source_word: ἐπὶ γῆς
  choice: sur la terre
  rationale: Traduction locative directe et idiomatique de ἐπὶ γῆς.
- source_word: ὀνομάζεται
  choice: reçoit son nom
  rationale: Le présent passif signifie littéralement « est nommée ». En français, « reçoit son nom » exprime naturellement cette construction passive et son lien avec la source indiquée par « de qui », sans aller aussi loin que « tire son nom » ou « doit son nom », qui affirmeraient plus explicitement la dérivation.
theological_decisions:
- issue: Sens de πᾶσα πατριά en relation avec « le Père » au verset précédent
  choice: toute famille
  alternative: toute la famille ; toute paternité
  rationale: « Toute famille » garde le sens social ordinaire de πατριά et la valeur probablement distributive de πᾶσα, sans décider que Paul parle nécessairement d’une seule famille universelle. La note signale à la fois la lecture collective traditionnelle et la lecture abstraite qui met davantage en relief le jeu de mots entre πατήρ et πατριά.
translation_notes:
  register: Français international moderne, clair et digne. « Reçoit son nom » évite la raideur de « est nommée de qui » tout en restant proche du passif grec. Le pluriel « les cieux » conserve la forme de l’original.
