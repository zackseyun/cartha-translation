source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: fr
  text: et de connaître l’amour du Messie, qui dépasse la connaissance, afin que vous soyez remplis jusqu’à toute la plénitude de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « remplis de toute la plénitude de Dieu ». Le grec dit littéralement « remplis jusqu’à toute la plénitude de Dieu », expression condensée qui peut souligner une progression vers la pleine mesure de la plénitude de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: connaître
  rationale: Rend directement l’infinitif de γινώσκω et conserve, dans ce contexte de prière, sa portée à la fois cognitive et vécue.
- source_word: τε
  choice: et
  rationale: Coordonne avec légèreté cette demande aux précédentes; « et » est naturel et n’alourdit pas la liaison.
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως
  choice: qui dépasse toute connaissance
  rationale: La proposition relative rend naturellement le participe et préserve le paradoxe entre « connaître » et un amour qui excède la connaissance. « Toute » explicite en français la portée générale naturelle de γνώσεως dans cette construction, sans supprimer le paradoxe.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: l’amour du Messie
  rationale: « Amour » est le correspondant direct de ἀγάπη. « Messie » traduit le titre Χριστός, tandis que le génitif « du Messie » reste formellement ouvert quant à sa nuance précise.
- source_word: ἵνα
  choice: afin que
  rationale: Marque clairement la visée de la demande dans un registre français actuel et digne.
- source_word: πληρωθῆτε
  choice: vous soyez remplis
  rationale: Rend le subjonctif passif sans déplacer le sens vers l’accomplissement d’une tâche ou d’une prophétie.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: jusqu’à toute la plénitude de Dieu
  rationale: « Jusqu’à » conserve la force directionnelle et télique de εἰς. La formulation garde l’expression dense de Paul sans la réduire à un simple complément de contenu.
theological_decisions:
- issue: Valeur du génitif dans τοῦ Χριστοῦ
  choice: l’amour du Messie
  alternative: l’amour que le Messie nous porte; l’amour pour le Messie
  rationale: Le contexte favorise l’amour venant du Messie, mais la construction grecque n’explicite pas à elle seule la relation. Le français « du Messie » préserve cette tension.
- issue: Traduction du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot grec est un titre messianique; « Messie » en transmet le sens plutôt que de recourir uniquement à sa forme traditionnellement translittérée.
- issue: Sens de εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: jusqu’à toute la plénitude de Dieu
  alternative: de toute la plénitude de Dieu
  rationale: « Jusqu’à » maintient l’orientation vers un but ou une mesure exprimée par εἰς, tout en évitant de préciser indûment la nature métaphysique de cette plénitude.
translation_notes:
  register: Français international moderne, naturel et soutenu. La répétition « connaître / connaissance » est volontaire afin de préserver le paradoxe du grec. « Jusqu’à toute la plénitude » est inhabituel mais intelligible et conserve la densité ainsi que la direction de l’expression originale.
