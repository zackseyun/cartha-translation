  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: fr
  text: C’est pourquoi[a], ne devenez pas insensés, mais comprenez quelle est la volonté du Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par conséquent ». On pourrait aussi traduire la suite par : « ne soyez pas insensés », mais « ne devenez pas » rend plus précisément le verbe grec.'
    reason: Alternative lexicale et nuance du verbe grec.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: La locution renvoie à l’exhortation précédente et introduit une conséquence. « C’est pourquoi » exprime naturellement ce lien en français moderne.
- source_word: μὴ γίνεσθε
  choice: ne devenez pas
  rationale: Le verbe γίνομαι exprime l’entrée dans un état plutôt que le simple fait d’y être. « Ne devenez pas » en préserve la nuance dynamique.
- source_word: ἄφρονες
  choice: insensés
  rationale: Ἄφρων désigne ici ceux qui manquent de compréhension et de jugement pratique. « Insensés » maintient le contraste lexical avec l’ordre de comprendre sans répéter le vocabulaire de la sagesse du contexte immédiat.
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » rend directement l’opposition forte entre l’interdiction et l’exhortation positive.
- source_word: συνίετε
  choice: comprenez
  rationale: Le verbe signifie comprendre ou saisir. « Comprenez » est clair, naturel et conserve la force impérative.
- source_word: τί τὸ θέλημα
  choice: quelle est la volonté
  rationale: La tournure française idiomatique « quelle est la volonté » rend la proposition interrogative indirecte introduite par τί sans en modifier le contenu.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: La traduction conserve le titre κύριος sans préciser son référent au-delà de ce que dit le grec.
theological_decisions:
- issue: Référent de « Seigneur » (τοῦ κυρίου)
  choice: « du Seigneur », sans ajouter « Jésus »
  alternative: « du Seigneur Jésus » ou « de Dieu »
  rationale: Dans Éphésiens, « Seigneur » désigne souvent Jésus, mais ce verset ne donne que κύριος. La traduction préserve cette formulation et son degré de précision.
- issue: Valeur de l’interdiction μὴ γίνεσθε
  choice: « ne devenez pas »
  alternative: « ne soyez pas »
  rationale: Cette formulation conserve l’idée d’entrer dans un état et n’affirme pas que les destinataires sont déjà pleinement insensés.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit de près la structure grecque tout en employant une interrogation indirecte idiomatique en français.
