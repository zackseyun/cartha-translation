  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: fr
  text: Mais tout ce qui est mis en lumière par la lumière devient visible.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais tout, lorsqu’il est mis en lumière par la lumière, devient visible. » Le participe et le verbe grecs peuvent être compris de deux manières très proches, l’accent portant soit sur ce qui est mis en lumière, soit sur le fait que tout devient visible lorsqu’il est ainsi exposé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Mais tout
  rationale: Le neutre pluriel substantivé a une portée générale. En français, « tout » est plus naturel que « toutes choses », tandis que « mais » rend le léger contraste introduit par δέ.
- source_word: ἐλεγχόμενα
  choice: ce qui est mis en lumière
  rationale: Dans ce contexte d’opposition entre ténèbres et lumière, ἐλέγχω désigne l’action de dévoiler ou de démasquer. Cette formulation conserve le sens passif sans réduire le terme à une réprimande verbale.
- source_word: ὑπὸ τοῦ φωτός
  choice: par la lumière
  rationale: ὑπό suivi du génitif indique ici l’agent; l’article défini reprend l’image de la lumière déjà présente dans le contexte.
- source_word: φανεροῦται
  choice: devient visible
  rationale: Le présent passif peut exprimer le fait d’être rendu manifeste ou de devenir visible. « Devient visible » est naturel et convient précisément à l’image de la lumière.
theological_decisions:
- issue: Référent de « la lumière »
  choice: Conserver simplement « la lumière »
  alternative: Préciser qu’il s’agit du Christ, de l’Évangile, de la vérité morale ou du témoignage des croyants
  rationale: Le contexte nourrit plusieurs associations, mais le verset ne précise pas lui-même le référent. La traduction maintient donc l’ampleur de la métaphore.
- issue: Rapport syntaxique entre ἐλεγχόμενα et φανεροῦται
  choice: « tout ce qui est mis en lumière par la lumière devient visible »
  alternative: « tout, lorsqu’il est mis en lumière par la lumière, devient visible »
  rationale: Le participe grec et le verbe principal permettent des analyses très proches, selon que l’accent porte sur ce qui est exposé ou sur l’ensemble des choses au moment où elles sont exposées. Le texte retient la lecture relative la plus fluide en français et signale l’autre en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « mis en lumière par la lumière » est conservée malgré sa légère lourdeur afin de préserver le jeu lexical et l’image du grec.
