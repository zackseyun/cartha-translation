  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: fr
  text: mettant à profit le temps[a], car les jours sont mauvais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rachetant le temps » ; l’expression grecque peut aussi signifier « tirant pleinement parti de l’occasion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: mettant à profit
  rationale: Le participe évoque littéralement l’action de racheter ou d’acheter entièrement, mais l’expression signifie ici tirer le meilleur parti du temps ou de l’occasion. « Mettant à profit » est naturel en français moderne et exprime clairement cette exhortation pratique.
- source_word: καιρόν
  choice: le temps
  rationale: καιρός désigne souvent un moment approprié ou une occasion favorable. « Le temps » conserve la formulation familière et sa portée générale, tandis que la note signale explicitement la nuance d’occasion.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation. « Car » convient au registre digne de l’épître tout en restant courant.
- source_word: αἱ ἡμέραι
  choice: les jours
  rationale: Traduction directe qui conserve l’image temporelle du texte sans expliciter indûment une référence au siècle présent ou aux circonstances.
- source_word: πονηραί
  choice: mauvais
  rationale: Dans l’expression française « les jours sont mauvais », l’adjectif garde la dimension morale et hostile de πονηραί. « Difficiles » ou « troublés » en affaibliraient la portée.
theological_decisions:
- issue: Risque de comprendre ἐξαγοραζόμενοι comme un terme technique de rédemption salvifique
  choice: Exhortation à bien employer le temps et les occasions
  alternative: « rachetant le temps »
  rationale: Dans ce contexte d’exhortation morale, le verbe décrit l’usage avisé de chaque occasion plutôt qu’une œuvre de salut. La traduction principale évite d’introduire une nuance sotériologique non explicite, tout en conservant la métaphore possible dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure participiale liée au contexte précédent et la formulation concise de l’original.
