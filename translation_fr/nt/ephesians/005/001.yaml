id: EPH.5.1
reference: Ephesians 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: fr
  text: Devenez donc imitateurs de Dieu, comme des enfants bien-aimés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Soyez imitateurs de Dieu » ; l’impératif grec peut souligner soit le fait de le devenir, soit celui de l’être continuellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Devenez
  rationale: L’impératif présent de γίνομαι peut exprimer une entrée dans un état ou un processus continu. « Devenez » conserve cette dynamique exhortative, tandis que la note signale l’autre nuance possible.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français la conséquence tirée de l’exhortation précédente, sans alourdir la phrase.
- source_word: μιμηταὶ
  choice: les imitateurs
  rationale: Le nom désigne ceux qui prennent quelqu’un pour modèle et l’imitent. « Imitateurs » préserve le motif explicite de l’imitation, contrairement à « disciples » ou « ceux qui suivent ».
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Rend directement le génitif grec dans un français idiomatique.
- source_word: ὡς
  choice: comme
  rationale: « Comme » conserve la concision du grec et peut exprimer ici la qualité ou la manière, sans imposer une valeur strictement causale.
- source_word: τέκνα
  choice: des enfants
  rationale: τέκνα est inclusif et met l’accent sur la relation filiale plutôt que sur le sexe; « enfants » est exact et naturel.
- source_word: ἀγαπητά
  choice: bien-aimés
  rationale: « Bien-aimés » restitue la valeur affective de ἀγαπητά dans un registre biblique digne et courant.
theological_decisions:
- issue: Rapport entre l’exhortation à imiter Dieu et l’identité filiale
  choice: La formulation exhorte à imiter Dieu en tant qu’enfants bien-aimés, sans suggérer que l’imitation fait devenir enfants de Dieu.
  alternative: 'Comprendre la proposition uniquement comme une comparaison de manière : « à la façon d’enfants bien-aimés ».'
  rationale: Le grec compact permet de percevoir à la fois la manière et le fondement identitaire de l’exhortation. « Comme des enfants bien-aimés » préserve cette ouverture sans ajouter une doctrine explicite de l’adoption.
translation_notes:
  register: Français international moderne, clair et digne. « Devenez » conserve la dynamique du verbe grec; « bien-aimés » maintient la chaleur affective et le registre biblique sans archaïsme marqué.
