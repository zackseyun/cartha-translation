source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: fr
  text: De même, les maris aussi doivent aimer leurs propres femmes comme leurs propres corps. Celui qui aime sa propre femme s’aime lui-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: De même
  rationale: Cette expression relie naturellement l’exhortation à la comparaison qui précède tout en conservant la valeur déductive de l’adverbe grec.
- source_word: ὀφείλουσιν
  choice: doivent
  rationale: Le verbe exprime ici une obligation morale. « Doivent » est naturel en français et convient à la force exhortative de l’indicatif grec.
- source_word: καὶ οἱ ἄνδρες
  choice: les maris
  rationale: Dans ce contexte conjugal, ἄνδρες désigne les maris. La valeur additive de καί est rendue par « De même » dans l’enchaînement français, plutôt que par un « aussi » redondant.
- source_word: ἀγαπᾶν
  choice: aimer
  rationale: Ce choix conserve la répétition du verbe ἀγαπάω et son lien lexical avec la suite du verset.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: leur propre femme
  rationale: γυναῖκας signifie ici « femme » au sens d’épouse. Le singulier distributif français est idiomatique après « les maris », et « propre » maintient l’insistance réflexive de ἑαυτῶν.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: comme leur propre corps
  rationale: « Comme » garde la comparaison explicite, tandis que le singulier distributif rend naturellement le rapport de chaque mari à son corps.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: Celui qui aime sa propre femme
  rationale: « Celui qui » restitue le participe substantivé masculin singulier et « propre » conserve l’accent réflexif.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: s’aime lui-même
  rationale: La tournure française rend clairement le pronom réfléchi emphatique et maintient la répétition du verbe « aimer ».
theological_decisions:
- issue: Langage genré dans l’exhortation conjugale
  choice: Employer « les maris » et « Celui qui »
  alternative: « les hommes » ou une formulation épicène comme « la personne qui »
  rationale: Le contexte vise précisément les époux masculins, et non l’humanité en général. La traduction conserve donc la référence genrée du grec sans l’élargir.
- issue: Nature du rapport entre la femme et le corps du mari
  choice: Conserver une comparaison explicite avec « comme » et la conclusion « s’aime lui-même »
  alternative: Développer le propos comme une affirmation d’identité métaphysique
  rationale: Le texte articule une analogie éthique et en tire une conclusion sur l’amour de soi. La traduction préserve cette tension sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier distributif « leur propre femme » et « leur propre corps » évite une formulation lourde tout en préservant l’individualité de chaque relation conjugale. Aucun marqueur de note n’est requis.
