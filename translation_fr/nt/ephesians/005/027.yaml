id: EPH.5.27
reference: Ephesians 5:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: fr
  text: afin que lui-même présente l’Église à lui-même, glorieuse[a], sans tache ni ride ni rien de semblable[b], mais afin qu’elle soit sainte et irréprochable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa gloire ». L’adjectif grec peut désigner une qualité (« glorieuse ») ou l’état glorieux dans lequel l’Église est présentée.
    reason: lexical_alternative
  - marker: b
    text: Ou « ni quoi que ce soit de ce genre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sans défaut » ou « sans tache ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: présenter
  rationale: Dans cette proposition de but introduite par ἵνα, « présenter » exprime naturellement l’idée d’amener quelqu’un devant soi et convient à l’image nuptiale du contexte.
- source_word: αὐτὸς ἑαυτῷ
  choice: se présenter à lui-même
  rationale: La tournure française conserve à la fois la valeur réfléchie de ἑαυτῷ et l’idée que le Christ accomplit personnellement cette présentation; le pronom réfléchi rend toutefois moins distinctement l’emphase autonome de αὐτός.
- source_word: ἔνδοξον
  choice: dans sa gloire
  rationale: Cette formulation présente la gloire comme l’état dans lequel l’Église est amenée devant le Christ, tout en restant naturelle en français.
- source_word: ἐκκλησίαν
  choice: l’Église
  rationale: Ici, le terme désigne collectivement le peuple de Dieu dans l’analogie entre le Christ et son Église; « Église » est l’équivalent français établi.
- source_word: μὴ ἔχουσαν
  choice: sans
  rationale: « Sans » rend idiomatiquement en français l’état décrit par le participe grec négatif, sans alourdir la phrase.
- source_word: σπίλον
  choice: tache
  rationale: « Tache » conserve l’image concrète d’une marque qui altère la pureté ou la beauté et s’associe naturellement à « ride ».
- source_word: ῥυτίδα
  choice: ride
  rationale: C’est l’équivalent direct et naturel qui maintient l’image corporelle et nuptiale.
- source_word: ἤ τι τῶν τοιούτων
  choice: ni rien de semblable
  rationale: Cette expression française naturelle conserve l’élargissement à tout défaut comparable aux exemples précédents.
- source_word: ἁγία
  choice: sainte
  rationale: « Sainte » est le rendu courant et théologiquement sobre, sans réduire le terme à une simple explication telle que « mise à part ».
- source_word: ἄμωμος
  choice: irréprochable
  rationale: Le mot grec peut évoquer l’absence de défaut comme l’absence de reproche. « Irréprochable » convient au binôme avec « sainte », tandis que la note signale l’autre nuance.
theological_decisions:
- issue: Présentation réfléchie du Christ et de l’Église
  choice: Conserver « se présenter à lui-même »
  alternative: Simplifier en « présenter l’Église » ou interpréter explicitement une présentation devant Dieu
  rationale: Le grec porte explicitement l’emphase de αὐτός et le réfléchi ἑαυτῷ. La traduction ne tranche pas l’arrière-plan théologique au-delà de la formulation du verset.
- issue: Entrecroisement des images nuptiale, morale et sacrificielle
  choice: Employer « tache », « ride », « sainte » et « irréprochable »
  alternative: Employer « souillure » et « sans défaut » dans le texte principal
  rationale: Le choix maintient les images concrètes de beauté et de pureté ainsi que la dimension morale, sans imposer une seule lecture métaphorique.
translation_notes:
  register: Français international moderne, digne et fluide. La phrase garde la structure finale du grec tout en évitant le calque lourd « ne possédant pas ». La personnification féminine de l’Église est portée naturellement par le genre grammatical et les adjectifs « sainte » et « irréprochable ».
