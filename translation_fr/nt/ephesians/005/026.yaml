  text: ἵνα αὐτὴν ἁγιάσῃ καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: fr
  text: afin de la sanctifier[a], après l’avoir purifiée par le bain d’eau avec la parole[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de la rendre sainte ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « bain d’eau avec la parole » évoque vraisemblablement le baptême, mais le grec ne précise pas à lui seul jusqu’à quel point cette référence doit être comprise dans un sens sacramentel.
    reason: cultural_note
  - marker: c
    text: Ou « avec le message »; le mot grec peut désigner une parole, une déclaration ou un message.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin de
  rationale: Introduit le but de l’action du Christ et conserve naturellement en français la valeur finale de la proposition.
- source_word: αὐτὴν
  choice: la
  rationale: Le pronom féminin singulier renvoie à l’Église dans le contexte.
- source_word: ἁγιάσῃ
  choice: sanctifier
  rationale: Conserve le lien lexical avec la sainteté et rend l’aoriste subjonctif dépendant de ἵνα comme le but visé.
- source_word: καθαρίσας
  choice: après l’avoir purifiée
  rationale: Exprime naturellement en français l’action participiale comme antérieure à « sanctifier », tout en suppléant l’objet féminin implicite d’après le contexte.
- source_word: τῷ λουτρῷ
  choice: par le bain
  rationale: Rend la valeur instrumentale probable du datif. « Bain » préserve l’image concrète de λουτρόν sans préciser à lui seul sa portée rituelle.
- source_word: τοῦ ὕδατος
  choice: d’eau
  rationale: Reproduit simplement le génitif qui qualifie le bain, sans surinterpréter la relation.
- source_word: ἐν ῥήματι
  choice: avec la parole
  rationale: « Avec » laisse ouverte la relation exacte entre la parole et le bain d’eau, tandis que la virgule évite de présenter sans nuance la parole comme l’unique moyen de purification.
- source_word: ῥήματι
  choice: parole
  rationale: Le terme peut désigner une parole, une déclaration ou un message. « Parole » en conserve l’étendue sémantique et les résonances sans l’identifier explicitement à une formule ou à la proclamation de l’Évangile.
theological_decisions:
- issue: Rapport entre la purification, le bain d’eau et la parole dans un contexte potentiellement baptismal
  choice: Conserver l’image du bain d’eau et la relation souple exprimée par « avec la parole », sans définir une doctrine sacramentelle précise.
  alternative: Expliciter soit un baptême sacramentel, soit une purification purement métaphorique.
  rationale: Le langage évoque vraisemblablement le baptême, mais le grec ne tranche pas à lui seul la nature exacte de cette référence ni le rôle précis de la parole.
- issue: Sens précis de ῥήματι
  choice: Employer « parole » dans le texte principal.
  alternative: Employer « message », « parole prononcée », « formule baptismale » ou « message de l’Évangile ».
  rationale: Le contexte peut suggérer un message proclamé ou une parole associée au lavage, mais le terme grec reste plus large; la traduction ne doit pas en réduire indûment le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de la structure grecque tout en employant « après l’avoir purifiée » pour une syntaxe française naturelle. Les termes « sanctifier », « bain d’eau » et « parole » préservent l’imagerie et l’ambiguïté théologique du texte source.
