  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: fr
  text: En effet[a], le mari est la tête[b] de sa femme, comme le Messie est lui aussi la tête de l’Église, lui-même le Sauveur du corps[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Car » ; le terme grec introduit la raison ou l’explication de ce qui précède.
    reason: lexical_alternative
  - marker: b
    text: « Tête » conserve la métaphore grecque, comprise diversement comme évoquant notamment l’autorité, la prééminence ou la source.
    reason: lexical_alternative
  - marker: c
    text: Litt. « lui-même Sauveur du corps » ; le grec emploie une apposition sans verbe.
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅτι
  choice: En effet
  rationale: Introduit la raison ou l’explication de l’exhortation précédente. « En effet » restitue naturellement cette valeur explicative en français.
- source_word: ἀνήρ
  choice: mari
  rationale: Dans ce passage consacré aux relations conjugales, le sens relationnel « mari » est imposé par le contexte.
- source_word: κεφαλή
  choice: tête
  rationale: Conserve la métaphore grecque sans la réduire à une interprétation contestée telle que « chef », « autorité » ou « source ».
- source_word: γυνή
  choice: femme
  rationale: Associé à ἀνήρ dans ce contexte conjugal, le mot désigne l’épouse. La tournure française « sa femme » exprime naturellement cette relation.
- source_word: ὡς καὶ
  choice: comme … lui aussi
  rationale: Préserve la comparaison et la présence de καί sans suggérer une identité absolue entre les deux relations comparées.
- source_word: Χριστός
  choice: Messie
  rationale: Le terme fonctionne ici comme un titre christologique; « Messie » en exprime le sens plutôt que de le traiter comme un simple nom propre.
- source_word: ἐκκλησία
  choice: Église
  rationale: Désigne ici la communauté croyante dans son ensemble; « Église » est l’équivalent français courant dans ce contexte paulinien.
- source_word: αὐτός
  choice: lui-même
  rationale: Conserve l’emphase du pronom grec et rattache expressément le rôle salvateur au Messie.
- source_word: σωτήρ
  choice: Sauveur
  rationale: Rend le sens de délivrance et la portée salvifique du terme dans ce contexte christologique.
- source_word: σῶμα
  choice: corps
  rationale: Maintient la métaphore paulinienne du corps. Aucun possessif n’est ajouté, puisque le grec dit simplement « du corps ».
theological_decisions:
- issue: Sens de κεφαλή dans la comparaison entre le mari et la femme, puis entre le Messie et l’Église
  choice: Conserver la métaphore « tête »
  alternative: chef, source, celui qui exerce l’autorité sur
  rationale: Le sens précis de la métaphore est débattu. La traduction ne tranche pas entre autorité, prééminence et origine, mais préserve la tension interprétative du texte.
- issue: Rendu de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot garde ici sa valeur de titre et sa portée messianique; « Messie » rend ce contenu de manière transparente.
- issue: Rapport syntaxique de αὐτὸς σωτὴρ τοῦ σώματος avec la proposition précédente
  choice: 'Apposition concise : « lui-même Sauveur du corps »'
  alternative: 'Proposition explicitée : « il est lui-même le Sauveur du corps »'
  rationale: L’apposition reproduit la concision du grec et évite d’introduire un verbe absent, tout en laissant clairement entendre que le Messie est le Sauveur du corps.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la métaphore de la tête, le titre « Messie », l’emphase de « lui-même » et la concision appositionnelle de la fin du verset.
