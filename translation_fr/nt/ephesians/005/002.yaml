id: EPH.5.2
reference: Ephesians 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: fr
  text: et marchez dans l’amour, tout comme le Messie[a] nous a aimés et s’est livré lui-même pour nous[b], en offrande et en sacrifice à Dieu, comme un parfum agréable[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec Χριστός signifie « Messie » ou « Oint »; il est rendu ici par « le Messie » parce qu’il fonctionne comme un titre.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « en notre faveur ». La formule grecque peut exprimer ici que son don bénéficie aux croyants ou qu’il est accompli en leur faveur.'
    reason: lexical_alternative
  - marker: c
    text: L’expression évoque le langage sacrificiel de l’Ancien Testament, où le parfum d’une offrande est présenté comme agréable à Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: marchez
  rationale: Conserve la métaphore paulinienne de la marche pour désigner la manière de vivre; l’expression « marcher dans l’amour » reste compréhensible et digne en français biblique moderne.
- source_word: ἐν ἀγάπῃ
  choice: dans l’amour
  rationale: Préserve la construction prépositionnelle et sa nuance de sphère ou de manière.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: Avec l’article, Χριστός fonctionne ici comme un titre; « le Messie » en traduit le sens plutôt que de le traiter comme un nom propre.
- source_word: ἠγάπησεν ἡμᾶς
  choice: nous a aimés
  rationale: Rend directement l’aoriste et maintient le lien lexical avec « l’amour » au début du verset.
- source_word: παρέδωκεν ἑαυτὸν
  choice: s’est livré lui-même
  rationale: Exprime le don volontaire de soi et conserve l’insistance du pronom réfléchi grec.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: Formulation naturelle qui garde ouvertes les nuances bénéfactives et représentatives de ὑπέρ sans imposer une précision absente de la préposition elle-même.
- source_word: προσφορὰν καὶ θυσίαν
  choice: en offrande et en sacrifice
  rationale: Conserve les deux termes cultuels distincts et rend leur fonction appositionnelle par une tournure française naturelle.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Rend le datif comme indiquant le destinataire de l’offrande et du sacrifice.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: comme un parfum agréable
  rationale: Restitue naturellement l’image olfactive du langage sacrificiel tout en évitant le calque peu idiomatique « odeur de bonne odeur ».
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec muni de l’article a ici une valeur titulaire; traduire le titre en explicite le sens, tandis qu’une note conserve la formulation traditionnelle possible.
- issue: Portée de ὑπὲρ ἡμῶν dans le contexte sacrificiel
  choice: pour nous
  alternative: en notre faveur
  rationale: Le contexte donne au don de soi une portée sacrificielle claire, mais « pour nous » préserve l’étendue sémantique de ὑπέρ sans la réduire à une formulation substitutionnelle plus précise que le grec.
- issue: Valeur de l’image εἰς ὀσμὴν εὐωδίας
  choice: comme un parfum agréable
  alternative: pour produire un parfum agréable
  rationale: La formulation retenue garde l’image et son écho sacrificiel sans trancher excessivement la fonction exacte de εἰς entre résultat, effet et caractérisation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La métaphore « marchez » et les deux termes sacrificiels sont conservés; les calques olfactifs archaïques ou maladroits sont évités.
