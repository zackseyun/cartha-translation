  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: fr
  text: Ce mystère est grand[a], mais moi, je parle du Messie et de l’Église.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ce mystère est profond ». Le grec dit plus littéralement « grand », terme qui peut exprimer la grandeur ou l’importance, et pas seulement la profondeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: mystère
  rationale: Dans les lettres de Paul, le terme désigne généralement une réalité divine autrefois cachée et désormais révélée, et non une simple énigme. « Mystère » conserve cet usage sans l’expliciter excessivement.
- source_word: μέγα
  choice: grand
  rationale: « Grand » rend directement l’adjectif grec et peut évoquer aussi bien l’importance que l’ampleur. « Profond » serait naturel, mais préciserait davantage la nuance.
- source_word: δὲ
  choice: mais
  rationale: La conjonction introduit ici une légère opposition ou une transition vers l’explication de Paul.
- source_word: ἐγὼ λέγω
  choice: moi, je parle
  rationale: La tournure rend le pronom sujet exprimé et donc accentué, tout en conservant le sens verbal de λέγω plutôt que de le paraphraser par « je veux dire ».
- source_word: εἰς … καὶ εἰς
  choice: ici du … et de
  rationale: Après λέγω, εἰς indique ce à quoi les paroles se rapportent. « Je parle ici de » est idiomatique en français moderne; la coordination française permet d’exprimer naturellement les deux référents.
- source_word: Χριστόν
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Le Messie » en rend le sens tout en restant naturel dans cette déclaration théologique.
- source_word: ἐκκλησίαν
  choice: l’Église
  rationale: Dans ce contexte paulinien, le terme désigne collectivement le peuple croyant, et non une assemblée civique particulière. « Église » est le terme français établi et contextuellement approprié.
theological_decisions:
- issue: Référent de « ce mystère » dans le rapprochement entre le mariage, le Messie et l’Église
  choice: Conserver la formulation ouverte du grec, puis l’explication selon laquelle Paul parle du Messie et de l’Église.
  alternative: Préciser que le mystère est soit l’union conjugale en une seule chair, soit la citation de Genèse 2.24, soit la portée typologique du mariage.
  rationale: Le texte ne tranche pas explicitement entre ces possibilités. La traduction préserve donc le mouvement explicatif et la tension interprétative sans imposer une conclusion doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. « Je parle ici de » évite le tour lourd « en référence à » tout en rendant la relation exprimée par εἰς. La majuscule à « Église » indique ici la communauté croyante envisagée dans son ensemble.
