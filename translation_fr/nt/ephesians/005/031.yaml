  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: fr
  text: C’est pourquoi[a] l’homme quittera son père et sa mère, s’attachera à sa femme, et les deux deviendront une seule chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de cela ». L’expression grecque introduit ici la conséquence ou la raison dans la citation de Genèse 2.24.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: C’est pourquoi
  rationale: Dans cette citation de Genèse 2.24, la locution sert de lien causal ou consécutif. « C’est pourquoi » est naturel en français et convient mieux au contexte que le sens substitutif littéral « à la place de cela ».
- source_word: καταλείψει
  choice: quittera
  rationale: Le verbe désigne ici le fait de quitter le foyer parental pour former une nouvelle union, sans suggérer l’abandon affectif que pourrait évoquer « délaissera ».
- source_word: ἄνθρωπος
  choice: l’homme
  rationale: Bien que le mot puisse désigner l’être humain en général, il renvoie ici au partenaire masculin, mis en relation avec « sa femme ».
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: son père et sa mère
  rationale: Cette formulation française naturelle conserve les deux relations familiales explicitement mentionnées.
- source_word: προσκολληθήσεται
  choice: s’attachera à
  rationale: Le moyen-passif futur exprime une union étroite. « S’attachera à » rend bien l’image relationnelle et demeure naturel en français.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: sa femme
  rationale: Dans ce contexte matrimonial, γυνή signifie « épouse » ou « femme »; « sa femme » est la formulation française courante.
- source_word: ἔσονται οἱ δύο
  choice: les deux deviendront
  rationale: Le grec dit littéralement « les deux seront », mais le français exprime plus naturellement le résultat de l’union par « deviendront ».
- source_word: εἰς σάρκα μίαν
  choice: une seule chair
  rationale: Cette expression biblique désigne l’union conjugale. « Chair » préserve l’image du texte source, tandis que « corps » en réduirait la portée.
theological_decisions:
- issue: Langage sexué dans la citation sur le mariage
  choice: l’homme … sa femme
  alternative: une personne … son conjoint
  rationale: La citation de Genèse 2.24 présente explicitement un homme et sa femme. La traduction conserve cette formulation sans la neutraliser.
- issue: Sens de σάρξ dans εἰς σάρκα μίαν
  choice: une seule chair
  alternative: un seul corps
  rationale: Ici, σάρξ reprend le langage relationnel et corporel de la Genèse, et non l’emploi paulinien pouvant désigner la condition humaine marquée par le péché. L’expression traditionnelle garde cette richesse sans imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La structure de la citation reste reconnaissable, avec un vocabulaire biblique accessible. La répétition des coordinations est légèrement adaptée à la ponctuation française sans modifier les relations du texte.
