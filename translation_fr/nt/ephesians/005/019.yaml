  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: fr
  text: vous adressant les uns aux autres[a] par des psaumes, des hymnes et des chants spirituels, chantant et faisant de la musique de tout cœur pour le Seigneur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « entre vous » ou « à vous-mêmes » ; le pronom réfléchi grec est généralement compris ici au sens réciproque : « les uns aux autres ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « chantant les louanges » ; le verbe grec peut désigner le fait de chanter des louanges ou de faire de la musique, sans préciser nécessairement si des instruments l’accompagnent.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: vous adressant
  rationale: Le participe présent est conservé et la tournure française exprime naturellement une parole dirigée vers les autres, sans lui donner un caractère liturgique ou formel absent du grec.
- source_word: ἑαυτοῖς
  choice: les uns aux autres
  rationale: Dans ce contexte collectif, le pronom réfléchi au pluriel a naturellement un sens réciproque. Une note conserve les autres possibilités formelles.
- source_word: ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς
  choice: par des psaumes, des hymnes et des chants spirituels
  rationale: La traduction maintient la série de trois termes et rend πνευματικαῖς sans préciser abusivement s’il signifie simplement « spirituels » ou plus expressément « suscités par l’Esprit ».
- source_word: ᾄδοντες
  choice: chantant
  rationale: Équivalent direct et naturel du participe grec, coordonné au participe suivant.
- source_word: ψάλλοντες
  choice: faisant monter … vos mélodies
  rationale: Cette formulation garde la nuance musicale et l’orientation vers le Seigneur, sans imposer ni exclure un accompagnement instrumental.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: de tout votre cœur
  rationale: Cette expression française idiomatique rend le cœur comme siège intérieur et comme manière de chanter. « Tout » explicite l’engagement cordial naturel dans cette locution sans modifier le référent.
- source_word: τῷ κυρίῳ
  choice: vers le Seigneur
  rationale: « Seigneur » est l’équivalent normal de κύριος. « Vers » exprime ici la destination des chants et des mélodies sans préciser dans le verset si le titre désigne explicitement Jésus.
theological_decisions:
- issue: Sens de ψάλλοντες et pratique musicale
  choice: « faisant monter … vos mélodies » sans mention d’un instrument
  alternative: « chantant les louanges » ou « jouant d’un instrument »
  rationale: À l’époque du Nouveau Testament, ψάλλω peut désigner le fait de chanter des louanges ou de produire une mélodie, mais le mot n’impose pas ici une conclusion pour ou contre l’emploi d’instruments.
- issue: Référent de « Seigneur »
  choice: Conserver « le Seigneur »
  alternative: Préciser « le Seigneur Jésus »
  rationale: Le contexte d’Éphésiens peut orienter l’identification, mais le verset lui-même porte κύριος. La traduction n’ajoute donc pas un référent explicite.
- issue: Portée de πνευματικαῖς
  choice: « spirituels »
  alternative: « inspirés par l’Esprit » ou « suscités par l’Esprit »
  rationale: L’adjectif peut évoquer l’action de l’Esprit, mais la formulation grecque ne justifie pas d’imposer ici une théorie particulière de l’inspiration de ces chants.
translation_notes:
  register: Français international moderne, digne et fluide. La construction participiale et la ponctuation finale maintiennent le lien syntaxique avec le contexte. « Faire monter ses mélodies vers » est une formulation poétique mais accessible, qui préserve la nuance musicale du grec sans trancher la question des instruments.
