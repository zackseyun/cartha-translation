  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: fr
  text: Car il est honteux même de parler de ce qu’ils font en secret.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication qui appuie l’exhortation précédente et conserve le mouvement argumentatif de Paul.
- source_word: τὰ ... γινόμενα
  choice: ce qu’ils font
  rationale: L’article avec le participe a une valeur substantive et désigne les actes accomplis. Cette formulation est naturelle en français et, avec le complément d’agent, rend clairement l’action sans l’alourdir.
- source_word: κρυφῇ
  choice: en secret
  rationale: Cette forme adverbiale exprime le caractère caché de l’action; « en secret » est idiomatique et précis.
- source_word: ὑπ’ αὐτῶν
  choice: ils
  rationale: Le complément d’agent grec est naturellement rendu en français par un sujet actif. Le pronom demeure non explicité, comme dans le grec, et son référent est fourni par le contexte.
- source_word: αἰσχρόν
  choice: honteux
  rationale: Le terme exprime ce qui est moralement honteux ou déshonorant; « honteux » est actuel, clair et digne.
- source_word: καὶ λέγειν
  choice: même de parler de
  rationale: καί a ici une valeur intensive (« même »). « Parler de » rend naturellement l’idée de mentionner ces actes.
theological_decisions:
- issue: Référent de αὐτῶν
  choice: Conserver le pronom « ils » sans en préciser le référent dans le verset.
  alternative: Expliciter par « ceux qui désobéissent » ou « ceux qui commettent les œuvres des ténèbres ».
  rationale: Le texte grec ne nomme pas de nouveau l’antécédent; celui-ci ressort du contexte. L’expliciter introduirait dans le verset une interprétation contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure active « ce qu’ils font » évite le passif plus lourd « ce qui est fait par eux » tout en préservant le sens et l’ambiguïté du pronom.
