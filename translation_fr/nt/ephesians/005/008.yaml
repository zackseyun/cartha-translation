id: EPH.5.8
reference: Ephesians 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: fr
  text: Car vous étiez autrefois ténèbres, mais maintenant, vous êtes lumière dans le Seigneur. Marchez[a] comme des enfants de lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « Vivez comme des enfants de lumière. » Le grec dit littéralement « marchez », métaphore fréquente chez Paul pour désigner la manière de vivre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: vous étiez
  rationale: L’imparfait de εἰμί décrit directement leur état passé.
- source_word: γάρ
  choice: Car
  rationale: Le terme introduit la raison qui soutient l’exhortation précédente.
- source_word: ποτε
  choice: autrefois
  rationale: Ce mot exprime naturellement en français le contraste entre leur condition passée et leur condition présente.
- source_word: σκότος
  choice: ténèbres
  rationale: 'Le nom est attribut du sujet : Paul ne dit pas seulement qu’ils étaient dans les ténèbres, mais qu’ils étaient ténèbres. Cette formulation conserve la force de la métaphore.'
- source_word: νῦν δὲ
  choice: mais maintenant
  rationale: Cette tournure marque clairement l’opposition entre l’ancien état et le nouvel état.
- source_word: φῶς
  choice: lumière
  rationale: Comme σκότος, ce nom est attribut du sujet et exprime fortement leur nouvelle identité, sans l’atténuer en « dans la lumière ».
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La préposition exprime ici le cadre relationnel ou l’union dans lesquels leur nouvelle identité existe; cette traduction respecte aussi l’usage paulinien.
- source_word: ὡς
  choice: comme
  rationale: Le mot introduit la manière de vivre qui correspond à leur identité d’enfants de lumière.
- source_word: τέκνα φωτός
  choice: des enfants de lumière
  rationale: τέκνα désigne les enfants sans distinction de sexe; le complément « de lumière » conserve l’image caractérisant leur identité.
- source_word: περιπατεῖτε
  choice: Marchez
  rationale: L’impératif présent reprend une métaphore éthique fréquente chez Paul. « Marchez » la préserve, tandis que la note en explicite le sens.
theological_decisions:
- issue: La métaphore identitaire « vous étiez ténèbres… vous êtes lumière »
  choice: Conserver les noms attributs « ténèbres » et « lumière ».
  alternative: « vous étiez dans les ténèbres, mais maintenant vous êtes dans la lumière »
  rationale: Le grec emploie des attributs nominaux sans préposition. Cette formulation saisissante présente une transformation d’identité et de condition morale et spirituelle, et non un simple changement de milieu.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage néotestamentaire et conserve la portée théologique du terme sans en restreindre le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation inhabituelle mais intentionnelle « vous étiez ténèbres » est maintenue afin de conserver la force du grec. Le marqueur de note est placé après « Marchez », le mot auquel la note se rapporte.
