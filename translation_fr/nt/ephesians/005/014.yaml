id: EPH.5.14
reference: Ephesians 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: fr
  text: 'Car tout ce qui est rendu visible est lumière[a]. C’est pourquoi il est dit : « Réveille-toi, toi qui dors, relève-toi d’entre les morts[b], et le Messie[c] brillera sur toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qui est dévoilé est lumière ». Le participe grec peut signifier « rendu visible », « dévoilé » ou « mis au jour ».'
    reason: lexical_alternative
  - marker: b
    text: La provenance exacte de cette citation est incertaine. Elle peut reprendre des thèmes de l’Écriture, notamment Ésaïe 60.1, ou provenir d’un ancien hymne chrétien.
    reason: cross_reference
  - marker: c
    text: 'Grec : « le Christ ». « Le Messie » traduit ici Χριστός comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν τὸ φανερούμενον
  choice: tout ce qui est rendu visible
  rationale: Le neutre singulier a une portée générale. « Rendu visible » conserve le passif et le lien immédiat avec la lumière, sans exclure le sens d’« être dévoilé ».
- source_word: φῶς
  choice: lumière
  rationale: Traduction directe qui préserve sans l’expliciter la portée métaphorique.
- source_word: διὸ λέγει
  choice: C’est pourquoi il est dit
  rationale: Cette tournure française naturelle préserve l’impersonnalité du grec et ne précise ni l’auteur ni la nature de la citation.
- source_word: Ἔγειρε, ὁ καθεύδων
  choice: Réveille-toi, toi qui dors
  rationale: Formulation actuelle et digne qui rend clairement l’impératif et l’adresse portée par le participe substantivé.
- source_word: ἀνάστα ἐκ τῶν νεκρῶν
  choice: relève-toi d’entre les morts
  rationale: « Relève-toi » distingue cet impératif de « Réveille-toi », tandis que « d’entre les morts » conserve l’image de quelqu’un qui se lève au milieu des morts.
- source_word: ἐπιφαύσει σοι
  choice: brillera sur toi
  rationale: Rend directement l’image lumineuse du verbe futur sans la transformer en explication abstraite.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: L’article et le contexte favorisent ici la valeur de titre de Χριστός; « le Messie » en exprime le sens en français.
theological_decisions:
- issue: Nature et source de la citation
  choice: il est dit
  alternative: il dit ; l’Écriture dit ; on chante
  rationale: Le sujet de λέγει et la provenance exacte de la citation ne sont pas indiqués. La traduction ne tranche donc pas entre parole scripturaire, écho biblique et hymne chrétien ancien.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme fonctionne ici comme un titre. La note conserve la formulation traditionnelle sans traiter la question comme définitivement résolue par le seul usage français.
- issue: Portée de la lumière
  choice: est lumière
  alternative: est éclairé par la lumière
  rationale: Le texte grec pose directement l’identité prédicative « est lumière ». La traduction maintient cette formulation théologiquement et métaphoriquement tendue au lieu de l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le raisonnement serré du grec et la forme poétique de la citation. Les formulations « est lumière » et « brillera sur toi » préservent l’imagerie sans paraphrase doctrinale.
