id: EPH.5.24
reference: Ephesians 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: fr
  text: Mais, de même que l’Église se soumet au Messie[a], les épouses doivent aussi se soumettre à leur mari en toute chose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Christ ».'
    reason: Signale l’autre rendu traditionnel du titre grec Χριστός.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste ou la reprise par rapport à l’énoncé précédent; « Mais » est le connecteur français le plus naturel ici.
- source_word: ὡς ... οὕτως καὶ
  choice: de même que ... de même
  rationale: Reproduit clairement la structure comparative corrélative du grec dans un français naturel.
- source_word: ἡ ἐκκλησία
  choice: l’Église
  rationale: Dans cet emploi paulinien, le terme désigne la communauté des croyants; « l’Église » est la formulation française courante et claire.
- source_word: ὑποτάσσεται
  choice: se soumet
  rationale: Le verbe pronominal rend naturellement la forme et le sens relationnel du grec, sans ajouter une idée de contrainte absente du terme lui-même.
- source_word: τῷ Χριστῷ
  choice: au Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en traduit le sens, tandis que « Christ » est signalé en note comme autre rendu traditionnel.
- source_word: αἱ γυναῖκες
  choice: les femmes
  rationale: Le nom grec signifie « femmes » ou « épouses »; le contexte conjugal précise ici qu’il s’agit des femmes dans leur relation à leur mari, sans qu’il soit nécessaire de remplacer le terme par « épouses ».
- source_word: τοῖς ἀνδράσιν
  choice: à leur mari
  rationale: Dans ce contexte domestique, ἀνήρ signifie « mari ». Le singulier distributif français « leur mari » exprime naturellement la relation conjugale de chaque femme.
- source_word: ἐν παντί
  choice: en toute chose
  rationale: Rend directement toute l’étendue de l’expression grecque sans l’atténuer ni lui ajouter de restriction interprétative.
- source_word: ellipse du verbe dans la seconde proposition
  choice: doivent se soumettre
  rationale: Le grec sous-entend dans la seconde proposition le verbe exprimé dans la première et repris du contexte précédent. Son rétablissement produit une phrase française complète et explicite sans modifier le sens.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme a ici valeur de titre. « Messie » en traduit le contenu; « Christ », forme traditionnelle issue de la translittération, demeure indiqué en note.
- issue: Portée de la soumission conjugale
  choice: Conserver « en toute chose » sans qualificatif ajouté
  alternative: Ajouter une restriction explicative telle que « en toute chose convenable »
  rationale: Le grec dit simplement ἐν παντί. Ajouter ici une limitation résoudrait dans la traduction une tension que le texte de ce verset laisse ouverte.
- issue: Explicitation du verbe sous-entendu
  choice: Rétablir « doivent se soumettre » dans la seconde proposition
  alternative: 'Conserver l’ellipse: « de même les femmes à leur mari »'
  rationale: Le verbe est syntaxiquement sous-entendu en grec. Le français courant exige son rétablissement pour une lecture claire; « doivent » exprime la portée normative du contexte sans transformer la proposition en impératif direct.
translation_notes:
  register: Français international moderne, clair et digne. La structure comparative du grec est conservée, le verbe sous-entendu est explicité pour l’intelligibilité, et aucune restriction interprétative n’est ajoutée à « en toute chose ».
