  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: fr
  text: Ne vous associez donc pas à eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, littéralement, « ne devenez pas participants avec eux ». Le grec indique un partage avec « eux » sans préciser ce qui est partagé ; le contexte évoque leur conduite coupable.
    reason: alternative lexicale et ambiguïté contextuelle
lexical_decisions:
- source_word: μὴ
  choice: ne… pas
  rationale: Négation normale de l’impératif en français.
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement la conséquence tirée de l’avertissement des versets précédents.
- source_word: γίνεσθε
  choice: devenez
  rationale: Préserve l’idée d’entrer dans une condition ou de le devenir, plutôt que le simple état exprimé par « soyez ».
- source_word: συμμέτοχοι
  choice: complices
  rationale: Dans ce contexte moral, « complices » exprime avec naturel le fait de s’associer à d’autres dans leur conduite, sans alourdir la phrase.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le possessif français construit avec « complices » renvoie bien aux personnes mentionnées, tout en laissant le domaine précis de la participation dépendre du contexte.
theological_decisions:
- issue: Portée de la participation exprimée par συμμέτοχοι αὐτῶν
  choice: Interdiction de s’associer à ces personnes dans ce qui les caractérise, sans préciser explicitement s’il s’agit de leurs actes ou des conséquences qu’elles subiront.
  alternative: Ne participez pas avec eux à ces choses ; ne partagez pas leurs actes.
  rationale: Le grec renvoie explicitement à des personnes (« eux »), tandis que le contexte suggère leur conduite coupable et, éventuellement, son jugement. La formulation conserve cette tension sans ajouter un complément absent.
translation_notes:
  register: Français international moderne, bref et digne. « Leurs complices » est idiomatique et énergique ; la note conserve les autres nuances possibles du terme grec.
