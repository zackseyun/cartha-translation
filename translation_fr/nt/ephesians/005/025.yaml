id: EPH.5.25
reference: Ephesians 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: fr
  text: Vous, les maris, aimez vos femmes, tout comme le Messie[a] a lui aussi aimé l’Église et s’est livré lui-même pour elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec Χριστός signifie « Messie » ou « Oint ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « s’est donné lui-même pour elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: Vous, les maris
  rationale: Dans ce cadre consacré aux relations conjugales, ἄνδρες désigne les hommes en tant qu’époux. La tournure française explicite l’interpellation sans la réduire aux hommes en général.
- source_word: ἀγαπᾶτε … ἠγάπησεν
  choice: aimez … a aimé
  rationale: Le même verbe français conserve le lien lexical entre le commandement adressé aux maris et l’amour du Messie présenté comme modèle.
- source_word: τὰς γυναῖκας
  choice: vos femmes
  rationale: Le contexte matrimonial impose le sens d’« épouses ». Le possessif, naturel en français, exprime la relation implicite entre les maris interpellés et leurs femmes.
- source_word: καθὼς καὶ
  choice: tout comme … lui aussi
  rationale: Cette formulation rend à la fois la comparaison introduite par καθώς et la valeur additive ou emphatique de καί.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: Χριστός est ici un titre articulé. « Le Messie » en restitue directement le sens, tandis que « le Christ » demeure une formulation traditionnelle possible.
- source_word: τὴν ἐκκλησίαν
  choice: l’Église
  rationale: Dans ce passage, ἐκκλησία désigne collectivement le peuple lié au Messie. « L’Église » est l’équivalent français établi et convient à la personnification poursuivie par « elle ».
- source_word: ἑαυτὸν παρέδωκεν
  choice: s’est livré lui-même
  rationale: La formulation exprime la remise volontaire de soi et conserve l’insistance du pronom réfléchi ἑαυτόν, sans ajouter une théorie particulière de l’expiation.
- source_word: ὑπὲρ αὐτῆς
  choice: pour elle
  rationale: « Pour » rend naturellement ὑπέρ avec le génitif et laisse ouvertes ses nuances de bénéfice, de représentation et d’action en faveur de l’Église.
theological_decisions:
- issue: Traduction du titre Χριστός dans l’analogie entre le mariage et l’Église
  choice: le Messie
  alternative: le Christ
  rationale: Le grec présente Χριστός avec l’article, ce qui fait ressortir sa valeur de titre. « Le Messie » en transmet le sens sans introduire de particularité confessionnelle.
- issue: Portée sacrificielle de παρέδωκεν ὑπὲρ αὐτῆς
  choice: s’est livré lui-même pour elle
  alternative: s’est donné lui-même pour elle
  rationale: Le choix retenu préserve l’idée forte d’une remise volontaire de soi en faveur de l’Église, tout en évitant d’ajouter des précisions doctrinales absentes de cette proposition.
translation_notes:
  register: Français international moderne, naturel et digne. « Vous, les maris » rend clairement l’adresse directe; « vos femmes » conserve le pluriel relationnel du grec. La majuscule à « Église » signale ici la communauté entière personnifiée, et non un bâtiment ou une seule assemblée locale.
