  text: Αἱ γυναῖκες τοῖς ἰδίοις ⸀ἀνδράσιν ὡς τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/022.yaml
  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: fr
  text: Les femmes[a], à leur propre mari comme au Seigneur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'De nombreuses traductions ajoutent ici « soumettez-vous », repris du verset 21 : « Femmes, soumettez-vous à votre propre mari comme au Seigneur. » En grec, le verset 22 est elliptique et dépend de la proposition précédente.'
    reason: Lecture alternative et explication de l’ellipse grammaticale.
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Les femmes
  rationale: Dans ce contexte consacré aux relations conjugales, γυναῖκες désigne les épouses. Le français « les femmes », mis en relation avec « leur propre mari », exprime naturellement ce sens sans lourdeur.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: à leur propre mari
  rationale: ἀνήρ signifie ici « mari », et ἴδιος souligne la relation conjugale particulière. Le singulier distributif est plus naturel en français que « à leurs propres maris » et n’implique pas qu’une même femme ait plusieurs maris.
- source_word: ὡς
  choice: comme
  rationale: « Comme » conserve la comparaison simple du grec sans en préciser excessivement la portée.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Dans ce contexte paulinien, κύριος renvoie au Seigneur Jésus. La formulation française usuelle est « au Seigneur ».
- source_word: verbe implicite repris du contexte
  choice: ellipse conservée
  rationale: Le texte grec de ce verset ne comporte pas de verbe exprimé; il dépend de ὑποτασσόμενοι (« vous soumettant ») au verset 21. La traduction conserve cette ellipse et l’explique en note.
theological_decisions:
- issue: Faut-il ajouter « soumettez-vous » dans le corps du verset malgré son absence dans le grec de ce verset?
  choice: Ne pas ajouter le verbe; conserver la construction elliptique.
  alternative: Femmes, soumettez-vous à votre propre mari comme au Seigneur.
  rationale: Le sens de la soumission est repris du verset 21, mais il n’est pas formulé de nouveau dans le texte grec de 5.22. Garder l’ellipse respecte la forme de la source et évite de présenter comme explicite dans ce verset ce qui vient grammaticalement du contexte précédent.
translation_notes:
  register: Français international moderne, sobre et digne. L’ellipse est volontaire et doit se lire dans la continuité immédiate du verset 21. Le singulier distributif « leur propre mari » est idiomatique en français.
