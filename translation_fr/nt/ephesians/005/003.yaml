id: EPH.5.3
reference: Ephesians 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: fr
  text: Mais que l’immoralité sexuelle, toute impureté ou l’avidité ne soient même pas mentionnées parmi vous[a], comme il convient aux saints[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’on n’en parle même pas parmi vous ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « saints » désigne les croyants comme le peuple mis à part pour Dieu, non une catégorie de personnes canonisées ultérieurement.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: immoralité sexuelle
  rationale: Le terme désigne largement les comportements sexuels illicites; «immoralité sexuelle» est actuel et ne le réduit pas aux relations avant le mariage.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition légèrement contrastive avec l’exhortation précédente.
- source_word: ἀκαθαρσία πᾶσα
  choice: aucune forme d’impureté
  rationale: Dans la tournure négative française, cette formulation exprime naturellement la portée exhaustive de πᾶσα.
- source_word: ἢ
  choice: ni
  rationale: Après «aucune… aucune…», «ni» rend naturellement la coordination disjonctive dans une interdiction.
- source_word: πλεονεξία
  choice: avidité
  rationale: Le mot exprime le désir insatiable d’avoir davantage, souvent aux dépens d’autrui; «avidité» conserve cette portée générale sans la limiter au domaine sexuel.
- source_word: μηδὲ ὀνομαζέσθω
  choice: ne soient même mentionnées
  rationale: La construction rend l’impératif passif de forte interdiction ainsi que l’emphase de μηδέ, tout en évitant de suggérer qu’il serait interdit d’enseigner contre ces vices.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: La locution vise la présence ou la réputation de ces conduites au sein de la communauté.
- source_word: καθὼς πρέπει
  choice: comme il convient
  rationale: Cette expression française actuelle restitue la norme de conduite appropriée.
- source_word: ἁγίοις
  choice: ceux qui appartiennent à Dieu
  rationale: Dans l’usage paulinien, le terme désigne l’ensemble des croyants mis à part pour Dieu. Cette formulation claire évite que «saints» soit compris comme une catégorie canonisée ultérieurement.
theological_decisions:
- issue: Sens de πλεονεξία dans une liste comprenant des péchés sexuels
  choice: avidité au sens large
  alternative: convoitise sexuelle
  rationale: Même si le contexte immédiat traite notamment de l’éthique sexuelle, le mot a une portée plus générale dans l’usage paulinien; le texte ne justifie pas de la restreindre ici.
- issue: Référent de ἁγίοις
  choice: tous les croyants en tant que personnes appartenant à Dieu
  alternative: les saints
  rationale: Le terme désigne la communauté consacrée à Dieu, et non une classe ultérieure de personnes canonisées.
- issue: Portée de «ne soient même mentionnées»
  choice: ces vices ne doivent pas avoir cours parmi les croyants, au point de caractériser leur communauté
  alternative: interdiction absolue de prononcer ou d’évoquer ces sujets
  rationale: Le contexte est une exhortation à la conduite communautaire; une interdiction absolue d’en parler contredirait l’acte même de les nommer pour les condamner.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forte interdiction grecque tout en privilégiant une syntaxe française naturelle. «Ceux qui appartiennent à Dieu» explicite fonctionnellement ἁγίοις; la note préserve la forme littérale et sa portée communautaire.
