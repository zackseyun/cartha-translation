  naturalness: La phrase révisée conserve une syntaxe française moderne et fluide. « Toute impureté » rend directement la portée de πᾶσα sans ajouter « forme », et la coordination « ou » respecte ἤ.
  terminology: « Immoralité sexuelle », « impureté », « avidité » et « saints » correspondent bien aux termes grecs et au registre paulinien. « Avidité » garde la portée générale de πλεονεξία, sans la réduire à la convoitise sexuelle.
