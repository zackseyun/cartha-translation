revisions:
- from: Mais qu’aucune immoralité sexuelle, aucune forme d’impureté ni aucune avidité ne soient même mentionnées parmi vous[a], comme il convient à ceux qui appartiennent à Dieu[b].
  to: Mais que l’immoralité sexuelle, toute impureté ou l’avidité ne soient même pas mentionnées parmi vous[a], comme il convient aux saints[b].
  rationale: La révision traduit directement ἁγίοις par « saints », tout en conservant l’explication culturelle nécessaire en note. Elle restitue également « toute impureté ou l’avidité », plus proche de ἀκαθαρσία πᾶσα ἢ πλεονεξία. La note sur « mentionnées » est ramenée à une véritable alternative de formulation, sans résoudre de façon excessive la portée rhétorique de l’expression grecque.
