  text: ὁ γὰρ καρπὸς τοῦ ⸀φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: fr
  text: car le fruit de la lumière[a] se manifeste dans toute bonté, justice[b] et vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le fruit de l’Esprit » au lieu de « le fruit de la lumière ».
    reason: textual_variant
  - marker: b
    text: Ou « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: car
  rationale: Introduit l’explication de l’exhortation précédente et conserve clairement le lien logique avec le verset 8.
- source_word: καρπὸς
  choice: fruit
  rationale: Conserve la métaphore paulinienne d’un résultat moral produit et ses résonances bibliques.
- source_word: τοῦ φωτός
  choice: de la lumière
  rationale: Rend directement le génitif avec l’article et renvoie à l’affirmation du verset 8 selon laquelle les croyants sont lumière dans le Seigneur.
- source_word: ἐν πάσῃ
  choice: se manifeste dans toute forme de
  rationale: Exprime naturellement en français la sphère ou la manière dont le fruit devient visible, sans donner à ἐν un sens strictement spatial ni réduire les qualités à une définition exhaustive.
- source_word: ἀγαθωσύνῃ
  choice: bonté
  rationale: Terme français direct qui couvre à la fois la qualité morale et la bienfaisance, sans limiter le sens à la gentillesse.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » conserve en français la portée morale et relationnelle du terme grec; « droiture » reste une autre traduction possible.
- source_word: ἀληθείᾳ
  choice: vérité
  rationale: Préserve la largeur sémantique du grec, qui peut évoquer aussi bien la conformité au vrai que la sincérité morale.
theological_decisions:
- issue: Variante textuelle dans le complément du nom « fruit »
  choice: le fruit de la lumière
  alternative: le fruit de l’Esprit
  rationale: Le texte du SBLGNT porte φωτός (« lumière »), lecture qui correspond directement au contexte immédiat du verset 8. La variante πνεύματος (« Esprit »), attestée dans une partie de la tradition manuscrite, est signalée en note sans être substituée au texte source retenu.
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: En français, « justice » rend directement le terme et peut inclure tant la conduite juste que l’exigence de justice. « Droiture » met davantage l’accent sur la rectitude morale et est donc conservé en note.
- issue: Valeur de ἐν devant la série de qualités
  choice: se manifeste dans
  alternative: consiste en
  rationale: La formulation choisie indique où le fruit devient reconnaissable tout en évitant de décider que ces trois qualités constituent une définition exhaustive de ce fruit.
translation_notes:
  register: Français international actuel, clair et digne. La métaphore du fruit est conservée; « se manifeste dans toute forme de » rend l’expression grecque de manière naturelle tout en préservant sa souplesse.
