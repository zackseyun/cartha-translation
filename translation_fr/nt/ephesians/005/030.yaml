- source_word: ἐσμὲν
  choice: nous sommes
  rationale: Rend directement le présent de l’indicatif du verbe « être ».
- source_word: τοῦ σώματος
  choice: du corps
  rationale: Traduction directe qui préserve l’image du corps employée dans le contexte.
- source_word: αὐτοῦ
  choice: son
  rationale: Le pronom renvoie au Christ dans le contexte immédiat ; « son » est la formulation française naturelle.
theological_decisions:
- issue: Faut-il intégrer la leçon longue « de sa chair et de ses os » ?
  choice: 'Traduire uniquement le texte du SBLGNT : « parce que nous sommes membres de son corps »'
