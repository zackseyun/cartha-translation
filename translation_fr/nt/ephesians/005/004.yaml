reference: Ephesians 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: fr
  text: Pas de propos obscènes, de paroles insensées ni de plaisanteries grossières[a] — tout cela ne convient pas[b] —, mais plutôt des actions de grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner ailleurs l’esprit ou les traits d’esprit ; ici, il a un sens négatif parce qu’il figure parmi des paroles qui ne conviennent pas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tout cela est déplacé » ou « tout cela est inconvenant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: propos obscènes
  rationale: Dans ce contexte dominé par les paroles et opposé à l’expression de la reconnaissance, le terme désigne naturellement des propos honteux ou indécents.
- source_word: μωρολογία
  choice: paroles insensées
  rationale: Cette expression rend clairement l’idée de discours sot ou dépourvu de sens, dans un registre actuel et digne.
- source_word: ἢ
  choice: ni
  rationale: Le grec coordonne le dernier élément de la liste; dans la formulation française négative « Pas de… », « ni » exprime naturellement cette coordination sans modifier la portée cumulative.
- source_word: εὐτραπελία
  choice: plaisanteries grossières
  rationale: Le mot peut ailleurs évoquer l’esprit ou la vivacité, mais son association ici avec des conduites inconvenantes impose un sens péjoratif; « grossières » laisse ouverte la nature précise de l’inconvenance.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: tout cela ne convient pas
  rationale: Le neutre pluriel reprend collectivement les éléments précédents. Cette formulation française conserve l’idée de ce qui est inconvenant ou inapproprié.
- source_word: ἀλλὰ μᾶλλον
  choice: mais plutôt
  rationale: La formule préserve à la fois l’opposition marquée par ἀλλά et la préférence exprimée par μᾶλλον.
- source_word: εὐχαριστία
  choice: des paroles de reconnaissance envers Dieu
  rationale: Le substantif peut désigner la reconnaissance ou l’action de grâce. Le contexte de parole appelle une expression verbale de gratitude; l’ajout « envers Dieu » explicite le destinataire normalement impliqué dans l’usage paulinien, tout en étant signalé par une note de traduction.
theological_decisions:
- issue: Portée de αἰσχρότης
  choice: Le rendre comme une forme de parole obscène.
  alternative: Le comprendre plus largement comme toute conduite honteuse ou indécente.
  rationale: Les deux termes voisins concernent explicitement la parole, et le contraste avec εὐχαριστία favorise ici une lecture liée au langage, sans nier que le mot puisse avoir ailleurs une portée plus générale.
- issue: Valeur morale de εὐτραπελία
  choice: Le rendre négativement par « plaisanteries grossières ».
  alternative: Le traduire de manière neutre par « esprit » ou « traits d’esprit ».
  rationale: Même si le mot peut être positif dans d’autres contextes grecs, son classement parmi les choses qui « ne conviennent pas » lui donne ici une valeur péjorative.
- issue: Destinataire implicite de εὐχαριστία
  choice: Expliciter « envers Dieu » dans le texte et le signaler en note.
  alternative: Conserver simplement « reconnaissance » ou « action de grâce », sans destinataire explicite.
  rationale: Dans l’usage paulinien et dans le contexte de l’épître, l’action de grâce est normalement adressée à Dieu. Toutefois, le grec de ce verset ne nomme pas explicitement ce destinataire, d’où la note.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Pas de… » restitue naturellement la liste nominale grecque dans la continuité de l’interdiction du verset précédent. « Paroles de reconnaissance » maintient le contraste avec les mauvais usages de la parole.
