  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: fr
  text: Quoi qu’il en soit, vous aussi, chacun en particulier[a], que chacun aime ainsi sa propre femme comme lui-même, et que la femme respecte[b] son mari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque insiste sur chaque personne prise individuellement : l’instruction s’adresse personnellement à chacun des maris.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « craindre ». Ici, cette crainte a le sens d’un respect empreint de révérence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Quoi qu’il en soit
  rationale: Marque une transition conclusive vers le résumé pratique, avec une légère nuance adversative, dans un français naturel.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: chacun de vous doit, lui aussi
  rationale: « Chacun de vous » restitue la forte valeur distributive de l’expression, tandis que « lui aussi » conserve l’inclusion emphatique exprimée par καί.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: sa propre femme
  rationale: Dans ce contexte conjugal, γυνή signifie « femme » au sens d’épouse, et ἑαυτοῦ souligne qu’il s’agit de la sienne.
- source_word: οὕτως ἀγαπάτω
  choice: doit aimer ainsi
  rationale: « Doit aimer » communique clairement la force de l’impératif; « ainsi » renvoie à la manière d’aimer exposée dans les versets précédents.
- source_word: ὡς ἑαυτόν
  choice: comme lui-même
  rationale: Conserve sobrement la comparaison réflexive formulée par le grec.
- source_word: ἡ δὲ γυνὴ
  choice: et la femme
  rationale: Le contexte impose le sens d’épouse; « et » introduit naturellement le second volet du résumé sans exagérer la valeur contrastive de δέ.
- source_word: ἵνα φοβῆται
  choice: doit respecter
  rationale: Dans cette exhortation relationnelle, φοβέομαι exprime une crainte révérencielle, c’est-à-dire le respect, plutôt que la peur ou l’effroi. Une note conserve le sens plus littéral.
- source_word: τὸν ἄνδρα
  choice: son mari
  rationale: Dans le contexte conjugal, ἀνήρ désigne le mari; le possessif est requis par l’usage naturel du français.
theological_decisions:
- issue: Sens de φοβῆται dans l’exhortation conjugale
  choice: respecter
  alternative: craindre; révérer
  rationale: Le verbe grec peut exprimer la peur, la révérence ou le respect. Ici, « respecter » transmet le sens relationnel sans introduire l’idée non nécessaire de terreur, tandis que la note signale la formulation littérale.
- issue: Formulation genrée et singulière de l’exhortation
  choice: sa propre femme… la femme… son mari
  alternative: son conjoint… l’autre conjoint
  rationale: Les formes grecques désignent explicitement le mari et la femme; la traduction maintient cette précision plutôt que de neutraliser le texte.
- issue: Force distributive de l’exhortation aux maris
  choice: chacun de vous
  alternative: vous devez tous
  rationale: Le grec insiste sur l’application personnelle de l’ordre à chaque mari pris individuellement; la formulation française préserve cette insistance.
translation_notes:
  register: Français international moderne, clair et digne. La tournure impérative est rendue sans archaïsme; « ainsi » maintient le renvoi au développement précédent. Les notes sont placées immédiatement après les expressions qu’elles expliquent.
