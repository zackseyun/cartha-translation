id: EPH.5.20
reference: Ephesians 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: fr
  text: rendant toujours grâce pour tout[a] à Dieu le Père, au nom de notre Seigneur Jésus le Messie[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se traduire plus littéralement par « pour toutes choses »; certains la comprennent comme « pour tous », bien que le contexte favorise ici le sens global de « pour tout ».
    reason: lexical_alternative
  - marker: b
    text: Ou, selon la formulation traditionnelle, « Jésus-Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: rendant grâce
  rationale: Le participe présent nominatif pluriel prolonge la série de participes liée à l’exhortation précédente. « Rendant grâce » conserve ce lien syntaxique et exprime une action continue dans un français biblique actuel et naturel.
- source_word: πάντοτε
  choice: toujours
  rationale: Équivalent direct, concis et idiomatique de l’adverbe grec.
- source_word: ὑπὲρ πάντων
  choice: pour tout
  rationale: Avec le génitif, ὑπέρ peut indiquer ce pour quoi on remercie. πάντων peut être neutre ou masculin; le contexte favorise ici le sens global « tout », sans exclure par la forme seule une référence à toutes les personnes.
- source_word: ἐν ὀνόματι
  choice: au nom de
  rationale: Cette expression française consacrée conserve l’idée d’agir en référence à la personne, à sa médiation ou à son autorité, sans explicitation excessive.
- source_word: κυρίου
  choice: Seigneur
  rationale: Rend κύριος comme titre christologique reconnu et naturel en français.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. En français, l’article est nécessaire pour rendre naturellement « Messie » comme titre après le nom Jésus.
- source_word: τῷ θεῷ καὶ πατρί
  choice: à Dieu le Père
  rationale: Le datif désigne le destinataire de l’action de grâce. « Dieu le Père » est la formulation française la plus naturelle et comprend les deux désignations grecques sous le même article.
theological_decisions:
- issue: Sens de Χριστοῦ dans « notre Seigneur Jésus Χριστός »
  choice: le Messie
  alternative: Christ
  rationale: Le terme grec signifie « Oint » et fonctionne encore comme titre dans cette formule. « Le Messie » en manifeste le sens, tandis que la forme traditionnelle « Christ » est signalée en note.
- issue: Référent de πάντων dans ὑπὲρ πάντων
  choice: pour tout
  alternative: pour tous
  rationale: La forme grecque permet grammaticalement le neutre (« toutes choses, tout ») ou le masculin (« tous »). Le contexte d’une reconnaissance constante et globale favorise « pour tout », mais l’autre possibilité mérite d’être conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le participe initial maintient le lien avec la phrase précédente; la virgule finale signale que le verset s’insère dans une construction plus large. « Rendre grâce » conserve l’idiome biblique tout en restant courant.
