id: EPH.5.29
reference: Ephesians 5:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: fr
  text: En effet, personne n’a jamais haï sa propre chair[a] ; au contraire, il la nourrit et en prend soin, tout comme le Messie[b] le fait aussi pour l’Église.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son propre corps ». Ici, « chair » désigne la personne dans sa réalité physique, et non une « nature pécheresse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le Christ ». Le mot grec Χριστός est un titre qui signifie « Messie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: En effet, personne n’a jamais
  rationale: « En effet » marque naturellement en français la justification introduite par γάρ, tandis que « personne n’a jamais » rend l’ensemble οὐδεὶς…ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: sa propre chair
  rationale: Le terme σάρξ désigne ici la réalité physique de la personne. « Chair » conserve le terme concret et le lien lexical de l’image, sans introduire le sens éthique de « nature pécheresse ».
- source_word: ἐμίσησεν
  choice: a haï
  rationale: « Haïr » est l’équivalent direct et usuel de μισέω ; le passé composé convient au français moderne dans cette affirmation d’expérience universelle.
- source_word: ἐκτρέφει
  choice: la nourrit
  rationale: Le verbe exprime ici le fait de nourrir et d’entretenir son propre corps ; « nourrit » conserve l’image concrète.
- source_word: θάλπει
  choice: en prend soin
  rationale: Dans ce contexte, θάλπω évoque des soins attentifs et affectueux plutôt que le seul fait de tenir au chaud. Cette formulation est claire et naturelle en français.
- source_word: καθὼς καὶ
  choice: tout comme… aussi
  rationale: « Tout comme » exprime la comparaison et « aussi » garde la valeur additive de καί.
- source_word: ὁ Χριστὸς
  choice: le Messie
  rationale: Avec l’article et dans cette comparaison, Χριστός fonctionne comme un titre. « Messie » en transmet le sens plutôt que de simplement le translittérer.
- source_word: τὴν ἐκκλησίαν
  choice: l’Église
  rationale: Dans ce contexte paulinien, ἐκκλησία désigne collectivement le peuple croyant lié au Messie ; « l’Église » est l’expression française conventionnelle et intelligible.
theological_decisions:
- issue: Sens de σάρξ
  choice: sa propre chair
  alternative: son propre corps
  rationale: Le contexte parle de la personne dans sa réalité corporelle, et non de la « chair » comme puissance du péché. Le terme français « chair » préserve néanmoins l’image et le vocabulaire grecs.
- issue: Rendu du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: « Messie » traduit le titre grec et en rend le sens explicite ; la forme traditionnelle « Christ » demeure signalée en note.
- issue: Ellipse verbale dans la comparaison finale
  choice: le fait aussi pour l’Église
  alternative: nourrit l’Église et en prend soin
  rationale: Le grec omet les verbes dans la dernière proposition et les laisse reprendre du contexte. La formulation choisie conserve cette ellipse de manière idiomatique en français, sans limiter l’action à un seul des deux verbes.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » assure un enchaînement naturel avec le verset précédent. « En prend soin » évite une traduction littérale obscure de θάλπω, tandis que « le fait aussi pour l’Église » restitue naturellement l’ellipse grecque.
