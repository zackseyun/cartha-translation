reference: Ephesians 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: fr
  text: Que personne ne vous trompe par des paroles creuses, car c’est à cause de cela que la colère de Dieu vient sur les fils de la désobéissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression désignant ceux qui se caractérisent par la désobéissance, c’est-à-dire ceux qui refusent d’obéir.
    reason: Clarification de l’expression idiomatique « fils de la désobéissance ».
lexical_decisions:
- source_word: Μηδεὶς ὑμᾶς ἀπατάτω
  choice: Que personne ne vous trompe
  rationale: La tournure prohibitive avec l’impératif présent est rendue naturellement en français par « Que personne ne… ». « Tromper » exprime clairement l’idée d’induire en erreur dans ce contexte moral.
- source_word: κενοῖς λόγοις
  choice: par des paroles creuses
  rationale: « Paroles creuses » conserve l’image de propos vides de contenu ou de valeur, tout en restant une expression française actuelle.
- source_word: διὰ ταῦτα
  choice: à cause de ces choses
  rationale: διά avec l’accusatif exprime ici la cause. Cette formulation conserve aussi la référence démonstrative aux comportements mentionnés dans le contexte précédent.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent grec est conservé sans préciser s’il a une valeur générale, actuelle ou imminente.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: la colère de Dieu
  rationale: Cette traduction directe préserve la force propre de ὀργή sans l’atténuer en un terme plus général comme « jugement ».
- source_word: ἐπὶ
  choice: sur
  rationale: Avec des personnes comme complément, ἐπί présente ici la colère comme venant sur elles. « Sur » est naturel et garde ce mouvement dirigé.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: les fils de la désobéissance
  rationale: La formulation conserve l’image sémitisante du grec, où « fils de » caractérise les personnes par ce qui gouverne leur conduite. Une note en explicite le sens idiomatique.
theological_decisions:
- issue: Langage relatif à la colère divine
  choice: la colère de Dieu
  alternative: le jugement de Dieu
  rationale: Le grec emploie explicitement ὀργή, « colère ». La traduction maintient cette affirmation théologique plutôt que de la généraliser ou de l’adoucir.
- issue: Sens de l’expression τοὺς υἱοὺς τῆς ἀπειθείας
  choice: les fils de la désobéissance
  alternative: ceux qui refusent d’obéir
  rationale: Le texte source emploie une expression imagée de caractérisation. La conserver dans le texte principal préserve sa forme et sa portée, tandis que la note en donne le sens sans limiter indûment le référent aux seuls hommes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste directe; « paroles creuses » est courante, tandis que « fils de la désobéissance » conserve volontairement l’image marquée du texte grec et reçoit une explication en note.
