id: EPH.5.5
reference: Ephesians 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: fr
  text: 'Car vous le savez et le comprenez : toute personne sexuellement immorale, impure ou avide — cette dernière est idolâtre[a] — n’a aucun héritage dans le royaume du Messie[b] et de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en comprenant la tournure plus abstraitement : « ce qui est une forme d’idolâtrie »; cela viserait surtout l’avidité. Le relatif grec est neutre, ce qui rend la construction ambiguë.'
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Christ ». Le mot est rendu ici par « Messie » parce que Χριστός fonctionne comme un titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: vous le savez et le comprenez
  rationale: La juxtaposition du verbe « savoir » et du participe « comprenant/reconnaissant » renforce l’affirmation. La formulation française conserve les deux composantes sans devenir artificielle.
- source_word: πόρνος
  choice: personne qui se livre à l’immoralité sexuelle
  rationale: Le terme désigne une personne caractérisée par l’inconduite sexuelle. Cette formulation est claire, actuelle et moins étroite ou archaïque que « fornicateur ».
- source_word: ἀκάθαρτος
  choice: personne qui se livre à l’impureté
  rationale: Dans cette liste éthique, le mot évoque l’impureté morale tout en gardant l’arrière-plan métaphorique de ce qui est impur.
- source_word: πλεονέκτης
  choice: personne qui se livre à l’avidité
  rationale: Le terme désigne quelqu’un que caractérise le désir avide d’avoir davantage. « Avidité » est naturel en français moderne et conserve la force morale du mot.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: une telle personne est idolâtre
  rationale: Le relatif grec neutre crée une difficulté après trois noms masculins. Le texte principal exprime naturellement que la personne avide est idolâtre, conformément au contexte et au parallèle de Colossiens 3.5, tout en signalant l’autre analyse en note.
- source_word: κληρονομίαν
  choice: héritage
  rationale: « Héritage » préserve les résonances bibliques, liées à l’alliance et à l’espérance finale, mieux que le terme plus plat « part ».
- source_word: βασιλείᾳ
  choice: royaume
  rationale: Ce terme français établi peut désigner à la fois le domaine royal et l’exercice de la royauté.
- source_word: Χριστοῦ
  choice: Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en rend clairement la valeur tout en restant naturel dans ce contexte.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: du Messie et de Dieu
  rationale: La coordination grecque est conservée sans imposer une conclusion christologique plus précise que ne l’exige la syntaxe de la phrase.
theological_decisions:
- issue: Référent de ὅ ἐστιν εἰδωλολάτρης
  choice: 'La proposition qualifie la personne mentionnée, tout particulièrement la personne avide : « une telle personne est idolâtre »'
  alternative: 'Comprendre plus abstraitement : « ce qui est de l’idolâtrie », en visant surtout l’avidité'
  rationale: Le relatif neutre entretient une réelle ambiguïté. Le contexte et Colossiens 3.5 rapprochent fortement l’avidité de l’idolâtrie. Le texte principal doit rester idiomatique en français, tandis que la note préserve l’autre possibilité.
- issue: Exclusion de l’héritage
  choice: n’a aucun héritage
  alternative: n’héritera pas du royaume
  rationale: Le grec emploie le présent οὐκ ἔχει. La traduction maintient cette déclaration présente de statut sans en atténuer l’avertissement.
- issue: Rapport entre « le Messie » et « Dieu »
  choice: le royaume du Messie et de Dieu
  alternative: Une reformulation qui expliciterait une conclusion christologique particulière à partir de la construction syntaxique
  rationale: La traduction suit directement les génitifs coordonnés et ne tranche pas au-delà de ce qu’énonce explicitement la formulation grecque.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « vous le savez et le comprenez » conserve l’insistance de la construction grecque. La reformulation de la liste au moyen de « qui se livre à » évite les substantifs français lourds ou archaïques tout en décrivant des personnes caractérisées par ces conduites.
