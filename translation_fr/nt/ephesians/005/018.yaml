source:
  edition: SBLGNT
  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: fr
  text: Ne vous enivrez pas de vin, car c’est là qu’est la débauche. Mais soyez remplis de l’Esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « soyez remplis dans l’Esprit » ou « par l’Esprit » ; certains comprennent plus généralement : « soyez remplis d’esprit ».'
    reason: Le grec ἐν πνεύματι peut exprimer le contenu, la sphère ou le moyen, et πνεύματι peut aussi être compris comme l’esprit humain.
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: vous enivrez
  rationale: Avec μή, cet impératif présent passif à valeur moyenne exprime une interdiction. « Ne vous enivrez pas » est naturel en français moderne et rend le fait de devenir ivre.
- source_word: οἴνῳ
  choice: de vin
  rationale: Le datif indique ici la substance qui provoque l’ivresse ; après « s’enivrer », le français idiomatique emploie « de ».
- source_word: ἐν ᾧ
  choice: cela
  rationale: Le relatif renvoie probablement à l’ivresse provoquée par le vin, ou plus largement à cette conduite. « Cela mène à » rend clairement le lien logique sans attribuer la débauche au vin pris en lui-même.
- source_word: ἀσωτία
  choice: débauche
  rationale: Le terme désigne une conduite moralement effrénée, dissolue et prodigue. « Débauche » en conserve la force éthique dans un français courant et digne.
- source_word: πληροῦσθε
  choice: Soyez remplis
  rationale: L’impératif présent passif appelle une disposition continue ou renouvelée. Le français laisse normalement cette valeur aspectuelle implicite.
- source_word: ἐν πνεύματι
  choice: de l’Esprit
  rationale: Après « remplis », « de l’Esprit » est la tournure française naturelle pour exprimer le contenu, tout en laissant ouverte la proximité sémantique avec le moyen ou la sphère.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit, compris comme l’Esprit Saint
  alternative: l’esprit, au sens de la disposition ou de la vie intérieure humaine
  rationale: Dans le contexte des exhortations pauliniennes, πνεύματι renvoie très probablement à l’Esprit Saint. Toutefois, l’absence d’article en grec permet une autre compréhension, conservée en note.
- issue: Rapport exprimé par ἐν πνεύματι
  choice: 'contenu : « remplis de l’Esprit »'
  alternative: 'sphère ou moyen : « remplis dans/par l’Esprit »'
  rationale: Le français idiomatique exige ici « de » après « remplis ». Cette formulation convient au contraste avec le vin, sans prétendre épuiser les nuances possibles de ἐν.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation explicite le contraste entre les deux impératifs. « Cela mène à » évite le calque peu naturel « dans lequel se trouve », tout en préservant le lien entre l’ivresse et la débauche.
