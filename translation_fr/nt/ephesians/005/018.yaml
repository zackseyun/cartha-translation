revisions:
- from: 'Ne vous enivrez pas de vin : cela mène à la débauche. Soyez plutôt remplis de l’Esprit[a].'
  to: Ne vous enivrez pas de vin, car c’est là qu’est la débauche. Mais soyez remplis de l’Esprit[a].
  rationale: La révision remplace une conséquence causale explicitée par une formulation qui rend plus directement ἐν ᾧ ἐστιν ἀσωτία, tout en restant idiomatique en français. Elle conserve les choix terminologiques centraux et affine la note afin de distinguer l’ambiguïté relationnelle de ἐν de l’ambiguïté possible du référent de πνεῦμα.
