  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: fr
  text: 'Prenez donc bien garde à la manière dont vous marchez[a] : non comme des gens sans sagesse, mais comme des sages,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la manière dont vous vivez ». Le grec emploie littéralement l’image de la marche pour désigner ici la conduite, la manière de vivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Veillez
  rationale: L’impératif présent appelle toute la communauté à une attention vigilante et continue. « Veillez » conserve cette force exhortative.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence de ce qui précède ; « donc » restitue naturellement ce lien logique.
- source_word: ἀκριβῶς πῶς
  choice: avec soin à la manière dont
  rationale: Cette formulation rend à la fois l’idée d’attention précise portée par ἀκριβῶς et la question de la manière introduite par πῶς, sans donner au français une tonalité technique.
- source_word: περιπατεῖτε
  choice: vous marchez
  rationale: Le sens littéral, « marcher », est conservé comme métaphore paulinienne de la conduite et de la manière de vivre ; une note en explicite la portée.
- source_word: μὴ ὡς ἄσοφοι
  choice: non pas comme des gens sans sagesse
  rationale: « Sans sagesse » rend directement la privation exprimée par ἄσοφοι sans renforcer indûment le terme en « insensés » ou « fous ». « Des gens » indique naturellement que toute la communauté est visée.
- source_word: ἀλλ’ ὡς σοφοί
  choice: mais comme des sages
  rationale: La formule conserve le parallélisme antithétique et la qualité positive de σοφοί de façon concise et idiomatique.
theological_decisions:
- issue: Portée des adjectifs masculins pluriels ἄσοφοι et σοφοί
  choice: Les rendre par « des gens sans sagesse » et « des sages », en les appliquant à l’ensemble de la communauté.
  alternative: « des hommes sans sagesse… des hommes sages »
  rationale: Le masculin pluriel grec est ici représentatif et ne limite pas l’exhortation aux hommes. La traduction française préserve le contraste sans introduire une restriction sexuelle absente du contexte.
- issue: Maintien de la métaphore de la marche
  choice: Conserver « vous marchez » dans le texte avec une note explicative.
  alternative: Traduire directement par « vous vivez » ou « vous vous conduisez ».
  rationale: La métaphore est intelligible en français biblique et porte une image théologique récurrente chez Paul ; la note empêche toutefois qu’elle soit comprise comme une simple marche physique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortative et le contraste du grec sont maintenus ; la métaphore paulinienne est conservée sans sacrifier la compréhension grâce à une note.
