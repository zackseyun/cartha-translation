  text: testing what is pleasing to the Lord;[a]
translation:
  language: fr
  text: discernant ce qui plaît au Seigneur ;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « examinant » ou « découvrant » ce qui plaît au Seigneur.'
    reason: Alternative lexicale pour δοκιμάζοντες, qui peut souligner l’examen, la mise à l’épreuve ou la découverte qui en résulte.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: discernant
  rationale: Le participe présent actif prolonge le mouvement d’exhortation du contexte et exprime une démarche continue d’examen visant à reconnaître ce qui est valable. « Discernant » est naturel en français moderne tout en gardant la portée évaluative du verbe.
- source_word: τί
  choice: ce qui
  rationale: Dans cette interrogation indirecte, « ce qui » rend naturellement le sens de « quoi / quelle chose » en français.
- source_word: ἐστιν
  choice: '[inclus dans « ce qui plaît »]'
  rationale: 'La copule grecque n’a pas besoin d’être rendue séparément : la construction française « ce qui plaît » en exprime naturellement la fonction.'
- source_word: εὐάρεστον
  choice: plaît
  rationale: « Plaît » exprime de façon claire, actuelle et relationnelle ce qui est agréable ou acceptable aux yeux du Seigneur.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Le datif dépend de εὐάρεστον et se rend naturellement par « au Seigneur ». Le titre reste non explicité, conformément au grec.
theological_decisions:
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: le Seigneur Jésus ; Dieu
  rationale: Le texte grec emploie κύριος sans préciser davantage son référent. Même si le contexte paulinien peut favoriser une lecture christologique, la traduction conserve le titre et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, simple et digne. Le participe présent conserve le lien syntaxique avec le contexte précédent. L’espace avant le point-virgule suit la typographie française.
