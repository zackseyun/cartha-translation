id: EPH.5.11
reference: Ephesians 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: fr
  text: Et ne prenez aucune part[a] aux œuvres stériles des ténèbres ; mais mettez-les plutôt encore en lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne vous y associez pas » ou « n’y participez pas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « reprenez-les » ou « dénoncez-les ». Le verbe grec peut désigner une réprimande ; dans ce contexte, il évoque aussi le fait de révéler ces œuvres pour ce qu’elles sont.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: prenez aucune part
  rationale: Avec la négation, « ne prenez aucune part » exprime naturellement en français l’idée de participer ou de s’associer activement à quelque chose.
- source_word: ἔργοις
  choice: œuvres
  rationale: « Œuvres » conserve le vocabulaire moral paulinien et reste clair dans ce contexte.
- source_word: ἀκάρποις
  choice: stériles
  rationale: « Stériles » préserve la métaphore du fruit tout en exprimant l’absence de bon résultat moral.
- source_word: σκότους
  choice: des ténèbres
  rationale: Le génitif est rendu directement, sans préciser indûment si ces œuvres appartiennent aux ténèbres ou sont accomplies dans les ténèbres.
- source_word: μᾶλλον δὲ καὶ
  choice: au contraire
  rationale: « Au contraire » marque nettement le renversement demandé. La force additive de καί est portée par le passage de la non-participation à l’action positive, sans alourdir la phrase française par « même ».
- source_word: ἐλέγχετε
  choice: démasquez-les
  rationale: « Démasquez » associe la mise au jour des œuvres à leur condamnation morale et s’accorde avec l’image de la lumière et des ténèbres dans le contexte.
theological_decisions:
- issue: Sens de ἐλέγχετε à propos des œuvres mauvaises
  choice: démasquez-les
  alternative: reprenez-les ; dénoncez-les ; mettez-les en lumière
  rationale: Le contexte de la lumière favorise l’idée de révéler ce que sont réellement ces œuvres, tandis que le verbe peut aussi comporter une dimension de réprobation. « Démasquez » maintient ces deux aspects sans limiter le commandement à une réprimande verbale.
- issue: Force du contraste entre les deux impératifs
  choice: ne prenez aucune part… au contraire, démasquez-les
  alternative: ne vous y associez pas… mais reprenez-les plutôt
  rationale: 'La formulation conserve le double commandement : refuser de participer aux œuvres des ténèbres et agir à leur encontre, sans imposer une méthode précise que le grec ne spécifie pas.'
translation_notes:
  register: Français international moderne, sobre et digne. « Prendre part » est idiomatique et accessible ; « œuvres stériles » garde la métaphore ; « démasquer » maintient à la fois l’image lumière-ténèbres et la portée morale du commandement.
