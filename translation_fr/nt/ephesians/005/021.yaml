  yaml_path: translation/nt/ephesians/005/021.yaml
  text: submitting to one another in the fear of Messiah[a][b].
translation:
  language: fr
  text: vous soumettant les uns aux autres dans la crainte[a] du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le respect du Messie » ou « dans une profonde révérence envers le Messie ».
    reason: lexical_alternative
  - marker: b
    text: Grec « Christ » ; « le Messie » est employé ici parce que Χριστός fonctionne comme un titre.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: vous soumettant
  rationale: Le participe présent moyen/passif prolonge la série de participes liée au contexte précédent. « Vous soumettant » conserve cette forme et sa valeur continue sans en faire prématurément un impératif indépendant.
- source_word: ἀλλήλοις
  choice: les uns aux autres
  rationale: Cette expression française courante rend clairement le pronom réciproque au datif pluriel.
- source_word: ἐν
  choice: dans
  rationale: Avec « crainte », « dans » conserve naturellement l’idée de sphère ou de disposition exprimée par la préposition grecque.
- source_word: φόβῳ
  choice: crainte
  rationale: « Crainte » garde la force fondamentale de φόβος et la tension d’une crainte révérencielle, sans l’affaiblir d’emblée en simple respect.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici une valeur de titre. « Le Messie » traduit ce titre plutôt que de le translittérer, tandis que la formulation traditionnelle « Christ » est signalée en note.
theological_decisions:
- issue: Sens de « crainte du Messie »
  choice: crainte révérencielle dirigée vers le Messie
  alternative: crainte suscitée par le Messie ; profond respect pour le Christ
  rationale: Le génitif se lit le plus directement comme désignant celui envers qui s’exerce la crainte. Le maintien de « crainte » préserve toutefois la force et la tension théologiques du grec sans réduire l’expression à la politesse.
- issue: Rendu de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Dans cette expression, le sens titulaire reste suffisamment perceptible pour justifier « Messie ». La traduction traditionnelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure participiale est volontairement conservée afin de maintenir le lien syntaxique avec le contexte précédent ; le verset isolé forme donc une proposition dépendante, comme en grec.
