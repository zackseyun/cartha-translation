review_pass:
  verdict: revise
  source_fidelity: La formulation rend fidèlement λοιπὸν (« Désormais »), ἀπόκειται (« m’est réservée »), l’image de la couronne, le rôle du Seigneur comme juste juge et l’extension à tous les croyants concernés. En revanche, « auront aimé » transforme sans nécessité le parfait grec ἠγαπηκόσι en un futur antérieur dépendant du jour final. Le parfait exprime plutôt un amour déjà établi, avec effet présent, sans situer grammaticalement cet amour comme nécessairement achevé avant ce jour.
  naturalness: Le français est globalement clair, moderne et digne. « Manifestation » est recevable pour ἐπιφάνεια dans ce registre et conserve la portée publique de l’apparition. « Ont aimé » est plus direct et plus fidèle que « auront aimé » dans cette construction.
  terminology: « La couronne de justice » conserve utilement l’ambiguïté du génitif τῆς δικαιοσύνης, sans imposer le sens de récompense pour une conduite juste, de justice/vindication, ou de droiture. « Le Seigneur, le juste juge » et « sa manifestation » respectent les titres et le référent sans sur-explicitation doctrinale.
  issues:
