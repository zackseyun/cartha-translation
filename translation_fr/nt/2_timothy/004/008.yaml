    issue: « auront aimé » traduit ἠγαπηκόσι
    rationale: Le participe parfait grec est le complément de πᾶσιν et ne porte pas la valeur d’un futur antérieur. « Ont aimé » rend l’aspect accompli avec sa portée présente sans introduire une chronologie supplémentaire.
