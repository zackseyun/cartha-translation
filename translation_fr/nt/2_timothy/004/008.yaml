id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: fr
  text: Désormais, la couronne de justice[a] m’est réservée. Le Seigneur, le juste juge, me la remettra ce jour-là, et non seulement à moi, mais aussi à tous ceux qui ont aimé sa manifestation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la couronne de droiture ». Le mot grec peut, selon le contexte, désigner la justice ou la droiture.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: Désormais
  rationale: Dans ce contexte, le terme désigne ce qui attend désormais Paul après qu’il a achevé la course, plutôt qu’une simple conclusion thématique.
- source_word: ἀπόκειταί
  choice: m’est réservée
  rationale: Le verbe exprime l’état présent de quelque chose qui a été mis de côté et gardé en réserve; cette formulation est naturelle en français.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: la couronne de justice
  rationale: Cette formulation conserve le génitif grec sans décider si la couronne récompense la justice, consiste en elle ou représente la justification finale.
- source_word: δικαιοσύνης
  choice: justice
  rationale: En français moderne, « justice » rend naturellement δικαιοσύνη dans cette construction tout en préservant sa portée morale et judiciaire; une note signale l’autre traduction possible.
- source_word: ἀποδώσει
  choice: remettra
  rationale: Le verbe implique ici que le juge donnera ce qui revient à Paul. « Remettra » convient à l’image de la couronne sans introduire une idée punitive.
- source_word: κύριος
  choice: Seigneur
  rationale: Le titre grec est rendu directement et laisse le contexte identifier son référent.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: en ce jour-là
  rationale: Cette expression française naturelle conserve la portée eschatologique de la formule grecque.
- source_word: ὁ δίκαιος κριτής
  choice: le juste juge
  rationale: L’apposition caractérise le Seigneur comme juge équitable; l’allitération sobre est idiomatique et fidèle.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: à tous ceux qui auront aimé
  rationale: Le futur antérieur, dépendant du futur « remettra », exprime un amour établi et maintenu jusqu’au jour évoqué, conformément à la valeur du participe parfait.
- source_word: ἐπιφάνειαν
  choice: manifestation
  rationale: « Manifestation » conserve la nuance d’une apparition publique et glorieuse sans réduire le terme au sens plus général de « venue ».
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif renvoie naturellement au Seigneur et suit la formulation concise du grec.
theological_decisions:
- issue: Sens de « la couronne de justice »
  choice: Maintien du complément « de justice » sans préciser le rapport exact entre la couronne et la justice.
  alternative: La couronne accordée en récompense de la justice; la couronne qui consiste en la justice; la couronne de justification ou de réhabilitation.
  rationale: Le génitif grec permet plusieurs nuances. La traduction conserve cette tension plutôt que de choisir une interprétation théologique particulière.
- issue: Référent du titre « le Seigneur »
  choice: Conservation du seul titre « le Seigneur » dans le texte.
  alternative: Expliciter « le Seigneur Jésus » ou comprendre le titre comme désignant Dieu plus généralement.
  rationale: La mention de « sa manifestation » dans les Pastorales oriente fortement vers Jésus-Christ, mais le grec n’ajoute pas ici son nom; la traduction évite donc de l’expliciter.
- issue: Valeur de l’amour pour la manifestation
  choice: « ceux qui auront aimé sa manifestation »
  alternative: « ceux qui aiment sa manifestation » ou « ceux qui ont aimé sa manifestation »
  rationale: Cette formulation préserve l’idée d’une disposition durable tout en l’inscrivant dans la perspective du jour futur, sans en faire une condition méritoire explicitement formulée.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue période grecque sans modifier ses rapports logiques. « Couronne » conserve l’image de la récompense du vainqueur; « manifestation » garde le registre eschatologique.
