id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: fr
  text: Car Démas m’a abandonné, ayant aimé l’époque présente[a], et il est parti pour Thessalonique ; Crescens, pour la Galatie, et Tite, pour la Dalmatie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde présent ». Le grec désigne plus littéralement l’époque ou l’ère présente.
    reason: Signaler une traduction française courante tout en précisant la valeur temporelle de αἰών.
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: Conserve le lien explicatif avec la demande formulée dans le contexte précédent, dans un français biblique actuel et naturel.
- source_word: ἐγκατέλιπεν
  choice: m’a abandonné
  rationale: Le verbe exprime le fait de laisser quelqu’un derrière soi avec une nette portée négative. « Abandonné » rend cette gravité sans affirmer explicitement une apostasie.
- source_word: ἀγαπήσας
  choice: ayant aimé
  rationale: Le participe passé conserve le lien étroit, sans le réduire explicitement à une relation uniquement causale, entre l’attachement de Démas à l’époque présente et son abandon de Paul.
- source_word: τὸν νῦν αἰῶνα
  choice: l’époque présente
  rationale: Cette formulation garde la valeur temporelle de αἰών et évite de faire penser en premier lieu au monde physique. Elle reste compréhensible en français moderne tout en conservant la portée éthique du contexte.
- source_word: ἐπορεύθη
  choice: il est parti
  rationale: Rend simplement le déplacement vers une destination, tout en exprimant naturellement en français le départ de Démas.
- source_word: Θεσσαλονίκην
  choice: Thessalonique
  rationale: Forme française usuelle du nom de lieu.
- source_word: Κρήσκης
  choice: Crescens
  rationale: Forme traditionnelle et intelligible du nom propre en français.
- source_word: Γαλατίαν
  choice: la Galatie
  rationale: Forme française usuelle du nom de la région, avec l’article normalement employé après « pour ».
- source_word: Τίτος
  choice: Tite
  rationale: Forme française traditionnelle du nom propre.
- source_word: Δαλματίαν
  choice: la Dalmatie
  rationale: Forme française usuelle du nom de la région, avec l’article normalement employé après « pour ».
theological_decisions:
- issue: Déterminer si le départ de Démas doit être formulé comme une apostasie ou comme l’abandon personnel de Paul
  choice: Dire que Démas a « abandonné » Paul, sans déclarer qu’il a définitivement abandonné la foi.
  alternative: Employer une formulation plus forte qui présenterait explicitement Démas comme apostat.
  rationale: Le texte porte un jugement moral négatif sur son choix et l’associe à son amour de l’époque présente, mais il ne formule pas explicitement une conclusion sur son état spirituel final.
- issue: Nature du lien entre ἀγαπήσας et l’abandon de Paul
  choice: 'Conserver une tournure participiale : « ayant aimé ».'
  alternative: Expliciter la cause par « parce qu’il aimait » ou « par amour pour ».
  rationale: Une valeur causale est probable, mais la tournure participiale préserve mieux la forme et la légère ouverture relationnelle du grec.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « ayant aimé » est légèrement soutenue, mais elle préserve utilement la construction grecque. Les derniers membres gardent l’ellipse du verbe, claire en français grâce à la ponctuation.
