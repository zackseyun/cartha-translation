id: 2TI.4.16
reference: 2 Timothy 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: fr
  text: Lors de ma première défense[a], personne n’est venu me soutenir[b] ; tous m’ont abandonné. Que cela ne soit pas retenu contre eux[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lors de ma première comparution » ou « Lors de ma première plaidoirie » ; le terme grec désigne ici une défense formelle dans un cadre judiciaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « personne ne s’est présenté auprès de moi » ; dans ce contexte, il s’agit de comparaître pour soutenir Paul.'
    reason: lexical_alternative
  - marker: c
    text: Ou « Que cela ne leur soit pas imputé ! »
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: défense
  rationale: Dans ce contexte judiciaire, le nom désigne la défense ou la réponse formelle de Paul devant les autorités. « Défense » est naturel en français moderne et conserve la portée juridique.
- source_word: πρώτῃ
  choice: première
  rationale: L’adjectif indique la première occasion ou étape de la défense de Paul, sans préciser davantage la procédure.
- source_word: παρεγένετο
  choice: est venu me soutenir
  rationale: Le verbe signifie littéralement venir se rendre présent. Avec le datif μοι et dans ce contexte, il évoque la comparution aux côtés de Paul pour lui apporter un soutien ; la formulation française rend à la fois la présence et la solidarité.
- source_word: οὐδείς
  choice: personne
  rationale: Équivalent français direct et naturel de l’indéfini négatif.
- source_word: ἐγκατέλιπον
  choice: m’ont abandonné
  rationale: Le verbe exprime le fait de laisser quelqu’un seul dans une situation difficile. « Abandonné » convient au contexte de danger judiciaire sans être archaïque.
- source_word: λογισθείη
  choice: soit retenu contre
  rationale: 'L’optatif passif exprime ici un souhait : Paul demande que leur acte ne leur soit pas imputé. « Retenir contre quelqu’un » conserve la nuance comptable ou judiciaire dans un français courant.'
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Que cela ne soit pas retenu contre eux !
  rationale: La tournure avec « que » rend naturellement en français le souhait exprimé par l’optatif grec, tandis que « cela » explicite sobrement l’objet implicite, à savoir leur abandon.
theological_decisions:
- issue: Tonalité de la dernière proposition envers ceux qui ont abandonné Paul
  choice: 'Un souhait proche d’une prière : « Que cela ne soit pas retenu contre eux ! »'
  alternative: 'Une formulation plus permissive : « Que cela ne leur soit pas imputé. »'
  rationale: L’optatif aoriste passif λογισθείη précédé de μή exprime naturellement un souhait. La traduction garde l’écho du langage du pardon et de la non-imputation sans préciser qui ne devrait pas retenir cet acte contre eux ni développer une doctrine absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le cadre judiciaire et le contraste marqué entre l’absence de soutien et le souhait de non-imputation. Les notes suivent l’ordre des marqueurs dans le texte.
