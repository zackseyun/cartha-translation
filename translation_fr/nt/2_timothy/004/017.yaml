reference: 2 Timothy 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: fr
  text: Mais le Seigneur s’est tenu à mes côtés et m’a fortifié, afin que, par mon intermédiaire, la proclamation soit pleinement accomplie et que toutes les nations[a] l’entendent. Et j’ai été délivré de la gueule du lion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les peuples non juifs ». Le grec ἔθνη peut désigner les « nations » ou les « peuples non juifs » ; dans ce contexte missionnaire, les peuples non juifs sont probablement visés.
    reason: lexical_alternative
  - marker: b
    text: L’expression « de la gueule du lion » peut évoquer figurément une délivrance d’un danger mortel plutôt qu’un lion au sens littéral.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Mais le Seigneur
  rationale: « Seigneur » conserve le titre κύριος sans en préciser le référent; « mais » marque le contraste avec l’abandon évoqué au verset précédent.
- source_word: μοι παρέστη
  choice: s’est tenu à mes côtés
  rationale: Cette expression naturelle rend la présence personnelle et secourable indiquée par παρίστημι.
- source_word: ἐνεδυνάμωσέν με
  choice: m’a fortifié
  rationale: Le verbe ἐνδυναμόω signifie donner de la force ou rendre fort; « fortifié » garde ici sa portée sans ajouter une interprétation.
- source_word: ἵνα δι’ ἐμοῦ
  choice: afin que, par mon intermédiaire
  rationale: « Afin que » exprime la visée introduite par ἵνα, et « par mon intermédiaire » rend clairement l’agence exprimée par διά avec le génitif.
- source_word: τὸ κήρυγμα
  choice: la proclamation
  rationale: κήρυγμα peut désigner ce qui est proclamé ainsi que la proclamation elle-même; le français retenu préserve cette ampleur.
- source_word: πληροφορηθῇ
  choice: soit pleinement menée à bien
  rationale: Le passif exprime ici l’idée d’un accomplissement complet. Cette formulation française reste large et n’impose pas le sens plus étroit de « proclamée partout ».
- source_word: ἀκούσωσιν
  choice: l’entendent
  rationale: Le pronom reprend naturellement « la proclamation » en français; le subjonctif après « afin que » rend la construction de but.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette traduction conserve le sens collectif et l’ambiguïté de ἔθνη entre les nations et les peuples non juifs; l’autre possibilité est signalée en note.
- source_word: ἐρρύσθην
  choice: j’ai été délivré
  rationale: ῥύομαι désigne le fait d’être arraché à un danger. « Délivré » convient au registre biblique moderne sans préciser la nature du péril.
- source_word: ἐκ στόματος λέοντος
  choice: de la gueule du lion
  rationale: La traduction conserve l’image concrète du grec et laisse ouverte la question de son caractère littéral, figuré ou allusif.
theological_decisions:
- issue: Référent de « Seigneur » (κύριος)
  choice: Le texte dit simplement « le Seigneur ».
  alternative: Identifier explicitement Jésus, ou Dieu de manière plus générale.
  rationale: Le contexte peut orienter vers le Seigneur Jésus, mais le grec ne précise pas davantage ici; la traduction ne tranche donc pas.
- issue: Sens de « la gueule du lion »
  choice: L’image est conservée telle quelle.
  alternative: Y voir explicitement Néron, Satan, une condamnation aux bêtes ou, plus généralement, un danger mortel.
  rationale: Plusieurs interprétations sont possibles, et le verset lui-même ne permet pas de choisir entre elles.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement rhétorique du grec tout en employant « par mon intermédiaire » et « menée à bien » pour une formulation française naturelle. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent.
