source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: fr
  text: Le Seigneur me délivrera de toute mauvaise action[a] et me fera entrer sain et sauf dans son royaume céleste. À lui soit la gloire pour toujours et à jamais[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute œuvre mauvaise ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les siècles des siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: me délivrera
  rationale: Le verbe ῥύομαι exprime l’action d’arracher à un danger ou d’en délivrer. « Délivrera » est naturel en français biblique moderne et ne promet pas nécessairement que Paul échappera à la mort.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: de toute œuvre mauvaise
  rationale: Cette formulation conserve le singulier distributif de παντός et l’étendue sémantique de ἔργον, sans préciser indûment s’il s’agit d’un acte commis par Paul ou d’une action mauvaise dirigée contre lui.
- source_word: σώσει εἰς
  choice: me fera entrer sain et sauf dans
  rationale: La tournure rend naturellement en français l’idée de salut et de préservation orientée vers l’entrée dans le royaume. Elle évite l’expression peu idiomatique « me sauvera dans » tout en maintenant le mouvement exprimé par εἰς.
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: son royaume céleste
  rationale: « Royaume céleste » rend directement l’expression attributive grecque et conserve sa portée eschatologique.
- source_word: ᾧ ἡ δόξα
  choice: À lui soit la gloire
  rationale: Cette formule française naturelle restitue l’attribution doxologique exprimée par la proposition nominale grecque.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette expression française actuelle communique la durée sans fin de l’idiome grec sans reproduire servilement sa formulation.
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération liturgique traditionnelle est claire et courante en français.
theological_decisions:
- issue: Rapport entre la délivrance présente et le salut final
  choice: La traduction distingue la délivrance de toute œuvre mauvaise de l’entrée sûre dans le royaume céleste, sans affirmer que Paul échappera à la mort physique.
  alternative: Comprendre la délivrance comme la promesse que Paul sera soustrait à l’exécution, ou rendre explicitement les deux verbes comme un salut uniquement spirituel.
  rationale: La proximité de ῥύσεταί et σώσει, ainsi que le but indiqué par « dans son royaume céleste », permet de comprendre la confiance de Paul comme une préservation ultime, mais le texte ne définit pas précisément la forme temporelle de la première délivrance. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Œuvre mauvaise » conserve volontairement une légère ambiguïté du grec. « Me fera entrer sain et sauf » privilégie une expression française idiomatique tout en gardant le mouvement vers le royaume et l’idée de préservation portée par σώσει εἰς.
