id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: fr
  text: Fais tout ton possible pour venir avant l’hiver. Eubule te salue, ainsi que Pudens, Linus, Claudia et tous les frères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les frères et sœurs » ; le grec dit littéralement « frères », mais le terme peut désigner ici l’ensemble des croyants.
    reason: Alternative lexicale reflétant la possible portée inclusive de ἀδελφοί.
lexical_decisions:
- source_word: Σπούδασον
  choice: Fais tout ton possible
  rationale: L’impératif aoriste de σπουδάζω exprime un empressement résolu et une diligence réelle. Cette tournure naturelle en français communique à la fois l’effort demandé et l’urgence du déplacement.
- source_word: πρὸ χειμῶνος
  choice: avant l’hiver
  rationale: πρό suivi du génitif marque ici l’antériorité temporelle. « Avant l’hiver » est la formulation idiomatique en français.
- source_word: ἐλθεῖν
  choice: pour venir
  rationale: L’infinitif complète Σπούδασον et désigne la venue de Timothée auprès de Paul. « Venir » préserve directement le point de vue du locuteur.
- source_word: Ἀσπάζεταί σε
  choice: te salue
  rationale: Dans une salutation épistolaire, ἀσπάζομαι signifie transmettre ses salutations. « Te salue » est naturel, concis et personnel en français.
- source_word: Εὔβουλος
  choice: Eubule
  rationale: Forme française traditionnelle et transparente du nom grec Εὔβουλος.
- source_word: Πούδης
  choice: Pudens
  rationale: Forme latine traditionnelle du nom propre, couramment conservée dans les traductions françaises.
- source_word: Λίνος
  choice: Linus
  rationale: Translittération usuelle du nom propre grec dans la tradition française.
- source_word: Κλαυδία
  choice: Claudia
  rationale: Forme française et latine usuelle de ce nom propre.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: tous les frères
  rationale: Le grec emploie le masculin pluriel ἀδελφοί. La traduction principale conserve cette forme, tout en signalant en note que le terme peut désigner l’ensemble des croyants, femmes comprises.
theological_decisions:
- issue: Portée de ἀδελφοί dans un groupe chrétien probablement mixte
  choice: tous les frères
  alternative: tous les frères et sœurs ; tous les croyants
  rationale: Le texte source porte le masculin pluriel ἀδελφοί, mais son emploi communautaire peut inclure des femmes. Le texte principal garde la forme explicite du grec sans exclure silencieusement la portée inclusive possible, laquelle est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif est direct sans être raide ; la formule de salutation reste concise. Les noms suivent les formes françaises ou traditionnelles les plus usuelles.
