  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: fr
  text: Éraste est resté à Corinthe, mais j’ai laissé Trophime malade à Milet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Éraste
  rationale: Forme française traditionnelle et courante du nom propre grec.
- source_word: ἔμεινεν
  choice: est resté
  rationale: L’aoriste de μένω indique ici qu’Éraste est demeuré à Corinthe; « est resté » est naturel en français moderne.
- source_word: ἐν Κορίνθῳ
  choice: à Corinthe
  rationale: Avec un nom de ville, le français emploie naturellement la préposition « à ».
- source_word: Τρόφιμον
  choice: Trophime
  rationale: Forme française traditionnelle et courante du nom propre grec.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici un léger contraste entre les deux nouvelles de voyage.
- source_word: ἀπέλιπον
  choice: j’ai laissé
  rationale: Le verbe à la première personne signifie simplement « laisser »; « laisser derrière moi » serait possible, mais plus explicite que le grec.
- source_word: ἐν Μιλήτῳ
  choice: à Milet
  rationale: Formulation française idiomatique avec un nom de ville.
- source_word: ἀσθενοῦντα
  choice: malade
  rationale: Le participe présent qualifie l’état de Trophime au moment où Paul l’a laissé; « malade » rend clairement le sens contextuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe concise du compte rendu de voyage est conservée sans ajouter d’explication absente du grec.
