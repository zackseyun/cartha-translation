review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux sens grecs sont bien rendus : l’annonce d’un temps à venir, le refus de l’enseignement salutaire, les désirs propres, l’accumulation de maîtres et l’image finale sont conservés. Toutefois, « autour d’eux » spatialise indûment le datif réflexif ἑαυτοῖς (« pour eux-mêmes »), et l’idiome français appelle le pluriel « les oreilles » plutôt que « l’oreille ».'
  naturalness: « L’enseignement sain » est compréhensible mais moins idiomatique en français moderne que « un enseignement sain » dans cette formulation. « Ils amasseront pour eux-mêmes des enseignants » reste très littéral ; « ils s’entoureront de maîtres » est naturel, mais atténue l’idée d’accumulation. « Ils se procureront quantité d’enseignants » garde le sens réflexif et quantitatif dans une langue claire.
  terminology: « Enseignement sain » maintient la métaphore de santé sans imposer le terme plus technique « doctrine ». « Maîtres » est ici un terme français naturel pour διδάσκαλοι dans ce contexte, sans en faire un titre ecclésiastique. La formule « les oreilles qui leur démangent » préserve l’image idiomatique de κνηθόμενοι τὴν ἀκοήν sans expliciter sa relation logique comme causale.
  issues:
  - severity: medium
    issue: « autour d’eux » pour ἑαυτοῖς
    rationale: Le grec exprime l’intérêt réflexif (« pour eux-mêmes »), non la disposition spatiale des enseignants autour des personnes. Cette formulation peut induire une image qui n’est pas dans le texte.
  - severity: medium
    issue: « l’oreille qui démange »
    rationale: Le singulier est une imitation trop littérale de ἀκοή et sonne peu naturel dans l’idiome français. « Les oreilles qui leur démangent » conserve l’image et est immédiatement intelligible.
  - severity: low
    issue: « l’enseignement sain »
    rationale: La formulation est possible, mais « un enseignement sain » est plus fluide dans une annonce générale portant sur le type d’enseignement qu’ils refuseront.
  revised_text: Car un temps viendra où ils ne supporteront pas un enseignement sain[a]. Au contraire, selon leurs propres désirs, ils se procureront quantité de maîtres, avec les oreilles qui leur démangent[b].
