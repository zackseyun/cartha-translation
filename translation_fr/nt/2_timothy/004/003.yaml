revisions:
- from: Car un temps viendra où ils ne supporteront pas l’enseignement sain[a]. Au contraire, selon leurs propres désirs, ils amasseront autour d’eux des enseignants, tout en ayant l’oreille qui démange[b].
  to: Car un temps viendra où ils ne supporteront pas un enseignement sain[a]. Au contraire, selon leurs propres désirs, ils se procureront quantité de maîtres, avec les oreilles qui leur démangent[b].
  rationale: La révision restitue plus exactement la valeur réflexive de ἑαυτοῖς sans la transformer en rapport spatial, emploie un idiome français naturel pour l’image de l’ouïe qui démange et conserve la souplesse circonstancielle du participe grec. Les ancres de notes demeurent placées sur les expressions concernées.
