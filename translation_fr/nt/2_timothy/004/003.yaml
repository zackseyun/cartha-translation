  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: fr
  text: Car un temps viendra où ils ne supporteront pas un enseignement sain[a]. Au contraire, selon leurs propres désirs, ils se procureront quantité de maîtres, avec les oreilles qui leur démangent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la saine doctrine ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ayant l’ouïe qui démange » ; l’image évoque le désir insistant d’entendre ce que l’on souhaite entendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: un temps
  rationale: Dans cette annonce, καιρός désigne une période à venir. « Un temps viendra » est naturel en français et n’impose pas à tort l’idée d’une date déterminée.
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: l’enseignement sain
  rationale: « Sain » conserve la métaphore de la santé portée par ὑγιαίνω, tandis qu’« enseignement » rend διδασκαλία dans une langue courante, sans technicité confessionnelle.
- source_word: οὐκ ἀνέξονται
  choice: ils ne supporteront pas
  rationale: Le verbe exprime le refus d’endurer ou de tolérer. « Ne supporteront pas » est actuel, clair et suffisamment fort.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: selon leurs propres désirs
  rationale: Cette formulation garde la norme exprimée par κατά et la force réflexive de ἰδίας, sans réduire ἐπιθυμίαι aux seuls désirs sexuels.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: ils amasseront autour d’eux des enseignants
  rationale: « Amasseront » préserve l’image d’une accumulation excessive; « autour d’eux » rend naturellement en français l’orientation réflexive de ἑαυτοῖς.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: tout en ayant l’oreille qui démange
  rationale: Cette expression maintient l’image concrète de la démangeaison et la valeur participiale concomitante, sans imposer explicitement une relation causale.
theological_decisions:
- issue: Portée de διδασκαλία dans le contexte des épîtres pastorales
  choice: enseignement
  alternative: doctrine
  rationale: Le terme vise un contenu transmis et faisant autorité, mais le grec n’exige pas ici un vocabulaire technique. « Enseignement » reste exact, accessible et sans coloration confessionnelle particulière.
- issue: Relation logique de κνηθόμενοι avec le verbe principal
  choice: tout en ayant l’oreille qui démange
  alternative: parce que l’oreille leur démange
  rationale: Le participe peut évoquer la circonstance ou le motif. La traduction retenue conserve cette souplesse au lieu de rendre la causalité explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La structure est divisée en deux phrases pour alléger la longue période grecque. « Tout en ayant » conserve le lien participial sans expliciter une causalité qui demeure implicite dans le texte source.
