id: 2TI.4.4
reference: 2 Timothy 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: fr
  text: Ils détourneront l’oreille[a] de la vérité et se tourneront vers des mythes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur écoute » ou « leur ouïe ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des fables ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: la vérité
  rationale: L’article défini grec est conservé. Le contexte évoque l’enseignement apostolique reconnu, mais la formulation ne réduit pas « la vérité » à une expression interprétative telle que « la saine doctrine » ou « l’Évangile ».
- source_word: ἀκοὴν
  choice: l’oreille
  rationale: Le grec désigne littéralement l’écoute ou l’ouïe. L’expression française « détourner l’oreille » restitue naturellement l’image d’un refus délibéré d’écouter.
- source_word: ἀποστρέψουσιν
  choice: détourneront
  rationale: Ce verbe garde le mouvement volontaire d’éloignement exprimé par le grec, sans l’expliciter par « rejetteront ».
- source_word: μύθους
  choice: mythes
  rationale: « Mythes » est l’équivalent moderne direct; il désigne ici des récits opposés à la vérité, sans préciser davantage leur nature.
- source_word: ἐκτραπήσονται
  choice: se tourneront
  rationale: Cette forme médio-passive peut avoir un sens intransitif. « Se tourneront » est idiomatique et préserve le contraste directionnel avec le premier membre.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: de ... et ... vers
  rationale: Les prépositions « de » et « vers » rendent l’opposition entre l’éloignement de la vérité et l’orientation vers les mythes; la coordination française évite une formulation artificielle.
theological_decisions:
- issue: Nature de « la vérité » dans le contexte
  choice: la vérité
  alternative: la saine doctrine; la vérité de l’Évangile
  rationale: Le contexte relie fortement cette vérité à l’enseignement apostolique, mais le verset emploie le terme plus large ἀλήθεια. La traduction en préserve donc l’étendue et la tension théologique.
- issue: Agent du fait de se tourner vers les mythes
  choice: se tourneront
  alternative: seront détournés vers
  rationale: La forme grecque peut être comprise comme moyenne ou passive. Le pronominal français rend naturellement le mouvement sans introduire un agent extérieur absent du texte.
translation_notes:
  register: Français international moderne, courant et digne. « Détourner l’oreille » conserve l’image grecque tout en restant idiomatique; le parallélisme « de la vérité ... vers des mythes » rend clairement le contraste.
