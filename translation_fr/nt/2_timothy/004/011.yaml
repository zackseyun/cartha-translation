id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: fr
  text: Luc seul est avec moi. Prends Marc avec toi et amène-le, car il m’est utile pour le ministère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le service ». Le grec peut désigner plus largement toute forme de service.
    reason: Alternative lexicale préservant l’étendue sémantique de διακονία.
lexical_decisions:
- source_word: Λουκᾶς
  choice: Luc
  rationale: Forme française traditionnelle et standard du nom grec Λουκᾶς.
- source_word: μόνος
  choice: seul
  rationale: Exprime directement que Luc est l’unique compagnon présent auprès de Paul.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Rend naturellement l’accompagnement exprimé par μετά avec le génitif.
- source_word: Μᾶρκον
  choice: Marc
  rationale: Forme française traditionnelle et standard du nom grec Μᾶρκος.
- source_word: ἀναλαβὼν
  choice: Prends Marc avec toi
  rationale: Le participe aoriste indique que Timothée doit prendre Marc en chemin ou se joindre à lui avant de l’amener; cette formulation française conserve la séquence sans la surcharger.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: et amène-le
  rationale: L’impératif demande à Timothée d’amener Marc en sa compagnie; le pronom explicite est naturel en français et renvoie clairement à Marc.
- source_word: γάρ μοι
  choice: car il m’est
  rationale: Conserve la valeur explicative de γάρ et la référence personnelle exprimée par μοι.
- source_word: εὔχρηστος
  choice: utile
  rationale: Équivalent direct et courant indiquant que Marc est précieux pour la tâche envisagée.
- source_word: εἰς διακονίαν
  choice: pour le ministère
  rationale: Dans ce contexte de travail apostolique, « ministère » rend probablement le mieux διακονία, tout en signalant en note le sens plus général possible de service.
theological_decisions:
- issue: Portée de διακονία dans l’utilité de Marc
  choice: pour le ministère
  alternative: pour le service
  rationale: Le contexte favorise l’activité de ministère liée à l’œuvre apostolique, mais le grec n’impose pas un office ecclésiastique technique et peut désigner plus largement un service; cette amplitude est préservée par une note.
translation_notes:
  register: Français international moderne, simple et digne. « Prends Marc avec toi et amène-le » évite l’ambiguïté possible de « prends Marc et amène-le avec toi » tout en conservant le mouvement exprimé par le participe suivi de l’impératif.
