  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: fr
  text: Car moi, je suis déjà répandu comme une libation[a], et le moment de mon départ est arrivé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis déjà répandu ». Le verbe grec évoque l’image d’une libation versée en sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon relâchement » ou « ma dissolution ». « Départ » désigne ici naturellement la mort.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: je suis déjà versé en libation
  rationale: Le verbe désigne l’action de verser une libation et, ici, présente la mort imminente de Paul sous une image sacrificielle. La formulation conserve directement la métaphore sans la réduire à « je vais mourir ».
- source_word: ἤδη
  choice: déjà
  rationale: L’adverbe indique que l’action est dès maintenant en cours, ce qui convient au sentiment d’une mort imminente.
- source_word: καιρός
  choice: le moment
  rationale: Dans ce contexte, καιρός désigne un moment décisif plutôt que le temps en général. « Le moment » est naturel en français et garde cette nuance.
- source_word: ἀναλύσεώς
  choice: départ
  rationale: Le nom peut évoquer un départ, une délivrance ou une dissolution. « Départ » rend naturellement l’euphémisme désignant ici la mort tout en préservant l’image.
- source_word: ἐφέστηκεν
  choice: est arrivé
  rationale: 'Le parfait exprime une arrivée dont le résultat est présent : le moment se tient désormais là. « Est arrivé » restitue clairement cet état présent.'
- source_word: γὰρ
  choice: Car
  rationale: « Car » maintient le lien explicatif avec ce qui précède dans un registre digne et courant.
theological_decisions:
- issue: Description métaphorique de la mort de Paul
  choice: Paul présente sa mort imminente au moyen de l’image sacrificielle d’une libation et de l’euphémisme du départ.
  alternative: Comprendre σπένδομαι comme une allusion plus générale à ses souffrances, sans référence précise à sa mort.
  rationale: La combinaison de σπένδομαι et de ἀνάλυσις renvoie fortement à une mort imminente. La traduction conserve toutefois les deux métaphores au lieu de les remplacer par l’explication « je vais mourir ».
translation_notes:
  register: Français international moderne, naturel et digne. « Versé en libation » conserve l’image cultuelle avec une formulation concise; les notes explicitent les sens possibles sans trancher au-delà du texte grec.
