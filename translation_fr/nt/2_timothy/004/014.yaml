id: 2TI.4.14
reference: 2 Timothy 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: fr
  text: Alexandre, l’artisan qui travaillait les métaux[a], m’a fait beaucoup de mal[b]. Le Seigneur le rétribuera selon ses actes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Alexandre, le bronzier ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « m’a manifesté beaucoup de maux » ; on pourrait aussi traduire : « m’a causé beaucoup de tort ».'
    reason: lexical_alternative
  - marker: c
    text: 'Quelques manuscrits portent : « Que le Seigneur le rétribue selon ses actes ! »'
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: l’artisan qui travaillait les métaux
  rationale: Le terme désigne un artisan travaillant le métal, souvent le cuivre ou le bronze. Cette formulation française claire évite de préciser sans certitude le métal concerné.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: m’a fait beaucoup de mal
  rationale: Le grec évoque littéralement de nombreux maux manifestés envers Paul. L’expression retenue rend naturellement en français le tort effectivement subi sans affaiblir la gravité de κακά.
- source_word: ἀποδώσει
  choice: rétribuera
  rationale: Le futur de ἀποδίδωμι exprime ici la rétribution. « Rétribuera » conserve la portée judiciaire de l’expression dans un registre digne et courant.
- source_word: κύριος
  choice: Le Seigneur
  rationale: Cette traduction respecte le titre défini ὁ κύριος et son emploi biblique usuel.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: selon ses actes
  rationale: « Selon ses actes » conserve l’idée d’une rétribution proportionnée aux œuvres accomplies tout en étant plus naturel en français moderne que « selon ses œuvres » dans ce contexte.
theological_decisions:
- issue: Déclaration au futur ou souhait de rétribution divine
  choice: Le Seigneur le rétribuera
  alternative: Que le Seigneur le rétribue
  rationale: 'Le texte retenu porte le futur indicatif ἀποδώσει : Paul affirme donc la rétribution divine plutôt qu’il ne formule une imprécation. La variante optative de certains manuscrits est signalée en note afin de préserver la tension textuelle et théologique.'
translation_notes:
  register: Français international moderne, clair et digne. La tournure idiomatique « m’a fait beaucoup de mal » évite un calque obscur, tandis que les notes conservent les nuances lexicales et la variante manuscrite.
