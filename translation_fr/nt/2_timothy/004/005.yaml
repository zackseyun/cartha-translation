reference: 2 Timothy 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: fr
  text: Mais toi, reste lucide en toutes circonstances[a], endure les souffrances[b], fais le travail d’un évangéliste et accomplis pleinement ton ministère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garde la tête froide », « sois maître de toi » ou « sois vigilant ». Le verbe grec signifie littéralement « être sobre », mais il est employé ici au sens figuré de rester clairvoyant et maître de soi.
    reason: lexical_alternative
  - marker: b
    text: Ou « accepte de souffrir » ou « supporte les épreuves ».
    reason: lexical_alternative
  - marker: c
    text: Ou « mène ton ministère jusqu’à son plein accomplissement ». Le verbe grec exprime l’idée d’accomplir entièrement la mission confiée.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: Le pronom exprimé met Timothée en relief, tandis que δέ marque le contraste avec les personnes décrites aux versets précédents. « Mais toi » restitue naturellement les deux effets.
- source_word: νῆφε
  choice: reste lucide
  rationale: Le verbe signifie littéralement « être sobre », mais ses emplois néotestamentaires sont figurés et évoquent la clarté d’esprit, la maîtrise de soi et la vigilance. « Reste lucide » exprime cet appel à la stabilité mentale sous la pression sans suggérer principalement l’abstinence d’alcool.
- source_word: ἐν πᾶσιν
  choice: en toutes circonstances
  rationale: L’expression indique que cette lucidité doit être maintenue de manière générale. Cette formulation française naturelle conserve l’ampleur du grec, qui pourrait aussi se rendre par « en toutes choses ».
- source_word: κακοπάθησον
  choice: endure les souffrances
  rationale: L’impératif appelle Timothée à accepter les peines liées à sa mission et à tenir ferme au milieu d’elles. « Endure » communique à la fois la souffrance et la persévérance.
- source_word: ἔργον ποίησον
  choice: fais le travail
  rationale: Cette tournure simple et idiomatique rend directement l’expression grecque et son impératif.
- source_word: εὐαγγελιστοῦ
  choice: d’un évangéliste
  rationale: Le nom désigne quelqu’un qui annonce la bonne nouvelle. « Évangéliste » est le terme français établi et convient à la construction sans article du grec.
- source_word: τὴν διακονίαν σου
  choice: ton ministère
  rationale: Dans ce contexte de mission confiée à Timothée, διακονία désigne son service consacré à l’annonce et à la responsabilité pastorale. « Ministère » convient mieux ici que le terme plus général « service ».
- source_word: πληροφόρησον
  choice: accomplis pleinement
  rationale: Le verbe demande de mener la mission jusqu’à son plein accomplissement. L’adverbe « pleinement » conserve explicitement cette idée de plénitude.
theological_decisions:
- issue: Portée de la διακονία confiée à Timothée
  choice: ton ministère
  alternative: ton service
  rationale: Le contexte immédiat concerne la responsabilité confiée à Timothée d’annoncer la bonne nouvelle et de remplir sa charge. « Ministère » rend cette mission sans lui attribuer une structure confessionnelle particulière.
- issue: Sens de εὐαγγελιστοῦ
  choice: un évangéliste, c’est-à-dire quelqu’un qui annonce la bonne nouvelle
  alternative: un prédicateur de la bonne nouvelle
  rationale: Le terme établi « évangéliste » préserve la désignation grecque sans décider si Paul évoque une fonction ecclésiale formelle ou, plus largement, l’activité d’annoncer la bonne nouvelle.
translation_notes:
  register: Français international moderne, direct et digne. Les quatre impératifs conservent le rythme pressant de l’exhortation. « Mais toi » maintient l’emphase personnelle; « reste lucide » évite une lecture exclusivement liée à l’alcool; « évangéliste » garde le terme traditionnel tout en laissant ouverte la question d’une fonction officielle.
