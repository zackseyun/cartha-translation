source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: fr
  text: En venant, apporte le manteau que j’ai laissé à Troas chez Carpus, ainsi que les livres[a], surtout les parchemins.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les rouleaux » : le terme grec peut désigner des rouleaux écrits ou d’autres documents de même nature.'
    reason: lexical_alternative
  - marker: b
    text: Certains comprennent « manteau » comme un étui ou une enveloppe servant à transporter des livres, mais le sens habituel du terme grec est celui d’un vêtement de dessus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν φαιλόνην
  choice: le manteau
  rationale: Le terme désigne le plus naturellement un vêtement de dessus. « Manteau » est courant, digne et n’impose pas une forme plus précise que le grec.
- source_word: ὃν ἀπέλιπον
  choice: que j’ai laissé
  rationale: L’aoriste actif à la première personne exprime simplement l’action passée de laisser quelque chose; cette formulation est naturelle en français.
- source_word: ἐν Τρῳάδι παρὰ Κάρπῳ
  choice: à Troas chez Carpus
  rationale: ἐν situe l’objet à Troas, tandis que παρά avec le datif indique ici qu’il se trouve auprès de Carpus ou à son domicile. « Chez Carpus » rend naturellement cette relation sans exclure l’idée qu’il en ait la garde.
- source_word: ἐρχόμενος φέρε
  choice: En venant, apporte
  rationale: Le participe présent est lié au sujet de l’impératif et peut exprimer la circonstance du déplacement. « En venant » reste proche de la construction grecque tout en étant idiomatique.
- source_word: καὶ τὰ βιβλία
  choice: ainsi que les livres
  rationale: βιβλία désigne des documents écrits, souvent sous forme de rouleaux dans l’Antiquité. « Livres » demeure le terme français général, tandis que l’incertitude matérielle est signalée en note.
- source_word: μάλιστα τὰς μεμβράνας
  choice: surtout les parchemins
  rationale: μάλιστα met particulièrement en relief les μεμβράναι, supports ou documents en peau préparée. « Parchemins » est le rendu français précis et traditionnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’ordre général de la demande grecque. Les notes sont placées après les éléments auxquels elles se rapportent; leur ordre a été corrigé par rapport à la couche anglaise fournie, où les marqueurs semblaient inversés.
