  text: Σπούδασον ἐλθεῖν πρός με ταχέως·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: fr
  text: Fais tout ton possible pour venir me rejoindre rapidement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Efforce-toi de venir auprès de moi bientôt » ou « Fais de ton mieux pour venir me rejoindre sans tarder ».
    reason: 'Alternative lexicale : σπουδάζω peut mettre l’accent sur l’empressement ou l’application, tandis que ταχέως peut signifier « rapidement » ou « bientôt ».'
lexical_decisions:
- source_word: Σπούδασον
  choice: Fais tout ton possible
  rationale: L’impératif aoriste de σπουδάζω exprime ici un effort sérieux et empressé, et non la seule rapidité. Cette formulation est naturelle en français moderne et garde cet élément distinct de ταχέως.
- source_word: ἐλθεῖν
  choice: venir
  rationale: L’infinitif de ἔρχομαι, régi par Σπούδασον, désigne le déplacement vers celui qui parle.
- source_word: πρός με
  choice: me rejoindre
  rationale: Avec l’accusatif, πρός indique un mouvement vers une personne. « Me rejoindre » rend naturellement en français le mouvement vers Paul sans alourdir la phrase.
- source_word: ταχέως
  choice: rapidement
  rationale: L’adverbe peut évoquer la rapidité ou la proximité temporelle. « Rapidement » préserve l’urgence tout en évitant de confondre son apport avec l’effort exprimé par Σπούδασον.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle de Paul à Timothée. La formulation distingue l’effort demandé par σπουδάζω de l’urgence exprimée par ταχέως.
