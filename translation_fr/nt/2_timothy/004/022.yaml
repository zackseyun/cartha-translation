id: 2TI.4.22
reference: 2 Timothy 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: fr
  text: Que le Seigneur soit avec ton esprit[a]. Que la grâce soit avec vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec passe du singulier au pluriel : « ton esprit » (singulier), puis « vous tous » (pluriel).'
    reason: La note signale une variation grammaticale significative qui montre que la dernière bénédiction dépasse Timothée seul.
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Titre français naturel et traditionnel dans le Nouveau Testament pour κύριος; il laisse implicite l’identité du référent comme dans le grec.
- source_word: μετὰ
  choice: soit avec
  rationale: Le grec omet le verbe; le français exige ici une formulation de souhait. « soit avec » restitue naturellement la bénédiction implicite.
- source_word: πνεύματός
  choice: esprit
  rationale: La présence du possessif singulier renvoie naturellement à l’esprit humain de Timothée; la minuscule évite d’identifier directement ce terme au Saint-Esprit.
- source_word: σου
  choice: ton
  rationale: Le possessif singulier est conservé afin de marquer l’adresse personnelle à Timothée.
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est l’équivalent courant et théologiquement adéquat dans les bénédictions finales de Paul.
- source_word: ὑμῶν
  choice: vous tous
  rationale: « Vous tous » rend explicite le pluriel français et fait ressortir le passage du singulier au pluriel.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: Conserver le titre « le Seigneur », qui renvoie vraisemblablement à Jésus dans cette bénédiction paulinienne.
  alternative: Comprendre le titre comme une référence plus générale à Dieu.
  rationale: Le contexte des conclusions épistolaires de Paul favorise une référence à Jésus, mais la traduction n’ajoute pas son nom puisque le grec ne le précise pas.
- issue: Passage du singulier au pluriel
  choice: Adresser la première bénédiction à Timothée individuellement, puis étendre la grâce au groupe associé à la lettre.
  alternative: Formuler les deux propositions comme si elles ne visaient que Timothée.
  rationale: Le grec distingue nettement σου, singulier, de ὑμῶν, pluriel; cette variation mérite d’être préservée.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « Que… soit avec » rend clairement les deux souhaits implicites du grec. « Vous tous » évite l’ambiguïté du pronom français « vous » quant au nombre.
