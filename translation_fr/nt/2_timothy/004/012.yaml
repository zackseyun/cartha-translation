  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: fr
  text: Quant à Tychique, je l’ai envoyé à Éphèse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Mais j’ai envoyé Tychique à Éphèse » ou « Et j’ai envoyé Tychique à Éphèse »; la particule grecque δέ peut marquer une simple continuation, une transition ou un léger contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Tychique
  rationale: Nom propre masculin à l’accusatif, rendu selon sa forme française traditionnelle et courante.
- source_word: δὲ
  choice: Quant à
  rationale: La particule δέ marque ici une transition légère et peut aussi suggérer un contraste modéré avec ce qui précède. « Quant à » rend naturellement cette reprise thématique en français sans accentuer excessivement l’opposition.
- source_word: ἀπέστειλα
  choice: je l’ai envoyé
  rationale: Aoriste actif de l’indicatif, première personne du singulier. Le passé composé est la forme narrative naturelle en français moderne; le pronom « l’ » explicite grammaticalement que Tychique est le complément d’objet placé en tête.
- source_word: εἰς
  choice: à
  rationale: Devant un nom de ville exprimant la destination, εἰς se rend naturellement par « à » en français.
- source_word: Ἔφεσον
  choice: Éphèse
  rationale: Nom de lieu rendu selon sa forme française traditionnelle et courante.
