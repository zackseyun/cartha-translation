reference: 2 Timothy 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: fr
  text: 'Je t’adjure solennellement devant Dieu et Jésus le Messie, qui va juger les vivants et les morts[a], et par sa manifestation et son royaume[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui jugera les vivants et les morts ».
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « et sa manifestation et son royaume »; le lien syntaxique reste plus implicite en grec.
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Je t’adjure solennellement
  rationale: Dans ce contexte de mandat apostolique, le verbe exprime une mise en demeure grave et solennelle, et non un simple témoignage. Le pronom « t’ » explicite en français le destinataire sous-entendu, identifié par le contexte.
- source_word: ἐνώπιον
  choice: devant
  rationale: Rend avec concision l’idée d’être en présence et sous le regard de Dieu et du Messie.
- source_word: Χριστοῦ Ἰησοῦ
  choice: le Messie Jésus
  rationale: « Messie » conserve ici la valeur de titre de Χριστός dans cette déclaration solennelle, plutôt que de l’assimiler sans indication à un élément de nom propre.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: qui va juger
  rationale: Cette tournure française naturelle conserve la perspective future et la nuance d’imminence possible de μέλλω sans imposer un calendrier précis.
- source_word: ζῶντας καὶ νεκρούς
  choice: les vivants et les morts
  rationale: Formulation française consacrée et directe, qui conserve la portée universelle du jugement.
- source_word: ἐπιφάνειαν
  choice: manifestation
  rationale: Rend la venue rendue visible exprimée par ἐπιφάνεια sans réduire le terme à une simple arrivée. « Apparition » serait également possible, mais peut suggérer en français une présence brève ou spectrale.
- source_word: βασιλείαν
  choice: royaume
  rationale: Équivalent courant qui peut désigner le domaine et l’exercice de la royauté; « règne » serait possible mais orienterait davantage vers l’acte de régner.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: et par sa manifestation et son royaume
  rationale: 'Comprend les accusatifs comme prolongeant la formule d’adjuration : Paul adjure Timothée aussi « par » la manifestation et le royaume du Messie. La coordination grecque plus implicite est signalée en note.'
theological_decisions:
- issue: Valeur de Χριστός dans Χριστοῦ Ἰησοῦ
  choice: le Messie Jésus
  alternative: le Christ Jésus
  rationale: Le contexte judiciaire et eschatologique maintient la force titulaire de Χριστός. « Messie » rend cette valeur explicitement, sans importer une interprétation confessionnelle particulière.
- issue: Portée eschatologique de μέλλω
  choice: qui va juger
  alternative: qui jugera
  rationale: Le choix retenu conserve la nuance prospective, voire imminente, de μέλλω tout en laissant ouverte la question du moment exact.
- issue: Fonction syntaxique de la manifestation et du royaume
  choice: et par sa manifestation et son royaume
  alternative: et sa manifestation et son royaume
  rationale: La traduction principale explicite l’analyse la plus cohérente des accusatifs comme éléments de l’adjuration, tandis que la note conserve la coordination plus littérale et l’implicite du grec.
translation_notes:
  register: Français international moderne, solennel et intelligible. « Je t’adjure solennellement » convient au mandat grave adressé personnellement à Timothée. Les deux notes préservent les ambiguïtés lexicales et syntaxiques réelles du grec.
