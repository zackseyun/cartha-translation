  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: fr
  text: Proclame la parole ; sois prêt à intervenir[a], que l’occasion soit favorable ou non[b] ; reprends, réprimande, encourage[c], avec toute patience et par l’enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tiens-toi prêt », « sois présent » ou « interviens avec insistance ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à temps, à contretemps ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « exhorte » ou « presse d’agir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Proclame
  rationale: L’impératif de κηρύσσω désigne une proclamation publique. « Proclame » restitue directement cette idée dans un français actuel et digne.
- source_word: τὸν λόγον
  choice: la parole
  rationale: λόγος désigne ici la parole ou le message confié à Timothée. « La parole » conserve l’expression large du grec sans la réduire explicitement à « l’Évangile » ou à « l’Écriture ».
- source_word: ἐπίστηθι
  choice: sois prêt à intervenir
  rationale: Le verbe peut exprimer le fait de se tenir présent, prêt ou d’agir avec insistance. « Sois prêt à intervenir » rend clairement sa force pratique dans ce contexte.
- source_word: εὐκαίρως ἀκαίρως
  choice: que l’occasion soit favorable ou non
  rationale: La paire d’adverbes oppose le moment opportun au moment inopportun. Cette formulation française en conserve le contraste sans recourir à un idiome vieilli.
- source_word: ἔλεγξον
  choice: reprends
  rationale: ἐλέγχω implique de mettre la faute en évidence afin de la corriger. « Reprends » exprime cette correction adressée à une personne.
- source_word: ἐπιτίμησον
  choice: réprimande
  rationale: Ce second impératif a une force plus sévère que le précédent. « Réprimande » maintient cette progression.
- source_word: παρακάλεσον
  choice: encourage
  rationale: παρακαλέω peut signifier encourager, exhorter ou presser d’agir. Dans cette série mêlant correction et soutien, « encourage » rend naturellement sa dimension positive tout en laissant « exhorte » comme possibilité.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: avec une patience sans faille
  rationale: μακροθυμία désigne la patience persévérante envers les personnes, et πάσῃ en souligne la pleine mesure. La formulation choisie communique cette intensité en français naturel.
- source_word: καὶ διδαχῇ
  choice: et en instruisant
  rationale: διδαχή renvoie à l’enseignement ou à l’instruction qui accompagne les actes demandés. La tournure verbale est idiomatique en français et conserve la fonction de l’enseignement dans l’exhortation.
theological_decisions:
- issue: Portée de « la parole »
  choice: Conserver « la parole » sans explicitation.
  alternative: « le message », « l’Évangile » ou « l’Écriture »
  rationale: Le contexte relie la mission de Timothée aux Écritures et à la proclamation apostolique, mais λόγος n’est pas davantage précisé dans ce verset. La traduction maintient cette amplitude.
- issue: Nuance de παρακάλεσον
  choice: « encourage » dans le texte principal
  alternative: « exhorte » ou « presse d’agir »
  rationale: Le verbe couvre l’encouragement et l’appel pressant. Le contexte ne permet pas d’exclure l’une de ces nuances ; une note préserve donc cette polyvalence.
translation_notes:
  register: Français international actuel, clair et soutenu sans archaïsmes. La suite brève des impératifs et leur progression rhétorique sont préservées. Les notes signalent les principales ambiguïtés lexicales sans surcharger le texte.
