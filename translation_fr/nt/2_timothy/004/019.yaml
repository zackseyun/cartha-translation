  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: fr
  text: Salue Prisca[a] et Aquilas, ainsi que la maisonnée d’Onésiphore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Prisca » ; ailleurs, elle est aussi appelée « Priscille » (par exemple en Actes 18.2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Salue
  rationale: L’impératif aoriste moyen de ἀσπάζομαι exprime ici la consigne épistolaire ordinaire de transmettre une salutation. « Salue » est direct, naturel et n’ajoute aucune nuance affective absente du grec.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Le texte grec porte Πρίσκαν, forme accusative de Prisca. La translittération « Prisca » respecte le nom employé dans ce verset, sans lui substituer la forme apparentée « Priscille ».
- source_word: Ἀκύλαν
  choice: Aquilas
  rationale: « Aquilas » est la forme française biblique courante du nom grec Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: la maison d’Onésiphore
  rationale: Dans une formule de salutation, οἶκος désigne les personnes rattachées au foyer plutôt que le bâtiment. En français biblique naturel, « la maison de » peut conserver cette portée collective sans la limiter aux seuls liens de sang.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et digne. La structure coordonnée du grec est conservée, tandis que « ainsi que » évite une succession pesante de « et ». Le sens collectif de « maison » demeure conforme à l’usage biblique français.
