  text: τὸν ⸂καλὸν ἀγῶνα⸃ ἠγώνισμαι, τὸν δρόμον τετέλεκα, τὴν πίστιν τετήρηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: fr
  text: J’ai combattu le bon combat, j’ai achevé la course, j’ai gardé la foi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai gardé la fidélité » ou « je suis resté fidèle ». Le grec τὴν πίστιν peut désigner « la foi » ou la fidélité maintenue.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: le bon combat
  rationale: ἀγών désigne un combat, une lutte ou une compétition, tandis que καλός signifie ici « bon » ou « noble ». « Le bon combat » est naturel en français, conserve la force de la métaphore et évite d’en préciser indûment le caractère militaire ou sportif.
- source_word: ἠγώνισμαι
  choice: j’ai combattu
  rationale: Le parfait de ἀγωνίζομαι présente un combat mené à son terme avec un résultat qui demeure. Le passé composé français rend naturellement cet aspect dans le contexte.
- source_word: δρόμον
  choice: la course
  rationale: δρόμος désigne la course ou le parcours à accomplir. « La course » maintient clairement la métaphore athlétique.
- source_word: τετέλεκα
  choice: j’ai achevé
  rationale: Le parfait de τελέω exprime l’action menée jusqu’à son terme. « J’ai achevé » est concis, digne et souligne l’accomplissement complet.
- source_word: πίστιν
  choice: la foi
  rationale: Avec l’article, τὴν πίστιν peut désigner la foi reçue et confessée. Le mot peut aussi évoquer la fidélité personnelle; cette ambiguïté réelle est signalée en note.
- source_word: τετήρηκα
  choice: j’ai gardé
  rationale: τηρέω signifie garder, observer ou préserver. « J’ai gardé » permet de conserver à la fois l’idée de demeurer attaché à la foi et celle de la préserver.
theological_decisions:
- issue: Sens de τὴν πίστιν
  choice: la foi
  alternative: je suis resté fidèle
  rationale: L’article favorise ici la compréhension de « la foi » comme ce que Paul a conservé, sans exclure la nuance de fidélité vécue. La traduction principale retient la lecture contextuellement forte, et la note préserve l’autre possibilité sans trancher artificiellement.
translation_notes:
  register: Français moderne, international et digne. La structure ternaire et le parallélisme des trois verbes au passé composé reproduisent le rythme du grec. « Le bon combat » et « la course » conservent la succession d’images sans les harmoniser.
