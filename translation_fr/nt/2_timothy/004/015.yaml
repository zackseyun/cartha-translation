id: 2TI.4.15
reference: 2 Timothy 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: fr
  text: Toi aussi, méfie-toi de lui[a], car il s’est vivement opposé à nos paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garde-toi de lui » ou « sois sur tes gardes contre lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: méfie-toi de
  rationale: L’impératif présent moyen appelle Timothée à rester personnellement sur ses gardes. « Méfie-toi de lui » est naturel en français moderne et conserve la force de l’avertissement.
- source_word: λίαν
  choice: vivement
  rationale: L’adverbe intensifie l’opposition. « Vivement » s’emploie naturellement avec « s’opposer » et exprime une forte intensité.
- source_word: ἀντέστη
  choice: s’est opposé
  rationale: L’aoriste de ἀνθίστημι désigne le fait de se dresser contre ou de résister. « S’est opposé » est clair et idiomatique.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: à nos paroles
  rationale: Cette formulation reste proche du grec sans préciser indûment s’il s’agit d’un message, d’un enseignement ou d’une déposition.
- source_word: ὃν
  choice: lui
  rationale: Le pronom relatif renvoie à Alexandre, mentionné au verset précédent. Le pronom personnel est la formulation française la plus naturelle.
- source_word: καὶ σὺ
  choice: Toi aussi
  rationale: 'Cette tournure conserve l’accent porté par καὶ et par le pronom explicite σὺ : Timothée doit lui aussi prendre garde.'
theological_decisions:
- issue: Portée de « nos paroles »
  choice: La traduction garde le sens général des paroles prononcées par Paul et ses associés, sans leur attribuer une catégorie technique précise.
  alternative: « notre message », « notre enseignement » ou « notre déposition »
  rationale: Le grec ne permet pas de déterminer à lui seul si l’opposition visait une défense judiciaire, la prédication ou un enseignement doctrinal. « Nos paroles » préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient à l’adresse personnelle de Paul à Timothée. La syntaxe reste concise et proche du mouvement de la phrase grecque.
