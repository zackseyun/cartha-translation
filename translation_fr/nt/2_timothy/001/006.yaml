source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: fr
  text: C’est pourquoi je te rappelle de raviver le don de Dieu qui est en toi par l’imposition de mes mains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « ranimer la flamme ». Le verbe grec évoque le fait de faire de nouveau flamber un feu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: C’est pourquoi
  rationale: Expression causale idiomatique qui conserve le lien logique avec le contexte précédent dans un français naturel.
- source_word: ἀναμιμνῄσκω
  choice: je te rappelle
  rationale: Le présent de l’indicatif suivi de l’infinitif exprime naturellement ici un rappel adressé à Timothée.
- source_word: σε ἀναζωπυρεῖν
  choice: de raviver
  rationale: Le verbe évoque le fait de faire reprendre pleinement un feu. « Raviver » conserve cette image tout en restant clair et idiomatique.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: le don de Dieu
  rationale: χάρισμα désigne un don accordé par grâce. Cette traduction reste transparente sans préciser indûment qu’il s’agit d’un type particulier de don spirituel.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: qui est en toi
  rationale: La proposition relative présente le don comme étant actuellement en Timothée; la formulation française suit cette affirmation sans l’interpréter davantage.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: par l’imposition de mes mains
  rationale: « Imposition des mains » est l’expression française reconnue pour ce geste, et « par » rend ici la valeur instrumentale de διά avec le génitif.
theological_decisions:
- issue: Rapport entre le don et le geste accompli par Paul
  choice: par l’imposition de mes mains
  alternative: à l’occasion de l’imposition de mes mains
  rationale: La traduction conserve la valeur instrumentale ou médiatrice du grec sans développer une doctrine sacramentelle que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, naturel et digne. « Raviver » maintient l’image du feu sans recourir à une tournure lourde; « imposition de mes mains » conserve la formulation personnelle et la tension théologique du texte.
