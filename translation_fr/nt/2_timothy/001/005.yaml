revisions:
- from: Je me rappelle ta foi sincère. Elle a d’abord habité en ta grand-mère Loïs et en ta mère Eunice, et je suis convaincu qu’elle habite aussi en toi.
  to: Le souvenir de la foi sincère qui est en toi m’est revenu, elle qui a d’abord habité chez ta grand-mère Loïs et chez ta mère Eunice ; et je suis convaincu qu’elle est aussi en toi.
  rationale: La révision rend plus exactement le rappel reçu exprimé par ὑπόμνησιν λαβών, améliore l’idiomaticité française de l’image de la foi qui habite, et préserve l’ellipse finale du grec sans imposer une interprétation supplémentaire.
  reviewer_model: gpt-5.6-terra
