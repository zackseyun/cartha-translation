  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: fr
  text: Le souvenir de la foi sincère qui est en toi m’est revenu, elle qui a d’abord habité chez ta grand-mère Loïs et chez ta mère Eunice ; et je suis convaincu qu’elle est aussi en toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Je me rappelle
  rationale: La tournure idiomatique exprime le fait d’avoir reçu ou gardé le souvenir de quelque chose; cette formulation française naturelle conserve le lien avec le contexte de la prière et du souvenir.
- source_word: ἀνυποκρίτου πίστεως
  choice: foi sincère
  rationale: ἀνυπόκριτος désigne ce qui est sans hypocrisie, donc authentique ou sincère.
- source_word: ἐνῴκησεν
  choice: a habité
  rationale: Le verbe signifie littéralement «habiter en»; garder cette image permet de rendre sa force personnelle et durable.
- source_word: πέπεισμαι
  choice: je suis convaincu
  rationale: Le parfait exprime une conviction établie et persistante.
theological_decisions:
- issue: Rapport entre la foi de Timothée et celle de sa famille
  choice: Répéter «elle habite» pour la foi en Timothée
  alternative: «qu’elle est aussi en toi»
  rationale: La répétition explicite le verbe sous-entendu dans le grec sans suggérer une transmission automatique ou héréditaire de la foi.
- issue: Portée de πρῶτον
  choice: «d’abord» rattaché à la grand-mère puis à la mère
  alternative: «autrefois»
  rationale: Cette lecture respecte l’ordre familial exprimé dans la phrase tout en laissant ouverte la manière précise dont cette foi s’est manifestée chez chacune.
translation_notes:
  register: Français international moderne, clair et digne. «Loïs» conserve la graphie française traditionnelle du nom propre. La formulation en trois phrases évite un participe initial lourd tout en maintenant la progression logique du grec.
