revisions:
- from: mais elle a maintenant été manifestée par la manifestation de notre Sauveur Jésus le Messie[a]. Il a aboli la mort et mis en lumière la vie et l’incorruptibilité[b] par l’Évangile,
  to: mais elle a maintenant été révélée par l’apparition de notre Sauveur Jésus le Messie[a], qui a certes aboli la mort et mis en lumière la vie et l’incorruptibilité[b] par l’Évangile,
  rationale: La correction remplace la répétition peu naturelle « manifestée par la manifestation » par « révélée par l’apparition », tout en conservant la voix passive, le renvoi à la grâce du verset précédent et le rôle instrumental de l’apparition du Sauveur. La relative restitue plus nettement la dépendance des deux participes grecs envers Jésus le Messie. Les ancres et les deux notes sont conservées, avec une légère amélioration stylistique de la note a.
