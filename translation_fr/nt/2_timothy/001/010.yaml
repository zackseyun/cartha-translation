id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: fr
  text: mais elle a maintenant été révélée par l’apparition de notre Sauveur Jésus le Messie[a], qui a certes aboli la mort et mis en lumière la vie et l’incorruptibilité[b] par l’Évangile,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le grec Χριστός peut fonctionner comme un titre (« Messie ») ou comme une désignation à valeur de nom (« Christ »).
    reason: alternative_reading
  - marker: b
    text: Ou « immortalité ». Le terme grec souligne ce qui est impérissable et exempt de corruption.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: elle a maintenant été manifestée
  rationale: Le participe aoriste passif féminin renvoie à la grâce de Dieu mentionnée au verset précédent. Une proposition verbale est naturelle en français et conserve la voix passive.
- source_word: ἐπιφανείας
  choice: manifestation
  rationale: Le terme désigne l’apparition visible ou la venue révélatrice de Jésus. « Manifestation » garde le lien sémantique avec l’idée de révélation sans imposer ici le sens technique d’une venue future.
- source_word: σωτῆρος
  choice: Sauveur
  rationale: Équivalent français établi qui conserve la valeur de titre christologique.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici une force titulaire après « notre Sauveur »; l’article français rend le titre de façon idiomatique sans prétendre qu’un article grec est présent.
- source_word: καταργήσαντος
  choice: a aboli
  rationale: Le verbe exprime la mise hors d’effet ou l’abolition. « A aboli » préserve la force de l’affirmation sans expliciter davantage la manière dont la victoire sur la mort se déploie.
- source_word: θάνατον
  choice: la mort
  rationale: Traduction directe du nom grec, sans personnification ajoutée.
- source_word: φωτίσαντος
  choice: mis en lumière
  rationale: Cette tournure française naturelle exprime le fait de rendre manifeste ou visible.
- source_word: ζωὴν
  choice: la vie
  rationale: Traduction directe qui laisse au contexte la portée salvatrice et eschatologique du terme.
- source_word: ἀφθαρσίαν
  choice: l’incorruptibilité
  rationale: Le mot souligne l’absence de corruption, de dégradation ou de dépérissement; ce choix est plus précis qu’« immortalité ».
- source_word: διὰ τοῦ εὐαγγελίου
  choice: par l’Évangile
  rationale: « Par » exprime ici le moyen, tandis qu’« Évangile » est le terme français établi pour la bonne nouvelle chrétienne.
- source_word: μὲν ... δὲ
  choice: a aboli ... et mis en lumière
  rationale: La coordination française rend naturellement les deux actions complémentaires, sans reproduire mécaniquement la structure corrélative grecque.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Après le titre « notre Sauveur », la valeur messianique de Χριστός demeure perceptible. La note conserve la lecture française traditionnelle où « Christ » fonctionne davantage comme une désignation apparentée à un nom.
- issue: Portée de καταργήσαντος appliqué à la mort
  choice: a aboli la mort
  alternative: a réduit la mort à l’impuissance
  rationale: « A aboli » maintient l’affirmation forte du grec tout en laissant intacte la tension entre la victoire décisive proclamée ici et la présence encore observable de la mort.
- issue: Sens de ἀφθαρσίαν
  choice: incorruptibilité
  alternative: immortalité
  rationale: Le choix principal préserve l’accent lexical sur ce qui ne se corrompt ni ne dépérit; l’autre traduction courante est signalée sans réduire le terme à la seule durée infinie de l’existence.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « manifestée par la manifestation » reflète le lien lexical et thématique du grec; elle reste intelligible dans un registre biblique soutenu. Le féminin « elle » assure le raccord avec « la grâce » au verset précédent.
