id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: fr
  text: Paul, apôtre de Jésus le Messie[a] par la volonté de Dieu, selon la promesse de la vie qui est en Jésus le Messie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ », ici et à la fin du verset.
    reason: Signale l’autre traduction française traditionnelle de Χριστός tout en conservant dans le texte principal sa valeur de titre.
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle et courante du nom personnel grec.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Dans cette présentation de Paul, le terme a son sens reconnu d’envoyé investi d’une mission; « apôtre » conserve cette portée sans la réduire à « messager ».
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. La tournure française « Jésus le Messie » exprime ce titre de manière naturelle, là où le calque « Messie Jésus » serait peu idiomatique.
- source_word: διὰ θελήματος θεοῦ
  choice: par la volonté de Dieu
  rationale: Avec le génitif, διά indique ici le moyen ou l’autorité à l’origine de l’apostolat; cette formulation française est à la fois précise et idiomatique.
- source_word: κατ’ ἐπαγγελίαν
  choice: selon la promesse
  rationale: κατά avec l’accusatif marque ici la conformité ou la correspondance. « Selon » préserve sobrement le lien avec l’apostolat de Paul.
- source_word: ζωῆς
  choice: de la vie
  rationale: Le génitif dépend de « promesse »; l’article défini convient puisque la proposition suivante précise de quelle vie il s’agit.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: qui est en Jésus le Messie
  rationale: L’article suivi du groupe prépositionnel qualifie la vie. « Qui est en » conserve la force relationnelle de ἐν sans l’expliciter davantage.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot fonctionne comme un titre et est donc traduit par « Messie ». La forme traditionnelle « Jésus-Christ » reste signalée en note, car Χριστός peut aussi être perçu comme une désignation devenue quasi nominale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe de la salutation demeure volontairement proche du grec; la virgule finale indique que la phrase se poursuit au verset suivant.
