  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: fr
  text: 'Garde le modèle des saines paroles que tu as entendues de moi, dans la foi[a] et l’amour qui sont en Jésus le Messie[b].[c]


    [a] Ou « dans la fidélité et l’amour ». Le mot grec traduit par « foi » peut aussi avoir le sens de « fidélité » ou de « confiance ».


    [b] Traduction traditionnelle : « Jésus-Christ ».


    [c] On peut aussi comprendre : « les saines paroles que tu as entendues de moi au sujet de la foi et de l’amour qui sont en Jésus le Messie ». La construction grecque peut indiquer soit la manière dont Timothée doit garder ce modèle, soit le contenu des paroles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la fidélité et l’amour ». Le mot grec traduit par « foi » peut aussi avoir le sens de « fidélité » ou de « confiance ».
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « Jésus-Christ ».'
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « les saines paroles que tu as entendues de moi au sujet de la foi et de l’amour qui sont en Jésus le Messie ». La construction grecque peut indiquer soit la manière dont Timothée doit garder ce modèle, soit le contenu des paroles.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτύπωσιν ἔχε
  choice: Garde comme modèle
  rationale: ὑποτύπωσις désigne un modèle, une esquisse ou une forme à suivre. Avec l’impératif ἔχε, « garde comme modèle » exprime naturellement l’idée de conserver une norme reçue sans surinterpréter le terme.
- source_word: ὑγιαινόντων λόγων
  choice: les paroles saines
  rationale: ὑγιαίνω évoque métaphoriquement ce qui est sain ou solide, notamment en matière d’enseignement, tandis que λόγοι signifie littéralement « paroles ». Cette formulation conserve à la fois le substantif et la métaphore grecs.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: que tu as entendues de moi
  rationale: παρά avec le génitif indique ici la source. En français, la relative se rattache naturellement aux « paroles ».
- source_word: ἐν πίστει καὶ ἀγάπῃ
  choice: dans la foi et l’amour
  rationale: La préposition ἐν est conservée par « dans ». πίστις est rendu par « foi », tout en signalant en note les sens possibles de fidélité ou de confiance.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: qui sont en Jésus le Messie
  rationale: Le syntagme prépositionnel qualifie collectivement la foi et l’amour. En français, « qui sont en » rend ce lien explicitement et s’accorde avec les deux noms.
- source_word: Χριστῷ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. « Jésus le Messie » est plus naturel en français que « Messie Jésus » et rend le sens du titre, tandis que la forme traditionnelle est donnée en note.
theological_decisions:
- issue: Rattachement de ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ
  choice: Le groupe décrit la manière ou la sphère dans laquelle Timothée doit garder le modèle.
  alternative: 'Le groupe précise le contenu des paroles : elles concernent la foi et l’amour en Jésus le Messie.'
  rationale: L’enchaînement exhortatif favorise le rattachement à l’impératif, mais la syntaxe grecque permet l’autre analyse. La note préserve cette ambiguïté sans la résoudre artificiellement.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme conserve une valeur titulaire dans la formule paulinienne. La traduction principale en explicite donc le sens, et la forme française traditionnelle figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Garde comme modèle » est idiomatique tout en restant proche de la structure grecque. « Paroles saines » maintient volontairement la métaphore de la santé. La ponctuation et les notes rendent visibles les ambiguïtés lexicales et syntaxiques du texte source.
