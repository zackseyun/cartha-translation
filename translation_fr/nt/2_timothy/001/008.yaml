id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: fr
  text: N’aie donc pas honte du témoignage au sujet de notre Seigneur[a], ni de moi, son prisonnier. Mais prends part aux souffrances pour la bonne nouvelle[b], selon la puissance de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du témoignage de notre Seigneur ». Le génitif grec peut désigner soit le témoignage au sujet du Seigneur, soit le témoignage rendu par lui.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « partage les souffrances pour la bonne nouvelle ». Le verbe grec exprime l’idée de prendre part, avec d’autres, aux épreuves liées à la bonne nouvelle.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « par la puissance de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: N’aie donc pas
  rationale: « Donc » marque naturellement la conséquence de l’exhortation précédente, tandis que la tournure impérative rend clairement la défense exprimée par μή avec le subjonctif.
- source_word: ἐπαισχυνθῇς
  choice: aie honte
  rationale: Cette expression française courante conserve l’idée de honte sociale et de recul devant l’opprobre, sans la réduire à un simple embarras.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: le témoignage au sujet de notre Seigneur
  rationale: 'Dans ce contexte, le génitif se comprend probablement comme désignant l’objet du témoignage : notre Seigneur. Une note conserve toutefois l’autre analyse possible.'
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: ni de moi, son prisonnier
  rationale: La coordination avec « avoir honte de » est naturelle en français. « Son prisonnier » maintient la relation étroite exprimée par αὐτοῦ sans la réduire explicitement à « emprisonné pour lui ».
- source_word: συγκακοπάθησον
  choice: prends part aux souffrances
  rationale: Le composé exprime la participation à des épreuves avec d’autres. Cette formulation française rend cette dimension collective sans ajouter explicitement un compagnon que le grec ne nomme pas.
- source_word: τῷ εὐαγγελίῳ
  choice: pour la bonne nouvelle
  rationale: Le datif dépend du verbe composé et désigne ici la cause à laquelle les souffrances sont associées. « Pour la bonne nouvelle » est naturel en français, tandis qu’une note signale une formulation plus proche de la construction grecque.
- source_word: κατὰ δύναμιν θεοῦ
  choice: selon la puissance de Dieu
  rationale: Cette traduction proche de κατά avec l’accusatif préserve l’ouverture entre norme, mesure et puissance habilitante, sans imposer exclusivement le sens instrumental.
theological_decisions:
- issue: Relation entre « témoignage » et « notre Seigneur »
  choice: Le témoignage au sujet de notre Seigneur
  alternative: Le témoignage de notre Seigneur
  rationale: Le contexte présente vraisemblablement le Seigneur comme le contenu du témoignage chrétien. La possibilité que le témoignage soit celui que rend le Seigneur demeure cependant grammaticalement réelle et figure en note.
- issue: Portée de « son prisonnier »
  choice: 'Maintenir le possessif : « son prisonnier »'
  alternative: « prisonnier à cause de lui » ou « prisonnier pour lui »
  rationale: Le possessif conserve l’idée d’appartenance ou d’association avec le Seigneur et laisse ouverte la nuance exacte du génitif, au lieu de la ramener uniquement à la cause de l’emprisonnement.
- issue: Rapport des souffrances à la puissance divine
  choice: « selon la puissance de Dieu »
  alternative: « par la puissance de Dieu »
  rationale: 'La traduction retenue préserve la souplesse de κατά : la puissance divine peut définir la mesure ou la norme de cette participation, tout en pouvant aussi être comprise comme ce qui la rend possible.'
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Bonne nouvelle » rend εὐαγγέλιον de façon transparente pour le grand public; la formulation évite à la fois l’archaïsme et la paraphrase doctrinale. La seconde phrase souligne naturellement le contraste introduit par ἀλλά.
