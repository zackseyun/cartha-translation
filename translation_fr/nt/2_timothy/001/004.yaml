  text: désirant vivement te voir, me souvenant de tes larmes, afin d’être rempli de joie,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: désirant vivement
  rationale: Le participe présent exprime un désir personnel intense. « Désirant vivement » en restitue la force dans un français naturel et digne.
- source_word: σε ἰδεῖν
  choice: te voir
  rationale: L’infinitif complète directement le verbe de désir; « te voir » est la formulation française la plus simple et exacte.
- source_word: μεμνημένος
  choice: me souvenant
  rationale: Le participe parfait décrit un souvenir qui demeure présent à l’esprit. « Me souvenant » s’intègre naturellement à la suite participiale.
- source_word: σου τῶν δακρύων
  choice: de tes larmes
  rationale: Le génitif désigne directement les larmes de Timothée; cette traduction évite d’interpréter davantage la scène.
- source_word: ἵνα
  choice: afin de
  rationale: La conjonction introduit ici la visée liée au fait de revoir Timothée. La tournure infinitive française préserve ce rapport de finalité avec fluidité.
- source_word: χαρᾶς
  choice: de joie
  rationale: Avec πληρόω, le génitif indique ce dont Paul serait rempli; « rempli de joie » est l’expression idiomatique française.
- source_word: πληρωθῶ
  choice: être rempli
  rationale: L’aoriste passif subjonctif dépend de ἵνα. L’infinitif « être rempli », après « afin de », rend naturellement en français cette construction sans changer le sujet.
