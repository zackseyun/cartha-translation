  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: fr
  text: C’est pour cela que j’ai été établi comme proclamateur, apôtre et enseignant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ὃ
  choice: C’est pour cela que
  rationale: La tournure renvoie naturellement en français à l’Évangile mentionné dans le contexte précédent et exprime la raison ou la mission en vue de laquelle Paul a été établi.
- source_word: ἐτέθην
  choice: j’ai été établi
  rationale: Dans cette énumération de fonctions, le passif de τίθημι exprime une désignation ou une nomination, non un placement physique. « Établi » garde un registre digne et actuel.
- source_word: ἐγὼ
  choice: j’ai
  rationale: Le pronom grec explicite met Paul en relief. En français, le sujet obligatoire et la structure de la phrase rendent cette référence sans recourir à l’emphatique « moi-même », qui serait excessif ici.
- source_word: κῆρυξ
  choice: proclamateur
  rationale: κῆρυξ désigne un héraut chargé d’une proclamation publique. « Proclamateur » communique clairement la fonction tout en évitant les connotations historiques ou archaïques que peut avoir « héraut ».
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Dans la manière dont Paul parle de sa propre mission, le terme fonctionne comme le titre reconnu d’« apôtre », plutôt que comme le simple sens général de messager ou d’envoyé.
- source_word: διδάσκαλος
  choice: enseignant
  rationale: Le mot désigne celui qui enseigne. « Enseignant » est naturel en français moderne et s’intègre bien à la série des fonctions.
theological_decisions:
- issue: Rendre κῆρυξ par un terme ecclésial traditionnel ou par un terme soulignant la proclamation officielle
  choice: proclamateur
  alternative: prédicateur ; héraut
  rationale: « Proclamateur » met en avant la mission publique et mandatée exprimée par κῆρυξ, sans réduire le rôle à la prédication ecclésiale ultérieure. « Héraut » serait plus formel, mais moins immédiatement transparent pour certains lecteurs modernes.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve les trois fonctions parallèles et le renvoi au contexte précédent sans explicitation interprétative supplémentaire.
