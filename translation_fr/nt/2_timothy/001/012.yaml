  terminology: « À qui j’ai fait confiance », « mon dépôt » et « garder » rendent correctement le grec tout en conservant les ambiguïtés pertinentes. Dans la note c, « justification » risque d’évoquer plus étroitement une doctrine technique que la vindication/réhabilitation; « réhabilitation » est préférable.
