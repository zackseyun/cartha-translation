  rationale: La révision restitue explicitement l’objet démonstratif de ταῦτα et place l’idée de « aussi » avec le fait de souffrir. Elle conserve le référent personnel implicite, la métaphore ambiguë de la παραθήκη et la portée eschatologique de « ce jour-là ».
