source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: fr
  text: C’est pour cette raison que je souffre moi aussi de tout cela. Mais je n’ai pas honte, car je sais à qui j’ai fait confiance[a], et je suis convaincu qu’il est capable de garder mon dépôt[b] jusqu’à ce jour-là[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en qui j’ai cru » ou « en qui j’ai mis ma foi ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « dépôt » désigne quelque chose remis à la garde de quelqu’un. Il peut s’agir de ce que Paul a confié à Dieu, ou de ce qui a été confié à Paul.
    reason: alternative_reading
  - marker: c
    text: C’est-à-dire le jour futur du jugement final et de la réhabilitation par Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: C’est aussi pour cette raison
  rationale: Cette tournure française naturelle conserve le lien causal avec le contexte. « Aussi » rend καί sans alourdir la phrase.
- source_word: ταῦτα πάσχω
  choice: je souffre ainsi
  rationale: πάσχω exprime le fait de souffrir ou d’endurer des épreuves. « Ainsi » renvoie aux souffrances évoquées dans le contexte sans les préciser au-delà du grec.
- source_word: οὐκ ἐπαισχύνομαι
  choice: je n’ai pas honte
  rationale: C’est l’expression française courante correspondant ici à l’attitude personnelle de Paul face à ses souffrances.
- source_word: οἶδα
  choice: je sais
  rationale: Bien que la forme grecque soit morphologiquement un parfait, elle a ici une valeur présente et stative.
- source_word: ᾧ πεπίστευκα
  choice: à qui j’ai fait confiance
  rationale: Le datif avec πιστεύω peut exprimer la foi ou la confiance placée en une personne. Cette formulation est idiomatique et garde le référent personnel sans le nommer.
- source_word: πέπεισμαι
  choice: je suis convaincu
  rationale: 'Le parfait passif a ici une valeur résultative présente : Paul demeure dans un état de conviction assurée.'
- source_word: δυνατός ἐστιν
  choice: il est capable
  rationale: Cette expression rend directement la capacité affirmée par le grec, tout en gardant implicite l’identité précise du référent.
- source_word: τὴν παραθήκην μου
  choice: mon dépôt
  rationale: παραθήκη désigne ce qui est remis à quelqu’un pour être gardé. « Mon dépôt » conserve la métaphore ainsi que l’ambiguïté du possessif sur le sens de la remise.
- source_word: φυλάξαι
  choice: garder
  rationale: Le verbe convient au vocabulaire d’un dépôt confié à la garde de quelqu’un et peut inclure les idées de protection et de préservation.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: jusqu’à ce jour-là
  rationale: La formulation rend naturellement l’orientation temporelle vers le jour eschatologique sans ajouter d’explication dans le texte principal.
theological_decisions:
- issue: Référent de ᾧ (« à qui ») et sujet implicite de « il est capable »
  choice: 'Le texte garde un référent personnel implicite : « à qui » puis « il ».'
  alternative: Nommer explicitement Dieu ou Jésus-Christ.
  rationale: Le contexte oriente vers Dieu connu en Christ, mais la proposition grecque ne nomme pas le référent. La traduction respecte ce degré de précision.
- issue: Sens de παραθήκην μου
  choice: La métaphore ambiguë est conservée par « mon dépôt ».
  alternative: Traduire soit « ce que j’ai confié à Dieu », soit « ce qui m’a été confié ».
  rationale: Le grec peut désigner ce que Paul a remis à la garde de Dieu ou ce qui a été confié à Paul, notamment l’Évangile ou son ministère. Le texte principal ne tranche pas cette question.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que « mon dépôt » conserve volontairement la métaphore et l’ambiguïté du grec; la note en explique les deux lectures principales.
