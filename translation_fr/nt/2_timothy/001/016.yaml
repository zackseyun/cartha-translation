id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: fr
  text: Que le Seigneur accorde sa miséricorde à la maisonnée d’Onésiphore, car il m’a souvent réconforté et n’a pas eu honte de ma chaîne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mon emprisonnement » ; littéralement « de ma chaîne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Que … accorde
  rationale: L’optatif aoriste exprime ici un souhait ou une prière; cette tournure française le rend naturellement.
- source_word: ἔλεος
  choice: compassion
  rationale: Dans ce souhait de bénédiction, « compassion » exprime clairement la faveur secourable demandée au Seigneur.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Le titre divin est conservé sans préciser son référent au-delà du grec.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: à la famille d’Onésiphore
  rationale: οἶκος désigne vraisemblablement ici le groupe familial ou domestique, plutôt qu’un bâtiment; « famille » est naturel et accessible en français moderne.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison du souhait; « car » convient au registre digne de la phrase.
- source_word: πολλάκις
  choice: souvent
  rationale: Rendu français direct et naturel de la répétition.
- source_word: ἀνέψυξεν
  choice: m’a souvent réconforté
  rationale: Le verbe évoque le soulagement ou le rafraîchissement apporté à quelqu’un; « réconforté » communique naturellement l’aide personnelle reçue dans ce contexte.
- source_word: τὴν ἅλυσίν μου
  choice: ma chaîne
  rationale: Le singulier concret est préservé dans le texte, tout en signalant en note son sens métonymique probable.
- source_word: οὐκ ἐπαισχύνθη
  choice: n’a pas eu honte
  rationale: Cette expression restitue clairement la portée morale et sociale du verbe grec.
theological_decisions:
- issue: Référent de « le Seigneur » dans le souhait de bénédiction
  choice: Conserver « le Seigneur » sans autre précision.
  alternative: Identifier explicitement le Seigneur à Dieu le Père ou au Seigneur Jésus.
  rationale: Le grec dit seulement ὁ κύριος; la traduction maintient donc l’ambiguïté du texte au lieu de la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, naturel et digne. Le souhait est formulé avec « Que … accorde ». « Famille » privilégie l’intelligibilité courante, tandis que « chaîne » conserve l’image concrète du grec.
