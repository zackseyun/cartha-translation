  text: but when he was in Rome[a], he searched for me diligently and found me—
translation:
  language: fr
  text: mais, une fois à Rome[a], il m’a recherché avec empressement et m’a trouvé—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand il est venu à Rome » ou, plus formellement, « se trouvant à Rome ». Le participe grec γενόμενος permet plusieurs formulations idiomatiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Conjonction adversative qui oppose la conduite d’Onésiphore à celle évoquée dans le contexte précédent.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: une fois à Rome
  rationale: Cette tournure française naturelle exprime sa présence à Rome tout en laissant ouverte la nuance d’arrivée que peut porter le participe γενόμενος.
- source_word: σπουδαίως
  choice: avec empressement
  rationale: L’adverbe indique un effort zélé, sérieux et soutenu; « avec empressement » convient à la recherche active d’une personne.
- source_word: ἐζήτησέν με
  choice: il m’a recherché
  rationale: ζητέω désigne ici l’action de chercher quelqu’un; « rechercher » exprime clairement l’effort intentionnel.
- source_word: καὶ εὗρεν
  choice: et m’a trouvé
  rationale: La formulation reprend naturellement le complément « me » sous la forme élidée « m’ » et présente l’aboutissement de la recherche.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Une fois à Rome » préserve la souplesse du participe grec sans affirmer de manière trop précise soit l’arrivée, soit la simple présence. Le tiret final maintient la continuité syntaxique avec le verset suivant.
