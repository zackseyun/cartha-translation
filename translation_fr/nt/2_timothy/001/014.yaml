  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: fr
  text: Garde le bon dépôt[a], par l’Esprit Saint qui habite en nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le noble dépôt » ou « ce qui t’a été confié ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au moyen de l’Esprit Saint qui vit en nous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: le beau dépôt qui t’a été confié
  rationale: « Dépôt » conserve la métaphore de ce qui est remis à quelqu’un pour être gardé. L’explicitation « qui t’a été confié » rend ce sens immédiatement compréhensible en français, tandis que « beau » restitue naturellement καλός dans cette expression sans réduire sa portée à la seule valeur matérielle.
- source_word: φύλαξον
  choice: Garde
  rationale: L’impératif appelle Timothy à préserver activement ce qui lui a été confié. En français biblique courant, « garder » exprime à la fois la conservation et la vigilance sans suggérer seulement une défense physique.
- source_word: διὰ πνεύματος ἁγίου
  choice: par l’Esprit Saint
  rationale: διά suivi du génitif marque ici le moyen ou l’agent. « Par » rend cette relation avec naturel et concision en français.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: qui habite en nous
  rationale: Le participe présent décrit la présence continue de l’Esprit. « Habite en nous » est idiomatique, actuel et évite un terme théologique technique.
theological_decisions:
- issue: Référent du « beau dépôt »
  choice: Le texte garde l’image générale du dépôt confié sans identifier explicitement celui-ci à l’Évangile ou au ministère de Timothée.
  alternative: Traduire interprétativement par « le bon message qui t’a été confié » ou « la mission qui t’a été confiée ».
  rationale: Le contexte oriente vers l’enseignement apostolique confié à Timothée, mais la formulation grecque demeure compacte et métaphorique. La traduction ne tranche donc pas ce que le texte ne précise pas ici.
- issue: Portée du pronom « nous »
  choice: Conserver « en nous » sans en préciser les personnes visées.
  alternative: Comprendre « nous » comme Paul et Timothée seulement, ou comme l’ensemble des croyants.
  rationale: Le pronom grec permet de laisser ouverte la portée immédiate ou plus générale de cette présence de l’Esprit.
- issue: Valeur de διά dans « par l’Esprit Saint »
  choice: Présenter l’Esprit Saint comme le moyen ou l’agent par lequel le dépôt est gardé.
  alternative: « Avec l’aide de l’Esprit Saint » ou « grâce à l’Esprit Saint ».
  rationale: « Par » préserve sobrement l’éventail instrumental et agentif de διά sans préciser davantage le mode d’action de l’Esprit.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure concise. « Beau dépôt » conserve la densité de l’expression grecque, tandis que l’ajout explicatif « qui t’a été confié » en clarifie la métaphore pour un lectorat ordinaire.
