id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: fr
  text: 'Tu le sais : tous ceux qui sont en Asie[a] se sont détournés de moi[b], parmi lesquels Phygèle et Hermogène.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Asie » désigne la province romaine située dans l’ouest de l’Asie Mineure, et non le continent appelé aujourd’hui l’Asie.
    reason: cultural_note
  - marker: b
    text: 'Autres traductions possibles : « m’ont délaissé » ou « m’ont abandonné ». Le grec dit plus littéralement qu’ils « se sont détournés de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: 'Tu le sais :'
  rationale: Οἶδας exprime ici un savoir présent. Le pronom « le » reprend naturellement en français le fait annoncé par la proposition suivante, et les deux-points rendent avec fluidité la fonction explicative de ὅτι.
- source_word: ἀπεστράφησάν με
  choice: se sont détournés de moi
  rationale: Cette formulation conserve l’image de ἀποστρέφω et son idée de rupture relationnelle ou de retrait du soutien, sans imposer le sens plus précis de « m’ont abandonné ».
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: tous ceux qui sont en Asie
  rationale: La traduction maintient la portée générale de πάντες et la construction locale du grec, tout en laissant le contexte déterminer le groupe visé plutôt que d’ajouter une précision interprétative.
- source_word: Ἀσίᾳ
  choice: Asie
  rationale: Le nom géographique traditionnel est conservé dans le texte ; une note précise qu’il s’agit de la province romaine et non du continent moderne.
- source_word: ὧν ἐστιν
  choice: parmi lesquels
  rationale: 'Cette tournure française naturelle conserve la valeur partitive du relatif : Phygèle et Hermogène appartiennent au groupe précédemment évoqué.'
- source_word: Φύγελος καὶ Ἑρμογένης
  choice: Phygèle et Hermogène
  rationale: Les noms propres suivent leurs formes françaises bibliques usuelles.
theological_decisions:
- issue: Portée de « tous ceux qui sont en Asie »
  choice: Conserver « tous » sans préciser dans le texte l’étendue exacte du groupe concerné.
  alternative: Limiter explicitement l’expression aux collaborateurs ou aux soutiens déclarés de Paul, ou la comprendre comme visant absolument chaque chrétien de la province.
  rationale: πάντες a une force englobante, mais sa portée peut être délimitée par le contexte. La traduction préserve donc l’ampleur et la tension de la plainte de Paul sans l’élargir ni l’atténuer par une précision absente du grec.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement convient à l’adresse personnelle de Paul à Timothée. La phrase garde la vigueur de l’affirmation grecque tout en restant naturelle à l’oral comme à l’écrit.
