id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: fr
  text: lui qui nous a sauvés et nous a appelés d’un appel saint[a], non selon nos œuvres, mais selon son propre dessein et sa grâce, qui nous a été donnée en Jésus, le Messie[b], avant les temps éternels[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un appel saint » ou « à un appel saint ». Le datif grec peut se comprendre de plusieurs manières.
    reason: lexical_alternative
  - marker: b
    text: Ou « en Jésus-Christ ». Ici, « le Messie » traduit Χριστός comme un titre.
    reason: alternative_reading
  - marker: c
    text: Ou « avant les âges éternels » ; plus couramment, « avant le commencement des temps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: nous a sauvés
  rationale: Le verbe « sauver » est le terme français usuel qui conserve ici toute la portée sotériologique de σῴζω.
- source_word: καλέσαντος
  choice: nous a appelés
  rationale: « Appeler » maintient le parallélisme avec « sauver » et la résonance théologique de l’appel divin chez Paul.
- source_word: κλήσει ἁγίᾳ
  choice: d’un appel saint
  rationale: Cette tournure conserve le lien étroit entre le verbe « appeler » et le nom « appel », tout en évitant de réduire sans note le datif grec à une seule valeur précise.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: non selon nos œuvres
  rationale: « Selon » suit la valeur de norme ou de fondement de κατά, tandis que « œuvres » préserve un terme paulinien important.
- source_word: ἰδίαν πρόθεσιν
  choice: son propre dessein
  rationale: « Dessein » exprime une intention arrêtée et convient au registre théologique sans suggérer un simple projet humain.
- source_word: χάριν
  choice: grâce
  rationale: « Grâce » est l’équivalent français établi de χάρις dans ce contexte paulinien.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: qui nous a été donnée
  rationale: Le féminin grec rattache explicitement le participe à « grâce »; la proposition relative française rend clairement cet accord.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: Χριστός est rendu selon son sens de titre, « Messie », tandis que ἐν est conservé par « dans » afin de ne pas expliciter abusivement la relation théologique.
- source_word: πρὸ χρόνων αἰωνίων
  choice: avant les temps éternels
  rationale: La formulation garde l’expression grecque inhabituelle et sa tension, plutôt que de l’aplanir directement en « avant le commencement du temps ».
theological_decisions:
- issue: Valeur du datif κλήσει ἁγίᾳ
  choice: d’un appel saint
  alternative: par un appel saint ; à un appel saint
  rationale: Le datif peut indiquer le moyen, la manière ou éventuellement la destination. Le texte principal reste proche de la construction grecque et la note expose les principales compréhensions.
- issue: Valeur de Χριστός dans ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: en Christ Jésus
  rationale: La traduction du titre rend le sens de Χριστός plutôt que de le traiter comme un simple élément de nom propre.
- issue: Portée temporelle de πρὸ χρόνων αἰωνίων
  choice: avant les temps éternels
  alternative: avant les âges éternels ; avant le commencement des temps
  rationale: La formulation littérale conserve l’étrangeté et l’ampleur de l’expression grecque; les équivalents plus idiomatiques sont signalés sans imposer une seule conception du temps.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste volontairement proche du grec dans « d’un appel saint » et « avant les temps éternels » afin de préserver les ambiguïtés réelles; les formulations françaises plus explicites ou idiomatiques figurent en notes.
