language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: fr
  text: Que le Seigneur lui accorde de trouver miséricorde auprès du Seigneur en ce jour-là[a] ! Et tous les services qu’il a rendus à Éphèse, tu les connais mieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ce jour-là » est une expression courante du Nouveau Testament pour désigner le jour futur du jugement ou de la justification.
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « tu connais mieux ». Le terme de comparaison n’est pas exprimé en grec. On peut aussi comprendre : « tu le sais très bien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Que le Seigneur lui accorde
  rationale: L’optatif aoriste exprime un souhait ou une prière. « Que… accorde » restitue naturellement cette valeur en français et s’accorde avec l’infinitif qui suit.
- source_word: εὑρεῖν ἔλεος
  choice: de trouver miséricorde
  rationale: Cette formulation conserve l’image et l’idiome grecs, tout en restant intelligible dans un registre biblique actuel et digne.
- source_word: παρὰ κυρίου
  choice: auprès du Seigneur
  rationale: Avec le génitif, παρά peut évoquer la provenance ou la proximité personnelle. « Auprès du Seigneur » préserve ici cette latitude mieux que « de la part du Seigneur », qui imposerait nettement la seule idée de source.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: en ce jour-là
  rationale: Formulation française idiomatique qui conserve l’allusion eschatologique sans l’expliciter au-delà du grec.
- source_word: ὅσα ἐν Ἐφέσῳ διηκόνησεν
  choice: tous les services qu’il a rendus à Éphèse
  rationale: Le relatif neutre pluriel résume l’ensemble ou l’étendue de son activité de service. « Services qu’il a rendus » communique concrètement διακονέω sans lui donner d’office ecclésiastique technique.
- source_word: βέλτιον σὺ γινώσκεις
  choice: tu les connais mieux que moi
  rationale: Le comparatif βέλτιον appelle naturellement en français un terme de comparaison. « Que moi » rend explicite la comparaison contextuellement implicite, tandis que la note signale la forme plus stricte.
theological_decisions:
- issue: Référence des deux emplois de κύριος
  choice: Les deux sont rendus par « le Seigneur », sans distinguer leurs référents.
  alternative: Le premier désignerait le Christ et le second le Père, ou les deux désigneraient le Christ.
  rationale: Le grec répète κύριος sans identifier deux référents distincts. La traduction maintient donc cette ambiguïté théologique.
- issue: Portée eschatologique de « ce jour-là »
  choice: Conserver « ce jour-là » sans ajout explicatif dans le texte.
  alternative: « Le jour du jugement » ou « le dernier jour ».
  rationale: L’expression renvoie vraisemblablement au jour futur du jugement ou de la manifestation divine, mais le texte ne le nomme pas plus précisément.
- issue: Nature de la miséricorde demandée pour Onésiphore
  choice: Ne pas préciser si elle concerne le jugement final, une délivrance particulière ou son état après la mort.
  alternative: Interpréter explicitement la demande comme une prière pour un défunt ou comme une bénédiction pour un croyant encore vivant.
  rationale: Le verset ne précise ni la situation vitale d’Onésiphore ni la nature exacte de la miséricorde attendue. Une traduction ne doit pas trancher ce débat.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Seigneur » est conservée. « Trouver miséricorde » maintient l’idiome biblique sans devenir archaïque. L’explicitation « que moi » rend le comparatif naturel en français, avec la formulation littérale indiquée en note.
