id: 2TI.1.7
reference: 2 Timothy 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: fr
  text: Car Dieu ne nous a pas donné un esprit de lâcheté[a], mais de puissance, d’amour et de maîtrise de soi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « timidité » ou « peur » ; le terme grec désigne plus précisément un manque honteux de courage qu’une peur ordinaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « jugement sain » ou « discipline personnelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car ... ne ... pas
  rationale: « Car » conserve la fonction explicative de γάρ et relie naturellement le verset à l’exhortation précédente ; la négation française encadre le verbe.
- source_word: ἔδωκεν
  choice: a donné
  rationale: L’aoriste indicatif est rendu naturellement par le passé composé, temps courant en français moderne pour une action passée pertinente dans le présent.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom datif est exprimé idiomatiquement comme complément d’objet indirect placé avant le verbe.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: En français, le nom « Dieu » s’emploie ici sans article.
- source_word: πνεῦμα
  choice: un esprit
  rationale: Le nom sans article, qualifié par des génitifs contrastés, décrit ici le caractère ou la disposition de l’esprit donné par Dieu sans imposer explicitement la lecture « l’Esprit ».
- source_word: δειλίας
  choice: lâcheté
  rationale: δειλία désigne une peur honteuse ou un manque de courage, et non la peur au sens général ; « lâcheté » en conserve la forte nuance négative.
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » rend directement l’opposition forte entre les deux membres.
- source_word: δυνάμεως
  choice: puissance
  rationale: « Puissance » est l’équivalent direct de δύναμις et convient à la série de qualités décrites.
- source_word: ἀγάπης
  choice: amour
  rationale: « Amour » est le terme moderne, naturel et usuel pour ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: maîtrise de soi
  rationale: Le terme rare σωφρονισμός évoque à la fois la pondération, la discipline personnelle et le contrôle de soi ; « maîtrise de soi » est clair et naturel, tandis que d’autres nuances sont signalées en note.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: « un esprit », compris sans identification explicite à l’Esprit Saint
  alternative: « l’Esprit »
  rationale: La construction grecque anarthre et les génitifs qualificatifs favorisent une description de l’esprit ou de la disposition que Dieu donne. Cette formulation n’exclut pas l’action de l’Esprit Saint, mais évite de préciser le référent au-delà de ce qu’impose la syntaxe.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve la structure contrastive et la série ternaire du grec. « Lâcheté » garde la vigueur morale du terme source ; « maîtrise de soi » privilégie la clarté tout en maintenant en note l’étendue sémantique de σωφρονισμός.
