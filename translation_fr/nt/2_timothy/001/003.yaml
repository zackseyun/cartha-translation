  terminology: « Servir », « conscience pure », « ancêtres » et « prières » sont appropriés. La note sur λατρεύω conserve utilement l’alternative « adorer ». La note sur ἀπὸ προγόνων maintient la valeur littérale et l’idée de continuité sans imposer une interprétation doctrinale.
