reference: 2 Timothy 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: fr
  text: Je remercie Dieu, que je sers avec une conscience pure, comme l’ont fait mes ancêtres[b], alors que je me souviens constamment de toi dans mes prières[c], nuit et jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « dans la tradition de mes ancêtres » ; plus littéralement, « depuis mes ancêtres ». L’expression marque une continuité avec leur foi et leur service de Dieu.
    reason: lexical_alternative
  - marker: c
    text: Plus littéralement, « j’ai constamment le souvenir de toi dans mes prières ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Je remercie Dieu
  rationale: L’expression idiomatique χάριν ἔχω suivie du datif exprime la reconnaissance adressée à quelqu’un. « Je remercie Dieu » est direct et naturel en français.
- source_word: ᾧ λατρεύω
  choice: que je sers
  rationale: λατρεύω désigne le service religieux rendu à Dieu et peut aussi se traduire par « adorer ». « Servir » conserve ici l’idée large d’un dévouement actif et cultuel.
- source_word: ἀπὸ προγόνων
  choice: comme l’ont fait mes ancêtres
  rationale: La formulation exprime vraisemblablement une continuité avec la foi et le service des générations antérieures. Cette traduction rend cette continuité dans un français naturel sans en préciser davantage la nature.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: avec une conscience pure
  rationale: La préposition indique ici la manière de servir. « Conscience pure » rend fidèlement καθαρά tout en restant clair et digne en français moderne.
- source_word: ὡς
  choice: tandis que
  rationale: ὡς relie l’action de grâce au souvenir constant de Timothée. « Tandis que » maintient ce lien circonstanciel sans imposer une relation strictement causale.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: je me souviens constamment de toi
  rationale: Littéralement, Paul « a un souvenir constant au sujet de » Timothée. La tournure choisie restitue naturellement le sens en français.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: dans mes prières
  rationale: δέησις désigne plus précisément une prière de demande, mais « prières » est ici la formulation française la plus naturelle.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: nuit et jour
  rationale: Cette expression idiomatique indique la régularité continuelle de la prière.
theological_decisions:
- issue: Rapport de Paul à son héritage ancestral dans ἀπὸ προγόνων
  choice: Paul présente son service de Dieu comme étant dans la continuité de celui de ses ancêtres.
  alternative: « depuis mes ancêtres » ou « dans la tradition de mes ancêtres »
  rationale: « Comme l’ont fait mes ancêtres » exprime la continuité avec la foi ancestrale sans suggérer que Paul renie l’héritage d’Israël ni définir doctrinalement la nature exacte de cette continuité.
- issue: Portée de λατρεύω
  choice: servir
  alternative: adorer
  rationale: Le verbe peut désigner l’adoration ou le service cultuel rendu à Dieu. « Servir » préserve son étendue sémantique et évite de le limiter aux actes formels d’adoration.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure continue du grec tout en ordonnant les compléments de façon intelligible. « Conscience pure » garde le registre moral du texte sans archaïsme marqué.
