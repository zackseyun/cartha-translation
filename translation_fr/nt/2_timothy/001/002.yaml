id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: fr
  text: 'À Timothée, enfant bien-aimé : grâce, miséricorde et paix de la part de Dieu le Père et du Messie Jésus[a], notre Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ Jésus ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en exprimer le sens plutôt que de conserver sa translittération traditionnelle.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητῷ
  choice: bien-aimé
  rationale: « Bien-aimé » conserve à la fois l’affection et la gravité de l’adresse, tout en s’accordant naturellement avec « enfant ».
- source_word: τέκνῳ
  choice: enfant
  rationale: Le terme désigne ici une relation filiale ou une descendance spirituelle sans signifier spécifiquement « fils ».
- source_word: χάρις
  choice: grâce
  rationale: Équivalent français établi du terme paulinien, qui en préserve la portée théologique.
- source_word: ἔλεος
  choice: miséricorde
  rationale: Ce choix maintient ce souhait distinct de la grâce et de la paix, avec un registre digne et courant dans le langage biblique français.
- source_word: εἰρήνη
  choice: paix
  rationale: Équivalent direct qui conserve les résonances relationnelles et bibliques du terme.
- source_word: ἀπὸ
  choice: de la part de
  rationale: Dans une salutation, cette formulation française exprime naturellement Dieu et Jésus comme la source des bienfaits souhaités.
- source_word: θεοῦ πατρὸς
  choice: Dieu le Père
  rationale: Le grec ne comporte pas ici de possessif équivalant à « notre » devant « Père ».
- source_word: Χριστοῦ
  choice: Messie
  rationale: « Messie » traduit le sens du titre grec Χριστός au lieu de le conserver seulement sous sa forme traditionnelle translittérée.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » rend l’autorité exprimée par κύριος et en conserve la portée christologique.
theological_decisions:
- issue: Traduction de Χριστοῦ Ἰησοῦ
  choice: Messie Jésus
  alternative: Christ Jésus
  rationale: Χριστός garde ici sa valeur de titre. « Messie » en communique le sens, tandis que la forme traditionnelle « Christ Jésus » est signalée en note.
- issue: Rapport filial exprimé par τέκνῳ
  choice: enfant
  alternative: fils
  rationale: « Enfant » préserve la métaphore de la filiation spirituelle sans ajouter au nom grec une précision de genre qu’il ne porte pas lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. La construction épistolaire concise est conservée, tandis que « de la part de » rend la provenance de manière idiomatique. Le possessif « mon » n’est pas ajouté devant « enfant », puisqu’il est absent du grec.
