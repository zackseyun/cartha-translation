  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: fr
  text: corrigeant avec douceur ceux qui s’opposent[a], peut-être que Dieu leur accordera la repentance pour parvenir à la connaissance de la vérité[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui s’opposent à lui » ; le grec ne précise pas l’objet de leur opposition, mais le contexte renvoie au serviteur du Seigneur et à son enseignement.
    reason: lexical_alternative
  - marker: b
    text: Ou « peut-être que Dieu leur accordera de se repentir, afin qu’ils parviennent à la connaissance de la vérité ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: avec douceur
  rationale: La locution exprime la manière de corriger. « Avec douceur » est naturel en français moderne et rend πραΰτης sans suggérer faiblesse ou passivité.
- source_word: παιδεύοντα
  choice: corrigeant
  rationale: Dans ce contexte, παιδεύω désigne une instruction corrective plutôt qu’une punition; « corrigeant » convient au rapport avec les opposants tout en gardant la visée pédagogique.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: ceux qui s’opposent
  rationale: Le participe désigne ceux qui se placent dans l’opposition. Le grec n’exprime pas l’objet de cette opposition; la formulation française conserve cette absence plutôt que d’ajouter « à lui ».
- source_word: μήποτε
  choice: dans l’espoir que… peut-être
  rationale: Avec le subjonctif aoriste δώῃ, μήποτε exprime ici une éventualité envisagée dans la démarche de correction. La formulation préserve cette contingence sans transformer la phrase en simple affirmation.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: Dieu leur accordera
  rationale: Dans cette construction, δίδωμι a le sens idiomatique d’« accorder ». Le futur français s’insère après « dans l’espoir que », tandis que « peut-être » porte explicitement la nuance éventuelle de μήποτε.
- source_word: μετάνοιαν
  choice: la repentance
  rationale: « Repentance » est le terme français établi dans ce contexte biblique et inclut un changement intérieur accompagné d’un retournement, sans réduire μετάνοια à une simple révision intellectuelle.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: qui conduit à la connaissance de la vérité
  rationale: εἰς marque ici le but ou le résultat. Cette formulation exprime le mouvement vers une pleine reconnaissance de la vérité dans un français naturel.
theological_decisions:
- issue: Action divine et repentance humaine
  choice: Dieu est présenté comme celui qui peut accorder la repentance, tout en maintenant le caractère éventuel exprimé par μήποτε.
  alternative: Renforcer une lecture déterministe, ou au contraire atténuer l’action de Dieu dans la repentance.
  rationale: Le grec attribue explicitement à Dieu le don de la repentance, mais ne définit pas ici l’articulation complète entre l’action divine et la réponse humaine. La traduction conserve cette tension.
- issue: Objet de l’opposition
  choice: Ne pas ajouter d’objet explicite après « s’opposent ».
  alternative: « ceux qui s’opposent à lui » ou « ceux qui s’opposent au serviteur du Seigneur et à son enseignement ».
  rationale: Le contexte permet de comprendre l’opposition, mais le participe grec n’en précise pas grammaticalement l’objet. La traduction principale préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste liée au participe du contexte précédent. « Repentance » est conservé comme terme biblique précis et largement reconnu; les notes signalent l’objet implicite de l’opposition et l’éventualité portée par μήποτε.
