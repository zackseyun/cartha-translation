id: 2TI.2.12
reference: 2 Timothy 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: fr
  text: Si nous persévérons, nous régnerons aussi avec lui ; si nous le renions[a], lui aussi nous reniera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le désavouons » / « lui aussi nous désavouera ».
    reason: Alternative lexicale possible pour ἀρνέομαι, dont le sens couvre le fait de renier, désavouer ou répudier.
lexical_decisions:
- source_word: ὑπομένομεν
  choice: persévérons
  rationale: Dans ce contexte, ὑπομένω désigne le fait de tenir ferme dans l’épreuve ou la souffrance. « Persévérons » est naturel en français et exprime cette endurance fidèle sans ajouter de précision doctrinale.
- source_word: συμβασιλεύσομεν
  choice: nous régnerons aussi avec lui
  rationale: Le verbe composé signifie « régner avec ». Le pronom « lui », implicite en grec mais clairement fourni par le contexte christologique, est nécessaire à une formulation française naturelle. « Régner » conserve l’imagerie royale.
- source_word: ἀρνησόμεθα
  choice: nous le renions
  rationale: ἀρνέομαι peut signifier nier, renier ou désavouer. Pour une personne, « renier » est ici plus idiomatique que « nier » et exprime clairement le rejet de la relation avec le Christ. Le complément « le » est fourni par le contexte.
- source_word: κἀκεῖνος
  choice: lui aussi
  rationale: La crase de καὶ ἐκεῖνος marque la correspondance réciproque. « Lui aussi » est idiomatique et garde l’accent porté sur celui qui répond au reniement.
- source_word: ἀρνήσεται ἡμᾶς
  choice: nous reniera
  rationale: La répétition de « renier » reproduit celle du même verbe grec dans les deux propositions et conserve la force rhétorique de l’avertissement.
theological_decisions:
- issue: Portée de l’avertissement dans la seconde proposition conditionnelle
  choice: 'Traduire directement comme un avertissement réel : « si nous le renions, lui aussi nous reniera ».'
  alternative: Comprendre ce reniement comme la seule perte d’une récompense, ou comme une hypothèse sans portée existentielle.
  rationale: Le grec présente deux propositions conditionnelles parallèles et formule un avertissement sévère qui rappelle la tradition des paroles de Jésus sur le fait de renier et d’être renié. La traduction préserve cette tension sans trancher les débats sur l’apostasie, la persévérance ou la récompense.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme conditionnel et la répétition verbale du grec sont conservés. « Persévérer » rend naturellement l’endurance ferme sous l’épreuve ; « renier » convient au rejet d’une personne et maintient la gravité de l’avertissement.
