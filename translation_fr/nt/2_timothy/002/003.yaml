translation:
  language: fr
  text: Prends ta part aux souffrances, comme un bon soldat du Messie Jésus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Supporte avec moi les épreuves comme un bon soldat du Messie Jésus. »'
    reason: Alternative lexicale permettant d’expliciter la participation commune suggérée par le préfixe grec συν-, ainsi que la nuance d’épreuve ou de difficulté.
  - marker: b
    text: 'Grec : « Christ Jésus »; « Messie Jésus » traduit ici Χριστός comme un titre.'
    reason: Signale la formulation grecque traditionnelle et explique la traduction sémantique du titre Χριστός.
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Prends ta part de souffrance
  rationale: Impératif aoriste actif, deuxième personne du singulier. Le préfixe συν- exprime la participation à une souffrance commune. Cette formulation française conserve cette nuance sans ajouter explicitement « avec moi », absent du texte grec immédiat.
- source_word: ὡς
  choice: comme
  rationale: Introduit naturellement en français la comparaison qui décrit la manière de participer à la souffrance.
- source_word: καλὸς
  choice: bon
  rationale: Dans cette association avec « soldat », le mot désigne une qualité digne d’approbation ou l’aptitude au rôle. « Bon » est clair, naturel et sans surinterprétation.
- source_word: στρατιώτης
  choice: soldat
  rationale: Équivalent français ordinaire du terme grec, qui convient également à son emploi métaphorique.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en traduit le sens plutôt que de le traiter comme un simple nom propre.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française usuelle du nom personnel Ἰησοῦς; le génitif grec est rendu par la construction « du Messie Jésus ».
theological_decisions:
- issue: Traduction de Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  alternative: du Christ Jésus
  rationale: La séquence associe un titre christologique au nom personnel. « Messie Jésus » rend la valeur titulaire de Χριστός, tandis que la note conserve la formulation ecclésiale française traditionnelle « Christ Jésus ».
- issue: Participant implicite dans συγκακοπάθησον
  choice: Ne pas préciser « avec moi » dans le texte
  alternative: Supporte avec moi les épreuves
  rationale: Le préfixe συν- indique une participation commune, mais le verbe ne nomme pas ici le partenaire. Le contexte peut suggérer Paul; le texte principal préserve cependant l’indétermination grammaticale.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif « Prends » garde la force de l’exhortation; l’image militaire reste sobre. La formulation évite à la fois un archaïsme comme « souffre avec moi » et l’ajout non explicite d’un partenaire dans le texte principal.
