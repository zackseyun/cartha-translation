id: 2TI.2.17
reference: 2 Timothy 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: fr
  text: et leur discours[a] se propagera[b] comme la gangrène. Parmi eux se trouvent Hyménée et Philète,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur parole » ou « leur message ».
    reason: lexical_alternative
  - marker: b
    text: Plus littéralement, « gagnera du terrain » ; l’expression évoque ici une propagation destructrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: discours
  rationale: Dans le contexte des enseignements trompeurs et des propos profanes (v. 16, 18), le terme désigne ce qu’ils disent et enseignent. « Discours » reste assez large pour ne pas réduire le sens à une parole isolée ni l’identifier exclusivement à un enseignement formalisé.
- source_word: αὐτῶν
  choice: leur
  rationale: 'Le génitif exprime naturellement la possession : il s’agit de leur discours.'
- source_word: ὡς γάγγραινα
  choice: comme la gangrène
  rationale: « Gangrène » est l’équivalent direct de γάγγραινα et conserve l’image médicale d’une atteinte qui s’étend en détruisant les tissus.
- source_word: νομὴν ἕξει
  choice: se propagera
  rationale: L’expression signifie littéralement qu’une chose « aura de l’étendue » ou « trouvera de quoi gagner du terrain ». Avec l’image de la gangrène, « se propagera » en rend clairement le sens sans reproduire un idiome obscur en français.
- source_word: ὧν ἐστιν
  choice: Parmi eux se trouvent
  rationale: 'Cette tournure française naturelle conserve la valeur partitive du relatif grec : les deux hommes nommés appartiennent au groupe évoqué.'
- source_word: Ὑμέναιος
  choice: Hyménée
  rationale: Forme française traditionnelle et intelligible du nom propre grec.
- source_word: Φίλητος
  choice: Philète
  rationale: Forme française traditionnelle et intelligible du nom propre grec.
theological_decisions:
- issue: Portée de l’image de la maladie
  choice: Le discours corrupteur est présenté comme se propageant de manière destructrice.
  alternative: Traduire plus littéralement l’expression νομὴν ἕξει, au risque d’obscurcir le mouvement évoqué.
  rationale: Le verbe français « se propagera » préserve la force de l’avertissement et le développement naturel de l’image de la gangrène, sans préciser davantage la nature ou les effets du faux enseignement que ne le fait le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Discours » convient au contexte polémique sans être familier. La syntaxe reste fluide tout en conservant la comparaison médicale et la construction partitive du grec.
