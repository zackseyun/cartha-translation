source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: fr
  text: Souviens-toi de Jésus, le Messie[a], ressuscité d’entre les morts, de la descendance de David[b], selon mon évangile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ». Le titre grec Χριστός peut se traduire par « Christ » ou « Messie » ; « Messie » met ici en évidence le lien avec la descendance de David.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « de la semence de David ».'
    reason: lexical_alternative
  - marker: c
    text: « Mon évangile » renvoie à l’Évangile que Paul proclame ; le possessif ne signifie pas nécessairement qu’il s’agit d’un évangile différent.
    reason: clarification
lexical_decisions:
- source_word: Μνημόνευε
  choice: Souviens-toi
  rationale: Le présent impératif appelle Timothée à garder continuellement Jésus en mémoire. « Souviens-toi » exprime naturellement en français l’exhortation directe sans alourdir le texte.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus, le Messie
  rationale: Χριστός fonctionne ici comme un titre, particulièrement dans le contexte de la résurrection et de l’ascendance davidique. La tournure appositive « Jésus, le Messie » est claire et idiomatique en français.
- source_word: ἐγηγερμένον
  choice: ressuscité
  rationale: Le participe parfait passif présente Jésus comme ayant été relevé d’entre les morts et demeurant vivant. « Ressuscité » conserve la valeur passive et l’état qui en résulte, avec une formulation française concise.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française usuelle dans les contextes de résurrection rend le mouvement hors du domaine ou du groupe des morts.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: issu de la descendance de David
  rationale: Σπέρμα signifie littéralement « semence », mais désigne ici la lignée généalogique. « Issu de la descendance de David » transmet clairement cette idée en français moderne.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: selon mon Évangile
  rationale: 'Κατά exprime ici la conformité. Le possessif « mon » est conservé sans paraphrase : il désigne l’Évangile confié à Paul et proclamé par lui, non nécessairement un message distinct.'
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: La résurrection et l’ascendance davidique mettent en relief la fonction messianique du titre. Une note conserve l’autre traduction française traditionnelle.
- issue: Valeur du parfait passif ἐγηγερμένον
  choice: ressuscité
  alternative: qui est revenu à la vie
  rationale: « Ressuscité » maintient la voix passive du grec et l’état durable résultant de l’action, sans préciser dans le texte l’agent sous-entendu.
- issue: Sens de « mon Évangile »
  choice: conserver le possessif de Paul
  alternative: l’Évangile que j’annonce
  rationale: Le grec dit littéralement « mon Évangile ». Le texte principal garde cette formulation et la note empêche de l’entendre comme l’affirmation explicite d’un évangile différent.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif reste simple ; les participes sont rendus par des groupes adjectivaux parallèles. « Évangile » prend ici une majuscule pour désigner le message proclamé, tandis que les notes explicitent les principales ambiguïtés lexicales et théologiques sans les résoudre silencieusement.
