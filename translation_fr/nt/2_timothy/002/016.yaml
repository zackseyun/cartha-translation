id: 2TI.2.16
reference: 2 Timothy 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: fr
  text: Mais évite les discours creux et profanes[a], car ceux qui s’y livrent avanceront toujours plus dans l’impiété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bavardages profanes », « les vains bavardages » ou « les paroles creuses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: profanes
  rationale: Le terme désigne ce qui est dépourvu de caractère sacré et marqué par l’irrévérence. « Profanes » conserve ici sa portée religieuse et morale.
- source_word: κενοφωνίας
  choice: discours creux
  rationale: Le mot évoque littéralement une parole vide. « Discours creux » est naturel en français moderne et exprime une parole sans contenu ni valeur.
- source_word: περιΐστασο
  choice: évite
  rationale: L’impératif moyen appelle Timothée à se tenir à l’écart de ces discours. « Évite » rend clairement et sobrement cette injonction.
- source_word: ἐπὶ πλεῖον
  choice: toujours plus dans
  rationale: Cette expression indique une progression vers un degré accru; avec « avancer », « toujours plus dans » rend naturellement l’idée d’aggravation.
- source_word: προκόψουσιν
  choice: avanceront
  rationale: Le verbe signifie progresser ou avancer. Ce choix préserve l’ironie d’une progression dont la direction est mauvaise.
- source_word: ἀσεβείας
  choice: l’impiété
  rationale: « Impiété » exprime l’absence de respect envers Dieu et conserve la portée religieuse du grec sans réduire le terme à une simple immoralité.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec l’exhortation précédente; « Mais » signale nettement cette transition.
theological_decisions:
- issue: La nature des paroles condamnées
  choice: « discours creux et profanes » conserve à la fois leur vacuité et leur caractère irrévérencieux envers ce qui est saint.
  alternative: « bavardages impies » ou « paroles vides de sens »
  rationale: 'Le texte ne vise pas seulement des propos inutiles : βεβήλους leur donne une portée religieuse et morale, tandis que κενοφωνίας souligne leur vide.'
- issue: Le sujet implicite de προκόψουσιν
  choice: « ceux qui s’y livrent » explicite que ce sont les personnes engagées dans ces discours qui avancent dans l’impiété.
  alternative: Faire des « discours » eux-mêmes le sujet de la progression.
  rationale: Le verbe grec est au pluriel sans sujet exprimé, tandis que κενοφωνίας est à l’accusatif et ne peut en être grammaticalement le sujet. L’explicitation française reste minimale et préserve l’ambiguïté sur l’identité précise des personnes.
translation_notes:
  register: Français international moderne, clair et digne. « Discours creux » évite une formulation archaïque, tandis que « profanes » et « impiété » préservent le poids religieux du texte.
