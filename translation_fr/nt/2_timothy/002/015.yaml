  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: fr
  text: Efforce-toi de te présenter devant Dieu comme quelqu’un qui a fait ses preuves, un ouvrier qui n’a pas à rougir et qui manie avec justesse la parole de vérité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui enseigne correctement » ; plus littéralement, « qui coupe droit la parole de vérité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Efforce-toi
  rationale: L’impératif appelle un effort sérieux et résolu. « Efforce-toi » est naturel en français moderne et conserve cette force sans suggérer seulement une disposition intérieure.
- source_word: σεαυτὸν … παραστῆσαι τῷ θεῷ
  choice: de te présenter devant Dieu
  rationale: La tournure rend le pronom réfléchi et l’idée de se placer devant Dieu en vue de son évaluation ou de son service. « Devant Dieu » exprime ici naturellement le datif grec.
- source_word: δόκιμον
  choice: comme un homme qui a fait ses preuves
  rationale: δόκιμος désigne celui qui, ayant été éprouvé, est reconnu valable. Cette formulation conserve à la fois l’épreuve et l’approbation implicite, tout en s’accordant avec le destinataire masculin singulier.
- source_word: ἐργάτην ἀνεπαίσχυντον
  choice: un ouvrier qui n’a pas à rougir
  rationale: « Ouvrier » préserve la métaphore du travail. « Qui n’a pas à rougir » indique l’absence de motif de honte plutôt qu’une simple attitude subjective.
- source_word: ὀρθοτομοῦντα
  choice: qui expose avec justesse
  rationale: Le verbe signifie littéralement « couper droit » et, métaphoriquement dans ce contexte, traiter ou communiquer correctement le message. « Expose avec justesse » reste assez large pour ne pas limiter le sens au seul enseignement formel.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: la parole de vérité
  rationale: Cette traduction conserve la construction grecque et sa résonance paulinienne, tout en restant claire en français.
theological_decisions:
- issue: Sens de ὀρθοτομοῦντα dans le contexte du ministère
  choice: expose avec justesse la parole de vérité
  alternative: enseigne correctement la parole de vérité ; littéralement, coupe droit la parole de vérité
  rationale: Le participe évoque une manière droite et exacte de traiter le message, sans préciser exclusivement une seule activité ministérielle. Le texte principal emploie donc une formulation large, tandis que la note maintient l’image littérale et l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier correspond à l’adresse personnelle faite à Timothée. La formulation évite un calque obscur de l’image de « couper droit », tout en la conservant en note.
