reference: 2 Timothy 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: fr
  text: Aucun soldat ne s’embarrasse des affaires de la vie courante[a], afin de plaire à celui qui l’a enrôlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des activités civiles ». Le grec oppose le service militaire aux occupations de la vie ordinaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς στρατευόμενος
  choice: Aucun soldat
  rationale: La formulation française exprime naturellement la portée universelle de οὐδεὶς et la situation de celui qui accomplit un service militaire, sans alourdir la phrase par un calque participial.
- source_word: ἐμπλέκεται
  choice: ne se laisse prendre
  rationale: Cette expression conserve l’image d’un engagement qui entrave la liberté d’action. Elle est idiomatique en français moderne et suggère mieux l’enchevêtrement que le simple verbe « s’occuper ».
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: dans les affaires de la vie courante
  rationale: πραγματείαι désigne des occupations ou affaires, tandis que βίος renvoie ici à la vie ordinaire et à ses moyens d’existence. La traduction maintient le contraste implicite avec le service militaire sans restreindre le sens aux seules activités commerciales.
- source_word: ἵνα
  choice: afin de
  rationale: Rend clairement la valeur de but de la conjonction grecque dans un registre digne et naturel.
- source_word: τῷ στρατολογήσαντι
  choice: à celui qui l’a enrôlé
  rationale: Le participe aoriste désigne celui qui a recruté ou enrôlé le soldat. Cette formulation reste générale et n’introduit aucun grade militaire absent du grec.
- source_word: ἀρέσῃ
  choice: plaire
  rationale: Après « afin de », l’infinitif français rend naturellement le but exprimé par le subjonctif grec.
theological_decisions:
- issue: Portée de la métaphore militaire
  choice: Conserver directement l’image du soldat qui évite de se laisser absorber par les affaires ordinaires afin de plaire à celui qui l’a enrôlé.
  alternative: Expliciter l’application au ministère ou traduire par « activités civiles ».
  rationale: Le texte formule une comparaison militaire sans en préciser ici toute l’application. La traduction préserve donc l’image et sa tension, plutôt que d’en imposer une interprétation doctrinale ou pastorale.
translation_notes:
  register: Français international moderne, clair et digne. « Aucun soldat » est plus fluide que « personne servant comme soldat »; « ne se laisse prendre » conserve l’idée d’entrave portée par ἐμπλέκεται. Le marqueur [a] figure dans le texte principal.
