id: 2TI.2.23
reference: 2 Timothy 2:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: fr
  text: Mais évite les débats insensés, ceux qui sont sans instruction[a], sachant qu’ils engendrent[b] des querelles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « questions » ou « controverses » ; le terme grec peut désigner des recherches ou des questions, mais il renvoie probablement ici à des débats contentieux plutôt qu’à une recherche sincère. L’expression grecque qualifie ces débats comme dépourvus d’instruction ou de formation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « donnent naissance à » ou « engendrent » ; l’expression est métaphorique et indique qu’ils causent des querelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: insensées
  rationale: Le terme qualifie ce qui manque de bon sens. « Insensées » conserve sa portée intellectuelle et morale dans un registre digne et naturel.
- source_word: ἀπαιδεύτους
  choice: mal informées
  rationale: L’adjectif désigne ce qui manque d’instruction ou de formation. Appliqué à des controverses, « mal informées » exprime ce défaut plus naturellement en français que « ignorantes » ou « sans instruction ».
- source_word: ζητήσεις
  choice: controverses
  rationale: Le nom peut désigner des questions ou des recherches, mais le contexte met ici l’accent sur des échanges contentieux qui engendrent des querelles.
- source_word: παραιτοῦ
  choice: écarte
  rationale: L’impératif moyen appelle Timothée à refuser de s’engager dans ces controverses. « Écarte » rend cet ordre avec concision sans suggérer nécessairement une condamnation de toute question.
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe est conservé par une tournure française naturelle qui présente le motif de l’ordre.
- source_word: γεννῶσι
  choice: engendrent
  rationale: Le verbe signifie littéralement « donner naissance à » ou « engendrer ». « Engendrent » préserve la métaphore tout en exprimant clairement le rapport de cause à effet.
- source_word: μάχας
  choice: querelles
  rationale: Dans ce contexte de disputes verbales et relationnelles, « querelles » convient mieux que le plus physique « combats ».
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque un léger contraste avec l’exhortation précédente, rendu naturellement par « Mais ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation distingue les controverses mal informées des questions sincères et conserve, avec « engendrent », l’image causale du texte grec.
