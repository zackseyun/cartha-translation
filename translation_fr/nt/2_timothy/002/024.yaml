id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: fr
  text: Or, un serviteur[a] du Seigneur ne doit pas se quereller, mais être doux envers tous, capable d’enseigner et patient quand on lui fait du tort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave ». Le mot grec doulos peut désigner, selon le contexte, un esclave ou un serviteur.
    reason: Alternative lexicale pour δοῦλος, conformément à l’audit anglais.
lexical_decisions:
- source_word: δοῦλον
  choice: un serviteur
  rationale: Dans cette instruction sur la conduite à tenir, « serviteur » exprime naturellement la personne qui sert le Seigneur. Le grec δοῦλος peut aussi désigner un esclave, mais le statut servile n’est pas ici au premier plan.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le génitif grec est rendu par la tournure française naturelle « du Seigneur », et κύριος conserve son équivalent habituel « Seigneur ».
- source_word: οὐ δεῖ μάχεσθαι
  choice: ne doit pas se quereller
  rationale: δεῖ exprime ici une obligation, tandis que μάχεσθαι désigne dans ce contexte une attitude querelleuse ou conflictuelle plutôt qu’un combat physique.
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: être doux envers tous
  rationale: ἤπιος décrit une attitude douce et bienveillante, et πρὸς πάντας en étend explicitement la portée à tous.
- source_word: διδακτικόν
  choice: capable d’enseigner
  rationale: Le terme désigne l’aptitude à enseigner, et non le fait d’être disposé à apprendre.
- source_word: ἀνεξίκακον
  choice: patient quand on lui fait du tort
  rationale: Ce mot rare évoque la capacité de supporter les mauvais traitements sans réagir avec ressentiment ou hostilité. Cette formulation explicite ce sens en français courant.
theological_decisions:
- issue: Traduction de δοῦλος dans une instruction relative au ministère
  choice: serviteur
  alternative: esclave
  rationale: Le verset porte avant tout sur la conduite de celui qui sert le Seigneur. « Serviteur » convient donc au contexte sans effacer le fait que δοῦλος peut, ailleurs ou selon l’accent voulu, signifier « esclave ».
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » est l’équivalent normal de κύριος dans ce contexte et préserve le titre christologique sans imposer une autre interprétation.
translation_notes:
  register: Français moderne, international et digne. La coordination a été légèrement adaptée pour une lecture fluide, tout en conservant l’opposition entre l’attitude querelleuse et les qualités requises.
