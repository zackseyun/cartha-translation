reference: 2 Timothy 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: fr
  text: pour lequel j’endure des souffrances[a], jusqu’aux chaînes, comme un malfaiteur[b]. Mais la parole de Dieu n’est pas enchaînée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans lequel » ou « à cause duquel » ; le grec renvoie vraisemblablement à l’Évangile mentionné au verset précédent.
    reason: alternative_reading
  - marker: b
    text: Ou « comme un criminel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: pour lequel
  rationale: La locution relative renvoie vraisemblablement à l’Évangile mentionné au verset précédent et peut exprimer le cadre ou la cause. « pour lequel » est naturel en français et conserve le lien relatif sans expliciter davantage le référent.
- source_word: κακοπαθῶ
  choice: j’endure des souffrances
  rationale: Le verbe décrit l’expérience présente et continue des épreuves. Cette formulation rend à la fois l’affliction et l’idée d’endurance, sans exagérer son intensité.
- source_word: μέχρι δεσμῶν
  choice: au point d’être enchaîné
  rationale: μέχρι indique ici l’étendue atteinte par la souffrance, tandis que δεσμά évoque concrètement les chaînes et, par métonymie, l’emprisonnement. La formulation française reste idiomatique tout en conservant l’image.
- source_word: ὡς κακοῦργος
  choice: comme un criminel
  rationale: κακοῦργος désigne celui qui commet le mal et peut, dans ce contexte judiciaire, se traduire par « criminel ». Ce choix exprime clairement la manière dont Paul est traité sans affirmer qu’il est réellement coupable.
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction introduit le contraste marqué entre l’enchaînement de Paul et la liberté de la parole de Dieu.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette traduction consacrée et naturelle préserve l’étendue sémantique de λόγος, sans réduire l’expression aux seules Écritures ni l’identifier explicitement au message de l’Évangile.
- source_word: οὐ δέδεται
  choice: n’est pas enchaînée
  rationale: Le parfait passif décrit l’absence d’un état d’entrave. « enchaînée » reprend volontairement l’image des chaînes de Paul et rend avec force le contraste du texte grec.
theological_decisions:
- issue: Référent de « la parole de Dieu »
  choice: Conserver « la parole de Dieu » sans préciser davantage son référent.
  alternative: « le message de l’Évangile » ou « les Écritures »
  rationale: Le contexte immédiat oriente vers l’Évangile proclamé, mais l’expression grecque reste plus large. La traduction maintient cette amplitude et ne tranche pas une ambiguïté que le texte laisse ouverte.
- issue: Statut de Paul comparé à un κακοῦργος
  choice: « comme un criminel »
  alternative: « en criminel » ou « comme un malfaiteur »
  rationale: ὡς établit une comparaison portant sur le traitement subi. La formulation retenue évite de présenter Paul comme effectivement coupable tout en préservant la dureté de l’accusation.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure contrastive concise du grec ainsi que l’écho entre les chaînes de Paul et la parole qui ne peut être enchaînée.
