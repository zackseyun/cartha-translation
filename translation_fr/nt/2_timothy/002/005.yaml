id: 2TI.2.5
reference: 2 Timothy 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: fr
  text: De même, si quelqu’un participe à une compétition sportive, il n’est pas couronné s’il ne concourt pas dans le respect des règles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à la règle » ou « de manière légitime ». Le terme grec désigne une conduite conforme à ce qui est prescrit ; ici, il renvoie probablement aux règles de la compétition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ (ἀθλέω)
  choice: participe à une compétition sportive / concourt
  rationale: Le verbe désigne la participation à une épreuve athlétique. La première formulation explicite l’image sportive, tandis que « concourt » permet de la reprendre naturellement sans alourdir la phrase.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini a ici une portée générale. « Quelqu’un » est inclusif et naturel en français moderne.
- source_word: στεφανοῦται
  choice: est couronné
  rationale: Le passif évoque la couronne remise au vainqueur. « Est couronné » conserve cette image sans préciser la nature de la récompense.
- source_word: νομίμως
  choice: dans le respect des règles
  rationale: Dans le contexte d’une compétition, l’adverbe désigne une participation conforme aux règles établies. Cette formulation est claire et idiomatique en français contemporain.
- source_word: καὶ / δὲ
  choice: De même
  rationale: L’ensemble introduit avec souplesse un nouvel exemple dans la série d’images du contexte. « De même » rend naturellement cette transition additive en français.
theological_decisions:
- issue: Nature de l’image de la couronne
  choice: Conserver l’image sportive d’un concurrent couronné, sans définir davantage la récompense.
  alternative: Identifier explicitement la couronne à une récompense eschatologique ou à l’approbation du ministère.
  rationale: Le verset présente une analogie athlétique centrée sur la nécessité de concourir conformément aux règles. Il ne précise pas lui-même la réalité spirituelle correspondant à la couronne.
translation_notes:
  register: Français international moderne, clair et digne. L’image athlétique est explicitée dès la première proposition, puis reprise par « concourt ». La double négation conditionnelle du grec est conservée afin de préserver la structure et l’accent du texte.
