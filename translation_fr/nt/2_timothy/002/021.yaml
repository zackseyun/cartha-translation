id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: fr
  text: Si donc quelqu’un se purifie de ces choses, il sera un vase destiné à un usage honorable[a], sanctifié[b], utile au maître, préparé pour toute bonne œuvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un vase pour l’honneur ».'
    reason: La formulation littérale préserve le tour grec εἰς τιμήν, tandis que le texte principal en exprime naturellement la fonction dans la métaphore.
  - marker: b
    text: 'Ou : « consacré » ou « mis à part ».'
    reason: Ces équivalents rendent d’autres nuances possibles de ἡγιασμένον.
lexical_decisions:
- source_word: ἐὰν οὖν τις
  choice: Si donc quelqu’un
  rationale: « Si » conserve la condition introduite par ἐάν, « donc » le lien logique marqué par οὖν, et « quelqu’un » la portée générale de τις.
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: se purifie de ces choses
  rationale: Le pronominal « se purifie » rend naturellement le réfléchi grec; « ces choses » maintient le renvoi démonstratif sans décider s’il vise surtout des conduites, des enseignements ou des personnes évoquées dans le contexte.
- source_word: ἔσται σκεῦος εἰς τιμήν
  choice: il sera un vase destiné à un usage honorable
  rationale: « Vase » maintient l’image des objets d’une maison au verset précédent. La formulation explicite la destination exprimée par εἰς tout en conservant le contraste avec l’usage déshonorant.
- source_word: ἡγιασμένον
  choice: sanctifié
  rationale: Le participe parfait passif décrit un état résultant d’une action de consécration. « Sanctifié » en conserve la précision et le registre théologique.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: utile au Maître
  rationale: « Utile » rend directement εὔχρηστον. « Maître » correspond à l’autorité du δεσπότης dans l’image domestique et la majuscule signale le référent divin probable sans abandonner la métaphore.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: préparé pour toute œuvre bonne
  rationale: La formulation garde la portée distributive de πᾶν, le terme large ἔργον et le participe exprimant l’état de préparation.
theological_decisions:
- issue: Référence de « ces choses » (ἀπὸ τούτων)
  choice: Conserver le démonstratif sans préciser son référent
  alternative: Expliciter « de ces personnes » ou « de ces pratiques »
  rationale: Le génitif pluriel peut reprendre les réalités déshonorantes du contexte sans imposer à lui seul une seule catégorie de référents. La traduction préserve cette tension.
- issue: Valeur de ἡγιασμένον
  choice: sanctifié
  alternative: consacré / mis à part
  rationale: « Sanctifié » conserve à la fois l’idée de sainteté et l’état produit par l’action divine, tandis que les autres formulations peuvent mettre davantage l’accent sur la fonction cultuelle ou la séparation.
- issue: Identification de δεσπότης
  choice: le Maître
  alternative: le maître de maison / le propriétaire
  rationale: Le contexte présente une maison et ses récipients, mais l’application vise vraisemblablement Dieu. « Maître » maintient ensemble l’image domestique et l’autorité théologique sans préciser davantage l’identité du référent.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase grecque. « Œuvre bonne » conserve une expression paulinienne reconnaissable; « vase » maintient la métaphore domestique malgré son emploi moins courant dans ce sens en français contemporain.
