id: 2TI.2.13
reference: 2 Timothy 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: fr
  text: 'Si nous sommes infidèles[a], lui reste fidèle[b] : il ne peut se renier lui-même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si nous ne croyons pas » ou « Si nous manquons de foi ». Le verbe grec peut évoquer aussi bien l’incrédulité que l’infidélité.
    reason: lexical_alternative
  - marker: b
    text: Ou « digne de confiance ». « Fidèle » est retenu pour préserver le contraste avec « sommes infidèles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: sommes infidèles
  rationale: Le verbe peut exprimer l’incrédulité ou l’infidélité. « Sommes infidèles » conserve le contraste verbal avec πιστός sans exclure entièrement l’idée d’un manque de foi.
- source_word: πιστὸς
  choice: fidèle
  rationale: « Fidèle » préserve le contraste avec « infidèles » et exprime la constance de celui dont il est question; « digne de confiance » reste possible.
- source_word: μένει
  choice: reste
  rationale: Rendu direct et naturel de la continuité exprimée par le verbe grec.
- source_word: ἀρνήσασθαι
  choice: se renier
  rationale: Avec le pronom réfléchi, « se renier » rend naturellement l’idée de désavouer ou de renier sa propre personne.
- source_word: ἑαυτὸν
  choice: lui-même
  rationale: Le pronom réfléchi renvoie au sujet « lui » et reçoit en français la forme renforcée « lui-même ».
- source_word: οὐ δύναται
  choice: il ne peut
  rationale: Cette formulation concise exprime une impossibilité, et non une simple absence de volonté.
theological_decisions:
- issue: Portée de la fidélité divine face à l’infidélité humaine
  choice: Le texte affirme que sa fidélité demeure parce qu’il ne peut se renier lui-même, sans préciser ici si cette fidélité se manifeste principalement dans le salut, dans l’accomplissement des promesses ou dans le jugement.
  alternative: Comprendre exclusivement cette fidélité soit comme la garantie du salut malgré la faiblesse humaine, soit comme la fidélité aux avertissements de jugement contre l’apostasie.
  rationale: Le grec affirme la constance divine sans trancher explicitement entre ces applications théologiques. La traduction garde cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure emphatique « lui reste fidèle » reproduit le contraste grec entre « nous » et « lui ». Les deux-points rendent le lien explicatif entre les propositions sans ajouter une conjonction absente du texte grec.
