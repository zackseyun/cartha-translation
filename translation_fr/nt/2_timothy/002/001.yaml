  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: fr
  text: Toi donc, mon enfant, fortifie-toi dans la grâce qui est en Jésus le Messie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ
  choice: Toi
  rationale: Le pronom explicite est emphatique et probablement contrastif; « Toi » en tête de phrase en conserve naturellement la force.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque l’inférence avec ce qui précède tout en restant naturel en français contemporain.
- source_word: τέκνον μου
  choice: mon enfant
  rationale: τέκνον désigne littéralement un enfant sans préciser le sexe et exprime ici l’affection ainsi qu’une relation spirituelle.
- source_word: ἐνδυναμοῦ
  choice: puise ta force
  rationale: Cette formulation idiomatique conserve l’idée d’une force reçue plutôt que produite de façon autonome, sans la lourdeur de « sois fortifié ».
- source_word: ἐν τῇ χάριτι
  choice: dans la grâce
  rationale: « Dans » préserve le possible chevauchement entre sphère et moyen dans ἐν, au lieu de réduire le sens à la seule instrumentalité.
- source_word: χάριτι
  choice: grâce
  rationale: « Grâce » est le terme français établi et convient au sens paulinien de faveur divine qui soutient et rend capable.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: qui est en Jésus le Messie
  rationale: La relative suit la structure attributive grecque. L’ordre français « Jésus le Messie » est plus naturel que « Messie Jésus » tout en gardant à Χριστός sa valeur de titre.
- source_word: Χριστῷ
  choice: le Messie
  rationale: Χριστός signifie « oint » et fonctionne ici comme un titre; « le Messie » en rend le sens plutôt que de simplement translittérer le terme.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française usuelle du nom propre Ἰησοῦς.
theological_decisions:
- issue: Voix et agent de ἐνδυναμοῦ
  choice: « puise ta force », qui présente la force comme reçue dans la grâce
  alternative: « sois fort » ou « sois fortifié »
  rationale: La forme médio-passive permet une nuance réceptive, renforcée par « dans la grâce ». La traduction évite aussi bien l’idée d’une force autonome que l’attribution explicite d’un agent non nommé.
- issue: Traduction de Χριστός
  choice: « Jésus le Messie »
  alternative: « Jésus-Christ » ou « Christ Jésus »
  rationale: « Messie » rend le contenu du titre grec Χριστός. L’ordre adopté est idiomatique en français et ne traite pas silencieusement le titre comme un simple élément de nom propre.
translation_notes:
  register: Français international moderne, chaleureux et digne. « Puise ta force » est plus naturel que le calque « sois fortifié » et maintient la dépendance envers la grâce. La ponctuation finale remplace la virgule du fragment grec par un point pour présenter le verset comme une unité autonome.
