reference: 2 Timothy 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: fr
  text: C’est pourquoi je supporte tout pour les élus[a], afin qu’eux aussi obtiennent le salut qui est dans le Messie Jésus, avec la gloire éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui ont été choisis ». Le terme grec est ἐκλεκτούς.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure renvoie naturellement au contexte précédent et conserve la valeur causale de l’expression grecque.
- source_word: πάντα ὑπομένω
  choice: je supporte tout
  rationale: ὑπομένω exprime l’endurance ferme face aux épreuves; « supporter » est ici naturel en français, et πάντα garde sa portée globale avec « tout ».
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: à cause des élus
  rationale: διά suivi de l’accusatif indique ici le motif orienté vers leur bien. « À cause des élus » reste proche de la construction grecque sans préciser davantage le rapport que le texte.
- source_word: ἵνα καὶ αὐτοὶ
  choice: afin qu’eux aussi
  rationale: « Afin que » conserve la valeur de but de ἵνα, tandis que la forme disjointe « eux » rend l’emphase de αὐτοὶ et « aussi » celle de καί.
- source_word: σωτηρίας τύχωσιν
  choice: obtiennent le salut
  rationale: τυγχάνω avec le génitif signifie obtenir ou recevoir en partage; cette formulation est claire et conserve le sens d’acquisition sans développer le mécanisme théologique.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: qui est dans le Messie Jésus
  rationale: La proposition relative rattache explicitement le groupe prépositionnel au salut. « Dans » préserve le langage paulinien, et « Messie » rend la valeur titulaire de Χριστός.
- source_word: μετὰ δόξης αἰωνίου
  choice: avec la gloire éternelle
  rationale: μετά avec le génitif marque l’accompagnement. L’article français convient à l’expression définie et « éternelle » rend αἰωνίου sans paraphrase.
theological_decisions:
- issue: Traduction de ἐκλεκτούς
  choice: les élus
  alternative: ceux qui ont été choisis
  rationale: « Les élus » rend directement le vocabulaire d’élection du grec et en préserve la portée théologique sans l’intégrer à un système doctrinal particulier.
- issue: Valeur de Χριστῷ
  choice: le Messie Jésus
  alternative: Jésus-Christ / le Christ Jésus
  rationale: Χριστός conserve ici sa signification de titre. « Le Messie Jésus » rend cette valeur sémantique plutôt que de traiter entièrement le terme comme un nom propre.
- issue: Rapport de μετὰ δόξης αἰωνίου au salut
  choice: avec la gloire éternelle
  alternative: accompagné de la gloire éternelle
  rationale: La formulation maintient l’accompagnement exprimé par μετά sans trancher plus précisément la relation conceptuelle entre le salut et la gloire.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de but et l’emphase de « eux aussi » sont conservées. La virgule avant « avec la gloire éternelle » évite un empilement obscur tout en maintenant le rattachement naturel de l’expression au salut.
