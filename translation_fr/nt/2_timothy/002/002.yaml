- from: Et ce que tu as entendu de moi en présence de nombreux témoins[a], confie-le à des hommes fidèles[b], qui seront capables d’enseigner aussi les autres.
  to: Et ce que tu as entendu de moi en présence de nombreux témoins[a], confie-le à des hommes fidèles[b], qui seront capables d’enseigner aussi à d’autres.
  rationale: La seule correction du texte remplace « enseigner aussi les autres » par « enseigner aussi à d’autres », afin de rendre sans ambiguïté l’objet humain indéfini de ἑτέρους et de produire une formulation française naturelle. La note b est ajustée de façon rédactionnelle pour décrire le grec sans répétition inutile. Le sens et les ambiguïtés du passage sont autrement préservés.
