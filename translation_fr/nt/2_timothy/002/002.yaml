source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: fr
  text: Et ce que tu as entendu de moi en présence de nombreux témoins[a], confie-le à des hommes fidèles[b], qui seront capables d’enseigner aussi à d’autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant de nombreux témoins ». L’expression grecque peut souligner que Paul a donné cet enseignement publiquement, en présence de nombreux témoins ; elle pourrait aussi, quoique moins probablement, signifier « par l’intermédiaire de nombreux témoins ».
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie l’expression « hommes fidèles ». Le masculin peut avoir ici une valeur représentative ; on pourrait aussi traduire « personnes fidèles » ou « personnes dignes de confiance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: ce que
  rationale: Le pronom relatif neutre pluriel désigne le contenu reçu par Timothée. « Ce que » est naturel en français et conserve cette valeur d’objet.
- source_word: ἤκουσας
  choice: tu as entendu
  rationale: L’aoriste renvoie ici à l’enseignement que Timothée a reçu auparavant de Paul ; le passé composé convient au français moderne.
- source_word: παρ’ ἐμοῦ
  choice: de moi
  rationale: Avec le verbe « entendre », παρά suivi du génitif indique naturellement la source de l’enseignement.
- source_word: διὰ πολλῶν μαρτύρων
  choice: en présence de nombreux témoins
  rationale: διά avec le génitif peut exprimer l’intermédiaire ou une circonstance concomitante. Ici, la formulation évoque vraisemblablement un enseignement public attesté par de nombreux témoins, tout en signalant l’autre analyse en note.
- source_word: ταῦτα
  choice: le
  rationale: Le pronom français reprend naturellement « ce que tu as entendu ». Cette reprise idiomatique exprime le contenu désigné par le démonstratif grec sans lourdeur.
- source_word: παράθου
  choice: confie
  rationale: L’impératif de παρατίθημι demande de remettre un dépôt à la garde d’autrui. « Confier » conserve clairement cette idée de responsabilité.
- source_word: πιστοῖς
  choice: fidèles
  rationale: πιστός peut qualifier des personnes fidèles ou dignes de confiance. « Fidèles » préserve cette amplitude, plutôt que de réduire le sens à la seule compétence.
- source_word: ἀνθρώποις
  choice: hommes
  rationale: Le groupe est au masculin pluriel. « Hommes » en conserve la forme, tandis qu’une note indique que le terme grec peut être employé de manière représentative.
- source_word: οἵτινες
  choice: qui
  rationale: Le relatif qualitatif caractérise les personnes auxquelles l’enseignement doit être confié. « Qui » est la formulation française naturelle, la qualité requise étant précisée par la suite.
- source_word: ἱκανοὶ
  choice: capables
  rationale: ἱκανός exprime l’aptitude ou la capacité suffisante pour accomplir la tâche d’enseignement.
- source_word: ἔσονται
  choice: seront
  rationale: Le futur grec est conservé et présente leur capacité à transmettre ensuite l’enseignement.
- source_word: ἑτέρους
  choice: les autres
  rationale: Le terme désigne d’autres personnes au-delà de celles qui reçoivent directement le dépôt.
theological_decisions:
- issue: Portée de πιστοῖς ἀνθρώποις quant au genre
  choice: des hommes fidèles
  alternative: des personnes fidèles / des gens dignes de confiance
  rationale: Le grec porte une forme masculine plurielle, mais ἄνθρωπος peut aussi avoir une portée représentative. Le texte principal conserve la forme masculine et la note préserve explicitement la possibilité d’un sens plus large.
- issue: Sens de πιστοῖς
  choice: fidèles
  alternative: dignes de confiance / fiables
  rationale: Dans ce contexte, la fiabilité pour transmettre l’enseignement est centrale, mais « fidèles » évite d’exclure une éventuelle résonance de fidélité croyante ou relationnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse personnelle de Paul à Timothée. La syntaxe reste proche de l’enchaînement grec, tout en employant la reprise idiomatique « confie-le ».
