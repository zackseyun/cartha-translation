  source_fidelity: 'Le sens général est fidèlement rendu : Paul est la source de l’enseignement, la formulation relative aux nombreux témoins conserve l’ambiguïté pertinente en note, et l’impératif de transmission est bien exprimé. Toutefois, « enseigner aussi les autres » suggère plus naturellement en français « enseigner les autres également » ou « enseigner tout le reste » ; ἑτέρους désigne ici d’autres personnes. « enseigner aussi à d’autres » restitue plus précisément la construction et la portée du grec.'
