id: 2TI.2.11
reference: 2 Timothy 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: fr
  text: 'Cette parole est digne de confiance[a] : en effet, si nous sommes morts avec lui[b], nous vivrons aussi avec lui[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La parole est fidèle » ou « Cette affirmation est fiable ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « si nous sommes morts avec [lui] » ; le verbe grec composé exprime une mort partagée avec le Christ.
    reason: lexical_alternative
  - marker: c
    text: Le futur « nous vivrons avec lui » peut désigner la vie de résurrection avec le Christ, la participation présente à sa vie, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: digne de confiance
  rationale: Comme adjectif attribut de λόγος, πιστός indique ici que la parole est fiable et mérite d’être reçue. « Digne de confiance » est naturel en français moderne et évite de suggérer principalement la fidélité personnelle.
- source_word: ὁ λόγος
  choice: cette parole
  rationale: Dans les épîtres pastorales, πιστὸς ὁ λόγος est une formule qui présente une déclaration mémorable. « Cette parole » restitue bien cet emploi tout en gardant le vocabulaire courant de λόγος.
- source_word: εἰ γὰρ
  choice: car, si
  rationale: « Si » conserve la condition introduite par εἰ, tandis que « car » rend la valeur explicative de γάρ et relie la proposition au caractère fiable de la parole.
- source_word: συναπεθάνομεν
  choice: nous sommes morts avec lui
  rationale: Le verbe composé συναποθνῄσκω exprime une mort partagée. Le passé composé rend naturellement l’aoriste en français, et « avec lui » explicite le partenaire impliqué par συν-, identifié dans le contexte comme le Christ.
- source_word: καὶ
  choice: aussi
  rationale: 'Dans cette construction parallèle, καί associe la conséquence à la condition : à la mort avec le Christ correspond aussi la vie avec lui.'
- source_word: συζήσομεν
  choice: nous vivrons aussi avec lui
  rationale: Le futur de συζάω exprime le fait de vivre conjointement avec quelqu’un. « Nous vivrons avec lui » est clair et naturel, sans préciser davantage la nature ou le moment de cette vie.
theological_decisions:
- issue: Référent implicite des verbes composés avec συν-
  choice: Expliciter « avec lui » dans les deux propositions, en référence au Christ.
  alternative: 'Laisser la relation implicite : « si nous sommes morts, nous vivrons aussi ».'
  rationale: Aucun complément n’est exprimé séparément en grec, mais le préfixe συν- des deux verbes marque une participation commune. Le contexte centré sur le Christ permet de l’identifier comme référent, et l’explicitation est nécessaire pour transmettre naturellement ce sens en français.
- issue: Portée temporelle et théologique de συζήσομεν
  choice: Conserver la formulation générale « nous vivrons aussi avec lui ».
  alternative: Préciser soit la résurrection future avec le Christ, soit la participation présente à sa vie.
  rationale: Le futur grec peut orienter vers la vie à venir et la résurrection, sans que la formulation impose ici une seule explication exhaustive. La traduction préserve cette ouverture plutôt que de trancher en faveur d’une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le rythme bref et équilibré de la déclaration grecque. « Cette parole est digne de confiance » reprend une formule reconnaissable des épîtres pastorales sans lourdeur archaïque.
