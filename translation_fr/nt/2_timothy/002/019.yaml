  to: 'Pourtant, le solide fondement de Dieu reste debout et porte ce sceau[a] : « Le Seigneur connaît ceux qui lui appartiennent », et : « Que quiconque se réclame du nom du Seigneur[b] s’éloigne de l’injustice. »'
  rationale: La seule révision remplace une tournure française susceptible de banaliser l’expression grecque par « se réclame du nom », qui rend naturellement l’idée d’appartenance ou de profession sans exclure l’idée d’invocation, explicitée en note. Le reste du texte et les ancres de notes sont conservés.
