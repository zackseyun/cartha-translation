    issue: « quiconque prononce le nom du Seigneur »
    rationale: 'Cette expression est trop littérale en français contemporain : elle peut désigner la seule énonciation orale d’un nom. Le grec constitue une formule idiomatique qui renvoie à ceux qui invoquent le Seigneur ou se réclament de lui. Une formulation française idiomatique doit conserver cette portée sans la réduire à la prononciation.'
