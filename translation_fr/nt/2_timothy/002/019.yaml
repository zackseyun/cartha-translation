id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: fr
  text: 'Pourtant, le solide fondement de Dieu reste debout et porte ce sceau[a] : « Le Seigneur connaît ceux qui lui appartiennent », et : « Que quiconque se réclame du nom du Seigneur[b] s’éloigne de l’injustice. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porte cette inscription ». Le mot traduit par « sceau » peut désigner la marque distinctive ou l’inscription figurant sur un sceau.
    reason: lexical_alternative
  - marker: b
    text: Ou « invoque le nom du Seigneur ». L’expression grecque signifie littéralement « nomme le nom du Seigneur » et peut évoquer le fait de l’invoquer ou de se réclamer de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Pourtant
  rationale: Marque nettement le contraste avec les égarements évoqués auparavant, dans un français naturel et soutenu.
- source_word: στερεὸς θεμέλιος
  choice: le solide fondement
  rationale: Conserve la métaphore et souligne la stabilité ainsi que la permanence du fondement.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Maintient le génitif sans trancher entre possession, origine et caractérisation.
- source_word: ἕστηκεν
  choice: reste debout
  rationale: Rend l’état durable exprimé par le parfait grec tout en conservant l’image spatiale du texte.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: porte ce sceau
  rationale: Formulation française naturelle qui préserve l’image d’une marque d’identification ou d’authentification.
- source_word: Ἔγνω
  choice: connaît
  rationale: Le présent français exprime naturellement la portée durable ou générale de cette citation malgré l’aoriste grec.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: ceux qui lui appartiennent
  rationale: Exprime clairement la relation d’appartenance impliquée par la tournure grecque.
- source_word: Ἀποστήτω
  choice: Que … s’éloigne
  rationale: Rend l’impératif comme un appel ferme à une rupture décisive.
- source_word: ἀπὸ ἀδικίας
  choice: de l’injustice
  rationale: Conserve la large portée morale du terme, qui peut désigner l’injustice, le mal ou ce qui n’est pas juste.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: quiconque prononce le nom du Seigneur
  rationale: Préserve l’écho rhétorique de l’expression grecque tout en restant compréhensible en français; son sens idiomatique est précisé en note.
theological_decisions:
- issue: Référent du « Seigneur » dans les deux formules inscrites sur le sceau
  choice: Conserver simplement « le Seigneur » sans préciser s’il s’agit du Père, du Christ ou d’une référence scripturaire à portée multiple.
  alternative: Identifier explicitement le Seigneur à Dieu le Père, au Christ, ou attribuer un référent différent à chaque formule.
  rationale: Le grec emploie κύριος sans explicitation. Dans ce contexte de reprise scripturaire appliquée à la communauté chrétienne, préciser davantage résoudrait une densité théologique que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les métaphores du fondement et du sceau, ainsi que l’ambiguïté du titre « Seigneur ». Les marqueurs de notes sont placés directement après les expressions qu’ils expliquent.
