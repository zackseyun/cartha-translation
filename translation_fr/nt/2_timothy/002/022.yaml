id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: fr
  text: Mais fuis les désirs propres à la jeunesse[a] et poursuis la justice[b], la foi[c], l’amour et la paix, avec ceux qui invoquent le Seigneur d’un cœur pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les passions de la jeunesse ». L’expression grecque désigne largement les désirs caractéristiques de la jeunesse, et pas seulement le désir sexuel.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « justice » peut aussi évoquer la droiture morale ou une conduite juste.
    reason: alternative_reading
  - marker: c
    text: Ou « la fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: les désirs propres à la jeunesse
  rationale: Cette formulation rend le caractère spécifiquement juvénile des désirs sans les réduire aux seuls désirs sexuels.
- source_word: φεῦγε
  choice: fuis
  rationale: L’impératif conserve l’image énergique d’une fuite et s’oppose nettement à « poursuis ».
- source_word: δίωκε
  choice: poursuis
  rationale: Le verbe exprime une recherche active et persévérante, en contraste direct avec « fuis ».
- source_word: δικαιοσύνην
  choice: la justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη et peut désigner ici la droiture morale tout en gardant ses dimensions relationnelles et juridiques.
- source_word: πίστιν
  choice: la foi
  rationale: « Foi » est le sens usuel de πίστις; dans cette liste de vertus, la nuance de fidélité demeure également possible et est signalée en note.
- source_word: ἀγάπην
  choice: l’amour
  rationale: Traduction directe, naturelle et conforme à l’usage néotestamentaire de ἀγάπη.
- source_word: εἰρήνην
  choice: la paix
  rationale: Traduction directe et idiomatique dans cette liste de qualités à rechercher.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: avec ceux qui invoquent le Seigneur
  rationale: « Avec » exprime l’association indiquée par μετά, et « invoquent le Seigneur » rend naturellement l’idée de faire appel à lui dans la prière et la confession.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: d’un cœur pur
  rationale: Cette expression française naturelle présente le cœur pur comme la source intérieure de l’invocation, conformément à ἐκ.
theological_decisions:
- issue: Portée de « désirs propres à la jeunesse »
  choice: Désirs caractéristiques de la jeunesse au sens moral large
  alternative: Passions principalement sexuelles
  rationale: Le grec ne limite pas ces désirs à la sexualité; le contexte porte plus largement sur le caractère et la conduite.
- issue: Nuance de δικαιοσύνη
  choice: « justice » dans le texte, comprise aussi comme droiture morale
  alternative: « conduite juste » ou « droiture »
  rationale: Le terme grec peut réunir des dimensions morales, relationnelles et juridiques; la traduction française « justice » préserve cette amplitude.
- issue: Nuance de πίστις dans la liste de vertus
  choice: « foi »
  alternative: « fidélité »
  rationale: « Foi » demeure la traduction la plus directe, mais le contexte éthique permet aussi de comprendre la constance ou la fidélité; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs brefs « fuis » et « poursuis » préservent le contraste énergique du grec. « Invoquent le Seigneur » conserve le registre biblique sans être archaïque.
