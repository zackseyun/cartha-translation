id: 2TI.2.7
reference: 2 Timothy 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: fr
  text: Réfléchis à ce que je dis[a], car le Seigneur[b] te donnera du discernement en toutes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cherche à comprendre ce que je dis » ; le verbe grec peut exprimer aussi bien la réflexion que la compréhension.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit seulement « le Seigneur » ; il peut s’agir plus précisément du Seigneur Jésus ou de Dieu, sans que le verset le précise.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Réfléchis
  rationale: L’impératif présent appelle Timothée à exercer activement sa réflexion. « Réfléchis » exprime naturellement cette exhortation, tout en laissant à la proposition suivante le rôle d’annoncer le discernement accordé par le Seigneur.
- source_word: ὃ λέγω
  choice: à ce que je dis
  rationale: Le pronom relatif neutre désigne naturellement le contenu des paroles de Paul. Le présent « je dis » convient au contexte immédiat sans alourdir la phrase.
- source_word: γάρ
  choice: car
  rationale: « Car » conserve le rapport explicatif entre l’appel à réfléchir et la promesse qui le fonde.
- source_word: δώσει … σοι
  choice: te donnera
  rationale: Le futur exprime directement une promesse, et le datif σοι se rend naturellement par le pronom « te ».
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Cette traduction reproduit le titre grec sans préciser s’il désigne ici Jésus en particulier ou Dieu plus généralement.
- source_word: σύνεσιν
  choice: du discernement
  rationale: σύνεσις désigne la capacité de saisir et de comprendre. « Du discernement » est idiomatique en français moderne et convient à la compréhension réfléchie attendue dans le contexte.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Cette formulation conserve l’ampleur et l’indétermination du grec sans limiter le propos aux seules questions doctrinales.
theological_decisions:
- issue: Référent de « le Seigneur » (ὁ κύριος)
  choice: Conserver « le Seigneur » sans autre précision.
  alternative: « le Seigneur Jésus » ou « Dieu »
  rationale: Le grec ne précise pas davantage le référent. Même si l’usage paulinien peut souvent désigner Jésus, la traduction ne doit pas trancher une ambiguïté que le verset maintient.
translation_notes:
  register: Français international moderne, clair et digne. « Réfléchis » rend l’exhortation de façon naturelle ; « du discernement en toutes choses » préserve la portée générale de la promesse sans suggérer explicitement une connaissance exhaustive.
