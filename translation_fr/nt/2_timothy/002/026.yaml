id: 2TI.2.26
reference: 2 Timothy 2:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: fr
  text: et qu’ils retrouvent leur bon sens et échappent au piège du diable, eux qui ont été capturés vivants[a] par lui pour faire sa volonté.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi se traduire plus généralement par « faits prisonniers », mais il désigne plus précisément le fait d’être capturé vivant.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour faire la volonté de celui-là ». Certains comprennent « celui-là » comme renvoyant non au diable, mais à Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: retrouvent leur bon sens
  rationale: Le verbe évoque littéralement le fait de redevenir sobre, puis, par métaphore, de retrouver une pensée lucide. Cette expression française naturelle convient au contexte de repentance et de délivrance de l’erreur.
- source_word: παγίδος
  choice: piège
  rationale: « Piège » rend clairement et naturellement l’image d’un dispositif qui capture, sans l’archaïsme possible de « filet » ou de « lacet ».
- source_word: διαβόλου
  choice: du diable
  rationale: Dans ce contexte, διάβολος est employé comme titre personnel et se traduit naturellement par « le diable ».
- source_word: ἐζωγρημένοι
  choice: ayant été capturés vivants
  rationale: Le verbe ζωγρέω désigne proprement le fait de prendre ou capturer vivant. Le participe parfait passif exprime un état résultant d’une capture antérieure.
- source_word: ὑπ’ αὐτοῦ
  choice: par lui
  rationale: Le pronom renvoie le plus naturellement au diable, antécédent explicite le plus proche, tout en conservant la formulation pronominale du grec.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: pour faire sa volonté
  rationale: Cette formulation française exprime naturellement la visée indiquée par εἰς, sans alourdir la phrase. Le référent de ἐκείνου restant discuté, l’autre compréhension est signalée en note.
theological_decisions:
- issue: Référent de ἐκείνου dans εἰς τὸ ἐκείνου θέλημα
  choice: 'Dans le texte principal, « sa » renvoie au diable : ils ont été capturés pour faire sa volonté.'
  alternative: '« Celui-là » peut être compris comme renvoyant à Dieu : ils auraient été capturés par le diable, mais en vue de revenir à la volonté de Dieu.'
  rationale: Le diable est l’antécédent explicite le plus proche et fournit la lecture syntaxiquement la plus immédiate. Toutefois, le passage de αὐτοῦ à ἐκείνου peut permettre de distinguer deux référents; cette ambiguïté ancienne ne doit donc pas être effacée.
translation_notes:
  register: Français international moderne, naturel et digne. « Retrouvent leur bon sens » restitue l’image de la sobriété retrouvée sans paraître artificiel. La structure coordonnée « retrouvent… et échappent » rend clairement le mouvement exprimé par ἀνανήψωσιν ἐκ. Les notes préservent la précision lexicale de ζωγρέω et l’ambiguïté réelle du référent de ἐκείνου.
