  source_fidelity: 'Le texte rend fidèlement les deux mouvements coordonnés : le retour à une pensée lucide (ἀνανήψωσιν) et la sortie du piège du diable (ἐκ τῆς ... παγίδος). « Eux qui ont été capturés vivants » restitue de façon explicite le parfait passif de ἐζωγρημένοι et la nuance lexicale de ζωγρέω. « Par lui » renvoie naturellement au diable, tandis que la note préserve correctement l’ambiguïté discutée de ἐκείνου.'
