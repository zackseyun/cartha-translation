id: 2TI.2.18
reference: 2 Timothy 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: fr
  text: eux qui se sont écartés de la vérité[a], en disant que la résurrection a déjà eu lieu[b], et ébranlent la foi de certains[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont manqué la cible en ce qui concerne la vérité »; autres traductions possibles : « se sont détournés de la vérité » ou « se sont trompés au sujet de la vérité ».'
    reason: lexical_alternative
  - marker: b
    text: Le verset ne précise pas la nature de cette affirmation ni la manière dont ils concevaient la résurrection.
    reason: theological_ambiguity
  - marker: c
    text: 'Ou : « renversent » ou « subvertissent la foi de certains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: eux qui
  rationale: Le pronom relatif reprend les personnes nommées au verset précédent. « Eux qui » assure la continuité tout en gardant la nuance légèrement qualitative de οἵτινες.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: se sont écartés de la vérité
  rationale: Avec περί et l’accusatif, ἀστοχέω exprime ici le fait de manquer la cible par rapport à la vérité, donc de s’en détourner. Cette formulation est naturelle en français et conserve l’idée d’une déviation.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe précise de quelle manière leur égarement se manifeste, sans imposer une relation logique plus étroite que le grec.
- source_word: ἀνάστασιν
  choice: la résurrection
  rationale: Malgré l’absence d’article en grec, le contexte doctrinal vise la résurrection attendue; l’article défini est idiomatique en français.
- source_word: ἤδη γεγονέναι
  choice: a déjà eu lieu
  rationale: Le parfait infinitif présente la résurrection comme un événement prétendument accompli dont l’état résultant demeure pertinent.
- source_word: ἀνατρέπουσιν
  choice: bouleversent
  rationale: Le verbe peut signifier renverser, ruiner ou subvertir. « Bouleversent » exprime ici l’effet déstabilisateur sur la foi sans affirmer nécessairement sa destruction totale.
- source_word: τήν τινων πίστιν
  choice: la foi de certains
  rationale: « Foi » est le rendu direct et non réducteur de πίστις dans ce contexte; τινων désigne un nombre indéfini de personnes.
theological_decisions:
- issue: Sens de l’affirmation selon laquelle la résurrection a déjà eu lieu
  choice: Rapporter directement l’affirmation erronée sans définir le système doctrinal qui la sous-tend.
  alternative: Préciser qu’il s’agirait d’une résurrection seulement spirituelle ou d’un déni de toute résurrection corporelle future.
  rationale: Le verset donne le contenu de l’affirmation, mais n’en expose pas le mécanisme théologique. La traduction préserve donc cette réserve.
- issue: Sens de πίστις
  choice: la foi
  alternative: la confiance
  rationale: « Foi » convient naturellement au contexte et maintient l’éventail théologique du terme sans le réduire à un seul aspect psychologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste une proposition relative afin de conserver son lien syntaxique avec le verset précédent. « Bouleversent » est accessible tout en gardant la force de l’effet produit.
