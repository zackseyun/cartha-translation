    rationale: ὑπομίμνῃσκε indique une action habituelle ou renouvelée, non nécessairement ininterrompue. « Continue à leur rappeler » rend cette valeur sans l’intensifier.
  - severity: low
    issue: La construction « adjure-les ... de ne pas » est un peu lourde et vieillissante.
    rationale: Le participe διαμαρτυρόμενος exprime une injonction ou une mise en demeure solennelle. « En leur enjoignant solennellement ... de ne pas » est plus naturel tout en conservant la force.
  - severity: low
    issue: La note b peut mieux refléter le parallélisme grec.
    rationale: 'ἐπ’ οὐδὲν χρήσιμον et ἐπὶ καταστροφῇ sont deux expressions consécutives : « pour rien d’utile, pour la ruine... ».'
