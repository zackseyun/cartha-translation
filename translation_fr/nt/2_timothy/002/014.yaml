review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : l’impératif présent appelle des rappels répétés, l’adjuration se fait sous le regard du Seigneur, et les querelles de mots sont dénoncées comme inutiles et destructrices pour les auditeurs. « Constamment » peut toutefois surinterpréter légèrement l’aspect imperfectif, qui exprime surtout la répétition ou la continuité.'
  naturalness: « Adjure-les » est compréhensible, mais son emploi transitif suivi de « de ne pas » est aujourd’hui assez soutenu et moins naturel en français international moderne. « Leur enjoignant solennellement » garde la force d’une injonction solennelle tout en offrant une construction plus idiomatique.
  terminology: « Le Seigneur » préserve correctement l’ambiguïté de κύριος. « Se quereller sur des mots » et « la ruine » rendent convenablement λογομαχεῖν et καταστροφή sans imposer une lecture théologique. La note a est bien ancrée au titre concerné. La note b doit donner une formulation littérale française plus exacte du double syntagme introduit par ἐπί.
  issues:
