id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: fr
  text: 'Continue à leur rappeler ces choses et enjoins-leur solennellement, devant le Seigneur[a], de ne pas se quereller sur des mots : cela ne sert à rien et conduit à la ruine de ceux qui écoutent.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « le Seigneur », sans préciser ici si ce titre désigne particulièrement le Seigneur Jésus ou Dieu plus généralement.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « pour rien d’utile, pour la ruine de ceux qui écoutent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie aux enseignements qui précèdent ; « ces choses » en conserve naturellement la valeur anaphorique.
- source_word: ὑπομίμνῃσκε
  choice: Rappelle-leur constamment
  rationale: L’impératif présent exprime une action suivie ou répétée. Le pronom « leur », implicite en grec, est fourni par le contexte.
- source_word: διαμαρτυρόμενος
  choice: adjure-les
  rationale: Le participe exprime une exhortation insistante et solennelle. « Adjure-les » restitue cette force dans un registre digne sans développer davantage le sens.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: devant le Seigneur
  rationale: Cette expression présente le Seigneur comme témoin de l’adjuration et préserve le titre κύριος sans en préciser le référent au-delà du grec.
- source_word: μὴ λογομαχεῖν
  choice: de ne pas se quereller sur des mots
  rationale: Le verbe désigne des disputes verbales ou des querelles portant sur les mots. Cette formulation française est claire et conserve la nuance péjorative.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: cela ne sert à rien
  rationale: La formule grecque nie tout bénéfice à ces querelles. La tournure choisie est idiomatique et directe.
- source_word: ἐπὶ καταστροφῇ
  choice: mène à la ruine
  rationale: La seconde expression en ἐπί indique ici l’issue dommageable des querelles ; « mène à » rend clairement cette conséquence tout en conservant la gravité de καταστροφή.
- source_word: τῶν ἀκουόντων
  choice: de ceux qui écoutent
  rationale: Le participe présent substantivé désigne les personnes exposées à ces querelles ; « ceux qui écoutent » en garde l’aspect actuel et le sens large.
theological_decisions:
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: Dieu ; le Seigneur Jésus
  rationale: Le grec porte seulement « le Seigneur ». Dans les épîtres pastorales, le titre peut désigner Jésus, mais le verset ne l’explicite pas ; la traduction conserve donc l’ambiguïté réelle.
- issue: Nature de la « ruine »
  choice: la ruine
  alternative: le bouleversement ; la destruction
  rationale: καταστροφή est un terme fort, mais le texte ne précise pas ici s’il s’agit d’un dommage spirituel, moral ou autre. « Ruine » préserve cette gravité sans imposer une définition théologique plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. « Adjure-les » maintient la solennité pastorale du participe grec ; les autres tournures restent courantes et immédiatement compréhensibles.
