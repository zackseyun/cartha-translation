  to: 'Continue à leur rappeler ces choses et enjoins-leur solennellement, devant le Seigneur[a], de ne pas se quereller sur des mots : cela ne sert à rien et conduit à la ruine de ceux qui écoutent.[b]'
  rationale: La révision allège une formulation légèrement archaïque, rend plus exactement la valeur continue ou répétée de l’impératif présent, et améliore la note littérale. Elle maintient le référent non précisé de « le Seigneur », la gravité non définie de « ruine », ainsi que l’enchaînement entre l’inutilité des querelles et leur effet destructeur.
