id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: fr
  text: 'Dans une grande maison, il n’y a pas seulement des récipients en or et en argent, mais aussi des récipients en bois et en terre cuite[a] : les uns sont destinés à un usage honorable, les autres à un usage déshonorant[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « terre cuite » désigne ici de l’argile cuite, ou poterie.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « les uns pour l’honneur, les autres pour le déshonneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: une grande maison
  rationale: Rend naturellement la taille ou l’importance de la maison sans ajouter une valeur morale.
- source_word: σκεύη
  choice: des récipients
  rationale: Terme français courant et suffisamment large pour désigner des objets servant à contenir ou à un usage domestique, tout en maintenant l’image.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: en or et en argent
  rationale: Exprime clairement la matière dont les récipients sont faits.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: en bois et en terre cuite
  rationale: ὀστράκινος désigne ce qui est fait d’argile cuite; « terre cuite » est précis et immédiatement compréhensible.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: les uns ... les autres ...
  rationale: Reproduit avec naturel la répartition contrastée exprimée par μέν...δέ.
- source_word: εἰς τιμήν ... εἰς ἀτιμίαν
  choice: destinés à un usage honorable ... à un usage déshonorant
  rationale: En français courant, cette formulation fait comprendre la fonction des récipients tout en conservant l’opposition lexicale entre honneur et déshonneur; la formulation grecque plus littérale est signalée en note.
- source_word: δὲ (initial)
  choice: non rendu séparément
  rationale: La particule assure ici une transition ou un léger contraste; le français n’exige pas nécessairement de connecteur explicite dans ce verset isolé.
theological_decisions:
- issue: Valeur fonctionnelle ou statutaire de τιμή et ἀτιμία
  choice: usage honorable ... usage déshonorant
  alternative: pour l’honneur ... pour le déshonneur
  rationale: La traduction principale reste naturelle dans l’image des récipients domestiques, tandis que la note conserve les noms abstraits du grec et la tension susceptible de se prolonger au verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. « Récipients » est préféré à « vases », qui pourrait suggérer en français moderne des objets surtout décoratifs. La ponctuation en deux-points clarifie la seconde répartition sans effacer son lien avec l’inventaire précédent.
