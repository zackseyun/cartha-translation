id: 2TI.2.6
reference: 2 Timothy 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: fr
  text: Il faut que le cultivateur qui travaille dur soit le premier à recevoir une part des récoltes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il faut que le cultivateur qui peine prenne le premier sa part des récoltes. » Le verbe grec signifie littéralement « prendre part » ou « participer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα (κοπιάω)
  choice: qui travaille dur
  rationale: Le participe exprime un travail pénible et soutenu. « Qui travaille dur » garde l’accent sur l’effort tout en restant naturel en français moderne.
- source_word: γεωργὸν (γεωργός)
  choice: le cultivateur
  rationale: Le terme désigne celui qui travaille la terre. « Cultivateur » convient bien à l’image agricole et reste courant en français international.
- source_word: δεῖ
  choice: Il faut que
  rationale: Cette tournure exprime clairement la nécessité ou l’obligation portée par le grec.
- source_word: πρῶτον
  choice: le premier
  rationale: Dans la syntaxe la plus naturelle, l’adverbe marque la priorité du cultivateur dans la participation aux récoltes, plutôt que l’antériorité de son travail.
- source_word: τῶν καρπῶν (καρπός)
  choice: des récoltes
  rationale: Dans ce contexte agricole, « récoltes » rend le produit de la terre plus naturellement que le sens littéral plus étroit de « fruits ».
- source_word: μεταλαμβάνειν (μεταλαμβάνω)
  choice: à recevoir une part
  rationale: Le verbe, avec le génitif partitif, signifie participer à quelque chose ou en prendre une part. Cette formulation explicite ce rapport en français clair.
theological_decisions:
- issue: Sens de l’énoncé proverbial
  choice: Celui qui peine à cultiver doit avoir la priorité pour participer au produit de son travail.
  alternative: Le cultivateur doit d’abord travailler avant de prendre part aux récoltes.
  rationale: 'L’ordre des mots et la syntaxe grecs rattachent le plus naturellement πρῶτον à μεταλαμβάνειν : l’accent porte donc sur la priorité dans la participation, sans effacer entièrement l’autre compréhension possible.'
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure proverbiale et la force de nécessité, tout en employant un vocabulaire agricole immédiatement compréhensible.
