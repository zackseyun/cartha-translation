lexical_decisions:
- source_word: ἄστοργοι
  choice: sans affection pour leurs proches
  rationale: Le terme désigne l’absence de l’affection naturelle attendue notamment envers la famille et les proches. Cette formulation en exprime la portée relationnelle dans un français actuel sans la réduire aux seuls liens biologiques.
- source_word: ἄσπονδοι
  choice: intraitables
  rationale: Le mot décrit des personnes qui refusent tout accord ou toute réconciliation. « Intraitables » est idiomatique et conserve l’idée d’une disposition implacable, tandis que les autres possibilités sont signalées en note.
- source_word: διάβολοι
  choice: calomniateurs
  rationale: Dans cette liste de vices, le pluriel désigne des personnes qui accusent faussement ou calomnient, et non le diable. Le nom français s’intègre naturellement à la série de qualificatifs.
- source_word: ἀκρατεῖς
  choice: sans maîtrise d’eux-mêmes
  rationale: Le terme exprime l’incapacité à maîtriser ses désirs ou ses impulsions. Cette tournure est claire et courante en français moderne.
- source_word: ἀνήμεροι
  choice: brutaux
  rationale: L’adjectif signifie indomptés, féroces ou sauvages. « Brutaux » rend nettement cette dureté violente sans connotation culturelle parasite.
- source_word: ἀφιλάγαθοι
  choice: sans amour pour le bien
  rationale: Le composé nie l’attachement à ce qui est bon. La formulation respecte cette valeur privative sans la renforcer automatiquement en haine active.
theological_decisions:
- issue: Sens de διάβολοι dans la liste de vices
  choice: « calomniateurs », comme désignation morale de personnes
  alternative: « diables » ou « diaboliques »
  rationale: Le pluriel, placé parmi des qualificatifs décrivant des comportements humains, a ici son sens courant d’accusateurs ou de calomniateurs. Le traduire par « diables » ferait à tort penser à des êtres démoniaques.
- issue: Force de ἀφιλάγαθοι
  choice: absence d’amour pour le bien
  alternative: haine active du bien
  rationale: La morphologie du mot exprime directement le manque d’amour pour ce qui est bon. Une haine active est possible comme implication contextuelle, mais elle ne doit pas être imposée dans le texte principal.
translation_notes:
  register: Liste concise et rythmée, dans un français moderne, digne et accessible. Les noms et groupes adjectivaux ont été choisis pour s’enchaîner naturellement avec le contexte de 2 Timothée 3. Les notes préservent les principales nuances lexicales sans surcharger le texte.
