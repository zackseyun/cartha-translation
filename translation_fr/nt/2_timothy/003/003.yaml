translation:
  language: fr
  text: sans affection pour leurs proches, irréconciliables[a], calomniateurs[b], sans maîtrise d’eux-mêmes, brutaux, sans amour pour le bien[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « implacables », « ennemis de tout accord » ou « qui ne respectent pas les trêves ».
    reason: lexical_alternative
  - marker: b
