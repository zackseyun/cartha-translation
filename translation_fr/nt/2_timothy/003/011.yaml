source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: fr
  text: les persécutions, les souffrances qui m’ont frappé à Antioche, à Iconium, à Lystres — quelles persécutions j’ai endurées ![a] Et le Seigneur[b] m’a délivré de tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les persécutions que j’ai endurées » ; la tournure grecque peut aussi souligner leur nature ou leur intensité.'
    reason: lexical_alternative
  - marker: b
    text: « Le Seigneur » désigne probablement le Seigneur Jésus, bien que le texte grec dise seulement « le Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς διωγμοῖς / οἵους διωγμούς
  choice: les persécutions / quelles persécutions
  rationale: « Persécutions » exprime naturellement l’hostilité et l’oppression subies en raison de la mission de Paul. Dans la seconde occurrence, « quelles persécutions » conserve la force qualitative, voire exclamative, de οἵους.
- source_word: τοῖς παθήμασιν
  choice: les souffrances
  rationale: Le terme désigne largement les expériences douloureuses et ne doit pas être réduit aux seules épreuves extérieures.
- source_word: οἷά μοι ἐγένετο
  choice: qui m’ont frappé
  rationale: Cette tournure française naturelle rend l’idée d’événements pénibles survenus à Paul tout en reliant clairement les souffrances aux lieux cités.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: à Antioche, à Iconium, à Lystres
  rationale: Les formes françaises usuelles des noms de lieux sont retenues. En français, « à » est la préposition idiomatique devant ces villes.
- source_word: ὑπήνεγκα
  choice: j’ai endurées
  rationale: « Endurer » rend avec concision l’idée de supporter des persécutions sous la pression.
- source_word: ἐκ πάντων
  choice: de toutes
  rationale: Le féminin pluriel renvoie naturellement aux persécutions mentionnées, tout en gardant la formule concise du grec. La délivrance peut être comprise comme ayant eu lieu au sein de chacune d’elles, non comme l’absence de souffrance.
- source_word: ἐρρύσατο
  choice: m’a délivré
  rationale: « Délivrer » exprime le fait de tirer quelqu’un du danger sans introduire ici les connotations plus générales que pourrait porter « sauver ».
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Le titre grec est traduit tel quel, sans ajouter explicitement « Jésus », absent du texte source.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: Conserver simplement « le Seigneur » dans le texte.
  alternative: « le Seigneur Jésus »
  rationale: Dans ce contexte paulinien, le titre renvoie probablement à Jésus, mais le grec ne donne que ὁ κύριος. Le texte traduit maintient donc cette discrétion, et la note signale le référent probable sans l’imposer dans le corps du verset.
- issue: Nature de la délivrance
  choice: « m’a délivré de toutes »
  alternative: « m’a épargné toutes »
  rationale: Paul affirme avoir été délivré au travers de toutes ces persécutions, non qu’elles lui aient été épargnées. La traduction conserve cette tension entre souffrance réelle et délivrance divine.
translation_notes:
  register: Français international moderne, digne et accessible. Le point d’exclamation restitue la force qualitative de οἵους sans ajouter d’explication dans le texte. Les répétitions essentielles du grec sont maintenues, tandis que les prépositions sont adaptées à l’usage français.
