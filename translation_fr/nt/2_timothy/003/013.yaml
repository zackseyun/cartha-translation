id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: fr
  text: Mais les gens malfaisants et les imposteurs[a] iront de mal en pis[b], trompant et étant eux-mêmes trompés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « charlatans » ou « trompeurs » ; le terme grec peut désigner des fraudeurs et, dans certains contextes, comporter des connotations de sorcellerie ou de charlatanisme médical.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « progresseront vers le pire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: mauvais
  rationale: Dans « gens mauvais », l’adjectif exprime clairement la corruption morale et non une simple insuffisance de qualité.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste avec ce qui précède; « Mais » rend naturellement cette valeur adversative.
- source_word: ἄνθρωποι
  choice: gens
  rationale: Le pluriel grec désigne ici des êtres humains de manière générique, sans limiter le propos aux hommes de sexe masculin.
- source_word: γόητες
  choice: imposteurs
  rationale: Le terme désigne des individus qui abusent les autres par la fraude ou la supercherie; « imposteurs » convient au contexte sans imposer une référence explicite à la magie.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: iront de mal en pis
  rationale: Cette expression française naturelle restitue la progression ironique vers une situation moralement pire.
- source_word: πλανῶντες
  choice: trompant les autres
  rationale: Le participe présent décrit leur activité continue de tromper. L’ajout de « les autres » explicite en français l’objet implicite sans changer le sens.
- source_word: πλανώμενοι
  choice: étant eux-mêmes trompés
  rationale: Cette formulation conserve la valeur passive du participe grec et souligne que ceux qui trompent sont aussi victimes de la tromperie.
theological_decisions:
- issue: Portée du masculin grammatical dans ἄνθρωποι
  choice: gens
  alternative: hommes
  rationale: Le masculin pluriel grec a ici une portée générique. « Gens » transmet cette portée sans laisser entendre que seuls des hommes sont visés.
- issue: Nuance de γόητες
  choice: imposteurs
  alternative: charlatans, trompeurs ou sorciers
  rationale: Le mot peut évoquer des charlatans, voire avoir des connotations de magie dans certains contextes, mais le passage met surtout l’accent sur la fraude et la tromperie. « Imposteurs » préserve cette nuance sans renforcer indûment l’idée de pratique occulte.
- issue: Valeur passive de πλανώμενοι
  choice: étant eux-mêmes trompés
  alternative: s’égarant eux-mêmes
  rationale: Le passif grec maintient la tension entre leur rôle actif de trompeurs et le fait qu’ils subissent eux-mêmes la tromperie; il ne faut pas la réduire silencieusement à un sens réfléchi.
translation_notes:
  register: Français international moderne, naturel et digne. « Iront de mal en pis » est idiomatique tout en conservant l’idée de progression négative. La dernière proposition garde explicitement le contraste actif-passif du grec.
