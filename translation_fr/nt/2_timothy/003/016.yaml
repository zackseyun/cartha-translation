id: 2TI.3.16
reference: 2 Timothy 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: fr
  text: Toute Écriture est inspirée par Dieu et utile pour enseigner, pour convaincre d’erreur, pour redresser et pour former à une vie juste.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « L’ensemble des Écritures est inspiré par Dieu et utile. » Le grec peut désigner distributivement chaque texte de l’Écriture ou collectivement toutes les Écritures.'
    reason: alternative_reading
  - marker: b
    text: 'Autre construction possible : « Toute Écriture inspirée par Dieu est aussi utile pour enseigner, pour convaincre d’erreur, pour redresser et pour former à une vie juste. »'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Toute Écriture
  rationale: Cette formulation rend directement la valeur distributive possible (« chaque texte de l’Écriture »), tandis que la majuscule indique qu’il s’agit des écrits sacrés dans le contexte. La lecture collective est conservée en note.
- source_word: θεόπνευστος
  choice: inspirée par Dieu
  rationale: Expression française naturelle et consacrée qui indique que l’Écriture procède de Dieu. Une traduction littérale comme « soufflée par Dieu » serait peu idiomatique et risquerait d’obscurcir le sens.
- source_word: ὠφέλιμος
  choice: utile
  rationale: « Utile » exprime clairement en français moderne ce qui est bénéfique et propre aux usages énumérés ensuite.
- source_word: πρὸς διδασκαλίαν
  choice: pour enseigner
  rationale: L’infinitif français restitue naturellement la fonction de l’Écriture sans réduire διδασκαλία à la seule notion technique de doctrine.
- source_word: ἐλεγμόν
  choice: pour convaincre d’erreur
  rationale: La formule exprime l’idée de mettre une faute ou une erreur en lumière. Elle est plus précise ici que « réprimander », qui évoquerait surtout une parole sévère adressée à quelqu’un.
- source_word: ἐπανόρθωσιν
  choice: pour redresser
  rationale: « Redresser » conserve l’image de remettre droit ou de rétablir ce qui ne l’est plus, tout en restant concis et naturel dans l’énumération.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: pour former à une vie juste
  rationale: « Former » rend la dimension durable et éducative de παιδεία, et « une vie juste » communique ici la conduite droite visée par δικαιοσύνη sans employer une tournure française abstraite ou ambiguë.
theological_decisions:
- issue: Relation syntaxique de θεόπνευστος et ὠφέλιμος avec πᾶσα γραφή
  choice: 'Les deux adjectifs sont compris comme prédicats : « Toute Écriture est inspirée par Dieu et utile. »'
  alternative: « Toute Écriture inspirée par Dieu est aussi utile… »
  rationale: La lecture prédicative met les deux adjectifs en parallèle et s’accorde naturellement avec la suite du raisonnement. La construction attributive demeure grammaticalement possible et est donc signalée en note sans être exclue.
- issue: Valeur distributive ou collective de πᾶσα γραφή
  choice: « Toute Écriture », avec une valeur distributive possible
  alternative: « L’ensemble des Écritures » ou « Toute l’Écriture »
  rationale: Le grec sans article peut viser chaque passage des écrits sacrés ou, par extension, leur ensemble. Le texte principal suit de près la forme grecque, et la lecture collective est préservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le rythme de l’énumération grecque grâce à la répétition de « pour ». « Inspirée par Dieu » privilégie l’expression française naturelle, tandis que les notes préservent les deux principales ambiguïtés syntaxiques du verset.
