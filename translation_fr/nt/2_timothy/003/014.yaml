id: 2TI.3.14
reference: 2 Timothy 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: fr
  text: Mais toi, demeure dans ce que tu as appris et dont tu as acquis la conviction[a], sachant de qui tu l’as appris[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et dont tu as reçu l’assurance ».'
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent ici le singulier, souvent compris comme désignant Paul; le pluriel du texte suivi peut renvoyer plus largement aux personnes qui ont enseigné Timothée.
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: Le pronom explicite met Timothée en relief, tandis que δέ marque le contraste avec les personnes décrites auparavant. « Mais toi » rend cette opposition avec naturel et concision.
- source_word: μένε ἐν οἷς
  choice: demeure dans ce que
  rationale: Le présent impératif appelle à une persévérance continue. « Demeure dans » conserve l’image exprimée par μένω suivi de ἐν, dans un registre digne mais accessible.
- source_word: ἔμαθες
  choice: tu as appris
  rationale: Le passé composé exprime naturellement en français un apprentissage antérieur dont les effets demeurent pertinents.
- source_word: ἐπιστώθης
  choice: dont tu as acquis la conviction
  rationale: Le passif de πιστόω évoque ici l’assurance ou la ferme conviction acquise au sujet de l’enseignement reçu. Cette formulation s’enchaîne naturellement avec « ce que tu as appris » sans suggérer une mission qui lui aurait été confiée.
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe français conserve la formulation compacte du grec et laisse ouverte la nuance exacte du rapport logique, qu’elle soit explicative ou circonstancielle.
- source_word: παρὰ τίνων
  choice: de qui
  rationale: παρά avec le génitif indique la source. En français, « de qui » est naturel et ne précise pas l’identité des personnes concernées; sa forme demeure identique que le référent soit singulier ou pluriel.
- source_word: ἔμαθες
  choice: tu l’as appris
  rationale: Le pronom « l’ » reprend clairement le contenu de l’enseignement déjà mentionné et rend la répétition idiomatique en français.
theological_decisions:
- issue: Référent de παρὰ τίνων
  choice: Traduire sans identifier les personnes auprès desquelles Timothée a appris.
  alternative: Comprendre le pluriel comme visant plusieurs enseignants, notamment Paul et des membres de la famille de Timothée; ou suivre la variante au singulier, souvent rapportée à Paul.
  rationale: Le verset ne nomme pas le référent. Le texte du SBLGNT porte le pluriel, mais la formule française « de qui » préserve l’ouverture du texte sans imposer une identification particulière.
translation_notes:
  register: Français international actuel, clair et digne. « Demeure » préserve la métaphore du grec sans archaïsme excessif; la phrase garde la concision et l’ambiguïté référentielle de l’original.
