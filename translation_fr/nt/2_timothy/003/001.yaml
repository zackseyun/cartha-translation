id: 2TI.3.1
reference: 2 Timothy 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: fr
  text: 'Mais sache ceci : dans les derniers jours, des temps difficiles viendront[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des temps dangereux » ou « des temps pénibles ». L’adjectif grec peut désigner des temps difficiles, dangereux ou éprouvants.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ceci
  rationale: Le démonstratif neutre annonce le contenu introduit par ὅτι. « Ceci » convient naturellement avant les deux-points.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une transition avec une légère nuance de contraste par rapport au contexte précédent.
- source_word: γίνωσκε
  choice: sache
  rationale: L’impératif présent à la deuxième personne du singulier appelle Timothée à reconnaître et à garder présente cette réalité. « Sache » est direct, naturel et fidèle.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu de « sache ceci ».
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: dans les derniers jours
  rationale: Cette formulation établie préserve l’expression eschatologique grecque sans en préciser davantage la portée chronologique.
- source_word: ἐνστήσονται
  choice: viendront
  rationale: Le futur de ἐνίστημι indique ici que ces temps surviendront ou deviendront présents. « Viendront » est idiomatique avec « des temps ».
- source_word: καιροὶ
  choice: des temps
  rationale: καιρός désigne des périodes ou des circonstances marquantes plutôt que le temps chronologique abstrait. « Des temps » convient à cette tournure.
- source_word: χαλεποί
  choice: difficiles
  rationale: χαλεπός peut qualifier ce qui est pénible, dur ou dangereux. « Difficiles » restitue le sens large en français moderne, tandis que la note signale les nuances plus fortes.
theological_decisions:
- issue: Portée de l’expression « les derniers jours »
  choice: Conserver « dans les derniers jours » sans limiter l’expression à la période immédiatement antérieure au retour du Christ.
  alternative: Préciser soit la période finale avant la fin, soit l’ensemble de l’ère eschatologique déjà commencée.
  rationale: Le grec laisse subsister une tension entre une portée eschatologique large et une concentration sur la fin. La traduction ne tranche pas en faveur d’un système particulier.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la structure d’exhortation du grec et l’expression théologiquement chargée « les derniers jours », tout en explicitant en note l’étendue sémantique de χαλεποί.
