id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: fr
  text: Mais ils ne progresseront pas davantage[a], car leur folie sera évidente pour tous, tout comme celle de ces hommes[b] est devenue évidente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : ils n’iront pas plus loin.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de Jannès et Jambrès, mentionnés au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: progresseront
  rationale: Le verbe προκόπτω exprime l’idée d’avancer ou de faire des progrès. « Progresseront » conserve cette image sans suggérer que leur évolution est moralement positive.
- source_word: ἐπὶ πλεῖον
  choice: davantage
  rationale: Avec la négation, l’expression signifie « pas davantage » ou « pas plus loin ». Ce choix est naturel en français et indique que leur progression sera limitée.
- source_word: ἄνοια
  choice: folie
  rationale: Ἄνοια désigne un manque de discernement, une déraison ou une folie. « Folie » rend clairement ici sa dimension à la fois intellectuelle et morale.
- source_word: ἔκδηλος
  choice: évidente
  rationale: Ἔκδηλος signifie manifeste, clairement reconnaissable. « Évidente » est courant, précis et convient à la construction « pour tous ».
- source_word: πᾶσιν
  choice: pour tous
  rationale: Le datif pluriel indique que leur folie deviendra évidente aux yeux de l’ensemble des personnes concernées. « Pour tous » conserve la portée générale du grec.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: tout comme celle de ces hommes est devenue évidente
  rationale: 'Le grec est elliptique : « celle » reprend « folie », et ἐκείνων renvoie aux hommes mentionnés juste avant. La répétition de « évidente » explicite naturellement en français le complément sous-entendu, tandis que « tout comme » rend aussi la valeur de καί.'
theological_decisions:
- issue: Référent de ἐκείνων
  choice: « ces hommes » renvoie à Jannès et Jambrès, mentionnés au verset précédent
  alternative: Une allusion plus générale à d’anciens faux enseignants
  rationale: Le contexte immédiat nomme Jannès et Jambrès en 3.8 et compare leur opposition à celle des personnes visées ici. Le texte principal garde toutefois la désignation anaphorique « ces hommes », tandis que la note précise le référent contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la métaphore de la progression, le caractère futur de l’exposition de leur folie et le lien comparatif avec les deux hommes du verset précédent.
