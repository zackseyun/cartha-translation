source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: fr
  text: Car les gens seront égoïstes, amis de l’argent, vantards, arrogants, injurieux[a], désobéissants à leurs parents, ingrats, sans respect pour ce qui est saint,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « blasphémateurs » ou « calomniateurs ». Le terme grec peut désigner des paroles qui déshonorent soit des personnes, soit Dieu.
    reason: Alternative lexicale préservant l’étendue sémantique de βλάσφημοι.
lexical_decisions:
- source_word: ἔσονται
  choice: seront
  rationale: Le futur de εἰμί appelle ici le futur simple « seront », naturel et fidèle à la construction de la liste.
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve la valeur explicative du lien avec l’énoncé précédent sans la surinterpréter.
- source_word: οἱ ἄνθρωποι
  choice: les gens
  rationale: L’expression désigne ici les êtres humains de manière générique, et non les hommes au sens masculin.
- source_word: φίλαυτοι
  choice: égoïstes
  rationale: Le composé décrit un amour de soi moralement déréglé. « Égoïstes » en donne le sens clairement et naturellement en français actuel.
- source_word: φιλάργυροι
  choice: amis de l’argent
  rationale: Cette formulation garde l’idée littérale d’attachement à l’argent et fait écho au composé grec, sans l’élargir simplement à toute forme d’avidité.
- source_word: ἀλαζόνες
  choice: vantards
  rationale: Le terme évoque ceux qui se glorifient avec ostentation ou prétention. « Vantards » est direct et convient au rythme de l’énumération.
- source_word: ὑπερήφανοι
  choice: arrogants
  rationale: « Arrogants » exprime nettement la valeur morale négative du mot grec.
- source_word: βλάσφημοι
  choice: calomniateurs
  rationale: Le terme peut désigner une parole qui porte atteinte à des personnes ou à Dieu. « Calomniateurs » convient au contexte relationnel, tandis qu’une note préserve l’étendue du sens.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: désobéissants à leurs parents
  rationale: Traduction française naturelle de l’adjectif construit avec le datif; le possessif explicite la relation sans modifier le sens.
- source_word: ἀχάριστοι
  choice: ingrats
  rationale: « Ingrats » rend de façon concise et courante l’absence de reconnaissance.
- source_word: ἀνόσιοι
  choice: sans respect pour ce qui est saint
  rationale: Cette expression rend l’absence de piété et de respect envers le sacré, dans une langue claire, sans réduire le terme à une étiquette confessionnelle.
theological_decisions:
- issue: Portée générique de οἱ ἄνθρωποι
  choice: les gens
  alternative: les hommes; les êtres humains
  rationale: Le masculin grammatical a ici une portée générique. « Les gens » communique cette portée en français courant sans la limiter aux personnes de sexe masculin.
- issue: Sens de βλάσφημοι dans la liste de vices
  choice: calomniateurs
  alternative: blasphémateurs; injurieux
  rationale: Le grec peut viser des paroles qui déshonorent aussi bien des personnes que Dieu. Le texte principal retient la dimension interpersonnelle probable, et la note maintient l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. L’énumération demeure concise et rythmée. La virgule finale est conservée, puisque le verset se poursuit dans le contexte syntaxique de la liste.
