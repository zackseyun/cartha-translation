  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: fr
  text: toujours en train d’apprendre, sans jamais pouvoir parvenir à la connaissance de la vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à une pleine connaissance de la vérité ». Le mot grec peut désigner une connaissance plus pleine ou plus complète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: toujours
  rationale: Rend directement l’idée d’une action constamment répétée et maintient le contraste marqué avec μηδέποτε.
- source_word: μανθάνοντα
  choice: en train d’apprendre
  rationale: Le participe présent exprime un apprentissage continu. Cette formulation française conserve cet aspect sans préciser indûment s’il s’agit d’un enseignement formel ou d’une étude personnelle.
- source_word: καὶ μηδέποτε
  choice: sans jamais
  rationale: Dans ce contexte, « sans jamais » relie naturellement en français l’apprentissage continuel à l’incapacité qui lui fait contraste, tout en conservant la force temporelle absolue de μηδέποτε.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: à la connaissance de la vérité
  rationale: La préposition εἰς avec ἐλθεῖν évoque l’aboutissement à une connaissance réelle. « La vérité » est l’expression française naturelle dans ce contexte paulinien. La nuance possible de connaissance pleine ou approfondie est signalée en note.
- source_word: ἐλθεῖν
  choice: parvenir
  rationale: « Parvenir à » rend idiomatiquement en français le mouvement vers un but exprimé par ἐλθεῖν εἰς, sans transformer la connaissance en simple acquisition intellectuelle.
- source_word: δυνάμενα
  choice: pouvoir
  rationale: L’infinitif français après « sans jamais » exprime naturellement la capacité visée par le participe grec. Le sujet, repris du verset précédent, n’a pas besoin d’être répété dans ce fragment syntaxique.
theological_decisions:
- issue: Nuance de ἐπίγνωσις dans l’usage paulinien
  choice: connaissance
  alternative: pleine connaissance
  rationale: Le terme peut suggérer une connaissance plus pleine ou véritable, mais le contexte insiste d’abord sur l’impossibilité d’atteindre la connaissance de la vérité malgré un apprentissage constant. Le texte principal évite donc de surinterpréter cette nuance, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français moderne, digne et courant. La formulation conserve le caractère de proposition dépendante du verset précédent, ainsi que le contraste rhétorique entre « toujours » et « jamais ».
