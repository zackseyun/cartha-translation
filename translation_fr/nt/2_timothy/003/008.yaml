revisions:
- from: De même que Jannès et Jambrès se sont opposés à Moïse[a], de même ces hommes s’opposent à la vérité. Ce sont des hommes dont l’intelligence est corrompue et qui sont disqualifiés en ce qui concerne la foi[b].
  to: De même que Jannès et Jambrès se sont opposés à Moïse[a], de même ces hommes s’opposent à la vérité — des hommes dont l’intelligence est corrompue et qui sont disqualifiés à l’égard de la foi[b].
  rationale: La révision corrige l’ancrage de la note b et remplace la reprise indépendante « Ce sont des hommes » par une apposition plus proche de la syntaxe et du mouvement du grec. Elle conserve l’ambiguïté de « la vérité » et de « la foi », ainsi que le sens évaluatif de ἀδόκιμοι.
