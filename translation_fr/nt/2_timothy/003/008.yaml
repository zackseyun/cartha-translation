review_pass:
  verdict: revise
  source_fidelity: La comparaison corrélative (« De même que … de même »), l’opposition passée à Moïse et présente à la vérité, ainsi que les qualifications finales, rendent fidèlement le grec. « Disqualifiés en ce qui concerne la foi » est défendable pour ἀδόκιμοι περὶ τὴν πίστιν, mais « à l’égard de la foi » est plus direct et moins administratif.
  naturalness: La phrase explicative « Ce sont des hommes » ajoute une rupture et une répétition absentes du grec. Une apposition introduite par un tiret restitue plus naturellement la construction participiale française tout en gardant le rythme de l’original.
  terminology: « Jannès », « Jambrès », « Moïse », « la vérité » et « la foi » conviennent. « L’intelligence est corrompue » rend bien τὸν νοῦν sans réduire le terme à une faculté strictement intellectuelle. L’ancre b doit suivre « la foi », car la note explique cette expression, non « l’intelligence ».
  issues:
  - severity: medium
    issue: L’ancre de la note b est placée après « corrompue ».
    rationale: La note b porte sur « la foi »; son emplacement actuel peut faire croire qu’elle explique « l’intelligence est corrompue ». Il faut l’attacher à « la foi ».
  - severity: low
    issue: « Ce sont des hommes » répète inutilement « ces hommes » et détache l’apposition grecque.
    rationale: ἄνθρωποι κατεφθαρμένοι… est une apposition descriptive. Un tiret suivi de « des hommes… » conserve ce lien de manière plus idiomatique.
  revised_text: De même que Jannès et Jambrès se sont opposés à Moïse[a], de même ces hommes s’opposent à la vérité — des hommes dont l’intelligence est corrompue et qui sont disqualifiés à l’égard de la foi[b].
