source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: fr
  text: De même que Jannès et Jambrès se sont opposés à Moïse[a], de même ces hommes s’opposent à la vérité — des hommes dont l’intelligence est corrompue et qui sont disqualifiés à l’égard de la foi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont résisté à Moïse »; de même, plus loin, « résistent à la vérité ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « la foi » désigne probablement la foi chrétienne ou le message apostolique, plutôt que la seule confiance personnelle.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: De même que
  rationale: La locution introduit une comparaison. « De même que » en rend naturellement la force; δέ marque ici une légère progression du discours et n’exige pas un connecteur français distinct.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Jannès et Jambrès
  rationale: Translittération française usuelle de ces noms propres.
- source_word: ἀντέστησαν Μωϋσεῖ
  choice: se sont opposés à Moïse
  rationale: Le verbe exprime une opposition active; le passé composé convient à l’aoriste dans un récit évoqué en français courant.
- source_word: οὕτως καὶ οὗτοι
  choice: de même ces hommes
  rationale: Reprend explicitement la comparaison et rend le référent masculin pluriel dans ce contexte.
- source_word: ἀνθίστανται τῇ ἀληθείᾳ
  choice: s’opposent à la vérité
  rationale: Le présent indique une opposition en cours. « La vérité » conserve la portée large du grec sans la réduire explicitement au message apostolique.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: des hommes dont l’intelligence est corrompue
  rationale: Le participe parfait décrit un état résultant d’une corruption; νοῦς désigne ici la faculté de comprendre et de juger. La tournure relative est naturelle en français.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: disqualifiés en ce qui concerne la foi
  rationale: ἀδόκιμοι désigne ceux qui ne passent pas l’épreuve ou ne sont pas reconnus comme approuvés. La formulation conserve aussi la relation générale exprimée par περί.
theological_decisions:
- issue: Portée de « la vérité » et de « la foi »
  choice: Conserver les expressions larges « la vérité » et « la foi » dans le texte principal.
  alternative: Préciser « la vérité de l’Évangile » et « la foi chrétienne », ou comprendre « foi » comme la confiance personnelle.
  rationale: Le contexte vise probablement le message apostolique et la foi chrétienne comme contenu reconnu, mais le grec demeure assez large; la traduction ne tranche donc pas davantage que le texte source.
- issue: Genre de ἄνθρωποι
  choice: Rendre le terme par « hommes ».
  alternative: « personnes » ou « gens »
  rationale: Dans le contexte, le démonstratif masculin renvoie aux faux enseignants dont il est question; « hommes » maintient cette référence contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative est conservée, tandis que la seconde moitié est légèrement déployée en proposition relative pour éviter une accumulation peu naturelle en français.
