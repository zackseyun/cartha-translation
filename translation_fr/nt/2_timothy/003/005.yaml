    rationale: Le grec αὐτῆς renvoie à εὐσεβείας. Dans « en ayant renié la puissance », « en » fonctionne comme marqueur du participe/gérondif et ne peut pas naturellement porter cette référence possessive. « Sa puissance » rend l’antécédent sans ambiguïté dans cette construction.
  - severity: low
    issue: « aussi » dépasse la simple coordination de καί.
    rationale: Le texte source commande « et » sans nécessairement ajouter l’idée de « également ». Le retirer est plus sobre et plus proche du grec.
  - severity: low
    issue: La note a est attachée à un emplacement qui ne correspond pas principalement à son contenu lexical.
    rationale: La note propose « apparence » comme alternative de μόρφωσις ; son ancre doit donc suivre « forme ».
