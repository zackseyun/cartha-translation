  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: fr
  text: ayant une forme[a] de piété, mais ayant renié sa puissance. Et détourne-toi de ces gens-là[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une apparence de piété ». Le grec peut désigner une forme, une expression ou une apparence extérieure ; « forme » préserve le contraste avec « puissance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Évite ces gens-là » ou « Tiens-toi à l’écart de ces gens-là ». Le verbe grec signifie se détourner soi-même de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: ayant
  rationale: Participe présent rattaché aux personnes décrites dans le contexte précédent; « ayant » garde naturellement la construction participiale.
- source_word: μόρφωσιν
  choice: une forme
  rationale: « Forme » préserve le contraste entre la configuration extérieure de la piété et sa puissance effective, sans réduire le mot à une simple apparence trompeuse.
- source_word: εὐσεβείας
  choice: de piété
  rationale: Dans les Pastorales, le terme désigne une vie de respect et de dévouement envers Dieu; « piété » est ici précis, digne et idiomatique en français.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: mais en ayant renié la puissance
  rationale: « La puissance » conserve la portée large de δύναμις et le pronom « en » reprend clairement « piété », tout en évitant le tour peu naturel « sa puissance », qui pourrait sembler renvoyer aux personnes.
- source_word: ἠρνημένοι
  choice: en ayant renié
  rationale: Le participe parfait exprime un reniement accompli dont la posture demeure; le participe composé français en rend mieux l'aspect qu'un simple présent.
- source_word: καὶ τούτους ἀποτρέπου
  choice: Détourne-toi aussi de ces gens-là
  rationale: Le présent impératif moyen appelle Timothée à se détourner lui-même de ces personnes; « ces gens-là » explicite naturellement le référent humain masculin pluriel.
theological_decisions:
- issue: Contraste entre forme extérieure et réalité efficace de la piété
  choice: « une forme de piété » opposée à « la puissance » de celle-ci
  alternative: « une apparence de piété »
  rationale: Cette formulation maintient la tension du grec sans décider si la « puissance » désigne plus précisément la transformation morale, l'action de l'Esprit ou les miracles.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure participiale maintient le lien avec l’énumération précédente; la seconde proposition devient une phrase impérative claire. Les marqueurs de notes figurent tous dans le texte.
