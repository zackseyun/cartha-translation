  source_fidelity: 'La formulation actuelle rend correctement l’opposition entre μόρφωσις εὐσεβείας et τὴν δύναμιν αὐτῆς ainsi que la valeur accomplie de ἠρνημένοι. Toutefois, « en ayant renié la puissance » n’exprime pas explicitement le possessif αὐτῆς : le « en » y est compris comme introduisant le gérondif et non comme reprenant « piété ». « Aussi » ajoute une nuance non requise par καί, qui est ici une simple coordination.'
  naturalness: « Ayant une forme de piété, mais ayant renié sa puissance » est clair, naturel dans une continuation de l’énumération précédente et conserve le contraste. « Et détourne-toi de ces gens-là » est un impératif idiomatique et direct.
  terminology: « Piété », « forme » et « puissance » sont des choix exacts et de registre convenable. La note sur μόρφωσις doit être ancrée à « forme », le mot qu’elle éclaire, plutôt qu’à « puissance ».
