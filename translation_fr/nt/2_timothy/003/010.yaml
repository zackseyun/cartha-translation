id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: fr
  text: Mais toi, tu as suivi de près mon enseignement, ma conduite, mon but, ma foi[a], ma patience, mon amour, ma persévérance,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidélité ». Le mot grec peut désigner ici soit la foi, soit la fidélité.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Mais toi, tu
  rationale: δέ marque le contraste avec les personnes décrites auparavant, tandis que le pronom explicite Σὺ est emphatique. La dislocation « Mais toi, tu » rend naturellement ces deux traits en français moderne.
- source_word: παρηκολούθησάς
  choice: as suivi de près
  rationale: παρακολουθέω exprime ici le fait de suivre attentivement, par l’observation et l’adhésion. Le passé composé convient naturellement à cette rétrospective épistolaire.
- source_word: μου
  choice: mon / ma
  rationale: 'Le génitif possessif se rapporte naturellement aux éléments de l’énumération : « mon enseignement, ma conduite… ».'
- source_word: διδασκαλίᾳ
  choice: enseignement
  rationale: « Enseignement » est clair, actuel et moins technique que « doctrine », tout en conservant l’idée du contenu enseigné.
- source_word: ἀγωγῇ
  choice: conduite
  rationale: ἀγωγή désigne la manière de vivre ou le comportement. « Conduite » est concis et convient à l’énumération.
- source_word: προθέσει
  choice: but
  rationale: πρόθεσις désigne ici l’intention ferme ou l’objectif de Paul. « But » est idiomatique et limpide dans cette liste.
- source_word: πίστει
  choice: foi
  rationale: πίστις peut désigner ici la foi ou la fidélité. « Foi » est retenu dans le texte, tandis que l’autre possibilité est préservée en note.
- source_word: μακροθυμίᾳ
  choice: patience
  rationale: μακροθυμία évoque la patience, notamment envers les personnes et sous la provocation. « Patience » est le terme français moderne le plus accessible.
- source_word: ἀγάπῃ
  choice: amour
  rationale: « Amour » est l’équivalent naturel et courant de ἀγάπη en français contemporain.
- source_word: ὑπομονῇ
  choice: persévérance
  rationale: ὑπομονή souligne la constance sous l’épreuve. « Persévérance » la distingue de μακροθυμία, déjà rendu par « patience ».
theological_decisions:
- issue: Sens de πίστις dans une liste de qualités paulinienne
  choice: foi
  alternative: fidélité
  rationale: Le contexte permet aussi bien l’idée de confiance croyante que celle de fidélité personnelle. Le texte principal retient « foi » sans éliminer l’autre lecture, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Mais toi, tu » préserve l’emphase et le contraste. L’énumération concise suit la structure grecque; « persévérance » évite de confondre ὑπομονή avec la « patience » de μακροθυμία.
