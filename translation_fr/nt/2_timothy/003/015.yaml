id: 2TI.3.15
reference: 2 Timothy 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: fr
  text: et que, depuis ta petite enfance, tu connais les écrits sacrés[a], qui peuvent te rendre sage en vue du salut, par la foi en Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les saintes Écritures ». Le grec dit littéralement « les écrits sacrés ».
    reason: lexical_alternative
  - marker: b
    text: Ou, moins probablement ici, « par la fidélité de Jésus le Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: depuis ta petite enfance
  rationale: βρέφος désigne un très jeune enfant, voire un nourrisson. « Depuis ta petite enfance » en conserve la force tout en restant naturel en français moderne.
- source_word: ἱερὰ γράμματα
  choice: les écrits sacrés
  rationale: Cette traduction rend directement l’expression grecque sans lui imposer d’emblée la formulation technique « les saintes Écritures ».
- source_word: οἶδας
  choice: tu connais
  rationale: Bien que parfait par la forme, οἶδα a ici un sens présent. Avec « depuis ta petite enfance », le présent français exprime naturellement une connaissance acquise et toujours possédée.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: qui peuvent te rendre sage
  rationale: Le participe se rapporte aux écrits sacrés, et σοφίζω signifie ici communiquer la sagesse ou rendre sage.
- source_word: εἰς σωτηρίαν
  choice: en vue du salut
  rationale: La formule exprime le but ou l’aboutissement; « en vue du salut » préserve cette orientation.
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: πίστις désigne le plus naturellement ici la foi ou la confiance, et διά indique le moyen.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Χριστός garde sa valeur de titre. L’ordre « Jésus le Messie » est plus naturel en français que « le Messie Jésus », tout en conservant le contenu du grec.
theological_decisions:
- issue: Valeur de Χριστός comme titre ou comme élément quasi nominal
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: « Le Messie » rend explicitement le titre grec et évite d’en faire silencieusement un simple élément de nom.
- issue: Sens de πίστεως dans διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: par la foi en Jésus le Messie
  alternative: par la fidélité de Jésus le Messie
  rationale: La construction avec ἐν désigne le plus naturellement la foi placée en Jésus le Messie. L’autre lecture, moins probable ici, est néanmoins signalée afin de ne pas effacer entièrement la tension lexicale de πίστις.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse personnelle de Paul à Timothée. La formulation conserve le lien syntaxique avec le verset précédent en commençant par « et que ».
