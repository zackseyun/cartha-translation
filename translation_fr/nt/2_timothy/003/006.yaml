id: 2TI.3.6
reference: 2 Timothy 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: fr
  text: Car certains d’entre eux s’introduisent furtivement dans les maisons et font prisonnières des femmes vulnérables[a], accablées de péchés et entraînées par toutes sortes de désirs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « petites femmes »; le terme grec est un diminutif péjoratif qui désigne ici des femmes rendues vulnérables à l’emprise de ces gens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: certains d’entre eux
  rationale: Cette tournure indique que les personnes décrites appartiennent au groupe mentionné précédemment; la formulation est naturelle en français.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: s’introduisent furtivement dans les maisons
  rationale: Le verbe évoque une entrée clandestine ou insidieuse. « Maisons » conserve le sens concret du grec tout en pouvant désigner le cadre domestique.
- source_word: αἰχμαλωτίζοντες
  choice: font prisonnières
  rationale: Le choix conserve l’image forte de la capture et de la captivité présente dans le verbe grec.
- source_word: γυναικάρια
  choice: femmes vulnérables
  rationale: Le diminutif est péjoratif et vise ici un groupe rendu susceptible à l’emprise, non les femmes en général. La note préserve la forme plus littérale.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: accablées de péchés
  rationale: Le participe parfait décrit une condition résultant d’une accumulation; « accablées » exprime naturellement le poids de ces péchés.
- source_word: ἀγόμενα
  choice: entraînées
  rationale: Le passif indique qu’elles sont menées sous l’influence de leurs désirs; « entraînées » rend cette dynamique sans préciser indûment une destination.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: par toutes sortes de désirs
  rationale: La formule restitue la diversité exprimée par ποικίλαις et garde à ἐπιθυμίαις son sens large, moralement négatif dans ce contexte.
theological_decisions:
- issue: Portée du terme péjoratif γυναικάρια
  choice: « femmes vulnérables », avec une note indiquant le littéral « petites femmes »
  alternative: « petites femmes », « femmelettes » ou « femmes faibles »
  rationale: Le texte réprouve un groupe particulier dont les imposteurs exploitent la vulnérabilité; il ne formule pas un jugement général sur toutes les femmes. « Femmelettes » préserverait le mépris mais serait inutilement insultant et moins naturel.
- issue: Force de αἰχμαλωτίζοντες
  choice: Conserver explicitement l’image de la captivité avec « font prisonnières »
  alternative: « captivent », « prennent sous leur emprise »
  rationale: L’image militaire de personnes faites captives appartient au texte et ne doit pas être atténuée en simple influence psychologique.
- issue: Sens de οἰκίας
  choice: « maisons »
  alternative: « foyers » ou « maisonnées »
  rationale: Le grec désigne directement les maisons et, par contexte, leur sphère domestique. Le choix évite de substituer au lieu concret une interprétation exclusivement sociale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le ton sévère du passage ainsi que les images d’infiltration et de captivité, sans étendre le reproche à l’ensemble des femmes.
