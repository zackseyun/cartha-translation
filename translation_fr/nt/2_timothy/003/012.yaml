  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: fr
  text: D’ailleurs, tous ceux qui veulent vivre pieusement en Jésus le Messie[a] seront persécutés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en Jésus-Christ ».'
    reason: Autre manière traditionnelle de rendre Χριστῷ Ἰησοῦ.
lexical_decisions:
- source_word: καὶ πάντες δὲ
  choice: D’ailleurs, tous
  rationale: L’association de καί et δέ relie l’affirmation au contexte précédent tout en lui donnant une nuance de confirmation. « D’ailleurs » rend naturellement cette articulation en français sans créer une opposition trop forte.
- source_word: οἱ θέλοντες
  choice: ceux qui veulent
  rationale: L’article suivi du participe présent désigne l’ensemble des personnes animées de cette volonté. « Ceux qui veulent » conserve simplement la valeur volitive de θέλω.
- source_word: ζῆν εὐσεβῶς
  choice: vivre dans la piété
  rationale: L’adverbe εὐσεβῶς décrit une manière de vivre marquée par le respect et l’attachement envers Dieu. « Vivre dans la piété » est naturel, digne et plus clair ici que l’adverbe « pieusement ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: ἐν exprime la sphère ou la relation dans laquelle cette vie est menée. Χριστός garde ici sa valeur de titre; l’ordre français naturel est donc « Jésus le Messie ».
- source_word: διωχθήσονται
  choice: seront persécutés
  rationale: Le futur passif de διώκω annonce directement qu’ils subiront la persécution.
theological_decisions:
- issue: 'Valeur de Χριστός : titre ou forme assimilée à un nom'
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le grec Χριστός signifie « Messie/Oint » et conserve ici une valeur titulaire intelligible. La variante traditionnelle « Jésus-Christ » est signalée en note sans imposer une lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, accessible et digne. « Piété » conserve la dimension religieuse et morale de εὐσεβῶς sans recourir à une tournure archaïque. La formulation reste concise et garde la portée universelle ainsi que la force certaine du futur grec.
