id: 2TI.3.17
reference: 2 Timothy 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: fr
  text: afin que l’homme de Dieu[a] soit accompli et équipé[b] pour toute bonne œuvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque est au masculin singulier et reprend probablement une désignation biblique reconnue. Elle peut viser particulièrement le serviteur de Dieu, tout en pouvant s’appliquer plus largement à la personne formée par l’Écriture.
    reason: cultural_note
  - marker: b
    text: Ou « parfaitement préparé ». Le participe grec exprime le fait d’avoir été entièrement préparé ou pourvu de tout le nécessaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit la proposition de but qui découle du verset 16 et conserve clairement la valeur finale du grec.
- source_word: ἄρτιος
  choice: accompli
  rationale: Exprime l’idée d’une personne complète, apte et pleinement qualifiée, sans suggérer ici une perfection morale absolue.
- source_word: ᾖ
  choice: soit
  rationale: Le subjonctif français convient naturellement après « afin que » et rend le subjonctif grec.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: l’homme de Dieu
  rationale: Conserve le masculin singulier du grec ainsi qu’une désignation biblique reconnue, tout en laissant une note préciser sa portée possible.
- source_word: πρὸς πᾶν ἔργον ἀγαθόν
  choice: pour toute œuvre bonne
  rationale: Rend l’orientation ou l’aptitude exprimée par πρὸς, la force distributive de πᾶν et la qualité morale de ἀγαθόν.
- source_word: ἐξηρτισμένος
  choice: équipé
  rationale: Le participe parfait passif décrit quelqu’un qui a été préparé et pourvu de ce qui est nécessaire; « équipé » est concis et garde le résultat durable de cette préparation.
theological_decisions:
- issue: Expression masculine ὁ τοῦ θεοῦ ἄνθρωπος
  choice: l’homme de Dieu
  alternative: la personne qui appartient à Dieu
  rationale: Le grec emploie une expression masculine singulière qui fait probablement écho à une désignation biblique établie. Le texte la conserve sans décider si, dans ce contexte, elle vise d’abord le serviteur de Dieu ou plus largement toute personne formée par l’Écriture.
- issue: Portée de ἄρτιος
  choice: accompli
  alternative: apte
  rationale: « Accompli » garde l’idée de complétude et de qualification pour le service, sans transformer le terme en affirmation de perfection sans péché.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle; « œuvre bonne » maintient le lien lexical avec le vocabulaire biblique courant.
