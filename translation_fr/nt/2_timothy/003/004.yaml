lexical_decisions:
- source_word: προδόται
  choice: traîtres
  rationale: Le terme désigne des personnes déloyales qui livrent ou trahissent. « Traîtres » est naturel et vigoureux dans cette liste de vices.
- source_word: προπετεῖς
  choice: irréfléchis
  rationale: Le mot décrit des personnes qui agissent impulsivement, sans mesurer les conséquences. « Irréfléchis » exprime clairement cette témérité en français moderne.
- source_word: τετυφωμένοι
  choice: enflés d’orgueil
  rationale: Le participe parfait passif conserve l’image d’un gonflement et désigne l’état de personnes devenues orgueilleuses ou prétentieuses.
- source_word: φιλήδονοι
  choice: aimant le plaisir
  rationale: Ce composé signifie « qui aiment le plaisir ». La tournure verbale française permet une opposition naturelle avec l’amour de Dieu.
- source_word: μᾶλλον ἢ
  choice: plutôt que
  rationale: La construction comparative marque ici une préférence dominante et établit un contraste net.
- source_word: φιλόθεοι
  choice: '[aimant] Dieu'
  rationale: Le composé signifie « qui aiment Dieu ». Le verbe commun, sous-entendu dans le second membre français, maintient le parallélisme sans lourdeur.
theological_decisions:
- issue: Préserver l’opposition rhétorique entre φιλήδονοι et φιλόθεοι sans ajouter de nuance doctrinale.
  choice: « aimant le plaisir plutôt que Dieu »
  alternative: « amis du plaisir plutôt qu’amis de Dieu »
  rationale: La formulation retenue reproduit directement l’opposition entre les deux objets d’amour, tout en étant plus naturelle en français courant. Elle laisse intacte la force morale du contraste.
- issue: Rendre la métaphore de τετυφωμένοι.
  choice: « enflés d’orgueil »
  alternative: « prétentieux »
  rationale: La traduction choisie garde l’image grecque tout en explicitant que le gonflement est celui de l’orgueil.
translation_notes:
  register: Français international moderne, digne et accessible. La structure brève de la liste est conservée, ainsi que l’image de l’orgueil qui enfle. La dernière opposition est formulée avec un seul verbe coordonnant naturellement les deux objets.
