  text: προδόται, προπετεῖς, τετυφωμένοι, φιλήδονοι μᾶλλον ἢ φιλόθεοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/004.yaml
  text: traitors[a], reckless, puffed up, lovers of pleasure rather than lovers of God[c][b],
translation:
  language: fr
  text: traîtres[a], irréfléchis[b], enflés d’orgueil[c], aimant le plaisir plutôt que Dieu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « personnes qui trahissent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « téméraires » ou « impulsifs ».
