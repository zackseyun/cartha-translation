id: ACT.23.33
reference: Acts 23:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: fr
  text: Ils entrèrent dans Césarée, remirent la lettre au gouverneur et lui présentèrent aussi Paul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: ils
  rationale: Le pronom reprend les hommes chargés de l’escorte au verset précédent; le français naturel emploie ici un sujet explicite.
- source_word: εἰσελθόντες
  choice: entrèrent
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux; une proposition coordonnée au passé simple rend naturellement la progression narrative.
- source_word: Καισάρειαν
  choice: Césarée
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: ἀναδόντες
  choice: remirent
  rationale: Dans le contexte de la transmission officielle d’une lettre à une autorité, « remettre » exprime clairement la remise en mains propres sans surtraduction.
- source_word: ἐπιστολήν
  choice: la lettre
  rationale: « Lettre » est le terme courant et précis pour cet écrit officiel déjà mentionné.
- source_word: ἡγεμόνι
  choice: au gouverneur
  rationale: « Gouverneur » désigne avec justesse et clarté l’autorité provinciale romaine, ici Félix.
- source_word: παρέστησαν
  choice: présentèrent
  rationale: Dans ce cadre officiel et judiciaire, le verbe signifie faire comparaître ou présenter quelqu’un devant une autorité; « présenter » conserve la formulation sobre du grec.
- source_word: καὶ
  choice: aussi
  rationale: 'Le second καί est additif: en plus de remettre la lettre, les hommes présentent Paul.'
- source_word: Παῦλον
  choice: Paul
  rationale: Forme française traditionnelle du nom Παῦλος.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie au gouverneur et s’emploie naturellement comme complément de « présentèrent ».
