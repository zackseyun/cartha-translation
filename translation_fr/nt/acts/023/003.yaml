id: ACT.23.3
reference: Acts 23:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: fr
  text: 'Alors Paul lui dit : « Dieu va te frapper[a], mur blanchi ! Et toi, tu sièges pour me juger conformément à la Loi et, au mépris de la Loi, tu ordonnes qu’on me frappe ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Dieu est sur le point de te frapper » ; le grec peut souligner l’imminence de l’action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: Dieu va te frapper
  rationale: La construction μέλλει avec l’infinitif exprime ici une action imminente ou destinée à se produire. « Va te frapper » garde cette nuance en français naturel, sans réduire la déclaration à un simple souhait.
- source_word: τοῖχε κεκονιαμένε
  choice: mur blanchi
  rationale: L’expression conserve l’image concrète d’un mur recouvert de chaux et la force de l’apostrophe. « Blanchi » reflète l’état résultant exprimé par le participe parfait, sans expliciter dans le texte une corruption intérieure seulement suggérée par la métaphore.
- source_word: κάθῃ
  choice: tu sièges
  rationale: Dans ce contexte judiciaire, « siéger » restitue à la fois la posture et la fonction de celui qui rend un jugement, tout en gardant la vivacité de la question rhétorique.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: pour me juger conformément à la Loi
  rationale: « Conformément à » exprime précisément l’idée d’un jugement censé suivre la norme légale. La majuscule à « Loi » indique ici la Loi juive dans ce contexte.
- source_word: παρανομῶν
  choice: au mépris de la Loi
  rationale: La formule rend l’action contraire à la Loi et maintient le contraste marqué avec « conformément à la Loi », dans un français ferme et naturel.
- source_word: κελεύεις με τύπτεσθαι
  choice: tu ordonnes qu’on me frappe
  rationale: Cette tournure française naturelle conserve l’ordre donné ainsi que le fait que Paul subit l’action, sans identifier l’exécutant.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: Alors Paul lui dit
  rationale: Traduction directe et idiomatique de l’introduction narrative, sans ajout interprétatif.
theological_decisions:
- issue: Nature de la déclaration « Dieu va te frapper »
  choice: Déclaration d’une action divine imminente ou à venir
  alternative: 'Imprécation : « Que Dieu te frappe »'
  rationale: La construction grecque μέλλει + infinitif énonce plus naturellement une action sur le point de se produire qu’un souhait. La traduction ne tranche pas la question de la légitimité morale de la parole de Paul.
translation_notes:
  register: Français international moderne, digne et oralement intelligible. La formulation conserve l’apostrophe incisive et le contraste juridique du grec. Le marqueur de note est placé après l’ensemble de la citation à laquelle il se rapporte.
