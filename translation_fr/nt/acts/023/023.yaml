review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement les effectifs, les trois catégories de troupes, Césarée et l'indication temporelle. « Tenez prêts » atténue toutefois l'impératif ἑτοιμάσατε, qui ordonne de préparer/de mettre en état de départ les troupes. Une formulation où « pour se rendre jusqu’à Césarée » porte clairement sur l'ensemble du détachement reflète mieux la syntaxe et le sens.
  naturalness: La formulation révisée est naturelle en français international moderne et conserve le ton concis d'un ordre militaire. « Préparez ... pour se rendre » est plus idiomatique et plus exact que « Tenez prêts ... pour aller ».
  terminology: « Centurions », « cavaliers » et « Césarée » conviennent. « Hommes armés de lances » est une solution lisible pour δεξιολάβους, à condition que la note signale explicitement l'incertitude lexicale. L'alternative est rendue plus littéralement comme « gardes de la main droite », sans prétendre résoudre le sens du terme rare.
  issues:
  - severity: medium
    issue: « Tenez prêts » pour Ἑτοιμάσατε
    rationale: Cette expression peut signifier maintenir déjà prêts, alors que le grec donne l'ordre de préparer le contingent. « Préparez » restitue plus directement l'impératif.
  - severity: low
    issue: Portée de « pour aller »
    rationale: Dans la phrase initiale, « pour aller » suit immédiatement « soldats » et peut se lire comme ne qualifiant que ceux-ci. Le déplacement concerne les soldats, les cavaliers et les δεξιολάβοι.
  - severity: low
    issue: Alternative de note « gardes du flanc droit »
    rationale: « Flanc droit » interprète davantage le composé que ne le permet le terme rare et disputé. Une formulation plus littérale, accompagnée d'un avertissement d'incertitude, préserve mieux l'ambiguïté.
