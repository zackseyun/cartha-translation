- from: 'Puis il appela deux des centurions et leur dit : « Tenez prêts deux cents soldats pour aller jusqu’à Césarée, ainsi que soixante-dix cavaliers et deux cents hommes armés de lances[a], à partir de la troisième heure de la nuit[b]. »'
  to: 'Puis il appela deux des centurions et leur dit : « Préparez, pour se rendre jusqu’à Césarée, deux cents soldats, soixante-dix cavaliers et deux cents hommes armés de lances[a], à partir de la troisième heure de la nuit[b]. »'
  rationale: La révision restitue plus exactement l'ordre de préparer le détachement et clarifie que tous les groupes doivent se rendre à Césarée. Elle maintient l'incertitude reconnue de δεξιολάβους dans une note moins interprétative, sans modifier le sens du passage ni l'ancrage des notes.
