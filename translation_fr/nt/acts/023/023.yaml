  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: fr
  text: 'Puis il appela deux des centurions et leur dit : « Préparez, pour se rendre jusqu’à Césarée, deux cents soldats, soixante-dix cavaliers et deux cents hommes armés de lances[a], à partir de la troisième heure de la nuit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux cents gardes de la main droite » ; le sens précis du terme grec rare rendu par « hommes armés de lances » est incertain.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire vers la troisième heure après le début de la nuit, soit approximativement 21 heures selon la manière juive de compter les heures.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: il appela
  rationale: Le participe aoriste moyen introduit le verbe principal. « Il appela » exprime naturellement le fait de faire venir auprès de soi, sans alourdir la phrase.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: deux des centurions
  rationale: L’indéfini τινας n’a pas besoin d’être rendu séparément en français; « deux des centurions » transmet l’expression grecque de façon claire et naturelle.
- source_word: Ἑτοιμάσατε
  choice: Tenez prêts
  rationale: Dans cet ordre militaire, l’impératif demande que les hommes soient préparés et disponibles. « Tenez prêts » convient mieux aux personnes que le calque « préparez ».
- source_word: στρατιώτας διακοσίους
  choice: deux cents soldats
  rationale: Rendu direct du groupe nominal, distinct des cavaliers et du troisième corps de troupe mentionnés ensuite.
- source_word: ὅπως πορευθῶσιν
  choice: pour aller
  rationale: La tournure avec ὅπως et le subjonctif exprime le but; l’infinitif français donne ce sens avec naturel.
- source_word: ἕως Καισαρείας
  choice: jusqu’à Césarée
  rationale: ἕως marque ici la limite du déplacement; « jusqu’à » en conserve précisément la nuance.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: soixante-dix cavaliers
  rationale: ἱππεῖς désigne des soldats montés; « cavaliers » est le terme militaire français courant et concis.
- source_word: δεξιολάβους διακοσίους
  choice: deux cents hommes armés de lances
  rationale: Le terme rare δεξιολάβος désigne vraisemblablement un type de troupe auxiliaire, mais son sens précis reste incertain. Ce rendu lisible suit une interprétation courante tout en signalant l’incertitude en note.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: à partir de la troisième heure de la nuit
  rationale: ἀπό indique explicitement le point de départ temporel. « À partir de » préserve cette valeur, tandis que l’expression antique de l’heure est conservée et expliquée en note.
theological_decisions: []
