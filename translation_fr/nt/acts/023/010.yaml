  to: Comme le conflit s’intensifiait[a], le commandant, craignant que Paul ne soit mis en pièces par eux[b], ordonna aux soldats de descendre, de l’arracher du milieu d’eux et de le conduire dans la caserne[c].
  rationale: 'La révision se limite à corriger la nuance de στάσις et de πολλῆς : elle évite d’affirmer une violence non explicitement formulée dans le grec, tout en conservant l’idée d’un conflit qui prend de l’ampleur. Les autres choix traduisent fidèlement le texte source et sont naturels en français moderne.'
