source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: fr
  text: Comme le conflit s’intensifiait[a], le commandant, craignant que Paul ne soit mis en pièces par eux[b], ordonna aux soldats de descendre, de l’arracher du milieu d’eux et de le conduire dans la caserne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comme une vive dissension se produisait » ou « Comme un grand tumulte éclatait ». Le terme grec peut désigner une vive dissension et, dans certains contextes, une agitation civile.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque est très forte et peut aussi se traduire par « soit déchiré par eux ».
    reason: lexical_alternative
  - marker: c
    text: Le mot grec peut littéralement signifier « camp » ; ici, il désigne les quartiers militaires romains de Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς δὲ γινομένης στάσεως
  choice: Comme l’affrontement devenait violent
  rationale: Le génitif absolu exprime la circonstance. στάσις désigne ici une vive opposition qui dégénère, tandis que πολλῆς en souligne l’intensité; cette formulation naturelle évite de suggérer une rébellion politique formelle.
- source_word: φοβηθεὶς
  choice: craignant
  rationale: Le participe aoriste indique le motif de l’ordre donné par le commandant.
- source_word: ὁ χιλίαρχος
  choice: le commandant
  rationale: χιλίαρχος désigne ici l’officier romain à la tête de la troupe; « commandant » est précis dans le contexte et immédiatement compréhensible.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: que Paul ne soit mis en pièces par eux
  rationale: La construction avec μή exprime l’issue redoutée, non un fait accompli. « Mis en pièces » conserve la force très vive de διασπάω.
- source_word: ἐκέλευσεν τὸ στράτευμα
  choice: ordonna aux soldats
  rationale: ἐκέλευσεν marque un ordre militaire. Le collectif στράτευμα désigne ici les hommes placés sous son commandement; « soldats » est naturel en français.
- source_word: καταβὰν
  choice: de descendre
  rationale: Le participe, dépendant sémantiquement de l’ordre, décrit le mouvement depuis la forteresse vers le lieu du Conseil situé en contrebas.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: de l’arracher du milieu d’eux
  rationale: « Arracher » rend la force de ἁρπάζω et la nécessité d’extraire Paul de la foule, tout en conservant ἐκ μέσου αὐτῶν.
- source_word: ἄγειν τε εἰς τὴν παρεμβολήν
  choice: et de le conduire dans la caserne
  rationale: ἄγω décrit le fait d’emmener Paul vers une destination. Dans ce contexte urbain, παρεμβολή désigne les quartiers militaires romains plutôt qu’un camp en plein air.
