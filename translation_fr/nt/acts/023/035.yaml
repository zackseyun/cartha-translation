  source_fidelity: Le sens judiciaire de Διακούσομαί σου est bien rendu par « J’entendrai ta cause », et « lorsque tes accusateurs seront eux aussi arrivés » exprime correctement la contingence future de ὅταν avec le subjonctif ainsi que la valeur de καί. « Sous surveillance », toutefois, évoque surtout l’observation et non la garde/custodie exprimée par φυλάσσεσθαι.
