  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: fr
  text: « J’entendrai ta cause[a], dit-il, lorsque tes accusateurs seront eux aussi arrivés. » Puis il ordonna qu’on le tienne sous garde dans le prétoire[b] d’Hérode.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je t’entendrai jusqu’au bout. » Dans ce contexte judiciaire, le verbe grec peut souligner l’audition complète d’une personne ou de sa cause.'
    reason: lexical_alternative
  - marker: b
    text: Le prétoire était la résidence officielle ou le quartier général du gouverneur romain ; il s’agit probablement ici du palais d’Hérode à Césarée.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: J’entendrai ta cause
  rationale: Le verbe διακούω peut exprimer le fait d’entendre quelqu’un jusqu’au bout, notamment dans un cadre judiciaire. « Entendre ta cause » restitue naturellement en français la situation juridique tout en conservant l’image de l’audition.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: lorsque tes accusateurs seront eux aussi arrivés
  rationale: ὅταν avec le subjonctif exprime ici une éventualité future. « Eux aussi » rend la valeur de καί, et le futur antérieur français marque naturellement que leur arrivée doit précéder l’audition.
- source_word: κελεύσας
  choice: Puis il ordonna
  rationale: Le participe aoriste est rendu par un verbe conjugué afin de produire une narration française fluide; « puis » indique la succession sans ajouter de causalité.
- source_word: φυλάσσεσθαι αὐτόν
  choice: qu’on le garde sous surveillance
  rationale: La tournure impersonnelle française rend naturellement l’infinitif passif et exprime une détention surveillée sans suggérer une peine d’emprisonnement.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: dans le prétoire d’Hérode
  rationale: « Prétoire » conserve le terme historique désignant ici la résidence ou le quartier général officiel du gouverneur, précisé comme étant celui d’Hérode.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire judiciaire reste clair grâce à la tournure « entendre ta cause », tandis que le terme historique « prétoire » est conservé et expliqué en note.
