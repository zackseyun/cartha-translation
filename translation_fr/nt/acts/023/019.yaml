source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: fr
  text: 'Le commandant le prit donc par la main et, s’étant retiré avec lui à l’écart, lui demanda : « Qu’as-tu à me rapporter ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: le prit ... par la main
  rationale: Cette formulation française naturelle conserve l’action concrète de saisir ou prendre la main sans suggérer une force excessive.
- source_word: δὲ
  choice: donc
  rationale: Dans ce contexte, δέ assure la progression du récit; « donc » relie naturellement l’action à la demande faite au verset précédent.
- source_word: ὁ χιλίαρχος
  choice: le commandant
  rationale: Le terme désigne ici un officier militaire romain de haut rang. « Commandant » est clair en français moderne, contrairement au calque « chiliarque », et moins historiquement spécialisé que « tribun ».
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: s’étant retiré avec lui à l’écart
  rationale: ἀναχωρέω exprime le fait de se retirer, et κατ’ ἰδίαν celui d’être à part, en privé. « avec lui » explicite seulement le participant déjà impliqué par la prise de la main et rend la scène naturelle en français.
- source_word: ἐπυνθάνετο
  choice: lui demanda
  rationale: L’imparfait grec peut présenter la demande dans son déroulement, mais le passé simple convient à la progression narrative française. « Demanda » est plus naturel ici que « se mit à lui demander », qui alourdirait une question unique.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: Qu’as-tu à me rapporter ?
  rationale: La tournure concise reproduit naturellement la question grecque. « Rapporter » conserve la nuance de transmission d’une information dans ce contexte militaire et judiciaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique courant sans archaïsme marqué. La question directe reste concise et naturelle.
