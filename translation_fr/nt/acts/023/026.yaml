  text: Κλαύδιος Λυσίας τῷ κρατίστῳ ἡγεμόνι Φήλικι χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/026.yaml
  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: fr
  text: Claude Lysias, à Son Excellence le gouverneur Félix, salutations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: Claude Lysias
  rationale: 'Les noms sont rendus selon leurs formes françaises conventionnelles : Κλαύδιος devient « Claude », tandis que Λυσίας est translittéré « Lysias ».'
- source_word: τῷ κρατίστῳ
  choice: à Son Excellence
  rationale: Le superlatif honorifique κρατίστῳ appartient au registre officiel et respectueux. « Son Excellence » rend naturellement en français moderne la formule de protocole adressée à un haut fonctionnaire.
- source_word: ἡγεμόνι
  choice: le gouverneur
  rationale: Dans ce contexte provincial romain, ἡγεμών désigne de manière générale l'autorité gouvernante. « Gouverneur » est clair sans imposer un titre administratif plus précis que le grec.
- source_word: Φήλικι
  choice: Félix
  rationale: Le nom personnel est rendu sous sa forme française traditionnelle.
- source_word: χαίρειν
  choice: salutations
  rationale: Dans l'ouverture d'une lettre, χαίρειν est une formule épistolaire conventionnelle. « Salutations » en restitue le sens idiomatique plutôt que le sens lexical littéral « se réjouir ».
theological_decisions: []
translation_notes:
  register: Formulation brève, digne et officielle, conforme à l'en-tête d'une lettre administrative. « Son Excellence » conserve la déférence de l'original sans archaïsme inutile.
