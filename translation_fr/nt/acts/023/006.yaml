revisions:
- from: 'Mais Paul, sachant qu’une partie de l’assemblée était composée de sadducéens et l’autre de pharisiens, s’écria au milieu du Conseil[a] : « Frères, je suis pharisien, fils de pharisiens[b]. C’est au sujet de l’espérance et de la résurrection des morts que je suis jugé[c]. »'
  to: 'Mais Paul, sachant qu’une partie du conseil était composée de sadducéens et l’autre de pharisiens, s’écria dans le conseil[a] : « Frères, je suis pharisien, fils de pharisiens[b]. C’est au sujet de l’espérance et de la résurrection des morts que je suis jugé[c]. »'
  rationale: 'La seule correction nécessaire supprime l’ajout spatial de « au milieu de » et harmonise la première mention avec le référent de συνέδριον. Le reste du texte est conservé : « Frères » est une adaptation française naturelle de l’apostrophe fraternelle, sans prétendre que l’auditoire comprenait des femmes; la filiation pharisienne et le lien entre espérance et résurrection restent volontairement ouverts.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:13Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement la répartition entre sadducéens et pharisiens, l’autodésignation de Paul, le pluriel ambigu de « fils de pharisiens », ainsi que la coordination non résolue entre « espérance » et « résurrection ». En revanche, « au milieu du Conseil » ne rend pas exactement ἐν τῷ συνεδρίῳ, qui situe la parole dans le conseil plutôt qu’au milieu de celui-ci.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Dans le Conseil » est à la fois plus idiomatique et plus exact dans ce contexte institutionnel.
  terminology: « Sadducéens », « pharisiens », « Conseil » et « Sanhédrin » sont des choix appropriés. La minuscule à « conseil » convient au nom commun, tandis que « Sanhédrin » demeure l’alternative historique explicitée en note.
