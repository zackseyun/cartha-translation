id: ACT.23.6
reference: Acts 23:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: fr
  text: 'Mais Paul, sachant qu’une partie du conseil était composée de sadducéens et l’autre de pharisiens, s’écria dans le conseil[a] : « Frères, je suis pharisien, fils de pharisiens[b]. C’est au sujet de l’espérance et de la résurrection des morts que je suis jugé[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Sanhédrin ». Le mot grec désigne ici le conseil dirigeant juif.
    reason: lexical_alternative
  - marker: b
    text: Ou « fils de parents pharisiens » ou « descendant de pharisiens ».
    reason: alternative_reading
  - marker: c
    text: Ou « C’est au sujet de l’espérance de la résurrection des morts que je suis jugé ».
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: sachant
  rationale: Le participe aoriste indique la circonstance qui motive l’intervention de Paul. « Sachant » en conserve la valeur participiale de façon naturelle.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: une partie de l’assemblée ... l’autre
  rationale: Cette formulation conserve la division en deux parties exprimée par μέρος tout en précisant naturellement en français qu’il s’agit des membres présents.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: sadducéens / pharisiens
  rationale: Ce sont les désignations françaises usuelles de ces deux courants juifs.
- source_word: ἔκραζεν
  choice: s’écria
  rationale: Le verbe exprime une prise de parole forte et publique. « S’écria » en restitue l’intensité sans registre familier.
- source_word: ἐν τῷ συνεδρίῳ
  choice: au milieu du Conseil
  rationale: συνέδριον désigne ici le conseil juif devant lequel Paul comparaît. « Conseil » reste transparent, tandis que « Sanhédrin » est donné en note comme terme historique précis.
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: Dans cette apostrophe adressée à des hommes, « Frères » rend naturellement l’adresse fraternelle en français moderne; « Hommes, frères » serait artificiel et peu idiomatique.
- source_word: Φαρισαῖός εἰμι
  choice: je suis pharisien
  rationale: La formulation rend directement l’identification au présent.
- source_word: υἱὸς Φαρισαίων
  choice: fils de pharisiens
  rationale: Le pluriel grec est conservé, ainsi que l’image familiale, sans décider s’il s’agit précisément des parents ou plus largement de l’ascendance.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: au sujet de l’espérance et de la résurrection des morts
  rationale: La coordination de ἐλπίδος et ἀναστάσεως par καί est maintenue afin de ne pas réduire d’office les deux expressions à « l’espérance de la résurrection ».
- source_word: κρίνομαι
  choice: je suis jugé
  rationale: Le présent passif exprime la situation judiciaire actuelle de Paul. « Je suis jugé » reste proche du grec; « je passe en jugement » serait plus interprétatif.
theological_decisions:
- issue: Sens de l’expression υἱὸς Φαρισαίων
  choice: « fils de pharisiens », sans préciser la nature exacte de cette filiation
  alternative: « fils de parents pharisiens » ou « descendant de pharisiens »
  rationale: Le pluriel grec permet une référence aux parents ou à une ascendance plus large. Le texte principal conserve l’expression familiale et son ambiguïté.
- issue: Rapport entre l’espérance et la résurrection dans la défense de Paul
  choice: « l’espérance et la résurrection des morts »
  alternative: « l’espérance de la résurrection des morts »
  rationale: Le grec coordonne les deux noms par καί. Ils peuvent désigner deux réalités étroitement liées ou une seule espérance centrée sur la résurrection; la traduction principale ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « Frères » évite le calque peu naturel « Hommes, frères ». La syntaxe conserve néanmoins la division de l’assemblée, la force de la prise de parole et les ambiguïtés portant sur la filiation pharisienne et sur le rapport entre espérance et résurrection.
