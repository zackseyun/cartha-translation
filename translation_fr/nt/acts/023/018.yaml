source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: fr
  text: 'Il le prit donc avec lui, le conduisit auprès du commandant[a] et dit : « Le prisonnier Paul m’a fait venir auprès de lui et m’a demandé de vous amener ce jeune homme, qui a quelque chose à vous dire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne un officier supérieur de l’armée romaine, traditionnellement appelé « tribun ».
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: Il le prit donc avec lui
  rationale: Le participe aoriste exprime l’action préalable par laquelle le soldat prend le jeune homme en charge pour l’escorter. « Prendre avec lui » est naturel en français et convient au contexte.
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: le conduisit auprès du commandant
  rationale: ἄγω exprime ici le fait de conduire quelqu’un vers une personne. « Commandant » rend clairement χιλίαρχος sans recourir au terme historique moins courant « tribun ».
- source_word: φησίν
  choice: dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit en français.
- source_word: Ὁ δέσμιος Παῦλος
  choice: Le prisonnier Paul
  rationale: δέσμιος désigne une personne détenue ou enchaînée ; « prisonnier » est clair et idiomatique.
- source_word: προσκαλεσάμενός με
  choice: m’a fait venir auprès de lui
  rationale: La tournure indique que Paul a appelé le soldat à venir vers lui. Cette formulation française exprime naturellement cette direction sans lui prêter une autorité excessive.
- source_word: ἠρώτησεν ... ἀγαγεῖν
  choice: m’a demandé de t’amener
  rationale: ἐρωτάω exprime ici une demande, tandis que ἀγάγειν indique le déplacement du jeune homme jusqu’au commandant.
- source_word: νεανίαν
  choice: jeune homme
  rationale: νεανίας désigne un homme jeune. « Jeune homme » est actuel, précis et sans coloration archaïque.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: qui a quelque chose à te dire
  rationale: Le participe se rapporte au jeune homme. La proposition relative conserve ce lien grammatical et rend l’expression de façon naturelle en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond au singulier grec σέ/σοι et à l’adresse directe au commandant. La note culturelle est placée après « commandant », contrairement aux marqueurs manifestement décalés de la couche anglaise de consultation.
