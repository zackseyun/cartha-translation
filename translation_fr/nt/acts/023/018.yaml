  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu : le soldat prend le jeune homme, le conduit au χιλίαρχος, puis rapporte la demande de Paul. La proposition finale se rapporte correctement au jeune homme. « Commandant », éclairé par la note, est une solution acceptable pour χιλίαρχος.'
