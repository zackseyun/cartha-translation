  to: 'Il le prit donc avec lui, le conduisit auprès du commandant[a] et dit : « Le prisonnier Paul m’a fait venir auprès de lui et m’a demandé de vous amener ce jeune homme, qui a quelque chose à vous dire. »'
  rationale: Le seul changement nécessaire est le remplacement du tutoiement par le vouvoiement dans l’adresse au commandant. Il préserve le singulier du destinataire tout en respectant l’usage pragmatique du français moderne. Le reste de la traduction rend fidèlement la syntaxe et le sens du grec.
