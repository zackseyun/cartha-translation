source:
  edition: SBLGNT
  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: fr
  text: et de prévoir des montures[a], afin d’y faire monter Paul et de le conduire sain et sauf auprès du gouverneur Félix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des animaux de transport » ; le grec ne précise pas de quelle sorte d’animaux il s’agit.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήνη
  choice: montures
  rationale: Le terme désigne largement des animaux domestiques servant au transport, sans préciser leur espèce. « Montures » exprime ici leur fonction sans introduire « chevaux ».
- source_word: τε
  choice: et
  rationale: La particule relie cette consigne aux ordres précédents ; « et » convient naturellement dans ce contexte.
- source_word: παραστῆσαι
  choice: prévoir
  rationale: Dans cette suite d’instructions, l’infinitif demande que des animaux soient mis à disposition. « Prévoir des montures » rend cette valeur pratique en français courant.
- source_word: ἵνα
  choice: afin de
  rationale: Cette tournure exprime clairement le but introduit par ἵνα.
- source_word: ἐπιβιβάσαντες
  choice: y faire monter Paul
  rationale: Le participe signifie faire monter quelqu’un sur un animal ou un moyen de transport. La coordination française avec le verbe principal restitue naturellement la succession des actions.
- source_word: διασώσωσι
  choice: le conduire sain et sauf
  rationale: Le verbe souligne que Paul doit parvenir à destination sans subir de dommage ; cette formulation conserve à la fois le déplacement et la protection.
- source_word: πρὸς
  choice: auprès de
  rationale: 'Avec un mouvement dirigé vers une personne, la préposition indique ici la destination personnelle : Félix.'
- source_word: ἡγεμόνα
  choice: gouverneur
  rationale: Dans ce cadre provincial romain, « gouverneur » est le titre français clair et usuel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase reste syntaxiquement liée au contexte précédent. « Montures » évite de préciser indûment qu’il s’agissait de chevaux, tandis que « sain et sauf » conserve l’idée de protection jusqu’à l’arrivée.
