translation:
  language: fr
  text: Ceux qui avaient formé cette conspiration étaient plus de quarante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: plus de quarante
  rationale: Le comparatif πλείους suivi du nombre τεσσεράκοντα signifie idiomatiquement « plus de quarante ». Cette formulation française est claire et conserve exactement la valeur quantitative sans ajouter « hommes », absent du grec.
- source_word: συνωμοσίαν
  choice: conspiration
  rationale: συνωμοσία désigne une entente secrète ou une conspiration. « Conspiration » en restitue ici le sens formel sans ajouter explicitement l’idée de serment tirée du contexte.
- source_word: ποιησάμενοι
  choice: avaient formé
  rationale: Le participe aoriste moyen de ποιέω, associé à συνωμοσίαν, exprime le fait d’avoir constitué ou formé la conspiration. « Avaient formé » est naturel en français et marque l’antériorité.
- source_word: ἦσαν δὲ
  choice: étaient
  rationale: Le verbe ἦσαν indique ici l’existence et le nombre du groupe. La construction française « Ceux qui… étaient plus de quarante » est naturelle; la faible valeur connective de δέ peut rester implicite dans le fil du récit.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: Ceux qui avaient formé cette conspiration
  rationale: 'L’article avec le participe a une fonction substantivale: « ceux qui avaient formé cette conspiration ». Cette tournure conserve directement la structure référentielle du grec dans un français courant.'
