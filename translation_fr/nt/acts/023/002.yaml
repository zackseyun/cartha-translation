  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀρχιερεὺς Ἁνανίας ἐπέταξεν τοῖς παρεστῶσιν αὐτῷ τύπτειν αὐτοῦ τὸ στόμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: fr
  text: Mais le grand prêtre Ananias ordonna à ceux qui se tenaient près de lui de frapper Paul sur la bouche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de gifler Paul ». Le verbe grec peut désigner un coup en général ; « gifler » est possible ici, mais plus précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Conjonction légèrement adversative qui introduit la réaction brutale à la déclaration précédente de Paul.
- source_word: ἀρχιερεὺς
  choice: grand prêtre
  rationale: Désignation française usuelle et précise de la fonction exercée ici par Ananias.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Translittération française traditionnelle de ce nom propre.
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Exprime un ordre donné avec autorité, dans un registre narratif naturel et digne.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: à ceux qui se tenaient près de lui
  rationale: Conserve le sens spatial du participe sans supposer plus précisément qu'il s'agissait de ses assistants.
- source_word: τύπτειν
  choice: de frapper
  rationale: Rend le sens général du verbe grec sans préciser indûment la manière du coup.
- source_word: αὐτοῦ τὸ στόμα
  choice: Paul sur la bouche
  rationale: Le premier pronom grec renvoie à Ananias et le second à Paul. La répétition de « lui » serait ambiguë en français; le nom « Paul », explicite dans le contexte immédiat, clarifie le référent sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation évite l'ambiguïté pronominale qu'aurait « lui frapper la bouche » ou « le frapper sur la bouche » après la mention d'Ananias.
