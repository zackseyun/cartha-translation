  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: fr
  text: 'Ceux qui se tenaient là dirent : « Tu insultes le grand-prêtre de Dieu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu outrages le grand-prêtre de Dieu ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: Ceux qui se tenaient près de lui
  rationale: Le participe substantivé désigne les personnes présentes à proximité de Paul. Cette formulation naturelle conserve la nuance spatiale de παρίστημι.
- source_word: εἶπαν
  choice: dirent
  rationale: L’aoriste fait progresser le récit et se rend naturellement ici par le passé simple, conformément au registre narratif biblique moderne.
- source_word: ἀρχιερέα
  choice: grand-prêtre
  rationale: Dans ce contexte, ἀρχιερεύς désigne le grand-prêtre juif; « grand-prêtre » est l’équivalent français usuel et précis.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le complément du nom rend directement et naturellement le génitif grec, sans ajouter d’idée d’approbation divine de la conduite personnelle du titulaire.
- source_word: λοιδορεῖς
  choice: Tu insultes
  rationale: λοιδορέω désigne une parole injurieuse ou outrageante. « Insulter » est clair en français actuel et convient à la question de reproche.
theological_decisions:
- issue: Portée de τοῦ θεοῦ appliqué au grand-prêtre
  choice: « le grand-prêtre de Dieu » désigne la fonction dans son rapport à Dieu, sans commentaire ajouté sur la conduite de celui qui l’exerce.
  alternative: Comprendre la formule comme une approbation divine personnelle du grand-prêtre en question.
  rationale: Le grec identifie la fonction, mais ne formule pas explicitement un jugement théologique sur la conduite de son titulaire; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif soutenu mais courant dans une traduction biblique. La question directe conserve la force du reproche grec.
