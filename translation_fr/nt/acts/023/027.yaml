    issue: Ajout de « alors »
    rationale: ἐπιστάς et la coordination grecque n’expriment pas explicitement « alors ». Le retirer évite d’ajouter une relation temporelle plus précise.
  - severity: medium
    issue: Temps de « il était romain »
    rationale: Le grec porte le présent Ῥωμαῖός ἐστιν. En français, « qu’il est romain » reproduit plus fidèlement le statut présenté comme actuel dans la lettre.
  - severity: low
    issue: Passage à l’actif dans « ils étaient sur le point de le tuer »
    rationale: Cette formulation est compréhensible, mais le grec emploie l’infinitif passif ἀναιρεῖσθαι. Le passif français conserve la structure et évite une explicitation syntaxique non nécessaire.
