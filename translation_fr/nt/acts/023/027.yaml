source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: fr
  text: Cet homme avait été saisi par les Juifs[a] et était sur le point d’être tué par eux ; je suis intervenu avec la troupe et je l’ai délivré, ayant appris qu’il est romain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Le terme grec peut désigner les Juifs au sens ethnique et religieux, ou les habitants de la Judée au sens géographique ; ici, il renvoie vraisemblablement au groupe juif de Jérusalem qui s’opposait à Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: avait été saisi
  rationale: Le participe passif désigne ici une prise hostile, sans nécessairement impliquer une arrestation légale. Le plus-que-parfait situe naturellement cette action avant l’intervention racontée.
- source_word: Ἰουδαίων
  choice: les Juifs
  rationale: Dans ce contexte, le terme vise le groupe juif de Jérusalem opposé à Paul. « Les Juifs » demeure la traduction française conventionnelle, tandis que l’alternative géographique est signalée en note.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: ils étaient sur le point de le tuer
  rationale: La tournure exprime une action imminente, et ἀναιρέω signifie ici tuer. La formulation active française identifie naturellement comme agents ceux qui l’avaient saisi.
- source_word: ἐπιστὰς
  choice: je suis alors intervenu
  rationale: Le participe évoque l’arrivée soudaine et l’intervention du tribun. « Intervenu » rend mieux cette nuance en français que le simple « venu ».
- source_word: σὺν τῷ στρατεύματι
  choice: avec la troupe
  rationale: στράτευμα désigne ici le détachement militaire accompagnant le tribun, sans permettre d’en préciser davantage la taille.
- source_word: ἐξειλάμην
  choice: je l’ai délivré
  rationale: Le moyen ἐξαιρέω signifie retirer quelqu’un d’un danger ou le délivrer. « Délivré » convient au registre digne de la lettre sans ajouter de nuance théologique.
- source_word: μαθὼν
  choice: ayant appris
  rationale: Cette traduction conserve la relation participiale et l’ordre apparent présenté par la lettre, sans harmoniser la déclaration avec le récit antérieur.
- source_word: Ῥωμαῖός ἐστιν
  choice: il était romain
  rationale: Ῥωμαῖος signifie directement « romain » et implique ici le statut civique. Le temps passé s’accorde en français avec le récit épistolaire, sans expliciter davantage que le grec.
theological_decisions:
- issue: Présentation historico-rhétorique dans la lettre du tribun
  choice: Traduire directement l’affirmation du tribun, selon laquelle il est intervenu « ayant appris » que Paul était romain.
  alternative: Reformuler pour faire comprendre que le tribun n’a découvert la citoyenneté romaine de Paul qu’après l’avoir délivré.
  rationale: Le verset rapporte la version avantageuse que Claudius Lysias donne de ses actes. La traduction ne doit ni corriger ni harmoniser cette tension avec Actes 21–22.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement segmentée pour rester naturelle, tout en maintenant la coordination narrative et l’ambiguïté rhétorique du texte grec.
