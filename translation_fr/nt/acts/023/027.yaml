  to: Cet homme avait été saisi par les Juifs[a] et était sur le point d’être tué par eux ; je suis intervenu avec la troupe et je l’ai délivré, ayant appris qu’il est romain.
  rationale: La révision supprime l’adverbe ajouté, conserve le passif de l’original pour la menace de mort, et restitue le présent grec dans « qu’il est romain ». Elle maintient la syntaxe participiale « ayant appris » et ne cherche pas à harmoniser la déclaration du tribun avec le récit précédent.
