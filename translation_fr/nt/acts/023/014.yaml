source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: fr
  text: 'Ces hommes se rendirent auprès des grands prêtres et des anciens et leur dirent : « Nous nous sommes voués à une malédiction[a], en jurant de ne rien manger jusqu’à ce que nous tuions Paul. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Nous nous sommes voués à une malédiction. » Le grec exprime un serment auto-imprécatoire : ils appellent une malédiction sur eux-mêmes s’ils n’accomplissent pas leur engagement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ces hommes
  rationale: Le pronom relatif renvoie aux conspirateurs du verset précédent. « Ces hommes » explicite naturellement le référent en français.
- source_word: προσελθόντες
  choice: allèrent trouver
  rationale: Le participe aoriste indique une action antérieure à « dirent ». « Allèrent trouver » convient au mouvement vers les responsables et reste naturel dans le récit.
- source_word: ἀρχιερεῦσιν
  choice: chefs des prêtres
  rationale: Rendu institutionnel courant du pluriel dans le contexte du judaïsme du Second Temple.
- source_word: πρεσβυτέροις
  choice: anciens
  rationale: Le terme désigne ici des dirigeants reconnus, et non simplement des hommes âgés.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: nous nous sommes liés par une malédiction
  rationale: La construction avec nom et verbe apparentés exprime un engagement solennel assorti d’une auto-malédiction. Cette formulation en garde la gravité sans employer le terme ecclésiastique ultérieur « anathème ».
- source_word: μηδενὸς γεύσασθαι
  choice: à ne rien manger
  rationale: Dans ce vœu de jeûne, γεύομαι signifie prendre ou goûter de la nourriture. « Ne rien manger » transmet clairement le sens idiomatique en français moderne.
- source_word: ἕως οὗ ἀποκτείνωμεν
  choice: avant d’avoir tué
  rationale: La tournure française exprime naturellement la limite temporelle du vœu et présente la mise à mort comme devant être accomplie avant la reprise de nourriture.
- source_word: τὸν Παῦλον
  choice: Paul
  rationale: Forme française traditionnelle du nom Παῦλος.
theological_decisions:
- issue: Sens de la formule Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: nous nous sommes liés par une malédiction
  alternative: nous nous sommes voués à l’anathème ; nous avons fait le serment solennel
  rationale: Il s’agit d’un serment auto-imprécatoire, non de l’« anathème » au sens ecclésiastique postérieur. Le rendu retenu préserve à la fois l’engagement volontaire et la menace de malédiction.
translation_notes:
  register: Français international moderne, narratif et digne. « Allèrent trouver » est plus idiomatique que « s’approchèrent de » dans ce contexte. « Ne rien manger » privilégie le sens contextuel de γεύομαι, tandis que la note explicite la force inhabituelle de la formule de serment.
