- from: 'Ces hommes allèrent trouver les chefs des prêtres et les anciens et leur dirent : « Nous nous sommes liés par une malédiction[a] à ne rien manger avant d’avoir tué Paul. »'
  to: 'Ces hommes se rendirent auprès des grands prêtres et des anciens et leur dirent : « Nous nous sommes voués à une malédiction[a], en jurant de ne rien manger jusqu’à ce que nous tuions Paul. »'
  rationale: La révision restitue explicitement le caractère auto-imprécatoire du serment et la borne temporelle introduite par ἕως οὗ, tout en gardant un français international moderne. Elle emploie « grands prêtres », rendu institutionnel usuel de ἀρχιερεῖς.
