source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: fr
  text: 'Paul dit alors : « Je ne savais pas, frères, qu’il est le grand prêtre. En effet, il est écrit : “Tu ne parleras pas en mal d’un chef de ton peuple[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu n’insulteras pas un chef de ton peuple. »'
    reason: Alternative lexicale pour οὐκ ἐρεῖς κακῶς, qui peut désigner le fait de parler outrageusement ou d’injurier.
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: Paul dit alors
  rationale: Le verbe introduit le discours direct et τέ assure une transition légère. « Alors » rend naturellement l’enchaînement narratif sans donner trop de poids à la particule.
- source_word: Οὐκ ᾔδειν
  choice: Je ne savais pas
  rationale: Cette forme de οἶδα exprime ici l’absence de connaissance dans le contexte passé; la tournure est directe et idiomatique en français.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel convient au conseil auquel Paul s’adresse et préserve la forme du grec.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: que c’était le grand prêtre
  rationale: Bien que le grec emploie le présent ἐστίν, le français applique naturellement la concordance des temps après « je ne savais pas »; cela ne nie pas que l’homme occupe encore la fonction au moment du récit.
- source_word: γέγραπται γὰρ
  choice: En effet, il est écrit
  rationale: Cette formule française consacrée conserve la valeur du parfait passif et introduit clairement la justification scripturaire.
- source_word: Ἄρχοντα
  choice: un chef
  rationale: « Chef » exprime de façon claire et assez large la personne investie d’autorité; « dirigeant » serait également possible, mais moins naturel dans cette citation juridique.
- source_word: τοῦ λαοῦ σου
  choice: de ton peuple
  rationale: Cette expression conserve le langage communautaire et scripturaire de λαός.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: Tu ne parleras pas en mal
  rationale: Le futur a valeur de commandement. « Parler en mal de » est actuel et accessible, tout en laissant ouverte l’étendue de κακῶς.
theological_decisions:
- issue: La concordance des temps dans l’identification du grand prêtre
  choice: que c’était le grand prêtre
  alternative: qu’il est le grand prêtre
  rationale: Le présent grec est rendu selon la concordance naturelle du français après un verbe de connaissance au passé. La traduction ne tranche pas les débats sur la nature ou la sincérité de l’ignorance de Paul.
- issue: La portée de ἀδελφοί
  choice: frères
  alternative: frères et sœurs
  rationale: Le contexte est celui du conseil dirigeant auquel Paul s’adresse; le masculin du texte source est donc conservé sans élargissement explicite.
- issue: La formulation de l’interdit scripturaire
  choice: Tu ne parleras pas en mal d’un chef de ton peuple
  alternative: Tu n’insulteras pas un chef de ton peuple
  rationale: La formulation retenue garde une portée assez large et évite de réduire κακῶς à la seule insulte, tout en signalant en note l’alternative plus forte.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La syntaxe de la citation garde une tonalité scripturaire sans archaïsmes; le point-virgule anglais est remplacé par deux phrases pour une lecture française plus naturelle.
