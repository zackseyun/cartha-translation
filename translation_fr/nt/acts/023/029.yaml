source:
  edition: SBLGNT
  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: fr
  text: J’ai constaté qu’on l’accusait au sujet de questions concernant leur Loi[a], mais qu’aucun chef d’accusation passible de mort ou de chaînes[b] ne pesait contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet de différends concernant leur Loi ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire une détention ou un emprisonnement.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: J’ai constaté
  rationale: Dans ce contexte d’enquête et de rapport officiel, le verbe exprime la conclusion à laquelle le commandant est parvenu; « constaté » est naturel et précis.
- source_word: ἐγκαλούμενον
  choice: qu’on l’accusait
  rationale: Cette formulation conserve le sens passif de l’accusation sans suggérer qu’une culpabilité avait été établie.
- source_word: περὶ ζητημάτων
  choice: au sujet de questions
  rationale: ζητήματα désigne des questions débattues ou des sujets de controverse; « questions » préserve une certaine neutralité, tandis que la note signale la nuance contentieuse.
- source_word: τοῦ νόμου αὐτῶν
  choice: relatives à leur Loi
  rationale: Le génitif précise le domaine de ces questions. « Leur » maintient le point de vue du commandant romain, et la majuscule à « Loi » indique ici la Loi juive comme corpus reconnu.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: ne méritait la mort ou les chaînes
  rationale: La formulation conserve la force judiciaire de ἄξιον et rend δεσμῶν littéralement par « chaînes », terme compréhensible dans le contexte de détention antique.
- source_word: ἔχοντα ἔγκλημα
  choice: aucune accusation portée contre lui
  rationale: La tournure grecque indique qu’aucun chef d’accusation de cette gravité ne pesait sur lui; cette traduction évite de laisser entendre une condamnation.
