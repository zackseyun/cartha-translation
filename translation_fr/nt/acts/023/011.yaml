  variant: modern international French
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: fr
  text: 'Or, la nuit suivante, le Seigneur se tint près de lui et dit : « Courage ![a] De même que tu as témoigné à mon sujet à Jérusalem, de même il faut que tu témoignes aussi à Rome.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prends courage ! »'
    reason: lexical_alternative
  - marker: b
    text: Les deux verbes traduits par « témoigner » appartiennent en grec à la même famille de mots ; le premier peut aussi suggérer un témoignage appuyé ou solennel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: Or, la nuit suivante
  rationale: ἐπιούσῃ désigne la nuit qui suit. « Or » rend la transition narrative légère marquée par δέ sans lui donner un contraste trop fort.
- source_word: ἐπιστὰς αὐτῷ
  choice: se tint près de lui
  rationale: Cette formulation conserve l’idée concrète que le Seigneur vient se tenir auprès de Paul, sans réduire la scène à la formulation plus interprétative « lui apparut ».
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: La traduction reprend le titre grec sans ajouter explicitement « Jésus » ; le contexte du discours permet d’en reconnaître le référent.
- source_word: Θάρσει
  choice: Courage !
  rationale: Cette exhortation brève et naturelle en français exprime clairement l’impératif présent adressé à Paul. « Prends courage » demeure une autre traduction possible.
- source_word: διεμαρτύρω
  choice: tu as témoigné
  rationale: Le verbe peut évoquer un témoignage appuyé ou solennel. « Tu as témoigné » reste naturel et maintient son lien lexical avec μαρτυρῆσαι.
- source_word: τὰ περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Cette expression rend naturellement les choses qui concernent le Seigneur sans ajouter de contenu au texte.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un nom de ville, εἰς peut ici désigner le lieu où le témoignage a été rendu ; le français idiomatique emploie « à ».
- source_word: οὕτω
  choice: de même
  rationale: La locution exprime clairement la correspondance entre le témoignage déjà rendu à Jérusalem et celui qui devra l’être à Rome.
- source_word: σε δεῖ
  choice: il faut que tu
  rationale: La tournure impersonnelle conserve la notion de nécessité exprimée par δεῖ sans préciser davantage sa modalité ni la transformer en idée explicite de destin.
- source_word: καὶ εἰς Ῥώμην
  choice: aussi à Rome
  rationale: « Aussi » rend καί et présente Rome comme l’autre lieu où Paul devra témoigner.
- source_word: μαρτυρῆσαι
  choice: tu témoignes
  rationale: Le même terme français que pour διεμαρτύρω préserve le lien entre le témoignage passé de Paul et son témoignage futur.
theological_decisions:
- issue: Identité de ὁ κύριος
  choice: le Seigneur
  alternative: le Seigneur Jésus
  rationale: Dans le contexte des Actes, celui qui parle de témoignage « à mon sujet » est Jésus ressuscité. La traduction conserve néanmoins la désignation exacte du texte grec et n’explicite pas le nom.
- issue: Portée de δεῖ
  choice: il faut que tu témoignes
  alternative: tu dois témoigner
  rationale: La formulation exprime une nécessité qui, dans le récit, relève de l’intention divine, sans expliquer son mécanisme ni la paraphraser comme une prédestination ou un destin inéluctable.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la présence personnelle et encourageante du Seigneur, le parallélisme entre Jérusalem et Rome, ainsi que la nécessité exprimée par δεῖ, sans surinterprétation doctrinale.
