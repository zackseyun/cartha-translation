source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: fr
  text: 'Paul fixa les yeux sur le conseil et dit : « Frères, jusqu’à ce jour, j’ai vécu[a] devant Dieu en toute bonne conscience. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, litt. : « je me suis comporté en citoyen devant Dieu », pour conserver la nuance civique possible du verbe grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: fixa les yeux sur
  rationale: Le participe aoriste exprime un regard dirigé et soutenu ; cette tournure française en conserve la force avec naturel.
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: Le δέ est ici un léger marqueur de progression narrative ; en français, l’enchaînement direct est plus naturel sans perte de sens.
- source_word: τῷ συνεδρίῳ
  choice: le conseil
  rationale: Le nom désigne ici l’assemblée dirigeante juive. « Le conseil » traduit le nom commun sans imposer la translittération « Sanhédrin ».
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: Cette interpellation conventionnelle s’adresse explicitement aux hommes du conseil ; « Frères » est naturel et évite le calque pesant « Hommes frères ».
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: avec une conscience entièrement bonne
  rationale: Le datif indique la manière, et πάσῃ donne à l’affirmation une portée complète. La formulation préserve cette intensité sans suggérer par elle-même une perfection morale absolue.
- source_word: πεπολίτευμαι
  choice: je me suis conduit
  rationale: Le parfait de πολιτεύομαι décrit la conduite de Paul jusqu’au moment présent. « Je me suis conduit » rend le sens éthique tout en laissant la nuance civique à la note.
- source_word: τῷ θεῷ
  choice: devant Dieu
  rationale: Dans ce contexte de conduite et de conscience, le datif exprime naturellement une vie menée en relation avec Dieu et sous son regard.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: jusqu’à ce jour
  rationale: La formule marque la continuité du passé jusqu’au moment où Paul parle, dans un registre actuel et digne.
theological_decisions:
- issue: Portée de πεπολίτευμαι dans l’affirmation de Paul
  choice: Une affirmation générale sur sa conduite devant Dieu, avec une bonne conscience
  alternative: « J’ai vécu en citoyen devant Dieu », qui met au premier plan la nuance civique
  rationale: Le verbe peut évoquer la conduite du citoyen, mais le contexte met surtout en relief la manière de vivre de Paul devant Dieu. La traduction principale n’en fait ni une revendication technique de citoyenneté ni une déclaration explicite d’impeccabilité.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la dernière proposition a été légèrement réorganisé pour éviter une fin lourde, tout en maintenant l’accent temporel de « jusqu’à ce jour ». Le marqueur [a] est placé après l’ensemble de l’affirmation auquel se rapporte la variante.
