  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: fr
  text: Mais le fils de la sœur de Paul, ayant entendu parler de l’embuscade, se rendit à la caserne, y entra et en informa Paul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσας
  choice: ayant entendu parler de
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure est naturelle en français et, avec « parler de », convient à l’information reçue au sujet du projet d’embuscade.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque une transition avec une légère opposition : le complot vient d’être formé, mais il est découvert.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: le fils de la sœur de Paul
  rationale: Cette formulation suit précisément le grec et explicite le lien familial sans recourir au terme plus synthétique « neveu ».
- source_word: τὴν ἐνέδραν
  choice: l’embuscade
  rationale: ἐνέδρα désigne concrètement une embuscade ou le fait de se tenir caché pour attaquer; ce choix est plus précis que « complot ».
- source_word: παραγενόμενος
  choice: se rendit
  rationale: Le participe indique que le jeune homme arriva sur place. « Se rendit » exprime naturellement ce déplacement en français narratif.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: à la caserne, y entra
  rationale: παρεμβολή peut désigner un camp ou une caserne. Dans le contexte de la détention de Paul par les soldats romains, « caserne » est le référent le plus probable. La mention explicite de l’entrée préserve le participe εἰσελθών.
- source_word: ἀπήγγειλεν
  choice: en informa
  rationale: ἀπαγγέλλω exprime la transmission d’une information. Le pronom « en » reprend naturellement l’embuscade en français.
- source_word: τῷ Παύλῳ
  choice: Paul
  rationale: Le datif désigne le destinataire de l’information; il est naturellement construit comme complément direct avec le verbe français « informer ».
theological_decisions: []
