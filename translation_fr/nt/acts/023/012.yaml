  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: fr
  text: Quand il fit jour, les Juifs[a] formèrent un complot et se placèrent eux-mêmes sous une malédiction[b], déclarant qu’ils ne mangeraient ni ne boiraient jusqu’à ce qu’ils aient tué Paul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « les Juifs » ; ici, cette expression désigne un groupe particulier de Juifs impliqués dans le complot, et non le peuple juif dans son ensemble.
    reason: cultural_note
  - marker: b
    text: Ou « appelèrent sur eux-mêmes une malédiction ». L’expression désigne un engagement solennel par lequel ils appelaient sur eux un jugement s’ils échouaient.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Quand le jour fut venu
  rationale: Le génitif absolu marque une transition temporelle. Cette formulation est naturelle dans un récit français et conserve le sens littéral sans préciser indûment « le matin ».
- source_word: ποιήσαντες συστροφὴν
  choice: formèrent un complot
  rationale: L’expression désigne ici une action concertée visant à tuer Paul. « Complot » rend mieux cette entente préméditée que « attroupement », qui évoquerait surtout un rassemblement public.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: La traduction maintient la désignation explicite du texte grec. Une note précise toutefois que, dans le contexte, elle renvoie aux membres du groupe impliqué dans le complot et non à l’ensemble du peuple juif.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: se placèrent eux-mêmes sous une malédiction
  rationale: Le verbe exprime une malédiction appelée sur soi pour garantir l’engagement pris. La formulation conserve la dimension auto-imprécatoire sans employer le terme français opaque « anathématiser ».
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: déclarant qu’ils ne mangeraient ni ne boiraient
  rationale: Le participe introduit le contenu de leur engagement. Le conditionnel futur dans le passé et la construction « ni… ni… » sont idiomatiques en français.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: avant d’avoir tué Paul
  rationale: La tournure française exprime clairement que la mort de Paul devait mettre fin à leur abstinence, tout en conservant l’antériorité accomplie envisagée.
