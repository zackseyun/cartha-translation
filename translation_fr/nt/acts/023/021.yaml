  source_fidelity: 'La structure et le sens général sont bien rendus : l’avertissement, l’embuscade, le nombre, l’engagement de ne pas manger ni boire et l’attente sont conservés. Toutefois, « ton accord » interprète τὴν ἀπὸ σοῦ ἐπαγγελίαν (« la promesse venant de toi »), alors que le grec emploie le terme plus ouvert « promesse ». Cette précision contextuelle doit rester en note.'
