id: ACT.23.21
reference: Acts 23:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: fr
  text: Ne te laisse donc pas convaincre par eux, car plus de quarante hommes d’entre eux lui tendent une embuscade. Ils se sont voués à la malédiction[a], en jurant de ne rien manger ni boire avant de l’avoir tué. Maintenant, ils sont prêts et attendent ta promesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont liés par un serment » ; l’expression grecque implique qu’ils appellent une malédiction sur eux-mêmes s’ils ne tiennent pas leur engagement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la promesse venant de toi » ; dans le contexte, ils attendent son accord ou son autorisation.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: te laisse convaincre
  rationale: Le passif français préserve l’idée de se laisser persuader ou gagner par leur demande, tout en restant naturel dans cet avertissement.
- source_word: ἐνεδρεύουσιν
  choice: lui tendent une embuscade
  rationale: Cette expression conserve l’image concrète d’hommes postés pour attaquer, plutôt que de réduire le verbe à un simple complot.
- source_word: ἐξ αὐτῶν
  choice: d’entre eux
  rationale: Indique clairement que les hommes appartiennent au groupe précédemment mentionné.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: plus de quarante hommes
  rationale: Rend directement et naturellement le comparatif grec accompagné du nombre.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: se sont engagés sous peine de malédiction
  rationale: Exprime à la fois l’engagement solennel et l’idée d’une malédiction appelée sur soi en cas d’échec.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: à ne rien manger ni boire
  rationale: Formulation française idiomatique qui conserve la double interdiction du grec.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: avant de l’avoir tué
  rationale: Dans cette construction négative, « avant de » rend naturellement la limite temporelle exprimée par « jusqu’à ce que », tandis que le passé composé infinitif marque l’accomplissement visé.
- source_word: εἰσιν ἕτοιμοι
  choice: ils sont prêts
  rationale: Rendu direct et naturel de la copule avec l’adjectif.
- source_word: προσδεχόμενοι
  choice: attendent
  rationale: Le participe exprime une attente orientée vers ce qu’ils espèrent recevoir du commandant.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: ton accord
  rationale: Dans le contexte, la « promesse » attendue est l’engagement ou l’autorisation du commandant d’accéder à leur demande; « ton accord » communique clairement cette valeur pragmatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier grec adressé au commandant. La structure a été légèrement segmentée pour éviter une longue relative ambiguë, sans modifier les rapports logiques du texte.
