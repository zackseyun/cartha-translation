  - severity: low
    issue: « se sont engagés sous peine de malédiction »
    rationale: La formule est compréhensible, mais « sous peine de » peut évoquer une peine imposée de l’extérieur. Le grec décrit une malédiction qu’ils appellent sur eux-mêmes dans le cadre de leur serment.
