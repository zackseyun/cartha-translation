  terminology: « Se vouer à la malédiction » maintient l’élément de malédiction inhérent à ἀνεθεμάτισαν ἑαυτούς. « Ta promesse » restitue ἐπαγγελία sans imposer dans le texte l’interprétation « accord » ou « autorisation ».
