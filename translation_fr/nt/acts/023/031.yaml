id: ACT.23.31
reference: Acts 23:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: fr
  text: Les soldats prirent donc Paul en charge et, conformément aux ordres qu’ils avaient reçus, le conduisirent de nuit jusqu’à Antipatris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: Les soldats… donc
  rationale: « donc » rend la progression narrative marquée par οὖν; μέν prépare la suite du récit sans exiger ici de correspondant français explicite.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: conformément aux ordres qu’ils avaient reçus
  rationale: Cette formulation naturelle conserve le sens passif du participe parfait substantivé et renvoie aux directives données auparavant.
- source_word: ἀναλαβόντες τὸν Παῦλον
  choice: prirent Paul en charge
  rationale: « prendre en charge » exprime ici le fait que les soldats se saisissent de Paul pour assurer son transfert, sans ajouter l’idée plus précise d’une escorte.
- source_word: ἤγαγον
  choice: le conduisirent
  rationale: ἄγω désigne le fait de mener ou conduire quelqu’un vers une destination; « conduisirent » convient au déplacement de Paul sous garde.
- source_word: διὰ νυκτός
  choice: de nuit
  rationale: L’expression rend avec concision l’idée d’un déplacement effectué pendant la nuit, sans affirmer qu’il dura toute la nuit.
- source_word: Ἀντιπατρίδα
  choice: Antipatris
  rationale: Le nom propre est translittéré selon l’usage français courant.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase suit l’ordre logique du grec tout en évitant une construction participiale lourde; « en charge » distingue naturellement ἀναλαμβάνω du verbe principal ἄγω.
