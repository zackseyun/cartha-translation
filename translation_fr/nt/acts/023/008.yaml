id: ACT.23.8
reference: Acts 23:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: fr
  text: En effet, les sadducéens disent qu’il n’y a ni résurrection, ni ange, ni esprit, tandis que les pharisiens reconnaissent les deux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une compréhension plus large : « les pharisiens reconnaissent les trois », c’est-à-dire la résurrection, l’ange et l’esprit. Le grec dit littéralement « les deux », ce qui renvoie le plus directement à l’ange et à l’esprit, mais certains comprennent l’expression à la lumière de l’ensemble du contexte.'
    reason: Préserver l’ambiguïté réelle concernant la portée de τὰ ἀμφότερα.
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: les sadducéens
  rationale: Forme française courante du nom de ce groupe juif.
- source_word: μὲν γὰρ
  choice: En effet
  rationale: Rend naturellement la valeur explicative de la combinaison de particules dans ce contexte.
- source_word: λέγουσιν μὴ εἶναι
  choice: disent qu’il n’y a
  rationale: Tournure française idiomatique qui conserve la déclaration générale au présent et la négation d’existence.
- source_word: ἀνάστασιν
  choice: résurrection
  rationale: Désigne ici la résurrection comme réalité ou catégorie, sans limiter le terme à un événement particulier.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: ni ange, ni esprit
  rationale: Conserve la négation corrélative ainsi que les noms singuliers du grec.
- source_word: Φαρισαῖοι
  choice: les pharisiens
  rationale: Forme française courante du nom de ce groupe juif.
- source_word: ὁμολογοῦσιν
  choice: reconnaissent
  rationale: Exprime ici le fait d’admettre ou d’affirmer comme vrai, sans la connotation pénitentielle que pourrait avoir « confessent ».
- source_word: τὰ ἀμφότερα
  choice: les deux
  rationale: 'Traduit directement le grec, qui désigne grammaticalement deux réalités et renvoie le plus naturellement au couple immédiatement précédent : ange et esprit.'
theological_decisions:
- issue: Portée de « les deux » dans l’affirmation des pharisiens
  choice: Le texte principal conserve « les deux », renvoyant le plus naturellement à l’ange et à l’esprit.
  alternative: 'Comprendre que les pharisiens reconnaissent les trois réalités : la résurrection, l’ange et l’esprit.'
  rationale: Le grec porte τὰ ἀμφότερα, « les deux », et non « les trois » ou « tout cela ». Toutefois, le contexte inclut la résurrection et celle-ci faisait aussi partie de la croyance pharisienne ; cette compréhension plus large est donc signalée en note sans remplacer la formulation grecque.
translation_notes:
  register: Français moderne, international et digne. La construction parallèle « ni résurrection, ni ange, ni esprit » reste claire à l’oral comme à l’écrit, tandis que « les deux » préserve la tension du grec et appelle la note explicative.
