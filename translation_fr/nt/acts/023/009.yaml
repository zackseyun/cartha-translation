    rationale: Le verbe grec exprime une dispute ou une contestation véhémente, non une simple protestation. Une formulation indiquant qu’ils se mettent à contester vivement est plus fidèle au mouvement conflictuel du récit.
  - severity: low
    issue: « Et si » pour εἰ δὲ
    rationale: La particule δέ introduit ici une opposition ou réserve; « Mais si » la rend sans compléter la phrase interrompue.
  - severity: low
    issue: « rien de mal chez cet homme »
    rationale: Compréhensible, mais « nous ne trouvons rien à reprocher à cet homme » est plus idiomatique en français moderne et conserve le sens judiciaire de l’énoncé.
