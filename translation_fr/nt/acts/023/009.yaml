id: ACT.23.9
reference: Acts 23:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: fr
  text: 'Alors, de grands cris s’élevèrent, et quelques spécialistes de la Loi appartenant au parti des pharisiens se levèrent et se mirent à contester vivement, disant : « Nous ne trouvons rien à reprocher à cet homme. Mais si un esprit lui a parlé, ou un ange— »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase reste inachevée dans le texte grec.
    reason: source_form
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: de grands cris
  rationale: Expression française naturelle qui rend l’intensité de la clameur collective sans imposer l’idée plus précise d’une émeute.
- source_word: ἀναστάντες
  choice: se levèrent
  rationale: Conserve l’action physique et suggère naturellement qu’ils prennent la parole devant l’assemblée.
- source_word: τινὲς τῶν γραμματέων
  choice: quelques spécialistes de la Loi
  rationale: Dans ce contexte juif, γραμματεῖς désigne des hommes versés dans l’interprétation de la Loi; cette formulation est plus immédiatement intelligible que le terme traditionnel « scribes ».
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: appartenant au parti des pharisiens
  rationale: Rend clairement l’appartenance de ces spécialistes au groupe pharisien au sein du conseil.
- source_word: διεμάχοντο
  choice: protestèrent avec force
  rationale: Exprime la vigueur du désaccord; le passé simple convient au registre narratif français, même si l’imparfait grec présente l’action dans son déroulement.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: Nous ne trouvons rien de mal
  rationale: Formulation naturelle qui conserve la tournure de constat et son possible arrière-plan judiciaire.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: chez cet homme
  rationale: « Chez » est idiomatique en français pour signaler qu’aucune faute ou culpabilité n’est constatée en Paul.
- source_word: εἰ δὲ
  choice: Et si
  rationale: Préserve la proposition conditionnelle inachevée sans la transformer en question complète.
- source_word: πνεῦμα
  choice: un esprit
  rationale: Le contraste avec « un ange » favorise ici le sens général d’un être spirituel, sans exclure artificiellement les autres nuances possibles.
- source_word: ἐλάλησεν αὐτῷ
  choice: lui avait parlé
  rationale: Le plus-que-parfait s’insère naturellement dans cette supposition en français et renvoie à une éventuelle communication antérieure.
- source_word: ἄγγελος
  choice: un ange
  rationale: Le contexte surnaturel indique un ange plutôt qu’un messager humain.
theological_decisions:
- issue: Sens de πνεῦμα en contraste avec ἄγγελος
  choice: « un esprit », au sens non spécifié d’un être spirituel
  alternative: « l’Esprit »
  rationale: L’absence d’article et la coordination avec « un ange » favorisent le sens indéfini. La traduction évite ainsi d’identifier explicitement cet esprit à l’Esprit saint.
- issue: Phrase conditionnelle finale inachevée
  choice: Conserver l’interruption au moyen d’un tiret cadratin
  alternative: 'Compléter en question : « Et si un esprit ou un ange lui avait parlé ? »'
  rationale: Le texte grec transmis s’interrompt après « ou un ange ». Garder cette rupture respecte l’ambiguïté syntaxique et la tension du récit sans fournir une apodose absente.
translation_notes:
  register: Français international moderne, narratif et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate; « pharisiens » reste le terme historique usuel. Le tiret final reproduit l’interruption du grec.
