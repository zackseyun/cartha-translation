  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: fr
  text: Après avoir lu la lettre, le gouverneur demanda de quelle province venait Paul et, ayant appris qu’il était de Cilicie,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: Après avoir lu la lettre
  rationale: Le participe aoriste indique une action antérieure. « La lettre », explicitée d’après le contexte immédiat, rend la phrase naturelle et claire en français.
- source_word: δὲ καὶ ἐπερωτήσας
  choice: le gouverneur demanda
  rationale: δέ est ici une transition légère qui n’exige pas de traduction distincte; καί coordonne les actions. Le sujet « le gouverneur » est explicité d’après le contexte pour éviter une succession obscure de pronoms.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: de quelle province venait Paul
  rationale: ἐπαρχεία désigne une province administrative romaine. « Venait » exprime idiomatiquement l’origine, et « Paul » explicite le référent sous-entendu.
- source_word: πυθόμενος
  choice: ayant appris
  rationale: Le participe exprime le fait d’obtenir le renseignement demandé; cette tournure conserve la progression syntaxique vers la parole du verset suivant.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: qu’il était de Cilicie
  rationale: ἀπό suivi d’un nom de lieu indique l’origine. « Être de » est une formulation française directe et naturelle.
- source_word: Κιλικίας
  choice: Cilicie
  rationale: Forme française usuelle du nom de cette province romaine.
