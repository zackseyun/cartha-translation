source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: fr
  text: Pendant qu’il disait cela, un conflit éclata entre les pharisiens et les sadducéens, et l’assemblée[a] se divisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la foule ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: Pendant qu’il disait cela
  rationale: Le génitif absolu avec participe présent exprime une action contemporaine de la suite du récit. « Pendant qu’il disait cela » rend clairement cette simultanéité en français naturel.
- source_word: ἐγένετο στάσις
  choice: un conflit éclata
  rationale: Avec στάσις, ἐγένετο indique ici le déclenchement d’une opposition. « Un conflit éclata » restitue de façon idiomatique l’apparition soudaine de la dissension.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: entre les pharisiens et les sadducéens
  rationale: Le génitif désigne les deux groupes opposés. La préposition « entre » explicite naturellement leur affrontement en français.
- source_word: ἐσχίσθη
  choice: se divisa
  rationale: Le passif de σχίζω évoque une séparation en partis opposés. La forme pronominale « se divisa » conserve ce sens sans forcer la métaphore.
- source_word: τὸ πλῆθος
  choice: l’assemblée
  rationale: Dans ce contexte, le terme désigne l’ensemble des personnes réunies devant Paul. « L’assemblée » convient mieux à cette réunion formelle que « la foule », tout en laissant cette autre nuance en note.
