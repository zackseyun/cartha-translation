  source_fidelity: La proposition principale et la plupart des choix lexicaux sont fidèles. Toutefois, « se préparait » emploie un imparfait qui présente le complot comme déjà en cours, tandis que le futur infinitif ἔσεσθαι rapporte qu’un complot « devait avoir lieu » / « allait avoir lieu ». La formulation révisée conserve mieux cette valeur prospective. La tournure judiciaire retenue pour λέγειν πρὸς αὐτόν est recevable, avec une note qui signale l’expression grecque plus littérale.
  naturalness: Le texte révisé emploie le vouvoiement, plus naturel dans une lettre administrative adressée à un gouverneur en français moderne. Le singulier grec ne prescrit pas le tutoiement français. La syntaxe reste sobre et adaptée au registre officiel.
  terminology: « Complot », « accusateurs » et « présenter leurs accusations » conviennent au contexte judiciaire. « Aussitôt » rend bien ἐξαυτῆς. La note préserve la portée de λέγειν πρὸς αὐτόν sans imposer une interprétation plus étroite que le grec.
