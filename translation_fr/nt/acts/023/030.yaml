id: ACT.23.30
reference: Acts 23:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: fr
  text: Mais, lorsqu’on m’a informé qu’un complot allait être dirigé contre cet homme, je vous l’ai envoyé aussitôt, après avoir aussi ordonné à ses accusateurs de présenter leurs accusations contre lui devant vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de parler contre lui devant vous ». Dans ce contexte judiciaire, le grec emploie littéralement « parler contre lui devant vous »; il peut désigner la présentation des accusations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: quand on m’a informé
  rationale: Le génitif absolu aoriste passif est rendu par une proposition temporelle naturelle, qui conserve l’idée d’une information reçue.
- source_word: ἐπιβουλῆς
  choice: un complot
  rationale: Le nom désigne un projet hostile ou un guet-apens; « complot » reste naturel sans préciser excessivement la manière prévue.
- source_word: εἰς τὸν ἄνδρα
  choice: contre cet homme
  rationale: « Contre » exprime l’orientation hostile, tandis que « cet homme » reprend clairement Paul dans le style de la lettre.
- source_word: ἔσεσθαι
  choice: se préparait
  rationale: Le futur infinitif indique que le complot était à venir; cette tournure française exprime naturellement son imminence sans affirmer qu’il s’est réalisé.
- source_word: ἐξαυτῆς
  choice: aussitôt
  rationale: L’adverbe marque une action immédiate.
- source_word: ἔπεμψα πρὸς σέ
  choice: je te l’ai envoyé
  rationale: Le complément renvoie implicitement à Paul; le pronom est nécessaire en français courant.
- source_word: παραγγείλας
  choice: en ordonnant aussi
  rationale: Cette construction rend l’action concomitante du participe aoriste et conserve la valeur additive de καί.
- source_word: κατηγόροις
  choice: ses accusateurs
  rationale: Le possessif explicite naturellement en français qu’il s’agit des accusateurs de Paul.
- source_word: λέγειν πρὸς αὐτὸν
  choice: d’exposer devant toi leurs accusations contre lui
  rationale: Dans ce cadre judiciaire, l’expression signifie présenter oralement les griefs dirigés contre l’accusé; cette formulation garde explicitement la relation « contre lui ».
- source_word: ἐπὶ σοῦ
  choice: devant toi
  rationale: L’expression situe la présentation de l’affaire devant Félix en sa qualité d’autorité judiciaire.
