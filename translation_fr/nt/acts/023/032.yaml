id: ACT.23.32
reference: Acts 23:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: fr
  text: Le lendemain, ils laissèrent les cavaliers poursuivre leur route avec lui, puis retournèrent à la forteresse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au camp ». Le terme grec peut désigner un camp ou des quartiers militaires; ici, il renvoie probablement à la forteresse romaine de Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: L’expression idiomatique signifie « le jour suivant ». En français, « Le lendemain » constitue une transition narrative naturelle; δέ n’exige pas ici l’expression d’un contraste marqué.
- source_word: ἐάσαντες
  choice: ils laissèrent
  rationale: Le participe aoriste indique qu’ils permirent aux cavaliers de continuer avant de retourner eux-mêmes; la coordination française restitue naturellement cette succession.
- source_word: τοὺς ἱππεῖς
  choice: les cavaliers
  rationale: Le terme désigne les soldats montés; « cavaliers » est clair, courant et fidèle sans employer le collectif plus technique « cavalerie ».
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: poursuivre leur route avec lui
  rationale: Dans ce contexte d’escorte, les cavaliers continuent le trajet avec Paul tandis que les autres soldats repartent. Cette formulation exprime le mouvement continu sans surinterprétation.
- source_word: ὑπέστρεψαν
  choice: retournèrent
  rationale: Le verbe signifie couramment « retourner » ou « revenir »; « retournèrent » convient au mouvement vers leur point de départ.
- source_word: εἰς τὴν παρεμβολήν
  choice: à la forteresse
  rationale: παρεμβολή peut désigner un camp ou des quartiers militaires. Dans le contexte de Jérusalem, il renvoie vraisemblablement à la forteresse-caserne romaine d’où le détachement était parti.
