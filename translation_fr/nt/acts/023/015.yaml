  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: fr
  text: Maintenant donc, vous, avec le Conseil, faites savoir au commandant afin qu’il le fasse descendre auprès de vous, sous prétexte que vous allez examiner son cas plus attentivement.[a] Quant à nous, nous sommes prêts à le tuer avant qu’il ne s’approche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme si vous alliez examiner plus attentivement les choses qui le concernent ».'
    reason: La note conserve la formulation plus littérale de ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ et explicite l’intention feinte.
  - marker: b
    text: 'Ou : « avant qu’il n’arrive ».'
    reason: Cette variante exprime de façon plus idiomatique l’approche indiquée par ἐγγίζω, tandis que le texte principal en conserve la nuance spatiale.
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: faites savoir
  rationale: L’impératif désigne ici une communication officielle adressée au commandant. « Faites savoir » reste proche du grec sans préciser excessivement qu’il s’agit d’une requête.
- source_word: χιλιάρχῳ
  choice: commandant
  rationale: Le terme désigne l’officier romain commandant la cohorte. « Commandant » est clair en français moderne, tandis que « tribun » serait plus technique.
- source_word: σὺν τῷ συνεδρίῳ
  choice: vous et le Conseil
  rationale: Cette formulation exprime naturellement l’association marquée par σύν et conserve « Conseil » plutôt que d’introduire le terme plus spécialisé « Sanhédrin ».
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: qu’il doit le faire descendre jusqu’à vous
  rationale: « Faire descendre » conserve la nuance directionnelle de κατάγω; « jusqu’à vous » rend εἰς ὑμᾶς de façon naturelle.
- source_word: ὡς μέλλοντας
  choice: sous prétexte que vous voulez
  rationale: Dans ce contexte, ὡς avec le participe présente une intention feinte. « Sous prétexte » rend clairement la tromperie impliquée par le complot.
- source_word: διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ
  choice: examiner son cas plus attentivement
  rationale: « Examiner » convient au contexte judiciaire; « son cas » rend idiomatiquement τὰ περὶ αὐτοῦ, et « plus attentivement » exprime le comparatif ἀκριβέστερον sans français artificiel.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: avant qu’il n’arrive
  rationale: Dans la situation narrative, ἐγγίζω indique qu’il s’approche du lieu prévu. « Avant qu’il n’arrive » est idiomatique; le « ne » est explétif et ne marque pas une négation.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: à le tuer
  rationale: ἀναιρέω signifie ici tuer ou supprimer. « Tuer » est direct et n’ajoute pas l’évaluation explicite que comporterait « assassiner ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve le ton direct du complot. « Conseil » prend une majuscule puisqu’il désigne ici l’organe dirigeant juif connu dans le récit. Les marqueurs de notes [a] et [b] figurent dans le texte principal.
