  to: Maintenant donc, vous, avec le Conseil, faites savoir au commandant afin qu’il le fasse descendre auprès de vous, sous prétexte que vous allez examiner son cas plus attentivement.[a] Quant à nous, nous sommes prêts à le tuer avant qu’il ne s’approche.[b]
  rationale: La révision remplace la modalité d’obligation par une proposition finale fidèle à ὅπως suivi du subjonctif. Elle maintient les choix lexicalement solides du projet et place dans le texte principal la nuance d’approche de ἐγγίζω, avec l’alternative idiomatique en note.
