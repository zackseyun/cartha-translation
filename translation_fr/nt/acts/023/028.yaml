  variant: modern international French
source:
  edition: SBLGNT
  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: fr
  text: Voulant connaître la raison pour laquelle ils l’accusaient, je l’ai fait descendre devant leur conseil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur sanhédrin ». Le mot grec συνέδριον désigne un conseil ; dans ce contexte, il s’agit vraisemblablement du conseil dirigeant juif siégeant à Jérusalem.
    reason: alternative lexicale et précision historique
lexical_decisions:
- source_word: βουλόμενός
  choice: Voulant
  rationale: Le participe exprime le motif de Lysias; « voulant » est direct, naturel et conserve la nuance volitive.
- source_word: τε
  choice: —
  rationale: La particule assure une liaison légère avec ce qui précède; en français, cette continuité est naturellement portée par l’enchaînement de la phrase sans conjonction explicite.
- source_word: ἐπιγνῶναι
  choice: connaître
  rationale: « Connaître » exprime ici le désir d’établir précisément le fondement de l’accusation, sans surtraduire la nuance possible de connaissance complète.
- source_word: τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: le motif de l’accusation portée contre lui
  rationale: Cette formulation française naturelle conserve le cadre judiciaire de αἰτία et ἐγκαλέω, tout en évitant la lourdeur de « le chef d’accusation pour lequel ils l’accusaient ».
- source_word: κατήγαγον
  choice: je l’ai fait descendre
  rationale: La traduction garde le mouvement vers le bas exprimé par κατά-, vraisemblablement en direction du lieu où siégeait le conseil.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: devant leur conseil
  rationale: Avec un organe judiciaire, « devant leur conseil » rend idiomatiquement la comparution visée par εἰς. « Conseil » traduit le terme sans imposer dans le corps du texte l’appellation traditionnelle « sanhédrin ».
