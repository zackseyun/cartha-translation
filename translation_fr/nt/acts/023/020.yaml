id: ACT.23.20
reference: Acts 23:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: fr
  text: 'Il répondit : « Les Juifs[a] se sont mis d’accord pour te demander de faire descendre Paul demain devant le Sanhédrin[b], comme s’ils allaient se renseigner plus précisément à son sujet. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « les Juifs » désigne le groupe impliqué dans le projet contre Paul, et non l’ensemble du peuple juif.
    reason: clarification_contextuelle
  - marker: b
    text: Ou « le Conseil ». Le terme grec désigne ici vraisemblablement le Sanhédrin, le conseil dirigeant juif.
    reason: alternative_lexicale
lexical_decisions:
- source_word: συνέθεντο
  choice: se sont mis d’accord
  rationale: Le moyen συντίθεμαι exprime ici une entente ou un plan concerté. Cette formulation française est naturelle sans donner au verbe seul un sens de complot que le contexte, plutôt que le lexème, établit.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: pour te demander
  rationale: L’infinitif articulé indique ce sur quoi porte leur accord, avec une nuance de but. « Pour te demander » rend directement et naturellement la construction.
- source_word: καταγάγῃς
  choice: faire descendre Paul
  rationale: Le préverbe κατά- marque le mouvement vers le bas, depuis la forteresse vers le lieu où siège le conseil. « Faire descendre » conserve cette orientation.
- source_word: συνέδριον
  choice: Sanhédrin
  rationale: Dans ce contexte de Jérusalem, le terme désigne le conseil dirigeant juif. « Sanhédrin » identifie clairement l’institution, tandis qu’une note donne l’équivalent générique.
- source_word: ὡς
  choice: comme si
  rationale: ὡς présente ici le motif affiché comme un prétexte, sans que la traduction ait besoin d’ajouter explicitement « sous prétexte ».
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: ils allaient obtenir des renseignements plus précis à son sujet
  rationale: μέλλον exprime l’intention ou l’action envisagée; πυνθάνομαι désigne le fait de s’informer et d’apprendre par enquête; τι et le comparatif ἀκριβέστερον sont naturellement rendus par « des renseignements plus précis ».
- source_word: Οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: La traduction conserve le libellé explicite du grec. Une note précise que, dans le contexte immédiat, il s’agit du groupe impliqué dans le projet contre Paul et non de l’ensemble du peuple juif.
theological_decisions:
- issue: Portée de l’expression « Les Juifs » dans un récit hostile
  choice: Conserver « Les Juifs » avec une note contextuelle
  alternative: Les chefs juifs
  rationale: Le grec ne précise pas lexicalement « chefs ». La traduction maintient donc l’ambiguïté référentielle du texte tout en empêchant qu’on lise cette expression comme une accusation collective visant tous les Juifs.
- issue: Caractère trompeur de la demande
  choice: comme s’ils allaient
  alternative: sous prétexte qu’ils allaient
  rationale: « Comme si » préserve la manière indirecte dont ὡς signale le motif apparent, sans expliciter davantage que le grec le caractère mensonger du projet.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement correspond à l’adresse directe au tribun. « Faire descendre » conserve la donnée spatiale du grec; « obtenir des renseignements plus précis » restitue idiomatiquement l’idée d’apprendre par une enquête plus exacte.
