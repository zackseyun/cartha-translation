id: ACT.23.22
reference: Acts 23:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: fr
  text: 'Le commandant renvoya donc le jeune homme en lui donnant cet ordre : « Ne dis à personne que tu m’as communiqué[a] ces informations. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que tu m’as informé de ces choses » ou « que tu m’as fait connaître ces choses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: commandant
  rationale: Désigne ici l’officier romain à la tête de la troupe. « Commandant » est clair en français moderne et restitue son autorité sans recourir au terme plus technique « tribun ».
- source_word: ἀπέλυσε
  choice: renvoya
  rationale: Dans ce contexte, l’officier met fin à l’entretien et laisse repartir le jeune homme. « Renvoya » convient mieux que « libéra », qui pourrait suggérer une détention.
- source_word: νεανίσκον
  choice: jeune homme
  rationale: Le terme désigne un homme relativement jeune. « Jeune homme » est naturel, respectueux et ne précise pas excessivement son âge.
- source_word: παραγγείλας
  choice: en lui donnant cet ordre
  rationale: Le participe exprime une directive faisant autorité. Cette formulation rend clairement la force de l’instruction tout en s’intégrant naturellement à la phrase française.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: Ne dis à personne
  rationale: L’expression interdit de divulguer l’information à qui que ce soit. « Ne dis à personne » est direct et idiomatique.
- source_word: ἐνεφάνισας
  choice: tu m’as fait part
  rationale: Le verbe signifie faire connaître ou signaler quelque chose, notamment à une autorité. « Faire part » convient au contexte sans imposer le registre plus administratif de « rapporter ».
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie aux renseignements qui viennent d’être communiqués et son nombre est conservé.
- source_word: πρὸς ἐμέ
  choice: à moi / me
  rationale: Après ce verbe de communication, πρός avec l’accusatif indique le destinataire. Le pronom « me » l’exprime naturellement en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le récit conserve le ton officiel de la scène, tandis que l’ordre direct reste simple et immédiatement compréhensible.
