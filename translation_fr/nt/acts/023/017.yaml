source:
  edition: SBLGNT
  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: fr
  text: 'Paul appela alors l’un des centurions et lui dit : « Conduis ce jeune homme auprès du commandant, car il a quelque chose à lui communiquer[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à lui rapporter » ou « à lui dire ». Le verbe grec peut désigner l’action d’annoncer, de rapporter ou de communiquer une information.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: appela
  rationale: Le participe aoriste moyen indique que Paul fait venir le centurion auprès de lui avant de parler. « Appela » est naturel et suffisamment précis en français.
- source_word: δὲ
  choice: alors
  rationale: Ici, δέ fait progresser le récit sans marquer une opposition forte. « Alors » assure un enchaînement narratif fluide.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: l’un des centurions
  rationale: « Centurion » est le terme historique français consacré pour ce grade de l’armée romaine.
- source_word: ἔφη
  choice: lui dit
  rationale: Le verbe φημί est rendu simplement par « dit » ; le pronom « lui » explicite naturellement le destinataire déjà mentionné.
- source_word: νεανίαν
  choice: jeune homme
  rationale: νεανίας désigne un homme relativement jeune. « Jeune homme » est clair, courant et digne.
- source_word: ἄπαγε
  choice: Conduis
  rationale: L’impératif ἀπάγω signifie ici mener quelqu’un auprès d’une autre personne. « Conduis » conserve cette nuance plus directement que le générique « emmène ».
- source_word: πρὸς τὸν χιλίαρχον
  choice: auprès du commandant
  rationale: χιλίαρχος désigne ici l’officier romain commandant la troupe. « Commandant » est précis dans le contexte et plus accessible que le terme technique « tribun militaire ».
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: car il a quelque chose à lui communiquer
  rationale: La construction ἔχει + infinitif exprime quelque chose que le jeune homme doit dire. ἀπαγγέλλω peut signifier annoncer, rapporter ou communiquer ; « communiquer » convient à la transmission d’une information sans surspécifier son caractère officiel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible tout en conservant le titre militaire historique « centurion ». Le marqueur de note [a] est placé immédiatement après l’expression concernée.
