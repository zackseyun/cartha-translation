lexical_decisions:
- source_word: γράψας
  choice: Il écrivit
  rationale: Le participe aoriste renvoie à l’action du commandant mentionné au verset précédent. Une forme verbale personnelle assure en français un récit naturel sans modifier le sens.
- source_word: ἐπιστολήν
  choice: une lettre
  rationale: « Lettre » est l’équivalent moderne et courant de ἐπιστολή dans ce contexte narratif.
- source_word: ἔχουσαν
  choice: conçue
  rationale: Le participe présent qualifie la lettre. La tournure « conçue en ces termes » rend naturellement l’idée qu’elle présente la forme ou la teneur annoncée.
- source_word: τύπον
  choice: termes
  rationale: Dans cette formule introductive, τύπος désigne la forme ou la teneur de la lettre qui va être citée. « En ces termes » est une formulation française idiomatique, sans limiter le mot au seul contenu conceptuel.
- source_word: τοῦτον
  choice: ces
  rationale: 'Le démonstratif a une valeur cataphorique : il annonce le texte de la lettre qui suit.'
