id: ACT.27.2
reference: Acts 27:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: fr
  text: Puis nous sommes montés à bord d’un navire d’Adramyttium qui devait se rendre en divers endroits le long de la côte de l’Asie[a][b], et nous avons pris le large. Aristarque, un Macédonien de Thessalonique, était avec nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la province romaine d’Asie, située dans l’ouest de l’Asie Mineure, et non du continent asiatique actuel.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « vers les ports de la côte de l’Asie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: nous sommes montés à bord
  rationale: Dans ce contexte maritime, ἐπιβαίνω désigne le fait de monter sur un navire. Cette formulation est naturelle en français et maintient l’action préalable au départ.
- source_word: δὲ
  choice: Puis
  rationale: δέ assure ici la progression du récit sans exprimer une forte opposition. « Puis » convient au déroulement narratif.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: un navire d’Adramyttium
  rationale: L’adjectif indique vraisemblablement le port d’attache ou l’origine du navire. En français, le complément avec « de » est plus naturel qu’un adjectif gentilé rare.
- source_word: μέλλοντι πλεῖν
  choice: qui devait se rendre
  rationale: μέλλω avec l’infinitif exprime ici un trajet prévu ou imminent. « Devait se rendre » restitue ce projet sans affirmer que toutes les escales ont effectivement eu lieu.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: en divers endroits le long de la côte de l’Asie
  rationale: La construction désigne des lieux répartis le long de l’Asie, dans un contexte de navigation. « Côte » explicite raisonnablement le cadre maritime, tandis que « endroits » évite d’imposer « ports » dans le texte principal.
- source_word: Ἀσίαν
  choice: l’Asie
  rationale: Le nom historique est conservé dans le texte, et une note précise qu’il s’agit de la province romaine plutôt que du continent moderne.
- source_word: ἀνήχθημεν
  choice: nous avons pris le large
  rationale: ἀνάγω au passif est une expression nautique usuelle pour quitter le port. « Prendre le large » en rend clairement et naturellement le sens.
- source_word: ὄντος σὺν ἡμῖν
  choice: était avec nous
  rationale: Le génitif absolu indique une circonstance concomitante. Une proposition indépendante est plus fluide en français tout en préservant l’information.
- source_word: Ἀριστάρχου Μακεδόνος Θεσσαλονικέως
  choice: Aristarque, un Macédonien de Thessalonique
  rationale: Les noms sont rendus selon leurs formes françaises courantes, et les deux indications géographiques sont conservées sans empiler des gentilés peu naturels.
theological_decisions: []
