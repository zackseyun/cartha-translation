lexical_decisions:
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition avec ce qui précède; « Mais » rend naturellement cette transition.
- source_word: δεῖ
  choice: nous devons
  rationale: Le verbe exprime une nécessité; cette formulation en conserve la force sans alourdir la phrase.
- source_word: εἰς νῆσον τινα
  choice: sur une île
  rationale: La préposition exprime la direction, νῆσος désigne une île et τινα la laisse indéterminée; en français, l’article indéfini suffit naturellement à rendre cette indétermination.
- source_word: ἐκπεσεῖν
  choice: échouer
  rationale: Dans ce contexte maritime, le verbe désigne le fait d’être poussé ou de venir à la côte; « échouer » est concis, idiomatique et laisse l’agent implicite.
