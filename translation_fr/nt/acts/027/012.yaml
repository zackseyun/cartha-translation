source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: fr
  text: Comme le port ne se prêtait pas à y passer l’hiver, la majorité décida d’appareiller de là, dans l’espoir de pouvoir atteindre Phénix et d’y passer l’hiver, un port de Crète orienté vers le sud-ouest et le nord-ouest[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La dernière indication d’orientation est difficile à interpréter. On la traduit traditionnellement par « vers le sud-ouest et le nord-ouest » ; le second terme peut désigner plus précisément l’ouest-nord-ouest.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνευθέτου
  choice: se prêtait mal
  rationale: Cette tournure française naturelle exprime que le port était peu adapté à l’hivernage, sans laisser entendre qu’il était totalement inutilisable.
- source_word: λιμένος
  choice: port
  rationale: Dans ce récit maritime, « port » désigne naturellement le lieu d’abri et d’accostage; « havre » serait plus littéraire et moins courant.
- source_word: πρὸς παραχειμασίαν
  choice: à un hivernage
  rationale: Le groupe exprime l’usage envisagé du port, à savoir y demeurer pendant l’hiver.
- source_word: οἱ πλείονες
  choice: la majorité
  rationale: Le comparatif substantivé désigne la plus grande partie du groupe.
- source_word: ἔθεντο βουλήν
  choice: décida
  rationale: Cette expression idiomatique grecque indique qu’une décision collective fut prise.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: reprendre la mer de là
  rationale: Dans son emploi nautique, ἀνάγω signifie appareiller ou prendre la mer. « Reprendre la mer » convient au contexte d’une escale déjà en cours.
- source_word: εἴ πως δύναιντο
  choice: dans l’espoir de pouvoir
  rationale: Cette formulation conserve à la fois l’incertitude et l’espoir exprimés par εἴ πως avec l’optatif, tout en restant naturelle en français.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: atteindre Phénix
  rationale: Le participe exprime l’arrivée à destination; « atteindre » convient à une traversée dont l’issue demeure incertaine.
- source_word: Φοίνικα
  choice: Phénix
  rationale: « Phénix » est la forme française moderne et transparente du nom de ce port crétois.
- source_word: παραχειμάσαι
  choice: y passer l’hiver
  rationale: Cette expression courante rend clairement l’action de demeurer sur place pendant toute la saison hivernale.
- source_word: βλέποντα
  choice: orienté vers
  rationale: Appliqué à un port, le verbe décrit son orientation ou son ouverture géographique; « orienté vers » évite le calque peu naturel « regardant vers ».
- source_word: κατὰ λίβα καὶ κατὰ χῶρον
  choice: vers le sud-ouest et le nord-ouest
  rationale: C’est l’interprétation traditionnelle des deux termes nautiques désignant des directions ou des vents, tout en signalant en note l’incertitude du second.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été divisée en deux pour éviter une période trop lourde, sans modifier le lien explicatif entre Phénix et sa description. « Hivernage » conserve le vocabulaire maritime tout en restant compréhensible dans le contexte.
