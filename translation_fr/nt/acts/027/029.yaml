  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: fr
  text: Craignant que nous n’échouions sur des zones rocheuses[a], ils jetèrent quatre ancres depuis la poupe et priaient pour que le jour se lève[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que nous ne tombions sur des lieux accidentés » ou « que nous ne soyons poussés sur des rochers déchiquetés ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « priaient pour que le jour advienne ». Le verbe peut aussi exprimer ici le souhait ardent de voir arriver le jour.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: Craignant
  rationale: Le participe français conserve le lien circonstanciel et causal avec les actions qui suivent.
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: que nous ne soyons jetés sur des endroits rocheux
  rationale: Cette formulation garde l’idée d’appréhension, la première personne du pluriel de ἐκπέσωμεν et le danger maritime, sans préciser indûment s’il s’agit d’une côte, de récifs ou de hauts-fonds.
- source_word: ἐκ πρύμνης
  choice: depuis la poupe
  rationale: « Poupe » est le terme nautique français précis et courant pour l’arrière du navire.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: ils lancèrent quatre ancres
  rationale: Le participe aoriste exprime une action accomplie avant la prière; « lancer des ancres » rend concrètement le geste sans suggérer qu’elles furent seulement déposées.
- source_word: ηὔχοντο
  choice: priaient
  rationale: L’imparfait rend l’action continue, tandis que « priaient » conserve le sens religieux naturel de εὔχομαι; la possibilité contextuelle d’un souhait ardent est signalée en note.
- source_word: ἡμέραν γενέσθαι
  choice: pour que le jour se lève
  rationale: Expression française naturelle pour l’arrivée du jour, tout en gardant en note la tournure plus littérale « que le jour advienne ».
theological_decisions:
- issue: 'Sens de ηὔχοντο : prière adressée à Dieu ou souhait ardent'
  choice: priaient
  alternative: souhaitaient ardemment
  rationale: Le verbe peut désigner la prière, sens retenu dans le texte, mais le contexte permet aussi de comprendre qu’ils aspiraient vivement à l’arrivée du jour; la note préserve cette ambiguïté sans identifier l’objet ou le destinataire de la prière.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire nautique « poupe » et « ancres » reste précis mais accessible. La première personne « nous » est maintenue dans la proposition de crainte, conformément au grec, tandis que « ils » demeure le sujet narratif des actions.
