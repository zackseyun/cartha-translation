id: ACT.27.1
reference: Acts 27:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: fr
  text: Lorsqu’il fut décidé que nous partirions par mer pour l’Italie, on remit Paul ainsi que quelques autres prisonniers à un centurion nommé Julius, de la cohorte Auguste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la cohorte impériale »; peut-être « de la cohorte de Sébaste ». Le grec Σεβαστῆς renvoie à un titre associé à Auguste ou à l’empereur, mais l’identité exacte de cette unité militaire est incertaine.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: il fut décidé
  rationale: L’aoriste passif est employé de manière impersonnelle et évoque une décision officielle. Cette formulation française en conserve le caractère passif et administratif.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: que nous partirions par mer
  rationale: L’infinitif articulé exprime le contenu de la décision. « Par mer » rend la précision maritime de ἀποπλεῖν, et « nous » maintient le récit à la première personne.
- source_word: παρεδίδουν
  choice: on remit
  rationale: Le verbe décrit ici le transfert officiel de prisonniers sous la garde d’un autre responsable. Le pronom « on » rend naturellement en français le sujet non précisé du grec.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: Paul ainsi que quelques autres prisonniers
  rationale: « Ainsi que » restitue naturellement la coordination τε…καί, tandis que « quelques autres prisonniers » rend clairement τινας ἑτέρους δεσμώτας.
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: à un centurion nommé Julius
  rationale: Le datif désigne le destinataire du transfert de garde. L’article indéfini convient puisque l’officier est présenté pour la première fois, et « nommé Julius » rend la formule grecque de dénomination.
- source_word: σπείρης Σεβαστῆς
  choice: de la cohorte Auguste
  rationale: Σεβαστή correspond au titre latin Augustus et qualifie vraisemblablement une unité liée à l’empereur. « Cohorte Auguste » reste proche du grec tout en étant intelligible en français; l’identification historique demeure toutefois incertaine.
theological_decisions:
- issue: Identification de σπείρης Σεβαστῆς, désignation militaire historiquement discutée
  choice: de la cohorte Auguste
  alternative: de la cohorte impériale; de la cohorte de Sébaste
  rationale: Le choix conserve le lien lexical avec le titre impérial « Auguste » sans trancher l’identité exacte de l’unité. Les autres interprétations plausibles sont signalées en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la narration à la première personne et le ton administratif du transfert de garde, sans ajouter de précision absente du grec.
