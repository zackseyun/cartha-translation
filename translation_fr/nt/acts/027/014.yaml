translation_notes:
  register: Français international moderne, naturel et digne. « Vent d’ouragan » communique la violence de τυφωνικός plus clairement que le terme technique et peu courant « typhonique ». Le mouvement depuis la Crète est explicité par « depuis l’île », conformément au contexte immédiat.
