  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: fr
  text: Mais peu après, un vent de tempête, appelé Euraquilon[a][b], s’abattit sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un violent vent du nord-est » ; ce nom désigne probablement un vent de tempête venant du nord-est, mais le grec le présente comme un nom propre.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « Euroclydon » au lieu d’« Euraquilon ».
    reason: textual_variant
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: peu après
  rationale: Expression temporelle idiomatique indiquant qu’un bref intervalle s’est écoulé.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une transition légèrement contrastive vers un brusque changement de situation.
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: se déchaîna depuis l’île
  rationale: Avec le vent pour sujet, ἔβαλεν exprime une irruption violente; κατά avec le génitif peut indiquer un mouvement descendant depuis la Crète, antécédent féminin naturel de αὐτῆς dans le contexte.
- source_word: ἄνεμος τυφωνικὸς
  choice: un vent d’ouragan
  rationale: Rend en français courant et soutenu un vent tourbillonnant d’une extrême violence, sans lui attribuer une catégorie météorologique moderne trop précise.
- source_word: ὁ καλούμενος
  choice: appelé
  rationale: Formule ordinaire introduisant le nom ou la désignation du vent.
- source_word: Εὐρακύλων
  choice: Euraquilon
  rationale: Translittération adaptée à l’orthographe française du nom propre attesté dans le texte grec retenu; le sens probable est signalé en note sans remplacer le nom dans le texte.
