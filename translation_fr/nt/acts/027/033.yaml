source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: fr
  text: 'Jusqu’au moment où le jour allait paraître, Paul ne cessait d’insister auprès de tous pour qu’ils prennent de la nourriture. Il disait : « Cela fait aujourd’hui quatorze jours que vous restez dans l’attente[a], sans manger et sans rien prendre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans une attente anxieuse » ; le participe grec peut désigner l’attente et, dans le contexte de la tempête, peut comporter une nuance d’inquiétude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: Jusqu’à l’approche du jour
  rationale: Cette formulation française naturelle conserve la limite temporelle exprimée par Ἄχρι οὗ et l’imminence du jour portée par ἤμελλεν γίνεσθαι, sans reproduire littéralement la tournure grecque « le jour allait devenir ».
- source_word: παρεκάλει
  choice: ne cessait d’insister auprès de
  rationale: L’imparfait grec présente une action prolongée ou répétée. « Ne cessait d’insister » en restitue la durée et la force dans un français courant.
- source_word: ἅπαντας
  choice: tous
  rationale: Le mot inclut l’ensemble des personnes présentes à bord.
- source_word: μεταλαβεῖν τροφῆς
  choice: prendre de la nourriture
  rationale: La formulation conserve l’idée de prendre une part de nourriture et convient au registre narratif sans être archaïque.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: Cela fait aujourd’hui quatorze jours
  rationale: Cette tournure idiomatique maintient l’accent grec sur le fait que le jour présent est le quatorzième.
- source_word: προσδοκῶντες
  choice: dans l’attente
  rationale: Le participe désigne l’attente ou l’expectative. Le texte principal garde cette valeur sans imposer l’idée d’angoisse, tandis qu’une note signale la nuance possible dans le contexte.
- source_word: ἄσιτοι διατελεῖτε
  choice: vous restez … sans manger
  rationale: « Restez » exprime la continuité de l’état, et « sans manger » évite « jeûner », qui pourrait suggérer à tort une pratique religieuse volontaire.
- source_word: μηθὲν προσλαβόμενοι
  choice: sans rien prendre
  rationale: La traduction préserve la reprise emphatique du grec après « sans manger », plutôt que de supprimer cette apparente redondance.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’insistance de Paul, la durée de l’attente et la répétition emphatique de l’absence de nourriture. Le marqueur de note est placé après « dans l’attente », expression qu’il précise directement.
