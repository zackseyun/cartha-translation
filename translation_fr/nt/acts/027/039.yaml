  - severity: low
    issue: « la côte » pour τὴν γῆν
    rationale: Le contexte autorise « côte », mais γῆ signifie directement « terre ». « Ils ne reconnurent pas la terre » conserve l’expression source sans perdre l’intelligibilité.
