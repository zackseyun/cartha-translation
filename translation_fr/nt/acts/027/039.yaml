source:
  edition: SBLGNT
  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: fr
  text: Quand le jour se leva, ils ne reconnurent pas la terre, mais ils remarquèrent une baie avec une plage, dans laquelle ils envisageaient, s’ils le pouvaient, de faire échouer le navire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pousser le navire sur le rivage ». Le verbe grec évoque l’action de pousser ou de forcer volontairement le navire jusqu’au rivage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: Quand le jour se leva
  rationale: Formulation française naturelle pour l’arrivée du jour; δέ assure ici une transition narrative légère qui n’exige pas de connecteur distinct.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: ils ne reconnurent pas la côte
  rationale: ἐπιγινώσκω signifie reconnaître ou identifier. Dans ce contexte maritime, γῆ désigne la terre telle qu’elle se présente aux navigateurs, donc la côte, sans impliquer qu’ils ne voyaient aucune terre.
- source_word: κόλπον δέ τινα κατενόουν
  choice: mais remarquèrent une baie
  rationale: κόλπος désigne ici une baie ou une anse, et κατανοέω une observation attentive. L’article indéfini français conserve naturellement l’indétermination de τινα.
- source_word: ἔχοντα αἰγιαλόν
  choice: avec une plage
  rationale: αἰγιαλός désigne le rivage ou la plage. « Plage » convient à la manœuvre envisagée sans ajouter l’idée non exprimée d’un rivage sablonneux.
- source_word: εἰς ὃν
  choice: d’y
  rationale: Le pronom adverbial « y » reprend naturellement la baie et conserve la direction exprimée par εἰς.
- source_word: ἐβουλεύοντο
  choice: Ils décidèrent
  rationale: Le verbe peut exprimer la délibération, le projet ou la décision. Ici, le contexte présente l’intention arrêtée de tenter cette manœuvre, tout en maintenant son caractère conditionnel dans la proposition suivante.
- source_word: εἰ δύναιντο
  choice: s’ils le pouvaient
  rationale: Cette formulation conserve explicitement la possibilité incertaine exprimée par εἰ avec l’optatif.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: faire échouer le navire
  rationale: Dans ce contexte nautique, ἐξωθέω décrit l’action de pousser ou d’amener volontairement le navire sur le rivage. « Faire échouer » est concis, naturel et indique que l’échouage est intentionnel.
