revisions:
- from: Ils jetèrent la sonde[a] et trouvèrent vingt brasses de profondeur. Un peu plus loin, ils jetèrent de nouveau la sonde et en trouvèrent quinze.
  to: Après avoir sondé, ils trouvèrent une profondeur de vingt brasses. Après avoir parcouru une courte distance, ils sondèrent de nouveau et trouvèrent une profondeur de quinze brasses.
  rationale: La révision rend βολίσαντες par le verbe maritime usuel « sonder », maintient le bref déplacement entre les deux mesures et explicite avec cohérence les profondeurs relevées. La note conserve l’image plus littérale du jet de la sonde sans l’imposer au texte courant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : deux sondages successifs donnent vingt puis quinze brasses. Toutefois, « jeter la sonde » décrit plus concrètement le geste et peut paraître moins idiomatique que « sonder » pour rendre βολίζειν, qui désigne l’opération de sonder. La progression après un bref déplacement doit aussi être explicitement conservée.'
  naturalness: Le texte est clair, mais la répétition de « jeter la sonde » est un peu lourde et « en trouvèrent quinze » a un antécédent moins net. Une formulation avec « sonder » et « une profondeur de ... brasses » est plus fluide en français moderne international.
  terminology: « Brasse » est l’équivalent nautique français approprié d’ὀργυιά dans ce contexte. « Sonder » est le terme maritime naturel pour la mesure de profondeur à la ligne lestée. Aucun enjeu théologique ou de nom propre n’est présent.
  issues:
  - severity: low
    issue: « Ils jetèrent la sonde » est moins naturel que « ils sondèrent » comme rendu direct de βολίσαντες.
    rationale: Le grec désigne l’opération de prendre un sondage; « sonder » restitue cette action de manière idiomatique sans perdre la précision maritime.
  - severity: low
    issue: « Un peu plus loin » rend l’idée générale, mais ne marque pas aussi explicitement le bref déplacement préalable exprimé par βραχὺ διαστήσαντες.
    rationale: « Après avoir parcouru une courte distance » conserve clairement la relation temporelle et le mouvement.
  - severity: low
    issue: Dans « en trouvèrent quinze », le pronom « en » est légèrement elliptique.
    rationale: La répétition mesurée de « une profondeur de ... brasses » rend le résultat du second sondage immédiatement clair.
  revised_text: Après avoir sondé, ils trouvèrent une profondeur de vingt brasses. Après avoir parcouru une courte distance, ils sondèrent de nouveau et trouvèrent une profondeur de quinze brasses.
  revised_footnotes:
