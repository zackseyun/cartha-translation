  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: fr
  text: Après avoir sondé, ils trouvèrent une profondeur de vingt brasses. Après avoir parcouru une courte distance, ils sondèrent de nouveau et trouvèrent une profondeur de quinze brasses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βολίσαντες
  choice: ils jetèrent la sonde
  rationale: Le verbe désigne l’action de mesurer la profondeur au moyen d’une ligne de sonde lestée. Cette expression française est naturelle dans un contexte maritime et conserve l’image concrète du grec.
- source_word: εὗρον
  choice: trouvèrent / en trouvèrent
  rationale: Rend directement l’aoriste et présente les valeurs obtenues par les deux mesures; la reprise pronominale « en » évite une lourde répétition.
- source_word: ὀργυιὰς
  choice: brasses de profondeur
  rationale: La brasse est l’équivalent nautique français naturel de l’ὀργυιά, soit approximativement 1,8 mètre. L’ajout « de profondeur » rend immédiatement la mesure compréhensible.
- source_word: εἴκοσι
  choice: vingt
  rationale: Traduction directe du nombre.
- source_word: βραχὺ διαστήσαντες
  choice: un peu plus loin
  rationale: Dans ce récit de navigation, l’expression indique qu’ils parcoururent une courte distance avant la seconde mesure. La formulation française restitue naturellement le mouvement implicite.
- source_word: πάλιν βολίσαντες
  choice: ils jetèrent de nouveau la sonde
  rationale: Restitue clairement la répétition de la même opération nautique.
- source_word: δεκαπέντε
  choice: quinze
  rationale: Traduction directe du nombre.
- source_word: καὶ ... δὲ ... καὶ
  choice: coordination narrative en deux phrases
  rationale: Les connecteurs organisent surtout la succession des actions plutôt qu’une opposition forte; deux phrases brèves rendent clairement cette progression en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire maritime « jeter la sonde » et « brasse » conserve la précision du contexte, tandis que « de profondeur » et la note rendent le sens accessible aux lecteurs non spécialistes.
