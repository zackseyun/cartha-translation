    reason: Précision lexicale et historique sur l’opération de sondage.
  revision_rationale: La révision rend βολίσαντες par le verbe maritime usuel « sonder », maintient le bref déplacement entre les deux mesures et explicite avec cohérence les profondeurs relevées. La note conserve l’image plus littérale du jet de la sonde sans l’imposer au texte courant.
