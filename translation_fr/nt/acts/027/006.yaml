  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: fr
  text: Là, le centurion trouva un navire d’Alexandrie qui faisait route vers l’Italie, et il nous fit monter à bord.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: Là
  rationale: Le composé peut signifier « et là » ou simplement « là » dans la continuité du récit. Le français peut laisser la coordination implicite sans perdre le lien narratif.
- source_word: εὑρὼν
  choice: trouva
  rationale: Le participe aoriste exprime une action antérieure à l’embarquement. Deux verbes coordonnés donnent en français une séquence naturelle et fidèle.
- source_word: ἑκατοντάρχης
  choice: le centurion
  rationale: « Centurion » est le terme français précis et couramment compris pour ce grade de l’armée romaine.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: un navire d’Alexandrie
  rationale: L’adjectif indique le rapport du navire avec Alexandrie, probablement son origine ou son port d’attache. Cette formulation française est naturelle sans préciser au-delà du grec.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: qui faisait route vers l’Italie
  rationale: Le participe présent avec la destination indique que le navire naviguait à destination de l’Italie. « Faisait route vers » convient au contexte maritime et reste accessible.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: il nous fit monter à bord
  rationale: 'Le verbe est causatif : le centurion fit embarquer le groupe. « Fit monter à bord » restitue clairement cette nuance en français idiomatique.'
