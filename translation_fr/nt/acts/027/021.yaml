    issue: « Après une longue période sans manger »
    rationale: Cette expression situe le discours après la période, alors que πολλῆς ἀσιτίας ὑπαρχούσης décrit la privation de nourriture comme circonstance en cours. « Comme ils n’avaient pas mangé depuis longtemps » rend mieux cette circonstance sans affirmer un jeûne volontaire.
  - severity: medium
    issue: « ces mauvais traitements et ces pertes »
    rationale: Dans ce contexte, ὕβρις se rapporte au dommage subi, non à des mauvais traitements infligés à des personnes. Le pluriel ajoute aussi une nuance absente des deux singuliers grecs.
  - severity: low
    issue: « ne pas quitter la Crète »
    rationale: Le contexte permet de comprendre le sens, mais ἀνάγεσθαι est spécifiquement nautique. « Ne pas prendre la mer depuis la Crète » le rend avec davantage de précision.
