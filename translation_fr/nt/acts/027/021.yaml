  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: fr
  text: 'Comme ils n’avaient pas mangé depuis longtemps[a], Paul se leva au milieu d’eux et dit : « Messieurs, vous auriez dû m’écouter[b], ne pas prendre la mer depuis la Crète et vous épargner ainsi ce dommage et cette perte[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après un long jeûne ». Le mot grec peut désigner soit le manque de nourriture, soit l’abstention de manger ; dans le contexte de la tempête, il évoque plus probablement une longue période sans nourriture.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’obéir ». Le verbe grec peut exprimer l’obéissance à une instruction ou à une autorité ; ici, il s’agit de tenir compte du conseil de Paul.
    reason: lexical_alternative
  - marker: c
    text: Les deux termes grecs distinguent probablement le dommage subi et la perte qui en découle.
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: Après une longue période sans manger
  rationale: Le génitif absolu pose la circonstance préalable au discours. ἀσιτία peut désigner le manque de nourriture ou l’abstention de manger ; dans le contexte de la tempête, une période prolongée sans manger est la lecture la plus naturelle. « Après » évite de suggérer une causalité trop forte.
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: Paul se leva au milieu d’eux
  rationale: Le participe indique que Paul prend position pour s’adresser publiquement au groupe. Cette formulation est naturelle tout en conservant l’image spatiale du grec.
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: Messieurs, vous auriez dû
  rationale: L’imparfait de δεῖ exprime ici ce qui aurait dû être fait. « Messieurs » convient à l’adresse directe d’un groupe d’hommes dans un registre digne et actuel.
- source_word: πειθαρχήσαντάς μοι
  choice: m’écouter
  rationale: πειθαρχέω peut signifier obéir ou se laisser persuader. Ici, il s’agit de tenir compte du conseil maritime de Paul sans nécessairement lui attribuer une autorité officielle.
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: ne pas quitter la Crète
  rationale: Dans ce contexte nautique, ἀνάγω signifie prendre la mer. « Quitter la Crète » est fluide et le cadre rend le départ maritime évident.
- source_word: κερδῆσαί τε
  choice: Vous auriez ainsi évité
  rationale: κερδαίνω signifie littéralement gagner ou tirer profit, mais peut idiomatiquement exprimer le fait de s’épargner un dommage. La traduction explicite clairement le résultat irréel attendu.
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: ces mauvais traitements et ces pertes
  rationale: ὕβρις évoque ici les sévices ou dommages subis sous la violence de la tempête, tandis que ζημία désigne la perte encourue. Le pluriel français convient naturellement aux conséquences multiples sans effacer la distinction lexicale.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le reproche mesuré de Paul et distingue autant que possible ὕβρις de ζημία, sans imposer une précision absente du contexte.
