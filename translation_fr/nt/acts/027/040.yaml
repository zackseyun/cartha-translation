  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: fr
  text: Après avoir largué les ancres, ils les laissèrent dans la mer. En même temps, ils relâchèrent les cordages[a] des gouvernails, hissèrent la voile d’avant au vent qui soufflait[b] et mirent le cap sur la plage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les liens » ou « les attaches des gouvernails » ; le mot grec est un terme nautique rare désignant ce qui maintenait l’appareil de direction.
    reason: lexical_alternative
  - marker: b
    text: Ou « la voile de proue » ou « la voile supérieure » ; l’identification exacte de la voile désignée par ce terme nautique grec est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: après avoir détaché
  rationale: Le participe aoriste marque une action préalable. Dans ce contexte nautique, il s’agit de libérer les ancres; « détaché » reste naturel sans préciser, au-delà du grec, si les cordages ont été coupés.
- source_word: τὰς ἀγκύρας … εἴων εἰς τὴν θάλασσαν
  choice: les ancres, ils les abandonnèrent à la mer
  rationale: ἐάω exprime ici le fait de laisser aller ou d’abandonner les ancres dans la mer. Cette formulation rend clairement leur abandon définitif.
- source_word: ἅμα
  choice: en même temps
  rationale: L’expression signale que les manœuvres suivantes sont effectuées simultanément.
- source_word: ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: ils relâchèrent les cordages qui maintenaient les gouvernails
  rationale: ἀνίημι signifie relâcher ou libérer. ζευκτηρίας est un terme nautique rare désignant les liens ou attaches qui retenaient l’appareil de direction; la formulation explicite sa fonction sans imposer une reconstitution technique trop précise.
- source_word: τῶν πηδαλίων
  choice: les gouvernails
  rationale: Le pluriel correspond vraisemblablement aux deux grandes rames-gouvernails des navires antiques. « Gouvernails » est clair et conserve le pluriel grec.
- source_word: ἐπάραντες τὸν ἀρτέμωνα
  choice: hissèrent la voile d’avant
  rationale: ἐπαίρω désigne ici l’action de hisser une voile. ἀρτέμων est un terme nautique dont le référent exact est discuté; « voile d’avant » est une désignation plausible et compréhensible, assortie d’une note.
- source_word: τῇ πνεούσῃ
  choice: au vent
  rationale: Le participe substantivé renvoie à ce qui souffle, c’est-à-dire au vent. La tournure française est concise et idiomatique dans ce contexte.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: mirent le cap sur la plage
  rationale: 'κατέχω possède ici un sens nautique: tenir ou diriger sa course vers un lieu. αἰγιαλός désigne précisément la plage ou le rivage.'
