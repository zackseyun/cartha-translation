  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: fr
  text: 'Et les autres : les uns sur des planches, les autres sur des débris du navire. C’est ainsi que tous parvinrent sains et saufs à terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: les autres
  rationale: L’expression désigne les personnes restantes, après celles qui savaient nager mentionnées au verset précédent. « Les autres » est naturel en français et maintient le lien narratif.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: les uns... les autres
  rationale: Cette tournure corrélative française rend clairement la répartition du groupe en deux catégories.
- source_word: ἐπὶ σανίσιν
  choice: sur des planches
  rationale: σανίς désigne une planche; ce terme convient précisément au contexte du naufrage.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: sur des débris du navire
  rationale: Le grec évoque de manière indéfinie certains objets provenant du navire. « Débris » exprime naturellement cette idée sans préciser leur nature.
- source_word: καὶ οὕτως ἐγένετο
  choice: C’est ainsi que
  rationale: L’expression introduit le résultat obtenu par les moyens qui viennent d’être décrits; cette formulation française est fluide et fidèle à la logique grecque.
- source_word: πάντας διασωθῆναι
  choice: tous parvinrent sains et saufs
  rationale: Dans ce récit de naufrage, διασῴζω exprime la survie et l’arrivée en sécurité. La formulation conserve le sens concret de délivrance physique sans suggérer ici une affirmation sur le salut spirituel.
- source_word: ἐπὶ τὴν γῆν
  choice: à terre
  rationale: Dans ce contexte maritime, γῆ s’oppose à la mer. « À terre » est l’expression idiomatique française.
theological_decisions:
- issue: Portée possible de διασωθῆναι
  choice: parvinrent sains et saufs à terre
  alternative: furent sauvés jusqu’à terre / gagnèrent tous le rivage sans encombre
  rationale: Le contexte immédiat impose une délivrance physique lors du naufrage. La traduction évite de donner au verbe une portée sotériologique absente du passage, tout en conservant l’idée d’une arrivée en sécurité.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste concise; « les uns... les autres » restitue naturellement la structure grecque, et « sains et saufs » rend explicitement l’issue heureuse du naufrage.
