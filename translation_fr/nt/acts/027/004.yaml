  text: κἀκεῖθεν ἀναχθέντες ὑπεπλεύσαμεν τὴν Κύπρον διὰ τὸ τοὺς ἀνέμους εἶναι ἐναντίους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: fr
  text: Et de là, après avoir pris la mer, nous avons longé Chypre par le côté abrité[a], car les vents nous étaient contraires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous avons navigué sous le vent de Chypre ». Le verbe grec est un terme nautique qui désigne le fait de naviguer du côté d’une île protégé du vent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: De là
  rationale: Rend naturellement en français moderne la combinaison de καί et ἐκεῖθεν, tout en maintenant la continuité du récit.
- source_word: ἀναχθέντες
  choice: après avoir pris la mer
  rationale: Dans cet emploi nautique, ἀνάγω signifie partir en mer ou appareiller. Cette formulation exprime clairement l’antériorité du participe aoriste sans préciser indûment qu’une ancre a été levée.
- source_word: ὑπεπλεύσαμεν
  choice: nous avons longé … par le côté abrité
  rationale: Le verbe nautique ὑποπλέω désigne ici le fait de naviguer du côté d’une île protégé des vents. La formulation choisie est précise et plus immédiatement compréhensible que le terme maritime « sous le vent ».
- source_word: τὴν Κύπρον
  choice: Chypre
  rationale: Forme française usuelle du nom de l’île.
- source_word: διὰ τὸ … εἶναι
  choice: car
  rationale: διά suivi de l’infinitif substantivé exprime la cause. « Car » restitue sobrement le lien explicatif dans un récit soutenu mais naturel.
- source_word: τοὺς ἀνέμους
  choice: les vents
  rationale: Équivalent direct et idiomatique du pluriel grec.
- source_word: ἐναντίους
  choice: nous étaient contraires
  rationale: L’adjectif indique que les vents s’opposaient à leur progression. Le pronom « nous », implicite dans la situation, rend la phrase naturelle sans modifier le sens.
