  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: fr
  text: Le troisième jour, ils jetèrent eux-mêmes par-dessus bord l’équipement du navire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils jetèrent de leurs propres mains l’équipement du navire ».'
    reason: La variante rend plus littéralement αὐτόχειρες, qui met l’accent sur l’action accomplie de leurs propres mains.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: Le troisième jour
  rationale: Le datif avec l’ordinal exprime ici le moment. « Le troisième jour » est naturel en français et explicite le nom « jour » sous-entendu.
- source_word: αὐτόχειρες
  choice: eux-mêmes
  rationale: L’adjectif souligne que les personnes à bord accomplirent personnellement l’action. « Eux-mêmes » conserve cette insistance sans suggérer nécessairement une manière particulière de porter chaque objet.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: l’équipement du navire
  rationale: Dans ce contexte maritime, σκευή désigne l’ensemble du matériel ou de l’équipement appartenant au navire. Cette formulation est claire, actuelle et suffisamment large.
- source_word: ἔρριψαν
  choice: jetèrent ... par-dessus bord
  rationale: Le verbe signifie « jeter ». Le contexte d’un navire en pleine tempête permet de rendre explicitement la direction implicite par l’expression française idiomatique « par-dessus bord ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit biblique écrit. « Navire » maintient le cadre maritime, tandis que « équipement » évite un terme nautique trop technique.
