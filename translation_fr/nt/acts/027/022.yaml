source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: fr
  text: Et maintenant, je vous exhorte à prendre courage[a], car aucun de vous ne perdra la vie[b] ; seul le navire sera perdu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « être de bon courage » ou « garder courage ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il n’y aura aucune perte de vie parmi vous » ; ici, le mot grec désigne la vie physique, non spécifiquement l’âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: maintenant
  rationale: Expression temporelle idiomatique qui introduit l’exhortation présente de Paul.
- source_word: παραινῶ
  choice: je vous exhorte
  rationale: Rend la force de l’appel tout en conservant le sens de conseil pressant de παραινέω.
- source_word: εὐθυμεῖν
  choice: à garder courage
  rationale: Expression française naturelle dans cette situation de détresse, qui évoque le maintien du courage et des dispositions confiantes.
- source_word: ἀποβολὴ ψυχῆς
  choice: ne perdra la vie
  rationale: Dans ce contexte, ψυχή désigne la vie physique, et ἀποβολή sa perte ; la tournure verbale est naturelle en français.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: aucun de vous ne perdra
  rationale: Reproduit clairement la négation absolue et le groupe désigné par ἐξ ὑμῶν.
- source_word: πλὴν τοῦ πλοίου
  choice: seul le navire sera perdu
  rationale: 'La formulation explicite naturellement l’exception elliptique : aucune vie ne sera perdue, mais le navire, lui, le sera.'
theological_decisions:
- issue: Sens de ψυχή
  choice: vie
  alternative: âme
  rationale: Le contexte concerne la survie physique des personnes à bord ; « âme » introduirait ici une distinction anthropologique que le passage ne vise pas.
translation_notes:
  register: Français international moderne, digne et accessible. « Garder courage » convient au contexte de la tempête sans archaïsme. Le point-virgule met en relief le contraste entre la sauvegarde de toutes les vies et la perte du navire.
