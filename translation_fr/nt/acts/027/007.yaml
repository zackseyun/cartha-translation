  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: fr
  text: Pendant plusieurs jours, nous avons navigué lentement[a] et sommes arrivés avec difficulté à la hauteur de Cnide. Comme le vent ne nous permettait pas d’avancer, nous avons navigué à l’abri de la Crète[b], au large de Salmone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avancions lentement par mer ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « nous avons navigué sous la Crète », c’est-à-dire sous la protection de l’île, du côté abrité du vent.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: Pendant plusieurs jours
  rationale: L’expression indique une durée prolongée. Cette tournure est naturelle en français et rend le retard du voyage.
- source_word: βραδυπλοοῦντες
  choice: nous avons navigué lentement
  rationale: Le participe désigne une navigation lente; la formulation conserve l’image maritime sans la confondre avec la difficulté exprimée ensuite par μόλις.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: sommes arrivés avec difficulté à la hauteur de Cnide
  rationale: μόλις marque la difficulté, tandis que κατά situe le navire en face ou à la hauteur de Cnide dans ce contexte nautique.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: Comme le vent ne nous permettait pas d’avancer
  rationale: Le génitif absolu donne la raison du changement de route. « Avancer » exprime naturellement l’empêchement causé par le vent, sans préciser abusivement une destination.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: nous avons longé la Crète par le côté abrité
  rationale: Dans cet emploi nautique, ὑποπλέω décrit le fait de naviguer sous la protection d’une île, du côté à l’abri du vent.
- source_word: κατὰ Σαλμώνην
  choice: au large de Salmone
  rationale: κατά situe ici le trajet par rapport à un repère côtier; « au large de » convient au contexte nautique.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: Cnide / Crète / Salmone
  rationale: Ces formes suivent les conventions françaises usuelles pour les noms géographiques antiques.
