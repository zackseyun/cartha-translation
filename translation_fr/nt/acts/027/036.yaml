  text: εὔθυμοι δὲ γενόμενοι πάντες καὶ αὐτοὶ προσελάβοντο τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/036.yaml
  text: Then all of them became encouraged and also took food[a][b].
translation:
  language: fr
  text: Alors, tous reprirent courage[a] et prirent eux aussi[b] de la nourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devinrent de bonne humeur » ou « furent rassérénés ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « eux-mêmes aussi prirent de la nourriture » ; le grec souligne que les autres suivirent l’exemple de Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὔθυμοι
  choice: reprirent courage
  rationale: Dans ce contexte de péril en mer, l’adjectif décrit le passage à un meilleur état d’esprit. « Reprirent courage » exprime naturellement en français le regain de moral, sans la légèreté que pourrait suggérer « devinrent joyeux ».
- source_word: δὲ
  choice: Alors
  rationale: Ici, δέ fait progresser le récit plutôt qu’il ne marque une forte opposition. « Alors » relie naturellement la réaction de tous à l’exemple et aux paroles de Paul.
- source_word: γενόμενοι
  choice: reprirent
  rationale: Avec εὔθυμοι, le participe aoriste exprime l’entrée dans un état. Le verbe « reprirent » rend ce changement d’état de manière idiomatique.
- source_word: πάντες
  choice: tous
  rationale: Le mot désigne l’ensemble des personnes présentes à bord, sans exception.
- source_word: καὶ αὐτοὶ
  choice: eux aussi
  rationale: 'Cette formulation conserve la valeur additive et emphatique du grec : les autres suivent à leur tour l’exemple de Paul.'
- source_word: προσελάβοντο
  choice: prirent
  rationale: Avec τροφῆς, le verbe signifie prendre de la nourriture. « Prirent » préserve l’expression grecque tout en restant naturel en français.
- source_word: τροφῆς
  choice: de la nourriture
  rationale: Le nom désigne ici ce que les passagers prennent pour manger et reprendre des forces.
theological_decisions: []
