  variant: modern international French
source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: fr
  text: Mais ils tombèrent sur un endroit où deux étendues d’eau se rejoignaient[a] et y échouèrent le navire. La proue, s’étant fichée, resta immobile, tandis que la poupe se disloquait sous l’effet de la force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un endroit entre deux mers ». L’expression grecque est rare et peut désigner un chenal, un banc de sable ou un lieu où se rencontrent deux masses d’eau ou deux courants.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: ils tombèrent sur
  rationale: Le participe aoriste présente la rencontre soudaine et défavorable avec ce lieu. « Tombèrent sur » reste naturel en français et ne précise pas indûment la manœuvre nautique.
- source_word: τόπον διθάλασσον
  choice: un endroit où deux étendues d’eau se rejoignaient
  rationale: L’adjectif rare διθάλασσος évoque un lieu en rapport avec deux mers ou deux masses d’eau. Cette formulation conserve l’image et l’incertitude sans imposer l’interprétation plus précise d’un banc de sable ou d’un chenal.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: y échouèrent le navire
  rationale: ἐπικέλλω est un terme nautique désignant le fait de faire échouer un bateau. La formulation française est concise et idiomatique.
- source_word: πρῷρα
  choice: la proue
  rationale: Terme nautique français courant et précis pour l’avant du navire.
- source_word: ἐρείσασα
  choice: s’enfonça
  rationale: Dans ce contexte d’échouement, ἐρείδω indique que la proue s’est fichée ou fermement enfoncée dans le fond. « S’enfonça » exprime naturellement cette fixation sans surcharge technique.
- source_word: ἔμεινεν ἀσάλευτος
  choice: resta immobile
  rationale: Rend directement l’idée que la proue demeura fixée et ne pouvait plus bouger.
- source_word: πρύμνα
  choice: la poupe
  rationale: Terme nautique français standard désignant l’arrière du navire.
- source_word: ἐλύετο
  choice: se disloquait
  rationale: L’imparfait passif décrit une désagrégation progressive. « Se disloquait » restitue clairement ce processus continu.
- source_word: ὑπὸ τῆς βίας
  choice: sous la violence des flots
  rationale: βία désigne une force violente. Le contexte maritime permet d’expliciter en français que cette force est celle des flots, sans changer la scène décrite.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les termes nautiques « proue » et « poupe » sont précis tout en restant largement compréhensibles. La note conserve l’ambiguïté réelle de l’expression grecque rare.
