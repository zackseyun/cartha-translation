source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: fr
  text: Mais le centurion, qui voulait sauver Paul, les empêcha de mettre leur projet à exécution et ordonna à ceux qui savaient nager de se jeter les premiers à l’eau et de gagner la terre ferme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: centurion
  rationale: « Centurion » est le titre militaire romain consacré en français et convient au contexte narratif.
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: qui voulait sauver Paul
  rationale: Cette relative rend naturellement le participe de volonté et l’idée de préserver Paul vivant, sans renforcer indûment l’intention.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: les empêcha de mettre leur projet à exécution
  rationale: La tournure explicite l’idée d’empêcher l’accomplissement du dessein mentionné au verset précédent, tout en conservant le lien anaphorique de « leur projet ».
- source_word: ἐκέλευσέν τε
  choice: et ordonna
  rationale: Le verbe exprime un ordre donné par un officier; « ordonna » est direct, naturel et suffisamment ferme.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: ceux qui savaient nager
  rationale: En français courant, « savoir nager » exprime idiomatiquement la capacité pratique visée ici.
- source_word: ἀπορίψαντας πρώτους
  choice: de se jeter les premiers à l’eau
  rationale: La formulation restitue l’action de se lancer hors du navire et la priorité donnée aux nageurs; « à l’eau » explicite naturellement la situation maritime.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: de gagner la terre ferme
  rationale: « Gagner la terre ferme » conserve le mouvement vers la terre depuis la mer et sonne naturellement dans ce contexte.
