  text: Les soldats formèrent le projet de tuer les prisonniers, de peur que l’un d’eux ne s’échappe à la nage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: décidèrent
  rationale: La tournure grecque signifie littéralement qu’un projet ou dessein se forma parmi les soldats. « Décidèrent » exprime naturellement en français la résolution collective dans ce contexte.
- source_word: τοὺς δεσμώτας
  choice: les prisonniers
  rationale: « Prisonniers » rend clairement le substantif désignant des personnes détenues ou enchaînées.
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: ne s’échappe à la nage
  rationale: Le participe évoque le fait de partir en nageant et le verbe principal celui de réussir à s’enfuir. Cette formulation française concise conserve les deux idées sans redondance maladroite.
