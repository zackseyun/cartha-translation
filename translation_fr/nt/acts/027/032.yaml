  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: fr
  text: Alors les soldats coupèrent les cordages de la chaloupe et la laissèrent partir à la dérive.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la laissèrent tomber ». Dans ce contexte maritime, le verbe grec peut aussi évoquer une embarcation qui s’éloigne à la dérive.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession immédiate des actions dans le récit.
- source_word: ἀπέκοψαν
  choice: coupèrent
  rationale: Rend directement l’action de trancher ou sectionner; avec «les cordages», le détachement de la chaloupe est clair.
- source_word: οἱ στρατιῶται
  choice: les soldats
  rationale: Équivalent français courant et précis du sujet grec.
- source_word: τὰ σχοινία
  choice: les cordages
  rationale: Terme naturel dans un contexte maritime, plus précis ici que le terme général «cordes».
- source_word: τῆς σκάφης
  choice: de la chaloupe
  rationale: Désigne la petite embarcation liée au navire principal; «chaloupe» maintient cette distinction en français courant.
- source_word: εἴασαν αὐτὴν
  choice: la laissèrent
  rationale: Conserve la construction grecque exprimant qu’ils permirent à l’embarcation de s’éloigner après avoir coupé ses cordages.
- source_word: ἐκπεσεῖν
  choice: partir à la dérive
  rationale: Dans ce contexte nautique, le verbe évoque l’embarcation qui, détachée, s’éloigne; cette formulation est naturelle sans préciser une cause absente du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. «Cordages» et «chaloupe» donnent la précision maritime nécessaire sans technicité excessive; la note préserve l’ambiguïté de ἐκπεσεῖν.
