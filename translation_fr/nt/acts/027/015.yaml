  text: συναρπασθέντος δὲ τοῦ πλοίου καὶ μὴ δυναμένου ἀντοφθαλμεῖν τῷ ἀνέμῳ ἐπιδόντες ἐφερόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/015.yaml
  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: fr
  text: Le navire a été saisi et ne pouvait pas faire face au vent ; nous avons alors cédé et avons été entraînés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous avons cédé et avons été emportés ».'
    reason: Alternative lexicale pour ἐφερόμεθα ; « emportés » met davantage en avant la force du vent, tandis que « entraînés » conserve une formulation sobre et passive.
lexical_decisions:
- source_word: συναρπασθέντος
  choice: a été saisi
  rationale: Le participe aoriste passif décrit le navire brusquement soumis à une force extérieure. « A été saisi » conserve cette valeur passive sans anticiper la progression exprimée ensuite par ἐφερόμεθα.
- source_word: πλοίου
  choice: le navire
  rationale: « Navire » est un équivalent français naturel et digne dans ce récit de navigation maritime.
- source_word: μὴ δυναμένου
  choice: ne pouvait pas
  rationale: La tournure finie rend naturellement en français l’incapacité exprimée par le participe grec.
- source_word: ἀντοφθαλμεῖν
  choice: faire face
  rationale: Le verbe évoque littéralement l’action de regarder ou de se tenir en face de quelque chose et, ici, celle d’un navire tentant de faire face au vent. Cette formulation conserve l’image du grec sans la surinterpréter.
- source_word: τῷ ἀνέμῳ
  choice: au vent
  rationale: Ἄνεμος signifie simplement « vent » ; le contexte orageux ne justifie pas de renforcer ici le terme en « tempête » ou « bourrasque ».
- source_word: ἐπιδόντες
  choice: nous avons alors cessé de résister
  rationale: Dans ce contexte nautique, le participe indique que l’équipage renonce à lutter contre la force du vent. Cette formulation française explicite naturellement l’idée de céder sans employer un jargon maritime obscur.
- source_word: ἐφερόμεθα
  choice: nous nous sommes laissé emporter
  rationale: L’imparfait passif grec décrit un mouvement subi sous l’action d’une force extérieure. « Se laisser emporter » exprime à la fois la continuité du mouvement et l’abandon de toute résistance.
- source_word: δέ
  choice: alors
  rationale: La particule assure ici la progression du récit. « Alors » relie naturellement la situation du navire à la réaction de ceux qui se trouvent à bord.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et accessible. La phrase garde la passivité du navire et des voyageurs face au vent, tout en évitant un vocabulaire nautique technique ou vieilli.
