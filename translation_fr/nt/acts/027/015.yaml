    text: 'Ou : « nous avons cédé et avons été emportés ».'
    reason: Alternative lexicale pour ἐφερόμεθα ; « emportés » met davantage en avant la force du vent, tandis que « entraînés » conserve une formulation sobre et passive.
  revision_rationale: La révision conserve la structure et le sens du grec tout en remplaçant une tournure réflexive potentiellement volontaire par un passif français explicite. La note est resserrée pour ne pas attribuer au grec un sujet plus large que celui qu’il exprime.
