  text: μόλις τε παραλεγόμενοι αὐτὴν ἤλθομεν εἰς τόπον τινὰ καλούμενον Καλοὺς Λιμένας ᾧ ἐγγὺς ⸂ἦν πόλις⸃ ⸀Λασαία.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: fr
  text: C’est avec difficulté que nous avons longé sa côte[a] et sommes arrivés à un endroit appelé Beaux-Ports, près duquel se trouvait une ville nommée Lasée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que nous avons tant bien que mal navigué le long de l’île ». Le participe grec est un terme nautique qui désigne le fait de naviguer le long du littoral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: avec difficulté
  rationale: Exprime que la progression ne s’est accomplie qu’au prix de grands efforts, dans le contexte d’une navigation contrariée.
- source_word: τε
  choice: C’est… que… et
  rationale: Le lien narratif est rendu naturellement par la coordination française, sans donner au faible connecteur grec une valeur excessive.
- source_word: παραλεγόμενοι αὐτήν
  choice: avons longé sa côte
  rationale: Le participe est un terme nautique désignant le déplacement le long d’un littoral. Le possessif renvoie naturellement à la Crète mentionnée dans le contexte, tout en évitant l’ambiguïté peu idiomatique de « la longer ».
- source_word: ἤλθομεν
  choice: sommes arrivés
  rationale: Dans une proposition indiquant une destination, « sommes arrivés » rend naturellement le mouvement accompli.
- source_word: εἰς τόπον τινὰ
  choice: à un endroit
  rationale: L’article indéfini conserve l’indétermination de τινά; « un certain endroit » serait plus lourd et pourrait suggérer une emphase absente du grec.
- source_word: καλούμενον
  choice: appelé
  rationale: Formulation française courante pour introduire un nom de lieu.
- source_word: Καλοὺς Λιμένας
  choice: Beaux-Ports
  rationale: Le toponyme grec signifie littéralement « Beaux Ports ». La forme française traditionnelle et transparente « Beaux-Ports » fonctionne comme un nom propre.
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: près duquel se trouvait une ville nommée Lasée
  rationale: Conserve la relation spatiale du relatif ᾧ et l’indétermination du nom πόλις sans article; « nommée » introduit clairement le toponyme Lasée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde l’accent initial sur la difficulté de la navigation. « Sa côte » explicite sobrement le sens nautique et le référent contextuel, la Crète; la note préserve une formulation plus proche de la structure grecque.
