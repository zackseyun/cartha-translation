lexical_decisions:
- source_word: σφοδρῶς
  choice: avec violence
  rationale: L’adverbe intensifie les effets de la tempête et se rend naturellement en français par cette locution.
- source_word: χειμαζομένων
  choice: la tempête nous secouait
  rationale: Le participe passif décrit des personnes rudement malmenées par une tempête. La formulation française reste naturelle tout en conservant l’image du navire et de ses occupants secoués.
- source_word: ἡμῶν
  choice: nous
  rationale: Dans la construction au génitif absolu, le pronom devient naturellement le complément de la proposition circonstancielle française.
- source_word: τῇ ἑξῆς
  choice: le lendemain
  rationale: Expression temporelle française courante correspondant au jour suivant.
- source_word: ἐκβολὴν
  choice: jeter la cargaison par-dessus bord
  rationale: Le nom désigne ici une opération de délestage maritime. Le texte grec ne nomme pas explicitement la cargaison, mais celle-ci est normalement sous-entendue dans ce contexte.
- source_word: ἐποιοῦντο
  choice: ils se mirent à jeter
  rationale: Cette tournure idiomatique exprime le début de l’action narrative et convient à l’imparfait grec associé au nom d’action.
