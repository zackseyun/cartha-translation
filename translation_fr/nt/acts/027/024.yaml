id: ACT.27.24
reference: Acts 27:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: fr
  text: 'en disant : « N’aie pas peur, Paul. Il faut que tu comparaisses devant César. Et voici, Dieu t’a accordé la vie de tous ceux qui naviguent avec toi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Dieu t’a accordé tous ceux qui naviguent avec toi »; dans ce contexte, cela signifie qu’il leur laissera la vie sauve.'
    reason: La construction grecque est concise et peut sembler suggérer en français que les personnes sont données à Paul; la note préserve sa forme tout en explicitant son sens contextuel.
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Rend directement l’impératif présent négatif dans un français naturel et actuel.
- source_word: Καίσαρί σε δεῖ παραστῆναι
  choice: Il faut que tu comparaisses devant César
  rationale: « Comparaître » exprime le fait de se présenter devant l’autorité impériale, avec la nuance judiciaire appropriée au contexte; « il faut » conserve la nécessité exprimée par δεῖ.
- source_word: ἰδοὺ
  choice: Et voici
  rationale: Conserve l’appel à l’attention du texte grec dans un registre français digne, sans le réduire à une simple conjonction.
- source_word: κεχάρισταί σοι
  choice: Dieu t’a accordé
  rationale: Le parfait grec présente comme acquise la faveur accordée par Dieu; le passé composé convient naturellement en français.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: la vie de tous ceux qui naviguent avec toi
  rationale: Dans le contexte du naufrage imminent, les personnes sont accordées à Paul en ce sens que leur vie sera épargnée. La note conserve la formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: Portée de la faveur accordée à Paul
  choice: Dieu lui accorde la vie de tous ses compagnons de navigation
  alternative: Dieu lui a accordé tous ceux qui naviguent avec lui
  rationale: Le contexte immédiat concerne leur survie physique, non leur appartenance à Paul ni nécessairement leur salut spirituel. La traduction explicite ce référent contextuel tout en signalant la forme littérale en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse personnelle au singulier. « César » désigne ici l’empereur romain.
