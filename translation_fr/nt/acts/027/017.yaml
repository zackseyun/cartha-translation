base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: fr
  text: Après l’avoir hissée, ils firent passer des câbles de renfort autour de la coque du navire. Puis, craignant d’aller s’échouer sur la Syrte[a], ils abaissèrent l’équipement[b] et étaient ainsi emportés à la dérive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La Syrte était une zone redoutée de hauts-fonds et de bancs de sable au large de la côte nord-africaine.
    reason: cultural_note
  - marker: b
    text: Ou « le gréement » ou « l’ancre flottante ». Le grec dit littéralement « l’équipement » ; l’objet nautique précis est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: Après l’avoir hissée
  rationale: Le pronom féminin reprend l’embarcation du verset précédent. Le participe aoriste marque une action antérieure; « hissée » convient au contexte maritime sans répéter inutilement le nom.
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: ils passèrent des câbles de renfort sous la coque du navire
  rationale: La formulation explicite naturellement l’opération nautique consistant à renforcer la coque en la ceinturant au moyen de câbles, tout en conservant l’image de ὑποζωννύντες.
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: d’aller s’échouer sur la Syrte
  rationale: ἐκπίπτω désigne ici le risque d’être poussé hors de sa route et de s’échouer dans cette zone dangereuse. Le nom géographique est conservé et expliqué en note.
- source_word: χαλάσαντες τὸ σκεῦος
  choice: ils abaissèrent l’équipement
  rationale: σκεῦος est un terme général désignant un objet, du matériel ou un équipement. Le référent nautique exact reste incertain; cette traduction préserve cette indétermination plutôt que d’imposer « ancre flottante » ou « gréement ».
- source_word: οὕτως ἐφέροντο
  choice: furent ainsi emportés à la dérive
  rationale: L’imparfait passif présente un mouvement continu subi sous l’effet des éléments. « À la dérive » rend clairement la situation maritime.
