  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: fr
  text: Quand vint la quatorzième nuit, tandis que nous étions emportés à la dérive dans l’Adriatique[a], vers le milieu de la nuit, les marins commencèrent à pressentir qu’une terre se rapprochait d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom antique « Adria » pouvait désigner une zone maritime plus vaste du centre de la Méditerranée, et non seulement l’actuelle mer Adriatique.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « les marins soupçonnaient qu’une terre s’approchait d’eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: Quand arriva la quatorzième nuit
  rationale: Cette tournure française naturelle conserve l’expression temporelle grecque et l’idée que la quatorzième nuit était arrivée.
- source_word: διαφερομένων ἡμῶν
  choice: tandis que nous étions ballottés
  rationale: Le participe présent passif décrit un déplacement continu et subi; « ballottés » convient au contexte de la tempête sans suggérer une navigation maîtrisée.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: sur l’Adria
  rationale: Le nom ancien est conservé afin d’éviter l’identification trop étroite avec la seule mer Adriatique moderne; la préposition « sur » est idiomatique pour un déplacement maritime.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: vers le milieu de la nuit
  rationale: La traduction garde à la fois le repère central de la nuit et la valeur approximative de κατά, sans imposer l’heure exacte de minuit.
- source_word: ὑπενόουν
  choice: commencèrent à pressentir
  rationale: « Pressentir » exprime une perception encore incertaine, tandis que « commencèrent » rend naturellement la nuance inchoative possible de l’imparfait.
- source_word: οἱ ναῦται
  choice: les marins
  rationale: Équivalent français moderne et courant pour les membres d’équipage chargés de la navigation.
- source_word: προσάγειν τινὰ αὐτοῖς χώραν
  choice: qu’une terre se rapprochait d’eux
  rationale: La formulation préserve la construction grecque où « une terre » est perçue comme s’approchant d’eux, ainsi que l’indétermination de τινά.
