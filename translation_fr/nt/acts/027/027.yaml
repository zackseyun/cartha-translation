translation_notes:
  register: Français international moderne, narratif et digne. Le terme géographique ancien « Adria » maintient la portée historique sans créer une fausse précision moderne; la note l’explique. La syntaxe conserve délibérément l’image grecque de la terre qui se rapproche.
