source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: fr
  text: Comme ni le soleil ni les étoiles ne se montraient depuis bien des jours et qu’une violente tempête continuait à peser sur nous, tout espoir que nous soyons sauvés[a] nous était désormais peu à peu enlevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de réchapper ». Le verbe grec peut signifier « sauver » ou « secourir » ; employé ici au passif, il désigne le fait d’être délivrés physiquement de la mort dans la tempête.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: se montraient
  rationale: Le participe évoque les astres qui deviennent visibles ou donnent leur lumière. « Se montraient » est naturel en français et convient au contexte de navigation sans limiter le sens à la seule luminosité.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: depuis bien des jours
  rationale: L’expression marque une durée prolongée. Avec l’imparfait, « depuis bien des jours » rend naturellement la situation qui se poursuivait.
- source_word: χειμῶνός
  choice: tempête
  rationale: Dans ce contexte maritime, le mot désigne le mauvais temps violent plutôt que la saison hivernale.
- source_word: οὐκ ὀλίγου
  choice: violente
  rationale: Le grec emploie une litote, littéralement « non petite ». En français moderne, « violente » en transmet clairement l’intensité sans tournure artificielle.
- source_word: ἐπικειμένου
  choice: continuait à peser sur nous
  rationale: Le participe exprime une force qui s’abat sur les voyageurs et persiste. Cette formulation conserve l’image de l’oppression ainsi que l’aspect duratif.
- source_word: λοιπὸν
  choice: désormais
  rationale: 'L’adverbe indique le nouvel état résultant de la situation : à partir de ce moment-là, l’espoir disparaissait.'
- source_word: περιῃρεῖτο
  choice: nous était peu à peu enlevé
  rationale: L’imparfait passif présente une perte en cours. « Peu à peu » rend cette progression, tandis que « enlevé » conserve le sens passif du verbe.
- source_word: ἐλπὶς πᾶσα
  choice: tout espoir
  rationale: « Tout espoir » est l’équivalent idiomatique français qui exprime la totalité du désespoir.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: d’être sauvés
  rationale: L’infinitif substantivé précise le contenu de l’espoir. « D’être sauvés » garde l’étendue lexicale de σῴζω, tandis que le contexte indique un sauvetage physique.
theological_decisions:
- issue: Sens de σῴζεσθαι dans le récit maritime
  choice: délivrance physique de la mort en mer, exprimée par « être sauvés »
  alternative: être secourus / réchapper
  rationale: Le contexte d’Actes 27 concerne la tempête, le naufrage et la survie, non le salut spirituel. « Être sauvés » préserve néanmoins la continuité lexicale du verbe grec et laisse le contexte déterminer son sens.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la longue structure circonstancielle du grec tout en restant lisible. « Violente » traduit idiomatiquement la litote grecque, et « peu à peu » explicite la valeur progressive de l’imparfait passif.
