id: ACT.27.35
reference: Acts 27:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: fr
  text: Après avoir dit cela, il prit du pain, rendit grâce à Dieu en présence de tous[a], puis le rompit et se mit à manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant tout le monde ».'
    reason: Alternative lexicale pour ἐνώπιον πάντων, qui peut se rendre soit par « en présence de tous », soit plus directement par « devant tout le monde ».
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime ici une action antérieure; cette formulation française restitue naturellement la succession des actions. δέ sert de liaison narrative légère et n’exige pas un connecteur distinct en français.
- source_word: λαβὼν ἄρτον
  choice: il prit du pain
  rationale: ἄρτον, sans article, ne précise ni un pain entier ni une portion déterminée. «Du pain» reste naturel et évite de surinterpréter.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: rendit grâce à Dieu
  rationale: Formulation française courante et digne qui rend explicitement εὐχαριστέω avec son complément au datif.
- source_word: ἐνώπιον πάντων
  choice: en présence de tous
  rationale: Cette expression conserve le caractère public de l’action sans adopter le tour plus familier «devant tout le monde».
- source_word: κλάσας
  choice: puis le rompit
  rationale: Le participe aoriste marque une action antérieure à celle de manger. Le pronom «le» reprend clairement le pain, et «rompit» convient idiomatiquement au partage du pain.
- source_word: ἤρξατο ἐσθίειν
  choice: se mit à manger
  rationale: Tour français naturel qui préserve la valeur inchoative de ἄρχομαι suivi de l’infinitif.
theological_decisions:
- issue: Possible résonance eucharistique de la suite «prit du pain… rendit grâce… le rompit… se mit à manger»
  choice: Conserver une narration simple des gestes du repas, sans les qualifier de rite sacramentel.
  alternative: Employer une formulation liturgique traditionnelle qui accentuerait l’écho de la Cène.
  rationale: La formulation peut rappeler des récits eucharistiques, mais le verset décrit explicitement le repas public de Paul à bord du navire sans identifier l’acte à la Cène. La traduction maintient cet écho possible sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe allège l’enchaînement des participes grecs tout en conservant l’ordre précis des actions. Le marqueur de note est placé après « en présence de tous », expression à laquelle l’alternative se rapporte.
