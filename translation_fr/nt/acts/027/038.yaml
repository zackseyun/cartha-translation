source:
  edition: SBLGNT
  text: κορεσθέντες ⸀δὲ τροφῆς ἐκούφιζον τὸ πλοῖον ἐκβαλλόμενοι τὸν σῖτον εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: fr
  text: Après avoir mangé à leur faim[a], ils se mirent à alléger le navire[b] en jetant le blé[c] à la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après s’être rassasiés de nourriture » ou « une fois rassasiés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils allégeaient le navire » ou simplement « ils allégèrent le navire »; l’imparfait grec peut souligner le déroulement ou le commencement de l’action.
    reason: lexical_alternative
  - marker: c
    text: Ou « les céréales ». Le mot grec peut avoir un sens plus large, mais il désigne probablement ici le blé.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: Après avoir mangé à leur faim
  rationale: Le participe aoriste passif exprime le fait d’avoir été rassasiés de nourriture. Cette formulation française naturelle en conserve à la fois le sens et la valeur temporelle dans le récit.
- source_word: δὲ
  choice: Après avoir… ils
  rationale: La particule est un lien narratif léger. En français, l’enchaînement temporel suffit ici à rendre naturellement sa fonction sans ajouter un « mais » injustifié.
- source_word: ἐκούφιζον
  choice: ils se mirent à alléger
  rationale: L’imparfait grec peut présenter l’action dans son déroulement ou à son commencement. « Se mirent à » retient ici la nuance inchoative, naturelle dans la progression du récit.
- source_word: τὸ πλοῖον
  choice: le navire
  rationale: Dans ce contexte de traversée maritime et de cargaison, « navire » est précis, courant et plus approprié que « barque ».
- source_word: ἐκβαλλόμενοι
  choice: en jetant
  rationale: Le participe présent indique le moyen par lequel ils allégeaient le navire; la tournure « en jetant » le rend directement.
- source_word: τὸν σῖτον
  choice: le blé
  rationale: σῖτος peut désigner les céréales ou, plus précisément, le blé. Dans le contexte de la cargaison du navire alexandrin, « blé » est vraisemblable tout en signalant l’alternative en note.
- source_word: εἰς τὴν θάλασσαν
  choice: à la mer
  rationale: « Jeter à la mer » est l’expression française idiomatique correspondant exactement au mouvement vers la mer.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, évite le calque « remplis de nourriture » et conserve par des notes les ambiguïtés réelles de l’imparfait grec et de σῖτος.
