  source_fidelity: La traduction rend correctement le vent du sud léger, l'appréciation subjective des marins, l'obtention supposée de leur projet et le sens nautique de ἄραντες. Toutefois, « au plus près » transforme le comparatif ἆσσον (« plus près ») en superlatif et doit être corrigé.
  naturalness: Le français est globalement clair et narratif. « Quand » est plus nettement temporel que « Comme », qui peut suggérer une causalité absente du génitif absolu grec. « Se mirent à longer » rend naturellement la suite narrative.
