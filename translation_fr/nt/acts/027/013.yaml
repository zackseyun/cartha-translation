  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: fr
  text: Quand un léger vent du sud se mit à souffler, ils pensèrent avoir atteint leur but. Ils levèrent l’ancre et se mirent à longer la Crète de plus près.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: s’était mis à souffler légèrement
  rationale: Le verbe ὑποπνέω décrit un souffle faible ou doux; la tournure française rend à la fois le début du vent et sa légèreté.
- source_word: νότου
  choice: un vent du sud
  rationale: νότος désigne ici un vent venant du sud; l’article indéfini convient naturellement au récit français.
- source_word: δόξαντες
  choice: ils pensèrent
  rationale: Le participe exprime leur appréciation subjective de la situation, sans garantir que leur conclusion était juste.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: avoir atteint leur objectif
  rationale: L’expression signifie qu’ils estimaient avoir obtenu ou assuré ce qu’ils projetaient, c’est-à-dire la possibilité de poursuivre leur trajet.
- source_word: ἄραντες
  choice: ils levèrent l’ancre
  rationale: Le complément « l’ancre » est sous-entendu dans cet emploi nautique de αἴρω; cette formulation est claire et usuelle en français.
- source_word: ἆσσον
  choice: au plus près de la côte
  rationale: L’adverbe comparatif signifie « plus près »; dans ce contexte nautique, il indique que le navire suivait la côte de très près.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: longèrent la Crète
  rationale: παραλέγομαι désigne la navigation le long d’une côte; « longer la Crète » rend naturellement le mouvement sans ajouter un détail absent.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation emploie un vocabulaire nautique courant et évite l’expression plus technique « appareiller ». Aucun marqueur de note n’est nécessaire, car les nuances pertinentes peuvent être rendues directement dans le texte.
