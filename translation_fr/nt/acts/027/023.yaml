id: ACT.27.23
reference: Acts 27:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: fr
  text: En effet, cette nuit même, un ange du Dieu auquel j’appartiens[a] et à qui je rends aussi un culte[b] s’est tenu près de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dont je suis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que je sers aussi » ; le verbe grec peut désigner le service sacré ou le culte rendu à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: s’est tenu près de moi
  rationale: L’aoriste de παρίστημι exprime ici la présence de l’ange aux côtés de Paul. Cette formulation conserve le sens spatial sans ajouter l’idée plus interprétative d’une apparition.
- source_word: γάρ
  choice: En effet
  rationale: γάρ introduit l’explication de l’assurance exprimée par Paul dans le contexte. « En effet » rend naturellement cette valeur explicative en français.
- source_word: ταύτῃ τῇ νυκτί
  choice: cette nuit même
  rationale: Le démonstratif donne du relief à l’indication temporelle et souligne son immédiateté.
- source_word: τοῦ θεοῦ
  choice: du Dieu
  rationale: Le génitif dépend de ἄγγελος et identifie le Dieu dont vient l’ange, tout en introduisant les deux propositions relatives qui suivent.
- source_word: οὗ εἰμι
  choice: auquel j’appartiens
  rationale: Littéralement, « dont je suis ». La formulation retenue exprime clairement en français moderne l’appartenance de Paul à Dieu sans préciser davantage la nature de cette relation.
- source_word: ᾧ καὶ λατρεύω
  choice: et à qui je rends aussi un culte
  rationale: λατρεύω désigne ici le service religieux rendu à Dieu. « Rendre un culte » préserve cette dimension cultuelle, tandis que « aussi » représente καί.
- source_word: ἄγγελος
  choice: un ange
  rationale: Dans ce récit de réconfort divin, il s’agit clairement d’un messager céleste plutôt que d’un messager humain.
theological_decisions:
- issue: Traduction de οὗ εἰμι
  choice: auquel j’appartiens
  alternative: dont je suis
  rationale: Le grec affirme l’appartenance de Paul à Dieu. La traduction choisie communique cette relation en français courant sans développer une doctrine particulière de l’appartenance.
- issue: Traduction de λατρεύω
  choice: à qui je rends aussi un culte
  alternative: que je sers aussi
  rationale: Le verbe peut désigner le service, mais, lorsqu’il a Dieu pour objet, il comporte généralement une dimension religieuse ou cultuelle. Le choix principal garde cette portée, tandis que la note préserve l’autre traduction possible.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase suit l’enchaînement logique du grec tout en plaçant les compléments de manière idiomatique. « Rendre un culte » conserve la portée religieuse de λατρεύω sans vocabulaire confessionnel particulier.
