    issue: « désormais » pour ἤδη
    rationale: ἤδη marque ici l’antériorité ou l’état déjà atteint. « Déjà » le reproduit directement ; « désormais » peut suggérer une transition temporelle plus forte.
  - severity: low
    issue: « Paul leur donnait ce conseil » pour παρῄνει
    rationale: Le singulier démonstratif anticipe le contenu précis du conseil qui suit. Le grec dit plus simplement que Paul les conseillait/exhortait, à l’imparfait.
  revised_text: 'Comme beaucoup de temps s’était écoulé et que la navigation était déjà dangereuse, puisque même le Jeûne[a] était déjà passé, Paul les conseillait :'
  revised_footnotes:
