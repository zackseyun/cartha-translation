  rationale: La révision remplace « désormais » par « déjà » afin de rendre directement ἤδη, et elle remplace « leur donnait ce conseil » par « les conseillait » afin de refléter plus sobrement παρῄνει et son aspect imperfectif. La note et son ancrage sont conservés, car ils respectent l’implicitation du grec tout en fournissant le contexte culturel nécessaire.
