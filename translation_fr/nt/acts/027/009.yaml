  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: fr
  text: 'Comme beaucoup de temps s’était écoulé et que la navigation était déjà dangereuse, puisque même le Jeûne[a] était déjà passé, Paul les conseillait :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement du jeûne annuel du jour des Expiations, qui avait lieu à une période de l’année où la navigation en Méditerranée devenait dangereuse.
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: Comme beaucoup de temps s’était écoulé
  rationale: La proposition au génitif absolu indique qu’une période importante avait passé. Cette formulation rend naturellement en français la valeur temporelle et circonstancielle de la construction.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: la navigation était désormais dangereuse
  rationale: πλοῦς désigne ici l’action ou l’entreprise de naviguer, et ἐπισφαλής son caractère périlleux à ce stade de la saison. « Désormais » rend la progression temporelle exprimée par ἤδη sans ajouter explicitement l’idée de devenir.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: puisque même le Jeûne était déjà passé
  rationale: La construction avec διά et l’infinitif articulé donne la raison du danger. La majuscule à « Jeûne » signale une observance connue, tandis que la note en précise la référence probable sans l’imposer au texte principal.
- source_word: παρῄνει
  choice: leur donnait ce conseil
  rationale: L’imparfait rend l’imperfectif du verbe, et cette tournure introduit naturellement les paroles de Paul au verset suivant sans renforcer indûment le sens en « avertissait » ou « mettait en garde ».
theological_decisions:
- issue: Identification de « la νηστεία »
  choice: Conserver « le Jeûne » dans le texte et donner l’identification probable en note
  alternative: Traduire directement « le jeûne du jour des Expiations »
  rationale: Le grec nomme simplement « le Jeûne ». L’identification avec le jeûne annuel du jour des Expiations est très probable dans ce contexte juif et saisonnier, mais la laisser en note préserve la forme et la légère implicitation du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure circonstancielle du grec tout en préparant naturellement le discours direct du verset suivant.
