id: ACT.27.31
reference: Acts 27:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: fr
  text: 'Paul dit au centurion et aux soldats : « Si ces hommes ne restent pas à bord du navire, vous ne pouvez pas être sauvés[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avoir la vie sauve ». Le grec dit « être sauvés »; il s’agit ici de survivre au danger.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: centurion
  rationale: Terme français courant et précis pour ce grade de l’armée romaine.
- source_word: οὗτοι
  choice: ces hommes
  rationale: Le démonstratif désigne les marins qui tentaient de quitter le navire; « hommes » explicite naturellement le référent sans modifier le sens.
- source_word: μείνωσιν
  choice: restent
  rationale: Rend directement μένω dans cette condition et convient au français moderne.
- source_word: ἐν τῷ πλοίῳ
  choice: à bord du navire
  rationale: Formulation française naturelle pour le fait de demeurer dans un grand bâtiment de mer.
- source_word: σωθῆναι
  choice: être sauvés
  rationale: Préserve le verbe grec usuel « sauver », tandis que le contexte et la note indiquent qu’il s’agit ici de survivre au danger physique.
- source_word: οὐ δύνασθε
  choice: vous ne pouvez pas
  rationale: Équivalent direct, clair et idiomatique de la négation du verbe de capacité.
theological_decisions:
- issue: Faut-il rendre σωθῆναι par un terme explicitement physique ou conserver le verbe plus large « sauver »?
  choice: être sauvés
  alternative: avoir la vie sauve; être secourus
  rationale: Le contexte concerne manifestement la survie au naufrage, mais « être sauvés » conserve l’étendue lexicale du grec sans introduire ici une interprétation de salut éternel. La note précise le sens contextuel.
translation_notes:
  register: Français international moderne, clair et digne. « À bord du navire » est plus idiomatique que « dans le navire », et « centurion » conserve le titre historique connu.
