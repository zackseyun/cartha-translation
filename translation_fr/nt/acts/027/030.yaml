id: ACT.27.30
reference: Acts 27:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: fr
  text: Mais les marins cherchaient à s’enfuir du navire et avaient descendu la barque à la mer, sous prétexte d’aller jeter des ancres depuis la proue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’avant du navire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ ναυτῶν
  choice: Mais les marins
  rationale: « Marins » est le terme courant et naturel pour les membres de l’équipage; δέ marque ici une transition contrastive bien rendue par « mais ».
- source_word: ζητούντων φυγεῖν
  choice: cherchaient à s’enfuir
  rationale: La construction avec l’infinitif exprime une tentative ou une intention; « cherchaient à s’enfuir » conserve cet aspect sans affirmer qu’ils ont réussi.
- source_word: ἐκ τοῦ πλοίου
  choice: du navire
  rationale: Formulation française naturelle indiquant qu’ils voulaient quitter le navire.
- source_word: χαλασάντων τὴν σκάφην
  choice: avaient descendu la barque
  rationale: σκάφη désigne la petite embarcation du navire; « barque » est clair en français courant, tandis que « avaient descendu » rend l’action antérieure du participe aoriste.
- source_word: εἰς τὴν θάλασσαν
  choice: à la mer
  rationale: Expression maritime française idiomatique pour la mise à l’eau de l’embarcation.
- source_word: προφάσει
  choice: sous prétexte
  rationale: Le terme indique un motif affiché qui dissimule leur véritable intention.
- source_word: ὡς ... μελλόντων
  choice: d’aller
  rationale: Cette tournure exprime naturellement en français l’intention prétendue introduite par ὡς et μέλλω.
- source_word: ἐκ πρῴρης
  choice: depuis la proue
  rationale: « Proue » est le terme nautique français précis pour l’avant du navire.
- source_word: ἀγκύρας ... ἐκτείνειν
  choice: jeter des ancres
  rationale: Dans ce contexte nautique, ἐκτείνω signifie déployer ou mouiller les ancres; « jeter des ancres » est compréhensible et conserve le pluriel grec.
theological_decisions: []
