  text: νησίον δέ τι ὑποδραμόντες καλούμενον ⸀Καῦδα ⸂ἰσχύσαμεν μόλις⸃ περικρατεῖς γενέσθαι τῆς σκάφης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/016.yaml
  text: But after running under the shelter of a small island called Cauda[a], we were barely able to secure the ship’s boat.
translation:
  language: fr
  text: Mais, après être passés sous la protection d’une petite île appelée Cauda[a], nous avons eu beaucoup de mal à nous rendre maîtres de la chaloupe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après être passés sous le vent d’une petite île appelée Cauda ». Le grec emploie un terme nautique décrivant le passage dans la zone abritée du vent par l’île.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: une petite île
  rationale: Le diminutif νησίον désigne naturellement une petite île; cette formulation est plus courante en français moderne que « un îlot » tout en préservant la nuance.
- source_word: δέ
  choice: Mais
  rationale: 'δέ marque ici une légère transition contrastive: après avoir été emportés par la tempête, les marins trouvent un abri relatif.'
- source_word: ὑποδραμόντες
  choice: après être passés sous la protection de
  rationale: Dans ce contexte nautique, le verbe évoque le passage sous le vent d’une île, donc dans la zone qu’elle protège du vent. La formulation rend ce sens clairement sans imposer un vocabulaire trop technique.
- source_word: καλούμενον Καῦδα
  choice: appelée Cauda
  rationale: Rendu direct du participe qui donne le nom de l’île; « Cauda » suit la forme du texte grec fourni.
- source_word: ἰσχύσαμεν μόλις
  choice: nous avons eu beaucoup de mal à
  rationale: L’expression indique que l’action n’a pu être accomplie qu’avec grande difficulté; ce tour est naturel en français et conserve cette idée.
- source_word: περικρατεῖς γενέσθαι
  choice: nous rendre maîtres de
  rationale: La tournure grecque signifie parvenir à maîtriser ou à prendre le contrôle de quelque chose. Cette traduction conserve l’idée de prise en main sans préciser au-delà du texte les opérations effectuées.
- source_word: τῆς σκάφης
  choice: la chaloupe
  rationale: σκάφη désigne ici la petite embarcation associée au navire, vraisemblablement remorquée. « Chaloupe » est un terme français clair et adapté au contexte maritime.
