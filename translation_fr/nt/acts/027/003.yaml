id: ACT.27.3
reference: Acts 27:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ τε ἑτέρᾳ κατήχθημεν εἰς Σιδῶνα, φιλανθρώπως τε ὁ Ἰούλιος τῷ Παύλῳ χρησάμενος ἐπέτρεψεν πρὸς τοὺς φίλους ⸀πορευθέντι ἐπιμελείας τυχεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: fr
  text: Le lendemain, nous avons fait escale à Sidon. Julius traita Paul avec bienveillance[a] et lui permit d’aller voir ses amis pour recevoir leurs soins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avec humanité » : le terme souligne la conduite bienveillante de Julius envers un prisonnier.'
    reason: lexical_alternative
  - marker: b
    text: Ou « pour recevoir leur aide » ou « pour qu’ils prennent soin de lui » ; l’expression grecque peut désigner largement l’attention et l’assistance dont Paul avait besoin.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἑτέρᾳ
  choice: Le lendemain
  rationale: Dans ce récit suivi, le datif temporel désigne naturellement le jour suivant. Cette formulation est claire et idiomatique en français moderne.
- source_word: κατήχθημεν εἰς Σιδῶνα
  choice: nous avons fait escale à Sidon
  rationale: Dans un contexte maritime, κατάγω évoque l’arrivée d’un navire dans un port. « Faire escale à » rend précisément et naturellement cette nuance.
- source_word: φιλανθρώπως ... χρησάμενος
  choice: traita Paul avec bienveillance
  rationale: L’expression décrit la conduite bienveillante et humaine de Julius envers Paul. « Avec bienveillance » conserve cette idée dans un registre digne et courant.
- source_word: ἐπέτρεψεν
  choice: permit
  rationale: Le verbe exprime l’octroi d’une permission par l’officier responsable de Paul.
- source_word: πρὸς τοὺς φίλους πορευθέντι
  choice: d’aller voir ses amis
  rationale: Le participe dépend de l’idée de permission. « Aller voir ses amis » est naturel en français et exprime le déplacement vers eux sans alourdir la phrase.
- source_word: ἐπιμελείας τυχεῖν
  choice: pour recevoir leurs soins
  rationale: La construction signifie obtenir ou recevoir de l’attention, des soins ou une aide nécessaire. Le possessif « leurs » explicite naturellement que cette assistance vient des amis mentionnés, sans en préciser indûment la nature.
