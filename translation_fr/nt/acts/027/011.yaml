id: ACT.27.11
reference: Acts 27:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: fr
  text: Mais le centurion se laissait davantage convaincre par le pilote et l’armateur que par les paroles de Paul[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que par ce que Paul disait ».'
    reason: La construction grecque peut être rendue soit par le nom « les paroles », soit plus explicitement par la proposition « ce que Paul disait ».
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: centurion
  rationale: Terme historique précis et courant en français pour cet officier romain.
- source_word: κυβερνήτῃ
  choice: pilote
  rationale: Dans ce contexte maritime, désigne celui qui dirige la navigation; ce choix distingue sa fonction de celle du ναύκληρος.
- source_word: ναυκλήρῳ
  choice: armateur
  rationale: Désigne naturellement en français le propriétaire ou principal exploitant du navire, tout en maintenant la distinction avec le pilote.
- source_word: μᾶλλον ἐπείθετο
  choice: se laissait davantage convaincre par
  rationale: Rend la valeur imperfective et médio-passive de ἐπείθετο ainsi que la comparaison exprimée par μᾶλλον, sans réduire le sens à une simple écoute.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: les paroles de Paul
  rationale: Formulation française naturelle qui désigne ce que Paul disait; la note signale une traduction plus explicitement verbale de la construction participiale passive.
- source_word: δὲ
  choice: Mais
  rationale: Marque clairement le contraste avec l’avertissement donné par Paul au verset précédent.
- source_word: ἢ
  choice: que
  rationale: Marque normalement le second terme de la comparaison après «davantage».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Armateur » conserve la distinction probable entre le responsable de la navigation et le propriétaire ou exploitant du navire. L’imparfait « se laissait convaincre » reflète le processus décrit par le grec.
