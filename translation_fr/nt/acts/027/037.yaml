  text: ἤμεθα δὲ ⸂αἱ πᾶσαι ψυχαὶ ἐν τῷ πλοίῳ⸃ ⸀διακόσιαι ἑβδομήκοντα ἕξ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: fr
  text: Nous étions en tout 276 personnes à bord du navire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Nous étions en tout 276 âmes dans le navire. » Ici, « âmes » signifie « personnes » ou « êtres humains » et ne désigne pas spécialement des âmes immatérielles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: Nous étions
  rationale: Le verbe est à la première personne du pluriel. Le français permet ici de conserver naturellement cette forme explicite du grec.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Dans ce relevé numérique, δέ assure une liaison narrative légère que l’enchaînement français rend sans connecteur ajouté.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: en tout … personnes
  rationale: Dans ce contexte, ψυχαί désigne les personnes présentes, et non spécialement leurs âmes immatérielles. « En tout » rend la valeur totalisante de πᾶσαι.
- source_word: ἐν τῷ πλοίῳ
  choice: à bord du bateau
  rationale: Cette expression idiomatique française rend naturellement la présence dans le navire.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: Les chiffres donnent avec clarté le nombre exact du texte grec.
theological_decisions:
- issue: Sens de ψυχαί
  choice: personnes
  alternative: âmes
  rationale: Le terme compte ici les êtres humains à bord; traduire par « âmes » pourrait suggérer à tort une affirmation anthropologique sur leur composante immatérielle.
translation_notes:
  register: Français international moderne, naturel et digne. La première personne du pluriel conserve directement ἤμεθα, tandis que « à bord du bateau » évite une formulation trop littérale.
