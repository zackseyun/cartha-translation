  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: fr
  text: C’est pourquoi je vous encourage vivement à manger, car cela contribue à votre survie[a] ; en effet, pas un seul cheveu de votre tête ne sera perdu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à votre salut ». Le mot grec peut désigner le salut, la délivrance ou la préservation de la vie ; ici, il s’agit de survivre au naufrage.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conclusion tirée de la situation décrite juste avant.
- source_word: παρακαλῶ
  choice: je vous encourage vivement
  rationale: Rend l’appel pressant de Paul sans recourir au verbe plus soutenu « exhorter ».
- source_word: μεταλαβεῖν τροφῆς
  choice: à manger
  rationale: Cette expression signifie prendre de la nourriture. « Manger » est direct, naturel et pleinement compréhensible dans le contexte.
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: car cela est nécessaire à votre survie
  rationale: Le tour grec indique ici ce qui contribue au salut concret des passagers. Cette formulation française exprime clairement le lien entre le fait de manger et leur survie physique.
- source_word: σωτηρίας
  choice: survie
  rationale: Dans le contexte immédiat du naufrage, le mot désigne la préservation de la vie. La note conserve toutefois la portée lexicale plus large du grec.
- source_word: οὐδενὸς γὰρ ὑμῶν
  choice: d’aucun de vous
  rationale: 'Préserve la portée distributive de la construction grecque : la promesse concerne chaque personne présente.'
- source_word: θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: un cheveu de la tête
  rationale: Conserve l’image idiomatique biblique d’une protection complète dans une formulation française naturelle.
- source_word: ἀπολεῖται
  choice: ne sera perdu
  rationale: Le futur passif idiomatique français convient mieux à un cheveu que « ne périra » tout en rendant le sens de perte exprimé par ἀπόλλυμι.
theological_decisions:
- issue: Sens de σωτηρία dans ce contexte
  choice: survie physique
  alternative: salut
  rationale: Le danger immédiat est celui de mourir en mer, et Paul assure que tous auront la vie sauve. Le texte principal exprime donc le sens contextuel sans supprimer la possibilité lexicale plus large, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le raisonnement de Paul et l’image sémitique du cheveu sans lourdeur littérale.
