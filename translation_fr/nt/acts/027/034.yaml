review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Paul exhorte les personnes à se nourrir et leur garantit une préservation corporelle. Toutefois, « nécessaire à votre survie » renforce légèrement la relation exprimée par πρὸς ... ὑπάρχει (« est pour / contribue à ») en une nécessité explicite. Une formulation de contribution est plus exacte sans perdre le sens contextuel de σωτηρία.'
  naturalness: Le français est moderne et accessible. « Pas un cheveu de la tête d’aucun de vous » est compréhensible, mais lourd et peu idiomatique. « Pas un seul cheveu de votre tête ne sera perdu » est naturel et conserve l’assurance distributive dans ce contexte d’adresse collective.
  terminology: « Survie » rend justement σωτηρία dans le contexte du naufrage, sans introduire un sens sotériologique dans le texte principal. La note conserve à bon droit « salut » comme possibilité lexicale et précise le sens contextuel. « Je vous encourage vivement à manger » transmet correctement la force exhortative de παρακαλῶ et le sens de μεταλαβεῖν τροφῆς.
  issues:
  - severity: low
    issue: « nécessaire à votre survie » est plus fort que le grec.
    rationale: La construction πρὸς + génitif avec ὑπάρχει indique ce qui est pour le bien, la préservation ou le salut des auditeurs. « Contribue à votre survie » exprime ce rapport sans poser explicitement une nécessité.
  - severity: low
    issue: La formulation « de la tête d’aucun de vous » manque de naturel.
    rationale: Elle reproduit la structure distributive grecque de façon pesante en français. « De votre tête » dans une promesse adressée au groupe, renforcé par « pas un seul », transmet naturellement l’assurance qu’aucune personne ne sera atteinte.
  revised_text: C’est pourquoi je vous encourage vivement à manger, car cela contribue à votre survie[a] ; en effet, pas un seul cheveu de votre tête ne sera perdu.
