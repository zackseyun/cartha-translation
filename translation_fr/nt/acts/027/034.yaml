revisions:
- from: 'C’est pourquoi je vous encourage vivement à manger, car cela est nécessaire à votre survie[a] : en effet, pas un cheveu de la tête d’aucun de vous ne sera perdu.'
  to: C’est pourquoi je vous encourage vivement à manger, car cela contribue à votre survie[a] ; en effet, pas un seul cheveu de votre tête ne sera perdu.
  rationale: La révision évite de présenter comme explicitement « nécessaire » ce que le grec présente comme étant pour la préservation des auditeurs. Elle remplace également un calque distributif maladroit par une expression française idiomatique, tout en maintenant le sens d’une protection complète. La note et son ancre sont conservées, car elles signalent utilement l’alternative lexicale de σωτηρία sans imposer un sens théologique hors contexte.
