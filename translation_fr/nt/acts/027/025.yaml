  terminology: « Prenez courage » rend bien εὐθυμεῖτε, et « hommes » conserve l’apostrophe masculine ἄνδρες. « J’ai confiance en Dieu » rend de façon idiomatique πιστεύω τῷ θεῷ sans imposer de développement doctrinal. La note indique adéquatement l’alternative « je crois Dieu ».
