  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: fr
  text: 'C’est pourquoi, prenez courage, hommes, car j’ai confiance en Dieu[a] : il en sera comme il m’a été dit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je crois Dieu ». La construction grecque peut souligner la confiance en Dieu ou le fait de croire ce qu’il a dit.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque la conséquence tirée de l’assurance donnée juste auparavant et conserve clairement le lien logique.
- source_word: εὐθυμεῖτε
  choice: prenez courage
  rationale: Impératif naturel en français moderne, adapté à une situation de grave danger.
- source_word: ἄνδρες
  choice: hommes
  rationale: Conserve l’adresse masculine explicite au groupe présent sur le navire.
- source_word: πιστεύω τῷ θεῷ
  choice: je crois Dieu
  rationale: Le verbe avec le datif exprime ici le fait de croire Dieu, de tenir sa parole pour vraie; cette formulation préserve la force personnelle et propositionnelle de la construction grecque.
- source_word: ὅτι
  choice: ':'
  rationale: La ponctuation française introduit naturellement le contenu de la conviction de Paul sans alourdir la phrase par « que ».
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: tout se passera exactement comme
  rationale: Rend clairement la prédiction et la correspondance précise entre l’événement futur et le message reçu.
- source_word: λελάληταί μοι
  choice: cela m’a été annoncé
  rationale: Préserve la voix passive et rend naturellement en français le message antérieur dont les effets demeurent pertinents.
theological_decisions:
- issue: Rendu de πιστεύω τῷ θεῷ
  choice: je crois Dieu
  alternative: j’ai confiance en Dieu
  rationale: « Je crois Dieu » met au premier plan le fait de tenir pour vrai ce que Dieu a déclaré, tandis que « j’ai confiance en Dieu » souligne davantage la confiance personnelle. Le texte grec permet que ces nuances se recouvrent; la note conserve cette tension.
translation_notes:
  register: Français international moderne, direct et digne. « Hommes » est maintenu pour correspondre à l’apostrophe masculine explicite. « Tout se passera » est plus idiomatique que « il en sera » dans ce contexte narratif, et « exactement comme » exprime la conformité marquée par οὕτως… καθ’ ὃν τρόπον.
