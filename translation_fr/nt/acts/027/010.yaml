source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: fr
  text: 'Il leur dit : « Messieurs, je vois que la traversée va se faire au prix de rudes épreuves et de lourdes pertes, non seulement pour la cargaison et le navire, mais aussi pour nos vies. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Il leur disait
  rationale: Le participe introduit les paroles de Paul dans le fil du récit. Cette tournure française naturelle conserve l’idée d’une parole adressée au groupe.
- source_word: Ἄνδρες
  choice: Messieurs
  rationale: Le vocatif s’adresse aux hommes présents à bord. « Messieurs » est l’interpellation moderne et digne la plus naturelle en français, tandis que « Hommes » serait ici peu idiomatique.
- source_word: θεωρῶ
  choice: je vois
  rationale: Le verbe exprime ici une appréciation réfléchie fondée sur l’observation, non une simple perception visuelle. En français, « je vois que » communique naturellement ce jugement.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: va entraîner des épreuves violentes et de lourdes pertes
  rationale: Dans ce contexte maritime, ὕβρις évoque les sévices ou difficultés violentes que causera la traversée, et ζημία une perte ou un dommage important. La formulation évite d’attribuer à ὕβρις son sens moral d’« arrogance ».
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: non seulement pour la cargaison et le navire, mais aussi pour
  rationale: Les génitifs précisent ce que toucheront les pertes. « Cargaison » rend exactement φορτίον dans le cadre d’un transport maritime.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: nos vies
  rationale: Dans la perspective d’un naufrage et de la mort physique, ψυχαί désigne les vies des personnes à bord, et non spécialement leurs âmes immatérielles.
- source_word: μέλλειν ἔσεσθαι
  choice: va entraîner
  rationale: La construction exprime une perspective imminente ou attendue. La tournure française avec « va » conserve cette valeur tout en permettant une phrase naturelle.
- source_word: τὸν πλοῦν
  choice: la traversée
  rationale: πλοῦς désigne le voyage par mer. « Traversée » est précis, courant et bien adapté au contexte.
theological_decisions:
- issue: Sens de ψυχή dans la menace annoncée
  choice: nos vies
  alternative: nos âmes
  rationale: Le contexte immédiat est celui de pertes humaines possibles lors d’une traversée dangereuse. Le choix contextuel « vies » ne tranche aucune doctrine sur la nature de l’âme.
translation_notes:
  register: Français international moderne, naturel et digne. L’adresse « Messieurs » convient à un groupe masculin sans archaïsme. La syntaxe a été légèrement restructurée pour éviter une formulation lourde tout en préservant les deux termes grecs distincts ὕβρις et ζημία.
