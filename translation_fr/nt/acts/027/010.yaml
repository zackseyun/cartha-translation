  source_fidelity: La formulation « Il leur disait » introduit un imparfait non exprimé par le participe présent λέγων et sonne comme une action répétée ou en cours. De plus, « la traversée va entraîner » fait de la traversée la cause des dommages, alors que le grec annonce une traversée qui sera accompagnée de ὕβρις et de grandes pertes. La révision rend l’avertissement prospectif et conserve la distinction entre les épreuves subies et les pertes.
  naturalness: « Messieurs » et « je vois que » sont naturels dans un français international moderne. « Se fera au prix de rudes épreuves et de lourdes pertes » est idiomatique et évite l’expression peu naturelle « épreuves violentes ».
  terminology: « Traversée », « cargaison », « navire » et « nos vies » rendent précisément πλοῦς, φορτίον, πλοῖον et ψυχαί dans ce contexte. « Rudes épreuves » rend prudemment ὕβρις sans importer son sens moral d’insolence ni réduire indûment le terme à des avaries matérielles.
