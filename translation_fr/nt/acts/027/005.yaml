  variant: modern international French
source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: fr
  text: Après avoir traversé la haute mer au large de la Cilicie et de la Pamphylie[a], nous sommes descendus[b] jusqu’à Myre, en Lycie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le long des côtes de la Cilicie et de la Pamphylie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous sommes arrivés à Myre, en Lycie ». Le verbe grec signifie littéralement « nous sommes descendus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: la haute mer
  rationale: Le terme désigne ici la mer ouverte plutôt que la mer de façon générique; « haute mer » conserve cette précision maritime en français naturel.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: au large de la Cilicie et de la Pamphylie
  rationale: κατά avec l’accusatif situe la traversée le long des côtes ou au large de ces régions. « Au large de » rend clairement ce rapport géographique sans suggérer un trajet terrestre.
- source_word: διαπλεύσαντες
  choice: Après avoir traversé
  rationale: Le participe aoriste présente la traversée comme antérieure au verbe principal; cette tournure française exprime naturellement la succession des actions.
- source_word: κατήλθομεν
  choice: nous sommes descendus jusqu’à
  rationale: Cette formulation conserve le sens directionnel littéral de κατέρχομαι tout en indiquant clairement l’arrivée à destination; « nous sommes arrivés à » demeure une possibilité idiomatique.
- source_word: Μύρα τῆς Λυκίας
  choice: Myre, en Lycie
  rationale: Le génitif situe la ville dans la région; la tournure appositive française est claire et naturelle.
- source_word: τε
  choice: liaison implicite
  rationale: La particule relie légèrement la proposition au récit précédent; en français, cette continuité est suffisamment portée par l’enchaînement narratif.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Haute mer » préserve la précision nautique; « descendus jusqu’à » maintient l’image directionnelle du grec sans rendre la phrase obscure. Les marqueurs [a] et [b] figurent dans le texte dans l’ordre de leur occurrence.
