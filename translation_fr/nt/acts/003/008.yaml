source:
  edition: SBLGNT
  text: καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/008.yaml
  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: fr
  text: D’un bond, il se dressa et se mit à marcher ; il entra avec eux dans le Temple, marchant, bondissant et louant Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: D’un bond
  rationale: Exprime le mouvement soudain par lequel l’homme se dresse, dans un français naturel et vif.
- source_word: ἔστη καὶ περιεπάτει
  choice: il se mit debout et se mit à marcher
  rationale: Le premier verbe marque la station debout; l’imparfait περιεπάτει est rendu de manière inchoative selon le contexte immédiat de la guérison.
- source_word: τὸ ἱερόν
  choice: le Temple
  rationale: Ἱερόν désigne ici l’ensemble du sanctuaire de Jérusalem; la majuscule indique ce référent particulier sans préciser artificiellement une partie du complexe.
- source_word: περιπατῶν καὶ ἁλλόμενος
  choice: marchant, bondissant
  rationale: Conserve les deux actions distinctes et le caractère démonstratif de la guérison, tout en évitant une répétition française maladroite de «sauter».
- source_word: αἰνῶν τὸν θεόν
  choice: louant Dieu
  rationale: Rendu direct et courant de l’action de célébrer Dieu.
theological_decisions: []
