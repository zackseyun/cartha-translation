  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: fr
  text: 'Mais Pierre lui dit : « Je n’ai ni argent ni or, mais ce que j’ai, je te le donne : au nom de Jésus le Messie, le Nazaréen[a], marche ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Nazareth ». Le grec dit plus littéralement « le Nazaréen ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: ni argent ni or
  rationale: Le français naturel emploie « ni… ni… » après la négation. « Argent » conserve à la fois la référence au métal et son sens monétaire dans cette association traditionnelle avec l’or.
- source_word: οὐχ ὑπάρχει μοι
  choice: je n’ai
  rationale: La construction grecque exprime ici la possession ; « je n’ai » est sa formulation française directe et idiomatique.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: mais ce que j’ai, je te le donne
  rationale: La reprise pronominale « le » restitue naturellement en français l’insistance de τοῦτο sans alourdir la phrase.
- source_word: ἐν τῷ ὀνόματι
  choice: au nom de
  rationale: Cette expression française garde la formulation grecque ainsi que ses résonances d’autorité et de représentation.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre ; « le Messie » en traduit le sens plutôt que de le translittérer par « Christ ».
- source_word: τοῦ Ναζωραίου
  choice: le Nazaréen
  rationale: Le substantif adjectival grec est rendu directement par le titre français « le Nazaréen » ; « de Nazareth » reste une reformulation possible.
- source_word: περιπάτει
  choice: marche !
  rationale: L’impératif présent commande directement à l’homme de marcher ; le français bref et énergique convient à la scène.
theological_decisions:
- issue: Rendu de Χριστοῦ dans la formule d’autorité
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette proclamation de guérison, Χριστός demeure intelligible comme titre. « Messie » en donne le sens et évite de le traiter silencieusement comme un simple élément du nom.
- issue: Portée de « au nom de »
  choice: conserver la formule sans l’expliciter
  alternative: par l’autorité de
  rationale: Le grec peut évoquer l’autorité ou l’action représentative, mais une explicitation unique réduirait sa richesse théologique.
translation_notes:
  register: Français international moderne, oral mais digne. La construction commence naturellement par « Mais Pierre lui dit ». L’exclamation finale rend la force de l’ordre sans ajouter l’idée interprétative de « mets-toi à marcher ».
