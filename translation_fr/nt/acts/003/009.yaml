  text: Et tout le peuple le vit marcher et louer Dieu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction de coordination ordinaire qui maintient simplement la continuité du récit, sans ajouter une nuance temporelle absente du grec.
- source_word: εἶδεν
  choice: vit
  rationale: L’aoriste de ὁράω rapporte directement ce que le peuple a perçu; « vit » est naturel et fidèle.
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: Avec l’article et le nom singulier, πᾶς a ici un sens collectif. « Tout le peuple » conserve cette valeur mieux que « toute la foule ».
- source_word: αὐτὸν
  choice: le
  rationale: Pronom complément renvoyant à l’homme guéri mentionné dans le contexte précédent.
- source_word: περιπατοῦντα
  choice: marcher
  rationale: Le participe présent décrit l’action visible de l’homme; « marcher » met clairement en relief la guérison.
- source_word: καὶ αἰνοῦντα
  choice: et louer
  rationale: αἰνέω exprime la louange adressée à Dieu. Après « le vit », l’infinitif coordonné est la tournure française la plus naturelle.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: Objet défini de la louange; en français, le nom propre « Dieu » s’emploie ici sans article.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La construction « le vit marcher et louer Dieu » restitue naturellement les deux participes grecs dépendant du verbe de perception, sans explicitation supplémentaire.
