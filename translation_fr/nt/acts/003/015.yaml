id: ACT.3.15
reference: Acts 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: fr
  text: mais vous avez tué le Prince de la vie[a], que Dieu a ressuscité d’entre les morts. Nous en sommes témoins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Auteur de la vie », « le Fondateur de la vie » ou « le Chef de la vie ». Le mot grec peut évoquer l’origine, la direction ou la primauté.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut signifier que les apôtres sont témoins du Ressuscité lui-même ou témoins de sa résurrection.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: mais
  rationale: Dans la continuité de l’accusation précédente, δέ marque ici un contraste net entre les actes des auditeurs et l’identité de celui qu’ils ont tué.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: le Prince de la vie
  rationale: ἀρχηγός peut désigner celui qui est à l’origine, qui ouvre la voie ou qui dirige. « Prince » conserve en français la portée éminente et directrice du titre, tout en laissant une note préciser son éventail sémantique.
- source_word: ἀπεκτείνατε
  choice: vous avez tué
  rationale: Traduction directe de l’aoriste, sans ajouter la qualification juridique impliquée par « assassiné ».
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: a ressuscité d’entre les morts
  rationale: Formulation française naturelle et précise du langage grec de résurrection; « d’entre les morts » rend la construction ἐκ νεκρῶν.
- source_word: οὗ ἡμεῖς μάρτυρές ἐσμεν
  choice: Nous en sommes témoins
  rationale: La tournure française fluide maintient l’ambiguïté du pronom οὗ/« en », qui peut renvoyer au Christ ressuscité ou à sa résurrection.
theological_decisions:
- issue: Sens du titre christologique ἀρχηγὸς τῆς ζωῆς
  choice: le Prince de la vie
  alternative: l’Auteur de la vie; le Fondateur de la vie; le Guide qui mène à la vie
  rationale: Le terme associe potentiellement origine, primauté et conduite. Le texte principal retient un titre français digne et concis, tandis que la note préserve les autres nuances sans imposer une seule analyse christologique.
- issue: Référent de οὗ dans la proposition sur les témoins
  choice: Nous en sommes témoins
  alternative: Nous sommes ses témoins; nous sommes témoins de cela
  rationale: Le grec permet de rapporter le témoignage soit à la personne ressuscitée, soit au fait de sa résurrection. « En » préserve cette tension mieux qu’une explicitation univoque.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve le contraste accusateur, le titre solennel et l’ambiguïté réelle de la dernière proposition.
