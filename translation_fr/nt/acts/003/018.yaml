  rationale: La révision ne modifie pas le sens. Elle remplace l’enchaînement elliptique introduit par les deux-points par « à savoir que », construction française naturelle qui explicite que la souffrance du Messie est le contenu de l’annonce prophétique. « à l’avance » est aussi légèrement plus idiomatique que « d’avance » dans cette position.
