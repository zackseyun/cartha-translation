id: ACT.3.18
reference: Acts 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: fr
  text: Mais Dieu a ainsi accompli ce qu’il avait annoncé à l’avance par la bouche de tous les prophètes[a], à savoir que son Messie[b] souffrirait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par tous les prophètes ». Le grec dit plus littéralement « par la bouche de tous les prophètes ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son Christ » ; le mot grec Χριστός est rendu ici par « Messie » parce qu’il fonctionne comme un titre.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre l’action des auditeurs évoquée au verset précédent et l’accomplissement souverain de l’annonce divine.
- source_word: προκατήγγειλεν
  choice: avait annoncé d’avance
  rationale: Cette formulation rend à la fois l’antériorité exprimée par le préfixe et l’idée d’une proclamation, sans employer un terme archaïque.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: par la bouche de tous les prophètes
  rationale: Conserve l’image biblique concrète de la « bouche » comme moyen de la parole divine, tout en restant claire en français.
- source_word: παθεῖν
  choice: souffrirait
  rationale: Le futur dans le passé exprime naturellement en français le contenu de l’annonce antérieure, sans ajouter explicitement une idée de nécessité absente de l’infinitif lui-même.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: son Messie
  rationale: Χριστός fonctionne ici comme un titre dans le contexte juif du discours de Pierre. Le possessif αὐτοῦ rattache le Messie à Dieu comme celui qui lui appartient ou qu’il a établi.
- source_word: ἐπλήρωσεν
  choice: a accompli
  rationale: « Accomplir » est idiomatique en français dans un contexte prophétique et rend le fait que Dieu a mené à réalisation ce qu’il avait annoncé.
- source_word: οὕτως
  choice: ainsi
  rationale: Placée auprès du verbe, cette traduction exprime la manière dont l’annonce s’est accomplie, à savoir par les souffrances mentionnées dans le contexte.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot fonctionne ici comme un titre et non principalement comme un nom propre. « Messie » maintient clairement l’arrière-plan juif de l’affirmation de Pierre.
- issue: Valeur de παθεῖν dans le contenu prophétique
  choice: son Messie souffrirait
  alternative: son Messie devait souffrir
  rationale: « Souffrirait » communique le contenu de l’annonce sans introduire plus explicitement que le grec une nécessité modale.
- issue: Rapport entre la souffrance et l’accomplissement
  choice: 'a ainsi accompli… : son Messie souffrirait'
  alternative: a accompli… en faisant souffrir son Messie
  rationale: La formulation retenue affirme l’accomplissement prophétique sans faire de Dieu le sujet grammatical direct de la souffrance, distinction que le texte grec maintient.
translation_notes:
  register: Français international moderne, clair et digne. La tournure biblique « par la bouche de » est conservée parce qu’elle demeure intelligible. Les deux-points introduisent naturellement le contenu de l’annonce et évitent une construction française pesante.
