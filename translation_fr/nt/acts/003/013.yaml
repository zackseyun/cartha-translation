id: ACT.3.13
reference: Acts 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: fr
  text: Le Dieu d’Abraham, d’Isaac et de Jacob, le Dieu de nos pères, a glorifié son serviteur Jésus[a]. Vous, vous l’avez livré et renié devant Pilate, alors que celui-ci avait décidé de le relâcher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son enfant Jésus ». Le mot grec παῖς peut désigner un enfant ou un serviteur; « serviteur » est retenu ici en raison du probable écho au langage d’Ésaïe sur le Serviteur.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: Le Dieu d’Abraham, d’Isaac et de Jacob
  rationale: Conserve la formule biblique et son rythme, tout en employant une coordination naturelle en français moderne.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: le Dieu de nos pères
  rationale: Préserve le registre patriarcal et l’écho biblique de la formule, plutôt que de généraliser en « ancêtres ».
- source_word: ἐδόξασεν
  choice: a glorifié
  rationale: Le passé composé rend naturellement l’aoriste dans ce discours et conserve la portée théologique de δοξάζω.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: son serviteur Jésus
  rationale: « Serviteur » convient au probable écho du Serviteur d’Ésaïe, tout en signalant en note l’autre sens possible de παῖς.
- source_word: παρεδώκατε
  choice: vous l’avez livré
  rationale: « Livrer » exprime la remise de Jésus aux autorités sans ajouter nécessairement la nuance plus étroite de trahison.
- source_word: ἠρνήσασθε
  choice: renié
  rationale: « Renier » rend ici avec force et naturel le refus public exprimé par ἀρνέομαι et maintient le lien avec le vocabulaire néotestamentaire du reniement.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: devant Pilate
  rationale: Rend idiomatiquement l’expression littérale « en face de Pilate » et conserve le cadre public et judiciaire.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: alors que celui-ci avait décidé de le relâcher
  rationale: « Celui-ci » identifie clairement Pilate; « alors que » garde à la fois la relation temporelle et la nuance de contraste possible dans le contexte.
theological_decisions:
- issue: Sens de παῖς appliqué à Jésus
  choice: serviteur
  alternative: enfant
  rationale: Le contexte des Actes et le probable arrière-plan du Serviteur d’Ésaïe favorisent « serviteur ». La note conserve toutefois l’ambiguïté lexicale sans confondre παῖς avec le vocabulaire explicite de la filiation.
- issue: Valeur temporelle de ἐδόξασεν
  choice: a glorifié
  alternative: glorifia
  rationale: Le passé composé est naturel dans un discours français actuel et exprime l’action accomplie de Dieu sans préciser au-delà du texte le moment ou le mode de cette glorification.
- issue: Rapport logique du génitif absolu κρίναντος ἐκείνου ἀπολύειν
  choice: alors que celui-ci avait décidé de le relâcher
  alternative: quand il avait décidé de le relâcher
  rationale: « Alors que » préserve la circonstance temporelle tout en laissant percevoir le contraste entre la décision de Pilate et l’action des auditeurs, sans transformer explicitement le participe en concession.
translation_notes:
  register: Français international moderne, digne et accessible. Le redoublement « Vous, vous » rend l’insistance de ὑμεῖς et le contraste porté par μὲν. Deux phrases sont employées pour éviter une longue subordonnée tout en conservant l’enchaînement accusatoire du grec.
