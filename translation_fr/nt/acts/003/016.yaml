id: ACT.3.16
reference: Acts 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: fr
  text: Et c’est en raison de la foi en son nom[a] que son nom lui-même a rendu cet homme fort, cet homme que vous voyez et connaissez. Oui, la foi qui vient par lui lui a donné ce plein rétablissement[b], devant vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la confiance en son nom ». Le mot grec peut signifier « foi », « confiance » ou, dans certains contextes, « fidélité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cette parfaite santé » ou « cette entière intégrité physique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει
  choice: en raison de la foi
  rationale: Avec le datif, ἐπί peut indiquer le fondement ou la cause. « En raison de » exprime ce rapport sans réduire la formule à un simple moyen instrumental.
- source_word: πίστει τοῦ ὀνόματος αὐτοῦ
  choice: la foi en son nom
  rationale: Le génitif se comprend naturellement ici comme l’objet de la foi. « Son nom » conserve la formulation de Luc, où le nom représente la personne et l’autorité de Jésus.
- source_word: ἐστερέωσεν
  choice: a rendu fort
  rationale: Le verbe signifie rendre ferme ou fort et convient au rétablissement corporel visible de l’homme.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: que vous voyez et connaissez
  rationale: Cette formulation concise maintient à la fois l’observation directe et la connaissance préalable de l’homme par l’auditoire.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom lui-même
  rationale: La répétition emphatique du « nom » est conservée, et « lui-même » rend cette insistance naturelle en français.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: la foi qui vient par lui
  rationale: « Par lui » garde ouverte l’ambiguïté du grec quant à la médiation ou à l’origine de cette foi, sans identifier explicitement son sujet humain.
- source_word: ὁλοκληρίαν
  choice: complet rétablissement
  rationale: Le nom désigne l’intégrité, la pleine santé ou l’état entièrement restauré. Dans ce contexte de guérison physique, « complet rétablissement » est clair et naturel.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: dont vous êtes tous témoins
  rationale: Cette formulation dynamique communique le caractère public et constatable de la guérison, exprimé littéralement par « devant vous tous ».
theological_decisions:
- issue: Sujet et origine de la foi
  choice: La foi est liée au nom de Jésus et vient « par lui », sans préciser qui exerce cette foi.
  alternative: La foi de l’homme guéri, celle des apôtres, ou une foi produite par Jésus.
  rationale: Le grec ne nomme pas explicitement le sujet humain de la foi. La traduction maintient cette tension plutôt que de la résoudre.
- issue: Efficacité du nom
  choice: « Son nom lui-même » demeure le sujet grammatical de l’action.
  alternative: « Jésus lui-même » ou « la puissance de son nom » a rendu cet homme fort.
  rationale: Conserver le « nom » respecte la métaphore théologiquement chargée de Luc et évite d’expliciter au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition rhétorique de « son nom » est volontairement maintenue. « Oui » marque naturellement la reprise introduite par le second καί, tandis que la dernière proposition privilégie une expression française idiomatique du témoignage public.
