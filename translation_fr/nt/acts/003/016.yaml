revisions:
- from: Et c’est en raison de la foi en son nom[a] que son nom lui-même a rendu fort cet homme que vous voyez et connaissez. Oui, la foi qui vient par lui a donné à cet homme le complet rétablissement[b] dont vous êtes tous témoins.
  to: Et c’est en raison de la foi en son nom[a] que son nom lui-même a rendu cet homme fort, cet homme que vous voyez et connaissez. Oui, la foi qui vient par lui lui a donné ce plein rétablissement[b], devant vous tous.
  rationale: La révision corrige une collocation française maladroite et allège l’ordre des mots, sans modifier le sens. « Devant vous tous » rend directement ἀπέναντι πάντων ὑμῶν et conserve l’insistance sur le caractère public de la guérison. La répétition de « cet homme » reflète avec naturel l’emphase de τοῦτον, et « lui a donné » évite une répétition inutile de « à cet homme ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:08:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le nom de Jésus est le sujet de l’affermissement, la foi demeure liée à ce nom sans sujet humain précisé, et la guérison est publiquement attestée. « En raison de » est défendable pour ἐπὶ avec datif. La seconde mention de la foi, « qui vient par lui », maintient de façon acceptable l’ouverture de δι’ αὐτοῦ.'
  naturalness: Deux formulations demandent correction en français moderne. « Le complet rétablissement » est une collocation peu naturelle ; « ce plein rétablissement » est plus idiomatique. « A rendu fort cet homme » est grammaticalement possible mais raide ; placer le complément avant l’attribut améliore sensiblement la fluidité.
  terminology: « Foi », « nom » et « rétablissement » conviennent. Le maintien répété de « son nom » préserve la formulation marquante du grec sans imposer d’interprétation doctrinale. Les notes sont pertinentes et leurs ancres sont correctes.
  issues:
