source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: fr
  text: Et toute personne qui n’écoutera pas ce prophète-là sera entièrement éliminée du milieu du peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera retranchée du milieu du peuple ».'
    reason: « Retranchée » met en avant l’idée d’exclusion de la communauté, en résonance avec l’arrière-plan de la citation, tandis que le verbe grec exprime plus directement une élimination ou destruction complète.
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: toute personne
  rationale: Littéralement « toute âme », mais ψυχή désigne ici chaque individu. « Toute personne » rend naturellement l’idiome sans suggérer une anthropologie dualiste.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: qui n’écoutera pas
  rationale: La relative indéfinie vise toute personne qui refuse d’écouter. Le futur français convient à la formulation de la conséquence annoncée et « écouter » conserve l’idée d’une audition qui appelle une réponse.
- source_word: τοῦ προφήτου ἐκείνου
  choice: ce prophète-là
  rationale: La formule renvoie au prophète semblable à Moïse mentionné juste avant. La minuscule évite de transformer grammaticalement l’expression en titre formel.
- source_word: ἐξολεθρευθήσεται
  choice: sera entièrement retranchée
  rationale: Le verbe exprime une suppression complète ou une destruction. « Entièrement retranchée » conserve à la fois sa force et l’idée d’une exclusion hors du peuple, sans préciser indûment la modalité du jugement.
- source_word: ἐκ τοῦ λαοῦ
  choice: du milieu du peuple
  rationale: Cette expression marque le retrait d’une personne qui se trouvait parmi le peuple. Elle est idiomatique en français et n’ajoute aucun possessif absent du grec.
theological_decisions:
- issue: Nature du jugement annoncé dans la citation ou l’allusion à Deutéronome 18.19
  choice: Exprimer une suppression totale du milieu du peuple sans préciser si le jugement est temporel, communautaire ou eschatologique.
  alternative: Traduire explicitement par l’excommunication hors de la communauté de l’alliance, ou par la destruction lors du jugement final.
  rationale: Le texte annonce un jugement sévère contre celui qui refuse d’écouter le prophète, mais il n’en définit pas complètement la modalité ni le moment. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Ce prophète-là » assure un renvoi explicite au prophète mentionné dans le contexte; « retranchée du milieu du peuple » garde la tonalité biblique tout en restant compréhensible.
