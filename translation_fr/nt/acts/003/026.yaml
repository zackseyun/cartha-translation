  rationale: La seule modification du texte rend explicite que c’est le serviteur envoyé qui bénit en détournant chacun de ses mauvaises actions. Elle conserve la structure, la priorité de « à vous d’abord », l’ambiguïté de « suscité » et toutes les notes existantes.
