id: ACT.3.26
reference: Acts 3:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: fr
  text: « C’est à vous d’abord que Dieu, après avoir suscité son serviteur[a][b], l’a envoyé afin qu’il vous bénisse en détournant chacun de vous de ses mauvaises actions. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « suscité » peut aussi être compris au sens de « ressuscité » ou de « fait paraître et établi » ; le grec ne tranche pas explicitement ici.
    reason: alternative_reading
  - marker: b
    text: Ou « son enfant ». Le mot grec peut désigner un serviteur ou un enfant ; « serviteur » correspond probablement ici à l’arrière-plan du Serviteur d’Ésaïe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: C’est à vous d’abord
  rationale: Cette tournure française exprime clairement la priorité accordée aux premiers destinataires juifs tout en conservant la valeur du datif.
- source_word: ἀναστήσας
  choice: après avoir suscité
  rationale: « Susciter » peut désigner le fait de faire paraître ou d’établir quelqu’un, et peut aussi évoquer ici le relèvement de Jésus. La note maintient cette ambiguïté du grec.
- source_word: τὸν παῖδα αὐτοῦ
  choice: son serviteur
  rationale: Dans le contexte des discours des Actes et de l’arrière-plan du Serviteur d’Ésaïe, « serviteur » est le sens le plus probable. « Enfant » demeure lexicalement possible, tandis que « Fils » serait plus interprétatif que le grec.
- source_word: ἀπέστειλεν αὐτόν
  choice: l’a envoyé
  rationale: Traduction directe et naturelle qui conserve le mouvement d’envoi sans ajouter l’idée plus précise d’une mission officielle.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: pour vous bénir
  rationale: L’infinitif français exprime naturellement la visée de l’envoi portée par le participe grec.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: en détournant chacun de vous
  rationale: La construction rend le moyen par lequel la bénédiction s’accomplit et conserve la portée distributive de ἕκαστον.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: de ses mauvaises actions
  rationale: Après « chacun de vous », le possessif singulier est idiomatique en français. « Mauvaises actions » rend les manifestations concrètes du mal sans se limiter à une abstraction.
theological_decisions:
- issue: Sens de ἀναστήσας appliqué à Jésus
  choice: Conserver « suscité » dans le texte sans préciser s’il s’agit de la résurrection ou du fait que Dieu a fait paraître et établi son serviteur.
  alternative: « ressuscité » ou « fait paraître/établi »
  rationale: Le contexte permet d’entendre une allusion à la résurrection, mais le verbe peut aussi reprendre le motif biblique du prophète ou serviteur que Dieu suscite. La formulation et la note préservent cette tension.
- issue: Nuance christologique de παῖς
  choice: Traduire par « serviteur ».
  alternative: « enfant » ; « fils »
  rationale: « Serviteur » préserve le probable écho au Serviteur d’Ésaïe. « Enfant » est possible lexicalement, mais « Fils » introduirait ici une précision que ce terme grec ne porte pas à lui seul.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase clivée « C’est à vous d’abord que » souligne la priorité des destinataires sans lourdeur. Le texte conserve l’ambiguïté de ἀναστήσας et évite de rendre παῖς par « Fils », qui serait trop interprétatif dans ce verset.
