source:
  edition: SBLGNT
  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: fr
  text: Pierre et Jean montaient au temple à l’heure de la prière[a], la neuvième heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers trois heures de l’après-midi selon notre manière actuelle de compter les heures.
    reason: cultural_note
lexical_decisions:
- source_word: δέ
  choice: non rendu explicitement
  rationale: Cette particule assure ici une transition narrative légère, sans contraste marqué. En français, l’enchaînement se fait naturellement sans ajouter « alors » ou « or », qui risqueraient de surinterpréter sa valeur.
- source_word: ἀνέβαινον
  choice: montaient
  rationale: L’imparfait exprime l’action en cours et conserve l’idée de montée portée par le verbe grec, idiomatique pour se rendre à Jérusalem et au temple.
- source_word: ἱερόν
  choice: temple
  rationale: Le terme désigne l’ensemble de l’enceinte ou du complexe du temple, plutôt que le sanctuaire intérieur. « Temple » reste la formulation française naturelle et usuelle.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: à l’heure de la prière
  rationale: Cette expression restitue naturellement en français le moment fixé pour la prière tout en restant proche de la construction grecque.
- source_word: τὴν ἐνάτην
  choice: la neuvième heure
  rationale: La formulation conserve le système antique de décompte des heures et l’apposition du grec. L’équivalent moderne est donné en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. « Montaient au temple » conserve à la fois l’aspect duratif de l’imparfait et l’orientation ascendante du grec. La tournure appositive « la neuvième heure » est maintenue malgré sa légère solennité afin de préserver la structure et le cadre temporel du texte source.
