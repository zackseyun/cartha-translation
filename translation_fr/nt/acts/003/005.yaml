  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: fr
  text: Il leur accordait donc toute son attention[a], s’attendant à recevoir quelque chose de leur part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il les regardait attentivement ». Le verbe exprime ici une attention dirigée vers eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Il… donc
  rationale: ὁ renvoie à l’homme boiteux, repris naturellement par « il ». δέ marque ici une légère progression narrative; « donc » relie son attention à l’ordre donné au verset précédent sans introduire une opposition trop forte.
- source_word: ἐπεῖχεν
  choice: accordait toute son attention
  rationale: Dans ce contexte, ἐπέχω exprime une attention dirigée et soutenue. L’imparfait est rendu par « accordait », qui présente l’action en cours.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom renvoie à Pierre et Jean. Avec « accorder son attention », le français idiomatique emploie le complément indirect « leur ».
- source_word: προσδοκῶν
  choice: s’attendant
  rationale: Le participe décrit l’attente qui accompagne son attention; « s’attendant à » exprime naturellement cette anticipation.
- source_word: τι
  choice: quelque chose
  rationale: Le pronom indéfini reste volontairement non précisé; le contexte suggère un don sans que le texte le nomme.
- source_word: παρ’ αὐτῶν
  choice: de leur part
  rationale: παρά avec le génitif indique ici la source. « De leur part » évite la répétition immédiate de « leur » tout en restant clair.
- source_word: λαβεῖν
  choice: recevoir
  rationale: L’infinitif précise l’objet de son attente. « Recevoir » convient au contexte d’un don et évite l’ambiguïté de « prendre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’attente indéterminée du texte grec sans préciser qu’il espérait de l’argent ou une aumône.
