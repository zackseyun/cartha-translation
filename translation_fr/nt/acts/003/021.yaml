review_pass:
  verdict: revise
  source_fidelity: La proposition « comme Dieu l’a annoncé » interprète librement ὧν ἐλάλησεν (« dont Dieu a parlé ») comme une annonce du rétablissement. Le grec relie plus directement le relatif pluriel à « toutes choses » et, possiblement, aux « temps » ; il convient de conserver l’idée de ce dont Dieu a parlé par les prophètes.
  naturalness: « Le ciel doit le recevoir » et « les temps du rétablissement de toutes choses » sont naturels dans un français biblique moderne et rendent la construction sans l’expliciter indûment. « D’autrefois » convient à ἀπ’ αἰῶνος.
  terminology: « Rétablissement de toutes choses » rend de façon transparente ἀποκατάστασις πάντων, sans lui attribuer une portée doctrinale définie. « Par la bouche de ses saints prophètes » conserve l’expression source.
