id: ACT.3.21
reference: Acts 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: fr
  text: Lui, le ciel doit le recevoir jusqu’aux temps du rétablissement de toutes choses, dont Dieu a parlé par la bouche de ses saints prophètes d’autrefois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « jusqu’aux temps où se produira le rétablissement de tout ce dont Dieu a parlé par la bouche de ses saints prophètes d’autrefois ». Le relatif grec peut être compris comme se rapportant à « toutes choses » ou aux « temps ».'
    reason: Signaler l’ambiguïté syntaxique du relatif grec sans présenter comme certaine une interprétation doctrinale du rétablissement.
lexical_decisions:
- source_word: δέξασθαι
  choice: accueillir
  rationale: Exprime naturellement l’idée de recevoir quelqu’un dans un lieu, ici le ciel, tout en conservant le ciel comme sujet grammatical.
- source_word: ἄχρι χρόνων
  choice: jusqu’aux temps
  rationale: Conserve le pluriel du grec et la valeur temporelle de la préposition.
- source_word: ἀποκαταστάσεως πάντων
  choice: où tout sera rétabli
  rationale: Formulation française naturelle qui maintient la portée générale de πάντων sans préciser davantage ce que comprend ce rétablissement.
- source_word: διὰ στόματος
  choice: par la bouche
  rationale: Conserve l’expression sémitisante et biblique qui présente les prophètes comme porte-parole de Dieu.
- source_word: ἀπ’ αἰῶνος
  choice: d’autrefois
  rationale: Rend l’ancienneté indéfinie de l’expression sans lui imposer le sens métaphysique de « depuis l’éternité ».
theological_decisions:
- issue: Portée du « rétablissement de tout »
  choice: tout sera rétabli
  alternative: le rétablissement de toutes choses
  rationale: La traduction garde la vaste portée et l’ambiguïté de l’expression grecque, sans en déduire une doctrine précise sur l’étendue du salut.
- issue: Relation de ὧν avec l’annonce prophétique
  choice: comme Dieu l’a annoncé
  alternative: que Dieu a annoncé
  rationale: Le génitif relatif grec peut être compris comme rattachant la parole divine aux temps ou au rétablissement. « comme Dieu l’a annoncé » restitue clairement l’idée que cet événement avait été annoncé, sans la tournure française maladroite « tout ce que Dieu a annoncé ».
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste proche de la structure grecque, mais « où tout sera rétabli » évite une nominalisation lourde. « D’autrefois » est courant et solennel sans être archaïque.
