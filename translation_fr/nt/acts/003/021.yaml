  to: Lui, le ciel doit le recevoir jusqu’aux temps du rétablissement de toutes choses, dont Dieu a parlé par la bouche de ses saints prophètes d’autrefois.[a]
  rationale: La révision remplace l’interprétation « comme Dieu l’a annoncé » par une formulation qui rend le verbe grec ἐλάλησεν et conserve le lien avec la parole prophétique. Elle maintient le pluriel de « temps », la portée générale de « toutes choses » et une note d’ambiguïté syntaxique exacte.
