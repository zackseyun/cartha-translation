    rationale: Le verbe grec est « parler de », et non simplement « annoncer ». La reformulation actuelle rattache explicitement la parole divine au rétablissement et efface le lien syntaxique avec le pluriel « toutes choses » / éventuellement « temps ».
  - severity: low
    issue: La note décrit le rattachement comme pouvant viser « l’ensemble de l’expression précédente », sans préciser les antécédents pluriels pertinents.
    rationale: Le relatif neutre pluriel ὧν ne se rattache pas directement au nom singulier ἀποκαταστάσεως. Une note révisée peut signaler sobrement l’alternative entre « toutes choses » et les « temps ».
