  text: ἀτενίσας δὲ Πέτρος εἰς αὐτὸν σὺν τῷ Ἰωάννῃ εἶπεν· Βλέψον εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: fr
  text: 'Pierre, avec Jean, fixa les yeux sur lui et dit : « Regarde-nous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: fixant les yeux
  rationale: Le participe aoriste exprime un regard soutenu et attentif. « Fixant les yeux » en restitue l’intensité dans un français naturel et digne.
- source_word: δὲ
  choice: non traduit séparément
  rationale: Ici, δέ est une articulation narrative légère. La succession des propositions suffit à la rendre naturellement en français, sans introduire un contraste indu.
- source_word: εἰς αὐτόν
  choice: sur lui
  rationale: Avec ἀτενίζω, εἰς désigne l’objet vers lequel se porte le regard concentré ; « sur lui » convient à la locution française « fixer les yeux sur ».
- source_word: σὺν τῷ Ἰωάννῃ
  choice: avec Jean
  rationale: La préposition σύν avec le datif marque l’accompagnement. « Avec Jean » est clair et idiomatique, sans ajouter une insistance absente du contexte.
- source_word: εἶπεν
  choice: dit
  rationale: Le verbe λέγω est ici le verbe ordinaire de parole ; « dit » en est l’équivalent direct.
- source_word: Βλέψον
  choice: Regarde
  rationale: L’impératif aoriste appelle directement l’homme à porter son attention visuelle sur les apôtres. « Regarde » est simple, naturel et précis.
- source_word: εἰς ἡμᾶς
  choice: -nous
  rationale: 'Après « regarder », le français emploie directement le complément d’objet : « regarde-nous ». Cela restitue idiomatiquement l’orientation exprimée par εἰς.'
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation conserve la différence entre le regard soutenu de Pierre et son ordre bref adressé à l’homme.
