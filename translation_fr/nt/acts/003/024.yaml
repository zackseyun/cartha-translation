id: ACT.3.24
reference: Acts 3:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: fr
  text: Et tous les prophètes, depuis Samuel et ceux qui lui ont succédé[a], tous ceux qui ont parlé, ont aussi annoncé[b] ces jours-ci[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont venus ensuite » ou « ceux qui ont suivi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « proclamé »; dans ce contexte, on pourrait aussi comprendre « prédit », formulation plus interprétative.
    reason: lexical_alternative
  - marker: c
    text: Ou « ces temps ». L’expression renvoie à la période présente d’accomplissement dans le discours de Pierre.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ πάντες δὲ οἱ προφῆται
  choice: Tous les prophètes aussi
  rationale: La combinaison καί…δέ assure ici une transition et rattache l’ensemble des prophètes au témoignage déjà évoqué, sans marquer une forte opposition. « aussi » restitue naturellement ce lien en français.
- source_word: ἀπὸ Σαμουὴλ
  choice: depuis Samuel
  rationale: ἀπό désigne Samuel comme point de départ d’une suite. « Depuis Samuel » conserve cette valeur temporelle et séquentielle sans ajouter explicitement « à commencer par ».
- source_word: τῶν καθεξῆς
  choice: ceux qui lui ont succédé
  rationale: καθεξῆς exprime une succession. La formulation française rend le groupe substantivé et explicite naturellement que la série se poursuit après Samuel.
- source_word: ὅσοι ἐλάλησαν
  choice: tous ceux qui ont parlé
  rationale: ὅσοι a une portée inclusive ou quantitative. « Tous ceux qui ont parlé » est idiomatique en français et garde cette portée, sans préciser indûment le contenu de leur parole.
- source_word: καὶ κατήγγειλαν
  choice: ont annoncé
  rationale: καταγγέλλω signifie annoncer ou proclamer. « Annoncé » convient au contexte prophétique sans imposer la nuance plus interprétative de « prédit »; la valeur additive de καί est déjà portée par « aussi » en tête de phrase.
- source_word: τὰς ἡμέρας ταύτας
  choice: ces jours
  rationale: La traduction directe préserve l’expression temporelle grecque et son lien contextuel avec la période d’accomplissement évoquée par Pierre.
theological_decisions:
- issue: Rapport des prophètes à la période présente d’accomplissement
  choice: ces jours
  alternative: ces temps
  rationale: Le texte renvoie vraisemblablement à la période d’accomplissement messianique dont parle Pierre. « Ces jours » maintient toutefois l’expression grecque sans expliciter davantage sa portée eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « tous les prophètes… tous ceux qui ont parlé » conserve l’ampleur inclusive et la structure du grec tout en restant intelligible. Les notes signalent les principales possibilités lexicales sans résoudre plus précisément que le texte la portée prophétique et temporelle.
