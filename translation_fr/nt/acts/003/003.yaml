source:
  edition: SBLGNT
  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: fr
  text: Quand il vit Pierre et Jean sur le point d’entrer dans le Temple[a], il leur demandait l’aumône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne l’enceinte ou l’ensemble du Temple, et non précisément le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: Quand il vit
  rationale: Le pronom relatif renvoie à l’homme mentionné au verset précédent, et le participe aoriste exprime ici naturellement la circonstance temporelle.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pierre et Jean
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: μέλλοντας εἰσιέναι
  choice: sur le point d’entrer
  rationale: μέλλω avec l’infinitif indique ici l’imminence de leur entrée.
- source_word: εἰς τὸ ἱερόν
  choice: dans le Temple
  rationale: « Temple » est naturel dans le texte courant; ἱερόν désigne plus précisément l’ensemble de l’enceinte du Temple, ce que précise la note.
- source_word: ἠρώτα
  choice: il leur demanda
  rationale: L’imparfait grec peut présenter l’action en cours ou répétée, mais le français narratif emploie naturellement le passé simple sans imposer un commencement que le verbe n’exprime pas explicitement.
- source_word: ἐλεημοσύνην λαβεῖν
  choice: de lui faire l’aumône
  rationale: Cette expression française idiomatique communique clairement qu’il sollicitait un don destiné à un pauvre, tout en intégrant naturellement l’idée de recevoir portée par λαβεῖν.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La tournure « faire l’aumône » est courante et plus idiomatique que « demander à recevoir une aumône ». La majuscule à « Temple » identifie l’édifice de Jérusalem.
