source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: fr
  text: Il le prit par la main droite et le releva. Aussitôt, ses pieds et ses chevilles[a] furent affermis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les os des chevilles ».'
    reason: Variante lexicale possible pour τὰ σφυδρά, dont le référent peut être formulé de manière plus spécifiquement anatomique.
lexical_decisions:
- source_word: πιάσας
  choice: il le saisit
  rationale: Le participe aoriste exprime l’action qui accompagne et précède le verbe principal. « Saisit » rend clairement la prise physique sans suggérer ici de violence.
- source_word: τῆς δεξιᾶς χειρός
  choice: par la main droite
  rationale: Cette tournure rend naturellement en français le génitif employé avec πιάσας. Le contexte indique qu’il s’agit de la main droite de l’homme.
- source_word: ἤγειρεν αὐτόν
  choice: le fit lever
  rationale: ἐγείρω désigne ici l’action de mettre quelqu’un debout. « Le fit lever » conserve l’action concrète sans ajouter l’idée interprétative d’une simple assistance.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: L’adverbe souligne le caractère immédiat du changement physique; « aussitôt » est direct, naturel et adapté au registre narratif.
- source_word: ἐστερεώθησαν
  choice: furent affermis
  rationale: Le passif indique que les membres reçurent fermeté et force. « Furent affermis » préserve ce passif et le sens résultatif sans préciser un agent que la proposition ne nomme pas.
- source_word: αἱ βάσεις αὐτοῦ
  choice: ses pieds
  rationale: βάσεις désigne littéralement les bases ou appuis du corps. Dans ce contexte anatomique, « ses pieds » est la formulation française la plus naturelle.
- source_word: τὰ σφυδρά
  choice: ses chevilles
  rationale: Le terme désigne la région ou les articulations des chevilles. « Chevilles » reste précis sans imposer une désignation anatomique plus étroite.
theological_decisions:
- issue: Nature de la description de la guérison
  choice: Rapporter directement l’affermissement physique immédiat sans expliquer le mécanisme du miracle.
  alternative: Traduire par « furent guéris » ou ajouter explicitement que Dieu les affermit.
  rationale: Le grec décrit concrètement l’effet produit sur les pieds et les chevilles. La traduction conserve cette formulation et laisse au contexte l’identification de l’action miraculeuse et de son agent.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple et narrative. Le marqueur de note est placé après « chevilles », terme auquel la variante lexicale se rapporte.
