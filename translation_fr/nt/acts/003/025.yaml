id: ACT.3.25
reference: Acts 3:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: fr
  text: 'Vous êtes les fils[a] des prophètes et de l’alliance que Dieu a conclue avec vos pères, en disant à Abraham : « Et en ta descendance[b] seront bénies toutes les familles de la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants ». Le grec dit « fils », expression qui évoque ici des héritiers et des bénéficiaires des promesses.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « semence ». Le mot grec peut désigner collectivement les descendants d’Abraham et peut aussi, dans le contexte biblique, avoir une portée singulière représentative.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: fils
  rationale: Le masculin pluriel du grec est conservé. Dans ce contexte, « fils » exprime moins une filiation biologique que l’appartenance à l’héritage des prophètes et de l’alliance.
- source_word: προφητῶν
  choice: des prophètes
  rationale: Le génitif est rendu directement ; l’expression désigne ceux qui héritent des promesses transmises par les prophètes.
- source_word: διαθήκης
  choice: de l’alliance
  rationale: Dans le contexte de la promesse faite à Abraham, « alliance » est le terme français biblique et théologique approprié.
- source_word: διέθετο ὁ θεὸς
  choice: Dieu a conclue
  rationale: En lien avec διαθήκη, le verbe désigne l’établissement d’une alliance. « Conclure une alliance » est idiomatique en français moderne.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: avec vos pères
  rationale: Même si πρός peut se rendre littéralement par « envers » ou « à », le français dit naturellement qu’une alliance est conclue « avec » quelqu’un. « Pères » conserve ici la référence ancestrale.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: lorsqu’il a dit à Abraham
  rationale: Cette formulation française rattache clairement la citation à l’acte par lequel Dieu a établi l’alliance, sans alourdir la phrase.
- source_word: σπέρματί
  choice: descendance
  rationale: « Descendance » rend naturellement le sens collectif de σπέρμα tout en restant grammaticalement au singulier, ce qui préserve la possibilité d’une portée représentative singulière.
- source_word: ἐνευλογηθήσονται
  choice: seront bénies
  rationale: Le futur passif grec est rendu directement, sans préciser davantage l’agent ou le mécanisme de la bénédiction.
- source_word: πατριαὶ
  choice: familles
  rationale: Le terme peut désigner des familles ou des clans ; « familles » convient au caractère universel de la promesse.
- source_word: γῆς
  choice: terre
  rationale: Dans cette promesse universelle, « terre » convient mieux que « pays » ou « territoire ».
theological_decisions:
- issue: Portée représentative du masculin υἱοὶ
  choice: fils
  alternative: enfants
  rationale: « Fils » conserve la forme masculine et le langage d’héritage de la source. Une note précise que l’expression peut englober ceux qui participent à cet héritage, sans neutraliser le texte principal.
- issue: Portée collective ou singulière de σπέρμα
  choice: descendance
  alternative: semence ; descendant
  rationale: « Descendance » préserve la portée collective naturelle du mot tout en n’excluant pas sa possible portée singulière représentative dans le contexte biblique.
- issue: Valeur de ἐν dans la promesse abrahamique
  choice: en ta descendance
  alternative: par ta descendance
  rationale: La tournure avec « en » suit de près le grec et évite de réduire explicitement la relation à un simple moyen instrumental, même si elle est légèrement plus marquée en français.
translation_notes:
  register: Français moderne, clair et digne. La structure « fils des prophètes et de l’alliance » est volontairement conservée malgré son caractère marqué, car elle porte l’idée d’héritage. « En ta descendance » maintient l’écho formel de la promesse et son ambiguïté théologique.
