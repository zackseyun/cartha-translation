id: ACT.3.20
reference: Acts 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: fr
  text: afin que viennent des temps de renouveau de la présence du Seigneur, et qu’il envoie Jésus, le Messie désigné d’avance pour vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désigné à votre intention » ou « désigné pour vous ».
    reason: 'Alternative lexicale pour προκεχειρισμένον ὑμῖν : le datif peut se rendre par « à votre intention » ou « pour vous ». Le texte principal exprime l’antériorité inhérente au participe.'
lexical_decisions:
- source_word: ὅπως ἂν
  choice: afin que
  rationale: Introduit naturellement en français le but ou le résultat lié à l’appel précédent à changer de conduite, sans accentuer indûment l’incertitude.
- source_word: ἔλθωσιν
  choice: viennent
  rationale: Le subjonctif présent français après « afin que » rend naturellement le subjonctif aoriste grec dans cette proposition de but ou de résultat.
- source_word: καιροὶ
  choice: des temps
  rationale: Préserve la portée large de καιρός, qui peut désigner des temps ou des périodes propices, sans préciser outre mesure leur caractère eschatologique.
- source_word: ἀναψύξεως
  choice: de renouveau
  rationale: Exprime de manière naturelle l’idée de rafraîchissement, de soulagement ou de reprise de vigueur, tout en conservant une certaine ampleur métaphorique.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: accordés par la présence du Seigneur
  rationale: « Présence » rend l’expression idiomatique fondée sur « face ». L’ajout de « accordés » explicite en français la relation de provenance exprimée par ἀπό, sans faire de la présence un simple lieu.
- source_word: ἀποστείλῃ
  choice: qu’il envoie
  rationale: Le subjonctif coordonné dépend toujours de « afin que » et garde le lien syntaxique avec l’exhortation précédente.
- source_word: προκεχειρισμένον
  choice: désigné
  rationale: Rend la désignation préalable sans alourdir le texte principal par un adverbe temporel explicite.
- source_word: ὑμῖν
  choice: pour vous
  rationale: Le datif peut signifier « pour vous » ou « à vous » ; « pour vous » est naturel et laisse entendre une désignation concernant les destinataires.
- source_word: χριστὸν
  choice: le Messie
  rationale: Le terme fonctionne ici comme un titre messianique appliqué à Jésus ; « Messie » en transmet le sens dans son cadre juif.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
theological_decisions:
- issue: 'Valeur de χριστὸν : titre traduit ou forme traditionnelle'
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette construction, χριστός est le titre de Jésus. « Le Messie » en communique directement la portée sans traiter le terme comme un simple élément de nom.
- issue: Sens de προκεχειρισμένον ὑμῖν
  choice: désigné pour vous
  alternative: désigné à votre intention ; désigné d’avance pour vous
  rationale: Le participe implique une désignation antérieure, mais le français n’exige pas que cette antériorité soit explicitée dans le texte principal. La note conserve les autres nuances possibles.
- issue: Relation exprimée par ἀπὸ προσώπου τοῦ κυρίου
  choice: accordés par la présence du Seigneur
  alternative: venant de la présence du Seigneur ; venant de devant le Seigneur
  rationale: La formulation choisie conserve la présence du Seigneur comme source du renouveau tout en évitant une tournure française maladroite ou purement spatiale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase maintient la dépendance des deux verbes envers « afin que ». « Renouveau » est plus idiomatique que « rafraîchissement » dans ce contexte, tandis que la note préserve l’ambiguïté de la désignation.
