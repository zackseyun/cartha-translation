id: ACT.3.22
reference: Acts 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: fr
  text: 'En effet, Moïse a dit[b] : « Le Seigneur Dieu suscitera pour vous, parmi vos frères[a], un prophète comme moi. Vous l’écouterez en tout ce qu’il vous dira. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi vos compatriotes israélites ». Le grec dit littéralement « parmi vos frères » et emploie ici un terme masculin de parenté dans un sens collectif lié au peuple de l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: Les Actes citent ici Deutéronome 18:15 avec une formulation légèrement différente. En particulier, le texte grec des Actes dit « le Seigneur Dieu », et non « le Seigneur ton Dieu ».
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: μὲν
  choice: En effet
  rationale: Rend la valeur d’insistance et de progression du discours sans alourdir la phrase.
- source_word: εἶπεν ὅτι
  choice: 'a dit : « … »'
  rationale: La citation directe est naturelle en français et met clairement en évidence la formule de citation.
- source_word: Προφήτην
  choice: un prophète
  rationale: L’absence d’article se rend naturellement par l’indéfini, sans introduire dans le texte le titre interprétatif « le Prophète ».
- source_word: ἀναστήσει
  choice: suscitera
  rationale: Dans ce contexte, le verbe désigne l’action de faire paraître ou d’établir un prophète; « suscitera » conserve aussi le lien traditionnel avec Deutéronome 18 sans imposer ici le sens de résurrection.
- source_word: κύριος ὁ θεὸς
  choice: Le Seigneur Dieu
  rationale: Suit exactement le texte grec des Actes, qui ne comporte pas le possessif « votre », contrairement à la formulation de Deutéronome 18:15.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: parmi vos frères
  rationale: Conserve le langage masculin de parenté employé par le grec et exprime naturellement la provenance au sein du peuple d’Israël.
- source_word: ὡς ἐμέ
  choice: comme moi
  rationale: Rend directement la comparaison entre le prophète annoncé et Moïse.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: Vous l’écouterez
  rationale: Le futur possède ici une force prescriptive dans le cadre de la citation; « écouter » peut exprimer à la fois l’attention et l’obéissance.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: en tout ce qu’il vous dira
  rationale: Formulation française claire qui préserve la portée globale et distributive de l’expression grecque.
theological_decisions:
- issue: Citation de Deutéronome 18 et identification messianique
  choice: Maintenir « un prophète » sans ajouter « le Messie » ni transformer l’expression en titre.
  alternative: Rendre par « le Prophète » ou expliciter dans la citation qu’il s’agit du Messie.
  rationale: Pierre applique ce passage à Jésus dans son discours, mais la formulation grecque du verset dit simplement « un prophète ». La traduction conserve cette formulation et laisse le contexte établir l’identification.
- issue: Portée de ἀδελφῶν
  choice: vos frères
  alternative: vos compatriotes israélites
  rationale: Le grec emploie un pluriel masculin de parenté dans un sens collectif lié au peuple de l’alliance. Le texte principal conserve cette forme, tandis que la note en précise la portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec tout en étant naturelle à la lecture publique. Les marqueurs de notes ont été placés auprès des éléments qu’ils expliquent.
