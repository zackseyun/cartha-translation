id: ACT.3.2
reference: Acts 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: fr
  text: Et un homme, boiteux depuis le ventre de sa mère[a], était porté ; on le déposait chaque jour à la porte du Temple[b] appelée « la Belle »[c], afin qu’il demande l’aumône aux personnes qui entraient dans l’enceinte du Temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « boiteux depuis sa naissance ». Littéralement : « depuis le ventre de sa mère ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « Temple » désigne ici l’ensemble du complexe ou de l’enceinte du Temple, et non uniquement le sanctuaire intérieur.
    reason: cultural_note
  - marker: c
    text: Le nom grec de cette porte signifie littéralement « Belle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: un homme
  rationale: τις présente un individu indéfini mais précis dans le récit. En français moderne, « un homme » exprime naturellement cette valeur sans la lourdeur de « un certain homme ».
- source_word: χωλὸς
  choice: boiteux
  rationale: « Boiteux » désigne directement l’incapacité à marcher normalement et reste plus précis que le terme général « infirme ».
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: depuis le ventre de sa mère
  rationale: Cette formulation conserve l’image concrète du grec et indique que son état remontait à la naissance; l’équivalent idiomatique est signalé en note.
- source_word: ὑπάρχων
  choice: qui était
  rationale: Le participe décrit l’état durable de l’homme. La relative française l’intègre clairement et naturellement.
- source_word: ἐβαστάζετο
  choice: on portait
  rationale: L’imparfait passif grec présente l’homme en train d’être transporté. Le tour français avec « on » conserve le sens sans inventer l’identité des porteurs.
- source_word: ἐτίθουν
  choice: on le déposait
  rationale: L’imparfait, renforcé par « chaque jour », exprime une action habituelle. « Déposer » convient au fait de placer une personne à un endroit déterminé.
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Équivalent français courant et exact de la valeur distributive.
- source_word: θύραν τοῦ ἱεροῦ
  choice: porte du Temple
  rationale: Dans ce cadre architectural public, θύρα désigne une porte monumentale. « Temple » est naturel dans le texte courant, tandis qu’une note précise la portée de ἱερόν.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: appelée « la Belle »
  rationale: Ὡραία fonctionne comme le nom de la porte. La traduction conserve le sens littéral de cette appellation.
- source_word: τοῦ αἰτεῖν
  choice: afin qu’il demande
  rationale: L’infinitif articulé exprime ici le but; « afin que » rend explicitement et naturellement cette relation.
- source_word: ἐλεημοσύνην
  choice: l’aumône
  rationale: « Demander l’aumône » est l’expression française consacrée pour solliciter des dons destinés aux pauvres.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: à ceux qui entraient dans l’enceinte du Temple
  rationale: La formulation rend l’action d’entrer et précise naturellement qu’il s’agit du complexe du Temple, plutôt que du sanctuaire intérieur.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque a été divisée en deux pour éviter une longue relative peu naturelle. Les imparfaits « portait » et « déposait » conservent respectivement l’action en cours et l’habitude quotidienne. La majuscule à « Temple » distingue ce complexe cultuel précis.
