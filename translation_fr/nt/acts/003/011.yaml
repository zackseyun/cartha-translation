source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: fr
  text: Tandis qu’il s’agrippait à Pierre et à Jean[a], tout le peuple, profondément stupéfait, accourut vers eux au portique appelé « portique de Salomon »[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « restait fermement attaché à Pierre et à Jean ». Le verbe grec évoque le fait de saisir ou de tenir fermement.'
    reason: lexical_alternative
  - marker: b
    text: Le « portique de Salomon » était une galerie couverte à colonnade située dans l’enceinte du temple.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: Tandis qu’il s’agrippait à
  rationale: Le génitif absolu au participe présent exprime une action simultanée. « S’agrippait à » restitue la prise ferme suggérée par κρατέω, tout en restant naturel en français.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: Pierre et Jean
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: συνέδραμεν
  choice: accourut
  rationale: Le verbe exprime le fait de courir ensemble vers un même point. Avec le sujet collectif « tout le peuple », « accourut » rend naturellement la rapidité et la convergence.
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: Traduction proche du grec, sans réduire nécessairement le groupe à une simple foule.
- source_word: πρὸς αὐτούς
  choice: vers eux
  rationale: Rend directement le mouvement en direction de Pierre, Jean et l’homme guéri.
- source_word: ἐπὶ τῇ στοᾷ
  choice: sous le portique
  rationale: Une στοά est une galerie couverte à colonnade. « Sous le portique » décrit naturellement la localisation dans cet espace couvert.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: appelé « portique de Salomon »
  rationale: Cette formulation explicite naturellement en français le nom traditionnel du lieu, là où le grec emploie une désignation elliptique au génitif.
- source_word: ἔκθαμβοι
  choice: profondément stupéfait
  rationale: L’expression conserve l’intensité de ἔκθαμβος. Le singulier s’accorde avec le sujet collectif « tout le peuple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’action simultanée, la force de l’étonnement et le mouvement collectif du texte grec, tout en employant une formulation architecturale naturelle.
