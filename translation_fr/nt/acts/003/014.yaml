  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: fr
  text: Mais vous, vous avez renié le Saint et le Juste, et vous avez demandé qu’un meurtrier vous soit accordé[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement dans ce contexte : « soit relâché pour vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: Mais vous, vous
  rationale: δέ marque le contraste avec ce qui précède, tandis que le pronom explicite ὑμεῖς donne de l’emphase. La dislocation naturelle « vous, vous » conserve cette insistance accusatrice en français.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: le Saint et le Juste
  rationale: L’article avec les deux adjectifs substantivés désigne Jésus. En français, « le Saint et le Juste » rend directement leur valeur de titres sans ajouter « Celui ».
- source_word: ἠρνήσασθε
  choice: avez renié
  rationale: ἀρνέομαι exprime ici le fait de désavouer ou de renier Jésus. « Renier » conserve mieux que « nier » la force personnelle et relationnelle du rejet.
- source_word: ᾐτήσασθε
  choice: avez demandé
  rationale: αἰτέω signifie demander ou solliciter. « Demander que » s’intègre naturellement à l’infinitif passif qui suit sans renforcer indûment le verbe en « exiger ».
- source_word: ἄνδρα φονέα
  choice: un meurtrier
  rationale: φονεύς désigne un meurtrier, et le nom français désigne déjà un homme au sens générique. Traduire séparément ἄνδρα par « un homme meurtrier » serait lourd et moins naturel.
- source_word: χαρισθῆναι ὑμῖν
  choice: vous soit accordé
  rationale: Le passif de χαρίζομαι signifie ici accorder quelqu’un comme une faveur. Cette traduction conserve la portée du verbe grec; le contexte judiciaire permet la formulation plus explicite « soit relâché pour vous », signalée en note.
theological_decisions:
- issue: Valeur christologique de τὸν ἅγιον καὶ δίκαιον
  choice: 'Traiter les adjectifs substantivés comme des titres de Jésus : « le Saint et le Juste »'
  alternative: 'Les rendre comme de simples qualificatifs : « celui qui est saint et juste »'
  rationale: La construction grecque présente ces désignations de manière substantivée et solennelle. Les majuscules françaises en signalent la valeur titulaire sans préciser davantage leur portée doctrinale.
- issue: Nuance judiciaire de χαρισθῆναι
  choice: Conserver dans le texte la formulation générale « vous soit accordé »
  alternative: 'Expliciter selon le contexte : « soit relâché pour vous »'
  rationale: Le verbe grec a le sens plus large d’accorder par faveur, même si le référent contextuel est la libération de Barabbas. Le texte principal préserve cette latitude lexicale et la note explicite le contexte.
translation_notes:
  register: Français moderne, courant et digne. La reprise « vous, vous » porte l’emphase du pronom grec; la phrase conserve le contraste saisissant entre « le Saint et le Juste » et « un meurtrier ». La virgule finale respecte le caractère continu de la phrase source fournie.
