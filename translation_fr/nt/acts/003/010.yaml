source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: fr
  text: 'Ils le reconnurent : c’était bien l’homme qui avait l’habitude de s’asseoir à la Belle Porte du temple pour recevoir l’aumône[a]. Ils furent remplis de stupeur et d’étonnement à cause de ce qui lui était arrivé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « temple » désigne ici l’ensemble du domaine du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: Ils le reconnaissaient
  rationale: L’imparfait exprime ici la reconnaissance qui se répand ou se prolonge parmi les témoins; cette tournure reste naturelle dans le récit.
- source_word: οὗτος ἦν
  choice: c’était bien l’homme
  rationale: '« Bien » restitue la force identificatrice du démonstratif : les témoins constatent qu’il s’agit effectivement du mendiant qu’ils connaissaient.'
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: l’homme qui avait l’habitude de s’asseoir … pour demander l’aumône
  rationale: La formulation rend la fonction descriptive et habituelle du participe substantivé, tandis que « pour demander l’aumône » exprime clairement le but dans un français actuel.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: à la Belle Porte
  rationale: Le syntagme désigne la porte connue sous ce nom; la majuscule signale ce statut sans ajouter d’explication conjecturale.
- source_word: τοῦ ἱεροῦ
  choice: du temple
  rationale: « Temple » est la désignation française courante; ἱερόν vise ici l’ensemble du domaine du Temple plutôt que le sanctuaire intérieur.
- source_word: θάμβους καὶ ἐκστάσεως
  choice: de stupeur et d’étonnement
  rationale: Les deux noms sont maintenus afin de préserver l’intensification et une nuance entre saisissement profond et étonnement.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: devant ce qui lui était arrivé
  rationale: Cette tournure française naturelle conserve la référence à l’événement accompli dont les effets sont visibles.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été légèrement réorganisée pour éviter une construction lourde tout en conservant l’identification emphatique de l’homme, son activité habituelle et la réaction intense des témoins.
