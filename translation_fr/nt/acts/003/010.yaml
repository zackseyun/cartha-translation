  source_fidelity: Le texte rend correctement l'identification de l'homme, son activité habituelle de demandeur d'aumône, la Porte appelée Belle, l'appartenance au complexe du temple et la réaction des témoins. Toutefois, l'imparfait grec ἐπεγίνωσκον est mieux rendu dans ce contexte par un passé simple narratif (« reconnurent ») que par « reconnaissaient », qui peut suggérer une reconnaissance inachevée ou répétée. « Devant » atténue légèrement la valeur causale/de réaction de ἐπί; « à cause de » ou « de ce qui lui était arrivé » est plus direct.
  naturalness: 'La formulation est globalement naturelle et de registre narratif moderne. « Ils le reconnurent : c’était bien l’homme… » est plus idiomatique et plus net que « Ils le reconnaissaient ». « Demander l’aumône » est clair, mais « recevoir l’aumône » reflète plus étroitement πρὸς τὴν ἐλεημοσύνην sans présenter l''homme seulement comme l''agent de la demande.'
  terminology: « Belle Porte » est une désignation acceptable. « Temple » est approprié dans le texte, avec une note qui précise justement que ἱερόν désigne le complexe du Temple. « Stupeur et étonnement » distingue convenablement θάμβος et ἔκστασις, sans importer le sens technique d’« extase ».
