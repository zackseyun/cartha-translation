source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: fr
  text: 'Mais, voyant cela, Pierre répondit au peuple : « Hommes d’Israël, pourquoi vous étonnez-vous de cela, ou pourquoi fixez-vous les yeux sur nous, comme si c’était par notre propre puissance ou par notre piété que nous avions fait marcher cet homme ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: Mais, voyant cela, Pierre
  rationale: Le participe aoriste est rendu par un participe présent naturel en français; « cela » explicite sobrement l’objet implicite, à savoir la réaction de la foule devant la guérison. δέ marque ici une transition légère.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: s’adressa au peuple
  rationale: Comme aucune question explicite ne précède, « s’adressa » rend naturellement la réponse de Pierre à la situation sans créer artificiellement une question verbale.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hommes d’Israël
  rationale: Cette formulation conserve le vocatif masculin explicite tout en restant digne et intelligible en français moderne.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: pourquoi vous étonnez-vous de cela ?
  rationale: θαυμάζω exprime ici l’étonnement ou l’émerveillement; « s’étonner » est actuel et convient au reproche rhétorique.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: Pourquoi fixez-vous les regards sur nous
  rationale: ἀτενίζω désigne un regard soutenu et attentif. « Fixer les regards sur » en conserve la force sans adopter le ton potentiellement impoli de « dévisager ».
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: comme si c’était par notre propre puissance
  rationale: La tournure rend l’hypothèse erronée rejetée par Pierre et conserve l’insistance de ἰδίᾳ sur une puissance appartenant aux apôtres eux-mêmes.
- source_word: ἢ εὐσεβείᾳ
  choice: ou notre piété
  rationale: « Piété » rend directement la dévotion religieuse ou la qualité spirituelle exprimée par εὐσέβεια et demeure courant dans un registre biblique digne.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: que nous avions fait marcher cet homme
  rationale: Le plus-que-parfait reflète l’action accomplie supposément attribuée à Pierre et Jean; « cet homme » identifie clairement le référent masculin dans un français naturel.
theological_decisions:
- issue: La portée de εὐσεβείᾳ et l’éventuel mérite spirituel des apôtres
  choice: notre piété
  alternative: notre attachement à Dieu
  rationale: Pierre nie que la guérison provienne d’une qualité religieuse propre aux apôtres. « Piété » préserve cette dimension sans introduire une doctrine ultérieure du mérite.
- issue: Le vocatif masculin Ἄνδρες Ἰσραηλῖται
  choice: Hommes d’Israël
  alternative: Israélites
  rationale: Le choix conserve la forme masculine de l’adresse grecque sans trancher la composition exacte de l’ensemble de l’auditoire.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation divise en deux questions la construction grecque coordonnée pour améliorer la clarté orale, sans modifier le sens. Aucun archaïsme marqué ni vocabulaire confessionnel propre à une tradition.
