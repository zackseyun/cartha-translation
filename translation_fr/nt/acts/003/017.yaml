  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: fr
  text: Et maintenant, frères[a], je sais que vous avez agi par ignorance, tout comme vos chefs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères » et peut employer ce terme pour s’adresser de manière représentative à un groupe mixte plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: Et maintenant
  rationale: Rend naturellement la transition du discours tout en conservant le lien exprimé par καί et la valeur temporelle de νῦν.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif pluriel signifie littéralement « frères ». Dans ce discours, il peut représenter un auditoire plus large, possibilité signalée en note sans développer le texte principal.
- source_word: οἶδα
  choice: je sais
  rationale: Équivalent direct et idiomatique de l’affirmation de connaissance formulée par Pierre.
- source_word: κατὰ ἄγνοιαν
  choice: par ignorance
  rationale: Expression française naturelle indiquant que l’ignorance caractérisait ou motivait leur action, sans présenter celle-ci comme moralement innocente.
- source_word: ἐπράξατε
  choice: vous avez agi
  rationale: Conserve la formulation générale du grec, qui ne répète ici aucun complément d’objet explicite.
- source_word: ὥσπερ καὶ
  choice: tout comme
  rationale: Exprime clairement la comparaison et inclut naturellement en français l’idée que les chefs ont agi de même.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: vos chefs
  rationale: « Chefs » désigne naturellement les dirigeants investis d’autorité dans le contexte de Jérusalem, sans limiter leur rôle au seul domaine politique.
theological_decisions:
- issue: La mention de l’ignorance excuse-t-elle la culpabilité ?
  choice: vous avez agi par ignorance
  alternative: vous avez agi sans savoir ce que vous faisiez
  rationale: La formulation reconnaît l’ignorance comme facteur réel sans en déduire une exonération complète ; elle préserve ainsi la tension avec l’appel à la repentance du verset 19.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la structure grecque sans devenir raide ; « chefs » est plus courant et contextuellement plus large que « dirigeants » ou « gouvernants ».
