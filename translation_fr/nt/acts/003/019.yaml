  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: fr
  text: Repentez-vous donc et revenez, afin que vos péchés soient effacés,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσατε
  choice: Changez radicalement d’attitude
  rationale: L’impératif appelle à une réorientation décisive de la pensée et de la disposition morale. Cette formulation actuelle garde cette force sans réduire le terme à un simple changement d’opinion ni anticiper le mouvement exprimé par le verbe suivant.
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conséquence tirée de l’argument précédent.
- source_word: ἐπιστρέψατε
  choice: revenez à Dieu
  rationale: Le verbe actif exprime l’idée de se retourner ou de revenir. Le complément « à Dieu », implicite dans ce contexte, rend clairement la direction en français et évite le passif théologiquement chargé « convertissez-vous ».
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: afin que … soient effacés
  rationale: La préposition suivie de l’infinitif articulé peut exprimer le but ou le résultat. « Afin que » est naturel et maintient ce lien sans définir davantage son mécanisme doctrinal.
- source_word: ἐξαλειφθῆναι
  choice: soient effacés
  rationale: Le passif conserve l’image d’une dette ou d’une inscription supprimée et reste idiomatique en français moderne.
- source_word: ἁμαρτίας
  choice: péchés
  rationale: Équivalent français direct et usuel du pluriel ἁμαρτίας.
theological_decisions:
- issue: Rapport entre le changement d’attitude, le retour à Dieu et l’effacement des péchés
  choice: Conserver un lien de but ou de résultat avec « afin que vos péchés soient effacés »
  alternative: Employer une formulation explicitement causale ou développer une doctrine complète de la conversion et du pardon
  rationale: Le grec relie étroitement la réponse commandée à l’effacement des péchés, sans exposer ici tout le mécanisme du salut. La traduction préserve ce lien et sa tension sans le systématiser.
- issue: Explicitation de la direction de ἐπιστρέψατε
  choice: « revenez à Dieu »
  alternative: « revenez » ou « convertissez-vous »
  rationale: Dans le discours, le retour visé est un retour vers Dieu. L’explicitation rend la phrase autonome et naturelle sans importer une conception confessionnelle particulière de la conversion.
translation_notes:
  register: Français international moderne, accessible et digne. La coordination distingue la réorientation intérieure exprimée par μετανοήσατε du retour vers Dieu exprimé par ἐπιστρέψατε. Aucun appel de note n’est nécessaire, puisque « effacés » rend directement l’image grecque.
