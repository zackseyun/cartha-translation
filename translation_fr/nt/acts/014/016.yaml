id: ACT.14.16
reference: Acts 14:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: fr
  text: Au cours des générations passées, il a laissé toutes les nations suivre leurs propres voies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a permis à tous les non-Juifs de marcher dans leurs voies ».'
    reason: 'Alternative lexicale : ἔθνη peut désigner les non-Juifs, et πορεύεσθαι avec ὁδοῖς peut être rendu plus littéralement par « marcher dans leurs voies ».'
lexical_decisions:
- source_word: ὃς
  choice: il
  rationale: Le pronom relatif renvoie à Dieu au verset précédent. En français, la reprise par « il » donne une phrase naturelle tout en gardant clairement ce référent.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Dans les générations passées
  rationale: Cette formulation rend directement l’idée des générations révolues dans un français moderne et digne.
- source_word: εἴασεν
  choice: a laissé
  rationale: « Laisser » exprime ici la permission ou la non-intervention, sans suggérer que Dieu approuvait moralement ces voies.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: « Nations » conserve la portée collective de ἔθνη et son ambiguïté possible entre peuples en général et non-Juifs.
- source_word: πορεύεσθαι
  choice: suivre
  rationale: Avec « voies », « suivre » restitue naturellement en français la métaphore d'une conduite ou d'une orientation de vie, là où « marcher dans » serait plus marqué par le langage biblique traditionnel.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: leurs propres voies
  rationale: « Voies » conserve la métaphore grecque, et « propres » souligne idiomatiquement le possessif αὐτῶν sans ajouter une idée étrangère au texte.
theological_decisions:
- issue: Permission divine ou approbation
  choice: Dieu a laissé les nations suivre leurs propres voies.
  alternative: Dieu a approuvé leurs voies ou les a déterminées causalement.
  rationale: Le verbe ἐάω exprime le fait de permettre ou de laisser faire. La traduction préserve ainsi la tension entre la souveraineté divine et la responsabilité humaine, sans transformer cette permission en approbation morale ni en détermination causale.
translation_notes:
  register: Français international moderne, clair et digne. « Suivre leurs propres voies » maintient la métaphore biblique sans employer la tournure moins naturelle « marcher dans leurs voies ».
