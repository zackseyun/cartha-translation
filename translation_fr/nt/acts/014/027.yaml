id: ACT.14.27
reference: Acts 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: fr
  text: À leur arrivée, ils réunirent l’Église et rapportèrent tout ce que Dieu avait fait avec eux[a], et qu’il avait ouvert aux non-Juifs[b] une porte vers la foi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « tout ce que Dieu avait fait par leur intermédiaire ». Le grec dit plus littéralement : « avec eux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aux nations ». Ici, le terme grec désigne les peuples non juifs.'
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « une porte de foi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: À leur arrivée
  rationale: Cette tournure française naturelle rend la circonstance temporelle exprimée par le participe aoriste, antérieure à la réunion de l’Église.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: ils réunirent l’Église
  rationale: Le verbe exprime la convocation de l’assemblée chrétienne locale. « Église » conserve le terme consacré dans les Actes, tandis que « réunirent » évite la redondance de « rassemblèrent ensemble ».
- source_word: ἀνήγγελλον
  choice: racontèrent
  rationale: Dans ce contexte, le verbe désigne le compte rendu détaillé de la mission. « Racontèrent » est courant et naturel, tout en gardant l’idée de faire connaître les événements.
- source_word: ὅσα
  choice: tout ce que
  rationale: Équivalent idiomatique du relatif grec neutre pluriel introduisant l’ensemble des actions rapportées.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: Dieu avait fait avec eux
  rationale: « Avec eux » conserve directement μετά avec le génitif et maintient Dieu comme sujet de l’action, sans imposer la nuance instrumentale possible de « par leur intermédiaire ».
- source_word: ἤνοιξεν
  choice: il avait ouvert
  rationale: Le plus-que-parfait situe naturellement cette action divine accomplie avant le compte rendu des missionnaires.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans le contexte narratif des Actes, le terme désigne les peuples autres qu’Israël. « Non-Juifs » est immédiatement compréhensible en français moderne et rend explicitement cette opposition contextuelle.
- source_word: θύραν πίστεως
  choice: une porte vers la foi
  rationale: Cette formulation conserve la métaphore de la porte et exprime naturellement en français l’accès à la foi, sans introduire un article défini absent du grec. Une note fournit la formulation plus littérale.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le sens contextuel naturel de πίστις et convient à l’accueil croyant du message.
theological_decisions:
- issue: Sens de μετ’ αὐτῶν dans la description de l’action de Dieu
  choice: Dieu avait fait avec eux
  alternative: Dieu avait fait par leur intermédiaire
  rationale: La formulation retenue préserve la préposition grecque et l’association des missionnaires à l’œuvre divine sans transformer implicitement cette association en causalité instrumentale.
- issue: Référent de ἔθνεσιν
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contexte concerne l’accueil de personnes non juives plutôt que des entités politiques. La note conserve toutefois le sens lexical plus littéral « nations ».
- issue: Rapport exprimé par le génitif dans θύραν πίστεως
  choice: une porte vers la foi
  alternative: une porte de foi
  rationale: Le génitif grec reste sémantiquement compact. Le texte principal emploie un français intelligible sans développer davantage le rapport entre la porte et la foi; la note signale la forme littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit, tandis que « à leur arrivée », « non-Juifs » et « vers la foi » assurent une lecture naturelle. Les métaphores et les ambiguïtés théologiques réelles sont conservées ou signalées en note.
