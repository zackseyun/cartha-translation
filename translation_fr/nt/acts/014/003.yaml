id: ACT.14.3
reference: Acts 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: fr
  text: Ils restèrent donc là assez longtemps, parlant avec assurance en s’appuyant sur le Seigneur[a], qui rendait témoignage à la parole de sa grâce en accordant que des signes et des prodiges soient accomplis par leurs mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parlant avec assurance pour le Seigneur » ou « dans le Seigneur ». La préposition grecque peut indiquer que leur assurance avait son fondement dans le Seigneur, s’exerçait en relation avec lui ou était mise à son service.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: assez longtemps
  rationale: Cette tournure française naturelle exprime une durée notable sans la quantifier ni l’exagérer.
- source_word: διέτριψαν
  choice: ils restèrent là
  rationale: Le verbe indique qu’ils passèrent du temps ou demeurèrent dans ce lieu; « restèrent là » convient au récit.
- source_word: παρρησιαζόμενοι
  choice: parlant avec assurance
  rationale: Le participe décrit une parole ouverte et courageuse; « avec assurance » rend naturellement cette hardiesse en français.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: en s’appuyant sur le Seigneur
  rationale: Avec ce verbe, ἐπί suivi du datif peut marquer le fondement ou l’appui de leur assurance. La note conserve les autres nuances possibles.
- source_word: τῷ κυρίῳ
  choice: le Seigneur
  rationale: Le texte grec ne précise pas davantage le titre; la traduction évite donc d’ajouter explicitement « Jésus » ou « Dieu ».
- source_word: τῷ μαρτυροῦντι
  choice: qui rendait témoignage
  rationale: L’imparfait et la relative rendent l’action continue du participe présent ainsi que sa nuance testimoniale.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: à la parole de sa grâce
  rationale: 'Cette formulation conserve la construction grecque et laisse ouverte la relation exacte entre la parole et la grâce: parole caractérisée par la grâce ou message qui l’annonce.'
- source_word: χάριτος
  choice: grâce
  rationale: « Grâce » garde ici la portée théologique habituelle de χάρις dans Luc-Actes.
- source_word: διδόντι
  choice: en leur donnant d’accomplir
  rationale: Cette expression naturelle présente le Seigneur comme celui qui accorde la capacité d’accomplir ces œuvres.
- source_word: σημεῖα καὶ τέρατα
  choice: des signes et des prodiges
  rationale: Cette paire traditionnelle et intelligible préserve à la fois la valeur attestatrice et le caractère extraordinaire des actes.
- source_word: γίνεσθαι
  choice: d’accomplir
  rationale: Dans la construction française retenue, l’infinitif exprime la réalisation effective des signes et prodiges, rendue possible par le Seigneur.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: de leurs mains
  rationale: La formulation conserve l’image concrète des mains tout en indiquant que les missionnaires sont les instruments de l’action accordée par le Seigneur.
theological_decisions:
- issue: Référent du titre « le Seigneur »
  choice: Conserver simplement « le Seigneur »
  alternative: Préciser « le Seigneur Jésus » ou comprendre explicitement « Dieu »
  rationale: Le grec porte seulement τῷ κυρίῳ. Ne pas préciser davantage respecte la formulation source tout en laissant le contexte narratif éclairer le référent.
- issue: Valeur de ἐπὶ τῷ κυρίῳ
  choice: « en s’appuyant sur le Seigneur » dans le texte principal
  alternative: « pour le Seigneur » ou « dans le Seigneur »
  rationale: La préposition peut évoquer le fondement, la sphère ou l’orientation de leur assurance. Le texte principal exprime clairement l’idée d’appui, tandis que la note préserve l’ambiguïté réelle.
- issue: Agent des signes et prodiges
  choice: Le Seigneur donne aux missionnaires de les accomplir de leurs mains
  alternative: Les signes et prodiges se produisent par leurs mains
  rationale: La formulation française rend l’octroi exprimé par διδόντι et l’instrumentalité de διὰ τῶν χειρῶν αὐτῶν, sans faire des missionnaires la source autonome de ces actes.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure continue du grec tout en employant des tournures naturelles. « Parole de sa grâce » maintient la densité théologique et l’ambiguïté du génitif; la note explicite sans trancher les nuances de ἐπὶ τῷ κυρίῳ.
