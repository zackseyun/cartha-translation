  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: fr
  text: Quand ils s’en rendirent compte[a], ils se réfugièrent dans les villes de Lycaonie — Lystre et Derbe — ainsi que dans la région environnante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand ils comprirent la situation » ou « Quand ils en prirent conscience ». Le participe grec indique qu’ils ont pris conscience du danger décrit au verset précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Quand ils s’en rendirent compte
  rationale: Le participe aoriste de συνοράω exprime ici la prise de conscience de la menace rapportée au verset précédent. Le pronom « en » reprend naturellement cette situation sans l’expliciter davantage.
- source_word: κατέφυγον
  choice: ils se réfugièrent
  rationale: καταφεύγω désigne le fait de fuir vers un lieu sûr ou d’y chercher refuge. « Se réfugièrent » conserve à la fois le mouvement de fuite et la recherche de protection.
- source_word: εἰς
  choice: dans
  rationale: Avec un verbe de mouvement, εἰς indique la destination. En français, « se réfugier dans une ville ou une région » est la tournure naturelle.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: les villes de Lycaonie
  rationale: Cette formulation respecte le génitif régional et prépare l’identification en apposition de Lystre et Derbé.
- source_word: Λύστραν καὶ Δέρβην
  choice: Lystre et Derbé
  rationale: Formes françaises usuelles de ces noms de lieux, placées en apposition à « les villes de Lycaonie ».
- source_word: τὴν περίχωρον
  choice: la région environnante
  rationale: περίχωρος employé substantivement désigne le territoire autour des villes nommées, qu’il soit urbain ou rural.
- source_word: καὶ ... καὶ
  choice: — Lystre et Derbé — ainsi que
  rationale: Les tirets rendent claire l’apposition, tandis que « ainsi que » marque naturellement l’ajout de la région environnante.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Se réfugièrent » reflète plus précisément la nuance de καταφεύγω que le simple « s’enfuirent », tout en restant courant. Le passé simple convient au registre narratif biblique sans être archaïque.
