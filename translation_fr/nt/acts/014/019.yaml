  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: fr
  text: Mais des Juifs arrivèrent d’Antioche et d’Iconium. Ils persuadèrent les foules, puis lapidèrent Paul et le traînèrent hors de la ville, le croyant mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pensant qu’il avait succombé ». Le grec rapporte leur supposition sans affirmer explicitement que Paul était réellement mort.
    reason: Préciser la portée de νομίζοντες et préserver l’ambiguïté théologique du récit.
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: Mais … arrivèrent
  rationale: Le verbe exprime ici l’arrivée d’opposants venus d’autres villes, tandis que δέ marque le contraste avec l’accueil favorable précédent. Cette formulation est naturelle et conserve le tournant narratif.
- source_word: Ἰουδαῖοι
  choice: des Juifs
  rationale: Dans ce contexte, le terme désigne des opposants juifs venus d’Antioche et d’Iconium, non spécifiquement des habitants de Judée.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Ils gagnèrent les foules à leur cause
  rationale: Cette expression rend la persuasion effective et hostile dans le contexte, tout en conservant le pluriel de ὄχλους et l’antériorité de l’action.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: puis lapidèrent Paul
  rationale: Le participe coordonné indique une action accomplie avant que Paul soit traîné hors de la ville. « Lapider » est le terme français précis et courant.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: le traînèrent hors de la ville
  rationale: La formulation restitue directement la violence de σύρω et le déplacement vers l’extérieur de la ville.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: pensant qu’il était mort
  rationale: Le participe rapporte l’appréciation des agresseurs, et le parfait infinitif présente Paul dans l’état résultant qu’ils lui attribuaient. Le français est naturel sans transformer cette supposition en fait narré.
theological_decisions:
- issue: Le texte affirme-t-il que Paul est réellement mort, ou rapporte-t-il seulement ce que pensaient ses agresseurs ?
  choice: 'La traduction rapporte uniquement leur perception : « pensant qu’il était mort ».'
  alternative: « pensant qu’il était décédé » ou « croyant qu’il avait succombé » ; certains interprètes concluent que Paul était effectivement mort.
  rationale: Le grec emploie νομίζοντες pour signaler leur supposition et n’affirme pas directement la mort réelle de Paul. La traduction préserve cette limite et la tension du récit.
translation_notes:
  register: Français international moderne, narratif et digne. « Gagner les foules à leur cause » explicite naturellement l’effet de la persuasion sans ajouter de mobile. Le découpage en deux phrases évite une accumulation lourde de participes tout en conservant l’ordre des actions.
