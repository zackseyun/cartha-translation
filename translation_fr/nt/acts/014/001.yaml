  source_fidelity: 'Le sens global est fidèle au grec : l''action conjointe, l''entrée dans la synagogue, la manière de parler et le résultat de foi sont bien rendus. « Une foule nombreuse » peut toutefois évoquer en français un rassemblement physiquement présent, tandis que πολύ πλῆθος désigne ici plus simplement un grand nombre de personnes.'
  naturalness: Le français est clair et d'un registre narratif approprié. « Un grand nombre » est plus idiomatique et plus précis que « une foule nombreuse » dans cette construction. Le renvoi de note est placé directement après le syntagme qu'il documente, avant le point final.
  terminology: « Iconium », « synagogue des Juifs », « Juifs », « Grecs » et « crurent » sont recevables et conservent les termes et la concision du texte source. La note présente correctement l'alternative « synagogue juive » sans imposer une interprétation supplémentaire.
