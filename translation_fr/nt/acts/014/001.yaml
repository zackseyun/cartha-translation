  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: fr
  text: À Iconium, ils entrèrent ensemble dans la synagogue des Juifs[a] et parlèrent de telle manière qu’un grand nombre de Juifs et de Grecs crurent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la synagogue juive ». Le grec dit littéralement « dans la synagogue des Juifs ».
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: construction narrative non exprimée séparément
  rationale: Cette formule introduit la suite du récit. En français, la rendre par « il arriva que » serait pesant, et aucun adverbe temporel explicite tel que « alors » ou « maintenant » ne figure dans le grec.
- source_word: ἐν Ἰκονίῳ
  choice: À Iconium
  rationale: Le français emploie naturellement « à » devant un nom de ville.
- source_word: κατὰ τὸ αὐτό
  choice: ensemble
  rationale: Dans ce contexte, l’expression indique le caractère conjoint de l’action de Paul et Barnabas.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: ils entrèrent
  rationale: L’infinitif dépend de la construction narrative ἐγένετο δέ ; une forme verbale personnelle est naturelle en français.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: dans la synagogue des Juifs
  rationale: Cette formulation conserve explicitement le génitif τῶν Ἰουδαίων tout en restant idiomatique en français.
- source_word: λαλῆσαι
  choice: parlèrent
  rationale: Rendu direct et non interprétatif du verbe dans ce contexte de proclamation.
- source_word: οὕτως ὥστε
  choice: de telle manière que
  rationale: Cette tournure préserve à la fois l’idée de manière et le résultat qui s’ensuit.
- source_word: πιστεῦσαι
  choice: crurent
  rationale: Le verbe décrit simplement la réponse à la proclamation sans expliciter un complément absent du texte grec.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: de Juifs et de Grecs
  rationale: La coordination τε καὶ réunit explicitement les deux groupes.
- source_word: πολὺ πλῆθος
  choice: une foule nombreuse
  rationale: Cette expression restitue l’idée d’un groupe considérable sans employer le mot « multitude », plus soutenu et moins courant.
theological_decisions:
- issue: Sens de πιστεῦσαι dans ce récit de conversion
  choice: crurent
  alternative: vinrent à la foi ; crurent au message
  rationale: Le grec ne précise pas ici le complément de la foi. « Crurent » maintient cette concision et évite d’ajouter une interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste proche de la structure grecque tout en évitant une reprise artificielle de Ἐγένετο δὲ.
