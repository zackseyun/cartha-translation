  text: καὶ ταῦτα λέγοντες μόλις κατέπαυσαν τοὺς ὄχλους τοῦ μὴ θύειν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: fr
  text: Malgré ces paroles, ils parvinrent à grand-peine à empêcher les foules de leur offrir des sacrifices.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Même en disant cela
  rationale: 'Dans ce contexte, καί a une valeur intensive ou concessive : malgré leurs paroles, les apôtres réussissent tout juste à arrêter les foules.'
- source_word: μόλις κατέπαυσαν
  choice: ils eurent beaucoup de mal à empêcher
  rationale: μόλις exprime une réussite obtenue de justesse ou avec grande difficulté ; cette tournure française naturelle conserve les deux nuances possibles.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel du grec est conservé.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: de leur offrir des sacrifices
  rationale: θύειν désigne ici l'acte cultuel de sacrifier ; « offrir des sacrifices » est clair et idiomatique, et αὐτοῖς renvoie aux apôtres pris pour des dieux.
theological_decisions:
- issue: La foule veut rendre un culte sacrificiel à Barnabé et Paul
  choice: de leur offrir des sacrifices
  alternative: de sacrifier pour eux
  rationale: « Leur offrir des sacrifices » rend explicitement la direction cultuelle indiquée par le datif αὐτοῖς, sans ajouter d'interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation souligne que les paroles des apôtres suffirent tout juste à arrêter l'action projetée, sans alourdir la phrase.
