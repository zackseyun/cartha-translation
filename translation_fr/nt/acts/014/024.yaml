  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: fr
  text: Après avoir traversé la Pisidie, ils arrivèrent en Pamphylie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: Après avoir traversé
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure restitue clairement et naturellement la succession des déplacements.
- source_word: τὴν Πισιδίαν
  choice: la Pisidie
  rationale: Nom traditionnel de cette région en français, avec l’article défini requis dans cet emploi.
- source_word: ἦλθον
  choice: ils arrivèrent
  rationale: Dans ce récit de voyage, ἔρχομαι suivi d’une destination indique qu’ils atteignirent le lieu. « Arrivèrent » est idiomatique en français et évite le choix déictique entre « vinrent » et « allèrent ».
- source_word: εἰς τὴν Παμφυλίαν
  choice: en Pamphylie
  rationale: εἰς marque le mouvement vers l’intérieur d’une région. Devant ce nom régional féminin, « en » exprime naturellement en français le déplacement jusqu’en Pamphylie.
- source_word: καὶ
  choice: Après
  rationale: La coordination grecque est intégrée à la subordination temporelle française. Ajouter « Et » produirait ici une phrase plus lourde, tandis que la continuité narrative reste perceptible dans le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. Les noms géographiques suivent les formes françaises traditionnelles.
