  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: fr
  text: 'Il dit d’une voix forte : « Mets-toi debout, droit sur tes pieds ! » Alors l’homme bondit et se mit à marcher.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bondit et marchait » ; l’imparfait grec peut souligner l’action en cours ou le commencement de la marche.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: d’une voix forte
  rationale: Le datif exprime la manière. Cette tournure idiomatique rend clairement le volume et le caractère public de la parole.
- source_word: Ἀνάστηθι ἐπὶ τοὺς πόδας σου ὀρθός
  choice: Mets-toi debout, bien droit sur tes pieds !
  rationale: L’impératif commande à l’homme de se lever et de se tenir droit. « Mets-toi debout » est naturel en français moderne, tandis que « bien droit sur tes pieds » préserve l’insistance de ὀρθός sans raideur excessive.
- source_word: ἥλατο
  choice: bondit
  rationale: Le verbe ἅλλομαι décrit un mouvement soudain et vif. « Bondit » conserve la force visuelle de la réaction immédiate.
- source_word: περιεπάτει
  choice: se mit à marcher
  rationale: L’imparfait grec peut présenter une action en cours ou son commencement dans ce contexte. Cette formulation naturelle met en relief le début immédiat de la marche après le bond.
theological_decisions:
- issue: Langage du miracle et ordre portant sur la posture
  choice: Présenter simplement l’ordre physique et la réaction immédiate de l’homme
  alternative: Expliciter la cause divine ou ajouter une interprétation théologique de la guérison
  rationale: Le grec rapporte concrètement une parole suivie d’une action visible. La traduction conserve cette immédiateté sans ajouter au texte de précision doctrinale.
- issue: Valeur aspectuelle de περιεπάτει
  choice: se mit à marcher
  alternative: marchait
  rationale: L’imparfait permet ici une lecture inchoative ou progressive. Le texte principal retient la valeur inchoative adaptée à la succession narrative, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite l’archaïsme de « lève-toi droit sur tes pieds » tout en conservant l’insistance du grec sur la posture droite et la vivacité de la guérison.
