id: ACT.14.4
reference: Acts 14:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: fr
  text: 'Mais la population de la ville se divisa[a] : les uns étaient du côté des Juifs, les autres du côté des apôtres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut divisée » ou « fut scindée ».
    reason: Alternative lexicale conservant plus littéralement la forme passive de ἐσχίσθη.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: se divisa
  rationale: Le passif grec signifie littéralement « fut divisée » ou « fut scindée ». Le pronominal français « se divisa » exprime naturellement la division de la population en deux camps sans modifier le sens.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: la population de la ville
  rationale: πλῆθος désigne ici largement les habitants concernés de la ville, plutôt qu’une foule ponctuellement rassemblée. « La population de la ville » est naturel et garde la valeur collective du singulier grec.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une légère opposition ou un nouveau développement par rapport au verset précédent ; « Mais » fait bien ressortir le contraste produit par les réactions divergentes.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: les uns ... les autres
  rationale: Cette tournure corrélative française reproduit clairement et naturellement la répartition en deux groupes exprimée par le grec.
- source_word: σὺν
  choice: du côté de
  rationale: σύν indique l’association. Dans ce contexte de division civique, « du côté de » rend explicitement l’alignement des deux camps sans aller jusqu’à préciser une forme particulière de soutien.
- source_word: Ἰουδαίοις
  choice: les Juifs
  rationale: Rien dans le verset ne limite le référent aux seuls dirigeants juifs. La désignation directe « les Juifs » conserve donc la portée du texte.
- source_word: ἀποστόλοις
  choice: les apôtres
  rationale: Le terme consacré « apôtres » traduit directement ἀπόστολοι et correspond à la désignation que Luc applique à Barnabas et Paul en Actes 14.14.
theological_decisions:
- issue: Référence de « les apôtres »
  choice: Conserver « les apôtres » comme désignation narrative de Barnabas et Paul.
  alternative: Traduire plus généralement par « les envoyés » ou « les messagers ».
  rationale: Luc appelle explicitement Barnabas et Paul « les apôtres » plus loin dans le chapitre (Actes 14.14). La traduction directe préserve son vocabulaire sans imposer au terme une définition doctrinale plus étroite que celle du passage.
translation_notes:
  register: Français international moderne, digne et accessible. « Population » évite l’ambiguïté de « foule », tandis que les deux-points rendent clairement la division bipartite explicitée dans la seconde proposition.
