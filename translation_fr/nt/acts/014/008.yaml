source:
  edition: SBLGNT
  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: fr
  text: À Lystres, un homme qui n’avait aucune force dans les pieds[a] était assis ; boiteux depuis le ventre de sa mère, il n’avait jamais marché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans force dans les pieds ». Le grec souligne d’abord l’absence de force avant de préciser que l’homme était boiteux.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: À Lystres
  rationale: Le simple connecteur grec poursuit le récit, mais il n’est pas nécessaire de le rendre par « Et » en français moderne lorsque le complément de lieu ouvre naturellement la nouvelle scène.
- source_word: τις ἀνὴρ
  choice: un homme
  rationale: L’article indéfini français exprime naturellement qu’il s’agit d’un homme particulier mais non nommé; « un certain homme » serait plus marqué et moins naturel ici.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: sans force dans les pieds
  rationale: Cette formulation conserve l’idée première d’absence de force exprimée par ἀδύνατος, sans la confondre avec χωλός, qui précise ensuite que l’homme était boiteux.
- source_word: ἐν Λύστροις
  choice: À Lystres
  rationale: Forme française traditionnelle et courante du nom de lieu; la préposition « à » convient à une ville.
- source_word: ἐκάθητο
  choice: était assis
  rationale: L’imparfait grec présente un état en cours et plante le décor; l’imparfait français en rend naturellement la valeur.
- source_word: χωλὸς
  choice: Boiteux
  rationale: Terme français précis et neutre qui maintient la seconde étape de la description physique.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: dès le ventre de sa mère
  rationale: Préserve l’image concrète de l’expression grecque tout en indiquant que son état remontait à avant sa naissance.
- source_word: ὃς οὐδέποτε περιεπάτησεν
  choice: il n’avait jamais marché
  rationale: Le plus-que-parfait exprime naturellement qu’à ce moment du récit il n’avait marché à aucune période de sa vie.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase est divisée en deux pour éviter une longue accumulation tout en conservant la progression de la description grecque : absence de force, état boiteux congénital, puis incapacité permanente à marcher.'
