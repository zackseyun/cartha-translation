  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: fr
  text: Mais les Juifs qui avaient refusé de croire[a] excitèrent les non-Juifs et aigrirent leurs esprits[b] contre les frères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui avaient désobéi » ou « qui avaient été rebelles ». Dans ce contexte, le grec peut désigner le refus de croire au message, avec l’idée de refuser de s’y soumettre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leurs âmes » ; le terme désigne ici leur disposition ou leur attitude intérieure.
    reason: lexical_alternative
  - marker: c
    text: Ici, « les frères » désigne vraisemblablement l’ensemble des croyants, y compris les femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: qui refusaient de croire
  rationale: Dans ce contexte d’annonce à la synagogue, le verbe exprime le refus de croire au message, tout en gardant la dimension volontaire que peut porter le grec.
- source_word: Ἰουδαῖοι
  choice: les Juifs
  rationale: Le terme désigne ici les Juifs du lieu qui s’opposaient au message, et non l’ensemble du peuple juif; le contexte délimite naturellement le groupe.
- source_word: ἐπήγειραν
  choice: soulevèrent
  rationale: Ce verbe français rend de façon concise l’idée d’exciter un groupe à l’hostilité.
- source_word: ἐκάκωσαν τὰς ψυχὰς
  choice: les dressèrent intérieurement
  rationale: La construction grecque décrit l’altération hostile des dispositions intérieures. Cette formulation française exprime l’effet sans traduire ψυχή par un terme anthropologique technique.
- source_word: τῶν ἐθνῶν
  choice: les non-Juifs
  rationale: Dans l’opposition narrative entre Juifs et ἔθνη, le sens est celui des populations non juives. « Non-Juifs » est immédiatement compréhensible en français courant.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: contre les frères
  rationale: « Frères » correspond formellement au masculin pluriel grec et désigne vraisemblablement ici les membres de la communauté croyante dans leur ensemble.
theological_decisions:
- issue: Portée de ἀπειθήσαντες
  choice: qui refusaient de croire
  alternative: qui désobéissaient / qui étaient rebelles
  rationale: Le contexte immédiat concerne l’accueil ou le rejet de la proclamation. La traduction explicite cette valeur contextuelle sans réduire le mot grec à une simple absence de conviction.
- issue: Portée collective de ἀδελφῶν
  choice: les frères
  alternative: les frères et sœurs / les croyants
  rationale: Le texte principal conserve la forme masculine du grec, tandis qu’une note précise que l’expression peut englober l’ensemble des croyants, femmes comprises.
translation_notes:
  register: Français international moderne, digne et accessible. « Soulevèrent » garde la vigueur de l’action hostile; « les dressèrent intérieurement » restitue l’idiome grec portant sur les dispositions profondes sans employer le calque ambigu « rendirent leurs âmes mauvaises ».
