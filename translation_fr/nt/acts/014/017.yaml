id: ACT.14.17
reference: Acts 14:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: fr
  text: Pourtant, il ne s’est pas laissé sans témoignage[a], en faisant le bien, en vous donnant des pluies du ciel et des saisons fécondes[b], en remplissant vos cœurs de nourriture et de joie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sans témoin » : le grec souligne que Dieu ne s’est pas laissé sans témoignage à son sujet.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les temps qui portent du fruit ».
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits portent « nos cœurs » ; le texte grec retenu ici porte « vos cœurs ».
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Pourtant
  rationale: Rend naturellement la valeur concessive qui relie ce verset à l’affirmation précédente.
- source_word: οὐκ ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: il ne s’est pas laissé sans témoignage
  rationale: Conserve la tournure réflexive et la nuance testimoniale du grec, tout en restant compréhensible en français courant.
- source_word: ἀγαθουργῶν
  choice: il vous a fait du bien
  rationale: Exprime clairement l’action bienfaisante de Dieu; le complément « vous » est tiré de la proposition participiale suivante et évite une formulation française raide.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: en vous donnant du ciel les pluies
  rationale: Préserve le pluriel grec, qui évoque les pluies répétées, ainsi que leur provenance céleste.
- source_word: καιροὺς καρποφόρους
  choice: les saisons fécondes
  rationale: « Saisons » rend καιρούς dans ce contexte agricole, et « fécondes » exprime leur capacité à produire du fruit.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: comblant vos cœurs de nourriture et de joie
  rationale: « Comblant » rend l’idée de remplir pleinement; « vos » suit la leçon du SBLGNT et « joie » est naturel tout en gardant le sens d’allégresse.
theological_decisions:
- issue: La portée du témoignage de Dieu dans la création et la providence
  choice: Dieu rend témoignage de lui-même par ses bienfaits providentiels
  alternative: Le verset ne décrirait que des processus naturels impersonnels
  rationale: Le pronom réfléchi associé à « témoignage » et les participes attribuant à Dieu les pluies, les récoltes, la nourriture et la joie présentent explicitement ces dons comme son témoignage sur lui-même, sans développer au-delà du texte une doctrine systématique.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conserve la concession initiale et la série des bienfaits divins, tout en transformant le premier participe en proposition verbale pour assurer la fluidité. Tous les appels de notes figurent dans le texte.
