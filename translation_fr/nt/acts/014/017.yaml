  naturalness: Le français est globalement naturel et d’un registre biblique moderne. La répétition mesurée de « en » dans la révision rend clairement la série explicative grecque sans alourdir excessivement la phrase.
  terminology: « Témoignage », « pluies du ciel », « saisons fécondes », « nourriture » et « joie » conviennent. « Sans témoignage » est idiomatique dans ce contexte et la note fournit utilement l’alternative plus littérale « sans témoin ».
