id: ACT.14.21
reference: Acts 14:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: fr
  text: Après avoir annoncé la bonne nouvelle dans cette ville et fait de nombreux disciples, ils retournèrent à Lystre, puis à Iconium et à Antioche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: Après avoir annoncé la bonne nouvelle
  rationale: Le participe aoriste exprime ici une action antérieure au retour. « Annoncer la bonne nouvelle » rend le sens évangélisateur de εὐαγγελίζω dans un français actuel et accessible.
- source_word: τε
  choice: intégré à l’enchaînement de la phrase
  rationale: La particule assure une liaison légère avec le contexte et la coordination suivante ; une traduction française distincte alourdirait inutilement la phrase.
- source_word: τὴν πόλιν ἐκείνην
  choice: dans cette ville
  rationale: Le démonstratif renvoie à Derbé dans le contexte ; « cette ville » est direct et naturel.
- source_word: μαθητεύσαντες
  choice: fait de nombreux disciples
  rationale: Le verbe signifie amener des personnes à devenir disciples. La formulation conserve cette valeur active sans employer le néologisme confessionnel « discipler ».
- source_word: ἱκανοὺς
  choice: de nombreux
  rationale: Dans ce contexte, ἱκανός désigne un nombre important de personnes.
- source_word: ὑπέστρεψαν
  choice: ils retournèrent
  rationale: Le verbe principal décrit leur trajet de retour ; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: à Lystre, puis à Iconium et à Antioche
  rationale: « À » rend naturellement la destination. « Puis » explicite sobrement la succession géographique, tandis que les prépositions restent présentes devant chaque toponyme.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe participiale grecque est rendue par « après avoir », et le vocabulaire ecclésial courant « disciples » est conservé. Aucun appel de note n’est nécessaire.
