id: ACT.14.11
reference: Acts 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: fr
  text: 'Quand les foules virent ce que Paul avait fait, elles élevèrent la voix et dirent en lycaonien : « Les dieux, devenus semblables à des êtres humains, sont descendus jusqu’à nous ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Quand les foules virent
  rationale: Le participe aoriste ἰδόντες exprime naturellement la circonstance temporelle de l’action principale. Le pluriel « les foules » conserve celui de ὄχλοι, et la continuité marquée par τε se laisse rendre sans conjonction initiale lourde en français.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: ce que Paul avait fait
  rationale: Le plus-que-parfait situe naturellement l’acte de Paul avant la réaction des foules dans le récit.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: elles élevèrent la voix
  rationale: Cette formulation conserve l’image de l’expression grecque tout en restant idiomatique et dignifiée en français; le singulier collectif « la voix » suit l’idiome source.
- source_word: Λυκαονιστί
  choice: en lycaonien
  rationale: L’adverbe désigne la langue dans laquelle elles parlent; « en lycaonien » est précis, naturel et plus concis que « dans la langue lycaonienne ».
- source_word: λέγοντες
  choice: et dirent
  rationale: La coordination française intègre naturellement le participe de parole à la proposition principale sans modifier son sens.
- source_word: Οἱ θεοὶ
  choice: Les dieux
  rationale: Le pluriel renvoie sans ambiguïté aux divinités païennes évoquées par la foule.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: se sont rendus semblables à des êtres humains
  rationale: Le passif aoriste de ὁμοιόω exprime le fait d’avoir été ou d’être devenu semblable. La tournure pronominale française restitue cette transformation perçue sans introduire le vocabulaire doctrinal de l’incarnation; « êtres humains » rend le sens générique de ἀνθρώποις.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: sont descendus jusqu’à nous
  rationale: Le passé composé convient à l’exclamation vive et à son résultat présent. « Jusqu’à nous » restitue la direction exprimée par πρὸς ἡμᾶς.
theological_decisions:
- issue: Rapporter l’interprétation païenne de la foule sans importer une christologie de l’incarnation
  choice: Les dieux se sont rendus semblables à des êtres humains et sont descendus jusqu’à nous
  alternative: Les dieux, devenus semblables à des êtres humains, sont descendus jusqu’à nous
  rationale: La traduction conserve l’affirmation propre à la foule et la valeur de ressemblance de ὁμοιωθέντες, sans la reformuler en « forme humaine », expression susceptible de préciser excessivement la nature du changement.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde l’enthousiasme de la foule. Aucun marqueur de note n’est requis puisque le texte ne comporte aucune note.
