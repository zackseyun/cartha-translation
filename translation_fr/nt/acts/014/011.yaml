review_pass:
  verdict: revise
  source_fidelity: La structure temporelle, le pluriel de « foules », l’idiome « élever la voix », le lycaonien et la descente « vers nous » sont bien rendus. Toutefois, « se sont rendus semblables » donne aux dieux le rôle actif de se rendre eux-mêmes semblables, alors que le participe grec aoriste passif ὁμοιωθέντες présente leur assimilation aux humains comme subie ou comme un état résultant, sans en préciser l’agent.
  naturalness: Le français est globalement clair et d’un registre approprié. « Devenus semblables à des êtres humains » est plus naturel dans cette exclamation que « se sont rendus semblables à des êtres humains », tout en évitant d’expliciter une doctrine ou un mécanisme de transformation.
  terminology: « Les dieux » et « en lycaonien » sont exacts. « Êtres humains » rend correctement le sens générique de ἀνθρώποις. La formulation révisée conserve l’ambiguïté du grec sur la manière dont les dieux ont été assimilés aux humains.
  issues:
  - severity: medium
    issue: Voix pronominale active dans « se sont rendus semblables »
    rationale: Cette tournure signifie habituellement que le sujet s’est lui-même rendu semblable. Le grec ὁμοιωθέντες est passif; « devenus semblables » rend l’état résultant sans ajouter un agent ni attribuer explicitement cette action aux dieux.
  revised_text: 'Quand les foules virent ce que Paul avait fait, elles élevèrent la voix et dirent en lycaonien : « Les dieux, devenus semblables à des êtres humains, sont descendus jusqu’à nous ! »'
