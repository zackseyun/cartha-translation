id: ACT.14.23
reference: Acts 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: fr
  text: Après avoir désigné pour eux des anciens dans chaque Église[a], ils prièrent en jeûnant, puis les confièrent au Seigneur en qui ils avaient mis leur foi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir élu pour eux des anciens dans chaque Église ». Le verbe grec peut, dans certains contextes, évoquer un choix par vote ou à main levée; ici, il peut simplement signifier « désigner » ou « nommer ».
    reason: alternative_reading
  - marker: b
    text: Le pronom « les » peut désigner l’ensemble des croyants de ces communautés ou, plus précisément, les anciens qui venaient d’être désignés.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: Après avoir désigné
  rationale: Le verbe exprime ici la sélection ou la nomination. « Désigner » rend ce noyau de sens sans imposer un mode précis de gouvernement ecclésial; l’ancienne association possible avec un vote à main levée est signalée en note.
- source_word: κατ’ ἐκκλησίαν
  choice: dans chaque Église
  rationale: 'κατά avec le singulier a une valeur distributive : l’action a lieu dans chacune des communautés locales.'
- source_word: πρεσβυτέρους
  choice: des anciens
  rationale: Dans ce contexte ecclésial, le terme désigne des responsables reconnus, et non simplement des hommes âgés.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: ils prièrent en jeûnant
  rationale: Cette formulation française naturelle conserve l’association de la prière et du jeûne ainsi que leur antériorité logique par rapport à l’action principale.
- source_word: παρέθεντο
  choice: ils confièrent
  rationale: Le moyen exprime le fait de remettre des personnes aux soins du Seigneur; « confièrent » restitue clairement cette dimension relationnelle.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Le datif indique celui aux soins duquel les personnes sont confiées.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: en qui ils avaient mis leur foi
  rationale: La tournure rend naturellement πιστεύω εἰς et le plus-que-parfait grec, qui situe cette foi avant le moment raconté.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: pour eux ... les
  rationale: Les pronoms sont conservés sans explicitation excessive. Le second renvoie probablement aux croyants ou aux communautés, mais peut aussi être compris comme visant les anciens nouvellement désignés.
theological_decisions:
- issue: Sens de χειροτονήσαντες et mode de désignation des anciens
  choice: désigné des anciens
  alternative: élu des anciens, éventuellement par un vote à main levée
  rationale: Le grec atteste l’idée de choisir ou de nommer, avec une association historique possible au geste de lever la main, mais le verset ne définit pas explicitement la procédure. Le texte principal reste donc neutre, et la possibilité est conservée en note.
- issue: Référent de αὐτοὺς dans « ils les confièrent »
  choice: maintien du pronom, probablement les croyants ou communautés
  alternative: les anciens nouvellement désignés
  rationale: Le contexte plus large porte sur les disciples et les communautés, ce qui favorise le référent collectif; la proximité des anciens rend toutefois l’autre lecture possible. La traduction préserve cette ambiguïté et la note la signale.
translation_notes:
  register: Français international moderne, naturel et digne. « Église » est employé au sens de communauté locale. La phrase distingue clairement les actions préparatoires de l’action principale sans alourdir la syntaxe; le pluriel grec de « jeûnes » est rendu idiomatiquement par « en jeûnant ».
