  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: fr
  text: Cet homme écouta Paul parler. Paul le regarda attentivement et vit qu’il avait la foi pour être guéri[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus largement : « la foi pour être sauvé ». Le verbe grec peut signifier « sauver » ou « guérir » ; ici, le contexte favorise la guérison physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif renvoie précisément à l’homme infirme mentionné au verset précédent; « Cet homme » est naturel et explicite en français.
- source_word: ἤκουσεν
  choice: écoutait
  rationale: Dans ce contexte, le verbe exprime l’attention portée aux paroles de Paul; l’imparfait français s’accorde naturellement avec l’action en cours exprimée par « parler ».
- source_word: τοῦ Παύλου λαλοῦντος
  choice: Paul parler
  rationale: La construction au génitif avec participe présent signifie que l’homme écoutait pendant que Paul parlait; « écoutait Paul parler » est idiomatique en français.
- source_word: ἀτενίσας αὐτῷ
  choice: fixa les yeux sur lui
  rationale: Le verbe indique un regard soutenu et attentif. Cette expression conserve sa force sans la nuance potentiellement hostile de « dévisagea ».
- source_word: ἰδὼν
  choice: voyant
  rationale: Le participe garde le langage concret de la perception tout en permettant ici l’idée d’un discernement.
- source_word: ἔχει πίστιν
  choice: avait la foi
  rationale: Dans ce contexte, πίστις désigne la confiance croyante de l’homme, non sa fidélité; « la foi » reste la formulation française courante et théologiquement non réductrice.
- source_word: τοῦ σωθῆναι
  choice: pour être guéri
  rationale: Le contexte immédiat est la guérison physique d’un homme infirme. La tournure « la foi pour être guéri » conserve le lien syntaxique entre la foi et le résultat envisagé; la portée plus large du verbe grec est signalée en note.
theological_decisions:
- issue: Portée de σωθῆναι dans le récit de guérison
  choice: être guéri
  alternative: être sauvé
  rationale: Le rétablissement physique raconté au verset suivant favorise nettement le sens « guérir », sans exclure la portée plus large que peut avoir le verbe grec. La note préserve cette ambiguïté lexicale et sa possible résonance théologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque étant longue et le relatif ὃς renvoyant à Paul, une nouvelle phrase avec répétition de « Paul » évite une ambiguïté de référent en français. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset 10.
