  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: fr
  text: Ils appelaient Barnabé Zeus et Paul Hermès[a], parce que c’était lui le principal orateur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions anciennes emploient les noms romains « Jupiter » et « Mercure »; le texte grec porte « Zeus » et « Hermès ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « celui qui dirigeait la parole » ou « celui qui prenait la tête pour parler ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: Ils appelaient
  rationale: L’imparfait grec présente l’appellation comme une action en cours ou répétée; l’imparfait français en rend naturellement l’aspect.
- source_word: Δία
  choice: Zeus
  rationale: Le texte grec nomme directement la divinité grecque Zeus; il n’y a pas lieu de lui substituer son équivalent romain Jupiter.
- source_word: Ἑρμῆν
  choice: Hermès
  rationale: Le nom grec est conservé plutôt que remplacé par l’équivalent romain Mercure.
- source_word: ἐπειδὴ
  choice: parce que
  rationale: Cette conjonction exprime clairement la raison pour laquelle la foule identifiait Paul à Hermès.
- source_word: αὐτὸς
  choice: c’était lui
  rationale: La tournure française restitue l’accent porté par le pronom grec sur Paul, par opposition à Barnabé.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: le principal orateur
  rationale: Cette expression idiomatique indique que Paul tenait le premier rôle dans la prise de parole, sans donner à λόγος un sens théologique absent du contexte.
theological_decisions:
- issue: Noms des divinités païennes
  choice: Zeus et Hermès
  alternative: Jupiter et Mercure
  rationale: La traduction suit les noms effectivement employés dans le texte grec, sans importer leurs équivalents romains transmis par certaines traditions de traduction.
- issue: Sens de λόγος dans l’expression ὁ ἡγούμενος τοῦ λόγου
  choice: le principal orateur
  alternative: celui qui dirigeait la parole; celui qui prenait la tête pour parler
  rationale: Dans ce contexte, λόγος désigne la parole ou le discours, non la « Parole » au sens théologique. La formulation retenue exprime le rôle prépondérant de Paul comme porte-parole.
translation_notes:
  register: Français moderne, clair et digne. L’imparfait conserve la progression narrative, tandis que « c’était lui » rend l’insistance du pronom grec. « Principal orateur » est naturel en français courant et évite le calque peu idiomatique « celui qui conduisait la parole ».
