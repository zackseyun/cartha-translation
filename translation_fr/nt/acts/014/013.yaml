id: ACT.14.13
reference: Acts 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: fr
  text: Le prêtre de Zeus, dont le temple se trouvait devant la ville[a], amena des taureaux et des couronnes[b] aux portes ; avec les foules, il voulait offrir un sacrifice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du Zeus qui se trouvait devant la ville » ; il s’agit probablement de Zeus dont le temple ou le sanctuaire était situé devant la ville, sans doute hors de son enceinte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « guirlandes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: Le
  rationale: La tournure relative avec τε poursuit le récit sans qu’un connecteur français explicite soit nécessaire ; commencer directement par le sujet donne une narration naturelle.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: le prêtre de Zeus
  rationale: Ζεύς désigne Zeus, nom grec qu’il convient de conserver plutôt que de lui substituer l’équivalent romain Jupiter.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: dont le temple se trouvait devant la ville
  rationale: La formule rattache vraisemblablement Zeus à son lieu de culte situé devant la ville, probablement hors de son enceinte. Le mot « temple » est explicité pour rendre la phrase intelligible en français, tandis qu’une note conserve la formulation plus littérale et son ambiguïté.
- source_word: ταύρους
  choice: des taureaux
  rationale: ταῦρος désigne directement un taureau, ici destiné au sacrifice.
- source_word: στέμματα
  choice: des couronnes
  rationale: Le terme désigne des couronnes ou guirlandes employées dans une procession sacrificielle. « Couronnes » reste proche du grec ; « guirlandes » est signalé en note.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: aux portes
  rationale: Avec le mouvement exprimé par ἐνέγκας, la préposition indique la destination. Le pluriel de πυλῶνας est conservé.
- source_word: ἐνέγκας
  choice: amena
  rationale: Le participe aoriste décrit l’action préparatoire du prêtre. Une forme verbale coordonnée est plus naturelle en français que « ayant amené ».
- source_word: σὺν τοῖς ὄχλοις
  choice: avec les foules
  rationale: Cette traduction conserve le pluriel grec et indique que le prêtre agit de concert avec les groupes rassemblés.
- source_word: ἤθελεν θύειν
  choice: voulait offrir un sacrifice
  rationale: θέλω avec l’infinitif exprime la volonté ou l’intention, et θύω a ici son sens cultuel d’offrir une victime en sacrifice.
theological_decisions:
- issue: Référent implicite de τοῦ ὄντος πρὸ τῆς πόλεως
  choice: La proposition est rendue comme visant le temple de Zeus situé devant la ville.
  alternative: « le prêtre du Zeus qui se trouvait devant la ville »
  rationale: Le contexte cultuel et l’usage ancien permettent de désigner une divinité par l’emplacement de son sanctuaire. L’ajout explicatif « temple » rend le sens probable naturel en français, sans masquer la construction littérale, conservée en note.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe suit le déroulement narratif grec tout en évitant un participe lourd. Le pluriel « les foules », moins courant mais intelligible, préserve le pluriel du texte source.
