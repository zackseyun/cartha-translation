id: ACT.14.26
reference: Acts 14:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: fr
  text: De là, ils prirent la mer pour Antioche, d’où ils avaient été confiés à la grâce de Dieu en vue de l’œuvre qu’ils avaient accomplie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: De là
  rationale: Rend naturellement le lien narratif et la provenance spatiale sans alourdir la phrase française.
- source_word: ἀπέπλευσαν
  choice: ils prirent la mer
  rationale: Exprime idiomatiquement en français le départ par voie maritime marqué par le verbe grec.
- source_word: εἰς Ἀντιόχειαν
  choice: pour Antioche
  rationale: Après « prendre la mer », « pour » indique naturellement la destination.
- source_word: ὅθεν
  choice: d’où
  rationale: Conserve explicitement la valeur de provenance de l’adverbe grec et le retour au point de départ de la mission.
- source_word: ἦσαν παραδεδομένοι
  choice: ils avaient été confiés
  rationale: Le plus-que-parfait passif rend l’action antérieure; « confiés » conserve l’idée d’avoir été remis aux soins de la grâce divine sans imposer un vocabulaire ecclésiastique spécialisé.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: à la grâce de Dieu
  rationale: Reproduit directement le datif dépendant de « confiés » et préserve le poids théologique de l’expression.
- source_word: εἰς τὸ ἔργον
  choice: en vue de l’œuvre
  rationale: Rend la finalité exprimée par εἰς tout en conservant le terme large « œuvre », sans préciser indûment « mission ».
- source_word: ὃ ἐπλήρωσαν
  choice: qu’ils venaient d’accomplir
  rationale: Dans ce retour à Antioche, la tournure française marque naturellement l’achèvement récent de l’œuvre; « accomplir » couvre ici le sens de mener à son terme.
theological_decisions:
- issue: Nature de l’action antérieure de l’Église d’Antioche envers Paul et Barnabé
  choice: ils avaient été confiés à la grâce de Dieu
  alternative: ils avaient été recommandés à la grâce de Dieu
  rationale: « Confiés » traduit l’idée d’être remis à la garde bienveillante de Dieu sans transformer le passage en formule technique de mandat ou de consécration ecclésiastique.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde explicitement « d’où » afin de préserver le mouvement de retour à Antioche. « Prirent la mer » est plus naturel que le calque « naviguèrent » et indique bien un départ maritime.
