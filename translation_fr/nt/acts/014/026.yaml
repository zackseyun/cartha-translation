    rationale: Le grec ὃ ἐπλήρωσαν emploie l’aoriste et affirme que l’œuvre a été menée à son terme, sans marquer explicitement qu’elle venait tout juste de l’être. Le plus-que-parfait français convient mieux dans cette narration rétrospective.
