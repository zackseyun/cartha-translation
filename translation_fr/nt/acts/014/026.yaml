  source_fidelity: 'Le sens général est fidèlement rendu : le départ maritime, le retour à Antioche, la remise antérieure à la grâce de Dieu et l’achèvement de l’œuvre sont tous conservés. Toutefois, « venaient d’accomplir » introduit une nuance de passé récent qui n’est pas exprimée par l’aoriste ἐπλήρωσαν. « avaient accomplie » rend plus sobrement l’antériorité de l’œuvre achevée par rapport au retour mentionné.'
  naturalness: La formulation est naturelle en français international moderne. « Prirent la mer pour Antioche » et « d’où » sont idiomatiques. La correction proposée évite l’inférence temporelle supplémentaire de « venir de ».
  terminology: « Confiés à la grâce de Dieu » préserve convenablement παραδεδομένοι τῇ χάριτι τοῦ θεοῦ sans imposer le langage technique de « recommandés » ni une interprétation ecclésiologique particulière. « Œuvre » maintient l’ampleur de ἔργον.
