lexical_decisions:
- source_word: διέτριβον
  choice: ils restèrent
  rationale: L’imparfait exprime un séjour qui se prolonge. « Ils restèrent » est naturel en français moderne et conserve cet aspect duratif.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: Cette particule assure ici une transition narrative légère. En français, l’enchaînement est fluide sans connecteur explicite; « et » serait également possible mais plus lourd dans ce verset isolé.
- source_word: χρόνον οὐκ ὀλίγον
  choice: assez longtemps
  rationale: Le grec emploie une litote, littéralement « un temps non négligeable ». « Assez longtemps » en restitue naturellement le sens tout en laissant la note signaler la forme rhétorique originale.
- source_word: σὺν τοῖς μαθηταῖς
  choice: avec les disciples
  rationale: σύν avec le datif signifie directement « avec ». Dans le contexte, « les disciples » désigne naturellement les croyants de la communauté locale.
