  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: fr
  text: 'et disant : « Hommes, pourquoi faites-vous cela ? Nous aussi, nous sommes des êtres humains de même condition que vous. Nous vous annonçons une bonne nouvelle afin que vous vous détourniez de ces choses vaines[a] pour vous tourner vers le Dieu vivant, qui a fait le ciel[b], la terre, la mer et tout ce qui s’y trouve. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « ces choses vaines » renvoie aux réalités religieuses païennes futiles, notamment aux idoles.
    reason: cultural_note
  - marker: b
    text: On pourrait aussi traduire « les cieux ». Le grec emploie ici le singulier dans une formule scripturaire traditionnelle de création.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Hommes
  rationale: Le vocatif masculin pluriel est conservé dans cette adresse directe à la foule, malgré son caractère un peu marqué en français moderne.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: des êtres humains de même condition que vous
  rationale: Cette formulation exprime la condition humaine commune de Paul, Barnabé et leurs auditeurs, plutôt qu’une simple similitude de sentiments.
- source_word: εὐαγγελιζόμενοι ὑμᾶς
  choice: Nous vous annonçons une bonne nouvelle
  rationale: Le participe est rendu par une proposition indépendante naturelle, tout en gardant le sens verbal d’annoncer une bonne nouvelle.
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: de ces choses vaines
  rationale: « Vaines » conserve les idées de futilité, de vacuité et d’inefficacité sans remplacer le terme général grec par le mot plus précis « idoles ».
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: détournez-vous ... pour vous tourner vers le Dieu vivant
  rationale: La construction française explicite les deux orientations du retournement, loin des réalités vaines et vers le Dieu vivant, sans recourir au terme théologiquement chargé « convertir ».
- source_word: ἐποίησεν
  choice: a fait
  rationale: « A fait » correspond directement à ποιέω et garde l’écho de la formule scripturaire de création.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: le ciel, la terre, la mer
  rationale: Le singulier « le ciel » et les trois domaines de la formule de création sont préservés dans un français naturel.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tout ce qui s’y trouve
  rationale: Rendu français idiomatique de la formule globale désignant tout ce qui est dans le ciel, la terre et la mer.
theological_decisions:
- issue: Statut humain de Paul et Barnabé face aux honneurs divins
  choice: Nous aussi, nous sommes des êtres humains de même condition que vous
  alternative: Nous aussi, nous sommes des hommes semblables à vous
  rationale: Le choix souligne sans ambiguïté que les apôtres partagent la condition humaine de la foule et ne sont pas des êtres divins, tout en évitant de réduire ὁμοιοπαθεῖς aux émotions.
- issue: Portée de « ces choses vaines »
  choice: Formulation générale dans le texte, précisée par une note contextuelle
  alternative: ces idoles
  rationale: Le contexte vise le culte païen et le sacrifice projeté, mais le grec emploie une expression plus large qu’un nom explicite pour les idoles.
- issue: Orientation de l’appel
  choice: détournez-vous ... pour vous tourner vers le Dieu vivant
  alternative: revenez au Dieu vivant
  rationale: « Revenez » pourrait suggérer que les auditeurs adoraient auparavant ce Dieu. Le double mouvement choisi rend la construction grecque sans présupposer une relation antérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe restitue l’urgence de la protestation. « Hommes » conserve l’adresse masculine du grec, tandis que « êtres humains » exprime clairement l’humanité commune. Le verset commence par « et disant » afin de respecter le fragment syntaxique fourni et son lien avec le contexte précédent.
