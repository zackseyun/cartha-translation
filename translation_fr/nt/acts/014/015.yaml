  to: 'et disant : « Hommes, pourquoi faites-vous cela ? Nous aussi, nous sommes des êtres humains de même condition que vous. Nous vous annonçons une bonne nouvelle afin que vous vous détourniez de ces choses vaines[a] pour vous tourner vers le Dieu vivant, qui a fait le ciel[b], la terre, la mer et tout ce qui s’y trouve. »'
