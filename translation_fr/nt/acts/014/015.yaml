review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’adresse masculine (« Hommes »), l’affirmation de l’humanité commune, le contraste entre les réalités futiles et le Dieu vivant, ainsi que la formule créatrice. Toutefois, l’impératif « détournez-vous » transforme l’infinitif grec ἐπιστρέφειν, dépendant de « annoncer une bonne nouvelle », en ordre direct. Une formulation de but restitue mieux la relation syntaxique sans affaiblir l’appel.
  naturalness: Le français est globalement moderne, clair et digne. « Des êtres humains de même condition que vous » est naturel et explicite. « Afin que vous vous détourniez ... pour vous tourner » conserve une syntaxe française fluide tout en reflétant le double mouvement du grec.
  terminology: « Choses vaines » est recevable et préserve la généralité de τῶν ματαίων. La note peut préciser le cadre idolâtre sans identifier de façon trop étroite l’expression grecque aux seuls objets cultuels ou au sacrifice projeté. « Le Dieu vivant » et « le ciel, la terre, la mer » sont bien rendus.
  issues:
  - severity: medium
    issue: L’impératif « détournez-vous » ne correspond pas directement à la dépendance de l’infinitif ἐπιστρέφειν après εὐαγγελιζόμενοι.
    rationale: Le texte grec présente l’action de se tourner comme le but ou le contenu visé par l’annonce de la bonne nouvelle, non comme une nouvelle proposition impérative indépendante. « Afin que vous vous détourniez » préserve cette relation.
  - severity: low
    issue: La note a attribué « ces choses vaines » notamment au sacrifice que la foule voulait offrir.
    rationale: Le contexte comprend bien une tentative de sacrifice, mais le grec désigne plus largement des réalités religieuses futiles; préciser les idoles et le culte païen suffit, sans restreindre ou déplacer le référent.
