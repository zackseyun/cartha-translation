  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: fr
  text: Après avoir annoncé la parole à Pergé, ils descendirent à Attalie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: Après avoir annoncé
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. « Après avoir annoncé » est naturel en français et, dans ce contexte missionnaire, rend l’acte de communiquer publiquement le message sans imposer le terme plus technique « proclamer ».
- source_word: τὸν λόγον
  choice: la Parole
  rationale: Dans les Actes, l’expression désigne couramment le message chrétien annoncé. « La Parole » conserve cette formule récurrente sans ajouter « du Seigneur », absent du grec.
- source_word: ἐν Πέργῃ
  choice: à Pergé
  rationale: Avec un nom de ville, le français idiomatique emploie « à », qui rend naturellement ἐν dans ce contexte.
- source_word: κατέβησαν
  choice: ils descendirent
  rationale: Le verbe καταβαίνω indique un déplacement vers le bas, vraisemblablement de Pergé, située à l’intérieur des terres, vers Attalie sur la côte. Le passé simple convient au récit suivi.
- source_word: εἰς Ἀττάλειαν
  choice: à Attalie
  rationale: Avec une ville comme destination, εἰς se rend naturellement en français par « à ».
- source_word: καὶ
  choice: Après avoir… ils
  rationale: La coordination grecque est intégrée à la construction participiale française. Commencer par « Et » serait possible, mais moins fluide ici; le lien narratif demeure clair.
theological_decisions: []
