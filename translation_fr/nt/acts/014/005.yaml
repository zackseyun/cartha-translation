source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: fr
  text: Mais, lorsqu’une tentative fut faite par les non-Juifs[a] et les Juifs, avec leurs chefs, de les maltraiter et de les lapider[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations ». Dans ce contexte, le terme grec désigne vraisemblablement les personnes non juives, par contraste avec les Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « lorsqu’un mouvement », « un élan » ou « un assaut » survint. Le mot grec peut désigner un mouvement hostile soudain; « tentative » indique que les actes de maltraiter et de lapider étaient visés, sans affirmer qu’ils avaient été accomplis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο ὁρμὴ
  choice: Mais comme … se préparaient
  rationale: La tournure rend naturellement l'apparition d'un mouvement hostile orienté vers les actes exprimés par les infinitifs, sans présenter ceux-ci comme déjà accomplis. « Mais » marque sobrement la nouvelle évolution du récit.
- source_word: τῶν ἐθνῶν
  choice: les non-Juifs
  rationale: Dans le contraste avec Ἰουδαίων, le terme désigne les personnes qui ne sont pas juives. « Non-Juifs » est clair en français international courant.
- source_word: τε καὶ Ἰουδαίων
  choice: les non-Juifs et les Juifs
  rationale: La coordination inclut explicitement les deux groupes dans le mouvement hostile.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: avec leurs chefs
  rationale: ἄρχοντες désigne ici des personnes exerçant une autorité. « Chefs » reste naturel sans préciser indûment s'il s'agit d'autorités civiques ou communautaires.
- source_word: ὑβρίσαι
  choice: à les maltraiter
  rationale: Le verbe évoque un traitement outrageant ou violent; « maltraiter » en conserve l'étendue sans le réduire à une insulte verbale.
- source_word: καὶ λιθοβολῆσαι αὐτούς
  choice: et à les lapider
  rationale: « Lapider » est l'équivalent français précis de l'action consistant à attaquer quelqu'un à coups de pierres, sans ajouter explicitement « à mort ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase garde la forme suspendue du verset grec, qui se poursuit au verset suivant. « Se préparaient » privilégie une formulation idiomatique tout en préservant l'inachèvement des actes hostiles.
