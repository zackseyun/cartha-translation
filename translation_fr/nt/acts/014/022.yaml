revisions:
- from: 'Ils affermissaient les disciples intérieurement, les encourageant à demeurer dans la foi[a] et leur disant : « Il nous faut passer par beaucoup de détresses[b] pour entrer dans le royaume de Dieu. »'
  to: 'Ils fortifiaient les disciples, les encourageaient à persévérer dans la foi[a] et leur disaient : « Il nous faut entrer dans le royaume de Dieu en passant par beaucoup de détresses[b]. »'
  rationale: 'La révision retire l’ajout interprétatif « intérieurement », adopte des verbes plus naturels en français moderne et conserve la structure du grec : fortifier les disciples, les exhorter à demeurer dans la foi, puis leur dire la nécessité d’entrer dans le royaume à travers de nombreuses détresses. Les deux notes et leurs ancres sont maintenues.'
