id: ACT.14.22
reference: Acts 14:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: fr
  text: 'Ils fortifiaient les disciples, les encourageaient à persévérer dans la foi[a] et leur disaient : « Il nous faut entrer dans le royaume de Dieu en passant par beaucoup de détresses[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la confiance » ; l’article grec favorise toutefois ici « dans la foi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « beaucoup d’épreuves » ou « beaucoup de tribulations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν
  choice: Ils affermissaient les disciples intérieurement
  rationale: La tournure française naturelle exprime l’affermissement de la personne intérieure sans imposer une anthropologie dualiste que le mot ψυχή n’exige pas ici.
- source_word: παρακαλοῦντες
  choice: les encourageant
  rationale: Dans ce contexte, le verbe associe soutien et exhortation; « encourageant » restitue cette nuance avec clarté.
- source_word: ἐμμένειν τῇ πίστει
  choice: à demeurer dans la foi
  rationale: « Demeurer » rend la persévérance exprimée par ἐμμένειν, tandis que l’article grec favorise ici « la foi », sans exclure entièrement le sens plus général de confiance croyante.
- source_word: διὰ πολλῶν θλίψεων
  choice: passer par beaucoup de détresses
  rationale: La construction « passer par » est idiomatique en français et rend διά avec l’idée d’un chemin marqué par de nombreuses épreuves; « détresses » conserve la gravité de θλῖψις.
- source_word: δεῖ ἡμᾶς
  choice: Il nous faut
  rationale: Cette formulation française conserve la nécessité impersonnelle de δεῖ sans en préciser indûment le fondement théologique.
- source_word: εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: entrer dans le royaume de Dieu
  rationale: Expression française naturelle et traditionnelle qui préserve le mouvement d’entrée ainsi que l’expression βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Sens de πίστις avec l’article
  choice: la foi
  alternative: la confiance; la foi au sens subjectif
  rationale: L’article τῇ favorise une réalité définie et partagée, probablement la foi chrétienne dans laquelle les disciples doivent persévérer, sans transformer le terme en catégorie doctrinale tardive.
- issue: Force de δεῖ
  choice: Il nous faut passer par beaucoup de détresses pour entrer dans le royaume de Dieu
  alternative: Nous devons entrer dans le royaume de Dieu à travers beaucoup de détresses
  rationale: « Il nous faut » maintient la nécessité affirmée par le texte sans expliquer si elle relève d’un décret, d’une condition méritoire ou d’un autre mécanisme théologique.
- issue: Rapport entre les détresses et l’entrée dans le royaume
  choice: passer par beaucoup de détresses pour entrer
  alternative: entrer dans le royaume de Dieu à travers beaucoup de détresses
  rationale: La formulation présente les détresses comme le chemin par lequel les croyants passent, sans suggérer qu’elles méritent ou causent leur entrée dans le royaume.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La traduction évite le calque « affermir les âmes », susceptible d’évoquer en français une séparation anthropologique plus forte que le grec, tout en conservant l’idée d’un affermissement intérieur. Les participes sont intégrés dans une phrase narrative claire, et le discours rapporté est rendu directement.
