review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu, y compris la nécessité exprimée par δεῖ et le parcours « à travers » les θλίψεις. Toutefois, « intérieurement » ajoute une explicitation absente du grec : ψυχάς désigne ici les disciples eux-mêmes dans leur vie personnelle, sans exiger cette restriction. La formulation finale proposée rend plus directement διά (« en passant par ») sans faire des détresses un moyen méritoire.'
  naturalness: « Affermissaient les disciples intérieurement » est moins naturel et plus interprétatif que nécessaire en français moderne. « Fortifiaient les disciples » et « les encourageaient à persévérer » sont fluides, tout en conservant la force pastorale des participes.
  terminology: « La foi », « royaume de Dieu » et « détresses » sont appropriés. La note sur « confiance » conserve une alternative possible sans imposer une lecture doctrinale. « Persévérer dans la foi » rend idiomatiquement ἐμμένειν τῇ πίστει.
  issues:
  - severity: medium
    issue: « intérieurement » explicite indûment ψυχάς.
    rationale: Le grec parle littéralement des « âmes » des disciples, expression qui peut désigner les personnes dans leur vie profonde, mais l’adverbe français limite le sens à une sphère intérieure et introduit une nuance non formulée.
  - severity: low
    issue: Le lien de διά avec l’entrée peut être exprimé plus nettement.
    rationale: « Passer par beaucoup de détresses pour entrer » est compréhensible, mais peut légèrement suggérer un but ou une condition. « Entrer ... en passant par beaucoup de détresses » garde explicitement l’idée du cheminement à travers les épreuves.
  revised_text: 'Ils fortifiaient les disciples, les encourageaient à persévérer dans la foi[a] et leur disaient : « Il nous faut entrer dans le royaume de Dieu en passant par beaucoup de détresses[b]. »'
  revised_footnotes:
