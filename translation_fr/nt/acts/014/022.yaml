    text: Ou « dans la confiance » ; l’article grec favorise toutefois ici « dans la foi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « beaucoup d’épreuves » ou « beaucoup de tribulations ».
    reason: lexical_alternative
  revision_rationale: 'La révision retire l’ajout interprétatif « intérieurement », adopte des verbes plus naturels en français moderne et conserve la structure du grec : fortifier les disciples, les exhorter à demeurer dans la foi, puis leur dire la nécessité d’entrer dans le royaume à travers de nombreuses détresses. Les deux notes et leurs ancres sont maintenues.'
