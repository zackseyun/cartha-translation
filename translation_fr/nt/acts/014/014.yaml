id: ACT.14.14
reference: Acts 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: fr
  text: 'Mais quand les apôtres Barnabé et Paul apprirent cela, ils déchirèrent leurs vêtements[a], se précipitèrent dans la foule[b] et crièrent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était un signe habituel de douleur, d’horreur ou de protestation indignée, notamment devant un honneur jugé blasphématoire.
    reason: cultural_note
  - marker: b
    text: 'Ou : « bondirent dans la foule ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quand ... apprirent cela
  rationale: Le participe aoriste a ici une valeur temporelle. « Cela » reprend naturellement le projet de sacrifice décrit dans le contexte immédiat.
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste entre l'initiative de la foule et la réaction des apôtres.
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: les apôtres Barnabé et Paul
  rationale: Conserve l'apposition grecque, qui désigne ici explicitement Barnabé et Paul comme apôtres, avec les formes françaises usuelles des noms.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: ils déchirèrent leurs vêtements
  rationale: Rend directement le geste culturel de deuil, d'horreur ou de vive protestation sans l'expliciter dans le corps du texte.
- source_word: ἐξεπήδησαν εἰς τὸν ὄχλον
  choice: se précipitèrent dans la foule
  rationale: Exprime le mouvement soudain et énergique vers l'intérieur de la foule. Le préfixe verbal peut suggérer une sortie brusque, mais le point de départ n'étant pas exprimé, « dans la foule » évite d'ajouter un lieu implicite.
- source_word: κράζοντες
  choice: et crièrent
  rationale: Le participe présent décrit l'action concomitante et sonore. En français narratif, la coordination est naturelle; les deux-points annoncent les paroles du verset suivant.
theological_decisions:
- issue: Désignation de Barnabé et Paul comme « apôtres »
  choice: Conserver « les apôtres Barnabé et Paul »
  alternative: Reformuler « Barnabé et Paul, les apôtres » ou interpréter le titre dans le corps du texte
  rationale: Le grec les identifie directement par ce terme. La traduction maintient cette formulation sans trancher les débats ultérieurs sur l'étendue de l'apostolat.
translation_notes:
  register: Français international moderne, clair et digne. « Vêtements » conserve un registre biblique naturel sans archaïsme; « se précipitèrent » communique l'urgence du mouvement. Tous les marqueurs de note figurent dans le texte.
