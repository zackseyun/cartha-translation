  source_fidelity: 'Le texte rend fidèlement la construction grecque : contraste (« Mais »), réaction des apôtres Barnabé et Paul, déchirure des vêtements, mouvement brusque dans la foule et cri qui introduit les paroles du verset suivant. « Apprirent cela » explicite de façon minimale l’objet contextuellement sous-entendu de ἀκούσαντες, sans modifier le sens. « Se précipitèrent dans la foule » rend bien ἐξεπήδησαν εἰς τὸν ὄχλον et évite d’ajouter un point de départ par « sortirent ».'
  naturalness: Le français est moderne, fluide et de registre biblique naturel. La coordination des verbes au passé simple et les deux-points finaux conviennent à une narration suivie. Les noms et l’apposition « les apôtres Barnabé et Paul » sont clairs et naturels dans ce registre.
  terminology: « Apôtres », « Barnabé », « Paul », « vêtements », « foule » et « crièrent » sont appropriés. La formulation ne restreint ni ne redéfinit le titre d’« apôtres ». Les deux notes sont correctement ancrées et la note lexicale préserve une alternative raisonnable pour ἐξεπήδησαν.
