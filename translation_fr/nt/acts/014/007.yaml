lexical_decisions:
- source_word: κἀκεῖ
  choice: Et là
  rationale: La contraction de καί et ἐκεῖ signifie « et là » ou « là aussi ». « Et là » conserve simplement le lien narratif avec le verset précédent.
- source_word: εὐαγγελιζόμενοι
  choice: annonçaient la bonne nouvelle
  rationale: Le verbe εὐαγγελίζω désigne l’action d’annoncer une bonne nouvelle, ici la Bonne Nouvelle. Cette formulation française actuelle reste proche du sens verbal et évite un terme ecclésiastique plus technique.
- source_word: ἦσαν
  choice: annonçaient (imparfait)
  rationale: Associé au participe présent, l’imparfait ἦσαν forme une tournure périphrastique exprimant une action en cours. L’imparfait français « annonçaient » la rend naturellement.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Bonne nouvelle » privilégie la transparence lexicale, tandis que la note conserve l’équivalent traditionnel « Évangile » et l’autre nuance possible de κἀκεῖ.
