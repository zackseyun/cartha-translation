id: ACT.14.20
reference: Acts 14:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: fr
  text: Mais lorsque les disciples se furent rassemblés autour de lui[a], il se releva[b] et entra dans la ville. Le lendemain, il partit avec Barnabé pour Derbé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les disciples l’avaient entouré » ou « les disciples avaient formé un cercle autour de lui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se leva ». Le grec peut être traduit ainsi, mais il décrit probablement ici le fait que Paul se remet physiquement debout, sans désigner explicitement une résurrection.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: se furent rassemblés autour de lui
  rationale: Le participe aoriste de κυκλόω exprime l’idée d’entourer ou de former un cercle autour de quelqu’un. Cette formulation est naturelle en français et, contrairement à « encercler », n’évoque pas nécessairement une intention hostile.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition avec la scène précédente, où Paul a été lapidé puis traîné hors de la ville.
- source_word: τῶν μαθητῶν
  choice: les disciples
  rationale: « Disciples » est le terme français établi pour μαθηταί et convient au contexte des Actes.
- source_word: ἀναστὰς
  choice: il se releva
  rationale: Le participe de ἀνίστημι décrit naturellement le fait que Paul se remet debout. « Se releva » préserve le sens physique sans affirmer explicitement une résurrection.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: entra dans la ville
  rationale: Cette traduction concise et idiomatique conserve le mouvement vers l’intérieur exprimé par εἰσέρχομαι avec εἰς.
- source_word: τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Formulation française courante pour cette expression temporelle signifiant « le jour suivant ».
- source_word: ἐξῆλθεν
  choice: il partit
  rationale: Dans ce contexte de déplacement vers Derbé, « partit » rend naturellement la sortie et le départ, sans lourdeur.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: avec Barnabé
  rationale: σύν avec le datif indique simplement l’accompagnement.
- source_word: Δέρβην
  choice: Derbé
  rationale: Forme française traditionnelle et courante du nom de cette ville biblique.
theological_decisions:
- issue: Le participe ἀναστὰς suggère-t-il une résurrection ou une intervention miraculeuse explicite ?
  choice: il se releva
  alternative: il ressuscita ; il fut relevé
  rationale: Le contexte rend le rétablissement de Paul remarquable, mais le participe signifie couramment se lever ou se relever et n’affirme pas à lui seul une résurrection. La traduction conserve donc la retenue du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La narration reste concise. « Se releva » convient à la situation physique de Paul tout en évitant d’ajouter une affirmation théologique que le grec ne formule pas explicitement.
