  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: fr
  text: 'Alors Joseph envoya chercher Jacob, son père, ainsi que toute sa parenté[a] : soixante-quinze personnes en tout.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains passages de l’Ancien Testament donnent un total de « soixante-dix » (par exemple, le texte hébreu de Genèse 46.27 et d’Exode 1.5) ; ici, les Actes indiquent « soixante-quinze ».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας δὲ
  choice: Alors Joseph envoya chercher
  rationale: Le participe aoriste suivi du verbe principal marque ici une étape du récit et le moyen par lequel Joseph fit venir les siens. « Alors » rend la progression narrative de δὲ, et « envoya chercher » exprime naturellement l'action en français.
- source_word: μετεκαλέσατο
  choice: envoya chercher
  rationale: Le verbe moyen signifie appeler ou faire venir quelqu'un, souvent en envoyant le chercher. En français courant, « envoya chercher » restitue ce sens sans la nuance autoritaire que pourrait suggérer « convoqua ».
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: Jacob, son père
  rationale: L'apposition grecque est rendue clairement et naturellement par une apposition française entre virgules.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: toute sa parenté
  rationale: συγγένεια désigne l'ensemble des personnes apparentées. « Parenté » conserve cette portée collective et évite de réduire le groupe à la famille immédiate.
- source_word: ἐν ψυχαῖς
  choice: personnes en tout
  rationale: Littéralement « en âmes », cette tournure sert ici à dénombrer des êtres humains. « Personnes en tout » transmet l'idiome sans introduire une emphase anthropologique étrangère au contexte.
- source_word: ἑβδομήκοντα πέντε
  choice: soixante-quinze
  rationale: Traduction directe du nombre attesté dans le texte grec.
theological_decisions:
- issue: Total numérique de la parenté de Jacob par rapport aux traditions textuelles de la Genèse et de l'Exode
  choice: soixante-quinze personnes en tout
  alternative: soixante-dix personnes
  rationale: Le texte grec des Actes porte explicitement « soixante-quinze ». La traduction maintient ce nombre dans le texte principal et signale en note la différence avec certains passages de l'Ancien Testament, sans chercher à les harmoniser.
translation_notes:
  register: Français international moderne, clair et digne. « Envoya chercher » est idiomatique et évite à la fois le calque lourd « ayant envoyé » et le ton potentiellement autoritaire de « convoqua ». La ponctuation avant le total rend explicite sa valeur récapitulative sans modifier le sens.
