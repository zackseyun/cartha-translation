id: ACT.7.35
reference: Acts 7:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: fr
  text: '« Ce Moïse qu’ils avaient rejeté en disant : “Qui t’a établi chef et juge ?”, c’est lui que Dieu a envoyé comme chef et libérateur[a], par l’intermédiaire de l’ange qui lui était apparu dans le buisson. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rédempteur ». Le terme grec peut désigner celui qui procure la délivrance, la libération ou le rachat.'
    reason: Alternative lexicale préservant la nuance de rédemption attachée à λυτρωτής.
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: avaient rejeté
  rationale: Dans ce contexte, le verbe exprime le refus de reconnaître l’autorité de Moïse. « Rejeter » rend mieux ce sens que « nier » ou « renier ».
- source_word: κατέστησεν
  choice: a établi
  rationale: Le verbe désigne ici l’établissement dans une fonction d’autorité. « Établir » reste proche du grec et convient naturellement à la question citée.
- source_word: ἄρχοντα
  choice: chef
  rationale: Ἄρχων désigne une personne qui exerce l’autorité. « Chef » est clair en français courant et permet de conserver la répétition rhétorique de la fonction attribuée à Moïse.
- source_word: δικαστήν
  choice: juge
  rationale: Le terme désigne directement celui qui exerce le jugement; « juge » en est l’équivalent français naturel.
- source_word: λυτρωτὴν
  choice: libérateur
  rationale: Λυτρωτής désigne celui qui procure la délivrance ou la libération. « Libérateur » est naturel pour le rôle de Moïse dans l’Exode, tandis que la note conserve l’autre rendu possible, « rédempteur », qui souligne davantage la nuance de rachat.
- source_word: ἀπέσταλκεν
  choice: a envoyé
  rationale: Le passé composé rend naturellement en français l’acte accompli exprimé par le parfait grec, sans effacer sa portée dans le discours d’Étienne.
- source_word: σὺν χειρὶ
  choice: par l’intermédiaire de
  rationale: L’expression sémitisante marque ici la médiation ou l’action instrumentale. « Par l’intermédiaire de » en transmet le sens dans un français naturel sans imposer l’image peu idiomatique de « la main ».
- source_word: ἀγγέλου
  choice: l’ange
  rationale: Dans le récit du buisson, le mot désigne l’être céleste apparu à Moïse; « ange » est le terme contextuellement approprié.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: qui lui était apparu dans le buisson
  rationale: Bien que le participe soit passif dans sa forme, il signifie idiomatiquement « apparaître ». Le plus-que-parfait situe naturellement l’apparition avant l’envoi. « Dans le buisson » n’ajoute pas « ardent », absent de ce verset.
- source_word: Τοῦτον ... τοῦτον
  choice: Ce Moïse ... c’est lui
  rationale: La construction disloquée avec « c’est lui » conserve l’insistance du double démonstratif grec et l’ironie du passage dans un français naturel.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: comme chef et libérateur
  rationale: La coordination présente les deux fonctions confiées ensemble à Moïse. En français, la construction avec « comme » exprime clairement son mandat sans alourdir la phrase.
theological_decisions:
- issue: Rendu de λυτρωτής dans la présentation de Moïse comme agent du salut envoyé par Dieu
  choice: libérateur
  alternative: rédempteur
  rationale: « Libérateur » exprime directement le rôle de Moïse dans la délivrance d’Israël et reste immédiatement compréhensible. « Rédempteur » est lexicalement possible et met davantage en relief la notion de rachat; il est donc signalé en note afin de préserver cette résonance sans imposer une lecture typologique plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « c’est lui » maintient l’emphase rhétorique du grec. La citation est intégrée avec une ponctuation française naturelle, et aucun détail absent du verset, tel que « ardent », n’a été ajouté.
