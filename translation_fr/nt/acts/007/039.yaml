source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: fr
  text: Nos ancêtres n’ont pas voulu lui obéir, mais ils l’ont repoussé[a] et, dans leur cœur, ils se sont tournés vers l’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils l’ont rejeté ». Le verbe grec peut évoquer le fait d’écarter ou de repousser quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, alors qu’ils étaient encore dans le désert, ils désiraient intérieurement retourner en Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: lui
  rationale: 'Le pronom relatif au datif renvoie à Moïse et se rattache naturellement en français au verbe « obéir » : « lui obéir ».'
- source_word: οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι
  choice: n’ont pas voulu lui obéir
  rationale: Cette formulation exprime clairement le refus volontaire contenu dans οὐκ ἠθέλησαν, tout en rendant idiomatiquement ὑπήκοοι γενέσθαι. « Devenir obéissants » serait plus formel, mais moins naturel ici.
- source_word: οἱ πατέρες ἡμῶν
  choice: nos ancêtres
  rationale: Dans ce discours historique, « nos ancêtres » désigne clairement les générations israélites antérieures et sonne plus naturel en français moderne que « nos pères », sans changer le référent.
- source_word: ἀπώσαντο
  choice: ils l’ont repoussé
  rationale: « Repousser » conserve l’image concrète du verbe grec tout en exprimant ici le rejet de l’autorité de Moïse.
- source_word: ἐστράφησαν
  choice: ils se sont tournés
  rationale: Le verbe indique une réorientation vers l’Égypte. La mention explicite du cœur montre qu’il ne s’agit pas nécessairement d’un retour physique.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: dans leur cœur
  rationale: Cette expression préserve l’image biblique du cœur comme siège des désirs, des intentions et de l’orientation intérieure.
- source_word: εἰς Αἴγυπτον
  choice: vers l’Égypte
  rationale: « Vers » rend directement l’orientation exprimée par εἰς sans ajouter à tort qu’un retour physique a eu lieu.
theological_decisions:
- issue: Nature du mouvement vers l’Égypte
  choice: dans leur cœur, ils se sont tournés vers l’Égypte
  alternative: ils sont retournés en Égypte dans leur cœur
  rationale: Le texte décrit une réorientation intérieure vers l’Égypte, probablement faite de désir et d’allégeance, sans dire que les Israélites y sont effectivement retournés. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé favorise une lecture naturelle. « Nos ancêtres » évite l’ambiguïté moderne de « nos pères », tandis que « dans leur cœur » conserve l’idiome biblique et sa portée intérieure.
