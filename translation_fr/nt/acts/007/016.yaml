id: ACT.7.16
reference: Acts 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: fr
  text: Ils furent transportés à Sichem et déposés dans le tombeau qu’Abraham avait acheté à prix d’argent aux fils d’Hamor, à Sichem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formulation d’Étienne réunit des éléments que l’on peut comparer avec Genèse 23, où Abraham achète à Éfron un lieu de sépulture à Macpéla, et Genèse 33.19, où Jacob achète un terrain près de Sichem aux fils d’Hamor.
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: furent transportés
  rationale: Le passif aoriste décrit le transfert des dépouilles des patriarches. « Transportés » est naturel en contexte funéraire et conserve l’idée de déplacement.
- source_word: Συχὲμ / Συχέμ
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu biblique.
- source_word: ἐτέθησαν
  choice: déposés
  rationale: Dans un contexte d’ensevelissement, « déposés » rend naturellement l’idée d’être placés dans un tombeau.
- source_word: μνήματι
  choice: tombeau
  rationale: Le terme désigne ici un lieu de sépulture; « tombeau » convient au registre narratif et funéraire.
- source_word: ᾧ
  choice: qu’
  rationale: Le pronom relatif se rapporte au tombeau et introduit naturellement en français la proposition « qu’Abraham avait acheté ».
- source_word: ὠνήσατο
  choice: avait acheté
  rationale: Le verbe signifie acheter; le plus-que-parfait marque clairement l’antériorité de l’achat par rapport au dépôt des corps.
- source_word: τιμῆς ἀργυρίου
  choice: à prix d’argent
  rationale: Cette expression française concise conserve à la fois la notion de prix et celle d’un paiement en argent.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: aux fils d’Hamor
  rationale: En français, « acheter quelque chose à quelqu’un » exprime naturellement la provenance indiquée par παρά avec le génitif.
- source_word: ἐν Συχέμ
  choice: à Sichem
  rationale: La formulation maintient la locution finale sans trancher explicitement si elle précise Hamor, ses fils ou le lieu de la transaction.
theological_decisions:
- issue: Tension historique avec les récits d’achat et de sépulture de la Genèse
  choice: 'Conserver le texte de Luc tel qu’il se présente : Abraham achète le tombeau aux fils d’Hamor à Sichem.'
  alternative: Harmoniser avec l’achat effectué par Jacob en Genèse 33.19, ou avec l’achat d’Abraham à Macpéla en Genèse 23.
  rationale: La traduction doit rendre le texte grec transmis sans corriger ni résoudre silencieusement sa tension avec les récits de la Genèse. Une note permet au lecteur de comparer les passages concernés.
translation_notes:
  register: Français moderne, clair et digne. Le vocabulaire funéraire (« transportés », « déposés », « tombeau ») reste naturel sans être archaïque. La répétition de « Sichem » et l’attribution de l’achat à Abraham sont conservées conformément au grec, sans harmonisation.
