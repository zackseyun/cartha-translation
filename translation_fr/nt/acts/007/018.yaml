  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: fr
  text: jusqu’à ce qu’un autre roi accède au pouvoir sur l’Égypte[a], qui ne connaissait pas Joseph[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie littéralement « se leva »; dans ce contexte, il peut aussi se rendre par « vint à régner sur l’Égypte » ou « parvint au pouvoir sur l’Égypte ».
    reason: lexical_alternative
  - marker: b
    text: « Ne connaissait pas Joseph » peut aussi impliquer qu’il ne le reconnaissait pas ou ne tenait aucun compte de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: jusqu’à ce que
  rationale: Cette locution marque la limite temporelle de la situation décrite auparavant; « jusqu’à ce que » est naturel et précis en français.
- source_word: ἀνέστη
  choice: prenne le pouvoir
  rationale: Dans ce contexte royal, ἀνίστημι désigne l’apparition ou l’accession d’un nouveau souverain. « Prit le pouvoir » exprime naturellement cet emploi idiomatique, tandis qu’une note conserve l’image littérale de « se lever ».
- source_word: βασιλεὺς
  choice: roi
  rationale: « Roi » est l’équivalent direct et convient au cadre historique égyptien.
- source_word: ἕτερος
  choice: un autre
  rationale: Le terme distingue ce souverain de celui de la période précédente sans exiger de préciser qu’il était d’une autre nature.
- source_word: ἐπ’ Αἴγυπτον
  choice: sur l’Égypte
  rationale: Avec βασιλεύς, ἐπί suivi de l’accusatif exprime ici l’autorité exercée sur un territoire.
- source_word: οὐκ ᾔδει
  choice: ne connaissait pas
  rationale: Cette traduction conserve le sens premier de οἶδα et laisse ouverte l’implication contextuelle possible d’un refus de reconnaître ou de tenir compte de Joseph.
- source_word: τὸν Ἰωσήφ
  choice: Joseph
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
