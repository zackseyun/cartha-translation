translation_notes:
  register: Français moderne, clair et digne. « Prendre le pouvoir » évite le tour peu naturel « un roi se leva », tout en maintenant le sens politique du verbe dans ce contexte. La reprise « un roi qui » favorise une lecture fluide et lève l’ambiguïté possible de l’antécédent.
