revisions:
- from: Nos pères, l’ayant reçue à leur tour,[a] la firent entrer avec Josué[b] lorsqu’ils prirent possession du territoire des nations que Dieu chassa devant eux. Elle y resta jusqu’aux jours de David.
  to: Nos pères, après l’avoir reçue de leurs prédécesseurs,[a] l’introduisirent avec Josué[b] lors de la dépossession des nations que Dieu chassa devant nos pères. Elle demeura ainsi jusqu’aux jours de David.
  rationale: La révision supprime l’ajout « territoire » et rend κατάσχεσις dans son rapport direct aux nations. « Dépossession » est moins courant que « conquête », mais conserve la portée de la construction grecque et correspond à l’expulsion ensuite attribuée à Dieu. La seconde phrase explicite sobrement l’ellipse temporelle sans introduire de complément de lieu. Les deux ancres de notes restent attachées aux éléments concernés.
