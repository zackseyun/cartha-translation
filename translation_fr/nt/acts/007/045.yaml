source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: fr
  text: Nos pères, après l’avoir reçue de leurs prédécesseurs,[a] l’introduisirent avec Josué[b] lors de la dépossession des nations que Dieu chassa devant nos pères. Elle demeura ainsi jusqu’aux jours de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ayant reçue à leur tour ». Le participe souligne la réception et la transmission d’une génération à l’autre.'
    reason: lexical_alternative
  - marker: b
    text: En grec, le même nom peut se traduire par « Jésus » ou « Josué » ; ici, il désigne Josué, fils de Noun.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: l’
  rationale: Le pronom relatif féminin renvoie à la tente mentionnée au verset précédent. En français, la reprise pronominale dans une nouvelle phrase évite une construction relative lourde tout en gardant clairement le même référent.
- source_word: εἰσήγαγον
  choice: la firent entrer
  rationale: Le verbe signifie « faire entrer, introduire ». Cette formulation naturelle conserve la valeur causative et convient au transport de la tente dans le pays.
- source_word: διαδεξάμενοι
  choice: l’ayant reçue à leur tour
  rationale: Le participe exprime la réception par succession. Cette traduction garde à la fois l’idée de recevoir et celle d’une continuité entre générations.
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: Cette formulation conserve le langage ancestral et l’écho rhétorique de l’expression répétée dans le discours d’Étienne.
- source_word: μετὰ Ἰησοῦ
  choice: avec Josué
  rationale: Ἰησοῦ est la forme grecque commune aux noms Jésus et Josué. Le contexte historique de l’entrée en Canaan désigne Josué, fils de Noun.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: lorsqu’ils prirent possession du territoire des nations
  rationale: κατάσχεσις désigne la prise de possession. Le complément « du territoire » rend explicite en français l’objet territorial implicite et évite de suggérer que les nations elles-mêmes auraient été possédées.
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: que Dieu chassa
  rationale: ἐξωθέω signifie pousser dehors, expulser ou chasser. « Chassa » est direct, courant et adapté au contexte.
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: devant eux
  rationale: L’expression sémitisante signifie « hors de leur présence » ou « devant eux ». Le pronom évite la répétition pesante de « nos pères » sans modifier le référent.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: Elle y resta jusqu’aux jours de David
  rationale: Le grec donne littéralement « jusqu’aux jours de David » sans verbe exprimé. En français, l’ajout contextuel « Elle y resta » clarifie que la tente demeure dans le pays jusqu’à cette époque et prépare la suite du récit.
theological_decisions:
- issue: Référent de Ἰησοῦ
  choice: Josué
  alternative: Jésus
  rationale: La forme grecque peut désigner Jésus ou Josué, mais le cadre narratif est l’entrée d’Israël dans le pays après Moïse. Josué, fils de Noun, est donc le référent historique.
- issue: Valeur de διαδεξάμενοι
  choice: Nos pères reçurent la tente à leur tour avant de la faire entrer
  alternative: Nos pères la firent entrer successivement
  rationale: Le participe met vraisemblablement en relief une réception en succession. La formulation choisie préserve cette nuance au lieu de réduire le mot à une simple indication temporelle.
- issue: Portée de ἕως τῶν ἡμερῶν Δαυίδ
  choice: La tente resta dans le pays jusqu’aux jours de David
  alternative: La proposition reste suspendue sous la forme littérale « jusqu’aux jours de David »
  rationale: Le grec est elliptique. L’explicitation française reprend le sujet contextuel, la tente, sans trancher une question doctrinale et relie naturellement ce verset au suivant.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour rendre l’ellipse finale intelligible. « Nos pères » conserve la tonalité historique et rhétorique du discours, tandis que « territoire » explicite sans surcharge le sens territorial de la prise de possession.
