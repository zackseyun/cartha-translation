id: ACT.7.38
reference: Acts 7:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: fr
  text: C’est lui qui se trouvait dans l’assemblée au désert[a], avec l’ange qui lui parlait sur le mont Sinaï et avec nos pères[b]. Il a reçu des paroles divines vivantes[c] pour nous les donner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « communauté au désert »; traditionnellement : « Église au désert ».'
    reason: alternative_reading
  - marker: b
    text: « Nos pères » désigne ici les ancêtres du peuple d’Israël.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « oracles vivants » ou « paroles qui donnent la vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assemblée
  rationale: « Assemblée » rend le sens d’un peuple réuni sans projeter sur Israël au désert les connotations institutionnelles ultérieures du mot « Église ».
- source_word: ἐρήμῳ
  choice: désert
  rationale: « Désert » est l’expression française naturelle et traditionnelle pour le cadre des pérégrinations d’Israël.
- source_word: ἀγγέλου
  choice: ange
  rationale: Dans le contexte du Sinaï, il s’agit d’un être céleste plutôt que d’un messager humain.
- source_word: λαλοῦντος
  choice: qui lui parlait
  rationale: L’imparfait français restitue naturellement l’aspect duratif du participe présent grec.
- source_word: πατέρων ἡμῶν
  choice: nos pères
  rationale: Cette formulation conserve l’expression masculine du grec et désigne les pères du peuple d’Israël; une note explicite le référent.
- source_word: ἐδέξατο
  choice: a reçu
  rationale: Rend directement l’idée que Moïse a été le destinataire de la révélation.
- source_word: λόγια
  choice: paroles divines
  rationale: « Paroles divines » communique clairement le caractère révélé de λόγια en français courant, là où « oracles » pourrait évoquer à tort la divination païenne.
- source_word: ζῶντα
  choice: vivantes
  rationale: La traduction littérale préserve l’image et sa richesse théologique sans la réduire au seul sens de « qui donnent la vie ».
- source_word: δοῦναι
  choice: pour nous les donner
  rationale: « Pour » exprime naturellement la finalité de l’infinitif, et le pronom « les » rend la phrase idiomatique en français.
- source_word: ἡμῖν
  choice: nous
  rationale: Conserve l’identification d’Étienne et de ses auditeurs avec l’histoire d’Israël.
- source_word: ὁ γενόμενος
  choice: lui qui se trouvait
  rationale: Formulation française naturelle pour identifier Moïse comme celui qui était présent dans cette assemblée, sans le calque maladroit « devenu ».
theological_decisions:
- issue: Faut-il traduire ἐκκλησία par « Église » à propos d’Israël au désert?
  choice: assemblée
  alternative: Église; communauté
  rationale: Le contexte désigne Israël rassemblé au désert. « Assemblée » respecte le sens lexical sans imposer une conclusion ecclésiologique étrangère au verset.
- issue: Faut-il interpréter λόγια ζῶντα comme des paroles « qui donnent la vie »?
  choice: paroles divines vivantes
  alternative: paroles qui donnent la vie; oracles vivants
  rationale: « Vivantes » conserve l’expression compacte et l’ambiguïté féconde du grec, qui peut évoquer à la fois leur vitalité et leur puissance vivifiante sans choisir exclusivement l’une de ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque tout en évitant les calques; « paroles divines » rend le caractère révélé de λόγια avec plus de clarté pour le lecteur ordinaire.
