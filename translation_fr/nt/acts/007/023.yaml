  terminology: « Ses frères, les fils d’Israël » préserve la parenté collective et l’appellation biblique sans imposer une lecture restrictive aux seuls hommes. « Rendre visite à » est une restitution recevable de ἐπισκέψασθαι dans ce contexte. Les notes conservent les alternatives pertinentes.
