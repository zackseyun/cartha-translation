  source_fidelity: La formule « il approchait de l’âge de quarante ans » affaiblit le sens de ἐπληροῦτο ... τεσσερακονταετὴς χρόνος, qui situe l’événement à l’accomplissement de ses quarante ans plutôt qu’à une simple proximité de cet âge. « Quand il eut quarante ans » rend naturellement ce repère temporel. Le reste restitue correctement l’intention exprimée par l’idiome « monter sur le cœur » et l’apposition identifiant ses frères aux fils d’Israël.
