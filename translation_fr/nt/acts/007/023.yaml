  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: fr
  text: Quand il eut quarante ans, il lui vint à cœur[a] de rendre visite à ses frères, les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il décida » ou « il lui vint à l’esprit ». Le grec emploie une expression imagée pour un dessein intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ici, « ses frères » désigne les autres membres du peuple d’Israël ; « les fils d’Israël » peut aussi se traduire par « les Israélites ».
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Alors que
  rationale: Introduit la transition temporelle tout en conservant avec légèreté la valeur connective de δέ, sans ajouter un « maintenant » absent du grec.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: il approchait de l’âge de quarante ans
  rationale: Rend de façon naturelle l’expression grecque selon laquelle une période de quarante ans arrivait à son accomplissement pour lui; l’imparfait est respecté sans calque maladroit.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: il lui vint à cœur
  rationale: Conserve l’image sémitisante du cœur comme siège de l’intention tout en exprimant en français un dessein intérieur.
- source_word: ἐπισκέψασθαι
  choice: rendre visite à
  rationale: Traduction concise et naturelle dans ce contexte; le verbe grec peut aussi suggérer qu’il veut aller voir dans quelle situation se trouvent les siens.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: Maintient le terme familial masculin du grec; l’apposition suivante précise qu’il s’agit de ses compatriotes israélites.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: les fils d’Israël
  rationale: Préserve l’appellation biblique et la structure appositive du grec, plutôt que de la réduire au seul ethnonyme « Israélites ».
theological_decisions:
- issue: Parenté fraternelle et désignation du peuple
  choice: ses frères, les fils d’Israël
  alternative: ses compatriotes israélites
  rationale: 'La formulation retenue conserve à la fois le langage familial et la désignation ethnique du texte. Elle ne limite pas le groupe aux seuls hommes: l’expression collective désigne le peuple d’Israël.'
- issue: Expression du dessein intérieur
  choice: il lui vint à cœur
  alternative: il décida
  rationale: Le texte présente l’intention de Moïse au moyen d’une image liée au cœur. La traduction garde cette image et évite de préciser davantage que le grec la nature psychologique ou théologique de cette impulsion.
translation_notes:
  register: Français international actuel, sobre et digne. La tournure « il lui vint à cœur » garde l’image du texte source sans devenir obscure; « les fils d’Israël » conserve la texture biblique, avec une note explicative pour éviter une lecture exclusivement masculine.
