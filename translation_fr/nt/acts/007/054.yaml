  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: fr
  text: Quand ils entendirent cela[a], ils furent profondément exaspérés et grinçaient des dents contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils furent saisis de rage au fond d’eux-mêmes » ; le verbe grec évoque littéralement l’action de scier de part en part et décrit une violente agitation intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντες δὲ ταῦτα
  choice: Quand ils entendirent cela
  rationale: Le participe circonstanciel a une valeur temporelle naturelle en français. « Cela » reprend l’ensemble du discours précédent. δέ marque ici la progression du récit sans exiger un connecteur explicite.
- source_word: διεπρίοντο
  choice: ils furent profondément blessés
  rationale: Le verbe évoque littéralement le fait d’être coupé ou transpercé et exprime ici une violente agitation intérieure. Cette formulation conserve l’image tout en restant intelligible en français courant.
- source_word: ταῖς καρδίαις αὐτῶν
  choice: au cœur
  rationale: Le datif désigne la sphère intérieure atteinte. Le singulier collectif est idiomatique en français dans cette expression.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: grincèrent des dents
  rationale: Expression française naturelle qui conserve l’image concrète et manifeste ici une hostilité furieuse.
- source_word: ἐπ’ αὐτόν
  choice: contre lui
  rationale: Avec cette action hostile, ἐπί indique que l’hostilité est dirigée vers Étienne ; « contre lui » l’exprime clairement en français.
