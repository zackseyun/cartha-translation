  verdict: revise
  source_fidelity: La proposition « profondément blessés au cœur » est ambiguë et, en français, évoque spontanément une peine ou une blessure affective. Dans ce contexte, renforcé par « ils grinçaient des dents contre lui », διεπρίοντο exprime une exaspération rageuse. La note peut conserver l’image littérale du verbe sans imposer une lecture émotionnelle inadéquate au texte principal. Les imparfaits grecs décrivent la réaction en cours; le français narratif peut les rendre naturellement par « furent ... et grinçaient ».
  naturalness: « Ils furent profondément exaspérés et grinçaient des dents contre lui » est idiomatique, clair et d’un registre moderne digne. « Grincer des dents contre quelqu’un » rend naturellement l’hostilité dirigée par ἐπ’ αὐτόν.
  terminology: « Exaspérés » restitue ici la valeur idiomatique et hostile de διεπρίοντο sans effacer son imagerie, explicitée en note. « Cela » reprend correctement ταῦτα.
