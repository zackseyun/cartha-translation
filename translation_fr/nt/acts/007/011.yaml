source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: fr
  text: Une famine et une grande détresse frappèrent toute l’Égypte et Canaan, et nos pères[a] ne trouvaient pas de vivres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». Le grec dit « nos pères » et désigne les ancêtres d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: Une famine frappa
  rationale: L’expression idiomatique présente la famine comme un événement qui survient. « Frappa » est naturel en français pour une calamité et intègre sans lourdeur la progression narrative marquée par δέ.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: toute l’Égypte et Canaan
  rationale: ἐπί avec l’accusatif exprime ici l’étendue géographique. Après « frappa », le complément direct rend naturellement cette portée en français.
- source_word: θλῖψις μεγάλη
  choice: une grande détresse
  rationale: Le syntagme désigne les graves difficultés liées à la famine, sans imposer le sens technique ou eschatologique que pourrait suggérer « tribulation ».
- source_word: οὐχ ηὕρισκον
  choice: ne trouvaient pas
  rationale: L’imparfait grec décrit une situation qui se prolongeait. L’imparfait français en conserve l’aspect sans transformer explicitement l’énoncé en incapacité.
- source_word: χορτάσματα
  choice: de quoi se nourrir
  rationale: Le pluriel désigne des vivres ou ressources alimentaires. Cette formulation française est claire et assez large, sans limiter le sens au grain ni au fourrage.
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: Le grec emploie explicitement le terme masculin « pères » pour les ancêtres d’Israël; le français conserve cette formulation historique.
theological_decisions:
- issue: Langage ancestral masculin
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » correspond directement au grec et garde la formulation masculine liée aux ancêtres d’Israël. Une note indique le sens pour éviter que le lecteur ne pense aux pères immédiats.
translation_notes:
  register: Français international moderne, digne et accessible. « Accompagnée d’une grande détresse » évite une coordination heurtée tout en maintenant la famine et la détresse comme deux éléments étroitement associés. Le marqueur [a] est placé immédiatement après « nos pères », expression qu’il explique.
