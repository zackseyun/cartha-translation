source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: fr
  text: Au bout de quarante ans[a], un ange[c] lui apparut dans le désert du mont Sinaï, dans une flamme de feu issue d’un buisson[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsque quarante ans se furent écoulés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans une flamme de feu d’un buisson » ; cette expression condensée évoque Exode 3.2.'
    reason: cross_reference
  - marker: c
    text: Certains rapprochent cet ange de « l’ange du Seigneur » en Exode 3.2, mais le texte des Actes dit simplement « un ange ».
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: Au bout de quarante ans
  rationale: Le génitif absolu exprime une circonstance temporelle. Cette formulation française naturelle conserve l’idée que la période de quarante ans est arrivée à son terme.
- source_word: ὤφθη αὐτῷ
  choice: lui apparut
  rationale: Le passif de ὁράω est ici employé avec le sens intransitif d’une apparition; « lui apparut » est idiomatique et garde le datif αὐτῷ.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: dans le désert du mont Sinaï
  rationale: « Désert » convient au cadre géographique de l’Exode et « mont Sinaï » est l’expression française consacrée.
- source_word: ἄγγελος
  choice: un ange
  rationale: Dans ce récit d’apparition surnaturelle, il s’agit d’un être céleste. L’article indéfini respecte l’absence d’article en grec sans importer l’expression « l’ange du Seigneur ».
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: dans la flamme d’un feu qui brûlait au milieu d’un buisson
  rationale: La formulation rend intelligible en français la relation génitivale grecque très condensée entre la flamme, le feu et le buisson, tout en conservant l’image du récit de l’Exode.
theological_decisions:
- issue: Identité de l’ange dans le contexte théophanique
  choice: un ange
  alternative: l’ange du Seigneur
  rationale: Le texte des Actes dit simplement ἄγγελος. La traduction n’importe donc pas dans le corps du texte l’identification plus développée d’Exode 3.2; celle-ci est signalée en note sans trancher la question.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient à la narration biblique soutenue sans être archaïque. Les notes suivent l’ordre d’apparition des marqueurs, et l’identification théologique de l’ange reste ouverte.
