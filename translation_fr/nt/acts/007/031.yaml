  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: fr
  text: 'Quand Moïse vit cela, il fut étonné de cette vision[a]. Comme il s’approchait pour regarder de près, une voix du Seigneur[b] se fit entendre[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette apparition ». Le terme grec peut désigner ce qui se présente à la vue aussi bien qu’une vision.
    reason: lexical_alternative
  - marker: b
    text: Certains pourraient attendre ici « l’Éternel » en raison de l’écho à Exode 3 ; le texte grec porte « Seigneur » (κύριος).
    reason: alternative_reading
  - marker: c
    text: 'Plus littéralement : « il y eut une voix du Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: vit cela
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. « Vit cela » est naturel en français et reprend sans lourdeur le phénomène visible évoqué dans le contexte.
- source_word: ἐθαύμασεν
  choice: s’émerveilla
  rationale: Le verbe exprime ici l’étonnement mêlé d’admiration. « S’émerveilla » conserve cette nuance dans un registre narratif digne et courant.
- source_word: τὸ ὅραμα
  choice: ce spectacle
  rationale: Ὅραμα peut désigner une vision ou une apparition visible. Dans ce contexte, « ce spectacle » souligne ce que Moïse voit extérieurement sans imposer l’idée d’une expérience intérieure.
- source_word: προσερχομένου
  choice: alors qu’il s’approchait
  rationale: Le génitif absolu marque une circonstance temporelle concomitante et le mouvement de Moïse vers le phénomène.
- source_word: κατανοῆσαι
  choice: pour l’examiner attentivement
  rationale: Le verbe indique une observation soigneuse. Cette formulation rend à la fois l’attention visuelle et l’intention de Moïse.
- source_word: ἐγένετο φωνὴ
  choice: une voix se fit entendre
  rationale: La construction introduit la survenue d’une voix. « Se fit entendre » est une tournure française naturelle, tout en gardant en note une formulation plus littérale.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Κύριος est rendu par « Seigneur ». L’article contracté « du » est requis par l’idiome français, bien que le nom grec soit sans article.
theological_decisions:
- issue: Traduction de κύριος dans un contexte de théophanie
  choice: du Seigneur
  alternative: de l’Éternel
  rationale: Le texte grec porte κύριος et non le tétragramme hébreu. « Seigneur » représente directement le terme grec, tandis que « l’Éternel » interpréterait explicitement l’allusion à Exode 3.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase suit le mouvement du grec tout en évitant une tournure artificielle ; les notes préservent l’étendue sémantique de ὅραμα et la tension théologique liée à κύριος.
