  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: fr
  text: 'Et tandis qu’ils lapidaient Étienne, celui-ci invoquait le Seigneur en disant[a] : « Seigneur Jésus, reçois mon esprit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Étienne invoquait Jésus et disait ». Le participe grec peut exprimer plus explicitement le fait d’invoquer quelqu’un dans la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: tandis qu’ils lapidaient
  rationale: L’imparfait présente la lapidation comme une action en cours; « tandis que » relie naturellement cette action à la prière d’Étienne.
- source_word: ἐπικαλούμενον
  choice: invoquait le Seigneur
  rationale: Le participe exprime ici un appel religieux adressé à Jésus. En français, « invoquer le Seigneur » rend clairement cette nuance sans être artificiel; le complément est explicité d’après l’adresse directe qui suit.
- source_word: λέγοντα
  choice: en disant
  rationale: Cette tournure participiale française reproduit naturellement la coordination et introduit les paroles prononcées.
- source_word: Κύριε Ἰησοῦ
  choice: Seigneur Jésus
  rationale: « Seigneur » est le titre usuel et solennel de κύριος dans une adresse directe à Jésus.
- source_word: δέξαι
  choice: reçois
  rationale: L’impératif de δέχομαι exprime la demande qu’accueille celui qui lui est confié; « reçois » garde la sobriété et la solennité du grec.
- source_word: τὸ πνεῦμά μου
  choice: mon esprit
  rationale: Rendu direct et traditionnel de πνεῦμα dans cette parole prononcée à l’approche de la mort, sans préciser davantage la conception anthropologique.
theological_decisions:
- issue: L’invocation adressée à Jésus
  choice: « invoquait le Seigneur » suivi de « Seigneur Jésus »
  alternative: « lançait cet appel » ou « appelait en disant »
  rationale: Le texte présente directement Jésus comme destinataire de l’appel. Le rendre explicitement évite d’affaiblir la valeur religieuse possible de ἐπικαλέομαι, sans ajouter une qualification doctrinale absente du verset.
- issue: Le sens de « mon esprit »
  choice: Conserver « mon esprit »
  alternative: « mon souffle de vie »
  rationale: « Mon esprit » préserve la formulation et la portée théologique du grec sans imposer une interprétation anthropologique plus étroite.
translation_notes:
  register: Français moderne, international et digne. « Lapidaient » est précis et courant dans le registre biblique; la phrase reste intelligible sans sacrifier la nuance d’invocation.
