id: ACT.7.42
reference: Acts 7:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: fr
  text: 'Mais Dieu s’est détourné d’eux et les a livrés au culte de l’armée du ciel[a], comme il est écrit dans le livre des prophètes[b] : « M’avez-vous offert des bêtes égorgées et des sacrifices pendant quarante ans dans le désert, maison d’Israël ? »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour servir l’armée du ciel ». Le verbe grec peut désigner un service religieux ou l’adoration. « L’armée du ciel » est une expression biblique qui peut désigner les astres et, par extension, les puissances célestes auxquelles un culte idolâtre était rendu.
    reason: Alternative lexicale et note culturelle.
  - marker: b
    text: Ou « dans le rouleau des prophètes ».
    reason: Alternative lexicale et précision historique concernant le support écrit.
  - marker: c
    text: Citation d’Amos 5.25.
    reason: Renvoi scripturaire.
lexical_decisions:
- source_word: ἔστρεψεν
  choice: s’est détourné d’eux
  rationale: Avec Dieu pour sujet et παρέδωκεν à la suite, le verbe exprime ici un retrait relationnel dans le jugement, et non un simple mouvement physique. Le complément « d’eux » explicite naturellement en français l’objet sous-entendu.
- source_word: παρέδωκεν
  choice: les a livrés
  rationale: 'Cette formulation conserve la force judiciaire du verbe : Dieu les abandonne aux conséquences de leur rébellion sans être présenté comme l’auteur de leur idolâtrie.'
- source_word: λατρεύειν
  choice: au culte de
  rationale: Le verbe désigne un service de caractère religieux, donc le culte. La tournure nominale est naturelle en français après « les a livrés » et maintient la dimension cultuelle.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: l’armée du ciel
  rationale: Cette expression biblique traditionnelle laisse ouvert le référent précis — astres ou puissances célestes qui leur sont associées — sans le réduire aux seules étoiles ni aux anges.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française consacrée pour introduire une citation scripturaire; elle rend clairement la correspondance affirmée par καθὼς.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: dans le livre des prophètes
  rationale: βίβλος peut désigner un livre ou un rouleau. « Livre » est ici précis, courant et adapté à la référence au recueil prophétique.
- source_word: Μὴ
  choice: M’avez-vous… ?
  rationale: La question introduite par μή appelle une réponse négative. La forme interrogative française préserve cette force rhétorique sans ajouter explicitement la réponse.
- source_word: σφάγια
  choice: des bêtes égorgées
  rationale: Le terme désigne des animaux mis à mort en vue d’une offrande. Cette formulation moderne conserve la nuance d’égorgement sans employer le mot potentiellement ambigu ou vieilli « victimes ».
- source_word: θυσίας
  choice: des sacrifices
  rationale: « Sacrifices » est l’équivalent français direct et courant du terme cultuel.
- source_word: προσηνέγκατέ μοι
  choice: M’avez-vous offert
  rationale: Dans un contexte sacrificiel, προσφέρω signifie naturellement « offrir ». Le pronom placé en tête conserve l’expression du destinataire μοι et donne à la question une formulation française fluide.
- source_word: ἔτη τεσσεράκοντα
  choice: pendant quarante ans
  rationale: « Pendant » exprime clairement la durée portée par l’accusatif grec.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme moderne usuel en français pour le cadre du séjour d’Israël après l’Exode.
theological_decisions:
- issue: Action de Dieu dans le jugement
  choice: « s’est détourné d’eux et les a livrés » présente un retrait et un abandon judiciaires
  alternative: Dieu aurait simplement permis leur idolâtrie, ou les aurait activement contraints à la pratiquer
  rationale: Les deux verbes grecs décrivent le jugement divin en réponse à la rébellion antérieure. La traduction conserve cette action sévère sans suggérer que Dieu aurait produit leur péché.
- issue: Référent de « l’armée du ciel »
  choice: Conserver l’expression biblique sans en préciser excessivement le référent
  alternative: Traduire exclusivement par « les étoiles » ou par « les anges »
  rationale: Dans ce contexte d’idolâtrie, l’expression peut évoquer les corps célestes et les puissances qui leur sont associées. La formulation retenue préserve cette amplitude.
- issue: Portée de la question prophétique
  choice: Conserver la question rhétorique qui appelle une réponse négative
  alternative: La transformer en affirmation explicite selon laquelle Israël n’a offert aucun sacrifice à Dieu
  rationale: La forme interrogative maintient la tension du texte d’Amos et évite d’expliciter la portée exacte de la négation au-delà de ce que dit la citation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant les archaïsmes. « Maison d’Israël » est conservé comme appellation biblique collective; « bêtes égorgées » rend concrètement σφάγια sans recourir au cultisme vieilli « victimes ».
