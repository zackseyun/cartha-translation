id: ACT.7.20
reference: Acts 7:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: fr
  text: À cette époque, Moïse naquit. Il était beau aux yeux de Dieu[a] et fut élevé pendant trois mois dans la maison de son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « beau pour Dieu ». On peut aussi comprendre : « d’une beauté remarquable »; toutefois, le grec mentionne Dieu explicitement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: À cette époque
  rationale: Expression temporelle idiomatique qui situe naturellement la naissance de Moïse dans le contexte précédent.
- source_word: ἐγεννήθη
  choice: naquit
  rationale: Le passé simple rend avec dignité et concision l’aoriste passif employé dans le sens de « naître ».
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: ἀστεῖος
  choice: beau
  rationale: Préserve le sens premier de beauté ou de belle apparence sans préciser indûment qu’il était exceptionnel ou prometteur.
- source_word: τῷ θεῷ
  choice: aux yeux de Dieu
  rationale: Rend naturellement le datif de référence ou d’évaluation tout en maintenant la mention explicite de Dieu.
- source_word: ὃς ἀνετράφη
  choice: et fut élevé
  rationale: Le relatif grec est relié à la proposition précédente d’une manière fluide en français; le passif conserve l’idée qu’on a pris soin de l’enfant et l’a élevé.
- source_word: μῆνας τρεῖς
  choice: pendant trois mois
  rationale: Formulation française naturelle d’une durée.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: dans la maison de son père
  rationale: Conserve explicitement la référence au père et le sens domestique de οἶκος, sans remplacer le texte par une formulation plus générale comme « chez ses parents ».
theological_decisions:
- issue: Sens de ἀστεῖος τῷ θεῷ
  choice: Il était beau aux yeux de Dieu
  alternative: Il était beau pour Dieu / C’était un bel enfant
  rationale: La traduction conserve à la fois la beauté exprimée par ἀστεῖος et la référence explicite à l’évaluation divine dans τῷ θεῷ, sans réduire la phrase à un simple jugement humain ni lui attribuer un sens théologique plus fort que le grec.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation évite une coordination lourde, tandis que « aux yeux de Dieu » exprime idiomatiquement l’évaluation divine.
