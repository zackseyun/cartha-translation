id: ACT.7.19
reference: Acts 7:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: fr
  text: Cet homme usa de ruse[a] contre notre peuple et maltraita nos ancêtres en les poussant à exposer leurs nouveau-nés[b], afin qu’ils ne soient pas maintenus en vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « agit avec perfidie envers notre peuple ». Le verbe grec souligne une conduite rusée et malveillante.'
    reason: lexical_alternative
  - marker: b
    text: Exposer un nouveau-né consistait à l’abandonner, généralement à l’extérieur, sans le prendre en charge, ce qui le vouait à la mort.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif renvoie au roi mentionné juste auparavant. « Cet homme » en conserve la force référentielle dans un français naturel.
- source_word: κατασοφισάμενος
  choice: usa de ruse contre
  rationale: Le participe exprime une conduite habile et malveillante dirigée contre le peuple d’Israël. « User de ruse contre » rend clairement cette nuance sans archaïsme.
- source_word: τὸ γένος ἡμῶν
  choice: notre peuple
  rationale: Dans ce contexte, γένος désigne le peuple d’Israël comme groupe ethnique et historique. « Notre peuple » est idiomatique et évite les connotations modernes ambiguës de « race ».
- source_word: ἐκάκωσεν
  choice: maltraita
  rationale: Le verbe signifie faire du mal ou infliger de mauvais traitements. « Maltraita » reste proche du sens sans préciser au-delà du texte la forme de l’oppression.
- source_word: τοὺς πατέρας
  choice: nos ancêtres
  rationale: Le terme désigne ici les générations israélites antérieures. En français moderne, « nos ancêtres » transmet naturellement cette référence historique et collective.
- source_word: τοῦ ποιεῖν
  choice: en leur faisant
  rationale: Cette tournure causative rend l’infinitif articulé lié aux mauvais traitements, sans ajouter explicitement une contrainte plus forte que ne l’exige la construction grecque.
- source_word: τὰ βρέφη ἔκθετα αὐτῶν
  choice: abandonner leurs nourrissons
  rationale: L’expression désigne le fait d’exposer de très jeunes enfants, c’est-à-dire de les abandonner afin qu’ils meurent. La formulation française est claire, tandis qu’une note conserve l’arrière-plan culturel de l’exposition.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: afin qu’ils ne restent pas en vie
  rationale: La proposition rend la visée de l’action et le sens passif de ζῳογονεῖσθαι, « être gardé ou conservé en vie », dans une formulation française fluide.
theological_decisions:
- issue: Valeur de εἰς τό avec l’infinitif
  choice: afin qu’ils ne restent pas en vie
  alternative: de sorte qu’ils ne restent pas en vie
  rationale: La construction peut évoquer la visée ou le résultat. Le contexte du décret royal favorise ici la finalité, sans transformer cette décision grammaticale en affirmation théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans rendre la phrase archaïque. « Ancêtres » est plus naturel aujourd’hui que « pères » pour désigner les générations antérieures d’Israël.
