id: ACT.7.55
reference: Acts 7:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: fr
  text: Mais lui, rempli de l’Esprit Saint, fixa son regard vers le ciel[a] et vit la gloire de Dieu, et Jésus debout à la droite de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « regarda fixement vers le ciel ».'
    reason: lexical_alternative
  - marker: b
    text: Dans la Bible, être « à la droite de Dieu » évoque la place suprême d’honneur et d’autorité.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου
  choice: Mais lui, rempli de l’Esprit saint
  rationale: La tournure rend l’état durable d’Étienne exprimé par le participe présent ὑπάρχων, tout en restant naturelle en français. « Mais » marque le contraste avec l’hostilité décrite juste avant, et « l’Esprit saint » désigne clairement le référent personnel dans l’usage de Luc-Actes.
- source_word: ἀτενίσας εἰς τὸν οὐρανόν
  choice: fixa les yeux vers le ciel
  rationale: ἀτενίζω exprime un regard soutenu et intense. « Vers le ciel » conserve l’orientation du regard et convient au contexte visionnaire sans réduire οὐρανός au seul ciel visible.
- source_word: εἶδεν δόξαν θεοῦ
  choice: vit la gloire de Dieu
  rationale: Traduction directe et actuelle qui conserve l’expression biblique désignant la manifestation visible de la majesté divine.
- source_word: καὶ Ἰησοῦν ἑστῶτα
  choice: ainsi que Jésus debout
  rationale: « Ainsi que » coordonne les deux objets de la vision sans suggérer que Jésus serait lui-même la « gloire » sur le plan grammatical. « Debout » restitue naturellement la posture exprimée par le participe parfait ἑστῶτα.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: à la droite de Dieu
  rationale: Cette expression française rend l’idiome grec de position honorifique tout en conservant l’image biblique au lieu de la paraphraser.
theological_decisions:
- issue: Référence personnelle de πνεύματος ἁγίου
  choice: l’Esprit saint
  alternative: un esprit saint
  rationale: Dans l’usage de Luc-Actes et dans ce contexte immédiat, l’expression renvoie à l’Esprit divin, non à une disposition sainte ou à une force impersonnelle.
- issue: Jésus vu à la droite de Dieu
  choice: Jésus debout à la droite de Dieu
  alternative: Jésus debout du côté droit de Dieu
  rationale: La formulation maintient à la fois la distinction entre Dieu et Jésus dans la scène et l’image d’exaltation portée par l’idiome biblique, sans préciser davantage la raison pour laquelle Jésus est debout.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite l’archaïsme « étant plein » et conserve l’intensité du regard, la dimension visionnaire de la scène et l’idiome biblique de la droite de Dieu.
