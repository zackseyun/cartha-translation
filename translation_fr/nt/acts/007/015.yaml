  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: fr
  text: Et Jacob descendit en Égypte, et il mourut, lui et nos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». Le grec dit « nos pères » et désigne ici les ancêtres d’Israël.
    reason: Alternative lexicale et clarification du référent historique.
lexical_decisions:
- source_word: κατέβη
  choice: descendit
  rationale: Le verbe καταβαίνω exprime un déplacement vers le bas. « Descendit en Égypte » conserve cette nuance géographique tout en étant idiomatique dans un récit biblique en français moderne.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Forme française conventionnelle du nom propre.
- source_word: εἰς Αἴγυπτον
  choice: en Égypte
  rationale: Avec un verbe de mouvement, « en Égypte » rend naturellement l’entrée dans le pays indiquée par εἰς.
- source_word: ἐτελεύτησεν
  choice: mourut
  rationale: τελευτάω désigne directement le fait de mourir. « Mourut » convient au registre narratif digne sans recourir à un euphémisme.
- source_word: αὐτὸς
  choice: lui
  rationale: Le pronom grec explicite est conservé dans la tournure française « lui et nos pères », qui met Jacob en tête du groupe.
- source_word: οἱ πατέρες ἡμῶν
  choice: nos pères
  rationale: La traduction littérale préserve le terme masculin et l’identification historique d’Étienne aux pères d’Israël; une note signale le sens contextuel « ancêtres ».
theological_decisions:
- issue: Sens de πατέρες dans l’histoire ancestrale d’Israël
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » maintient la formulation masculine et l’écho historique du grec, sans réduire l’expression à une ascendance générique. La note explicite le référent pour le lecteur moderne.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit historique. « Puis » évite une coordination lourde tout en conservant la succession exprimée par καί; la ponctuation sépare naturellement les deux propositions.
