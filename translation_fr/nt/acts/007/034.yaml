source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: fr
  text: 'J’ai bien vu les mauvais traitements infligés à mon peuple en Égypte[a], et j’ai entendu ses gémissements. Je suis descendu pour les délivrer. Et maintenant, viens : je t’enverrai en Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’affliction » ou « l’oppression subie par mon peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: J’ai bien vu
  rationale: La combinaison du participe et du verbe conjugué forme une tournure emphatique d’influence sémitique, en écho à Exode 3.7. « J’ai bien vu » en restitue naturellement l’insistance en français moderne.
- source_word: κάκωσιν
  choice: les mauvais traitements infligés
  rationale: Le nom désigne l’affliction causée par un traitement dur ou oppressif. Cette formulation claire conserve l’idée d’un tort subi sans réduire le sens à une seule forme d’oppression.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: mon peuple en Égypte
  rationale: Formulation française naturelle qui conserve le possessif et ses résonances d’appartenance, tout en indiquant le lieu.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: ses gémissements
  rationale: Le pronom grec est au singulier et renvoie collectivement au peuple. Le français peut conserver cet accord collectif avec « ses », tandis que le pluriel « gémissements » rend idiomatiquement στεναγμός.
- source_word: κατέβην
  choice: Je suis descendu
  rationale: Cette traduction conserve sans l’expliquer la représentation anthropomorphique de l’intervention divine et suit naturellement la valeur aoristique du grec.
- source_word: ἐξελέσθαι
  choice: pour les délivrer
  rationale: À la voix moyenne, ἐξαιρέω signifie ici arracher à une situation de détresse, délivrer ou secourir. « Délivrer » convient au registre biblique digne tout en restant compréhensible.
- source_word: δεῦρο
  choice: viens
  rationale: La particule a ici une force impérative et invite Moïse à s’avancer. « Viens » est direct et naturel.
- source_word: ἀποστείλω
  choice: je vais t’envoyer
  rationale: Le futur grec exprime l’envoi prochain de Moïse. Le futur périphrastique français est naturel dans ce discours direct et conserve la valeur de commission.
- source_word: εἰς Αἴγυπτον
  choice: en Égypte
  rationale: Pour une destination exprimée avec le nom d’un pays féminin, le français idiomatique emploie « en Égypte ».
theological_decisions:
- issue: Représentation anthropomorphique de la descente divine
  choice: Je suis descendu
  alternative: Je suis intervenu
  rationale: Le texte présente Dieu comme descendant pour agir. La traduction conserve cette image et sa tension théologique au lieu de la remplacer par une explication interprétative.
translation_notes:
  register: 'Français international moderne, naturel et digne. La citation conserve l’emphase initiale, l’image de la descente divine et la force directe de l’envoi de Moïse. Aucun marqueur [b] n’est ajouté : dans les données anglaises, la note correspondante est incohérente avec son emplacement après « come » et avec son contenu sur « deliver/rescue ».'
