  source_fidelity: 'Le sens est fidèlement rendu : l’emphase de ἰδὼν εἶδον, les mauvais traitements, les gémissements du peuple, la descente divine et la délivrance sont tous préservés. Toutefois, « maintenant donc » introduit une nuance consécutive (« donc ») qui n’est pas exprimée par καὶ νῦν ; « Et maintenant » correspond plus exactement à la coordination grecque.'
  naturalness: Le français est naturel, moderne et de registre biblique sobre. Le futur simple « je t’enverrai » rend plus directement le futur ἀποστείλω que le périphrastique « je vais t’envoyer », sans suggérer inutilement une imminence.
  terminology: « Mauvais traitements », « gémissements » et « délivrer » conviennent à κάκωσις, στεναγμός et ἐξελέσθαι. « Je suis descendu » préserve correctement l’image anthropomorphique du texte.
