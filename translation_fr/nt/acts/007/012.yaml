id: ACT.7.12
reference: Acts 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: fr
  text: Mais quand Jacob apprit qu’il y avait du blé en Égypte[a], il y envoya nos pères pour la première fois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des vivres en Égypte ». Le grec peut désigner plus largement des provisions, bien que le contexte évoque probablement du blé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: quand ... apprit
  rationale: Le participe aoriste a ici une valeur temporelle; cette tournure française naturelle maintient la succession des événements.
- source_word: δὲ
  choice: Mais
  rationale: Marque une transition légère dans le récit; « Mais » conserve le mouvement discursif sans créer une opposition trop forte.
- source_word: ὄντα σιτία εἰς Αἴγυπτον
  choice: qu’il y avait du blé en Égypte
  rationale: La construction accusatif-participe après ἀκούω est rendue comme un discours indirect idiomatique. Dans le contexte de la famine et du récit de Joseph, « blé » est le sens le plus probable.
- source_word: σιτία
  choice: blé
  rationale: Le pluriel peut désigner des vivres ou des provisions, mais le contexte de Genèse 42 favorise ici le blé ou les céréales destinées à l’alimentation.
- source_word: ἐξαπέστειλεν
  choice: il y envoya
  rationale: « Envoya » exprime naturellement l’action; le pronom « y » indique la destination déjà nommée sans surtraduire la valeur du préverbe ἐξ-.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nos pères
  rationale: Conserve l’expression familiale masculine du grec, qui désigne ici précisément les ancêtres mâles d’Israël, les fils de Jacob.
- source_word: πρῶτον
  choice: pour la première fois
  rationale: Rend clairement la première de plusieurs visites et prépare la mention ultérieure du second voyage.
theological_decisions:
- issue: Traduction de τοὺς πατέρας ἡμῶν
  choice: nos pères
  alternative: nos ancêtres; les patriarches
  rationale: « Nos pères » préserve la formulation familiale et collective du discours d’Étienne. Dans ce contexte, le référent est masculin et précis; « nos ancêtres » serait plus général, tandis que « les patriarches » ajouterait une désignation interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure narrative grecque tout en évitant un calque; « nos pères » conserve la portée historique et familiale du discours.
