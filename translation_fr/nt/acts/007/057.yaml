  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: fr
  text: Mais ils poussèrent de grands cris, se bouchèrent les oreilles et se précipitèrent tous ensemble[a] sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’un commun accord ». Le mot grec souligne qu’ils agissent unanimement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: ils poussèrent de grands cris
  rationale: Le participe aoriste de κράζω exprime des cris forts. La coordination française rend naturellement l’enchaînement avec les actions suivantes, sans préciser davantage la tonalité émotionnelle.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici le contraste entre la vision annoncée par Étienne et la réaction hostile de ses auditeurs.
- source_word: φωνῇ μεγάλῃ
  choice: de grands cris
  rationale: Associée à κράξαντες, l’expression indique qu’ils crient très fort. Cette tournure idiomatique évite la formulation moins naturelle « crièrent d’une grande voix ».
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: se bouchèrent les oreilles
  rationale: L’expression désigne le geste consistant à fermer ou couvrir ses oreilles pour ne plus entendre; « se boucher les oreilles » est l’équivalent français courant et précis.
- source_word: ὥρμησαν
  choice: se précipitèrent
  rationale: Le verbe évoque un mouvement soudain et impétueux. « Se précipitèrent » transmet cette force sans ajouter explicitement une violence que le contexte suffit à suggérer.
- source_word: ὁμοθυμαδὸν
  choice: d’un même élan
  rationale: L’adverbe souligne que le groupe agit de manière unie, animé d’une même impulsion. « D’un même élan » convient au mouvement décrit et reste naturel en français.
- source_word: ἐπ’ αὐτόν
  choice: sur lui
  rationale: Avec un verbe de mouvement, ἐπί suivi de l’accusatif indique que l’élan est dirigé vers Étienne; « sur lui » exprime idiomatiquement cette ruée hostile.
theological_decisions: []
