- from: vous qui avez reçu la Loi selon des dispositions transmises par des anges[a], mais qui ne l’avez pas observée.
  to: vous qui avez reçu la Loi par l’intermédiaire d’anges[a] et ne l’avez pas observée.
  rationale: La révision rend explicitement et naturellement l’idée centrale d’une médiation angélique, attestée par le contexte, tout en réservant dans la note les nuances discutées de διαταγαί et de la préposition εἰς. Elle évite de présenter comme donnée textuelle l’idée que les anges auraient reçu une charge particulière.
