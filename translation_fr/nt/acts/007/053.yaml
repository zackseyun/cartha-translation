  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: fr
  text: vous qui avez reçu la Loi par l’intermédiaire d’anges[a] et ne l’avez pas observée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon des dispositions d’anges » ou « sur l’ordre d’anges ». La formule grecque est difficile; elle évoque l’intervention d’anges dans le don ou la transmission de la Loi, sans en préciser exactement le rôle.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: vous qui
  rationale: Le relatif à valeur qualitative reprend directement les auditeurs d’Étienne; « vous qui » conserve à la fois l’adresse à la deuxième personne et la force accusatrice.
- source_word: ἐλάβετε
  choice: avez reçu
  rationale: L’aoriste de λαμβάνω désigne ici la réception de la Loi, sans impliquer plus que le texte une acceptation volontaire.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: Le contexte désigne la Loi mosaïque. La majuscule, courante en français pour ce référent déterminé, favorise la clarté sans modifier le sens.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: selon des dispositions transmises par des anges
  rationale: La formule grecque est difficile. « Selon des dispositions » garde la notion d’ordonnance ou d’organisation portée par διαταγαί, tandis que « transmises par des anges » rend intelligible la médiation angélique suggérée par le contexte, sans en préciser excessivement le mécanisme.
- source_word: ἀγγέλων
  choice: anges
  rationale: Le contexte de la remise de la Loi renvoie à des êtres célestes plutôt qu’à des messagers humains.
- source_word: οὐκ ἐφυλάξατε
  choice: mais qui ne l’avez pas observée
  rationale: Avec la Loi pour objet, φυλάσσω signifie la garder au sens de la mettre en pratique ou de l’observer. Le pronom « l’ » explicite naturellement l’objet sous-entendu; « mais » fait ressortir le contraste accusateur porté par καί dans ce contexte.
theological_decisions:
- issue: Sens de la formule εἰς διαταγὰς ἀγγέλων
  choice: La Loi a été reçue selon des dispositions transmises par des anges, ce qui exprime une médiation angélique sans en définir précisément les modalités.
  alternative: « par l’intermédiaire d’anges qui en avaient reçu la charge » ou, plus littéralement, « selon des dispositions d’anges »
  rationale: Le passage évoque clairement l’intervention d’anges lors du don de la Loi, mais la relation exacte exprimée par εἰς διαταγὰς demeure discutée. La traduction principale conserve cette tension, et la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le caractère direct et accusateur de la conclusion du discours. La formulation principale reste intelligible tout en signalant en note l’ambiguïté réelle de la formule grecque.
