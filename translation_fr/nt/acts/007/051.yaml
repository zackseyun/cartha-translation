revisions:
- from: Vous qui êtes obstinés, incirconcis de cœur et d’oreilles, vous résistez toujours à l’Esprit Saint ! Comme vos pères[a], vous aussi.
  to: Vous qui avez la nuque raide et qui êtes incirconcis de cœur et d’oreilles, vous résistez toujours à l’Esprit Saint ! Comme vos pères l’ont fait, vous le faites aussi.
  rationale: La révision rétablit la métaphore de la « nuque raide » tout en conservant une formulation compréhensible en français international moderne. Elle explicite seulement, dans la comparaison finale, le verbe déjà gouvernant (« résister »), afin de respecter le parallélisme grec et de produire une phrase française complète. La note sur « pères » est conservée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:09:04Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction conserve correctement l’accusation, l’image de l’incirconcision du cœur et des oreilles, l’opposition persistante à l’Esprit Saint et la comparaison avec les pères. Toutefois, « obstinés » atténue et efface l’image volontairement vive de Σκληροτράχηλοι (« au cou raide »). La dernière comparaison elliptique est également inachevée en français moderne.
  naturalness: « Incirconcis de cœur et d’oreilles » et « résistez toujours à l’Esprit Saint » sont naturels dans un registre biblique moderne. Une reprise explicite du verbe à la fin rend la phrase pleinement idiomatique et claire en français sans ajouter de sens.
  terminology: « Esprit Saint » est approprié. « Incirconcis » doit être maintenu en raison de l’image prophétique et covenantale. « Vos pères », accompagné de la note « vos ancêtres », rend fidèlement πατέρες.
  issues:
  - severity: medium
    issue: L’image de Σκληροτράχηλοι est aplatie en « obstinés ».
    rationale: Le grec emploie une métaphore biblique forte, littéralement liée à un cou/une nuque raide. « Obstinés » en donne une interprétation valable, mais ne préserve pas l’image ni sa résonance scripturaire.
  - severity: medium
    issue: La clausule « Comme vos pères, vous aussi » est trop elliptique en français moderne.
    rationale: Le grec peut laisser le verbe sous-entendu, mais le français demande ici une reprise verbale pour former une comparaison claire et achevée.
  revised_text: Vous qui avez la nuque raide et qui êtes incirconcis de cœur et d’oreilles, vous résistez toujours à l’Esprit Saint ! Comme vos pères l’ont fait, vous le faites aussi.
  revised_footnotes:
