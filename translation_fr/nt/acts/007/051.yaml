source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: fr
  text: Vous qui avez la nuque raide et qui êtes incirconcis de cœur et d’oreilles, vous résistez toujours à l’Esprit Saint ! Comme vos pères l’ont fait, vous le faites aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: vous qui êtes obstinés
  rationale: Littéralement « au cou raide ». En français actuel, « obstinés » transmet clairement l’accusation de refus inflexible, tandis qu’une traduction mot à mot serait peu naturelle.
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: incirconcis de cœur et d’oreilles
  rationale: Conserve l’image corporelle et l’arrière-plan d’alliance du langage prophétique, avec la tournure française idiomatique « de cœur et d’oreilles ».
- source_word: ἀεὶ
  choice: toujours
  rationale: Exprime le caractère constant et répété de leur opposition.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: à l’Esprit Saint
  rationale: Formulation française contemporaine et usuelle pour le référent divin personnel dans les Actes.
- source_word: ἀντιπίπτετε
  choice: vous résistez
  rationale: Rend directement l’opposition active exprimée par le verbe grec, sans surinterprétation.
- source_word: οἱ πατέρες ὑμῶν
  choice: vos pères
  rationale: Préserve le terme familial masculin du grec et sa force rhétorique; une note signale le sens générationnel possible.
- source_word: ὡς … καὶ ὑμεῖς
  choice: Comme vos pères, vous aussi
  rationale: Reproduit naturellement la comparaison elliptique grecque sans ajouter un verbe absent, celui-ci étant aisément repris du contexte.
theological_decisions:
- issue: Image de l’incirconcision intérieure
  choice: Maintenir « incirconcis de cœur et d’oreilles »
  alternative: « fermés de cœur et sourds »
  rationale: L’image renvoie au langage prophétique de l’alliance; l’expliciter en simples dispositions psychologiques ferait perdre cette résonance théologique.
- issue: Référence de « l’Esprit Saint »
  choice: Le référent divin personnel, avec majuscules
  alternative: Une influence ou disposition sainte impersonnelle
  rationale: Dans le contexte des Actes, l’expression articulée désigne normalement l’Esprit Saint personnel; la graphie française conventionnelle reflète ce contexte sans développer le texte.
- issue: Désignation des générations antérieures
  choice: « vos pères » dans le texte
  alternative: « vos ancêtres »
  rationale: Le grec emploie explicitement le masculin πατέρες. Le texte le conserve, tandis que la note donne l’équivalent générationnel naturel.
translation_notes:
  register: Français international moderne, vigoureux et digne. L’ouverture interprète l’idiome biblique littéral « au cou raide » par « obstinés » pour être immédiatement comprise, tout en conservant intacte l’image covenantale plus essentielle de l’incirconcision du cœur et des oreilles. L’exclamation marque la force de l’apostrophe.
