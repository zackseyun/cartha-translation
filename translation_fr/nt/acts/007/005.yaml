id: ACT.7.5
reference: Acts 7:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: fr
  text: Il ne lui donna dans ce pays aucun héritage, pas même de quoi poser le pied[a]. Mais il promit de le lui donner comme possession, à lui et à sa descendance après lui, bien qu’il n’ait pas d’enfant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque désigne la plus petite parcelle de terrain possible. Autres traductions : « pas même un bout de terre où poser le pied » ou « pas même un pied de terrain ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « alors qu’il n’avait pas d’enfant ». La construction grecque peut aussi se comprendre dans un sens temporel : « quand il n’avait pas d’enfant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: héritage
  rationale: Préserve le sens juridique et l’arrière-plan de la promesse concernant le pays, plutôt que le terme plus général « propriété ».
- source_word: οὐδὲ βῆμα ποδός
  choice: pas même de quoi poser le pied
  rationale: Expression française naturelle et imagée pour la plus petite parcelle possible, correspondant à l’idiome grec.
- source_word: ἐπηγγείλατο
  choice: promit
  rationale: Rend directement et naturellement l’engagement divin exprimé par le verbe grec.
- source_word: εἰς κατάσχεσιν
  choice: en possession
  rationale: Exprime clairement que le pays devait lui être donné pour qu’il le possède.
- source_word: σπέρματι
  choice: descendance
  rationale: Le nom collectif français correspond au sens collectif de σπέρμα dans la promesse faite à Abraham, sans l’archaïsme de « postérité ».
- source_word: μετ’ αὐτόν
  choice: après lui
  rationale: Conserve directement l’idée de succession temporelle.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: bien qu’il n’ait pas encore d’enfant
  rationale: Le tour concessif fait ressortir le contraste contextuel entre la promesse et l’absence d’enfant; « encore » explicite naturellement la situation au moment de la promesse sans nier la naissance ultérieure.
- source_word: τέκνου
  choice: enfant
  rationale: τέκνον ne désigne pas spécifiquement un fils; « enfant » en conserve toute l’étendue.
theological_decisions:
- issue: Valeur circonstancielle de l’absence d’enfant d’Abraham lors de la promesse
  choice: bien qu’il n’ait pas encore d’enfant
  alternative: alors qu’il n’avait pas d’enfant / quand il n’avait pas d’enfant
  rationale: 'Le génitif absolu peut être compris temporellement, mais le contexte donne une forte portée concessive: Dieu fait la promesse malgré l’absence présente d’un enfant. La note conserve la possibilité temporelle.'
translation_notes:
  register: Français international moderne, digne et accessible. « Dans ce pays » lève naturellement l’ambiguïté référentielle du pronom féminin grec, dont l’antécédent est le pays mentionné au verset précédent. « De quoi poser le pied » restitue l’idiome foncier sans suggérer simplement la longueur d’un pied.
