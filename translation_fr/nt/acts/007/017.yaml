source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: fr
  text: Or, alors que le temps de la promesse que Dieu avait faite[a] à Abraham approchait, le peuple s’accrut et se multiplia en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il avait promise à Abraham » ou « par laquelle il s’était engagé envers Abraham ». Le verbe grec peut désigner un engagement déclaré ; « avait faite » correspond à l’expression française naturelle « faire une promesse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: Mais, à mesure que
  rationale: Καθώς introduit ici une progression temporelle, tandis que δέ marque une transition légère. « À mesure que » rend le déroulement exprimé par l’imparfait, et « mais » conserve le mouvement du discours sans créer une opposition trop forte.
- source_word: ἤγγιζεν
  choice: approchait
  rationale: L’imparfait présente le moment promis comme étant progressivement plus proche. « Approchait » exprime naturellement cet aspect en français.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: le temps de la promesse
  rationale: La formulation directe respecte χρόνος, qui désigne ici le temps, sans ajouter l’idée d’un « moment fixé » que le grec n’explicite pas.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: que Dieu avait faite à Abraham
  rationale: Dans ce contexte, ὁμολογέω désigne un engagement déclaré. L’expression française idiomatique « faire une promesse » communique ce sens sans renforcer le texte en parlant d’un serment.
- source_word: ηὔξησεν ὁ λαὸς
  choice: le peuple s’accroissait
  rationale: Le verbe exprime la croissance du peuple pris collectivement. L’imparfait français concorde avec la progression temporelle de la phrase et « s’accroissait » maintient la distinction avec le verbe suivant.
- source_word: καὶ ἐπληθύνθη
  choice: et se multipliait
  rationale: « Se multipliait » rend le devenir nombreux tout en conservant le parallélisme et la distinction lexicale avec « s’accroissait ».
- source_word: ἐν Αἰγύπτῳ
  choice: en Égypte
  rationale: Traduction locative française normale du nom géographique.
theological_decisions:
- issue: Sens de ὡμολόγησεν à propos de la promesse divine faite à Abraham
  choice: « avait faite » dans « la promesse que Dieu avait faite à Abraham »
  alternative: « avait promise » ou « s’était engagé à tenir »
  rationale: « Avait faite » est idiomatique en français et présente clairement l’engagement de Dieu. Cette formulation évite d’introduire la notion plus forte d’un serment, qui n’est pas explicitement exprimée par le verbe employé ici.
translation_notes:
  register: Français international moderne, fluide et digne. Les imparfaits rendent le caractère progressif de l’approche du temps promis et de la croissance du peuple. La répétition « s’accroissait et se multipliait » conserve le parallélisme du grec sans archaïsme.
