  text: Εἶπεν δὲ ὁ ἀρχιερεύς· ⸀Εἰ ταῦτα οὕτως ἔχει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/001.yaml
  text: Then the high priest said[a], “Are these things so?”
translation:
  language: fr
  text: 'Alors le grand prêtre demanda : « Ces choses sont-elles ainsi ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Est-ce bien ainsi ? » Plus explicitement : « Ces accusations sont-elles vraies ? »'
    reason: Le pluriel grec renvoie à ce qui vient d’être allégué. La première variante donne une tournure française plus idiomatique; la seconde explicite le référent contextuel sans en faire le texte principal.
lexical_decisions:
- source_word: Εἶπεν
  choice: demanda
  rationale: Le verbe signifie formellement « dit », mais comme il introduit ici une question directe dans un interrogatoire, « demanda » est le tour français le plus naturel sans modifier la fonction narrative.
- source_word: δὲ
  choice: Alors
  rationale: La particule marque ici la progression du récit; « Alors » assure une transition naturelle avec les accusations qui précèdent.
- source_word: ὁ ἀρχιερεύς
  choice: le grand-prêtre
  rationale: C’est l’équivalent français usuel et précis du singulier ἀρχιερεύς dans ce cadre judiciaire.
- source_word: Εἰ
  choice: Est-ce
  rationale: Dans une question directe, εἰ introduit une interrogation totale; la tournure française « Est-ce… ? » en restitue naturellement la valeur.
- source_word: ταῦτα
  choice: ainsi
  rationale: Le démonstratif pluriel renvoie aux faits ou accusations précédemment exposés. Dans l’expression idiomatique choisie, cette référence reste implicite; une note conserve les formulations plus explicites.
- source_word: οὕτως ἔχει
  choice: bien ainsi
  rationale: L’expression signifie « être ainsi », « être le cas ». « Est-ce bien ainsi ? » rend idiomatiquement la demande de confirmation, tandis que « bien » souligne la vérification sans présumer la vérité des accusations.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Grand-prêtre » convient au contexte du conseil; « demanda » est plus naturel en français que « dit » devant une question. La note préserve le pluriel et l’ambiguïté référentielle du grec.
