  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: fr
  text: 'Il lui dit : « Quitte ton pays et ta parenté[a], et viens dans le pays que je te montrerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes proches » ou « ta famille ». Le grec συγγένεια désigne l’ensemble des personnes unies par des liens de parenté.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: Il lui dit
  rationale: Cette formulation garde le pronom du grec et rend naturellement la tournure narrative, sans remplacer celui-ci par le nom d’Abraham.
- source_word: Ἔξελθε
  choice: Quitte
  rationale: Dans ce contexte, l’impératif « quitte » exprime naturellement le départ demandé. Une traduction plus formelle comme « sors de » serait moins idiomatique avec « pays » en français.
- source_word: ἐκ τῆς γῆς σου
  choice: ton pays
  rationale: Ici, γῆ désigne le territoire auquel Abraham appartient. « Pays » est naturel en français et n’implique pas nécessairement un État-nation moderne.
- source_word: συγγενείας
  choice: parenté
  rationale: « Parenté » conserve le sens collectif du groupe uni par des liens familiaux, sans le limiter à la famille immédiate.
- source_word: δεῦρο
  choice: viens
  rationale: L’adverbe employé comme impératif porte une nuance déictique de venue, que « viens » préserve mieux que « va ».
- source_word: εἰς τὴν γῆν
  choice: dans le pays
  rationale: « Dans » rend le mouvement vers l’intérieur exprimé par εἰς, tout en reprenant « pays » pour le second emploi de γῆ.
- source_word: ἣν ἄν σοι δείξω
  choice: que je te montrerai
  rationale: Le relatif avec ἄν et le subjonctif a ici une orientation future. Le futur simple français rend clairement et naturellement cette valeur.
theological_decisions: []
