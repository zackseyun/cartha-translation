id: ACT.7.9
reference: Acts 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: fr
  text: Les patriarches, jaloux de Joseph, le vendirent pour l’Égypte, et Dieu était avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: les patriarches
  rationale: Le terme désigne ici les fils de Jacob, ancêtres fondateurs des tribus d’Israël. « Patriarches » est précis, usuel dans ce contexte biblique et plus spécifique qu’« ancêtres ».
- source_word: ζηλώσαντες
  choice: jaloux de Joseph
  rationale: Le participe aoriste indique le mobile de leur action. Cette formulation française naturelle conserve la force affective de ζηλόω sans alourdir la phrase.
- source_word: ἀπέδοντο
  choice: le vendirent
  rationale: Dans le récit de Joseph, le verbe désigne concrètement sa vente. « Vendirent » rend ce sens plus clairement que « livrèrent » ou « cédèrent ».
- source_word: εἰς Αἴγυπτον
  choice: pour qu’il soit emmené en Égypte
  rationale: 'Avec le verbe « vendre », le grec indique l’issue ou la destination de la vente : Joseph fut vendu de manière à être conduit en Égypte. Cette formulation évite le français ambigu ou peu naturel « le vendirent en Égypte », qui pourrait laisser entendre que la vente eut lieu dans ce pays.'
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: Dieu était avec lui
  rationale: La formulation simple et directe restitue l’affirmation de la présence divine auprès de Joseph, sans explicitation théologique ajoutée.
theological_decisions:
- issue: La présence de Dieu au milieu de la souffrance de Joseph
  choice: Mais Dieu était avec lui
  alternative: et Dieu était avec lui
  rationale: Le grec emploie καί, qui peut être simplement coordonnant, mais le contexte crée un contraste net entre la trahison des patriarches et la présence de Dieu. « Mais » exprime naturellement ce rapport discursif en français sans développer la notion de providence au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. La destination égyptienne est explicitée de façon idiomatique afin d’éviter une fausse lecture du lieu de la vente.
