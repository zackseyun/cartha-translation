revisions:
- from: « Mais la nation dont ils seront les esclaves, c’est moi qui la jugerai, dit Dieu. Après cela, ils sortiront et me rendront un culte en ce lieu. »
  to: « Et la nation qu’ils serviront[a], moi, je la jugerai, dit Dieu. Après ces événements, ils sortiront et me rendront un culte en ce lieu. »
  rationale: La révision rétablit la coordination du grec, conserve la formulation verbale de δουλεύω et place son sens de servitude dans une note. Elle maintient l’emphase divine, le sens cultuel de λατρεύω et le démonstratif spatial, tout en employant un français moderne et naturel.
