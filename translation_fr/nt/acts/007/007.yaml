id: ACT.7.7
reference: Acts 7:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: fr
  text: « Et la nation qu’ils serviront[a], moi, je la jugerai, dit Dieu. Après ces événements, ils sortiront et me rendront un culte en ce lieu. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie « servir »; dans ce contexte, il désigne un service imposé, une condition d’asservissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: nation
  rationale: Le terme désigne ici l’entité collective et politique qui asservira la descendance d’Abraham, en écho à Genèse 15.14.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: dont ils seront les esclaves
  rationale: Avec son complément au datif, δουλεύω exprime le service en condition d’esclave. Dans ce contexte explicite d’asservissement en Égypte, cette formulation française restitue le sens sans l’affaiblir en simple « servir ».
- source_word: κρινῶ ἐγώ
  choice: c’est moi qui la jugerai
  rationale: La tournure met en valeur le pronom sujet emphatique ἐγώ, tandis que « juger » conserve la portée judiciaire de κρίνω.
- source_word: ὁ θεὸς εἶπεν
  choice: dit Dieu
  rationale: Cette incise brève et naturelle en français conserve l’attribution explicite de la parole à Dieu.
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: Cette expression française naturelle marque fidèlement la succession des événements exprimée par le grec.
- source_word: ἐξελεύσονται
  choice: ils sortiront
  rationale: Le verbe évoque directement la sortie du pays d’asservissement et convient à l’arrière-plan de l’Exode.
- source_word: λατρεύσουσίν μοι
  choice: me rendront un culte
  rationale: λατρεύω désigne ici un service religieux rendu à Dieu. « Rendre un culte » préserve cette nuance plus précisément que le général « servir ».
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: en ce lieu
  rationale: Formulation claire et digne, qui conserve le démonstratif et la référence spatiale du texte grec.
theological_decisions:
- issue: Sens de δουλεύω dans le contexte de l’asservissement
  choice: dont ils seront les esclaves
  alternative: qu’ils serviront / au service de laquelle ils seront
  rationale: Le contexte de la descendance d’Abraham opprimée en Égypte donne au verbe le sens concret d’un service servile. Le français « seront les esclaves » rend explicitement ce que la construction grecque implique, sans introduire une doctrine particulière.
- issue: Sens cultuel de λατρεύω lorsque Dieu en est le destinataire
  choice: me rendront un culte
  alternative: me serviront / m’adoreront
  rationale: « Rendre un culte » exprime le service religieux sans réduire le terme à un travail ordinaire ni le limiter au seul acte d’adoration.
- issue: Emphase de κρινῶ ἐγώ
  choice: c’est moi qui la jugerai
  alternative: je jugerai cette nation
  rationale: La dislocation française reproduit naturellement l’insistance portée par le pronom grec explicite ἐγώ.
translation_notes:
  register: Français international moderne, naturel et digne. La traduction conserve la forme de discours divin, rend explicitement la servitude imposée par la nation et distingue cette servitude du culte rendu à Dieu.
