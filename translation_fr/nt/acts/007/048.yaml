  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: fr
  text: 'Mais le Très-Haut n’habite pas dans ce qui est fait de mains humaines[a], comme le dit le prophète :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans des temples faits de mains humaines ». Le grec a un sens plus large : « dans ce qui est fait de mains humaines », bien que le temple soit ici le contexte immédiat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque nettement le contraste avec la mention précédente de la maison construite par Salomon.
- source_word: ὁ ὕψιστος
  choice: le Très-Haut
  rationale: Conserve le titre divin traditionnel sans ajouter « Dieu », absent du grec.
- source_word: ἐν χειροποιήτοις
  choice: dans ce qui est fait de main humaine
  rationale: Rend le sens général de l’adjectif substantivé pluriel tout en restant naturel en français; le contexte vise immédiatement les temples, mais l’expression grecque est plus large.
- source_word: κατοικεῖ
  choice: n’habite pas
  rationale: Convient au thème de la demeure et de la présence divines, tout en restant courant et digne.
- source_word: καθὼς
  choice: comme
  rationale: Introduit naturellement la confirmation scripturaire qui suit.
- source_word: ὁ προφήτης λέγει
  choice: le dit le prophète
  rationale: Respecte le présent de la formule de citation et n’ajoute pas le nom d’Ésaïe, absent du texte.
theological_decisions:
- issue: Faut-il restreindre χειροποιήτοις aux temples dans le texte principal ?
  choice: Conserver l’expression plus large « ce qui est fait de main humaine »
  alternative: « des temples faits de main humaine »
  rationale: Le temple est le référent immédiat, mais le grec demeure plus général et peut évoquer plus largement ce que fabriquent les humains. La formulation retenue préserve cette portée sans nier le contexte.
- issue: Faut-il expliciter ὁ ὕψιστος par « le Dieu Très-Haut » ?
  choice: « le Très-Haut »
  alternative: « le Dieu Très-Haut »
  rationale: Le titre désigne clairement Dieu, mais θεός n’est pas exprimé. Il convient de ne pas ajouter cette précision dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. « Fait de main humaine » évite l’ambiguïté possible de « fait à la main » et conserve l’opposition entre le Très-Haut et les réalisations humaines.
