id: ACT.7.37
reference: Acts 7:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: fr
  text: 'C’est ce Moïse qui a dit aux fils d’Israël[a] : « Dieu suscitera pour vous, parmi vos frères[b], un prophète comme moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « aux enfants d’Israël » ou « aux Israélites » ; le grec dit littéralement « aux fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne les autres membres du peuple d’Israël.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: C’est ce Moïse
  rationale: Cette tournure française conserve l’identification insistante et contrastive du grec tout en restant naturelle; « le Moïse » serait peu idiomatique.
- source_word: ὁ εἴπας
  choice: qui a dit
  rationale: Le participe aoriste attributif est rendu naturellement en français par une proposition relative au passé composé.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: aux fils d’Israël
  rationale: Rend directement υἱοῖς et maintient l’écho de la formulation biblique, sans remplacer silencieusement le terme par « Israélites ».
- source_word: Προφήτην
  choice: un prophète
  rationale: Le nom est sans article dans la citation; « un prophète » en conserve la formulation sans imposer dans le texte l’interprétation titularisée « le Prophète ».
- source_word: ἀναστήσει
  choice: suscitera
  rationale: Dans ce contexte prophétique, « susciter » exprime naturellement l’action de Dieu faisant surgir et établissant un prophète, tout en évitant une lecture exclusivement liée à la résurrection.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Rendu français normal du sujet défini dans cet emploi.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: parmi vos frères
  rationale: « Parmi » préserve l’idée d’origine au sein du groupe; « frères » garde le langage familial et national du grec.
- source_word: ὡς ἐμέ
  choice: comme moi
  rationale: Rend directement et idiomatiquement la comparaison avec Moïse.
theological_decisions:
- issue: Citation de Deutéronome 18.15 et portée messianique
  choice: « un prophète » dans le texte principal
  alternative: « le Prophète »
  rationale: Le contexte des Actes donne à la citation une portée christologique, mais Προφήτην est ici sans article. La traduction conserve donc la formulation immédiate sans transformer explicitement le nom en titre ni résoudre l’interprétation dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « C’est ce Moïse » garde l’emphase du grec sans produire le tour artificiel « le Moïse ». La ponctuation française et les guillemets français sont employés.
