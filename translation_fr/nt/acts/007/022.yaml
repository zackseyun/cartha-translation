source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: fr
  text: Moïse fut instruit dans toute la sagesse des Égyptiens, et il était puissant en paroles et en actes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ses paroles et ses actes ».
    reason: Le pronom αὐτοῦ peut être explicité par un possessif en français ; l’expression principale emploie la tournure idiomatique « en paroles et en actes ».
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: fut formé
  rationale: Le passif désigne ici la formation reçue par Moïse. « Fut formé » est naturel en français moderne et convient au contexte du savoir égyptien, sans limiter le sens à une simple instruction ponctuelle.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: à toute la sagesse des Égyptiens
  rationale: Cette formulation rend le contenu de la formation et conserve l’ampleur de πάσῃ ainsi que l’attribution de cette sagesse aux Égyptiens.
- source_word: δυνατὸς
  choice: puissant
  rationale: « Puissant » conserve la force de δυνατός et s’emploie de façon naturelle avec les paroles et les actes, là où « capable » affaiblirait le propos.
- source_word: ἐν λόγοις καὶ ἔργοις αὐτοῦ
  choice: dans ses paroles et ses actes
  rationale: La formulation garde le parallélisme entre λόγοις et ἔργοις et rend explicitement αὐτοῦ par le possessif « ses ». « Actes » exprime ici naturellement les actions accomplies.
theological_decisions:
- issue: Portée de la puissance de Moïse dans ses paroles
  choice: il était puissant dans ses paroles et ses actes
  alternative: Interpréter la phrase comme visant seulement sa réputation, son influence ou l’efficacité de son action
  rationale: La déclaration d’Étienne est traduite selon ses propres termes, sans l’harmoniser avec Exode 4.10. La tension entre les deux passages demeure donc intacte.
translation_notes:
  register: Français international moderne, digne et accessible. « Fut formé » évite une tournure scolaire trop étroite, tandis que « puissant dans ses paroles et ses actes » reste proche de la structure grecque et conserve le possessif explicite.
