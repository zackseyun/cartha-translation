  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: fr
  text: 'Puis il se mit à genoux et cria d’une voix forte : « Seigneur, ne leur impute pas ce péché ! » Après avoir dit cela, il s’endormit[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « s’endormit » est une manière courante de parler de la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: Puis il se mit à genoux
  rationale: L’expression idiomatique signifie littéralement qu’il posa les genoux, donc qu’il s’agenouilla. « Se mit à genoux » est naturel en français moderne, tandis que « Puis » marque la progression du récit portée par δέ.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Cette formulation conserve explicitement à la fois l’idée du cri exprimée par κράζω et celle de la voix forte exprimée par φωνῇ μεγάλῃ.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans le contexte immédiat, l’appel s’adresse à Jésus. « Seigneur » préserve le titre respectueux et christologique usuel de κύριος sans ajouter d’explication au texte.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: ne leur tiens pas compte de ce péché
  rationale: Ici, ἵστημι évoque le fait d’imputer ou de porter une faute au compte de quelqu’un. Cette tournure française naturelle garde ce sens quasi judiciaire et rend explicitement le démonstratif ταύτην par « ce ».
- source_word: καὶ τοῦτο εἰπὼν
  choice: Après avoir dit cela
  rationale: La construction participiale exprime la succession temporelle. Cette formulation est fluide en français et maintient le lien avec la prière précédente.
- source_word: ἐκοιμήθη
  choice: il s’endormit
  rationale: Le verbe conserve ici la métaphore traditionnelle du sommeil pour évoquer la mort. La traduction maintient cette image plutôt que de l’aplatir en « il mourut ».
theological_decisions:
- issue: Métaphore de la mort dans ἐκοιμήθη
  choice: il s’endormit
  alternative: il mourut
  rationale: Le grec présente la mort d’Étienne sous l’image du sommeil. Garder cette image respecte la formulation et la tonalité théologique du texte sans en tirer davantage que ce que dit le verset.
- issue: Destinataire de l’invocation Κύριε
  choice: Seigneur
  alternative: Maître
  rationale: Le contexte du verset précédent indique que la prière est adressée à Jésus. « Seigneur » conserve le titre du texte grec et sa portée christologique sans développement interprétatif ajouté.
- issue: Portée de μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: ne leur tiens pas compte de ce péché
  alternative: ne leur impute pas ce péché
  rationale: La formulation choisie préserve le sens d’une faute qui ne doit pas être portée à leur compte, tout en restant immédiatement compréhensible pour des lecteurs modernes.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la progression grecque sans tournures littérales pesantes. La métaphore finale est conservée et brièvement explicitée en note.
