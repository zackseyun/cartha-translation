source:
  edition: SBLGNT
  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: fr
  text: À ces mots[a], Moïse s’enfuit et s’établit comme étranger[b] dans le pays de Madian, où il eut deux fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de cette parole ». L’expression grecque peut indiquer que cette déclaration fut la cause immédiate de la fuite de Moïse.
    reason: lexical_alternative
  - marker: b
    text: Ou « vécut comme étranger » ou « devint un résident étranger ». Le terme grec désigne quelqu’un qui réside dans un pays qui n’est pas le sien.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: L’aoriste de φεύγω exprime ici la fuite de Moïse; « s’enfuit » est précis, naturel et conserve le caractère soudain du départ.
- source_word: δὲ
  choice: et
  rationale: δέ assure ici une transition narrative légère. En français, « et » relie naturellement la fuite à l’installation en Madian sans imposer une valeur adversative.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: À cette parole
  rationale: 'Cette formulation compacte conserve l’image grecque et laisse ouverte la nuance circonstancielle ou causale: Moïse fuit en réaction à ce qui vient d’être dit.'
- source_word: ἐγένετο πάροικος
  choice: alla vivre en étranger
  rationale: πάροικος désigne une personne qui réside dans un pays qui n’est pas le sien. « Alla vivre en étranger » rend ce statut dans un français actuel et accessible, sans suggérer nécessairement un séjour bref.
- source_word: ἐν γῇ Μαδιάμ
  choice: dans le pays de Madian
  rationale: La traduction garde explicitement γῇ et emploie la forme française traditionnelle et courante du toponyme, « Madian ».
- source_word: οὗ
  choice: où
  rationale: L’adverbe relatif renvoie au pays de Madian et introduit naturellement le lieu où Moïse eut ses fils.
- source_word: ἐγέννησεν
  choice: eut
  rationale: Avec un homme pour sujet, γεννάω signifie qu’il devint père. « Eut deux fils » est naturel en français et exprime clairement ce sens, tandis que « engendra » serait plus soutenu et moins courant.
- source_word: υἱοὺς δύο
  choice: deux fils
  rationale: Rendu direct, exact et idiomatique du syntagme grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « À cette parole » préserve la concision et la possible nuance causale du grec; « alla vivre en étranger » évite l’archaïsme de « séjourna comme étranger » et le vocabulaire administratif de « résident étranger ».
