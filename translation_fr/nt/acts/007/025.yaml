  verdict: revise
  source_fidelity: 'Le sens global est fidèle : Moïse croyait que les Israélites comprenaient que Dieu leur accordait la délivrance par son action, alors qu’ils ne l’ont pas compris. Toutefois, le conditionnel « comprendraient » introduit une nuance de postériorité ou de résultat attendu qui n’est pas portée par l’infinitif présent συνιέναι, lequel est contemporain de ἐνόμιζεν. L’imparfait « comprenaient » rend plus exactement cette relation.'
  naturalness: Le français est naturel et de registre moderne. « Par son intermédiaire » est idiomatique, même si la note doit signaler l’image littérale de la main.
  terminology: '« Frères », « délivrance » et « comprendre » sont des choix appropriés. La répétition comprendre/comprendre reflète utilement celle du grec. Les ancres de note doivent toutefois correspondre aux éléments expliqués : dans le texte soumis, la note sur « salut » est ancrée à « par son intermédiaire » plutôt qu’à « délivrance ».'
  issues:
