  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: fr
  text: Il pensait que ses frères[a] comprenaient que Dieu leur accordait la délivrance[b] par son intermédiaire[c], mais ils ne comprirent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « frères » de Moïse sont ici les autres Israélites.
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « salut ». Le terme grec peut désigner le salut, le secours ou la délivrance ; le contexte évoque ici la délivrance d’Israël par l’intermédiaire de Moïse.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « par sa main ». Le grec présente Moïse comme l’intermédiaire par lequel Dieu agit.'
    reason: idiom_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: Il pensait
  rationale: L’imparfait grec présente la pensée de Moïse à l’arrière-plan du récit. L’imparfait français est naturel et en conserve la valeur.
- source_word: συνιέναι / συνῆκαν
  choice: comprendraient / ne comprirent pas
  rationale: La répétition de la même racine grecque est conservée par le verbe « comprendre ». Le conditionnel s’intègre naturellement au discours indirect après « pensait ».
- source_word: ἀδελφοὺς
  choice: ses frères
  rationale: Le terme grec masculin pluriel exprime ici la fraternité ethnique entre Moïse et les Israélites. Une note explicite le référent sans effacer l’image de parenté du texte.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: par son intermédiaire
  rationale: L’expression grecque signifie littéralement « par sa main » et désigne l’agent dont Dieu se sert. La formulation retenue transmet clairement cet idiome en français courant.
- source_word: δίδωσιν
  choice: accordait
  rationale: Le présent grec dans le discours indirect est rendu par l’imparfait français, conformément au cadre narratif passé. « Accorder » convient naturellement avec « délivrance ».
- source_word: σωτηρίαν
  choice: la délivrance
  rationale: Dans le contexte immédiat, le mot désigne le secours concret apporté à Israël par l’intermédiaire de Moïse, tout en gardant des résonances plus larges de salut.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif désigne les bénéficiaires de la délivrance; « leur accordait » l’exprime naturellement.
theological_decisions:
- issue: Sens de σωτηρία dans le récit de Moïse
  choice: la délivrance
  alternative: le salut
  rationale: « Délivrance » met en avant le sauvetage historique d’Israël dans ce contexte, sans nier la portée théologique plus large du terme grec. La variante « salut » est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la répétition de « comprendre » et le langage fraternel du grec, tout en rendant idiomatiquement l’expression d’agence « par sa main ».
