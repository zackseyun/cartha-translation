    issue: Valeur temporelle de « comprendraient »
    rationale: 'Le conditionnel français suggère normalement un futur dans le passé (« qu’ils allaient comprendre » / « qu’ils comprendraient »). Le grec emploie l’infinitif présent συνιέναι après ἐνόμιζεν : Moïse supposait qu’ils comprenaient déjà.'
  - severity: medium
    issue: Ancrage inadéquat de la note b
    rationale: L’ancre b suit « par son intermédiaire », mais la note traite aussi de l’alternative « salut » pour « délivrance ». Il convient d’ancrer séparément la note lexicale à « délivrance » et la note idiomatique à l’expression d’agence.
