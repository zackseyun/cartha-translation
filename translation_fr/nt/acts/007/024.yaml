id: ACT.7.24
reference: Acts 7:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: fr
  text: Voyant quelqu’un subir une injustice, il prit sa défense et vengea l’opprimé en frappant l’Égyptien.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendit justice à l’opprimé ». L’expression grecque peut évoquer le fait de venger quelqu’un ou de lui obtenir réparation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en abattant l’Égyptien ». Le verbe grec signifie littéralement « frapper »; le contexte indique que le coup fut mortel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: Voyant
  rationale: Le participe aoriste établit la circonstance des actions principales; le participe présent français est naturel ici sans imposer une chronologie plus précise.
- source_word: τινα ἀδικούμενον
  choice: quelqu’un subir une injustice
  rationale: Cette formulation conserve l’indétermination de τινα et la dimension morale d’ἀδικέω, dans un français courant.
- source_word: ἠμύνατο
  choice: il prit sa défense
  rationale: Le moyen de ἀμύνομαι exprime l’intervention en faveur d’une personne agressée; «prendre sa défense» rend clairement cette idée.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: vengea
  rationale: L’expression signifie exercer la vengeance ou obtenir réparation en faveur de quelqu’un. «Vengea» conserve plus directement sa force que la seule idée générale de rendre justice.
- source_word: τῷ καταπονουμένῳ
  choice: l’opprimé
  rationale: Le participe substantivé désigne celui qui subit un traitement dur ou oppressif; le datif indique le bénéficiaire de l’intervention.
- source_word: πατάξας
  choice: en frappant
  rationale: πατάσσω signifie directement «frapper». La formulation préserve le lien instrumental avec l’action précédente sans inscrire explicitement dans le verbe l’issue mortelle fournie par le contexte.
- source_word: τὸν Αἰγύπτιον
  choice: l’Égyptien
  rationale: L’adjectif ethnique substantivé se rend naturellement ainsi en français.
theological_decisions:
- issue: Portée de ἐποίησεν ἐκδίκησιν dans l’acte de Moïse
  choice: «vengea l’opprimé»
  alternative: «rendit justice à l’opprimé»
  rationale: Le grec peut évoquer vengeance, réparation ou justification. «Vengea» garde la force de l’expression et son orientation en faveur de la victime, sans ajouter une approbation théologique de l’acte.
- issue: Issue mortelle impliquée par πατάξας
  choice: «en frappant» dans le texte
  alternative: «en abattant» ou «en tuant»
  rationale: Le contexte narratif implique la mort de l’Égyptien, mais le verbe de ce verset signifie d’abord frapper. La traduction conserve cette distinction.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise et suit le mouvement du grec. Les notes maintiennent les nuances de l’expression liée à la vengeance ou à la justice et du verbe «frapper».
