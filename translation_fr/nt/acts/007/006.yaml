id: ACT.7.6
reference: Acts 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: fr
  text: 'Mais Dieu parla ainsi : sa descendance séjournerait comme étrangère dans une terre étrangère, et on la réduirait en esclavage et la maltraiterait pendant quatre cents ans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: Mais Dieu parla ainsi
  rationale: « Mais » rend le léger développement marqué par δέ, tandis que « parla ainsi » conserve explicitement ἐλάλησεν et οὕτως ainsi que l’introduction solennelle de la parole divine.
- source_word: ὅτι ἔσται
  choice: sa descendance séjournerait
  rationale: ὅτι introduit le contenu de la parole sans devoir être traduit séparément après les deux-points. Le conditionnel français exprime le futur envisagé depuis le verbe principal au passé.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: sa descendance
  rationale: σπέρμα désigne collectivement la postérité d’Abraham. « Descendance » est naturel en français, reste au singulier et évite le littéralisme aujourd’hui trompeur de « semence ».
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: séjournerait en étrangère dans un pays qui ne serait pas le sien
  rationale: Cette formulation exprime à la fois la résidence hors de chez soi portée par πάροικος et le fait que la terre appartient à autrui, nuance fondamentale de ἀλλότριος. Le féminin singulier s’accorde avec « descendance » et préserve le collectif singulier grec.
- source_word: δουλώσουσιν αὐτὸ
  choice: on la réduirait en esclavage
  rationale: « Réduire en esclavage » rend clairement δουλόω. Le pronom « la » reprend le collectif singulier « descendance » et correspond à αὐτό; le sujet indéfini pluriel grec est rendu naturellement par « on ».
- source_word: κακώσουσιν
  choice: la maltraiterait
  rationale: « Maltraiter » exprime le fait de faire subir du mal sans préciser indûment la forme de l’oppression.
- source_word: ἔτη τετρακόσια
  choice: pendant quatre cents ans
  rationale: « Pendant » rend idiomatiquement en français l’accusatif grec de durée.
theological_decisions:
- issue: Le singulier collectif appliqué à la descendance d’Abraham
  choice: 'Maintien du singulier collectif : « sa descendance… en étrangère… la »'
  alternative: 'Employer le pluriel : « ses descendants… étrangers… les »'
  rationale: Le grec emploie le singulier collectif σπέρμα, repris par πάροικον et αὐτό. Le français permet de conserver ce trait de manière intelligible et naturelle, sans trancher ni effacer les résonances possibles du vocabulaire de la descendance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation « séjournerait en étrangère » est légèrement solennelle afin de préserver la condition de résident non autochtone exprimée par πάροικος, tandis que « dans un pays qui ne serait pas le sien » explicite naturellement la nuance possessive de ἀλλότριος.
