  naturalness: « Séjournerait comme étrangère dans une terre étrangère » est naturel en français international moderne tout en conservant l’idée de résidence hors de son pays propre. « Terre étrangère » rend de manière concise et usuelle γῇ ἀλλοτρίᾳ.
