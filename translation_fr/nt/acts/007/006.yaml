  rationale: 'La révision se limite à remplacer une expression française mal formée par une formulation idiomatique qui préserve les deux éléments du grec : la condition d’étrangère résidant dans le pays (πάροικον) et le caractère étranger de cette terre (γῇ ἀλλοτρίᾳ). Le sujet indéfini « on » conserve l’absence d’identification explicite des auteurs de l’asservissement, tandis que « la » maintient la reprise du collectif singulier.'
