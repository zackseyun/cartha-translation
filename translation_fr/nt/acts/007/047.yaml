  text: But Solomon built a house for him[a].
translation:
  language: fr
  text: Mais Salomon lui construisit une maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «un temple»; grec: «une maison».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: Salomon
  rationale: Forme française traditionnelle et standard du nom biblique.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition ou une transition, en préparant le contraste explicité au verset suivant.
- source_word: οἰκοδόμησεν
  choice: construisit
  rationale: L’aoriste désigne concrètement l’action passée d’édifier un bâtiment; le passé simple convient au registre narratif biblique soutenu.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif renvoie à Dieu et indique que la maison fut construite pour lui; cette formulation française demeure naturelle et concise.
- source_word: οἶκον
  choice: une maison
  rationale: Le grec emploie le terme ordinaire pour «maison», bien que le référent contextuel soit le temple. Le conserver maintient l’écho avec le langage biblique de la maison de Dieu et la tension avec le verset suivant.
theological_decisions:
- issue: Rendre οἶκον littéralement par «maison» ou explicitement par «temple»
  choice: maison
  alternative: temple
  rationale: '«Maison» respecte le mot grec et préserve la tension théologique: Salomon bâtit une maison pour Dieu, alors que le Très-Haut n’habite pas dans des demeures faites de main humaine. «Temple» est l’interprétation contextuelle correcte, signalée en note sans remplacer le terme source.'
translation_notes:
  register: Français moderne, digne et concis. Le passé simple conserve la tonalité d’un récit historique écrit; «lui construisit une maison» évite une explicitation inutile tout en restant intelligible.
