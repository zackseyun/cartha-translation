  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: fr
  text: 'Alors le Seigneur lui dit : « Retire[a] la sandale de tes pieds, car le lieu où tu te tiens est une terre sainte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Détache la sandale de tes pieds. »'
    reason: Signale le sens lexical premier de λύω et conserve la formulation singulière inhabituelle du grec.
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Rend le titre grec de manière révérencieuse et conforme à l’usage biblique français, sans introduire la graphie « Éternel » ou « SEIGNEUR », absente du texte grec.
- source_word: Λῦσον
  choice: Retire
  rationale: Le sens premier est « détache » ou « délie », mais, appliqué à une sandale, l’impératif demande naturellement de l’enlever. « Retire » exprime clairement cette action en français actuel.
- source_word: τὸ ὑπόδημα
  choice: la sandale
  rationale: Le nom grec est au singulier. Le français conserve ce détail du texte source plutôt que de l’harmoniser avec le pluriel plus familier « les sandales ».
- source_word: τῶν ποδῶν σου
  choice: de tes pieds
  rationale: Le grec emploie explicitement le pluriel « pieds ». La formulation conserve donc la tension inhabituelle entre « la sandale » au singulier et « tes pieds » au pluriel.
- source_word: ὁ γὰρ τόπος
  choice: car le lieu
  rationale: « Lieu » correspond directement à τόπος, et « car » restitue la valeur explicative de γάρ.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: où tu te tiens
  rationale: Cette expression française naturelle rend la position présente exprimée par le parfait grec, sans calquer lourdement « sur lequel tu te tiens debout ».
- source_word: γῆ ἁγία
  choice: une terre sainte
  rationale: Dans ce contexte local, γῆ désigne le sol ou la terre. « Une terre sainte » conserve la formulation prédicative et la dignité de l’expression biblique.
theological_decisions:
- issue: Traduction de κύριος dans une citation théophanique de l’Exode
  choice: Seigneur
  alternative: Éternel / SEIGNEUR
  rationale: Le texte grec porte κύριος et non le tétragramme hébreu. « Seigneur » respecte donc la forme du texte néotestamentaire tout en conservant sa portée divine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant le singulier « la sandale » et le pluriel « tes pieds » du texte grec. Le marqueur [a] est placé immédiatement après l’expression concernée.
