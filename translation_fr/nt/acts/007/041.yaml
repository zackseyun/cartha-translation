source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: fr
  text: En ces jours-là, ils façonnèrent un veau et offrirent un sacrifice à cette idole, et ils se réjouissaient des œuvres de leurs mains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils se réjouissaient de ce que leurs mains avaient fabriqué » .
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: ils façonnèrent un veau
  rationale: Le verbe désigne l’action de faire ou de façonner un veau. « Façonnèrent » exprime naturellement la fabrication intentionnelle, tandis que la mention suivante de l’idole rend inutile l’ajout de « idole » ici.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: En ces jours-là
  rationale: Expression temporelle française naturelle qui conserve la structure et la référence rétrospective du grec.
- source_word: ἀνήγαγον θυσίαν
  choice: offrirent un sacrifice
  rationale: Dans ce contexte cultuel, l’expression grecque signifie présenter une victime en sacrifice ; « offrirent un sacrifice » en rend clairement le sens idiomatique.
- source_word: τῷ εἰδώλῳ
  choice: à cette idole
  rationale: Le démonstratif français rattache explicitement l’idole au veau qui vient d’être mentionné, conformément à l’article grec et à la continuité du discours. « Idole » conserve la portée péjorative de εἴδωλον.
- source_word: εὐφραίνοντο
  choice: ils se réjouirent
  rationale: Le passé simple convient au registre narratif biblique moderne et décrit leur réjouissance sans ajouter l’idée plus interprétative de célébration. La durée suggérée par l’imparfait grec n’est pas fortement marquée dans ce contexte événementiel.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: des œuvres de leurs mains
  rationale: Cette formulation conserve l’image et l’écho à la polémique biblique contre les idoles, tout en restant intelligible en français. La préposition « de » rend ici naturellement l’objet de leur joie.
theological_decisions:
- issue: Langage de l’idolâtrie et portée rhétorique
  choice: Employer « idole » et conserver « œuvres de leurs mains »
  alternative: Employer « image » et reformuler par « ce qu’ils avaient fabriqué »
  rationale: Le discours d’Étienne condamne l’idolâtrie d’Israël dans un langage qui évoque la Septante et la critique prophétique. Cette formulation préserve cette accusation théologique sans réduire le passage à une simple activité artisanale.
translation_notes:
  register: Français international moderne, digne et narratif. « Façonnèrent » est précis sans être technique ; « œuvres de leurs mains » conserve volontairement une tournure biblique porteuse d’un écho intertextuel. Le marqueur [a] figure dans le texte principal.
