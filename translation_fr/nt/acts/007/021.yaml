  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: fr
  text: Mais après qu’il eut été exposé, la fille du pharaon le recueillit[a] et l’éleva comme son propre fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prit avec elle » ; le verbe grec peut désigner le fait de recueillir un enfant exposé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour elle-même, comme fils » ; ou « comme son fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: après qu’il eut été exposé
  rationale: Le passif d’ἐκτίθημι désigne ici le fait de laisser un nourrisson dehors. « Exposé » conserve ce sens historique sans imposer le motif plus fort exprimé par « abandonné ».
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste narratif entre l’exposition de Moïse et son accueil par la fille du pharaon.
- source_word: ἀνείλατο
  choice: le recueillit
  rationale: Dans le contexte d’un enfant exposé, le moyen d’ἀναιρέω signifie le prendre en charge après l’avoir trouvé. « Recueillit » est naturel en français et ne confond pas cette action avec son accession ultérieure au statut de fils.
- source_word: ἡ θυγάτηρ Φαραώ
  choice: la fille du pharaon
  rationale: Cette formulation française naturelle rend fidèlement la relation génitive; la minuscule convient au titre générique.
- source_word: ἀνεθρέψατο
  choice: l’éleva
  rationale: ἀνατρέφω désigne le fait de nourrir et d’élever un enfant jusqu’à ce qu’il grandisse; « éleva » est précis et idiomatique.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: comme son propre fils
  rationale: Le datif réfléchi et εἰς υἱόν expriment ensemble la relation à elle-même et le statut résultant de fils. Cette formulation est naturelle tout en laissant une note signaler le tour littéral.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait littéraire « eut été exposé » maintient clairement l’antériorité, tandis que « recueillit » rend idiomatiquement l’accueil de l’enfant sans anticiper le statut filial exprimé à la fin du verset.
