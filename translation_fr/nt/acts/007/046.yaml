  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: fr
  text: Celui qui avait trouvé grâce aux yeux de Dieu demanda de trouver une demeure pour le Dieu de Jacob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un tabernacle pour le Dieu de Jacob ». Certains manuscrits lisent : « pour la maison de Jacob ».'
    reason: « Tabernacle » est une alternative lexicale possible pour σκήνωμα. La seconde phrase signale séparément la variante textuelle οἴκῳ (« maison ») à la place de θεῷ (« Dieu »).
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: avait trouvé faveur
  rationale: L’expression idiomatique signifie obtenir la faveur de quelqu’un. « Trouver faveur » conserve l’image grecque et reste une tournure biblique claire en français.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: « Devant Dieu » rend directement l’idée d’être en sa présence ou sous son regard.
- source_word: ᾐτήσατο
  choice: demanda
  rationale: Le verbe exprime ici une requête, sans qu’il soit nécessaire d’ajouter un complément absent du grec.
- source_word: εὑρεῖν
  choice: de trouver
  rationale: Cette traduction formelle préserve le verbe grec et son possible sens contextuel d’obtenir ou de procurer, sans trancher implicitement.
- source_word: σκήνωμα
  choice: une demeure
  rationale: Le terme désigne un lieu où demeurer. « Demeure » est naturel et suffisamment large pour ne pas anticiper la maison construite par Salomon au verset suivant.
- source_word: τῷ θεῷ Ἰακώβ
  choice: pour le Dieu de Jacob
  rationale: Le datif se rend naturellement par « pour », tandis que « le Dieu de Jacob » conserve la formulation scripturaire et l’ambiguïté textuelle pertinente.
theological_decisions:
- issue: Nature de la construction demandée par David
  choice: une demeure
  alternative: un tabernacle ; une maison
  rationale: 'Le grec σκήνωμα est plus large que le vocabulaire technique du Temple. « Demeure » maintient la tension du récit : David désire un lieu pour Dieu, puis Salomon construit la maison.'
- issue: Lecture du syntagme final
  choice: pour le Dieu de Jacob
  alternative: pour la maison de Jacob
  rationale: Le texte principal suit la leçon θεῷ (« Dieu ») du SBLGNT. Une variante ancienne lit οἴκῳ (« maison »), ce qui donne « pour la maison de Jacob » ; elle mérite d’être signalée sans remplacer le texte retenu.
translation_notes:
  register: Français international moderne, digne et lisible. La construction « Lui qui… » relie ce verset à David, nommé au verset précédent, tout en conservant la structure relative du grec. Le plus-que-parfait situe la faveur reçue avant la demande.
