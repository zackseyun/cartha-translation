    issue: 'Expression française non idiomatique : « avait trouvé faveur »'
    rationale: En français courant et biblique moderne, on dit « trouver grâce/faveur aux yeux de quelqu’un » ou « obtenir la faveur de quelqu’un ». L’absence de « grâce » ou d’article dans la formulation proposée produit un calque peu naturel.
  - severity: medium
    issue: Note de bas de page conflue alternative lexicale et variante textuelle
    rationale: « Une tente sacrée » est une interprétation plus étroite que σκήνωμα et ne doit pas être présentée au même titre que la variante manuscrite « pour la maison de Jacob ». Il convient de donner l’alternative établie « un tabernacle », puis de signaler séparément la variante.
  revised_text: Celui qui avait trouvé grâce aux yeux de Dieu demanda de trouver une demeure pour le Dieu de Jacob[a].
