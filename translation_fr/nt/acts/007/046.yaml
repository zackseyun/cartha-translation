revisions:
- from: Lui qui avait trouvé faveur devant Dieu demanda de trouver une demeure pour le Dieu de Jacob[a].
  to: Celui qui avait trouvé grâce aux yeux de Dieu demanda de trouver une demeure pour le Dieu de Jacob[a].
  rationale: La révision remplace un calque français par l’idiome naturel « trouver grâce aux yeux de Dieu », tout en préservant la valeur narrative du plus-que-parfait et l’ambiguïté de σκήνωμα par « demeure ». La note est restructurée afin de ne pas confondre une possibilité de traduction avec une variante manuscrite et de ne pas restreindre indûment σκήνωμα à une « tente sacrée ».
