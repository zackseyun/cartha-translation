  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: fr
  text: 'Le jour suivant, il se montra à eux alors qu’ils se battaient et cherchait à les amener à faire la paix[a], en disant : « Vous êtes frères ; pourquoi vous faites-vous du tort l’un à l’autre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cherchait à les réconcilier pour qu’ils vivent en paix ». L’imparfait grec peut décrire une action en cours ; dans ce contexte, il peut aussi présenter une tentative, puisque l’intervention de Moïse est repoussée au verset suivant.
    reason: ambiguïté_aspectuelle
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: Le jour suivant
  rationale: Rend naturellement le datif temporel et la progression du récit.
- source_word: ὤφθη
  choice: il se montra à eux
  rationale: L’aoriste passif de ὁράω a ici une valeur intransitive (« apparaître, se montrer »). Cette formulation indique naturellement que Moïse vint à leur rencontre.
- source_word: αὐτοῖς μαχομένοις
  choice: alors qu’ils se battaient
  rationale: Le participe présent au datif décrit l’action en cours au moment où Moïse se montre à eux.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: cherchait à les amener à faire la paix
  rationale: 'L’imparfait peut être conatif dans ce contexte : Moïse entreprend de les réconcilier, mais le verset suivant montre que son intervention est repoussée. « Amener à faire la paix » exprime idiomatiquement le mouvement vers la paix marqué par εἰς.'
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: Vous êtes frères, vous deux !
  rationale: Le français vocatif « Hommes » serait artificiel. « Vous deux » conserve l’adresse explicite aux deux hommes, tandis que « vous êtes frères » rend l’appel à leur fraternité commune.
- source_word: ἱνατί ἀδικεῖτε ἀλλήλους
  choice: Pourquoi vous faites-vous du tort l’un à l’autre ?
  rationale: ἀδικέω désigne ici le fait de mal agir envers autrui ou de lui faire du tort; la tournure réciproque restitue ἀλλήλους.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La formulation évite le vocatif peu naturel « Hommes » tout en conservant l’adresse aux deux combattants. Le tutoiement pluriel convient à une interpellation directe sans introduire de nuance honorifique absente du grec.
