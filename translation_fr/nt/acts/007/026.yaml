  to: 'Le jour suivant, il se montra à eux alors qu’ils se battaient et cherchait à les amener à faire la paix[a], en disant : « Vous êtes frères ; pourquoi vous faites-vous du tort l’un à l’autre ? »'
  rationale: La révision maintient le choix idiomatique « amener à faire la paix », tout en rattachant les paroles à l’action par « en disant ». Elle retire l’emphase ajoutée par « vous deux ! » et remplace l’alternative de note par une formulation française naturelle qui rend la visée de paix et l’ambiguïté de l’imparfait.
