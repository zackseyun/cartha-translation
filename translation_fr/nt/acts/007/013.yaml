  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: fr
  text: La deuxième fois, Joseph fut reconnu par ses frères[a], et la famille de Joseph devint connue de Pharaon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Joseph se fit connaître de ses frères. » Le verbe grec est au passif, mais, dans le contexte, il peut évoquer Joseph révélant son identité à ses frères.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la parenté de Joseph » ou « la lignée de Joseph ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: La deuxième fois
  rationale: L’adjectif substantivé désigne la deuxième occasion. Cette formulation française est naturelle et évite d’ajouter explicitement « visite », absent du grec, tout en restant claire dans le contexte.
- source_word: ἀνεγνωρίσθη
  choice: fut reconnu
  rationale: Le passif grec est conservé afin de ne pas effacer son ambiguïté formelle. Dans le récit de Joseph, il peut aussi décrire le fait que Joseph révéla son identité, possibilité signalée en note.
- source_word: ἀδελφοῖς
  choice: par ses frères
  rationale: Le contexte de la Genèse désigne les frères masculins de Joseph; « frères » est donc précis et naturel.
- source_word: φανερὸν ἐγένετο
  choice: fut connue
  rationale: Cette tournure exprime le passage à la connaissance de Pharaon et garde la structure du grec, malgré un registre légèrement plus formel.
- source_word: γένος
  choice: famille
  rationale: Ici, γένος renvoie au groupe familial ou à la parenté de Joseph. « Famille » est le terme moderne le plus clair, sans les connotations potentiellement trompeuses de « race ».
- source_word: τῷ Φαραώ
  choice: de Pharaon
  rationale: Avec « fut connue », le complément « de Pharaon » rend naturellement le datif désignant celui qui prend connaissance de la famille de Joseph.
