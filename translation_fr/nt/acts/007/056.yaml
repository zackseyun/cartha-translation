source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: fr
  text: 'Et il dit : « Voici, je vois les cieux ouverts[a] et le Fils de l’homme[b] debout à la droite de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant été ouverts ». Le grec emploie un participe parfait passif qui présente les cieux comme déjà ouverts et demeurant dans cet état au moment de la vision d’Étienne.'
    reason: lexical_alternative
  - marker: b
    text: « Le Fils de l’homme » est un titre messianique reconnu qui fait écho à Daniel 7.13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Regardez !
  rationale: Cette interjection attire immédiatement l’attention sur la vision d’Étienne. « Regardez ! » est naturel en français moderne et conserve la vivacité de l’exclamation.
- source_word: θεωρῶ
  choice: Je vois
  rationale: Le présent exprime une perception en cours. « Je vois » est la formulation française la plus directe et naturelle dans ce contexte visionnaire.
- source_word: τοὺς οὐρανοὺς
  choice: les cieux
  rationale: Le pluriel français respecte le pluriel grec et maintient le registre biblique et théologique, contrairement à « le ciel » ou « les firmaments ».
- source_word: διηνοιγμένους
  choice: ouverts
  rationale: Le participe parfait passif décrit les cieux dans l’état résultant de leur ouverture. « Ouverts » rend cet état sans alourdir la phrase.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: La traduction traditionnelle et littérale préserve ce titre reconnu ainsi que son écho messianique et apocalyptique à Daniel 7.13.
- source_word: ἐκ δεξιῶν
  choice: à la droite
  rationale: Cette expression française idiomatique désigne la place d’honneur et d’autorité tout en conservant l’intertextualité biblique.
- source_word: ἑστῶτα
  choice: debout
  rationale: Le participe indique explicitement une posture debout. Cette formulation naturelle évite d’harmoniser le verset avec les textes qui présentent Jésus assis.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement, sans ajout interprétatif.
theological_decisions:
- issue: Titre christologique υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: « Le Fils de l’homme » reflète étroitement le grec et conserve le caractère reconnu du titre ainsi que son lien avec Daniel 7. « L’Humain » serait plus interprétatif et affaiblirait cet écho.
- issue: Posture de Jésus exalté
  choice: debout à la droite de Dieu
  alternative: à la droite de Dieu, sans préciser la posture
  rationale: Le texte dit expressément que le Fils de l’homme est debout. La traduction maintient cette particularité et la tension avec les passages où il est présenté assis, sans chercher à les harmoniser.
translation_notes:
  register: Français international moderne, clair et digne. L’exclamation « Regardez ! » communique l’immédiateté de la vision; « les cieux », « le Fils de l’homme » et « à la droite de Dieu » conservent les résonances bibliques sans archaïsme excessif.
