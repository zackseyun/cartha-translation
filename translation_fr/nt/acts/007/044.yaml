source:
  edition: SBLGNT
  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: fr
  text: La tente du témoignage était avec nos pères dans le désert, comme celui qui parlait à Moïse lui avait ordonné de la faire d’après le modèle que Moïse avait vu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tabernacle du témoignage ». Le grec dit littéralement « nos pères »; on peut aussi traduire « nos ancêtres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: La tente du témoignage
  rationale: « Tente » rend naturellement le sens premier de σκηνή et convient au sanctuaire transportable; « du témoignage » conserve la construction biblique du grec sans imposer le terme traditionnel « tabernacle ».
- source_word: τοῖς πατράσιν ἡμῶν
  choice: avec nos pères
  rationale: Le datif est rendu idiomatiquement par « avec »; « nos pères » conserve la formulation masculine explicite désignant les ancêtres d’Israël.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Expression géographique biblique courante et naturelle en français.
- source_word: καθὼς διετάξατο
  choice: avait ordonné
  rationale: Le verbe exprime une directive faisant autorité. Le plus-que-parfait français situe naturellement l’ordre avant la présence de la tente dans le désert, tandis que l’enchaînement en deux phrases rend le propos clairement.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: Celui qui parlait à Moïse
  rationale: Cette formulation conserve le participe substantivé au présent et laisse l’identité du locuteur implicite, comme le grec.
- source_word: ποιῆσαι αὐτὴν
  choice: de la faire
  rationale: Rendu simple et courant de l’infinitif avec son objet, dont l’antécédent est la tente.
- source_word: κατὰ τὸν τύπον
  choice: d’après le modèle
  rationale: « Modèle » exprime clairement le prototype montré à Moïse et s’emploie naturellement avec « faire d’après ».
- source_word: ὃν ἑωράκει
  choice: qu’il avait vu
  rationale: Le plus-que-parfait rend la vision antérieure de Moïse; le pronom « il » renvoie naturellement à Moïse dans ce contexte.
theological_decisions:
- issue: Identité de celui qui parlait à Moïse
  choice: 'Laissée implicite: « Celui qui parlait à Moïse »'
  alternative: « Dieu avait ordonné à Moïse » ou « le Seigneur, qui parlait à Moïse »
  rationale: Le grec ne nomme pas explicitement le locuteur. La traduction préserve cette implicitation au lieu d’ajouter une identification théologique, même si le contexte permet de comprendre qu’il s’agit de Dieu.
- issue: Référent du sujet de « avait vu »
  choice: Moïse
  alternative: Le locuteur divin
  rationale: La syntaxe et le contexte de la fabrication d’après un modèle montré à Moïse soutiennent que Moïse est celui qui avait vu le modèle; cette lecture demeure exprimée seulement par le pronom du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Tente » évite un terme ecclésiastique opaque, tandis que « témoignage », « nos pères » et l’identité implicite du locuteur maintiennent les traits marqués du texte source.
