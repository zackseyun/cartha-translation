source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: fr
  text: Lequel des prophètes vos pères n’ont-ils pas persécuté ? Et ils ont tué ceux qui avaient annoncé d’avance la venue du Juste[a], dont vous êtes maintenant devenus les traîtres et les meurtriers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, avec une minuscule : « du juste ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dont vous êtes maintenant devenus les traîtres et les meurtriers ».'
    reason: formal_equivalence
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: Lequel des prophètes
  rationale: La construction partitive est rendue naturellement tout en conservant la force de la question rhétorique.
- source_word: ἐδίωξαν
  choice: ont-ils persécuté
  rationale: Dans ce contexte, le verbe désigne la persécution hostile des prophètes.
- source_word: οἱ πατέρες ὑμῶν
  choice: vos pères
  rationale: Cette formulation proche du grec maintient la continuité accusatrice entre les auditeurs et leurs devanciers; « vos ancêtres » reste possible.
- source_word: ἀπέκτειναν
  choice: ont aussi tué
  rationale: « Tuer » est clair et direct; « aussi » rend καί sans ajouter l’intensification de « même ».
- source_word: τοὺς προκαταγγείλαντας
  choice: ceux qui avaient annoncé d’avance
  rationale: Le plus-que-parfait situe naturellement cette annonce avant leur mise à mort, tandis que « d’avance » rend le préverbe προ-.
- source_word: περὶ τῆς ἐλεύσεως
  choice: la venue
  rationale: Avec le verbe « annoncer », le complément direct est idiomatique en français et « venue » exprime fidèlement ἔλευσις.
- source_word: τοῦ δικαίου
  choice: du Juste
  rationale: L’article et le contexte donnent à l’expression une valeur de désignation christologique; « le Juste » est une formulation française naturelle et traditionnelle sans explicitation ajoutée.
- source_word: οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ἐγένεσθε
  choice: que vous avez maintenant trahi et assassiné
  rationale: Le grec dit littéralement qu’ils sont devenus ses traîtres et ses meurtriers. La verbalisation évite en français l’expression lourde « traîtres et meurtriers de celui-ci » tout en gardant les deux accusations et le repère temporel.
theological_decisions:
- issue: Valeur christologique de τοῦ δικαίου
  choice: le Juste
  alternative: le juste; le Juste par excellence
  rationale: Dans le discours d’Étienne, l’expression désigne Jésus. La majuscule signale cet emploi comme titre sans ajouter une qualification absente du grec.
- issue: Forme de l’accusation προδόται καὶ φονεῖς
  choice: que vous avez maintenant trahi et assassiné
  alternative: dont vous êtes maintenant devenus les traîtres et les meurtriers
  rationale: La forme verbale rend avec naturel les actes coupables exprimés par les deux noms grecs. La note conserve la structure littérale et son possible accent sur l’état acquis des auditeurs.
translation_notes:
  register: Français international moderne, direct et digne. La question rhétorique reste incisive. « Vos pères » est maintenu pour la proximité formelle et la continuité du réquisitoire; « vos ancêtres » serait plus explicite mais moins proche du texte. Les marqueurs [a] et [b] figurent dans le corps du verset.
