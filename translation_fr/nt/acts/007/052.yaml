revisions:
- from: Lequel des prophètes vos pères n’ont-ils pas persécuté ? Ils ont aussi tué ceux qui avaient annoncé d’avance la venue du Juste[a], que vous avez maintenant trahi et assassiné[b].
  to: Lequel des prophètes vos pères n’ont-ils pas persécuté ? Et ils ont tué ceux qui avaient annoncé d’avance la venue du Juste[a], dont vous êtes maintenant devenus les traîtres et les meurtriers[b].
  rationale: La révision rend καί par une simple coordination, sans l’accent additionnel de « aussi », et rétablit la structure nominale avec « devenus » afin de conserver la force accusatrice et l’aspect ingressif de ἐγένεσθε. Le titre « le Juste » est maintenu. La note [a] est resserrée pour éviter une paraphrase interprétative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:09:29Z'
review_pass:
  verdict: revise
  source_fidelity: La question partitive, « vos pères », la persécution, l’annonce préalable et « le Juste » sont bien rendus. Toutefois, « ils ont aussi tué » donne à καί une valeur additive qui n’est pas nécessaire ici, et la verbalisation « vous avez ... trahi et assassiné » atténue la formulation nominale ainsi que l’idée de devenir exprimée par ἐγένεσθε.
  naturalness: Le français est globalement direct et idiomatique. « Dont vous êtes maintenant devenus les traîtres et les meurtriers » est plus formel, mais demeure naturel dans le registre soutenu d’un discours d’accusation et reflète plus exactement le grec.
  terminology: « Le Juste » rend fidèlement le titre τοῦ δικαίου et convient au français biblique moderne. La note proposant « le Juste par excellence » introduit une paraphrase interprétative inutile ; une note limitée à l’alternative de capitalisation est préférable.
  issues:
  - severity: medium
    issue: « aussi » pour καί
    rationale: Dans ce contexte, καί coordonne simplement les deux accusations contre les pères. « Aussi » peut suggérer une addition emphatique qui n’est pas exprimée par le grec ; « Et ils ont tué » est plus exact.
  - severity: medium
    issue: Perte de la construction « devenir les traîtres et les meurtriers »
    rationale: Le grec emploie les noms προδόται et φονεῖς avec ἐγένεσθε. « Que vous avez maintenant trahi et assassiné » communique les actes, mais efface l’état acquis et la désignation accusatrice portés par la formulation source.
  - severity: low
    issue: Note [a] interprétative
    rationale: « Du Juste par excellence » n’est pas une alternative lexicale directe et ajoute une explicitation évaluative. Une note sobre sur la possibilité graphique « du juste » suffit si une note est maintenue.
