id: ACT.7.10
reference: Acts 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: fr
  text: Il le délivra de toutes ses détresses[a], lui accorda faveur[b] et sagesse auprès du pharaon, roi d’Égypte, et l’établit gouverneur de l’Égypte et de toute la maison du pharaon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de toutes ses épreuves » ou « de tous ses malheurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « faveur » désigne l’accueil favorable accordé à Joseph auprès du pharaon ; autre traduction possible : « grâce ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « il le nomma chef sur l’Égypte et sur toute la maisonnée du pharaon ». Le mot traduit par « maison » peut désigner la maisonnée ou le domaine du pharaon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: délivra
  rationale: Le moyen de ἐξαιρέω exprime ici la délivrance hors des dangers et des épreuves. « Délivra » est naturel en français biblique moderne sans être archaïque.
- source_word: θλίψεων
  choice: détresses
  rationale: Le terme désigne l’ensemble des pressions, épreuves et souffrances subies par Joseph. « Détresses » en conserve la gravité sans connotation eschatologique particulière.
- source_word: χάριν
  choice: faveur
  rationale: Dans ce contexte, χάρις désigne l’accueil favorable dont Joseph bénéficie auprès du pharaon plutôt qu’un emploi théologique plus développé de « grâce ».
- source_word: σοφίαν
  choice: sagesse
  rationale: Le mot désigne ici la sagesse, notamment le discernement pratique reconnu par le pharaon.
- source_word: ἐναντίον
  choice: devant
  rationale: Avec le génitif, ἐναντίον indique la présence ou le regard d’une personne. « Devant le pharaon » reste concis et fidèle, avec l’idée implicite de faveur à ses yeux.
- source_word: κατέστησεν
  choice: établit
  rationale: καθίστημι signifie placer quelqu’un dans une charge ou une fonction d’autorité. « Établit » rend cette nomination formelle avec dignité.
- source_word: ἡγούμενον
  choice: dirigeant
  rationale: Le participe désigne celui qui exerce l’autorité. « Dirigeant » conserve sa portée générale sans imposer le titre administratif plus précis de « gouverneur ».
- source_word: ἐπ’ Αἴγυπτον
  choice: de l’Égypte
  rationale: Après un terme de nomination, ἐπί avec l’accusatif marque le domaine placé sous l’autorité de Joseph. En français, « dirigeant de l’Égypte » exprime naturellement cette relation.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: toute sa maison
  rationale: οἶκος recouvre ici la maison du pharaon au sens de maisonnée, cour ou domaine domestique. La traduction littérale préserve cette amplitude, expliquée en note.
theological_decisions:
- issue: Référent du sujet implicite des verbes
  choice: Conserver le sujet implicite, qui renvoie à Dieu dans le contexte
  alternative: Ajouter explicitement « Dieu »
  rationale: Le grec n’exprime pas le sujet dans ce verset, mais les verbes au singulier prolongent naturellement Actes 7.9, où Dieu est mentionné. Ne pas ajouter son nom préserve la forme et la continuité du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le nom « pharaon » est traité comme un titre avec article et minuscule. La coordination garde le rythme narratif grec. Les notes signalent les principales possibilités lexicales sans alourdir le verset.
