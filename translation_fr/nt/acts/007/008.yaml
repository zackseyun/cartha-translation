id: ACT.7.8
reference: Acts 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: fr
  text: Et Dieu lui donna l’alliance de la circoncision. C’est ainsi qu’Abraham engendra Isaac et le circoncit le huitième jour ; Isaac engendra Jacob, et Jacob les douze patriarches.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: l’alliance de la circoncision
  rationale: « Alliance » rend διαθήκη dans ce contexte biblique, et le complément « de la circoncision » conserve la formulation concise qui caractérise cette alliance par son signe. L’article défini convient à l’alliance précise évoquée en Genèse 17.
- source_word: οὕτως
  choice: C’est ainsi que
  rationale: Cette tournure française naturelle préserve le lien logique et narratif entre le don de l’alliance et la naissance puis la circoncision d’Isaac.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans cette généalogie masculine, « engendra » exprime précisément la filiation biologique et permet de conserver la construction elliptique des deux dernières propositions. Le terme demeure courant dans un registre biblique digne, sans être obscur.
- source_word: περιέτεμεν
  choice: le circoncit
  rationale: « Circoncire » est le terme français exact et usuel pour περιτέμνω ; le pronom reprend clairement Isaac.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: le huitième jour
  rationale: La formule rend naturellement le datif temporel sans ajouter explicitement « après sa naissance », absent du grec.
- source_word: πατριάρχας
  choice: patriarches
  rationale: « Patriarches » est le terme biblique et historique établi pour les ancêtres fondateurs des douze tribus d’Israël.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: Isaac / Jacob
  rationale: Les noms suivent leurs formes françaises bibliques usuelles.
- source_word: αὐτῷ (première occurrence)
  choice: lui
  rationale: Le pronom conserve la continuité référentielle avec Abraham dans le contexte précédent.
- source_word: sujet implicite de ἐγέννησεν
  choice: Abraham
  rationale: Le grec laisse le sujet sous-entendu, mais le français risquerait d’attribuer l’action à Dieu, sujet explicite de la phrase précédente. Répéter « Abraham » clarifie la référence exigée par le contexte sans modifier le sens.
theological_decisions:
- issue: Caractère défini de l’alliance abrahamique
  choice: « l’alliance de la circoncision »
  alternative: « une alliance de circoncision » ou « l’alliance marquée par la circoncision »
  rationale: Le contexte renvoie à l’alliance identifiable donnée à Abraham en Genèse 17. L’article défini et le génitif littéralement rendu n’ajoutent aucune définition doctrinale du rapport entre alliance et circoncision.
- issue: Sujet de la naissance et de la circoncision d’Isaac
  choice: Nommer Abraham comme sujet d’« engendra », puis conserver le même sujet pour « le circoncit »
  alternative: « il engendra Isaac »
  rationale: Après « Dieu lui donna », un simple « il » serait ambigu en français et pourrait désigner Dieu. Le contexte généalogique impose Abraham comme référent ; l’explicitation évite un contresens théologique involontaire.
- issue: Formulation de la succession généalogique
  choice: « Isaac engendra Jacob, et Jacob les douze patriarches »
  alternative: « Isaac fut le père de Jacob, et Jacob celui des douze patriarches »
  rationale: La formulation choisie conserve la force généalogique de γεννάω et l’ellipse du texte grec, sans développer la nature exacte de la paternité au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation distingue le don divin de l’alliance de son application par Abraham. « Engendra » relève d’un registre biblique soutenu mais reste immédiatement compréhensible ; il permet aussi de respecter l’ellipse finale du grec.
