source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: fr
  text: 'Il dit : « Frères et pères, écoutez ! Le Dieu de gloire est apparu à notre père Abraham lorsqu’il était en Mésopotamie, avant qu’il habite[a] à Harran. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant qu’il ne s’établisse à Harran ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Il répondit
  rationale: Dans le contexte de l’interrogatoire, ἔφη introduit la prise de parole d’Étienne et δέ assure une transition légère. « Il répondit » est naturel en français sans surcharger la liaison.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Frères et pères
  rationale: Formule d’adresse solennelle et explicitement masculine. En français, « Frères et pères » en conserve la portée relationnelle et formelle ; traduire séparément ἄνδρες par « hommes » serait lourd et peu idiomatique.
- source_word: ἀκούσατε
  choice: écoutez
  rationale: L’impératif appelle directement l’auditoire à prêter attention ; « écoutez » est clair et actuel.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: Le Dieu de gloire
  rationale: Cette formulation conserve la construction génitive et sa possible résonance biblique, au lieu de la réduire à l’adjectif « glorieux ».
- source_word: ὤφθη
  choice: est apparu
  rationale: Dans le contexte d’une manifestation divine, le passif de ὁράω signifie naturellement « apparaître ». « S’est révélé » serait plus interprétatif.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: à notre père Abraham
  rationale: Rend fidèlement l’identification collective d’Abraham comme ancêtre du locuteur et de son auditoire.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: lorsqu’il était en Mésopotamie
  rationale: Le participe a ici une valeur circonstancielle temporelle ; cette tournure est naturelle et précise en français.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: avant qu’il ne s’établisse à Harran
  rationale: κατοικέω peut exprimer le fait d’habiter ou de s’établir. Ici, « s’établisse » rend bien le changement de résidence impliqué, tandis que le ne explétif est idiomatique après « avant que ».
theological_decisions:
- issue: Formule d’adresse masculine à l’auditoire
  choice: Frères et pères
  alternative: Hommes, frères et pères
  rationale: La traduction maintient les termes masculins du grec sans imposer en français une répétition artificielle de ἄνδρες, dont la force appartient à la formule vocative solennelle.
- issue: Titre divin θεὸς τῆς δόξης
  choice: Le Dieu de gloire
  alternative: Le Dieu glorieux
  rationale: La construction « de gloire » préserve la forme du grec, la densité théologique du titre et ses possibles échos scripturaires, sans trancher en faveur d’une simple qualité adjectivale.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la solennité de l’adresse et du titre divin, sans archaïsmes inutiles. Le nom Harran suit l’usage français courant.
