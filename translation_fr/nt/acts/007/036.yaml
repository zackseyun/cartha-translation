id: ACT.7.36
reference: Acts 7:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: fr
  text: C’est lui qui les fit sortir, en accomplissant des prodiges et des signes au pays d’Égypte, à la mer Rouge[a] et dans le désert pendant quarante ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mer des Roseaux ». Le texte grec porte « mer Rouge » (Ἐρυθρὰ Θάλασσα), désignation habituelle dans le Nouveau Testament et la Septante pour le lieu de la traversée d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: C’est lui qui
  rationale: La tournure met en relief Moïse, comme le démonstratif grec, tout en restant naturelle en français moderne.
- source_word: ἐξήγαγεν αὐτούς
  choice: les fit sortir
  rationale: Le verbe désigne l’action de conduire ou de faire sortir. Cette formulation idiomatique rappelle l’Exode sans attribuer à Moïse une action indépendante de Dieu.
- source_word: ποιήσας
  choice: en accomplissant
  rationale: Le participe est rendu par une construction qui rattache les prodiges et les signes à l’action principale sans imposer une succession chronologique stricte.
- source_word: τέρατα καὶ σημεῖα
  choice: des prodiges et des signes
  rationale: Cette traduction conserve les deux termes distincts et leur association caractéristique chez Luc.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: au pays d’Égypte
  rationale: La formulation rend explicitement γῇ et maintient la série géographique du verset.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: à la mer Rouge
  rationale: « Mer Rouge » est le sens direct de l’expression grecque et sa désignation biblique traditionnelle. La préposition « à » est naturelle en français pour situer les événements liés à la traversée.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est la désignation française courante de la région où Israël a erré; le contexte n’exige pas un paysage exclusivement sablonneux.
- source_word: ἔτη τεσσεράκοντα
  choice: pendant quarante ans
  rationale: « Pendant » exprime naturellement en français la durée indiquée par l’accusatif grec.
theological_decisions:
- issue: Référence du démonstratif et rôle de Moïse dans l’Exode
  choice: Le verset présente avec insistance Moïse comme l’agent humain qui fit sortir Israël.
  alternative: Employer simplement « Il », ce qui atténuerait l’emphase du démonstratif grec.
  rationale: « C’est lui qui » préserve l’insistance rhétorique de οὗτος. La formulation décrit le rôle de Moïse sans affirmer qu’il aurait agi indépendamment de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’emphase sur Moïse, le couple biblique « prodiges et signes » et la structure géographique du grec.
