source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: fr
  text: Alors, après avoir quitté le pays des Chaldéens, il s’établit à Harran. De là, après la mort de son père[a], Dieu[b] le fit s’établir dans cette terre où vous habitez maintenant,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Étienne situe ce déplacement après la mort du père d’Abraham. Comparer Genèse 11.32 et 12.4 pour la chronologie correspondante.
    reason: cross_reference
  - marker: b
    text: 'Ou : « il le fit s’établir ». Le grec n’exprime pas explicitement le sujet, mais le contexte indique qu’il s’agit de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession temporelle dans le récit.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: après avoir quitté le pays des Chaldéens
  rationale: Le participe aoriste exprime une action antérieure à l’établissement à Harran; « quitter » rend naturellement l’idée de sortir d’un territoire.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: il s’établit à Harran
  rationale: Κατοικέω indique ici qu’Abraham prend résidence à Harran; « s’établit » est précis et actuel.
- source_word: κἀκεῖθεν
  choice: De là
  rationale: Rend le point de départ du déplacement suivant; la liaison exprimée par καί est suffisamment portée par l’enchaînement français.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: après la mort de son père
  rationale: L’infinitif substantivé avec μετά exprime clairement l’antériorité temporelle.
- source_word: μετῴκισεν αὐτὸν
  choice: Dieu le fit venir
  rationale: Le verbe causatif signifie faire changer quelqu’un de lieu ou le transférer. « Dieu » explicite le sujet sous-entendu par le contexte, tandis que « le fit venir » adopte le point de vue de « ce pays » sans tonalité administrative.
- source_word: εἰς τὴν γῆν ταύτην
  choice: dans ce pays
  rationale: Εἰς marque le mouvement vers l’intérieur du territoire; « pays » est ici naturel dans l’adresse aux auditeurs présents.
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: où vous habitez maintenant
  rationale: Formulation française idiomatique qui conserve l’adresse directe au pluriel et la valeur temporelle de νῦν.
theological_decisions:
- issue: Sujet non exprimé de μετῴκισεν
  choice: Expliciter « Dieu » dans le texte et signaler l’absence de sujet explicite en note.
  alternative: Conserver « il le fit venir », au risque d’une ambiguïté référentielle en français.
  rationale: Le grec ne nomme pas le sujet du verbe, mais le contexte du discours présente Dieu comme l’agent. La note préserve formellement l’ambiguïté grammaticale.
- issue: Chronologie du départ après la mort de Téra
  choice: 'Traduire sans harmoniser: « après la mort de son père ».'
  alternative: Reformuler la séquence pour l’accorder explicitement avec une reconstruction chronologique de Genèse 11–12.
  rationale: La traduction doit conserver la séquence telle qu’Étienne la formule dans les Actes, sans résoudre silencieusement la tension intertextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Harran » suit la forme française courante du toponyme. La syntaxe reste fluide tout en conservant la progression temporelle et la tension chronologique du texte source.
