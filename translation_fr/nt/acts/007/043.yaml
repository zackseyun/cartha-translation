    reason: alternative_reading
  - marker: b
    text: Les Actes disent ici « au-delà de Babylone ». En Amos 5.27, le passage source est généralement rendu par « au-delà de Damas ».
    reason: cross_reference
  revision_rationale: La révision supprime l’inférence causale non marquée dans le grec, aligne les temps français sur les aoristes de la citation et remplace une formulation moins directe par « images ... pour les adorer ». Elle maintient les noms propres, la portée cultuelle et la divergence textuelle significative entre Actes et Amos.
