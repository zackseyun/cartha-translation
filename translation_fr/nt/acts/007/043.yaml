revisions:
- from: Vous avez aussi emporté la tente de Moloch et l’étoile du dieu Réphan[a], les représentations que vous aviez faites pour vous prosterner devant elles. C’est pourquoi je vous déporterai au-delà de Babylone[b].
  to: Vous avez emporté la tente de Moloch et l’étoile du dieu Réphan[a], les images que vous avez fabriquées pour les adorer. Et je vous déporterai au-delà de Babylone[b].
  rationale: La révision supprime l’inférence causale non marquée dans le grec, aligne les temps français sur les aoristes de la citation et remplace une formulation moins directe par « images ... pour les adorer ». Elle maintient les noms propres, la portée cultuelle et la divergence textuelle significative entre Actes et Amos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:09:09Z'
review_pass:
  verdict: revise
  source_fidelity: La conjonction καί introduit simplement la suite de la citation (« et ») ; « C’est pourquoi » ajoute un rapport de conséquence qui n’est pas exprimé. Le parfait composé convient pour les aoristes, mais le plus-que-parfait « aviez faites » ne correspond pas au temps grec. La révision rend directement τύπους et l’infinitif προσκυνεῖν avec son pronom pluriel masculin.
  naturalness: La formulation révisée reste naturelle, sobre et accessible en français international moderne. « Images » est plus idiomatique et plus précis dans ce contexte que « représentations », tout en étant fidèle au sens de τύπους.
  terminology: « Tente », « Moloch », « dieu Réphan », « adorer », « déporterai » et « au-delà de Babylone » respectent le grec des Actes. Les notes conservent utilement les divergences avec la tradition textuelle d’Amos sans harmoniser le texte principal.
  issues:
  - severity: medium
    issue: « C’est pourquoi » traduit καί.
    rationale: καί signifie « et » ; il n’exprime pas à lui seul une conséquence. L’ajout infléchit le lien logique de la citation.
  - severity: low
    issue: « que vous aviez faites » emploie un plus-que-parfait.
    rationale: ἐποιήσατε est un aoriste, coordonné à ἀνελάβετε ; « que vous avez fabriquées » rend plus directement l’action passée sans introduire d’antériorité.
  - severity: low
    issue: « représentations ... devant elles » est moins direct et impose un référent féminin par accord français.
    rationale: τύπους est masculin pluriel et αὐτοῖς renvoie grammaticalement à ces objets. « Les images ... pour les adorer » rend clairement l’accusation cultuelle et suit la construction grecque.
  revised_text: Vous avez emporté la tente de Moloch et l’étoile du dieu Réphan[a], les images que vous avez fabriquées pour les adorer. Et je vous déporterai au-delà de Babylone[b].
