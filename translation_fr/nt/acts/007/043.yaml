reference: Acts 7:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: fr
  text: Vous avez emporté la tente de Moloch et l’étoile du dieu Réphan[a], les images que vous avez fabriquées pour les adorer. Et je vous déporterai au-delà de Babylone[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec des Actes dit « du dieu Réphan ». Certaines traductions, suivant l’hébreu d’Amos 5.26, ont « votre dieu Réphan ».
    reason: alternative_reading
  - marker: b
    text: Les Actes disent ici « au-delà de Babylone ». En Amos 5.27, le passage source est généralement rendu par « au-delà de Damas ».
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: vous avez emporté
  rationale: Le verbe exprime ici le fait de prendre et de porter des objets cultuels. « Emporter » est naturel en français et conserve cette idée sans préciser indûment la manière de les transporter.
- source_word: σκηνὴν
  choice: tente
  rationale: Le sens premier est « tente ». « Tabernacle » risquerait d’évoquer le sanctuaire légitime d’Israël, tandis que « sanctuaire » serait plus interprétatif.
- source_word: Μολὸχ
  choice: Moloch
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: ἄστρον
  choice: étoile
  rationale: Traduction directe du nom grec, sans imposer l’interprétation plus précise d’une image ou d’un symbole astral.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: du dieu Réphan
  rationale: Le texte grec des Actes porte littéralement « du dieu Réphan ». La formulation distincte de la source d’Amos est signalée en note plutôt qu’harmonisée.
- source_word: τύπους
  choice: représentations
  rationale: Dans ce contexte cultuel, le mot désigne des formes ou images fabriquées. « Représentations » reste clair tout en conservant une certaine amplitude lexicale.
- source_word: προσκυνεῖν αὐτοῖς
  choice: vous prosterner devant elles
  rationale: Le verbe peut désigner l’acte corporel de se prosterner et, en contexte religieux, le culte. Cette traduction préserve l’image concrète sans atténuer la portée idolâtre.
- source_word: μετοικιῶ
  choice: je vous déporterai
  rationale: Le futur annonce un déplacement forcé en exil. « Déporter » rend avec concision la contrainte et la dimension judiciaire.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: au-delà de Babylone
  rationale: Traduction directe du texte grec des Actes, sans harmonisation avec Amos 5.27.
theological_decisions:
- issue: Différence entre la citation d’Étienne et Amos concernant le lieu de l’exil
  choice: au-delà de Babylone
  alternative: au-delà de Damas
  rationale: Le texte grec d’Actes 7.43 dit explicitement « Babylone ». La différence avec Amos 5.27 est conservée et signalée, conformément à la priorité donnée au texte source des Actes.
- issue: Relation entre les objets fabriqués et l’acte cultuel
  choice: les représentations que vous aviez faites pour vous prosterner devant elles
  alternative: les images que vous aviez faites pour les adorer
  rationale: La formulation retenue garde le référent grammatical féminin de « représentations » et rend concrètement προσκυνέω, sans trancher plus que nécessaire entre prosternation rituelle et adoration au sens large.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la citation prophétique. « C’est pourquoi » explicite naturellement la coordination grecque devant l’annonce du jugement, sans modifier son lien logique. Les noms propres suivent les formes françaises usuelles.
