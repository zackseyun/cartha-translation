  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: fr
  text: 'Mais celui qui faisait du tort à son prochain repoussa Moïse[a] en disant : « Qui t’a établi chef et juge sur nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le repoussa violemment ». Le verbe grec peut évoquer un geste physique énergique ou un rejet catégorique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: faisait du tort
  rationale: Le participe présent exprime une action en cours et conserve clairement l’idée d’injustice portée par ἀδικέω.
- source_word: πλησίον
  choice: prochain
  rationale: « Prochain » est l’équivalent français courant et préserve la portée relationnelle du terme sans préciser davantage que le grec.
- source_word: ἀπώσατο αὐτόν
  choice: repoussa Moïse
  rationale: « Repoussa » peut décrire à la fois un geste physique et un rejet énergique. Le pronom grec renvoie à Moïse ; répéter son nom évite en français une ambiguïté entre les deux hommes.
- source_word: κατέστησεν
  choice: a établi
  rationale: « Établir quelqu’un chef et juge » rend naturellement la valeur causative de καθίστημι tout en gardant la formulation de la question.
- source_word: ἄρχοντα
  choice: chef
  rationale: « Chef » exprime ici une position d’autorité et forme en français une paire naturelle avec « juge ».
- source_word: δικαστήν
  choice: juge
  rationale: Équivalent direct qui conserve la fonction judiciaire contestée.
- source_word: ἐφ’ ἡμῶν
  choice: sur nous
  rationale: La préposition avec le génitif indique ici l’exercice d’une autorité sur le groupe.
