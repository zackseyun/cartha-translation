  variant: modern international French
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: fr
  text: 'en disant à Aaron : « Fais-nous des dieux[a] qui iront devant nous. Car ce Moïse, qui nous a fait sortir du pays d’Égypte, nous ne savons pas ce qui lui est arrivé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des idoles ». Le grec dit littéralement « des dieux », reprenant la formulation du récit de l’Exode et conservant les propres termes de la demande du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: en disant à Aaron
  rationale: Le participe aoriste introduit les paroles rapportées et se rattache naturellement au récit par « en disant ».
- source_word: Ποίησον ἡμῖν
  choice: Fais-nous
  rationale: L’impératif exprime directement la demande adressée à Aaron; cette formulation est concise et idiomatique.
- source_word: θεοὺς
  choice: des dieux
  rationale: Le grec emploie le pluriel de θεός, « dieux », et non un terme distinct signifiant « idoles »; le conserver respecte l’écho au récit de l’Exode et la formulation même du peuple.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: qui marcheront devant nous
  rationale: La tournure rend le mouvement exprimé par προπορεύομαι sans ajouter explicitement l’idée de diriger; « marcher devant » est naturel en français dans ce contexte.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: Car ce Moïse
  rationale: « Car » marque la justification introduite par γάρ, tandis que « ce Moïse » conserve la valeur démonstrative, possiblement distante ou dépréciative, de οὗτος.
- source_word: ὃς ἐξήγαγεν ἡμᾶς
  choice: qui nous a fait sortir
  rationale: Cette expression française rend clairement ἐξάγω dans le contexte de la sortie d’Égypte, sans suggérer que Moïse en serait la cause ultime.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: du pays d’Égypte
  rationale: La traduction conserve explicitement γῆ, « pays », tout en employant la formulation française consacrée et naturelle.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: nous ne savons pas ce qui lui est arrivé
  rationale: Cette formulation contemporaine et digne restitue directement l’ignorance présente du peuple quant au sort de Moïse.
theological_decisions:
- issue: Traduction de θεοὺς dans un contexte d’idolâtrie
  choice: des dieux
  alternative: des idoles
  rationale: Le texte rapporte la demande du peuple avec le mot « dieux ». Employer « idoles » dans le corps du texte qualifierait d’emblée ces objets et remplacerait le terme grec par une interprétation, alors que l’ironie et la gravité de l’apostasie ressortent déjà du contexte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec sans calque pesant. « Ce Moïse » préserve la possible nuance de distance du démonstratif, tandis que la ponctuation sépare naturellement la justification de la déclaration finale.
