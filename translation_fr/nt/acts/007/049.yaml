id: ACT.7.49
reference: Acts 7:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: fr
  text: Le ciel est mon trône, et la terre est le marchepied sous mes pieds[a]. Quelle maison me bâtirez-vous, dit le Seigneur, ou quel est le lieu de mon repos ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le marchepied de mes pieds ».'
    reason: Alternative littérale du génitif grec τῶν ποδῶν μου.
lexical_decisions:
- source_word: οὐρανός
  choice: le ciel
  rationale: Dans cette citation d’Ésaïe, le terme désigne le domaine céleste opposé à la terre; « le ciel » garde cette portée cosmique et théologique en français naturel.
- source_word: θρόνος
  choice: trône
  rationale: Équivalent direct qui conserve l’image de la royauté et de la souveraineté.
- source_word: γῆ
  choice: la terre
  rationale: Le parallélisme avec le ciel impose ici le sens cosmique plutôt que celui de pays ou de territoire.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: le marchepied de mes pieds
  rationale: Cette formulation suit de près le génitif grec et conserve la mention explicite des pieds, tout en restant intelligible en français.
- source_word: ποῖον
  choice: quelle
  rationale: Dans « quelle maison », l’adjectif interrogatif exprime naturellement en français la qualité ou la nature visée par la question rhétorique.
- source_word: οἶκον
  choice: maison
  rationale: Le grec dit « maison »; ne pas expliciter « temple » préserve la formulation de la citation et laisse le contexte établir la référence.
- source_word: οἰκοδομήσετέ
  choice: me bâtirez-vous
  rationale: Le futur de la question rhétorique est conservé; « bâtir » convient particulièrement à une maison et garde un registre digne.
- source_word: κύριος
  choice: le Seigneur
  rationale: Rend directement κύριος dans cette formule de parole divine du texte grec néotestamentaire.
- source_word: τόπος
  choice: lieu
  rationale: Équivalent courant et précis, adapté au parallélisme rhétorique.
- source_word: καταπαύσεώς μου
  choice: de mon repos
  rationale: Conserve la construction nominale et la résonance théologique du repos divin sans l’expliciter davantage.
theological_decisions:
- issue: Rendu de κύριος dans la citation d’Ésaïe où parle le Dieu d’Israël
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source de la citation dans les Actes porte κύριος. « Le Seigneur » traduit ce terme sans remplacer la forme grecque par une convention propre au tétragramme hébreu.
- issue: Portée de la question sur la maison bâtie pour Dieu
  choice: maison
  alternative: temple / demeure
  rationale: 'Garder « maison » préserve l’expression grecque et la tension rhétorique: aucune construction humaine ne peut contenir celui dont le ciel est le trône, sans ajouter une interprétation au texte.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme poétique de la citation. « Marchepied de mes pieds » est volontairement formel et proche du grec; aucune note n’est nécessaire puisque le sens demeure clair.
