  source_fidelity: La première question rend fidèlement le futur rhétorique οἰκοδομήσετέ. En revanche, τίς τόπος τῆς καταπαύσεώς μου est une question nominale au présent (« quel est le lieu… ? »), non une formulation au futur (« quel sera… ? »).
  naturalness: « Le marchepied de mes pieds » reproduit la forme du génitif grec, mais sonne lourd et peu idiomatique en français moderne. « Le marchepied sous mes pieds » conserve l’image et la mention explicite des pieds dans une formulation naturelle.
  terminology: « le ciel », « la terre », « trône », « maison », « le Seigneur », « lieu » et « repos » sont appropriés et respectent le registre solennel de la citation.
  issues:
