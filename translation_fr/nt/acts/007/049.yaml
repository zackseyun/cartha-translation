    rationale: « ou quel sera le lieu de mon repos ? » introduit un futur absent du grec τίς τόπος τῆς καταπαύσεώς μου. Il faut conserver la question existentielle au présent.
  - severity: low
    issue: Formulation peu naturelle de l’image du marchepied
    rationale: « de mes pieds » est très calqué et pesant en français. « sous mes pieds » rend clairement la relation exprimée par le génitif tout en gardant l’image complète; la tournure littérale peut être signalée en note.
  revised_text: Le ciel est mon trône, et la terre est le marchepied sous mes pieds[a]. Quelle maison me bâtirez-vous, dit le Seigneur, ou quel est le lieu de mon repos ?
