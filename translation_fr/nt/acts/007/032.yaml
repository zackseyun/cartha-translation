id: ACT.7.32
reference: Acts 7:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: fr
  text: « Je suis le Dieu de tes pères, le Dieu d’Abraham, d’Isaac et de Jacob. » Alors Moïse se mit à trembler de peur et n’osait pas regarder attentivement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « examiner » ou « observer de près ». Le verbe grec peut désigner aussi bien un regard attentif qu’un examen réfléchi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ
  choice: Je suis
  rationale: Le pronom est emphatique dans une proposition d’identification sans verbe exprimé. Le français exige naturellement l’ajout de « suis ».
- source_word: τῶν πατέρων σου
  choice: de tes pères
  rationale: « Pères » conserve le sens littéral et la résonance ancestrale et covenantale de la citation, tout en restant compréhensible en français actuel.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: le Dieu d’Abraham, d’Isaac et de Jacob
  rationale: Cette formulation française naturelle conserve la seconde identification en apposition et nomme distinctement les trois patriarches.
- source_word: ἔντρομος δὲ γενόμενος
  choice: Alors Moïse se mit à trembler de peur
  rationale: La tournure rend de façon idiomatique l’entrée dans l’état exprimée par le participe aoriste et réunit les dimensions physique et émotionnelle de ἔντρομος.
- source_word: οὐκ ἐτόλμα
  choice: n’osait pas
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et exprime la retenue persistante de Moïse.
- source_word: κατανοῆσαι
  choice: regarder attentivement
  rationale: Dans le contexte visible du buisson, le verbe désigne probablement le fait de porter un regard attentif, tout en pouvant aussi évoquer un examen soigneux.
theological_decisions:
- issue: Formulation de l’auto-identification divine dans la citation de l’Exode
  choice: Je suis le Dieu de tes pères
  alternative: Moi, le Dieu de tes pères
  rationale: L’ajout du verbe requis par le français restitue l’identification sans développer la formule au-delà de ce qu’affirme le grec.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Tes pères » maintient la tonalité scripturaire sans archaïsme excessif; « se mit à trembler de peur » rend concrètement l’intensité de la réaction de Moïse.
