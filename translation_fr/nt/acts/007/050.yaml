lexical_decisions:
- source_word: οὐχὶ
  choice: N’est-ce pas… ?
  rationale: οὐχί introduit une question rhétorique qui appelle une réponse affirmative. Cette tournure en restitue naturellement la force en français moderne.
- source_word: ἡ χείρ μου
  choice: ma main
  rationale: Le sens concret de χείρ est conservé afin de maintenir l’image anthropomorphique de la citation d’Ésaïe 66.2, plutôt que de l’expliciter par « ma puissance » ou « moi-même ».
- source_word: ἐποίησεν
  choice: a fait
  rationale: Dans ce contexte de création, ποιέω désigne l’action de faire ou de produire. « A fait » est naturel en français et reste proche de la formulation grecque.
- source_word: ταῦτα πάντα
  choice: toutes ces choses
  rationale: Cette formulation rend à la fois la valeur démonstrative de ταῦτα et la portée exhaustive de πάντα.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « ma main » comme expression de l’action créatrice de Dieu
  alternative: Rendre plus dynamiquement par « N’est-ce pas moi qui ai fait toutes ces choses ? » ou interpréter par « ma puissance »
  rationale: La formulation reprend Ésaïe 66.2. Garder l’image de la main préserve le lien scripturaire et la force poétique sans imposer une paraphrase théologique abstraite.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est formulée sans tournure archaïque, tandis que l’image biblique concrète de « ma main » est conservée.
