translation:
  language: fr
  text: N’est-ce pas ma main qui a fait toutes ces choses ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus dynamique : « N’est-ce pas moi qui ai fait toutes ces choses ? »'
