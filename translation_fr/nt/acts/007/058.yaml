reference: Acts 7:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: fr
  text: Après l’avoir chassé hors de la ville, ils le lapidaient. Les témoins déposèrent leurs vêtements[a] aux pieds d’un jeune homme appelé Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs vêtements de dessus » ou « leurs manteaux » ; le terme grec désigne largement les vêtements portés par-dessus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: après l’avoir chassé
  rationale: Le participe aoriste exprime une action antérieure à la lapidation. « Chassé » rend naturellement l’idée d’une expulsion forcée.
- source_word: ἔξω τῆς πόλεως
  choice: hors de la ville
  rationale: Cette formulation conserve le mouvement de l’intérieur vers l’extérieur de la ville et s’accorde idiomatiquement avec « chassé ».
- source_word: ἐλιθοβόλουν
  choice: ils le lapidaient
  rationale: L’imparfait français reflète l’aspect duratif de l’imparfait grec; « lapider » désigne précisément la mise à mort par jets de pierres.
- source_word: οἱ μάρτυρες
  choice: les témoins
  rationale: Dans ce contexte judiciaire, le terme désigne les personnes ayant témoigné, et non des « martyrs » au sens chrétien ultérieur.
- source_word: ἀπέθεντο
  choice: déposèrent
  rationale: Le verbe exprime ici l’action d’ôter puis de poser les vêtements; « déposèrent » convient naturellement avec « aux pieds de ».
- source_word: τὰ ἱμάτια αὐτῶν
  choice: leurs vêtements
  rationale: ἱμάτια peut désigner les vêtements, notamment ceux de dessus. Le terme français général préserve l’étendue sémantique, précisée en note.
- source_word: παρὰ τοὺς πόδας
  choice: aux pieds de
  rationale: Il s’agit de la tournure française idiomatique pour des objets déposés près des pieds de quelqu’un ou confiés à sa garde.
- source_word: νεανίου
  choice: un jeune homme
  rationale: Cette expression moderne et naturelle rend l’âge relatif indiqué par νεανίας sans suggérer un enfant.
- source_word: καλουμένου Σαύλου
  choice: appelé Saul
  rationale: La formulation suit directement le participe grec et reste naturelle en français.
theological_decisions:
- issue: Sens de μάρτυρες dans le cadre d’une exécution
  choice: témoins au sens judiciaire
  alternative: martyrs
  rationale: Le contexte narratif parle des témoins impliqués dans la procédure et la lapidation. Traduire par « martyrs » introduirait un sens ecclésial ultérieur que ce passage ne requiert pas.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait « lapidaient » maintient l’action en cours, tandis que le passé simple « déposèrent » marque l’action ponctuelle des témoins. Le marqueur de note est placé après « vêtements », le mot auquel la variante lexicale se rapporte.
