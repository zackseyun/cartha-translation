  naturalness: Le français est globalement naturel, sobre et d’un registre approprié. « A reçu une part dans ce ministère » est plus net et plus idiomatique dans ce contexte que « avait reçu une part dans ce ministère ».
  terminology: « Ministère » convient pour διακονία dans le contexte apostolique. « Une part » communique bien κλῆρος sans imposer l’idée d’un tirage au sort précis; la note préserve utilement les possibilités « lot » et « part attribuée ».
