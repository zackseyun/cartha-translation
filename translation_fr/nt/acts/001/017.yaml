source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: fr
  text: Car il était compté parmi nous et a reçu une part dans ce ministère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a obtenu le lot / la part attribuée dans ce ministère ». Le mot grec κλῆρος peut désigner un « lot » ou une « part » attribuée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, ὅτι introduit l’explication donnée par Pierre. « Car » en conserve naturellement la valeur causale.
- source_word: κατηριθμημένος ἦν
  choice: était compté
  rationale: Cette tournure périphrastique exprime l’état de Judas comme membre reconnu du groupe et conserve la nuance passive du grec.
- source_word: ἐν ἡμῖν
  choice: parmi nous
  rationale: L’expression indique l’inclusion dans le groupe apostolique, et non une simple proximité.
- source_word: ἔλαχεν
  choice: avait reçu
  rationale: Le verbe peut désigner l’obtention d’une part attribuée, éventuellement par tirage au sort. « Avait reçu » est naturel en français, tandis que la nuance d’attribution est portée par « une part » et signalée en note.
- source_word: τὸν κλῆρον
  choice: une part
  rationale: κλῆρος peut signifier « lot » ou, par extension, « part attribuée ». « Une part » exprime clairement la participation de Judas sans suggérer nécessairement qu’un tirage au sort précis est raconté ici.
- source_word: τῆς διακονίας ταύτης
  choice: dans ce ministère
  rationale: διακονία désigne ici le service apostolique. Avec « une part », la construction « dans ce ministère » est idiomatique et fidèle au sens.
theological_decisions:
- issue: Nature du lien de Judas avec la fonction apostolique
  choice: Le verset affirme que Judas était réellement compté parmi les apôtres et qu’il avait reçu une part dans leur ministère.
  alternative: Comprendre le verset comme indiquant seulement une association extérieure avec le groupe.
  rationale: Le grec exprime à la fois son inclusion parmi les apôtres et sa participation au ministère. La traduction maintient ce constat historique sans en tirer de conclusion doctrinale sur son approbation ou sa persévérance.
translation_notes:
  register: Français international moderne, naturel et digne. « Ministère » conserve le sens du service apostolique; « était compté parmi nous » maintient l’inclusion réelle exprimée par le grec.
