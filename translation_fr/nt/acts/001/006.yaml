  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: fr
  text: 'Alors qu’ils étaient réunis, ils lui demandèrent : « Seigneur, est-ce maintenant que tu rétablis le royaume pour Israël[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Israël ». Le datif grec peut indiquer le bénéficiaire (« pour Israël ») ou, plus directement, le destinataire de la restauration (« à Israël »).
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: Alors qu’ils étaient réunis
  rationale: Le participe a ici une valeur circonstancielle temporelle. « Alors que » rend naturellement l’enchaînement marqué par μὲν οὖν sans reproduire mécaniquement chaque particule.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: ils lui demandèrent
  rationale: Dans ce récit, le passé simple rend naturellement l’imparfait grec sans imposer une insistance sur la durée. Le participe λέγοντες introduit le contenu de la question et n’a pas besoin d’être rendu séparément en français.
- source_word: Κύριε
  choice: Seigneur
  rationale: Ce vocatif conserve à la fois la marque de respect et le poids du titre appliqué à Jésus.
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: maintenant
  rationale: Dans cette question directe, « maintenant » exprime de façon idiomatique le moment ou la période présente visée par le grec, sans le réduire nécessairement à un instant précis.
- source_word: ἀποκαθιστάνεις
  choice: tu rétablis
  rationale: Le présent français convient à la question portant sur l’action attendue au temps présent. « Rétablir » exprime le retour à un état antérieur.
- source_word: τὴν βασιλείαν
  choice: le royaume
  rationale: « Royaume » garde ouverte la portée concrète, nationale et théologique de βασιλεία dans la question des disciples.
- source_word: τῷ Ἰσραήλ
  choice: à Israël
  rationale: Le datif grec peut désigner le destinataire de la restauration; « à Israël » en offre le rendu le plus direct, tout en signalant en note l’autre compréhension possible.
theological_decisions:
- issue: Nature de l’attente des disciples concernant le royaume d’Israël
  choice: Traduire directement comme le rétablissement du royaume « à Israël »
  alternative: « pour Israël » ou « le royaume d’Israël »
  rationale: Le verset rapporte la question des disciples sans préciser ici si leur attente est politique, nationale, spirituelle ou une combinaison de ces dimensions. La formulation retenue préserve cette tension sans l’interpréter à leur place.
translation_notes:
  register: Français international moderne, naturel et digne. La question reste directe, sans explicitation doctrinale. Le marqueur de note est placé après « Israël », expression à laquelle la variante se rapporte.
