  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: fr
  text: 'En ces jours-là, Pierre se leva au milieu des frères[a] et dit (or, le groupe réuni comptait environ cent vingt personnes) :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le grec dit « frères », mais, dans cette communauté rassemblée, le terme peut désigner l’ensemble des croyants, y compris les femmes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste introduit l’action de Pierre avant sa prise de parole; « se leva » est naturel en français et conserve l’action concrète.
- source_word: ἐν μέσῳ
  choice: au milieu de
  rationale: Cette expression situe Pierre au sein du groupe assemblé et en préserve la nuance spatiale.
- source_word: ἀδελφῶν
  choice: frères
  rationale: Le masculin pluriel grec est rendu directement par « frères »; une note signale que, dans ce contexte, le terme peut englober l’ensemble des croyants, femmes comprises.
- source_word: ὄχλος ὀνομάτων
  choice: le groupe … comptait … personnes
  rationale: Littéralement « une foule de noms », cette tournure désigne idiomatiquement un ensemble dénombré de personnes. La formulation française en communique naturellement le sens sans produire l’étrange « nombre de noms ».
- source_word: ἐπὶ τὸ αὐτό
  choice: réuni
  rationale: L’expression indique que les personnes se trouvaient ensemble; « réuni » l’intègre naturellement à la description du groupe.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: environ cent vingt
  rationale: ὡς devant un nombre marque ici l’approximation, clairement exprimée par « environ ».
theological_decisions:
- issue: Portée genrée de ἀδελφῶν dans la communauté assemblée
  choice: « frères » dans le texte, avec une note indiquant le sens inclusif possible
  alternative: « frères et sœurs » ou « croyants » dans le texte
  rationale: La traduction conserve la forme masculine du grec sans exclure silencieusement les femmes que le contexte de la communauté assemblée peut inclure.
translation_notes:
  register: Français international moderne, naturel et digne. L’incise grecque est rendue par des tirets pour éviter une parenthèse lourde avant les deux-points qui introduisent le discours. Le τε de l’incise n’est pas traduit par un « et » autonome, peu naturel ici; sa fonction de liaison demeure perceptible dans l’insertion de la précision narrative.
