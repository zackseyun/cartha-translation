reference: Acts 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: fr
  text: Tous, d’un commun accord[a], persévéraient dans la prière, avec les femmes[b], avec Marie, la mère de Jésus, et avec les frères de Jésus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous unis dans une même intention » ; le grec souligne l’unité de cœur et de but du groupe.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec des femmes ». Le grec n’a pas d’article, mais il s’agit vraisemblablement d’un groupe de femmes connu et associé aux disciples.
    reason: lexical_alternative
  - marker: c
    text: Le mot grec traduit par « frères » peut, selon le contexte, désigner des frères ou plus largement des proches parents ; le texte ne précise pas ici la nature exacte de leur lien familial avec Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: Tous
  rationale: Dans le contexte immédiat, le pronom renvoie naturellement aux personnes qui viennent d’être énumérées. « Tous » rend la totalité du groupe sans alourdir la phrase française.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: persévéraient
  rationale: L’imparfait périphrastique exprime une action continue, tandis que προσκαρτερέω marque l’assiduité et la constance. L’imparfait français « persévéraient » réunit naturellement ces deux nuances.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: Cette expression rend à la fois l’unité du groupe et sa convergence d’intention, sens caractéristique de cet adverbe chez Luc.
- source_word: τῇ προσευχῇ
  choice: dans la prière
  rationale: Avec « persévéraient », cette tournure française est idiomatique et exprime leur pratique assidue de la prière, sans reproduire artificiellement l’article grec.
- source_word: σὺν γυναιξίν
  choice: avec les femmes
  rationale: Bien que le grec n’emploie pas l’article, le contexte suggère un groupe connu de femmes associées aux disciples. Le français appelle naturellement l’article défini dans cette lecture.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: avec Marie, la mère de Jésus
  rationale: La forme française traditionnelle « Marie » convient ici, et l’apposition identifie clairement cette Marie.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: avec les frères de Jésus
  rationale: « Frères » est le sens direct du masculin pluriel ἀδελφοί. La répétition de « Jésus » évite en français toute ambiguïté sur l’antécédent du possessif.
theological_decisions:
- issue: Identité précise des ἀδελφοί de Jésus
  choice: les frères de Jésus
  alternative: les proches parents de Jésus
  rationale: Le grec désigne directement des « frères », mais ne précise pas ici la nature exacte du lien familial. La traduction conserve le terme lexical sans trancher entre frères biologiques, demi-frères, frères par alliance ou parents proches selon les diverses interprétations traditionnelles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en évitant une tournure pesante. « Persévéraient dans la prière » est naturel, accessible et conserve l’idée d’assiduité continue.
