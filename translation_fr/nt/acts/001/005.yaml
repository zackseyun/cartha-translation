id: ACT.1.5
reference: Acts 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: fr
  text: Car Jean a baptisé avec de l’eau, mais vous, vous serez baptisés dans l’Esprit Saint[a] dans peu de jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’Esprit Saint ». La préposition grecque peut présenter l’Esprit comme le milieu dans lequel a lieu le baptême ou comme le moyen par lequel il s’accomplit.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit l’explication de la promesse précédente. « Car » restitue naturellement ce lien en français.
- source_word: Ἰωάννης μὲν … ὑμεῖς δὲ
  choice: Jean … mais vous, vous
  rationale: La construction μὲν…δὲ établit un contraste. La reprise du pronom « vous » rend en français l’accent porté sur ὑμεῖς sans alourdir excessivement la phrase.
- source_word: ἐβάπτισεν / βαπτισθήσεσθε
  choice: a baptisé / serez baptisés
  rationale: Le terme religieux courant « baptiser » préserve le lien verbal entre les deux propositions et n’impose pas une modalité précise du baptême. Le futur passif du second verbe est maintenu.
- source_word: ὕδατι
  choice: dans l’eau
  rationale: Le datif peut exprimer le milieu ou le moyen. « Dans l’eau » est naturel en français et conserve l’image sans préciser davantage le mode du baptême.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  rationale: « Dans » correspond directement à ἐν et préserve la possibilité d’une nuance de sphère, tandis que la lecture instrumentale reste signalée en note. En français moderne, « l’Esprit Saint » désigne naturellement ici le référent défini.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: dans peu de jours
  rationale: Cette formulation idiomatique exprime clairement que l’événement aura lieu peu de jours après le moment présent, sans calquer maladroitement la tournure grecque.
theological_decisions:
- issue: Sens de ἐν dans l’expression ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  alternative: par l’Esprit Saint
  rationale: La préposition peut désigner la sphère ou le moyen. Le texte principal conserve la formulation spatiale plus transparente, tandis que la note présente la compréhension instrumentale sans trancher la question théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le contraste grec est rendu par « mais vous, vous », et la formulation évite aussi bien l’archaïsme que toute précision confessionnelle sur le mode ou la doctrine du baptême.
