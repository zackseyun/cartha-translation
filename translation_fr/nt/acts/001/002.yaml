id: ACT.1.2
reference: Acts 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: fr
  text: jusqu’au jour où, après avoir donné, par l’Esprit Saint, ses ordres aux apôtres qu’il avait choisis, il fut enlevé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: jusqu’au jour où
  rationale: Cette tournure française naturelle conserve la limite temporelle exprimée par l’idiome grec et le lien syntaxique avec le verset précédent.
- source_word: ἐντειλάμενος
  choice: après avoir donné ses ordres
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. « Donner ses ordres » restitue la force de ἐντέλλομαι plus précisément que le terme plus faible « instruire ».
- source_word: τοῖς ἀποστόλοις
  choice: aux apôtres
  rationale: « Apôtres » est le terme français établi et exact pour ce groupe reconnu dans Luc–Actes.
- source_word: διὰ πνεύματος ἁγίου
  choice: par l’Esprit saint
  rationale: Avec le génitif, διά peut indiquer le moyen ou l’agent. La préposition française « par » conserve cette latitude sans ajouter une notion de puissance absente du texte.
- source_word: οὓς ἐξελέξατο
  choice: qu’il avait choisis
  rationale: Le plus-que-parfait français situe naturellement le choix des apôtres avant les ordres donnés et l’enlèvement de Jésus, sans surtraduire la voix moyenne.
- source_word: ἀνελήμφθη
  choice: il fut enlevé
  rationale: Cette forme passive rend directement le grec sans ajouter « au ciel », précision qui n’apparaît pas dans ce verset.
theological_decisions:
- issue: Rapport entre les ordres de Jésus et l’Esprit saint
  choice: Jésus donne ses ordres aux apôtres par l’Esprit saint avant d’être enlevé.
  alternative: Jésus donne ses ordres au moyen de l’Esprit saint, celui-ci étant compris plus explicitement comme moyen plutôt que comme agent.
  rationale: La syntaxe rattache le plus naturellement διὰ πνεύματος ἁγίου à ἐντειλάμενος. Le français « par » maintient l’ouverture du grec entre moyen et agent et n’explicite pas davantage leur rapport.
translation_notes:
  register: Français moderne, naturel et digne. La phrase reste une proposition dépendante commençant par « jusqu’au », puisqu’elle poursuit la construction du verset 1. « Il fut enlevé » conserve le passif et évite d’ajouter une destination que le grec ne précise pas ici.
