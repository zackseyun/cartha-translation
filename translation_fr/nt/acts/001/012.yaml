source:
  edition: SBLGNT
  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: fr
  text: Alors ils retournèrent à Jérusalem depuis le mont des Oliviers, qui est près de Jérusalem, à la distance d’un chemin de sabbat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Un « chemin de sabbat » désignait la distance traditionnellement admise pour se déplacer le jour du sabbat.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans un récit, sans ajouter de précision temporelle absente du grec.
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: ils retournèrent à Jérusalem
  rationale: Rend directement l’aoriste narratif de ὑποστρέφω et le mouvement exprimé par εἰς dans un français idiomatique.
- source_word: ἀπὸ ὄρους
  choice: depuis le mont
  rationale: ἀπό indique le point de départ. « Mont » convient à ce relief traditionnellement nommé et évite de suggérer une haute montagne.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: appelé « des Oliviers »
  rationale: Le grec donne ici le nom du lieu sous une forme elliptique, littéralement liée aux oliviers. Cette formulation conserve cette ellipse inhabituelle sans transformer silencieusement le nom en « mont des Oliviers ».
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: qui se trouve près de Jérusalem
  rationale: Formulation française naturelle qui conserve l’indication explicite de proximité.
- source_word: σαββάτου ἔχον ὁδόν
  choice: à la distance d’un chemin de sabbat
  rationale: Conserve l’idiome culturel juif et sa concision, tandis que la note en explique le sens au lecteur moderne.
theological_decisions:
- issue: Expression juive de distance σαββάτου ἔχον ὁδόν
  choice: à la distance d’un chemin de sabbat
  alternative: à environ la distance qu’il était permis de parcourir un jour de sabbat
  rationale: Le texte désigne la distance au moyen d’un idiome culturel plutôt que d’une mesure chiffrée. Le garder dans le texte préserve le cadre juif et évite d’incorporer l’explication à la traduction.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans être archaïque. Les notes éclairent le nom traditionnel du lieu et l’idiome culturel sans surcharger le verset.
