  source_fidelity: Le projet rend correctement le mouvement de retour, la proximité de Jérusalem et l’idiome de distance. Toutefois, « le mont appelé “des Oliviers” » ne constitue pas en français un nom de lieu complet et crée une ellipse artificielle qui ne reflète pas un usage français naturel.
  naturalness: Le passé simple et « chemin de sabbat » conviennent au registre biblique moderne. « Du mont des Oliviers » est la désignation française établie et naturelle; « à la distance d’un chemin de sabbat » préserve l’idiome tout en restant clair avec une note.
  terminology: « Mont des Oliviers » est le nom usuel en français. La note culturelle doit décrire cette expression comme une distance traditionnellement admise le jour du sabbat, sans la formuler comme une règle individuelle appliquée à « un Juif ».
