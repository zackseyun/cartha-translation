  to: « Frères[a], il fallait que s’accomplisse l’Écriture que l’Esprit Saint avait annoncée d’avance par la bouche de David[b], au sujet de Judas, qui est devenu guide de ceux qui ont arrêté Jésus[c]. »
  rationale: 'La révision conserve la syntaxe théologique du grec : l’Esprit Saint a parlé auparavant, David en est l’intermédiaire, et Judas est celui qui a guidé les personnes ayant arrêté Jésus. Elle rend la phrase plus idiomatique en français moderne et maintient les trois ancres de notes au bon endroit.'
