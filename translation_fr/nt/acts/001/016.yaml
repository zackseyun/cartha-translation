id: ACT.1.16
reference: Acts 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: fr
  text: « Frères[a], il fallait que s’accomplisse l’Écriture que l’Esprit Saint avait annoncée d’avance par la bouche de David[b], au sujet de Judas, qui est devenu guide de ceux qui ont arrêté Jésus[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Hommes, frères ». Il s’agit d’une formule d’adresse masculine.'
    reason: Précision sur la forme de l’apostrophe grecque.
  - marker: b
    text: « Par la bouche de David » est une manière de dire que l’Esprit a parlé par l’intermédiaire de David.
    reason: Explication d’une expression idiomatique.
  - marker: c
    text: 'Ou : « saisi Jésus ».'
    reason: Variante lexicale possible pour le verbe grec.
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: Cette apostrophe française est naturelle et digne. Le grec emploie littéralement deux vocatifs masculins, « hommes, frères » ; cette forme est signalée en note afin de conserver l’information sans produire une tournure française artificielle.
- source_word: ἔδει
  choice: il fallait
  rationale: L’imparfait impersonnel exprime une nécessité. « Il fallait » la conserve sans préciser au-delà du texte la nature ou le mécanisme de cette nécessité.
- source_word: πληρωθῆναι
  choice: que s’accomplisse
  rationale: Cette formulation rend le passif et appartient au vocabulaire courant de l’accomplissement des Écritures dans Luc–Actes.
- source_word: τὴν γραφὴν
  choice: l’Écriture
  rationale: Dans ce contexte, le singulier désigne l’Écriture sainte plutôt qu’un écrit quelconque.
- source_word: προεῖπε
  choice: avait dite d’avance
  rationale: Le verbe signifie littéralement « dire auparavant ». Cette traduction garde cette valeur sans imposer le sens plus technique de « prophétiser », tout en restant naturelle avec l’Écriture comme antécédent.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Forme française contemporaine et usuelle pour désigner l’Esprit de Dieu.
- source_word: διὰ στόματος Δαυὶδ
  choice: par la bouche de David
  rationale: La formulation conserve l’image grecque et présente David comme l’intermédiaire humain de la parole de l’Esprit.
- source_word: περὶ Ἰούδα
  choice: au sujet de Judas
  rationale: Rend clairement le sujet sur lequel portait la parole scripturaire.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: qui est devenu le guide
  rationale: La proposition relative restitue le participe de γίνομαι et le rôle de guide assumé par Judas, sans réduire le sens à la seule action de guider.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: de ceux qui ont arrêté Jésus
  rationale: Dans ce contexte, συλλαμβάνω désigne l’arrestation de Jésus. « Saisi » demeure une possibilité lexicale, indiquée en note.
theological_decisions:
- issue: Nature de la nécessité scripturaire
  choice: « il fallait » sans explicitation supplémentaire
  alternative: « cela devait arriver selon la prédestination divine » ou « il convenait »
  rationale: Le verset affirme une nécessité liée à l’accomplissement de l’Écriture, mais n’en expose pas ici le mécanisme. La traduction ne tranche donc pas davantage entre prescience, dessein divin et responsabilité humaine.
- issue: Rapport entre l’Esprit saint et David dans l’inspiration
  choice: « l’Esprit saint avait dite d’avance par la bouche de David »
  alternative: « David avait annoncée sous l’inspiration de l’Esprit »
  rationale: La syntaxe grecque présente explicitement l’Esprit saint comme celui qui parle et David comme l’intermédiaire humain. La traduction maintient ces deux niveaux d’action.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement grec tout en évitant une apostrophe peu naturelle en français. Les images et les tensions théologiques du texte sont conservées.
