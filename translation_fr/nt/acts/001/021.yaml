id: ACT.1.21
reference: Acts 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: fr
  text: Il faut donc que l’un des hommes qui nous ont accompagnés[a] pendant tout le temps où le Seigneur Jésus allait et venait parmi nous[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se sont joints à nous »; plus littéralement, « qui se sont rassemblés avec nous ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « allait et venait parmi nous » évoque la vie publique et l’activité régulière de Jésus avec ses disciples.
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: Il faut
  rationale: Cette tournure impersonnelle exprime clairement la nécessité et permet de conserver la phrase ouverte, dont la suite se trouve au verset 22.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français la conclusion que Pierre tire de ce qui précède.
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: l’un des hommes qui nous ont accompagnés
  rationale: ἀνδρῶν désigne spécifiquement des hommes, tandis que le participe de συνέρχομαι évoque ici leur association durable avec le groupe. « Accompagnés » rend ce sens naturellement. « L’un des » anticipe en français le ἕνα τούτων du verset 22 afin que la construction reste intelligible malgré la coupure entre les versets.
- source_word: ἐν παντὶ χρόνῳ
  choice: pendant tout le temps
  rationale: L’expression désigne toute la période de l’activité de Jésus avec les disciples, et non chaque occasion prise séparément.
- source_word: ᾧ
  choice: où
  rationale: Le relatif a une valeur temporelle; « où » est la formulation française la plus naturelle après « tout le temps ».
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: allait et venait
  rationale: Cette formulation conserve l’image des déplacements répétés tout en étant idiomatique en français.
- source_word: ἐφ’ ἡμᾶς
  choice: parmi nous
  rationale: Dans cette expression de mouvement et d’activité, « parmi nous » traduit la relation de Jésus avec le groupe des disciples.
- source_word: ὁ κύριος Ἰησοῦς
  choice: le Seigneur Jésus
  rationale: « Seigneur » conserve la valeur honorifique et christologique habituelle de κύριος dans les Actes.
theological_decisions:
- issue: Valeur christologique de κύριος
  choice: le Seigneur Jésus
  alternative: le Maître Jésus
  rationale: « Seigneur » préserve à la fois le titre honorifique établi et sa portée théologique, sans l’affaiblir ni la préciser au-delà du texte.
- issue: Référence masculine de ἀνδρῶν
  choice: hommes
  alternative: personnes
  rationale: Le nom grec ἀνήρ est explicitement masculin; la traduction ne neutralise donc pas ce critère formulé dans le texte.
translation_notes:
  register: Français moderne, international et digne. La formulation reste accessible tout en conservant l’image idiomatique du grec. La virgule finale signale que la phrase se poursuit au verset 22.
