id: ACT.1.8
reference: Acts 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: fr
  text: Mais vous recevrez une puissance lorsque l’Esprit Saint viendra sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée et la Samarie, et jusqu’à l’extrémité de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’aux extrémités de la terre ». L’expression grecque est au singulier (« jusqu’à l’extrémité de la terre »), mais elle désigne idiomatiquement les régions les plus lointaines du monde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec la déclaration précédente du verset 7, de manière naturelle en français.
- source_word: λήμψεσθε δύναμιν
  choice: vous recevrez une puissance
  rationale: λαμβάνω désigne ici la réception de ce qui est donné, et δύναμις une puissance qui rend capable d’accomplir la mission, sans la réduire à la force physique.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: lorsque l’Esprit Saint viendra sur vous
  rationale: Le génitif absolu est rendu par une proposition temporelle naturelle; « viendra sur vous » conserve le mouvement exprimé par ἐπί avec l’accusatif.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: vous serez mes témoins
  rationale: Le génitif μου marque naturellement l’appartenance ou le lien avec Jésus; μάρτυρες désigne ici ceux qui rendent témoignage, sans imposer le sens ultérieur de « martyrs ».
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: dans toute la Judée et la Samarie
  rationale: « Toute » porte grammaticalement sur la Judée; la préposition ἐν vaut aussi pour la Samarie et n’a pas besoin d’être répétée en français.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: jusqu’à l’extrémité de la terre
  rationale: Cette traduction conserve le singulier grec tout en exprimant l’horizon géographique le plus lointain.
theological_decisions:
- issue: Référent de τοῦ ἁγίου πνεύματος
  choice: l’Esprit Saint
  alternative: l’esprit saint
  rationale: Dans ce contexte narratif chrétien, l’expression désigne le référent divin personnel; la majuscule et l’ordre « Esprit Saint » correspondent à l’usage français contemporain.
- issue: Nature de la puissance promise
  choice: une puissance reçue lors de la venue de l’Esprit
  alternative: une capacité ou une force
  rationale: Le terme reste volontairement large afin de préserver le lien textuel entre le don de l’Esprit et le témoignage, sans préciser un mécanisme doctrinal absent du verset.
- issue: Étendue de la mission de témoignage
  choice: une progression géographique concrète jusqu’à l’extrémité de la terre
  alternative: une géographie purement symbolique
  rationale: Les noms de lieux et l’expression finale indiquent une expansion réelle, sans que la traduction impose un schéma ecclésiologique plus détaillé.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche du grec sans être calquée; « une puissance » évite de réduire δύναμις à une simple aptitude, tandis que la note signale l’alternative idiomatique courante au pluriel.
