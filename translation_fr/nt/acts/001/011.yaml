source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: fr
  text: 'Ils dirent aussi : « Hommes de Galilée, pourquoi restez-vous debout à regarder vers le ciel ? Ce Jésus[a], qui vous a été enlevé et emporté au ciel, viendra de la même manière que vous l’avez vu aller au ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une formulation traditionnelle : « Ce même Jésus ». Le grec dit explicitement « Ce Jésus » ; « même » souligne son identité, mais constitue une précision interprétative.'
    reason: Alternative lexicale et traditionnelle pour οὗτος ὁ Ἰησοῦς.
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: Hommes de Galilée
  rationale: Cette apostrophe directe conserve le masculin explicite de ἄνδρες et rend naturellement l’adjectif ethnique Γαλιλαῖοι en français moderne.
- source_word: τί ἑστήκατε βλέποντες
  choice: pourquoi restez-vous debout à regarder
  rationale: Le parfait ἑστήκατε exprime ici l’état présent d’être debout, tandis que βλέποντες décrit l’action qui l’accompagne. « Restez-vous debout à regarder » restitue les deux éléments sans renforcer indûment βλέπω en « fixer » ou « contempler ».
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel / au ciel
  rationale: La première occurrence décrit la direction du regard et appelle naturellement « vers le ciel » ; dans le mouvement d’ascension, « au ciel » exprime idiomatiquement la destination indiquée par εἰς.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: Ce Jésus
  rationale: Le démonstratif οὗτος désigne avec insistance Jésus lui-même. « Ce Jésus » suit directement le grec, sans ajouter « même », dont l’idée d’identité est implicite mais non lexicalement exprimée.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: qui a été enlevé d’auprès de vous
  rationale: Le participe passif ἀναλημφθείς désigne l’action de l’enlèvement au ciel, et ἀφ’ ὑμῶν marque l’éloignement par rapport aux disciples. « D’auprès de vous » rend cette séparation plus clairement que le simple « de vous ».
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: viendra de la même manière que
  rationale: La combinaison de οὕτως et ὃν τρόπον établit une comparaison de manière. Cette formulation française est naturelle et préserve ce rapport sans préciser quels aspects de l’ascension et du retour sont comparés.
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: vous l’avez vu aller
  rationale: θεάομαι indique ici la perception visuelle, et πορεύομαι le mouvement. « Vous l’avez vu aller » reste simple et fidèle, sans surinterpréter la durée ou l’intensité de l’observation.
theological_decisions:
- issue: Sens de οὐρανός dans le contexte de l’ascension et du retour
  choice: ciel
  alternative: firmament / espace visible
  rationale: οὐρανός peut désigner le ciel visible ou le domaine céleste. Le contexte de l’ascension et du retour de Jésus justifie « ciel », terme français qui conserve lui-même ces dimensions sans imposer une distinction absente du texte.
- issue: Traduction de οὗτος ὁ Ἰησοῦς
  choice: Ce Jésus
  alternative: Ce même Jésus
  rationale: Le grec contient explicitement le démonstratif « ce », mais aucun adjectif correspondant à « même ». Le texte principal garde donc la formulation la plus directe, tandis que la tournure traditionnelle est signalée en note.
- issue: Portée de la comparaison entre le départ et le retour de Jésus
  choice: de la même manière que vous l’avez vu aller
  alternative: exactement comme vous l’avez vu aller
  rationale: Le grec compare la manière du retour à celle du départ, mais « exactement » renforcerait cette correspondance au-delà de ce qui est explicitement dit. La traduction préserve ainsi la portée de l’affirmation sans en définir tous les détails.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le ton direct de l’adresse angélique. « Restez-vous debout » évite l’archaïsme de « vous tenez-vous » ; « d’auprès de vous » explicite sobrement la séparation exprimée par ἀπό.
