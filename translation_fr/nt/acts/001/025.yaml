  source_fidelity: La formulation « prendre la place dans ce service » ne rend pas correctement la relation de τόπον à « ministère et apostolat » et n’est pas idiomatique. Le grec parle de la place/fonction relevant de ce ministère et de cet apostolat. « S’est détourné » rend sobrement παρέβη, et « sa propre place » préserve l’ambiguïté délibérée de τὸν τόπον τὸν ἴδιον.
  naturalness: La révision place « dans ce ministère et cet apostolat » en incise, ce qui produit une syntaxe française naturelle sans transformer « place » en une notion institutionnelle plus explicative. « Sa propre place » est plus proche du présent et de l’emphase de ἴδιον que « la place qui était la sienne ».
  terminology: « Ministère » convient à διακονία dans ce contexte apostolique; la note signale « service » comme alternative. « Apostolat » est précis pour ἀποστολή. Les deux occurrences de τόπος sont rendues par « place », préservant l’écho du grec.
  issues:
