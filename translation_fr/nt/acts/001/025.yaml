id: ACT.1.25
reference: Acts 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: fr
  text: pour prendre, dans ce ministère et cet apostolat[a], la place dont Judas s’est détourné pour aller à sa propre place[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce service et cet apostolat ». Le mot grec traduit par « ministère » peut aussi désigner un service confié.
    reason: lexical_alternative
  - marker: b
    text: « Sa propre place » peut désigner simplement la destination propre à Judas ou, de manière plus appuyée, le lieu de jugement qui lui convenait.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: prendre
  rationale: L’infinitif exprime ici ce que le remplaçant choisi est appelé à assumer. « Prendre » convient naturellement à l’entrée dans une fonction.
- source_word: τὸν τόπον
  choice: la place
  rationale: Le terme signifie littéralement « lieu » ou « place » et désigne ici une position. Conserver « place » maintient l’écho avec « la place qui était la sienne » à la fin du verset.
- source_word: διακονίας
  choice: service
  rationale: « Service » rend le sens fondamental de διακονία dans un français actuel et évite que « ministère » soit compris uniquement comme un statut institutionnel.
- source_word: ἀποστολῆς
  choice: apostolat
  rationale: Dans ce contexte, le mot désigne la charge ou mission propre aux apôtres; « apostolat » est l’équivalent français précis et concis.
- source_word: ἀφ’ ἧς
  choice: dont
  rationale: Le relatif renvoie à l’ensemble « ce service et cet apostolat ». « Dont » exprime naturellement en français l’éloignement marqué par ἀπό.
- source_word: παρέβη
  choice: s’est détourné
  rationale: Le verbe peut exprimer un écart, un abandon ou une transgression. « S’est détourné » préserve l’idée de déviation sans imposer une qualification doctrinale plus précise.
- source_word: πορευθῆναι
  choice: pour aller
  rationale: Cette formulation rend simplement le mouvement exprimé par πορεύομαι tout en conservant le lien syntaxique avec le fait que Judas s’est détourné.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: à la place qui était la sienne
  rationale: Cette expression reste volontairement énigmatique, comme le grec, et préserve la répétition de τόπος sans identifier explicitement la destination.
theological_decisions:
- issue: La destination de Judas dans l’expression « la place qui était la sienne »
  choice: Conserver une formulation ambiguë dans le texte principal.
  alternative: Préciser qu’il s’agit de la mort, du séjour des morts, de l’enfer ou du lieu de jugement qui lui convenait.
  rationale: Le grec ne définit pas explicitement cette destination. La traduction ne doit donc pas trancher une question théologique que le texte laisse ouverte.
- issue: La nuance morale de παρέβη
  choice: « s’est détourné »
  alternative: « a transgressé », « a abandonné » ou « s’est écarté »
  rationale: Le contexte indique que Judas a quitté ou délaissé son service apostolique, mais le verbe permet plusieurs nuances. La formulation choisie exprime l’écart sans surinterprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle. La répétition de « place » est délibérément conservée, et les ambiguïtés concernant l’abandon de Judas et sa destination ne sont pas résolues dans le texte principal.
