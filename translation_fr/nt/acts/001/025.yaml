    issue: Relation syntaxique de « la place » à « ce service et cet apostolat »
    rationale: « Prendre la place dans ce service et cet apostolat » est une construction maladroite et peut laisser entendre une simple place interne au service. Le grec vise la place/fonction liée à ce ministère et apostolat.
  - severity: low
