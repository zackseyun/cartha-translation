  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: fr
  text: Ils tirèrent au sort entre les deux[a], et le sort tomba sur Matthias. Il fut compté parmi les onze apôtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils leur donnèrent des sorts » ; c’est-à-dire qu’ils tirèrent au sort pour les départager.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « inscrit au nombre des onze apôtres » ; autre traduction possible : « ajouté aux onze apôtres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: ils tirèrent au sort entre les deux
  rationale: L’expression grecque signifie littéralement qu’ils « leur donnèrent des lots ». En contexte, elle décrit le recours au tirage au sort pour départager les deux candidats. La formulation retenue est naturelle en français et explicite le référent de αὐτοῖς sans ajouter de mécanisme précis.
- source_word: κλήρους / ὁ κλῆρος
  choice: tirèrent au sort / le sort
  rationale: Dans ce récit, κλῆρος désigne le moyen de sélection et son résultat, non une part d’héritage. « Tirer au sort » est l’expression française idiomatique, tandis que « le sort tomba sur » conserve l’image du grec.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: le sort tomba sur Matthias
  rationale: Cette formulation française conserve de près la métaphore grecque tout en exprimant clairement le résultat du tirage.
- source_word: Μαθθίαν
  choice: Matthias
  rationale: Le nom propre est rendu selon sa forme française biblique courante.
- source_word: συγκατεψηφίσθη
  choice: fut compté parmi
  rationale: Le verbe indique que Matthias fut dénombré ou reconnu comme faisant partie du groupe. « Fut compté parmi » reste proche du grec et n’implique pas davantage que l’énoncé narratif.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: parmi les onze apôtres
  rationale: Bien que μετά avec le génitif signifie littéralement « avec », le français dit naturellement qu’une personne est « comptée parmi » les membres d’un groupe. Le groupe est désigné, du point de vue narratif antérieur à l’intégration de Matthias, comme les onze apôtres.
theological_decisions:
- issue: Le degré d’autorité ou d’investiture impliqué par συγκατεψηφίσθη
  choice: Il fut alors compté parmi les onze apôtres
  alternative: Il fut ajouté aux onze apôtres
  rationale: La traduction retenue rapporte l’intégration reconnue de Matthias au groupe sans préciser au-delà du texte la nature ecclésiologique ou sacramentelle de cette reconnaissance.
translation_notes:
  register: Français moderne, clair et digne. Le premier membre est rendu idiomatiquement pour éviter le calque obscur « donner des lots », tandis que « le sort tomba sur » conserve l’image concrète du texte grec. La coordination grecque est répartie en deux phrases afin d’obtenir une narration française fluide sans modifier la progression des faits.
