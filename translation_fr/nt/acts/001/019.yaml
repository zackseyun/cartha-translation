id: ACT.1.19
reference: Acts 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: fr
  text: Le fait fut connu de tous les habitants de Jérusalem, si bien que ce champ fut appelé, dans leur propre langue[a], Hakeldamach[b], c’est-à-dire « Champ du Sang ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur propre dialecte ». Le grec διάλεκτος peut désigner une langue ou une forme régionale de celle-ci.
    reason: lexical_alternative
  - marker: b
    text: La forme grecque est Ἁκελδαμάχ. De nombreuses traductions emploient la forme traditionnelle « Akeldama ».
    reason: alternative_rendering
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: le fait fut connu
  rationale: La tournure impersonnelle indique que l’événement évoqué précédemment devint connu; « le fait » fournit en français un sujet naturel sans préciser davantage son contenu.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: de tous les habitants de Jérusalem
  rationale: Cette formulation française actuelle rend clairement le participe substantivé désignant ceux qui résident à Jérusalem.
- source_word: ὥστε
  choice: si bien que
  rationale: La locution exprime naturellement en français le résultat introduit par ὥστε, sans le transformer en simple déduction logique.
- source_word: κληθῆναι
  choice: fut appelé
  rationale: Le passif conserve directement la construction grecque et convient à l’attribution d’un nom au champ.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ce champ
  rationale: χωρίον désigne ici une parcelle ou un champ; « champ » maintient en outre la cohérence avec la glose Χωρίον Αἵματος.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: dans leur propre langue
  rationale: διάλεκτος peut désigner une langue ou un dialecte. « Langue » est naturel dans ce contexte, tandis qu’une note préserve l’autre possibilité.
- source_word: Ἁκελδαμάχ
  choice: Hakeldamach
  rationale: Cette translittération française représente la forme grecque, y compris l’esprit rude initial et la consonne finale χ, sans substituer silencieusement la forme traditionnelle abrégée.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Cette formule française introduit clairement la traduction explicative donnée par le texte.
- source_word: Χωρίον Αἵματος
  choice: Champ du Sang
  rationale: La formule traduit littéralement la glose grecque et sa majuscule marque sa fonction de nom de lieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le rapport de résultat du grec et la glose du nom de lieu, tout en signalant les ambiguïtés lexicales et la forme traditionnelle du toponyme.
