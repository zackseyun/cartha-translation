  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: fr
  text: 'Mais il leur dit : « Ce n’est pas à vous de connaître les temps ou les moments[a] que le Père a fixés de sa propre autorité[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les temps ou les époques », ou « les périodes ou les moments déterminés ». Le grec emploie deux termes proches : χρόνοι pour des temps ou des périodes, et καιροί pour des moments déterminés ou décisifs.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans sa propre autorité » : ces temps relèvent de la prérogative propre du Père.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque une transition légèrement contrastive entre la question des disciples et la réponse corrective de Jésus.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: Ce n’est pas à vous de connaître
  rationale: Rend naturellement l’idée que cette connaissance ne relève pas des disciples, sans expliciter davantage que le grec.
- source_word: χρόνους
  choice: les temps
  rationale: Désigne généralement le temps envisagé dans sa durée ou des périodes temporelles.
- source_word: καιρούς
  choice: les moments fixés
  rationale: Exprime des moments déterminés, opportuns ou décisifs, tout en distinguant le terme de χρόνοι.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Reproduit le titre articulé du grec sans ajouter le possessif « mon ».
- source_word: ἔθετο
  choice: a établis
  rationale: Rend l’action de fixer ou d’établir, avec sa pertinence durable dans le contexte.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: de sa propre autorité
  rationale: Formulation française naturelle qui exprime que la fixation de ces temps relève de l’autorité propre du Père.
theological_decisions:
- issue: Rendu du couple χρόνοι / καιροί
  choice: les temps ou les moments fixés
  alternative: les temps ou les époques ; les périodes ou les moments déterminés
  rationale: Préserve la distinction entre deux notions temporelles proches sans leur imposer un système technique ou spéculatif.
- issue: Sens de ἐξουσία appliqué au Père
  choice: de sa propre autorité
  alternative: dans sa propre autorité ; sous sa propre autorité
  rationale: Affirme clairement la prérogative du Père sans importer de formulation doctrinale extérieure au verset.
translation_notes:
  register: Français international moderne, naturel et digne. La structure corrective de la réponse est conservée, ainsi que la distinction souple entre les deux termes temporels et l’ambiguïté prépositionnelle de l’expression finale grâce à une note.
