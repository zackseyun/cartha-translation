id: ACT.1.20
reference: Acts 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: fr
  text: 'Car il est écrit dans le livre des Psaumes : « Que sa demeure devienne déserte et que personne ne l’habite », et : « Qu’un autre prenne sa charge[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa fonction de supervision » ou « sa responsabilité ». Le terme grec désigne une charge comportant une responsabilité de supervision.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française habituelle de citation de l’Écriture, qui rend naturellement la valeur présente du parfait passif.
- source_word: βίβλῳ ψαλμῶν
  choice: dans le livre des Psaumes
  rationale: Rend directement le groupe grec désignant la source scripturaire, dans un français standard et clair.
- source_word: Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος
  choice: Que sa demeure devienne déserte
  rationale: Le subjonctif jussif restitue l’impératif grec; « demeure » rend largement ἔπαυλις, et « déserte » exprime ici l’absence d’habitants.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: que personne ne l’habite
  rationale: Formulation française naturelle qui conserve le sens de l’interdiction d’avoir un habitant, sans lourdeur littérale.
- source_word: ἐπισκοπή
  choice: charge
  rationale: Dans ce contexte, le mot désigne une responsabilité ou fonction de surveillance laissée vacante par Judas; « charge » reste sobre et n’importe pas un titre ecclésiastique ultérieur.
- source_word: λαβέτω ἕτερος
  choice: Qu’un autre prenne
  rationale: Le subjonctif jussif rend l’impératif aoriste et exprime clairement la reprise de la charge par une autre personne.
theological_decisions:
- issue: Sens de ἐπισκοπή appliqué à la place laissée vacante par Judas
  choice: charge
  alternative: fonction de surveillance; responsabilité; épiscopat
  rationale: « Charge » exprime un rôle confié qui doit être repris, tout en préservant la portée générale du grec. « Épiscopat » risquerait de projeter sur le passage un office ecclésiastique technique plus tardif.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme solennel des deux citations est maintenu par le subjonctif jussif. La ponctuation distingue clairement les deux passages des Psaumes cités.
