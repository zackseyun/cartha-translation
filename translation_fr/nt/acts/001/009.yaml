  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: fr
  text: Après avoir dit cela, tandis qu’ils le regardaient, il fut élevé[a], et une nuée[b] le déroba à leurs regards[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut enlevé » ou « fut emporté vers le haut ».'
    reason: lexical_alternative
  - marker: b
    text: Dans plusieurs récits bibliques, une nuée est associée à la présence de Dieu ; le verset ne précise toutefois pas explicitement que tel est son sens ici.
    reason: cross_reference
  - marker: c
    text: 'Ou : « le reçut hors de leur vue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste εἰπών présente ces paroles comme antérieures à l’action principale. Cette formulation française rend clairement la succession sans alourdir la phrase; le καί assure ici la continuité narrative et n’exige pas un « et » initial.
- source_word: βλεπόντων αὐτῶν
  choice: tandis qu’ils le regardaient
  rationale: Le génitif absolu exprime une circonstance simultanée et souligne que les disciples ont été témoins de la scène.
- source_word: ἐπήρθη
  choice: il fut élevé
  rationale: Le passif conserve à la fois le mouvement vers le haut et l’absence d’agent explicitement nommé. « Fut élevé » est digne, naturel dans ce récit et plus proche du sens lexical que la seule formule traditionnelle « fut enlevé ».
- source_word: νεφέλη
  choice: une nuée
  rationale: Le nom singulier sans article appelle naturellement l’indéfini. « Nuée » convient au registre biblique et peut porter les résonances scripturaires du terme sans les expliciter dans le corps du texte.
- source_word: ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: le déroba à leurs regards
  rationale: Cette expression française rend naturellement le fait que la nuée le prend et le soustrait à leur perception visuelle. Elle évite le calque peu idiomatique « le reçut loin de leurs yeux ».
theological_decisions:
- issue: Faut-il employer pour ἐπήρθη une formule traditionnelle explicitement associée à l’ascension?
  choice: il fut élevé
  alternative: il fut enlevé
  rationale: Le texte décrit un mouvement visible vers le haut au moyen d’un passif, sans nommer ici l’agent. Le choix retenu préserve ces éléments sans imposer une formulation doctrinale plus spécialisée.
- issue: Faut-il identifier explicitement la nuée à la présence divine?
  choice: une nuée
  alternative: la nuée divine
  rationale: La nuée peut évoquer ailleurs dans les Écritures la présence de Dieu, mais ce verset ne formule pas cette identification. La traduction reste donc sobre et signale seulement cette résonance possible en note.
- issue: Faut-il expliciter l’agent du passif ἐπήρθη?
  choice: maintien du passif sans agent nommé
  alternative: Dieu l’éleva
  rationale: Même si le passif peut sous-entendre l’action divine dans ce contexte, le grec ne nomme pas l’agent. L’ajouter résoudrait une implicitation que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » conserve une tonalité biblique appropriée sans devenir obscure en contexte. La phrase évite les calques tout en maintenant le témoignage visuel, le passif non agentif et la possible portée symbolique de la nuée.
