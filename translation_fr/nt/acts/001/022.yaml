id: ACT.1.22
reference: Acts 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: fr
  text: depuis le baptême de Jean[a] jusqu’au jour où il a été enlevé d’auprès de nous, l’un d’eux doit devenir témoin avec nous de sa résurrection[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis le baptême de Jean ».'
    reason: La construction grecque peut aussi être comprise comme « le baptême associé à Jean » ; le texte principal conserve la formulation française la plus directe.
  - marker: b
    text: 'On peut aussi ponctuer : « devenir, avec nous, témoin de sa résurrection ».'
    reason: Cette ponctuation souligne que « avec nous » peut se rattacher à l’exercice commun du témoignage, sans modifier le sens.
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ
  choice: depuis
  rationale: Dans la phrase commencée au verset précédent, cette tournure introduit naturellement en français le point de départ de toute la période exigée, sans alourdir le texte par un participe peu idiomatique.
- source_word: τοῦ βαπτίσματος Ἰωάννου
  choice: le baptême de Jean
  rationale: Cette expression reste proche du génitif grec et peut désigner le baptême associé au ministère de Jean sans préciser davantage la relation.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: jusqu’au jour où
  rationale: Formulation temporelle naturelle en français moderne, fidèle à la proposition relative grecque.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: il a été enlevé d’auprès de nous
  rationale: « A été enlevé » conserve le passif et évoque l’élévation de Jésus sans ajouter explicitement « au ciel », absent de ce verset. « D’auprès de nous » exprime son départ du groupe.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: témoin de sa résurrection
  rationale: Le français admet naturellement « témoin de » et conserve la construction génitive du grec.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: devenir avec nous témoin
  rationale: La formulation indique que la personne choisie se joindra au groupe apostolique dans sa fonction de témoin.
- source_word: ἕνα τούτων
  choice: l’un d’eux
  rationale: Le pronom reprend naturellement en français les hommes mentionnés au verset précédent, sans répéter un nom absent du grec.
theological_decisions:
- issue: Nécessité régissant l’infinitif, exprimée au verset précédent
  choice: doit devenir
  alternative: devienne
  rationale: Le δεῖ du verset 21 régit la construction qui se poursuit ici. « Doit » rend explicitement cette nécessité syntaxique en français sans lui ajouter une portée doctrinale.
- issue: Référence à l’ascension
  choice: a été enlevé
  alternative: est monté au ciel
  rationale: Le choix retenu préserve le passif et l’idée de retrait ou d’élévation, tout en évitant d’ajouter « au ciel », qui n’apparaît pas dans ce verset.
- issue: Nature du témoignage apostolique
  choice: témoin de sa résurrection
  alternative: témoin avec nous qu’il est ressuscité
  rationale: La formulation nominale conserve la sobriété et l’ambiguïté grammaticale du génitif grec, sans transformer le texte en proposition explicative.
translation_notes:
  register: Français international actuel, sobre et digne. Le verset demeure syntaxiquement lié au verset 21, comme dans le grec. L’absence d’article devant « témoin » est idiomatique après « devenir ». Les deux marqueurs de note figurent dans le texte aux endroits concernés.
