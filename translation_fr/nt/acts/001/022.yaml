  verdict: revise
  source_fidelity: Le sens temporel, la nécessité héritée de 1:21, le passif de ἀνελήμφθη et le contenu du témoignage sont globalement bien rendus. Cependant, la place de « avec nous » dans le texte proposé (« devenir avec nous témoin ») est peu idiomatique et rend moins clairement sa portée sur le témoignage commun.
  naturalness: « Devenir témoin avec nous de sa résurrection » est plus naturel en français international actuel tout en conservant l'ambiguïté modérée de rattachement présente dans le grec. « A été enlevé d’auprès de nous » reste acceptable et préserve le passif sans ajouter « au ciel ».
  terminology: « Le baptême de Jean », « témoin » et « sa résurrection » sont fidèles et de registre approprié. La note a actuelle transforme inutilement le syntagme nominal grec en une activité durative (« depuis que Jean baptisait ») ; une note lexicale ne devrait pas présenter cette explicitation comme une équivalence directe.
  issues:
  - severity: medium
    issue: Placement peu naturel de « avec nous »
    rationale: Dans « l’un d’eux doit devenir avec nous témoin », l’incise non ponctuée est lourde en français. Le grec σὺν ἡμῖν exprime que le nouvel élu exercera le témoignage avec le groupe existant ; « devenir témoin avec nous » le rend plus clairement et naturellement.
  - severity: low
    issue: Note a trop interprétative
    rationale: « Depuis que Jean baptisait » substitue une proposition décrivant l’activité de Jean au syntagme « le baptême de Jean ». Cela peut éclairer le contexte, mais ce n’est pas une alternative de traduction suffisamment directe du grec.
  - severity: low
    issue: Note b ne correspond pas nettement à une véritable variante de traduction
    rationale: La note proposée reformule seulement l’ordre français des mêmes éléments. Une formulation ponctuée peut néanmoins signaler le rattachement possible de « avec nous » au témoignage commun.
  revised_text: depuis le baptême de Jean[a] jusqu’au jour où il a été enlevé d’auprès de nous, l’un d’eux doit devenir témoin avec nous de sa résurrection[b].
