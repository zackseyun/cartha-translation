id: ACT.1.1
reference: Acts 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: fr
  text: Dans mon premier récit[a], Théophile, j’ai écrit sur tout ce que Jésus a commencé à faire et à enseigner,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans mon récit précédent » ou « dans mon premier livre ».
    reason: Alternative lexicale pour πρῶτον λόγον, qui peut désigner le premier écrit ou l’écrit antérieur.
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: Dans mon premier récit
  rationale: Ici, λόγος désigne un écrit suivi, et non une simple « parole ». « Récit » renvoie naturellement à l’Évangile selon Luc. Le possessif et la préposition sont requis par l’expression idiomatique française « dans mon premier récit »; « premier » conserve la valeur séquentielle de πρῶτον, tandis que μέν pose le premier volet d’une continuité discursive sans équivalent français autonome nécessaire.
- source_word: ἐποιησάμην
  choice: j’ai écrit
  rationale: Avec λόγος pour complément, ποιέω signifie ici composer ou produire un écrit. « J’ai écrit » est l’équivalent français courant et précis.
- source_word: περὶ πάντων
  choice: sur tout
  rationale: περί avec le génitif indique le sujet traité. « Sur tout ce que » forme avec le relatif qui suit une tournure française naturelle, sans transformer πάντων en affirmation d’exhaustivité absolue.
- source_word: ὦ Θεόφιλε
  choice: Théophile
  rationale: ὦ introduit l’apostrophe. En français moderne, le nom détaché par des virgules suffit à marquer l’adresse directe; « ô Théophile » aurait une coloration archaïque ou emphatique absente du contexte.
- source_word: ὧν
  choice: ce que
  rationale: Le relatif génitif dépend de πάντων. La construction française « tout ce que » rend clairement et naturellement l’ensemble περὶ πάντων ... ὧν.
- source_word: ἤρξατο
  choice: a commencé
  rationale: Le sens explicite de « commencer » est conservé. Il permet de percevoir une éventuelle continuité de l’œuvre de Jésus dans les Actes sans l’expliciter dans la traduction.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: à faire et à enseigner
  rationale: La coordination τε καί unit étroitement les actions et l’enseignement de Jésus. En français, « à faire et à enseigner » est plus naturel que « à la fois à faire et à enseigner » tout en maintenant les deux infinitifs distincts.
theological_decisions:
- issue: Portée de ἤρξατο (« a commencé ») et continuité de l’œuvre de Jésus dans les Actes
  choice: Conserver « a commencé » sans expliquer davantage la continuité.
  alternative: Traduire « tout ce que Jésus a fait et enseigné » ou expliciter qu’il poursuit son œuvre par les apôtres.
  rationale: Le grec exprime bien le commencement. Cette formulation peut suggérer que les Actes racontent la suite de l’action de Jésus, mais la traduction doit laisser cette implication ouverte au lieu de la transformer en paraphrase théologique.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « Théophile » évite le « ô » littéraire. La phrase garde la virgule finale parce que le verset se poursuit syntaxiquement.
