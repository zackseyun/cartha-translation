  - severity: low
    issue: La note [b] devient inutile dans une formulation française idiomatique.
    rationale: Une fois la parole entière mise entre guillemets, « dont vous m’avez entendu parler » rend suffisamment le grec et ne requiert pas une note littérale qui n’apporte pas d’alternative textuelle substantielle.
