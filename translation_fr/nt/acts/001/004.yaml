  source_fidelity: 'Le sens essentiel est bien rendu : Jésus est avec les siens, leur donne un ordre de ne pas quitter Jérusalem et d’attendre la promesse du Père. Toutefois, le grec passe à la deuxième personne dans ἣν ἠκούσατέ μου, ce qui signale naturellement la parole de Jésus. En français, les guillemets ne devraient donc pas s’ouvrir seulement à la relative finale : l’ensemble de l’ordre doit être présenté comme discours direct.'
