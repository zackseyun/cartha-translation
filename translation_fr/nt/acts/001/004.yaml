  terminology: « ordonna », « Jérusalem » et « la promesse du Père » sont fidèles et d’un registre approprié. « dont vous m’avez entendu parler » exprime idiomatiquement le sens de « que vous avez entendue de moi », sans préciser indûment le contenu de la promesse.
