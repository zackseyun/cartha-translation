source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: fr
  text: 'Tandis qu’il se trouvait avec eux[a], il leur ordonna : « Ne quittez pas Jérusalem, mais attendez la promesse du Père, dont vous m’avez entendu parler. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « alors qu’il était réuni avec eux » ; selon une ancienne interprétation du verbe : « alors qu’il prenait un repas avec eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: Tandis qu’il se trouvait avec eux
  rationale: Le participe est lexicalement difficile. Cette formulation naturelle exprime avec prudence le fait que Jésus était avec les apôtres, sans imposer le sens plus précis de « prendre un repas » ni le sens formel de « se réunir ».
- source_word: παρήγγειλεν
  choice: il leur ordonna
  rationale: Le verbe exprime une directive donnée avec autorité. « Ordonner » en conserve la force en français moderne.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: de ne pas quitter Jérusalem
  rationale: La tournure française rend clairement l’interdiction de partir de la ville, sans calquer inutilement l’idée littérale de séparation.
- source_word: περιμένειν
  choice: d’attendre
  rationale: « Attendre » est idiomatique et conserve l’idée d’une attente orientée vers l’accomplissement à venir.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: la promesse du Père
  rationale: Cette traduction directe préserve la construction du grec et ne transforme pas explicitement la promesse en « don », précision fournie par le contexte.
- source_word: ἣν ἠκούσατέ μου
  choice: celle dont vous m’avez entendu parler
  rationale: Le grec signifie littéralement « que vous avez entendue de moi ». La formulation retenue clarifie naturellement en français que Jésus avait parlé de cette promesse, sans ajouter son contenu.
theological_decisions:
- issue: Sens de συναλιζόμενος dans le cadre des apparitions de Jésus après sa résurrection
  choice: Formulation générale indiquant que Jésus se trouvait avec les apôtres
  alternative: « alors qu’il était réuni avec eux » ou « alors qu’il prenait un repas avec eux »
  rationale: Le terme est discuté. Une formulation générale préserve la scène sans faire du repas une précision certaine; les possibilités plus spécifiques sont signalées en note.
- issue: Locuteur de la proposition ἣν ἠκούσατέ μου
  choice: 'Paroles directes de Jésus : « celle dont vous m’avez entendu parler »'
  alternative: 'Discours indirect : « celle dont, leur dit-il, vous avez entendu parler de ma bouche »'
  rationale: Le passage à la deuxième personne signale naturellement l’insertion des propres paroles de Jésus. Les guillemets rendent ce changement de voix lisible sans résoudre une question doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Quitter Jérusalem » et « attendre » sont naturels pour un large lectorat. La note [a] conserve l’ambiguïté lexicale réelle; la note [b] rend transparente la formulation plus explicite choisie dans le texte.
