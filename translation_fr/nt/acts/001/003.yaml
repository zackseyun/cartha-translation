id: ACT.1.3
reference: Acts 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: fr
  text: Après avoir souffert, il s’est aussi présenté vivant à eux, avec de nombreuses preuves[a]. Pendant quarante jours[b], il leur est apparu et leur a parlé de ce qui concerne le royaume de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de nombreuses preuves » ou « avec de nombreuses preuves convaincantes ». Le terme grec désigne des éléments probants qui établissent la certitude.
    reason: lexical_alternative
  - marker: b
    text: Ou « au cours d’une période de quarante jours ». L’expression indique que ses apparitions se sont réparties sur cette période.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: à eux
  rationale: Le pronom relatif datif renvoie aux apôtres mentionnés au verset précédent. « À eux » reste proche du grec sans ajouter un nom absent du texte.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: il s’est aussi présenté vivant à eux
  rationale: La tournure conserve l’idée de se présenter ou de se montrer soi-même, tandis que « vivant » exprime l’état de Jésus après ses souffrances.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: après avoir souffert
  rationale: La construction avec μετά et l’infinitif articulé marque clairement l’antériorité des souffrances.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: avec de nombreuses preuves
  rationale: τεκμήριον désigne un élément probant qui établit la certitude. « Preuves » rend cette force sans ajouter un qualificatif interprétatif.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: pendant quarante jours
  rationale: διά avec le génitif indique ici une période au cours de laquelle les apparitions ont eu lieu, sans nécessairement suggérer une présence ininterrompue.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: il leur est apparu
  rationale: Cette formulation française naturelle rend le sens courant de ὀπτάνομαι dans les récits d’apparitions après la résurrection.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: il leur a parlé de ce qui concerne le royaume de Dieu
  rationale: « Ce qui concerne » reflète τὰ περὶ sans alourdir excessivement la phrase; « royaume de Dieu » conserve l’expression biblique habituelle et son amplitude sémantique.
theological_decisions:
- issue: Résurrection et valeur probante des apparitions
  choice: Le texte affirme que Jésus s’est présenté vivant après avoir souffert, avec de nombreuses preuves.
  alternative: Il s’est montré vivant après sa passion par de nombreuses preuves incontestables.
  rationale: La traduction maintient l’affirmation explicite de sa vie après ses souffrances et la force probante de τεκμήρια, sans employer « passion », devenu moins transparent, ni ajouter « incontestables ».
- issue: Genre de l’antécédent de οἷς
  choice: à eux
  alternative: à ces hommes
  rationale: Les apôtres sont bien l’antécédent contextuel, mais le grec n’emploie ici aucun nom signifiant « hommes ». Le pronom français conserve donc la formulation du texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque a été divisée en deux phrases pour éviter une accumulation participiale peu naturelle en français, tout en conservant les relations temporelles et logiques. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles les notes se rapportent.
