source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: fr
  text: 'Quand ils furent entrés, ils montèrent dans la pièce à l’étage où ils séjournaient : Pierre, Jean, Jacques et André ; Philippe et Thomas ; Barthélemy et Matthieu ; Jacques, fils d’Alphée, Simon le Zélote et Jude, fils de Jacques[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jude, frère de Jacques ». Le grec dit seulement « Jude de Jacques » et laisse le lien exact implicite.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: ils furent entrés
  rationale: Dans la proposition temporelle introduite par ὅτε, l’aoriste exprime une entrée antérieure à la montée. Le passé antérieur convient ici au registre narratif soutenu et marque clairement cette succession.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: ils montèrent dans la pièce à l’étage
  rationale: Cette formulation conserve à la fois le mouvement vers le haut exprimé par ἀνέβησαν et la destination architecturale désignée par ὑπερῷον, dans un français actuel.
- source_word: οὗ ἦσαν καταμένοντες
  choice: où ils séjournaient
  rationale: Le verbe καταμένω et la construction imperfective indiquent qu’ils demeuraient là pendant un certain temps. « Séjournaient » rend cette durée sans nécessairement suggérer une résidence permanente.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: Jacques, fils d’Alphée
  rationale: Dans cette liste identificatrice, le génitif désigne naturellement la filiation. L’ajout de « fils de » produit un français clair.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: Simon le Zélote
  rationale: ζηλωτής sert ici de surnom distinctif. « Le Zélote » est la désignation française usuelle et ne remplace pas le terme grec par la forme différente présente dans certaines listes évangéliques.
- source_word: Ἰούδας Ἰακώβου
  choice: Jude, fils de Jacques
  rationale: Dans une liste où les personnes sont identifiées par leur parenté, la filiation est le sens contextuel le plus probable. Le génitif grec ne nommant toutefois pas explicitement le lien, l’autre possibilité est signalée en note.
theological_decisions:
- issue: Lien de parenté exprimé par Ἰούδας Ἰακώβου
  choice: Jude, fils de Jacques
  alternative: Jude, frère de Jacques
  rationale: Le génitif grec signifie littéralement « Jude de Jacques » et laisse le rapport exact implicite. La filiation est la lecture la plus probable dans cette liste de noms, mais la possibilité d’une relation fraternelle doit rester visible afin de ne pas supprimer l’ambiguïté du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. « Pièce à l’étage » évite les connotations ecclésiales possibles de « chambre haute » tout en gardant le sens spatial. La ponctuation regroupe les noms sans reproduire mécaniquement tous les καί grecs.
