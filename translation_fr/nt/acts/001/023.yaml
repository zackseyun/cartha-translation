  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: fr
  text: 'Ils en présentèrent deux[a] : Joseph, appelé Barsabbas, qui était aussi appelé Justus, et Matthias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en désignèrent deux » ou « en proposèrent deux ». Le verbe grec peut désigner le fait de placer des personnes devant un groupe ; ici, il s’agit probablement de les proposer comme candidats.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: présentèrent
  rationale: Dans ce contexte de sélection, le verbe signifie que les deux hommes sont placés devant le groupe comme candidats. « Présentèrent » rend ce sens procédural sans suggérer qu’ils ont déjà été nommés à la fonction.
- source_word: δύο
  choice: deux
  rationale: Le numéral désigne directement les deux hommes proposés.
- source_word: τὸν καλούμενον
  choice: appelé
  rationale: Le participe introduit un autre nom porté par Joseph ; « appelé » est naturel et fidèle.
- source_word: Βαρσαββᾶν
  choice: Barsabbas
  rationale: Translittération française usuelle du nom propre.
- source_word: ὃς ἐπεκλήθη
  choice: et surnommé
  rationale: La tournure introduit un nom supplémentaire. « Surnommé » distingue naturellement cette désignation de la précédente, sans préciser indûment son statut exact.
- source_word: Ἰοῦστος
  choice: Justus
  rationale: Forme traditionnelle et intelligible en français pour ce nom latin transmis par le grec.
- source_word: Μαθθίαν
  choice: Matthias
  rationale: Forme française traditionnelle du nom propre.
- source_word: καὶ ... καὶ
  choice: Ils ... et ... et
  rationale: Le premier καί assure la continuité narrative, rendue naturellement par l’enchaînement français ; le second coordonne Joseph et Matthias.
