id: ACT.1.10
reference: Acts 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: fr
  text: Et comme ils gardaient les yeux fixés vers le ciel pendant qu’il s’en allait[a], voici que deux hommes se tenaient près d’eux, vêtus de blanc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « ciel » peut désigner le ciel visible ou la demeure céleste.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans des vêtements blancs » ; le grec désigne les vêtements de manière générale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: gardaient les yeux fixés
  rationale: Cette expression française naturelle rend le regard soutenu et attentif exprimé par le participe, et la tournure imperfective conserve la durée de l’action.
- source_word: οὐρανόν
  choice: ciel
  rationale: En français, « ciel » peut désigner aussi bien l’espace visible au-dessus de la terre que la demeure céleste. Il préserve donc ici l’ambiguïté naturelle du grec dans le contexte de l’ascension.
- source_word: πορευομένου αὐτοῦ
  choice: pendant qu’il s’en allait
  rationale: Le génitif absolu exprime une action contemporaine. Cette formulation rend le mouvement en cours sans préciser davantage sa destination.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette locution attire solennellement l’attention sur l’événement qui suit, sans ajouter l’idée de soudaineté absente du terme grec.
- source_word: ἄνδρες δύο
  choice: deux hommes
  rationale: Le grec dit explicitement « deux hommes ». La traduction n’anticipe pas leur éventuelle identification comme anges.
- source_word: παρειστήκεισαν
  choice: se tenaient près d’eux
  rationale: Le plus-que-parfait grec signale idiomatiquement leur présence auprès des disciples. La formulation française décrit cette présence sans surinterpréter le verbe par « apparurent ».
- source_word: ἐσθήσεσι λευκαῖς
  choice: vêtus de blanc
  rationale: Cette expression française courante rend largement l’idée de vêtements blancs sans imposer une forme particulière, telle qu’une robe.
theological_decisions:
- issue: Sens de οὐρανός dans le récit de l’ascension
  choice: ciel
  alternative: les cieux
  rationale: Le singulier « ciel » est le terme français le plus naturel et conserve à la fois la dimension visible et la portée céleste du grec, sans transformer le verset en affirmation cosmologique plus précise.
- issue: Identité des deux hommes
  choice: deux hommes
  alternative: deux anges
  rationale: Le verset les appelle « hommes » et ne les identifie pas explicitement comme des anges. Leur identité éventuelle doit ressortir du contexte plutôt que d’être introduite dans la traduction.
translation_notes:
  register: Français international moderne, digne et narratif. « Gardaient les yeux fixés » restitue l’intensité du regard sans registre archaïque ; « voici que » conserve la force du marqueur narratif. Les formulations évitent d’expliciter une identité angélique ou une cosmologie que ce verset ne formule pas.
