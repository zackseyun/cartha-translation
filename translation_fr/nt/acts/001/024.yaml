id: ACT.1.24
reference: Acts 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: fr
  text: 'Après avoir prié, ils dirent : « Toi, Seigneur[a], qui connais le cœur de tous, montre[b] lequel de ces deux tu as choisi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’adresse « Seigneur » peut viser Dieu de manière générale ou, plus précisément, Jésus ; le grec ne précise pas ici le référent.
    reason: alternative_reading
  - marker: b
    text: Ou « désigne » ou « indique » ; le verbe peut exprimer le fait de faire connaître quelqu’un ou de le désigner publiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευξάμενοι
  choice: Après avoir prié
  rationale: Le participe aoriste indique naturellement une action antérieure au verbe principal ; cette tournure française en préserve clairement la succession.
- source_word: Σὺ κύριε
  choice: Toi, Seigneur
  rationale: Le pronom explicite Σὺ est emphatique. « Toi, Seigneur » conserve à la fois cette insistance et l’apostrophe directe.
- source_word: καρδιογνῶστα πάντων
  choice: qui connais le cœur de tous
  rationale: Cette formulation française naturelle conserve le sens du titre composé καρδιογνώστης et rend πάντων sans réduire la connaissance divine aux seules apparences.
- source_word: ἀνάδειξον
  choice: montre
  rationale: Dans cette demande visant à faire connaître le candidat déjà choisi, « montre » reste ouvert quant au moyen de désignation et n’impose pas l’idée d’une installation officielle.
- source_word: ὃν ἐξελέξω
  choice: lequel … tu as choisi
  rationale: Le passé composé exprime un choix déjà accompli dont l’effet demeure pertinent, tandis que « lequel » s’accorde naturellement avec les deux candidats mentionnés.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: lequel de ces deux
  rationale: Cette formulation idiomatique exprime exactement la sélection d’une personne parmi deux, sans ajouter « hommes », absent de ce verset.
theological_decisions:
- issue: Référent de « Seigneur » dans la prière
  choice: Conserver l’adresse « Seigneur » sans préciser son référent.
  alternative: Comprendre l’adresse comme visant Dieu de manière générale, ou plus précisément Jésus ressuscité.
  rationale: Le grec dit seulement Σὺ κύριε. La traduction maintient donc l’ambiguïté du texte au lieu de trancher une question interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « dirent » convient au registre narratif biblique sans être archaïque ; l’apostrophe « Toi, Seigneur » préserve l’emphase du grec.
