  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: fr
  text: Cet homme a donc acquis un champ avec le salaire de l’injustice[a] ; puis, tombé la tête la première[b], il s’est rompu par le milieu[c], et tous ses intestins se sont répandus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « avec la rémunération du mal ». Littéralement : « à partir du salaire de l’injustice ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « s’étant retrouvé face contre terre ». L’expression grecque décrit une position tête en avant ou face contre terre et évoque probablement une chute.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il se rompit au milieu ». Le grec indique qu’il se brisa ou éclata au milieu, sans préciser davantage la partie du corps qui s’est ouverte.'
    reason: translation_clarity
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: Cet homme a donc
  rationale: Οὗτος renvoie à Judas, tandis que μέν οὖν assure la continuité et marque ici une conséquence. « Cet homme a donc » restitue naturellement ces deux éléments.
- source_word: ἐκτήσατο
  choice: a acquis
  rationale: κτάομαι signifie acquérir ou entrer en possession. « A acquis » n’impose pas l’idée plus étroite d’un achat personnel direct.
- source_word: χωρίον
  choice: un champ
  rationale: χωρίον désigne couramment un champ ou une parcelle de terre ; « un champ » est clair et naturel dans ce contexte.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: avec le salaire de l’injustice
  rationale: μισθός désigne un salaire, une rémunération ou une récompense, et ἀδικία l’injustice ou le mal. « Avec » exprime idiomatiquement en français la provenance des fonds indiquée par ἐκ, tout en conservant la formulation moralement chargée.
- source_word: πρηνὴς γενόμενος
  choice: tombé la tête la première
  rationale: πρηνής indique une position face contre terre ou tête en avant. Dans cette séquence narrative, cette traduction naturelle exprime la chute tête la première sans masquer l’ambiguïté lexicale.
- source_word: ἐλάκησεν μέσος
  choice: il s’est éventré
  rationale: λακάω décrit le fait d’éclater ou de se fendre, et μέσος situe l’ouverture au milieu du corps. « S’est éventré » rend l’image avec concision en français moderne.
- source_word: ἐξεχύθη
  choice: se sont répandus
  rationale: Le passif de ἐκχέω décrit ce qui est versé ou répandu hors d’un contenant. Avec « intestins », « se sont répandus » est idiomatique et précis.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: tous ses intestins
  rationale: σπλάγχνα désigne ici les organes internes ou entrailles. « Intestins » est concret, actuel et immédiatement compréhensible.
theological_decisions:
- issue: Rapport de Judas à l’acquisition du champ
  choice: Traduire ἐκτήσατο par « a acquis » sans préciser que Judas l’a acheté lui-même.
  alternative: « a acheté » personnellement le champ, ou « le champ a été acquis en son nom avec son argent ».
  rationale: Le grec affirme une acquisition sans en détailler le mécanisme. Cette formulation préserve la tension avec Matthieu 27.5-8 au lieu de l’harmoniser dans la traduction.
- issue: Nature exacte de πρηνὴς γενόμενος
  choice: « tombé la tête la première » dans le texte, avec une note signalant le sens plus littéral possible.
  alternative: « se trouvant face contre terre » ou « devenu couché sur le ventre ».
  rationale: Le contexte favorise une chute tête en avant, mais la forme grecque peut aussi décrire l’état d’être face contre terre ; la note conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve la brutalité concrète du récit sans vocabulaire archaïque. « A acquis » maintient volontairement l’imprécision du mécanisme d’acquisition ; « s’est éventré » donne une formulation française concise, tandis que la note restitue de plus près l’expression grecque.
