  to: Cet homme a donc acquis un champ avec le salaire de l’injustice[a] ; puis, tombé la tête la première[b], il s’est rompu par le milieu[c], et tous ses intestins se sont répandus.
  rationale: La seule correction nécessaire remplace « s’est éventré » par « s’est rompu par le milieu ». Cette formulation française demeure directe et intelligible, tout en reproduisant mieux ἐλάκησεν μέσος et en évitant d’ajouter l’idée d’un geste volontaire ou d’une ouverture spécifiquement abdominale. Les autres choix préservent les ambiguïtés pertinentes du grec, notamment concernant l’acquisition du champ et πρηνὴς γενόμενος.
