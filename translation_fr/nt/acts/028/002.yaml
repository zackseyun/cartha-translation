source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: fr
  text: 'Les habitants de l’île[b] nous témoignèrent une bonté exceptionnelle[a] : ils allumèrent un feu et nous accueillirent tous, car la pluie s’était installée et il faisait froid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une bonté qui n’était pas ordinaire ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « habitants de l’île » désignait les personnes qui ne parlaient pas grec ; ici, il n’implique pas qu’elles étaient sauvages.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: les habitants de l’île
  rationale: Dans ce contexte, le terme désigne les habitants non hellénophones de Malte, sans impliquer qu’ils étaient sauvages. « Les habitants de l’île » rend ce sens de façon naturelle et sans connotation péjorative en français moderne.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: une bonté exceptionnelle
  rationale: La tournure idiomatique signifie littéralement une bonté « non ordinaire ». « Une bonté exceptionnelle » en exprime clairement la valeur intensive tout en conservant l’idée de bienveillance humaine.
- source_word: παρεῖχον
  choice: témoignèrent
  rationale: Avec « bonté », le verbe παρέχω se rend naturellement par « témoigner », au sens de manifester ou d’accorder de la bienveillance.
- source_word: ἅψαντες πυράν
  choice: ils allumèrent un feu
  rationale: Le participe a ici une valeur circonstancielle explicative. « Allumèrent un feu » rend directement l’action sans préciser indûment qu’il s’agissait d’un grand feu.
- source_word: προσελάβοντο πάντας ἡμᾶς
  choice: nous accueillirent tous auprès de lui
  rationale: Le verbe exprime un accueil hospitalier. « Tous » conserve l’insistance de πάντας, et « auprès de lui » explicite naturellement que l’accueil se fait autour du feu, sans suggérer nécessairement un hébergement.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: car la pluie s’était installée
  rationale: Le participe parfait indique que la pluie était survenue et persistait alors. Cette formulation française exprime son installation durable dans la scène.
- source_word: διὰ τὸ ψῦχος
  choice: et il faisait froid
  rationale: Plutôt que de répéter « à cause de », cette formulation idiomatique conserve la seconde cause de leur accueil tout en restant naturelle.
