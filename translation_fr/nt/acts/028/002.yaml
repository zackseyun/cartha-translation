  register: Français international moderne, narratif et digne. La formulation évite « barbares », aujourd’hui fortement péjoratif, ainsi que « indigènes », qui peut paraître daté ou colonial. Les marqueurs de notes sont placés là où ils éclairent directement les expressions concernées.
