id: ACT.28.27
reference: Acts 28:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: fr
  text: Car le cœur de ce peuple s’est endurci[a] ; ils ont entendu avec peine de leurs oreilles et ils ont fermé les yeux, de peur qu’ils ne voient de leurs yeux, qu’ils n’entendent de leurs oreilles, qu’ils ne comprennent avec leur cœur, qu’ils ne reviennent[b], et que je ne les guérisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’est épaissi ». L’expression décrit un cœur devenu insensible ou endurci.'
    reason: clarification_metaphor
  - marker: b
    text: 'On peut aussi comprendre la proposition ainsi : « autrement, ils pourraient voir de leurs yeux, entendre de leurs oreilles, comprendre avec leur cœur, revenir, et je les guérirais ». Le grec peut porter ici une nuance plus forte : « de peur que » ou « afin qu’ils ne ». « Reviennent » peut aussi se traduire par « se tournent », « retournent » ou, dans ce contexte, « se repentent ».'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: s’est épaissi
  rationale: Conserve la métaphore grecque d’un cœur devenu épais, donc insensible, tout en restant compréhensible en français biblique moderne.
- source_word: καρδία
  choice: cœur
  rationale: Préserve le terme anthropologique biblique et son rappel dans « comprendre avec leur cœur ».
- source_word: βαρέως ἤκουσαν
  choice: ils ont entendu difficilement
  rationale: Exprime l’idée d’une audition lourde ou difficile sans reproduire le calque peu naturel « entendre lourdement ».
- source_word: ἐκάμμυσαν
  choice: ils ont fermé
  rationale: Rend directement l’action volontaire de fermer les yeux.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Préserve la nuance forte de crainte, de prévention ou de finalité négative portée par μήποτε dans cette citation d’Ésaïe, sans trancher davantage sa portée théologique.
- source_word: ἐπιστρέψωσιν
  choice: qu’ils ne reviennent
  rationale: Conserve l’image directionnelle du retour et sa portée possible de conversion sans la réduire explicitement au seul repentir.
- source_word: ἰάσομαι
  choice: que je ne les guérisse
  rationale: Dans la série régie par « de peur que », cette formulation française garde le futur grec dans la logique de l’éventualité redoutée ou empêchée.
theological_decisions:
- issue: Intention divine dans la citation d’Ésaïe
  choice: Employer « de peur que… ne » afin de conserver la nuance forte de μήποτε et la tension du jugement.
  alternative: « autrement, ils pourraient… et je les guérirais »
  rationale: Le grec peut être formulé comme une conséquence évitée ou comme une finalité négative. Le texte principal conserve ici la formulation plus proche de la structure grecque, tandis que la note signale l’autre lecture sans résoudre la tension entre jugement divin et responsabilité humaine.
- issue: Sens de ἐπιστρέψωσιν
  choice: reviennent
  alternative: se tournent / retournent / se repentent
  rationale: « Reviennent » exprime le mouvement de retour vers Dieu sans imposer une terminologie doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde le parallélisme solennel de la citation tout en évitant les calques les moins naturels. La métaphore du cœur épaissi et l’ambiguïté théologique de μήποτε sont expressément préservées.
