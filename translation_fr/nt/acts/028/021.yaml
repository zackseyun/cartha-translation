id: ACT.28.21
reference: Acts 28:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: fr
  text: 'Mais ils lui dirent : « Pour notre part, nous n’avons reçu de Judée aucune lettre à ton sujet, et aucun des frères[a] qui sont venus n’a rapporté ni dit quoi que ce soit de mauvais sur toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » peut désigner des compatriotes juifs venus de Judée; le texte ne précise pas qu’il s’agit de croyants chrétiens.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: Mais ils lui dirent
  rationale: « Mais » rend la légère valeur de reprise ou de contraste de δέ, tandis que « lui dirent » exprime naturellement πρὸς αὐτὸν avec le verbe de parole.
- source_word: Ἡμεῖς
  choice: Pour notre part, nous
  rationale: Le pronom grec est explicite et emphatique. « Pour notre part » en restitue discrètement l’insistance dans un français naturel.
- source_word: οὔτε ... οὔτε
  choice: aucune ... et aucun ... n’a
  rationale: La double négation corrélative est conservée sans imposer une tournure française lourde en « ni… ni… ».
- source_word: γράμματα
  choice: lettre
  rationale: Dans ce contexte, γράμματα désigne des lettres ou communications écrites. Le singulier après « aucune » est idiomatique en français tout en gardant le sens collectif du pluriel grec.
- source_word: περὶ σοῦ
  choice: à ton sujet / sur toi
  rationale: Ces deux expressions françaises rendent naturellement περί avec le génitif; la variation évite une répétition pesante sans modifier le référent.
- source_word: ἐδεξάμεθα
  choice: nous n’avons reçu
  rationale: Le passé composé convient à une réception passée dont le résultat reste pertinent au moment où les interlocuteurs parlent.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: de Judée
  rationale: Rendu géographique direct, sans ajouter la notion de province absente de la formulation.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: aucun des frères qui sont venus
  rationale: Cette formulation exprime naturellement en français l’idée de « personne parmi les frères arrivés », sans ajouter « ici », qui n’est qu’implicite.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: n’a rapporté ni dit quoi que ce soit
  rationale: « Rapporté » et « dit » maintiennent la légère distinction entre l’action de transmettre une information et celle de parler, tandis que « quoi que ce soit » rend τι sous la portée de la négation.
- source_word: πονηρόν
  choice: de mauvais
  rationale: Dans ce contexte de propos tenus au sujet de Paul, « de mauvais » exprime une information défavorable ou préjudiciable sans surcharger le terme d’une nuance morale plus précise que le grec.
theological_decisions:
- issue: Référent de τῶν ἀδελφῶν
  choice: les frères
  alternative: les compatriotes juifs / les frères chrétiens
  rationale: Le contexte peut désigner des Juifs venus de Judée, mais le texte ne précise pas s’il s’agit de compatriotes juifs au sens large ou de croyants chrétiens. La traduction conserve donc l’expression ouverte du grec, avec une note explicative.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier (« ton », « toi ») reflète l’adresse à Paul seul. La phrase conserve la double affirmation négative et l’ambiguïté de « frères ».
