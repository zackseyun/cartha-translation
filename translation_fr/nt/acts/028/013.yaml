  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: fr
  text: De là, après avoir levé l’ancre[a], nous sommes arrivés à Rhégium. Après un jour, un vent du sud s’étant levé, nous sommes arrivés le deuxième jour à Puteoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir pris la mer ». Le participe grec περιελόντες appartient ici au vocabulaire maritime et peut désigner précisément le fait de lever l’ancre ou, plus généralement, celui d’appareiller.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: De là
  rationale: Transition spatiale naturelle en français, qui conserve la valeur référentielle du grec.
- source_word: περιελόντες
  choice: après avoir levé l’ancre
  rationale: Dans ce contexte maritime, le participe désigne vraisemblablement l’action de dégager le navire pour repartir, plus précisément de lever l’ancre; le sens plus général est signalé en note.
- source_word: κατηντήσαμεν
  choice: nous sommes arrivés
  rationale: Le verbe exprime l’arrivée à une destination; cette formulation est naturelle et précise en français.
- source_word: Ῥήγιον
  choice: Rhégium
  rationale: Transcription française traditionnelle du nom antique.
- source_word: μετὰ μίαν ἡμέραν
  choice: Un jour plus tard
  rationale: Rend clairement et naturellement la relation temporelle exprimée par le grec.
- source_word: ἐπιγενομένου νότου
  choice: un vent du sud s’est levé
  rationale: Rend la construction absolue et le caractère soudain des conditions favorables de navigation, sans explicitation supplémentaire.
- source_word: δευτεραῖοι
  choice: le deuxième jour
  rationale: Conserve l’expression temporelle du grec plutôt que de l’aplanir en « le lendemain ».
- source_word: ἤλθομεν
  choice: nous sommes arrivés
  rationale: Avec une destination, « arriver à » exprime naturellement le mouvement et son aboutissement.
- source_word: Ποτιόλους
  choice: Puteoli
  rationale: Transcription usuelle du nom antique, maintenue plutôt que remplacée par le nom moderne Pouzzoles.
