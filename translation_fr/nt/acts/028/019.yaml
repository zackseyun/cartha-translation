id: ACT.28.19
reference: Acts 28:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: fr
  text: Mais, parce que les Juifs s’y opposaient[a][b], j’ai été contraint d’en appeler à César, non pas parce que j’avais une accusation à porter contre ma nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tandis que les Juifs s’opposaient à moi » ou « parce que les Juifs me contredisaient ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « les Juifs » désigne les adversaires juifs de Paul dans le cadre de cette affaire judiciaire, et non l’ensemble du peuple juif.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: comme ... s’y opposaient
  rationale: Le génitif absolu présente la circonstance qui a conduit Paul à agir. « S’y opposaient » exprime naturellement en français l’opposition dans ce contexte judiciaire, tout en laissant ouverte la nuance circonstancielle ou causale.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un contraste modéré avec l’affirmation précédente.
- source_word: τῶν Ἰουδαίων
  choice: les Juifs
  rationale: Rend directement le grec sans ajouter la précision « chefs » absente du texte. Le contexte limite la référence aux opposants juifs de Paul dans cette affaire.
- source_word: ἠναγκάσθην
  choice: j’ai été contraint
  rationale: Conserve la voix passive et l’idée d’une contrainte imposée, dans un registre adapté au cadre judiciaire.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: d’en appeler à César
  rationale: Expression juridique française consacrée pour le recours à l’autorité impériale; « César » maintient le titre employé dans le grec.
- source_word: οὐχ ὡς
  choice: sans pour autant
  rationale: 'Introduit naturellement la rectification de Paul: son appel à César ne signifie pas qu’il veuille accuser sa propre nation.'
- source_word: τοῦ ἔθνους μου
  choice: ma nation
  rationale: Préserve le sens collectif, national et ethnique de ἔθνος ainsi que le registre public de la déclaration.
- source_word: ἔχων τι κατηγορεῖν
  choice: avoir quoi que ce soit à reprocher
  rationale: Formulation française idiomatique qui conserve l’idée d’un grief ou d’une accusation, sans produire la tournure maladroite « accuser ma nation de quelque chose ».
theological_decisions:
- issue: Portée de l’expression « les Juifs » dans un passage ethnique et religieux sensible
  choice: Maintenir « les Juifs » dans le texte principal, conformément à τῶν Ἰουδαίων, avec une note contextuelle.
  alternative: les chefs juifs; les Judéens
  rationale: Le grec ne précise ni « chefs » ni « Judéens ». Dans le contexte, l’expression vise les opposants juifs impliqués dans l’affaire de Paul, et non l’ensemble du peuple juif; la note permet de le signaler sans modifier le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le cadre judiciaire et la relation de contraste, tout en évitant un calque lourd. Les marqueurs [a] et [b] suivent immédiatement l’expression qu’ils éclairent.
