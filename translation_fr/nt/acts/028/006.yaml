id: ACT.28.6
reference: Acts 28:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: fr
  text: Ils s’attendaient à le voir enfler ou tomber raide mort tout à coup. Mais, après avoir attendu longtemps et constaté qu’il ne lui arrivait rien d’anormal[a], ils changèrent d’avis et se mirent à dire que c’était un dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rien d’inhabituel » ou « rien de fâcheux ».'
    reason: Alternative lexicale pour μηδὲν ἄτοπον, qui peut désigner ce qui est anormal, inhabituel ou malencontreux.
lexical_decisions:
- source_word: προσεδόκων
  choice: Ils s’attendaient
  rationale: L’imparfait exprime une attente continue; cette tournure est naturelle en français moderne.
- source_word: πίμπρασθαι
  choice: à le voir enfler
  rationale: Dans le contexte d’une morsure de serpent, le verbe désigne vraisemblablement un gonflement corporel plutôt qu’une combustion littérale.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: tomber raide mort tout à coup
  rationale: La formulation rend l’effondrement soudain et son issue mortelle, dans un français idiomatique.
- source_word: ἐπὶ πολὺ
  choice: après avoir attendu longtemps
  rationale: L’expression marque une durée prolongée et s’intègre naturellement à la construction participiale.
- source_word: θεωρούντων
  choice: constaté
  rationale: Le verbe implique ici une observation attentive aboutissant à un constat.
- source_word: μηδὲν ἄτοπον
  choice: rien d’anormal
  rationale: Cette expression conserve le sens large de quelque chose d’étrange ou qui ne convient pas, sans préciser indûment qu’il s’agit seulement d’un dommage.
- source_word: μεταβαλόμενοι
  choice: ils changèrent d’avis
  rationale: Le participe moyen décrit clairement un renversement de jugement.
- source_word: ἔλεγον
  choice: se mirent à dire
  rationale: Cette tournure restitue la valeur inchoative possible de l’imparfait grec.
- source_word: θεόν
  choice: un dieu
  rationale: Dans le cadre polythéiste des habitants de l’île, le nom sans article désigne naturellement une divinité parmi d’autres.
theological_decisions:
- issue: Sens de αὐτὸν εἶναι θεόν dans le cadre du jugement des habitants
  choice: que c’était un dieu
  alternative: qu’il était Dieu; qu’il était divin
  rationale: Le récit rapporte la conclusion erronée d’habitants païens. « Un dieu » respecte leur cadre polythéiste et n’attribue pas à Paul l’identité du Dieu unique.
translation_notes:
  register: Français international moderne, clair et digne. « Tomber raide mort » est idiomatique sans être familier; « c’était un dieu » évite la lourdeur de « qu’il était un dieu » après « dire » tout en conservant exactement le jugement rapporté.
