source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: fr
  text: Ils nous ont aussi témoigné de nombreuses marques d’honneur[a] et, au moment où nous prenions la mer[b], ils ont mis à bord tout ce dont nous avions besoin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils nous ont honorés de nombreux honneurs ». Le grec répète les mots de la même famille pour souligner les marques d’estime reçues.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous allions prendre le large ». Le verbe grec est un terme nautique désignant le début d’un voyage en mer.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils nous ont fourni tout ce dont nous avions besoin ». Le grec dit plus littéralement qu’ils ont placé les choses nécessaires, le contexte indiquant qu’elles ont été mises sur le navire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: témoigné de nombreuses marques d’honneur
  rationale: Cette formulation française naturelle conserve à la fois l’idée de manifestations concrètes d’estime et le champ lexical de l’honneur, sans reproduire maladroitement la répétition étymologique du grec.
- source_word: ἀναγομένοις
  choice: au moment où nous prenions la mer
  rationale: Dans ce contexte nautique, ἀνάγω désigne le fait de partir en bateau ou de prendre la mer. La tournure exprime aussi la circonstance temporelle du participe.
- source_word: ἐπέθεντο
  choice: ils ont mis à bord
  rationale: Le verbe indique ici que les habitants ont placé les provisions sur le navire. « À bord » explicite le complément implicite imposé par le contexte maritime.
- source_word: τὰ πρὸς τὰς χρείας
  choice: tout ce dont nous avions besoin
  rationale: Cette expression rend naturellement en français les choses destinées à répondre aux besoins des voyageurs, sans la redondance peu idiomatique d’une traduction mot à mot.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression grecque tout en évitant les répétitions peu naturelles. Les précisions « à bord » et « tout ce dont nous avions besoin » rendent explicites des éléments nettement impliqués par le contexte.
