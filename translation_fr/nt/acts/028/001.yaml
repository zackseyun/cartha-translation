id: ACT.28.1
reference: Acts 28:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: fr
  text: Après avoir été sauvés[a], nous avons alors appris que l’île s’appelait Malte[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir échappé sains et saufs au danger » ou « après avoir été tirés d’affaire ». Le verbe grec souligne une délivrance effective au milieu du danger.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : Melitē, île traditionnellement identifiée à Malte.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « l’île s’appelle Malte ». Le grec emploie le présent passif dans l’information rapportée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: après avoir été sauvés
  rationale: Le participe aoriste passif exprime une délivrance effective à travers le danger. Cette formulation conserve la voix passive et le lien temporel avec l’action principale, sans réduire le sens à la seule arrivée sur le rivage.
- source_word: τότε
  choice: alors
  rationale: Cet adverbe marque simplement la succession des événements et s’intègre naturellement au récit français.
- source_word: ἐπέγνωμεν
  choice: nous avons appris
  rationale: Dans ce contexte, le verbe désigne le fait de parvenir à connaître une information, ici le nom de l’île.
- source_word: Μελίτη
  choice: Malte
  rationale: « Malte » est la forme française usuelle du nom grec Μελίτη et correspond à l’identification traditionnelle de l’île.
- source_word: ἡ νῆσος
  choice: l’île
  rationale: Équivalent français direct, clair et courant.
- source_word: καλεῖται
  choice: s’appelait
  rationale: L’imparfait convient au discours indirect dans un récit au passé, tout en rendant naturellement l’idée grecque « est appelée ».
theological_decisions:
- issue: Portée de διασωθέντες
  choice: sauvés
  alternative: tirés d’affaire / arrivés sains et saufs
  rationale: « Sauvés » garde l’ampleur du verbe grec, qui peut désigner une délivrance complète au milieu du danger. La note précise ici son sens concret afin de ne pas imposer une lecture exclusivement spirituelle.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la succession temporelle, la voix passive de la délivrance et l’ambiguïté lexicale de « sauvés », explicitée en note. La conjonction initiale Καί n’est pas rendue séparément, car l’enchaînement est déjà naturel et clair en français.
