id: ACT.28.22
reference: Acts 28:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: fr
  text: Mais nous jugeons bon d’entendre de toi ce que tu penses. En effet, au sujet de ce mouvement[a], nous savons que partout on parle contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parti », « courant » ou « secte » ; ici, le grec αἵρεσις ne signifie pas nécessairement « hérésie » au sens technique que ce mot a pris plus tard.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: nous jugeons bon
  rationale: Le verbe exprime ici un jugement de convenance formulé avec politesse. « Nous jugeons bon » garde ce ton sans suggérer ni exigence ni simple désir.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: d’entendre de toi
  rationale: La préposition παρά avec le génitif souligne que les interlocuteurs souhaitent entendre directement le point de vue de Paul.
- source_word: ἃ φρονεῖς
  choice: ce que tu penses
  rationale: Cette formulation naturelle rend le point de vue ou l’opinion de Paul sans préciser davantage que le grec.
- source_word: αἱρέσεως
  choice: mouvement
  rationale: Dans ce contexte, αἵρεσις désigne un groupe ou courant religieux. « Mouvement » évite le sens moderne fortement péjoratif de « secte » ainsi que le sens ecclésiastique ultérieur d’« hérésie ».
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: nous savons
  rationale: Le français idiomatique préfère ici la tournure personnelle, qui conserve pleinement le sens de la construction grecque.
- source_word: πανταχοῦ
  choice: partout
  rationale: Équivalent direct et naturel de l’adverbe locatif.
- source_word: ἀντιλέγεται
  choice: on parle contre lui
  rationale: La tournure impersonnelle restitue le passif grec et conserve la dimension verbale de l’opposition exprimée par ἀντιλέγω.
theological_decisions:
- issue: Sens de αἵρεσις
  choice: mouvement
  alternative: secte, parti ou courant
  rationale: Le mot désigne ici le mouvement chrétien vu de l’extérieur, non une déviation doctrinale au sens technique plus tardif. « Mouvement » préserve cette référence historique sans importer les connotations modernes de « secte » ou d’« hérésie ».
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement suit l’adresse au singulier du grec. La ponctuation en deux phrases allège la longue période grecque sans modifier son rapport logique.
