id: ACT.28.28
reference: Acts 28:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: fr
  text: Sachez donc que ce salut de Dieu[a] a été envoyé aux non-Juifs ; eux aussi écouteront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce salut venant de Dieu ». Le génitif grec peut exprimer plusieurs rapports étroitement liés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « eux aussi entendront ». Selon le contexte, le verbe grec peut signifier « entendre » ou « écouter » avec attention et réceptivité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Sachez donc que
  rationale: Cette formulation française naturelle conserve la valeur impérative, la conclusion marquée par οὖν et le ton de déclaration publique de l’expression grecque.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans ce contexte de contraste entre Juifs et ἔθνη, le terme désigne les personnes qui ne sont pas juives. « Non-Juifs » est plus clair en français actuel que « païens » ou « Gentils », et plus précis ici que « nations ».
- source_word: ἀπεστάλη
  choice: a été envoyé
  rationale: Le passé composé rend naturellement l’aoriste passif comme un envoi accompli dont la portée demeure actuelle.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: ce salut de Dieu
  rationale: σωτήριον est pris substantivement au sens de « salut ». La formulation « de Dieu » maintient l’ambiguïté du génitif entre l’origine divine du salut et son appartenance ou son caractère divin.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: eux aussi écouteront
  rationale: « Eux aussi » restitue l’insistance de αὐτοὶ καί. Dans le contexte, « écouteront » exprime probablement une audition réceptive, sans aller jusqu’à affirmer explicitement leur conversion.
theological_decisions:
- issue: Sens de σωτήριον dans le contexte
  choice: salut
  alternative: message de salut
  rationale: Le mot grec désigne directement le salut. Le contexte implique sa proclamation, mais « message de salut » ajouterait une précision interprétative que le texte n’impose pas.
- issue: Rapport exprimé par τοῦ θεοῦ
  choice: de Dieu
  alternative: venant de Dieu
  rationale: « De Dieu » préserve en français l’ouverture du génitif grec, tandis que « venant de Dieu » ne retiendrait que l’idée de source.
- issue: Portée de ἀκούσονται
  choice: écouteront
  alternative: entendront
  rationale: Le contexte favorise l’idée d’une écoute réceptive en contraste avec le refus évoqué auparavant. La traduction n’ajoute toutefois aucune affirmation explicite de conversion.
translation_notes:
  register: Français international actuel, clair et digne. « Non-Juifs » évite le sens moderne souvent péjoratif de « païens » et le caractère technique ou ambigu de « Gentils ». Le point-virgule conserve la progression ferme de la déclaration.
