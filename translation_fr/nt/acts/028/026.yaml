source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: fr
  text: 'en disant : « Va vers ce peuple et dis : Vous entendrez bel et bien, mais vous ne comprendrez jamais ; vous regarderez bel et bien, mais vous ne discernerez jamais.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par l’ouïe vous entendrez […] et, regardant, vous regarderez, mais vous ne verrez certainement pas ». Ces répétitions, qui viennent de la citation d’Ésaïe, renforcent les verbes ; le dernier verbe peut désigner ici la perception intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit la citation et garde son lien syntaxique avec la proposition précédente.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: Va vers ce peuple
  rationale: Cette formulation naturelle conserve l’impératif de mouvement, la préposition πρὸς et la valeur collective et prophétique de λαός.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Vous entendrez bel et bien
  rationale: La tournure rend l’intensification produite par le nom et le verbe apparentés sans calquer lourdement l’expression sémitique.
- source_word: οὐ μὴ συνῆτε
  choice: vous ne comprendrez jamais
  rationale: « Jamais » communique en français moderne la négation grecque fortement emphatique οὐ μή.
- source_word: βλέποντες βλέψετε
  choice: vous regarderez bel et bien
  rationale: « Regarder » exprime l’activité visuelle extérieure et « bel et bien » restitue l’emphase de la répétition grecque, en parallèle avec la clause précédente.
- source_word: οὐ μὴ ἴδητε
  choice: vous ne discernerez jamais
  rationale: Dans ce contexte prophétique, ἴδητε dépasse la simple vision physique et évoque la perception intérieure ; « discerner » maintient ce contraste sans l’expliciter doctrinalement.
theological_decisions:
- issue: Contraste entre perception sensorielle et compréhension intérieure dans la citation d’Ésaïe
  choice: Distinguer « regarder » de « discerner »
  alternative: Répéter « voir » dans les deux membres
  rationale: Le grec emploie deux verbes de vision apparentés par le sens, βλέπω et ὁράω, et le contexte oppose l’exposition visuelle à la perception intérieure. La traduction garde cette tension, tandis que la note signale une version lexicalement plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique et le parallélisme sont conservés, avec une emphase idiomatique (« bel et bien ») et une négation forte (« jamais »).
