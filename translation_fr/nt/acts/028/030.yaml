  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: fr
  text: Il resta deux années entières dans le logement qu’il avait loué[a], et il accueillait tous ceux qui entraient chez lui[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son propre logement loué ». Le grec désigne un logement pris en location.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous ceux qui venaient chez lui ». Le grec dit plus littéralement « ceux qui entraient auprès de lui », évoquant des visiteurs qui entraient dans son logement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: Il resta
  rationale: L’aoriste de ἐμμένω résume ici la durée du séjour. « Il resta » exprime naturellement le fait de demeurer dans un lieu sans surinterpréter le verbe comme une simple habitation.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: δέ est ici une articulation narrative légère. En français, le simple enchaînement avec la phrase précédente peut en rendre la fonction plus naturellement qu’un « et » initial.
- source_word: διετίαν ὅλην
  choice: deux années entières
  rationale: Cette formulation conserve à la fois la durée de deux ans et l’insistance portée par ὅλην sur la totalité de cette période.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: dans le logement qu’il louait
  rationale: μίσθωμα désigne un logement loué. Cette tournure française est claire et actuelle; elle rend aussi ἰδίῳ en indiquant qu’il s’agissait du logement loué par Paul lui-même.
- source_word: ἀπεδέχετο
  choice: il accueillait
  rationale: L’imparfait grec évoque une pratique répétée ou continue. « Accueillait » restitue la nuance d’accueil de ἀποδέχομαι mieux que le plus neutre « recevait ».
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: tous ceux qui venaient chez lui
  rationale: εἰσπορεύομαι comporte l’idée d’entrer. Dans le contexte de son logement, « venaient chez lui » préserve naturellement cette dimension spatiale en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le caractère récapitulatif du récit, l’accent sur les deux années complètes et l’aspect habituel de l’accueil. La virgule finale est conservée puisque le verset se poursuit grammaticalement au verset 31.
