id: ACT.28.7
reference: Acts 28:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: fr
  text: Dans les environs de ce lieu se trouvaient des domaines[a] appartenant au principal personnage de l’île[b], nommé Publius, qui nous accueillit et nous hébergea avec bienveillance pendant trois jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des terres » ou « des propriétés » : le terme grec désigne ici des biens fonciers situés dans les environs.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut désigner l’homme le plus important ou le plus haut placé de l’île, et peut-être avoir valeur de titre officiel.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Aux environs de cet endroit
  rationale: Rend naturellement la localisation autour du lieu mentionné. Le léger enchaînement narratif porté par δέ n’exige pas nécessairement un connecteur distinct en français.
- source_word: ὑπῆρχεν χωρία
  choice: se trouvaient des domaines
  rationale: La tournure existentielle convient au pluriel χωρία. « Domaines » évoque des propriétés foncières sans les réduire à de simples champs.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: au premier personnage de l’île
  rationale: Cette formulation conserve l’idée de prééminence et la possibilité d’un titre local sans préciser indûment une fonction administrative déterminée.
- source_word: ὀνόματι Ποπλίῳ
  choice: nommé Publius
  rationale: Formulation française naturelle pour introduire le nom; « Publius » est la forme française traditionnelle du nom latin.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: qui nous accueillit
  rationale: Le verbe exprime ici l’accueil de voyageurs ou d’hôtes.
- source_word: τρεῖς ἡμέρας
  choice: pendant trois jours
  rationale: Rend l’accusatif exprimant la durée.
- source_word: φιλοφρόνως
  choice: avec bienveillance
  rationale: Exprime une manière aimable, prévenante et généreuse, dans un registre actuel et digne.
- source_word: ἐξένισεν
  choice: nous hébergea
  rationale: Dans ce contexte, le verbe désigne l’hospitalité offerte à des hôtes, y compris leur logement.
theological_decisions:
- issue: Statut de Publius désigné par πρῶτος τῆς νήσου
  choice: premier personnage de l’île
  alternative: principal notable de l’île; premier magistrat de l’île
  rationale: Le grec indique sa prééminence et peut correspondre à un titre, mais le verset seul ne permet pas de définir avec certitude une charge administrative précise.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la structure narrative du grec tout en évitant un calque lourd. « Premier personnage » maintient l’ambiguïté entre prééminence sociale et titre officiel.
