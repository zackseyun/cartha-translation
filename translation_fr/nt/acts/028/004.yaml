id: ACT.28.4
reference: Acts 28:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: fr
  text: 'Quand les habitants de l’île virent l’animal suspendu à sa main[a], ils se dirent les uns aux autres : « Cet homme est certainement un meurtrier. Bien qu’il ait échappé à la mer, la Justice ne l’a pas laissé vivre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens du pays » ; plus littéralement, « les barbares », terme qui désignait ici les habitants locaux ne parlant pas grec, sans le sens péjoratif moderne.
    reason: lexical_alternative
  - marker: b
    text: « La Justice » traduit le grec dikē, probablement personnifié ici comme la puissance qui punit le mal, voire comme une figure divine dans la conception religieuse des habitants.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: les habitants de l’île
  rationale: Dans ce contexte, le terme grec désigne les habitants locaux non hellénophones, sans porter le jugement moral que suggérerait aujourd’hui « barbares ». Le contexte insulaire permet une formulation française naturelle et précise.
- source_word: κρεμάμενον
  choice: suspendu
  rationale: Le participe décrit l’animal pendant de la main de Paul ou y restant attaché. « Suspendu » conserve l’image sans préciser indûment sa posture exacte.
- source_word: τὸ θηρίον
  choice: l’animal
  rationale: Le nom est générique. Même si le contexte précédent parle d’une vipère, « l’animal » respecte ici le choix lexical du grec sans répétition interprétative.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: ils se dirent les uns aux autres
  rationale: Cette formulation rend explicitement la réciprocité. Le passé simple convient à la narration, sans exclure la nuance durative possible de l’imparfait grec.
- source_word: Πάντως
  choice: certainement
  rationale: L’adverbe exprime la forte certitude avec laquelle les habitants tirent leur conclusion de ce qu’ils voient.
- source_word: φονεύς
  choice: un meurtrier
  rationale: Le terme désigne normalement une personne coupable de meurtre; « meurtrier » en est l’équivalent français direct.
- source_word: διασωθέντα
  choice: ait échappé
  rationale: Dans ce contexte maritime, « échapper à la mer » exprime naturellement le fait d’être sorti vivant du danger. Le subjonctif après « bien que » rend la valeur concessive de la construction participiale.
- source_word: ἡ δίκη
  choice: la Justice
  rationale: La majuscule signale la personnification d’une justice rétributive dans la pensée des habitants, sans affirmer explicitement qu’il s’agit du nom propre d’une déesse.
- source_word: ζῆν οὐκ εἴασεν
  choice: ne l’a pas laissé vivre
  rationale: Cette traduction suit directement l’idée grecque de ne pas permettre à quelqu’un de continuer à vivre.
- source_word: ἐκ τῆς θαλάσσης
  choice: à la mer
  rationale: Avec « échapper », le français idiomatique emploie « échapper à la mer », qui exprime ici la survie au péril maritime plutôt qu’un simple mouvement spatial.
theological_decisions:
- issue: Personnification de δίκη
  choice: « la Justice » avec une majuscule
  alternative: « la justice », « la vengeance » ou « la déesse Justice »
  rationale: La formulation conserve la personnification probablement présente dans la conception religieuse des habitants, tout en évitant de présenter leur interprétation comme une approbation du narrateur ou d’identifier trop précisément une divinité.
translation_notes:
  register: Français international moderne, naturel et digne. La citation conserve le raisonnement spontané des habitants et la personnification ambiguë de la Justice, sans cautionner leur conclusion.
