  source_fidelity: 'La séquence judiciaire est bien rendue : le participe aoriste indique l’examen préalable, ἐβούλοντο l’intention passée de relâcher, et la proposition causale exprime l’absence de motif justifiant la mort. Toutefois, « ceux-ci » ne rend pas adéquatement le relatif οἵτινες dans cette continuité syntaxique, et « en moi » est trop littéral et peu idiomatique dans le français judiciaire.'
  naturalness: « Ceux-ci voulaient » est moins naturel qu’une relative introduite par « qui » et affaiblit le lien avec les autorités romaines du contexte. « Aucun motif de condamnation à mort contre moi » est une formulation actuelle, claire et judiciaire.
  terminology: « Interrogé », « relâcher » et « condamnation à mort » conviennent au cadre judiciaire. « Contre moi » explicite naturellement la portée forensique de ἐν ἐμοί sans imposer une interprétation doctrinale.
  issues:
