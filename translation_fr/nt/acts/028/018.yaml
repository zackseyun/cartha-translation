  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: fr
  text: qui, après m’avoir interrogé, voulaient me relâcher, parce qu’ils ne trouvaient contre moi aucun motif de condamnation à mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce qu’ils ne trouvaient dans mon cas aucun motif justifiant la peine de mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ceux-ci
  rationale: Le relatif renvoie aux Romains mentionnés dans le verset précédent. « Ceux-ci » assure un enchaînement français naturel sans surcharger la nuance qualitative de ὅστις.
- source_word: ἀνακρίναντές
  choice: après m’avoir interrogé
  rationale: Le participe aoriste marque une action antérieure au désir de relâcher Paul; dans ce cadre judiciaire, « interroger » convient mieux que le plus général « examiner ».
- source_word: ἐβούλοντο
  choice: voulaient
  rationale: L’imparfait restitue naturellement l’imparfait grec et exprime leur intention passée sans préciser davantage si elle fut arrêtée ou simplement souhaitée.
- source_word: ἀπολῦσαι
  choice: me relâcher
  rationale: Dans le contexte d’une détention judiciaire, « relâcher » désigne clairement la remise en liberté.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: parce que
  rationale: Cette tournure causale française rend directement la construction grecque διά suivie de l’infinitif substantivé.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: aucun motif de condamnation à mort
  rationale: αἰτία possède ici une valeur judiciaire de motif ou de fondement, tandis que θανάτου indique que la peine encourue serait la mort. La formulation conserve cette portée légale sans affirmer qu’une sentence avait déjà été prononcée.
- source_word: ἐν ἐμοί
  choice: en moi
  rationale: La formulation littérale est intelligible en français et préserve l’expression grecque, qui peut viser ce que l’examen de Paul ou de son cas avait révélé.
