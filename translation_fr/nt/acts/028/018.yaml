    issue: « Ceux-ci » remplace le relatif grec οἵτινες.
    rationale: Le grec poursuit par une relative se rapportant aux autorités précédemment mentionnées. En français, « qui » maintient cette dépendance et la fluidité du discours; « ceux-ci » introduit une démonstration autonome inutile.
  - severity: medium
    issue: « en moi » est un calque peu naturel dans ce contexte.
    rationale: Dans un cadre judiciaire, ἐν ἐμοί vise ce qui concerne Paul ou son dossier. « Contre moi » rend cette portée de façon idiomatique, sans transformer l’expression en jugement sur sa personne intérieure.
