id: ACT.28.24
reference: Acts 28:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: fr
  text: Les uns se laissaient convaincre par ce qui était dit, mais les autres ne croyaient pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείθοντο
  choice: se laissaient convaincre
  rationale: L’imparfait exprime une réaction en cours, et la tournure pronominale rend naturellement en français la valeur passive ou moyenne sans assimiler explicitement cette conviction à la foi au sens théologique plein.
- source_word: τοῖς λεγομένοις
  choice: par ce qui était dit
  rationale: Le participe présent passif substantivé désigne le contenu du discours. L’imparfait français conserve l’aspect duratif dans un style naturel.
- source_word: ἠπίστουν
  choice: ne croyaient pas
  rationale: Cette formulation rend directement l’imparfait de ἀπιστέω sans ajouter la nuance volontaire de « refusaient de croire », qui reste possible mais n’est pas imposée par le verbe.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: les uns ... mais les autres
  rationale: Cette corrélation française reproduit clairement la division du groupe et le contraste marqué par μέν ... δέ.
- source_word: καὶ
  choice: non rendu explicitement
  rationale: Dans ce contexte narratif, l’enchaînement est suffisamment exprimé en français sans « et » initial, dont l’emploi serait moins naturel ici.
theological_decisions:
- issue: Nature du contraste entre les réactions
  choice: Le texte distingue ceux que le discours convainquait de ceux qui ne croyaient pas.
  alternative: Présenter les premiers comme des croyants sauvés et les seconds comme des incroyants endurcis, ou rendre ces derniers par « refusaient de croire ».
  rationale: Le grec décrit les réactions immédiates au message sans définir à lui seul l’état spirituel ultime de chaque personne ni imposer explicitement une nuance de refus volontaire.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure grecque tout en étant idiomatique; elle conserve les imparfaits parallèles et n’ajoute aucune précision doctrinale.
