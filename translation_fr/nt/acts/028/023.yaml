id: ACT.28.23
reference: Acts 28:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: fr
  text: Après avoir fixé avec lui un jour de rencontre, ils furent plus nombreux à venir le trouver dans son logement. Du matin jusqu’au soir, il leur exposait le royaume de Dieu, en témoignant solennellement de celui-ci et en s’efforçant de les convaincre au sujet de Jésus à partir de la Loi de Moïse et des Prophètes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en les persuadant au sujet de Jésus ». Le verbe grec décrit l’action de persuader, sans indiquer nécessairement ici si tous ont effectivement été convaincus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι δὲ αὐτῷ ἡμέραν
  choice: Après avoir fixé avec lui un jour
  rationale: L’aoriste moyen exprime ici l’établissement concerté d’un jour de rencontre; cette formulation est naturelle et garde αὐτῷ.
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: ils vinrent le trouver dans son logement
  rationale: ἧκον indique l’arrivée, πρὸς αὐτόν le mouvement vers Paul, et ξενία désigne son hébergement ou logement.
- source_word: πλείονες
  choice: plus nombreux
  rationale: Le comparatif est conservé sans préciser explicitement le groupe de comparaison, que le contexte fournit.
- source_word: ἐξετίθετο
  choice: il leur exposait
  rationale: L’imparfait rend l’action prolongée, tandis qu’« exposer » exprime clairement la présentation détaillée d’un sujet.
- source_word: διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ
  choice: en rendant un témoignage solennel [au sujet du] royaume de Dieu
  rationale: Le participe porte une idée de témoignage appuyé et solennel; le royaume de Dieu demeure étroitement lié à l’exposition qui précède.
- source_word: πείθων τε αὐτοὺς περὶ τοῦ Ἰησοῦ
  choice: en cherchant à les convaincre au sujet de Jésus
  rationale: « Chercher à convaincre » préserve le caractère persuasif de l’activité sans affirmer que tous les auditeurs ont effectivement été convaincus.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: à partir de la Loi de Moïse et des Prophètes
  rationale: ἀπό indique la source ou le fondement scripturaire de l’argumentation; les majuscules signalent les deux grandes parties reconnues des Écritures d’Israël.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: Du matin jusqu’au soir
  rationale: Rendu temporel direct et idiomatique, placé en tête de la seconde phrase pour alléger la longue structure grecque.
theological_decisions:
- issue: Lien entre le royaume de Dieu, Jésus et les Écritures d’Israël
  choice: Présenter une seule exposition soutenue où Paul témoigne du royaume et cherche à convaincre au sujet de Jésus à partir de la Loi et des Prophètes.
  alternative: Traiter le royaume de Dieu et Jésus comme deux sujets indépendants, ou limiter explicitement la base scripturaire au seul propos sur Jésus.
  rationale: La syntaxe associe ces éléments dans la même activité d’exposition et de persuasion, tout en laissant ouverte la portée exacte du complément « à partir de la Loi de Moïse et des Prophètes ».
translation_notes:
  register: Français international moderne, digne et accessible. La longue période grecque est divisée en deux phrases, sans perdre les liens logiques. « Loi de Moïse » et « Prophètes » conservent la terminologie biblique courante.
