id: ACT.28.29
reference: Acts 28:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: robinson-pierpont-2005-byzantine
  text: Καὶ ταῦτα αὐτοῦ εἰπόντος, ἀπῆλθον οἱ Ἰουδαῖοι, πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/029.yaml
  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: fr
  text: Après qu’il eut dit cela[a], les Juifs partirent, discutant vivement entre eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset entier est absent des plus anciens manuscrits grecs, notamment le papyrus 74 (IIIe siècle), le Sinaïticus et le Vaticanus (IVe siècle), ainsi que des anciennes traductions coptes. Il figure dans la tradition byzantine majoritaire et dans d’anciennes traductions latines et syriaques. Il s’agit probablement d’un ajout ultérieur destiné à compléter le récit du départ des responsables juifs.
    reason: textual_critical
lexical_decisions:
- source_word: συζήτησις
  choice: discutant vivement
  rationale: Le nom désigne une discussion, un débat ou une controverse. La tournure verbale est naturelle en français et « vivement » rend l’intensité de πολλήν sans imposer l’idée d’une querelle ouverte.
- source_word: ἀπέρχομαι
  choice: partirent
  rationale: Verbe courant de déplacement signifiant « s’en aller » ou « partir » ; « partirent » convient au registre narratif moderne et digne.
- source_word: ἐν ἑαυτοῖς
  choice: entre eux
  rationale: Expression idiomatique indiquant que l’échange animé avait lieu au sein du groupe.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’intensité du désaccord sans transformer nécessairement la discussion en querelle.
