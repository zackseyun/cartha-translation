id: ACT.28.15
reference: Acts 28:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: fr
  text: De là, les frères[a], ayant entendu parler de nous, vinrent à notre rencontre jusqu’au Forum d’Appius et aux Trois-Tavernes. Quand Paul les vit, il rendit grâce à Dieu et prit courage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs »; le grec dit « frères », terme courant pour désigner les autres croyants et qui peut, selon le contexte, inclure des femmes.
    reason: Alternative lexicale précisant la portée potentiellement inclusive du masculin pluriel grec.
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: De là
  rationale: Rend avec concision la transition spatiale qui poursuit le récit du voyage; la liaison grecque est naturellement portée en français par l’enchaînement narratif.
- source_word: οἱ ἀδελφοὶ
  choice: les frères
  rationale: Conserve la forme masculine du grec pour désigner les membres de la communauté chrétienne, tout en signalant en note que ce pluriel peut inclure des femmes.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: ayant entendu parler de nous
  rationale: Exprime naturellement la valeur circonstancielle du participe et l’idée d’avoir reçu des informations au sujet de Paul et de ses compagnons, sans ajouter explicitement « la nouvelle ».
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: vinrent à notre rencontre
  rationale: Rend fidèlement l’expression grecque désignant le fait de se déplacer pour accueillir quelqu’un.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: jusqu’au Forum d’Appius et aux Trois-Tavernes
  rationale: « Jusqu’à » conserve la notion d’étendue exprimée par ἄχρι; les deux toponymes suivent leurs formes françaises traditionnelles et transparentes.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: Quand Paul les vit
  rationale: Transforme le participe en proposition temporelle naturelle tout en maintenant clairement que le pronom renvoie aux frères venus à sa rencontre.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: il rendit grâce à Dieu
  rationale: Formulation française courante et digne qui conserve l’action de grâce explicitement adressée à Dieu.
- source_word: ἔλαβε θάρσος
  choice: prit courage
  rationale: Reproduit de près l’idiome grec sans suggérer, comme « reprit courage », que Paul avait nécessairement perdu courage auparavant.
theological_decisions:
- issue: Portée de ἀδελφοί dans une communauté chrétienne potentiellement mixte
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le texte principal conserve la forme lexicale masculine du grec et sa désignation familiale des croyants. La possibilité que le groupe comprenne aussi des femmes est explicitée en note, sans neutraliser ni élargir silencieusement le terme.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsmes lexicaux; les formulations restent immédiatement compréhensibles.
