id: ACT.28.3
reference: Acts 28:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: fr
  text: Paul ramassa alors une brassée de bois mort et la mit sur le feu. Une vipère sortit à cause de la chaleur[a] et s’accrocha à sa main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sortit de la chaleur ». La préposition grecque peut se traduire plus littéralement ainsi, mais elle indique probablement ici la cause : la vipère sortit sous l’effet de la chaleur du feu.'
    reason: lexical_alternative
  - marker: b
    text: Ou « saisit sa main » ou « mordit sa main ». Le verbe grec signifie plus largement « se fixer à » ou « saisir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: ramassa
  rationale: Dans le contexte du combustible destiné au feu, le verbe désigne l’action de rassembler ou de ramasser plutôt que celle de tordre ensemble.
- source_word: φρυγάνων τι πλῆθος
  choice: une brassée de bois mort
  rationale: φρύγανα désigne de petites branches sèches ou des broussailles servant de combustible, et τι πλῆθος une quantité indéterminée. « Une brassée de bois mort » est concret et naturel sans réduire l’expression à quelques brindilles.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: la mit sur le feu
  rationale: Cette formulation simple restitue l’action de déposer le combustible sur le feu et maintient la succession narrative.
- source_word: ἔχιδνα
  choice: une vipère
  rationale: Le terme grec désigne spécifiquement une vipère, et non simplement un serpent.
- source_word: ἀπὸ τῆς θέρμης
  choice: à cause de la chaleur
  rationale: 'La préposition ἀπό marque ici vraisemblablement la cause : la chaleur fait sortir la vipère. Cette formulation est plus claire en français qu’un calque avec « de ».'
- source_word: ἐξελθοῦσα
  choice: sortit
  rationale: Le participe aoriste est rendu par un verbe conjugué afin d’exprimer naturellement en français l’apparition de la vipère dans la séquence du récit.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: s’accrocha à sa main
  rationale: καθάπτω exprime le fait de se fixer à quelque chose ou de le saisir. « S’accrocha à » conserve cette image sans préciser indûment que le serpent mordit Paul.
theological_decisions: []
