  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe grecque participiale est répartie en deux phrases pour conserver une lecture naturelle, tandis que les notes maintiennent les ambiguïtés lexicales réelles.
