  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: fr
  text: Alors, après avoir secoué l’animal[a] dans le feu, il ne subit aucun mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bête »; le terme grec est général, même si le contexte indique qu’il s’agit d’un serpent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Alors, … il
  rationale: L’article a une valeur pronominale et renvoie à Paul. μέν οὖν marque ici une légère transition dans le récit; « Alors » la rend naturellement sans donner trop de poids aux particules.
- source_word: ἀποτινάξας
  choice: après avoir secoué
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. « Après avoir secoué » conserve clairement cette succession.
- source_word: τὸ θηρίον
  choice: l’animal
  rationale: θηρίον est un terme général désignant un animal, souvent sauvage. Le contexte montre qu’il s’agit du serpent mentionné au verset précédent, mais le présent verset n’emploie pas un mot spécifique pour « serpent » ou « vipère ».
- source_word: εἰς τὸ πῦρ
  choice: dans le feu
  rationale: εἰς avec l’accusatif indique ici le mouvement vers l’intérieur du feu; « dans le feu » est la formulation française naturelle.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: il ne subit aucun mal
  rationale: La tournure rend directement πάσχω avec οὐδὲν κακόν et exprime l’absence de blessure ou d’effet nuisible, tout en restant digne et intelligible.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La construction garde l’antériorité du participe grec et évite de préciser « serpent » dans le texte principal, afin de préserver la généralité lexicale de θηρίον.
