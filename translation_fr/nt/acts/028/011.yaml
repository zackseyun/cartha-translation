  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: fr
  text: Après trois mois, nous avons pris la mer à bord d’un navire d’Alexandrie qui avait passé l’hiver sur l’île et avait pour emblème les Dioscures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les Dioscures sont Castor et Pollux, les jumeaux de la mythologie gréco-romaine.
    reason: Explication culturelle du nom mythologique pour les lecteurs qui ne le connaissent pas, sans trancher les variantes anciennes concernant leur filiation.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Après trois mois
  rationale: μετά avec l’accusatif marque ici le temps écoulé. Le léger lien narratif exprimé par δέ n’a pas besoin d’être rendu explicitement en français.
- source_word: ἀνήχθημεν
  choice: nous avons pris la mer
  rationale: Dans un contexte maritime, ἀνάγω signifie quitter le rivage et prendre la mer. Cette formulation est naturelle et précise en français moderne.
- source_word: ἐν πλοίῳ … Ἀλεξανδρίνῳ
  choice: à bord d’un navire d’Alexandrie
  rationale: πλοῖον désigne ici un navire, et Ἀλεξανδρίνῳ en indique l’origine ou le rattachement. « À bord de » est l’expression française idiomatique.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: qui avait passé l’hiver dans l’île
  rationale: Le participe parfait de παραχειμάζω indique que le navire était resté là pendant l’hiver. « Dans l’île » peut désigner le territoire insulaire où il avait hiverné et suit naturellement le récit.
- source_word: παρασήμῳ
  choice: avait pour emblème
  rationale: παράσημος renvoie au signe distinctif ou à l’emblème du navire. « Emblème » conserve l’indétermination du grec, qui ne précise pas nécessairement qu’il s’agissait d’une figure de proue.
- source_word: Διοσκούροις
  choice: les Dioscures
  rationale: Le nom propre grec désigne Castor et Pollux. La forme française traditionnelle « Dioscures » reflète directement le texte source sans le remplacer par une paraphrase interprétative.
theological_decisions:
- issue: Mention de l’emblème païen du navire
  choice: les Dioscures
  alternative: les dieux jumeaux / Castor et Pollux
  rationale: Le récit signale un emblème religieux gréco-romain sans l’approuver. Garder le nom propre préserve la précision historique, tandis qu’une note en explique le référent.
translation_notes:
  register: Français international moderne, sobre et narratif. « Navire d’Alexandrie » est plus naturel que « navire alexandrin » pour de nombreux lecteurs. Le choix d’« emblème » évite de préciser au-delà du grec la forme matérielle du signe distinctif.
