  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: fr
  text: Quand nous sommes arrivés à Rome, Paul a été autorisé à résider à part[a], avec le soldat qui le gardait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à demeurer séparément » ; litt. « selon lui-même ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Quand
  rationale: Ὅτε introduit la circonstance temporelle. δέ est ici un lien discursif léger qu’il n’est pas nécessaire d’expliciter en français moderne.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: nous sommes entrés dans Rome
  rationale: Cette formulation conserve le mouvement exprimé par εἰσέρχομαι avec εἰς, plutôt que de le réduire à la simple idée d’arrivée.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: Paul a reçu la permission
  rationale: La tournure française rend naturellement le passif grec et exprime clairement l’autorisation accordée à Paul.
- source_word: μένειν
  choice: de demeurer
  rationale: Dans ce contexte de résidence surveillée, « demeurer » peut désigner le fait de séjourner ou d’habiter quelque part, tout en gardant un registre digne.
- source_word: καθ’ ἑαυτὸν
  choice: seul
  rationale: L’expression signifie que Paul pouvait loger à part, sans impliquer un isolement absolu, puisque le soldat chargé de le garder restait avec lui.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: avec le soldat qui le gardait
  rationale: σύν marque l’accompagnement, et l’article grec présente le soldat comme le garde assigné à Paul; le défini « le soldat » est donc conservé.
