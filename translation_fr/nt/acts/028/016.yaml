  source_fidelity: 'Le sens général est bien rendu : l’entrée à Rome, l’autorisation accordée à Paul, son statut séparé et la présence du soldat gardien sont conservés. Toutefois, « seul » risque de contredire immédiatement « avec le soldat » et de suggérer un isolement absolu, alors que καθ’ ἑαυτόν désigne plutôt une résidence séparée ou indépendante.'
