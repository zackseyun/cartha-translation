id: ACT.28.20
reference: Acts 28:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: fr
  text: C’est donc pour cette raison que j’ai demandé à vous voir et à parler avec vous, car c’est à cause de l’espérance d’Israël[a] que je porte cette chaîne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner l’espérance d’Israël ou l’espérance liée à Israël, notamment aux promesses qui lui ont été faites ; dans les Actes, elle est associée à la résurrection et à l’accomplissement des promesses.
    reason: Préserver l’étendue possible du génitif et l’allusion théologique sans la réduire dans le texte principal.
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: C’est donc pour cette raison
  rationale: Cette formulation conserve à la fois le rapport causal et la valeur conclusive de οὖν, tout en restant naturelle en français.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν
  choice: j’ai demandé à vous voir
  rationale: Dans ce contexte, παρεκάλεσα exprime une demande plutôt qu’un appel juridique, et ἰδεῖν garde son sens direct de « voir ».
- source_word: προσλαλῆσαι
  choice: à parler avec vous
  rationale: « Parler avec vous » rend simplement l’idée d’un échange et évite de présenter la parole comme nécessairement unilatérale.
- source_word: ἕνεκεν γὰρ
  choice: car c’est à cause de
  rationale: La formulation rend à la fois la fonction explicative de γάρ et la causalité explicite de ἕνεκεν.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: l’espérance d’Israël
  rationale: 'Le génitif reste compact et ambigu : il peut désigner l’espérance propre à Israël, celle qui lui est promise ou celle dont Israël attend l’accomplissement.'
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: je porte cette chaîne
  rationale: Le singulier est conservé, et « porter » restitue l’image concrète de περίκειμαι, qui décrit ce que Paul a autour de lui, sans remplacer cette image par une explication.
theological_decisions:
- issue: Sens de « l’espérance d’Israël »
  choice: Conserver la formule non développée « l’espérance d’Israël »
  alternative: « l’espérance de la résurrection d’Israël » ou « l’espérance messianique d’Israël »
  rationale: Le contexte des Actes peut évoquer la résurrection, les promesses et leur accomplissement messianique, mais le grec ne précise pas ici un seul de ces aspects. La traduction préserve donc l’allusion et sa portée théologique.
translation_notes:
  register: Français moderne, clair et digne. La phrase garde les deux articulations logiques du grec (« donc » et « car ») ainsi que l’image concrète de la chaîne.
