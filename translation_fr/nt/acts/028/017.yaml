revisions:
- from: 'Trois jours plus tard, il convoqua les principaux responsables des Juifs[a]. Quand ils furent réunis, il leur dit : « Frères[b], quant à moi, bien que je n’aie rien fait contre le peuple ni contre les coutumes de nos ancêtres[c], j’ai été livré comme prisonnier, depuis Jérusalem, entre les mains des Romains[d]. »'
  to: 'Trois jours plus tard, il convoqua les notables parmi les Juifs[a]. Quand ils furent réunis, il leur dit : « Frères[b], quant à moi, bien que je n’aie rien fait contre le peuple ni contre les coutumes de nos ancêtres[c], j’ai été livré aux mains des Romains comme prisonnier venu de Jérusalem[d]. »'
  rationale: La révision évite de faire de ces hommes des « responsables » au sens institutionnel, alors que le grec les présente comme les personnes les plus éminentes parmi les Juifs. Elle reformule également la provenance depuis Jérusalem dans un français plus fluide, sans supprimer le statut de prisonnier ni l'image des « mains des Romains ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:17:05Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la chronologie, la convocation, l'adresse fraternelle, la concession (« bien que »), l'absence d'opposition au peuple et aux coutumes ancestrales, ainsi que la remise aux Romains. « Principaux responsables des Juifs » risque toutefois d'attribuer une fonction officielle que πρῶτοι n'implique pas nécessairement; « notables parmi les Juifs » rend plus exactement leur prééminence sociale. La formulation « depuis Jérusalem » est aussi peu naturelle à cet endroit en français et obscurcit légèrement le lien entre l'origine de la remise et le statut de prisonnier.
  naturalness: 'Le français est globalement moderne et digne. La révision proposée allège deux formulations : « notables parmi les Juifs » est plus idiomatique et moins institutionnel, et « comme prisonnier venu de Jérusalem » exprime naturellement ἐξ Ἱεροσολύμων sans perdre l''idée de provenance.'
  terminology: « Frères », « le peuple », « coutumes de nos ancêtres », « prisonnier » et « Romains » sont appropriés. Les notes conservent utilement les alternatives lexicales et l'explication culturelle de l'apostrophe grecque.
