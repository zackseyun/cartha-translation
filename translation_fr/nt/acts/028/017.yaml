source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: fr
  text: 'Trois jours plus tard, il convoqua les notables parmi les Juifs[a]. Quand ils furent réunis, il leur dit : « Frères[b], quant à moi, bien que je n’aie rien fait contre le peuple ni contre les coutumes de nos ancêtres[c], j’ai été livré aux mains des Romains comme prisonnier venu de Jérusalem[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dirigeants des Juifs » ou « les Juifs les plus en vue ».
    reason: lexical_alternative
  - marker: b
    text: Le mot « frères » traduit ici l’apostrophe grecque ἀδελφοί; Paul s’adresse aux principaux hommes juifs qu’il avait convoqués.
    reason: cultural_note
  - marker: c
    text: Ou « les coutumes ancestrales ».
    reason: lexical_alternative
  - marker: d
    text: Ou « j’ai été remis aux Romains comme prisonnier ». Le grec dit plus littéralement « j’ai été livré, prisonnier, de Jérusalem entre les mains des Romains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Trois jours plus tard
  rationale: Cette formulation française naturelle exprime directement le repère temporel et rend le tour narratif lucanien sans calquer lourdement « il arriva que ».
- source_word: συγκαλέσασθαι αὐτὸν
  choice: il convoqua
  rationale: « Convoquer » exprime clairement l’initiative de Paul et l’idée de faire venir plusieurs personnes ensemble.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: les principaux responsables des Juifs
  rationale: πρώτους indique ici le rang ou la prééminence. Cette traduction désigne naturellement les représentants juifs les plus en vue sans leur attribuer un titre institutionnel absent du grec.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Quand ils furent réunis
  rationale: Le génitif absolu est rendu par une proposition temporelle idiomatique.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Frères, quant à moi
  rationale: « Frères » conserve l’adresse masculine appropriée aux responsables juifs présents, tandis que « quant à moi » rend l’insistance portée par Ἐγώ sans produire le calque peu naturel « Moi, hommes frères ».
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: bien que je n’aie rien fait contre
  rationale: 'Le participe a ici une valeur concessive : Paul oppose son innocence au fait d’avoir été livré aux Romains.'
- source_word: τῷ λαῷ
  choice: le peuple
  rationale: Le contexte identifie le peuple juif; aucun possessif explicite n’est ajouté au texte grec.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: les coutumes de nos ancêtres
  rationale: Cette expression actuelle et digne rend les pratiques héritées des générations antérieures ainsi que la solidarité de Paul avec ses interlocuteurs.
- source_word: δέσμιος
  choice: comme prisonnier
  rationale: Le terme décrit le statut de Paul lors de sa remise aux autorités romaines, sans exiger la traduction imagée « dans les chaînes ».
- source_word: ἐξ Ἱεροσολύμων
  choice: depuis Jérusalem
  rationale: La formulation conserve l’idée de provenance ou de point de départ exprimée par ἐξ.
- source_word: παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: j’ai été livré … entre les mains des Romains
  rationale: Le passif et l’image des « mains » sont conservés, tout en restant compréhensibles en français moderne.
theological_decisions:
- issue: Sens de l’adresse ἀδελφοί
  choice: Frères
  alternative: Frères et sœurs
  rationale: Paul s’adresse ici aux principaux hommes juifs qu’il a convoqués. Le masculin du grec correspond donc au groupe présent et exprime aussi sa solidarité avec eux.
- issue: Valeur du participe οὐδὲν ἐναντίον ποιήσας
  choice: bien que je n’aie rien fait contre
  alternative: n’ayant rien fait contre
  rationale: La valeur concessive met en relief la tension du récit entre l’innocence revendiquée par Paul et sa remise aux autorités romaines, sans expliquer théologiquement cette injustice.
- issue: Référent de τῷ λαῷ
  choice: le peuple
  alternative: notre peuple
  rationale: Le grec n’emploie pas de possessif. Le contexte juif suffit à identifier le référent, ce qui évite une explicitation non nécessaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit est formulé naturellement, tandis que l’insistance de Paul, la valeur concessive de sa déclaration d’innocence et l’image juridique de sa remise aux Romains sont préservées.
