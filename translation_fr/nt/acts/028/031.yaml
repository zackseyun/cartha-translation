id: ACT.28.31
reference: Acts 28:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: fr
  text: Il proclamait le royaume de Dieu et enseignait ce qui concerne le Seigneur Jésus, le Messie[a], avec une pleine assurance et sans aucune entrave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus Christ ». Le grec Χριστός peut fonctionner comme un titre (« Messie ») ou, selon le contexte, comme une désignation proche d’un nom propre (« Christ »).'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: Il proclamait
  rationale: Le verbe « proclamer » conserve l’idée d’une annonce publique. L’imparfait français exprime l’activité continue résumée par le participe présent grec et reprend naturellement Paul comme sujet dans le contexte.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française courante qui laisse à βασιλεία ses dimensions de royaume et de règne, sans réduire le terme à l’une d’elles.
- source_word: διδάσκων
  choice: enseignait
  rationale: Rendu direct, coordonné à « proclamait », qui décrit l’activité suivie de Paul.
- source_word: τὰ περὶ
  choice: ce qui concerne
  rationale: Expression idiomatique en français moderne, suffisamment proche de la construction grecque sans la lourdeur de « les choses concernant ».
- source_word: τοῦ κυρίου Ἰησοῦ Χριστοῦ
  choice: le Seigneur Jésus, le Messie
  rationale: « Seigneur » conserve le titre christologique κύριος. « Le Messie » traduit le sens titulaire de Χριστός, tandis que les virgules rendent la construction naturelle en français.
- source_word: μετὰ πάσης παρρησίας
  choice: avec une entière assurance
  rationale: παρρησία désigne ici la liberté, la franchise et l’assurance dans la parole; « entière » restitue la force intensive de πάσης.
- source_word: ἀκωλύτως
  choice: sans aucune entrave
  rationale: Cette expression française rend clairement l’absence d’empêchement soulignée par l’adverbe final, tout en conservant sa portée culminante.
theological_decisions:
- issue: Valeur de Χριστός dans la séquence christologique
  choice: le Messie
  alternative: Christ
  rationale: Dans ce contexte, Χριστός garde une valeur de titre intelligible comme « Messie ». La forme traditionnelle « Christ », qui peut aussi fonctionner comme une désignation proche d’un nom propre, demeure signalée en note afin de préserver l’ambiguïté d’usage.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait transforme les participes grecs en verbes conjugués afin que le verset soit lisible en français tout en conservant leur valeur durative dans le contexte. La clôture « sans aucune entrave » garde l’accent final du récit.
