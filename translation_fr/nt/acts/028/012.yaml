  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: fr
  text: Après avoir fait escale à Syracuse[a], nous y sommes restés trois jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir abordé à Syracuse » ou « après être entrés au port de Syracuse ». Le participe grec a ici un sens nautique.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: après avoir fait escale
  rationale: Dans ce contexte de voyage maritime, κατάγω désigne l’arrivée d’un navire dans un port. « Faire escale » rend naturellement ce sens nautique, sans retenir le sens littéral inadapté de « faire descendre ».
- source_word: εἰς Συρακούσας
  choice: à Syracuse
  rationale: Après « faire escale », la préposition française « à » exprime idiomatiquement l’arrivée dans cette ville portuaire.
- source_word: ἐπεμείναμεν
  choice: nous y sommes restés
  rationale: Le verbe signifie demeurer ou rester. Le pronom « y » reprend naturellement Syracuse et explicite seulement le lieu déjà indiqué.
- source_word: ἡμέρας τρεῖς
  choice: trois jours
  rationale: L’accusatif marque ici la durée; en français, « rester trois jours » l’exprime directement et naturellement.
- source_word: Συρακούσας
  choice: Syracuse
  rationale: « Syracuse » est la forme française traditionnelle et courante du nom de cette ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. « Faire escale » conserve le cadre maritime tout en restant immédiatement compréhensible.
