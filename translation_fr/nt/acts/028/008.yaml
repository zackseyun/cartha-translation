  to: Il arriva que le père de Publius était couché, en proie à des accès de fièvre et à la dysenterie[a]. Paul entra et s’approcha de lui ; après avoir prié et lui avoir imposé les mains, il le guérit.
  rationale: La révision conserve le sens et l’ambiguïté du grec tout en améliorant l’idiomaticité française. Elle replace aussi l’ancre de note sur les mots qu’elle documente.
