review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend bien les éléments essentiels : le père de Publius, son état de malade couché, les fièvres, la dysenterie, la prière, l’imposition des mains et la guérison. Toutefois, « alité » peut suggérer plus précisément un confinement au lit que κατακεῖσθαι ne l’exige, et « entra auprès de lui » n’est pas idiomatique en français.'
  naturalness: 'Une légère révision améliore la fluidité : « était couché, en proie à… » restitue sobrement l’état du malade, et « Paul entra et s’approcha de lui » rend naturellement l’entrée suivie du mouvement vers lui. L’ancre de note doit se trouver sur l’expression relative aux maladies.'
  terminology: « Publius », « dysenterie », « prier », « imposer les mains » et « guérit » sont exacts, modernes et adaptés au registre biblique. « Accès de fièvre » est une bonne manière française de rendre le pluriel πυρετοῖς sans employer l’expression moins usuelle « des fièvres ».
  issues:
  - severity: low
    issue: Ancre de note placée après « lui »
    rationale: La note explique συνεχόμενον et les maladies (« accès de fièvre et dysenterie »), non le déplacement de Paul. Son marqueur doit donc être attaché à cette expression.
  - severity: low
    issue: « Paul entra auprès de lui » est peu idiomatique
    rationale: En français contemporain, on entre dans un lieu, puis on s’approche d’une personne. La reformulation conserve les deux mouvements présents dans le grec.
  - severity: low
    issue: « était alité » peut être trop spécifique
    rationale: κατακεῖσθαι indique qu’il était couché dans son état de maladie, sans imposer nécessairement l’idée d’un alitement durable ou strict.
  revised_text: Il arriva que le père de Publius était couché, en proie à des accès de fièvre et à la dysenterie[a]. Paul entra et s’approcha de lui ; après avoir prié et lui avoir imposé les mains, il le guérit.
  revised_footnotes:
