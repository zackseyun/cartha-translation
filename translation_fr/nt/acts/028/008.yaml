id: ACT.28.8
reference: Acts 28:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: fr
  text: Il arriva que le père de Publius était couché, en proie à des accès de fièvre et à la dysenterie[a]. Paul entra et s’approcha de lui ; après avoir prié et lui avoir imposé les mains, il le guérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « atteint d’accès de fièvre et de dysenterie ». Le participe grec évoque le fait d’être tenu, accablé ou saisi par ces maladies.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Il se trouva que
  rationale: Cette tournure introduit naturellement l’événement en français et rend la transition narrative sans ajouter un adverbe temporel absent du grec.
- source_word: πατέρα τοῦ Ποπλίου
  choice: le père de Publius
  rationale: Rend directement et naturellement le groupe génitif grec.
- source_word: πυρετοῖς
  choice: des accès de fièvre
  rationale: Préserve la valeur du pluriel grec tout en évitant le tour moins naturel « des fièvres »; l’expression peut évoquer plusieurs épisodes fébriles sans en préciser la cause.
- source_word: δυσεντερίῳ
  choice: la dysenterie
  rationale: C’est le sens médical direct du terme grec et il reste compréhensible en français moderne.
- source_word: συνεχόμενον
  choice: en proie à
  rationale: Exprime l’idée d’être tenu ou accablé par les maladies, tout en restant idiomatique.
- source_word: κατακεῖσθαι
  choice: était alité
  rationale: Le verbe décrit une personne couchée dans un contexte de maladie; « alité » communique clairement cette situation sans détailler davantage son degré d’incapacité.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Paul entra auprès de lui
  rationale: Rend à la fois l’entrée de Paul et son mouvement vers le malade dans une formulation française naturelle.
- source_word: προσευξάμενος
  choice: après avoir prié
  rationale: Le participe aoriste indique naturellement une action accomplie avant le verbe principal.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: lui avoir imposé les mains
  rationale: « Imposer les mains » est l’expression française consacrée et fidèle au geste décrit.
- source_word: ἰάσατο αὐτόν
  choice: il le guérit
  rationale: Rend directement l’acte de guérison sans lui ajouter de qualification absente du texte.
theological_decisions:
- issue: Nature de la guérison accomplie par Paul
  choice: Présenter simplement la prière, l’imposition des mains et la guérison
  alternative: Qualifier explicitement la guérison de miraculeuse, sacramentelle ou médicale
  rationale: Le verset affirme la guérison à la suite des gestes de Paul, mais ne lui applique aucune de ces qualifications interprétatives.
translation_notes:
  register: Français international moderne, digne et accessible. « Était alité » et « en proie à » conservent la gravité du récit sans archaïsme; « des accès de fièvre » restitue naturellement le pluriel grec.
