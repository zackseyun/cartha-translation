id: ACT.28.9
reference: Acts 28:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: fr
  text: Après cela, les autres personnes qui se trouvaient sur l’île et souffraient de maladies[a] venaient elles aussi et étaient guéries.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «étaient malades». Le grec dit littéralement «ayant des maladies».
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Après cela
  rationale: Le génitif absolu marque la transition temporelle avec l’événement précédent; cette formulation est naturelle et concise en français.
- source_word: οἱ λοιποὶ οἱ ἐν τῇ νήσῳ
  choice: les autres personnes qui se trouvaient sur l’île
  rationale: Cette formulation rend le groupe restant présent sur l’île sans ajouter explicitement «habitants», notion plausible mais non exprimée dans le grec.
- source_word: ἔχοντες ἀσθενείας
  choice: souffraient de maladies
  rationale: Le pluriel concret ἀσθενείας est conservé, tandis que «souffraient de» traduit idiomatiquement la construction grecque signifiant littéralement «ayant des maladies».
- source_word: προσήρχοντο
  choice: venaient
  rationale: L’imparfait français reflète l’imparfait grec et suggère que les malades venaient successivement, sans ajouter un complément comme «vers Paul», implicite mais absent du texte.
- source_word: καὶ
  choice: elles aussi
  rationale: Le second καί rattache ces personnes au cas précédent et prend naturellement en français la valeur additive «aussi».
- source_word: ἐθεραπεύοντο
  choice: étaient guéries
  rationale: L’imparfait passif conserve à la fois l’aspect duratif ou répété du grec et sa voix passive, sans préciser l’agent.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’emploi coordonné des imparfaits «venaient» et «étaient guéries» met en valeur le caractère répété de la scène. Le marqueur de note est placé après l’expression qu’il explique.
