    rationale: Le verbe français peut évoquer un retrait volontaire ou un repli. Dans la scène, le groupe se sépare et part; « partirent » est plus direct et naturel.
  - severity: low
    issue: Formulation et ordre de la médiation prophétique
    rationale: « Paul eut dit un dernier mot » est plus usuel que « eut prononcé une dernière parole ». Placer « à vos pères » après « par l’intermédiaire du prophète Ésaïe » reflète en outre l’ordre et les relations de la phrase grecque.
