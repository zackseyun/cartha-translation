source:
  edition: SBLGNT
  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: fr
  text: 'Comme ils n’étaient pas d’accord entre eux, ils partirent après que Paul eut dit un dernier mot[a] : « L’Esprit saint a parlé avec justesse par l’intermédiaire du prophète Ésaïe à vos pères[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parole » ou « une déclaration ». Le grec dit littéralement « une parole »; l’expression sert ici de remarque finale.
    reason: lexical_alternative
  - marker: b
    text: Ou « vos ancêtres ». Le grec dit « vos pères » et désigne les ancêtres d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: Comme ils n’étaient pas d’accord entre eux
  rationale: Cette formulation française naturelle rend l’état de désaccord mutuel exprimé par la construction participiale, sans exagérer l’hostilité.
- source_word: ἀπελύοντο
  choice: ils se retiraient
  rationale: L’imparfait grec présente leur départ comme un processus en cours; « se retiraient » convient à la dispersion d’un groupe et garde cet aspect.
- source_word: εἰπόντος τοῦ Παύλου
  choice: après que Paul eut prononcé
  rationale: Le génitif absolu aoriste est rendu par une proposition temporelle marquant l’antériorité. « Prononcer » s’emploie naturellement avec « parole » en français.
- source_word: ῥῆμα ἓν
  choice: une dernière parole
  rationale: Littéralement « une parole », l’expression introduit ici la remarque conclusive de Paul. Une note conserve le sens strict possible.
- source_word: Καλῶς
  choice: C’est avec raison que
  rationale: Cette tournure exprime l’évaluation positive de la parole prophétique sans laisser entendre que l’Esprit avait simplement le droit de parler.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Rendu français usuel de la désignation définie; la majuscule à « Esprit » signale clairement le référent divin.
- source_word: ἐλάλησεν
  choice: a parlé
  rationale: Le verbe garde le sens direct de λαλέω et convient à la parole prophétique.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: par l’intermédiaire du prophète Ésaïe
  rationale: 'διά avec le génitif indique ici la médiation: l’Esprit parle en se servant d’Ésaïe comme porte-parole.'
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: à vos pères
  rationale: Le rendu conserve le nom masculin explicite πατέρας et la deuxième personne de ὑμῶν; dans le contexte, il désigne les ancêtres d’Israël.
theological_decisions:
- issue: L’action de l’Esprit saint dans la parole prophétique
  choice: l’Esprit saint a parlé … par l’intermédiaire du prophète Ésaïe
  alternative: la parole a été transmise par Ésaïe
  rationale: Le texte attribue explicitement la parole à l’Esprit saint tout en présentant Ésaïe comme son intermédiaire; la traduction conserve les deux agents sans réduire l’Esprit à une influence impersonnelle.
- issue: Référent de « vos pères »
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le grec porte explicitement le masculin pluriel πατέρας. Le sens collectif d’ancêtres d’Israël est indiqué en note sans neutraliser le texte principal.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste assez soutenue pour le récit biblique (« après que Paul eut prononcé »), tandis que « n’étaient pas d’accord entre eux » demeure immédiatement compréhensible. Les guillemets restent ouverts parce que la citation se poursuit au verset suivant.
