  source_fidelity: Le sens général est fidèle. Toutefois, « se retiraient » peut suggérer un retrait plutôt qu’un départ ou une dispersion du groupe; « partirent » rend plus directement ἀπελύοντο dans ce contexte. La place de « à vos pères » après la médiation d’Ésaïe suit aussi plus étroitement la construction grecque.
  naturalness: Le français est globalement naturel et de registre approprié. « Paul eut prononcé une dernière parole » est possible, mais « Paul eut dit un dernier mot » est plus idiomatique tout en conservant la valeur conclusive de ῥῆμα ἕν.
  terminology: « L’Esprit saint », « le prophète Ésaïe » et « vos pères » sont appropriés. « A parlé avec justesse » rend clairement la valeur évaluative de καλῶς, sans alourdir la tournure.
