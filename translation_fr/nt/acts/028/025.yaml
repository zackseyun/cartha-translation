  to: 'Comme ils n’étaient pas d’accord entre eux, ils partirent après que Paul eut dit un dernier mot[a] : « L’Esprit saint a parlé avec justesse par l’intermédiaire du prophète Ésaïe à vos pères[b] :'
  rationale: La révision remplace un verbe de retrait potentiellement trop spécifique par le départ du groupe, simplifie légèrement l’expression française du génitif absolu et remet les compléments de la parole prophétique dans un ordre plus proche du grec. Elle conserve l’ambiguïté limitée de « vos pères », l’attribution explicite de la parole à l’Esprit saint et la citation ouverte qui se poursuit au verset suivant.
