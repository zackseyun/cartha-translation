  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: fr
  text: Là, nous avons trouvé des frères[a], et nous avons été invités à rester sept jours chez eux. C’est ainsi que nous sommes arrivés à Rome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des frères et des sœurs » ; le grec dit « frères », mais dans ce contexte le terme désigne probablement l’ensemble des croyants.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Là
  rationale: Adverbe relatif de lieu renvoyant à Pouzzoles, mentionnée juste avant ; « Là » est naturel en français narratif.
- source_word: εὑρόντες
  choice: nous avons trouvé
  rationale: Le participe aoriste, de même sujet que le verbe principal, est rendu par un verbe conjugué afin d’exprimer naturellement l’action antérieure.
- source_word: ἀδελφοὺς
  choice: des frères
  rationale: Le terme désigne ici très probablement des membres de la communauté chrétienne locale. La forme masculine du grec est conservée dans le texte, avec une note sur sa portée contextuelle possible.
- source_word: παρεκλήθημεν
  choice: nous avons été invités
  rationale: Le passif de παρακαλέω exprime ici une demande pressante ou une invitation ; le contexte d’hospitalité favorise « invités » sans effacer la voix passive.
- source_word: παρ’ αὐτοῖς
  choice: chez eux
  rationale: παρά avec le datif indique ici le séjour auprès de ces croyants, vraisemblablement dans leurs maisons ; « chez eux » est l’expression française la plus naturelle.
- source_word: ἐπιμεῖναι
  choice: à rester
  rationale: Dans ce contexte de voyage et d’hospitalité, le verbe signifie demeurer temporairement dans un lieu.
- source_word: ἡμέρας ἑπτά
  choice: sept jours
  rationale: L’accusatif marque la durée ; après « rester », le français n’exige pas la préposition « pendant ».
- source_word: καὶ οὕτως
  choice: C’est ainsi que
  rationale: Cette tournure conserve l’idée de manière ou d’aboutissement portée par οὕτως, tout en assurant une transition naturelle.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: nous sommes arrivés à Rome
  rationale: Avec εἰς et une destination, ἔρχομαι souligne ici l’arrivée ; « arriver à Rome » est idiomatique et précis en français.
theological_decisions:
- issue: Référent de ἀδελφοὺς
  choice: des membres de la communauté chrétienne locale, désignés littéralement comme « frères »
  alternative: des frères biologiques, des compatriotes juifs, ou explicitement « des frères et des sœurs »
  rationale: Dans ce récit de voyage des Actes, l’accueil et l’hébergement indiquent probablement des croyants locaux. Le texte principal conserve néanmoins le terme grec sans préciser davantage que la source.
translation_notes:
  register: Français international moderne, narratif et digne. « Chez eux » traduit naturellement le cadre d’hospitalité, tandis que « C’est ainsi que » préserve la valeur de καὶ οὕτως sans lourdeur.
