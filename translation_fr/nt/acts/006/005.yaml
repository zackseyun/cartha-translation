id: ACT.6.5
reference: Acts 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: fr
  text: Cette proposition plut à toute l’assemblée, et ils choisirent Étienne, un homme plein de foi[a] et du Saint-Esprit, Philippe, Prochore, Nicanor, Timon, Parménas et Nicolas, un prosélyte[b] d’Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité.
    reason: lexical_alternative
  - marker: b
    text: Un prosélyte était un non-Juif converti au judaïsme.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: cette proposition
  rationale: Dans le contexte, λόγος renvoie à ce que les apôtres viennent de proposer. « Cette proposition » exprime naturellement ce référent concret.
- source_word: ἤρεσεν … ἐνώπιον παντὸς τοῦ πλήθους
  choice: plut à toute l’assemblée
  rationale: Avec ἀρέσκω, la locution indique que la proposition reçut l’approbation de tout le groupe réuni. « Assemblée » est naturel ici sans désigner une institution ecclésiale ultérieure.
- source_word: ἐξελέξαντο
  choice: ils choisirent
  rationale: Le verbe au moyen exprime directement le choix fait par le groupe.
- source_word: ἄνδρα πλήρης πίστεως
  choice: un homme plein de foi
  rationale: ἀνήρ désigne explicitement un homme, et πίστις signifie ici très probablement la foi ou la confiance, tout en permettant la nuance de fidélité signalée en note.
- source_word: πνεύματος ἁγίου
  choice: du Saint-Esprit
  rationale: Dans les Actes, cette expression désigne régulièrement l’Esprit divin. La formulation française usuelle et digne est « du Saint-Esprit ».
- source_word: προσήλυτον
  choice: un prosélyte
  rationale: Le terme historique désigne ici un non-Juif converti au judaïsme; une note en explicite le sens.
- source_word: Ἀντιοχέα
  choice: d’Antioche
  rationale: L’adjectif identifie Nicolas comme originaire d’Antioche ou associé à cette ville; « d’Antioche » convient naturellement dans l’apposition.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: Étienne, Philippe, Prochore, Nicanor, Timon, Parménas et Nicolas
  rationale: Les noms suivent leurs formes françaises bibliques usuelles. Une liste avec virgules et une seule conjonction finale rend naturellement en français la coordination grecque répétée.
theological_decisions:
- issue: Sens de πίστις dans la description d’Étienne
  choice: foi
  alternative: fidélité
  rationale: « Foi » est le sens le plus naturel dans cette caractérisation d’Étienne et conserve le vocabulaire théologique courant. La possibilité lexicale « fidélité » reste visible en note.
- issue: Référent de πνεύματος ἁγίου
  choice: le Saint-Esprit
  alternative: un esprit saint / une disposition spirituelle sainte
  rationale: L’usage lucanien et le contexte immédiat favorisent nettement une référence à l’Esprit divin plutôt qu’à une simple qualité humaine.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit. « Toute l’assemblée » évite le caractère potentiellement péjoratif de « foule » et n’importe pas le terme institutionnel « Église ».
