id: ACT.6.10
reference: Acts 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: fr
  text: Et ils ne pouvaient pas résister à la sagesse et à l’Esprit par lequel il parlait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit », si πνεύματι désigne l’esprit propre d’Étienne plutôt que l’Esprit Saint.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: ils n’arrivaient pas
  rationale: À l’imparfait, ἰσχύω exprime ici une incapacité persistante dans la scène. « Ils n’arrivaient pas » est naturel en français et conserve cet aspect.
- source_word: ἀντιστῆναι
  choice: à résister
  rationale: Dans ce contexte de controverse, ἀνθίστημι désigne le fait de tenir tête ou de s’opposer avec succès. « Résister à » convient naturellement aux compléments au datif.
- source_word: τῇ σοφίᾳ
  choice: à la sagesse
  rationale: L’article grec désigne la sagesse précise qui se manifestait dans les paroles d’Étienne; l’article défini français en rend bien la spécificité.
- source_word: τῷ πνεύματι
  choice: à l’Esprit
  rationale: Le contexte immédiat présente Étienne comme rempli de l’Esprit Saint (Actes 6.5), ce qui favorise cette référence, sans exclure grammaticalement « l’esprit » d’Étienne.
- source_word: ᾧ ἐλάλει
  choice: par lequel il parlait
  rationale: Le relatif au datif se rattache à πνεύματι et présente l’Esprit comme l’agent ou le moyen de la parole d’Étienne. L’imparfait ἐλάλει est rendu naturellement par « parlait », qui conserve l’action en cours.
theological_decisions:
- issue: πνεύματι désigne-t-il l’Esprit Saint ou l’esprit propre d’Étienne?
  choice: l’Esprit
  alternative: l’esprit
  rationale: Dans les Actes, Étienne vient d’être décrit comme rempli de l’Esprit Saint, et l’association de la sagesse et de l’Esprit soutient cette lecture. Comme la forme grecque n’impose pas à elle seule cette identification, l’autre lecture est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Mais » exprime naturellement la valeur adversative de καί dans le contexte. La formulation maintient l’ambiguïté réelle de πνεύματι au moyen d’une note.
