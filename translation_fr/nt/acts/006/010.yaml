  verdict: revise
  source_fidelity: La phrase rend correctement l’imparfait de ἴσχυον (« ne pouvaient pas »), l’infinitif ἀντιστῆναι (« résister »), les deux datifs coordonnés (« à la sagesse et à l’Esprit ») et l’imparfait ἐλάλει (« parlait »). Le relatif instrumental « par lequel » se rattache bien à « l’Esprit ». En revanche, καί signifie d’abord « et »; « mais » introduit une opposition qui n’est pas exprimée dans le verset lui-même.
  naturalness: « Ils ne pouvaient pas résister » est idiomatique, direct et conserve l’idée d’incapacité continue. La note actuelle est lourde et sa reformulation complète (« à la sagesse et à l’esprit avec lequel… ») est moins naturelle qu’une note ciblée sur le seul terme ambigu.
  terminology: « l’Esprit » est un choix contextuellement plausible, en continuité avec Actes 6.5, sans que le grec impose la majuscule. La note doit conserver explicitement l’alternative « l’esprit » sans reformuler inutilement le reste de la proposition.
