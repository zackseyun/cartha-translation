id: ACT.6.11
reference: Acts 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: fr
  text: 'Alors, ils poussèrent secrètement des hommes à dire[a] : « Nous l’avons entendu prononcer des paroles blasphématoires contre Moïse et contre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils incitèrent des hommes » ou « ils soudoyèrent des hommes ». Le verbe grec évoque une manœuvre secrète visant à les pousser à faire cette déclaration.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Connecteur temporel naturel qui marque l’étape suivante du récit.
- source_word: ὑπέβαλον
  choice: ils poussèrent secrètement
  rationale: Le verbe exprime ici une incitation menée en sous-main. Cette formulation conserve à la fois la causalité et le caractère clandestin de la manœuvre.
- source_word: ἄνδρας
  choice: des hommes
  rationale: ἀνήρ désigne ici des personnes de sexe masculin; « des hommes » préserve cette précision.
- source_word: λέγοντας
  choice: à dire
  rationale: L’infinitif français rend naturellement le participe qui indique ce que ces hommes furent incités à faire.
- source_word: Ἀκηκόαμεν
  choice: Nous l’avons entendu
  rationale: Le passé composé rend naturellement en français la valeur résultative du parfait grec dans ce témoignage rapporté.
- source_word: αὐτοῦ λαλοῦντος
  choice: l’avons entendu prononcer
  rationale: La construction avec ἀκούω est rendue idiomatiquement; « prononcer » convient à des paroles précises tout en gardant l’idée de parler.
- source_word: ῥήματα βλάσφημα
  choice: des paroles blasphématoires
  rationale: Rend directement le groupe grec et conserve la portée religieuse et juridique de l’accusation.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: contre Moïse et contre Dieu
  rationale: Dans ce contexte accusatoire, εἰς indique la cible de l’offense. La répétition de « contre » est naturelle en français et évite toute ambiguïté.
theological_decisions:
- issue: Nature de l’accusation portée contre Étienne
  choice: Présenter comme discours rapporté l’accusation selon laquelle il aurait prononcé « des paroles blasphématoires contre Moïse et contre Dieu », sans l’atténuer ni la valider.
  alternative: « des paroles injurieuses » ou « des calomnies » contre Moïse et Dieu
  rationale: « Blasphématoires » reflète βλάσφημα et maintient la force religieuse de l’accusation. Le cadre narratif et les guillemets montrent qu’il s’agit de ce que les hommes furent incités à déclarer, non d’un jugement du narrateur.
translation_notes:
  register: Français international moderne, clair et digne. « Poussèrent secrètement » est accessible tout en exprimant la manœuvre clandestine; la note conserve les principales nuances possibles du verbe grec.
