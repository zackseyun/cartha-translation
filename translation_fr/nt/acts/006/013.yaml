id: ACT.6.13
reference: Acts 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: fr
  text: 'Ils firent aussi comparaître de faux témoins[a], qui dirent : « Cet homme ne cesse[b] de tenir des propos[c] contre ce lieu saint[d] et contre la Loi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présentèrent de faux témoins ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’arrête pas ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de parler » ; littéralement « de dire des paroles ».
    reason: lexical_alternative
  - marker: d
    text: Littéralement « le lieu saint ». Dans ce contexte, cette expression désigne le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησάν
  choice: firent comparaître
  rationale: Dans ce cadre judiciaire, le verbe indique qu’on fait venir ou qu’on présente des témoins. « Firent comparaître » restitue naturellement cette mise en avant organisée sans ajouter une accusation absente du texte.
- source_word: τε
  choice: aussi
  rationale: La particule ajoute cette action à celles qui précèdent dans le récit.
- source_word: μάρτυρας ψευδεῖς
  choice: de faux témoins
  rationale: Expression juridique française courante qui conserve le caractère mensonger du témoignage.
- source_word: λέγοντας
  choice: qui dirent
  rationale: La proposition relative est naturelle en français et introduit clairement le contenu de leur témoignage.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: Cet homme
  rationale: Formulation directe qui convient au ton accusateur sans le rendre artificiellement méprisant.
- source_word: οὐ παύεται
  choice: ne cesse
  rationale: Cette tournure française actuelle conserve l’idée d’une action continuelle exprimée par le grec.
- source_word: λαλῶν ῥήματα
  choice: de tenir des propos
  rationale: « Tenir des propos » représente à la fois l’acte de parler et le nom ῥήματα, tout en évitant le littéralisme peu naturel « parler des paroles ».
- source_word: κατὰ
  choice: contre
  rationale: Dans cette accusation hostile, la préposition exprime nettement l’opposition envers le lieu saint et la Loi.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: ce lieu saint
  rationale: 'Le grec dit littéralement « le lieu saint », mais le contexte local donne naturellement une valeur déictique : il s’agit du temple de Jérusalem.'
- source_word: νόμου
  choice: la Loi
  rationale: Dans ce contexte juif lié à Moïse, le terme désigne la Loi mosaïque. La majuscule clarifie ce référent sans développer le texte.
theological_decisions:
- issue: Référence du « lieu saint » et de « la Loi »
  choice: L’accusation vise le temple de Jérusalem et la Loi mosaïque.
  alternative: Comprendre les expressions comme des références générales à un espace sacré et à une tradition juridique.
  rationale: Le contexte immédiat d’Actes 6 concerne le temple et Moïse. La traduction garde néanmoins les désignations du texte au lieu de les remplacer par une explicitation interprétative.
- issue: Intensité de l’accusation
  choice: Conserver la formulation « tenir des propos contre ».
  alternative: Employer un terme plus interprétatif comme « blasphémer » ou « calomnier ».
  rationale: Même si les témoins sont qualifiés de faux, le grec rapporte ici des paroles dirigées « contre » le lieu saint et la Loi sans employer lui-même un verbe plus fort.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire judiciaire reste perceptible sans archaïsme. « Tenir des propos contre » conserve le ton formel de l’accusation et représente l’expression grecque λαλῶν ῥήματα de manière idiomatique.
