  variant: modern international French
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: fr
  text: Ils soulevèrent alors le peuple, les anciens et les spécialistes de la Loi. Puis ils se précipitèrent sur Étienne, se saisirent de lui et l’amenèrent devant le Sanhédrin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Conseil ». Le mot grec désigne ici vraisemblablement le conseil dirigeant juif, appelé le Sanhédrin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: soulevèrent
  rationale: Le verbe exprime le fait de mettre collectivement en agitation et de pousser à réagir. « Soulevèrent » est naturel en français et conserve la force causative sans préciser indûment le degré de violence.
- source_word: τε
  choice: alors
  rationale: La particule assure ici une liaison narrative légère. « Alors » rend naturellement la progression du récit, sans lui donner une emphase excessive.
- source_word: τὸν λαὸν
  choice: le peuple
  rationale: Rendu direct de λαός, qui désigne ici la population, sans la réduire à une foule ponctuelle.
- source_word: τοὺς πρεσβυτέρους
  choice: les anciens
  rationale: Dans ce contexte judiciaire à Jérusalem, le terme désigne des responsables reconnus du peuple, et non simplement des hommes âgés.
- source_word: τοὺς γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Le terme désigne les experts des Écritures et de la loi juive. Cette formulation moderne communique leur fonction plus clairement que le terme historique « scribes » pour de nombreux lecteurs.
- source_word: ἐπιστάντες
  choice: ils survinrent
  rationale: Le participe suggère une arrivée soudaine et menaçante. « Survinrent » en préserve la soudaineté sans ajouter explicitement une confrontation absente du grec.
- source_word: συνήρπασαν
  choice: se saisirent de
  rationale: Le verbe indique une prise énergique et coercitive. « Se saisirent de » convient au registre narratif et judiciaire.
- source_word: αὐτὸν
  choice: d’Étienne
  rationale: La reprise explicite du nom est naturelle en français et lève toute hésitation sur le référent sans ajouter d’information au récit.
- source_word: ἤγαγον
  choice: amenèrent
  rationale: Le verbe exprime le déplacement imposé vers l’autorité judiciaire. « Amenèrent » reste neutre sur les modalités, déjà indiquées par le verbe précédent.
- source_word: εἰς τὸ συνέδριον
  choice: devant le Sanhédrin
  rationale: Dans ce contexte, συνέδριον désigne vraisemblablement le conseil dirigeant juif. Avec une institution judiciaire, « devant » exprime idiomatiquement la comparution visée par le mouvement.
theological_decisions:
- issue: Identification de συνέδριον
  choice: le Sanhédrin
  alternative: le Conseil
  rationale: Le cadre hiérosolymitain et la présence des anciens et des spécialistes de la Loi indiquent le conseil dirigeant juif. Le terme historique conserve la précision institutionnelle, tandis qu’une note signale la traduction générique possible.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est divisée en deux phrases pour éviter une coordination lourde. « Spécialistes de la Loi » privilégie la compréhension fonctionnelle; « Sanhédrin » conserve la précision historique et reçoit une note explicative.
