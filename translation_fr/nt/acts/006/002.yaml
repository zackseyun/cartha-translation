id: ACT.6.2
reference: Acts 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: fr
  text: 'Alors les Douze convoquèrent l’ensemble des disciples[a] et dirent : « Il ne convient pas que nous délaissions la parole de Dieu pour servir aux tables[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la multitude des disciples » ou « tous les disciples réunis ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire assurer le service pratique lié à la distribution des repas et des ressources de la communauté.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: convoquèrent
  rationale: Le participe aoriste moyen introduit l’action principale et exprime le fait de réunir les disciples; « convoquèrent » est naturel et digne en français.
- source_word: δὲ
  choice: Alors
  rationale: Ici, δέ fait progresser le récit en présentant la réaction des Douze à la situation précédente, sans marquer une forte opposition.
- source_word: οἱ δώδεκα
  choice: les Douze
  rationale: Cette désignation établie reprend directement le grec sans ajouter « apôtres », absent du texte.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: l’ensemble des disciples
  rationale: πλῆθος désigne ici le corps collectif ou l’assemblée des disciples. « L’ensemble » est clair et actuel tout en préservant la portée collective.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: Il ne convient pas
  rationale: Dans ce contexte, ἀρεστόν exprime ce qui est convenable ou approprié. Cette formulation présente une question de responsabilité sans déprécier le service pratique.
- source_word: ἡμᾶς καταλείψαντας
  choice: que nous délaissions
  rationale: καταλείπω signifie laisser derrière soi ou délaisser. « Délaisser » conserve la gravité du choix sans suggérer nécessairement un abandon définitif.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Formulation française consacrée et transparente qui conserve la portée théologique de λόγος ainsi que son sens contextuel de message proclamé et enseigné.
- source_word: διακονεῖν
  choice: servir
  rationale: Le verbe désigne un service concret. « Servir » est simple et évite d’introduire un sens ecclésiastique ultérieur.
- source_word: τραπέζαις
  choice: aux tables
  rationale: Le grec dit littéralement « tables ». La formulation conserve cette image et laisse le contexte indiquer qu’il s’agit du service ou de la gestion de la distribution communautaire.
theological_decisions:
- issue: Priorité apostolique et valeur du service pratique
  choice: 'Présenter la déclaration comme une question de responsabilité appropriée : « Il ne convient pas que nous délaissions la parole de Dieu pour servir aux tables. »'
  alternative: « Il n’est pas juste pour nous… » ou « Il ne nous est pas agréable… »
  rationale: Le propos distingue des responsabilités sans affirmer que le service matériel aurait une dignité spirituelle moindre. « Il ne convient pas » préserve cette tension et le sens contextuel de ἀρεστόν.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec sans être raide. « Les Douze » et « la parole de Dieu » conservent les formulations bibliques reconnues; « servir aux tables » maintient l’image concrète du texte source, explicitée en note.
