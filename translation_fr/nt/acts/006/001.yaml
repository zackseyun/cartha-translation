id: ACT.6.1
reference: Acts 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: fr
  text: En ces jours-là, comme le nombre des disciples augmentait, une plainte s’éleva de la part des Hellénistes contre les Hébreux[a], parce que leurs veuves étaient laissées de côté lors du service quotidien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « Hellénistes » étaient probablement des Juifs de langue grecque, par contraste avec les « Hébreux », probablement des Juifs de langue araméenne ou hébraïque.
    reason: Note culturelle expliquant les deux désignations sans remplacer les termes historiques du texte.
  - marker: b
    text: 'Ou : « étaient négligées lors de la distribution quotidienne ».'
    reason: Signale les autres nuances possibles de παρεθεωροῦντο et de διακονία dans ce contexte.
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: En ces jours-là
  rationale: Rend naturellement le cadre temporel; la légère transition narrative portée par δέ n’exige pas un connecteur français explicite.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: comme le nombre des disciples augmentait
  rationale: Le génitif absolu fournit la circonstance d’arrière-plan; cette formulation française exprime clairement la croissance numérique.
- source_word: ἐγένετο γογγυσμὸς
  choice: se mirent à protester
  rationale: Exprime l’apparition d’un mécontentement formulé en plainte, dans un français courant, sans réduire γογγυσμός à une simple remarque.
- source_word: τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους
  choice: les Hellénistes se mirent à protester contre les Hébreux
  rationale: Conserve les désignations historiques parallèles et rend πρός comme la cible adverse de la plainte.
- source_word: παρεθεωροῦντο
  choice: étaient laissées de côté
  rationale: L’imparfait passif décrit une situation persistante; cette expression n’impose pas l’idée d’une exclusion intentionnelle.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: lors du service quotidien
  rationale: διακονία désigne ici un service régulier envers les veuves. « Service » préserve mieux que « distribution » l’étendue lexicale du terme, tandis qu’une note indique l’interprétation contextuelle possible.
- source_word: αἱ χῆραι αὐτῶν
  choice: leurs veuves
  rationale: Le possessif renvoie naturellement aux Hellénistes et conserve la structure du grief.
theological_decisions:
- issue: Identification des Ἑλληνισταί et des Ἑβραῖοι
  choice: Conserver « Hellénistes » et « Hébreux » dans le texte, avec une note explicative.
  alternative: « Juifs de langue grecque » et « Juifs de langue araméenne ou hébraïque »
  rationale: Les termes grecs sont des désignations historiques dont la portée exacte ne doit pas être entièrement fixée dans le corps du texte; la note fournit l’identification linguistique et culturelle probable.
- issue: Portée de διακονία dans le contexte
  choice: « service quotidien »
  alternative: « distribution quotidienne » ou « ministère quotidien »
  rationale: « Service » conserve l’amplitude du grec, tandis que le contexte rend probable un service comportant une distribution matérielle.
translation_notes:
  register: Français international moderne, naturel et digne. Les termes historiques « Hellénistes » et « Hébreux » sont maintenus, mais expliqués. « Laissées de côté » évite d’attribuer explicitement une intention, et « service quotidien » préserve l’ambiguïté lexicale de διακονία.
