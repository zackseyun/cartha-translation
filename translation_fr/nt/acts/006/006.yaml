id: ACT.6.6
reference: Acts 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: fr
  text: Ils les présentèrent aux apôtres[a] et, après avoir prié, ils leur imposèrent les mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils les placèrent devant les apôtres. »'
    reason: lexical_alternative
  - marker: b
    text: L’imposition des mains peut exprimer une bénédiction ou une mission confiée publiquement ; ici, le grec nomme le geste sans en définir plus précisément la portée ecclésiale.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: les
  rationale: Le pronom relatif masculin pluriel renvoie aux sept hommes du verset précédent. En français, « les » reprend naturellement ce groupe sans répétition explicative.
- source_word: ἔστησαν
  choice: présentèrent
  rationale: Dans cette construction causative avec ἐνώπιον, le verbe exprime le fait de placer des personnes devant quelqu’un, donc de les lui présenter. « Présentèrent » est naturel et précis en français moderne.
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: aux apôtres
  rationale: « Présenter quelqu’un à quelqu’un » rend idiomatiquement en français l’idée de le placer en présence des apôtres. Une formulation plus littérale est signalée en note.
- source_word: προσευξάμενοι
  choice: après avoir prié
  rationale: Le participe aoriste indique naturellement une action antérieure à l’imposition des mains. Cette formulation rend clairement la succession des actions.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: ils leur imposèrent les mains
  rationale: « Imposer les mains à quelqu’un » est l’expression française consacrée et fidèle au geste décrit, sans en préciser davantage la portée ecclésiale.
theological_decisions:
- issue: Portée de l’imposition des mains
  choice: Le geste est décrit par « imposèrent les mains », sans être défini comme une ordination, une consécration ou une transmission particulière.
  alternative: « Ils les ordonnèrent » ou « ils les établirent dans leur charge »
  rationale: Le grec nomme le geste rituel, mais n’en explicite pas ici toute la signification ecclésiale. La traduction évite donc d’imposer une interprétation confessionnelle.
- issue: Identité du sujet de la prière et de l’imposition des mains
  choice: Le pronom « ils » est conservé sans ajout explicatif dans le texte.
  alternative: « Les apôtres, après avoir prié, leur imposèrent les mains »
  rationale: Le contexte conduit naturellement à comprendre que les apôtres accomplissent le geste, mais le grec laisse le sujet sous-entendu. Ne pas le nommer explicitement préserve la forme et une légère ambiguïté du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en employant les tournures françaises naturelles « présenter à » et « imposer les mains à ». Le second « ils » ne nomme pas expressément les apôtres, afin de ne pas rendre explicite ce que le grec laisse sous-entendu.
