id: ACT.6.15
reference: Acts 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: fr
  text: Alors, tous ceux qui étaient assis au Conseil[a], après avoir fixé les yeux sur lui, virent son visage, qui était comme celui d’un ange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Sanhédrin ». Le mot grec désigne ici le conseil dirigeant juif.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: fixèrent les yeux sur lui
  rationale: Le participe exprime un regard soutenu et attentif. Cette tournure française restitue naturellement son intensité.
- source_word: πάντες οἱ καθεζόμενοι
  choice: tous ceux qui siégeaient
  rationale: « Tous ceux » conserve la totalité exprimée par πάντες, et « siégeaient » convient à des membres réunis en conseil tout en décrivant leur position dans la scène.
- source_word: συνεδρίῳ
  choice: Conseil
  rationale: Le terme désigne ici l’instance dirigeante juive devant laquelle Étienne comparaît. « Conseil » traduit le nom de manière claire; l’appellation « Sanhédrin » est signalée en note.
- source_word: πρόσωπον
  choice: visage
  rationale: Dans ce contexte, le mot désigne directement le visage visible d’Étienne; « visage » est le terme français courant et précis.
- source_word: ὡσεὶ
  choice: comme
  rationale: Le mot introduit une comparaison sans en préciser la nature exacte. « Comme » préserve cette simplicité et cette ouverture.
- source_word: ἀγγέλου
  choice: un ange
  rationale: Dans ce contexte, le sens surnaturel d’ἄγγελος est le plus probable; « ange » est donc préférable à « messager ».
theological_decisions:
- issue: Nature de la ressemblance exprimée par « comme celui d’un ange »
  choice: Une comparaison entre l’apparence du visage d’Étienne et celle d’un ange, sans préciser la qualité exacte de cette ressemblance.
  alternative: Une référence particulière à un visage rayonnant, à une innocence sereine ou à une autorité céleste.
  rationale: Le grec affirme la ressemblance, mais ne dit pas si elle tient à l’éclat, à la sérénité, à la majesté ou à plusieurs de ces traits. La traduction conserve cette indétermination.
translation_notes:
  register: Français international moderne, naturel et digne. « Siégeaient au Conseil » convient au cadre judiciaire sans alourdir la phrase; « était comme celui d’un ange » explicite naturellement en français que la comparaison porte sur le visage.
