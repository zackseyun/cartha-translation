id: ACT.6.4
reference: Acts 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: fr
  text: Quant à nous, nous nous consacrerons à la prière et au service de la Parole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ministère de la Parole ». Le terme grec peut signifier « service » ou « ministère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom explicite est emphatique et marque le contraste. La tournure « Quant à nous » rend cette mise en relief naturellement en français.
- source_word: δὲ
  choice: Quant à
  rationale: Dans le contexte, la particule introduit un contraste avec la tâche confiée à d’autres au sujet du service des tables. « Quant à nous » restitue à la fois le contraste et le thème.
- source_word: τῇ προσευχῇ
  choice: à la prière
  rationale: Le datif dépend de προσκαρτερέω et désigne ce à quoi l’on s’attache avec persévérance. « Se consacrer à la prière » est idiomatique et fidèle.
- source_word: διακονίᾳ
  choice: service
  rationale: Le mot grec désigne un service ou un ministère. « Service » conserve clairement le lien lexical et conceptuel avec le service mentionné dans le contexte, sans suggérer à tort une distinction institutionnelle rigide.
- source_word: τοῦ λόγου
  choice: de la Parole
  rationale: Dans les Actes, λόγος désigne ici la parole ou le message proclamé. La majuscule éditoriale aide à signaler qu’il s’agit de la parole de Dieu, sans identifier le terme à une personne.
- source_word: προσκαρτερήσομεν
  choice: nous nous consacrerons
  rationale: Le futur exprime un engagement persévérant et durable. « Se consacrer » est naturel en français moderne et rend mieux cette continuité que le simple verbe « continuer ».
theological_decisions:
- issue: Sens de διακονία dans son rapport avec le service des tables
  choice: service de la Parole
  alternative: ministère de la Parole
  rationale: « Service » préserve le champ sémantique commun aux deux tâches évoquées dans le passage et évite d’importer une opposition clergé-laïcs absente du grec. Une note conserve l’autre traduction courante.
- issue: Référent de λόγος
  choice: la Parole
  alternative: le message
  rationale: La formulation traditionnelle et intelligible « la Parole » maintient l’idiome chrétien ancien tout en laissant le contexte préciser qu’il s’agit de la parole proclamée, sans développer davantage le référent.
translation_notes:
  register: 'Français international moderne, naturel et digne. La reprise « Quant à nous, nous… » est volontaire : elle rend l’emphase du pronom grec explicite et le contraste contextuel. « Parole » prend ici une majuscule éditoriale pour désigner la parole de Dieu proclamée.'
