revisions:
- from: La parole de Dieu continuait de croître, et le nombre des disciples se multipliait considérablement à Jérusalem. Une foule nombreuse de prêtres se mettait aussi à obéir à la foi[a].
  to: La parole de Dieu continuait de croître, et le nombre des disciples se multipliait considérablement à Jérusalem. Un grand nombre de prêtres obéissaient aussi à la foi[a].
  rationale: La révision remplace le collectif singulier par une expression quantitative suivie du pluriel, conformément à ὑπήκουον et à une tournure française plus directe. Elle évite aussi de présenter l’aspect ingressif de « se mettre à » comme le seul sens de l’imparfait. La note est corrigée pour l’accord, tout en conservant l’alternative et l’ambiguïté sémantique.
