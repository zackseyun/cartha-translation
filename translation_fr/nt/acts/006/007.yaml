source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: fr
  text: La parole de Dieu continuait de croître, et le nombre des disciples se multipliait considérablement à Jérusalem. Un grand nombre de prêtres obéissaient aussi à la foi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « obéissaient à la foi » ou « devenaient obéissants à la foi ». L’expression grecque peut désigner l’obéissance au message chrétien, et non pas seulement un acte intérieur de confiance.'
    reason: Alternative lexicale et préservation de l’ambiguïté de ὑπήκουον τῇ πίστει.
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette formulation transparente conserve l’expression biblique et laisse λόγος désigner la parole proclamée, sans la réduire explicitement au « message » ou à « l’Évangile ».
- source_word: ηὔξανεν
  choice: continuait de croître
  rationale: L’imparfait grec exprime un développement en cours. « Croître » conserve l’image du texte source, tandis que « continuait de » en rend l’aspect progressif.
- source_word: ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν
  choice: le nombre des disciples se multipliait
  rationale: La traduction maintient le terme lucanien « disciples » et distingue ἐπληθύνετο de ηὔξανεν, tout en exprimant l’accroissement continu marqué par l’imparfait.
- source_word: ἐν Ἰερουσαλὴμ σφόδρα
  choice: considérablement à Jérusalem
  rationale: « Considérablement » rend naturellement l’intensité de σφόδρα et « à Jérusalem » le complément de lieu.
- source_word: πολύς τε ὄχλος τῶν ἱερέων
  choice: une foule nombreuse de prêtres… aussi
  rationale: « Foule nombreuse » préserve le caractère collectif de ὄχλος. « Aussi » représente la liaison τε avec le développement précédent.
- source_word: ὑπήκουον
  choice: se mettait à obéir
  rationale: Cette formulation naturelle rend le processus en cours suggéré par l’imparfait dans ce contexte, sans réduire l’idée à une simple adhésion intellectuelle.
- source_word: τῇ πίστει
  choice: à la foi
  rationale: L’article et la construction avec ὑπακούω favorisent ici le sens objectif de la foi comme contenu cru et message reçu. La formulation reste proche du grec sans expliciter « foi chrétienne » dans le texte.
theological_decisions:
- issue: Sens de πίστις dans l’expression τῇ πίστει
  choice: à la foi
  alternative: à la foi chrétienne ; à la foi comprise comme confiance
  rationale: « La foi » conserve le sens objectif probablement visé — le message ou la confession auxquels les prêtres obéissent — tout en évitant d’exclure entièrement la dimension personnelle de confiance.
- issue: Valeur de ὑπήκουον
  choice: se mettait à obéir
  alternative: obéissait ; devenait obéissante
  rationale: L’imparfait peut décrire une obéissance en cours ou l’entrée progressive dans cette obéissance. Le contexte de croissance de la communauté favorise la tournure ingressivo-progressive, tandis que la note conserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement cumulatif du grec, tout en séparant les deux propositions par un point pour assurer une lecture naturelle. Les images de croissance et de multiplication sont maintenues.
