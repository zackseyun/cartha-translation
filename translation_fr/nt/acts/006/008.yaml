  text: Στέφανος δὲ πλήρης ⸀χάριτος καὶ δυνάμεως ἐποίει τέρατα καὶ σημεῖα μεγάλα ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/008.yaml
  text: Stephen[a], full of grace and power, was doing great wonders and signs among the people.
translation:
  language: fr
  text: Étienne[a], plein de grâce et de puissance, accomplissait de grands prodiges et de grands signes parmi le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « plein de foi et de puissance » au lieu de « plein de grâce et de puissance ».
    reason: textual_variant
lexical_decisions:
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Particule de liaison légère qui fait avancer le récit; le français n’exige pas ici de connecteur explicite, et « maintenant » introduirait à tort une valeur temporelle.
- source_word: πλήρης χάριτος καὶ δυνάμεως
  choice: plein de grâce et de puissance
  rationale: La construction avec les génitifs décrit Étienne comme caractérisé ou rempli par ces réalités. « Grâce » préserve la portée de χάρις, et « puissance » convient au contexte des actes miraculeux.
- source_word: ἐποίει
  choice: accomplissait
  rationale: L’imparfait grec présente une activité en cours ou habituelle. L’imparfait français en conserve naturellement l’aspect; « accomplissait » est idiomatique pour des prodiges et des signes.
- source_word: τέρατα καὶ σημεῖα μεγάλα
  choice: de grands prodiges et de grands signes
  rationale: « Prodiges » exprime l’effet saisissant de τέρατα, tandis que « signes » conserve la fonction signifiante de σημεῖα. La répétition de « grands » évite toute ambiguïté sur sa portée envers les deux noms.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: La préposition indique ici le milieu humain au sein duquel ces actes avaient lieu; « parmi le peuple » est naturel et fidèle.
theological_decisions:
- issue: Variante textuelle χάριτος / πίστεως
  choice: grâce
  alternative: foi
  rationale: Le texte grec fourni, le SBLGNT, porte χάριτος (« grâce »). La variante πίστεως (« foi »), significative pour l’interprétation, est signalée en note sans remplacer le texte source retenu.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le couple lucanien « prodiges et signes » et rend l’action durative par l’imparfait.
