id: ACT.6.9
reference: Acts 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: fr
  text: Mais quelques-uns de la synagogue dite des Affranchis, des Cyrénéens et des Alexandrins, ainsi que de ceux originaires de Cilicie et d’Asie[b], se levèrent et se mirent à débattre avec Étienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ici, « Asie » désigne la province romaine située dans l’ouest de l’Asie Mineure, et non le continent asiatique au sens moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: se levèrent
  rationale: Le verbe exprime concrètement le fait de se lever et introduit ici une prise de position hostile, sans qu’il soit nécessaire d’expliciter davantage cette opposition.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque le tournant narratif entre le ministère d’Étienne et l’opposition qui se manifeste.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: quelques membres de la synagogue
  rationale: Cette formulation française naturelle restitue le génitif partitif et indique clairement leur appartenance au groupe.
- source_word: τῆς λεγομένης
  choice: appelée
  rationale: Le participe introduit simplement la désignation sous laquelle la synagogue était connue.
- source_word: Λιβερτίνων
  choice: des Affranchis
  rationale: Le terme désigne des personnes affranchies, probablement d’anciens esclaves ou leurs descendants. « Affranchis » évite le sens moderne trompeur de « libertins ».
- source_word: Κυρηναίων καὶ Ἀλεξανδρέων
  choice: des Cyrénéens et des Alexandrins
  rationale: Ces gentilés désignent naturellement les personnes originaires de Cyrène et d’Alexandrie.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: des gens originaires de Cilicie et d’Asie
  rationale: La préposition ἀπό indique l’origine géographique; « gens originaires de » est clair et idiomatique en français.
- source_word: συζητοῦντες
  choice: se mirent à discuter avec
  rationale: Dans ce contexte, le verbe décrit une discussion contradictoire. La tournure ingressive rend naturellement le participe associé à « se levèrent », tout en évitant de suraccentuer la violence de l’échange.
- source_word: τῷ Στεφάνῳ
  choice: avec Étienne
  rationale: Le datif régi par συζητέω désigne l’interlocuteur; « avec Étienne » est la construction française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La longue énumération grecque est conservée sans trancher la question syntaxique de savoir s’il s’agit d’une seule synagogue regroupant ces communautés ou de groupes plus distincts. « Discuter » reçoit son sens conflictuel du contexte, sans transformer explicitement l’échange en querelle.
