  source_fidelity: Le sens général est bien rendu, y compris le mouvement d’opposition introduit par « Mais » et « se levèrent ». Toutefois, « ainsi que » et la répétition « synagogue appelée synagogue » alourdissent et réorganisent légèrement l’énumération grecque. Le présent participe συζητοῦντες décrit ici une controverse; « débattre » le rend plus justement que « discuter », qui peut évoquer un échange neutre.
  naturalness: Le français est globalement accessible, mais « la synagogue appelée synagogue des Affranchis » est redondant. Une construction avec « dite » permet de conserver l’énumération dense sans imposer une solution à la syntaxe débattue du grec.
  terminology: « Affranchis », « Cyrénéens », « Alexandrins », « Cilicie », « Asie » et « Étienne » sont appropriés. La note sur l’Asie romaine est utile. La note sur les Affranchis doit conserver le caractère probable de l’explication historique.
