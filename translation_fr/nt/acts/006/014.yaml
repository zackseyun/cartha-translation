id: ACT.6.14
reference: Acts 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: fr
  text: 'Car nous l’avons entendu dire : « Ce Jésus, le Nazaréen[a], détruira ce lieu[b] et changera les coutumes que Moïse nous a transmises[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce Jésus de Nazareth ».'
    reason: lexical_alternative
  - marker: b
    text: « Ce lieu » désigne ici le temple.
    reason: cultural_note
  - marker: c
    text: 'Ou : « les traditions que Moïse nous a remises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: nous l’avons entendu
  rationale: Le parfait exprime une audition passée dont les accusateurs invoquent encore le témoignage; le passé composé est naturel en français dans cette accusation.
- source_word: γὰρ
  choice: Car
  rationale: Conserve la valeur explicative qui rattache cette déclaration à l’accusation précédente.
- source_word: αὐτοῦ λέγοντος
  choice: l’avons entendu dire
  rationale: Cette tournure française rend naturellement la construction avec ἀκούω et le participe, en présentant les accusateurs comme témoins directs des paroles.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: Ce Jésus, le Nazaréen
  rationale: « Ce » maintient l’insistance démonstrative, possiblement hostile, tandis que « le Nazaréen » conserve la désignation grecque sans la réduire d’emblée à une simple indication géographique.
- source_word: καταλύσει
  choice: détruira
  rationale: Dans le contexte de « ce lieu », c’est-à-dire le temple, le verbe désigne sa destruction ou sa démolition; « détruira » est clair et direct.
- source_word: τὸν τόπον τοῦτον
  choice: ce lieu
  rationale: Rend littéralement l’expression grecque et laisse implicite dans le texte principal son référent contextuel, le temple.
- source_word: ἀλλάξει
  choice: changera
  rationale: Équivalent direct, naturel et non interprétatif du futur de ἀλλάσσω.
- source_word: τὰ ἔθη
  choice: les coutumes
  rationale: Le terme vise des pratiques et usages reçus par la communauté; « coutumes » évite de donner à « traditions » un sens technique non imposé par le contexte.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: que Moïse nous a transmises
  rationale: « Transmises » exprime le passage d’un héritage religieux reçu; l’accord au féminin pluriel renvoie à « coutumes ».
theological_decisions:
- issue: Référent de « ce lieu »
  choice: Maintien de « ce lieu » dans le texte principal
  alternative: « ce temple » ou « ce sanctuaire »
  rationale: Le grec dit littéralement « ce lieu ». Même si le temple est clairement visé dans le contexte, ne pas l’expliciter dans le corps du verset préserve la formulation de l’accusation.
- issue: Tonalité de la désignation de Jésus
  choice: « Ce Jésus, le Nazaréen »
  alternative: « Jésus de Nazareth » ou « ce Jésus de Nazareth »
  rationale: Le démonstratif est conservé afin de ne pas effacer l’insistance potentiellement méprisante des accusateurs; « le Nazaréen » maintient également la forme désignative de l’original.
- issue: Nature des pratiques mosaïques
  choice: « les coutumes que Moïse nous a transmises »
  alternative: « les traditions que Moïse nous a remises »
  rationale: « Coutumes » rend les usages religieux et communautaires sans trancher leur statut théologique ni introduire une opposition confessionnelle entre loi et tradition.
translation_notes:
  register: Français international moderne, digne et accessible. La citation directe rend clairement l’accusation rapportée. Le passé composé convient au témoignage invoqué dans le présent, et les formulations littérales importantes (« ce lieu », « ce Jésus ») sont préservées sans lourdeur.
