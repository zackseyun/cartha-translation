id: ACT.6.3
reference: Acts 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: fr
  text: Choisissez donc parmi vous, frères[a], sept hommes qui ont bonne réputation, pleins de l’Esprit et de sagesse[b], et nous les établirons pour cette responsabilité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « frères » est masculin; ici, l’appel peut s’adresser plus largement à l’ensemble de la communauté croyante.
    reason: cultural_note
  - marker: b
    text: Ou « pleins de l’Esprit Saint et de sagesse ». Le grec dit « de l’Esprit et de sagesse » et ne porte pas explicitement « Saint ».
    reason: alternative_reading
  - marker: c
    text: « Cette responsabilité » désigne l’affaire pratique de la distribution quotidienne mentionnée dans le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: Choisissez
  rationale: L’impératif demande à la communauté de repérer puis de choisir les hommes qualifiés; « choisissez » exprime naturellement cette action en français.
- source_word: δέ
  choice: donc
  rationale: Dans le contexte, la particule introduit la conséquence pratique de la proposition des apôtres. « Donc » rend cette progression sans imposer une opposition forte.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif grec est grammaticalement masculin. Le français « frères » le conserve, tandis qu’une note signale que l’appel peut viser l’ensemble de la communauté croyante.
- source_word: ἄνδρας ἐξ ὑμῶν
  choice: parmi vous ... sept hommes
  rationale: ἄνδρας désigne ici des hommes adultes, et ἐξ ὑμῶν indique qu’ils doivent être choisis au sein même de la communauté.
- source_word: μαρτυρουμένους
  choice: dont on rende un bon témoignage
  rationale: Cette formulation conserve la nuance testimoniale du participe grec, plutôt que de la réduire à la seule notion abstraite de réputation.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: pleins de l’Esprit et de sagesse
  rationale: La formulation garde le parallélisme grec. La majuscule signale le référent divin probable dans Luc–Actes sans ajouter explicitement « Saint », absent du texte grec.
- source_word: καταστήσομεν
  choice: nous les chargerons
  rationale: Le verbe exprime la désignation à une responsabilité. « Charger de » est idiomatique avec « tâche » et communique l’attribution officielle sans lourdeur.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: de cette tâche
  rationale: Dans le contexte, χρεία désigne l’affaire pratique à prendre en charge, à savoir la distribution quotidienne évoquée auparavant.
theological_decisions:
- issue: Le référent de πνεύματος
  choice: l’Esprit
  alternative: l’esprit; l’Esprit Saint
  rationale: Dans Luc–Actes, le contexte d’une qualification et d’une capacité accordée par Dieu favorise une référence à l’Esprit de Dieu. Cependant, puisque ἁγίου n’est pas présent, le texte principal n’ajoute pas « Saint ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est légèrement réorganisée pour la fluidité, tout en conservant le choix communautaire, les sept hommes, leur attestation favorable, leur qualification spirituelle et la désignation par les apôtres.
