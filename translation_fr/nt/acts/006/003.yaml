- from: Choisissez donc parmi vous, frères[a], sept hommes dont on rende un bon témoignage, pleins de l’Esprit et de sagesse[b], et nous les chargerons de cette tâche[c].
  to: Choisissez donc parmi vous, frères[a], sept hommes qui ont bonne réputation, pleins de l’Esprit et de sagesse[b], et nous les établirons pour cette responsabilité[c].
  rationale: La révision remplace deux formulations moins naturelles ou moins précises par des expressions françaises courantes qui préservent l'attestation favorable des hommes et leur établissement officiel pour une responsabilité. Les ancres de notes sont conservées et la note sur l'Esprit est rendue moins ambiguë en français.
