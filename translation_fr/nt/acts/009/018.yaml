id: ACT.9.18
reference: Acts 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: fr
  text: Et aussitôt, comme des écailles tombèrent de ses yeux[a]. Il retrouva la vue, puis il se leva et fut baptisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « des écailles tombèrent de ses yeux ». Le grec introduit une comparaison : il décrit ce que cela semblait être, sans affirmer qu’il s’agissait littéralement d’écailles.'
    reason: Alternative lexicale préservant la portée comparative de ὡς.
lexical_decisions:
- source_word: εὐθέως
  choice: aussitôt
  rationale: Exprime clairement et naturellement l’immédiateté de l’événement dans un récit moderne.
- source_word: ἀπέπεσαν
  choice: tomba
  rationale: Le verbe ἀποπίπτω indique que quelque chose tombe en se détachant; en français, la provenance est naturellement exprimée par « de ses yeux ».
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: de ses yeux
  rationale: Rend idiomatiquement le possessif et ἀπό avec l’idée de séparation.
- source_word: ὡς λεπίδες
  choice: quelque chose comme des écailles
  rationale: Préserve l’image concrète de λεπίδες tout en faisant entendre que ὡς introduit une comparaison, sans affirmer qu’il s’agissait littéralement d’écailles.
- source_word: ἀνέβλεψεν
  choice: Il retrouva la vue
  rationale: Dans ce contexte de guérison après la cécité, ἀναβλέπω signifie recouvrer la vue plutôt que simplement lever les yeux.
- source_word: τε καὶ
  choice: puis
  rationale: Marque naturellement en français l’enchaînement des actions liées par les particules grecques.
- source_word: ἀναστάς
  choice: il se leva
  rationale: Rend simplement et dignement le participe aoriste qui introduit l’action suivante.
- source_word: ἐβαπτίσθη
  choice: fut baptisé
  rationale: Rend fidèlement le passif de βαπτίζω sans préciser un mode de baptême que le verset ne formule pas.
theological_decisions:
- issue: Rendre βαπτίζω sans imposer un mode baptismal particulier
  choice: fut baptisé
  alternative: fut immergé
  rationale: Le texte rapporte le baptême sans en préciser ici le mode. Le terme français traditionnel et transparent évite une surinterprétation confessionnelle.
- issue: Nature de ce qui tombe des yeux
  choice: quelque chose comme des écailles
  alternative: des écailles tombèrent de ses yeux
  rationale: La comparaison introduite par ὡς décrit l’apparence sans identifier nécessairement la matière comme de véritables écailles.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque; la formulation évite toute précision confessionnelle étrangère au texte.
