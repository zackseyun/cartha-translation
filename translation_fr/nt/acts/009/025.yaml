id: ACT.9.25
reference: Acts 9:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: fr
  text: Mais ses disciples le prirent de nuit et le descendirent à travers la muraille dans une grande corbeille[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par une ouverture dans la muraille ». Le grec dit littéralement « à travers la muraille », ce qui désigne probablement une ouverture ou une fenêtre aménagée dans celle-ci.'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie deux expressions de sens voisin pour décrire la descente, construction vivante qui souligne la manière dont il s’est échappé.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: le prirent
  rationale: Le participe aoriste introduit l’action des disciples qui prennent Saul avec eux pour organiser sa fuite; cette formulation reste concrète et naturelle.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici la transition et le contraste entre le complot précédent et l’intervention des disciples.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Cette traduction représente explicitement le possessif αὐτοῦ et conserve le terme habituel pour μαθηταί.
- source_word: νυκτός
  choice: de nuit
  rationale: Le génitif temporel est rendu par une expression française concise, naturelle et légèrement soutenue.
- source_word: διὰ τοῦ τείχους
  choice: à travers la muraille
  rationale: διά avec le génitif exprime le passage à travers. « Muraille » convient au contexte urbain sans ajouter au texte le mot « ville » ni une ouverture explicitement absente du grec.
- source_word: καθῆκαν αὐτόν
  choice: le descendirent
  rationale: καθίημι désigne ici l’action de faire descendre quelqu’un depuis une hauteur.
- source_word: χαλάσαντες
  choice: le descendirent … dans
  rationale: Le participe précise le moyen de la descente. Une seule expression verbale en français évite une répétition lourde, tandis qu’une note signale la double formulation grecque.
- source_word: ἐν σπυρίδι
  choice: dans une grande corbeille
  rationale: σπυρίς désigne une corbeille, vraisemblablement de grande taille; l’adjectif explicite la capacité nécessaire pour transporter un homme et distingue ce terme d’autres mots grecs pour « panier ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Muraille » est plus précis que « mur » pour l’enceinte urbaine; « grande corbeille » demeure clair pour un lectorat général. La redondance verbale du grec est expliquée en note plutôt que reproduite maladroitement dans le corps du verset.
