source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: fr
  text: 'Mais Pierre fit sortir tout le monde, se mit à genoux et pria. Puis il se tourna vers le corps et dit : « Tabitha, lève-toi[a]. » Elle ouvrit les yeux et, quand elle vit Pierre, elle se redressa et s’assit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « relève-toi ».'
    reason: L’impératif grec ἀνάστηθι permet les deux formulations ; « lève-toi » est plus naturel ici tout en conservant la résonance du relèvement.
lexical_decisions:
- source_word: ἐκβαλὼν ἔξω πάντας
  choice: fit sortir tout le monde
  rationale: Rend clairement l’éloignement de toutes les personnes présentes sans suggérer la violence que pourrait impliquer « chassa ».
- source_word: θεὶς τὰ γόνατα
  choice: se mit à genoux
  rationale: Équivalent idiomatique français de l’expression grecque désignant l’action de s’agenouiller.
- source_word: προσηύξατο
  choice: pria
  rationale: Traduction directe et naturelle du verbe προσεύχομαι dans ce contexte.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: il se tourna vers le corps
  rationale: Conserve à la fois le mouvement physique exprimé par ἐπιστρέφω et le terme neutre σῶμα, sans le renforcer en « cadavre ».
- source_word: Ταβιθά
  choice: Tabitha
  rationale: Translittération française usuelle du nom propre araméen transmis par le grec.
- source_word: ἀνάστηθι
  choice: lève-toi
  rationale: Formulation française actuelle et digne qui peut désigner le fait de se lever tout en gardant, dans ce contexte, sa résonance de retour à la vie.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: Elle ouvrit les yeux
  rationale: Rendu direct de l’expression grecque, naturel en français.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: quand elle vit Pierre
  rationale: La proposition temporelle restitue naturellement en français la valeur circonstancielle du participe et la succession des actions.
- source_word: ἀνεκάθισεν
  choice: elle se redressa en position assise
  rationale: Le verbe désigne le fait de se redresser pour s’asseoir depuis une position allongée; cette formulation évite de laisser entendre qu’elle s’est mise debout.
- source_word: δὲ … καὶ
  choice: Mais … Puis … et
  rationale: Ces articulations françaises rendent le développement narratif sans imposer à δέ un contraste plus fort que le contexte.
theological_decisions:
- issue: Formulation de l’ordre associé au retour à la vie
  choice: lève-toi
  alternative: relève-toi
  rationale: « Lève-toi » préserve la portée ordinaire de l’impératif grec et sa résonance de relèvement dans ce récit, sans expliciter davantage que le texte la nature du miracle.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et orale sans archaïsme. Le marqueur de note a été placé après l’impératif auquel porte réellement l’alternative lexicale.
