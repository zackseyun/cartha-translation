id: ACT.9.42
reference: Acts 9:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: fr
  text: On l’apprit dans toute Joppé, et beaucoup crurent au Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: Cela fut connu
  rationale: La tournure impersonnelle exprime le fait que l’événement précédent devint connu, sans préciser d’agent.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ est un lien narratif léger; « et » fait avancer le récit sans introduire une opposition indue.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: dans toute Joppé
  rationale: κατά avec le génitif a ici un sens distributif; cette formulation naturelle conserve l’idée d’une diffusion à travers toute la ville.
- source_word: Ἰόππης
  choice: Joppé
  rationale: « Joppé » est la forme française traditionnelle et courante du nom néotestamentaire de la ville.
- source_word: ἐπίστευσαν πολλοὶ
  choice: beaucoup crurent
  rationale: Le verbe au passé simple convient au récit et présente l’entrée dans la foi comme un événement; l’adjectif substantivé πολλοί est naturellement rendu par « beaucoup ».
- source_word: ἐπὶ τὸν κύριον
  choice: au Seigneur
  rationale: Avec πιστεύω, ἐπί suivi de l’accusatif désigne celui en qui la confiance est placée; « croire au Seigneur » est idiomatique en français et garde cette orientation personnelle.
- source_word: κύριον
  choice: Seigneur
  rationale: « Seigneur » préserve à la fois la valeur honorifique et la portée christologique du titre dans les Actes.
theological_decisions:
- issue: Rendu de πιστεύω avec ἐπὶ τὸν κύριον
  choice: crurent au Seigneur
  alternative: mirent leur foi dans le Seigneur
  rationale: « Crurent au Seigneur » suit de près la formulation grecque et reste naturel, tout en évitant d’expliciter davantage que le texte la nature de cet acte de foi.
- issue: Rendu de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » conserve la portée théologique possible du titre appliqué à Jésus; « Maître » la réduirait principalement à une relation d’autorité humaine.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple s’accorde avec le registre biblique littéraire sans être archaïque. Aucun ajout explicatif n’est nécessaire.
