id: ACT.9.31
reference: Acts 9:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: fr
  text: Ainsi donc, dans toute la Judée, la Galilée et la Samarie, l’Église était en paix et était édifiée[a]. Elle vivait dans la crainte du Seigneur et dans l’encouragement du Saint-Esprit[b], et elle se multipliait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « les Églises » au lieu de « l’Église ».
    reason: textual_variant
  - marker: b
    text: Ou « la consolation » ou « l’exhortation » du Saint-Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: l’Église
  rationale: Le SBLGNT porte le singulier, employé collectivement pour l’Église présente dans les trois régions. La variante au pluriel est signalée en note.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: dans toute la Judée, la Galilée et la Samarie
  rationale: κατά avec le génitif exprime ici l’étendue géographique. « Dans toute » rend ὅλης de façon naturelle en français.
- source_word: εἶχεν εἰρήνην
  choice: était en paix
  rationale: Cette tournure française naturelle restitue l’idée de paix et d’apaisement exprimée par l’idiome grec.
- source_word: οἰκοδομουμένη
  choice: s’édifiait
  rationale: L’imparfait exprime le processus en cours, tandis que « édifier » conserve la métaphore de la construction appliquée à l’affermissement de l’Église.
- source_word: πορευομένη
  choice: vivait
  rationale: Le participe décrit ici la conduite habituelle ou la manière de vivre. « Vivait » communique ce sens clairement sans imposer une marche physique.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: dans la crainte du Seigneur
  rationale: La formulation conserve l’expression biblique et son amplitude sémantique, notamment la révérence et l’obéissance, sans la réduire à la terreur.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: dans l’encouragement du Saint-Esprit
  rationale: « Encouragement » convient au contexte d’édification et de croissance. La note préserve les autres nuances importantes de παράκλησις.
- source_word: ἐπληθύνετο
  choice: elle se multipliait
  rationale: L’imparfait rend la croissance continue, et le pronom singulier reprend l’Église collective du texte grec.
theological_decisions:
- issue: Nombre et portée de ἐκκλησία
  choice: Le singulier collectif « l’Église »
  alternative: Le pluriel « les Églises »
  rationale: Le texte critique fourni emploie le singulier, de même que les participes et le verbe qui s’y rapportent. La variante manuscrite au pluriel est néanmoins importante et figure en note.
- issue: Sens de « la crainte du Seigneur »
  choice: Conserver la formule, qui peut désigner une révérence obéissante
  alternative: Expliciter par « le respect révérencieux du Seigneur » ou comprendre une peur terrifiée
  rationale: La formulation littérale préserve la profondeur et la tension de l’expression biblique sans la limiter à une seule paraphrase interprétative.
- issue: Sens de παράκλησις associé au Saint-Esprit
  choice: « encouragement »
  alternative: « consolation » ou « exhortation »
  rationale: Le terme grec couvre plusieurs nuances. « Encouragement » s’accorde bien avec l’édification et la croissance décrites ici, tandis que les autres possibilités sont conservées en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le texte conserve le singulier collectif « l’Église », la formule théologiquement riche « crainte du Seigneur » et la métaphore d’édification, tout en rendant πορευομένη par le français courant « vivait ».
