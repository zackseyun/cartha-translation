id: ACT.9.22
reference: Acts 9:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: fr
  text: Mais Saul se fortifiait de plus en plus et déconcertait les Juifs qui habitaient Damas, en leur démontrant que Jésus est le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Littéralement : « celui-ci est le Messie » ; « celui-ci » renvoie à Jésus dans le contexte.'
    reason: La note signale l’autre traduction traditionnelle de Χριστός et précise séparément la forme démonstrative littérale du grec.
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: se fortifiait de plus en plus
  rationale: L’imparfait exprime une progression continue, tandis que μᾶλλον en marque l’intensification. La tournure française reste ouverte sur la source de cette force, comme la forme grecque moyenne/passive.
- source_word: συνέχυννεν
  choice: déconcertait
  rationale: Le verbe évoque le fait de jeter les interlocuteurs dans la confusion. « Déconcertait » convient au contexte argumentatif sans suggérer que Saul enseignait de manière confuse.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: les Juifs qui habitaient Damas
  rationale: Cette formulation naturelle identifie précisément le groupe local visé et évite toute généralisation à l’ensemble des Juifs.
- source_word: συμβιβάζων
  choice: en leur démontrant
  rationale: Dans ce contexte, le participe décrit une argumentation qui rassemble des éléments pour établir une conclusion. « Démontrant » rend cette force probante sans affirmer nécessairement que tous furent convaincus.
- source_word: οὗτός
  choice: Jésus
  rationale: Le démonstratif renvoie à Jésus, mentionné dans le contexte précédent. Répéter son nom en français rend le référent clair et naturel, là où « celui-ci » serait lourd ou potentiellement ambigu.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre désignant l’Oint attendu dans le cadre juif. « Le Messie » en restitue directement le sens.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte présente Χριστός comme le titre de l’Oint attendu, et non comme un élément devenu quasi nominal. « Messie » préserve donc clairement la portée messianique juive de l’affirmation.
- issue: Référent du démonstratif οὗτός
  choice: Jésus
  alternative: celui-ci
  rationale: Le contexte identifie Jésus comme référent. L’explicitation ne tranche aucune question doctrinale; elle évite seulement une ambiguïté référentielle peu naturelle en français moderne.
translation_notes:
  register: Français international moderne, clair et digne. « Se fortifiait de plus en plus » conserve l’aspect progressif; « déconcertait » exprime la confusion produite chez les contradicteurs sans donner une coloration inutilement polémique.
