- from: 'Mais le Seigneur lui dit : « Lève-toi, va dans la rue appelée la Droite et, dans la maison de Judas, demande un nommé Saul, originaire de Tarse[a], car le voici en train de prier. »'
  to: 'Mais le Seigneur lui dit : « Lève-toi, va dans la rue appelée la Droite et cherche, dans la maison de Judas, un homme nommé Saul, de Tarse[a], car voici qu’il prie. »'
  rationale: La révision remplace « demande » par « cherche », équivalent direct et idiomatique de ζητέω dans cet ordre. Elle allège aussi la finale en « car voici qu’il prie », qui conserve la justification de γάρ, l’appel d’attention de ἰδού et le présent de προσεύχεται. Le reste de la formulation, y compris l’ambiguïté non problématique de l’identification géographique, est conservé.
