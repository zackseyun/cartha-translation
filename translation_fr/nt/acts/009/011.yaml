review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le Seigneur, les impératifs, la rue dite « la Droite », la maison de Judas, l’origine tarsienne de Saul et la prière en cours. Toutefois, « demande un nommé Saul » ne rend pas de façon assez directe ζητέω (« chercher ») et sonne comme une demande adressée à quelqu’un plutôt que comme l’ordre de rechercher Saul.
  naturalness: « Demande un nommé Saul » est peu idiomatique en français international moderne. « Cherche ... un homme nommé Saul » est naturel et clair. « Car voici qu’il prie » rend avec sobriété la valeur d’appel d’attention de ἰδού et l’action actuelle du présent grec.
  terminology: « Le Seigneur », « Saul », « Tarse » et « Judas » sont appropriés. « De Tarse » est une identification française naturelle de l’adjectif Ταρσεύς, sans imposer davantage que l’origine indiquée par le grec.
  issues:
