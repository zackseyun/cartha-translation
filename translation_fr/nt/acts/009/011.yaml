    issue: « demande un nommé Saul » pour ζήτησον
    rationale: ζητέω ordonne de chercher/rechercher Saul. Dans ce contexte, « demander » pourrait se comprendre comme solliciter Saul ou poser une question, et la tournure « demander un nommé Saul » n’est pas idiomatique.
  - severity: low
    issue: « le voici en train de prier »
    rationale: La formulation est compréhensible, mais « voici qu’il prie » est plus naturel dans ce registre et restitue nettement ἰδού sans périphrase lourde.
