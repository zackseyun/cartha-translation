id: ACT.9.11
reference: Acts 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: fr
  text: 'Mais le Seigneur lui dit : « Lève-toi, va dans la rue appelée la Droite et cherche, dans la maison de Judas, un homme nommé Saul, de Tarse[a], car voici qu’il prie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Saul de Tarse ». Le mot grec traduit par « de Tarse » est un adjectif qui identifie Saul par sa ville d’origine.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: le Seigneur
  rationale: Rend le titre grec de manière habituelle dans le Nouveau Testament, sans expliciter ici l’identité du locuteur au-delà du texte.
- source_word: Ἀναστὰς πορεύθητι
  choice: Lève-toi, va
  rationale: Le participe aoriste associé à l’impératif exprime naturellement en français deux actions successives commandées.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: la rue appelée la Droite
  rationale: « Rue » convient au contexte urbain, et « la Droite » traite Εὐθεῖαν comme le nom propre transparent de cette voie.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: dans la maison de Judas
  rationale: Suit directement la valeur locative de ἐν et conserve la structure du grec dans un français clair.
- source_word: ζήτησον
  choice: demande
  rationale: Dans une maison, ζητέω peut signifier demander à voir ou réclamer la personne recherchée; « demande » est ici plus idiomatique que « cherche » sans garantir qu’Ananias la trouvera.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: un nommé Saul, originaire de Tarse
  rationale: ὀνόματι introduit le nom et Ταρσέα indique l’origine géographique; la formulation française garde ces deux éléments distincts.
- source_word: ἰδοὺ γὰρ προσεύχεται
  choice: car le voici en train de prier
  rationale: « Car » conserve la fonction explicative de γάρ, « le voici » la mise en relief de ἰδού, et la périphrase progressive traduit l’action en cours.
theological_decisions:
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: le Seigneur Jésus
  rationale: Le contexte identifie le locuteur au Jésus ressuscité, mais ce verset porte seulement κύριος; la traduction n’ajoute donc pas « Jésus ».
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Lève-toi » et « va » sont directs sans archaïsme; « le voici » conserve la solennité légère et la fonction d’attention de ἰδού.
