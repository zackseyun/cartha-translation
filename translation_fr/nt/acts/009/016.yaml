  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: fr
  text: Car moi, je lui montrerai tout ce qu’il doit souffrir à cause de mon nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour mon nom » ou « pour l’amour de mon nom ».
    reason: Alternative lexicale pour ὑπέρ, qui peut exprimer le motif ou ce qui est fait pour la cause de quelqu’un.
lexical_decisions:
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom explicite est rendu par la dislocation « moi, je », qui marque naturellement l’insistance en français.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement le lien argumentatif.
- source_word: ὑποδείξω
  choice: je lui montrerai
  rationale: Rend directement le futur de ὑποδείκνυμι, au sens de montrer ou faire connaître.
- source_word: ὅσα
  choice: tout ce que
  rationale: Dans cette construction, désigne l’étendue des souffrances à venir; « tout ce que » reste naturel tout en évitant de réduire l’expression à une simple quantité.
- source_word: δεῖ
  choice: il doit
  rationale: Exprime la nécessité sans préciser si elle est providentielle, décrétée ou d’une autre nature.
- source_word: ὑπὲρ τοῦ ὀνόματός μου
  choice: à cause de mon nom
  rationale: Dans ce contexte, ὑπέρ peut exprimer la cause ou l’intérêt de quelqu’un. « À cause de mon nom » est naturel en français; les autres nuances plausibles sont signalées en note.
- source_word: παθεῖν
  choice: souffrir
  rationale: Équivalent français direct et courant de πάσχω dans ce contexte.
theological_decisions:
- issue: Nature de la nécessité exprimée par δεῖ
  choice: il doit
  alternative: il est destiné à; il lui est imposé de
  rationale: « Il doit » maintient l’affirmation de nécessité sans lui attribuer explicitement une nuance déterministe que le grec ne précise pas.
- issue: Portée de ὑπὲρ τοῦ ὀνόματός μου
  choice: à cause de mon nom
  alternative: pour mon nom; au nom de mon nom
  rationale: La formulation principale souligne que les souffrances sont liées au nom de Jésus, tandis que la note préserve les nuances possibles de service et d’intérêt sans trancher entre elles.
translation_notes:
  register: Français moderne, clair et digne. La tournure emphatique « moi, je » conserve l’accent du pronom grec explicite. « Tout ce qu’il doit souffrir » est idiomatique et garde la force de la nécessité.
