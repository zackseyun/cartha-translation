  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λαβὼν τροφὴν ⸀ἐνίσχυσεν. Ἐγένετο ⸀δὲ μετὰ τῶν ἐν Δαμασκῷ μαθητῶν ἡμέρας τινὰς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/019.yaml
  text: And after taking food[a], he regained his strength. And he was with the disciples in Damascus for some days[c][b],
translation:
  language: fr
  text: Après avoir mangé[a], il reprit des forces. Il resta ensuite quelques jours avec les disciples qui étaient à Damas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après avoir pris de la nourriture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν τροφὴν
  choice: Après avoir mangé
  rationale: Le participe aoriste suivi de τροφή désigne ici le fait de prendre de la nourriture, donc de manger. Cette formulation française exprime naturellement l’antériorité de l’action.
- source_word: ἐνίσχυσεν
  choice: il reprit des forces
  rationale: Dans le contexte du jeûne de Saul, le verbe indique qu’il retrouva sa vigueur. « Reprit des forces » est idiomatique et conserve le sens résultatif.
- source_word: Ἐγένετο δὲ
  choice: Il resta ensuite
  rationale: La tournure sert de transition narrative et introduit une période passée en compagnie des disciples. « Ensuite » restitue δέ dans le déroulement du récit, tandis que « resta » donne en français une expression naturelle de cette présence prolongée.
- source_word: μετὰ τῶν ἐν Δαμασκῷ μαθητῶν
  choice: avec les disciples qui étaient à Damas
  rationale: μετά avec le génitif exprime l’association. La relative conserve explicitement la portée locative de ἐν Δαμασκῷ sans transformer nécessairement Damas en lieu d’origine des disciples.
- source_word: ἡμέρας τινάς
  choice: quelques jours
  rationale: L’accusatif marque une durée indéterminée. « Quelques jours » exprime clairement cette courte période sans lui attribuer un nombre précis.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La première phrase privilégie l’expression idiomatique « manger », tandis que la note conserve la forme plus littérale. La seconde évite « les disciples de Damas », qui pourrait suggérer leur origine plutôt que leur simple présence dans la ville.
