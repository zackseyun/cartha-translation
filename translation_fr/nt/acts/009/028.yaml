id: ACT.9.28
reference: Acts 9:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: fr
  text: 'Il était avec eux à Jérusalem : il allait et venait, et parlait avec assurance au nom du Seigneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: il était avec eux
  rationale: L’imparfait exprime une association continue. Cette formulation simple conserve cette durée sans ajouter l’idée plus forte d’une résidence prolongée.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: il allait et venait
  rationale: Les deux participes forment une expression idiomatique évoquant des déplacements habituels et une libre fréquentation. « Il allait et venait » est naturel en français tout en conservant l’aspect répété.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Dans cette construction, Jérusalem est le lieu où se déroule l’activité, et non la destination de chaque déplacement. « À Jérusalem » rend clairement cette valeur locative.
- source_word: παρρησιαζόμενος
  choice: parlait avec assurance
  rationale: Le verbe désigne une parole ouverte, franche et courageuse. « Parler avec assurance » exprime cette hardiesse sans suggérer de l’arrogance.
- source_word: ἐν τῷ ὀνόματι
  choice: au nom de
  rationale: La formule peut évoquer à la fois l’autorité, la représentation et la confession. L’expression biblique française « au nom de » en préserve l’étendue.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le titre κύριος est traduit directement par « Seigneur »; le contexte renvoie à Jésus, mais le texte grec emploie ici le titre plutôt que son nom.
theological_decisions:
- issue: Référent du titre « Seigneur »
  choice: Conserver « le Seigneur » dans le texte principal.
  alternative: Expliciter « Jésus ».
  rationale: Le grec porte κυρίου et non Ἰησοῦ. Garder le titre respecte la formulation de Luc et préserve sa portée théologique, même si le contexte permet de comprendre qu’il s’agit de Jésus.
translation_notes:
  register: Français international moderne, clair et digne. Les deux propositions coordonnées rendent naturellement l’action continue de l’imparfait et des participes, sans alourdir la phrase par une construction participiale peu idiomatique en français.
