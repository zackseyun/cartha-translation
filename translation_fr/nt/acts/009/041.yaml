id: ACT.9.41
reference: Acts 9:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: fr
  text: Puis il lui tendit la main[a] et la fit se lever. Ensuite, il appela les saints et les veuves et la leur présenta vivante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « lui donna la main »; c’est-à-dire qu’il lui tendit la main pour l’aider à se lever.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: il lui tendit la main
  rationale: Cette formulation française naturelle exprime le geste de donner ou d’offrir sa main pour aider quelqu’un à se relever, tout en restant proche du grec.
- source_word: ἀνέστησεν
  choice: la fit se lever
  rationale: Le causatif rend directement l’idée de faire se lever ou se tenir debout. Dans ce contexte, il conserve aussi une résonance avec le langage du relèvement d’entre les morts sans confondre ce geste avec le retour à la vie déjà raconté au verset précédent.
- source_word: φωνήσας
  choice: il appela
  rationale: Le participe aoriste désigne ici l’appel par lequel Pierre fait venir le groupe avant de lui présenter Tabitha.
- source_word: τοὺς ἁγίους
  choice: les saints
  rationale: « Les saints » est la désignation néotestamentaire directe du peuple consacré à Dieu; « les croyants » serait plus interprétatif.
- source_word: τὰς χήρας
  choice: les veuves
  rationale: Traduction directe qui maintient la mention distincte de ce groupe, important dans le contexte immédiat.
- source_word: παρέστησεν
  choice: la leur présenta
  rationale: Le verbe signifie ici amener ou présenter quelqu’un devant d’autres. Le pronom « leur » explicite naturellement en français les personnes devant lesquelles elle est présentée, déjà nommées dans la proposition.
- source_word: ζῶσαν
  choice: vivante
  rationale: Le participe est prédicatif et souligne l’état dans lequel Tabitha est présentée. « Vivante » est naturel et garde toute la force du récit.
theological_decisions:
- issue: Résonance de résurrection dans ἀνέστησεν
  choice: la fit se lever
  alternative: la releva / l’aida à se lever
  rationale: Le texte décrit immédiatement le geste par lequel Pierre met Tabitha debout après son retour à la vie. « La fit se lever » préserve le sens causatif et laisse entendre la résonance du relèvement sans attribuer à ce seul verbe toute l’action de la résurrection.
translation_notes:
  register: Français international moderne, narratif et digne. Les enchaînements « Puis » et « Ensuite » rendent clairement la progression des actions. « Saints » est conservé comme terme biblique précis, tandis que la syntaxe reste accessible.
