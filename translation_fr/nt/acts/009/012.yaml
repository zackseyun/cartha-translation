id: ACT.9.12
reference: Acts 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: fr
  text: et il a vu en vision un homme du nom d’Ananias entrer et lui imposer les mains pour qu’il retrouve la vue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour qu’il voie de nouveau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: il a vu
  rationale: Le passé composé rend naturellement en français moderne l’aoriste dans ce récit rapportant une vision antérieure dont le contenu reste pertinent.
- source_word: ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι
  choice: en vision un homme du nom d’Ananias
  rationale: « En vision » exprime le cadre de ce qui a été vu, et « du nom d’Ananias » restitue naturellement l’identification portée par ὀνόματι.
- source_word: εἰσελθόντα
  choice: entrer
  rationale: L’infinitif dépend naturellement de « voir » en français et présente l’action observée sans imposer une chronologie plus précise que le participe grec.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: lui imposer les mains
  rationale: Cette expression française consacrée conserve l’action physique et l’idiome biblique sans en préciser la portée théologique.
- source_word: ὅπως
  choice: pour que
  rationale: Introduit naturellement en français la finalité exprimée par la proposition grecque.
- source_word: ἀναβλέψῃ
  choice: il retrouve la vue
  rationale: Dans le contexte de la cécité de Saul, le verbe désigne le rétablissement de la vue plutôt que le simple fait de lever les yeux.
theological_decisions:
- issue: Portée de l’imposition des mains
  choice: lui imposer les mains
  alternative: poser les mains sur lui
  rationale: Le texte décrit le geste sans dire explicitement s’il a une signification sacramentelle, charismatique ou autre. L’idiome biblique est donc conservé sans ajout doctrinal.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé composé est idiomatique dans ce discours rapporté; « en vision » conserve la formulation concise du grec.
source_grounding:
  english_pob_role: consult_only
