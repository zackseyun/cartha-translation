  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: fr
  text: Cependant, Saul eut connaissance de leur complot. Ils surveillaient aussi les portes[a] jour et nuit afin de le tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les portes de la ville ». Le grec dit simplement « les portes »; le contexte indique qu’il s’agit de celles de Damas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώσθη
  choice: eut connaissance
  rationale: Cette tournure française rend naturellement l’idée que le complot parvint à la connaissance de Saul, sans préciser qui l’en informa.
- source_word: ἐπιβουλή
  choice: complot
  rationale: Le nom désigne ici un projet hostile et meurtrier; « complot » est précis, courant et adapté au contexte.
- source_word: παρετηροῦντο
  choice: surveillaient
  rationale: L’imparfait exprime une surveillance continue; « surveillaient » conserve cette valeur durative sans introduire l’idée plus précise de garder.
- source_word: πύλας
  choice: portes
  rationale: Le grec dit simplement « les portes »; dans le contexte, il s’agit des portes de la ville de Damas.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: jour et nuit
  rationale: Expression française naturelle qui communique une vigilance continuelle.
- source_word: ὅπως
  choice: afin de
  rationale: Cette locution exprime clairement le but poursuivi tout en restant fluide en français moderne.
- source_word: ἀνέλωσιν
  choice: le tuer
  rationale: Dans ce contexte, ἀναιρέω signifie directement mettre à mort; « tuer » est clair et sans atténuation.
- source_word: δὲ
  choice: Cependant
  rationale: Le connecteur marque ici le contraste entre le complot ourdi et le fait que Saul en prend connaissance.
- source_word: καὶ
  choice: aussi
  rationale: 'L’adverbe ajoute à l’existence du complot la mesure concrète prise pour l’exécuter: la surveillance des portes.'
