review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris la nuance adversative de δέ et l’adresse « Seigneur ». Toutefois, « ceux qui t’appartiennent » interprète ἁγίοις plutôt que de conserver le terme collectif distinctif « saints »; cette notion est importante dans le vocabulaire lucanien. La formulation « entendre beaucoup de gens parler ... et dire » développe aussi inutilement la construction grecque.
  naturalness: La phrase est naturelle, mais « J’ai entendu beaucoup de gens parler de cet homme et de tout le mal qu’il a fait » est plus fluide et plus proche de la syntaxe source que « parler ... et dire ».
  terminology: « Seigneur » convient pour Κύριε. « Tes saints » est le correspondant usuel et transparent de τοῖς ἁγίοις σου dans les Actes; une note peut fournir « ceux qui te sont consacrés » comme explicitation non technique.
  issues:
  - severity: medium
    issue: Le texte principal remplace « tes saints » par « ceux qui t’appartiennent ».
    rationale: ἅγιοι désigne ici les croyants comme « saints/personnes consacrées »; l’idée d’appartenance est portée par σου, mais ne rend pas à elle seule le lexème ἅγιοι. Cette substitution atténue un terme récurrent et théologiquement significatif des Actes.
  - severity: low
    issue: « parler de cet homme et dire tout le mal » est une expansion un peu lourde.
    rationale: Le grec dit simplement qu’Ananias a entendu de beaucoup de personnes, au sujet de cet homme, tout le mal qu’il a fait. Une coordination avec « de tout le mal » est plus idiomatique et plus directe.
  revised_text: 'Mais Ananias répondit : « Seigneur, j’ai entendu beaucoup de gens parler de cet homme et de tout le mal qu’il a fait à tes saints[a] à Jérusalem. »'
  revised_footnotes:
  - marker: a
    text: 'Autre traduction : « à ceux qui te sont consacrés ».'
    reason: lexical_alternative
  revision_rationale: La révision conserve « Mais », « Seigneur », le passé composé et « tout le mal », tout en rétablissant « tes saints » pour rendre explicitement ἁγίοις. La note offre une explicitation moderne sans remplacer dans le texte le terme biblique récurrent.
