  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: fr
  text: 'Mais Ananias répondit : « Seigneur, j’ai entendu beaucoup de gens parler de cet homme et de tout le mal qu’il a fait à tes saints[a] à Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « à ceux qui te sont consacrés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: Mais Ananias répondit
  rationale: δέ marque ici une transition légèrement adversative, puisque Ananias exprime son hésitation; « répondit » rend directement ἀπεκρίθη.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans le contexte immédiat, Ananias s’adresse à Jésus ressuscité dans une vision; « Seigneur » conserve le respect et la portée théologique du titre.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: j’ai entendu beaucoup de gens
  rationale: Le passé composé exprime naturellement en français une information reçue qui reste pertinente. « Beaucoup de gens » explicite sans ambiguïté les personnes sous-entendues par πολλῶν.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: parler de cet homme
  rationale: Cette tournure française naturelle rend περί avec le génitif et conserve la force du démonstratif τούτου.
- source_word: ὅσα κακὰ ... ἐποίησεν
  choice: dire tout le mal qu’il a fait
  rationale: « Tout le mal » exprime naturellement l’ampleur des actes mauvais évoqués par ὅσα κακά, tandis que « a fait » reste proche du verbe général ποιέω.
- source_word: τοῖς ἁγίοις σου
  choice: à ceux qui t’appartiennent
  rationale: Dans ce contexte, ἅγιοι désigne les croyants consacrés à Dieu; cette formulation claire conserve le possessif σου sans recourir au terme français « saints », potentiellement plus étroit dans l’usage courant.
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: En français, la préposition locative idiomatique devant le nom de cette ville est « à ».
theological_decisions:
- issue: Référent et portée de Κύριε dans l’adresse d’Ananias
  choice: Adresse directe à Jésus comme « Seigneur »
  alternative: « Maître » ou simple formule respectueuse
  rationale: Le contexte présente Ananias répondant au Seigneur Jésus dans une vision; « Seigneur » respecte donc à la fois le récit et la portée théologique du titre sans aller au-delà du texte.
- issue: Sens de τοῖς ἁγίοις σου
  choice: « ceux qui t’appartiennent » dans le texte, avec « tes saints » en note
  alternative: « tes saints » ou « ceux qui te sont consacrés »
  rationale: Le grec désigne les croyants comme personnes saintes ou consacrées appartenant au Seigneur. La traduction principale privilégie la compréhension immédiate tout en gardant le terme traditionnel dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’hésitation narrative introduite par « Mais » et évite que « saints » soit compris uniquement au sens postérieur de personnes officiellement canonisées.
