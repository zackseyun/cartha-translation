  rationale: La révision conserve « Mais », « Seigneur », le passé composé et « tout le mal », tout en rétablissant « tes saints » pour rendre explicitement ἁγίοις. La note offre une explicitation moderne sans remplacer dans le texte le terme biblique récurrent.
  reviewer_model: gpt-5.6-terra
