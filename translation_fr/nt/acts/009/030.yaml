source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: fr
  text: Quand les frères[a] apprirent cela, ils le firent descendre à Césarée, puis le firent partir pour Tarse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les frères et sœurs » : le grec dit « les frères », mais, dans ce contexte, ce terme peut désigner plus largement la communauté des croyants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: apprirent cela
  rationale: Le participe aoriste indique qu’ils prennent connaissance de la situation évoquée au verset précédent. « Cela » explicite naturellement en français l’objet sous-entendu en grec.
- source_word: οἱ ἀδελφοὶ
  choice: les frères
  rationale: Cette traduction conserve la forme masculine plurielle du grec. Dans ce contexte, le terme peut toutefois désigner plus largement les membres de la communauté croyante, nuance signalée en note.
- source_word: κατήγαγον
  choice: le firent descendre
  rationale: Le verbe κατάγω exprime un déplacement vers le bas, ici vraisemblablement vers Césarée, sur la côte. Cette formulation conserve ce trait directionnel tout en restant idiomatique.
- source_word: Καισάρειαν
  choice: Césarée
  rationale: Forme française traditionnelle et courante du nom de lieu; le contexte suffit sans ajouter « maritime ».
- source_word: ἐξαπέστειλαν
  choice: le firent partir
  rationale: Cette expression naturelle rend l’idée de l’envoyer au loin ou de le faire poursuivre son voyage, sans la raideur de « l’expédièrent ».
- source_word: Ταρσόν
  choice: Tarse
  rationale: Forme française usuelle du nom de la ville.
theological_decisions:
- issue: Portée de ἀδελφοί dans une communauté probablement mixte
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le texte principal garde la forme masculine du grec sans exclure la possibilité que le mot englobe ici l’ensemble de la communauté. La note rend explicite cette ambiguïté contextuelle.
translation_notes:
  register: Français moderne, narratif et digne. « Puis » clarifie la succession des deux actions sans ajouter de contenu substantiel. La répétition de « le firent » maintient le parallélisme des deux verbes grecs et reste naturelle dans une phrase brève.
