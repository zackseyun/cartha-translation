id: ACT.9.1
reference: Acts 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: fr
  text: Cependant, Saul respirait encore la menace et le meurtre contre les disciples du Seigneur ; il se rendit auprès du grand prêtre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Cependant
  rationale: Marque la reprise du récit concernant Saul avec une légère opposition par rapport à la scène précédente.
- source_word: ἔτι
  choice: encore
  rationale: Exprime la persistance de l’hostilité de Saul.
- source_word: ἐμπνέων
  choice: respirait
  rationale: Conserve l’image vive selon laquelle la menace et la violence sont comme l’air que Saul respire.
- source_word: ἀπειλῆς
  choice: la menace
  rationale: Le singulier français rend naturellement le nom abstrait grec et l’état d’hostilité continu.
- source_word: φόνου
  choice: le meurtre
  rationale: Rend la gravité morale de φόνος, qui désigne l’homicide ou le meurtre, sans accentuer l’idée collective que pourrait suggérer « massacre ».
- source_word: εἰς τοὺς μαθητὰς
  choice: contre les disciples
  rationale: Dans ce contexte hostile, εἰς indique la direction adverse des menaces et de l’intention meurtrière.
- source_word: μαθητὰς
  choice: disciples
  rationale: Terme français établi et précis pour les personnes qui suivent le Seigneur.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le génitif rattache naturellement les disciples au Seigneur; « Seigneur » correspond à l’usage de κύριος dans ce contexte de Luc-Actes.
- source_word: προσελθὼν
  choice: Il alla trouver
  rationale: Rend naturellement en français le mouvement vers le grand-prêtre tout en donnant une phrase complète, puisque le verset se termine sur un participe grec dont l’action principale se poursuit au verset suivant.
- source_word: ἀρχιερεῖ
  choice: le grand-prêtre
  rationale: Équivalent français conventionnel et précis du singulier ἀρχιερεύς.
theological_decisions:
- issue: Sens de κύριος dans τοῦ κυρίου
  choice: du Seigneur
  alternative: du Maître
  rationale: « Seigneur » est le rendu normal de κύριος et correspond ici à la désignation de Jésus dans le contexte de Luc-Actes; aucune ambiguïté textuelle n’impose « Maître ».
- issue: Portée morale de φόνος
  choice: le meurtre
  alternative: la mise à mort
  rationale: « Meurtre » préserve la force morale du terme grec; « mise à mort » serait plus neutre et pourrait atténuer l’hostilité décrite.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore « respirait encore la menace et le meurtre » est volontairement conservée. Deux phrases évitent une tournure participiale artificielle et rendent lisible la fin suspendue du verset grec.
