id: ACT.9.10
reference: Acts 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: fr
  text: 'Il y avait à Damas un disciple nommé Ananias. Le Seigneur lui dit dans une vision : « Ananias ! » Il dit : « Me voici, Seigneur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: Il y avait
  rationale: L’imparfait introduit un nouveau personnage et δέ marque une transition narrative légère. En français, « Il y avait » ouvre naturellement la scène sans ajouter un marqueur temporel absent du grec.
- source_word: τις μαθητὴς
  choice: un disciple
  rationale: τις a ici une valeur indéfinie. L’article « un » suffit en français moderne ; « un certain disciple » serait inutilement appuyé.
- source_word: ἐν Δαμασκῷ
  choice: à Damas
  rationale: Le français emploie normalement « à » devant un nom de ville pour exprimer la localisation.
- source_word: ὀνόματι Ἁνανίας
  choice: nommé Ananias
  rationale: Cette tournure rend de façon concise et idiomatique le datif de dénomination.
- source_word: εἶπεν πρὸς αὐτόν
  choice: lui dit
  rationale: La construction λέγω avec πρός est rendue naturellement par « dire à » ; le pronom conjoint donne ici « lui dit ».
- source_word: ἐν ὁράματι
  choice: dans une vision
  rationale: La formule indique le cadre ou le mode de la communication et se rend clairement ainsi en français courant.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: L’article grec est conservé, et le contexte narratif désigne le Seigneur ressuscité.
- source_word: Ἁνανία
  choice: Ananias !
  rationale: Le vocatif est rendu par le nom directement interpellé ; le point d’exclamation signale naturellement l’appel sans en modifier le contenu.
- source_word: Ἰδοὺ ἐγώ
  choice: Me voici
  rationale: Il s’agit d’une réponse idiomatique marquant la présence et la disponibilité. « Me voici » est naturel, digne et bien établi en français biblique moderne.
- source_word: κύριε
  choice: Seigneur
  rationale: Dans cette vision, Ananias répond à celui que le récit vient d’appeler « le Seigneur » ; « Seigneur » convient mieux que « monsieur ».
theological_decisions:
- issue: Référent de ὁ κύριος et κύριε dans la vision
  choice: Les deux occurrences sont rendues par « Seigneur » et renvoient au Seigneur ressuscité.
  alternative: Comprendre κύριε comme une adresse divine plus générique, ou le rendre dans d’autres contextes par « monsieur ».
  rationale: Le contexte immédiat et la suite du récit identifient le locuteur comme le Seigneur qui mandate Ananias au sujet de Saul. La traduction conserve cette portée christologique sans ajouter explicitement le nom de Jésus.
translation_notes:
  register: Français international moderne, clair et digne. La longue coordination grecque est répartie en trois phrases pour assurer une narration naturelle, sans perte de contenu ni résolution indue d’une ambiguïté.
