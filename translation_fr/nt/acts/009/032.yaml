  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: fr
  text: Alors que Pierre passait partout, il descendit aussi auprès des saints qui habitaient à Lydda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενον διὰ πάντων
  choice: parcourait tous ces lieux
  rationale: Le grec dit littéralement qu’il passait « à travers tous/toutes », sans nom exprimé. Dans le contexte des régions et communautés mentionnées au verset précédent, « tous ces lieux » donne en français une formulation naturelle sans imposer que le référent soit uniquement des personnes.
- source_word: κατελθεῖν
  choice: descendit
  rationale: Conserve le mouvement exprimé par le verbe grec, couramment employé pour un déplacement géographique.
- source_word: τοὺς ἁγίους
  choice: les saints
  rationale: Rend directement le terme grec désignant les membres du peuple consacré à Dieu, tout en conservant son langage théologique.
- source_word: τοὺς κατοικοῦντας Λύδδα
  choice: qui habitaient à Lydda
  rationale: Expression française simple et fidèle au participe grec et au nom de lieu.
theological_decisions:
- issue: Référent de πάντων (« tous/toutes »)
  choice: tous ces lieux
  alternative: parmi eux tous / auprès de tous les croyants
  rationale: Le référent n’est pas explicitement nommé en grec. Le contexte géographique favorise les lieux ou l’ensemble du territoire, tandis qu’une traduction explicitement personnelle identifierait sans certitude les croyants comme référent.
translation_notes:
  register: Français moderne, clair et digne. La tournure narrative « Comme Pierre… » rend Ἐγένετο δὲ sans ajouter un adverbe temporel tel que « maintenant ». « Les saints » conserve la terminologie du texte source.
