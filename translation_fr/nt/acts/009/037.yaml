  verdict: revise
  source_fidelity: La séquence maladie–mort et la localisation dans une pièce à l’étage sont correctement comprises. Toutefois, « son corps » explicite un élément que le grec laisse exprimé par le pronom personnel féminin αὐτήν, et « on le déposa » fait dépendre le pronom masculin de cette explicitation. Une formulation conservant « elle/la » reflète plus directement le texte source.
  naturalness: Le français du projet est globalement naturel et digne. « Après l’avoir lavée, ils la déposèrent » est tout aussi idiomatique dans ce contexte narratif et évite le changement de référent induit par « corps ».
  terminology: « Pièce à l’étage » rend clairement ὑπερῴῳ sans suggérer une « chambre haute » déterminée. Aucun terme théologique particulier n’est en jeu.
  issues:
