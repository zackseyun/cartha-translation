    issue: Explicitation de « corps » et reprise pronominale masculine
    rationale: λούσαντες αὐτήν et ἔθηκαν αὐτήν ont tous deux pour objet la personne désignée au féminin. Le contexte funéraire permet de comprendre qu’il s’agit de la dépouille, mais le grec ne substitue pas « corps » au pronom. Conserver « l’avoir lavée » puis « la déposèrent » est plus fidèle sans nuire à la clarté.
