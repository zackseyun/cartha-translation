  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: fr
  text: À cette époque-là, elle tomba malade et mourut. Après l’avoir lavée, ils la déposèrent dans une pièce à l’étage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: À cette époque-là
  rationale: La formule introduit l’événement dans son cadre temporel. Cette tournure française actuelle rend naturellement l’ensemble sans calquer le grec ni ajouter un « maintenant » absent.
- source_word: ἀσθενήσασαν αὐτὴν ἀποθανεῖν
  choice: elle tomba malade et mourut
  rationale: Le grec emploie une construction infinitive avec un participe aoriste; deux verbes conjugués expriment clairement en français la succession de la maladie et de la mort.
- source_word: λούσαντες
  choice: Après avoir lavé son corps
  rationale: Le participe aoriste marque une action antérieure au dépôt dans la pièce. Après la mention explicite de sa mort, « son corps » explicite naturellement ce qui est lavé sans changer le référent.
- source_word: ἔθηκαν αὐτὴν
  choice: on le déposa
  rationale: Le sujet grec indéfini se rend idiomatiquement par « on ». « Déposa » convient au traitement respectueux d’un corps, tandis que le pronom masculin reprend « corps ».
- source_word: ἐν ὑπερῴῳ
  choice: dans une pièce à l’étage
  rationale: ὑπερῷον désigne une pièce située à un étage supérieur. L’absence d’article ne désigne pas nécessairement une salle connue; cette formulation moderne évite aussi l’association indue avec une « chambre haute » particulière.
theological_decisions:
- issue: Faut-il rendre ὑπερῴῳ par la formule traditionnelle « chambre haute » ou par une description spatiale générique ?
  choice: dans une pièce à l’étage
  alternative: dans la chambre haute
  rationale: Le grec anarthre indique simplement une pièce à l’étage et ne permet pas d’identifier un lieu particulier. La traduction retenue préserve cette indétermination.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; « à cette époque-là » et « pièce à l’étage » restent immédiatement compréhensibles. Aucun archaïsme ni terme confessionnel n’est introduit.
