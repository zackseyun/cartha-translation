source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: fr
  text: 'Ananias partit donc, entra dans la maison, posa les mains sur lui et dit : « Saul, mon frère, le Seigneur m’a envoyé — Jésus, celui qui t’est apparu sur la route par laquelle tu venais — afin que tu retrouves la vue[a] et que tu sois rempli de l’Esprit saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que tu voies de nouveau ».
    reason: Alternative lexicale plus formelle pour ἀναβλέψῃς ; le texte principal explicite le rétablissement de la vue exigé par le contexte.
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: Ananias partit donc
  rationale: Le verbe fait progresser le récit et δέ marque ici l’enchaînement avec l’ordre reçu. « Partit donc » exprime naturellement les deux éléments sans alourdir la phrase.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: entra dans la maison
  rationale: Rendu direct et idiomatique du mouvement vers l’intérieur de la maison.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: posa les mains sur lui
  rationale: Le participe exprime une action accompagnant la prise de parole. La formulation conserve le geste physique et l’expression biblique courante.
- source_word: Σαοὺλ ἀδελφέ
  choice: Saul, mon frère
  rationale: En français actuel, cette apostrophe rend naturellement le vocatif affectueux ἀδελφέ tout en conservant sa portée relationnelle.
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: le Seigneur m’a envoyé
  rationale: 'Le passé composé convient à l’action accomplie dont l’effet demeure présent : Ananias se trouve là en qualité d’envoyé.'
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: Jésus, celui qui t’est apparu
  rationale: La construction appositive grecque identifie le Seigneur comme Jésus et le participe substantivé comme celui qui s’est manifesté à Saul. L’apposition est conservée plutôt que réorganisée.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: sur la route par laquelle tu venais
  rationale: « Route » garde le sens concret de ὁδός, et l’imparfait « tu venais » reflète l’aspect duratif de ἤρχου.
- source_word: ὅπως ἀναβλέψῃς
  choice: afin que tu retrouves la vue
  rationale: ὅπως introduit le but. Dans ce contexte de cécité et de guérison, ἀναβλέπω signifie recouvrer la faculté de voir.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: que tu sois rempli de l’Esprit saint
  rationale: La tournure passive et le complément sont conservés. En français, l’article défini convient à la référence au Saint-Esprit.
theological_decisions:
- issue: Identification du Seigneur par l’apposition Ἰησοῦς ὁ ὀφθείς σοι
  choice: le Seigneur m’a envoyé — Jésus, celui qui t’est apparu…
  alternative: le Seigneur Jésus, qui t’est apparu…, m’a envoyé
  rationale: Le grec place « Jésus » après la proposition « le Seigneur m’a envoyé » comme une apposition explicative. Garder cette rupture préserve la structure et l’accent du texte sans nier que Jésus identifie le Seigneur.
- issue: Sens de ἀδελφέ dans l’adresse d’Ananias
  choice: Saul, mon frère
  alternative: frère Saul
  rationale: Le texte permet une adresse de proximité et d’accueil, possiblement chargée de fraternité croyante, sans qu’il soit nécessaire d’en préciser davantage la nature. « Mon frère » est naturel en français et ne tranche pas explicitement entre les nuances possibles.
- issue: Article devant πνεύματος ἁγίου
  choice: l’Esprit saint
  alternative: d’Esprit saint
  rationale: L’absence d’article grec n’impose pas une lecture indéfinie. Dans les Actes, l’expression désigne ici l’Esprit divin; l’article français est idiomatique et n’ajoute pas de précision étrangère au contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation par tirets maintient l’apposition grecque inhabituelle sans rendre la phrase obscure. « Esprit saint » suit la capitalisation française du nom propre avec minuscule à l’adjectif.
