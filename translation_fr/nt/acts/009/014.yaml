id: ACT.9.14
reference: Acts 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: fr
  text: Et ici, il a l’autorité, de la part des grands prêtres, de lier tous ceux qui font appel à ton nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «qui invoquent ton nom». L’expression grecque est une tournure biblique courante pour parler du fait de faire appel à quelqu’un ou de l’invoquer, souvent dans la prière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: ici
  rationale: Adverbe de lieu renvoyant, dans le contexte, à Damas.
- source_word: ἐξουσίαν
  choice: le pouvoir
  rationale: Désigne ici une autorisation officielle déléguée par les grands prêtres; «pouvoir» s'emploie naturellement en français dans la construction «le pouvoir de».
- source_word: παρὰ τῶν ἀρχιερέων
  choice: des grands prêtres
  rationale: παρά avec le génitif marque la source de l'autorisation. «Grands prêtres» est l'appellation française conventionnelle des dirigeants sacerdotaux de Jérusalem.
- source_word: δῆσαι
  choice: lier
  rationale: Conserve l'image concrète du grec, qui évoque l'entrave des personnes arrêtées, sans la réduire au seul terme interprétatif «arrêter».
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: tous ceux qui font appel à
  rationale: Rend le participe substantivé et préserve l'idée d'invocation, tout en restant naturel en français moderne.
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: Reproduit l'expression biblique, où le nom représente aussi la personne et son autorité, sans l'expliciter dans le corps du texte.
theological_decisions:
- issue: Portée de l'expression «faire appel à ton nom», adressée à Jésus
  choice: Conserver l'idiome «font appel à ton nom».
  alternative: «t'invoquent» ou «te prient»
  rationale: L'expression grecque peut désigner l'invocation dans la prière et l'attachement à Jésus. La formulation retenue garde cette portée théologique sans la limiter ni l'amplifier par une paraphrase doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. «Lier» conserve l'image du texte source; «faire appel à ton nom» maintient l'ambiguïté féconde entre invocation, prière et recours à l'autorité de Jésus.
