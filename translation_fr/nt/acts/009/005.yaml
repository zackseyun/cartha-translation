base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: fr
  text: 'Il dit : « Qui es-tu, Seigneur[a] ? » Mais lui : « Moi, je suis Jésus, celui que tu persécutes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monsieur ». Le grec κύριε peut être une formule de respect; « Seigneur » convient également au contexte où le locuteur céleste se révèle comme Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Il demanda
  rationale: Dans ce contexte, λέγω introduit une question directe; « demanda » est naturel en français. Le pronom sujet est fourni d’après le contexte, et δέ marque une légère progression narrative qu’il n’est pas nécessaire de rendre séparément.
- source_word: Τίς εἶ
  choice: Qui es-tu
  rationale: Traduction directe et idiomatique de l’interrogatif suivi de la copule.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve le rendu usuel de κύριος et convient à l’adresse révérencieuse faite au locuteur céleste, tout en laissant en note la possibilité du simple titre de respect.
- source_word: ὁ δέ
  choice: Et celui-ci répondit
  rationale: L’article substantivé avec δέ désigne l’autre interlocuteur. « Celui-ci » distingue clairement le locuteur, tandis que « répondit » rend naturellement λέγω implicite dans l’échange.
- source_word: Ἐγώ εἰμι
  choice: Moi, je suis
  rationale: Le pronom grec exprimé renforce le sujet; la dislocation « Moi, je » transmet cette insistance en français courant sans ajouter de portée théologique étrangère au contexte.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française conventionnelle du nom propre.
- source_word: ὃν σὺ διώκεις
  choice: celui que tu persécutes
  rationale: Le relatif a Jésus pour antécédent et objet de διώκεις. Le présent « persécutes » exprime naturellement l’action hostile en cours; le pronom sujet « tu » est nécessaire en français, même si l’emphase du σὺ grec n’est pas marquée typographiquement.
theological_decisions:
- issue: Sens de κύριε avant que le locuteur se présente comme Jésus
  choice: Seigneur
  alternative: Maître / monsieur
  rationale: κύριε peut être une formule de respect sans constituer encore une confession pleinement informée. « Seigneur » préserve néanmoins la portée révérencieuse et le contexte de révélation; la note maintient l’ambiguïté réelle.
- issue: Identification de Jésus à ceux que Saul persécute
  choice: « Jésus, celui que tu persécutes » sans explication ajoutée
  alternative: Expliciter « en persécutant ses disciples »
  rationale: Le texte établit directement que Saul persécute Jésus. Une explicitation dans le corps du verset résoudrait la tension théologique au lieu de la préserver.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Il demanda » et « répondit » rendent naturellement l’échange, tandis que « Moi, je suis » conserve l’insistance du pronom grec. La note évite de trancher silencieusement l’ambiguïté de κύριε.
