  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: fr
  text: Mais relève-toi, entre dans la ville, et on te dira ce que tu dois faire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Conjonction adversative qui marque le passage à l’ordre donné à Saul; « Mais » est concis et naturel.
- source_word: ἀνάστηθι
  choice: relève-toi
  rationale: Impératif aoriste de ἀνίστημι; dans le contexte où Saul est tombé à terre, « relève-toi » exprime naturellement l’action demandée.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: entre dans la ville
  rationale: Rend directement le mouvement exprimé par εἰσέρχομαι avec εἰς, dans un français courant et digne.
- source_word: λαληθήσεταί σοι
  choice: on te dira
  rationale: Le pronom indéfini « on » permet une tournure passive de sens naturel en français sans préciser l’agent, que le grec laisse lui aussi indéterminé.
- source_word: ὅ τί
  choice: ce que
  rationale: Introduit naturellement en français le contenu de ce qui sera communiqué.
- source_word: σε δεῖ ποιεῖν
  choice: tu dois faire
  rationale: « Devoir » conserve la force de nécessité ou d’obligation portée par δεῖ sans alourdir la phrase.
theological_decisions:
- issue: Force de δεῖ dans un contexte de direction divine
  choice: tu dois faire
  alternative: il te faut faire
  rationale: « Tu dois » préserve la forte nécessité exprimée par δεῖ, sans préciser au-delà du texte si celle-ci relève d’un ordre, d’une obligation ou du dessein divin.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « on te dira » garde l’agent implicite tout en évitant le calque peu naturel « il te sera dit ».
