  naturalness: Le français du projet est fluide. La légère explicitation de ἐγένετο par « il arriva que » reste recevable dans un récit biblique moderne et permet de préserver la structure source sans alourdir excessivement la phrase.
  terminology: « Damas », « une lumière » et « venant du ciel » sont justes. « Ciel » préserve convenablement l’amplitude de οὐρανός. La note peut formuler l’alternative de façon plus neutre et plus directement lexicale.
