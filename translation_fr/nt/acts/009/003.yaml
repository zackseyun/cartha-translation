id: ACT.9.3
reference: Acts 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ πορεύεσθαι ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ, ⸂ἐξαίφνης τε αὐτὸν περιήστραψεν⸃ φῶς ⸀ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: fr
  text: Pendant qu’il faisait route et qu’il approchait de Damas, il arriva que, soudain, une lumière venant du ciel[a] resplendit autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner le ciel visible ou le ciel dans un sens céleste; dans ce contexte, il suggère probablement l’origine divine de la lumière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: Pendant qu’il faisait route
  rationale: La construction ἐν suivi de l’infinitif substantivé exprime une action simultanée. « Pendant qu’il faisait route » est naturel en français et conserve la valeur durative.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν
  choice: et approchait
  rationale: La tournure lucanienne avec ἐγένετο et l’accusatif suivi de l’infinitif est rendue idiomatiquement. En français, traduire littéralement par « il arriva qu’il approchait » serait lourd et artificiel; l’imparfait conserve l’aspect progressif de ἐγγίζειν.
- source_word: τῇ Δαμασκῷ
  choice: de Damas
  rationale: Avec ἐγγίζω, le datif indique le lieu dont on s’approche. Le français demande naturellement « approcher de Damas ».
- source_word: ἐξαίφνης τε
  choice: soudain
  rationale: « Soudain » exprime nettement le caractère brusque de l’événement; l’enchaînement léger porté par τε est déjà assuré par la structure de la phrase.
- source_word: περιήστραψεν
  choice: resplendit autour de lui
  rationale: Le verbe désigne une lumière qui brille tout autour. « Resplendit autour de lui » préserve l’effet lumineux enveloppant sans préciser indûment qu’il s’agissait d’un éclair.
- source_word: φῶς
  choice: une lumière
  rationale: Dans ce contexte, l’article indéfini français introduit naturellement cette manifestation lumineuse.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venant du ciel
  rationale: « Du ciel » conserve à la fois l’origine indiquée par ἐκ et la portée céleste probable de οὐρανός dans ce récit de révélation.
theological_decisions:
- issue: Sens de οὐρανός dans un contexte de révélation
  choice: du ciel
  alternative: du ciel visible / des cieux
  rationale: Le contexte favorise une origine divine, mais le mot grec peut aussi désigner le ciel visible. La traduction française « ciel » conserve utilement cette amplitude sémantique sans expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, fluide et digne. La formule narrative ἐγένετο n’est pas calquée, afin d’éviter une tournure française artificielle; la progression et la soudaineté du récit restent explicites.
