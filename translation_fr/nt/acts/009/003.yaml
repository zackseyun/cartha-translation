  rationale: La révision rétablit ἐγένετο par « il arriva que », tout en conservant l’aspect en cours des deux actions de déplacement et l’irruption soudaine de la lumière. La note conserve l’ambiguïté lexicale de οὐρανός sans imposer une interprétation doctrinale.
