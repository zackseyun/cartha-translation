review_pass:
  verdict: revise
  source_fidelity: La mention ajoutée « envers les pauvres » n’est pas exprimée dans le grec. ἐλεημοσύναι renvoie bien à des aumônes ou à une aide miséricordieuse, mais le verset ne précise pas ici les bénéficiaires. De même, « traduit en grec » explicite une donnée contextuelle plausible, mais non formulée par le texte. La révision conserve les deux noms et rend l’abondance habituelle ainsi que l’imparfait de ἐποίει.
  naturalness: « Elle accomplissait de nombreuses bonnes œuvres et faisait de nombreuses aumônes » est idiomatique en français international moderne. La distinction verbale évite l’association moins naturelle « accomplir des aumônes » tout en gardant une phrase fluide.
  terminology: « Une disciple » rend correctement le féminin explicite μαθήτρια. « Tabitha » et « Dorcas » sont conservés comme noms propres correspondants. « Aumônes » est un rendu précis de ἐλεημοσύναι dans ce contexte et n’ajoute pas de destinataires absents du texte.
  issues:
  - severity: medium
    issue: Ajout de « envers les pauvres »
    rationale: Le grec mentionne des ἐλεημοσύναι, sans indiquer explicitement « les pauvres » dans ce verset. Même si les aumônes présupposent normalement des personnes dans le besoin, cette précision ne doit pas être intégrée au texte principal.
  - severity: low
    issue: Explicitation « traduit en grec »
    rationale: Le grec dit littéralement que Tabitha, « interprété/traduit », est appelée Dorcas. Dorcas est effectivement la forme grecque correspondante, mais la langue d’arrivée n’est pas explicitement nommée dans la formulation source; « dont le nom se traduit par Dorcas » est plus sobre et fidèle.
  revised_text: À Joppé, il y avait une disciple nommée Tabitha[a], dont le nom se traduit par Dorcas. Elle accomplissait de nombreuses bonnes œuvres et faisait de nombreuses aumônes.
  revised_footnotes:
  - marker: a
    text: Dorcas est le nom grec correspondant à Tabitha ; ces deux noms signifient « gazelle ».
    reason: Précise le rapport entre les deux noms et leur sens lexical sans remplacer le nom propre dans le texte.
  revision_rationale: La révision retire les précisions non exprimées (« en grec » et « envers les pauvres »), tout en préservant la relation de traduction entre les noms, le féminin de « disciple », l’abondance suggérée par πλήρης et la valeur habituelle de l’imparfait grec.
