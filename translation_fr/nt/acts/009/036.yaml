revisions:
- from: À Joppé, il y avait une disciple nommée Tabitha[a], nom qui, traduit en grec, se dit Dorcas. Elle faisait beaucoup d’œuvres bonnes et d’actes de générosité envers les pauvres.
  to: À Joppé, il y avait une disciple nommée Tabitha[a], dont le nom se traduit par Dorcas. Elle accomplissait de nombreuses bonnes œuvres et faisait de nombreuses aumônes.
  rationale: La révision retire les précisions non exprimées (« en grec » et « envers les pauvres »), tout en préservant la relation de traduction entre les noms, le féminin de « disciple », l’abondance suggérée par πλήρης et la valeur habituelle de l’imparfait grec.
