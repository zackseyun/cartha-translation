id: ACT.9.36
reference: Acts 9:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: fr
  text: À Joppé, il y avait une disciple nommée Tabitha[a], dont le nom se traduit par Dorcas. Elle accomplissait de nombreuses bonnes œuvres et faisait de nombreuses aumônes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dorcas est le nom grec correspondant à Tabitha ; ces deux noms signifient « gazelle ».
    reason: Précise le rapport entre les deux noms et leur sens lexical sans remplacer le nom propre dans le texte.
lexical_decisions:
- source_word: μαθήτρια
  choice: une disciple
  rationale: Le nom grec est explicitement féminin. « Une disciple » est naturel en français moderne et rend cette donnée sans périphrase.
- source_word: ὀνόματι Ταβιθά
  choice: nommée Tabitha
  rationale: Cette tournure rend naturellement l’idiome grec d’introduction d’un nom propre.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: nom qui, traduit en grec, se dit Dorcas
  rationale: La formulation conserve à la fois l’idée de traduction et celle du nom grec correspondant. « En grec » explicite la langue d’arrivée impliquée par le contraste entre le nom araméen et son équivalent grec.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: Elle faisait beaucoup d’œuvres bonnes
  rationale: Plutôt qu’un calque peu naturel de « pleine d’œuvres bonnes », cette formulation exprime l’abondance habituelle indiquée par πλήρης et s’accorde avec l’imparfait final.
- source_word: ἐλεημοσυνῶν
  choice: actes de générosité envers les pauvres
  rationale: Dans ce contexte, le terme désigne des aumônes ou des secours charitables. Cette formulation moderne en préserve le bénéficiaire et la dimension concrète sans la limiter au seul don d’argent.
- source_word: ὧν ἐποίει
  choice: faisait
  rationale: L’imparfait grec décrit une pratique suivie ou habituelle. L’imparfait français restitue naturellement cet aspect sans répéter lourdement « qu’elle faisait ».
- source_word: δέ
  choice: non rendu séparément
  rationale: La particule marque ici la progression du récit. En français, l’enchaînement se fait naturellement sans ajouter « or » ou « alors ».
- source_word: Ἐν Ἰόππῃ
  choice: À Joppé
  rationale: « Joppé » est la forme française traditionnelle et encore intelligible du nom de lieu; la préposition « à » convient à une ville.
theological_decisions:
- issue: Forme féminine μαθήτρια
  choice: une disciple
  alternative: une femme disciple
  rationale: « Une disciple » marque déjà explicitement le féminin en français, tout en restant idiomatique et fidèle à la forme rare employée par Luc.
- issue: Portée de ἐλεημοσυνῶν
  choice: actes de générosité envers les pauvres
  alternative: aumônes
  rationale: « Aumônes » est lexicalement possible, mais peut suggérer uniquement des dons matériels. La formulation retenue conserve le sens d’aide miséricordieuse aux nécessiteux sans imposer une forme unique de secours.
- issue: Relation entre Tabitha et Dorcas
  choice: deux formes linguistiques correspondantes du même nom
  alternative: simple traduction du sens par « Gazelle »
  rationale: Le texte présente Dorcas comme le nom grec correspondant à Tabitha, et non comme un simple glossaire. Les deux noms propres restent donc dans le texte, tandis que leur sens est indiqué en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite les calques lourds tout en conservant le féminin explicite de « disciple », la correspondance des deux noms et le caractère habituel des actions décrites.
