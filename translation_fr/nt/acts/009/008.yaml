source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: fr
  text: Saul se releva de terre. Ses yeux étaient ouverts, mais il ne voyait rien. Ils le conduisirent par la main et le firent entrer à Damas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: se releva
  rationale: 'Dans ce contexte narratif, l’aoriste passif de ἐγείρω a un sens intransitif : Saul se remet debout après être tombé. « Se releva » est naturel et précis en français.'
- source_word: ἀπὸ τῆς γῆς
  choice: de terre
  rationale: Ici, γῆ désigne le sol sur lequel Saul était tombé. La tournure française « se relever de terre » rend naturellement l’image.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: bien qu’il ait les yeux ouverts
  rationale: 'Le génitif absolu exprime une circonstance dont le contexte fait ressortir la valeur concessive : ses yeux sont ouverts, et pourtant il ne voit pas.'
- source_word: οὐδὲν ἔβλεπεν
  choice: il ne voyait rien
  rationale: Cette formulation rend directement l’absence totale de vision tout en conservant l’imparfait du grec.
- source_word: χειραγωγοῦντες
  choice: on le conduisit par la main
  rationale: Le verbe désigne concrètement le fait de guider quelqu’un par la main. Le pronom indéfini « on » restitue naturellement en français le sujet implicite du participe pluriel, déterminé par le contexte.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: on le fit entrer dans Damas
  rationale: εἰσάγω exprime le mouvement vers l’intérieur. « Fit entrer dans Damas » évite de répéter « conduisit » et souligne l’entrée dans la ville.
- source_word: δὲ
  choice: mais / donc / non exprimé séparément
  rationale: 'Les trois occurrences structurent la progression et le contraste. Le français naturel ne demande pas de les rendre uniformément : « mais » marque le contraste central et « donc » introduit la conséquence.'
- source_word: Σαῦλος
  choice: Saul
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: Δαμασκόν
  choice: Damas
  rationale: Exonyme français standard de la ville.
