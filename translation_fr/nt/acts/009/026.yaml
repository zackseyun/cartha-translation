id: ACT.9.26
reference: Acts 9:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: fr
  text: À son arrivée à Jérusalem, il cherchait à se joindre aux disciples[a], mais tous avaient peur de lui, car ils ne croyaient pas qu’il était disciple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’attacher aux disciples ».'
    reason: Alternative lexicale qui fait ressortir la force de κολλάομαι, verbe pouvant exprimer une association étroite.
lexical_decisions:
- source_word: Παραγενόμενος δὲ εἰς Ἰερουσαλήμ
  choice: À son arrivée à Jérusalem
  rationale: Le participe aoriste introduit la circonstance antérieure à l’action principale. Cette tournure française exprime naturellement la valeur temporelle; le léger enchaînement porté par δέ demeure implicite dans la progression du récit.
- source_word: ἐπείραζεν
  choice: il cherchait
  rationale: L’imparfait grec présente une tentative en cours. « Il cherchait à » restitue cet aspect sans suggérer ici le sens de « tenter » au sens de mettre à l’épreuve.
- source_word: κολλᾶσθαι τοῖς μαθηταῖς
  choice: à se joindre aux disciples
  rationale: κολλάομαι évoque le fait de s’attacher ou de s’associer étroitement à un groupe. « Se joindre aux disciples » est naturel en français et n’introduit aucune notion institutionnelle absente du texte.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: mais tous avaient peur de lui
  rationale: Dans ce contexte, καί introduit un développement contrastant avec sa tentative. « Mais » rend clairement ce rapport, tandis que l’imparfait « avaient peur » correspond à l’aspect de ἐφοβοῦντο.
- source_word: μὴ πιστεύοντες
  choice: car ils ne croyaient pas
  rationale: Le participe présent négatif indique ici la raison de leur peur. Une proposition causale explicite est plus naturelle et immédiatement compréhensible en français.
- source_word: ὅτι ἐστὶν μαθητής
  choice: qu’il était disciple
  rationale: Bien que le grec emploie le présent ἐστίν, la concordance française place naturellement le verbe à l’imparfait après un verbe principal au passé, sans changer le contenu de l’affirmation.
- source_word: μαθητής
  choice: disciple
  rationale: « Disciple » est le terme français établi et précis pour désigner ici un adepte engagé, sans réduire le mot au simple sens d’élève.
theological_decisions:
- issue: Nature du lien que Saul cherchait à établir avec les croyants de Jérusalem
  choice: se joindre aux disciples
  alternative: s’attacher aux disciples
  rationale: Le passage décrit la tentative de Saul d’être accueilli parmi eux, sans parler d’un rite ni d’une catégorie formelle d’appartenance ecclésiale. La formulation conserve la dimension communautaire sans importer de structure ultérieure.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « disciple(s) » est conservée afin de respecter le lien lexical du grec. Le marqueur de note est placé après l’expression qu’il précise.
