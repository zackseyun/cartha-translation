  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: fr
  text: Il parlait et débattait avec les Juifs de langue grecque, mais ceux-ci cherchaient à le tuer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλει
  choice: parlait
  rationale: L’imparfait grec présente une activité en cours ou répétée; l’imparfait français en conserve naturellement l’aspect.
- source_word: τε καὶ
  choice: et
  rationale: La coordination simple relie naturellement les deux verbes à l’imparfait sans alourdir la phrase.
- source_word: συνεζήτει
  choice: débattait
  rationale: Le verbe désigne ici un échange argumenté, probablement conflictuel, plutôt qu’une simple discussion.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: avec les Juifs de langue grecque
  rationale: Avec un verbe de débat, πρός marque l’interaction; dans les Actes, Ἑλληνισταί désigne naturellement des Juifs de langue grecque.
- source_word: οἱ δὲ
  choice: mais ceux-ci
  rationale: δέ introduit le contraste entre l’activité de Saul et la réaction hostile de ses interlocuteurs; «ceux-ci» identifie clairement le groupe visé.
- source_word: ἐπεχείρουν
  choice: cherchaient
  rationale: L’imparfait exprime une tentative ou une entreprise prolongée; «cherchaient à» est idiomatique et garde cette nuance.
- source_word: ἀνελεῖν αὐτόν
  choice: à le tuer
  rationale: Dans ce contexte, ἀναιρέω signifie clairement faire mourir ou tuer; cette formulation est directe et moderne.
theological_decisions:
- issue: Identité des Ἑλληνισταί
  choice: les Juifs de langue grecque
  alternative: les Hellénistes
  rationale: Dans les Actes, le terme fonctionne comme une désignation sociolinguistique de Juifs parlant grec, notamment en Actes 6.1. La traduction explicite évite que le lecteur moderne les prenne pour des non-Juifs, sans introduire de distinction confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Les imparfaits coordonnés rendent la continuité des actions grecques. La désignation explicite «Juifs de langue grecque» est plus immédiatement compréhensible que le terme technique «Hellénistes».
