id: ACT.9.15
reference: Acts 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: fr
  text: 'Mais le Seigneur lui dit : « Va, car cet homme est un instrument que j’ai choisi pour porter mon nom devant les non-Juifs[a], les rois et les fils d’Israël[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les nations ».'
    reason: lexical_alternative
  - marker: b
    text: « Les fils d’Israël » est une expression biblique traditionnelle qui désigne le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Rend le titre grec de manière traditionnelle et naturelle ; dans ce récit, il désigne Jésus ressuscité parlant avec autorité.
- source_word: Πορεύου
  choice: Va
  rationale: Impératif direct, naturel en français, qui conserve la force de l’ordre grec.
- source_word: σκεῦος ἐκλογῆς ἐστίν μοι
  choice: est un instrument que j’ai choisi
  rationale: « Instrument » exprime clairement l’emploi métaphorique de σκεῦος, tandis que la proposition « que j’ai choisi » restitue ἐκλογῆς et la relation personnelle marquée par μοι sans imposer une formulation doctrinale technique.
- source_word: τοῦ βαστάσαι
  choice: pour porter
  rationale: L’infinitif articulé indique ici le but ; « porter » conserve l’image et convient naturellement avec « mon nom ».
- source_word: τὸ ὄνομά μου
  choice: mon nom
  rationale: La formulation littérale maintient les résonances bibliques d’autorité, de représentation et de témoignage public.
- source_word: ἐνώπιον
  choice: devant
  rationale: Correspondance directe qui convient à l’idée de comparaître et de témoigner en présence des groupes nommés.
- source_word: ἐθνῶν
  choice: les non-Juifs
  rationale: Dans l’opposition contextuelle avec les fils d’Israël, le terme désigne naturellement les peuples non juifs. La traduction plus littérale « les nations » est signalée en note.
- source_word: βασιλέων
  choice: les rois
  rationale: Traduction précise, simple et pleinement intelligible du terme grec.
- source_word: υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  rationale: Conserve l’expression familiale masculine et traditionnelle du texte source plutôt que de la neutraliser ; son sens collectif est expliqué en note.
- source_word: τε ... καὶ ... τε
  choice: les non-Juifs, les rois et les fils d’Israël
  rationale: Une énumération française simple rend naturellement la coordination grecque des trois groupes sans alourdir la phrase.
theological_decisions:
- issue: Risque de surinterprétation doctrinale de ἐκλογῆς
  choice: « un instrument que j’ai choisi »
  alternative: « un instrument d’élection » ou « un vase élu »
  rationale: Le verset affirme clairement un choix divin en vue d’une mission, mais n’exige pas le vocabulaire technique de débats théologiques ultérieurs. La formulation retenue préserve à la fois le choix et sa finalité missionnaire.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste directe ; « instrument » rend la métaphore sans l’archaïsme possible de « vase », tandis que « les fils d’Israël » maintient volontairement l’expression biblique du grec.
