id: ACT.9.35
reference: Acts 9:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: fr
  text: Tous ceux qui habitaient à Lydda et dans le Sharon[a] le virent, et ils se tournèrent vers le Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la plaine de Sharon ».
    reason: lexical_alternative
  - marker: b
    text: « Se tournèrent vers le Seigneur » peut aussi se rendre par « revinrent au Seigneur » ou, de manière plus interprétative, « se convertirent au Seigneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: virent
  rationale: 'L’aoriste de ὁράω exprime ici le plus naturellement une perception visuelle simple : les habitants virent Énée après sa guérison.'
- source_word: πάντες οἱ κατοικοῦντες
  choice: tous ceux qui habitaient
  rationale: Le participe substantivé désigne l’ensemble des personnes qui résidaient dans les lieux mentionnés; cette formulation est naturelle en français et conserve la portée de πάντες.
- source_word: Λύδδα
  choice: Lydda
  rationale: Translittération française usuelle du nom de lieu grec.
- source_word: τὸν Σαρῶνα
  choice: le Sharon
  rationale: Σαρών désigne la région ou plaine de Sharon. L’article français convient au nom de cette région sans ajouter dans le texte principal le terme explicatif « plaine ».
- source_word: οἵτινες
  choice: et ils
  rationale: Dans le récit, le relatif reprend les habitants qui viennent d’être mentionnés et introduit leur réaction. Une coordination rend clairement et naturellement cette progression en français.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: se tournèrent vers le Seigneur
  rationale: La formulation conserve l’image et le sens spirituel de l’orientation vers le Seigneur, sans imposer l’idée d’un retour après abandon ni employer un vocabulaire théologique plus interprétatif.
- source_word: κύριον
  choice: Seigneur
  rationale: Rendu normal du titre κύριος dans le Nouveau Testament; le contexte renvoie vraisemblablement à Jésus, mais la traduction n’ajoute pas son nom.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: le Seigneur
  alternative: le Seigneur Jésus
  rationale: Le contexte d’Actes 9 indique fortement Jésus, mais le grec porte seulement τὸν κύριον. Le texte traduit donc le titre sans explicitation.
- issue: Portée de ἐπέστρεψαν
  choice: se tournèrent vers
  alternative: revinrent vers; se convertirent au
  rationale: « Se tournèrent vers » préserve l’idée de conversion ou de réorientation spirituelle tout en évitant d’affirmer un état religieux antérieur ou d’introduire un terme doctrinal plus spécialisé.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. Les noms de lieux sont rendus selon leurs formes françaises usuelles.
