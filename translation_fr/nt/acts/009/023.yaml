source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: fr
  text: Au bout de plusieurs jours, les Juifs[a] complotèrent de le tuer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque dit « les Juifs ». Dans ce contexte, elle désigne le groupe qui s’opposait à Saul, et non tous les Juifs sans exception.
    reason: cultural_note
  - marker: b
    text: 'Ou : « se concertèrent pour le tuer » ; littéralement, « prirent conseil ensemble pour le tuer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Après que
  rationale: Introduit la transition temporelle et s’accorde naturellement avec l’idée d’une période considérable arrivée à son terme; δέ n’exige pas ici un connecteur français distinct.
- source_word: ἐπληροῦντο
  choice: se furent écoulés
  rationale: Avec « jours » pour sujet, le passif de πληρόω exprime idiomatiquement l’accomplissement ou l’écoulement du temps. Cette formulation française est naturelle tout en gardant l’idée d’une durée achevée.
- source_word: ἡμέραι ἱκαναί
  choice: un grand nombre de jours
  rationale: ἱκαναί indique ici une quantité considérable, et non simplement suffisante. La formulation rend explicitement cette durée notable.
- source_word: συνεβουλεύσαντο
  choice: complotèrent ensemble
  rationale: Le verbe désigne une concertation commune dont le but hostile est précisé par l’infinitif suivant. « Complotèrent ensemble » conserve à la fois la délibération collective et l’intention meurtrière.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Reproduit sans restriction interprétative la désignation grecque. Une note précise que, dans ce contexte, elle vise le groupe impliqué dans le complot et non chaque Juif sans exception.
- source_word: ἀνελεῖν
  choice: de le tuer
  rationale: ἀναιρέω désigne ici le fait d’ôter la vie. « Tuer » est direct et n’ajoute ni qualification juridique ni nuance absente du verbe.
- source_word: αὐτόν
  choice: le
  rationale: Pronom objet renvoyant à Saul dans le contexte immédiat.
theological_decisions:
- issue: Portée de οἱ Ἰουδαῖοι dans un récit d’hostilité
  choice: les Juifs
  alternative: les Judéens / les chefs juifs
  rationale: Le texte ne précise ni une origine judéenne particulière ni une fonction dirigeante. La traduction conserve donc la formulation grecque, tandis qu’une note prévient une généralisation abusive à l’ensemble du peuple juif.
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait marque l’antériorité de la longue période par rapport au complot. « Complotèrent ensemble » garde la dimension collective de συνεβουλεύσαντο sans alourdir la phrase.
