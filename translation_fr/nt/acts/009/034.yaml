id: ACT.9.34
reference: Acts 9:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: fr
  text: 'Et Pierre lui dit : « Énée, Jésus le Messie te guérit. Lève-toi et fais toi-même ton lit. » Aussitôt, il se leva.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰᾶταί
  choice: te guérit
  rationale: Le présent de ἰάομαι est rendu par un présent français qui conserve la force déclarative et effective de la parole, sans imposer ni un déroulement (« est en train de te guérir ») ni un accompli (« t’a guéri »).
- source_word: Χριστός
  choice: le Messie
  rationale: Dans cette déclaration, Χριστός fonctionne comme un titre appliqué à Jésus. « Le Messie » en exprime le sens titulaire en français courant.
- source_word: ἀνάστηθι
  choice: Lève-toi
  rationale: Impératif naturel en français pour ordonner à un homme alité de se mettre debout.
- source_word: στρῶσον σεαυτῷ
  choice: fais toi-même ton lit
  rationale: στρώννυμι désigne ici l’action de préparer ou d’arranger sa couche. « Fais ton lit » est idiomatique, tandis que « toi-même » restitue la valeur de σεαυτῷ et souligne la capacité retrouvée d’Énée.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rend avec naturel l’immédiateté exprimée par εὐθέως.
- source_word: ἀνέστη
  choice: il se leva
  rationale: Reprend clairement le verbe de l’ordre précédent et rapporte son exécution immédiate dans un registre narratif digne.
- source_word: Αἰνέα
  choice: Énée
  rationale: Forme française traditionnelle et intelligible du nom grec Αἰνέας.
theological_decisions:
- issue: Valeur de Χριστός dans la déclaration de guérison
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: La traduction retenue maintient explicitement la valeur de titre de Χριστός. « Jésus-Christ » reste possible selon l’usage français, mais peut être perçu comme un nom composé et rendre moins visible le sens du titre.
- issue: Agent de la guérison
  choice: Jésus le Messie te guérit
  alternative: Tu es guéri par Jésus le Messie
  rationale: La construction active conserve Jésus comme sujet grammatical, conformément au grec, et met directement en relief son action guérissante.
translation_notes:
  register: Français moderne, international et digne. Le discours direct reste simple et énergique. « Fais toi-même ton lit » est plus explicite que le seul idiome « fais ton lit » afin de préserver le pronom réfléchi grec sans produire la tournure lourde « fais ton lit pour toi-même ».
