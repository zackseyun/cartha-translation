id: ACT.9.27
reference: Acts 9:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: fr
  text: Mais Barnabé le prit avec lui et le conduisit auprès des apôtres. Il leur raconta comment, sur la route, Saul avait vu le Seigneur, que le Seigneur lui avait parlé, et comment, à Damas, Saul avait parlé avec assurance au nom de Jésus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτόν
  choice: le prit avec lui
  rationale: Cette formulation naturelle conserve l’idée de prise en charge et d’accompagnement portée ici par ἐπιλαμβάνομαι, sans suggérer une saisie hostile.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: le conduisit auprès des apôtres
  rationale: ἄγω signifie conduire ou amener. « Conduisit auprès de » exprime clairement que Barnabé accompagne Saul et le présente aux apôtres.
- source_word: διηγήσατο αὐτοῖς
  choice: Il leur raconta
  rationale: διηγέομαι désigne le fait de relater ou raconter les événements; « raconta » restitue mieux cette nuance que le simple « dit ».
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: comment, sur la route
  rationale: ὁδός désigne ici la route du voyage vers Damas, non le mouvement appelé « la Voie ».
- source_word: εἶδεν τὸν κύριον
  choice: Saul avait vu le Seigneur
  rationale: Le plus-que-parfait convient au récit rétrospectif en français. La reprise explicite de « Saul » lève une ambiguïté pronominale propre au français sans modifier le référent contextuel.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: que le Seigneur lui avait parlé
  rationale: Le sujet implicite de ἐλάλησεν est le Seigneur mentionné juste avant. Le nommer de nouveau évite que le français fasse comprendre que Saul aurait parlé au Seigneur.
- source_word: ἐπαρρησιάσατο
  choice: avait parlé avec assurance
  rationale: παρρησιάζομαι exprime une parole libre, ouverte et hardie. « Parler avec assurance » préserve cette portée sans préciser indûment qu’il s’agissait formellement de prédication.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: au nom de Jésus
  rationale: Cette tournure française consacrée conserve l’idiome biblique, avec ses connotations d’autorité, de confession et de relation à Jésus.
theological_decisions:
- issue: Référent du titre κύριος dans le récit de la rencontre sur la route
  choice: « le Seigneur » désigne Jésus
  alternative: Une référence divine plus générale
  rationale: Dans le contexte immédiat d’Actes 9, Saul rencontre Jésus ressuscité; la fin du verset, « au nom de Jésus », confirme ce lien. Le titre « Seigneur » conserve sa portée christologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétée « comment… que… et comment… » suit l’articulation grecque tout en restant naturelle. Les noms « le Seigneur » et « Saul » remplacent certains pronoms afin d’éviter des contresens de référent en français.
