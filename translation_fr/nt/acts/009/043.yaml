base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: fr
  text: Pierre resta pendant de nombreux jours à Joppé chez un certain Simon[a], un tanneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auprès d’un certain Simon ». Dans ce contexte, le grec peut désigner le fait de séjourner chez lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: resta
  rationale: La tournure ἐγένετο avec l’infinitif est rendue naturellement par un verbe principal en français, sans le calque lourd « il arriva qu’il resta ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Cette particule assure ici une transition narrative légère. En français courant, la continuité du récit est naturelle sans ajouter « et » ou « alors ».
- source_word: ἡμέρας ἱκανὰς
  choice: assez longtemps
  rationale: L’expression désigne une durée notable, littéralement « un nombre considérable de jours ». « Assez longtemps » est idiomatique et conserve cette portée sans lourdeur.
- source_word: ἐν Ἰόππῃ
  choice: à Joppé
  rationale: La forme française traditionnelle et courante du toponyme biblique est « Joppé » ; la préposition « à » convient à un nom de ville.
- source_word: παρά τινι Σίμωνι
  choice: chez un certain Simon
  rationale: παρά avec le datif indique ici que Pierre séjourne auprès de Simon, vraisemblablement dans sa maison. « Chez » exprime précisément et naturellement cette relation en français, tandis que τινι est conservé par « un certain ».
- source_word: βυρσεῖ
  choice: qui était tanneur
  rationale: βυρσεύς désigne spécifiquement un artisan qui traite les peaux. La proposition relative évite l’ambiguïté française de l’apposition « Simon, un tanneur » tout en identifiant clairement son métier.
