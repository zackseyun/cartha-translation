id: ACT.9.39
reference: Acts 9:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: fr
  text: Alors Pierre se leva et partit avec eux. À son arrivée, ils le firent monter dans la pièce à l’étage. Toutes les veuves se tinrent près de lui[a], en pleurant et en lui montrant les tuniques et les vêtements[b] que Dorcas[c] confectionnait lorsqu’elle était avec elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se présentèrent devant lui ». Le grec peut décrire soit leur position auprès de Pierre, soit leur venue devant lui.
    reason: lexical_alternative
  - marker: b
    text: 'Les deux mots grecs désignent des catégories distinctes de vêtements : le premier, des tuniques; le second, des vêtements souvent portés par-dessus.'
    reason: cultural_note
  - marker: c
    text: Dorcas est le nom grec de cette femme, également appelée Tabitha en Actes 9.36.
    reason: cross_reference
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste introduit la réaction de Pierre et exprime naturellement le fait de se mettre en mouvement.
- source_word: συνῆλθεν αὐτοῖς
  choice: partit avec eux
  rationale: Dans ce contexte, le verbe signifie que Pierre accompagne les messagers; cette formulation est naturelle et précise.
- source_word: παραγενόμενον
  choice: À son arrivée
  rationale: Le participe marque ici le moment où l’action suivante se produit.
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: ils le conduisirent dans la pièce à l’étage
  rationale: La formulation rend à la fois l’accompagnement vers le haut et le sens concret d’une pièce située à l’étage, sans archaïsme inutile.
- source_word: παρέστησαν αὐτῷ
  choice: se tinrent près de lui
  rationale: Le grec décrit la présence des veuves auprès de Pierre; la tournure conserve la dimension spatiale sans imposer une présentation formelle.
- source_word: κλαίουσαι
  choice: en pleurant
  rationale: Le participe présent dépeint leur deuil en cours au moment où elles entourent Pierre.
- source_word: ἐπιδεικνύμεναι
  choice: en lui montrant
  rationale: Le verbe indique qu’elles présentent les vêtements à Pierre pour qu’il les voie.
- source_word: χιτῶνας καὶ ἱμάτια
  choice: les tuniques et les vêtements
  rationale: « Tuniques » conserve la catégorie antique du premier terme, tandis que « vêtements » rend sans surinterprétation le second terme, plus large.
- source_word: ὅσα ἐποίει
  choice: que Dorcas confectionnait
  rationale: L’imparfait français correspond bien à l’imparfait grec et laisse ouverte la nuance entre activité répétée et activité passée en cours.
- source_word: μετ’ αὐτῶν οὖσα
  choice: lorsqu’elle était avec elles
  rationale: La traduction conserve le lien explicite avec les veuves sans ajouter que les vêtements avaient nécessairement été fabriqués pour elles.
theological_decisions:
- issue: Lien entre Dorcas, les veuves et les vêtements
  choice: « lorsqu’elle était avec elles »
  alternative: « qu’elle confectionnait pour elles »
  rationale: Le grec dit que Dorcas était avec les veuves, non explicitement que chaque vêtement leur était destiné. La traduction préserve cette distinction.
translation_notes:
  register: Français international moderne, naturel et digne. « Pièce à l’étage » évite l’expression plus traditionnelle mais moins courante « chambre haute ». L’imparfait « confectionnait » préserve la souplesse aspectuelle du grec.
