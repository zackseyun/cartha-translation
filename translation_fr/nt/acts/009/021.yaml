source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: fr
  text: 'Tous ceux qui l’entendaient étaient stupéfaits et disaient : « N’est-ce pas lui qui a fait des ravages à Jérusalem parmi ceux qui invoquent ce nom[a] ? Et n’était-il pas venu ici pour cela : les amener ligotés devant les grands prêtres ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « font appel à ce nom ». L’expression renvoie, dans le contexte, au nom de Jésus, tout en le laissant implicite.'
    reason: alternative de traduction et clarification contextuelle de l’idiome
lexical_decisions:
- source_word: ἐξίσταντο
  choice: étaient stupéfaits
  rationale: L’imparfait exprime l’étonnement persistant des auditeurs; « stupéfaits » rend naturellement la forte réaction indiquée par le verbe.
- source_word: πάντες οἱ ἀκούοντες
  choice: tous ceux qui l’entendaient
  rationale: Le participe substantivé désigne l’ensemble des personnes qui entendaient Saul; le pronom objet, implicite en grec, est requis par le français naturel.
- source_word: πορθήσας
  choice: faisait des ravages parmi
  rationale: Cette expression française idiomatique conserve la violence de πορθέω, plus forte qu’une simple mention de persécution, sans suggérer que les personnes ont toutes été tuées.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: ceux qui invoquent ce nom
  rationale: « Invoquer » restitue clairement l’appel religieux ou confessionnel exprimé par ἐπικαλέομαι, tout en maintenant le référent implicite de « ce nom ».
- source_word: εἰς τοῦτο
  choice: précisément pour
  rationale: La tournure exprime le but de la venue; « précisément » rend l’insistance de l’expression grecque dans un français fluide.
- source_word: ἐληλύθει
  choice: n’était-il pas venu
  rationale: Le plus-que-parfait grec situe cette venue avant la réaction présente des auditeurs; la forme interrogative suit la portée de οὐχ.
- source_word: δεδεμένους
  choice: ligotés
  rationale: Le participe parfait passif décrit les personnes maintenues dans un état de contrainte. « Ligotés » est concret sans préciser indûment qu’il s’agissait de chaînes.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: les amener … aux grands prêtres
  rationale: « Amener » rend ἄγω, tandis que « aux grands prêtres » conserve le mouvement vers les autorités désignées par ἐπί avec l’accusatif.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Au pluriel, le terme désigne les autorités issues du milieu sacerdotal supérieur, et non plusieurs titulaires simultanés de la fonction unique de grand prêtre.
theological_decisions:
- issue: Expliciter ou non le référent de « ce nom »
  choice: Conserver « ce nom » dans le texte principal
  alternative: le nom de Jésus
  rationale: Le grec garde le référent implicite. Le contexte l’identifie comme Jésus; l’expliciter dans le texte principal supprimerait une formulation rhétorique et théologiquement chargée de l’original.
- issue: Force du verbe décrivant les actes antérieurs de Saul
  choice: faisait des ravages parmi
  alternative: persécutait
  rationale: πορθέω évoque une action destructrice violente. Une simple traduction par « persécutait » en atténuerait la force.
- issue: Portée interrogative de la seconde proposition
  choice: Et n’était-il pas venu ici précisément pour… ?
  alternative: Et il était venu ici précisément pour…
  rationale: La proposition demeure intégrée à la question rhétorique introduite par οὐχ, lecture que la syntaxe et la ponctuation de la source soutiennent naturellement.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la question rhétorique, le plus-que-parfait de la venue antérieure et la force du verbe décrivant les ravages causés par Saul.
