revisions:
- from: 'Tous ceux qui l’entendaient étaient stupéfaits et disaient : « N’est-ce pas lui qui, à Jérusalem, faisait des ravages parmi ceux qui invoquent ce nom[a] ? Et n’était-il pas venu ici précisément pour les amener ligotés aux grands prêtres ? »'
  to: 'Tous ceux qui l’entendaient étaient stupéfaits et disaient : « N’est-ce pas lui qui a fait des ravages à Jérusalem parmi ceux qui invoquent ce nom[a] ? Et n’était-il pas venu ici pour cela : les amener ligotés devant les grands prêtres ? »'
  rationale: La révision remplace l’imparfait par un passé composé pour rendre l’action antérieure accomplie exprimée par πορθήσας, évite l’intensification ajoutée par « précisément », et reformule la note afin de préserver dans le texte et dans son explication la retenue du grec quant au référent de « ce nom ». « Devant les grands prêtres » restitue naturellement la présentation à une autorité.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:10:01Z'
review_pass:
  verdict: revise
  source_fidelity: La question rhétorique, l’imparfait d’étonnement, le plus-que-parfait de la venue, le démonstratif « ce nom » et le but exprimé par ἵνα sont bien rendus. Toutefois, « faisait des ravages » emploie un imparfait là où le participe aoriste πορθήσας présente l’action antérieure de Saul comme accomplie; un passé composé rend mieux ce rapport. « Précisément » ajoute une insistance qui n’est pas explicitement portée par εἰς τοῦτο.
  naturalness: Le français est globalement naturel et accessible. « A fait des ravages à Jérusalem parmi ceux qui… » est idiomatique, conserve la vigueur du verbe et s’insère naturellement dans la question.
  terminology: « Invoquent ce nom » conserve l’idiome sans expliciter Jésus dans le texte. « Grands prêtres » est le rendu historique usuel du pluriel ἀρχιερεῖς. « Devant les grands prêtres » exprime de manière naturelle la comparution visée par ἐπὶ τοὺς ἀρχιερεῖς.
  issues:
  - severity: medium
    issue: Aspect de « faisait des ravages »
    rationale: Le participe aoriste πορθήσας désigne les actes antérieurs de Saul comme un fait accompli dans la question des auditeurs. Le passé composé « a fait des ravages » conserve le sens violent tout en respectant mieux cet aspect.
  - severity: low
    issue: Ajout de « précisément »
    rationale: εἰς τοῦτο signifie « pour cela / dans ce but ». « Précisément » peut être compatible avec le contexte, mais ajoute une focalisation non nécessaire; « pour cela » est plus directement fidèle.
  - severity: low
    issue: Note sur « ce nom » trop affirmative et interprétative
    rationale: Le contexte renvoie clairement à Jésus, mais le grec maintient le référent implicite. La note devrait signaler cet idiome et son référent contextuel sans transformer « reconnaître son autorité » en composante explicite du sens lexical.
