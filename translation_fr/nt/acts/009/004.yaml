  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: fr
  text: 'Il tomba à terre et entendit une voix qui lui disait : « Saul, Saul, pourquoi me persécutes-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: Il tomba à terre
  rationale: Le participe aoriste décrit ici une action liée au verbe principal. Une proposition coordonnée rend naturellement en français le mouvement vers le sol sans préciser davantage la relation temporelle.
- source_word: ἤκουσεν φωνὴν
  choice: entendit une voix
  rationale: Comme la voix prononce des paroles intelligibles, « voix » convient mieux que le terme plus général « son ».
- source_word: λέγουσαν αὐτῷ
  choice: qui lui disait
  rationale: La proposition relative restitue naturellement le participe grec accordé avec « voix » et introduit les paroles rapportées.
- source_word: Σαοὺλ Σαούλ
  choice: Saoul, Saoul
  rationale: La forme française « Saoul » distingue le nom hébreu porté à ce point du récit de la forme ultérieure « Paul » et conserve la répétition emphatique de l'appel.
- source_word: τί
  choice: pourquoi
  rationale: Dans cette construction interrogative, τί exprime la raison et se traduit idiomatiquement par « pourquoi ».
- source_word: με
  choice: me
  rationale: Le pronom objet direct est conservé sans explicitation afin de maintenir l'identification frappante du locuteur avec ceux que Saoul persécute.
- source_word: διώκεις
  choice: persécutes-tu
  rationale: Dans le contexte des Actes, le verbe désigne la poursuite hostile des croyants. Le présent français préserve l'action en cours, et l'inversion convient à une question directe dans un registre digne.
theological_decisions:
- issue: Identification du locuteur avec les personnes attaquées par Saoul
  choice: Conserver la formulation directe « me » sans ajout explicatif.
  alternative: Développer par « mes disciples », « mon peuple » ou « ceux qui m'appartiennent ».
  rationale: Le texte identifie directement le locuteur aux personnes persécutées. Une explicitation réduirait ou résoudrait la portée théologique que la formulation elle-même laisse au lecteur.
translation_notes:
  register: 'Français international moderne, clair et digne. La coordination « Il tomba… et entendit » est plus naturelle qu''un participe présent ambigu. Le vouvoiement est écarté : le singulier « tu » correspond nettement à l''adresse individuelle du grec.'
