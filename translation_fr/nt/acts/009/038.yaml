id: ACT.9.38
reference: Acts 9:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: fr
  text: 'Comme Lydda était proche de Joppé, les disciples, ayant appris que Pierre s’y trouvait, lui envoyèrent deux hommes avec cette demande pressante : « Ne tarde pas à venir jusqu’à nous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « N’hésite pas à venir jusqu’à nous ». Le verbe grec peut exprimer l’hésitation ou le retard ; le texte principal retient le sens qui convient le mieux à cette demande urgente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης
  choice: Comme … était proche
  rationale: Le génitif absolu fournit la circonstance qui motive la démarche des disciples. « Comme » exprime naturellement ce lien en français sans ajouter de marqueur temporel absent du grec.
- source_word: Λύδδας / Ἰόππῃ
  choice: Lydda / Joppé
  rationale: Ces formes correspondent aux noms traditionnellement employés en français pour ces lieux dans le contexte du Nouveau Testament.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: « Disciples » est le terme français courant et précis pour les membres de la communauté croyante désignés ici.
- source_word: ἀκούσαντες
  choice: ayant appris
  rationale: Le participe aoriste indique une information reçue avant l’envoi des deux hommes. « Ayant appris » rend clairement cette antériorité.
- source_word: ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: que Pierre s’y trouvait
  rationale: « Y » renvoie naturellement à Lydda, et l’imparfait français convient au discours indirect dépendant d’un récit au passé.
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: lui envoyèrent deux hommes
  rationale: Cette formulation directe conserve le verbe d’envoi, le nombre et la destination exprimés par le grec.
- source_word: παρακαλοῦντες
  choice: avec cette demande pressante
  rationale: Dans ce contexte, le participe exprime une requête insistante. Cette tournure française en conserve la force tout en évitant une construction participiale ambiguë.
- source_word: Μὴ ὀκνήσῃς
  choice: Ne tarde pas
  rationale: Le verbe peut évoquer le retard, l’hésitation ou la réticence. Dans cette demande urgente de déplacement, « Ne tarde pas » est le sens contextuel le plus naturel, sans exclure l’autre nuance signalée en note.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: à venir jusqu’à nous
  rationale: Le déplacement est envisagé du point de vue des personnes qui parlent. « Venir jusqu’à nous » rend à la fois la direction et la portée de l’expression grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la relation circonstancielle du génitif absolu et l’urgence de la requête, tout en évitant un calque lourd des participes grecs. Le marqueur de note est placé après la proposition qu’il explique.
