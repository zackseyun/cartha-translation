  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: fr
  text: Pendant trois jours, il fut sans pouvoir voir, et ne mangea ni ne but[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ne voyant pas ». L’expression indique que Saul ne pouvait pas voir.'
