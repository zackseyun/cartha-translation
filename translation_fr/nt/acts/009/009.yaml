lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: Pendant trois jours, il resta
  rationale: L’accusatif ἡμέρας τρεῖς exprime une durée. « Pendant trois jours » est naturel en français. « Il resta » rend idiomatiquement l’état prolongé exprimé par ἦν dans ce contexte, sans ajouter l’idée d’un déplacement.
- source_word: μὴ βλέπων
  choice: sans voir
  rationale: Le participe signifie littéralement « ne voyant pas ». « Sans voir » reste proche de la formulation grecque et évite d’introduire dans le texte principal l’adjectif plus catégorique « aveugle », bien que l’incapacité de voir soit clairement impliquée.
- source_word: οὐκ ἔφαγεν οὐδὲ ἔπιεν
  choice: ne mangea ni ne but
  rationale: La construction coordonne deux verbes niés. « Ne mangea ni ne but » est une formulation française concise et fidèle aux aoristes grecs.
