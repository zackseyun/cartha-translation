revisions:
- from: Pendant trois jours, il resta sans voir[a] et ne mangea ni ne but.
  to: Pendant trois jours, il fut sans pouvoir voir, et ne mangea ni ne but[a].
  rationale: La révision remplace « resta » par « fut » afin de ne pas ajouter une nuance de maintien absente de ἦν, et remplace « sans voir » par « sans pouvoir voir » pour une expression française plus naturelle de l’incapacité. La note est conservée et légèrement harmonisée. L’ancre est placée après la proposition concernée, sans affecter le sens.
