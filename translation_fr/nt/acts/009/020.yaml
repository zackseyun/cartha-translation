  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: fr
  text: 'Aussitôt, dans les synagogues, il se mit à proclamer Jésus[a] : « C’est lui qui est le Fils de Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il proclamait Jésus ». Le verbe grec désigne une proclamation publique ; le contexte permet de comprendre ici le commencement de cette activité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui-ci est le Fils de Dieu ». Le démonstratif grec souligne que Jésus est bien celui qui est le Fils de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rend directement l’idée d’immédiateté et conserve l’élan narratif dans un français naturel et digne.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: dans les synagogues
  rationale: Préserve la valeur locative de ἐν et le pluriel du texte grec.
- source_word: ἐκήρυσσεν
  choice: il se mit à proclamer
  rationale: « Proclamer » exprime l’annonce publique portée par κηρύσσω. La tournure « se mit à » rend naturellement la valeur initiale suggérée par le contexte et l’imparfait grec, sans réduire l’action à un sermon au sens ecclésiastique moderne.
- source_word: τὸν Ἰησοῦν
  choice: Jésus
  rationale: Maintient Jésus comme complément d’objet direct de « proclamer », conformément à la construction grecque compacte et centrée sur sa personne.
- source_word: ὅτι οὗτός ἐστιν
  choice: « C’est lui »
  rationale: La formulation française introduit naturellement le contenu de la proclamation et garde l’accent identificatoire du démonstratif οὗτός, plus marqué qu’un simple « il ».
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Traduction directe et traditionnelle du titre christologique, qui conserve l’article défini et la force de l’expression grecque.
theological_decisions:
- issue: Titre christologique dans la proclamation de Saul
  choice: le Fils de Dieu
  alternative: le Fils de Dieu est celui-ci
  rationale: La traduction conserve sans réduction ni amplification l’affirmation explicite du texte grec concernant Jésus.
- issue: Force identificatoire de οὗτός
  choice: C’est lui
  alternative: Celui-ci est
  rationale: « C’est lui » préserve l’emphase sur l’identité de Jésus tout en étant plus naturel en français moderne que le calque « celui-ci est ».
translation_notes:
  register: Français international moderne, clair et digne. La construction conserve Jésus comme objet direct de la proclamation, tandis que les deux-points et la formulation « C’est lui » rendent lisible en français le contenu introduit par ὅτι et l’emphase de οὗτός.
