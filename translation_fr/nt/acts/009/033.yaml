source:
  edition: SBLGNT
  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: fr
  text: Il y trouva un homme nommé Énée, couché sur un lit depuis huit ans[a] et paralysé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « couché sur une paillasse » ou « sur une couchette ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: Il y trouva
  rationale: Le passé simple convient à la progression narrative, tandis que « y » rend naturellement le repère locatif ἐκεῖ. δέ marque ici une simple continuation, que l’enchaînement français peut exprimer sans conjonction explicite.
- source_word: ἄνθρωπόν τινα
  choice: un homme
  rationale: τις présente une personne particulière jusque-là inconnue. En français moderne, l’article indéfini remplit naturellement cette fonction; « un certain homme » serait inutilement marqué.
- source_word: ὀνόματι Αἰνέαν
  choice: nommé Énée
  rationale: Cette tournure rend idiomatiquement le datif ὀνόματι suivi du nom propre; Αἰνέας est rendu par sa forme française établie « Énée ».
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: depuis huit ans
  rationale: L’expression indique une situation commencée huit ans auparavant et toujours en cours au moment du récit; « depuis huit ans » en rend précisément la durée.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: couché sur un grabat
  rationale: 'La traduction conserve l’image concrète du texte grec: l’homme est étendu sur un couchage rudimentaire. « Grabat » est plus précis que le terme général « lit ».'
- source_word: ὃς ἦν παραλελυμένος
  choice: et paralysé
  rationale: Le participe parfait avec ἦν décrit l’état durable de l’homme. La coordination française évite une relative lourde tout en conservant cette description distincte.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La formulation reste concise et conserve le détail concret du grabat ainsi que l’état durable de paralysie, sans expliciter un rapport causal que le grec ne formule pas.
