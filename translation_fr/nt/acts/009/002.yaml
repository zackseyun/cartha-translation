reference: Acts 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: fr
  text: Il lui demanda des lettres pour les synagogues de Damas, afin que, s’il trouvait des hommes comme des femmes appartenant à la Voie[a], il puisse les amener ligotés à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la Voie » ou « qui suivaient la Voie ». Le grec emploie une ancienne désignation du mouvement chrétien.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: Il lui demanda
  rationale: Avec αἰτέω, παρά + génitif désigne la personne à qui la demande est adressée. « Il lui demanda des lettres » est naturel en français et conserve la notion de requête.
- source_word: ἐπιστολὰς
  choice: des lettres
  rationale: Le nom désigne directement des lettres. Le contexte peut impliquer une autorisation, mais il n’est pas nécessaire de l’expliciter dans le texte.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: destinées aux synagogues de Damas
  rationale: 'Cette formulation française rend clairement les deux compléments grecs : Damas est la destination et les synagogues sont les destinataires.'
- source_word: ὅπως ἐάν
  choice: afin que, s’il
  rationale: « Afin que » exprime le but introduit par ὅπως, tandis que « s’il » maintient la condition éventuelle exprimée par ἐάν et le subjonctif.
- source_word: τινας … ἄνδρας τε καὶ γυναῖκας
  choice: des hommes ou des femmes
  rationale: Dans cette proposition conditionnelle, « des hommes ou des femmes » exprime naturellement l’éventualité indéfinie tout en conservant la mention explicite des deux sexes.
- source_word: τῆς ὁδοῦ ὄντας
  choice: appartenant à la Voie
  rationale: La formulation préserve la relation d’appartenance exprimée en grec et maintient « la Voie » comme désignation ancienne du mouvement chrétien, sans la remplacer par une paraphrase.
- source_word: δεδεμένους
  choice: ligotés
  rationale: Le participe parfait passif décrit des personnes maintenues dans un état où elles ont été liées. « Ligotés » est courant, précis et n’ajoute pas la mention spécifique de chaînes.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: il les amène … à Jérusalem
  rationale: Le subjonctif présent français convient après « afin que » et rend l’action projetée de conduire les personnes jusqu’à Jérusalem.
theological_decisions:
- issue: Sens de τῆς ὁδοῦ
  choice: la Voie
  alternative: les adeptes de la Voie / le mouvement appelé la Voie
  rationale: Le maintien de cette désignation historique préserve sa force de titre ancien et évite d’insérer dans le texte une explication interprétative.
- issue: Mention explicite de ἄνδρας τε καὶ γυναῖκας
  choice: des hommes ou des femmes
  alternative: quiconque / des gens
  rationale: La traduction conserve l’insistance du grec sur l’arrestation aussi bien des hommes que des femmes, au lieu de la réduire à un terme générique.
translation_notes:
  register: Français international moderne, clair et digne. « La Voie » est capitalisée comme désignation reconnue du mouvement. La phrase reste liée au contexte précédent, mais peut se lire comme le segment fourni.
