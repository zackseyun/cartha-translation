id: ACT.9.7
reference: Acts 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: fr
  text: Les hommes qui l’accompagnaient restaient debout, sans voix ; ils entendaient la voix, mais ne voyaient personne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: Les hommes
  rationale: Le groupe nominal est direct. La légère valeur connective de δέ n’a pas besoin d’être explicitée en français dans cette phrase.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: qui voyageaient avec lui
  rationale: συνοδεύω désigne le fait d’accompagner quelqu’un en voyage; cette formulation est naturelle et conserve le cadre du déplacement.
- source_word: εἱστήκεισαν
  choice: restaient là
  rationale: Le plus-que-parfait de ἵστημι a ici une valeur résultative ou stative. « Restaient là » exprime leur immobilité sans affirmer qu’ils étaient nécessairement debout, nuance que le verbe grec peut laisser ouverte dans ce contexte.
- source_word: ἐνεοί
  choice: sans voix
  rationale: ἐνεός indique l’incapacité de parler ou un silence frappant. « Sans voix » rend naturellement en français le mutisme provoqué par la stupeur.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: entendant la voix
  rationale: φωνή peut désigner une voix ou un son. Ici, « la voix » suit le sens personnel le plus immédiat et laisse subsister la tension avec Actes 22.9 plutôt que de l’harmoniser dans la traduction.
- source_word: μηδένα δὲ θεωροῦντες
  choice: mais ne voyant personne
  rationale: θεωρέω signifie voir ou observer, et μηδένα indique qu’aucune personne n’était visible.
theological_decisions:
- issue: Tension apparente entre Actes 9.7 et Actes 22.9 au sujet de ce que les compagnons de Saul ont entendu
  choice: Traduire φωνή par « voix » et laisser la tension textuelle ouverte
  alternative: Traduire φωνή par « son » afin de distinguer la perception d’un bruit de la compréhension d’une voix
  rationale: Le grec autorise les deux sens, mais il n’énonce pas explicitement la distinction entre entendre un son et comprendre des paroles. « Voix » rend directement φωνή dans ce contexte personnel sans imposer une harmonisation avec Actes 22.9.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste concise; « sans voix » est idiomatique sans être familière. Aucun marqueur de note n’est requis.
