id: ACT.17.28
reference: Acts 17:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: fr
  text: 'Car c’est en lui que nous vivons, que nous sommes en mouvement et que nous existons, comme l’ont dit certains de vos propres poètes : « Car nous aussi, nous sommes de sa descendance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Conserve l’expression grecque et son lien direct avec Dieu dans le contexte, sans en préciser davantage la portée.
- source_word: κινούμεθα
  choice: nous nous mouvons
  rationale: Rend le sens de mouvement ou d’activité tout en maintenant le parallélisme avec « vivons » et « existons ».
- source_word: ἐσμέν
  choice: nous existons
  rationale: Dans cette série, « existons » exprime clairement l’être ou l’existence et évite le français incomplet « nous sommes » sans attribut.
- source_word: τῶν καθ’ ὑμᾶς ποιητῶν
  choice: de vos propres poètes
  rationale: Formulation française naturelle qui transmet l’idée de poètes appartenant au monde culturel des auditeurs.
- source_word: γένος
  choice: descendance
  rationale: Dans la citation poétique, le terme désigne la lignée ou la race issue de quelqu’un; « descendance » garde ce rapport d’origine sans suggérer à lui seul une filiation spirituelle au sens doctrinal.
theological_decisions:
- issue: Portée de « en lui »
  choice: Maintien littéral de « en lui »
  alternative: « grâce à lui » ou « par lui »
  rationale: Le grec exprime ἐν, et le maintien de « en » préserve la formulation forte ainsi que son ambiguïté conceptuelle sans la réduire à la seule causalité.
- issue: Sens de la citation « nous sommes de sa descendance »
  choice: Conserver l’affirmation de parenté d’origine dans son cadre poétique
  alternative: « nous sommes ses enfants »
  rationale: « Enfants » risquerait d’importer une conception théologique plus précise de la filiation; « descendance » correspond mieux à γένος et maintient la tension du discours de Paul.
translation_notes:
  register: Français moderne, digne et accessible. Le triple rythme du grec est conservé. « Nous nous mouvons » est légèrement soutenu, mais reste intelligible et rend mieux le verbe distinct de « vivre » et d’« exister ».
