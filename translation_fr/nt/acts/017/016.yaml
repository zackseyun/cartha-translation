id: ACT.17.16
reference: Acts 17:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: fr
  text: Pendant que Paul les attendait à Athènes, il était profondément bouleversé dans son esprit[a] en voyant que la ville était pleine d’idoles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vivement irrité » ou « profondément indigné » ; le verbe grec exprime une vive agitation intérieure.
    reason: lexical_alternative
  - marker: b
    text: Ou « couverte d’idoles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: les attendait
  rationale: Le participe au présent fournit la circonstance temporelle et décrit une attente en cours. « Les attendait » est naturel en français moderne.
- source_word: παρωξύνετο
  choice: était profondément bouleversé
  rationale: L’imparfait grec décrit une vive réaction intérieure qui se prolonge. Cette formulation exprime la forte agitation du verbe sans la réduire à une simple tristesse ni préciser indûment qu’il s’agit uniquement de colère.
- source_word: τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ
  choice: dans son esprit
  rationale: La formulation conserve explicitement la référence à l’esprit de Paul tout en exprimant naturellement en français le caractère intérieur de sa réaction.
- source_word: θεωροῦντος
  choice: en voyant
  rationale: Le participe exprime une perception contemporaine de la réaction de Paul. « En voyant » est clair, concis et naturel.
- source_word: κατείδωλον
  choice: pleine d’idoles
  rationale: Cet adjectif rare décrit Athènes comme une ville remplie ou couverte d’idoles. « Pleine d’idoles » en donne le sens direct sans ajouter l’idée interprétative d’un abandon volontaire à l’idolâtrie.
- source_word: πόλιν
  choice: la ville
  rationale: Le grec dit explicitement « la ville », avec Athènes pour antécédent immédiat.
- source_word: δὲ
  choice: Pendant que
  rationale: Dans ce contexte, δέ assure une transition narrative légère, que la construction temporelle française rend sans ajouter un marqueur lourd comme « or » ou « mais ».
theological_decisions:
- issue: Référent de « son esprit »
  choice: L’esprit humain de Paul
  alternative: Une intervention ou une impulsion explicite du Saint-Esprit
  rationale: Le possessif αὐτοῦ et l’expression ἐν αὐτῷ présentent la réaction intérieure de Paul. La traduction n’attribue donc pas explicitement cette réaction au Saint-Esprit, sans exclure une compréhension théologique plus large.
translation_notes:
  register: Français international moderne, clair et digne. La tournure évite le calque peu naturel « son esprit s’irritait en lui », tout en maintenant explicitement la mention de l’esprit de Paul et l’intensité de sa réaction.
