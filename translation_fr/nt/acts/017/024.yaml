id: ACT.17.24
reference: Acts 17:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: fr
  text: Le Dieu qui a fait le monde et tout ce qui s’y trouve, lui qui est Seigneur du ciel et de la terre, n’habite pas dans des temples faits de main d’homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des temples construits par des mains humaines ». L’expression désigne des temples bâtis par des êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: qui a fait
  rationale: Le participe aoriste qualifie Dieu. « Qui a fait » est naturel en français et reste plus proche de ποιέω que « qui a créé ».
- source_word: κόσμον
  choice: le monde
  rationale: Dans ce contexte, κόσμος désigne l’ensemble du monde créé. « Le monde » est clair, courant et suffisamment large.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: tout ce qui s’y trouve
  rationale: Cette formulation rend de façon idiomatique la totalité de ce qui est dans le monde, tout en conservant la portée exhaustive de πάντα.
- source_word: οὗτος
  choice: lui
  rationale: Le pronom reprend avec insistance « le Dieu qui a fait… ». « Lui » conserve cette reprise sans produire le tour lourd « celui-ci ».
- source_word: ὑπάρχων κύριος
  choice: qui est Seigneur
  rationale: La proposition relative française exprime l’état existant indiqué par le participe, sans lui attribuer explicitement une valeur causale.
- source_word: οὐρανοῦ καὶ γῆς
  choice: du ciel et de la terre
  rationale: Les génitifs dépendent de κύριος. « Le ciel et la terre » est la paire française consacrée et correspond au singulier οὐρανοῦ.
- source_word: χειροποιήτοις
  choice: faits de main d’homme
  rationale: L’expression désigne ce qui est fabriqué par des êtres humains. Ce tour français conserve l’image des mains et le contraste avec l’action créatrice de Dieu.
- source_word: ναοῖς
  choice: temples
  rationale: ναός désigne ici des édifices sacrés considérés comme demeures divines. « Temples » est le terme général le plus clair dans le contexte athénien.
- source_word: κατοικεῖ
  choice: n’habite pas
  rationale: κατοικέω signifie habiter ou demeurer. « N’habite pas » est actuel et rend directement la négation d’une habitation divine dans les temples.
theological_decisions:
- issue: Transcendance divine et localisation dans les temples
  choice: Le Créateur, Seigneur du ciel et de la terre, n’habite pas dans des temples construits par des humains.
  alternative: Dieu n’est pas enfermé ou confiné dans les temples.
  rationale: La traduction conserve l’affirmation directe du grec sans développer la négation en une paraphrase théologique plus large sur le confinement de Dieu.
- issue: Valeur du participe ὑπάρχων
  choice: lui qui est Seigneur
  alternative: puisqu’il est Seigneur
  rationale: Le grec peut laisser percevoir un lien logique, mais le participe n’impose pas à lui seul une lecture explicitement causale. La formulation retenue préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. « Faits de main d’homme » garde l’image grecque traditionnelle, tandis que la note en donne une formulation immédiatement explicite. La reprise « lui qui est Seigneur » préserve l’accent de οὗτος et évite de rendre le participe causal.
