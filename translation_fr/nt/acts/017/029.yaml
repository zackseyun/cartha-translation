id: ACT.17.29
reference: Acts 17:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: fr
  text: Puisque nous sommes donc de la descendance de Dieu, nous ne devons pas penser que la divinité[a] soit semblable à de l’or, de l’argent ou de la pierre, façonnés en une image par l’art et la pensée humaine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Être divin », « la nature divine » ou « ce qui est divin ». Le grec τὸ θεῖον est une expression large désignant ce qui est divin ; dans l’argument de Paul, elle renvoie au vrai Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « un objet gravé » ou « une image sculptée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: descendance
  rationale: Dans le contexte immédiat, le terme exprime l’origine et la parenté des êtres humains avec Dieu. « Descendance » conserve cette image sans employer « race », devenu ambigu ou inadapté en français moderne.
- source_word: οὖν
  choice: Ainsi donc
  rationale: Cette expression marque clairement la conclusion que Paul tire de l’affirmation précédente.
- source_word: ὑπάρχοντες
  choice: puisque nous sommes
  rationale: 'Le participe a ici une valeur causale : Paul fonde son exhortation sur le fait que les humains sont la descendance de Dieu.'
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: nous ne devons pas penser
  rationale: La formulation exprime une obligation intellectuelle et morale, et non une simple impossibilité.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: à de l’or, à de l’argent ou à de la pierre
  rationale: La traduction conserve les trois matériaux et la construction comparative du grec.
- source_word: χαράγματι
  choice: une œuvre sculptée
  rationale: Le mot désigne un objet obtenu par gravure ou sculpture. « Œuvre sculptée » reste naturel en français tout en gardant l’idée d’un artefact.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: par le savoir-faire et l’imagination humains
  rationale: « Savoir-faire » rend la compétence artistique ou artisanale, tandis qu’« imagination » exprime la conception mentale à l’origine de l’objet. L’adjectif « humains » restitue le singulier générique ἀνθρώπου.
- source_word: τὸ θεῖον
  choice: la divinité
  rationale: Le substantif neutre désigne largement ce qui est divin. « La divinité » convient au registre philosophique du discours et peut, dans l’argument de Paul, renvoyer au vrai Dieu sans imposer une formulation métaphysique plus précise.
theological_decisions:
- issue: Sens de τὸ θεῖον dans un discours monothéiste formulé dans un registre philosophique
  choice: la divinité
  alternative: l’Être divin ; la nature divine ; ce qui est divin
  rationale: « La divinité » préserve l’étendue sémantique de l’expression grecque et le langage adapté à l’auditoire de l’Aréopage. Elle n’en fait ni une force impersonnelle ni un terme théologique technique postérieur.
- issue: Portée de γένος appliqué aux humains par rapport à Dieu
  choice: descendance de Dieu
  alternative: famille de Dieu ; lignée de Dieu ; issus de Dieu
  rationale: Le texte reprend un langage de provenance et de parenté sans développer ici une doctrine technique de filiation ou d’adoption. « Descendance » maintient cette tension figurée sans la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le raisonnement conclusif de Paul et le registre philosophique de son discours. Le tiret explicite l’apposition grecque entre les matériaux et l’objet façonné sans ajouter une relation absente du texte.
