id: ACT.17.19
reference: Acts 17:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: fr
  text: 'Alors ils le prirent avec eux et le conduisirent à l’Aréopage[a], en disant : « Pourrions-nous savoir quel est ce nouvel enseignement dont tu parles ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’« Aréopage » peut désigner la colline elle-même ou le conseil athénien qui lui était associé.
    reason: Note culturelle préservant l’ambiguïté du référent grec.
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: ils le prirent avec eux
  rationale: Le verbe peut exprimer le fait de saisir, de prendre par la main ou d’emmener. « Le prirent avec eux » conserve leur initiative concrète sans transformer la scène en arrestation formelle ni en simple invitation courtoise.
- source_word: τε
  choice: Alors
  rationale: La particule marque ici une légère progression narrative; « Alors » assure un enchaînement naturel en français.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: à l’Aréopage
  rationale: La translittération française usuelle préserve l’ambiguïté entre le lieu et le conseil qui lui est associé.
- source_word: ἤγαγον
  choice: le conduisirent
  rationale: ἄγω signifie couramment conduire ou amener. « Conduisirent » s’accorde naturellement avec l’idée qu’ils l’ont pris avec eux.
- source_word: λέγοντες
  choice: en disant
  rationale: Le gérondif rend le participe contemporain de l’action principale sans rompre la phrase.
- source_word: Δυνάμεθα γνῶναι
  choice: Pourrions-nous savoir
  rationale: La formulation fonctionne comme une demande polie. Le conditionnel français en restitue le ton mieux qu’une interrogation littérale sur la capacité.
- source_word: καινὴ
  choice: nouvel
  rationale: « Nouvel » exprime simplement ce qui est nouveau ou inconnu des interlocuteurs, sans la nuance péjorative possible de « étrange ».
- source_word: ἡ ὑπὸ σοῦ λαλουμένη
  choice: dont tu parles
  rationale: Cette formulation française naturelle rend le passif grec, littéralement « qui est dit par toi », sans lourdeur. Elle peut aussi se comprendre comme l’enseignement que Paul expose.
- source_word: διδαχή
  choice: enseignement
  rationale: « Enseignement » est clair, actuel et moins technique ou confessionnel que « doctrine ».
theological_decisions:
- issue: Nature de la prise en charge de Paul
  choice: Une conduite ferme, mais pas nécessairement hostile, vers l’Aréopage
  alternative: Une arrestation formelle; ou, à l’inverse, une simple invitation courtoise
  rationale: ἐπιλαμβάνομαι peut décrire une saisie physique, mais le contexte immédiat met surtout en avant la curiosité des interlocuteurs. La traduction maintient leur initiative sans conclure à une arrestation.
- issue: Sens de Ἄρειος Πάγος
  choice: Conserver le nom propre « Aréopage » sans préciser s’il désigne le lieu ou le conseil
  alternative: La colline de l’Aréopage; ou le conseil de l’Aréopage
  rationale: L’expression grecque peut renvoyer à la colline aussi bien qu’à l’institution qui lui est associée. Le texte principal préserve cette ambiguïté historique.
translation_notes:
  register: Français international moderne, naturel et digne. Le conditionnel exprime une demande polie; la tournure « dont tu parles » évite un passif artificiel tout en restant fidèle au sens du participe grec.
