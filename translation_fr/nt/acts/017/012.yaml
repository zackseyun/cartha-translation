id: ACT.17.12
reference: Acts 17:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: fr
  text: Ainsi, beaucoup d’entre eux crurent, ainsi qu’un nombre non négligeable[b] de femmes grecques de haut rang[a] et d’hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « respectables » ou « occupant une position sociale élevée ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pas peu nombreux », tournure qui désigne un nombre considérable.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Ainsi, beaucoup
  rationale: La combinaison μὲν οὖν assure à la fois la transition et le lien logique avec l’examen des Écritures au verset précédent. « Ainsi » exprime naturellement ce rapport en français sans traduire mécaniquement chaque particule.
- source_word: ἐξ αὐτῶν
  choice: d’entre eux
  rationale: Cette formulation conserve le sens partitif de ἐξ et renvoie naturellement aux personnes mentionnées dans le contexte précédent.
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: Le verbe « croire » rend directement πιστεύω et laisse son objet implicite, comme dans le grec, sans ajouter une formulation doctrinale absente du verset.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: de femmes grecques
  rationale: Ἑλληνίδων désigne ces femmes comme grecques, tandis que γυναικῶν signifie ici « femmes », aucune relation conjugale n’étant indiquée.
- source_word: τῶν εὐσχημόνων
  choice: de haut rang
  rationale: Dans ce contexte, εὐσχήμων évoque une position sociale reconnue et honorable. « De haut rang » communique clairement cette dimension en français moderne.
- source_word: οὐκ ὀλίγοι
  choice: un nombre non négligeable
  rationale: Cette tournure française restitue la litote grecque « pas peu » sans l’aplatir simplement en « beaucoup », tout en restant naturelle.
theological_decisions:
- issue: Faut-il expliciter l’objet ou le contenu de ἐπίστευσαν ?
  choice: crurent
  alternative: vinrent à la foi en Christ / crurent au message
  rationale: Le texte de ce verset ne précise pas l’objet du verbe, qui se comprend par le contexte. La traduction conserve cette formulation implicite et n’ajoute aucune précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la litote de Luc sous une forme idiomatique et rattache grammaticalement « de haut rang » aux femmes grecques, conformément à l’accord féminin du grec.
