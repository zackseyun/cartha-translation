  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: fr
  text: C’est à partir d’un seul homme[a] qu’il a fait tous les peuples humains, pour qu’ils habitent sur toute la surface de la terre, ayant fixé les temps qui leur étaient assignés[b] et les limites de leurs lieux d’habitation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à partir d’un seul ». Certains manuscrits portent : « à partir d’un seul sang ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « les temps fixés pour eux » ; le terme grec peut désigner des temps, des périodes ou des époques déterminés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: il a fait
  rationale: Le verbe ποιέω a ici un sens large. « Il a fait » exprime l’action créatrice de Dieu sans préciser davantage la manière dont elle s’est accomplie.
- source_word: ἐξ ἑνὸς
  choice: à partir d’un seul homme
  rationale: Le grec dit littéralement « à partir d’un seul ». En français, « homme » explicite naturellement le référent humain implicite, sans adopter la variante textuelle « un seul sang ».
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: tous les peuples humains
  rationale: ἔθνος désigne ici les différents peuples, tandis que ἀνθρώπων les situe au sein de l’humanité. Le pluriel français rend idiomatiquement la valeur distributive du singulier grec.
- source_word: κατοικεῖν
  choice: pour qu’ils habitent
  rationale: L’infinitif dépend de « il a fait » et exprime ici le résultat ou le dessein. « Habiter » conserve la nuance résidentielle du verbe.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: sur toute la surface de la terre
  rationale: Dans cette expression, πρόσωπον désigne la face ou la surface. « Toute la surface de la terre » est clair et naturel en français moderne.
- source_word: ὁρίσας
  choice: après avoir fixé
  rationale: Le participe aoriste présente Dieu comme celui qui détermine les temps et les limites. La tournure française marque naturellement cette action tout en évitant une construction participiale lourde.
- source_word: προστεταγμένους καιρούς
  choice: les temps qui leur étaient assignés
  rationale: καιροί désigne des temps ou périodes déterminés, et προστεταγμένους indique qu’ils ont été fixés ou assignés. Le pronom « leur » explicite le rapport contextuel avec les peuples.
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: les limites des lieux où ils habiteraient
  rationale: ὁροθεσία renvoie à des limites territoriales et κατοικία au lieu d’habitation. Cette formulation restitue les deux notions sans suggérer nécessairement des frontières politiques modernes.
theological_decisions:
- issue: Explicitation du référent de ἐξ ἑνὸς
  choice: à partir d’un seul homme
  alternative: à partir d’un seul
  rationale: Le texte grec ne contient pas le nom « homme », mais le contexte humain le sous-entend. Son ajout rend la phrase complète et naturelle en français tout en maintenant dans une note la forme exacte et la variante manuscrite.
- issue: Portée de la détermination divine des temps et des lieux
  choice: après avoir fixé les temps qui leur étaient assignés et les limites des lieux où ils habiteraient
  alternative: après avoir fixé leurs époques et les frontières de leurs territoires
  rationale: La formulation retenue affirme l’action déterminante de Dieu telle que l’exprime le texte, sans trancher les débats sur la nature précise des « temps » ni réduire les limites évoquées à des frontières politiques.
translation_notes:
  register: Français international moderne, clair et digne. « Tous les peuples humains » exprime la diversité des peuples et leur origine commune ; « surface de la terre » rend naturellement l’image grecque de la « face de la terre ».
