  verdict: revise
  source_fidelity: 'Le sens général est fidèle : origine commune de tous les peuples, habitation sur toute la terre, et détermination divine des temps et des limites. Toutefois, « après avoir fixé » impose une succession temporelle que le participe ὁρίσας n’exige pas, et « où ils habiteraient » introduit inutilement une perspective future absente du grec.'
  naturalness: Le français est globalement clair et moderne. La formulation « les limites de leurs lieux d’habitation » est plus directe et plus proche de κατοικία que « les limites des lieux où ils habiteraient ».
  terminology: « Un seul homme », « peuples humains », « surface de la terre », « temps ... assignés » et « limites » conviennent au registre et au sens. La note textuelle préserve correctement la leçon principale « d’un seul » et la variante « sang ».
