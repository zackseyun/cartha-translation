    rationale: Ὁρίσας est un participe aoriste qui décrit l’action divine de détermination, sans imposer que celle-ci soit antérieure, dans une chronologie stricte, à l’acte de faire les nations habiter la terre. « Ayant fixé » conserve le lien participial sans surinterpréter sa temporalité.
  - severity: medium
