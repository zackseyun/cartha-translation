  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: fr
  text: 'En effet, alors que je circulais et observais attentivement vos objets de culte[a], j’ai même trouvé un autel qui portait cette inscription : « À un dieu inconnu[b]. » Donc, ce que vous vénérez dans l’ignorance[c], c’est cela que je vous annonce.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vos objets de vénération ». Le terme grec peut désigner largement des objets ou réalités auxquels on rend un culte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Au dieu inconnu ». Le grec ne comporte pas d’article ; selon la manière de comprendre l’inscription, une traduction indéfinie ou définie est possible en français.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « celui que vous adorez sans le connaître ». Certaines traductions personnalisent le référent, mais le grec emploie un relatif neutre : littéralement, « ce que ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: en parcourant votre ville
  rationale: Le participe présent décrit l’action en cours qui sert de cadre à la découverte. « Votre ville » explicite naturellement en français le lieu indiqué par le contexte immédiat, sans modifier le propos.
- source_word: ἀναθεωρῶν
  choice: en observant attentivement
  rationale: Le verbe exprime un examen soutenu, et non un simple regard.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: vos objets de culte
  rationale: L’expression reste assez large pour désigner les divers objets et monuments religieux rencontrés par Paul, sans la réduire aux seuls sanctuaires.
- source_word: βωμὸν
  choice: un autel
  rationale: Équivalent français courant du terme cultuel βωμός.
- source_word: ἐπεγέγραπτο
  choice: portait cette inscription
  rationale: Cette tournure française rend naturellement l’état résultant du plus-que-parfait passif grec sur un monument.
- source_word: Ἀγνώστῳ θεῷ
  choice: À un dieu inconnu
  rationale: Le grec ne comporte pas d’article. L’indéfini est une traduction naturelle de cette dédicace, tandis que la lecture définie demeure signalée en note.
- source_word: ὃ οὖν
  choice: Ainsi, ce que
  rationale: « Ce que » conserve le relatif neutre, et « ainsi » exprime la conclusion introduite par οὖν.
- source_word: ἀγνοοῦντες εὐσεβεῖτε
  choice: vous vénérez dans l’ignorance
  rationale: « Vénérer » rend ici la dévotion religieuse sans imposer une formulation personnelle; « dans l’ignorance » maintient le jeu rhétorique avec « inconnu ».
- source_word: τοῦτο ἐγὼ καταγγέλλω ὑμῖν
  choice: c’est cela que je vous annonce
  rationale: La construction détachée reproduit l’insistance de τοῦτο et rend clairement la déclaration publique de Paul.
theological_decisions:
- issue: Référent du relatif neutre ὃ
  choice: « ce que vous vénérez dans l’ignorance »
  alternative: « celui que vous adorez sans le connaître »
  rationale: Le texte grec emploie un relatif neutre. La traduction retenue préserve cette formulation et la tension du raisonnement de Paul, sans identifier d’emblée le référent comme une personne au moyen d’un masculin.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression rhétorique de Paul, le lien entre « inconnu » et « ignorance », ainsi que l’insistance finale de la construction grecque.
