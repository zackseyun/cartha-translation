id: ACT.17.32
reference: Acts 17:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: fr
  text: 'Quand ils entendirent parler de la résurrection des morts, certains se moquèrent, mais d’autres dirent : « Nous t’écouterons une autre fois à ce sujet[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous t’écouterons encore à ce sujet. »'
    reason: alternative de traduction de καὶ πάλιν
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quand ils entendirent parler de
  rationale: Le participe aoriste situe les réactions qui suivent dans le temps. « Entendre parler de » est naturel en français avec le contenu entendu; δὲ marque ici une légère progression narrative qui n’exige pas de connecteur initial distinct.
- source_word: ἀνάστασιν νεκρῶν
  choice: la résurrection des morts
  rationale: Cette formulation française usuelle conserve le sens général de la résurrection concernant les morts, sans préciser davantage sa nature.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: certains ... mais d’autres
  rationale: Cette tournure rend clairement et naturellement l’opposition entre les deux groupes.
- source_word: ἐχλεύαζον
  choice: se moquèrent
  rationale: Le verbe exprime une réaction de dérision. Le passé simple convient au récit français; le contexte permet de comprendre que cette réaction survient alors, sans imposer la nuance plus explicite de « se mirent à ».
- source_word: Ἀκουσόμεθά σου
  choice: Nous t’écouterons
  rationale: Avec le pronom au génitif, ἀκούω signifie ici écouter une personne. Le futur est conservé directement.
- source_word: περὶ τούτου καὶ πάλιν
  choice: là-dessus une autre fois
  rationale: Cette formulation naturelle rattache le sujet de l’écoute à « là-dessus » et rend explicitement la valeur temporelle de πάλιν par « une autre fois ».
theological_decisions:
- issue: Portée de l’expression ἀνάστασιν νεκρῶν devant un auditoire non juif
  choice: la résurrection des morts
  alternative: la résurrection d’entre les morts
  rationale: Le génitif νεκρῶν désigne naturellement les morts comme catégorie concernée. La traduction retenue préserve la portée générale de l’expression sans l’identifier plus étroitement à la résurrection d’une personne particulière.
- issue: Disposition réelle du second groupe à écouter Paul
  choice: déclaration littérale au futur, sans qualifier leur intention
  alternative: formulation suggérant un renvoi poli ou dilatoire
  rationale: Le texte rapporte leur promesse de l’écouter une autre fois, mais ne tranche pas explicitement entre intérêt sincère et ajournement; la traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque; « certains… d’autres » évite la lourdeur de « les uns… les autres ».
