  source_fidelity: 'Le sens de l’ensemble est bien rendu : πάντες, les étrangers de passage, l’imparfait habituel de ηὐκαίρουν et l’exclusivité de « rien d’autre que » sont préservés. Le comparatif καινότερον est justement signalé en note. En français courant, toutefois, « quelque chose de plus nouveau » est lourd et son comparatif sans terme explicite paraît artificiel ; « quelque chose de nouveau », avec note indiquant le comparatif grec, rend plus fidèlement la valeur idiomatique probable sans effacer la donnée textuelle.'
  naturalness: La construction « ne passaient leur temps à rien d’autre qu’à » est moins naturelle que « ne passaient leur temps qu’à ». La reformulation proposée est fluide, moderne et garde le caractère habituel de l’imparfait.
