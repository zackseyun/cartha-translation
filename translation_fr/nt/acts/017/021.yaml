  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: fr
  text: Tous les Athéniens et les étrangers qui séjournaient là ne passaient leur temps qu’à raconter ou à écouter quelque chose de nouveau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « quelque chose de plus nouveau ». Le grec emploie le comparatif « plus nouveau », ce qui exprime probablement un désir continuel de connaître la toute dernière nouveauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Tous les Athéniens
  rationale: πάντες est rendu directement par « tous ». Le léger marqueur de transition δέ n’exige pas ici de mot français explicite, et son omission évite d’introduire une opposition trop forte.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: les étrangers qui séjournaient là
  rationale: ἐπιδημοῦντες désigne des personnes présentes ou séjournant dans le lieu, sans nécessairement y résider de façon permanente.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: ne passaient leur temps à rien d’autre
  rationale: Cette tournure française naturelle exprime l’occupation habituelle indiquée par l’imparfait ηὐκαίρουν et conserve l’exclusivité de οὐδὲν ἕτερον.
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: qu’à raconter ou à écouter quelque chose
  rationale: « Raconter » convient à la communication d’une nouveauté, tandis que « écouter » garde le parallélisme des deux infinitifs. Le second τι est rattaché naturellement à l’ensemble en français.
- source_word: καινότερον
  choice: de plus nouveau
  rationale: Le comparatif grec est maintenu afin d’évoquer la recherche continuelle de la dernière nouveauté, malgré une formulation française un peu marquée.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve le caractère explicatif du verset et le comparatif inhabituel du grec, éclairé par une note.
