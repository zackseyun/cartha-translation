source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: fr
  text: 'Ces hommes, que Jason a accueillis[a], agissent tous à l’encontre des décrets[b] de César en disant qu’il y a un autre roi[c] : Jésus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a reçus » ou « a hébergés ». Le verbe grec peut désigner le fait de recevoir des personnes comme hôtes.
    reason: lexical_alternative
  - marker: b
    text: Ou « édits ». Le terme désigne ici des décisions ou prescriptions officielles.
    reason: lexical_alternative
  - marker: c
    text: Ou « un roi différent ». Le grec présente Jésus comme un autre roi, ce qui donne à l’accusation l’idée d’une prétention rivale à l’autorité de César.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: a accueillis chez lui
  rationale: Le parfait exprime l’accueil déjà accordé par Jason et dont les effets demeurent au cœur de l’accusation. « Accueillir chez lui » rend naturellement l’idée de recevoir des personnes comme hôtes.
- source_word: ἀπέναντι
  choice: à l’encontre de
  rationale: Avec le génitif, le terme marque l’opposition ou la non-conformité. « À l’encontre de » convient au registre juridique de l’accusation.
- source_word: δογμάτων
  choice: décrets
  rationale: Dans ce contexte civique romain, le mot désigne des décisions ou prescriptions officielles. « Décrets » est clair, précis et d’un registre approprié.
- source_word: πράσσουσι
  choice: agissent
  rationale: Le présent décrit leur conduite alléguée comme actuelle ou habituelle. « Agissent » conserve la force verbale sans ajouter de nuance absente du grec.
- source_word: βασιλέα ἕτερον
  choice: un autre roi
  rationale: « Roi » traduit précisément βασιλεύς, tandis que « autre » maintient l’idée d’un prétendant distinct, potentiellement rival de César.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe précise en quoi consiste l’opposition qui leur est reprochée. « En disant » reste transparent et n’ajoute pas le scepticisme que pourrait suggérer « prétendant ».
- source_word: εἶναι Ἰησοῦν
  choice: 'qu’il y a … : Jésus'
  rationale: 'Cette restructuration française rend naturellement la proposition infinitive et conserve la mise en relief finale de l’identité du roi : Jésus.'
- source_word: οὗτοι πάντες
  choice: ils … tous
  rationale: La construction garde la portée collective et emphatique de πάντες tout en restant idiomatique après le groupe nominal « Ces hommes ».
theological_decisions:
- issue: Portée politique de l’accusation concernant Jésus comme roi
  choice: Conserver explicitement l’accusation selon laquelle Jésus est « un autre roi ».
  alternative: Atténuer la formulation en parlant d’un autre dirigeant ou d’un chef uniquement spirituel.
  rationale: Le lien avec les décrets de César donne à l’accusation une portée politique manifeste. La traduction préserve cette tension historique et théologique sans déterminer la nature exacte de la royauté de Jésus.
translation_notes:
  register: Français international moderne, clair et digne. « Accueillis chez lui » explicite sobrement la nuance d’hospitalité; « à l’encontre des décrets » maintient le registre juridique; les deux-points avant « Jésus » conservent l’identification finale et emphatique du grec.
