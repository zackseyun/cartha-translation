  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: fr
  text: Selon son habitude, Paul se rendit auprès d’eux et, lors de trois sabbats[a], s’entretint avec eux à partir des Écritures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pendant trois sabbats ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il raisonna avec eux en s’appuyant sur les Écritures ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: Selon son habitude, Paul
  rationale: L’expression idiomatique indique une pratique établie de Paul. Cette formulation est naturelle en français et conserve le sens habituel sans lourdeur.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: entra chez eux
  rationale: Le verbe conserve l’idée d’entrer, tandis que « chez eux » rend la direction vers le groupe déjà identifié par le contexte, sans expliciter de nouveau la synagogue.
- source_word: ἐπὶ σάββατα τρία
  choice: pendant trois sabbats
  rationale: Avec l’accusatif, ἐπί peut exprimer une étendue temporelle. « Pendant trois sabbats » préserve cette nuance, tout en signalant en note l’autre compréhension distributive naturelle.
- source_word: διελέξατο
  choice: il discuta avec eux
  rationale: διαλέγομαι désigne ici un échange raisonné fondé sur les Écritures. « Discuta » garde la dimension dialogique sans suggérer nécessairement une querelle.
- source_word: ἀπὸ τῶν γραφῶν
  choice: à partir des Écritures
  rationale: La préposition ἀπό présente les Écritures comme le point de départ ou la base de l’échange. « Les Écritures » est le terme français courant pour les écrits sacrés reconnus dans ce contexte.
theological_decisions:
- issue: Référent de αὐτούς dans l’activité de Paul à la synagogue
  choice: Conserver le pronom « eux » sans préciser « les Juifs » ni répéter « la synagogue ».
  alternative: Paul entra dans la synagogue / se rendit auprès des Juifs
  rationale: Le contexte immédiat fournit le cadre de la synagogue, mais le verset grec emploie lui-même des pronoms. Les conserver évite d’ajouter une précision absente de cette phrase.
- issue: Force de διελέξατο
  choice: « discuta avec eux », au sens d’un échange raisonné
  alternative: « raisonna avec eux » / « argumenta avec eux »
  rationale: Le verbe peut comporter une dimension argumentative et persuasive, mais il décrit aussi le dialogue. Le choix principal préserve cette ouverture sans imposer un ton conflictuel.
translation_notes:
  register: Français international moderne, digne et accessible. « Sabbat » conserve le cadre juif précis; « Écritures » prend une majuscule conformément à l’usage biblique français. La phrase suit le mouvement du grec tout en évitant un calque peu naturel.
