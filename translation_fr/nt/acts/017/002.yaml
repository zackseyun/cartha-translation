  verdict: revise
  source_fidelity: La formulation « entra chez eux » introduit indûment l’idée d’un domicile ou d’un espace qui leur appartiendrait. Le grec εἰσῆλθεν πρὸς αὐτούς exprime le mouvement de Paul vers le groupe désigné par le contexte sans préciser « chez eux ». « Se rendit auprès d’eux » conserve ce référent non explicité de façon idiomatique. « Lors de trois sabbats » rend naturellement la répartition temporelle de ἐπὶ σάββατα τρία. L’échange fondé sur les Écritures est bien rendu par « s’entretint ... à partir des Écritures ».
  naturalness: Le texte révisé est naturel en français international moderne, tout en gardant un registre biblique sobre. « Se rendit auprès d’eux » évite l’ambiguïté domestique de « entra chez eux ». « S’entretint avec eux » rend la dimension dialogique de διελέξατο sans effacer son caractère raisonné, précisé en note.
  terminology: « Sabbats » et « Écritures » sont appropriés au contexte juif et à l’usage biblique français. La majuscule à « Écritures » est cohérente. La note sur « raisonna » préserve la nuance argumentative possible de διελέξατο sans l’imposer au texte principal.
