id: ACT.17.25
reference: Acts 17:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: fr
  text: Il n’est pas non plus servi par des mains humaines[a], comme s’il avait besoin de quoi que ce soit, puisque c’est lui qui donne à tous la vie, le souffle et toutes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est pas l’objet d’un culte rendu par des mains humaines ». Le verbe grec peut désigner un service rendu dans un cadre religieux ; ici, l’idée est que Dieu ne dépend pas des services humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: est servi
  rationale: Dans ce contexte, le verbe désigne le service ou les soins rendus, notamment dans un cadre religieux, et non la guérison. « Est servi » préserve l’idée que Dieu ne dépend pas des services humains.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: par des mains humaines
  rationale: Cette formulation conserve l’image concrète du grec et son évocation du service cultuel accompli par des êtres humains.
- source_word: προσδεόμενός τινος
  choice: comme s’il avait besoin de quoi que ce soit
  rationale: 'La tournure restitue la portée rhétorique du participe : Dieu ne reçoit pas de service à la manière d’un être qui manquerait de quelque chose.'
- source_word: αὐτὸς
  choice: c’est lui qui
  rationale: 'La construction détachée rend naturellement en français l’emphase du pronom grec et marque le contraste : loin de recevoir par nécessité, Dieu donne.'
- source_word: διδοὺς
  choice: donne
  rationale: Le verbe conjugué après « puisque » exprime avec naturel la relation causale portée par le participe grec.
- source_word: πᾶσι
  choice: à tous
  rationale: Cette traduction garde la portée large et non restreinte du datif grec sans préciser indûment « tous les humains ».
- source_word: ζωὴν
  choice: la vie
  rationale: Équivalent français usuel, ici associé au souffle pour exprimer la dépendance des créatures envers Dieu.
- source_word: πνοὴν
  choice: le souffle
  rationale: Dans cette association avec la vie, « souffle » est le sens naturel et concret ; « esprit » introduirait une interprétation non requise.
- source_word: καὶ τὰ πάντα
  choice: et toutes choses
  rationale: Cette expression conserve la force totalisante du grec dans un registre biblique digne, tout en élargissant l’énoncé au-delà de la vie et du souffle.
- source_word: οὐδὲ
  choice: Il n’est pas non plus
  rationale: Cette tournure française reprend naturellement la négation précédente et marque la continuité argumentative avec le verset antérieur.
theological_decisions:
- issue: Faut-il rendre θεραπεύεται par un terme explicitement cultuel ou par le sens plus large de service ?
  choice: est servi
  alternative: reçoit un culte
  rationale: L’argument porte sur l’indépendance de Dieu à l’égard des services humains, particulièrement religieux. « Est servi » inclut le cadre cultuel sans réduire le verbe à la seule notion de culte ni résoudre trop étroitement son amplitude sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde l’opposition emphatique entre un Dieu qui n’a besoin de rien et qui, au contraire, donne tout. L’expression « toutes choses » maintient la portée globale de τὰ πάντα.
