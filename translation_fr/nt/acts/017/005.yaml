  to: Mais les Juifs[a], pris de jalousie, s’adjoignirent quelques hommes malfaisants de la place publique, ameutèrent une foule et mettaient la ville en émoi. Ils se rendirent à la maison de Jason et cherchaient à les amener devant l’assemblée publique[b].
  rationale: La révision est limitée à deux choix lexicaux et à la ponctuation de la première séquence. Elle conserve les temps narratifs, l’ambiguïté voulue du pronom « les », ainsi que le caractère institutionnel de l’assemblée, tout en rendant plus nettement l’attroupement hostile et le désordre continu décrits par le grec.
