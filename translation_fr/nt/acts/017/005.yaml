id: ACT.17.5
reference: Acts 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: fr
  text: Mais les Juifs[a], pris de jalousie, s’adjoignirent quelques hommes malfaisants de la place publique, ameutèrent une foule et mettaient la ville en émoi. Ils se rendirent à la maison de Jason et cherchaient à les amener devant l’assemblée publique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit, dans ce contexte, des Juifs de Thessalonique qui s’opposaient à Paul et Silas, et non de tous les Juifs sans distinction.
    reason: Précision contextuelle destinée à éviter une généralisation que le récit n’exige pas.
  - marker: b
    text: Ou « devant le peuple ». Le mot grec désigne ici le corps civique réuni publiquement, et non une foule quelconque.
    reason: La note signale l’autre traduction possible et précise la portée institutionnelle de δῆμος.
lexical_decisions:
- source_word: ζηλώσαντες
  choice: pris de jalousie
  rationale: Cette tournure française naturelle exprime la jalousie comme motif des actions qui suivent, conformément à la fonction du participe aoriste.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Le grec désigne directement « les Juifs » sans préciser qu’il s’agit de dirigeants; le contexte limite néanmoins le référent au groupe opposé à Paul et Silas à Thessalonique.
- source_word: προσλαβόμενοι
  choice: s’adjoignirent
  rationale: Le moyen exprime le fait de prendre d’autres personnes avec soi; « s’adjoignirent » rend ce mouvement sans suggérer nécessairement une embauche formelle.
- source_word: τῶν ἀγοραίων
  choice: qui se trouvaient sur la place publique
  rationale: ἀγοραῖος désigne ici des hommes associés à l’agora. La formulation indique leur provenance sans ajouter l’idée interprétative de désœuvrement.
- source_word: ἄνδρας τινὰς πονηρούς
  choice: quelques hommes mauvais
  rationale: La traduction conserve à la fois la désignation masculine explicite et le jugement moral porté par πονηρούς.
- source_word: ὀχλοποιήσαντες
  choice: ils rassemblèrent une foule
  rationale: Le verbe signifie former ou rassembler une foule. Le contexte hostile donne à cette foule son caractère menaçant sans qu’il soit nécessaire d’ajouter un terme plus interprétatif.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: semaient le trouble dans la ville
  rationale: L’imparfait grec décrit une agitation en cours; cette expression française en restitue naturellement la force.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: ils se rendirent à la maison de Jason
  rationale: Dans ce contexte, ἐφίστημι indique qu’ils arrivèrent ou se présentèrent à la maison. « Attaquèrent » préciserait excessivement la nature de leur action.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait garde l’idée d’une tentative ou d’une recherche prolongée sans affirmer qu’elle a abouti.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom grec est conservé plutôt que remplacé par une identification explicite de Paul et Silas.
- source_word: προαγαγεῖν
  choice: amener
  rationale: Le verbe signifie conduire ou faire avancer quelqu’un devant d’autres; « amener devant » convient à la comparution publique envisagée.
- source_word: εἰς τὸν δῆμον
  choice: devant l’assemblée publique
  rationale: δῆμος désigne ici le corps civique réuni, et non une foule indéfinie. « Assemblée publique » rend cette dimension institutionnelle dans un français accessible.
theological_decisions:
- issue: Portée de l’expression οἱ Ἰουδαῖοι dans un récit de conflit
  choice: les Juifs, avec une note précisant la portée contextuelle
  alternative: les responsables juifs
  rationale: Le texte ne permet pas de restreindre lexicalement le groupe aux seuls responsables. La note évite toutefois de transformer cette désignation narrative locale en affirmation visant tous les Juifs.
- issue: Nature du δῆμος
  choice: l’assemblée publique
  alternative: le peuple
  rationale: Le terme peut être rendu par « peuple », mais il évoque ici plus précisément le corps civique réuni publiquement; la traduction principale conserve cette valeur sans imposer une procédure judiciaire formelle.
translation_notes:
  register: Français international actuel, naturel et digne. Les participes grecs sont répartis en propositions coordonnées pour préserver la progression narrative sans produire une phrase française trop lourde. L’alternance entre passé simple et imparfait restitue les actions successives et le trouble ou la tentative en cours.
