  naturalness: 'Le français est déjà clair et de registre approprié. La révision resserre toutefois la succession des participes grecs et emploie des expressions plus idiomatiques : « hommes malfaisants », « ameutèrent une foule » et « mettaient la ville en émoi ».'
  terminology: « Les Juifs » traduit directement οἱ Ἰουδαῖοι; la note en limite correctement la portée narrative locale sans substituer au texte « les responsables juifs ». « Assemblée publique » et sa note rendent bien δῆμος comme corps civique réuni.
