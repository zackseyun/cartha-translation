id: ACT.17.3
reference: Acts 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: fr
  text: Il expliquait et démontrait que le Messie[a] devait souffrir et ressusciter d’entre les morts[b], et que ce Jésus que je vous annonce est le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ », ici et à la fin du verset.
    reason: alternative_reading
  - marker: b
    text: Ou « être ressuscité d’entre les morts ». Le grec emploie ici un infinitif actif, « ressusciter », bien que le Nouveau Testament dise aussi ailleurs que Dieu a ressuscité Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: expliquait
  rationale: Le verbe évoque ici l’action d’ouvrir le sens des Écritures et de le rendre intelligible. « Expliquait » est naturel en français moderne et convient au contexte du raisonnement dans la synagogue.
- source_word: παρατιθέμενος
  choice: démontrait
  rationale: Le participe décrit la présentation d’éléments à l’appui de l’explication. « Démontrait » exprime l’idée d’exposer des preuves sans imposer le sens excessivement technique d’une démonstration formelle.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: le Messie
  rationale: Dans les deux occurrences, Χριστός fonctionne comme un titre désignant l’oint attendu, et non comme un nom propre. « Le Messie » conserve clairement le cadre juif et scripturaire de l’argument.
- source_word: ἔδει
  choice: devait
  rationale: L’imparfait impersonnel de nécessité exprime une nécessité inscrite dans le dessein divin et attestée par les Écritures. « Devait » en garde la force avec concision.
- source_word: παθεῖν
  choice: souffrir
  rationale: Traduction directe et habituelle de πάσχω dans ce contexte, où il est question des souffrances du Messie.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: ressusciter d’entre les morts
  rationale: L’infinitif grec est actif. « Ressusciter » rend directement cette forme, tandis que « d’entre les morts » conserve la valeur de ἐκ νεκρῶν.
- source_word: οὗτός ἐστιν ὁ χριστός
  choice: le Messie, c’est ce Jésus
  rationale: 'Cette tournure française naturelle met en relief l’identification affirmée par le démonstratif grec : le Messie annoncé par les Écritures est Jésus.'
- source_word: καταγγέλλω ὑμῖν
  choice: je vous annonce
  rationale: « Annonce » exprime la proclamation publique sans limiter le terme à la prédication au sens institutionnel.
theological_decisions:
- issue: Traduction de Χριστός comme titre dans les deux occurrences
  choice: Messie
  alternative: Christ
  rationale: L’argument porte sur l’identité de l’oint attendu et sur ce que les Écritures annonçaient à son sujet. « Messie » rend explicitement cette fonction titulaire; l’équivalent traditionnel « Christ » est signalé en note.
- issue: Nuance de voix de ἀναστῆναι
  choice: ressusciter d’entre les morts
  alternative: être ressuscité d’entre les morts
  rationale: Le grec emploie ici un infinitif actif. La traduction suit cette forme sans nier les autres passages du Nouveau Testament qui présentent Dieu comme celui qui a ressuscité Jésus.
translation_notes:
  register: Français international moderne, clair et digne. Les deux participes grecs sont rendus par des verbes conjugués à l’imparfait afin que le verset puisse se lire naturellement en français tout en restant lié au récit environnant. La tournure disloquée « le Messie, c’est ce Jésus » conserve l’accent identificatoire du grec sans lourdeur.
