id: ACT.17.17
reference: Acts 17:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: fr
  text: Il discutait donc dans la synagogue avec les Juifs et ceux qui adoraient Dieu[a]. Et chaque jour, sur la place publique[b], il discutait avec ceux qui s’y trouvaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ceux qui craignaient Dieu » : des non-Juifs associés au culte juif.'
    reason: lexical_alternative
  - marker: b
    text: La place publique était aussi le centre de la vie civique et un lieu de rassemblement, et non seulement un espace où l’on achetait et vendait.
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: il discutait
  rationale: L’imparfait grec exprime une activité répétée ou continue, tandis que διαλέγομαι évoque un échange raisonné. « Il discutait » garde la dimension dialoguée et argumentative sans suggérer nécessairement une querelle.
- source_word: μὲν οὖν
  choice: donc
  rationale: Cette combinaison de particules assure la progression du récit et le lien avec le contexte précédent. « Donc » est naturel et suffisamment explicite en français.
- source_word: ἐν τῇ συναγωγῇ
  choice: dans la synagogue
  rationale: Le terme désigne ici l’institution et le lieu de réunion de la communauté juive.
- source_word: τοῖς Ἰουδαίοις
  choice: avec les Juifs
  rationale: Dans ce contexte, il s’agit des membres juifs de l’auditoire de la synagogue, et non spécialement des habitants de la Judée.
- source_word: τοῖς σεβομένοις
  choice: ceux qui adoraient Dieu
  rationale: Le participe désigne vraisemblablement des non-Juifs liés au culte juif. L’objet « Dieu », implicite dans cet emploi courant des Actes, est exprimé pour rendre le sens clair en français.
- source_word: ἐν τῇ ἀγορᾷ
  choice: sur la place publique
  rationale: L’ἀγορά était à la fois un centre civique, un lieu de rencontre et un espace commercial. « Place publique » évite de la réduire à un simple marché.
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: chaque jour
  rationale: L’expression indique une répétition quotidienne régulière.
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: avec ceux qui s’y trouvaient
  rationale: Le participe désigne les personnes présentes là par circonstance. Cette formulation ne réduit pas le groupe aux seuls passants.
theological_decisions:
- issue: Identité de τοῖς σεβομένοις
  choice: ceux qui adoraient Dieu
  alternative: ceux qui craignaient Dieu
  rationale: Le texte principal privilégie une formulation immédiatement compréhensible, tandis que la note conserve la possibilité du terme quasi technique désignant des non-Juifs associés à la synagogue.
translation_notes:
  register: Français moderne, courant et digne. La répétition de « il discutait » rend explicite la continuité de la même activité dans les deux lieux et préserve la valeur itérative de l’imparfait grec.
