  naturalness: Le français est globalement clair et actuel. « Monde habité » est compréhensible mais peu idiomatique en français courant dans cette accusation. « Le monde », éclairé par la note, est plus naturel tout en conservant la nuance historique.
  terminology: « Frères », « autorités de la ville » et la note sur les « politarques » respectent convenablement le vocabulaire et le cadre civique macédonien. Les notes conservent les nuances lexicales sans surinterprétation doctrinale.
