  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: fr
  text: 'Mais, ne les ayant pas trouvés, ils traînèrent Jason et quelques frères[a] devant les autorités de la ville[b], en criant : « Ceux qui ont bouleversé le monde[c] sont aussi ici ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne des membres de la communauté croyante ; selon le contexte, ce terme grec au pluriel peut aussi inclure des femmes.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie le titre « politarques », terme macédonien local désignant des magistrats de la ville.
    reason: cultural_note
  - marker: c
    text: L’expression peut désigner le monde civilisé connu de l’époque, souvent compris comme le monde romain.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: comme ils ne les trouvaient pas
  rationale: Le participe aoriste exprime la circonstance qui précède l’action principale. Cette formulation française est naturelle et rend le fait qu’ils n’ont pas réussi à trouver les personnes recherchées.
- source_word: ἔσυρον
  choice: ils traînèrent
  rationale: Le verbe σύρω évoque une action physique violente ou coercitive. « Traînèrent » en conserve la force.
- source_word: τινας ἀδελφοὺς
  choice: quelques frères
  rationale: Dans ce contexte, ἀδελφοί désigne des membres de la communauté croyante. Le masculin du texte grec est conservé dans le corps du verset, avec une précision en note sur sa portée possible.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: devant les autorités de la ville
  rationale: La formulation communique clairement la fonction judiciaire ou administrative des πολιτάρχαι, tout en signalant en note le titre civique macédonien précis.
- source_word: βοῶντες
  choice: en criant
  rationale: Le participe décrit une clameur forte accompagnant l’action. « En criant » est direct et idiomatique.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: ceux qui ont bouleversé le monde habité
  rationale: « Bouleversé » restitue l’idée de trouble profond et de désordre portée par ἀναστατόω. « Monde habité » conserve la portée propre de οἰκουμένη sans l’identifier automatiquement à toute la planète.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: sont aussi arrivés ici
  rationale: Bien que πάρειμι signifie littéralement « être présent », l’arrivée qui explique leur présence est naturelle dans ce contexte. « Aussi » rend l’ajout exprimé par καί.
