lexical_decisions:
- source_word: οὕτως
  choice: Alors
  rationale: Dans ce contexte narratif, οὕτως marque la conséquence ou la conclusion immédiate de la scène. « Alors » est naturel en français moderne et conserve cette fonction de liaison.
- source_word: ὁ Παῦλος
  choice: Paul
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante ; l’article grec devant le nom n’est pas reproduit, conformément à l’usage français.
- source_word: ἐξῆλθεν
  choice: se retira
  rationale: L’aoriste de ἐξέρχομαι décrit ici le départ de Paul hors de l’assemblée. « Se retira » exprime naturellement ce mouvement en français, sans lui ajouter de motif.
- source_word: ἐκ μέσου αὐτῶν
  choice: du milieu d’eux
  rationale: Cette formulation conserve l’image spatiale de Paul quittant le milieu du groupe et reste digne et intelligible en français contemporain.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La traduction privilégie une formulation naturelle tout en conservant l’image du départ hors du milieu de l’auditoire.
