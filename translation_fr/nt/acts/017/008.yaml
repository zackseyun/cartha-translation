  yaml_path: translation/nt/acts/017/008.yaml
  text: And they disturbed the crowd and the city officials when they heard these things,[a]
translation:
  language: fr
  text: Ils troublèrent la foule et les autorités de la ville[a], lorsque celles-ci entendirent ces propos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « politarques », titre macédonien local désignant des autorités civiques.'
