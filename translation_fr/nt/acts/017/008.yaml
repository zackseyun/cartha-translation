lexical_decisions:
- source_word: ἐτάραξαν
  choice: furent troublés
  rationale: Le verbe ταράσσω exprime ici le trouble ou l’agitation provoqués chez la foule et les autorités. La tournure passive naturelle en français rend l’effet sans l’exagérer.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: δέ est un léger connecteur narratif. En français, la progression est suffisamment marquée par la proposition initiale « En entendant cela » ; ajouter « et » ou « mais » serait moins naturel ou trop contrastif.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: « La foule » est le terme courant et neutre correspondant à ὄχλος, sans introduire la nuance hostile de « populace ».
- source_word: τοὺς πολιτάρχας
  choice: les magistrats de la ville
  rationale: πολιτάρχης désigne un titre civique macédonien. « Magistrats de la ville » communique clairement leur fonction d’autorités municipales, tandis que la note conserve la précision historique du titre.
- source_word: ἀκούοντας ταῦτα
  choice: En entendant cela
  rationale: Le participe présent porte sur la foule et les magistrats. Une proposition temporelle placée en tête est idiomatique en français ; « cela » reprend naturellement l’ensemble des propos précédents.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. L’ordre de la phrase met en relief la circonstance temporelle commune aux deux groupes. Le terme fonctionnel « magistrats de la ville » est accompagné d’une note précisant le titre local.
