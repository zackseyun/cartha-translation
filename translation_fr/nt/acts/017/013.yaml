revisions:
- from: Mais quand les Juifs venus de Thessalonique apprirent que la parole de Dieu avait aussi été proclamée par Paul à Bérée, ils vinrent jusque-là et se mirent à soulever et à troubler les foules.
  to: Mais quand les Juifs venus de Thessalonique apprirent que la parole de Dieu avait aussi été proclamée par Paul à Bérée, ils y vinrent aussi, en agitant et en troublant les foules.
  rationale: La révision remplace deux légères explicitations interprétatives par des équivalents français naturels qui reproduisent plus directement l’addition spatiale de κἀκεῖ et la valeur circonstancielle des deux participes grecs. Le reste du texte est conservé.
  reviewer_model: gpt-5.6-terra
