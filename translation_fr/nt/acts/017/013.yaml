id: ACT.17.13
reference: Acts 17:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: fr
  text: Mais quand les Juifs venus de Thessalonique apprirent que la parole de Dieu avait aussi été proclamée par Paul à Bérée, ils y vinrent aussi, en agitant et en troublant les foules.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mais quand
  rationale: « Mais » marque naturellement le changement de scène et le contraste avec l’accueil favorable à Bérée; « quand » donne à ὡς sa valeur temporelle.
- source_word: ἔγνωσαν
  choice: apprirent
  rationale: L’aoriste de γινώσκω exprime ici l’acquisition d’une information plutôt qu’un simple état de connaissance.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: les Juifs venus de Thessalonique
  rationale: La formulation désigne précisément le groupe par son lieu de provenance sans généraliser à l’ensemble des Juifs.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: que ... aussi ... à Bérée
  rationale: « Aussi » porte sur Bérée comme lieu supplémentaire où le message a été proclamé, après Thessalonique.
- source_word: κατηγγέλη
  choice: avait été proclamée
  rationale: Le plus-que-parfait français rend naturellement l’antériorité de la proclamation par rapport au moment où ils l’apprennent; « proclamée » conserve l’idée d’une annonce publique.
- source_word: ὑπὸ τοῦ Παύλου
  choice: par Paul
  rationale: ὑπό suivi du génitif désigne l’agent personnel de la construction passive.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette expression française familière préserve la portée théologique de la formule tout en désignant ici le message divin annoncé.
- source_word: ἦλθον κἀκεῖ
  choice: ils vinrent jusque-là
  rationale: Dans ce contexte hostile, « jusque-là » rend idiomatiquement κἀκεῖ et souligne que les opposants étendent leur action à Bérée.
- source_word: σαλεύοντες
  choice: se mirent à soulever
  rationale: Avec « les foules », « soulever » exprime l’action de provoquer une agitation collective; « se mirent à » transforme naturellement en français les participes circonstanciels suivant le verbe principal.
- source_word: καὶ ταράσσοντες
  choice: et à troubler
  rationale: 'Le second verbe conserve une nuance distincte: les foules sont non seulement poussées à l’agitation, mais aussi plongées dans le trouble.'
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: ὄχλοι désigne des groupes de personnes rassemblées; « foules » reste neutre, contrairement à « émeutiers » ou « populace ».
theological_decisions:
- issue: Traduction de ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: « La parole de Dieu » maintient la formulation biblique et sa résonance théologique sans réduire explicitement λόγος à une simple information ni lui imposer un sens technique étranger au contexte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure accessible. Le pluriel « les foules » et le parallélisme des deux actions sont conservés; aucune note n’est nécessaire, car le plus-que-parfait et les choix lexicaux n’effacent pas ici une ambiguïté substantielle en français.
