id: ACT.17.34
reference: Acts 17:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: fr
  text: Mais quelques hommes s’attachèrent à lui et crurent[a]. Parmi eux se trouvaient Denys l’Aréopagite[b], une femme nommée Damaris, et d’autres avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « eurent foi ». Le grec ne précise pas ici explicitement l’objet du verbe.
    reason: lexical_alternative
  - marker: b
    text: « L’Aréopagite » peut désigner un membre de l’Aréopage ou une personne associée à cette institution.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Mais quelques hommes
  rationale: Le grec désigne explicitement un groupe masculin indéfini et δέ marque un léger contraste avec les réactions précédentes.
- source_word: κολληθέντες αὐτῷ
  choice: s’attachèrent à lui
  rationale: Le participe de κολλάομαι exprime une association personnelle étroite avec Paul; cette formulation française est naturelle et conserve cette force.
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: Rendu direct de πιστεύω, sans préciser un complément que le grec laisse implicite.
- source_word: ἐν οἷς
  choice: Parmi eux se trouvaient
  rationale: Introduit naturellement en français les personnes nommées appartenant au groupe de ceux qui crurent.
- source_word: Διονύσιος
  choice: Denys
  rationale: Forme française traditionnelle et courante du nom grec Διονύσιος.
- source_word: ὁ Ἀρεοπαγίτης
  choice: l’Aréopagite
  rationale: Conserve le titre grec et son lien avec l’Aréopage sans trancher dans le texte entre membre du conseil et personne qui lui était associée.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: une femme nommée Damaris
  rationale: Rendu français direct et idiomatique qui conserve le sexe et le nom de la personne.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: d’autres avec eux
  rationale: Reproduit simplement l’existence de personnes supplémentaires accompagnant les deux personnes nommées.
theological_decisions:
- issue: Portée de πιστεύω dans le contexte
  choice: crurent
  alternative: vinrent à la foi
  rationale: Le verbe affirme leur réponse croyante à la proclamation de Paul, mais sans énoncer ici une formule doctrinale plus développée ni préciser explicitement l’objet grammatical de leur foi.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour éviter une période lourde, tout en conservant l’ordre narratif et les ambiguïtés du grec.
