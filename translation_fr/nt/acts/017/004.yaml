  to: Quelques-uns d’entre eux furent convaincus et se joignirent à Paul et à Silas[a] ; un grand nombre de Grecs qui adoraient Dieu, ainsi que pas mal de femmes influentes, se joignirent aussi à eux.
  rationale: La révision remplace « se laissèrent convaincre » par « furent convaincus » afin de conserver sans ajout la valeur passive de ἐπείσθησαν. Elle explicite aussi la coordination des groupes supplémentaires, ce qui rend plus clair qu’ils se joignent eux aussi à Paul et à Silas. La litote οὐκ ὀλίγαι est rendue par « pas mal de », formulation moderne et naturelle qui préserve son effet atténué. La note est légèrement ajustée pour ne pas qualifier abusivement « partager leur sort » de sens littéral.
