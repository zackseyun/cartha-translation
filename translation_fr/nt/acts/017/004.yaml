id: ACT.17.4
reference: Acts 17:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: fr
  text: Quelques-uns d’entre eux furent convaincus et se joignirent à Paul et à Silas[a] ; un grand nombre de Grecs qui adoraient Dieu, ainsi que pas mal de femmes influentes, se joignirent aussi à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « furent associés à Paul et à Silas ». Ce verbe rare peut aussi évoquer l’idée de partager leur sort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: quelques-uns d’entre eux
  rationale: Rend naturellement l’expression partitive et renvoie aux auditeurs de la synagogue mentionnés dans le contexte.
- source_word: ἐπείσθησαν
  choice: se laissèrent convaincre
  rationale: Préserve le sens passif de πείθω sans le remplacer par un terme plus explicitement religieux comme « crurent ».
- source_word: προσεκληρώθησαν
  choice: se joignirent à
  rationale: Exprime clairement en français moderne l’idée rare d’être associé ou attaché à Paul et Silas; une note conserve la nuance plus littérale.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: des Grecs qui adoraient Dieu
  rationale: Dans les Actes, l’expression désigne des non-Juifs liés au culte du Dieu d’Israël. Cette formulation est plus transparente en français courant que le terme technique « craignant Dieu ».
- source_word: πλῆθος πολὺ
  choice: un grand nombre
  rationale: Formulation française naturelle qui exprime une quantité importante.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: des femmes influentes
  rationale: πρῶτος indique ici un rang social élevé ou une position notable, non un ordre chronologique.
- source_word: οὐκ ὀλίγαι
  choice: bon nombre de
  rationale: Rend l’idée emphatique de la litote grecque dans un français naturel, sans la réduire au simple adjectif « nombreuses ».
- source_word: τε ... τε
  choice: ainsi que ... et
  rationale: Reproduit avec fluidité la structure additive reliant les deux groupes aux quelques personnes déjà mentionnées.
theological_decisions:
- issue: Faut-il rendre ἐπείσθησαν par un vocabulaire explicitement conversionnel ?
  choice: se laissèrent convaincre
  alternative: crurent
  rationale: Le contexte concerne la réponse à la proclamation apostolique, mais le grec emploie πείθω et non πιστεύω. La traduction retenue maintient cette distinction lexicale.
- issue: Jusqu’où expliciter l’identité religieuse des σεβομένων Ἑλλήνων ?
  choice: des Grecs qui adoraient Dieu
  alternative: des Grecs craignant Dieu
  rationale: L’objet de leur dévotion est implicite dans le contexte historique. La formulation choisie le rend intelligible sans faire de « craignant Dieu » une catégorie opaque pour le lecteur moderne.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. « Se laissèrent convaincre » conserve la passivité du grec; « bon nombre » transmet la litote sans tournure française raide.
