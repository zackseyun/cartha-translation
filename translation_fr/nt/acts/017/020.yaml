source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: fr
  text: Car tu nous fais entendre des choses étranges[a]. Nous voulons donc savoir ce que ces choses signifient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses étrangères » ou « qui ne nous sont pas familières ». Le terme grec peut désigner ce qui paraît étrange parce que c’est nouveau ou étranger à l’auditeur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce que ces choses veulent être », expression idiomatique qui signifie « ce que ces choses veulent dire » ou « quelle en est la portée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: étranges
  rationale: Le participe décrit les propos comme insolites ou étrangers aux auditeurs. « Étranges » conserve cette nuance sans leur prêter nécessairement un caractère stupéfiant.
- source_word: τινα
  choice: des choses
  rationale: Avec le participe neutre pluriel, le pronom indéfini désigne un contenu non précisé. En français, « des choses » rend naturellement cette indétermination.
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: tu nous fais entendre
  rationale: Cette formulation idiomatique exprime clairement l’idée d’introduire un message dans le champ auditif des interlocuteurs, sans reproduire maladroitement en français la métaphore grecque des oreilles.
- source_word: βουλόμεθα
  choice: nous voudrions
  rationale: Le conditionnel de politesse est naturel dans cette demande et exprime le souhait des interlocuteurs sans raideur.
- source_word: γνῶναι
  choice: savoir
  rationale: « Savoir » complète naturellement « nous voudrions » et traduit leur désir de comprendre la portée du discours.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: ce que tout cela signifie
  rationale: La tournure grecque demande idiomatiquement quel est le sens ou la portée des propos entendus, plutôt que leur simple identité.
- source_word: γάρ
  choice: car
  rationale: « Car » conserve le lien explicatif avec la demande formulée au verset précédent.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement la conclusion tirée du caractère étrange des propos entendus.
