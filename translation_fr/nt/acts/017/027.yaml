id: ACT.17.27
reference: Acts 17:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: fr
  text: afin qu’ils cherchent Dieu et que, peut-être, ils le cherchent à tâtons et le trouvent, bien qu’en réalité il ne soit pas loin de chacun de nous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: afin qu’ils cherchent
  rationale: L’infinitif dépend du contexte précédent et exprime ici le but; une proposition française introduite par « afin que » en rend clairement la valeur.
- source_word: εἰ ἄρα γε
  choice: peut-être
  rationale: Cette combinaison de particules marque une possibilité envisagée avec réserve; « peut-être » conserve cette nuance sans alourdir la phrase.
- source_word: ψηλαφήσειαν αὐτόν
  choice: ils avancent à tâtons vers lui
  rationale: Le verbe évoque une recherche par le toucher, comme lorsque la perception est limitée ou qu’on se trouve dans l’obscurité. Cette formulation garde l’image tout en restant naturelle en français.
- source_word: καὶ εὕροιεν
  choice: et le trouvent
  rationale: Le second optatif est coordonné au premier. Après « peut-être », le français peut exprimer naturellement la même éventualité sans répéter un auxiliaire modal.
- source_word: καί γε
  choice: bien qu’en réalité
  rationale: Dans ce contexte, l’expression introduit une précision concessive opposant l’incertitude de la recherche humaine au fait de la proximité divine.
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: il ne soit pas loin de chacun de nous
  rationale: La formulation directe conserve l’insistance distributive de ἑνὸς ἑκάστου et demeure idiomatique en français.
theological_decisions:
- issue: Accessibilité de Dieu et recherche humaine
  choice: Maintenir à la fois l’hésitation de la recherche humaine (« peut-être », « à tâtons ») et l’affirmation de la proximité réelle de Dieu.
  alternative: Lisser l’image en disant simplement « parvenir à le trouver », ou rendre la recherche comme assurément couronnée de succès.
  rationale: Le grec juxtapose la perception humaine limitée et la proximité effective de Dieu. La traduction ne doit présenter la recherche ni comme assurée ni comme vaine.
translation_notes:
  register: Français moderne, international et digne. « Avancer à tâtons vers lui » conserve la métaphore tactile sans employer le peu naturel « le tâter »; la phrase reste compréhensible dans une lecture publique.
