id: ACT.17.10
reference: Acts 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: fr
  text: Les frères[a] firent aussitôt partir Paul et Silas, de nuit[b], pour Bérée. À leur arrivée, ceux-ci se rendirent à la synagogue des Juifs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs »; le grec dit « frères », terme qui peut désigner l’ensemble de la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Ou « pendant la nuit ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la synagogue juive ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: les frères
  rationale: Conserve le pluriel masculin du grec et son sens familial communautaire; selon le contexte, le terme peut inclure l’ensemble des croyants.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Exprime naturellement en français moderne la promptitude de l’action.
- source_word: διὰ νυκτός
  choice: de nuit
  rationale: Rend idiomatiquement l’action accomplie pendant la nuit, sans préciser davantage sa durée.
- source_word: ἐξέπεμψαν
  choice: firent … partir
  rationale: Restitue l’idée de faire partir ou d’envoyer au loin, ici dans le contexte d’un départ urgent.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Paul et Silas
  rationale: En français, la coordination nomme naturellement les deux hommes; l’un et l’autre sont clairement inclus sans qu’il soit nécessaire d’ajouter « tous deux ».
- source_word: Βέροιαν
  choice: Bérée
  rationale: Emploie la forme française traditionnelle et courante du nom de la ville.
- source_word: οἵτινες παραγενόμενοι
  choice: À leur arrivée, ceux-ci
  rationale: Rend la proposition relative et le participe temporel dans un enchaînement narratif français clair, tout en maintenant Paul et Silas comme sujets.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: la synagogue des Juifs
  rationale: Préserve la construction génitive grecque et identifie la synagogue de la communauté juive locale.
- source_word: ἀπῄεσαν
  choice: se rendirent à
  rationale: Le verbe signifie ici aller vers le lieu indiqué; cette tournure est naturelle et évite de surinterpréter l’imparfait grec.
theological_decisions:
- issue: Portée communautaire de ἀδελφοὶ
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le texte principal conserve la forme masculine du grec sans exclure la possibilité que le terme désigne plus largement la communauté croyante; cette possibilité est signalée en note.
- issue: Sens de τῶν Ἰουδαίων
  choice: des Juifs
  alternative: juive
  rationale: La formulation transparente désigne l’appartenance communautaire de la synagogue et ne porte aucun jugement théologique ou péjoratif.
translation_notes:
  register: Français international moderne, digne et narratif. « Firent partir » communique l’urgence sans lourdeur; « se rendirent à » offre un enchaînement naturel. Les notes conservent les principales possibilités lexicales sans surcharger le verset.
