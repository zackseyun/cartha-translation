id: ACT.17.14
reference: Acts 17:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: fr
  text: Alors, les frères[a] firent aussitôt partir Paul jusqu’à la mer[b], tandis que Silas et Timothée restèrent là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs »; le grec dit « frères » et peut désigner collectivement les croyants.
    reason: lexical_alternative
  - marker: b
    text: Ou « vers la mer »; la formulation grecque indique un déplacement jusqu’à la côte, sans en préciser davantage les modalités.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: Alors ... aussitôt
  rationale: « Alors » marque la progression du récit, tandis que « aussitôt » rend l’idée d’une action immédiate sans alourdir les particules grecques.
- source_word: ἐξαπέστειλαν
  choice: firent ... partir
  rationale: Cette tournure française naturelle exprime le fait d’envoyer Paul hors du lieu où il se trouvait.
- source_word: οἱ ἀδελφοὶ
  choice: les frères
  rationale: Le masculin pluriel du grec est conservé dans le texte; dans ce contexte, il peut désigner collectivement les membres de la communauté croyante, possibilité signalée en note.
- source_word: πορεύεσθαι
  choice: partir
  rationale: Après le verbe d’envoi, « firent partir » exprime naturellement le déplacement visé et évite une construction française pesante.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: jusqu’à la mer
  rationale: Cette formulation conserve la limite spatiale exprimée par ἕως et laisse ouverte la question de savoir si Paul devait seulement gagner la côte ou poursuivre ensuite par mer.
- source_word: ὑπέμεινάν
  choice: restèrent
  rationale: Dans ce contexte, le verbe indique que Silas et Timothée demeurèrent sur place, et non qu’ils endurèrent une épreuve.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas et Timothée
  rationale: La coordination grecque associe explicitement les deux hommes; en français, la coordination simple est naturelle et suffisamment claire.
- source_word: ἐκεῖ
  choice: là
  rationale: Équivalent locatif direct, courant et naturel en français moderne.
theological_decisions:
- issue: Portée de ἀδελφοί dans la communauté croyante
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le texte principal conserve la forme masculine du grec sans décider que seuls des hommes sont nécessairement visés; la note préserve la possible portée collective du terme.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste concise; « firent aussitôt partir » est idiomatique, et « tandis que » rend clairement le contraste entre le départ de Paul et le maintien sur place de Silas et Timothée.
