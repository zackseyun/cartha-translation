  variant: modern international French
source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: fr
  text: 'Alors Paul, debout au milieu de l’Aréopage, dit : « Athéniens, je vois qu’à tous égards vous êtes très religieux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trop superstitieux » ou « plus religieux ». Le mot grec peut avoir un sens négatif ou positif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς δὲ Παῦλος
  choice: Alors Paul, debout
  rationale: Le participe aoriste plante le décor et δέ marque une transition légère. « Alors Paul, debout » est naturel en français et conserve la posture sans surcharger l’aspect verbal.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: au milieu de l’Aréopage
  rationale: Traduction locative directe qui préserve l’ambiguïté entre le lieu et l’assemblée, contrairement à « devant l’Aréopage », plus interprétatif.
- source_word: ἔφη
  choice: dit
  rationale: Dans cette introduction narrative au discours, l’imparfait de φημί se rend naturellement par le passé simple français.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Athéniens
  rationale: Le vocatif français « Athéniens » constitue une adresse publique naturelle et digne. Une traduction littérale comme « hommes athéniens » serait peu idiomatique en français moderne.
- source_word: κατὰ πάντα
  choice: à tous égards
  rationale: Cette expression française rend clairement la portée distributive de la locution grecque, « sous tous les rapports ».
- source_word: δεισιδαιμονεστέρους
  choice: très religieux
  rationale: Le comparatif peut être positif, neutre ou péjoratif. « Très religieux » rend naturellement son emploi intensif possible sans imposer d’emblée le sens négatif « superstitieux »; les autres nuances sont signalées en note.
- source_word: θεωρῶ
  choice: je vois
  rationale: Rend simplement l’idée d’une constatation fondée sur l’observation et convient au registre oral du discours.
theological_decisions:
- issue: Tonalité de la qualification de la religion athénienne par δεισιδαιμονεστέρους
  choice: « très religieux » dans le texte principal
  alternative: « trop superstitieux » ou « plus religieux »
  rationale: Le terme grec est délibérément susceptible d’une lecture favorable ou défavorable, ce qui convient à l’entrée en matière rhétorique de Paul. Le texte principal reste relativement neutre, tandis que la note conserve les autres possibilités sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, clair et digne. « Aréopage » conserve le nom grec traditionnel; « Athéniens » est une apostrophe publique idiomatique. La ponctuation française et les espaces typographiques suivent l’usage courant.
