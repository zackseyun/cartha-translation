id: ACT.17.30
reference: Acts 17:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: fr
  text: Ainsi donc, Dieu, ayant fermé les yeux sur les temps de l’ignorance[a], ordonne maintenant à tous les êtres humains, partout, de se repentir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant laissé passer les temps d’ignorance ». L’idée est que Dieu les a supportés jusque-là, non qu’il les ait approuvés.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec implique un changement intérieur qui conduit à se détourner de sa conduite précédente.
    reason: lexical_clarification
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  choice: Ainsi donc ... les temps
  rationale: « Ainsi donc » marque la transition déductive, tandis que la construction participiale et « maintenant » maintiennent le contraste entre les temps passés et la situation présente.
- source_word: τῆς ἀγνοίας
  choice: d’ignorance
  rationale: Rend directement ἀγνοία sans ajouter explicitement l’objet de cette ignorance.
- source_word: ὑπεριδὼν
  choice: après être passé par-dessus
  rationale: Cette formulation exprime le fait que Dieu n’est pas intervenu immédiatement contre ces temps, sans suggérer qu’il les approuvait. Elle conserve aussi la valeur antérieure du participe aoriste.
- source_word: τὰ νῦν παραγγέλλει
  choice: ordonne maintenant
  rationale: « Maintenant » fait ressortir le contraste temporel et « ordonne » conserve la force de παραγγέλλω.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: à tous les êtres humains, partout
  rationale: ἄνθρωποι désigne ici les humains en général; πάντας et πανταχοῦ donnent au commandement une portée universelle.
- source_word: μετανοεῖν
  choice: de se repentir
  rationale: « Se repentir » est le terme français courant qui conserve les dimensions intérieure, morale et directionnelle de μετανοέω sans les réduire à un simple changement d’opinion.
theological_decisions:
- issue: Sens de l’action passée de Dieu envers les temps d’ignorance
  choice: Dieu est « passé par-dessus » ces temps au sens où il les a supportés sans exercer immédiatement son jugement.
  alternative: Dieu aurait ignoré, excusé ou approuvé l’idolâtrie.
  rationale: Le participe ὑπεριδών exprime une retenue passée, tandis que l’ordre présent de se repentir maintient la responsabilité morale. La note préserve cette tension sans la résoudre excessivement.
- issue: Portée du commandement
  choice: Le commandement concerne tous les êtres humains, partout.
  alternative: Il ne concernerait que les hommes de sexe masculin ou seulement les non-Juifs.
  rationale: L’emploi générique de τοῖς ἀνθρώποις, renforcé par πάντας πανταχοῦ, indique une portée humaine universelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Êtres humains » explicite la portée générique de ἄνθρωποι; « se repentir » conserve le terme théologique courant tout en étant éclairé par une note.
