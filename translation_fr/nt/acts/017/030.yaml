revisions:
- from: Ainsi donc, après être passé par-dessus les temps d’ignorance[a], Dieu ordonne maintenant à tous les êtres humains, partout, de se repentir[b].
  to: Ainsi donc, Dieu, ayant fermé les yeux sur les temps de l’ignorance[a], ordonne maintenant à tous les êtres humains, partout, de se repentir[b].
  rationale: La révision remplace le calque non idiomatique « après être passé par-dessus » par « ayant fermé les yeux sur », expression française naturelle qui rend le participe aoriste et le sens de retenue antérieure. La note a conserve explicitement la nuance de tolérance plutôt que d'approbation. Aucun changement de portée théologique ou de sens du passage n'est apporté.
