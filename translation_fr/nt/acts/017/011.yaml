id: ACT.17.11
reference: Acts 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: fr
  text: 'Ceux-ci avaient une attitude plus noble que les habitants de Thessalonique[a] : ils accueillirent la parole avec beaucoup d’empressement[b], tout en examinant chaque jour les Écritures pour voir s’il en était bien ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient de condition plus noble que ceux de Thessalonique ». Le grec peut désigner soit une disposition plus digne d’éloge, soit, moins probablement ici, un rang social plus élevé.
    reason: alternative lexicale
  - marker: b
    text: Ou « reçurent le message ».
    reason: alternative lexicale
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: avaient des dispositions plus nobles
  rationale: Le comparatif peut évoquer soit la noblesse sociale, soit une disposition digne d’éloge. La suite du verset explique cette qualité par l’accueil empressé de la parole et l’examen des Écritures ; le sens moral est donc privilégié sans effacer l’autre possibilité.
- source_word: οἵτινες
  choice: ': ils'
  rationale: Le pronom relatif introduit ici une explication de leur noblesse de disposition. En français, les deux-points suivis de « ils » rendent naturellement ce rapport explicatif.
- source_word: ἐδέξαντο τὸν λόγον
  choice: accueillirent la parole
  rationale: « Accueillirent » exprime une réception favorable, tandis que « la parole » conserve la résonance narrative et théologique de λόγος dans les Actes.
- source_word: μετὰ πάσης προθυμίας
  choice: avec le plus grand empressement
  rationale: Cette formulation idiomatique exprime à la fois l’ardeur, la disponibilité et la valeur intensive de πάσης.
- source_word: τὸ καθ’ ἡμέραν
  choice: chaque jour
  rationale: La locution a une fonction adverbiale et marque un examen habituel, jour après jour.
- source_word: ἀνακρίνοντες
  choice: examinaient
  rationale: Le verbe désigne un examen attentif ou une investigation. « Examinaient » convient au fait de vérifier des affirmations à partir des Écritures sans imposer un vocabulaire judiciaire trop technique.
- source_word: τὰς γραφὰς
  choice: les Écritures
  rationale: Dans ce contexte, le pluriel désigne les écrits sacrés juifs ; « les Écritures » est la désignation française habituelle et précise.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: pour voir s’il en était bien ainsi
  rationale: Cette tournure française naturelle conserve la valeur d’interrogation indirecte et l’idée de vérifier si les affirmations entendues correspondaient aux Écritures.
theological_decisions:
- issue: Sens de εὐγενέστεροι dans le contexte
  choice: Une disposition digne d’éloge (« des dispositions plus nobles »)
  alternative: Une naissance ou une condition sociale plus noble
  rationale: Le verset caractérise leur noblesse par leur réaction à la proclamation et leur examen des Écritures. Le texte principal privilégie donc le sens moral, tandis que la note conserve l’ambiguïté lexicale réelle.
- issue: Traduction de λόγος
  choice: « la parole » dans le texte principal
  alternative: « le message »
  rationale: « La parole » reste compréhensible et préserve les liens lexicaux de λόγος dans les Actes, sans ajouter de précision doctrinale étrangère au grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le démonstratif initial « Ceux-ci » reprend les personnes mentionnées dans le contexte sans ajouter de marqueur temporel absent du grec. L’imparfait « examinaient » rend la pratique répétée signalée par « chaque jour », tandis que le passé simple « accueillirent » présente leur réception initiale de la parole.
