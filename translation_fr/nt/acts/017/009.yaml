id: ACT.17.9
reference: Acts 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: fr
  text: Après avoir reçu de Jason et des autres une garantie suffisante[a], ils les relâchèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une somme suffisante » ; il s’agissait probablement d’une caution ou d’un engagement destiné à garantir une conduite paisible.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Après avoir reçu
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. « Après avoir reçu » rend naturellement cette succession et convient mieux qu’« avoir pris » à une garantie remise aux autorités.
- source_word: τὸ ἱκανὸν
  choice: une garantie suffisante
  rationale: Dans ce contexte judiciaire, l’expression désigne vraisemblablement une sûreté ou un engagement jugé suffisant. Cette formulation conserve à la fois le sens légal probable et la notion explicite de suffisance, sans imposer une institution moderne précise.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: de Jason et des autres
  rationale: παρά avec le génitif indique ici la provenance. « Les autres » désigne naturellement les autres personnes retenues avec Jason.
- source_word: ἀπέλυσαν
  choice: ils les relâchèrent
  rationale: Dans ce cadre judiciaire, ἀπολύω signifie remettre en liberté. « Relâchèrent » rend clairement cette valeur sans ajouter de précision absente du grec.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom accusatif pluriel renvoie aux personnes détenues, Jason et les autres.
theological_decisions: []
