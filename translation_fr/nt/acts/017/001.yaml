id: ACT.17.1
reference: Acts 17:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: fr
  text: Après avoir traversé Amphipolis et Apollonie, ils arrivèrent à Thessalonique, où se trouvait une synagogue des Juifs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: Après avoir traversé
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. Cette formulation naturelle indique qu’ils sont passés par ces villes, sans en faire les étapes principales du récit.
- source_word: δὲ
  choice: —
  rationale: Ici, δέ sert de transition narrative légère; l’omettre donne un français fluide sans perdre de contraste significatif.
- source_word: Ἀμφίπολιν
  choice: Amphipolis
  rationale: Forme française usuelle de ce nom de lieu antique.
- source_word: Ἀπολλωνίαν
  choice: Apollonie
  rationale: Forme française usuelle de ce nom de lieu antique.
- source_word: ἦλθον
  choice: ils arrivèrent
  rationale: Le verbe désigne leur déplacement jusqu’à Thessalonique. « Arrivèrent » convient naturellement au contexte d’un itinéraire et marque clairement la destination.
- source_word: εἰς Θεσσαλονίκην
  choice: à Thessalonique
  rationale: εἰς avec un nom de ville indique ici le mouvement vers la destination; « à Thessalonique » est idiomatique en français.
- source_word: ὅπου
  choice: où
  rationale: Équivalent français direct et naturel de l’adverbe relatif de lieu.
- source_word: συναγωγὴ
  choice: une synagogue
  rationale: Le nom grec est sans article. L’article indéfini français respecte au mieux cette forme tout en restant naturel.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Le génitif exprime l’association de la synagogue avec la communauté juive locale. La formulation est directe et précise dans ce contexte.
theological_decisions:
- issue: Sens de Ἰουδαίων dans ce cadre narratif
  choice: des Juifs
  alternative: des Judéens; de la communauté juive
  rationale: Il s’agit de la communauté juive liée à la synagogue de Thessalonique, et non spécialement d’habitants de la Judée. « Des Juifs » conserve la désignation ethno-religieuse du grec sans paraphrase.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple maintient le registre digne d’un récit biblique écrit tout en restant immédiatement compréhensible. Aucun appel de note n’est nécessaire, car les variantes anglaises fournies ne signalent pas ici une ambiguïté grecque exigeant une note en français.
