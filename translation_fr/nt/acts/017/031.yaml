id: ACT.17.31
reference: Acts 17:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: fr
  text: Car il a fixé un jour où il va juger le monde habité avec justice[a], par un homme qu’il a désigné. Il en a fourni la preuve à tous[b] en le ressuscitant d’entre les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la droiture » (δικαιοσύνῃ).
    reason: lexical_alternative
  - marker: b
    text: Ou « il a donné à tous une assurance »; plus littéralement, « ayant donné la foi à tous » (πίστιν παρασχὼν πᾶσιν). Ici, l’expression désigne vraisemblablement une preuve ou une garantie, apportée par la résurrection.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: Car
  rationale: Introduit naturellement en français la raison de l’appel à la repentance formulé au verset précédent.
- source_word: ἔστησεν ἡμέραν
  choice: il a fixé un jour
  rationale: Exprime un jour déterminé et établi, tout en gardant la solennité de l’énoncé.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: où il va juger
  rationale: Rend la perspective future portée par μέλλει sans la réduire à un simple futur.
- source_word: τὴν οἰκουμένην
  choice: le monde habité
  rationale: Conserve le sens propre de οἰκουμένη et la portée universelle du jugement sur l’humanité.
- source_word: ἐν δικαιοσύνῃ
  choice: avec justice
  rationale: Dans un contexte judiciaire, « avec justice » est l’expression française la plus naturelle pour indiquer la norme ou la manière du jugement; « selon la justice » reste possible.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: par un homme qu’il a désigné
  rationale: « Homme » respecte la valeur masculine précise de ἀνήρ; « désigné » rend ὁρίζω sans suggérer nécessairement l’attribution d’une fonction administrative.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: Il en a donné à tous la preuve
  rationale: Dans cette construction idiomatique, πίστις désigne une preuve ou une assurance offerte à tous plutôt que la foi subjective.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: en le ressuscitant d’entre les morts
  rationale: Le participe exprime naturellement le moyen par lequel Dieu a fourni cette preuve.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le contexte du jugement
  choice: avec justice
  alternative: selon la justice; dans la justice
  rationale: Le contexte met en avant le caractère juste du jugement. La formulation choisie est idiomatique en français sans amoindrir la notion de justice conforme à la droiture de Dieu.
- issue: Sens de πίστις dans πίστιν παρασχὼν πᾶσιν
  choice: preuve
  alternative: assurance; foi
  rationale: Avec παρέχω et la résurrection comme moyen, le terme indique ici une garantie ou preuve publique. La note conserve la littéralité et l’autre nuance possible.
- issue: Valeur de ἀνδρί
  choice: un homme
  alternative: l’homme
  rationale: Le grec emploie le terme masculin ἀνήρ sans article. L’indéfini préserve la forme de l’expression, même si le contexte chrétien identifie cet homme à Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque longue est divisée en deux phrases pour éviter une construction participiale lourde, tout en maintenant clairement que la résurrection constitue la preuve donnée à tous.
