id: ACT.17.18
reference: Acts 17:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: fr
  text: 'Quelques philosophes épicuriens et stoïciens discutaient aussi avec lui[a]. Certains disaient : « Que peut bien vouloir dire ce bavard[b] ? » D’autres disaient : « Il semble annoncer des divinités étrangères[c]. » En effet, Paul proclamait la bonne nouvelle concernant Jésus et la résurrection[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « échangeaient avec lui » ou « débattaient avec lui » ; le verbe grec peut désigner une discussion, éventuellement contradictoire.
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « bavard » est une insulte qui signifie littéralement « picoreur de graines ». Il désignait quelqu’un que l’on accusait de recueillir et de répéter des bribes d’idées.
    reason: cultural_note
  - marker: c
    text: Ou « des êtres divins étrangers », voire « des démons étrangers ». Ici, les locuteurs pensent vraisemblablement à des êtres divins inconnus selon leur cadre religieux, et non nécessairement à des esprits mauvais au sens chrétien ultérieur.
    reason: alternative_reading
  - marker: d
    text: Certains pensent que les Athéniens ont pu prendre « la résurrection » pour le nom d’une autre divinité, puisque Paul annonçait Jésus et la résurrection.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: discutaient avec lui
  rationale: Le verbe désigne ici un échange actif qui peut aller de la conversation au débat. « Discutaient avec lui » reste naturel en français et conserve cette amplitude.
- source_word: σπερμολόγος
  choice: bavard
  rationale: Le terme est nettement méprisant et désigne, littéralement, quelqu’un qui picore des graines, puis figurativement une personne qui recueille et répète des bribes d’idées. « Bavard » rend l’insulte de façon concise, tandis que la note en précise l’image culturelle.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Que veut donc dire… ?
  rationale: Cette formulation idiomatique rend la spéculation dédaigneuse exprimée par l’optatif avec ἄν sans alourdir le français.
- source_word: Ξένων δαιμονίων
  choice: des divinités étrangères
  rationale: Dans la bouche de philosophes athéniens, δαιμόνια désigne des êtres divins inconnus selon leur propre cadre religieux, sans impliquer nécessairement des esprits mauvais au sens chrétien ultérieur.
- source_word: καταγγελεὺς εἶναι
  choice: annoncer
  rationale: Le grec présente Paul comme quelqu’un qui fait connaître publiquement ces divinités supposées. La tournure verbale est plus naturelle en français qu’un substantif tel que « proclamateur ».
- source_word: εὐηγγελίζετο
  choice: proclamait la bonne nouvelle
  rationale: 'Cette expression conserve explicitement l’idée propre au verbe : annoncer une bonne nouvelle, plutôt que simplement prêcher.'
- source_word: ἀνάστασιν
  choice: la résurrection
  rationale: Le nom commun désigne le contenu du message de Paul. La traduction ne le personnifie pas, tout en signalant en note le possible malentendu des auditeurs.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: philosophes épicuriens et stoïciens
  rationale: C’est la formulation française la plus naturelle pour nommer les membres de ces deux écoles philosophiques.
theological_decisions:
- issue: Sens de δαιμόνια dans les paroles de philosophes païens
  choice: divinités étrangères
  alternative: démons étrangers ; dieux inconnus
  rationale: « Démons » risquerait d’introduire dans leur accusation le sens chrétien ultérieur d’esprits mauvais. « Divinités » représente mieux les catégories religieuses des locuteurs et préserve leur point de vue.
- issue: Éventuelle personnification de ἀνάστασις
  choice: la résurrection
  alternative: Résurrection, comprise comme le nom d’une divinité
  rationale: L’explication narrative de Luc décrit le contenu de la proclamation de Paul. Le texte principal garde donc le nom commun, tandis qu’une note préserve l’hypothèse selon laquelle les Athéniens auraient pris la résurrection pour une seconde divinité.
- issue: Référent explicite du sujet de εὐηγγελίζετο
  choice: Paul proclamait
  alternative: il proclamait
  rationale: Le grec emploie un sujet implicite renvoyant à Paul. Son nom est rétabli en français après les paroles de plusieurs groupes afin d’éviter toute ambiguïté sans modifier le sens.
translation_notes:
  register: Français international actuel, digne et accessible. Le dialogue conserve le mépris des philosophes sans recourir à une insulte trop familière. La dernière proposition explicative est légèrement explicitée par « Paul » pour clarifier le changement de locuteurs.
