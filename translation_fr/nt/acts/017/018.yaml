  source_fidelity: 'La structure du verset, les écoles philosophiques, le sens de συνέβαλλον, l’insulte σπερμολόγος, « divinités étrangères », et l’explication finale sont globalement fidèles au grec. Toutefois, « la bonne nouvelle de Jésus » est ambigu en français : cela peut désigner la bonne nouvelle apportée par Jésus, alors que τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν désigne les deux objets de la proclamation. La formulation interrogative peut aussi mieux rendre la nuance spéculative et dédaigneuse de l’optatif avec ἄν.'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Que peut bien vouloir dire ce bavard ? » est plus idiomatique et restitue mieux la nuance du grec que « Que veut donc dire ce bavard ? ».
  terminology: « Philosophes épicuriens et stoïciens », « divinités étrangères », « la résurrection » et « proclamait la bonne nouvelle » sont des choix justes. « Bavard », éclairé par la note, demeure une solution concise et accessible pour l’injure imagée σπερμολόγος.
