    rationale: Cette expression française est syntaxiquement ambiguë. Le grec dit que Paul annonçait la bonne nouvelle au sujet de Jésus et de la résurrection ; « concernant Jésus et la résurrection » rend explicitement les deux compléments sans ajouter d’interprétation.
  - severity: low
    issue: Nuance de Τί ἂν θέλοι ... λέγειν
    rationale: « Que veut donc dire » peut se comprendre comme une simple demande de sens. « Que peut bien vouloir dire » rend plus naturellement la spéculation teintée de mépris exprimée par l’optatif avec ἄν.
