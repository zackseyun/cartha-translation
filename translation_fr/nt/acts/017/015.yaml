id: ACT.17.15
reference: Acts 17:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: fr
  text: 'Ceux qui accompagnaient Paul le conduisirent jusqu’à Athènes[a]. Après avoir reçu l’instruction destinée à Silas et à Timothée : qu’ils le rejoignent au plus vite[b], ils s’en allèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le conduisirent à Athènes ». « Jusqu’à Athènes » rend plus explicitement l’idée qu’ils l’accompagnèrent jusqu’à cette destination.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’ordre ». Le nom grec peut désigner aussi bien une instruction qu’un ordre revêtu d’autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: accompagnaient
  rationale: Dans ce contexte de voyage, le participe désigne ceux qui accompagnaient Paul jusqu’à sa destination, vraisemblablement pour l’assister et assurer sa sécurité. « Accompagnaient » est naturel et n’ajoute pas une nuance militaire que pourrait suggérer « escortaient ».
- source_word: ἤγαγον
  choice: le conduisirent
  rationale: 'L’aoriste présente l’action menée à son terme : les accompagnateurs conduisent Paul jusqu’à Athènes. Cette formulation évite l’ambiguïté possible de « l’amenèrent » quant au point de vue narratif.'
- source_word: ἕως Ἀθηνῶν
  choice: jusqu’à Athènes
  rationale: ἕως exprime l’étendue du déplacement jusqu’à la destination atteinte. « Jusqu’à Athènes » en conserve directement la valeur.
- source_word: λαβόντες ἐντολήν
  choice: Après avoir reçu … la consigne
  rationale: Le participe a ici une valeur temporelle. « Consigne » garde la force directive de ἐντολή tout en convenant naturellement à des instructions confiées à des messagers.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: pour Silas et Timothée
  rationale: πρός indique les destinataires de la consigne que les accompagnateurs doivent rapporter.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: de le rejoindre au plus vite
  rationale: La proposition donne le contenu de la consigne. « Au plus vite » exprime l’urgence de ὡς τάχιστα, et « le rejoindre » rend idiomatiquement le mouvement vers Paul.
- source_word: ἐξῄεσαν
  choice: ils repartirent
  rationale: L’imparfait grec clôt la scène en indiquant leur départ. « Repartirent » précise naturellement qu’ils quittent Athènes après y avoir accompagné Paul.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est divisée en deux pour rester claire à la lecture. « Accompagnaient » et « consigne » évitent respectivement une coloration militaire et une autorité inutilement accentuée, tandis que les notes signalent les principales possibilités lexicales.
