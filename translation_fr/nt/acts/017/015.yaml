revisions:
- from: Ceux qui accompagnaient Paul le conduisirent jusqu’à Athènes[a]. Après avoir reçu pour Silas et Timothée la consigne de le rejoindre au plus vite[b], ils repartirent.
  to: 'Ceux qui accompagnaient Paul le conduisirent jusqu’à Athènes[a]. Après avoir reçu l’instruction destinée à Silas et à Timothée : qu’ils le rejoignent au plus vite[b], ils s’en allèrent.'
  rationale: La révision élimine l’implication potentielle de retour contenue dans « repartirent » et rend plus explicitement, sans ajout de sens, que Silas et Timothée sont les destinataires de l’instruction. Les ancres et le contenu des notes sont conservés, avec un léger ajustement stylistique de la note b.
