source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: fr
  text: Tu n’es donc pas l’Égyptien qui, il y a quelque temps, a provoqué une révolte et emmené dans le désert les quatre mille hommes sicaires[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes au poignard » ; le grec désigne les sicaires, connus pour leurs attaques au poignard, souvent dissimulé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Alors, tu n’es pas
  rationale: Dans cette question, la combinaison exprime une déduction tirée du fait que Paul parle grec. « Alors » rend naturellement cette valeur inférentielle en français.
- source_word: ὁ Αἰγύπτιος
  choice: l’Égyptien
  rationale: L’article désigne un personnage précis et connu de l’interlocuteur ; « l’Égyptien » conserve cette référence définie.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: il y a quelque temps
  rationale: L’expression situe les faits peu avant le moment présent sans préciser un nombre exact de jours. Cette formulation est naturelle et conserve l’indétermination temporelle.
- source_word: ἀναστατώσας
  choice: a provoqué une révolte
  rationale: Dans ce contexte politique, le verbe évoque le déclenchement de troubles insurrectionnels plutôt qu’un simple désordre.
- source_word: ἐξαγαγὼν
  choice: emmené
  rationale: Le participe décrit le fait de conduire un groupe vers l’extérieur, ici jusque dans le désert. « Emmené » est idiomatique en français.
- source_word: εἰς τὴν ἔρημον
  choice: dans le désert
  rationale: ἔρημος désigne ici une région déserte ou inhabitée. « Le désert » est la formulation française courante sans imposer nécessairement l’image d’une étendue sablonneuse.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: les quatre mille hommes
  rationale: L’article présente ces hommes comme un groupe défini lié à l’Égyptien ; il est donc conservé.
- source_word: τῶν σικαρίων
  choice: les sicaires
  rationale: Le terme grec est un nom historique dérivé de la dague (sica) et désigne des hommes connus pour leurs assassinats au couteau. « Sicaires » existe en français et préserve ici l’appellation du groupe, tandis que son sens est explicité en note.
