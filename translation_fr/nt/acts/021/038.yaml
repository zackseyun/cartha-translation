revisions:
- from: Alors, tu n’es pas l’Égyptien qui, il y a quelque temps, a provoqué une révolte et emmené dans le désert les quatre mille hommes, les sicaires[a] ?
  to: Tu n’es donc pas l’Égyptien qui, il y a quelque temps, a provoqué une révolte et emmené dans le désert les quatre mille hommes sicaires[a] ?
  rationale: La révision rend explicitement et naturellement la relation entre « les quatre mille hommes » et « les sicaires », tout en maintenant le nombre, l’identification historique, l’ambiguïté géographique de ἔρημος (« désert ») et l’indétermination temporelle. Elle améliore aussi l’idiome français de la question inférentielle et de la note.
