    issue: Construction « les quatre mille hommes, les sicaires »
    rationale: 'Cette apposition est grammaticalement et sémantiquement maladroite : elle ne marque pas naturellement que les quatre mille hommes sont qualifiés comme sicaires, ce qu’exprime le génitif grec τῶν σικαρίων.'
  - severity: low
    issue: Position de l’inférence dans « Alors, tu n’es pas »
    rationale: La formulation est possible, mais « Tu n’es donc pas… ? » est plus idiomatique dans une question française de déduction et conserve la valeur de ἄρα.
  - severity: low
    issue: Formulation de note « attaques au couteau dissimulé »
    rationale: Le singulier « couteau dissimulé » est moins naturel ici ; « attaques au poignard, souvent dissimulé » exprime plus clairement l’arrière-plan lexical de σικάριοι sans surdéfinir le terme.
