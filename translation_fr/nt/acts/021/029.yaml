id: ACT.21.29
reference: Acts 21:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: fr
  text: En effet, ils avaient vu auparavant Trophime d’Éphèse avec lui dans la ville, et ils pensaient que Paul l’avait fait entrer dans le Temple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec traduit par « Temple » peut désigner l’ensemble du domaine ou de l’enceinte du Temple, et pas seulement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν … προεωρακότες
  choice: ils avaient vu auparavant
  rationale: La construction périphrastique exprime une action antérieure; le plus-que-parfait avec « auparavant » la rend clairement et naturellement.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: Trophime d’Éphèse
  rationale: L’adjectif en apposition indique l’origine de Trophime. « D’Éphèse » est plus naturel en français moderne que « l’Éphésien ».
- source_word: ἐν τῇ πόλει
  choice: dans la ville
  rationale: La formule désigne Jérusalem comme cadre urbain, par contraste avec l’enceinte du Temple.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: Traduction directe et idiomatique; dans le contexte, le pronom renvoie à Paul.
- source_word: ἐνόμιζον
  choice: ils pensaient
  rationale: Le verbe désigne ici une conclusion supposée à partir de ce qu’ils avaient vu, sans en faire une connaissance certaine.
- source_word: εἰς τὸ ἱερὸν
  choice: dans le Temple
  rationale: ἱερόν peut désigner l’ensemble du domaine ou de l’enceinte du Temple, et non seulement le sanctuaire intérieur; la majuscule identifie naturellement le Temple de Jérusalem en français.
- source_word: εἰσήγαγεν
  choice: l’avait fait entrer
  rationale: Cette tournure rend explicitement le sens causatif de « faire entrer » quelqu’un et situe naturellement l’action avant leur supposition.
- source_word: γάρ
  choice: En effet
  rationale: Le connecteur introduit l’explication de l’accusation formulée dans le contexte précédent.
theological_decisions:
- issue: Portée de ἱερόν dans l’accusation portée contre Paul
  choice: « le Temple » dans le texte, avec une note précisant qu’il peut s’agir de l’ensemble du domaine ou de l’enceinte du Temple
  alternative: « l’enceinte du Temple » ou « les cours du Temple »
  rationale: Le terme grec est plus large que ναός et la précision importe historiquement, puisque l’accusation concerne l’accès d’un non-Juif à une zone sacrée interdite. La traduction principale reste fluide sans réduire abusivement le terme au sanctuaire intérieur.
translation_notes:
  register: Français international moderne, clair et digne. « Trophime d’Éphèse » est idiomatique; « le Temple » conserve la formulation courante, tandis que la note maintient la précision historique et lexicale.
