source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: fr
  text: Toute la ville fut en émoi, et le peuple se rassembla[a]. Ils saisirent Paul et le traînèrent hors de l’enceinte du Temple[b] ; aussitôt, les portes[c] furent fermées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un rassemblement du peuple se produisit ». Le grec décrit une convergence soudaine de la foule.'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne l’ensemble du domaine du Temple, avec ses cours et ses bâtiments, et non spécialement le sanctuaire intérieur.
    reason: cultural_note
  - marker: c
    text: 'Ou : « les portes d’accès ». Dans ce contexte, il peut s’agir des grandes portes de l’enceinte du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη
  choice: fut en émoi
  rationale: Le passif de κινέω décrit ici l’agitation collective de la ville, non un déplacement matériel. « Fut en émoi » est naturel et garde l’idée d’un bouleversement général.
- source_word: τε
  choice: et
  rationale: La particule relie avec souplesse cet événement au récit précédent ; la coordination française « et » en rend naturellement la continuité.
- source_word: ἡ πόλις ὅλη
  choice: toute la ville
  rationale: Rendu direct qui conserve l’étendue donnée par ὅλη.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: le peuple accourut de toutes parts
  rationale: συνδρομή évoque une convergence ou un rassemblement précipité. Cette formulation française exprime clairement le mouvement soudain de la foule sans suggérer que tous les habitants, sans exception, y participaient.
- source_word: ἐπιλαβόμενοι
  choice: Ils saisirent
  rationale: Le participe exprime une prise physique énergique et précède logiquement l’action de traîner Paul.
- source_word: εἷλκον
  choice: le traînèrent
  rationale: Le verbe signifie tirer ou traîner avec force. Le passé simple convient au récit français ; le contexte fait néanmoins percevoir l’action en cours portée par l’imparfait grec.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: hors de l’enceinte du Temple
  rationale: ἱερόν désigne ici l’ensemble du domaine ou des parvis du Temple, plutôt que le sanctuaire intérieur. « Enceinte du Temple » rend cette précision dans le texte même.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Adverbe français courant qui exprime clairement l’immédiateté.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: les portes furent fermées
  rationale: Le passif et le pluriel sont conservés. « Portes » peut naturellement désigner les accès monumentaux de l’enceinte.
