revisions:
- from: Toute la ville fut en émoi, et le peuple accourut de toutes parts[a]. Ils saisirent Paul et le traînèrent hors de l’enceinte du Temple[b] ; aussitôt, les portes[c] furent fermées.
  to: Toute la ville fut en émoi, et le peuple se rassembla[a]. Ils saisirent Paul et le traînèrent hors de l’enceinte du Temple[b] ; aussitôt, les portes[c] furent fermées.
  rationale: 'La révision supprime l’ajout interprétatif « de toutes parts » et ajuste la note correspondante. Le reste du texte est conservé: il rend la perturbation de la ville, la saisie et l’expulsion de Paul, l’immédiateté de la fermeture, ainsi que la distinction entre le complexe du Temple et le sanctuaire intérieur.'
  reviewer_model: gpt-5.6-terra
