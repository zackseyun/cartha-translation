  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: fr
  text: Dans la foule, les uns criaient une chose, les autres une autre. Comme il ne pouvait pas établir les faits avec certitude[a] à cause du tumulte, il ordonna qu’on conduise Paul dans la caserne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vérité des faits » ou « ce qui était certain ».
    reason: lexical_alternative
  - marker: b
    text: La « caserne » désigne les quartiers des soldats romains, probablement situés dans la forteresse attenante à l’esplanade du Temple.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: Dans la foule, les uns criaient une chose, les autres une autre
  rationale: La tournure « les uns… les autres » restitue naturellement le contraste distributif grec, tandis que l’imparfait « criaient » exprime les clameurs continues sans qualifier la foule de manière excessive.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Comme il ne pouvait pas établir
  rationale: Le génitif absolu a ici une valeur causale. « Établir » rend γνῶναι dans le sens contextuel de parvenir à déterminer une information fiable.
- source_word: τὸ ἀσφαλές
  choice: les faits avec certitude
  rationale: L’expression grecque désigne ce qui est sûr ou établi. Cette formulation française conserve à la fois l’idée des faits recherchés et celle de certitude, sans trancher artificiellement entre ces nuances.
- source_word: διὰ τὸν θόρυβον
  choice: à cause du tumulte
  rationale: « Tumulte » exprime à la fois le bruit et le désordre collectif impliqués par θόρυβος dans cette scène.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: il ordonna qu’on conduise Paul
  rationale: La construction impersonnelle française préserve l’absence d’agent exprimé dans le grec. Le nom « Paul », clair dans le contexte immédiat, évite l’ambiguïté naturelle du double pronom « il… le » en français.
- source_word: εἰς τὴν παρεμβολήν
  choice: dans la caserne
  rationale: Dans ce contexte, παρεμβολή désigne les quartiers militaires romains de la forteresse attenante à l’esplanade du Temple. « Caserne » est le terme moderne le plus clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible à la lecture publique; « tumulte » conserve la force de la scène, et les notes explicitent sans alourdir le verset.
