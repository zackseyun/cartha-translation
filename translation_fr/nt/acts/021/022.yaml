  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: fr
  text: Que faire donc ? Ils apprendront certainement que tu es arrivé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qu’est-ce donc ? » Cette tournure grecque demande, dans le contexte, quelle conduite adopter compte tenu de la situation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Que faire donc ?
  rationale: Littéralement, « Qu’est-ce donc ? » Dans ce contexte, cette tournure grecque introduit une question pratique sur la conduite à tenir. « Que faire donc ? » en rend naturellement la force sans développer excessivement le sens.
- source_word: πάντως
  choice: certainement
  rationale: L’adverbe souligne ici que l’information parviendra inévitablement aux personnes concernées.
- source_word: ἀκούσονται
  choice: ils apprendront
  rationale: Le futur moyen a ici un sens actif. En français, « apprendre que » exprime idiomatiquement le fait de recevoir cette nouvelle ; le sujet pluriel, implicite en grec, est conservé par « ils ».
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’ils apprendront, et non une cause.
- source_word: ἐλήλυθας
  choice: tu es arrivé
  rationale: Le parfait de ἔρχομαι présente l’arrivée de Paul comme accomplie avec un résultat présent. « Tu es arrivé » rend cet état résultant plus naturellement en français que « tu es venu » dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse singulière à Paul. La formulation concise garde le mouvement pratique et urgent du dialogue.
