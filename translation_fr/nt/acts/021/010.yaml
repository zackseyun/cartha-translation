  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: fr
  text: Alors que nous restions là encore plusieurs jours, un prophète nommé Agabus descendit de Judée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: Comme nous prolongions notre séjour là
  rationale: Le participe présent au génitif pluriel forme un génitif absolu à valeur temporelle. Le sujet implicite désigne, d’après le contexte, le narrateur et ses compagnons. Cette formulation exprime naturellement la continuation du séjour.
- source_word: δὲ
  choice: Comme
  rationale: La légère transition marquée par δέ est intégrée à la proposition temporelle en français, sans alourdir la narration par un « or » ou un « et » superflu.
- source_word: ἡμέρας πλείους
  choice: pendant plusieurs jours
  rationale: L’accusatif indique la durée. Dans ce contexte, πλείους évoque un certain nombre de jours supplémentaires; « plusieurs jours » est l’équivalent idiomatique le plus naturel.
- source_word: κατῆλθέν
  choice: descendit
  rationale: Le verbe conserve le mouvement exprimé par κατέρχομαι, de la Judée vers la région côtière, tout en s’insérant dans un récit au passé simple.
- source_word: τις
  choice: un
  rationale: Le pronom indéfini introduit un nouveau personnage. En français, l’article indéfini devant « prophète » rend cette fonction sans tournure pesante.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: de Judée
  rationale: Traduction directe et idiomatique de la provenance géographique.
- source_word: προφήτης
  choice: un prophète
  rationale: Terme français courant correspondant directement au rôle désigné dans le texte grec, sans paraphrase doctrinale.
- source_word: ὀνόματι Ἅγαβος
  choice: nommé Agabus
  rationale: Le datif ὀνόματι introduit idiomatiquement le nom de la personne; « nommé Agabus » est naturel en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit écrit biblique, tandis que l’imparfait de la proposition temporelle rend l’action en cours. Aucune note n’est nécessaire.
