revisions:
- from: 'Après les avoir entendus, ils glorifiaient Dieu. Puis ils lui dirent : « Tu vois, frère, combien de dizaines de milliers, parmi les Juifs[a], ont cru ! Et tous sont pleins de zèle pour la Loi. »'
  to: 'Après avoir entendu cela, ils rendirent gloire à Dieu et lui dirent : « Tu vois, frère, combien de dizaines de milliers[a] de Juifs[b] ont cru, et ils sont tous zélés pour la Loi. »'
  rationale: La révision remplace le pronom fautif par « cela », qui reprend le rapport immédiatement précédent. Elle emploie une syntaxe française fluide pour le grand nombre de croyants juifs, supprime l’exclamation non exigée par le grec et maintient la distinction entre leur foi et leur zèle pour la Loi. Les notes conservent les deux ambiguïtés lexicales pertinentes.
