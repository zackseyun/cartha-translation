  naturalness: La révision produit une phrase française plus nette et idiomatique. « Rendirent gloire à Dieu » est une expression française biblique et actuelle, et « des dizaines de milliers de Juifs ont cru » évite l’incise maladroite de la version proposée.
  terminology: « Juifs », avec la note sur « Judéens », convient au contexte. « La Loi » rend naturellement la Loi mosaïque. « Zélés pour la Loi » conserve l’intensité de ζηλωταί sans l’affaiblir en simple « attachés ». Une note est ajoutée sur « dizaines de milliers » afin de préserver la souplesse sémantique de μυριάδες.
