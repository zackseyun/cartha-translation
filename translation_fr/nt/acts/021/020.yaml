source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: fr
  text: 'Après avoir entendu cela, ils rendirent gloire à Dieu et lui dirent : « Tu vois, frère, combien de dizaines de milliers[a] de Juifs[b] ont cru, et ils sont tous zélés pour la Loi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « combien de myriades » ou, plus généralement, « combien de très nombreux milliers ». Le grec μυριάδες peut désigner des unités de dix mille ou un très grand nombre.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les Judéens », si le terme est compris géographiquement plutôt qu’au sens ethnoreligieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Après les avoir entendus
  rationale: Le participe aoriste exprime une action antérieure. Le pronom renvoie naturellement au récit de Paul dans le contexte précédent, sans ajouter un démonstratif absent du grec.
- source_word: ἐδόξαζον
  choice: ils glorifiaient Dieu
  rationale: L’imparfait grec présente leur réaction en cours ou répétée; « glorifiaient » conserve aussi le poids religieux de δοξάζω.
- source_word: εἶπόν τε αὐτῷ
  choice: Puis ils lui dirent
  rationale: L’aoriste marque l’étape narrative suivante, tandis que τε relie cette parole à leur réaction précédente.
- source_word: Θεωρεῖς
  choice: Tu vois
  rationale: Formulation française naturelle qui dirige l’attention de Paul vers une réalité manifeste.
- source_word: ἀδελφέ
  choice: frère
  rationale: Vocatif singulier adressé directement à Paul.
- source_word: πόσαι μυριάδες
  choice: combien de dizaines de milliers
  rationale: μυριάς désigne proprement une unité de dix mille et peut aussi évoquer un nombre immense. « Dizaines de milliers » reste intelligible et préserve mieux l’ampleur de l’expression que « milliers ».
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: parmi les Juifs
  rationale: Dans ce contexte, le terme désigne le groupe ethnoreligieux juif; la nuance géographique possible est signalée en note.
- source_word: τῶν πεπιστευκότων
  choice: ont cru
  rationale: Le participe parfait désigne ceux qui sont parvenus à la foi et demeurent croyants; le passé composé français rend naturellement cet état résultant.
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: sont pleins de zèle pour la Loi
  rationale: Cette tournure française restitue l’intensité de ζηλωταί et le sens copulatif de ὑπάρχουσιν. La majuscule précise qu’il s’agit ici de la Loi mosaïque.
theological_decisions:
- issue: Portée de ἐν τοῖς Ἰουδαίοις
  choice: parmi les Juifs
  alternative: parmi les Judéens
  rationale: Le propos met en avant l’identité juive de croyants attachés à la Loi, plutôt que leur seule résidence en Judée. La possibilité géographique demeure toutefois réelle et est conservée en note.
- issue: Valeur numérique de μυριάδες
  choice: dizaines de milliers
  alternative: myriades / milliers innombrables
  rationale: Le mot peut compter des unités de dix mille ou fonctionner comme expression d’un nombre immense. La traduction retenue garde son sens lexical premier sans prétendre que le chiffre est nécessairement exact.
- issue: Référence de τοῦ νόμου
  choice: la Loi
  alternative: la loi / la Torah
  rationale: Le contexte vise la Loi mosaïque. La majuscule rend ce référent explicite sans introduire le terme hébreu « Torah », absent du texte grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme distingue la glorification de Dieu de la parole qui suit. L’exclamation après « ont cru » rend l’emphase de πόσαι μυριάδες sans résoudre l’ambiguïté entre dénombrement précis et très grand nombre.
