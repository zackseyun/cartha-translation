  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: fr
  text: Après nous être dit adieu les uns aux autres[a], nous sommes montés à bord du navire, et eux sont retournés chez eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pris congé les uns des autres ». Le verbe grec peut s’employer pour saluer quelqu’un à l’arrivée ou au départ ; ici, le contexte indique qu’il s’agit d’un départ.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vers ce qui leur appartenait », expression pouvant désigner leur propre demeure ou leur propre lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: nous être dit adieu les uns aux autres
  rationale: Dans ce contexte de départ, le verbe réciproque désigne naturellement le fait de prendre congé. « Se dire adieu » est idiomatique en français moderne tout en laissant une note signaler le sens plus large possible du verbe.
- source_word: ἐνέβημεν
  choice: nous sommes montés à bord
  rationale: Le verbe exprime ici l’action d’entrer dans un bateau ou d’y embarquer. « Monter à bord » est naturel et précis en français.
- source_word: πλοῖον
  choice: navire
  rationale: Le terme grec peut désigner un bateau ou un navire. « Navire » convient au récit de voyage maritime et conserve un registre digne sans être archaïque.
- source_word: ὑπέστρεψαν
  choice: sont retournés
  rationale: Cette formulation rend directement le mouvement de retour exprimé par le grec.
- source_word: εἰς τὰ ἴδια
  choice: chez eux
  rationale: L’expression idiomatique grecque signifie littéralement « vers ce qui leur appartenait » et désigne ici leur propre lieu ou domicile. « Chez eux » est la formulation française la plus naturelle.
