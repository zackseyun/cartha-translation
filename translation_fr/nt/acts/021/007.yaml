source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: fr
  text: Après avoir achevé la traversée au départ de Tyr, nous sommes arrivés à Ptolémaïs. Nous avons salué les frères[a] et sommes restés un jour avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les frères et sœurs » : le grec dit « frères », masculin pluriel qui peut désigner plus largement les membres de la communauté croyante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: nous
  rationale: Le pronom explicite maintient les voyageurs comme sujet du récit. δέ marque ici une transition légère, naturellement portée en français par l’enchaînement narratif sans connecteur obligatoire.
- source_word: τὸν πλοῦν διανύσαντες
  choice: Après avoir achevé la traversée
  rationale: διανύω exprime l’achèvement et πλοῦς un trajet maritime. « Après avoir achevé la traversée » restitue aussi l’antériorité du participe aoriste dans un français naturel.
- source_word: ἀπὸ Τύρου
  choice: depuis Tyr
  rationale: ἀπό indique le point de départ; « depuis Tyr » se rattache naturellement à l’ensemble de la traversée.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: nous sommes arrivés à Ptolémaïs
  rationale: Dans ce contexte de voyage, καταντάω signifie parvenir à destination, et εἰς en indique le terme.
- source_word: ἀσπασάμενοι
  choice: Nous avons salué
  rationale: ἀσπάζομαι signifie ici saluer. Une nouvelle proposition coordonnée rend clairement la succession des actions sans lourdeur participiale.
- source_word: τοὺς ἀδελφοὺς
  choice: les frères
  rationale: Le masculin pluriel grec désigne les membres de la communauté croyante et peut, selon l’usage, englober aussi des femmes. Le texte principal conserve la forme lexicale, avec une note explicative.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: sommes restés un jour avec eux
  rationale: μένω désigne le fait de rester; l’accusatif ἡμέραν μίαν exprime la durée, et παρά avec le datif la présence auprès de ces personnes.
theological_decisions:
- issue: Portée de ἀδελφοὺς dans la communauté chrétienne
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le grec emploie un masculin pluriel qui peut désigner collectivement les membres de la communauté, femmes comprises. La traduction conserve « frères » dans le texte et signale cette portée possible en note, sans trancher au-delà de la forme et de l’usage grecs.
translation_notes:
  register: Français international moderne, narratif et digne. « Traversée » précise le caractère maritime du trajet; la division en deux phrases allège la syntaxe tout en conservant l’ordre des actions.
