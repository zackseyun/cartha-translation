id: ACT.21.2
reference: Acts 21:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὑρόντες πλοῖον διαπερῶν εἰς Φοινίκην ἐπιβάντες ἀνήχθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/002.yaml
  text: And after finding a ship crossing over to Phoenicia[a], we went aboard and set sail.
translation:
  language: fr
  text: Après avoir trouvé un navire qui faisait la traversée vers la Phénicie[a], nous sommes montés à bord et avons pris la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un navire à destination de la Phénicie ». Le grec décrit littéralement un navire « traversant vers la Phénicie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: Après avoir trouvé
  rationale: Le participe aoriste exprime une action antérieure à l’action principale ; cette tournure rend clairement et naturellement la succession des événements.
- source_word: πλοῖον
  choice: un navire
  rationale: Dans ce contexte de voyage en Méditerranée, « navire » désigne naturellement un bâtiment apte à la navigation maritime.
- source_word: διαπερῶν
  choice: qui faisait la traversée
  rationale: Le participe présent qualifie le navire en décrivant son trajet. « Faisait la traversée » conserve l’idée de passage d’une rive ou région à une autre sans la réduire à la seule notion de destination.
- source_word: εἰς Φοινίκην
  choice: vers la Phénicie
  rationale: εἰς indique ici la direction et la destination ; « vers » s’intègre naturellement à l’expression française « faire la traversée vers ».
- source_word: ἐπιβάντες
  choice: nous sommes montés à bord
  rationale: Le participe aoriste décrit l’embarquement préalable au départ. Une proposition coordonnée est plus naturelle en français tout en maintenant la séquence.
- source_word: ἀνήχθημεν
  choice: avons pris la mer
  rationale: Dans son emploi nautique, ἀνάγω signifie quitter le rivage ou le port pour partir en mer. « Prendre la mer » est une formulation française courante et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la progression du grec — découverte du navire, embarquement, départ — tout en employant des tournures maritimes naturelles.
