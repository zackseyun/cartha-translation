  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: fr
  text: Après avoir aperçu Chypre et l’avoir laissée sur notre gauche[a], nous avons poursuivi notre navigation vers la Syrie et sommes arrivés à Tyr[b], car c’est là que le navire déchargeait sa cargaison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « l’ayant laissée à gauche » : Chypre est restée sur le côté gauche du navire pendant la traversée.'
    reason: cultural_note
  - marker: b
    text: Littéralement « sommes descendus à Tyr »; ou « sommes arrivés à Tyr ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou « car c’est là que le navire était en train de décharger sa cargaison »; autre traduction possible : « était déchargé de sa cargaison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: Après avoir aperçu
  rationale: Le participe aoriste exprime une action antérieure à la traversée; « aperçu » rend naturellement l’apparition de l’île à la vue des voyageurs.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: l’avoir laissée sur notre gauche
  rationale: La formulation conserve l’indication nautique concrète sans recourir au terme plus technique « bâbord ».
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: nous avons poursuivi notre traversée vers la Syrie
  rationale: Cette formulation française naturelle rend le déplacement maritime en cours suggéré par l’imparfait grec.
- source_word: κατήλθομεν εἰς Τύρον
  choice: sommes arrivés à Tyr
  rationale: Dans ce récit de voyage maritime, κατέρχομαι désigne naturellement l’arrivée ou le débarquement; « arrivés » évite le calque peu idiomatique « descendus à Tyr », signalé en note.
- source_word: ἐκεῖσε
  choice: c’est là
  rationale: L’adverbe renvoie à Tyr et introduit la raison de l’escale.
- source_word: ἀποφορτιζόμενον
  choice: devait décharger
  rationale: La périphrase grecque avec ἦν et le participe peut exprimer l’opération prévue ou en cours qui motive l’arrivée à Tyr. « devait décharger » rend naturellement cette circonstance tout en conservant le navire comme sujet; l’ambiguïté de voix est signalée en note.
- source_word: τὸν γόμον
  choice: sa cargaison
  rationale: γόμος désigne le chargement ou fret d’un navire; « sa cargaison » est le terme courant et précis en français.
theological_decisions: []
