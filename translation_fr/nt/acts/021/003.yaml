revisions:
- from: Après avoir aperçu Chypre et l’avoir laissée sur notre gauche[a], nous avons poursuivi notre traversée vers la Syrie et sommes arrivés à Tyr[b], car c’est là que le navire devait décharger sa cargaison[c].
