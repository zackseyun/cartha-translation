  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: fr
  text: Aussitôt, il prit avec lui des soldats et des centurions et descendit en courant vers eux. Quand ceux qui frappaient Paul virent le tribun[a] et les soldats, ils cessèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tribun militaire » ou « commandant » ; le grec χιλίαρχος désigne ici l’officier romain qui commandait une cohorte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: Aussitôt
  rationale: L’expression adverbiale marque une action immédiate; « Aussitôt » est naturel et restitue l’urgence.
- source_word: παραλαβὼν
  choice: prit avec lui
  rationale: Le participe indique que l’officier emmène des soldats et des centurions; « prit avec lui » explicite naturellement cet accompagnement.
- source_word: στρατιώτας
  choice: soldats
  rationale: Le terme désigne ici des militaires individuels; « soldats » est l’équivalent français courant et précis.
- source_word: ἑκατοντάρχας
  choice: centurions
  rationale: « Centurions » est le titre historique établi pour ces officiers romains.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: descendit en courant vers eux
  rationale: La formulation conserve à la fois la rapidité du mouvement et sa direction descendante depuis la forteresse, sans attribuer au déplacement une hostilité supplémentaire.
- source_word: χιλίαρχον
  choice: tribun
  rationale: Dans ce contexte romain, le terme désigne l’officier commandant une cohorte; « tribun » est un équivalent historique concis.
- source_word: ἐπαύσαντο
  choice: cessèrent
  rationale: Le verbe moyen exprime l’arrêt de l’action en cours; « cessèrent » convient au registre narratif digne.
- source_word: τύπτοντες
  choice: de frapper
  rationale: Le participe décrit les coups répétés infligés à Paul; « frapper » reste direct et naturel, tandis que la construction avec « cessèrent » signale l’action continue.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe en deux phrases allège la longue période grecque tout en conservant l’enchaînement immédiat des actions. Le démonstratif « ceux-ci » renvoie sans ambiguïté aux personnes qui frappaient Paul.
