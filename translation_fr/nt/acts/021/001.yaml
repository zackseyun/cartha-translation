id: ACT.21.1
reference: Acts 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: fr
  text: Après nous être arrachés à eux, nous avons pris la mer et avons fait route directement jusqu’à Cos ; le lendemain, nous sommes allés à Rhodes, et de là à Patara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Après
  rationale: Cette tournure narrative avec l’infinitif introduit l’événement suivant. « Après » donne une transition temporelle naturelle en français.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: nous être arrachés à eux
  rationale: Le verbe ἀποσπάω exprime une séparation pénible, plus forte qu’un simple départ. La formulation conserve cette intensité affective sans expliquer davantage le texte.
- source_word: ἀναχθῆναι
  choice: nous avons pris la mer
  rationale: Dans un contexte nautique, ἀνάγω signifie quitter le rivage ou prendre la mer. Cette expression est claire et idiomatique en français moderne.
- source_word: εὐθυδρομήσαντες
  choice: avons fait route directement
  rationale: Le verbe nautique désigne le fait de suivre une route droite. « Faire route directement » préserve à la fois la nuance maritime et l’idée d’un trajet direct.
- source_word: ἤλθομεν εἰς
  choice: jusqu’à / sommes allés à
  rationale: Dans ce récit de voyage, la construction indique l’arrivée aux différentes étapes. Une légère variation française évite une répétition pesante tout en conservant l’itinéraire.
- source_word: Κῶ
  choice: Cos
  rationale: « Cos » est la forme française usuelle du nom de l’île grecque Κῶς.
- source_word: τῇ δὲ ἑξῆς
  choice: le lendemain
  rationale: Cette expression temporelle signifie « le jour suivant » ; « le lendemain » est la formulation française la plus naturelle et précise.
- source_word: Ῥόδον
  choice: Rhodes
  rationale: « Rhodes » est la forme française consacrée du nom de l’île.
- source_word: κἀκεῖθεν
  choice: et de là
  rationale: La crase de καί et ἐκεῖθεν relie cette nouvelle étape à la précédente ; « et de là » en rend les deux éléments.
- source_word: Πάταρα
  choice: Patara
  rationale: « Patara » est la translittération française courante de ce nom de lieu antique.
theological_decisions: []
