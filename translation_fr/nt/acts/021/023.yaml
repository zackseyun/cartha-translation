source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: fr
  text: 'Fais donc ce que nous te disons : nous avons quatre hommes qui ont fait un vœu[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont un vœu ». Le grec dit littéralement « ayant un vœu ».
    reason: lexical_alternative
  - marker: b
    text: Le contexte plus large peut faire penser à un vœu de type naziréen, mais ce verset dit seulement « un vœu ».
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Fais donc ce que…
  rationale: οὖν marque la conséquence ou la transition logique, rendue naturellement par « donc » ; τοῦτο trouve son contenu dans la proposition relative qui suit.
- source_word: ποίησον
  choice: Fais
  rationale: L’impératif aoriste de ποιέω appelle ici un ordre direct et naturel.
- source_word: ὅ σοι λέγομεν
  choice: ce que nous te disons
  rationale: Cette formulation française restitue simplement le contenu de l’ordre et le présent de λέγομεν.
- source_word: εἰσὶν ἡμῖν
  choice: nous avons parmi nous
  rationale: Le datif de possession peut se rendre par « nous avons » ; « parmi nous » conserve aussi la nuance d’appartenance au groupe dans ce contexte.
- source_word: ἄνδρες τέσσαρες
  choice: quatre hommes
  rationale: ἀνήρ désigne ici des hommes adultes ; la formulation française est naturelle et précise.
- source_word: εὐχὴν ἔχοντες
  choice: qui sont liés par un vœu
  rationale: Le participe exprime l’état durable de personnes tenues par un vœu, plutôt que le seul acte initial de le prononcer.
- source_word: ἀφ’ ἑαυτῶν
  choice: qu’ils ont fait
  rationale: Dans cette expression difficile, la tournure indique naturellement que le vœu repose sur eux et qu’il s’agit de leur propre engagement. La formulation évite le calque peu idiomatique « sur eux-mêmes ».
theological_decisions:
- issue: Nature du vœu
  choice: Employer le terme générique « un vœu » dans le texte principal.
  alternative: Préciser « un vœu de naziréat » ou « un vœu de type naziréen ».
  rationale: Le contexte élargi peut orienter vers un vœu de naziréat, mais εὐχή ne le précise pas dans ce verset. Le texte principal ne doit donc pas lever cette indétermination.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse singulière σοι. « Liés par un vœu » exprime idiomatiquement l’état indiqué par le participe, tandis que les notes préservent la formulation littérale et l’indétermination quant au type de vœu.
