revisions:
- from: 'Fais donc ce que nous te disons : nous avons parmi nous quatre hommes qui sont liés par un vœu qu’ils ont fait[a][b].'
  to: 'Fais donc ce que nous te disons : nous avons quatre hommes qui ont fait un vœu[a][b].'
  rationale: La révision remplace la périphrase redondante « qui sont liés par un vœu qu’ils ont fait » par « qui ont fait un vœu », tournure française naturelle qui rend le sens contextuel de l’expression grecque sans spécifier un vœu naziréen ni imposer une analyse trop précise de ἀφ’ ἑαυτῶν. Elle retire aussi l’ajout non nécessaire « parmi nous ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’injonction, le datif possessif (« nous avons »), les quatre hommes et le vœu sont conservés. Toutefois, « qui sont liés par un vœu qu’ils ont fait » développe ἀφ’ ἑαυτῶν en une double affirmation (« liés » et « qu’ils ont fait ») qui est plus explicite et plus lourde que le grec. La formulation idiomatique « qui ont fait un vœu » rend adéquatement εὐχὴν ἔχοντες ἀφ’ ἑαυτῶν sans imposer la nature précise du vœu.'
  naturalness: Le français est globalement moderne et clair. « Nous avons parmi nous » est acceptable, mais « parmi nous » n’est pas nécessairement exprimé par εἰσὶν ἡμῖν et alourdit légèrement la phrase. « Qui sont liés par un vœu qu’ils ont fait » est redondant et moins naturel que « qui ont fait un vœu ».
  terminology: « Vœu » est le terme juste pour εὐχή. La note sur un possible vœu de type naziréen conserve correctement l’indétermination du verset. Le tutoiement correspond au singulier σοι.
  issues:
  - severity: medium
    issue: Développement excessif de la dernière expression
    rationale: « Qui sont liés par un vœu qu’ils ont fait » transforme l’expression concise εὐχὴν ἔχοντες ἀφ’ ἑαυτῶν en deux prédications et risque de surinterpréter la relation exacte marquée par ἀφ’ ἑαυτῶν. « Qui ont fait un vœu » est idiomatique et suffisamment fidèle.
  - severity: low
    issue: Ajout de « parmi nous »
    rationale: Le datif ἡμῖν s’exprime naturellement par « nous avons ». « Parmi nous » peut convenir au contexte, mais n’est pas requis par la formulation grecque et peut être omis pour une équivalence plus sobre.
  revised_text: 'Fais donc ce que nous te disons : nous avons quatre hommes qui ont fait un vœu[a][b].'
  revised_footnotes:
  - marker: a
    text: Ou « qui ont un vœu ». Le grec dit littéralement « ayant un vœu ».
    reason: lexical_alternative
  - marker: b
    text: Le contexte plus large peut faire penser à un vœu de type naziréen, mais ce verset dit seulement « un vœu ».
    reason: cultural_note
  revision_rationale: La révision remplace la périphrase redondante « qui sont liés par un vœu qu’ils ont fait » par « qui ont fait un vœu », tournure française naturelle qui rend le sens contextuel de l’expression grecque sans spécifier un vœu naziréen ni imposer une analyse trop précise de ἀφ’ ἑαυτῶν. Elle retire aussi l’ajout non nécessaire « parmi nous ».
