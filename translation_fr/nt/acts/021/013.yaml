  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: fr
  text: 'Alors Paul répondit : « Que faites-vous en pleurant et en me brisant le cœur[a] ? Quant à moi, je suis prêt non seulement à être lié, mais même à mourir à Jérusalem pour le nom[b] du Seigneur Jésus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en me broyant le cœur ». Le verbe grec évoque un brisement intérieur particulièrement intense.
    reason: lexical_alternative
  - marker: b
    text: « Le nom » renvoie ici au Seigneur Jésus lui-même, à son autorité et à la cause qui lui est associée.
    reason: idiom_explanation
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: Alors Paul répondit
  rationale: Rend naturellement la transition narrative et le verbe de réponse, sans alourdir la phrase.
- source_word: Τί ποιεῖτε κλαίοντες
  choice: Que faites-vous là, à pleurer
  rationale: Préserve la forme interrogative directe du grec tout en donnant en français une protestation naturelle et chargée d’émotion.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: à me briser le cœur
  rationale: Conserve la métaphore du cœur et exprime idiomatiquement la détresse intérieure provoquée par leurs pleurs.
- source_word: δεθῆναι
  choice: être enchaîné
  rationale: Rend le sens passif concret de « lier »; « être emprisonné » préciserait davantage que le grec.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Le français emploie naturellement « à » pour situer les souffrances auxquelles Paul se dit prêt, tout en restant compatible avec son déplacement vers la ville.
- source_word: ἑτοίμως ἔχω
  choice: je suis prêt
  rationale: Expression française concise et naturelle correspondant à l’idée d’être disposé et préparé.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: pour le nom
  rationale: Maintient l’idiome biblique chargé de sens au lieu de le réduire silencieusement à une seule explication.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: Rend κύριος comme un titre christologique par l’équivalent français établi « Seigneur ».
theological_decisions:
- issue: Le titre κύριος appliqué à Jésus
  choice: le Seigneur Jésus
  alternative: le maître Jésus
  rationale: « Seigneur » préserve la portée christologique traditionnelle et le sens normal du titre dans ce contexte.
- issue: L’idiome « le nom »
  choice: pour le nom du Seigneur Jésus
  alternative: pour le Seigneur Jésus
  rationale: Le texte grec désigne explicitement « le nom »; conserver cette formulation maintient son évocation de la personne, de l’autorité et de la cause de Jésus sans en imposer une interprétation unique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Que faites-vous là, à pleurer » conserve la question grecque tout en évitant un calque peu idiomatique. « Même » souligne la progression entre être enchaîné et mourir.
