id: ACT.21.24
reference: Acts 21:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: fr
  text: Prends ces hommes avec toi, purifie-toi avec eux et paie leurs dépenses, afin qu’ils se rasent la tête. Alors tous sauront que ce qu’on leur a rapporté à ton sujet est sans fondement[a], mais que toi aussi, tu te conduis en observant la Loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que ce qu’on leur a enseigné à ton sujet ne correspond à rien ». Le verbe grec peut signifier « instruire » ou, plus généralement, « informer »; ici, il renvoie aux propos qui circulaient au sujet de Paul.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tu marches en ligne en gardant la Loi », c’est-à-dire que tu règles ta conduite sur son observance.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Prends ces hommes avec toi
  rationale: Le participe a ici une valeur impérative liée aux ordres qui suivent. « Ces hommes » explicite le référent donné au verset précédent, et « avec toi » rend naturellement l’idée de les prendre avec soi.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: purifie-toi avec eux
  rationale: L’impératif désigne une purification rituelle. La tournure pronominale française rend naturellement la forme grecque et σύν.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: paie leurs dépenses
  rationale: Le verbe et sa construction indiquent que Paul doit prendre à sa charge les frais de ces hommes, vraisemblablement ceux liés à leur vœu.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: afin qu’ils se rasent la tête
  rationale: La construction exprime le but ou le résultat visé. Le singulier distributif grec se rend naturellement au singulier en français avec « ils ».
- source_word: γνώσονται πάντες
  choice: Alors tous sauront
  rationale: Le futur est direct; « alors » fait ressortir le résultat attendu des actes demandés.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: ce qu’on leur a rapporté à ton sujet
  rationale: κατηχέω peut signifier instruire ou informer. Ici, le contexte concerne des informations ou accusations circulant au sujet de Paul, sans nécessairement évoquer un enseignement formel.
- source_word: οὐδέν ἐστιν
  choice: est sans fondement
  rationale: L’expression affirme que les informations rapportées ne correspondent à rien de réel. Cette formulation française est claire tout en conservant la portée contextuelle.
- source_word: ἀλλὰ στοιχεῖς
  choice: mais que […] tu te conduis
  rationale: στοιχέω évoque le fait de marcher en ligne, de se conformer à une règle de conduite. « Se conduire » exprime ici le comportement observable sans conserver une métaphore opaque.
- source_word: καὶ αὐτὸς
  choice: toi aussi
  rationale: La tournure conserve à la fois l’idée d’ajout et l’accent porté sur la conduite personnelle de Paul.
- source_word: φυλάσσων τὸν νόμον
  choice: en observant la Loi
  rationale: φυλάσσω avec νόμος signifie garder ou observer. Le participe précise de quelle manière Paul se conduit.
- source_word: νόμον
  choice: la Loi
  rationale: Dans ce contexte juif, le terme désigne la Loi. La majuscule française signale ce référent scripturaire sans ajouter explicitement « de Moïse ».
theological_decisions:
- issue: Nature du rapport de Paul à la Loi dans ce récit
  choice: 'La phrase décrit sa conduite observable : « toi aussi, tu te conduis en observant la Loi » 비'
  alternative: « toi aussi, tu gardes la Loi » ou « toi aussi, tu marches dans l’ordre en gardant la Loi »
  rationale: Le verset rapporte ce que les autres pourront conclure de la participation de Paul à la purification et de la prise en charge des frais. La traduction ne tranche pas la question plus large de sa théologie de la Loi et préserve ainsi la tension narrative.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au discours direct adressé à Paul. « Loi » est capitalisé selon l’usage biblique français. Les deux notes préservent les nuances de κατηχέω et la métaphore de στοιχέω.
