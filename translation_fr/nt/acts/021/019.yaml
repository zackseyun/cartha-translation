source:
  edition: SBLGNT
  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: fr
  text: Après les avoir salués, il leur exposa en détail, une par une, les choses que Dieu avait accomplies parmi les non-Juifs[a] par son ministère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les nations ». Ici, l’expression désigne les peuples non juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: Après les avoir salués
  rationale: Le participe aoriste exprime ici une action antérieure au récit qui suit. Cette formulation est naturelle en français et conserve clairement la succession des actions.
- source_word: ἐξηγεῖτο
  choice: il leur raconta en détail
  rationale: L’imparfait grec présente un compte rendu développé, tandis que le verbe peut signifier raconter, exposer ou expliquer. « Raconta en détail » rend cette idée sans donner artificiellement au verbe un sens technique.
- source_word: καθ’ ἓν ἕκαστον
  choice: une à une
  rationale: L’expression distributive indique que Paul rapportait chaque chose séparément. Le féminin s’accorde naturellement avec « les choses ».
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: les choses que Dieu avait accomplies
  rationale: Cette tournure garde Dieu comme sujet explicite de l’action. Le plus-que-parfait situe naturellement ces actes avant le compte rendu de Paul.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les non-Juifs
  rationale: Dans ce contexte, ἔθνη désigne les peuples autres que le peuple juif. « Non-Juifs » est immédiatement compréhensible en français moderne, tout en évitant le sens géopolitique possible de « nations ».
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: par son service
  rationale: διά avec le génitif exprime le moyen, et διακονία désigne ici l’activité de service exercée par Paul. « Service » reste proche du champ lexical grec et évite de réduire le terme à une fonction ecclésiastique officielle.
theological_decisions:
- issue: L’action de Dieu et le rôle de Paul dans le compte rendu missionnaire
  choice: Dieu est présenté comme celui qui accomplit les actes, le service de Paul étant le moyen par lequel il agit.
  alternative: Présenter Paul comme celui qui aurait lui-même accompli ces résultats parmi les non-Juifs.
  rationale: Le grec nomme explicitement Dieu comme sujet de ἐποίησεν et présente la διακονία de Paul, avec διά suivi du génitif, comme l’instrument. La traduction conserve ainsi à la fois l’action divine et la participation humaine.
translation_notes:
  register: Français international moderne, clair et digne. « Raconta en détail, une à une » préserve à la fois l’aspect développé du récit et la force distributive du grec. « Non-Juifs » privilégie la compréhension immédiate; la traduction plus littérale « nations » est conservée en note.
