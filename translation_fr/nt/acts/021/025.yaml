revisions:
- from: Quant aux non-Juifs qui ont cru, nous avons envoyé nos instructions après avoir décidé qu’ils devaient se garder de ce qui est sacrifié aux idoles, du sang, de la viande provenant d’animaux étouffés et de l’immoralité sexuelle.
  to: Quant aux non-Juifs qui ont cru, nous avons envoyé un message, après avoir décidé qu’ils devaient se garder de ce qui est sacrifié aux idoles, du sang, de ce qui est étouffé et de l’immoralité sexuelle.
  rationale: La révision retire l’ajout interprétatif « nos instructions » tout en fournissant à « envoyer » un complément français naturel, implicitement soutenu par le contexte. Elle rend πνικτόν de manière plus directe et maintient sans ajout doctrinal les quatre éléments de la décision.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:42Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, mais « nos instructions » explicite et pluralise indûment l’objet implicite de ἀπεστείλαμεν. Le grec dit simplement « nous avons envoyé », le contexte permettant de comprendre qu’il s’agit du message/décret antérieur. « Un message » rend cette implication de façon idiomatique sans la transformer en instructions personnelles.
  naturalness: Le français est clair et moderne. La liste gagne en naturel et en proximité avec le grec en conservant « ce qui est étouffé » plutôt que l’explication développée « la viande provenant d’animaux étouffés ».
  terminology: « non-Juifs », « ce qui est sacrifié aux idoles », « sang » et « immoralité sexuelle » sont appropriés. « Immoralité sexuelle » conserve utilement l’étendue de πορνεία sans interprétation confessionnelle.
  issues:
  - severity: medium
    issue: « nos instructions » ajoute un objet et une caractérisation non exprimés.
    rationale: ἀπεστείλαμεν n’énonce aucun complément direct dans ce verset. Le contexte renvoie bien à une communication ou à un décret, mais « nos instructions » pluralise et formule ce contenu comme des directives appartenant aux locuteurs. « un message » est une explicitation contextuelle plus neutre.
  - severity: low
    issue: « de la viande provenant d’animaux étouffés » développe πνικτόν au-delà de sa formulation concise.
    rationale: Le terme désigne ce qui est étouffé/stranglé, dans un contexte alimentaire. Une formulation plus proche préserve la concision et évite de préciser inutilement « viande provenant de ».
  revised_text: Quant aux non-Juifs qui ont cru, nous avons envoyé un message, après avoir décidé qu’ils devaient se garder de ce qui est sacrifié aux idoles, du sang, de ce qui est étouffé et de l’immoralité sexuelle.
  revised_footnotes: []
