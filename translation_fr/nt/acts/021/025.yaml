id: ACT.21.25
reference: Acts 21:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: fr
  text: Quant aux non-Juifs qui ont cru, nous avons envoyé un message, après avoir décidé qu’ils devaient se garder de ce qui est sacrifié aux idoles, du sang, de ce qui est étouffé et de l’immoralité sexuelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Quant aux
  rationale: Introduit naturellement en français le nouveau sujet tout en marquant la transition avec ce qui précède.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: les non-Juifs qui ont cru
  rationale: Dans ce contexte, ἔθνη désigne les personnes issues des nations, par contraste avec les Juifs. Le passé composé rend naturellement l’entrée dans la foi, dont l’effet demeure.
- source_word: ἡμεῖς
  choice: nous
  rationale: Conserve le pronom explicite grec et la responsabilité assumée par les locuteurs.
- source_word: ἀπεστείλαμεν
  choice: nous avons envoyé nos instructions
  rationale: Le verbe grec laisse son complément implicite. Cette formulation française reste naturelle et renvoie au message ou décret antérieur sans préciser indûment qu’il s’agissait d’une lettre dans ce verset.
- source_word: κρίναντες
  choice: après avoir décidé
  rationale: Exprime clairement que la décision précède l’envoi et conserve la portée délibérative du participe.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: qu’ils devaient se garder de
  rationale: Préserve la nuance réfléchie de φυλάσσομαι et introduit naturellement la liste des interdictions.
- source_word: τό τε εἰδωλόθυτον
  choice: ce qui est sacrifié aux idoles
  rationale: Suit l’expression grecque sans la réduire explicitement à une seule catégorie d’aliments.
- source_word: αἷμα
  choice: du sang
  rationale: Rend directement le terme grec sans développer dans le texte principal son application alimentaire.
- source_word: πνικτόν
  choice: de la viande provenant d’animaux étouffés
  rationale: Explicite en français le référent alimentaire implicite du substantif neutre et le mode de mise à mort concerné.
- source_word: πορνείαν
  choice: de l’immoralité sexuelle
  rationale: Expression moderne et suffisamment large pour les conduites sexuelles illicites désignées par πορνεία.
theological_decisions:
- issue: Portée et durée des interdictions du décret apostolique
  choice: Présenter simplement les quatre interdictions sans préciser leur durée ni leur fondement théologique.
  alternative: Les définir soit comme de simples concessions temporaires liées aux repas communs, soit comme des prescriptions universelles permanentes.
  rationale: Le verset rappelle le contenu d’une décision antérieure, mais n’en expose ici ni toute la justification ni la durée d’application.
translation_notes:
  register: Français international moderne, clair et digne. « Non-Juifs » est immédiatement compréhensible pour un large lectorat. La syntaxe suit le mouvement du grec tout en évitant un participe lourd en français.
