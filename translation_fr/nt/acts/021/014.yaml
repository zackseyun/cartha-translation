    rationale: Dans cette transition narrative, δέ peut être rendu sans marque adversative forte; « Comme » conserve mieux le lien circonstanciel du génitif absolu.
  - severity: low
    issue: La note qualifie improprement « nous nous sommes tenus tranquilles » de traduction littérale.
    rationale: ἡσυχάσαμεν signifie être tranquille, se taire ou cesser de parler; l’idée de « se tenir » n’est pas exprimée par le verbe grec.
