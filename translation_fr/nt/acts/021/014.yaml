id: ACT.21.14
reference: Acts 21:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: fr
  text: 'Comme il ne se laissait pas convaincre, nous nous sommes tus[a], en disant : « Que la volonté du Seigneur s’accomplisse ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous avons cessé d’insister ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Mais comme il ne se laissait pas convaincre
  rationale: La proposition au génitif absolu présente la circonstance qui conduit à la réaction du groupe. « Ne se laissait pas convaincre » rend naturellement en français la valeur contextuelle du participe présent de πείθω sans l’interpréter comme un simple refus d’écouter.
- source_word: ἡσυχάσαμεν
  choice: nous avons cessé d’insister
  rationale: Dans ce contexte, ἡσυχάζω signifie que les compagnons de Paul mettent fin à leurs objections. Cette formulation française exprime clairement la cessation de leur insistance, tout en signalant en note la traduction plus littérale.
- source_word: εἰπόντες
  choice: et nous avons dit
  rationale: La coordination est plus naturelle en français que le participe « en disant » après « cesser d’insister », sans modifier la relation entre les deux actions.
- source_word: Τοῦ κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est l’équivalent français habituel de κύριος. La traduction ne précise pas davantage le référent que ne le fait le grec.
- source_word: τὸ θέλημα
  choice: la volonté
  rationale: θέλημα désigne ici ce que le Seigneur veut; « volonté » conserve l’expression théologique familière et son sens ordinaire.
- source_word: γινέσθω
  choice: s’accomplisse
  rationale: L’impératif exprime le souhait et l’acceptation que la volonté du Seigneur advienne. « S’accomplisse » est naturel, digne et moins susceptible que « soit faite » de suggérer uniquement une action humaine.
theological_decisions:
- issue: Référent et traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » rend normalement κύριος dans ce contexte et préserve le degré d’explicitation du texte grec, sans ajouter « Jésus ».
- issue: Sens de l’appel à la volonté du Seigneur
  choice: Que la volonté du Seigneur s’accomplisse !
  alternative: Que la volonté du Seigneur soit faite !
  rationale: La formulation choisie exprime la soumission à la volonté divine sans déterminer si celle-ci se réalise par une action, par un événement ou par les deux.
translation_notes:
  register: Français international moderne, naturel et digne. « Cesser d’insister » explicite sobrement la portée contextuelle de ἡσυχάζω; la note conserve les rendus plus formels. La ponctuation exclamative fait entendre la valeur de souhait de l’impératif grec.
