  naturalness: La formulation révisée est fluide en français international moderne et conserve un registre sobre et biblique.
  terminology: « Seigneur », « volonté » et « s’accomplisse » rendent fidèlement κύριος, θέλημα et γινέσθω sans expliciter le référent ni restreindre le mode d’accomplissement.
