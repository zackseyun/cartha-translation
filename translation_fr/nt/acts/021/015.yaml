  text: Μετὰ δὲ τὰς ἡμέρας ταύτας ἐπισκευασάμενοι ἀνεβαίνομεν εἰς ⸀Ἱεροσόλυμα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: fr
  text: Après ces jours-là, après nous être préparés[a], nous sommes montés à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir fait nos bagages ». Le terme grec peut désigner les préparatifs du voyage de façon générale, et pas seulement le fait de faire les bagages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Après ces quelques jours
  rationale: μετά avec l’accusatif marque ici la succession temporelle. En français courant, « après ces quelques jours » renvoie naturellement au séjour mentionné juste avant, sans alourdir la phrase.
- source_word: ἐπισκευασάμενοι
  choice: nous avons fait nos préparatifs
  rationale: Le participe aoriste désigne le fait de se préparer ou de s’équiper pour le voyage. Cette formulation conserve la portée générale du grec sans la réduire au seul fait de faire les bagages.
- source_word: ἀνεβαίνομεν
  choice: nous sommes montés
  rationale: L’imparfait grec poursuit le récit du déplacement. « Monter à Jérusalem » préserve la direction ascendante, à la fois géographique et conventionnelle, tout en restant idiomatique en français.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: εἰς indique le mouvement vers la ville ; « à Jérusalem » est la tournure française naturelle après un verbe de déplacement.
theological_decisions: []
translation_notes:
  register: Français moderne, international et narratif. Le passé composé rend naturellement la progression du récit, tandis que « faire ses préparatifs » conserve l’indétermination du participe grec.
