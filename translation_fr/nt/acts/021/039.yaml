reference: Acts 21:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: fr
  text: 'Mais Paul déclara : « Je suis juif, citoyen de Tarse, en Cilicie, une ville qui n’est pas sans importance. Je vous en prie, permettez-moi de parler au peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: Je suis juif
  rationale: Cette formulation française naturelle exprime clairement l’identité ethnique et religieuse revendiquée par Paul. Le nom ἄνθρωπος n’a pas besoin d’être rendu séparément ici, et μέν donne une légère mise en relief que le contexte porte suffisamment.
- source_word: Ταρσεὺς τῆς Κιλικίας … πολίτης
  choice: citoyen de Tarse en Cilicie
  rationale: Le français réorganise naturellement les éléments grecs en associant πολίτης à Tarse, tout en conservant l’affirmation d’une appartenance civique plutôt que d’une simple résidence.
- source_word: οὐκ ἀσήμου πόλεως
  choice: une ville qui n’est pas sans importance
  rationale: Cette tournure conserve la litote grecque tout en restant claire et idiomatique en français moderne.
- source_word: δέομαι δέ σου
  choice: Je t’en prie
  rationale: La formule marque une demande instante et respectueuse sans adopter un registre excessivement solennel.
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: permets-moi de parler
  rationale: Cette formulation naturelle conserve l’idée d’une autorisation demandée à une autorité.
- source_word: πρὸς τὸν λαόν
  choice: au peuple
  rationale: « Peuple » correspond directement à λαός et préserve sa portée communautaire, là où « foule » décrirait surtout le rassemblement immédiat.
theological_decisions:
- issue: Sens de Ἰουδαῖος dans ce contexte
  choice: juif
  alternative: Judéen
  rationale: Paul distingue son identité juive de son origine civique, Tarse en Cilicie. « Judéen » risquerait donc de suggérer à tort une provenance géographique de Judée.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec et convient au dialogue direct. La litote de l’original est maintenue sans archaïsme.
source_grounding:
  english_pob_role: consult_only
