source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: fr
  text: Quand il arriva aux marches[a], les soldats durent le porter[b] à cause de la violence de la foule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement de l’escalier qui montait vers la caserne romaine (voir Actes 21.34, 37).
    reason: cross_reference
  - marker: b
    text: 'Littéralement : « il arriva qu’il soit porté par les soldats ». La tournure grecque peut souligner la nécessité résultant de la violence de la foule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Quand
  rationale: ὅτε introduit la circonstance temporelle, tandis que le δέ, faiblement connectif, peut rester implicite dans un français naturel.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: il arriva aux marches
  rationale: Dans cette construction, γίνομαι avec ἐπί et l’accusatif exprime l’arrivée à un endroit. « Arriva aux marches » est idiomatique et respecte le mouvement vers l’escalier.
- source_word: ἀναβαθμούς
  choice: marches
  rationale: Le nom désigne des marches ou un escalier. « Marches » convient au contexte de la montée vers la caserne.
- source_word: συνέβη βαστάζεσθαι αὐτὸν
  choice: durent le porter
  rationale: L’expression décrit ce qui se produisit sous l’effet de la violence de la foule. En français, « durent le porter » rend naturellement la nécessité résultante impliquée par le contexte, sans suggérer que Paul fut simplement transporté de manière ordinaire.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: les soldats
  rationale: Le complément d’agent de la tournure passive grecque devient naturellement le sujet actif en français.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: à cause de la violence de la foule
  rationale: διά avec l’accusatif indique la cause. βία désigne ici la force violente exercée par la foule, et ὄχλος reste rendu par le terme lexicalement neutre « foule ».
