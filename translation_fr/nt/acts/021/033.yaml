id: ACT.21.33
reference: Acts 21:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: fr
  text: Alors le commandant[a] s’approcha, se saisit de lui et ordonna qu’on l’attache avec deux chaînes[b]. Puis il cherchait à savoir qui il était et ce qu’il avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tribun ». Le terme grec désigne un officier romain qui commandait une cohorte, littéralement un « chef de mille ».
    reason: lexical_alternative
  - marker: b
    text: Les « deux chaînes » peuvent faire écho à la prophétie d’Actes 21.11, selon laquelle Paul serait attaché à Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: commandant
  rationale: Désigne ici l’officier romain à la tête d’une cohorte. « Commandant » est clair en français moderne et conserve son autorité militaire sans recourir au terme plus technique « tribun ».
- source_word: ἐγγίσας
  choice: s’approcha
  rationale: Le participe aoriste exprime le mouvement qui précède la saisie; « s’approcha » le rend naturellement.
- source_word: ἐπελάβετο αὐτοῦ
  choice: se saisit de lui
  rationale: Dans ce contexte d’arrestation, l’expression indique une prise physique et énergique.
- source_word: ἐκέλευσε δεθῆναι
  choice: ordonna qu’on l’attache
  rationale: Cette formulation idiomatique conserve l’ordre autoritaire et le fait que Paul subit l’action, sans identifier ceux qui l’exécutent.
- source_word: ἁλύσεσι δυσί
  choice: avec deux chaînes
  rationale: Traduction directe de l’expression, adaptée au contexte de détention et susceptible de rappeler Actes 21.11 sans expliciter ce lien dans le texte.
- source_word: ἐπυνθάνετο
  choice: il cherchait à savoir
  rationale: L’imparfait grec présente une enquête en cours; la tournure française en restitue la durée et convient mieux que le simple « demanda ».
- source_word: τίς εἴη
  choice: qui il était
  rationale: Rend naturellement en discours indirect l’optatif grec dépendant d’un verbe au passé.
- source_word: τί ἐστιν πεποιηκώς
  choice: ce qu’il avait fait
  rationale: Le parfait périphrastique désigne un acte accompli dont les conséquences demeurent pertinentes; le plus-que-parfait est naturel dans ce récit au passé.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le terme courant « commandant » est retenu dans le texte, tandis que le titre romain plus technique est signalé en note. L’imparfait « cherchait » préserve l’aspect continu de l’interrogatoire.
