id: ACT.21.4
reference: Acts 21:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: fr
  text: Après avoir trouvé les disciples, nous sommes restés là sept jours. Par l’Esprit, ils disaient à Paul de ne pas monter à Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sous l’action de l’Esprit ». Il est possible que l’Esprit leur ait révélé les souffrances qui attendaient Paul et que les disciples en aient conclu qu’il ne devait pas poursuivre sa route vers Jérusalem.'
    reason: La portée précise de διὰ τοῦ πνεύματος et le rapport entre la révélation de l’Esprit et l’interdiction formulée par les disciples restent ambigus dans le contexte des Actes.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Après avoir trouvé
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal; cette tournure française en conserve naturellement la succession.
- source_word: τοὺς μαθητάς
  choice: les disciples
  rationale: Rendu habituel de μαθηταί dans les Actes, sans ajouter une précision de lieu absente du grec.
- source_word: ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά
  choice: nous sommes restés là sept jours
  rationale: ἐπιμένω indique le fait de rester, αὐτοῦ a ici une valeur locale (« là »), et l’accusatif marque la durée.
- source_word: οἵτινες ... ἔλεγον
  choice: ils disaient
  rationale: Le pronom reprend les disciples; l’imparfait français rend l’action prolongée ou répétée sans la suraccentuer.
- source_word: διὰ τοῦ πνεύματος
  choice: Par l’Esprit
  rationale: La préposition διά avec le génitif marque ici le moyen ou l’intermédiaire. « L’Esprit » désigne naturellement l’Esprit Saint dans ce contexte sans ajouter le qualificatif absent du grec.
- source_word: μὴ ἐπιβαίνειν εἰς Ἱεροσόλυμα
  choice: de ne pas monter à Jérusalem
  rationale: La construction infinitive dépend de ἔλεγον. « Monter à Jérusalem » est une expression directionnelle biblique naturelle et conforme au contexte du voyage.
theological_decisions:
- issue: Rapport entre l’intervention de l’Esprit et l’interdiction adressée à Paul
  choice: Par l’Esprit, ils disaient à Paul de ne pas monter à Jérusalem.
  alternative: L’Esprit leur révélait les souffrances qui attendaient Paul, et ils en concluaient qu’il ne devait pas poursuivre sa route.
  rationale: Le texte attribue leurs paroles à l’action de l’Esprit, mais n’explicite pas la manière de concilier cette interdiction avec Actes 19.21 et 20.22-23. Le texte principal conserve donc la formulation et la tension, tandis que la note signale l’interprétation possible sans l’imposer.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec tout en étant idiomatique; « monter à Jérusalem » conserve l’expression biblique courante.
