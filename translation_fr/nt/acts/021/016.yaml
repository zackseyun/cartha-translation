  source_fidelity: La phrase rend correctement l’accompagnement, la provenance de Césarée, la conduite vers l’hôte et l’ancienneté de Mnason comme disciple. Toutefois, « Mnason, un Chypriote » ne rend pas pleinement τινι, qui introduit Mnason comme « un certain Mnason »; l’article indéfini devant « Chypriote » ne remplit pas la même fonction.
  naturalness: Le français est sobre et naturel. « Chez qui nous devions loger » est plus idiomatique et plus précis dans ce contexte d’hospitalité que « auprès de qui nous devions loger ».
  terminology: « disciple de longue date » rend bien ἀρχαίῳ μαθητῇ sans trancher indûment entre ancienneté personnelle et appartenance aux premiers temps. « Chypriote » est exact pour Κυπρίῳ.
