    rationale: Le grec présente Mnason comme un personnage nouvellement introduit, « un certain Mnason ». « Mnason, un Chypriote » indique son origine mais ne conserve pas cette indétermination d’introduction.
  - severity: low
    issue: « auprès de qui nous devions loger » est moins idiomatique.
    rationale: Pour l’hébergement chez une personne, « chez qui nous devions loger » est l’usage français le plus direct et correspond à παρ’ ᾧ ξενισθῶμεν.
