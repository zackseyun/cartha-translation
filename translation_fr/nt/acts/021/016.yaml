id: ACT.21.16
reference: Acts 21:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: fr
  text: Quelques disciples de Césarée nous accompagnèrent aussi et nous conduisirent chez un certain Mnason, un Chypriote, disciple de longue date[b], chez qui nous devions loger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nous menèrent chez Mnason… afin que nous logions chez lui». Le participe grec et le verbe relatif à l’hébergement permettent des formulations légèrement différentes mais proches.
    reason: lexical_alternative
  - marker: b
    text: Ou «un disciple des premiers temps». L’expression peut signifier que Mnason était disciple depuis longtemps, peut-être depuis les débuts du mouvement.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον … σὺν ἡμῖν
  choice: nous accompagnèrent
  rationale: L’ensemble exprime l’accompagnement pendant le voyage; cette formulation française est naturelle et conserve le mouvement implicite.
- source_word: τῶν μαθητῶν
  choice: quelques disciples
  rationale: Le génitif partitif désigne certains membres du groupe des disciples.
- source_word: ἀπὸ Καισαρείας
  choice: de Césarée
  rationale: Indique leur provenance; dans ce contexte, le français permet naturellement «disciples de Césarée».
- source_word: ἄγοντες
  choice: nous conduisirent
  rationale: 'Le participe précise la fonction de ces disciples: ils guidaient le groupe vers son lieu d’hébergement.'
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: auprès de qui nous devions loger
  rationale: ξενίζω renvoie ici à l’accueil comme hôte et à l’hébergement prévu; la tournure conserve la nuance de destination envisagée.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: Mnason, un Chypriote
  rationale: τινι introduit un personnage jusque-là inconnu; en français, l’article indéfini suffit naturellement, tandis que Κυπρίῳ indique son origine.
- source_word: ἀρχαίῳ μαθητῇ
  choice: disciple de longue date
  rationale: Cette expression rend la durée probable de son appartenance au mouvement sans affirmer qu’il faisait nécessairement partie du tout premier groupe de disciples.
theological_decisions:
- issue: Sens de ἀρχαίῳ μαθητῇ
  choice: disciple de longue date
  alternative: un disciple des premiers temps
  rationale: ἀρχαῖος peut décrire soit une ancienneté personnelle, soit un lien avec les débuts du mouvement. Le texte principal retient une formulation naturelle qui évite de préciser indûment son appartenance au premier cercle; la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et narratif. «Nous accompagnèrent» évite la lourdeur de «vinrent aussi avec nous»; «loger» exprime clairement l’hospitalité. Les appels de notes sont placés immédiatement après les expressions concernées.
