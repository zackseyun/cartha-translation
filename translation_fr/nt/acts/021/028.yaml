revisions:
- from: 'Ils criaient : « Hommes d’Israël, au secours ! Voici l’homme qui, partout, enseigne tout le monde contre notre peuple, contre la Loi et contre ce lieu. Et, de plus, il a même fait entrer des Grecs dans le Temple[a] et a profané ce lieu saint. »'
  to: 'Ils criaient : « Hommes d’Israël, au secours ! Voici l’homme qui enseigne partout à tous contre le peuple, la Loi et ce lieu. En outre, il a même fait entrer des Grecs dans le Temple[a] et a profané ce lieu saint. »'
  rationale: La révision retire l’ajout interprétatif « notre », remplace une tournure française maladroite par une formulation idiomatique qui maintient l’insistance « partout à tous », et conserve les termes cultuels ainsi que l’ancre de note. « En outre » rend sobrement la valeur additive et renforçante de ἔτι τε καὶ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : « notre peuple » ajoute un possessif absent de τοῦ λαοῦ (« le peuple »). Le reste rend fidèlement l’accusation, y compris « des Grecs », la portée cultuelle de κοινόω et la distinction entre ἱερόν et le sanctuaire intérieur.'
  naturalness: « Enseigne tout le monde » n’est pas idiomatique dans ce sens en français moderne. « Enseigne partout à tous » rend naturellement l’ampleur de πάντας πανταχῇ tout en conservant la construction accusatrice avec « contre ».
  terminology: « la Loi » convient dans ce contexte pour le νόμος mosaïque. « Le Temple » est acceptable en texte courant, à condition de conserver la note précisant que ἱερόν vise le complexe cultuel au sens large. « Profané » est juste dans ce contexte de pureté cultuelle.
  issues:
  - severity: medium
    issue: Ajout de « notre » dans « notre peuple »
    rationale: Le grec porte simplement τοῦ λαοῦ, « le peuple ». Le possessif introduit un point de vue collectif qui n’est pas exprimé dans le texte source.
  - severity: medium
    issue: « enseigne tout le monde »
    rationale: Cette formulation n’est pas naturelle en français moderne pour rendre διδάσκων πάντας. « enseigne partout à tous » conserve le sens sans maladresse.
