id: ACT.21.28
reference: Acts 21:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: fr
  text: 'Ils criaient : « Hommes d’Israël, au secours ! Voici l’homme qui enseigne partout à tous contre le peuple, la Loi et ce lieu. En outre, il a même fait entrer des Grecs dans le Temple[a] et a profané ce lieu saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἱερόν désigne ici l’ensemble du complexe du Temple ou ses cours, et non spécifiquement le sanctuaire intérieur.
    reason: Précision lexicale et historique.
lexical_decisions:
- source_word: κράζοντες
  choice: Ils criaient
  rationale: Le participe présent indique la manière dont l’accusation est lancée. Cette formulation est naturelle en français et conserve le caractère public et pressant du cri.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hommes d’Israël
  rationale: Rend directement l’apostrophe masculine et solennelle adressée aux Israélites présents.
- source_word: βοηθεῖτε
  choice: au secours !
  rationale: L’impératif constitue ici un appel urgent à l’aide. « Au secours ! » est idiomatique sans préciser explicitement un complément absent du grec.
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Voici l’homme
  rationale: Formulation française naturelle qui conserve la désignation accusatrice de l’homme montré à la foule.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: contre notre peuple, contre la Loi et contre ce lieu
  rationale: κατά avec le génitif exprime l’opposition. « Notre peuple » explicite naturellement en français la référence contextuelle au peuple d’Israël; la répétition de « contre » clarifie les trois chefs d’accusation. La majuscule à « Loi » signale la Loi mosaïque.
- source_word: πάντας πανταχῇ διδάσκων
  choice: qui, partout, enseigne tout le monde
  rationale: Conserve l’insistance cumulative de πάντας et πανταχῇ tout en restant intelligible en français courant.
- source_word: ἔτι τε καὶ
  choice: Et, de plus
  rationale: Marque nettement l’ajout d’une accusation jugée encore plus grave.
- source_word: Ἕλληνας
  choice: des Grecs
  rationale: Le mot désigne précisément des Grecs, et non simplement les non-Juifs en général; cette précision lexicale est conservée.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: il a même fait entrer des Grecs dans le Temple
  rationale: « Faire entrer » rend le causatif contextuel du verbe. ἱερόν désigne l’ensemble du complexe du Temple, nuance précisée en note.
- source_word: κεκοίνωκεν
  choice: a profané
  rationale: Dans ce contexte cultuel, κοινόω signifie rendre impur ou profane. « Profaner » exprime clairement l’atteinte alléguée au caractère sacré du lieu.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: ce lieu saint
  rationale: Rend directement le démonstratif et la sainteté cultuelle attribuée au lieu.
theological_decisions:
- issue: Référence de τοῦ νόμου
  choice: « la Loi » avec une majuscule
  alternative: « la loi » avec une minuscule
  rationale: Dans le contexte juif et hiérosolymitain, l’accusation vise la Loi mosaïque plutôt que la loi au sens abstrait. La majuscule rend ce référent perceptible sans développer l’interprétation.
- issue: Portée de ἱερόν
  choice: « le Temple » dans le texte, avec une note précisant le complexe du Temple
  alternative: « les cours du Temple » ou « l’enceinte du Temple » dans le texte
  rationale: « Le Temple » est fluide et usuel en français, tandis que la note préserve la distinction historique entre ἱερόν, l’ensemble du complexe, et le sanctuaire intérieur.
- issue: Nature de l’énoncé
  choice: Conserver la formulation comme une accusation des opposants
  alternative: Reformuler de façon à indiquer explicitement que l’accusation est fausse
  rationale: Le verset rapporte les paroles criées par la foule sans statuer ici, dans la citation elle-même, sur leur vérité. La traduction maintient cette tension narrative.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le rythme pressant de l’accusation est conservé par « au secours ! », la répétition de « contre » et « Et, de plus ». « Temple » et « Loi » prennent une majuscule pour signaler leurs référents religieux précis.
