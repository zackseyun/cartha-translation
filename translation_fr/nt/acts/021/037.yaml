id: ACT.21.37
reference: Acts 21:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: fr
  text: 'Au moment où l’on allait faire entrer Paul dans la caserne[a], il dit au tribun[b] : « M’est-il permis de te dire quelque chose[c] ? » Celui-ci répondit : « Tu sais le grec ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « caserne » désigne les quartiers de l’armée romaine, vraisemblablement situés dans l’ensemble de la forteresse Antonia.
    reason: cultural_note
  - marker: b
    text: Ou « commandant ». Le terme grec désigne un officier romain, traditionnellement appelé « tribun ».
    reason: cultural_note
  - marker: c
    text: 'Formulation plus idiomatique : « Puis-je te dire quelque chose ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: Au moment où l’on allait faire entrer
  rationale: La tournure exprime une action imminente, et la construction avec « l’on » conserve le sens passif de l’infinitif grec tout en restant naturelle en français.
- source_word: παρεμβολή
  choice: caserne
  rationale: Dans ce contexte militaire à Jérusalem, le terme désigne les quartiers des soldats romains, situés vraisemblablement dans la forteresse Antonia, plutôt qu’un camp au sens général.
- source_word: χιλίαρχος
  choice: tribun
  rationale: Le terme grec désigne ici un officier romain supérieur. « Tribun » est l’équivalent historique concis, tandis que « commandant » serait plus accessible mais moins précis.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: M’est-il permis de te dire quelque chose ?
  rationale: Cette formulation rend la demande polie de permission exprimée par ἔξεστιν et conserve davantage sa forme que le plus idiomatique « Puis-je te dire quelque chose ? ».
- source_word: τι
  choice: quelque chose
  rationale: Le pronom indéfini a ici son sens courant et général.
- source_word: Ἑλληνιστί γινώσκεις
  choice: Tu connais le grec ?
  rationale: L’adverbe désigne la langue grecque, et γινώσκεις signifie littéralement « tu connais ». La formulation française est naturelle tout en préservant cette nuance, sans préciser indûment s’il s’agit surtout de parler ou de comprendre.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec et convient à cet échange direct. La question finale conserve « connaître le grec » plutôt que de préciser « parler » ou « comprendre », afin de respecter l’ouverture sémantique du texte source.
