  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: fr
  text: Alors Paul prit ces hommes avec lui et, le lendemain, après s’être purifié avec eux, il entra dans le temple[a], en signalant l’achèvement des jours de purification, jusqu’à ce que l’offrande soit présentée pour chacun d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du complexe du temple, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: prit ces hommes avec lui
  rationale: Le participe exprime que Paul emmène avec lui les hommes mentionnés précédemment; «ces hommes» assure une reprise naturelle en français.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: le lendemain
  rationale: Expression temporelle française naturelle pour le jour qui suit immédiatement.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: après s’être purifié avec eux
  rationale: Rend la purification rituelle et la participation de Paul avec les hommes, sans préciser au-delà du grec la procédure suivie.
- source_word: εἰσῄει
  choice: il entra
  rationale: Le passé simple convient au récit français. L’imparfait grec peut présenter l’action dans son déroulement, mais une forme progressive littérale serait maladroite ici et son éventuelle nuance itérative reste incertaine.
- source_word: τὸ ἱερόν
  choice: le temple
  rationale: Traduction courante et lisible de ἱερόν; le terme vise l’ensemble du complexe du temple plutôt que spécifiquement le sanctuaire intérieur, précision conservée en note.
- source_word: διαγγέλλων
  choice: Il annonça
  rationale: Dans ce contexte administratif et rituel, le verbe indique que Paul fait connaître officiellement l’échéance prévue.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: quand s’achèveraient les jours de purification
  rationale: Formulation française naturelle qui comprend ἐκπλήρωσις comme l’achèvement de la période prescrite.
- source_word: ἕως οὗ προσηνέχθη
  choice: au terme desquels l’offrande serait présentée
  rationale: La tournure relie la fin de la période à la présentation future de l’offrande. Le subjonctif aoriste passif après ἕως οὗ autorise cette orientation prospective dans le contexte.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: pour chacun d’eux
  rationale: Rend simplement la relation de bénéfice ou de représentation exprimée par ὑπέρ, sans la surinterpréter.
- source_word: ἡ προσφορά
  choice: l’offrande
  rationale: Terme cultuel général, plus fidèle que «sacrifice», qui pourrait indûment en restreindre le sens.
theological_decisions:
- issue: Portée théologique de la participation de Paul au rite de purification
  choice: Décrire sans commentaire sa participation aux procédures juives de purification
  alternative: Faire entendre que Paul approuve ou rejette par principe la validité durable des rites du temple pour les chrétiens
  rationale: Le verset rapporte l’action de Paul sans trancher les débats théologiques plus larges sur la Loi, les alliances ou la pratique chrétienne.
- issue: Relation temporelle entre l’annonce, la période de purification et l’offrande
  choice: Comprendre l’annonce comme portant sur l’échéance à laquelle la période s’achèverait et l’offrande serait présentée
  alternative: Comprendre que Paul annonçait une période déjà achevée ou qu’il entrait continuellement jusqu’à la présentation de l’offrande
  rationale: La construction grecque est dense et a suscité plusieurs analyses. La formulation retenue suit le déroulement contextuel le plus naturel tout en évitant de préciser l’identité de celui qui présente l’offrande.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe grecque très compacte est répartie en deux phrases pour plus de clarté, sans ajout doctrinal. Le passé simple maintient le registre biblique littéraire tout en restant courant à l’écrit.
