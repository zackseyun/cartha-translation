  rationale: La révision conserve tous les éléments du texte source, maintient la simultanéité exprimée par le participe διαγγέλλων et évite de résoudre par une paraphrase la relation temporelle compacte introduite par ἕως οὗ. Elle reste naturelle en français moderne et ne modifie aucune portée théologique.
