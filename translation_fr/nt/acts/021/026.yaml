- from: Alors Paul prit ces hommes avec lui et, le lendemain, après s’être purifié avec eux, il entra dans le temple[a]. Il annonça quand s’achèveraient les jours de purification, au terme desquels l’offrande serait présentée pour chacun d’eux.
