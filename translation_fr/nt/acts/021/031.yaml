  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: fr
  text: 'Pendant qu’ils cherchaient à le tuer, la nouvelle parvint au commandant de la cohorte[a] : Jérusalem tout entière était en plein tumulte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « cohorte » était une unité de l’armée romaine ; son commandant était un officier supérieur, appelé tribun militaire.
    reason: cultural_note
  - marker: b
    text: 'Ou : « était plongée dans la confusion » ou « était en pleine agitation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε
  choice: Pendant qu’ils cherchaient
  rationale: Le génitif absolu avec le participe présent exprime une action en cours, simultanée à l’arrivée de la nouvelle.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: à le tuer
  rationale: Rendu direct et naturel du verbe ordinaire ἀποκτείνω, sans ajouter l’idée d’une exécution officielle.
- source_word: ἀνέβη φάσις
  choice: la nouvelle parvint
  rationale: Cette formulation française restitue naturellement l’arrivée de l’information au commandant. Le mouvement ascendant suggéré littéralement par ἀνέβη dépend probablement de la situation de la forteresse, mais le calque « monta » serait peu naturel ici.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: au commandant de la cohorte
  rationale: χιλίαρχος désigne ici l’officier romain commandant l’unité appelée σπεῖρα. « Commandant » est accessible, tandis que « cohorte » conserve la précision historique.
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: que Jérusalem tout entière
  rationale: Cette formulation conserve la métonymie concise du grec, qui désigne la ville et sa population.
- source_word: συγχύννεται
  choice: était en plein tumulte
  rationale: Le présent passif décrit une ville bouleversée ou plongée dans la confusion. « En plein tumulte » rend clairement le désordre public sans imposer une analyse plus précise de sa cause.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie une syntaxe fluide tout en conservant la précision militaire et la force collective de « Jérusalem tout entière ».
