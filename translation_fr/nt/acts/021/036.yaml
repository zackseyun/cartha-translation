  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: fr
  text: 'Car la foule du peuple le suivait en criant : « Qu’on l’enlève ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À mort ! » Le grec signifie littéralement : « Enlève-le ! » ou « Emmène-le ! »; dans ce contexte, le cri peut impliquer une demande de mise à mort.'
    reason: Préserve le sens direct de l’impératif grec dans le texte et signale sans l’imposer l’interprétation contextuelle plus forte.
lexical_decisions:
- source_word: ἠκολούθει
  choice: le suivait
  rationale: L’imparfait exprime une action en cours dans le récit; « le suivait » rend naturellement cet aspect en français.
- source_word: γὰρ
  choice: Car
  rationale: Conserve le lien explicatif avec l’action racontée au verset précédent.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: la foule du peuple
  rationale: Rend directement le groupe nominal grec sans introduire la nuance péjorative de « populace » ou de « foule en furie ».
- source_word: κράζοντες
  choice: en criant
  rationale: Le participe indique l’action qui accompagne le fait de suivre; « en criant » est naturel, vif et fidèle.
- source_word: Αἶρε αὐτόν
  choice: À mort !
  rationale: Dans ce contexte hostile, l’impératif idiomatique demande que Paul soit éliminé; « À mort ! » rend la force pragmatique de l’appel, tout en signalant en note la traduction plus littérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le cri bref « À mort ! » restitue l’hostilité de la foule, tandis que la note préserve l’étendue sémantique de l’expression grecque.
