  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: fr
  text: Comme les sept jours allaient s’achever, les Juifs d’Asie, voyant Paul dans l’enceinte du Temple[a], jetèrent toute la foule dans la confusion[b] et se saisirent de lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le mot grec traduit par « enceinte du Temple » désigne l’ensemble du complexe ou de l’enceinte du Temple, et non seulement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « soulevèrent toute la foule ». Le verbe grec peut mettre l’accent soit sur la confusion, soit sur l’agitation de la foule.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « mirent les mains sur lui ». Cette expression signifie qu’ils s’emparèrent de lui par la force.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Comme les sept jours allaient s’achever
  rationale: La tournure « allaient s’achever » exprime naturellement l’imminence portée par μέλλω et l’idée d’achèvement de συντελεῖσθαι, sans expliquer dans le texte à quoi correspond cette période.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: des Juifs venus d’Asie
  rationale: Cette formulation indique l’origine géographique et évite que le lecteur moderne comprenne « asiatiques » au sens du continent actuel; l’Asie désigne ici la province romaine.
- source_word: θεασάμενοι αὐτὸν
  choice: virent Paul
  rationale: Le nom « Paul » remplace naturellement le pronom français pour éviter une ambiguïté, sans ajouter de référent absent du contexte immédiat.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: ἱερόν désigne l’ensemble du complexe ou de l’enceinte du Temple, et non spécifiquement le sanctuaire intérieur. La majuscule distingue ici cet édifice particulier.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: semèrent la confusion dans toute la foule
  rationale: συγχέω peut décrire la confusion, l’agitation ou le désordre. Cette formulation française rend directement la valeur de confusion tout en convenant à la scène de foule.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: se saisirent de lui
  rationale: L’expression grecque signifie poser les mains sur quelqu’un afin de s’en emparer. « Se saisirent de lui » transmet clairement la contrainte physique en français actuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La phrase grecque est divisée en deux phrases françaises pour faciliter la lecture. « Temple » est conservé dans le texte principal, avec une note précisant la portée de ἱερόν. L’ambiguïté de συνέχεον est signalée sans imposer une seule nuance.
