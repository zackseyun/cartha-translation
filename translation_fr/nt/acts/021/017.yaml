  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: fr
  text: Quand nous sommes arrivés à Jérusalem[a], les frères nous ont accueillis avec joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs »; le grec dit « les frères », expression qui peut aussi désigner plus largement les autres croyants.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: Quand nous sommes arrivés
  rationale: Le génitif absolu marque ici la circonstance temporelle de l’arrivée. Cette formulation est naturelle en français et conserve clairement ce rapport temporel.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: Avec le verbe français « arriver », la préposition idiomatique « à » exprime naturellement la destination indiquée par εἰς.
- source_word: ἀσμένως
  choice: avec joie
  rationale: L’adverbe exprime la joie ou l’empressement avec lequel l’accueil a lieu. « Avec joie » est naturel et fidèle dans ce contexte.
- source_word: ἀπεδέξαντο
  choice: ont accueillis
  rationale: Le verbe désigne ici le fait de recevoir des personnes favorablement et avec hospitalité. « Accueillir » rend mieux ce sens relationnel que le plus formel « recevoir ».
- source_word: οἱ ἀδελφοί
  choice: les frères
  rationale: La traduction conserve la forme masculine du grec. Dans l’usage chrétien ancien, le mot peut toutefois désigner plus largement les membres de la communauté, y compris des femmes; cette possibilité est signalée en note.
theological_decisions:
- issue: Portée genrée de ἀδελφοί pour la communauté chrétienne de Jérusalem
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le texte grec emploie le masculin pluriel ἀδελφοί. Le texte principal en préserve la forme sans exclure la possibilité que le terme englobe ici l’ensemble des croyants, possibilité explicitée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste concise; « avec joie » rend clairement l’attitude exprimée par ἀσμένως, tandis que la note préserve l’ambiguïté référentielle de ἀδελφοί.
