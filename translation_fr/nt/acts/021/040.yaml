  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: fr
  text: 'Après en avoir reçu l’autorisation, Paul, debout sur les marches, fit signe de la main au peuple. Quand un grand silence se fut établi, il leur adressa la parole dans la langue hébraïque[a], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « en araméen ». Le grec dit littéralement « dans la langue [ou le dialecte] hébraïque » ; dans ce contexte, cette expression peut désigner la langue sémitique locale couramment appelée araméen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Lorsqu’il le lui eut permis
  rationale: Le génitif absolu renvoie au commandant mentionné dans le contexte précédent. Cette formulation conserve cette référence pronominale ainsi que la valeur temporelle, sans répéter explicitement « le commandant ».
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: Paul, debout sur les marches
  rationale: Le participe parfait décrit la position de Paul. « Les marches » désigne naturellement celles qui conduisent à la forteresse.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: fit signe de la main au peuple
  rationale: Le verbe décrit un geste de la main destiné à attirer l’attention ou à obtenir le silence. « Au peuple » rend directement λαός sans substituer l’interprétation contextuelle « foule ».
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Quand un profond silence se fut établi
  rationale: Le second génitif absolu présente l’établissement d’un silence marqué. La tournure française est naturelle et conserve le caractère événementiel de γενομένης.
- source_word: προσεφώνησεν
  choice: il leur adressa la parole
  rationale: Le verbe désigne ici le fait de s’adresser publiquement à un auditoire. Cette expression convient au registre narratif et restitue le complément implicite en français.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: dans la langue hébraïque
  rationale: Cette traduction suit la désignation grecque explicite, tout en laissant à la note la possibilité que l’expression vise ici l’araméen parlé localement.
- source_word: λέγων
  choice: 'en disant :'
  rationale: Le participe introduit le discours direct qui commence au verset suivant; les deux-points signalent naturellement cette continuité.
