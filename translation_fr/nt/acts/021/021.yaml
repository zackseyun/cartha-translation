id: ACT.21.21
reference: Acts 21:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: fr
  text: Mais ils ont été informés à ton sujet que tu enseignes à tous les Juifs vivant parmi les non-Juifs à abandonner Moïse[a][b], en leur disant de ne pas circoncire leurs enfants et de ne pas vivre selon les coutumes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que tu enseignes l’apostasie à l’égard de Moïse ». Le grec emploie le nom ἀποστασία, qui désigne une défection ou un abandon.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « Moïse » représente la loi transmise par Moïse et les pratiques juives ancestrales.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « marcher selon les coutumes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: ils ont été informés
  rationale: Le passif désigne ici ce qui a été rapporté oralement aux croyants au sujet de Paul. Cette formulation française conserve le caractère indirect de l’information.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: à abandonner Moïse
  rationale: Le nom ἀποστασία exprime l’abandon ou la défection. La tournure verbale est naturelle en français tout en gardant la force de l’accusation et la référence explicite à Moïse.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: tous les Juifs vivant parmi les non-Juifs
  rationale: L’expression désigne les Juifs établis au milieu des peuples non juifs. « Non-Juifs » rend ici le sens contextuel de τὰ ἔθνη avec clarté pour un lectorat moderne.
- source_word: λέγων
  choice: en leur disant
  rationale: Le participe précise le contenu ou la manière de l’enseignement attribué à Paul et renvoie naturellement aux Juifs mentionnés auparavant.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: de ne pas circoncire leurs enfants
  rationale: En contexte, αὐτούς apporte l’idée possessive rendue par « leurs ». Le grec dit « enfants » et non explicitement « fils » ; la traduction conserve donc ce terme.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: et de ne pas vivre selon les coutumes
  rationale: περιπατεῖν, littéralement « marcher », désigne couramment la conduite de la vie. « Vivre selon » communique naturellement cette valeur en français, tandis que « coutumes » rend les pratiques juives héritées.
theological_decisions:
- issue: Nature de l’accusation portée contre Paul au sujet de Moïse
  choice: Présenter l’accusation comme un enseignement visant à « abandonner Moïse », sans en confirmer la véracité.
  alternative: « enseigner l’apostasie à l’égard de Moïse » ou « abandonner la loi de Moïse »
  rationale: Le verset rapporte ce que d’autres ont entendu dire de Paul ; il ne formule pas directement le jugement doctrinal du narrateur. La traduction conserve donc la vigueur et l’ambiguïté de l’accusation sans expliciter « Moïse » en « loi de Moïse » dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la structure de l’accusation rapportée, évite de transformer celle-ci en affirmation du narrateur et rend l’image idiomatique de la « marche » par « vivre », avec conservation du sens littéral en note.
