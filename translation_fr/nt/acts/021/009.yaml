  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: fr
  text: Cet homme avait quatre filles vierges qui prophétisaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quatre filles non mariées qui prophétisaient ».'
    reason: παρθένοι peut désigner des jeunes femmes vierges et, dans son contexte social, non mariées.
lexical_decisions:
- source_word: τούτῳ
  choice: Cet homme
  rationale: Le datif singulier renvoie à Philippe dans le contexte immédiat. Avec la tournure française de possession, « Cet homme avait » rend clairement la référence, même si « Il avait » serait également naturel.
- source_word: δὲ
  choice: —
  rationale: Particule de liaison légère et continuative, naturellement laissée implicite en français dans cette phrase.
- source_word: ἦσαν
  choice: avait
  rationale: 'La construction existentielle grecque τούτῳ … ἦσαν θυγατέρες exprime idiomatiquement la possession : « cet homme avait des filles ».'
- source_word: θυγατέρες
  choice: filles
  rationale: Équivalent familial courant et précis.
- source_word: τέσσαρες
  choice: quatre
  rationale: Cardinal qui détermine directement « filles ».
- source_word: παρθένοι
  choice: vierges
  rationale: « Vierges » reflète directement le sens lexical de παρθένοι sans le réduire au seul état matrimonial. Une formulation plus sociale, « non mariées », est signalée en note.
- source_word: προφητεύουσαι
  choice: qui prophétisaient
  rationale: Le participe présent actif féminin pluriel caractérise les filles par une activité prophétique; l’imparfait français exprime naturellement cette activité ou pratique durable.
theological_decisions:
- issue: Traduction de παρθένοι à propos de femmes qui prophétisent
  choice: vierges
  alternative: non mariées
  rationale: Le texte mentionne leur virginité et leur activité prophétique sans établir de lien théologique entre les deux. « Vierges » préserve l’affirmation lexicale la plus directe; la note donne l’équivalent social possible sans faire de l’un ou l’autre état la condition de leur activité.
- issue: Portée de προφητεύουσαι
  choice: qui prophétisaient
  alternative: qui avaient le don de prophétie
  rationale: La traduction retenue décrit leur activité sans transformer explicitement le participe en désignation d’un don, d’une fonction ou d’un ministère institutionnel.
translation_notes:
  register: Français international moderne, simple et digne. « Prophétisaient » conserve le vocabulaire biblique courant et la formulation reste neutre quant au statut ecclésial précis de ces femmes.
