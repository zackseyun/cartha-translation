source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: fr
  text: Quand nous avons entendu cela, nous-mêmes et les habitants du lieu l’avons vivement pressé[a] de ne pas monter à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’avons supplié ». Le verbe grec peut exprimer une exhortation ou une demande insistante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Quand nous avons entendu cela
  rationale: La tournure introduit la circonstance temporelle avec une légère progression du récit. « Cela » reprend naturellement en français le contenu prophétique qui précède, sans devoir reproduire le pluriel grec de façon artificielle.
- source_word: παρεκαλοῦμεν
  choice: avons supplié
  rationale: Dans ce contexte, παρακαλέω exprime une demande pressante adressée à Paul. « Supplier » restitue clairement l’intensité de l’appel; le passé composé convient au récit français, même si l’imparfait grec peut suggérer une action insistante ou prolongée.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: nous et les gens de l’endroit
  rationale: Cette formulation distingue naturellement les compagnons du narrateur des personnes qui habitaient là, tout en conservant leur action commune.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: de ne pas monter
  rationale: L’infinitif exprime le contenu de la supplication. « Monter » préserve l’expression directionnelle traditionnelle employée pour un déplacement vers Jérusalem; le pronom renvoyant à Paul est déjà exprimé par « l’ » devant le verbe principal.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: « À Jérusalem » est la formulation française idiomatique pour indiquer cette destination.
theological_decisions:
- issue: Expression directionnelle du déplacement vers Jérusalem
  choice: monter à Jérusalem
  alternative: aller à Jérusalem
  rationale: Le grec emploie ἀναβαίνειν, « monter ». Conserver cette expression respecte la formulation géographique et narrative du texte sans lui ajouter de portée doctrinale.
- issue: Intensité de παρακαλέω
  choice: supplié
  alternative: pressé
  rationale: Le contexte d’un avertissement prophétique suivi d’une tentative d’empêcher Paul de partir favorise ici une demande particulièrement insistante. La note signale une formulation française moins intense mais également possible.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste simple et accessible; « les gens de l’endroit » évite le registre plus familier de « les gens du coin », tandis que « monter à Jérusalem » conserve l’idiome de la source.
