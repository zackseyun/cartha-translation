review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle, y compris « monter à Jérusalem ». Toutefois, « supplier » est plus marqué que nécessaire pour παρακαλέω et le passé composé simple ne rend pas très bien la valeur possiblement insistante de l’imparfait παρεκαλοῦμεν. « Presser vivement » exprime une demande pressante sans surinterpréter son intensité.
  naturalness: « Les gens de l’endroit » est compréhensible, mais « les habitants du lieu » est plus naturel et plus précis dans un registre biblique moderne international. La phrase révisée demeure fluide.
  terminology: « Monter à Jérusalem » conserve correctement l’idiome directionnel de ἀναβαίνειν. « Presser vivement » est un équivalent français approprié de παρακαλέω dans ce contexte; la note conserve « supplier » comme possibilité contextuelle.
  issues:
  - severity: medium
    issue: « l’avons supplié » surdétermine παρεκαλοῦμεν
    rationale: Le verbe peut exprimer l’exhortation, l’appel ou l’insistance, sans imposer une supplication. Le contexte permet « supplier », mais une formulation moins chargée est préférable dans le texte principal.
  - severity: low
    issue: « les gens de l’endroit » est moins précis et moins idiomatique
    rationale: ἐντόπιοι désigne les personnes du lieu, vraisemblablement ses habitants; « les habitants du lieu » rend cette idée avec davantage de netteté.
  revised_text: Quand nous avons entendu cela, nous-mêmes et les habitants du lieu l’avons vivement pressé[a] de ne pas monter à Jérusalem.
