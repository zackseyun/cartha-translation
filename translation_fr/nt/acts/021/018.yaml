id: ACT.21.18
reference: Acts 21:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: fr
  text: Le lendemain[a], Paul se rendit avec nous chez Jacques, et tous les anciens étaient présents[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le jour suivant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les anciens vinrent » ou « arrivèrent ». Le verbe grec peut mettre l’accent soit sur leur arrivée, soit sur leur présence.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: Le lendemain
  rationale: Cette expression temporelle idiomatique désigne le jour suivant. « Le lendemain » est la formulation française la plus naturelle et conserve pleinement la valeur temporelle du grec.
- source_word: εἰσῄει
  choice: se rendit
  rationale: Le verbe exprime un mouvement vers l’intérieur ou l’entrée. Avec un complément désignant une personne introduit par πρός, « se rendit chez » restitue naturellement en français le déplacement vers le lieu où se trouve Jacques.
- source_word: σὺν ἡμῖν
  choice: avec nous
  rationale: La préposition σύν suivie du datif marque clairement l’accompagnement.
- source_word: πρὸς Ἰάκωβον
  choice: chez Jacques
  rationale: Avec l’accusatif, πρός indique ici un mouvement en direction de Jacques. En français, « chez Jacques » exprime idiomatiquement le fait d’aller là où il se trouve, sans préciser davantage le lieu.
- source_word: πάντες τε
  choice: et tous
  rationale: La particule τέ assure une liaison légère entre les propositions ; la simple conjonction « et » en rend naturellement la force.
- source_word: παρεγένοντο
  choice: étaient présents
  rationale: παραγίνομαι peut mettre l’accent soit sur l’arrivée, soit sur la présence. Dans ce contexte de réunion, « étaient présents » est naturel, tout en signalant en note l’autre nuance possible.
- source_word: οἱ πρεσβύτεροι
  choice: les anciens
  rationale: Dans les Actes, le terme désigne des responsables reconnus de l’Église. « Les anciens » en conserve le sens traditionnel et transparent sans imposer une structure confessionnelle ultérieure.
theological_decisions:
- issue: Identité et rôle de Ἰάκωβον
  choice: Conserver simplement le nom « Jacques », sans apposition explicative.
  alternative: « Jacques, le frère du Seigneur » ou « Jacques, le responsable de l’Église de Jérusalem »
  rationale: Le verset donne seulement le nom. Bien que le contexte permette d’identifier Jacques, ajouter un titre ou un lien familial introduirait dans le texte principal une information qui n’y est pas formulée.
- issue: Sens ecclésial de οἱ πρεσβύτεροι
  choice: Traduire par « les anciens » sans précision confessionnelle.
  alternative: « les presbytres » ou « les responsables de l’Église »
  rationale: Le mot désigne des responsables reconnus de l’Église de Jérusalem, mais « anciens » préserve le terme source et demeure neutre quant aux formes ultérieures de gouvernement ecclésial.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « se rendit chez Jacques » évite le calque peu idiomatique « entra vers Jacques ». Les notes conservent les possibilités lexicales réelles sans surcharger le texte principal.
