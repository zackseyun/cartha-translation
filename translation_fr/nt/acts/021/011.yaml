id: ACT.21.11
reference: Acts 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: fr
  text: 'Il vint vers nous, prit la ceinture de Paul, se lia les pieds et les mains, puis dit : « Voici ce que dit l’Esprit Saint : “L’homme à qui appartient cette ceinture, les Juifs le lieront de cette manière à Jérusalem et le livreront entre les mains des non-Juifs.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  choice: ceinture
  rationale: « Ceinture » est l’équivalent français moderne et naturel d’un lien ou d’une bande portée autour de la taille.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: se lia les pieds et les mains
  rationale: Le pronom réfléchi indique qu’Agabus accomplit sur lui-même ce geste prophétique. « Lia » conserve le lien lexical avec le futur δήσουσιν.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette formulation française naturelle garde la solennité de la formule prophétique sans recourir au tour plus archaïque « Ainsi parle ».
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Désignation française contemporaine et usuelle de l’Esprit nommé dans le texte.
- source_word: Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη
  choice: L’homme à qui appartient cette ceinture
  rationale: La formulation exprime clairement et sans ajout la relation de possession indiquée par le grec.
- source_word: οὕτως
  choice: de cette manière
  rationale: L’expression relie explicitement la prédiction au geste symbolique qu’Agabus vient d’accomplir.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Le grec désigne les Juifs sans limiter explicitement le propos à leurs chefs; la traduction évite donc d’ajouter cette précision.
- source_word: παραδώσουσιν
  choice: le livreront
  rationale: « Livrer » exprime le transfert hostile d’une personne au pouvoir d’un autre groupe et convient au registre narratif biblique.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: entre les mains des non-Juifs
  rationale: « Entre les mains de » conserve l’image du pouvoir exercé sur une personne; dans ce contexte, ἔθνη désigne les personnes qui ne sont pas juives.
theological_decisions:
- issue: Formule prophétique présentant les paroles de l’Esprit
  choice: Voici ce que dit l’Esprit saint
  alternative: Ainsi parle l’Esprit saint
  rationale: Le choix conserve l’affirmation d’une parole prophétique venant de l’Esprit tout en employant un français actuel et digne.
- issue: Référent du pronom réfléchi ἑαυτοῦ
  choice: Agabus se lie lui-même les pieds et les mains
  alternative: Agabus lie les pieds et les mains de Paul
  rationale: Le pronom réfléchi renvoie naturellement au sujet du participe, Agabus; le geste symbolique annonce ainsi ce qui arrivera ensuite à Paul.
- issue: Sens de ἐθνῶν dans le contexte
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contraste explicite avec « les Juifs » indique ici des personnes non juives. « Les non-Juifs » rend ce contraste sans introduire une terminologie confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « lia/le lieront » est volontaire afin de conserver le rapport entre le geste prophétique et son interprétation. Les guillemets imbriqués distinguent la parole d’Agabus de la déclaration prophétique citée.
