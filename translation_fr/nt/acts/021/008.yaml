source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: fr
  text: Le lendemain, nous sommes partis et sommes arrivés à Césarée. Nous sommes entrés dans la maison de Philippe l’évangéliste, qui était l’un des sept[a], et nous avons séjourné chez lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’un des sept hommes désignés auparavant pour le service à Jérusalem (voir Actes 6.3-6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Cette expression temporelle idiomatique marque naturellement en français la progression du récit, sans rendre δέ de manière artificielle.
- source_word: ἐξελθόντες
  choice: nous sommes partis
  rationale: Dans ce récit de voyage, le participe indique le départ du lieu précédent. Une proposition coordonnée est plus naturelle en français qu’un participe passé littéral.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: sommes arrivés à Césarée
  rationale: Le verbe de mouvement suivi de εἰς présente ici l’arrivée à destination. « Arriver à » est idiomatique et distingue clairement cette action du départ.
- source_word: Καισάρειαν
  choice: Césarée
  rationale: Forme française traditionnelle et courante du nom de lieu, sans précision géographique absente du texte.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Nous sommes entrés dans la maison
  rationale: La proposition autonome restitue clairement la succession des actions et conserve le sens concret de οἶκος.
- source_word: Φιλίππου
  choice: Philippe
  rationale: Forme française traditionnelle du nom grec.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: l’évangéliste
  rationale: « Évangéliste » est le terme français établi pour εὐαγγελιστής et conserve la valeur descriptive ou ministérielle du mot sans la paraphraser.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: qui était l’un des sept
  rationale: Cette formulation naturelle conserve l’allusion historique aux sept hommes d’Actes 6 sans transformer l’expression en titre officiel.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: nous avons logé chez lui
  rationale: Dans ce contexte d’hospitalité, μένω avec παρά désigne le fait de séjourner chez quelqu’un. « Loger chez lui » est précis et naturel en français.
theological_decisions:
- issue: Identification de Philippe comme « l’un des sept »
  choice: Conserver « qui était l’un des sept » sans en faire le nom d’un office ecclésiastique.
  alternative: « qui faisait partie des Sept » ou une explicitation telle que « l’un des sept diacres »
  rationale: Le texte renvoie vraisemblablement aux hommes choisis en Actes 6, mais ne les appelle pas ici « diacres » et ne définit pas la portée ecclésiologique de leur rôle. La traduction maintient l’allusion sans importer une structure ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. Les participes grecs sont rendus par des propositions verbales pour assurer la fluidité narrative. « L’évangéliste » conserve le terme établi, tandis que « l’un des sept » reste en minuscules afin de ne pas imposer un statut technique absent du verset.
