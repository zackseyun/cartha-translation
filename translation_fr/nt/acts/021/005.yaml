source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: fr
  text: Lorsque le moment est venu pour nous d’achever ces jours-là, nous sommes partis et avons repris notre route. Tous nous accompagnaient[a], avec femmes et enfants, jusqu’à l’extérieur de la ville. Puis nous nous sommes mis à genoux sur la plage[b] et nous avons prié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tous nous raccompagnaient pour nous dire adieu ». Le verbe grec peut désigner le fait d’accompagner quelqu’un lors de son départ.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur le rivage » ou « au bord de la mer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: Quand vint pour nous le moment d’achever ces jours-là
  rationale: La tournure avec ἐγένετο et l’infinitif signale l’arrivée du moment prévu, tandis que ἐξαρτίζω exprime ici l’achèvement d’une période. « Ces jours-là » conserve la référence concrète du grec sans paraphraser en « séjour ».
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: nous sommes partis et avons repris notre route
  rationale: Cette formulation rend à la fois la sortie et la poursuite du voyage. Le passé composé convient au récit moderne en français, et « reprendre notre route » exprime naturellement le mouvement continu porté par l’imparfait grec.
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Tous nous accompagnaient
  rationale: προπέμπω désigne ici le fait d’accompagner des voyageurs lors de leur départ, avec la nuance possible de leur faire ses adieux. L’imparfait restitue l’accompagnement en cours.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: avec leurs femmes et leurs enfants
  rationale: Dans ce contexte où πάντων, masculin pluriel, évoque les membres du groupe accompagnés de leurs familles, γυναιξί désigne le plus naturellement leurs épouses. Les possessifs nécessaires en français rendent ce lien explicite sans modifier la scène.
- source_word: ἕως ἔξω τῆς πόλεως
  choice: jusqu’en dehors de la ville
  rationale: 'La formulation conserve la force spatiale de ἕως et de ἔξω : ils les accompagnent jusqu’à un point situé hors de la ville, et non simplement jusqu’à ses abords.'
- source_word: θέντες τὰ γόνατα
  choice: nous nous sommes mis à genoux
  rationale: L’expression grecque, littéralement « ayant posé les genoux », est une locution idiomatique pour s’agenouiller. La coordination française rend naturellement la succession des gestes.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: sur la plage
  rationale: αἰγιαλός désigne la plage ou le rivage. « Plage » est précis, courant et adapté au lieu où le groupe s’agenouille.
- source_word: προσευξάμενοι
  choice: nous avons prié
  rationale: Le participe aoriste poursuit la séquence narrative. Une proposition coordonnée est plus naturelle en français et conserve le « nous » du récit de voyage.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie des tournures courantes sans effacer les éléments concrets du grec. Les répétitions lourdes ont été évitées, mais la progression du départ, de l’accompagnement hors de la ville, de l’agenouillement et de la prière demeure explicite.
