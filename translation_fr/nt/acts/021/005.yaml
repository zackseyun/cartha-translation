  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la fin de la période de séjour, le départ, l’accompagnement hors de la ville, l’agenouillement sur le rivage et la prière sont tous conservés. Toutefois, « leurs femmes » introduit un possessif absent du grec et fixe γυναιξί au sens d’« épouses » de manière plus étroite que nécessaire.'
  naturalness: Le français est globalement naturel et de registre narratif moderne. « Jusqu’en dehors de la ville » est toutefois lourd ; « jusqu’à l’extérieur de la ville » rend la même localisation de façon plus idiomatique.
  terminology: « Achever ces jours-là », « accompagner », « se mettre à genoux », « plage » et « prier » conviennent. « Femmes et enfants » préserve mieux l’absence de possessif et l’ambiguïté lexicale relative de γυναιξί.
