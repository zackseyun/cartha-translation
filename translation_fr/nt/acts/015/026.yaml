id: ACT.15.26
reference: Acts 15:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: fr
  text: des hommes qui ont risqué leur vie[a] pour le nom de notre Seigneur Jésus, le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont livré leur vie »; l’expression grecque signifie qu’ils se sont exposés à un danger mortel.'
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « Jésus Christ »; « Christ » est le titre grec correspondant à « Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: des hommes
  rationale: Le terme désigne ici Barnabas et Paul, deux hommes nommément identifiés dans le contexte immédiat; le masculin est donc précis et non générique.
- source_word: παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: qui ont risqué leur vie
  rationale: L’expression signifie littéralement qu’ils ont livré leur vie, mais, puisque Barnabas et Paul sont encore vivants, elle évoque le fait de s’être exposés à un danger mortel. « Risqué leur vie » rend clairement cet idiome sans laisser entendre qu’ils sont morts.
- source_word: ὑπὲρ
  choice: pour
  rationale: Avec le génitif, la préposition exprime ici la cause à laquelle ils se sont consacrés; « pour » est naturel et concis en français.
- source_word: τοῦ ὀνόματος
  choice: le nom
  rationale: Le maintien de « nom » préserve la résonance biblique englobant la personne, l’autorité et l’honneur de Jésus.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: « Seigneur » conserve le poids du titre κύριος et correspond à l’usage français courant du Nouveau Testament.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus, le Messie
  rationale: Χριστός est ici un titre; « le Messie » en restitue le sens, tandis que la virgule rend l’apposition naturelle en français.
theological_decisions:
- issue: Valeur de Χριστοῦ dans la séquence « notre Seigneur Jésus Christ »
  choice: Jésus, le Messie
  alternative: Jésus-Christ
  rationale: Le grec permet la formulation française traditionnelle « Jésus-Christ », mais Χριστός signifie « Messie » et conserve ici sa valeur de titre. La traduction choisie rend ce sens explicite sans ajouter de contenu doctrinal.
- issue: Portée de l’expression « livrer leur vie »
  choice: risqué leur vie
  alternative: livré leur vie
  rationale: Le contexte exclut une référence à leur mort effective et indique qu’ils se sont exposés à un danger mortel. La note conserve toutefois la forme plus littérale et la force sacrificielle de l’expression grecque.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste un fragment syntaxique parce que le verset dépend de la proposition commencée au verset 25. « Risqué leur vie » évite de faire croire à un martyre déjà accompli, tandis que les notes signalent la formulation littérale et l’équivalent traditionnel du titre.
