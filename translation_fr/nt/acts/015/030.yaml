id: ACT.15.30
reference: Acts 15:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: fr
  text: Ainsi donc, après avoir reçu leur congé[a], ils descendirent à Antioche[b]. Après avoir réuni le groupe[c], ils lui remirent la lettre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir été congédiés » ou « après avoir été laissés partir ». Le participe grec peut désigner le fait d’être officiellement congédié ou autorisé à partir.
    reason: lexical_alternative
  - marker: b
    text: « Descendirent » traduit le sens directionnel du verbe grec, probablement en raison de l’altitude de Jérusalem par rapport à Antioche.
    reason: cultural_note
  - marker: c
    text: Ou « l’assemblée » ou « la communauté ». L’expression grecque désigne ici le groupe nombreux des personnes réunies à Antioche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: après avoir été congédiés
  rationale: Le participe désigne ici le fait d’être officiellement laissé partir au terme de la rencontre; « congédiés » préserve cette nuance sans ajouter explicitement l’idée d’un mandat.
- source_word: κατῆλθον
  choice: descendirent
  rationale: Le verbe conserve le mouvement descendant, vraisemblablement lié au départ de Jérusalem, située en altitude, vers Antioche.
- source_word: συναγαγόντες
  choice: ils réunirent
  rationale: La proposition coordonnée rend naturellement en français l’action antérieure exprimée par le participe aoriste.
- source_word: τὸ πλῆθος
  choice: tout le groupe
  rationale: Cette formulation désigne collectivement les croyants rassemblés sans imposer le sens institutionnel de « congrégation » ni évoquer nécessairement une foule indéterminée.
- source_word: ἐπέδωκαν
  choice: lui remirent
  rationale: « Remettre » exprime la transmission formelle de la lettre à ses destinataires réunis.
- source_word: ἐπιστολήν
  choice: la lettre
  rationale: « Lettre » est l’équivalent moderne et courant, préférable au terme ecclésiastique « épître ».
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La seconde phrase évite une accumulation lourde de participes et clarifie le pronom destinataire sans modifier la séquence des actions.
