    rationale: Le grec τὸ πλῆθος désigne le groupe nombreux ou la multitude rassemblée; l’article défini n’équivaut pas nécessairement à « tout ».
  - severity: low
    issue: « après avoir été congédiés » est potentiellement ambigu en français moderne.
    rationale: Le mot peut évoquer le renvoi d’un emploi ou une mise à l’écart. Dans ce contexte, l’idée est plutôt qu’ils ont officiellement reçu l’autorisation de partir.
