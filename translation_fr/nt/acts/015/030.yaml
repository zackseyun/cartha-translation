  source_fidelity: Le sens général et la succession des actions sont bien rendus. Toutefois, « tout le groupe » introduit une totalité que τὸ πλῆθος n’exprime pas explicitement. « Congédiés » est possible, mais peut suggérer en français moderne un renvoi ou un licenciement; « après avoir reçu leur congé » rend plus naturellement l’autorisation officielle de partir.
  naturalness: Le passé simple convient au récit biblique. La formulation révisée conserve un français moderne et fluide, tout en rendant explicitement l’antériorité du participe « ayant rassemblé ».
  terminology: « Antioche », « lettre » et « remettre » sont appropriés. « Le groupe » garde le caractère collectif de τὸ πλῆθος sans imposer « assemblée » ou « communauté » et sans ajouter « tout ».
