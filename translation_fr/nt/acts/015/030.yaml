  rationale: La révision supprime l’ajout de totalité dans « tout le groupe », rend plus naturellement en français l’autorisation de départ exprimée par ἀπολυθέντες, et conserve la séquence grecque selon laquelle le rassemblement précède la remise de la lettre.
