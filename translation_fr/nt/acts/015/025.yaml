id: ACT.15.25
reference: Acts 15:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔδοξεν ἡμῖν γενομένοις ὁμοθυμαδὸν ⸀ἐκλεξαμένοις ἄνδρας πέμψαι πρὸς ὑμᾶς σὺν τοῖς ἀγαπητοῖς ἡμῶν Βαρναβᾷ καὶ Παύλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: fr
  text: Il nous a paru bon, après être parvenus à un accord unanime, de choisir des hommes[a] et de vous les envoyer avec nos bien-aimés Barnabé et Paul,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de délégués de sexe masculin ; le grec dit expressément « hommes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: Nous avons donc jugé bon
  rationale: Rend naturellement la formule délibérative collective sans lui donner la force d’un ordre. « Donc » rattache la décision aux motifs exposés dans la lettre.
- source_word: γενομένοις ὁμοθυμαδόν
  choice: après être parvenus à un accord unanime
  rationale: Le tour exprime l’aboutissement à une décision commune; cette formulation conserve à la fois le processus marqué par le participe et l’unanimité portée par l’adverbe.
- source_word: ἐκλεξαμένοις ἄνδρας
  choice: de choisir des hommes
  rationale: Le participe se coordonne naturellement en français avec l’infinitif dépendant de « jugé bon ». ἄνδρας désigne ici des hommes adultes, identifiés ensuite comme Jude et Silas.
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: de vous les envoyer
  rationale: Le pronom « les » reprend explicitement et naturellement « des hommes », comme l’exige l’usage français.
- source_word: σὺν τοῖς ἀγαπητοῖς ἡμῶν
  choice: avec nos bien-aimés
  rationale: Préserve l’accompagnement ainsi que la chaleur affectueuse et digne de ἀγαπητοῖς.
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: Barnabé et Paul
  rationale: Formes françaises usuelles des noms propres bibliques.
theological_decisions:
- issue: Tonalité de la délibération collective dans la lettre de Jérusalem
  choice: « Nous avons donc jugé bon »
  alternative: « Nous avons décidé »
  rationale: La construction avec δοκέω exprime l’approbation ou le jugement collectif sans imposer ici une formule d’autorité plus forte que le grec.
- issue: Nature de l’accord du groupe
  choice: « après être parvenus à un accord unanime »
  alternative: « étant d’un même avis »
  rationale: La traduction retient l’idée d’un aboutissement à l’unanimité sans préciser comment celle-ci a été obtenue ni effacer la valeur processuelle du participe.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la forme épistolaire et le ton collégial du grec. « Accord unanime » est idiomatique et évite l’expression plus vieillie « d’un commun accord », tout en conservant la force de ὁμοθυμαδόν.
