id: ACT.15.8
reference: Acts 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: fr
  text: Et Dieu, qui connaît les cœurs[a], leur a rendu témoignage en leur donnant l’Esprit Saint tout comme à nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu, celui qui connaît les cœurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδιογνώστης
  choice: qui connaît les cœurs
  rationale: Le composé rare désigne celui qui connaît le for intérieur. La proposition relative est naturelle en français et le pluriel « les cœurs » exprime clairement que Dieu connaît le cœur de chacun.
- source_word: θεὸς
  choice: Dieu
  rationale: Équivalent français courant de θεός ; καρδιογνώστης lui est rattaché comme désignation attributive.
- source_word: ἐμαρτύρησεν
  choice: a rendu témoignage
  rationale: 'Cette formulation conserve la valeur probante de μαρτυρέω dans l’argument de Pierre : Dieu a lui-même attesté son accueil.'
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif renvoie, d’après le contexte, aux non-Juifs, sans que cette identification soit ajoutée au verset.
- source_word: δοὺς
  choice: en leur donnant
  rationale: Le participe aoriste indique ici le moyen par lequel Dieu a rendu témoignage. La tournure française exprime naturellement ce rapport.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Désignation française contemporaine et consacrée du Saint-Esprit, fidèle à la construction grecque.
- source_word: καθὼς καὶ ἡμῖν
  choice: tout comme à nous
  rationale: 'Le grec est elliptique : le don de l’Esprit est sous-entendu dans le second membre. Le français peut conserver cette ellipse sans ambiguïté.'
theological_decisions:
- issue: L’accueil des non-Juifs attesté par le don de l’Esprit
  choice: Conserver « leur » et « nous » sans expliciter les groupes dans le verset.
  alternative: Remplacer « leur » par « aux non-Juifs » afin d’expliciter le référent contextuel.
  rationale: Le grec emploie seulement des pronoms. Le contexte identifie les groupes ; les nommer dans le verset ajouterait une précision interprétative absente de sa formulation.
- issue: Nature du témoignage divin
  choice: Présenter le don de l’Esprit comme le moyen par lequel Dieu leur rend témoignage.
  alternative: 'Comprendre le participe comme une simple action concomitante : « leur a rendu témoignage et leur a donné ».'
  rationale: La construction avec δοὺς se comprend le plus naturellement comme indiquant le moyen, tout en évitant d’ajouter une explication doctrinale sur la portée exacte de ce témoignage.
translation_notes:
  register: Français international moderne, naturel et digne. « Rendre témoignage » maintient le vocabulaire judiciaire et argumentatif du passage. La ponctuation encadre clairement la proposition relative, et l’ellipse finale reste fluide en français.
