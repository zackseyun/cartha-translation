  source_fidelity: 'Le texte rend fidèlement la syntaxe et le sens du grec : Dieu est qualifié comme celui qui connaît les cœurs, il a attesté les destinataires, et cette attestation est exprimée par le don de l’Esprit Saint, mis en parallèle avec le don reçu par « nous ». « Leur » conserve à juste titre le pronom non explicité du grec.'
  naturalness: La formulation est fluide et naturelle en français international moderne. « A rendu témoignage » conserve bien la portée attestative de ἐμαρτύρησεν, et « en leur donnant » rend clairement la valeur de moyen du participe δοὺς. L’ellipse de « tout comme à nous » est naturelle et sans ambiguïté dans ce contexte.
