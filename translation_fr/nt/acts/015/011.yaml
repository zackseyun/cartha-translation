  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: fr
  text: Mais nous croyons que, par la grâce du Seigneur Jésus, nous serons sauvés, de même qu’eux aussi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Mais nous croyons être sauvés par la grâce du Seigneur Jésus, de la même manière qu’eux aussi. »'
    reason: Préserve la construction de πιστεύομεν avec l’infinitif σωθῆναι et la valeur explicite de καί dans κἀκεῖνοι.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement en français le contraste fort avec le joug que ni les ancêtres ni la génération présente n’ont pu porter.
- source_word: διὰ τῆς χάριτος
  choice: c’est par la grâce
  rationale: διά avec le génitif exprime ici le moyen. La tournure clivée produit un français naturel et souligne ce moyen sans ajouter d’idée au texte.
- source_word: χάριτος
  choice: grâce
  rationale: Terme français courant et théologiquement approprié pour la faveur divine qui sauve.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: Le génitif dépend naturellement de « grâce » et désigne la grâce qui vient du Seigneur Jésus.
- source_word: πιστεύομεν
  choice: nous croyons
  rationale: Rend directement l’affirmation confiante introduisant le contenu exprimé par l’infinitif.
- source_word: σωθῆναι
  choice: que nous sommes sauvés
  rationale: L’infinitif aoriste passif ne marque pas à lui seul un temps futur. Le présent français conserve l’affirmation générale de la manière dont le salut est reçu, sans imposer une temporalité absente de la forme grecque.
- source_word: καθ’ ὃν τρόπον
  choice: de la même manière que
  rationale: Rend explicitement et naturellement la comparaison de manière.
- source_word: κἀκεῖνοι
  choice: eux
  rationale: La forme contractée signifie « eux aussi ». En français, dans « de la même manière qu’eux », l’inclusion réciproque est déjà portée par la comparaison; une note conserve la valeur explicite de καί.
theological_decisions:
- issue: Direction de la comparaison dans la déclaration de Pierre
  choice: Les croyants juifs (« nous ») sont sauvés de la même manière que les non-Juifs (« eux »).
  alternative: Ils seront sauvés de la même manière que nous.
  rationale: L’ordre et la syntaxe du grec prennent le salut de « nous » comme terme comparé à celui d’« eux ». Cette orientation, significative dans le contexte, est conservée.
- issue: Temporalité de σωθῆναι
  choice: « que nous sommes sauvés »
  alternative: « que nous serons sauvés » ou « être sauvés »
  rationale: L’aoriste infinitif grec exprime l’action globalement sans coder en lui-même le futur. Le présent français évite de trancher inutilement entre salut présent et futur; la note propose une forme plus littérale.
- issue: Salut par la grâce
  choice: Le salut est déclaré venir par la grâce du Seigneur Jésus, sans développement doctrinal ajouté.
  alternative: Ajouter une formule telle que « par la grâce seule, au moyen de la foi seule ».
  rationale: Le verset nomme explicitement la grâce et l’acte de croire, mais ne formule pas ces développements dogmatiques.
translation_notes:
  register: Français international moderne, clair et digne. La tournure clivée « c’est par… que » est idiomatique et garde l’accent sur la grâce comme moyen du salut. Le pronom « eux » renvoie contextuellement aux non-Juifs.
