source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: fr
  text: Mais Paul et Barnabé séjournaient à Antioche[a] ; avec beaucoup d’autres, ils enseignaient la parole du Seigneur[b] et la proclamaient comme une bonne nouvelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « passaient quelque temps à Antioche ». Le verbe grec peut souligner qu’ils y demeuraient pendant un certain temps.'
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « la parole du Seigneur » par « le message du Seigneur ». Dans les Actes, cette expression désigne couramment le message concernant le Seigneur ou venant de lui.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la proclamaient comme une bonne nouvelle ». Le verbe grec signifie annoncer ou proclamer une bonne nouvelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: restèrent
  rationale: À l’imparfait, le verbe décrit un séjour qui se prolonge. « Restèrent » est naturel et conserve cette valeur durative dans le récit.
- source_word: διδάσκοντες
  choice: enseignaient
  rationale: L’imparfait français rend l’activité continue menée pendant leur séjour.
- source_word: εὐαγγελιζόμενοι
  choice: l’annonçaient comme une bonne nouvelle
  rationale: Cette formulation exprime l’idée propre au verbe grec — annoncer une bonne nouvelle — tout en rattachant clairement τὸν λόγον τοῦ κυρίου aux deux participes.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: avec beaucoup d’autres
  rationale: La formule indique que Paul et Barnabé accomplissaient cette activité en compagnie de nombreuses autres personnes. La valeur additive de καί ressort naturellement du contexte.
- source_word: λόγον
  choice: parole
  rationale: « Parole » maintient l’expression lucanienne reconnaissable « la parole du Seigneur » et sa continuité littéraire, sans exclure le sens de « message ».
- source_word: κυρίου
  choice: Seigneur
  rationale: Le titre κύριος est rendu directement par « Seigneur », sans préciser davantage son référent.
theological_decisions:
- issue: Référent de « Seigneur » dans « la parole du Seigneur »
  choice: Conserver simplement « le Seigneur »
  alternative: Préciser « le Seigneur Jésus » ou comprendre plus largement « le message venant du Seigneur »
  rationale: Dans les Actes, « le Seigneur » peut désigner particulièrement Jésus, mais le grec ne donne ici aucune précision supplémentaire. La traduction préserve donc cette ouverture.
- issue: Rapport entre « la parole du Seigneur » et les deux activités
  choice: Présenter la parole du Seigneur comme ce qui est à la fois enseigné et annoncé comme bonne nouvelle
  alternative: Faire dépendre l’expression uniquement de l’annonce
  rationale: La place de l’accusatif τὸν λόγον τοῦ κυρίου permet de le comprendre comme le contenu commun des deux participes. La reprise pronominale en français rend cette relation clairement sans changer le contenu.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est légèrement restructurée pour éviter la tournure peu naturelle « annoncer la bonne nouvelle de la parole », tout en conservant le lien grammatical de « la parole du Seigneur » avec l’enseignement et l’annonce. Les imparfaits rendent la continuité des participes présents pendant leur séjour.
