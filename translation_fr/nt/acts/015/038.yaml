id: ACT.15.38
reference: Acts 15:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: fr
  text: Mais Paul estimait qu’il ne fallait pas emmener avec eux cet homme[a], qui les avait quittés en Pamphylie et ne les avait pas accompagnés dans l’œuvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cet homme qui les avait abandonnés en Pamphylie » ; le participe grec peut recevoir cette nuance plus forte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: estimait qu’il ne fallait pas
  rationale: L’imparfait de ἀξιόω exprime ici le jugement ferme de Paul. Cette formulation française conserve cette fermeté sans transformer explicitement le verbe en une action de parole.
- source_word: ἀποστάντα
  choice: qui les avait quittés
  rationale: Le participe aoriste de ἀφίσταμαι désigne le fait de se retirer ou de s’éloigner. « Avait quittés » énonce naturellement le fait sans imposer dans le texte principal la nuance plus accusatrice d’un abandon.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: qui les avait quittés en Pamphylie
  rationale: Le premier groupe marque la séparation d’avec eux; le second situe naturellement le point où cette séparation s’est produite. « En Pamphylie » évite en français l’enchaînement maladroit de deux compléments introduits par « de ».
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: ne les avait pas accompagnés
  rationale: Dans ce contexte de déplacement missionnaire, συνέρχομαι exprime le fait d’aller avec eux. « Accompagnés » est clair et idiomatique en français.
- source_word: εἰς τὸ ἔργον
  choice: dans l’œuvre
  rationale: Cette traduction garde le terme concret et défini ἔργον ainsi que l’idée d’engagement dans la tâche, sans expliciter celle-ci par le mot interprétatif « mission ».
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: qu’il ne fallait pas emmener avec eux cet homme
  rationale: L’infinitif négatif dépend du jugement de Paul. « Emmener avec eux » rend le sens de συμπαραλαμβάνω, tandis que « cet homme » conserve la force démonstrative de τοῦτον.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la fermeté du désaccord ainsi que l’ambiguïté lexicale sur le caractère éventuellement blâmable du départ de Jean-Marc.
