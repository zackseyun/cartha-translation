  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: fr
  text: 'Quelques jours plus tard, Paul dit à Barnabé : « Retournons donc visiter les frères[a] dans chacune des villes où nous avons proclamé la parole du Seigneur, pour voir comment ils vont. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les frères et sœurs » : le grec emploie le mot « frères », qui peut désigner ici l’ensemble des croyants, hommes et femmes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: Quelques jours plus tard
  rationale: L’expression marque un moment postérieur après un intervalle indéfini. Cette formulation est naturelle en français et ne précise pas davantage la durée.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: Paul dit à Barnabé
  rationale: Rend directement l’acte de parole et ses deux participants, dans l’ordre naturel du français.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: Retournons voir
  rationale: Le participe aoriste associé au subjonctif d’exhortation exprime ici la proposition de repartir pour rendre visite. « Retournons voir » est idiomatique et conserve à la fois le retour et la visite empreinte d’intérêt.
- source_word: τοὺς ἀδελφοὺς
  choice: les frères
  rationale: Conserve le terme familial masculin employé par le grec. Comme il peut désigner collectivement l’ensemble des croyants, hommes et femmes, une note signale cette portée possible.
- source_word: κατὰ πόλιν πᾶσαν
  choice: dans chacune des villes
  rationale: 'Rend la valeur distributive de κατά : les villes sont envisagées une par une, parmi celles où la parole avait été proclamée.'
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: où nous avons proclamé
  rationale: καταγγέλλω désigne une annonce publique ou solennelle ; « proclamer » en conserve la force sans ajouter l’idée technique de prédication.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: la parole du Seigneur
  rationale: Formulation française établie qui conserve λόγος et le génitif τοῦ κυρίου sans trancher inutilement entre un message venant du Seigneur et un message à son sujet.
- source_word: πῶς ἔχουσιν
  choice: pour savoir comment ils vont
  rationale: Rend naturellement l’idiome grec portant sur l’état ou la situation des personnes visitées.
theological_decisions:
- issue: Portée de ἀδελφοί dans une communauté probablement mixte
  choice: les frères
  alternative: les frères et sœurs ; les croyants
  rationale: Le texte principal conserve la forme familiale masculine de la source, tandis qu’une note indique qu’elle peut avoir une portée représentative et inclure les femmes.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage néotestamentaire courant et préserve la portée christologique possible du titre sans la surdéterminer.
translation_notes:
  register: Français international moderne, naturel et digne. L’exhortation est formulée avec un impératif de première personne du pluriel. La phrase évite un calque lourd du participe grec tout en maintenant l’idée du retour, de la visite et de l’attention portée à l’état des communautés.
