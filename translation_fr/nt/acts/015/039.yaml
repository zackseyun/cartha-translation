id: ACT.15.39
reference: Acts 15:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: fr
  text: Il y eut alors un désaccord si vif qu’ils se séparèrent l’un de l’autre[a]. Barnabas prit Marc avec lui et partit par bateau pour Chypre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une si vive altercation ». Le terme grec peut désigner une forte provocation ou un affrontement intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Il y eut alors
  rationale: Cette tournure française introduit naturellement le nouvel événement; « alors » rend le léger enchaînement narratif de δέ sans accentuer indûment l’opposition.
- source_word: παροξυσμὸς
  choice: un désaccord si vif
  rationale: Dans ce contexte, le nom désigne un affrontement intense. « Désaccord vif » est actuel et clair, tout en évitant de réduire le terme à une irritation intérieure ou de lui prêter une violence non exprimée.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: qu’ils se séparèrent l’un de l’autre
  rationale: La construction ὥστε avec infinitif exprime ici le résultat. La corrélation française « si… que » restitue naturellement le rapport entre intensité et conséquence.
- source_word: τόν τε Βαρναβᾶν
  choice: Barnabas
  rationale: τε introduit le premier volet des actions distinctes qui résultent de la séparation, le second venant au verset suivant. Une nouvelle phrase française préserve clairement cet enchaînement.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: prit Marc avec lui
  rationale: Le participe accompagne l’action principale et παραλαμβάνω comporte l’idée de prendre quelqu’un avec soi. Le texte grec dit simplement « Marc ».
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: partit par bateau pour Chypre
  rationale: ἐκπλέω signifie partir en naviguant. Cette formulation française naturelle conserve à la fois le départ, le moyen maritime et la destination.
theological_decisions:
- issue: Présentation du conflit entre collaborateurs apostoliques
  choice: un désaccord si vif
  alternative: une vive altercation
  rationale: Le récit présente sans détour un conflit réel et intense entre Paul et Barnabas. La traduction ne l’atténue pas, ne le moralise pas et n’en précise pas la nature au-delà des données lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. La structure est divisée en deux phrases pour éviter une coordination lourde, tout en gardant la virgule finale qui signale la continuation syntaxique et narrative au verset 40.
