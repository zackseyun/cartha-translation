id: ACT.15.3
reference: Acts 15:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: fr
  text: Ainsi donc, après avoir été envoyés par l’Église pour poursuivre leur route, ils traversaient la Phénicie et la Samarie en racontant en détail la conversion des non-Juifs[a], et ils procuraient une grande joie à tous les frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « le fait que les non-Juifs se tournent ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « frères » désigne probablement l’ensemble des croyants, y compris les femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: après que l’Église les eut aidés à poursuivre leur route
  rationale: Le verbe προπέμπω peut désigner le fait d’accompagner, d’équiper ou d’aider quelqu’un à continuer son voyage. Cette formulation française conserve cette nuance sans préciser indûment la forme de l’aide.
- source_word: ἐκκλησίας
  choice: l’Église
  rationale: Dans ce contexte des Actes, le terme désigne la communauté chrétienne locale; « Église » est le rendu courant et clair.
- source_word: διήρχοντο
  choice: ils traversèrent
  rationale: Le verbe décrit leur déplacement à travers les régions mentionnées. Le passé simple convient au récit, tandis que le participe présent exprime l’activité menée en chemin.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: la Phénicie et la Samarie
  rationale: Les noms géographiques suivent l’usage français standard. La coordination française simple rend naturellement la construction corrélative τε…καί.
- source_word: ἐκδιηγούμενοι
  choice: en racontant en détail
  rationale: Le verbe composé souligne un compte rendu développé ou complet; « raconter en détail » en conserve la force.
- source_word: ἐπιστροφὴν τῶν ἐθνῶν
  choice: la conversion des non-Juifs
  rationale: Dans ce contexte, ἐπιστροφή désigne le fait de se tourner vers Dieu, tandis que τὰ ἔθνη désigne les peuples non juifs. « Conversion des non-Juifs » est clair en français actuel, avec l’image plus littérale du retournement signalée en note.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: ils procurèrent une grande joie
  rationale: 'Cette formulation rend naturellement la tournure causative grecque: leur récit faisait naître une grande joie.'
- source_word: πᾶσι τοῖς ἀδελφοῖς
  choice: à tous les frères
  rationale: Le masculin pluriel du texte source est conservé, tandis qu’une note précise que le terme peut englober l’ensemble des croyants, femmes comprises.
theological_decisions:
- issue: Sens de ἐπιστροφή dans l’accueil des non-Juifs
  choice: conversion
  alternative: retournement, fait de se tourner vers Dieu
  rationale: « Conversion » communique clairement le changement d’orientation religieuse rapporté ici sans définir davantage sa mécanique théologique; la note préserve la métaphore grecque.
- issue: Portée de ἀδελφοί dans la communauté croyante
  choice: frères
  alternative: frères et sœurs; croyants
  rationale: Le rendu principal conserve la forme masculine du grec. La note indique son emploi collectif probable sans effacer la forme lexicale du texte source.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique courant sans archaïsme marqué; les expressions « aidés à poursuivre leur route » et « non-Juifs » privilégient la clarté tout en restant proches des nuances grecques.
