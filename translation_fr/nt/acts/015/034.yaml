  text: Ἔδοξε δὲ τῷ Σίλᾳ ἐπιμεῖναι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/034.yaml
  text: But[a] it seemed good to Silas to remain there.
translation:
  language: fr
  text: Mais Silas jugea bon de rester là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment du Papyrus 74 (IIIe siècle), du Sinaïticus et du Vaticanus (IVe siècle), ainsi que d’anciennes traductions coptes. Il figure dans la tradition majoritaire byzantine, dans certains manuscrits alexandrins et occidentaux plus tardifs, ainsi que dans les traditions latine et syriaque. Il a probablement été ajouté par un copiste postérieur pour expliquer pourquoi Silas se trouve encore à Antioche et peut accompagner Paul au verset 40, alors que le verset 33 indiquait que Judas et lui étaient repartis.
    reason: textual_critical
lexical_decisions:
- source_word: δοκέω (ἔδοξε avec le datif τῷ Σίλᾳ)
  choice: Silas jugea bon
  rationale: Cette tournure impersonnelle signifie idiomatiquement que Silas estima bon ou décida de faire quelque chose. « Silas jugea bon » est naturel en français tout en conservant l’idée d’une appréciation réfléchie, sans réduire le verbe à une simple décision.
- source_word: ἐπιμένω (ἐπιμεῖναι)
  choice: rester
  rationale: Dans ce contexte géographique, le verbe indique le fait de demeurer ou de continuer à se trouver au même endroit. « Rester » est le terme moderne le plus direct.
- source_word: αὐτοῦ
  choice: là
  rationale: Employé comme adverbe de lieu, le mot renvoie à Antioche, lieu où se déroule la scène.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation « jugea bon » rend l’idiome grec de manière naturelle, tandis que « rester là » conserve la simplicité du texte source. Le marqueur de note est placé après la phrase entière, car la note concerne l’authenticité textuelle de tout le verset.
