  source_fidelity: La relative finale οἷς οὐ διεστειλάμεθα qualifie les hommes en question et nie explicitement qu’une instruction leur ait été donnée. La rendre par « sans que nous leur ayons donné… » est globalement fidèle, mais son déplacement au milieu de la phrase obscurcit quelque peu la structure grecque. « Vos esprits » pour τὰς ψυχὰς est possible dans certains contextes, mais ici « vos âmes » conserve mieux le lexique et l’ampleur personnelle de ψυχαί.
  naturalness: Le français est lisible, mais « partis de chez nous sans que… » associe plus étroitement l’absence d’instructions à leur départ qu’à leur action troublante. Une relative finale explicite est à la fois naturelle et plus précise. « Bouleversant vos âmes » rend idiomatiquement le participe ἀνασκευάζοντες sans le transformer en second verbe principal coordonné.
  terminology: « Instructions » rend bien διεστειλάμεθα sans imposer le registre plus autoritaire d’« ordres ». « Âmes », accompagné d’une note explicative, maintient la transparence envers ψυχαί sans imposer un sens technique.
