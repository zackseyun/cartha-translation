source:
  edition: SBLGNT
  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: fr
  text: Puisque nous avons appris que certains, partis de chez nous, vous ont troublés par leurs paroles, bouleversant vos âmes[a], auxquels nous n’avions donné aucune instruction[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « votre être intérieur »; littéralement : « vos âmes ». L’expression grecque désigne la personne dans sa vie intérieure, et non seulement ses émotions.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « auxquels nous n’avions donné aucun ordre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ ἠκούσαμεν
  choice: Puisque nous avons appris
  rationale: La tournure exprime naturellement en français la cause et la réception d’une information qui reste pertinente au moment de la lettre.
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: certains, partis de chez nous
  rationale: Cette formulation conserve l’idée que ces personnes sont parties du milieu des auteurs, sans affirmer qu’elles avaient reçu leur mandat.
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: vous ont troublés par leurs paroles
  rationale: « Troubler » rend le désarroi causé, tandis que « par leurs paroles » préserve la valeur instrumentale de λόγοις.
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: ont bouleversé vos esprits
  rationale: Dans ce contexte, ψυχαί désigne l’être intérieur ou la disposition intérieure des destinataires; « esprits » est naturel en français et évite que « âmes » soit compris dans un sens technique trop étroit.
- source_word: οἷς οὐ διεστειλάμεθα
  choice: sans que nous leur ayons donné d’instructions
  rationale: La proposition relative grecque nie que les auteurs aient donné une directive à ces hommes. Son intégration près de « partis de chez nous » clarifie le référent sans ajouter de concession explicite.
theological_decisions:
- issue: L’absence d’autorisation donnée aux fauteurs de trouble
  choice: sans que nous leur ayons donné d’instructions
  alternative: auxquels nous n’avions donné aucun ordre
  rationale: Le texte nie une directive émanant du groupe de Jérusalem. « Instructions » conserve cette portée institutionnelle sans durcir indûment le verbe en un commandement militaire.
- issue: Le sens de τὰς ψυχὰς ὑμῶν
  choice: vos esprits
  alternative: vos âmes
  rationale: La traduction vise ici l’être intérieur et l’état profond des destinataires, sans imposer une distinction doctrinale précise entre âme et esprit; la note conserve la transparence lexicale.
translation_notes:
  register: Français international actuel, digne et lisible. La phrase reste liée à la suite de la lettre, d’où la virgule finale. Les participes grecs sont intégrés à une syntaxe française naturelle, et la négation d’un mandat est placée près des personnes concernées pour éviter toute ambiguïté.
