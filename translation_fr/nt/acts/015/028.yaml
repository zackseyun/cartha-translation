    rationale: La locution française peut vouloir dire « aucun fardeau différent », tandis que πλέον exprime ici l’idée d’une charge additionnelle. « Aucune charge supplémentaire » rend cette nuance sans surcharge interprétative.
  - severity: medium
    issue: « les exigences nécessaires suivantes » est interprétatif pour τούτων τῶν ἐπάναγκες.
    rationale: « Exigences » donne aux « choses nécessaires » une qualification normative qui n’est pas lexicalement exprimée dans le verset. « Les choses nécessaires suivantes » reste proche du grec et renvoie naturellement à l’énumération du verset suivant.
