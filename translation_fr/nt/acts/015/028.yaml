  source_fidelity: La formulation « d’autre fardeau » peut suggérer un fardeau de nature différente, alors que μηδὲν πλέον βάρος signifie qu’aucune charge additionnelle ne doit être imposée. « Exigences » interprète τούτων τῶν ἐπάναγκες plus fortement que « choses »; le grec désigne sobrement les éléments nécessaires qui suivent.
  naturalness: La phrase est globalement naturelle et de registre approprié. « Aucune charge supplémentaire, si ce n’est les choses nécessaires suivantes » est à la fois idiomatique, clair et plus proche de la portée comparative et exceptive du grec.
  terminology: « Saint-Esprit » et « charge » conviennent au français moderne international et au registre du passage. La formulation révisée préserve le caractère personnel du Saint-Esprit sans importer d’explication doctrinale.
