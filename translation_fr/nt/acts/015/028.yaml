id: ACT.15.28
reference: Acts 15:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: fr
  text: 'En effet, il a paru bon au Saint-Esprit et à nous[a] de ne vous imposer aucune charge supplémentaire, si ce n’est les choses nécessaires suivantes[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Saint-Esprit et nous avons décidé ». L’expression grecque peut servir de formule de décision.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ces éléments essentiels » ou « ces prescriptions nécessaires ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: il a paru bon
  rationale: Cette tournure française conserve la formule délibérative grecque, qui peut exprimer à la fois une approbation et une décision, sans la réduire à une simple impression.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: au Saint-Esprit
  rationale: Le datif complète ἔδοξεν et présente le Saint-Esprit comme partie prenante personnelle à l’approbation de la décision.
- source_word: καὶ ἡμῖν
  choice: et à nous
  rationale: 'La formulation maintient le parallélisme des deux datifs coordonnés : « au Saint-Esprit et à nous ».'
- source_word: μηδὲν πλέον … βάρος
  choice: ne pas vous imposer d’autre fardeau
  rationale: « D’autre fardeau » rend naturellement en français l’idée de ne rien ajouter au fardeau, tout en conservant la métaphore de βάρος.
- source_word: ἐπιτίθεσθαι ὑμῖν
  choice: vous imposer
  rationale: Dans le contexte d’obligations fixées par l’assemblée, « imposer » exprime clairement l’action de mettre une charge sur les destinataires.
- source_word: πλὴν
  choice: que
  rationale: Après « ne pas… d’autre », « que » introduit idiomatiquement l’exception exprimée par πλὴν.
- source_word: τούτων τῶν ἐπάναγκες
  choice: les exigences nécessaires suivantes
  rationale: Cette formulation naturelle renvoie explicitement aux prescriptions énumérées au verset suivant. « Exigences » explicite légèrement la nature contextuelle des « choses nécessaires », d’où le signalement d’alternatives en note.
theological_decisions:
- issue: Rapport entre le Saint-Esprit et la décision de l’assemblée
  choice: « il a paru bon au Saint-Esprit et à nous »
  alternative: « le Saint-Esprit et nous avons décidé »
  rationale: Le texte coordonne l’approbation du Saint-Esprit et celle de l’assemblée. La traduction conserve cette affirmation et l’action personnelle de l’Esprit sans transformer la formule en simple consensus humain.
- issue: Portée des obligations imposées aux croyants non juifs
  choice: « ne pas vous imposer d’autre fardeau que les exigences nécessaires suivantes »
  alternative: Comprendre le verset soit comme supprimant toute obligation, soit comme imposant l’ensemble de la Loi mosaïque
  rationale: La formulation maintient la portée limitée mais réelle des exigences annoncées, sans résoudre la tension au moyen d’un système doctrinal ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » rend la liaison explicative de γάρ. La phrase garde la formule solennelle du conseil tout en évitant une syntaxe vieillie; les notes préservent les principales possibilités lexicales.
