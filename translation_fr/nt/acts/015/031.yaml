  text: ἀναγνόντες δὲ ἐχάρησαν ἐπὶ τῇ παρακλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/031.yaml
  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: fr
  text: Après l’avoir lue, ils se réjouirent de l’encouragement qu’elle leur apportait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ils se réjouirent de cette exhortation » ou « de cette consolation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: Après l’avoir lue
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. Le pronom féminin « l’ » reprend naturellement la lettre mentionnée au verset précédent.
- source_word: δὲ
  choice: Après…
  rationale: La transition légère marquée par δέ est rendue par l’enchaînement naturel de la phrase plutôt que par une conjonction explicite, qui serait lourde ici en français.
- source_word: ἐχάρησαν
  choice: ils se réjouirent
  rationale: Cette formulation conserve la force positive de χαίρω et convient au registre narratif digne du passage.
- source_word: ἐπὶ
  choice: de
  rationale: Avec le datif, ἐπί indique ici le motif de leur joie. En français, « se réjouir de » exprime naturellement cette relation.
- source_word: τῇ παρακλήσει
  choice: l’encouragement qu’elle leur apportait
  rationale: παράκλησις peut désigner l’encouragement, l’exhortation ou la consolation. « Encouragement » convient au contexte, tandis que la proposition relative explicite naturellement en français que cet encouragement venait de la lettre.
theological_decisions: []
