  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: fr
  text: C’est pourquoi j’estime que nous ne devons pas créer de difficultés à ceux d’entre les non-Juifs qui se tournent vers Dieu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux d’entre les nations ». Dans ce contexte, le terme grec désigne les peuples non juifs.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « je conclus qu’il ne faut pas créer de difficultés à ceux… » ou « mon avis est de ne pas créer de difficultés à ceux… »'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion que Jacques tire de l’argument précédent.
- source_word: ἐγὼ κρίνω
  choice: j’estime que
  rationale: Conserve la première personne explicite et exprime un jugement mûrement réfléchi, sans évoquer ici un acte judiciaire.
- source_word: μὴ παρενοχλεῖν
  choice: nous ne devons pas créer de difficultés
  rationale: Rend le sens de causer des ennuis ou des obstacles; le « nous » fait ressortir la portée collective de la recommandation sans effacer le jugement personnel de Jacques.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: à ceux qui, parmi les non-Juifs
  rationale: Désigne des personnes issues des peuples non juifs et préserve la nuance de provenance portée par ἀπό.
- source_word: ἐθνῶν
  choice: non-Juifs
  rationale: Dans ce contexte judéo-chrétien, le terme désigne les gens des autres nations; « non-Juifs » est clair en français moderne.
- source_word: ἐπιστρέφουσιν
  choice: se tournent
  rationale: Préserve l’image verbale et la valeur présente d’un mouvement en cours vers Dieu, sans employer un terme technique comme « se convertir ».
- source_word: ἐπὶ τὸν θεόν
  choice: vers Dieu
  rationale: Exprime nettement l’orientation indiquée par ἐπί avec le verbe « se tourner ».
theological_decisions:
- issue: Jugement personnel de Jacques ou décision collective proposée
  choice: « j’estime que nous ne devons pas »
  alternative: « je conclus qu’il ne faut pas » ou « mon avis est de ne pas »
  rationale: Le grec exprime explicitement le jugement personnel de Jacques par ἐγὼ κρίνω, tandis que l’infinitif énonce une mesure destinée à l’assemblée. Cette formulation maintient les deux aspects sans faire de la phrase une simple opinion privée.
- issue: Sens de ἐπιστρέφουσιν
  choice: « se tournent vers Dieu »
  alternative: « se convertissent à Dieu »
  rationale: La formulation choisie conserve l’image du texte grec et évite de préciser au-delà du texte la nature ou les étapes de la conversion.
translation_notes:
  register: Français international actuel, digne et accessible. « Créer de difficultés » est idiomatique sans minimiser la force de παρενοχλεῖν; « non-Juifs » évite l’opacité possible de « païens » ou « Gentils » pour le lectorat général.
