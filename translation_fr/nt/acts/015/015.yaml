id: ACT.15.15
reference: Acts 15:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: fr
  text: 'Et les paroles des prophètes s’accordent avec cela[a], comme il est écrit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « correspondent à cela ».'
    reason: Le datif τούτῳ avec συμφωνέω peut décrire l’accord avec ce qui précède ou la correspondance à celui-ci; les deux formulations françaises rendent cette relation sans préciser davantage le référent.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Connecteur courant qui introduit l’appui supplémentaire apporté par Jacques et assure naturellement la continuité du discours.
- source_word: τούτῳ
  choice: avec cela
  rationale: Le démonstratif au datif renvoie de manière générale à ce qui vient d’être exposé. Avec συμφωνέω, « avec cela » est idiomatique en français et ne précise pas excessivement son référent.
- source_word: συμφωνοῦσιν
  choice: s’accordent
  rationale: Le présent actif exprime ici la concordance. « S’accordent » rend clairement cette idée tout en convenant à des paroles prophétiques.
- source_word: οἱ λόγοι
  choice: les paroles
  rationale: Dans ce contexte, λόγοι désigne les énoncés des prophètes conservés dans l’Écriture. « Les paroles » est direct, naturel et digne.
- source_word: τῶν προφητῶν
  choice: des prophètes
  rationale: Le génitif indique que ces paroles sont celles des prophètes; la formulation française reste proche du grec et parfaitement idiomatique.
- source_word: καθὼς
  choice: comme
  rationale: Introduit la citation scripturaire qui confirme la concordance évoquée. « Comme » restitue naturellement cette relation en français.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule consacrée d’introduction d’une citation de l’Écriture, qui rend la valeur résultative du parfait passif grec.
theological_decisions:
- issue: Référent de τούτῳ dans le discours de Jacques
  choice: Le démonstratif neutre renvoie largement à ce qui précède, rendu par « cela » sans explicitation doctrinale.
  alternative: La conversion des non-Juifs; la déclaration de Pierre; le projet ou dessein de Dieu.
  rationale: Le grec ne nomme pas précisément le référent. La traduction conserve cette portée ouverte au lieu de retenir silencieusement une interprétation particulière.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe française privilégie l’ordre naturel tout en conservant la formule scripturaire traditionnelle « il est écrit » et l’indétermination du démonstratif grec.
