id: ACT.15.32
reference: Acts 15:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: fr
  text: Judas et Silas, qui étaient eux-mêmes prophètes, encouragèrent longuement les frères[a] et les affermirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs » ; le grec dit « frères » et peut désigner ici l’ensemble de la communauté croyante.
    reason: Alternative lexicale précisant la portée inclusive possible du masculin pluriel grec.
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle de ce nom personnel dans le Nouveau Testament et dans le contexte des Actes.
- source_word: τε καὶ
  choice: et
  rationale: La coordination simple relie naturellement Judas et Silas en français, sans alourdir la phrase.
- source_word: Σιλᾶς
  choice: Silas
  rationale: Forme française traditionnelle du nom.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: qui étaient eux-mêmes prophètes
  rationale: La proposition relative restitue naturellement la valeur circonstancielle du participe, tandis que « eux-mêmes » conserve l’accent porté par αὐτοί.
- source_word: προφῆται
  choice: prophètes
  rationale: Équivalent français direct et courant, sans atténuation du rôle désigné.
- source_word: διὰ λόγου πολλοῦ
  choice: de longues paroles
  rationale: L’expression évoque une prise de parole développée. Cette formulation conserve l’idée de durée ou d’abondance verbale sans traduire mécaniquement λόγος au singulier.
- source_word: παρεκάλεσαν
  choice: adressèrent … des paroles d’encouragement
  rationale: Dans ce contexte, le verbe désigne une exhortation encourageante. La tournure française exprime clairement une action accomplie par la parole et évite la répétition avec « affermirent ».
- source_word: τοὺς ἀδελφοὺς
  choice: aux frères
  rationale: La traduction maintient le masculin pluriel du grec. Une note indique qu’il peut désigner l’ensemble de la communauté croyante, femmes comprises.
- source_word: ἐπεστήριξαν
  choice: les affermirent
  rationale: « Affermir » rend l’idée de rendre ferme ou plus solide, tout en distinguant cette action de l’encouragement qui précède.
theological_decisions:
- issue: Portée de ἀδελφοὺς dans une communauté probablement mixte
  choice: aux frères
  alternative: aux frères et sœurs ; aux croyants
  rationale: Le grec emploie un masculin pluriel qui peut avoir une portée collective et inclure les femmes. Le texte principal conserve la forme explicite de la source, tandis que la note signale son sens inclusif possible sans le trancher silencieusement.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase conserve le titre « prophètes », l’emphase de « eux-mêmes » et les deux actions distinctes : encourager par une prise de parole prolongée, puis affermir.'
