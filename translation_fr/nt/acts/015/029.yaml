id: ACT.15.29
reference: Acts 15:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: fr
  text: vous abstenir des aliments sacrifiés aux idoles[a], du sang, de ce qui a été étranglé[b] et de l’immoralité sexuelle[c]. Si vous vous gardez de ces choses, vous ferez bien. Portez-vous bien[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses sacrifiées aux idoles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de la viande d’animaux étranglés » ou « des choses étranglées ».
    reason: lexical_alternative
  - marker: c
    text: Le terme grec traduit par « immoralité sexuelle » peut avoir un sens large, bien que certains l’entendent ici plus précisément à la lumière des interdictions du Lévitique.
    reason: alternative_reading
  - marker: d
    text: Ou « Adieu ». Le grec emploie une formule conventionnelle de fin de lettre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: vous abstenir
  rationale: L’infinitif exprime le contenu de la directive. « Vous abstenir » est concis, naturel et conserve la force formelle du grec.
- source_word: εἰδωλοθύτων
  choice: des aliments sacrifiés aux idoles
  rationale: Le terme désigne ce qui a été offert dans le culte des idoles, en particulier de la nourriture ou de la viande. Cette formulation est claire en français moderne sans restreindre indûment le référent.
- source_word: αἵματος
  choice: du sang
  rationale: Le grec dit simplement « sang ». La traduction en conserve la formulation concise et laisse le contexte indiquer la portée alimentaire de l’interdiction.
- source_word: πνικτῶν
  choice: de ce qui a été étranglé
  rationale: L’adjectif substantivé renvoie à ce qui a été tué par strangulation. Cette formulation préserve la portée générale du grec plutôt que de préciser obligatoirement « viande ».
- source_word: πορνείας
  choice: de l’immoralité sexuelle
  rationale: πορνεία peut désigner largement une conduite sexuelle jugée illicite. « Immoralité sexuelle » est actuel et plus large que « fornication ».
- source_word: ἐξ ὧν
  choice: de ces choses
  rationale: Le relatif reprend les éléments énumérés. La formulation explicite naturellement son antécédent en français.
- source_word: διατηροῦντες ἑαυτούς
  choice: Si vous vous gardez
  rationale: Le participe peut naturellement prendre ici une valeur conditionnelle. « Si vous vous gardez » rend la construction de façon fluide tout en conservant l’idée de vigilance personnelle.
- source_word: εὖ πράξετε
  choice: vous ferez bien
  rationale: Cette expression idiomatique indique que suivre ces directives constitue une bonne manière d’agir. « Vous ferez bien » en est l’équivalent français naturel.
- source_word: ἔρρωσθε
  choice: Portez-vous bien
  rationale: Dans une lettre, cet impératif sert de formule finale. « Portez-vous bien » conserve à la fois son caractère conventionnel et sa nuance littérale de bien-être.
theological_decisions:
- issue: Sens de πορνεία dans le décret apostolique
  choice: Traduction générale par « immoralité sexuelle », sans réduire le terme à une seule infraction.
  alternative: « fornication » ou unions/mariages interdits en Lévitique 18
  rationale: Le contexte a conduit certains interprètes à comprendre le mot en référence à des interdictions lévitiques précises, mais le verset ne le restreint pas explicitement. Le texte principal conserve donc sa valeur lexicale large et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe s’insère dans la phrase commencée au verset précédent. Les termes cultuels et moraux restent explicites, sans archaïsme ni précision doctrinale ajoutée.
