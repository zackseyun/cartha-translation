  source_fidelity: 'Le sens général est bien rendu : Paul choisit Silas, part, et les frères le remettent à la grâce du Seigneur. Toutefois, « avoir été confié à la grâce » est moins idiomatique en français et peut suggérer que Paul est simplement placé sous la garde abstraite de la grâce. Dans cette formule ecclésiale, παραδοθείς est mieux rendu par « avoir été recommandé à la grâce », qui exprime la remise confiante de Paul à la faveur et aux soins du Seigneur sans lever l''ambiguïté du référent de « Seigneur ».'
  naturalness: La phrase est fluide et de registre approprié. « Après avoir été recommandé à la grâce du Seigneur » est une collocation française biblique claire et naturelle, tout en restant compréhensible en français international moderne.
  terminology: « Mais », « choisit », « Silas », « partit », « la grâce du Seigneur » et « les frères » correspondent adéquatement au grec. La note sur « frères » préserve avec justesse la possibilité d'une référence communautaire inclusive sans modifier le masculin pluriel du texte source.
