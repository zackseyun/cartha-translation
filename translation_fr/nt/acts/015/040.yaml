id: ACT.15.40
reference: Acts 15:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: fr
  text: Mais Paul choisit Silas et partit, après avoir été recommandé à la grâce du Seigneur par les frères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « frères » peut désigner ici plus largement la communauté des croyants, y compris les femmes.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste avec le départ de Barnabas au verset précédent.
- source_word: ἐπιλεξάμενος
  choice: choisit
  rationale: Le participe aoriste moyen indique que Paul choisit personnellement Silas avant de partir; « choisit » est naturel et précis.
- source_word: Σιλᾶν
  choice: Silas
  rationale: Translittération française traditionnelle du nom propre.
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Dans ce récit de voyage, le verbe signifie se mettre en route ou partir; « partit » convient au français courant.
- source_word: παραδοθεὶς
  choice: après avoir été confié
  rationale: Le passif exprime que la communauté remet Paul aux soins de la grâce du Seigneur. « Confié » conserve plus directement l'idée de παραδίδωμι et son ambiguïté légitime.
- source_word: τῇ χάριτι
  choice: à la grâce
  rationale: Conserve le nom théologique χάρις sans le réduire par paraphrase à la seule protection ou bienveillance.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Reproduit le titre κύριος sans préciser si le référent est Jésus ou Dieu, puisque le grec ne le fait pas explicitement.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: par les frères
  rationale: Rend la forme masculine plurielle du grec tout en signalant en note que le terme peut désigner plus largement la communauté croyante.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Maintenir simplement « le Seigneur »
  alternative: « le Seigneur Jésus » ou « Dieu »
  rationale: Le texte grec ne précise pas davantage le référent; la traduction conserve donc cette indétermination.
- issue: Portée de « frères »
  choice: « les frères » dans le texte, avec une note explicative
  alternative: « les frères et sœurs » ou « les croyants »
  rationale: Cette formulation respecte la forme du grec, tandis que la note préserve la possibilité d'un emploi communautaire incluant les femmes.
- issue: Sens de παραδοθεὶς
  choice: « après avoir été confié »
  alternative: « après avoir été recommandé » ou « remis »
  rationale: « Confié » exprime naturellement la remise de Paul aux soins de la grâce du Seigneur sans transformer l'expression en simple approbation humaine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la progression grecque, tout en évitant une tournure participiale pesante. Un seul appel de note est nécessaire, puisque « confié » intègre déjà dans le texte principal l'alternative lexicale importante.
