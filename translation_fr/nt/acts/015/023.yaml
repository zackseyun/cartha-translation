  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: fr
  text: 'Ils leur remirent la lettre suivante[a] : « Les apôtres et les anciens, frères, aux frères issus des non-Juifs qui sont à Antioche, en Syrie et en Cilicie[b] : salut ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant écrit par leur main ». L’expression grecque indique ici que la lettre fut transmise par l’intermédiaire des délégués.'
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « frères » peut désigner de manière inclusive les croyants de toute la communauté, y compris les femmes. La relation entre « les anciens » et « frères » dans la suscription grecque est discutée : on peut aussi comprendre « les apôtres et les anciens, frères » comme une désignation des expéditeurs, ou « les apôtres et les anciens frères » comme « les apôtres et les frères anciens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες διὰ χειρὸς αὐτῶν
  choice: Ils leur remirent cette lettre
  rationale: Le participe aoriste avec l’expression idiomatique « par leur main » introduit ici la lettre confiée aux délégués. Cette formulation française exprime naturellement la transmission du document tout en signalant l’idiome littéral en note.
- source_word: ἀπόστολοι
  choice: apôtres
  rationale: Terme français consacré et précis pour les envoyés-dirigeants reconnus de Jérusalem.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: les anciens, vos frères
  rationale: 'L’absence d’un second article favorise une lecture appositionnelle : les anciens sont présentés comme des frères. La ponctuation française rend cette relation sans créer un troisième groupe distinct.'
- source_word: ἀδελφοῖς
  choice: frères
  rationale: Le masculin pluriel du grec est conservé. Dans cette adresse communautaire, il peut toutefois inclure l’ensemble des croyants, femmes comprises, ce que précise une note.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: issus des non-Juifs
  rationale: L’expression désigne l’origine des destinataires parmi les nations. « Non-Juifs » est immédiatement compréhensible en français moderne et évite l’ambiguïté courante de « païens ».
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: qui sont à Antioche, en Syrie et en Cilicie
  rationale: κατά avec l’accusatif marque ici la répartition ou la localisation des destinataires dans les lieux nommés. La variation prépositionnelle est idiomatique en français.
- source_word: χαίρειν
  choice: salut !
  rationale: Dans l’ouverture d’une lettre, χαίρειν est une formule épistolaire de salutation, et non un ordre de se réjouir.
theological_decisions:
- issue: Portée de ἀδελφοῖς dans l’adresse à la communauté
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal garde la forme masculine du grec, tandis qu’une note indique son probable emploi inclusif pour toute la communauté croyante.
- issue: Rapport syntaxique entre πρεσβύτεροι et ἀδελφοί
  choice: les anciens, vos frères
  alternative: les anciens et les frères
  rationale: Le grec ne répète pas l’article devant ἀδελφοί, ce qui favorise l’apposition plutôt que l’identification de deux groupes coordonnés. La solution retenue préserve cette lecture sans exclure l’autre ponctuation possible.
translation_notes:
  register: Français international moderne, naturel et digne. La formule d’adresse conserve le caractère officiel de la lettre sans lourdeur archaïque. « Non-Juifs » privilégie la clarté contemporaine; « salut ! » garde la brièveté conventionnelle de la salutation grecque.
