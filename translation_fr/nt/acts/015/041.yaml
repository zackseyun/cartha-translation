  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: fr
  text: Il parcourait la Syrie et la Cilicie, affermissant les Églises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: parcourait
  rationale: L’imparfait exprime une progression en cours à travers plusieurs régions. « Parcourait » rend naturellement ce déplacement continu sans en préciser indûment la durée.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ est un connecteur narratif léger. En français, l’enchaînement demeure naturel sans conjonction explicite, tandis que « et » serait plus lourd en ouverture de phrase.
- source_word: Συρίαν
  choice: la Syrie
  rationale: Forme française courante du nom de cette région.
- source_word: Κιλικίαν
  choice: la Cilicie
  rationale: Forme française courante du nom de cette région.
- source_word: ἐπιστηρίζων
  choice: affermissant
  rationale: 'Le participe décrit l’action qui accompagne le voyage : rendre les communautés plus fermes et plus solides. « Affermissant » conserve cette idée mieux que le simple encouragement.'
- source_word: ἐκκλησίας
  choice: les Églises
  rationale: Dans ce contexte, le terme désigne les communautés chrétiennes locales. « Églises » est l’équivalent français usuel et clair.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. L’imparfait « parcourait » et le participe présent « affermissant » préservent la simultanéité et l’aspect progressif du grec. La majuscule à « Églises » signale ici les communautés chrétiennes locales, selon un usage éditorial français courant.
