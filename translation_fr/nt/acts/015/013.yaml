  variant: modern international French
source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: fr
  text: 'Après qu’ils se furent tus[a], Jacques prit la parole : « Frères[b], écoutez-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après qu’ils eurent cessé de parler ». L’expression grecque indique que les intervenants précédents avaient fini de parler.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’adresse grecque est « Hommes, frères », formule masculine solennelle adressée ici aux frères réunis; d’autres personnes faisaient aussi partie de l’assemblée au sens large.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: Après qu’ils se furent tus
  rationale: La construction μετά suivie de l’infinitif articulé situe l’action après la fin des interventions précédentes. « Se furent tus » exprime naturellement en français qu’ils ont cessé de parler, sans préciser davantage la cause ou la durée du silence.
- source_word: ἀπεκρίθη … λέγων
  choice: prit la parole
  rationale: Dans cette scène de délibération, la tournure grecque introduit la réaction verbale de Jacques. « Prit la parole » rend idiomatiquement la reprise du discours sans alourdir la phrase par « répondit en disant ».
- source_word: Ἰάκωβος
  choice: Jacques
  rationale: « Jacques » est la forme française traditionnelle et immédiatement reconnaissable du nom Ἰάκωβος dans le Nouveau Testament.
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: Les deux vocatifs masculins constituent une formule d’adresse solennelle. En français naturel, « Frères » en restitue la fonction et le genre, tandis qu’une traduction littérale comme « Hommes, frères » serait artificielle; la note signale la forme grecque complète.
- source_word: ἀκούσατέ μου
  choice: écoutez-moi
  rationale: L’impératif demande une écoute attentive. « Écoutez-moi » est direct, naturel et conserve pleinement la force de l’appel.
theological_decisions:
- issue: Portée et genre de la formule d’adresse Ἄνδρες ἀδελφοί
  choice: Employer « Frères » dans le texte, avec une note indiquant la forme masculine littérale
  alternative: « Hommes, frères » ou « Frères et sœurs »
  rationale: Le grec emploie deux vocatifs masculins et ne dit pas explicitement « sœurs ». « Frères » conserve l’adresse masculine tout en étant idiomatique en français; la note préserve la forme rhétorique du grec sans élargir ni restreindre silencieusement sa portée contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « se furent tus » maintient la succession temporelle avec concision; « prit la parole » évite le calque peu naturel « répondit en disant ».
