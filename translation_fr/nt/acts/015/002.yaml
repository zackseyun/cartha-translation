id: ACT.15.2
reference: Acts 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: fr
  text: Après qu’un sérieux conflit et un vif débat eurent opposé Paul et Barnabas à ces hommes[a], on chargea Paul et Barnabas, ainsi que quelques autres d’entre eux, de monter[b] à Jérusalem auprès des apôtres et des anciens au sujet de cette question[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un conflit et un débat non petits entre Paul et Barnabas et eux ». La tournure grecque souligne l’importance de la controverse.'
    reason: lexical_alternative
  - marker: b
    text: « Monter » est l’expression grecque habituelle pour parler d’un déplacement vers Jérusalem.
    reason: cultural_note
  - marker: c
    text: 'Ou : « au sujet de cette affaire » ou « au sujet de ce sujet de débat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: alors ... opposèrent
  rationale: Le génitif absolu pose la circonstance qui conduit à la décision principale. « Alors » conserve l'enchaînement narratif, tandis que la tournure verbale est naturelle en français.
- source_word: στάσεως καὶ ζητήσεως
  choice: un conflit et un débat
  rationale: « Conflit » exprime l'opposition sérieuse de στάσις sans suggérer nécessairement la violence; « débat » rend la controverse verbale de ζήτησις et maintient la distinction entre les deux termes.
- source_word: οὐκ ὀλίγης
  choice: assez vifs
  rationale: Cette formulation restitue naturellement en français la valeur intensive de la litote grecque, tout en évitant une expression artificielle comme « non petits ».
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: opposèrent alors Paul et Barnabas à ces hommes
  rationale: La construction identifie les deux parties au conflit. « Ces hommes » renvoie clairement aux hommes venus de Judée au verset précédent.
- source_word: ἔταξαν
  choice: On décida
  rationale: Dans ce contexte, le sujet implicite prend une décision organisée concernant l'envoi de délégués. « On décida » préserve l'indétermination du sujet grec et n'impose pas une structure institutionnelle plus précise.
- source_word: ἀναβαίνειν
  choice: monteraient
  rationale: Le verbe conserve l'expression conventionnelle et géographique employée pour se rendre à Jérusalem.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: accompagnés de quelques autres membres de leur communauté
  rationale: La formulation indique que d'autres délégués étaient issus du groupe local. « Membres de leur communauté » explicite sobrement la valeur représentative de ἐξ αὐτῶν sans préciser leur fonction.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: les apôtres et les anciens
  rationale: Ces équivalents usuels et reconnus respectent les désignations de responsables dans les Actes.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: pour examiner cette question
  rationale: La préposition περί marque le sujet au sujet duquel ils doivent consulter les responsables. « Cette question » rend ζήτημα comme objet de controverse; « examiner » explicite naturellement le but de la démarche, sans trancher le fond.
theological_decisions:
- issue: Identification des parties au conflit
  choice: Paul et Barnabas sont opposés à « ces hommes », c'est-à-dire aux hommes venus de Judée mentionnés au verset précédent.
  alternative: « Paul et Barnabas eurent avec eux un conflit et un débat assez vifs. »
  rationale: Cette lecture suit le référent narratif immédiat de αὐτούς et présente les parties sans ajouter de conclusion doctrinale.
- issue: Portée institutionnelle de ἔταξαν
  choice: « On décida » décrit une décision organisée tout en laissant le sujet collectif indéterminé.
  alternative: « Ils désignèrent » ou « ils chargèrent ».
  rationale: Le grec ne nomme pas ici explicitement l'instance décisionnaire. La formulation retenue évite de déduire du verset un modèle précis d'organisation ecclésiale.
- issue: Objet du déplacement à Jérusalem
  choice: La délégation se rend auprès des apôtres et des anciens pour examiner la question controversée.
  alternative: « au sujet de cette affaire », formulation qui indique seulement le thème du déplacement.
  rationale: La traduction rend la démarche consultative suggérée par le contexte, sans attribuer par anticipation une autorité doctrinale ou institutionnelle définie au-delà du récit.
translation_notes:
  register: Français international moderne, fluide et digne. La litote grecque est rendue idiomatiquement par « assez vifs », et les notes conservent sa forme littérale. Le texte évite le pronom ambigu « eux » en rétablissant son référent contextuel. Le vocabulaire ecclésial traditionnel « apôtres et anciens » est maintenu sans surinterprétation institutionnelle.
