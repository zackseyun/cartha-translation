id: ACT.15.6
reference: Acts 15:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: fr
  text: Les apôtres et les anciens se réunirent[a] donc pour examiner cette question[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se rassemblèrent ». Le verbe grec est formellement au passif (« furent rassemblés »), mais il peut naturellement signifier ici que le groupe se réunit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour voir au sujet de cette parole ». Ici, « parole » désigne la question ou l’affaire en discussion.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: se réunirent
  rationale: L’aoriste passif de συνάγω peut, dans ce contexte, exprimer naturellement le fait de se rassembler. « Se réunirent » rend clairement la convocation collective sans imposer en français un passif lourd.
- source_word: τε
  choice: donc
  rationale: La particule relie légèrement cette phrase au différend relaté au verset précédent. Placé après le sujet, « donc » marque cette progression narrative sans lui donner une force excessive.
- source_word: ἀπόστολοι
  choice: apôtres
  rationale: Dans les Actes, le terme désigne les responsables apostoliques reconnus ; « apôtres » est le terme français établi et précis.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Le mot désigne ici des responsables reconnus de la communauté, et non simplement des hommes âgés. « Anciens » conserve ce sens sans projeter une structure ecclésiastique ultérieure.
- source_word: ἰδεῖν
  choice: examiner
  rationale: 'Littéralement « voir », l’infinitif a ici un sens délibératif : prendre la question en considération. « Examiner » exprime cette démarche sans annoncer d’avance une décision.'
- source_word: περὶ τοῦ λόγου τούτου
  choice: cette question
  rationale: Dans ce contexte, λόγος désigne le sujet controversé dont il vient d’être question. « Cette question » est naturel en français et conserve la référence au débat en cours.
theological_decisions:
- issue: Portée institutionnelle de πρεσβύτεροι lors de la réunion à Jérusalem
  choice: « anciens », au sens de responsables reconnus de la communauté
  alternative: « presbytres », compris comme le titre technique d’une fonction ecclésiastique ultérieure
  rationale: Le verset identifie des dirigeants de l’Église de Jérusalem, mais ne précise pas à lui seul une organisation confessionnelle développée. « Anciens » préserve la donnée historique et lexicale sans surinterprétation.
- issue: But délibératif de la réunion
  choice: « pour examiner cette question »
  alternative: « pour trancher cette question »
  rationale: ἰδεῖν présente ici la prise en considération du sujet. « Examiner » laisse ouverte l’issue de la délibération à ce stade du récit et n’anticipe pas le verdict.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste concise et évite tout vocabulaire confessionnel spécialisé.
