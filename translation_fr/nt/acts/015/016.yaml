id: ACT.15.16
reference: Acts 15:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: fr
  text: Après cela, je reviendrai et je rebâtirai la tente[a] de David, qui est tombée ; je rebâtirai ses ruines et je la relèverai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tabernacle ». Le mot grec peut désigner une tente ou un tabernacle.
    reason: lexical_alternative
  - marker: b
    text: « La tente de David » est une image prophétique de la restauration liée à la lignée ou au royaume de David.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Cette formulation française naturelle exprime la transition temporelle du grec. Le plus littéral « Après ces choses » serait lourd en français moderne.
- source_word: ἀναστρέψω
  choice: je reviendrai
  rationale: Dans ce contexte, le verbe annonce un retour. « Je reviendrai » conserve la promesse divine à la première personne.
- source_word: ἀνοικοδομήσω
  choice: je rebâtirai
  rationale: Le verbe désigne l’action de bâtir de nouveau. « Rebâtir » convient naturellement à l’image d’une tente tombée et préserve la répétition grecque.
- source_word: σκηνὴν Δαυὶδ
  choice: la tente de David
  rationale: σκηνή désigne une tente ou un tabernacle. « Tente » garde la métaphore concrète sans l’interpréter directement comme la dynastie ou le royaume de David.
- source_word: τὴν πεπτωκυῖαν
  choice: qui est tombée
  rationale: Le participe parfait décrit l’état présent résultant de la chute. Cette relative est claire et naturelle en français.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: ses ruines
  rationale: Le participe substantivé au pluriel désigne les éléments démolis. « Ses ruines » en rend naturellement le sens collectif.
- source_word: ἀνορθώσω
  choice: je la relèverai
  rationale: Le verbe signifie remettre droit, relever ou restaurer. « Relever » maintient l’image physique de la tente tombée tout en permettant sa portée métaphorique.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom renvoie à σκηνή, rendu par le nom féminin « tente » en français.
theological_decisions:
- issue: Portée métaphorique de « la tente de David »
  choice: Conserver la métaphore sans l’expliciter dans le corps du texte.
  alternative: Traduire par « la maison de David », « la dynastie de David » ou « le royaume de David ».
  rationale: Le passage évoque vraisemblablement la restauration liée à la lignée ou au règne de David, mais le grec maintient l’image de la tente. La traduction préserve donc cette image et son ouverture interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Après cela » évite le calque peu naturel « Après ces choses » ; « rebâtirai » et « relèverai » conservent l’imagerie concrète et le parallélisme de la citation.
