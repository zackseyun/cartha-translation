  yaml_path: translation/nt/acts/015/037.yaml
  text: But Barnabas wanted to take along also John[a], who was called Mark.
translation:
  language: fr
  text: Mais Barnabé voulait emmener aussi Jean, appelé Marc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βαρναβᾶς
  choice: Barnabé
  rationale: Forme française traditionnelle et courante du nom propre grec.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste entre la proposition de Paul dans le contexte précédent et le souhait particulier de Barnabé.
- source_word: ἐβούλετο
  choice: voulait
  rationale: L’imparfait grec exprime le souhait ou l’intention de Barnabé dans le déroulement du récit; « voulait » est naturel et n’en précise pas excessivement la nuance.
- source_word: συμπαραλαβεῖν
  choice: emmener
  rationale: Le verbe composé désigne le fait de prendre quelqu’un avec soi; « emmener » rend cette idée avec naturel en français.
- source_word: καὶ
  choice: aussi
  rationale: L’adverbe conserve la valeur additive et la mise en relief de Jean comme personne que Barnabé voulait joindre au groupe.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: τὸν καλούμενον Μᾶρκον
  choice: appelé Marc
  rationale: La tournure participiale identifie Jean par l’autre nom sous lequel il était connu, sans ajouter une nuance absente du grec.
- source_word: Μᾶρκον
  choice: Marc
  rationale: Forme française traditionnelle et courante du nom propre.
