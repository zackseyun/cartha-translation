id: ACT.15.17
reference: Acts 15:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: fr
  text: afin que le reste des humains recherche le Seigneur, et tous les non-Juifs[a] sur lesquels mon nom a été invoqué[b], dit le Seigneur[c], lui qui fait ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les nations ». Le grec ἔθνη peut désigner soit les nations, soit les non-Juifs; le contexte d’Actes 15 concerne l’accueil des non-Juifs.
    reason: alternative_reading
  - marker: b
    text: 'On pourrait aussi traduire : « qui portent mon nom ». Littéralement, le grec dit : « sur lesquels mon nom a été invoqué ».'
    reason: lexical_alternative
  - marker: c
    text: Cette déclaration reprend Amos 9.12 selon une forme attestée dans les Écritures grecques, où l’accent porte sur les nations ou les non-Juifs associés au nom du Seigneur.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: afin que
  rationale: Cette locution introduit ici le but ou le résultat attendu et appelle naturellement le subjonctif en français.
- source_word: ἐκζητήσωσιν
  choice: recherche
  rationale: Le verbe exprime une recherche active. « Recherche » reste naturel sans accentuer excessivement la valeur intensive possible du préverbe.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: le reste des humains
  rationale: κατάλοιποι désigne ceux qui restent. « Des humains » rend la portée générique de ἀνθρώπων sans donner au terme un sens exclusivement masculin.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Rend κύριος conformément à l’usage français courant dans une citation scripturaire.
- source_word: πάντα τὰ ἔθνη
  choice: tous les non-Juifs
  rationale: ἔθνη peut désigner les nations ou, par contraste avec Israël, les non-Juifs. Le débat d’Actes 15 porte précisément sur l’accueil des non-Juifs; l’autre sens est signalé en note.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: sur lesquels mon nom a été invoqué
  rationale: Cette formulation conserve l’image et la construction passive du grec, qui expriment l’identification et l’appartenance associées au nom divin.
- source_word: λέγει κύριος
  choice: dit le Seigneur
  rationale: Formule prophétique traditionnelle, claire et naturelle en français.
- source_word: ποιῶν ταῦτα
  choice: lui qui fait ces choses
  rationale: Le participe présent qualifie le Seigneur et souligne son action. « Lui qui » clarifie le rattachement tout en restant proche du grec.
theological_decisions:
- issue: Sens de ἔθνη dans le contexte de l’intégration des non-Juifs
  choice: tous les non-Juifs
  alternative: toutes les nations
  rationale: Le contexte immédiat du concile de Jérusalem favorise le sens socioreligieux « non-Juifs ». La portée plus générale « nations », également possible dans l’arrière-plan prophétique, est conservée en note.
- issue: Portée de la formule du nom divin
  choice: sur lesquels mon nom a été invoqué
  alternative: qui portent mon nom
  rationale: La traduction principale préserve l’expression grecque et sa tension entre invocation, désignation et appartenance, sans la réduire à une seule interprétation.
- issue: Langage humain générique
  choice: le reste des humains
  alternative: le reste de l’humanité
  rationale: Le grec ἀνθρώπων a ici une portée générique. La formulation choisie est inclusive sans effacer l’idée de personnes qui subsistent comme « reste ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la cadence d’une citation prophétique. « Non-Juifs » est plus immédiatement compréhensible que « païens » et évite les connotations péjoratives modernes; les ambiguïtés de ἔθνη et de l’expression relative au nom divin sont maintenues par les notes.
