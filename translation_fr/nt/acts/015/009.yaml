  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: fr
  text: Et il n’a fait aucune distinction entre nous et eux, ayant purifié leur cœur par la foi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de la foi ». Le datif grec peut exprimer le moyen ou l’instrument.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: n’a fait aucune distinction
  rationale: Cette tournure française naturelle restitue l’expression idiomatique grecque et l’idée que Dieu n’a établi aucune différence entre les deux groupes.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: entre nous et eux
  rationale: Rend directement la relation entre les deux groupes; la corrélation τε…καί n’exige pas de formulation plus lourde en français.
- source_word: τῇ πίστει
  choice: par la foi
  rationale: Le datif a ici vraisemblablement une valeur instrumentale ou médiatrice. « Par la foi » est concis, naturel et conserve la portée théologique de πίστις sans la surinterpréter.
- source_word: καθαρίσας
  choice: il a purifié
  rationale: La coordination française explicite naturellement l’action participiale liée au verbe principal. Le deux-points conserve son rôle explicatif ou concomitant sans imposer une chronologie trop précise.
- source_word: τὰς καρδίας αὐτῶν
  choice: leur cœur
  rationale: Le singulier collectif est idiomatique en français pour désigner le cœur de chacun; « cœur » conserve le langage biblique de l’être intérieur.
theological_decisions:
- issue: Sens de πίστις
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: Dans cette construction, πίστις désigne le plus naturellement la foi comme moyen par lequel Dieu purifie. Rien dans le contexte immédiat n’impose « fidélité ».
- issue: Rapport entre καθαρίσας et le verbe principal
  choice: relation explicative exprimée par deux propositions
  alternative: « ayant purifié leur cœur »
  rationale: Le participe aoriste peut évoquer une action antérieure ou étroitement associée. La formulation avec deux-points reste naturelle et évite de fixer plus précisément que le grec le rapport temporel.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste « nous/eux », le vocabulaire biblique du cœur et l’ambiguïté relative du rapport entre les deux actions.
