base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: fr
  text: Nous avons donc envoyé Judas[a] et Silas, qui annonceront eux-mêmes les mêmes choses de vive voix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Ioudas », nom également rendu par « Jude » dans certaines traditions françaises.'
