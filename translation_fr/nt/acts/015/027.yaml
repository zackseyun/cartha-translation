lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: nous avons envoyé
  rationale: Le passé composé français rend naturellement le parfait grec et conserve ici la pertinence présente de l’envoi.
- source_word: οὖν
  choice: donc
  rationale: « Donc » exprime clairement la conséquence logique tout en restant naturel dans une lettre.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: Jude et Silas
  rationale: Ces formes suivent l’usage biblique français courant; « Jude » permet notamment de distinguer ce personnage de Judas Iscariote.
- source_word: αὐτοὺς
  choice: eux-mêmes
  rationale: La forme emphatique souligne que les deux envoyés confirmeront personnellement le contenu communiqué.
- source_word: διὰ λόγου
  choice: de vive voix
  rationale: Cette expression française idiomatique rend le moyen oral et le contraste implicite avec la lettre.
- source_word: ἀπαγγέλλοντας
  choice: qui annonceront
  rationale: Le participe présent grec décrit ce que feront les envoyés; une proposition relative au futur est claire et naturelle en français.
- source_word: τὰ αὐτά
  choice: les mêmes choses
  rationale: La formulation directe conserve le renvoi assez général du grec sans le réduire explicitement au contenu de la lettre.
