id: ACT.15.12
reference: Acts 15:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: fr
  text: Alors toute l’assemblée se tut et écouta Barnabas et Paul raconter tous les signes et prodiges que Dieu avait accomplis par leur intermédiaire parmi les non-Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les nations ». Dans ce contexte, il s’agit des peuples non juifs.
    reason: Alternative lexicale de ἔθνεσιν, dont le sens premier est « nations » mais qui désigne ici les non-Juifs.
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: se tut
  rationale: L’aoriste présente l’entrée dans le silence comme un événement. « Se tut » est naturel et conserve cette valeur dynamique.
- source_word: πᾶν τὸ πλῆθος
  choice: toute l’assemblée
  rationale: Dans le cadre délibératif de la réunion à Jérusalem, « assemblée » désigne naturellement l’ensemble des personnes réunies.
- source_word: ἤκουον
  choice: écouta
  rationale: Le verbe exprime ici une écoute attentive et prolongée. Le passé simple convient au récit français, le contexte faisant sentir la durée.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: Barnabas et Paul
  rationale: Formes françaises usuelles des noms propres bibliques.
- source_word: ἐξηγουμένων
  choice: raconter
  rationale: Le participe désigne l’action de faire un récit détaillé; « raconter » évite de suggérer une simple explication interprétative.
- source_word: ὅσα ... σημεῖα καὶ τέρατα
  choice: tous les signes et prodiges que
  rationale: Cette formulation française rend naturellement ὅσα en lien avec les deux noms coordonnés, sans ajouter une catégorie plus large d’actes.
- source_word: ἐποίησεν ὁ θεὸς
  choice: Dieu avait accomplis
  rationale: Le plus-que-parfait situe les actes divins avant le récit qu’en font Barnabas et Paul; « accomplir » convient au registre tout en gardant Dieu comme sujet.
- source_word: σημεῖα καὶ τέρατα
  choice: signes et prodiges
  rationale: Expression biblique française établie qui conserve les deux termes grecs sans ajouter explicitement « miraculeux ».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les non-Juifs
  rationale: Dans le contexte du conseil de Jérusalem, ἔθνη désigne les personnes qui ne sont pas juives. « Non-Juifs » est immédiatement compréhensible en français moderne; la valeur littérale « nations » est signalée en note.
- source_word: δι’ αὐτῶν
  choice: par leur intermédiaire
  rationale: 'διά avec le génitif marque l’instrumentalité: Dieu est l’auteur principal des actes, Barnabas et Paul étant ceux par qui il agit.'
theological_decisions:
- issue: L’action divine dans la mission apostolique
  choice: Dieu est le sujet qui accomplit les signes et les prodiges par l’intermédiaire de Barnabas et Paul.
  alternative: Présenter Barnabas et Paul comme les auteurs principaux des signes et des prodiges.
  rationale: La syntaxe grecque fait de ὁ θεός le sujet de ἐποίησεν et de δι’ αὐτῶν l’expression du moyen ou de l’intermédiaire.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. « Non-Juifs » privilégie la compréhension immédiate, tandis que la note conserve l’alternative lexicale « nations ».
