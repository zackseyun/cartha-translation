id: ACT.15.5
reference: Acts 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: fr
  text: 'Mais certains de ceux du parti des pharisiens[a] qui avaient cru se levèrent et dirent : « Il faut les circoncire et leur ordonner d’observer la loi de Moïse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du courant des pharisiens » ou « de la secte des pharisiens ». Le mot grec désigne ici un groupe ou une école reconnus, sans avoir nécessairement le sens péjoratif ou doctrinal que « secte » peut avoir aujourd’hui.
    reason: Préciser la valeur contextuelle de αἵρεσις et éviter d’importer le sens ultérieur d’« hérésie ».
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: se levèrent
  rationale: L’aoriste décrit le fait de se lever dans l’assemblée, vraisemblablement pour prendre la parole, sans qu’il soit nécessaire d’expliciter davantage cette intention.
- source_word: τινες
  choice: certains
  rationale: Le pronom indéfini pluriel ne précise pas le sexe des personnes concernées ; « certains » reste naturel et n’ajoute pas « hommes » au texte.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: de ceux du parti des pharisiens
  rationale: Ici, αἵρεσις désigne un groupe ou courant reconnu au sein du judaïsme. « Parti » évite le sens péjoratif ou doctrinal que « secte » peut avoir aujourd’hui.
- source_word: πεπιστευκότες
  choice: qui avaient cru
  rationale: 'Cette formulation verbale rend le participe parfait : ces personnes étaient parvenues à la foi et demeuraient dans cet état. Elle conserve aussi la tension du récit sans la résoudre.'
- source_word: λέγοντες
  choice: et dirent
  rationale: La coordination française rend naturellement le participe qui introduit leurs paroles, sans lui attribuer un ton plus insistant que celui du grec.
- source_word: δεῖ
  choice: Il faut
  rationale: Cette tournure impersonnelle exprime directement la nécessité affirmée tout en laissant implicite, comme en grec, le fondement de cette nécessité.
- source_word: περιτέμνειν αὐτούς
  choice: les circoncire
  rationale: L’infinitif actif et son complément sont rendus directement, sans transformation passive inutile.
- source_word: παραγγέλλειν
  choice: leur ordonner
  rationale: Le verbe exprime une prescription faisant autorité ; « ordonner » en conserve la force mieux que « conseiller » ou « enseigner ».
- source_word: τε τηρεῖν
  choice: d’observer
  rationale: Dans le contexte d’une loi, τηρέω signifie en respecter les prescriptions. « Observer » est idiomatique et précis en français contemporain.
- source_word: τὸν νόμον Μωϋσέως
  choice: la loi de Moïse
  rationale: Cette formulation rend directement le génitif grec et demeure claire et traditionnelle sans devenir technique.
theological_decisions:
- issue: Sens de αἵρεσις dans le contexte d’un groupe juif
  choice: parti
  alternative: secte
  rationale: Le mot désigne ici un groupe ou courant identifiable, non une hérésie au sens ecclésiastique ultérieur. « Parti » limite le risque d’une connotation anachronique, tandis que « secte » reste une possibilité lexicale signalée en note.
- issue: Portée de πεπιστευκότες
  choice: qui avaient cru
  alternative: qui étaient devenus croyants
  rationale: Le rendu verbal respecte le parfait grec et présente explicitement ces membres du parti pharisien comme ayant cru, tout en conservant la tension entre leur foi et leur exigence concernant la circoncision et la loi.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve la force présente de δεῖ (« Il faut »). La syntaxe reste proche du grec tout en étant immédiatement compréhensible.
