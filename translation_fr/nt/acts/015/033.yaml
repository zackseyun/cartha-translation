revisions:
- from: Après avoir passé quelque temps là-bas, ils furent laissés partir en paix par les frères[a] pour retourner auprès de ceux qui les avaient envoyés.
  to: Après quelque temps, les frères[a] les laissèrent repartir en paix vers ceux qui les avaient envoyés.
  rationale: La révision supprime les compléments contextuels non exprimés (« là-bas », « retourner ») et emploie une formulation française plus fluide. « Les laissèrent repartir en paix vers » conserve le congé paisible exprimé par ἀπελύθησαν μετ’ εἰρήνης et la destination πρὸς, sans imposer une nuance supplémentaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:14:42Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « pour retourner » introduit une nuance finale et de retour qui n’est pas exprimée par πρὸς (« vers/auprès de »), même si le contexte rend un retour vraisemblable. « Là-bas » est également une précision contextuelle non nécessaire.
  naturalness: « Ils furent laissés partir en paix par les frères pour retourner auprès de… » est compréhensible, mais sa construction passive suivie de « pour retourner » est lourde en français moderne. Une formulation active est plus naturelle tout en conservant le sens.
  terminology: « Frères » rend correctement ἀδελφῶν; la note sur l’emploi possiblement inclusif est appropriée. « Laissèrent repartir » exprime naturellement le congé bienveillant de ἀπελύθησαν dans ce contexte.
  issues:
  - severity: medium
    issue: Ajout de « pour retourner »
    rationale: Le grec dit qu’ils furent envoyés/libérés « vers ceux qui les avaient envoyés », non qu’ils partirent dans le but de retourner. Le retour est contextuellement plausible, mais il ne doit pas être ajouté au texte principal.
  - severity: low
    issue: Ajout de « là-bas »
    rationale: Le lieu du séjour est fourni par le contexte mais n’est pas explicite dans le verset; « quelque temps » suffit en français et demeure plus proche du texte.
  - severity: low
    issue: Construction française pesante
    rationale: La voix passive avec « pour retourner » est moins idiomatique. La voix active avec les frères comme agent rend clairement la même relation.
  revised_text: Après quelque temps, les frères[a] les laissèrent repartir en paix vers ceux qui les avaient envoyés.
  revised_footnotes:
  - marker: a
    text: 'Ou « les frères et sœurs » : le grec dit « les frères », mais le terme désigne probablement ici l’ensemble de la communauté croyante.'
    reason: lexical_alternative
  revision_rationale: La révision supprime les compléments contextuels non exprimés (« là-bas », « retourner ») et emploie une formulation française plus fluide. « Les laissèrent repartir en paix vers » conserve le congé paisible exprimé par ἀπελύθησαν μετ’ εἰρήνης et la destination πρὸς, sans imposer une nuance supplémentaire.
