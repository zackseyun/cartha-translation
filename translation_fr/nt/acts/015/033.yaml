  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: fr
  text: Après quelque temps, les frères[a] les laissèrent repartir en paix vers ceux qui les avaient envoyés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les frères et sœurs » : le grec dit « les frères », mais le terme désigne probablement ici l’ensemble de la communauté croyante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: Après avoir passé quelque temps là-bas
  rationale: L’expression grecque signifie idiomatiquement qu’ils séjournèrent pendant un certain temps. « Là-bas » est ajouté naturellement d’après le contexte, sans être explicite dans le grec.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici une légère progression narrative; en français, l’enchaînement est naturel sans conjonction explicite.
- source_word: ἀπελύθησαν
  choice: ils furent laissés partir
  rationale: Dans ce contexte, le verbe décrit un congé accordé avec bienveillance, plutôt qu’une libération après détention ou un renvoi autoritaire.
- source_word: μετ’ εἰρήνης
  choice: en paix
  rationale: Cette expression conventionnelle évoque un départ paisible, accompagné de la bienveillance de la communauté.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: par les frères
  rationale: Le grec emploie le masculin pluriel « frères », probablement au sens inclusif de la communauté croyante; la forme du texte source est conservée et la portée inclusive signalée en note.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: pour retourner auprès de ceux qui les avaient envoyés
  rationale: Le participe substantivé désigne ceux qui les avaient mandatés. « Retourner » explicite en français le mouvement de retour impliqué par le contexte et par la destination indiquée.
theological_decisions:
- issue: Portée inclusive de ἀδελφοί
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le masculin grammatical du grec est maintenu dans le texte, tandis que la note indique qu’il désigne vraisemblablement ici toute la communauté croyante.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure passive et l’expression « en paix » préservent la structure et la tonalité du grec, tandis que « laissés partir » évite les connotations pénales de « libérés ».
