  terminology: « Mettre Dieu à l’épreuve », « joug », « disciples » et « porter » sont exacts et de registre approprié. La note culturelle doit éviter d’ajouter que « certains veulent » imposer les exigences, détail qui dépasse la formulation du verset et n’est pas nécessaire à l’explication de l’image.
