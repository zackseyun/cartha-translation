id: ACT.15.10
reference: Acts 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: fr
  text: Alors maintenant, pourquoi mettez-vous Dieu à l’épreuve[a] en plaçant sur la nuque des disciples un joug[b] que ni nos ancêtres[c] ni nous n’avons été capables de porter ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pourquoi éprouvez-vous Dieu » ou « pourquoi tentez-vous Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: Le « joug » est une image d’une obligation imposée ; dans le contexte, il désigne des exigences imposées aux disciples.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Maintenant donc
  rationale: Conserve à la fois la transition temporelle et la valeur déductive de l’expression grecque, dans un français soutenu mais courant.
- source_word: τί πειράζετε τὸν θεόν
  choice: pourquoi mettez-vous Dieu à l’épreuve
  rationale: Dans cette question rhétorique, τί a le sens de « pourquoi »; « mettre à l’épreuve » rend naturellement l’idée de πειράζω appliqué à Dieu.
- source_word: ἐπιθεῖναι
  choice: en plaçant
  rationale: L’infinitif précise ici en quoi consiste la mise à l’épreuve; le gérondif exprime clairement ce rapport en français.
- source_word: ζυγὸν
  choice: un joug
  rationale: Préserve l’image concrète d’une obligation imposée au lieu de la remplacer par son interprétation.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: sur le cou des disciples
  rationale: Rendu direct et naturel qui conserve l’image vive du texte grec.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: ni nos ancêtres ni nous
  rationale: Dans ce contexte historique, πατέρες désigne les générations antérieures; « ancêtres » est plus immédiatement clair en français moderne que « pères ».
- source_word: ἰσχύσαμεν βαστάσαι
  choice: n’avons été capables de porter
  rationale: Exprime la capacité indiquée par ἰσχύω et conserve, avec « porter », la métaphore du joug.
theological_decisions:
- issue: Nature du « joug »
  choice: Maintien de la métaphore sans définir dans le texte principal l’étendue exacte des obligations visées.
  alternative: Identifier explicitement le joug à toute la loi de Moïse, ou plus étroitement à la circoncision et aux prescriptions connexes.
  rationale: Le contexte concerne les exigences imposées aux disciples, particulièrement aux non-Juifs, mais le verset lui-même emploie une image sans en préciser ici toute l’étendue. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La structure rhétorique et la métaphore du joug sont conservées; « ancêtres » évite l’ambiguïté moderne de « pères », tout en signalant le rendu littéral en note.
