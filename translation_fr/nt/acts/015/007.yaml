  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: fr
  text: 'Après de nombreuses discussions, Pierre se leva et leur dit : « Frères[a], vous savez que, dès les premiers temps[b], Dieu m’a choisi parmi vous pour que, par ma bouche, les non-Juifs[c] entendent la parole de l’Évangile et croient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Hommes, frères ». Cette interpellation grecque est au masculin pluriel ; c’est une formule conventionnelle qui peut représenter une assemblée plus large.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « depuis des jours anciens ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les nations » ; ici, les peuples non juifs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς δὲ ζητήσεως γενομένης
  choice: Après un long débat
  rationale: Le génitif absolu indique une circonstance antérieure. « Débat » rend la délibération controversée du contexte sans nécessairement suggérer une querelle hostile.
- source_word: ἀναστὰς
  choice: se leva
  rationale: Cette formulation naturelle garde l’action concrète qui précède la prise de parole de Pierre.
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: « Frères » conserve la forme masculine et la tonalité familiale de l’interpellation conventionnelle, sans ajouter explicitement « et sœurs » au texte grec.
- source_word: ἐπίστασθε
  choice: vous savez
  rationale: Le verbe désigne un savoir déjà partagé par les auditeurs ; « vous savez » est direct et naturel.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: dès les premiers temps
  rationale: Dans ce contexte, l’expression renvoie à une période antérieure des débuts de la mission plutôt qu’à l’Antiquité au sens moderne. La note conserve l’image plus littérale des jours anciens.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: Dieu m’a choisi parmi vous
  rationale: Le complément « m’ » est implicité par « ma bouche » dans la suite. Cette formulation française naturelle conserve l’idée que le choix de Dieu s’est porté sur Pierre au sein du groupe.
- source_word: διὰ τοῦ στόματός μου
  choice: par ma bouche
  rationale: La traduction garde la métaphore grecque et présente Pierre comme l’instrument par lequel le message est proclamé.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans le débat d’Actes 15, le terme désigne les peuples autres que le peuple juif. « Non-Juifs » communique clairement ce référent en français actuel, tandis que le sens plus littéral est signalé en note.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: la parole de l’Évangile
  rationale: Cette expression maintient les deux éléments du grec et la texture théologique de la formulation lucanienne tout en restant compréhensible.
- source_word: πιστεῦσαι
  choice: croient
  rationale: Le verbe est coordonné à « entendent » et se traduit directement, sans développer l’expression en une formulation théologique plus interprétative.
theological_decisions:
- issue: Portée de l’interpellation masculine Ἄνδρες ἀδελφοί
  choice: Frères
  alternative: Hommes, frères ; frères et sœurs
  rationale: Le texte principal préserve le masculin pluriel et le langage familial du grec. Une note indique qu’il s’agit d’une formule conventionnelle pouvant représenter une assemblée plus large, sans imposer au texte une expansion inclusive.
- issue: Sens de τὰ ἔθνη dans le contexte du salut des peuples
  choice: les non-Juifs
  alternative: les nations ; les païens ; les Gentils
  rationale: Le contexte immédiat oppose les croyants juifs aux croyants issus des autres peuples. « Non-Juifs » rend ce contraste sans les connotations négatives possibles de « païens » ni le caractère spécialisé de « Gentils ».
- issue: Objet implicite du choix divin dans ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: Dieu m’a choisi parmi vous
  alternative: 'Dieu a fait parmi vous ce choix : que, par ma bouche…'
  rationale: Le grec n’exprime pas séparément le pronom objet, mais « par ma bouche » identifie Pierre comme celui que Dieu a choisi. L’ajout grammatical de « m’ » rend la phrase idiomatique sans modifier son référent, tout en reconnaissant l’autre construction possible.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la métaphore « par ma bouche » et la formulation « parole de l’Évangile », tout en employant « non-Juifs » pour assurer une compréhension immédiate. Les notes rendent visibles le masculin de l’interpellation, la nuance temporelle et le sens littéral de ἔθνη.
