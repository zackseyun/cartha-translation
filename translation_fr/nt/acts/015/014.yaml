id: ACT.15.14
reference: Acts 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: fr
  text: Siméon[a] a raconté comment Dieu a d’abord porté son attention sur les non-Juifs[b], afin de prendre parmi eux un peuple qui porte son nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Simon ». Jacques emploie ici la forme « Siméon ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « d’entre les nations ». Dans ce contexte, il s’agit des peuples non juifs.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire un peuple qui lui appartient et qui est identifié à son nom.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: Siméon
  rationale: Conserve la forme distincte employée ici par Jacques, sans l’harmoniser avec la forme plus courante « Simon ».
- source_word: ἐξηγήσατο
  choice: a raconté
  rationale: Le verbe désigne l’exposé d’un récit ou d’un compte rendu; « a raconté » convient naturellement au rappel de l’intervention précédente de Siméon.
- source_word: καθὼς
  choice: comment
  rationale: Après un verbe de narration, le terme introduit naturellement le contenu et la manière de l’action rapportée.
- source_word: πρῶτον
  choice: pour la première fois
  rationale: Cette formulation française indique clairement le commencement de l’action de Dieu envers les non-Juifs, sans suggérer ici une simple priorité dans une liste.
- source_word: ἐπεσκέψατο
  choice: s’est tourné vers
  rationale: Dans ce contexte, le verbe exprime une attention divine active et bienveillante. La traduction évite le français potentiellement trompeur « a visité », tout en conservant l’idée d’une intervention intentionnelle.
- source_word: λαβεῖν
  choice: afin de prendre
  rationale: L’infinitif exprime le but de l’action divine; « prendre » reste proche du sens direct sans ajouter l’idée interprétative de rassemblement.
- source_word: ἐξ ἐθνῶν
  choice: parmi les non-Juifs
  rationale: Dans le contexte d’Actes 15, ἔθνη désigne les personnes qui ne sont pas juives. « Parmi » rend explicitement la valeur de ἐξ et évite de suggérer que tous les non-Juifs sont pris indistinctement.
- source_word: λαὸν
  choice: un peuple
  rationale: « Un peuple » conserve la portée collective et l’écho biblique du terme sans le réduire à une ethnie.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: qui porte son nom
  rationale: Cette expression française naturelle préserve le lien explicite avec le nom de Dieu et évoque un peuple qui lui appartient et est identifié à lui.
theological_decisions:
- issue: Traduction de ἐξ ἐθνῶν par « non-Juifs » ou « nations »
  choice: non-Juifs
  alternative: nations
  rationale: Le débat immédiat d’Actes 15 porte sur l’intégration à la communauté croyante de personnes qui ne sont pas juives. « Non-Juifs » rend ce contraste clairement en français moderne.
- issue: Sens de τῷ ὀνόματι αὐτοῦ
  choice: qui porte son nom
  alternative: pour son nom
  rationale: « Qui porte son nom » garde l’image biblique du nom et exprime idiomatiquement l’appartenance et l’identification, sans réduire la formule au simple « pour lui-même ».
- issue: Nuance de l’action divine exprimée par ἐπεσκέψατο
  choice: s’est tourné vers
  alternative: a visité
  rationale: Le choix retenu communique l’attention et l’intervention bienveillantes de Dieu sans imposer une formulation confessionnelle ni laisser entendre une simple visite passagère.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la structure grecque tout en évitant des calques peu idiomatiques. « Non-Juifs » rend le contraste contextuel plus immédiatement compréhensible que le terme parfois technique « païens ».
