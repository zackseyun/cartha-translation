id: ACT.15.4
reference: Acts 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: fr
  text: À leur arrivée à Jérusalem, ils furent accueillis par l’Église, les apôtres et les anciens, puis ils rapportèrent tout ce que Dieu avait fait avec eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leur intermédiaire » ou « parmi eux ». Le grec dit littéralement « avec eux ».
    reason: La préposition grecque peut, dans ce contexte, évoquer l’action de Dieu par leur intermédiaire ou parmi les personnes concernées, mais sa formulation littérale reste « avec eux ».
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: À leur arrivée à Jérusalem
  rationale: Le participe aoriste situe l’arrivée avant les verbes principaux. Cette tournure française naturelle conserve sa valeur temporelle, tandis que la faible articulation marquée par δέ reste implicite.
- source_word: παρεδέχθησαν
  choice: ils furent accueillis
  rationale: Le passif exprime ici l’accueil réservé aux arrivants. « Accueillis » est plus naturel en français moderne que « reçus » et rend bien la dimension hospitalière du verbe.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: par l’Église, les apôtres et les anciens
  rationale: Avec le passif, ἀπό désigne ici les personnes qui accueillent. « Église » renvoie à la communauté chrétienne de Jérusalem, et « anciens » au groupe de responsables reconnus.
- source_word: ἀνήγγειλάν τε
  choice: puis ils rapportèrent
  rationale: Le verbe signifie communiquer ou relater des faits. « Rapportèrent » convient à ce compte rendu, et « puis » rend l’enchaînement exprimé par τε sans alourdir la phrase.
- source_word: ὅσα ὁ θεὸς ἐποίησεν
  choice: tout ce que Dieu avait fait
  rationale: « Tout ce que » restitue la portée de ὅσα. Le plus-que-parfait français situe naturellement les actes de Dieu avant le compte rendu.
- source_word: μετ’ αὐτῶν
  choice: avec eux
  rationale: μετά avec le génitif signifie normalement « avec ». Cette traduction conserve l’expression ouverte du grec sans la réduire à l’idée d’instrument (« par leur intermédiaire ») ni de lieu ou de milieu (« parmi eux »).
theological_decisions:
- issue: Le rapport entre l’action de Dieu et les missionnaires dans μετ’ αὐτῶν
  choice: Dieu avait fait avec eux
  alternative: Dieu avait fait par leur intermédiaire / parmi eux
  rationale: « Avec eux » maintient Dieu comme acteur principal tout en associant Paul et Barnabas à son œuvre. La formulation préserve l’ambiguïté réelle du grec au lieu de préciser indûment une instrumentalité ou un cadre local.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant les trois groupes qui accueillent les arrivants et l’ouverture théologique de μετ’ αὐτῶν.
