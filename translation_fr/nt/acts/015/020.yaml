id: ACT.15.20
reference: Acts 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: fr
  text: mais de leur écrire de s’abstenir des souillures liées aux idoles[a], de l’immoralité sexuelle[b], de ce qui a été étouffé[c] et du sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des souillures associées aux idoles ». Certaines traductions précisent « des aliments sacrifiés aux idoles », mais le grec employé ici est plus large.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut désigner largement l’immoralité sexuelle ; certains comprennent ici plus précisément des unions sexuelles interdites.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement « de ce qui est étouffé » : il s’agit d’un animal dont le sang n’a pas été correctement évacué.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: écrire
  rationale: Dans le contexte de la décision du conseil de Jérusalem et de la lettre qui la transmet, « écrire » rend naturellement la portée épistolaire du verbe.
- source_word: ἀπέχεσθαι
  choice: s’abstenir de
  rationale: Cette expression française rend clairement l’idée de se tenir volontairement à l’écart de pratiques ou de choses interdites.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: ce qui est souillé par les idoles
  rationale: Cette formulation conserve la notion de souillure cultuelle et le lien avec les idoles, sans limiter explicitement le sens aux seuls aliments qui leur auraient été sacrifiés.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Ce choix moderne et compréhensible préserve l’étendue possible du terme grec sans le réduire d’office aux relations avant le mariage ni à une catégorie particulière d’unions interdites.
- source_word: τοῦ πνικτοῦ
  choice: ce qui a été étouffé
  rationale: La formulation respecte la force substantivée du grec sans ajouter « viande » dans le texte principal; le contexte culturel est précisé en note.
- source_word: τοῦ αἵματος
  choice: sang
  rationale: La traduction concise « du sang » reste proche du grec et n’explicite pas davantage le mode d’abstention que ne le fait le verset.
theological_decisions:
- issue: Étendue de l’interdiction liée aux idoles
  choice: « ce qui est souillé par les idoles »
  alternative: « les aliments sacrifiés aux idoles »
  rationale: Le grec emploie un terme général de souillure, et non le terme plus précis désignant les viandes sacrifiées aux idoles. La traduction maintient cette portée sans exclure l’application alimentaire.
- issue: Sens de πορνεία dans le décret apostolique
  choice: « immoralité sexuelle »
  alternative: « relations sexuelles interdites » ou « inconduite sexuelle »
  rationale: Le terme peut désigner largement l’inconduite sexuelle ou, selon certaines lectures du contexte, des unions particulièrement interdites. Le texte principal ne tranche pas cette question.
- issue: Portée temporelle et normative des abstentions
  choice: Présenter simplement les abstentions énoncées
  alternative: Les qualifier de mesures temporaires de communion à table ou de commandements universels permanents
  rationale: Le verset énonce les interdictions sans préciser ici leur durée ni leur statut théologique complet; la traduction n’ajoute donc aucune conclusion confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement argumentatif du contexte (« mais de leur écrire »). Les termes techniques ou ecclésiastiques vieillis sont évités, tandis que les ambiguïtés lexicales et théologiques du grec sont conservées et signalées en notes.
