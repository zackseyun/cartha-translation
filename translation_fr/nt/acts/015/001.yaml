id: ACT.15.1
reference: Acts 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: fr
  text: 'Quelques hommes descendus de Judée enseignaient aux frères[a] : « Si vous ne vous faites pas circoncire selon la coutume de Moïse, vous ne pouvez pas être sauvés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères » et ce terme désigne probablement ici, de manière inclusive, la communauté croyante.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί τινες
  choice: Quelques hommes
  rationale: Le connecteur Καί peut rester implicite en français au début de cette nouvelle scène; τινες désigne un groupe indéfini de personnes, ici rendu naturellement par « quelques hommes ».
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: descendus de Judée
  rationale: Le participe aoriste indique leur déplacement depuis la Judée; « descendus » conserve l’expression géographique conventionnelle du texte.
- source_word: ἐδίδασκον
  choice: enseignaient
  rationale: L’imparfait grec présente une action en cours ou répétée; l’imparfait français en restitue naturellement l’aspect.
- source_word: τοὺς ἀδελφοὺς
  choice: aux frères
  rationale: « Frères » correspond au masculin pluriel grec; une note signale que le terme peut désigner inclusivement la communauté croyante.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: Si vous ne vous faites pas circoncire
  rationale: Cette formulation française exprime clairement la condition négative et le fait de recevoir la circoncision, sans lourdeur excessive.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: selon la coutume de Moïse
  rationale: ἔθος désigne une coutume ou pratique établie; « selon » rend idiomatiquement le datif de norme.
- source_word: οὐ δύνασθε σωθῆναι
  choice: vous ne pouvez pas être sauvés
  rationale: La tournure restitue directement l’incapacité affirmée et le sens sotériologique de σωθῆναι dans cette controverse.
theological_decisions:
- issue: Sens de σωθῆναι dans la controverse à l’origine du concile de Jérusalem
  choice: être sauvés
  alternative: être délivrés
  rationale: Le contexte porte sur la nécessité prétendue de la circoncision pour le salut. « Être sauvés » conserve cette portée théologique sans préciser davantage la nature ou le mécanisme du salut.
- issue: Portée de ἀδελφοὺς
  choice: frères, avec une note explicative
  alternative: frères et sœurs / croyants
  rationale: Le texte principal conserve la forme masculine du grec, tandis que la note préserve la possibilité très probable d’un emploi inclusif pour l’ensemble de la communauté croyante.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement narratif grec tout en étant naturelle; le discours direct conserve la force absolue de l’affirmation rapportée.
