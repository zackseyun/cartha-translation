id: ACT.15.22
reference: Acts 15:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: fr
  text: 'Alors les apôtres et les anciens, avec toute l’Église, jugèrent bon de choisir parmi eux des hommes et de les envoyer à Antioche avec Paul et Barnabé : Jude, appelé Barsabbas, et Silas, des hommes qui jouaient un rôle dirigeant parmi les frères.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne probablement l’ensemble de la communauté des croyants, femmes comprises.
    reason: cultural_note
lexical_decisions:
- source_word: ἔδοξε
  choice: jugèrent bon
  rationale: Expression française naturelle dans un contexte de délibération collective; elle conserve l’idée d’un jugement favorable sans transformer explicitement celui-ci en décret formel.
- source_word: πρεσβυτέροις
  choice: anciens
  rationale: Terme courant et établi en français biblique pour les responsables désignés par πρεσβύτεροι, sans technicité inutile.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: avec toute l’Église
  rationale: Rend directement l’association de l’ensemble de la communauté à l’action, tout en gardant le terme ecclésial habituel.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: de choisir parmi eux des hommes
  rationale: Reproduit le sens complémentaire du participe avec πέμψαι et précise que les délégués sont issus de leur propre groupe; « hommes » respecte le masculin explicite ἄνδρας.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: de les envoyer à Antioche
  rationale: Formulation idiomatique et claire en français; le pronom reprend naturellement les hommes choisis.
- source_word: καλούμενον
  choice: appelé
  rationale: Rend simplement et fidèlement le participe descriptif sans alourdir la phrase.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: des hommes qui exerçaient un rôle de direction parmi les frères
  rationale: Exprime un leadership reconnu tout en évitant d’en faire nécessairement le titre d’une fonction officielle; la tournure participiale demeure descriptive.
- source_word: ἀδελφοῖς
  choice: frères
  rationale: Conserve le masculin grammatical du grec; une note signale que, dans cet emploi communautaire, le mot peut inclure l’ensemble des croyants.
theological_decisions:
- issue: Étendue de la participation de toute l’Église à la décision
  choice: La formulation associe toute l’Église aux apôtres et aux anciens dans le jugement, le choix et l’envoi.
  alternative: Comprendre que seuls les apôtres et les anciens ont pris formellement la décision, toute l’Église étant seulement présente ou consentante.
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ rattache le plus naturellement toute l’Église au sujet de ἔδοξε et aux actions qui suivent. La traduction préserve cette participation sans imposer un modèle précis de gouvernement ecclésial.
- issue: Portée de ἀδελφοῖς
  choice: « frères » dans le texte, avec une note sur sa portée collective probable.
  alternative: « frères et sœurs » ou « croyants » dans le corps du texte.
  rationale: Le grec emploie un masculin pluriel susceptible de désigner collectivement la communauté croyante. La traduction conserve la forme du texte source tout en explicitant sa portée contextuelle probable dans une note.
translation_notes:
  register: Français international moderne, naturel et digne. « Jugèrent bon » conserve la nuance délibérative de ἔδοξε. « Exerçaient un rôle de direction » évite à la fois la maladresse de « dirigeaient parmi » et l’attribution indue d’un titre officiel.
