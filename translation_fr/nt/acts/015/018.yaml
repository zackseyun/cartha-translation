lexical_decisions:
- source_word: γνωστὰ
  choice: connues
  rationale: Adjectif au pluriel neutre employé comme prédicat dans cette proposition sans verbe. « Connues » en conserve directement le sens sans introduire l’idée verbale de « faire connaître ».
- source_word: ἀπ’
  choice: depuis
  rationale: Dans cette expression temporelle, ἀπό indique le point de départ. « Depuis » est naturel en français et convient à une réalité qui remonte à un passé ancien.
- source_word: αἰῶνος
  choice: les temps anciens
  rationale: Ici, αἰών peut désigner une très longue durée passée ou les temps anciens. Cette formulation française est claire et idiomatique, tout en évitant de renforcer le texte bref en « éternité ».
theological_decisions:
- issue: Portée temporelle de la connaissance dans cette proposition condensée
  choice: Présenter ces choses comme connues depuis les temps anciens, sans développer la phrase en affirmation explicite sur la prescience éternelle de Dieu.
  alternative: « connues depuis l’éternité » ou « qui fait connaître ces choses depuis les temps anciens »
  rationale: 'Le texte du SBLGNT est très bref : γνωστὰ ἀπ’ αἰῶνος. La traduction en respecte la concision et n’intègre ni les mots des variantes longues ni une précision théologique déduite. La note signale ces variantes.'
translation_notes:
  register: Français international moderne, sobre et digne. Le fragment demeure volontairement concis afin de refléter la proposition grecque sans verbe et son lien syntaxique avec le contexte.
