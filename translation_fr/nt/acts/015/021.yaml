  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: fr
  text: Car, depuis les temps anciens, Moïse a, dans chaque ville, des personnes qui le proclament[a], puisqu’on le lit dans les synagogues chaque sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Moïse… des personnes qui le proclament… il est lu. » « Moïse » désigne ici, par métonymie, les écrits ou la Loi qui lui sont associés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française standard du nom; la référence personnelle est conservée, comme dans le grec.
- source_word: γὰρ
  choice: Car
  rationale: Introduit la justification de ce qui précède et conserve naturellement la valeur explicative.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: depuis les générations anciennes
  rationale: Conserve le pluriel de γενεῶν et exprime un état qui remonte à un passé lointain.
- source_word: κατὰ πόλιν
  choice: dans chaque ville
  rationale: Rend la valeur distributive de κατά avec le singulier.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: des gens qui le proclament
  rationale: κηρύσσω désigne une proclamation publique; le pronom personnel maintient la métonymie du grec.
- source_word: ἔχει
  choice: a
  rationale: Le présent français correspond directement au présent grec et, avec «depuis», exprime la continuité depuis les temps anciens.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: dans les synagogues
  rationale: Désigne le cadre régulier de la lecture publique.
- source_word: κατὰ πᾶν σάββατον
  choice: chaque sabbat
  rationale: Rend avec concision la répétition distributive indiquée par le grec.
- source_word: ἀναγινωσκόμενος
  choice: puisqu’on le lit
  rationale: Rend le passif grec par le pronom indéfini français et exprime la valeur explicative vraisemblable du participe, sans remplacer Moïse par ses écrits.
theological_decisions:
- issue: Référence métonymique à Moïse
  choice: Conserver «Moïse» et «le» dans le texte principal.
  alternative: Expliciter «la Loi de Moïse» ou «les écrits de Moïse».
  rationale: Le grec nomme Moïse et reprend ce nom par un pronom, selon une métonymie courante pour ses écrits ou la Loi qui lui est associée. La conserver évite d’inscrire une explicitation interprétative dans le texte.
- issue: Valeur du participe ἀναγινωσκόμενος
  choice: Le rendre par «puisqu’on le lit».
  alternative: Employer «étant lu» ou coordonner «et on le lit».
  rationale: Dans la phrase, la lecture régulière de Moïse explique la présence de personnes qui le proclament. «Puisque» rend cette relation naturellement, tout en laissant la note préciser la forme littérale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible tout en conservant la métonymie frappante du grec. «Des gens» évite le tour plus lourd «ceux qui» après «a».
