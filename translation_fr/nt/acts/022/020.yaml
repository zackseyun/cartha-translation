reference: Acts 22:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: fr
  text: Et lorsque le sang d’Étienne, ton témoin[a], était versé, moi-même, je me tenais là, j’approuvais et je gardais les manteaux de ceux qui le tuaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « martyr ». Le mot grec désigne un témoin et, dans l’usage chrétien, en est venu à désigner particulièrement une personne mise à mort à cause de son témoignage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: était répandu
  rationale: L’imparfait passif exprime une action en cours. « Était répandu » conserve l’image vive du sang versé tout en restant naturel en français.
- source_word: αἷμα
  choice: le sang
  rationale: Équivalent direct et usuel, sans nécessité de paraphrase.
- source_word: μάρτυρός
  choice: témoin
  rationale: Le sens lexical premier est « témoin ». « Martyr » reflète une évolution de l’usage chrétien, signalée en note sans être imposée au texte.
- source_word: ἐφεστὼς
  choice: j’étais là
  rationale: Dans ce contexte, le participe indique que Paul se tenait sur place ou était présent. Cette formulation est idiomatique et n’ajoute pas de rôle non exprimé.
- source_word: συνευδοκῶν
  choice: j’approuvais
  rationale: Le terme exprime l’assentiment ou l’approbation active, et non une simple présence passive.
- source_word: φυλάσσων
  choice: je gardais
  rationale: Le verbe signifie garder ou surveiller; « gardais » convient à l’action concrète exercée sur les vêtements.
- source_word: ἱμάτια
  choice: les manteaux
  rationale: Le mot désigne ici vraisemblablement les vêtements de dessus déposés par les exécutants; « manteaux » est concret et naturel.
- source_word: ἀναιρούντων
  choice: de ceux qui le tuaient
  rationale: Dans ce contexte, le participe signifie mettre à mort. « Tuaient » est direct et moderne, sans ajouter l’évaluation juridique de « assassinaient ».
- source_word: αὐτὸς
  choice: moi aussi
  rationale: Le pronom est emphatique. Avec καί, « moi aussi » souligne la participation personnelle de Paul dans la scène.
theological_decisions:
- issue: Traduction de μάρτυς à propos d’Étienne
  choice: témoin
  alternative: martyr
  rationale: « Témoin » préserve le sens grec sans importer comme sens principal le terme ecclésiastique ultérieur. Le contexte de mort explique toutefois l’association traditionnelle avec « martyr », conservée en note.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La coordination répétée du grec est légèrement lissée, tandis que la progression des actions et l’insistance sur la participation personnelle de Paul sont conservées.
