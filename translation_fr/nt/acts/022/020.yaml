revisions:
- from: Et quand le sang d’Étienne, ton témoin[a], était répandu, moi aussi, j’étais là, j’approuvais et je gardais les manteaux de ceux qui le tuaient.
  to: Et lorsque le sang d’Étienne, ton témoin[a], était versé, moi-même, je me tenais là, j’approuvais et je gardais les manteaux de ceux qui le tuaient.
  rationale: La révision corrige l’emphase personnelle de Paul, restitue plus nettement sa présence active et améliore l’idiomaticité de l’expression relative au sang, sans résoudre au-delà du texte l’ambiguïté lexicale de μάρτυς ni modifier la progression des participes grecs.
