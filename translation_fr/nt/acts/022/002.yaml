source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: fr
  text: 'Mais quand ils entendirent qu’il s’adressait à eux en langue hébraïque[a], ils se turent encore davantage. Et il dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « en araméen ». Le grec dit « en langue hébraïque », expression qui peut désigner ici le parler sémitique local de la Judée.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Mais quand ils entendirent
  rationale: Le participe aoriste exprime ici la circonstance temporelle, tandis que δὲ marque une légère transition narrative. Cette formulation est naturelle en français et conserve ces deux nuances.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: en langue hébraïque
  rationale: Le grec désigne explicitement la langue ou le parler « hébraïque ». Le texte principal conserve cette désignation, sans trancher silencieusement la question de son référent historique précis.
- source_word: προσεφώνει αὐτοῖς
  choice: il s’adressait à eux
  rationale: L’imparfait présente une action en cours et le verbe décrit une parole adressée directement à l’auditoire.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: ils firent encore plus silence
  rationale: Cette tournure française rend l’expression idiomatique grecque, littéralement « ils offrirent davantage de silence », ainsi que la force comparative de μᾶλλον.
- source_word: καὶ φησίν
  choice: 'Il dit alors :'
  rationale: Le présent historique grec est rendu au passé, conformément à l’usage narratif naturel du français. « alors » assure la transition sans alourdir la phrase, et les deux-points introduisent le discours qui suit.
theological_decisions:
- issue: Référent de « langue hébraïque »
  choice: Conserver « langue hébraïque » dans le texte principal
  alternative: Traduire directement « en araméen »
  rationale: Le grec porte Ἑβραΐδι, « hébraïque », mais cette désignation peut, dans ce contexte, renvoyer au parler sémitique local, souvent identifié à l’araméen. La traduction garde donc le libellé grec et signale l’ambiguïté historique en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Faire silence » convient à une scène publique et restitue plus précisément l’expression grecque qu’une simple description de l’état calme de la foule.
