revisions:
- from: J’ai persécuté cette Voie jusqu’à la mort[a], en enchaînant hommes et femmes et en les livrant aux prisons.
  to: J’ai persécuté cette Voie jusqu’à la mort, en enchaînant des hommes comme des femmes et en les faisant emprisonner.
  rationale: La révision remplace l’expression non idiomatique « les livrant aux prisons » par « les faisant emprisonner », qui conserve l’idée de remise en détention. La note existante est retirée, car son alternative surinterprète la responsabilité personnelle de Paul ; le texte principal préserve l’ambiguïté du grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Paul décrit sa persécution de « cette Voie » jusqu’à la mort, visant explicitement des hommes comme des femmes. Toutefois, « en les livrant aux prisons » n’est pas idiomatique en français et rend imparfaitement la remise de personnes en détention exprimée par παραδιδοὺς εἰς φυλακάς.'
  naturalness: « Cette Voie » et « jusqu’à la mort » conviennent au registre. En revanche, « livrer aux prisons » sonne comme si les prisons étaient des destinataires personnels ; « faire emprisonner » exprime naturellement l’action de remettre des personnes à la détention.
  terminology: La majuscule à « Voie » est justifiée par l’emploi vraisemblablement désignatif de ἡ ὁδός dans les Actes. « Persécuté », « enchaînant » et « jusqu’à la mort » sont exacts et de registre approprié.
  issues:
  - severity: medium
    issue: La formulation « en les livrant aux prisons » est maladroite et imprécise en français.
    rationale: Le grec décrit le fait de lier puis de remettre des personnes en prison. En français moderne, « faire emprisonner » rend plus naturellement cette mise en détention sans ajouter de précision sur les autorités responsables.
  - severity: medium
    issue: La note propose « jusqu’à en faire mourir » comme alternative.
    rationale: Cette reformulation attribue plus directement à Paul le fait de causer la mort, alors que ἄχρι θανάτου exprime ici la limite ou portée mortelle de la persécution sans préciser le mécanisme ni son rôle personnel dans d’éventuelles exécutions.
  revised_text: J’ai persécuté cette Voie jusqu’à la mort, en enchaînant des hommes comme des femmes et en les faisant emprisonner.
  revised_footnotes: []
  revision_rationale: La révision remplace l’expression non idiomatique « les livrant aux prisons » par « les faisant emprisonner », qui conserve l’idée de remise en détention. La note existante est retirée, car son alternative surinterprète la responsabilité personnelle de Paul ; le texte principal préserve l’ambiguïté du grec.
