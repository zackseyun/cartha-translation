reference: Acts 22:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: fr
  text: J’ai persécuté cette Voie jusqu’à la mort, en enchaînant des hommes comme des femmes et en les faisant emprisonner.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: cette Voie
  rationale: ὁδός signifie littéralement « voie, chemin », mais sert dans les Actes à désigner le mouvement chrétien. La majuscule signale cet emploi comme appellation tout en restant proche du grec.
- source_word: ἐδίωξα
  choice: J’ai persécuté
  rationale: Dans ce contexte, διώκω désigne une poursuite hostile; « persécuter » en exprime clairement le sens.
- source_word: ἄχρι θανάτου
  choice: jusqu’à la mort
  rationale: Cette expression conserve la portée extrême, voire mortelle, de la persécution sans préciser abusivement que Paul aurait lui-même mis à mort les victimes.
- source_word: δεσμεύων
  choice: en enchaînant
  rationale: Le participe évoque concrètement le fait de lier des prisonniers. « Enchaîner » est naturel en français et convient au contexte d’arrestation.
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: en les livrant aux prisons
  rationale: παραδίδωμι exprime la remise de personnes à la garde des autorités, tandis que εἰς φυλακάς indique leur destination et conserve le pluriel du grec.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: hommes et femmes
  rationale: La coordination grecque souligne explicitement que la persécution touchait les uns comme les autres; la formule française garde cette portée inclusive.
theological_decisions:
- issue: Faut-il rendre ἡ ὁδός comme un nom commun ou comme une appellation du mouvement chrétien?
  choice: « cette Voie », avec une majuscule
  alternative: « ce chemin », « cette voie » ou « ce mouvement »
  rationale: Dans les Actes, ἡ ὁδός fonctionne régulièrement comme une désignation de la foi et du mouvement chrétiens. La majuscule rend cet usage probable sans introduire un terme ecclésiastique ultérieur.
- issue: ἄχρι θανάτου affirme-t-il que Paul a personnellement tué des croyants?
  choice: Conserver « jusqu’à la mort », qui exprime l’étendue mortelle de la persécution sans en préciser le mécanisme
  alternative: Expliciter « jusqu’à les faire mourir »
  rationale: Le grec souligne l’extrême limite atteinte par la persécution, mais ne dit pas ici à lui seul que Paul exécutait personnellement les victimes. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Cette Voie » préserve l’image grecque et son emploi comme désignation du mouvement chrétien. « Enchaînant » maintient l’image concrète, tandis que la reprise « en les livrant » rend explicite en français le complément sous-entendu du second participe.
