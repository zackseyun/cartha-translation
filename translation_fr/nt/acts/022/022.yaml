  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: fr
  text: 'Ils l’écoutaient jusqu’à cette parole, puis ils élevèrent la voix en disant : « Qu’on ôte de la terre un homme pareil ! Car il ne convient pas qu’il vive. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤκουον
  choice: Ils l’écoutèrent
  rationale: L’imparfait grec présente l’écoute comme se poursuivant jusqu’au point indiqué. En français narratif, le passé simple avec « jusqu’à » exprime naturellement cette continuité bornée.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: jusqu’à ces paroles
  rationale: λόγος désigne ici les paroles que Paul vient de prononcer, vraisemblablement l’énoncé qui déclenche la réaction. Le pluriel français est idiomatique sans réduire le terme à un seul mot.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ils élevèrent la voix
  rationale: Cette formulation conserve l’image de l’expression grecque tout en rendant clairement la clameur collective.
- source_word: λέγοντες
  choice: en disant
  rationale: Rend directement le participe qui introduit le contenu de leur cri.
- source_word: Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον
  choice: Qu’un tel homme disparaisse de la terre !
  rationale: Dans ce contexte hostile, αἴρω commande l’élimination. Cette tournure française restitue naturellement la force de la formule et son association avec « de la terre », sans ajouter explicitement un agent absent du grec.
- source_word: τὸν τοιοῦτον
  choice: un tel homme
  rationale: Conserve la nuance méprisante de la désignation sans employer un registre vieilli ou excessivement familier.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: Il ne mérite pas de vivre
  rationale: καθῆκεν exprime ici ce qui convient ou doit être admis. Dans la bouche de la foule, cette formulation française transmet naturellement le jugement normatif et la demande de mort.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La clameur reste directe et violente, sans atténuer le fait que la foule réclame la mort de Paul.
