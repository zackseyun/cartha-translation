  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: fr
  text: 'Le tribun s’approcha donc de lui et lui demanda : « Dis-moi, es-tu citoyen romain[a] ? » Il répondit : « Oui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Romain ». Dans ce contexte, il s’agit du statut juridique de citoyen romain.'
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe aoriste de προσέρχομαι indique que l’officier se déplace vers Paul avant de lui parler. « S’approcha » rend ce mouvement avec naturel.
- source_word: δὲ
  choice: donc
  rationale: Le premier δέ assure ici la progression du récit plutôt qu’un contraste marqué. « Donc » relie naturellement la démarche du tribun à ce qui précède. Le second δέ est rendu par l’enchaînement du dialogue.
- source_word: χιλίαρχος
  choice: tribun
  rationale: Dans ce contexte romain, χιλίαρχος désigne l’officier commandant une cohorte. « Tribun » est le titre historique français usuel et précis.
- source_word: εἶπεν αὐτῷ
  choice: lui demanda
  rationale: Bien que le grec emploie littéralement « lui dit », la parole introduite est une question directe ; « lui demanda » est idiomatique et en conserve la fonction.
- source_word: Λέγε μοι
  choice: Dis-moi
  rationale: L’impératif suivi du datif se rend naturellement par « Dis-moi », formule directe qui respecte la force de la demande.
- source_word: σὺ
  choice: tu
  rationale: Le pronom grec explicite porte une certaine insistance. En français, la question « es-tu… ? » la laisse entendre sans ajouter une tournure lourde comme « toi-même ».
- source_word: Ῥωμαῖος
  choice: citoyen romain
  rationale: L’adjectif substantivé signifie littéralement « Romain », mais le contexte porte précisément sur le statut juridique de citoyen romain. En français moderne, « citoyen romain » évite l’ambiguïté avec l’origine géographique.
- source_word: Ναί
  choice: Oui
  rationale: Réponse affirmative simple et directe, sans expansion absente du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le titre historique « tribun » est conservé ; la citoyenneté romaine est explicitée dans le texte pour une compréhension immédiate, tandis que la formulation littérale est signalée en note.
