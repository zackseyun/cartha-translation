    issue: Nuance causative ajoutée dans « il l’avait fait attacher ».
    rationale: Le grec αὐτὸν ἦν δεδεκώς emploie le parfait actif de δέω avec le tribun comme sujet. La formulation causative française peut être plausible dans le cadre militaire, mais elle ajoute une médiation que le texte grec ne formule pas. « Il l’avait attaché » conserve la voix et l’ambiguïté du grec.
