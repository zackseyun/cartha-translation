  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: fr
  text: Ceux qui s’apprêtaient à l’interroger se retirèrent aussitôt de lui[a]. Le tribun[b] lui-même prit peur lorsqu’il comprit que Paul était citoyen romain et qu’il l’avait attaché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte : « l’interroger sous le fouet ». Le verbe grec peut désigner un interrogatoire officiel, et le verset précédent en indique le moyen.'
    reason: lexical_alternative
  - marker: b
    text: Le « tribun » était un officier romain placé à la tête d’une unité théoriquement composée d’environ mille soldats, bien que l’effectif réel ait pu varier.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: Aussitôt … donc
  rationale: « Aussitôt » exprime l’immédiateté, tandis que « donc » maintient le lien logique avec la déclaration de Paul au verset précédent.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: se retirèrent … de lui
  rationale: Rend naturellement l’éloignement et l’abandon immédiat de la procédure envisagée.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: ceux qui allaient l’interroger
  rationale: La périphrase exprime l’intention imminente. « Interroger » convient à l’examen officiel sans expliciter dans le texte le recours au fouet, précisé par le contexte.
- source_word: χιλίαρχος
  choice: tribun
  rationale: Terme historique concis pour cet officier romain; une note explique sa fonction au lecteur moderne.
- source_word: ἐφοβήθη
  choice: prit peur
  rationale: Exprime de façon actuelle le début de la crainte provoquée par la prise de conscience de l’officier.
- source_word: ἐπιγνοὺς
  choice: lorsqu’il comprit
  rationale: Rend la prise de conscience à la fois temporelle et causale dans un français naturel.
- source_word: Ῥωμαῖός ἐστιν
  choice: Paul était citoyen romain
  rationale: Le contexte porte sur le statut juridique. Le nom « Paul » évite l’ambiguïté possible entre les deux pronoms masculins, et le passé convient au récit français.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: il l’avait fait attacher
  rationale: Le plus-que-parfait conserve l’antériorité et la portée résultative du parfait grec. La tournure causative est idiomatique pour un commandant ayant ordonné ou fait exécuter l’action.
