revisions:
- from: Aussitôt, ceux qui allaient l’interroger se retirèrent donc de lui[a]. Le tribun[b] lui-même prit peur lorsqu’il comprit que Paul était citoyen romain et qu’il l’avait fait attacher.
  to: Ceux qui s’apprêtaient à l’interroger se retirèrent aussitôt de lui[a]. Le tribun[b] lui-même prit peur lorsqu’il comprit que Paul était citoyen romain et qu’il l’avait attaché.
  rationale: La révision supprime le « donc », dont la position après « se retirèrent » était possible mais moins naturelle et dont la force est suffisamment portée par la continuité narrative. Elle remplace « allaient » par « s’apprêtaient à » pour mieux refléter l’imminence, et surtout rend δεδεκώς par un parfait actif français sans introduire la causation. Les notes demeurent correctement ancrées et conservent leur fonction lexicale et culturelle.
