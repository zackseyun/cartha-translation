  to: 'J’ai alors demandé : « Que dois-je faire, Seigneur[a] ? » Le Seigneur m’a dit : « Lève-toi, va à Damas, et là on te dira tout ce qui t’a été assigné à accomplir[b]. »'
  rationale: 'Révision limitée : déplacement de l’ancre a vers la question visée, remplacement de « m’a répondu » par le plus neutre « m’a dit », amélioration de la syntaxe française de la proposition finale, et ajustement de la variante de note b pour qu’elle soit idiomatique et corresponde exactement à l’expression annotée.'
