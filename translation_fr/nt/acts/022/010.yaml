  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: fr
  text: 'J’ai alors demandé : « Que dois-je faire, Seigneur[a] ? » Le Seigneur m’a dit : « Lève-toi, va à Damas, et là on te dira tout ce qui t’a été assigné à accomplir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que me faut-il faire, Seigneur ? »
    reason: lexical_alternative
  - marker: b
    text: Ou « tout ce qui t’a été fixé à faire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: Que dois-je faire
  rationale: Le subjonctif aoriste délibératif exprime une demande de direction quant à l’action à entreprendre. Cette formulation est naturelle en français moderne et conserve la nuance d’obligation ou d’orientation.
- source_word: κύριε / ὁ ... κύριος
  choice: Seigneur / le Seigneur
  rationale: Dans le récit de la rencontre sur le chemin de Damas, ce titre s’adresse à Jésus puis le désigne. « Seigneur » préserve cette portée narrative et christologique, que « monsieur » ou « maître » atténuerait.
- source_word: Ἀναστὰς
  choice: Lève-toi
  rationale: Le participe a ici une valeur impérative et précède l’ordre d’aller. « Lève-toi » est idiomatique et restitue clairement la séquence.
- source_word: πορεύου εἰς Δαμασκόν
  choice: va à Damas
  rationale: En français, « aller à Damas » exprime naturellement le déplacement vers la ville; traduire εἰς par « dans Damas » serait peu idiomatique dans ce contexte.
- source_word: κἀκεῖ
  choice: et là
  rationale: Cette contraction de καὶ ἐκεῖ marque simplement la coordination et le lieu où l’instruction sera donnée.
- source_word: λαληθήσεται
  choice: on te dira
  rationale: Le futur passif grec avec le datif σοι se rend naturellement par la construction impersonnelle française « on te dira », sans préciser l’agent que le texte laisse implicite.
- source_word: περὶ πάντων
  choice: tout ce que
  rationale: Dans la construction complète, cette formulation introduit idiomatiquement le contenu de ce qui sera communiqué, sans reproduire lourdement « au sujet de toutes les choses ».
- source_word: τέτακταί σοι ποιῆσαι
  choice: il t’a été assigné d’accomplir
  rationale: Le parfait passif de τάσσω présente les actions comme déjà fixées ou assignées, avec un effet qui demeure. « Assigné » conserve l’idée d’une disposition imposée sans expliciter davantage son agent; « accomplir » rend ποιῆσαι naturellement dans cette tournure.
theological_decisions:
- issue: Portée de τέτακταί quant à la direction divine et à la vocation de Paul
  choice: tout ce qu’il t’a été assigné d’accomplir
  alternative: tout ce qui a été fixé pour que tu l’accomplisses
  rationale: La formulation préserve l’idée que les actes à venir de Paul ont déjà été ordonnés ou assignés, tout en laissant implicite l’agent du passif et sans importer une doctrine plus précise de la prédestination.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct emploie le tutoiement, conforme à l’usage biblique français courant. La syntaxe privilégie la fluidité tout en maintenant le passif implicite et la tension théologique du texte grec.
