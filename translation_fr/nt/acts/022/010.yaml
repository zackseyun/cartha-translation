review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : question délibérative, titre « Seigneur », ordres de se lever et d’aller à Damas, futur passif non spécifié, et actions déjà assignées. « M’a répondu » est légèrement plus interprétatif que εἶπεν (« m’a dit »), qui ne marque pas explicitement une réponse. La formulation révisée conserve aussi la portée du parfait passif τέτακται sans identifier l’agent ni renforcer sa portée théologique.'
  naturalness: Le français est moderne et clair. « Tout ce qui t’a été assigné à accomplir » est plus idiomatique que « tout ce qu’il t’a été assigné d’accomplir », tout en gardant le sens d’une tâche déjà fixée.
  terminology: « Seigneur », « Lève-toi », « Damas » et « on te dira » conviennent au registre biblique français moderne. « Assigné » est un rendu acceptable de τέτακται et ne force pas l’interprétation doctrinale.
