id: ACT.22.9
reference: Acts 22:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: fr
  text: Ceux qui étaient avec moi ont vu la lumière, mais ils n’ont pas entendu la voix[a] de celui qui me parlait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils n’ont pas compris la voix ». Comparer Actes 9.7, où les compagnons de Paul sont dits entendre le son ou la voix ; la différence peut tenir au fait de percevoir un son sans comprendre celui qui parle.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: Ceux qui étaient avec moi
  rationale: Rend naturellement la construction participiale substantivée sans ajouter « hommes », absent du grec. Le contraste porté par δέ et la corrélation μέν…δέ sont exprimés dans l’ensemble de la phrase.
- source_word: τὸ μὲν φῶς
  choice: ont bien vu la lumière
  rationale: φῶς signifie directement « lumière ». Le tour « bien… mais » rend en français courant le contraste μέν…δέ, sans ajouter l’idée d’une lumière éclatante, qui n’est pas exprimée dans ce verset.
- source_word: ἐθεάσαντο
  choice: ont vu
  rationale: θεάομαι signifie ici voir ou observer. « Ont vu » est naturel et fidèle, sans suggérer une contemplation volontaire.
- source_word: τὴν δὲ φωνὴν
  choice: la voix
  rationale: φωνή peut désigner une voix ou un son. « Voix » convient ici puisque le complément « de celui qui me parlait » désigne un locuteur personnel.
- source_word: οὐκ ἤκουσαν
  choice: ils n’ont pas entendu
  rationale: ἀκούω signifie normalement « entendre », même s’il peut parfois prendre la nuance de comprendre. Le sens lexical direct est conservé dans le texte, tandis que l’autre possibilité est signalée en note.
- source_word: τοῦ λαλοῦντός μοι
  choice: de celui qui me parlait
  rationale: L’imparfait français restitue naturellement l’action en cours du participe présent λαλοῦντος et conserve le lien avec « la voix ».
theological_decisions:
- issue: Tension apparente avec Actes 9.7 sur ce qu’ont entendu les compagnons de Paul
  choice: « ils n’ont pas entendu la voix de celui qui me parlait »
  alternative: « ils n’ont pas compris la voix »
  rationale: Le texte grec se rend le plus directement par « n’ont pas entendu la voix ». La polysémie possible de ἀκούω et de φωνή permet toutefois d’envisager qu’ils aient perçu un son sans comprendre le locuteur. La traduction principale préserve donc la formulation et la tension du texte, tandis que la note présente l’autre compréhension possible.
translation_notes:
  register: Français international moderne, clair et digne. « Ont bien vu… mais » exprime idiomatiquement l’opposition μέν…δέ sans résoudre la tension narrative. Le marqueur [a] est placé après la proposition concernée.
