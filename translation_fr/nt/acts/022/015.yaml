  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: fr
  text: Car tu seras, auprès de tous, témoin pour lui au sujet de ce que tu as vu et entendu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le datif grec peut indiquer un témoignage rendu pour lui ou un témoignage à son sujet.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans ce contexte de mission, ὅτι introduit l’explication de ce qui précède. « Car » en conserve naturellement la valeur explicative.
- source_word: ἔσῃ
  choice: tu seras
  rationale: Le futur de εἰμί appelle ici un futur simple, naturel et direct en français.
- source_word: μάρτυς
  choice: témoin
  rationale: Le nom désigne une personne qui rend témoignage; « témoin » est le terme français courant et précis.
- source_word: αὐτῷ
  choice: son
  rationale: Avec « témoin », le datif désigne ici celui en faveur de qui ou au sujet de qui le témoignage est rendu. « Son témoin » est naturel en français, tandis qu’une note préserve l’ambiguïté du datif grec.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: auprès de tous les êtres humains
  rationale: πρός indique l’orientation du témoignage vers ses destinataires. « Êtres humains » rend explicitement la portée générique de ἀνθρώπους sans la limiter aux hommes de sexe masculin.
- source_word: ὧν
  choice: au sujet de ce que
  rationale: Le pronom relatif au génitif introduit le contenu du témoignage. Cette formulation est claire et idiomatique en français.
- source_word: ἑώρακας
  choice: tu as vu
  rationale: Le passé composé rend naturellement en français l’expérience antérieure qui demeure le fondement du témoignage.
- source_word: καὶ ἤκουσας
  choice: et entendu
  rationale: Le participe passé coordonné avec « vu » forme l’expression française naturelle « tu as vu et entendu », tout en conservant les deux expériences distinctes.
theological_decisions:
- issue: Référence et valeur de αὐτῷ dans la mission de Paul
  choice: « son témoin », le pronom renvoyant au Seigneur/Jésus, pour qui Paul témoignera
  alternative: « témoin pour lui » ou « témoin à son égard »
  rationale: Le contexte immédiat présente la mission reçue du Seigneur ressuscité. La formulation principale exprime naturellement en français l’appartenance ou la représentation, tandis que la note maintient les nuances étroitement liées permises par le datif grec sans imposer une précision doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la portée universelle de πάντας ἀνθρώπους et le lien explicatif introduit par ὅτι, tout en signalant l’ambiguïté réelle du datif αὐτῷ.
