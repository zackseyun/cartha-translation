id: ACT.22.30
reference: Acts 22:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: fr
  text: Le lendemain, voulant savoir avec certitude de quoi les Juifs[a] accusaient Paul, il le fit détacher et ordonna aux chefs des prêtres et à tout le Conseil[b] de se réunir. Puis il fit descendre Paul et le plaça devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chefs juifs » ou « les Judéens ». Le grec dit littéralement « les Juifs » ; dans ce contexte, il s’agit des accusateurs de Paul, et non de tous les Juifs sans distinction.
    reason: lexical_alternative
  - marker: b
    text: Le « Conseil » est le Sanhédrin, l’organe dirigeant juif siégeant à Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Cette expression temporelle signifie « le jour suivant ». En français, « Le lendemain » assure une transition narrative naturelle sans alourdir la légère valeur connective de δέ.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: voulant savoir avec certitude
  rationale: βουλόμενος exprime ici l’intention du commandant, tandis que τὸ ἀσφαλές désigne ce qui est sûr ou établi. La formulation retenue rend clairement les deux éléments.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: de quoi les Juifs accusaient Paul
  rationale: La tournure française active est plus naturelle que le passif grec tout en conservant l’objet de la recherche et l’identité explicite des accusateurs. Le nom « Paul » lève sans ambiguïté la référence du pronom dans une phrase comportant plusieurs personnages masculins.
- source_word: ἔλυσεν αὐτόν
  choice: il le fit détacher
  rationale: λύω signifie délier ou détacher. Paul demeure sous autorité romaine et va être présenté au Conseil ; « fit détacher » rend donc mieux l’action concrète que « libéra », qui pourrait suggérer une remise en liberté complète.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: ordonna ... de se réunir
  rationale: κελεύω suivi de l’infinitif exprime un ordre officiel. Cette formulation est naturelle et garde le caractère autoritaire de la décision.
- source_word: τοὺς ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Le pluriel désigne les principaux responsables de l’institution sacerdotale, et non plusieurs grands prêtres simultanément en fonction. « Chefs des prêtres » est clair en français courant.
- source_word: πᾶν τὸ συνέδριον
  choice: tout le Conseil
  rationale: συνέδριον désigne ici l’organe dirigeant juif de Jérusalem. « Conseil » traduit le terme, tandis que « tout » conserve πᾶν.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: Puis il fit descendre Paul
  rationale: κατάγω indique un déplacement vers le bas, probablement depuis la forteresse. La construction causative convient puisque le commandant fait conduire Paul.
- source_word: ἔστησεν εἰς αὐτούς
  choice: il le plaça devant eux
  rationale: L’expression décrit la présentation officielle de Paul en présence des membres réunis. « Plaça devant eux » est idiomatique et n’implique pas qu’il se soit présenté de lui-même.
theological_decisions:
- issue: Portée de Ἰουδαίων dans le récit
  choice: les Juifs
  alternative: les chefs juifs ; les Judéens
  rationale: Le texte grec emploie le terme général Ἰουδαίων. La traduction le conserve sans en restreindre silencieusement la portée, tandis que la note précise que le contexte vise les accusateurs de Paul et non l’ensemble des Juifs.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque, longue et participiale, est divisée en deux phrases pour préserver la clarté narrative. Les majuscules de « Conseil » signalent qu’il s’agit ici d’une institution déterminée.
