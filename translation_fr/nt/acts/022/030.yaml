  source_fidelity: 'Le texte rend fidèlement la succession des actions et les éléments essentiels du grec : le lendemain, l’intention de connaître avec certitude l’accusation, les accusateurs désignés comme « les Juifs », le fait de délier Paul, la convocation des chefs des prêtres et de tout le Conseil, puis la présentation de Paul devant eux. « Il le fit détacher » est une restitution contextuellement appropriée de ἔλυσεν αὐτόν : elle exprime le déliement sans suggérer nécessairement une libération définitive.'
  naturalness: Le français est moderne, clair et d’un registre narratif convenable. La division de la longue période grecque en deux phrases améliore la lisibilité sans altérer les relations narratives. « De quoi les Juifs accusaient Paul » et « le plaça devant eux » sont naturels.
