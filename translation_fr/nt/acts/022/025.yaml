source:
  edition: SBLGNT
  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: fr
  text: 'Mais quand ils l’eurent étendu avec les courroies, Paul dit au centurion qui se tenait là : « Vous est-il permis de fouetter un citoyen romain[a] sans qu’il ait été condamné ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme romain » ; dans ce contexte juridique, il s’agit de son statut de citoyen romain.'
    reason: Préciser la forme littérale du grec tout en expliquant la portée juridique de l’expression.
lexical_decisions:
- source_word: προέτειναν αὐτὸν τοῖς ἱμᾶσιν
  choice: ils l’eurent étendu avec les courroies
  rationale: La formulation conserve à la fois l’idée d’étendre Paul en vue de la flagellation et celle des courroies servant à l’immobiliser.
- source_word: ἑστῶτα
  choice: qui se tenait là
  rationale: Le participe décrit naturellement le centurion présent à proximité de Paul.
- source_word: ἑκατόνταρχον
  choice: centurion
  rationale: « Centurion » est le titre français précis et usuel pour cet officier romain.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: un citoyen romain
  rationale: Littéralement, l’expression désigne « un homme romain », mais, dans cette contestation juridique, elle met en avant le statut civique romain protégé de Paul.
- source_word: ἀκατάκριτον
  choice: sans qu’il ait été condamné
  rationale: Cette tournure française claire exprime l’absence de condamnation judiciaire préalable sans suggérer nécessairement l’innocence.
- source_word: ἔξεστιν ὑμῖν
  choice: Vous est-il permis
  rationale: La formulation garde la portée juridique de la question et rend le pluriel ὑμῖν par « vous », qui peut viser les responsables présents collectivement.
- source_word: μαστίζειν
  choice: fouetter
  rationale: « Fouetter » exprime clairement le châtiment corporel sévère visé, dans un français moderne et non archaïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question conserve son caractère juridique, et la formulation de ἀκατάκριτον évite de confondre absence de condamnation et déclaration d’innocence.
