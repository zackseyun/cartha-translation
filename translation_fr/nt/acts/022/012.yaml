  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: fr
  text: Un certain homme nommé Ananias, pieux selon la Loi et estimé de tous les Juifs qui habitaient là,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Translittération française conventionnelle du nom propre.
- source_word: δέ
  choice: non rendu explicitement
  rationale: Cette particule assure ici une transition légère; la continuité du récit français suffit sans ajouter un connecteur temporel absent du grec.
- source_word: τις ἀνὴρ
  choice: un certain homme
  rationale: Conserve l’introduction indéfinie mais individualisée d’un homme précis.
- source_word: εὐλαβὴς
  choice: pieux
  rationale: Terme français courant et digne exprimant la dévotion et le respect religieux.
- source_word: κατὰ τὸν νόμον
  choice: selon la Loi
  rationale: Rend étroitement le rapport à la loi mosaïque; la majuscule indique ce référent contextuel sans explicitation excessive.
- source_word: μαρτυρούμενος
  choice: estimé
  rationale: Exprime naturellement le témoignage favorable rendu à Ananias, sans la lourdeur d’une formulation passive littérale.
- source_word: ὑπὸ πάντων
  choice: de tous
  rationale: Préserve la portée générale de πάντων et l’agent du témoignage favorable.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: les Juifs qui habitaient là
  rationale: Le contexte vise la communauté juive résidant à Damas; « là » restitue sobrement le lieu fourni par le contexte.
theological_decisions:
- issue: Sens de Ἰουδαίων
  choice: les Juifs
  alternative: les Judéens
  rationale: À Damas, le terme désigne ici plus naturellement l’identité communautaire et religieuse que l’origine géographique judéenne.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure ouverte par une virgule parce que le verset se poursuit syntaxiquement au verset suivant. « Nommé » clarifie naturellement l’apposition du nom propre sans changer le sens.
