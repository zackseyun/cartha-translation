id: ACT.22.16
reference: Acts 22:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: fr
  text: Et maintenant, qu’attends-tu[a] ? Lève-toi, fais-toi baptiser et lave-toi de tes péchés en invoquant son nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pourquoi tardes-tu ? »'
    reason: lexical_alternative
  - marker: b
    text: La construction grecque peut présenter l’invocation de son nom comme une action qui accompagne les impératifs ou comme le moyen qui leur est étroitement associé.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: qu’attends-tu ?
  rationale: Dans cette question, μέλλω exprime une attente ou un retard plutôt qu’une simple intention future. « Qu’attends-tu ? » rend naturellement en français la vive exhortation à ne pas différer.
- source_word: ἀναστὰς
  choice: Lève-toi
  rationale: Le participe aoriste accompagne les impératifs qui suivent. Le rendre par un impératif est idiomatique en français et conserve le ton pressant.
- source_word: βάπτισαι
  choice: fais-toi baptiser
  rationale: L’impératif aoriste moyen appelle Paul à recevoir le baptême. « Fais-toi baptiser » exprime à la fois son engagement personnel et l’action accomplie sur lui.
- source_word: ἀπόλουσαι
  choice: lave-toi de
  rationale: Le verbe moyen signifie se laver ou faire disparaître par lavage. Avec « tes péchés », « lave-toi de tes péchés » reste concret et proche de l’image grecque sans ajouter d’explication doctrinale.
- source_word: τὰς ἁμαρτίας σου
  choice: tes péchés
  rationale: Traduction directe qui conserve le sens ordinaire de ἁμαρτία et l’adresse personnelle du texte.
- source_word: ἐπικαλεσάμενος
  choice: en invoquant
  rationale: Le participe aoriste moyen peut décrire une action concomitante ou le moyen associé aux impératifs. La tournure française maintient le lien étroit sans développer une doctrine particulière.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom
  rationale: Le texte grec porte le pronom αὐτοῦ, non un titre explicite. « Son nom » respecte cette formulation, dont le référent est fourni par le contexte.
theological_decisions:
- issue: Rapport entre le baptême, le lavage des péchés et l’invocation de son nom
  choice: Conserver la suite des impératifs et rattacher étroitement le participe à l’ensemble sans préciser davantage le rapport théologique.
  alternative: Présenter soit le baptême seul, soit l’invocation seule comme le moyen explicitement défini par lequel les péchés sont lavés.
  rationale: Le grec coordonne deux impératifs et un participe, mais sa formulation ne contraint pas la traduction à trancher les débats sacramentels. Le texte français préserve donc la tension et la proximité grammaticale des actions.
translation_notes:
  register: Français international moderne, direct et digne. « Qu’attends-tu ? » et « Lève-toi » gardent l’urgence de l’exhortation ; le vocabulaire concret du lavage est conservé.
