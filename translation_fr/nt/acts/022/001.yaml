  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: fr
  text: Hommes, frères et pères, écoutez maintenant la défense que je vous présente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: Mes frères et mes pères
  rationale: Dans cette formule solennelle d’interpellation, ἄνδρες précise que Paul s’adresse à des hommes, tandis que ἀδελφοὶ καὶ πατέρες exprime à la fois la proximité et le respect. « Mes frères et mes pères » rend naturellement l’ensemble en français sans le calque peu idiomatique « Hommes, frères et pères ».
- source_word: ἀκούσατέ
  choice: écoutez
  rationale: L’impératif appelle l’auditoire à prêter attention au discours de Paul. « Écoutez » est plus naturel ici en français moderne que « entendez ».
- source_word: νυνὶ
  choice: maintenant
  rationale: Le terme marque l’immédiateté de la prise de parole et est conservé explicitement.
- source_word: μου … ἀπολογίας
  choice: la défense que je présente
  rationale: ἀπολογία désigne un exposé prononcé pour répondre à des accusations, non des excuses. Cette formulation française exprime naturellement le rapport entre Paul et sa défense sans alourdir la phrase.
- source_word: πρὸς ὑμᾶς
  choice: devant vous
  rationale: La préposition indique que la défense est adressée à l’auditoire présent. « Devant vous » convient au contexte d’une défense publique et reste proche de la construction grecque.
theological_decisions: []
translation_notes:
  register: Adresse publique solennelle, respectueuse et immédiatement compréhensible. La formulation évite un calque grec artificiel tout en conservant la distinction entre les « frères » et les « pères ».
