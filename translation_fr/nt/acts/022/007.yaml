  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: fr
  text: 'Je suis tombé par terre et j’ai entendu une voix qui me disait : « Saul, Saul, pourquoi me persécutes-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: Je suis tombé
  rationale: L’aoriste actif à la première personne du singulier est rendu naturellement par le passé composé, temps courant du récit oral en français.
- source_word: τε
  choice: '[non traduit séparément]'
  rationale: La particule relie la proposition à ce qui précède; son effet est suffisamment porté par la continuité du récit et par « et ».
- source_word: εἰς τὸ ἔδαφος
  choice: par terre
  rationale: Expression française naturelle après « tomber »; elle rend ici le mouvement vers le sol sans la raideur de « vers le sol ».
- source_word: ἤκουσα
  choice: j’ai entendu
  rationale: Le passé composé convient au récit oral moderne et coordonne naturellement l’action avec « je suis tombé ».
- source_word: φωνῆς
  choice: une voix
  rationale: Le génitif régi par ἀκούω se rend idiomatiquement comme complément direct en français; la suite parlée confirme le sens de « voix ».
- source_word: λεγούσης μοι
  choice: qui me disait
  rationale: La proposition relative rend naturellement le participe présent qui qualifie « voix » et conserve le datif μοι. L’imparfait exprime l’action concomitante introduisant les paroles entendues.
- source_word: Σαοὺλ Σαούλ
  choice: Saul, Saul
  rationale: Le nom est translittéré sous sa forme française usuelle, et la répétition de l’adresse est conservée.
- source_word: τί
  choice: pourquoi
  rationale: Dans cette interrogation portant sur une action, τί demande la raison et se rend naturellement par « pourquoi ».
- source_word: με
  choice: me
  rationale: Le pronom objet à la première personne est conservé sans explicitation.
- source_word: διώκεις
  choice: me persécutes-tu
  rationale: Dans ce contexte d’hostilité, διώκω signifie « persécuter ». Le présent français conserve l’action en cours, et l’inversion convient à une interrogation directe au registre digne.
theological_decisions:
- issue: Rapport entre le locuteur et les personnes que Saul persécute
  choice: Conserver le pronom direct « me » sans ajout explicatif.
  alternative: Développer par « mes disciples » ou « ceux qui m’appartiennent ».
  rationale: La formulation identifie directement la persécution menée par Saul à une persécution du locuteur lui-même. Une explicitation atténuerait ou résoudrait indûment cette portée théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au témoignage oral de Paul; « par terre » est idiomatique sans être familier dans ce contexte. Les guillemets français marquent les paroles directes.
