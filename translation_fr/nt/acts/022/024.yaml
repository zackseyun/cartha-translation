  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: fr
  text: Le tribun ordonna qu’on fasse entrer Paul dans la caserne[a] et qu’on l’interroge sous les coups de fouet[b], afin de découvrir pourquoi la foule criait ainsi contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le camp » ou « dans la forteresse ». Ici, le terme désigne les quartiers militaires romains de Jérusalem.
    reason: cultural_note
  - marker: b
    text: Ou « qu’on l’interroge par la flagellation ». Le grec associe l’interrogatoire au moyen explicite des fouets.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: tribun
  rationale: Le terme désigne ici un officier supérieur romain; « tribun » conserve la précision historique tout en restant intelligible en français.
- source_word: εἰσάγεσθαι αὐτὸν
  choice: qu’on fasse entrer Paul
  rationale: La tournure préserve le sens passif de l’infinitif et nomme Paul pour éviter l’ambiguïté naturelle du pronom français.
- source_word: παρεμβολή
  choice: caserne
  rationale: Dans le contexte de Jérusalem, le mot renvoie aux quartiers militaires romains, probablement dans la forteresse Antonia; « caserne » exprime clairement cette fonction.
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: qu’on l’interroge sous les coups de fouet
  rationale: Cette formulation unit l’interrogatoire à son moyen coercitif explicite, la flagellation, sans atténuer la violence de la procédure.
- source_word: ἵνα ἐπιγνῷ
  choice: afin de découvrir
  rationale: Le commandant cherche à apprendre la cause de l’hostilité de la foule; « découvrir » rend naturellement cette visée d’enquête.
- source_word: δι’ ἣν αἰτίαν
  choice: pourquoi
  rationale: « Pourquoi » rend avec naturel la recherche de la cause sans introduire l’idée plus précise d’une accusation judiciaire.
- source_word: οὕτως ἐπεφώνουν αὐτῷ
  choice: la foule criait ainsi contre lui
  rationale: L’imparfait exprime le cri continu, tandis que « contre lui » conserve son caractère hostile; « la foule » explicite le sujet fourni par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. « Tribun » maintient la couleur historique; « sous les coups de fouet » communique clairement au lecteur courant la violence de l’interrogatoire romain.
