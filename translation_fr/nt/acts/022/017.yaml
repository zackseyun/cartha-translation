id: ACT.22.17
reference: Acts 22:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: fr
  text: Or, après mon retour à Jérusalem, pendant que je priais dans le temple[a], je suis entré en extase[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne l’ensemble du domaine du Temple, et non uniquement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: 'Ou : « je me suis trouvé en état d’extase ». L’expression grecque décrit l’entrée dans cet état, c’est-à-dire un état visionnaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Or, … je suis entré
  rationale: La formule introduit la suite du récit et présente l’événement vécu par Paul. « Or » marque naturellement la transition en français, tandis que la proposition personnelle évite le tour lourd « il m’est arrivé de ».
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: après mon retour à Jérusalem
  rationale: Le participe aoriste situe le retour avant l’expérience racontée. Cette formulation rend clairement cette antériorité sans alourdir la phrase.
- source_word: καὶ προσευχομένου μου
  choice: pendant que je priais
  rationale: Le génitif absolu exprime une action en cours, contemporaine de l’événement principal.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: « Temple » est la formulation française courante; ἱερόν désigne ici l’ensemble du domaine du Temple, précision donnée en note.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: je suis entré en extase
  rationale: Avec γίνομαι, l’expression décrit l’entrée dans un état particulier. « Entrer en extase » conserve cette valeur dynamique et le caractère visionnaire du terme sans ajouter d’explication au texte.
theological_decisions:
- issue: Nature de l’expérience de Paul (ἐκστάσει)
  choice: extase
  alternative: transe; état visionnaire
  rationale: « Extase » correspond directement au terme grec et désigne un état dans lequel Paul reçoit une vision, sans préciser le mécanisme de l’expérience ni en proposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase privilégie une syntaxe naturelle tout en maintenant l’antériorité du retour, la simultanéité de la prière et l’entrée dans l’état d’extase.
