  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: fr
  text: 'Et je l’ai vu me dire : « Dépêche-toi, sors vite de Jérusalem, car ils n’accepteront pas ton témoignage à mon sujet. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne recevront pas ton témoignage à mon sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδεῖν αὐτὸν λέγοντά μοι
  choice: je l’ai vu me dire
  rationale: L’infinitif ἰδεῖν poursuit idiomatiquement le récit de la vision, tandis que le participe λέγοντα décrit celui qui est vu. Cette formulation française est naturelle et conserve la perception visionnaire ainsi que le pronom du grec.
- source_word: Σπεῦσον καὶ ἔξελθε ἐν τάχει
  choice: Dépêche-toi, sors vite
  rationale: Les deux expressions grecques cumulent l’urgence. La traduction garde cette insistance sans recourir à un registre archaïque.
- source_word: ἐξ Ἰερουσαλήμ
  choice: de Jérusalem
  rationale: Avec « sors », la préposition française « de » exprime naturellement le mouvement hors de la ville porté par ἐξ.
- source_word: διότι
  choice: car
  rationale: « Car » introduit clairement la raison de l’ordre dans un discours direct digne et courant.
- source_word: οὐ παραδέξονταί
  choice: ils n’accepteront pas
  rationale: Dans ce contexte, παραδέχομαι désigne l’accueil favorable ou l’acceptation du témoignage. « Accepter » convient naturellement à ce complément.
- source_word: σου μαρτυρίαν
  choice: ton témoignage
  rationale: « Témoignage » conserve la portée déclarative de μαρτυρία et s’accorde au contexte où Paul rend témoignage.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Cette expression rend naturellement la référence indiquée par περί avec le génitif, sans préciser davantage la nature du témoignage.
theological_decisions:
- issue: Référent de αὐτόν dans le récit de la vision
  choice: Conserver le pronom « l’ »
  alternative: Remplacer le pronom par « le Seigneur » ou « Jésus »
  rationale: Le contexte identifie le personnage vu, mais ce verset emploie un pronom. Le conserver évite d’ajouter au texte une désignation explicite absente du grec.
- issue: Sens de παραδέχομαι appliqué au témoignage
  choice: « accepteront » dans le texte, avec « accueilleront » en note
  alternative: Traduire uniquement par « accueilleront » ou « recevront »
  rationale: Le verbe peut exprimer l’acceptation ou l’accueil favorable. Le texte principal emploie le français le plus direct, tandis que la note préserve la nuance lexicale.
translation_notes:
  register: Français international moderne, courant et digne. L’impératif énergique et le redoublement de l’urgence sont préservés. Le pronom reste non explicité conformément au grec.
