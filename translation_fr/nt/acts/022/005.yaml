id: ACT.22.5
reference: Acts 22:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: fr
  text: Comme le grand prêtre et tout le conseil des anciens peuvent eux aussi en témoigner en ma faveur, j’avais aussi reçu d’eux des lettres destinées aux frères de Damas[a], et je m’y rendais pour amener aussi à Jérusalem ceux qui s’y trouvaient, enchaînés, afin qu’ils soient punis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux frères et sœurs ». Le grec dit « frères », mais ce mot peut, dans certains contextes, désigner une communauté plus large.
    reason: Alternative lexicale concernant la portée possible de ἀδελφοί.
lexical_decisions:
- source_word: ὡς καὶ
  choice: peuvent eux aussi
  rationale: 'Cette tournure française naturelle conserve la valeur confirmative de l’expression : le grand prêtre et le conseil apportent eux aussi un témoignage corroborant les propos de Paul.'
- source_word: ὁ ἀρχιερεύς
  choice: le grand prêtre
  rationale: Titre usuel et historiquement approprié pour la principale autorité sacerdotale.
- source_word: μαρτυρεῖ μοι
  choice: peuvent … en témoigner en ma faveur
  rationale: Le présent indique un témoignage toujours disponible; « en ma faveur » rend le datif μοι dans ce contexte de corroboration.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: tout le conseil des anciens
  rationale: πρεσβυτέριον désigne ici le corps constitué des anciens, et non simplement un groupe de personnes âgées.
- source_word: παρ’ ὧν … ἐπιστολὰς δεξάμενος
  choice: J’avais même reçu d’eux des lettres
  rationale: Le plus-que-parfait situe naturellement la réception des lettres avant le déplacement vers Damas; « d’eux » renvoie collectivement au grand prêtre et au conseil.
- source_word: πρὸς τοὺς ἀδελφούς
  choice: destinées aux frères
  rationale: « Frères » conserve le masculin pluriel du grec et son vocabulaire d’appartenance communautaire; la possibilité d’un groupe plus large est signalée en note.
- source_word: ἐπορευόμην
  choice: je m’y rendais
  rationale: L’imparfait restitue l’action en cours exprimée par l’imparfait grec, tandis que « y » reprend naturellement Damas.
- source_word: ἄξων καὶ τοὺς ἐκεῖσε ὄντας
  choice: pour ramener aussi … ceux qui s’y trouvaient
  rationale: Le participe futur exprime le but du voyage; « aussi » rend καί sans lui donner une valeur intensive injustifiée.
- source_word: δεδεμένους
  choice: enchaînés
  rationale: Ce terme exprime clairement l’état de détenus résultant de l’action de les lier, conformément au participe parfait passif.
- source_word: ἵνα τιμωρηθῶσιν
  choice: afin qu’ils soient punis
  rationale: La formulation conserve le but punitif sans préciser une peine que le texte ne nomme pas.
theological_decisions:
- issue: Portée de ἀδελφοί dans ce contexte communautaire
  choice: aux frères
  alternative: aux frères et sœurs; à leurs compatriotes juifs
  rationale: Le texte principal maintient la forme masculine du grec et son expression relationnelle sans identifier plus précisément le groupe. Une note préserve la possibilité que le terme désigne une communauté plus large.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement réorganisée pour une lecture naturelle, tout en conservant le témoignage corroborant, l’action en cours du voyage, l’état de captivité et le but punitif.
