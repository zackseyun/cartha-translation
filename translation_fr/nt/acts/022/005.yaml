  to: Comme le grand prêtre et tout le conseil des anciens peuvent eux aussi en témoigner en ma faveur, j’avais aussi reçu d’eux des lettres destinées aux frères de Damas[a], et je m’y rendais pour amener aussi à Jérusalem ceux qui s’y trouvaient, enchaînés, afin qu’ils soient punis.
