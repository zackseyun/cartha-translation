id: ACT.22.14
reference: Acts 22:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: fr
  text: 'Il dit : « Le Dieu de nos pères t’a choisi[a] pour connaître sa volonté, voir le Juste[b] et entendre une voix venant de sa bouche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désigné ». Le verbe grec évoque le choix ou la désignation de quelqu’un en vue d’une tâche.
    reason: lexical_alternative
  - marker: b
    text: « Le Juste » est ici un titre désignant Jésus. On pourrait aussi traduire « celui qui est juste ».
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: t’a choisi
  rationale: Le verbe προχειρίζομαι exprime ici le choix d’une personne en vue d’une mission. « T’a choisi » est naturel en français moderne et laisse les infinitifs suivants préciser le but de ce choix.
- source_word: γνῶναι
  choice: pour connaître
  rationale: L’infinitif aoriste de γινώσκω est rendu simplement par « connaître »; « apprendre à connaître » serait possible, mais introduirait ici une nuance plus marquée.
- source_word: τὸ θέλημα αὐτοῦ
  choice: sa volonté
  rationale: « Sa volonté » conserve l’étendue habituelle de θέλημα sans la réduire à son dessein ou à son désir.
- source_word: ἰδεῖν
  choice: voir
  rationale: « Voir » rend directement le sens ordinaire de l’infinitif, dans un registre actuel et digne.
- source_word: τὸν δίκαιον
  choice: le Juste
  rationale: Dans les Actes, l’expression fonctionne comme un titre appliqué à Jésus. « Le Juste » est une formulation française concise et bibliquement reconnaissable.
- source_word: ἀκοῦσαι φωνὴν
  choice: entendre une voix
  rationale: L’absence d’article devant φωνή se prête à « une voix »; le complément qui suit indique qu’il s’agit d’une parole directement prononcée.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: qui sort de sa bouche
  rationale: Cette formulation française naturelle conserve l’image concrète du grec et souligne le caractère direct de la parole entendue.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Le Dieu de nos pères
  rationale: Cette expression traditionnelle préserve le terme masculin πατέρων ainsi que le lien d’alliance avec les pères d’Israël.
theological_decisions:
- issue: 'Valeur de τὸν δίκαιον : titre christologique ou simple description'
  choice: « le Juste », avec une majuscule, comme titre désignant Jésus
  alternative: « le juste » comme simple description, ou « le Righteous One » rendu par « celui qui est juste »
  rationale: Les emplois parallèles en Actes 3.14 et 7.52 soutiennent la valeur titulaire. La majuscule la signale sans expliciter dans le corps du verset ce que le contexte permet d’identifier.
- issue: Traduction de « nos pères »
  choice: Conserver « nos pères »
  alternative: « nos ancêtres »
  rationale: « Pères » correspond formellement à πατέρων et conserve la résonance biblique et historique de l’expression, tandis que « ancêtres » serait plus inclusif mais moins précis lexicalement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la série des trois infinitifs grecs. « Le Juste » maintient la portée titulaire, et « qui sort de sa bouche » restitue naturellement l’image concrète de l’expression grecque.
