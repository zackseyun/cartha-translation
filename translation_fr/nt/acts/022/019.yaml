  source_fidelity: La construction périphrastique à l’imparfait est bien rendue par « j’emprisonnais et je battais », et « ceux qui croient en toi » rend fidèlement le participe présent avec πιστεύω + ἐπί. « Seigneur » est approprié pour Κύριε. En revanche, « dans chaque synagogue » peut suggérer que Paul a agi dans chacune des synagogues sans exception, universalité que le pluriel distributif κατὰ τὰς συναγωγάς n’impose pas nécessairement. « De synagogue en synagogue » conserve mieux la distribution et la répétition sans cette sur-précision.
  naturalness: Le français est généralement naturel, moderne et d’un registre convenable. « Eux-mêmes savent » rend plus directement l’emphase du pronom αὐτοί que « ils savent eux-mêmes », qui reste possible mais est légèrement moins net dans cette position.
  terminology: « Seigneur », « emprisonnais », « battais » et « croient en toi » sont cohérents avec les termes grecs et avec un français biblique international moderne. La note sur la foi offre des équivalents légitimes sans imposer une lecture doctrinale.
