  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: fr
  text: 'Et j’ai dit : « Seigneur, eux-mêmes savent que, de synagogue en synagogue[a], j’emprisonnais et je battais ceux qui croient en toi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les synagogues » ; l’expression grecque a une valeur distributive et indique une action répétée dans plusieurs synagogues.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui mettent leur confiance en toi » ou « qui se fient à toi ».
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: Et j’ai dit
  rationale: κἀγώ est la contraction de καὶ ἐγώ. « Et j’ai dit » restitue naturellement l’enchaînement narratif et le sens de l’aoriste εἶπον.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε s’adresse ici à Jésus. « Seigneur » conserve à la fois la déférence de l’adresse et sa portée christologique sans la préciser davantage.
- source_word: αὐτοὶ ἐπίστανται
  choice: ils savent eux-mêmes
  rationale: '« Eux-mêmes » rend l’emphase de αὐτοί : Paul souligne que les personnes en question connaissent personnellement sa conduite passée.'
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: j’emprisonnais et je battais
  rationale: La construction périphrastique à l’imparfait exprime une activité passée répétée ou habituelle. L’imparfait français en restitue naturellement l’aspect.
- source_word: κατὰ τὰς συναγωγάς
  choice: dans chaque synagogue
  rationale: κατά avec l’accusatif a ici une valeur distributive. « Dans chaque synagogue » exprime clairement la répétition de l’action en plusieurs lieux.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: ceux qui croient en toi
  rationale: Cette formulation française rend naturellement la foi dirigée vers Jésus, exprimée par πιστεύω avec ἐπί.
theological_decisions:
- issue: Traduction de κύριος dans une adresse à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve la formulation traditionnelle et la portée christologique possible du titre, sans imposer une interprétation doctrinale supplémentaire.
- issue: Valeur aspectuelle de la persécution passée de Paul
  choice: j’emprisonnais et je battais
  alternative: j’avais l’habitude d’emprisonner et de battre
  rationale: L’imparfait rend l’action passée répétée ou habituelle tout en restant plus concis et moins explicatif que l’alternative.
- issue: Nature de la foi exprimée par πιστεύοντας ἐπὶ σέ
  choice: ceux qui croient en toi
  alternative: ceux qui mettent leur confiance en toi
  rationale: « Croire en » conserve la formulation religieuse naturelle en français, tandis que la note signale la nuance possible de confiance sans réduire l’expression à une adhésion seulement intellectuelle.
translation_notes:
  register: Français international moderne, courant et digne. L’imparfait exprime l’ancienne conduite habituelle de Paul ; la répétition de « je » devant « battais » rend la coordination claire et naturelle. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
