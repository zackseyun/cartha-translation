  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: fr
  text: 'Quand le centurion entendit cela, il alla trouver le commandant et lui fit ce rapport : « Que vous apprêtez-vous à faire[a] ? Car cet homme est citoyen romain[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que comptez-vous faire ? » L’expression grecque peut évoquer aussi bien une action imminente qu’une action projetée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « cet homme est Romain ». Dans ce contexte, cela signifie qu’il possède la citoyenneté romaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Quand … entendit cela
  rationale: Le participe aoriste exprime ici une circonstance antérieure à l’action principale. Cette tournure française rend naturellement sa valeur temporelle.
- source_word: ἑκατοντάρχης
  choice: le centurion
  rationale: Terme français usuel et précis pour ce grade de l’armée romaine.
- source_word: προσελθὼν
  choice: il alla trouver
  rationale: Le participe indique que le centurion s’approche de son supérieur; « alla trouver » convient au mouvement narratif et au français courant.
- source_word: τῷ χιλιάρχῳ
  choice: le commandant
  rationale: Le terme grec désigne ici l’officier romain commandant la cohorte. « Commandant » est clair pour le lecteur moderne, contrairement au calque « chiliarque ».
- source_word: ἀπήγγειλεν
  choice: l’en informa
  rationale: Le verbe signifie transmettre ou rapporter une information. Le pronom « en » reprend naturellement en français ce que le centurion vient d’apprendre.
- source_word: λέγων
  choice: en disant
  rationale: Cette formulation conserve le lien participial entre l’information transmise et les paroles qui en donnent le contenu.
- source_word: Τί μέλλεις ποιεῖν;
  choice: Qu’est-ce que tu t’apprêtes à faire ?
  rationale: μέλλω suivi de l’infinitif peut exprimer une action imminente ou projetée. « T’apprêtes à faire » met en avant l’imminence sans exclure entièrement l’intention.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: Car cet homme
  rationale: Rend directement l’explication introduite par γάρ et la référence masculine de ἄνθρωπος dans ce contexte.
- source_word: Ῥωμαῖός ἐστιν
  choice: est citoyen romain
  rationale: Dans ce contexte juridique, « Romain » désigne le statut civique. La formulation explicite ce sens pour les lecteurs modernes.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’adresse directe entre officiers dans cette scène, sans ajouter de marque de politesse absente du grec. Les deux notes préservent l’ambiguïté de μέλλω et la formulation littérale de Ῥωμαῖος.
