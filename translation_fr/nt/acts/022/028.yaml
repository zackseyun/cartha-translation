  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: fr
  text: 'Mais le tribun répondit : « Moi, j’ai acquis cette citoyenneté[a] pour une forte somme. » Paul dit : « Mais moi, je suis même né citoyen[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la citoyenneté romaine.
    reason: contextual_clarification
  - marker: b
    text: 'Littéralement : « Mais moi, je suis même né », la citoyenneté étant sous-entendue d’après le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: tribun
  rationale: Titre historiquement précis pour l’officier romain qui commandait approximativement mille hommes; le contexte militaire permet au lecteur moderne de le comprendre.
- source_word: πολλοῦ κεφαλαίου
  choice: pour une forte somme
  rationale: Rend naturellement l’expression idiomatique désignant une importante somme d’argent versée pour obtenir ce statut.
- source_word: πολιτείαν
  choice: droit de citoyen
  rationale: Dans ce contexte, le terme désigne le statut juridique de citoyen romain. Cette formulation française est naturelle et prépare la reprise pronominale de la réponse de Paul.
- source_word: ἐκτησάμην
  choice: j’ai acquis
  rationale: Conserve le sens général d’obtenir pour soi sans préciser davantage que le grec le mode exact d’acquisition, tandis que la forte somme implique le paiement.
- source_word: καὶ γεγέννημαι
  choice: je l’ai de naissance
  rationale: Exprime en français idiomatique l’état résultant d’une naissance avec ce statut, sous-entendu en grec, et maintient le contraste emphatique marqué par καί.
- source_word: δέ
  choice: mais / alors / et
  rationale: La particule structure le dialogue et le contraste. Ses occurrences sont rendues selon leur fonction discursive naturelle en français plutôt que répétées mécaniquement.
- source_word: ἔφη
  choice: dit
  rationale: Verbe de parole simple, sans ajout de force rhétorique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre l’acquisition coûteuse du tribun et le statut de naissance de Paul est maintenu sans surinterpréter le moyen juridique précis par lequel le tribun l’avait acquis.
