id: ACT.22.8
reference: Acts 22:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: fr
  text: 'Je répondis : « Qui es-tu, Seigneur[a] ? » Il me dit : « Je suis Jésus le Nazaréen[b], celui que tu persécutes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître » ou « monsieur ». Le grec κύριε peut être une formule de respect aussi bien que le titre « Seigneur ».
    reason: alternative_reading
  - marker: b
    text: Ou « Jésus de Nazareth » ou « Jésus le Nazôréen ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: Je répondis
  rationale: L’aoriste de ἀποκρίνομαι exprime ici une réponse ponctuelle dans le récit; le passé simple convient au registre narratif biblique moderne et soutenu.
- source_word: Τίς εἶ
  choice: Qui es-tu ?
  rationale: Traduction directe et naturelle de l’interrogatif suivi de la copule.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve le titre habituel de κύριος et la portée christologique possible du récit, sans nier que le mot puisse d’abord être une formule de respect.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: Il me dit
  rationale: Formulation française idiomatique; la particule connective τε n’exige pas nécessairement un « et » explicite après la phrase précédente.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Je suis Jésus
  rationale: Identification directe, sans ajout interprétatif.
- source_word: ὁ Ναζωραῖος
  choice: le Nazaréen
  rationale: Cette forme conserve l’épithète grecque substantivée plus précisément que « de Nazareth », tout en restant intelligible en français.
- source_word: ὃν σὺ διώκεις
  choice: celui que tu persécutes
  rationale: « Persécuter » rend le sens hostile de διώκω dans ce contexte; « celui que » est naturel en français et le présent conserve l’action en cours.
theological_decisions:
- issue: Sens de κύριε dans l’adresse de Saul
  choice: Seigneur
  alternative: Maître; monsieur
  rationale: Le texte permet à la fois une adresse respectueuse et la lecture du titre « Seigneur ». Le texte principal maintient « Seigneur », tandis que la note préserve l’ambiguïté liée au degré de compréhension de Saul à cet instant.
- issue: Désignation ὁ Ναζωραῖος
  choice: le Nazaréen
  alternative: de Nazareth; le Nazôréen
  rationale: « Le Nazaréen » préserve la forme d’épithète du grec sans transformer explicitement celle-ci en simple indication d’origine; les équivalents possibles sont signalés en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient un registre narratif soutenu sans archaïsme marqué. Les notes conservent les ambiguïtés lexicales de κύριε et Ναζωραῖος.
