id: ACT.22.21
reference: Acts 22:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: fr
  text: 'Et il m’a dit : « Va, car moi, je t’enverrai au loin, vers les non-Juifs[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: il m’a dit
  rationale: La construction λέγω avec πρός et l’accusatif introduit ici des paroles directement adressées à Paul. « Il m’a dit » est naturel et fidèle au style narratif.
- source_word: Πορεύου
  choice: Va
  rationale: L’impératif présent de πορεύομαι fonctionne idiomatiquement comme un ordre de partir ou d’aller. « Va » est direct, courant et digne.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit la raison de l’ordre. « Car » exprime clairement ce lien causal tout en convenant au registre du discours rapporté.
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom sujet explicite ἐγώ est emphatique en grec. « Moi, je » conserve cette insistance sans recours à la typographie.
- source_word: εἰς ἔθνη
  choice: vers les non-Juifs
  rationale: Dans ce contexte missionnaire des Actes, ἔθνη désigne les peuples autres que le peuple juif. « Les non-Juifs » rend cette distinction clairement en français moderne; « les nations » demeure une possibilité lexicale signalée en note.
- source_word: μακρὰν
  choice: au loin
  rationale: L’adverbe marque l’éloignement. « Au loin » restitue de façon concise et naturelle la portée géographique du terme.
- source_word: ἐξαποστελῶ
  choice: j’enverrai
  rationale: Le futur de ἐξαποστέλλω signifie envoyer au loin ou envoyer en mission. « J’enverrai » rend le sens principal sans expliciter excessivement la nuance de mandat.
- source_word: σε
  choice: te
  rationale: Le pronom est le complément d’objet direct singulier du verbe « envoyer ».
theological_decisions:
- issue: Sens de ἔθνη dans le contexte de la mission apostolique
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contexte immédiat oppose Paul à son auditoire juif et évoque sa mission auprès des peuples non juifs. « Les non-Juifs » préserve clairement cette distinction historique et théologique; la traduction plus formelle « les nations » est conservée en note afin de ne pas masquer l’étendue lexicale du grec.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre bref « Va » et l’emphase « moi, je » conservent la force du grec. « Non-Juifs » est préféré à « païens », qui peut aujourd’hui suggérer un jugement religieux absent du terme lui-même.
