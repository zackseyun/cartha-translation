id: ACT.22.3
reference: Acts 22:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: fr
  text: « Je suis Juif, né à Tarse en Cilicie, mais j’ai été élevé dans cette ville, aux pieds de Gamaliel[a], et formé dans toute la rigueur de la Loi de nos pères[b]. Je suis plein de zèle pour Dieu, comme vous l’êtes tous aujourd’hui. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression désignant la formation reçue auprès d’un maître.
    reason: cultural_note
  - marker: b
    text: 'Ou : « de la Loi ancestrale ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: Je suis Juif
  rationale: En français courant, « je suis Juif » exprime naturellement l’identité désignée par l’ensemble grec. « Je suis un homme juif » serait plus formellement explicite pour ἀνήρ, mais sensiblement moins idiomatique dans ce discours.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: né à Tarse en Cilicie
  rationale: Cette formulation française rend naturellement le participe parfait et explicite sans lourdeur la localisation de Tarse en Cilicie.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: mais j’ai été élevé dans cette ville
  rationale: ἀνατρέφω désigne ici l’éducation reçue pendant la jeunesse. « Mais » fait ressortir le contraste entre le lieu de naissance et le lieu où Paul a grandi.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: aux pieds de Gamaliel
  rationale: L’image concrète du disciple assis auprès de son maître est conservée; une note en précise la valeur pédagogique.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: formé dans toute la rigueur
  rationale: « Formé » convient à l’instruction reçue auprès d’un maître, tandis que « dans toute la rigueur » communique l’idée d’exactitude et de stricte conformité portée par ἀκρίβεια.
- source_word: τοῦ πατρῴου νόμου
  choice: de la Loi de nos pères
  rationale: « De nos pères » rend l’héritage ancestral et fait entendre la solidarité rhétorique de Paul avec son auditoire juif. La majuscule à « Loi » signale ici la Torah plutôt qu’une règle indéterminée.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: Je suis plein de zèle pour Dieu
  rationale: Cette expression garde la force de ζηλωτής sans employer « zélote », qui pourrait suggérer à tort une affiliation politique technique.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: comme vous l’êtes tous aujourd’hui
  rationale: La comparaison, l’inclusion de tout l’auditoire et la portée temporelle de « aujourd’hui » sont toutes préservées.
theological_decisions:
- issue: Solidarité de Paul avec son auditoire dans τοῦ πατρῴου νόμου
  choice: la Loi de nos pères
  alternative: la Loi ancestrale
  rationale: Le grec signifie la Loi héritée des ancêtres. Dans ce discours, « nos pères » rend naturellement le patrimoine partagé que Paul invoque, sans ajouter de particularité confessionnelle.
- issue: Valeur de ζηλωτής appliqué au rapport à Dieu
  choice: plein de zèle pour Dieu
  alternative: zélateur de Dieu
  rationale: Le choix retenu décrit une ferveur religieuse sans trancher au-delà du texte la question d’une éventuelle connotation politique du terme.
- issue: Maintien de l’image pédagogique παρὰ τοὺς πόδας Γαμαλιήλ
  choice: aux pieds de Gamaliel
  alternative: sous la direction de Gamaliel
  rationale: L’expression littérale conserve l’image historique du rapport entre disciple et maître; la note évite qu’elle soit comprise comme une simple indication spatiale.
translation_notes:
  register: Français international moderne, oral mais digne, adapté à une défense publique. La phrase grecque a été légèrement articulée en français afin d’éviter une longue accumulation de participes. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
