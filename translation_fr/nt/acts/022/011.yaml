id: ACT.22.11
reference: Acts 22:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: fr
  text: Comme je ne pouvais pas voir à cause de l’éclat de cette lumière[a], ceux qui étaient avec moi m’ont conduit par la main, et je suis arrivé à Damas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « à cause de la gloire de cette lumière ».'
    reason: Alternative lexicale pour δόξα, dont « éclat » exprime ici la manifestation lumineuse concrète.
lexical_decisions:
- source_word: ὡς δὲ
  choice: Comme
  rationale: Introduit naturellement en français la circonstance qui explique pourquoi Paul a dû être conduit, tout en assurant la continuité du récit.
- source_word: οὐκ ἐνέβλεπον
  choice: je ne pouvais pas voir
  rationale: Dans le contexte de l’aveuglement provoqué par la lumière, le verbe désigne l’incapacité de voir, et non simplement de fixer le regard.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: à cause de l’éclat de cette lumière
  rationale: La préposition exprime ici la cause. « Éclat » rend la splendeur lumineuse concrète de δόξα sans effacer la traduction plus formelle « gloire », conservée en note.
- source_word: χειραγωγούμενος
  choice: m’ont conduit par la main
  rationale: Cette formulation française naturelle conserve l’image précise d’une personne guidée par la main.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: ceux qui étaient avec moi
  rationale: Rend directement le participe sans préciser davantage la nature du groupe.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: je suis arrivé à Damas
  rationale: Expression idiomatique en français qui rend clairement le mouvement jusqu’à Damas; traduire littéralement εἰς par « dans » serait moins naturel ici.
theological_decisions:
- issue: Traduction de δόξα dans un contexte de manifestation céleste
  choice: éclat
  alternative: gloire
  rationale: Dans cette phrase, δόξα désigne directement le rayonnement de la lumière qui empêche Paul de voir. « Éclat » communique cet effet concret, tandis que la note préserve la valeur lexicale et théologique possible de « gloire ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe réorganise légèrement le participe grec afin d’éviter une tournure lourde, tout en conservant le rapport causal et le détail de la conduite par la main.
