id: ACT.22.13
reference: Acts 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλθὼν πρὸς ⸀ἐμὲ καὶ ἐπιστὰς εἶπέν μοι· Σαοὺλ ἀδελφέ, ἀνάβλεψον· κἀγὼ αὐτῇ τῇ ὥρᾳ ἀνέβλεψα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: fr
  text: 'Il vint vers moi, se tint près de moi et me dit : « Saul, mon frère, retrouve la vue ! » À cette heure même, je retrouvai la vue et je le regardai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même verbe grec peut aussi signifier « lève les yeux ». Ici, le contexte de la cécité et de la guérison favorise le sens « retrouve la vue » dans les deux occurrences.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: Il vint vers moi
  rationale: Cette formulation rend naturellement le participe aoriste et conserve le mouvement en direction de Paul exprimé par πρός avec l’accusatif.
- source_word: ἐπιστάς
  choice: se tint près de moi
  rationale: Le participe indique qu’Ananias prend place à proximité de Paul; cette tournure française exprime clairement sa position sans alourdir le récit.
- source_word: Σαοὺλ ἀδελφέ
  choice: Saul, mon frère
  rationale: Le vocatif ἀδελφέ est rendu par l’adresse française idiomatique « mon frère », qui exprime le lien de fraternité sans en faire un titre.
- source_word: ἀνάβλεψον / ἀνέβλεψα
  choice: retrouve la vue / je retrouvai la vue
  rationale: Dans le contexte immédiat de la cécité et de la guérison de Paul, ἀναβλέπω désigne le rétablissement de la vue plutôt que le simple fait de lever les yeux. La répétition du même verbe français reflète celle du grec.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: À cette heure même
  rationale: La tournure conserve l’insistance grecque sur le moment précis, sans la réduire au seul adverbe « immédiatement ».
- source_word: εἰς αὐτόν
  choice: je le regardai
  rationale: Le verbe sous-entendu avec εἰς αὐτόν décrit le regard désormais dirigé vers Ananias; « le regardai » en restitue naturellement la force directionnelle.
- source_word: κἀγώ
  choice: je
  rationale: Le sujet exprimé est naturellement inclus dans « je retrouvai »; le lien narratif est porté par la phrase temporelle précédente, sans qu’il soit nécessaire de surtraduire καί.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au récit suivi; le discours direct demeure vif et naturel. La ponctuation française et l’adresse « Saul, mon frère » suivent l’usage contemporain.
