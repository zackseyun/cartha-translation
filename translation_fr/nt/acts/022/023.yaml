  text: ⸀κραυγαζόντων ⸀τε αὐτῶν καὶ ῥιπτούντων τὰ ἱμάτια καὶ κονιορτὸν βαλλόντων εἰς τὸν ἀέρα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/023.yaml
  text: And as they were shouting and throwing off their cloaks and flinging dust into the air,[a]
translation:
  language: fr
  text: Tandis qu’ils criaient, jetaient leurs manteaux[a] et lançaient de la poussière en l’air,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jetaient leurs vêtements » ou « se débarrassaient de leurs vêtements ». Le grec peut désigner le fait de lancer des vêtements au loin ou de les agiter sous le coup de l’excitation.
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγαζόντων
  choice: criaient
  rationale: Le participe présent décrit une action continue et simultanée aux deux autres gestes. « Criaient » est naturel et rend l’éclat bruyant de la foule.
- source_word: τε
  choice: tandis que… [coordination par virgules et « et »]
  rationale: La particule relie les actions concomitantes; la syntaxe française les coordonne naturellement sans traduction lexicale autonome.
- source_word: αὐτῶν
  choice: ils
  rationale: Le génitif grec fournit le sujet de la construction participiale; une proposition avec « ils » est idiomatique en français.
- source_word: ῥιπτούντων
  choice: jetaient
  rationale: Le verbe signifie jeter ou lancer. Le choix conserve sa valeur générale et, avec la note, évite de trancher entre le fait de se débarrasser des vêtements et celui de les agiter ou de les lancer.
- source_word: τὰ ἱμάτια
  choice: leurs manteaux
  rationale: Ἱμάτια désigne couramment les vêtements de dessus. « Manteaux » est concret et naturel, tout en restant assez large dans ce contexte.
- source_word: κονιορτόν
  choice: de la poussière
  rationale: Équivalent français direct du nom grec, adapté au geste public d’agitation décrit.
- source_word: βαλλόντων
  choice: lançaient
  rationale: « Lançaient » rend l’action énergique de βάλλω et évite de répéter immédiatement « jetaient ».
- source_word: εἰς τὸν ἀέρα
  choice: en l’air
  rationale: Expression française idiomatique correspondant exactement à la direction indiquée par le grec.
