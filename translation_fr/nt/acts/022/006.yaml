id: ACT.22.6
reference: Acts 22:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: fr
  text: 'Voici ce qui m’est arrivé : alors que j’étais en chemin et que j’approchais de Damas, vers midi, une lumière intense[a] venue du ciel a soudain resplendi autour de moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande lumière ». L’expression grecque peut souligner la grandeur ou l’intensité de la lumière.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: Alors que…
  rationale: La tournure grecque introduit ce qui est arrivé à Paul. En français actuel, son rôle narratif s’intègre naturellement à la proposition circonstancielle, sans le calque lourd « Il m’est arrivé que »; la perspective à la première personne demeure explicite.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: j’étais en chemin et j’approchais de Damas
  rationale: Les deux participes présents décrivent des actions en cours et simultanées. « Être en chemin » et « approcher de Damas » sont naturels et conservent cette progression.
- source_word: περὶ μεσημβρίαν
  choice: vers midi
  rationale: Rend avec naturel l’heure approximative indiquée par περὶ.
- source_word: ἐξαίφνης
  choice: soudain
  rationale: Conserve le caractère brusque de l’événement.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venant du ciel
  rationale: « Du ciel » préserve la possible portée transcendante de οὐρανός dans ce récit, plutôt que de réduire la provenance à un phénomène atmosphérique.
- source_word: περιαστράψαι
  choice: a resplendi tout autour
  rationale: Le verbe composé exprime une lumière qui brille ou jaillit en enveloppant la personne; « tout autour » rend clairement la valeur spatiale de περι-.
- source_word: φῶς ἱκανὸν
  choice: une vive lumière
  rationale: Dans ce contexte, ἱκανός marque le caractère considérable ou intense de la lumière. « Vive lumière » est une formulation française naturelle, tout en laissant en note l’autre nuance possible.
- source_word: περὶ ἐμέ
  choice: autour de moi
  rationale: Rend directement la relation spatiale exprimée par περὶ avec l’accusatif.
theological_decisions:
- issue: Sens de οὐρανός dans ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  alternative: du firmament / d’en haut
  rationale: Le contexte de l’apparition racontée dans les Actes favorise « ciel », qui conserve à la fois l’image spatiale et la possible origine divine, sans expliciter davantage que le grec.
translation_notes:
  register: Français international moderne, oralement fluide mais digne, adapté au témoignage de Paul. La syntaxe évite un calque pesant de l’expression introductive grecque. Le marqueur de note est placé après l’expression qu’il précise.
