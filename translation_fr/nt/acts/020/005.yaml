    issue: Nuance de προσελθόντες
    rationale: « Étaient arrivés avant nous » est acceptable dans le contexte, mais « nous avaient devancés » reflète plus précisément le mouvement en avant des compagnons et leur antériorité par rapport au groupe de l’auteur.
  - severity: low
    issue: Formulation de la note
    rationale: « S’étant avancés » est peu naturel et reste ambigu en français. Une formulation avec « nous avaient précédés » fournit une alternative plus intelligible et plus proche de la structure source.
