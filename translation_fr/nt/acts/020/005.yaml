review_pass:
  verdict: revise
  source_fidelity: Le sens contextuel de προσελθόντες est bien celui d’un déplacement en avant du groupe de l’auteur, suivi de l’attente à Troas. « Étaient arrivés avant nous » communique globalement ce sens, mais peut laisser entendre seulement une antériorité d’arrivée plutôt que le fait de les avoir devancés. « Nous avaient devancés » rend plus directement la relation exprimée par le participe dans le récit de voyage. L’imparfait « attendaient » et le lieu « à Troas » sont fidèles.
  naturalness: « Ces hommes nous avaient devancés et nous attendaient à Troas » est idiomatique, clair et d’un registre biblique moderne naturel. « Ceux-ci » est possible, mais « Ces hommes » est plus fluide en français actuel tout en explicitant le pluriel masculin référant aux compagnons précédemment nommés.
  terminology: Troas est correctement conservé. Aucun terme théologique spécialisé n’est en jeu. La note proposée donne une possibilité plus proche de la construction participiale sans imposer une interprétation supplémentaire.
  issues:
