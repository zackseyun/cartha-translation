  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: fr
  text: Ces hommes nous avaient devancés et nous attendaient à Troas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Ces hommes, nous ayant précédés, nous attendaient à Troas. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Ceux-ci
  rationale: Le démonstratif masculin pluriel renvoie aux compagnons nommés juste auparavant. « Ceux-ci » garde ce lien explicite sans ajouter un nom absent du grec.
- source_word: δὲ
  choice: —
  rationale: δέ est ici un connecteur léger. Le français naturel n’exige pas de conjonction explicite dans cette phrase.
- source_word: προσελθόντες
  choice: étaient arrivés avant nous
  rationale: Le participe aoriste indique une action antérieure à celle d’attendre. Dans ce récit de voyage, la formulation rend naturellement le fait que ces compagnons étaient déjà arrivés à Troas lorsque le groupe du narrateur devait les rejoindre. « Avant nous » explicite la relation impliquée par la suite de la phrase, sans reprendre mécaniquement l’anglais.
- source_word: ἔμενον
  choice: attendaient
  rationale: Avec ἡμᾶς comme complément dans ce contexte de déplacement, μένω exprime l’idée de rester sur place dans l’attente de quelqu’un. L’imparfait « attendaient » restitue l’action en cours.
- source_word: ἡμᾶς
  choice: nous
  rationale: Rendu direct du pronom personnel de première personne du pluriel à l’accusatif.
- source_word: ἐν Τρῳάδι
  choice: à Troas
  rationale: En français, la préposition « à » est la tournure locative normale devant le nom de la ville de Troas.
