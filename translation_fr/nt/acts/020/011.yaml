id: ACT.20.11
reference: Acts 20:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: fr
  text: Puis il remonta, rompit le pain[a] et mangea[b]. Après avoir parlé longtemps, jusqu’à l’aube, il partit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « rompre le pain » peut désigner le partage d’un repas ; certains y comprennent ici aussi le repas du Seigneur.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « goûta » ; le verbe peut aussi signifier « prit de la nourriture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: il remonta
  rationale: Le participe aoriste de ἀναβαίνω indique ici que Paul remonte dans la pièce située à l’étage après être descendu. « Il remonta » exprime naturellement ce retour sans ajouter explicitement « à l’étage », déjà clair dans le contexte.
- source_word: κλάσας τὸν ἄρτον
  choice: rompit le pain
  rationale: Cette traduction conserve l’article défini et l’action concrète du grec, sans décider si l’expression désigne un repas ordinaire, un repas communautaire ou la cène.
- source_word: γευσάμενος
  choice: mangea
  rationale: Dans le contexte d’un repas, γεύομαι peut désigner le fait de manger ou de prendre de la nourriture, et non simplement d’en goûter une petite quantité. « Mangea » est naturel en français moderne.
- source_word: ἐφ’ ἱκανόν
  choice: longtemps
  rationale: L’expression indique une durée considérable. « Longtemps » en donne le sens avec clarté et concision.
- source_word: ὁμιλήσας
  choice: après avoir parlé
  rationale: ὁμιλέω désigne ici un échange ou un discours prolongé. « Parlé » reste naturel et assez large pour ne pas imposer la forme précise de cette communication.
- source_word: ἄχρι αὐγῆς
  choice: jusqu’à l’aube
  rationale: αὐγή désigne l’aube ou le point du jour. « Jusqu’à l’aube » est une formulation française courante et précise.
- source_word: οὕτως ἐξῆλθεν
  choice: il partit
  rationale: Le verbe exprime le départ de Paul au terme de cette séquence. Le lien récapitulatif marqué par οὕτως est naturellement porté en français par l’enchaînement narratif, sans qu’un lourd « ainsi » soit nécessaire.
theological_decisions:
- issue: 'La portée de κλάσας τὸν ἄρτον : repas ou cène'
  choice: 'Traduction neutre : « rompit le pain »'
  alternative: Préciser qu’il célébra la cène, ou comprendre l’expression comme la simple prise d’un repas
  rationale: Dans les Actes, l’expression peut avoir des résonances eucharistiques, mais le verset ne tranche pas explicitement. La traduction garde donc la formulation concrète du grec et signale l’ambiguïté en note.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase suit l’ordre narratif grec tout en évitant une accumulation pesante de participes. Les notes sont placées sur les expressions auxquelles elles se rapportent.
