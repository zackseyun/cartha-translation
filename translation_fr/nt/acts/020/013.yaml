  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: fr
  text: Quant à nous, nous avons pris les devants, sommes montés à bord du bateau et avons fait voile vers Assos, avec l’intention d’y prendre Paul à bord. Il en avait décidé ainsi[b], car il voulait lui-même s’y rendre à pied[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par voie de terre ». Le verbe grec peut désigner un déplacement à pied ou, plus largement, par voie terrestre, par opposition au voyage en bateau.
    reason: lexical_alternative
  - marker: b
    text: Ou « cela avait été fixé ainsi ». La forme grecque peut se comprendre comme renvoyant à la décision de Paul ou comme une formulation passive de l’arrangement.
    reason: alternative_reading
lexical_decisions:
- source_word: προελθόντες
  choice: nous avons pris les devants
  rationale: Le participe aoriste exprime une action antérieure au départ en mer et indique que le groupe du narrateur est parti avant Paul.
- source_word: ἐπὶ τὸ πλοῖον
  choice: jusqu’au bateau
  rationale: Avec un verbe de mouvement, l’expression désigne le déplacement vers le bateau; le départ qui suit implique naturellement l’embarquement.
- source_word: ἀνήχθημεν
  choice: nous avons fait voile
  rationale: Dans ce contexte maritime, ἀνάγω signifie prendre la mer ou mettre à la voile. « Faire voile » est une formulation française naturelle et digne.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: vers Assos
  rationale: La préposition marque ici la destination du voyage maritime; « Assos » est la translittération française courante.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: avec l’intention de prendre … à bord
  rationale: μέλλω exprime ici un projet, et ἀναλαμβάνω désigne le fait de prendre Paul avec eux sur le bateau.
- source_word: ἐκεῖθεν
  choice: y
  rationale: Dans un français naturel, « y prendre Paul à bord » situe l’embarquement à Assos et rend fonctionnellement la valeur locale de l’adverbe, littéralement « de là ».
- source_word: διατεταγμένος ἦν
  choice: il en avait décidé ainsi
  rationale: La tournure périphrastique renvoie vraisemblablement à une décision ou disposition antérieure de Paul. La formulation française conserve cette antériorité sans préciser indûment tous les détails de l’arrangement.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: car il voulait lui-même s’y rendre à pied
  rationale: Le participe donne la raison de la disposition prise; αὐτός est emphatique, et πεζεύειν oppose le trajet de Paul au voyage maritime du groupe.
- source_word: δὲ
  choice: Quant à nous
  rationale: δέ introduit un contraste modéré entre le groupe du narrateur et Paul. « Quant à nous » rend clairement ce changement de sujet sans contraste excessif.
