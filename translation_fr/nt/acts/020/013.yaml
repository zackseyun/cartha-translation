  terminology: « Assos », « faire voile », « prendre ... à bord » et « à pied » conviennent au récit de voyage. La note sur πεζεύειν préserve utilement l’alternative « par voie de terre ». La formulation concernant la disposition antérieure reste prudente grâce à la note.
