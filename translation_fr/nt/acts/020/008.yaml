  text: ἦσαν δὲ λαμπάδες ἱκαναὶ ἐν τῷ ὑπερῴῳ οὗ ἦμεν συνηγμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/008.yaml
  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: fr
  text: Il y avait beaucoup de lampes dans la pièce à l’étage où nous étions réunis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torches ». Le terme grec peut désigner plus largement des sources de lumière portatives, mais, dans cette pièce intérieure, « lampes » est plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: non traduit explicitement
  rationale: δέ est ici un connecteur léger. En français, la continuité narrative se rend naturellement sans ajouter « alors » ou « or », qui risqueraient de suggérer une valeur temporelle ou argumentative plus forte.
- source_word: λαμπάδες
  choice: lampes
  rationale: λαμπάς peut désigner une lampe ou une torche. Dans une pièce intérieure à l’étage, « lampes » est le terme le plus probable et le plus naturel.
- source_word: ἱκαναὶ
  choice: beaucoup de
  rationale: Dans ce contexte, ἱκανός indique un nombre considérable. « Beaucoup de » exprime clairement cette quantité sans introduire l’idée de suffisance.
- source_word: ὑπερῴῳ
  choice: pièce à l’étage
  rationale: ὑπερῷον désigne une pièce située dans la partie supérieure d’une maison. « Pièce à l’étage » est précis, moderne et immédiatement compréhensible.
- source_word: οὗ
  choice: où
  rationale: L’adverbe relatif de lieu se rend naturellement par « où ».
- source_word: συνηγμένοι
  choice: réunis
  rationale: Le participe parfait passif décrit le groupe dans l’état résultant de son rassemblement. « Réunis » conserve ce sens collectif de façon concise et idiomatique.
- source_word: ἦσαν ... ἦμεν
  choice: il y avait ... nous étions
  rationale: Les deux imparfaits de εἰμί décrivent l’arrière-plan de la scène. L’imparfait français en restitue naturellement la valeur descriptive.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Pièce à l’étage » évite le caractère plus traditionnel ou potentiellement spécialisé de « chambre haute ». Le pronom « nous » est maintenu conformément au témoignage direct du texte.
