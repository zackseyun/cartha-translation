  text: Καὶ ταῦτα εἰπὼν θεὶς τὰ γόνατα αὐτοῦ σὺν πᾶσιν αὐτοῖς προσηύξατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/036.yaml
  text: And after saying these things, he knelt down with them all and prayed.
translation:
  language: fr
  text: Après avoir dit cela, il s’est mis à genoux avec eux tous et a prié.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Après avoir dit cela
  rationale: La coordination grecque introduit la suite du récit. En français, l’enchaînement est rendu naturellement par la proposition participiale initiale, sans qu’il soit nécessaire d’ajouter « et ».
- source_word: ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime une action antérieure à la prière. Cette formulation moderne conserve clairement la succession temporelle.
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: il s’est mis à genoux
  rationale: L’expression signifie littéralement « ayant posé ses genoux » et constitue un idiome décrivant l’action de s’agenouiller. Le français retenu est naturel sans suggérer une chute brusque.
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: avec eux tous
  rationale: σύν marque l’accompagnement et πᾶσιν souligne que l’ensemble du groupe était associé à Paul. « Avec eux tous » préserve cette portée.
- source_word: προσηύξατο
  choice: a prié
  rationale: Forme aoriste de προσεύχομαι, verbe courant pour adresser une prière. « A prié » en est l’équivalent français direct et naturel.
theological_decisions: []
