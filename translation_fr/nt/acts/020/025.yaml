id: ACT.20.25
reference: Acts 20:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: fr
  text: 'Et maintenant, voici : je sais qu’aucun de vous tous, au milieu desquels j’ai circulé en proclamant le royaume, ne reverra plus mon visage.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Marque naturellement en français l’appel à l’attention introduit par le grec, sans lourdeur archaïque.
- source_word: διῆλθον
  choice: je suis passé
  rationale: Conserve l’idée du déplacement de Paul au milieu des destinataires, plutôt que de réduire le verbe à sa seule activité de prédication.
- source_word: κηρύσσων
  choice: en proclamant
  rationale: Rend la proclamation publique exprimée par le participe présent grec.
- source_word: βασιλείαν
  choice: règne de Dieu
  rationale: Dans ce contexte apostolique, « règne » exprime la souveraineté active plus clairement que « royaume »; « de Dieu » est explicité d’après le contexte et une variante textuelle bien attestée, signalée en note.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: ne reverra mon visage
  rationale: Expression française naturelle qui garde l’image sémitique du visage et la valeur future de « ne plus voir ».
theological_decisions:
- issue: Référent de « le règne »
  choice: le règne de Dieu[a]
  alternative: le règne
  rationale: Le texte principal SBLGNT cité lit seulement « le règne », mais le référent divin est implicite dans le contexte et explicite dans une variante ancienne; la note préserve la donnée textuelle au lieu de la masquer.
- issue: Portée de la négation
  choice: aucun de vous … ne reverra mon visage
  alternative: vous tous … ne reverrez plus mon visage
  rationale: Cette formulation rend naturellement en français οὐκέτι avec ὑμεῖς πάντες sans suggérer que seuls certains destinataires seraient concernés.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Voici » conserve la force discursive de ἰδού; la phrase garde le ton solennel des adieux de Paul sans archaïsmes.
