id: ACT.20.1
reference: Acts 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: fr
  text: Après que le tumulte eut cessé, Paul fit venir les disciples. Après les avoir encouragés et avoir pris congé d’eux[a], il partit pour la Macédoine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les avoir salués » ; le verbe grec peut désigner aussi bien une salutation que, dans un contexte de départ, le fait de prendre congé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι
  choice: Quand … eut cessé
  rationale: La construction avec μετά et l’infinitif articulaire situe l’action principale après la fin de l’événement précédent. Le passé antérieur exprime clairement cette antériorité dans un récit au passé.
- source_word: θόρυβον
  choice: l’agitation
  rationale: Dans le contexte de l’émeute à Éphèse, le terme désigne un tumulte collectif. « Agitation » est naturel en français et reprend adéquatement la scène précédente.
- source_word: μεταπεμψάμενος
  choice: fit venir
  rationale: Le participe moyen signifie que Paul envoya chercher les disciples afin qu’ils viennent auprès de lui. « Fit venir » rend ce sens directement et naturellement.
- source_word: τοὺς μαθητὰς
  choice: les disciples
  rationale: Le terme désigne ici les personnes qui suivent Jésus et conserve le vocabulaire caractéristique de Luc dans les Actes.
- source_word: παρακαλέσας
  choice: Après les avoir encouragés
  rationale: παρακαλέω peut évoquer l’exhortation, l’encouragement ou la consolation. Dans ce contexte de départ après une crise, « encouragés » garde une portée assez large sans imposer une nuance unique.
- source_word: ἀσπασάμενος
  choice: avoir pris congé d’eux
  rationale: Le verbe signifie couramment « saluer », mais, dans un contexte de départ, il peut désigner le fait de prendre congé. Le texte retient ce sens contextuel tout en signalant l’autre possibilité en note.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: il partit pour la Macédoine
  rationale: Dans ce récit de voyage, ἐξῆλθεν marque le départ et l’infinitif précise la destination envisagée. Cette formulation française est concise et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe grecque participiale est répartie en deux phrases pour une lecture naturelle, sans perdre la succession des actions. Le marqueur de note est placé après l’expression concernée.
