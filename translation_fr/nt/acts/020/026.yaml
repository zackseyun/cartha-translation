  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: fr
  text: 'C’est pourquoi je vous l’atteste aujourd’hui : je suis innocent du sang de tous[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pur du sang de tous » ; l’expression grecque signifie que Paul est dégagé de toute culpabilité ou responsabilité à l’égard des autres.
    reason: lexical_alternative
  - marker: b
    text: Cette formulation fait probablement écho à l’image de la sentinelle chez Ézéchiel, où il est question de la culpabilité de sang (voir Ézéchiel 3.18-19 ; 33.6-9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: C’est pourquoi
  rationale: Dans le contexte, le mot introduit la conclusion que Paul tire de ce qu’il vient d’affirmer. « C’est pourquoi » rend clairement ce lien logique en français naturel.
- source_word: μαρτύρομαι
  choice: je vous déclare
  rationale: Le verbe exprime ici une déclaration personnelle et solennelle. « Je vous déclare » est actuel et naturel, tout en conservant cette force testimoniale.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: aujourd’hui
  rationale: L’expression grecque a une tournure solennelle, mais « aujourd’hui » en transmet clairement la portée temporelle sans produire en français une formulation artificielle.
- source_word: καθαρός
  choice: innocent
  rationale: Avec la mention du sang, l’adjectif désigne l’absence de culpabilité ou de responsabilité. « Innocent » communique ce sens moral et juridique plus clairement que le calque « pur ».
- source_word: ἀπὸ τοῦ αἵματος
  choice: du sang
  rationale: La construction appartient à une expression biblique relative à la culpabilité de sang. « Innocent du sang » en conserve l’image et la portée sans la remplacer par une paraphrase.
- source_word: πάντων
  choice: de tous
  rationale: Le pluriel grec est général. « De tous » reste concis et préserve l’étendue rhétorique de l’affirmation sans préciser davantage les personnes visées.
theological_decisions:
- issue: Sens de « innocent du sang de tous »
  choice: Expression indiquant que Paul est dégagé de toute culpabilité ou responsabilité à l’égard des autres, puisqu’il a pleinement accompli son devoir de proclamation et d’avertissement.
  alternative: Référence étroite à l’absence de participation à la mort physique de qui que ce soit.
  rationale: Le contexte immédiat concerne la fidélité de Paul dans l’annonce de tout le dessein de Dieu, et la formule rappelle fortement l’image de la sentinelle chez Ézéchiel. Le texte principal conserve néanmoins l’expression imagée plutôt que d’en imposer une explication.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « je vous déclare » garde le caractère solennel du témoignage sans archaïsme, tandis que « innocent du sang de tous » préserve l’image biblique et sa tension théologique.
