  text: Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: fr
  text: De Milet, il envoya chercher à Éphèse les anciens de l’Église[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De Milet, il envoya à Éphèse et fit appeler les anciens de l’Église. » Le grec associe l’envoi à Éphèse et l’appel des anciens auprès de Paul, sans préciser s’il a envoyé un message ou des messagers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: De Milet
  rationale: ἀπό avec le génitif indique le point de départ. Le léger lien discursif marqué par δέ n’a pas besoin d’être rendu explicitement en français dans ce verset.
- source_word: πέμψας εἰς Ἔφεσον
  choice: il envoya un message à Éphèse
  rationale: Le participe aoriste indique une démarche préalable à l’action principale. Comme l’objet de l’envoi reste implicite en grec, « un message » explicite naturellement le moyen sans suggérer que Paul se rend lui-même à Éphèse.
- source_word: μετεκαλέσατο
  choice: pour faire venir
  rationale: Le moyen μετακαλέομαι signifie appeler quelqu’un auprès de soi ou le faire venir. Cette formulation française exprime clairement le déplacement demandé sans la nuance potentiellement autoritaire de « convoquer ».
- source_word: τοὺς πρεσβυτέρους
  choice: les anciens
  rationale: Dans ce contexte ecclésial, πρεσβύτεροι désigne des responsables reconnus de la communauté, et non simplement des hommes âgés. « Anciens » conserve le terme biblique courant sans imposer une structure confessionnelle ultérieure.
- source_word: τῆς ἐκκλησίας
  choice: de l’Église
  rationale: ἐκκλησία désigne ici la communauté chrétienne d’Éphèse. « Église » est le terme français naturel et établi; la majuscule éditoriale signale la communauté ecclésiale sans désigner un bâtiment.
theological_decisions:
- issue: Sens de πρεσβυτέρους dans le contexte ecclésial
  choice: des responsables de la communauté appelés « anciens »
  alternative: des hommes âgés de la communauté; des presbytres au sens technique ultérieur
  rationale: Le récit présente ces personnes comme les responsables reconnus de l’Église d’Éphèse. « Anciens » préserve le sens lexical et historique sans importer une conception confessionnelle particulière du ministère.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase réorganise légèrement la construction participiale grecque afin de rendre clairement la séquence et le but. « Faire venir » évite le ton coercitif de « convoquer », tandis que la note conserve l’autre formulation française possible.
