  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: fr
  text: si ce n’est que l’Esprit Saint me rend témoignage, de ville en ville[a], que des chaînes et des détresses m’attendent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans chaque ville ». L’expression grecque est distributive et indique un témoignage répété au fil des villes.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits présentent une légère variation dans la formulation concernant « me » ; le sens demeure que des chaînes et des détresses attendent Paul.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: si ce n’est que
  rationale: Cette tournure introduit naturellement en français l’unique réserve apportée à l’affirmation précédente, tout en conservant la valeur exceptive et adversative du grec.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Formulation française contemporaine et consacrée pour désigner l’Esprit divin.
- source_word: κατὰ πόλιν
  choice: de ville en ville
  rationale: 'L’expression rend le sens distributif de κατά avec le singulier : le témoignage se répète dans les villes successivement traversées, sans imposer l’idée absolue de chaque ville sans exception.'
- source_word: διαμαρτύρεταί μοι
  choice: m’atteste
  rationale: Le verbe exprime un témoignage appuyé ou solennel. « M’atteste » reste concis et conserve l’idée de témoignage sans réduire le propos à un simple avertissement.
- source_word: λέγον
  choice: que
  rationale: En français, le contenu du témoignage s’introduit naturellement par « que » ; traduire séparément par « en disant » serait possible, mais plus lourd ici.
- source_word: δεσμὰ
  choice: des chaînes
  rationale: Ce choix préserve l’image concrète des liens matériels, plutôt que d’expliciter d’emblée leur conséquence, l’emprisonnement.
- source_word: θλίψεις
  choice: des détresses
  rationale: Le terme évoque des épreuves marquées par la pression et la souffrance. « Détresses » en conserve la gravité dans un français actuel, sans la coloration parfois technique de « tribulations ».
- source_word: με
  choice: m’
  rationale: Le pronom désigne Paul comme celui à qui les chaînes et les détresses sont réservées ; il s’intègre naturellement au verbe « m’attendent ».
- source_word: μένουσιν
  choice: m’attendent
  rationale: Dans ce contexte prospectif, le verbe indique ce qui est réservé à Paul ou l’attend. Cette traduction est idiomatique et fidèle.
theological_decisions:
- issue: Référence et action de « l’Esprit Saint »
  choice: L’Esprit Saint est présenté comme l’agent qui rend témoignage à Paul.
  alternative: Comprendre l’expression comme une influence spirituelle impersonnelle.
  rationale: La construction attribue à l’Esprit Saint l’acte de témoigner et de communiquer un contenu. La traduction conserve cette personnification grammaticale sans développer davantage la doctrine dans le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au verset précédent, d’où la minuscule initiale. « De ville en ville » rend naturellement l’itération géographique ; « m’atteste » garde la force testimoniale du grec sans surtraduire par « m’avertit ».
