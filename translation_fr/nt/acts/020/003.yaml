id: ACT.20.3
reference: Acts 20:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: fr
  text: Après y avoir passé trois mois, alors qu’il allait prendre la mer pour la Syrie, les Juifs[a] organisèrent un complot contre lui[b]. Il décida donc de retourner par la Macédoine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « les Juifs » désigne le groupe qui s’opposait à Paul, et non l’ensemble du peuple juif sans distinction.
    reason: cultural_note
  - marker: b
    text: 'Ou : « un complot se forma contre lui ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de revenir en passant par la Macédoine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: Après y avoir passé trois mois
  rationale: Avec une indication de durée, ποιέω signifie idiomatiquement « passer » un laps de temps. « y » reprend naturellement la Grèce mentionnée au verset précédent.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: organisèrent un complot contre lui
  rationale: La construction au génitif absolu décrit la survenue d’un projet hostile. Cette formulation française est naturelle tout en conservant l’idée d’un complot dirigé contre Paul.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: les Juifs
  rationale: Le grec désigne explicitement « les Juifs ». Le contexte limite la référence au groupe impliqué dans le complot; une note prévient toute généralisation à l’ensemble du peuple juif.
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: alors qu’il allait prendre la mer pour la Syrie
  rationale: μέλλω marque l’imminence, et ἀνάγεσθαι, dans ce contexte de voyage, le départ par mer. « prendre la mer pour » exprime clairement les deux éléments.
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: Il décida donc de retourner
  rationale: L’expression idiomatique indique que Paul prit la résolution de revenir. « donc » rend le lien circonstanciel entre le complot et sa décision, implicite dans la construction grecque.
- source_word: διὰ Μακεδονίας
  choice: par la Macédoine
  rationale: διά avec le génitif indique ici l’itinéraire emprunté; « par la Macédoine » est précis et idiomatique.
theological_decisions:
- issue: Portée de l’expression « les Juifs » dans un récit de conflit
  choice: Conserver « les Juifs » dans le texte et préciser en note sa portée contextuelle.
  alternative: « des adversaires juifs » ou « certains Juifs »
  rationale: Le grec emploie l’article défini avec Ἰουδαίων. Une reformulation dans le corps du texte ajouterait une qualification absente de la forme source, tandis que la note évite une lecture visant indistinctement tout le peuple juif.
- issue: Lien entre le complot et le changement d’itinéraire
  choice: Employer « donc » pour expliciter la conséquence narrative.
  alternative: Juxtaposer les deux propositions sans connecteur.
  rationale: Le génitif absolu circonstanciel présente le complot comme le cadre causal de la décision. « donc » rend ce rapport naturellement sans ajouter de motif doctrinal.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été divisée en deux pour éviter une période lourde. « Prendre la mer » conserve explicitement le déplacement maritime, et les notes rendent les principales nuances sans surcharger le texte.
