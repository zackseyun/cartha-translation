id: ACT.20.16
reference: Acts 20:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: fr
  text: Paul avait en effet décidé de passer au large d’Éphèse, afin de ne pas avoir à s’attarder en Asie[a]. Car il se hâtait d’être à Jérusalem, si possible[b], le jour de la Pentecôte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Asie » désigne la province romaine d’Asie, dans l’ouest de l’Asie Mineure, et non le continent actuel.
    reason: cultural_note
  - marker: b
    text: 'Ou : « d’arriver à Jérusalem le jour de la Pentecôte ». L’expression grecque peut souligner soit sa présence à Jérusalem à cette date, soit son arrivée ce jour-là.'
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: avait décidé
  rationale: Le plus-que-parfait rend la décision arrêtée antérieurement au déplacement raconté.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: passer au large d’Éphèse
  rationale: Le verbe indique le fait de passer par mer sans faire escale; cette expression française conserve naturellement le cadre maritime.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: afin de ne pas avoir à s’attarder
  rationale: Cette formulation idiomatique exprime le souci d’éviter de consacrer du temps ou de subir un retard dans la région.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: en Asie
  rationale: Le nom historique est conservé dans le texte, tandis qu’une note précise qu’il s’agit de la province romaine.
- source_word: ἔσπευδεν
  choice: il se hâtait
  rationale: L’imparfait grec décrit un empressement continu; « se hâtait » convient au contexte du voyage dans un registre digne et actuel.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: si possible
  rationale: Cette tournure concise restitue directement la contingence exprimée par l’idiome grec.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: le jour de la Pentecôte
  rationale: Cette expression garde le nom traditionnel et reconnaissable de la fête ainsi que la valeur temporelle de l’accusatif.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: être à Jérusalem
  rationale: La tournure grecque peut viser l’arrivée ou la présence résultante; le texte retient la présence et la note préserve l’autre nuance possible.
theological_decisions:
- issue: Nuance temporelle de γενέσθαι εἰς Ἱεροσόλυμα avec τὴν ἡμέραν
  choice: être à Jérusalem le jour de la Pentecôte
  alternative: arriver à Jérusalem le jour de la Pentecôte
  rationale: La construction peut mettre l’accent soit sur la présence à Jérusalem à cette date, soit sur l’arrivée ce jour-là. La traduction principale adopte la première possibilité sans exclure la seconde, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Passer au large » maintient explicitement le déplacement maritime; « s’attarder » rend naturellement l’idée de consacrer du temps ou d’être retardé. Les deux phrases évitent une accumulation lourde de propositions introduites par « car » tout en conservant le lien explicatif de γάρ par « en effet ».
