  text: αὐτοὶ γινώσκετε ὅτι ταῖς χρείαις μου καὶ τοῖς οὖσι μετ’ ἐμοῦ ὑπηρέτησαν αἱ χεῖρες αὗται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: fr
  text: Vous savez vous-mêmes que ces mains ont pourvu à mes besoins et aux besoins de ceux qui étaient avec moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ces mains ont servi mes besoins et ceux de ceux qui étaient avec moi ». Le verbe grec peut mettre l’accent sur le service pratique rendu, dont le résultat est un soutien matériel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: vous-mêmes
  rationale: Le pronom exprimé est emphatique en grec. « Vous-mêmes » conserve naturellement cette insistance en français.
- source_word: γινώσκετε
  choice: savez
  rationale: Le présent γινώσκετε désigne ici la connaissance directe que les auditeurs ont de la conduite de Paul.
- source_word: ταῖς χρείαις μου
  choice: à mes besoins
  rationale: χρεία désigne les nécessités concrètes, vraisemblablement matérielles dans ce contexte. « Mes besoins » est clair et courant.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: à ceux de mes compagnons
  rationale: L’expression désigne littéralement « ceux qui étaient avec moi ». La reprise elliptique de « besoins » par « ceux » produit une phrase française naturelle, tandis que « mes compagnons » rend le groupe sans préciser davantage leur fonction.
- source_word: ὑπηρέτησαν
  choice: ont pourvu à
  rationale: Avec « ces mains » pour sujet et les besoins pour complément, le verbe exprime un service pratique qui assure le nécessaire. « Ont pourvu à » rend clairement ce sens matériel en français.
- source_word: αἱ χεῖρες αὗται
  choice: ces mains
  rationale: La traduction littérale garde le geste démonstratif et l’image frappante du travail manuel de Paul, sans ajouter explicitement « mes propres ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Pourvoir aux besoins » est une tournure courante qui explicite le résultat concret du service, tandis que la note conserve une traduction plus formelle du verbe et de l’expression désignant les personnes présentes avec Paul.
