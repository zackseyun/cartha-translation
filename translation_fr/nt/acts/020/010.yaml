id: ACT.20.10
reference: Acts 20:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: fr
  text: 'Mais Paul descendit, se jeta sur lui et, le serrant dans ses bras, dit : « Ne vous affolez pas, car sa vie[a] est en lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme ». Le mot grec ψυχή peut désigner la vie, la personne ou l’âme ; ici, « vie » convient le mieux au contexte immédiat, où il s’agit de savoir si le jeune homme est mort ou vivant.
    reason: lexical_alternative
  - marker: b
    text: Les paroles de Paul peuvent signifier soit que le jeune homme n’était finalement pas mort, soit que la vie venait de lui être rendue ; la formulation grecque ne tranche pas explicitement la question.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: descendit
  rationale: Le participe aoriste indique que Paul descend de l’étage où l’assemblée était réunie. La coordination française rend naturellement la succession des actions.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition entre le constat de mort au verset précédent et l’intervention de Paul.
- source_word: ἐπέπεσεν αὐτῷ
  choice: se jeta sur lui
  rationale: Cette formulation conserve l’action physique énergique du grec et sa possible résonance avec les récits prophétiques de restauration à la vie, sans expliciter cette allusion.
- source_word: συμπεριλαβὼν
  choice: le serrant dans ses bras
  rationale: Le verbe exprime l’idée d’entourer quelqu’un de ses bras. Cette formulation est naturelle en français et garde le caractère concret du geste.
- source_word: Μὴ θορυβεῖσθε
  choice: Ne vous affolez pas
  rationale: Le verbe peut désigner l’agitation, le trouble ou le tumulte. Dans ce contexte, cette expression rend clairement l’injonction adressée à une assemblée bouleversée.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: car sa vie
  rationale: Dans ce contexte de mort apparente ou réelle, ψυχή désigne le plus naturellement la vie. Ce choix évite d’imposer au verset une anthropologie technique du corps et de l’âme.
- source_word: ἐν αὐτῷ ἐστιν
  choice: est en lui
  rationale: 'La traduction littérale préserve l’ambiguïté du grec : la phrase ne précise pas si la vie ne l’avait jamais quitté ou si elle venait de lui être rendue.'
theological_decisions:
- issue: Sens de ψυχή dans un contexte de vie et de mort
  choice: vie
  alternative: âme
  rationale: Le contexte immédiat porte sur l’état physique du jeune homme. « Vie » correspond à un emploi courant de ψυχή et n’introduit pas une affirmation doctrinale que le texte ne met pas au premier plan.
- issue: Eutyche était-il encore vivant ou venait-il d’être rendu à la vie ?
  choice: Conserver la formulation neutre « sa vie est en lui »
  alternative: Formulations interprétatives telles que « il est vivant » ou « la vie lui est revenue »
  rationale: Le grec affirme que sa vie est en lui sans expliquer si elle y était demeurée ou si elle venait d’être restaurée. La traduction ne tranche donc pas cette question.
translation_notes:
  register: Français international moderne, clair et digne. « Se jeta sur lui » préserve la vigueur du geste et son éventuelle résonance scripturaire ; « le serrant dans ses bras » évite une tournure trop littérale. La syntaxe reste fluide tout en maintenant l’ambiguïté théologique du texte source.
