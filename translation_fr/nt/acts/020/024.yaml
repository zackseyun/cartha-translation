id: ACT.20.24
reference: Acts 20:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: fr
  text: 'Mais je n’attache aucun prix à ma vie[a], pourvu que je termine ma course[b] et que j’accomplisse le ministère que j’ai reçu du Seigneur Jésus : rendre témoignage[c] à la bonne nouvelle de la grâce de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon âme ». Ici, « vie » est retenu parce que Paul se dit prêt à affronter la mort afin d’accomplir sa mission.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon parcours ». Le grec désigne une course ou un parcours mené jusqu’à son terme.
    reason: lexical_alternative
  - marker: c
    text: Ou « attester solennellement ». Le verbe grec peut exprimer un témoignage ferme ou solennel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι … τιμίαν ἐμαυτῷ
  choice: je ne considère pas … comme précieuse à mes propres yeux
  rationale: Cette formulation française naturelle restitue l’idée de ne pas attribuer à sa propre vie une valeur personnelle décisive, tout en conservant le sens de τιμίαν et du datif ἐμαυτῷ.
- source_word: ψυχήν
  choice: vie
  rationale: Dans ce contexte de souffrance et de mort possible, le mot désigne la vie terrestre de Paul plutôt qu’une âme immatérielle distinguée du corps.
- source_word: ὡς τελειῶσαι
  choice: pourvu que j’achève
  rationale: La construction grecque condensée exprime l’objectif primordial de Paul. « Pourvu que » en rend l’élan sans la réduire à une simple proposition de but.
- source_word: δρόμον
  choice: course
  rationale: « Course » conserve la métaphore d’un parcours à mener jusqu’à son terme, avec sa possible nuance athlétique.
- source_word: διακονίαν
  choice: ministère
  rationale: Ici, le terme désigne le service confié à Paul par Jésus. « Ministère » exprime clairement cette mission reçue sans ajouter de fonction ecclésiastique particulière.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: reçu du Seigneur Jésus
  rationale: La préposition avec le génitif indique la source de la mission; le titre κύριος est conservé par « Seigneur ».
- source_word: διαμαρτύρασθαι
  choice: rendre témoignage
  rationale: Cette expression courante conserve l’idée d’une attestation ferme; la nuance possible de solennité est signalée en note.
- source_word: εὐαγγέλιον
  choice: bonne nouvelle
  rationale: « Bonne nouvelle » communique directement le sens du terme grec en français moderne, sans perdre sa portée proclamatoire dans ce contexte.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: de la grâce de Dieu
  rationale: Le maintien de la chaîne de génitifs préserve l’ambiguïté entre une bonne nouvelle caractérisée par la grâce de Dieu et une bonne nouvelle qui a cette grâce pour objet.
theological_decisions:
- issue: Sens de ψυχή dans la déclaration de Paul
  choice: vie
  alternative: âme
  rationale: Le contexte porte sur la disposition de Paul à risquer la mort pour accomplir sa mission. « Vie » évite d’introduire une opposition entre corps et âme que le passage ne met pas en avant.
- issue: Force de ὡς τελειῶσαι
  choice: pourvu que j’achève
  alternative: afin que j’achève
  rationale: Le texte exprime le souci dominant de Paul et non seulement un rapport logique de finalité; « pourvu que » conserve cette tension rhétorique.
- issue: Relation exprimée par τῆς χάριτος τοῦ θεοῦ
  choice: de la grâce de Dieu
  alternative: au sujet de la grâce de Dieu
  rationale: La formulation retenue ne tranche pas entre un génitif de contenu et un génitif de caractérisation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’intensité personnelle de Paul, la métaphore de la course et la structure ouverte de « la bonne nouvelle de la grâce de Dieu », tout en évitant un vocabulaire inutilement technique.
