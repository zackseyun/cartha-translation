source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: fr
  text: Un jeune homme nommé Eutychus, assis sur le rebord de la fenêtre, s’enfonçait dans un profond sommeil pendant que Paul parlait longuement. Vaincu par le sommeil, il tomba du troisième étage et on le ramassa mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on le releva mort ». Le verbe grec peut signifier « ramasser » ou « relever / emporter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: Un jeune homme… assis
  rationale: Le participe présent pose la scène et décrit la position continue d’Eutychus. Le pronom indéfini τις n’exige pas en français le calque peu naturel « un certain ».
- source_word: ὀνόματι Εὔτυχος
  choice: nommé Eutychus
  rationale: Rendu idiomatique du datif ὀνόματι accompagné du nom propre.
- source_word: ἐπὶ τῆς θυρίδος
  choice: sur le rebord de la fenêtre
  rationale: θυρίς désigne l’ouverture d’une fenêtre. Dans ce contexte de chute, « sur le rebord » exprime naturellement la position impliquée sans ajouter un élément narratif étranger.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: s’enfonçait dans un profond sommeil
  rationale: 'Le participe présent exprime un processus progressif : le jeune homme est peu à peu entraîné dans un sommeil profond.'
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: pendant que Paul prolongeait son discours
  rationale: Le génitif absolu situe l’action pendant la prise de parole prolongée de Paul. « Discours » convient ici à διαλέγομαι sans imposer l’idée d’un dialogue.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: Vaincu par le sommeil
  rationale: L’aoriste passif marque le moment décisif où le sommeil prend entièrement le dessus, après le processus déjà décrit.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: il tomba du troisième étage
  rationale: τρίστεγον indique le niveau du troisième étage et κάτω le mouvement vers le bas, déjà exprimé naturellement par « tomba du ».
- source_word: ἤρθη νεκρός
  choice: fut relevé mort
  rationale: Le passif de αἴρω peut signifier qu’on relève ou ramasse quelqu’un. « Fut relevé mort » est naturel en français et maintient l’affirmation explicite νεκρός.
theological_decisions:
- issue: Faut-il atténuer νεκρός en « apparemment mort » ?
  choice: mort
  alternative: apparemment mort ; comme mort
  rationale: Le grec affirme directement νεκρός sans marque d’incertitude. La traduction conserve cette formulation nette et ne résout pas d’avance la tension avec la suite du récit.
- issue: Sens précis du passif ἤρθη
  choice: fut relevé
  alternative: fut ramassé ; fut emporté
  rationale: Le contexte immédiat favorise l’action de relever le jeune homme après sa chute. Les autres sens restent lexicalement possibles, mais ne changent pas l’affirmation qu’il était mort.
translation_notes:
  register: Français international moderne, narratif et digne. Syntaxe fluide, sans archaïsme ni atténuation interprétative de la mort d’Eutychus.
