revisions:
- from: Un jeune homme nommé Eutychus, assis sur le rebord de la fenêtre, s’enfonçait dans un profond sommeil pendant que Paul prolongeait son discours. Vaincu par le sommeil, il tomba du troisième étage et fut relevé mort.
  to: Un jeune homme nommé Eutychus, assis sur le rebord de la fenêtre, s’enfonçait dans un profond sommeil pendant que Paul parlait longuement. Vaincu par le sommeil, il tomba du troisième étage et on le ramassa mort[a].
  rationale: La révision remplace une expression passive française ambiguë par « on le ramassa mort », qui correspond naturellement à l’emploi passif de αἴρω dans la scène. Elle rend aussi la durée de la parole de Paul sans nuance intentionnelle superflue. La note conserve l’alternative lexicale signalée par l’audit anglais, tandis que « mort » reste explicite comme dans le grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Eutychus s’assoupit profondément pendant que Paul parle longuement, tombe du troisième étage et est trouvé/ramassé mort. Toutefois, « fut relevé mort » est peu idiomatique et peut suggérer qu’il a été remis debout, ce qui brouille le sens concret de ἤρθη.'
  naturalness: « S’enfonçait dans un profond sommeil » et « sur le rebord de la fenêtre » sont naturels dans ce contexte. « Pendant que Paul prolongeait son discours » est possible, mais attribue plus volontiers à Paul l’action volontaire de prolonger ; « parlait longuement » rend plus directement ἐπὶ πλεῖον. Une tournure active impersonnelle (« on le ramassa ») est plus naturelle que le passif français ici.
  terminology: Le nom « Eutychus » est correctement conservé. « Mort » rend sans atténuation νεκρός. Une note permet de conserver l’alternative lexicale de αἴρω (« relever » / « emporter ») attestée dans la piste d’audit anglaise, sans introduire d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: « fut relevé mort »
    rationale: Bien que « relever » puisse parfois signifier ramasser, le passif est raide en français moderne et « relever quelqu’un » évoque souvent le fait de l’aider à se remettre debout. « On le ramassa mort » est idiomatique et rend clairement l’action postérieure à la chute.
  - severity: low
    issue: « Paul prolongeait son discours »
    rationale: La formulation est défendable, mais elle peut suggérer que Paul étirait délibérément un discours déjà commencé. « Paul parlait longuement » restitue avec plus de neutralité le génitif absolu et ἐπὶ πλεῖον.
  revised_text: Un jeune homme nommé Eutychus, assis sur le rebord de la fenêtre, s’enfonçait dans un profond sommeil pendant que Paul parlait longuement. Vaincu par le sommeil, il tomba du troisième étage et on le ramassa mort[a].
  revised_footnotes:
  - marker: a
    text: 'Ou : « on le releva mort ». Le verbe grec peut signifier « ramasser » ou « relever / emporter ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace une expression passive française ambiguë par « on le ramassa mort », qui correspond naturellement à l’emploi passif de αἴρω dans la scène. Elle rend aussi la durée de la parole de Paul sans nuance intentionnelle superflue. La note conserve l’alternative lexicale signalée par l’audit anglais, tandis que « mort » reste explicite comme dans le grec.
