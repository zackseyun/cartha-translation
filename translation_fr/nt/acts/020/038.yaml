  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: fr
  text: 'Ils étaient surtout peinés par ce qu’il avait dit[a] : ils ne verraient plus son visage[b]. Et ils l’accompagnaient jusqu’au bateau[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de la parole qu’il avait dite ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ne verraient plus son visage », expression personnelle signifiant qu’ils ne le reverraient plus.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils l’escortaient » ; le verbe peut désigner le fait d’accompagner quelqu’un pour prendre congé de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: étaient peinés
  rationale: Le participe exprime une vive douleur affective. « Étaient peinés » est naturel en français et convient à cette scène d’adieu.
- source_word: μάλιστα
  choice: surtout
  rationale: Le terme signale la cause principale de leur peine.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: par ce qu’il avait dit
  rationale: Cette formulation française naturelle rend la cause de leur peine et conserve l’antériorité du plus-que-parfait, sans calquer l’expression grecque « à cause de la parole qu’il avait dite ».
- source_word: οὐκέτι μέλλουσιν
  choice: ils ne verraient plus
  rationale: Le conditionnel exprime naturellement le futur vu depuis le moment passé du récit. « Plus » rend οὐκέτι, tandis que la perspective attendue de μέλλω est portée par l’ensemble de la formulation.
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: voir son visage
  rationale: La traduction conserve l’image personnelle et explicite du visage au lieu de la réduire à « le revoir ».
- source_word: προέπεμπον
  choice: ils l’accompagnèrent
  rationale: Le verbe désigne ici le fait d’accompagner quelqu’un au moment de son départ, possiblement comme marque d’honneur. Le passé simple s’intègre naturellement à la narration française.
- source_word: εἰς τὸ πλοῖον
  choice: jusqu’au bateau
  rationale: Avec un verbe d’accompagnement, « jusqu’au bateau » exprime naturellement le terme du trajet. « Bateau » est le terme moderne courant sans préciser indûment la taille du bâtiment.
