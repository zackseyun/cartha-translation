review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement les pleurs de tous et le geste de se jeter au cou de Paul. Toutefois, « puis » impose une succession nette que le participe grec n’exprime pas nécessairement, et le passé simple « l’embrassèrent » atténue l’aspect duratif ou répété de l’imparfait κατεφίλουν.
  naturalness: La formulation est globalement fluide. « Le couvraient de baisers » est naturel en français international, explicite quant aux baisers et rend mieux l’action prolongée que « l’embrassèrent à plusieurs reprises ».
  terminology: « Se jeter au cou de Paul » conserve l’image concrète de ἐπὶ τὸν τράχηλον. « Couvrir de baisers » évite l’ambiguïté possible de « embrasser », qui peut aussi évoquer une étreinte selon les usages.
  issues:
  - severity: medium
    issue: « puis » introduit une progression temporelle trop marquée.
    rationale: Le grec coordonne les pleurs avec un participe décrivant le geste envers Paul; il ne requiert pas que les pleurs aient cessé avant l’étreinte et les baisers.
  - severity: medium
    issue: L’aspect imperfectif de κατεφίλουν est insuffisamment rendu.
    rationale: « L’embrassèrent à plusieurs reprises » indique la répétition, mais le passé simple présente l’action comme globalement achevée. Une expression durative telle que « le couvraient de baisers » rend plus directement l’action continue ou répétée.
  revised_text: Tous pleurèrent abondamment et, se jetant au cou de Paul, le couvraient de baisers.
