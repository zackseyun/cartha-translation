lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: Tous pleurèrent abondamment
  rationale: La tournure grecque exprime les pleurs intenses de toutes les personnes présentes. Cette formulation est naturelle en français moderne et conserve à la fois l’universalité et l’intensité.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: ils se jetèrent au cou de Paul
  rationale: L’expression française correspond naturellement au geste d’étreinte décrit par l’idiome grec tout en conservant l’image explicite du cou.
- source_word: κατεφίλουν αὐτόν
  choice: l’embrassèrent à plusieurs reprises
  rationale: L’imparfait grec présente des baisers prolongés ou répétés. « À plusieurs reprises » rend clairement cet aspect sans ajouter de nuance théologique ou sentimentale étrangère au texte.
