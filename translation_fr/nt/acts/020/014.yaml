  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: fr
  text: Quand il nous rejoignit à Assos[a], nous le prîmes à bord et gagnâmes Mytilène.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il nous rencontra à Assos » ou « il se retrouva avec nous à Assos ». Le verbe grec peut exprimer une rencontre ou le fait de se retrouver ensemble ; ici, Paul rejoint le groupe à cet endroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: rejoignit
  rationale: Dans ce récit de voyage, le verbe indique naturellement que Paul retrouve le groupe à Assos. « Rejoignit » exprime clairement la réunion sans introduire l’idée plus précise d’un rendez-vous organisé.
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif pluriel désigne les compagnons qui voyageaient par bateau; il complète naturellement « rejoignit » en français.
- source_word: εἰς τὴν Ἆσσον
  choice: à Assos
  rationale: Bien que εἰς soit directionnel, avec un verbe exprimant la rencontre, « à Assos » indique idiomatiquement le lieu où Paul rejoint le groupe.
- source_word: ἀναλαβόντες
  choice: nous le prîmes à bord
  rationale: Dans le contexte maritime, le participe signifie que les voyageurs accueillent Paul sur le bateau. Cette formulation rend explicite une donnée claire du contexte sans lourdeur.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie à Paul, identifié dans le contexte précédent.
- source_word: ἤλθομεν
  choice: gagnâmes
  rationale: Dans un récit d’itinéraire maritime, « gagner » suivi d’une destination rend naturellement le déplacement exprimé par ἤλθομεν, sans le confondre avec la seule arrivée.
- source_word: εἰς Μιτυλήνην
  choice: Mytilène
  rationale: Avec « gagnâmes », la destination se construit directement en français. « Mytilène » est la forme française usuelle du nom de lieu.
