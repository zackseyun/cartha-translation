source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: fr
  text: comment je ne me suis pas retenu de vous annoncer tout ce qui vous était utile et de vous enseigner, en public et de maison en maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « comment je ne me suis pas retenu de vous annoncer et de vous enseigner tout ce qui vous était utile, en public et de maison en maison. »'
    reason: La portée précise de « tout ce qui vous était utile » par rapport aux deux infinitifs peut être exprimée différemment en français ; « ne pas se retenir » rend l’idée de ne pas reculer ou de ne rien retenir.
lexical_decisions:
- source_word: ὡς
  choice: comment
  rationale: Dans la continuité des versets précédents, ὡς introduit ce que Paul rappelle à ses auditeurs. « Comment » conserve ce lien syntaxique.
- source_word: οὐδὲν ὑπεστειλάμην
  choice: je n’ai pas reculé… tout
  rationale: Le moyen de ὑποστέλλω exprime l’idée de se dérober ou de reculer devant une action. La formulation française place naturellement la négation devant « reculé » et rend οὐδέν par « tout » dans la proposition dépendante.
- source_word: τῶν συμφερόντων
  choice: tout ce qui pouvait vous être utile
  rationale: Le participe de συμφέρω désigne ce qui est utile ou bénéfique. « Pouvait vous être utile » est naturel en français et n’impose pas une limitation doctrinale absente du grec.
- source_word: τοῦ μὴ ἀναγγεῖλαι ὑμῖν
  choice: quand il s’agissait de vous annoncer
  rationale: L’infinitif articulé négatif précise l’action devant laquelle Paul n’a pas reculé. Cette tournure restitue clairement ce rapport sans calquer lourdement la syntaxe grecque.
- source_word: διδάξαι ὑμᾶς
  choice: de vous enseigner
  rationale: διδάσκω signifie enseigner. En français courant, « vous enseigner tout ce qui… » permet de rendre naturellement le double accusatif implicite dans la coordination.
- source_word: δημοσίᾳ
  choice: en public
  rationale: L’adverbe désigne un enseignement donné ouvertement, dans des cadres publics.
- source_word: κατ’ οἴκους
  choice: de maison en maison
  rationale: κατά avec le pluriel a ici une valeur distributive. « De maison en maison » conserve cette nuance mieux que le simple « dans les maisons ».
theological_decisions:
- issue: Portée de « ce qui pouvait vous être utile »
  choice: Conserver le sens large de ce qui est bénéfique aux auditeurs
  alternative: Préciser « tout ce qui était utile à votre foi »
  rationale: Le contexte est pastoral et spirituel, mais le grec ne formule pas explicitement cette restriction. La traduction évite donc d’ajouter une précision doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve « comment » parce que le verset poursuit la construction commencée auparavant. « De maison en maison » maintient la valeur distributive de l’expression grecque.
