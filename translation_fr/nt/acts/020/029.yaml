  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: fr
  text: Je sais qu’après mon départ[a], des loups féroces[b] s’introduiront parmi vous, sans épargner le troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après mon arrivée » ou « après ma venue ». Le contexte conduit souvent à comprendre : « après mon départ ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des loups cruels ». L’adjectif grec peut évoquer la dureté, l’oppression ou la violence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Je sais
  rationale: Rend directement la connaissance assurée exprimée par le verbe, sans l’affaiblir en simple opinion.
- source_word: εἰσελεύσονται
  choice: s’introduiront
  rationale: Exprime l’entrée de personnes dangereuses au sein de la communauté; en français, le verbe convient naturellement à l’image d’une intrusion prédatrice.
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: après mon départ
  rationale: Bien que ἄφιξις désigne normalement une venue ou une arrivée, le contexte immédiat indique ce qui se produira lorsque Paul ne sera plus auprès des responsables d’Éphèse.
- source_word: λύκοι βαρεῖς
  choice: des loups féroces
  rationale: Conserve la métaphore des loups et rend la dureté menaçante de βαρεῖς dans un français actuel et naturel.
- source_word: εἰς ὑμᾶς
  choice: parmi vous
  rationale: Rend l’intrusion au sein de la communauté plutôt qu’un simple déplacement dans sa direction.
- source_word: μὴ φειδόμενοι
  choice: sans épargner
  rationale: Formulation concise et proche du grec, qui exprime l’absence de retenue ou de pitié.
- source_word: τοῦ ποιμνίου
  choice: le troupeau
  rationale: Préserve l’image pastorale cohérente avec celle des loups, sans expliciter à tort l’identité précise du groupe visé.
theological_decisions:
- issue: Portée métaphorique des « loups »
  choice: Conserver l’image « des loups féroces »
  alternative: Expliciter par « de faux enseignants », « des hommes destructeurs » ou « des persécuteurs »
  rationale: Le verset ne précise pas lui-même l’identité des loups. Garder la métaphore préserve sa force et évite de restreindre indûment l’interprétation.
- issue: Sens contextuel de ἄφιξις
  choice: Traduire « après mon départ » tout en signalant le sens littéral en note
  alternative: Traduire « après mon arrivée » ou « après ma venue »
  rationale: Le contexte du discours présente Paul comme avertissant les anciens de ce qui arrivera en son absence. La note maintient toutefois la difficulté réelle du texte grec au lieu de la masquer.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les images bibliques des loups et du troupeau. « S’introduiront parmi vous » communique naturellement le mouvement hostile vers l’intérieur de la communauté.
