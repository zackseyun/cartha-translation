id: ACT.20.21
reference: Acts 20:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: fr
  text: rendant solennellement témoignage aussi bien aux Juifs qu’aux Grecs de la repentance envers Dieu et de la foi en notre Seigneur Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la confiance en notre Seigneur Jésus ».
    reason: Alternative lexicale pour πίστις, qui peut mettre en relief l’idée de confiance personnelle.
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: rendant solennellement témoignage
  rationale: Le participe exprime un témoignage appuyé et solennel; cette formulation en conserve à la fois la force testimoniale et la gravité.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: aussi bien aux Juifs qu’aux Grecs
  rationale: Cette traduction conserve les deux groupes nommés par Luc et rend naturellement la construction corrélative τε καί.
- source_word: μετάνοιαν
  choice: repentance
  rationale: « Repentance » exprime ici la réorientation morale et spirituelle vers Dieu, sans réduire le terme à un simple changement d’avis.
- source_word: εἰς θεόν
  choice: envers Dieu
  rationale: Avec μετάνοια, εἰς indique l’orientation ou la direction; « envers Dieu » restitue cette relation et reste idiomatique en français biblique moderne.
- source_word: πίστιν
  choice: foi
  rationale: Le mot désigne ici la foi dirigée vers une personne explicitement nommée. « Foi » est précis, naturel et conserve le terme théologiquement établi; « confiance » demeure une possibilité lexicale signalée en note.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: en notre Seigneur Jésus
  rationale: Avec πίστις, εἰς marque l’objet vers lequel la foi se porte; le français idiomatique emploie « foi en ». « Seigneur » préserve la portée du titre κύριος.
theological_decisions:
- issue: Traduction de πίστις dans une expression théologiquement chargée
  choice: la foi en notre Seigneur Jésus
  alternative: la confiance en notre Seigneur Jésus
  rationale: Jésus est explicitement l’objet de πίστις; il ne s’agit donc pas de l’ambiguïté du génitif pistis Christou. « Foi en » convient au texte principal, tandis que « confiance en » explicite utilement la dimension relationnelle sans être imposé au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale est maintenue afin de respecter la continuité avec le contexte, et le parallélisme « repentance envers Dieu / foi en notre Seigneur Jésus » est préservé.
