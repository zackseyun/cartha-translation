  text: ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/033.yaml
  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: fr
  text: Je n’ai convoité l’argent, l’or ou les vêtements de personne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je n’ai désiré l’argent, l’or ou les vêtements de personne. »'
    reason: Alternative lexicale qui préserve le sens plus général possible de ἐπιθυμέω.
lexical_decisions:
- source_word: ἀργυρίου
  choice: l’argent
  rationale: Le nom désigne littéralement l’argent métal. Associé à l’or et aux vêtements, il présente concrètement des biens de valeur; en français, « l’argent » conserve aussi naturellement cette idée de richesse.
- source_word: χρυσίου
  choice: l’or
  rationale: Équivalent direct et naturel du nom grec, coordonné à l’argent et aux vêtements comme objet possible de convoitise.
- source_word: ἱματισμοῦ
  choice: les vêtements
  rationale: Rend clairement et en français moderne les habits, qui pouvaient constituer des biens précieux.
- source_word: οὐδενὸς
  choice: de personne
  rationale: Le génitif marque ici le possesseur des trois biens énumérés. Placé à la fin, « de personne » porte naturellement sur toute la série.
- source_word: ἐπεθύμησα
  choice: Je n’ai convoité
  rationale: Dans cette défense de l’intégrité de Paul, le verbe exprime vraisemblablement un désir moralement répréhensible pour les biens d’autrui. « Convoiter » préserve cette portée éthique sans ajouter d’idée étrangère.
- source_word: ἢ ... ἢ ... ἢ
  choice: l’argent, l’or ou les vêtements
  rationale: En français, une énumération négative avec virgules puis « ou » est plus naturelle que la répétition de « ou », tout en conservant les trois possibilités distinctes.
theological_decisions:
- issue: Portée morale de ἐπιθυμέω appliqué aux biens matériels
  choice: « convoité »
  alternative: « désiré »
  rationale: Le contexte est la défense de Paul contre tout soupçon de cupidité. « Convoité » exprime le désir fautif des biens d’autrui, tandis que « désiré » laisse possible la nuance lexicale plus neutre et figure donc en note.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la liste concrète des biens et place « de personne » après l’ensemble afin d’indiquer clairement que Paul parle des possessions d’autrui.
