source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: fr
  text: 'Et maintenant, me voici lié dans l’Esprit[a] : je vais à Jérusalem sans savoir ce qui m’y arrivera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « lié en esprit » ; l’expression grecque peut renvoyer soit à l’esprit de Paul, soit à l’Esprit Saint. On peut aussi comprendre : « contraint par l’Esprit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction de mise en relief et la solennité du marqueur discursif, dans un français actuel et naturel.
- source_word: δεδεμένος
  choice: lié
  rationale: Rend directement le participe parfait passif de δέω et préserve la métaphore sans la réduire d'emblée à l'idée d'une contrainte intérieure.
- source_word: τῷ πνεύματι
  choice: dans l'Esprit
  rationale: Reflète étroitement le datif grec et maintient une part de son ambiguïté; le contexte des Actes favorise une référence à l'Esprit Saint, sans imposer explicitement une valeur d'agent.
- source_word: πορεύομαι
  choice: je vais
  rationale: Expression idiomatique française correspondant au mouvement en cours ou imminent exprimé par le présent grec.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: ce qui m'y arrivera
  rationale: Rend naturellement l'expression littérale «les choses qui m'y rencontreront», avec y pour reprendre Jérusalem.
- source_word: μὴ εἰδώς
  choice: sans savoir
  rationale: Tour participial naturel en français qui exprime clairement l'absence de connaissance concomitante.
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Référent de τῷ πνεύματι
  choice: 'L''Esprit Saint est retenu comme référent probable: «dans l''Esprit».'
  alternative: «lié en esprit», s'il s'agit de l'esprit de Paul; ou «lié/contraint par l'Esprit», si le datif marque plus nettement l'agent.
  rationale: Dans les Actes, πνεῦμα désigne souvent l'Esprit Saint, et le contexte immédiat mentionne son témoignage. Toutefois, la construction grecque ne tranche pas entièrement entre l'Esprit Saint, l'esprit de Paul et une nuance d'agent ou de contrainte; la note conserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. «Voici que» garde l'emphase de ἰδοὺ sans archaïsme excessif; «ce qui m'y arrivera» privilégie l'idiome français tout en respectant le sens de la tournure grecque.
