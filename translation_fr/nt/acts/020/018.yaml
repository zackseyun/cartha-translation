    rationale: La note traite de πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην (« comment je me suis comporté / j’ai été avec vous »), et doit donc recevoir un marqueur placé après la traduction de cette expression.
  - severity: low
    issue: Formulation narrative un peu pesante
    rationale: « Quand ils furent arrivés » peut être remplacé sans changement de sens par « Lorsqu’ils arrivèrent », formulation plus idiomatique en français moderne.
