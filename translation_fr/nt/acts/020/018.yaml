  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: fr
  text: 'Lorsqu’ils arrivèrent auprès de lui, il leur dit : « Vous savez vous-mêmes comment je me suis comporté parmi vous[b] durant tout ce temps, depuis le premier jour où j’ai mis le pied en Asie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’Asie désigne ici la province romaine d’Asie, située dans l’ouest de l’Asie Mineure, et non le continent moderne.
    reason: cultural_note
  - marker: b
    text: 'Ou : « comment j’ai été avec vous durant tout ce temps ». L’expression grecque peut mettre l’accent soit sur la manière dont Paul s’est comporté, soit sur sa présence continuelle parmi eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: furent arrivés auprès de lui
  rationale: Le verbe et la préposition expriment l’arrivée des anciens là où se trouve Paul. « Auprès de lui » rend la dimension relationnelle de πρὸς αὐτόν en français naturel.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Vous savez vous-mêmes
  rationale: Le pronom explicite Ὑμεῖς est emphatique ; « vous-mêmes » conserve cette insistance.
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς
  choice: depuis le premier jour où
  rationale: Cette formulation française exprime clairement le point de départ temporel indiqué par les deux constructions grecques.
- source_word: ἐπέβην εἰς τὴν Ἀσίαν
  choice: j’ai mis les pieds dans la province d’Asie
  rationale: « Mettre les pieds » conserve l’image concrète de ἐπιβαίνω. L’ajout de « province » empêche le lecteur moderne de confondre l’Asie romaine avec le continent actuel.
- source_word: πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: comment je me suis comporté parmi vous tout le temps
  rationale: Dans ce discours, πῶς et ἐγενόμην peuvent viser la manière de vivre de Paul. « Je me suis comporté » rend ce sens naturellement, tandis que la note conserve l’autre lecture possible, celle de sa présence continuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La désignation « province d’Asie » est explicitée dans le texte pour éviter une méprise géographique immédiate ; la note est réservée à l’ambiguïté réelle de ἐγενόμην.
