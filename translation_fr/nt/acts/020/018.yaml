  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : arrivée des anciens auprès de Paul, insistance sur leur connaissance personnelle, point de départ lors de son entrée en Asie et durée continue de sa présence/conduite. Toutefois, « province d’Asie » explicite dans le texte une précision historique qui n’est pas formulée par le grec, lequel dit simplement « Asie ». Cette précision doit être reportée en note.'
  naturalness: « Quand ils furent arrivés » est grammatical mais lourd dans ce récit. « Lorsqu’ils arrivèrent » est plus naturel. « Durant tout ce temps » rend avec fluidité la durée exprimée par τὸν πάντα χρόνον.
  terminology: « Asie » doit être conservé dans le texte, avec une note précisant qu’il s’agit de la province romaine. « Je me suis comporté parmi vous » est une interprétation contextuellement recevable de ἐγενόμην, mais la possibilité plus littérale « j’ai été avec vous » doit être signalée par une note attachée à cette expression, non à « Asie ».
