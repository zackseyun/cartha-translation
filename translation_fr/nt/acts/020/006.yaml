id: ACT.20.6
reference: Acts 20:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: fr
  text: Quant à nous, nous avons pris la mer depuis Philippes après les jours des Pains sans levain et, en cinq jours[a], nous les avons rejoints à Troas, où nous sommes restés sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au bout de cinq jours ». L’expression grecque indique la durée du voyage jusqu’à l’arrivée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: nous avons pris la mer
  rationale: Le verbe ἐκπλέω désigne un départ par bateau. « Prendre la mer » est naturel en français moderne et exprime clairement ce mode de départ.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: après les jours des Pains sans levain
  rationale: La formulation conserve la référence temporelle littérale aux jours de la fête juive, tout en employant son appellation française usuelle.
- source_word: ἀπὸ Φιλίππων
  choice: depuis Philippes
  rationale: Avec « prendre la mer », « depuis Philippes » indique naturellement le point de départ exprimé par ἀπό.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: nous les avons rejoints
  rationale: Dans ce contexte de séparation puis de retrouvailles avec le groupe parti en avant, cette formulation rend naturellement le mouvement vers les personnes sans modifier le référent.
- source_word: εἰς τὴν Τρῳάδα
  choice: à Troas
  rationale: La préposition εἰς marque ici la destination; « à Troas » est la tournure française idiomatique.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: en cinq jours
  rationale: L’expression indique l’étendue temporelle du voyage jusqu’à l’arrivée. « En cinq jours » rend cette durée sans suggérer une attente supplémentaire après cinq jours.
- source_word: οὗ
  choice: où
  rationale: L’adverbe relatif renvoie à Troas; « où » reproduit simplement ce lien.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: nous sommes restés sept jours
  rationale: Dans un récit de voyage, διατρίβω signifie séjourner ou demeurer quelque temps; cette traduction est courante et précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Quant à nous » marque le contraste porté par ἡμεῖς δέ; « les Pains sans levain » conserve la désignation biblique de la période festive. La phrase reste fluide tout en suivant de près la chronologie grecque.
