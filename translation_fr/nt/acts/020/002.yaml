  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: fr
  text: Après avoir parcouru ces régions et longuement encouragé les croyants[a], il se rendit en Grèce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les ayant encouragés par de nombreuses paroles » ; l’expression peut aussi évoquer une exhortation abondante ou prolongée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: Après avoir parcouru
  rationale: Le participe aoriste exprime une action antérieure à ἦλθεν. Cette tournure française conserve la succession des actions tout en restant naturelle.
- source_word: τὰ μέρη ἐκεῖνα
  choice: ces régions
  rationale: μέρη désigne ici les différentes contrées précédemment évoquées. « Ces régions » est idiomatique et géographiquement approprié.
- source_word: παρακαλέσας
  choice: encouragé
  rationale: παρακαλέω peut signifier encourager, exhorter ou réconforter. Dans le contexte d'une visite aux croyants, « encouragé » garde une portée pastorale assez large sans réduire le sens à l'avertissement.
- source_word: αὐτοὺς
  choice: les croyants
  rationale: Le pronom renvoie aux disciples des régions traversées. L'explicitation évite en français une référence pronominale imprécise, sans ajouter de nouveau référent.
- source_word: λόγῳ πολλῷ
  choice: longuement
  rationale: L'expression signifie littéralement « par beaucoup de parole » et évoque un discours abondant ou prolongé. « Longuement » en rend naturellement le sens, tandis que la note conserve la forme et les nuances possibles du grec.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: il se rendit en Grèce
  rationale: ἔρχομαι peut se traduire par venir ou aller selon le point de vue. « Se rendit en Grèce » exprime clairement le déplacement vers cette région dans un récit français naturel.
- source_word: δὲ
  choice: Après
  rationale: La légère transition marquée par δέ est intégrée à la construction temporelle française, qui assure naturellement la continuité du récit.
