  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: fr
  text: Sopater, fils de Pyrrhus et originaire de Bérée, l’accompagnait ; Aristarque et Secundus, de Thessalonique[a] ; Gaïus, de Derbe, et Timothée ; et Tychique et Trophime, de la province d’Asie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « parmi les Thessaloniciens ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la province romaine d’Asie, située dans l’ouest de l’actuelle Turquie, et non du continent asiatique moderne.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: l’accompagnait
  rationale: L’imparfait de συνέπομαι décrit le fait de voyager avec quelqu’un. « L’accompagnait » rend naturellement l’action en français tout en conservant l’aspect duratif de l’imparfait grec.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: Sopater, fils de Pyrrhus, originaire de Bérée
  rationale: Le génitif Πύρρου est compris comme un patronyme, « fils de Pyrrhus », et Βεροιαῖος comme une indication d’origine. « Originaire de Bérée » est plus immédiatement clair que « un Béréen ».
- source_word: Θεσσαλονικέων
  choice: de Thessalonique
  rationale: Le génitif pluriel désigne littéralement des personnes appartenant au groupe des Thessaloniciens. En français courant, « de Thessalonique » exprime clairement leur origine géographique; une note conserve la forme plus littérale.
- source_word: Γάϊος Δερβαῖος
  choice: Gaïus, de Derbé
  rationale: Δερβαῖος est un qualificatif géographique. « De Derbé » est naturel en français moderne et évite le gentilé rare « Derbéen ».
- source_word: Ἀσιανοὶ
  choice: de la province d’Asie
  rationale: Dans ce contexte, Ἀσιανοί désigne des personnes originaires de la province romaine d’Asie. L’explicitation « province » évite la confusion avec le continent moderne sans alourdir excessivement le texte.
- source_word: δέ ... δέ ... δέ
  choice: de même que ... ainsi que
  rationale: Les δέ successifs ajoutent plusieurs groupes à la liste. Ces coordinations françaises rendent cette progression sans attribuer aux particules une opposition absente du contexte.
