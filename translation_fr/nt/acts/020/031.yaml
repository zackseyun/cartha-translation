source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: fr
  text: C’est pourquoi, restez vigilants, en vous souvenant que, pendant trois ans, nuit et jour, je n’ai cessé, dans les larmes, d’avertir[a] chacun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reprendre et instruire ». Le verbe grec peut désigner l’avertissement et la correction, avec une dimension d’instruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Introduit la conséquence logique de l’avertissement précédent avec une tournure française naturelle.
- source_word: γρηγορεῖτε
  choice: restez vigilants
  rationale: L’impératif présent appelle à une vigilance continue; cette formulation est claire et actuelle.
- source_word: μνημονεύοντες
  choice: vous souvenant
  rationale: Le participe présent conserve le lien avec l’impératif principal et présente le souvenir comme accompagnant la vigilance.
- source_word: τριετίαν
  choice: pendant trois ans
  rationale: Rend naturellement l’accusatif exprimant la durée.
- source_word: νύκτα καὶ ἡμέραν
  choice: nuit et jour
  rationale: Conserve l’ordre grec et l’idée d’une activité continuelle.
- source_word: οὐκ ἐπαυσάμην
  choice: je n’ai cessé
  rationale: Expression française idiomatique qui traduit l’absence d’interruption sur toute la période évoquée.
- source_word: μετὰ δακρύων
  choice: avec larmes
  rationale: Préserve sobrement l’idée d’accompagnement et l’intensité affective du ministère de Paul.
- source_word: νουθετῶν
  choice: d’avertir
  rationale: Rend de façon accessible la dimension corrective et pastorale du verbe, sans le réduire à une simple transmission d’informations.
- source_word: ἕνα ἕκαστον
  choice: chacun
  rationale: Conserve l’accent distributif sur l’attention accordée individuellement, sans ajouter « de vous », qui reste implicite dans le contexte.
theological_decisions:
- issue: Portée pastorale de νουθετῶν
  choice: avertir
  alternative: exhorter; reprendre; instruire
  rationale: « Avertir » conserve la force de mise en garde corrective dans un français courant. La note signale que le verbe peut aussi inclure l’instruction et la correction, préservant ainsi son amplitude pastorale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe participiale est conservée sans lourdeur excessive, et l’ordre « nuit et jour » suit le grec.
