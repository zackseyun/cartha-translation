id: ACT.20.28
reference: Acts 20:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: fr
  text: Prenez garde à vous-mêmes et à tout le troupeau, au milieu duquel l’Esprit Saint vous a établis responsables, pour prendre soin de l’Église de Dieu[a] comme des bergers, elle qu’il s’est acquise par le sang de son propre Fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « l’Église du Seigneur » au lieu de « l’Église de Dieu ».
    reason: textual_variant
  - marker: b
    text: 'Le grec dit littéralement « par le sang de son propre [être] »; « son propre Fils » explicite une compréhension courante. Traduction traditionnelle : « par son propre sang ».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: Veillez attentivement sur
  rationale: L’impératif présent appelle une vigilance continue. Cette formulation française est naturelle et conserve la force pastorale du verbe.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: tout le troupeau
  rationale: Le nom collectif et la métaphore pastorale sont conservés; « tout le troupeau » rend naturellement παντί.
- source_word: ἐν ᾧ
  choice: au milieu duquel
  rationale: Cette tournure indique que les responsables ont été placés au sein du troupeau, sans suggérer qu’ils lui sont extérieurs.
- source_word: ἔθετο
  choice: a établis
  rationale: Dans ce contexte, τίθημι exprime l’affectation à une fonction; « établir » convient au registre ecclésial sans surdéterminer une structure ultérieure.
- source_word: ἐπισκόπους
  choice: responsables
  rationale: Le terme désigne ceux qui exercent une surveillance et prennent soin de la communauté. « Responsables » est compréhensible en français moderne et évite d’importer les connotations historiques de « évêques ».
- source_word: ποιμαίνειν
  choice: prendre soin, comme des bergers, de
  rationale: Cette formulation exprime clairement l’action demandée tout en maintenant l’image pastorale du verbe grec.
- source_word: ἐκκλησίαν
  choice: Église
  rationale: Ici, ἐκκλησία désigne la communauté chrétienne appartenant à Dieu; « Église » est le terme français consacré et immédiatement intelligible.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le texte principal du SBLGNT porte θεοῦ. La variante « du Seigneur » est signalée en note.
- source_word: περιεποιήσατο
  choice: s’est acquise
  rationale: Le moyen grec indique l’acquisition pour soi. « S’est acquise » conserve cette nuance sans imposer une métaphore strictement commerciale.
- source_word: διὰ τοῦ αἵματος τοῦ ἰδίου
  choice: par le sang de son propre Fils
  rationale: διά avec le génitif exprime ici le moyen. Le substantif implicite après τοῦ ἰδίου est rendu par « Fils » pour produire un français intelligible, tandis que la formulation plus littérale et l’autre lecture traditionnelle sont conservées en note.
theological_decisions:
- issue: Référent et portée de τοῦ αἵματος τοῦ ἰδίου
  choice: « par le sang de son propre Fils » dans le texte
  alternative: « par le sang de celui qui lui appartient en propre »; traditionnellement, « par son propre sang »
  rationale: L’adjectif substantivé τοῦ ἰδίου peut désigner « celui qui lui appartient en propre », généralement compris comme le Fils. L’explicitation donne une phrase française claire, mais la note préserve la concision et l’ambiguïté du grec ainsi que la lecture christologique traditionnelle.
- issue: Variante θεοῦ / κυρίου
  choice: « l’Église de Dieu »
  alternative: « l’Église du Seigneur »
  rationale: La traduction suit le texte fourni du SBLGNT, qui lit θεοῦ, tout en signalant la variante manuscrite importante.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les métaphores du troupeau et des bergers, mais les formule avec assez de naturel pour éviter un calque. « Responsables » traduit la fonction sans imposer le titre ecclésiastique plus tardif d’« évêques ».
