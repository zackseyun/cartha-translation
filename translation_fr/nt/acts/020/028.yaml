    issue: Rendu de προσέχετε ἑαυτοῖς
    rationale: « Veiller sur vous-mêmes » peut évoquer le soin ou la protection de soi, tandis que le grec appelle à porter une attention vigilante à soi-même. « Prenez garde à vous-mêmes » est plus direct et idiomatique.
  - severity: medium
    issue: Présentation de τοῦ ἰδίου dans la note
    rationale: La note actuelle appelle « littérale » une paraphrase qui introduit déjà « celui ». Le grec ne donne aucun nom après « son propre »; la note doit le montrer et présenter « Fils » comme une compréhension possible, sans la faire passer pour explicitement écrite.
