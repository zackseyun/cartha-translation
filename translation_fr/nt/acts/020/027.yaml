source:
  edition: SBLGNT
  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: fr
  text: Car je ne me suis pas dérobé à vous annoncer tout le dessein de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le plan de Dieu », « tout le projet de Dieu » ou « toute la volonté de Dieu ».
    reason: Alternatives lexicales pour βουλή, dont le sens peut couvrir le dessein, le plan, le projet ou la volonté de Dieu sans réduire le terme à une seule nuance doctrinale.
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit la justification de l’affirmation précédente tout en restant naturel en français moderne.
- source_word: ὑπεστειλάμην
  choice: je n’ai pas reculé
  rationale: Conserve l’image d’un retrait devant une tâche, en cohérence avec le même verbe en Actes 20.20.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: devant la tâche de vous annoncer
  rationale: Rend clairement le complément de ὑπεστειλάμην et évite l’ambiguïté possible de « reculer devant vous annoncer ».
- source_word: πᾶσαν
  choice: tout le
  rationale: Avec le nom singulier βουλή, souligne le caractère complet de ce que Paul a annoncé.
- source_word: βουλὴν
  choice: dessein
  rationale: « Dessein » peut désigner l’intention, le projet ou le plan de Dieu sans réduire le mot à un simple conseil donné ni à sa seule volonté morale.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Rend directement le génitif grec.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom est intégré naturellement au complément du verbe « annoncer » et conserve l’adresse aux anciens d’Éphèse.
theological_decisions:
- issue: Sens de βουλὴ τοῦ θεοῦ
  choice: tout le dessein de Dieu
  alternative: tout le plan de Dieu ; toute la volonté de Dieu ; tout ce que Dieu a décidé
  rationale: βουλή peut évoquer le dessein, le projet, la décision ou la volonté. « Dessein » maintient une portée suffisamment large, tandis que la note conserve les principales possibilités sans imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la métaphore du recul tout en explicitant idiomatiquement son complément. « Dessein » est plus naturel et plus large que le calque « conseil » dans ce contexte.
