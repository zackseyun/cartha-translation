review_pass:
  verdict: revise
  source_fidelity: La proposition rend correctement γάρ, πᾶσαν, βουλήν, le génitif « de Dieu » et le destinataire « vous ». Toutefois, « devant la tâche de » introduit l’idée d’une tâche, absente de l’expression grecque τοῦ μὴ ἀναγγεῖλαι. « Se dérober à vous annoncer » rend plus directement le refus de se retirer ou de retenir sa proclamation, sans ajouter cette notion.
  naturalness: « Car je ne me suis pas dérobé à vous annoncer… » est naturel en français moderne, soutenu sans être archaïque, et convient au ton du discours de Paul. « Car » exprime explicitement la valeur justificative de γάρ.
  terminology: '« Tout le dessein de Dieu » est une bonne traduction de πᾶσαν τὴν βουλὴν τοῦ θεοῦ : elle garde l’idée d’un projet/intention global sans imposer une lecture doctrinale de décret. La note doit proposer des équivalents nominaux réellement parallèles et éviter « tout ce que Dieu a décidé », qui tend à restreindre βουλή au seul décret déterminatif.'
  issues:
  - severity: medium
    issue: Ajout interprétatif de « la tâche »
    rationale: Le grec dit littéralement que Paul ne s’est pas retiré/retenu de l’acte d’annoncer ; il ne qualifie pas cet acte comme une « tâche ». Cette addition n’est pas nécessaire à l’idiomaticité française.
  - severity: low
    issue: Alternative de note trop restrictive
    rationale: « Tout ce que Dieu a décidé » peut suggérer exclusivement des décisions décrétales, alors que βουλή conserve ici un champ incluant dessein, plan, intention ou volonté.
