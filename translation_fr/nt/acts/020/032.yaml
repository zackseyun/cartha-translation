source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: fr
  text: Et maintenant, je vous confie à Dieu et à la parole de sa grâce[a], qui peut vous édifier et vous donner l’héritage parmi tous ceux qui ont été sanctifiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui qui peut vous édifier et vous donner l’héritage… », si le participe se rapporte principalement à Dieu plutôt qu’à « la parole de sa grâce ».'
    reason: Lecture syntaxique alternative authentique du participe τῷ δυναμένῳ.
lexical_decisions:
- source_word: παρατίθεμαι
  choice: je vous confie
  rationale: Le moyen exprime ici le fait de remettre les auditeurs aux soins de Dieu. « Confier » est naturel en français moderne et conserve cette idée.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif indique celui à qui Paul confie ses auditeurs.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: à la parole de sa grâce
  rationale: Cette formulation conserve la structure génitive et la portée théologique de λόγος, qui peut désigner la parole ou le message proclamé.
- source_word: τῷ δυναμένῳ
  choice: qui a le pouvoir
  rationale: Le participe peut grammaticalement renvoyer à « Dieu » ou, plus immédiatement, à « la parole de sa grâce ». Le relatif « qui » laisse davantage ouverte cette ambiguïté en français que « laquelle », tout en s’attachant naturellement à l’antécédent proche.
- source_word: οἰκοδομῆσαι
  choice: de bâtir
  rationale: Le verbe garde l’image biblique de la construction appliquée à l’édification spirituelle. L’objet implicite n’est pas ajouté dans le texte principal.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: de donner l’héritage
  rationale: La traduction reproduit directement le verbe et son objet, sans expliciter un bénéficiaire seulement implicite.
- source_word: κληρονομίαν
  choice: l’héritage
  rationale: « Héritage » est le terme français courant qui conserve la résonance biblique et eschatologique du mot grec.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: parmi tous ceux qui ont été sanctifiés
  rationale: La formulation verbale rend le participe parfait passif et son résultat durable; « parmi » exprime naturellement ici le sens collectif de ἐν.
theological_decisions:
- issue: Référent de τῷ δυναμένῳ (« celui/ce qui a le pouvoir »)
  choice: 'Dans le texte principal, la proposition relative se rattache naturellement à « la parole de sa grâce » : « qui a le pouvoir ».'
  alternative: 'Le participe peut renvoyer principalement à Dieu : « lui qui a le pouvoir ».'
  rationale: La syntaxe grecque permet les deux lectures. « La parole de sa grâce » est l’antécédent immédiat, et la parole proclamée peut être décrite comme agissante; toutefois, Dieu peut aussi être compris comme l’agent personnel qui bâtit et donne l’héritage. Une note conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la syntaxe grecque, conserve l’image de « bâtir » et évite d’ajouter un complément d’objet absent après οἰκοδομῆσαι.
