id: ACT.20.35
reference: Acts 20:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: fr
  text: 'En toutes choses, je vous ai montré qu’en travaillant dur de cette manière, il faut venir en aide aux faibles[a] et se souvenir des paroles du Seigneur Jésus, qui a dit lui-même : « Il y a plus de bonheur à donner qu’à recevoir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soutenir les faibles ». Le verbe grec peut évoquer une aide durable, et non seulement une intervention ponctuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: En toutes choses
  rationale: 'Compris adverbialement avec ὑπέδειξα : Paul évoque l’ensemble de son exemple et de son enseignement.'
- source_word: ὑπέδειξα
  choice: je vous ai montré
  rationale: Rend simplement l’idée de montrer ou démontrer, ici notamment par l’exemple.
- source_word: οὕτως κοπιῶντας
  choice: en travaillant dur de cette manière
  rationale: Préserve le renvoi à la manière de travailler de Paul ainsi que l’idée d’un effort pénible et soutenu.
- source_word: δεῖ
  choice: il faut
  rationale: Expression française naturelle qui conserve la nécessité ou l’obligation portée par le grec.
- source_word: ἀντιλαμβάνεσθαι
  choice: venir en aide
  rationale: Exprime clairement l’assistance apportée aux personnes faibles, tout en laissant en note la nuance possible d’un soutien durable.
- source_word: τῶν ἀσθενούντων
  choice: aux faibles
  rationale: Maintient l’étendue sémantique du grec sans préciser indûment une faiblesse physique, économique, sociale ou spirituelle.
- source_word: μνημονεύειν τε
  choice: et se souvenir
  rationale: Conserve la coordination avec l’obligation précédente dans un français fluide.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: des paroles du Seigneur Jésus
  rationale: Rendu direct de λόγων et maintien du titre κύριος.
- source_word: αὐτὸς εἶπεν
  choice: qui a dit lui-même
  rationale: La tournure conserve l’emphase portée par αὐτός sur Jésus comme source personnelle de la parole.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: Il y a plus de bonheur à donner qu’à recevoir
  rationale: Formulation française courante et digne qui rend le comparatif μᾶλλον et la notion de bonheur ou d’état bienheureux exprimée par μακάριον.
theological_decisions:
- issue: Portée de « ceux qui sont faibles »
  choice: aux faibles
  alternative: aux pauvres ; aux malades ; à ceux dont la foi est faible
  rationale: ἀσθενούντων reste sémantiquement large. Le contexte du travail et du don évoque les personnes vulnérables, mais ne permet pas de réduire explicitement la faiblesse à une seule catégorie.
- issue: Nature du bonheur associé au don
  choice: Il y a plus de bonheur à donner qu’à recevoir
  alternative: Il est plus bienheureux de donner que de recevoir
  rationale: « Bonheur » communique naturellement μακάριον sans décider si l’accent est principalement sur l’expérience présente, la faveur divine ou la bénédiction eschatologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation demeure accessible sans effacer l’intensité du travail ni préciser abusivement la nature de la faiblesse.
