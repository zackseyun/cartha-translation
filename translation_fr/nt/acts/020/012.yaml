source:
  edition: SBLGNT
  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: fr
  text: Ils emmenèrent le jeune homme vivant et furent grandement réconfortés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne furent pas modérément réconfortés », une manière de dire qu’ils le furent beaucoup.'
    reason: La note signale la litote grecque οὐ μετρίως, dont une traduction mot à mot serait peu naturelle en français moderne.
lexical_decisions:
- source_word: ἤγαγον
  choice: ramenèrent
  rationale: L’aoriste de ἄγω peut signifier « conduire », « amener » ou « emmener ». « Ramenèrent » convient naturellement au contexte où Eutychus est rendu vivant au groupe, sans préciser une destination absente du grec.
- source_word: παῖδα
  choice: jeune homme
  rationale: παῖς peut désigner un enfant, un garçon ou un serviteur. Ici, le mot reprend Eutychus, qualifié auparavant de νεανίας (« jeune homme ») au verset 9 ; « jeune homme » évite aussi de suggérer à tort qu’il était serviteur.
- source_word: ζῶντα
  choice: vivant
  rationale: Le participe est employé comme attribut du jeune homme et indique l’état dans lequel il fut ramené. « Vivant » rend directement cette valeur.
- source_word: παρεκλήθησαν
  choice: furent … réconfortés
  rationale: Dans ce contexte de chute mortelle apparente puis de retour à la vie, le sens de consolation et de soulagement de παρακαλέω est prédominant. « Réconfortés » reste naturel et digne.
- source_word: οὐ μετρίως
  choice: grandement
  rationale: L’expression est une litote, littéralement « pas modérément », qui signifie « beaucoup » ou « grandement ». La traduction exprime clairement sa force idiomatique, tandis que la note conserve sa forme rhétorique.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La coordination du grec est conservée ; « en » relie explicitement le réconfort au fait d’avoir retrouvé le jeune homme vivant. La litote est rendue idiomatiquement dans le texte et expliquée en note.
