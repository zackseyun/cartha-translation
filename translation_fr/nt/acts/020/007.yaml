  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: fr
  text: Le premier jour de la semaine, alors que nous étions réunis pour rompre le pain[a], Paul s’entretenait avec eux et, comme il allait partir le lendemain[b], il prolongeait son discours jusqu’à minuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner un repas partagé et peut aussi évoquer le repas du Seigneur.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « puisqu’il était sur le point de partir le lendemain ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: Le premier jour de la semaine
  rationale: L’expression est un idiome grec courant désignant le premier jour de la semaine. Le léger connecteur δέ n’exige pas ici de mot distinct en français.
- source_word: συνηγμένων ἡμῶν
  choice: alors que nous étions réunis
  rationale: Le génitif absolu fournit le cadre circonstanciel tout en conservant la perspective narrative à la première personne du pluriel.
- source_word: κλάσαι ἄρτον
  choice: pour rompre le pain
  rationale: L’infinitif exprime le but. L’idiome français préserve l’ouverture entre repas communautaire et résonance eucharistique.
- source_word: διελέγετο αὐτοῖς
  choice: s’entretenait avec eux
  rationale: L’imparfait marque une action prolongée, et le verbe pronominal « s’entretenir avec » rend la possible dimension interactive de διαλέγομαι sans imposer l’idée d’une prédication monologique.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: Comme il devait partir le lendemain
  rationale: μέλλω avec l’infinitif exprime ici un départ imminent ou prévu. « Devait partir » est naturel en français et « comme » rend la relation circonstancielle, possiblement causale, avec la prolongation du discours.
- source_word: παρέτεινέν τε τὸν λόγον
  choice: il prolongea son discours
  rationale: παρατείνω signifie prolonger, tandis que λόγος désigne ici la prise de parole ou le discours de Paul. Le passé simple convient au fil narratif français.
- source_word: μέχρι μεσονυκτίου
  choice: jusqu’à minuit
  rationale: Rend directement la limite temporelle indiquée par le grec.
theological_decisions:
- issue: Sens de « rompre le pain » dans le rassemblement chrétien
  choice: Conserver l’expression « rompre le pain »
  alternative: « prendre un repas ensemble » ou « célébrer le repas du Seigneur »
  rationale: Le grec peut désigner un repas partagé et comporter une dimension liée au repas du Seigneur. La formulation retenue ne tranche pas une nuance que le texte laisse ouverte.
- issue: Caractère de la prise de parole de Paul
  choice: « s’entretenait avec eux »
  alternative: « leur parlait », « leur adressait un discours » ou « prêchait »
  rationale: διαλέγομαι peut évoquer un exposé comportant un échange. La traduction conserve cette possibilité sans exclure une allocution prolongée.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est légèrement segmentée pour la lisibilité, sans effacer les liens circonstanciels ni l’ambiguïté du repas et de la prise de parole.
