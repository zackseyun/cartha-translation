  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: fr
  text: Et de là, après avoir pris la mer, nous sommes arrivés le lendemain en face de Chios[a]. Le jour suivant, nous avons fait escale à Samos[b], et le jour d’après, nous sommes arrivés à Milet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au large de Chios ». Le grec situe le navire en face de l’île, sans indiquer nécessairement qu’il y a accosté.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous avons accosté à Samos ». Le verbe grec est un terme nautique pouvant désigner le fait d’amener le navire près du rivage ou d’y faire halte.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: De là
  rationale: La crase unit καί et ἐκεῖθεν. En français, « De là » assure naturellement la continuité du récit sans exiger un « et » initial.
- source_word: ἀποπλεύσαντες
  choice: après avoir repris la mer
  rationale: Le participe aoriste exprime une action antérieure à l’arrivée. Dans cet itinéraire déjà engagé, « reprendre la mer » rend naturellement le départ par bateau.
- source_word: τῇ ἐπιούσῃ
  choice: le lendemain
  rationale: Cette expression temporelle désigne le jour suivant; « le lendemain » est la formulation française la plus idiomatique.
- source_word: κατηντήσαμεν ἄντικρυς Χίου
  choice: nous sommes arrivés le lendemain en face de Chios
  rationale: καταντάω indique ici que les voyageurs atteignent une position, tandis que ἄντικρυς situe le navire en face de l’île sans impliquer un débarquement.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: Le jour suivant
  rationale: L’expression marque l’étape chronologique suivante; cette formulation conserve clairement la succession des jours.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: nous avons fait escale à Samos
  rationale: Dans ce contexte nautique, παραβάλλω évoque le fait d’aborder ou de faire une halte. « Faire escale » est clair et naturel, sans préciser indûment la durée de l’arrêt.
- source_word: τῇ δὲ ἐχομένῃ
  choice: le jour d’après
  rationale: L’expression désigne encore le jour qui suit dans la série; « le jour d’après » évite une répétition lourde tout en gardant la chronologie.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: nous sommes arrivés à Milet
  rationale: Le verbe courant ἔρχομαι, avec εἰς et la destination, se rend naturellement ici par « arriver à ».
- source_word: Χίου / Σάμον / Μίλητον
  choice: Chios / Samos / Milet
  rationale: Les toponymes suivent leurs formes françaises usuelles.
