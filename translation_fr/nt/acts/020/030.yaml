revisions:
- from: Et parmi vous-mêmes surgiront des hommes qui enseigneront des choses déformées afin d’entraîner les disciples à leur suite.[a]
  to: Et parmi vous-mêmes surgiront des hommes qui tiendront des propos déformés[a], afin d’entraîner les disciples à leur suite.
  rationale: La révision remplace « enseigneront » par « tiendront des propos », qui rend l’activité de parole sans ajout interprétatif. Elle maintient l’emphase d’une menace surgissant du sein même du groupe, le genre masculin de ἄνδρες, la finalité exprimée par τοῦ ἀποσπᾶν et l’allégeance personnelle indiquée par ὀπίσω ἑαυτῶν. La note est resserrée afin de ne présenter que des variantes lexicales fidèles.
