  timestamp: '2026-07-14T11:15:35Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’origine interne de la menace, le futur, le masculin explicite de ἄνδρες, le but et l’idée d’amener les disciples à suivre ces hommes. Toutefois, « enseigneront » est plus spécifique que λαλοῦντες (« parlant/disant ») et introduit une activité d’enseignement que le grec n’énonce pas.
  naturalness: « Parmi vous-mêmes », « surgiront », « des hommes » et « à leur suite » sont naturels en français international moderne. « Tiendront des propos déformés » est idiomatique et conserve une formulation suffisamment générale.
  terminology: « Disciples » est le terme approprié dans les Actes. « Propos déformés » rend le neutre pluriel substantivé διεστραμμένα sans imposer une hérésie déterminée ni restreindre le sens à la perversité morale.
  issues:
  - severity: medium
    issue: « enseigneront » surinterprète λαλοῦντες.
    rationale: Le participe λαλοῦντες signifie « parlant » ou « disant » ; il ne caractérise pas nécessairement ces hommes comme enseignant. Une formulation centrée sur leurs propos conserve mieux la portée du grec.
  - severity: low
    issue: La note propose « qui déformeront la vérité », une reformulation active et plus explicite que le grec.
    rationale: διεστραμμένα est un participe parfait passif neutre pluriel (« choses/propos déformés, pervers »). La note devrait offrir des équivalents lexicaux sans introduire explicitement « la vérité » ni changer la construction.
  revised_text: Et parmi vous-mêmes surgiront des hommes qui tiendront des propos déformés[a], afin d’entraîner les disciples à leur suite.
  revised_footnotes:
