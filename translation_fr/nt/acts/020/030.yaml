id: ACT.20.30
reference: Acts 20:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: fr
  text: Et parmi vous-mêmes surgiront des hommes qui tiendront des propos déformés[a], afin d’entraîner les disciples à leur suite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des propos pervers » ou « des propos distordus ».'
    reason: Alternatives lexicales pour διεστραμμένα ; elles conservent la portée générale du participe neutre pluriel sans expliciter une doctrine ou modifier la voix.
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: parmi vous-mêmes
  rationale: 'Cette formulation conserve l’insistance de αὐτῶν : la menace viendra de l’intérieur même de la communauté.'
- source_word: ἀναστήσονται
  choice: surgiront
  rationale: Dans ce contexte, le futur de ἀνίστημι annonce que ces hommes apparaîtront ou émergeront au sein du groupe.
- source_word: ἄνδρες
  choice: des hommes
  rationale: ἀνήρ est ici explicitement masculin ; la traduction ne neutralise pas ce trait du texte grec.
- source_word: λαλοῦντες
  choice: qui enseigneront
  rationale: Le sens premier est « parlant », mais, dans le contexte de dirigeants s’adressant à des disciples, « enseigneront » exprime naturellement l’activité verbale visée sans préciser le contenu au-delà de la proposition suivante.
- source_word: διεστραμμένα
  choice: des choses déformées
  rationale: Le participe parfait passif substantivé désigne des propos qui ont été détournés de ce qui est droit ou vrai. « Déformées » reste large et évite de réduire l’expression à la seule perversité morale.
- source_word: τοῦ ἀποσπᾶν
  choice: afin d’entraîner
  rationale: L’infinitif articulé exprime le but, tandis que ἀποσπάω évoque l’action d’arracher ou d’éloigner. « Entraîner » est idiomatique avec « à leur suite » et garde l’idée de détournement vers un autre meneur.
- source_word: τοὺς μαθητὰς
  choice: les disciples
  rationale: « Disciples » est le terme établi dans les Actes pour les personnes qui suivent Jésus.
- source_word: ὀπίσω ἑαυτῶν
  choice: à leur suite
  rationale: 'L’expression idiomatique désigne ici l’allégeance : ces hommes cherchent à faire d’eux-mêmes les meneurs suivis par les disciples.'
theological_decisions:
- issue: Nature des propos des faux enseignants
  choice: des choses déformées
  alternative: des choses perverses ; des propos qui déforment la vérité
  rationale: Le grec signale une déviation sans définir une hérésie précise ni limiter la faute au domaine moral. La formulation choisie maintient cette portée générale.
- issue: Genre de ἄνδρες
  choice: des hommes
  alternative: des gens ; des personnes
  rationale: Le nom grec est spécifiquement masculin ; le rendre ainsi préserve l’information explicite du texte.
- issue: Finalité de leur parole
  choice: afin d’entraîner les disciples à leur suite
  alternative: pour détourner les disciples et les amener à les suivre
  rationale: La traduction conserve à la fois la proposition de but et la recherche d’une allégeance personnelle, sans préciser davantage la nature institutionnelle ou doctrinale de cette rupture.
translation_notes:
  register: Français international moderne, naturel et digne. « Parmi vous-mêmes » maintient l’emphase interne ; « à leur suite » rend idiomatiquement la recherche d’adhérents. Le marqueur de note est placé après la phrase concernée.
