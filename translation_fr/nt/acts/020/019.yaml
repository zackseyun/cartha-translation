  variant: modern international French
source:
  edition: SBLGNT
  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: fr
  text: servant le Seigneur en toute humilité, avec des larmes et des épreuves[a] qui me sont survenues au milieu des complots des Juifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tentations » ou « mises à l’épreuve » ; ici, le contexte indique des épreuves extérieures liées à l’opposition.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des adversaires juifs particuliers qui complotaient contre Paul, et non d’une affirmation sur l’ensemble des Juifs.
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: servant
  rationale: Le participe présent décrit la manière constante dont Paul a exercé son ministère. « Servant » exprime naturellement un service dévoué sans accentuer ici le statut d’esclave.
- source_word: τῷ κυρίῳ
  choice: le Seigneur
  rationale: Rend directement le titre κύριος sans préciser davantage son référent; dans ce contexte, il désigne très probablement le Seigneur Jésus.
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: en toute humilité
  rationale: Formulation française naturelle qui conserve la valeur intensive de πάσης et exprime la manière de servir.
- source_word: δακρύων
  choice: des larmes
  rationale: Le nom concret au pluriel préserve la force émotionnelle du discours de Paul.
- source_word: πειρασμῶν
  choice: épreuves
  rationale: Le contexte des complots indique des adversités extérieures plutôt que des incitations intérieures au péché; une note conserve les autres valeurs possibles du terme.
- source_word: τῶν συμβάντων μοι
  choice: qui me sont survenues
  rationale: Le participe substantivé précise qu’il s’agit des épreuves arrivées à Paul; cette tournure est claire et digne en français moderne.
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: à cause des complots
  rationale: Dans ce contexte, ἐν indique vraisemblablement la circonstance ou la cause des épreuves. « À cause de » rend clairement ce rapport sans suggérer que Paul participait aux complots.
- source_word: τῶν Ἰουδαίων
  choice: de certains Juifs
  rationale: Le génitif désigne les auteurs juifs des complots. L’ajout explicatif minimal « certains » rend en français la portée contextuellement limitée du pluriel défini, sans le généraliser à l’ensemble des Juifs.
theological_decisions:
- issue: Risque d’une lecture antijuive de τῶν Ἰουδαίων
  choice: « de certains Juifs », avec une note précisant qu’il s’agit des adversaires particuliers de Paul
  alternative: « des Juifs » ou « des chefs juifs »
  rationale: Le grec nomme des Juifs sans limiter explicitement le groupe aux chefs, mais le contexte ne vise manifestement pas tout le peuple juif. « Certains » explicite cette portée particulière sans importer une fonction dirigeante absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La construction participiale est conservée pour s’intégrer à la phrase commencée au verset précédent. « Avec des larmes et au milieu des épreuves » distingue idiomatiquement l’accompagnement émotionnel des circonstances adverses.
