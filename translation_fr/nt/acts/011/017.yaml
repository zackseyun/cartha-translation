id: ACT.11.17
reference: Acts 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: fr
  text: Si donc Dieu leur a accordé le même don qu’à nous qui avons cru au Seigneur Jésus, le Messie[a], qui étais-je, moi, pour pouvoir faire obstacle à Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le Christ » : le grec Χριστόν est ici rendu par « le Messie » parce que sa valeur de titre demeure perceptible.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: le même don
  rationale: ἴσην exprime ici l’égalité ou l’équivalence du don reçu par les deux groupes. « Le même don » est naturel en français et convient à la comparaison.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: à nous qui avons cru au Seigneur Jésus, le Messie
  rationale: Le participe aoriste au datif pluriel se rattache grammaticalement à ἡμῖν. La relative « qui avons cru » conserve ce lien sans imposer une relation temporelle plus précise. πιστεύω ἐπί avec l’accusatif désigne ici la personne en qui la foi est placée.
- source_word: κύριον
  choice: Seigneur
  rationale: Dans cette confession christologique, κύριος est un titre de Jésus et se rend naturellement par « Seigneur ».
- source_word: Χριστόν
  choice: le Messie
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » rend ce sens explicitement et de manière idiomatique en français.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: qui étais-je, moi, pour pouvoir
  rationale: Cette formulation restitue l’emphase de ἐγώ, la question rhétorique et l’idée de capacité portée par δυνατός, dans un français naturel.
- source_word: κωλῦσαι
  choice: faire obstacle à
  rationale: κωλύω signifie empêcher ou entraver. « Faire obstacle à Dieu » préserve l’expression frappante du grec tout en étant idiomatique.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: 'Dieu est l’objet direct de κωλῦσαι : s’opposer à l’accueil des non-Juifs aurait équivalu à faire obstacle à Dieu lui-même.'
theological_decisions:
- issue: Rendu de Χριστόν dans κύριον Ἰησοῦν Χριστόν
  choice: le Messie
  alternative: le Christ
  rationale: Le terme garde ici une valeur titulaire. « Le Messie » préserve sa portée messianique plutôt que de le traiter comme un simple élément de nom.
- issue: Relation de πιστεύσασιν avec ἡμῖν
  choice: à nous qui avons cru
  alternative: à nous lorsque nous avons cru
  rationale: La relative suit directement l’accord grammatical du participe avec ἡμῖν et laisse ouverte sa nuance circonstancielle, sans préciser davantage la chronologie du don et de la foi.
- issue: Force de κωλῦσαι τὸν θεόν
  choice: faire obstacle à Dieu
  alternative: empêcher Dieu
  rationale: Le choix conserve l’audace théologique de l’expression grecque sans suggérer que Pierre aurait effectivement eu le pouvoir souverain d’arrêter l’action divine.
translation_notes:
  register: Français international moderne, digne et accessible. La structure rhétorique de la question est conservée, avec « moi » détaché pour rendre l’emphase grecque. La virgule avant « le Messie » marque naturellement l’apposition du titre en français.
