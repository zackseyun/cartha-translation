revisions:
- from: Mais quelques-uns d’entre eux étaient des hommes originaires de Chypre et de Cyrène. Arrivés à Antioche, ils s’adressaient aussi aux Juifs de langue grecque[a] et leur annonçaient la bonne nouvelle du Seigneur Jésus.
  to: Mais quelques-uns d’entre eux étaient des hommes originaires de Chypre et de Cyrène. Arrivés à Antioche, ils s’adressaient aussi aux Juifs de langue grecque[a], leur annonçant comme bonne nouvelle le Seigneur Jésus.
  rationale: La révision se limite à rendre explicitement le Seigneur Jésus comme le contenu de l’annonce évangélique, conformément à l’accusatif grec après εὐαγγελιζόμενοι. Le traitement de la variante textuelle et l’ambiguïté textuelle qu’elle porte sont conservés.
  reviewer_model: gpt-5.6-terra
