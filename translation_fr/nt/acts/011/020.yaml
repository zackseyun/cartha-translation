review_pass:
  verdict: revise
  source_fidelity: 'Le texte suit correctement Ἑλληνιστάς (« Juifs de langue grecque ») et conserve de façon appropriée la variante importante Ἕλληνας en note. L’imparfait « s’adressaient » rend bien ἐλάλουν, et « aussi » reflète de manière recevable la valeur additive de καί. En revanche, « leur annonçaient la bonne nouvelle du Seigneur Jésus » transforme légèrement l’accusatif τὸν κύριον Ἰησοῦν, objet de εὐαγγελιζόμενοι : le grec présente le Seigneur Jésus comme le contenu de la bonne nouvelle, plutôt qu’une bonne nouvelle simplement qualifiée comme étant la sienne.'
  naturalness: Le français est clair, moderne et adapté à un registre biblique courant. « Juifs de langue grecque » est une explicitation naturelle de « hellénistes ». La formulation révisée demeure idiomatique tout en reproduisant plus exactement la relation syntaxique grecque.
  terminology: « Seigneur Jésus » conserve correctement le titre κύριος. « Juifs de langue grecque » est approprié pour Ἑλληνιστάς dans le texte principal; la note distingue clairement la leçon variante « Grecs », avec son sens probable de non-Juifs.
  issues:
  - severity: medium
    issue: Le complément de « annoncer la bonne nouvelle » est rendu par « du Seigneur Jésus ».
    rationale: 'εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν emploie « le Seigneur Jésus » comme objet direct : il est ce qui est annoncé comme bonne nouvelle. Le génitif français « du Seigneur Jésus » peut plutôt suggérer une bonne nouvelle provenant de lui ou le concernant. « leur annonçant comme bonne nouvelle le Seigneur Jésus » préserve plus directement le sens sans trancher au-delà du grec.'
  revised_text: Mais quelques-uns d’entre eux étaient des hommes originaires de Chypre et de Cyrène. Arrivés à Antioche, ils s’adressaient aussi aux Juifs de langue grecque[a], leur annonçant comme bonne nouvelle le Seigneur Jésus.
  revised_footnotes:
  - marker: a
    text: Certains manuscrits lisent « Grecs » au lieu de « Juifs de langue grecque ». Si cette leçon est originale, il s’agit de non-Juifs.
    reason: textual_variant
  revision_rationale: La révision se limite à rendre explicitement le Seigneur Jésus comme le contenu de l’annonce évangélique, conformément à l’accusatif grec après εὐαγγελιζόμενοι. Le traitement de la variante textuelle et l’ambiguïté textuelle qu’elle porte sont conservés.
