id: ACT.11.20
reference: Acts 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: fr
  text: Mais quelques-uns d’entre eux étaient des hommes originaires de Chypre et de Cyrène. Arrivés à Antioche, ils s’adressaient aussi aux Juifs de langue grecque[a], leur annonçant comme bonne nouvelle le Seigneur Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits lisent « Grecs » au lieu de « Juifs de langue grecque ». Si cette leçon est originale, il s’agit de non-Juifs.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: quelques-uns
  rationale: Désigne une partie non précisée du groupe mentionné précédemment, dans un français naturel.
- source_word: ἄνδρες
  choice: des hommes
  rationale: Le nom grec désigne ici explicitement des hommes adultes; la traduction conserve cette précision.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: originaires de Chypre et de Cyrène
  rationale: Les adjectifs ethniques indiquent l’origine; cette formulation est idiomatique en français moderne.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Arrivés à Antioche
  rationale: Le participe aoriste exprime naturellement une circonstance temporelle antérieure ou concomitante à l’action principale.
- source_word: ἐλάλουν
  choice: ils s’adressaient
  rationale: L’imparfait grec évoque une activité prolongée ou répétée; l’imparfait français en préserve l’aspect.
- source_word: καὶ
  choice: aussi
  rationale: Dans le contexte, καί paraît élargir l’auditoire par rapport aux destinataires précédemment mentionnés.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: aux Juifs de langue grecque
  rationale: Ἑλληνιστής désigne normalement un helléniste, c’est-à-dire ici un Juif de langue grecque. La formulation explicite le sens courant sans employer un terme français potentiellement obscur.
- source_word: εὐαγγελιζόμενοι
  choice: leur annonçaient la bonne nouvelle
  rationale: Le participe décrit la nature de leur prise de parole; cette expression accessible conserve le sens d’annonce de l’Évangile.
- source_word: τὸν κύριον Ἰησοῦν
  choice: du Seigneur Jésus
  rationale: La construction peut désigner le contenu ou l’objet de la bonne nouvelle; «du Seigneur Jésus» reste naturel tout en évitant une explicitation excessive.
theological_decisions:
- issue: Identité des Ἑλληνιστάς et variante textuelle Ἕλληνας
  choice: 'Le texte principal suit le SBLGNT: «Juifs de langue grecque».'
  alternative: «Grecs», au sens de non-Juifs
  rationale: La leçon imprimée Ἑλληνιστάς désigne normalement des Juifs hellénophones, tandis que la variante Ἕλληνας désignerait vraisemblablement des non-Juifs. La variante est conservée en note à cause de son importance narrative et théologique.
- issue: Rapport de τὸν κύριον Ἰησοῦν avec εὐαγγελιζόμενοι
  choice: «la bonne nouvelle du Seigneur Jésus»
  alternative: «annonçaient comme bonne nouvelle le Seigneur Jésus» ou «la bonne nouvelle au sujet du Seigneur Jésus»
  rationale: Le génitif français demeure assez ouvert pour présenter Jésus comme le contenu central de l’annonce sans imposer une analyse plus étroite que le grec.
translation_notes:
  register: Français international moderne, courant et digne. «Juifs de langue grecque» privilégie la compréhension immédiate plutôt que le calque «hellénistes». L’imparfait rend l’action continue ou répétée.
