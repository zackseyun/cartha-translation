id: ACT.11.1
reference: Acts 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: fr
  text: Les apôtres et les frères qui se trouvaient dans toute la Judée apprirent que les non-Juifs avaient eux aussi accueilli la parole de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et les sœurs » ; le grec dit « les frères », terme qui peut désigner plus largement les autres croyants.
    reason: alternative lexicale et précision sur la portée inclusive possible du terme grec
lexical_decisions:
- source_word: Ἤκουσαν
  choice: apprirent
  rationale: Dans ce contexte de nouvelle rapportée, ἀκούω signifie qu’ils eurent connaissance de l’événement. « Apprirent » est plus naturel en français que le calque « entendirent que ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition narrative légère, sans contraste marqué. Le français enchaîne naturellement sans ajouter « or » ou « alors ».
- source_word: οἱ ἀπόστολοι
  choice: les apôtres
  rationale: Terme consacré et précis pour le groupe apostolique reconnu dans les Actes.
- source_word: οἱ ἀδελφοὶ
  choice: les frères
  rationale: Conserve la forme masculine du grec et l’usage communautaire ancien, tout en signalant par une note que le terme peut désigner plus largement les croyants, femmes comprises.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: qui se trouvaient dans toute la Judée
  rationale: 'Rend la localisation et la valeur distributive de κατά : les croyants étaient dispersés à travers la Judée.'
- source_word: ὅτι καὶ τὰ ἔθνη
  choice: que les non-Juifs avaient eux aussi
  rationale: Dans ce contexte, τὰ ἔθνη désigne les personnes qui ne sont pas juives. « Eux aussi » préserve l’accent inclusif de καί.
- source_word: ἐδέξαντο
  choice: avaient accueilli
  rationale: Le verbe δέχομαι peut exprimer une réception favorable. « Accueillir la parole » communique ici l’acceptation du message, et le plus-que-parfait marque son antériorité par rapport à la nouvelle apprise.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Conserve l’expression biblique habituelle et sa portée théologique, tout en restant claire en français moderne.
theological_decisions:
- issue: Portée de ἀδελφοὶ dans la communauté croyante
  choice: les frères
  alternative: les frères et les sœurs ; les croyants
  rationale: La traduction maintient la forme masculine du texte grec sans décider que seuls des hommes sont visés. La note explicite sa possible portée collective.
- issue: Sens de la réception de la parole par les non-Juifs
  choice: avaient accueilli la parole de Dieu
  alternative: avaient reçu la parole de Dieu
  rationale: « Accueilli » rend la réception favorable impliquée par le contexte sans développer davantage la nature théologique de cette réponse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’accent sur l’inclusion des non-Juifs grâce à « eux aussi », sans ajouter de connecteur initial absent comme mot temporel explicite dans le grec.
