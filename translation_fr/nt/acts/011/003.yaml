  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: fr
  text: 'en disant : « Tu es entré chez des hommes incirconcis[a] et tu as mangé avec eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des hommes ayant l’incirconcision »; cette expression désigne ceux qui ne portaient pas la marque juive de l’alliance qu’était la circoncision, c’est-à-dire les non-Juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit les paroles d’accusation et maintient le lien syntaxique avec le contexte précédent.
- source_word: ὅτι
  choice: «
  rationale: ὅτι introduit ici le discours direct, rendu naturellement en français par des guillemets.
- source_word: Εἰσῆλθες
  choice: tu es entré
  rationale: L’aoriste de εἰσέρχομαι désigne concrètement le fait d’entrer dans le lieu où se trouvaient ces hommes.
- source_word: πρὸς ἄνδρας
  choice: chez des hommes
  rationale: Avec des personnes, πρός après un verbe de mouvement peut exprimer l’entrée auprès d’elles ou chez elles. « Chez des hommes » est idiomatique et conserve l’idée d’avoir pénétré dans leur espace.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: incirconcis
  rationale: L’expression grecque, littéralement « ayant l’incirconcision », désigne ces hommes par l’absence de la marque de l’alliance. « Incirconcis » garde cette formulation chargée de sens sans la remplacer par l’interprétation « non-Juifs ».
- source_word: καὶ
  choice: et
  rationale: Coordonne directement les deux griefs.
- source_word: συνέφαγες αὐτοῖς
  choice: tu as mangé avec eux
  rationale: Le verbe composé συνεσθίω exprime le fait de manger en compagnie d’autres personnes; cette traduction est directe et naturelle.
theological_decisions:
- issue: Rendre ἀκροβυστίαν ἔχοντας par une désignation interprétative ou conserver le langage de la circoncision
  choice: des hommes incirconcis
  alternative: des non-Juifs
  rationale: L’accusation est formulée en fonction de la circoncision, marque de l’alliance et frontière sociale. Conserver « incirconcis » préserve la portée théologique et le caractère offensant du reproche sans réduire l’expression à une simple catégorie ethnique.
translation_notes:
  register: Français moderne, clair et digne. « Chez des hommes » rend naturellement le mouvement vers leur lieu de vie; le point d’exclamation fait entendre la vigueur accusatrice de la réplique sans en modifier le contenu.
