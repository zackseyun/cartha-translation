id: ACT.11.24
reference: Acts 11:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: fr
  text: Car c’était un homme bon, plein de l’Esprit Saint et de foi[a]. Et une foule nombreuse fut ajoutée au Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fidélité ». Le mot grec pistis peut aussi signifier « fidélité » ou « confiance » ; le texte principal retient ici le sens courant « foi ».'
    reason: Alternative lexicale pour πίστεως, dont la nuance peut décrire soit la foi de Barnabas, soit sa fidélité.
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit l’explication de l’appréciation précédente concernant Barnabas et conserve naturellement la valeur explicative du grec.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le nom masculin singulier désigne précisément Barnabas; il n’y a pas lieu de le neutraliser.
- source_word: ἀγαθὸς
  choice: bon
  rationale: Équivalent direct et idiomatique qui exprime la qualité morale sans en préciser excessivement la nuance.
- source_word: πλήρης
  choice: plein de
  rationale: Construction française naturelle devant les compléments « de l’Esprit Saint et de foi ».
- source_word: πνεύματος ἁγίου
  choice: l’Esprit Saint
  rationale: Dans Luc-Actes, l’expression désigne normalement l’Esprit Saint; l’article défini convient à l’usage français.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le sens courant de πίστις et convient ici, tout en laissant en note la possibilité contextuelle de « fidélité ».
- source_word: προσετέθη
  choice: se joignit
  rationale: Le verbe français exprime idiomatiquement l’affiliation au Seigneur tout en conservant la voix et le mouvement d’association du passif grec; « fut ajoutée » serait plus formel mais moins naturel.
- source_word: ὄχλος ἱκανὸς
  choice: une foule nombreuse
  rationale: Rend clairement l’idée d’un groupe d’une importance numérique notable dans un français naturel.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Conserve l’objet explicitement indiqué par le grec sans le remplacer par « à l’Église » ou « à la communauté ».
theological_decisions:
- issue: Sens de πνεύματος ἁγίου
  choice: Référence à l’Esprit Saint
  alternative: un esprit ou une disposition sainte
  rationale: Dans Luc-Actes, πνεῦμα ἅγιον renvoie de façon prédominante à l’Esprit Saint, et la description de Barnabas correspond à cette lecture.
- issue: Nuance de πίστεως dans la description de Barnabas
  choice: foi
  alternative: fidélité
  rationale: Le contexte peut évoquer aussi bien la confiance croyante que la fidélité de caractère. Le texte principal retient le sens courant « foi », tandis que la note préserve l’autre possibilité.
- issue: Objet de προσετέθη ... τῷ κυρίῳ
  choice: La foule se joint au Seigneur
  alternative: La foule est ajoutée à l’Église ou à la communauté
  rationale: Le grec nomme explicitement le Seigneur comme terme de l’ajout. L’intégration communautaire peut être impliquée, mais elle ne doit pas remplacer l’objet formulé dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Car » maintient le lien explicatif avec le contexte précédent. « Se joignit au Seigneur » évite le calque peu naturel « fut ajoutée au Seigneur » sans substituer l’Église au Seigneur. Le marqueur [a] figure immédiatement après « bon », conformément à la note fournie.
