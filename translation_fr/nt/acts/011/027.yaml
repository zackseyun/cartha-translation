  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: fr
  text: En ces jours-là, des prophètes descendirent de Jérusalem à Antioche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: En ces jours-là
  rationale: La formule établit le cadre temporel. En français, « En ces jours-là » conserve cette formulation, tandis que la faible valeur connective de δέ peut rester implicite.
- source_word: κατῆλθον
  choice: descendirent
  rationale: κατέρχομαι exprime un déplacement vers le bas. Le passé simple convient au registre narratif français et, contrairement à l’anglais, « descendre » n’oblige pas ici à choisir entre « venir » et « aller ».
- source_word: ἀπὸ Ἱεροσολύμων
  choice: de Jérusalem
  rationale: ἀπό marque le point de départ. Le nom de la ville se rend naturellement au singulier en français malgré sa forme grecque.
- source_word: προφῆται
  choice: des prophètes
  rationale: « Prophètes » est l’équivalent direct et courant, sans préciser davantage la nature ou l’étendue de leur ministère.
- source_word: εἰς Ἀντιόχειαν
  choice: à Antioche
  rationale: εἰς indique la destination; devant un nom de ville, « à Antioche » est la tournure française naturelle.
theological_decisions:
- issue: Nature des « prophètes » dans le contexte des Églises de Jérusalem et d’Antioche
  choice: Conserver simplement « prophètes »
  alternative: « enseignants prophétiques » ou « messagers inspirés »
  rationale: Le grec ne définit pas ici plus précisément leur fonction. La traduction évite donc de les assimiler soit aux prophètes canoniques de l’Ancien Testament, soit à de simples prédicateurs inspirés.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le style du récit biblique sans archaïsme lexical. Le marqueur [a] est placé après la phrase à laquelle il se rapporte.
