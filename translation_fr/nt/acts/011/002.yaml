  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: fr
  text: Mais lorsque Pierre monta à Jérusalem, ceux de la circoncision[a] lui faisaient des reproches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux de la circoncision ». L’expression peut désigner les croyants circoncis, ou un groupe de croyants ainsi identifié; elle ne précise pas à elle seule la délimitation exacte du groupe.'
    reason: alternative lexicale et préservation de l’ambiguïté quant à la délimitation du groupe
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais lorsque
  rationale: δέ marque ici une progression narrative avec une légère nuance de contraste; « Mais lorsque » conserve cette articulation en français naturel.
- source_word: ἀνέβη
  choice: monta
  rationale: Avec Jérusalem, ἀναβαίνω emploie l’expression géographique traditionnelle « monter à Jérusalem ».
- source_word: Ἰερουσαλήμ
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: διεκρίνοντο
  choice: lui faisaient des reproches
  rationale: Dans ce contexte, l’imparfait de διακρίνω décrit une contestation adressée à Pierre. Cette tournure exprime l’opposition verbale en cours sans exagérer son hostilité.
- source_word: πρὸς αὐτόν
  choice: lui
  rationale: Avec ce verbe de contestation, πρός indique la personne visée; le pronom indirect donne une formulation française idiomatique.
- source_word: οἱ ἐκ περιτομῆς
  choice: les partisans de la circoncision
  rationale: La formule grecque désigne des personnes caractérisées par leur attachement à la circoncision. « Partisans » signale cette orientation sans en faire nécessairement un parti officiellement constitué.
theological_decisions:
- issue: Identification de οἱ ἐκ περιτομῆς
  choice: des croyants de Jérusalem caractérisés par leur attachement à la circoncision
  alternative: tous les croyants juifs en général, ou un parti formel de la circoncision
  rationale: Le contexte présente un groupe qui conteste la conduite de Pierre en raison de la question de la circoncision. La traduction évite à la fois de réduire l’expression à une simple donnée ethnique et d’affirmer l’existence d’un parti institutionnalisé.
translation_notes:
  register: Français international moderne, clair et digne. « Monter à Jérusalem » conserve l’idiome biblique encore naturel en français. La formulation du groupe reste intelligible tout en laissant la note exposer la forme plus littérale et son ambiguïté.
