  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: fr
  text: 'Mais une voix répondit du ciel pour la deuxième fois : « Ce que Dieu a purifié, toi, ne le tiens pas pour profane[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne le considère pas comme impur » ou « ne le tiens pas pour impur ».'
    reason: Alternative lexicale pour κοινόω dans le contexte des catégories de pureté.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: L’aoriste de forme passive de ἀποκρίνομαι a ici le sens courant de « répondre » ; ce choix convient à la suite narrative.
- source_word: φωνὴ
  choice: une voix
  rationale: Le sujet est indéfini et le grec ne précise pas davantage l’identité de celui qui parle.
- source_word: ἐκ δευτέρου
  choice: pour la deuxième fois
  rationale: Cette expression idiomatique signifie « une deuxième fois » ; la formulation retenue est naturelle en français et marque clairement la répétition.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Dans ce contexte, οὐρανός désigne le ciel comme lieu d’origine de la voix, et non simplement l’espace visible.
- source_word: Ἃ
  choice: Ce que
  rationale: Le relatif neutre pluriel introduit une catégorie générale ; « ce que » rend cette construction de manière idiomatique en français.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Traduction directe du sujet.
- source_word: ἐκαθάρισεν
  choice: a purifié
  rationale: καθαρίζω signifie « purifier, rendre pur ». Le passé composé exprime une action accomplie dont le résultat demeure pertinent.
- source_word: σὺ
  choice: toi
  rationale: Le pronom grec est explicitement exprimé et emphatique. Le détachement « toi » conserve ce contraste avec l’action de Dieu.
- source_word: μὴ κοίνου
  choice: ne le déclare pas profane
  rationale: κοινόω signifie littéralement rendre ou tenir pour commun, donc profane, notamment dans un contexte de pureté. « Déclarer profane » préserve cette catégorie sans la confondre entièrement avec « impur ».
theological_decisions:
- issue: Nuance du vocabulaire de pureté dans κοινόω
  choice: ne le déclare pas profane
  alternative: ne le considère pas comme impur ; ne le déclare pas impur
  rationale: Le propos oppose ce que Dieu a purifié au jugement humain qui le qualifierait de κοινός, c’est-à-dire commun ou profane. « Profane » maintient cette distinction conceptuelle, tandis que « impur » en explicite le sens contextuel sans être placé dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste naturelle tout en conservant l’emphase du pronom σὺ par « toi » et la tension entre « purifier » et « déclarer profane ».
