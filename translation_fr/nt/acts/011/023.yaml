id: ACT.11.23
reference: Acts 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: fr
  text: À son arrivée, lorsqu’il vit la grâce de Dieu[a], il se réjouit et les encourageait tous à rester attachés au Seigneur d’un cœur résolu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la faveur de Dieu ». L’expression peut désigner les signes visibles de l’action bienveillante de Dieu parmi eux.
    reason: lexical_alternative
  - marker: b
    text: Ou « à demeurer auprès du Seigneur » ou « à rester fidèles au Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: À son arrivée
  rationale: Le participe aoriste marque l’arrivée de Barnabas sur les lieux; cette tournure est naturelle et conserve la relation circonstancielle.
- source_word: ἰδὼν
  choice: lorsqu’il vit
  rationale: ὁράω garde ici son sens ordinaire de voir, tout en permettant contextuellement l’idée de constater l’œuvre de Dieu.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: Cette formulation conserve la densité théologique de χάρις sans la réduire à une paraphrase comme « ce que Dieu avait fait ».
- source_word: ἐχάρη
  choice: il se réjouit
  rationale: Rend directement la joie éprouvée par Barnabas dans un registre digne et courant.
- source_word: παρεκάλει
  choice: il les encouragea
  rationale: παρακαλέω peut signifier encourager, exhorter ou presser. Dans ce contexte pastoral, « encouragea » est naturel; l’imparfait grec présente l’action dans son déroulement, sans exiger une périphrase française lourde.
- source_word: πάντας
  choice: tous
  rationale: Désigne l’ensemble des croyants concernés sans ajouter de référent absent du grec.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: d’un cœur résolu
  rationale: Exprime naturellement en français la détermination intérieure portée par πρόθεσις et καρδία, plutôt que le calque peu idiomatique « avec un dessein de cœur ».
- source_word: προσμένειν
  choice: à rester attachés
  rationale: προσμένω avec le datif exprime ici la persistance dans l’attachement ou l’association. « Rester attachés » communique cette fidélité durable sans l’enfermer dans une catégorie doctrinale ultérieure.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Conserve le titre κύριος tel qu’il apparaît dans le grec; dans le contexte narratif des Actes, il renvoie à Jésus ressuscité.
theological_decisions:
- issue: Sens de « la grâce de Dieu » dans le contexte
  choice: Conserver « la grâce de Dieu », avec l’idée contextuelle de l’action bienveillante de Dieu devenue visible parmi les croyants d’Antioche
  alternative: Paraphraser par « ce que Dieu avait accompli dans sa grâce » ou comprendre une disposition favorable de Dieu
  rationale: Le grec permet de reconnaître une manifestation observable de l’action divine, mais la formulation littérale préserve toute la portée théologique et évite de résoudre explicitement ce que le texte laisse implicite.
- issue: Force de προσμένειν τῷ κυρίῳ
  choice: « rester attachés au Seigneur »
  alternative: « demeurer auprès du Seigneur », « rester fidèles au Seigneur » ou « persévérer dans le Seigneur »
  rationale: La traduction retenue exprime une adhésion personnelle qui se prolonge. Elle évite à la fois une simple proximité spatiale et l’importation explicite d’un cadre doctrinal systématique.
translation_notes:
  register: Français international moderne, naturel et digne. « D’un cœur résolu » rend idiomatiquement l’engagement intérieur, tandis que « rester attachés au Seigneur » conserve la tension entre présence durable, fidélité et dévouement.
