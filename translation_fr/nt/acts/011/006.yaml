  register: Français international moderne, naturel et digne. La construction est légèrement resserrée pour éviter une répétition maladroite entre le regard attentif et l’examen, tout en conservant la progression vers « j’y ai vu ». Le catalogue garde sa tonalité biblique et classificatoire.
