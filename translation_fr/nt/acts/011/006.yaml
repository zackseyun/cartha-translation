  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: fr
  text: J’ai regardé attentivement à l’intérieur et, en l’examinant, j’y ai vu les quadrupèdes de la terre, les bêtes sauvages, les êtres qui rampent[a] et les oiseaux du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les reptiles ». Le grec désigne plus largement les êtres qui rampent.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν ἀτενίσας
  choice: Je l’ai examinée avec attention
  rationale: Le pronom reprend la toile ou nappe de la vision. Cette formulation française exprime à la fois le regard dirigé vers son contenu et l’attention soutenue, sans la lourdeur de « regardant attentivement dedans ».
- source_word: κατενόουν
  choice: examinée
  rationale: Le verbe évoque une observation attentive et réfléchie. Avec « avec attention », il conserve cette nuance tout en permettant une phrase naturelle et en évitant deux verbes français presque synonymes à la suite.
- source_word: εἶδον
  choice: j’y ai vu
  rationale: Le passé composé convient au récit oral de Pierre et distingue ce qu’il a finalement vu de l’examen attentif qui précède.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: les quadrupèdes de la terre
  rationale: « Quadrupèdes » restitue précisément la catégorie zoologique du grec et conserve « de la terre », qui participe au langage classificatoire du passage.
- source_word: τὰ θηρία
  choice: les bêtes sauvages
  rationale: Cette expression naturelle distingue les animaux sauvages de la catégorie précédente.
- source_word: τὰ ἑρπετὰ
  choice: les êtres qui rampent
  rationale: Le grec désigne largement les créatures qui se déplacent en rampant; cette traduction évite de le réduire aux seuls reptiles et préserve l’écho aux catégories bibliques de la création et des lois alimentaires.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Formulation française courante et digne qui convient à cette catégorie concrète de créatures volantes.
theological_decisions: []
