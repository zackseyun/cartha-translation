  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: fr
  text: 'Mais j’ai répondu : « Certainement pas, Seigneur, car rien de souillé ou d’impur n’est jamais entré dans ma bouche. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Certainement pas
  rationale: Exprime avec naturel et fermeté le refus catégorique de Pierre.
- source_word: κύριε
  choice: Seigneur
  rationale: Conserve l’adresse directe et la portée potentiellement théologique du grec.
- source_word: κοινὸν
  choice: profane
  rationale: Dans ce contexte rituel, désigne ce qui est tenu pour non consacré et donc impropre à la consommation; « commun » serait trompeur en français courant.
- source_word: ἀκάθαρτον
  choice: impur
  rationale: Rend le vocabulaire de l’impureté rituelle sans le réduire à une simple saleté matérielle.
- source_word: ὅτι
  choice: car
  rationale: Introduit naturellement la raison du refus, conformément à la valeur causale du terme.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: n’est entré dans ma bouche
  rationale: Préserve l’image concrète et la formulation du grec.
theological_decisions:
- issue: Rapport entre κοινόν et ἀκάθαρτον
  choice: 'Conserver deux qualificatifs distincts : « profane ou impur »'
  alternative: Fusionner en « rituellement impur »
  rationale: Le grec coordonne deux termes; les maintenir préserve la distinction lexicale et la tension du propos sans imposer une harmonisation interprétative.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique; « profane » est employé dans son sens cultuel plutôt que dans le sens courant de « commun ».
