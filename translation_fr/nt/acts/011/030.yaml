  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: fr
  text: Ce qu’ils firent en envoyant les secours aux anciens par l’intermédiaire de Barnabas et de Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Barnabas et de Saul ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: C’est ce qu’ils firent
  rationale: Le pronom relatif neutre reprend l’aide décidée au verset précédent. Cette tournure française restitue naturellement l’anaphore et la concision de l’expression grecque.
- source_word: ἀποστείλαντες
  choice: ils envoyèrent
  rationale: Le participe aoriste indique ici comment ils mirent leur décision à exécution. Une proposition coordonnée est plus naturelle en français moderne.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: aux anciens
  rationale: Dans les Actes, πρεσβύτεροι désigne les responsables reconnus de la communauté. « Anciens » est le terme français courant et transparent.
- source_word: διὰ χειρὸς
  choice: par l’intermédiaire de
  rationale: L’expression grecque signifie littéralement « par la main de » et désigne ici les personnes chargées de transmettre le don. « Par l’intermédiaire de » en rend clairement la valeur d’agence en français.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Barnabas et Saul
  rationale: Les noms propres suivent leur forme française biblique usuelle.
- source_word: objet implicite selon le contexte
  choice: leur don
  rationale: Le grec laisse l’objet de l’envoi implicite, car il ressort du verset précédent. Le français demande ici de l’expliciter; « leur don » identifie sobrement l’aide collectée sans en préciser davantage la nature.
