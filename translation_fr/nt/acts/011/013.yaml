  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: fr
  text: 'Il nous raconta comment il avait vu l’ange se tenir dans sa maison et lui dire : « Envoie à Joppé chercher Simon, appelé Pierre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν δὲ ἡμῖν
  choice: Il nous raconta
  rationale: ἀπαγγέλλω désigne ici le fait de relater ce qui s’est passé. Le passé simple convient au récit suivi en français; δέ est rendu implicitement par l’enchaînement naturel plutôt que par un connecteur lourd.
- source_word: πῶς εἶδεν
  choice: comment il avait vu
  rationale: « Comment » conserve la nuance de πῶς, tandis que le plus-que-parfait marque naturellement l’antériorité de la vision par rapport au récit qu’en fait Corneille.
- source_word: τὸν ἄγγελον
  choice: l’ange
  rationale: L’article grec renvoie à l’ange précis apparu à Corneille, déjà identifié dans le contexte narratif.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ σταθέντα
  choice: se tenir dans sa maison
  rationale: Cette formulation française exprime naturellement la présence debout de l’ange sans reproduire lourdement le participe aoriste grec.
- source_word: εἰπόντα
  choice: lui dire
  rationale: Le pronom « lui » clarifie en français que les paroles de l’ange s’adressaient à Corneille, ce que le contexte grec rend évident.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: Envoie quelqu’un à Joppé
  rationale: L’impératif ἀπόστειλον signifie « envoie ». Le complément humain reste implicite en grec, mais « quelqu’un » est requis par l’usage français pour exprimer clairement l’envoi vers une destination, sans préciser indûment « des hommes ».
- source_word: μετάπεμψαι
  choice: fais venir
  rationale: Le moyen μεταπέμπομαι signifie envoyer chercher quelqu’un pour le faire venir. « Fais venir » en restitue clairement le résultat visé et s’accorde avec l’impératif précédent.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: Simon, appelé Pierre
  rationale: Le participe passif identifie Simon par le nom sous lequel il est connu. La tournure est concise, moderne et fidèle.
