source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: fr
  text: L’Esprit m’a dit d’aller avec eux sans faire aucune distinction[a]. Ces six frères sont aussi venus avec moi, et nous sommes entrés dans la maison de cet homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans hésiter » ou « sans douter ». Le participe grec peut signifier soit ne faire aucune distinction, soit ne pas hésiter ou douter.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: l’Esprit
  rationale: Dans ce contexte de direction révélée, l’expression désigne l’Esprit saint. « L’Esprit » respecte toutefois la formulation grecque, qui n’ajoute pas ici l’adjectif « saint ».
- source_word: εἶπεν ... μοι
  choice: m’a dit
  rationale: Cette tournure française naturelle rend fidèlement le verbe de parole suivi de l’instruction à l’infinitif.
- source_word: συνελθεῖν αὐτοῖς
  choice: de partir avec eux
  rationale: Le verbe exprime ici le fait d’aller en compagnie des hommes envoyés auprès de Pierre. « Partir avec eux » est clair et naturel dans le contexte narratif.
- source_word: μηδὲν διακρίναντα
  choice: sans faire aucune distinction
  rationale: διακρίνω peut exprimer l’idée de distinguer, mais aussi celle d’hésiter ou de douter. Le contexte du franchissement de la frontière entre Juifs et non-Juifs favorise ici l’idée de ne faire aucune distinction, sans exclure les autres possibilités signalées en note.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: ces six frères
  rationale: Les référents sont six hommes croyants présents avec Pierre. « Ces » rend explicitement οὗτοι.
- source_word: εἰσήλθομεν
  choice: nous sommes entrés
  rationale: Rendu direct et idiomatique de l’aoriste dans un récit au passé.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: la maison de cet homme
  rationale: Cette formulation naturelle conserve la mention explicite de l’homme et rend la valeur définie de l’expression grecque.
theological_decisions:
- issue: Sens de μηδὲν διακρίναντα dans le récit de Pierre
  choice: sans faire aucune distinction
  alternative: sans hésiter ; sans douter
  rationale: Le contexte porte sur l’entrée de Pierre chez un non-Juif et sur sa défense devant des croyants juifs. L’idée de ne faire aucune distinction met en valeur cet enjeu, mais le participe grec peut aussi décrire l’absence d’hésitation ou de doute; cette ambiguïté réelle est donc conservée dans une note.
translation_notes:
  register: Français international moderne, clair et digne. Le récit reste fluide, avec un vocabulaire accessible, tandis que la note préserve l’ambiguïté lexicale et théologique du grec.
