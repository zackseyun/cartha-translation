review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est fidèle : ὃς renvoie à Pierre, ῥήματα est conservé au pluriel, ἐν οἷς est rendu avec une valeur instrumentale, et σωθήσῃ garde le sens sotériologique de « être sauvé ». La formulation révisée rend explicitement et naturellement la portée conjointe sur Corneille et sa maisonnée, sans ajouter de condition ni d’automaticité absente du verset.'
  naturalness: « Il te dira des paroles » est compréhensible mais peu naturel en français international moderne. De plus, « tu seras sauvé, toi et toute ta maisonnée » juxtapose un verbe au singulier et un sujet coordonné qui peut paraître syntaxiquement heurté. « Il t’adressera des paroles par lesquelles toi et toute ta maisonnée serez sauvés » est fluide, digne et précis.
  terminology: « Sauvés » est le terme approprié pour σωθήσῃ dans ce contexte. « Maisonnée » désigne bien les personnes composant le foyer et évite l’ambiguïté du bâtiment. La note conserve les possibilités formelles de rendu de ἐν οἷς sans atténuer sa valeur de moyen.
  issues:
  - severity: low
    issue: Tour verbal peu idiomatique
    rationale: « Dire des paroles » est possible, mais « adresser des paroles » est plus naturel tout en préservant le pluriel de ῥήματα.
  - severity: medium
    issue: Portée de la coordination rendue syntaxiquement de façon heurtée
    rationale: Le singulier de « tu seras sauvé » suivi de « toi et toute ta maisonnée » peut obscurcir le fait que la promesse inclut les deux. Le pluriel français dans « toi et toute ta maisonnée serez sauvés » exprime clairement la coordination grecque sans en modifier le sens.
  revised_text: Il t’adressera des paroles par lesquelles toi et toute ta maisonnée serez sauvés[a].
