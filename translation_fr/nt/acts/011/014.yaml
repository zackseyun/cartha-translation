revisions:
- from: Il te dira des paroles par lesquelles tu seras sauvé, toi et toute ta maisonnée[a].
  to: Il t’adressera des paroles par lesquelles toi et toute ta maisonnée serez sauvés[a].
  rationale: La révision améliore l’idiomaticité et clarifie la portée de « toi et toute ta maisonnée », tout en conservant le pluriel « paroles », la valeur instrumentale de ἐν οἷς et le sens de salut de σωθήσῃ. Elle n’impose aucune interprétation confessionnelle sur les modalités du salut de la maisonnée.
  reviewer_model: gpt-5.6-terra
