  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: fr
  text: Il t’adressera des paroles par lesquelles toi et toute ta maisonnée serez sauvés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans lesquelles » ou « au moyen desquelles » ; l’expression grecque présente ces paroles comme le moyen par lequel vient le salut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Il
  rationale: Le pronom relatif renvoie à Pierre, mentionné dans le contexte précédent. En français, l’ouverture par « Il » est naturelle dans cette citation rapportée.
- source_word: λαλήσει
  choice: dira
  rationale: Avec ῥήματα comme complément, « dira des paroles » rend naturellement l’acte de communiquer le message; « prononcera » serait plus solennel que le grec.
- source_word: ῥήματα
  choice: des paroles
  rationale: Le pluriel concret est conservé plutôt que généralisé en « message ».
- source_word: πρὸς σὲ
  choice: te
  rationale: Avec le verbe de parole, πρός indique le destinataire; le pronom indirect français exprime naturellement « à toi ».
- source_word: ἐν οἷς
  choice: par lesquelles
  rationale: Le tour exprime ici le moyen associé aux paroles. « Par lesquelles » est idiomatique et conserve cette valeur instrumentale, tout en signalant en note les autres rendus possibles.
- source_word: σωθήσῃ
  choice: tu seras sauvé
  rationale: Le futur passif de σῴζω a ici, dans le contexte de la proclamation de l’Évangile, son sens sotériologique ordinaire.
- source_word: σὺ
  choice: toi
  rationale: Le pronom grec explicite et emphatique est repris dans la coordination détachée « toi et toute ta maisonnée ».
- source_word: πᾶς ὁ οἶκός σου
  choice: toute ta maisonnée
  rationale: οἶκος désigne ici l’ensemble des personnes du foyer, non le bâtiment. « Maisonnée » conserve clairement cette portée collective.
theological_decisions:
- issue: Sens du salut dans le contexte de la maisonnée de Corneille
  choice: « seras sauvé »
  alternative: « seras délivré »
  rationale: Le contexte concerne l’annonce de l’Évangile et le salut. La traduction garde cette portée sans préciser davantage le mécanisme théologique.
- issue: Portée de « toute ta maisonnée »
  choice: Formulation collective sans qualification ajoutée
  alternative: Expliciter une condition individuelle de réponse ou une automaticité familiale
  rationale: Le verset promet le salut à Corneille et à toute sa maisonnée, mais ne développe pas ici les modalités de la participation de chacun. La traduction préserve cette tension sans lecture confessionnelle ajoutée.
translation_notes:
  register: Français international moderne, naturel et digne. « Maisonnée » est retenu pour désigner sans ambiguïté les personnes du foyer. La reprise « toi et toute ta maisonnée » préserve l’insistance du pronom grec.
