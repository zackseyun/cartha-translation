source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: fr
  text: Et voici qu’à cet instant même, trois hommes arrivèrent à la maison où nous étions ; ils avaient été envoyés de Césarée auprès de moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction discursive qui attire l’attention sur un événement marquant, dans une tournure française naturelle et digne.
- source_word: ἐξαυτῆς
  choice: à cet instant même
  rationale: Exprime l’immédiateté et la coïncidence temporelle avec ce qui précède, sans réduire le terme à une simple succession rapide.
- source_word: τρεῖς ἄνδρες
  choice: trois hommes
  rationale: Rend directement le nombre et le nom masculin employés dans le texte grec.
- source_word: ἐπέστησαν
  choice: arrivèrent
  rationale: Dans ce contexte, le verbe indique que les hommes survinrent et furent présents au lieu indiqué ; « arrivèrent » est clair et idiomatique.
- source_word: ἐπὶ τὴν οἰκίαν
  choice: à la maison
  rationale: Avec le verbe d’arrivée, la préposition marque le lieu atteint.
- source_word: ἐν ᾗ ἦμεν
  choice: où nous étions
  rationale: Traduction directe de la proposition relative de lieu, sans ajouter l’idée non explicite d’un séjour prolongé.
- source_word: ἀπεσταλμένοι
  choice: ils avaient été envoyés
  rationale: La formulation verbale française rend naturellement le participe parfait passif et l’antériorité de l’envoi par rapport à l’arrivée.
- source_word: ἀπὸ Καισαρείας
  choice: de Césarée
  rationale: Rend l’origine géographique indiquée par ἀπό.
- source_word: πρός με
  choice: jusqu’à moi
  rationale: Exprime la direction vers Pierre en tant que personne que les envoyés devaient atteindre, tout en évitant l’ambiguïté possible de « envoyés de Césarée à moi ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » garde la vivacité du récit sans archaïsme excessif. Le point-virgule clarifie le rapport entre l’arrivée et l’envoi antérieur.
