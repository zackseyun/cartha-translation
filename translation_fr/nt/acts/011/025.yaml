  yaml_path: translation/nt/acts/011/025.yaml
  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: fr
  text: Puis il partit pour Tarse afin de rechercher Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin de chercher Saul » ou « afin de se mettre en quête de Saul ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: il partit
  rationale: Dans ce contexte de déplacement, « partit » rend naturellement l’aoriste de ἐξέρχομαι. Le sens littéral « sortit » serait possible, mais son point de départ n’est pas exprimé dans ce verset et cette formulation serait moins idiomatique en français.
- source_word: δὲ
  choice: Puis
  rationale: δέ est ici un connecteur narratif léger. « Puis » fait avancer le récit sans introduire un contraste absent du grec.
- source_word: εἰς Ταρσόν
  choice: pour Tarse
  rationale: Avec un verbe de mouvement, εἰς marque la destination. « Partir pour Tarse » est une tournure française naturelle.
- source_word: ἀναζητῆσαι
  choice: afin de rechercher
  rationale: L’infinitif aoriste exprime le but du déplacement. « Rechercher » conserve l’idée d’une démarche délibérée pour retrouver quelqu’un, sans affirmer explicitement le résultat.
- source_word: Σαῦλον
  choice: Saul
  rationale: Le nom propre est rendu selon sa forme française biblique courante.
