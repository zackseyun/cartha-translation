id: ACT.11.16
reference: Acts 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: fr
  text: 'Alors je me suis souvenu de cette parole du Seigneur : « Jean a baptisé dans l’eau, mais vous, vous serez baptisés dans l’Esprit Saint[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’Esprit Saint ». La préposition grecque peut se comprendre au sens locatif (« dans ») ou instrumental (« avec »).
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: je me suis souvenu
  rationale: Le passif à valeur déponente se rend naturellement par une forme active pronominale en français.
- source_word: δὲ
  choice: Alors
  rationale: La particule marque ici une progression légère dans le récit plutôt qu’une opposition forte.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: de cette parole du Seigneur
  rationale: « Parole » convient à une déclaration orale ensuite citée; le démonstratif rend naturellement en français la parole déterminée dont Pierre se souvient.
- source_word: ὡς ἔλεγεν
  choice: introduit par deux-points
  rationale: La tournure grecque introduit la teneur de la parole. En français actuel, les deux-points donnent une formulation plus naturelle sans imposer à l’imparfait une valeur habituelle incertaine.
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: Jean ... mais vous, vous
  rationale: « Mais » restitue le contraste μὲν…δὲ, tandis que la dislocation « vous, vous » conserve l’accent porté par le pronom explicite ὑμεῖς.
- source_word: ἐβάπτισεν ὕδατι
  choice: a baptisé dans l’eau
  rationale: Le datif ὕδατι peut désigner la sphère ou l’élément du baptême; « dans l’eau » est idiomatique et maintient le parallélisme avec la proposition suivante.
- source_word: βαπτισθήσεσθε
  choice: vous serez baptisés
  rationale: Cette forme rend directement le futur passif grec.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit saint
  rationale: « Dans » conserve la lecture locative ou sphérique possible de ἐν; la lecture instrumentale « avec » demeure signalée en note.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le terme français établi et conserve ici l’autorité ainsi que la portée théologique du titre appliqué à Jésus.
- issue: Valeur de ἐν dans ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit saint
  alternative: avec l’Esprit saint
  rationale: La préposition grecque permet une compréhension locative ou sphérique aussi bien qu’instrumentale. Le texte retient « dans » et la note préserve l’autre possibilité sans trancher la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La citation est introduite naturellement par deux-points; la répétition « vous, vous » préserve l’emphase grecque. La graphie « Esprit saint » marque le référent divin conformément à l’usage français.
