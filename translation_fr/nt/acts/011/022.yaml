id: ACT.11.22
reference: Acts 11:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: fr
  text: La nouvelle à leur sujet parvint aux oreilles de l’Église de Jérusalem[a], et celle-ci envoya Barnabas jusqu’à Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La nouvelle à leur sujet fut entendue par l’Église qui était à Jérusalem » ; littéralement : « La nouvelle fut entendue jusque dans les oreilles de l’Église qui était à Jérusalem ».'
    reason: Alternative lexicale et explicitation de l’idiome grec.
lexical_decisions:
- source_word: ἠκούσθη
  choice: parvint
  rationale: Avec l’expression εἰς τὰ ὦτα, le passif grec forme un idiome indiquant qu’une information est portée à la connaissance de quelqu’un. « Parvint » rend cet idiome naturellement tout en conservant l’idée que la nouvelle arrive à l’Église.
- source_word: ὁ λόγος
  choice: la nouvelle
  rationale: Dans ce contexte narratif, λόγος désigne l’information concernant les personnes et les événements précédemment mentionnés, non une parole ou un discours formel.
- source_word: εἰς τὰ ὦτα
  choice: aux oreilles
  rationale: Cette formulation conserve l’image grecque tout en étant idiomatique en français dans « parvint aux oreilles ».
- source_word: ἐκκλησίας
  choice: l’Église
  rationale: Dans les Actes, ἐκκλησία désigne ici la communauté chrétienne locale. « Église » est le terme français courant et contextuellement approprié.
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: de Jérusalem
  rationale: Le participe identifie l’Église concernée. Le français naturel condense l’expression en « l’Église de Jérusalem » sans perte de sens.
- source_word: περὶ αὐτῶν
  choice: à leur sujet
  rationale: Le pronom renvoie le plus naturellement aux personnes évoquées dans le contexte précédent, tout en laissant ouverte l’étendue exacte de ce renvoi.
- source_word: ἐξαπέστειλαν
  choice: envoya
  rationale: Le verbe signifie envoyer ou dépêcher. Le singulier français s’accorde avec le collectif « Église », repris par « celle-ci », tandis que le grec emploie un pluriel selon les membres du collectif.
- source_word: Βαρναβᾶν
  choice: Barnabas
  rationale: Le nom propre suit sa forme française traditionnelle et largement reconnue.
- source_word: ἕως Ἀντιοχείας
  choice: jusqu’à Antioche
  rationale: ἕως avec un lieu peut marquer la destination ou l’étendue du déplacement. « Jusqu’à Antioche » conserve cette nuance mieux qu’un simple « à Antioche ».
theological_decisions:
- issue: Sujet de « envoya »
  choice: L’Église de Jérusalem est présentée collectivement comme celle qui envoie Barnabas.
  alternative: Des dirigeants non précisés au sein de l’Église de Jérusalem l’ont envoyé.
  rationale: L’antécédent explicite le plus proche est l’Église de Jérusalem. Le texte ne nomme ni les apôtres ni les anciens comme auteurs de la décision; la traduction évite donc d’introduire une instance dirigeante plus précise.
translation_notes:
  register: Français international moderne, naturel et digne. L’image des oreilles est conservée sans reproduire servilement la syntaxe grecque. Le faible connecteur δέ n’est pas rendu par un adverbe temporel comme « maintenant » ; l’enchaînement narratif français suffit.
