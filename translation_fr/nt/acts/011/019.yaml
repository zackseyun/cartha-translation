revisions:
- from: Ainsi donc, ceux qui avaient été dispersés à cause de la détresse survenue au sujet d’Étienne allèrent jusqu’en Phénicie, à Chypre et à Antioche. Ils n’annonçaient la Parole[a] à personne d’autre qu’aux Juifs[b].
  to: Ainsi donc, ceux qui avaient été dispersés à cause de la détresse survenue en lien avec Étienne allèrent jusqu’en Phénicie, à Chypre et à Antioche, sans annoncer la parole[a] à personne d’autre qu’aux Juifs[b].
  rationale: La révision réunit la phrase afin de refléter la construction participiale grecque et d’éviter l’imparfait ajouté. Elle améliore légèrement l’idiome concernant Étienne, conserve la latitude de θλῖψις, et maintient la terminologie lucanienne ainsi que l’exclusivité de l’auditoire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:09:52Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend avec justesse la dispersion antérieure, la portée géographique et la restriction de l’auditoire. Toutefois, la séparation en deux phrases, avec « Ils n’annonçaient », introduit un imparfait et une présentation autonome que le participe grec ne porte pas. Une subordonnée en « sans… » restitue mieux la simultanéité et le lien avec le déplacement.
  naturalness: Le français est globalement moderne et clair. « Détresse survenue au sujet d’Étienne » est cependant un peu raide; « survenue en lien avec Étienne » conserve l’association volontairement large de ἐπὶ Στεφάνῳ dans une formulation plus idiomatique. La minuscule à « parole » évite d’ajouter par la typographie une interprétation théologique particulière.
  terminology: « Détresse » est un rendu recevable et non indûment étroit de θλῖψις. « La parole » maintient le terme lucanien sans développer le contenu dans le texte. « À personne d’autre qu’aux Juifs » exprime naturellement la restriction emphatique de μηδενί ... εἰ μὴ μόνον Ἰουδαίοις.
  issues:
  - severity: medium
    issue: L’imparfait autonome « Ils n’annonçaient » ne correspond pas précisément au participe présent λαλοῦντες.
    rationale: Le grec rattache l’action de parler à celle du déplacement. La construction « sans annoncer » conserve ce rapport sans suggérer une action habituelle ou durative distincte.
  - severity: low
    issue: « Survenue au sujet d’Étienne » est peu naturel en français dans ce contexte.
    rationale: « En lien avec Étienne » préserve le lien associatif/causal sans spécifier abusivement la nature exacte de l’événement.
  - severity: low
    issue: La majuscule à « Parole » peut surinterpréter typographiquement τὸν λόγον.
    rationale: La minuscule conserve l’expression thématique tout en restant neutre dans le français biblique moderne.
  revised_text: Ainsi donc, ceux qui avaient été dispersés à cause de la détresse survenue en lien avec Étienne allèrent jusqu’en Phénicie, à Chypre et à Antioche, sans annoncer la parole[a] à personne d’autre qu’aux Juifs[b].
