id: ACT.11.19
reference: Acts 11:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: fr
  text: Ainsi donc, ceux qui avaient été dispersés à cause de la détresse survenue en lien avec Étienne allèrent jusqu’en Phénicie, à Chypre et à Antioche, sans annoncer la parole[a] à personne d’autre qu’aux Juifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, « la parole » désigne le message proclamé au sujet de Jésus; autre traduction possible : « le message ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec souligne l’exclusivité : « si ce n’est seulement aux Juifs » ou « seulement aux Juifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: avaient été dispersés
  rationale: Le plus-que-parfait marque naturellement en français la dispersion antérieure au déplacement raconté, tout en conservant la voix passive.
- source_word: θλίψεως
  choice: détresse
  rationale: Le terme grec désigne largement la détresse, l’épreuve ou l’oppression. « Détresse » préserve cette amplitude sans imposer dans le texte principal le sens plus précis de « persécution ».
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: survenue au sujet d’Étienne
  rationale: Cette formulation conserve le lien associatif ou causal avec l’affaire d’Étienne sans réduire l’expression à sa seule mort ni à sa souffrance personnelle.
- source_word: διῆλθον ἕως
  choice: allèrent jusqu’en… à… et à…
  rationale: Rend naturellement le déplacement et son étendue géographique en français.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Phénicie, à Chypre et à Antioche
  rationale: Emploie les formes géographiques françaises usuelles avec les prépositions idiomatiques appropriées.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: Ils n’annonçaient la Parole à personne
  rationale: Une nouvelle proposition évite un participe lourd en français. « Annonçaient » exprime ici naturellement la communication publique du message, tandis que « la Parole » maintient le terme thématique de Luc.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: à personne d’autre qu’aux Juifs
  rationale: Cette tournure française claire conserve la restriction exclusive portée conjointement par εἰ μή et μόνον.
theological_decisions:
- issue: Nature de l’hostilité liée à Étienne
  choice: détresse
  alternative: persécution
  rationale: Le contexte implique une persécution, mais θλῖψις a une portée plus large. Le texte principal ne doit pas supprimer cette latitude lexicale.
- issue: Sens de τὸν λόγον dans les Actes
  choice: la Parole
  alternative: le message
  rationale: « La Parole » conserve la terminologie récurrente de Luc et son caractère condensé; la note explicite son référent sans l’insérer dans le texte.
- issue: Restriction de l’auditoire
  choice: à personne d’autre qu’aux Juifs
  alternative: seulement aux Juifs
  rationale: La formulation choisie restitue explicitement la double force restrictive de μηδενί et εἰ μὴ μόνον tout en restant naturelle en français.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe participiale grecque est divisée en deux phrases pour une lecture naturelle. La majuscule à « Parole » signale l’emploi thématique sans développer le contenu du message dans le texte principal.
