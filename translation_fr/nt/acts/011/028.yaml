source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: fr
  text: L’un d’eux, nommé Agabus, se leva et fit savoir par l’Esprit qu’une grande famine allait se produire dans toute la terre habitée[a] ; elle eut lieu sous Claude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le monde entier ». Dans Luc-Actes, « la terre habitée » peut aussi désigner plus précisément le monde romain.'
    reason: Alternative lexicale et précision sur la portée possible de οἰκουμένη.
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste introduit l’action d’Agabus au sein du rassemblement. « Se leva » est naturel en français moderne et conserve le sens concret du verbe.
- source_word: ἐσήμανεν
  choice: fit savoir
  rationale: Le verbe signifie indiquer, signaler ou faire connaître. « Fit savoir » exprime clairement la communication révélée sans imposer une formule technique de prophétie.
- source_word: διὰ τοῦ πνεύματος
  choice: par l’Esprit
  rationale: διά avec le génitif indique ici le moyen ou l’agent. La majuscule reflète la référence contextuelle au Saint-Esprit dans ce cadre prophétique des Actes.
- source_word: λιμὸν μεγάλην
  choice: une grande famine
  rationale: Cette traduction directe conserve l’adjectif μεγάλην sans le reformuler en « terrible » ou « sévère ».
- source_word: μέλλειν ἔσεσθαι
  choice: allait s’étendre
  rationale: La construction exprime un événement futur attendu ou imminent. Avec « famine », « allait s’étendre » est idiomatique et s’accorde avec la portée géographique introduite par ἐπί.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: sur toute la terre habitée
  rationale: « Terre habitée » préserve le sens lexical de οἰκουμένη sans le restreindre d’emblée à l’Empire romain ni lui donner nécessairement une portée planétaire moderne.
- source_word: ἥτις ἐγένετο
  choice: elle eut lieu
  rationale: Le pronom reprend la famine, et γίνομαι signifie ici qu’elle se produisit effectivement. La formulation française reste fluide tout en conservant le lien relatif du grec.
- source_word: ἐπὶ Κλαυδίου
  choice: sous Claude
  rationale: Dans cette expression chronologique, ἐπί avec le génitif signifie « sous » ou « au temps de » un souverain. « Sous Claude » est concis, naturel et historiquement clair.
theological_decisions:
- issue: Référence de « l’Esprit » dans διὰ τοῦ πνεύματος
  choice: L’Esprit désigne le Saint-Esprit
  alternative: Une inspiration spirituelle exprimée de manière moins précise
  rationale: Dans les contextes prophétiques des Actes, « l’Esprit » renvoie normalement au Saint-Esprit. La majuscule rend ce jugement contextuel sans ajouter le mot « Saint » au texte.
- issue: Portée de οἰκουμένη
  choice: Traduction lexicale par « toute la terre habitée »
  alternative: « Le monde entier » ou, plus précisément, « tout le monde romain »
  rationale: Le terme peut désigner largement le monde habité et, dans Luc-Actes, peut avoir une portée liée au monde impérial romain. Le texte principal préserve cette latitude, et la note présente les autres compréhensions possibles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit étroitement le mouvement du grec tout en évitant les tournures archaïques. Le point-virgule distingue la prédiction de son accomplissement historique.
