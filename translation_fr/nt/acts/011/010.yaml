  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: fr
  text: Cela se produisit trois fois, puis tout fut de nouveau élevé au ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Cela
  rationale: Le démonstratif renvoie à l’événement visionnaire qui vient d’être raconté, sans ajouter explicitement « vision ».
- source_word: δὲ
  choice: puis
  rationale: Dans ce récit, δέ marque une transition légère vers l’étape suivante; « puis » rend naturellement cette progression.
- source_word: ἐγένετο
  choice: se produisit
  rationale: Le verbe désigne ici un événement qui a lieu; cette formulation convient à un récit actuel et digne.
- source_word: ἐπὶ τρίς
  choice: trois fois
  rationale: L’expression idiomatique indique que l’événement se répète à trois reprises.
- source_word: ἀνεσπάσθη
  choice: fut élevé
  rationale: Le passif et le mouvement ascendant sont conservés sans préciser l’agent; « élevé » est plus naturel ici que « tiré vers le haut ».
- source_word: πάλιν
  choice: de nouveau
  rationale: L’expression marque le retour vers le ciel après la descente décrite dans la vision.
- source_word: ἅπαντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale, mais son référent précis n’est pas explicité; « tout » maintient cette ouverture.
- source_word: εἰς τὸν οὐρανόν
  choice: jusqu’au ciel
  rationale: La formule exprime la destination du mouvement; « ciel » convient au cadre visionnaire, et « jusqu’au » est idiomatique en français avec « élever ».
theological_decisions:
- issue: Référent de ἅπαντα dans le récit de la vision de Pierre
  choice: tout
  alternative: le tout / tous les animaux
  rationale: Le grec est global sans désigner précisément la toile ni les animaux. La traduction ne tranche donc pas un référent que ce verset laisse implicite.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple s’accorde au registre biblique littéraire sans archaïsme lexical. Aucun ajout interprétatif ni marque confessionnelle.
