source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: fr
  text: '« J’étais dans la ville de Joppé, en train de prier, et, dans une transe, j’ai vu une vision : un objet[a], semblable à une grande toile, descendait du ciel, abaissé par ses quatre coins[b], et est venu jusqu’à moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un récipient ». Le mot grec peut désigner de manière générale un objet, un ustensile ou un contenant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par les quatre extrémités ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: J’étais dans la ville de Joppé, en train de prier
  rationale: Conserve la mention explicite de la ville et rend le participe présent par une tournure française naturelle exprimant l’action en cours.
- source_word: ἐν ἐκστάσει ὅραμα
  choice: dans un état de transe, j’ai vu une vision
  rationale: Distingue l’état visionnaire de Pierre de la vision elle-même, tout en évitant les connotations surtout émotionnelles que peut avoir « extase » en français moderne.
- source_word: σκεῦός τι
  choice: une sorte d’objet
  rationale: Rend l’indétermination de τι et le sens large de σκεῦος sans préciser prématurément s’il s’agit d’un récipient, d’un instrument ou d’un autre objet.
- source_word: ὡς ὀθόνην μεγάλην
  choice: semblable à une grande toile
  rationale: « Toile » évoque une grande pièce d’étoffe sans introduire la matière précise du lin, absente du grec.
- source_word: καταβαῖνον … καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: descendait. On l’abaissait du ciel
  rationale: La formulation française rend à la fois le mouvement de descente et la forme passive de καθίημι. Deux phrases évitent un enchaînement lourd et l’accord de genre problématique entre « objet » et « toile ».
- source_word: τέσσαρσιν ἀρχαῖς
  choice: par les quatre coins
  rationale: Dans l’image d’une toile, ἀρχαί désigne naturellement ses extrémités ou ses coins. L’article défini français suffit sans imposer un possessif au grec.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: il est venu jusqu’à moi
  rationale: « Jusqu’à moi » exprime explicitement la limite atteinte, portée par ἄχρι.
theological_decisions:
- issue: Rendu du vocabulaire visionnaire sans exagérer l’expérience mystique
  choice: dans un état de transe, j’ai vu une vision
  alternative: dans une extase, j’ai vu une vision
  rationale: Le texte emploie à la fois ἔκστασις et ὅραμα. Le choix retenu maintient les deux notions distinctes et décrit un état visionnaire sans importer les connotations affectives ou mystiques que « extase » peut suggérer aujourd’hui.
translation_notes:
  register: Français international moderne, clair et digne. « Joppé » suit la forme française traditionnelle du toponyme. La légère répétition « j’ai vu une vision » conserve les deux termes distincts du grec; la ponctuation répartit les participes grecs en phrases naturelles sans supprimer leur rapport logique.
