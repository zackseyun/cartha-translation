id: ACT.11.18
reference: Acts 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: fr
  text: 'Après avoir entendu cela, ils se turent et glorifièrent Dieu en disant : « Ainsi donc, Dieu a aussi accordé aux non-Juifs la repentance qui mène à la vie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la repentance en vue de la vie » ou « la repentance qui aboutit à la vie ». Le grec exprime une orientation vers la vie ou un résultat qui est la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Après avoir entendu cela
  rationale: Le participe aoriste exprime une circonstance antérieure aux verbes principaux. « Après avoir entendu cela » restitue naturellement cette valeur temporelle; δέ est absorbé dans l’enchaînement.
- source_word: ἡσύχασαν
  choice: ils cessèrent leurs objections
  rationale: Dans le contexte de la contestation précédente, le verbe signifie qu’ils se tinrent tranquilles, cessèrent de protester. Cette formulation rend la portée contextuelle mieux que le seul silence physique.
- source_word: ἐδόξασαν τὸν θεόν
  choice: glorifièrent Dieu
  rationale: Traduction directe qui conserve le vocabulaire théologique caractéristique de Luc-Actes.
- source_word: λέγοντες
  choice: en disant
  rationale: Rend directement le participe présent qui introduit le contenu de leur réaction.
- source_word: Ἄρα καὶ
  choice: Ainsi donc… aussi
  rationale: « Ainsi donc » marque l’inférence tirée du récit de Pierre, tandis que « aussi » souligne que l’action de Dieu s’étend aux non-Juifs.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans ce contexte, ἔθνη désigne les personnes qui ne sont pas juives plutôt que des entités politiques. « Non-Juifs » est clair et courant en français international.
- source_word: τὴν μετάνοιαν
  choice: la repentance
  rationale: « Repentance » exprime ici le retournement intérieur et concret vers Dieu; le terme français est établi dans le registre biblique et évite de réduire μετάνοια à un simple changement intellectuel.
- source_word: εἰς ζωήν
  choice: qui mène à la vie
  rationale: La tournure restitue la direction ou le résultat exprimé par εἰς sans décider plus précisément entre but et conséquence.
- source_word: ἔδωκεν
  choice: a accordé
  rationale: Le passé composé convient au français actuel pour une action accomplie dont la portée demeure présente. « Accorder » conserve l’idée que Dieu donne la repentance.
theological_decisions:
- issue: La repentance présentée comme don de Dieu
  choice: « Dieu a aussi accordé… la repentance »
  alternative: « Dieu a donné… la repentance »
  rationale: Le texte présente explicitement Dieu comme celui qui accorde la repentance aux non-Juifs. La traduction maintient cette affirmation sans en tirer un système doctrinal sur le rapport entre l’action divine et la réponse humaine.
- issue: Rapport entre repentance et vie
  choice: « la repentance qui mène à la vie »
  alternative: « la repentance pour la vie »
  rationale: Cette formulation conserve la valeur directionnelle ou résultative de εἰς ζωήν et laisse ouverte la nuance précise entre orientation, but et résultat.
translation_notes:
  register: Français moderne, international et digne. « Cessèrent leurs objections » explicite sobrement la force contextuelle de ἡσύχασαν après la contestation du verset 2. « Non-Juifs » est préféré à « païens », potentiellement péjoratif, et à « nations », moins précis ici.
