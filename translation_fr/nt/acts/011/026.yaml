id: ACT.11.26
reference: Acts 11:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: fr
  text: Après l’avoir trouvé, il l’amena à Antioche. Pendant une année entière, ils se réunirent avec l’Église[a] et enseignèrent une foule nombreuse. C’est à Antioche que, pour la première fois, les disciples furent appelés chrétiens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se réunirent dans l’Église». Le mot «Église» désigne ici la communauté chrétienne, et non nécessairement un bâtiment.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement que les disciples «furent appelés chrétiens pour la première fois». Cette appellation semble avoir été employée publiquement à Antioche.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: Après l’avoir trouvé
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal; cette tournure française naturelle en préserve la succession.
- source_word: ἤγαγεν
  choice: il l’amena
  rationale: Dans le contexte, ἄγω indique que Barnabas conduit Saul à Antioche; «amena» est idiomatique et précis.
- source_word: ἐγένετο δὲ αὐτοῖς καὶ ἐνιαυτὸν ὅλον
  choice: Pendant une année entière, ils
  rationale: L’idiome grec introduit ce qui arriva à Barnabas et Saul durant cette période. La formulation française évite un calque maladroit tout en conservant la durée.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: ils se réunirent avec l’Église
  rationale: Le passif grec désigne leur rassemblement en lien avec la communauté chrétienne. «Avec l’Église» évite de faire de ἐκκλησία un bâtiment.
- source_word: ἐκκλησίᾳ
  choice: Église
  rationale: Ici, le terme désigne la communauté chrétienne; «Église», avec majuscule, signale ce sens collectif plutôt qu’un édifice.
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: enseignèrent une foule nombreuse
  rationale: ἱκανός indique ici un nombre important. «Une foule nombreuse» est naturel et conserve l’image collective de ὄχλος.
- source_word: χρηματίσαι
  choice: furent appelés
  rationale: Dans ce contexte, le verbe exprime l’attribution publique d’une désignation; le passif français correspond à la forme et au sens grecs.
- source_word: πρώτως
  choice: pour la première fois
  rationale: Cette locution restitue clairement l’idée de la première occurrence.
- source_word: Χριστιανούς
  choice: chrétiens
  rationale: Il s’agit d’une désignation de groupe lexicalisée. «Chrétiens» est son équivalent français établi et naturel.
theological_decisions:
- issue: Rendre Χριστιανούς alors que Χριστός peut ailleurs être traduit par «Messie» lorsqu’il fonctionne comme titre
  choice: chrétiens
  alternative: messianistes
  rationale: Χριστιανούς est ici le nom établi d’un groupe, et non le simple emploi prédicatif du titre Χριστός. «Messianistes» mettrait indûment l’accent sur l’étymologie et pourrait introduire une nuance sectaire absente du texte.
- issue: Compréhension de ἐν τῇ ἐκκλησίᾳ
  choice: avec l’Église
  alternative: dans l’Église
  rationale: La formulation retenue comprend ἐκκλησία comme la communauté auprès de laquelle Barnabas et Saul se rassemblent, sans suggérer un bâtiment. La construction grecque permet toutefois une traduction plus littérale par «dans l’Église».
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. La structure en deux phrases met en relief l’apparition du nom «chrétiens» tout en conservant les coordinations du grec.
