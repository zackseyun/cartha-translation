id: ACT.11.29
reference: Acts 11:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: fr
  text: Les disciples décidèrent donc, chacun selon ses moyens, d’envoyer une aide aux frères[a] qui habitaient en Judée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « les frères » peut désigner l’ensemble des croyants de Judée, hommes et femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: les disciples
  rationale: « Disciples » est le terme établi dans les Actes et désigne ici ceux qui suivent Jésus.
- source_word: καθὼς εὐπορεῖτό τις … ἕκαστος αὐτῶν
  choice: chacun selon ses moyens
  rationale: Cette formulation naturelle restitue à la fois la capacité matérielle variable de chacun et la valeur distributive de la tournure grecque.
- source_word: ὥρισαν
  choice: décidèrent
  rationale: Dans ce contexte, le verbe exprime une décision délibérée; « décidèrent » est clair, actuel et fidèle.
- source_word: εἰς διακονίαν πέμψαι
  choice: d’envoyer une aide
  rationale: La combinaison désigne ici l’envoi d’une assistance concrète. « Une aide » rend naturellement en français la finalité de service exprimée par διακονία sans préciser indûment la forme du don.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: qui habitaient en Judée
  rationale: Rendu direct du participe substantivé, avec un imparfait adapté au cadre narratif passé.
- source_word: ἀδελφοῖς
  choice: aux frères
  rationale: Le masculin pluriel du grec est conservé dans le texte; dans l’usage chrétien ancien, le mot peut cependant désigner l’ensemble des croyants, nuance signalée en note.
theological_decisions:
- issue: Portée du terme familial ἀδελφοῖς appliqué à la communauté chrétienne de Judée
  choice: les frères
  alternative: les frères et sœurs; les croyants
  rationale: Le texte principal conserve la forme masculine du grec sans exclure la possibilité, courante dans cet emploi, que le terme englobe toute la communauté croyante.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la décision collective des disciples ainsi que la contribution proportionnée aux moyens de chacun.
