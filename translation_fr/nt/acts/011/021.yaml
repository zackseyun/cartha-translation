id: ACT.11.21
reference: Acts 11:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: fr
  text: La main du Seigneur était avec eux[a], et un grand nombre de personnes, ayant cru[b], se tournèrent vers le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la main du Seigneur » désigne, dans la Bible, sa puissance agissante ou sa faveur.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui crurent » ; le grec peut présenter leur foi comme antérieure au fait de se tourner vers le Seigneur ou comme étroitement liée à celui-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: la main du Seigneur
  rationale: Cette expression biblique évoque la puissance agissante ou la faveur du Seigneur. La traduction littérale conserve la métaphore et ses résonances scripturaires tout en restant compréhensible en français.
- source_word: κύριος
  choice: Seigneur
  rationale: Le titre « Seigneur » préserve le terme grec sans préciser son référent au-delà du texte.
- source_word: μετ’ αὐτῶν
  choice: avec eux
  rationale: Avec le génitif, μετά signifie naturellement « avec » et exprime ici la présence ou le soutien divin qui accompagne ces personnes.
- source_word: πολύς τε ἀριθμός
  choice: un grand nombre de personnes
  rationale: Cette formulation française naturelle explicite que le nombre concerne des personnes, implicite dans la construction grecque.
- source_word: ὁ πιστεύσας
  choice: ayant cru
  rationale: Le participe aoriste peut indiquer une action antérieure ou étroitement liée au fait de se tourner vers le Seigneur. Cette formulation conserve la relation participiale sans imposer une chronologie trop rigide.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: se tournèrent vers le Seigneur
  rationale: L’expression rend le mouvement de conversion vers le Seigneur sans ajouter explicitement la notion de repentance ni suggérer nécessairement un retour à une relation antérieure.
theological_decisions:
- issue: Référent de « Seigneur » dans les deux occurrences
  choice: Conserver simplement « Seigneur » dans les deux cas.
  alternative: Préciser « Jésus » ou comprendre plus généralement « Dieu ».
  rationale: Dans les Actes, κύριος peut désigner Jésus, notamment dans un contexte de conversion, mais le grec ne précise ici que « le Seigneur ». La traduction préserve cette ouverture.
- issue: Rapport entre croire et se tourner vers le Seigneur
  choice: « ayant cru, se tournèrent »
  alternative: « crurent et se tournèrent » ou « qui crurent se tournèrent »
  rationale: Le participe aoriste πιστεύσας peut être compris comme antérieur ou comme étroitement associé au verbe principal. Le conserver sous forme participiale évite de transformer explicitement le rapport en deux verbes coordonnés.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore biblique « la main du Seigneur » est conservée. Le pluriel « se tournèrent » suit le sens collectif de « un grand nombre de personnes ».
