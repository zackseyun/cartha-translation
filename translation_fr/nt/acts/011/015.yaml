source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: fr
  text: Or, alors que je commençais à parler[a], l’Esprit Saint est descendu sur eux, tout comme il était descendu sur nous au commencement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand j’ai commencé à parler ». La construction grecque peut exprimer la simultanéité de ces événements.'
    reason: lexical_alternative
  - marker: b
    text: « Au commencement » renvoie probablement à la première effusion de l’Esprit sur les disciples, lors de la Pentecôte (Actes 2).
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Or, dès que j’ai commencé à parler
  rationale: La construction ἐν + infinitif articulé exprime ici la simultanéité. « Dès que » est naturel en français et souligne que l’Esprit est intervenu au tout début de la prise de parole, sans établir une causalité.
- source_word: ἐπέπεσεν
  choice: est descendu sur
  rationale: Le verbe ἐπιπίπτω décrit avec force la venue de l’Esprit sur des personnes. « Est descendu sur » rend naturellement cet idiome en français biblique contemporain; la note conserve l’image plus littérale de la chute.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Formulation française contemporaine, exacte et largement comprise pour le titre grec.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: tout comme sur nous
  rationale: « Tout comme » marque l’étroite correspondance exprimée par ὥσπερ, tandis que la tournure elliptique conserve le parallèle compact du grec; καί est rendu par l’inclusion comparative de « nous ».
- source_word: ἐν ἀρχῇ
  choice: au commencement
  rationale: Cette expression temporelle renvoie au commencement de l’expérience collective évoquée. « Au commencement » préserve la formulation large du grec sans inscrire explicitement « la Pentecôte » dans le texte.
theological_decisions:
- issue: Référent de « au commencement » (ἐν ἀρχῇ)
  choice: Conserver une référence temporelle générale dans le texte, avec la Pentecôte comme référent probable indiqué en note.
  alternative: Traduire explicitement « à la Pentecôte » ou comprendre plus généralement « la première fois ».
  rationale: Le contexte compare l’événement vécu par la maison de Corneille à la venue initiale de l’Esprit sur le groupe auquel Pierre appartenait. La Pentecôte est donc probablement visée, mais le grec ne la nomme pas; la traduction ne doit pas éliminer cette réserve.
- issue: Nature de la venue de l’Esprit exprimée par ἐπέπεσεν
  choice: Employer « est descendu sur » sans préciser davantage le mode ou les effets de cette venue.
  alternative: Employer le calque « est tombé sur » ou une interprétation comme « les a remplis ».
  rationale: Le choix retenu garde le mouvement vers les personnes tout en évitant d’assimiler sans indication textuelle cette venue à une formulation doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et narratif. « Or » assure la continuité du récit; « dès que » est idiomatique et rend l’intervention immédiate. Les notes signalent l’alternative temporelle et le référent probable sans surcharger le verset.
