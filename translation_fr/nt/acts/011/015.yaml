  source_fidelity: La construction ἐν δὲ τῷ ἄρξασθαί με λαλεῖν indique le moment où Pierre se mettait à parler. « Dès que » peut suggérer une succession immédiate plutôt que la simultanéité exprimée par le grec. ἐπέπεσεν est bien rendu par « est descendu sur », et la comparaison avec l’expérience antérieure des disciples doit inclure le verbe sous-entendu.
  naturalness: « Alors que je commençais à parler » est naturel en français international moderne et rend mieux l’aspect de l’infinitif grec. La reprise explicite de « était descendu sur nous » évite l’ellipse quelque peu heurtée de « tout comme sur nous ».
  terminology: « L’Esprit Saint » est la désignation française usuelle et exacte. « Au commencement » est fidèle mais peut avoir une coloration plus solennelle et conserver utilement l’ouverture référentielle du grec; la note situe prudemment le référent probable.
