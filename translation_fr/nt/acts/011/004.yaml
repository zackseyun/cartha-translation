  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: fr
  text: 'Mais Pierre se mit à leur exposer les faits dans l’ordre, en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος
  choice: se mit à
  rationale: Le participe aoriste employé avec le verbe principal marque le commencement de l’exposé. « Se mit à » rend naturellement cette valeur en français sans reproduire lourdement la construction participiale.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition légèrement contrastive entre les reproches précédents et la réponse de Pierre.
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom personnel grec.
- source_word: ἐξετίθετο
  choice: exposer les faits
  rationale: Dans ce contexte, le verbe signifie présenter ou expliquer une affaire en détail. « Exposer les faits » convient au récit que Pierre va donner et produit une formulation française naturelle.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif pluriel désigne les interlocuteurs de Pierre et se rend naturellement par le pronom français « leur ».
- source_word: καθεξῆς
  choice: dans l’ordre
  rationale: L’adverbe souligne une présentation successive et ordonnée. « Dans l’ordre » conserve cette idée sans préciser indûment qu’il reprend nécessairement depuis le tout début.
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit les paroles qui suivent. « En disant » préserve explicitement ce lien avec le discours direct.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « se mit à leur exposer les faits » évite le calque peu naturel « ayant commencé, expliquait » tout en gardant le début et le déroulement de l’exposé. Aucun marqueur de note n’est requis, puisque « dans l’ordre » rend directement καθεξῆς sans ambiguïté nécessitant une note de publication.
