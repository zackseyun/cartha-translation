id: ACT.5.27
reference: Acts 5:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: fr
  text: Après les avoir amenés, ils les firent comparaître devant le Conseil[a]. Le grand prêtre les interrogea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Sanhédrin ». Le terme grec désigne ici le conseil dirigeant juif.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Après les avoir amenés
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. Cette tournure restitue clairement la succession des actions en français naturel.
- source_word: δὲ
  choice: —
  rationale: Particule de liaison légère qui fait progresser le récit; elle n’a pas besoin d’être exprimée séparément dans cette formulation française.
- source_word: ἔστησαν
  choice: ils les firent comparaître devant
  rationale: Le verbe transitif signifie littéralement « faire tenir debout, placer ». Dans ce contexte judiciaire, « faire comparaître devant » exprime naturellement la présentation des apôtres devant l’assemblée sans perdre la valeur causative.
- source_word: ἐν τῷ συνεδρίῳ
  choice: devant le Conseil
  rationale: Le groupe désigne ici l’assemblée dirigeante juive. Avec « comparaître », la préposition française idiomatique est « devant ». La majuscule signale cette institution précise sans substituer au terme grec le nom traditionnel « Sanhédrin ».
- source_word: ἐπηρώτησεν
  choice: les interrogea
  rationale: Dans ce cadre judiciaire, « interroger » rend mieux qu’« demander » le caractère formel de la question, sans nécessairement suggérer un interrogatoire coercitif.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: Équivalent français courant et précis du titre ἀρχιερεύς dans ce contexte.
theological_decisions:
- issue: Rendu de συνέδριον
  choice: le Conseil
  alternative: le Sanhédrin
  rationale: « Conseil » traduit le sens lexical du terme grec et reste accessible. La note indique le nom traditionnel et précise qu’il s’agit de l’instance dirigeante juive, sans imposer ce terme translittéré dans le texte principal.
translation_notes:
  register: Français moderne, international et digne. La formulation « firent comparaître » convient au cadre judiciaire et reste aisément compréhensible; la division en deux phrases évite une coordination lourde tout en suivant la progression du grec.
