  source_fidelity: La structure consécutive (ὥστε), l’extension emphatique vers les lieux publics (καὶ εἰς τὰς πλατείας), le but (ἵνα) et le caractère non affirmatif de l’effet de l’ombre sont bien conservés. Toutefois, « l’un ou l’autre d’entre eux » n’est pas idiomatique pour le singulier indéfini τινί et peut évoquer un choix entre deux personnes. κἄν est mieux rendu dans ce contexte par « ne serait-ce que », qui exprime le contact minimal espéré.
  naturalness: Le texte est globalement fluide et de registre approprié. « Ne serait-ce que son ombre tombe sur l’un d’eux » est plus naturel et plus précis que « son ombre au moins couvre l’un ou l’autre d’entre eux ».
  terminology: « Malades », « lits et nattes », « Pierre » et « ombre » conviennent. « Tombe sur » rend naturellement ἐπισκιάσῃ dans le contexte d’une ombre, sans introduire d’interprétation théologique.
