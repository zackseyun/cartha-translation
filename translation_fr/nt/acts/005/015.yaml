source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: fr
  text: si bien qu’on allait jusqu’à porter les malades dehors, dans les rues[a], et à les étendre sur des lits et des nattes[b], afin que, lorsque Pierre passerait, ne serait-ce que son ombre tombe sur l’un d’eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les places publiques ». Le grec peut désigner de larges rues ou des espaces publics ouverts.
    reason: lexical_alternative
  - marker: b
    text: Ou « des couchettes et des grabats ». Le grec distingue deux sortes de couchages ou de surfaces sur lesquelles on pouvait s’allonger.
    reason: lexical_alternative
  - marker: c
    text: 'Le verset rapporte l’intention des gens : ils plaçaient les malades afin que ne serait-ce que l’ombre de Pierre tombe sur l’un d’eux. Il ne dit pas explicitement ici que l’ombre elle-même les guérissait.'
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit la conséquence de l’influence croissante des apôtres évoquée dans le contexte précédent.
- source_word: καὶ εἰς τὰς πλατείας
  choice: on allait jusqu’à… dehors, dans les rues
  rationale: « Jusqu’à » rend la valeur intensive de καί, tandis que « rues » convient au contexte de lieux publics où Pierre pouvait passer; πλατεῖαι peut aussi désigner des places publiques.
- source_word: ἐκφέρειν τοὺς ἀσθενεῖς
  choice: porter les malades dehors
  rationale: Rend l’action physique de faire sortir les personnes malades des maisons.
- source_word: τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων
  choice: les étendre sur des lits et des nattes
  rationale: « Étendre » est naturel pour des malades, et les deux noms conservent la distinction entre deux sortes de couchages sans imposer une précision technique incertaine.
- source_word: ἵνα
  choice: afin que
  rationale: Exprime clairement le but poursuivi par les personnes qui disposaient les malades sur le passage de Pierre.
- source_word: ἐρχομένου Πέτρου
  choice: lorsque Pierre passerait
  rationale: Le génitif absolu présente Pierre en train de passer à proximité; le conditionnel s’accorde naturellement en français avec le but envisagé.
- source_word: κἂν ἡ σκιὰ
  choice: son ombre au moins
  rationale: 'κἄν souligne ici le minimum espéré: à défaut d’un contact direct, au moins l’ombre de Pierre.'
- source_word: ἐπισκιάσῃ
  choice: couvre
  rationale: Rend l’idée que l’ombre se projette sur quelqu’un, dans un français actuel et naturel, sans attribuer explicitement à l’ombre un pouvoir de guérison.
- source_word: τινὶ αὐτῶν
  choice: l’un ou l’autre d’entre eux
  rationale: 'Préserve la valeur singulière et indéfinie de τινί: une personne quelconque parmi les malades.'
theological_decisions:
- issue: Le verset affirme-t-il que l’ombre de Pierre possédait elle-même un pouvoir de guérison?
  choice: 'La formulation rapporte seulement le but et l’espoir des gens: ils plaçaient les malades de façon que l’ombre de Pierre couvre l’un ou l’autre d’entre eux.'
  alternative: Traduire d’une manière laissant entendre que l’ombre guérissait effectivement les malades.
  rationale: ἵνα suivi du subjonctif exprime ici le but envisagé. Le verset ne dit pas explicitement que l’ombre elle-même guérissait, même si le contexte plus large rapporte de nombreuses guérisons.
translation_notes:
  register: 'Français international moderne, naturel et digne. La phrase conserve les deux relations logiques du grec: la conséquence (« si bien que »), puis le but (« afin que »). « L’un ou l’autre » évite de transformer le singulier indéfini en pluriel collectif.'
