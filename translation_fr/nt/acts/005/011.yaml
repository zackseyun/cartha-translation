  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: fr
  text: Une grande crainte saisit toute l’Église[a] et tous ceux qui entendirent parler de ces faits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’assemblée » ou « la communauté » pour « l’Église » (ἐκκλησία).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο φόβος μέγας ἐπί
  choice: Une grande crainte saisit
  rationale: Cette tournure française naturelle conserve la valeur événementielle de ἐγένετο et l’effet de la crainte sur les personnes, sans le calque peu idiomatique « une grande crainte arriva sur ».
- source_word: φόβος μέγας
  choice: une grande crainte
  rationale: Dans le contexte immédiat du jugement d’Ananias et de Saphira, φόβος désigne avant tout une crainte profonde; μέγας en marque directement l’intensité.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: toute l’Église
  rationale: ἐκκλησία désigne ici la communauté entière des croyants. « Église » est le terme français courant dans ce contexte, tandis que « toute » préserve la portée globale de ὅλην.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: tous ceux qui apprirent ces événements
  rationale: Dans ce contexte, ἀκούω peut signifier apprendre par ouï-dire. « Ces événements » conserve le pluriel de ταῦτα tout en exprimant naturellement que la nouvelle des faits s’est répandue.
theological_decisions:
- issue: Traduction de ἐκκλησία
  choice: Église
  alternative: assemblée ou communauté
  rationale: Le mot renvoie ici à la communauté chrétienne et apparaît pour la première fois dans les Actes avec ce référent. « Église » l’exprime sans préciser davantage sa structure; une note conserve les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite un calque du grec tout en maintenant l’intensité, la totalité de la communauté touchée et le pluriel de ταῦτα.
