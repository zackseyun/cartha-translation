id: ACT.5.29
reference: Acts 5:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: fr
  text: 'Mais Pierre et les apôtres répondirent : « Il faut obéir à Dieu plutôt qu’aux êtres humains.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux hommes » ou « aux gens ». Le grec désigne ici les êtres humains en général, notamment les autorités humaines, par contraste avec Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: répondirent
  rationale: La combinaison du participe aoriste de ἀποκρίνομαι avec εἶπαν constitue une formule narrative de réponse. Le français naturel la rend par un seul verbe, sans reproduire la redondance littérale « ayant répondu, dirent ».
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec l’ordre formulé précédemment; « Mais » restitue clairement cette opposition.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Pierre et les apôtres
  rationale: « Pierre » suit la forme française traditionnelle du nom, et « apôtres » est le terme établi pour ce groupe reconnu dans ce contexte.
- source_word: Πειθαρχεῖν
  choice: obéir
  rationale: Le verbe désigne l’obéissance à une autorité; « obéir » est précis, courant et naturel.
- source_word: δεῖ
  choice: Il faut
  rationale: La tournure impersonnelle rend directement la nécessité ou l’obligation exprimée par δεῖ, sans imposer un sujet grammatical absent du grec.
- source_word: θεῷ
  choice: à Dieu
  rationale: Le datif indique la personne à qui l’obéissance est due.
- source_word: μᾶλλον ἢ
  choice: plutôt que
  rationale: Cette locution française exprime naturellement la priorité comparative entre les deux autorités.
- source_word: ἀνθρώποις
  choice: aux êtres humains
  rationale: Le pluriel ἀνθρώποις désigne ici les humains en général, particulièrement les autorités humaines présentes, par contraste avec Dieu. « Êtres humains » conserve explicitement ce contraste sans suggérer que seuls les hommes de sexe masculin sont visés.
theological_decisions:
- issue: Portée du contraste entre l’obéissance à Dieu et l’obéissance aux humains
  choice: 'Conserver la formulation absolue et concise du grec : « Il faut obéir à Dieu plutôt qu’aux êtres humains »'
  alternative: Expliciter « aux autorités humaines » ou limiter l’énoncé à la situation immédiate
  rationale: Le contexte concerne des autorités humaines, mais le texte dit simplement ἀνθρώποις, « êtres humains ». La traduction ne restreint donc pas la portée de la maxime et n’ajoute pas non plus une théorie générale de la désobéissance civile.
- issue: Sujet implicite de δεῖ avec l’infinitif
  choice: « Il faut obéir »
  alternative: « Nous devons obéir »
  rationale: Le contexte permet naturellement d’entendre « nous », mais la construction grecque demeure impersonnelle. « Il faut » en préserve la forme générale et la possible portée sentencieuse.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la brièveté et la force rhétorique de l’original. « Répondirent » convient au récit soutenu sans être archaïque; « êtres humains » explicite la valeur générique de ἀνθρώποις.
