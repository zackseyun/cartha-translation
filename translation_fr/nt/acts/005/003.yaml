  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: fr
  text: 'Mais Pierre dit : « Ananias, pourquoi Satan a-t-il rempli ton cœur au point que tu mentes à l’Esprit Saint[a] et que tu retiennes une partie du prix du terrain[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que tu trompes l’Esprit Saint ». Le verbe grec signifie ici directement « mentir à quelqu’un », mais peut impliquer la tentative de le tromper.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du prix de la propriété », « du prix du champ » ou « du produit de la vente ». Le terme grec peut désigner un terrain, une propriété ou un champ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Mais Pierre dit
  rationale: 'δέ marque ici une transition légèrement adversative : Pierre oppose sa dénonciation à la conduite secrète d’Ananias. « Mais » rend naturellement ce mouvement sans le renforcer excessivement.'
- source_word: διὰ τί
  choice: pourquoi
  rationale: Équivalent interrogatif direct et idiomatique en français contemporain.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: Satan a-t-il rempli ton cœur
  rationale: Cette formulation conserve la métaphore du cœur rempli ainsi que Satan comme sujet grammatical, sans transformer le propos en affirmation explicite de possession ou de contrainte irrésistible.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: au point que tu mentes à l’Esprit saint
  rationale: « Mentir à » rend directement ψεύδομαι avec la personne à l’accusatif. « Au point que » exprime naturellement en français la valeur de résultat de la construction infinitive, sans exclure totalement une nuance de visée.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Forme courante, digne et immédiatement compréhensible en français moderne.
- source_word: νοσφίσασθαι
  choice: que tu retiennes une partie
  rationale: Le verbe désigne le fait de garder secrètement pour soi une partie de ce qui est en jeu. « Retenir une partie » communique clairement la rétention partielle sans employer un terme juridique plus étroit comme « détourner » ou « soustraire ».
- source_word: ἀπὸ τῆς τιμῆς
  choice: une partie du prix
  rationale: ἀπό avec le génitif indique qu’une part est prélevée sur l’ensemble ; « une partie du prix » explicite ce rapport de manière naturelle.
- source_word: τοῦ χωρίου
  choice: de la propriété
  rationale: χωρίον peut désigner un terrain, un champ ou une propriété foncière. Dans le récit d’un bien vendu, « propriété » reste naturel tout en évitant de préciser indûment la nature exacte du bien.
theological_decisions:
- issue: L’action de Satan dans le cœur d’Ananias
  choice: Conserver « Satan a-t-il rempli ton cœur »
  alternative: « Pourquoi as-tu laissé Satan prendre le contrôle de toi ? »
  rationale: Le grec attribue grammaticalement l’action à Satan tout en maintenant, dans le contexte, la responsabilité morale d’Ananias. La traduction ne transforme donc cette tension ni en possession totale ni en simple permission explicitement accordée par Ananias.
- issue: Le mensonge adressé à l’Esprit saint
  choice: Traduire directement « mentir à l’Esprit saint »
  alternative: « tromper l’Esprit saint » ou « mentir en présence de l’Esprit saint »
  rationale: La construction grecque présente l’Esprit saint comme la personne à qui le mensonge est adressé. La formulation directe préserve cette référence personnelle sans lui ajouter une explication doctrinale.
- issue: Valeur des infinitifs après « remplir ton cœur »
  choice: Employer « au point que », avec deux verbes coordonnés au subjonctif
  alternative: « pour que tu mentes… et retiennes… »
  rationale: Les infinitifs peuvent évoquer le résultat ou la visée. « Au point que » donne un français naturel et met en avant le résultat sans faire de Satan l’auteur explicitement formulé d’un dessein contraignant.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond au discours direct singulier adressé à Ananias. La phrase conserve la métaphore biblique du cœur rempli et évite les termes techniques ou confessionnels.
