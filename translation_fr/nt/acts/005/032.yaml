id: ACT.5.32
reference: Acts 5:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: fr
  text: Et nous sommes témoins de ces faits[a], et l’Esprit Saint l’est aussi[b], lui que Dieu a donné à ceux qui lui obéissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ces paroles » ou « de ces choses ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et l’Esprit Saint » ; le sens « est témoin » est repris de la proposition précédente.'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: témoins
  rationale: « Témoins » est le terme français naturel dans le contexte testimonial des Actes et désigne ceux qui attestent ce qu’ils ont vu ou savent.
- source_word: ῥημάτων
  choice: faits
  rationale: Ici, ῥήματα renvoie aux événements ou réalités dont les apôtres témoignent. « Faits » est idiomatique en français, tandis que « paroles » reste une possibilité signalée en note.
- source_word: πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Formulation française contemporaine et usuelle pour le référent divin personnel dans Luc-Actes.
- source_word: ὃ
  choice: que
  rationale: Le relatif grec est neutre par accord grammatical avec πνεῦμα. En français, « que » convient naturellement comme complément direct de « a donné » sans imposer une distinction de genre.
- source_word: ἔδωκεν
  choice: a donné
  rationale: Le passé composé rend naturellement l’aoriste dans ce contexte et conserve la pertinence présente du don de l’Esprit.
- source_word: πειθαρχοῦσιν
  choice: obéissent
  rationale: πειθαρχέω exprime l’obéissance à une autorité; « obéir » est direct et fait écho à Actes 5.29.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie clairement à Dieu et préserve la cohésion pronominale du grec.
theological_decisions:
- issue: L’Esprit Saint est-il présenté comme témoin aux côtés des apôtres ?
  choice: « tout comme l’Esprit Saint » reprend implicitement le prédicat « sommes témoins ».
  alternative: « et l’Esprit Saint [est témoin] »
  rationale: La seconde proposition grecque est sans verbe et reprend naturellement le prédicat de la première. La formulation française explicite le rapport syntaxique sans ajouter de contenu doctrinal.
- issue: Référence personnelle à l’Esprit Saint
  choice: Employer le relatif français neutre en genre « que », avec « l’Esprit Saint » comme antécédent personnel.
  alternative: Reformuler par « et Dieu a donné cet Esprit… »
  rationale: « Que » est grammaticalement naturel en français aussi bien pour une personne que pour une chose et ne force aucune résolution théologique étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Tout comme » rend explicitement la coordination elliptique du grec. L’ordre des mots demeure naturel sans effacer l’ambiguïté lexicale de ῥημάτων, conservée en note.
