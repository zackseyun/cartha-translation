  text: ἀναστάντες δὲ οἱ νεώτεροι συνέστειλαν αὐτὸν καὶ ἐξενέγκαντες ἔθαψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/006.yaml
  text: Then the young men rose[a], wrapped him up, carried him out, and buried him.
translation:
  language: fr
  text: Alors, les plus jeunes[a] se levèrent, l’enveloppèrent, l’emportèrent et l’enterrèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes hommes ». Le grec νεώτεροι est un comparatif et peut désigner soit « les plus jeunes », soit, plus généralement, « les jeunes hommes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: se levèrent
  rationale: Le participe aoriste de ἀνίστημι indique qu’ils se mettent debout pour agir. « Se levèrent » conserve la séquence participiale dans un récit naturel et digne.
- source_word: δὲ
  choice: Alors
  rationale: Dans ce contexte, δέ fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: οἱ νεώτεροι
  choice: les plus jeunes
  rationale: νεώτεροι est un comparatif substantivé et peut désigner les hommes les plus jeunes du groupe. « Les plus jeunes » préserve cette forme comparative sans ajouter un référent absent du grec.
- source_word: συνέστειλαν
  choice: l’enveloppèrent
  rationale: Dans ce contexte funéraire, συστέλλω désigne vraisemblablement l’action de rassembler ou d’envelopper le corps avant de l’emporter. « L’enveloppèrent » exprime clairement l’action physique sans développer en « préparèrent pour l’ensevelissement », qui serait plus interprétatif.
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom renvoie à Ananias et fonctionne comme complément d’objet direct des verbes successifs.
- source_word: ἐξενέγκαντες
  choice: l’emportèrent
  rationale: Le participe de ἐκφέρω signifie porter hors du lieu. En français, « l’emportèrent » rend de façon concise à la fois le déplacement et le transport du corps.
- source_word: ἔθαψαν
  choice: l’enterrèrent
  rationale: θάπτω signifie ensevelir ou enterrer. « L’enterrèrent » est le terme courant, clair et direct dans ce contexte.
