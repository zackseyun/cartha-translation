id: ACT.5.31
reference: Acts 5:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: fr
  text: C’est lui que Dieu a élevé à sa droite comme Chef et Sauveur[a], afin de donner à Israël la repentance et le pardon des péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par sa droite ». L’expression grecque peut désigner le moyen par lequel Dieu l’a élevé, mais elle évoque probablement ici son élévation à la place du plus grand honneur, à la droite de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: C’est lui
  rationale: La tournure détachée conserve l’emphase du démonstratif grec tout en restant naturelle en français; elle désigne explicitement Jésus.
- source_word: ἀρχηγὸν
  choice: Chef
  rationale: Dans ce contexte d’exaltation et d’autorité, « Chef » exprime celui qui est à la tête et qui conduit, sans réduire le terme à l’idée d’origine ou de pionnier.
- source_word: σωτῆρα
  choice: Sauveur
  rationale: Rendu français établi de σωτήρ, qui conserve à la fois l’idée de délivrance et sa portée sotériologique.
- source_word: ὕψωσεν
  choice: a élevé
  rationale: Le verbe évoque ici l’élévation de Jésus à une dignité et une autorité suprêmes; « a élevé » rend ce sens sans suggérer seulement la résurrection.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: à sa droite
  rationale: La lecture locative, conforme au langage néotestamentaire d’intronisation, indique la place d’honneur et d’autorité auprès de Dieu. La lecture instrumentale possible est signalée en note.
- source_word: τοῦ δοῦναι
  choice: afin de donner
  rationale: L’infinitif grec articulé exprime le but; « afin de » le rend explicitement et naturellement.
- source_word: μετάνοιαν
  choice: la repentance
  rationale: « Repentance » désigne ici le retournement décisif vers Dieu, et non un simple changement d’opinion. Le terme biblique demeure intelligible en français moderne.
- source_word: τῷ Ἰσραὴλ
  choice: à Israël
  rationale: Le datif désigne naturellement le bénéficiaire ou destinataire de ce que Dieu donne.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: le pardon des péchés
  rationale: Expression française courante et précise pour la remise des péchés évoquée par le grec.
theological_decisions:
- issue: Sens de l’exaltation de Jésus et de τῇ δεξιᾷ αὐτοῦ
  choice: Dieu a élevé Jésus à la place d’honneur et d’autorité à sa droite.
  alternative: Dieu a élevé Jésus par sa droite, c’est-à-dire par sa puissance.
  rationale: Le contexte d’exaltation et l’usage néotestamentaire favorisent le sens locatif, mais la forme dative grecque permet aussi une compréhension instrumentale; la note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est lui » porte l’emphase initiale; « Chef et Sauveur » conserve la coordination et le contexte d’autorité royale. La note maintient l’ambiguïté grammaticale du datif grec.
