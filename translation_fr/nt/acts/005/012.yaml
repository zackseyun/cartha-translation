    issue: « ils se tenaient tous »
    rationale: Le grec ἦσαν signifie ici « ils étaient »; il n’exprime pas le fait de se tenir debout. La formulation française ajoute donc une précision corporelle absente du texte source.
  - severity: low
    issue: « sous le portique » / « sous la colonnade »
    rationale: Le datif avec ἐν situe le groupe au lieu nommé. « Au portique » est plus neutre et naturel; « sous la colonnade » est moins heureux comme variante architecturale.
