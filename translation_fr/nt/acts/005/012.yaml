review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement διά avec le génitif, l’imparfait ἐγίνετο, la paire lucanienne « signes et prodiges », et « parmi le peuple ». La seconde doit éviter « se tenaient », qui suggère plus précisément la station debout et dépasse la simple copule ἦσαν. « Ils étaient tous réunis » restitue naturellement la présence collective et l’unité de ὁμοθυμαδόν, sans résoudre l’antécédent implicite de ἅπαντες.
  naturalness: « Ils étaient tous réunis, d’un commun accord, au portique de Salomon » est plus idiomatique et exact que « ils se tenaient … sous le portique ». « Au portique » désigne naturellement ce lieu architectural; « sous » et surtout « se tenaient » introduisaient des nuances spatiale et posturale non exigées par le grec.
  terminology: « Signes et prodiges », « apôtres » et « portique de Salomon » sont justes, compréhensibles en français international moderne, et appropriés au registre. La note alternative sur « colonnade » est conservée, avec une formulation qui ne suppose pas improprement qu’on se trouve « sous » une colonnade.
  issues:
