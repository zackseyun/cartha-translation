source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: fr
  text: Par les mains des apôtres, beaucoup de signes et de prodiges se faisaient parmi le peuple, et ils étaient tous réunis, d’un commun accord[a], au portique de Salomon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : tous ensemble. Le grec souligne une présence commune ainsi qu’une unité d’intention.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : à la colonnade de Salomon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Par les mains des apôtres
  rationale: διά avec le génitif exprime ici le moyen ou l’intermédiaire. La formulation conserve l’image concrète des « mains » et souligne que les apôtres sont les instruments de ces actes.
- source_word: δὲ
  choice: non rendu séparément
  rationale: δέ assure ici une transition narrative légère, sans opposition marquée. En français, la continuité du récit suffit et l’ajout de « or » ou « mais » alourdirait ou surinterpréterait le lien.
- source_word: ἐγίνετο
  choice: se faisaient
  rationale: L’imparfait exprime une activité répétée ou continue dans le passé. « Se faisaient » rend naturellement cette valeur avec « signes et prodiges » comme sujet.
- source_word: σημεῖα καὶ τέρατα
  choice: signes et prodiges
  rationale: Cette paire lucanienne consacrée désigne des actes extraordinaires. Le rendu reste transparent sans ajouter l’adjectif interprétatif « miraculeux ».
- source_word: πολλὰ
  choice: beaucoup de
  rationale: Le neutre pluriel qualifie l’ensemble « signes et prodiges ». « Beaucoup de » est courant et naturel en français moderne.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: La préposition indique ici la sphère humaine où les actes ont lieu. Le rendu n’ajoute aucune précision ethnique absente de la formulation immédiate.
- source_word: ὁμοθυμαδὸν
  choice: d’un commun accord
  rationale: L’adverbe évoque une présence commune marquée par l’unité d’intention. Cette expression conserve mieux cette nuance que le seul adverbe « ensemble », tout en restant compréhensible aujourd’hui.
- source_word: ἅπαντες
  choice: tous
  rationale: Le terme a une portée globale. Le pronom implicite demeure non précisé, ce qui évite de déterminer si le groupe désigne uniquement les apôtres ou plus largement les croyants.
- source_word: Στοᾷ Σολομῶντος
  choice: sous le portique de Salomon
  rationale: στοά désigne une galerie couverte à colonnes. « Sous le portique » exprime idiomatiquement le lieu en français; « colonnade » reste une variante architecturale possible.
theological_decisions:
- issue: Référent de « ils se tenaient tous »
  choice: Conserver le pronom « ils » sans identifier davantage le groupe
  alternative: Préciser soit « les apôtres », soit « tous les croyants »
  rationale: L’antécédent du sujet grec est implicite. La traduction préserve donc l’ambiguïté du texte au lieu de trancher entre les apôtres seuls et l’ensemble des croyants.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’image concrète des mains et l’ambiguïté du pronom, tandis que « d’un commun accord » maintient la nuance d’unité portée par l’adverbe grec.
