  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: fr
  text: 'Et toujours davantage de croyants au Seigneur venaient s’ajouter : des hommes et des femmes en grand nombre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se joignaient » ou « étaient ajoutés ». Le verbe grec décrit une augmentation continue et peut avoir un sens passif, laissant entendre que Dieu les ajoutait.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον
  choice: toujours davantage
  rationale: Cette expression rend naturellement la progression continue et la force comparative de l’adverbe dans ce résumé de croissance.
- source_word: δὲ
  choice: Et
  rationale: La particule assure ici une transition narrative légèrement connective, sans opposition marquée.
- source_word: προσετίθεντο
  choice: venaient s’ajouter
  rationale: L’imparfait exprime un processus répété ou continu. La tournure française conserve l’image de l’addition, tout en laissant ouverte la nuance passive ou moyenne du grec.
- source_word: πιστεύοντες
  choice: des croyants
  rationale: Le participe présent substantivé désigne naturellement les personnes caractérisées par leur foi.
- source_word: τῷ κυρίῳ
  choice: au Seigneur
  rationale: Avec πιστεύω, le datif désigne celui en qui la foi est placée. En français, « croire au Seigneur » est naturel et respecte la construction grecque.
- source_word: κύριος
  choice: Seigneur
  rationale: Le titre conserve sa portée révérencielle et christologique sans remplacer explicitement son référent par « Jésus ».
- source_word: πλήθη
  choice: en grand nombre
  rationale: Cette formulation française idiomatique exprime l’importance numérique des personnes ajoutées sans suggérer nécessairement une foule physiquement rassemblée.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: des hommes et des femmes
  rationale: La formulation conserve les deux groupes explicitement nommés et la valeur coordonnante de τε καί.
theological_decisions:
- issue: Référent et portée de « Seigneur »
  choice: Conserver « Seigneur », compris dans le contexte comme désignant Jésus et comme objet de la foi.
  alternative: Comprendre « Seigneur » plus généralement comme une désignation de Dieu.
  rationale: Dans les résumés missionnaires des Actes, κύριος renvoie fréquemment à Jésus ressuscité. La traduction garde toutefois le titre du grec et n’explicite pas le référent dans le texte.
- issue: Voix et aspect de προσετίθεντο
  choice: Employer « venaient s’ajouter », qui exprime une augmentation continue et permet d’entendre une action subie sans en nommer l’auteur.
  alternative: Traduire par « se joignaient », en privilégiant une nuance moyenne ou intransitive.
  rationale: L’imparfait décrit une croissance en cours. La formulation retenue préserve l’image de l’ajout et la possibilité d’un passif implicite où Dieu est celui qui ajoute, sans l’introduire explicitement comme sujet.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase place « des hommes et des femmes en grand nombre » en apposition explicative après « des croyants », conformément à la structure du grec, tout en évitant le terme plus littéraire « multitudes ».
