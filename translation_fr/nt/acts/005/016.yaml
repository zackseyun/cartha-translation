id: ACT.5.16
reference: Acts 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: fr
  text: La foule venant des localités des environs de Jérusalem se rassemblait aussi[a], en amenant des malades et des personnes tourmentées par des esprits impurs[b] ; tous étaient guéris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La foule des villes des environs de Jérusalem venait aussi se rassembler. »'
    reason: La construction grecque peut mettre l’accent soit sur l’origine de la foule, soit sur son action de se rassembler.
  - marker: b
    text: 'Ou : « harcelées par des esprits impurs ».'
    reason: Le verbe grec peut exprimer le fait d’être importuné, harcelé ou tourmenté.
lexical_decisions:
- source_word: συνήρχετο
  choice: venaient aussi en foule
  rationale: L’imparfait grec exprime une action continue ou répétée. Cette formulation française rend naturellement l’idée de gens qui affluaient et se réunissaient.
- source_word: τὸ πλῆθος
  choice: des gens… en foule
  rationale: Cette tournure rend le collectif singulier grec dans un français naturel, tout en conservant l’idée d’un grand nombre de personnes.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: des localités des environs de Jérusalem
  rationale: « Localités » rend πόλεις sans imposer la taille moderne suggérée par « villes » et πέριξ indique les lieux situés autour de Jérusalem.
- source_word: φέροντες
  choice: amenant
  rationale: Le participe décrit ce que faisaient les personnes qui venaient ; « amenant » convient à des malades et à d’autres personnes affligées.
- source_word: ἀσθενεῖς
  choice: des malades
  rationale: Dans ce contexte de guérison, le terme désigne des personnes physiquement malades.
- source_word: ὀχλουμένους
  choice: des personnes tourmentées
  rationale: Le participe désigne des personnes importunées ou affligées par les esprits ; « tourmentées » est clair et idiomatique, sans préciser davantage la nature de leur souffrance.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: par des esprits impurs
  rationale: « Esprits impurs » est une expression biblique claire en français moderne et conserve les connotations du grec ἀκάθαρτος.
- source_word: οἵτινες ἐθεραπεύοντο ἅπαντες
  choice: tous étaient guéris
  rationale: Le pronom reprend les malades et les personnes tourmentées. L’imparfait passif est conservé, ainsi que l’affirmation exhaustive portée par ἅπαντες.
theological_decisions:
- issue: Nature des πνεύματα ἀκάθαρτα
  choice: esprits impurs
  alternative: esprits mauvais
  rationale: Le texte présente ces esprits comme des agents personnels. La traduction conserve l’expression grecque sans la réduire à une description psychologique ni ajouter une identification doctrinale.
- issue: Portée de ἅπαντες
  choice: tous étaient guéris
  alternative: ils étaient tous guéris
  rationale: « Tous » porte sur les deux groupes amenés dans la scène et maintient sans restriction la portée exhaustive de l’énoncé.
translation_notes:
  register: Français international moderne, narratif et digne. « Localités » évite d’attribuer aux πόλεις une taille urbaine moderne précise. Le point-virgule clarifie que « tous » reprend l’ensemble des personnes amenées.
