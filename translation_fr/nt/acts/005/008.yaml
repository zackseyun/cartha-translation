base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: fr
  text: 'Mais Pierre lui répondit : « Dis-moi, est-ce à ce prix que vous avez vendu le terrain[a] ? » Elle dit : « Oui, à ce prix-là. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la propriété » ou « le champ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: Mais Pierre lui répondit
  rationale: « Mais » marque naturellement le tournant narratif exprimé par δέ. La construction française « lui répondit » rend idiomatiquement ἀπεκρίθη πρὸς αὐτήν sans reproduire lourdement « répondit à elle ».
- source_word: Εἰπέ μοι
  choice: Dis-moi
  rationale: L’impératif aoriste singulier et le datif μοι sont rendus par une demande directe, naturelle et précise en français.
- source_word: εἰ
  choice: est-ce
  rationale: εἰ introduit ici une interrogation indirecte totale après « Dis-moi » ; en français courant, la formulation directe « est-ce… ? » restitue clairement sa valeur interrogative.
- source_word: τοσούτου
  choice: à ce prix / à ce prix-là
  rationale: Dans le contexte d’une vente, τοσούτου désigne le montant convenu ou déclaré. « À ce prix » est naturel en français, et « à ce prix-là » reprend le même montant dans la réponse.
- source_word: τὸ χωρίον
  choice: le terrain
  rationale: χωρίον désigne ici une parcelle de terre ou un bien foncier. « Le terrain » convient au contexte sans préciser indûment qu’il s’agissait d’un champ cultivé.
- source_word: ἀπέδοσθε
  choice: vous avez vendu
  rationale: Dans ce contexte commercial, ἀποδίδωμι signifie « vendre ». Le verbe grec est à la deuxième personne du pluriel, probablement parce que Saphira et son mari ont effectué ensemble la vente ; le français conserve ce pluriel par « vous ».
- source_word: Ναί
  choice: Oui
  rationale: Simple réponse affirmative, rendue directement.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le tutoiement dans « Dis-moi » respecte le singulier grec adressé à Saphira, tandis que « vous avez vendu » conserve le pluriel grec qui associe vraisemblablement le couple à la vente. La répétition de τοσούτου est maintenue par « à ce prix / à ce prix-là ».
