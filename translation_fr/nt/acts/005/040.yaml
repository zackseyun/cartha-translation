id: ACT.5.40
reference: Acts 5:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: fr
  text: Après avoir fait appeler les apôtres, ils les battirent, leur ordonnèrent de ne pas parler au nom de Jésus[a], puis les relâchèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet du nom de Jésus » ou « en se fondant sur le nom de Jésus ». L’expression grecque peut désigner le fait de parler en référence à Jésus et sous son autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: après avoir fait appeler
  rationale: Le participe aoriste marque une action antérieure aux verbes principaux. « Après avoir fait appeler » rend naturellement la convocation des apôtres devant le Conseil.
- source_word: τοὺς ἀποστόλους
  choice: les apôtres
  rationale: « Apôtres » est le terme français établi et précis pour les témoins mandatés dont il est question dans ce contexte.
- source_word: δείραντες
  choice: ils les battirent
  rationale: Le verbe δέρω signifie battre ou rouer de coups. Cette formulation conserve la portée assez large du grec sans préciser un type particulier de châtiment judiciaire comme le ferait « flageller ».
- source_word: παρήγγειλαν
  choice: leur ordonnèrent
  rationale: παραγγέλλω exprime ici un ordre ferme. Le pronom « leur » explicite naturellement en français les destinataires déjà mentionnés.
- source_word: μὴ λαλεῖν
  choice: de ne pas parler
  rationale: μή suivi de l’infinitif donne le contenu de l’interdiction. « Parler » convient au registre de la scène sans ajouter l’idée explicite de continuité.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: au nom de Jésus
  rationale: Cette tournure française familière dans le langage biblique peut évoquer à la fois le fait de parler en référence à Jésus et de se réclamer de son autorité. Une note signale l’étendue possible de l’expression grecque.
- source_word: ἀπέλυσαν
  choice: les relâchèrent
  rationale: ἀπολύω désigne ici la remise en liberté de personnes retenues. « Relâcher » convient au contexte de détention.
theological_decisions:
- issue: Sens de l’expression ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: au nom de Jésus
  alternative: au sujet du nom de Jésus ; en se fondant sur le nom de Jésus
  rationale: Dans les Actes, l’expression peut associer la référence publique à Jésus, son invocation et l’autorité attachée à son nom. Le texte principal garde l’expression traditionnelle et ouverte, tandis que la note préserve ses autres nuances possibles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit la succession rapide des actions du grec, avec « puis » pour rendre leur enchaînement naturel. Le choix de « battirent » évite de surspécifier la forme exacte du châtiment.
