id: ACT.5.21
reference: Acts 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: fr
  text: Après avoir entendu cela, ils entrèrent dès l’aube dans l’enceinte du temple et y enseignaient. À leur arrivée, le grand prêtre et ceux qui l’accompagnaient convoquèrent le sanhédrin et toute l’assemblée des anciens d’Israël[a], puis ils envoyèrent des agents à la prison pour les faire amener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le conseil d’Israël » ou « l’ensemble des anciens d’Israël ».
    reason: Ces formulations rendent de manière plus condensée ou plus idiomatique γερουσία τῶν υἱῶν Ἰσραήλ, sans trancher la relation exacte entre cette expression et « le sanhédrin ».
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Après avoir entendu cela
  rationale: Le participe aoriste exprime ici une action antérieure et renvoie à l’ordre donné par l’ange au verset précédent. « Cela » explicite naturellement cette reprise en français.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: dès l’aube
  rationale: L’expression temporelle désigne les premières heures du jour. « Dès l’aube » est idiomatique et rend aussi leur empressement sans surinterprétation.
- source_word: εἰς τὸ ἱερὸν
  choice: dans l’enceinte du temple
  rationale: ἱερόν désigne l’ensemble du complexe du temple, et non le sanctuaire proprement dit. « L’enceinte du temple » maintient cette distinction dans un français accessible.
- source_word: ἐδίδασκον
  choice: y enseignaient
  rationale: L’imparfait grec présente l’enseignement comme une activité en cours; l’imparfait français en conserve l’aspect duratif.
- source_word: Παραγενόμενος
  choice: Quand le grand prêtre arriva
  rationale: Le participe aoriste introduit l’événement suivant. Une subordonnée temporelle donne un enchaînement naturel en français.
- source_word: οἱ σὺν αὐτῷ
  choice: ceux qui l’accompagnaient
  rationale: Cette formulation reste générale comme le grec et n’attribue pas au groupe une identité plus précise que ne le fait le texte.
- source_word: συνεκάλεσαν
  choice: ils convoquèrent
  rationale: Le verbe signifie réunir une assemblée par convocation. « Convoquèrent » est précis, courant et adapté au contexte officiel.
- source_word: τὸ συνέδριον
  choice: le sanhédrin
  rationale: Dans ce contexte, συνέδριον désigne le conseil dirigeant juif connu sous ce nom historique.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: tout le conseil des anciens des fils d’Israël
  rationale: γερουσία désigne un corps d’anciens. La traduction conserve à la fois l’idée institutionnelle, la totalité exprimée par πᾶσαν et la désignation familiale nationale « fils d’Israël ».
- source_word: εἰς τὸ δεσμωτήριον
  choice: à la prison
  rationale: δεσμωτήριον est le terme courant pour un lieu de détention; « prison » est ici naturel et précis.
- source_word: ἀχθῆναι αὐτούς
  choice: pour les faire amener
  rationale: L’infinitif passif exprime le but de l’envoi. La construction causative française rend le fait que les autorités ordonnent que les apôtres soient conduits devant elles.
theological_decisions:
- issue: Portée de « τὴν γερουσίαν » à côté de « τὸ συνέδριον »
  choice: le sanhédrin et tout le conseil des anciens
  alternative: le sanhédrin, c’est-à-dire l’ensemble des anciens
  rationale: La conjonction grecque peut sembler coordonner deux groupes ou développer la désignation du sanhédrin. Le texte principal conserve la coordination formelle sans imposer une identification appositive.
- issue: Traduction de « τῶν υἱῶν Ἰσραήλ »
  choice: des fils d’Israël
  alternative: d’Israël / des Israélites
  rationale: La formulation familiale explicitement masculine et traditionnelle du grec est conservée. Une formulation nationale plus idiomatique est signalée en note sans effacer la forme de l’original.
translation_notes:
  register: Français international moderne, digne et lisible. Le terme historique « sanhédrin » est conservé; « enceinte du temple » évite de confondre le complexe du temple avec le sanctuaire. Les temps verbaux distinguent l’entrée ponctuelle de l’enseignement en cours.
