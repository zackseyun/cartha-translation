    text: Ou « tout le conseil d’Israël » ou « l’ensemble des anciens d’Israël ».
    reason: Ces formulations rendent de manière plus condensée ou plus idiomatique γερουσία τῶν υἱῶν Ἰσραήλ, sans trancher la relation exacte entre cette expression et « le sanhédrin ».
  revision_rationale: La révision conserve l’ordre des événements et les distinctions lexicales importantes, tout en corrigeant deux formulations françaises qui obscurcissaient le sens. « Des agents » est une explicitation minimale de l’objet sous-entendu de « envoyèrent », requise par l’usage français et confirmée par l’infinitif passif « être amenés ».
