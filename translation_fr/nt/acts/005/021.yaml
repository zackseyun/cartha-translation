revisions:
- from: 'Après avoir entendu cela, ils entrèrent dès l’aube dans l’enceinte du temple et y enseignaient. Quand le grand prêtre arriva avec ceux qui l’accompagnaient, ils convoquèrent le sanhédrin et tout le conseil des anciens des fils d’Israël[a], puis ils envoyèrent chercher les apôtres à la prison pour les faire amener.


    [a] Ou « tout le conseil d’Israël » ou « l’ensemble des anciens d’Israël ».'
  to: Après avoir entendu cela, ils entrèrent dès l’aube dans l’enceinte du temple et y enseignaient. À leur arrivée, le grand prêtre et ceux qui l’accompagnaient convoquèrent le sanhédrin et toute l’assemblée des anciens d’Israël[a], puis ils envoyèrent des agents à la prison pour les faire amener.
  rationale: La révision conserve l’ordre des événements et les distinctions lexicales importantes, tout en corrigeant deux formulations françaises qui obscurcissaient le sens. « Des agents » est une explicitation minimale de l’objet sous-entendu de « envoyèrent », requise par l’usage français et confirmée par l’infinitif passif « être amenés ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:09:23Z'
review_pass:
  verdict: revise
  source_fidelity: La séquence narrative, l’aspect duratif de « enseignaient », la portée de ἱερόν (« enceinte du temple »), ainsi que la convocation du συνέδριον sont bien rendus. Toutefois, « conseil des anciens des fils d’Israël » produit en français une relation génitive ambiguë et peu fidèle au sens institutionnel de γερουσία τῶν υἱῶν Ἰσραήλ. La formulation finale « ils envoyèrent chercher les apôtres à la prison pour les faire amener » est redondante et rend moins directement l’envoi d’agents afin qu’ils soient amenés.
  naturalness: Le français est globalement moderne et soutenu. « À leur arrivée, le grand prêtre et ceux qui l’accompagnaient » élimine l’ambiguïté du sujet pluriel après un singulier initial. « Envoyèrent des agents à la prison » est naturel et explicite ce qui est nécessairement sous-entendu par le grec, sans ajouter de fait substantiel.
  terminology: « Grand prêtre », « sanhédrin » et « enceinte du temple » conviennent. « Toute l’assemblée des anciens d’Israël » rend naturellement γερουσία tout en évitant de présenter « les fils d’Israël » comme le complément possessif des anciens. La note conserve des options de formulation et reste correctement ancrée.
  issues:
  - severity: medium
    issue: « tout le conseil des anciens des fils d’Israël » est syntaxiquement et sémantiquement maladroit.
    rationale: En français, cette chaîne de génitifs peut faire comprendre que les anciens appartiennent aux « fils d’Israël ». Le grec désigne la totalité du corps des anciens d’Israël, en coordination ou en développement de « sanhédrin ».
  - severity: low
    issue: La dernière proposition est redondante et peu directe.
    rationale: « Envoyer chercher ... pour les faire amener » double la même idée. Le grec dit qu’ils envoyèrent [des agents] à la prison afin que les apôtres soient amenés.
  revised_text: Après avoir entendu cela, ils entrèrent dès l’aube dans l’enceinte du temple et y enseignaient. À leur arrivée, le grand prêtre et ceux qui l’accompagnaient convoquèrent le sanhédrin et toute l’assemblée des anciens d’Israël[a], puis ils envoyèrent des agents à la prison pour les faire amener.
  revised_footnotes:
