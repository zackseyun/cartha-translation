  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: fr
  text: 'en disant : « Nous vous avons formellement interdit d’enseigner en ce nom-là. Et voilà que vous avez rempli Jérusalem de votre enseignement ! Vous voulez faire retomber sur nous le sang de cet homme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit : « nous rendre responsables de la mort de cet homme ». L’expression grecque évoque la culpabilité liée au sang versé.'
    reason: Précision sur le sens idiomatique de l’image du sang que l’on fait retomber sur quelqu’un.
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent introduit directement les paroles qui suivent et conserve le lien syntaxique avec le verset précédent.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Nous vous avions formellement interdit
  rationale: La construction associant un nom et un verbe de même racine renforce l’ordre. « Formellement interdit » restitue cette insistance en français naturel, tandis que le plus-que-parfait convient à l’ordre antérieur rappelé ici.
- source_word: μὴ διδάσκειν
  choice: d’enseigner
  rationale: Après « interdire », l’infinitif français exprime naturellement le contenu de la défense, sans ajouter l’idée plus interprétative de cesser une activité.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: en ce nom-là
  rationale: Cette formulation conserve la référence au « nom » et sa valeur probable d’autorité ou de fondement, tout en maintenant la distance méprisante du démonstratif.
- source_word: ἰδοὺ
  choice: Et voilà que
  rationale: Cette tournure actuelle garde la force déictique, accusatrice et quelque peu étonnée de l’expression grecque.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: vous avez rempli Jérusalem
  rationale: Le passé composé rend l’action accomplie dont les effets demeurent présents et préserve la métaphore du texte grec.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: de votre enseignement
  rationale: Le complément introduit par « de » est naturel après « remplir » et « enseignement » demeure plus courant et moins chargé confessionnellement que « doctrine ».
- source_word: βούλεσθε
  choice: Vous voulez
  rationale: Le verbe exprime ici la volonté ou l’intention. « Vous voulez » conserve directement le ton accusateur sans renforcer en « vous êtes déterminés ».
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: faire retomber sur nous
  rationale: Cette expression française conserve l’image de quelque chose amené sur les interlocuteurs et convient à l’idée de responsabilité imputée.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: le sang de cet homme
  rationale: La traduction littérale maintient à la fois l’image du sang versé et la manière distante dont Jésus est désigné, sans expliciter dans le corps du texte la responsabilité pour sa mort.
theological_decisions:
- issue: Sens de « faire retomber sur nous le sang de cet homme »
  choice: Conserver dans le texte l’image du sang qui retombe sur les responsables présumés.
  alternative: 'Expliciter : « nous rendre responsables de la mort de cet homme ».'
  rationale: L’expression grecque évoque la culpabilité liée au sang versé, mais sa formulation imagée porte une force théologique et rhétorique propre. La traduction la préserve, tandis qu’une note en indique le sens idiomatique sans l’imposer dans le texte principal.
translation_notes:
  register: Français international moderne, direct et digne. Le ton est celui d’un reproche officiel et accusateur. « Ce nom-là » et « cet homme » préservent la prise de distance hostile des dirigeants, tandis que l’image biblique du sang reste intacte et est expliquée en note.
