source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: fr
  text: Le Dieu de nos pères a ressuscité Jésus[a], lui que vous avez tué en le pendant au bois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a suscité ». Le verbe grec peut aussi signifier « susciter », mais il désigne ici la résurrection, sans que le verset dise explicitement « d’entre les morts ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à un arbre ». Le grec dit littéralement « au bois » et fait probablement écho à Deutéronome 21.23. Dans ce contexte, le terme renvoie à l’instrument de la crucifixion.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Le Dieu de nos pères
  rationale: Cette formulation conserve l’expression biblique et son évocation du Dieu de l’alliance d’Israël. « Nos ancêtres » serait plus courant, mais effacerait la forme masculine et traditionnelle de la formule grecque.
- source_word: ἤγειρεν
  choice: a relevé
  rationale: Le verbe ἐγείρω peut ici désigner la résurrection, sans que le grec ajoute explicitement « d’entre les morts ». « A relevé » garde cette portée tout en évitant de rendre explicite ce qui demeure implicite dans le verset.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: διεχειρίσασθε
  choice: avez tué
  rationale: Dans ce contexte, le verbe désigne une action violente ayant entraîné la mort. « Avez tué » est direct, naturel et conforme à la force de l’accusation.
- source_word: κρεμάσαντες
  choice: en le suspendant
  rationale: Le participe précise le moyen ou la manière de la mise à mort. Cette construction française restitue naturellement le rapport avec le verbe principal.
- source_word: ἐπὶ ξύλου
  choice: au bois
  rationale: ξύλον peut signifier « bois » ou « arbre ». « Au bois » conserve le terme distinct de « croix » et permet l’écho probable à Deutéronome 21.23, tout en restant intelligible dans le contexte de la crucifixion.
theological_decisions:
- issue: Faut-il rendre ἤγειρεν par une mention explicite de la résurrection ?
  choice: a relevé
  alternative: a ressuscité / a relevé d’entre les morts
  rationale: Le contexte indique fortement la résurrection, mais le grec ne dit pas explicitement « d’entre les morts » dans ce verset. La traduction choisie préserve cette tension.
- issue: Faut-il interpréter ξύλον directement comme « croix » ?
  choice: au bois
  alternative: sur une croix / à un arbre
  rationale: Le texte emploie ξύλον et non σταυρός. Garder « bois » respecte ce choix lexical et l’allusion probable à la malédiction de Deutéronome 21.23 sans nier qu’il s’agit de la crucifixion.
translation_notes:
  register: Français international moderne, digne et direct. « Nos pères » maintient l’idiome biblique ; « avez tué » rend sans atténuation la force accusatrice ; « au bois » préserve l’intertextualité tout en nécessitant une brève note explicative.
