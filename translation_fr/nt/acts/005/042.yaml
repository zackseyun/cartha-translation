id: ACT.5.42
reference: Acts 5:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: fr
  text: Chaque jour, dans le temple et de maison en maison, ils ne cessaient d’enseigner et d’annoncer la bonne nouvelle que Jésus est le Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus près du grec : « annoncer Jésus comme le Messie ».'
    reason: La construction grecque peut être formulée en français avec Jésus comme objet de l’annonce, plutôt qu’avec une proposition exprimant son contenu.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: Chaque jour
  rationale: Cette expression rend naturellement l’accusatif de durée ou de temps et conserve l’idée d’une activité habituelle et continue.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Ἱερόν désigne ici l’ensemble du complexe du temple. « Dans le temple » est concis et naturel sans limiter indûment la scène au sanctuaire proprement dit.
- source_word: κατ’ οἶκον
  choice: de maison en maison
  rationale: La construction distributive κατά avec le singulier οἶκον indique une activité menée dans les maisons successivement, plutôt que simplement « chez eux ».
- source_word: οὐκ ἐπαύοντο
  choice: ils ne cessaient
  rationale: L’imparfait exprime une action continue. « Ils ne cessaient » est idiomatique, digne et fidèle à l’idée qu’ils poursuivaient sans s’arrêter.
- source_word: διδάσκοντες
  choice: d’enseigner
  rationale: Rend directement l’activité continue exprimée par le participe διδάσκοντες.
- source_word: εὐαγγελιζόμενοι
  choice: d’annoncer la bonne nouvelle
  rationale: Cette formulation accessible conserve le sens d’annoncer une heureuse nouvelle sans recourir au vocabulaire ecclésiastique plus spécialisé de « prêcher l’Évangile ».
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: que Jésus est le Messie
  rationale: Cette formulation française exprime naturellement le contenu de l’annonce et rend Χριστός comme le titre « Messie ». Une note conserve l’autre analyse possible, plus proche de la forme accusative grecque.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans ce contexte, Χριστός fonctionne comme un titre affirmant l’identité messianique de Jésus. « Messie » en traduit le sens au lieu de le traiter comme un nom propre.
- issue: Fonction syntaxique de τὸν χριστὸν Ἰησοῦν après εὐαγγελιζόμενοι
  choice: 'contenu de l’annonce : « que Jésus est le Messie »'
  alternative: 'complément d’objet : « annoncer comme bonne nouvelle Jésus, le Messie »'
  rationale: L’accusatif peut désigner directement la personne annoncée comme bonne nouvelle, mais le français courant exprime plus clairement cette proclamation sous forme de proposition. La note préserve l’ambiguïté syntaxique réelle.
translation_notes:
  register: Français international moderne, clair et digne. « Ils ne cessaient » maintient une légère solennité naturelle, tandis que « annoncer la bonne nouvelle » reste immédiatement compréhensible. La ponctuation évite les lourdeurs et la note signale sans la supprimer l’ambiguïté de la construction grecque.
