  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: fr
  text: 'Ils rapportèrent : « Nous avons trouvé la prison solidement verrouillée[a], et les gardes debout devant les portes. Mais, quand nous avons ouvert les portes, nous n’avons trouvé personne à l’intérieur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fermée en toute sécurité ». Le grec souligne que la prison avait été trouvée pleinement sécurisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'Ils rapportèrent :'
  rationale: Le participe introduit le contenu du rapport des agents mentionnés au verset précédent. Une proposition verbale est plus naturelle en français qu’un participe détaché et conserve le lien narratif.
- source_word: δεσμωτήριον
  choice: la prison
  rationale: Le terme désigne le lieu de détention ; « prison » est l’équivalent moderne, courant et adapté au contexte.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: fermée avec toutes les mesures de sécurité
  rationale: Le participe parfait décrit la prison dans un état de fermeture, tandis que l’expression prépositionnelle insiste sur le caractère complet des précautions prises. Cette formulation garde les deux aspects sans suggérer une catégorie pénitentiaire moderne.
- source_word: τοὺς φύλακας ἑστῶτας
  choice: les gardes debout
  rationale: « Gardes » convient au contexte carcéral, et « debout » préserve le détail visuel du participe sans préciser davantage qu’ils avaient été officiellement postés.
- source_word: ἐπὶ τῶν θυρῶν
  choice: devant les portes
  rationale: Avec le génitif, ἐπί indique ici la position des gardes à proximité immédiate des portes. « Devant » donne en français une image naturelle de gardes placés aux accès.
- source_word: ἀνοίξαντες
  choice: quand nous avons ouvert les portes
  rationale: Le participe aoriste exprime une action antérieure à la constatation. L’objet, non exprimé en grec, est explicité à partir des « portes » immédiatement mentionnées, ce qui est naturel et évite l’étrange idée d’ouvrir la prison elle-même.
- source_word: ἔσω οὐδένα
  choice: personne à l’intérieur
  rationale: La formulation rend directement l’adverbe de lieu et l’indéfini négatif dans un français actuel et clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve la vivacité du récit ; la répétition de « portes » privilégie la clarté référentielle.
