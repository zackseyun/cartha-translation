  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: fr
  text: En effet, avant ces jours-ci, Theudas s’est levé en prétendant être quelqu’un d’important[a], et environ quatre cents hommes se sont ralliés à lui[b]. Il a été tué, et tous ceux qui avaient été convaincus par lui[c] ont été dispersés et réduits à rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « en disant qu’il était quelqu’un ». La tournure grecque signifie qu’il se présentait comme un personnage important.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se sont attachés à lui » ou « l’ont rejoint ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tous ceux qui le suivaient ». Plus littéralement : « tous ceux qui étaient convaincus par lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: En effet, quelque temps avant ces jours-ci
  rationale: πρό avec le génitif situe l’événement dans un temps antérieur, tandis que γάρ rattache cet exemple à l’argument explicatif de Gamaliel. « Quelque temps » rend la tournure naturelle en français sans préciser une durée absente du grec.
- source_word: ἀνέστη
  choice: s’est soulevé
  rationale: Dans ce contexte, le verbe décrit l’apparition d’un meneur et le lancement d’un mouvement, non une résurrection. « S’est soulevé » conserve la force de l’expression.
- source_word: Θευδᾶς
  choice: Theudas
  rationale: Le nom propre est translittéré selon la forme française usuelle.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: en prétendant être quelqu’un d’important
  rationale: La tournure idiomatique présente Theudas comme revendiquant une certaine importance. Cette formulation explicite naturellement l’idiome sans lui attribuer un titre précis.
- source_word: ᾧ προσεκλίθη
  choice: se sont ralliés à lui
  rationale: Le verbe exprime l’adhésion ou l’alignement sur un meneur. « Se rallier à » convient au contexte d’un mouvement collectif.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: environ quatre cents hommes
  rationale: ὡς marque l’approximation et ἀνδρῶν désigne ici des hommes de sexe masculin. Le français naturel n’a pas besoin de reproduire littéralement « un nombre d’hommes ».
- source_word: ὃς ἀνῃρέθη
  choice: Il a été tué
  rationale: ἀναιρέω signifie ici tuer ou supprimer. Le passif est conservé sans identifier un agent que le texte ne nomme pas.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: tous ceux qui s’étaient laissé convaincre par lui
  rationale: La formulation garde la nuance de persuasion ou d’adhésion produite par Theudas, plutôt que de réduire le sens au simple fait de le suivre.
- source_word: διελύθησαν
  choice: ont été dispersés
  rationale: Le terme décrit la dissolution du groupe après la mort de son meneur. « Ont été dispersés » conserve la forme passive et convient au récit.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: leur mouvement n’a abouti à rien
  rationale: L’idiome exprime l’échec complet de l’entreprise. L’ajout explicatif « leur mouvement » évite en français de dire que les personnes elles-mêmes sont devenues néant, tout en conservant le sens contextuel.
theological_decisions:
- issue: Statut historique du récit concernant Theudas dans le discours de Gamaliel
  choice: Présenter sans réserve l’exemple tel que Gamaliel l’énonce dans le texte grec.
  alternative: Introduire une marque d’incertitude ou modifier la formulation pour l’accorder à une reconstruction historique externe.
  rationale: La traduction doit restituer le contenu du discours rapporté sans trancher ni harmoniser dans le texte principal les questions de chronologie soulevées par d’autres sources.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit la progression argumentative de Gamaliel tout en évitant les calques peu naturels. Les marqueurs de note sont placés immédiatement après les expressions concernées.
