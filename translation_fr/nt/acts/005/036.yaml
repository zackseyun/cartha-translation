revisions:
- from: En effet, quelque temps avant ces jours-ci, Theudas s’est soulevé en prétendant être quelqu’un d’important[a], et environ quatre cents hommes se sont ralliés à lui[b]. Il a été tué, et tous ceux qui s’étaient laissé convaincre par lui[c] ont été dispersés, et leur mouvement n’a abouti à rien.
  to: En effet, avant ces jours-ci, Theudas s’est levé en prétendant être quelqu’un d’important[a], et environ quatre cents hommes se sont ralliés à lui[b]. Il a été tué, et tous ceux qui avaient été convaincus par lui[c] ont été dispersés et réduits à rien.
  rationale: La révision évite de transformer l’apparition de Theudas en révolte explicitement affirmée, conserve l’idiome d’auto-importance sans lui attribuer de titre, et rend la conclusion grecque sans ajouter un substantif interprétatif. Les notes restent ancrées aux expressions qu’elles éclairent et conservent les alternatives pertinentes.
