id: ACT.5.25
reference: Acts 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: fr
  text: 'Mais quelqu’un arriva et leur annonça : « Voici ! Les hommes que vous avez mis en prison se tiennent dans le Temple[a] et enseignent le peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’enceinte du Temple » ; le mot grec ἱερόν désigne l’ensemble du complexe du Temple plutôt que le sanctuaire intérieur en particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: arriva
  rationale: Le participe aoriste situe l’arrivée du messager avant l’annonce; « arriva » rend naturellement cette succession narrative.
- source_word: δέ
  choice: Mais
  rationale: Marque ici un tournant légèrement contrastif dans le récit, puisque la nouvelle contredit la situation attendue.
- source_word: τις
  choice: quelqu’un
  rationale: Conserve le caractère indéfini du sujet sans préciser inutilement son identité.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: leur annonça
  rationale: Exprime la transmission d’une information aux autorités; « annonça » convient au registre narratif et garde le pronom comme dans le grec.
- source_word: Ἰδοὺ
  choice: Regardez !
  rationale: Interpellation vive qui attire l’attention sur une nouvelle surprenante; cette forme est actuelle sans être familière.
- source_word: οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: Les hommes que vous avez mis en prison
  rationale: Rend directement l’identité des prisonniers et l’action de les y placer, dans un français idiomatique.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple[a]
  rationale: ἱερόν désigne l’ensemble du complexe du Temple, et non le sanctuaire intérieur; la majuscule identifie le Temple de Jérusalem, tandis que la note précise l’étendue du terme.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: se tiennent dans le Temple et enseignent le peuple
  rationale: Conserve les deux participes coordonnés et leur aspect présent; « se tiennent » rend la posture exprimée par ἑστῶτες sans ajouter « debout », qui serait possible mais plus appuyé.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste directe, avec une interpellation vive dans le discours rapporté. « Temple » est employé au sens institutionnel et architectural du Temple de Jérusalem.
