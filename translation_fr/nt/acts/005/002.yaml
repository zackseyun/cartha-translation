  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: fr
  text: Il détourna une partie du prix de la vente[a], sa femme le sachant elle aussi, puis en apporta une part qu’il déposa aux pieds des apôtres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garda secrètement pour lui une partie du prix de la vente » ; le verbe grec implique qu’il en retint frauduleusement une part.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « aux pieds des apôtres » : manière concrète de dire qu’il plaça l’argent devant eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: détourna une partie
  rationale: Le verbe exprime le fait de garder frauduleusement quelque chose pour soi. « Détourna » conserve cette portée morale sans assimiler explicitement l’acte à une catégorie juridique précise.
- source_word: ἀπὸ τῆς τιμῆς
  choice: du prix de la vente
  rationale: Dans ce contexte, τιμή désigne le montant obtenu lors de la vente. Cette formulation est plus claire en français courant que le seul « du prix ».
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: au su de sa femme
  rationale: Le génitif absolu indique que sa femme avait connaissance de l’acte; καί souligne qu’elle aussi le savait. « Au su de » rend naturellement cette circonstance concomitante.
- source_word: ἐνέγκας μέρος τι
  choice: puis apporta une certaine somme
  rationale: Le participe aoriste marque une action antérieure au verbe principal. Μέρος τι désigne une part indéterminée; puisque l’objet est ici de l’argent, « une certaine somme » est naturel et précis.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: la déposa aux pieds des apôtres
  rationale: Cette traduction préserve l’image concrète et la formulation récurrente des Actes, plutôt que de la réduire à l’idée abstraite de remettre l’argent aux apôtres.
theological_decisions:
- issue: Portée morale de l’acte d’Ananias
  choice: Présenter l’acte comme un détournement dissimulé, et non comme la simple conservation neutre d’une part du prix.
  alternative: « garda une partie du prix de la vente »
  rationale: Le contexte narratif et νοσφίζομαι donnent à l’acte une valeur négative et frauduleuse. « Détourna » la préserve sans ajouter une qualification doctrinale ou juridique absente du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluidifiée par « puis », tout en maintenant l’enchaînement des actions. Les marqueurs [a] et [b] figurent dans le texte principal.
