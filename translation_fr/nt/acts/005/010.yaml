  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: fr
  text: Aussitôt, elle tomba aux pieds de Pierre et expira. Quand les jeunes hommes entrèrent, ils la trouvèrent morte ; ils l’emportèrent et l’enterrèrent auprès de son mari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: Rend directement l’immédiateté de l’adverbe grec dans un français naturel.
- source_word: πρὸς τοὺς πόδας αὐτοῦ
  choice: aux pieds de Pierre
  rationale: Le pronom renvoie à Pierre dans le contexte immédiat ; expliciter le référent évite une ambiguïté artificielle en français.
- source_word: ἐξέψυξεν
  choice: expira
  rationale: Reproduit l’image idiomatique de la cessation du souffle et indique clairement la mort, sans paraphrase doctrinale.
- source_word: οἱ νεανίσκοι
  choice: les jeunes hommes
  rationale: Équivalent courant et précis du substantif grec.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: auprès de son mari
  rationale: Le contexte funéraire indique une sépulture à côté de celle de son mari ; « auprès de » préserve sobrement cette relation spatiale.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le point-virgule relie naturellement la découverte du corps à son enlèvement et à son ensevelissement.
