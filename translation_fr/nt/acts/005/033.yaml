lexical_decisions:
- source_word: Οἱ δὲ
  choice: Mais ils
  rationale: δέ marque ici un tournant légèrement adversatif entre le discours entendu et la réaction du groupe déjà identifié.
- source_word: ἀκούσαντες
  choice: quand ils entendirent cela
  rationale: Le participe aoriste exprime naturellement la circonstance temporelle; « cela » reprend implicitement les paroles précédentes.
- source_word: διεπρίοντο
  choice: ils furent transportés de rage
  rationale: Le verbe évoque littéralement le fait d’être scié ou transpercé, mais décrit ici, au vu du projet meurtrier qui suit, une agitation violemment hostile. Cette tournure française en restitue l’intensité sans suggérer principalement le remords.
- source_word: ἐβούλοντο
  choice: voulurent
  rationale: Le verbe exprime leur volonté ou leur intention; le passé simple convient au registre narratif français, sans surinterpréter le degré de résolution.
- source_word: ἀνελεῖν
  choice: les tuer
  rationale: Dans ce contexte, ἀναιρέω désigne directement le fait d’ôter la vie.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux apôtres interrogés.
