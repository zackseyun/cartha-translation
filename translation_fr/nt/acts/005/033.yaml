  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: fr
  text: Mais quand ils entendirent cela, ils furent pris de fureur[a] et voulurent les tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe évoque le fait d’être comme « sciés en deux »; il exprime ici une violente agitation hostile.
