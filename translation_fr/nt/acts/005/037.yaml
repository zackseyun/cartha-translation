id: ACT.5.37
reference: Acts 5:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: fr
  text: Après lui[a], Judas le Galiléen se leva, à l’époque du recensement[b], et entraîna des gens à sa suite. Lui aussi périt, et tous ceux qui se laissaient convaincre par lui furent dispersés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Après cela » ou « Après cet homme ».
    reason: Le pronom grec peut renvoyer à l’homme mentionné précédemment ou, plus largement, à l’épisode qui vient d’être raconté.
  - marker: b
    text: Ou « de l’enregistrement officiel ».
    reason: Le terme grec peut désigner un recensement ou une opération officielle d’enregistrement.
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: Après lui
  rationale: Avec l’accusatif, μετά marque ici la succession. Le pronom renvoie naturellement à l’homme mentionné juste avant, tout en laissant possible un renvoi plus large à l’épisode précédent, signalé en note.
- source_word: ἀνέστη
  choice: se leva
  rationale: Dans ce récit historique, le verbe décrit l’apparition ou l’émergence d’un meneur, sans évoquer une résurrection. « Se leva » conserve l’image et reste naturel dans ce contexte.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Judas le Galiléen
  rationale: Cette formulation rend directement le nom propre et l’adjectif d’origine placé en apposition.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: à l’époque du recensement
  rationale: La tournure française exprime naturellement l’indication temporelle grecque. ἀπογραφή peut désigner un recensement ou, plus largement, un enregistrement officiel.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: entraîna des gens à sa suite
  rationale: Le causatif ἀπέστησε indique qu’il amena des personnes à se détacher de leur allégeance antérieure ou à le suivre. « Des gens » respecte l’absence d’article devant λαόν sans suggérer tout le peuple.
- source_word: κἀκεῖνος ἀπώλετο
  choice: Lui aussi périt
  rationale: La formulation conserve l’insistance de κἀκεῖνος et rend ἀπώλετο sans préciser un mode de mort que le grec ne donne pas.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: tous ceux qui s’étaient laissé convaincre par lui
  rationale: Cette traduction garde le sens propre de πείθω, distinct de la simple idée de suivre, et l’imparfait décrit les personnes qui accordaient du crédit à Judas.
- source_word: διεσκορπίσθησαν
  choice: furent dispersés
  rationale: Le passif aoriste signifie directement que le groupe fut dispersé.
theological_decisions:
- issue: Description historique et politique du mouvement de Judas
  choice: Décrire Judas comme un meneur qui entraîna des gens à sa suite, sans qualifier explicitement son action de révolte.
  alternative: « mena des gens à la révolte » ou « déclencha une rébellion »
  rationale: Le contexte historique est celui d’un mouvement de résistance, mais ce verset n’emploie pas explicitement un terme signifiant « rébellion ». La traduction préserve donc la portée du verbe sans ajouter une qualification politique plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. « À l’époque de » évite l’expression vieillie « aux jours de », tandis que « se leva » et « périt » conservent la sobriété et la force du récit grec.
