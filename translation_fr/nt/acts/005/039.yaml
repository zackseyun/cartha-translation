id: ACT.5.39
reference: Acts 5:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: fr
  text: Mais si cela vient de Dieu, vous ne pourrez pas les[a] détruire[b] ; vous pourriez même vous retrouver à combattre contre Dieu[c] ! » Ils se laissèrent donc convaincre par lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « les » renvoie le plus naturellement aux apôtres, bien qu’il puisse aussi inclure leur mouvement ou leur œuvre.
    reason: alternative_reading
  - marker: b
    text: Ou « renverser », « faire tomber » ou « réduire à néant ».
    reason: lexical_alternative
  - marker: c
    text: Ou « vous révéler même être des adversaires de Dieu » ; littéralement, « des combattants contre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: vient de Dieu
  rationale: La préposition ἐκ exprime ici l’origine. « Vient de Dieu » est naturel en français moderne et conserve le critère d’origine divine formulé par Gamaliel.
- source_word: δυνήσεσθε
  choice: vous pourrez
  rationale: Le futur de δύναμαι exprime une capacité à venir ; « vous ne pourrez pas » en conserve clairement le temps et le sens.
- source_word: καταλῦσαι
  choice: renverser
  rationale: Dans ce contexte, le verbe désigne l’action de faire tomber ou de réduire à néant des personnes et, par elles, leur œuvre. « Renverser » conserve cette force sans imposer l’idée d’une mise à mort.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom grec est masculin pluriel et renvoie le plus naturellement aux apôtres, plutôt qu’à une œuvre abstraite.
- source_word: μήποτε καὶ
  choice: vous pourriez même
  rationale: μήποτε introduit la mise en garde contre une éventualité redoutable, tandis que καί en souligne le caractère extrême. Cette formulation restitue les deux nuances en français courant.
- source_word: θεομάχοι
  choice: à combattre contre Dieu
  rationale: Le terme désigne littéralement des personnes qui combattent Dieu. La tournure verbale est naturelle en français et maintient toute la gravité théologique de l’avertissement.
- source_word: εὑρεθῆτε
  choice: vous retrouver
  rationale: Le passif d’εὑρίσκω signifie ici être découvert ou se révéler dans une certaine situation. « Vous retrouver à » rend cette idée idiomatiquement sans la réduire à une simple intention.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: Ils se laissèrent donc convaincre par lui
  rationale: Le passif de πείθω indique que les membres du conseil acceptèrent l’avis de Gamaliel. « Se laissèrent convaincre » rend naturellement le passif, et « donc » exprime ici la transition consécutive portée par δέ.
theological_decisions:
- issue: Référent de αὐτούς dans l’affirmation concernant ceux qui ne pourront pas être renversés
  choice: Le pronom « les » renvoie en premier lieu aux apôtres présents devant le conseil.
  alternative: Le pronom peut être compris plus largement comme englobant leur mouvement ou leur œuvre, dans le prolongement du verset 38.
  rationale: Le masculin pluriel grec désigne le plus directement les personnes dont il est question. Une note conserve toutefois la possible portée plus large liée au contexte, sans transformer la parole prudente de Gamaliel en principe général appliqué à tout mouvement religieux.
- issue: Portée de l’avertissement θεομάχοι εὑρεθῆτε
  choice: 'Conserver l’éventualité : « vous pourriez même vous retrouver à combattre contre Dieu ».'
  alternative: 'Formuler une identification plus directe : « vous serez des adversaires de Dieu ».'
  rationale: μήποτε présente un risque redouté, non un verdict catégorique. La traduction maintient ainsi la prudence et la tension propres au raisonnement de Gamaliel.
translation_notes:
  register: Français international moderne, clair et digne. « Cela » évite d’imposer un genre grammatical au sujet implicite qui reprend le projet ou l’œuvre mentionné au verset précédent. Le discours direct se clôt avant la proposition narrative finale.
