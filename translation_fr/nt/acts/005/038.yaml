id: ACT.5.38
reference: Acts 5:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: fr
  text: 'Et maintenant, je vous le dis : éloignez-vous de ces hommes et laissez-les tranquilles. Car si ce projet ou cette œuvre vient des humains[a], cela sera réduit à néant[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est d’origine humaine » ou « vient des hommes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cela sera détruit » ou « cela s’effondrera ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: maintenant
  rationale: Expression temporelle idiomatique qui introduit le conseil présent de Gamaliel; « maintenant » est naturel et conserve la progression du discours.
- source_word: ἀπόστητε
  choice: éloignez-vous de
  rationale: L’impératif appelle à prendre ses distances et à ne pas intervenir contre ces hommes; cette formulation est claire en français moderne.
- source_word: ἄφετε αὐτούς
  choice: laissez-les tranquilles
  rationale: Dans ce contexte, il s’agit de cesser de les inquiéter ou de leur faire obstacle, et non simplement de les laisser partir.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison donnée à l’appui du conseil.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: si … vient des humains
  rationale: ἐξ marque ici l’origine. « Des humains » rend la portée générique de ἀνθρώπων et prépare le contraste avec Dieu au verset suivant.
- source_word: βουλή
  choice: projet
  rationale: Le terme désigne ici un dessein ou une intention; « projet » est courant et s’associe naturellement à « œuvre ».
- source_word: ἔργον
  choice: œuvre
  rationale: Ce terme large désigne l’action ou l’entreprise en cours; « œuvre » maintient une traduction distincte de βουλή.
- source_word: καταλυθήσεται
  choice: sera réduit à néant
  rationale: Le futur passif exprime la dissolution ou l’anéantissement de l’entreprise; cette tournure conserve le passif sans préciser l’agent.
theological_decisions:
- issue: Origine humaine exprimée par ἐξ ἀνθρώπων
  choice: vient des humains
  alternative: vient des hommes / est d’origine humaine
  rationale: Le pluriel grec a ici une portée générique et s’oppose à l’origine divine au verset suivant. « Des humains » conserve explicitement la relation de provenance sans limiter le sens aux hommes de sexe masculin.
- issue: Sujet implicite de καταλυθήσεται après deux noms coordonnés
  choice: cela sera réduit à néant
  alternative: il sera réduit à néant / elle sera réduite à néant
  rationale: Le grec emploie un verbe au singulier malgré « ce projet ou cette œuvre ». Le pronom neutre « cela » préserve cette formulation collective et évite de choisir arbitrairement l’un des deux antécédents.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation explicite le conseil direct de Gamaliel. Les deux impératifs restent distincts, et le passif final est conservé.
