  variant: modern international French
source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: fr
  text: Mais un pharisien nommé Gamaliel se leva dans le Conseil[a]. C’était un maître de la Loi, estimé de tout le peuple. Il ordonna de faire sortir les hommes pour un moment[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Conseil » désigne l’instance dirigeante juive appelée le Sanhédrin.
    reason: cultural_note
  - marker: b
    text: Le grec emploie littéralement une expression qui revient à « faire les hommes dehors pour peu de temps » ; elle signifie les faire sortir temporairement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste introduit l’intervention publique de Gamaliel et conserve le sens physique du verbe.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste et un tournant dans le récit.
- source_word: τις
  choice: un
  rationale: L’article indéfini introduit naturellement en français ce nouveau personnage sans alourdir par « un certain ».
- source_word: ἐν τῷ συνεδρίῳ
  choice: au milieu du Conseil
  rationale: Cette formulation naturelle situe Gamaliel dans l’assemblée; la majuscule signale qu’il s’agit de l’instance dirigeante juive, précisée en note.
- source_word: Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: un pharisien nommé Gamaliel
  rationale: Rendu français courant et fidèle de l’appartenance au groupe et de la formule grecque introduisant le nom.
- source_word: νομοδιδάσκαλος
  choice: un enseignant de la Loi
  rationale: Le composé désigne celui qui enseigne la Loi; « enseignant » est actuel et « Loi » renvoie ici à la Loi juive.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: estimé de tout le peuple
  rationale: τίμιος exprime la considération publique; le complément conserve l’étendue générale de παντί sans ajouter « d’Israël », absent du grec.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe exprime une directive donnée avec autorité dans un cadre judiciaire.
- source_word: ἔξω ... τοὺς ἀνθρώπους ποιῆσαι
  choice: faire sortir les hommes
  rationale: L’expression grecque signifie littéralement les faire être dehors; « faire sortir » restitue clairement et idiomatiquement l’action commandée.
- source_word: βραχύ
  choice: pour un court moment
  rationale: L’accusatif adverbial indique une courte durée, nuance explicitement conservée.
theological_decisions:
- issue: Référence genrée de τοὺς ἀνθρώπους
  choice: les hommes
  alternative: les personnes / les gens
  rationale: Dans ce contexte, le groupe visé est celui des apôtres, des hommes comparaissant devant le Conseil. Le rendu conserve donc la référence masculine contextuelle sans la généraliser.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est répartie en trois phrases pour éviter une longue accumulation tout en conservant l’ordre narratif et les relations du grec. « Conseil » et « Loi » prennent une majuscule selon leur référent institutionnel et religieux dans ce contexte.
