  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: fr
  text: Mais le grand prêtre se leva, et tous ceux qui étaient avec lui — c’est-à-dire le parti des Sadducéens[a] — furent remplis de jalousie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la secte des Sadducéens ». Le mot grec peut désigner un parti, un courant ou une secte.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’envie ». Le mot grec peut aussi signifier « zèle », mais le contexte indique ici un sentiment hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste de ἀνίστημι introduit ici l’entrée en action du grand prêtre. « Se leva » conserve l’image et la force narrative sans explicitation excessive.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre l’accueil favorable réservé aux apôtres dans les versets précédents et la réaction hostile des autorités.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: Équivalent français courant et précis du titre singulier ἀρχιερεύς.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: tous ceux qui étaient avec lui
  rationale: Cette formulation naturelle conserve l’idée d’un groupe associé au grand prêtre sans préciser davantage le statut de ses membres.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: c’est-à-dire le parti des Sadducéens
  rationale: La proposition en apposition identifie le groupe associé au grand prêtre. Ici, αἵρεσις désigne un parti ou courant religieux, sans la connotation doctrinale tardive du mot « hérésie ».
- source_word: ἐπλήσθησαν
  choice: ils furent remplis
  rationale: Le passif de πίμπλημι suivi d’un génitif exprime le fait d’être rempli d’un sentiment. Le sujet pluriel est explicité en français pour assurer la clarté après la longue apposition.
- source_word: ζήλου
  choice: jalousie
  rationale: ζῆλος peut désigner le zèle, la jalousie ou l’envie. Dans ce contexte d’opposition hostile aux apôtres, « jalousie » rend le mieux sa valeur négative tout en laissant l’autre possibilité en note.
theological_decisions:
- issue: Sens de αἵρεσις
  choice: parti
  alternative: secte
  rationale: Le terme désigne ici un groupe reconnu au sein du judaïsme du Second Temple. « Parti » évite d’importer la notion ultérieure d’hérésie doctrinale.
- issue: Sens contextuel de ζῆλος
  choice: jalousie
  alternative: zèle ou envie
  rationale: Le contexte immédiat présente une réaction hostile à l’action des apôtres. Le sens négatif est donc privilégié, sans effacer la polysémie du terme grec.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de la phrase conserve l’apposition explicative du grec, tandis que le pronom « ils » clarifie le sujet pluriel du verbe final.
