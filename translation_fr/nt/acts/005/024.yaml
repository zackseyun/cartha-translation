  text: ὡς δὲ ἤκουσαν τοὺς λόγους τούτους ὅ ⸀τε στρατηγὸς τοῦ ἱεροῦ καὶ οἱ ἀρχιερεῖς, διηπόρουν περὶ αὐτῶν τί ἂν γένοιτο τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: fr
  text: Quand le commandant du Temple et les chefs des prêtres entendirent ces paroles, ils étaient perplexes à leur sujet et se demandaient ce qui pourrait en résulter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que cela pourrait devenir ». L’expression grecque porte sur l’issue possible de la situation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quand
  rationale: Introduit naturellement le développement suivant avec une valeur temporelle; le contexte suffit à porter la légère transition marquée par δέ.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: le commandant du Temple
  rationale: στρατηγός désigne ici l’officier responsable de la garde du Temple; « commandant » exprime clairement sa fonction sans suggérer un grade militaire moderne trop précis.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Le pluriel désigne les membres dirigeants de l’aristocratie sacerdotale, et non plusieurs grands prêtres simultanément en fonction.
- source_word: διηπόρουν
  choice: ils restèrent perplexes
  rationale: Le verbe exprime un profond embarras et une incertitude; l’imparfait grec présente cet état comme durable dans la scène.
- source_word: περὶ αὐτῶν
  choice: à leur sujet
  rationale: Le pronom est conservé sans préciser excessivement s’il renvoie aux paroles entendues ou aux faits rapportés.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: ce que tout cela pourrait devenir
  rationale: Le potentiel exprimé par ἄν avec l’optatif porte sur l’issue incertaine de la situation; la formulation française préserve cette ouverture.
theological_decisions:
- issue: Référent de περὶ αὐτῶν
  choice: à leur sujet
  alternative: au sujet de ces événements
  rationale: Le grec laisse le référent légèrement ouvert entre les paroles, les personnes concernées et les faits rapportés; la traduction ne tranche pas artificiellement.
translation_notes:
  register: Français international moderne, narratif et digne. « Temple » prend une majuscule pour désigner le sanctuaire de Jérusalem. La phrase conserve l’incertitude du grec sans alourdir la syntaxe.
