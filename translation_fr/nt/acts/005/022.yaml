  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: fr
  text: 'Mais, à leur arrivée, les agents ne les trouvèrent pas dans la prison. Ils revinrent et firent leur rapport :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: à leur arrivée
  rationale: Cette tournure française naturelle restitue la valeur temporelle du participe et situe clairement l’arrivée des gardes à la prison.
- source_word: ὑπηρέται
  choice: les gardes
  rationale: Dans ce contexte institutionnel, le terme désigne des agents chargés d’exécuter les ordres des autorités. « Gardes » convient au récit sans préciser davantage que le grec leur rattachement exact.
- source_word: οὐχ εὗρον
  choice: ne les trouvèrent pas
  rationale: Rendu direct et idiomatique de la négation avec εὑρίσκω dans ce contexte narratif.
- source_word: ἐν τῇ φυλακῇ
  choice: dans la prison
  rationale: L’article défini renvoie à la prison précise déjà mentionnée dans le récit.
- source_word: ἀναστρέψαντες
  choice: Ils revinrent donc
  rationale: Le participe indique qu’ils retournent auprès de ceux qui les avaient envoyés. Une proposition autonome produit un français fluide; « donc » explicite légèrement l’enchaînement narratif.
- source_word: ἀπήγγειλαν
  choice: faire leur rapport
  rationale: L’expression rend naturellement l’idée d’un compte rendu officiel et prépare la teneur du rapport au verset suivant.
- source_word: δέ
  choice: Mais / donc
  rationale: Le premier δέ marque le contraste entre l’attente et l’absence des apôtres; le second assure l’enchaînement du retour et du rapport.
