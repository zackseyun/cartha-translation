  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: fr
  text: Mais aucun des autres n’osait se joindre à eux ; mais le peuple les tenait en haute estime.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν λοιπῶν
  choice: des autres
  rationale: Rend directement l’expression grecque, dont le référent reste volontairement implicite dans le contexte.
- source_word: κολλᾶσθαι
  choice: se joindre à
  rationale: Exprime l’idée de s’attacher ou de s’associer étroitement au groupe, en français naturel.
- source_word: ἐμεγάλυνεν
  choice: avait beaucoup d’estime pour
  rationale: Dans ce contexte, le verbe signifie que le peuple tenait les apôtres en haute considération, plutôt qu’il ne les « glorifiait » au sens cultuel.
- source_word: ἀλλά
  choice: pourtant
  rationale: Marque le contraste entre la réticence à rejoindre le groupe et l’estime publique dont celui-ci jouissait.
theological_decisions:
- issue: Identité de « eux » et « des autres »
  choice: Conserver les pronoms et l’expression implicite du grec
  alternative: Préciser « les apôtres » ou « les croyants »
  rationale: Le verset grec ne nomme pas explicitement les deux groupes ; les expliciter trancherait une ambiguïté contextuelle réelle.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait rend naturellement les deux verbes grecs à l’imparfait et présente des attitudes durables dans la scène.
