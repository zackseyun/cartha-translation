  verdict: approve
  source_fidelity: 'Le texte rend avec exactitude les éléments principaux du grec : l’interrogation de reproche (Τί ὅτι), l’accord mutuel exprimé par συνεφωνήθη ὑμῖν, « mettre à l’épreuve », « l’Esprit du Seigneur », l’image littérale des pieds à la porte, et l’annonce qu’ils l’emporteront. « Vous êtes-vous mis d’accord » est correctement au pluriel, car l’accord concerne Saphira et son mari, tandis que « ton mari » et « t’emporter » s’adressent bien à elle seule.'
  naturalness: Le français est moderne, clair et d’un registre digne. « Voici » conserve naturellement l’effet d’ἰδού dans ce contexte solennel. « Ils vont t’emporter » est idiomatique et, dans le contexte immédiat, communique bien la sortie en vue de l’ensevelissement sans ajouter « ton corps ».
  terminology: « L’Esprit du Seigneur » suit étroitement τὸ πνεῦμα κυρίου et préserve la formulation du verset sans l’élargir à « l’Esprit Saint ». « Mettre à l’épreuve » est juste pour πειράσαι. « Ton mari » rend correctement ἄνδρα σου dans son contexte.
