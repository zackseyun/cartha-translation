id: ACT.5.9
reference: Acts 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: fr
  text: 'Mais Pierre lui dit : « Pourquoi vous êtes-vous mis d’accord pour mettre à l’épreuve l’Esprit du Seigneur ? Voici, les pieds de ceux qui ont enterré ton mari sont à la porte, et ils vont t’emporter. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί ὅτι
  choice: Pourquoi
  rationale: Cette tournure introduit ici une question de reproche. « Pourquoi » en restitue naturellement la force en français moderne.
- source_word: συνεφωνήθη ὑμῖν
  choice: vous êtes-vous mis d’accord
  rationale: Le passif avec ὑμῖν exprime idiomatiquement un accord mutuel. Cette formulation conserve l’idée d’une entente commune sans renforcer le verbe jusqu’à « conspirer ».
- source_word: πειράσαι
  choice: mettre à l’épreuve
  rationale: πειράζω peut signifier tenter ou éprouver. Avec l’Esprit du Seigneur comme objet, « mettre à l’épreuve » exprime clairement l’idée de tester présomptueusement sans suggérer que l’Esprit pouvait être incité au mal.
- source_word: τὸ πνεῦμα κυρίου
  choice: l’Esprit du Seigneur
  rationale: Cette formulation rend directement le génitif grec et préserve la référence probable à l’Esprit Saint sans ajouter « Saint », absent du texte de ce verset.
- source_word: ἰδοὺ
  choice: Voici
  rationale: « Voici » attire immédiatement l’attention sur la présence des porteurs à l’entrée, tout en gardant un registre actuel et digne.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: les pieds de ceux qui ont enterré
  rationale: La traduction conserve l’image concrète et saisissante des « pieds » plutôt que de la remplacer par « les pas ».
- source_word: τὸν ἄνδρα σου
  choice: ton mari
  rationale: Dans ce contexte, ἀνήρ désigne sans ambiguïté Ananias, le mari de Saphira.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: à la porte
  rationale: Expression française idiomatique indiquant leur présence immédiate à l’entrée.
- source_word: ἐξοίσουσίν σε
  choice: ils vont t’emporter
  rationale: ἐκφέρω signifie porter au-dehors. « T’emporter » conserve la brièveté menaçante de l’énoncé sans ajouter explicitement « ton corps ».
theological_decisions:
- issue: Référent de « l’Esprit du Seigneur »
  choice: Conserver « l’Esprit du Seigneur » comme référence probable à l’Esprit Saint.
  alternative: Expliciter « l’Esprit Saint » ou comprendre plus généralement la présence spirituelle du Seigneur.
  rationale: Le contexte immédiat d’Actes 5.3 désigne fortement l’Esprit Saint, mais le verset emploie précisément « l’Esprit du Seigneur ». La traduction garde cette formulation afin de ne pas dépasser le grec.
- issue: Force de l’accusation de Pierre
  choice: Rendre l’accord mutuel par « vous êtes-vous mis d’accord ».
  alternative: Employer « avez-vous conspiré » ou « vous êtes-vous entendus ».
  rationale: Le contexte manifeste une collusion coupable, mais le verbe signifie d’abord se mettre d’accord. La gravité de l’accusation ressort de l’action elle-même sans surtraduction lexicale.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier grec adressé à Saphira. La structure vive de l’annonce est préservée, ainsi que l’image littérale des pieds à la porte.
