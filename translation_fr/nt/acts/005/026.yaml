review_pass:
  verdict: revise
  source_fidelity: La phrase grecque dit que le stratège, accompagné de ses subordonnés, les emmena sans violence, parce qu'ils craignaient le peuple et redoutaient d'être lapidés. « Ramena » ajoute l'idée d'un retour, que ἤγαγεν n'exprime pas nécessairement. Surtout, « que le peuple ne les lapide » transforme la tournure passive grecque en actif avec un agent explicitement désigné. Le peuple est certes l'agent contextuellement probable, mais le grec le laisse implicite dans la proposition de résultat redouté.
  naturalness: La formulation révisée est naturelle en français international moderne, conserve un récit sobre et évite une construction lourde. « Craignaient le peuple, de peur d'être lapidés » rend clairement les deux éléments coordonnés de la crainte.
  terminology: « Commandant du Temple » rend adéquatement στρατηγός dans ce contexte cultuel; « gardes » est une désignation naturelle des ὑπηρέταις. « Emmena » restitue plus exactement ἤγαγεν sans imposer une destination ni un retour.
