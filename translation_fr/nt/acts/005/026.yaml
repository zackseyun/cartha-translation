  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: fr
  text: Alors le commandant du Temple se rendit avec les gardes et les emmena, sans employer la force, car ils craignaient le peuple, de peur d'être lapidés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατηγὸς
  choice: commandant du Temple
  rationale: Dans ce contexte, στρατηγός désigne le responsable chargé du maintien de l’ordre dans le Temple, et non un général romain. L’ajout « du Temple » explicite naturellement le référent contextuel.
- source_word: ὑπηρέταις
  choice: gardes
  rationale: Le terme désigne ici les subordonnés qui accompagnent le commandant pour assurer l’arrestation et l’escorte; « gardes » convient mieux au contexte que le terme générique « serviteurs ».
- source_word: ἤγαγεν αὐτούς
  choice: ramena les apôtres
  rationale: ἄγω signifie conduire ou amener. « Ramena » exprime naturellement leur conduite vers les autorités; « les apôtres » clarifie l’antécédent sans préciser indûment qu’ils entrèrent dans un lieu.
- source_word: οὐ μετὰ βίας
  choice: sans recourir à la force
  rationale: Cette formulation française actuelle exprime clairement l’absence de contrainte violente dans la manière de les escorter.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: car ils avaient peur que le peuple ne les lapide
  rationale: En français, rattacher la crainte à son objet redouté produit une phrase fluide. Le « ne » est explétif après une expression de crainte et ne nie pas la lapidation.
- source_word: μὴ λιθασθῶσιν
  choice: que le peuple ne les lapide
  rationale: La construction μή avec le subjonctif après un verbe de crainte indique l’issue redoutée. Le français actif nomme comme agent le peuple déjà mentionné, implication nette du contexte.
- source_word: τότε ἀπελθὼν
  choice: Alors ... partit
  rationale: Le participe accompagne la progression narrative et se rend naturellement par un verbe coordonné dans la séquence du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le calque « capitaine », peu naturel ici en français, et identifie la fonction cultuelle par « commandant du Temple ». Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
