    issue: « ramena » surinterprète ἤγαγεν.
    rationale: Le préfixe re- suggère qu'ils sont ramenés à un point antérieur; le grec signifie simplement « conduisit/mena/amena ».
  - severity: medium
    issue: « que le peuple ne les lapide » explicite l'agent de la lapidation.
    rationale: μὴ λιθασθῶσιν est au passif et n'énonce pas l'agent. Même si le contexte permet de l'inférer, la traduction doit préserver cette absence d'explicitation.
