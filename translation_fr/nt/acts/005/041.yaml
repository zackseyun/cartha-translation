  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: fr
  text: Ils s’éloignèrent donc du conseil, pleins de joie d’avoir été jugés dignes de subir le déshonneur pour le Nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le nom de Jésus ». Le grec dit littéralement « le Nom », formule révérencielle dont le référent reste implicite.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: quittèrent
  rationale: Dans ce contexte de sortie hors de la présence du conseil, le verbe décrit leur départ. Le passé simple assure une narration française naturelle, même si l’imparfait grec présente le mouvement dans son déroulement.
- source_word: χαίροντες
  choice: tout joyeux
  rationale: Le participe présent exprime leur disposition pendant le départ. Cette tournure française conserve la simultanéité et met naturellement en relief leur joie.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: quittèrent donc le conseil
  rationale: L’expression signifie littéralement qu’ils s’éloignent de la présence du conseil. Une traduction idiomatique évite le peu naturel « de devant la présence du conseil » sans perdre la scène.
- source_word: συνεδρίου
  choice: conseil
  rationale: Le nom désigne ici l’instance dirigeante connue historiquement comme le Sanhédrin. « Conseil » traduit le terme commun et reste immédiatement accessible.
- source_word: κατηξιώθησαν
  choice: avoir été jugés dignes
  rationale: Le passif aoriste indique qu’ils ont été estimés ou tenus pour dignes. « Jugés dignes » restitue clairement cette évaluation sans en préciser l’auteur, laissé implicite en grec.
- source_word: ὑπὲρ
  choice: pour
  rationale: La préposition marque ici la cause ou la référence du déshonneur subi en lien avec le Nom. « Pour » est concis et naturel.
- source_word: τοῦ ὀνόματος
  choice: le Nom
  rationale: Le grec emploie absolument « le Nom », formule révérencielle dont le référent est Jésus dans le contexte. La conserver respecte l’implicite et la force théologique du texte.
- source_word: ἀτιμασθῆναι
  choice: subir le déshonneur
  rationale: Cette formulation rend le passif et le cadre culturel de l’honneur et du déshonneur. Elle est plus naturelle en français courant que « être déshonorés » après « jugés dignes ».
theological_decisions:
- issue: Emploi absolu de « le Nom »
  choice: Conserver « le Nom » dans le texte principal.
  alternative: « le nom de Jésus » ou « son nom »
  rationale: Le référent est bien Jésus d’après le contexte, mais le grec ne l’explicite pas dans ce verset. Garder la formule absolue préserve sa résonance révérencielle et évite une expansion interprétative.
- issue: Auteur implicite du jugement de dignité
  choice: Maintenir le passif « avoir été jugés dignes » sans nommer celui qui juge.
  alternative: « que Dieu les ait jugés dignes »
  rationale: La tournure peut suggérer une évaluation divine, mais l’agent n’est pas exprimé. L’ajouter résoudrait une implicitation que le texte grec laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le contraste paradoxal entre la joie et le déshonneur. Le passé simple convient au registre narratif biblique sans archaïsme marqué.
