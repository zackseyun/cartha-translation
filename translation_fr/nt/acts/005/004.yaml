- from: Tant qu’il n’était pas vendu, ne t’appartenait-il pas ? Et une fois vendu, l’argent obtenu n’était-il pas à ta disposition[a] ? Pourquoi as-tu décidé dans ton cœur d’agir ainsi ? Ce n’est pas à des êtres humains que tu as menti, mais à Dieu.
  to: Tant qu’il n’était pas vendu, ne t’appartenait-il pas ? Après sa vente, n’étais-tu pas libre d’en disposer[a] ? Pourquoi as-tu décidé dans ton cœur d’agir ainsi ? Ce n’est pas à des êtres humains que tu as menti, mais à Dieu.
  rationale: La révision supprime l’ajout explicite de « l’argent obtenu » et conserve l’ellipse du grec par « en disposer ». Elle garde le sens de l’autorité ou du droit de décision d’Ananias, sans atténuer ni développer le contraste théologique final.
