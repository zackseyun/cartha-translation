id: ACT.5.4
reference: Acts 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: fr
  text: Tant qu’il n’était pas vendu, ne t’appartenait-il pas ? Après sa vente, n’étais-tu pas libre d’en disposer[a] ? Pourquoi as-tu décidé dans ton cœur d’agir ainsi ? Ce n’est pas à des êtres humains que tu as menti, mais à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’était-il pas en ton pouvoir ? » ou « ne relevait-il pas de ton autorité ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: Tant qu’il n’était pas vendu, ne t’appartenait-il pas ?
  rationale: La formulation française exprime naturellement la permanence de la possession avant la vente. Répéter littéralement « rester » serait lourd, tandis que « appartenir » rend clairement le datif possessif σοὶ.
- source_word: πραθέν
  choice: une fois vendu
  rationale: Cette tournure française naturelle conserve le sens passif et l’antériorité du participe aoriste.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: l’argent obtenu n’était-il pas à ta disposition
  rationale: ἐξουσία désigne ici le droit réel d’en disposer. Le contexte de la vente indique que ce contrôle porte désormais sur la somme obtenue ; « à ta disposition » communique ce point sans suggérer une contrainte à tout donner.
- source_word: τί ὅτι
  choice: Pourquoi
  rationale: Dans cette question de reproche, « Pourquoi » rend directement et naturellement la force de l’idiome grec.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο
  choice: as-tu décidé dans ton cœur d’agir ainsi
  rationale: L’expression grecque évoque une résolution intérieure. Cette formulation actuelle conserve le langage du cœur, tout en évitant le calque peu naturel « mettre cette chose dans ton cœur ».
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Ce n’est pas à des êtres humains que tu as menti, mais à Dieu
  rationale: « Des êtres humains » restitue le pluriel générique ἀνθρώποις sans ambiguïté de genre, et la construction contrastive conserve l’opposition rhétorique avec Dieu.
theological_decisions:
- issue: Rapport entre le Saint-Esprit en Actes 5.3 et Dieu en Actes 5.4
  choice: Traduire simplement « à Dieu »
  alternative: Ajouter « c’est-à-dire au Saint-Esprit »
  rationale: Le verset dit explicitement « à Dieu ». Le lien avec le Saint-Esprit ressort du contexte immédiat, mais ne doit pas être ajouté au texte du verset.
- issue: Liberté d’Ananias à l’égard du bien et du prix de vente
  choice: Employer « t’appartenait » puis « à ta disposition »
  alternative: Employer une formulation laissant entendre que la remise intégrale était obligatoire
  rationale: L’argument de Pierre souligne qu’Ananias gardait le droit de conserver le bien ou de disposer de l’argent ; la faute dénoncée est le mensonge, non le simple fait de ne pas tout donner.
- issue: Portée de la négation dans « non pas aux humains, mais à Dieu »
  choice: Conserver le contraste rhétorique sans ajouter « seulement »
  alternative: Traduire « tu n’as pas menti seulement aux êtres humains, mais à Dieu »
  rationale: Le grec présente une opposition forte dont la portée exacte peut être rhétorique. L’ajout de « seulement » expliciterait une interprétation plausible, mais absente de la forme du texte.
translation_notes:
  register: Français international moderne, clair et digne. Les questions gardent le ton direct du reproche de Pierre. « Des êtres humains » évite l’emploi générique potentiellement ambigu de « hommes », tandis que « dans ton cœur » conserve l’image anthropologique du grec.
