  variant: modern international French
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: fr
  text: 'Mais un ange du Seigneur ouvrit les portes de la prison pendant la nuit, les fit sortir et dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: un ange
  rationale: Le nom sans article est naturellement rendu par l’indéfini « un ange »; dans ce contexte d’intervention surnaturelle, il désigne un être céleste plutôt qu’un messager humain.
- source_word: κυρίου
  choice: du Seigneur
  rationale: « Seigneur » est le rendu biblique établi de κύριος et conserve l’expression traditionnelle « un ange du Seigneur ».
- source_word: διὰ νυκτός
  choice: pendant la nuit
  rationale: La construction avec διά et le génitif a ici une valeur temporelle; « pendant la nuit » est clair, naturel et précis.
- source_word: ἤνοιξε
  choice: ouvrit
  rationale: Le verbe signifie simplement « ouvrir »; « déverrouilla » ajouterait un détail absent du grec.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: les portes de la prison
  rationale: Ce rendu transparent conserve le pluriel θύρας et le sens de φυλακή dans ce contexte.
- source_word: ἐξαγαγών
  choice: les fit sortir
  rationale: Le participe de ἐξάγω exprime le fait de faire sortir les apôtres; cette formulation française est naturelle et n’ajoute pas l’idée plus précise de les guider.
- source_word: τε
  choice: et
  rationale: La particule relie ici l’action participiale au verbe principal; une simple coordination par « et » convient en français.
- source_word: εἶπεν
  choice: dit
  rationale: Dans ce récit, l’aoriste de λέγω se rend naturellement par « dit » et introduit les paroles du verset suivant.
theological_decisions:
- issue: Nature de ἄγγελος dans le contexte
  choice: être angélique céleste (« un ange »)
  alternative: messager humain
  rationale: L’ouverture surnaturelle des portes et la libération des prisonniers indiquent fortement un être angélique; traduire par « messager » obscurcirait ce sens contextuel.
- issue: Rendu de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve l’expression biblique reconnue « ange du Seigneur » sans préciser davantage l’identité du référent que ne le fait le texte grec.
translation_notes:
  register: Français international moderne, digne et fluide. Le passé simple convient au registre narratif biblique écrit. Aucun ajout explicatif ni note n’est nécessaire.
