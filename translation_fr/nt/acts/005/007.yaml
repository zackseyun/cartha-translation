  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: fr
  text: Environ trois heures plus tard, sa femme entra, sans savoir ce qui s’était passé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: plus tard
  rationale: La formule introduit la suite du récit avec une légère articulation narrative. En français, la progression est naturellement portée par l’expression temporelle, sans ajouter un « alors » ou un « or » qui alourdirait la phrase.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: Environ trois heures plus tard
  rationale: ὡς marque ici l’approximation et διάστημα une durée écoulée. Cette formulation française rend clairement et naturellement l’intervalle d’environ trois heures.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: sa femme
  rationale: Dans ce contexte, γυνή désigne l’épouse d’Ananias; « sa femme » est la désignation française courante et non ambiguë.
- source_word: μὴ εἰδυῖα
  choice: sans savoir
  rationale: Le participe décrit l’ignorance de la femme au moment de son entrée. « Sans savoir » conserve cette simultanéité dans un français naturel.
- source_word: τὸ γεγονὸς
  choice: ce qui s’était passé
  rationale: Le participe parfait substantivé renvoie à l’événement déjà survenu. Le plus-que-parfait exprime clairement son antériorité par rapport à l’entrée.
- source_word: εἰσῆλθεν
  choice: entra
  rationale: Le verbe signifie entrer dans le lieu de la scène. Le passé simple convient au registre narratif biblique tout en restant clair et digne.
