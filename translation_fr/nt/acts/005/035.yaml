source:
  edition: SBLGNT
  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: fr
  text: 'Il leur dit alors : « Hommes d’Israël, prenez garde à ce que vous allez faire à l’égard de ces hommes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prenez garde à vous-mêmes au sujet de ce que vous allez faire à l’égard de ces hommes ».'
    reason: Alternative plus littérale qui fait ressortir le datif réfléchi ἑαυτοῖς, tout en conservant l’interrogative indirecte du grec.
lexical_decisions:
- source_word: εἶπέν τε
  choice: Puis il leur dit
  rationale: τέ relie légèrement cette parole au récit précédent. « Puis » exprime naturellement cette continuité narrative sans lui donner une valeur logique trop forte.
- source_word: πρὸς αὐτούς
  choice: il leur dit
  rationale: Avec λέγω, πρός suivi de l’accusatif désigne les destinataires. Le pronom français « leur » rend cette construction de façon idiomatique.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hommes d’Israël
  rationale: Cette formule vocative solennelle et masculine est caractéristique des discours des Actes. « Hommes d’Israël » en conserve la forme tout en restant compréhensible en français moderne.
- source_word: προσέχετε ἑαυτοῖς
  choice: prenez garde
  rationale: L’impératif accompagné du datif réfléchi appelle les auditeurs à la prudence et à la vigilance quant à leur propre conduite. « Prenez garde » conserve la force de l’avertissement avec un registre digne et courant.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: à ces hommes
  rationale: ἐπί avec le datif indique ici les personnes visées par l’action envisagée. En français, « ce que vous allez faire à ces hommes » exprime naturellement ce rapport sans introduire explicitement l’idée plus interprétative d’une action hostile.
- source_word: τί μέλλετε πράσσειν
  choice: ce que vous allez faire
  rationale: μέλλω suivi de l’infinitif exprime ici une action projetée ou imminente. « Vous allez faire » préserve cette orientation vers l’avenir et s’intègre naturellement à l’avertissement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Hommes d’Israël » conserve la solennité de l’adresse grecque; « prenez garde » maintient le ton ferme de l’avertissement sans archaïsme excessif.
