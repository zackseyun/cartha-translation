id: ACT.5.5
reference: Acts 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: fr
  text: Mais quand Ananias entendit ces paroles, il tomba et expira[a]. Une grande crainte saisit tous ceux qui l’apprirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendit son dernier souffle »; autrement dit, il mourut.'
    reason: Alternative lexicale explicitant l’image portée par ἐξέψυξεν.
lexical_decisions:
- source_word: ἀκούων
  choice: quand … entendit
  rationale: Le participe présent a ici une valeur temporelle; cette tournure française exprime naturellement le lien immédiat entre l’écoute des paroles et la chute.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque une transition narrative avec une légère opposition, bien rendue ici par « Mais ».
- source_word: λόγους τούτους
  choice: ces paroles
  rationale: Dans le contexte, λόγοι désigne les paroles que Pierre vient de prononcer.
- source_word: πεσὼν
  choice: il tomba
  rationale: Cette formulation conserve l’image physique du texte grec sans interpréter la chute comme un simple malaise.
- source_word: ἐξέψυξεν
  choice: expira
  rationale: Le verbe évoque littéralement le fait de rendre le dernier souffle. « Expira » est digne, compréhensible et plus proche de cette image que le simple « mourut ».
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: une grande crainte saisit
  rationale: Cette expression idiomatique française rend naturellement la survenue soudaine d’une forte crainte.
- source_word: πάντας τοὺς ἀκούοντας
  choice: tous ceux qui l’apprirent
  rationale: Le participe substantivé peut viser ceux qui entendirent parler de l’événement. « L’apprirent » évite de laisser entendre que tous étaient nécessairement présents et conserve l’absence d’objet explicite dans le grec.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Le nom propre suit sa forme française traditionnelle et largement reconnue.
theological_decisions:
- issue: Nature de la mort d’Ananias
  choice: Présenter directement sa chute et sa mort, sans préciser leur mécanisme.
  alternative: Dire que Dieu le frappa de mort, ou qu’il mourut naturellement sous le choc.
  rationale: Le grec rapporte qu’il tomba et expira, mais n’explicite pas le mécanisme de sa mort. La traduction préserve donc cette réserve narrative.
translation_notes:
  register: Français international moderne, naturel et digne. « Crainte » conserve la force et l’éventuelle dimension religieuse de φόβος; « peur » serait plus courant mais légèrement plus réducteur. Le pronom élidé de « l’apprirent » renvoie à l’événement rapporté.
