  source_fidelity: 'Le texte rend fidèlement la progression grecque : valeur temporelle de ἀκούων (« quand ... entendit »), chute suivie de la mort, puis survenue d’une grande crainte. « Il tomba et expira » conserve l’image narrative sans attribuer de cause explicite à la mort. « Tous ceux qui l’apprirent » rend de façon idiomatique le participe substantivé τοὺς ἀκούοντας, dont l’objet demeure implicite dans le grec.'
  naturalness: Français international naturel, clair et de registre narratif soutenu sans être archaïque. « Une grande crainte saisit » est fluide et correspond bien à la force de la construction grecque. « Expira » est compréhensible dans ce contexte et convient au ton du récit.
