id: ACT.5.20
reference: Acts 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: fr
  text: « Allez vous tenir dans le Temple[a] et dites au peuple toutes les paroles de cette vie[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les cours du Temple » ou « dans l’enceinte du Temple » ; le grec désigne l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sujet de cette vie » ou « de cette manière de vivre ». L’expression peut désigner la vie annoncée dans l’Évangile.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε καὶ σταθέντες
  choice: Allez vous tenir
  rationale: Cette tournure française naturelle rend le déplacement commandé par Πορεύεσθε et traite le participe aoriste σταθέντες comme une circonstance accompagnant l’impératif principal, sans l’alourdir par « vous étant tenus ».
- source_word: λαλεῖτε
  choice: dites
  rationale: Le présent impératif demande de parler au peuple. « Dites » convient naturellement avec le complément « toutes les paroles » et n’ajoute pas la nuance plus technique de « proclamez ».
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur. « Dans le Temple » est une formulation française concise et courante; la portée architecturale est précisée en note.
- source_word: τῷ λαῷ
  choice: au peuple
  rationale: Rend directement λαός sans préciser au-delà du texte s’il s’agit de la foule présente ou, plus largement, du peuple d’Israël.
- source_word: πάντα τὰ ῥήματα
  choice: toutes les paroles
  rationale: Cette traduction conserve explicitement la totalité exprimée par πάντα et le terme concret ῥήματα, plutôt que de les fondre dans « tout le message ».
- source_word: τῆς ζωῆς ταύτης
  choice: de cette vie
  rationale: 'La construction génitive reste compacte et ambiguë comme en grec: elle peut désigner la vie annoncée, la vie nouvelle liée à l’Évangile ou, par extension, le message qui donne la vie.'
theological_decisions:
- issue: Sens de τῆς ζωῆς ταύτης (« de cette vie »)
  choice: Conserver l’expression ouverte « de cette vie ».
  alternative: « au sujet de cette vie », « de cette manière de vivre » ou « du message qui donne la vie »
  rationale: Le contexte associe vraisemblablement cette vie au salut annoncé par les apôtres, mais le grec ne définit pas plus précisément le rapport entre les « paroles » et la « vie ». La traduction préserve donc cette richesse et cette tension au lieu d’imposer une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Temple » identifie clairement le Temple de Jérusalem. La formulation « allez vous tenir » restitue naturellement la séquence grecque, tandis que « toutes les paroles de cette vie » en conserve la densité et l’ambiguïté.
