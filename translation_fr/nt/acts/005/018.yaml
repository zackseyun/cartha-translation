  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: fr
  text: Ils arrêtèrent les apôtres et les placèrent dans la prison publique[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en détention publique ». L’expression grecque peut désigner plus généralement la garde ou la détention, et pas seulement un bâtiment carcéral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: mirent la main sur
  rationale: Cette expression française conserve l’image de l’idiome grec tout en exprimant naturellement une appréhension hostile dans ce contexte; la détention mentionnée ensuite en précise la portée.
- source_word: ἀποστόλους
  choice: apôtres
  rationale: Dans les Actes, le terme désigne les envoyés mandatés de Jésus et fonctionne comme une désignation reconnue, plutôt que comme le simple nom générique « messagers ».
- source_word: ἔθεντο
  choice: placèrent
  rationale: Rend directement τίθημι dans ce contexte et s’emploie naturellement avec « en détention ».
- source_word: ἐν τηρήσει
  choice: en détention
  rationale: τήρησις peut désigner la garde, la détention ou le lieu de confinement. « En détention » préserve cette amplitude sans imposer l’idée précise d’un bâtiment carcéral.
- source_word: δημοσίᾳ
  choice: publique
  rationale: L’adjectif s’accorde avec τηρήσει et indique vraisemblablement une détention publique ou commune, sous l’autorité officielle. « Publique » conserve le qualificatif sans le préciser excessivement comme « prison d’État ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’expression « mirent la main sur » préserve l’idiome grec sans suggérer ici une bénédiction ou une investiture; le contexte immédiat indique une arrestation. « Détention publique » conserve l’ambiguïté entre l’état de garde et un lieu public de confinement.
