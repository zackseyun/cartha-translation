id: ACT.5.1
reference: Acts 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: fr
  text: Mais un homme nommé Ananias vendit, avec sa femme Saphira, une propriété[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bien » ou « une possession » ; le terme grec peut désigner largement ce que quelqu’un possède, notamment un bien immobilier.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Mais un homme
  rationale: Ἀνήρ introduit ici un personnage masculin, tandis que τις a une valeur indéfinie naturellement rendue par l’article. δέ marque le contraste avec l’exemple positif de Barnabas qui précède.
- source_word: Ἁνανίας ὀνόματι
  choice: nommé Ananias
  rationale: ὀνόματι forme ici l’expression idiomatique « nommé » ou « du nom de ». « Ananias » suit la forme française traditionnelle du nom.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: avec sa femme Saphira
  rationale: σύν indique l’accompagnement ou la participation conjointe. γυνή désigne clairement l’épouse dans cette construction possessive. « Saphira » est la forme française usuelle du nom.
- source_word: ἐπώλησεν
  choice: vendit
  rationale: L’aoriste indicatif de πωλέω rapporte simplement un événement passé dans le récit. Le passé simple convient au registre narratif biblique en français moderne soutenu.
- source_word: κτῆμα
  choice: une propriété
  rationale: Le terme désigne un bien ou une possession et, dans le contexte immédiat des ventes de terres et de maisons, « une propriété » rend naturellement le sens sans préciser indûment sa nature exacte.
theological_decisions:
- issue: Contraste narratif avec Barnabas
  choice: Traduire δέ par « Mais »
  alternative: « Or » ou « Et »
  rationale: Le contexte oppose l’acte de Barnabas au comportement trompeur d’Ananias et de Saphira. « Mais » conserve ce contraste discursif sans expliciter davantage leur faute avant que le récit ne le fasse.
translation_notes:
  register: Français international actuel, clair et digne. La phrase garde le contraste initial et présente Saphira comme participant à la vente, sans anticiper les précisions des versets suivants.
