id: ACT.19.4
reference: Acts 19:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: fr
  text: 'Paul dit : « Jean a baptisé d’un baptême de repentance[a], en disant au peuple de croire en celui qui venait après lui, c’est-à-dire en Jésus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Jean a baptisé un baptême de repentance ».'
    reason: La note signale la construction apparentée du grec, difficile à reproduire telle quelle en français courant.
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: a baptisé d’un baptême de repentance
  rationale: Conserve la construction apparentée du grec tout en employant une tournure française naturelle. « Repentance » exprime le caractère de ce baptême sans préciser davantage son effet.
- source_word: τῷ λαῷ
  choice: au peuple
  rationale: Rend le collectif λαός sans l’identifier explicitement à Israël, précision absente de cette proposition.
- source_word: λέγων
  choice: en disant
  rationale: Le participe accompagne l’acte de baptiser et introduit le contenu de la proclamation de Jean.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: en celui qui venait après lui
  rationale: Avec πιστεύω, εἰς désigne naturellement l’objet de la foi. L’imparfait « venait » situe l’attente dans le cadre passé du ministère de Jean, tandis que « après lui » exprime la succession.
- source_word: ἵνα πιστεύσωσιν
  choice: de croire
  rationale: Après un verbe de parole, cette formulation française rend naturellement l’exhortation ou la visée exprimée par ἵνα.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Formule explicative courante qui identifie celui qui venait après Jean.
- source_word: εἰς τὸν Ἰησοῦν
  choice: en Jésus
  rationale: Le verbe « croire » reste sous-entendu depuis la proposition précédente. Aucun titre tel que « Christ » ou « Messie » n’est ajouté au nom présent dans le grec.
theological_decisions:
- issue: Rapport entre le baptême de Jean et la foi en Jésus
  choice: Le baptême de Jean est qualifié de baptême de repentance et s’accompagne d’un appel à croire en celui qui venait après lui, identifié comme Jésus.
  alternative: Comprendre que le baptême de Jean produisait lui-même la foi chrétienne, ou laisser le personnage à venir non identifié.
  rationale: La syntaxe distingue le baptême pratiqué par Jean du message qu’il adressait au peuple. La dernière proposition identifie explicitement celui qui venait comme Jésus, sans développer l’efficacité doctrinale du baptême de Jean.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve le vocabulaire biblique établi de « repentance » et évite d’ajouter une interprétation confessionnelle.
