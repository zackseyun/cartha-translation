id: ACT.19.36
reference: Acts 19:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: fr
  text: Puisque ces faits sont donc incontestables, vous devez garder votre calme et ne rien faire de précipité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: incontestables
  rationale: L’adjectif désigne ce qui ne peut être contredit ou raisonnablement contesté. « Incontestables » est naturel et conserve la force de l’expression.
- source_word: οὖν
  choice: donc
  rationale: Marque la conclusion tirée de l’argument précédent; placé après le groupe causal, « donc » rend naturellement ce lien logique en français.
- source_word: ὄντων τούτων
  choice: puisque ces faits sont
  rationale: Le génitif absolu exprime ici le fondement de l’exhortation. « Puisque » restitue cette nuance causale, et « ces faits » renvoie clairement aux affirmations précédentes.
- source_word: δέον ἐστίν
  choice: vous devez
  rationale: L’expression impersonnelle indique une nécessité ou une obligation. La tournure personnelle « vous devez » est idiomatique en français et conserve cette force.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: garder votre calme
  rationale: La construction décrit un état durable d’apaisement ou de maîtrise de soi. « Garder votre calme » convient au contexte d’une foule agitée sans réduire le sens au seul silence.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: ne rien faire de précipité
  rationale: προπετής qualifie une action impulsive, irréfléchie ou hâtive. « Ne rien faire de précipité » rend clairement l’avertissement sans ajouter l’idée plus forte de témérité.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve à la fois le raisonnement causal du secrétaire de la ville et son exhortation ferme, sans lourdeur littérale.
