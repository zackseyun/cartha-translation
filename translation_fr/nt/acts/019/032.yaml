id: ACT.19.32
reference: Acts 19:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: fr
  text: Les uns criaient donc une chose, les autres une autre, car l’assemblée[a] était dans la confusion, et la plupart ne savaient pas pourquoi ils s’étaient réunis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rassemblement » ou « foule ». Le mot grec est ἐκκλησία ; il désigne ici une assemblée civique, et non l’Église.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: Les uns criaient donc une chose, les autres une autre
  rationale: La tournure distributive ἄλλοι… ἄλλο τι oppose les cris des différents groupes. L’imparfait « criaient » rend l’action bruyante en cours, tandis que « donc » exprime naturellement μὲν οὖν dans l’enchaînement narratif.
- source_word: ἐκκλησία
  choice: assemblée
  rationale: Dans ce contexte civique et tumultueux, le terme désigne les personnes rassemblées, non l’Église chrétienne. « Assemblée » conserve la valeur lexicale sans imposer un sens ecclésial.
- source_word: συγκεχυμένη
  choice: était dans la confusion
  rationale: Le participe parfait décrit l’état de confusion résultant de l’agitation. Cette formulation française rend clairement cet état collectif.
- source_word: οἱ πλείους
  choice: la plupart
  rationale: Le comparatif substantivé signifie ici « la majorité » des personnes présentes. « La plupart » est naturel et renvoie clairement aux membres de l’assemblée.
- source_word: τίνος ἕνεκα
  choice: pourquoi
  rationale: Cette expression idiomatique signifie « pour quelle raison » ; « pourquoi » en est l’équivalent français le plus direct.
- source_word: συνεληλύθεισαν
  choice: ils s’étaient réunis
  rationale: Le plus-que-parfait grec présente le rassemblement comme antérieur à la scène décrite. Le plus-que-parfait français préserve ce rapport temporel, et « se réunir » rend naturellement συνέρχομαι.
theological_decisions:
- issue: Sens de ἐκκλησία dans ce récit
  choice: assemblée au sens civique ou public
  alternative: Église
  rationale: Le contexte décrit une réunion tumultueuse à Éphèse, composée en grande partie de personnes ignorant le motif du rassemblement. Le sens ecclésial ne convient donc pas ici.
translation_notes:
  register: Français international moderne, clair et digne. La répétition équilibrée « les uns… les autres… » reproduit le contraste et l’agitation du grec sans lourdeur. Le marqueur de note est placé directement après « assemblée », terme qu’il précise.
