id: ACT.19.12
reference: Acts 19:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: fr
  text: si bien qu’on emportait même de son corps[a] des mouchoirs ou des tabliers de travail[b] pour les porter aux malades ; les maladies les quittaient et les esprits mauvais sortaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de sa peau », c’est-à-dire de la surface de son corps.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne des tabliers ou d’autres pièces d’étoffe portées pour le travail.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit ici le résultat des miracles extraordinaires mentionnés au verset précédent, avec une tournure française naturelle.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: pour les porter aux malades
  rationale: Rend clairement la destination des objets et la valeur directionnelle de ἐπί dans ce contexte.
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: on emportait de dessus sa peau
  rationale: Conserve le mouvement d’éloignement exprimé par ἀπό et le sens concret de χρώς, tout en restant compréhensible en français.
- source_word: σουδάρια
  choice: mouchoirs
  rationale: Désigne de petites pièces d’étoffe servant notamment à essuyer le visage ou la transpiration ; « mouchoirs » est l’équivalent courant le plus proche.
- source_word: σιμικίνθια
  choice: tabliers de travail
  rationale: Le terme désigne des tabliers ou vêtements portés lors d’un travail manuel ; la précision « de travail » explicite cette fonction sans surinterpréter.
- source_word: ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους
  choice: les maladies les quittaient
  rationale: Préserve la construction où les maladies sont le sujet et les malades le référent du pronom.
- source_word: τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι
  choice: les esprits mauvais sortaient
  rationale: Rend directement la sortie des esprits hostiles sans préciser au-delà de ce qu’affirme le texte.
theological_decisions:
- issue: Nature des guérisons et des expulsions d’esprits associées aux étoffes venant de Paul
  choice: Rapporter simplement l’événement surnaturel tel que Luc le présente.
  alternative: Faire de ces objets des reliques dotées d’un pouvoir propre, ou réduire le récit à un geste purement symbolique.
  rationale: Le texte décrit les effets constatés sans expliquer leur mécanisme ni établir une pratique religieuse générale ; la traduction ne doit ni ajouter une doctrine des reliques ni atténuer le caractère miraculeux du récit.
translation_notes:
  register: Français international moderne, courant et digne. « Si bien que » marque naturellement la conséquence ; « de dessus sa peau » garde le relief concret du grec malgré une légère étrangeté voulue. Le récit reste descriptif et n’ajoute aucune explication doctrinale.
