id: ACT.19.8
reference: Acts 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: fr
  text: Il entra dans la synagogue et, pendant trois mois, il parla avec assurance, raisonnant avec ses auditeurs et cherchant à les persuader au sujet du royaume de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du règne de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθὼν
  choice: Il entra
  rationale: Le participe aoriste introduit l’action qui précède et encadre le verbe principal. Une proposition conjuguée est plus naturelle en français tout en conservant la progression du récit.
- source_word: δὲ
  choice: et
  rationale: La particule assure ici une transition narrative légère; « et » rend ce lien sans lui donner une force adversative absente du contexte.
- source_word: συναγωγήν
  choice: synagogue
  rationale: Le mot désigne précisément le lieu de réunion juif; le terme français consacré est clair et exact.
- source_word: ἐπαρρησιάζετο
  choice: il parla avec assurance
  rationale: L’imparfait grec décrit une prise de parole libre, ouverte et courageuse qui se prolonge. Le complément temporel « pendant trois mois » rend nettement cette durée en français.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: pendant trois mois
  rationale: ἐπί avec l’accusatif exprime ici une durée.
- source_word: διαλεγόμενος
  choice: raisonnant avec ses auditeurs
  rationale: Le participe évoque un échange argumenté fait d’explications et de raisonnement. « Avec ses auditeurs » explicite naturellement en français les interlocuteurs implicites dans la scène.
- source_word: πείθων
  choice: cherchant à les persuader
  rationale: Le participe décrit l’activité persuasive de Paul sans nécessairement affirmer que tous ses interlocuteurs ont effectivement été convaincus.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: au sujet du royaume de Dieu
  rationale: περί avec le génitif signifie « au sujet de ». « Royaume de Dieu » conserve l’expression biblique reconnue, tandis qu’une note signale la nuance possible de règne ou de souveraineté.
theological_decisions:
- issue: Le complément de πείθων est implicite en grec.
  choice: les persuader
  alternative: persuader, sans complément exprimé
  rationale: Le français appelle normalement un complément avec « persuader ». Le pronom « les » renvoie sans ambiguïté aux personnes présentes dans la synagogue et n’ajoute aucun nouveau groupe au récit.
- issue: La portée de πείθων entre action persuasive et résultat obtenu
  choice: cherchant à les persuader
  alternative: les persuadant
  rationale: Cette formulation met en avant l’entreprise de persuasion sans conclure que tous ont été convaincus; elle préserve ainsi une nuance réellement ouverte dans le participe grec.
- issue: Sens de βασιλεία τοῦ θεοῦ
  choice: royaume de Dieu
  alternative: règne de Dieu
  rationale: « Royaume de Dieu » est exact, reconnaissable et cohérent avec l’expression néotestamentaire. La note conserve la possibilité sémantique d’un accent sur l’exercice de la souveraineté divine.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la continuité narrative et l’action prolongée, tout en évitant un tour participial trop lourd. « Raisonnant » maintient la dimension argumentée de l’échange sans lui donner une tonalité inutilement conflictuelle.
