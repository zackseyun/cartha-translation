  source_fidelity: Le texte rend fidèlement la question εἰ...ἐλάβετε πιστεύσαντες par « Avez-vous reçu... quand vous avez cru ? », sans imposer une chronologie théologique plus précise. La réponse conserve bien l’intensification de ἀλλ’ οὐδέ (« Non, nous n’avons même pas... ») et l’ambiguïté de οὐδὲ εἰ... ἠκούσαμεν. « Entendu dire qu’il y ait un Esprit Saint » est une formulation française idiomatique qui correspond au sens de « have not even heard that/whether there is a Holy Spirit ».
