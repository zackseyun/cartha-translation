id: ACT.19.2
reference: Acts 19:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: fr
  text: 'Il leur dit : « Avez-vous reçu l’Esprit Saint quand vous avez cru[a] ? » Ils lui répondirent : « Non, nous n’avons même pas entendu dire qu’il y ait un Esprit Saint[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir cru ». Le participe grec peut exprimer une nuance temporelle légèrement différente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous n’avons même pas entendu dire s’il y a un Esprit Saint » ; de manière plus interprétative : « nous n’avons même pas entendu dire que l’Esprit Saint a été donné ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: Il leur dit
  rationale: Le verbe λέγω signifie simplement « dire ». La particule τε relie légèrement cette phrase au récit précédent ; en français, l’enchaînement narratif suffit sans qu’il soit nécessaire de la traduire explicitement.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: Avez-vous reçu ... quand vous avez cru ?
  rationale: Le participe aoriste πιστεύσαντες entretient avec ἐλάβετε un rapport temporel que « quand vous avez cru » rend sans imposer une succession stricte ni une simultanéité précise.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit Saint
  rationale: Dans la question, l’expression désigne l’Esprit Saint de Dieu. L’article défini et les majuscules correspondent à l’usage français naturel dans ce contexte.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: Ils lui répondirent
  rationale: Le verbe de parole est sous-entendu en grec et se restitue naturellement en français. « Répondirent » explicite seulement la fonction dialogique de la proposition, tandis que δέ assure la transition.
- source_word: Ἀλλ’ οὐδ’
  choice: Non, ... même pas
  rationale: Cette formulation française naturelle conserve la force de la négation renforcée du grec.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: nous n’avons même pas entendu dire qu’il y ait un Esprit Saint
  rationale: La tournure conserve le caractère surprenant et littéral de leur ignorance. Le subjonctif après la négation est idiomatique en français et ne tranche pas entre l’existence de l’Esprit et la connaissance de sa manifestation ou de son don.
theological_decisions:
- issue: Rapport temporel entre la foi et la réception de l’Esprit Saint
  choice: « quand vous avez cru »
  alternative: « après avoir cru » ; « au moment où vous avez cru »
  rationale: Le participe πιστεύσαντες situe la foi par rapport à la réception sans définir à lui seul une doctrine précise de succession ou de simultanéité. Le texte principal préserve cette souplesse et la note signale l’autre nuance possible.
- issue: Sens de l’ignorance des disciples au sujet de l’Esprit Saint
  choice: « nous n’avons même pas entendu dire qu’il y ait un Esprit Saint »
  alternative: « nous n’avons même pas entendu dire s’il y a un Esprit Saint » ; « nous n’avons même pas entendu dire que l’Esprit Saint a été donné »
  rationale: Le grec est concis et peut porter sur l’existence ou la présence connue de l’Esprit. La traduction principale suit sa forme la plus directe sans ajouter explicitement l’idée du don, tandis que la note conserve les principales possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation garde les ambiguïtés temporelle et théologique du grec, avec des notes brèves et accessibles.
