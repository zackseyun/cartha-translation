id: ACT.19.16
reference: Acts 19:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: fr
  text: Alors l’homme dans lequel se trouvait l’esprit mauvais se jeta sur eux[a]. Après avoir maîtrisé tous les deux[b], il fut plus fort qu’eux, si bien qu’ils s’enfuirent de cette maison, nus et blessés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bondit sur eux ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit explicitement « tous les deux », bien que le contexte plus large mentionne les sept fils de Scéva.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: se jeta sur eux
  rationale: Le participe décrit une attaque physique soudaine, comme un bond sur les adversaires. « Se jeta sur eux » est vif, naturel en français et conserve la violence du mouvement.
- source_word: ὁ ἄνθρωπος
  choice: l’homme
  rationale: Le nom est masculin singulier et désigne ici l’homme habité par l’esprit mauvais.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: dans lequel se trouvait l’esprit mauvais
  rationale: Cette formulation reste proche de la relation spatiale exprimée en grec sans introduire le terme technique « possédé ».
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: l’esprit mauvais
  rationale: « Esprit mauvais » rend clairement πονηρόν dans ce contexte d’exorcisme et correspond à un usage biblique français courant.
- source_word: κατακυριεύσας
  choice: après avoir maîtrisé
  rationale: Le verbe exprime la prise de domination. La tournure temporelle rend clairement la succession des actions sans confondre ce participe avec ἴσχυσεν.
- source_word: ἀμφοτέρων
  choice: tous les deux
  rationale: Le grec désigne explicitement deux personnes. La traduction conserve ce détail malgré la tension avec le contexte plus large.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: il fut plus fort qu’eux
  rationale: Cette expression rend directement l’idée qu’il l’emporta en force sur eux tout en restant distincte de l’action précédente, « maîtrisé ».
- source_word: γυμνούς
  choice: nus
  rationale: Le grec décrit sans détour leur état à la sortie de la maison.
- source_word: τετραυματισμένους
  choice: blessés
  rationale: Le participe parfait indique qu’ils avaient été blessés et demeuraient dans cet état. « Blessés » le rend avec concision.
- source_word: ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου
  choice: ils s’enfuirent de cette maison
  rationale: La proposition de résultat exprime leur fuite hors de la maison. Cette formulation est idiomatique en français et conserve le mouvement d’éloignement.
theological_decisions:
- issue: Formulation de la présence de l’esprit mauvais dans l’homme
  choice: l’homme dans lequel se trouvait l’esprit mauvais
  alternative: l’homme possédé par l’esprit mauvais
  rationale: Le grec affirme que l’esprit se trouvait dans l’homme. La traduction conserve cette formulation sans imposer une terminologie technique ultérieure.
- issue: Portée de ἀμφοτέρων par rapport au groupe mentionné dans le contexte
  choice: tous les deux
  alternative: tous
  rationale: Le texte grec emploie explicitement ἀμφοτέρων, « tous les deux ». La traduction maintient cette donnée et laisse irrésolue sa tension avec la mention contextuelle des sept fils de Scéva.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est divisée en deux pour éviter une structure participiale lourde. Le vocabulaire demeure concret et accessible, tandis que la tension numérique du grec est préservée et signalée en note.
