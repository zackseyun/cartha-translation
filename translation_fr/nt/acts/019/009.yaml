id: ACT.19.9
reference: Acts 19:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: fr
  text: Mais comme certains s’endurcissaient et refusaient de se laisser convaincre[a], disant du mal de la Voie[b] devant la foule, Paul se retira d’eux et mit les disciples à part. Chaque jour, il discutait dans la salle de cours[c] de Tyrannus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « désobéissaient » ou « ne croyaient pas ».'
    reason: lexical_alternative
  - marker: b
    text: « La Voie » était l’une des premières désignations du mouvement chrétien dans les Actes.
    reason: cultural_note
  - marker: c
    text: 'Ou : « l’école de Tyrannus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: s’endurcissaient
  rationale: L’imparfait exprime un processus ou un état persistant de durcissement; la forme pronominale française préserve l’ambiguïté quant à l’agent.
- source_word: ἠπείθουν
  choice: refusaient de se laisser convaincre
  rationale: ἀπειθέω peut évoquer l’incrédulité ou la désobéissance. Ici, cette formulation rend la résistance volontaire au message tout en conservant l’idée de refus de persuasion.
- source_word: κακολογοῦντες
  choice: disant du mal de
  rationale: Cette expression naturelle couvre la dénonciation hostile en public sans imposer le sens juridique plus étroit de « calomnier ».
- source_word: τὴν ὁδὸν
  choice: la Voie
  rationale: Dans les Actes, l’expression sert de désignation reconnaissable du mouvement chrétien; la majuscule signale cet emploi sans l’expliciter dans le corps du texte.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: devant la foule
  rationale: Rend simplement et directement le caractère public de l’opposition.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: se retira d’eux
  rationale: Exprime la rupture décisive marquée par le participe aoriste, sans préciser davantage s’il s’agit seulement d’un déplacement ou aussi d’une séparation relationnelle.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: mit les disciples à part
  rationale: Rend la séparation délibérée des disciples d’avec le groupe hostile dans un français courant, sans suggérer seulement un déplacement spatial.
- source_word: καθ’ ἡμέραν
  choice: Chaque jour
  rationale: Exprime clairement la régularité quotidienne de l’activité.
- source_word: διαλεγόμενος
  choice: discutait avec eux
  rationale: Le verbe désigne ici un échange raisonné et persuasif. « Discutait » est naturel en français moderne et n’implique pas nécessairement une querelle.
- source_word: σχολῇ
  choice: salle de cours
  rationale: Dans ce contexte, le terme désigne vraisemblablement un lieu d’enseignement; « salle de cours » évite l’image anachronique d’un établissement scolaire moderne.
- source_word: Τυράννου
  choice: Tyrannus
  rationale: Le nom propre est rendu selon sa forme française traditionnelle, et le génitif par « de ».
theological_decisions:
- issue: Emploi de « la Voie » comme désignation du mouvement chrétien
  choice: « la Voie » avec une majuscule
  alternative: « la voie » comme chemin ou enseignement au sens générique
  rationale: Dans les Actes, l’expression fonctionne comme une désignation reconnue du mouvement lié à Jésus. La majuscule aide le lecteur moderne à percevoir cet emploi tout en laissant la note fournir le contexte historique.
- issue: Portée de ἠπείθουν
  choice: « refusaient de se laisser convaincre »
  alternative: « désobéissaient » ou « ne croyaient pas »
  rationale: Le verbe grec peut associer incrédulité et refus d’obéir. La traduction retenue préserve la dimension volontaire de leur résistance sans réduire le terme à une seule catégorie théologique.
translation_notes:
  register: Français international moderne, clair et digne. Les deux phrases évitent un participe présent lourd et rendent naturelle la progression du récit. Le nom « Paul », implicite dans le verbe grec mais explicite dans le contexte immédiat, est repris pour éviter une ambiguïté pronominale en français.
