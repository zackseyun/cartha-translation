source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: fr
  text: 'Quand ils entendirent cela et furent remplis de fureur[a], ils criaient : « Grande est l’Artémis des Éphésiens ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remplis de colère », « remplis de rage » ou « devinrent furieux ». L’expression grecque signifie littéralement « devenus pleins de θυμός », terme qui désigne ici une colère intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Quand ils entendirent cela
  rationale: Le participe aoriste exprime la circonstance antérieure à l’action principale. « Cela » explicite sobrement l’objet sous-entendu par le contexte.
- source_word: δὲ
  choice: et
  rationale: δέ est ici un connecteur léger, sans opposition marquée ; « et » maintient l’enchaînement naturel.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: furent remplis de fureur
  rationale: Cette formulation conserve l’image de la plénitude tout en exprimant naturellement l’intensité de θυμός en français.
- source_word: ἔκραζον λέγοντες
  choice: ils se mirent à crier
  rationale: L’imparfait grec présente une clameur en cours. La tournure française marque le déclenchement de cette action prolongée, tandis que les paroles citées rendent λέγοντες sans le lourd « en disant ».
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Grande est l’Artémis des Éphésiens !
  rationale: L’ordre marqué est conservé pour restituer le caractère solennel et scandé de l’acclamation. Le génitif pluriel désigne précisément les Éphésiens.
- source_word: Ἄρτεμις
  choice: l’Artémis
  rationale: Le nom propre est translittéré sous sa forme française usuelle. L’article, naturel dans cette acclamation française avec la qualification « des Éphésiens », identifie la déesse telle qu’elle était honorée localement.
theological_decisions:
- issue: Rapporter une acclamation païenne sans paraître l’approuver
  choice: « Grande est l’Artémis des Éphésiens ! »
  alternative: « L’Artémis des Éphésiens est grande ! »
  rationale: La traduction rapporte directement le cri de la foule sans en atténuer le contenu ni y ajouter un jugement du narrateur. L’ordre choisi préserve également sa forme d’acclamation.
translation_notes:
  register: Français international moderne, digne et accessible. « Fureur » rend l’intensité de la réaction collective ; la syntaxe de l’acclamation demeure volontairement élevée et scandée.
