  variant: modern international French
source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: fr
  text: Et beaucoup de ceux qui avaient cru venaient confesser et révéler leurs pratiques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs actes » ou « ce qu’ils avaient fait ».
    reason: Alternative lexicale reflétant l’étendue de sens de πράξεις.
lexical_decisions:
- source_word: πολλοί
  choice: beaucoup
  rationale: Rend directement l’adjectif quantitatif et fonctionne naturellement comme noyau du sujet avec le complément partitif.
- source_word: τε
  choice: Et
  rationale: Marque sobrement la continuité avec le récit précédent, conformément à la faible valeur connective de la particule.
- source_word: τῶν πεπιστευκότων
  choice: de ceux qui avaient cru
  rationale: Le plus-que-parfait français restitue l’antériorité du participe parfait tout en laissant entendre la pertinence durable de leur foi.
- source_word: ἤρχοντο
  choice: venaient
  rationale: L’imparfait exprime naturellement une action en cours ou répétée sans imposer une fréquence précise.
- source_word: ἐξομολογούμενοι
  choice: confesser
  rationale: Le verbe conserve l’idée d’un aveu ou d’une reconnaissance ouverte sans préciser au-delà du grec l’objet exact de la confession.
- source_word: ἀναγγέλλοντες
  choice: révéler
  rationale: Dans ce contexte, « révéler » exprime le fait de faire connaître ce qui était jusque-là caché et évite une répétition maladroite avec « confesser ».
- source_word: τὰς πράξεις αὐτῶν
  choice: leurs pratiques
  rationale: « Pratiques » convient au contexte des activités magiques et peut évoquer des conduites caractéristiques, tout en restant dans le champ sémantique large de πρᾶξις.
theological_decisions:
- issue: Faut-il désigner un groupe établi de « croyants » ou décrire ceux qui étaient auparavant venus à la foi ?
  choice: ceux qui avaient cru
  alternative: les croyants
  rationale: Cette formulation préserve la valeur du parfait grec et évite de transformer inutilement la description en étiquette ecclésiale technique.
- issue: τὰς πράξεις αὐτῶν désigne-t-il précisément des péchés, des pratiques magiques ou plus largement des actes ?
  choice: leurs pratiques
  alternative: leurs actes
  rationale: Le contexte oriente vers des activités magiques, mais le nom grec reste plus large que « péchés ». « Pratiques » respecte à la fois le contexte et cette relative ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination de deux infinitifs après « venaient » allège la phrase et rend idiomatiquement les participes grecs simultanés. Le marqueur [a] est placé immédiatement après le syntagme concerné.
