  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: fr
  text: Après avoir entendu cela[a], ils furent baptisés au nom du Seigneur Jésus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant entendu » ; l’objet est sous-entendu en grec.'
    reason: Le français explicite par « cela » ce que le contexte grec laisse implicite.
  - marker: b
    text: 'Littéralement : « vers/dans le nom » ; la préposition grecque peut évoquer une orientation vers l’appartenance ou l’association.'
    reason: La note préserve la force directionnelle possible de εἰς et l’ambiguïté de la formule sans alourdir le texte principal.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Après avoir entendu cela
  rationale: Le participe aoriste a ici une valeur temporelle. Le grec ne répète pas l’objet d’« entendre » ; « cela » le reprend naturellement du discours précédent sans en modifier le contenu.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: δέ est un léger connecteur narratif. En français, l’enchaînement temporel introduit par « Après » suffit et évite un « et » lourd.
- source_word: ἐβαπτίσθησαν
  choice: ils furent baptisés
  rationale: Cette formulation conserve le passif de l’aoriste grec dans un registre narratif digne et clair.
- source_word: εἰς τὸ ὄνομα
  choice: au nom
  rationale: « Baptiser au nom de » est la tournure française naturelle. Une note signale la valeur directionnelle possible de εἰς, que la formule française ne rend pas entièrement.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: « Seigneur » rend le titre κύριος dans ce contexte christologique, suivi du nom personnel Jésus.
theological_decisions:
- issue: Portée de la formule baptismale εἰς τὸ ὄνομα
  choice: au nom du Seigneur Jésus
  alternative: dans le nom du Seigneur Jésus
  rationale: La tournure retenue est idiomatique en français et ne fixe pas à elle seule la nuance comme autorité, appartenance ou incorporation. La note conserve la valeur plus littéralement directionnelle de εἰς sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple passif convient au registre biblique sans être archaïque ; la syntaxe demeure immédiatement compréhensible.
