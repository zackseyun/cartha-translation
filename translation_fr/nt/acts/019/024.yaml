source:
  edition: SBLGNT
  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: fr
  text: En effet, un certain Démétrius, orfèvre, fabriquait des sanctuaires en argent d’Artémis[a] et procurait ainsi aux artisans une activité non négligeable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des temples en argent d’Artémis » ou « des reproductions en argent du temple d’Artémis ». Le grec emploie naous (« sanctuaires » ou « temples »), probablement pour désigner de petits objets ouvragés liés au culte d’Artémis.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une activité non petite ». Cette litote grecque peut désigner une activité commerciale importante ou des gains considérables.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: En effet
  rationale: Introduit l’explication du contexte narratif précédent. « En effet » conserve ce lien tout en étant naturel en français moderne.
- source_word: Δημήτριος
  choice: Démétrius
  rationale: Translittération française usuelle du nom grec.
- source_word: τις ὀνόματι
  choice: un certain Démétrius
  rationale: Rend l’introduction d’une personne précise mais jusque-là non mentionnée, sans alourdir la phrase avec « du nom de ».
- source_word: ἀργυροκόπος
  choice: orfèvre
  rationale: Désigne ici un artisan travaillant l’argent. « Orfèvre » est le terme français courant et digne dans ce contexte.
- source_word: ποιῶν
  choice: fabriquait
  rationale: L’imparfait français exprime l’activité habituelle décrite par le participe présent grec dans un cadre narratif passé.
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: des sanctuaires d’Artémis en argent
  rationale: ναός signifie sanctuaire ou temple; dans ce contexte artisanal, il s’agit vraisemblablement de petits objets cultuels ou de reproductions, mais le texte n’en précise pas exactement la forme. « Sanctuaires » maintient cette relative indétermination.
- source_word: Ἀρτέμιδος
  choice: Artémis
  rationale: Reprend directement le nom grec de la déesse plutôt que son équivalent romain Diane.
- source_word: παρείχετο
  choice: procurait ainsi
  rationale: L’imparfait rend l’action continue ou habituelle; « ainsi » explicite naturellement en français le rapport entre la fabrication et les revenus, déjà évident dans la construction grecque.
- source_word: τοῖς τεχνίταις
  choice: aux artisans
  rationale: τεχνῖται désigne les travailleurs qualifiés associés à ce métier; « artisans » est précis, naturel et inclusif.
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: des revenus non négligeables
  rationale: La litote οὐκ ὀλίγην exprime une importance substantielle. Dans ce contexte commercial, ἐργασία peut viser l’activité lucrative ou le gain; « revenus » rend clairement l’effet économique, tandis que « non négligeables » conserve la litote.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve le lien explicatif de γάρ, le caractère habituel de l’activité et la litote finale, tout en évitant de préciser au-delà du grec la forme exacte des objets fabriqués.
