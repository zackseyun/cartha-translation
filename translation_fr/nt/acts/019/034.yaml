  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: fr
  text: 'Mais quand ils reconnurent qu’il était juif[a], tous crièrent d’une seule voix pendant environ deux heures : « Grande est Artémis des Éphésiens ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Judéen ». Le terme grec peut désigner un Juif ou une personne originaire de Judée ; ici, le sens ethnoreligieux plus large est plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: quand ils reconnurent
  rationale: Le participe aoriste exprime une circonstance antérieure; cette tournure temporelle reste proche du grec tout en étant naturelle en français.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un tournant adversatif par rapport à la tentative précédente de prendre la parole.
- source_word: Ἰουδαῖός
  choice: juif
  rationale: Dans le contexte diasporique d’Éphèse, le terme désigne vraisemblablement l’identité ethnoreligieuse plutôt qu’une provenance géographique précise.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: tous se mirent à crier d’une seule voix
  rationale: Cette formulation française naturelle restitue l’unanimité soulignée par l’image grecque d’une seule voix issue de tous.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: pendant environ deux heures
  rationale: ὡς devant une indication de durée exprime ici l’approximation.
- source_word: κραζόντων
  choice: se mirent à crier
  rationale: Le verbe rend l’action bruyante et prolongée de la foule; la durée est explicitée par le complément qui suit.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: Grande est Artémis des Éphésiens !
  rationale: L’ordre acclamatoire du grec est conservé, et le génitif Ἐφεσίων est rendu par « des Éphésiens ».
theological_decisions:
- issue: Sens de Ἰουδαῖος
  choice: juif
  alternative: Judéen
  rationale: La réaction de la foule porte plus probablement sur l’identité ethnoreligieuse d’Alexandre que sur sa seule origine géographique; une note conserve toutefois l’alternative lexicale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « d’une seule voix » privilégie l’idiome naturel français tout en conservant l’unanimité de la foule; l’acclamation garde l’ordre emphatique du grec.
