reference: Acts 19:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: fr
  text: Cela fut connu de tous les Juifs et de tous les Grecs qui habitaient Éphèse. La crainte s’empara d’eux tous[a], et le nom du Seigneur Jésus était exalté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la crainte tomba sur eux tous »; ou : « la peur les saisit tous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « était glorifié » ou « était tenu en grand honneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Cela
  rationale: Le démonstratif singulier renvoie à l’incident qui précède. « Cela » conserve cette référence sans ajouter d’explication absente du texte.
- source_word: ἐγένετο γνωστὸν
  choice: fut connu
  rationale: Cette formulation française naturelle exprime le fait que l’incident devint de notoriété publique, tout en conservant le caractère ponctuel de l’aoriste.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: de tous les Juifs et de tous les Grecs
  rationale: Le datif désigne les personnes auprès desquelles la nouvelle fut connue. La répétition de « tous les » rend clairement l’inclusion des deux groupes.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: qui habitaient Éphèse
  rationale: « Habiter » rend directement κατοικέω dans un français actuel et digne; en français standard, le nom de ville suit ce verbe sans préposition.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: La crainte s’empara d’eux tous
  rationale: Cette tournure idiomatique conserve la force soudaine de l’expression grecque sans produire le calque peu naturel « la crainte tomba sur eux ».
- source_word: φόβος
  choice: la crainte
  rationale: « Crainte » maintient l’éventail entre peur et profond respect, sans imposer soit la terreur, soit la seule révérence.
- source_word: ἐμεγαλύνετο
  choice: était exalté
  rationale: L’imparfait passif indique un honneur public continu ou croissant. « Était exalté » préserve l’image d’élévation et reste intelligible en français moderne.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: La traduction littérale conserve les résonances bibliques de réputation, d’autorité et d’honneur sans réduire l’expression à un seul de ces sens.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: « Seigneur » rend κύριος comme titre christologique usuel, et le génitif dépend naturellement de « nom ».
theological_decisions:
- issue: Rendu de κύριος appliqué à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: Dans ce contexte, κύριος fonctionne comme un titre christologique. « Seigneur » en conserve la portée biblique sans paraphrase doctrinale.
- issue: Sens de τὸ ὄνομα
  choice: le nom du Seigneur Jésus
  alternative: la réputation du Seigneur Jésus
  rationale: « Le nom » préserve la formulation et la densité théologique du grec, où le nom peut évoquer à la fois la personne, l’autorité et la réputation.
- issue: Portée de φόβος
  choice: la crainte
  alternative: la peur ou l’effroi
  rationale: Le contexte permet à la fois l’idée de peur devant une manifestation de puissance et celle de respect saisissant. « Crainte » laisse subsister cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec sans calques opaques. « La crainte s’empara d’eux » est plus idiomatique que la métaphore littérale, laquelle est conservée en note; « était exalté » maintient l’aspect imperfectif et l’image de μεγαλύνω.
