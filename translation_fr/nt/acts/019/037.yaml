id: ACT.19.37
reference: Acts 19:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: fr
  text: En effet, vous avez amené ici ces hommes, qui ne sont ni des pilleurs de temples ni des gens qui insultent notre déesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte littéralement « notre dieu », avec un article féminin ; dans ce contexte, il s’agit d’Artémis.
    reason: Signale la forme grammaticale du texte grec tout en expliquant la traduction contextuelle au féminin.
lexical_decisions:
- source_word: ἠγάγετε
  choice: vous avez amené ici
  rationale: L’aoriste désigne l’action accomplie d’avoir conduit les hommes devant l’assemblée; le passé composé est naturel en français, et « ici » explicite sobrement la situation déictique.
- source_word: γὰρ
  choice: En effet
  rationale: Introduit la justification de l’affirmation précédente; « en effet » convient au discours public et reste naturel en français moderne.
- source_word: τοὺς ἄνδρας τούτους
  choice: ces hommes
  rationale: ἀνήρ désigne ici des hommes; le démonstratif τούτους est directement rendu par « ces ».
- source_word: οὔτε ... οὔτε
  choice: ni ... ni
  rationale: Reproduit la double négation corrélative du grec de manière idiomatique.
- source_word: ἱεροσύλους
  choice: des pilleurs de temples
  rationale: Le terme désigne concrètement ceux qui dérobent les biens d’un sanctuaire; cette formulation est plus immédiatement compréhensible que « sacrilèges » tout en gardant le pluriel non défini du grec.
- source_word: βλασφημοῦντας
  choice: des gens qui insultent
  rationale: Le participe décrit ici des paroles outrageantes dirigées contre une divinité. « Insultent » rend clairement l’acte sans imposer le registre doctrinal que pourrait évoquer « blasphèment ».
- source_word: τὴν θεὸν ἡμῶν
  choice: notre déesse
  rationale: Dans le contexte, θεός renvoie à Artémis; le féminin français est donc requis pour identifier naturellement la référente, même si la forme grecque peut être glosée littéralement « dieu ».
theological_decisions:
- issue: Genre du terme θεός lorsqu’il désigne Artémis
  choice: notre déesse
  alternative: notre dieu
  rationale: Le fonctionnaire éphésien parle d’Artémis. « Déesse » transmet le référent réel sans approuver son statut religieux et évite une possible confusion avec Dieu.
- issue: Portée de βλασφημοῦντας
  choice: des gens qui insultent notre déesse
  alternative: des blasphémateurs de notre déesse
  rationale: Le grec peut couvrir la diffamation, l’injure ou le blasphème. La formulation verbale française conserve l’idée de parole outrageante sans durcir inutilement le terme en catégorie théologique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le ton justificatif d’un responsable s’adressant à une assemblée; « pilleurs de temples » est concret, tandis que « des gens qui insultent » évite une nominalisation lourde.
