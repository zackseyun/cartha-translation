source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: fr
  text: Même quelques-uns des asiarques[a], qui étaient ses amis, lui envoyèrent un message et le pressèrent de ne pas se rendre au théâtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « asiarques » étaient d’éminents responsables associés à la province romaine d’Asie.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: Même quelques-uns
  rationale: « Même » rend la valeur emphatique de καί, tandis que « quelques-uns » conserve le caractère indéfini de τινές. Le lien narratif de δέ est suffisamment porté par la continuité du récit français.
- source_word: τῶν Ἀσιαρχῶν
  choice: des asiarques
  rationale: Ce terme technique désigne d'éminents responsables liés à la province romaine d'Asie. La translittération préserve le titre historique, expliqué en note.
- source_word: ὄντες αὐτῷ φίλοι
  choice: qui étaient ses amis
  rationale: Cette relative naturelle en français conserve la relation personnelle exprimée par φίλοι et la valeur descriptive du participe.
- source_word: πέμψαντες πρὸς αὐτόν
  choice: lui envoyèrent un message
  rationale: Le grec dit littéralement qu'ils envoyèrent vers lui sans exprimer l'objet. « Un message » explicite naturellement ce qui est sous-entendu, sans modifier le sens.
- source_word: παρεκάλουν
  choice: pour le supplier
  rationale: Dans ce contexte de danger, παρακαλέω exprime une demande pressante. « Supplier » en restitue la force; la tournure finale française relie naturellement l'envoi du message à son contenu.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: de ne pas se rendre au théâtre
  rationale: L'expression signifie ici ne pas s'exposer en entrant dans le théâtre. « Se rendre au théâtre » est idiomatique, respecte le mouvement exprimé par εἰς et évite le calque obscur « se donner soi-même ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le titre historique « asiarques » est conservé pour sa précision, avec une brève explication culturelle en note.
