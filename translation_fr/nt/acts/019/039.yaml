source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: fr
  text: Mais si vous cherchez autre chose, cela sera réglé dans l’assemblée légalement constituée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’assemblée conforme à la loi ». Il s’agit ici d’une assemblée civique légalement constituée, et non de l’Église.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: quelque chose de plus
  rationale: Avec τι et ἐπιζητεῖτε, cette tournure exprime naturellement en français une demande supplémentaire, au-delà de l’affaire présente.
- source_word: ἐπιζητεῖτε
  choice: cherchez à obtenir
  rationale: Le verbe désigne ici la poursuite d’une demande ou d’un recours supplémentaire; cette formulation reste assez large sans lui donner un sens judiciaire trop technique.
- source_word: ἐννόμῳ
  choice: légale
  rationale: L’adjectif indique que l’assemblée est constituée conformément à la loi. « Légale » est clair en français moderne, tandis que « régulière » pourrait n’évoquer que la périodicité.
- source_word: ἐκκλησίᾳ
  choice: assemblée
  rationale: Dans ce contexte éphésien, le mot désigne le corps civique réuni, non la communauté chrétienne. « Assemblée » conserve ce sens public sans introduire l’idée d’Église.
- source_word: ἐπιλυθήσεται
  choice: l’affaire sera réglée
  rationale: Le futur passif annonce la résolution de la question par la procédure civique. L’ajout explicite de « l’affaire » rend le pronom implicite naturel en français sans préciser indûment l’issue.
- source_word: τι
  choice: quelque chose
  rationale: Le pronom indéfini garde ouverte la nature de la demande supplémentaire.
theological_decisions:
- issue: Sens de ἐκκλησία dans un contexte civique non chrétien
  choice: assemblée
  alternative: Église; réunion
  rationale: Le greffier parle d’une assemblée civique légalement constituée à Éphèse. « Assemblée » évite une connotation ecclésiale trompeuse tout en conservant le sens fondamental du terme grec.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le cadre civique et procédural du verset; « assemblée légale » est concise, et la note prévient toute lecture ecclésiale de ἐκκλησία.
