id: ACT.19.40
reference: Acts 19:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: fr
  text: En effet, nous risquons d’être accusés d’émeute au sujet des événements d’aujourd’hui[a], puisqu’il n’existe aucun motif pour lequel nous puissions rendre compte de cet attroupement[b]. Après avoir dit cela, il congédia l’assemblée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sédition » ou « d’insurrection ». Le terme grec peut désigner un grave soulèvement civil, mais « émeute » convient ici au contexte immédiat d’un tumulte public.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ce rassemblement tumultueux » ou « de cette agitation ». Le mot grec désigne ici le regroupement désordonné de la foule et se distingue du terme plus formel traduit ensuite par « assemblée ».
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « assemblée » est le même mot grec qui désigne souvent ailleurs l’Église ; ici, il s’agit de l’assemblée civique d’Éphèse.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: nous risquons
  rationale: Le présent exprime un danger actuel. « Nous risquons » est direct et naturel en français moderne.
- source_word: ἐγκαλεῖσθαι
  choice: d’être accusés
  rationale: 'Le verbe possède ici une portée juridique : les responsables romains pourraient engager une accusation contre la cité.'
- source_word: στάσεως
  choice: d’émeute
  rationale: Dans le contexte d’un tumulte public, « émeute » rend la grave atteinte à l’ordre civil sans imposer l’idée plus précise d’une insurrection politique.
- source_word: περὶ τῆς σήμερον
  choice: à cause de ce qui s’est passé aujourd’hui
  rationale: Cette formulation française explicite naturellement la référence elliptique aux événements du jour.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: alors qu’il n’y a aucun motif qui le justifie
  rationale: La proposition exprime l’absence de motif légitime pour le tumulte et conserve la nuance justificative et quasi juridique de αἴτιον.
- source_word: ἀποδοῦναι λόγον
  choice: rendre compte
  rationale: Cette expression usuelle conserve l’idée de devoir fournir une explication devant une autorité.
- source_word: συστροφῆς
  choice: attroupement
  rationale: Le terme désigne ici un rassemblement tumultueux. « Attroupement » convient au cadre civique et le distingue de l’assemblée désignée ensuite par ἐκκλησία.
- source_word: ἐκκλησίαν
  choice: assemblée
  rationale: Dans ce passage, le mot désigne l’assemblée publique d’Éphèse et non l’Église au sens chrétien.
- source_word: ἀπέλυσεν
  choice: congédia
  rationale: Dans le contexte d’une réunion publique, le verbe indique que le secrétaire mit fin à l’assemblée et renvoya les participants.
- source_word: καὶ γὰρ
  choice: En effet, … même
  rationale: « En effet » conserve la valeur explicative de γάρ, tandis que « même » restitue l’élément d’intensification porté par καί dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le ton juridique de l’avertissement du secrétaire de la ville, tout en distinguant l’attroupement tumultueux de l’assemblée civique qu’il congédie.
