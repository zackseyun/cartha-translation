revisions:
- from: En effet, nous risquons même d’être accusés d’émeute à cause de ce qui s’est passé aujourd’hui[a], alors qu’il n’y a aucun motif qui le justifie, et nous ne pourrons rendre compte de cet attroupement[b]. Après avoir dit cela, il congédia l’assemblée[c].
  to: En effet, nous risquons d’être accusés d’émeute au sujet des événements d’aujourd’hui[a], puisqu’il n’existe aucun motif pour lequel nous puissions rendre compte de cet attroupement[b]. Après avoir dit cela, il congédia l’assemblée[c].
  rationale: La révision rétablit le lien syntaxique entre l’absence de motif et l’impossibilité de rendre compte de l’attroupement, tout en remplaçant une relation causale trop marquée par la relation thématique exprimée par περί. Les choix lexicaux principaux et les notes sont conservés.
