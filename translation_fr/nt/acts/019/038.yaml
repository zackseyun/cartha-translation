id: ACT.19.38
reference: Acts 19:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: fr
  text: Si donc Démétrius et les artisans qui sont avec lui ont un grief contre quelqu’un, des audiences judiciaires se tiennent[a] et il y a des proconsuls[b] ; qu’ils portent plainte les uns contre les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les tribunaux siègent ». L’expression grecque désigne des procédures judiciaires officiellement convoquées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des proconsuls sont disponibles » ou « présents ». Le pluriel peut désigner de manière générale l’autorité provinciale exercée par cette fonction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Si donc
  rationale: Rend naturellement la condition et la transition déductive ; μέν reste légèrement marqué par le mouvement de la phrase sans recevoir un équivalent autonome.
- source_word: Δημήτριος
  choice: Démétrius
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre grec.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: les artisans qui sont avec lui
  rationale: « Artisans » désigne clairement des ouvriers qualifiés, tandis que « qui sont avec lui » préserve la formulation relationnelle assez générale du grec.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: ont un grief contre quelqu’un
  rationale: 'L’expression a ici un sens juridique : il s’agit d’un motif de plainte ou d’une affaire à faire valoir contre une personne.'
- source_word: τινα
  choice: quelqu’un
  rationale: Conserve le caractère indéfini de la personne visée dans cette formulation juridique générale.
- source_word: ἀγοραῖοι ἄγονται
  choice: des audiences judiciaires se tiennent
  rationale: Rend le sens institutionnel d’audiences officiellement convoquées et conserve une tournure proche du passif grec.
- source_word: ἀνθύπατοί εἰσιν
  choice: il y a des proconsuls
  rationale: Préserve le pluriel du texte grec et le titre administratif romain sans préciser indûment s’ils sont présents ou simplement disponibles.
- source_word: ἐγκαλείτωσαν
  choice: qu’ils portent plainte
  rationale: Exprime clairement l’action légale d’intenter une accusation dans le cadre judiciaire évoqué.
- source_word: ἀλλήλοις
  choice: les uns contre les autres
  rationale: Préserve la réciprocité et la force adversative du pronom dans ce contexte judiciaire, sans déterminer davantage les parties.
theological_decisions: []
