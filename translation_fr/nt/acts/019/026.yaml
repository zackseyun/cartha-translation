id: ACT.19.26
reference: Acts 19:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: fr
  text: Vous voyez et entendez que, non seulement à Éphèse, mais dans presque toute l’Asie[a], ce Paul a convaincu et détourné une foule considérable, en disant que les dieux fabriqués de main d’homme[b] ne sont pas des dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit ici de la province romaine d’Asie, située dans la partie occidentale de l’actuelle Turquie.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « produits par des mains »; expression désignant des idoles fabriquées par l’être humain.'
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: vous voyez et entendez
  rationale: Conserve le double appel de Démétrius à ce que ses auditeurs constatent directement et à ce qu’ils apprennent publiquement, dans une formulation française naturelle.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: non seulement à Éphèse, mais dans presque toute l’Asie
  rationale: Rend idiomatiquement la valeur locative des génitifs et traduit σχεδόν par « presque », sans exagérer l’étendue affirmée.
- source_word: ὁ Παῦλος οὗτος
  choice: ce Paul
  rationale: Préserve la nuance dépréciative ou accusatrice du démonstratif dans le discours de Démétrius, sans ajouter une insulte absente du grec.
- source_word: πείσας μετέστησεν
  choice: a convaincu et détourné
  rationale: Reproduit l’idée que Paul a persuadé les gens et les a amenés à changer de position. « Détourné » convient au contexte de l’abandon du culte des idoles sans introduire l’idée plus interprétative de tromperie.
- source_word: ἱκανὸν ὄχλον
  choice: une foule considérable
  rationale: ἱκανός indique ici un nombre important; « considérable » garde cette portée quantitative et rhétorique.
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: les dieux fabriqués de main d’homme ne sont pas des dieux
  rationale: Rend directement la négation du statut divin des idoles produites par l’artisanat humain, tout en gardant la répétition polémique de θεοί.
theological_decisions:
- issue: Formulation de la négation du caractère divin des idoles
  choice: les dieux fabriqués de main d’homme ne sont pas des dieux
  alternative: ce qui est fabriqué de main d’homme n’est pas dieu
  rationale: Le grec désigne comme « dieux » les objets fabriqués, puis nie qu’ils soient réellement des dieux. La formulation retenue préserve cette tension rhétorique sans ajouter « vrais » ou « réellement ».
translation_notes:
  register: Français moderne international, clair et digne. La syntaxe conserve le ton accusateur du discours public de Démétrius. « Ce Paul » maintient la nuance de mépris du démonstratif, tandis que « fabriqués de main d’homme » explicite naturellement l’idiome grec sans atténuer sa portée polémique.
