  rationale: Cette particule de liaison légère n’exprime ici ni contraste ni progression qu’il soit nécessaire de marquer en français.
- source_word: οἱ πάντες
  choice: en tout
  rationale: Cette expression récapitule l’ensemble du groupe; « en tout » est la tournure française idiomatique pour indiquer un total.
- source_word: ἄνδρες
  choice: hommes
  rationale: Le nom grec désigne ici des hommes, et non des personnes sans distinction de sexe.
- source_word: ὡσεὶ
  choice: environ
  rationale: Le terme marque une approximation numérique; « environ » la restitue clairement dans un registre digne et courant.
- source_word: δώδεκα
  choice: douze
  rationale: Équivalent cardinal direct.
