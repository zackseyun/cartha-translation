source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: fr
  text: Un grand nombre de ceux qui avaient pratiqué la magie apportèrent leurs livres et les brûlèrent devant tout le monde. Ils en calculèrent la valeur et trouvèrent qu’elle s’élevait à cinquante mille pièces d’argent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « cinq myriades d’argent », soit cinquante mille unités d’argent. Le texte ne précise pas de quelle monnaie il s’agit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: un grand nombre
  rationale: Dans ce contexte, le terme désigne un nombre important de personnes. Cette tournure française naturelle conserve cette nuance quantitative.
- source_word: τὰ περίεργα πραξάντων
  choice: ceux qui avaient pratiqué la magie
  rationale: Dans le contexte éphésien des formules, exorcismes et livres brûlés, l’expression désigne des pratiques magiques plutôt que de simples activités curieuses.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: apportèrent leurs livres
  rationale: Le participe exprime le fait d’apporter les livres en un même lieu. « Leurs » est explicité naturellement d’après le contexte.
- source_word: κατέκαιον
  choice: les brûlèrent
  rationale: L’imparfait grec peut présenter l’action en cours, mais le passé simple rend ici avec naturel l’événement narratif public, sans modifier son contenu.
- source_word: ἐνώπιον πάντων
  choice: devant tout le monde
  rationale: Cette expression moderne et claire souligne le caractère public de l’acte.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: On en calcula la valeur
  rationale: Le verbe indique un calcul total, et τιμή désigne ici la valeur monétaire. Le sujet indéfini français préserve l’absence de sujet explicitement nommé dans la proposition grecque.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: cinquante mille pièces d’argent
  rationale: Le grec signifie littéralement « cinq myriades d’argent », soit cinquante mille unités; la dénomination monétaire exacte n’est pas précisée.
theological_decisions:
- issue: Sens de τὰ περίεργα dans le contexte d’Éphèse
  choice: pratiqué la magie
  alternative: pratiqué des activités occultes
  rationale: Le contexte immédiat concerne les exorcismes, les esprits mauvais et la destruction de livres liés à ces pratiques. « Magie » communique clairement le sens historique sans réduire l’expression à de simples curiosités ni lui imposer une catégorie doctrinale plus tardive.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La formulation évite de nommer une monnaie particulière que le grec ne précise pas.
