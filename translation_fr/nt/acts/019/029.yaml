  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: fr
  text: La ville fut remplie de confusion, et la foule se précipita d’un même élan dans le théâtre, en entraînant de force Gaïus et Aristarque, des Macédoniens qui étaient les compagnons de voyage de Paul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après s’être emparée de Gaïus et d’Aristarque » ou « saisissant Gaïus et Aristarque ». Le participe grec souligne une prise violente ; « entraînant de force » met aussi en relief le mouvement de la foule vers le théâtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: Toute la ville fut remplie de confusion
  rationale: Cette formulation conserve le passif et rend naturellement le génitif de contenu; « toute » exprime en français l’ampleur impliquée par la ville remplie, sans préciser d’agent.
- source_word: ὥρμησάν τε ὁμοθυμαδόν
  choice: Tous se précipitèrent ensemble
  rationale: « Se précipitèrent » traduit le mouvement soudain et impétueux, tandis que « ensemble » marque l’action collective de la foule sans connotation positive d’harmonie.
- source_word: εἰς τὸ θέατρον
  choice: dans le théâtre
  rationale: « Théâtre » est la désignation directe du lieu public et évite le terme plus précis « amphithéâtre », que le grec n’impose pas.
- source_word: συναρπάσαντες
  choice: entraînant de force
  rationale: Le participe évoque une saisie violente liée au déplacement vers le théâtre; « entraînant de force » restitue ces deux aspects.
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: Gaïus et Aristarque
  rationale: Translittération française usuelle des noms propres.
- source_word: Μακεδόνας
  choice: des Macédoniens
  rationale: Rend directement l’origine géographique des deux hommes.
- source_word: συνεκδήμους Παύλου
  choice: qui accompagnaient Paul dans ses voyages
  rationale: Formulation française claire qui exprime qu’ils étaient les compagnons de déplacement de Paul hors de chez eux.
