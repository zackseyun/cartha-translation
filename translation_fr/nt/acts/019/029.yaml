- from: Toute la ville fut remplie de confusion. Tous se précipitèrent ensemble dans le théâtre, entraînant de force Gaïus et Aristarque, des Macédoniens qui accompagnaient Paul dans ses voyages.[a]
  to: La ville fut remplie de confusion, et la foule se précipita d’un même élan dans le théâtre, en entraînant de force Gaïus et Aristarque, des Macédoniens qui étaient les compagnons de voyage de Paul.[a]
  rationale: La révision évite d’affirmer explicitement que tous les habitants ont participé, tout en conservant l’image contextuelle d’une foule agissant collectivement. Elle maintient le passif, la confusion, le mouvement précipité vers le théâtre, la violence de la saisie, les noms et l’identification des deux Macédoniens.
