  variant: modern international French
source:
  edition: SBLGNT
  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: fr
  text: Et Dieu accomplissait, par les mains de Paul, des miracles extraordinaires,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des manifestations de puissance qui n’étaient pas ordinaires ».'
    reason: La note conserve le sens concret de Δυνάμεις et la forme négative de l’expression grecque οὐ τὰς τυχούσας.
lexical_decisions:
- source_word: Δυνάμεις
  choice: miracles
  rationale: Au pluriel, dans ce contexte des Actes, le terme désigne des manifestations concrètes de puissance. « Miracles » exprime clairement ce sens événementiel en français moderne.
- source_word: τε
  choice: Et
  rationale: La particule relie cette affirmation au récit précédent ; « Et » conserve simplement cette continuité narrative.
- source_word: οὐ τὰς τυχούσας
  choice: extraordinaires
  rationale: Cette tournure idiomatique signifie littéralement « qui ne sont pas ordinaires » ou « pas quelconques ». « Extraordinaires » en rend naturellement la valeur emphatique.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Dieu est le sujet grammatical explicite, ce qui maintient au premier plan l'origine divine des miracles.
- source_word: ἐποίει
  choice: accomplissait
  rationale: L'imparfait grec présente une action en cours ou répétée. L'imparfait français « accomplissait » en conserve l'aspect tout en convenant naturellement à « miracles ».
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: par les mains de Paul
  rationale: La préposition avec le génitif exprime ici le moyen ou l'intermédiaire. Le maintien de l'image concrète des « mains » souligne que Paul est l'instrument par lequel Dieu agit.
- source_word: Παύλου
  choice: Paul
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
theological_decisions:
- issue: Agent des miracles
  choice: Dieu est celui qui accomplit les miracles, par l'intermédiaire de Paul.
  alternative: Paul accomplissait les miracles.
  rationale: Le grec donne explicitement « Dieu » pour sujet du verbe, tandis que « par les mains de Paul » désigne l'intermédiaire. La traduction préserve cette distinction sans attribuer à Paul une puissance autonome.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l'imparfait, l'agent divin explicite et l'image biblique des mains de Paul ; la virgule met clairement en relief l'intermédiaire sans obscurcir le sujet.
