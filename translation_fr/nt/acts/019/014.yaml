source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: fr
  text: Il y avait sept fils d’un certain Scéva, un chef des prêtres juifs, qui faisaient cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grand prêtre ». Le terme grec peut désigner soit le grand prêtre, soit, plus largement, un chef des prêtres ou un personnage appartenant au milieu des grands prêtres.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Il y avait
  rationale: L’imparfait introduit les personnages dans la continuité du récit. Le français peut laisser δέ implicite ici sans ajouter un contraste ou un repère temporel absent du grec.
- source_word: τινος Σκευᾶ
  choice: d’un certain Scéva
  rationale: Le génitif indéfini τινος associé au nom propre présente Scéva comme un individu non autrement identifié; « un certain Scéva » le rend directement et naturellement.
- source_word: Ἰουδαίου
  choice: juif
  rationale: Dans ce contexte, le terme exprime l’identité ethnoreligieuse plutôt qu’une simple origine géographique.
- source_word: ἀρχιερέως
  choice: chef des prêtres
  rationale: Le terme peut désigner le grand prêtre ou, plus largement, un membre éminent du milieu sacerdotal supérieur. « Chef des prêtres » évite d’identifier sans certitude Scéva au titulaire unique de la fonction de grand prêtre.
- source_word: ἑπτὰ υἱοὶ
  choice: sept fils
  rationale: Traduction directe du nombre et du lien familial.
- source_word: τοῦτο ποιοῦντες
  choice: qui faisaient cela
  rationale: Le participe présent décrit l’action en cours évoquée dans le contexte précédent; le singulier « cela » correspond à τοῦτο.
theological_decisions:
- issue: Sens de ἀρχιερεύς appliqué à Scéva
  choice: chef des prêtres
  alternative: grand prêtre
  rationale: Le mot grec permet les deux sens. Comme Scéva n’est pas connu comme le grand prêtre juif en titre, le texte principal retient le sens plus large sans supprimer l’autre possibilité, signalée en note.
translation_notes:
  register: Français international moderne, sobre et narratif. La tournure « qui faisaient cela » explicite naturellement le rattachement du participe aux sept fils tout en conservant la référence au contexte précédent.
