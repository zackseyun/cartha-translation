  source_fidelity: 'Le sens fondamental est conservé : sept fils de Scéva sont présentés comme accomplissant l’action évoquée au verset précédent. « Un certain Scéva » rend correctement l’indéfini τίνος, et « faisaient cela » rend naturellement le participe présent τοῦτο ποιοῦντες. Toutefois, « un chef des prêtres juif » est une formulation française peu idiomatique et peut brouiller la portée de ἀρχιερεύς.'
