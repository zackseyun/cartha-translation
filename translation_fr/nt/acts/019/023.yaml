  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: fr
  text: À cette époque-là, il se produisit une agitation considérable au sujet de la Voie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la voie ». Ici, ce terme désigne le mouvement chrétien, comme à plusieurs reprises dans les Actes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: il se produisit
  rationale: Le verbe introduit la survenue d’un événement. « Il se produisit » est naturel en français narratif et conserve cette valeur événementielle.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δὲ est ici un léger connecteur narratif. La progression est suffisamment portée en français par l’expression temporelle initiale, sans ajouter un « or » potentiellement plus marqué.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: À cette époque-là
  rationale: Cette formulation rend clairement la référence temporelle et convient au récit. Le suffixe « -là » reprend explicitement la valeur de ἐκεῖνον.
- source_word: τάραχος
  choice: des troubles
  rationale: Le terme désigne de l’agitation ou du désordre. Le pluriel idiomatique français « des troubles » reste assez large et n’anticipe pas indûment une émeute au sens technique.
- source_word: οὐκ ὀλίγος
  choice: considérables
  rationale: Le grec emploie une litote, littéralement « pas peu ». En français courant, « des troubles non négligeables » serait lourd et pourrait minimiser l’intensité ; « considérables » en restitue naturellement la force.
- source_word: περὶ
  choice: au sujet de
  rationale: La préposition avec le génitif indique ce qui est en cause. « Au sujet de » est clair et naturel.
- source_word: τῆς ὁδοῦ
  choice: la Voie
  rationale: Dans les Actes, l’expression sert à plusieurs reprises de désignation au mouvement chrétien. La majuscule signale cet emploi particulier sans l’expliciter dans le corps du texte.
theological_decisions:
- issue: Statut de τῆς ὁδοῦ comme désignation du mouvement chrétien
  choice: la Voie
  alternative: la voie
  rationale: Le contexte et l’usage récurrent des Actes indiquent une désignation reconnue du mouvement chrétien. La majuscule aide le lecteur français à percevoir cette valeur tout en préservant la métaphore du chemin.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. La litote grecque est rendue par son sens idiomatique plutôt que calquée, tandis que l’ambiguïté lexicale de « la Voie » est signalée en note.
