source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: fr
  text: 'Mais l’esprit mauvais leur répondit[a] : « Jésus, je le connais, et Paul, je sais qui il est. Mais vous, qui êtes-vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus, je le connais, et je connais Paul de réputation. » Le grec emploie deux verbes différents, γινώσκω (« connaître ») et ἐπίσταμαι (« savoir, connaître »), dont la nuance respective peut varier ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν δὲ … εἶπεν αὐτοῖς
  choice: Mais … leur répondit
  rationale: La tournure participiale suivie de εἶπεν introduit idiomatiquement une réponse. « Leur répondit » est naturel en français, conserve les destinataires et évite le calque lourd « ayant répondu, dit ».
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: l’esprit mauvais
  rationale: La formule désigne ici un être spirituel personnel caractérisé par le mal. « Esprit mauvais » est clair, courant et proche de l’ordre sémantique grec.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: Jésus, je le connais
  rationale: La dislocation à gauche rend naturellement en français la mise en relief de l’objet antéposé en grec. « Connaître » est le sens direct de γινώσκω dans ce contexte.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: Paul, je sais qui il est
  rationale: Cette formulation naturelle distingue ἐπίσταμαι de γινώσκω sans affirmer un degré précis de connaissance. Elle exprime le fait d’être informé de l’identité de Paul.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: Mais vous, qui êtes-vous ?
  rationale: Le pronom explicite ὑμεῖς est emphatique et δέ marque le contraste. « Mais vous » conserve cette opposition et le pluriel ressort du contexte.
theological_decisions:
- issue: Distinction entre γινώσκω et ἐπίσταμαι dans les paroles de l’esprit
  choice: « Jésus, je le connais, et Paul, je sais qui il est »
  alternative: « Jésus, je le connais, et Paul, je le connais aussi » ou « je connais Paul de réputation »
  rationale: Le grec emploie deux verbes différents, probablement avec un effet rhétorique. La traduction choisie maintient cette différence sans bâtir une doctrine sur des degrés distincts de connaissance démoniaque. Une note signale que la nuance exacte reste ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La dislocation « Jésus, je le connais » reproduit l’emphase grecque sans archaïsme. La reprise « Mais vous » accentue le contraste rhétorique.
