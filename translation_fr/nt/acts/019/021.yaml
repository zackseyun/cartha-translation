id: ACT.19.21
reference: Acts 19:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: fr
  text: 'Après que tout cela fut achevé, Paul prit la résolution, dans l’Esprit[a], de traverser la Macédoine et l’Achaïe, puis de se rendre à Jérusalem, en se disant : « Après m’être rendu là-bas, je dois aussi voir Rome. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son esprit ». Le grec peut désigner soit la résolution intérieure de Paul, soit la direction de l’Esprit Saint.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: fut achevé
  rationale: Le passif indique ici que les événements précédents sont arrivés à leur terme, sans suggérer nécessairement l'accomplissement d'une prophétie.
- source_word: ἔθετο
  choice: décida
  rationale: Le moyen de τίθημι exprime ici une résolution prise intérieurement; « décida » est naturel et garde le caractère délibéré de la décision.
- source_word: ἐν τῷ πνεύματι
  choice: dans l'Esprit
  rationale: L'expression peut désigner l'Esprit Saint ou l'esprit intérieur de Paul. Le texte principal retient « l'Esprit », tandis qu'une note préserve l'autre lecture.
- source_word: διελθὼν
  choice: en passant par
  rationale: Le participe décrit le passage prévu par la Macédoine et l'Achaïe avant l'arrivée à Jérusalem; cette formulation française rend clairement l'itinéraire.
- source_word: πορεύεσθαι
  choice: se rendre
  rationale: Dans ce contexte d'itinéraire vers une destination précise, « se rendre à » est idiomatique et fidèle au verbe de déplacement.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: Après y être allé
  rationale: La construction signifie qu'il sera d'abord arrivé ou aura séjourné là-bas; « après y être allé » est naturelle et renvoie clairement à Jérusalem.
- source_word: δεῖ
  choice: il faut que
  rationale: Cette tournure conserve la force de nécessité, éventuellement liée au dessein divin chez Luc, sans expliciter ce que le grec laisse implicite.
- source_word: ἰδεῖν
  choice: voie
  rationale: « Voir Rome » conserve l'expression grecque, tout en pouvant naturellement impliquer une visite.
theological_decisions:
- issue: Référent de ἐν τῷ πνεύματι
  choice: dans l'Esprit
  alternative: dans son esprit
  rationale: Le grec ne comporte aucun possessif explicite et permet les deux lectures. L'usage lucanien et le contexte missionnaire favorisent « l'Esprit », mais l'ambiguïté authentique est signalée en note.
- issue: Portée de δεῖ
  choice: il faut aussi que je voie Rome
  alternative: je dois aussi voir Rome
  rationale: La formulation impersonnelle française reflète bien δεῖ et laisse ouverte la question de savoir si la nécessité relève d'une conviction personnelle, des circonstances ou du dessein divin.
translation_notes:
  register: Français international moderne, fluide et digne. La structure a été légèrement répartie en deux phrases pour éviter une accumulation de propositions, sans modifier les rapports temporels ni l'itinéraire.
