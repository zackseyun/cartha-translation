  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: fr
  text: 'Il dit alors : « Quel baptême avez-vous donc reçu ? » Ils répondirent : « Le baptême de Jean. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: Il dit alors
  rationale: Le verbe λέγω signifie simplement « dire ». La particule τε relie légèrement cette parole au contexte précédent ; « alors » rend cette continuité narrative sans l'alourdir.
- source_word: Εἰς τί οὖν
  choice: En quoi donc
  rationale: « En quoi » conserve la préposition εἰς et répond au « dans » de la réponse, tandis que « donc » exprime la conséquence tirée de l'échange précédent.
- source_word: ἐβαπτίσθητε
  choice: avez-vous été baptisés
  rationale: Cette formulation rend directement l'aoriste passif de βαπτίζω et évite de le transformer en une simple réception abstraite du baptême.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: Dans le baptême de Jean
  rationale: « Dans » rend ici εἰς de manière intelligible en français et maintient le parallèle avec la question. Le génitif Ἰωάννου est naturellement rendu par « de Jean ».
- source_word: βάπτισμα
  choice: baptême
  rationale: « Baptême » est le terme français établi et précis pour le rite désigné, sans paraphrase interprétative.
theological_decisions:
- issue: Faut-il conserver la préposition εἰς dans la question et la réponse ?
  choice: La rendre par « en quoi » puis « dans le baptême »
  alternative: 'Traduire plus idiomatiquement : « Quel baptême avez-vous donc reçu ? — Le baptême de Jean. »'
  rationale: La formulation retenue préserve le parallélisme grec et l'idée d'une identification baptismale, sans préciser davantage la théologie du baptême ni imposer une lecture confessionnelle.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « en quoi… baptisés » est légèrement marquée, mais reste compréhensible et permet de préserver la construction répétée du grec.
