review_pass:
  verdict: revise
  source_fidelity: La proposition temporelle « Lorsque Paul leur imposa les mains » rend fidèlement le génitif absolu aoriste. « L’Esprit Saint vint sur eux » correspond bien à ἦλθε ... ἐπ’ αὐτούς. En revanche, « ils se mirent à » impose un sens inchoatif que les imparfaits ἐλάλουν et ἐπροφήτευον n’exigent pas; ils décrivent plus directement une activité en cours.
  naturalness: « Ils parlaient en langues et prophétisaient » est naturel, clair et narratif en français international moderne. L’imparfait français restitue sans lourdeur l’aspect imperfectif grec.
  terminology: « Imposa les mains », « l’Esprit Saint », « parler en langues » et « prophétiser » sont des formulations établies et compréhensibles. La note doit éviter « diverses langues », qui ajoute une nuance de diversité non exprimée explicitement, ainsi que l’opposition imprécise entre « langues » et « langages ».
  issues:
  - severity: medium
    issue: « Ils se mirent à parler ... et à prophétiser »
    rationale: Cette tournure exprime explicitement un commencement. Les imparfaits grecs peuvent, dans le contexte, être compris comme inchoatifs, mais ne l’imposent pas; une traduction formelle ne devrait pas résoudre cette nuance aspectuelle de manière obligatoire.
  - severity: low
    issue: 'Note: « en diverses langues » / « langues au sens de langages »'
    rationale: « Diverses » explicite une pluralité différenciée au-delà de ce que le texte dit, et « langages » n’est pas le terme français naturel ici. Une note peut signaler sobrement l’alternative « dans des langues » et la portée possible d’« idiomes ».
  revised_text: Lorsque Paul leur imposa les mains, l’Esprit Saint vint sur eux, et ils parlaient en langues[a] et prophétisaient.
  revised_footnotes:
  - marker: a
    text: Ou « dans des langues ». Le grec peut désigner des langues au sens d’idiomes; le texte principal conserve l’ambiguïté.
    reason: lexical_alternative
