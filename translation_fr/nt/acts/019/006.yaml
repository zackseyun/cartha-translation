id: ACT.19.6
reference: Acts 19:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: fr
  text: Lorsque Paul leur imposa les mains, l’Esprit Saint vint sur eux, et ils parlaient en langues[a] et prophétisaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des langues ». Le grec peut désigner des langues au sens d’idiomes; le texte principal conserve l’ambiguïté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: Lorsque Paul leur imposa les mains
  rationale: Le génitif absolu avec participe aoriste est rendu naturellement par une proposition temporelle. « Imposer les mains » conserve l’expression biblique établie en français.
- source_word: ἦλθε ... ἐπ’ αὐτούς
  choice: vint sur eux
  rationale: Cette formulation rend simplement le mouvement exprimé par ἔρχομαι avec ἐπί et reste naturelle dans le registre narratif de Luc-Actes.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Formulation française contemporaine, claire et consacrée, qui désigne fidèlement le Saint-Esprit sans archaïsme.
- source_word: ἐλάλουν
  choice: ils se mirent à parler
  rationale: L’imparfait grec présente une action en cours après la venue de l’Esprit; dans ce contexte narratif, « se mirent à » en exprime naturellement le commencement, sans ajouter une action distincte.
- source_word: γλώσσαις
  choice: en langues
  rationale: « En langues » conserve en français l’expression biblique et l’ambiguïté de γλῶσσα entre « langue » comme organe ou mode de parole, et « langue » au sens de langage.
- source_word: ἐπροφήτευον
  choice: à prophétiser
  rationale: Le verbe français rend directement l’activité prophétique exprimée par l’imparfait grec et se coordonne naturellement avec « parler » après « se mirent à ».
- source_word: τε ... καί
  choice: et ... et
  rationale: La coordination grecque associe étroitement les deux manifestations; la structure française les relie sans hiérarchie interprétative.
theological_decisions:
- issue: Nature de γλώσσαις en Actes 19.6
  choice: « en langues » dans le texte principal, avec une note signalant « en diverses langues »
  alternative: « en diverses langues » ou « dans d’autres langues »
  rationale: Le grec ne permet pas, dans ce seul verset, de trancher entre des langues humaines identifiables et une autre forme de parole inspirée. Le texte principal préserve donc cette tension.
- issue: Venue de l’Esprit
  choice: « l’Esprit Saint vint sur eux »
  alternative: « l’Esprit Saint descendit sur eux »
  rationale: « Vint sur eux » suit le verbe grec sans introduire l’idée plus précise d’une descente ni tirer de conclusion sur le rapport doctrinal entre imposition des mains et venue de l’Esprit.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « imposer les mains » est conservée comme idiome biblique largement compréhensible. « Se mirent à parler ... et à prophétiser » rend fluidement les deux imparfaits coordonnés.
