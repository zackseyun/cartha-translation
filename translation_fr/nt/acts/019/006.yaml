- from: Lorsque Paul leur imposa les mains, l’Esprit Saint vint sur eux, et ils se mirent à parler en langues[a] et à prophétiser.
  to: Lorsque Paul leur imposa les mains, l’Esprit Saint vint sur eux, et ils parlaient en langues[a] et prophétisaient.
  rationale: La révision retire l’inchoatif explicite ajouté par « se mirent à » et rend les deux imparfaits coordonnés par des imparfaits français. Elle conserve l’expression biblique « parler en langues » sans trancher la nature des langues. La note est reformulée pour présenter l’alternative lexicale sans ajouter l’idée de langues « diverses ».
