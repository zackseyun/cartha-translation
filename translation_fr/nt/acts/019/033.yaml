  naturalness: « On fit avancer » est compréhensible, mais « des gens de la foule firent avancer » est plus naturel et plus proche de l’actif pluriel grec. « Présenter sa défense à l’assemblée » exprime mieux l’auditoire visé que « devant l’assemblée », sans perdre le cadre public.
  terminology: « Alexandre », « foule », « assemblée » et « défense » sont justes et de registre moderne. La note a doit cependant conserver clairement l’idée de provenance « de la foule » et ne pas présenter comme discuté le sens du seul premier verbe de manière imprécise.
