  text: ἐκ δὲ τοῦ ὄχλου ⸀συνεβίβασαν Ἀλέξανδρον προβαλόντων αὐτὸν τῶν Ἰουδαίων, ὁ δὲ Ἀλέξανδρος κατασείσας τὴν χεῖρα ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: fr
  text: Alors, des gens de la foule firent avancer Alexandre[a], les Juifs l’ayant mis en avant. Alexandre fit un geste de la main et voulait présenter sa défense à l’assemblée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens de la foule mirent Alexandre en avant, les Juifs l’ayant eux-mêmes mis en avant ». Le grec emploie deux verbes apparentés pour décrire la mise en avant publique d’Alexandre.
    reason: lexical_alternative
  - marker: b
    text: Ou « au peuple ». Le terme grec a ici un sens public ou civique et se distingue du mot rendu par « foule » au début du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: on fit avancer
  rationale: Dans ce contexte, avec Alexandre comme objet et la mention de la foule, le verbe désigne sa mise en avant publique plutôt qu’une instruction ou une explication. Le sujet grec restant indéterminé, « on » préserve cette indétermination.
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: les Juifs l’ayant poussé en avant
  rationale: Le génitif absolu précise les circonstances de sa mise en avant. Cette formulation conserve le lien étroit entre les deux verbes grecs sans nécessairement suggérer de violence.
- source_word: κατασείσας τὴν χεῖρα
  choice: fit alors un geste de la main
  rationale: L’expression décrit un geste destiné à attirer l’attention, probablement pour obtenir le silence, sans que cette finalité soit explicitement énoncée.
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: voulait présenter sa défense
  rationale: L’imparfait exprime une intention non réalisée dans le récit, tandis que « présenter sa défense » garde la nuance publique et défensive du verbe.
- source_word: τῷ δήμῳ
  choice: devant l’assemblée
  rationale: Le terme peut désigner le peuple réuni dans un cadre civique. « Assemblée » le distingue de la foule, ὄχλος, mentionnée au début du verset.
- source_word: ὄχλου
  choice: foule
  rationale: « Foule » rend naturellement la masse de personnes et maintient la distinction lexicale avec δῆμος.
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: Alexandre
  rationale: Forme française conventionnelle du nom propre grec.
