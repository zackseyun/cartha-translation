revisions:
- from: De la foule, on fit avancer Alexandre[a], les Juifs l’ayant poussé en avant. Alexandre fit alors un geste de la main et voulait présenter sa défense devant l’assemblée[b].
  to: Alors, des gens de la foule firent avancer Alexandre[a], les Juifs l’ayant mis en avant. Alexandre fit un geste de la main et voulait présenter sa défense à l’assemblée[b].
  rationale: La révision conserve l’ambiguïté quant à l’identité précise de ceux qui font avancer Alexandre, tout en rendant explicitement qu’ils proviennent de la foule. Elle maintient la relation étroite entre les deux verbes grecs de mise en avant, améliore l’équivalence de la note a, et rend le destinataire de la défense par « à l’assemblée ».
