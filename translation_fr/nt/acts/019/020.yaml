  text: οὕτως κατὰ κράτος ⸂τοῦ κυρίου ὁ λόγος⸃ ηὔξανεν καὶ ἴσχυεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: fr
  text: Ainsi, la parole du Seigneur se répandait avec puissance et s’imposait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ainsi, la parole du Seigneur croissait puissamment et gagnait en force. »'
    reason: La construction grecque peut décrire plus littéralement la croissance et la force de la parole; « avec puissance » peut se comprendre comme portant sur les deux verbes.
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit le résultat des événements précédents avec une formulation française naturelle et digne.
- source_word: κατὰ κράτος
  choice: avec puissance
  rationale: Cette locution exprime la force ou l’efficacité puissante; la tournure française peut porter sur l’ensemble des deux verbes sans réduire le sens à la seule croissance.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Conserve le titre grec sans expliciter son référent, même si le contexte suggère le Seigneur Jésus.
- source_word: ὁ λόγος
  choice: la parole
  rationale: Préserve l’expression récurrente de Luc pour la parole proclamée, tout en restant intelligible en français biblique moderne.
- source_word: ηὔξανεν
  choice: se répandait
  rationale: L’imparfait grec décrit un progrès continu. Dans ce contexte missionnaire, « se répandait » rend naturellement l’idée de croissance de la parole.
- source_word: ἴσχυεν
  choice: s’imposait
  rationale: Exprime la force effective et l’avancée victorieuse de la parole, sans suggérer qu’elle devenait seulement plus forte en elle-même.
theological_decisions:
- issue: Référent de « Seigneur » dans τοῦ κυρίου
  choice: Conserver « du Seigneur » sans ajouter « Jésus »
  alternative: du Seigneur Jésus
  rationale: Le contexte désigne très probablement Jésus, mais le grec ne porte que le titre « Seigneur »; la traduction maintient cette formulation et son degré d’explicitation.
translation_notes:
  register: Français international moderne, clair et digne. « Se répandait » et « s’imposait » rendent idiomatiquement la progression continue et efficace du message, tandis que la note conserve une formulation plus proche de la structure grecque.
