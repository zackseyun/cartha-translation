language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: fr
  text: 'Mais quelques-uns parmi les exorcistes juifs itinérants essayèrent eux aussi d’invoquer le nom du Seigneur Jésus sur ceux qui avaient des esprits mauvais[a]. Ils disaient : « Je vous adjure par Jésus[b], celui que Paul proclame[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui avaient les esprits mauvais »; c’est-à-dire des personnes sous leur emprise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je vous somme solennellement par Jésus »; le verbe évoque une adjuration ou une sommation sous serment.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « celui que Paul prêche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: essayèrent
  rationale: Le verbe exprime une tentative ou une entreprise; « essayèrent » est naturel en français moderne et n’implique pas la réussite.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: quelques-uns parmi les exorcistes juifs itinérants… eux aussi
  rationale: « Quelques-uns parmi » rend la construction partitive, « itinérants » le déplacement de lieu en lieu, et « eux aussi » conserve la valeur additive de καί.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: invoquer le nom … sur
  rationale: Dans ce contexte d’exorcisme, il ne s’agit pas seulement de prononcer le nom, mais d’y faire appel; « sur » préserve la relation exprimée par ἐπί.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: ceux qui avaient des esprits mauvais
  rationale: Cette formulation reste proche du grec, littéralement « ceux qui avaient les esprits mauvais », sans expliciter davantage l’idée de possession.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: le nom du Seigneur Jésus
  rationale: « Seigneur Jésus » conserve la valeur honorifique et christologique de κύριος dans une formulation française établie.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: Je vous adjure par Jésus
  rationale: « Adjurer par » rend précisément la sommation solennelle garantie par la personne nommée et convient au registre de la scène.
- source_word: ὃν Παῦλος κηρύσσει
  choice: celui que Paul proclame
  rationale: κηρύσσει décrit une proclamation publique; « proclame » est exact et moins exclusivement ecclésial que « prêche ».
theological_decisions:
- issue: Traduction de κύριος dans τοῦ κυρίου Ἰησοῦ
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » conserve le titre christologique usuel et sa portée théologique sans la réduire à une simple relation d’autorité humaine.
- issue: Degré d’explicitation de τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: ceux qui avaient des esprits mauvais
  alternative: ceux qui étaient possédés par des esprits mauvais
  rationale: Le grec dit qu’ils « avaient » des esprits mauvais. Bien que le contexte suggère une emprise démoniaque, le texte principal n’introduit pas le terme plus fort « possédés ».
- issue: Force de ὁρκίζω dans la formule d’exorcisme
  choice: Je vous adjure par Jésus
  alternative: Je vous commande solennellement au nom de Jésus
  rationale: « Adjurer » préserve l’idée de sommation sous serment et évite de transformer la construction grecque en formule « au nom de », déjà employée dans la proposition précédente.
translation_notes:
  register: Français international moderne, digne et accessible. « Exorcistes » et « adjure » conservent la précision du contexte; ce dernier terme, légèrement soutenu, convient à une formule solennelle. La longue phrase grecque est divisée en deux phrases pour une lecture naturelle, sans modifier son enchaînement logique.
