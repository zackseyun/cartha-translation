id: ACT.19.10
reference: Acts 19:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: fr
  text: Cela se poursuivit pendant deux ans, si bien que tous ceux qui habitaient l’Asie[a] entendirent la parole du Seigneur, Juifs comme Grecs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la province romaine d’Asie, dans l’ouest de l’Asie Mineure, et non du continent asiatique actuel.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: Cela se poursuivit
  rationale: Dans le contexte, l’expression renvoie à l’activité d’enseignement décrite au verset précédent et à sa durée. « Se poursuivit » rend naturellement cette continuité sans surinterpréter le verbe.
- source_word: ἐπὶ ἔτη δύο
  choice: pendant deux ans
  rationale: Avec une indication temporelle à l’accusatif, ἐπί exprime ici la durée. « Pendant deux ans » est la formulation française courante.
- source_word: ὥστε
  choice: si bien que
  rationale: ὥστε introduit le résultat de l’activité précédente. « Si bien que » en conserve clairement la valeur consécutive.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: tous ceux qui habitaient l’Asie
  rationale: Le participe substantivé désigne les personnes qui résidaient dans la région, tandis que πάντας en maintient la portée universelle. Une note précise le sens historique d’« Asie ».
- source_word: ἀκοῦσαι
  choice: entendirent
  rationale: L’infinitif aoriste après ὥστε exprime le résultat obtenu. « Entendirent » rend directement le grec.
- source_word: τὸν λόγον
  choice: la parole
  rationale: « La parole » conserve la terminologie récurrente de Luc pour le message proclamé et sa texture théologique.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le génitif dépend naturellement de « la parole ». « Seigneur » est le rendu français établi de κύριος dans ce contexte.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: Juifs comme Grecs
  rationale: Cette coordination française inclut nettement les deux groupes et préserve la portée juive et grecque soulignée dans les Actes.
theological_decisions:
- issue: Sens géographique d’« Asie »
  choice: La province romaine d’Asie, située dans l’ouest de l’Asie Mineure
  alternative: Le continent asiatique au sens moderne
  rationale: Dans les Actes, Ἀσία désigne régulièrement la province romaine. Le texte garde le nom propre « Asie », tandis que la note évite un contresens anachronique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure grecque tout en employant une expression consécutive naturelle. Le marqueur de note est placé après « Asie », terme qu’il explique.
