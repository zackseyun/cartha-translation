id: ACT.19.30
reference: Acts 19:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: fr
  text: Mais comme Paul voulait entrer au milieu de l’assemblée[a], les disciples l’en empêchaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’assemblée » ou « au milieu de la foule ». Dans ce contexte civique, le grec δῆμος peut désigner le corps public réuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ … βουλομένου
  choice: Mais comme Paul voulait
  rationale: La construction au génitif absolu exprime ici la volonté de Paul dans le cadre de l’action racontée. « Mais » rend le léger contraste marqué par δέ, et « comme … voulait » est naturel en français moderne.
- source_word: εἰσελθεῖν
  choice: entrer
  rationale: L’infinitif aoriste désigne simplement l’entrée envisagée; « entrer » est direct et idiomatique.
- source_word: εἰς τὸν δῆμον
  choice: au milieu de l’assemblée
  rationale: Dans ce contexte civique à Éphèse, δῆμος peut désigner le corps public rassemblé. « Au milieu de » exprime naturellement l’idée d’entrer parmi les personnes réunies sans réduire nécessairement le terme à une foule désordonnée.
- source_word: οὐκ εἴων αὐτὸν
  choice: les disciples l’en empêchaient
  rationale: L’imparfait εἴων présente une opposition en cours. « L’en empêchaient » transmet clairement qu’ils ne permettaient pas à Paul d’entrer.
- source_word: οἱ μαθηταί
  choice: les disciples
  rationale: Traduction directe de μαθηταί, sans ajouter un possessif absent du grec ni atténuer la notion de disciples.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « empêchaient » conserve l’aspect duratif de l’opposition des disciples; la note maintient l’ambiguïté contextuelle de δῆμος.
