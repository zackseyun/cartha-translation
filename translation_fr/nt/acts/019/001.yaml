id: ACT.19.1
reference: Acts 19:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: fr
  text: Il arriva que, pendant qu’Apollos était à Corinthe, Paul, après avoir traversé les régions de l’intérieur[a], vint à Éphèse et y trouva quelques disciples[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « les régions supérieures »; l’expression désigne probablement l’itinéraire intérieur à travers les hautes terres, par opposition à la route côtière.
    reason: lexical_alternative
  - marker: b
    text: Le texte ne précise pas ici de qui ils étaient disciples; les versets suivants indiquent qu’ils étaient associés au baptême de Jean.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Il arriva que
  rationale: Cette formule introduit un nouvel épisode narratif. « Il arriva que » en conserve la valeur sans ajouter un adverbe temporel absent du grec.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: pendant qu’Apollos était à Corinthe
  rationale: La construction avec l’infinitif articulé exprime ici la simultanéité; cette formulation est naturelle en français moderne.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: après avoir traversé les régions de l’intérieur
  rationale: Le participe aoriste présente cette traversée comme antérieure à l’arrivée à Éphèse. « Régions de l’intérieur » rend le sens géographique probable de ἀνωτερικά tout en signalant en note son sens plus littéral.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: vint à Éphèse
  rationale: Le verbe exprime le déplacement de Paul jusqu’à Éphèse; le passé simple convient au registre narratif suivi.
- source_word: καὶ εὑρεῖν
  choice: et y trouva
  rationale: L’adverbe « y » explicite naturellement en français que la rencontre eut lieu à Éphèse, sans ajouter d’information étrangère au contexte.
- source_word: τινας μαθητάς
  choice: quelques disciples
  rationale: τινας est indéfini et μαθητάς signifie « disciples ». La traduction ne précise pas de qui ils étaient disciples, conformément au grec.
theological_decisions:
- issue: Identité des μαθητάς
  choice: quelques disciples
  alternative: quelques disciples de Jean / quelques disciples de Jésus
  rationale: Le verset ne précise pas leur identité. Les versets suivants les associent au baptême de Jean, mais il ne faut pas anticiper cette clarification ni résoudre la tension présente dans le récit.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif soutenu mais courant dans l’écrit biblique. Le marqueur [a] est placé après l’expression qu’il explique, conformément au grec et au contenu de la note.
