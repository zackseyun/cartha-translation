source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: fr
  text: Et ce n’est pas seulement notre métier qui risque de tomber dans le discrédit, mais aussi le temple de la grande déesse Artémis, qui risque d’être tenu pour rien, et même sa majesté[b], elle que toute l’Asie et le monde habité[a] vénèrent, risque d’être abaissée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde ». Le grec désigne souvent le monde habité ou connu, particulièrement le vaste monde romain.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa magnificence » ou « sa grandeur ». La construction grecque est difficile et évoque l’abaissement ou la perte du rang élevé ou de la splendeur attribués à Artémis.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: risque de
  rationale: Rend directement l’idée présente de danger ou de risque et régit naturellement les infinitifs en français.
- source_word: τὸ μέρος
  choice: notre métier
  rationale: Dans le contexte, l’expression désigne le secteur d’activité des artisans; « notre métier » est naturel et conserve l’enjeu économique.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: tomber dans le discrédit
  rationale: Exprime le passage à une situation de déconsidération publique, sans réduire le sens à une simple perte financière.
- source_word: ἱερὸν
  choice: temple
  rationale: Désigne ici le célèbre sanctuaire d’Artémis à Éphèse; « temple » est le terme français le plus clair.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: être tenu pour rien
  rationale: Reproduit l’idée d’être considéré comme sans valeur ni importance, sans explicitation excessive.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: elle-même pourrait être dépouillée de sa majesté
  rationale: La syntaxe grecque est difficile et condensée. Cette formulation exprime la menace imminente d’un abaissement ou d’une perte de grandeur tout en préservant Artémis comme référent.
- source_word: ὅλη ἡ Ἀσία
  choice: toute l’Asie
  rationale: Conserve l’ampleur rhétorique et renvoie à l’Asie, notamment la province romaine du même nom.
- source_word: ἡ οἰκουμένη
  choice: le monde habité
  rationale: Rend explicitement le sens courant du terme grec, souvent le monde peuplé ou connu, particulièrement dans l’horizon romain.
- source_word: σέβεται
  choice: vénèrent
  rationale: Exprime une révérence religieuse cultuelle. « Vénérer » convient au discours rapporté concernant Artémis sans atténuer la portée religieuse.
theological_decisions:
- issue: Rendre le langage religieux païen sans l’atténuer ni l’approuver
  choice: la grande déesse Artémis ... elle que toute l’Asie et le monde habité vénèrent
  alternative: la prétendue grande déesse Artémis ... adorent
  rationale: Le texte rapporte les paroles de Démétrius selon son propre point de vue. Il ne contient aucun marqueur grec correspondant à « prétendue »; la traduction ne doit donc pas ajouter cette prise de distance.
- issue: Référent et construction de la perte de majesté
  choice: elle-même pourrait être dépouillée de sa majesté
  alternative: sa majesté pourrait être renversée
  rationale: Le grec lie de manière inhabituelle καθαιρεῖσθαι au génitif τῆς μεγαλειότητος αὐτῆς. Le choix français garde l’idée qu’Artémis subit une perte de grandeur, sans trancher plus précisément entre statut, splendeur et influence.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’ampleur rhétorique du discours de Démétrius tout en divisant clairement ses deux craintes. « Tenue pour rien » garde la vigueur de l’expression grecque; « dépouillée de sa majesté » rend naturellement sa construction condensée.
