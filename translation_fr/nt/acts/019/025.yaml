  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: fr
  text: 'Il les réunit, ainsi que les ouvriers qui travaillaient dans ce genre d’activités, et leur dit : « Messieurs, vous savez que c’est de cette activité que vient notre prospérité[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « c’est de ce métier que nous tirons notre richesse ».'
    reason: 'ἐργασία et εὐπορία peuvent recevoir ici des équivalents commerciaux plus précis : « métier » et « richesse ».'
lexical_decisions:
- source_word: συναθροίσας
  choice: Il les réunit
  rationale: Le participe aoriste exprime une action antérieure ou préparatoire au verbe principal. Cette formulation française est naturelle et conserve l’idée de rassembler le groupe.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: les ouvriers qui exerçaient des métiers semblables
  rationale: ἐργάτας désigne des travailleurs, et l’expression περὶ τὰ τοιαῦτα les rattache à des activités du même genre sans limiter le propos aux seuls fabricants mentionnés auparavant.
- source_word: Ἄνδρες
  choice: Messieurs
  rationale: Le vocatif s’adresse explicitement aux hommes présents. « Messieurs » est une adresse collective actuelle, naturelle et digne en français.
- source_word: ἐπίστασθε
  choice: vous savez
  rationale: Le verbe indique une connaissance déjà acquise; « vous savez » en donne l’équivalent direct et idiomatique.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: c’est de cette activité
  rationale: ἐργασία peut désigner le travail, l’activité professionnelle ou le commerce. « Activité » préserve cette amplitude dans le contexte économique.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: que vient notre prospérité
  rationale: εὐπορία exprime l’aisance ou la prospérité matérielle. La tournure française rend clairement la source de cette prospérité tout en respectant la construction grecque.
