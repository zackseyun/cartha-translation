id: ACT.19.22
reference: Acts 19:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: fr
  text: Après avoir envoyé en Macédoine deux de ceux qui étaient à son service, Timothée et Éraste, lui-même resta quelque temps en Asie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la province romaine d’Asie, située dans l’ouest de l’Asie Mineure, et non du continent actuel.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: Après avoir envoyé
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal; cette tournure rend clairement la succession des faits.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: La particule assure une transition narrative légère; en français, l’enchaînement est naturel sans connecteur ajouté.
- source_word: εἰς τὴν Μακεδονίαν
  choice: en Macédoine
  rationale: Avec un verbe d’envoi et le nom d’une région, «en Macédoine» exprime naturellement la destination en français moderne.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: deux de ceux qui étaient à son service
  rationale: Cette formulation conserve l’idée générale de service sans transformer ces personnes en titulaires d’une fonction ecclésiale précise.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: Timothée et Éraste
  rationale: Formes françaises traditionnelles et courantes de ces noms propres.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Conserve l’insistance du pronom grec et le contraste entre Paul et les deux hommes envoyés.
- source_word: ἐπέσχεν χρόνον
  choice: resta quelque temps
  rationale: Rend naturellement l’idée de demeurer pendant une durée non précisée.
- source_word: εἰς τὴν Ἀσίαν
  choice: en Asie
  rationale: Malgré la valeur directionnelle habituelle de εἰς, la construction avec ἐπέσχεν χρόνον a ici un sens locatif.
