source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: fr
  text: 'Mais le secrétaire de la ville, après avoir calmé la foule, déclara : « Hommes d’Éphèse, qui donc ignore que la ville d’Éphèse est la gardienne du temple de la grande Artémis[a] et de l’objet tombé du ciel[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chargée de la garde du temple de la grande Artémis ». Le terme grec désigne une ville reconnue comme gardienne d’un temple ou d’un culte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de ce qui est tombé du ciel ». Il s’agit probablement d’un objet cultuel associé à Artémis, mais le grec ne précise pas s’il s’agissait d’une statue, d’une image ou d’une pierre.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: καταστείλας
  choice: après avoir calmé
  rationale: Le participe aoriste marque une action antérieure à la prise de parole ; cette tournure rend naturellement la séquence en français.
- source_word: ὁ γραμματεὺς
  choice: le secrétaire de la ville
  rationale: Dans ce contexte civique, le terme désigne un haut fonctionnaire municipal, et non un scribe.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: Éphésiens
  rationale: Le vocatif français désigne directement les hommes de la cité de manière naturelle et solennelle, sans la lourdeur de « Hommes éphésiens ».
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: qui donc ignore
  rationale: Cette formulation française conserve la force de la question rhétorique et la valeur explicative de γάρ sans reproduire artificiellement l’idiome grec.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: la ville d’Éphèse
  rationale: C’est la désignation française naturelle de la cité ; elle exprime clairement le référent du génitif grec.
- source_word: νεωκόρον
  choice: la gardienne du temple
  rationale: Le terme qualifie une ville reconnue comme dépositaire et protectrice d’un temple ou d’un culte ; « gardienne du temple » est clair et idiomatique.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: de la grande Artémis
  rationale: La formulation conserve le titre cultuel attribué à la déesse dans le discours éphésien.
- source_word: τοῦ διοπετοῦς
  choice: de l’objet tombé du ciel
  rationale: L’adjectif substantivé désigne littéralement ce qui est réputé être tombé du ciel. « Objet » préserve mieux l’indétermination du grec que l’ajout de « statue » ou « image ».
theological_decisions:
- issue: Présentation de l’affirmation païenne concernant Artémis et le διοπετές
  choice: Rapporter sans réserve éditoriale la prétention religieuse du secrétaire, tout en conservant l’indétermination de l’objet tombé du ciel.
  alternative: « de la statue tombée du ciel » ou « de la pierre sacrée tombée du ciel »
  rationale: Le narrateur rapporte un discours civique et religieux sans nécessairement en garantir la vérité. Le grec ne nomme pas explicitement l’objet ; l’expliciter comme statue ou pierre résoudrait une ambiguïté authentique.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La déclaration garde le ton assuré d’un responsable municipal qui cherche à apaiser une assemblée. Les notes signalent les deux expressions cultuelles difficiles sans alourdir le corps du verset.
