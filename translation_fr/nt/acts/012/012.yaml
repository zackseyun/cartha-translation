id: ACT.12.12
reference: Acts 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: fr
  text: Après avoir pris conscience de la situation, il se rendit à la maison de Marie, la mère de Jean, que l’on appelait Marc[a]. Là, beaucoup de personnes s’étaient rassemblées et priaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aussi appelé Marc ». Le grec donne à Jean un nom supplémentaire sans exiger l’adverbe « aussi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδών
  choice: Après avoir pris conscience de la situation
  rationale: Le participe aoriste de συνοράω exprime ici la pleine prise de conscience de Pierre après le départ de l’ange. « La situation » explicite sobrement l’objet sous-entendu par le contexte, sans préciser davantage ce que le grec laisse implicite.
- source_word: τε
  choice: '[rendu par l’enchaînement narratif]'
  rationale: Cette particule assure une liaison légère avec ce qui précède. En français, l’enchaînement après la proposition participiale suffit et évite un « et » peu naturel en tête de phrase.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: il se rendit à la maison
  rationale: La tournure indique un déplacement vers un lieu. « Se rendit à » convient naturellement au point de vue narratif et « maison » désigne ici d’abord le bâtiment où le groupe est réuni.
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: de Marie, la mère de Jean
  rationale: La relation génitive est conservée explicitement afin d’identifier Marie.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: que l’on appelait Marc
  rationale: Le participe passif présent indique le nom supplémentaire sous lequel Jean était connu. Cette formulation française est claire sans ajouter dans le texte principal un adverbe absent du grec.
- source_word: οὗ
  choice: Là
  rationale: L’adverbe relatif renvoie à la maison de Marie. Une nouvelle phrase avec « Là » rend ce lien locatif de manière fluide et sans ambiguïté.
- source_word: ἱκανοὶ
  choice: beaucoup de personnes
  rationale: Au pluriel, ἱκανός désigne ici un nombre important. « Beaucoup de personnes » est naturel et évite de laisser le substantif humain entièrement implicite en français.
- source_word: συνηθροισμένοι
  choice: s’étaient rassemblées
  rationale: La construction périphrastique avec ἦσαν et le participe parfait décrit l’état résultant d’un rassemblement antérieur. Le plus-que-parfait français en restitue adéquatement la valeur.
- source_word: καὶ προσευχόμενοι
  choice: et priaient
  rationale: Le participe présent décrit la prière en cours pendant que les personnes se trouvaient réunies. L’imparfait exprime naturellement cette action continue.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; l’imparfait et le plus-que-parfait distinguent l’action en cours de l’état résultant du rassemblement. Le marqueur de note est placé après « Marc », expression à laquelle la note se rapporte.
