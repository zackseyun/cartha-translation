  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: fr
  text: Mais Pierre continuait à frapper à la porte[a]. Lorsqu’ils ouvrirent[b], ils le virent et furent stupéfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « persistait à frapper à la porte ».
