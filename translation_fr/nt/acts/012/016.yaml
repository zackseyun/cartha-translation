lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: continuait à frapper
  rationale: L’imparfait ἐπέμενεν exprime une action qui se prolonge, tandis que le participe κρούων en précise la nature. « Continuait à frapper » rend naturellement l’ensemble en français, dans le contexte d’une porte.
- source_word: ἀνοίξαντες
  choice: quand ils ouvrirent
  rationale: Le participe aoriste est rendu par une proposition temporelle qui marque clairement la succession des actions. Le complément « la porte » reste implicite, comme dans le grec.
- source_word: εἶδαν αὐτόν
  choice: ils le virent
  rationale: Traduction directe et naturelle du verbe de perception dans ce récit.
- source_word: ἐξέστησαν
  choice: furent stupéfaits
  rationale: Le verbe exprime un vif étonnement. « Furent stupéfaits » conserve cette intensité dans un français moderne et digne.
- source_word: δὲ
  choice: Mais / articulation non explicitée
  rationale: Le premier δέ marque le contraste avec la scène précédente et se traduit naturellement par « Mais ». Le second est rendu par l’enchaînement syntaxique de la phrase.
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom propre.
