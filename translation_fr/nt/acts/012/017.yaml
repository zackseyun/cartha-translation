source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: fr
  text: 'Mais, leur faisant signe de la main de se taire, il leur raconta comment le Seigneur l’avait fait sortir de la prison. Puis il dit : « Annoncez cela à Jacques et aux frères.[a] » Ensuite, il sortit et se rendit dans un autre lieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aux frères et sœurs » : le grec dit « aux frères », expression qui peut, selon le contexte, désigner l’ensemble de la communauté des croyants.'
    reason: Alternative lexicale et portée référentielle possible du masculin pluriel grec.
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: leur faisant signe de la main de garder le silence
  rationale: Cette formulation française naturelle conserve le geste physique ainsi que son but, sans préciser davantage la nature exacte du mouvement.
- source_word: διηγήσατο
  choice: il leur raconta
  rationale: Le verbe désigne un récit suivi des événements; « raconta » convient naturellement à Pierre relatant sa délivrance.
- source_word: πῶς
  choice: comment
  rationale: « Comment » introduit directement le contenu du récit et correspond à l’ambiguïté normale entre la manière et le fait raconté.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: La traduction traditionnelle et transparente conserve le titre sans trancher explicitement entre Jésus et Dieu comme référent.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: l’avait fait sortir de la prison
  rationale: Le plus-que-parfait marque clairement l’antériorité de la délivrance par rapport au récit de Pierre; « faire sortir » exprime l’action causative sans surinterprétation.
- source_word: Ἀπαγγείλατε
  choice: Annoncez
  rationale: L’impératif demande de transmettre une information importante; « annoncez » est digne, courant et plus direct que « faites un rapport ».
- source_word: Ἰακώβῳ
  choice: Jacques
  rationale: « Jacques » est la forme française conventionnelle du nom biblique Ἰάκωβος.
- source_word: τοῖς ἀδελφοῖς
  choice: aux frères
  rationale: La formulation reproduit le masculin pluriel grec; une note signale qu’il peut désigner plus largement la communauté croyante.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: il sortit et se rendit
  rationale: 'Les deux verbes grecs sont conservés sans répétition maladroite: Pierre quitte le lieu présent puis va ailleurs.'
- source_word: εἰς ἕτερον τόπον
  choice: dans un autre lieu
  rationale: Cette expression préserve le caractère indéfini du lieu et le registre narratif digne.
theological_decisions:
- issue: Référent de ὁ κύριος
  choice: le Seigneur
  alternative: le Seigneur Jésus; Dieu
  rationale: Le grec ne précise pas davantage le référent. La traduction conserve donc le titre et laisse subsister la possible référence au Christ ressuscité ou, plus largement, à Dieu comme agent de la délivrance.
- issue: Étendue référentielle de τοῖς ἀδελφοῖς
  choice: aux frères, avec note
  alternative: aux frères et sœurs; aux croyants
  rationale: Le texte porte un masculin pluriel qui peut désigner des hommes ou, selon l’usage et le contexte, un ensemble mixte de croyants. Le texte principal reste formellement proche du grec et la note préserve l’éventuelle portée inclusive.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste fluide; le discours direct est clairement marqué. Le vocabulaire évite aussi bien l’archaïsme que la paraphrase confessionnelle.
