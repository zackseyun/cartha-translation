  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: fr
  text: Après l’avoir arrêté, il le mit en prison et le confia à quatre escouades de soldats[a] chargées de le garder, avec l’intention de l’amener devant le peuple après la Pâque[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quatre groupes de quatre soldats », soit quatre unités composées chacune de quatre soldats.'
    reason: lexical_alternative
  - marker: b
    text: Le grec πάσχα désigne la Pâque juive. Certaines anciennes traductions anglaises rendent ce terme par « Easter ».
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: Après l’avoir arrêté
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. Cette formulation naturelle indique clairement que Pierre a été placé en état d’arrestation.
- source_word: ἔθετο εἰς φυλακήν
  choice: il le mit en prison
  rationale: Expression française idiomatique qui rend directement l’incarcération, dans un registre narratif digne et courant.
- source_word: παραδοὺς
  choice: le confia
  rationale: Le participe décrit le transfert de Pierre sous la garde des soldats. « Confia » exprime ici la remise à leur surveillance sans alourdir la phrase.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: à quatre escouades de soldats
  rationale: τετράδιον désigne un groupe de quatre. « Escouades » reste lisible dans le récit, tandis que leur composition exacte est précisée en note.
- source_word: φυλάσσειν αὐτόν
  choice: chargées de le garder
  rationale: L’infinitif indique la mission confiée aux soldats. Cette tournure s’intègre naturellement à la syntaxe française.
- source_word: βουλόμενος
  choice: Il avait l’intention
  rationale: La formule rend le projet délibéré d’Hérode sans accentuer indûment ni le désir personnel ni la certitude de sa réalisation.
- source_word: μετὰ τὸ πάσχα
  choice: après la Pâque
  rationale: πάσχα désigne la Pâque juive. Le singulier « la Pâque » la distingue en français de la fête chrétienne de Pâques.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: de l’amener devant le peuple
  rationale: Dans ce contexte public, ἀνάγω évoque le fait de faire sortir ou d’amener Pierre pour le présenter au peuple. La traduction évite de préciser un procès formel que le grec ne nomme pas explicitement.
- source_word: λαῷ
  choice: le peuple
  rationale: Terme courant et suffisamment large pour désigner ici la population réunie comme corps public.
theological_decisions:
- issue: Sens de πάσχα
  choice: la Pâque
  alternative: Pâques
  rationale: Le grec πάσχα désigne ici la fête juive de la Pâque. Le choix du singulier français suit le sens lexical du texte source et évite de l’identifier à la fête chrétienne de Pâques.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases ont été légèrement réorganisées pour éviter une accumulation pesante de participes, sans modifier la succession des actions ni le projet attribué à Hérode.
