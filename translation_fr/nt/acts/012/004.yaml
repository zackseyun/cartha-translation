  rationale: La révision conserve les choix source-fidèles du projet, tout en corrigeant la note sur πάσχα afin qu’elle décrive exactement le sens grec et l’alternative historique attestée dans l’audit. La syntaxe est légèrement resserrée pour rattacher explicitement l’intention d’Hérode à son action.
