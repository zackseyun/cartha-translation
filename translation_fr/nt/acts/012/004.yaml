    rationale: Le grec πάσχα désigne la Pâque. L’audit de référence relève spécifiquement le rendu anglais traditionnel « Easter », non une variante française ancienne « Pâques ». La note doit expliquer le sens grec et, si l’alternative historique est conservée, l’attribuer correctement à certaines traductions anglaises anciennes.
  - severity: low
    issue: « Il avait l’intention » détache légèrement βουλόμενος de l’action principale.
    rationale: Le participe grec exprime le dessein d’Hérode dans le cadre de l’emprisonnement. « avec l’intention de » restitue plus directement ce lien tout en restant idiomatique.
