id: ACT.12.10
reference: Acts 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: fr
  text: Après avoir franchi le premier poste de garde, puis le second, ils arrivèrent à la porte de fer qui donnait accès à la ville. Elle s’ouvrit d’elle-même devant eux[a]. Une fois sortis, ils avancèrent le long d’une rue[b], puis, aussitôt, l’ange s’éloigna de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elle s’ouvrit spontanément devant eux. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut signifier qu’ils avancèrent sur la distance d’une rue avant que l’ange ne s’éloigne.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: Après avoir franchi
  rationale: Le participe aoriste marque une action antérieure à l’arrivée devant la porte. Cette tournure rend clairement la succession des événements en français naturel.
- source_word: πρώτην φυλακὴν καὶ δευτέραν
  choice: le premier poste de garde, puis le second
  rationale: Dans ce contexte d’évasion, φυλακή désigne vraisemblablement des postes ou dispositifs de garde successifs. « Poste de garde » évite de faire croire qu’ils traversent deux prisons.
- source_word: πύλην τὴν σιδηρᾶν
  choice: la porte de fer
  rationale: Cette formulation française courante conserve l’insistance du texte sur le matériau de la porte.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: qui donnait accès à la ville
  rationale: Le participe décrit la destination ou l’accès assuré par la porte. La formulation est idiomatique et ne suggère pas que la porte elle-même se déplace.
- source_word: αὐτομάτη
  choice: d’elle-même
  rationale: Le mot indique que la porte s’ouvre sans intervention humaine visible. « D’elle-même » préserve le caractère extraordinaire du récit sans la connotation technologique moderne d’« automatiquement ».
- source_word: ἠνοίγη αὐτοῖς
  choice: s’ouvrit d’elle-même devant eux
  rationale: Le verbe passif grec et le datif sont rendus par une construction française naturelle qui présente l’ouverture comme se produisant en leur faveur et sur leur passage.
- source_word: ἐξελθόντες
  choice: Une fois sortis
  rationale: Cette proposition temporelle rend le participe aoriste et maintient la progression rapide du récit.
- source_word: προῆλθον ῥύμην μίαν
  choice: ils avancèrent le long d’une rue
  rationale: Cette formulation conserve l’image d’une progression dans une rue, tandis que la note signale que l’accusatif peut exprimer la distance parcourue.
- source_word: εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: puis, aussitôt, l’ange s’éloigna de lui
  rationale: « Aussitôt » traduit la soudaineté de la séquence, et « s’éloigna de lui » conserve la relation spatiale exprimée par ἀπό sans préciser davantage le mode de disparition.
theological_decisions:
- issue: Nature de l’ouverture de la porte
  choice: Elle s’ouvrit d’elle-même devant eux
  alternative: Elle s’ouvrit spontanément devant eux
  rationale: Le texte rapporte une ouverture sans intervention humaine visible mais n’en décrit pas le mécanisme. La traduction conserve le caractère miraculeux du contexte sans ajouter d’explication.
- issue: Sens de φυλακή
  choice: poste de garde
  alternative: garde
  rationale: Le contexte présente des points de surveillance successifs. « Poste de garde » explicite ce sens contextuel sans introduire l’idée de plusieurs prisons.
- issue: Portée de ῥύμην μίαν
  choice: le long d’une rue
  alternative: sur la distance d’une rue
  rationale: La construction peut évoquer soit leur progression dans une rue, soit une distance équivalant à une rue. Le texte principal reste naturel et la note préserve l’autre nuance.
- issue: Départ de l’ange
  choice: l’ange s’éloigna de lui
  alternative: l’ange le quitta
  rationale: La traduction garde la formulation spatiale sobre du grec et n’explicite ni disparition surnaturelle ni destination.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement segmentées pour la clarté, sans modifier l’ordre des événements. Les marqueurs [a] et [b] figurent dans le texte aux endroits auxquels se rapportent les notes.
