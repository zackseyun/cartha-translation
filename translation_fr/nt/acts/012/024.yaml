  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: fr
  text: Mais la parole de Dieu continuait de croître et de se multiplier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγος
  choice: parole
  rationale: « La parole de Dieu » conserve l’expression récurrente de Luc et la portée large du message divin proclamé. « Message » serait possible, mais réduirait l’écho de la formulation biblique.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif indique naturellement la parole qui vient de Dieu ou lui appartient.
- source_word: ηὔξανεν
  choice: continuait à se répandre
  rationale: L’imparfait exprime une progression durable. Avec « parole » comme sujet, « se répandre » rend naturellement l’idée d’une croissance de sa diffusion sans suggérer une augmentation matérielle.
- source_word: ἐπληθύνετο
  choice: à se multiplier
  rationale: Ce choix maintient le second verbe distinct du premier et conserve l’image audacieuse selon laquelle la parole se multiplie, c’est-à-dire gagne toujours davantage de terrain et produit des effets croissants.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste narratif entre la disparition d’Hérode et la progression continue de la parole de Dieu.
theological_decisions:
- issue: Rendre λόγος τοῦ θεοῦ par une expression traditionnelle ou plus explicite
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: « La parole de Dieu » préserve la formule lucanienne récurrente ainsi que ses résonances bibliques et proclamatoires, sans en limiter le sens au seul contenu d’un message.
translation_notes:
  register: Français international moderne, clair et digne. La tournure progressive restitue les deux imparfaits grecs. L’image de la parole qui « se multiplie » est volontairement conservée dans le texte principal, tandis que la note en explicite le sens contextuel.
