  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: fr
  text: 'L’ange lui dit : « Mets ta ceinture[a] et chausse tes sandales. » Il le fit. Puis l’ange lui dit[b] : « Mets ton manteau[c] et suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ceins-toi » ; l’ordre grec désigne le fait d’attacher sa ceinture pour être prêt.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il lui dit » au présent ; le grec emploie ici un présent historique qui rend le récit plus vivant.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Enveloppe-toi de ton manteau. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: l’ange
  rationale: Dans ce récit, il s’agit de l’être céleste apparu dans la prison ; « ange » convient mieux que le terme général « messager ».
- source_word: Ζῶσαι
  choice: Mets ta ceinture
  rationale: L’impératif désigne l’action de se ceindre, c’est-à-dire d’attacher sa ceinture afin d’être prêt. Cette formulation est claire et naturelle en français moderne.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: chausse tes sandales
  rationale: « Chausser ses sandales » exprime avec concision et naturel l’action demandée, tout en conservant l’objet précis.
- source_word: ἐποίησεν δὲ οὕτως
  choice: Il le fit
  rationale: Cette expression résume sobrement l’obéissance de Pierre aux deux ordres précédents.
- source_word: λέγει
  choice: Puis l’ange lui dit
  rationale: Le présent historique grec anime la narration, mais le passé simple est plus naturel dans un récit français suivi. Le sujet « l’ange » est répété pour éviter toute ambiguïté.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: Mets ton manteau
  rationale: Le verbe évoque le fait de placer le vêtement autour de soi, et ἱμάτιον désigne ici le vêtement extérieur. « Mets ton manteau » rend naturellement l’action dans ce contexte.
- source_word: ἀκολούθει μοι
  choice: suis-moi
  rationale: Cette traduction directe conserve le sens concret du déplacement ainsi que le vocabulaire néotestamentaire récurrent de la suite.
