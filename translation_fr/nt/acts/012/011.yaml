id: ACT.12.11
reference: Acts 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: fr
  text: 'Alors Pierre, revenu à lui-même[a], dit : « Maintenant, je sais avec certitude que le Seigneur a envoyé son ange et m’a délivré du pouvoir d’Hérode[b] et de tout ce que le peuple juif attendait[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant repris ses esprits ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de la main d’Hérode »; la « main » représente ici le pouvoir ou l’emprise.
    reason: cultural_note
  - marker: c
    text: Littéralement « de toute l’attente du peuple des Juifs ». Il s’agit de tout ce que le peuple juif s’attendait à voir arriver à Pierre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: revenu à lui-même
  rationale: Cette expression conserve l’image grecque tout en étant idiomatique en français; elle indique que Pierre retrouve sa pleine conscience après une expérience qui lui semblait être une vision.
- source_word: ἀληθῶς
  choice: avec certitude
  rationale: Dans « je sais avec certitude », cette formulation rend naturellement l’assurance emphatique exprimée par l’adverbe.
- source_word: ἐξαπέστειλεν
  choice: a envoyé
  rationale: Le verbe composé signifie ici envoyer; « a envoyé » est naturel et n’alourdit pas inutilement la phrase.
- source_word: κύριος
  choice: le Seigneur
  rationale: Cette traduction maintient le titre grec sans préciser davantage son référent, que le verset ne nomme pas explicitement.
- source_word: ἄγγελον
  choice: ange
  rationale: Le récit désigne clairement un être céleste plutôt qu’un simple messager humain.
- source_word: ἐξείλατό με
  choice: m’a délivré
  rationale: Le verbe exprime une intervention qui arrache Pierre au danger; « délivré » convient au registre narratif biblique tout en restant courant.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: du pouvoir d’Hérode
  rationale: La « main » est ici une image sémitique désignant le pouvoir ou l’emprise. La formulation explicite le sens en français naturel.
- source_word: πάσης τῆς προσδοκίας
  choice: de tout ce que … attendait
  rationale: La tournure française exprime naturellement l’objet de l’attente, c’est-à-dire le sort que la population pensait voir infligé à Pierre, sans préciser ce résultat au-delà du grec.
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: le peuple juif
  rationale: Cette formulation française naturelle rend exactement le groupe désigné, sans reproduire la structure génitivale peu idiomatique du grec.
theological_decisions:
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: Dieu; Jésus ressuscité
  rationale: Le grec ne précise pas le référent dans ce verset. « Le Seigneur » préserve cette indétermination et évite de trancher une tension théologique que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est fluide sans effacer les images importantes du grec; l’idiome de la « main » est expliqué en note, et l’ambiguïté du titre « le Seigneur » est conservée.
