  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: fr
  text: 'Mais ils lui dirent : « Tu es folle ! » Elle insistait pourtant : c’était bien le cas. Mais ils continuaient à dire : « C’est son ange[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « son ange gardien », « un ange qui le représente » ou, selon certains interprètes, « son esprit » ou « son fantôme ». Le grec dit simplement « son ange ».
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: Tu as perdu la tête !
  rationale: Cette expression française courante rend naturellement l’accusation idiomatique de folie, sans le ton archaïque de « Tu es folle » ni une formulation clinique.
- source_word: διϊσχυρίζετο
  choice: soutenait avec insistance
  rationale: L’imparfait et la force du verbe expriment une affirmation persistante et énergique.
- source_word: οὕτως ἔχειν
  choice: que c’était bien vrai
  rationale: Cette tournure française naturelle rend l’idée que les choses étaient effectivement comme elle l’affirmait.
- source_word: ἔλεγον
  choice: ils répétaient
  rationale: L’imparfait grec peut évoquer une parole répétée ou prolongée ; « répétaient » restitue cet aspect dans le contexte.
- source_word: ἄγγελός
  choice: ange
  rationale: Dans ce contexte, le terme désigne vraisemblablement un être céleste plutôt qu’un simple messager humain, tout en laissant inexpliquée sa relation précise avec Pierre.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif français rend directement et naturellement le génitif grec.
theological_decisions:
- issue: Sens de « son ange »
  choice: Conserver littéralement « son ange » dans le texte principal.
  alternative: Son ange gardien ; un ange qui le représente ; son esprit ou son fantôme.
  rationale: Le grec dit seulement « son ange » et n’explicite pas la croyance des personnages. Une traduction non développée préserve l’ambiguïté et évite d’imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue garde sa vivacité, tandis que les imparfaits grecs sont rendus par des formulations exprimant la persistance ou la répétition.
