translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe narrative reste concise; « porte de l’entrée » décrit naturellement l’accès extérieur d’une maison. Le marqueur de note est placé après le nom afin de rattacher la note au groupe qui identifie la jeune servante.
