  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: fr
  text: Quand il frappa à la porte de l’entrée, une jeune servante[a] nommée Rhode vint répondre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une jeune esclave ». Le grec παιδίσκη peut désigner une jeune domestique ou une esclave ; ici, « jeune servante » met en avant sa fonction dans la maison sans préciser son statut juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: Quand il frappa
  rationale: Le participe aoriste avec δέ fait avancer le récit et situe l’action suivante dans le temps. « Quand il frappa » est naturel en français et conserve cette valeur temporelle.
- source_word: θύραν τοῦ πυλῶνος
  choice: la porte de l’entrée
  rationale: θύρα désigne la porte, tandis que πυλών évoque l’entrée extérieure ou le passage d’accès d’une maison. Cette formulation conserve les deux éléments sans suggérer une porte de ville.
- source_word: προσῆλθε
  choice: vint
  rationale: Dans cette scène domestique, « vint » rend naturellement l’idée de s’approcher; l’infinitif qui suit en indique le but.
- source_word: παιδίσκη
  choice: une jeune servante
  rationale: Le terme peut désigner une jeune femme employée comme domestique ou une esclave. « Jeune servante » exprime son âge et sa fonction dans la maison sans trancher son statut juridique.
- source_word: ὑπακοῦσαι
  choice: répondre
  rationale: Bien que le verbe puisse signifier écouter ou obéir, dans le contexte d’une personne qui frappe à une porte, il signifie idiomatiquement venir répondre.
- source_word: ὀνόματι Ῥόδη
  choice: nommée Rhodè
  rationale: Le datif ὀνόματι introduit le nom. « Nommée » est idiomatique, et « Rhodè » transcrit le grec Ῥόδη en marquant sa voyelle finale.
