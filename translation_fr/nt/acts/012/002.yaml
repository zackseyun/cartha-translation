  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: fr
  text: Et il tua Jacques[a], le frère de Jean, avec l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fit mourir » ou « exécuta ». Le grec dit qu’Hérode tua Jacques ; le contexte plus large peut suggérer une exécution officielle.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: fit mourir
  rationale: Dans ce contexte, ἀναιρέω signifie causer la mort. « Fit mourir » exprime clairement l’action d’Hérode sans préciser davantage que le grec s’il s’agissait formellement d’une exécution judiciaire.
- source_word: δὲ
  choice: Puis
  rationale: δέ assure ici la progression du récit. « Puis » rend naturellement cet enchaînement sans introduire un contraste marqué.
- source_word: Ἰάκωβον
  choice: Jacques
  rationale: Forme française traditionnelle et courante du nom biblique Ἰάκωβος.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: le frère de Jean
  rationale: Cette apposition identifie Jacques et suit de près la structure grecque dans un français naturel.
- source_word: μαχαίρῃ
  choice: par l’épée
  rationale: Le datif est instrumental et μάχαιρα désigne une épée ou une épée courte. « Par l’épée » conserve l’image concrète et peut naturellement évoquer la mise à mort sans imposer une procédure juridique précise.
theological_decisions:
- issue: Nature de l’acte d’Hérode
  choice: « fit mourir » sans qualifier explicitement l’acte d’exécution judiciaire
  alternative: « exécuta Jacques » ou « tua Jacques »
  rationale: Le verbe indique qu’Hérode causa la mort de Jacques, et μαχαίρῃ en précise le moyen. Le contexte plus large peut suggérer une exécution officielle, mais ce verset ne met pas explicitement l’accent sur la procédure judiciaire. « Fit mourir » préserve cette réserve.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la syntaxe grecque tout en étant naturelle ; elle évite de surinterpréter la dimension juridique de la mise à mort.
