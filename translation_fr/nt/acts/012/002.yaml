  verdict: revise
  source_fidelity: 'Le verbe actif ἀνεῖλεν décrit directement l’action d’Hérode : il tua Jacques. « Fit mourir » est possible dans certains contextes, mais sa tournure causative atténue inutilement l’agentivité directe exprimée par le grec. δέ est rendu plus sobrement par « Et », sans imposer une succession temporelle plus marquée. « Avec l’épée » rend clairement le datif instrumental μαχαίρῃ.'
  naturalness: « Et il tua Jacques, le frère de Jean, avec l’épée » est naturel, sobre et conforme au registre narratif biblique en français international moderne. « Puis » et « fit mourir » sont compréhensibles, mais moins directement alignés sur le grec.
  terminology: Les noms « Jacques » et « Jean » sont les formes françaises établies. « Tua » ne préjuge pas d’une procédure judiciaire; « exécuta » reste donc, au mieux, une possibilité contextuelle à signaler en note.
