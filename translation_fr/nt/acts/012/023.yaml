id: ACT.12.23
reference: Acts 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: fr
  text: Aussitôt, un ange du Seigneur le frappa, parce qu’il n’avait pas rendu gloire à Dieu. Devenu la proie des vers, il mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: L’adverbe exprime une action sans délai; « Aussitôt » restitue naturellement la soudaineté du jugement.
- source_word: ἐπάταξεν
  choice: frappa
  rationale: Le verbe signifie frapper. « Frappa » évite de préciser prématurément qu’il fut tué, puisque la mort est mentionnée à la fin du verset.
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise ici l’indéfini; « Seigneur » conserve le titre.
- source_word: ἀνθ’ ὧν
  choice: parce que
  rationale: L’expression introduit la cause du jugement et se rend clairement en français par « parce que ».
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: il n’avait pas rendu à Dieu la gloire qui lui était due
  rationale: « Rendre gloire à Dieu » est idiomatique en français; l’ajout explicatif « qui lui était due » fait ressortir la valeur déterminée de τὴν δόξαν sans suggérer que toute la gloire divine pourrait être donnée par un humain.
- source_word: γενόμενος σκωληκόβρωτος
  choice: Rongé par les vers
  rationale: La formulation adjectivale et participiale reste concise et vive, tout en étant plus naturelle que le calque « devenu mangé par les vers ».
- source_word: ἐξέψυξεν
  choice: il mourut
  rationale: Le verbe signifie expirer ou mourir; « il mourut » est clair, digne et naturel.
theological_decisions:
- issue: Nature et déroulement du jugement
  choice: Le texte présente la mort d’Hérode comme un jugement divin exécuté par un ange, puis mentionne qu’il fut rongé par les vers et mourut, sans imposer une chronologie médicale précise.
  alternative: Comprendre la description comme une mort purement naturelle exprimée en langage religieux, ou comme une mort instantanée au moment où l’ange le frappe.
  rationale: Le grec attribue explicitement le coup à un ange du Seigneur et en donne la cause. La construction participiale ne permet toutefois pas de fixer davantage le rapport temporel ou médical entre le coup, l’état décrit et la mort.
translation_notes:
  register: Français international moderne, narratif et digne. « Aussitôt » garde la vigueur du récit; « rongé par les vers » évite un calque maladroit. Le plus-que-parfait « n’avait pas rendu » marque naturellement en français la faute antérieure qui motive le jugement. Le marqueur [a] figure dans le texte.
