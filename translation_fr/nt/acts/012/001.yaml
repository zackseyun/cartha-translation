source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: fr
  text: Vers cette époque[a], le roi Hérode s’en prit à certains membres de l’Église pour les maltraiter[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « À cette époque » ou « Aux environs de cette époque ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « porta les mains sur ». L’expression désigne ici une action hostile contre certains membres de l’Église.
    reason: lexical_alternative
  - marker: c
    text: Ou « leur faire du mal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: Vers cette époque
  rationale: κατά avec l’accusatif dans cette indication temporelle situe l’action vers ou aux environs de cette époque. « Vers cette époque » est naturel en français et conserve cette approximation. La légère transition marquée par δέ n’exige pas ici de mot distinct.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: mit la main sur
  rationale: L’expression grecque décrit une intervention hostile. « Mettre la main sur » conserve l’image corporelle tout en évoquant naturellement en français le fait de saisir ou de capturer quelqu’un, sans limiter explicitement l’action à une arrestation formelle.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: le roi Hérode
  rationale: C’est l’ordre idiomatique en français moderne pour le nom accompagné du titre royal.
- source_word: κακῶσαί
  choice: afin de les maltraiter
  rationale: Le verbe signifie causer du tort ou infliger de mauvais traitements. « Maltraiter » rend l’action hostile sans introduire nécessairement la notion plus technique de persécution religieuse.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: certains membres de l’Église
  rationale: Le grec désigne certaines personnes appartenant à la communauté chrétienne. L’ajout explicatif de « membres » produit un français naturel sans suggérer qu’elles venaient simplement d’un bâtiment.
theological_decisions:
- issue: Traduction de ἐκκλησία
  choice: Église
  alternative: assemblée ; communauté
  rationale: Dans ce contexte des Actes, le terme désigne la communauté chrétienne. « Église » est la désignation française courante; la majuscule souligne ici la communauté de croyants plutôt qu’un édifice, sans imposer une structure confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de l’expression grecque tout en restant idiomatique; elle évite à la fois le tour archaïque et la précision excessive d’« arrêter » ou de « persécuter ».
