  source_fidelity: « Vers cette époque » rend correctement l’approximation temporelle de κατ’ ἐκεῖνον τὸν καιρόν; l’absence de rendu explicite de δέ est acceptable en français. « Le roi Hérode », « certains membres de l’Église » et « les maltraiter » correspondent bien au grec. En revanche, « mettre la main sur » signifie habituellement en français retrouver, capturer ou se saisir de quelqu’un; il restreint donc indûment l’expression grecque, qui désigne plus largement une action hostile.
  naturalness: La phrase est claire et de registre moderne. « S’en prit à » est idiomatique et exprime l’hostilité sans imposer une arrestation; il évite aussi l’image française ambiguë de « mettre la main sur ».
