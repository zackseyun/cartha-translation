base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: fr
  text: Hérode le rechercha, mais ne le trouva pas. Après avoir interrogé les gardes, il ordonna qu’on les emmène pour les exécuter.[a] Puis il descendit de la Judée à Césarée, où il séjourna quelque temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ordonna qu’on les emmène ». Dans ce contexte, cela signifie probablement qu’ils furent emmenés pour être exécutés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν
  choice: le fit rechercher, mais on ne le trouva pas
  rationale: Cette formulation française naturelle exprime la recherche décidée par Hérode et son échec, tout en gardant l’antériorité des participes par rapport à l’interrogatoire.
- source_word: ἀνακρίνας
  choice: après avoir interrogé
  rationale: Dans ce cadre officiel, le verbe désigne un interrogatoire ou un examen mené pour établir les faits; « interrogé » rend clairement cette nuance judiciaire.
- source_word: τοὺς φύλακας
  choice: les gardes
  rationale: Désigne les hommes chargés de surveiller Pierre; « les gardes » est l’équivalent moderne le plus clair.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: il ordonna qu’on les emmène pour les exécuter
  rationale: Le grec dit littéralement qu’ils doivent être emmenés. Dans ce contexte judiciaire, l’expression implique très probablement leur mise à mort; la traduction explicite cette portée tout en signalant la formulation littérale en note.
- source_word: κατελθὼν ἀπὸ τῆς Ἰουδαίας εἰς Καισάρειαν
  choice: il descendit de la Judée à Césarée
  rationale: « Descendit » conserve l’expression géographique grecque du déplacement vers la ville côtière de Césarée.
- source_word: διέτριβεν
  choice: où il séjourna
  rationale: L’imparfait grec indique un séjour qui se prolonge; « séjourna » le rend avec concision dans un registre narratif digne.
theological_decisions:
- issue: Faut-il traduire ἀπαχθῆναι littéralement ou expliciter la peine sous-entendue?
  choice: il ordonna qu’on les emmène pour les exécuter
  alternative: il ordonna qu’on les emmène
  rationale: Le verbe grec ne nomme pas explicitement l’exécution, mais le contexte des gardes responsables d’un prisonnier évadé indique très probablement une condamnation à mort. Le texte principal communique ce sens probable, tandis que la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement restructurée pour éviter une accumulation pesante de participes, sans changer l’ordre des événements. Le marqueur [a] est placé immédiatement après la proposition concernée.
