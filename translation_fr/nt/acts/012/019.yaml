  verdict: revise
  source_fidelity: La première proposition du brouillon (« le fit rechercher, mais on ne le trouva pas ») transforme l’action personnelle d’Hérode exprimée par les deux participes grecs en une recherche déléguée et en une tournure impersonnelle. Le grec présente Hérode comme sujet de la recherche, de l’échec, de l’interrogatoire et de l’ordre. Le reste rend correctement la séquence, l’interrogatoire des gardes, le déplacement de Judée à Césarée et le séjour qui s’ensuit. L’explicitation de l’exécution est contextuellement probable, à condition que la note maintienne clairement le libellé moins explicite du grec.
  naturalness: Le français est globalement clair et d’un registre narratif approprié. « Hérode le rechercha, mais ne le trouva pas » est à la fois plus direct, plus naturel et plus proche de la syntaxe du texte source. « Il y séjourna quelque temps » rend plus naturellement la valeur durative de l’imparfait διέτριβεν que le simple passé composé/passé simple narratif « où il séjourna », sans surtraduire sa durée.
  terminology: « Hérode », « Judée », « Césarée », « gardes » et « interroger » conviennent au français international moderne. La note sur « emmener » préserve utilement l’ambiguïté lexicale de ἀπαχθῆναι, tandis que « pour les exécuter » communique son sens contextuel probable sans en faire une certitude dans la note.
