source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: fr
  text: Il était très irrité contre les habitants de Tyr et de Sidon[a]. Mais ceux-ci vinrent le trouver d’un commun accord et, après avoir persuadé Blastus, le responsable de la chambre du roi[b], ils sollicitaient la paix, car leur pays recevait son approvisionnement alimentaire du territoire royal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « était profondément hostile aux habitants de Tyr et de Sidon ». Le terme grec exprime une colère intense ou une vive hostilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui qui était préposé à la chambre du roi », probablement un officier de cour ayant accès aux appartements privés du roi.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « car leur région était ravitaillée par le territoire du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: était violemment irrité contre
  rationale: Le participe exprime une colère intense qui se manifeste comme une attitude hostile. Cette formulation conserve à la fois la force de l’émotion et son orientation contre les populations concernées.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: les habitants de Tyr et de Sidon
  rationale: Les adjectifs ethniques grecs désignent ici les populations de ces deux villes. Cette tournure est plus naturelle en français moderne que des gentilés rares.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: L’adverbe souligne l’unité d’intention et d’action, et non leur seule présence collective.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: vinrent le trouver
  rationale: La formule exprime le fait de se présenter auprès de lui. La traduction est idiomatique tout en conservant le mouvement vers le roi.
- source_word: πείσαντες
  choice: après avoir gagné à leur cause
  rationale: Le participe aoriste présente cette démarche auprès de Blastus comme antérieure à leur requête. Le contenu exact de la persuasion n’est pas formulé, mais le contexte indique qu’ils obtiennent son appui.
- source_word: Βλάστον
  choice: Blastus
  rationale: Le nom propre est translittéré selon son équivalent français traditionnel.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: l’intendant de la chambre du roi
  rationale: L’expression désigne littéralement le responsable de la chambre royale, donc un officier de cour ayant vraisemblablement accès aux appartements privés du roi.
- source_word: ᾐτοῦντο εἰρήνην
  choice: ils sollicitaient la paix
  rationale: L’imparfait grec présente une demande en cours ou insistante. « Sollicitaient » convient au caractère diplomatique de la démarche.
- source_word: διὰ τὸ τρέφεσθαι
  choice: car … tirait sa subsistance
  rationale: La construction avec διά et l’infinitif articulé introduit la cause. La formulation française exprime la dépendance alimentaire sans suggérer que le territoire lui-même serait littéralement nourri.
- source_word: αὐτῶν τὴν χώραν
  choice: leur pays
  rationale: χώρα peut désigner un pays, une région ou un territoire. « Leur pays » convient ici à la zone de Tyr et de Sidon envisagée dans sa dépendance économique.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: du territoire royal
  rationale: L’adjectif substantivé désigne vraisemblablement le territoire appartenant au roi ou placé sous son autorité. « Territoire royal » restitue cette ellipse sans répétition maladroite.
