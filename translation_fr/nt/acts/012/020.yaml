revisions:
- from: Il était violemment irrité contre les habitants de Tyr et de Sidon[a]. Mais ceux-ci vinrent le trouver d’un commun accord et, après avoir gagné à leur cause Blastus, l’intendant de la chambre du roi[b], ils sollicitaient la paix, car leur pays tirait sa subsistance du territoire royal[c].
  to: Il était très irrité contre les habitants de Tyr et de Sidon[a]. Mais ceux-ci vinrent le trouver d’un commun accord et, après avoir persuadé Blastus, le responsable de la chambre du roi[b], ils sollicitaient la paix, car leur pays recevait son approvisionnement alimentaire du territoire royal[c].
  rationale: La révision retire l’implication supplémentaire selon laquelle Blastus aurait été gagné à leur cause, et explicite l’approvisionnement alimentaire dont dépendait leur territoire. Elle conserve l’aspect imperfectif de « sollicitaient », l’unité d’intention de « d’un commun accord » et la sobriété de l’expression grecque relative à Blastus.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:10:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens général sont bien rendus : hostilité d’Hérode, démarche concertée, intervention préalable auprès de Blastus, demande de paix et dépendance alimentaire. Toutefois, « gagner à leur cause » explicite indûment que Blastus a adhéré à leur parti ; πείσαντες dit seulement qu’ils l’ont persuadé. « Tirait sa subsistance » est compréhensible, mais le grec présente leur territoire comme recevant un approvisionnement alimentaire venant du territoire royal.'
  naturalness: Le français est globalement naturel et de registre approprié. « Très irrité contre » est plus idiomatique et plus sobre que « violemment irrité contre », tout en conservant la force hostile du terme grec.
  terminology: Les noms de Tyr, Sidon et Blastus sont cohérents. « Responsable de la chambre du roi » rend avec prudence la fonction de Blastus sans lui attribuer une charge administrative trop précise. « Territoire royal » restitue convenablement le substantif elliptique βασιλική.
  issues:
  - severity: medium
    issue: « après avoir gagné à leur cause Blastus »
    rationale: Cette expression implique qu’ils ont obtenu l’adhésion ou le soutien politique de Blastus. Le participe πείσαντες signifie simplement « ayant persuadé / convaincu » et ne précise pas ce qu’ils lui ont fait accepter.
  - severity: low
    issue: « leur pays tirait sa subsistance du territoire royal »
    rationale: La formulation est idiomatique, mais elle atténue la construction passive τρέφεσθαι et peut élargir « nourriture/approvisionnement » à toute subsistance. Une formulation explicite sur l’approvisionnement alimentaire est plus proche du grec.
  revised_text: Il était très irrité contre les habitants de Tyr et de Sidon[a]. Mais ceux-ci vinrent le trouver d’un commun accord et, après avoir persuadé Blastus, le responsable de la chambre du roi[b], ils sollicitaient la paix, car leur pays recevait son approvisionnement alimentaire du territoire royal[c].
