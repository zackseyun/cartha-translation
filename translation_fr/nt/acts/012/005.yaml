id: ACT.12.5
reference: Acts 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: fr
  text: Pierre était donc gardé en prison, mais l’Église priait Dieu avec ferveur[a] pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans relâche » ; l’adverbe grec peut souligner l’intensité ou la persévérance dans la prière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: était gardé
  rationale: L’imparfait passif exprime une action continue. « Était gardé » conserve la voix passive et convient naturellement au contexte carcéral.
- source_word: ἐν τῇ φυλακῇ
  choice: dans la prison
  rationale: Le groupe prépositionnel désigne le lieu précis où Pierre était détenu; « prison » relève d’un français courant et digne.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: priait
  rationale: La tournure périphrastique exprime une activité en cours. En français, le verbe à l’imparfait rend cette continuité plus naturellement qu’un calque passif tel que « une prière était faite ».
- source_word: ἐκτενῶς
  choice: avec ferveur
  rationale: L’adverbe peut souligner l’intensité ou la persévérance. « Avec ferveur » exprime clairement l’intensité de la prière, tandis qu’une note conserve l’autre nuance possible.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: l’Église
  rationale: Le terme désigne ici la communauté chrétienne. La restructuration active, « l’Église priait », est naturelle en français et maintient cette communauté comme agent de la prière.
- source_word: πρὸς τὸν θεὸν
  choice: priait Dieu
  rationale: En français moderne, « prier Dieu » exprime idiomatiquement la direction de la prière sans qu’il soit nécessaire d’ajouter « à ».
- source_word: περὶ αὐτοῦ
  choice: pour lui
  rationale: Dans ce contexte d’intercession, « pour lui » rend directement et naturellement le sens de περί avec le génitif.
- source_word: μὲν οὖν ... δὲ
  choice: donc ... mais
  rationale: Ces particules assurent la progression narrative tout en opposant légèrement l’emprisonnement de Pierre à la prière de l’Église.
theological_decisions:
- issue: Traduction de ἐκκλησία
  choice: l’Église
  alternative: l’assemblée / la communauté
  rationale: Le mot désigne la communauté chrétienne qui prie pour Pierre. « Église » est le terme français établi dans le récit des Actes, sans imposer ici une structure institutionnelle ultérieure.
- issue: Portée de ἐκτενῶς
  choice: avec ferveur
  alternative: sans relâche / avec persévérance
  rationale: Le contexte permet une nuance d’intensité aussi bien que de persistance. Le texte retient l’intensité sans exclure l’autre nuance, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La construction grecque passive et périphrastique concernant la prière est rendue par une phrase active idiomatique, sans perte de l’aspect continu exprimé par l’imparfait.
