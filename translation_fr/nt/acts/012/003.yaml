  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: fr
  text: Quand il vit que cela plaisait aux Juifs[a], il fit arrêter Pierre, lui aussi. (C’étaient les jours des pains sans levain[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Judéens » ou, si l’on restreint le sens d’après le contexte, « aux chefs juifs ». Le terme grec peut avoir ces sens dans certains contextes, mais ici le texte dit simplement « aux Juifs ».
    reason: lexical_alternative
  - marker: b
    text: Les « pains sans levain » désignent une fête juive pendant laquelle on mangeait du pain sans levain.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Quand il vit
  rationale: 'Le participe aoriste a ici une valeur circonstancielle temporelle : Hérode constate d’abord la réaction, puis agit. Cette formulation est naturelle en français et conserve cette succession.'
- source_word: ἀρεστόν ἐστιν
  choice: cela plaisait
  rationale: Cette tournure française rend naturellement l’idée de ce qui est agréable ou favorablement accueilli, sans alourdir la phrase par un calque impersonnel.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Le grec emploie le terme général Ἰουδαῖοι sans préciser ici qu’il s’agit des chefs ni restreindre explicitement le groupe aux Judéens.
- source_word: προσέθετο συλλαβεῖν
  choice: il fit aussi arrêter
  rationale: Dans cette construction avec infinitif, προστίθημι exprime le fait de poursuivre en accomplissant une action supplémentaire. En français, « fit arrêter » rend clairement l’arrestation ordonnée par Hérode, et « aussi » porte naturellement la valeur additive de l’ensemble de l’énoncé.
- source_word: καὶ Πέτρον
  choice: aussi … Pierre
  rationale: καί ajoute Pierre à Jacques comme nouvelle cible d’Hérode. La place de « aussi » avant l’infinitif est idiomatique en français et maintient cette valeur additive.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: C’était alors la période des pains sans levain
  rationale: La proposition parenthétique situe l’événement pendant la célébration juive désignée littéralement par les « jours des pains sans levain ». « La période » est fluide en français tout en conservant le nom distinctif de la fête.
theological_decisions:
- issue: Sens de Ἰουδαίοις dans les Actes
  choice: aux Juifs
  alternative: aux Judéens ; aux chefs juifs
  rationale: Le texte ne limite pas explicitement le référent à une région ou aux autorités. Le terme général est donc conservé, tandis qu’une note signale les autres valeurs possibles sans imposer une interprétation plus étroite.
- issue: Désignation de τῶν ἀζύμων
  choice: des pains sans levain
  alternative: de la Pâque
  rationale: Le grec nomme précisément la période des pains sans levain et non la Pâque elle-même. Maintenir cette désignation évite de confondre deux réalités festives étroitement liées mais distinctement nommées.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe privilégie la clarté narrative sans effacer la parenthèse chronologique ni les distinctions lexicales du grec.
