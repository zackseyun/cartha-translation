  rationale: 'La révision resserre le rendu sur la construction grecque : elle marque Pierre comme cible ajoutée sans alourdir le texte, restitue « les jours » plutôt qu’une « période » générique, et reformule la note culturelle de façon factuelle et non ambiguë.'
