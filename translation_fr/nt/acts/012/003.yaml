  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : la perception d’Hérode, ce qui plaisait aux Juifs, l’action additionnelle visant Pierre et le repère festif sont conservés. Toutefois, « fit arrêter » introduit plus explicitement l’idée d’un ordre donné que le grec συλλαβεῖν ne l’exprime; « fit aussi arrêter Pierre » peut aussi faire porter « aussi » sur l’arrestation plutôt que clairement sur Pierre. « jours des pains sans levain » correspond plus directement à ἡμέραι τῶν ἀζύμων que « période ».'
  naturalness: La phrase est naturelle en français moderne. « Il fit arrêter Pierre aussi » est toutefois moins fluide que « il fit arrêter Pierre, lui aussi » ou « il fit arrêter aussi Pierre »; la première solution est claire et narrative. « C’étaient les jours des pains sans levain » est idiomatique dans ce contexte biblique et garde la formulation temporelle du grec.
  terminology: '« Juifs », « Pierre » et « pains sans levain » sont appropriés. La note a emploie correctement « Judéens » comme possibilité sans la privilégier. La note b doit éviter de présenter comme simple succession (« qui suivait la Pâque ») une relation calendérique susceptible d’être formulée plus précisément et sans surinterprétation : la fête des pains sans levain est distinctement nommée dans le texte.'
