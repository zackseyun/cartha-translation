  rationale: 'Révision limitée à deux améliorations sûres : « enchaîné » précise le moyen de contrainte, et « et » respecte la simple coordination du grec. La note est conservée avec une légère modernisation stylistique, sans imposer que la sortie soit nécessairement un procès formel.'
