id: ACT.12.6
reference: Acts 12:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: fr
  text: Lorsque Hérode allait le faire sortir[a], cette nuit-là même, Pierre dormait entre deux soldats, enchaîné par deux chaînes, et des gardes, devant la porte, surveillaient la prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le faire comparaître ». Le verbe grec peut désigner le fait de conduire quelqu’un dehors pour le présenter publiquement ou le traduire en justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: allait
  rationale: Dans ce contexte narratif, le verbe exprime une action imminente. « Allait » rend cette imminence de façon naturelle en français.
- source_word: προαγαγεῖν αὐτόν
  choice: le faire sortir
  rationale: Le verbe désigne ici le fait de conduire Pierre hors de sa détention, vraisemblablement pour le présenter publiquement ou le juger. « Le faire sortir » préserve le mouvement sans préciser indûment la nature de la comparution.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: cette nuit-là même
  rationale: Le démonstratif désigne avec insistance la nuit précise qui précède l'action projetée d'Hérode; « même » restitue cette mise en relief.
- source_word: κοιμώμενος
  choice: dormait
  rationale: L'imparfait exprime naturellement l'action en cours décrite par le participe présent.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: entre deux soldats
  rationale: Rendu spatial direct, précis et idiomatique.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: attaché par deux chaînes
  rationale: Le participe parfait décrit l'état durable de Pierre, et le complément précise le moyen de sa contention.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: des gardes, devant la porte
  rationale: Cette formulation conserve la position spatiale indiquée par πρό avec le génitif sans ajouter qu'ils étaient postés.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: surveillaient la prison
  rationale: τηρέω exprime ici l'action de garder ou surveiller; « surveillaient » évite la répétition de « gardes » tout en conservant le sens carcéral de φυλακή.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase conserve la tension de la scène et l'enchaînement des circonstances, tout en employant une syntaxe naturelle pour un lectorat général.
