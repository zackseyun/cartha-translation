    issue: « attaché par deux chaînes » est moins précis que le contexte carcéral ne le permet.
    rationale: δεδεμένος avec ἁλύσεσιν δυσίν décrit Pierre comme retenu par deux chaînes; « enchaîné » est le terme français usuel et plus direct.
  - severity: low
    issue: « tandis que » introduit une subordination interprétative.
    rationale: Le τε relie la proposition concernant les gardes à la description précédente. « Et » conserve plus sobrement cette coordination.
  revised_text: Lorsque Hérode allait le faire sortir[a], cette nuit-là même, Pierre dormait entre deux soldats, enchaîné par deux chaînes, et des gardes, devant la porte, surveillaient la prison.
  revised_footnotes:
