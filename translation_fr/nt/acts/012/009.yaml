  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: fr
  text: Il sortit et le suivit. Il ne savait pas que ce qui se passait par l’intermédiaire de l’ange était réel, mais il croyait voir une vision.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Il sortit donc
  rationale: Le participe aoriste marque une action antérieure ou concomitante au verbe principal; une forme verbale coordonnée est naturelle en français narratif. « Donc » assure ici une liaison fluide sans ajouter de causalité forte.
- source_word: ἠκολούθει
  choice: le suivit
  rationale: L’imparfait grec présente l’action en cours, mais le passé simple convient au récit français et le contexte indique suffisamment que Pierre continue à suivre l’ange.
- source_word: οὐκ ᾔδει
  choice: Il ne savait pas
  rationale: Rendu direct et courant de l’absence de connaissance ou de compréhension de Pierre.
- source_word: ἀληθές
  choice: réel
  rationale: Dans le contraste avec une vision, « réel » exprime mieux l’actualité objective de l’événement que l’abstrait « vrai ».
- source_word: τὸ γινόμενον
  choice: ce qui se passait
  rationale: Cette tournure idiomatique conserve l’aspect progressif du participe présent substantivé.
- source_word: διὰ τοῦ ἀγγέλου
  choice: par l’intermédiaire de l’ange
  rationale: Cette expression rend clairement la médiation ou l’agentivité indiquée par διά avec le génitif, sans attribuer à l’ange une action indépendante au-delà du texte.
- source_word: ἐδόκει
  choice: il pensait
  rationale: Dans ce contexte, le verbe indique l’impression ou la supposition de Pierre; « pensait » est naturel et précis.
- source_word: ὅραμα βλέπειν
  choice: avoir une vision
  rationale: Le français idiomatique dit « avoir une vision ». Cette formulation conserve l’idée d’une expérience visuelle perçue comme visionnaire sans lourdeur littérale.
theological_decisions:
- issue: Nature de l’action angélique
  choice: par l’intermédiaire de l’ange
  alternative: par l’ange
  rationale: Le choix préserve la nuance de médiation possible dans διά avec le génitif, sans trancher au-delà du grec la question du pouvoir propre ou du rôle indépendant de l’ange.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique tout en restant intelligible; l’imparfait est maintenu pour l’état de non-compréhension. Aucune note n’est nécessaire, car « par l’intermédiaire de » exprime directement la nuance grecque.
