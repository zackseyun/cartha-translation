source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: fr
  text: Quand le jour se leva, il y eut une agitation considérable parmi les soldats au sujet de ce qui était arrivé à Pierre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Quand le jour se leva
  rationale: Le génitif absolu exprime le moment où survient la scène, tandis que δέ assure une transition discrète. Cette tournure est naturelle en français et reste proche de l’image grecque.
- source_word: τάραχος οὐκ ὀλίγος
  choice: une agitation considérable
  rationale: La litote grecque signifie une agitation importante. Une reproduction littérale comme « une agitation non négligeable » serait moins naturelle et moins vive en français courant.
- source_word: ἐν τοῖς στρατιώταις
  choice: parmi les soldats
  rationale: « Parmi » rend la sphère collective indiquée par ἐν, et « soldats » conserve le sens lexical de στρατιώταις sans le restreindre à leur fonction de gardes.
- source_word: τί ἄρα
  choice: qu’avait donc bien pu
  rationale: Dans l’interrogation indirecte, ἄρα marque ici la perplexité et la recherche d’une explication. « donc bien pu » transmet naturellement cette nuance en français.
- source_word: ὁ Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et usuelle du nom propre.
- source_word: ἐγένετο
  choice: devenir
  rationale: Avec τί et une personne, le verbe forme l’expression idiomatique « ce qu’il était devenu » ou « ce qui lui était arrivé ». « Qu’avait bien pu devenir Pierre ? » conserve ici l’idiome et la perplexité de la question.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La litote grecque est exprimée par son sens idiomatique afin d’éviter une formulation lourde; la ponctuation en deux-points rend clairement le contenu de l’agitation sans ajouter de relation absente du texte.
