  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: fr
  text: Quand elle reconnut la voix de Pierre, dans sa joie, elle n’ouvrit pas le portail[a], mais courut à l’intérieur et annonça que Pierre se tenait devant le portail[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’entrée extérieure » ; le terme grec désigne l’accès depuis la rue à la propriété.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « annonça Pierre se tenir devant le portail ».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐπιγνοῦσα
  choice: elle reconnut
  rationale: Le participe aoriste exprime la reconnaissance de la voix au moment où elle l’entend; « reconnut » est naturel et précis en français.
- source_word: τὴν φωνὴν τοῦ Πέτρου
  choice: la voix de Pierre
  rationale: Dans ce contexte auditif, φωνή désigne précisément la voix de Pierre.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: dans sa joie
  rationale: La tournure française exprime naturellement que la joie provoque sa réaction, sans alourdir le récit.
- source_word: οὐκ ἤνοιξεν
  choice: elle n’ouvrit pas
  rationale: ἀνοίγω signifie simplement « ouvrir »; le texte ne précise pas qu’il fallait déverrouiller l’entrée.
- source_word: τὸν πυλῶνα / τοῦ πυλῶνος
  choice: le portail
  rationale: πυλών désigne ici l’entrée extérieure donnant de la rue à la propriété; « portail » convient au cadre domestique et évite l’image plus monumentale que peut évoquer « porte » selon le contexte.
- source_word: εἰσδραμοῦσα
  choice: courut à l’intérieur
  rationale: Le composé exprime un mouvement rapide vers l’intérieur et conserve la vivacité de la scène.
- source_word: ἀπήγγειλεν
  choice: annoncer
  rationale: ἀπαγγέλλω signifie rapporter ou annoncer une nouvelle; l’infinitif après « courut » produit une narration française fluide.
- source_word: ἑστάναι
  choice: se tenait
  rationale: 'L’infinitif parfait de ἵστημι a ici une valeur résultative et stative: Pierre est là, debout.'
- source_word: πρὸ τοῦ πυλῶνος
  choice: devant le portail
  rationale: Cette traduction rend directement πρό avec le génitif et conserve la localisation spatiale du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la vivacité et l’ironie de la scène. Les deux occurrences de πυλών sont rendues de manière cohérente par « portail ».
