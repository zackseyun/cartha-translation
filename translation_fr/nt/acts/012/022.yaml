id: ACT.12.22
reference: Acts 12:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: fr
  text: 'Et la foule criait sans cesse : « C’est la voix d’un dieu, et non celle d’un homme ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est la voix de Dieu, et non celle d’un homme ! » Le grec permet cette compréhension, mais, dans le contexte, « d’un dieu » est plus probable : il s’agit d’une acclamation païenne adressée à Hérode.'
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: la foule
  rationale: Dans cette scène d’acclamation publique, δῆμος désigne la population rassemblée plutôt qu’un corps politique officiel. « La foule » est naturel et précis en français moderne.
- source_word: ἐπεφώνει
  choice: criait sans cesse
  rationale: L’imparfait grec présente une action prolongée ou répétée. « Criait sans cesse » rend cette valeur imperfective sans réduire l’acclamation à un cri ponctuel.
- source_word: Θεοῦ
  choice: d’un dieu
  rationale: Dans ce contexte païen où Hérode reçoit des honneurs divins, le génitif sans article désigne le plus naturellement un dieu, sans identifier explicitement le Dieu d’Israël.
- source_word: φωνὴ
  choice: la voix
  rationale: Le nom « voix » conserve la formulation nominale et le contraste direct de l’exclamation grecque.
- source_word: ἀνθρώπου
  choice: d’un homme
  rationale: Cette formulation préserve le singulier et le contraste symétrique entre « un dieu » et « un homme ».
theological_decisions:
- issue: Faut-il traduire Θεοῦ par « d’un dieu » ou « de Dieu » ?
  choice: d’un dieu
  alternative: de Dieu
  rationale: Le contexte est celui d’une foule païenne qui attribue un caractère divin à Hérode. « D’un dieu » correspond mieux à cette situation et évite de suggérer que la foule parle nécessairement du Dieu unique. La possibilité grammaticale de « de Dieu » est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « C’est la voix… » complète idiomatiquement l’exclamation nominale grecque. « Criait sans cesse » conserve la durée ou la répétition exprimée par l’imparfait.
