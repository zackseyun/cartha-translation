  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: fr
  text: 'Et voici qu’un ange du Seigneur apparut soudain près de lui[a], et une lumière brilla dans la cellule[b]. L’ange frappa Pierre au côté et le réveilla en disant : « Lève-toi vite ! » Et ses chaînes tombèrent de ses mains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tint près de lui » ou « survint ». Le verbe grec peut souligner une présence soudaine aussi bien que la proximité.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la pièce » ou « dans le local ». Le terme grec est général, mais « cellule » convient au contexte de la prison.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction vive de mise en relief du marqueur narratif, dans un français actuel mais digne.
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: Rend naturellement le génitif et préserve l’idée d’un messager lié au Seigneur ou envoyé par lui.
- source_word: ἐπέστη
  choice: se tint soudain près de lui
  rationale: Associe la proximité physique à la nuance possible d’apparition soudaine portée par le verbe dans ce contexte.
- source_word: φῶς ἔλαμψεν
  choice: une lumière resplendit
  rationale: Rend directement le jaillissement lumineux tout en gardant un registre narratif digne.
- source_word: ἐν τῷ οἰκήματι
  choice: dans la cellule
  rationale: Le nom grec désigne généralement un local ou une pièce; le contexte carcéral justifie ici « cellule ».
- source_word: πατάξας τὴν πλευρὰν
  choice: frappa Pierre au côté
  rationale: Préserve la force physique de πατάσσω sans l’atténuer en simple geste ou légère poussée; « au côté » est idiomatique.
- source_word: ἤγειρεν αὐτόν
  choice: le réveilla
  rationale: Le contexte immédiat indique qu’il s’agit de tirer Pierre de son sommeil, plutôt que de le relever physiquement.
- source_word: Ἀνάστα ἐν τάχει
  choice: Lève-toi vite !
  rationale: Formulation impérative naturelle et concise qui conserve l’urgence.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: les chaînes tombèrent de ses mains
  rationale: Suit de près l’image grecque et maintient « mains » plutôt que l’interprétation anatomique « poignets ».
theological_decisions:
- issue: Traduction de κύριος dans ἄγγελος κυρίου
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » correspond à l’usage néotestamentaire habituel et ne précise pas davantage l’identité ou la relation exprimée par le génitif.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » conserve la vivacité lucanienne; « resplendit » relève légèrement le registre sans être archaïque. La répétition de « l’ange » évite l’ambiguïté d’un pronom après la mention de la lumière.
