  source_fidelity: 'Le sens essentiel est bien rendu : l’ange est présent auprès de Pierre, la lumière brille dans le lieu de détention, Pierre est réveillé par un coup au côté, puis ses chaînes tombent. « Resplendit » peut toutefois suggérer une intensité que ἔλαμψεν n’explicite pas nécessairement; « brilla » est plus neutre. « Apparu soudain près de lui » rend plus clairement la présence soudaine et la proximité exprimées par ἐπέστη.'
  naturalness: « Se tint soudain près de lui » est compréhensible, mais sonne moins naturel dans la narration française moderne. « Apparut soudain près de lui » est plus fluide. La ponctuation et le registre général conviennent.
  terminology: « Un ange du Seigneur », « cellule », « frappa Pierre au côté », « le réveilla » et « Lève-toi vite ! » sont appropriés. « Ses chaînes tombèrent de ses mains » conserve l’image grecque sans imposer « poignets ».
