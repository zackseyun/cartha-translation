id: ACT.12.25
reference: Acts 12:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: fr
  text: Barnabas et Saul retournèrent à Jérusalem[a] après avoir accompli leur service, emmenant avec eux Jean, appelé Marc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « de Jérusalem » au lieu de « à Jérusalem ».
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: retournèrent
  rationale: L’aoriste de ὑποστρέφω exprime ici le fait de retourner ou de revenir. « Retournèrent » est concis et convient à la destination introduite par εἰς.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: 'Dans le texte grec fourni, εἰς indique normalement une destination : « à Jérusalem ». La variante « de Jérusalem », importante pour le sens et le contexte narratif, est signalée en note.'
- source_word: πληρώσαντες τὴν διακονίαν
  choice: après avoir accompli leur service
  rationale: Le participe aoriste indique une action achevée avant le retour. « Accompli » rend πληρόω, tandis que « service » conserve la portée assez large de διακονία sans préciser dans le texte qu’il s’agissait de l’aide matérielle évoquée en Actes 11.29-30.
- source_word: συμπαραλαβόντες
  choice: emmenant avec eux
  rationale: Le verbe désigne le fait de prendre quelqu’un avec soi. Cette formulation française exprime naturellement l’action qui accompagne leur retour.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: Jean, appelé Marc
  rationale: Le participe passif ἐπικληθέντα signifie qu’il portait le nom de Marc. « Appelé Marc » reste transparent sans ajouter explicitement « aussi », absent du grec.
theological_decisions:
- issue: Variante textuelle concernant le point de départ ou la destination
  choice: à Jérusalem
  alternative: de Jérusalem
  rationale: Le texte principal suit directement le SBLGNT fourni, qui porte εἰς Ἰερουσαλήμ (« à Jérusalem »). La leçon ἐξ Ἰερουσαλήμ (« de Jérusalem »), cohérente avec le contexte narratif et attestée dans certains manuscrits, demeure visible en note afin de ne pas masquer cette difficulté textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure participiale du grec sans lourdeur excessive. « Service » préserve la généralité lexicale de διακονία, plutôt que d’expliciter « mission d’aide » dans le corps du texte.
