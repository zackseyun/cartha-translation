id: ACT.12.21
reference: Acts 12:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: fr
  text: Le jour fixé, après avoir revêtu une tenue royale[a] et pris place sur la tribune[b], Hérode leur adressait un discours public.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des habits royaux ». Le terme grec peut désigner de manière générale une tenue ou des vêtements d’apparat.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’estrade officielle » ou « le siège du tribunal ». Le terme grec désigne souvent une estrade surélevée ou le siège officiel qui s’y trouve.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: Le jour fixé
  rationale: τακτός désigne ici un jour déterminé à l’avance. « Le jour fixé » est naturel en français et conserve l’idée d’une date officiellement arrêtée.
- source_word: ἐνδυσάμενος
  choice: après avoir revêtu
  rationale: Le participe aoriste moyen présente l’habillement d’Hérode comme antérieur au discours. « Après avoir revêtu » rend clairement cette succession sans alourdir la phrase.
- source_word: ἐσθῆτα βασιλικὴν
  choice: une tenue royale
  rationale: ἐσθής peut désigner des vêtements ou une tenue d’apparat sans imposer l’image précise de plusieurs robes. « Une tenue royale » reste général et idiomatique.
- source_word: καθίσας
  choice: pris place
  rationale: Le participe aoriste marque une autre action préalable. « Prendre place » convient naturellement à l’installation officielle d’un souverain sur une tribune.
- source_word: ἐπὶ τοῦ βήματος
  choice: sur la tribune
  rationale: βῆμα peut désigner un siège officiel ou une estrade surélevée. Dans ce contexte d’apparition publique royale, « tribune » exprime bien le lieu officiel surélevé sans suggérer nécessairement une audience judiciaire.
- source_word: ἐδημηγόρει
  choice: leur adressait un discours public
  rationale: δημηγορέω désigne le fait de parler devant une assemblée. L’imparfait français « adressait » conserve l’aspect duratif de l’imparfait grec.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Le pronom indirect rend naturellement en français la direction du discours vers l’auditoire.
theological_decisions: []
