id: ACT.13.6
reference: Acts 13:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: fr
  text: Après avoir parcouru toute l’île jusqu’à Paphos, ils trouvèrent un certain homme, un magicien, un faux prophète juif nommé Bar-Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi écrire « Barjésus ». Ce nom sémitique signifie probablement « fils de Jésus » ou « fils de Josué ».
    reason: Signaler une variante de graphie et expliquer la structure probable du nom sans la substituer au nom propre dans le texte.
lexical_decisions:
- source_word: διελθόντες
  choice: Après avoir parcouru
  rationale: Le participe aoriste exprime ici une action antérieure à εὗρον. « Après avoir parcouru » restitue cette relation temporelle et l’idée de traverser un territoire.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Dans ce contexte, δέ est un léger connecteur narratif. L’enchaînement français reste naturel sans conjonction explicite, sans perte de contraste ni de contenu.
- source_word: ὅλην τὴν νῆσον
  choice: toute l’île
  rationale: Rendu direct et idiomatique de l’étendue indiquée par le grec.
- source_word: ἄχρι Πάφου
  choice: jusqu’à Paphos
  rationale: ἄχρι marque le point d’arrivée du parcours; « jusqu’à » convient naturellement à cette limite géographique.
- source_word: εὗρον
  choice: ils trouvèrent
  rationale: Le passé simple maintient le registre narratif digne et rend sobrement l’aoriste indicatif.
- source_word: ἄνδρα τινὰ
  choice: un certain homme
  rationale: Cette formulation conserve la légère valeur individualisante de τινά au lieu de la supprimer.
- source_word: μάγον
  choice: un magicien
  rationale: « Magicien » est accessible et conserve une certaine largeur sémantique, sans imposer le terme plus interprétatif « sorcier ».
- source_word: ψευδοπροφήτην
  choice: un faux prophète
  rationale: Rendu transparent qui préserve à la fois la prétention prophétique et le jugement porté sur elle.
- source_word: Ἰουδαῖον
  choice: juif
  rationale: L’adjectif français en apposition intégrée identifie naturellement cet homme comme juif, sans imposer un sens strictement géographique tel que « Judéen ».
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: nommé Bar-Jésus
  rationale: « Nommé » rend naturellement l’idiome grec. Le nom propre est translittéré et le trait d’union rend visible sa structure sémitique.
theological_decisions:
- issue: Traduction du nom propre Βαριησοῦ
  choice: Bar-Jésus
  alternative: Barjésus; fils de Jésus; fils de Josué
  rationale: Le texte emploie un nom propre, qu’il convient de translittérer plutôt que d’en traduire les éléments. Le trait d’union aide à reconnaître la structure patronymique sans trancher dans le corps du texte entre « Jésus » et « Josué », deux formes françaises possibles du même nom sémitique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit. L’accumulation descriptive du grec est conservée, mais légèrement intégrée à la syntaxe française par « faux prophète juif nommé ».
