  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: fr
  text: Mais Dieu l’a ressuscité d’entre les morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici le contraste avec l’action humaine rapportée juste avant; « Mais » en restitue naturellement la force adversative.
- source_word: θεὸς
  choice: Dieu
  rationale: Le nom désigne sans ambiguïté Dieu comme sujet de l’action.
- source_word: ἤγειρεν
  choice: a ressuscité
  rationale: Dans ce contexte, ἐγείρω désigne l’action de relever Jésus de la mort. « Ressusciter » exprime clairement et naturellement ce sens en français.
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom renvoie à Jésus dans le contexte immédiat; le pronom objet élidé est la formulation française naturelle.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression idiomatique de résurrection rend la sortie du milieu des morts et correspond à l’usage biblique français courant.
theological_decisions:
- issue: Formulation de la résurrection
  choice: Mais Dieu l’a ressuscité d’entre les morts.
  alternative: Mais Dieu l’a relevé d’entre les morts.
  rationale: Le texte attribue explicitement à Dieu la résurrection de Jésus. « Ressuscité d’entre les morts » transmet clairement cette affirmation sans ajouter d’élément interprétatif; « relevé » serait plus formellement proche de l’image verbale grecque, mais moins explicite et moins naturel dans ce contexte en français moderne.
translation_notes:
  register: Français moderne, simple et digne. La phrase conserve le contraste discursif initial et emploie la tournure biblique française naturelle « ressuscité d’entre les morts ».
