source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: fr
  text: Le Dieu de ce peuple, Israël, a choisi nos pères[a] ; il a fait de ce peuple un grand peuple[b] durant son séjour d’étranger dans le pays d’Égypte et, avec un bras levé[c], l’en a fait sortir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « nos ancêtres ». Littéralement : « nos pères ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « il a élevé ce peuple » ou « il a fait croître ce peuple ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « avec un bras élevé » ; expression liée à l’Exode, qui évoque la puissance avec laquelle Dieu délivre.'
    reason: cultural_note
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Le Dieu de ce peuple, Israël
  rationale: Cette formulation conserve l’ouverture définie et l’apposition du grec, tout en ajoutant la ponctuation nécessaire à un français clair.
- source_word: ἐξελέξατο
  choice: a choisi
  rationale: Rend directement l’aoriste moyen sans surtraduire sa valeur moyenne.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nos pères
  rationale: Reproduit le terme masculin πατέρες et son caractère familial et historique; «nos ancêtres» demeure une possibilité naturelle.
- source_word: τὸν λαὸν ὕψωσεν
  choice: Il a rendu ce peuple puissant
  rationale: Ὑψόω peut ici évoquer l’élévation, la grandeur ou l’accroissement d’Israël. «Rendre puissant» exprime le résultat sans limiter le sens au seul nombre ni au seul rang social.
- source_word: ἐν τῇ παροικίᾳ
  choice: pendant son séjour comme étranger
  rationale: Explicite la condition de résident étranger portée par παροικία, plus précisément que le seul mot «séjour».
- source_word: ἐν γῇ Αἰγύπτου
  choice: dans le pays d’Égypte
  rationale: Conserve γῇ et le registre historique solennel de la formule.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: le bras levé
  rationale: Préserve l’image littérale et l’écho exodique, plutôt que de la remplacer directement par son interprétation, «par sa grande puissance».
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: il l’en a fait sortir
  rationale: «Faire sortir» rend naturellement l’action causative de ἐξάγω; le pronom singulier collectif reprend «ce peuple», et «en» renvoie à l’Égypte.
theological_decisions:
- issue: Désignation des ancêtres d’Israël
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le grec emploie explicitement πατέρας. Le texte principal garde cette forme genrée et traditionnelle, tandis que la note donne l’équivalent collectif possible.
- issue: Portée de ὕψωσεν en Égypte
  choice: Il a rendu ce peuple puissant
  alternative: Il a élevé ce peuple; il a fait grandir ce peuple
  rationale: Le contexte peut suggérer l’accroissement numérique, l’élévation ou la puissance acquise. La traduction choisie conserve une certaine largeur sémantique, et la note signale les autres lectures.
- issue: Image du bras levé
  choice: le bras levé
  alternative: par son bras puissant
  rationale: L’expression conserve la métaphore biblique de la délivrance divine sans réduire celle-ci à une abstraction.
translation_notes:
  register: Français international moderne, digne et accessible. La segmentation en deux phrases allège une longue période grecque sans modifier ses rapports logiques. «Séjour comme étranger» rend explicitement la nuance de παροικία; «le bras levé» maintient l’image scripturaire.
