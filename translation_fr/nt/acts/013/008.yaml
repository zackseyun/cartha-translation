id: ACT.13.8
reference: Acts 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: fr
  text: Mais Élymas le magicien s’opposait à eux — c’est ainsi, en effet, que son nom est traduit[b] — et cherchait à détourner le proconsul de la foi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de croire ». L’expression grecque peut évoquer soit la foi chrétienne dont Élymas voulait l’éloigner, soit, plus généralement, l’acte de croire.'
    reason: alternative_reading
  - marker: b
    text: Le texte présente « Élymas » comme un nom traduit ou interprété; son origine exacte reste incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: s’opposait
  rationale: L’imparfait exprime une opposition qui se prolongeait; « s’opposait » est naturel et garde la force adversative.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec l’accueil favorable évoqué dans le contexte précédent.
- source_word: αὐτοῖς
  choice: à eux
  rationale: Le pronom renvoie aux missionnaires déjà mentionnés sans les identifier de nouveau dans le texte.
- source_word: Ἐλύμας
  choice: Élymas
  rationale: Le nom propre est translittéré selon l’usage français.
- source_word: ὁ μάγος
  choice: le magicien
  rationale: « Magicien » est une traduction accessible de μάγος et évite de renforcer sans nécessité la nuance péjorative possible de « sorcier ».
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: c’est ainsi, en effet, que son nom est traduit
  rationale: Cette formulation conserve l’explication parenthétique et l’idée de traduction ou d’interprétation du nom, sans prétendre en fixer l’étymologie.
- source_word: ζητῶν
  choice: et cherchait
  rationale: Le participe exprime l’intention qui accompagne l’opposition; la coordination donne une phrase française naturelle tout en conservant l’aspect duratif.
- source_word: διαστρέψαι
  choice: à détourner
  rationale: Avec une personne pour objet et ἀπό pour indiquer ce dont elle doit être éloignée, le verbe signifie ici faire dévier ou détourner quelqu’un.
- source_word: τὸν ἀνθύπατον
  choice: le proconsul
  rationale: « Proconsul » conserve la précision du titre administratif romain.
- source_word: ἀπὸ τῆς πίστεως
  choice: de la foi
  rationale: L’article et le contexte permettent de comprendre la foi chrétienne, tandis que « la foi » conserve la formulation grecque sans explicitation excessive.
theological_decisions:
- issue: Sens défini ou général de πίστις
  choice: de la foi
  alternative: de croire
  rationale: L’article grec et le contexte soutiennent une référence à la foi chrétienne, mais l’expression peut aussi désigner plus généralement la réponse croyante du proconsul; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste initial, l’action continue exprimée par l’imparfait et la parenthèse explicative. Les deux appels de note figurent dans le texte principal.
