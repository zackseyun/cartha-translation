  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: fr
  text: 'Veillez donc à ce que ne vous arrive pas ce qui a été dit dans les Prophètes[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par les prophètes ». Le grec dit littéralement « dans les prophètes », expression qui renvoie probablement aux écrits prophétiques où se trouve cet avertissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Veillez
  rationale: L’impératif présent à la deuxième personne du pluriel introduit une mise en garde pressante. « Veillez à ce que » est naturel en français moderne et conserve cette force.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement et naturellement la conséquence tirée de la proclamation précédente.
- source_word: μὴ ἐπέλθῃ
  choice: à ce que ne vous arrive pas
  rationale: Après l’impératif, μή avec le subjonctif aoriste exprime ici une mise en garde contre un événement redouté. Cette tournure française rend ce sens sans donner à « de peur que » un ton inutilement soutenu.
- source_word: τὸ εἰρημένον
  choice: ce qui a été dit
  rationale: Le participe parfait passif substantivé désigne « ce qui a été dit »; le passé composé français conserve convenablement le résultat présent de cette parole antérieure.
- source_word: ἐν τοῖς προφήταις
  choice: dans les Prophètes
  rationale: La préposition ἐν est conservée par « dans ». La majuscule signale que « les Prophètes » peut désigner le corpus des écrits prophétiques, ce que confirme la citation d’Habacuc qui suit.
theological_decisions:
- issue: Référent de « les Prophètes »
  choice: Le corpus des écrits prophétiques
  alternative: Les prophètes en tant que personnes ayant prononcé ces paroles
  rationale: Le contexte introduit immédiatement une citation d’Habacuc. « Dans les Prophètes » préserve toutefois la formulation grecque et n’exclut pas complètement l’arrière-plan des auteurs prophétiques.
translation_notes:
  register: Français international moderne, digne et accessible. « Veillez à ce que » exprime un avertissement direct; « dans les Prophètes » conserve la formulation et l’ambiguïté du grec. Le deux-points est maintenu puisque le verset introduit la citation suivante.
