id: ACT.13.11
reference: Acts 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: fr
  text: « Et maintenant, voici que la main du Seigneur[a] est sur toi. Tu seras aveugle et tu ne verras pas le soleil pendant un certain temps. » Aussitôt, un brouillard et l’obscurité tombèrent sur lui ; il allait çà et là, cherchant des personnes pour le conduire par la main.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la main du Seigneur » désigne ici la puissance du Seigneur à l’œuvre pour juger.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la fonction déictique et solennelle de l’interjection tout en restant naturel en français moderne.
- source_word: χεὶρ κυρίου
  choice: la main du Seigneur
  rationale: L’image biblique est conservée plutôt que remplacée par une explicitation telle que « le jugement du Seigneur ».
- source_word: ἔσῃ τυφλὸς
  choice: tu seras aveugle
  rationale: Rend directement le futur avec adjectif attribut, sans ajouter explicitement l’idée de devenir.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: tu ne verras pas le soleil
  rationale: La coordination produit une phrase française naturelle tout en conservant la mention concrète du soleil.
- source_word: ἄχρι καιροῦ
  choice: pendant un certain temps
  rationale: Exprime une durée temporaire mais indéterminée, sans suggérer une durée précise absente du grec.
- source_word: παραχρῆμα
  choice: aussitôt
  rationale: Restitue clairement l’immédiateté de l’événement.
- source_word: ἀχλὺς
  choice: un brouillard
  rationale: Conserve l’image concrète d’un voile ou brouillard obscurcissant la vue.
- source_word: σκότος
  choice: l’obscurité
  rationale: Terme courant et digne qui rend le sens littéral sans atténuer sa force menaçante.
- source_word: περιάγων
  choice: il allait çà et là
  rationale: Rend le déplacement en divers sens sans ajouter explicitement l’idée de tâtonner, seulement impliquée par le contexte.
- source_word: ἐζήτει χειραγωγούς
  choice: cherchant des personnes pour le conduire par la main
  rationale: Déploie le sens concret de χειραγωγός, celui qui conduit quelqu’un en le tenant par la main.
theological_decisions:
- issue: Sens de « la main du Seigneur »
  choice: Conserver l’expression imagée « la main du Seigneur »
  alternative: « le jugement du Seigneur » ou « le Seigneur va te frapper »
  rationale: Le contexte indique une intervention divine de jugement, mais la formulation source reste métaphorique et ne doit pas être remplacée par une interprétation plus explicite.
- issue: Durée de la cécité
  choice: « pendant un certain temps »
  alternative: « jusqu’à un moment fixé »
  rationale: La durée est temporaire et indéterminée ; « fixé » introduirait une précision théologique que καιρός n’exprime pas nécessairement ici.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde une certaine solennité avec « voici », tandis que la narration demeure fluide. L’image biblique et la nature temporaire mais indéterminée de la cécité sont préservées.
