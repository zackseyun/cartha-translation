  text: οἵ ⸀τε μαθηταὶ ἐπληροῦντο χαρᾶς καὶ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: fr
  text: Et les disciples étaient remplis de joie et de l’Esprit Saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « continuaient d’être remplis de joie et de l’Esprit Saint ». L’imparfait grec peut suggérer un état qui se prolonge ou une action répétée.'
    reason: alternative lexicale et nuance aspectuelle
lexical_decisions:
- source_word: οἵ τε
  choice: Et
  rationale: La particule τε relie cette phrase au récit précédent. En français naturel, « Et » en conserve sobrement la valeur de continuation.
- source_word: μαθηταὶ
  choice: les disciples
  rationale: « Disciples » est l’équivalent courant et précis dans le Nouveau Testament pour désigner ici ceux qui ont accueilli la foi.
- source_word: ἐπληροῦντο
  choice: étaient remplis
  rationale: L’imparfait passif exprime un état ou un processus qui se prolonge dans le passé. « Étaient remplis » préserve la voix passive et s’intègre naturellement au récit français; la nuance durative ou répétée est signalée en note.
- source_word: χαρᾶς
  choice: de joie
  rationale: Après « remplir », le génitif grec se rend naturellement en français par « de ». « Joie » est l’équivalent direct et usuel de χαρά.
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit Saint
  rationale: Dans les Actes, cette expression désigne habituellement l’Esprit divin qui agit dans la mission de l’Église. L’article défini est requis par l’usage français naturel devant ce référent déterminé.
theological_decisions:
- issue: Faut-il comprendre πνεύματος ἁγίου comme une réalité impersonnelle (« esprit saint ») ou comme l’Esprit divin personnel?
  choice: l’Esprit Saint
  alternative: un esprit saint / de sainteté spirituelle
  rationale: Dans les Actes, πνεῦμα ἅγιον renvoie régulièrement à l’Esprit divin agissant dans la communauté et sa mission. Le contexte favorise nettement ce référent, sans qu’il soit nécessaire d’ajouter au texte une formulation doctrinale explicative.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme grec entre la joie et l’Esprit Saint comme contenus de ce qui remplit les disciples, tout en rendant naturellement l’imparfait passif.
