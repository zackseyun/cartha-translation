source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: fr
  text: 'Et il dit : « Toi qui es rempli de toutes sortes de tromperies et de toutes sortes de pratiques malhonnêtes, fils du diable, ennemi de toute justice[a], ne cesseras-tu pas de rendre tortueux les chemins droits du Seigneur ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ennemi de toute droiture ». Le mot grec peut désigner la justice, la droiture ou une conduite juste selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: rempli de toutes sortes de tromperies
  rationale: πλήρης suivi du génitif exprime ce dont quelqu’un est rempli ou profondément caractérisé. La formulation française rend naturellement la portée globale de παντός et le sens de tromperie ou de ruse de δόλος.
- source_word: πάσης ῥᾳδιουργίας
  choice: de pratiques malhonnêtes
  rationale: ῥᾳδιουργία désigne une conduite sans scrupules, frauduleuse ou malfaisante. « Pratiques malhonnêtes » reste compréhensible en français moderne et distingue ce terme de la simple tromperie.
- source_word: υἱὲ διαβόλου
  choice: fils du diable
  rationale: Le vocatif υἱέ signifie littéralement « fils ». L’expression biblique peut évoquer l’appartenance ou la ressemblance morale; la traduction littérale conserve la vigueur de l’interpellation sans l’expliciter davantage.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: ennemi de toute justice
  rationale: δικαιοσύνη couvre ici ce qui est juste, droit et conforme à la volonté de Dieu. « Justice » est le terme français biblique le plus direct, tandis que la nuance de droiture est signalée en note.
- source_word: οὐ παύσῃ
  choice: ne cesseras-tu pas
  rationale: Le futur moyen de παύω fonctionne comme une question de reproche. « Ne cesseras-tu pas » en conserve la forme interrogative et la vigueur sans ajouter l’intensité de « jamais ».
- source_word: διαστρέφων
  choice: rendre tortueux
  rationale: Le participe présent exprime l’action persistante de tordre ou de détourner. « Rendre tortueux » maintient l’image et fait ressortir le contraste délibéré avec les chemins « droits ».
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: les chemins droits du Seigneur
  rationale: ὁδοί peut désigner des chemins aussi bien qu’une manière de vivre ou d’agir. « Chemins » garde cette métaphore en français, et « droits » traduit directement εὐθείας tout en s’opposant à « tortueux ».
- source_word: Ὦ
  choice: Toi qui es
  rationale: Ὦ introduit une interpellation emphatique. « Toi qui es » restitue cette adresse directe dans un français actuel sans recourir au vocatif archaïsant « Ô ».
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Dans ce contexte, le terme grec désigne largement ce qui est juste et droit. « Justice » conserve le terme théologique courant en français; la note maintient la possibilité d’une nuance plus directement morale, « droiture », sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. L’accumulation des accusations et la question de reproche sont conservées. Le contraste métaphorique entre « rendre tortueux » et « chemins droits » reproduit le jeu expressif du grec.
