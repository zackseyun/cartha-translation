id: ACT.13.3
reference: Acts 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: fr
  text: Alors, après avoir jeûné et prié, ils leur imposèrent les mains et les laissèrent partir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les renvoyèrent » ou « les laissèrent aller ». Dans ce contexte, Barnabas et Saul sont autorisés à partir pour leur mission.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession avec la directive prophétique du verset précédent.
- source_word: νηστεύσαντες
  choice: après avoir jeûné
  rationale: Le participe aoriste exprime ici une action préparatoire antérieure au verbe principal.
- source_word: προσευξάμενοι
  choice: prié
  rationale: Coordonné au jeûne sous la construction « après avoir », ce choix restitue clairement et sobrement la séquence grecque.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: ils leur imposèrent les mains
  rationale: « Imposer les mains » est l’expression française consacrée qui conserve le geste concret sans en préciser la portée ecclésiale.
- source_word: ἀπέλυσαν
  choice: les laissèrent partir
  rationale: Le verbe peut signifier relâcher, renvoyer ou laisser partir. Dans ce contexte missionnaire, « laissèrent partir » est naturel tout en préservant l’idée d’autoriser le départ, sans surtraduire par un envoi formel.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif dépend de l’expression relative à l’imposition des mains et renvoie à Barnabas et Saul.
theological_decisions:
- issue: Nature de l’imposition des mains
  choice: Décrire simplement le geste par « ils leur imposèrent les mains »
  alternative: Interpréter explicitement le geste comme une ordination, une bénédiction ou un mandat missionnaire formel
  rationale: Le verset rapporte le geste sans en définir précisément le statut sacramentel ou ecclésial; la traduction ne tranche donc pas entre les interprétations confessionnelles.
- issue: Portée de ἀπέλυσαν
  choice: « les laissèrent partir »
  alternative: « les envoyèrent » ou « les renvoyèrent »
  rationale: Le contexte indique le départ de Barnabas et Saul pour leur mission, mais le verbe lui-même met l’accent sur le fait de les laisser aller ou de les congédier. Le choix retenu conserve cette nuance et évite d’attribuer au verbe seul toute la notion d’envoi missionnaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit la progression du grec tout en évitant l’empilement peu naturel de participes. Le geste de l’imposition des mains demeure descriptif, sans interprétation confessionnelle ajoutée.
