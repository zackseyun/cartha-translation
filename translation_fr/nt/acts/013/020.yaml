  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: fr
  text: Cela dura environ quatre cent cinquante ans[a]. Après cela, il leur donna des juges jusqu’au prophète Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un autre rattachement possible de l’indication temporelle : « Il leur donna des juges pendant environ quatre cent cinquante ans, jusqu’au prophète Samuel. » La syntaxe et la ponctuation du grec sont discutées ici.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: environ
  rationale: Devant un nombre, ὡς indique ici une approximation; « environ » rend naturellement cette nuance.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: quatre cent cinquante ans
  rationale: La formulation conserve explicitement la durée exprimée par le datif grec.
- source_word: καὶ μετὰ ταῦτα
  choice: Après cela
  rationale: Cette expression marque la succession des événements. « Après cela » est naturel en français moderne sans perdre le lien narratif.
- source_word: ἔδωκεν
  choice: il leur donna
  rationale: Le verbe δίδωμι signifie littéralement « donner ». L’ajout du pronom « leur », implicite dans le contexte, rend l’expression idiomatique en français tout en conservant l’image biblique de Dieu qui donne des juges à Israël.
- source_word: κριτὰς
  choice: des juges
  rationale: « Juges » est le terme historique consacré pour les dirigeants d’Israël durant la période antérieure à la monarchie.
- source_word: ἕως
  choice: jusqu’à
  rationale: Le mot marque directement le terme de la période concernée.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: jusqu’au prophète Samuel
  rationale: Cette tournure française naturelle conserve le titre qui identifie Samuel comme prophète.
theological_decisions:
- issue: Rattachement de l’indication temporelle « environ quatre cent cinquante ans » dans un verset dont le texte et la syntaxe sont discutés
  choice: Présenter la durée comme une phrase autonome, puis traduire que Dieu donna des juges jusqu’au prophète Samuel, conformément à l’agencement du texte SBLGNT fourni.
  alternative: Rattacher directement les quatre cent cinquante ans à la période pendant laquelle Dieu donna des juges, jusqu’au prophète Samuel.
  rationale: Le grec fourni place l’indication de durée avant « après cela ». La traduction respecte cet agencement sans harmoniser le passage avec une autre ponctuation ou tradition textuelle; la possibilité concurrente est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Cela dura » forme une phrase compréhensible tout en laissant le contexte antérieur préciser à quoi renvoie la durée; la note préserve l’autre analyse syntaxique sans trancher une difficulté réelle.
