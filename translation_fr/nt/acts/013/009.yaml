  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: fr
  text: Mais Saul, appelé aussi Paul[a], rempli de l’Esprit Saint, le regarda fixement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « qui était aussi Paul ».'
    reason: La tournure grecque identifie Paul comme l’autre nom de Saul sans employer explicitement le verbe « appeler ».
lexical_decisions:
- source_word: Σαῦλος
  choice: Saul
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: δέ
  choice: Mais
  rationale: Marque ici une légère opposition et le tournant du récit vers la réaction de Saul.
- source_word: ὁ καὶ Παῦλος
  choice: appelé aussi Paul
  rationale: Cette apposition présente Paul comme l’autre nom de Saul, sans suggérer qu’un changement de nom vient de se produire.
- source_word: πλησθεὶς
  choice: rempli
  rationale: Le participe passif est conservé sous une forme idiomatique et concise en français.
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit saint
  rationale: Dans ce contexte des Actes, l’expression désigne l’Esprit divin; l’article est ajouté conformément à l’usage naturel du français.
- source_word: ἀτενίσας
  choice: le regarda fixement
  rationale: Rend l’idée d’un regard soutenu et attentif dans un français actuel, sans lourdeur littérale.
- source_word: εἰς αὐτόν
  choice: le
  rationale: Le pronom complément avec «regarder» exprime naturellement en français la direction du regard vers Élymas.
theological_decisions:
- issue: Sens de πνεύματος ἁγίου
  choice: l’Esprit saint
  alternative: un esprit saint
  rationale: Le contexte d’action et d’inspiration dans les Actes ainsi que l’usage lucanien indiquent le référent divin personnel, et non un esprit indéfini.
- issue: Rapport entre les noms Saul et Paul
  choice: appelé aussi Paul
  alternative: qui était aussi Paul
  rationale: La formulation indique deux noms portés par la même personne sans introduire une conversion nominale absente du grec.
translation_notes:
  register: Français international moderne, sobre et digne. «Esprit saint» suit la capitalisation française courante; la phrase conserve le mouvement narratif concis de l’original.
