id: ACT.13.44
reference: Acts 13:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: fr
  text: Le sabbat suivant[a], presque toute la ville se rassembla pour entendre la parole du Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prochain sabbat » ou « le sabbat à venir ».
    reason: lexical_alternative
  - marker: b
    text: « La parole du Seigneur » peut aussi se comprendre comme « le message du Seigneur », « le message venant du Seigneur » ou, selon le contexte, « le message au sujet du Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Le sabbat suivant
  rationale: La construction au datif a une valeur temporelle. « Le sabbat suivant » est naturel en français moderne et rend ἐρχομένῳ sans préciser davantage s’il s’agit simplement du prochain sabbat ou du sabbat qui vient.
- source_word: σχεδὸν
  choice: presque
  rationale: σχεδόν signifie « presque » ou « à peu près » ; « presque » convient directement devant « toute la ville ».
- source_word: πᾶσα ἡ πόλις
  choice: toute la ville
  rationale: Cette expression désigne largement la population de la ville, avec une portée probablement hyperbolique, sans exiger que chaque habitant ait été présent.
- source_word: συνήχθη
  choice: se rassembla
  rationale: 'Bien que la forme grecque soit passive, elle a ici un sens intransitif proche du moyen : les gens se réunirent. « Se rassembla » est idiomatique et conserve l’idée collective.'
- source_word: ἀκοῦσαι
  choice: pour entendre
  rationale: L’infinitif exprime le but du rassemblement. « Pour entendre » traduit directement cette valeur.
- source_word: τὸν λόγον
  choice: la parole
  rationale: λόγος peut désigner une parole ou un message. Dans les Actes, « la parole » est une expression récurrente pour la proclamation apostolique ; la conserver maintient ce lien lexical.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Le génitif est rendu directement sans trancher entre une parole qui vient du Seigneur, lui appartient ou le concerne.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est la traduction française habituelle de κύριος dans ce contexte et conserve la portée de la proclamation chrétienne sans préciser davantage le référent que ne le fait le texte.
- issue: Sens de « la parole du Seigneur »
  choice: Conserver la formule « la parole du Seigneur »
  alternative: « le message du Seigneur », « le message venant du Seigneur » ou « le message au sujet du Seigneur »
  rationale: Le génitif grec permet des nuances qui se recouvrent. La formulation retenue préserve cette ambiguïté et l’expression théologique récurrente de Luc au lieu de l’expliciter dans un seul sens.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier collectif « toute la ville se rassembla » reproduit l’expression grecque sans alourdir la phrase. Les notes préservent les principales possibilités lexicales et théologiques du texte.
