id: ACT.13.24
reference: Acts 13:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: fr
  text: Avant sa venue[a], Jean avait proclamé à tout le peuple d’Israël un baptême de repentance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant son arrivée ». Le grec dit littéralement « devant la face de son entrée », expression signifiant qu’il précédait sa venue.
    reason: lexical_alternative
  - marker: b
    text: Ou « un baptême en vue de la repentance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: avait proclamé
  rationale: Le participe aoriste situe la proclamation publique de Jean avant la venue mentionnée. Le plus-que-parfait exprime naturellement cette antériorité en français, tandis que « proclamer » conserve l’idée d’une annonce publique.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: avant sa venue
  rationale: L’expression grecque, littéralement « devant la face de son entrée », est idiomatique et signifie que Jean a précédé sa venue. « Avant sa venue » est naturel, concis et ne rend pas inutilement l’idiome mot à mot.
- source_word: εἰσόδου
  choice: venue
  rationale: Le nom peut désigner une entrée ou une arrivée. Dans ce contexte, « venue » rend naturellement l’arrivée ou l’apparition de Jésus.
- source_word: βάπτισμα μετανοίας
  choice: un baptême de repentance
  rationale: La formulation conserve le génitif grec et le lien lexical habituel entre le baptême de Jean et la repentance, sans préciser à tort une relation unique entre les deux termes.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: à tout le peuple d’Israël
  rationale: Cette traduction conserve à la fois l’idée de totalité exprimée par παντί et celle d’Israël considéré comme peuple.
- source_word: Ἰωάννου
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom grec Ἰωάννης.
theological_decisions:
- issue: Référent de « sa » dans « avant sa venue »
  choice: Le pronom renvoie à Jésus, le Sauveur issu de la descendance de David, dans le contexte du discours de Paul.
  alternative: Laisser l’antécédent entièrement indéterminé si le verset est lu isolément.
  rationale: Actes 13.23-25 présente Jean comme le précurseur de Jésus. Le pronom français préserve le renvoi contextuel sans ajouter le nom de Jésus, absent de ce verset.
- issue: Rapport entre le baptême et la repentance
  choice: Conserver la formulation « baptême de repentance ».
  alternative: « baptême en vue de la repentance » ou « baptême pour la repentance ».
  rationale: Le génitif grec peut recevoir plusieurs nuances. La traduction retenue préserve cette tension au lieu d’imposer une relation causale ou finale précise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit l’ordre temporel du grec tout en restant naturelle. « Repentance » est retenu comme terme biblique courant, malgré la possibilité de « changement de disposition » ou « conversion », afin de préserver le lien lexical et théologique sans surinterprétation.
