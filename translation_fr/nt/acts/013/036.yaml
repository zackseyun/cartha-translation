  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: fr
  text: En effet, David, après avoir servi le dessein de Dieu au sein de sa génération[a], s’est endormi[b], a rejoint ses ancêtres[c] et a connu la décomposition[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre analyse possible : « après avoir servi sa génération conformément au dessein de Dieu ».'
    reason: syntactic_ambiguity
  - marker: b
    text: « S’endormir » est ici une manière biblique de parler de la mort.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « a été ajouté à ses pères », expression de style hébraïque signifiant qu’il les a rejoints dans la mort.'
    reason: lexical_alternative
  - marker: d
    text: Il s’agit de la décomposition de son corps ; voir le contraste au verset suivant.
    reason: contextual_note
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: au sein de sa génération
  rationale: Le datif situe vraisemblablement le service de David dans le cadre historique de sa propre génération. Cette formulation est naturelle en français et évite de faire de sa génération la bénéficiaire du service dans le texte principal.
- source_word: ὑπηρετήσας
  choice: après avoir servi
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux. « Après avoir servi » rend clairement cette succession sans donner au verbe une coloration ecclésiastique.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: le dessein de Dieu
  rationale: βουλή peut désigner le dessein, la volonté arrêtée ou le plan. « Le dessein de Dieu » est actuel, digne et conserve l’idée d’une intention divine sans préciser davantage sa nature.
- source_word: ἐκοιμήθη
  choice: s’est endormi
  rationale: La métaphore biblique du sommeil pour la mort est conservée plutôt que remplacée par le simple verbe « mourir ».
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: a rejoint ses ancêtres
  rationale: Cette tournure française rend clairement l’idiome sémitique selon lequel David a rejoint ses devanciers dans la mort. « Fut ajouté à ses pères » serait plus littéral mais peu naturel en français moderne.
- source_word: εἶδεν διαφθοράν
  choice: a connu la décomposition
  rationale: La formule désigne la décomposition corporelle. « A connu » reste proche de l’idiome grec tout en étant plus naturel que « a vu la décomposition » et maintient le contraste avec le verset suivant.
theological_decisions:
- issue: Rapport syntaxique entre « sa génération », le service de David et le dessein de Dieu
  choice: David a servi le dessein de Dieu au sein de sa génération
  alternative: David a servi sa génération conformément au dessein de Dieu
  rationale: L’ordre des mots et les datifs permettent une autre analyse ancienne, mais la lecture retenue rattache naturellement τῇ τοῦ θεοῦ βουλῇ à ὑπηρετήσας et comprend ἰδίᾳ γενεᾷ comme cadre temporel ou social. L’autre possibilité est signalée sans effacer l’ambiguïté réelle.
- issue: Métaphore de la mort appliquée à David
  choice: s’est endormi
  alternative: est mort
  rationale: Le grec emploie κοιμάομαι, métaphore conventionnelle de la mort. La conserver respecte l’image du texte sans lui attribuer une précision doctrinale supplémentaire.
- issue: Portée de διαφθοράν
  choice: a connu la décomposition
  alternative: son corps s’est décomposé
  rationale: La formulation retenue maintient l’expression rhétorique et son contraste avec le verset suivant, tandis que l’alternative expliciterait le référent corporel au-delà de la forme du grec.
translation_notes:
  register: Français international moderne, sobre et digne. Le texte conserve la métaphore biblique du sommeil, mais traduit l’idiome relatif aux ancêtres de manière intelligible. La principale ambiguïté syntaxique est maintenue en note plutôt que tranchée silencieusement.
