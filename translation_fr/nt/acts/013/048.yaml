id: ACT.13.48
reference: Acts 13:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: fr
  text: Quand les non-Juifs entendirent cela, ils se mirent à se réjouir et à glorifier la parole du Seigneur, et tous ceux qui avaient été désignés pour la vie éternelle[a] crurent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient disposés à recevoir la vie éternelle ». Le participe grec peut être compris de différentes manières, mais le sens passif « avaient été désignés » est ici le plus direct.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: quand … entendirent cela
  rationale: Le participe présent est circonstanciel. La tournure temporelle est naturelle en français, et « cela » explicite l’objet sous-entendu d’après le contexte.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans ce contexte d’Actes, le terme désigne les personnes appartenant aux nations par opposition aux Juifs. « Non-Juifs » est plus immédiatement compréhensible que « nations ».
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: se mirent à se réjouir et à glorifier
  rationale: Les deux imparfaits décrivent une réaction qui se déploie; la tournure inchoative rend naturellement leur valeur narrative en français sans les réduire à deux faits ponctuels.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: la parole du Seigneur
  rationale: « Parole » conserve l’expression biblique et sa portée théologique, tout en désignant ici le message proclamé.
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: L’aoriste indicatif est rendu sobrement par le passé simple, adapté au registre narratif et sans ajout interprétatif.
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Cette formulation française naturelle conserve la valeur quantitative du relatif grec.
- source_word: τεταγμένοι
  choice: avaient été désignés
  rationale: Le participe parfait médio-passif de τάσσω se comprend le plus directement ici au passif et exprime un état résultant d’une désignation antérieure. Cette formulation préserve la grammaire sans développer une doctrine au-delà du verset.
- source_word: εἰς ζωὴν αἰώνιον
  choice: pour la vie éternelle
  rationale: « Pour » exprime naturellement en français l’orientation ou la destination marquée par εἰς.
theological_decisions:
- issue: Sens de τεταγμένοι et rapport entre désignation et réponse humaine
  choice: avaient été désignés pour la vie éternelle
  alternative: étaient disposés à recevoir la vie éternelle
  rationale: La lecture passive est la plus directe dans ce contexte et respecte l’état résultant exprimé par le parfait. La traduction n’explicite ni l’agent ni un système doctrinal de prédestination. La lecture en termes de disposition est signalée en note afin de préserver le débat interprétatif.
translation_notes:
  register: Français international moderne, narratif et digne. « Non-Juifs » privilégie la compréhension immédiate; le passé simple convient au récit écrit. Le marqueur de note est placé après l’expression contestée qu’il explique.
