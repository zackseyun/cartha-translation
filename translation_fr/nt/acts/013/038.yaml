language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: fr
  text: 'Sachez-le donc, frères[a] : c’est par lui[b] que le pardon des péchés vous est proclamé, et que, de tout ce dont vous n’avez pas pu être justifiés[c] par la loi de Moïse…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs », si l’interpellation désigne inclusivement l’ensemble des personnes rassemblées.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire Jésus, celui qui vient d’être mentionné.
    reason: cross_reference
  - marker: c
    text: Ou « déclarés justes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Sachez-le donc
  rationale: Cette tournure française naturelle conserve la valeur déclarative de l’impératif impersonnel grec et rend explicitement οὖν par « donc ».
- source_word: ἄνδρες ἀδελφοί
  choice: frères
  rationale: « Frères » rend l’interpellation familiale masculine sans le calque peu naturel « hommes frères » ; une note signale la possible portée inclusive.
- source_word: διὰ τούτου
  choice: par lui
  rationale: Le démonstratif masculin renvoie à Jésus, mentionné juste auparavant. « Par lui » exprime clairement cette référence personnelle sans ajouter le nom dans le texte.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: le pardon des péchés
  rationale: Formulation française courante, claire et fidèle au sens contextuel d’ἄφεσις.
- source_word: καταγγέλλεται
  choice: vous est annoncé
  rationale: Le passif présent décrit une annonce publique adressée aux auditeurs ; « annoncé » est plus naturel ici que « proclamé » tout en gardant la force de la prédication.
- source_word: ἀπὸ πάντων ὧν
  choice: de tout ce dont
  rationale: Cette expression française concise conserve la relation de délivrance ou de justification introduite par ἀπό.
- source_word: οὐκ ἠδυνήθητε
  choice: vous n’avez pas pu
  rationale: Rend directement et idiomatiquement l’incapacité exprimée par le verbe grec.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: par la loi de Moïse
  rationale: Dans ce contexte, ἐν peut exprimer le moyen ou le cadre ; « par » donne un français naturel sans exclure entièrement la nuance de sphère.
- source_word: δικαιωθῆναι
  choice: être justifiés
  rationale: Le terme reçu « justifiés » préserve la densité juridique et théologique du verbe sans imposer une paraphrase interprétative unique.
theological_decisions:
- issue: Sens de δικαιωθῆναι par rapport à la loi de Moïse
  choice: être justifiés
  alternative: être déclarés justes
  rationale: « Être justifiés » conserve le terme théologique traditionnel et sa tension sémantique ; la note fournit l’équivalent judiciaire possible sans réduire le verbe à lui seul.
- issue: Portée de l’adresse ἄνδρες ἀδελφοί
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal respecte la forme masculine du grec, tandis que la note reconnaît que l’adresse peut viser inclusivement l’ensemble de l’auditoire.
- issue: Limite du texte source fourni
  choice: ne pas ajouter la proposition « quiconque croit est justifié »
  alternative: compléter la phrase à partir d’Actes 13.39
  rationale: La source grecque fournie s’arrête à δικαιωθῆναι. L’ellipse finale conserve honnêtement cette suspension au lieu d’importer des mots absents de l’extrait, même si la syntaxe se poursuit dans le contexte.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation évite les calques lourds tout en conservant le vocabulaire théologique essentiel. Les points de suspension sont nécessaires parce que l’extrait grec fourni s’achève au milieu de la construction qui se poursuit dans le contexte suivant.
