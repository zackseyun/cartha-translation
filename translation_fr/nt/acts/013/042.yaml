  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: fr
  text: Tandis qu’ils sortaient[a][b], ils demandaient avec insistance que ces paroles leur soient dites le sabbat suivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent plus explicitement : « Tandis que Paul et Barnabé sortaient, les gens demandaient avec insistance que ces paroles leur soient dites le sabbat suivant. »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Alors qu’ils partaient, ils demandaient que ces choses leur soient dites le sabbat qui venait. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: Tandis qu’ils sortaient
  rationale: Le participe présent dans un génitif absolu exprime ici une circonstance temporelle. « Tandis qu’ils sortaient » conserve l’aspect duratif et reste naturel en français.
- source_word: δὲ
  choice: absorbé dans la proposition temporelle
  rationale: La particule marque une transition légère; une conjonction distincte alourdirait inutilement la phrase française.
- source_word: αὐτῶν
  choice: ils
  rationale: Le pronom grec ne précise pas son référent dans le texte retenu. Le pronom français évite de nommer Paul, Barnabé ou la foule dans le corps du verset.
- source_word: παρεκάλουν
  choice: ils demandaient avec insistance
  rationale: L’imparfait présente une demande en cours, et παρακαλέω exprime ici une requête pressante. Cette formulation est plus précise que le simple « demandaient » sans atteindre la force de « suppliaient ».
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: le sabbat suivant
  rationale: L’expression désigne le sabbat à venir ou suivant. Cette traduction idiomatique rend clairement la valeur temporelle sans reproduire littéralement la tournure grecque inhabituelle.
- source_word: λαληθῆναι
  choice: soient dites
  rationale: La tournure au passif conserve l’indétermination de la personne qui prendra la parole et rend directement le sens de l’infinitif passif de λαλέω.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif indique les destinataires des paroles; « leur » en est l’équivalent français naturel.
- source_word: τὰ ῥήματα ταῦτα
  choice: ces paroles
  rationale: ῥήματα renvoie ici aux paroles prononcées dans le discours précédent. « Ces paroles » reste proche du grec sans généraliser en « ces choses » ni interpréter en « ce message ».
theological_decisions:
- issue: Référent des pronoms et identité des personnes qui formulent la demande
  choice: Le texte principal conserve les pronoms « ils » et « leur » sans identifier explicitement les personnes.
  alternative: Préciser que les gens demandent à Paul et Barnabé de leur parler de nouveau.
  rationale: Le texte grec de cette édition emploie des pronoms et une forme verbale sans sujet nominal explicite, sur fond de difficulté textuelle. Une identification dans le texte principal trancherait au-delà de la formulation retenue. La note signale la lecture manuscrite plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Demandaient avec insistance » rend la force de la requête sans employer un registre excessivement soutenu. La structure pronominale maintient autant que possible l’ambiguïté du grec, laquelle est explicitée en note.
