  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: fr
  text: Quand ils eurent accompli tout ce qui était écrit à son sujet, ils le descendirent du bois[a] et le déposèrent dans un tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’arbre » ; le grec ξύλον signifie « bois » ou « arbre » et peut aussi désigner, dans ce contexte, l’instrument en bois de l’exécution, souvent rendu par « croix ». Le terme peut faire écho à Deutéronome 21.23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quand
  rationale: Introduit naturellement la succession temporelle des événements en français, sans alourdir la phrase.
- source_word: ἐτέλεσαν
  choice: eurent accompli
  rationale: Le verbe exprime l’action de mener à son terme ce qui était écrit. Le passé antérieur marque que cette action précède la descente du corps.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: tout ce qui était écrit à son sujet
  rationale: Cette formulation française naturelle conserve la portée globale de πάντα et l’état résultant exprimé par le participe parfait γεγραμμένα.
- source_word: καθελόντες
  choice: ils le descendirent
  rationale: Le participe aoriste désigne une action antérieure à la mise au tombeau; une proposition coordonnée rend clairement cette succession en français.
- source_word: ἀπὸ τοῦ ξύλου
  choice: du bois
  rationale: ξύλον peut désigner du bois, un arbre ou l’instrument en bois servant à l’exécution. « Le bois » conserve le choix lexical grec et sa possible résonance scripturaire sans remplacer directement le terme par « croix ».
- source_word: ἔθηκαν
  choice: le déposèrent
  rationale: Dans le contexte funéraire, « déposer » rend naturellement l’action de placer avec soin un corps.
- source_word: εἰς μνημεῖον
  choice: dans un tombeau
  rationale: μνημεῖον désigne ici le lieu où un corps est enseveli; « tombeau » est le terme français courant et précis.
theological_decisions:
- issue: Traduction de ξύλον dans le récit de la Passion
  choice: bois
  alternative: arbre; croix
  rationale: Le texte grec emploie ξύλον et non σταυρός. « Bois » maintient cette distinction et la possible évocation de Deutéronome 21.23, tandis que la note indique le sens contextuel d’instrument d’exécution sans imposer une harmonisation.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la progression temporelle du grec, et « du bois » préserve son vocabulaire distinctif tout en étant éclairé par une note.
