id: ACT.13.1
reference: Acts 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: fr
  text: 'Dans l’Église d’Antioche, il y avait des prophètes et des enseignants : Barnabas, Siméon appelé Niger[a], Lucius de Cyrène[b], Manaën, qui avait été élevé avec Hérode le tétrarque[c], et Saul.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Niger » est un nom latin qui signifie « noir ». Il est conservé ici comme nom propre plutôt que traduit.
    reason: lexical_alternative
  - marker: b
    text: Cyrène était une ville d’Afrique du Nord.
    reason: cultural_note
  - marker: c
    text: Ou « frère de lait d’Hérode le tétrarque »; le terme grec désigne quelqu’un qui a été élevé avec une autre personne.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: il y avait
  rationale: Ἦσαν porte ici le sens existentiel. Le léger lien discursif exprimé par δέ n’exige pas nécessairement un mot distinct en français.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Dans l’Église d’Antioche
  rationale: Cette formulation française naturelle situe les personnes au sein de la communauté chrétienne présente à Antioche, sans reproduire lourdement le participe οὖσαν.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: des prophètes et des enseignants
  rationale: Traduction directe de deux fonctions reconnues dans la communauté, sans leur imposer une structure ecclésiastique postérieure.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Siméon appelé Niger
  rationale: Siméon reflète Συμεών; Niger est conservé comme nom latin plutôt que traduit dans le corps du texte.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lucius de Cyrène
  rationale: Le gentilé grec indique que Lucius était originaire de Cyrène; « de Cyrène » est plus naturel en français moderne que « le Cyrénéen » dans cette liste.
- source_word: Μαναήν
  choice: Manaën
  rationale: Translittération française traditionnelle du nom propre, avec tréma pour guider la prononciation.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: Hérode le tétrarque
  rationale: Le texte grec donne le nom et le titre sans ajouter l’identification historique « Antipas ».
- source_word: σύντροφος
  choice: qui avait été élevé avec
  rationale: Le terme désigne vraisemblablement une personne élevée avec une autre. Cette traduction exprime ce lien tout en laissant en note la possibilité plus précise de frère de lait.
theological_decisions:
- issue: Nature des prophètes et des enseignants à Antioche
  choice: Conserver les deux désignations comme fonctions reconnues dans l’Église locale.
  alternative: Les présenter comme des titulaires d’offices ecclésiastiques définis au sens institutionnel ultérieur.
  rationale: Le verset nomme ces ministères sans définir leur statut institutionnel ni établir une hiérarchie postérieure.
- issue: Relation de Manaën avec Hérode
  choice: « qui avait été élevé avec Hérode »
  alternative: « frère de lait d’Hérode » ou « proche compagnon d’Hérode »
  rationale: σύντροφος évoque normalement une éducation commune, mais ne permet pas de préciser avec certitude la nature familiale ou officielle de cette relation.
translation_notes:
  register: Français international moderne, naturel et digne. « Église » désigne ici la communauté chrétienne locale. La syntaxe resserrée évite la répétition peu naturelle « à Antioche, dans l’Église qui s’y trouvait », tout en conservant le cadre local. Les notes suivent l’ordre réel de leurs marqueurs dans le texte.
