  terminology: « Église » convient au sens de communauté chrétienne locale; « prophètes et enseignants » est direct et non confessionnel. Les translittérations Barnabas, Siméon, Lucius, Manaën et Saul sont cohérentes. Les notes emploient une terminologie explicative et ne surinterprètent pas le texte.
