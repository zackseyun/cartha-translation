  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: fr
  text: Partis de Perge, ils arrivèrent à Antioche de Pisidie[a]. Le jour du sabbat, ils entrèrent dans la synagogue et s’assirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Antioche pisidienne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Quant à eux, ils
  rationale: La tournure marque la reprise du récit avec une légère mise en relief du sujet explicite αὐτοί, sans imposer un contraste fort.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: poursuivirent leur route depuis Perge
  rationale: Dans ce récit de voyage, le participe de διέρχομαι exprime la progression à partir de Perge; cette formulation est naturelle et conserve l’idée de continuation.
- source_word: παρεγένοντο
  choice: arrivèrent à
  rationale: Dans un contexte de déplacement, παραγίνομαι désigne naturellement l’arrivée dans un lieu.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Antioche de Pisidie
  rationale: Cette désignation distingue la ville par sa région et suit de près la construction grecque, tout en restant idiomatique en français.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: ils entrèrent dans la synagogue
  rationale: Le participe est rendu par un verbe conjugué pour assurer un récit français fluide, sans modifier la succession des actions.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: Le jour du sabbat
  rationale: Il s’agit de l’expression grecque usuelle pour le sabbat juif; le singulier est la forme idiomatique en français.
- source_word: ἐκάθισαν
  choice: s’assirent
  rationale: Le passé simple rend directement l’action ponctuelle exprimée par l’aoriste et convient au registre narratif.
