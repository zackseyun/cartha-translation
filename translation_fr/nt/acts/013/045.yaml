id: ACT.13.45
reference: Acts 13:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: fr
  text: Mais quand les Juifs virent les foules[a], ils furent remplis de jalousie[b] et se mirent à contredire ce qui était dit par Paul[c], en blasphémant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit ici du groupe juif local qui s’oppose à Paul dans cette scène, et non du peuple juif dans son ensemble.
    reason: cultural_note
  - marker: b
    text: Ou « de zèle » ; dans ce contexte, le sens négatif « jalousie » paraît préférable.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ce que Paul disait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: Mais quand ... virent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, tandis que « mais » marque le contraste avec l’accueil favorable du verset précédent.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Le grec désigne littéralement « les Juifs » sans préciser qu’il s’agit uniquement de responsables. Une note circonscrit l’expression au groupe local mis en scène.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel du grec est conservé dans une formulation française courante.
- source_word: ἐπλήσθησαν ζήλου
  choice: ils furent remplis de jalousie
  rationale: ζῆλος peut désigner le zèle ou la jalousie. L’hostilité qui suit favorise ici « jalousie », tout en conservant dans une note l’autre possibilité lexicale.
- source_word: ἀντέλεγον
  choice: se mirent à contredire
  rationale: Cette formulation rend naturellement la valeur imperfective ou inchoative de l’imparfait grec et le début d’une opposition prolongée.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: les paroles de Paul
  rationale: L’expression désigne ce que Paul disait. Cette formulation française concise et naturelle évite la lourdeur d’un passif tout en préservant le contenu référentiel.
- source_word: βλασφημοῦντες
  choice: en blasphémant
  rationale: Le participe exprime la manière ou l’action concomitante. « Blasphémer » conserve la force du terme sans préciser un objet que le grec ne nomme pas.
theological_decisions:
- issue: Risque de généralisation antijuive de οἱ Ἰουδαῖοι
  choice: les Juifs, avec une note précisant le groupe local opposé à Paul
  alternative: les responsables juifs
  rationale: Le texte ne limite pas explicitement le groupe aux responsables. La traduction formelle est donc conservée, mais la note empêche d’étendre indûment cette désignation à l’ensemble du peuple juif.
- issue: Portée de βλασφημοῦντες
  choice: en blasphémant, sans complément explicite
  alternative: en insultant Paul ou en blasphémant Dieu
  rationale: Le grec ne précise pas l’objet du blasphème. Ne pas en ajouter préserve l’ambiguïté et la gravité théologique de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le contraste narratif, le pluriel « les foules », la force de « blasphémer » et les ambiguïtés pertinentes du grec, sans alourdir la syntaxe.
