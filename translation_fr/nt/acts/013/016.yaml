    issue: Adresse « Hommes d’Israël »
    rationale: Bien que compréhensible, cette formulation est un calque moins naturel en français moderne. « Israélites » rend l’identification ethno-religieuse et convient à l’apostrophe publique.
  - severity: low
    issue: Virgule avant « et » dans l’adresse
    rationale: La virgule n’est pas requise et alourdit la coordination des deux destinataires.
  - severity: medium
    issue: Portée historique excessive dans la note
    rationale: La formule « probablement des non-Juifs qui fréquentaient la synagogue et adoraient le Dieu d’Israël » présente comme ensemble défini des éléments qui restent contextuels et discutés. Une formulation plus prudente préserve l’ambiguïté.
