id: ACT.13.16
reference: Acts 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: fr
  text: 'Paul se leva alors et, d’un geste de la main, dit : « Israélites et vous qui craignez Dieu[a], écoutez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « craignant-Dieu ». L’expression peut désigner des non-Juifs associés à la synagogue qui honoraient le Dieu d’Israël.'
    reason: Précision lexicale et historique prudente sur οἱ φοβούμενοι τὸν θεόν.
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste décrit ici le mouvement concret de Paul avant sa prise de parole. « Se leva » est naturel en français moderne.
- source_word: δὲ
  choice: alors
  rationale: La particule marque ici la progression du récit plutôt qu’une opposition forte. « Alors » assure un enchaînement fluide.
- source_word: κατασείσας τῇ χειρὶ
  choice: d’un geste de la main
  rationale: L’expression désigne un geste destiné à attirer l’attention ou à demander le silence, sans suggérer une agitation excessive.
- source_word: εἶπεν
  choice: dit
  rationale: Verbe narratif courant introduisant directement les paroles de Paul.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hommes d’Israël
  rationale: Cette formulation conserve le vocatif masculin ἄνδρες et l’appartenance à Israël, tout en restant digne et intelligible.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: vous qui craignez Dieu
  rationale: La traduction conserve la valeur verbale du participe et évite de transformer implicitement l’expression en titre technique.
- source_word: ἀκούσατε
  choice: écoutez
  rationale: L’impératif appelle à une écoute attentive. « Écoutez » est direct, naturel et solennel.
theological_decisions:
- issue: Désignation des Israélites et des non-Israélites associés à la synagogue
  choice: « Hommes d’Israël, et vous qui craignez Dieu »
  alternative: « Israélites et craignant-Dieu » ou « Hommes d’Israël et adorateurs de Dieu »
  rationale: Le grec distingue les Israélites d’un second groupe défini par sa crainte de Dieu, probablement des non-Juifs liés à la synagogue. La formulation retenue préserve cette distinction sans imposer dans le texte principal une catégorie socioreligieuse technique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe de l’adresse conserve la distinction entre les deux groupes, tandis que la note explicite le probable sens historique de « ceux qui craignent Dieu ».
