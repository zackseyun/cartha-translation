id: ACT.13.7
reference: Acts 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: fr
  text: qui était avec le proconsul Sergius Paulus, un homme intelligent[a]. Celui-ci fit appeler Barnabé et Saul et chercha à entendre la parole de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme prudent » ou « un homme doué de discernement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le message de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ ἀνθυπάτῳ
  choice: auprès du proconsul
  rationale: « Proconsul » restitue précisément le titre du gouverneur d’une province sénatoriale romaine. « Auprès de » exprime ici naturellement l’association avec ce personnage officiel.
- source_word: ἀνδρὶ συνετῷ
  choice: un homme intelligent
  rationale: συνετός évoque l’intelligence, le discernement ou la prudence. « Intelligent » est clair, actuel et n’attribue pas nécessairement une vertu morale.
- source_word: οὗτος
  choice: Celui-ci
  rationale: Le démonstratif reprend Sergius Paulus avec une légère mise en relief, mieux conservée par « Celui-ci » que par le simple pronom « il ».
- source_word: προσκαλεσάμενος
  choice: fit appeler
  rationale: Le participe indique qu’il les appela auprès de lui. « Fit appeler » convient à l’initiative d’un responsable officiel sans suggérer une contrainte excessive.
- source_word: ἐπεζήτησεν ἀκοῦσαι
  choice: chercha à entendre
  rationale: Cette formulation conserve la force de recherche ou de vif désir portée par ἐπιζητέω, tout en rendant directement l’infinitif ἀκοῦσαι.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: La formulation garde l’expression biblique transparente et la relation génitive du grec; dans ce contexte, λόγος désigne le message proclamé venant de Dieu.
- source_word: Σεργίῳ Παύλῳ
  choice: Sergius Paulus
  rationale: Le nom personnel est translittéré selon sa forme conventionnelle, sans le traduire.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabé et Saul
  rationale: Les formes françaises conventionnelles des noms bibliques sont employées.
theological_decisions:
- issue: Sens de λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: « La parole de Dieu » suit de plus près le grec et préserve l’expression biblique sans imposer une définition doctrinale plus étroite; la valeur contextuelle de message proclamé est signalée en note.
- issue: Nuance de συνετῷ appliqué à Sergius Paulus
  choice: un homme intelligent
  alternative: un homme prudent / un homme doué de discernement
  rationale: Le terme souligne sa compréhension ou son discernement, sans nécessairement porter un jugement sur sa vertu morale.
translation_notes:
  register: Français international moderne, naturel et digne. La proposition relative initiale « qui se trouvait » conserve le lien syntaxique avec le verset précédent. « Celui-ci » maintient la reprise emphatique du grec, tandis que « fit appeler » convient au statut officiel du proconsul.
