id: ACT.13.28
reference: Acts 13:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: fr
  text: Et, bien qu’ils n’aient trouvé aucun motif justifiant une condamnation à mort[a], ils ont demandé à Pilate de le faire exécuter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun chef d’accusation passible de mort » ou « aucun fondement légal pour le mettre à mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de le mettre à mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Le connecteur poursuit simplement le récit, sans ajouter de nuance causale ou chronologique.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: aucun motif justifiant une condamnation à mort
  rationale: Dans ce contexte judiciaire, αἰτία désigne un motif, un chef d’accusation ou un fondement légal, et θανάτου indique que la peine capitale est en jeu. Cette formulation française exprime clairement le sens juridique sans confondre l’expression avec une cause de décès.
- source_word: εὑρόντες
  choice: bien qu’ils n’aient trouvé
  rationale: 'Le participe aoriste indique une circonstance antérieure à la demande. Le contexte lui donne une valeur concessive manifeste : ils réclament sa mort malgré l’absence de motif valable.'
- source_word: ᾐτήσαντο
  choice: ils ont demandé
  rationale: Le verbe signifie demander ou solliciter. Le passé composé offre ici une narration naturelle et accessible en français moderne, tandis que le complément adressé à Pilate fait ressortir le caractère officiel de la demande.
- source_word: Πιλᾶτον
  choice: Pilate
  rationale: Le nom propre suit sa forme française conventionnelle.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: de le faire exécuter
  rationale: Dans ce cadre judiciaire, ἀναιρέω signifie supprimer, mettre à mort ou exécuter. La tournure retenue indique naturellement que Pilate est sollicité pour ordonner ou permettre l’exécution.
theological_decisions:
- issue: Valeur concessive du participe εὑρόντες
  choice: bien qu’ils n’aient trouvé
  alternative: après n’avoir trouvé / n’ayant trouvé
  rationale: Le grec laisse la relation circonstancielle implicite, mais le contexte oppose nettement l’absence de motif capital à la demande d’exécution. La formulation concessive préserve cette tension narrative et morale sans y ajouter une conclusion doctrinale.
- issue: Portée judiciaire de μηδεμίαν αἰτίαν θανάτου
  choice: aucun motif justifiant une condamnation à mort
  alternative: aucun chef d’accusation passible de mort / aucun fondement légal pour le mettre à mort
  rationale: 'Le choix maintient le cadre judiciaire et l’idée d’une peine capitale, tout en évitant d’affirmer plus précisément que le grec la nature exacte de l’αἰτία : motif, accusation ou fondement légal.'
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé favorise l’accessibilité narrative. La formulation conserve le contraste entre l’absence de motif valable et la demande d’exécution.
