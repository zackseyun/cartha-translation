  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: fr
  text: 'C’est pourquoi il dit aussi dans un autre psaume[a] : « Tu ne laisseras pas ton Saint[b] voir la décomposition[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ailleurs » ou « dans un autre passage » ; le grec dit simplement « dans un autre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ton fidèle ».
    reason: lexical_alternative
  - marker: c
    text: Ou « corruption ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: C’est pourquoi
  rationale: Dans le contexte, le terme introduit une conséquence tirée de l’argument précédent plutôt qu’une simple cause.
- source_word: καὶ
  choice: aussi
  rationale: Le mot ajoute un autre témoignage scripturaire à celui qui précède.
- source_word: ἐν ἑτέρῳ
  choice: dans un autre psaume
  rationale: Le grec dit littéralement « dans un autre », avec un nom sous-entendu. La citation provenant du Psaume 16, « psaume » explicite naturellement l’ellipse.
- source_word: λέγει
  choice: il dit
  rationale: Le présent conserve la formule de citation scripturaire; le sujet implicite peut renvoyer à Dieu, sans que la traduction le précise davantage.
- source_word: Οὐ δώσεις
  choice: Tu ne laisseras pas
  rationale: Avec l’infinitif, δίδωμι exprime ici la permission; « laisser » rend cet idiome en français naturel.
- source_word: τὸν ὅσιόν σου
  choice: ton Saint
  rationale: ὅσιος peut désigner celui qui est saint, fidèle ou pieux. « ton Saint » préserve la force religieuse du terme et convient à l’application explicite de ce psaume à Jésus dans le contexte.
- source_word: ἰδεῖν
  choice: connaître
  rationale: Littéralement « voir »; en français, « connaître la décomposition » exprime naturellement le fait d’en faire l’expérience, sans rendre l’image obscure.
- source_word: διαφθοράν
  choice: décomposition
  rationale: Dans l’argument portant sur la résurrection, le terme désigne la détérioration corporelle; « décomposition » est précis et immédiatement compréhensible.
theological_decisions:
- issue: Référence messianique et christologique de τὸν ὅσιόν σου
  choice: « ton Saint » avec une majuscule
  alternative: « ton fidèle » ou « ton saint »
  rationale: Paul applique explicitement cette citation à Jésus dans le contexte immédiat. La majuscule signale ce référent contextuel sans modifier le sens lexical du grec.
- issue: Nom sous-entendu après ἐν ἑτέρῳ
  choice: Expliciter « psaume » dans le texte
  alternative: « ailleurs » ou « dans un autre passage »
  rationale: Le substantif n’est pas exprimé en grec. Comme la citation vient du Psaume 16, l’explicitation aide le lecteur tout en restant fidèle au référent.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le présent de la citation et l’ambiguïté relative du sujet de « il dit », tout en explicitant sobrement le psaume sous-entendu.
