id: ACT.13.2
reference: Acts 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: fr
  text: 'Pendant qu’ils servaient le Seigneur et jeûnaient[a], l’Esprit Saint dit : « Mettez donc à part pour moi Barnabé et Saul, pour l’œuvre à laquelle je les ai appelés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendaient un culte au Seigneur ». Le verbe grec peut désigner un service comportant une dimension cultuelle ou liturgique.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: servaient
  rationale: Le verbe désigne un service accompli pour le Seigneur, avec ici de possibles connotations cultuelles. « Servaient » reste naturel et suffisamment large; une note signale explicitement la nuance de culte.
- source_word: τῷ κυρίῳ
  choice: le Seigneur
  rationale: Le datif désigne celui à qui ce service est rendu. En français, « servir le Seigneur » exprime naturellement cette relation sans devoir ajouter une préposition.
- source_word: νηστευόντων
  choice: jeûnaient
  rationale: Rendu courant du participe, coordonné à λειτουργούντων pour présenter deux activités simultanées.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Formulation française moderne et consacrée, qui conserve directement l’Esprit comme sujet personnel du verbe « dit ».
- source_word: Ἀφορίσατε
  choice: Mettez à part
  rationale: L’expression indique une séparation en vue d’une fonction déterminée, sans introduire l’idée technique d’ordination ou d’accès à un office.
- source_word: δή
  choice: donc
  rationale: La particule renforce l’injonction et peut marquer son caractère pressant. « Donc » la représente sobrement dans la phrase française.
- source_word: μοι
  choice: pour moi
  rationale: Le datif indique que Barnabé et Saul doivent être mis à part au service du dessein de l’Esprit.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Barnabé et Saul
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables de ces noms propres.
- source_word: εἰς τὸ ἔργον
  choice: en vue de l’œuvre
  rationale: « Œuvre » conserve la portée large de ἔργον sans la réduire à un ministère ecclésial ou à une fonction précise; « en vue de » rend l’orientation vers ce travail.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: à laquelle je les ai appelés
  rationale: Le passé composé rend naturellement l’appel antérieur dont les effets demeurent présents. « Appeler » convient au contexte de vocation sans durcir le sens en « convoquer ».
theological_decisions:
- issue: Sens de λειτουργούντων dans un contexte communautaire de jeûne et d’envoi
  choice: servaient le Seigneur
  alternative: rendaient un culte au Seigneur
  rationale: Le terme peut évoquer un service cultuel, mais il ne faut pas imposer une pratique liturgique précise. Le texte principal garde le sens large de service, tandis que la note préserve la nuance cultuelle possible.
- issue: L’Esprit saint comme sujet parlant
  choice: l’Esprit saint dit
  alternative: —
  rationale: Le grec présente sans détour l’Esprit saint comme celui qui parle; la traduction maintient cette construction personnelle.
- issue: Portée de ἀφορίσατε ... εἰς τὸ ἔργον
  choice: Mettez donc à part pour moi ... en vue de l’œuvre
  alternative: Établissez-les dans le ministère
  rationale: L’ordre exprime une mise à part divine pour une tâche, sans définir ici une ordination, un office ou une structure ecclésiale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du mouvement de la phrase grecque, tout en évitant le tour ecclésiastique potentiellement étroit « exerçaient leur ministère ». Le discours direct est ponctué selon l’usage français.
