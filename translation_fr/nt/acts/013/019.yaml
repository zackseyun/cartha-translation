  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: fr
  text: Après avoir détruit sept nations dans le pays de Canaan, il donna leur pays en héritage aux Israélites.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il attribua aux Israélites le pays de ces nations comme héritage ». Le verbe grec peut mettre l’accent sur l’attribution ou la répartition d’un héritage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: après avoir détruit
  rationale: Le participe aoriste de καθαιρέω décrit ici l’action de Dieu contre les nations cananéennes. « Détruit » exprime clairement la force du verbe dans le contexte de la conquête.
- source_word: ἔθνη ἑπτὰ
  choice: sept nations
  rationale: ἔθνη peut désigner des nations ou des peuples. « Sept nations » est naturel et convient au cadre historique.
- source_word: ἐν γῇ Χανάαν
  choice: dans le pays de Canaan
  rationale: Cette formulation rend explicitement γῇ (« pays, terre ») sans réduire l’expression au seul nom « Canaan ».
- source_word: κατεκληρονόμησεν
  choice: il donna […] en héritage
  rationale: Le verbe peut exprimer l’attribution ou la répartition d’un territoire comme héritage. Cette formulation conserve le thème de l’héritage dans un français courant et digne.
- source_word: τὴν γῆν αὐτῶν
  choice: leur pays
  rationale: Le pronom αὐτῶν renvoie naturellement aux sept nations qui viennent d’être mentionnées.
theological_decisions:
- issue: Sujet et bénéficiaires implicites de l’héritage
  choice: Dieu est le sujet des deux actions, et les Israélites sont les bénéficiaires du pays donné en héritage.
  alternative: 'Ne pas nommer les bénéficiaires : « il donna leur pays en héritage ».'
  rationale: Le contexte immédiat énumère les actes de Dieu dans l’histoire d’Israël. Le grec ne nomme pas ici le bénéficiaire, mais celui-ci est fourni par le récit. « Aux Israélites » explicite cette relation nécessaire en français sans ajouter une affirmation doctrinale étrangère au passage.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La structure temporelle du participe grec est conservée. Le bénéficiaire implicite est explicité pour éviter une phrase française incomplète ou ambiguë.
