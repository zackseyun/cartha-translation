  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: fr
  text: 'Après l’avoir écarté, Dieu leur suscita David comme roi et rendit aussi ce témoignage à son sujet : « J’ai trouvé David, fils de Jessé, un homme selon mon cœur[a], qui accomplira toutes mes volontés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se rendre : « un homme conforme à mon cœur ». Le grec dit littéralement « selon mon cœur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici le pluriel : « toutes mes volontés » ; on peut aussi traduire plus idiomatiquement « toute ma volonté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: Après l’avoir écarté
  rationale: Le participe aoriste désigne ici le retrait de Saül de la royauté. « Écarté » reste assez large et naturel, sans préciser indûment s’il s’agit seulement d’une destitution politique.
- source_word: ἤγειρεν
  choice: suscita
  rationale: Dans ce contexte, ἐγείρω signifie que Dieu fait surgir ou établit un dirigeant. « Suscita » conserve l’idiome biblique sans suggérer ici une résurrection.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: leur suscita David comme roi
  rationale: 'Le datif αὐτοῖς est rendu par « leur », et εἰς βασιλέα exprime la fonction ou le résultat : David est suscité pour eux comme roi.'
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Il lui rendit aussi ce témoignage
  rationale: Cette formulation française suit le datif du relatif et exprime naturellement la valeur testimoniale de μαρτυρέω; les paroles témoignent en même temps au sujet de David.
- source_word: Εὗρον
  choice: J’ai trouvé
  rationale: Le passé composé rend naturellement l’action accomplie et sa pertinence présente dans cette parole divine citée.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: David, fils de Jessé
  rationale: Le génitif elliptique grec désigne idiomatiquement David comme fils de Jessé.
- source_word: κατὰ τὴν καρδίαν μου
  choice: selon mon cœur
  rationale: Cette traduction transparente de κατά + accusatif préserve l’expression biblique et évite de la réduire à une simple affinité affective.
- source_word: ποιήσει
  choice: accomplira
  rationale: « Accomplira » exprime ici le fait de mettre pleinement à exécution les desseins ou volontés de Dieu.
- source_word: πάντα τὰ θελήματά μου
  choice: toutes mes volontés
  rationale: Le grec emploie le pluriel θελήματα. Le français peut conserver ce pluriel pour désigner les diverses intentions ou décisions de Dieu.
theological_decisions:
- issue: Caractérisation de David
  choice: un homme selon mon cœur
  alternative: un homme qui correspond à mon cœur / un homme selon mes désirs
  rationale: « Selon mon cœur » garde la formulation et la tension du texte source sans expliquer d’avance si elle concerne le choix, le dessein, la disposition ou l’approbation de Dieu.
- issue: Sens de l’établissement de David
  choice: Dieu leur suscita David comme roi
  alternative: Dieu établit David comme roi pour eux
  rationale: « Suscita » préserve l’idiome de ἐγείρω et sa portée intertextuelle, tandis que « comme roi » empêche normalement de comprendre une résurrection.
- issue: Pluriel des volontés divines
  choice: toutes mes volontés
  alternative: toute ma volonté
  rationale: Le pluriel du texte grec est conservé sans en tirer une distinction doctrinale particulière; il peut évoquer l’ensemble des intentions ou décisions divines.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est scindée pour éviter une relative lourde. Le nom « Dieu » est rétabli comme sujet explicite après le participe, conformément au contexte, et les marqueurs [a] et [b] figurent dans le texte principal.
