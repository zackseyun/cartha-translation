    issue: Référent de « lui » dans « Il lui rendit aussi ce témoignage »
    rationale: Le datif relatif ᾧ, avec μαρτυρήσας, introduit ici un témoignage concernant David. En français, « rendre témoignage à quelqu’un » peut suggérer un témoignage rendu en sa faveur ou adressé à lui. « Rendre ce témoignage à son sujet » restitue plus nettement la portée de la construction grecque et de la citation.
