id: ACT.13.37
reference: Acts 13:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: fr
  text: Mais celui que Dieu a ressuscité n’a pas connu la décomposition[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’a pas vu la corruption ». Le terme grec peut désigner la corruption ou la décomposition du corps; « corruption » reprend la formulation du Psaume 16.10 dans les Écritures grecques.'
    reason: Alternative lexicale et conservation de l’écho intertextuel.
lexical_decisions:
- source_word: ὃν
  choice: celui que
  rationale: Le pronom relatif renvoie à Jésus, déjà au centre de l’argument. « Celui que » rend clairement sa fonction de complément tout en restant naturel en français.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici le contraste avec David, qui, lui, a connu la décomposition.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: En français idiomatique, le nom divin s’emploie ici sans article.
- source_word: ἤγειρεν
  choice: a ressuscité
  rationale: Dans le contexte immédiat, l’opposition entre la mort, la décomposition et l’action de Dieu impose le sens de résurrection. « A ressuscité » l’exprime naturellement en français sans recourir à une périphrase.
- source_word: οὐκ εἶδεν
  choice: n’a pas connu
  rationale: Littéralement « n’a pas vu ». L’expression française « connaître la décomposition » conserve l’idée d’en faire l’expérience sans produire une tournure artificielle.
- source_word: διαφθοράν
  choice: décomposition
  rationale: Le terme désigne ici la corruption physique du corps. « Décomposition » est clair et précis en français moderne; « corruption » est conservé en note en raison de l’écho scripturaire.
theological_decisions:
- issue: Sens de résurrection de ἤγειρεν
  choice: « a ressuscité », Dieu ayant relevé Jésus d’entre les morts
  alternative: « a suscité », au sens de l’établir ou de le faire paraître
  rationale: Le contraste immédiat avec David, qui est mort et a connu la décomposition, rend le sens de résurrection décisif dans ce verset.
- issue: Expression οὐκ εἶδεν διαφθοράν
  choice: « n’a pas connu la décomposition »
  alternative: « n’a pas vu la corruption »
  rationale: Le choix principal communique naturellement l’absence de décomposition corporelle, tandis que la note préserve la formulation plus littérale et son lien verbal avec le Psaume 16.10 dans la version grecque.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation privilégie la clarté courante tout en signalant en note l’expression grecque littérale et l’écho au Psaume.
