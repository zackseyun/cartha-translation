  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: fr
  text: Après cela, ils demandèrent un roi[a], et Dieu leur donna Saül, fils de Kis, un homme de la tribu de Benjamin, pour quarante ans[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Puis ils demandèrent un roi ». Le terme d’ouverture peut servir de simple transition dans la suite du récit historique.
    reason: lexical_alternative
  - marker: b
    text: La mention de « quarante ans » peut soulever des questions chronologiques lorsqu’on la compare aux données de l’Ancien Testament ; la traduction conserve ici la formulation de Luc.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Après cela
  rationale: Dans ce résumé historique, le terme composé assure la transition avec l’étape précédente. « Après cela » exprime naturellement en français moderne cette progression, sans imposer un déplacement géographique.
- source_word: ᾐτήσαντο βασιλέα
  choice: ils demandèrent un roi
  rationale: Le moyen indique que le peuple formule cette demande pour lui-même. « Demandèrent » reste neutre et n’accentue pas le ton comme le ferait « exigèrent ».
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Dieu leur donna
  rationale: La formulation conserve le verbe courant « donner », l’objet indirect et le sujet explicite, sans préciser davantage la nature de l’action divine.
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Saül, fils de Kish
  rationale: Les noms suivent leur forme française biblique usuelle, et l’expression patronymique est rendue de façon concise et naturelle.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: un homme de la tribu de Benjamin
  rationale: La traduction conserve la désignation masculine individuelle de Saul ainsi que son origine tribale.
- source_word: ἔτη τεσσεράκοντα
  choice: pour quarante ans
  rationale: L’accusatif exprime une durée. La place de l’expression à la fin de la phrase maintient son rattachement le plus naturel au don de Saül comme roi.
theological_decisions:
- issue: Rattachement et portée de ἔτη τεσσεράκοντα
  choice: « pour quarante ans » est rattaché à l’action par laquelle Dieu donna Saül au peuple, ce qui implique naturellement la durée de sa royauté.
  alternative: Comprendre l’indication de manière plus lâche dans le résumé historique, notamment en raison des questions chronologiques soulevées par les données de l’Ancien Testament.
  rationale: La syntaxe grecque rattache le plus naturellement la durée à la proposition immédiatement précédente. La traduction conserve cette formulation sans tenter de résoudre ou d’harmoniser la difficulté chronologique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste proche du grec tout en privilégiant un enchaînement naturel en français.
