id: ACT.13.43
reference: Acts 13:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: fr
  text: Après la fin de l’assemblée à la synagogue[a], beaucoup de Juifs et de prosélytes fervents suivirent Paul et Barnabé, qui leur parlaient et les exhortaient à persévérer dans la grâce de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après que l’assemblée se fut dispersée. » Le grec peut désigner la fin de l’assemblée réunie plutôt que la synagogue en tant que bâtiment.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les persuadaient de demeurer dans la grâce de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Après la fin de la réunion à la synagogue
  rationale: Le génitif absolu exprime une circonstance antérieure. Ici, συναγωγή désigne vraisemblablement l’assemblée réunie plutôt que le bâtiment; cette formulation française naturelle évite de suggérer que l’édifice lui-même aurait été congédié.
- source_word: ἠκολούθησαν
  choice: suivirent
  rationale: Rend directement l’action des personnes qui allèrent à la suite de Paul et Barnabé après la réunion.
- source_word: πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: beaucoup de Juifs et de prosélytes fervents
  rationale: « Beaucoup de » restitue le partitif naturellement. προσήλυτοι désigne des convertis au judaïsme, tandis que σεβομένων souligne leur piété; « fervents » est ici idiomatique et distingue ces prosélytes des simples sympathisants non convertis.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: s’entretinrent avec eux
  rationale: Exprime une conversation adressée à ceux qui les suivaient, dans un français courant et digne.
- source_word: ἔπειθον
  choice: les encourageaient
  rationale: L’imparfait grec présente une action en cours. Dans ce contexte exhortatif, « encourageaient » convient mieux que le plus argumentatif « persuadaient », sans exclure l’idée d’insistance.
- source_word: αὐτοὺς προσμένειν
  choice: à demeurer
  rationale: προσμένω signifie rester, continuer ou persévérer. « Demeurer » s’accorde naturellement avec le complément « dans la grâce » tout en conservant l’idée de continuité.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: dans la grâce de Dieu
  rationale: La formulation conserve la portée théologique de χάρις sans la réduire soit à la faveur divine, soit au seul message de l’Évangile.
theological_decisions:
- issue: Sens de « la grâce de Dieu » dans l’exhortation apostolique
  choice: demeurer dans la grâce de Dieu
  alternative: continuer à bénéficier de la faveur de Dieu / rester attachés au message de la grâce de Dieu
  rationale: Le grec peut désigner à la fois l’action bienveillante de Dieu et la sphère de vie façonnée par cette grâce. La formulation retenue préserve cette richesse et la tension théologique sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. Le découpage en deux phrases clarifie que « ceux-ci » renvoie à Paul et Barnabé. « Prosélytes » est conservé pour sa précision historique, et « grâce de Dieu » reste non paraphrasé afin de préserver son amplitude théologique.
