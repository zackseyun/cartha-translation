  to: Après la fin de l’assemblée à la synagogue[a], beaucoup de Juifs et de prosélytes fervents suivirent Paul et Barnabé, qui leur parlaient et les exhortaient à persévérer dans la grâce de Dieu[b].
  rationale: La révision rend le participe présent προσλαλοῦντες et l’imparfait ἔπειθον par deux verbes coordonnés à l’imparfait dans une relative dont l’antécédent est clairement Paul et Barnabé. Elle conserve le sens historique de « prosélytes » et l’ambiguïté théologique de « la grâce de Dieu ».
