  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: fr
  text: Il est apparu pendant de nombreux jours[a] à ceux qui étaient montés avec lui de la Galilée à Jérusalem, et qui sont maintenant ses témoins auprès du peuple.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a été vu pendant de nombreux jours. » Dans les contextes d’apparitions après la résurrection, le verbe grec peut aussi être rendu plus formellement de cette manière.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « le peuple » désigne vraisemblablement le peuple juif, c’est-à-dire Israël.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Il
  rationale: Le pronom relatif renvoie à Jésus au verset précédent. En français, la reprise par « Il » forme une phrase naturelle tout en gardant clairement le même référent.
- source_word: ὤφθη
  choice: est apparu
  rationale: Dans les récits d’apparitions après la résurrection, l’aoriste passif de ὁράω prend couramment le sens d’« apparaître ». « A été vu » demeure une possibilité plus formelle, signalée en note.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: pendant de nombreux jours
  rationale: La préposition avec l’accusatif exprime ici une durée. Cette formulation est claire, naturelle et fidèle.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: à ceux qui étaient montés avec lui
  rationale: Le participe désigne ceux qui l’avaient accompagné dans la montée vers Jérusalem. Le plus-que-parfait marque naturellement l’antériorité de ce déplacement par rapport aux apparitions.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: de la Galilée à Jérusalem
  rationale: La formulation rend directement le point de départ et la destination; « montés » conserve l’expression géographique et culturelle de la montée à Jérusalem.
- source_word: οἵτινες
  choice: et qui
  rationale: Le relatif caractérise ce groupe comme celui qui exerce maintenant la fonction de témoin. L’ajout idiomatique de « et » assure un enchaînement français fluide sans modifier le rapport syntaxique.
- source_word: νῦν
  choice: maintenant
  rationale: Le terme marque leur statut présent par contraste avec les apparitions passées.
- source_word: μάρτυρες αὐτοῦ
  choice: ses témoins
  rationale: Cette expression française naturelle conserve la relation à Jésus et peut désigner des témoins qui rendent témoignage à son sujet.
- source_word: πρὸς τὸν λαόν
  choice: auprès du peuple
  rationale: πρός avec l’accusatif oriente ici l’activité de témoignage vers son public. « Auprès du peuple » exprime naturellement la mission exercée devant et à destination de celui-ci.
- source_word: λαόν
  choice: le peuple
  rationale: Dans le contexte, le mot vise vraisemblablement le peuple juif, mais le grec ne précise pas explicitement « Israël ». Le texte principal conserve donc sa formulation non développée.
theological_decisions:
- issue: Nature du langage relatif aux apparitions après la résurrection
  choice: Il est apparu
  alternative: Il a été vu
  rationale: « Est apparu » rend naturellement l’emploi de ὤφθη dans ce contexte sans atténuer la réalité historique du témoignage. La tournure passive plus formelle reste indiquée en note.
- issue: Portée de « le peuple »
  choice: le peuple
  alternative: le peuple d’Israël
  rationale: Le contexte désigne très probablement Israël ou le peuple juif, mais λαός n’est accompagné d’aucune précision explicite. La traduction évite donc d’intégrer cette interprétation au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant une tournure relative maladroite en début de phrase. Les marqueurs de notes sont placés après les expressions auxquelles ils se rapportent.
