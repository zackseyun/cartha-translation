    rationale: Le grec vise des femmes de condition honorable ou élevée ; elles pouvaient certes avoir de l’influence, mais celle-ci n’est pas le sens exclusif du terme.
  - severity: low
    issue: La note b propose « au-delà de leurs frontières », formulation moins directe que l’alternative lexicale pertinente.
    rationale: ὅρια peut désigner les frontières elles-mêmes ou le territoire/la région qu’elles délimitent. « De leurs frontières » reproduit mieux l’alternative sans ajouter une nuance de franchissement.
