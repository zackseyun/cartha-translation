revisions:
- from: Mais les Juifs poussèrent à l’action les femmes pieuses et influentes[a], ainsi que les notables de la ville. Ils déclenchèrent une persécution contre Paul et Barnabé et les chassèrent de leur territoire[b].
  to: Mais les Juifs poussèrent les femmes pieuses de haut rang[a], ainsi que les notables de la ville, à agir. Ils déclenchèrent une persécution contre Paul et Barnabé et les chassèrent de leur territoire[b].
  rationale: La révision rend εὐσχήμονας par « de haut rang », formulation qui couvre le statut et la respectabilité sans limiter le sens à l’influence. Elle conserve l’instigation exprimée par παρώτρυναν dans un français naturel. La note a remplace une probabilité non établie par une possibilité, et la note b présente plus exactement les deux sens géographiques de ὅρια.
