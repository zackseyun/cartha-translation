source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: fr
  text: Mais les Juifs poussèrent les femmes pieuses de haut rang[a], ainsi que les notables de la ville, à agir. Ils déclenchèrent une persécution contre Paul et Barnabé et les chassèrent de leur territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut désigner des femmes qui craignaient Dieu, peut-être des non-Juives associées à la synagogue, qui adoraient le Dieu d’Israël.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de leur région » ou « de leurs frontières ». Le terme grec peut désigner des limites territoriales ou l’espace qu’elles délimitent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Mais les Juifs
  rationale: δέ marque ici le contraste avec l’accueil favorable décrit au verset précédent; « Mais » rend naturellement ce tournant narratif.
- source_word: παρώτρυναν
  choice: poussèrent à l’action
  rationale: Le verbe exprime une instigation active. Cette formulation reste naturelle en français et évite de suggérer que les personnes concernées étaient déjà hostiles.
- source_word: σεβομένας γυναῖκας
  choice: les femmes pieuses
  rationale: Le participe désigne des femmes qui révéraient le Dieu d’Israël, souvent, dans les Actes, des non-Juives liées à la synagogue. « Pieuses » préserve cette orientation religieuse sans imposer un statut technique.
- source_word: εὐσχήμονας
  choice: influentes
  rationale: Dans ce contexte social, l’adjectif évoque le rang, la respectabilité et la considération publique. « Influentes » rend clairement la capacité de ces femmes à peser sur la vie de la cité.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: les notables de la ville
  rationale: L’expression désigne les hommes occupant le premier rang dans la cité. « Notables » est une formulation française actuelle et idiomatique pour l’élite civique, bien que le genre masculin explicite du grec soit moins visible lexicalement en français.
- source_word: ἐπήγειραν διωγμὸν
  choice: Ils déclenchèrent une persécution
  rationale: La construction signifie qu’ils firent surgir ou provoquèrent une persécution. « Déclenchèrent » en conserve la force causative sans répétition maladroite.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: contre Paul et Barnabé
  rationale: Avec « persécution », ἐπί suivi de l’accusatif indique naturellement la direction hostile.
- source_word: ἐξέβαλον
  choice: les chassèrent
  rationale: Le verbe est énergique et implique une expulsion coercitive; « chassèrent » en restitue la force dans un français courant et digne.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: de leur territoire
  rationale: ὅρια peut désigner les frontières ou l’étendue qu’elles délimitent. « Territoire » convient au cadre civique tout en laissant ouverte l’échelle exacte de la zone.
theological_decisions:
- issue: Statut religieux des femmes désignées par σεβομένας
  choice: femmes pieuses
  alternative: femmes qui craignaient Dieu
  rationale: Le grec indique leur révérence ou leur culte, mais ne précise pas formellement leur origine ethnique ni un statut institutionnel. Le texte principal conserve cette retenue, et la note signale l’interprétation fréquente dans les Actes.
- issue: Genre des personnes désignées par τοὺς πρώτους τῆς πόλεως
  choice: les notables de la ville
  alternative: les hommes influents de la ville
  rationale: Le grec emploie un masculin pluriel pour les personnages de premier rang. « Notables » désigne idiomatiquement en français les membres de l’élite civique sans ajouter une fonction officielle que le texte ne précise pas.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation privilégie des verbes directs et courants. Les deux notes maintiennent l’ambiguïté du statut religieux des femmes et de l’étendue géographique visée.
