  source_fidelity: 'Le sens général est bien rendu : les Juifs incitent des femmes et des notables, provoquent une persécution contre Paul et Barnabé, puis les expulsent. Toutefois, « influentes » réduit εὐσχήμονας à l’influence effective, alors que le terme exprime plus largement le rang et la respectabilité. La note a va au-delà de l’ambiguïté préservée par le grec et par la piste d’audit anglaise en disant « probablement » et en présentant les femmes comme non-Juives.'
  naturalness: Le français est fluide et d’un registre narratif approprié. « Poussèrent à l’action » est compréhensible, mais « poussèrent ... à agir » est plus idiomatique. « Femmes pieuses de haut rang » rend plus naturellement l’association de leur piété et de leur statut social.
  terminology: « Juifs », « persécution », « Paul », « Barnabé » et « notables de la ville » conviennent. « De haut rang » restitue mieux εὐσχήμονας sans surinterpréter le mot comme une influence politique. Les notes doivent conserver la possibilité, et non la probabilité, que les femmes aient été des adhérentes non juives associées à la synagogue.
  issues:
