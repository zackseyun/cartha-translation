lexical_decisions:
- source_word: καί
  choice: Et
  rationale: Connecteur simple qui poursuit le récit historique.
- source_word: ὡς
  choice: environ
  rationale: Devant une durée, le terme marque ici l’approximation.
- source_word: τεσσερακονταετῆ χρόνον
  choice: pendant environ quarante ans
  rationale: Cette tournure rend naturellement en français la durée exprimée par le groupe grec, avec ὡς rendu par « environ ».
- source_word: ἐτροποφόρησεν
  choice: il les a supportés
  rationale: Dans le texte grec imprimé, le verbe signifie le plus naturellement « supporter » ou « prendre en patience », en accord avec le contexte des rébellions d’Israël; la variante « prendre soin » est signalée en note.
- source_word: αὐτοὺς
  choice: les
  rationale: Pronom objet renvoyant au peuple d’Israël.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme français naturel et traditionnel pour la région où Israël a erré.
theological_decisions:
- issue: Sens de l’action de Dieu envers Israël au désert
  choice: il les a supportés
  alternative: il a pris soin d’eux
  rationale: Le texte SBLGNT fourni porte ἐτροποφόρησεν, qui exprime l’idée de supporter ou de prendre en patience. La variante manuscrite à valeur nourricière est conservée en note afin de ne pas effacer la tension textuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Supportés » reste idiomatique tout en conservant la nuance négative du texte grec retenu; « désert » préserve l’écho biblique usuel.
