id: ACT.13.26
reference: Acts 13:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: fr
  text: 'Frères[a], fils de la lignée d’Abraham, ainsi que ceux d’entre vous qui craignent Dieu[b] : c’est à nous que le message de ce salut[c] a été envoyé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hommes, frères ». L’apostrophe grecque est littéralement masculine; elle peut néanmoins viser l’ensemble plus large des personnes réunies.
    reason: lexical_alternative
  - marker: b
    text: Ou « les craignant-Dieu parmi vous », désignation possible de non-Juifs qui fréquentaient la synagogue et adoraient le Dieu d’Israël.
    reason: cultural_note
  - marker: c
    text: Ou « la parole de ce salut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: Cette apostrophe courante est naturelle en français et conserve la forme masculine du grec. La formulation littérale « Hommes, frères » serait lourde et peu idiomatique.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: fils de la lignée d’Abraham
  rationale: « Fils » rend explicitement υἱοί, tandis que « lignée » exprime ici l’ascendance et l’appartenance familiale indiquées par γένος.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: ceux d’entre vous qui craignent Dieu
  rationale: La traduction descriptive reste transparente et ne transforme pas nécessairement l’expression en étiquette technique désignant les sympathisants non juifs de la synagogue.
- source_word: ἡμῖν
  choice: c’est à nous que
  rationale: La tournure détachée restitue la mise en relief du datif placé en tête de proposition et la direction du verbe « envoyer ».
- source_word: ὁ λόγος
  choice: le message
  rationale: Dans ce contexte de proclamation, « message » exprime naturellement le sens de λόγος en français moderne; « parole » demeure une possibilité plus formelle.
- source_word: τῆς σωτηρίας ταύτης
  choice: de ce salut
  rationale: Cette formulation conserve le génitif grec et l’emploi théologique usuel de σωτηρία sans imposer une relation plus précise telle que « au sujet de ».
- source_word: ἐξαπεστάλη
  choice: a été envoyé
  rationale: Le passé composé passif rend l’envoi accompli tout en gardant sa pertinence dans la situation présente du discours.
theological_decisions:
- issue: Désignation de ceux qui craignent Dieu
  choice: 'Traduction descriptive : « ceux d’entre vous qui craignent Dieu »'
  alternative: « les craignant-Dieu parmi vous » ou « ceux d’entre vous qui adorent Dieu »
  rationale: La traduction retenue préserve le sens immédiat de l’expression et laisse ouverte la question de savoir s’il s’agit d’une désignation semi-technique de non-Juifs liés à la synagogue.
- issue: Langage masculin dans l’apostrophe
  choice: Conserver « Frères » et « fils »
  alternative: « Frères et sœurs » et « descendants »
  rationale: Les termes grecs sont explicitement masculins. La traduction n’élargit donc pas lexicalement leur portée, tout en signalant en note que l’auditoire public pouvait être plus large.
- issue: Relation exprimée par « le message de ce salut »
  choice: Conserver la formulation génitive
  alternative: « le message au sujet de ce salut »
  rationale: Le génitif peut indiquer le contenu ou caractériser le message. La formulation retenue préserve cette souplesse au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe avec « c’est à nous que » conserve l’accent du grec sans devenir artificielle. Les expressions historiquement ou lexicalement ambiguës sont maintenues dans le texte et précisées sobrement en notes.
