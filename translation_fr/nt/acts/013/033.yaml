id: ACT.13.33
reference: Acts 13:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: fr
  text: 'que Dieu a accompli cette promesse pour nos enfants[a] en suscitant Jésus[b], comme il est aussi écrit dans le deuxième psaume : « Tu es mon Fils ; moi, aujourd’hui, je t’ai engendré. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits lisent : « pour nous, leurs enfants » ; d’autres : « pour nos enfants ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « en ressuscitant Jésus d’entre les morts ». Le verbe grec peut aussi signifier que Dieu a suscité Jésus, c’est-à-dire qu’il l’a fait paraître ou l’a établi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: a accompli
  rationale: Le parfait exprime un accomplissement achevé dont les effets demeurent ; « a accompli » conserve le vocabulaire biblique de l’accomplissement de la promesse.
- source_word: ταύτην
  choice: cette promesse
  rationale: Le pronom féminin renvoie à « la promesse » du verset précédent. La reprise explicite est naturelle en français et rend le référent clair sans modifier le sens.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: pour nos enfants
  rationale: Cette formulation suit le texte principal du SBLGNT. Le datif est rendu par « pour » dans le contexte de l’accomplissement d’une promesse ; la variante importante est signalée en note.
- source_word: ἀναστήσας Ἰησοῦν
  choice: en suscitant Jésus
  rationale: « Susciter » peut désigner l’action de faire paraître ou d’établir quelqu’un tout en laissant ouverte, dans ce contexte, une possible résonance de résurrection. La note expose explicitement cette ambiguïté.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture, qui convient à la valeur durable du parfait passif.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: dans le deuxième psaume
  rationale: Rend directement la numérotation ordinale présente dans le grec, dans un français naturel.
- source_word: Υἱός μου εἶ σύ
  choice: Tu es mon Fils
  rationale: L’ordre français naturel exprime clairement l’identification solennelle du psaume.
- source_word: σήμερον γεγέννηκά σε
  choice: moi, aujourd’hui, je t’ai engendré
  rationale: « Engendré » rend directement γεννάω et conserve la portée intertextuelle et christologique de Psaume 2. Le pronom « moi » représente l’emphase de ἐγώ sans alourdir excessivement la citation.
theological_decisions:
- issue: Sens de ἀναστήσας Ἰησοῦν dans ce contexte
  choice: « en suscitant Jésus », avec une note maintenant ouverte la lecture liée à la résurrection
  alternative: « en ressuscitant Jésus d’entre les morts »
  rationale: Le paragraphe parle de la résurrection, mais ἀνίστημι peut aussi désigner le fait que Dieu suscite ou fait paraître un envoyé. La traduction principale ne tranche donc pas silencieusement la tension interprétative.
- issue: Portée christologique de « aujourd’hui, je t’ai engendré »
  choice: Conserver directement la formulation du Psaume 2.7
  alternative: Paraphraser en termes d’intronisation, d’adoption ou de manifestation par la résurrection
  rationale: Le texte cité ne doit pas être développé de manière à imposer une explication doctrinale particulière. « Engendré » préserve sa force et son ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Suscitant » maintient une légère solennité biblique utile ici ; « engendré » est conservé pour sa précision et son lien reconnaissable avec le Psaume 2. Les appels de note sont placés exactement sur les expressions auxquelles ils se rapportent.
