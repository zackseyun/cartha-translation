id: ACT.13.4
reference: Acts 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: fr
  text: Eux donc, envoyés par l’Esprit Saint[a], descendirent à Séleucie et, de là, prirent la mer pour Chypre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit saint ». L’expression grecque signifie littéralement « l’esprit saint »; dans les Actes, elle désigne cependant l’agent divin personnel habituellement appelé « l’Esprit Saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: Eux
  rationale: Le pronom grec est exprimé et légèrement emphatique. « Eux » conserve cette mise en relief en tête de phrase sans alourdir le récit.
- source_word: μὲν οὖν
  choice: donc
  rationale: Cette combinaison assure la progression du récit tout en reliant le départ à l’envoi raconté précédemment. « Donc » rend naturellement ce lien en français.
- source_word: ἐκπεμφθέντες
  choice: envoyés
  rationale: Le participe aoriste passif présente l’envoi comme antérieur aux déplacements qui suivent. La construction française « envoyés…, descendirent » maintient la voix passive et cet ordre logique.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: par l’Esprit Saint
  rationale: ὑπό suivi du génitif désigne ici l’agent de l’envoi. Dans les Actes, l’expression renvoie à l’agent divin personnel habituellement appelé « l’Esprit Saint » en français.
- source_word: κατῆλθον
  choice: descendirent
  rationale: Le verbe indique un mouvement vers le bas, ici vraisemblablement d’Antioche vers le port côtier. « Descendirent » en conserve le sens concret.
- source_word: εἰς Σελεύκειαν
  choice: à Séleucie
  rationale: Devant une ville de destination, « à » est l’équivalent français idiomatique. Le toponyme reçoit sa forme française traditionnelle.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Cette expression rend directement le point de départ du voyage maritime.
- source_word: τε
  choice: et
  rationale: La conjonction relie étroitement le départ en mer au déplacement précédent; « et » en restitue simplement la fonction narrative.
- source_word: ἀπέπλευσαν
  choice: prirent la mer
  rationale: Le verbe composé exprime le départ par mer. « Prirent la mer » est une formulation française naturelle qui conserve à la fois l’idée de navigation et celle du départ.
- source_word: εἰς Κύπρον
  choice: pour Chypre
  rationale: Avec « prendre la mer », « pour » indique naturellement la destination. Le nom de l’île suit l’usage français établi.
theological_decisions:
- issue: Interprétation de ἁγίου πνεύματος
  choice: l’Esprit Saint
  alternative: l’esprit saint
  rationale: Le contexte des Actes présente ici l’Esprit comme l’agent personnel qui envoie les missionnaires. La majuscule rend ce référent divin selon l’usage français, sans ajouter au texte une précision doctrinale absente.
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve la légère insistance de Αὐτοὶ par « Eux », le lien narratif de μὲν οὖν par « donc » et le mouvement géographique concret par « descendirent ». « Prirent la mer » évite un calque tout en préservant la nuance de départ maritime.
