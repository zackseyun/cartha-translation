  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: fr
  text: Arrivés à Salamine, ils proclamaient la parole de Dieu dans les synagogues des Juifs. Ils avaient aussi Jean pour assistant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme auxiliaire » ou « comme aide ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Arrivés à Salamine
  rationale: Avec un lieu introduit par ἐν, le participe aoriste de γίνομαι exprime ici naturellement l’arrivée. La tournure française conserve la relation temporelle avec le verbe principal sans alourdir la phrase.
- source_word: κατήγγελλον
  choice: ils proclamaient
  rationale: Le verbe désigne une annonce publique. « Proclamaient » en garde la portée sans la restreindre à l’idée moderne d’une prédication formelle. L’imparfait rend l’aspect imperfectif du grec.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette formulation transparente préserve le génitif grec ainsi que la possibilité d’entendre « parole » comme le message ou la révélation venant de Dieu.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: dans les synagogues des Juifs
  rationale: « Synagogues » est le terme précis dans ce contexte, et « Juifs » désigne ici le groupe ethnoreligieux plutôt que les seuls habitants de la Judée.
- source_word: εἶχον δὲ καὶ
  choice: Ils avaient aussi
  rationale: Une nouvelle phrase rend naturellement la légère transition marquée par δέ, tandis que « aussi » exprime la valeur additive de καί.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom Ἰωάννης.
- source_word: ὑπηρέτην
  choice: comme assistant
  rationale: Le terme désigne un auxiliaire ou un accompagnateur chargé d’un service. « Assistant » convient au contexte du voyage missionnaire et évite les connotations plus serviles de « serviteur ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour éviter une coordination lourde. Le marqueur de note est placé immédiatement après le terme concerné.
