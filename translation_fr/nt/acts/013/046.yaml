  source_fidelity: 'Le texte rend correctement les éléments essentiels du grec : la parole assurée de Paul et Barnabas, la nécessité que la parole de Dieu soit d’abord adressée à cet auditoire, le rejet présent de cette parole, le jugement réflexif qu’ils portent sur eux-mêmes quant à la vie éternelle, et le mouvement vers les non-Juifs. « Annoncée » est une explicitation idiomatique recevable de λαληθῆναι dans ce contexte de proclamation.'
  naturalness: Le français est fluide, moderne et de registre biblique sobre. « Avec assurance », « en premier », « voici que » et « nous nous tournons vers » sont naturels sans être familiers. La répétition explicite de « vous-mêmes » met utilement en relief le réfléchi grec.
  terminology: « La parole de Dieu » est établi et approprié pour τὸν λόγον τοῦ θεοῦ. « Les non-Juifs » rend clairement τὰ ἔθνη dans le contraste synagogal immédiat, sans la charge possible de « païens » ; la note conserve avec justesse l’alternative « les nations ». « Vie éternelle » et « indignes » préservent le vocabulaire théologique sans surinterprétation doctrinale.
