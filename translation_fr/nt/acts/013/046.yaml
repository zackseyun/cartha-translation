id: ACT.13.46
reference: Acts 13:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: fr
  text: 'Paul et Barnabas leur dirent alors avec assurance : « Il fallait que la parole de Dieu vous soit annoncée en premier. Puisque vous la rejetez et que vous vous jugez vous-mêmes indignes de la vie éternelle, voici que nous nous tournons vers les non-Juifs[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers les nations ». Ici, l’expression désigne les peuples non juifs, par contraste avec l’auditoire de la synagogue.
    reason: Alternative lexicale et précision contextuelle pour τὰ ἔθνη.
lexical_decisions:
- source_word: παρρησιασάμενοι
  choice: dirent […] avec assurance
  rationale: Le participe exprime une parole franche et courageuse. La tournure adverbiale française rend naturellement sa relation avec εἶπαν sans ajouter l’idée d’arrogance.
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: Il fallait que […] vous soit annoncée en premier
  rationale: Cette formulation conserve la nécessité, le destinataire initial et la priorité exprimée par πρῶτον, tout en rendant λαλέω de manière idiomatique dans un contexte de proclamation.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Expression biblique établie qui désigne ici le message venant de Dieu, sans réduire λόγος à une simple information.
- source_word: ἀπωθεῖσθε αὐτόν
  choice: vous la rejetez
  rationale: Le présent indique le rejet en cours; le pronom féminin reprend naturellement « la parole » en français.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: vous vous jugez vous-mêmes indignes
  rationale: La formulation maintient la nuance de verdict portée par κρίνω et souligne explicitement la valeur réfléchie de ἑαυτούς.
- source_word: ἰδού
  choice: voici que
  rationale: Cette tournure conserve l’effet d’attention et de transition de ἰδού dans un français actuel et soutenu.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans le contraste immédiat avec l’auditoire de la synagogue, l’expression désigne les peuples non juifs. « Non-Juifs » est clair et évite les connotations modernes parfois péjoratives de « païens ».
theological_decisions:
- issue: Portée de τὰ ἔθνη dans ce contexte
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contexte oppose l’auditoire juif de la synagogue aux autres peuples. Le choix explicite ce contraste historique sans faire de l’expression une désignation purement géographique; l’autre sens possible est conservé en note.
- issue: Responsabilité exprimée par οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: vous vous jugez vous-mêmes indignes
  alternative: vous êtes jugés indignes
  rationale: Le grec attribue explicitement ce jugement aux auditeurs eux-mêmes. La traduction préserve cette tension et n’en fait pas un verdict directement prononcé par Paul ou par Dieu.
translation_notes:
  register: Français international moderne, clair et digne. « Avec assurance » rend la hardiesse de la prise de parole sans emphase excessive; « annoncée » est plus naturel que « dite » pour la proclamation de la parole de Dieu. Le marqueur de note est placé immédiatement après « non-Juifs », terme qu’il explique.
