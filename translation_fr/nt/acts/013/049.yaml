id: ACT.13.49
reference: Acts 13:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: fr
  text: Et la parole du Seigneur se répandait dans toute la région[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le message du Seigneur ».'
    reason: Alternative lexicale pour λόγος dans le contexte de la proclamation.
lexical_decisions:
- source_word: διεφέρετο
  choice: se répandait
  rationale: L’imparfait grec présente une diffusion en cours dans le passé. « Se répandait » est naturel en français et rend cette progression, tout en laissant entendre que la parole était propagée de lieu en lieu.
- source_word: δὲ
  choice: Et
  rationale: Ici, δέ est un connecteur narratif léger. « Et » fait avancer le récit sans introduire un contraste plus marqué que le grec.
- source_word: ὁ λόγος
  choice: la parole
  rationale: Dans les Actes, λόγος désigne souvent le message proclamé. « La parole » conserve l’expression récurrente de Luc et sa portée théologique; « le message » reste une possibilité contextuelle signalée en note.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: « Du Seigneur » conserve le titre κύριος ainsi que la relation volontairement large entre le Seigneur et la parole, qui peut être comprise comme venant de lui, lui appartenant ou le concernant.
- source_word: δι’ ὅλης
  choice: dans toute
  rationale: Avec le génitif, διά exprime ici une extension à travers l’ensemble d’un espace. « Dans toute » est la formulation française la plus naturelle dans ce contexte.
- source_word: τῆς χώρας
  choice: la région
  rationale: χώρα désigne ici l’étendue géographique environnante, non un État moderne. « Région » convient au contexte et reste clair pour le lectorat actuel.
theological_decisions:
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le titre français consacré qui préserve les résonances christologiques et scripturaires de κύριος dans les Actes, sans réduire le terme à la seule idée d’autorité.
- issue: Sens de « la parole du Seigneur »
  choice: Conserver la formulation relationnelle ouverte
  alternative: Expliciter par « le message concernant le Seigneur » ou « le message venant du Seigneur »
  rationale: Le génitif grec ne précise pas à lui seul si la parole vient du Seigneur, lui appartient ou le concerne. La traduction ne tranche donc pas cette ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait « se répandait » restitue le déroulement continu de l’action; la tournure pronominale est plus idiomatique que le passif lourd « était diffusée ».
