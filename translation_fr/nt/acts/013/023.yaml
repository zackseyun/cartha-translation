  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: fr
  text: De la descendance de cet homme, Dieu a fait venir pour Israël, selon la promesse, un Sauveur, Jésus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου
  choice: de cet homme
  rationale: Le démonstratif au génitif renvoie à David, mentionné au verset précédent. « Cet homme » explicite naturellement l’antécédent personnel en français.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: de la descendance
  rationale: σπέρμα désigne ici la lignée issue de David. « Descendance » est idiomatique en français moderne et conserve le sens généalogique sans le littéralisme potentiellement obscur de « semence ».
- source_word: κατ’ ἐπαγγελίαν
  choice: conformément à sa promesse
  rationale: La locution exprime la conformité de l’action de Dieu à une promesse antérieure. Le possessif rend explicite, sans excès d’interprétation, que Dieu agit selon la promesse qu’il a faite.
- source_word: ἤγαγεν
  choice: a donné
  rationale: Dans ce contexte, ἄγω signifie que Dieu a fait venir ou procuré à Israël un Sauveur. « A donné » rend naturellement la destination et la portée bénéfique de l’acte, sans suggérer ici la résurrection comme pourrait le faire « a suscité ».
- source_word: τῷ Ἰσραήλ
  choice: à Israël
  rationale: Le datif se rend directement par « à Israël » et laisse subsister sa nuance bénéficiaire.
- source_word: σωτῆρα
  choice: un Sauveur
  rationale: « Sauveur » est l’équivalent français usuel de σωτήρ et conserve la portée du titre dans ce contexte christologique.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
theological_decisions:
- issue: Lien entre Jésus, la descendance de David et la promesse
  choice: Le texte présente Jésus comme le Sauveur donné à Israël, issu de la descendance de David conformément à la promesse de Dieu.
  alternative: Expliciter « en accomplissement de la promesse faite à David ».
  rationale: Le grec associe la lignée davidique et la promesse, mais ne précise pas dans ce verset seul la formulation ou le destinataire de celle-ci. La traduction conserve ce lien sans ajouter une explication théologique au corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit les relations du grec tout en évitant les tournures peu naturelles telles que « de la semence de celui-ci » ou « selon la promesse ».
