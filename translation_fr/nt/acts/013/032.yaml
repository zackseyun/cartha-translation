  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: fr
  text: Et nous, nous vous annonçons comme bonne nouvelle la promesse faite aux pères[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtres ». Le grec dit « pères », désignation traditionnelle des ancêtres d’Israël.
    reason: Alternative lexicale et clarification du sens historique collectif de πατέρες.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui maintient le lien avec l’argument précédent sans ajouter de nuance interprétative.
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: Le pronom grec explicite met le sujet en relief. La dislocation, naturelle en français, conserve cette insistance.
- source_word: ὑμᾶς
  choice: vous
  rationale: Avec εὐαγγελιζόμεθα, l’accusatif désigne les destinataires de l’annonce et se rend naturellement par le pronom complément « vous ».
- source_word: εὐαγγελιζόμεθα
  choice: annonçons la bonne nouvelle
  rationale: Cette formulation exprime l’annonce d’une nouvelle favorable sans recourir au terme ecclésiastique « évangéliser ».
- source_word: τὴν ... ἐπαγγελίαν
  choice: de la promesse
  rationale: ἐπαγγελία désigne ici la promesse divine. La construction « la bonne nouvelle de la promesse » rend de façon naturelle le contenu de l’annonce, précisé au verset suivant.
- source_word: πρὸς τοὺς πατέρας
  choice: aux pères
  rationale: Le grec emploie le terme masculin πατέρες dans son sens historique et collectif pour les pères d’Israël. Aucun possessif n’est ajouté.
- source_word: γενομένην
  choice: faite
  rationale: Le participe qualifie la promesse comme ayant été faite aux pères. « Accomplie » anticiperait indûment le verset suivant.
theological_decisions:
- issue: Traduction de πατέρες
  choice: pères
  alternative: ancêtres
  rationale: « Pères » conserve le terme familial masculin et sa portée historique dans le récit de l’alliance, tandis que « ancêtres » explicite utilement le sens en note.
translation_notes:
  register: Français international actuel, digne et accessible. La reprise « nous, nous » conserve l’accent porté par le pronom grec explicite. La virgule finale signale que la phrase se poursuit au verset suivant.
