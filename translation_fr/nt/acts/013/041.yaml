reference: Acts 13:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: fr
  text: Regardez, vous qui méprisez[a], soyez stupéfaits et périssez[b] ! Car moi, j’accomplis une œuvre en votre temps, une œuvre que vous ne croirez certainement pas si quelqu’un vous la raconte en détail[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous qui traitez avec mépris » ; le terme grec désigne ceux qui manifestent du dédain ou du mépris.
    reason: lexical_alternative
  - marker: b
    text: Ou « disparaissez » ou « soyez anéantis ». La citation reprend Habacuc 1.5 dans sa forme grecque et constitue une sévère mise en garde contre la ruine.
    reason: alternative_reading
  - marker: c
    text: Le verbe grec peut signifier « raconter pleinement » ou « exposer en détail ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Regardez
  rationale: L’impératif attire vivement l’attention. « Regardez » est direct et naturel en français moderne, sans l’archaïsme de « Voici » employé comme injonction.
- source_word: οἱ καταφρονηταί
  choice: vous qui méprisez
  rationale: Cette formulation rend l’attitude de mépris et de rejet exprimée par le nom grec, tout en restant idiomatique et en évitant de préciser à tort un objet qui n’est pas exprimé.
- source_word: θαυμάσατε
  choice: soyez stupéfaits
  rationale: Dans cette mise en garde prophétique, le verbe exprime un étonnement intense. « Soyez stupéfaits » conserve cette force mieux que le plus faible « étonnez-vous ».
- source_word: ἀφανίσθητε
  choice: périssez
  rationale: Le contexte donne à l’impératif passif une portée menaçante de ruine. « Périssez » communique cette gravité, tandis qu’une note conserve le sens plus littéral possible de disparition.
- source_word: ἔργον
  choice: une œuvre
  rationale: « Œuvre » désigne naturellement ici une intervention ou une action marquante de Dieu et préserve l’ampleur du terme grec.
- source_word: ἐργάζομαι ἐγώ
  choice: moi, j’accomplis
  rationale: Le pronom explicite ἐγώ est rendu par « moi » pour conserver l’emphase. « J’accomplis une œuvre » est plus naturel en français que « je fais une œuvre ».
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: de votre temps
  rationale: Cette expression française naturelle conserve la proximité temporelle de « dans vos jours » sans calque peu idiomatique.
- source_word: οὐ μὴ πιστεύσητε
  choice: vous ne croirez certainement pas
  rationale: La tournure οὐ μή avec le subjonctif exprime une négation fortement appuyée ; « certainement pas » en maintient clairement l’intensité.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: si quelqu’un vous la raconte en détail
  rationale: Le verbe peut désigner un récit développé ou complet. Le pronom « la » reprend naturellement « une œuvre ».
theological_decisions:
- issue: Force judiciaire de la citation prophétique
  choice: Conserver l’avertissement direct avec « périssez » et la négation emphatique « ne croirez certainement pas »
  alternative: Employer « disparaissez » et une négation moins appuyée
  rationale: La citation fonctionne comme une mise en garde solennelle contre le rejet de l’action de Dieu. Il convient de ne pas en atténuer la gravité, tout en signalant en note la valeur lexicale possible de disparition.
- issue: Identification de l’auteur de l’œuvre
  choice: Ne pas ajouter explicitement « Dieu » dans le texte
  alternative: Traduire de manière explicative par « moi, Dieu, j’accomplis »
  rationale: Le contexte de la citation permet de comprendre qui parle, mais le grec dit seulement ἐγώ, « moi/je ». Ne pas expliciter préserve la formulation et la tension du texte source.
translation_notes:
  register: Français international moderne, direct et solennel. Les impératifs conservent le rythme abrupt de l’avertissement prophétique. La formulation évite les archaïsmes, les calques inutiles et toute explicitation doctrinale absente du grec.
