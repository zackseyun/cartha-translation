  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: fr
  text: Après avoir pris la mer à Paphos[a], Paul et ses compagnons[b] arrivèrent à Perge, en Pamphylie. Mais Jean les quitta et retourna à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après avoir quitté Paphos par mer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui entouraient Paul » ou « ceux qui étaient avec Paul ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Après avoir pris la mer
  rationale: Dans un contexte de voyage, ἀνάγω désigne le fait de prendre la mer. Cette formulation française naturelle conserve le sens maritime du participe et son rapport temporel avec le verbe principal.
- source_word: οἱ περὶ Παῦλον
  choice: Paul et ses compagnons
  rationale: La tournure οἱ περὶ avec l’accusatif désigne le groupe associé à une personne. « Paul et ses compagnons » exprime clairement cet idiome en français courant sans préciser davantage la composition du groupe.
- source_word: ἦλθον
  choice: arrivèrent
  rationale: Dans ce récit de déplacement vers une destination nommée, « arrivèrent » rend naturellement ἦλθον et évite l’ambiguïté de perspective entre « vinrent » et « allèrent ».
- source_word: Πέργην τῆς Παμφυλίας
  choice: Perge, en Pamphylie
  rationale: Le génitif situe Perge dans la région de Pamphylie; la préposition « en » est la formulation géographique naturelle en français.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: se sépara d’eux
  rationale: Cette expression rend le départ de Jean sans lui attribuer de motif ni porter de jugement moral sur son acte.
- source_word: ὑπέστρεψεν
  choice: retourna
  rationale: ὑποστρέφω signifie couramment retourner ou revenir; « retourna » convient ici puisque la destination, Jérusalem, est explicitement indiquée.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville.
theological_decisions:
- issue: Portée du départ de Jean
  choice: Décrire sobrement son action par « se sépara d’eux »
  alternative: « les abandonna » ou « se retira loin d’eux »
  rationale: Le verset rapporte le départ et le retour de Jean sans en indiquer le motif ni l’évaluer moralement. La traduction ne doit donc pas anticiper l’interprétation que pourrait suggérer le contexte ultérieur.
translation_notes:
  register: Français international moderne, narratif et digne. Les temps du récit sont au passé simple. Les noms géographiques suivent les formes françaises usuelles. Les notes maintiennent visibles le sens maritime de ἀνάγω et l’idiome grec οἱ περὶ Παῦλον.
