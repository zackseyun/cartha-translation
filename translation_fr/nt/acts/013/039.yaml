  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: fr
  text: En lui, toute personne qui croit est justifiée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par lui, toute personne qui croit est justifiée. » L’expression grecque peut se traduire plus littéralement par « en celui-ci » ou « par celui-ci » et renvoie à Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: En lui
  rationale: Le démonstratif renvoie naturellement à Jésus dans le contexte immédiat. « En lui » conserve la construction grecque tout en étant idiomatique en français.
- source_word: πᾶς ὁ πιστεύων
  choice: toute personne qui croit
  rationale: Le participe présent substantivé a une portée générale. Cette formulation inclusive et naturelle exprime clairement que la déclaration vaut pour quiconque croit.
- source_word: δικαιοῦται
  choice: est déclarée juste
  rationale: Cette formulation rend la valeur juridico-déclarative de δικαιόω en français courant, sans suggérer à elle seule une transformation morale.
theological_decisions:
- issue: Référent et valeur de ἐν τούτῳ
  choice: 'Référence personnelle à Jésus : « En lui »'
  alternative: « Par lui » ou, plus littéralement, « en celui-ci »
  rationale: Le contexte précédent présente Jésus comme celui par qui le pardon est annoncé. « En lui » maintient le lien christologique et la possible nuance d'union, sans éliminer dans la note la lecture instrumentale.
- issue: Sens de δικαιοῦται
  choice: « est déclarée juste »
  alternative: « est justifiée » ou « est acquittée »
  rationale: Le contexte oppose ce que la Loi de Moïse ne pouvait accomplir à ce qui advient en Jésus. « Déclarée juste » préserve la dimension judiciaire sans réduire le terme au seul acquittement.
translation_notes:
  register: Français international moderne, clair et digne. « Toute personne qui croit » évite une formulation genrée et reste proche de la portée universelle du grec. La note conserve l'ambiguïté réelle de la préposition ἐν.
