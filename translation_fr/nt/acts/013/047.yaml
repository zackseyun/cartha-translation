id: ACT.13.47
reference: Acts 13:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: fr
  text: 'En effet, le Seigneur nous a donné cet ordre : « Je t’ai établi comme lumière pour les nations[a], afin que tu sois pour le salut jusqu’à l’extrémité de la terre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme lumière pour les non-Juifs ». Le mot grec peut désigner les nations ou, selon le contexte, les non-Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’aux extrémités de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: voici ce que
  rationale: Dans la tournure οὕτως γὰρ, cette formulation introduit naturellement en français le contenu qui fonde l’action précédente, sans l’archaïsme de « ainsi » employé seul.
- source_word: ἐντέταλται
  choice: a commandé
  rationale: Le parfait exprime un commandement donné qui demeure en vigueur. Le passé composé français transmet naturellement cette portée présente.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Rend le titre divin usuel et conserve l’autorité du locuteur de l’Écriture citée.
- source_word: Τέθεικά σε
  choice: Je t’ai établi
  rationale: Le parfait de τίθημι désigne ici une désignation durable. « Établi » exprime mieux une mission conférée que le plus spatial « placé ».
- source_word: εἰς φῶς ἐθνῶν
  choice: comme lumière pour les nations
  rationale: « Comme » rend la fonction assignée par εἰς; « nations » conserve la portée collective de la citation d’Ésaïe sans exclure le sens contextuel de « non-Juifs ».
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: afin que tu apportes le salut
  rationale: L’infinitif articulé exprime le but ou le résultat. Cette formulation est idiomatique en français; elle présente le destinataire comme agent du salut sans préciser davantage la relation théologique implicite dans la construction grecque concise.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: jusqu’à l’extrémité de la terre
  rationale: Le grec porte le singulier et désigne le point le plus éloigné de la terre. La traduction conserve ce singulier tout en restant naturelle.
theological_decisions:
- issue: Application par Paul et Barnabas de la citation concernant le serviteur
  choice: Maintenir dans la citation le pronom singulier « tu » sans identifier explicitement son référent.
  alternative: Reformuler au pluriel ou préciser que la parole vise directement les apôtres.
  rationale: Le grec cite l’Écriture au singulier tout en l’appliquant à la mission apostolique, sans expliciter le rapport entre le serviteur et les envoyés. La traduction conserve cette tension.
- issue: Rapport du destinataire au salut dans εἰς σωτηρίαν
  choice: « afin que tu apportes le salut »
  alternative: « afin que tu sois le salut » ou, plus littéralement, « afin que tu sois pour le salut »
  rationale: Le grec peut présenter le destinataire comme étant lui-même salut ou comme moyen par lequel le salut atteint les peuples. Le français retenu reste ouvert sur le mode précis de cette médiation et évite la tournure peu naturelle « être pour le salut ».
translation_notes:
  register: Français international actuel, clair et digne. La citation garde son « tu » singulier et son image de la lumière. Les guillemets français distinguent nettement la parole scripturaire.
