revisions:
- from: 'Car voici ce que le Seigneur nous a commandé : « Je t’ai établi comme lumière pour les nations[a], afin que tu apportes le salut jusqu’à l’extrémité de la terre[b]. »'
  to: 'En effet, le Seigneur nous a donné cet ordre : « Je t’ai établi comme lumière pour les nations[a], afin que tu sois pour le salut jusqu’à l’extrémité de la terre[b]. »'
  rationale: La révision évite d’attribuer explicitement au destinataire l’action d’« apporter » le salut, ajout qui réduit l’ambiguïté de εἰς σωτηρίαν. Elle remplace également l’introduction moins directement liée à οὕτως (« voici ce que ») par une formulation française naturelle qui présente l’ordre cité, et elle rectifie la note a pour conserver la métaphore de la lumière.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:32Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « afin que tu apportes le salut » explicite le destinataire comme agent qui apporte le salut, alors que εἰς σωτηρίαν (« pour le salut ») laisse plus ouverte la nature de son rapport au salut. « Afin que tu sois pour le salut » suit de près la construction grecque et conserve cette ouverture. « En effet, le Seigneur nous a donné cet ordre » rend naturellement οὕτως γὰρ ἐντέταλται ἡμῖν tout en gardant le parfait à portée actuelle.
  naturalness: Le français révisé est actuel, clair et de registre digne. La tournure « être pour le salut » est quelque peu solennelle, mais elle est intelligible et justifiée ici par la nécessité de ne pas imposer une interprétation au langage concis de la citation.
  terminology: « Seigneur », « lumière », « nations » et « salut » sont appropriés et cohérents. La note a est corrigée afin que l’alternative « non-Juifs » conserve l’image de la lumière au lieu de la transformer en verbe interprétatif (« éclairer »).
  issues:
  - severity: medium
    issue: « afin que tu apportes le salut » interprète εἰς σωτηρίαν de manière plus précise que le grec.
    rationale: Le grec peut décrire le destinataire comme salut ou comme étant en rapport instrumental avec le salut. « Apporter » choisit explicitement l’idée d’un agent qui transmet le salut. Une formulation plus proche préserve l’ambiguïté théologique et syntaxique.
  - severity: low
    issue: La note a paraphrase l’image de φῶς par « pour éclairer ».
    rationale: L’alternative lexicale porte sur ἐθνῶν (« nations » / « non-Juifs »), non sur le remplacement de « lumière » par une action. La note devrait conserver l’image présente dans le texte.
  revised_text: 'En effet, le Seigneur nous a donné cet ordre : « Je t’ai établi comme lumière pour les nations[a], afin que tu sois pour le salut jusqu’à l’extrémité de la terre[b]. »'
  revised_footnotes:
  - marker: a
    text: Ou « comme lumière pour les non-Juifs ». Le mot grec peut désigner les nations ou, selon le contexte, les non-Juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’aux extrémités de la terre ».
    reason: lexical_alternative
  revision_rationale: La révision évite d’attribuer explicitement au destinataire l’action d’« apporter » le salut, ajout qui réduit l’ambiguïté de εἰς σωτηρίαν. Elle remplace également l’introduction moins directement liée à οὕτως (« voici ce que ») par une formulation française naturelle qui présente l’ordre cité, et elle rectifie la note a pour conserver la métaphore de la lumière.
