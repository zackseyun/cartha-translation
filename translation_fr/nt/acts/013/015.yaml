id: ACT.13.15
reference: Acts 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: fr
  text: 'Après la lecture de la Loi et des Prophètes, les chefs de la synagogue leur firent dire : « Frères[a], si l’un de vous a une parole d’encouragement[b] à adresser au peuple, prenez la parole. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Hommes frères », formule d’adresse à la fois respectueuse et fraternelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une parole d’exhortation ». Le terme grec peut exprimer aussi bien l’encouragement que l’exhortation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: lecture
  rationale: Dans le contexte de la synagogue, le terme désigne la lecture publique des Écritures. « Lecture » est naturel en français et conserve le lien direct avec l’acte de lire.
- source_word: νόμου καὶ τῶν προφητῶν
  choice: la Loi et les Prophètes
  rationale: 'Les majuscules signalent les deux grandes parties reconnues des Écritures lues à la synagogue : la Torah et les écrits prophétiques.'
- source_word: ἀπέστειλαν ... λέγοντες
  choice: leur firent dire
  rationale: Cette tournure française exprime naturellement la transmission d’une invitation, sans imposer que les chefs aient eux-mêmes pris la parole ni préciser le messager.
- source_word: ἀρχισυνάγωγοι
  choice: les chefs de la synagogue
  rationale: Le pluriel désigne les responsables chargés de la synagogue et de son service. « Chefs » est clair sans suggérer une autorité civile.
- source_word: Ἄνδρες ἀδελφοί
  choice: Frères
  rationale: Cette formule d’adresse respectueuse et fraternelle vise ici Paul et ses compagnons. « Frères » est idiomatique en français, tandis que le détail littéral est conservé en note.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: si l’un de vous a
  rationale: Le grec est plus impersonnel, littéralement « s’il y a parmi vous », mais cette formulation française rend clairement et naturellement le sens sans modifier la portée.
- source_word: λόγος παρακλήσεως
  choice: une parole d’encouragement
  rationale: παράκλησις peut exprimer aussi bien l’encouragement que l’exhortation. Le choix principal reste large et naturel, et l’autre nuance est signalée en note.
- source_word: πρὸς τὸν λαόν
  choice: à adresser au peuple
  rationale: La préposition indique ici les destinataires du message. Cette formulation explicite naturellement le rapport entre la parole proposée et l’assemblée.
- source_word: λέγετε
  choice: prenez la parole
  rationale: L’impératif invite les visiteurs à s’adresser à l’assemblée. « Prenez la parole » convient mieux à cette situation formelle que le littéral « parlez ».
theological_decisions:
- issue: Forme masculine de l’adresse dans la synagogue
  choice: Frères
  alternative: Frères et sœurs
  rationale: Le grec Ἄνδρες ἀδελφοί est explicitement masculin et, dans le contexte immédiat, les responsables s’adressent à Paul et à ses compagnons. La traduction ne généralise donc pas l’adresse.
- issue: Nuance de παράκλησις
  choice: encouragement
  alternative: exhortation
  rationale: Le contexte ne permet pas de réduire le terme à la consolation ni à l’admonestation. Le texte principal emploie le terme français le plus englobant, tandis que la note préserve l’autre nuance réelle.
translation_notes:
  register: Français international moderne, digne et fluide. La syntaxe convient à une lecture publique. Les termes institutionnels et scripturaires restent transparents, et les ambiguïtés lexicales significatives sont conservées en notes.
