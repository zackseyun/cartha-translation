revisions:
- from: 'Quant au fait qu’il l’a ressuscité d’entre les morts pour qu’il ne retourne plus à la décomposition, Dieu l’a exprimé ainsi : « Je vous donnerai les saintes et sûres bénédictions promises à David[a]. »'
  to: 'Quant au fait que Dieu l’a ressuscité d’entre les morts, ne devant plus retourner à la décomposition, Dieu l’a dit ainsi : « Je vous donnerai les saintes et sûres bénédictions de David[a]. »'
  rationale: La révision rétablit la valeur descriptive de μέλλοντα par « ne devant plus retourner », évite d’imposer au génitif Δαυίδ le sens unique de promesses faites à David, et rend l’introduction de la citation plus naturelle. L’ancre est placée immédiatement après l’expression difficile qu’elle éclaire.
