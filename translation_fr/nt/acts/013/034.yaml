review_pass:
  verdict: revise
  source_fidelity: La formulation « pour qu’il ne retourne plus » transforme le participe μέλλοντα en proposition finale et atténue sa valeur de destinée/futur. « ne devant plus retourner » rend plus directement la construction grecque, tout en restant idiomatique. L’ajout « promises à David » impose une direction au génitif Δαυίδ que le grec laisse elliptique.
  naturalness: Le français révisé conserve une articulation argumentative naturelle et un registre biblique contemporain. « Dieu l’a dit ainsi » est plus direct et plus idiomatique que « Dieu l’a exprimé ainsi ».
  terminology: « Ressuscité d’entre les morts » et « décomposition » rendent clairement le contexte corporel. Pour τὰ ὅσια Δαυὶδ τὰ πιστά, « saintes et sûres bénédictions de David » suit étroitement le texte tout en laissant au lecteur l’ambiguïté productive de l’expression scripturaire; la note présente une alternative traditionnelle et explique l’allusion à Ésaïe 55.3.
  issues:
  - severity: medium
    issue: La tournure « pour qu’il ne retourne plus » introduit une finalité qui n’est pas explicitement exprimée.
    rationale: μηκέτι μέλλοντα ὑποστρέφειν qualifie celui qui a été ressuscité comme ne devant plus retourner à la décomposition; ce n’est pas une subordonnée de but.
  - severity: medium
    issue: « promises à David » explicite de manière univoque le génitif Δαυίδ.
    rationale: La formule grecque citant Ésaïe est elliptique. Elle renvoie aux grâces/promesses davidiennes, mais le texte grec ne formule pas explicitement « promises à David ».
  - severity: low
    issue: « Dieu l’a exprimé ainsi » est moins naturel pour l’introduction d’une citation scripturaire.
    rationale: οὕτως εἴρηκεν se rend simplement et avec davantage de vigueur par « Dieu l’a dit ainsi ».
