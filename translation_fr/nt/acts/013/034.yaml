id: ACT.13.34
reference: Acts 13:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: fr
  text: 'Quant au fait que Dieu l’a ressuscité d’entre les morts, ne devant plus retourner à la décomposition, Dieu l’a dit ainsi : « Je vous donnerai les saintes et sûres bénédictions de David[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, traditionnellement : « les grâces sûres de David ». Cette expression reprend Ésaïe 55.3 et désigne les bienfaits ou promesses sacrés et fiables liés à David.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: il l’a ressuscité d’entre les morts
  rationale: « Ressusciter d’entre les morts » exprime naturellement en français l’action divine et le contexte explicite de résurrection.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: pour qu’il ne retourne plus
  rationale: 'Cette formulation française restitue la conséquence voulue et durable : le Ressuscité ne retournera plus à l’état de décomposition. Une reproduction mécanique de μέλλοντα serait moins naturelle.'
- source_word: διαφθοράν
  choice: la décomposition
  rationale: Dans ce contexte corporel, le terme désigne la corruption physique. « Décomposition » évite le sens moral que « corruption » évoque souvent en français moderne.
- source_word: οὕτως εἴρηκεν
  choice: Dieu l’a exprimé ainsi
  rationale: Le sujet implicite est Dieu, auteur de la parole scripturaire citée. L’explicitation rend la phrase française claire, tandis que le passé composé convient au parfait grec et à la portée persistante de l’Écriture.
- source_word: Δώσω ὑμῖν
  choice: Je vous donnerai
  rationale: Rendu direct et naturel de la promesse au futur.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: les saintes et sûres bénédictions promises à David
  rationale: La phrase elliptique, qui reprend Ésaïe 55.3, désigne les bienfaits sacrés et fiables liés à l’alliance davidique. « Promises à David » rend explicite l’association sans faire de David la source ni le bénéficiaire exclusif des dons adressés au pluriel « vous ».
theological_decisions:
- issue: Sens de τὰ ὅσια Δαυὶδ τὰ πιστά dans la citation d’Ésaïe 55.3
  choice: les saintes et sûres bénédictions promises à David
  alternative: les grâces assurées accordées à David
  rationale: Le grec est elliptique et peut évoquer des bienfaits, grâces ou promesses liés à David. Le texte principal conserve le caractère saint et fiable de ces dons ainsi que leur lien davidique, sans réduire la formule à une doctrine plus précise que ne l’énonce le passage.
- issue: Lien entre résurrection et décomposition
  choice: pour qu’il ne retourne plus à la décomposition
  alternative: n’étant plus destiné à retourner à la décomposition
  rationale: Le choix affirme, conformément à la syntaxe et à l’argument de Paul, que la résurrection de Jésus est définitive, sans développer davantage la nature de son corps ressuscité.
translation_notes:
  register: Français international moderne, digne et accessible. « Quant au fait que » conserve l’articulation argumentative du grec. « Décomposition » privilégie ici le sens physique. La citation garde une légère densité poétique tout en explicitant sobrement son rapport à David.
