  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: fr
  text: Mais ils secouèrent contre eux la poussière de leurs pieds, puis se rendirent à Iconium[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secouer la poussière de ses pieds était un geste symbolique par lequel on se désolidarisait de ceux qui avaient rejeté le message et qui servait de témoignage contre eux.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: δέ marque ici une légère opposition ou une transition narrative, tandis que l’article avec le participe renvoie à Paul et Barnabas. « Mais eux » conserve ce contraste et identifie naturellement les acteurs.
- source_word: ἐκτιναξάμενοι
  choice: secouèrent
  rationale: Le participe aoriste moyen de ἐκτινάσσω décrit l’action de faire tomber quelque chose en le secouant. Une forme verbale coordonnée est plus naturelle en français que « ayant secoué ».
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: la poussière de leurs pieds
  rationale: κονιορτός désigne la poussière du sol. « La poussière de leurs pieds » restitue sobrement la relation exprimée par le génitif et convient au geste symbolique décrit.
- source_word: ἐπ’ αὐτοὺς
  choice: contre ces gens
  rationale: ἐπί avec l’accusatif exprime ici l’orientation hostile ou testimoniale du geste. « Contre ces gens » préserve cette force sans expliciter dans le corps du texte s’il s’agit d’un témoignage ou d’un jugement.
- source_word: ἦλθον
  choice: se rendirent
  rationale: Dans ce récit de déplacement vers une destination nommée, « se rendirent » exprime naturellement le mouvement sans imposer le point de vue déictique de « vinrent ».
- source_word: εἰς Ἰκόνιον
  choice: à Iconium
  rationale: εἰς indique le déplacement vers la ville. « À Iconium » est la formulation française idiomatique avec « se rendre ».
theological_decisions:
- issue: Sens du geste consistant à secouer la poussière des pieds
  choice: Le texte principal décrit simplement un geste dirigé « contre ces gens ».
  alternative: « en témoignage contre eux » ou « en signe de jugement contre eux »
  rationale: Le geste possède une portée symbolique dans son contexte biblique, mais le grec n’en donne pas ici une interprétation explicite. La traduction maintient cette retenue, et la note fournit le contexte culturel sans trancher davantage.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe coordonnée rend le participe aoriste avec fluidité. « Ces gens » évite l’ambiguïté référentielle de « eux » après « Mais eux », tandis que la note explique le geste sans alourdir le verset.
