source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: fr
  text: 'Alors que Jean achevait sa course, il disait : « Que pensez-vous que je sois ? Je ne le suis pas.[a] Mais voici que vient après moi quelqu’un dont je ne suis pas digne de délier les sandales.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « Que pensez-vous que je sois ? Je ne suis pas le Messie. » Le grec laisse implicite l’identité niée, bien que le contexte désigne vraisemblablement le Messie.'
    reason: alternative_reading
  - marker: b
    text: 'Certains manuscrits et certaines traductions précisent : « délier la courroie de ses sandales ». Toutefois, le texte grec imprimé ici dit simplement « délier la sandale — ou les sandales — de ses pieds ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: achevait sa course
  rationale: Cette formulation conserve la métaphore de la course pour la mission ou le parcours assigné à Jean, tandis que l’imparfait « achevait » reflète l’aspect imperfectif de ἐπλήρου.
- source_word: ἔλεγεν
  choice: il répétait
  rationale: L’imparfait grec peut résumer une parole répétée ou habituelle. « Il répétait » rend cette valeur itérative de façon naturelle en français.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Que pensez-vous que je sois ?
  rationale: La question porte sur l’identité que les auditeurs attribuent à Jean. Cette traduction garde l’interrogatif ouvert τί sans préciser d’avance « qui » ni nommer le Messie.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Je ne le suis pas
  rationale: Le grec laisse implicite l’identité niée tout en mettant ἐγώ en relief. Le pronom français « le » reprend cette identité sans l’expliciter.
- source_word: ἀλλ’ ἰδοὺ
  choice: Mais voici que
  rationale: « Voici que » attire l’attention sur l’arrivée imminente annoncée par Jean, dans un registre actuel mais digne.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: vient après moi quelqu’un
  rationale: Le présent « vient » conserve la vivacité du grec, et « quelqu’un » exprime naturellement en français le sujet personnel implicite.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: dont ... délier les sandales
  rationale: Le singulier grec ὑπόδημα peut avoir une valeur générique ou collective. Le pluriel « sandales » est idiomatique en français; « délier » rend λύω sans ajouter dans le texte principal le mot « courroie », absent du texte grec imprimé.
- source_word: ἄξιος
  choice: digne
  rationale: « Digne » est l’équivalent français direct et transparent de ἄξιος dans cette déclaration d’humilité.
theological_decisions:
- issue: Identité niée par Jean dans οὐκ εἰμὶ ἐγώ
  choice: Je ne le suis pas
  alternative: Je ne suis pas le Messie
  rationale: Le contexte indique très probablement que Jean nie être le Messie, mais le grec ne nomme pas explicitement cette identité. Le texte principal préserve donc l’ellipse, et la note en explique le référent vraisemblable.
translation_notes:
  register: Français international moderne, naturel et digne. « Il répétait » rend la continuité ou la répétition du témoignage de Jean; « voici que » conserve la fonction d’appel à l’attention de ἰδού sans archaïsme marqué. L’ellipse concernant l’identité du Messie est maintenue dans le texte principal.
