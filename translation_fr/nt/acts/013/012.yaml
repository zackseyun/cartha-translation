id: ACT.13.12
reference: Acts 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: fr
  text: Alors, quand le proconsul vit ce qui s’était passé, il crut, stupéfait par l’enseignement du Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enseignement concernant le Seigneur ». Le génitif grec peut aussi désigner l’enseignement qui vient du Seigneur ou qui lui appartient.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque la succession narrative de façon concise et naturelle en français.
- source_word: ἰδὼν
  choice: quand … vit
  rationale: Le participe aoriste est rendu par une proposition temporelle idiomatique, sans exclure le lien circonstanciel avec la foi du proconsul.
- source_word: ὁ ἀνθύπατος
  choice: le proconsul
  rationale: Conserve le titre précis du gouverneur d’une province romaine relevant du Sénat.
- source_word: τὸ γεγονός
  choice: ce qui s’était passé
  rationale: Le participe parfait substantivé désigne l’événement accompli dont le proconsul vient d’être témoin.
- source_word: ἐπίστευσεν
  choice: il crut
  rationale: Préserve la formulation concise du grec, où aucun complément explicite n’est donné.
- source_word: ἐκπλησσόμενος
  choice: stupéfait
  rationale: Exprime fortement l’étonnement qui accompagne la réaction du proconsul, dans un français naturel.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: par l’enseignement
  rationale: ἐπί avec le datif présente ici l’enseignement comme ce qui provoque la stupéfaction.
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Cette formulation proche du génitif grec laisse ouvertes plusieurs relations possibles entre le Seigneur et l’enseignement.
theological_decisions:
- issue: Sens de πιστεύω sans complément explicite
  choice: il crut
  alternative: il crut au Seigneur ; il crut au message
  rationale: Le contexte éclaire la nature de cette foi, mais le texte grec n’en exprime pas l’objet. La traduction évite donc de l’ajouter.
- issue: Valeur du génitif dans τοῦ κυρίου
  choice: l’enseignement du Seigneur
  alternative: l’enseignement donné par le Seigneur ; l’enseignement concernant le Seigneur
  rationale: Le génitif peut désigner l’origine ou l’appartenance de l’enseignement, ou encore son objet. Le texte principal et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste fluide tout en conservant le titre romain précis, l’absence de complément après « crut » et l’ambiguïté du génitif final.
