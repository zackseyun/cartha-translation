source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: fr
  text: En effet, les habitants de Jérusalem et leurs dirigeants, qui n’ont reconnu ni Jésus[a] ni les paroles des prophètes lues chaque sabbat[b], les ont accomplies en le condamnant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui-ci ». Le démonstratif grec désigne Jésus avec insistance.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les voix des prophètes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: les habitants de Jérusalem
  rationale: Le participe substantivé désigne les personnes qui vivent à Jérusalem. « Les habitants de Jérusalem » est naturel, précis et concis en français moderne.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: leurs dirigeants
  rationale: ἄρχοντες désigne ici les autorités qui exercent la direction et participent au jugement. « Dirigeants » conserve cette portée sans limiter indûment le terme au pouvoir politique.
- source_word: τοῦτον
  choice: Jésus
  rationale: Le démonstratif renvoie à Jésus dans le contexte immédiat. Le nom rend la référence claire et naturelle en français, tandis qu’une note conserve la forme littérale « celui-ci ».
- source_word: ἀγνοήσαντες
  choice: n’ont reconnu ni Jésus ni les paroles
  rationale: Le participe porte vraisemblablement sur les deux compléments accusatifs, τοῦτον et τὰς φωνάς. « Ne pas reconnaître » exprime l’échec à discerner l’identité de Jésus et à saisir la portée du témoignage prophétique, sans réduire le sens à une simple absence d’information.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: les paroles des prophètes
  rationale: Bien que φωνάς signifie littéralement « voix », l’expression désigne ici les déclarations prophétiques consignées dans l’Écriture et lues publiquement. « Paroles » est idiomatique en français ; le sens littéral est signalé en note.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: qui sont lues chaque sabbat
  rationale: La relative reproduit clairement la valeur du participe attributif et κατὰ πᾶν σάββατον signifie naturellement « chaque sabbat ».
- source_word: κρίναντες
  choice: en le condamnant
  rationale: Dans ce contexte judiciaire, κρίνω signifie condamner Jésus. Le gérondif exprime le moyen par lequel les dirigeants ont accompli les paroles prophétiques.
- source_word: ἐπλήρωσαν
  choice: ils les ont accomplies
  rationale: Le pronom « les » reprend les paroles prophétiques. « Accomplir » est le terme français usuel pour la réalisation des Écritures annoncées.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit l’explication de l’affirmation précédente. « En effet » marque ce lien de manière naturelle en français.
theological_decisions:
- issue: Portée de l’ignorance exprimée par ἀγνοήσαντες
  choice: n’ont reconnu ni Jésus ni les paroles des prophètes
  alternative: parce qu’ils n’ont pas reconnu celui-ci
  rationale: 'La syntaxe grecque permet le plus naturellement de comprendre τοῦτον et τὰς φωνὰς comme les deux compléments de ἀγνοήσαντες. La traduction conserve ainsi le double échec : reconnaître Jésus et discerner le témoignage prophétique, sans préciser au-delà du texte la nature morale de cette méconnaissance.'
- issue: Rapport entre la condamnation et l’accomplissement prophétique
  choice: en le condamnant, ils les ont accomplies
  alternative: après l’avoir jugé, ils les ont accomplies
  rationale: Le contexte indique une condamnation judiciaire, et le participe peut exprimer le moyen ou la circonstance concomitante. « En le condamnant » conserve cette relation sans attribuer aux acteurs l’intention d’accomplir la prophétie.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée par un point-virgule afin de rendre lisible la longue construction participiale grecque. « Dirigeants » et « paroles » évitent des formulations archaïques, tandis que les notes préservent les particularités lexicales du texte source.
