id: ACT.2.31
reference: Acts 2:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: fr
  text: 'Il a vu d’avance ce qui allait arriver et a parlé de la résurrection du Messie[a] : celui-ci n’a pas été abandonné au séjour des morts[b], et sa chair n’a pas non plus connu la décomposition[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ». Le grec Χριστός signifie « Oint » et fonctionne ici comme un titre.
    reason: lexical_alternative
  - marker: b
    text: Le grec Hadès désigne le séjour des morts, et non précisément le lieu du jugement final.
    reason: cultural_note
  - marker: c
    text: Littéralement « sa chair n’a pas vu la corruption ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: Il a vu d’avance ce qui allait arriver
  rationale: Le participe aoriste exprime une perception anticipée. Cette formulation explicite en français l’objet implicite fourni par le contexte, tout en conservant l’idée que David a discerné par avance l’événement dont il a parlé.
- source_word: ἐλάλησεν περὶ τῆς ἀναστάσεως
  choice: a parlé de la résurrection
  rationale: « Parler de » rend naturellement λαλέω avec περί suivi du génitif, sans alourdir la phrase par « au sujet de » ou « concernant ».
- source_word: τοῦ χριστοῦ
  choice: du Messie
  rationale: Dans l’argument scripturaire de Pierre, Χριστός garde nettement sa valeur de titre désignant l’Oint attendu. « Messie » rend cette valeur plus clairement que l’emploi quasi nominal de « Christ ».
- source_word: οὔτε ἐγκατελείφθη
  choice: n’a pas été abandonné
  rationale: Le passif de ἐγκαταλείπω signifie être laissé ou abandonné. « Abandonné » restitue sa force tout en convenant au contexte de la mort.
- source_word: εἰς ᾅδην
  choice: au séjour des morts
  rationale: ᾅδης désigne ici le domaine des morts. « Séjour des morts » est clair en français moderne et évite de confondre ce terme avec le lieu du jugement final; la note conserve le terme grec traditionnel « Hadès ».
- source_word: ἡ σὰρξ αὐτοῦ
  choice: sa chair
  rationale: σάρξ est concret et corporel dans ce passage. « Chair » préserve le vocabulaire de la citation et son insistance sur la réalité physique.
- source_word: εἶδεν διαφθοράν
  choice: n’a pas connu la décomposition
  rationale: L’expression grecque signifie littéralement « voir la corruption ». En français courant, « connaître la décomposition » restitue naturellement l’idée de dégradation corporelle sans effacer l’image originale, signalée en note.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le contexte présente l’accomplissement d’une promesse scripturaire concernant l’Oint; la valeur titulaire est donc saillante. La variante traditionnelle est indiquée en note.
- issue: Sens de ᾅδης
  choice: séjour des morts
  alternative: Hadès
  rationale: Cette expression communique la référence au domaine des morts sans l’assimiler à l’enfer comme lieu du châtiment final. « Hadès » demeure possible et figure dans la note.
- issue: Portée corporelle de σάρξ et διαφθορά
  choice: sa chair n’a pas connu la décomposition
  alternative: son corps ne s’est pas décomposé
  rationale: Le choix conserve « chair » et l’affirmation corporelle du texte, tout en rendant l’idiome grec dans un français compréhensible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase explicite l’objet implicite de προϊδών pour éviter une tournure participiale peu naturelle. « Pas non plus » restitue la corrélation οὔτε…οὔτε malgré le changement de sujet entre les deux propositions.
