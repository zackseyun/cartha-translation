  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: fr
  text: 'Ils étaient stupéfaits et s’étonnaient en disant : « Voyez ! Tous ces gens qui parlent ne sont-ils pas Galiléens ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: étaient hors d’eux-mêmes
  rationale: L’imparfait exprime une réaction continue de stupéfaction intense. « Étaient hors d’eux-mêmes » conserve la force de ἐξίστημι et se distingue du verbe suivant.
- source_word: δὲ καὶ
  choice: et
  rationale: δέ fait ici progresser doucement le récit, tandis que καί coordonne les deux réactions. En français, un seul « et » produit une liaison naturelle sans alourdir la phrase.
- source_word: ἐθαύμαζον
  choice: s’émerveillaient
  rationale: Le verbe désigne l’étonnement admiratif ou l’émerveillement. Ce choix préserve la distinction lexicale avec ἐξίσταντο.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit les paroles prononcées pendant leur réaction; « en disant » rend naturellement cette simultanéité.
- source_word: Οὐχ
  choice: ne sont-ils pas
  rationale: La particule introduit une question qui attend une réponse affirmative; la question négative française en conserve l’orientation.
- source_word: ἰδοὺ
  choice: Regardez !
  rationale: Particule destinée à attirer l’attention. « Regardez ! » est direct, actuel et digne; il conserve la valeur déictique sans archaïsme.
- source_word: πάντες οὗτοί
  choice: Tous ceux
  rationale: Dans la construction française complète, « Tous ceux qui parlent » rend clairement l’ensemble désigné sans ajouter « hommes », absent du grec.
- source_word: οἱ λαλοῦντες
  choice: ceux qui parlent
  rationale: Le participe substantivé au présent identifie les personnes en train de parler et conserve l’aspect en cours.
- source_word: Γαλιλαῖοι
  choice: Galiléens
  rationale: Désignation régionale directe, sans ajout explicatif sur l’accent, l’instruction ou le statut social.
theological_decisions:
- issue: Portée sociale ou régionale implicite de « Galiléens »
  choice: Conserver la seule désignation régionale « Galiléens ».
  alternative: Ajouter une précision telle que « Galiléens sans instruction » ou expliquer leur accent.
  rationale: Le texte marque la surprise liée à leur origine galiléenne, mais n’en donne pas explicitement la raison. Une explication sociale ou linguistique résoudrait indûment une implication laissée ouverte.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Le couple « hors d’eux-mêmes / s’émerveillaient » maintient l’intensité cumulative et la distinction entre les deux verbes grecs.
