  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: fr
  text: 'Tous étaient stupéfaits et perplexes. Ils se disaient les uns aux autres : « Qu’est-ce que cela signifie ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: étaient stupéfaits
  rationale: L’imparfait décrit leur étonnement persistant. « Stupéfaits » exprime avec naturel une vive stupeur sans suggérer, comme pourrait le faire une traduction étymologique, une perte de raison.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: Ici, δέ est un connecteur narratif faible. En français moderne, le traduire mécaniquement par « et » ou « mais » alourdirait la phrase ou introduirait un contraste trop marqué.
- source_word: πάντες
  choice: Tous
  rationale: « Tous » conserve l’insistance inclusive de πάντες et reprend naturellement le groupe mentionné dans le contexte.
- source_word: διηπόρουν
  choice: perplexes
  rationale: Le verbe indique une profonde incertitude, le fait de ne pas savoir que penser. Avec l’imparfait de « être », « étaient perplexes » rend l’état qui se prolonge.
- source_word: ἄλλος πρὸς ἄλλον
  choice: les uns aux autres
  rationale: Cette expression réciproque est rendue par la tournure française courante et précise « les uns aux autres ».
- source_word: λέγοντες
  choice: Ils se disaient
  rationale: Le participe est transformé en proposition autonome pour obtenir une syntaxe française naturelle. L’imparfait correspond à la scène en cours et la forme pronominale convient à l’échange réciproque.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: Qu’est-ce que cela signifie ?
  rationale: La construction idiomatique τί θέλει + infinitif interroge ici sur le sens ou la portée du phénomène. La traduction littérale « Qu’est-ce que cela veut être ? » serait trompeuse en français moderne.
