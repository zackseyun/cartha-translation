id: ACT.2.42
reference: Acts 2:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: fr
  text: Ils s’attachaient avec persévérance à l’enseignement des apôtres, à la communion[a], à la fraction du pain[b] et aux prières[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au partage », « à la participation » ou « à la vie commune ».
    reason: lexical_alternative
  - marker: b
    text: « La fraction du pain » peut désigner, de manière générale, des repas pris en commun, bien que beaucoup y voient aussi le repas du Seigneur.
    reason: alternative_reading
  - marker: c
    text: Ou « aux prières établies » ; l’article peut évoquer des temps ou des formes de prière reconnus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: Ils étaient assidus
  rationale: La construction périphrastique à l’imparfait exprime une pratique continue et habituelle dans le passé. « Étaient assidus » rend à la fois la persévérance et l’engagement constant, dans un français naturel.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: à l’enseignement des apôtres
  rationale: « Enseignement » est actuel et naturel, sans la connotation plus systématique que peut avoir « doctrine ». Le génitif désigne vraisemblablement l’enseignement donné par les apôtres.
- source_word: τῇ κοινωνίᾳ
  choice: à la communion fraternelle
  rationale: κοινωνία évoque la participation commune, le partage et la vie communautaire. « Communion fraternelle » en conserve l’ampleur sans la réduire au partage matériel ni à un rite sacramentel.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: à la fraction du pain
  rationale: Cette expression traditionnelle mais intelligible reste proche de la formulation de Luc et laisse ouverte la question de savoir si elle désigne des repas partagés, le repas du Seigneur, ou les deux.
- source_word: ταῖς προσευχαῖς
  choice: aux prières
  rationale: Le pluriel précédé de l’article peut désigner des prières, des temps de prière ou des formes de prière reconnus; « aux prières » en préserve la spécificité.
theological_decisions:
- issue: Faut-il identifier explicitement la fraction du pain au repas du Seigneur ou à l’eucharistie?
  choice: Conserver l’expression large « la fraction du pain ».
  alternative: « le repas du Seigneur », « l’eucharistie » ou « les repas communautaires comprenant le repas du Seigneur »
  rationale: Dans Luc–Actes, l’expression peut renvoyer au partage d’un repas et, en contexte chrétien, inclure le repas commémoratif de Jésus. Le texte ne permet toutefois pas d’imposer ici une interprétation sacramentelle précise.
- issue: Faut-il limiter κοινωνία au partage des biens ou à la communion sacramentelle?
  choice: Employer « communion fraternelle » dans un sens communautaire large.
  alternative: « partage des biens », « participation commune » ou « communion »
  rationale: Le mot peut englober la vie partagée ainsi que ses dimensions matérielles et spirituelles. Le rendre par une expression plus étroite trancherait une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en quatre éléments reste nette. « Communion fraternelle » et « fraction du pain » conservent les formulations chrétiennes reconnues tout en étant explicitées par des notes qui préservent l’étendue sémantique et les ambiguïtés du grec.
