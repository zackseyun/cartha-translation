source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: fr
  text: C’est pourquoi mon cœur s’est réjoui et ma langue a exulté ; et même ma chair demeurera dans l’espérance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon corps reposera dans l’espérance ».'
    reason: Variante de traduction possible pour ἡ σάρξ μου κατασκηνώσει, qui rend σάρξ par « corps » et comprend le verbe au sens de « reposer ».
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure exprime naturellement en français le lien causal ou conséquent porté par διά avec l’accusatif, sans l’alourdir.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: mon cœur s’est réjoui
  rationale: Le passif grec a ici une valeur idiomatique d’état. « Le cœur » conserve l’image biblique de la personne intérieure.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: ma langue a exulté
  rationale: « Exulter » rend la joie intense du verbe et maintient « langue », image poétique de la louange exprimée à voix haute.
- source_word: ἔτι δὲ καὶ
  choice: de plus, même
  rationale: La formulation marque à la fois la progression du propos et l’accent porté sur la chair.
- source_word: ἡ σάρξ μου
  choice: ma chair
  rationale: Le terme est anthropologique et concret, non éthique. « Chair » préserve le vocabulaire grec et la tension du passage sans expliciter prématurément « corps ».
- source_word: κατασκηνώσει
  choice: demeurera
  rationale: Le verbe évoque le fait de s’établir ou de camper. « Demeurera » conserve l’image d’une habitation assurée tout en restant naturel en français.
- source_word: ἐπ’ ἐλπίδι
  choice: dans l’espérance
  rationale: Cette expression française rend la sphère ou le fondement d’espérance indiqué par ἐπί avec le datif, sans ajouter de précision interprétative.
theological_decisions:
- issue: Sens de σάρξ dans une citation appliquée ensuite à la résurrection
  choice: ma chair
  alternative: mon corps
  rationale: Le contexte concerne l’existence corporelle face à la mort, mais le texte dit littéralement « chair ». Ce choix conserve le langage anthropologique et laisse le contexte développer sa portée résurrectionnelle.
- issue: Nuance de κατασκηνώσει ἐπ’ ἐλπίδι
  choice: demeurera dans l’espérance
  alternative: reposera dans l’espérance
  rationale: « Demeurera » préserve l’image d’habitation du verbe grec; « reposera » est une interprétation traditionnelle plausible, mais elle en resserre le sens.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme entre le cœur, la langue et la chair est conservé, ainsi que la progression emphatique de la phrase.
