source:
  edition: SBLGNT
  text: Φρυγίαν τε καὶ Παμφυλίαν, Αἴγυπτον καὶ τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες Ῥωμαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/010.yaml
  text: Phrygia and Pamphylia[a], Egypt and the parts of Libya toward Cyrene, and the visiting Romans[b],
translation:
  language: fr
  text: la Phrygie et la Pamphylie, l’Égypte et les régions de la Libye situées du côté de Cyrène[a], ainsi que les Romains en séjour[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les régions de la Libye aux environs de Cyrène ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les Romains qui séjournent temporairement » ou « les visiteurs romains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: la Phrygie et la Pamphylie
  rationale: Les noms géographiques suivent leur forme française consacrée; τε καὶ relie naturellement les deux éléments de l’énumération.
- source_word: Αἴγυπτον
  choice: l’Égypte
  rationale: Forme française usuelle du nom du pays.
- source_word: τὰ μέρη τῆς Λιβύης
  choice: les régions de la Libye
  rationale: μέρη peut désigner des parties, contrées ou régions; « régions » est naturel en français dans cette liste géographique sans imposer un découpage administratif précis.
- source_word: τῆς κατὰ Κυρήνην
  choice: situées du côté de Cyrène
  rationale: κατά avec le nom de lieu situe ces régions libyennes par rapport à Cyrène. Cette formulation conserve la souplesse spatiale de l’expression grecque.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: les Romains de passage
  rationale: Le participe ἐπιδημοῦντες désigne ceux qui séjournent dans un lieu sans nécessairement y résider durablement; « de passage » exprime clairement cette présence temporaire.
