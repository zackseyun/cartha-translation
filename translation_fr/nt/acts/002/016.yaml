base_translation:
  language: en
  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: fr
  text: Mais c’est ce qui a été dit par l’intermédiaire du prophète Joël :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le prophète Joël ». Le grec peut exprimer l’action d’un agent, mais « par l’intermédiaire de » met mieux en évidence le rôle de Joël comme médiateur prophétique du message.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Conjonction adversative qui corrige l’interprétation erronée de la foule dans le contexte précédent ; « Mais » est naturel et direct en français.
- source_word: τοῦτό
  choice: c’est ce qui
  rationale: Le démonstratif neutre renvoie au phénomène présent. La tournure « c’est ce qui a été dit » rend naturellement en français la construction grecque avec le participe substantivé.
- source_word: ἐστιν
  choice: c’est
  rationale: Rend la copule sans lui donner le sens plus interprétatif de « signifie ».
- source_word: τὸ εἰρημένον
  choice: ce qui a été dit
  rationale: Le participe parfait passif substantivé désigne la parole prononcée antérieurement. Le passé composé passif est idiomatique et conserve la voix passive.
- source_word: διὰ
  choice: par l’intermédiaire de
  rationale: Avec le génitif et une personne, διά exprime ici la médiation ou l’agence. Cette formulation française rend explicitement le rôle instrumental du prophète sans en faire la source ultime du message.
- source_word: τοῦ προφήτου
  choice: du prophète
  rationale: Complément de διά, rendu directement tout en conservant le titre reconnu de Joël.
- source_word: Ἰωήλ
  choice: Joël
  rationale: Forme française traditionnelle et courante du nom propre biblique.
theological_decisions:
- issue: Médiation prophétique dans διὰ τοῦ προφήτου Ἰωήλ
  choice: par l’intermédiaire du prophète Joël
  alternative: par le prophète Joël
  rationale: Le choix principal préserve clairement la médiation prophétique exprimée par διά avec le génitif, sans préciser davantage l’identité de la source ultime ni importer une théorie particulière de l’inspiration. La formulation plus concise « par » reste grammaticalement possible.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure simple et accessible ; « par l’intermédiaire de » est légèrement plus explicite que « par », mais restitue naturellement la nuance médiatrice de διά. Le deux-points introduit la citation qui suit.
