  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: fr
  text: Tous les croyants étaient ensemble[a] et avaient tout en commun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étaient au même endroit ». L’expression grecque peut désigner le fait d’être ensemble ou réunis en un même lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Tous
  rationale: « Tous » conserve la portée globale du terme grec et s’accorde naturellement avec « les croyants ».
- source_word: δὲ
  choice: Non traduit explicitement
  rationale: Dans ce contexte, δὲ assure une simple continuité narrative. En français, l’enchaînement reste naturel sans connecteur explicite; « mais » introduirait un contraste excessif.
- source_word: οἱ πιστεύοντες
  choice: les croyants
  rationale: Le participe présent substantivé désigne les membres de la communauté caractérisés par leur foi. « Les croyants » est naturel, actuel et fidèle.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: étaient ensemble
  rationale: Cette expression peut évoquer le fait d’être réunis ou présents au même endroit. « Étaient ensemble » préserve à la fois la dimension communautaire et l’ambiguïté spatiale.
- source_word: εἶχον
  choice: avaient
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et exprime ici une situation continue ou habituelle.
- source_word: ἅπαντα κοινά
  choice: tout en commun
  rationale: Formulation française idiomatique qui rend l’étendue globale de ἅπαντα et l’idée de mise en commun exprimée par κοινά.
theological_decisions:
- issue: Nature de la vie commune de la communauté
  choice: Le verset décrit les croyants comme ayant tout en commun.
  alternative: Comprendre le verset comme la prescription d’un système économique normatif pour toutes les communautés chrétiennes.
  rationale: La phrase grecque rapporte une pratique de la communauté sans formuler ici de commandement ni de règle universelle. La traduction demeure donc descriptive, sans imposer une conclusion doctrinale ou politique.
translation_notes:
  register: Français international moderne, simple et digne. « Tout en commun » est plus idiomatique en français que le calque « toutes choses en commun », tandis que la note conserve la nuance possible de localisation dans ἐπὶ τὸ αὐτό.
