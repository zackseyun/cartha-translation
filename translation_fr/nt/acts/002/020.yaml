id: ACT.2.20
reference: Acts 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: fr
  text: 'Le soleil sera changé en ténèbres,

    et la lune en sang,

    avant que vienne le grand et éclatant jour du Seigneur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « manifeste » ou « remarquable » pour « éclatant » (grec ἐπιφανῆ).
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: sera changé
  rationale: Le futur passif est conservé et exprime le passage à un autre état sans préciser le mécanisme.
- source_word: εἰς σκότος
  choice: en ténèbres
  rationale: La préposition εἰς marque ici le résultat de la transformation; « en ténèbres » est naturel en français et maintient l’image prophétique.
- source_word: εἰς αἷμα
  choice: en sang
  rationale: Cette formulation littérale conserve la force de l’image grecque sans l’atténuer par une paraphrase telle que « rouge comme le sang ».
- source_word: πρὶν ἢ ἐλθεῖν
  choice: avant que vienne
  rationale: La construction temporelle est rendue par une tournure française idiomatique, avec le subjonctif exigé après « avant que ».
- source_word: ἡμέραν κυρίου
  choice: le jour du Seigneur
  rationale: Cette expression consacrée préserve l’arrière-plan prophétique et évite la confusion possible avec une désignation du dimanche.
- source_word: μεγάλην
  choice: grand
  rationale: « Grand » rend directement μέγας et maintient le registre prophétique élevé.
- source_word: ἐπιφανῆ
  choice: éclatant
  rationale: « Éclatant » peut évoquer à la fois ce qui se manifeste avec évidence et ce qui resplendit; il restitue ainsi une part importante de l’étendue sémantique du grec dans un français naturel.
theological_decisions:
- issue: La formule prophétique ἡμέραν κυρίου dans la citation de Joël au sein du discours de Pierre
  choice: le jour du Seigneur
  alternative: le jour qui appartient au Seigneur
  rationale: La formulation retenue conserve l’expression biblique traditionnelle de l’intervention décisive de Dieu sans l’identifier explicitement au dimanche ni préciser davantage l’identité du « Seigneur » dans ce verset.
- issue: La portée de l’adjectif ἐπιφανῆ
  choice: éclatant
  alternative: manifeste ou remarquable
  rationale: Le mot grec peut qualifier ce qui apparaît clairement, ce qui est remarquable ou ce qui resplendit. « Éclatant » convient au ton eschatologique tout en laissant l’alternative lexicale en note.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes fait ressortir le parallélisme poétique de la citation prophétique. La reprise « ce jour » clarifie naturellement en français que les adjectifs qualifient « le jour du Seigneur », sans ajouter de contenu interprétatif.
