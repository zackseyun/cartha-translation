  source_fidelity: 'Le sens fondamental est fidèle : les futurs passifs et les images littérales (« en ténèbres », « en sang ») sont préservés, de même que la valeur temporelle de πρὶν ἢ ἐλθεῖν et l’expression « le jour du Seigneur ». « Éclatant » constitue un rendu possible de ἐπιφανῆ, dont la nuance peut être celle de ce qui est remarquable, manifeste ou glorieux.'
