  terminology: « Le jour du Seigneur » est l’expression française biblique établie et évite l’ambiguïté de « jour du Seigneur » sans article ou de « jour du Seigneur » compris comme dimanche. « Éclatant » garde une polyvalence acceptable ; la note signale utilement les autres nuances pertinentes.
