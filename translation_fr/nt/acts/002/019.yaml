id: ACT.2.19
reference: Acts 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: fr
  text: 'Je donnerai des prodiges dans le ciel, en haut, et des signes sur la terre, en bas : du sang, du feu et une vapeur de fumée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώσω
  choice: je ferai paraître
  rationale: Le sens premier est « je donnerai », mais, avec des prodiges et des signes, le français idiomatique demande une expression comme « faire paraître ». Ce choix conserve Dieu comme auteur de leur manifestation sans introduire le simple verbe « montrer ».
- source_word: τέρατα
  choice: prodiges
  rationale: « Prodiges » désigne des phénomènes extraordinaires suscitant l’étonnement et forme en français biblique moderne un couple naturel avec « signes », sans limiter le terme aux miracles.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: dans le ciel, en haut
  rationale: « Ciel » convient à l’imagerie cosmique et garde le contraste vertical explicite avec la terre en bas. La virgule rend la reprise adverbiale naturelle en français.
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » conserve l’idée de phénomènes porteurs de sens et le vocabulaire récurrent du livre des Actes.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: sur la terre, en bas
  rationale: Dans l’opposition cosmique avec le ciel, γῆ désigne ici la terre plutôt qu’un territoire particulier; « sur » rend naturellement ἐπί.
- source_word: αἷμα
  choice: du sang
  rationale: Traduction concrète et directe de l’image prophétique.
- source_word: πῦρ
  choice: du feu
  rationale: Traduction directe qui préserve la force élémentaire de l’image.
- source_word: ἀτμίδα καπνοῦ
  choice: une colonne de fumée
  rationale: L’expression reprend la formulation française traditionnelle de Joël et décrit naturellement une masse de fumée qui s’élève. Le grec dit plus formellement « vapeur de fumée », possibilité signalée en note afin de préserver la nuance lexicale.
theological_decisions:
- issue: Portée des lieux cosmiques dans la citation de Joël
  choice: le ciel, en haut ... la terre, en bas
  alternative: le ciel d’en haut ... le pays d’en bas
  rationale: Le contraste οὐρανός/γῆ présente des signes de portée cosmique. « Ciel » et « terre » préservent cette ampleur sans réduire l’image à des phénomènes météorologiques ou locaux.
- issue: Rapport de Dieu aux prodiges et aux signes
  choice: je ferai paraître
  alternative: je donnerai
  rationale: La traduction indique que Dieu en est l’auteur, tout en exprimant idiomatiquement leur apparition. Elle ne précise pas davantage leur mode d’accomplissement.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle « dans le ciel, en haut ... sur la terre, en bas » conserve l’insistance du grec. Le deux-points introduit naturellement en français l’énumération des signes.
