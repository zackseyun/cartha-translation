  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: fr
  text: 'Car David n’est pas monté dans les cieux[a], mais il dit lui-même : « Le Seigneur a dit à mon Seigneur : “Assieds-toi à ma droite,” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Psaume 110.1. Dans le texte hébreu, le premier terme correspond au nom divin YHWH ; comparer : « Le SEIGNEUR a dit à mon Seigneur. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: n’est pas monté
  rationale: Le verbe ἀναβαίνω désigne ici le fait de monter aux cieux. « Monter » est naturel en français et conserve l’écho biblique de l’ascension sans alourdir la phrase.
- source_word: τοὺς οὐρανούς
  choice: dans les cieux
  rationale: Le pluriel grec est conservé par « les cieux », expression biblique encore claire en français moderne.
- source_word: λέγει δὲ αὐτός
  choice: mais il dit lui-même
  rationale: « Mais » marque le contraste introduit par δέ, tandis que « lui-même » rend la valeur intensive de αὐτός. Le présent « dit » présente l’Écriture citée comme une parole toujours actuelle.
- source_word: ὁ κύριος
  choice: Le Seigneur
  rationale: Le texte grec emploie κύριος. « Le Seigneur » le rend directement, tandis que la présence du nom divin YHWH dans le texte hébreu du psaume est signalée en note.
- source_word: τῷ κυρίῳ μου
  choice: à mon Seigneur
  rationale: Cette traduction conserve le parallélisme lexical du grec et la portée christologique de l’argument de Pierre, sans réduire κύριος à « maître ».
- source_word: Κάθου
  choice: Assieds-toi
  rationale: Cette forme impérative est directe, naturelle et digne en français moderne; elle exprime l’invitation à prendre la place d’honneur.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Il s’agit de l’expression française idiomatique correspondant à la place d’honneur et d’autorité désignée par la tournure grecque.
theological_decisions:
- issue: Traduction des deux occurrences de κύριος dans la citation du Psaume 110.1
  choice: 'Les deux occurrences sont rendues par « Seigneur » dans le texte principal : « Le Seigneur a dit à mon Seigneur »'
  alternative: « Le SEIGNEUR a dit à mon Seigneur », afin de représenter le nom divin YHWH dans l’hébreu du psaume
  rationale: Le texte source grec porte κύριος dans les deux cas. Le texte principal suit donc le grec, tandis qu’une note préserve l’information importante selon laquelle la première occurrence correspond à YHWH dans le texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste et l’accent du grec, ainsi que le pluriel biblique « les cieux ». La ponctuation maintient le verset comme le début d’une citation qui se poursuit.
