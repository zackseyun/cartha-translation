id: ACT.2.45
reference: Acts 2:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: fr
  text: Ils vendaient leurs propriétés et leurs biens, et les répartissaient entre tous[a], selon les besoins de chacun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leurs terres et leurs possessions ». Les deux termes grecs semblent distinguer différentes catégories de biens possédés : κτήματα désigne souvent des propriétés ou des terres, et ὑπάρξεις, les biens ou possessions plus généralement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: propriétés
  rationale: Le terme désigne des biens acquis, souvent des domaines ou des biens fonciers. « Propriétés » le distingue naturellement de ὑπάρξεις sans le limiter explicitement aux terres.
- source_word: ὑπάρξεις
  choice: biens
  rationale: Le terme désigne ce que l’on possède, les avoirs ou possessions. « Biens » forme avec « propriétés » une paire française naturelle tout en conservant une distinction possible entre catégories de possessions.
- source_word: ἐπίπρασκον
  choice: vendaient
  rationale: L’imparfait grec présente une action en cours ou répétée. L’imparfait français « vendaient » en préserve l’aspect sans suggérer une vente unique et achevée.
- source_word: διεμέριζον
  choice: répartissaient
  rationale: Le verbe décrit ici la distribution ou le partage entre les membres du groupe. « Répartissaient » exprime une allocation à plusieurs selon leurs besoins.
- source_word: αὐτά
  choice: les
  rationale: Le pronom renvoie grammaticalement aux propriétés et aux biens, ou implicitement à ce qui en provenait. « Les » conserve cette concision et n’ajoute pas explicitement « le produit de la vente ».
- source_word: πᾶσιν
  choice: entre tous
  rationale: Le datif désigne l’ensemble des bénéficiaires dans la communauté. Avec « répartir », la construction idiomatique française est « entre tous ».
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: selon les besoins de chacun
  rationale: Cette formulation naturelle exprime que la répartition dépendait du besoin propre à chaque personne et rend la valeur indéfinie de ἄν τις.
theological_decisions:
- issue: Nature du partage des biens parmi les croyants
  choice: Le verset décrit des ventes et des répartitions répétées, déterminées par les besoins de chacun, sans préciser que toute propriété privée avait été abolie ni ériger explicitement cette pratique en règle universelle.
  alternative: Comprendre le verset comme l’établissement d’une propriété intégralement collective, obligatoire pour tous les chrétiens.
  rationale: Les verbes à l’imparfait décrivent une pratique suivie ou répétée. Le texte parle de biens vendus et répartis, mais ne formule ici ni abolition générale de la propriété privée ni commandement universel. La traduction reste donc descriptive.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait restitue l’action répétée; « puis » rend la succession coordonnée des ventes et de la répartition sans transformer le passage en prescription doctrinale.
