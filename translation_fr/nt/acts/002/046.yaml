id: ACT.2.46
reference: Acts 2:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: fr
  text: Jour après jour, d’un commun accord, ils fréquentaient assidûment l’enceinte du Temple[a]. Ils rompaient le pain de maison en maison[b] et prenaient leur nourriture[c] avec joie et simplicité de cœur[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne l’ensemble du complexe du Temple, et non seulement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: « Rompre le pain » peut désigner des repas pris en commun ; certains y voient aussi une allusion au repas du Seigneur.
    reason: alternative_reading
  - marker: c
    text: Ou « leurs repas ».
    reason: lexical_alternative
  - marker: d
    text: Ou « sincérité de cœur » ou « générosité de cœur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: jour après jour
  rationale: Cette tournure distributive rend naturellement la répétition quotidienne exprimée par κατά avec l’accusatif.
- source_word: προσκαρτεροῦντες
  choice: ils persévéraient
  rationale: Le participe présent décrit une assiduité durable; l’imparfait français restitue ici cette action continue.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: L’expression conserve à la fois l’unité du groupe et la convergence de ses dispositions ou de son but.
- source_word: ἐν τῷ ἱερῷ
  choice: dans l’enceinte du Temple
  rationale: ἱερόν désigne l’ensemble du complexe du Temple, et non le sanctuaire intérieur proprement dit.
- source_word: κλῶντές ... ἄρτον
  choice: ils rompaient le pain
  rationale: L’expression traditionnelle et intelligible préserve la portée large de la formule lucanienne sans décider si elle désigne uniquement des repas ordinaires ou comporte aussi une résonance liée au repas du Seigneur.
- source_word: κατ’ οἶκον
  choice: de maison en maison
  rationale: La valeur distributive de κατά indique que cette pratique se répétait dans diverses maisons.
- source_word: μετελάμβανον τροφῆς
  choice: prenaient leur nourriture
  rationale: Cette formulation naturelle reste proche du sens de participer à ou prendre de la nourriture, sans ajouter explicitement une idée de mise en commun absente du verbe lui-même.
- source_word: ἐν ἀγαλλιάσει
  choice: avec joie
  rationale: Le terme exprime une joie vive; «avec joie» est clair, naturel et suffisamment ample dans ce contexte.
- source_word: ἀφελότητι καρδίας
  choice: simplicité de cœur
  rationale: Cette traduction formellement proche conserve l’éventail de sens de ἀφελότης, qui peut évoquer une disposition sans détour, sincère ou généreuse.
theological_decisions:
- issue: La portée de l’expression «rompre le pain»
  choice: Conserver l’expression générale «rompaient le pain» dans le contexte des repas.
  alternative: Préciser soit qu’il s’agit uniquement de repas ordinaires, soit qu’il s’agit explicitement du repas du Seigneur.
  rationale: Dans Luc–Actes, cette expression peut désigner le partage d’un repas et peut aussi avoir une résonance eucharistique. La mention immédiate de la nourriture favorise le cadre d’un repas communautaire, sans exclure l’autre portée; la traduction maintient donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est divisée en deux phrases pour éviter une accumulation participiale peu naturelle en français, tout en conservant la progression du grec. La majuscule à «Temple» identifie l’édifice de Jérusalem.
