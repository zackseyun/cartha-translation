revisions:
- from: Jour après jour, ils persévéraient d’un commun accord dans l’enceinte du Temple[a]. Ils rompaient le pain de maison en maison[b] et prenaient leur nourriture[c] avec joie et simplicité de cœur[d].
  to: Jour après jour, d’un commun accord, ils fréquentaient assidûment l’enceinte du Temple[a]. Ils rompaient le pain de maison en maison[b] et prenaient leur nourriture[c] avec joie et simplicité de cœur[d].
  rationale: La révision se limite à remplacer « persévéraient ... dans l’enceinte » par « fréquentaient assidûment l’enceinte », formulation française plus idiomatique qui rend l’assiduité continue de προσκαρτεροῦντες avec le complément locatif. Les notes et les autres choix sont conservés, notamment l’ambiguïté volontaire de « rompaient le pain ».
