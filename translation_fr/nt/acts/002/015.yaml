  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: fr
  text: En effet, ceux-ci ne sont pas ivres, comme vous le supposez, car c’est la troisième heure du jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire environ neuf heures du matin, selon le décompte antique des heures à partir du lever du soleil.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: En effet, ... ne sont pas
  rationale: γάρ relie l’affirmation à ce qui précède avec une valeur explicative; « En effet » rend naturellement cette progression argumentative, tandis que « ne… pas » traduit οὐ.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: comme vous le supposez
  rationale: ὑπολαμβάνω signifie ici « supposer, penser ». Le pronom « vous » conserve l’adresse explicite marquée par ὑμεῖς, et « le » reprend naturellement en français l’idée d’ivresse.
- source_word: οὗτοι
  choice: ceux-ci
  rationale: Le démonstratif désigne directement le groupe accusé, sans ajouter « hommes » ou « personnes », absents du grec.
- source_word: μεθύουσιν
  choice: sont ivres
  rationale: Dans ce contexte, le présent décrit l’état d’ivresse allégué; « sont ivres » est l’équivalent français le plus direct et naturel.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: car il n’est que la troisième heure du jour
  rationale: « Car » conserve la valeur justificative de γάρ. La tournure française « il n’est que » explicite naturellement que l’heure matinale rend l’accusation invraisemblable, sans convertir l’heure dans le texte principal.
- source_word: ὥρα τρίτη
  choice: la troisième heure
  rationale: Cette formulation préserve le mode antique de compter les heures; son équivalent moderne est donné en note.
