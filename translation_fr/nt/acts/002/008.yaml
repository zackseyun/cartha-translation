source:
  edition: SBLGNT
  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: fr
  text: Et comment se fait-il que chacun de nous les entende parler dans sa propre langue maternelle[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans notre propre dialecte, dans lequel nous sommes nés ».'
    reason: Préserve l’ambiguïté de διάλεκτος entre « langue » et « dialecte », ainsi que la proposition relative explicite du grec.
lexical_decisions:
- source_word: πῶς
  choice: comment se fait-il que
  rationale: Cette tournure française naturelle exprime l’étonnement porté par la question grecque.
- source_word: ἡμεῖς … ἕκαστος
  choice: chacun de nous
  rationale: Le singulier distributif ἕκαστος et le pronom emphatique ἡμεῖς sont rendus par l’expression idiomatique « chacun de nous ».
- source_word: ἀκούομεν
  choice: les entende
  rationale: Le verbe est accordé avec « chacun »; le pronom « les » reprend naturellement les personnes qui parlent dans le contexte immédiat, sans changer le contenu de l’audition.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: dans sa propre langue maternelle
  rationale: διάλεκτος peut désigner une langue ou un dialecte. « Langue maternelle » transmet ici clairement l’idée précisée par la proposition « dans laquelle nous sommes nés », tandis que « propre » rend ἰδίᾳ.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: maternelle
  rationale: Cette formulation concise et idiomatique exprime le lien de la langue avec la naissance et le milieu d’origine; la formulation littérale est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La question garde son ton d’étonnement. « Langue maternelle » privilégie la clarté courante, avec la traduction plus formelle et l’alternative « dialecte » en note.
