  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : tous sont remplis de l’Esprit Saint, commencent à parler en d’autres langues, et cette parole dépend de l’action continue de l’Esprit. « Selon ce que » est toutefois moins précis pour καθὼς, qui exprime ici la manière ou la mesure de l’habilitation. « Comme » rend plus directement la relation indiquée par le grec.'
  naturalness: Le français est globalement naturel et de registre biblique moderne. « Comme l’Esprit leur donnait de s’exprimer » est idiomatique et plus fluide que « selon ce que l’Esprit leur donnait d’exprimer ».
  terminology: « Esprit Saint » et « d’autres langues » sont des choix justes et usuels. La note actuelle introduit de manière un peu lourde « le phénomène appelé “parler en langues” » et formule comme une explication lexicale ce qui relève surtout du contexte. Une note plus sobre peut signaler l’alternative française tout en laissant le contexte préciser la nature des langues.
  issues:
