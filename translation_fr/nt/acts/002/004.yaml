    issue: Rendre καθὼς par « selon ce que »
    rationale: Cette expression peut orienter vers le contenu de ce qui est exprimé. « Comme » rend plus directement la manière ou la mesure selon laquelle l’Esprit leur accordait de parler.
  - severity: low
