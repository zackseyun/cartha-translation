id: ACT.2.4
reference: Acts 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπλήσθησαν ⸀πάντες πνεύματος ἁγίου, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ⸂ἀποφθέγγεσθαι αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/004.yaml
  text: And they were all filled with the Holy Spirit and began to speak in other tongues[a], as the Spirit was giving them utterance.
translation:
  language: fr
  text: Ils furent tous remplis de l’Esprit Saint et se mirent à parler en d’autres langues[a], comme l’Esprit leur donnait de s’exprimer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans d’autres langues ». Le grec peut désigner des langues; la suite du récit indique que les auditeurs reconnaissaient leurs propres langues.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: furent remplis
  rationale: L’aoriste passif de πίμπλημι décrit ici le fait d’être rempli ou investi par l’Esprit. « Furent remplis » rend naturellement l’événement ponctuel du récit.
- source_word: πάντες
  choice: tous
  rationale: Le terme souligne que l’expérience concerne la totalité du groupe présent.
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit Saint
  rationale: Malgré l’absence d’article en grec, le contexte de Luc-Actes désigne l’Esprit divin promis et agissant; l’article défini est requis par l’usage français naturel.
- source_word: ἤρξαντο λαλεῖν
  choice: se mirent à parler
  rationale: Cette tournure française actuelle exprime clairement le commencement de l’action marqué par ἤρξαντο suivi de l’infinitif.
- source_word: ἑτέραις γλώσσαις
  choice: en d’autres langues
  rationale: γλῶσσα peut désigner la langue comme organe ou comme système linguistique, et prend aussi dans ce contexte le sens de parole en langues. Le français « langues » conserve utilement cette latitude, tandis que « d’autres » rend ἑτέραις.
- source_word: καθὼς
  choice: selon ce que
  rationale: L’expression introduit ici ce que l’Esprit accordait à chacun d’exprimer, avec une nuance de manière ou de mesure.
- source_word: ἐδίδου
  choice: donnait
  rationale: L’imparfait grec présente l’action continue de l’Esprit pendant qu’ils parlaient; l’imparfait français la conserve.
- source_word: ἀποφθέγγεσθαι
  choice: d’exprimer
  rationale: Le verbe désigne le fait de parler distinctement ou de proférer publiquement. « Exprimer » s’intègre naturellement à la construction française sans limiter indûment cette parole à la prophétie.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif désigne les personnes auxquelles l’Esprit accordait cette capacité de s’exprimer.
theological_decisions:
- issue: Faut-il comprendre πνεύματος ἁγίου comme une référence personnelle et divine ou comme un esprit saint générique?
  choice: l’Esprit Saint
  alternative: un esprit saint
  rationale: Dans Actes 2, le référent est l’Esprit divin promis, qui agit comme sujet personnel du verbe « donnait ». La formulation française marque cette identité sans ajouter de précision doctrinale étrangère au récit.
- issue: Faut-il préciser que γλώσσαις désigne des langues humaines ou conserver la latitude du terme?
  choice: d’autres langues
  alternative: d’autres langages; en d’autres langues humaines
  rationale: « Langues » est le correspondant français naturel et conserve l’ambiguïté lexicale du grec dans ce verset. Le contexte d’Actes 2.6-11 indique ensuite que les auditeurs reconnaissent leurs propres langues; il n’est donc pas nécessaire d’insérer cette interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. « Se mirent à parler » évite une tournure trop littérale, tandis que « selon ce que l’Esprit leur donnait d’exprimer » conserve l’action continue et l’initiative de l’Esprit. L’élision et les majuscules suivent l’usage biblique français courant.
