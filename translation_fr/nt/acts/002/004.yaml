    rationale: « Le phénomène appelé “parler en langues” » est plus interprétatif et moins directement lexical que nécessaire. Une formulation plus concise conserve l’ambiguïté du terme grec et situe l’éclairage dans le contexte suivant.
  revised_text: Ils furent tous remplis de l’Esprit Saint et se mirent à parler en d’autres langues[a], comme l’Esprit leur donnait de s’exprimer.
