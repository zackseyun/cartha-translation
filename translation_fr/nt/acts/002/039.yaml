id: ACT.2.39
reference: Acts 2:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: fr
  text: Car la promesse est pour vous, pour vos enfants et pour tous ceux qui sont au loin[a], tous ceux que le Seigneur notre Dieu appellera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui sont éloignés ». L’expression peut désigner des personnes géographiquement éloignées, éloignées par rapport à l’alliance, ou les deux.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « autant que le Seigneur notre Dieu appellera ». La tournure grecque désigne, sans en fixer d’avance le nombre, tous ceux que Dieu appelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: « Car » conserve le lien explicatif avec l’appel à la repentance et au baptême formulé au verset précédent, dans un registre naturel et digne.
- source_word: ἐπαγγελία
  choice: la promesse
  rationale: Le nom grec désigne directement la promesse. Le traduire par « le don promis » préciserait indûment son contenu à cet endroit.
- source_word: τέκνοις
  choice: enfants
  rationale: « Enfants » rend naturellement le sens familial de τέκνα sans limiter le terme à une tranche d’âge ni exclure l’idée de descendance.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: tous ceux qui sont au loin
  rationale: Cette formulation française garde l’image de l’éloignement et laisse ouverte sa portée géographique, relationnelle ou liée à l’alliance.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: tous ceux que … appellera
  rationale: La relative exprime un groupe indéfini mais englobant, déterminé par l’appel de Dieu. Le futur français rend naturellement la portée éventuelle du subjonctif grec avec ἄν, sans ajouter « à lui », qui n’est pas explicite.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: le Seigneur notre Dieu
  rationale: Cette traduction conserve le titre κύριος et l’expression d’appartenance « notre Dieu » dans leur ordre français naturel.
theological_decisions:
- issue: Portée de « ceux qui sont au loin »
  choice: La traduction reste large et ne précise pas l’identité des personnes éloignées.
  alternative: Les Juifs de la diaspora seulement, les non-Juifs seulement, ou à la fois les personnes géographiquement et spirituellement éloignées.
  rationale: Le grec permet plusieurs résonances et le verset ne tranche pas à lui seul entre elles.
- issue: Nature de l’appel divin
  choice: « ceux que le Seigneur notre Dieu appellera »
  alternative: Un appel efficace au sens d’un système sotériologique particulier, ou une invitation générale.
  rationale: Le texte affirme que Dieu appelle, mais n’explique pas ici le fonctionnement théologique de cet appel. La formulation évite donc de lui imposer un cadre confessionnel.
- issue: Rapport entre les personnes éloignées et celles que Dieu appelle
  choice: La seconde proposition est placée en apposition explicative après une virgule.
  alternative: La comprendre comme une nouvelle catégorie indépendante ou traduire plus littéralement « autant que le Seigneur… appellera ».
  rationale: Le grec qualifie l’ensemble des bénéficiaires par l’appel de Dieu. La formulation française préserve ce lien sans alourdir la phrase.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « pour » structure la phrase et rend nettement les trois groupes mentionnés. « Au loin » conserve la résonance biblique tout en restant immédiatement compréhensible.
