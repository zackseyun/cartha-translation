source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: fr
  text: 'Mais Pierre, debout avec les onze, éleva la voix et leur déclara : « Hommes de Judée et vous tous qui habitez Jérusalem, sachez ceci et prêtez l’oreille à mes paroles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: Mais Pierre, debout
  rationale: Le participe aoriste plante le décor sans exiger une séquence fortement marquée. « Mais » rend le tournant discursif après la moquerie du verset précédent.
- source_word: σὺν τοῖς ἕνδεκα
  choice: avec les onze
  rationale: Rend directement l’accompagnement exprimé par σύν avec le datif.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: éleva la voix
  rationale: Expression française naturelle et digne pour une prise de parole forte et publique.
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: leur déclara
  rationale: Le verbe désigne ici une parole publique, appuyée ou solennelle. « Déclara » en conserve la force sans expliciter une inspiration que le seul verbe ne suffit pas à imposer.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: Hommes de Judée
  rationale: Préserve le vocatif masculin ἄνδρες et la désignation Ἰουδαῖοι, qui peut ici être entendue dans son ancrage judéen, tout en maintenant la formulation de l’adresse.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: vous tous qui habitez Jérusalem
  rationale: La deuxième personne convient naturellement à l’adresse directe et rend explicitement πάντες.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: sachez bien ceci
  rationale: Formulation impérative française naturelle qui conserve la solennité et l’insistance de la tournure grecque.
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: prêtez l’oreille à mes paroles
  rationale: Rend l’idée d’une écoute attentive portée par l’impératif moyen, tout en conservant directement ῥήματα par « paroles ».
theological_decisions:
- issue: Spécificité masculine de Ἄνδρες
  choice: Hommes de Judée
  alternative: Gens de Judée ; Judéens
  rationale: Le grec emploie explicitement le vocatif masculin ἄνδρες. Le texte principal le conserve plutôt que de le neutraliser.
- issue: Portée de ἀπεφθέγξατο
  choice: leur déclara
  alternative: s’adressa à eux ; leur parla sous l’inspiration
  rationale: « Déclara » garde le caractère public et appuyé du verbe sans transformer sa nuance possible en affirmation théologique explicite.
- issue: Sens de Ἰουδαῖοι dans le contexte de Jérusalem
  choice: de Judée
  alternative: Juifs
  rationale: Dans cette adresse située à Jérusalem, le terme peut avoir une portée régionale ou identitaire. « De Judée » suit l’ancrage contextuel sans développer davantage l’identité des destinataires.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. La syntaxe conserve le rythme d’une proclamation publique. Aucun appel de note n’est nécessaire dans ce verset.
