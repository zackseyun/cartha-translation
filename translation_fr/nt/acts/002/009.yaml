  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: fr
  text: Parthes, Mèdes et Élamites, et les habitants de la Mésopotamie, de la Judée et de la Cappadoce, du Pont et de l’Asie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la province romaine d’Asie, située dans l’ouest de l’Asie Mineure, et non du continent actuel.
