lexical_decisions:
- source_word: Πάρθοι
  choice: Parthes
  rationale: Ethnonyme français usuel désignant le peuple parthe.
- source_word: Μῆδοι
  choice: Mèdes
  rationale: Ethnonyme français traditionnel et toujours compréhensible pour les habitants de la Médie.
- source_word: Ἐλαμῖται
  choice: Élamites
  rationale: Forme française usuelle de l’ethnonyme désignant les gens d’Élam.
- source_word: οἱ κατοικοῦντες
  choice: habitants de
  rationale: Rend naturellement en français le participe substantivé désignant ceux qui résident dans les régions énumérées, sans devoir répéter « ceux qui habitent ».
- source_word: τὴν Μεσοποταμίαν
  choice: la Mésopotamie
  rationale: Nom géographique français standard, avec l’article exigé par l’usage français.
- source_word: Ἰουδαίαν
  choice: la Judée
  rationale: Nom français standard de la région, conservé dans son sens géographique.
- source_word: τε καὶ
  choice: et
  rationale: La coordination simple est la formulation française la plus naturelle; la légère nuance additive possible de τε καί ne peut être reproduite ici sans alourdir ou déformer la liste.
- source_word: Καππαδοκίαν
  choice: la Cappadoce
  rationale: Nom géographique français standard.
- source_word: Πόντον
  choice: le Pont
  rationale: Nom français traditionnel de la région antique du Pont, avec l’article conforme à l’usage.
- source_word: τὴν Ἀσίαν
  choice: l’Asie
  rationale: Conserve le nom géographique du texte source; une note précise qu’il s’agit de la province romaine antique et non du continent moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. La liste nominale conserve la succession géographique du grec. « Habitants de » s’applique naturellement à l’ensemble des régions qui suivent. La ponctuation finale reste ouverte puisque le verset se poursuit.
