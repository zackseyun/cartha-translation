  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: fr
  text: car tu n’abandonneras pas mon âme dans l’Hadès[a], et tu ne laisseras pas ton Saint[b] voir la décomposition[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Shéol », d’après le texte hébreu à l’origine de cette citation ; le grec porte ici « Hadès ».
    reason: alternative_reading
  - marker: b
    text: Ou « ton fidèle ».
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de la décomposition du corps ; on traduit traditionnellement par « corruption ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: n’abandonneras pas
  rationale: Le futur actif exprime le fait de ne pas laisser quelqu’un dans un lieu ou un état. « Abandonner » est naturel en français moderne et conserve la force du verbe.
- source_word: τὴν ψυχήν μου
  choice: mon âme
  rationale: Dans cette citation, ψυχή peut aussi désigner la vie ou la personne elle-même. « Mon âme » reste proche du grec et préserve l’ambiguïté anthropologique sans imposer une explication doctrinale.
- source_word: εἰς ᾅδην
  choice: à l’Hadès
  rationale: Le grec porte ᾅδης, qui désigne le séjour ou monde des morts. « Hadès » maintient le terme grec sans le confondre avec l’enfer ni le réduire à la tombe; la note signale l’arrière-plan hébreu « Shéol ».
- source_word: δώσεις
  choice: laisseras
  rationale: Avec l’infinitif, δίδωμι a ici le sens idiomatique de permettre. « Laisser » rend cette construction clairement et naturellement.
- source_word: τὸν ὅσιόν σου
  choice: ton Saint
  rationale: ὅσιος peut qualifier celui qui est saint, fidèle ou consacré à Dieu. « Ton Saint » conserve la portée christologique du contexte tout en signalant en note l’alternative lexicale « ton fidèle ».
- source_word: ἰδεῖν διαφθοράν
  choice: voir la décomposition
  rationale: La formulation conserve l’image grecque « voir » et rend explicite le sens physique de διαφθορά dans ce contexte, sans l’ambiguïté morale que pourrait avoir « corruption » en français moderne.
theological_decisions:
- issue: Traduction de ᾅδης dans une citation liée à la résurrection
  choice: l’Hadès
  alternative: le séjour des morts; le Shéol; la tombe
  rationale: « Hadès » suit directement le texte grec et évite d’introduire les associations doctrinales ultérieures du mot « enfer ». Une note conserve le lien avec le Shéol du texte hébreu cité.
- issue: Identification christologique de τὸν ὅσιόν σου
  choice: ton Saint
  alternative: ton fidèle; celui qui t’est consacré
  rationale: Dans Actes 2, Pierre applique explicitement ce psaume à Jésus. « Ton Saint » préserve à la fois la valeur lexicale et la portée christologique, sans ajouter au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme de la citation poétique. « Hadès » et « âme » préservent les termes et les tensions du grec, tandis que les notes fournissent les principales alternatives sans les imposer au texte.
