  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: fr
  text: 'Mais d’autres se moquaient et disaient : « Ils sont pleins de vin doux[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vin nouveau ». Le grec γλεῦκος désigne un vin frais et doux ; la traduction traditionnelle « vin nouveau » est possible.
