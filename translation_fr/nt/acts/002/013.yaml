lexical_decisions:
- source_word: ἕτεροι
  choice: d’autres
  rationale: L’adjectif substantivé désigne un autre groupe au sein de la foule ; « d’autres » est naturel et précis en français.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici le contraste avec la réaction rapportée au verset précédent.
- source_word: διαχλευάζοντες
  choice: se moquaient
  rationale: Le participe exprime une moquerie méprisante ; cette tournure reste claire et idiomatique sans accentuer excessivement le sens.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente une parole en cours ou répétée ; l’imparfait français en conserve naturellement l’aspect.
- source_word: ὅτι
  choice: discours direct
  rationale: La conjonction introduit le contenu de leurs paroles ; le discours direct est naturel dans ce contexte.
- source_word: Γλεύκους
  choice: vin doux
  rationale: Le terme désigne un vin doux et frais, ou du moût fermenté ; « vin doux » rend sa caractéristique lexicale principale sans suggérer une boisson non fermentée.
- source_word: μεμεστωμένοι εἰσίν
  choice: Ils sont pleins
  rationale: La construction périphrastique décrit l’état résultant d’une consommation abondante ; « être plein de vin » est idiomatique et conserve l’idée d’être rempli.
