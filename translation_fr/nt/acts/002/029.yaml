id: ACT.2.29
reference: Acts 2:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: fr
  text: 'Hommes, frères[a], il m’est permis de vous parler en toute franchise au sujet du patriarche David : il est mort et a été enseveli, et son tombeau est parmi nous jusqu’à ce jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Hommes, frères », formule solennelle d’adresse. On peut aussi traduire : « Frères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Hommes, mes frères
  rationale: Les deux vocatifs masculins sont conservés. En français, l’ajout idiomatique de « mes » évite une adresse artificielle tout en maintenant la double interpellation solennelle.
- source_word: ἐξὸν εἰπεῖν
  choice: je peux vous parler
  rationale: Dans ce contexte, l’expression indique la liberté ou la possibilité légitime de parler, et non la seule capacité physique. « Je peux vous parler » est naturel en français; le complément « avec assurance » en précise la portée.
- source_word: μετὰ παρρησίας
  choice: avec assurance
  rationale: παρρησία désigne ici une parole ouverte, franche et confiante. « Avec assurance » restitue cette liberté de parole sans suggérer la témérité.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: au sujet du patriarche David
  rationale: « Patriarche » est le titre français précis, et « au sujet de » rend περί dans un registre courant et digne.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: il est mort et a été enseveli
  rationale: Les deux faits coordonnés sont exprimés directement. « Enseveli » convient au registre biblique moderne et rend le passif grec.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: son tombeau
  rationale: μνῆμα désigne ici un lieu de sépulture identifiable; « tombeau » convient mieux que « tombe » à ce site connu et encore présent.
- source_word: ἔστιν ἐν ἡμῖν
  choice: est parmi nous
  rationale: La formule garde la dimension à la fois locale et communautaire de ἐν ἡμῖν, sans ajouter explicitement « ici ».
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: jusqu’à ce jour
  rationale: Cette tournure française établie conserve exactement la continuité temporelle exprimée par le grec.
theological_decisions:
- issue: Portée de l’adresse masculine Ἄνδρες ἀδελφοί
  choice: Hommes, mes frères
  alternative: Frères; frères et sœurs
  rationale: Le texte grec présente deux vocatifs masculins distincts. La traduction les conserve sans transformer explicitement l’auditoire en groupe mixte; une note explique la tournure afin d’éviter qu’elle soit prise pour une maladresse française ou qu’une ambiguïté historique soit résolue sans preuve.
translation_notes:
  register: Français international moderne, digne et oral. La double adresse grecque est volontairement visible, mais légèrement naturalisée par « mes frères ». « Avec assurance » garde la franchise publique de παρρησία, tandis que « enseveli » et « jusqu’à ce jour » maintiennent un registre biblique clair sans archaïsme excessif.
