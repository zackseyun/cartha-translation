  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: fr
  text: La crainte gagnait chacun[a], et beaucoup de prodiges et de signes se produisaient par l’intermédiaire des apôtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à toute âme ». Le mot traduit par « crainte » peut aussi évoquer l’effroi ou l’émerveillement respectueux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: La crainte s’emparait
  rationale: L’imparfait de γίνομαι avec φόβος décrit ici un état qui survenait ou gagnait les personnes. « S’emparait » restitue naturellement en français ce mouvement tout en conservant la force du terme.
- source_word: δὲ
  choice: et
  rationale: δέ assure ici la progression du récit sans marquer une opposition forte ; « et » convient au fil narratif.
- source_word: πάσῃ ψυχῇ
  choice: de chacun
  rationale: L’expression signifie littéralement « de toute âme », mais désigne idiomatiquement chaque personne. « Chacun » est clair et naturel en français moderne ; la forme littérale est signalée en note.
- source_word: φόβος
  choice: crainte
  rationale: « Crainte » conserve l’ambivalence de φόβος entre peur et saisissement respectueux, sans réduire le sens au seul émerveillement.
- source_word: πολλά
  choice: beaucoup de
  rationale: Équivalent quantitatif naturel de πολλά devant les deux substantifs coordonnés.
- source_word: τέρατα
  choice: prodiges
  rationale: « Prodiges » exprime le caractère saisissant de ces actes et maintient sa distinction avec σημεῖα.
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » préserve la fonction révélatrice ou significative de σημεῖα dans le couple traditionnel « prodiges et signes ».
- source_word: διὰ τῶν ἀποστόλων
  choice: par l’intermédiaire des apôtres
  rationale: διά suivi du génitif marque l’intermédiaire ou l’agent. Cette formulation laisse entendre que les apôtres sont les instruments de l’action sans les présenter nécessairement comme sa source ultime.
- source_word: ἐγίνετο
  choice: se produisaient
  rationale: Le second imparfait présente des événements répétés ou continus. « Se produisaient » rend naturellement cette valeur sans ajouter un passif absent de la forme grecque.
theological_decisions:
- issue: Nuance de φόβος devant l’activité divine manifestée par les apôtres
  choice: crainte
  alternative: peur ; profond respect ; saisissement
  rationale: « Crainte » conserve la tension entre peur et respect mêlé d’émerveillement. Traduire uniquement par « émerveillement » ou « profond respect » résoudrait une ambiguïté réelle du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant l’aspect duratif des deux imparfaits et le couple lexical « prodiges et signes ».
