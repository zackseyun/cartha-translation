id: ACT.2.1
reference: Acts 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: fr
  text: Quand le jour de la Pentecôte arriva[a], ils étaient tous ensemble au même endroit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au moment où le jour de la Pentecôte s’accomplissait » ; autre traduction : « arrivait à son accomplissement ».'
    reason: La construction grecque présente la venue du jour comme un accomplissement en cours. La formulation littérale est inhabituelle en français et pourrait être comprise à tort comme désignant la fin de la journée.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: fut arrivé
  rationale: Avec ἐν τῷ, l’infinitif présent passif forme une proposition temporelle. Le grec évoque littéralement le fait que le jour « s’accomplit » ou « arrive à son terme ». « Fut arrivé » exprime naturellement en français la venue du jour fixé, tandis que la note conserve la nuance progressive de la formulation grecque.
- source_word: πεντηκοστῆς
  choice: Pentecôte
  rationale: « Pentecôte » est le nom français établi de la fête juive désignée ici par le grec Πεντηκοστή, célébrée cinquante jours après la Pâque.
- source_word: πάντες
  choice: tous
  rationale: Le mot englobe la totalité du groupe évoqué dans le contexte précédent.
- source_word: ὁμοῦ
  choice: ensemble
  rationale: L’adverbe exprime le fait que les membres du groupe se trouvent réunis.
- source_word: ἐπὶ τὸ αὐτό
  choice: au même endroit
  rationale: Dans ce contexte, l’expression peut signifier « au même endroit » ou « ensemble ». Le choix locatif préserve une nuance distincte puisque ὁμοῦ est déjà rendu par « ensemble ».
theological_decisions:
- issue: Identité du sujet sous-entendu de ἦσαν
  choice: ils étaient tous ensemble au même endroit
  alternative: tous étaient ensemble au même endroit
  rationale: Le grec ne répète pas le sujet, qui se déduit du contexte précédent. Le pronom « ils » assure une narration naturelle en français sans préciser davantage l’identité du groupe.
- issue: Portée de συμπληροῦσθαι appliqué au jour de la Pentecôte
  choice: quand le jour de la Pentecôte fut arrivé
  alternative: alors que le jour de la Pentecôte s’accomplissait
  rationale: La traduction principale comprend l’expression comme la venue du jour fixé, sans lui donner artificiellement un sens doctrinal. La note signale la formulation plus littérale et sa nuance progressive, qui pourrait autrement être comprise comme la fin de la journée.
translation_notes:
  register: Français international moderne, clair et digne. « Fut arrivé » garde une légère solennité narrative adaptée au récit biblique, tandis que « tous ensemble au même endroit » rend distinctement les deux expressions grecques de rassemblement et de localisation.
