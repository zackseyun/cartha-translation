id: ACT.2.33
reference: Acts 2:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: fr
  text: Ainsi donc, élevé à la droite de Dieu[a] et ayant reçu du Père la promesse de l’Esprit Saint[b], il a répandu ce que vous-mêmes voyez et entendez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « élevé par la main droite de Dieu ». Le datif grec peut indiquer soit la position à laquelle Jésus a été élevé, soit le moyen par lequel il l’a été.
    reason: alternative_reading
  - marker: b
    text: Cette expression peut désigner soit l’Esprit Saint lui-même en tant que don promis, soit la promesse concernant l’Esprit Saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: à la droite de Dieu
  rationale: Le datif se comprend probablement ici dans un sens local, en accord avec le motif d’intronisation développé dans le contexte; le sens instrumental reste possible et figure en note.
- source_word: οὖν
  choice: Ainsi donc
  rationale: Cette formulation française marque naturellement la conséquence tirée de l’argument précédent.
- source_word: ὑψωθεὶς
  choice: élevé
  rationale: Le participe aoriste passif exprime l’action de Dieu qui élève Jésus; «élevé» convient au langage d’exaltation et d’intronisation sans lourdeur.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: la promesse de l’Esprit Saint
  rationale: 'La formulation conserve au plus près l’ambiguïté du génitif grec: il peut s’agir de l’Esprit comme don promis ou de la promesse qui le concerne.'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: ayant reçu du Père
  rationale: Le participe indique une action antérieure à l’effusion, et παρά avec le génitif désigne la source.
- source_word: ἐξέχεεν
  choice: il a répandu
  rationale: Le passé composé rend naturellement en français l’acte accompli dont les manifestations sont présentes.
- source_word: τοῦτο ὃ
  choice: ce que
  rationale: La tournure idiomatique française «ce que» restitue le démonstratif suivi du relatif sans ajouter un référent absent du grec.
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: vous-mêmes voyez et entendez
  rationale: «Vous-mêmes» préserve l’emphase du pronom grec explicite, tandis que les présents rendent la perception immédiate de l’auditoire.
theological_decisions:
- issue: Sens local ou instrumental de τῇ δεξιᾷ τοῦ θεοῦ
  choice: à la droite de Dieu
  alternative: par la droite de Dieu
  rationale: Le contexte immédiat, notamment la citation du Psaume 110, favorise l’exaltation à la place d’honneur auprès de Dieu. Le datif grec autorisant toutefois le sens instrumental, celui-ci est conservé en note.
- issue: Rapport entre «promesse» et «Esprit Saint»
  choice: la promesse de l’Esprit Saint
  alternative: l’Esprit Saint promis
  rationale: 'La traduction principale préserve la construction grecque et sa tension: le génitif peut désigner la promesse concernant l’Esprit ou l’Esprit lui-même comme don promis. La note expose explicitement cette possibilité sans la trancher.'
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression du grec tout en évitant une accumulation pesante de participes. Les deux ambiguïtés importantes du texte source sont signalées par des notes dont les marqueurs figurent dans le texte.
