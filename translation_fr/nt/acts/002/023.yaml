  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: fr
  text: Cet homme, livré selon le dessein arrêté et la prescience de Dieu, vous l’avez tué en le clouant à une croix par l’intermédiaire d’hommes sans loi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « par la main d’hommes sans loi ». Le grec emploie le singulier « main » dans une expression d’intermédiaire ou d’action. Autre traduction possible : « par les mains d’hommes sans loi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Cet homme
  rationale: Le démonstratif accusatif désigne Jésus dans le discours de Pierre. « Cet homme » conserve sa force déictique dans un français naturel.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: conformément au dessein arrêté
  rationale: Le datif indique ici la conformité ou le fondement. « Dessein arrêté » exprime une décision établie sans recourir à un archaïsme.
- source_word: καὶ προγνώσει
  choice: et à la connaissance anticipée
  rationale: πρόγνωσις désigne une connaissance préalable. Cette formulation française reste claire tout en évitant d’imposer une interprétation systématique du rapport entre connaissance et décret.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif dépend à la fois du dessein arrêté et de la connaissance anticipée.
- source_word: ἔκδοτον
  choice: livré
  rationale: Le terme signifie remis ou livré. « Livré » convient au registre solennel et ne précise pas au-delà du grec l’agent de cette remise.
- source_word: διὰ χειρὸς ἀνόμων
  choice: par la main d’hommes sans loi
  rationale: διά avec le génitif marque l’intermédiaire ou l’agent. Le singulier collectif « la main » reproduit χείρ, et « hommes sans loi » conserve la portée de ἄνομοι, qui peut évoquer aussi bien l’absence de la Loi que la transgression.
- source_word: προσπήξαντες
  choice: en le clouant à une croix
  rationale: Le participe signifie fixer ou clouer; le contexte d’exécution justifie la mention explicite de la croix.
- source_word: ἀνείλατε
  choice: vous l’avez tué
  rationale: ἀναιρέω signifie ici tuer ou mettre à mort. Cette traduction garde la force directe de l’accusation adressée aux auditeurs.
theological_decisions:
- issue: Rapport entre la souveraineté divine et la responsabilité humaine
  choice: Maintenir ensemble le dessein arrêté et la connaissance anticipée de Dieu, ainsi que l’accusation directe « vous l’avez tué »
  alternative: Atténuer soit la détermination divine, soit la responsabilité des auditeurs en attribuant l’acte uniquement aux hommes sans loi
  rationale: Le grec affirme simultanément que Jésus a été livré conformément au dessein et à la connaissance anticipée de Dieu et que les auditeurs sont responsables de sa mort. La traduction conserve cette tension sans la résoudre selon un système théologique particulier.
- issue: Portée de ἀνόμων
  choice: hommes sans loi
  alternative: hors-la-loi; impies; païens
  rationale: « Hommes sans loi » préserve l’ambiguïté entre ceux qui n’ont pas la Loi et ceux qui agissent contre elle, sans identifier explicitement les acteurs comme païens ni réduire le terme à une qualification morale générale.
translation_notes:
  register: Français international moderne, direct et digne. La phrase conserve la structure accusatrice du discours de Pierre et le singulier imagé du grec, tout en explicitant la crucifixion par « une croix ».
