  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: fr
  text: jusqu’à ce que je fasse de tes ennemis un marchepied pour tes pieds[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette parole reprend le Psaume 110.1, un texte royal associé à l’intronisation du roi et à l’attente messianique.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: jusqu’à ce que
  rationale: Cette tournure rend naturellement en français la limite temporelle future exprimée par ἕως ἂν.
- source_word: θῶ
  choice: je fasse de
  rationale: Le verbe τίθημι signifie littéralement « mettre, placer » ; avec le complément prédicatif ὑποπόδιον, « faire de… un marchepied » restitue clairement et naturellement la construction.
- source_word: τοὺς ἐχθρούς σου
  choice: tes ennemis
  rationale: Traduction directe qui conserve à la fois la dimension personnelle et l’image d’opposition royale du psaume cité.
- source_word: ὑποπόδιον
  choice: un marchepied
  rationale: « Marchepied » est le terme français courant qui préserve l’image concrète de soumission.
- source_word: τῶν ποδῶν σου
  choice: pour tes pieds
  rationale: Le génitif appartient à l’expression « marchepied des/pour les pieds » ; « pour tes pieds » est naturel en français moderne sans expliciter davantage l’image.
theological_decisions:
- issue: Image royale de soumission dans la citation du Psaume 110.1
  choice: Conserver l’image concrète « un marchepied pour tes pieds ».
  alternative: jusqu’à ce que je soumette entièrement tes ennemis sous tes pieds
  rationale: La métaphore du texte source porte la force royale et messianique de la citation. La garder évite de remplacer l’image par son interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la métaphore concrète et la structure de la citation tout en évitant le tour moins idiomatique « marchepied de tes pieds ».
