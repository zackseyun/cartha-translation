id: ACT.2.32
reference: Acts 2:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: fr
  text: Ce Jésus, Dieu l’a ressuscité[a] ; nous en sommes tous témoins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’a relevé ». Ici, le verbe grec désigne la résurrection.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: Ce Jésus
  rationale: Le démonstratif τοῦτον désigne avec insistance Jésus, qui vient d’être mentionné. « Ce Jésus » en conserve naturellement la valeur déictique en français.
- source_word: ἀνέστησεν
  choice: l’a ressuscité
  rationale: Dans ce contexte, le verbe transitif ἀνίστημι désigne sans ambiguïté l’action de relever Jésus d’entre les morts. « Ressusciter » exprime ce sens clairement tout en gardant Dieu comme sujet agissant.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Le sujet explicite du grec est conservé sans ajout.
- source_word: οὗ
  choice: en
  rationale: Avec « témoins », le pronom relatif au génitif renvoie à Jésus et, contextuellement, à sa résurrection. La tournure française idiomatique « nous en sommes témoins » préserve cette relation sans la préciser davantage que le grec.
- source_word: πάντες ἡμεῖς
  choice: nous ... tous
  rationale: La combinaison emphatique πάντες ἡμεῖς est rendue par « nous ... tous », ordre naturel qui conserve l’insistance sur l’ensemble des témoins.
- source_word: ἐσμεν μάρτυρες
  choice: sommes ... témoins
  rationale: Le nom μάρτυρες est rendu comme un nom, « témoins », plutôt que par une forme verbale.
theological_decisions:
- issue: Formulation de la résurrection
  choice: Dieu l’a ressuscité
  alternative: Dieu l’a relevé
  rationale: Le texte attribue directement à Dieu la résurrection de Jésus. « Ressuscité » communique nettement le sens contextuel de ἀνέστησεν sans ajouter d’explication doctrinale.
- issue: Référent de οὗ
  choice: nous en sommes tous témoins
  alternative: nous sommes tous ses témoins
  rationale: Le génitif peut grammaticalement renvoyer à Jésus, tandis que le contexte met au premier plan sa résurrection. Le pronom « en » garde cette légère souplesse référentielle, contrairement à « ses témoins », qui orienterait plus exclusivement vers la personne.
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « Ce Jésus, Dieu l’a ressuscité » conserve la mise en relief du démonstratif grec tout en restant naturelle. Le point-virgule marque le lien étroit entre la résurrection proclamée et le témoignage apostolique.
