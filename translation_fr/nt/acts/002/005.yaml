  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: fr
  text: Des Juifs[a] résidaient à Jérusalem, des hommes pieux originaires de toutes les nations sous le ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Judéens ». Ici, le contexte favorise « Juifs », au sens ethnoreligieux large, puisqu’ils sont originaires de toutes les nations sous le ciel.
    reason: alternative_reading
  - marker: b
    text: « Sous le ciel » est une expression biblique qui signifie « dans le monde entier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Il y avait
  rationale: La tournure existentielle rend naturellement ἦσαν en français. La faible valeur connective de δέ est laissée au contexte plutôt que renforcée par « or » ou « alors ».
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: qui y résidaient à Jérusalem
  rationale: Dans la phrase publiée, « à Jérusalem » précède le groupe nominal et le pronom « y » reprend ce lieu. « Résidaient » exprime une habitation durable sans suggérer un simple séjour temporaire.
- source_word: Ἰουδαῖοι
  choice: Juifs
  rationale: La provenance de toutes les nations favorise ici le sens ethnoreligieux large plutôt que le seul sens régional « Judéens ».
- source_word: ἄνδρες εὐλαβεῖς
  choice: des hommes pieux
  rationale: ἄνδρες est explicitement masculin, et εὐλαβεῖς décrit des hommes respectueux de Dieu et attachés à la piété.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: originaires de toutes les nations
  rationale: « Originaires de » exprime la provenance indiquée par ἀπό. Le pluriel français idiomatique « toutes les nations » rend la portée distributive de παντὸς ἔθνους.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: sous le ciel
  rationale: La formulation conserve l’image biblique tout en restant compréhensible en français moderne.
theological_decisions:
- issue: Sens de Ἰουδαῖοι
  choice: Juifs
  alternative: Judéens
  rationale: Le contexte présente ces personnes comme originaires de toutes les nations; il s’agit donc très probablement de Juifs de la diaspora plutôt que seulement d’habitants de la Judée. Une note conserve néanmoins l’autre valeur possible du terme.
- issue: Portée masculine de ἄνδρες
  choice: hommes
  alternative: personnes
  rationale: Le grec emploie ἀνήρ, nom spécifiquement masculin, et non un terme humain générique. La traduction conserve cette précision sans extrapoler au-delà du texte.
- issue: Portée de « toutes les nations sous le ciel »
  choice: conservation de l’expression universelle idiomatique
  alternative: du monde entier
  rationale: La traduction préserve la force rhétorique et l’image du texte, tandis qu’une note précise qu’il s’agit d’une expression biblique désignant le monde entier, sans imposer une lecture géographique techniquement exhaustive.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la précision masculine de ἄνδρες, l’idée de résidence durable portée par κατοικοῦντες et l’expression biblique « sous le ciel ». Les marqueurs de notes sont placés immédiatement après les expressions concernées.
