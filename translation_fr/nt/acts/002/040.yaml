source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: fr
  text: 'Par de nombreuses autres paroles, il leur rendit un témoignage solennel et ne cessait de les exhorter en disant : « Soyez sauvés[a] de cette génération tortueuse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sauvez-vous de cette génération tortueuse. » Le verbe grec est au passif (« soyez sauvés »), mais l’impératif appelle néanmoins les auditeurs à répondre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: Par beaucoup d’autres paroles encore
  rationale: Cette formulation naturelle conserve à la fois l’idée d’autres paroles et celle de leur grand nombre, tout en indiquant que Pierre poursuivit son discours.
- source_word: διεμαρτύρατο
  choice: il rendit solennellement témoignage
  rationale: Le verbe exprime un témoignage appuyé ou solennel. Cette traduction en préserve la force sans le réduire à un simple avertissement.
- source_word: παρεκάλει
  choice: les exhortait avec insistance
  rationale: L’imparfait grec présente une action prolongée ou répétée. « Avec insistance » rend cette valeur tout en conservant la force exhortative de παρακαλέω.
- source_word: Σώθητε
  choice: Soyez sauvés
  rationale: L’impératif grec est passif. Le français garde cette voix afin de préserver la tension entre le salut reçu et l’appel réel adressé aux auditeurs.
- source_word: ἀπὸ
  choice: de
  rationale: La préposition exprime ici la séparation ou la délivrance par rapport à la génération désignée.
- source_word: γενεᾶς
  choice: génération
  rationale: Le terme peut désigner les contemporains de Pierre. « Génération » en conserve la forme lexicale et la résonance biblique.
- source_word: σκολιᾶς
  choice: tortueuse
  rationale: « Tortueuse » maintient l’image morale de ce qui n’est pas droit, plutôt que de la remplacer par une qualification abstraite comme « perverse ».
theological_decisions:
- issue: Voix et agent dans Σώθητε
  choice: Soyez sauvés
  alternative: Sauvez-vous
  rationale: La forme grecque est passive et ne présente pas explicitement les auditeurs comme les auteurs de leur propre salut. L’impératif demeure néanmoins un véritable appel à répondre; la traduction conserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme distingue l’acte solennel de témoignage de l’exhortation prolongée. « Génération tortueuse » conserve volontairement la métaphore du grec, malgré son caractère légèrement plus marqué en français courant.
