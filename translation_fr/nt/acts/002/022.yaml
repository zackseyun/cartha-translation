id: ACT.2.22
reference: Acts 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: fr
  text: 'Hommes d’Israël, écoutez ces paroles : Jésus le Nazaréen[a], un homme que Dieu a accrédité auprès de vous par des miracles[b], des prodiges et des signes que Dieu a accomplis par son intermédiaire au milieu de vous, comme vous le savez vous-mêmes —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus de Nazareth » ou « Jésus le Nazoréen ». Le titre grec Ναζωραῖος admet plusieurs rendus naturels en français.
    reason: lexical_alternative
  - marker: b
    text: Ou « des actes de puissance ». Le grec δυνάμεσι peut être rendu plus littéralement par une expression évoquant des manifestations de puissance, ou, dans ce contexte, par « miracles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Hommes d’Israël
  rationale: Le vocatif ἄνδρες est explicitement masculin et Ἰσραηλῖται désigne les Israélites. « Hommes d’Israël » conserve l’adresse directe et correspond à un français biblique digne encore intelligible.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: écoutez ces paroles
  rationale: L’impératif appelle l’auditoire à prêter attention. « Écoutez » est plus naturel en français actuel que « entendez », tandis que « ces paroles » reste proche de λόγους τούτους.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jésus le Nazaréen
  rationale: Ναζωραῖος est un qualificatif lié à l’origine ou à l’identité de Jésus. « Le Nazaréen » en conserve la forme descriptive sans imposer la paraphrase géographique « de Nazareth ».
- source_word: ἄνδρα
  choice: un homme
  rationale: Le grec désigne explicitement un homme. Cette formulation préserve l’affirmation de l’humanité réelle de Jésus sans tirer de conclusion au-delà du texte.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: dont Dieu vous a montré l’authenticité
  rationale: ἀποδείκνυμι exprime ici une démonstration ou une attestation publique. Cette tournure française rend Dieu comme source et agent de la validation, et εἰς ὑμᾶς comme orienté vers les auditeurs.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: par des actes puissants, des prodiges et des signes
  rationale: « Actes puissants » rend le sens concret de δυνάμεις sans réduire d’emblée le terme à la catégorie française de « miracles ». La triple série du grec est conservée.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: qu’il a accomplis par son intermédiaire
  rationale: Dans la phrase française, le pronom sujet renvoie sans ambiguïté à Dieu, déjà nommé, et « par son intermédiaire » rend δι’ αὐτοῦ en maintenant Jésus comme agent médiateur.
- source_word: ἐν μέσῳ ὑμῶν
  choice: au milieu de vous
  rationale: La locution garde l’image spatiale du grec tout en signifiant naturellement « parmi vous ».
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: comme vous le savez vous-mêmes
  rationale: « Vous-mêmes » préserve l’insistance portée par αὐτοί.
theological_decisions:
- issue: Formulation christologique de ἄνδρα
  choice: Conserver « un homme » dans le texte principal
  alternative: « une personne » ou omission du nom
  rationale: ἄνδρα est explicite. Le verset affirme l’humanité de Jésus et l’attestation donnée par Dieu, sans que la traduction doive atténuer cette formulation ni résoudre la christologie plus large du Nouveau Testament.
- issue: Agent des actes puissants
  choice: Faire de Dieu le sujet des actes accomplis par l’intermédiaire de Jésus
  alternative: Faire de Jésus seul le sujet implicite des miracles
  rationale: Le grec nomme ὁ θεός comme sujet et marque Jésus par δι’ αὐτοῦ comme intermédiaire. La traduction conserve cette articulation et la tension théologique propre au verset.
- issue: Sens de l’attestation divine
  choice: « dont Dieu vous a montré l’authenticité »
  alternative: « approuvé par Dieu » ou « accrédité par Dieu »
  rationale: Cette formulation exprime une démonstration publique fondée sur les œuvres sans importer une notion institutionnelle d’accréditation ni réduire ἀποδεδειγμένον à une simple approbation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve le mouvement de la longue phrase grecque et le tiret final, puisque le discours se poursuit au verset suivant. « Hommes d’Israël » maintient l’adresse masculine explicite; « actes puissants » conserve la nuance de δύναμις tout en restant compréhensible.
