id: ACT.2.41
reference: Acts 2:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: fr
  text: Ainsi, ceux qui accueillirent sa parole furent baptisés et, ce jour-là, environ trois mille personnes[a] furent ajoutées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « âmes ». En grec, ce mot peut servir à compter des êtres humains, au sens de « personnes ».'
    reason: Précision lexicale visant à conserver la forme grecque tout en évitant une lecture anthropologique trop technique.
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: Ainsi, ceux qui
  rationale: « Ainsi » marque naturellement en français la progression et la conséquence du récit, sans donner aux particules une valeur logique excessivement appuyée.
- source_word: ἀποδεξάμενοι
  choice: accueillirent
  rationale: Le verbe indique une réception favorable de la proclamation. « Accueillirent » exprime cette réponse positive sans préciser davantage sa nature.
- source_word: τὸν λόγον αὐτοῦ
  choice: sa parole
  rationale: Ici, λόγος désigne le message proclamé par Pierre. « Sa parole » reste proche du grec et demeure intelligible dans le contexte immédiat.
- source_word: ἐβαπτίσθησαν
  choice: furent baptisés
  rationale: Le passif rend directement l’événement rapporté, sans introduire de précision confessionnelle sur le mode ou l’effet du baptême.
- source_word: προσετέθησαν
  choice: furent ajoutées
  rationale: Le passif grec est conservé et son complément demeure implicite, comme dans le texte source. Le contexte indique l’intégration à la communauté, mais le verset ne la nomme pas explicitement.
- source_word: ψυχαὶ
  choice: personnes
  rationale: Dans ce dénombrement, ψυχαί désigne des êtres humains. « Personnes » transmet naturellement cet emploi en français moderne, tandis que la forme littérale « âmes » est signalée en note afin de préserver la transparence lexicale sans suggérer à tort une affirmation anthropologique technique.
- source_word: ὡσεὶ τρισχίλιαι
  choice: environ trois mille
  rationale: ὡσεί exprime une approximation, rendue de façon courante et exacte par « environ ».
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ce jour-là
  rationale: Cette tournure est l’équivalent temporel idiomatique en français.
theological_decisions:
- issue: Faut-il expliciter à qui ou à quoi ces personnes furent ajoutées ?
  choice: 'Le complément reste implicite : « furent ajoutées »'
  alternative: « furent ajoutées à leur nombre » ou « furent ajoutées à l’Église »
  rationale: Le contexte suggère l’intégration à la communauté des croyants, mais le grec de ce verset n’énonce aucun complément. Ne pas l’ajouter évite de préciser davantage l’ecclésiologie du passage.
- issue: Portée anthropologique de ψυχαί
  choice: « personnes » dans le texte, avec « âmes » en note
  alternative: « âmes » dans le texte principal
  rationale: Dans ce contexte, le pluriel sert couramment à compter des êtres humains. « Personnes » rend ce sens sans faire de ψυχή un terme technique désignant une partie immatérielle de l’être humain; la note conserve néanmoins la forme littérale et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le passif et l’absence de complément de προσετέθησαν malgré une légère solennité, afin de ne pas ajouter au texte. Le choix de « personnes » évite l’emploi comptable aujourd’hui archaïque ou potentiellement trompeur de « âmes ».
