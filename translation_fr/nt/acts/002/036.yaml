  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: fr
  text: Que toute la maison d’Israël sache donc avec certitude que Dieu a fait de lui Seigneur et Messie, ce Jésus que vous avez crucifié.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ ». Le titre grec Χριστός (Christos) est rendu ici par « Messie » afin de préserver son sens de titre dans le discours que Pierre adresse à Israël.
    reason: alternative_reading
  - marker: b
    text: Dans le contexte du discours, « Dieu a fait de lui Seigneur et Messie » se rapporte à l’élévation de Jésus par Dieu. La formulation ne précise pas à elle seule comment ces titres se rapportent à son identité antérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: avec certitude
  rationale: Cette locution adverbiale naturelle exprime pleinement l’assurance demandée par Pierre.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement la conclusion tirée de l’argument précédent sur la résurrection et l’élévation de Jésus.
- source_word: γινωσκέτω
  choice: Que … sache
  rationale: Le subjonctif d’injonction rend naturellement en français l’impératif grec à la troisième personne du singulier, dont le sujet collectif est toute la maison d’Israël.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: toute la maison d’Israël
  rationale: Cette formulation conserve l’expression biblique collective et demeure compréhensible en français moderne.
- source_word: κύριον
  choice: Seigneur
  rationale: Le titre exprime ici l’autorité élevée de Jésus et fait écho au contexte scripturaire précédent; « maître » serait trop faible.
- source_word: χριστόν
  choice: Messie
  rationale: Dans le discours adressé à Israël, le mot grec fonctionne nettement comme un titre messianique plutôt que comme un nom propre.
- source_word: ἐποίησεν
  choice: l’a fait
  rationale: Le passé composé rend naturellement l’acte accompli dont la portée demeure présente et conserve le sens direct du verbe grec sans le remplacer par une interprétation telle que « établi ».
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ce Jésus
  rationale: La formulation garde la valeur démonstrative et emphatique qui désigne le Jésus historique précis dont parle Pierre.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: que vous avez crucifié
  rationale: Traduction directe et idiomatique qui maintient l’adresse accusatrice à l’auditoire.
theological_decisions:
- issue: Sens de « Dieu l’a fait Seigneur et Messie »
  choice: Conserver « l’a fait » dans le texte et préciser en note que le contexte concerne l’élévation et l’établissement publics de Jésus dans ces fonctions.
  alternative: Traduire « l’a établi » ou comprendre la phrase comme un changement de sa nature.
  rationale: Le grec ἐποίησεν appelle une traduction directe. Le contexte de résurrection et d’élévation éclaire l’acte évoqué, sans que la traduction doive résoudre davantage la tension christologique du verset.
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: L’adresse à toute la maison d’Israël met au premier plan le sens du titre attendu; une note signale néanmoins l’équivalent traditionnel « Christ ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’injonction solennelle et l’expression biblique collective « maison d’Israël », sans archaïsme inutile.
