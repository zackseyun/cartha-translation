id: ACT.2.6
reference: Acts 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: fr
  text: Quand ce bruit se fit entendre, la foule se rassembla et fut déconcertée, car chacun les entendait parler dans sa propre langue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son propre dialecte ». Le mot grec peut désigner une langue ou un parler régional.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ τῆς φωνῆς ταύτης
  choice: Quand ce bruit se fit entendre
  rationale: Le génitif absolu exprime ici la circonstance temporelle. φωνή peut désigner une voix, un son ou un bruit ; dans ce contexte, « bruit » renvoie naturellement au phénomène audible du verset précédent, tandis que « se fit entendre » donne une tournure française courante sans en préciser davantage la nature.
- source_word: συνῆλθε τὸ πλῆθος
  choice: la foule se rassembla
  rationale: Cette formulation rend directement le mouvement de la multitude vers un même lieu, dans un français actuel et naturel.
- source_word: συνεχύθη
  choice: fut déconcertée
  rationale: Le passif de συγχέω exprime la confusion et le trouble. « Fut déconcertée » rend la désorientation de la foule sans suggérer nécessairement un tumulte extérieur.
- source_word: ἤκουον εἷς ἕκαστος
  choice: chacun les entendait
  rationale: « Chacun » conserve la valeur distributive appuyée de εἷς ἕκαστος, et l’imparfait « entendait » reflète l’aspect continu de ἤκουον.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: dans sa propre langue
  rationale: διάλεκτος peut désigner une langue ou une variété linguistique régionale. En français moderne, « dialecte » risquerait d’évoquer seulement une forme locale subordonnée à une langue ; « sa propre langue » communique donc plus clairement le sens contextuel, tout en signalant l’alternative littérale en note.
- source_word: λαλούντων αὐτῶν
  choice: les entendait parler
  rationale: Le pronom reprend les personnes qui parlaient dans le contexte immédiat. La traduction conserve ce référent pronominal sans l’identifier plus étroitement que ne le fait le verset.
theological_decisions:
- issue: Identification des personnes qui parlent
  choice: les entendait parler
  alternative: entendait les apôtres parler
  rationale: Le grec emploie simplement αὐτῶν, « eux », et ne nomme pas ici les apôtres. Le maintien du pronom évite d’imposer une identification plus précise que celle du texte.
- issue: Valeur de διάλεκτος
  choice: sa propre langue
  alternative: son propre dialecte
  rationale: 'Le choix de « langue » ne tranche pas la nature miraculeuse du phénomène au-delà de ce qu’affirme le récit : chaque auditeur reconnaît son propre parler. La note préserve la nuance lexicale plus étroite possible.'
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe distributive est conservée avec « chacun… sa propre langue », et l’imparfait maintient la perception continue exprimée par le grec.
