source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: fr
  text: 'En effet, David dit à son sujet : « Je gardais[a] constamment le Seigneur[b] devant moi, car il est à ma droite, afin que je ne sois pas ébranlé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Je voyais d’avance le Seigneur devant moi en tout temps. » Le verbe grec peut signifier « voir d’avance », mais les expressions qui l’accompagnent ici favorisent l’idée de garder constamment le Seigneur devant soi.'
    reason: lexical_alternative
  - marker: b
    text: Pierre cite le Psaume 16.8. Dans le texte hébreu du psaume, le titre divin sous-jacent est le nom propre de Dieu, souvent rendu par « l’Éternel » ou « le SEIGNEUR » dans les traductions françaises.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: dit à son sujet
  rationale: Dans cette formule d’introduction, εἰς αὐτόν signifie que David parle au sujet de la personne en question, et non qu’il s’adresse directement à elle.
- source_word: Προορώμην
  choice: Je gardais ... devant moi
  rationale: L’imparfait exprime une action continue ou habituelle. Avec ἐνώπιόν μου et διὰ παντός, le verbe évoque ici le fait de maintenir constamment le Seigneur devant son regard plutôt qu’une prévision.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Cette traduction suit directement le grec κύριον sans préciser dans le corps du texte l’identité du référent.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: constamment ... devant moi
  rationale: La formulation française conserve l’image relationnelle et spatiale tout en exprimant clairement la continuité.
- source_word: ἐκ δεξιῶν μού
  choice: à ma droite
  rationale: Équivalent français naturel de l’expression désignant la présence proche, souvent associée au soutien et à la protection.
- source_word: ἵνα μὴ σαλευθῶ
  choice: afin que je ne sois pas ébranlé
  rationale: « Afin que » conserve la valeur de but ou de résultat de ἵνα, tandis qu’« ébranlé » maintient la métaphore de la stabilité.
theological_decisions:
- issue: Référent du « Seigneur » dans la citation du psaume telle que Pierre l’emploie
  choice: Conserver « le Seigneur » sans identifier davantage le référent dans le texte
  alternative: « l’Éternel » ou « le Messie »
  rationale: Pierre applique le psaume dans une argumentation christologique, tandis que la citation grecque porte κύριον. La traduction préserve cette tension sans imposer une identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Je gardais constamment le Seigneur devant moi » restitue naturellement l’aspect duratif de l’imparfait grec sans donner au verbe un sens prédictif certain. Les marqueurs de note sont placés après les segments auxquels ils se rapportent.
