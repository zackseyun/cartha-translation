id: ACT.2.28
reference: Acts 2:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: fr
  text: Tu m’as fait connaître les chemins de la vie[a] ; tu me rempliras de joie en ta présence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les voies de la vie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec ton visage », c’est-à-dire « en ta présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: Tu m’as fait connaître
  rationale: L’aoriste actif est rendu naturellement par le passé composé en français moderne. Le pronom « m’ » exprime sans lourdeur le datif μοι.
- source_word: ὁδοὺς ζωῆς
  choice: les chemins de la vie
  rationale: « Chemins » conserve le pluriel et l’image concrète de ὁδός. « De la vie » maintient l’ambiguïté du génitif, qui peut évoquer des chemins caractérisés par la vie ou conduisant à elle.
- source_word: πληρώσεις με
  choice: tu me rempliras
  rationale: Le futur simple correspond directement au futur actif grec, et le pronom « me » rend l’objet με.
- source_word: εὐφροσύνης
  choice: de joie
  rationale: Après « remplir », le français demande naturellement « de ». « Joie » exprime clairement l’allégresse ou la réjouissance portée par εὐφροσύνη.
- source_word: μετὰ τοῦ προσώπου σου
  choice: en ta présence
  rationale: Littéralement « avec ton visage », cette expression désigne idiomatiquement la présence personnelle. « En ta présence » est naturel, digne et fidèle au sens, tandis que la note conserve l’image source.
theological_decisions:
- issue: Expression de la présence divine dans la citation du Psaume
  choice: en ta présence
  alternative: avec ton visage / devant ta face
  rationale: La formulation choisie transmet clairement la joie éprouvée dans la présence immédiate de Dieu, sans imposer une interprétation doctrinale supplémentaire. La note signale la forme littérale et préserve l’image théologique du visage.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse directe à Dieu dans la citation. La ponctuation conserve le parallélisme poétique des deux propositions.
