source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: fr
  text: Juifs et prosélytes, Crétois et Arabes, nous les entendons parler dans nos propres langues[a] des œuvres grandioses de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « langues ». Le mot grec peut désigner la langue comme organe de la parole ou une langue; ici, le contexte indique des langues humaines reconnaissables.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: Juifs
  rationale: Dans cette liste de peuples présents à Jérusalem, le terme désigne les membres du peuple juif plutôt que les seuls habitants de la Judée.
- source_word: τε καὶ
  choice: et
  rationale: Le français coordonne naturellement « Juifs et prosélytes »; une tournure comme « tant… que… » alourdirait ce fragment de liste.
- source_word: προσήλυτοι
  choice: prosélytes
  rationale: Terme précis et établi pour les non-Juifs ralliés au judaïsme; « convertis » serait moins spécifique.
- source_word: Κρῆτες καὶ Ἄραβες
  choice: Crétois et Arabes
  rationale: Désignations françaises modernes et usuelles des habitants de la Crète et des peuples arabes.
- source_word: ἀκούομεν λαλούντων αὐτῶν
  choice: nous les entendons parler
  rationale: Cette construction française rend naturellement le verbe de perception suivi du participe grec, sans préciser davantage la manière de parler.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: dans nos propres langues
  rationale: Le contexte immédiat présente des langues humaines reconnues par les auditeurs; « propres » conserve l'insistance de ἡμετέραις.
- source_word: τὰ μεγαλεῖα τοῦ θεοῦ
  choice: des œuvres grandioses de Dieu
  rationale: L'expression désigne les actes remarquables et puissants de Dieu. « Œuvres grandioses » reste digne et intelligible sans réduire le sens aux seuls miracles.
theological_decisions:
- issue: Sens de γλώσσαις dans le récit de la Pentecôte
  choice: langues humaines reconnaissables
  alternative: paroles extatiques ou langues non humaines
  rationale: Le contexte souligne que des personnes venues de diverses régions reconnaissent chacune leur propre langue. La traduction suit cette valeur contextuelle sans trancher les débats plus larges sur le parler en langues.
translation_notes:
  register: Français international moderne, digne et accessible. « Prosélytes » conserve la précision historique; « œuvres grandioses » restitue la force de μεγαλεῖα sans employer une formulation archaïque.
