id: ACT.2.38
reference: Acts 2:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: fr
  text: 'Pierre leur dit : « Repentez-vous, et que chacun de vous soit baptisé au nom de Jésus le Messie[a], pour le pardon de vos péchés[b] ; et vous recevrez le don du Saint-Esprit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou par « Christ » ; ici, « Messie » fait ressortir le sens du titre dans la proclamation de Pierre.
    reason: alternative_reading
  - marker: b
    text: L’expression « pour le pardon de vos péchés » traduit directement le grec. Les interprètes comprennent de diverses manières le rapport entre le baptême et le pardon dans ce passage ; la traduction ne tranche pas ce débat au-delà de la formulation du texte.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: Repentez-vous
  rationale: L’impératif aoriste pluriel appelle à une réponse décisive. « Repentez-vous » conserve de façon concise les dimensions intérieure, morale et pratique du verbe, sans le réduire à un simple changement d’avis.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: que chacun de vous soit baptisé
  rationale: 'Cette formulation rend l’impératif passif à la troisième personne et préserve la valeur distributive de ἕκαστος : l’appel adressé au groupe concerne chacun personnellement.'
- source_word: ἐπὶ τῷ ὀνόματι
  choice: au nom de
  rationale: Expression française naturelle dans ce contexte. Elle laisse ouvertes les nuances possibles de fondement, d’autorité et de confession attachées à la préposition ἐπί avec le datif.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Dans la proclamation de Pierre, Χριστός conserve sa portée de titre messianique. L’article français rend ce titre de manière idiomatique, bien qu’il ne corresponde pas à un article grec explicite.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: pour le pardon de vos péchés
  rationale: Cette traduction directe et naturelle conserve l’orientation exprimée par εἰς ainsi que le pluriel « péchés », sans préciser davantage le rapport entre baptême et pardon.
- source_word: λήμψεσθε τὴν δωρεὰν
  choice: vous recevrez le don
  rationale: Le futur exprime une promesse. « Le don » suffit à rendre δωρεά, dont le caractère gratuit est déjà inhérent au nom grec.
- source_word: τοῦ ἁγίου πνεύματος
  choice: du Saint-Esprit
  rationale: Formulation française contemporaine consacrée, claire et digne.
theological_decisions:
- issue: Rapport entre le baptême et le pardon dans εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: pour le pardon de vos péchés
  alternative: afin que vos péchés soient pardonnés ; en raison du pardon de vos péchés
  rationale: La traduction suit directement le grec tout en évitant de trancher les débats confessionnels sur l’efficacité, la fonction ou la chronologie du baptême par rapport au pardon.
- issue: Traduction de Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Le contexte immédiat de la proclamation en Actes 2 maintient nettement la valeur titulaire de Χριστός. « Le Messie » en explicite le sens sans introduire une doctrine particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe impérative reste proche du grec sans être pesante. Le point-virgule clarifie le passage de l’appel à la promesse, et « alors » rend naturellement l’enchaînement de καί sans imposer à lui seul une analyse causale précise.
