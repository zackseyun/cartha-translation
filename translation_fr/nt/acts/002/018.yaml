id: ACT.2.18
reference: Acts 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: fr
  text: Même sur mes esclaves, hommes et femmes[a], en ces jours-là, je répandrai de mon Esprit[b], et ils prophétiseront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur mes serviteurs et mes servantes ». Les termes grecs peuvent désigner des serviteurs ou des esclaves ; « esclaves » souligne ici leur statut social inférieur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « depuis mon Esprit » ou « à partir de mon Esprit » ; le grec emploie une préposition marquant la provenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: Même
  rationale: La combinaison καί γε renforce l’énoncé précédent. « Même » en restitue naturellement la portée emphatique et inclusive.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: sur mes esclaves, hommes et femmes
  rationale: δοῦλος et δούλη désignent ici explicitement les esclaves des deux sexes. Cette formulation française reste naturelle, marque les deux groupes et conserve l’accent mis sur leur statut social inférieur.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: en ces jours-là
  rationale: Formulation temporelle idiomatique qui conserve la valeur démonstrative du grec.
- source_word: ἐκχεῶ
  choice: je répandrai
  rationale: Le futur de ἐκχέω exprime l’image d’un liquide versé avec abondance. « Répandre » est naturel dans ce contexte en français biblique moderne.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: de mon Esprit
  rationale: « De » reflète la préposition ἀπό et laisse entendre que ce qui est répandu provient de l’Esprit, sans expliciter davantage la métaphore.
- source_word: προφητεύσουσιν
  choice: ils prophétiseront
  rationale: Traduction directe du futur, qui conserve le terme biblique sans paraphrase.
theological_decisions:
- issue: Traduction de δοῦλος et δούλη dans ce contexte socialement marqué
  choice: mes esclaves, hommes et femmes
  alternative: mes serviteurs et mes servantes
  rationale: La mention distincte des hommes et des femmes souligne l’extension du don divin à des personnes de statut social inférieur. « Esclaves » préserve plus nettement cette force que « serviteurs », tandis que l’apposition « hommes et femmes » rend l’opposition de genre sans lourdeur excessive.
- issue: Traduction de ἀπὸ τοῦ πνεύματός μου
  choice: de mon Esprit
  alternative: une part de mon Esprit
  rationale: Le texte dit littéralement « depuis/de mon Esprit ». La traduction retenue conserve la préposition et l’ambiguïté de la métaphore, sans imposer une interprétation quantitative.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image de l’effusion, la distinction entre hommes et femmes et l’accent social du passage, tout en évitant une tournure artificielle comme « esclaves masculins et esclaves féminines ».
