id: ACT.2.37
reference: Acts 2:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: fr
  text: 'Quand ils entendirent cela, ils eurent le cœur transpercé[a] et dirent à Pierre et aux autres apôtres : « Que devons-nous faire, frères[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « profondément bouleversés ». L’expression grecque évoque une douleur intérieure aiguë ou une vive prise de conscience.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « hommes, frères ». C’est une formule d’adresse conventionnelle qui peut, selon le contexte, viser les frères ou l’ensemble des frères et sœurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quand ils entendirent cela
  rationale: Le participe aoriste situe leur réaction à la suite du discours de Pierre. « Cela » reprend naturellement ce qu’ils viennent d’entendre. δέ marque ici la progression du récit sans exiger un connecteur distinct en français.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: ils eurent le cœur transpercé
  rationale: Cette formulation conserve l’image vive d’une atteinte intérieure aiguë et exprime une profonde conviction ou détresse sans en préciser excessivement la nature.
- source_word: εἶπόν τε
  choice: et dirent
  rationale: τε relie étroitement cette parole à leur réaction précédente; le verbe « dire » reste fidèle à λέγω sans transformer explicitement l’énoncé en demande.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: à Pierre et aux autres apôtres
  rationale: λοιπούς désigne les apôtres autres que Pierre. « Aux autres apôtres » est naturel et précis en français.
- source_word: Τί ποιήσωμεν
  choice: Que devons-nous faire
  rationale: Le subjonctif délibératif demande quelle conduite adopter. « Devons-nous » rend clairement cette délibération en français contemporain.
- source_word: ἄνδρες ἀδελφοί
  choice: frères
  rationale: Il s’agit d’une formule d’adresse masculine et fraternelle. « Frères » évite le lourd calque « hommes frères » tout en maintenant le terme familial explicite.
theological_decisions:
- issue: Portée genrée de l’adresse ἄνδρες ἀδελφοί
  choice: frères
  alternative: frères et sœurs; hommes, frères
  rationale: Le grec est grammaticalement masculin, mais cette formule conventionnelle peut, selon le contexte, s’adresser de manière représentative à un groupe plus large. Le texte principal conserve la forme masculine, tandis que la note maintient ouverte la portée contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du cœur transpercé est conservée dans le texte principal; les nuances émotionnelles et la portée possible de l’adresse sont signalées en notes.
