id: ACT.2.30
reference: Acts 2:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: fr
  text: Ainsi donc, comme il était prophète et savait que Dieu lui avait juré par serment de faire asseoir sur son trône l’un de ses descendants[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quelqu’un issu du fruit de ses reins ».'
    reason: L’expression grecque concrète désigne un descendant physique; la note en préserve l’image tout en gardant un texte principal naturel.
lexical_decisions:
- source_word: προφήτης
  choice: prophète
  rationale: Équivalent français courant et précis pour celui qui parle sous révélation divine.
- source_word: οὖν
  choice: Ainsi donc
  rationale: Marque nettement la déduction tirée de l’argument précédent concernant David, dans un français naturel.
- source_word: ὑπάρχων
  choice: comme il était
  rationale: Rend la circonstance à nuance causale du participe sans alourdir la phrase.
- source_word: εἰδὼς
  choice: savait
  rationale: Le verbe à l’imparfait coordonné à « comme il était » transpose naturellement le participe grec et indique le savoir de David.
- source_word: ὅρκῳ ὤμοσεν αὐτῷ
  choice: lui avait juré par serment
  rationale: Conserve le renforcement solennel produit en grec par le nom « serment » associé au verbe « jurer ».
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: l’un de ses descendants
  rationale: Restitue clairement en français moderne l’idiome désignant la descendance physique; l’image littérale est conservée en note.
- source_word: καθίσαι
  choice: faire asseoir
  rationale: 'Préserve la valeur causative: Dieu établit le descendant sur le trône, plutôt que celui-ci ne s’y assoie simplement de lui-même.'
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: sur son trône
  rationale: Formulation française habituelle du langage d’intronisation; le possessif renvoie le plus naturellement au trône de David.
theological_decisions:
- issue: Promesse royale messianique faite à David
  choice: Conserver les termes dynastiques de la promesse sans introduire explicitement « le Messie » dans ce verset.
  alternative: Traduire en précisant que le Messie serait assis sur le trône de David.
  rationale: Le contexte applique la promesse à Jésus, mais le verset lui-même parle d’un descendant de David et de son trône. La traduction laisse le contexte établir l’application christologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la logique argumentative, la solennité du serment et la valeur causative de l’intronisation. Le marqueur [a] figure dans le texte principal.
