id: ACT.2.24
reference: Acts 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: fr
  text: Dieu l’a ressuscité, le délivrant des douleurs de la mort[a], car il était impossible que la mort le retienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « douleurs » peut aussi désigner les douleurs de l’accouchement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: l’
  rationale: Le pronom relatif reprend Jésus, mentionné au verset précédent. En français, le pronom objet « l’ » assure naturellement la continuité de la phrase sans alourdir la formulation.
- source_word: ἀνέστησεν
  choice: a ressuscité
  rationale: Dans ce contexte, le verbe désigne l’action de Dieu qui ramène Jésus d’entre les morts. « A ressuscité » est clair, courant et précis en français moderne.
- source_word: λύσας
  choice: le délivrant
  rationale: Le participe de λύω évoque l’action de délier, libérer ou relâcher. « Le délivrant » conserve l’idée d’une emprise brisée tout en évitant une expression française artificielle comme « déliant les douleurs ».
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: des douleurs de la mort
  rationale: ὠδῖνας désigne des douleurs aiguës et peut plus précisément évoquer celles de l’accouchement. « Douleurs de la mort » reste fidèle à l’expression grecque et compréhensible, tandis qu’une note conserve la nuance possible des douleurs de l’enfantement.
- source_word: καθότι
  choice: car
  rationale: La conjonction introduit la raison de l’action divine. « Car » exprime clairement ce rapport explicatif dans un registre digne et naturel.
- source_word: οὐκ ἦν δυνατὸν
  choice: il était impossible
  rationale: Cette formulation française idiomatique rend directement la construction impersonnelle grecque, littéralement « il n’était pas possible ».
- source_word: κρατεῖσθαι
  choice: le retienne
  rationale: Le passif grec exprime le fait d’être maintenu sous une emprise. La tournure active « que la mort le retienne » est plus naturelle en français et conserve exactement les rôles sémantiques.
- source_word: ὑπ’ αὐτοῦ
  choice: que la mort le retienne
  rationale: Le pronom grec renvoie le plus naturellement à « la mort ». La répétition du nom en français évite une formulation pronominale pesante et rend explicite le référent indiqué par le contexte immédiat.
theological_decisions:
- issue: Référent de ὑπ’ αὐτοῦ
  choice: La mort est le sujet qui ne pouvait retenir Jésus.
  alternative: 'Formulation plus littérale : « qu’il soit retenu par elle » ; grammaticalement, un référent personnel masculin serait théoriquement envisageable en grec.'
  rationale: θανάτου est l’antécédent le plus proche et le sens de la proposition exige naturellement que la mort soit la puissance incapable de garder Jésus sous son emprise. Nommer de nouveau la mort clarifie sans ajouter une conclusion doctrinale étrangère au texte.
- issue: Sens de ὠδῖνας
  choice: « douleurs » dans le texte principal
  alternative: « douleurs de l’enfantement » ou « douleurs aiguës »
  rationale: Le mot grec peut désigner spécifiquement les douleurs de l’accouchement, mais l’expression présente décrit aussi les souffrances ou affres liées à la mort. Le texte principal garde le terme général, et la note préserve l’image lexicale possible sans l’imposer.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe privilégie la clarté orale et écrite, tout en conservant l’image des « douleurs de la mort » et l’affirmation forte de l’impossibilité pour la mort de retenir Jésus.
