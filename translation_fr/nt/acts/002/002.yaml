  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: fr
  text: Tout à coup, il vint du ciel un bruit semblable à celui d’un vent violent en mouvement[a], et il remplit toute la maison où ils étaient assis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « semblable à celui d’un vent violent porté ». Le grec compare le bruit à un mouvement d’air puissant; il ne dit pas explicitement qu’un vent réel était présent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: vint
  rationale: Dans la construction narrative ἐγένετο ... ἦχος, « un bruit vint » exprime naturellement en français la survenue soudaine du phénomène.
- source_word: ἄφνω
  choice: Tout à coup
  rationale: Rend clairement le caractère brusque de l’événement dans un registre courant et digne.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: « Du ciel » conserve l’idée d’une origine céleste, plus appropriée ici que la seule localisation atmosphérique.
- source_word: ἦχος
  choice: un bruit
  rationale: « Bruit » désigne ici un phénomène sonore perceptible et s’insère naturellement dans le récit; le terme ne précise pas indûment sa nature.
- source_word: ὥσπερ
  choice: semblable à celui de
  rationale: Cette formulation marque explicitement la comparaison et évite d’affirmer qu’un vent réel était présent.
- source_word: φερομένης
  choice: qui se précipite
  rationale: Le participe évoque un mouvement porté ou entraîné; appliqué au vent, « qui se précipite » restitue de façon naturelle son mouvement impétueux.
- source_word: πνοῆς
  choice: vent
  rationale: Dans ce contexte auditif et avec βιαίας, le mot désigne le mieux un mouvement d’air puissant plutôt qu’un souffle humain.
- source_word: βιαίας
  choice: violent
  rationale: Équivalent direct exprimant la force du mouvement d’air sans l’atténuer.
- source_word: ἐπλήρωσεν
  choice: il remplit
  rationale: Le pronom reprend grammaticalement « un bruit », conformément au sujet grec, et conserve la vivacité du récit.
- source_word: ὅλον τὸν οἶκον
  choice: toute la maison
  rationale: Formulation française naturelle qui préserve la totalité exprimée par ὅλον.
- source_word: οὗ ἦσαν καθήμενοι
  choice: où ils étaient assis
  rationale: Rend simplement et exactement la situation décrite par la proposition relative.
theological_decisions:
- issue: Nature du phénomène comparé au vent
  choice: Le texte principal parle d’un bruit semblable à celui d’un vent violent en mouvement.
  alternative: Un vent violent réel remplit la maison.
  rationale: ὥσπερ introduit une comparaison. La traduction préserve donc la distinction entre le bruit entendu et un éventuel vent réel, sans trancher au-delà du texte grec.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste fluide à l’oral comme à l’écrit, tout en maintenant explicitement la comparaison du grec et son ambiguïté sur la présence d’un vent réel.
