  verdict: revise
  source_fidelity: La portée universelle de πᾶς ὃς ἐὰν, le futur de l’invocation et le futur passif de σωθήσεται sont correctement représentés. Toutefois, « Alors » affaiblit la formule citationnelle καὶ ἔσται, qui se rend plus fidèlement par « Et il arrivera que ». « Invoquera le nom » restitue aussi plus directement l’idiome biblique ἐπικαλέσηται τὸ ὄνομα que « fera appel au nom ».
  naturalness: « Et il arrivera que toute personne qui invoquera le nom du Seigneur sera sauvée » est un français moderne, clair et suffisamment solennel pour une citation prophétique. Il évite le tour un peu administratif ou juridique que peut prendre « faire appel au nom ».
  terminology: « le nom du Seigneur » conserve l’expression biblique et laisse volontairement ouvert le référent de κύριος. « Sera sauvée » convient avec « toute personne » et préserve la voix passive ainsi que la portée salvatrice de σωθήσεται.
