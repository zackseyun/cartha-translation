    issue: Rendu de καὶ ἔσται par « Alors »
    rationale: « Alors » exprime seulement une succession temporelle et ne rend pas explicitement la formule introductive « et il arrivera que », présente dans le grec et caractéristique de la citation scripturaire.
  - severity: medium
