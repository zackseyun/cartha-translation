  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: fr
  text: Et il arrivera que toute personne qui invoquera le nom du Seigneur sera sauvée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « quiconque invoquera le nom du Seigneur ». Cette expression reprend Joël 3.5 (2.32 dans certaines numérotations), où « le Seigneur » désigne YHWH ; dans les Actes, Pierre cite ce passage dans sa proclamation au sujet de Jésus.'
    reason: Signaler une formulation alternative et préserver la tension concernant le référent de « Seigneur ».
lexical_decisions:
- source_word: ἔσται
  choice: Alors
  rationale: Dans la formule prophétique καὶ ἔσται, « Alors » introduit naturellement en français moderne l’accomplissement annoncé, sans recourir au calque peu idiomatique « et il arrivera que ».
- source_word: πᾶς ὃς ἐὰν
  choice: toute personne qui
  rationale: Cette tournure rend la portée universelle et la condition indéfinie de la construction grecque dans un français inclusif, clair et naturel.
- source_word: ἐπικαλέσηται
  choice: fera appel à
  rationale: L’expression désigne le fait d’invoquer le Seigneur et de se tourner vers lui avec confiance. « Faire appel à » reste compréhensible dans le français courant tout en conservant cette idée de recours.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: Le terme est conservé littéralement, car « faire appel au nom » reprend une expression biblique chargée de connotations d’invocation et d’autorité.
- source_word: κυρίου
  choice: du Seigneur
  rationale: « Seigneur » traduit κύριος sans préciser son référent. La construction française « le nom du Seigneur » rend naturellement le génitif grec.
- source_word: σωθήσεται
  choice: sera sauvée
  rationale: Le futur passif est rendu directement. « Être sauvé » conserve à la fois l’idée de délivrance et la portée salvatrice du passage.
theological_decisions:
- issue: Référent du « Seigneur » dans la citation de Joël reprise par Pierre
  choice: Conserver « le Seigneur » sans identifier explicitement le référent dans le texte principal.
  alternative: Préciser soit YHWH, conformément au contexte de Joël, soit Jésus, conformément à l’orientation christologique du discours de Pierre.
  rationale: Le grec porte κύριος. Dans Joël, ce titre renvoie à YHWH, tandis que Pierre reprend la citation dans une proclamation centrée sur Jésus. La traduction préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le ton prophétique de la citation sans employer un tour inutilement archaïque. Le féminin grammatical de « sauvée » s’accorde avec « personne » et n’en limite pas la portée universelle.
