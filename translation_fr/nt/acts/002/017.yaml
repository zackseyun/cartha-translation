id: ACT.2.17
reference: Acts 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: fr
  text: 'Et il arrivera, dans les derniers jours, dit Dieu, que je répandrai de mon Esprit[a] sur toute chair[b] : vos fils et vos filles prophétiseront, vos jeunes gens auront des visions, et vos vieillards feront des rêves.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « à partir de mon Esprit », soulignant la provenance.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur tous les êtres humains ». Le grec dit « sur toute chair », selon l’expression prophétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις
  choice: Et il arrivera, dans les derniers jours
  rationale: « Il arrivera » restitue la formule prophétique ἔσται, tandis que « dans les derniers jours » rend directement l’expression eschatologique sans en préciser indûment la durée.
- source_word: λέγει ὁ θεός
  choice: dit Dieu
  rationale: Cette formulation conserve le présent de la formule de citation ainsi que sa force prophétique, dans un français naturel et solennel.
- source_word: ἐκχεῶ
  choice: je répandrai
  rationale: Le verbe « répandre » préserve la métaphore concrète de l’effusion et correspond à l’usage biblique français courant.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: de mon Esprit
  rationale: « De mon Esprit » est la formulation française naturelle qui maintient l’idée de provenance portée par ἀπό. La majuscule signale que le contexte désigne l’Esprit de Dieu.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: sur toute chair
  rationale: La traduction conserve l’image prophétique et le lien intertextuel avec Joël. Dans ce contexte, « toute chair » désigne largement les êtres humains, possibilité explicitée en note.
- source_word: προφητεύσουσιν
  choice: prophétiseront
  rationale: Traduction directe et usuelle du verbe, sans atténuer sa portée prophétique.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: vos fils et vos filles
  rationale: Le couple explicite masculin-féminin est préservé, élément important de l’élargissement annoncé dans le passage.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: vos jeunes gens
  rationale: « Jeunes gens » rend le nom masculin pluriel et maintient le contraste d’âge avec les vieillards.
- source_word: ὁράσεις ὄψονται
  choice: auront des visions
  rationale: Cette expression rend naturellement en français le sens de la construction apparentée « voir des visions », sans produire une tournure inutilement lourde.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: vos vieillards
  rationale: Le contexte oppose des groupes d’âge ; « vieillards » évite le sens institutionnel que pourrait suggérer « anciens ».
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: feront des rêves
  rationale: Cette tournure française naturelle restitue la construction grecque fondée sur deux mots de même racine et maintient le parallélisme avec les visions.
theological_decisions:
- issue: Portée de l’expression « toute chair »
  choice: Conserver « toute chair » dans le texte principal comme idiome prophétique à portée humaine générale.
  alternative: sur tous les êtres humains ; sur tout le monde
  rationale: Ce choix préserve l’image du texte grec, sa résonance avec Joël et l’ampleur de la promesse, sans réduire celle-ci à une catégorie humaine particulière.
- issue: Identification de πνεῦμα dans l’effusion divine
  choice: Traduire « mon Esprit » avec une majuscule.
  alternative: mon esprit
  rationale: Le locuteur est Dieu et le contexte désigne son Esprit ; la majuscule française rend ce référent clair sans ajouter de précision doctrinale absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique est conservée sans raideur excessive. « Vieillards » est retenu dans son sens descriptif lié à l’âge, en parallèle avec « jeunes gens ».
