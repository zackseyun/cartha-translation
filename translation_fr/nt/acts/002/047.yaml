  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: fr
  text: Ils louaient Dieu et avaient la faveur de tout le peuple. Et chaque jour, le Seigneur ajoutait à leur nombre[a] ceux qui étaient sauvés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte une expression qui peut aussi signifier « ensemble » ou « au même endroit ».
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνοῦντες τὸν θεόν
  choice: Ils louaient Dieu
  rationale: L’imparfait français rend naturellement l’activité continue exprimée par le participe présent dans ce contexte narratif.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: avaient la faveur de tout le peuple
  rationale: L’expression signifie ici qu’ils jouissaient de la faveur de la population; «tout le peuple» conserve la portée de ὅλον τὸν λαόν.
- source_word: ὁ δὲ κύριος προσετίθει
  choice: Et chaque jour, le Seigneur ajoutait
  rationale: L’imparfait «ajoutait» restitue l’action répétée ou continue du grec προσετίθει; «Et» marque sobrement la progression narrative de δέ.
- source_word: τοὺς σῳζομένους
  choice: ceux qui étaient sauvés
  rationale: L’imparfait passif conserve en français la présentation de personnes engagées dans l’action de salut, sans transformer le participe en désignation statique comme «les sauvés».
- source_word: καθ’ ἡμέραν
  choice: chaque jour
  rationale: Formulation française courante qui rend clairement la répétition quotidienne.
- source_word: ἐπὶ τὸ αὐτό
  choice: à leur nombre
  rationale: Avec «ajoutait», cette formulation exprime naturellement l’intégration au groupe déjà constitué. Comme l’expression grecque peut aussi signifier «ensemble» ou «au même endroit», cette ambiguïté est signalée en note.
theological_decisions:
- issue: Aspect du salut dans τοὺς σῳζομένους
  choice: ceux qui étaient sauvés
  alternative: ceux qui avaient été sauvés; les sauvés
  rationale: Le participe présent passif envisage le salut comme une action en cours dans le cadre du récit. L’imparfait passif français préserve cette perspective sans trancher des débats doctrinaux plus larges sur le déroulement du salut.
- issue: Sens de ἐπὶ τὸ αὐτό
  choice: à leur nombre
  alternative: ensemble; au même endroit
  rationale: Le contexte de προσετίθει favorise l’idée d’une adjonction à la communauté, mais l’expression grecque reste susceptible d’un sens local ou collectif. La note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits assurent la continuité narrative et évitent les tournures inutilement lourdes. La note accompagne directement l’expression interprétative «à leur nombre».
