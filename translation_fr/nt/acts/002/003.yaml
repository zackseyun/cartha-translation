- from: Des langues comme de feu leur apparurent, se partageant, et cela se posa sur chacun d’eux[a].
  to: Des langues comme de feu leur apparurent, se divisant, et il s’en posa une sur chacun d’eux[a].
  rationale: La révision remplace une expression française ambiguë par « se divisant », qui rend directement le participe διαμεριζόμεναι. La finale distributive « il s’en posa une sur chacun d’eux » évite le démonstratif vague du projet tout en gardant une représentation singulière de l’élément qui se pose; elle ne présente donc pas le pluriel du français comme une correction du singulier grec. La note est reformulée dans un français naturel et conserve les deux principales possibilités de compréhension sans imposer une interprétation doctrinale.
