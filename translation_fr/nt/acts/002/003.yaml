  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: fr
  text: Des langues comme de feu leur apparurent, se divisant, et il s’en posa une sur chacun d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des langues, comme de feu, qui se divisaient » ; ou : « des langues, comme si elles étaient de feu ». Le grec souligne à la fois l’apparition visible de ces langues et leur répartition entre les personnes présentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: leur apparurent
  rationale: 'L’aoriste passif de ὁράω a ici une valeur intransitive : les langues devinrent visibles pour eux. « Leur apparurent » exprime naturellement cette manifestation visible.'
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif désigne les personnes auxquelles le phénomène apparut.
- source_word: διαμεριζόμεναι
  choice: se partageant
  rationale: Le participe présent moyen/passif, accordé avec « langues », évoque leur division ou leur distribution. « Se partageant » conserve le mouvement exprimé sans trancher entièrement entre processus et résultat.
- source_word: γλῶσσαι
  choice: des langues
  rationale: « Langues » préserve à la fois l’image visible de formes semblables à des langues et le lien lexical avec la parole dans la suite du récit; « flammes » supprimerait cette résonance.
- source_word: ὡσεὶ πυρός
  choice: comme de feu
  rationale: ὡσεὶ introduit une comparaison et non une identification. « Comme de feu » maintient l’image traditionnelle et indique qu’il ne s’agissait pas nécessairement de feu au sens propre.
- source_word: ἐκάθισεν
  choice: cela se posa
  rationale: Le verbe grec est singulier malgré le pluriel « langues ». Le pronom neutre « cela » conserve ce singulier et laisse ouverte la possibilité que le phénomène soit envisagé collectivement.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: sur chacun d’eux
  rationale: 'Cette formulation naturelle conserve la forte valeur distributive : chaque personne présente est individuellement concernée.'
theological_decisions:
- issue: Nature de la manifestation à la Pentecôte
  choice: Présenter le phénomène comme des « langues comme de feu »
  alternative: Des flammes de feu; des langues de feu au sens littéral; des langues parlées semblables au feu
  rationale: Le grec emploie à la fois γλῶσσαι et le comparatif ὡσεὶ. La traduction préserve donc l’image visible, son lien avec la parole et la distinction entre ressemblance et identité, sans réduire le signe à du feu littéral ni l’interpréter d’avance comme de simples langues parlées.
- issue: Singulier du verbe ἐκάθισεν après le pluriel γλῶσσαι
  choice: Conserver le singulier par « cela se posa »
  alternative: 'Employer le pluriel : « elles se posèrent »'
  rationale: Le singulier peut envisager collectivement la manifestation distribuée. Le conserver respecte la tension grammaticale du texte sans imposer une harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « des langues comme de feu » garde l’image biblique tout en restant compréhensible; « cela se posa » est légèrement marqué, mais retenu afin de préserver le singulier grec et l’ambiguïté collective.
