  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: fr
  text: 'Comme Paul présentait ainsi sa défense, Festus s’écria d’une voix forte : « Tu es fou, Paul ! Ton vaste savoir te fait perdre la raison. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: présentait ainsi sa défense
  rationale: Le génitif absolu exprime une action simultanée, et le verbe conserve ici son sens judiciaire ou argumentatif de présentation d’une défense.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: s’écria d’une voix forte
  rationale: La locution indique la manière de parler et souligne l’interruption vigoureuse de Festus; « s’écria » et « d’une voix forte » rendent ensemble cette vivacité.
- source_word: φησιν
  choice: s’écria
  rationale: Le présent historique grec est rendu au passé, conformément à l’usage narratif naturel en français; le contexte et la voix forte justifient « s’écria ».
- source_word: Μαίνῃ
  choice: Tu es fou
  rationale: Cette formulation directe et courante rend naturellement l’accusation de folie portée contre Paul.
- source_word: τὰ πολλά ... γράμματα
  choice: Ton grand savoir
  rationale: γράμματα désigne ici vraisemblablement l’instruction ou l’érudition plutôt que des lettres ou écrits matériels; « grand savoir » reste naturel et proche de l’expression grecque.
- source_word: εἰς μανίαν
  choice: à la folie
  rationale: Avec περιτρέπει, la préposition εἰς marque l’aboutissement vers un état de folie.
- source_word: περιτρέπει
  choice: te fait tourner
  rationale: Ce choix conserve l’image verbale de περιτρέπω et son sens causatif, tout en formant une expression française intelligible avec « à la folie ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le cadre judiciaire de la défense de Paul ainsi que la brutalité de l’interruption de Festus. « Te fait tourner à la folie » est légèrement marqué, mais préserve l’image et la progression du grec sans résoudre l’accusation en simple constat psychologique.
