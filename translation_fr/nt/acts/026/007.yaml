id: ACT.26.7
reference: Acts 26:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: fr
  text: C’est à son accomplissement que notre peuple des douze tribus espère parvenir[a], en servant Dieu avec ferveur nuit et jour[b]. C’est au sujet de cette espérance que je suis accusé par des Juifs[c], ô roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que nos douze tribus espèrent atteindre ». Le grec emploie un nom collectif singulier pour désigner Israël comme le peuple des douze tribus.
    reason: lexical_alternative
  - marker: b
    text: Ou « en lui rendant un culte avec ferveur ». Le verbe grec peut désigner le service religieux ou le culte rendu à Dieu.
    reason: lexical_alternative
  - marker: c
    text: L’expression désigne ici des accusateurs juifs dans un contexte judiciaire, et non l’ensemble des Juifs.
    reason: contextual_clarification
lexical_decisions:
- source_word: εἰς ἣν
  choice: C’est à son accomplissement
  rationale: Le relatif renvoie à la promesse du verset précédent, et εἰς indique le but visé. Cette formulation française rend explicite le renvoi sans préciser davantage le contenu de la promesse.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: notre peuple des douze tribus
  rationale: Le substantif grec est un collectif singulier désignant Israël comme peuple constitué de douze tribus; cette formulation conserve cette valeur collective en français naturel.
- source_word: ἐν ἐκτενείᾳ
  choice: avec ferveur
  rationale: L’expression marque l’intensité et l’application constante; « avec ferveur » convient au contexte religieux sans exclure l’idée de persévérance.
- source_word: νύκτα καὶ ἡμέραν
  choice: nuit et jour
  rationale: Conserve l’ordre grec et exprime idiomatiquement la continuité.
- source_word: λατρεῦον
  choice: en servant Dieu
  rationale: Le verbe désigne ici un service religieux rendu à Dieu. L’objet implicite est exprimé pour assurer la clarté en français.
- source_word: ἐλπίζει καταντῆσαι
  choice: espère parvenir
  rationale: καταντάω exprime l’arrivée au but attendu; « parvenir » garde cette orientation vers l’accomplissement de la promesse.
- source_word: περὶ ἧς ἐλπίδος
  choice: au sujet de cette espérance
  rationale: Rend directement περί avec le génitif sans trancher entre le thème de l’accusation et sa cause.
- source_word: ἐγκαλοῦμαι
  choice: je suis accusé
  rationale: Rend simplement le sens passif et judiciaire du verbe dans le cadre de la défense de Paul.
- source_word: ὑπὸ Ἰουδαίων
  choice: par des Juifs
  rationale: L’absence d’article et le contexte judiciaire désignent des accusateurs juifs, non l’ensemble des Juifs. « Des Juifs » est exact et naturel en français.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Conserve le vocatif solennel adressé directement au roi Agrippa.
theological_decisions:
- issue: Objet implicite de λατρεῦον
  choice: Expliciter « Dieu » dans « en servant Dieu »
  alternative: « en lui rendant un culte » ou simplement « en servant »
  rationale: Dans ce contexte, le service religieux d’Israël est naturellement dirigé vers Dieu. L’explicitation clarifie la phrase sans introduire une affirmation théologique étrangère.
- issue: Référent de l’espérance
  choice: Faire renvoyer le début du verset à l’accomplissement de la promesse précédente sans nommer ici la résurrection
  alternative: Expliciter la résurrection ou laisser un simple pronom relatif peu clair en français
  rationale: Le contexte relie l’espérance à la promesse de Dieu, mais ce verset n’en reformule pas précisément le contenu; la traduction préserve ce lien et cette retenue.
- issue: Portée de ὑπὸ Ἰουδαίων
  choice: « par des Juifs »
  alternative: « par les Juifs »
  rationale: La formulation évite de transformer l’accusation judiciaire portée par certains Juifs en affirmation générale visant tout le peuple juif.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe clarifie le renvoi à la promesse du verset précédent tout en maintenant l’ambiguïté voulue sur son contenu précis. Les notes signalent la valeur collective de « douze tribus », la portée cultuelle de λατρεύω et la portée non universelle de l’accusation.
