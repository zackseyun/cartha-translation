- from: Ils me connaissent depuis mes débuts[a] et peuvent témoigner, s’ils le veulent, que j’ai vécu en pharisien, selon le parti[b] le plus strict de notre religion.
  to: Ils me connaissent depuis le début[a], s’ils veulent en témoigner, et savent que j’ai vécu en pharisien, dans le parti[b] le plus strict de notre religion.
  rationale: La révision supprime l'ajout de capacité introduit par « peuvent » et replace la condition sur la disposition des témoins à témoigner. Elle évite aussi de restreindre « depuis le début » aux débuts personnels de Paul et améliore la relation française entre sa vie de pharisien et le groupe le plus strict du judaïsme.
