source:
  edition: SBLGNT
  text: προγινώσκοντές με ἄνωθεν, ἐὰν θέλωσι μαρτυρεῖν, ὅτι κατὰ τὴν ἀκριβεστάτην αἵρεσιν τῆς ἡμετέρας θρησκείας ἔζησα Φαρισαῖος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/005.yaml
  text: They have known me from the beginning[a], if they are willing to testify[b], that I lived as a Pharisee according to the strictest sect of our religion.
translation:
  language: fr
  text: Ils me connaissent depuis le début[a], s’ils veulent en témoigner, et savent que j’ai vécu en pharisien, dans le parti[b] le plus strict de notre religion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le commencement », « depuis les premiers temps » ou « depuis longtemps ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne ici un parti, un courant ou une secte au sein du judaïsme, et non une « hérésie » au sens technique plus tardif.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγινώσκοντές με
  choice: Ils me connaissent
  rationale: Le participe décrit une connaissance antérieure de Paul qui demeure pertinente au moment du procès. Le présent français rend naturellement cette continuité sans imposer le sens plus littéral de « connaître d’avance ».
- source_word: ἄνωθεν
  choice: depuis mes débuts
  rationale: Dans ce contexte, le mot renvoie aux premiers temps de la vie publique de Paul ou à une époque ancienne, et non à une origine « d’en haut ». « Depuis mes débuts » est naturel et conserve l’idée de connaissance dès le commencement.
- source_word: ἐὰν θέλωσι μαρτυρεῖν
  choice: peuvent témoigner, s’ils le veulent
  rationale: La formulation française met clairement en relief la volonté exprimée par θέλωσι et conserve la portée judiciaire de μαρτυρεῖν.
- source_word: κατὰ τὴν ἀκριβεστάτην αἵρεσιν
  choice: selon le parti le plus strict
  rationale: κατά indique ici la norme ou l’appartenance selon laquelle Paul menait sa vie; ἀκριβεστάτην exprime le degré superlatif de rigueur; αἵρεσις désigne un groupe reconnu au sein du judaïsme.
- source_word: τῆς ἡμετέρας θρησκείας
  choice: de notre religion
  rationale: « Notre » maintient l’identification de Paul au patrimoine religieux juif partagé, et « religion » convient au sens global de θρησκεία dans ce contexte.
- source_word: ἔζησα Φαρισαῖος
  choice: j’ai vécu en pharisien
  rationale: Cette tournure française concise exprime à la fois l’identité de Paul et la manière dont il a mené sa vie.
theological_decisions:
- issue: Sens de αἵρεσις dans le cadre historique juif
  choice: parti
  alternative: secte; hérésie
  rationale: Le terme désigne ici les pharisiens comme un courant ou parti reconnu au sein du judaïsme. « Hérésie » introduirait un sens technique et péjoratif plus tardif; « parti » évite aussi les connotations modernes souvent négatives de « secte ».
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le cadre judiciaire et la condition portant sur la volonté des témoins. « En pharisien » est idiomatique sans être familier; « parti » restitue le cadre historique sans connotation confessionnelle anachronique.
