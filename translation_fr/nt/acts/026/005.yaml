  - severity: low
    issue: « depuis mes débuts »
    rationale: Cette expression interprète ἄνωθεν comme les débuts personnels de Paul. « Depuis le début » conserve mieux l'indétermination contextuelle de l'original, qui peut simplement désigner une connaissance ancienne, dès l'origine.
  - severity: low
    issue: « selon le parti le plus strict »
    rationale: Cette construction est moins naturelle en français pour décrire l'appartenance et la manière de vivre de Paul. « Dans le parti le plus strict » garde le sens de αἵρεσις comme groupe tout en améliorant la syntaxe.
  revised_text: Ils me connaissent depuis le début[a], s’ils veulent en témoigner, et savent que j’ai vécu en pharisien, dans le parti[b] le plus strict de notre religion.
