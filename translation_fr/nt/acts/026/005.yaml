  source_fidelity: 'La condition ἐὰν θέλωσι porte sur l''acte de témoigner : le texte ne dit pas qu''ils « peuvent » témoigner, mais qu''ils le feront s''ils le veulent. « Depuis le début » rend sobrement ἄνωθεν sans préciser artificiellement de quels « débuts » il s''agit. Le reste rend correctement la rigueur superlative du groupe pharisien et son inscription dans la religion juive partagée.'
  naturalness: La formulation révisée est naturelle en français international moderne et conserve le ton judiciaire. « S'ils veulent en témoigner » exprime directement la réserve rhétorique de Paul. « Dans le parti le plus strict » est plus idiomatique que « selon le parti le plus strict » après « vivre en pharisien ».
  terminology: « Parti » convient à αἵρεσις dans son sens historique de groupe reconnu, sans importer le sens ultérieur et péjoratif d'« hérésie ». « Religion » pour θρησκεία et « en pharisien » pour Φαρισαῖος sont appropriés.
