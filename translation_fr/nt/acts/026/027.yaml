id: ACT.26.27
reference: Acts 26:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: fr
  text: Roi Agrippa, croyez-vous aux prophètes ? Je sais que vous y croyez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous acceptez le témoignage des prophètes » ou « vous faites confiance aux prophètes ».'
    reason: Alternative lexicale pour πιστεύω avec le datif, qui peut exprimer le fait d’accorder foi à une personne ou à son témoignage.
lexical_decisions:
- source_word: πιστεύεις
  choice: croyez-vous / vous y croyez
  rationale: Le présent actif s’intègre naturellement à une question directe, puis à une affirmation. Avec le datif « aux prophètes », « croire à » exprime ici l’acceptation de leur témoignage. Dans la seconde proposition, le pronom « y » reprend naturellement « aux prophètes » en français.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Roi Agrippa
  rationale: Le vocatif est rendu par une adresse directe, digne et courante en français moderne, sans ajouter l’interjection archaïsante « ô ».
- source_word: τοῖς προφήταις
  choice: aux prophètes
  rationale: Cette traduction directe conserve la référence aux témoins prophétiques eux-mêmes, sans expliciter leur message ou leurs écrits au-delà du grec.
- source_word: οἶδα
  choice: Je sais
  rationale: Cette forme parfaite à valeur présente exprime ici une connaissance affirmée avec assurance; « Je sais » en conserve la force directe.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit simplement le contenu de ce que Paul affirme savoir.
theological_decisions:
- issue: Nature de la foi accordée aux prophètes
  choice: « croire aux prophètes »
  alternative: « accepter le témoignage des prophètes » ou « faire confiance aux prophètes »
  rationale: La formulation retient l’idée d’accorder foi aux prophètes et à leur témoignage, sans transformer l’appel rhétorique de Paul en affirmation doctrinale plus développée.
- issue: Force de la répétition finale de πιστεύεις
  choice: « vous y croyez »
  alternative: « vous croyez vraiment »
  rationale: La répétition du verbe est conservée sans ajouter un adverbe absent du grec. Le contexte et l’enchaînement question-réponse portent eux-mêmes l’insistance.
translation_notes:
  register: Français international moderne, naturel et digne. L’adresse « Roi Agrippa » conserve le titre et le vocatif; la reprise par « y » évite une répétition lourde tout en maintenant clairement le même objet de croyance.
