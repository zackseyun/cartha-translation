id: ACT.26.9
reference: Acts 26:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: fr
  text: Pour ma part, j’avais donc estimé devoir faire beaucoup de choses contre le nom de Jésus le Nazaréen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus de Nazareth ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ μὲν οὖν
  choice: Pour ma part, … donc
  rationale: Le pronom explicite Ἐγώ est emphatique, tandis que μὲν οὖν assure la transition et souligne le témoignage personnel de Paul. Cette tournure française rend l’ensemble naturellement sans accumuler des particules artificielles.
- source_word: ἔδοξα ἐμαυτῷ
  choice: j’avais pensé
  rationale: L’expression désigne le jugement que Paul avait lui-même formé. Le plus-que-parfait situe naturellement cette conviction dans son passé, évoqué rétrospectivement dans le discours.
- source_word: δεῖν
  choice: que je devais
  rationale: Le verbe exprime ici une nécessité telle que Paul la percevait alors, sans affirmer qu’elle venait réellement de Dieu.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: combattre activement
  rationale: Littéralement, la construction évoque le fait d’accomplir beaucoup de choses hostiles ou contraires. « Combattre activement » rend en français courant la multiplicité des actes et leur orientation hostile, sans suggérer un seul geste précis.
- source_word: πρὸς τὸ ὄνομα
  choice: le nom de
  rationale: Avec ἐναντία πρᾶξαι, πρός marque l’orientation hostile de l’action. Le verbe « combattre » porte déjà cette valeur, ce qui permet de conserver sans lourdeur l’expression biblique « le nom ».
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: Jésus le Nazaréen
  rationale: « Le Nazaréen » conserve la forme de désignation du grec et reste une appellation biblique intelligible en français moderne.
theological_decisions:
- issue: Portée de « le nom » appliqué à Jésus
  choice: Conserver l’expression « le nom de Jésus »
  alternative: l’autorité de Jésus ; la cause de Jésus ; Jésus lui-même
  rationale: Le grec garde l’idiome biblique ouvert, susceptible d’évoquer la personne, son autorité, sa réputation et la confession qui lui est attachée. Le traduire par une seule de ces dimensions réduirait indûment sa portée.
- issue: Nature de la nécessité exprimée par δεῖν
  choice: Présenter cette nécessité comme la conviction passée de Paul
  alternative: Formuler une nécessité objective ou divine
  rationale: La construction ἔδοξα ἐμαυτῷ … δεῖν encadre explicitement la nécessité dans l’ancien jugement personnel de Paul ; elle ne valide pas théologiquement ses actes.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Pour ma part » préserve l’insistance personnelle ; « combattre activement » évite le calque peu naturel « faire beaucoup de choses contraires », tout en rendant la force hostile et répétée de l’expression grecque.
