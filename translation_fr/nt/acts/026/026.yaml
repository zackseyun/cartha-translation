id: ACT.26.26
reference: Acts 26:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: fr
  text: En effet, le roi est au courant de ces choses, et c’est à lui que je parle avec assurance[a]. Je suis convaincu que rien de tout cela ne lui a échappé[b], car cela ne s’est pas passé dans un coin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec franchise » ou « librement ». Le grec évoque une parole franche, ouverte et confiante.
    reason: lexical_alternative
  - marker: b
    text: Ou « que rien de tout cela ne lui est caché » ou « n’est passé inaperçu à ses yeux ».
    reason: lexical_alternative
  - marker: c
    text: « Dans un coin » est une image désignant ce qui se fait secrètement, à l’écart des regards ou sans attirer l’attention.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: est au courant
  rationale: Le verbe exprime ici la connaissance et la familiarité du roi avec les faits évoqués. « Est au courant » est naturel en français moderne et convient au caractère public de ces événements.
- source_word: περὶ τούτων
  choice: de ces choses
  rationale: περί avec le génitif indique le sujet dont le roi a connaissance. Cette formulation conserve le référent général du grec.
- source_word: παρρησιαζόμενος
  choice: avec assurance
  rationale: Le participe évoque une parole franche, ouverte et confiante. « Avec assurance » restitue cette liberté de parole sans suggérer seulement un ton audacieux.
- source_word: πρὸς ὃν ... λαλῶ
  choice: c’est à lui que je parle
  rationale: La tournure met naturellement en relief en français la personne à laquelle Paul s’adresse, comme le relatif grec.
- source_word: λανθάνειν ... αὐτὸν
  choice: ne lui a échappé
  rationale: Cette expression idiomatique rend le fait que rien n’est demeuré inaperçu du roi.
- source_word: οὐ πείθομαι οὐθέν
  choice: Je suis convaincu que rien
  rationale: πείθομαι exprime une conviction établie. La formulation française rend naturellement la construction négative grecque sans en modifier la portée.
- source_word: πεπραγμένον
  choice: s’est passé
  rationale: Dans ce contexte, le parfait de πράσσω désigne des faits accomplis. « S’est passé » est idiomatique en français et convient à un ensemble d’événements.
- source_word: ἐν γωνίᾳ
  choice: dans un coin
  rationale: La traduction conserve l’image grecque d’un événement qui ne s’est pas produit secrètement ou à l’écart des regards.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif reste volontairement général, sans déterminer plus précisément quels événements Paul englobe.
theological_decisions:
- issue: Portée de « cela » et caractère public des événements
  choice: Conserver le démonstratif général « cela » et l’affirmation du caractère public des faits.
  alternative: Préciser qu’il s’agit exclusivement de la mort et de la résurrection de Jésus, ou plus largement de tout le mouvement chrétien et du procès de Paul.
  rationale: Le verset ne définit pas précisément la portée du démonstratif. La formulation retenue préserve cette ambiguïté et n’impose aucune délimitation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste accessible tout en conservant l’insistance rhétorique de Paul, l’image du « coin » et l’indétermination du démonstratif τοῦτο.
