  source_fidelity: Le participe « en te délivrant » rend bien ἐξαιρούμενός. « Du peuple et des non-Juifs » conserve l’opposition λαός/ἔθνη sans surinterpréter « le peuple ». En revanche, le relatif pluriel εἰς οὓς reprend naturellement les deux groupes coordonnés, et non les seuls non-Juifs; « vers qui » favorise en français cette lecture restrictive et reste moins idiomatique après « envoyer ».
  naturalness: « Auprès desquels » est plus naturel dans ce contexte d’envoi auprès de personnes et permet de rattacher sans ambiguïté le relatif aux deux antécédents. L’emphase « moi, je » demeure recevable dans un registre biblique moderne.
  terminology: « Non-Juifs » est clair et approprié pour ἔθνη dans ce contraste. La note proposée doit éviter « autres nations », qui ne constitue pas ici une alternative lexicale exacte et mélange l’explicitation de λαός avec le rendu de ἔθνη.
