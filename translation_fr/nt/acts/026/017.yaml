  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: fr
  text: en te délivrant du peuple et des non-Juifs[a], auprès desquels, moi, je t’envoie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en te délivrant du peuple juif et des nations ».'
    reason: Précise le référent contextuel de « peuple » et signale « nations » comme autre rendu possible de ἔθνη.
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: en te délivrant
  rationale: Le participe présent moyen exprime ici l’action protectrice de Jésus envers Paul. « Délivrer » rend naturellement l’idée de soustraire ou sauver de personnes hostiles, sans la lourdeur de « retirer ».
- source_word: τοῦ λαοῦ
  choice: du peuple
  rationale: Dans ce contraste avec les non-Juifs, le terme désigne contextuellement le peuple juif, mais « du peuple » conserve la formulation sobre et le cadre interne du grec.
- source_word: τῶν ἐθνῶν
  choice: des non-Juifs
  rationale: Dans le contraste juifs/non-Juifs propre au contexte, ἔθνη désigne les peuples autres que le peuple juif. « Non-Juifs » est clair et courant en français international.
- source_word: εἰς οὓς
  choice: vers qui
  rationale: Après un verbe d’envoi, εἰς indique les destinataires ou le champ de mission. « Vers qui » respecte la préposition et rattache naturellement le relatif aux non-Juifs.
- source_word: ἀποστέλλω
  choice: je t’envoie
  rationale: Le présent grec convient en français au caractère immédiat et actuel de l’envoi missionnaire.
- source_word: ἐγώ
  choice: moi, je
  rationale: Le pronom sujet, explicite en grec, porte une certaine insistance. « Moi, je » la rend sans modifier le sens de la mission.
theological_decisions:
- issue: Référent de « peuple » par contraste avec les non-Juifs
  choice: Conserver « du peuple » dans le texte principal, tout en indiquant en note qu’il s’agit du peuple juif.
  alternative: Traduire explicitement « du peuple juif » ou « d’Israël ».
  rationale: Le contexte établit nettement le contraste entre Juifs et non-Juifs, mais le grec dit simplement « le peuple ». La formulation principale préserve cette donnée textuelle sans masquer le référent contextuel.
- issue: Portée de la délivrance promise à Paul
  choice: Employer « en te délivrant » sans préciser si la délivrance est préventive, répétée ou ultime.
  alternative: Employer « en te sauvant » ou « en t’arrachant », qui pourraient suggérer une modalité plus déterminée.
  rationale: Le participe grec affirme l’action protectrice de Jésus, mais ne résout pas à lui seul toutes les questions sur sa modalité ou son déroulement. La traduction conserve cette tension.
translation_notes:
  register: Français moderne, digne et accessible. La phrase demeure un fragment syntaxiquement lié au verset précédent et à la suite du discours. L’incise « moi, je » conserve l’emphase du pronom grec explicite.
