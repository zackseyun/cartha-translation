id: ACT.26.6
reference: Acts 26:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: fr
  text: Et maintenant, je suis jugé à cause de l’espérance attachée à la promesse faite par Dieu à nos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». Le grec dit littéralement « nos pères » et désigne ici les ancêtres d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Rend naturellement la transition qui relie la situation judiciaire présente de Paul à ce qui précède.
- source_word: ἐπ’ ἐλπίδι
  choice: à cause de l’espérance
  rationale: ἐπί avec le datif exprime ici le fondement ou la cause de la comparution de Paul.
- source_word: τῆς … ἐπαγγελίας
  choice: liée à la promesse
  rationale: Le génitif rattache l’espérance à la promesse. « Liée à » garde ce rapport sans préciser excessivement s’il s’agit de l’espérance suscitée par la promesse, fondée sur elle ou portant sur son accomplissement.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: la promesse … à nos pères
  rationale: La tournure française « promesse faite … à » exprime clairement les destinataires indiqués par εἰς.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: faite par Dieu
  rationale: Rend de façon idiomatique l’origine et l’agent divins de la promesse.
- source_word: πατέρας ἡμῶν
  choice: nos pères
  rationale: Conserve le masculin explicite et la résonance ancestrale et covenantale de la formule dans ce contexte juif; une note signale l’équivalent français plus général.
- source_word: ἕστηκα κρινόμενος
  choice: me voici en jugement
  rationale: Le parfait ἕστηκα a une valeur d’état présent, tandis que κρινόμενος décrit la situation judiciaire actuelle. Cette formulation française rend l’ensemble avec dignité et naturel.
theological_decisions:
- issue: Identité de « nos pères »
  choice: Les pères d’Israël, ancêtres auxquels la promesse divine était destinée
  alternative: Les ancêtres du peuple juif, au sens général
  rationale: Dans le discours de Paul devant Agrippa, l’expression renvoie à l’histoire d’Israël et aux destinataires ancestraux des promesses de Dieu. Le texte conserve « pères » sans identifier plus précisément les patriarches.
- issue: Rapport entre l’espérance et la promesse
  choice: « l’espérance liée à la promesse »
  alternative: « l’espérance de la promesse » ou « l’espérance fondée sur la promesse »
  rationale: Le génitif grec permet plusieurs nuances. « Liée à » préserve cette ouverture et évite de trancher entre contenu, source et fondement de l’espérance.
translation_notes:
  register: Français international moderne, digne et accessible. « Me voici en jugement » conserve la force présentative et judiciaire de la phrase sans lourdeur juridique; « liée à » évite le calque peu naturel « l’espérance de la promesse » tout en préservant l’ambiguïté du génitif grec.
