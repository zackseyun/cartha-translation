revisions:
- from: Et maintenant, me voici en jugement à cause de l’espérance liée à la promesse faite par Dieu à nos pères[a].
  to: Et maintenant, je suis jugé à cause de l’espérance attachée à la promesse faite par Dieu à nos pères[a].
  rationale: La révision remplace deux formulations françaises moins précises ou moins naturelles. « Je suis jugé » exprime directement la situation judiciaire présente. « L’espérance attachée à la promesse » conserve le lien génitif entre espérance et promesse de manière plus étroite que « liée à », sans déterminer indûment si la promesse est le fondement, le contenu ou la source de l’espérance. La note et son ancre sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les éléments essentiels sont bien rendus : la cause judiciaire (« à cause de »), la promesse divine destinée aux pères d’Israël et la situation présente de Paul. Toutefois, « l’espérance liée à la promesse » affaiblit et généralise le génitif grec : l’espérance porte sur la promesse / son accomplissement, plutôt que d’entretenir seulement un lien indéterminé avec elle.'
  naturalness: « Me voici en jugement » est compréhensible, mais est moins direct et moins idiomatique dans un contexte de procès que « je suis jugé » / « je comparais en jugement ». « Je suis jugé » maintient le présent passif de κρινόμενος et le registre soutenu accessible.
  terminology: « Nos pères » est exact dans ce contexte et la note explique utilement « ancêtres ». « Promesse faite par Dieu à nos pères » rend correctement l’agent et les destinataires. « Espérance de la promesse » est possible mais peu naturel en français moderne; « l’espérance que suscite la promesse » explicite légèrement le rapport. « l’espérance attachée à la promesse » est plus idiomatique que « liée à » tout en restant relativement ouvert.
  issues:
  - severity: medium
    issue: Rapport entre l’espérance et la promesse trop indéterminé
    rationale: « Liée à la promesse » peut désigner n’importe quelle association. Le génitif τῆς ἐπαγγελίας caractérise plus étroitement l’espérance comme espérance relative à la promesse. « Attachée à » est plus précis sans imposer une lecture doctrinale.
  - severity: low
    issue: Formulation judiciaire « me voici en jugement »
    rationale: La formule est littéraire mais moins usuelle et moins directement judiciaire que « je suis jugé ». Cette dernière traduit naturellement κρινόμενος dans le cadre de la comparution de Paul.
  revised_text: Et maintenant, je suis jugé à cause de l’espérance attachée à la promesse faite par Dieu à nos pères[a].
  revised_footnotes:
  - marker: a
    text: Ou « nos ancêtres ». Le grec dit littéralement « nos pères » et désigne ici les ancêtres d’Israël.
    reason: lexical_alternative
