  variant: modern international French
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: fr
  text: 'Nous étions tous tombés à terre quand j’ai entendu une voix qui me disait en langue hébraïque[a] : « Saul, Saul, pourquoi me persécutes-tu ? C’est dur pour toi de ruer contre les aiguillons[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « en araméen ». L’expression grecque dit littéralement « en langue (ou dialecte) hébraïque ».'
    reason: alternative_reading
  - marker: b
    text: 'Expression proverbiale tirée de l’image d’un animal qui rue contre les pointes servant à le faire avancer : en résistant, il ne fait que se blesser lui-même.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: Nous étions tous tombés à terre quand
  rationale: Le génitif absolu est rendu par une proposition temporelle naturelle. « Tous » et l’antériorité de la chute par rapport à l’audition de la voix sont conservés.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: j’ai entendu une voix qui me disait
  rationale: Dans ce contexte de discours articulé, φωνή désigne une voix. La relative restitue naturellement en français le participe λέγουσαν et l’adresse dirigée vers Paul.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: en langue hébraïque
  rationale: Cette formulation suit directement l’expression grecque sans décider dans le texte principal si elle désigne plus précisément l’araméen.
- source_word: Σαοὺλ Σαούλ
  choice: Saul, Saul
  rationale: La forme usuelle française du nom et sa répétition emphatique sont conservées.
- source_word: τί με διώκεις;
  choice: pourquoi me persécutes-tu ?
  rationale: Le présent et le sens de poursuite hostile de διώκω sont rendus directement dans une formulation française naturelle.
- source_word: σκληρόν σοι
  choice: Il est dur pour toi
  rationale: La tournure impersonnelle et la tension sémantique de σκληρόν, qui peut évoquer à la fois la difficulté et la souffrance qui en résulte, sont préservées sans explicitation excessive.
- source_word: πρὸς κέντρα λακτίζειν
  choice: de donner des coups de pied contre les aiguillons
  rationale: La métaphore concrète est conservée dans une langue plus immédiatement compréhensible que « regimber ». Le pluriel κέντρα est maintenu.
theological_decisions:
- issue: Sens de τῇ Ἑβραΐδι διαλέκτῳ
  choice: en langue hébraïque
  alternative: en araméen
  rationale: Le texte principal reflète la désignation grecque explicite. L’identification possible avec l’araméen est signalée en note afin de préserver l’ambiguïté historique et linguistique.
- issue: Portée de l’image des aiguillons
  choice: conserver la formulation proverbiale dans le texte
  alternative: expliciter dans le texte que résister ne fait que se blesser soi-même
  rationale: L’image appartient aux paroles rapportées et ne doit pas être remplacée par son interprétation. Une note en donne le contexte culturel sans réduire sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse directe et solennelle. La métaphore des aiguillons est maintenue, tandis que le verbe courant « donner des coups de pied » évite l’opacité possible de « regimber ».
