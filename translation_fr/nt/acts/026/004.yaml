id: ACT.26.4
reference: Acts 26:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὴν μὲν οὖν βίωσίν μου ⸀τὴν ἐκ νεότητος τὴν ἀπ’ ἀρχῆς γενομένην ἐν τῷ ἔθνει μου ἔν ⸀τε Ἱεροσολύμοις ἴσασι ⸀πάντες Ἰουδαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/004.yaml
  text: So then[a], all the Jews know my manner of life from my youth, which from the beginning took place among my own nation and also in Jerusalem,
translation:
  language: fr
  text: Tous les Juifs connaissent donc la vie que j’ai menée[a] depuis ma jeunesse, dès le début, au sein de mon peuple et à Jérusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma manière de vivre » ou « ma conduite ». Le terme grec désigne la façon dont Paul a vécu, et non sa simple existence.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίωσιν
  choice: la vie que j’ai menée
  rationale: Le nom désigne ici le cours ou la manière de vivre de Paul, et non sa simple existence. Cette formulation est naturelle en français et conserve cette nuance.
- source_word: ἐκ νεότητος
  choice: depuis ma jeunesse
  rationale: La préposition marque le point de départ temporel; le possessif est naturellement explicité en français d’après le contexte.
- source_word: ἀπ’ ἀρχῆς
  choice: dès le début
  rationale: Cette expression garde l’insistance temporelle du grec dans un français courant.
- source_word: γενομένην
  choice: que j’ai menée
  rationale: Le participe qualifie le cours de vie de Paul. En français, « mener une vie » exprime naturellement qu’elle s’est déroulée dans les lieux indiqués.
- source_word: ἐν τῷ ἔθνει μου
  choice: au sein de mon peuple
  rationale: ἔθνος renvoie ici au peuple auquel Paul appartient, non à un État-nation moderne. « Mon peuple » rend clairement cette appartenance collective.
- source_word: ἔν τε Ἱεροσολύμοις
  choice: et à Jérusalem
  rationale: τε coordonne Jérusalem avec le cadre précédent; une simple coordination est naturelle et n’ajoute pas d’emphase indue.
- source_word: ἴσασι
  choice: connaissent
  rationale: La forme parfaite de οἶδα a ici un sens présent et statif. Le verbe « connaître » convient à un parcours de vie connu d’autrui.
- source_word: πάντες Ἰουδαῖοι
  choice: Tous les Juifs
  rationale: La traduction directe conserve la portée générale de πάντες et la désignation collective Ἰουδαῖοι.
- source_word: μὲν οὖν
  choice: donc
  rationale: Dans ce contexte, la combinaison de particules assure la transition et la continuité du plaidoyer; « donc » en rend sobrement la fonction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation « la vie que j’ai menée » évite le tour plus lourd « ma manière de vivre qui s’est déroulée ». La virgule finale signale que la phrase se poursuit au verset suivant.
