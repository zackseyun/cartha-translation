id: ACT.26.16
reference: Acts 26:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: fr
  text: '« Mais relève-toi et tiens-toi debout : je te suis apparu dans ce but, afin de faire de toi un serviteur et un témoin de ce que tu as vu de moi et de ce que tu verras lorsque je t’apparaîtrai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « témoin des choses dans lesquelles tu m’as vu et de celles dans lesquelles je t’apparaîtrai ». La construction grecque est très condensée ; le texte l’explicite légèrement pour rester naturel en français.'
    reason: La note signale la construction relative inhabituelle et condensée du grec, sans trancher au-delà de ce que permet le texte.
lexical_decisions:
- source_word: ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου
  choice: relève-toi et tiens-toi debout
  rationale: Cette formulation rend les deux impératifs et l’image concrète de la station debout, sans la lourdeur peu naturelle de « tiens-toi sur tes pieds » en français.
- source_word: εἰς τοῦτο γὰρ ὤφθην σοι
  choice: Car si je te suis apparu, c’est afin de
  rationale: La tournure française exprime clairement le but introduit par εἰς τοῦτο tout en conservant le langage d’apparition de ὤφθην.
- source_word: προχειρίσασθαί σε
  choice: faire de toi
  rationale: Dans ce contexte de mission, l’expression signifie établir ou désigner quelqu’un pour une fonction. « Faire de toi » est naturel et garde la force de cette investiture.
- source_word: ὑπηρέτην
  choice: serviteur
  rationale: Le terme désigne une personne qui agit au service d’une autre. « Serviteur » convient au registre solennel sans introduire un titre ecclésiastique.
- source_word: μάρτυρα
  choice: témoin
  rationale: « Témoin » est le terme français précis pour celui qui atteste ce qu’il a vu ou reçu par révélation.
- source_word: ὧν τε εἶδές με
  choice: de ce que tu as vu de moi
  rationale: Cette traduction garde le rapport direct à Jésus exprimé par με et demeure compréhensible, tout en laissant subsister la formulation condensée du grec.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: de ce que tu verras lorsque je t’apparaîtrai
  rationale: La formulation conserve le futur d’apparition personnelle tout en explicitant juste assez la construction grecque très condensée pour produire un français intelligible.
theological_decisions:
- issue: Nature de la révélation exprimée par ὤφθην et ὀφθήσομαί
  choice: 'Traduire les deux formes par le langage de l’apparition personnelle : « je te suis apparu » et « je t’apparaîtrai ».'
  alternative: « tu m’as vu / tu me verras » ou « je me suis révélé / je me révélerai »
  rationale: Le grec présente Jésus comme celui qui apparaît à Paul et le charge d’une mission. Le langage d’apparition préserve cette dimension objective sans préciser indûment le mode de la manifestation.
- issue: Rapport entre le témoignage présent et les révélations futures
  choice: 'Conserver les deux volets : ce que Paul a déjà vu et ce qu’il verra lors d’apparitions futures.'
  alternative: Comprendre le second volet comme une simple instruction intérieure ou comme ce que Jésus « montrera » à Paul.
  rationale: Le futur ὀφθήσομαι reprend le verbe d’apparition et ne doit pas être réduit à une impression intérieure ni remplacé sans indication par un verbe signifiant « montrer ».
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs sont directs; « serviteur » et « témoin » conservent le registre de l’appel et de la mission. La ponctuation en deux phrases évite une période trop chargée. Le marqueur [a] est placé à l’endroit précis où porte la note.
