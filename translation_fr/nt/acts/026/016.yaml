review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend bien les impératifs, la finalité de l''apparition, la désignation comme « serviteur et témoin », et le langage d''apparition personnelle au futur. Toutefois, « si je te suis apparu » introduit en français une condition absente du grec : εἰς τοῦτο γὰρ ὤφθην σοι est une affirmation causale et téléologique (« car/c''est dans ce but que je te suis apparu »), non une protase conditionnelle.'
  naturalness: Le registre est globalement naturel, moderne et digne. La correction de la tournure conditionnelle améliore nettement la lisibilité et la fidélité. La formulation relative demeure nécessairement un peu explicative, ce que la note signale correctement.
  terminology: « Serviteur » pour ὑπηρέτης et « témoin » pour μάρτυς sont appropriés. « Je te suis apparu » / « je t'apparaîtrai » préserve, sans surinterprétation, le parallélisme des verbes d'apparition.
  issues:
  - severity: high
    issue: « Car si je te suis apparu » ajoute une condition.
    rationale: Le « si » français donne à entendre « si vraiment je suis apparu », alors que le grec affirme que l'apparition a eu lieu précisément en vue de la mission confiée.
