  to: '« Mais relève-toi et tiens-toi debout : je te suis apparu dans ce but, afin de faire de toi un serviteur et un témoin de ce que tu as vu de moi et de ce que tu verras lorsque je t’apparaîtrai[a]. »'
  rationale: La seule correction apportée supprime le conditionnel indu de « si » et restitue la relation de but exprimée par εἰς τοῦτο γὰρ. Le reste de la formulation conserve les choix justifiés du projet, notamment le double langage d'apparition et l'ambiguïté relative signalée en note.
