  variant: modern international French
source:
  edition: SBLGNT
  text: μάλιστα γνώστην ὄντα σε πάντων τῶν κατὰ Ἰουδαίους ⸀ἐθῶν τε καὶ ζητημάτων· διὸ ⸀δέομαι μακροθύμως ἀκοῦσαί μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/003.yaml
  text: especially because you are knowledgeable about all the customs and disputes among the Jews[b][a]. Therefore I beg you to listen to me patiently.
translation:
  language: fr
  text: surtout parce que vous connaissez bien toutes les coutumes et toutes les questions débattues chez les Juifs[a]. C’est pourquoi je vous prie[b] de m’écouter avec patience.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les coutumes et controverses juives ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous supplie » ; le verbe grec exprime une demande pressante.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάλιστα
  choice: surtout parce que
  rationale: Dans ce contexte, le mot met particulièrement en valeur la raison exprimée par la proposition participiale qui suit ; cette formulation rend naturellement ce lien en français.
- source_word: γνώστην ὄντα σε
  choice: vous connaissez bien
  rationale: Cette tournure exprime la connaissance approfondie d’Agrippa sans lui attribuer nécessairement le statut technique d’expert.
- source_word: πάντων τῶν κατὰ Ἰουδαίους ἐθῶν τε καὶ ζητημάτων
  choice: toutes les coutumes et toutes les questions débattues chez les Juifs
  rationale: « Chez les Juifs » rend la sphère indiquée par κατὰ Ἰουδαίους et porte naturellement sur les deux noms. « Questions débattues » conserve la possibilité que ζητήματα désigne des questions faisant l’objet de différends, sans les réduire à de simples conflits personnels.
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Cette expression marque clairement la conséquence tirée de la connaissance d’Agrippa.
- source_word: δέομαι
  choice: je vous prie
  rationale: « Je vous prie » exprime une demande respectueuse et insistante dans un registre actuel et digne, sans la dramatisation possible de « je vous supplie ».
- source_word: μακροθύμως ἀκοῦσαί μου
  choice: de m’écouter avec patience
  rationale: La formulation restitue directement la demande d’une écoute patiente et prolongée dans ce cadre judiciaire.
theological_decisions: []
