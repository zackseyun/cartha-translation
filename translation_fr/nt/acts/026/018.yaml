id: ACT.26.18
reference: Acts 26:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: fr
  text: pour leur ouvrir les yeux, afin qu’ils se tournent des ténèbres vers la lumière et de l’autorité de Satan[a] vers Dieu, et qu’ils reçoivent le pardon des péchés et une part d’héritage parmi ceux qui ont été sanctifiés[b] par la foi en moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pouvoir de Satan » ou « de la domination de Satan ». Le terme grec peut désigner l’autorité, le pouvoir exercé ou le domaine de domination.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi ceux qui ont été rendus saints ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: pour leur ouvrir les yeux
  rationale: Conserve l’image concrète des yeux ouverts et rend naturellement en français l’infinitif de but dans le contexte de l’envoi.
- source_word: τοῦ ἐπιστρέψαι
  choice: afin qu’ils se tournent
  rationale: Rend la visée exprimée par l’infinitif articulé tout en préservant le langage du retournement, sans imposer le passif « être convertis ».
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: des ténèbres vers la lumière
  rationale: Maintient le contraste métaphorique de la source dans une formulation française claire et traditionnelle sans archaïsme.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: de l’autorité de Satan
  rationale: ἐξουσία désigne ici l’autorité ou le pouvoir de domination. « Autorité » est direct et laisse ouverte la nuance de sphère dominatrice.
- source_word: ἐπὶ τὸν θεόν
  choice: vers Dieu
  rationale: Le mouvement de réorientation est mieux conservé par « vers Dieu » que par le simple « à Dieu », en parallèle avec « vers la lumière ».
- source_word: τοῦ λαβεῖν αὐτοὺς
  choice: qu’ils reçoivent
  rationale: Rend le second infinitif de but et la réception de biens accordés, dans un français fluide.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: le pardon des péchés
  rationale: Expression française actuelle, claire et consacrée pour la remise des péchés.
- source_word: κλῆρον
  choice: une part d’héritage
  rationale: Réunit les nuances de part attribuée et d’héritage attachées à κλῆρος, sans réduire le terme au seul héritage patrimonial.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: parmi ceux qui ont été sanctifiés
  rationale: Préserve la valeur verbale et l’état résultant du participe parfait passif.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: par la foi en moi
  rationale: Le datif est rendu instrumentalement, et εἰς ἐμέ indique sans ambiguïté l’objet personnel de la foi.
theological_decisions:
- issue: Rapport entre le retournement humain et l’action de la mission
  choice: afin qu’ils se tournent
  alternative: afin de les faire passer
  rationale: La formulation conserve la construction de but et le sujet implicite des personnes concernées, sans trancher au-delà du grec la relation entre action divine, prédication et réponse humaine.
- issue: Sens de κλῆρος dans le salut
  choice: une part d’héritage
  alternative: un héritage
  rationale: « Part d’héritage » garde ensemble l’idée d’une portion attribuée et celle de l’héritage eschatologique parmi le peuple sanctifié.
- issue: Valeur de πίστει τῇ εἰς ἐμέ
  choice: par la foi en moi
  alternative: par la confiance placée en moi
  rationale: La construction désigne ici la foi orientée vers Jésus et non un génitif contesté. « Foi » conserve le terme théologique courant sans exclure la notion de confiance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la succession des buts du grec tout en évitant une phrase artificiellement littérale. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils éclairent.
