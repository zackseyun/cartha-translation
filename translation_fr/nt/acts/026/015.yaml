  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: fr
  text: 'Et je dis[a] : « Qui es-tu, Seigneur ? » Et le Seigneur dit : « Je suis Jésus, celui que tu persécutes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui êtes-vous, monsieur ? » Le grec κύριε peut être une formule de respect ; « Seigneur » est retenu ici parce que le locuteur céleste s’identifie aussitôt comme Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: Je demandai alors
  rationale: δέ est ici un connecteur narratif léger, rendu naturellement par « alors ». Comme les paroles qui suivent sont une question, « demandai » est idiomatique en français et transmet fidèlement l'acte de parole. Le pronom explicite ἐγώ n'exige pas une mise en relief supplémentaire.
- source_word: Τίς εἶ, κύριε;
  choice: Qui es-tu, Seigneur ?
  rationale: τίς εἶ signifie directement « Qui es-tu ? ». « Seigneur » conserve la portée possible de κύριε dans cette apparition céleste, tout en signalant en note que le terme grec peut aussi être une formule de respect.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: Le Seigneur répondit
  rationale: L'article désigne le locuteur déjà identifié, d'où « Le Seigneur ». Puisque cette parole répond à la question précédente, « répondit » est plus naturel que la répétition de « dit » sans ajouter de contenu absent du grec.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: Je suis Jésus
  rationale: Cette formule exprime une identification directe. Le français « Je suis Jésus » rend suffisamment le pronom explicite ἐγώ sans introduire une insistance artificielle.
- source_word: ὃν σὺ διώκεις
  choice: celui que tu persécutes
  rationale: L'antécédent personnel masculin Jésus permet le tour français naturel « celui que ». Le présent « tu persécutes » exprime l'action en cours; le pronom σὺ est rendu par « tu » sans emphase ajoutée.
theological_decisions:
- issue: Sens de κύριε dans la question de Saul
  choice: Seigneur
  alternative: monsieur
  rationale: Le vocatif κύριε peut être une adresse respectueuse, mais le contexte d'une apparition céleste et l'identification immédiate du locuteur comme Jésus favorisent « Seigneur ». La note conserve l'ambiguïté lexicale réelle.
- issue: Identification narrative du locuteur par ὁ κύριος
  choice: le Seigneur
  alternative: celui-ci
  rationale: Le texte grec nomme explicitement le locuteur ὁ κύριος. Le traduire par « le Seigneur » préserve cette désignation sans atténuer sa portée christologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le tutoiement suit le singulier grec et l'usage courant des traductions bibliques françaises.
