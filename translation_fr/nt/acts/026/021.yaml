  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: fr
  text: C’est à cause de cela[a] que des Juifs se sont emparés de moi dans le temple[b] et cherchaient à me tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour cette raison » ou « à cause de ces choses ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne l’ensemble du complexe du temple, et non seulement le sanctuaire intérieur.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: C’est à cause de cela que
  rationale: La locution exprime la cause et renvoie aux actes et au témoignage que Paul vient d’évoquer. Cette tournure est naturelle en français et conserve ce lien rétrospectif.
- source_word: με
  choice: de moi
  rationale: Le pronom est le complément direct du participe συλλαβόμενοι; la construction française «s’emparer de» exige ici «de moi».
- source_word: Ἰουδαῖοι
  choice: des Juifs
  rationale: Le pluriel grec désigne les opposants juifs impliqués dans cet épisode, sans mettre en cause tout le peuple juif. «Des Juifs» rend explicite cette portée particulière en français naturel.
- source_word: συλλαβόμενοι
  choice: se sont emparés
  rationale: Le participe indique une prise hostile. «Se sont emparés de moi» restitue cette force sans suggérer une arrestation officielle.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du temple, et non exclusivement le sanctuaire intérieur. «Dans le temple» reste idiomatique, avec une note pour préciser la portée du terme.
- source_word: ἐπειρῶντο
  choice: ont tenté
  rationale: L’imparfait grec présente une tentative en cours. Dans cette phrase narrative, le passé composé «ont tenté» exprime clairement l’action non menée à terme, sans alourdir le français.
- source_word: διαχειρίσασθαι
  choice: de me tuer
  rationale: Dans ce contexte, le verbe signifie faire périr quelqu’un par violence. «Tuer» est clair et n’ajoute ni la qualification juridique de «meurtre» ni un euphémisme.
theological_decisions:
- issue: Portée de la désignation Ἰουδαῖοι dans un contexte polémique sensible
  choice: des Juifs
  alternative: les Juifs
  rationale: Le texte désigne les personnes juives qui ont saisi Paul lors de cet événement, non l’ensemble du peuple juif. En français, l’article indéfini pluriel prévient une généralisation ethnique tout en conservant le référent historique.
translation_notes:
  register: Français international moderne, naturel et digne. La structure causale est mise en relief sans résoudre au-delà du texte son lien avec le contexte précédent. Les notes sont placées immédiatement après les expressions qu’elles éclairent.
