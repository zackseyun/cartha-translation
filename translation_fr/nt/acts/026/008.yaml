  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: fr
  text: Pourquoi jugez-vous incroyable que Dieu ressuscite les morts ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἄπιστον κρίνεται παρ’ ὑμῖν
  choice: Pourquoi jugez-vous incroyable
  rationale: La tournure active est naturelle en français et rend fidèlement le jugement exprimé par κρίνεται ainsi que les personnes visées par παρ’ ὑμῖν.
- source_word: εἰ
  choice: que
  rationale: Après « juger incroyable », le français idiomatique emploie une proposition complétive avec « que » ; ici εἰ introduit le contenu tenu pour incroyable plutôt qu’une condition hypothétique à développer.
- source_word: ὁ θεὸς νεκροὺς ἐγείρει
  choice: Dieu ressuscite les morts
  rationale: Le présent « ressuscite » conserve la formulation directe du grec et n’ajoute ni modalité (« puisse ») ni simple capacité (« peut ressusciter »). « Ressusciter les morts » est l’expression française claire et consacrée pour ἐγείρειν νεκρούς.
theological_decisions:
- issue: Portée de l’affirmation sur la résurrection
  choice: « Dieu ressuscite les morts »
  alternative: « Dieu puisse ressusciter les morts » ou « Dieu peut ressusciter les morts »
  rationale: Le texte grec affirme l’action au présent sans verbe de possibilité. La traduction conserve cette force et évite de réduire la question à la seule capacité divine.
translation_notes:
  register: Français international moderne, direct et digne. La question rhétorique est rendue dans une syntaxe naturelle sans explicitation doctrinale ajoutée.
