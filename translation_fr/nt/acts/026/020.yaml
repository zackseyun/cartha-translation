id: ACT.26.20
reference: Acts 26:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: fr
  text: Mais j’ai annoncé, d’abord à ceux de Damas, puis à ceux de Jérusalem, dans toute la région de Judée et aux non-Juifs[a], qu’ils devaient se repentir[b] et se tourner vers Dieu, en accomplissant des actes dignes de la repentance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux nations ». Ici, le terme désigne les peuples non juifs.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se rendre par « changer », mais il désigne ici un changement qui conduit à se tourner vers Dieu, et non une simple révision d’opinion.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des actes qui conviennent à la repentance ». La phrase présente ces actes comme correspondant à la repentance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec l’affirmation précédente de Paul, de manière naturelle en français.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: à ceux de Damas
  rationale: Rend le datif désignant les personnes qui se trouvaient à Damas, sans alourdir la phrase.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: d’abord à ceux de Damas, puis aussi à Jérusalem
  rationale: Exprime l’ordre et l’ajout suggérés par πρῶτον… τε καί dans un français fluide.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: dans toute la région de Judée
  rationale: χώρα désigne ici une étendue géographique; « région » reste large et naturel.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans ce contraste avec Jérusalem et la Judée, ἔθνη désigne les peuples autres que le peuple juif; « non-Juifs » est immédiatement compréhensible en français moderne.
- source_word: ἀπήγγελλον
  choice: j’ai annoncé
  rationale: Rend l’annonce publique portée par ἀπαγγέλλω sans recourir à un terme excessivement ecclésiastique.
- source_word: μετανοεῖν
  choice: changer de manière de penser
  rationale: Reflète le changement intérieur exprimé par μετανοέω tout en laissant le contexte — se tourner vers Dieu et agir en conséquence — en préciser la portée morale et spirituelle.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: se tourner vers Dieu
  rationale: Préserve le mouvement vers Dieu sans suggérer nécessairement un retour à une appartenance antérieure, ce qui conviendrait mal aux non-Juifs.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: des actes dignes de ce changement
  rationale: Maintient le lien lexical avec μετανοεῖν et exprime des actes correspondant réellement au changement annoncé.
- source_word: πράσσοντας
  choice: en accomplissant
  rationale: Le participe décrit la conduite qui accompagne et manifeste le changement et le fait de se tourner vers Dieu.
theological_decisions:
- issue: Rapport entre le changement intérieur, le fait de se tourner vers Dieu et les actes
  choice: Les actes sont présentés comme correspondant au changement demandé et l’accompagnant.
  alternative: Comprendre les actes comme le contenu même du changement, ou comme le fondement méritoire de l’acceptation par Dieu.
  rationale: La syntaxe énonce d’abord μετανοεῖν et ἐπιστρέφειν comme réponse demandée, puis πράσσοντας décrit la conduite correspondante. La traduction conserve ce rapport sans déterminer davantage la fonction théologique des actes.
- issue: Sens de μετανοεῖν
  choice: changer de manière de penser
  alternative: se repentir
  rationale: Le choix principal rend explicitement l’idée de changement portée par le terme grec; une note conserve le terme religieux traditionnel et signale que le sens contextuel dépasse une simple révision intellectuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit la progression géographique et conserve la relation entre changement intérieur, orientation vers Dieu et conduite concrète, sans imposer une lecture confessionnelle.
