  to: Mais j’ai annoncé, d’abord à ceux de Damas, puis à ceux de Jérusalem, dans toute la région de Judée et aux non-Juifs[a], qu’ils devaient se repentir[b] et se tourner vers Dieu, en accomplissant des actes dignes de la repentance[c].
  rationale: La révision corrige le complément humain implicite de « Jérusalem » et adopte « se repentir », rendu français usuel et contextuellement fidèle de μετανοεῖν. Elle rétablit également « repentance » dans la dernière proposition afin de conserver le lien explicite du grec entre la réponse proclamée et les actes qui lui correspondent. Les notes sont conservées avec des formulations adaptées aux nouveaux choix.
