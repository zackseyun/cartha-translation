  naturalness: La révision est fluide en français international moderne. « À ceux de Jérusalem » rétablit un parallélisme clair avec « ceux de Damas », et « actes dignes de la repentance » est idiomatique dans un registre biblique moderne sans être archaïque.
  terminology: « Non-Juifs » rend clairement ἔθνεσιν dans son contraste contextuel avec la Judée. « Se repentir » et « repentance » maintiennent le lien lexical entre μετανοεῖν et μετανοίας, ainsi que la portée morale et religieuse du grec, sans ajouter de théorie sur le mérite des actes.
