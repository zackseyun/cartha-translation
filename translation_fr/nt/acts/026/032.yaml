  source_fidelity: 'Le sens du grec est bien rendu : Agrippa adresse à Festus une conclusion selon laquelle Paul aurait pu être libéré, si son appel à César n’avait pas déjà été formé. « Relâché » restitue adéquatement ἀπολελύσθαι sans imposer l’idée plus étroite d’un acquittement.'
