  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: fr
  text: 'Alors Agrippa dit à Festus : « Cet homme aurait pu être relâché s’il n’avait pas fait appel à César. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Alors
  rationale: Le connecteur marque ici la progression du récit et introduit la conclusion d’Agrippa ; « Alors » rend naturellement cette transition en français.
- source_word: ἔφη
  choice: dit
  rationale: L’imparfait de φημί sert couramment de formule introductive au discours dans le récit ; le passé simple « dit » convient au registre narratif français.
- source_word: Ἀπολελύσθαι
  choice: être relâché
  rationale: Le parfait infinitif de ἀπολύω désigne ici la mise en liberté. « Relâché » convient au contexte juridique sans impliquer nécessairement un acquittement formel.
- source_word: ἐδύνατο
  choice: aurait pu
  rationale: Avec la condition irréelle qui suit, cette tournure exprime clairement une possibilité passée qui ne s’est pas réalisée.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Cet homme
  rationale: Cette formulation conserve le démonstratif et désigne naturellement Paul en français.
- source_word: εἰ μὴ
  choice: s’il n’… pas
  rationale: La construction introduit une condition contraire aux faits, rendue naturellement par le plus-que-parfait après « si ».
- source_word: ἐπεκέκλητο
  choice: n’en avait pas appelé
  rationale: Dans le cadre juridique romain, ἐπικαλέω Καίσαρα désigne le recours à l’empereur. « En appeler à César » est l’expression juridique française précise et idiomatique.
- source_word: Καίσαρα
  choice: César
  rationale: « César » conserve le titre historique et la formulation juridique du texte grec, sans substituer l’explicitation « l’empereur ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le contexte juridique tout en restant immédiatement compréhensible ; aucune note n’est nécessaire, car « aurait pu être relâché » restitue directement la possibilité passée non réalisée.
