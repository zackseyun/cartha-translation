source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: fr
  text: 'Mais Paul répondit : « Je demanderais à Dieu que, dans peu de temps ou dans longtemps[a], non seulement toi, mais aussi tous ceux qui m’écoutent aujourd’hui, vous deveniez tels que je suis moi-même — à l’exception de ces chaînes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « presque ou tout à fait » ; l’expression grecque est difficile et peut renvoyer au degré, à l’effort, à la durée ou à l’ampleur.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: Je prie Dieu
  rationale: Le potentiel optatif avec ἄν exprime ici un souhait adressé à Dieu. « Je prie Dieu » est naturel en français et conserve explicitement la dimension de prière.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: dans peu de temps ou dans longtemps
  rationale: Cette expression difficile peut porter sur le temps, le degré ou l’effort. La formulation retenue donne un sens temporel plausible dans l’échange avec Agrippa, tout en signalant les autres possibilités en note.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: non seulement toi, mais encore tous ceux qui m’écoutent aujourd’hui
  rationale: La traduction maintient l’opposition emphatique et le sens actuel du participe, tout en employant une tournure française fluide.
- source_word: γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: vous deveniez tels que je suis, moi aussi
  rationale: « Deveniez » exprime l’état auquel Paul souhaite que ses auditeurs parviennent. « Tels que je suis, moi aussi » conserve la comparaison et la présence de καί sans réduire la phrase à un simple « comme moi ».
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: à l’exception de ces chaînes
  rationale: παρεκτός marque nettement l’exception, et « chaînes » rend concrètement δεσμοί dans le contexte de l’emprisonnement de Paul.
theological_decisions:
- issue: Interprétation de ἐν ὀλίγῳ καὶ ἐν μεγάλῳ en lien avec la remarque précédente d’Agrippa
  choice: 'Contraste temporel : « dans peu de temps ou dans longtemps »'
  alternative: « presque ou tout à fait » ; « avec peu ou beaucoup d’efforts » ; « dans une faible ou une grande mesure »
  rationale: Le grec reste difficile et peut concerner le temps, le degré ou l’effort. Le texte principal adopte un sens contextuellement plausible, tandis que la note préserve l’ambiguïté réelle sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement correspond au singulier σέ adressé à Agrippa ; le passage au pluriel « vous deveniez » englobe ensuite Agrippa et tous les auditeurs. La ponctuation finale met en relief l’exception concernant les chaînes.
