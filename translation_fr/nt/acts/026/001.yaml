  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: fr
  text: 'Alors Agrippa dit à Paul : « Tu as la permission de parler pour ta défense. » Paul tendit alors la main et présenta sa défense :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη
  choice: Alors Agrippa dit à Paul
  rationale: δέ marque ici la progression du récit. « Alors » assure un enchaînement naturel, tandis que « dit à Paul » rend idiomatiquement πρὸς τὸν Παῦλον ἔφη.
- source_word: Ἐπιτρέπεταί σοι
  choice: Tu as la permission
  rationale: Cette formulation française naturelle conserve l’idée d’une autorisation officiellement accordée, exprimée par le passif grec.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: de parler pour ta défense
  rationale: Dans ce cadre judiciaire, ὑπὲρ σεαυτοῦ désigne le fait de parler en sa propre faveur. La formulation retenue exprime clairement cette valeur sans développer le sens au-delà du contexte.
- source_word: τότε
  choice: alors
  rationale: Le second « alors » maintient explicitement la succession temporelle indiquée par τότε.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: tendit la main
  rationale: Rendu direct du participe aoriste et de son complément, sans préciser la nature exacte du geste.
- source_word: ἀπελογεῖτο
  choice: présenta sa défense
  rationale: Le verbe désigne ici l’exercice d’une défense, notamment dans un cadre judiciaire. L’imparfait grec introduit le discours qui suit, sans imposer en français une nuance inchoative non explicite.
