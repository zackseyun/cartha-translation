  text: Then the king rose[a], and the governor and Bernice and those seated with them,
translation:
  language: fr
  text: Alors le roi, le gouverneur, Bérénice[a] et ceux qui étaient assis avec eux se levèrent,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bérénice : forme parfois transcrite « Bernice ».'
