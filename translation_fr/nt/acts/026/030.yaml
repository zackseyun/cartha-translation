    rationale: En français, cette construction à verbe singulier peut présenter les éléments introduits par « ainsi que » comme un ajout incident, plutôt que comme sujets conjoints de l’action. La syntaxe grecque coordonne tous les membres de la liste après ἀνέστη.
  - severity: low
    issue: « Siégeaient » est légèrement surinterprétatif
    rationale: συγκαθήμενοι désigne d’abord des personnes assises avec eux. « Siéger » peut évoquer l’exercice d’une fonction dans une assemblée officielle.
