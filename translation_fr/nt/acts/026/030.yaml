translation_notes:
  register: Français international moderne, digne et fluide. La phrase conserve la virgule finale, puisque le verset se poursuit syntaxiquement au verset suivant. Le verbe « siéger » est compris ici dans son sens concret d’être assis dans une assemblée officielle, sans attribuer au groupe une charge particulière.
