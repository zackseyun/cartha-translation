lexical_decisions:
- source_word: Ἀνέστη
  choice: se leva
  rationale: L’aoriste de ἀνίστημι décrit ici le fait de se lever de son siège. « Se leva » est naturel, précis et adapté au cadre officiel.
- source_word: τε
  choice: Alors / ainsi que
  rationale: La première particule marque la progression du récit, rendue par « Alors ». La seconde contribue à la coordination étroite de l’énumération, rendue naturellement par « ainsi que ».
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Le grec emploie le titre βασιλεύς plutôt que le nom d’Agrippa ; la traduction conserve ce titre.
- source_word: ὁ ἡγεμὼν
  choice: le gouverneur
  rationale: Dans ce contexte des Actes, ἡγεμών désigne le gouverneur romain de la province ; « gouverneur » est l’équivalent français précis et usuel.
- source_word: Βερνίκη
  choice: Bérénice
  rationale: « Bérénice » est la forme française courante et établie de ce nom propre grec.
- source_word: οἱ συγκαθήμενοι αὐτοῖς
  choice: ceux qui siégeaient avec eux
  rationale: Le participe désigne ceux qui étaient assis avec eux. « Siégeaient » conserve cette idée tout en convenant au cadre officiel de l’audience, sans préciser indûment leur fonction.
- source_word: καὶ
  choice: ainsi que / et
  rationale: Les conjonctions grecques coordonnent les personnes et le groupe mentionnés ; la formulation française varie légèrement les liens pour éviter une accumulation maladroite tout en préservant la structure additive.
