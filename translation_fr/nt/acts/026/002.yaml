id: ACT.26.2
reference: Acts 26:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: fr
  text: « Roi Agrippa, je m’estime heureux[a] du fait que je vais aujourd’hui présenter ma défense devant vous au sujet de tout ce dont je suis accusé par des Juifs, »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « privilégié ». Dans ce contexte judiciaire, le mot grec exprime probablement la situation favorable de Paul, plutôt qu’une simple émotion de bonheur.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: au sujet de tout ce dont
  rationale: περί avec le génitif introduit le sujet traité. Cette formulation conserve la portée de πάντων et le lien avec la proposition relative, dans un français naturel.
- source_word: ἐγκαλοῦμαι
  choice: je suis accusé
  rationale: Le verbe désigne ici une accusation formelle dans un cadre judiciaire. « Je suis accusé » reste précis sans imposer la nuance plus technique de « mis en accusation ».
- source_word: ὑπὸ Ἰουδαίων
  choice: par des Juifs
  rationale: ὑπό indique les agents de l’accusation. Dans ce contexte, il s’agit de Juifs qui accusent Paul, et non de l’ensemble du peuple juif; l’article n’est pas exprimé dans le grec.
- source_word: βασιλεῦ Ἀγρίππα
  choice: Roi Agrippa
  rationale: Le vocatif est rendu par une apostrophe directe, naturelle et digne en français moderne.
- source_word: ἥγημαι ἐμαυτὸν
  choice: je m’estime
  rationale: ἡγέομαι avec le pronom réfléchi signifie « se considérer » ou « s’estimer ». « Je m’estime » est idiomatique et conserve la construction réflexive.
- source_word: μακάριον
  choice: heureux
  rationale: Dans cette audience judiciaire, le mot exprime surtout une situation favorable ou un privilège, plutôt qu’une émotion passagère. « Heureux » conserve aussi l’amplitude sémantique du terme grec.
- source_word: ἐπὶ σοῦ
  choice: devant vous
  rationale: L’expression évoque la comparution en présence d’Agrippa. Le vouvoiement respecte l’usage français moderne envers un roi, bien que le grec emploie naturellement la deuxième personne du singulier.
- source_word: μέλλων
  choice: de pouvoir
  rationale: Avec l’infinitif, μέλλων indique ici l’action imminente que Paul va accomplir. « De pouvoir » exprime naturellement l’occasion favorable de présenter sa défense, tout en laissant « aujourd’hui » marquer l’imminence.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent direct et courant de σήμερον.
- source_word: ἀπολογεῖσθαι
  choice: présenter ma défense
  rationale: 'Le verbe possède ici un sens judiciaire: prendre la parole pour répondre aux accusations. « Présenter ma défense » restitue ce registre plus précisément que le simple « me défendre ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’ordre de la phrase a été légèrement réorganisé pour une apostrophe et une progression naturelles. « Par des Juifs » évite de transformer les accusateurs concernés en une affirmation générale sur tous les Juifs. Le verset conserve sa ponctuation ouverte puisqu’il se poursuit au verset suivant.
