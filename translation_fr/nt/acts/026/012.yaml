  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: fr
  text: Dans ce contexte[a], alors que je me rendais à Damas avec l’autorité et le mandat reçus des grands prêtres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Dans ces choses », expression qui renvoie aux actes et aux intentions de Paul mentionnés précédemment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Dans ces circonstances
  rationale: Cette formulation française naturelle conserve le renvoi aux actes et aux intentions de Paul mentionnés juste avant, sans introduire l’idée plus interprétative d’une « mission ».
- source_word: πορευόμενος
  choice: alors que je me rendais
  rationale: Le participe présent exprime une action en cours, contemporaine de l’événement raconté au verset suivant. Cette proposition temporelle est claire et idiomatique en français.
- source_word: εἰς τὴν Δαμασκὸν
  choice: à Damas
  rationale: Avec un nom de ville et un verbe de déplacement, « à Damas » est la tournure française naturelle.
- source_word: μετ’ ἐξουσίας
  choice: avec l’autorité
  rationale: ἐξουσία désigne ici une autorité officielle et déléguée, plutôt qu’une puissance brute.
- source_word: ἐπιτροπῆς
  choice: le mandat
  rationale: « Mandat » exprime une charge ou une autorisation officiellement confiée et s’associe naturellement à « autorité ».
- source_word: τῆς τῶν ἀρχιερέων
  choice: des grands prêtres
  rationale: Le génitif indique que l’autorité et le mandat viennent des grands prêtres. La formulation française reste concise et naturelle.
- source_word: ἀρχιερέων
  choice: grands prêtres
  rationale: Dans ce contexte, le pluriel désigne les membres de l’aristocratie sacerdotale et non plusieurs titulaires simultanés de la fonction unique de grand prêtre.
