source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: fr
  text: 'Et c’est aussi ce que j’ai fait à Jérusalem : j’ai moi-même enfermé dans des prisons beaucoup de saints[a], ayant reçu l’autorisation des grands prêtres ; et, quand on les mettait à mort, j’ai voté contre eux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, les « saints » sont les membres du peuple saint de Dieu, c’est-à-dire ceux qui croient en Jésus ; il ne s’agit pas seulement de personnes reconnues plus tard comme saintes.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque évoque littéralement le dépôt d’un « caillou de vote » et peut aussi se traduire par « j’ai donné ma voix contre eux ». Les mots « contre eux » sont implicites dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: Et c’est bien ce que j’ai fait
  rationale: La proposition reprend l’activité de persécution évoquée auparavant. « C’est bien ce que j’ai fait » rend naturellement en français la reprise et la valeur confirmative de καί.
- source_word: πολλούς τε τῶν ἁγίων
  choice: beaucoup de saints
  rationale: ἅγιοι désigne ici les membres de la communauté croyante. « Saints » conserve le terme néotestamentaire, avec une note empêchant de le comprendre au sens plus tardif de personnes officiellement canonisées.
- source_word: ἐγὼ ἐν φυλακαῖς κατέκλεισα
  choice: j’ai moi-même enfermé dans des prisons
  rationale: « Moi-même » restitue l’insistance de ἐγώ. Le verbe « enfermer » conserve la force de κατακλείω, et le pluriel « des prisons » correspond à φυλακαῖς.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: après avoir reçu ce pouvoir des grands prêtres
  rationale: La tournure participiale indique le fondement préalable de son action. « Pouvoir » rend ici l’autorité accordée par les grands prêtres sans préciser davantage sa forme institutionnelle.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: quand on les mettait à mort
  rationale: Le passif grec est rendu par le « on » indéfini, idiomatique en français. « Mettre à mort » exprime la gravité de ἀναιρέω sans imposer un cadre judiciaire plus précis que le texte.
- source_word: κατήνεγκα ψῆφον
  choice: j’ai voté contre eux
  rationale: La formule grecque évoque le dépôt d’un caillou de vote. « J’ai voté contre eux » en donne le sens naturel en français, tandis que la note signale l’image concrète et le fait que « contre eux » est fourni par le contexte.
theological_decisions:
- issue: Sens de ἅγιοι
  choice: « saints », au sens de membres du peuple saint de Dieu qui croient en Jésus
  alternative: « membres du peuple saint » ou « croyants »
  rationale: Le choix conserve le vocabulaire théologique du Nouveau Testament sans réserver le terme à une élite spirituelle ou à des personnes canonisées.
- issue: Portée de κατήνεγκα ψῆφον
  choice: « j’ai voté contre eux »
  alternative: « j’ai donné ma voix contre eux » ou, dans un sens plus général, « j’ai approuvé leur condamnation »
  rationale: Le terme ψῆφος favorise l’idée d’un vote personnel. La traduction ne précise toutefois ni l’assemblée concernée ni la fonction officielle de Paul, éléments que le texte ne définit pas.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la progression du grec, l’insistance portée par ἐγώ et le pluriel « prisons », tout en évitant une syntaxe excessivement calquée.
