    issue: « Et c’est bien ce que j’ai fait » traduit καί par « bien ».
    rationale: 'Dans ὃ καὶ ἐποίησα, καί a naturellement une valeur additive : Paul dit que c’est aussi ce qu’il a fait. « Bien » peut donner une nuance de confirmation ou d’intensification qui n’est pas requise.'
  - severity: low
    issue: « ce pouvoir » est moins exact que « l’autorisation » dans ce contexte.
    rationale: ἐξουσία peut désigner l’autorité ou l’autorisation conférée. Puisqu’elle est reçue « des grands prêtres » pour accomplir ces actes, « l’autorisation » exprime plus nettement l’habilitation sans suggérer un pouvoir personnel général.
