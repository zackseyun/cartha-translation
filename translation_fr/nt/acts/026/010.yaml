- from: 'Et c’est bien ce que j’ai fait à Jérusalem : j’ai moi-même enfermé dans des prisons beaucoup de saints[a], après avoir reçu ce pouvoir des grands prêtres ; et, quand on les mettait à mort, j’ai voté contre eux[b].'
  to: 'Et c’est aussi ce que j’ai fait à Jérusalem : j’ai moi-même enfermé dans des prisons beaucoup de saints[a], ayant reçu l’autorisation des grands prêtres ; et, quand on les mettait à mort, j’ai voté contre eux[b].'
  rationale: La révision remplace « bien » par « aussi » afin de rendre la valeur additive de καί, et « ce pouvoir » par « l’autorisation », qui convient mieux à l’autorité reçue des grands prêtres. Le reste de la traduction et les ancres de notes sont conservés, car ils respectent le grec et sont naturels en français international moderne.
