id: ACT.26.31
reference: Acts 26:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀναχωρήσαντες ἐλάλουν πρὸς ἀλλήλους λέγοντες ὅτι Οὐδὲν θανάτου ⸂ἢ δεσμῶν ἄξιον⸃ ⸀τι πράσσει ὁ ἄνθρωπος οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: fr
  text: 'Après s’être retirés, ils se disaient les uns aux autres : « Cet homme ne fait rien qui mérite la mort ou l’emprisonnement[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des chaînes ». Le grec désigne littéralement des liens ou des chaînes, mais évoque ici vraisemblablement l’emprisonnement ou la détention.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναχωρήσαντες
  choice: Après s’être retirés
  rationale: Le participe aoriste indique qu’ils se sont éloignés avant d’échanger entre eux. « Se retirer » exprime naturellement ce mouvement hors de la scène publique.
- source_word: ἐλάλουν πρὸς ἀλλήλους λέγοντες
  choice: ils se disaient les uns aux autres
  rationale: L’imparfait français conserve l’aspect continu de ἐλάλουν, tandis que la tournure réciproque rend πρὸς ἀλλήλους. Cette formulation évite la lourdeur d’un calque tel que « ils parlaient entre eux, disant ».
- source_word: Οὐδὲν … ἄξιον
  choice: ne fait rien qui mérite
  rationale: Cette construction française claire exprime qu’aucun acte de cet homme ne justifie les peines mentionnées, sans ajouter l’idée explicite d’un crime.
- source_word: θανάτου ἢ δεσμῶν
  choice: la mort ou l’emprisonnement
  rationale: « La mort » désigne ici la peine capitale. δεσμοί signifie littéralement « liens » ou « chaînes », mais, dans ce contexte judiciaire, renvoie à la détention; « emprisonnement » en communique clairement le sens.
- source_word: τι πράσσει
  choice: ne fait rien
  rationale: πράσσει décrit de manière générale ce que l’homme fait. Le présent français préserve cette généralité sans préciser indûment qu’il commet une infraction.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: Cet homme
  rationale: La formule désigne directement Paul et se rend de façon naturelle et fidèle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait restitue la conversation en cours, et la formulation directe convient à une délibération judiciaire.
