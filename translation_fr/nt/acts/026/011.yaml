id: ACT.26.11
reference: Acts 26:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: fr
  text: Dans toutes les synagogues, je les punissais souvent et cherchais à les forcer à blasphémer. Dans l’excès de ma fureur contre eux, je les persécutais jusque dans les villes étrangères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « jusque dans les villes du dehors »; il s’agit probablement de villes situées hors de la Judée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: Dans toutes les synagogues
  rationale: 'κατά avec l’accusatif a ici une valeur distributive et locale : l’action se répétait dans l’ensemble des synagogues concernées.'
- source_word: πολλάκις τιμωρῶν
  choice: je les punissais souvent
  rationale: L’imparfait français exprime naturellement l’action répétée de l’imparfait grec, tandis que « souvent » rend clairement πολλάκις.
- source_word: ἠνάγκαζον
  choice: cherchais à les forcer
  rationale: 'Cette formulation préserve la contrainte tout en rendant la valeur imperfective et vraisemblablement conative du verbe : Paul renouvelait ses tentatives sans que leur réussite soit affirmée.'
- source_word: βλασφημεῖν
  choice: à blasphémer
  rationale: Le complément de l’acte blasphématoire n’étant pas exprimé en grec, le français le laisse également indéterminé.
- source_word: περισσῶς τε ἐμμαινόμενος αὐτοῖς
  choice: Dans l’excès de ma fureur contre eux
  rationale: La tournure rend à la fois l’intensification de περισσῶς et l’hostilité furieuse, presque frénétique, de ἐμμαινόμενος, sans suggérer un diagnostic de maladie mentale.
- source_word: ἐδίωκον
  choice: je les persécutais
  rationale: L’imparfait français conserve le caractère continu et répété de l’imparfait grec; dans ce contexte, διώκω désigne clairement la persécution hostile.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: jusque dans les villes étrangères
  rationale: Cette traduction idiomatique exprime l’extension de la persécution à des villes situées hors du territoire envisagé, tout en signalant en note le sens plus littéral de ἔξω.
theological_decisions:
- issue: Objet de βλασφημεῖν
  choice: « blasphémer », sans complément explicite
  alternative: « blasphémer Jésus » ou « maudire la confession chrétienne »
  rationale: Le contexte peut orienter vers Jésus ou le message chrétien, mais le grec ne précise aucun objet; la traduction conserve cette indétermination.
- issue: Résultat de la contrainte exprimée par ἠνάγκαζον
  choice: « cherchais à les forcer »
  alternative: « les forçais »
  rationale: La valeur imperfective peut être comprise comme une tentative répétée. La formulation retenue évite d’affirmer que les croyants ont effectivement blasphémé, résultat que le verset ne formule pas sans ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. Les imparfaits structurent le récit d’actions habituelles ou prolongées; « dans l’excès de ma fureur » garde la forte intensité du grec sans employer une expression pouvant évoquer la maladie mentale.
