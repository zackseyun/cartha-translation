  source_fidelity: 'Le sens général est fidèlement rendu : le secours vient explicitement de Dieu, le témoignage se poursuit jusqu''au jour présent, et Paul limite son message à ce que les prophètes et Moïse ont annoncé. Toutefois, le datif μικρῷ τε καὶ μεγάλῳ désigne les destinataires du témoignage (« aux »), non l''auditoire devant lequel il est prononcé (« devant »).'
