id: ACT.26.22
reference: Acts 26:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: fr
  text: 'Ainsi donc, ayant reçu le secours qui vient de Dieu, je reste debout jusqu’à ce jour et je témoigne aux petits comme aux grands[a], sans rien dire en dehors de ce que les prophètes et Moïse ont annoncé comme devant se produire[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Les petits comme les grands » désigne les personnes de tout rang social.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction : « sans rien dire au-delà de ce que les prophètes et Moïse ont annoncé comme devant se produire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: le secours qui vient de Dieu
  rationale: « Secours » exprime naturellement une aide reçue dans l’épreuve, tandis que la relative conserve explicitement Dieu comme source.
- source_word: τυχὼν
  choice: ayant reçu
  rationale: Le participe aoriste indique ici l’obtention du secours; « ayant reçu » est naturel et garde le rapport circonstanciel avec le verbe principal.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: je reste debout jusqu’à ce jour
  rationale: Le parfait ἕστηκα décrit un état présent résultant d’une action antérieure. « Je reste debout » rend à la fois la persistance et la situation actuelle de Paul.
- source_word: μαρτυρόμενος
  choice: je témoigne
  rationale: Le verbe conserve la portée publique et judiciaire du témoignage tout en restant courant en français.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: devant les petits comme devant les grands
  rationale: Cette formulation garde l’image et le parallélisme grecs; le contexte vise des personnes de tout rang social.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: sans rien dire en dehors de
  rationale: La tournure conserve la force de la négation et la possibilité sémantique de « rien au-delà de / hormis » sans paraphrase excessive.
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: les prophètes et Moïse
  rationale: L’ordre grec est conservé, ainsi que l’association des deux témoins scripturaires.
- source_word: ἐλάλησαν μελλόντων γίνεσθαι
  choice: ont annoncé comme devant arriver
  rationale: « Annoncé » convient au discours prophétique, et « comme devant arriver » conserve la perspective future relative à leur parole sans imposer une imminence.
theological_decisions:
- issue: Portée de l’affirmation de continuité avec les Écritures d’Israël
  choice: Paul affirme ne rien enseigner en dehors de ce que les prophètes et Moïse ont annoncé.
  alternative: Paul affirmerait seulement un accord général avec les Écritures, sans revendiquer l’accomplissement de leurs annonces.
  rationale: La construction οὐδὲν ἐκτὸς λέγων ὧν exprime fortement la délimitation du contenu de son témoignage par les annonces scripturaires; la traduction n’en précise toutefois pas davantage le mode d’accomplissement.
translation_notes:
  register: Français international actuel, digne et oralement fluide. « Ainsi donc » marque l’inférence de οὖν; « reste debout » préserve l’image et la valeur résultative du parfait. Les marqueurs de notes figurent tous dans le texte principal.
