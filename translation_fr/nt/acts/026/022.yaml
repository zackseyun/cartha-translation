  to: 'Ainsi donc, ayant reçu le secours qui vient de Dieu, je reste debout jusqu’à ce jour et je témoigne aux petits comme aux grands[a], sans rien dire en dehors de ce que les prophètes et Moïse ont annoncé comme devant se produire[b] :'
