  - severity: low
    issue: La corrélation τε ... καί peut être rendue plus explicitement.
    rationale: « Tant ... qu’... » est l’équivalent français idiomatique le plus direct de « à la fois ... et ... » et met mieux en relief les deux destinataires associés.
