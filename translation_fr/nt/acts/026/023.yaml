  naturalness: La phrase est claire et d’un registre biblique moderne. « Tant au peuple qu’aux non-Juifs » exprime plus directement la corrélation τε ... καί que « au peuple comme aux non-Juifs », tout en restant naturel.
  terminology: « Messie » convient au titre χριστός dans ce contexte prophétique. « Non-Juifs » communique clairement la valeur contrastive de ἔθνη face à λαός; la note conserve à juste titre l’alternative plus littérale « nations ».
