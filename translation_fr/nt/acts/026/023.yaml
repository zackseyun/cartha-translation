source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: fr
  text: que le Messie devait souffrir[a] et que, le premier à ressusciter d’entre les morts[b], il annoncerait la lumière tant au peuple[c] qu’aux non-Juifs[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός désigne ici l’oint annoncé par les prophètes.
    reason: alternative_reading
  - marker: b
    text: Litt. « le premier issu de la résurrection des morts ». L’expression grecque est condensée; elle affirme une priorité sans en préciser ici la nature.
    reason: source_ambiguity
  - marker: c
    text: Ici, « le peuple » désigne vraisemblablement le peuple juif, par contraste avec les non-Juifs.
    reason: lexical_alternative
  - marker: d
    text: Ou « aux nations ». Dans ce contexte, il s’agit des peuples autres que le peuple juif.
    reason: lexical_alternative
lexical_decisions:
- source_word: παθητὸς
  choice: devait souffrir
  rationale: Dans ce résumé de l’annonce prophétique, l’adjectif exprime que la souffrance était prévue pour le Messie. La tournure verbale est naturelle en français sans transformer cette idée en nécessité philosophique abstraite.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre dans un contexte prophétique. « Messie » rend clairement le sens de l’oint attendu; « le Christ » demeure possible.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: le premier à ressusciter d’entre les morts
  rationale: Cette formulation française conserve l’affirmation de priorité exprimée par πρῶτος et rend naturellement l’expression grecque condensée, sans préciser en quoi consiste cette priorité.
- source_word: φῶς
  choice: la lumière
  rationale: Le nom est conservé comme métaphore ouverte de révélation, de salut et d’espérance, sans en réduire la portée par une explicitation.
- source_word: μέλλει καταγγέλλειν
  choice: il annoncerait
  rationale: Dans cette formulation indirecte portant sur ce que les prophètes avaient annoncé, le conditionnel français exprime naturellement le futur envisagé depuis ce point de vue. « Proclamerait » serait également possible, mais « annoncerait » est plus courant et correspond bien à καταγγέλλω.
- source_word: τῷ τε λαῷ
  choice: au peuple
  rationale: Le grec dit simplement « au peuple ». Le contraste avec les non-Juifs indique vraisemblablement le peuple juif, mais le texte principal préserve la formulation non explicitée.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans l’opposition entre λαός et ἔθνη, le terme désigne les peuples autres qu’Israël. « Non-Juifs » rend cette opposition clairement en français moderne; « nations » reste une traduction plus littérale.
- source_word: τε ... καὶ
  choice: au peuple comme aux non-Juifs
  rationale: La construction corrélative associe les deux destinataires. « Comme aux » l’exprime avec fluidité en français.
theological_decisions:
- issue: Portée de la priorité du Messie dans la résurrection
  choice: Le texte affirme qu’il est le premier à ressusciter d’entre les morts, sans expliquer le sens précis de cette priorité.
  alternative: Le premier de la résurrection finale, ou le premier ressuscité pour ne plus mourir.
  rationale: Le grec exprime la priorité par πρῶτος, mais ne développe pas ici sa relation avec les retours temporaires à la vie rapportés ailleurs. La traduction conserve cette tension sans ajouter d’explication doctrinale.
- issue: Référent de « peuple »
  choice: Conserver « le peuple » dans le texte, avec le peuple juif comme référent probable indiqué en note.
  alternative: Expliciter « le peuple juif » ou « Israël » dans le texte principal.
  rationale: λαός reste non qualifié, même si son opposition à ἔθνη rend le référent juif très probable. La traduction évite d’insérer l’interprétation dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les deux propositions parallèles introduites en grec par εἰ ... εἰ, tout en restant naturelle. « D’entre les morts » maintient la tournure biblique précise, et « la lumière » demeure une métaphore non explicitée.
