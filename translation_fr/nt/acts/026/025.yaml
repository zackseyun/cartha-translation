  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: fr
  text: 'Mais Paul répondit : « Je ne suis pas fou[a], Votre Excellence Festus[b] ; je prononce au contraire des paroles de vérité et de bon sens[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je n’ai pas perdu la raison ».
    reason: lexical_alternative
  - marker: b
    text: « Votre Excellence » rend un titre officiel de courtoisie employé pour s’adresser à un haut fonctionnaire.
    reason: cultural_note
  - marker: c
    text: Le terme grec peut aussi évoquer la sobriété, la santé d’esprit ou le jugement raisonnable.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre l’accusation de Festus au verset précédent et la réponse de Paul.
- source_word: μαίνομαι
  choice: je ne suis pas fou
  rationale: Le verbe désigne le fait d’être fou ou d’avoir perdu la raison. Cette formulation directe et naturelle reprend précisément l’accusation de Festus.
- source_word: φησίν
  choice: répondit
  rationale: Le présent historique grec est rendu au passé, conformément à l’usage narratif naturel en français. Dans ce contexte, « répondit » explicite sans excès que Paul réagit aux paroles de Festus.
- source_word: κράτιστε
  choice: très honorable
  rationale: Ce superlatif sert de titre de courtoisie officiel envers un haut fonctionnaire. « Très honorable » garde la déférence formelle tout en restant intelligible en français moderne.
- source_word: ἀληθείας
  choice: vraies
  rationale: L’adjectif français rend naturellement le génitif de qualité grec « de vérité » et qualifie directement les paroles de Paul.
- source_word: σωφροσύνης
  choice: sensées
  rationale: Le terme évoque la santé d’esprit, la maîtrise de soi et le jugement raisonnable. « Sensées » maintient le contraste immédiat avec l’accusation de folie.
- source_word: ῥήματα
  choice: paroles
  rationale: Ce choix conserve le nom concret au pluriel et convient au registre digne du discours.
- source_word: ἀποφθέγγομαι
  choice: je prononce
  rationale: Le verbe exprime le fait de parler ouvertement ou d’énoncer. « Je prononce » en préserve la force un peu plus soutenue qu’un simple « je dis ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le contraste rhétorique entre la folie alléguée et le caractère vrai, raisonnable et maîtrisé des paroles de Paul, sans rendre l’adresse officielle à Festus artificiellement archaïque.
