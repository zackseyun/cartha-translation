- from: 'Mais Paul répondit : « Je ne suis pas fou[a], très honorable Festus[b] ; je prononce au contraire des paroles vraies et sensées[c]. »'
  to: 'Mais Paul répondit : « Je ne suis pas fou[a], Votre Excellence Festus[b] ; je prononce au contraire des paroles de vérité et de bon sens[c]. »'
  rationale: La révision remplace l’adresse moins idiomatique « très honorable » par « Votre Excellence », formule française moderne et fonctionnellement équivalente pour un haut responsable. Elle restitue également plus directement les expressions grecques « de vérité et de σωφροσύνη » par « de vérité et de bon sens », tout en signalant en note l’étendue sémantique de σωφροσύνη. Le passé narratif « répondit » reste acceptable pour le présent historique φησίν dans ce contexte de réplique.
