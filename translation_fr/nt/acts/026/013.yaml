id: ACT.26.13
reference: Acts 26:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: fr
  text: En plein midi, sur la route, j’ai vu, ô roi, une lumière venant du ciel, plus éclatante que le soleil[a], qui a resplendi autour de moi et de ceux qui faisaient route avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « surpassant l’éclat du soleil » ; le grec souligne que cette lumière dépassait l’éclat du soleil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: En plein midi
  rationale: La construction temporelle désigne le milieu du jour. « En plein midi » est naturelle en français et souligne la pleine lumière du jour, pertinente dans la comparaison qui suit.
- source_word: κατὰ τὴν ὁδὸν
  choice: sur la route
  rationale: L’expression situe la vision pendant le trajet. « Sur la route » est concrète, idiomatique et fidèle au contexte narratif.
- source_word: εἶδον
  choice: j’ai vu
  rationale: L’aoriste de perception appelle ici le passé composé, temps narratif courant en français moderne.
- source_word: βασιλεῦ
  choice: ô roi
  rationale: Le vocatif est conservé comme adresse directe et solennelle à Agrippa, sans ajouter son nom au texte.
- source_word: οὐρανόθεν
  choice: venant du ciel
  rationale: Cette formulation exprime clairement l’origine céleste de la lumière et convient à la portée révélatrice du récit.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: plus éclatante que le soleil
  rationale: Ὑπέρ avec l’accusatif indique que la lumière surpassait l’éclat solaire. Cette formulation rend le sens avec naturel, sans la lourdeur de « plus éclatante que l’éclat du soleil ».
- source_word: περιλάμψαν
  choice: qui a resplendi autour
  rationale: Le verbe composé exprime une lumière qui éclaire tout autour. La relative française conserve le lien avec « une lumière » et rend naturellement le participe aoriste.
- source_word: φῶς
  choice: une lumière
  rationale: L’article indéfini introduit naturellement en français le phénomène que Paul dit avoir vu.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: ceux qui faisaient route avec moi
  rationale: La formulation rend le participe présent et σύν sans préciser davantage l’identité des compagnons.
theological_decisions:
- issue: Sens de οὐρανόθεν dans le contexte de la vision
  choice: venant du ciel
  alternative: venant du ciel visible
  rationale: « Du ciel » préserve la portée céleste du récit dans Luc–Actes sans définir davantage la nature de l’événement ni réduire le terme au seul espace atmosphérique.
translation_notes:
  register: Français international moderne, clair et digne. « Ô roi » conserve la solennité du vocatif grec ; le reste de la phrase privilégie une syntaxe courante et fluide. Le marqueur de note est placé après l’expression qu’il précise.
