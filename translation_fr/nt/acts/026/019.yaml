source:
  edition: SBLGNT
  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: fr
  text: Ainsi donc, roi Agrippa, je n’ai pas désobéi à la vision céleste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à la vision venue du ciel».
    reason: Alternative lexicale préservant la possibilité que οὐρανίῳ indique spécialement l’origine de la vision.
lexical_decisions:
- source_word: Ὅθεν
  choice: Ainsi donc
  rationale: Introduit la conséquence tirée du récit précédent de la rencontre et de la mission de Paul; cette tournure marque clairement le lien logique en français courant.
- source_word: βασιλεῦ Ἀγρίππα
  choice: roi Agrippa
  rationale: Rend directement le vocatif et conserve le titre honorifique dans un français naturel et digne.
- source_word: οὐκ ἐγενόμην
  choice: je n’ai pas été
  rationale: Avec l’adjectif attribut, γίνομαι exprime ici le fait de se montrer ou de devenir tel; le passé composé convient au récit et reste naturel en français.
- source_word: ἀπειθὴς
  choice: désobéi
  rationale: Dans le contexte d’une mission divine reçue, le terme exprime le refus de se conformer à l’ordre donné. La formulation verbale «je n’ai pas désobéi» est plus idiomatique que «je n’ai pas été désobéissant».
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: à la vision céleste
  rationale: ὀπτασία désigne une vision ou manifestation surnaturelle; «vision céleste» conserve la concision ainsi que l’ambiguïté de οὐρανίῳ, qui peut évoquer l’origine ou le caractère céleste.
theological_decisions:
- issue: Nature de l’expérience de Paul sur le chemin de Damas
  choice: vision
  alternative: manifestation venue du ciel
  rationale: «Vision» correspond directement à ὀπτασία sans préciser davantage le mode de l’expérience. L’adjectif «céleste» laisse ouverte la nuance d’origine ou de caractère.
translation_notes:
  register: Français moderne international, clair et digne. «Ainsi donc» marque l’inférence sans archaïsme; l’adresse «roi Agrippa» conserve la solennité judiciaire. La virgule finale du fragment source est remplacée par un point, le verset étant présenté isolément.
