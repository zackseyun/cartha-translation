  text: παρ’ οὗ δυνήσῃ αὐτὸς ἀνακρίνας περὶ πάντων τούτων ἐπιγνῶναι ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/008.yaml
  text: From him[a], by examining him yourself[b], you will be able to learn about all these things of which we accuse him.
translation:
  language: fr
  text: C’est de lui[a] que vous pourrez vous-même, après l’avoir interrogé, apprendre tout ce dont nous l’accusons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « De lui, vous pourrez vous-même, après l’avoir interrogé, prendre connaissance de tous les faits dont nous l’accusons. »'
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits ajoutent au verset 7 une phrase selon laquelle le commandant Lysias a arraché Paul de force et a ordonné à ses accusateurs de comparaître devant Félix. Le texte du SBLGNT ne comporte pas cette phrase ici.
    reason: textual_variant
lexical_decisions:
- source_word: παρ’ οὗ
  choice: C’est auprès de lui que
  rationale: παρά avec le génitif indique ici la source auprès de laquelle Félix pourra obtenir les renseignements. La tournure clivée est naturelle en français et met cette source en relief.
- source_word: δυνήσῃ
  choice: tu pourras
  rationale: Le futur de δύναμαι exprime la capacité future; « tu pourras » restitue directement le sens et convient au tutoiement d’un interlocuteur singulier dans le récit.
- source_word: αὐτὸς
  choice: toi-même
  rationale: Le pronom emphatique souligne que Félix procédera personnellement à l’interrogatoire.
- source_word: ἀνακρίνας
  choice: après l’avoir interrogé
  rationale: Dans ce cadre judiciaire, ἀνακρίνω désigne un examen mené par questions. Le participe aoriste peut présenter l’interrogatoire comme préalable à la constatation, sans exclure sa valeur circonstancielle.
- source_word: περὶ πάντων τούτων
  choice: tout ce dont
  rationale: Cette formulation française idiomatique reprend globalement l’ensemble des points évoqués par πάντων τούτων et les rattache directement aux accusations.
- source_word: ἐπιγνῶναι
  choice: vérifier
  rationale: Dans le contexte judiciaire, le verbe signifie parvenir à une connaissance assurée ou constater les faits. « Vérifier » est naturel, précis et moins soutenu que « établir avec certitude ».
- source_word: ὧν ἡμεῖς κατηγοροῦμεν αὐτοῦ
  choice: tout ce dont nous l’accusons
  rationale: κατηγορέω avec le génitif de la personne signifie accuser quelqu’un; la relative française avec « dont » conserve clairement le contenu des accusations.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le cadre judiciaire sans employer un vocabulaire excessivement technique. Le tutoiement correspond à l’adresse grecque au singulier et à l’usage narratif courant. Les deux marqueurs de notes figurent dans le texte principal.
