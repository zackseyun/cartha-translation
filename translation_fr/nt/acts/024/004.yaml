source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ ἐπὶ πλεῖόν σε ἐγκόπτω, παρακαλῶ ἀκοῦσαί σε ἡμῶν συντόμως τῇ σῇ ἐπιεικείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/004.yaml
  text: But[a], so that I may not delay you any further[b], I beg you to hear us briefly, in your graciousness.
translation:
  language: fr
  text: Mais, pour ne pas vous retenir plus longtemps[a], je vous prie de nous écouter brièvement, avec votre bienveillance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous importuner davantage » ou « vous retarder davantage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « conformément à votre clémence » ou « grâce à votre bonté ». Le terme grec peut évoquer l’équité, la douceur ou l’indulgence dans le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Mais, pour ne pas
  rationale: Le tour français exprime naturellement le but négatif introduit par ἵνα μή, tandis que « Mais » rend la transition légèrement adversative de δέ.
- source_word: ἐπὶ πλεῖόν
  choice: plus longtemps
  rationale: Dans ce contexte d’audience, l’expression idiomatique renvoie vraisemblablement au temps supplémentaire pris au gouverneur.
- source_word: σε ἐγκόπτω
  choice: vous retenir
  rationale: ἐγκόπτω signifie entraver ou gêner et, ici, par extension, retenir quelqu’un en prenant davantage de son temps. « Retenir » convient au registre déférent sans suggérer une détention judiciaire.
- source_word: παρακαλῶ
  choice: je vous prie
  rationale: Cette formule rend la requête polie et appuyée du cadre judiciaire dans un français actuel et digne.
- source_word: ἀκοῦσαί σε ἡμῶν
  choice: de nous écouter
  rationale: Le sens direct est d’écouter les propos des accusateurs; « écouter » est plus naturel en français que le calque « nous entendre », lequel pourrait aussi évoquer l’octroi formel d’une audience.
- source_word: συντόμως
  choice: brièvement
  rationale: L’adverbe exprime la brièveté de la présentation ou du temps demandé.
- source_word: τῇ σῇ ἐπιεικείᾳ
  choice: avec votre bienveillance
  rationale: ἐπιείκεια peut désigner l’équité, la douceur, l’indulgence ou la clémence. « Bienveillance » conserve ici l’appel déférent à l’attitude favorable du gouverneur sans imposer un sens exclusivement judiciaire.
