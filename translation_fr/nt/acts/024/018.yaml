  text: ἐν ⸀αἷς εὗρόν με ἡγνισμένον ἐν τῷ ἱερῷ, οὐ μετὰ ὄχλου οὐδὲ μετὰ θορύβου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/018.yaml
  text: In these things they found me purified in the temple[a], not with a crowd nor with an uproar[b],
translation:
  language: fr
  text: C’est dans ces circonstances[a] qu’ils m’ont trouvé dans le Temple, purifié[b], sans foule ni tumulte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est pendant ces activités qu’ils m’ont trouvé ». Plus littéralement, le grec peut se rendre par « au cours desquelles » ou « dans lesquelles ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’une purification rituelle ou cérémonielle.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν αἷς
  choice: dans ces circonstances
  rationale: La locution relative renvoie aux faits ou activités mentionnés auparavant. Cette formulation restitue naturellement l’anaphore en français, tout en laissant en note la construction plus formelle ou temporelle.
- source_word: εὗρόν με
  choice: ils m’ont trouvé
  rationale: Le verbe indique ici que les accusateurs ont rencontré ou constaté la présence de Paul dans le Temple; « trouvé » est direct et idiomatique.
- source_word: ἡγνισμένον
  choice: en état de purification
  rationale: Le participe parfait passif décrit Paul dans l’état résultant d’une purification accomplie. Cette expression française préserve cet état sans préciser dans le corps du texte plus que le grec la nature rituelle de l’acte.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du Temple, et non spécifiquement le sanctuaire intérieur. « Temple » est la désignation française courante; la majuscule identifie le Temple de Jérusalem.
- source_word: οὐ μετὰ ὄχλου
  choice: sans foule
  rationale: Cette formulation concise exprime que Paul n’était pas accompagné d’une foule et évite « émeute », qui donnerait à ὄχλος une valeur trop forte.
- source_word: οὐδὲ μετὰ θορύβου
  choice: ni tumulte
  rationale: θόρυβος évoque le bruit, l’agitation ou le désordre public. « Tumulte » convient au contexte judiciaire et forme un parallélisme naturel avec « sans foule ».
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la virgule finale parce que le verset se poursuit syntaxiquement au verset suivant. « En état de purification » maintient la valeur résultative du participe parfait, tandis que la note explicite son cadre rituel.
