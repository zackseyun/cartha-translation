  text: ἢ αὐτοὶ οὗτοι εἰπάτωσαν τί ⸀εὗρον ἀδίκημα στάντος μου ἐπὶ τοῦ συνεδρίου
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: fr
  text: Ou bien, que ces hommes eux-mêmes disent quelle faute ils ont trouvée lorsque j’ai comparu devant le conseil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le Sanhédrin ». Le mot grec désigne ici le conseil juif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit naturellement en français l’autre possibilité avancée par Paul dans sa défense.
- source_word: αὐτοὶ οὗτοι
  choice: ceux qui sont ici disent eux-mêmes
  rationale: Rend à la fois la désignation de ces hommes présents et l’insistance portée par αὐτοί, sans lourdeur excessive.
- source_word: εἰπάτωσαν
  choice: que ... disent
  rationale: Le subjonctif introduit par « que » rend naturellement l’impératif à la troisième personne dans ce contexte judiciaire.
- source_word: τί εὗρον
  choice: quelle ... ils ont trouvée
  rationale: Demande précisément quelle faute les intéressés auraient constatée; le passé composé convient au récit et au registre oral de la défense.
- source_word: ἀδίκημα
  choice: faute
  rationale: Terme assez large pour désigner un acte répréhensible ou une infraction sans préciser plus que le grec; « crime » serait trop spécifique.
- source_word: στάντος μου
  choice: lorsque j’ai comparu
  rationale: Dans un cadre judiciaire, « comparaître » exprime naturellement le fait de se tenir devant une assemblée appelée à examiner l’affaire.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: devant le Conseil
  rationale: Rend la comparution devant l’assemblée juive; la majuscule signale ici une institution déterminée, tandis que la note donne le nom traditionnel.
