reference: Acts 24:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: fr
  text: 'ou bien de cette seule déclaration[a] que j’ai lancée à grands cris alors que je me tenais au milieu d’eux : « C’est au sujet de la résurrection des morts[b] que je suis jugé aujourd’hui devant vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi désigner le « cri » ou la « voix » : il peut viser l’énoncé lui-même ou la voix par laquelle il a été prononcé.'
    reason: lexical_alternative
  - marker: b
    text: Ou « résurrection d’entre les morts » .
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: déclaration
  rationale: Avec περὶ et la proposition qui en donne le contenu, le terme désigne ici l’énoncé prononcé. « Déclaration » est naturel dans ce contexte judiciaire, tandis que l’idée de voix forte est portée par ἐκέκραξα.
- source_word: ἐκέκραξα
  choice: j’ai lancée d’une voix forte
  rationale: κράζω indique une prise de parole forte et publique. Cette formulation conserve cette intensité tout en s’accordant naturellement avec « déclaration ».
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: debout au milieu d’eux
  rationale: La tournure conserve à la fois la posture indiquée par le participe et la situation spatiale exprimée par ἐν αὐτοῖς.
- source_word: ἀναστάσεως νεκρῶν
  choice: résurrection des morts
  rationale: C’est l’expression française établie et la correspondance la plus directe du génitif, qui présente ici la résurrection de manière générale.
- source_word: κρίνομαι
  choice: je suis jugé
  rationale: Le présent passif exprime le jugement judiciaire que Paul subit à ce moment-là; la formulation reste proche du grec et claire en français.
- source_word: ἐφ’ ὑμῶν
  choice: devant vous
  rationale: Dans ce cadre judiciaire, la préposition situe Paul devant l’autorité ou le tribunal sans affirmer que ses auditeurs sont à eux seuls les agents du jugement.
- source_word: ἢ
  choice: ou bien
  rationale: La conjonction relie cette exception possible à la défense précédente. « Ou bien » garde ce lien sans expliciter davantage que le grec.
- source_word: μιᾶς ταύτης
  choice: cette seule
  rationale: Cette formulation rend l’insistance sur l’unicité et le caractère précis de la déclaration.
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Équivalent français moderne et direct de l’adverbe temporel.
theological_decisions:
- issue: Nature du motif contesté
  choice: Paul présente le litige comme portant sur la résurrection des morts en général.
  alternative: Comprendre qu’il vise implicitement et spécifiquement la résurrection de Jésus.
  rationale: La formulation grecque περὶ ἀναστάσεως νεκρῶν demeure générale. Le texte principal conserve cette portée sans y introduire une précision christologique qui, bien que présente dans le contexte plus large des Actes, n’est pas explicite dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve sa dépendance syntaxique au verset précédent par « ou bien ». « Lancée d’une voix forte » évite le caractère potentiellement excessif de « criée » tout en maintenant la force de κράζω.
