source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: fr
  text: Ils ne m’ont trouvé ni dans le Temple en train de discuter avec quelqu’un ou de susciter un attroupement[a], ni dans les synagogues ni dans la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ameuter une foule » ou « provoquer un rassemblement de foule ». L’expression grecque peut désigner le fait de faire se former ou de soulever une foule, sans impliquer nécessairement une véritable émeute.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: Temple
  rationale: Dans les Actes, ἱερόν désigne généralement l’ensemble du complexe du Temple plutôt que le sanctuaire intérieur. « Temple » est le terme français naturel; la majuscule précise qu’il s’agit du Temple de Jérusalem.
- source_word: εὗρόν με
  choice: ils ne m’ont trouvé
  rationale: L’aoriste εὗρον est rendu naturellement au passé composé dans ce plaidoyer. La négation οὔτε est intégrée à la construction corrélative « ni… ni… ».
- source_word: πρός τινα διαλεγόμενον
  choice: en train de discuter avec quelqu’un
  rationale: διαλέγομαι peut signifier converser, raisonner, discuter ou débattre. « Discuter » conserve cette amplitude sans imposer le caractère ouvertement conflictuel de « se disputer ».
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: en train d’ameuter la foule
  rationale: L’expression évoque le fait de provoquer un attroupement ou une agitation collective. « Ameuter la foule » est idiomatique et indique une mobilisation troublant l’ordre public sans aller jusqu’à affirmer une émeute.
- source_word: ὄχλου
  choice: la foule
  rationale: Avec « ameuter », le français idiomatique emploie naturellement « la foule ». Cette formulation ne présuppose pas nécessairement une foule déjà constituée.
- source_word: συναγωγαῖς
  choice: synagogues
  rationale: Équivalent français courant et précis de συναγωγή dans ce contexte juif.
- source_word: κατὰ τὴν πόλιν
  choice: ailleurs dans la ville
  rationale: Après les deux lieux déjà nommés, cette formulation exprime naturellement l’extension à tout autre endroit de la ville. Elle évite l’ambiguïté d’une lecture où « dans toute la ville » modifierait seulement les synagogues.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et oralement fluide, adapté à un plaidoyer judiciaire. La syntaxe corrélative restitue les trois cadres niés par Paul. « Discuter » préserve l’ambiguïté lexicale de διαλέγομαι; « ameuter la foule » rend l’enjeu d’ordre public sans exagérer jusqu’à « provoquer une émeute ».
