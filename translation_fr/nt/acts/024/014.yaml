  source_fidelity: 'Le sens fondamental est bien rendu : Paul reconnaît ouvertement son culte selon la Voie, l’étiquette de « secte » donnée par ses opposants, sa continuité avec le Dieu ancestral d’Israël et son adhésion à ce qui est écrit dans la Loi et les Prophètes. Toutefois, « devant toi » ajoute une nuance spatiale ou scénique qui n’est pas exprimée par σοι (« à toi »), et οὕτως mérite d’être rendu explicitement.'
  naturalness: Le registre est globalement naturel et soutenu. « Je t’avoue ceci » est plus direct et idiomatique que « voici ce que je reconnais devant toi ». « Croire à tout ce qui est écrit » est également plus naturel ici que « croire tout ce qui est écrit ».
  terminology: « La Voie », « secte », « rendre un culte », « le Dieu de mes pères », « la Loi » et « les Prophètes » conviennent au contexte. La note sur αἵρεσις évite à juste titre l’anachronisme de « hérésie ».
