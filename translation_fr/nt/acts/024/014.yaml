id: ACT.24.14
reference: Acts 24:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: fr
  text: 'Mais je t’avoue ceci : c’est ainsi que, selon la Voie qu’ils appellent une secte[a], je rends un culte au Dieu de mes pères[b], en croyant à tout ce qui est écrit dans la Loi et dans les Prophètes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parti » ou « courant ». Le mot grec désigne ici un groupe distinct; « hérésie » lui donnerait un sens doctrinal plus tardif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le Dieu ancestral », c’est-à-dire le Dieu reçu des ancêtres d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ δὲ τοῦτό σοι
  choice: Mais voici ce que je reconnais devant toi
  rationale: La formulation rend l’aveu public et formel de Paul sans suggérer nécessairement un aveu de culpabilité. « Mais » conserve la valeur contrastive de δέ.
- source_word: κατὰ τὴν ὁδόν
  choice: selon la Voie
  rationale: « La Voie » conserve l’appellation historique du mouvement des disciples dans les Actes, tandis que « selon » exprime la conformité indiquée par κατά.
- source_word: αἵρεσιν
  choice: secte
  rationale: Dans ce contexte, αἵρεσις désigne un groupe ou courant religieux selon l’étiquette de ses adversaires, sans porter nécessairement le sens doctrinal plus tardif d’« hérésie ».
- source_word: οὕτως λατρεύω
  choice: c’est … que je rends un culte
  rationale: Cette tournure rattache explicitement la manière dont Paul sert Dieu à son appartenance à la Voie. « Rendre un culte » restitue la dimension religieuse de λατρεύω avec dignité et naturel.
- source_word: τῷ πατρῴῳ θεῷ
  choice: au Dieu de mes pères
  rationale: Cette expression française traditionnelle et intelligible rend le Dieu ancestral d’Israël et souligne la continuité revendiquée par Paul, sans inclure artificiellement Félix dans le possessif.
- source_word: πιστεύων πᾶσι τοῖς … γεγραμμένοις
  choice: en croyant tout ce qui est écrit
  rationale: Le participe présent demeure lié à l’action principale et l’expression conserve la portée globale de πᾶσι.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις
  choice: dans la Loi et dans les Prophètes
  rationale: La formulation garde les désignations conventionnelles de ces ensembles des Écritures juives et le parallélisme de la phrase.
theological_decisions:
- issue: Rapport entre la Voie et la foi d’Israël
  choice: Paul présente son culte selon la Voie comme un culte rendu au Dieu ancestral d’Israël et comme lié à la foi en la Loi et les Prophètes.
  alternative: Présenter la Voie comme une religion séparée et opposée au judaïsme.
  rationale: Le grec affirme simultanément l’appartenance de Paul à la Voie et sa continuité avec le Dieu et les Écritures d’Israël; la traduction préserve cette tension historique et théologique.
- issue: Portée de αἵρεσις
  choice: secte
  alternative: hérésie
  rationale: Le terme désigne ici un parti ou courant qualifié ainsi par les accusateurs; traduire par « hérésie » importerait une condamnation doctrinale technique plus tardive.
translation_notes:
  register: Français international actuel, soutenu mais accessible. « Devant toi » convient au cadre judiciaire; « rendre un culte » évite la possible ambiguïté de « servir » et conserve la nuance religieuse. Les majuscules à « Voie », « Loi » et « Prophètes » signalent des appellations historiques ou scripturaires.
