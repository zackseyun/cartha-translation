  rationale: La révision supprime l’ajout non nécessaire « devant toi », rend explicitement οὕτως par « c’est ainsi » et améliore la construction française liée à πιστεύων. Elle maintient les termes historiques et scripturaires établis ainsi que les deux ancres de notes.
