    rationale: La construction emphatique française initiale rend la relation entre la Voie et le culte, mais « c’est ainsi » restitue plus clairement l’adverbe grec.
  - severity: low
    issue: « en croyant tout ce qui est écrit »
    rationale: La formulation est compréhensible, mais « en croyant à tout ce qui est écrit » est plus idiomatique en français tout en rendant l’adhésion de Paul à l’ensemble des écrits.
