  text: συνεπέθεντο δὲ καὶ οἱ Ἰουδαῖοι φάσκοντες ταῦτα οὕτως ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: fr
  text: Les Juifs se joignirent eux aussi à l’attaque[a], affirmant que tout cela était bien ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’associèrent eux aussi à l’accusation ».'
    reason: Dans ce contexte judiciaire, le verbe grec peut être explicité comme un soutien actif à l’accusation, tout en ayant plus littéralement le sens de participer à une attaque.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: se joignirent à l’accusation
  rationale: Le verbe peut désigner le fait de se joindre à une attaque. Dans ce cadre judiciaire, il s’agit de soutenir activement l’accusation portée contre Paul; cette formulation garde la force adverse sans suggérer une agression physique.
- source_word: δὲ καὶ
  choice: eux aussi
  rationale: δὲ assure ici une liaison narrative légère, tandis que καὶ ajoute les Juifs à l’action déjà engagée. En français, « eux aussi » exprime naturellement cette participation.
- source_word: οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: La désignation renvoie ici au groupe juif présent qui appuie les accusations; rien dans le contexte immédiat n’exige de privilégier le sens géographique « Judéens ».
- source_word: φάσκοντες
  choice: affirmant
  rationale: Le participe introduit leur déclaration de soutien et convient au contexte judiciaire sans laisser entendre à lui seul que leur propos est vrai ou faux.
- source_word: ταῦτα οὕτως ἔχειν
  choice: que les faits étaient bien ainsi
  rationale: L’expression idiomatique signifie que les choses sont telles qu’elles viennent d’être présentées. « Les faits » renvoie naturellement en français aux éléments allégués, et « bien ainsi » rend la confirmation insistante sans trancher leur véracité.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste judiciaire et adversative, tout en évitant une lecture physique du verbe. Le marqueur [a] est placé immédiatement après l’expression concernée.
