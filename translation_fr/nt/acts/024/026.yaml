  variant: modern international French
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: fr
  text: En même temps, il espérait que Paul lui donnerait de l’argent[a] ; c’est pourquoi aussi il le faisait venir plus souvent et s’entretenait avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément d’après le contexte : « il espérait recevoir de Paul un pot-de-vin ». Le grec dit simplement « de l’argent ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἅμα καὶ
  choice: En même temps
  rationale: Cette expression marque la simultanéité avec ce qui précède. « En même temps » est naturel en français moderne et conserve la nuance temporelle sans reproduire lourdement les deux particules.
- source_word: ἐλπίζων
  choice: il espérait
  rationale: Le participe présent exprime une attente continue accompagnant les actions de Félix. L’imparfait français convient au déroulement narratif.
- source_word: χρήματα
  choice: de l’argent
  rationale: Le nom signifie simplement « argent ». Le contexte laisse entendre un pot-de-vin, mais le grec n’emploie pas de terme aussi précis ; le texte principal reste donc lexicalement retenu.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: que Paul lui donnerait
  rationale: Cette formulation française naturelle conserve Paul comme source attendue de l’argent et Félix comme bénéficiaire, tout en évitant une construction passive peu idiomatique.
- source_word: διὸ καὶ
  choice: c’est pourquoi
  rationale: διό établit un lien de conséquence avec l’espoir de recevoir de l’argent. Le καί est rendu implicitement par l’enchaînement naturel de la phrase plutôt que par un « aussi » ambigu en français.
- source_word: πυκνότερον
  choice: plus souvent
  rationale: Le comparatif adverbial indique une fréquence accrue ; « plus souvent » est clair et idiomatique.
- source_word: μεταπεμπόμενος
  choice: il le faisait venir
  rationale: Le participe moyen signifie faire appeler ou venir quelqu’un. Dans le contexte de la détention de Paul, « le faisait venir » rend naturellement l’action répétée de Félix.
- source_word: ὡμίλει αὐτῷ
  choice: s’entretenait avec lui
  rationale: Le verbe désigne ici une conversation personnelle plutôt qu’un discours formel. « S’entretenait avec lui » garde un registre digne et actuel.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal que Félix attendait un pot-de-vin ?
  choice: Conserver « de l’argent » dans le texte principal et laisser le contexte suggérer le motif corrompu.
  alternative: « Il espérait recevoir de Paul un pot-de-vin » ou « il espérait que Paul le soudoyerait ».
  rationale: Le contexte implique fortement une tentative de corruption, mais χρήματα signifie littéralement « argent » et non « pot-de-vin ». La traduction préserve ainsi la formulation grecque et son implication narrative sans la transformer en affirmation lexicale explicite.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait rend les actions duratives et répétées. La syntaxe active « Paul lui donnerait » est plus idiomatique en français que le calque passif tout en conservant les rôles du grec.
