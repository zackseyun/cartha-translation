id: ACT.24.1
reference: Acts 24:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: fr
  text: Cinq jours plus tard, le grand prêtre Ananias descendit avec quelques anciens et un certain orateur nommé Tertullus[a]. Ils portèrent leurs accusations contre Paul devant le gouverneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un certain avocat nommé Tertullus »; le mot grec peut désigner un orateur public ou un porte-parole dans une affaire judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: Cinq jours plus tard
  rationale: μετά avec l’accusatif marque le temps écoulé. Cette formulation française naturelle rend la progression temporelle; la légère valeur connective de δέ n’exige pas ici un mot distinct.
- source_word: κατέβη
  choice: descendit
  rationale: Le verbe conserve le mouvement descendant traditionnellement associé au trajet de Jérusalem vers Césarée.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: le grand prêtre Ananias
  rationale: « Grand prêtre » est le titre français usuel de la fonction juive désignée par ἀρχιερεύς; le nom propre suit la forme française conventionnelle.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: avec quelques anciens
  rationale: πρεσβύτεροι désigne ici des responsables juifs, et τινῶν indique un groupe indéfini sans suggérer qu’ils étaient tous présents.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: un certain orateur nommé Tertullus
  rationale: ῥήτωρ peut désigner un orateur ou un porte-parole judiciaire. « Orateur » conserve le sens lexical large, tandis que « nommé » explicite naturellement l’apposition et « un certain » rend l’indéfinition de τις.
- source_word: οἵτινες ἐνεφάνισαν
  choice: Ils portèrent leurs accusations
  rationale: Dans ce contexte judiciaire, ἐμφανίζω signifie présenter officiellement une accusation ou une plainte. Une nouvelle phrase rend clairement et naturellement le sujet pluriel οἵτινες.
- source_word: τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: contre Paul devant le gouverneur
  rationale: κατά avec le génitif a ici le sens judiciaire de « contre », et « devant le gouverneur » est l’expression française naturelle pour l’autorité auprès de laquelle les accusations sont présentées.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le marqueur de note est placé après « Tertullus », là où se trouve l’alternative lexicale, plutôt qu’après l’indication temporelle.
