  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: fr
  text: Tu peux vérifier qu’il ne s’est pas écoulé plus de douze jours depuis que je suis monté à Jérusalem pour adorer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: Tu peux toi-même vérifier
  rationale: La construction au génitif avec δύναμαι et l’infinitif indique que Félix est en mesure d’établir les faits. « Vérifier » convient au contexte judiciaire, tandis que « toi-même » rend naturellement en français la référence insistante au destinataire.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: il ne s’est pas écoulé plus de douze jours
  rationale: Cette formulation française naturelle exprime la durée écoulée portée par l’idiome grec, sans dépasser la limite de douze jours.
- source_word: ἀφ’ ἧς
  choice: depuis que
  rationale: La locution marque le point de départ de la période considérée.
- source_word: ἀνέβην
  choice: je suis monté
  rationale: « Monter à Jérusalem » conserve l’expression conventionnelle et géographique du grec.
- source_word: προσκυνήσων
  choice: pour adorer
  rationale: Le participe futur exprime le but du déplacement. L’objet de l’adoration reste implicite, comme dans le grec.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un nom de ville, « à » rend naturellement la destination exprimée par εἰς.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe judiciaire est rendue naturellement, sans conserver la tournure grecque idiomatique « il y a pour moi douze jours », qui serait obscure en français.
