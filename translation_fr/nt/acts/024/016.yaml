id: ACT.24.16
reference: Acts 24:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: fr
  text: C’est pourquoi moi aussi, je m’efforce constamment de garder une conscience sans reproche devant Dieu et devant les êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: C’est pourquoi
  rationale: Dans le contexte, l’expression reprend l’espérance mentionnée au verset précédent et introduit la conséquence que Paul en tire. « C’est pourquoi » rend naturellement cette valeur inférentielle.
- source_word: καὶ αὐτός
  choice: moi aussi
  rationale: « Aussi » conserve la valeur additive de καί, tandis que le pronom tonique « moi » marque l’insistance portée par αὐτός sans alourdir la phrase.
- source_word: ἀσκῶ
  choice: je m’efforce
  rationale: Le verbe exprime ici une application soutenue, un effort moral assidu. « Je m’efforce » est naturel en français actuel et convient à l’infinitif de but qui suit.
- source_word: ἀπρόσκοπον
  choice: sans reproche
  rationale: Appliqué à la conscience, l’adjectif désigne ce qui ne donne pas lieu à une faute ou à un grief. « Une conscience sans reproche » conserve la dimension morale et relationnelle du terme.
- source_word: συνείδησιν
  choice: conscience
  rationale: Équivalent français direct et usuel pour la faculté de discernement et d’évaluation morale.
- source_word: ἔχειν
  choice: garder
  rationale: Bien que le sens de base soit « avoir », « garder une conscience sans reproche » exprime naturellement en français l’état que Paul cherche continuellement à maintenir.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: devant Dieu et devant les êtres humains
  rationale: Dans ce contexte, πρός indique la relation et la responsabilité à l’égard de Dieu et des humains. La répétition de « devant » clarifie les deux dimensions. ἀνθρώπους est générique et désigne l’ensemble des êtres humains.
- source_word: διὰ παντός
  choice: constamment
  rationale: L’expression indique la continuité dans le temps. « Constamment » se rattache sans ambiguïté à l’effort de Paul et produit une phrase française fluide.
theological_decisions:
- issue: Portée générique de ἀνθρώπους
  choice: les êtres humains
  alternative: les hommes
  rationale: Dans ce passage, le pluriel ἀνθρώπους englobe les humains en général plutôt que les seuls adultes de sexe masculin. « Les êtres humains » rend cette portée explicitement en français moderne sans modifier la dimension horizontale de la responsabilité morale.
- issue: Nature de la conscience « sans reproche »
  choice: conserver une formulation relationnelle et morale
  alternative: une conscience pure ou tranquille
  rationale: ἀπρόσκοπον ne signifie pas directement « pure » ni simplement « tranquille ». « Sans reproche devant Dieu et devant les êtres humains » maintient la tension entre l’évaluation intérieure de la conscience et la responsabilité envers Dieu et autrui.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation suit l’enchaînement logique du grec tout en évitant un calque de ἐν τούτῳ. « Les êtres humains » est employé au sens générique et inclusif. Aucun marqueur de note n’est nécessaire.
