  source_fidelity: Le sens inférentiel de ἐν τούτῳ est correctement rendu par « C’est pourquoi », en lien avec l’espérance de la résurrection exprimée au contexte immédiat. « Moi aussi » conserve de façon naturelle l’addition de καί et l’insistance de αὐτός. « Je m’efforce constamment de garder » rend bien l’effort soutenu d’ἀσκῶ, l’infinitif ἔχειν et la continuité de διὰ παντός. « Une conscience sans reproche » transmet adéquatement ἀπρόσκοπον συνείδησιν, sans introduire le sens plus étroit de « pure » ou de « tranquille ».
  naturalness: La phrase est fluide, claire et conforme à un français international moderne. La répétition de « devant » est stylistiquement un peu appuyée, mais elle reste naturelle et met nettement en relief les deux pôles, Dieu et les êtres humains.
