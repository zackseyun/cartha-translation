  terminology: « Réformes » convient pour διορθωμάτων, avec une note qui conserve les nuances possibles. « Prévoyance » rend bien πρόνοια sans connotation nécessairement théologique. « Nation » est défendable pour ἔθνος dans ce cadre politico-juridique.
