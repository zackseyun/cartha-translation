- from: 'Quand Paul eut été appelé, Tertullus se mit à l’accuser en ces termes : « Grâce à toi, nous jouissons d’une grande paix, et, grâce à ta prévoyance, des réformes[a] sont réalisées en faveur de cette nation. »'
  to: 'Quand Paul eut été appelé, Tertullus se mit à l’accuser en disant : « Puisque, grâce à vous, nous jouissons d’une grande paix et que, grâce à votre prévoyance, des réformes[a] sont réalisées pour cette nation, »'
  rationale: La révision remplace le tutoiement par le vouvoiement requis par le registre français d’une adresse officielle à un gouverneur, conserve les choix lexicaux solides (« réformes », « prévoyance ») et maintient la phrase ouverte, comme dans le grec et dans la continuité avec Actes 24.3.
