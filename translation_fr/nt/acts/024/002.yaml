id: ACT.24.2
reference: Acts 24:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: fr
  text: 'Quand Paul eut été appelé, Tertullus se mit à l’accuser en disant : « Puisque, grâce à vous, nous jouissons d’une grande paix et que, grâce à votre prévoyance, des réformes[a] sont réalisées pour cette nation, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des améliorations » ou « des mesures correctives ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: Quand Paul eut été appelé
  rationale: Le génitif absolu situe l’action principale dans le cadre judiciaire. Le nom de Paul, référent du pronom grec, est explicité pour éviter toute ambiguïté en français isolé.
- source_word: ἤρξατο κατηγορεῖν
  choice: se mit à l’accuser
  rationale: Cette tournure française naturelle conserve la valeur inchoative de ἤρξατο et le sens judiciaire de κατηγορεῖν.
- source_word: ὁ Τέρτυλλος
  choice: Tertullus
  rationale: Translittération française traditionnelle du nom propre.
- source_word: λέγων
  choice: en ces termes
  rationale: Introduit naturellement en français le contenu du discours tout en représentant la fonction du participe λέγων.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες
  choice: nous jouissons d’une grande paix
  rationale: Rend idiomatiquement l’expérience durable exprimée par τυγχάνοντες avec le génitif et préserve la flatterie rhétorique.
- source_word: διὰ σοῦ
  choice: Grâce à toi
  rationale: Exprime ici l’agent ou le moyen dans un éloge adressé à Félix; « grâce à » restitue naturellement la valeur favorable du propos.
- source_word: διορθωμάτων
  choice: des réformes
  rationale: Le terme désigne des mesures correctives ou des améliorations; « réformes » convient au contexte politico-administratif, tandis qu’une note conserve les autres nuances possibles.
- source_word: γινομένων τῷ ἔθνει τούτῳ
  choice: sont réalisées en faveur de cette nation
  rationale: Rend la venue à l’existence ou la mise en œuvre des réformes et comprend le datif comme bénéficiaire, sans surdéterminer l’agence grammaticale.
- source_word: διὰ τῆς σῆς προνοίας
  choice: grâce à ta prévoyance
  rationale: « Prévoyance » exprime la planification avisée d’un gouvernant sans suggérer nécessairement la providence divine.
theological_decisions:
- issue: Sens de πρόνοια dans un contexte administratif humain
  choice: prévoyance
  alternative: providence; gestion avisée
  rationale: Le passage loue l’anticipation et l’administration de Félix. « Prévoyance » préserve ce sens sans importer une affirmation sur la providence divine.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton flatteur et judiciaire de Tertullus. Le tutoiement correspond au singulier grec et au style courant des traductions bibliques françaises lorsqu’un individu est directement interpellé.
