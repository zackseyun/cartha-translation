  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: fr
  text: Quelques jours plus tard, Félix vint avec Drusille, sa femme, qui était juive. Il fit appeler Paul et l’écouta parler de la foi[a] en Jésus le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la confiance en Jésus le Messie ». Le mot grec traduit par « foi » peut aussi exprimer la confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: Quelques jours plus tard
  rationale: Expression temporelle naturelle en français; « plus tard » rend clairement la succession narrative, tandis que δέ n’exige pas ici de connecteur appuyé.
- source_word: παραγενόμενος
  choice: vint
  rationale: Le participe circonstanciel indique l’arrivée ou la venue de Félix; « vint » convient au récit et reste concis.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: avec Drusille, sa propre femme
  rationale: σύν marque l’accompagnement et ἰδίᾳ apporte une insistance possessive que conserve « sa propre femme ».
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: qui était juive
  rationale: Formulation moderne et directe qui rend le participe et l’identité juive de Drusille sans terme archaïque.
- source_word: μετεπέμψατο
  choice: fit appeler
  rationale: Le verbe signifie envoyer chercher ou convoquer quelqu’un; « fit appeler » est idiomatique et adapté au contexte.
- source_word: ἤκουσεν αὐτοῦ
  choice: l’écouta parler
  rationale: Avec le génitif, ἀκούω peut exprimer une écoute attentive. L’ajout idiomatique de « parler » relie naturellement l’écoute au sujet introduit par περί.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: de la foi en Jésus le Messie
  rationale: περί introduit le sujet du discours; πίστις avec εἰς désigne ici la foi dirigée vers Jésus. « Jésus le Messie » rend clairement Χριστός comme titre dans un français naturel.
theological_decisions:
- issue: Rendu de Χριστὸν Ἰησοῦν
  choice: Jésus le Messie
  alternative: Jésus-Christ / le Messie Jésus
  rationale: Χριστός conserve ici sa valeur de titre. « Jésus le Messie » l’explicite naturellement en français, sans réduire « Christ » à un simple élément du nom.
- issue: Sens de πίστις avec εἰς
  choice: la foi en Jésus le Messie
  alternative: la confiance en Jésus le Messie
  rationale: La construction πίστις + εἰς indique très probablement une foi orientée vers Jésus plutôt que sa propre fidélité. « Foi » demeure le terme français usuel, tandis que « confiance » est signalé en note comme nuance lexicale possible.
translation_notes:
  register: Français international moderne, digne et accessible. Deux phrases évitent une coordination lourde. « Sa propre femme » conserve l’emphase du grec, et « Jésus le Messie » maintient la valeur titulaire de Χριστός.
