source:
  edition: SBLGNT
  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: fr
  text: Mais certains Juifs venus d’Asie[a] auraient dû comparaître devant toi et m’accuser[b], s’ils avaient quelque chose contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Asie » désigne la province romaine située dans l’ouest de l’Asie Mineure, et non le continent actuel.
    reason: cultural_note
  - marker: b
    text: Ou « porter des accusations contre moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Mais certains
  rationale: δὲ marque ici le contraste avec ce qui précède, tandis que τινὲς désigne un groupe non précisé. « Mais certains » est naturel et fidèle.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: venus d’Asie
  rationale: La préposition indique l’origine. « Venus d’Asie » s’intègre naturellement à la phrase française; une note précise qu’il s’agit de la province romaine.
- source_word: Ἰουδαῖοι
  choice: Juifs
  rationale: Le terme désigne ici des personnes juives et se traduit normalement par « Juifs ».
- source_word: οὓς ἔδει ... παρεῖναι
  choice: auraient dû comparaître
  rationale: L’imparfait ἔδει exprime une obligation qui n’a pas été remplie. Dans ce contexte judiciaire, « comparaître » rend plus précisément παρεῖναι qu’un simple « être présents ».
- source_word: ἐπὶ σοῦ
  choice: devant toi
  rationale: Dans le cadre judiciaire, l’expression indique la comparution devant le gouverneur qui juge l’affaire.
- source_word: κατηγορεῖν
  choice: m’accuser
  rationale: Le verbe est un terme judiciaire signifiant accuser ou porter une accusation. « M’accuser » reste direct et actuel.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: s’ils avaient quelque chose contre moi
  rationale: Cette formulation conserve la portée générale de τι et la nuance potentielle du grec, sans préciser indûment qu’il s’agissait nécessairement d’un chef d’accusation formel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation emploie le vocabulaire judiciaire naturel (« comparaître », « accuser ») tout en conservant l’irréel du passé exprimé par ἔδει et l’optatif ἔχοιεν.
