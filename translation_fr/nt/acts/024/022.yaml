  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: fr
  text: 'Mais Félix, qui avait une connaissance plus précise de ce qui concernait la Voie[b], ajourna leur affaire[a] en disant : « Quand le commandant Lysias descendra, je statuerai sur votre cas[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « différa la décision à leur sujet » ; le verbe grec peut désigner le report ou l’ajournement d’une procédure judiciaire.
    reason: lexical_alternative
  - marker: b
    text: « La Voie » était l’une des premières désignations du mouvement chrétien.
    reason: cultural_note
  - marker: c
    text: Ou « je trancherai les questions qui vous concernent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο ... αὐτοὺς
  choice: ajourna leur affaire
  rationale: Le verbe exprime ici le report d’une décision judiciaire. Le pronom désigne directement les parties, mais « ajourna leur affaire » restitue naturellement en français le sens juridique sans faire croire que Félix les a personnellement éconduits.
- source_word: ἀκριβέστερον εἰδὼς
  choice: qui connaissait plus exactement
  rationale: Cette formulation conserve la valeur comparative de ἀκριβέστερον et rattache naturellement le participe à Félix.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: ce qui concernait la Voie
  rationale: La tournure garde la portée générale de τὰ περὶ et rend ἡ ὁδός comme désignation du mouvement chrétien, signalée par la majuscule.
- source_word: Ὅταν ... καταβῇ
  choice: Quand ... descendra
  rationale: La proposition vise une arrivée future précise. « Descendra » préserve l’expression géographique grecque tout en restant idiomatique dans le contexte.
- source_word: χιλίαρχος
  choice: le commandant
  rationale: Le terme désigne un officier militaire romain de haut rang. « Commandant » est clair pour le lectorat moderne, contrairement à « chiliarque », et moins technique que « tribun militaire ».
- source_word: διαγνώσομαι
  choice: je statuerai
  rationale: Dans ce contexte judiciaire, le verbe signifie trancher ou rendre une décision après examen. « Statuer » exprime précisément cette portée.
- source_word: τὰ καθ’ ὑμᾶς
  choice: votre cas
  rationale: L’expression désigne les faits ou l’affaire concernant les interlocuteurs. « Votre cas » est naturel en français juridique et conserve l’adresse au pluriel.
theological_decisions:
- issue: Statut de « la Voie »
  choice: Majuscule et note explicative
  alternative: « le chemin » ou « la voie » sans majuscule
  rationale: Dans les Actes, l’expression fonctionne comme une désignation reconnue du mouvement chrétien. La majuscule le signale sans remplacer l’expression par « christianisme ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le comparatif grec (« plus exactement »), le nom historique « la Voie » et la nuance judiciaire de la scène. Les trois marqueurs de note figurent dans le texte à l’endroit pertinent.
