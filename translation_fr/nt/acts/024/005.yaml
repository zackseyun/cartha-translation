id: ACT.24.5
reference: Acts 24:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: fr
  text: 'Nous avons en effet constaté que cet homme est un fléau : il provoque des soulèvements parmi tous les Juifs dans le monde entier et il est aussi un meneur du parti des Nazaréens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: un fléau
  rationale: 'Conserve la métaphore accusatrice forte : Paul est présenté comme une calamité publique, et non simplement comme un homme gênant.'
- source_word: κινοῦντα στάσεις
  choice: il provoque des soulèvements
  rationale: στάσεις désigne ici des troubles collectifs, des séditions ou des révoltes. « Soulèvements » exprime la gravité politique de l’accusation sans imposer l’idée plus précise d’émeutes effectivement déclenchées.
- source_word: τῇ οἰκουμένῃ
  choice: dans le monde entier
  rationale: Expression française naturelle pour le monde habité tel qu’il était conçu dans le contexte gréco-romain ; l’hyperbole de l’accusation est maintenue.
- source_word: πρωτοστάτην
  choice: un meneur
  rationale: Rend l’idée d’un dirigeant de premier plan ou d’un instigateur, dans le registre judiciaire hostile du discours.
- source_word: αἱρέσεως
  choice: du parti
  rationale: Dans ce contexte du Ier siècle, le mot désigne un courant ou groupe religieux, sans nécessairement porter le sens doctrinal moderne et péjoratif d’« hérésie ».
- source_word: Ναζωραίων
  choice: Nazaréens
  rationale: Conserve la désignation historique appliquée ici aux disciples de Jésus de Nazareth.
theological_decisions:
- issue: Nature du groupe des Nazaréens
  choice: parti des Nazaréens
  alternative: secte des Nazaréens
  rationale: « Parti » préserve le sens socioreligieux de αἵρεσις dans les Actes et évite d’importer automatiquement la notion moderne de groupe déviant ou manipulateur. Le ton hostile demeure porté par l’ensemble de l’accusation.
- issue: Portée des accusations contre Paul
  choice: Les affirmations restent formulées comme celles de l’accusateur, sans atténuation éditoriale.
  alternative: Ajouter des marques telles que « prétendument » ou « selon eux »
  rationale: Le cadre narratif indique déjà qu’il s’agit d’une accusation judiciaire ; le verset doit en préserver la force rhétorique sans avaliser ni corriger explicitement les griefs.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’élan d’une accusation judiciaire orale. « Nous avons constaté » rend εὑρόντες de façon idiomatique, tandis que les deux-points font de « un fléau » la qualification générale développée par les accusations qui suivent.
