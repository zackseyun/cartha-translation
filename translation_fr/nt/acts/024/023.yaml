id: ACT.24.23
reference: Acts 24:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: fr
  text: Il donna l’ordre au centurion de le garder en détention, tout en lui laissant une certaine liberté[a], et de n’empêcher aucun des siens[b] de lui rendre service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un certain soulagement » ou « un régime moins strict ». Le terme grec peut désigner le soulagement, l’aisance ou une certaine liberté par rapport aux contraintes de la détention.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les siens ». Il s’agit probablement des compagnons, des amis ou des soutiens de Paul autorisés à l’aider.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: Il donna l’ordre
  rationale: Le participe aoriste introduit l’ordre donné par Félix. Une proposition principale rend naturellement la progression narrative en français.
- source_word: τῷ ἑκατοντάρχῃ
  choice: au centurion
  rationale: « Centurion » est le terme français précis et usuel pour cet officier romain.
- source_word: τηρεῖσθαι αὐτόν
  choice: de le garder en détention
  rationale: Dans ce contexte judiciaire, τηρέω désigne le maintien sous garde plutôt qu’une simple surveillance.
- source_word: ἔχειν τε ἄνεσιν
  choice: tout en lui laissant une certaine liberté
  rationale: ἄνεσις peut évoquer le soulagement, l’aisance ou un relâchement des contraintes. Ici, il s’agit d’un régime de détention assoupli, non d’une libération complète.
- source_word: τε ... καὶ
  choice: tout en ... et
  rationale: Cette formulation coordonne les deux consignes tout en faisant ressortir naturellement le contraste entre la détention et la liberté limitée accordée à Paul.
- source_word: μηδένα κωλύειν
  choice: de n’empêcher aucun
  rationale: 'La tournure conserve la portée universelle de la négation : personne parmi le groupe visé ne devait être empêché.'
- source_word: τῶν ἰδίων αὐτοῦ
  choice: des siens
  rationale: L’expression grecque signifie littéralement « ceux qui étaient à lui » ou « les siens » et peut désigner ses proches, compagnons ou soutiens sans préciser davantage leur relation.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: de lui rendre service
  rationale: Dans ce contexte, le verbe désigne l’aide concrète apportée à Paul. « Rendre service » reste naturel et évite les connotations ecclésiastiques possibles de « exercer un ministère ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la tension entre la détention de Paul et l’assouplissement de ses conditions, tout en préservant l’imprécision de « les siens ».
