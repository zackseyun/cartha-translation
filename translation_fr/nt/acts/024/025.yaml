id: ACT.24.25
reference: Acts 24:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: fr
  text: 'Mais comme Paul parlait de la justice, de la maîtrise de soi et du jugement à venir, Félix prit peur et répondit : « Pour le moment, va-t’en. Quand j’en trouverai l’occasion, je te ferai appeler. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: parlait
  rationale: Dans ce contexte, le participe désigne l’exposé raisonné de Paul. « Parlait » reste naturel en français et n’impose pas l’idée d’un débat formel.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Correspondance directe qui conserve l’étendue morale et théologique du terme grec.
- source_word: ἐγκρατείας
  choice: maîtrise de soi
  rationale: Expression française actuelle qui rend le contrôle de ses désirs et de sa conduite.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: du jugement à venir
  rationale: Rend fidèlement le jugement futur sans préciser davantage sa nature ni son moment.
- source_word: ἔμφοβος γενόμενος
  choice: prit peur
  rationale: Expression idiomatique qui restitue l’entrée de Félix dans un état de crainte.
- source_word: Τὸ νῦν ἔχον
  choice: Pour le moment
  rationale: Locution naturelle exprimant la situation présente, sans suggérer que Félix tiendra nécessairement sa promesse.
- source_word: καιρὸν ... μεταλαβών
  choice: Quand j’en trouverai l’occasion
  rationale: Rend l’idée d’obtenir ou de trouver un moment opportun.
- source_word: μετακαλέσομαί σε
  choice: je te ferai appeler
  rationale: Le verbe indique que Félix fera convoquer Paul auprès de lui, formulation naturelle compte tenu de son autorité.
theological_decisions:
- issue: Portée de « justice » et du « jugement à venir »
  choice: Conserver les termes généraux sans explicitation doctrinale
  alternative: Préciser la justice devant Dieu ou le jugement dernier
  rationale: Le grec ne développe pas ici ces notions; les expliciter résoudrait indûment leur portée théologique.
- issue: Nature de la crainte de Félix
  choice: « prit peur » sans qualifier son motif intérieur
  alternative: « fut terrifié » ou « fut convaincu de péché »
  rationale: Le texte affirme sa peur, mais ne décrit ni son intensité extrême ni une repentance.
translation_notes:
  register: Français moderne international, clair et digne. Le nom « Paul », implicite dans le pronom grec et explicite dans le contexte, est repris pour éviter une ouverture française ambiguë. Le tutoiement convient à la parole d’un gouverneur romain adressée à son détenu.
