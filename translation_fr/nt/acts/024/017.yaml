id: ACT.24.17
reference: Acts 24:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: fr
  text: Après plusieurs années, je suis venu apporter à mon peuple des dons destinés aux pauvres[a] et présenter des offrandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des aumônes ». Le terme grec désigne des dons faits aux personnes dans le besoin.
    reason: alternative lexicale
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: Après plusieurs années
  rationale: διά avec le génitif exprime ici l’intervalle écoulé; πλειόνων désigne idiomatiquement plusieurs années. Le léger lien discursif marqué par δέ n’exige pas nécessairement un connecteur explicite en français.
- source_word: ἐλεημοσύνας
  choice: des dons destinés aux pauvres
  rationale: Le nom désigne des aumônes, c’est-à-dire une aide matérielle accordée aux personnes dans le besoin. Cette formulation moderne en explicite naturellement le sens.
- source_word: ποιήσων
  choice: apporter … et présenter
  rationale: Avec ἐλεημοσύνας, ποιέω forme une expression idiomatique relative à l’accomplissement d’un acte charitable. En français, « apporter » convient aux dons, tandis que « présenter » convient naturellement aux offrandes.
- source_word: εἰς τὸ ἔθνος μου
  choice: à mon peuple
  rationale: Dans ce contexte, ἔθνος désigne la nation juive à laquelle Paul appartient. « Mon peuple » est naturel en français et exprime clairement le bénéficiaire collectif.
- source_word: παρεγενόμην
  choice: je suis venu
  rationale: παραγίνομαι indique ici l’arrivée de Paul à Jérusalem; « je suis venu » est direct et idiomatique.
- source_word: προσφοράς
  choice: des offrandes
  rationale: Le terme peut désigner des dons présentés dans un cadre cultuel, mais le grec n’en précise pas ici la nature exacte. « Offrandes » préserve cette latitude.
theological_decisions:
- issue: Nature de l’acte charitable de Paul
  choice: des dons destinés aux pauvres
  alternative: des aumônes
  rationale: Le choix rend explicite le sens charitable de ἐλεημοσύνας sans lui ajouter de portée doctrinale ni réduire les dons à une pratique ecclésiastique particulière.
- issue: Nature des προσφοράς
  choice: des offrandes
  alternative: des offrandes sacrificielles
  rationale: Le texte ne précise pas de quel type d’offrandes il s’agit; la formulation retenue conserve cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. « Dons destinés aux pauvres » évite le caractère parfois vieilli d’« aumônes », tandis que « offrandes » conserve le vocabulaire cultuel général du texte.
