source:
  edition: SBLGNT
  text: Ἀπεκρίθη ⸀τε ὁ Παῦλος νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν· Ἐκ πολλῶν ἐτῶν ὄντα σε κριτὴν τῷ ἔθνει τούτῳ ἐπιστάμενος ⸀εὐθύμως τὰ περὶ ἐμαυτοῦ ἀπολογοῦμαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/010.yaml
  text: 'Then Paul answered[a], after the governor had nodded to him to speak: “Knowing that for many years you have been a judge over this nation, I gladly make my defense concerning myself.'
translation:
  language: fr
  text: 'Alors Paul répondit, après que le gouverneur lui eut fait signe de parler : « Sachant que tu es juge de cette nation depuis de nombreuses années, c’est avec confiance[a] que je présente ma défense au sujet de ce qui me concerne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « volontiers ». L’adverbe peut exprimer l’empressement, le courage, la confiance ou la bonne disposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη τε
  choice: Alors Paul répondit
  rationale: ἀποκρίνομαι signifie répondre, tandis que τε assure une transition narrative légère ; « Alors » rend naturellement cette progression sans surcharger la liaison.
- source_word: νεύσαντος αὐτῷ τοῦ ἡγεμόνος λέγειν
  choice: après que le gouverneur lui eut fait signe de parler
  rationale: Le génitif absolu est rendu par une proposition temporelle. « Faire signe » conserve la portée de νεύω sans imposer nécessairement un simple hochement de tête.
- source_word: ἡγεμόνος
  choice: gouverneur
  rationale: Dans ce contexte, le terme désigne l’autorité provinciale romaine ; « gouverneur » est clair, exact et courant.
- source_word: Ἐκ πολλῶν ἐτῶν
  choice: depuis de nombreuses années
  rationale: L’expression temporelle indique une situation commencée antérieurement et toujours valable.
- source_word: ὄντα σε κριτὴν τῷ ἔθνει τούτῳ
  choice: tu es juge de cette nation
  rationale: La formulation conserve κριτής au sens de « juge » et rend le datif comme le groupe relevant de sa juridiction, sans réduire sa fonction à la seule administration.
- source_word: ἐπιστάμενος
  choice: Sachant
  rationale: Le participe exprime la connaissance qui fonde l’assurance de Paul et se transpose naturellement par un participe présent français.
- source_word: εὐθύμως
  choice: avec confiance
  rationale: L’adverbe peut exprimer la bonne disposition, le courage et l’assurance. Dans cette scène judiciaire, « avec confiance » rend bien l’attitude de Paul tout en conservant une autre nuance en note.
- source_word: τὰ περὶ ἐμαυτοῦ
  choice: au sujet de ce qui me concerne
  rationale: Cette tournure naturelle garde l’idée des affaires ou accusations concernant personnellement Paul.
- source_word: ἀπολογοῦμαι
  choice: je présente ma défense
  rationale: Le verbe appartient au registre judiciaire ; cette expression est idiomatique en français et plus précise que le simple « je me défends ».
