  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: fr
  text: Lorsque deux années se furent écoulées, Félix eut pour successeur Porcius Festus. Désireux de faire une faveur aux Juifs[a], Félix laissa Paul enchaîné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : cherchant à s’attirer la faveur des Juifs. L’expression grecque peut désigner soit une faveur accordée aux Juifs, soit la recherche de leur bienveillance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: Lorsque deux années se furent écoulées
  rationale: Le génitif absolu exprime ici une circonstance temporelle. Cette formulation française rend naturellement l’achèvement de la période de deux ans.
- source_word: ἔλαβεν διάδοχον
  choice: eut pour successeur
  rationale: Cette tournure idiomatique conserve le point de vue de la construction grecque, littéralement « reçut comme successeur », tout en étant naturelle en français.
- source_word: Πόρκιον Φῆστον
  choice: Porcius Festus
  rationale: Les noms sont transcrits selon leur forme française usuelle.
- source_word: θέλων
  choice: Désireux de
  rationale: Le participe indique le motif de Félix. Une construction détachée rend clairement ce rapport sans l’alourdir.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: faire une faveur aux Juifs
  rationale: Cette expression rend de façon naturelle l’une des valeurs reconnues de l’idiome grec. L’autre compréhension possible, selon laquelle Félix cherche à obtenir leur bienveillance, est conservée en note.
- source_word: κατέλιπε
  choice: laissa
  rationale: Le verbe indique que Félix maintint Paul dans son état au moment de quitter sa fonction.
- source_word: τὸν Παῦλον δεδεμένον
  choice: Paul en détention
  rationale: Le participe parfait passif décrit l’état persistant de Paul comme détenu. « En détention » est naturel en français et évite de préciser indûment le type matériel de liens.
