  yaml_path: translation/nt/acts/024/006.yaml
  text: He even tried to defile the temple[a], and we seized him,
translation:
  language: fr
  text: Il a même tenté de profaner le temple[a], et nous l’avons saisi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ajoutent ici une lecture plus longue, selon laquelle les accusateurs voulaient juger Paul selon leur loi et le commandant Lysias l’a arraché de leurs mains.
