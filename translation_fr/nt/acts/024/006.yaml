lexical_decisions:
- source_word: ὃς
  choice: Il
  rationale: Le pronom relatif renvoie à Paul. Dans ce fragment de réquisitoire, la reprise par « Il » est plus naturelle en français moderne que « qui » tout en conservant la continuité de l’accusation.
- source_word: καὶ
  choice: même
  rationale: Dans ce contexte accusatoire, καὶ renchérit sur le grief précédent ; « même » en restitue naturellement la valeur intensive.
- source_word: τὸ ἱερὸν
  choice: le temple
  rationale: Ἱερόν désigne ici l’ensemble du domaine du temple plutôt que le sanctuaire intérieur au sens strict. « Le temple » est la formulation française courante et suffisamment claire dans ce contexte.
- source_word: ἐπείρασεν
  choice: a tenté
  rationale: Le verbe exprime ici une tentative. « A tenté » est idiomatique et garde le caractère allégué d’un acte non nécessairement accompli.
- source_word: βεβηλῶσαι
  choice: de profaner
  rationale: Βεβηλόω signifie rendre profane, violer le caractère sacré. « Profaner » convient précisément à une accusation concernant le temple et reste compréhensible en français courant.
- source_word: ὃν
  choice: l’
  rationale: Le relatif accusatif renvoie à Paul comme objet de la saisie. Sa reprise par le pronom objet « l’ » donne une phrase française naturelle.
- source_word: ἐκρατήσαμεν
  choice: nous avons saisi
  rationale: Κρατέω signifie ici s’emparer de quelqu’un ou le saisir. « Nous avons saisi » conserve la nuance concrète et hostile, sans transformer le geste en arrestation judiciaire formelle.
theological_decisions:
- issue: Forme textuelle d’Actes 24.6 par rapport à la leçon byzantine longue
  choice: Traduire uniquement la leçon courte du SBLGNT, qui se termine ici par « et nous l’avons saisi, »
  alternative: Certains manuscrits ajoutent qu’ils voulaient juger Paul selon leur loi, mais que le commandant Lysias l’a arraché de leurs mains, avec des variations de formulation.
  rationale: Le texte grec fourni porte la leçon courte. La leçon longue n’est pas intégrée au corps du texte, mais elle est signalée en note afin de documenter une variante connue sans altérer le texte source retenu.
translation_notes:
  register: Français international moderne, naturel et digne. « Profaner » préserve la dimension sacrée et cultuelle de l’accusation. La virgule finale maintient le caractère syntaxiquement inachevé du verset dans la leçon critique, puisque le discours se poursuit.
