  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: fr
  text: Mais[a] le commandant Lysias est arrivé et l’a emmené de nos mains avec beaucoup de force,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset — ainsi que la fin du verset 6 et le début du verset 8 — est absent des plus anciens manuscrits grecs, notamment le papyrus 74 (IIIe siècle), le Codex Sinaiticus et le Codex Vaticanus (IVe siècle), ainsi que des anciennes traductions coptes. Il est conservé dans la tradition byzantine majoritaire, la tradition latine et des manuscrits grecs plus tardifs. Il semble constituer une ancienne expansion rédactionnelle qui relate, dans le discours devant Félix, l’intervention du commandant romain.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: est arrivé
  rationale: Le participe aoriste indique ici l’arrivée de Lysias sur les lieux. Une proposition coordonnée rend naturellement la succession des actions en français.
- source_word: χιλίαρχος
  choice: commandant
  rationale: Le terme désigne un tribun militaire romain, littéralement un chef de mille hommes. « Commandant » reste exact et immédiatement compréhensible sans imposer au lecteur un terme historique moins courant.
- source_word: μετὰ πολλῆς βίας
  choice: en recourant à une grande force
  rationale: Cette formulation exprime l’emploi considérable de la force physique tout en préservant le point de vue accusateur de l’orateur, sans ajouter l’idée de cruauté que pourrait suggérer « violence ».
- source_word: ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν
  choice: l’a arraché de nos mains
  rationale: Le verbe ἀπάγω signifie emmener ou retirer. Avec « de nos mains » et la mention de la force, « arracher » restitue de façon naturelle la dépossession vigoureuse affirmée par l’accusation.
