  text: ⸀οὐδὲ ⸀παραστῆσαι δύνανταί ⸀σοι περὶ ὧν ⸀νυνὶ κατηγοροῦσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: fr
  text: Ils ne peuvent pas non plus prouver devant toi ce dont ils m’accusent maintenant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présenter devant toi » ou « établir devant toi »; le verbe grec peut désigner le fait de présenter ou d’établir quelque chose, ici au sens d’étayer une accusation en justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ne… pas non plus
  rationale: Cette tournure poursuit naturellement en français la série de dénégations de Paul tout en conservant la valeur négative et connective du grec.
- source_word: παραστῆσαι
  choice: prouver
  rationale: Dans ce contexte judiciaire, le verbe évoque le fait de présenter ou d’établir des éléments à l’appui d’une accusation; « prouver » exprime clairement cette portée sans alourdir la phrase.
- source_word: δύνανταί
  choice: peuvent
  rationale: Rend directement et naturellement l’idée de capacité.
- source_word: σοι
  choice: devant toi
  rationale: Le datif désigne Félix, devant qui les accusations doivent être étayées. « Devant toi » est idiomatique dans ce cadre judiciaire, tout en restant proche de la relation exprimée en grec.
- source_word: περὶ ὧν
  choice: ce dont
  rationale: Cette formulation française concise et naturelle conserve le renvoi aux faits ou aux questions faisant l’objet des accusations sans introduire explicitement le nom « charges ».
- source_word: νυνὶ
  choice: maintenant
  rationale: Conserve la référence temporelle explicite au procès en cours.
- source_word: κατηγοροῦσίν μου
  choice: ils m’accusent
  rationale: Rend simplement le sens juridique du verbe et le pronom objet, sans paraphrase excessive.
