  text: ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, ἀνάστασιν μέλλειν ⸀ἔσεσθαι δικαίων τε καὶ ἀδίκων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: fr
  text: 'J’ai en Dieu cette espérance — que ceux-ci eux-mêmes attendent aussi — : il y aura une résurrection aussi bien des justes que des injustes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que ceux-ci eux-mêmes acceptent aussi ». Le verbe grec peut signifier « attendre avec espérance » ou « accepter » ; il souligne ici une attente partagée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: J’ai en Dieu cette espérance
  rationale: La tournure française transforme naturellement le participe en proposition tout en conservant le nom « espérance » et Dieu comme objet de cette espérance.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: que ceux-ci partagent eux-mêmes
  rationale: Dans le contexte judiciaire, « ceux-ci » désigne les interlocuteurs ou accusateurs présents. « Partagent » exprime ici l’attente reconnue comme commune, tandis que la note préserve le sens plus littéral d’« attendre ».
- source_word: ἀνάστασιν
  choice: une résurrection
  rationale: « Résurrection » est le terme français courant et précis pour le relèvement des morts dans ce contexte.
- source_word: μέλλειν ἔσεσθαι
  choice: il y aura
  rationale: Cette formulation rend clairement la perspective future sans imposer l’idée trompeuse d’une réalisation nécessairement immédiate.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: aussi bien des justes que des injustes
  rationale: La construction corrélative restitue τε καὶ et maintient explicitement le contraste moral entre les deux groupes.
theological_decisions:
- issue: Portée de la résurrection annoncée
  choice: une résurrection aussi bien des justes que des injustes
  alternative: une résurrection générale sans distinction morale explicite
  rationale: Le grec nomme expressément les justes et les injustes. La traduction conserve cette double portée sans préciser le calendrier, les modalités ou l’ordre des événements.
translation_notes:
  register: Français moderne, courant et digne. Les tirets isolent la précision incidente, et les deux-points introduisent naturellement le contenu de l’espérance. « Ceux-ci » conserve la référence démonstrative aux personnes présentes sans ajouter une désignation absente du grec.
