  to: 'J’ai en Dieu cette espérance — que ceux-ci eux-mêmes attendent aussi — : il y aura une résurrection aussi bien des justes que des injustes[a].'
  rationale: La révision remplace « partagent eux-mêmes » par une expression qui rend plus directement προσδέχονται, rétablit explicitement « aussi » pour καί et place « eux-mêmes » de manière à refléter l’insistance de αὐτοί. Elle maintient l’ambiguïté lexicale au moyen d’une note concise, sans trancher au-delà de ce que permet le contexte.
