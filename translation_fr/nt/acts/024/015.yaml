review_pass:
  verdict: revise
  source_fidelity: Le sens global est bien rendu, y compris l’espérance dirigée vers Dieu, la résurrection future et son extension aux justes comme aux injustes. Toutefois, « partagent » est plus interprétatif que προσδέχονται et ne rend pas explicitement le « aussi » (καί).
  naturalness: 'La phrase est fluide, mais « que ceux-ci partagent eux-mêmes » est légèrement ambigu en français : « eux-mêmes » peut qualifier le fait de partager plutôt que marquer l’insistance sur les personnes. « Que ceux-ci eux-mêmes attendent aussi » est plus transparent et conserve le ton démonstratif du discours.'
  terminology: « Espérance », « résurrection », « justes » et « injustes » sont justes, naturels et adaptés au registre. La note doit présenter « accepter » comme possibilité lexicale sans faire de « accueillir » un sens central dans ce contexte.
  issues:
  - severity: medium
    issue: « partagent eux-mêmes » affaiblit et interprète προσδέχονται, tout en ne marquant pas clairement καί (« aussi »).
    rationale: Le verbe peut désigner l’attente ou l’acceptation d’une espérance. « Partager » exprime l’idée contextuelle d’une conviction commune, mais ne correspond pas directement au verbe et laisse disparaître l’adverbe d’addition. Une formulation avec « attendent aussi » préserve mieux la possibilité première et l’emphase grecque.
  - severity: low
    issue: La note propose « accueilllir » parmi les sens sans préciser son caractère contextuellement moins approprié.
    rationale: Dans ce verset, προσδέχονται se comprend naturellement comme « attendre » ou « accepter/admettre » l’espérance annoncée. « Accueillir » est lexicalement possible dans d’autres emplois, mais peut brouiller la lecture ici.
  revised_text: 'J’ai en Dieu cette espérance — que ceux-ci eux-mêmes attendent aussi — : il y aura une résurrection aussi bien des justes que des injustes[a].'
  revised_footnotes:
