id: ACT.4.18
reference: Acts 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: fr
  text: Après les avoir appelés, ils leur ordonnèrent de ne rien dire du tout ni d’enseigner au nom de Jésus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλέσαντες
  choice: Après les avoir fait appeler
  rationale: Le participe aoriste exprime ici naturellement une action antérieure à l'ordre. La tournure française convient au contexte où les apôtres sont rappelés devant le Conseil, sans ajouter explicitement « entrer », absent du grec.
- source_word: παρήγγειλαν
  choice: ils leur ordonnèrent
  rationale: Le verbe désigne une directive donnée avec autorité; « ordonnèrent » en restitue clairement la force.
- source_word: τὸ καθόλου
  choice: ne plus du tout
  rationale: Cette expression renforce l'interdiction de façon absolue. Avec le verbe introducteur, « ne plus du tout » forme une interdiction idiomatique en français et marque la cessation exigée dans le contexte.
- source_word: μὴ φθέγγεσθαι
  choice: parler
  rationale: Le verbe signifie prendre la parole ou proférer des paroles. « Parler » reste naturel tout en conservant l'étendue générale de l'interdiction.
- source_word: μηδὲ διδάσκειν
  choice: ni enseigner
  rationale: « Ni » coordonne les deux activités interdites et reflète la force négative de μηδέ.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: au nom de Jésus
  rationale: La formule relie la parole et l'enseignement au nom de Jésus, avec une possible nuance de référence ou d'autorité. L'expression française traditionnelle et naturelle conserve cette densité sans la réduire à « au sujet de Jésus ».
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française courante du nom propre.
theological_decisions:
- issue: Portée de l'interdiction concernant le témoignage rendu à Jésus
  choice: Une interdiction générale de parler et d'enseigner au nom de Jésus
  alternative: Une interdiction limitée à la proclamation publique
  rationale: L'association de τὸ καθόλου avec μὴ φθέγγεσθαι μηδὲ διδάσκειν donne à l'ordre une portée emphatique et étendue. La traduction ne le limite donc pas à un cadre public que le verset ne précise pas.
- issue: Sens de « au nom de Jésus »
  choice: Conserver la formule ouverte « au nom de Jésus »
  alternative: Expliciter « sous l'autorité de Jésus » ou « au sujet de Jésus »
  rationale: La préposition ἐπί avec le datif peut exprimer le fondement ou la référence. La formule retenue préserve cette amplitude théologique au lieu d'imposer une seule nuance.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. Aucun marqueur de note n'est nécessaire, puisque le texte ne comporte aucune note.
