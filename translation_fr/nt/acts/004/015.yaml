  yaml_path: translation/nt/acts/004/015.yaml
  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: fr
  text: Mais, après leur avoir ordonné de sortir de la salle du conseil[a], ils délibéraient entre eux[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hors du Sanhédrin ». Le mot grec peut désigner le conseil dirigeant juif ou l’assemblée réunie.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils se consultaient les uns les autres » ou « ils discutaient entre eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κελεύσαντες
  choice: après leur avoir ordonné
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. Cette tournure française restitue naturellement l’enchaînement et le caractère officiel de l’ordre.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque ici une légère transition contrastive : après l’échange public, les dirigeants passent à une délibération privée.'
- source_word: αὐτοὺς
  choice: leur
  rationale: Le pronom renvoie à Pierre et Jean et s’intègre naturellement à la construction française « leur avoir ordonné ».
- source_word: ἔξω τοῦ συνεδρίου
  choice: sortir de la salle du Conseil
  rationale: Dans ce contexte, il s’agit de quitter le lieu ou la présence de l’assemblée réunie. « Sortir du Conseil » pourrait suggérer en français qu’ils en démissionnent; la mention de la salle rend le sens spatial explicite sans remplacer « Conseil » par le terme moins courant « Sanhédrin ».
- source_word: ἀπελθεῖν
  choice: sortir
  rationale: L’infinitif complète κελεύσαντες et, avec ἔξω, exprime le déplacement vers l’extérieur.
- source_word: συνέβαλλον
  choice: ils délibéraient
  rationale: Dans ce contexte, συμβάλλω désigne une concertation ou une délibération. L’imparfait français conserve l’aspect duratif de l’imparfait grec sans imposer explicitement une valeur inchoative.
- source_word: πρὸς ἀλλήλους
  choice: entre eux
  rationale: Cette expression réciproque est rendue par la formulation française la plus naturelle pour une discussion au sein du groupe.
