id: ACT.4.30
reference: Acts 4:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: fr
  text: tandis que tu étends ta main pour guérir et que des signes et des prodiges se produisent par le nom de ton saint serviteur Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton saint enfant Jésus ». Le mot grec pais peut signifier « enfant » ou « serviteur » ; ici, « serviteur » est retenu en raison des échos au langage du Serviteur dans Ésaïe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: tandis que tu étends
  rationale: La construction ἐν τῷ suivie de l’infinitif exprime ici une circonstance concomitante. « Tandis que » restitue naturellement cette valeur temporelle en français.
- source_word: τὴν χεῖρά σου
  choice: la main
  rationale: La traduction littérale conserve l’image biblique de la main de Dieu comme expression de son action et de sa puissance.
- source_word: εἰς ἴασιν
  choice: pour guérir
  rationale: Cette formulation rend naturellement en français la valeur de but de εἰς avec l’accusatif, tout en exprimant clairement l’action visée.
- source_word: σημεῖα καὶ τέρατα
  choice: des signes et des prodiges
  rationale: Il s’agit de l’expression biblique consacrée et naturelle en français, sans ajout interprétatif tel que « miraculeux ».
- source_word: γίνεσθαι
  choice: se produisent
  rationale: Le verbe désigne ici des événements qui ont lieu. « Se produisent » est idiomatique et conserve la formulation non explicitement agentive du grec.
- source_word: διὰ τοῦ ὀνόματος
  choice: par le nom
  rationale: διά avec le génitif marque l’intermédiaire ou le moyen. « Par le nom » conserve l’expression biblique sans expliciter davantage la notion d’autorité.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: de ton saint serviteur Jésus
  rationale: παῖς peut signifier « enfant » ou « serviteur ». Dans les Actes, l’écho au Serviteur d’Ésaïe favorise « serviteur », tandis que l’autre sens reste signalé en note.
theological_decisions:
- issue: Sens de παῖς appliqué à Jésus
  choice: serviteur
  alternative: enfant
  rationale: Les emplois voisins en Actes 3.13 et 3.26 ainsi que l’arrière-plan du Serviteur d’Ésaïe favorisent « serviteur ». Comme « enfant » demeure lexicalement possible, l’ambiguïté est préservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans la prière. La syntaxe maintient le verset comme prolongement de la phrase commencée au verset précédent.
