  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: fr
  text: Car nous, nous ne pouvons pas ne pas parler de ce que nous avons vu et entendu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Car nous ne pouvons nous empêcher de parler de ce que nous avons vu et entendu. »'
    reason: alternative_lexicale
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: nous ne pouvons pas
  rationale: Cette expression rend directement l’incapacité indiquée par le grec et permet de conserver la construction avec l’infinitif négatif.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison de la déclaration précédente ; « Car » en conserve clairement la valeur explicative.
- source_word: ἡμεῖς
  choice: quant à nous
  rationale: Le pronom grec exprimé porte une légère insistance ou un contraste. « Quant à nous » le fait ressortir sans lourdeur excessive.
- source_word: ἃ
  choice: ce que
  rationale: Cette tournure française naturelle désigne le contenu du témoignage sans recourir à la formulation plus pesante « les choses que ».
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: nous avons vu et entendu
  rationale: Le passé composé exprime naturellement en français des événements passés dont le témoignage demeure pertinent.
- source_word: μὴ λαλεῖν
  choice: ne pas ne pas parler
  rationale: Après l’expression d’incapacité, cette formulation conserve la structure négative du grec et souligne qu’ils ne peuvent garder le silence.
- source_word: λαλεῖν
  choice: parler de
  rationale: Dans ce contexte, le verbe concerne les faits dont les apôtres témoignent ; « parler de » explicite naturellement ce rapport en français.
theological_decisions:
- issue: La parole apostolique est présentée comme une incapacité à se taire plutôt que comme une simple décision de parler.
  choice: Le texte affirme que les apôtres ne peuvent pas ne pas parler.
  alternative: 'Rendre l’idée comme une ferme volonté ou une obligation morale : « nous ne cesserons pas de parler » ou « nous devons parler ».'
  rationale: La construction οὐ δυνάμεθα … μὴ λαλεῖν exprime directement l’impossibilité de s’abstenir de parler. La traduction maintient cette tension sans la réduire à une simple résolution.
translation_notes:
  register: Français moderne, digne et accessible. La double négation est volontaire afin de refléter étroitement la construction grecque ; la note fournit une formulation française plus idiomatique. « Quant à nous » rend l’insistance portée par le pronom explicite ἡμεῖς.
