  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: fr
  text: La multitude de ceux qui avaient cru n’avait qu’un cœur et qu’une âme[a]. Pas un seul ne disait d’aucun de ses biens qu’il lui appartenait en propre[b], mais ils avaient tout en commun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus dynamique : « étaient profondément unis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici le singulier de manière distributive : il considère chaque personne individuellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: multitude
  rationale: « Multitude » rend le grand nombre formant le corps des croyants, sans réduire le terme au simple « groupe ».
- source_word: τῶν πιστευσάντων
  choice: de ceux qui avaient cru
  rationale: Le participe aoriste est rendu verbalement et comme antérieur à la situation décrite.
- source_word: καρδία καὶ ψυχὴ μία
  choice: n’avait qu’un cœur et qu’une âme
  rationale: Cette tournure française naturelle conserve les deux noms et exprime leur profonde unité intérieure.
- source_word: οὐδὲ εἷς
  choice: Pas un seul
  rationale: La formulation préserve l’insistance de l’expression grecque.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: l’un de ses biens
  rationale: « Biens » exprime naturellement les possessions désignées par τὰ ὑπάρχοντα, tandis que le singulier distributif est maintenu dans « ses ».
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: ne disait que… lui appartenait en propre
  rationale: La formulation reste proche de la déclaration d’appartenance privée sans transformer le texte en affirmation sur un régime juridique précis.
- source_word: πάντα κοινά
  choice: ils avaient tout en commun
  rationale: Cette expression française courante rend la construction copulative et l’idée de mise en commun sans imposer une théorie économique ultérieure.
theological_decisions:
- issue: Description des biens mis en commun dans l’Église de Jérusalem
  choice: Le verset décrit le rapport volontaire des croyants à leurs biens et leur mise en commun, sans l’identifier à un système économique ou ecclésial ultérieur.
  alternative: Traduire plus fortement par « tout leur appartenait collectivement », ou affaiblir le texte en ne parlant que de générosité occasionnelle.
  rationale: Le grec affirme à la fois que personne ne considérait un bien comme exclusivement sien et que tout était commun entre eux. La traduction conserve cette tension descriptive sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. « N’avait qu’un cœur et qu’une âme » reprend un idiome français établi tout en conservant les deux images grecques. « Lui appartenait en propre » préserve la nuance de possession personnelle sans archaïsme ni importation idéologique.
