  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: fr
  text: Si nous sommes aujourd’hui interrogés au sujet d’une bonne action accomplie envers un homme infirme, par quel moyen cet homme a été guéri[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a été sauvé » ou « a été rétabli » ; le verbe grec peut désigner le salut, la délivrance ou la guérison. Ici, le contexte immédiat indique une guérison physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: sommes interrogés
  rationale: Le verbe désigne ici un interrogatoire ou un examen de caractère judiciaire. « Sommes interrogés » est naturel en français moderne et conserve la dimension officielle sans exagérer en parlant nécessairement de procès.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: au sujet d’un bienfait
  rationale: ἐπί avec le datif indique ici le motif ou l’objet de l’interrogatoire, et εὐεργεσία désigne un acte bénéfique. « Au sujet d’un bienfait » garde l’ironie de la situation et un registre digne.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: accordé à un homme infirme
  rationale: Le génitif identifie le bénéficiaire du bienfait. Dans le contexte, ἀσθενής renvoie à une faiblesse physique durable; « infirme » convient mieux que « malade » à l’homme qui était boiteux, sans préciser davantage son état.
- source_word: ἐν τίνι
  choice: par quel moyen
  rationale: La construction peut exprimer le moyen ou l’agent. « Par quel moyen » préserve l’ouverture de la formulation grecque, avant que le verset suivant ne nomme Jésus.
- source_word: σέσωσται
  choice: a été guéri
  rationale: Le parfait de σῴζω exprime ici le rétablissement physique accompli dont les effets demeurent. « A été guéri » convient au contexte immédiat, tandis que l’éventail « sauvé/rétabli » est signalé en note.
theological_decisions:
- issue: Portée de σέσωσται dans un récit de guérison
  choice: a été guéri
  alternative: a été sauvé; a été rétabli
  rationale: La guérison physique de l’homme auparavant boiteux est le référent immédiat. Cependant, σῴζω peut aussi désigner le salut; la note conserve ce chevauchement lexical et théologique sans imposer au texte principal un sens exclusivement sotériologique.
- issue: Valeur de ἐν τίνι
  choice: par quel moyen
  alternative: par qui; en qui
  rationale: La formulation grecque permet une nuance instrumentale ou personnelle. Le choix principal reste délibérément large afin de ne pas anticiper la réponse christologique du verset suivant.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste suspendue par un tiret final, conformément à la continuité syntaxique avec le verset suivant. « Et qu’on nous demande » explicite naturellement en français la relation entre le bienfait et la question examinée, sans modifier le contenu propositionnel.
