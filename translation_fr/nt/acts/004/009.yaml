revisions:
- from: Si nous sommes interrogés aujourd’hui au sujet d’un bienfait accordé à un homme infirme, et qu’on nous demande par quel moyen il a été guéri[a]—
  to: Si nous sommes aujourd’hui interrogés au sujet d’une bonne action accomplie envers un homme infirme, par quel moyen cet homme a été guéri[a]—
  rationale: La révision retire l’explicitation non exprimée « et qu’on nous demande » et rend l’enchaînement grec par une apposition directe. Elle remplace « bienfait accordé à » par « bonne action accomplie envers », qui exprime plus naturellement l’acte bénéfique visé. La note lexicale et son ancre sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:08:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure grecque présente directement l’objet de l’examen : le bienfait envers un homme infirme et la question de savoir par quel moyen celui-ci « a été sauvé/guéri ». L’ajout « et qu’on nous demande » rend la phrase fluide, mais introduit une proposition explicite qui n’est pas formulée dans le grec. Une juxtaposition appositionnelle conserve plus étroitement la syntaxe et la suspension vers le verset suivant.'
  naturalness: La formulation révisée est naturelle en français international moderne. « Bonne action accomplie envers » est plus idiomatique et plus précisément actionnel que « bienfait accordé à », tout en gardant le registre sobre du passage. Le tiret final convient puisque la phrase de Pierre se poursuit au verset 10.
  terminology: « Interrogés » rend adéquatement ἀνακρινόμεθα dans ce contexte judiciaire. « Homme infirme » est recevable, compte tenu de l’homme boiteux du contexte, sans préciser indûment sa condition. « Par quel moyen » maintient l’ouverture instrumentale/personnelle de ἐν τίνι. « A été guéri » reflète le référent physique immédiat de σέσωσται; la note préserve à juste titre les autres sens possibles.
  issues:
  - severity: medium
    issue: Ajout de « et qu’on nous demande »
    rationale: Cette proposition explicite une relation implicite, mais elle ajoute un acte de demande distinct là où le grec enchaîne directement le motif de l’examen et la question « par quel moyen ». La suppression permet de suivre la formulation source sans nuire à l’intelligibilité.
  - severity: low
    issue: « Bienfait accordé à »
    rationale: La formule peut évoquer un avantage ou une faveur octroyée plutôt qu’une action bénéfique accomplie. « Bonne action accomplie envers » rend plus directement εὐεργεσία et la relation au bénéficiaire.
