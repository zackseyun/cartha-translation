id: ACT.4.12
reference: Acts 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: fr
  text: Il n’y a de salut en aucun autre, car il n’existe sous le ciel aucun autre nom qui ait été donné parmi les êtres humains, par lequel nous devons être sauvés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωτηρία
  choice: salut
  rationale: « Salut » rend naturellement le nom grec et conserve à la fois l’idée de délivrance et sa portée théologique dans la proclamation de Pierre.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: en personne d’autre
  rationale: Cette formulation conserve la construction avec ἐν et souligne que l’affirmation porte sur une personne, sans réduire le sens à une voie abstraite.
- source_word: ὄνομα
  choice: nom
  rationale: Le terme est maintenu sans paraphrase afin de préserver ses résonances de personne, d’autorité et d’identité révélée.
- source_word: ἕτερον
  choice: autre
  rationale: Dans cette proposition négative, « aucun autre nom » exprime clairement et naturellement l’exclusivité du grec.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: sous le ciel
  rationale: L’expression française conserve l’image biblique et sa portée universelle, avec un registre solennel mais compréhensible.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: qui ait été donné parmi les êtres humains
  rationale: « Parmi les êtres humains » rend la valeur générique et inclusive de ἀνθρώποις; le subjonctif s’intègre naturellement après « aucun autre nom » sans atténuer le parfait passif grec.
- source_word: ἐν ᾧ
  choice: par lequel
  rationale: Le relatif renvoie à « nom » et « par lequel » exprime en français le moyen associé au salut.
- source_word: δεῖ
  choice: devions
  rationale: Dans « par lequel nous devions être sauvés », l’imparfait du subjonctif verbal après l’antécédent indéfini négatif traduit la nécessité exprimée par δεῖ dans un français soutenu et naturel.
- source_word: σωθῆναι
  choice: être sauvés
  rationale: Le passif est conservé et fait écho au nom « salut » au début du verset.
theological_decisions:
- issue: Exclusivité du salut en relation avec Jésus
  choice: « il n’y a de salut en personne d’autre »
  alternative: « il n’y a pas d’autre voie de salut »
  rationale: Le grec affirme directement que le salut ne se trouve en aucune autre personne. La traduction conserve cette exclusivité sans ajouter d’explication doctrinale.
- issue: Portée de ἀνθρώποις
  choice: « parmi les êtres humains »
  alternative: « parmi les hommes »
  rationale: Le terme grec désigne ici l’humanité en général. La formulation inclusive exprime directement cette portée en français moderne sans modifier le référent.
- issue: Référent et portée de ἐν ᾧ
  choice: « par lequel » renvoie au « nom »
  alternative: « dans lequel »
  rationale: La traduction conserve le référent grammatical tout en exprimant idiomatiquement le moyen du salut; elle ne remplace pas « nom » par une interprétation explicative comme « personne » ou « autorité ».
translation_notes:
  register: Français international moderne, digne et accessible. L’idiome biblique « sous le ciel » et le terme théologique courant « salut » sont conservés. La syntaxe reste proche du grec tout en évitant un calque pesant; aucune note n’est nécessaire, puisque la portée générique de ἀνθρώποις est explicite dans le texte principal.
