  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: fr
  text: Ils les déposaient aux pieds des apôtres[a][b], et on les distribuait à chacun selon ses besoins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devant les apôtres ». Le grec dit littéralement « aux pieds des apôtres », image qui évoque aussi le fait de placer ces biens sous leur responsabilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ce qui était déposé et distribué est sous-entendu d’après le verset précédent : les sommes provenant des biens vendus.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: ils les déposaient
  rationale: L’imparfait exprime une action répétée ou habituelle. « Déposaient » rend naturellement le geste concret, tandis que le pronom reprend ce qui est implicite dans le grec et fourni par le verset précédent.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: aux pieds des apôtres
  rationale: Cette formulation conserve l’image concrète du grec et suggère, sans l’expliciter, que les biens remis relevaient désormais de la responsabilité des apôtres.
- source_word: διεδίδετο
  choice: on les distribuait
  rationale: L’imparfait rend une pratique suivie. Le « on » français conserve l’agent indéterminé de la forme passive grecque et évite la tournure lourde « ils étaient distribués ».
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: Cette expression française courante préserve la valeur distributive individuelle du datif singulier.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: selon ses besoins
  rationale: La formule exprime que la distribution correspondait aux besoins de chaque personne. Le pluriel « besoins » est idiomatique en français sans modifier le sens du singulier collectif grec χρείαν.
- source_word: τις
  choice: chacun / ses
  rationale: Dans ce contexte, le pronom indéfini a une portée générale. La formulation française reste inclusive et naturelle.
theological_decisions:
- issue: Faut-il expliciter ce qui était déposé et distribué ?
  choice: Conserver un pronom dont le référent est fourni par le verset précédent.
  alternative: Ajouter explicitement « le produit des ventes » ou « l’argent ».
  rationale: Le grec ne répète pas l’objet et dépend du contexte précédent. Le pronom préserve cette continuité sans imposer une précision absente de ce verset.
- issue: Relation entre la mesure de la distribution et les besoins
  choice: « selon ses besoins »
  alternative: « dans la mesure où quelqu’un en avait besoin »
  rationale: La traduction retenue conserve l’idée de proportion ou de correspondance exprimée par καθότι, sans définir davantage la nature ni l’évaluation des besoins.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend le caractère répété des deux actions. « Puis » marque la progression narrative portée par δέ sans lui donner une opposition forte.
