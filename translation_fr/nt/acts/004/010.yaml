id: ACT.4.10
reference: Acts 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: fr
  text: 'Que vous tous et tout le peuple d’Israël le sachiez : c’est au nom de Jésus le Messie[a], le Nazaréen, que vous avez crucifié et que Dieu a ressuscité d’entre les morts, c’est par lui[b] que cet homme se tient devant vous en bonne santé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus Christ, le Nazaréen ». Le grec Χριστός peut être traduit par « Messie » ou, dans un emploi plus proche d’un nom propre, par « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « par ce nom ». L’expression grecque ἐν τούτῳ peut renvoyer à Jésus lui-même comme agent, ou plus précisément à son nom mentionné juste auparavant.
    reason: lexical_alternative
  - marker: c
    text: Ou « bien portant » ou « rétabli ». Le grec ὑγιής désigne un état sain ou une santé restaurée.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: Que … le sachiez
  rationale: Cette tournure française naturelle conserve la force solennelle de la déclaration impérative grecque.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: vous tous et tout le peuple d’Israël
  rationale: Maintient la distinction entre les interlocuteurs immédiats et l’ensemble du peuple d’Israël.
- source_word: ἐν τῷ ὀνόματι
  choice: au nom de
  rationale: Conserve l’expression grecque tout en permettant d’entendre ici l’autorité ou la puissance efficace associée au nom de Jésus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Rend Χριστός comme un titre encore porteur de son sens messianique dans cette proclamation adressée aux responsables d’Israël.
- source_word: τοῦ Ναζωραίου
  choice: le Nazaréen
  rationale: Reproduit directement le qualificatif grec désignant Jésus par son origine nazaréenne.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: que vous avez crucifié
  rationale: Préserve l’accusation directe et l’insistance du pronom ὑμεῖς, exprimée en français par « vous ».
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: que Dieu a ressuscité d’entre les morts
  rationale: Expression française consacrée et fidèle qui maintient explicitement l’action de Dieu et la résurrection de Jésus.
- source_word: ἐν τούτῳ
  choice: par lui
  rationale: Le démonstratif renvoie naturellement à Jésus et a ici une valeur instrumentale; l’autre possibilité, « par ce nom », est signalée en note.
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: cet homme se tient devant vous
  rationale: « Cet homme » identifie clairement l’homme guéri présent devant le conseil, tandis que le présent français rend l’état actuel exprimé par le parfait grec.
- source_word: ὑγιής
  choice: en bonne santé
  rationale: Rend clairement l’état de santé physique restauré sans ajouter au texte une explication sur le processus de guérison.
theological_decisions:
- issue: 'Valeur de Χριστός : titre ou élément de nom'
  choice: le Messie
  alternative: Christ
  rationale: Devant les responsables et le peuple d’Israël, le titre garde ici sa portée messianique; « Christ » demeure toutefois une traduction possible dans un usage plus proche d’un nom propre.
- issue: Référent et valeur instrumentale de ἐν τούτῳ
  choice: par lui
  alternative: par ce nom
  rationale: Le masculin démonstratif peut renvoyer à Jésus lui-même, mais le contexte immédiat du « nom » permet aussi d’y voir une reprise de ce nom; la note conserve cette ambiguïté.
- issue: Formulation de la résurrection
  choice: que Dieu a ressuscité d’entre les morts
  alternative: ''
  rationale: La traduction conserve sans développement supplémentaire l’action explicite de Dieu et l’affirmation de la résurrection de Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la déclaration publique, l’accusation directe portée contre les auditeurs et le contraste avec l’action de Dieu. Les répétitions et ambiguïtés théologiquement significatives sont maintenues ou documentées en note.
