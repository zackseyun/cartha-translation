id: ACT.4.26
reference: Acts 4:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: fr
  text: Les rois de la terre se sont dressés, et les dirigeants se sont rassemblés contre le Seigneur et contre son Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son Christ »; le grec porte Christos, c’est-à-dire « celui qu’il a oint ».
    reason: Signaler la traduction traditionnelle de Χριστός et expliciter le sens du titre sans effacer son arrière-plan dans le Psaume 2.
lexical_decisions:
- source_word: παρέστησαν
  choice: se sont dressés
  rationale: Dans cette citation du Psaume 2.2, le verbe exprime une prise de position délibérée et hostile, et non le simple fait de se tenir debout.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Cette formulation conserve le titre politique précis et la portée universelle de la citation.
- source_word: οἱ ἄρχοντες
  choice: les dirigeants
  rationale: « Dirigeants » est naturel en français moderne et maintient le parallélisme avec « rois » sans imposer le titre plus précis de « princes ».
- source_word: συνήχθησαν ἐπὶ τὸ αὐτό
  choice: se sont rassemblés
  rationale: Le verbe pronominal français exprime naturellement le rassemblement commun indiqué par le passif grec et par l’expression ἐπὶ τὸ αὐτό.
- source_word: κατὰ
  choice: contre
  rationale: Dans ses deux occurrences, la préposition marque clairement une opposition hostile.
- source_word: τοῦ κυρίου
  choice: le Seigneur
  rationale: « Seigneur » rend le titre divin κύριος et préserve le poids scripturaire de la citation.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: son Messie
  rationale: Dans la citation du Psaume 2, χριστός fonctionne comme un titre et désigne celui que le Seigneur a oint; « Messie » conserve ce cadre biblique.
theological_decisions:
- issue: Traduction de Χριστός dans la citation du Psaume 2
  choice: Messie
  alternative: Christ; celui qu’il a oint
  rationale: Le terme est ici un titre rattaché au Seigneur, non simplement un nom propre. « Messie » préserve le lien avec l’oint royal du Psaume, tandis que la note signale l’autre traduction traditionnelle.
translation_notes:
  register: Français international moderne, digne et direct. « Se sont dressés » rend l’opposition volontaire; « dirigeants » évite l’archaïsme possible de « princes ». Le parallélisme et la répétition de « contre » sont conservés.
