id: ACT.4.31
reference: Acts 4:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: fr
  text: Après qu’ils eurent prié, le lieu où ils étaient rassemblés fut ébranlé. Ils furent tous remplis de l’Esprit Saint et annonçaient la parole de Dieu avec assurance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec hardiesse » ou « avec franchise ». Le terme grec évoque une parole ouverte et sans crainte.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: Après qu’ils eurent prié
  rationale: Le génitif absolu à l’aoriste fournit l’arrière-plan temporel. Cette formulation exprime naturellement en français que l’ébranlement a suivi leur prière, sans alourdir le texte par « supplié ».
- source_word: ἐσαλεύθη
  choice: trembla
  rationale: Le passif grec indique que le lieu fut soumis à un ébranlement. « Trembla » rend clairement et naturellement le phénomène physique.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: où ils étaient rassemblés
  rationale: La construction périphrastique décrit leur état de rassemblement. « Étaient rassemblés » conserve cette nuance sans suggérer seulement l’action antérieure de se réunir.
- source_word: ἐπλήσθησαν ἅπαντες τοῦ ἁγίου πνεύματος
  choice: Ils furent tous remplis de l’Esprit saint
  rationale: Cette formulation conserve le passif, l’inclusion de tout le groupe et l’expression lucanienne du remplissage par l’Esprit.
- source_word: ἐλάλουν
  choice: annonçaient
  rationale: L’imparfait grec présente une activité en cours. Dans ce contexte missionnaire, « annonçaient » exprime en français naturel le fait de communiquer publiquement la parole, sans introduire la nuance ponctuelle de « se mirent à ».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette expression établie conserve à la fois l’idée du message proclamé et le poids de la formule biblique.
- source_word: μετὰ παρρησίας
  choice: avec assurance
  rationale: παρρησία désigne ici une parole ouverte, libre et sans crainte. « Avec assurance » est actuel et naturel; une note signale les nuances possibles de hardiesse et de franchise.
theological_decisions:
- issue: Langage du remplissage par l’Esprit
  choice: Ils furent tous remplis de l’Esprit saint
  alternative: Ils furent tous remplis par l’Esprit saint
  rationale: Le génitif après πίμπλημι se rend naturellement comme le contenu dont ils sont remplis. La traduction maintient l’affirmation de l’action divine sans définir un schéma doctrinal particulier de l’expérience de l’Esprit.
- issue: Valeur aspectuelle de ἐλάλουν
  choice: annonçaient
  alternative: annoncèrent / se mirent à annoncer
  rationale: L’imparfait grec met en relief une proclamation en cours. Le choix évite de réduire cette action à un événement ponctuel ou d’ajouter explicitement une nuance de commencement.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation en deux phrases évite une accumulation pesante tout en préservant la progression du grec. « Esprit saint » est traité comme un nom propre divin; la minuscule à « saint » suit un usage français courant.
