  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: fr
  text: 'Alors Pierre, rempli de l’Esprit saint, leur dit : « Chefs du peuple et anciens, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque la succession narrative de manière naturelle en français moderne.
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: πλησθεὶς
  choice: rempli
  rationale: Le participe passé rend naturellement le participe aoriste passif et conserve l’idée que Pierre reçoit cette plénitude.
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit saint
  rationale: Après « rempli », la construction française idiomatique emploie « de » ; « Esprit saint » désigne ici l’Esprit divin dans le contexte des Actes.
- source_word: εἶπεν πρὸς αὐτούς
  choice: leur dit
  rationale: Formulation narrative française directe et idiomatique.
- source_word: Ἄρχοντες
  choice: Chefs
  rationale: Désigne les personnes investies de l’autorité dirigeante ; « chefs » est naturel dans cette adresse officielle, sans limiter leur rôle au domaine politique.
- source_word: τοῦ λαοῦ
  choice: du peuple
  rationale: Rendu direct de l’expression, qui désigne ici le peuple d’Israël dans son cadre civico-religieux.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Dans ce contexte institutionnel, le terme désigne les anciens reconnus comme autorités, non simplement des hommes âgés.
theological_decisions:
- issue: Référent de πνεύματος ἁγίου
  choice: l’Esprit saint
  alternative: un esprit saint
  rationale: Dans le récit des Actes, l’expression désigne l’Esprit divin qui donne à Pierre la capacité de témoigner. L’article français est nécessaire à l’expression naturelle, même si le grec n’en comporte pas ici.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse officielle demeure concise. La virgule finale est conservée parce que la phrase et le discours se poursuivent au verset suivant.
