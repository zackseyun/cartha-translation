  naturalness: « Témoignaient de la résurrection » est la tournure moderne la plus naturelle et non ambiguë en français. « Avec une grande puissance » et « reposait sur eux tous » sont fluides dans un registre biblique international contemporain.
  terminology: « Seigneur Jésus », « résurrection », « grâce » et « puissance » sont appropriés. La note conserve utilement « faveur » comme possibilité lexicale pour χάρις sans décider si la faveur vient de Dieu, d’autrui, ou des deux.
