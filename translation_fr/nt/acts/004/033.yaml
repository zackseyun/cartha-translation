  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: fr
  text: Avec une grande puissance, les apôtres témoignaient de la résurrection du Seigneur Jésus, et une grande grâce reposait sur eux tous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une grande faveur reposait sur eux tous ». Le grec χάρις peut signifier « grâce » ou « faveur » ; le terme peut évoquer la présence bienveillante de Dieu, le regard favorable porté sur les croyants, ou les deux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: avec une grande puissance
  rationale: Le datif exprime la manière ou le moyen. « Puissance » est naturel dans Luc-Actes et laisse ouverte la forme précise de cette efficacité.
- source_word: ἀπεδίδουν τὸ μαρτύριον
  choice: rendaient témoignage
  rationale: L’imparfait marque une action continue ou répétée. L’expression française « rendre témoignage » restitue bien l’idiome grec sans lourdeur.
- source_word: τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ
  choice: à la résurrection du Seigneur Jésus
  rationale: Le génitif indique ici le contenu ou l’objet du témoignage. « Témoigner à la résurrection » est une tournure française formelle et concise.
- source_word: χάρις τε μεγάλη
  choice: une grande grâce
  rationale: « Grâce » conserve l’étendue sémantique de χάρις, qui peut évoquer la bienveillance, la faveur ou l’action gracieuse de Dieu, sans préciser une source que le texte ne nomme pas.
- source_word: ἐπὶ πάντας αὐτούς
  choice: reposait sur eux tous
  rationale: Cette formulation préserve l’image de quelque chose qui s’étend sur l’ensemble de la communauté et souligne que personne n’en est exclu.
theological_decisions:
- issue: Sens et source de χάρις
  choice: une grande grâce reposait sur eux tous
  alternative: ils jouissaient tous d’une grande faveur
  rationale: Le grec ne précise pas s’il s’agit principalement de la grâce divine, de la faveur des gens ou des deux. Le texte principal conserve le terme théologiquement riche « grâce », tandis que la note présente l’autre lecture sans résoudre l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en employant les expressions idiomatiques « rendre témoignage » et « reposer sur ». Le marqueur de note est placé après la proposition qu’il éclaire.
