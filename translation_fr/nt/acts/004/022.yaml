id: ACT.4.22
reference: Acts 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: fr
  text: En effet, l’homme chez qui s’était produit ce signe de guérison avait plus de quarante ans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce miracle de guérison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: avait plus de quarante ans
  rationale: Cette tournure grecque exprime idiomatiquement l’âge. « Avait plus de quarante ans » est la formulation française la plus naturelle et précise dans ce récit au passé.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit ici une explication qui appuie ce qui précède. « En effet » rend clairement ce lien discursif en français courant.
- source_word: ὁ ἄνθρωπος
  choice: l’homme
  rationale: Le terme désigne ici un individu masculin précis, déjà connu dans le contexte.
- source_word: ἐφ’ ὃν
  choice: sur qui
  rationale: ἐπί avec l’accusatif désigne ici la personne concernée par le signe. « Sur qui » conserve directement cette relation sans transformer l’homme en agent.
- source_word: γεγόνει
  choice: s’était produit
  rationale: Le plus-que-parfait de γίνομαι présente un événement déjà accompli. La tournure pronominale française préserve l’accent mis sur l’événement sans ajouter un agent explicite.
- source_word: τὸ σημεῖον τοῦτο
  choice: ce signe
  rationale: « Signe » conserve la portée révélatrice et attestatrice de σημεῖον dans les Actes, là où « miracle » mettrait surtout l’accent sur le caractère extraordinaire.
- source_word: τῆς ἰάσεως
  choice: de guérison
  rationale: ἴασις désigne une guérison ou une cure. Le complément « de guérison » conserve la construction grecque tout en restant compréhensible en français.
theological_decisions:
- issue: Traduction de σημεῖον dans un contexte miraculeux
  choice: signe
  alternative: miracle
  rationale: « Signe » préserve la dimension attestatrice et révélatrice du terme grec sans nier le caractère miraculeux de la guérison.
- issue: Agent implicite ou non dans γεγόνει
  choice: s’était produit
  alternative: avait été accompli
  rationale: Le grec emploie γίνομαι et ne nomme pas explicitement l’agent dans cette proposition. « S’était produit » évite d’introduire une précision absente du verset, tandis que le contexte plus large indique l’origine divine de la guérison.
translation_notes:
  register: Français moderne, international et digne. « En effet » assure une transition naturelle; la formulation conserve « signe » et l’absence d’agent explicite, malgré une légère densité syntaxique voulue pour rester proche du grec.
