source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: fr
  text: 'Après les avoir placés au milieu, ils se mirent à les interroger[a] : « Par quelle puissance ou au nom de qui avez-vous fait cela, vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils les interrogeaient » ou « ils les questionnaient ». L’imparfait grec peut souligner une interrogation en cours plutôt que son commencement.'
    reason: alternative lexicale et valeur aspectuelle de l’imparfait grec
lexical_decisions:
- source_word: στήσαντες
  choice: Après les avoir placés
  rationale: Le participe aoriste exprime ici une action antérieure à l’interrogatoire. Cette formulation rend clairement la succession temporelle en français naturel.
- source_word: ἐν τῷ μέσῳ
  choice: au milieu
  rationale: La traduction conserve le sens spatial de l’expression grecque sans expliciter davantage la scène judiciaire.
- source_word: ἐπυνθάνοντο
  choice: ils se mirent à les interroger
  rationale: L’imparfait grec peut être compris comme inchoatif dans ce récit. « Se mirent à » rend cette nuance, tandis que « interroger » convient à l’enquête officielle et au caractère suivi de la question.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: Par quelle puissance
  rationale: « Puissance » correspond directement à δύναμις et évite de confondre ce terme avec l’idée distincte d’autorité, déjà suggérée par le nom.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: ou au nom de qui
  rationale: En français idiomatique, agir « au nom de » quelqu’un préserve l’idée d’une personne invoquée ou représentée. Le grec emploie littéralement l’interrogatif « quel », mais, appliqué au nom, il demande naturellement l’identité de celui dont le nom est en cause.
- source_word: ἐποιήσατε τοῦτο
  choice: avez-vous fait cela
  rationale: Le passé composé est naturel en français pour une action passée dont le résultat demeure présent dans la scène.
- source_word: ὑμεῖς
  choice: vous ?
  rationale: Le pronom grec explicite est emphatique. Son maintien en position détachée à la fin de la question reproduit cette insistance sans recourir au plus appuyé « vous-mêmes ».
theological_decisions:
- issue: Faut-il traduire δύναμις par « puissance » ou l’interpréter comme « autorité » ?
  choice: puissance
  alternative: autorité
  rationale: Le grec distingue la δύναμις, la puissance opérante, du « nom », qui porte déjà une dimension d’autorité représentative. « Puissance » maintient cette tension lexicale.
- issue: Le « nom » doit-il rester impersonnel (« quel nom ») ou être formulé personnellement en français ?
  choice: au nom de qui
  alternative: par quel nom / en quel nom
  rationale: Dans le contexte, la question vise la personne dont le nom a été invoqué. « Au nom de qui » est le tour français courant tout en préservant la notion biblique d’agir au nom de quelqu’un.
translation_notes:
  register: Français moderne, international et digne. « Au milieu » conserve la sobriété de la mise en scène. La reprise finale « vous ? » rend l’emphase de ὑμεῖς et donne à la question le ton accusateur du contexte.
