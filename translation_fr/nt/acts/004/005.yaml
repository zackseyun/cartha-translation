  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: fr
  text: Le lendemain, leurs dirigeants, anciens et scribes furent réunis à Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent rassemblés ». Le verbe grec est à la voix passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Le lendemain
  rationale: La formule narrative fait avancer le récit. En français moderne, il est naturel de l’intégrer à l’indication temporelle plutôt que de traduire littéralement « il arriva que ».
- source_word: ἐπὶ τὴν αὔριον
  choice: le lendemain
  rationale: Cette expression idiomatique désigne le jour suivant; « le lendemain » est la formulation française la plus naturelle et précise.
- source_word: συναχθῆναι
  choice: se réunirent
  rationale: Le verbe exprime le rassemblement des membres du groupe. Le pronominal français rend naturellement l’événement, tandis qu’une note signale la forme passive du grec.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le possessif conserve le lien relationnel exprimé par le génitif grec sans préciser un antécédent que le verset ne nomme pas explicitement.
- source_word: τοὺς ἄρχοντας
  choice: chefs
  rationale: Dans ce contexte, le terme désigne les autorités dirigeantes. « Chefs » est naturel en français et suffisamment large.
- source_word: τοὺς πρεσβυτέρους
  choice: anciens
  rationale: Il s’agit de responsables reconnus de la communauté, et non simplement d’hommes âgés; « anciens » est le terme institutionnel consacré.
- source_word: τοὺς γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce cadre juif, le mot désigne la classe des experts des Écritures et de la Loi. Cette formulation communique leur fonction plus clairement que « scribes » au lecteur moderne.
- source_word: ἐν Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Avec un verbe de réunion comportant une idée de mouvement vers un lieu, « à Jérusalem » est la tournure française naturelle.
theological_decisions:
- issue: Référent de αὐτῶν dans la désignation des autorités réunies
  choice: Conserver « leurs » sans préciser son antécédent
  alternative: Omettre le possessif, ou expliciter « les chefs juifs »
  rationale: Le grec comporte le pronom relationnel, mais son antécédent dépend du contexte. La traduction le conserve sans introduire une identification plus étroite que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite la tournure vieillie « il arriva que ». « Spécialistes de la Loi » explicite la fonction institutionnelle de γραμματεῖς sans ajouter d’appartenance confessionnelle.
