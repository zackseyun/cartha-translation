review_pass:
  verdict: revise
  source_fidelity: 'La traduction doit éviter d’expliciter γραμματεῖς comme des « spécialistes de la Loi » : le grec désigne les scribes, sans employer ici le mot « Loi ». « Furent réunis » rend directement l’aoriste passif συναχθῆναι. L’omission de la formule narrative Ἐγένετο δὲ est acceptable en français moderne lorsqu’elle est absorbée par « Le lendemain ».'
  naturalness: « Le lendemain, leurs dirigeants, anciens et scribes furent réunis à Jérusalem » est une phrase claire, digne et naturelle dans un registre biblique moderne. Un seul possessif français porte sur les trois groupes coordonnés, conformément à αὐτῶν.
  terminology: « Dirigeants » rend ἄρχοντες sans registre familier; « anciens » conserve le sens institutionnel de πρεσβύτεροι; « scribes » respecte le terme historique γραμματεῖς sans ajouter une fonction explicitée absente de ce verset.
  issues:
  - severity: medium
    issue: « spécialistes de la Loi » explicite γραμματεῖς au-delà du lexique du verset.
    rationale: Les scribes étaient effectivement associés à l’interprétation et à l’enseignement, mais γραμματεῖς signifie d’abord « scribes ». L’ajout de « la Loi » introduit une désignation qui n’apparaît pas dans le texte grec et réduit inutilement la largeur du terme.
  - severity: low
    issue: La note propose « s’assemblèrent » comme alternative alors que le grec est passif.
    rationale: Une formulation pronominale française peut être idiomatique, mais elle ne constitue pas une alternative qui reflète la voix passive signalée par la note. La note doit proposer des équivalents passifs.
  revised_text: Le lendemain, leurs dirigeants, anciens et scribes furent réunis à Jérusalem.[a]
  revised_footnotes:
  - marker: a
    text: Ou « furent rassemblés ». Le verbe grec est à la voix passive.
    reason: lexical_alternative
  revision_rationale: La révision conserve l’ambiguïté du possessif αὐτῶν et les trois catégories institutionnelles, tout en employant « scribes », équivalent direct de γραμματεῖς. Elle rend aussi explicitement la voix passive de συναχθῆναι dans le texte et harmonise la note avec ce choix.
