revisions:
- from: Le lendemain, leurs chefs, leurs anciens et leurs spécialistes de la Loi se réunirent à Jérusalem.[a]
  to: Le lendemain, leurs dirigeants, anciens et scribes furent réunis à Jérusalem.[a]
  rationale: La révision conserve l’ambiguïté du possessif αὐτῶν et les trois catégories institutionnelles, tout en employant « scribes », équivalent direct de γραμματεῖς. Elle rend aussi explicitement la voix passive de συναχθῆναι dans le texte et harmonise la note avec ce choix.
