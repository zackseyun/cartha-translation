id: ACT.4.11
reference: Acts 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: fr
  text: C’est lui, la pierre que vous, les bâtisseurs, avez rejetée et qui est devenue la pierre angulaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pierre de couronnement » ; littéralement, « la tête de l’angle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: C’est lui
  rationale: Le démonstratif désigne emphatiquement Jésus dans le contexte immédiat. « C’est lui » rend cette identification directe de façon naturelle en français.
- source_word: λίθος
  choice: la pierre
  rationale: « Pierre » est le sens usuel et maintient l’allusion au Psaume 118 sans renforcer indûment le terme en « rocher ».
- source_word: ἐξουθενηθεὶς
  choice: avez rejetée
  rationale: Le verbe peut exprimer le mépris ou le fait de tenir pour rien. Dans l’image de la construction, « rejeter » communique clairement le traitement subi par la pierre.
- source_word: ὑφ’ ὑμῶν
  choice: que vous… avez rejetée
  rationale: La formulation conserve l’accusation directe à la deuxième personne du pluriel.
- source_word: οἰκοδόμων
  choice: les bâtisseurs
  rationale: « Bâtisseurs » conserve la métaphore scripturaire tout en étant naturel en français moderne.
- source_word: γενόμενος
  choice: est devenue
  rationale: Le passé composé présente le changement accompli et son résultat actuel dans le contexte.
- source_word: κεφαλὴν γωνίας
  choice: la pierre maîtresse de l’angle
  rationale: Cette expression française garde l’image architecturale et l’idée de prééminence portée par « tête de l’angle », sans trancher excessivement entre pierre de fondation et pierre de couronnement.
theological_decisions:
- issue: Sens architectural de κεφαλὴ γωνίας dans la citation du Psaume 118.22
  choice: la pierre maîtresse de l’angle
  alternative: la pierre angulaire ; la pierre de couronnement ; littéralement, la tête de l’angle
  rationale: Le référent architectural exact reste discuté. Le texte principal conserve l’idée d’une pierre devenue prééminente, tandis que la note présente les principales possibilités sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « que vous, les bâtisseurs, avez rejetée » préserve l’adresse accusatrice et met en relief l’identification métaphorique de l’auditoire aux bâtisseurs.
