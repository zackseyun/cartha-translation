id: ACT.4.3
reference: Acts 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: fr
  text: Ils mirent les mains sur eux[a] et les placèrent en détention[b] jusqu’au lendemain, car il était déjà soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les saisirent » ou « les arrêtèrent ». L’expression grecque signifie littéralement « mirent les mains sur eux » et désigne souvent une appréhension hostile.
    reason: lexical_alternative
  - marker: b
    text: Ou « les mirent sous bonne garde » ou « les emprisonnèrent ». Le grec parle de les garder en détention sans préciser le lieu exact.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: mirent la main sur eux
  rationale: Cette expression française conserve l’image de l’idiome grec tout en exprimant naturellement, dans ce contexte hostile, l’idée d’une arrestation physique.
- source_word: αὐτοῖς
  choice: sur eux
  rationale: Le pronom renvoie à Pierre et Jean et s’intègre naturellement à l’expression française « mettre la main sur ».
- source_word: ἔθεντο εἰς τήρησιν
  choice: les placèrent en détention
  rationale: τήρησις désigne le fait de garder quelqu’un sous surveillance ou en détention, sans préciser qu’il s’agit nécessairement d’une prison.
- source_word: εἰς τὴν αὔριον
  choice: jusqu’au lendemain
  rationale: La formule exprime la limite temporelle de la détention et convient naturellement à un récit au passé.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: car c’était déjà le soir
  rationale: Cette formulation rend directement la cause donnée par le grec sans interpréter ἑσπέρα comme une heure simplement tardive.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « mettre la main sur » préserve l’idiome grec sans paraître archaïque; « placer en détention » maintient l’imprécision du texte quant au lieu de garde.
