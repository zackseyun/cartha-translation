id: ACT.4.2
reference: Acts 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διαπονούμενοι διὰ τὸ διδάσκειν αὐτοὺς τὸν λαὸν καὶ καταγγέλλειν ἐν τῷ Ἰησοῦ τὴν ἀνάστασιν ⸂τὴν ἐκ⸃ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: fr
  text: très contrariés de ce qu’ils enseignaient le peuple et proclamaient en Jésus la résurrection d’entre les morts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « proclamaient, dans le cas de Jésus, la résurrection d’entre les morts » ; l’expression grecque « en Jésus » peut désigner plus précisément la résurrection telle qu’elle s’est manifestée dans sa propre résurrection.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: très contrariés
  rationale: Le participe exprime une vive irritation ou un profond mécontentement. « Très contrariés » en restitue l’intensité dans un français naturel sans aller jusqu’à une exaspération explicitement formulée.
- source_word: διὰ τὸ διδάσκειν
  choice: de ce qu’ils enseignaient
  rationale: διά suivi de l’infinitif articulé indique ici la cause. Cette tournure française conserve le lien causal avec le participe initial.
- source_word: αὐτοὺς
  choice: ils
  rationale: Le pronom renvoie aux personnes qui parlaient dans le contexte précédent, sans les identifier plus précisément que le grec.
- source_word: τὸν λαὸν
  choice: le peuple
  rationale: « Le peuple » rend la valeur collective de λαός et convient mieux que « la foule », qui serait plus circonstanciel.
- source_word: καταγγέλλειν
  choice: proclamaient
  rationale: Le verbe désigne une annonce publique et affirmée ; « proclamer » convient au cadre et au contenu du message.
- source_word: ἐν τῷ Ἰησοῦ
  choice: en Jésus
  rationale: 'Cette traduction directe préserve l’ouverture sémantique de ἐν : la résurrection peut être présentée comme manifestée, centrée ou attestée en Jésus.'
- source_word: ἀνάστασιν
  choice: la résurrection
  rationale: Le terme français usuel conserve le caractère défini et la portée théologique du nom grec.
- source_word: τὴν ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression rend explicitement l’idée d’une résurrection hors du nombre des morts, tout en restant idiomatique en français biblique moderne.
theological_decisions:
- issue: Sens de ἐν τῷ Ἰησοῦ dans la proclamation de la résurrection
  choice: « en Jésus », afin de conserver la formulation et l’ouverture du grec
  alternative: « dans le cas de Jésus » ou « par Jésus »
  rationale: La préposition ἐν peut ici présenter Jésus comme celui en qui la résurrection est manifestée ou attestée, voire comme le centre de cette proclamation. Le texte principal ne tranche pas au-delà du grec ; la note explicite l’interprétation visant sa propre résurrection.
- issue: Portée de « la résurrection d’entre les morts »
  choice: Une formulation qui peut évoquer à la fois la résurrection de Jésus et la résurrection proclamée comme réalité attestée en lui
  alternative: Une référence strictement limitée à la résurrection personnelle de Jésus, ou exclusivement à la résurrection générale à venir
  rationale: La syntaxe permet que la résurrection de Jésus soit l’exemple et le fondement de l’annonce plus large. La traduction évite de réduire cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le début participial est conservé pour respecter le lien syntaxique avec le verset précédent. « D’entre les morts » est légèrement plus explicite que « des morts » et rend bien ἐκ νεκρῶν.
