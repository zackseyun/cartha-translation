id: ACT.4.29
reference: Acts 4:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: fr
  text: Et maintenant, Seigneur, porte ton regard sur leurs menaces et accorde à tes serviteurs[a] d’annoncer ta parole avec une pleine assurance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Le grec doulos désigne une personne appartenant à un maître; « serviteurs » est retenu ici parce que la prière met au premier plan leur humble service envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: Et maintenant
  rationale: Cette tournure marque naturellement le passage, dans la prière, du rappel des événements à la demande présente.
- source_word: κύριε
  choice: Seigneur
  rationale: Il s’agit d’une adresse directe à Dieu dans la prière; « Seigneur » correspond à l’usage néotestamentaire courant et au registre du passage.
- source_word: ἔπιδε ἐπὶ
  choice: porte ton regard sur
  rationale: Cette formulation conserve l’image concrète du regard tout en exprimant naturellement en français la demande faite à Dieu de prendre en considération les menaces.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: leurs menaces
  rationale: Rendu direct, clair et idiomatique du pluriel grec.
- source_word: δὸς
  choice: accorde
  rationale: Dans une prière, « accorde » exprime naturellement le don ou l’habilitation demandés, sans atténuer la force de l’impératif grec.
- source_word: τοῖς δούλοις σου
  choice: à tes serviteurs
  rationale: δοῦλος peut désigner un esclave ou un serviteur appartenant à un maître. Ici, « serviteurs » exprime naturellement l’humble soumission à Dieu dans le contexte de la prière; une note conserve le sens social plus fort possible.
- source_word: μετὰ παρρησίας πάσης
  choice: avec une pleine assurance
  rationale: παρρησία désigne ici la liberté et la hardiesse de parler ouvertement; « pleine » rend la valeur intensive de πάσης.
- source_word: λαλεῖν τὸν λόγον σου
  choice: d’annoncer ta parole
  rationale: Littéralement, il s’agit de « dire/parler ta parole ». En français courant, « annoncer ta parole » rend naturellement l’acte de communication publique visé dans ce contexte, sans préciser davantage le contenu du λόγος.
theological_decisions:
- issue: Rendu de δοῦλος pour la relation des croyants à Dieu
  choice: tes serviteurs
  alternative: tes esclaves
  rationale: Le mot grec souligne l’appartenance et la soumission à un maître. Dans cette prière, « serviteurs » convient au registre français et met en avant le service humble, tandis que la note signale sans l’effacer la possibilité plus forte d’« esclaves ».
- issue: Portée de παρρησία dans la proclamation
  choice: une pleine assurance
  alternative: une entière liberté de parole / une totale hardiesse
  rationale: Le contexte associe confiance, courage et parole ouverte. « Assurance » maintient cette largeur de sens sans réduire le terme au seul courage psychologique ni à une notion juridique de liberté d’expression.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset garde le mouvement de la prière et son imagerie, tout en évitant les tournures archaïques. « Annoncer ta parole » est préféré au calque peu idiomatique « dire ta parole ».
