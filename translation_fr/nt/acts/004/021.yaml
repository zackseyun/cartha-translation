id: ACT.4.21
reference: Acts 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: fr
  text: Après les avoir de nouveau menacés[a], ils les relâchèrent, ne trouvant aucun moyen de les punir à cause du peuple, car tous glorifiaient Dieu pour ce qui était arrivé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après les avoir menacés davantage » ou « après avoir ajouté des menaces ». Le participe grec indique des menaces supplémentaires ou renforcées par rapport à celles qui avaient déjà été proférées.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: Après les avoir menacés davantage
  rationale: Le préfixe προσ- indique ici que les autorités ajoutent ou renforcent les menaces déjà proférées. « Menacés davantage » rend ce sens sans alourdir la phrase.
- source_word: ἀπέλυσαν
  choice: ils les relâchèrent
  rationale: Dans ce contexte de détention par les autorités, ἀπολύω signifie remettre en liberté ou laisser partir. « Relâchèrent » convient au registre judiciaire.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: Ils ne trouvaient aucun moyen de les punir
  rationale: Le tour τὸ πῶς avec le subjonctif désigne la manière ou le moyen de faire quelque chose. Cette formulation française explicite naturellement la construction grecque sans changer son sens.
- source_word: διὰ τὸν λαόν
  choice: à cause du peuple
  rationale: διά avec l’accusatif exprime la cause. λαός vise ici la population dont la réaction retient les autorités, plutôt qu’une foule envisagée seulement comme rassemblement.
- source_word: πάντες
  choice: tous
  rationale: Le masculin pluriel renvoie dans le contexte à l’ensemble des gens concernés. « Tous » conserve sobrement la portée générale du grec.
- source_word: ἐδόξαζον τὸν θεόν
  choice: glorifiaient Dieu
  rationale: « Glorifier » préserve le langage d’honneur rendu à Dieu propre à Luc–Actes. L’imparfait français correspond à l’aspect imperfectif de ἐδόξαζον.
- source_word: ἐπὶ τῷ γεγονότι
  choice: pour ce qui était arrivé
  rationale: ἐπί indique ici le motif de la glorification, et le participe parfait renvoie à un événement accompli dont les effets demeurent pertinents.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est divisée en deux phrases pour une lecture naturelle, tout en conservant les rapports logiques du grec et le vocabulaire théologique de « glorifier Dieu ».
