  text: ποιῆσαι ὅσα ἡ χείρ σου καὶ ἡ ⸀βουλὴ προώρισεν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/028.yaml
  text: to do whatever your hand and your purpose had predestined to happen[a].
translation:
  language: fr
  text: pour accomplir tout ce que ta main et ton dessein avaient déterminé d’avance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avaient prédéterminé » ou « avaient prédestiné à se produire ». Le verbe grec exprime une détermination préalable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: accomplir
  rationale: Dans la continuité de la phrase précédente, l’infinitif exprime ce que les acteurs se sont trouvés à réaliser. « Accomplir » est naturel en français et convient à l’exécution effective de ce qui avait été décidé.
- source_word: ὅσα
  choice: tout ce que
  rationale: Cette expression rend naturellement en français la portée globale du relatif neutre pluriel.
- source_word: χείρ
  choice: main
  rationale: Le terme est conservé littéralement afin de préserver l’image biblique de la main comme puissance ou action de Dieu.
- source_word: βουλή
  choice: dessein
  rationale: « Dessein » exprime une intention délibérée et un projet arrêté, tout en gardant un registre digne et courant dans ce contexte.
- source_word: προώρισεν
  choice: avaient décidé d’avance
  rationale: Le verbe indique une détermination antérieure. Cette formulation française conserve cette priorité temporelle et la force de la décision sans imposer d’emblée le vocabulaire théologique plus spécialisé de la prédestination.
- source_word: γενέσθαι
  choice: '[intégré dans « accomplir tout ce que »]'
  rationale: L’idée que les événements devaient se produire est exprimée idiomatiquement par la construction française « accomplir tout ce que… avaient décidé d’avance », sans reproduire lourdement le second infinitif grec.
theological_decisions:
- issue: Rendu de προώρισεν dans un passage mettant en tension la souveraineté divine et la responsabilité humaine
  choice: avaient décidé d’avance
  alternative: avaient prédestiné à arriver ; avaient déterminé d’avance
  rationale: Le grec affirme une détermination préalable de Dieu concernant les événements entourant les souffrances de Jésus, sans exposer ici un système théologique plus large. Le texte principal garde cette affirmation forte dans une formulation française naturelle, tandis que la note signale des équivalents possibles, dont le terme théologique « prédestiné ».
translation_notes:
  register: Français international moderne, naturel et digne. L’image de « ta main » est conservée. Le pluriel « avaient » correspond au sujet coordonné « ta main et ton dessein ».
