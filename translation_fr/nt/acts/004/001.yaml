  source_fidelity: La proposition temporelle « Pendant qu’ils parlaient au peuple » rend correctement le génitif absolu Λαλούντων δὲ αὐτῶν πρὸς τὸν λαόν. « Les prêtres », « le commandant du Temple » et « les sadducéens » correspondent au grec. En revanche, « survinrent » employé sans complément ne rend pas explicitement αὐτοῖς (« à eux ») et sonne en français comme l’irruption d’un événement plutôt que l’arrivée des autorités auprès de Pierre et Jean.
  naturalness: La phrase est généralement claire et de registre approprié. « S’approchèrent d’eux » est plus idiomatique que « survinrent » dans cette construction et conserve une nuance sobre, sans imposer une confrontation hostile.
  terminology: « Commandant du Temple » est un bon rendu fonctionnel de ὁ στρατηγὸς τοῦ ἱεροῦ. La note culturelle est correctement ancrée à ce terme. « Sadducéens » est la désignation française usuelle.
