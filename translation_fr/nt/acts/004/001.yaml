id: ACT.4.1
reference: Acts 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: fr
  text: Pendant qu’ils parlaient au peuple, les prêtres, le commandant du Temple[a] et les sadducéens s’approchèrent d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « commandant du Temple » était le responsable de l’ordre et de la sécurité dans l’enceinte du Temple.
    reason: cultural_note
  - marker: b
    text: Ou « arrivèrent auprès d’eux » ou « vinrent les trouver ». Le verbe grec peut désigner une arrivée soudaine ou une approche ; le contexte évoque une intervention officielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: Pendant qu’ils parlaient
  rationale: Le génitif absolu exprime ici la simultanéité et se rend naturellement par une proposition temporelle. La progression narrative portée par δέ n’exige pas l’ajout d’un adverbe comme « alors » ou « or ».
- source_word: πρὸς τὸν λαὸν
  choice: au peuple
  rationale: λαός désigne ici les personnes rassemblées dans l’enceinte du Temple. « Le peuple » reste précis et moins interprétatif que « la foule ».
- source_word: ἐπέστησαν αὐτοῖς
  choice: survinrent
  rationale: Le verbe peut évoquer le fait d’arriver auprès de quelqu’un, éventuellement de manière soudaine. « Survinrent » conserve cette nuance sans rendre explicite une hostilité que le contexte révèle davantage que le verbe lui-même.
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Le texte porte ἱερεῖς, et non ἀρχιερεῖς ; « les prêtres » évite donc d’introduire le rang de grands prêtres.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: le commandant du Temple
  rationale: στρατηγός désigne l’officier chargé du commandement. « Commandant du Temple » restitue le titre avec clarté sans ajouter dans le corps du texte la mention non explicite d’une garde.
- source_word: οἱ Σαδδουκαῖοι
  choice: les sadducéens
  rationale: Il s’agit de la désignation française courante de ce groupe religieux juif.
theological_decisions:
- issue: Nuance potentiellement hostile de l’arrivée des autorités
  choice: Employer « survinrent », formulation relativement neutre qui peut suggérer une arrivée soudaine.
  alternative: « les abordèrent » ou « vinrent vers eux » ; « les confrontèrent » expliciterait davantage l’hostilité.
  rationale: La suite du récit manifeste l’opposition des autorités, mais le verbe de ce verset décrit d’abord leur arrivée. La traduction ne doit pas anticiper ni amplifier l’hostilité.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’ordre narratif du grec tout en évitant une coordination lourde. La majuscule à « Temple » distingue ici le sanctuaire de Jérusalem comme lieu particulier.
