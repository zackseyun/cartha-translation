source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: fr
  text: Joseph, surnommé Barnabas par les apôtres — nom qui signifie « fils d’encouragement » —, était un Lévite originaire de Chypre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Cette particule assure ici une transition légère dans le récit; la continuité se comprend naturellement en français sans ajouter « or » ou « quant à ».
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: surnommé Barnabas par les apôtres
  rationale: « Surnommé » exprime avec concision l'attribution d'un nom distinctif; ἀπό indique ici que cette appellation vient des apôtres.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: ce qui signifie
  rationale: Formulation française naturelle pour introduire l'explication traduite du nom.
- source_word: υἱὸς παρακλήσεως
  choice: fils d’encouragement
  rationale: « Encouragement » restitue de façon large et accessible παράκλησις, sans en exclure les nuances d'exhortation et de réconfort, signalées en note.
- source_word: Λευίτης
  choice: un Lévite
  rationale: Désignation simple de son appartenance au groupe de Lévi.
- source_word: Κύπριος τῷ γένει
  choice: originaire de Chypre
  rationale: Rend naturellement l'origine indiquée par τῷ γένει, sans imposer plus précisément soit le lieu de naissance, soit l'ascendance.
theological_decisions:
- issue: Sens de παρακλήσεως dans l'explication du nom Barnabas
  choice: « encouragement » dans le texte principal
  alternative: « exhortation », « consolation » ou « réconfort »
  rationale: Le terme grec couvre à la fois l'action d'encourager ou d'exhorter et celle de consoler. Le contexte immédiat ne permet pas de réduire sûrement cette amplitude sémantique.
translation_notes:
  register: Français moderne, international et digne. La phrase est complétée par « était » afin de produire un énoncé naturel en français, tout en conservant la structure appositive du grec. « Surnommé » évite le calque pesant « appelé du nom de ».
