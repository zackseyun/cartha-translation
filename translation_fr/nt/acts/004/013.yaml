  terminology: « Sans formation savante » évite à juste titre d’affirmer qu’ils étaient illettrés. « Simples particuliers » rend prudemment ἰδιῶται comme personnes non spécialisées et sans position officielle, sans imposer un sens ecclésial ultérieur tel que « laïcs ». « Jésus » et les noms propres sont corrects.
