  rationale: La révision remplace la coordination peu naturelle par une apposition qui attribue sans ambiguïté les deux caractérisations aux mêmes hommes. Elle maintient l’ambiguïté lexicale contrôlée par la note, conserve l’aspect imperfectif des deux verbes principaux et ne modifie pas le sens du passage.
