  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : l’observation de la franchise courageuse de Pierre et Jean, le constat de leur absence de formation savante, l’étonnement et la reconnaissance de leur ancienne association avec Jésus sont conservés. Toutefois, « des hommes sans formation savante et des gens ordinaires » coordonne de manière maladroite deux désignations des mêmes personnes et affaiblit légèrement la nuance sociale de ἰδιῶται.'
