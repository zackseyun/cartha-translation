id: ACT.4.13
reference: Acts 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: fr
  text: En voyant l’assurance de Pierre et de Jean et en se rendant compte qu’ils étaient des hommes sans formation savante, de simples particuliers[a], ils s’étonnaient et reconnaissaient qu’ils avaient été avec Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans instruction et simples particuliers ». Les termes grecs indiquent qu’ils n’avaient pas reçu de formation savante officielle et qu’ils n’étaient pas des spécialistes ni des responsables reconnus ; ils ne signifient pas nécessairement qu’ils étaient illettrés.'
    reason: Précision lexicale concernant ἀγράμματοι et ἰδιῶται.
lexical_decisions:
- source_word: Θεωροῦντες
  choice: En voyant
  rationale: Le participe exprime l’observation attentive des dirigeants; « en voyant » reste naturel en français et introduit ce qui provoque leur réaction.
- source_word: παρρησίαν
  choice: l’assurance
  rationale: Dans ce contexte, le mot désigne la liberté courageuse et ouverte avec laquelle Pierre et Jean parlent. « Assurance » exprime cette hardiesse sans suggérer la témérité.
- source_word: καταλαβόμενοι
  choice: en se rendant compte
  rationale: Cette tournure rend naturellement la prise de conscience exprimée par le participe aoriste.
- source_word: ἄνθρωποι ἀγράμματοί
  choice: des hommes sans formation savante
  rationale: Il s’agit de Pierre et Jean, deux hommes, et le qualificatif vise leur absence de formation scolaire spécialisée, notamment celle des spécialistes de la Loi, plutôt qu’une incapacité à lire ou un manque d’intelligence.
- source_word: ἰδιῶται
  choice: des gens ordinaires
  rationale: Le terme les présente comme des particuliers sans statut professionnel ou officiel, par contraste avec les autorités religieuses; « gens ordinaires » est clair et non péjoratif.
- source_word: ἐθαύμαζον
  choice: ils étaient étonnés
  rationale: L’imparfait grec décrit leur réaction prolongée; l’imparfait français en conserve l’aspect.
- source_word: ἐπεγίνωσκόν
  choice: Ils reconnaissaient
  rationale: Le verbe exprime ici une reconnaissance ou un constat. L’imparfait français reflète la forme imperfective grecque sans imposer l’idée d’un commencement.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: qu’ils avaient été avec Jésus
  rationale: Le plus-que-parfait français situe correctement leur fréquentation de Jésus avant la scène présente.
- source_word: δὲ ... τε
  choice: '[δὲ non traduit explicitement] ... aussi'
  rationale: δὲ assure ici une transition narrative qu’il n’est pas nécessaire de lexicaliser en français; τε relie la reconnaissance à l’étonnement et est rendu par « aussi ».
theological_decisions:
- issue: Caractérisation sociale et scolaire de Pierre et Jean
  choice: « des hommes sans formation savante et des gens ordinaires »
  alternative: « des hommes illettrés et des profanes »
  rationale: Le grec souligne l’absence de formation érudite et de statut officiel, non l’illettrisme certain, l’ignorance intellectuelle ou une déficience morale. La formulation retenue préserve le contraste avec les autorités sans ajouter de jugement dépréciatif.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque longue est divisée en deux pour améliorer la lisibilité, sans modifier le lien entre l’étonnement des dirigeants et leur reconnaissance de l’association de Pierre et Jean avec Jésus.
