  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: fr
  text: Mais, pour que cela ne se répande pas davantage parmi le peuple, menaçons-les[a] pour qu’ils ne parlent plus à qui que ce soit en ce nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec exprime une menace, c’est-à-dire une intimidation exercée par les autorités.
    reason: lexical_note
lexical_decisions:
- source_word: διανεμηθῇ
  choice: ne se répande pas
  rationale: Dans ce contexte, le verbe évoque la propagation parmi la population de ce qui concerne l'action et l'enseignement des apôtres. « Se répandre » est naturel en français et conserve l'image de diffusion.
- source_word: ἐπὶ πλεῖον
  choice: davantage
  rationale: L'expression comparative indique que la propagation ne doit pas aller au-delà de son étendue actuelle.
- source_word: λαός
  choice: le peuple
  rationale: Le terme désigne ici la population dans son ensemble, particulièrement le public juif; « le peuple » en est la traduction française naturelle.
- source_word: ἀπειλησώμεθα
  choice: menaçons-les
  rationale: Le verbe signifie directement « menacer ». Dans cette scène d'autorité et de contrainte, cette traduction préserve mieux sa force que le plus faible « avertissons-les ».
- source_word: μηκέτι λαλεῖν
  choice: de ne plus parler
  rationale: Cette formulation rend clairement la négation et la cessation à partir de ce moment.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: en ce nom
  rationale: La formulation conserve le lien avec le nom invoqué et avec l'autorité ou l'association qu'il représente, sans trancher davantage le rapport exact exprimé par ἐπί.
- source_word: μηδενὶ ἀνθρώπων
  choice: à qui que ce soit
  rationale: Le datif désigne les destinataires auxquels il leur est interdit de parler. Cette tournure est idiomatique après « ne plus » et rend le sens générique sans marquage de genre.
theological_decisions:
- issue: Force de ἀπειλησώμεθα dans la réaction du Conseil
  choice: Traduire par « menaçons-les » dans le texte principal.
  alternative: « avertissons-les » ou « adressons-leur de sévères avertissements »
  rationale: Le contexte est judiciaire et coercitif, et le verbe grec exprime explicitement la menace. Le français permet ici une construction naturelle avec « menacer quelqu'un de ne plus faire quelque chose »; il n'est donc pas nécessaire d'affaiblir le terme.
- issue: Portée de « en ce nom »
  choice: Conserver la formulation « en ce nom ».
  alternative: « en invoquant ce nom », « sur l'autorité de ce nom » ou « au sujet de ce nom »
  rationale: L'expression peut évoquer l'invocation, l'autorité ou l'association avec le nom de Jésus. La traduction retenue préserve cette densité et évite de réduire l'expression à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le ton délibératif du Conseil. « Cela » reprend sans explicitation excessive ce que les autorités veulent empêcher de se propager, conformément à l'ellipse du grec.
