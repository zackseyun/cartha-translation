  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: fr
  text: 'Après avoir entendu cela, ils élevèrent d’un commun accord la voix à Dieu et dirent : « Maître[a], c’est toi qui as fait le ciel, la terre, la mer et tout ce qui s’y trouve, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Souverain Maître ». Le grec emploie Δέσποτα, titre qui souligne l’autorité absolue et qui se distingue de κύριος (« Seigneur »).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Après avoir entendu cela
  rationale: Le participe aoriste a ici une valeur temporelle. « Cela » explicite naturellement en français l’objet sous-entendu par le contexte.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: Cette expression rend l’unité de cœur et d’action du groupe sans suggérer un vote formel.
- source_word: ἦραν φωνήν
  choice: ils élevèrent … la voix
  rationale: Le singulier collectif du grec est naturel en français et souligne la prière commune.
- source_word: πρὸς τὸν θεόν
  choice: vers Dieu
  rationale: Dans ce contexte de prière, l’expression indique que leur parole est adressée à Dieu; « vers Dieu » conserve aussi l’image directionnelle.
- source_word: Δέσποτα
  choice: Maître
  rationale: Le titre désigne celui qui détient une autorité absolue. « Maître » préserve la distinction lexicale avec κύριος, habituellement rendu par « Seigneur ».
- source_word: σὺ ὁ ποιήσας
  choice: c’est toi qui as fait
  rationale: La tournure française met en valeur le pronom emphatique et la fonction identificatrice du participe grec.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: le ciel, la terre, la mer
  rationale: Cette formulation claire et consacrée conserve la série cosmique de la formule de création.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tout ce qui s’y trouve
  rationale: Rendu français naturel et global de l’ensemble des réalités contenues dans les trois domaines mentionnés.
theological_decisions:
- issue: Traduction du titre divin Δέσποτα
  choice: Maître
  alternative: Souverain Maître; Seigneur souverain; Souverain
  rationale: « Maître » rend directement l’idée d’autorité absolue et évite d’ajouter « Seigneur », qui correspond normalement à un autre terme grec. Une note signale la portée particulière du titre sans imposer une formulation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement collectif de la prière et l’emphase placée sur Dieu comme Créateur. La virgule finale indique que la prière se poursuit au verset suivant.
