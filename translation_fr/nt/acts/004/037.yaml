id: ACT.4.37
reference: Acts 4:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: fr
  text: Comme il possédait un champ[a], il le vendit, apporta l’argent[b] et le déposa aux pieds des apôtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme il avait un champ »; littéralement : « un champ lui appartenant ». Le grec emploie ici un génitif absolu pour indiquer une circonstance d’arrière-plan.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le produit de la vente ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: Comme il possédait un champ
  rationale: Le génitif absolu fournit une circonstance d’arrière-plan. En français courant, « comme il possédait » exprime naturellement cette relation de possession sans surcharger la syntaxe.
- source_word: ἀγροῦ
  choice: un champ
  rationale: ἀγρός désigne ici un champ ou une étendue de terre. « Un champ » est la traduction la plus directe et conserve la concrétude du récit.
- source_word: πωλήσας
  choice: il le vendit
  rationale: Le participe aoriste indique une action antérieure aux verbes principaux. La formulation française avec un verbe conjugué rend clairement la succession des actions; « le » reprend naturellement « un champ ».
- source_word: ἤνεγκεν
  choice: apporta
  rationale: φέρω signifie ici apporter ou porter jusqu’à un lieu. « Apporta » convient au fait de remettre l’argent aux apôtres.
- source_word: τὸ χρῆμα
  choice: l’argent
  rationale: χρῆμα désigne ici l’argent obtenu par la vente. « L’argent » est simple et direct; « le produit de la vente » explicite davantage le contexte.
- source_word: ἔθηκεν
  choice: déposa
  rationale: τίθημι signifie mettre ou placer. « Déposa » est naturel avec « aux pieds » et rend le geste concret sans lui ajouter une interprétation.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: aux pieds des apôtres
  rationale: Cette traduction conserve l’image physique grecque ainsi que la portée narrative de la remise du don à la disposition des apôtres.
theological_decisions:
- issue: Conserver l’image concrète de la présentation de l’argent à l’autorité apostolique
  choice: « le déposa aux pieds des apôtres »
  alternative: « le donna aux apôtres »
  rationale: Le texte décrit un geste concret qui peut aussi suggérer que le don est placé sous la gestion des apôtres. Garder l’image préserve ces deux dimensions sans imposer de conclusion ecclésiologique supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe reste claire pour un large lectorat, et l’image « aux pieds des apôtres » est conservée.
