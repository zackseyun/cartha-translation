source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: fr
  text: 'Mais Pierre et Jean leur répondirent : « Jugez vous-mêmes s’il est juste devant Dieu de vous écouter plutôt que d’écouter Dieu.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « de vous obéir plutôt que d’obéir à Dieu ». Le verbe grec signifie littéralement « écouter » ou « entendre », mais il a ici le sens de tenir compte d’une autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες ... εἶπον πρὸς αὐτούς
  choice: leur répondirent
  rationale: La combinaison du participe et du verbe conjugué est une tournure grecque influencée par l’usage sémitique. En français moderne, « leur répondirent » en restitue naturellement le sens sans la lourdeur de « répondirent et dirent ».
- source_word: δίκαιόν
  choice: juste
  rationale: Dans cette question, l’adjectif désigne ce qui est moralement droit et recevable au jugement de Dieu. « Juste » conserve cette portée évaluative et judiciaire.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: « Devant Dieu » est une expression française naturelle qui garde l’idée d’une conduite soumise au regard et au jugement de Dieu.
- source_word: ἀκούειν
  choice: écouter
  rationale: Le verbe signifie littéralement entendre ou écouter, tout en impliquant ici le fait de tenir compte d’une autorité. « Écouter » préserve la formulation grecque sans expliciter entièrement l’idée d’obéissance.
- source_word: μᾶλλον ἢ
  choice: plutôt que
  rationale: Cette tournure exprime naturellement en français le choix comparatif exclusif entre les autorités humaines et Dieu.
- source_word: κρίνατε
  choice: Jugez vous-mêmes
  rationale: L’impératif lance aux interlocuteurs le défi de porter eux-mêmes ce jugement. L’ajout de « vous-mêmes » explicite cette force discursive sans modifier le fond.
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: Mais Pierre et Jean
  rationale: δέ marque ici le contraste entre l’ordre des autorités et la réponse des apôtres ; « Mais » rend clairement cette articulation.
theological_decisions:
- issue: Faut-il rendre ἀκούειν par le terme plus interprétatif « obéir » dans le contraste entre les autorités humaines et Dieu ?
  choice: Conserver « vous écouter plutôt que Dieu » dans le texte principal.
  alternative: « vous obéir plutôt qu’à Dieu »
  rationale: Le contexte concerne bien l’obéissance, mais le grec emploie ἀκούω, « écouter/entendre », et non un verbe exprimant explicitement l’obéissance. Le texte principal conserve donc la formulation et sa tension, tandis que la note indique le sens contextuel.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe de la question a été légèrement réorganisée pour être idiomatique. Le marqueur [a] est placé après la proposition concernée.
