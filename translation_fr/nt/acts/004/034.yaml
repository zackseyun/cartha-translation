id: ACT.4.34
reference: Acts 4:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: fr
  text: Car il n’y avait pas un seul indigent parmi eux. En effet, tous ceux qui possédaient des terres ou des maisons les vendaient et apportaient le produit[a] des biens vendus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les prix des biens vendus ».'
    reason: Le grec emploie le pluriel de τιμή, « prix » ou « valeur »; « le produit » exprime plus naturellement en français l’argent tiré des ventes.
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Car il n’y avait pas un seul
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « pas un seul » exprime naturellement en français l’insistance de οὐδέ dans cette construction négative.
- source_word: ἐνδεής
  choice: indigent
  rationale: Le terme désigne une personne qui manque du nécessaire. « Indigent » reste précis et digne sans limiter explicitement le manque à une catégorie particulière.
- source_word: ἐν αὐτοῖς
  choice: parmi eux
  rationale: Rend directement l’appartenance au groupe de croyants décrit dans le contexte.
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Cette formulation française exprime la totalité des personnes appartenant à la catégorie ensuite définie, sans étendre l’affirmation au-delà de cette catégorie.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον
  choice: possédaient des terres ou des maisons
  rationale: Formulation française naturelle qui conserve la notion de propriété. « Terres » rend χωρίων assez largement pour désigner des parcelles ou domaines sans imposer qu’ils soient cultivés.
- source_word: πωλοῦντες ἔφερον
  choice: les vendaient et apportaient
  rationale: Les imparfaits français rendent bien l’action répétée ou habituelle suggérée par l’imparfait ἔφερον; la coordination restitue avec naturel le rapport entre le participe et le verbe principal.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: le produit des biens vendus
  rationale: « Le produit » désigne naturellement l’argent obtenu des ventes; « des biens vendus » garde le référent du participe substantivé sans le limiter aux seules terres ou maisons.
theological_decisions:
- issue: Portée de la mise en commun des biens
  choice: « tous ceux qui possédaient… les vendaient »
  alternative: « les propriétaires vendaient tous leurs biens »
  rationale: Le grec présente une pratique attribuée aux membres de la catégorie décrite, mais ne dit pas explicitement que chacun vendait la totalité de ses biens. La traduction évite donc d’ajouter cette précision théologiquement significative.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de γάρ est rendue par « Car » puis « En effet », afin de préserver les deux articulations explicatives sans alourdir la phrase. Le marqueur de note est placé après le terme qu’il explique.
