id: ACT.4.23
reference: Acts 4:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: fr
  text: Après avoir été relâchés, ils allèrent retrouver les leurs[a] et rapportèrent tout ce que les chefs des prêtres et les anciens leur avaient dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers les leurs »; l’expression peut désigner leurs compagnons ou les membres de leur communauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: Après avoir été relâchés
  rationale: Le participe aoriste passif exprime une action antérieure au verbe principal. Cette formulation naturelle conserve le sens d’une remise en liberté dans un contexte de détention.
- source_word: δὲ
  choice: intégré à la transition temporelle
  rationale: La particule marque ici une légère progression du récit; en français, la proposition initiale « Après avoir été relâchés » assure naturellement cette liaison sans conjonction distincte.
- source_word: ἦλθον πρὸς
  choice: ils allèrent retrouver
  rationale: Avec πρός, le verbe indique le déplacement vers un groupe. « Retrouver » exprime idiomatiquement en français le retour auprès de leurs proches sans modifier le sens.
- source_word: τοὺς ἰδίους
  choice: les leurs
  rationale: Cette expression conserve la concision et la relative indétermination du grec, qui désigne leurs proches, compagnons ou membres de leur communauté sans préciser davantage.
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe désigne la transmission fidèle d’informations reçues ou d’événements vécus; « rapportèrent » convient au compte rendu fait au groupe.
- source_word: ὅσα
  choice: tout ce que
  rationale: Cette tournure française naturelle préserve la portée globale du relatif grec.
- source_word: πρὸς αὐτοὺς
  choice: leur
  rationale: Avec le verbe « dire », πρός suivi de l’accusatif désigne les destinataires des paroles. Le pronom conserve la référence contextuelle à Pierre et Jean.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Il s’agit des principales autorités sacerdotales, et non de plusieurs titulaires simultanés de la fonction de grand prêtre.
- source_word: οἱ πρεσβύτεροι
  choice: les anciens
  rationale: Dans ce contexte institutionnel, le terme désigne les responsables reconnus du peuple ou du conseil, et non simplement des hommes âgés.
- source_word: εἶπαν
  choice: avaient dit
  rationale: Le plus-que-parfait rend clairement en français l’antériorité de leurs paroles par rapport au compte rendu.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. « Les leurs » maintient l’indétermination du grec, tandis que la note explicite les principaux sens possibles sans imposer une identification précise.
