  source_fidelity: Le texte rend fidèlement la question délibérative (Τί ποιήσωμεν), « ces hommes », la valeur explicative de γὰρ, le signe publiquement reconnu (γνωστὸν σημεῖον), son occurrence accomplie, l’intermédiaire exprimé par δι’ αὐτῶν, son caractère manifeste à Jérusalem et l’impossibilité de le nier. « Par leur intermédiaire » préserve avec justesse l’instrumentalité sans trancher la question de l’agent ultime.
  naturalness: Le français est clair, moderne et d’un registre narratif soutenu mais naturel. « Ils disaient » et « Que devons-nous faire de ces hommes ? » conviennent au contexte. La réorganisation française avec « il est évident ... que » est idiomatique et conserve le sens de la proposition grecque.
  terminology: « Signe » est le terme approprié pour σημεῖον et évite de réduire le mot à « miracle ». « Signe bien connu » restitue de façon recevable γνωστόν dans son contexte de reconnaissance publique; l’explicitation suivante (« évident pour tous les habitants ») correspond à φανερόν. Aucun nom propre ni terme théologique ne requiert d’ajustement.
