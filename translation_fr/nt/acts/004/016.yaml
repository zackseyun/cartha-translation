id: ACT.4.16
reference: Acts 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: fr
  text: 'Ils disaient : « Que devons-nous faire de ces hommes ? Car il est évident pour tous les habitants de Jérusalem qu’un signe bien connu s’est produit par leur intermédiaire, et nous ne pouvons pas le nier. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Le participe présent se rattache au contexte précédent et introduit les propos du conseil ; une proposition avec un verbe conjugué est naturelle en français narratif.
- source_word: Τί ποιήσωμεν
  choice: Que devons-nous faire
  rationale: Le subjonctif aoriste exprime ici une question délibérative ; cette formulation en restitue naturellement la portée.
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: de ces hommes
  rationale: Après « faire », le datif se rend idiomatiquement par « faire de » en français ; il s’agit de Pierre et Jean.
- source_word: ὅτι μὲν γὰρ
  choice: Car
  rationale: « Car » conserve la valeur explicative ; l’évidence affirmée dans la suite rend inutile l’ajout d’un adverbe emphatique lourd.
- source_word: γνωστὸν σημεῖον
  choice: un signe bien connu
  rationale: γνωστός désigne ici ce qui est connu ou publiquement reconnu ; « bien connu » préserve cette nuance sans remplacer σημεῖον par « miracle ».
- source_word: γέγονεν
  choice: s’est produit
  rationale: Le parfait présente un événement accompli dont les effets demeurent ; « s’est produit » convient idiomatiquement à un signe.
- source_word: δι’ αὐτῶν
  choice: par leur intermédiaire
  rationale: διά avec le génitif marque l’intermédiaire ou l’instrumentalité, sans attribuer aux apôtres une action autonome.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: il est évident pour tous les habitants de Jérusalem
  rationale: La tournure française rend clairement l’adjectif prédicatif φανερόν et les personnes auxquelles le fait est manifeste.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: nous ne pouvons pas le nier
  rationale: Le pronom « le », nécessaire en français, reprend le fait qu’un signe s’est produit.
theological_decisions:
- issue: Portée de σημεῖον dans le récit d’une guérison publique
  choice: signe
  alternative: miracle
  rationale: « Signe » conserve le vocabulaire lucanien et sa portée théologique possible, tandis que « miracle » expliciterait seulement le caractère surnaturel de l’acte.
- issue: Agence exprimée par δι’ αὐτῶν
  choice: par leur intermédiaire
  alternative: par eux
  rationale: La formulation retenue préserve l’idée que Pierre et Jean sont les médiateurs de l’acte sans préciser davantage son agent ultime.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement réorganisée pour éviter une juxtaposition lourde tout en conservant l’enchaînement logique grec. Aucun marqueur de note n’est requis.
