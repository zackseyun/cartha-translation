id: ACT.4.4
reference: Acts 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: fr
  text: Mais beaucoup de ceux qui avaient entendu le message[a] crurent, et le nombre des hommes[b] atteignit environ cinq mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole ». Ici, λόγος désigne la proclamation ou le message des apôtres.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « le nombre des hommes » et semble donc indiquer un décompte des hommes plutôt que celui de toute la foule, hommes et femmes confondus.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend naturellement la quantité indéfinie sans ajouter de substantif absent du grec.
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec l’opposition et l’arrestation rapportées dans le contexte précédent.
- source_word: ἀκουσάντων τὸν λόγον
  choice: ceux qui avaient entendu le message
  rationale: Le participe aoriste exprime ici une action antérieure; « message » communique clairement que λόγος désigne la proclamation apostolique, tout en signalant « parole » comme autre traduction possible.
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: Rendu simple et direct de πιστεύω, sans préciser davantage l’objet ni importer une formulation théologique plus développée.
- source_word: ἐγενήθη
  choice: atteignit
  rationale: Dans une expression numérique, « le nombre atteignit » est idiomatique en français et exprime l’état résultant sans supposer explicitement un mode de croissance.
- source_word: ὁ ἀριθμὸς
  choice: le nombre
  rationale: Correspondance directe, naturelle et précise du groupe nominal grec.
- source_word: τῶν ἀνδρῶν
  choice: des hommes
  rationale: ἀνήρ désigne normalement des hommes de sexe masculin plutôt que les personnes en général; la formulation masculine du décompte est donc conservée.
- source_word: ὡς χιλιάδες πέντε
  choice: environ cinq mille
  rationale: ὡς placé devant un nombre indique couramment une approximation, rendue clairement par « environ ».
theological_decisions:
- issue: Portée masculine du décompte dans τῶν ἀνδρῶν
  choice: des hommes
  alternative: des personnes; des croyants
  rationale: Le grec emploie ἀνδρῶν, qui désigne normalement des hommes. La traduction conserve cette précision sans conclure que les femmes étaient absentes de la communauté; elle indique seulement la forme du décompte donnée dans ce verset.
- issue: Objet implicite de ἐπίστευσαν
  choice: crurent
  alternative: crurent au message; devinrent croyants
  rationale: Le grec ne formule pas explicitement l’objet de la foi dans cette proposition. Le français « crurent » maintient cette concision et évite de résoudre une implicitation que le contexte permet de comprendre.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque; « avaient entendu » marque clairement l’antériorité. Les notes maintiennent l’alternative lexicale de λόγος et la précision de genre portée par ἀνδρῶν.
