  variant: modern international French
source:
  edition: SBLGNT
  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: fr
  text: Et, voyant l’homme qui avait été guéri debout avec eux, ils n’avaient rien à objecter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne pouvaient rien contester » ou « ils n’avaient rien à opposer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: Mais
  rationale: Dans ce contexte, τε rattache la constatation à ce qui précède; le français « Mais » explicite naturellement le contraste entre l’assurance des apôtres et l’impossibilité de leur répondre, sans alourdir la phrase.
- source_word: ἄνθρωπον
  choice: l’homme
  rationale: Le terme désigne ici l’homme précis guéri dans le récit précédent; « l’homme » est exact et naturel.
- source_word: βλέποντες
  choice: voyant
  rationale: Le participe présent exprime une perception contemporaine du verbe principal; « voyant » en conserve la structure et reste idiomatique.
- source_word: σὺν αὐτοῖς
  choice: avec eux
  rationale: σύν suivi du datif marque l’accompagnement; « avec eux » en est l’équivalent français direct.
- source_word: ἑστῶτα
  choice: debout
  rationale: Le parfait de ἵστημι décrit l’état dans lequel se trouve l’homme; « debout » rend naturellement cette valeur résultative.
- source_word: τεθεραπευμένον
  choice: qui avait été guéri
  rationale: Le parfait passif identifie l’homme par une guérison accomplie dont le résultat demeure; cette formulation conserve le passif et la portée du miracle.
- source_word: οὐδὲν
  choice: rien
  rationale: οὐδέν exprime ici l’absence totale de réponse possible et se rend naturellement par « rien ».
- source_word: εἶχον ἀντειπεῖν
  choice: ils n’avaient rien à répliquer
  rationale: La construction ἔχω avec l’infinitif exprime ce qu’ils avaient à dire, tandis que ἀντειπεῖν implique une réponse opposée ou contradictoire. « Ne rien avoir à répliquer » préserve cette nuance dans un français naturel.
theological_decisions:
- issue: Portée de l’absence de réponse
  choice: ils n’avaient rien à répliquer
  alternative: ils ne pouvaient rien contester
  rationale: Le texte peut souligner soit l’absence de réponse adverse, soit l’impossibilité de contredire le fait constaté. Le texte principal garde une formulation verbale ouverte, et la note signale les autres nuances possibles sans trancher davantage.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre « voyant debout avec eux l’homme » conserve le lien immédiat entre la perception et la posture de l’homme tout en restant clair; la note maintient l’éventail sémantique de ἀντειπεῖν.
