id: ACT.4.27
reference: Acts 4:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: fr
  text: Car, en vérité, dans cette ville, Hérode et Ponce Pilate, avec les nations[b] et les peuples d’Israël, se sont rassemblés contre ton saint serviteur Jésus[a], que tu as oint,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton saint enfant Jésus ». Le grec παῖς peut signifier « serviteur » ou « enfant »; « serviteur » est retenu ici en raison de l’écho probable au langage d’Ésaïe au sujet du Serviteur.
    reason: lexical_alternative
  - marker: b
    text: Ou « les non-Juifs ». Le grec dit littéralement « les nations » et emploie ensuite le pluriel « les peuples d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: se sont rassemblés
  rationale: Rend naturellement l’aoriste passif tout en conservant l’idée d’un rassemblement concerté contre Jésus, sans préciser une cause ou un agent que le grec ne nomme pas.
- source_word: γὰρ
  choice: Car
  rationale: Marque le lien explicatif avec la citation et la prière qui précèdent.
- source_word: ἐπ’ ἀληθείας
  choice: en vérité
  rationale: Expression adverbiale qui conserve l’insistance du grec dans un registre français digne et naturel.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: dans cette ville
  rationale: Rend directement la localisation sans expliciter Jérusalem, que le contexte permet d’identifier.
- source_word: ἐπὶ τὸν
  choice: contre
  rationale: Avec un verbe de rassemblement hostile, ἐπί suivi de l’accusatif exprime ici l’opposition.
- source_word: ἅγιον παῖδά σου
  choice: ton saint serviteur
  rationale: παῖς peut désigner un serviteur ou un enfant. Le contexte d’Actes 3–4 et l’écho probable au Serviteur d’Ésaïe favorisent « serviteur », tout en laissant l’autre sens en note.
- source_word: ὃν ἔχρισας
  choice: que tu as oint
  rationale: Le verbe « oindre » rend directement χρίω et préserve sa résonance messianique ainsi que l’idée de mandat divin, sans substituer le titre « Messie » au verbe grec.
- source_word: ἔθνεσιν
  choice: les nations
  rationale: Ce choix traditionnel et exact conserve la portée collective du terme; dans le contraste avec Israël, il désigne les peuples non juifs.
- source_word: λαοῖς Ἰσραήλ
  choice: les peuples d’Israël
  rationale: Conserve le pluriel inhabituel λαοῖς au lieu de l’aplanir en un singulier.
theological_decisions:
- issue: Sens de παῖς appliqué à Jésus
  choice: serviteur
  alternative: enfant; fils
  rationale: L’arrière-plan probable du Serviteur d’Ésaïe et les emplois voisins dans les Actes soutiennent « serviteur ». « Fils » préciserait une relation théologique que ce mot grec, dans ce contexte, ne formule pas directement.
- issue: Sens de ἔθνη en contraste avec Israël
  choice: nations
  alternative: non-Juifs
  rationale: « Nations » reste proche de la forme grecque et maintient la dimension collective; le contexte indique qu’il s’agit des peuples autres qu’Israël.
- issue: Portée christologique de χρίω
  choice: que tu as oint
  alternative: que tu as consacré par l’onction; que tu as établi
  rationale: La formulation retenue préserve à la fois l’acte divin d’onction et sa résonance messianique, sans transformer le verbe en titre ni réduire l’onction à une simple nomination.
translation_notes:
  register: Français international moderne, dans un registre digne adapté à une prière communautaire. La phrase conserve « en vérité », « oint » et le pluriel inhabituel « peuples d’Israël » afin de respecter les reliefs du grec. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
