reference: Acts 4:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: fr
  text: 'toi qui[a], par l’Esprit Saint, as dit par la bouche de notre père David, ton serviteur : « Pourquoi les nations se sont-elles déchaînées, et les peuples ont-ils conçu de vains projets[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'D’autres manuscrits omettent « notre père »; l’introduction se lit alors : « toi qui, par l’Esprit Saint, as dit par la bouche de David, ton serviteur… »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « les peuples ont-ils médité sur des choses vaines ? » Le verbe grec peut signifier « méditer, réfléchir » ou, dans ce contexte, « concevoir, tramer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τοῦ πατρὸς ἡμῶν
  choice: toi qui
  rationale: Le pronom relatif reprend Dieu, invoqué au verset précédent. « Toi qui » assure en français le raccord syntaxique, tandis que la leçon textuelle difficile comportant « notre père » est signalée en note.
- source_word: διὰ πνεύματος ἁγίου
  choice: par l’Esprit saint
  rationale: διά avec le génitif indique ici le moyen ou l’agent. « Par » exprime naturellement en français l’action de l’Esprit.
- source_word: στόματος Δαυὶδ
  choice: par la bouche de David
  rationale: Cette expression biblique conserve l’image de David comme porte-parole prophétique de Dieu tout en restant claire en français moderne.
- source_word: παιδός σου
  choice: ton serviteur
  rationale: παῖς peut désigner un enfant ou un serviteur. Appliqué à David dans cette formule scripturaire, « serviteur » correspond au contexte.
- source_word: εἰπών
  choice: as dit
  rationale: Le participe aoriste introduit la citation. Une forme verbale personnelle est nécessaire pour une phrase française naturelle.
- source_word: Ἱνατί
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique.
- source_word: ἐφρύαξαν
  choice: se sont déchaînées
  rationale: Le verbe évoque une agitation tumultueuse et hostile. « Se déchaîner » en rend la vigueur sans limiter le sens à une émotion intérieure.
- source_word: ἔθνη
  choice: les nations
  rationale: Dans la citation du psaume, le terme désigne largement les nations, et non les non-Juifs comme catégorie religieuse.
- source_word: λαοὶ
  choice: les peuples
  rationale: Le pluriel maintient le parallélisme poétique avec « les nations ».
- source_word: ἐμελέτησαν
  choice: ont conçu
  rationale: Dans ce contexte hostile, le verbe prend le sens de réfléchir à, préparer ou tramer. « Concevoir » s’associe naturellement à « projets » sans effacer le sens plus littéral, donné en note.
- source_word: κενά
  choice: de vains projets
  rationale: κενά qualifie ce qui est vide, vain ou sans effet. L’ajout explicatif « projets » rend l’expression substantivée naturelle en français et convient au contexte de desseins hostiles.
theological_decisions:
- issue: Forme textuelle de l’introduction à la citation
  choice: Ne pas intégrer « notre père » au texte principal et relier directement « toi qui » à Dieu, locuteur par l’Esprit et par David.
  alternative: 'Lire : « toi qui, par l’Esprit saint, as dit par la bouche de notre père David, ton serviteur… »'
  rationale: La présence et la position de τοῦ πατρὸς ἡμῶν sont textuellement incertaines et produisent une construction difficile. Le texte principal conserve le sens syntaxique central, et la variante est rendue accessible en note sans la trancher silencieusement.
- issue: Portée de παῖς appliqué à David
  choice: serviteur
  alternative: enfant
  rationale: Dans le langage biblique concernant David et son rôle auprès de Dieu, « serviteur » est le sens contextuel le plus probable; « enfant » induirait ici une relation différente.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure « par la bouche de David » garde la coloration scripturaire de la formule prophétique. Le tutoiement suit l’adresse directe à Dieu dans la prière.
