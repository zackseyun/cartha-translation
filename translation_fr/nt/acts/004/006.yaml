  variant: modern international French
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: fr
  text: avec Anne, le grand prêtre, Caïphe, Jean, Alexandre et tous ceux qui étaient de la famille des grands prêtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅννας
  choice: Anne
  rationale: Forme française traditionnelle du nom personnel grec Ἅννας.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: Rend directement le titre singulier donné à Anne dans le grec, sans tenter de résoudre la question historique de la fonction alors exercée par Caïphe.
- source_word: Καϊάφας
  choice: Caïphe
  rationale: Forme française traditionnelle du nom personnel.
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et naturelle du nom grec Ἰωάννης.
- source_word: Ἀλέξανδρος
  choice: Alexandre
  rationale: Forme française usuelle du nom personnel.
- source_word: ὅσοι ἦσαν
  choice: tous ceux qui appartenaient
  rationale: Expression française naturelle qui rend la totalité désignée par ὅσοι et, avec ἐκ γένους, l'appartenance familiale; l'imparfait correspond à ἦσαν.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: à la famille du grand prêtre
  rationale: γένος désigne ici la famille ou la lignée, et ἀρχιερατικός ce qui se rapporte au grand prêtre ou à la haute prêtrise. Cette formulation claire n'implique pas que chaque membre occupait lui-même la fonction.
theological_decisions:
- issue: Titre de « grand prêtre » attribué à Anne alors que Caïphe exerçait historiquement la fonction à cette époque
  choice: Conserver sans correction « Anne, le grand prêtre »
  alternative: « Anne, l'ancien grand prêtre » ou « Anne, l'un des chefs des prêtres »
  rationale: Le grec appose explicitement ὁ ἀρχιερεύς à Ἅννας. La traduction conserve cette donnée et la tension historique éventuelle sans introduire une harmonisation interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination prolonge la phrase du verset précédent; la virgule d'apposition rend clairement le titre d'Anne. Aucun appel de note n'est nécessaire, puisque le sens familial de ἐκ γένους ἀρχιερατικοῦ est exprimé directement.
