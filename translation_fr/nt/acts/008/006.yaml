revisions:
- from: Les foules, d’un même élan, prêtaient attention à ce que Philippe disait, car elles l’entendaient et voyaient les signes qu’il accomplissait.
  to: Les foules prêtaient toutes d’un commun accord attention à ce que Philippe disait, en l’entendant et en voyant les signes qu’il accomplissait.
  rationale: La révision remplace l’explication causale par une formulation circonstancielle plus fidèle à la construction grecque et rend ὁμοθυμαδόν par « d’un commun accord ». Le pronom singulier « l’ » suit la résolution contextuelle habituelle de l’objet textuellement difficile αὐτούς, comme dans l’audit anglais, sans ajouter de contenu interprétatif.
