  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: fr
  text: Les foules prêtaient toutes d’un commun accord attention à ce que Philippe disait, en l’entendant et en voyant les signes qu’il accomplissait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεῖχον
  choice: prêtaient attention
  rationale: Cette expression rend naturellement l’idée de diriger son attention vers les paroles de Philippe; l’imparfait français conserve l’aspect continu du verbe grec.
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: δέ est ici un léger marqueur de continuité narrative. En français moderne, ne pas le traduire explicitement évite un « et » initial pesant sans perdre le lien avec le contexte.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé; « les foules » désigne naturellement les groupes rassemblés.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: à ce que Philippe disait
  rationale: Cette formulation française idiomatique exprime le contenu des paroles et leur auteur sans la lourdeur du passif « à ce qui était dit par Philippe ».
- source_word: ὁμοθυμαδὸν
  choice: d’un même élan
  rationale: L’expression rend la réponse collective et unie indiquée par l’adverbe grec, dans un français actuel et digne.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: car elles l’entendaient et voyaient
  rationale: La construction infinitive décrit les circonstances qui fondent leur attention. « Car » explicite naturellement ce rapport contextuel; « l’ » renvoie à Philippe selon le sens attendu malgré la difficulté formelle de αὐτούς dans le texte transmis.
- source_word: τὰ σημεῖα
  choice: les signes
  rationale: « Signes » conserve la portée du terme grec sans ajouter l’interprétation « miraculeux ».
- source_word: ἃ ἐποίει
  choice: qu’il accomplissait
  rationale: « Accomplir des signes » est naturel dans le registre biblique français, et l’imparfait rend l’action en cours ou répétée.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe française est rendue active pour éviter un passif artificiel, tout en préservant l’attention commune des foules, l’écoute de Philippe et la vue des signes.
