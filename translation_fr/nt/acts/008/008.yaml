lexical_decisions:
- source_word: ἐγένετο
  choice: il y eut
  rationale: Avec le nominatif « πολλὴ χαρά », le verbe exprime ici l’apparition ou l’existence d’un état. « Il y eut » est idiomatique en français et conserve la dynamique narrative de l’aoriste.
- source_word: δὲ
  choice: Et
  rationale: La particule assure la continuation du récit sans marquer nécessairement une opposition. « Et » restitue sobrement cet enchaînement.
- source_word: πολλὴ χαρά
  choice: une grande joie
  rationale: Avec le nom abstrait « joie », πολλή indique une forte intensité. « Une grande joie » est naturel, clair et fidèle au grec.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: dans cette ville
  rationale: La ville vient d’être mentionnée dans le contexte. Le français emploie naturellement « cette ville » pour renvoyer au lieu ainsi identifié, là où le grec utilise le démonstratif ἐκείνῃ.
