source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: fr
  text: 'Un ange du Seigneur parla à Philippe : « Lève-toi et va vers le sud[a], sur la route qui descend de Jérusalem à Gaza. » Cette route est déserte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à midi ». L’expression grecque peut indiquer soit une direction, « vers le sud », soit un moment de la journée, « à midi ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Celle-ci est désertique » ou « C’est le désert ». Le grec peut désigner une route traversant une région désertique, plutôt que souligner que la route elle-même est déserte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος
  choice: un ange
  rationale: Le nom singulier sans article se rend naturellement par l’indéfini. Dans ce récit de direction divine, « ange » convient mieux que le terme général « messager ».
- source_word: κυρίου
  choice: du Seigneur
  rationale: Cette expression traditionnelle et naturelle désigne ici l’autorité divine sans préciser davantage l’identité du Seigneur.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: 'parla à Philippe :'
  rationale: Le deux-points introduit naturellement les paroles rapportées en français. Traduire séparément λέγων par « en disant » serait possible, mais plus lourd.
- source_word: Ἀνάστηθι
  choice: Lève-toi
  rationale: Impératif français courant qui conserve l’appel à une action immédiate.
- source_word: πορεύου
  choice: dirige-toi
  rationale: Ce verbe exprime clairement le déplacement demandé et s’accorde naturellement avec l’indication de direction qui suit.
- source_word: κατὰ μεσημβρίαν
  choice: vers le sud
  rationale: Dans le contexte d’un déplacement vers une route, le sens directionnel est probablement le plus naturel. Le sens temporel « à midi » demeure possible et figure en note.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: jusqu’à la route
  rationale: Cette formulation française exprime naturellement le mouvement vers la route sans laisser entendre que Philippe s’y trouve déjà.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: qui descend de Jérusalem à Gaza
  rationale: « Descend » conserve l’indication géographique liée à l’altitude de Jérusalem tout en restant idiomatique.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Cette route est déserte
  rationale: Le féminin αὕτη renvoie vraisemblablement à ὁδός, « route ». « Déserte » préserve le sens d’un lieu isolé ou peu fréquenté, tandis que l’interprétation géographique « désert » est signalée en note.
theological_decisions:
- issue: Référent du « Seigneur » dans l’expression « un ange du Seigneur »
  choice: La formule est conservée telle quelle, comme l’expression d’une mission ou d’une appartenance divine.
  alternative: « Un ange envoyé par Dieu » ou l’identification à une figure révélatrice particulière appelée « l’ange du Seigneur ».
  rationale: Le texte présente l’ange comme lié au Seigneur, mais ne fournit pas ici de précision autorisant une identification théologique plus développée.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs sont directs sans être archaïques. Le deux-points évite le calque lourd « en disant ». Les deux ambiguïtés réelles du grec, sur μεσημβρία et ἔρημος, sont maintenues au moyen de notes placées aux endroits correspondants.
