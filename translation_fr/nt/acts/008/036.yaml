  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: fr
  text: 'Comme ils poursuivaient leur chemin, ils arrivèrent à de l’eau, et l’eunuque dit : « Voici de l’eau ! Qu’est-ce qui m’empêche d’être baptisé ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ τὴν ὁδόν
  choice: poursuivaient leur chemin
  rationale: Expression française naturelle qui rend le déplacement le long de la route sans lourdeur littérale.
- source_word: ἐπί τι ὕδωρ
  choice: à un point d’eau
  rationale: τι indique une étendue ou quantité d’eau non précisée ; « point d’eau » reste indéfini et convient au contexte du voyage.
- source_word: φησιν
  choice: dit
  rationale: Le présent historique grec anime le récit ; en français narratif courant, le passé simple assure ici une narration naturelle sans altérer le sens.
- source_word: Ἰδοὺ ὕδωρ
  choice: Voici de l’eau !
  rationale: « Voici » restitue directement l’interjection qui attire l’attention sur l’eau désormais visible.
- source_word: βαπτισθῆναι
  choice: que je sois baptisé
  rationale: Conserve la voix passive de l’infinitif aoriste et l’idée que l’eunuque reçoit le baptême.
theological_decisions:
- issue: Ce qui pourrait empêcher le baptême
  choice: Qu’est-ce qui empêche que je sois baptisé ?
  alternative: Qu’est-ce qui m’empêche d’être baptisé ?
  rationale: La formulation retenue conserve clairement la question ouverte du texte sans ajouter de condition doctrinale ni anticiper la réponse narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, sans archaïsme ni ajout explicatif.
