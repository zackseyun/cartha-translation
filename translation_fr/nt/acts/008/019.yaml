language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: fr
  text: 'En disant : « Donnez-moi aussi cette autorité[a], afin que quiconque à qui j’imposerai les mains reçoive l’Esprit Saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pouvoir ». Le grec exousia peut désigner une autorité, un droit ou le pouvoir d’agir ; « autorité » permet de le distinguer des termes grecs qui signifient plus directement « puissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Il disait
  rationale: Le participe présent rattache cette parole à l’action du verset précédent. En français narratif, « Il disait » rend naturellement ce lien sans alourdir la phrase.
- source_word: Δότε
  choice: Donnez
  rationale: L’impératif aoriste pluriel de δίδωμι appelle le sens direct de « donner »; le pluriel correspond aux destinataires de la demande.
- source_word: κἀμοί
  choice: moi aussi
  rationale: 'La crase de καί et ἐμοί exprime l’inclusion : Simon demande pour lui-même ce qu’il a vu à l’œuvre chez les apôtres.'
- source_word: ἐξουσίαν
  choice: autorité
  rationale: ἐξουσία peut désigner l’autorité, le droit ou la capacité reconnue d’agir. « Autorité » préserve ici sa nuance propre sans la confondre avec les termes grecs désignant plus directement la puissance.
- source_word: ταύτην
  choice: cette
  rationale: Le démonstratif renvoie précisément à l’autorité que Simon vient d’observer.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution introduit clairement en français le but recherché par Simon.
- source_word: ᾧ ἐὰν
  choice: toute personne à qui
  rationale: Le relatif accompagné de ἐάν a une portée indéfinie et générale; cette formulation est claire et naturelle en français moderne.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: j’imposerai les mains
  rationale: « Imposer les mains » est l’expression française consacrée et conserve l’image concrète du grec. Le futur convient à la proposition de but portant sur une action éventuelle ultérieure.
- source_word: λαμβάνῃ
  choice: reçoive
  rationale: Le subjonctif présent français après « afin que » correspond naturellement au subjonctif grec et exprime le résultat visé sans surinterpréter l’aspect.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit Saint
  rationale: Dans le contexte des Actes, l’expression désigne l’Esprit divin. L’article défini est normal en français malgré l’absence d’article en grec.
theological_decisions:
- issue: Sens de ἐξουσία dans la demande de Simon
  choice: autorité
  alternative: pouvoir
  rationale: Le contexte implique bien une capacité effective, mais « autorité » respecte davantage la valeur lexicale de ἐξουσία et évite de l’assimiler sans nuance à δύναμις. Une note conserve l’autre traduction possible.
- issue: Valeur de l’expression anarthre πνεῦμα ἅγιον
  choice: l’Esprit Saint
  alternative: un esprit saint
  rationale: Le récit renvoie sans ambiguïté à l’Esprit divin reçu dans les versets précédents. Traduire par « un esprit saint » introduirait une indétermination étrangère au contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Imposer les mains » conserve l’expression biblique courante sans archaïsme marqué; la formulation maintient le but exprimé en grec et l’indétermination de ᾧ ἐάν.
