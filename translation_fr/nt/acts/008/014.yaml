id: ACT.8.14
reference: Acts 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: fr
  text: Quand les apôtres à Jérusalem apprirent que la Samarie avait reçu la parole de Dieu, ils envoyèrent Pierre et Jean auprès d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Quand … apprirent
  rationale: Le participe aoriste situe l’information reçue avant l’envoi. « Quand … apprirent » est naturel en français narratif. La nuance connective légère de δέ n’exige pas ici un marqueur distinct.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: les apôtres qui étaient à Jérusalem
  rationale: Cette formulation rend explicitement la localisation exprimée par ἐν et évite l’ambiguïté possible de « les apôtres de Jérusalem ».
- source_word: δέδεκται
  choice: avait reçu
  rationale: Le plus-que-parfait français convient à l’antériorité dans le récit et rend l’état résultant du parfait grec sans surinterpréter le verbe comme « accepter ».
- source_word: ἡ Σαμάρεια
  choice: la Samarie
  rationale: Le nom de lieu est conservé, comme en grec, avec un emploi métonymique désignant collectivement ses habitants.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Expression biblique française naturelle qui préserve la forme et la portée de λόγος, tout en désignant ici le message proclamé.
- source_word: ἀπέστειλαν πρὸς αὐτοὺς
  choice: ils lui envoyèrent
  rationale: « Envoyèrent » rend simplement l’aoriste. Le pronom singulier reprend naturellement « la Samarie » en français, tandis que le grec emploie le pluriel selon le sens collectif du nom de lieu.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Pierre et Jean
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables de ces noms bibliques.
theological_decisions:
- issue: Emploi métonymique de « la Samarie »
  choice: la Samarie avait reçu la parole de Dieu
  alternative: les Samaritains avaient reçu la parole de Dieu
  rationale: Le texte grec nomme la Samarie et laisse le lieu représenter ses habitants. Conserver cette métonymie reste proche de la source et n’impose pas une précision absente du texte.
- issue: Sens de λόγος
  choice: la parole de Dieu
  alternative: le message de Dieu
  rationale: « Parole » conserve l’idiome biblique et la richesse lexicale du grec; dans ce contexte, elle désigne néanmoins la proclamation reçue.
- issue: Référent collectif de αὐτούς
  choice: ils lui envoyèrent
  alternative: ils envoyèrent auprès d’eux
  rationale: Le pluriel grec renvoie aux habitants compris dans le collectif « Samarie ». Le français reprend plus naturellement le nom grammaticalement singulier par « lui », sans modifier le référent.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste proche de la structure grecque tout en privilégiant une syntaxe française naturelle. Aucun marqueur tel que « Or » ou « Alors » n’a été ajouté pour δέ, dont la fonction connective légère est suffisamment portée par l’enchaînement.
