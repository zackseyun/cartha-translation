id: ACT.8.38
reference: Acts 8:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: fr
  text: Il ordonna d’arrêter le char, puis Philippe et l’eunuque descendirent tous les deux dans l’eau, et Philippe le baptisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Il ordonna
  rationale: Le verbe exprime un ordre. Cette formulation française est naturelle et conserve la force d’autorité du grec.
- source_word: στῆναι τὸ ἅρμα
  choice: d’arrêter le char
  rationale: Avec le char comme objet logique, l’infinitif signifie le faire s’immobiliser. « Arrêter le char » est idiomatique en français.
- source_word: ἅρμα
  choice: char
  rationale: « Char » est l’équivalent direct et traditionnel, sans préciser davantage le type exact de véhicule.
- source_word: κατέβησαν
  choice: descendirent
  rationale: Le verbe indique un mouvement vers le bas; le complément suivant en précise la destination.
- source_word: ἀμφότεροι ... ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: Philippe et l’eunuque descendirent tous les deux
  rationale: Cette formulation rend explicitement l’insistance grecque sur la participation des deux hommes, tout en restant naturelle en français.
- source_word: εἰς τὸ ὕδωρ
  choice: dans l’eau
  rationale: Après un verbe de mouvement, « dans l’eau » exprime naturellement en français l’entrée dans l’eau et respecte la valeur directionnelle habituelle de εἰς.
- source_word: εὐνοῦχος
  choice: eunuque
  rationale: Le terme conserve le sens ordinaire du grec et la continuité lexicale du récit, sans le réduire au seul statut de fonctionnaire de cour.
- source_word: ἐβάπτισεν
  choice: baptisa
  rationale: Le terme français consacré rend le verbe grec sans imposer une interprétation confessionnelle du mode du baptême.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie à l’eunuque.
theological_decisions:
- issue: La formulation doit-elle trancher la question du mode du baptême ?
  choice: Conserver le mouvement « dans l’eau » et traduire βαπτίζω par « baptisa », sans précision supplémentaire.
  alternative: Employer « immergea » ou atténuer le mouvement en traduisant « jusqu’à l’eau ».
  rationale: Le grec indique que les deux hommes entrent dans l’eau et que Philippe baptise l’eunuque, mais il ne convient pas d’ajouter une conclusion confessionnelle sur le mode précis du baptême.
translation_notes:
  register: Français international moderne, clair et digne. La répétition ambiguë des pronoms grecs est légèrement explicitée par « Philippe » devant « le baptisa » afin d’éviter en français une confusion momentanée sur l’agent, sans ajouter d’information au récit.
