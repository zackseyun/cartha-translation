  naturalness: « Car je vois que tu es dans le fiel de l’amertume » est une formulation biblique soutenue mais claire en français moderne. « Le lien de l’injustice » est également compréhensible et permet de conserver le singulier métaphorique du texte source.
  terminology: « Fiel » rend bien χολή en préservant l’image de poison amer. « Injustice » est un rendu recevable de ἀδικία dans cette expression, sans réduire le terme à une catégorie doctrinale précise. La note lexicale doit être adaptée puisque « le lien » devient le rendu principal.
