id: ACT.8.23
reference: Acts 8:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: fr
  text: Car je vois que tu es dans le fiel de l’amertume[b] et dans le lien de l’injustice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’entrave de l’injustice » ou « la chaîne de l’injustice ».
    reason: lexical_alternative
  - marker: b
    text: « Le fiel de l’amertume » est une image saisissante qui fait probablement écho au langage de l’Ancien Testament sur une amertume empoisonnée (voir Deutéronome 29.18 dans la Septante).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: dans
  rationale: Avec ὁρῶ σε ὄντα, la préposition décrit l’état ou la condition dans laquelle Pierre voit Simon. « Dans » conserve aussi le cadre métaphorique du grec.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation précédente et « car » en garde clairement la valeur explicative.
- source_word: χολὴν πικρίας
  choice: le fiel de l’amertume
  rationale: Cette formulation conserve l’image forte et compacte du grec, probablement nourrie par le langage de l’Ancien Testament, sans la réduire à la seule idée d’amertume.
- source_word: σύνδεσμον ἀδικίας
  choice: les chaînes de l’injustice
  rationale: σύνδεσμος désigne ce qui lie ou retient. Le pluriel français « les chaînes » exprime naturellement cette captivité métaphorique, tandis qu’« injustice » garde la portée large de ἀδικία.
- source_word: ὁρῶ
  choice: je vois
  rationale: Le verbe peut exprimer ici un discernement; « je vois » reste à la fois direct, naturel et proche du grec.
- source_word: σε ὄντα
  choice: que tu es
  rationale: La construction grecque accusatif plus participe après ὁρῶ se rend naturellement en français par une proposition complétive.
theological_decisions:
- issue: Description métaphorique de l’état spirituel et moral de Simon
  choice: 'Conserver les deux images: « dans le fiel de l’amertume » et « dans les chaînes de l’injustice ».'
  alternative: Expliciter par « rempli d’un poison amer et prisonnier du péché » ou une formulation semblable.
  rationale: Le grec énonce des métaphores denses sans fournir d’explication doctrinale détaillée. Les conserver maintient leur force et l’ambiguïté du rapport exact entre amertume, injustice et captivité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste volontairement proche de l’image grecque; « chaînes » est plus idiomatique en français que le singulier abstrait « lien », signalé en note.
