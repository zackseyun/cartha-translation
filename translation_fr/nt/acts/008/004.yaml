  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: fr
  text: Ceux qui avaient été dispersés allèrent donc de lieu en lieu, annonçant la parole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie aussi « annoncer la bonne nouvelle » ; ici, « la parole » désigne le message concernant Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Ceux qui… donc
  rationale: « Donc » conserve la valeur de transition et de conséquence de οὖν après le récit de la persécution et de la dispersion. μέν structure le discours sans exiger ici de correspondant français explicite.
- source_word: διασπαρέντες
  choice: qui avaient été dispersés
  rationale: Le participe aoriste passif exprime une dispersion subie et antérieure au déplacement rapporté par le verbe principal.
- source_word: διῆλθον
  choice: allèrent de lieu en lieu
  rationale: Cette formulation française naturelle exprime le déplacement itinérant impliqué ici par διέρχομαι, sans ajouter une région particulière absente du grec.
- source_word: εὐαγγελιζόμενοι
  choice: annonçant… comme une bonne nouvelle
  rationale: Le participe indique ce qu’ils faisaient au cours de leurs déplacements. La formulation conserve la valeur verbale d’« annoncer une bonne nouvelle » sans recourir au vocabulaire plus ecclésiastique d’« évangéliser » ou de « prêcher l’Évangile ».
- source_word: τὸν λόγον
  choice: la parole
  rationale: Le choix garde le terme concis de Luc et son lien avec le contexte, tout en laissant une note préciser qu’il s’agit ici du message concernant Jésus.
theological_decisions:
- issue: Rapport entre εὐαγγελιζόμενοι et τὸν λόγον
  choice: annonçant la parole comme une bonne nouvelle
  alternative: annonçant la bonne nouvelle de la parole ; proclamant la parole
  rationale: Dans le grec, « la parole » est l’objet direct du verbe qui signifie annoncer une bonne nouvelle. La formulation retenue préserve à la fois l’objet et la nuance propre au verbe, sans créer artificiellement un rapport de dépendance avec « la bonne nouvelle de la parole », ni effacer entièrement la notion de bonne nouvelle.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif biblique écrit ; « de lieu en lieu » rend naturellement le mouvement itinérant. La minuscule à « parole » évite de transformer le terme en titre personnel tout en conservant le vocabulaire lucanien.
