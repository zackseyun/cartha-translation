    issue: 'Construction française maladroite : « annonçant la parole comme une bonne nouvelle »'
    rationale: Le grec εὐαγγελιζόμενοι prend τὸν λόγον comme son objet et signifie annoncer cet objet comme bonne nouvelle. En français, « annoncer X comme une bonne nouvelle » est pesant et peut faire de « comme une bonne nouvelle » une qualification artificielle de « la parole ». « Annonçant la parole » est plus direct; la nuance propre au verbe est préservée en note.
  revised_text: Ceux qui avaient été dispersés allèrent donc de lieu en lieu, annonçant la parole[a].
