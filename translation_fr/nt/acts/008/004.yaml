review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la dispersion subie (διασπαρέντες), le déplacement itinérant (διῆλθον) et « la parole » comme objet direct (τὸν λόγον). Toutefois, « annonçant la parole comme une bonne nouvelle » explicite de manière lourde la valeur de εὐαγγελιζόμενοι et produit une construction française peu naturelle. Le verbe grec peut être rendu directement par « annoncer/proclamer la parole », tandis que sa nuance d’annonce de bonne nouvelle est mieux conservée en note.
  naturalness: « Allèrent donc de lieu en lieu » convient au récit biblique moderne. La suppression de « comme une bonne nouvelle » rend la proposition participiale fluide et idiomatique sans appauvrir le sens, puisque la note explicite la nuance lexicale du verbe grec.
  terminology: « La parole » conserve le terme lucanien sans ajouter « de Dieu » ni transformer le mot en titre personnel. La note identifie sobrement son référent contextuel comme le message concernant Jésus. Aucun ancrage supplémentaire n’est nécessaire.
  issues:
