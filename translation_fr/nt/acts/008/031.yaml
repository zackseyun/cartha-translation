  text: ὁ δὲ εἶπεν· Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ⸀ὁδηγήσει με; παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: fr
  text: 'Il répondit : « Comment le pourrais-je, si personne ne me guide[a] ? » Puis il pria[b] Philippe de monter et de s’asseoir avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si personne ne me conduit ». Le verbe grec peut évoquer aussi bien le fait de guider que celui d’orienter la compréhension.
    reason: lexical_alternative
  - marker: b
    text: Ou « il invita Philippe à monter et à s’asseoir avec lui ». Le verbe grec peut désigner une demande pressante ou une invitation.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Comment le pourrais-je
  rationale: L’optatif avec ἄν exprime ici une possibilité conditionnelle. « Comment le pourrais-je » rend cette nuance modale avec naturel en français.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: si personne ne me guide
  rationale: ὁδηγέω signifie conduire ou guider. Dans le contexte de la lecture de l’Écriture, « guider » conserve à la fois l’image de la conduite et le sens d’une aide à la compréhension, sans réduire le verbe à « expliquer ».
- source_word: παρεκάλεσέν
  choice: pria
  rationale: παρακαλέω peut désigner une demande pressante ou une invitation. « Prier quelqu’un de » exprime ici une demande courtoise mais insistante, sans suggérer une supplication excessive.
- source_word: τε
  choice: Puis
  rationale: La particule relie légèrement les propositions. « Puis » rend naturellement la progression du récit.
- source_word: ἀναβάντα
  choice: de monter
  rationale: ἀναβαίνω exprime le mouvement vers le haut. « Monter » conserve l’image spatiale de l’accès au char sans ajouter explicitement un objet absent du verset.
- source_word: καθίσαι σὺν αὐτῷ
  choice: de s’asseoir avec lui
  rationale: Cette formulation rend directement καθίζω avec σύν et reste naturelle en français, sans préciser indûment « à côté de lui ».
- source_word: Φίλιππον
  choice: Philippe
  rationale: Forme française traditionnelle et courante du nom personnel Φίλιππος.
