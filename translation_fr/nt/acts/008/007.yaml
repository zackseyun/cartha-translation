id: ACT.8.7
reference: Acts 8:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: fr
  text: Car des esprits impurs sortaient de beaucoup de ceux qui en avaient, en poussant de grands cris[a] ; et beaucoup de paralysés et de boiteux furent guéris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La construction grecque est difficile ; le participe traduit par « en poussant de grands cris » se rapporte le plus naturellement aux esprits impurs.
    reason: Préciser le rattachement grammatical du participe sans dissimuler la difficulté de la formulation grecque.
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: Car … de beaucoup de ceux qui en avaient
  rationale: « Car » conserve le lien explicatif marqué par γάρ. La proposition est réorganisée en français afin d’exprimer naturellement que les esprits sortent des personnes qui les avaient, tout en rendant l’idée quantitative de πολλοί.
- source_word: πνεύματα ἀκάθαρτα
  choice: des esprits impurs
  rationale: « Esprits impurs » est l’expression française courante et précise dans le contexte des récits d’exorcisme de Luc et des Actes.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: en poussant de grands cris
  rationale: Cette formulation idiomatique conserve à la fois l’action de crier et son intensité. Le participe neutre pluriel se rapporte le plus naturellement aux esprits impurs.
- source_word: ἐξήρχοντο
  choice: sortaient
  rationale: L’imparfait français rend l’imparfait grec et convient à la description d’exorcismes multiples ; le verbe a pour sujet explicite « des esprits impurs ».
- source_word: πολλοὶ δὲ
  choice: et beaucoup de
  rationale: Ici, δέ coordonne et fait progresser le récit sans opposition marquée ; « et » est donc naturel.
- source_word: παραλελυμένοι
  choice: paralysés
  rationale: Le terme exprime l’état résultant des personnes atteintes de paralysie ; le substantif adjectival français est clair et actuel.
- source_word: χωλοὶ
  choice: boiteux
  rationale: « Boiteux » désigne directement les personnes ayant une mobilité entravée sans recourir à un terme moderne potentiellement péjoratif comme « estropiés ».
- source_word: ἐθεραπεύθησαν
  choice: furent guéris
  rationale: Le passif est conservé, sans ajouter dans cette proposition un agent que le grec ne nomme pas.
theological_decisions:
- issue: Qui pousse les cris et sort ?
  choice: Les esprits impurs poussent de grands cris et sortent des personnes.
  alternative: Les personnes possédées poussent les cris tandis que les esprits sortent.
  rationale: Le participe neutre pluriel βοῶντα s’accorde naturellement avec πνεύματα ἀκάθαρτα, également neutre pluriel. La syntaxe française rend ce rapport explicite sans attribuer les cris aux personnes.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est restructurée pour éviter un calque obscur, tout en maintenant le lien explicatif, l’imparfait de l’action répétée et le passif de la guérison.
