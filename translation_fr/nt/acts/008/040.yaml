source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: fr
  text: Quant à Philippe, il fut trouvé à Azot[a] et, en passant, il annonçait la bonne nouvelle dans toutes les villes, jusqu’à son arrivée à Césarée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « apparut à Azot ». Littéralement : « fut trouvé à Azot ». Dans le contexte, cette expression peut suggérer un déplacement soudain par intervention divine, sans l’affirmer explicitement.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Quant à
  rationale: Marque naturellement en français la transition narrative et le changement de sujet, sans imposer un contraste fort.
- source_word: εὑρέθη εἰς Ἄζωτον
  choice: il se retrouva à Azot
  rationale: Rend le passif grec de manière idiomatique tout en conservant le caractère soudain et inexpliqué de la présence de Philippe à Azot; le lieu résultant est exprimé par « à ».
- source_word: διερχόμενος
  choice: il parcourut la région
  rationale: Le participe décrit son déplacement à travers le territoire depuis Azot vers Césarée. L’ajout explicatif « la région » donne un français naturel sans préciser un territoire absent du grec.
- source_word: εὐηγγελίζετο
  choice: en annonçant la bonne nouvelle
  rationale: Exprime l’action continue ou répétée de l’imparfait grec en langage courant, sans jargon ecclésiastique.
- source_word: τὰς πόλεις πάσας
  choice: dans toutes les villes
  rationale: Conserve la portée collective de πάσας et indique naturellement les lieux successifs de son annonce.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν
  choice: jusqu’à son arrivée à Césarée
  rationale: Rend clairement et avec concision le point d’aboutissement exprimé par ἕως suivi de l’infinitif articulé.
theological_decisions:
- issue: Faut-il expliciter en εὑρέθη une apparition ou un transport miraculeux de Philippe?
  choice: 'Conserver une formulation neutre: « il se retrouva à Azot »'
  alternative: « il apparut à Azot » ou « on retrouva Philippe à Azot »
  rationale: Le contexte suggère fortement une intervention divine, mais εὑρέθη ne décrit pas explicitement son mécanisme. « Se retrouva » préserve le caractère soudain sans transformer l’implication contextuelle en affirmation explicite.
translation_notes:
  register: Français international moderne, fluide et digne. « Azot » et « Césarée » suivent les formes françaises bibliques usuelles. La tournure évite à la fois le calque raide « fut trouvé » dans le corps du texte et l’interprétation plus explicite « apparut ».
