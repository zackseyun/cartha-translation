source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: fr
  text: Quand ils remontèrent hors de l’eau, l’Esprit du Seigneur emporta Philippe[a]. L’eunuque ne le vit plus, car il poursuivait son chemin dans la joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « arracha Philippe ». Le verbe grec peut souligner un enlèvement brusque et énergique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: furent remontés hors de l’eau
  rationale: L’expression rend le mouvement vers le haut et hors de l’eau, sans préciser ni déduire le mode du baptême.
- source_word: πνεῦμα κυρίου
  choice: l’Esprit du Seigneur
  rationale: Dans Luc-Actes, l’expression désigne naturellement l’Esprit de Dieu agissant comme agent divin; les majuscules reflètent cet usage.
- source_word: ἥρπασεν
  choice: enleva soudainement Philippe
  rationale: Le verbe ἁρπάζω exprime ici un retrait brusque et énergique. « Enleva soudainement » reste naturel en français tout en conservant cette force.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: L’eunuque ne le vit plus
  rationale: Cette formulation française exprime clairement qu’à partir de ce moment l’eunuque ne vit plus Philippe.
- source_word: ὁ εὐνοῦχος
  choice: L’eunuque
  rationale: Le nom est explicite dans le grec et assure la continuité avec le récit précédent.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: poursuivit son chemin
  rationale: L’imparfait grec présente la continuation du déplacement; cette expression idiomatique rend l’idée de reprendre et continuer sa route.
- source_word: χαίρων
  choice: dans la joie
  rationale: Cette tournure naturelle rend l’état de joie qui accompagne la poursuite du voyage, tout en évitant une formulation française pesante.
theological_decisions:
- issue: L’identité et l’action de πνεῦμα κυρίου
  choice: « l’Esprit du Seigneur », avec une action personnelle et divine
  alternative: « un esprit du Seigneur », compris comme une force ou un esprit indéterminé
  rationale: L’usage de Luc-Actes favorise une référence à l’Esprit de Dieu, sans qu’il soit nécessaire d’ajouter « Saint » au texte.
- issue: La force et le caractère miraculeux de ἥρπασεν
  choice: « enleva soudainement Philippe »
  alternative: « emporta Philippe » ou « arracha Philippe »
  rationale: Le contexte attribue l’action à l’Esprit et le verbe suggère un retrait brusque. La traduction conserve ces éléments sans préciser le mécanisme de la disparition.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide pour une lecture publique. « Hors de l’eau » préserve la relation spatiale du grec sans tirer de conclusion sur le mode du baptême; « dans la joie » rend naturellement le participe χαίρων.
