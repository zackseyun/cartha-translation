- from: 'Le passage de l’Écriture qu’il lisait était celui-ci : « Comme une brebis, il a été conduit à l’abattoir[a] ; et comme un agneau reste silencieux devant celui qui le tond[b], ainsi il n’ouvre pas la bouche. »'
  to: 'Le passage de l’Écriture qu’il lisait était celui-ci : « Comme une brebis, il a été conduit pour être égorgée[a] ; et comme un agneau reste silencieux devant celui qui le tond[b], ainsi il n’ouvre pas la bouche. »'
  rationale: La révision remplace uniquement « à l’abattoir » par « pour être égorgée », afin d’éviter l’anachronisme lexical et de reproduire plus directement ἐπὶ σφαγήν. Les notes sont ajustées en conséquence ; aucune ambiguïté textuelle ou interprétation christologique n’est ajoutée.
