id: ACT.8.32
reference: Acts 8:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: fr
  text: 'Le passage de l’Écriture qu’il lisait était celui-ci : « Comme une brebis, il a été conduit pour être égorgée[a] ; et comme un agneau reste silencieux devant celui qui le tond[b], ainsi il n’ouvre pas la bouche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’abattoir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « devant le tondeur » ; le grec dit littéralement « devant celui qui le tond ».
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: Le passage de l’Écriture
  rationale: Dans ce contexte, περιοχή désigne une portion précise du texte sacré. « Passage » est naturel en français moderne, et « l’Écriture » rend le référent reconnu de γραφή.
- source_word: ἀνεγίνωσκεν
  choice: qu’il lisait
  rationale: L’imparfait grec présente une action en cours dans le passé ; l’imparfait français en restitue naturellement l’aspect.
- source_word: Ὡς πρόβατον
  choice: Comme une brebis
  rationale: « Comme » conserve la comparaison introduite par ὡς. « Brebis » est une désignation française naturelle de l’animal dans cette citation et maintient la distinction avec ἀμνός, « agneau ».
- source_word: ἐπὶ σφαγὴν
  choice: à l’abattoir
  rationale: La formule exprime le mouvement vers la mise à mort. « À l’abattoir » est concise, claire et idiomatique, tandis que la note conserve une autre formulation possible.
- source_word: ἤχθη
  choice: il a été conduit
  rationale: Le passif de ἄγω indique qu’il est mené vers sa mise à mort. Le passé composé convient à la narration française tout en conservant le passif.
- source_word: ἀμνὸς
  choice: agneau
  rationale: ἀμνός désigne précisément un agneau, à distinguer du terme plus général πρόβατον.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: devant celui qui le tond
  rationale: Cette formulation rend à la fois la position exprimée par ἐναντίον et la valeur participiale de κείραντος, sans transformer obligatoirement l’action en titre professionnel.
- source_word: ἄφωνος
  choice: reste silencieux
  rationale: Dans la comparaison, ἄφωνος signifie que l’agneau ne fait entendre aucune voix. « Reste silencieux » est courant et exprime clairement cette absence de réaction vocale.
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: ainsi il n’ouvre pas la bouche
  rationale: « Ainsi » marque la conclusion de la comparaison, et le présent français conserve le présent vivant de la citation grecque.
theological_decisions:
- issue: Citation messianique d’Ésaïe 53 appliquée à Jésus dans le contexte
  choice: Conserver les comparaisons et les pronoms de la citation sans nommer Jésus dans ce verset
  alternative: Expliciter Jésus comme le serviteur souffrant
  rationale: Le récit environnant donne l’application christologique, mais le verset lui-même cite l’Écriture. La traduction laisse donc cette identification se dégager du contexte sans l’insérer dans la citation.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence de la citation est préservée sans archaïsmes ; le point-virgule distingue les deux comparaisons.
