  source_fidelity: 'Le sens général est fidèle : « passage de l’Écriture », l’imparfait « qu’il lisait », les deux comparaisons, le passif « a été conduit » et le présent final rendent correctement le grec. Toutefois, « à l’abattoir » concrétise σφαγή par une installation moderne et déplace légèrement l’image scripturaire de la mise à mort.'
  naturalness: Le français est fluide et le registre convient. « Pour être égorgée » est naturel dans ce contexte figuré et conserve mieux la formulation de la citation que « à l’abattoir ».
  terminology: « Écriture », « brebis » et « agneau » sont appropriés. La distinction entre πρόβατον et ἀμνός est maintenue. « Celui qui le tond » rend correctement κείραντος αὐτόν.
