id: ACT.8.24
reference: Acts 8:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: fr
  text: 'Mais Simon répondit : « Priez le Seigneur pour moi, afin que rien de ce que vous avez dit ne m’arrive. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: répondit
  rationale: La combinaison du participe et de εἶπεν est une tournure grecque d’introduction de la parole. « Répondit » en restitue naturellement la valeur sans répéter deux verbes de parole.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le passage légèrement contrasté de la réprimande de Pierre à la réaction de Simon.
- source_word: Δεήθητε ὑμεῖς
  choice: Priez vous-mêmes
  rationale: '« Priez » exprime clairement la demande d’intercession, tandis que « vous-mêmes » rend l’insistance portée par le pronom explicite ὑμεῖς : Simon demande à ses interlocuteurs de prier pour lui.'
- source_word: ὑπὲρ ἐμοῦ
  choice: pour moi
  rationale: Cette formulation française courante rend l’idée de représentation ou d’intercession exprimée par ὑπέρ avec le génitif.
- source_word: πρὸς τὸν κύριον
  choice: le Seigneur
  rationale: 'Après « prier », le français construit naturellement le destinataire sans préposition : « prier le Seigneur ». « Seigneur » conserve le terme κύριος sans en préciser davantage le référent.'
- source_word: ὅπως μηδὲν
  choice: afin que rien
  rationale: « Afin que » conserve la nuance de but ou de résultat recherché, et « rien » rend le neutre substantivé μηδέν.
- source_word: ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ne s’abatte sur moi
  rationale: Cette expression naturelle et solennelle conserve l’image de quelque chose qui vient sur Simon, avec la nuance possible de malheur ou de jugement.
- source_word: ὧν εἰρήκατε
  choice: de ce que vous avez dit
  rationale: Cette construction rend le génitif dépendant de μηδέν et le parfait, dont les paroles prononcées gardent ici leur portée présente.
theological_decisions:
- issue: Référent de τὸν κύριον
  choice: le Seigneur
  alternative: Dieu ; le Seigneur Jésus
  rationale: Le grec dit seulement « le Seigneur ». Le contexte ne contraint pas à identifier plus précisément le référent ; la traduction conserve donc l’ambiguïté du texte.
translation_notes:
  register: Français moderne, digne et accessible. L’inversion littéraire « répondit Simon » est évitée au profit de l’ordre courant. « S’abatte sur moi » garde la gravité de l’avertissement sans expliciter la nature exacte de ce qui est annoncé.
