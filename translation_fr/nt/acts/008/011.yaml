id: ACT.8.11
reference: Acts 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: fr
  text: Ils lui prêtaient attention parce que, depuis assez longtemps[a], il les stupéfiait par ses pratiques magiques[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant un temps considérable ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par ses sorcelleries ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: prêtaient attention
  rationale: L’imparfait décrit leur attention soutenue envers Simon; « prêtaient attention » est naturel en français moderne et conserve cette valeur durative.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif complète naturellement « prêter attention à ».
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: parce que, depuis longtemps
  rationale: διά avec l’infinitif substantivé exprime la cause, tandis que ἱκανῷ χρόνῳ indique une durée notable. « Depuis longtemps » s’accorde naturellement avec l’imparfait français et relie cette durée à l’action répétée ou continue.
- source_word: ταῖς μαγείαις
  choice: par ses pratiques magiques
  rationale: μαγεία désigne ici des pratiques de magie. Cette formulation reste claire sans décider s’il s’agissait de procédés frauduleux, d’une activité occulte ou des deux.
- source_word: ἐξεστακέναι
  choice: il les stupéfiait
  rationale: Le verbe signifie causer l’étonnement ou la stupéfaction. Le plus-que-parfait français serait maladroit après « depuis longtemps »; l’imparfait rend naturellement l’effet prolongé qui expliquait leur attention.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux personnes mentionnées dans le contexte et constitue l’objet de l’action de stupéfier.
theological_decisions:
- issue: Nature des pratiques de Simon dans μαγείαις
  choice: pratiques magiques
  alternative: sorcelleries
  rationale: Le verset décrit les pratiques de Simon et leur effet sans préciser si elles relevaient de la tromperie, de l’occultisme ou des deux. « Pratiques magiques » préserve cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe privilégie une formulation idiomatique tout en conservant le lien causal, la durée notable et l’indétermination du terme relatif à la magie.
