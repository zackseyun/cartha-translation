  source_fidelity: 'Très fidèle au grec : τότε est rendu par « Alors » ; les deux imparfaits (ἐπετίθεσαν, ἐλάμβανον) sont conservés par l’imparfait français ; l’expression idiomatique « imposer les mains » rend correctement ἐπιτίθημι τὰς χεῖρας ἐπί. « L’Esprit Saint » correspond au référent déterminé de πνεῦμα ἅγιον dans ce contexte lucanien.'
  naturalness: Le français est clair, actuel et de registre biblique sobre. « Ceux-ci » évite utilement que le second « ils » soit compris comme renvoyant encore aux apôtres ; la légère tenue de ce démonstratif convient au registre.
  terminology: « Imposer les mains » et « l’Esprit Saint » sont les termes français usuels, précis et interconfessionnels. La note exprime avec prudence les valeurs possibles de l’imparfait sans faire de l’itération une certitude.
