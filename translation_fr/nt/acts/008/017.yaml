id: ACT.8.17
reference: Acts 8:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ⸀ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: fr
  text: Alors, ils leur imposaient les mains, et ceux-ci recevaient l’Esprit Saint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux verbes grecs sont à l’imparfait. Selon le contexte, on peut aussi comprendre que les apôtres imposaient successivement les mains aux personnes, qui recevaient alors l’Esprit Saint.
    reason: 'Précision aspectuelle : le grec laisse ouvertes des nuances de déroulement et de répétition que l’imparfait français conserve sans les trancher entièrement.'
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: 'Marque naturellement en français la succession narrative : cette action suit la prière des apôtres.'
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: ils leur imposaient les mains
  rationale: « Imposer les mains à quelqu’un » est l’équivalent français consacré et actuel de cette expression grecque. L’imparfait rend l’aspect imperfectif du verbe et peut évoquer une action répétée d’une personne à l’autre.
- source_word: ἐλάμβανον
  choice: recevaient
  rationale: L’imparfait français préserve directement l’aspect imperfectif grec sans préciser à tort s’il s’agit du commencement, de la durée ou de la répétition de la réception.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit Saint
  rationale: Dans ce contexte des Actes, l’expression désigne l’Esprit divin promis. L’article est requis par l’usage français naturel, sans ajouter de précision doctrinale au texte.
- source_word: αὐτούς / sujet implicite de ἐλάμβανον
  choice: leur / ceux-ci
  rationale: « Ceux-ci » identifie clairement les personnes auxquelles les mains sont imposées comme celles qui reçoivent l’Esprit, et évite l’ambiguïté que produirait en français la répétition de « ils ».
theological_decisions:
- issue: Référence de πνεῦμα ἅγιον
  choice: l’Esprit Saint
  alternative: un esprit saint
  rationale: Le contexte immédiat et l’usage de Luc-Actes renvoient à l’Esprit divin, et non à un esprit indéfini.
- issue: Valeur des deux imparfaits grecs
  choice: ils leur imposaient les mains… recevaient
  alternative: ils leur imposèrent les mains… reçurent
  rationale: Les deux imparfaits français conservent la présentation imperfective des deux actions et leur relation, sans transformer le passage en deux événements ponctuels ni imposer une valeur précise au-delà de la forme grecque.
translation_notes:
  register: Français international moderne, clair et digne. « Imposer les mains » conserve l’expression biblique courante. « Ceux-ci » est légèrement soutenu, mais assure une référence pronominale nette sans alourdir la phrase.
