id: ACT.8.22
reference: Acts 8:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: fr
  text: 'Repens-toi donc de cette méchanceté qui est la tienne, et supplie le Seigneur : peut-être l’intention[a] de ton cœur te sera-t-elle pardonnée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pensée » ou « le dessein ».
    reason: Le nom grec ἐπίνοια peut désigner une pensée, une intention ou un dessein ; « intention » convient au contexte, mais les autres nuances demeurent possibles.
lexical_decisions:
- source_word: μετανόησον
  choice: Repens-toi
  rationale: L’impératif aoriste appelle à une repentance décisive. « Repens-toi » conserve la portée morale et spirituelle du verbe.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français la conséquence tirée de la réprimande précédente.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: de cette méchanceté qui est la tienne
  rationale: Cette formulation conserve à la fois le démonstratif ταύτης et l’insistance possessive de σου, tout en présentant κακία comme un mal moral.
- source_word: δεήθητι
  choice: supplie
  rationale: Le verbe désigne une demande instante. « Supplie » rend mieux cette intensité que le simple « prie », sans cesser de désigner une prière adressée au Seigneur.
- source_word: τοῦ κυρίου
  choice: le Seigneur
  rationale: « Le Seigneur » est le correspondant français habituel de κύριος. Le texte ne précise pas davantage ici l’identité du référent.
- source_word: εἰ ἄρα
  choice: peut-être
  rationale: Placé avec la proposition de pardon, « peut-être » maintient le caractère conditionnel et réservé de l’expression grecque sans suggérer une impossibilité matérielle.
- source_word: ἀφεθήσεταί σοι
  choice: te soit pardonnée
  rationale: Le passif préserve l’idée d’un pardon accordé sans en expliciter l’agent. Le subjonctif est exigé naturellement après « pour que », tandis que « peut-être » conserve la réserve du grec.
- source_word: ἡ ἐπίνοια
  choice: l’intention
  rationale: Dans ce contexte, le mot vise la disposition ou le dessein intérieur à l’origine de la demande de Simon. « Intention » en rend la nuance morale et volitive, tout en laissant « pensée » en note comme autre possibilité.
- source_word: τῆς καρδίας σου
  choice: de ton cœur
  rationale: Cette traduction formellement proche conserve l’image biblique du cœur comme siège de la pensée et de la volonté.
theological_decisions:
- issue: Degré de certitude concernant le pardon
  choice: 'La formulation indique que Simon doit se repentir et supplier le Seigneur, tout en laissant l’octroi du pardon sous une forme réservée : « peut-être ».'
  alternative: Présenter le pardon soit comme automatiquement garanti par la repentance, soit comme improbable ou impossible.
  rationale: La combinaison εἰ ἄρα avec le futur passif exprime une possibilité conditionnelle. La traduction maintient cette tension sans la transformer en assurance absolue ni en désespoir.
- issue: Référent de « Seigneur »
  choice: Conserver simplement « le Seigneur ».
  alternative: Préciser explicitement « Jésus » ou « Dieu ».
  rationale: Le contexte chrétien permet plusieurs façons de comprendre le référent, mais le verset lui-même ne l’explicite pas. La traduction ne tranche donc pas.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Supplie » conserve la force de la demande instante; « qui est la tienne » est volontairement soutenu afin de préserver l’insistance possessive du grec. Le marqueur [a] est placé immédiatement après le terme concerné.
