id: ACT.8.18
reference: Acts 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: fr
  text: Mais quand Simon vit que l’Esprit était donné par l’imposition des mains des apôtres[a], il leur offrit de l’argent,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Esprit Saint ». Le texte grec dit simplement « l’Esprit », mais, dans ce contexte, il s’agit de l’Esprit Saint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: quand … vit
  rationale: Le participe aoriste de ὁράω a ici une valeur temporelle; cette tournure naturelle en français marque la perception qui précède l’action de Simon.
- source_word: δὲ
  choice: Mais
  rationale: δέ introduit une légère transition avec une nuance de contraste, ici la réaction problématique de Simon.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: par l’imposition des mains
  rationale: διά suivi du génitif exprime ici le moyen. « Imposition des mains » est une expression française courante et fidèle à ἐπίθεσις τῶν χειρῶν.
- source_word: τῶν ἀποστόλων
  choice: des apôtres
  rationale: Le complément du nom restitue naturellement en français la relation génitive du texte grec.
- source_word: δίδοται
  choice: était donné
  rationale: Le présent passif grec peut être rendu à l’imparfait dans le récit français; l’imparfait présente ce que Simon constatait, sans identifier les apôtres comme source ultime du don.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Le texte grec dit littéralement « l’Esprit »; le contexte immédiat indique qu’il s’agit de l’Esprit Saint.
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: il leur offrit de l’argent
  rationale: προσφέρω désigne ici l’action de proposer ou présenter quelque chose, et χρήματα signifie naturellement « argent » dans ce contexte.
theological_decisions:
- issue: Référent de τὸ πνεῦμα
  choice: l’Esprit, avec une note précisant qu’il s’agit de l’Esprit Saint
  alternative: l’Esprit Saint dans le texte principal
  rationale: La traduction conserve la formulation exacte et concise du grec tout en rendant explicite en note le référent clair dans le contexte.
- issue: Rôle de l’imposition des mains dans le don de l’Esprit
  choice: était donné par l’imposition des mains des apôtres
  alternative: était accordé par les apôtres lorsqu’ils imposaient les mains
  rationale: La formulation conserve l’indication de moyen exprimée par διά sans faire des apôtres la source ultime de l’Esprit ni tirer une conclusion sacramentelle ou antisacramentelle étrangère au verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « vit / offrit » convient à la narration biblique écrite sans être archaïque; « imposition des mains » garde l’expression consacrée et intelligible.
