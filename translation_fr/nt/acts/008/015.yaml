id: ACT.8.15
reference: Acts 8:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: fr
  text: qui descendirent et prièrent[a] pour eux afin qu’ils reçoivent l’Esprit Saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui, une fois descendus, prièrent ».'
    reason: Le participe aoriste καταβάντες peut être rendu explicitement comme une circonstance temporelle antérieure plutôt que par deux verbes coordonnés.
lexical_decisions:
- source_word: οἵτινες
  choice: qui
  rationale: Le pronom relatif renvoie à Pierre et Jean, mentionnés au verset précédent. « qui » conserve naturellement le lien syntaxique sans surtraduire sa valeur référentielle.
- source_word: καταβάντες
  choice: descendirent
  rationale: Le participe aoriste exprime une action antérieure ou étroitement liée à celle du verbe principal. La coordination « descendirent et prièrent » est fluide en français et respecte l’ordre des actions.
- source_word: προσηύξαντο
  choice: prièrent
  rationale: L’aoriste de προσεύχομαι désigne simplement l’action de prier; la voix moyenne n’appelle pas ici de formulation particulière en français.
- source_word: περὶ αὐτῶν
  choice: pour eux
  rationale: Avec le verbe « prier », περί suivi du génitif indique ici que la prière est faite en faveur de ces personnes.
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit le but visé par la prière. « afin que » en conserve clairement la valeur finale dans un registre digne et naturel.
- source_word: λάβωσιν
  choice: ils reçoivent
  rationale: Le subjonctif grec dépend de ὅπως. Le subjonctif présent français après « afin que » exprime naturellement ce but, sans ajouter une idée d’incertitude ou de capacité.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit Saint
  rationale: Dans ce contexte des Actes, l’expression désigne l’Esprit divin promis aux croyants. L’article défini correspond à l’usage français normal pour ce référent, même si le grec n’emploie pas ici d’article.
theological_decisions:
- issue: Faut-il comprendre πνεῦμα ἅγιον comme un esprit saint générique ou comme l’Esprit divin?
  choice: l’Esprit Saint
  alternative: un esprit saint
  rationale: Le contexte narratif des Actes désigne l’Esprit promis et donné aux croyants. La traduction retient ce référent contextuel sans développer de doctrine supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. Le fragment conserve le pronom relatif initial du grec, puisqu’il poursuit la phrase commencée au verset précédent. La coordination rend la succession des actions avec naturel, tandis que la note signale la construction participiale.
