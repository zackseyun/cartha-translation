review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la séquence des participes aoristes (« après avoir… »), le retour à Jérusalem et l’annonce de la bonne nouvelle. Toutefois, « tout en proclamant » subordonne explicitement l’annonce au déplacement, alors que les deux imparfaits grecs sont simplement coordonnés et présentent deux actions en cours. Une coordination française directe préserve mieux cette relation sans la préciser davantage.
  naturalness: Le français est moderne et clair. « Ils retournaient à Jérusalem et proclamaient… » est tout aussi naturel que la formulation proposée et restitue mieux le parallélisme verbal du grec.
  terminology: « Rendre solennellement témoignage », « la parole du Seigneur », « la bonne nouvelle » et « villages samaritains » sont des choix recevables, fidèles et adaptés à un registre international moderne. Le pronom « ils » conserve à juste titre le sujet pluriel implicite, sans ajouter de noms.
  issues:
  - severity: medium
    issue: « tout en proclamant » impose un rapport de subordination entre les deux actions.
    rationale: Le grec coordonne ὑπέστρεφον et εὐηγγελίζοντο par τε; les deux imparfaits décrivent des actions concomitantes, mais le texte ne présente pas grammaticalement la proclamation comme une simple action accessoire du retour. « Et proclamaient » conserve l’ambiguïté et le parallélisme.
  revised_text: Ainsi donc, après avoir rendu solennellement témoignage et annoncé la parole du Seigneur, ils retournaient à Jérusalem et proclamaient la bonne nouvelle dans de nombreux villages samaritains.
