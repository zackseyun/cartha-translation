id: ACT.8.25
reference: Acts 8:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: fr
  text: Ainsi donc, après avoir rendu solennellement témoignage et annoncé la parole du Seigneur, ils retournaient à Jérusalem et proclamaient la bonne nouvelle dans de nombreux villages samaritains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: après avoir rendu solennellement témoignage
  rationale: Le verbe exprime un témoignage appuyé et sérieux. Cette formulation en conserve la force sans introduire l’idée plus étroite d’un avertissement.
- source_word: λαλήσαντες τὸν λόγον τοῦ κυρίου
  choice: annoncé la parole du Seigneur
  rationale: « Annoncé » rend naturellement en français l’action de communiquer la parole, tandis que « la parole du Seigneur » préserve la formulation et la portée théologique du grec.
- source_word: ὑπέστρεφον
  choice: ils retournaient
  rationale: L’imparfait grec présente le retour comme une action en cours; l’imparfait français en restitue naturellement l’aspect.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: dans de nombreux villages samaritains
  rationale: Le génitif désigne naturellement des villages samaritains, c’est-à-dire habités par des Samaritains. Cette formulation est claire et idiomatique en français moderne.
- source_word: εὐηγγελίζοντο
  choice: tout en proclamant la bonne nouvelle
  rationale: Cette expression rend le sens verbal sans jargon ecclésiastique et, avec « tout en », présente la proclamation comme accompagnant le trajet de retour, conformément aux deux imparfaits grecs.
theological_decisions:
- issue: Identité du sujet sous-entendu
  choice: Maintenir le pronom « ils »
  alternative: Préciser « Pierre et Jean »
  rationale: Le contexte immédiat identifie Pierre et Jean, mais le verset grec porte seulement un sujet pluriel implicite. La traduction n’ajoute donc pas leurs noms.
- issue: Rapport entre le retour et l’annonce de la bonne nouvelle
  choice: Présenter l’annonce comme accompagnant le retour
  alternative: Lire les deux verbes comme deux actions simplement coordonnées
  rationale: Les deux verbes à l’imparfait permettent de comprendre que la proclamation se déroulait au cours du trajet. « Tout en » exprime cette simultanéité probable sans modifier l’identité ni le contenu de l’annonce.
translation_notes:
  register: Français international moderne, fluide et digne. « Ainsi donc » conserve la transition narrative de μὲν οὖν; « bonne nouvelle » évite le terme plus ecclésiastique « Évangile » tout en restant immédiatement compréhensible.
