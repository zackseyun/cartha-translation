source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: fr
  text: 'Mais Pierre lui dit : « Que ton argent[a] périsse avec toi, puisque tu as pensé pouvoir acquérir[b] le don de Dieu avec de l’argent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta monnaie ». Le grec emploie littéralement « argent », terme qui peut aussi désigner la monnaie.'
    reason: alternative_lexical
  - marker: b
    text: 'Ou : « obtenir » ou « acheter ». Simon considérait le don de Dieu comme quelque chose que l’on pouvait obtenir en payant.'
    reason: alternative_lexical
lexical_decisions:
- source_word: ἀργύριόν
  choice: argent
  rationale: Le grec désigne littéralement l’argent métal et, couramment, la monnaie. En français moderne, « argent » exprime naturellement les deux sens et convient au contexte.
- source_word: σὺν σοὶ
  choice: avec toi
  rationale: Cette formulation directe conserve l’association frappante entre Simon et son argent dans la sentence de Pierre.
- source_word: εἴη εἰς ἀπώλειαν
  choice: Que ... périsse
  rationale: L’optatif exprime ici un souhait imprécatoire ou une sentence. « Que ... périsse » en garde la force sans préciser indûment une condamnation éternelle.
- source_word: δωρεὰν
  choice: don
  rationale: « Don » rend naturellement ce qui est accordé gratuitement et maintient le contraste explicite avec l’argent.
- source_word: ἐνόμισας
  choice: tu as pensé
  rationale: Le verbe signifie penser, supposer ou estimer. « Tu as pensé » est clair et direct.
- source_word: διὰ χρημάτων
  choice: avec de l’argent
  rationale: διά avec le génitif indique le moyen; cette tournure est naturelle en français moderne.
- source_word: κτᾶσθαι
  choice: acquérir
  rationale: Le verbe exprime l’idée d’obtenir ou d’entrer en possession. « Acquérir » conserve cette portée sans imposer à lui seul le sens plus étroit d’acheter.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre la demande de Simon et la réplique sévère de Pierre.
theological_decisions:
- issue: Portée de la sentence de Pierre concernant Simon et son argent
  choice: 'Un souhait imprécatoire de perte ou de destruction : « Que ton argent périsse avec toi »'
  alternative: Une prédiction déclarative de destruction, ou une formule affirmant explicitement la damnation éternelle
  rationale: L’optatif εἴη favorise une formule de souhait ou de sentence. La traduction préserve la gravité de la réprimande sans trancher une question de condamnation finale que le grec ne formule pas explicitement.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la sévérité de la réplique ainsi que l’ambiguïté relative de ἀπώλεια, sans employer une expression familière ni introduire explicitement la notion de damnation.
