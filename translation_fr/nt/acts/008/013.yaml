id: ACT.8.13
reference: Acts 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: fr
  text: Simon, lui aussi, crut. Après avoir été baptisé, il restait auprès de Philippe et, en voyant les signes et les grandes manifestations de puissance[a] qui se produisaient, il était stupéfait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de grands miracles ». Le terme grec peut désigner des manifestations de puissance ou des miracles.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: lui aussi
  rationale: Cette tournure française naturelle conserve à la fois la valeur emphatique de αὐτός et la valeur additive de καί.
- source_word: ἐπίστευσεν
  choice: crut
  rationale: Le verbe est rendu simplement, sans préciser si la foi de Simon était authentique ou non, question que le contexte narratif laisse en tension.
- source_word: βαπτισθεὶς
  choice: après avoir été baptisé
  rationale: Le participe aoriste passif exprime une action antérieure à l'attachement continu de Simon auprès de Philippe.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: il restait auprès de Philippe
  rationale: L'imparfait périphrastique indique une action continue. « Restait auprès de » exprime naturellement son attachement persistant sans en exagérer la portée.
- source_word: θεωρῶν
  choice: en voyant
  rationale: Le participe présent associe la stupéfaction de Simon au spectacle continu dont il était témoin.
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » conserve la portée révélatrice ou probante habituelle du terme dans les Actes.
- source_word: δυνάμεις μεγάλας
  choice: grandes manifestations de puissance
  rationale: Cette formulation rend l'idée d'actes manifestant une grande puissance tout en évitant de réduire d'emblée le terme au seul concept de miracle.
- source_word: γινομένας
  choice: qui se produisaient
  rationale: L'imparfait français rend naturellement les événements en cours observés par Simon.
- source_word: ἐξίστατο
  choice: il était stupéfait
  rationale: L'imparfait exprime l'étonnement continu de Simon, tandis que « stupéfait » restitue la force du verbe sans tournure excessive.
theological_decisions:
- issue: La nature de la foi de Simon
  choice: Traduire simplement ἐπίστευσεν par « crut »
  alternative: « crut sincèrement », « prétendit croire » ou « eut une foi superficielle »
  rationale: Le verset affirme que Simon crut et fut baptisé, tandis que la suite du récit soulève des questions sur son état spirituel. La traduction ne tranche donc pas une ambiguïté théologique que le texte lui-même maintient.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression du grec tout en évitant une accumulation de coordinations peu idiomatique en français. Le marqueur de note est placé après l'expression qu'il explique.
