id: ACT.8.10
reference: Acts 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: fr
  text: 'Tous lui prêtaient attention, du plus petit au plus grand, et disaient : « Cet homme est la puissance de Dieu que l’on appelle la Grande[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cet homme est ce qu’on appelle la grande puissance de Dieu. » Le grec peut se comprendre comme une expression plus compacte ayant valeur de titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: lui prêtaient attention
  rationale: Le verbe προσέχω exprime ici une attention soutenue dirigée vers Simon. Cette formulation est naturelle en français moderne sans suggérer une adhésion plus forte que le grec.
- source_word: πάντες
  choice: Tous
  rationale: Le terme indique sans restriction l'ensemble du groupe mentionné dans le contexte.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: du plus petit au plus grand
  rationale: Cette expression conserve le mérisme grec qui englobe toute la population, quel que soit le rang ou l'importance.
- source_word: λέγοντες
  choice: et disaient
  rationale: L'imparfait rend l'action concomitante et répétée dans ce récit au passé, tandis que la coordination produit un français fluide.
- source_word: Οὗτός
  choice: Cet homme
  rationale: Le démonstratif désigne Simon. « Cet homme » est idiomatique et garde sa force déictique.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: la puissance de Dieu
  rationale: La formulation conserve la structure définie et l'allure de titre de l'expression grecque, sans présenter l'affirmation de la foule comme celle du narrateur.
- source_word: ἡ καλουμένη Μεγάλη
  choice: appelée la Grande
  rationale: Le participe passif indique une appellation. L'accord féminin avec « puissance » et l'article devant l'adjectif donnent en français une désignation naturelle et reconnaissable comme telle.
- source_word: Μεγάλη
  choice: la Grande
  rationale: L'adjectif féminin substantivé ou épithète détachée fonctionne comme une appellation de la « puissance ». « La Grande » préserve mieux cette valeur titulaire en français que le seul adjectif « grande ».
theological_decisions:
- issue: Faut-il rendre les paroles de la foule comme un titre divin formel ou comme une affirmation descriptive au sujet de Simon ?
  choice: « Cet homme est la puissance de Dieu appelée la Grande »
  alternative: « Cet homme est ce qu'on appelle la Grande Puissance de Dieu »
  rationale: Le texte rapporte l'opinion de la foule sans que le narrateur la cautionne. La formulation retenue préserve à la fois l'identification frappante de Simon à la puissance divine et l'ambiguïté de la syntaxe titulaire.
translation_notes:
  register: Français international moderne, digne et accessible. L'imparfait s'accorde au cadre narratif. La tournure « du plus petit au plus grand » conserve l'image du grec plutôt que de l'expliciter en catégories sociales.
