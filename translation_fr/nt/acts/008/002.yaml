  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: fr
  text: Des hommes pieux ensevelirent Étienne[a] et se livrèrent à de grandes lamentations sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préparèrent Étienne pour l’ensevelissement » ou « emportèrent Étienne pour l’ensevelir » ; le verbe grec peut mettre l’accent sur la prise en charge du corps aussi bien que sur son ensevelissement.
    reason: lexical_alternative
  - marker: b
    text: Ces « grandes lamentations » peuvent comprendre des manifestations de douleur audibles et publiques, et non seulement une tristesse intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: ensevelirent
  rationale: Dans ce contexte, le verbe désigne la prise en charge du corps d’Étienne après sa mort, jusqu’à son ensevelissement. « Ensevelirent » est naturel et digne en français, tandis qu’une note préserve les nuances possibles de préparation ou de transport du corps.
- source_word: δέ
  choice: non traduit explicitement
  rationale: Le français marque naturellement ici la transition narrative par le début d’une nouvelle phrase. Rendre δέ par « mais » suggérerait un contraste plus appuyé que ne l’exige la particule grecque.
- source_word: ἄνδρες εὐλαβεῖς
  choice: des hommes pieux
  rationale: « Hommes » conserve la référence masculine explicite de ἄνδρες, et « pieux » exprime de façon courante la révérence religieuse portée par εὐλαβεῖς.
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: menèrent un grand deuil
  rationale: L’expression française « mener le deuil » rend idiomatiquement le verbe sémantiquement léger ἐποίησαν avec κοπετόν, tout en gardant l’intensité de μέγαν et la possibilité de manifestations extérieures de douleur.
- source_word: ἐπ’ αὐτῷ
  choice: sur lui
  rationale: Avec le vocabulaire du deuil, « sur lui » conserve au plus près la relation exprimée par ἐπί avec le datif, dans un registre biblique encore intelligible en français moderne.
