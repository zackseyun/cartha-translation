id: ACT.8.27
reference: Acts 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: fr
  text: Il se leva et partit. Et voici qu’un homme éthiopien, un eunuque[a], haut fonctionnaire de Candace[b], reine des Éthiopiens, qui était responsable de tout son trésor, était venu à Jérusalem pour adorer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fonctionnaire de cour ». Le mot grec peut, dans certains contextes, désigner un fonctionnaire royal, bien que son sens littéral soit probablement voulu ici.
    reason: lexical_alternative
  - marker: b
    text: « Candace » était peut-être un titre dynastique porté par la reine plutôt qu’un nom personnel.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: Il se leva donc et partit
  rationale: Rend la succession des actions exprimée par le participe aoriste et le verbe principal dans un français narratif naturel; « donc » marque le lien avec l’ordre reçu dans le contexte.
- source_word: ἰδοὺ
  choice: Et voici qu’il y avait
  rationale: Conserve explicitement le marqueur d’attention lucanien tout en employant une tournure française digne et compréhensible.
- source_word: ἀνὴρ Αἰθίοψ
  choice: un homme éthiopien
  rationale: Préserve à la fois la désignation masculine explicite ἀνήρ et l’origine exprimée par Αἰθίοψ.
- source_word: εὐνοῦχος
  choice: un eunuque
  rationale: Retient le sens premier et probablement concret du terme; le statut administratif est déjà exprimé séparément par δυνάστης.
- source_word: δυνάστης
  choice: haut fonctionnaire
  rationale: Exprime clairement une personne investie d’une autorité élevée sans lui attribuer à tort la souveraineté d’un dirigeant.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: de Candace, reine des Éthiopiens
  rationale: Transcrit Κανδάκη sous la forme française traditionnelle « Candace » et suit le pluriel ethnique du grec; une note signale qu’il peut s’agir d’un titre dynastique.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: responsable de tout son trésor
  rationale: Rend l’autorité administrative exprimée par ἐπί et le sens financier de γάζα dans un français idiomatique.
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: était venu à Jérusalem pour adorer
  rationale: L’antériorité du plus-que-parfait grec est préservée, et le participe futur de but est rendu explicitement par « pour adorer ».
theological_decisions:
- issue: Sens concret ou administratif de εὐνοῦχος
  choice: « eunuque » dans le texte principal
  alternative: « fonctionnaire de cour »
  rationale: Le sens concret est le sens lexical premier et semble pertinent pour l’identité sociale et corporelle du personnage. L’autre nuance reste signalée en note, sans effacer la tension du texte.
- issue: Statut du nom Κανδάκη
  choice: « Candace » dans le texte principal
  alternative: « la Candace », titre dynastique de la reine
  rationale: La translittération traditionnelle permet une lecture fluide, tandis que la note conserve l’incertitude historique entre nom propre et titre dynastique.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici » conserve la vivacité du récit sans archaïsme excessif. La ponctuation répartit la longue phrase grecque en unités naturelles pour la lecture française.
