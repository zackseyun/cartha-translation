source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: fr
  text: Dans son humiliation, la justice lui a été retirée[b]. Qui racontera sa génération[a] ? Car sa vie est ôtée de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa descendance » ou « ses contemporains » ; le grec « génération » préserve l’ambiguïté de la citation d’Ésaïe 53.
    reason: alternative_reading
  - marker: b
    text: Ou « le jugement lui a été retiré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: humiliation
  rationale: Le nom désigne un état d’abaissement. « Humiliation » convient au contexte de souffrance injuste sans ajouter d’interprétation.
- source_word: κρίσις
  choice: justice
  rationale: Dans ce contexte judiciaire, le terme peut désigner la justice qui lui a été refusée. « Justice » exprime naturellement cette privation tout en conservant la dimension juridique.
- source_word: ἤρθη
  choice: a été retirée
  rationale: Le passif de αἴρω exprime ici l’enlèvement ou la privation. « A été retirée » garde clairement cette idée.
- source_word: γενεὰν
  choice: génération
  rationale: Le mot peut renvoyer à la descendance, aux contemporains ou à la génération d’une personne. « Génération » préserve l’ambiguïté de la citation d’Ésaïe.
- source_word: διηγήσεται
  choice: racontera
  rationale: Le verbe signifie raconter ou exposer en détail. « Racontera » est clair et naturel dans la question rhétorique.
- source_word: αἴρεται
  choice: est enlevée
  rationale: Le présent passif produit un effet vivant. « Est enlevée » rend directement l’idée de retrait hors de la vie terrestre.
- source_word: γῆς
  choice: terre
  rationale: Dans l’expression « enlevée de la terre », « terre » désigne naturellement le monde des vivants.
- source_word: ζωὴ
  choice: vie
  rationale: Le sens direct est ici la vie physique, conformément au contexte de la mort du serviteur.
theological_decisions:
- issue: Interprétation de « sa génération »
  choice: Conserver dans le texte l’expression ambiguë « sa génération ».
  alternative: « sa descendance » ou « ses contemporains »
  rationale: La formulation issue d’Ésaïe 53 est difficile et admet plusieurs interprétations. Le texte principal ne tranche donc pas, et les possibilités principales sont signalées en note.
- issue: Sens de κρίσις
  choice: Traduire par « justice ».
  alternative: « jugement »
  rationale: Le contexte permet de comprendre qu’un traitement juste lui a été retiré. « Justice » rend cette dimension juridique et morale sans exclure entièrement l’autre lecture, indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la citation grecque, tandis que « lui a été retirée » est plus idiomatique en français que le calque « a été enlevée de lui ». Les deux ambiguïtés majeures sont conservées ou documentées.
