id: ACT.8.1
reference: Acts 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: fr
  text: Saul approuvait sa mise à mort. Ce jour-là, une grande persécution éclata contre l’Église de Jérusalem, et tous furent dispersés dans les régions de la Judée et de la Samarie, à l’exception des apôtres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Saul
  rationale: Translittération française usuelle du nom personnel.
- source_word: συνευδοκῶν
  choice: approuvait
  rationale: Avec ἦν, le participe exprime une approbation en cours ou concomitante; l’imparfait français la rend naturellement sans faire de Saul un participant direct à l’acte.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: sa mise à mort
  rationale: L’expression désigne l’acte de lui ôter la vie. « Mise à mort » reste naturelle et neutre quant à la légitimité juridique, contrairement à « exécution », et n’ajoute pas la qualification morale de « meurtre ».
- source_word: Ἐγένετο
  choice: éclata
  rationale: Dans ce contexte, le verbe introduit le déclenchement soudain d’une persécution; « éclata » est idiomatique en français.
- source_word: διωγμὸς μέγας
  choice: une grande persécution
  rationale: Rendu direct qui conserve l’intensité exprimée par μέγας.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: contre l’Église de Jérusalem
  rationale: « Contre » exprime l’hostilité dirigée vers la communauté; « de Jérusalem » identifie naturellement sa localisation.
- source_word: πάντες δὲ διεσπάρησαν
  choice: et tous furent dispersés
  rationale: Le passif conserve l’idée d’une dispersion subie; « tous » maintient la portée rhétorique, ensuite limitée par l’exception explicite.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: dans les régions de la Judée et de la Samarie
  rationale: « Régions » rend le sens territorial de χώρας sans préciser indûment qu’il s’agit de villes ou de campagnes.
- source_word: πλὴν τῶν ἀποστόλων
  choice: à l’exception des apôtres
  rationale: Rend explicitement et naturellement l’exception introduite par πλήν.
theological_decisions:
- issue: Qualification de la mort d’Étienne dans ἀναιρέσει αὐτοῦ
  choice: sa mise à mort
  alternative: son exécution; son meurtre; sa mort
  rationale: « Mise à mort » préserve la référence à l’acte de tuer sans lui attribuer une légitimité judiciaire ni ajouter une qualification morale plus forte que le terme grec.
- issue: Portée de πάντες
  choice: tous furent dispersés… à l’exception des apôtres
  alternative: tous les croyants furent dispersés; tout le monde fut dispersé
  rationale: La formulation conserve l’universalité rhétorique du grec tout en laissant l’exception explicite définir sa portée contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. Syntaxe resserrée et naturelle; aucun connecteur temporel initial n’est ajouté pour δέ. La majuscule à « Église » désigne ici la communauté locale sans introduire une distinction confessionnelle.
