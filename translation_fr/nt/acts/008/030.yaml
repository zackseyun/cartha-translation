id: ACT.8.30
reference: Acts 8:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: fr
  text: 'Philippe accourut et l’entendit lire le prophète Ésaïe. Il lui dit : « Est-ce que tu comprends vraiment ce que tu lis ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Comprends-tu donc ce que tu lis ? » Les particules grecques donnent une insistance particulière à la question de Philippe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: accourut
  rationale: Le participe aoriste de προστρέχω exprime un mouvement rapide vers quelqu’un. « Accourut » conserve cette vivacité tout en étant naturel en français.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici la progression du récit. En français, l’enchaînement naturel des phrases suffit, sans imposer un connecteur qui alourdirait le verset.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: l’entendit lire
  rationale: La construction avec ἀκούω et un participe au génitif indique que Philippe l’entend pendant qu’il lit. Cette formulation française est concise et n’ajoute pas explicitement « à voix haute », même si le fait d’être entendu l’implique.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: le prophète Ésaïe
  rationale: C’est l’ordre le plus idiomatique en français moderne et il restitue entièrement le titre et le nom.
- source_word: εἶπεν
  choice: Il lui dit
  rationale: « Dire » est l’équivalent direct de λέγω; le point d’interrogation indique clairement qu’il s’agit d’une question. Le pronom indirect explicite naturellement le destinataire déjà présent dans la construction grecque.
- source_word: Ἆρά γε
  choice: Est-ce que … vraiment
  rationale: L’association des particules donne à la question une force interrogative appuyée. « Vraiment » rend cette insistance sans la transformer en certitude ou en reproche.
- source_word: γινώσκεις
  choice: comprends
  rationale: Dans ce contexte, le verbe porte sur la compréhension du sens du texte lu, plutôt que sur une simple connaissance.
- source_word: ἃ ἀναγινώσκεις
  choice: ce que tu lis
  rationale: Le relatif désigne le contenu en cours de lecture. Le présent français exprime naturellement l’action actuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Accourut » garde le mouvement vif du récit; la question demeure directe et accessible. Le marqueur de note est placé après la citation, car la note porte sur la formulation de toute la question.
