id: ACT.8.29
reference: Acts 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: fr
  text: 'Alors l’Esprit dit à Philippe : « Approche-toi et reste près de ce char[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Approche-toi et attache-toi à ce char. »'
    reason: La forme κολλήθητι peut souligner plus littéralement l’idée de s’attacher étroitement au char, tandis que le contexte suggère de se tenir à sa hauteur et de le suivre de près.
lexical_decisions:
- source_word: εἶπεν
  choice: dit
  rationale: L’aoriste de λέγω introduit ici un discours direct dans un récit ; « dit » est la tournure française la plus naturelle.
- source_word: δὲ
  choice: Alors
  rationale: δέ marque ici la progression du récit plutôt qu’une opposition ; « Alors » exprime naturellement l’enchaînement.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans ce contexte de direction divine en Actes, l’expression désigne vraisemblablement l’Esprit Saint. Le texte grec n’ajoute toutefois pas ἅγιον ; « l’Esprit » conserve cette formulation.
- source_word: τῷ Φιλίππῳ
  choice: à Philippe
  rationale: Le datif indique le destinataire des paroles ; « Philippe » est la forme française usuelle du nom.
- source_word: Πρόσελθε
  choice: Approche-toi
  rationale: L’impératif de προσέρχομαι commande à Philippe de se déplacer vers le char. « Approche-toi » rend directement et naturellement ce mouvement.
- source_word: κολλήθητι
  choice: reste près de
  rationale: κολλάομαι évoque le fait de s’attacher ou de se tenir étroitement auprès de quelque chose. Dans la scène, « reste près de » exprime de façon idiomatique la proximité suivie avec le char en mouvement.
- source_word: τῷ ἅρματι τούτῳ
  choice: de ce char
  rationale: ἅρμα désigne ici le véhicule de l’eunuque, traditionnellement et justement rendu par « char ». Le démonstratif τούτῳ est conservé par « ce ».
theological_decisions:
- issue: Référent de τὸ πνεῦμα
  choice: « l’Esprit », compris dans le contexte comme l’Esprit Saint
  alternative: Une impulsion spirituelle exprimée de manière moins personnelle
  rationale: Dans les Actes, « l’Esprit » intervient régulièrement comme agent personnel de la direction divine. La traduction n’explicite pas « Saint », absent du grec, et préserve ainsi la formulation du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. « Approche-toi et reste près de » privilégie une formulation immédiatement compréhensible tout en conservant, en note, l’image plus littérale de l’attachement.
