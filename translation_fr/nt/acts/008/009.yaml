revisions:
- from: Un homme nommé Simon se trouvait déjà dans la ville. Il pratiquait la magie[a] et frappait d’étonnement le peuple de Samarie, en disant qu’il était lui-même quelqu’un de grand[b].
  to: Il y avait déjà dans la ville un homme nommé Simon, qui pratiquait la magie[a] et frappait d’étonnement le peuple de Samarie, disant qu’il était lui-même quelqu’un d’important[b].
  rationale: 'La révision améliore deux formulations françaises sans modifier le sens du passage : elle exprime plus idiomatiquement l’antériorité de la présence de Simon et remplace une expression susceptible d’évoquer une grandeur physique par « quelqu’un d’important », qui rend la prétention à la grandeur tout en laissant indéterminé le statut précis revendiqué.'
