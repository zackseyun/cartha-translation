id: ACT.8.9
reference: Acts 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: fr
  text: Il y avait déjà dans la ville un homme nommé Simon, qui pratiquait la magie[a] et frappait d’étonnement le peuple de Samarie, disant qu’il était lui-même quelqu’un d’important[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pratiquait la sorcellerie ». Le verbe grec désigne la pratique des arts magiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’il était un grand personnage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Un homme
  rationale: Ἀνήρ désigne ici un homme, tandis que τις introduit un personnage indéfini. Le léger lien marqué par δέ est naturellement porté par la progression du récit, sans ajout artificiel de « Or ».
- source_word: ὀνόματι Σίμων
  choice: nommé Simon
  rationale: Formulation française idiomatique pour le datif ὀνόματι suivi du nom propre.
- source_word: προϋπῆρχεν ἐν τῇ πόλει
  choice: se trouvait déjà dans la ville
  rationale: L’imparfait de προϋπάρχω situe la présence de Simon avant les événements qui viennent d’être racontés. « Se trouvait déjà » exprime cette antériorité sans suggérer davantage que le texte.
- source_word: μαγεύων
  choice: pratiquait la magie
  rationale: Le verbe désigne l’exercice des arts magiques. Cette expression moderne reste descriptive et n’ajoute aucune explication sur la source de ces pratiques.
- source_word: ἐξιστάνων
  choice: frappait d’étonnement
  rationale: 'Le participe causatif exprime l’effet continu produit sur la population : Simon la stupéfiait ou l’émerveillait.'
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: le peuple de Samarie
  rationale: Dans ce contexte, ἔθνος désigne collectivement la population de Samarie plutôt qu’une entité politique au sens moderne.
- source_word: λέγων εἶναί τινα ἑαυτὸν μέγαν
  choice: en disant qu’il était lui-même quelqu’un de grand
  rationale: « En disant » reste proche de λέγων, « lui-même » rend l’insistance de ἑαυτόν, et « quelqu’un de grand » conserve la formulation volontairement générale de τινα… μέγαν.
theological_decisions:
- issue: Caractérisation de l’activité de Simon
  choice: pratiquait la magie
  alternative: pratiquait la sorcellerie
  rationale: Le verset décrit des arts magiques sans en préciser ici la nature métaphysique ni employer une qualification théologique plus développée.
- issue: Portée de la prétention de Simon
  choice: qu’il était lui-même quelqu’un de grand
  alternative: qu’il était un grand personnage
  rationale: La formulation retenue préserve l’indétermination de τινα et l’auto-exaltation soulignée par ἑαυτόν, sans définir le statut exact auquel Simon prétendait.
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases évitent une longue accumulation participiale tout en conservant l’antériorité, la continuité des actions et la prétention personnelle de Simon.
