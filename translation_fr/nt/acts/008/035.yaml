source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: fr
  text: Alors Philippe prit la parole et, partant de ce passage de l’Écriture, lui annonça la bonne nouvelle au sujet de Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec dit : « il lui annonça la bonne nouvelle : Jésus »; Jésus est le contenu de l’annonce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: prit la parole
  rationale: L’expression grecque signifie idiomatiquement commencer à parler. « Prit la parole » est naturel, digne et courant en français, tandis que le calque « ouvrit la bouche » paraîtrait artificiel ici.
- source_word: δὲ
  choice: Alors
  rationale: La particule marque ici la progression du récit; « Alors » rend cette transition sans lui donner une valeur argumentative excessive.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: partant de ce passage de l’Écriture
  rationale: « Partant de » conserve l’idée du point de départ exprimée par ἀπό. Dans ce contexte, « passage de l’Écriture » indique naturellement qu’il s’agit du texte qui vient d’être lu, tout en maintenant le sens de γραφή comme Écriture sainte.
- source_word: εὐηγγελίσατο
  choice: annonça la bonne nouvelle
  rationale: Cette formulation rend directement le sens d’annoncer une bonne nouvelle, sans la connotation institutionnelle que peut prendre « prêcher ».
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie clairement au dignitaire éthiopien dans le contexte et reproduit sans ajout le référent pronominal grec.
- source_word: τὸν Ἰησοῦν
  choice: de Jésus
  rationale: Avec εὐαγγελίζομαι, l’accusatif désigne ici le contenu ou le centre de l’annonce. « La bonne nouvelle de Jésus » garde une concision proche du grec et laisse subsister la nuance possible entre la bonne nouvelle concernant Jésus et celle dont Jésus est le centre.
theological_decisions:
- issue: Sens de εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: '« lui annonça la bonne nouvelle de Jésus » : Jésus est le contenu et le centre de l’annonce'
  alternative: « lui annonça la bonne nouvelle au sujet de Jésus » ou « lui annonça Jésus »
  rationale: La construction grecque place directement Jésus comme objet ou contenu de l’annonce. La formulation retenue est naturelle en français et conserve davantage la densité de l’expression grecque que l’explicitation « au sujet de », sans imposer une distinction doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Prit la parole » traduit l’idiome grec sans calque maladroit; « passage de l’Écriture » rend explicite le référent immédiat tout en conservant la portée sacrée de γραφή.
