  source_fidelity: '« Alors Philippe prit la parole » rend idiomatiquement et avec dignité ἀνοίξας ... τὸ στόμα αὐτοῦ. « Partant de ce passage de l’Écriture » traduit correctement le point de départ marqué par ἀπό et le référent immédiat de γραφή. En revanche, « la bonne nouvelle de Jésus » peut naturellement vouloir dire en français la bonne nouvelle proclamée par Jésus, alors que τὸν Ἰησοῦν est le contenu direct de l’annonce : Jésus est celui dont Philippe annonce la bonne nouvelle.'
