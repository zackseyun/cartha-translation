source:
  edition: SBLGNT
  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: fr
  text: Il revenait, assis sur son char, et lisait[a] le prophète Ésaïe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Antiquité, on lisait souvent à voix haute. On pourrait donc comprendre « lisait à voix haute », mais le verbe grec ne le précise pas explicitement ici.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Il revenait
  rationale: La construction périphrastique avec ἦν et le participe présent présente une action en cours dans le passé. L’imparfait français « revenait » en rend naturellement l’aspect, sans ajouter « chez lui », absent du grec. La particule τέ est intégrée naturellement à l’enchaînement du récit.
- source_word: καθήμενος
  choice: assis
  rationale: Le participe indique sa posture pendant le trajet. « Assis » est précis, naturel et fidèle au sens statif.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: dans son char
  rationale: Même si ἐπί avec le génitif peut avoir le sens littéral de « sur », le français idiomatique situe une personne « dans » un véhicule. « Char » conserve l’image concrète du moyen de transport antique.
- source_word: ἀνεγίνωσκεν
  choice: lisait
  rationale: L’imparfait grec décrit une lecture en cours. Le verbe peut désigner une lecture faite à voix haute dans ce contexte culturel, mais il ne l’explicite pas à lui seul ; cette possibilité est donc signalée en note.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: le prophète Ésaïe
  rationale: Cette formulation suit l’ordre grec et reste tout à fait naturelle en français. Elle désigne Ésaïe comme le prophète dont l’écrit était lu.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. L’imparfait maintient la continuité narrative et l’aspect progressif des actions. La syntaxe reste proche du grec sans recourir à la tournure plus lourde « était en train de revenir ».
