  to: 'Mais Saul dévastait[b] l’Église : il pénétrait dans les maisons, les unes après les autres[a], en traînait de force des hommes et des femmes et les faisait emprisonner.'
  rationale: La révision clarifie la distribution de κατὰ τοὺς οἴκους, conserve le lien du participe « pénétrant » avec la dévastation, et remplace une périphrase moins idiomatique par « les faisait emprisonner ». L’expression « en traînait de force » maintient l’idée d’extraire violemment des personnes de ces maisons, sans introduire de détail institutionnel absent du grec.
