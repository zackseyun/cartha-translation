id: ACT.8.3
reference: Acts 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: fr
  text: 'Mais Saul dévastait[b] l’Église : il pénétrait dans les maisons, les unes après les autres[a], en traînait de force des hommes et des femmes et les faisait emprisonner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de maison en maison ». La tournure grecque peut se rendre des deux façons ; « les maisons, les unes après les autres » souligne son sens distributif.
    reason: lexical_alternative
  - marker: b
    text: Ou « saccageait ». Le verbe grec exprime une action violente et destructrice, plus forte que le simple fait de persécuter.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: dévastait
  rationale: L’imparfait grec présente une action continue ou répétée, et λυμαίνομαι exprime ici des violences destructrices plus fortes qu’une simple opposition. « Dévastait » en conserve l’intensité sans prétendre que Saul anéantissait effectivement l’Église.
- source_word: ἐκκλησίαν
  choice: l’Église
  rationale: Dans ce contexte des Actes, le terme désigne la communauté des croyants. « L’Église » est la formulation française établie et naturelle.
- source_word: κατὰ τοὺς οἴκους
  choice: dans les maisons l’une après l’autre
  rationale: La tournure distributive indique que Saul pénétrait successivement dans de multiples maisons. Cette formulation rend explicitement cette répétition.
- source_word: εἰσπορευόμενος
  choice: il entrait
  rationale: Le participe précise la manière dont Saul dévastait l’Église. Une proposition coordonnée est plus naturelle en français tout en gardant le rapport logique.
- source_word: σύρων
  choice: traînait de force
  rationale: σύρω évoque le fait de tirer ou d’entraîner quelqu’un avec violence. « De force » rend clairement cette contrainte sans ajouter de détail absent du texte.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: hommes et femmes
  rationale: La formulation conserve l’insistance du grec sur le caractère indiscriminé des arrestations.
- source_word: παρεδίδου
  choice: les faisait mettre
  rationale: Dans la construction complète « les faisait mettre en prison », cette expression idiomatique française rend la remise répétée des personnes en vue de leur incarcération, marquée par l’imparfait grec.
- source_word: εἰς φυλακήν
  choice: en prison
  rationale: φυλακή désigne ici la détention ou la prison. « Mettre en prison » est une expression française naturelle.
theological_decisions:
- issue: Intensité des violences commises par Saul avant sa conversion
  choice: « dévastait l’Église »
  alternative: « persécutait l’Église »
  rationale: Le verbe grec décrit une action violente et destructrice. « Dévastait » en préserve la force sans introduire d’interprétation théologique liée à la conversion ultérieure de Saul.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les imparfaits pour exprimer l’action répétée, tout en transformant les participes grecs en verbes coordonnés afin d’obtenir une syntaxe française naturelle.
