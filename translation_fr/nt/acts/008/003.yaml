  naturalness: 'La formulation « dans les maisons l’une après l’autre » est compréhensible, mais son rattachement syntaxique est peu naturel : « l’une après l’autre » se place plus clairement après « les maisons ». « Faisait emprisonner » est plus idiomatique et plus concis que « faisait mettre en prison ».'
  terminology: « L’Église » convient ici pour ἐκκλησίαν. « Dévastait » rend adéquatement la violence de λυμαίνομαι sans imposer une lecture confessionnelle. Les notes sont correctement ancrées dans cette révision et présentent de véritables alternatives lexicales.
