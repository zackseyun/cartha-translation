id: ACT.8.21
reference: Acts 8:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: fr
  text: Tu n’as ni part ni lot dans cette affaire, car ton cœur n’est pas droit devant Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: ni part ni héritage
  rationale: 'Conserve le parallélisme de deux termes proches : μερίς désigne une part, tandis que κλῆρος peut désigner un lot attribué et, par extension, un héritage. « Héritage » reste naturel en français et préserve la portée biblique du second terme sans les confondre.'
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: dans cette affaire
  rationale: Ici λόγος renvoie à la question ou à l’affaire dont il vient d’être parlé, plutôt qu’à une simple parole ou à un discours.
- source_word: εὐθεῖα
  choice: droit
  rationale: L’adjectif signifie littéralement « droit » et exprime ici la rectitude morale ou spirituelle du cœur.
- source_word: ἔναντι τοῦ θεοῦ
  choice: devant Dieu
  rationale: Rend directement l’idée d’être en présence de Dieu et soumis à son regard ou à son jugement.
theological_decisions:
- issue: Portée de κλῆρος
  choice: héritage
  alternative: part / lot
  rationale: Le choix maintient la distinction lexicale avec μερίς et laisse entendre la notion de part attribuée, sans préciser davantage la nature de cette exclusion.
- issue: Nature du défaut du cœur
  choice: n’est pas droit devant Dieu
  alternative: n’est pas sincère aux yeux de Dieu
  rationale: La formulation conserve la métaphore de rectitude du grec et n’en réduit pas la portée à la seule sincérité.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond à l’adresse singulière directe. La structure causale et le parallélisme du grec sont conservés.
