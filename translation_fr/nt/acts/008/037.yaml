  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: fr
  text: 'Philippe[a] dit : « Si tu crois de tout ton cœur, tu peux. » Il répondit : « Je crois que Jésus Christ est le Fils de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens témoins grecs qui conservent ce passage, notamment des codex Sinaïticus et Vaticanus du IVe siècle, ainsi que d’anciennes traductions coptes. Il figure toutefois dans la tradition byzantine majoritaire et dans la tradition latine ; des auteurs chrétiens anciens, tels qu’Irénée et Cyprien, en citent une forme dès la fin du IIe siècle. Beaucoup de spécialistes y voient une ancienne formule liturgique baptismale qui a été intégrée plus tard au récit des Actes.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: c’est possible
  rationale: Le verbe impersonnel indique ici que le baptême demandé peut avoir lieu. « C’est possible » reste naturel en français et conserve la formulation elliptique du grec sans ajouter explicitement « être baptisé ».
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: de tout ton cœur
  rationale: Cette expression biblique courante exprime une foi entière et sincère tout en gardant l’image du cœur.
- source_word: Πιστεύω
  choice: Je crois
  rationale: Dans cette confession, « croire » rend directement l’adhésion à l’affirmation portant sur l’identité de Jésus.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus Christ
  rationale: Le grec présente « Jésus Christ » comme un nom et un titre étroitement associés dans la proposition infinitive. Cette traduction respecte directement le texte source sans restructurer la confession en « Jésus est le Messie, le Fils de Dieu ».
theological_decisions:
- issue: Rapport entre « Jésus Christ » et « le Fils de Dieu » dans la confession
  choice: « Je crois que Jésus Christ est le Fils de Dieu »
  alternative: « Je crois que Jésus est le Messie, le Fils de Dieu »
  rationale: 'La syntaxe grecque place τὸν Ἰησοῦν Χριστόν comme sujet de εἶναι et τὸν υἱὸν τοῦ θεοῦ comme attribut : la confession affirme donc directement que Jésus Christ est le Fils de Dieu. La traduction retenue évite de transformer Χριστόν en un second attribut coordonné.'
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond au dialogue direct singulier. La légère concision de « c’est possible » reproduit l’ellipse grecque, dont le contexte fournit l’idée du baptême.
