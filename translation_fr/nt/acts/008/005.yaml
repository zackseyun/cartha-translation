id: ACT.8.5
reference: Acts 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: fr
  text: Philippe descendit dans la ville de Samarie et leur proclama le Messie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une ville de Samarie ». L’expression grecque peut être comprise comme désignant une ville de la région de Samarie.'
    reason: alternative_reading
  - marker: b
    text: « Samarie » peut désigner la région samaritaine ou la ville de Samarie elle-même.
    reason: geographical_ambiguity
lexical_decisions:
- source_word: δὲ
  choice: et
  rationale: La particule assure ici une transition narrative légère, sans marquer nécessairement une opposition. « Et » s’intègre naturellement à la phrase sans introduire un « alors » temporel absent du grec.
- source_word: κατελθὼν
  choice: descendit
  rationale: Le participe aoriste exprime une action qui accompagne et précède la proclamation. Le passé simple convient au récit et conserve le mouvement descendant de κατέρχομαι.
- source_word: εἰς τὴν πόλιν τῆς Σαμαρείας
  choice: dans la ville de Samarie
  rationale: Cette formulation rend l’article défini du texte grec et le génitif « de Samarie ». Elle laisse toutefois ouverte la question de savoir si Samarie désigne la région ou la ville, précisée en notes.
- source_word: ἐκήρυσσεν
  choice: proclama
  rationale: « Proclama » restitue l’idée d’une annonce publique et autorisée sans réduire le verbe au vocabulaire ecclésiastique de la prédication.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif désigne naturellement les destinataires de la proclamation.
- source_word: τὸν χριστόν
  choice: le Messie
  rationale: Avec l’article et dans ce contexte d’annonce, Χριστός fonctionne comme un titre. « Le Messie » en communique le sens plutôt que de le traiter comme un nom propre.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le mot est employé ici comme titre messianique. « Le Messie » préserve clairement cet arrière-plan et évite que « Christ » soit compris comme un simple nom propre.
- issue: Identification de la ville
  choice: la ville de Samarie
  alternative: une ville de Samarie / la ville appelée Samarie
  rationale: Le texte fourni comporte l’article défini, mais l’expression peut être comprise comme désignant soit une ville de la région samaritaine, soit la ville connue sous le nom de Samarie. Le texte principal suit la forme définie et les notes maintiennent l’ambiguïté géographique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple correspond au registre habituel du récit biblique écrit tout en restant immédiatement compréhensible. Les notes préservent l’ambiguïté réelle de l’expression géographique.
