base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: fr
  text: 'Alors l’eunuque répondit à Philippe : « Je t’en prie[a], de qui le prophète dit-il cela ? De lui-même ou de quelqu’un d’autre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je te le demande. » L’expression grecque désigne une demande respectueuse et peut aussi exprimer une supplication plus pressante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ … εἶπεν
  choice: Alors … prit la parole et dit
  rationale: La combinaison du participe ἀποκριθείς avec εἶπεν est une tournure narrative qui introduit une réaction verbale. « Prit la parole et dit » est naturel en français et évite le peu idiomatique « répondit et dit »; « alors » rend la progression marquée par δέ sans introduire un contraste fort.
- source_word: ὁ εὐνοῦχος
  choice: l’eunuque
  rationale: Le nom désigne explicitement l’eunuque; conserver ce terme respecte le vocabulaire de Luc et l’identité narrative du personnage.
- source_word: τῷ Φιλίππῳ
  choice: à Philippe
  rationale: Le datif indique le destinataire des paroles. La préposition « à » est requise par la tournure française « dire à ».
- source_word: Δέομαί σου
  choice: Je t’en prie
  rationale: δέομαι exprime ici une demande respectueuse, potentiellement insistante. « Je t’en prie » restitue cette force avec naturel, sans donner à la demande une intensité excessive.
- source_word: περὶ τίνος
  choice: de qui
  rationale: περί avec le génitif indique ici la personne dont parle le passage. Après « dire cela », « de qui » est une formulation française directe et idiomatique.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: le prophète dit-il cela
  rationale: Cette formulation conserve le présent de λέγει et le démonstratif singulier τοῦτο, qui renvoie au texte qui vient d’être lu.
- source_word: περὶ ἑαυτοῦ
  choice: de lui-même
  rationale: Le pronom réfléchi renvoie clairement au prophète et s’oppose à une autre personne.
- source_word: περὶ ἑτέρου τινός
  choice: de quelqu’un d’autre
  rationale: Cette expression française naturelle rend à la fois l’indéfini τις et l’altérité exprimée par ἕτερος.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec σου et convient à l’échange direct, sans ajouter de distance sociale absente du texte. La question conserve son ouverture sans anticiper l’interprétation christologique donnée dans la suite du récit.
