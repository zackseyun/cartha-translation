source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: fr
  text: En effet, il n’était pas encore descendu sur aucun d’eux[a] ; ils avaient seulement été baptisés au nom du Seigneur Jésus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’était pas encore tombé sur aucun d’eux ». Le sujet sous-entendu est l’Esprit Saint, mentionné au verset précédent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avaient été baptisés dans le nom du Seigneur Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: pas encore
  rationale: L’expression marque qu’à ce moment-là, l’événement ne s’était produit pour aucun d’eux.
- source_word: ἐπιπεπτωκός
  choice: était descendu sur
  rationale: Dans ce contexte, le verbe décrit la venue de l’Esprit Saint sur des personnes. « Descendre sur » garde l’image spatiale tout en étant plus naturel en français que « tomber sur », qui évoque souvent une rencontre fortuite ou une attaque.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: sur aucun d’eux
  rationale: Cette formulation conserve la portée négative de οὐδενί et la métaphore spatiale de ἐπί avec le datif.
- source_word: μόνον
  choice: seulement
  rationale: Le mot marque la limitation et le contraste entre leur baptême déjà reçu et la venue de l’Esprit qui n’avait pas encore eu lieu.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: ils avaient été baptisés
  rationale: Le plus-que-parfait français exprime naturellement l’action antérieure et l’état qui en résultait, portés par la construction périphrastique grecque.
- source_word: εἰς τὸ ὄνομα
  choice: au nom de
  rationale: « Baptiser au nom de » est l’expression française naturelle et établie. Une note conserve la valeur directionnelle plus littérale de εἰς.
- source_word: κυρίου Ἰησοῦ
  choice: du Seigneur Jésus
  rationale: Cette traduction rend directement le titre κύριος et conserve l’association étroite avec le nom Jésus.
theological_decisions:
- issue: Sujet sous-entendu de ἐπιπεπτωκός
  choice: Le pronom « il » renvoie à l’Esprit Saint nommé au verset précédent.
  alternative: Répéter explicitement « l’Esprit Saint » ou reformuler sans sujet personnel.
  rationale: Le grec omet le sujet parce que le contexte immédiat le rend évident. Le français exige ici un sujet ; le pronom maintient le lien contextuel sans ajouter une précision absente de la phrase.
- issue: Formulation du baptême lié au nom de Jésus
  choice: « baptisés au nom du Seigneur Jésus »
  alternative: « baptisés dans le nom du Seigneur Jésus »
  rationale: La formulation retenue est idiomatique en français et ne tranche pas les débats doctrinaux ultérieurs sur la formule ou les effets du baptême. La note signale la construction grecque plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » rend γάρ en reliant l’explication au verset précédent. Le point-virgule conserve le contraste serré entre l’absence encore constatée de la venue de l’Esprit et le baptême déjà reçu.
