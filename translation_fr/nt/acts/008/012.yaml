id: ACT.8.12
reference: Acts 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: fr
  text: Mais quand ils crurent Philippe, qui leur annonçait la bonne nouvelle du royaume de Dieu et du nom de Jésus le Messie[a], hommes et femmes étaient baptisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le grec Χριστός est rendu ici par « le Messie » pour préserver sa valeur de titre.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais quand
  rationale: ὅτε introduit la proposition temporelle et δέ marque ici une légère transition contrastive avec l’activité antérieure de Simon.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: ils crurent Philippe
  rationale: Le datif désigne Philippe comme la personne dont ils tiennent l’annonce pour vraie, sans faire de lui l’objet de la foi salvatrice. Cette formulation concise conserve la construction grecque.
- source_word: εὐαγγελιζομένῳ
  choice: qui leur annonçait la bonne nouvelle
  rationale: Le participe présent décrit l’activité de Philippe au moment où ils le crurent. L’imparfait français en restitue la valeur durative; «leur» explicite naturellement les destinataires déjà présents dans le contexte.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: du royaume de Dieu
  rationale: περί avec le génitif indique le sujet de l’annonce. Après «annoncer la bonne nouvelle», «du» est idiomatique et «royaume de Dieu» demeure la formulation biblique claire et consacrée.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: du nom de Jésus le Messie
  rationale: «Le nom» conserve la portée personnelle, identitaire et autoritative de ὄνομα sans la réduire à une simple désignation. Χριστός est rendu comme un titre messianique.
- source_word: ἐβαπτίζοντο
  choice: se faisaient baptiser
  rationale: L’imparfait grec présente une action en cours ou répétée à mesure que les personnes répondaient. L’imparfait français conserve cet aspect, et la tournure factitive exprime naturellement le passif.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: hommes et femmes
  rationale: La coordination τε…καί inclut explicitement les deux groupes. La formulation française est naturelle et fidèle.
theological_decisions:
- issue: Valeur de Χριστοῦ dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans cette annonce portant sur l’identité et le nom de Jésus, Χριστός garde nettement sa valeur de titre. «Le Messie» rend ce sens de façon idiomatique en français, tandis que «Jésus-Christ» peut être compris comme un nom composé.
- issue: Objet de la foi dans ἐπίστευσαν τῷ Φιλίππῳ
  choice: ils crurent Philippe
  alternative: ils crurent en Philippe
  rationale: Le datif présente Philippe comme le messager auquel ils accordent foi; «croire en Philippe» risquerait de faire de lui l’objet religieux de leur foi.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la progression du grec, distingue la confiance accordée au messager de la foi en Jésus et préserve l’aspect continu de l’imparfait.
