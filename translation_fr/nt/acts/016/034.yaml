id: ACT.16.34
reference: Acts 16:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: fr
  text: Après les avoir fait monter dans la maison, il leur servit un repas et se réjouit vivement avec toute sa maisonnée[a], ayant cru en Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi être compris comme soulignant que toute la maisonnée prit part à la joie; certains estiment qu’il implique également que tous les membres du foyer avaient cru.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: Après les avoir fait monter
  rationale: Le participe aoriste exprime ici le déplacement vers le haut et précède les verbes principaux; cette formulation restitue naturellement la séquence.
- source_word: εἰς τὸν οἶκον
  choice: dans la maison
  rationale: L’article renvoie à la maison du gardien connue par le contexte, sans qu’il soit nécessaire d’ajouter explicitement le possessif.
- source_word: παρέθηκεν τράπεζαν
  choice: il leur servit un repas
  rationale: L’expression signifie littéralement dresser ou présenter une table, mais désigne idiomatiquement le fait d’offrir de la nourriture; «servit un repas» est naturel en français et conserve le geste d’hospitalité.
- source_word: ἠγαλλιάσατο
  choice: se réjouit vivement
  rationale: Le verbe exprime une joie intense ou exultante; cette tournure reste digne et compréhensible sans être emphatique à l’excès.
- source_word: πανοικεὶ
  choice: avec toute sa maisonnée
  rationale: L’adverbe indique que toute la maison ou maisonnée est associée à la scène; «maisonnée» inclut les personnes du foyer plutôt que le bâtiment.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: ayant cru en Dieu
  rationale: Le participe parfait masculin singulier se rapporte le plus directement au gardien et présente la foi comme acquise avec un effet présent. La forme participiale évite d’imposer une relation causale plus explicite que le grec.
theological_decisions:
- issue: Portée de la joie et de la foi par rapport à la maisonnée
  choice: Le gardien se réjouit avec toute sa maisonnée, tandis que le participe singulier le présente directement comme celui qui a cru.
  alternative: Comprendre que toute la maisonnée a participé non seulement à la joie, mais aussi à la foi.
  rationale: πανοικεὶ peut mettre l’accent sur la participation de toute la maisonnée à la joie et peut être compris comme suggérant une foi partagée. Toutefois, πεπιστευκώς est au masculin singulier et se rapporte grammaticalement le plus directement au gardien. Le texte principal conserve cette donnée sans exclure l’autre compréhension, signalée en note.
translation_notes:
  register: Français international actuel, naturel et digne. «Maisonnée» permet de rendre la dimension collective de πανοικεὶ. La syntaxe participiale finale est conservée afin de préserver l’ambiguïté du rapport logique avec la joie.
