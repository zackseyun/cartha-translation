revisions:
- from: Ayant reçu un tel ordre, il les jeta dans la partie la plus intérieure de la prison et leur immobilisa les pieds dans une pièce de bois[a].
  to: Ayant reçu un tel ordre, il les jeta dans la prison intérieure et leur fixa les pieds dans les ceps[a].
  rationale: La révision restitue ἐσωτέραν par « intérieure » sans transformer le comparatif en superlatif. Elle rend ξύλον par « les ceps », sens contextuel clair en français, tout en conservant en note la formulation littérale et l’explication du dispositif. La phrase demeure fidèle à la vigueur de ἔβαλεν et à l’antériorité de λαβών.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:14:42Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, mais « la partie la plus intérieure » force le comparatif ἐσωτέραν vers un superlatif. εἰς τὸ ξύλον désigne contextuellement les ceps; « dans une pièce de bois » est trop littéral et ne décrit pas correctement la fonction du dispositif.
  naturalness: « Leur immobilisa les pieds dans une pièce de bois » est peu idiomatique et prête à confusion en français moderne. « Leur fixa les pieds dans les ceps » est naturel, précis et conserve le ton narratif direct.
  terminology: « Ordre », « jeta » et « ceps » conviennent. « Prison intérieure » restitue le comparatif grec sans le renforcer en « la plus intérieure ».
  issues:
  - severity: medium
    issue: « la partie la plus intérieure de la prison »
    rationale: ἐσωτέραν est un comparatif (« intérieure », « plus à l’intérieur »), non un superlatif. La formulation française introduit indûment l’idée de la partie la plus reculée.
  - severity: high
    issue: « dans une pièce de bois »
    rationale: Cette expression ne rend pas de manière compréhensible le dispositif de contrainte visé par ξύλον dans ce contexte et donne l’impression que les pieds sont placés dans un simple morceau de bois. « Les ceps », avec une note littérale et culturelle, est l’équivalent français établi.
  - severity: low
    issue: « leur immobilisa les pieds »
    rationale: La construction est grammaticalement possible, mais moins naturelle que « leur fixa les pieds » dans ce contexte de détention.
  revised_text: Ayant reçu un tel ordre, il les jeta dans la prison intérieure et leur fixa les pieds dans les ceps[a].
  revised_footnotes:
  - marker: a
    text: Littéralement « dans le bois »; il s’agit ici d’un dispositif de contention en bois, des ceps.
    reason: cultural_note
  revision_rationale: La révision restitue ἐσωτέραν par « intérieure » sans transformer le comparatif en superlatif. Elle rend ξύλον par « les ceps », sens contextuel clair en français, tout en conservant en note la formulation littérale et l’explication du dispositif. La phrase demeure fidèle à la vigueur de ἔβαλεν et à l’antériorité de λαβών.
