source:
  edition: SBLGNT
  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: fr
  text: Ayant reçu un tel ordre, il les jeta dans la prison intérieure et leur fixa les pieds dans les ceps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans le bois »; il s’agit ici d’un dispositif de contention en bois, des ceps.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: un tel ordre
  rationale: παραγγελία désigne ici une directive donnée par une autorité; « un tel ordre » est naturel et conserve le lien avec l'ordre strict du verset précédent.
- source_word: λαβὼν
  choice: Ayant reçu
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal, que cette tournure française restitue sans surinterprétation.
- source_word: ἔβαλεν
  choice: jeta
  rationale: βάλλω peut signifier mettre ou jeter; « jeta » conserve ici la vigueur du terme et la brutalité du traitement.
- source_word: ἐσωτέραν φυλακήν
  choice: la partie la plus intérieure de la prison
  rationale: ἐσωτέραν désigne la zone plus intérieure et donc plus sûre de la prison; cette formulation évite de transformer nécessairement φυλακή en « cellule ».
- source_word: ἠσφαλίσατο
  choice: immobilisa
  rationale: Le moyen ἠσφαλίσατο indique qu'il fixa solidement leurs pieds; « immobilisa » exprime clairement l'effet du dispositif en français courant.
- source_word: τοὺς πόδας αὐτῶν
  choice: leurs pieds
  rationale: πούς signifie directement « pied »; le possessif pluriel est rendu naturellement.
- source_word: εἰς τὸ ξύλον
  choice: dans une pièce de bois[a]
  rationale: ξύλον signifie littéralement bois ou objet en bois. Le contexte indique un dispositif de contention, mais la traduction conserve l'image concrète et place l'explication culturelle en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase garde la force de « jeta » et la structure participiale grecque. « Pièce de bois » préserve le terme concret du texte source, tandis que la note fournit l'équivalent culturel précis.
