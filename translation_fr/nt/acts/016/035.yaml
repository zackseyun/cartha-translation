source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: fr
  text: 'Quand il fit jour, les magistrats envoyèrent les porteurs de verges[a] en disant : « Relâche ces hommes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « licteurs » : agents officiels des magistrats romains, qui portaient des verges comme symboles de leur autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Quand il fit jour
  rationale: Le génitif absolu marque une transition temporelle. Cette tournure naturelle en français conserve le sens de l’arrivée du jour; le lien narratif porté par δέ est rendu implicitement par l’enchaînement.
- source_word: ἀπέστειλαν
  choice: envoyèrent
  rationale: Rend directement l’aoriste de ἀποστέλλω dans un français courant et précis.
- source_word: στρατηγοὶ
  choice: magistrats
  rationale: Dans le contexte de la colonie romaine de Philippes, le terme désigne les responsables civils de la cité, et non des généraux au sens moderne.
- source_word: ῥαβδούχους
  choice: porteurs de verges
  rationale: La traduction conserve l’image concrète et la fonction officielle exprimées par le grec; le terme historique « licteurs », moins immédiatement accessible, est indiqué en note.
- source_word: λέγοντες
  choice: en disant
  rationale: Conserve simplement le lien participial qui introduit les paroles transmises.
- source_word: Ἀπόλυσον
  choice: Relâche
  rationale: L’impératif singulier ordonne au geôlier de libérer les prisonniers; « relâcher » convient au contexte de détention.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: ces hommes
  rationale: L’expression renvoie ici précisément à Paul et Silas; « ces hommes » est naturel et contextuellement exact.
