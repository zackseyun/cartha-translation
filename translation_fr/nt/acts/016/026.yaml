id: ACT.16.26
reference: Acts 16:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: fr
  text: Tout à coup, il se produisit un violent tremblement de terre, si bien que les fondations de la prison furent ébranlées. À l’instant même, toutes les portes s’ouvrirent et les entraves de chacun furent desserrées.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chaînes de tous se détachèrent ». Le grec peut désigner des liens, des entraves ou des chaînes, et le verbe signifie qu’ils furent relâchés ou détachés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Tout à coup
  rationale: Rend l’irruption soudaine de l’événement dans un français narratif naturel.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: il se produisit un violent tremblement de terre
  rationale: La tournure française exprime naturellement la construction avec γίνομαι; « violent » restitue ici la grande intensité indiquée par μέγας sans employer l’expression peu idiomatique « grand tremblement de terre ».
- source_word: ὥστε σαλευθῆναι
  choice: si bien que … furent ébranlées
  rationale: « Si bien que » marque le résultat, tandis que le passif « furent ébranlées » correspond à σαλευθῆναι.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: les fondations de la prison
  rationale: Traduction directe, claire et courante des éléments structurels fondamentaux du lieu de détention.
- source_word: παραχρῆμα
  choice: À l’instant même
  rationale: Exprime l’immédiateté avec une force narrative appropriée.
- source_word: ἠνεῴχθησαν … αἱ θύραι πᾶσαι
  choice: toutes les portes s’ouvrirent
  rationale: Le pronominal français décrit naturellement l’ouverture sans préciser un agent, tout en conservant la portée de πᾶσαι.
- source_word: πάντων τὰ δεσμὰ
  choice: les entraves de chacun
  rationale: « Entraves » couvre les liens matériels servant à retenir les détenus sans imposer qu’il s’agisse nécessairement de chaînes; « de chacun » rend le génitif πάντων de façon idiomatique.
- source_word: ἀνέθη
  choice: furent desserrées
  rationale: Rend le sens passif de relâchement ou de détachement sans affirmer davantage que le texte sur la libération ultérieure des détenus.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et accessible, conserve la relation de résultat et n’explicite aucun agent derrière l’ouverture des portes ou le desserrement des entraves.
