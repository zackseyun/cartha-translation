id: ACT.16.14
reference: Acts 16:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: fr
  text: Une femme nommée Lydie, marchande d’étoffes de pourpre originaire de la ville de Thyatire, qui adorait Dieu[a], écoutait. Le Seigneur lui ouvrit le cœur pour qu’elle prête attention à ce que disait Paul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une adoratrice de Dieu » ; l’expression peut désigner une non-Juive attachée au Dieu d’Israël.
    reason: Alternative lexicale et possible valeur socioreligieuse de σεβομένη τὸν θεόν.
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: Une femme
  rationale: L’article indéfini français rend naturellement τις dans cette introduction narrative ; « une certaine femme » serait ici inutilement lourd.
- source_word: ὀνόματι Λυδία
  choice: nommée Lydie
  rationale: Formulation française idiomatique de l’expression grecque avec ὀνόματι.
- source_word: πορφυρόπωλις
  choice: marchande d’étoffes de pourpre
  rationale: Le terme désigne une commerçante en produits teints de pourpre. Cette formulation claire indique la marchandise probable sans en faire nécessairement des vêtements.
- source_word: πόλεως Θυατείρων
  choice: originaire de la ville de Thyatire
  rationale: Exprime naturellement la provenance indiquée par le génitif grec.
- source_word: σεβομένη τὸν θεόν
  choice: qui adorait Dieu
  rationale: Rend le sens religieux de σεβομένη dans un français courant, tout en laissant à la note la possible valeur de désignation d’une non-Juive attachée au Dieu d’Israël.
- source_word: ἤκουεν
  choice: écoutait
  rationale: L’imparfait français restitue l’action en cours exprimée par l’imparfait grec.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Correspond directement au grec sans préciser davantage l’identité du référent.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: lui ouvrit le cœur
  rationale: Expression française naturelle qui conserve l’image grecque d’une réceptivité intérieure rendue possible.
- source_word: προσέχειν
  choice: pour qu’elle prête attention
  rationale: Reste proche du sens d’attention dirigée, sans surinterpréter le verbe comme une conversion ou une réponse explicite.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: à ce que disait Paul
  rationale: Formulation française fluide qui rend le contenu des paroles et leur déroulement, sans alourdir la phrase par un passif.
theological_decisions:
- issue: Référent de ὁ κύριος
  choice: le Seigneur
  alternative: Dieu ; le Seigneur Jésus
  rationale: Le grec dit seulement ὁ κύριος. La traduction conserve cette désignation et son ouverture théologique sans identifier plus précisément le référent.
- issue: Portée de σεβομένη τὸν θεόν
  choice: qui adorait Dieu
  alternative: une adoratrice de Dieu ; une femme qui craignait Dieu
  rationale: Le texte décrit sa relation au Dieu d’Israël, mais peut aussi employer une expression reconnue pour une non-Juive sympathisante. Le texte principal reste naturel et la note signale cette nuance.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « écoutait » maintient l’aspect progressif ; la division en deux phrases évite une période française trop chargée tout en préservant l’enchaînement narratif.
