  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: fr
  text: La foule se joignit alors à l’attaque contre eux[a]. Les magistrats leur arrachèrent leurs vêtements et ordonnèrent qu’on les batte à coups de verges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La foule se souleva contre eux. » Le verbe grec souligne l’action hostile collective de la foule.'
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « magistrats » désigne les autorités civiles romaines de Philippes ; plus techniquement, les « préteurs ».
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: se souleva avec eux contre
  rationale: 'Le verbe composé exprime une action hostile collective : la foule se joint aux accusateurs et se dresse contre Paul et Silas. Cette formulation conserve à la fois l’idée de mouvement commun et celle d’hostilité.'
- source_word: ὄχλος
  choice: foule
  rationale: « Foule » est l’équivalent français moderne le plus naturel et n’ajoute pas la connotation plus forte de « populace ».
- source_word: κατ’ αὐτῶν
  choice: contre Paul et Silas
  rationale: Le sens hostile de κατά est rendu par « contre ». Les référents sont explicités pour éviter l’ambiguïté créée en français par deux groupes possibles désignés par des pronoms.
- source_word: στρατηγοὶ
  choice: magistrats
  rationale: À Philippes, colonie romaine, le terme désigne les autorités civiques. « Magistrats » est clair et exact, tandis que « préteurs » serait plus technique.
- source_word: περιρήξαντες αὐτῶν τὰ ἱμάτια
  choice: leur firent arracher leurs vêtements
  rationale: Le grec décrit les magistrats arrachant ou faisant arracher les vêtements de Paul et Silas avant le châtiment. La tournure causative est naturelle dans ce cadre judiciaire et évite de suggérer que les magistrats déchirent leurs propres vêtements.
- source_word: ἐκέλευον
  choice: donnaient l’ordre
  rationale: L’imparfait français préserve l’aspect imperfectif du grec et présente l’ordre dans le déroulement de la scène.
- source_word: ῥαβδίζειν
  choice: de les battre à coups de bâton
  rationale: Le verbe désigne spécifiquement une bastonnade infligée avec des verges ou des bâtons. Cette formulation est transparente en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les référents Paul et Silas sont explicités afin de lever une ambiguïté pronominale propre au français. « Vêtements » et « battre à coups de bâton » restent accessibles sans atténuer la violence judiciaire de la scène.
