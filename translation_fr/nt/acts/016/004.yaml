  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: fr
  text: À mesure qu’ils traversaient les villes, ils leur transmettaient, pour qu’ils les observent, les décisions[a] prises par les apôtres et les anciens qui étaient à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « décrets ». Le grec désigne ici les décisions officielles arrêtées par les apôtres et les anciens qui étaient à Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ διεπορεύοντο τὰς πόλεις
  choice: À mesure qu’ils traversaient les villes
  rationale: L’imparfait décrit leur déplacement continu de ville en ville, et ὡς δέ introduit naturellement l’action qui se déroule en même temps.
- source_word: παρεδίδοσαν αὐτοῖς
  choice: ils leur transmettaient
  rationale: Le verbe exprime ici la remise ou la transmission de décisions faisant autorité. Le pronom « leur » conserve l’implicite du grec sans préciser artificiellement « aux croyants » ou « aux Églises ».
- source_word: φυλάσσειν
  choice: pour qu’ils les observent
  rationale: Dans ce contexte, φυλάσσω signifie respecter et mettre en pratique les décisions, et non simplement les garder en mémoire.
- source_word: τὰ δόγματα
  choice: les décisions
  rationale: « Décisions » est clair en français moderne et désigne adéquatement les résolutions officielles d’Actes 15, sans les connotations politiques de « décrets » ni le sens doctrinal ultérieur de « dogmes ».
- source_word: τὰ κεκριμένα
  choice: prises
  rationale: Le participe parfait passif indique des décisions déjà arrêtées et toujours valables. En français, « les décisions prises » rend cette idée de manière naturelle et concise.
- source_word: ὑπὸ τῶν ἀποστόλων καὶ πρεσβυτέρων τῶν ἐν Ἱεροσολύμοις
  choice: par les apôtres et les anciens de Jérusalem
  rationale: Cette formulation conserve les titres reconnus dans les Actes et rattache naturellement les deux groupes à Jérusalem.
theological_decisions:
- issue: Autorité des résolutions prises à Jérusalem
  choice: décisions
  alternative: décrets
  rationale: Le terme grec désigne ici les résolutions faisant autorité issues de la réunion relatée en Actes 15. « Décisions » en exprime le caractère officiel sans introduire le sens théologique technique que « dogmes » a acquis plus tard.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les pronoms implicites du grec et évite d’identifier explicitement leurs destinataires au-delà de ce que dit le verset.
