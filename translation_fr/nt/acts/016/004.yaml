  terminology: « Décisions » est un choix fidèle et non anachronique pour δόγματα dans ce contexte. « Anciens » convient pour πρεσβύτεροι. La note lexicale est utile, mais sa formulation peut refléter plus précisément l’attribution explicite des décisions aux responsables à Jérusalem.
