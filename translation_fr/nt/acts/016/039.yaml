  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: fr
  text: Ils vinrent les trouver et les prièrent[a] ; après les avoir fait sortir, ils leur demandèrent de quitter la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les exhortèrent », « les pressèrent » ou « cherchèrent à les apaiser ». Le verbe grec peut aussi signifier « encourager » ou « consoler » selon le contexte ; ici, il évoque vraisemblablement une démarche conciliante des magistrats.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec traduit par « demandèrent » est à l’imparfait et peut évoquer une demande répétée ou prolongée : « ils leur demandaient » ou « ils ne cessaient de leur demander ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Ils vinrent
  rationale: Le participe aoriste introduit l’action des magistrats; une proposition coordonnée rend naturellement la succession en français.
- source_word: παρεκάλεσαν
  choice: leur présenter leurs excuses
  rationale: Dans ce contexte, παρακαλέω exprime une démarche conciliante et déférente après le traitement illégal infligé à Paul et Silas. Cette formulation française rend bien l’idée, sans retenir le sens de « consoler », peu probable ici.
- source_word: αὐτούς
  choice: leur / les
  rationale: Le pronom renvoie à Paul et Silas; les formes françaises varient selon leur fonction syntaxique.
- source_word: ἐξαγαγόντες
  choice: puis les firent sortir
  rationale: Le participe aoriste marque une action qui précède la demande. « Faire sortir » convient au rôle d’autorité des magistrats et reste naturel en français.
- source_word: ἠρώτων
  choice: leur demandèrent
  rationale: L’imparfait grec peut évoquer une demande prolongée ou répétée, mais le passé simple français exprime plus naturellement l’événement narratif; une note signale la nuance aspectuelle.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: de quitter la ville
  rationale: Cette tournure idiomatique restitue clairement l’infinitif exprimant le contenu de la demande.
