revisions:
- from: Le jour du sabbat, nous sommes sortis par la porte de la ville pour aller au bord d’une rivière, où nous pensions trouver un lieu de prière[a]. Après nous être assis, nous avons parlé aux femmes qui s’étaient rassemblées là.
  to: Le jour du sabbat, nous sommes sortis à l’extérieur de la porte, vers une rivière, où nous pensions qu’il y avait un lieu de prière[a]. Puis, une fois assis, nous parlions aux femmes qui s’étaient rassemblées là.
  rationale: La révision rend explicitement le mouvement à l’extérieur de la porte sans ajouter « ville », remplace l’ajout interprétatif « trouver » par une construction existentielle correspondant à εἶναι, et rétablit l’aspect imperfectif de ἐλαλοῦμεν. La note maintient l’alternative lexicale réelle de προσευχή.
