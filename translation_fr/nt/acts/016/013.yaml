source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: fr
  text: Le jour du sabbat, nous sommes sortis à l’extérieur de la porte, vers une rivière, où nous pensions qu’il y avait un lieu de prière[a]. Puis, une fois assis, nous parlions aux femmes qui s’étaient rassemblées là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « où nous pensions qu’on priait ». Le mot grec peut désigner soit la prière elle-même, soit un lieu réservé à la prière; le contexte favorise ici « un lieu de prière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Le jour du sabbat
  rationale: Cette expression grecque désigne idiomatiquement le jour du sabbat. La formulation choisie est naturelle en français moderne.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: nous sommes sortis par la porte de la ville
  rationale: La tournure rend naturellement le mouvement vers l’extérieur au-delà de la porte. « De la ville » explicite sobrement ce que la mention de la porte implique dans ce contexte.
- source_word: παρὰ ποταμόν
  choice: pour aller au bord d’une rivière
  rationale: παρά avec l’accusatif indique ici le déplacement vers un endroit situé le long d’un cours d’eau. « Au bord d’une rivière » est idiomatique et conserve le sens spatial.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: où nous pensions trouver un lieu de prière
  rationale: νομίζω exprime ici une opinion ou une supposition. προσευχή peut désigner soit la prière, soit un endroit consacré à la prière; le contexte géographique favorise ce second sens, tout en justifiant une note signalant l’ambiguïté.
- source_word: καὶ καθίσαντες
  choice: Après nous être assis
  rationale: Le participe aoriste présente l’action de s’asseoir comme antérieure à celle de parler. Cette formulation exprime clairement la succession en français.
- source_word: ἐλαλοῦμεν
  choice: nous avons parlé
  rationale: Le passé composé convient au récit français courant. Le contexte permet de comprendre qu’il s’agit d’une prise de parole ou d’un échange d’une certaine durée, même si l’aspect imperfectif grec n’a pas d’équivalent parfaitement naturel ici.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: aux femmes qui s’étaient rassemblées là
  rationale: Le participe aoriste indique que les femmes s’étaient déjà réunies. « Là » reprend naturellement le lieu immédiatement mentionné.
theological_decisions:
- issue: Sens de προσευχή dans ce cadre
  choice: lieu de prière
  alternative: prière; synagogue
  rationale: Le récit désigne apparemment un endroit précis au bord de l’eau où des personnes se réunissaient. Dans l’usage juif hellénistique, προσευχή peut nommer un lieu consacré à la prière. « Lieu de prière » conserve ce sens probable sans introduire « synagogue », terme institutionnel que le grec n’emploie pas.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase suit le mouvement du récit sans calquer lourdement la syntaxe grecque. Le terme « sabbat » est conservé, et l’ambiguïté réelle de προσευχή est signalée en note.
