id: ACT.16.7
reference: Acts 16:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: fr
  text: Mais lorsqu’ils arrivèrent aux abords de la Mysie[a], ils essayaient de se rendre en Bithynie, et l’Esprit de Jésus ne le leur permit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de la Mysie » ou « le long de la Mysie ». L’expression grecque désigne probablement l’arrivée dans la zone frontalière de la Mysie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: lorsqu’ils arrivèrent
  rationale: Le participe aoriste a ici une valeur temporelle; cette formulation naturelle marque la succession des déplacements.
- source_word: δὲ
  choice: Mais
  rationale: La particule signale une légère transition contrastive avec l’itinéraire raconté au verset précédent.
- source_word: κατὰ τὴν Μυσίαν
  choice: aux abords de la Mysie
  rationale: Dans cette indication géographique, κατά avec l’accusatif peut situer les voyageurs près de la Mysie ou le long de sa frontière. «Aux abords» restitue cette nuance sans affirmer nettement qu’ils sont entrés dans la région.
- source_word: ἐπείραζον
  choice: ils essayaient
  rationale: L’imparfait présente une tentative en cours plutôt qu’une action ponctuelle achevée.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: se rendre en Bithynie
  rationale: Cette expression française courante traduit le déplacement projeté vers cette région; en français, le nom régional appelle naturellement «en».
- source_word: οὐκ εἴασεν αὐτοὺς
  choice: ne le leur permit pas
  rationale: ἐάω signifie permettre ou laisser faire. Le pronom «le» reprend le projet de se rendre en Bithynie, et «leur» représente le groupe de voyageurs.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: l’Esprit de Jésus
  rationale: La traduction conserve l’expression christologique inhabituelle et explicite du grec, sans la remplacer par «le Saint-Esprit».
theological_decisions:
- issue: Traduction de l’expression christologique τὸ πνεῦμα Ἰησοῦ
  choice: l’Esprit de Jésus
  alternative: le Saint-Esprit; l’Esprit
  rationale: Le texte grec nomme expressément Jésus. Conserver ce complément respecte la formulation propre du verset et son ouverture théologique sans l’harmoniser avec une expression plus habituelle.
translation_notes:
  register: Français international moderne, digne et accessible. «Aux abords de» maintient dans le texte la nuance géographique incertaine; la note présente les principales autres possibilités. La coordination «et» préserve le καί grec sans renforcer artificiellement l’opposition.
