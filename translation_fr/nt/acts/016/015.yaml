revisions:
- from: 'Après qu’elle eut été baptisée avec les gens de sa maison, elle nous adressa cette invitation : « Si vous estimez que je suis fidèle au Seigneur[a], entrez dans ma maison et restez-y. » Et elle insista pour nous faire accepter.'
  to: 'Quand elle et sa maisonnée eurent été baptisées, elle nous pressa en disant : « Si vous avez jugé que je suis fidèle au Seigneur[a], entrez dans ma maison et restez-y. » Elle insista tant qu’elle finit par nous convaincre.'
  rationale: La révision rend explicitement que Lydie et sa maisonnée sont toutes deux concernées par le baptême, sans tirer d’inférence sur la composition ou le statut de foi de la maisonnée. Elle restitue plus directement l’invitation pressante et son issue, et améliore la formulation française de la note sans résoudre l’ambiguïté lexicale de πιστή.
