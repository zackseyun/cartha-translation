review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu, notamment la distinction entre la maisonnée et la maison. Toutefois, « avec les gens de sa maison » peut laisser entendre que Lydie seule est le sujet réel du baptême et que les autres ne font que l’accompagner. Le grec désigne Lydie et sa maisonnée comme baptisées. La finale « insista pour nous faire accepter » est moins fidèle et peu idiomatique : elle exprime plutôt une insistance qui finit par emporter leur consentement.'
  naturalness: Le français est globalement clair et de registre approprié. « Elle nous pressa en disant » est plus direct et plus proche de παρεκάλεσεν λέγουσα que « elle nous adressa cette invitation ». « Elle insista tant qu’elle finit par nous convaincre » rend naturellement la force de παρεβιάσατο.
  terminology: « Maisonnée » convient au groupe domestique, tandis que « maison » convient au logement. « Fidèle au Seigneur » préserve utilement l’ambiguïté de πιστή. La note doit cependant employer une formulation française plus naturelle pour l’alternative de sens.
  issues:
  - severity: medium
    issue: Formulation du baptême de la maisonnée
    rationale: « Après qu’elle eut été baptisée avec les gens de sa maison » peut se comprendre comme le baptême de Lydie accompagné de personnes de sa maison, plutôt que comme l’affirmation que Lydie et sa maisonnée ont été baptisées. « Elle et sa maisonnée eurent été baptisées » explicite correctement le référent collectif sans préciser sa composition.
  - severity: medium
    issue: Rendu de παρεβιάσατο
    rationale: « Elle insista pour nous faire accepter » est maladroit et ne dit pas clairement qu’elle obtint finalement leur accord. Le verbe grec évoque une insistance pressante qui l’emporte, sans imposer l’idée d’une contrainte physique.
  - severity: low
    issue: Note alternative sur πιστή
    rationale: « Que je crois au Seigneur » est moins naturel et peut être compris comme une simple assertion doctrinale. « Que je suis croyante au Seigneur » rend plus directement l’alternative lexicale, tout en laissant la traduction principale conserver l’ambiguïté.
  revised_text: 'Quand elle et sa maisonnée eurent été baptisées, elle nous pressa en disant : « Si vous avez jugé que je suis fidèle au Seigneur[a], entrez dans ma maison et restez-y. » Elle insista tant qu’elle finit par nous convaincre.'
