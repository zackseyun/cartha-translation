source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: fr
  text: 'Quand elle et sa maisonnée eurent été baptisées, elle nous pressa en disant : « Si vous avez jugé que je suis fidèle au Seigneur[a], entrez dans ma maison et restez-y. » Elle insista tant qu’elle finit par nous convaincre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que je suis croyante au Seigneur ». L’adjectif grec peut signifier « fidèle », « digne de confiance » ou « croyante ».'
    reason: Alternative lexicale permettant de conserver l’éventail sémantique de πιστή.
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: Après qu’elle eut été baptisée avec les gens de sa maison
  rationale: La tournure temporelle marque la succession des événements. Le singulier ἐβαπτίσθη a d’abord pour sujet la femme, tandis que καὶ ὁ οἶκος αὐτῆς y associe sa maisonnée. « Les gens de sa maison » exprime ici le groupe domestique, et non le bâtiment, sans préciser sa composition.
- source_word: παρεκάλεσεν λέγουσα
  choice: elle nous adressa cette invitation
  rationale: Dans ce contexte d’hospitalité, παρακαλέω désigne une invitation pressante. Cette formulation française prépare naturellement les paroles directes, tandis que la forte insistance est explicitée par la dernière proposition.
- source_word: Εἰ κεκρίκατέ με
  choice: Si vous estimez que je suis
  rationale: Le parfait κεκρίκατε exprime une appréciation établie. Le présent « estimez » est idiomatique en français et conserve l’idée du jugement porté par les interlocuteurs.
- source_word: πιστὴν τῷ κυρίῳ
  choice: fidèle au Seigneur
  rationale: πιστή peut désigner une personne fidèle, digne de confiance ou croyante. « Fidèle au Seigneur » conserve au mieux la portée relationnelle et l’ambiguïté lexicale du grec.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: entrez dans ma maison et restez-y
  rationale: Le participe εἰσελθόντες accompagne l’impératif μένετε et se rend naturellement par deux impératifs coordonnés. Ici, οἶκος désigne bien l’habitation physique.
- source_word: καὶ παρεβιάσατο ἡμᾶς
  choice: Et elle insista pour nous faire accepter
  rationale: παραβιάζομαι évoque une vive insistance qui finit par emporter l’adhésion, sans nécessairement impliquer une contrainte coercitive. La formulation est naturelle en français moderne.
theological_decisions:
- issue: Portée de « les gens de sa maison » dans le récit du baptême
  choice: Traduire directement l’association de la femme et de sa maisonnée au baptême, sans en préciser la composition.
  alternative: Formuler le verset de manière à impliquer soit la présence de nourrissons, soit uniquement des croyants professants.
  rationale: Le texte ne donne ni l’âge ni le statut de foi de chaque membre de la maisonnée et ne tranche pas les débats sacramentels ultérieurs.
- issue: Sens de πιστή dans l’appréciation demandée par Lydie
  choice: fidèle au Seigneur
  alternative: croyante au Seigneur / digne de confiance devant le Seigneur
  rationale: Le grec permet des nuances de foi, de loyauté et de fiabilité. Le choix principal préserve cette tension, tandis qu’une note signale l’autre lecture importante.
translation_notes:
  register: Français international moderne, naturel et digne. La distinction contextuelle entre la maisonnée (ὁ οἶκος αὐτῆς) et l’habitation (τὸν οἶκόν μου) est rendue explicitement. Le passé antérieur donne une narration soutenue mais courante dans un récit biblique.
