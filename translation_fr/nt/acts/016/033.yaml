id: ACT.16.33
reference: Acts 16:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ ⸀πάντες παραχρῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/033.yaml
  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: fr
  text: Il les prit avec lui à cette heure de la nuit et lava leurs blessures. Aussitôt, il fut baptisé, lui et tous ceux de sa maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute sa maisonnée ». L’expression grecque désigne tous ceux qui appartenaient à sa maison, sans préciser leur âge ni leur lien exact avec lui.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: Il les prit avec lui
  rationale: Le participe aoriste introduit l’action qui précède le lavage. « Prit avec lui » reste naturel sans préciser un déplacement ou un lieu que le grec ne donne pas.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: à cette heure de la nuit
  rationale: Cette tournure française rend la précision temporelle et souligne que l’action se produit tard dans la nuit, sans délai.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: lava leurs blessures
  rationale: Dans cette construction, le lavage concerne les blessures causées par les coups. La formulation idiomatique française exprime clairement le soin apporté sans reproduire maladroitement la préposition grecque.
- source_word: ἐβαπτίσθη
  choice: fut baptisé
  rationale: Le passif indique qu’il reçut le baptême. Ce terme usuel ne précise pas le mode du baptême.
- source_word: οἱ αὐτοῦ πάντες
  choice: tous ceux de sa maison
  rationale: L’expression désigne l’ensemble des personnes appartenant à sa maisonnée ou à sa sphère domestique, sans se limiter nécessairement à la famille nucléaire.
- source_word: παραχρῆμα
  choice: Aussitôt
  rationale: L’adverbe marque fortement l’immédiateté. Placé en tête de phrase, « Aussitôt » conserve cette force narrative et s’applique naturellement au baptême mentionné ensuite.
theological_decisions:
- issue: Portée de οἱ αὐτοῦ πάντες parmi les personnes baptisées
  choice: « tous ceux de sa maison », sans précision d’âge, de profession de foi individuelle ni de mode baptismal
  alternative: « toute sa famille » ou « tous les siens »
  rationale: Le verset affirme le baptême du geôlier et de toutes les personnes de sa maisonnée, mais ne tranche pas à lui seul les débats ultérieurs sur le baptême des enfants, les conditions personnelles du baptême ou son mode. La formulation conserve la portée domestique large du grec.
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases rendent lisibles la succession des soins puis du baptême. « À cette heure de la nuit » garde la vivacité temporelle du grec, tandis que « tous ceux de sa maison » préserve l’étendue du foyer sans tirer de conclusion confessionnelle.
