id: ACT.16.30
reference: Acts 16:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: fr
  text: 'Il les conduisit dehors, puis dit : « Messieurs[a], que dois-je faire pour être sauvé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Messieurs » traduit ici le grec kyrioi comme une formule de respect adressée à Paul et Silas, et non comme le titre divin « Seigneurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: Il les conduisit dehors, puis
  rationale: Le participe aoriste indique une action antérieure à la prise de parole. Cette formulation française naturelle conserve clairement la succession des actions ainsi que le mouvement vers l’extérieur.
- source_word: ἔφη
  choice: dit
  rationale: Dans ce récit, l’imparfait de φημί sert simplement à introduire les paroles du geôlier. Le passé simple convient au registre narratif français.
- source_word: Κύριοι
  choice: Messieurs
  rationale: Le vocatif pluriel de κύριος est ici une formule de respect adressée à Paul et Silas, et non le titre divin « Seigneur ».
- source_word: τί με δεῖ ποιεῖν
  choice: que dois-je faire
  rationale: δεῖ exprime la nécessité, tandis que ποιεῖν en précise l’action. La tournure retenue est concise, naturelle et fidèle.
- source_word: ἵνα σωθῶ
  choice: pour être sauvé
  rationale: Cette formulation rend le but exprimé par ἵνα et conserve la voix passive de σωθῶ, sans alourdir la question en français.
theological_decisions:
- issue: Sens de σωθῶ dans la question du geôlier
  choice: être sauvé
  alternative: être délivré
  rationale: Dans les Actes, σώζω peut désigner aussi bien une délivrance qu’un salut au sens plus large. La suite immédiate, notamment le verset 31, favorise ici « être sauvé », tout en laissant intacte l’ampleur sémantique du terme et sans imposer un système doctrinal particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; la question directe reste naturelle à l’oral.
