  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: fr
  text: Mais quand ses maîtres virent que leur espoir de profit avait disparu[a], ils saisirent Paul et Silas et les traînèrent sur la place publique, devant les autorités[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur espoir de profit était sorti ». Cette expression peut faire écho à la sortie de l’esprit mentionnée au verset précédent. On peut aussi traduire : « leur espoir de gain avait disparu ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne ici les autorités civiles de manière générale ; le verset suivant emploie un titre plus précis, souvent traduit par « magistrats ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: ses maîtres
  rationale: Dans ce contexte, κύριοι désigne ceux qui exercent sur la jeune femme une domination sociale et économique. « Maîtres » exprime naturellement ce rapport sans réduire le terme à un simple titre honorifique.
- source_word: ἐξῆλθεν
  choice: avait disparu
  rationale: Le plus-que-parfait marque que la perte de leur revenu était déjà devenue évidente. « Avait disparu » est naturel en français; une note conserve l’image grecque de la sortie, qui fait écho au départ de l’esprit.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: leur espoir de profit
  rationale: ἐλπίς signifie bien « espoir », tandis que ἐργασία désigne ici le revenu ou le bénéfice tiré de l’activité de divination. « Profit » rend clairement la motivation économique.
- source_word: ἐπιλαβόμενοι
  choice: ils saisirent
  rationale: Le participe exprime une prise physique hostile et énergique. La proposition coordonnée est idiomatique en français.
- source_word: εἵλκυσαν
  choice: les traînèrent
  rationale: Le verbe évoque le fait de tirer quelqu’un de force; « traînèrent » restitue clairement la violence de l’action.
- source_word: ἀγορὰν
  choice: la place publique
  rationale: L’ἀγορά était à la fois un marché et le centre de la vie civique. « Place publique » convient particulièrement ici puisque la scène est judiciaire.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: devant les autorités
  rationale: ἄρχοντες est un terme général désignant les dirigeants civils. « Autorités » préserve cette généralité et évite de le confondre avec le titre plus précis employé au verset suivant.
