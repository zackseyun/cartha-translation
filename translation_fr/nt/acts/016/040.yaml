id: ACT.16.40
reference: Acts 16:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: fr
  text: Après être sortis de la prison, ils entrèrent chez Lydie. Ils virent les frères[a], les encouragèrent, puis partirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs ». Le mot grec est au masculin pluriel, mais il peut désigner un groupe mixte de croyants.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Après être sortis de la prison
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. Cette formulation temporelle conserve la succession des événements ainsi que le caractère déterminé de la prison.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: ils entrèrent chez Lydie
  rationale: Avec une personne comme complément, l’expression indique qu’ils sont entrés au lieu où se trouvait Lydie, vraisemblablement chez elle. « Chez Lydie » rend naturellement l’idiome sans ajouter explicitement le mot « maison ».
- source_word: ἰδόντες
  choice: Ils virent
  rationale: Le participe aoriste désigne une action accomplie avant l’encouragement. Deux verbes coordonnés donnent en français un récit clair tout en maintenant l’ordre des actions.
- source_word: παρεκάλεσαν
  choice: les encouragèrent
  rationale: Le verbe peut signifier encourager, exhorter ou consoler. Dans ce contexte, « encourager » conserve sa portée pastorale assez large sans imposer une nuance plus étroite.
- source_word: τοὺς ἀδελφούς
  choice: les frères
  rationale: La traduction conserve la forme masculine plurielle du grec. Une note signale que, dans l’usage chrétien du terme, un groupe mixte de croyants peut être visé.
- source_word: ἐξῆλθαν
  choice: puis partirent
  rationale: Le verbe marque leur départ. « Partirent » évite de répéter « sortirent » et n’explicite pas un lieu de départ que le grec ne nomme pas.
theological_decisions:
- issue: Portée de ἀδελφοί dans un rassemblement chrétien probablement mixte
  choice: les frères
  alternative: les frères et sœurs ; les croyants
  rationale: Le texte principal reflète la forme masculine du grec, tandis que la note préserve la possibilité réelle que le terme englobe des croyantes, notamment dans le cadre lié à Lydie.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Chez Lydie » est idiomatique et reste proche de la construction grecque.
