  source_fidelity: Le texte rend fidèlement Κατήντησεν δὲ καὶ par « Il arriva aussi », conserve les deux destinations, marque l’effet discursif de καὶ ἰδού par « Et voici que », et présente Timothée comme un disciple présent sur place. « Fils d’une femme juive croyante » reflète correctement les deux qualificatifs de γυναικός et le sens contextuellement le plus probable de πιστῆς. La proposition « tandis que son père était grec » explicite de façon claire l’ellipse de πατρὸς δὲ Ἕλληνος tout en maintenant le contraste. Aucun élément sémantique déterminant n’est ajouté ou omis.
  naturalness: Le français est moderne, fluide et de registre narratif approprié. « Et voici que » et « il y avait là » sont naturels dans une narration biblique contemporaine sans être inutilement archaïsants. Les toponymes « Derbé » et « Lystres » ainsi que « Timothée » sont les formes françaises usuelles.
  terminology: « Disciple », « croyante », « juive » et « grec » sont précis et cohérents avec le contexte des Actes. La note associée à « croyante » conserve de manière adéquate l’alternative lexicale « fidèle », sans imposer une lecture confessionnelle. L’ancre [a] est placée sur le terme concerné, contrairement au décalage des ancres dans la piste d’audit anglaise.
