id: ACT.16.1
reference: Acts 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: fr
  text: Il arriva aussi à Derbé et à Lystres. Et voici qu’il y avait là un disciple nommé Timothée, fils d’une femme juive croyante[a], tandis que son père était grec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidèle ». L’adjectif grec peut signifier « croyante » ou « fidèle »; dans les Actes, le sens « croyante » est ici le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: Il arriva aussi
  rationale: Καταντάω exprime ici l’arrivée dans un lieu, et δὲ καὶ marque la continuation avec une nuance additive. « Il arriva aussi » rend naturellement les deux éléments.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: à Derbé et à Lystres
  rationale: Dans ce récit de voyage, εἰς devant les noms de lieux se rend idiomatiquement par « à ». Les formes françaises traditionnelles et courantes des toponymes sont conservées.
- source_word: καὶ ἰδοὺ
  choice: Et voici que
  rationale: Ἰδού attire expressément l’attention sur l’apparition de Timothée dans le récit. « Et voici que » en conserve le relief narratif dans un français digne et actuel.
- source_word: μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος
  choice: il y avait là un disciple nommé Timothée
  rationale: La tournure existentielle « il y avait là » rend ἦν ἐκεῖ sans lourdeur, tandis que « un disciple » suffit naturellement à rendre l’indéfini τις en français.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: fils d’une femme juive croyante
  rationale: Πιστή désigne très probablement ici une personne qui croit, selon l’usage de Luc dans les Actes. « Croyante » exprime ce sens tout en laissant en note l’autre valeur lexicale possible.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: tandis que son père était grec
  rationale: La proposition développée rend clairement l’expression génitive elliptique et conserve le contraste marqué par δέ. Ἕλλην est traduit directement par « grec », plutôt que par le terme plus large « non-Juif ».
theological_decisions:
- issue: Sens de πιστῆς appliqué à la mère de Timothée
  choice: croyante
  alternative: fidèle
  rationale: Dans le contexte chrétien des Actes, πιστός désigne le plus naturellement une personne qui croit. Cependant, l’adjectif peut aussi qualifier quelqu’un de fidèle; cette ambiguïté lexicale réelle est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » garde la vivacité du marqueur grec sans archaïsme excessif. La dernière proposition est légèrement explicitée pour éviter en français la construction heurtée « fils d’une femme…, mais d’un père… ».
