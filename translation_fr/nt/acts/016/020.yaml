id: ACT.16.20
reference: Acts 16:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: fr
  text: 'Après les avoir amenés devant les magistrats[a], ils dirent : « Ces hommes sèment le trouble dans notre ville, eux qui sont Juifs[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préteurs », titre employé pour les magistrats romains d’une colonie comme Philippes.
    reason: cultural_note
  - marker: b
    text: Ou « Judéens ». Le terme grec peut désigner soit les Juifs en général, soit les habitants de la Judée ; ici, « Juifs » correspond mieux au caractère ethnique et religieux de l’accusation.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: Après les avoir amenés
  rationale: Le participe aoriste exprime une action antérieure au verbe principal ; cette tournure est naturelle en français et conserve cet enchaînement.
- source_word: στρατηγοῖς
  choice: magistrats
  rationale: À Philippes, colonie romaine, le terme désigne les principaux responsables civils de la ville. « Magistrats » est clair, exact et moins technique que « préteurs ».
- source_word: ἐκταράσσουσιν
  choice: sèment le trouble
  rationale: Le verbe évoque une agitation sérieuse ou une mise en désordre. Cette expression idiomatique conserve la force et le présent de l'accusation.
- source_word: ἡμῶν τὴν πόλιν
  choice: notre ville
  rationale: Le possessif rend naturellement la revendication d'appartenance civique mise en avant par les accusateurs.
- source_word: Ἰουδαῖοι
  choice: juifs
  rationale: Dans ce contexte de diaspora, le terme désigne vraisemblablement l'identité ethnique et religieuse de Paul et Silas plutôt que leur seule origine géographique.
- source_word: ὑπάρχοντες
  choice: eux qui sont
  rationale: Cette formulation maintient le lien apposé entre l'accusation et l'identité juive sans préciser à l'excès si celle-ci constitue une simple circonstance ou le motif invoqué.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Ces hommes
  rationale: Le masculin pluriel renvoie précisément à Paul et Silas ; « Ces hommes » est naturel et fidèle.
theological_decisions:
- issue: Rendu de Ἰουδαῖοι dans une accusation hostile à caractère ethnique et religieux
  choice: juifs
  alternative: Judéens
  rationale: « Juifs » correspond le mieux à l'accusation identitaire dans le cadre romain de Philippes. Le texte rapporte les paroles hostiles des accusateurs ; il ne porte pas un jugement du narrateur sur l'ensemble des Juifs.
- issue: Rapport logique de ὑπάρχοντες avec l'accusation
  choice: eux qui sont juifs
  alternative: parce qu'ils sont juifs
  rationale: Le participe peut suggérer que leur identité sert de fondement à l'accusation, mais il n'exprime pas explicitement une relation causale. Le rendu choisi préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « eux qui sont juifs » conserve l'ordre rhétorique du grec et rend perceptible le caractère discriminatoire de l'accusation sans ajouter une causalité explicite.
