source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: fr
  text: 'Elle suivait sans cesse Paul et nous, tout en criant : « Ces hommes sont des esclaves du Dieu Très-Haut ! Ils vous annoncent un chemin de salut[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le chemin du salut ». En grec, le nom traduit par « chemin » est sans article ; selon la manière de comprendre l’expression, elle peut être rendue avec un article indéfini ou défini en français.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: ne cessait de suivre
  rationale: Le participe présent associé à l’imparfait ἔκραζεν présente une action qui se prolonge ou se répète. « Ne cessait de suivre » rend naturellement cet aspect duratif sans ajouter l’idée non certaine d’une proximité physique.
- source_word: ἔκραζεν λέγουσα
  choice: en criant
  rationale: L’imparfait exprime ici des cris répétés ou continus. En français, « en criant » communique à la fois le volume de la voix et l’introduction des paroles, sans conserver le pléonasme peu naturel « criait en disant ».
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme désigne des personnes appartenant à un maître. Ici, il présente Paul et ses compagnons comme appartenant à Dieu; « esclaves » conserve plus clairement ce rapport que le terme plus général « serviteurs ».
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: du Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve le titre divin superlatif ὕψιστος.
- source_word: καταγγέλλουσιν
  choice: annoncent
  rationale: Le verbe désigne une annonce publique. « Annoncent » est idiomatique et garde la valeur du présent.
- source_word: ὑμῖν
  choice: vous annoncent
  rationale: Le pronom au datif indique les destinataires de l’annonce et se rend naturellement par le pronom français « vous » placé avant le verbe.
- source_word: ὁδὸν σωτηρίας
  choice: un chemin de salut
  rationale: Le nom ὁδόν est sans article. « Un chemin de salut » conserve une lecture possible de cette forme tout en évitant d’imposer une détermination que le grec n’explicite pas; une note signale la lecture définie également possible.
theological_decisions:
- issue: Détermination de ὁδὸν σωτηρίας
  choice: un chemin de salut
  alternative: le chemin du salut
  rationale: L’absence d’article en grec permet ici une formulation indéfinie, mais ne l’impose pas nécessairement. Le texte principal préserve cette indétermination formelle, tandis que la note donne la lecture définie, sans trancher par avance la portée théologique de l’expression.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « ne cessait de… en criant » restitue la continuité de la scène sans lourdeur. L’exclamation après « Dieu Très-Haut » rend la force du cri tout en distinguant nettement l’affirmation suivante.
