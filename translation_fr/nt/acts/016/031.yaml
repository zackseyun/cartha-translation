  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: fr
  text: 'Ils répondirent : « Crois au Seigneur Jésus[a], et tu seras sauvé, toi et ta maisonnée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mets ta foi dans le Seigneur Jésus. »'
    reason: lexical_alternative
  - marker: b
    text: La « maisonnée » désigne ici les personnes de sa maison, et non le bâtiment lui-même.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Dans ce dialogue, cette formulation rend naturellement la légère articulation de δέ sans lui donner une valeur fortement adversative.
- source_word: Πίστευσον
  choice: Crois
  rationale: L’impératif aoriste singulier appelle le geôlier à une réponse décisive. « Crois » est direct, naturel et conserve le vocabulaire biblique de la foi sans ajout interprétatif.
- source_word: ἐπὶ τὸν
  choice: au
  rationale: Avec πιστεύω, ἐπί suivi de l’accusatif désigne celui vers qui la foi se porte. En français, « croire au Seigneur Jésus » est idiomatique et préserve cette orientation personnelle.
- source_word: κύριον Ἰησοῦν
  choice: Seigneur Jésus
  rationale: « Seigneur » conserve à la fois la valeur de titre honorifique et la portée christologique de κύριος; le nom Ἰησοῦς est rendu selon l’usage français établi.
- source_word: σωθήσῃ
  choice: tu seras sauvé
  rationale: Le futur passif de σῴζω est rendu directement. Dans ce contexte d’annonce de l’Évangile, « sauvé » préserve la portée du terme sans la réduire à un simple secours matériel.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: toi et ta maisonnée
  rationale: La reprise de « toi » restitue l’insistance de σὺ. « Maisonnée » désigne les personnes rattachées à la maison du geôlier plutôt que le bâtiment, sans limiter indûment le groupe à la seule famille biologique.
theological_decisions:
- issue: Portée de la promesse concernant le geôlier et sa maisonnée
  choice: Conserver l’inclusion explicite de la maisonnée sans préciser par quel mécanisme chacun est sauvé.
  alternative: Faire entendre soit que toute la maisonnée serait automatiquement sauvée par la foi du seul geôlier, soit que la promesse ne concernerait en réalité que le geôlier individuellement.
  rationale: Le grec inclut clairement le geôlier et sa maisonnée dans la déclaration, mais ce verset pris isolément ne tranche pas les débats sur la foi, le baptême et l’inclusion familiale. La formulation maintient cette tension sans importer une position confessionnelle.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier correspond aux formes grecques adressées personnellement au geôlier. « Maisonnée » est retenu plutôt que « famille » afin de conserver la portée sociale plus large de οἶκος.
