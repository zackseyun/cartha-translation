review_pass:
  verdict: approve
  source_fidelity: 'Le texte rend avec fidélité la structure et les éléments essentiels du grec : l’adresse au singulier, l’impératif « Crois », l’objet personnel de la foi (« au Seigneur Jésus »), le futur passif « tu seras sauvé », ainsi que l’inclusion explicite et emphatique de « toi et ta maisonnée ». « Ils répondirent » est contextuellement juste dans la réplique au geôlier et ne modifie pas le sens de εἶπαν.'
  naturalness: Le français est clair, moderne et d’un registre biblique sobre. « Crois au Seigneur Jésus » est idiomatique. « Maisonnée » est un terme précis et encore intelligible dans ce registre ; il évite de réduire οἶκος à la famille nucléaire ou au bâtiment.
  terminology: « Seigneur Jésus » préserve la valeur de κύριος dans ce contexte christologique. « Sauvé » est le rendu français usuel et approprié de σωθήσῃ sans restreindre indûment le salut à une délivrance matérielle. La note sur « maisonnée » aide utilement le lecteur sans imposer une lecture théologique concernant le mode de salut des membres du foyer.
