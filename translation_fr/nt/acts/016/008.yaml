  yaml_path: translation/nt/acts/016/008.yaml
  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: fr
  text: Alors, après avoir passé la Mysie[a], ils descendirent à Troas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir traversé la Mysie » ou « en passant à côté de la Mysie ». Le participe grec peut recevoir plusieurs formulations proches ; il indique qu’ils poursuivirent leur route vers Troas plutôt que de s’arrêter en Mysie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: passèrent par
  rationale: Le participe aoriste de παρέρχομαι, construit ici avec l’accusatif, décrit leur déplacement au-delà de la Mysie, sans qu’ils s’y arrêtent. « Passèrent par » est naturel en français et laisse ouverte la question de savoir s’ils traversèrent la région ou la longèrent.
- source_word: δὲ
  choice: donc
  rationale: δέ est un connecteur narratif léger. « Donc » relie naturellement ce déplacement aux empêchements rapportés au verset précédent, sans lui donner une valeur fortement adversative.
- source_word: τὴν Μυσίαν
  choice: la Mysie
  rationale: Nom français traditionnel de cette région, avec l’article requis en français.
- source_word: κατέβησαν
  choice: descendirent
  rationale: Le verbe καταβαίνω exprime un mouvement vers le bas, sans préciser s’il s’agit surtout de l’altitude ou de la direction vers la côte. « Descendirent » conserve cette indication.
- source_word: εἰς Τρῳάδα
  choice: à Troas
  rationale: Avec un nom de ville indiquant la destination, « à » est la tournure française naturelle pour rendre εἰς.
