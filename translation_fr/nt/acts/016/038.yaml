id: ACT.16.38
reference: Acts 16:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: fr
  text: Les porteurs de verges[a] rapportèrent ces paroles aux magistrats[b]. Ceux-ci eurent peur en apprenant qu’ils étaient Romains[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « porteurs de verges » étaient les auxiliaires des magistrats romains, traditionnellement appelés « licteurs ».
    reason: cultural_note
  - marker: b
    text: Le terme traduit par « magistrats » désigne les principaux responsables civils de Philippes.
    reason: cultural_note
  - marker: c
    text: Ou « citoyens romains ». Le grec dit « Romains », mais, dans ce contexte juridique, il est question des droits attachés à la citoyenneté romaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Ce verbe désigne ici la transmission officielle d’un message; « rapportèrent » convient au cadre administratif et au récit au passé.
- source_word: στρατηγοῖς
  choice: magistrats
  rationale: Dans la colonie romaine de Philippes, le terme désigne les principaux responsables civils. « Magistrats » est précis tout en restant accessible.
- source_word: ῥαβδοῦχοι
  choice: porteurs de verges
  rationale: Ce rendu conserve l’image concrète du grec et désigne les auxiliaires des magistrats qui portaient les verges symbolisant leur autorité.
- source_word: τὰ ῥήματα ταῦτα
  choice: ces paroles
  rationale: Traduction directe qui renvoie au message formulé au verset précédent.
- source_word: ἐφοβήθησαν
  choice: eurent peur
  rationale: Rend simplement la réaction exprimée par l’aoriste, sans en exagérer l’intensité.
- source_word: ἀκούσαντες
  choice: en apprenant
  rationale: 'Dans ce contexte, ils ne font pas qu’entendre des sons: ils prennent connaissance du statut de Paul et Silas. Cette formulation française exprime naturellement la relation temporelle et circonstancielle.'
- source_word: Ῥωμαῖοί
  choice: Romains
  rationale: Le grec dit littéralement « Romains ». Le contexte juridique implique la citoyenneté romaine, mais le texte principal préserve la formulation grecque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour éviter une coordination lourde; « Ceux-ci » lève clairement l’ambiguïté du sujet de la peur. Le rendu conserve les termes concrets et la formulation juridiquement significative du grec, avec des notes culturelles brèves.
