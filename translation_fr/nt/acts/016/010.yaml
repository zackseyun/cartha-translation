id: ACT.16.10
reference: Acts 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: fr
  text: Après qu’il a vu la vision, nous avons aussitôt cherché à partir pour la Macédoine[a], concluant[b] que Dieu nous avait appelés à leur annoncer la bonne nouvelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sortir pour entrer en Macédoine »; autre traduction possible : « nous rendre en Macédoine ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « déduisant » ou « raisonnant »; le terme évoque une conclusion tirée de la vision.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « leur annoncer l’Évangile » ou « les évangéliser ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Après que
  rationale: Introduit avec naturel la succession temporelle des événements, sans donner à la conjonction une force excessive.
- source_word: τὸ ὅραμα
  choice: la vision
  rationale: Équivalent français courant et précis pour une expérience visuelle révélatrice.
- source_word: εἶδεν
  choice: il eut vu
  rationale: Le passé antérieur marque clairement que la vision précède la démarche du groupe, dans un registre narratif digne.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Rend directement l’idée de promptitude.
- source_word: ἐζητήσαμεν
  choice: nous avons cherché
  rationale: Conserve la valeur d’effort ou de démarche intentionnelle de ζητέω sans affirmer qu’une tentative aurait échoué.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: à partir pour la Macédoine
  rationale: Expression française naturelle de déplacement vers une destination; le sens littéral de sortie est signalé en note.
- source_word: συμβιβάζοντες
  choice: ayant conclu
  rationale: Exprime le raisonnement par lequel les narrateurs tirent de la vision une conclusion, tout en conservant la relation participiale.
- source_word: προσκέκληται
  choice: avait appelés
  rationale: Préserve l’initiative divine et la force d’appel ou de convocation du parfait grec, avec une antériorité naturelle dans le récit français.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Rendu direct du sujet défini, sans ajout interprétatif.
- source_word: εὐαγγελίσασθαι
  choice: annoncer la bonne nouvelle
  rationale: Rend le contenu verbal de façon accessible et actuelle, sans recourir à un terme ecclésiastique moins transparent.
- source_word: αὐτούς
  choice: leur
  rationale: Le pronom renvoie naturellement aux habitants de la Macédoine, destinataires de l’annonce.
theological_decisions:
- issue: Passage soudain à la première personne du pluriel
  choice: nous avons aussitôt cherché
  alternative: Une tournure impersonnelle qui effacerait le « nous »
  rationale: Le grec emploie explicitement la première personne du pluriel. La traduction conserve ce trait narratif sans en tirer une conclusion sur l’identité de l’auteur.
- issue: Initiative divine exprimée par προσκέκληται ἡμᾶς ὁ θεὸς
  choice: Dieu nous avait appelés
  alternative: Dieu nous guidait ou nous invitait
  rationale: « Appeler » respecte la force du verbe et l’affirmation d’une initiative divine, sans préciser davantage la manière dont cet appel agit.
translation_notes:
  register: Français international moderne, clair et digne. Le passé antérieur s’accorde au récit littéraire sans archaïsme marqué. « Partir pour » et « annoncer la bonne nouvelle » privilégient une formulation idiomatique et accessible, tandis que les notes conservent les principales nuances lexicales du grec.
