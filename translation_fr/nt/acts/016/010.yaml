revisions:
- from: Après qu’il eut vu la vision, nous avons aussitôt cherché à partir pour la Macédoine[a], ayant conclu[b] que Dieu nous avait appelés à leur annoncer la bonne nouvelle[c].
  to: Après qu’il a vu la vision, nous avons aussitôt cherché à partir pour la Macédoine[a], concluant[b] que Dieu nous avait appelés à leur annoncer la bonne nouvelle[c].
  rationale: La révision harmonise les temps avec le français narratif moderne, rend plus précisément la relation participiale de συμβιβάζοντες et corrige la nuance spatiale de la note relative à ἐξελθεῖν εἰς Μακεδονίαν. Le sens, le passage explicite à la première personne du pluriel et l’initiative divine demeurent inchangés.
