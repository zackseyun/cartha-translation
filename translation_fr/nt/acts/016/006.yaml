revisions:
- from: Ils traversèrent la région de Phrygie et de Galatie[b], car le Saint-Esprit les avait empêchés d’annoncer la Parole en Asie[a].
  to: Ils traversèrent la région de Phrygie et de Galatie[b], ayant été empêchés par le Saint-Esprit d’annoncer la parole en Asie[a].
  rationale: La révision remplace la proposition causale par un participe passé afin de reproduire plus fidèlement la fonction de κωλυθέντες, et met « parole » en minuscule pour ne pas conférer au terme un statut de titre qui n’est pas marqué dans le grec. Le sens, les noms propres et les deux notes sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:14:55Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le déplacement à travers la région, l’agent « le Saint-Esprit », l’activité de communication et le référent historique d’« Asie ». Toutefois, « car » transforme de façon trop explicite le participe passif κωλυθέντες en relation causale avec le déplacement. Une tournure participiale française conserve mieux le lien syntaxique et la souplesse aspectuelle du grec.
  naturalness: Le passé simple convient au récit biblique en français international moderne. « Ayant été empêchés par le Saint-Esprit de… » est naturel dans ce registre et évite le plus-que-parfait explicatif introduit par « car ».
  terminology: « Saint-Esprit » est approprié. « la parole » sans majuscule traduit τὸν λόγον sans en faire nécessairement un titre théologique; le contexte conserve son sens de message proclamé. « Annoncer » est idiomatique ici, bien que le grec dise littéralement « parler ».
  issues:
  - severity: medium
    issue: La conjonction « car » impose une relation causale explicite.
    rationale: 'κωλυθέντες est un participe aoriste passif : il indique que les voyageurs ont été empêchés, sans exiger que cette action soit présentée comme la cause logique de leur traversée. Une construction participiale préserve mieux cette nuance.'
  - severity: low
    issue: La majuscule à « Parole » peut surinterpréter le nom commun λόγος.
    rationale: Dans ce contexte, λόγος désigne bien le message chrétien, mais le grec ne le présente pas formellement comme un titre. La minuscule maintient une formulation plus directement équivalente.
  revised_text: Ils traversèrent la région de Phrygie et de Galatie[b], ayant été empêchés par le Saint-Esprit d’annoncer la parole en Asie[a].
  revised_footnotes:
