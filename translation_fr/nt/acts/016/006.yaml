id: ACT.16.6
reference: Acts 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: fr
  text: Ils traversèrent la région de Phrygie et de Galatie[b], ayant été empêchés par le Saint-Esprit d’annoncer la parole en Asie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la province romaine d’Asie, dans l’ouest de l’Asie Mineure, et non du continent asiatique actuel.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « la région phrygienne et galate ». La construction grecque peut désigner une seule région.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: Ils traversèrent
  rationale: L’aoriste de διέρχομαι exprime ici un déplacement à travers un territoire. « Traversèrent » est naturel et conserve cette valeur spatiale.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: δέ est un connecteur narratif léger. En français, la simple succession des phrases suffit souvent à exprimer cette progression sans alourdir le récit par « et » ou « puis ».
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: la région de Phrygie et de Galatie
  rationale: χώρα désigne une région ou un territoire. Cette formulation française reste lisible tout en laissant en note la possibilité que le grec désigne une seule région qualifiée de phrygienne et galate.
- source_word: κωλυθέντες
  choice: car le Saint-Esprit les avait empêchés
  rationale: Le participe aoriste passif indique une interdiction ou un empêchement associé au déplacement. Une proposition causale explicite le rapport naturel en français sans préciser le moyen par lequel l’Esprit est intervenu.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: le Saint-Esprit
  rationale: La tournure avec ὑπό et le génitif présente le Saint-Esprit comme l’agent de l’empêchement. La majuscule correspond à la référence personnelle et divine habituelle dans Luc–Actes.
- source_word: λαλῆσαι
  choice: d’annoncer
  rationale: λαλέω signifie littéralement « parler », mais avec « la Parole » dans ce contexte missionnaire, « annoncer » exprime naturellement l’acte de communiquer le message sans aller jusqu’au terme plus spécialisé « prêcher ».
- source_word: τὸν λόγον
  choice: la Parole
  rationale: « La Parole » préserve l’expression caractéristique de Luc–Actes tout en signalant qu’il s’agit du message chrétien, sans remplacer le terme par « Évangile ».
- source_word: ἐν τῇ Ἀσίᾳ
  choice: en Asie
  rationale: Le nom historique est conservé dans le texte; une note précise qu’il s’agit de la province romaine et non du continent moderne.
theological_decisions:
- issue: Agent de l’interdiction et caractère personnel de l’Esprit
  choice: le Saint-Esprit les avait empêchés
  alternative: l’esprit les avait empêchés
  rationale: L’expression grecque ὑπὸ τοῦ ἁγίου πνεύματος désigne, dans l’usage de Luc–Actes, le Saint-Esprit comme agent de l’action. La traduction conserve cette agence sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; le plus-que-parfait rend l’antériorité probable du participe. Les notes [a] et [b] sont placées immédiatement après les termes qu’elles éclairent.
