id: ACT.16.28
reference: Acts 16:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: fr
  text: 'Mais Paul cria d’une voix forte : « Ne te fais aucun mal, car nous sommes tous ici. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: cria
  rationale: Dans cette situation urgente, l’aoriste de φωνέω désigne un appel lancé avec force; « cria » rend naturellement cette intensité, renforcée par φωνῇ μεγάλῃ.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici le contraste avec le geste que le gardien s’apprêtait à commettre et introduit l’intervention de Paul.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette formulation conserve l’image concrète du grec tout en étant naturelle et digne en français moderne.
- source_word: λέγων
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles criées et évitent le tour plus lourd « en disant » sans perdre aucune information.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Ne te fais aucun mal
  rationale: Cette défense directe conserve la valeur réfléchie de σεαυτῷ et la portée générale de μηδὲν…κακόν, tout en convenant au contexte d’une atteinte imminente à soi-même.
- source_word: ἅπαντες
  choice: tous
  rationale: « Tous » exprime clairement la totalité emphatique des personnes encore présentes.
- source_word: γάρ
  choice: car
  rationale: '« Car » maintient explicitement le lien explicatif: leur présence est la raison pour laquelle le gardien ne doit pas se faire de mal.'
- source_word: ἐσμεν ἐνθάδε
  choice: sommes tous ici
  rationale: « Ici » est l’équivalent français direct et naturel de l’adverbe de lieu ἐνθάδε.
- source_word: ὁ Παῦλος
  choice: Paul
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
theological_decisions:
- issue: Nature du mal que le gardien envisage de s’infliger
  choice: Ne te fais aucun mal
  alternative: Ne te tue pas
  rationale: Le contexte indique une tentative de suicide, mais le grec emploie une expression plus large. La traduction conserve cette portée sans expliciter davantage que le texte source.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse directe, urgente et singulière. La formulation reste proche du grec tout en évitant le calque peu naturel « cria d’une voix forte, disant ».
