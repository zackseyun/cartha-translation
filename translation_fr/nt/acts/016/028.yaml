  source_fidelity: '« Mais Paul cria d’une voix forte : “Ne te fais aucun mal, car nous sommes tous ici.” » rend fidèlement l’intervention contrastive de δέ, le cri urgent (ἐφώνησεν φωνῇ μεγάλῃ), l’interdiction réflexive volontairement large (Μηδὲν πράξῃς σεαυτῷ κακόν), ainsi que la justification introduite par γάρ. « Aucun mal » conserve à juste titre une portée plus large que « ne te tue pas ».'
