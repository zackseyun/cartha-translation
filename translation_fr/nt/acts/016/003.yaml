id: ACT.16.3
reference: Acts 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: fr
  text: Paul voulut qu’il parte avec lui[a]. Il le prit alors et le circoncit à cause des Juifs qui se trouvaient dans ces régions[b], car tous savaient que son père était grec[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il voyage avec lui ». Le grec dit littéralement « qu’il sorte avec lui », expression qui peut désigner le fait de se mettre en route.
    reason: lexical_alternative
  - marker: b
    text: Ou « en considération des Juifs » ; le grec indique le motif de l’action sans en préciser davantage la nuance.
    reason: lexical_alternative
  - marker: c
    text: Grec « était un Grec » ; dans ce contexte, cette désignation indique probablement que le père de Timothée n’était pas juif.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: il
  rationale: Le démonstratif accusatif renvoie à Timothée, clairement identifié dans le contexte précédent. En français, le pronom « il » dans la construction « qu’il parte » est plus naturel qu’un démonstratif appuyé comme « cet homme ».
- source_word: ἠθέλησεν
  choice: voulut
  rationale: L’aoriste de θέλω exprime ici la volonté ou l’intention de Paul. « Voulut » rend directement cette valeur sans renforcer le verbe en décision irrévocable.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: qu’il parte avec lui
  rationale: Cette formulation conserve l’idée de départ portée par ἐξελθεῖν tout en étant naturelle en français. Dans le contexte, il s’agit vraisemblablement de partir en voyage, possibilité signalée en note.
- source_word: λαβὼν
  choice: Il le prit alors
  rationale: Le participe aoriste indique une action liée et antérieure à la circoncision. Une proposition coordonnée rend la séquence avec clarté en français moderne.
- source_word: περιέτεμεν
  choice: le circoncit
  rationale: Traduction directe et usuelle de περιτέμνω, sans euphémisme ni développement doctrinal.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: à cause des Juifs
  rationale: διά avec l’accusatif marque ici le motif de l’action. « À cause de » reste suffisamment neutre; d’autres nuances possibles sont indiquées en note.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: qui se trouvaient dans ces régions
  rationale: La tournure identifie les populations juives locales. « Régions » est plus idiomatique que « lieux » dans ce contexte de déplacement géographique.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: car tous savaient
  rationale: « Car » conserve la fonction explicative de γάρ, et « tous » rend l’insistance de ἅπαντες.
- source_word: Ἕλλην
  choice: grec
  rationale: Ἕλλην désigne littéralement un Grec. Dans ce contexte, le terme peut surtout signaler que le père de Timothée n’était pas juif, mais cette implication ne doit pas remplacer la désignation du texte.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: son père était
  rationale: Le simple verbe « était » rend naturellement ὑπῆρχεν ici, sans ajouter une nuance d’origine ou de circonstance que le contexte n’exige pas.
theological_decisions:
- issue: Motif de la circoncision de Timothée en rapport avec les Juifs de la région
  choice: Le texte présente l’acte de Paul comme motivé par les Juifs locaux et par leur connaissance de l’origine paternelle de Timothée.
  alternative: Comprendre le geste soit comme une approbation théologique générale de la circoncision des croyants, soit comme un acte relevant exclusivement d’une stratégie missionnaire.
  rationale: Le verset donne explicitement un motif narratif, mais ne précise pas toutes ses implications théologiques. La traduction conserve donc cette tension sans affirmer que la circoncision était nécessaire au salut ou, à l’inverse, qu’elle n’avait qu’une portée stratégique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation privilégie des phrases claires, conserve le mouvement narratif du grec et évite d’expliciter au-delà du verset les raisons théologiques du geste de Paul.
