id: ACT.16.37
reference: Acts 16:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: fr
  text: 'Mais Paul leur dit : « Après nous avoir battus publiquement sans que nous ayons été condamnés[a], alors que nous sommes citoyens romains[b], ils nous ont jetés en prison ; et maintenant, ils nous font sortir en secret ? Non, certainement pas ! Qu’ils viennent plutôt eux-mêmes nous conduire dehors[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « sans jugement » ou « sans avoir été reconnus coupables ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « étant des hommes romains » ; il est ici question de leur citoyenneté romaine et des protections juridiques qui s’y rattachaient.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « nous faire sortir » ou « nous escorter jusqu’à la sortie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: dit
  rationale: Le passé simple convient au récit et rend naturellement le verbe courant de parole.
- source_word: Δείραντες
  choice: Après nous avoir battus
  rationale: Cette formulation exprime l’antériorité du participe aoriste sans préciser indûment la forme exacte du châtiment.
- source_word: δημοσίᾳ
  choice: en public
  rationale: Équivalent français direct, naturel et concis de l’adverbe.
- source_word: ἀκατακρίτους
  choice: sans que nous ayons été condamnés
  rationale: Rend précisément l’absence de condamnation judiciaire sans réduire nécessairement le terme à l’absence de tout procès.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: alors que nous sommes citoyens romains
  rationale: La tournure française exprime clairement le statut civique et sa portée juridique, tout en intégrant naturellement la valeur concessive du contexte.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: ils nous ont jetés en prison
  rationale: « Jetés » conserve la vigueur de βάλλω et souligne la brutalité de l’emprisonnement.
- source_word: λάθρᾳ
  choice: en secret
  rationale: Rend directement l’idée d’une action dissimulée.
- source_word: ἐκβάλλουσιν
  choice: ils nous font sortir
  rationale: Dans le contexte d’une libération de prison, cette formulation est idiomatique tout en gardant le présent de la question indignée.
- source_word: οὐ γάρ
  choice: Non, certainement pas !
  rationale: Cette formule restitue le refus énergique de Paul dans un français actuel et digne.
- source_word: ἐλθόντες αὐτοὶ
  choice: Qu’ils viennent plutôt eux-mêmes
  rationale: « Eux-mêmes » maintient l’insistance sur la venue personnelle des magistrats ; « plutôt » rend l’opposition introduite par ἀλλά.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: nous faire sortir
  rationale: Rend simplement l’ordre à la troisième personne sans imposer l’idée plus précise d’une escorte officielle.
theological_decisions:
- issue: Portée juridique du statut romain de Paul et Silas
  choice: citoyens romains
  alternative: Romains
  rationale: Le contexte porte sur les protections juridiques attachées à la citoyenneté ; « citoyens romains » explicite en français le sens civique de la désignation sans ajouter de contenu doctrinal.
- issue: Sens de ἀκατακρίτους
  choice: sans que nous ayons été condamnés
  alternative: sans jugement
  rationale: Le grec affirme directement qu’aucune condamnation judiciaire n’avait été prononcée. Le texte principal conserve cette précision, tandis que la note signale la formulation procédurale possible sans l’imposer.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le ton juridique et indigné de Paul, ainsi que l’opposition entre l’humiliation publique et la tentative de libération secrète. Les notes sont placées immédiatement après les expressions qu’elles éclairent.
