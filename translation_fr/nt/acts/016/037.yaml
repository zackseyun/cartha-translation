  verdict: revise
  source_fidelity: 'Le texte rend fidèlement l’enchaînement, la publicité de la violence, l’absence de condamnation, le statut de citoyens romains et l’indignation devant une libération discrète. Une correction limitée est toutefois justifiée : « nous faire sortir » peut suggérer qu’ils se contentent d’ordonner ou de faire organiser la sortie, tandis que ἐλθόντες αὐτοὶ ... ἐξαγαγέτωσαν exige qu’ils viennent personnellement les conduire dehors.'
  naturalness: Français moderne, clair et d’un registre approprié. « Après nous avoir battus publiquement » est légèrement plus idiomatique que « en public » dans ce contexte, sans changement de sens.
