  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: fr
  text: Il avait une bonne réputation auprès des frères de Lystre et d’Iconium[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « frères et sœurs » : le terme peut désigner l’ensemble des croyants de ces villes.'
    reason: Alternative lexicale précisant la portée collective possible de ἀδελφῶν.
lexical_decisions:
- source_word: ὃς
  choice: Il
  rationale: Le pronom relatif renvoie à Timothée, mentionné au verset précédent. Une nouvelle phrase avec « Il » est naturelle en français.
- source_word: ἐμαρτυρεῖτο
  choice: avait une bonne réputation
  rationale: L’imparfait passif de μαρτυρέω exprime ici le témoignage favorable que la communauté rendait au sujet de Timothée. Cette formulation restitue naturellement l’idée de réputation bien établie.
- source_word: ὑπὸ
  choice: auprès de
  rationale: Avec le génitif, ὑπό désigne les personnes dont émane le témoignage. En français, « avoir une bonne réputation auprès de » exprime cette relation de façon idiomatique.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: de Lystres et d’Iconium
  rationale: La construction grecque identifie les communautés situées dans ces deux villes. Le complément français est concis et naturel.
- source_word: ἀδελφῶν
  choice: frères
  rationale: Le nom grec est un masculin pluriel et désigne les membres de la communauté croyante; le texte principal en conserve la forme genrée, tandis qu’une note signale sa portée possiblement inclusive.
theological_decisions:
- issue: Rendu genré de ἀδελφῶν pour la communauté chrétienne
  choice: frères
  alternative: frères et sœurs; croyants
  rationale: Le grec emploie le masculin pluriel. « Frères » préserve cette forme, sans exclure la possibilité que le terme désigne collectivement les croyants des deux sexes; cette portée est indiquée en note.
translation_notes:
  register: Français moderne, international et digne. « Avait une bonne réputation auprès de » privilégie une expression courante et précise plutôt qu’un calque tel que « recevait un bon témoignage ».
