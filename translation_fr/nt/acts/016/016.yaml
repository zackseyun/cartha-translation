revisions:
- from: Or, tandis que nous allions au lieu de prière, une jeune esclave qui avait un esprit de Python[a] vint à notre rencontre. Par ses prédictions[b], elle rapportait de gros bénéfices à ses maîtres.
  to: Il arriva que, tandis que nous nous rendions au lieu de prière, une jeune esclave qui avait un esprit de Python[a] vint à notre rencontre. Elle procurait à ses maîtres de gros bénéfices en pratiquant la divination[b].
  rationale: La révision restitue explicitement la transition narrative et événementielle de Ἐγένετο δέ, tout en conservant le cadre simultané du génitif absolu. Elle emploie une formulation française fluide et rend μαντευομένη par l’activité de divination elle-même. Les notes gardent l’alternative interprétative et l’alternative plus accessible.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:15:00Z'
review_pass:
  verdict: revise
  source_fidelity: La draft rend correctement le lieu de prière, le statut servile de la jeune fille, l’expression culturellement spécifique « esprit de Python », sa rencontre avec le groupe et le profit continu procuré à ses maîtres. Toutefois, « Or » seul ne rend pas suffisamment la transition événementielle Ἐγένετο δέ, et « par ses prédictions » est un peu plus étroit que μαντευομένη, qui désigne l’exercice de la divination.
  naturalness: « Or, tandis que nous allions… » est grammatical, mais « Or » y paraît abrupt et ne porte pas le sens de « il arriva que ». « Nous nous rendions » et « en pratiquant la divination » sont naturels en français international moderne.
  terminology: « Jeune esclave », « esprit de Python », « maîtres » et « lieu de prière » sont appropriés. « Python » conserve la référence grecque sans imposer une interprétation doctrinale; la note explicite avec justesse l’équivalent fonctionnel.
  issues:
  - severity: medium
    issue: La transition « Or » ne traduit pas à elle seule Ἐγένετο δέ.
    rationale: La formule grecque introduit l’événement (« il arriva que »). En français, « Or » peut relier le récit, mais n’exprime pas cette mise en événement et sonne abrupt devant un imparfait de contexte.
  - severity: low
    issue: « Par ses prédictions » restreint légèrement μαντευομένη.
    rationale: Le participe décrit l’activité de divination, non seulement les prédictions produites. « En pratiquant la divination » est plus directement correspondant; « par ses prédictions » peut être conservé comme variante en note.
  revised_text: Il arriva que, tandis que nous nous rendions au lieu de prière, une jeune esclave qui avait un esprit de Python[a] vint à notre rencontre. Elle procurait à ses maîtres de gros bénéfices en pratiquant la divination[b].
  revised_footnotes:
  - marker: a
    text: Ou « un esprit de divination ». Le grec dit littéralement « un esprit de Python », expression culturellement liée aux pratiques divinatoires.
    reason: alternative_reading
  - marker: b
    text: Ou « par ses prédictions ».
    reason: lexical_alternative
  revision_rationale: La révision restitue explicitement la transition narrative et événementielle de Ἐγένετο δέ, tout en conservant le cadre simultané du génitif absolu. Elle emploie une formulation française fluide et rend μαντευομένη par l’activité de divination elle-même. Les notes gardent l’alternative interprétative et l’alternative plus accessible.
