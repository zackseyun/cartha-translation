id: ACT.16.16
reference: Acts 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: fr
  text: Il arriva que, tandis que nous nous rendions au lieu de prière, une jeune esclave qui avait un esprit de Python[a] vint à notre rencontre. Elle procurait à ses maîtres de gros bénéfices en pratiquant la divination[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de divination ». Le grec dit littéralement « un esprit de Python », expression culturellement liée aux pratiques divinatoires.
    reason: alternative_reading
  - marker: b
    text: Ou « par ses prédictions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Or
  rationale: Transition narrative naturelle en français moderne; le caractère événementiel ressort de la proposition qui suit sans calque lourd de l’idiome grec.
- source_word: πορευομένων ἡμῶν
  choice: tandis que nous allions
  rationale: Rend le génitif absolu comme une action de fond simultanée et continue.
- source_word: εἰς τὴν προσευχὴν
  choice: au lieu de prière
  rationale: Dans ce contexte, προσευχή avec l’article peut désigner un lieu reconnu où l’on se réunit pour prier, et non seulement l’acte de prier.
- source_word: παιδίσκην τινά
  choice: une jeune esclave
  rationale: Le contexte des maîtres et du profit indique un statut servile; « jeune esclave » conserve aussi la nuance possible d’âge ou de condition attachée à παιδίσκη.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: qui avait un esprit de Python
  rationale: Préserve l’expression grecque culturellement marquée, associée à la divination, sans la remplacer silencieusement par son interprétation.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: vint à notre rencontre
  rationale: Exprime naturellement en français l’événement principal introduit par la construction infinitive grecque.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: rapportait de gros bénéfices
  rationale: Rend clairement l’avantage économique considérable ainsi que l’aspect duratif de l’imparfait.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: à ses maîtres
  rationale: Désigne ici ceux qui exercent leur autorité et leur propriété sur l’esclave, non le titre divin.
- source_word: μαντευομένη
  choice: par ses prédictions
  rationale: Formulation actuelle et accessible pour l’activité divinatoire; la note conserve le terme plus technique.
theological_decisions:
- issue: Sens culturel et spirituel de πνεῦμα πύθωνα
  choice: un esprit de Python
  alternative: un esprit de divination
  rationale: Le texte principal garde la référence culturelle spécifique à Python et la tension propre au langage spirituel du récit; la note donne le sens fonctionnel sans effacer cette particularité.
- issue: Statut social exprimé par παιδίσκη
  choice: jeune esclave
  alternative: servante
  rationale: La pluralité de ses maîtres et le profit qu’ils tirent d’elle rendent son asservissement saillant; « servante » risquerait d’en atténuer la réalité.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est divisée en deux pour rester naturelle et lisible. « Esprit de Python » conserve la spécificité culturelle du grec, tandis que les notes explicitent les équivalents interprétatifs.
