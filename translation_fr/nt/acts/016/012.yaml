source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: fr
  text: De là, nous sommes allés à Philippes[a], qui est une ville importante du district de Macédoine, une colonie romaine[b]. Nous avons séjourné quelques jours dans cette ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la première ville du district de Macédoine ». La formule grecque est difficile : « première » peut renvoyer au rang, à l’importance ou à l’ordre du trajet.'
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire une ville dotée d’un statut particulier sous l’autorité romaine.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: et de là
  rationale: Conserve le lien avec les étapes précédentes du voyage sans ajouter un verbe absent du grec.
- source_word: εἰς Φιλίππους
  choice: à Philippes
  rationale: Rend naturellement en français le mouvement vers la ville et emploie son nom français traditionnel.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: une ville importante du district de Macédoine
  rationale: πρώτη peut désigner le rang ou la prééminence, tandis que la construction demeure difficile; « importante » évite d'affirmer sans nuance que Philippes était administrativement la première ville.
- source_word: κολωνία
  choice: une colonie romaine
  rationale: Explicite la réalité institutionnelle romaine désignée par le terme emprunté κολωνία.
- source_word: ἦμεν ... διατρίβοντες
  choice: nous avons séjourné
  rationale: Expression française naturelle pour la construction périphrastique qui indique un séjour d'une certaine durée.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: dans cette ville
  rationale: Préserve la valeur démonstrative de ταύτῃ.
- source_word: ἡμέρας τινάς
  choice: quelques jours
  rationale: Exprime une durée indéterminée et relativement brève sans précision excessive.
theological_decisions:
- issue: Sens de πρώτη dans la description de Philippes
  choice: une ville importante
  alternative: la première ville
  rationale: La formule grecque est difficile et peut renvoyer au rang, à l'importance ou à l'ordre du trajet. Le texte principal retient une formulation naturelle et historiquement prudente, tandis que la note conserve l'autre lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l'enchaînement elliptique du récit grec (« et de là, à Philippes »), tout en employant un vocabulaire courant. Les notes signalent l'ambiguïté historique et syntaxique sans la résoudre artificiellement.
