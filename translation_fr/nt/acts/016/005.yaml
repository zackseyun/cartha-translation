id: ACT.16.5
reference: Acts 16:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: fr
  text: Ainsi, les Églises étaient affermies dans la foi et leur nombre augmentait de jour en jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « dans la foi » peut désigner soit la foi chrétienne comme réalité partagée — croyance et manière de vivre —, soit plus généralement la confiance croyante.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Ainsi
  rationale: La combinaison de particules introduit un bilan découlant du récit précédent. « Ainsi » marque naturellement ce lien en français sans surtraduire μέν.
- source_word: ἐκκλησίαι
  choice: les Églises
  rationale: Le terme désigne ici les communautés chrétiennes locales. « Églises » est le rendu français courant et contextuellement clair.
- source_word: ἐστερεοῦντο
  choice: étaient affermies
  rationale: L’imparfait passif exprime un processus continu dans le passé. « Étaient affermies » conserve la voix passive et l’idée de consolidation.
- source_word: τῇ πίστει
  choice: dans la foi
  rationale: L’article et le contexte communautaire favorisent la foi chrétienne partagée, sans exclure entièrement le sens plus général de confiance croyante. La note préserve cette ambiguïté.
- source_word: ἐπερίσσευον
  choice: augmentait
  rationale: Avec τῷ ἀριθμῷ, le verbe décrit une croissance numérique continue. En français, le sujet idiomatique devient « leur nombre », au singulier.
- source_word: τῷ ἀριθμῷ
  choice: leur nombre
  rationale: Cette reformulation française naturelle rend le datif de relation, littéralement « quant au nombre », et indique clairement la croissance numérique des Églises.
- source_word: καθ’ ἡμέραν
  choice: de jour en jour
  rationale: Cette expression conserve la valeur distributive et progressive de la formule grecque.
theological_decisions:
- issue: Sens de πίστις avec l’article
  choice: '« la foi » : la foi chrétienne partagée dans laquelle les Églises étaient affermies'
  alternative: '« foi » : la confiance croyante des membres'
  rationale: L’article grec et le contexte ecclésial favorisent le sens communautaire ou objectif, mais la construction peut aussi désigner plus généralement la foi; la note maintient cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Affermies » garde la force du passif grec; « leur nombre augmentait » évite une tournure lourde tout en préservant le sens exact.
