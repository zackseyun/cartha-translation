id: ACT.16.9
reference: Acts 16:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: fr
  text: 'Pendant la nuit, Paul eut une vision : un Macédonien se tenait là et lui lançait un appel pressant, en disant : « Passe en Macédoine et viens à notre aide. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: vision
  rationale: « Vision » est l’équivalent français courant dans ce contexte narratif et préserve le caractère révélateur de l’expérience sans en préciser indûment la nature.
- source_word: διὰ νυκτός
  choice: pendant la nuit
  rationale: Cette tournure exprime naturellement en français le moment où la vision a lieu.
- source_word: τῷ Παύλῳ ὤφθη
  choice: Paul eut une vision
  rationale: Cette formulation idiomatique rend le fait qu’une vision apparut à Paul, sans conserver un passif peu naturel en français.
- source_word: ἀνὴρ Μακεδών τις
  choice: un Macédonien
  rationale: Le nom masculin désigne explicitement un homme, tandis que l’article indéfini suffit naturellement à rendre τις en français; « un certain Macédonien » créerait ici une nuance étrangère ou trop appuyée.
- source_word: ἑστώς
  choice: se tenait là
  rationale: Cette expression conserve la posture et la valeur descriptive de la scène, avec un français naturel.
- source_word: παρακαλῶν αὐτὸν
  choice: lui adressait cette supplication
  rationale: Le contexte est celui d’un appel pressant à l’aide; « supplication » exprime cette insistance sans nécessairement suggérer des larmes ou du désespoir.
- source_word: λέγων
  choice: introduit par deux-points
  rationale: En français, les deux-points introduisent naturellement les paroles qui précisent le contenu de la supplication, sans qu’il soit nécessaire d’ajouter le participe « disant ».
- source_word: Διαβὰς εἰς Μακεδονίαν
  choice: Passe en Macédoine
  rationale: Le participe aoriste associé à l’impératif exprime idiomatiquement une action préalable ou associée. « Passe en Macédoine » conserve l’idée de traversée et de mouvement vers cette région.
- source_word: βοήθησον ἡμῖν
  choice: viens à notre aide
  rationale: Expression française directe et courante qui restitue l’appel pressant à fournir de l’aide.
theological_decisions:
- issue: Nature de l’expérience désignée par ὅραμα et ὤφθη
  choice: Présenter l’événement comme une vision reçue par Paul, sans en définir le mécanisme.
  alternative: Un rêve, une impression intérieure ou une apparition objectivement visible.
  rationale: Le texte parle explicitement d’une vision nocturne, mais ne précise pas davantage sa phénoménologie; la traduction conserve donc cette réserve.
translation_notes:
  register: Français moderne, international et digne. La formulation évite le calque « une vision apparut à Paul », grammatical mais moins fluide, tout en maintenant le caractère narratif et révélateur de la scène.
