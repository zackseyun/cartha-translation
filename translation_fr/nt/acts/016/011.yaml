  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: fr
  text: Nous avons donc quitté Troas par mer et fait route directement vers Samothrace, puis, le lendemain, vers Néapolis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: avons quitté … par mer
  rationale: Dans ce contexte nautique, le participe de ἀνάγω signifie prendre la mer ou appareiller. Cette formulation française exprime naturellement le départ maritime et, avec « donc », conserve la progression du récit.
- source_word: οὖν
  choice: donc
  rationale: οὖν marque ici la conséquence ou la progression narrative; « donc » maintient ce lien sans alourdir le récit.
- source_word: ἀπὸ Τρῳάδος
  choice: Troas
  rationale: La préposition ἀπό indique le point de départ. « Troas » est la forme française traditionnelle du nom géographique.
- source_word: εὐθυδρομήσαμεν
  choice: fait route directement
  rationale: Le verbe désigne le fait de suivre une route maritime directe. « Faire route directement » rend la précision nautique dans un français courant et digne.
- source_word: εἰς Σαμοθρᾴκην
  choice: vers Samothrace
  rationale: εἰς indique la destination; « Samothrace » est la forme française établie.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: puis, le lendemain
  rationale: L’expression temporelle signifie « le jour suivant ». « Puis » représente naturellement la reprise séquentielle portée par δέ.
- source_word: εἰς Νέαν Πόλιν
  choice: vers Néapolis
  rationale: Il s’agit d’un nom de lieu à translittérer plutôt qu’à traduire. « Néapolis » est la forme française usuelle.
theological_decisions: []
