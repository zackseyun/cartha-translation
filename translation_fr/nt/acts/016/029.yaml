id: ACT.16.29
reference: Acts 16:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αἰτήσας δὲ φῶτα εἰσεπήδησεν καὶ ἔντρομος γενόμενος προσέπεσεν τῷ Παύλῳ καὶ ⸀τῷ Σιλᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: fr
  text: Alors, après avoir demandé de la lumière, il se précipita à l’intérieur et, tout tremblant, tomba devant Paul et Silas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se jeta aux pieds de Paul et de Silas». Le grec décrit le fait de tomber devant eux, dans la peur, la supplication ou la déférence, sans désigner nécessairement un acte d’adoration.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰτήσας
  choice: après avoir demandé
  rationale: Le participe aoriste exprime ici une action antérieure à l’entrée précipitée; cette tournure française en conserve naturellement la succession.
- source_word: δὲ
  choice: Alors
  rationale: La particule marque la progression du récit plutôt qu’une opposition forte.
- source_word: φῶτα
  choice: de la lumière
  rationale: Le pluriel grec désigne des sources d’éclairage sans en préciser la nature. Le français idiomatique demande couramment «de la lumière» dans ce contexte.
- source_word: εἰσεπήδησεν
  choice: il se précipita à l’intérieur
  rationale: Le verbe évoque une entrée soudaine et énergique; cette formulation moderne transmet l’urgence sans imposer l’idée d’un saut littéral.
- source_word: ἔντρομος γενόμενος
  choice: tout tremblant
  rationale: Cette expression rend l’état de frayeur accompagné de tremblement de façon concise et naturelle, sans le réduire à une émotion purement intérieure.
- source_word: προσέπεσεν
  choice: tomba devant
  rationale: Le verbe décrit le fait de tomber devant quelqu’un, geste pouvant exprimer détresse, supplication ou déférence, sans signifier nécessairement l’adoration.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: devant Paul et Silas
  rationale: «Devant» rend naturellement le datif régi par le verbe sans ajouter la précision interprétative «à leurs pieds».
theological_decisions:
- issue: Nature du geste du gardien devant Paul et Silas
  choice: «tomba devant Paul et Silas», geste de détresse ou de déférence dont la nature exacte reste ouverte
  alternative: «se prosterna devant Paul et Silas», formulation susceptible d’évoquer plus fortement l’adoration
  rationale: Le contexte suggère la peur et une supplication urgente, mais le verbe grec n’exige pas d’y voir un acte cultuel. La traduction conserve donc l’ambiguïté sans importer une conclusion théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la vive succession des actions. «De la lumière» est plus idiomatique en français que le calque «des lumières», tandis que «tout tremblant» préserve à la fois la manifestation physique et la frayeur impliquée par ἔντρομος.
