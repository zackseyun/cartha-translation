  variant: modern international French
source:
  edition: SBLGNT
  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: fr
  text: Vers minuit, Paul et Silas priaient et chantaient des hymnes à Dieu, et les prisonniers les écoutaient attentivement.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Vers minuit
  rationale: κατά avec l’accusatif temporel situe l’action autour de minuit plutôt qu’à une heure strictement précise. Le léger lien marqué par δέ n’exige pas ici de connecteur explicite en français.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Paul et Silas
  rationale: Formes françaises usuelles des noms propres bibliques.
- source_word: προσευχόμενοι
  choice: priaient
  rationale: Le participe présent exprime une action en cours, contemporaine de ὕμνουν; la coordination de deux imparfaits est naturelle en français.
- source_word: ὕμνουν
  choice: chantaient des hymnes
  rationale: ὑμνέω désigne le fait de chanter des hymnes ou des chants de louange; cette traduction conserve la précision du verbe grec.
- source_word: τὸν θεόν
  choice: à Dieu
  rationale: Avec «chanter des hymnes», le complément introduit par «à» indique naturellement le destinataire de la louange.
- source_word: ἐπηκροῶντο
  choice: écoutaient attentivement
  rationale: Le verbe composé peut exprimer une écoute soutenue ou attentive; l’imparfait en restitue le caractère continu.
- source_word: οἱ δέσμιοι
  choice: les prisonniers
  rationale: Traduction française courante et précise de ceux qui sont détenus ou enchaînés dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition de l’imparfait rend les actions simultanées et continues. «Hymnes» conserve la spécificité du vocabulaire de louange sans ajouter de précision confessionnelle.
