  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: fr
  text: 'Elle continua ainsi pendant de nombreux jours. Mais Paul, profondément troublé, se retourna et dit à l’esprit[a] : « Je t’ordonne, au nom de Jésus le Messie[b], de sortir d’elle. » Et l’esprit sortit à l’heure même.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « à l’esprit »; le contexte montre qu’il s’agit de l’esprit qui tient la jeune esclave sous son emprise.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Jésus-Christ ». Le titre grec Χριστός est traduit ici par « le Messie » afin d’en conserver le sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: continua ainsi pendant de nombreux jours
  rationale: L’imparfait ἐποίει présente une action répétée ou prolongée; « continua ainsi » l’exprime naturellement en français.
- source_word: διαπονηθεὶς
  choice: profondément troublé
  rationale: Le participe exprime une vive contrariété ou une profonde peine, plus forte qu’un simple agacement; cette formulation conserve l’intensité sans imposer la colère.
- source_word: ἐπιστρέψας
  choice: se retourna
  rationale: Le participe aoriste décrit le mouvement de Paul avant sa parole; « se retourna » est naturel et précis dans ce contexte.
- source_word: τῷ πνεύματι
  choice: à l’esprit
  rationale: Le grec dit simplement « à l’esprit », sans ajouter « mauvais » ni « démon »; la traduction préserve cette sobriété.
- source_word: Παραγγέλλω σοι
  choice: Je t’ordonne
  rationale: παραγγέλλω exprime ici un ordre donné avec autorité; « je t’ordonne » en restitue directement la force.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: au nom de Jésus le Messie
  rationale: La locution « au nom de » exprime l’autorité invoquée, et « le Messie » rend Χριστός comme titre de Jésus dans un français idiomatique.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: de sortir d’elle
  rationale: Cette formulation rend directement l’infinitif et ἀπό dans le contexte de l’expulsion de l’esprit.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: il sortit à l’heure même
  rationale: Le sujet implicite reste l’esprit, masculin en français; « à l’heure même » conserve l’expression temporelle emphatique du grec et indique l’exécution immédiate.
theological_decisions:
- issue: Traduction de Χριστοῦ dans la formule d’autorité
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός conserve ici sa valeur de titre. « Jésus le Messie » en explicite le sens tout en restant naturel en français; une note signale la formulation traditionnelle.
- issue: Qualification de l’esprit
  choice: l’esprit
  alternative: l’esprit mauvais / le démon
  rationale: Le verset emploie πνεῦμα sans qualificatif. Le texte principal ne précise donc pas davantage que la source, même si le contexte identifie cet esprit comme celui qui tient la jeune femme sous son emprise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir raide; « profondément troublé » évite le registre trop faible de « agacé », et les ajouts interprétatifs concernant la nature de l’esprit sont réservés à la note.
