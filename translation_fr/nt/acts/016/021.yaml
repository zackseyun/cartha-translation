id: ACT.16.21
reference: Acts 16:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: fr
  text: et ils enseignent des coutumes qu’il ne nous est pas permis d’accepter ni de pratiquer, puisque nous sommes Romains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étant Romains » ou « en tant que Romains ». L’expression participiale grecque indique la raison que les accusateurs donnent pour rejeter ces coutumes.
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: ils annoncent
  rationale: Le verbe désigne ici l’annonce publique de coutumes. « Annoncent » reste fidèle sans renforcer l’accusation par un terme plus interprétatif comme « préconisent ».
- source_word: ἔθη
  choice: des coutumes
  rationale: ἔθη désigne des usages ou pratiques établis; « coutumes » convient au cadre civique et religieux de l’accusation.
- source_word: οὐκ ἔξεστιν
  choice: il ne nous est pas permis
  rationale: Cette tournure conserve la portée juridique ou sociale de l’expression tout en restant naturelle en français moderne.
- source_word: παραδέχεσθαι
  choice: d’accepter
  rationale: Dans ce contexte, le verbe exprime l’accueil ou l’adoption de coutumes; « accepter » préserve cette amplitude.
- source_word: οὐδὲ ποιεῖν
  choice: ni de pratiquer
  rationale: Avec « coutumes », ποιεῖν se rend idiomatiquement par « pratiquer » plutôt que par le calque « faire ».
- source_word: Ῥωμαίοις οὖσιν
  choice: puisque nous sommes Romains
  rationale: Le participe circonstanciel présente le fait d’être Romains comme la raison invoquée par les accusateurs. « Puisque » rend clairement cette nuance causale.
- source_word: καὶ
  choice: et
  rationale: La conjonction poursuit simplement l’accusation commencée au verset précédent.
theological_decisions:
- issue: Nature de l’interdiction alléguée
  choice: Formuler l’accusation en termes juridico-civiques (« il ne nous est pas permis ») sans confirmer sa validité.
  alternative: « il n’est pas juste pour nous »
  rationale: Le récit rapporte l’affirmation des accusateurs; il ne déclare pas lui-même que le droit romain interdisait réellement ces coutumes.
- issue: Valeur de Ῥωμαίοις οὖσιν
  choice: Rendre explicitement la valeur causale par « puisque nous sommes Romains ».
  alternative: « étant Romains » ou « en tant que Romains »
  rationale: La relation exacte peut être exprimée plus littéralement, mais le contexte indique que l’identité romaine est la raison donnée pour refuser ces coutumes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la continuité avec le verset précédent. La majuscule à « Romains » suit l’usage français pour le nom de peuple.
