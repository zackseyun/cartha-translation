  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le geôlier transmet à Paul le message des magistrats, qui ordonne leur libération, puis leur départ « en paix ». Cependant, « que vous deviez être relâchés » affaiblit la force directive de ἵνα ἀπολυθῆτε et peut suggérer une obligation générale plutôt que le contenu immédiat de l’ordre transmis.'
  naturalness: Le texte est globalement naturel et de registre approprié. « Ont fait dire qu’on vous relâche » est plus idiomatique dans ce discours rapporté et plus direct que « ont fait dire que vous deviez être relâchés ». « Maintenant donc » reste acceptable, avec une légère coloration littéraire conforme au contexte.
  terminology: « Le gardien de la prison », « magistrats », « relâcher » et « en paix » conviennent. La note culturelle sur στρατηγοί est exacte dans le contexte colonial de Philippes. La note lexicale doit toutefois proposer une véritable formulation française alternative et ne pas donner « que vous soyez relâchés », qui est peu naturelle après « envoyer dire ».
