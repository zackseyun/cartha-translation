source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: fr
  text: 'Le gardien de la prison rapporta ces paroles à Paul : « Les magistrats[b] ont fait dire qu’on vous relâche[a]. Maintenant donc, sortez et allez en paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les magistrats ont envoyé l’ordre de vous relâcher. » En grec, l’objet du verbe « envoyer » est sous-entendu ; le contexte indique qu’il s’agit d’un message ou d’un ordre.'
    reason: lexical_alternative
  - marker: b
    text: À Philippes, les « magistrats » étaient les autorités civiles de la colonie romaine ; on peut aussi les désigner plus techniquement comme des « préteurs ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: rapporta
  rationale: Le verbe désigne ici la transmission à Paul d’un message reçu; « rapporta » conserve cette nuance sans alourdir la narration.
- source_word: ὁ δεσμοφύλαξ
  choice: le gardien de la prison
  rationale: Cette expression française courante identifie clairement le responsable de la prison; elle est plus précise que le simple « gardien ».
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: Rendu proche du grec et naturel en français dans le contexte d’un message cité immédiatement après.
- source_word: Ἀπέσταλκαν
  choice: ont fait dire
  rationale: L’objet du verbe « envoyer » reste implicite en grec. « Ont fait dire » exprime naturellement en français l’envoi d’un message sans préciser indûment le messager.
- source_word: οἱ στρατηγοί
  choice: les magistrats
  rationale: À Philippes, le terme désigne les autorités civiles de la colonie romaine. « Magistrats » est exact et accessible, tandis que « préteurs » serait plus technique.
- source_word: ἵνα ἀπολυθῆτε
  choice: que vous deviez être relâchés
  rationale: Le passif renvoie à la libération de la détention, et la tournure exprime le contenu de la décision transmise sans identifier ceux qui doivent l’exécuter.
- source_word: νῦν οὖν
  choice: maintenant donc
  rationale: Conserve à la fois la transition temporelle et la conclusion pratique exprimées par les deux particules.
- source_word: ἐξελθόντες πορεύεσθε
  choice: sortez et allez
  rationale: Le participe suivi de l’impératif exprime une suite d’actions. Deux impératifs coordonnés donnent en français un ordre naturel et fidèle.
- source_word: ἐν εἰρήνῃ
  choice: en paix
  rationale: Expression française établie qui conserve la formulation concise et la portée ouverte de l’idiome grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation demeure accessible tout en conservant la concision du message officiel et l’expression biblique « en paix ».
