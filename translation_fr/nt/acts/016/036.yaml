    issue: Nuance directive de la proposition introduite par ἵνα
    rationale: « Que vous deviez être relâchés » traduit la décision comme une obligation indirecte et atténue l’ordre de libération. « Qu’on vous relâche » rend naturellement en français le contenu de l’instruction sans imposer un agent absent du grec.
  - severity: low
    issue: Formulation de l’alternative en note a
    rationale: « Ont envoyé dire que vous soyez relâchés » est grammaticalement possible dans certains usages, mais peu idiomatique en français moderne. Une alternative avec « l’ordre de vous relâcher » est claire et respecte l’objet implicite de Ἀπέσταλκαν.
