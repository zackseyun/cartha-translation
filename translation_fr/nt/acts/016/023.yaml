  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: fr
  text: Après leur avoir infligé de nombreux coups[a], ils les jetèrent en prison[b] et ordonnèrent au gardien de les garder sous haute surveillance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreux coups de fouet » ; le grec parle d’un grand nombre de coups infligés sans préciser ici l’instrument employé.
    reason: lexical_alternative
  - marker: b
    text: Ou « en détention » ; le terme grec peut désigner plus généralement un lieu où l’on garde des prisonniers.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: de nombreux coups
  rationale: Dans ce contexte, πληγή désigne les coups infligés lors d’un châtiment. « Coups » préserve le caractère concret sans préciser à tort l’instrument employé, et πολλάς est rendu par « de nombreux ».
- source_word: τε
  choice: et
  rationale: La particule relie cette action à la narration précédente. En français, la coordination est naturellement exprimée par « et » devant le second prédicat principal.
- source_word: ἐπιθέντες
  choice: après leur avoir infligé
  rationale: Avec πληγάς, le participe forme l’idée idiomatique d’infliger des coups. « Après leur avoir infligé » rend clairement son rapport temporel avec le verbe principal.
- source_word: ἔβαλον εἰς φυλακήν
  choice: ils les jetèrent en prison
  rationale: « Jetèrent » conserve la vigueur de βάλλω et suggère la brutalité de l’incarcération, tandis que « en prison » rend naturellement εἰς φυλακήν.
- source_word: φυλακήν
  choice: prison
  rationale: Le contexte désigne un lieu de détention placé sous la responsabilité d’un gardien. « Prison » est le terme français courant et général.
- source_word: παραγγείλαντες
  choice: ordonnèrent
  rationale: Le participe exprime ici une directive autoritaire accompagnant l’incarcération. La coordination par « et » produit une phrase française fluide sans perdre la force de l’ordre.
- source_word: δεσμοφύλακι
  choice: au gardien
  rationale: Le terme désigne le responsable de la garde des détenus. Dans le contexte immédiat de la prison, « gardien » est clair et idiomatique.
- source_word: ἀσφαλῶς τηρεῖν
  choice: de les garder sous haute surveillance
  rationale: L’expression signifie assurer leur détention de manière à empêcher toute évasion. « Sous haute surveillance » communique naturellement en français cette idée de garde rigoureuse plutôt que celle de sécurité pour les prisonniers.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie à Paul et Silas, objets de l’incarcération puis de la garde ordonnée.
theological_decisions: []
