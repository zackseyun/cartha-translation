  variant: modern international French
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: fr
  text: Quand le gardien de la prison se réveilla et vit les portes de la prison ouvertes[a], il tira son épée[b] et était sur le point de se tuer, pensant que les prisonniers s’étaient échappés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « vit que les portes de la prison avaient été ouvertes ». Le participe parfait grec met l’accent sur l’état résultant : les portes se trouvaient ouvertes.'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec μάχαιρα peut désigner une épée ou une arme à lame plus courte, comme un poignard ; « épée » est retenu comme rendu contextuel courant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: se réveilla
  rationale: Cette tournure exprime naturellement le passage à l’état de veille; « se réveilla » est clair et idiomatique en français moderne.
- source_word: ὁ δεσμοφύλαξ
  choice: le gardien de la prison
  rationale: Le terme désigne celui qui a la responsabilité des détenus. Cette formulation est plus immédiatement transparente que « geôlier » dans un français international courant.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: vit les portes de la prison grandes ouvertes
  rationale: Le participe parfait passif souligne l’état résultant des portes. « Grandes ouvertes » exprime naturellement cet état sans préciser qui les a ouvertes.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: il tira son épée
  rationale: Le verbe désigne ici le fait de dégainer une arme. μάχαιρα peut désigner une épée ou une lame plus courte; « épée » est le rendu contextuel traditionnel et naturel.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: allait se tuer
  rationale: ἤμελλεν marque une action imminente, et ἀναιρεῖν signifie ici tuer. La formulation française est directe et naturelle.
- source_word: νομίζων
  choice: pensant
  rationale: Le participe indique le raisonnement qui motive son geste, sans affirmer que sa conclusion était exacte.
- source_word: ἐκπεφευγέναι
  choice: s’étaient échappés
  rationale: L’infinitif parfait présente l’évasion comme déjà accomplie selon la supposition du gardien.
- source_word: τοὺς δεσμίους
  choice: les prisonniers
  rationale: Dans ce contexte carcéral, « prisonniers » est l’équivalent français le plus clair et précis.
