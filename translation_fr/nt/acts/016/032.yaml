    issue: « annoncèrent » pour ἐλάλησαν
    rationale: Le verbe λαλέω signifie d'abord « parler ». Dans ce contexte, « annoncèrent » est possible, mais ajoute une nuance de proclamation/annonce absente du verbe lui-même. « Parlèrent » est plus fidèle et reste naturel avec « la parole du Seigneur ».
  - severity: low
    issue: « ainsi qu’à tous ceux » pour σὺν πᾶσι
    rationale: Cette tournure rend les autres explicitement comme un second destinataire, alors que σύν signifie littéralement « avec ». Le sens contextuel est proche, mais « avec tous ceux » conserve mieux la construction et l'ambiguïté relationnelle du grec.
  revised_text: Ils lui parlèrent de la parole du Seigneur[a], avec tous ceux qui se trouvaient dans sa maison[b].
