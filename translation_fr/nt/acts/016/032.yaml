review_pass:
  verdict: revise
  source_fidelity: Le sens global est bien rendu, mais « annoncèrent » est légèrement plus interprétatif que ἐλάλησαν (« parlèrent ») et la construction « ainsi qu’à » transforme σὺν (« avec ») en second destinataire explicite. Une formulation avec « parlèrent ... avec » préserve plus exactement la relation syntaxique tout en restant naturelle.
  naturalness: La révision proposée est fluide en français international moderne. « À lui, avec tous ceux qui se trouvaient dans sa maison » exprime clairement que le geôlier et les autres personnes présentes étaient inclus dans l'auditoire, sans forcer la syntaxe grecque en deux compléments indirects.
  terminology: « La parole du Seigneur » conserve l'idiome néotestamentaire et l'ambiguïté du génitif. « Maison » est justifié par le texte; la note peut signaler « maisonnée » comme possibilité contextuelle.
  issues:
