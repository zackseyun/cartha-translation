  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: fr
  text: Ils lui parlèrent de la parole du Seigneur[a], avec tous ceux qui se trouvaient dans sa maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message concernant le Seigneur ». L’expression grecque peut désigner la parole appartenant au Seigneur, venant de lui ou le concernant.
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « avec toute sa maisonnée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: annoncèrent
  rationale: Dans ce contexte d’annonce de l’Évangile, « annoncèrent » rend naturellement l’acte de communiquer le message, sans lui donner nécessairement la nuance publique et officielle de « proclamèrent ».
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne le geôlier comme destinataire de la parole.
- source_word: τὸν λόγον
  choice: la parole
  rationale: « La parole » conserve l’expression néotestamentaire courante et la relation ouverte avec le complément « du Seigneur ».
- source_word: τοῦ κυρίου
  choice: du Seigneur
  rationale: Cette formulation préserve le génitif grec, qui peut désigner une parole venant du Seigneur, lui appartenant ou le concernant, sans trancher inutilement.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: ainsi qu’à tous ceux qui se trouvaient dans sa maison
  rationale: La reformulation fait clairement comprendre que toutes les personnes présentes dans la maison reçurent elles aussi le message. Elle rend le sens de σύν dans un français naturel, même si la structure grecque dit plus littéralement « avec tous ceux… ».
- source_word: οἰκίᾳ
  choice: maison
  rationale: « Maison » conserve le sens concret du grec; dans le contexte, l’expression désigne les personnes qui s’y trouvaient. « Maisonnée » reste une possibilité contextuelle.
theological_decisions:
- issue: Nuance de « la parole du Seigneur »
  choice: Conserver « la parole du Seigneur » sans préciser la relation exprimée par le génitif.
  alternative: « le message concernant le Seigneur » ou « le message venant du Seigneur »
  rationale: Le grec permet plusieurs nuances complémentaires. La traduction principale maintient cette ouverture théologique au lieu de réduire l’expression à une seule interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Annoncèrent » convient au contexte missionnaire sans surcharger le verbe grec. La répétition implicite du destinataire dans « ainsi qu’à » évite l’ambiguïté selon laquelle les autres personnes auraient seulement été présentes.
