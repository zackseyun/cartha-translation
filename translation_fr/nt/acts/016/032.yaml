  rationale: La révision remplace « annoncèrent » par « parlèrent » afin de rendre directement ἐλάλησαν, et remplace « ainsi qu’à » par « avec » afin de refléter σύν. La préposition française « de » avec « parler » est idiomatique; elle ne tranche pas davantage que le grec la nuance du génitif dans « la parole du Seigneur ».
