source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: fr
  text: Il trouva un Juif nommé Aquilas, originaire du Pont, qui était arrivé récemment d’Italie avec sa femme Priscille, parce que Claude avait ordonné à tous les Juifs de quitter Rome[a]. Il se rendit auprès d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’être expulsés de Rome ». Le grec parle plus littéralement d’être séparés de Rome.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: Il trouva
  rationale: Le participe aoriste introduit une action antérieure à « il alla les voir »; le passé simple convient au récit et garde le sens direct de « trouver ».
- source_word: τινα Ἰουδαῖον ὀνόματι Ἀκύλαν
  choice: un Juif nommé Aquilas
  rationale: Formulation française naturelle qui conserve l’identification ethno-religieuse et l’introduction du nom.
- source_word: Ποντικὸν τῷ γένει
  choice: originaire du Pont
  rationale: L’expression indique l’origine géographique; « originaire du Pont » est précis et idiomatique.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: qui était arrivé récemment d’Italie
  rationale: Le participe parfait marque une arrivée récente antérieure à la rencontre, avec un état résultant encore pertinent.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: avec sa femme Priscille
  rationale: Le français rattache naturellement Priscille à l’arrivée d’Aquilas; l’ordre « sa femme Priscille » est courant et clair.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: parce que Claude avait ordonné
  rationale: διά suivi de l’infinitif substantivé exprime la cause, et διατάσσω désigne ici un ordre officiel.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: à tous les Juifs de quitter Rome
  rationale: « Quitter Rome » exprime naturellement la séparation d’avec Rome sans renforcer le grec en affirmant explicitement une expulsion.
- source_word: προσῆλθεν αὐτοῖς
  choice: Il alla les voir
  rationale: Cette tournure française rend naturellement le mouvement vers Aquilas et Priscille dans le fil narratif.
theological_decisions:
- issue: Sens de Ἰουδαῖον / Ἰουδαίους
  choice: Juif / Juifs
  alternative: Judéen / Judéens
  rationale: Le contexte vise le peuple juif vivant à Rome, selon une identité ethnique et religieuse, et non simplement des habitants de la Judée.
- issue: Force de χωρίζεσθαι ἀπὸ τῆς Ῥώμης
  choice: quitter Rome
  alternative: être expulsés de Rome
  rationale: Le grec parle littéralement de séparation d’avec Rome. Le contexte implique un ordre impérial, mais la voix et le verbe ne nécessitent pas d’expliciter « expulser » dans le texte principal.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms suivent leurs formes françaises usuelles dans la tradition biblique francophone : Aquilas, Priscille et Claude. La ponctuation sépare la rencontre de la démarche de Paul afin d’éviter une phrase excessivement chargée.'
