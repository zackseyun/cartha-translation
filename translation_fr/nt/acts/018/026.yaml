id: ACT.18.26
reference: Acts 18:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: fr
  text: Il se mit à parler avec assurance dans la synagogue. Après l’avoir entendu, Priscille et Aquilas le prirent avec eux[a] et lui exposèrent plus exactement la voie de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prirent à part » ou « l’accueillirent ». Le verbe grec peut exprimer aussi bien le fait de prendre quelqu’un avec soi que celui de l’accueillir.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: Il se mit
  rationale: Le pronom renvoie naturellement à Apollos dans le contexte. « Se mit à » rend avec naturel le commencement exprimé par ἤρξατο, tandis que τέ assure une liaison légère qu’il n’est pas nécessaire de marquer séparément en français.
- source_word: παρρησιάζεσθαι
  choice: à parler avec assurance
  rationale: Le verbe désigne une parole ouverte, libre et courageuse. « Avec assurance » est idiomatique, digne et ne suggère pas une témérité déplacée.
- source_word: ἐν τῇ συναγωγῇ
  choice: dans la synagogue
  rationale: Rendu locatif direct et usuel.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: Après l’avoir entendu
  rationale: Le participe a ici une valeur temporelle. Le développement marqué par δέ ressort naturellement de l’enchaînement français sans qu’un « mais » potentiellement trop contrastif soit nécessaire.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: Priscille et Aquilas
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables des noms grecs Πρίσκιλλα et Ἀκύλας.
- source_word: προσελάβοντο αὐτὸν
  choice: le prirent avec eux
  rationale: Le moyen προσελάβοντο peut exprimer le fait de prendre quelqu’un avec soi, de l’accueillir ou, selon le contexte, de le prendre à part. Le choix principal conserve l’idée de rapprochement sans transformer explicitement la scène en entretien privé.
- source_word: ἀκριβέστερον
  choice: plus exactement
  rationale: Le comparatif indique que l’explication apportée est plus précise ou plus exacte que la connaissance antérieure d’Apollos, sans affirmer qu’elle était entièrement fausse.
- source_word: ἐξέθεντο
  choice: exposèrent
  rationale: Dans ce contexte, le moyen de ἐκτίθημι signifie présenter ou expliquer en détail. « Exposèrent » reste clair tout en reflétant l’idée d’un développement ordonné.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: la voie de Dieu
  rationale: Le calque naturel préserve l’expression ancienne et son amplitude possible, sans la réduire explicitement à une doctrine, à une morale ou à une désignation technique du christianisme.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif est rendu naturellement comme complément indirect de « exposèrent ».
theological_decisions:
- issue: Nature de l’action de Priscille et Aquilas envers Apollos
  choice: ils le prirent avec eux pour lui donner une explication plus exacte
  alternative: ils le prirent à part; ils l’accueillirent
  rationale: Le verbe permet plusieurs nuances. « Le prirent avec eux » préserve davantage son étendue lexicale, tandis que la proposition suivante indique clairement l’instruction qui en résulte, sans imposer l’idée d’une réprimande publique ni celle d’une structure d’autorité ecclésiale.
- issue: Sens de « la voie de Dieu »
  choice: maintien de l’expression générale du texte
  alternative: le message chrétien complet; la manière morale de vivre voulue par Dieu
  rationale: Le contexte oriente vers le message et la voie associés à la foi chrétienne, mais l’expression elle-même reste assez large. La traduction n’en fixe donc pas davantage le contenu théologique.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation évite les archaïsmes, conserve le comparatif « plus exactement » et maintient l’ambiguïté réelle de προσελάβοντο au moyen d’une note.
