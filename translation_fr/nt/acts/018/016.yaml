  text: And he drove them away from the judgment seat[a].
translation:
  language: fr
  text: Et il les chassa du tribunal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loin du siège du juge » ; le grec βῆμα désigne le siège ou l’estrade judiciaire officielle du magistrat et peut, dans ce contexte, désigner le tribunal.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Le simple « Et » conserve l’enchaînement narratif de καί sans ajouter une nuance causale ou temporelle.
- source_word: ἀπήλασεν
  choice: chassa
  rationale: Le verbe exprime ici une éviction ferme sous l’autorité de Gallion. « Chassa » garde cette force mieux que « renvoya », tout en restant naturel et concis.
- source_word: αὐτοὺς
  choice: les
  rationale: Le pronom reprend les personnes présentes dans le contexte sans préciser davantage leur identité.
- source_word: ἀπὸ τοῦ βήματος
  choice: du tribunal
  rationale: Dans ce contexte judiciaire, βῆμα désigne le siège ou l’estrade officielle du magistrat et, par extension contextuelle, le lieu où il rend la justice. « Du tribunal » exprime naturellement en français leur expulsion de l’audience.
