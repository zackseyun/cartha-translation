id: ACT.18.19
reference: Acts 18:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀κατήντησαν δὲ εἰς Ἔφεσον, κἀκείνους κατέλιπεν αὐτοῦ, αὐτὸς δὲ εἰσελθὼν εἰς τὴν συναγωγὴν ⸀διελέξατο τοῖς Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: fr
  text: Ils arrivèrent à Éphèse et il les y laissa[a]. Quant à lui, il entra dans la synagogue et s’entretint avec les Juifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de Priscille et d’Aquilas, mentionnés au verset précédent.
    reason: cross_reference
  - marker: b
    text: Ou « discuta avec les Juifs ». Le verbe grec évoque un échange raisonné.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: arrivèrent à
  rationale: Le verbe exprime l’arrivée à une destination; « arriver à Éphèse » est naturel et précis en français moderne.
- source_word: κἀκείνους κατέλιπεν αὐτοῦ
  choice: et il les y laissa
  rationale: La tournure conserve le pronom renvoyant aux compagnons mentionnés au verset précédent, tandis que « y » rend explicitement la valeur locale de αὐτοῦ.
- source_word: αὐτὸς δὲ
  choice: Quant à lui
  rationale: Cette formulation marque l’emphase et le contraste entre l’action personnelle de Paul et le fait que ses compagnons restent à Éphèse.
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: il entra dans la synagogue
  rationale: Le participe grec fournit l’action préalable liée au verbe principal; une proposition coordonnée est plus naturelle en français.
- source_word: διελέξατο
  choice: s’entretint avec
  rationale: Le verbe désigne ici un échange raisonné. « S’entretint avec » préserve le caractère conversationnel sans suggérer nécessairement une dispute.
- source_word: τοῖς Ἰουδαίοις
  choice: les Juifs
  rationale: Rendu direct de la désignation ethno-religieuse du texte, sans la restreindre aux dirigeants.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme marqué. « Quant à lui » préserve l’emphase de αὐτός; « s’entretint » rend la discussion raisonnée de manière naturelle et non excessivement conflictuelle.
