id: ACT.18.28
reference: Acts 18:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: fr
  text: En effet, il réfutait avec force les Juifs en public, démontrant par les Écritures que Jésus est le Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que le Messie est Jésus ». La proposition infinitive grecque peut être rendue selon l’un ou l’autre ordre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐτόνως
  choice: avec force
  rationale: L’adverbe exprime la vigueur et la force persuasive de l’argumentation; cette tournure est naturelle en français moderne.
- source_word: διακατηλέγχετο
  choice: il réfutait
  rationale: Le verbe désigne une réfutation poussée ou convaincante. L’imparfait français rend naturellement l’action continue ou répétée de l’imparfait grec.
- source_word: τοῖς Ἰουδαίοις
  choice: les Juifs
  rationale: Traduction directe du groupe au datif, qui désigne ici les interlocuteurs juifs auxquels Apollos s’opposait dans le débat.
- source_word: δημοσίᾳ
  choice: en public
  rationale: Rend clairement le cadre public de la réfutation.
- source_word: ἐπιδεικνὺς
  choice: démontrant
  rationale: Le participe précise le moyen de la réfutation et souligne le caractère raisonné et probant de l’argumentation.
- source_word: διὰ τῶν γραφῶν
  choice: par les Écritures
  rationale: διά avec le génitif marque ici le moyen employé; «par» est idiomatique et fidèle en français.
- source_word: τὸν χριστὸν
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre dans un raisonnement fondé sur les Écritures; «Messie» rend explicitement ce sens.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: que Jésus est le Messie
  rationale: Ordre naturel en français; la construction grecque permet aussi de comprendre «que le Messie est Jésus», ambiguïté signalée en note.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot est ici un titre identifié à partir des Écritures, non un élément devenu quasi nominal; «Messie» conserve le contexte juif et scripturaire.
- issue: Ordre prédicatif dans εἶναι τὸν χριστὸν Ἰησοῦν
  choice: que Jésus est le Messie
  alternative: que le Messie est Jésus
  rationale: Les deux formulations représentent la relation prédicative possible dans la proposition infinitive grecque. Le texte principal retient l’ordre français le plus naturel sans supprimer l’autre possibilité, donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. «En effet» rend γάρ en reliant ce verset à l’affirmation précédente; l’imparfait maintient l’aspect duratif du grec.
