id: ACT.18.9
reference: Acts 18:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: fr
  text: 'Le Seigneur dit à Paul pendant la nuit, au moyen d’une vision[a] : « N’aie pas peur, mais continue à parler et ne te tais pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une vision ». Le grec dit littéralement « au moyen d’une vision ».
    reason: Alternative lexicale et précision sur la construction grecque.
lexical_decisions:
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Dans ce contexte de révélation adressée à Paul, le titre désigne très probablement Jésus ressuscité. « Le Seigneur » conserve toutefois le titre exact du grec sans expliciter davantage son référent.
- source_word: ἐν νυκτὶ
  choice: pendant la nuit
  rationale: Cette formulation temporelle est naturelle en français moderne et exprime clairement que la vision a lieu au cours de la nuit.
- source_word: δι’ ὁράματος
  choice: au moyen d’une vision
  rationale: διά suivi du génitif exprime ici le moyen. Cette traduction rend cette valeur instrumentale plus nettement que le simple « dans une vision ».
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Formulation idiomatique et directe en français moderne, qui restitue naturellement la défense grecque.
- source_word: ἀλλὰ λάλει
  choice: mais continue à parler
  rationale: « Continue à parler » fait ressortir l’aspect duratif de l’impératif présent λάλει.
- source_word: καὶ μὴ σιωπήσῃς
  choice: et ne te tais pas
  rationale: Cette défense est naturelle en français et préserve le parallélisme avec l’ordre positif précédent sans surcharger la distinction aspectuelle.
theological_decisions:
- issue: Référent de « le Seigneur »
  choice: Le locuteur est désigné simplement comme « le Seigneur ».
  alternative: « le Seigneur Jésus »
  rationale: Le grec porte ὁ κύριος. Bien que le contexte d’Actes indique très probablement Jésus, ajouter son nom lèverait une implicitation que le texte source maintient.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse divine directe. La formulation conserve le rythme de l’exhortation et la valeur continue de λάλει.
