  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: fr
  text: 'Mais, au moment où Paul allait prendre la parole[a], Gallion dit aux Juifs : « S’il s’agissait de quelque injustice ou d’un acte criminel, ô Juifs, je vous supporterais avec raison[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « allait ouvrir la bouche », expression qui signifie commencer à parler.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous écouterais avec patience ». Le verbe grec signifie proprement « supporter » ou « tolérer »; dans ce contexte judiciaire, il peut évoquer le fait de consentir à entendre leur plainte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: au moment où Paul allait prendre la parole
  rationale: Le génitif absolu avec μέλλω et l’infinitif marque l’imminence. « Prendre la parole » rend naturellement en français l’idée idiomatique d’« ouvrir la bouche » pour commencer à parler.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule signale ici une légère opposition narrative : Paul s’apprête à répondre, mais Gallion intervient avant lui.'
- source_word: Γαλλίων
  choice: Gallion
  rationale: Forme française traditionnelle du nom propre.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: aux Juifs
  rationale: Rend directement les destinataires des paroles sans ajouter l’explication contextuelle « accusateurs ».
- source_word: Εἰ μὲν ἦν
  choice: S’il s’agissait de
  rationale: Formulation française naturelle pour introduire la condition irréelle ou hypothétique posée par Gallion; μέν prépare le contraste poursuivi au verset suivant sans nécessiter ici de mot distinct.
- source_word: ἀδίκημά τι
  choice: quelque injustice
  rationale: ἀδίκημα désigne un tort ou un acte injuste, avec une possible portée juridique. « Injustice » conserve cette ampleur sans préciser indûment la catégorie légale.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: un acte criminel
  rationale: Le substantif désigne une mauvaise action ou un méfait, et l’adjectif πονηρόν en souligne le caractère mauvais. « Acte criminel » transmet clairement la gravité judiciaire de l’expression en français actuel.
- source_word: ὦ Ἰουδαῖοι
  choice: ô Juifs
  rationale: Le vocatif ὦ est conservé afin de rendre l’interpellation rhétorique et solennelle de Gallion.
- source_word: κατὰ λόγον
  choice: j’aurais de bonnes raisons de
  rationale: L’expression signifie « à juste titre », « raisonnablement » ou « avec raison ». Cette tournure s’intègre naturellement à la phrase française.
- source_word: ἀνεσχόμην ὑμῶν
  choice: vous écouter patiemment
  rationale: ἀνέχομαι signifie supporter ou prendre sur soi. Dans ce contexte judiciaire, il s’agit de consentir à entendre leur plainte; la formulation française explicite légèrement ce référent contextuel tout en conservant l’idée de patience contrainte.
