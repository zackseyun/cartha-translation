translation_notes:
  register: Français international moderne, naturel et digne. Le tour « prendre la parole » évite un calque peu idiomatique, tandis que « ô Juifs » conserve la force du vocatif grec. La formulation judiciaire reste générale afin de ne pas imposer au texte des catégories pénales modernes trop précises.
