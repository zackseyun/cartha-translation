source:
  edition: SBLGNT
  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: fr
  text: Comme il était du même métier, il resta chez eux et travailla, car ils étaient fabricants de tentes[a] de métier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « artisans du cuir » ; le terme grec peut désigner plus largement des personnes qui fabriquaient des tentes ou exerçaient un métier artisanal apparenté.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: Comme il exerçait le même métier
  rationale: La construction διά avec l’infinitif substantivé exprime ici la cause. Cette formulation naturelle indique que Paul partageait le métier d’Aquilas et Priscille sans nommer celui-ci avant la proposition explicative.
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: il resta chez eux
  rationale: μένω signifie « rester » ou « demeurer »; avec παρ’ αὐτοῖς, « chez eux » exprime naturellement en français le fait que Paul résidait auprès d’eux.
- source_word: ἠργάζετο
  choice: travailla avec eux
  rationale: ἐργάζομαι désigne ici l’exercice d’un travail manuel. Le contexte permet d’expliciter « avec eux », puisque leur métier commun explique à la fois le séjour et le travail; le passé simple convient au récit, même si l’imparfait grec présente l’activité dans sa durée.
- source_word: σκηνοποιοὶ
  choice: fabricants de tentes
  rationale: Le sens traditionnel et le plus probable est celui d’artisans fabriquant des tentes. La possibilité plus large d’ouvriers du cuir est conservée en note.
- source_word: τῇ τέχνῃ
  choice: de métier
  rationale: τέχνη désigne ici le métier ou l’artisanat. « De métier » précise de façon idiomatique qu’il s’agissait de leur activité professionnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Fabricants de tentes » est plus courant et transparent que « faiseurs de tentes ». La répétition de « métier » reflète la progression du grec tout en restant compréhensible.
