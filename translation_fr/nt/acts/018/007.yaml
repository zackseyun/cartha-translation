id: ACT.18.7
reference: Acts 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: fr
  text: Puis il quitta cet endroit et entra chez un homme nommé Titius Justus, qui adorait Dieu[a]. Sa maison était contiguë à la synagogue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui craignait Dieu » ou « qui révérait Dieu ». Le grec décrit ici un non-Juif attaché au Dieu d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Ou « jouxtait la synagogue » ou « partageait une limite avec la synagogue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: il quitta cet endroit
  rationale: Le participe aoriste suivi de l’adverbe indique que Paul s’éloigne du lieu mentionné auparavant. Cette formulation est naturelle en français et conserve la succession des actions.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: entra chez un homme
  rationale: En français, « entrer chez quelqu’un » exprime naturellement l’entrée dans sa maison sans alourdir la phrase.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: nommé Titius Justus
  rationale: Formulation française courante qui conserve la translittération des deux éléments du nom attestés dans le texte grec.
- source_word: σεβομένου τὸν θεόν
  choice: qui adorait Dieu
  rationale: Le participe décrit la dévotion de cet homme envers le Dieu d’Israël. « Adorait Dieu » reste descriptif et évite d’imposer dans le texte principal une catégorie socioreligieuse technique.
- source_word: συνομοροῦσα
  choice: était contiguë à
  rationale: Le terme indique que la maison touchait la synagogue ou partageait une limite avec elle. « Contiguë à » préserve cette précision spatiale dans un registre digne.
- source_word: τῇ συναγωγῇ
  choice: la synagogue
  rationale: Équivalent français usuel dans ce contexte narratif.
theological_decisions:
- issue: Portée de σεβόμενος τὸν θεόν
  choice: qui adorait Dieu
  alternative: qui craignait Dieu ; un adorateur de Dieu
  rationale: Le grec signale clairement la dévotion au Dieu d’Israël, mais ne contraint pas à employer dans le corps du texte l’étiquette semi-technique « craignant-Dieu ». La traduction descriptive maintient cette ouverture.
translation_notes:
  register: Français international moderne, narratif et digne. La première proposition évite un calque pesant du participe grec. La division en deux phrases supprime l’enchaînement maladroit de deux relatives tout en conservant clairement Titius Justus comme possesseur de la maison.
