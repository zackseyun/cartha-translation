  variant: modern international French
source:
  edition: SBLGNT
  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: fr
  text: Chaque sabbat, il discutait[a] dans la synagogue et cherchait à persuader des Juifs et des Grecs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « débattait » ou « raisonnait avec les gens ». Le verbe grec peut désigner un dialogue raisonné ou une argumentation.
    reason: lexical_alternative
  - marker: b
    text: Ou « non-Juifs ». Le grec dit littéralement « Grecs » ; dans ce contexte, certains y voient des non-Juifs associés à la synagogue.
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: il discutait
  rationale: L’imparfait exprime une activité répétée, tandis que le verbe désigne ici un échange raisonné pouvant comporter argumentation et débat. « Discutait » reste naturel en français et n’implique pas une simple conversation informelle dans ce contexte.
- source_word: δὲ
  choice: non traduit séparément
  rationale: La particule assure ici une transition narrative légère. La continuité se rend naturellement en français sans connecteur explicite.
- source_word: ἐν τῇ συναγωγῇ
  choice: dans la synagogue
  rationale: Rendu locatif direct de ἐν avec le datif.
- source_word: κατὰ πᾶν σάββατον
  choice: chaque sabbat
  rationale: κατά avec πᾶν a une valeur distributive; l’expression française marque clairement la répétition régulière.
- source_word: ἔπειθέν
  choice: cherchait à convaincre
  rationale: L’imparfait présente une action continue ou répétée. Cette formulation exprime l’effort de persuasion sans affirmer que tous les auditeurs furent effectivement convaincus.
- source_word: τε
  choice: et
  rationale: La conjonction relie naturellement l’activité de persuasion à celle qui précède.
- source_word: Ἰουδαίους
  choice: des Juifs
  rationale: Le terme désigne ici les Juifs comme groupe ethnoreligieux, non spécifiquement les habitants de la Judée.
- source_word: Ἕλληνας
  choice: des Grecs
  rationale: Le sens lexical précis est conservé plutôt que généralisé en « non-Juifs »; le contexte de la synagogue permet une association avec celle-ci sans l’énoncer explicitement.
theological_decisions:
- issue: Identité des Ἕλληνας dans le contexte de la synagogue
  choice: des Grecs
  alternative: des non-Juifs; des Grecs qui adoraient Dieu
  rationale: Le texte dit simplement « Grecs ». Il ne les qualifie pas explicitement de craignant-Dieu; la traduction conserve donc cette indétermination.
- issue: Portée de l’imparfait ἔπειθέν
  choice: cherchait à convaincre
  alternative: convainquait; s’efforçait de persuader
  rationale: Cette formulation préserve l’aspect continu de l’action sans transformer l’effort de Paul en résultat nécessairement obtenu.
translation_notes:
  register: Français international moderne, clair et digne. L’antéposition de « Chaque sabbat » allège la phrase et met en valeur la répétition. « Discutait » est pris dans son sens de débat raisonné, explicité en note; « cherchait à convaincre » évite de surinterpréter l’imparfait comme la réussite systématique de la persuasion.
