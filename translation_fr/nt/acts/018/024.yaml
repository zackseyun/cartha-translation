  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: fr
  text: Un Juif nommé Apollos, originaire d’Alexandrie, un homme éloquent[a] et très versé dans les Écritures, arriva à Éphèse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : homme instruit. Le mot grec peut désigner soit l’éloquence, soit l’érudition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Juif
  rationale: Le terme désigne ici l’appartenance ethnoreligieuse d’Apollos, et non simplement son origine géographique judéenne.
- source_word: δέ
  choice: non rendu explicitement
  rationale: La particule assure une transition narrative légère ; en français, l’enchaînement se fait naturellement sans ajouter « Or » ou « Alors ».
- source_word: τις
  choice: Un
  rationale: L’article indéfini introduit naturellement un nouveau personnage en français ; « un certain » serait ici inutilement marqué.
- source_word: Ἀπολλῶς ὀνόματι
  choice: nommé Apollos
  rationale: Cette formulation rend de manière idiomatique l’expression grecque qui introduit le nom du personnage.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: originaire d’Alexandrie
  rationale: La phrase indique l’origine d’Apollos. Cette tournure moderne évite les connotations ambiguës de « de race alexandrine ».
- source_word: ἀνὴρ λόγιος
  choice: homme éloquent
  rationale: « Homme » respecte la référence masculine explicite. λόγιος peut désigner l’éloquence ou l’instruction ; « éloquent » convient au contexte, tandis que l’autre sens est signalé en note.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: arriva à Éphèse
  rationale: Le verbe exprime l’arrivée à une destination ; « arriver à » est la construction française naturelle avec un nom de ville.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: très versé dans les Écritures
  rationale: Cette expression française naturelle communique la grande compétence d’Apollos à l’égard des Écritures sans suggérer une puissance physique.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la présentation progressive d’Apollos tout en évitant un calque lourd du participe grec.
