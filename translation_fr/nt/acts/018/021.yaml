  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: fr
  text: 'Mais il prit congé d’eux en disant[a] : « Je reviendrai auprès de vous, si Dieu le veut[b]. » Il prit la mer d’Éphèse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « en disant : “Je reviendrai auprès de vous, si Dieu le veut.” »'
