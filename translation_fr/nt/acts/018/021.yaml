  - marker: b
    text: 'Ou : « Dieu voulant. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec la demande précédente de rester plus longtemps.
- source_word: ἀποταξάμενος
  choice: il prit congé d’eux
  rationale: Rend naturellement le participe aoriste moyen exprimant le fait de prendre congé.
- source_word: καὶ εἰπών
  choice: en disant
  rationale: Intègre en français courant le second participe grec à la séquence narrative.
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: Je reviendrai auprès de vous
  rationale: Préserve l’idée d’un retour vers les destinataires sans redondance inutile.
- source_word: τοῦ θεοῦ θέλοντος
  choice: si Dieu le veut
  rationale: Rend le génitif absolu comme une condition explicite et maintient la référence précise à Dieu.
- source_word: ἀνήχθη
  choice: il prit la mer
  rationale: Dans un récit de voyage, le verbe possède ici son sens nautique de partir par mer.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: depuis Éphèse
  rationale: Exprime le lieu de départ tout en s’intégrant naturellement à la locution « prendre la mer ».
theological_decisions:
- issue: La volonté divine conditionne le projet de voyage de Paul
  choice: si Dieu le veut
  alternative: Dieu voulant
  rationale: Le grec nomme explicitement Dieu et présente le retour projeté comme dépendant de sa volonté; la traduction n’introduit ni « Seigneur » ni une certitude absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Prendre congé » et « prendre la mer » conservent une légère tenue narrative sans être archaïques; « si Dieu le veut » est clair et idiomatique.
