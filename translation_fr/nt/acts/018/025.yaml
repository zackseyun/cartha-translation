source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: fr
  text: Cet homme avait été instruit dans la voie du Seigneur et, fervent d’esprit[a], il parlait et enseignait avec exactitude ce qui concernait Jésus, ne connaissant que le baptême de Jean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fervent dans l’Esprit » ; il pourrait alors s’agir de l’Esprit saint plutôt que de l’esprit d’Apollos.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: avait été instruit
  rationale: Le participe parfait passif exprime une instruction reçue antérieurement dont les effets demeurent. « Avait été instruit » est naturel et évite les connotations ecclésiales plus tardives de « catéchisé ».
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: dans la voie du Seigneur
  rationale: Cette formulation conserve l’image et l’expression chrétienne ancienne de « la voie », ainsi que le titre « Seigneur » pour κύριος.
- source_word: ζέων τῷ πνεύματι
  choice: plein d’ardeur dans son esprit
  rationale: ζέων évoque une ferveur brûlante. Cette formulation française exprime naturellement l’intensité et retient dans le texte principal le sens possible de l’ardeur intérieure, sans écarter l’interprétation référant à l’Esprit saint, signalée en note.
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: il parlait et enseignait
  rationale: Les imparfaits décrivent une activité en cours ou habituelle. « Parlait » traduit directement λαλέω sans le préciser en « proclamait ».
- source_word: ἀκριβῶς
  choice: avec exactitude
  rationale: L’expression indique ici la justesse et la précision de l’enseignement, tout en laissant subsister le contraste avec la connaissance limitée mentionnée ensuite.
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: ce qui concernait Jésus
  rationale: Cette traduction idiomatique conserve l’étendue générale de l’expression grecque sans en restreindre le contenu.
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: tout en ne connaissant que le baptême de Jean
  rationale: La tournure participiale est rendue sans en faire une proposition pleinement concessive avec « bien que ». « Tout en » marque naturellement la circonstance concomitante et le contraste narratif, tandis que « le baptême de Jean » suit la structure grecque.
theological_decisions:
- issue: Sens de τῷ πνεύματι dans ζέων τῷ πνεύματι
  choice: l’esprit humain ou la ferveur intérieure d’Apollos
  alternative: l’Esprit saint
  rationale: Le grec permet les deux compréhensions et ne comporte pas de distinction graphique imposant l’une d’elles. Le texte principal retient une lecture idiomatique possible, tandis que la note préserve explicitement l’autre lecture afin de ne pas supprimer la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du grec sans devenir artificielle ; « la voie du Seigneur » préserve l’idiome ancien, et la note maintient l’ambiguïté de πνεῦμα.
