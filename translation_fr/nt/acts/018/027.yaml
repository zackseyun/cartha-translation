source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: fr
  text: Alors qu’il souhaitait passer en Achaïe, les frères[a] l’encouragèrent et écrivirent aux disciples de lui faire bon accueil. À son arrivée, il apporta une aide considérable à ceux qui avaient cru par la grâce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « frères » peut désigner ici l’ensemble de la communauté croyante, y compris les femmes, bien que le grec emploie une forme masculine.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « À son arrivée, il apporta, par la grâce, une aide considérable à ceux qui avaient cru ». En grec, l’expression « par la grâce » peut se rapporter à l’aide apportée par Apollos plutôt qu’au fait que ces personnes avaient cru.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: Comme il voulait
  rationale: Le génitif absolu exprime ici une circonstance liée au projet volontaire d’Apollos. « Comme il voulait » est naturel en français et conserve la nuance de volonté.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: passer en Achaïe
  rationale: Le verbe peut évoquer la traversée depuis Éphèse vers l’Achaïe. « Passer en Achaïe » garde cette nuance de déplacement sans alourdir la phrase.
- source_word: προτρεψάμενοι
  choice: l’encouragèrent
  rationale: Le participe désigne un encouragement ou une exhortation favorable. « Encouragèrent » convient au contexte de soutien fraternel.
- source_word: οἱ ἀδελφοὶ
  choice: les frères
  rationale: La forme masculine du grec est conservée. Dans l’usage chrétien ancien, elle peut désigner plus largement la communauté croyante, y compris des femmes, ce qu’indique la note.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: écrivirent aux disciples
  rationale: Cette formulation rend directement le verbe γράφω suivi du datif et conserve le terme lucanien « disciples ».
- source_word: ἀποδέξασθαι αὐτόν
  choice: de lui faire bon accueil
  rationale: L’expression traduit de façon idiomatique l’idée de recevoir Apollos favorablement et avec hospitalité.
- source_word: ὃς παραγενόμενος
  choice: Une fois arrivé
  rationale: Cette tournure reprend clairement Apollos et exprime la relation temporelle portée par le participe.
- source_word: συνεβάλετο πολὺ
  choice: il a beaucoup aidé
  rationale: Dans ce contexte, le moyen συμβάλλω exprime une aide importante apportée à d’autres. La formulation est claire, actuelle et proche de l’intensité de πολὺ.
- source_word: τοῖς πεπιστευκόσιν
  choice: ceux qui avaient cru
  rationale: Le participe parfait présente la foi comme acquise antérieurement à l’arrivée d’Apollos; le plus-que-parfait français préserve cette relation.
- source_word: διὰ τῆς χάριτος
  choice: par la grâce
  rationale: La formule concise conserve l’absence de complément explicite tel que « de Dieu ». Dans le texte principal, elle se rattache à l’acte de croire, tout en laissant l’autre construction en note.
theological_decisions:
- issue: Rattachement de διὰ τῆς χάριτος
  choice: 'La formule qualifie ceux qui avaient cru : « ceux qui avaient cru par la grâce » .'
  alternative: 'La formule peut qualifier l’aide d’Apollos : « par la grâce, il a beaucoup aidé ceux qui avaient cru » .'
  rationale: Le rattachement à l’acte de croire paraît le plus naturel sur les plans syntaxique et contextuel, mais le grec permet réellement de relier la formule à l’aide apportée par Apollos. La note préserve cette ambiguïté sans l’effacer.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple est employé pour les actions narratives initiales, puis le passé composé dans la nouvelle proposition afin de garder une lecture courante; le vocabulaire ecclésial standard (« frères », « disciples », « grâce ») est conservé. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
