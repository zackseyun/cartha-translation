id: ACT.18.12
reference: Acts 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: fr
  text: Mais alors que Gallion était proconsul de l’Achaïe, les Juifs[a] s’en prirent tous ensemble à Paul et l’amenèrent devant le tribunal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit ici du groupe juif local qui agit contre Paul, et non de tous les Juifs sans exception.
    reason: cultural_note
  - marker: b
    text: Ou «devant le siège du juge». Le terme grec désigne l’estrade ou le siège officiel où un magistrat rendait ses jugements.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: Gallion
  rationale: Forme française traditionnelle et courante du nom propre latin Gallio.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une transition narrative comportant un léger contraste avec ce qui précède.
- source_word: ἀνθυπάτου ὄντος
  choice: alors que … était proconsul
  rationale: Rend naturellement en français la proposition temporelle au génitif absolu.
- source_word: ἀνθύπατος
  choice: proconsul
  rationale: Conserve le titre précis du magistrat qui administrait cette province romaine.
- source_word: Ἀχαΐας
  choice: l’Achaïe
  rationale: Nom français usuel de la province romaine d’Achaia.
- source_word: κατεπέστησαν
  choice: s’en prirent … à
  rationale: Exprime l’action hostile dirigée contre Paul sans ajouter l’idée non explicite d’une agression physique.
- source_word: ὁμοθυμαδὸν
  choice: tous ensemble
  rationale: Rend clairement l’action concertée du groupe dans un français actuel.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Suit le libellé explicite du grec sans le restreindre arbitrairement aux seuls dirigeants; une note prévient toutefois une généralisation abusive.
- source_word: τῷ Παύλῳ
  choice: à Paul
  rationale: Complément requis en français par la locution hostile «s’en prendre à».
- source_word: ἤγαγον αὐτὸν
  choice: l’amenèrent
  rationale: Rend le sens général de conduire ou amener dans ce cadre judiciaire, sans introduire la violence suggérée par «traîner».
- source_word: ἐπὶ τὸ βῆμα
  choice: devant le tribunal
  rationale: Communique clairement la comparution devant l’instance judiciaire représentée par l’estrade ou le siège officiel du magistrat.
theological_decisions:
- issue: Portée de οἱ Ἰουδαῖοι dans un récit de conflit
  choice: les Juifs
  alternative: les chefs juifs; les Judéens
  rationale: Le grec désigne explicitement «les Juifs» sans préciser qu’il s’agit uniquement de chefs. La traduction conserve cette formulation, tandis qu’une note précise qu’elle vise ici le groupe juif local qui agit contre Paul et non l’ensemble du peuple juif.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le titre administratif romain précis, rend l’hostilité collective sans exagérer sa violence et clarifie discrètement les deux expressions susceptibles d’être mal comprises.
