source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: fr
  text: Après être resté encore de nombreux jours, Paul prit congé des frères[a] et s’embarqua pour la Syrie avec Priscille et Aquilas, après s’être fait couper les cheveux à Cenchrées[b][c], car il était tenu par un vœu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » désigne probablement l’ensemble de la communauté des croyants, femmes comprises.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « après s’être fait tondre la tête ». Le verbe grec peut désigner le fait de couper ou de tondre les cheveux, sans indiquer nécessairement un rasage complet.'
    reason: lexical_alternative
  - marker: c
    text: Certains rapportent cette coupe de cheveux à Aquilas plutôt qu’à Paul, mais la construction grecque renvoie plus naturellement à Paul.
    reason: alternative_reading
  - marker: d
    text: Le texte dit seulement « un vœu » ; il ne précise pas qu’il s’agissait d’un vœu de naziréat.
    reason: cultural_note
lexical_decisions:
- source_word: ἔτι προσμείνας ἡμέρας ἱκανὰς
  choice: resta encore bien des jours
  rationale: « Encore » rend ἔτι, tandis que « bien des jours » exprime naturellement la durée considérable indiquée par ἡμέρας ἱκανὰς. Le participe aoriste est rendu par une proposition indépendante pour garder une phrase française fluide.
- source_word: τοῖς ἀδελφοῖς
  choice: des frères
  rationale: Le terme familial masculin du grec est conservé dans le texte principal; une note précise sa portée probablement communautaire et inclusive dans ce contexte.
- source_word: ἀποταξάμενος
  choice: il prit congé
  rationale: Le moyen ἀποτάσσομαι signifie ici prendre congé ou faire ses adieux. « Prendre congé » est actuel, digne et précis.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: s’embarqua pour la Syrie
  rationale: ἐκπλέω désigne le départ par mer. « S’embarquer pour » exprime à la fois le voyage maritime et la destination.
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: accompagné de Priscille et d’Aquilas
  rationale: Cette formulation française rattache clairement les deux compagnons au voyage de Paul sans alourdir la phrase. Les formes françaises usuelles des noms propres sont retenues.
- source_word: κειράμενος … τὴν κεφαλήν
  choice: il se fit couper les cheveux
  rationale: κείρω peut désigner le fait de couper ou de tondre les cheveux sans imposer nécessairement un rasage complet. La construction pronominale causative rend naturellement l’action subie ou commandée par le sujet.
- source_word: ἐν Κεγχρεαῖς
  choice: À Cenchrées
  rationale: « Cenchrées » est la forme française traditionnelle du nom du port; « à » convient naturellement à un nom de lieu.
- source_word: εἶχεν γὰρ εὐχήν
  choice: car il était lié par un vœu
  rationale: L’expression indique qu’un vœu engageait le sujet. Cette traduction est plus claire en français que le calque « il avait un vœu », sans préciser indûment la nature du vœu.
theological_decisions:
- issue: Référent de κειράμενος (« s’étant fait couper les cheveux »)
  choice: L’action est attribuée à Paul.
  alternative: Certains comprennent que l’action se rapporte à Aquilas.
  rationale: Le participe masculin singulier se rattache le plus naturellement à Paul, sujet principal de la phrase. La proximité du nom d’Aquilas a néanmoins suscité une autre lecture, conservée en note.
- issue: Nature du vœu (εὐχή)
  choice: Le texte parle simplement d’un « vœu ».
  alternative: Un vœu de type naziréen.
  rationale: Le verset ne qualifie pas le vœu. Le préciser comme naziréen introduirait une identification possible, mais non explicitement formulée par le texte.
translation_notes:
  register: Français international moderne, clair et digne. La longue période grecque est divisée en phrases plus naturelles, tout en conservant l’enchaînement des actions. Le choix « couper les cheveux » évite de transformer une possibilité lexicale en rasage certain; les ambiguïtés interprétatives réelles sont signalées en notes.
