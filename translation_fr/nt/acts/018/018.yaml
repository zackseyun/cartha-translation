    issue: Ordre temporel potentiellement trompeur de la coupe des cheveux
    rationale: La division en deux phrases fait suivre la coupe de l’embarquement dans la narration française. Or κειράμενος est un participe aoriste dépendant du sujet Paul et son action est normalement antérieure au départ exprimé par ἐξέπλει.
  - severity: low
    issue: Formulation légèrement moins idiomatique pour l’effet du vœu
    rationale: « Être lié par un vœu » est possible, mais « être tenu par un vœu » est plus naturel et conserve la portée générique de εἶχεν ... εὐχήν.
