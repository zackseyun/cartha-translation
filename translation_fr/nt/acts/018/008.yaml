reference: Acts 18:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: fr
  text: Mais Crispus, le responsable de la synagogue, crut au Seigneur avec toute sa maisonnée. Et beaucoup de Corinthiens, en écoutant, croyaient et se faisaient baptiser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus idiomatique : « beaucoup de Corinthiens qui écoutaient croyaient et se faisaient baptiser ». Les imparfaits grecs présentent leur réponse comme un mouvement en cours ou répété.'
    reason: alternative stylistique et aspectuelle
lexical_decisions:
- source_word: Κρίσπος
  choice: Crispus
  rationale: Nom propre rendu selon sa forme française traditionnelle et courante.
- source_word: ἀρχισυνάγωγος
  choice: le responsable de la synagogue
  rationale: Expression naturelle en français moderne pour désigner le dirigeant ou principal responsable de la synagogue, sans préciser davantage ses fonctions administratives.
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: crut au Seigneur
  rationale: Le passé simple rend l’acte ponctuel exprimé par l’aoriste; « croire au Seigneur » est idiomatique et conserve le titre κύριος sans l’expliciter.
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: avec toute sa maisonnée
  rationale: « Maisonnée » désigne ici l’ensemble du foyer plutôt que le bâtiment et préserve la portée de ὅλῳ.
- source_word: πολλοὶ τῶν Κορινθίων
  choice: beaucoup de Corinthiens
  rationale: Rend naturellement le génitif partitif, c’est-à-dire un grand nombre parmi les Corinthiens.
- source_word: ἀκούοντες
  choice: en entendant le message
  rationale: Le participe présent indique une action concomitante. « Le message » explicite sobrement l’objet sous-entendu par le contexte afin d’éviter une tournure française incomplète.
- source_word: ἐπίστευον
  choice: venaient à la foi
  rationale: Cette tournure française naturelle traduit la réponse progressive ou répétée présentée par l’imparfait grec, sans l’aplatir en événement collectif unique.
- source_word: ἐβαπτίζοντο
  choice: se faisaient baptiser
  rationale: Rend à la fois la valeur imperfective et la réception du baptême exprimée par la forme passive grecque.
theological_decisions:
- issue: Portée de la foi de la maisonnée
  choice: Conserver la formulation collective « avec toute sa maisonnée » sans détailler la manière dont chaque membre a cru.
  alternative: Préciser que chacun des membres de la maisonnée a personnellement cru, ou comprendre la phrase uniquement comme un résumé collectif.
  rationale: Le grec associe toute la maisonnée à la foi de Crispus, mais n’en décrit pas les modalités individuelles; la traduction ne tranche donc pas une question que le texte laisse ouverte.
- issue: Référent de « Seigneur »
  choice: Traduire κύριος par « Seigneur » sans ajouter « Jésus ».
  alternative: « le Seigneur Jésus »
  rationale: Dans le contexte des Actes, le titre renvoie vraisemblablement à Jésus, mais le texte grec emploie seulement κύριος; la traduction conserve cette forme.
- issue: Relation entre l’écoute, la foi et le baptême
  choice: 'Présenter les réponses comme répétées ou successives: « venaient à la foi et se faisaient baptiser ».'
  alternative: « quand ils entendaient, croyaient et étaient baptisés » ou, plus ponctuellement, « après avoir entendu, crurent et furent baptisés ».
  rationale: Les imparfaits ἐπίστευον et ἐβαπτίζοντο dépeignent un mouvement en cours parmi de nombreux Corinthiens; le français doit rester naturel tout en préservant cette progression.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple « crut » convient au registre narratif biblique sans archaïsme marqué; les imparfaits grecs sont rendus par des périphrases naturelles qui soulignent une réponse en cours. Le marqueur [a] figure dans le texte principal.
