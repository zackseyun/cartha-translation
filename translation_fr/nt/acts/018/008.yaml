revisions:
- from: Mais Crispus, le responsable de la synagogue, crut au Seigneur avec toute sa maisonnée. Et beaucoup de Corinthiens, en entendant le message, venaient à la foi et se faisaient baptiser.[a]
  to: Mais Crispus, le responsable de la synagogue, crut au Seigneur avec toute sa maisonnée. Et beaucoup de Corinthiens, en écoutant, croyaient et se faisaient baptiser.[a]
  rationale: La révision rend πιστεύω par « croyaient », plus proche du grec et moins interprétatif que « venaient à la foi ». Elle retire l’objet ajouté « le message » tout en conservant l’action concomitante du participe ἀκούοντες. Les imparfaits grecs sont préservés par « croyaient » et « se faisaient baptiser », et le passif de βαπτίζω reste explicite.
