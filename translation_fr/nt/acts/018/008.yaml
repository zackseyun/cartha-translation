  naturalness: Le registre est moderne et lisible. « Responsable de la synagogue », « maisonnée », « crut au Seigneur » et « se faisaient baptiser » conviennent. La formulation révisée « en écoutant, croyaient » garde une syntaxe française fluide tout en évitant l’ajout de « le message ».
  terminology: « Crispus », « responsable de la synagogue », « Seigneur », « maisonnée » et « se faisaient baptiser » sont appropriés. « Croyaient » rend πιστεύω sans transformer explicitement la foi en un processus de conversion formulé autrement.
