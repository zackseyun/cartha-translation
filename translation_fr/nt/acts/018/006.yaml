reference: Acts 18:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: fr
  text: 'Mais comme ils s’opposaient à lui et tenaient des propos injurieux[a], il secoua ses vêtements et leur dit : « Votre sang soit sur vos têtes[b] ! Moi, j’en suis innocent. Désormais, j’irai vers les non-Juifs[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « blasphémaient ». Le verbe grec peut désigner des paroles blasphématoires ou des propos outrageants ; leur cible n’est pas précisée ici.
    reason: lexical_alternative
  - marker: b
    text: Cette expression signifie que la responsabilité des conséquences retombe sur eux.
    reason: cultural_note
  - marker: c
    text: Littéralement « les nations » ; dans ce contexte, il s’agit des peuples non juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: s’opposaient à lui
  rationale: Le participe décrit leur opposition active à Paul dans le contexte immédiat. Le pronom explicite en français le complément naturellement sous-entendu sans préciser que les paroles injurieuses visaient nécessairement Paul.
- source_word: βλασφημούντων
  choice: tenaient des propos injurieux
  rationale: Le verbe peut désigner des paroles blasphématoires ou outrageantes. Cette formulation naturelle préserve l’indétermination de leur cible et évite d’ajouter « contre lui », absent du grec.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: il secoua ses vêtements
  rationale: Rendu proche du grec et intelligible du geste symbolique par lequel Paul se désolidarise de ses auditeurs.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: Que votre sang retombe sur votre tête !
  rationale: Cette tournure française conserve l’image biblique et le ton solennel de la formule de responsabilité. Le singulier collectif « votre tête » suit le grec, qui emploie κεφαλήν au singulier malgré le pluriel des destinataires.
- source_word: καθαρὸς ἐγώ
  choice: Moi, j’en suis innocent
  rationale: 'L’adjectif « pur » est ici métaphorique : Paul se déclare dégagé de la responsabilité évoquée par la formule précédente. « en » rend ce lien explicite et naturel en français.'
- source_word: ἀπὸ τοῦ νῦν
  choice: Désormais
  rationale: Marque avec concision le changement décisif annoncé par Paul.
- source_word: εἰς τὰ ἔθνη
  choice: vers les non-Juifs
  rationale: Dans ce contraste avec les auditeurs de la synagogue, τὰ ἔθνη désigne les peuples non juifs. « non-Juifs » est clair en français courant, tandis que « nations » reste signalé en note.
- source_word: πορεύσομαι
  choice: j’irai
  rationale: Rend simplement et directement le futur de déplacement et d’orientation missionnaire.
theological_decisions:
- issue: Portée de βλασφημούντων
  choice: Ne pas préciser explicitement la cible des propos injurieux dans le texte
  alternative: « blasphémaient » ou « l’insultaient »
  rationale: Le grec n’exprime aucun complément. Le rendu retenu conserve donc l’ambiguïté entre des paroles blasphématoires et des outrages visant Paul ou son message.
- issue: Formule de responsabilité liée au sang
  choice: Conserver l’image idiomatique comme déclaration solennelle de responsabilité
  alternative: La paraphraser par « Vous serez seuls responsables des conséquences » ou la comprendre comme une malédiction explicite
  rationale: La formule fait peser sur les auditeurs la responsabilité des conséquences de leur refus et dégage Paul de cette responsabilité, sans imposer une lecture plus fortement imprécatoire que le texte.
- issue: καθαρὸς ἐγώ et responsabilité de Paul
  choice: « Moi, j’en suis innocent »
  alternative: « Moi, je suis pur »
  rationale: Le contexte juridique et moral porte sur l’absence de responsabilité de Paul. Le rendu français communique ce sens sans développer davantage la portée théologique de sa déclaration.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la vigueur du récit et la solennité de la déclaration de Paul. Les notes préservent les ambiguïtés lexicales de βλασφημούντων et ἔθνη sans alourdir le texte principal.
