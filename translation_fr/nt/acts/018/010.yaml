id: ACT.18.10
reference: Acts 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: fr
  text: car moi, je suis avec toi, et personne ne s’en prendra à toi pour te faire du mal[a], car j’ai un peuple nombreux dans cette ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « personne ne mettra la main sur toi pour te faire du mal ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « j’ai un peuple nombreux dans cette ville » désigne vraisemblablement des personnes de Corinthe qui appartiennent au Seigneur, y compris celles qui croiront par la suite.
    reason: theological_clarification
lexical_decisions:
- source_word: διότι
  choice: car
  rationale: Introduit dans les deux cas une cause. « Car » convient au registre d’une parole divine et s’enchaîne naturellement avec le verset précédent.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: moi, je suis avec toi
  rationale: Le pronom sujet explicite ἐγώ porte une insistance que la tournure française « moi, je » rend naturellement sans ajouter l’idée de présence physique.
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: personne ne s’en prendra à toi
  rationale: Dans ce contexte, ἐπιτίθημι avec le datif désigne une action hostile. Cette formulation française est naturelle et laisse la proposition suivante préciser le mal recherché.
- source_word: τοῦ κακῶσαί σε
  choice: pour te faire du mal
  rationale: L’infinitif articulé exprime ici le but ou le résultat visé. « Faire du mal » conserve la portée assez large du verbe κακόω.
- source_word: λαός
  choice: un peuple
  rationale: Le singulier collectif « un peuple » reflète directement λαός et conserve sa possible portée d’appartenance à Dieu, sans réduire l’expression à un simple grand nombre d’habitants.
- source_word: ἐστί μοι πολὺς
  choice: j’ai un peuple nombreux
  rationale: La construction avec εἰμί et le datif μοι exprime naturellement la possession. « Nombreux » rend πολύς tout en s’accordant avec le collectif singulier.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: dans cette ville
  rationale: Rendu direct et idiomatique de la localisation et du démonstratif.
theological_decisions:
- issue: Sens de « un peuple nombreux » dans la ville
  choice: Conserver dans le texte la déclaration « j’ai un peuple nombreux », sans préciser si tous croient déjà.
  alternative: Traduire ou expliciter comme désignant uniquement de nombreux futurs croyants, ou seulement des croyants déjà présents.
  rationale: La formulation grecque affirme l’appartenance de ce peuple au Seigneur, mais ne précise pas explicitement le rapport temporel de chaque personne à la foi. La traduction maintient cette tension, tandis qu’une note présente sobrement la compréhension contextuelle probable.
translation_notes:
  register: Français international actuel, naturel et digne. La répétition de « car » suit les deux διότι du grec. « Moi, je » rend l’insistance du pronom grec, et « un peuple nombreux » préserve mieux que « beaucoup de gens » la dimension collective et théologique de λαός.
