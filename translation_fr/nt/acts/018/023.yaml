  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: fr
  text: Après avoir passé quelque temps, il partit et parcourut successivement la région galate et la Phrygie, affermissant tous les disciples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: après avoir passé quelque temps là-bas
  rationale: L’expression idiomatique signifie « passer quelque temps ». « Là-bas » explicite naturellement le lieu mentionné dans le contexte précédent.
- source_word: ἐξῆλθεν
  choice: il partit
  rationale: Dans ce récit de voyage, le verbe désigne le départ d’un lieu plutôt que la simple action de sortir.
- source_word: διερχόμενος καθεξῆς
  choice: parcourut successivement
  rationale: Le participe exprime le déplacement à travers les régions, et καθεξῆς une progression successive. Cette formulation conserve cette nuance sans imposer l’idée de visites dans des localités précises.
- source_word: τὴν Γαλατικὴν χώραν
  choice: la région galate
  rationale: χώρα désigne une région ou un territoire. « Région galate » évite de réduire nécessairement l’expression à la province romaine de Galatie.
- source_word: καὶ Φρυγίαν
  choice: et la Phrygie
  rationale: Le nom géographique traditionnel est conservé; le sens régional ressort du parallélisme avec « la région galate ».
- source_word: στηρίζων
  choice: affermissant
  rationale: Le verbe signifie rendre ferme, fortifier ou affermir. « Affermissant » convient au soutien apporté aux disciples sans préciser indûment sa forme.
- source_word: πάντας τοὺς μαθητάς
  choice: tous les disciples
  rationale: « Disciples » est le terme français établi pour les personnes qui suivent Jésus, et « tous » rend explicitement πάντας.
theological_decisions: []
translation_notes:
  register: 'Français moderne, courant et digne. La syntaxe garde la progression du récit grec, tout en employant des tournures naturelles. Aucune note n’est nécessaire: l’ambiguïté géographique demeure dans « région galate », et καθεξῆς est rendu directement par « successivement ».'
