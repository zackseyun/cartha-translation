  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: fr
  text: Il resta donc là un an et six mois, enseignant parmi eux la parole de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: resta là
  rationale: Le verbe signifie littéralement « s’assit », mais désigne ici, de façon idiomatique, le fait de demeurer dans un lieu pendant une certaine durée. « Resta là » rend naturellement ce sens dans le récit.
- source_word: δὲ
  choice: donc
  rationale: Cette particule assure une transition légère. Dans le contexte, « donc » relie l’encouragement divin précédent à la décision de Paul de rester, sans introduire un contraste marqué.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: un an et six mois
  rationale: Cette formulation rend directement et naturellement l’accusatif grec exprimant la durée.
- source_word: διδάσκων
  choice: enseignant
  rationale: Le participe présent indique une activité continue menée pendant le séjour de Paul. Le participe français conserve cette simultanéité.
- source_word: ἐν αὐτοῖς
  choice: parmi eux
  rationale: 'La préposition avec le pronom a ici un sens local et social : Paul enseignait au milieu de cette communauté.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Dans les Actes, l’expression désigne fréquemment le message proclamé qui vient de Dieu. « La parole de Dieu » conserve l’expression biblique reconnue et sa portée théologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; « enseignant parmi eux » préserve l’action continue du participe sans alourdir la phrase.
