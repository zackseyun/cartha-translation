id: ACT.18.17
reference: Acts 18:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: fr
  text: Alors, tous se saisirent de Sosthène[a], le chef de la synagogue, et le frappaient devant le tribunal. Mais Gallion ne se souciait nullement de tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « tous les Grecs » au lieu de simplement « tous ». Le texte le plus ancien est plus court et ne précise pas l’identité du groupe.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: se saisirent de
  rationale: Le verbe exprime ici une prise hostile. « Se saisirent de » est naturel en français et convient à l’action qui précède les coups.
- source_word: πάντες
  choice: tous
  rationale: L’adjectif substantivé garde sa valeur totalisante, tout en laissant l’identité du groupe indéterminée comme dans le texte grec.
- source_word: ἀρχισυνάγωγον
  choice: chef de la synagogue
  rationale: Le terme désigne le responsable principal de la synagogue. Cette formulation est claire et actuelle.
- source_word: ἔτυπτον
  choice: le frappèrent
  rationale: L’imparfait grec peut décrire des coups répétés ou une action en cours. Le passé simple français présente naturellement l’événement dans le récit, tandis que le verbe « frapper » permet la répétition implicite.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: devant le tribunal
  rationale: βῆμα désigne ici l’estrade ou le siège judiciaire officiel; « tribunal » communique clairement le cadre judiciaire.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: ne se soucia nullement de tout cela
  rationale: Cette tournure rend idiomatiquement l’absence totale de préoccupation exprimée par la construction grecque, sans préciser les motifs de Gallion.
- source_word: δέ
  choice: Alors
  rationale: La particule marque la progression du récit; « Alors » assure une transition naturelle.
- source_word: καί
  choice: Mais
  rationale: Dans ce contexte, la conjonction met en contraste la violence exercée devant le tribunal et l’indifférence de Gallion.
theological_decisions:
- issue: Identité de πάντες (« tous »)
  choice: L’identité du groupe reste indéterminée dans le texte principal.
  alternative: « tous les Grecs » ou une identification du groupe comme Juifs
  rationale: Le texte retenu dit seulement πάντες, sans nommer le groupe. La traduction ne doit donc pas introduire une identification absente de la source; la variante est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit reste concis; l’ambiguïté sur l’identité de ceux qui saisissent Sosthène est préservée.
