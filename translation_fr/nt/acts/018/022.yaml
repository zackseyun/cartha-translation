id: ACT.18.22
reference: Acts 18:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: fr
  text: Après être descendu à Césarée, il monta, salua l’Église[a], puis descendit à Antioche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit probablement de l’Église de Jérusalem. Beaucoup de traductions ajoutent ici « à Jérusalem », mais la ville n’est pas nommée dans le texte grec.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: Après être descendu
  rationale: Le participe aoriste marque une action antérieure et conserve le langage directionnel de Luc.
- source_word: Καισάρειαν
  choice: Césarée
  rationale: Forme française usuelle du nom de lieu; le contexte désigne Césarée maritime.
- source_word: ἀναβὰς
  choice: il monta
  rationale: Conserve le sens directionnel sans ajouter « à Jérusalem », destination probable mais non exprimée dans le grec.
- source_word: ἀσπασάμενος
  choice: salua
  rationale: Rend directement le sens courant du verbe dans ce récit de voyage.
- source_word: τὴν ἐκκλησίαν
  choice: l’Église
  rationale: Désignation française naturelle de la communauté chrétienne dans ce contexte; la majuscule indique ici la communauté locale, non un bâtiment.
- source_word: κατέβη
  choice: descendit
  rationale: Préserve le mouvement topographique caractéristique du récit lucanien.
- source_word: Ἀντιόχειαν
  choice: Antioche
  rationale: Forme française usuelle; le contexte permet d’identifier Antioche de Syrie sans explicitation dans le texte.
theological_decisions:
- issue: Faut-il identifier comme Jérusalem la destination implicite de « il monta » ?
  choice: Laisser la destination implicite dans le texte principal.
  alternative: Traduire explicitement « il monta à Jérusalem ».
  rationale: L’enchaînement depuis Césarée, la montée, la salutation à l’Église puis la descente vers Antioche suggère fortement Jérusalem, mais le texte grec ne la nomme pas. La traduction conserve donc cette implicitation et l’explique en note.
translation_notes:
  register: Français international moderne, fluide et digne. La succession « descendit / monta / descendit » conserve volontairement les indications directionnelles du grec. Le passé simple convient au registre narratif biblique courant sans être archaïque.
