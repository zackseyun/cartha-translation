lexical_decisions:
- source_word: ἐρωτώντων δὲ αὐτῶν
  choice: Mais comme ils lui demandaient
  rationale: Le génitif absolu présent est rendu par une proposition circonstancielle qui conserve l’aspect duratif possible de la demande. « Mais » marque la légère opposition narrative.
- source_word: ἐπὶ πλείονα χρόνον
  choice: plus longtemps
  rationale: Cette tournure française naturelle préserve la valeur comparative de πλείονα sans alourdir la phrase.
- source_word: μεῖναι
  choice: de rester
  rationale: « Rester » est le terme courant et naturel dans ce contexte de voyage.
- source_word: οὐκ ἐπένευσεν
  choice: il n’y consentit pas
  rationale: ἐπινεύω exprime l’assentiment donné à une demande. Le pronom « y » reprend naturellement la demande en français, tandis que la négation évite la force plus catégorique de « refusa ».
