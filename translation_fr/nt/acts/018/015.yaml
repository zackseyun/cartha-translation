id: ACT.18.15
reference: Acts 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: fr
  text: Mais s’il y a des questions concernant une parole[a], des noms et votre propre loi, vous vous en occuperez vous-mêmes ; je ne veux pas être juge de ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un message », « un enseignement » ou « une doctrine ». Le mot grec λόγος a un sens large et peut désigner ici un enseignement contesté ou une question de terminologie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: questions
  rationale: « Questions » conserve le caractère général et quasi judiciaire des points en litige, sans les présenter nécessairement comme des conflits hostiles.
- source_word: περὶ λόγου
  choice: relatives à une parole
  rationale: λόγος possède ici un sens large pouvant viser une parole, un message, un enseignement ou une question de terminologie. « Une parole » reste proche du grec et maintient cette ambiguïté, explicitée en note.
- source_word: ὀνομάτων
  choice: à des noms
  rationale: Le rendu direct « noms » laisse ouverte l’identité des noms ou titres contestés, comme le fait le grec.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: à votre propre loi
  rationale: Cette formulation naturelle exprime que Gallion considère cette loi comme propre à ses interlocuteurs et extérieure à sa compétence judiciaire romaine.
- source_word: ὄψεσθε αὐτοί
  choice: réglez cela vous-mêmes
  rationale: Le futur moyen est idiomatique et signifie ici prendre soi-même l’affaire en charge. L’impératif français rend naturellement la force directive de l’énoncé, tandis que « vous-mêmes » conserve l’emphase de αὐτοί.
- source_word: κριτής
  choice: juge
  rationale: « Juge » correspond au contexte judiciaire et à la fonction que Gallion refuse d’assumer dans cette affaire.
- source_word: τούτων
  choice: de ces choses
  rationale: Le démonstratif renvoie largement aux questions qui viennent d’être énumérées, sans en préciser davantage la nature.
- source_word: οὐ βούλομαι εἶναι
  choice: je ne veux pas être
  rationale: Cette traduction française courante exprime directement la volonté personnelle indiquée par βούλομαι sans durcir le propos en refus juridique formel.
theological_decisions:
- issue: Portée de λόγος dans le rejet de l’affaire par Gallion
  choice: une parole
  alternative: un message ; un enseignement ; une doctrine
  rationale: Le texte ne précise pas si λόγος désigne une formulation, un message ou un enseignement. Le corps du texte conserve donc un rendu large, et la note signale les principales possibilités sans imposer un contenu théologique particulier.
translation_notes:
  register: Français international moderne, naturel et digne. La première phrase évite un calque lourd tout en conservant l’énumération grecque. « Réglez cela vous-mêmes » rend clairement l’idiome ὄψεσθε αὐτοί et le ton de dessaisissement du magistrat.
