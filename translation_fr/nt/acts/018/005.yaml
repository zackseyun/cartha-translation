id: ACT.18.5
reference: Acts 18:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: fr
  text: Mais lorsque Silas et Timothée descendirent de Macédoine, Paul était tout entier absorbé par la parole[a] et témoignait solennellement auprès des Juifs que Jésus est le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était poussé par la parole » ou « se consacrait entièrement au message ». Le verbe grec peut évoquer le fait d’être accaparé, pressé ou entièrement voué à quelque chose.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « le Christ ». Ici, ce mot est employé comme un titre ; « Messie » en fait ressortir le sens messianique.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mais lorsque
  rationale: Cette formulation rend à la fois la transition marquée par δέ et la valeur temporelle de ὡς, dans un français naturel.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: descendirent de Macédoine
  rationale: Le verbe κατέρχομαι signifie couramment « descendre » ou « venir en descendant ». La traduction conserve l’expression de déplacement employée par Luc.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Silas et Timothée
  rationale: La construction τε…καί associe étroitement les deux hommes. En français, la coordination simple exprime naturellement ce sujet conjoint.
- source_word: συνείχετο
  choice: était tout entier absorbé
  rationale: L’imparfait de συνέχω peut décrire quelqu’un qui est accaparé, pressé ou entièrement pris par une activité. Ce choix exprime l’intensité sans préciser indûment si la Parole exerçait sur Paul une contrainte intérieure.
- source_word: τῷ λόγῳ
  choice: par la Parole
  rationale: Le datif peut désigner ce qui accaparait Paul ou le domaine auquel il se consacrait. Dans les Actes, « la Parole » désigne souvent le message proclamé; la majuscule aide à signaler cet emploi sans recourir à une paraphrase.
- source_word: διαμαρτυρόμενος
  choice: attestait solennellement
  rationale: διαμαρτύρομαι désigne un témoignage appuyé ou solennel. La coordination verbale donne ici une phrase française plus fluide tout en conservant la force du participe grec.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Dans ce contexte, Ἰουδαῖοι désigne les Juifs comme groupe ethnoreligieux, non spécialement les habitants de la Judée.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: que Jésus est le Messie
  rationale: La formulation française naturelle identifie Jésus au Messie promis. Le présent « est » correspond à l’infinitif présent εἶναι.
theological_decisions:
- issue: Traduction de Χριστός comme titre ou comme désignation devenue quasi nominale
  choice: Messie
  alternative: Christ
  rationale: Dans une attestation adressée aux Juifs, l’article et la construction prédicative mettent en relief le titre messianique. « Messie » en rend ici le sens plus explicitement que « Christ ».
- issue: Nature de l’action exercée par la Parole sur Paul
  choice: était tout entier absorbé par la Parole
  alternative: était poussé par la Parole / se consacrait entièrement à la Parole
  rationale: La syntaxe permet une nuance de contrainte, d’absorption ou de dévouement. Le texte principal retient une expression qui préserve l’intensité sans attribuer explicitement cette pression à une action spirituelle particulière; la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « La Parole » conserve le terme lucanien tout en indiquant qu’il s’agit du message proclamé. La phrase évite un calque lourd du participe grec et garde la tension lexicale de συνέχω dans une note.
