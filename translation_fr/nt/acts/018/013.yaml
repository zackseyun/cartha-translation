id: ACT.18.13
reference: Acts 18:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: fr
  text: 'en disant : « Cet homme persuade les gens de rendre un culte à Dieu contrairement à la loi[a][b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’encontre de la loi » ou « en violation de la loi ».
    reason: lexical_alternative
  - marker: b
    text: Les accusateurs visent probablement la loi juive, bien que le grec dise simplement « la loi ».
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'en disant : « … »'
  rationale: Le participe présent introduit le contenu de l’accusation, et les deux-points suivis du discours direct rendent naturellement ὅτι en français.
- source_word: Παρὰ τὸν νόμον
  choice: contrairement à la loi
  rationale: παρά avec l’accusatif exprime ici ce qui va à l’encontre d’une norme ou la transgresse. Cette formulation conserve le ton juridique sans préciser de quelle loi il s’agit.
- source_word: ἀναπείθει
  choice: persuade
  rationale: Le verbe désigne l’action de convaincre ou de gagner quelqu’un à une conduite. « Persuade » préserve ce sens sans introduire l’idée plus négative d’égarement.
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif a une valeur désignative appuyée dans l’accusation. « Cet homme » la conserve sans ajouter une nuance péjorative excessive.
- source_word: τοὺς ἀνθρώπους
  choice: les gens
  rationale: Le pluriel est générique et désigne des êtres humains sans restriction de sexe. « Les gens » est naturel en français moderne.
- source_word: σέβεσθαι τὸν θεόν
  choice: rendre un culte à Dieu
  rationale: Dans ce contexte religieux, σέβομαι désigne la vénération cultuelle. « Rendre un culte à Dieu » exprime clairement cette idée en français.
- source_word: τὸν νόμον
  choice: la loi
  rationale: Le grec dit simplement « la loi ». La traduction ne précise donc pas dans le texte principal qu’il s’agit de la loi juive.
theological_decisions:
- issue: Référent de « la loi » dans l’accusation
  choice: Conserver la formulation générale « la loi » dans le texte principal.
  alternative: « la loi juive » ou « notre loi »
  rationale: Les accusateurs pensent très probablement à la loi juive, mais le grec ne l’explicite pas. La note donne le contexte sans supprimer l’ambiguïté formelle du texte.
- issue: Portée de ἀνθρώπους
  choice: « les gens »
  alternative: « les hommes »
  rationale: Le nom est ici générique, non limité aux personnes de sexe masculin. La traduction retenue communique cette portée en français contemporain.
translation_notes:
  register: Français international moderne, clair et digne. La structure participiale est maintenue par « en disant », tandis que l’accusation est formulée en discours direct. Le mot « loi » reste en minuscule afin de ne pas expliciter dans le texte principal un référent que seul le contexte permet d’identifier.
