lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Cette formule assure naturellement la transition temporelle dans un récit tout en conservant l’enchaînement exprimé par le grec.
- source_word: χωρισθεὶς ἐκ τῶν Ἀθηνῶν
  choice: il quitta Athènes
  rationale: Le participe aoriste passif de χωρίζω exprime ici idiomatiquement le départ d’un lieu. En français courant, « quitter Athènes » restitue clairement le sens sans imposer une tournure passive artificielle.
- source_word: ἦλθεν εἰς Κόρινθον
  choice: se rendit à Corinthe
  rationale: Dans ce contexte de déplacement entre deux villes, cette expression française naturelle rend le mouvement vers Corinthe indiqué par ἦλθεν et εἰς.
