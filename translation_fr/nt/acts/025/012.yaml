source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: fr
  text: 'Alors Festus, après avoir consulté le conseil, répondit : « Tu en as appelé à César ; tu iras devant César[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu iras à César ». L’expression désigne le déplacement vers l’autorité impériale et, dans le contexte de l’appel, implique la comparution devant son tribunal.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans le récit.
- source_word: συλλαλήσας
  choice: après avoir consulté
  rationale: Le participe aoriste exprime une action antérieure à la réponse et, dans ce cadre administratif, implique un échange délibératif.
- source_word: μετὰ τοῦ συμβουλίου
  choice: le conseil
  rationale: Désigne l'organe consultatif réuni avec Festus ; le grec ne précise pas explicitement « son conseil ».
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Rend directement le verbe narratif tout en maintenant le ton judiciaire.
- source_word: Καίσαρα
  choice: César
  rationale: Conserve le titre impérial romain employé comme désignation du souverain.
- source_word: ἐπικέκλησαι
  choice: tu en as appelé à
  rationale: 'Rend le sens juridique du parfait moyen : Paul a invoqué la juridiction de César par voie d''appel.'
- source_word: ἐπὶ Καίσαρα
  choice: devant César
  rationale: Dans ce contexte d'appel judiciaire, exprime la comparution devant l'autorité impériale sans nier l'idée de déplacement vers César.
- source_word: πορεύσῃ
  choice: tu iras
  rationale: Traduit simplement le futur moyen de πορεύομαι sans ajouter l'idée non explicite d'être envoyé.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne, avec une formulation juridique immédiatement compréhensible. La répétition de « César » est conservée pour refléter l'effet solennel et catégorique du grec.
