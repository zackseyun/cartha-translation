  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: fr
  text: 'Agrippa dit alors à Festus : « Moi aussi, je voudrais entendre cet homme. » « Demain, dit-il[a], tu l’entendras[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dit-il » est au présent en grec : « dit-il / il dit ». Il s’agit d’un présent historique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu l’entendras parler » ou « tu entendras ce qu’il a à dire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Φῆστον
  choice: Agrippa dit alors à Festus
  rationale: δέ marque ici la progression du récit; « alors » donne un enchaînement naturel. Le verbe « dit » est suppléé en français par l’expression elliptique grecque avec πρός.
- source_word: Ἐβουλόμην
  choice: je voudrais
  rationale: Dans ce dialogue, l’imparfait de βούλομαι exprime avec courtoisie un désir présent; le conditionnel français est idiomatique sans effacer cette nuance de réserve.
- source_word: καὶ αὐτὸς
  choice: Moi aussi
  rationale: καί conserve sa valeur additive (« aussi »), tandis que le pronom disjoint « moi » rend l’insistance portée par αὐτός.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: entendre cet homme
  rationale: ἀκούω avec le génitif désigne ici le fait d’entendre directement la personne parler. « Cet homme » identifie naturellement Paul dans le contexte immédiat.
- source_word: Αὔριον
  choice: Demain
  rationale: Traduction directe de l’adverbe temporel.
- source_word: φησίν
  choice: dit-il
  rationale: Le français narratif emploie naturellement le passé dans l’incise; une note signale le présent historique de l’original.
- source_word: ἀκούσῃ αὐτοῦ
  choice: tu l’entendras
  rationale: Le futur avec le génitif signifie qu’Agrippa entendra Paul parler; la formulation reste concise et conserve l’ambiguïté quant au contenu précis de l’audition.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct entre Agrippa et Festus. « Moi aussi » préserve à la fois la valeur additive de καί et l’emphase de αὐτός.
