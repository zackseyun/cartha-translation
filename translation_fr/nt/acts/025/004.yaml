source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: fr
  text: Festus répondit donc que Paul était gardé à Césarée et que lui-même allait partir sous peu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: était gardé
  rationale: L’infinitif présent passif indique que Paul demeurait sous garde; « était gardé » conserve cette valeur sans préciser davantage les conditions de sa détention.
- source_word: εἰς Καισάρειαν
  choice: à Césarée
  rationale: Malgré la préposition εἰς transmise ici, le contexte et l’usage idiomatique soutiennent une valeur locale; le français naturel exige « à Césarée ».
- source_word: ἐν τάχει
  choice: sous peu
  rationale: Cette expression indique une échéance proche; « sous peu » est naturel et dignifié, sans suggérer la vitesse du trajet.
- source_word: ἐκπορεύεσθαι
  choice: partir
  rationale: Le verbe exprime le fait de sortir ou de se mettre en route; dans ce contexte, « partir » rend clairement le déplacement prévu de Festus.
theological_decisions: []
