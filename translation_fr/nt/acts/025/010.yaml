  source_fidelity: 'Le texte rend fidèlement les principaux éléments du grec : la position présente de Paul devant le tribunal impérial (« je me tiens »), la compétence juridictionnelle (« c’est là que je dois être jugé »), son absence de tort envers les Juifs et l’insistance finale adressée à Festus. « Tribunal de César » conserve avec justesse le cadre romain et juridique de βῆμα Καίσαρος.'
