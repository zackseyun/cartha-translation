language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: fr
  text: 'Mais Paul dit : « C’est devant le tribunal de César que je me tiens, et c’est là que je dois être jugé. Je n’ai fait aucun tort aux Juifs, comme tu le sais toi-même fort bien. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βῆμα
  choice: tribunal
  rationale: Dans ce contexte judiciaire romain, le mot désigne le siège ou l’instance officielle de jugement. « Tribunal » est précis, naturel et conserve la portée institutionnelle du grec.
- source_word: Καίσαρος
  choice: de César
  rationale: « César » conserve le titre impérial et l’ancrage historique et juridique romain du texte.
- source_word: ἑστώς εἰμι
  choice: je me tiens
  rationale: La périphrase formée du participe parfait et de εἰμί souligne la position présente de Paul devant la juridiction impériale. « Je me tiens » rend cette posture avec dignité et naturel.
- source_word: οὗ
  choice: c’est là que
  rationale: Le relatif renvoie au tribunal comme juridiction compétente. La tournure française explicite naturellement ce renvoi sans en modifier le sens.
- source_word: δεῖ
  choice: je dois
  rationale: 'Le verbe exprime ici une nécessité de nature juridictionnelle : c’est devant cette instance que Paul doit légitimement être jugé.'
- source_word: κρίνεσθαι
  choice: être jugé
  rationale: Dans ce contexte légal, le passif signifie être soumis au jugement. « Être jugé » reste proche du grec tout en étant idiomatique.
- source_word: Ἰουδαίους
  choice: aux Juifs
  rationale: Le terme désigne ici ceux envers qui Paul est accusé d’avoir mal agi. « Les Juifs » est la traduction directe et ne réduit pas indûment le référent aux seuls habitants de Judée.
- source_word: οὐδὲν ἠδίκησα
  choice: Je n’ai fait aucun tort
  rationale: 'Cette formulation rend la force morale et juridique de ἀδικέω : agir injustement envers quelqu’un ou lui causer du tort.'
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: comme tu le sais toi-même fort bien
  rationale: « Toi-même » restitue l’insistance de καὶ σύ, tandis que « fort bien » exprime idiomatiquement la valeur intensive du comparatif κάλλιον associé à ἐπιγινώσκεις.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. Le vouvoiement n’est pas employé : le grec distingue ici explicitement la deuxième personne du singulier, et le tutoiement conserve la forme directe de l’adresse antique. La syntaxe met en relief « devant le tribunal de César », comme le fait l’ordre grec.'
