  source_fidelity: La demande de condamnation est bien rendue. Toutefois, « ont porté plainte devant moi » précise davantage que ἐνεφάνισαν, qui signifie plus largement faire connaître ou présenter une affaire à une autorité. Une formulation qui indique qu’ils ont porté l’affaire à la connaissance de Festus conserve mieux cette nuance.
