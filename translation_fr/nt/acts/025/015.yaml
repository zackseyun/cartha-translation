id: ACT.25.15
reference: Acts 25:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: fr
  text: À son sujet, lorsque je suis arrivé à Jérusalem, les grands prêtres et les anciens des Juifs m’ont saisi de son affaire, demandant sa condamnation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demandant contre lui un verdict de culpabilité » ou « demandant qu’il soit condamné ».
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: À son sujet
  rationale: La locution reprend Paul comme objet de l’affaire et rend explicitement le relatif grec dans un français naturel.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: lorsque je suis arrivé à Jérusalem
  rationale: Le génitif absolu avec γίνομαι et une destination exprime ici l’arrivée de Festus à Jérusalem.
- source_word: ἐνεφάνισαν
  choice: ont porté plainte devant moi
  rationale: Dans ce contexte judiciaire et avec la personne visée introduite auparavant, le verbe désigne une démarche accusatoire auprès de l’autorité; cette formulation française est plus précise que le simple « m’ont informé ».
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Désignation française usuelle des principales autorités sacerdotales au pluriel.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: les anciens des Juifs
  rationale: La formulation conserve le génitif grec, qui identifie le groupe auquel appartiennent les anciens.
- source_word: αἰτούμενοι κατ’ αὐτοῦ καταδίκην
  choice: ont demandé qu’il soit condamné
  rationale: Cette tournure exprime naturellement la demande d’un jugement défavorable tout en conservant la portée judiciaire de καταδίκη.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination « ont porté plainte… et ont demandé » explicite naturellement le participe grec sans atténuer le cadre judiciaire.
