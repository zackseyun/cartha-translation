id: ACT.25.7
reference: Acts 25:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: fr
  text: À son arrivée, les Juifs[a] qui étaient descendus de Jérusalem l’entourèrent[b] et portèrent contre lui de nombreuses et graves accusations qu’ils ne pouvaient pas prouver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Le terme grec peut désigner les Juifs en général ou les habitants de la Judée; ici, il s’agit des accusateurs juifs venus de Jérusalem.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « se placèrent autour de lui » ou « se tinrent autour de lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: À son arrivée
  rationale: Le génitif absolu exprime ici une circonstance temporelle. Cette formulation française rend naturellement la succession des événements sans alourdir la phrase.
- source_word: περιέστησαν αὐτὸν
  choice: l’entourèrent
  rationale: Le verbe désigne le fait de se placer autour de quelqu’un. « L’entourèrent » restitue clairement la disposition physique des accusateurs sans expliciter davantage leur intention.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: les Juifs qui étaient descendus de Jérusalem
  rationale: Ἰουδαῖοι peut désigner les Juifs ou les Judéens. Dans ce contexte, il s’agit des accusateurs juifs venus de Jérusalem; la provenance géographique est déjà précisée. Le plus-que-parfait rend l’antériorité du déplacement.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: de nombreuses et graves accusations
  rationale: αἰτιώματα désigne des accusations formelles, et βαρέα souligne leur gravité. La coordination « nombreuses et graves » conserve les deux qualifications du grec.
- source_word: καταφέροντες
  choice: portèrent contre lui
  rationale: Dans ce contexte judiciaire, le participe évoque le fait de présenter ou de porter des accusations. « Contre lui » explicite en français leur cible évidente.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: qu’ils ne pouvaient pas prouver
  rationale: ἰσχύω suivi de l’infinitif exprime la capacité, tandis que ἀποδείκνυμι signifie démontrer ou prouver. L’imparfait français convient à leur incapacité au cours de la procédure.
