id: ACT.25.18
reference: Acts 25:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: fr
  text: Quand les accusateurs se sont présentés, ils n’ont formulé contre lui aucune accusation au sujet des méfaits dont je le soupçonnais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucune accusation pour les crimes dont je le soupçonnais ». Le grec dit littéralement « choses mauvaises »; l’expression peut désigner plus généralement des actes répréhensibles, sans nécessairement renvoyer à des crimes définis juridiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: contre lui
  rationale: Dans ce contexte judiciaire, περί avec le génitif désigne la personne visée par l’accusation. « Contre lui » s’intègre naturellement à l’expression française « porter une accusation contre quelqu’un ».
- source_word: σταθέντες
  choice: quand ... se sont présentés
  rationale: Le participe aoriste a ici une valeur temporelle et évoque la comparution des accusateurs pour exposer leur cause. « Se sont présentés » est plus naturel en français judiciaire que le littéral « se sont levés ».
- source_word: οἱ κατήγοροι
  choice: ses accusateurs
  rationale: κατήγοροι désigne ceux qui portent les accusations. Le possessif explicite naturellement qu’il s’agit des accusateurs de Paul.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: ils n’ont porté ... aucune accusation
  rationale: 'L’expression a un sens juridique : présenter ou porter une accusation. Cette formulation conserve le registre judiciaire sans technicité excessive.'
- source_word: ὧν ... πονηρῶν
  choice: concernant les méfaits auxquels
  rationale: Le relatif génitif qualifie le contenu attendu des accusations. « Méfaits » rend des actes mauvais ou répréhensibles sans les définir nécessairement comme des crimes au sens juridique strict.
- source_word: ἐγὼ ὑπενόουν
  choice: je m’attendais
  rationale: L’imparfait indique l’attente ou le soupçon préalable de Festus. En français, « auxquels je m’attendais » exprime naturellement cette attente continue, sans la tournure peu idiomatique « que je soupçonnais » appliquée à des méfaits.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible, avec une légère tonalité judiciaire. La formulation évite le calque « se tenant debout » et conserve l’indétermination de πονηρῶν grâce à « méfaits », explicitée en note.
