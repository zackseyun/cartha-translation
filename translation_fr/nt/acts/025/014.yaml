  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: fr
  text: 'Comme ils restèrent là plusieurs jours, Festus présenta au roi[a] l’affaire de Paul[b] en disant : « Il y a un homme que Félix a laissé en prison. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « informa le roi ». Le verbe grec peut désigner le fait de soumettre une question à quelqu’un pour qu’il l’examine, plutôt que de simplement lui transmettre une information.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les choses concernant Paul » ; l’expression peut désigner plus largement les faits ou la situation relatifs à Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: depuis plusieurs jours
  rationale: Dans cette expression temporelle, le comparatif πλείους a naturellement le sens idiomatique de « plusieurs » ou « de nombreux ». « Depuis plusieurs jours » exprime en français courant une durée déjà prolongée sans imposer un comparatif strict.
- source_word: διέτριβον
  choice: ils séjournaient
  rationale: Le verbe désigne le fait de passer du temps ou de rester dans un lieu. « Séjournaient » convient au contexte d’une visite prolongée et garde un registre narratif digne.
- source_word: ἀνέθετο
  choice: présenta au roi
  rationale: Le moyen ἀνατίθεμαι évoque ici le fait de soumettre une question à quelqu’un pour examen, et non une simple transmission d’information. « Présenta au roi » restitue cette nuance de manière naturelle.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: l’affaire de Paul
  rationale: L’expression peut désigner l’ensemble des faits relatifs à Paul, mais le contexte judiciaire favorise « l’affaire de Paul ». Une note conserve la formulation plus générale possible.
- source_word: Ἀνήρ τίς
  choice: Il y a un homme
  rationale: τίς introduit un individu précis mais encore non identifié dans le discours. « Il y a un homme » est plus naturel en français moderne que « un certain homme », tout en gardant cette indétermination.
- source_word: καταλελειμμένος
  choice: a laissé
  rationale: Le participe parfait passif présente l’homme dans l’état résultant de la décision de Félix. La construction française « que Félix a laissé » rend clairement l’action passée et sa conséquence persistante.
- source_word: δέσμιος
  choice: en prison
  rationale: Le terme signifie « prisonnier ». Avec « laisser », la locution française « laisser en prison » exprime naturellement le maintien en détention sans ajouter l’idée d’abandon affectif.
- source_word: βασιλεῖ
  choice: au roi
  rationale: Le texte grec emploie le titre sans répéter le nom d’Agrippa, déjà identifiable par le contexte. La traduction conserve cette formulation.
