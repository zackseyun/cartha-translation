id: ACT.25.27
reference: Acts 25:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: fr
  text: Car il me semble déraisonnable d’envoyer un prisonnier sans indiquer aussi les accusations portées contre lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογον
  choice: déraisonnable
  rationale: Le terme qualifie ici une démarche dépourvue de raison ou de bon sens. « Déraisonnable » convient au jugement administratif de Festus sans la force plus vive d’« absurde ».
- source_word: δοκεῖ μοι
  choice: il me semble
  rationale: Cette tournure naturelle conserve le caractère personnel et quelque peu mesuré de l’évaluation exprimée par la construction grecque.
- source_word: πέμποντα
  choice: d’envoyer
  rationale: L’infinitif français s’intègre naturellement après « il me semble déraisonnable » et rend la circonstance exprimée par le participe grec.
- source_word: δέσμιον
  choice: un prisonnier
  rationale: Dans ce contexte judiciaire, « prisonnier » est l’équivalent français courant et précis pour une personne détenue.
- source_word: μὴ καὶ
  choice: sans ... aussi
  rationale: Cette formulation idiomatique exprime l’idée d’envoyer le prisonnier sans accomplir l’action supplémentaire attendue, tout en conservant la valeur additive de καί.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: les accusations portées contre lui
  rationale: Dans le cadre judiciaire, αἰτίαι désigne les accusations ou chefs d’accusation. La formulation choisie est claire et naturelle, sans ajouter une précision technique absente du grec.
- source_word: σημᾶναι
  choice: indiquer
  rationale: « Indiquer » restitue le sens de faire connaître ou signaler et convient au contexte officiel, tout en évitant le sens plus précis que pourrait imposer « spécifier ».
