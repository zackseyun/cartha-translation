  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: fr
  text: Je leur ai répondu que les Romains n’ont pas coutume de livrer quelqu’un[a][b] avant que l’accusé ait ses accusateurs en face de lui et qu’il ait la possibilité de présenter sa défense au sujet de l’accusation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’accorder quelqu’un à titre de faveur » ; le verbe grec peut évoquer le fait de livrer une personne pour satisfaire la demande de ses accusateurs.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un être humain quelconque » ; l’expression grecque est au masculin grammatical, mais elle a ici une portée générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: coutume
  rationale: Le terme désigne une pratique établie. « Avoir coutume de » est naturel en français et convient au contexte judiciaire.
- source_word: Ῥωμαίοις
  choice: les Romains
  rationale: Le datif pluriel renvoie aux Romains considérés comme corps politique et juridique, sans qu’il soit nécessaire d’ajouter « autorités ».
- source_word: χαρίζεσθαί
  choice: livrer
  rationale: Dans ce contexte, le verbe évoque le fait de remettre une personne à ceux qui la réclament, comme faveur accordée. « Livrer » exprime clairement l’acte judiciaire sans lui donner une valeur positive.
- source_word: τινα ἄνθρωπον
  choice: quelqu’un
  rationale: L’expression grecque désigne ici toute personne sans distinction. « Quelqu’un » rend naturellement en français cette portée générique.
- source_word: ὁ κατηγορούμενος
  choice: l’accusé
  rationale: Le participe substantivé désigne la personne faisant l’objet de l’accusation. « L’accusé » est concis et adapté au registre juridique.
- source_word: κατὰ πρόσωπον
  choice: face à face avec
  rationale: Cette expression conserve l’idée d’une confrontation directe et personnelle entre l’accusé et ses accusateurs.
- source_word: τόπον τε ἀπολογίας λάβοι
  choice: ait la possibilité de se défendre
  rationale: τόπος désigne ici une possibilité ou une occasion, et ἀπολογία une défense en contexte judiciaire. La formulation française est claire et idiomatique.
- source_word: περὶ τοῦ ἐγκλήματος
  choice: au sujet de l’accusation portée contre lui
  rationale: ἔγκλημα désigne une accusation ou un chef d’accusation. La formulation retenue explicite naturellement son rapport à l’accusé sans modifier le sens.
