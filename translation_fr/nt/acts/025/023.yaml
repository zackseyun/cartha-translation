source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: fr
  text: Le lendemain, Agrippa et Bérénice arrivèrent en grande pompe[a] et entrèrent dans la salle d’audience avec les tribuns militaires et les notables de la ville[b]. Sur l’ordre de Festus, Paul fut amené.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un grand déploiement d’apparat ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les hommes les plus en vue de la ville ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Le lendemain donc
  rationale: L’expression au datif indique le jour suivant, tandis que « donc » conserve la fonction de liaison narrative de οὖν sans alourdir le récit.
- source_word: ἐλθόντος … εἰσελθόντων
  choice: arrivèrent … et entrèrent
  rationale: Les participes des génitifs absolus sont rendus par des verbes conjugués, plus naturels en français, tout en maintenant la succession des actions.
- source_word: Ἀγρίππα … Βερνίκης
  choice: Agrippa et Bérénice
  rationale: Les noms suivent leurs formes françaises traditionnelles et couramment reconnues.
- source_word: μετὰ πολλῆς φαντασίας
  choice: en grande pompe
  rationale: Dans ce contexte, φαντασία évoque une mise en scène publique imposante et ostentatoire. « En grande pompe » restitue naturellement cette idée.
- source_word: τὸ ἀκροατήριον
  choice: la salle d’audience
  rationale: Le terme désigne le lieu où se tient une audition officielle; cette formulation convient au cadre public et judiciaire.
- source_word: σύν τε χιλιάρχοις
  choice: avec les tribuns militaires
  rationale: χιλίαρχος désigne ici un officier supérieur romain, généralement un tribun militaire. « Ainsi que » coordonne ce groupe avec les notables sans imposer artificiellement un équivalent de « both ».
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: les notables de la ville
  rationale: La locution κατ’ ἐξοχήν désigne des personnes distinguées ou éminentes. « Notables » est concis, actuel et adapté au contexte civique.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: sur l’ordre de Festus
  rationale: Cette tournure idiomatique exprime clairement l’autorité officielle impliquée par κελεύω.
- source_word: ἤχθη ὁ Παῦλος
  choice: Paul fut amené
  rationale: Le passif de ἄγω indique que Paul a été conduit dans la salle; « fut amené » préserve cette passivité sans ajouter de détail.
