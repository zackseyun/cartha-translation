  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: fr
  text: 'Paul présenta sa défense : « Je n’ai en rien péché ni contre la loi des Juifs[a], ni contre le Temple, ni contre César. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je n’ai commis aucune infraction contre la loi des Juifs, le Temple ou César. »'
    reason: Alternative lexicale rendant plus explicitement la nuance judiciaire de ἥμαρτον dans ce contexte.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: présenta sa défense
  rationale: Le participe au génitif absolu situe la prise de parole de Paul dans un cadre judiciaire. Cette formulation française est naturelle et conserve le sens proprement défensif du verbe.
- source_word: ὅτι
  choice: introduit par deux-points et discours direct
  rationale: ὅτι introduit ici le contenu de la défense. En français, le discours direct après deux-points restitue naturellement cette fonction.
- source_word: νόμον τῶν Ἰουδαίων
  choice: la loi des Juifs
  rationale: Cette traduction conserve la construction génitivale sans préciser davantage si la désignation est surtout ethnique, religieuse ou régionale.
- source_word: ἱερὸν
  choice: le Temple
  rationale: ἱερόν désigne couramment l’ensemble du complexe du Temple, et non seulement le sanctuaire intérieur. La majuscule identifie ici le Temple de Jérusalem.
- source_word: Καίσαρά
  choice: César
  rationale: Le titre-nom est conservé, conformément au cadre politique et judiciaire romain du passage.
- source_word: τι
  choice: en rien
  rationale: Avec ἥμαρτον, le pronom indéfini souligne le caractère absolu de la dénégation.
- source_word: ἥμαρτον
  choice: je n’ai péché
  rationale: Bien que le contexte soit judiciaire, le verbe est le terme courant pour « pécher ». Le conserver maintient sa portée morale sans effacer le sens d’infraction présent dans le contexte.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ni ... ni ... ni
  rationale: La triple coordination négative française reproduit clairement les trois chefs de dénégation.
theological_decisions:
- issue: Nuance juridique ou morale de ἥμαρτον
  choice: Je n’ai péché en rien
  alternative: Je n’ai commis aucune infraction / Je n’ai rien fait de mal
  rationale: Le contexte est judiciaire, mais traduire uniquement par un terme technique aplanirait la portée lexicale et morale possible de ἁμαρτάνω. Une note signale donc la lecture juridique naturelle dans ce contexte.
translation_notes:
  register: Français moderne, digne et accessible, avec une tournure judiciaire naturelle. « Temple » prend une majuscule comme désignation du Temple de Jérusalem. La formulation conserve la tension entre le vocabulaire moral du péché et le contexte légal.
