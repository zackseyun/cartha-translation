id: ACT.25.5
reference: Acts 25:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: fr
  text: Que donc ceux d’entre vous qui ont autorité[a] descendent avec moi et, s’il y a chez cet homme quoi que ce soit de répréhensible, qu’ils l’accusent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux d’entre vous qui en sont capables » ou « les personnes influentes parmi vous ». Le grec δυνατοί peut désigner des personnes capables, puissantes ou influentes.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’ils portent des accusations contre lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Que ... donc
  rationale: οὖν marque ici la conséquence ou la reprise du raisonnement. En français, « donc » s’insère naturellement après le groupe sujet dans cette tournure exhortative.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: ceux d’entre vous qui en ont la capacité
  rationale: δυνατοί peut désigner des personnes capables, puissantes ou investies d’une certaine autorité. Cette formulation conserve l’ambiguïté lexicale sans imposer l’idée de notables ou de dirigeants.
- source_word: φησίν
  choice: non exprimé séparément
  rationale: φησίν est une incise narrative, « dit-il », au sein du discours rapporté. Son emploi serait lourd dans ce verset isolé et sa fonction est normalement portée par le cadre narratif.
- source_word: συγκαταβάντες
  choice: descendent ... avec moi
  rationale: Le participe exprime un déplacement vers le bas effectué ensemble. « Descendre avec moi » rend à la fois κατα- et le préfixe associatif συν-.
- source_word: εἴ τί ἐστιν
  choice: s’il y a quelque chose
  rationale: La formulation garde le caractère conditionnel et indéfini de l’expression grecque.
- source_word: ἐν τῷ ἀνδρὶ
  choice: chez cet homme
  rationale: « Chez cet homme » rend idiomatiquement l’idée d’une faute qui se trouverait en lui, sans transformer ἐν en une accusation déjà établie contre lui.
- source_word: ἄτοπον
  choice: de répréhensible
  rationale: ἄτοπον désigne ce qui est déplacé, fautif ou mauvais. « Répréhensible » convient au contexte judiciaire sans préciser excessivement qu’il s’agirait nécessairement d’un crime.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: qu’ils portent plainte contre lui
  rationale: Dans ce contexte judiciaire, κατηγορέω signifie formuler une accusation ou porter des charges contre quelqu’un. Cette expression française explicite naturellement la démarche officielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’ambiguïté de δυνατοί et le caractère conditionnel de l’éventuelle faute, tout en employant un vocabulaire judiciaire naturel.
