review_pass:
  verdict: revise
  source_fidelity: La tournure « qui en ont la capacité » réduit δυνατοί à l’aptitude personnelle. Dans ce contexte administratif et judiciaire, le terme désigne plus vraisemblablement des personnes disposant d’autorité ou d’influence. « Porter plainte » ne rend pas aussi directement κατηγορείτωσαν, qui signifie « accuser / porter des accusations ».
  naturalness: Le français est globalement fluide, mais « ceux d’entre vous qui en ont la capacité » est lourd et peu idiomatique dans cette injonction. « Ceux d’entre vous qui ont autorité » est plus naturel et adapté au contexte.
  terminology: « Répréhensible » rend bien ἄτοπον sans imposer l’idée d’un crime. « Chez cet homme » conserve l’idée qu’une faute éventuelle se trouverait en lui. « L’accusent » correspond au verbe juridique grec.
  issues:
  - severity: medium
    issue: δυνατοί est rendu par « ceux d’entre vous qui en ont la capacité ».
    rationale: Cette formulation privilégie le sens d’aptitude, alors que le contexte vise vraisemblablement ceux qui ont qualité, autorité ou influence pour accompagner les accusateurs. Une note peut maintenir les autres possibilités lexicales.
  - severity: medium
    issue: κατηγορείτωσαν est rendu par « qu’ils portent plainte contre lui ».
    rationale: « Porter plainte » évoque le dépôt d’une plainte, souvent par une victime, tandis que le grec exprime directement l’action d’accuser. « Qu’ils l’accusent » est plus exact et plus concis.
  revised_text: Que donc ceux d’entre vous qui ont autorité[a] descendent avec moi et, s’il y a chez cet homme quoi que ce soit de répréhensible, qu’ils l’accusent[b].
