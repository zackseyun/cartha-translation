- from: Que ceux d’entre vous qui en ont la capacité[a] descendent donc avec moi et, s’il y a quelque chose de répréhensible chez cet homme, qu’ils portent plainte contre lui[b].
  to: Que donc ceux d’entre vous qui ont autorité[a] descendent avec moi et, s’il y a chez cet homme quoi que ce soit de répréhensible, qu’ils l’accusent[b].
  rationale: La révision restitue le sens administratif probable de δυνατοί sans le présenter comme exclusif, grâce à la note. Elle remplace « porter plainte » par le verbe français qui correspond directement à κατηγορέω. Le conditionnel et l’absence de qualification pénale explicite de l’éventuel tort sont conservés.
