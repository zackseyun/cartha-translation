id: ACT.25.25
reference: Acts 25:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: fr
  text: Mais j’ai constaté qu’il n’avait rien fait qui mérite la mort. Comme il en avait lui-même appelé à l’empereur[a], j’ai décidé de l’envoyer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’Auguste ». Le titre grec Σεβαστός désigne ici l’empereur romain.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: j’ai constaté
  rationale: Dans ce contexte judiciaire, le verbe exprime la conclusion à laquelle Festus est arrivé après examen. « J’ai constaté » est naturel en français et n’impose pas une nuance de verdict formel.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: rien fait qui mérite la mort
  rationale: Cette formulation française naturelle conserve l’idée d’un acte passible de mort sans expliciter davantage que le grec une peine capitale romaine formelle.
- source_word: πεπραχέναι
  choice: avait ... fait
  rationale: Le parfait infinitif renvoie aux actes antérieurs de Paul. « Avait fait » restitue simplement et largement le sens de πράσσω.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: Comme il en avait lui-même appelé
  rationale: La construction absolue donne la circonstance causale de la décision de Festus. « Lui-même » garde l’insistance du grec αὐτοῦ ... τούτου.
- source_word: ἐπικαλεσαμένου
  choice: en avait ... appelé
  rationale: « En appeler à » est l’expression juridique française idiomatique pour le recours à une autorité supérieure.
- source_word: τὸν Σεβαστόν
  choice: l’empereur
  rationale: Σεβαστός est ici le titre grec correspondant à Augustus et désigne l’empereur romain en fonction, non le personnage historique Auguste en particulier.
- source_word: ἔκρινα
  choice: j’ai décidé
  rationale: Le verbe indique ici la décision officielle prise par Festus; « j’ai décidé » est clair et actuel.
- source_word: πέμπειν
  choice: de l’envoyer
  rationale: Le pronom objet, implicite dans le grec et évident d’après le contexte, doit être exprimé en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure juridique « en appeler à » préserve le cadre du recours impérial, tandis que « mérite la mort » reste proche du grec sans surinterprétation institutionnelle.
