  rationale: La révision remplace la restriction indûment forte « seulement » par « en revanche », qui rend le contraste de δέ dans un français naturel. Elle resserre aussi « sujets de désaccord » en « différends » et rend la dernière relative plus fluide, sans modifier le sens ni atténuer le caractère rapporté de l’affirmation de Paul.
