source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: fr
  text: Ils avaient en revanche avec lui certains différends au sujet de leur propre religion[a] et au sujet d’un certain Jésus qui était mort, mais dont Paul affirmait qu’il était vivant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur propre superstition ». Le mot grec peut désigner la religion de manière neutre ou prendre, dans la bouche d’une personne extérieure, une nuance plus péjorative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: sujets de désaccord
  rationale: Le nom désigne ici des questions faisant l’objet d’un différend, et non de simples interrogations. Cette expression garde le caractère conflictuel sans donner au terme une technicité juridique excessive.
- source_word: δέ
  choice: seulement
  rationale: Dans le contexte, δέ oppose les accusations criminelles attendues aux seuls différends religieux effectivement soulevés. « Seulement » exprime naturellement en français cette restriction corrective.
- source_word: τινα
  choice: certains
  rationale: L’indéfini qualifie les sujets de désaccord sans les préciser.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: au sujet de leur propre religion
  rationale: δεισιδαιμονία peut désigner la religion de manière relativement neutre ou avoir la nuance péjorative de « superstition ». « Leur propre religion » rend le référent clairement tout en conservant la distance de Festus; l’autre nuance est signalée en note.
- source_word: εἶχον πρὸς αὐτόν
  choice: avaient … avec lui
  rationale: La tournure exprime des différends les opposant à Paul, sans exiger ici le vocabulaire formel d’une accusation judiciaire.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: et d’un certain Jésus
  rationale: Cette formulation préserve la manière distante dont Festus mentionne Jésus, apparemment sans familiarité personnelle avec le sujet.
- source_word: τεθνηκότος
  choice: qui était mort
  rationale: Le participe parfait présente Jésus dans l’état résultant de sa mort, en contraste direct avec l’affirmation rapportée ensuite.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: mais que Paul affirmait être vivant
  rationale: « Affirmait » rapporte la déclaration de Paul sans que Festus la cautionne; « être vivant » restitue le contenu de l’infinitif ζῆν. « Mais » explicite en français le contraste logique entre mort et vivant.
theological_decisions:
- issue: Sens de δεισιδαιμονία dans le discours de Festus
  choice: religion
  alternative: superstition
  rationale: Le terme grec permet une désignation neutre de la religion comme une appréciation dépréciative. Le texte principal évite d’attribuer à Festus un mépris plus marqué que ne l’impose le grec, tandis que la note conserve l’ambiguïté lexicale.
- issue: Présentation de l’affirmation concernant Jésus vivant
  choice: que Paul affirmait être vivant
  alternative: que Paul disait vivant
  rationale: La proposition rapporte le point de vue de Paul à travers le résumé de Festus; elle ne constitue pas ici une affirmation directe du narrateur. « Affirmait » respecte cette perspective sans se prononcer contre la résurrection.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le ton détaché de Festus. « Sujets de désaccord » est accessible sans être familier; « un certain Jésus » maintient la distance perceptible dans le grec.
