  source_fidelity: 'La restriction « seulement » ne rend pas de façon suffisamment précise le δέ contrastif de Festus : le grec oppose ce qu’il attendait comme accusations à ce qu’il a effectivement constaté. « En revanche » exprime ce contraste sans ajouter une restriction absolue. Le reste rend fidèlement ζητήματα, τῆς ἰδίας δεισιδαιμονίας, τινος Ἰησοῦ, τεθνηκότος et la distance de ἔφασκεν.'
  naturalness: « Certains différends » et « en revanche » sont plus naturels et plus nets en français moderne international que « seulement avec lui certains sujets de désaccord ». La reformulation finale conserve clairement l’opposition entre Jésus mort et l’affirmation de Paul qu’il était vivant.
  terminology: « Leur propre religion » est un choix recevable pour δεισιδαιμονία, avec l’alternative « superstition » conservée en note. « Un certain Jésus » maintient la distance de Festus; « Paul affirmait qu’il était vivant » rapporte son affirmation sans la présenter comme une assertion directe de Festus.
  issues:
