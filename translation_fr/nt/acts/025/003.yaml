  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: fr
  text: 'Ils lui demandaient une faveur contre Paul : qu’il fasse venir Paul à Jérusalem[a], tout en préparant une embuscade pour le tuer en chemin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il envoie chercher Paul à Jérusalem ». Le verbe grec peut signifier « faire venir » ou « envoyer chercher » ; le contexte indique que Paul devait être amené à Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: Ils lui demandaient, comme une faveur contre Paul
  rationale: La tournure exprime une demande de faveur faite à Festus au détriment de Paul. Le participe grec dépend du sujet du verset précédent ; une forme verbale personnelle donne ici une phrase française naturelle. Le nom « Paul » explicite le référent du pronom sans modifier le sens contextuel.
- source_word: ὅπως μεταπέμψηται αὐτὸν
  choice: de le faire venir
  rationale: Après « demander comme une faveur », l’infinitif français exprime naturellement le contenu de la requête. Le moyen μεταπέμψηται indique que Festus devait faire venir Paul, sans nécessairement accomplir lui-même le transfert.
- source_word: εἰς Ἰερουσαλήμ
  choice: à Jérusalem
  rationale: Rendu directionnel courant et idiomatique en français.
- source_word: ἐνέδραν ποιοῦντες
  choice: tout en préparant une embuscade
  rationale: Le participe décrit l’action hostile menée parallèlement à la requête. « Tout en » rend clairement cette circonstance concomitante.
- source_word: ἀνελεῖν αὐτόν
  choice: pour le tuer
  rationale: L’infinitif exprime le but de l’embuscade ; « tuer » restitue directement le sens de ἀναιρέω dans ce contexte.
- source_word: κατὰ τὴν ὁδόν
  choice: en chemin
  rationale: Expression française naturelle pour une action projetée durant le trajet.
