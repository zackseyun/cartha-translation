source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: fr
  text: 'Alors Festus dit : « Roi Agrippa, et vous tous, messieurs ici présents, vous voyez cet homme. Toute la foule des Juifs[a] m’a adressé une requête à son sujet, aussi bien à Jérusalem qu’ici, en criant qu’il ne devait plus vivre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « toute la multitude des Juifs ». Il s’agit d’une expression collective dans le résumé de Festus, qui ne désigne pas nécessairement chaque Juif sans exception.
    reason: Préciser la portée collective et rhétorique de ἅπαν τὸ πλῆθος τῶν Ἰουδαίων sans atténuer la désignation grecque « des Juifs ».
  - marker: b
    text: 'Ou : « qu’il ne devait pas vivre plus longtemps ».'
    reason: Signaler une autre formulation française possible de μὴ δεῖν αὐτὸν ζῆν μηκέτι.
lexical_decisions:
- source_word: φησιν
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français, naturel dans un récit vivant.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: hommes présents avec nous
  rationale: Cette formulation conserve l’adresse formelle et le référent masculin explicite de ἄνδρες, tout en exprimant la présence commune indiquée par συμπαρόντες.
- source_word: θεωρεῖτε τοῦτον
  choice: vous voyez cet homme
  rationale: Festus attire l’attention de l’assemblée sur Paul; « vous voyez » rend naturellement l’indicatif présent sans archaïsme.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: l’ensemble des Juifs
  rationale: La formulation restitue l’expression collective et la généralisation rhétorique de Festus sans imposer que chaque Juif, sans exception, soit visé.
- source_word: ἐνέτυχόν μοι
  choice: m’a adressé une requête
  rationale: Le verbe désigne ici une démarche faite auprès d’une autorité; cette expression convient au cadre officiel et juridique.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: aussi bien à Jérusalem qu’ici
  rationale: La tournure française reproduit clairement la corrélation entre les deux lieux; « ici » désigne Césarée.
- source_word: βοῶντες
  choice: en criant
  rationale: Le participe exprime une insistance vocale forte et publique.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: qu’il ne devait plus vivre
  rationale: Cette formulation garde l’idée de nécessité revendiquée par les opposants sans transformer le propos en formule juridique explicite de condamnation à mort.
theological_decisions:
- issue: La désignation collective « les Juifs » dans un contexte d’hostilité judiciaire
  choice: Conserver « les Juifs » tout en rendant πλῆθος par « l’ensemble »
  alternative: les responsables juifs; toute la foule des Juifs; tout le peuple juif
  rationale: Le grec nomme explicitement les Juifs et ne permet pas de limiter silencieusement le groupe aux seuls responsables. Toutefois, il s’agit d’une formulation collective dans le résumé rhétorique de Festus, non nécessairement d’une affirmation visant chaque individu juif sans exception.
- issue: La force de δεῖν dans la demande rapportée
  choice: qu’il ne devait plus vivre
  alternative: qu’il ne fallait plus qu’il vive; qu’il devait mourir
  rationale: « Devait » conserve la notion de nécessité ou de convenance exprimée par δεῖν, tandis que « devait mourir » expliciterait davantage que le texte grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique est conservé. L’adresse demeure formelle, le contexte judiciaire est perceptible sans lourdeur, et les marqueurs de notes sont placés exactement sur les expressions qu’ils expliquent.
