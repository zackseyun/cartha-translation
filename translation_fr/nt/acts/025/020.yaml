id: ACT.25.20
reference: Acts 25:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: fr
  text: Comme l’examen de ces questions me laissait perplexe[a], je lui ai demandé s’il voulait aller à Jérusalem pour y être jugé à leur sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme j’étais perplexe au sujet du débat sur ces questions ».'
    reason: ζήτησις peut désigner aussi bien un examen qu’un débat ou une controverse, et ἀπορούμενος souligne la perplexité ou l’incertitude.
lexical_decisions:
- source_word: ἀπορούμενος
  choice: comme je ne savais comment
  rationale: Le participe exprime l’embarras ou l’incertitude de Festus; « comme » en rend naturellement la valeur causale dans ce contexte.
- source_word: τὴν περὶ τούτων ζήτησιν
  choice: mener l’examen de ces questions
  rationale: ζήτησις peut désigner une enquête, un examen ou un débat. La formulation française rend la construction de façon naturelle dans ce cadre judiciaire, sans la réduire à une simple investigation technique.
- source_word: ἔλεγον εἰ βούλοιτο
  choice: je lui ai demandé s’il voulait
  rationale: Bien que ἔλεγον signifie littéralement « je disais », la proposition interrogative indirecte introduite par εἰ lui donne ici la fonction de « demander ». βούλοιτο exprime la volonté ou le souhait.
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: aller à Jérusalem
  rationale: Traduction directe, claire et idiomatique du déplacement indiqué.
- source_word: κἀκεῖ κρίνεσθαι περὶ τούτων
  choice: pour y être jugé à leur sujet
  rationale: κρίνεσθαι garde ici son sens judiciaire général; « être jugé » évite de préciser au-delà du grec la forme exacte de la procédure.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le point de vue de Festus et l’ambiguïté de ζήτησις entre examen judiciaire et débat.
