id: ACT.25.1
reference: Acts 25:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: fr
  text: Festus donc, après être arrivé dans la province[a], monta de Césarée à Jérusalem trois jours plus tard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après être entré dans la province » ou « après avoir pris en charge la province ». Le participe grec peut désigner l’arrivée de Festus dans la province et, implicitement, le début de son administration.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φῆστος
  choice: Festus
  rationale: Transcription française traditionnelle du nom propre grec.
- source_word: οὖν
  choice: la progression narrative exprimée par l’enchaînement de la phrase
  rationale: Dans ce contexte, οὖν fait avancer le récit. Une traduction explicite par « donc » serait possible, mais paraîtrait ici plus fortement déductive en français ; l’enchaînement temporel restitue naturellement sa fonction discursive.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: Après son arrivée dans la province
  rationale: Cette formulation garde la valeur temporelle du participe et son sens premier d’entrée ou d’arrivée dans le territoire administratif, sans affirmer explicitement qu’il s’agit de la prise officielle de fonctions.
- source_word: ἐπαρχείᾳ
  choice: province
  rationale: Le terme désigne ici une province de l’administration romaine ; « province » est précis et historiquement approprié.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: trois jours plus tard
  rationale: Rend naturellement en français la succession temporelle exprimée par μετά avec l’accusatif et rattache clairement le déplacement à l’arrivée de Festus.
- source_word: ἀνέβη
  choice: monta
  rationale: Conserve l’expression géographique traditionnelle du déplacement vers Jérusalem, située en hauteur, sans l’alourdir par « fit l’ascension ».
- source_word: ἀπὸ Καισαρείας … εἰς Ἱεροσόλυμα
  choice: de Césarée à Jérusalem
  rationale: Rend directement le point de départ et la destination dans un ordre idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve le mouvement ascendant vers Jérusalem et signale en note l’ambiguïté administrative de l’expression grecque.
