  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: fr
  text: À son sujet, je n’ai rien de précis à écrire à mon seigneur[a]. C’est pourquoi je l’ai fait comparaître devant vous tous, et tout particulièrement devant vous, roi Agrippa, afin qu’après l’examen[b], j’aie quelque chose à écrire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus explicitement, « à l’empereur ». Le grec dit « à mon seigneur », titre employé ici pour l’empereur.
    reason: alternative_reading
  - marker: b
    text: Le terme peut aussi être traduit par « interrogatoire », « audition » ou « enquête »; il désigne l’examen judiciaire de l’affaire de Paul.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: rien de précis
  rationale: L’expression désigne ici un élément sûr, certain ou bien établi que Festus pourrait consigner dans son rapport. « Rien de précis » est naturel en français administratif et conserve l’idée d’un contenu suffisamment défini.
- source_word: τῷ κυρίῳ
  choice: à mon seigneur
  rationale: Le grec emploie κύριος, titre respectueux qui désigne ici l’empereur romain. La traduction conserve la forme lexicale et explicite le référent en note.
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: je l’ai fait comparaître devant vous tous
  rationale: Le verbe signifie amener ou présenter quelqu’un devant une assemblée. Dans ce cadre judiciaire, « faire comparaître » est idiomatique; « vous tous » rend clairement le pluriel, opposé ensuite au singulier adressé à Agrippa.
- source_word: καὶ μάλιστα ἐπὶ σοῦ
  choice: et surtout devant toi
  rationale: μάλιστα met Agrippa particulièrement en relief au sein de l’assistance. Le tutoiement correspond au singulier grec et à l’usage français traditionnel dans ce registre antique.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: après l’interrogatoire
  rationale: ἀνάκρισις désigne un examen, une enquête ou une audition judiciaire. « Interrogatoire » convient au contexte sans imposer un sens excessivement technique; la construction absolue est rendue par une proposition temporelle concise.
- source_word: σχῶ τί γράψω
  choice: j’aie quelque chose à écrire
  rationale: Cette formulation française naturelle conserve l’idée que Festus espère obtenir, grâce à l’examen, la matière nécessaire à son rapport écrit.
theological_decisions:
- issue: Sens de κύριος dans un contexte impérial non théologique
  choice: mon seigneur
  alternative: l’empereur
  rationale: Le mot désigne ici le souverain romain, non Dieu ni le Messie. « Mon seigneur » préserve le titre grec et son ton officiel, tandis qu’une note identifie clairement le référent.
translation_notes:
  register: Français moderne, digne et accessible, avec une tonalité administrative et judiciaire. Le contraste entre le pluriel « vous tous » et le singulier « toi » adressé à Agrippa est conservé. Les marqueurs [a] et [b] figurent dans le texte.
