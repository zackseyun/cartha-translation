source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: fr
  text: 'Mais Festus, voulant accorder une faveur aux Juifs[a], répondit à Paul : « Veux-tu monter à Jérusalem pour y être jugé sur ces affaires devant moi[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « les Juifs » désigne les accusateurs ou responsables juifs qui poursuivent l’affaire contre Paul, et non tous les Juifs sans distinction.
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « pour y passer en jugement sur ces affaires sous mon autorité » ; l’expression peut indiquer que Festus serait l’autorité devant laquelle l’affaire serait entendue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: voulant
  rationale: Le participe présent exprime le motif qui anime Festus; « voulant » en conserve directement la forme et le sens.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Cette traduction rend directement le terme grec, tout en laissant au contexte le soin de préciser qu’il s’agit ici des accusateurs ou responsables juifs engagés dans l’affaire.
- source_word: χάριν καταθέσθαι
  choice: accorder une faveur
  rationale: L’expression idiomatique désigne le fait de faire ou d’accorder une faveur. Cette formulation reste naturelle en français sans prêter explicitement à Festus une intention manipulatrice.
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: répondit à Paul
  rationale: En français narratif, « répondit » rend naturellement la construction grecque redondante « ayant répondu, il dit », sans perte de contenu.
- source_word: Θέλεις
  choice: Veux-tu
  rationale: La question porte directement sur la volonté de Paul; « Veux-tu » est actuel, clair et fidèle.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: monter à Jérusalem
  rationale: « Monter » conserve l’expression grecque habituelle pour un déplacement vers Jérusalem, avec sa dimension géographique et conventionnelle.
- source_word: περὶ τούτων
  choice: sur ces affaires
  rationale: La formule renvoie de manière générale aux points en litige sans préciser davantage que le grec qu’il s’agit formellement d’accusations.
- source_word: κριθῆναι
  choice: être jugé
  rationale: Le passif de κρίνω a ici un sens judiciaire. « Être jugé » reste proche du grec, tandis que « passer en jugement » ou « être traduit en justice » préciseraient différemment la procédure.
- source_word: ἐπ’ ἐμοῦ
  choice: devant moi
  rationale: Dans ce cadre judiciaire, l’expression présente Festus comme l’autorité devant laquelle l’affaire serait entendue, sans affirmer qu’il serait nécessairement l’unique décideur.
theological_decisions:
- issue: Risque d’une généralisation antijuive de τοῖς Ἰουδαίοις
  choice: Conserver « aux Juifs » dans le texte et préciser en note sa portée contextuelle.
  alternative: « aux responsables juifs » ou « aux accusateurs juifs »
  rationale: Le grec emploie le terme général « les Juifs », mais le récit vise ici les personnes qui poursuivent l’accusation contre Paul. La note empêche une généralisation à l’ensemble du peuple juif sans remplacer le terme source par une précision interprétative.
- issue: Portée judiciaire de κριθῆναι ἐπ’ ἐμοῦ
  choice: « être jugé […] devant moi »
  alternative: « comparaître devant mon tribunal » ou « être jugé par moi »
  rationale: 'La formulation retenue préserve l’ambiguïté quant au rôle exact de Festus: présence, présidence ou autorité judiciaire, sans en faire explicitement le seul juge.'
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la progression du grec, mais simplifie naturellement la tournure narrative « ayant répondu, il dit » en « répondit ». Le vocabulaire judiciaire reste accessible sans introduire de technicité absente du texte source.
