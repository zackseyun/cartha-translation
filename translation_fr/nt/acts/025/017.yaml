revisions:
- from: 'Quand ils se furent donc réunis ici, je n’ai fait aucun délai : dès le lendemain, j’ai pris place au tribunal[a] et j’ai ordonné qu’on amène l’homme.'
  to: Donc, quand ils se sont réunis ici, je n’ai pas tardé ; le lendemain, j’ai pris place au tribunal[a] et j’ai ordonné qu’on amène l’homme.
  rationale: La révision maintient tous les éléments du grec et l’ambiguïté appropriée concernant les personnes réunies. Elle remplace un calque français peu naturel par une expression idiomatique, supprime l’insistance additionnelle de « dès », et harmonise le temps verbal avec le registre moderne demandé. La note reste ancrée à « tribunal » et explique le sens concret de βῆμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : l’assemblée des parties à Césarée, l’absence de report, la séance judiciaire du jour suivant et l’ordre de faire comparaître Paul. Toutefois, « dès le lendemain » renforce légèrement τῇ ἑξῆς, qui signifie simplement « le lendemain / le jour suivant ».'
  naturalness: « Je n’ai fait aucun délai » n’est pas idiomatique en français moderne. « Je n’ai pas tardé » est naturel et exprime adéquatement l’absence de report. Le passé antérieur « se furent réunis » est grammatical mais inutilement littéraire avec le reste au passé composé ; « se sont réunis » convient mieux au français international moderne.
  terminology: « Tribunal » est recevable pour βῆμα dans ce contexte, à condition que la note précise qu’il s’agit du siège ou de l’estrade judiciaire officielle, et non nécessairement de l’institution judiciaire abstraite. « L’homme » préserve correctement le grec τὸν ἄνδρα sans ajouter « accusé ».
  issues:
