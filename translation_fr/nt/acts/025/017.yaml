    issue: 'Formulation non idiomatique : « je n’ai fait aucun délai »'
    rationale: Le français moderne dit normalement « je n’ai pas tardé » ou « je n’ai apporté aucun délai » (ce dernier étant plus administratif). La première formulation proposée est un calque peu naturel de ἀναβολὴν μηδεμίαν ποιησάμενος.
  - severity: low
    issue: Renforcement par « dès »
    rationale: τῇ ἑξῆς désigne le lendemain. Le lien avec l’absence de délai est déjà porté par la proposition précédente ; « dès » ajoute une insistance qui n’est pas explicitement marquée.
  - severity: low
    issue: 'Temps verbal soutenu et hétérogène : « se furent réunis »'
    rationale: Le passé antérieur relève d’un registre plus littéraire et s’accorde moins naturellement avec les passés composés de la phrase. Un passé composé conserve l’antériorité contextuelle sans alourdir le style.
  revised_text: Donc, quand ils se sont réunis ici, je n’ai pas tardé ; le lendemain, j’ai pris place au tribunal[a] et j’ai ordonné qu’on amène l’homme.
