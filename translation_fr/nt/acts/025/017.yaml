  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: fr
  text: Donc, quand ils se sont réunis ici, je n’ai pas tardé ; le lendemain, j’ai pris place au tribunal[a] et j’ai ordonné qu’on amène l’homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me suis assis sur le siège du juge ». Le grec βῆμα désigne le siège officiel ou l’estrade judiciaire où le magistrat rendait ses décisions.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: quand ils se furent réunis
  rationale: Le participe aoriste au génitif forme un génitif absolu. Cette formulation exprime naturellement en français le rassemblement antérieur des accusateurs ou des parties sans les nommer explicitement.
- source_word: οὖν
  choice: donc
  rationale: La particule marque ici la progression logique du récit de Festus; « donc » conserve ce lien discursif.
- source_word: ἐνθάδε
  choice: ici
  rationale: Équivalent direct et naturel de l’adverbe de lieu.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: je n’ai fait aucun délai
  rationale: L’expression signifie que Festus n’a ni différé ni ajourné la procédure. La formulation garde l’image du texte grec tout en restant intelligible.
- source_word: τῇ ἑξῆς
  choice: dès le lendemain
  rationale: L’expression temporelle désigne le jour suivant; « dès » met naturellement en relief l’absence de délai signalée dans la proposition précédente.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: j’ai pris place au tribunal
  rationale: Dans ce contexte judiciaire, βῆμα désigne le siège ou l’estrade officielle où le magistrat rend la justice. « Prendre place au tribunal » restitue naturellement l’action et sa fonction.
- source_word: ἐκέλευσα
  choice: j’ai ordonné
  rationale: Le verbe exprime un ordre officiel, ce que rend précisément « ordonner » dans ce contexte.
- source_word: ἀχθῆναι
  choice: qu’on amène
  rationale: L’infinitif passif de ἄγω indique que l’homme doit être conduit devant l’autorité. La tournure française active indéfinie est naturelle et n’ajoute aucune précision spatiale absente du grec.
- source_word: τὸν ἄνδρα
  choice: l’homme
  rationale: Traduction directe qui renvoie à Paul sans ajouter le qualificatif contextuel mais non explicite d’« accusé ».
