  text: ἐνεφάνισάν ⸀τε αὐτῷ ⸂οἱ ἀρχιερεῖς⸃ καὶ οἱ πρῶτοι τῶν Ἰουδαίων κατὰ τοῦ Παύλου, καὶ παρεκάλουν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: fr
  text: Les chefs des prêtres et les notables juifs lui exposèrent alors leurs accusations contre Paul[a] et le pressaient
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui firent part de l’affaire concernant Paul » ou « portèrent des accusations contre Paul devant lui ». Le verbe grec peut simplement signifier faire connaître une affaire, mais il a probablement ici une nuance juridique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: exposèrent leurs accusations
  rationale: Dans ce contexte judiciaire devant le gouverneur, le verbe désigne la présentation d’une affaire à une autorité. Cette formulation exprime la nuance juridique sans supposer un acte formel d’accusation que le grec ne précise pas.
- source_word: τέ
  choice: alors
  rationale: La particule relie la démarche des responsables juifs à l’arrivée de Festus évoquée au verset précédent. « Alors » assure un enchaînement narratif naturel.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif renvoie à Festus, destinataire de l’exposé.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Cette expression française désigne naturellement le groupe dirigeant du sacerdoce de Jérusalem et évite de laisser entendre qu’il y avait simultanément plusieurs grands prêtres en fonction.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: les notables juifs
  rationale: πρῶτοι désigne ici les personnages les plus éminents sur le plan social ou politique. « Notables » restitue ce statut sans réduire le groupe à une fonction officielle précise.
- source_word: κατὰ τοῦ Παύλου
  choice: contre Paul
  rationale: κατά avec le génitif marque ici une démarche hostile ou accusatrice dirigée contre Paul.
- source_word: παρεκάλουν
  choice: le pressèrent
  rationale: Dans ce contexte, le verbe exprime une demande insistante. Le passé simple convient au récit français; la suite du passage peut préciser le contenu de leur requête.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie de nouveau à Festus, objet de leur demande insistante.
