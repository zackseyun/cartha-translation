id: ACT.25.6
reference: Acts 25:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: fr
  text: Après être resté parmi eux huit ou dix jours tout au plus, il descendit à Césarée. Le lendemain, il prit place au tribunal[a] et ordonna qu’on amène Paul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’assit sur le siège du juge ». Le grec βῆμα désigne ici le siège ou l’estrade officielle où le magistrat rendait ses jugements.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: Après avoir passé
  rationale: Le participe aoriste exprime une action antérieure. Avec « jours », « passer » est naturel en français et conserve clairement la relation temporelle.
- source_word: ἐν αὐτοῖς
  choice: parmi eux
  rationale: Cette formulation garde la valeur relationnelle et locale de l’expression grecque sans la réduire à la simple compagnie.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: huit ou dix jours tout au plus
  rationale: « Tout au plus » rend le comparatif négatif οὐ πλείους, tandis que « huit ou dix » préserve l’estimation non exacte du texte.
- source_word: καταβὰς
  choice: il descendit
  rationale: Le verbe conserve l’indication géographique traditionnelle du déplacement de Jérusalem vers Césarée, tout en transformant naturellement le participe grec en verbe principal français.
- source_word: Καισάρειαν
  choice: Césarée
  rationale: Forme française usuelle du nom de lieu Καισάρεια.
- source_word: τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Expression française courante et précise pour le jour suivant son arrivée.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: il prit place au tribunal
  rationale: Dans ce contexte judiciaire, βῆμα désigne le siège ou l’estrade officielle du magistrat. « Prendre place au tribunal » exprime naturellement l’entrée en fonction judiciaire sans surcharger le texte.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe indique un ordre officiel, convenant au cadre judiciaire.
- source_word: ἀχθῆναι
  choice: qu’on amène Paul
  rationale: Cette tournure rend l’infinitif passif de ἄγω et le mouvement de Paul vers l’audience, sans préciser davantage ce que le grec laisse implicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe participiale grecque est répartie en deux phrases pour une lecture naturelle, tout en conservant l’ordre chronologique et le cadre judiciaire.
