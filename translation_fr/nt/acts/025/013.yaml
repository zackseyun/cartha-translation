source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: fr
  text: Quelques jours plus tard, le roi Agrippa et Bérénice arrivèrent à Césarée pour saluer Festus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Quelques jours plus tard
  rationale: Le génitif absolu établit l’arrière-plan temporel. Cette formulation française rend naturellement l’idée que plusieurs jours se sont écoulés, tandis que la légère valeur connective de δέ reste implicite dans la progression du récit.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: le roi Agrippa
  rationale: L’ordre titre-nom est idiomatique en français et conserve βασιλεύς comme titre royal réel.
- source_word: Βερνίκη
  choice: Bérénice
  rationale: Bérénice est la forme française traditionnelle et courante de ce nom propre grec.
- source_word: κατήντησαν
  choice: arrivèrent
  rationale: Dans un contexte de déplacement vers une destination, le verbe exprime le fait d’atteindre le lieu; le passé simple convient au récit suivi.
- source_word: εἰς Καισάρειαν
  choice: à Césarée
  rationale: Avec «arriver», le français emploie naturellement la préposition «à», tout en conservant le sens de destination de εἰς.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: pour saluer Festus
  rationale: Le participe aoriste peut exprimer ici le but ou une circonstance associée à la venue. «Pour saluer» est naturel et n’ajoute pas la nuance protocolaire plus précise de «présenter leurs respects».
- source_word: Φῆστον
  choice: Festus
  rationale: Festus est la forme latine traditionnellement employée en français pour le nom du gouverneur.
