source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: fr
  text: Mais Paul ayant fait appel pour être maintenu en détention en attendant la décision de l’Empereur[a], j’ai ordonné qu’il soit gardé en détention jusqu’à ce que je l’envoie à César.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’Auguste ». Le grec Σεβαστός est le titre impérial équivalent au latin Augustus.'
    reason: Précise le titre grec sous-jacent tout en conservant une formulation naturelle dans le texte.
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: ayant fait appel
  rationale: Dans ce contexte judiciaire romain, le moyen désigne un appel formel; cette expression est naturelle et précise en français.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: être maintenu en détention / être gardé en détention
  rationale: Le verbe concerne ici la détention officielle. Les deux formulations rendent ce sens carcéral tout en évitant une répétition lourde.
- source_word: διάγνωσιν
  choice: décision
  rationale: Le nom désigne une détermination judiciaire; « décision » préserve sa portée sans la réduire à une audience ni suggérer nécessairement une condamnation.
- source_word: Σεβαστοῦ
  choice: l’Empereur
  rationale: Σεβαστός est ici le titre impérial grec correspondant à Augustus. « l’Empereur » en communique naturellement la fonction en français, tandis que la forme littérale est signalée en note.
- source_word: ἀναπέμψω
  choice: je l’envoie
  rationale: Le verbe indique l’envoi de Paul vers l’autorité impériale supérieure; « envoyer » est clair et idiomatique.
- source_word: πρὸς Καίσαρα
  choice: à César
  rationale: Καῖσαρ fonctionne comme titre impérial dans ce contexte; la formulation historique « à César » reste immédiatement compréhensible.
