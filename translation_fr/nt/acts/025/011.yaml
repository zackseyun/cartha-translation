reference: Acts 25:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: fr
  text: Si donc je suis dans mon tort et que j’ai commis un acte qui mérite la mort, je ne refuse pas de mourir. Mais si les accusations que ces hommes portent contre moi sont sans fondement, personne ne peut me livrer à eux en leur faisant cette faveur[a]. J’en appelle à César.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « personne ne peut me livrer à eux à titre de faveur ». Le verbe grec évoque le fait d’accorder ou de livrer quelqu’un comme une faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: je suis dans mon tort
  rationale: Le présent exprime ici un état de culpabilité ou le fait d’agir injustement. « Être dans son tort » convient au cadre moral et judiciaire sans préciser indûment la nature de l’infraction.
- source_word: ἄξιον θανάτου πέπραχά τι
  choice: j’aie fait quelque chose qui mérite la mort
  rationale: Le parfait garde la portée présente d’un acte accompli, tandis que « qui mérite la mort » conserve la force évaluative de ἄξιον θανάτου sans transformer explicitement l’expression en catégorie pénale technique.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: je ne refuse pas de mourir
  rationale: Cette formulation rend directement le sens de refuser ou décliner et préserve l’acceptation conditionnelle de la mort.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: les accusations que ces hommes portent contre moi sont sans fondement
  rationale: La tournure française naturelle exprime que les chefs d’accusation n’ont aucune substance, sans ajouter de conclusion au-delà du grec.
- source_word: χαρίσασθαι
  choice: me livrer à eux pour leur faire plaisir
  rationale: Le verbe désigne ici le fait de céder ou livrer quelqu’un à titre de faveur. La traduction maintient à la fois l’acte judiciaire et la motivation de complaisance.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: J’en appelle à César
  rationale: Formule juridique française claire pour le recours à l’empereur; le pronom « en » marque naturellement l’appel contre la procédure envisagée.
- source_word: μὲν οὖν ... δὲ
  choice: Si donc… Mais si…
  rationale: Cette structure reproduit les deux branches conditionnelles contrastées de l’argument de Paul.
theological_decisions:
- issue: Portée judiciaire de l’acceptation de la mort et de l’appel à César
  choice: Paul accepte conditionnellement de mourir s’il a réellement commis un acte méritant la mort, mais nie qu’on puisse légitimement le livrer à ses accusateurs lorsque leurs accusations sont sans fondement.
  alternative: Comprendre les paroles sur la mort comme une simple formule rhétorique ne concédant aucune légitimité à une peine éventuelle.
  rationale: Le grec formule une véritable condition et oppose la responsabilité en cas de culpabilité à la protection contre une remise arbitraire. La traduction conserve cette tension juridique sans en tirer une doctrine générale sur la peine capitale.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire demeure juridique sans devenir technique; « sont sans fondement » évite le calque peu naturel « il n’y a rien dans les choses dont… ».
