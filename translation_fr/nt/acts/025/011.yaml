- from: Si donc je suis dans mon tort et que j’aie fait quelque chose qui mérite la mort, je ne refuse pas de mourir. Mais si les accusations que ces hommes portent contre moi sont sans fondement, personne ne peut me livrer à eux pour leur faire plaisir[a]. J’en appelle à César.
  to: Si donc je suis dans mon tort et que j’ai commis un acte qui mérite la mort, je ne refuse pas de mourir. Mais si les accusations que ces hommes portent contre moi sont sans fondement, personne ne peut me livrer à eux en leur faisant cette faveur[a]. J’en appelle à César.
  rationale: La révision corrige le mode verbal exigé par la construction conditionnelle française et affine la formulation de la faveur judiciaire impliquée par χαρίσασθαι, sans modifier le sens ni résoudre au-delà du texte les questions juridiques ou théologiques.
