id: ACT.10.33
reference: Acts 10:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: fr
  text: J’ai donc aussitôt envoyé chercher[a], et tu as bien fait de venir. Maintenant donc, nous sommes tous ici devant Dieu pour écouter tout ce que le Seigneur[b] t’a ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « immédiatement » ou « sans attendre ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « le Seigneur » désigne probablement Jésus; certains comprennent toutefois ce titre comme une référence plus générale à Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: aussitôt
  rationale: Cette expression adverbiale marque l’immédiateté. « Aussitôt » est naturel, précis et conserve l’empressement de Corneille.
- source_word: οὖν
  choice: donc
  rationale: La particule établit ici le lien avec ce qui précède. « Donc » restitue clairement cette progression du discours.
- source_word: ἔπεμψα πρὸς σέ
  choice: je t’ai envoyé chercher
  rationale: L’expression signifie en contexte que Corneille a envoyé des personnes chercher Pierre. Cette tournure française idiomatique transmet ce sens sans ajouter explicitement des messagers au texte.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: et tu as bien fait de venir
  rationale: Cette formulation française rend naturellement l’approbation exprimée par καλῶς ἐποίησας et rattache correctement le participe à la venue de Pierre.
- source_word: νῦν οὖν
  choice: À présent
  rationale: L’ensemble introduit la situation présente et le but du rassemblement. « À présent » marque cette transition avec naturel; le lien logique est déjà perceptible dans la suite.
- source_word: πάντες ἡμεῖς … πάρεσμεν
  choice: nous sommes tous ici
  rationale: Cette formulation conserve l’insistance collective de πάντες ἡμεῖς et rend πάρεσμεν dans un français courant.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: « Devant Dieu » conserve la concision ainsi que la solennité de la présence divine consciente.
- source_word: ἀκοῦσαι
  choice: pour écouter
  rationale: L’infinitif exprime le but du rassemblement. « Écouter » souligne ici l’attention portée au message, sans dépasser le sens de ἀκούω.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: tout ce que … t’a ordonné
  rationale: La tournure active est plus naturelle en français que le passif grec tout en conservant la totalité et l’autorité de l’ordre donné.
- source_word: ὑπὸ τοῦ κυρίου
  choice: le Seigneur
  rationale: Le texte grec dit simplement « le Seigneur ». La traduction maintient ce titre sans préciser son référent dans le corps du verset.
theological_decisions:
- issue: Référent de τοῦ κυρίου (« le Seigneur »)
  choice: Conserver « le Seigneur » sans ajouter de nom.
  alternative: Comprendre « le Seigneur » comme Jésus, probablement en vue du contexte, ou comme Dieu en lien avec la mention immédiatement précédente de Dieu.
  rationale: Le grec ne précise pas davantage le référent. Garder « le Seigneur » préserve l’ambiguïté réelle et évite d’introduire dans le texte une identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en employant des tournures idiomatiques, notamment « envoyer chercher » et « tu as bien fait de venir ». Les deux marqueurs de note figurent dans le texte à l’endroit directement concerné.
