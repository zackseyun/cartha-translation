  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: fr
  text: Les croyants d’origine juive[a] qui étaient venus avec Pierre furent stupéfaits parce que le don de l’Esprit Saint avait été répandu[c] même sur les non-Juifs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les croyants issus de la circoncision » ; c’est-à-dire les croyants juifs.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aussi sur les non-Juifs ». Ici, le grec souligne probablement la surprise : « même sur les non-Juifs ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « a été répandu ». Le parfait grec présente une action accomplie dont le résultat demeure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: furent stupéfaits
  rationale: Le verbe exprime ici un profond étonnement. « Furent stupéfaits » est naturel en français moderne et conserve sa force.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: les croyants d’origine juive
  rationale: L’expression désigne les croyants appartenant au groupe identifié par la circoncision, donc les croyants juifs. Cette formulation transmet clairement le référent en français, tandis qu’une note conserve l’image grecque.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: qui étaient venus avec Pierre
  rationale: Le plus-que-parfait français situe naturellement leur venue avant leur réaction et rend l’idée d’accompagnement exprimée par le datif.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: même sur les non-Juifs
  rationale: Dans ce contexte, τὰ ἔθνη désigne les personnes non juives. « Même » rend la valeur additive et emphatique de καί ainsi que la surprise des témoins.
- source_word: ἡ δωρεὰ
  choice: le don
  rationale: « Le don » rend simplement δωρεά, qui désigne ce qui est accordé gratuitement.
- source_word: τοῦ ἁγίου πνεύματος
  choice: de l’Esprit saint
  rationale: Formulation française contemporaine, claire et largement reçue pour le génitif grec.
- source_word: ἐκκέχυται
  choice: avait été répandu
  rationale: Le plus-que-parfait passif convient au récit français et rend l’action accomplie constatée par les témoins; le parfait grec implique aussi que son résultat demeure, nuance signalée en note.
theological_decisions:
- issue: Identification de τὰ ἔθνη dans le contexte d’Actes 10
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contraste porte ici précisément sur l’accueil de personnes non juives, et non sur des entités nationales au sens général.
- issue: Rapport entre le don et l’Esprit dans τοῦ ἁγίου πνεύματος
  choice: le don de l’Esprit saint
  alternative: le don accordé par l’Esprit saint
  rationale: Le génitif grec peut grammaticalement susciter une question de relation, mais le contexte immédiat présente l’Esprit lui-même comme répandu. La traduction conserve donc la formulation grecque sans développer une interprétation causale.
- issue: Valeur aspectuelle de ἐκκέχυται
  choice: avait été répandu
  alternative: a été répandu
  rationale: Le plus-que-parfait s’intègre au point de vue narratif des témoins, tandis que la note précise que le parfait grec présente une action accomplie dont le résultat demeure.
translation_notes:
  register: Français international moderne, digne et accessible. « Non-Juifs » évite l’ambiguïté moderne de « nations » et est plus immédiatement intelligible que « païens » ou « Gentils ». Les marqueurs sont placés sur les expressions auxquelles les notes se rapportent.
