revisions:
- from: Les croyants d’origine juive[a] qui étaient venus avec Pierre furent stupéfaits de voir que le don de l’Esprit saint avait été répandu même sur les non-Juifs[b][c].
  to: Les croyants d’origine juive[a] qui étaient venus avec Pierre furent stupéfaits parce que le don de l’Esprit Saint avait été répandu[c] même sur les non-Juifs[b].
  rationale: La révision retire l’ajout interprétatif « de voir que » et rétablit le lien causal direct exprimé par ὅτι. Elle conserve les choix contextuellement justes pour les croyants juifs et les non-Juifs, maintient une formulation française narrative admissible pour le parfait grec, normalise la capitalisation de « Esprit Saint » et place chaque ancre au plus près de l’élément qu’elle explique.
