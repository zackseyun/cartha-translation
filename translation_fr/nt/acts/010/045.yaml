  timestamp: '2026-07-14T11:09:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les principaux référents : les croyants juifs, Pierre, les non-Juifs, le don de l’Esprit Saint et l’effusion. Toutefois, « furent stupéfaits de voir que » ajoute l’idée perceptive explicite « de voir », absente du grec, dont ὅτι introduit directement le motif de l’étonnement. Il convient de rendre ce lien par « parce que » ou « car ». Le plus-que-parfait français demeure recevable en contexte narratif pour le parfait ἐκκέχυται, avec la note aspectuelle.'
  naturalness: Le français est moderne et fluide. « Les croyants d’origine juive » et « les non-Juifs » sont clairs dans ce contexte. « Esprit Saint » avec majuscule à « Saint » est la graphie française usuelle pour ce titre. Le déplacement de l’ancre de la note sur le parfait vers le verbe améliore sa précision.
  terminology: « Non-Juifs » rend contextuellement τὰ ἔθνη sans l’ambiguïté de « nations » et sans le registre parfois chargé de « païens ». « Le don de l’Esprit Saint » préserve la formulation du grec sans imposer une analyse doctrinale supplémentaire. La note sur « issus de la circoncision » conserve utilement la formulation source.
  issues:
  - severity: medium
    issue: Ajout de « de voir que »
    rationale: Le grec dit que les croyants furent stupéfaits « parce que/car » le don avait été répandu ; il n’énonce pas explicitement qu’ils l’ont vu. L’ajout est aisément évitable et doit être retiré pour une équivalence plus exacte.
  - severity: low
    issue: Ancre de la note sur le parfait
    rationale: La note c explique « avait été répandu », mais son marqueur est actuellement placé après « les non-Juifs ». Il doit être attaché au verbe concerné.
  - severity: low
    issue: Capitalisation de « Esprit Saint »
    rationale: La majuscule à « Saint » correspond à l’usage français courant pour le titre personnel « l’Esprit Saint ».
