lexical_decisions:
- source_word: Ἀνὴρ
  choice: un homme
  rationale: ἀνήρ désigne ici un homme adulte. « Un homme » est naturel en français et conserve la référence masculine singulière.
- source_word: δέ
  choice: non rendu explicitement
  rationale: δέ marque ici une transition narrative légère, sans opposition forte. La progression du récit et la tournure présentative française suffisent à rendre cette fonction sans ajouter artificiellement « or » ou « mais ».
- source_word: τις
  choice: il y avait … un homme
  rationale: τις introduit un nouveau personnage de manière indéfinie. La tournure « il y avait … un homme » exprime naturellement cette indétermination en français moderne.
- source_word: ἐν Καισαρείᾳ
  choice: à Césarée
  rationale: Traduction locative directe; « Césarée » est la forme française usuelle du nom de lieu.
- source_word: ὀνόματι Κορνήλιος
  choice: nommé Corneille
  rationale: Le datif ὀνόματι suivi du nom propre se rend naturellement par « nommé ». « Corneille » est la forme française traditionnelle et intelligible de Κορνήλιος.
- source_word: ἑκατοντάρχης
  choice: centurion
  rationale: « Centurion » est le terme historique précis et courant pour cet officier de l’armée romaine.
- source_word: ἐκ σπείρης
  choice: de la cohorte
  rationale: σπεῖρα désigne ici une unité militaire romaine, une cohorte. La préposition ἐκ indique l’appartenance ou la provenance au sein de cette unité.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: appelée « l’Italique »
  rationale: Cette formulation conserve le participe « appelée » et traite l’adjectif Ἰταλική comme la désignation de la cohorte, sans préciser au-delà du texte la nature exacte de son lien avec l’Italie.
