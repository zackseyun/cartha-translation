id: ACT.10.47
reference: Acts 10:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: fr
  text: Peut-on refuser l’eau à ces gens pour les empêcher d’être baptisés[a], eux qui ont reçu l’Esprit Saint tout comme nous ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « empêcher ces gens d’être baptisés en leur refusant l’eau » ou « interdire que ces gens soient baptisés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μήτι
  choice: Peut-on… ?
  rationale: La particule introduit une question rhétorique qui appelle une réponse négative. En français, cette formulation interrogative transmet naturellement l’idée que personne ne saurait légitimement s’y opposer.
- source_word: τὸ ὕδωρ
  choice: l’eau
  rationale: L’article est conservé. Dans le contexte, il s’agit de l’eau destinée au baptême.
- source_word: δύναται κωλῦσαί τις
  choice: Peut-on refuser
  rationale: Le grec demande si quelqu’un peut faire obstacle ou opposer un refus. « Refuser l’eau à ces gens » est naturel en français et conserve l’idée que l’accès au baptême ne doit pas leur être interdit.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: pour les empêcher d’être baptisés
  rationale: L’infinitif articularisé avec μή exprime l’action que le refus de l’eau empêcherait. La voix passive de βαπτισθῆναι est conservée.
- source_word: τούτους
  choice: ces gens
  rationale: Cette expression française actuelle désigne naturellement le groupe présent sans préciser un sexe que le contexte n’impose pas.
- source_word: οἵτινες
  choice: eux qui
  rationale: La tournure caractérise les personnes concernées par le fait qu’elles ont reçu l’Esprit et laisse percevoir la valeur argumentative, voire causale, du relatif.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: C’est la désignation française moderne et usuelle, fidèle au titre grec.
- source_word: ἔλαβον
  choice: ont reçu
  rationale: Le passé composé rend un événement accompli dont le résultat demeure pertinent pour l’argument de Pierre.
- source_word: ὡς καὶ ἡμεῖς
  choice: tout comme nous
  rationale: Cette formulation conserve la comparaison explicite entre leur réception de l’Esprit et celle du groupe auquel Pierre s’identifie.
theological_decisions:
- issue: Rapport entre la réception de l’Esprit et le baptême d’eau
  choice: Le texte affirme que ces gens ont déjà reçu l’Esprit Saint, ce qui fonde la question rhétorique sur l’impossibilité de leur refuser le baptême d’eau.
  alternative: Une formulation qui laisserait indéterminé l’ordre narratif entre la réception de l’Esprit et le baptême.
  rationale: Dans cet épisode, l’aoriste ἔλαβον présente la réception de l’Esprit comme accomplie avant le baptême envisagé. La traduction conserve cet ordre narratif sans en tirer une doctrine sacramentelle étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique reste naturelle sans ajouter « certainement » ou « n’est-ce pas », tandis que « eux qui » préserve la force argumentative du relatif grec.
