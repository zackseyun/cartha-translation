  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: fr
  text: Il s’y trouvait toutes sortes de quadrupèdes, de reptiles de la terre[a] et d’oiseaux du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de bêtes qui rampent sur la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Il s’y
  rationale: Le pronom relatif renvoie à la grande toile ou au récipient de la vision. La tournure « Il s’y trouvait » exprime naturellement en français la localisation sans alourdir la phrase avec « dans laquelle ».
- source_word: ὑπῆρχεν
  choice: trouvait
  rationale: Dans cette construction impersonnelle, l’imparfait de ὑπάρχω indique la présence ou l’existence dans la toile. « Il s’y trouvait » est naturel et n’ajoute pas l’idée plus forte de contenu impliquée par « contenait ».
- source_word: πάντα
  choice: toutes sortes de
  rationale: Avec plusieurs catégories animales au pluriel, πάντα exprime ici une totalité représentative ou une grande diversité. « Toutes sortes de » donne un français naturel sans suggérer nécessairement que chaque animal individuel était présent.
- source_word: τὰ τετράποδα
  choice: quadrupèdes
  rationale: « Quadrupèdes » rend précisément les animaux à quatre pattes et demeure clair en français courant soutenu, tout en évitant la lourdeur de « animaux à quatre pattes » dans cette énumération.
- source_word: ἑρπετὰ τῆς γῆς
  choice: reptiles de la terre
  rationale: « Reptiles » est concis et traditionnel, mais le grec ἑρπετά peut englober plus largement ce qui rampe; cette amplitude est signalée en note. « De la terre » conserve le génitif classificatoire.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: oiseaux du ciel
  rationale: Dans cette liste, « oiseaux » rend naturellement πετεινά, et « du ciel » traduit οὐρανός dans son sens spatial, sans évoquer ici le séjour divin.
- source_word: καὶ ... καὶ
  choice: de ... et d’
  rationale: La coordination grecque des catégories est conservée dans une énumération française idiomatique, où la première conjonction n’a pas besoin d’être répétée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’énumération reste concrète et lisible; une note préserve l’étendue sémantique de ἑρπετά, plus large que le seul sens zoologique moderne de « reptiles ».
