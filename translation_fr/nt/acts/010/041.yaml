  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: fr
  text: non pas à tout le peuple, mais à des témoins choisis d’avance par Dieu — à nous, qui avons mangé et bu avec lui après qu’il est ressuscité d’entre les morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: non pas à tout le peuple
  rationale: Le datif indique les destinataires de l’apparition; cette formulation naturelle conserve le contraste avec le groupe restreint des témoins.
- source_word: μάρτυσι
  choice: à des témoins
  rationale: Dans les Actes, μάρτυς désigne couramment ceux qui rendent témoignage à ce qu’ils ont vu; « témoins » est précis et usuel.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: choisis d’avance par Dieu
  rationale: Le participe parfait passif exprime une sélection divine antérieure dont l’effet demeure. Le verbe peut aussi évoquer une désignation ou une nomination, mais « choisis d’avance » rend ici naturellement le sens contextuel.
- source_word: ἡμῖν
  choice: à nous
  rationale: Le pronom au datif est en apposition à « témoins » et identifie ceux-ci; le tiret marque clairement cette précision.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: qui avons mangé et bu avec lui
  rationale: Les verbes composés avec συν- expriment concrètement le partage du repas; la traduction conserve le témoignage à la réalité corporelle de l’apparition.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: après qu’il s’est relevé d’entre les morts
  rationale: La construction avec μετά est temporelle et l’infinitif ἀναστῆναι a ici un sens intransitif. « Se relever d’entre les morts » suit cette forme tout en restant idiomatique en français.
theological_decisions:
- issue: Formulation de la résurrection dans ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: après qu’il s’est relevé d’entre les morts
  alternative: après qu’il a été relevé d’entre les morts
  rationale: Le grec se rend naturellement par une tournure active ou pronominale, sans nier pour autant l’action divine affirmée ailleurs. La traduction suit la formulation propre à ce verset et maintient l’accent sur la réalité corporelle du Ressuscité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la continuité avec le verset précédent; le tiret rend l’apposition de ἡμῖν sans alourdir la phrase.
