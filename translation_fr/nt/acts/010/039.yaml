source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: fr
  text: Nous sommes témoins de tout ce qu’il a fait, tant dans le pays des Juifs qu’à Jérusalem. Ils l’ont aussi mis à mort en le suspendant à un bois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à un arbre »; dans ce contexte, « sur une croix ». Le mot grec peut désigner un arbre ou du bois et fait probablement écho à Deutéronome 21.23.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: témoins
  rationale: « Témoins » est le terme français naturel dans un contexte de témoignage fondé sur ce qui a été vu et vécu.
- source_word: πάντων ὧν ἐποίησεν
  choice: de tout ce qu’il a fait
  rationale: Cette formulation idiomatique conserve la portée globale de πάντων.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: dans le pays des Juifs
  rationale: « Pays » rend χώρα comme territoire sans l’identifier trop précisément à la province romaine de Judée; « des Juifs » préserve la formulation du génitif.
- source_word: καὶ Ἰερουσαλήμ
  choice: et à Jérusalem
  rationale: La préposition appropriée est reprise en français pour rendre la coordination naturelle et claire.
- source_word: ἀνεῖλαν
  choice: l’ont fait mourir
  rationale: Cette expression rend le sens de mise à mort de ἀναιρέω dans un registre digne et courant.
- source_word: κρεμάσαντες
  choice: en le pendant
  rationale: Le gérondif exprime naturellement le moyen ou la manière associés au verbe principal.
- source_word: ἐπὶ ξύλου
  choice: à un arbre
  rationale: « Arbre » conserve le choix lexical de ξύλον et sa probable résonance avec Deutéronome 21.23, sans le remplacer directement par l’interprétation « croix ».
theological_decisions:
- issue: Sens de ξύλον dans le contexte de la crucifixion
  choice: à un arbre
  alternative: au bois; à une croix
  rationale: Le grec emploie ξύλον, et non σταυρός. « Arbre » maintient la formulation et l’écho scripturaire possibles, tandis que « croix » expliciterait l’instrument historique au prix de la nuance lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du témoignage oral de Pierre sans lourdeur; le terme « arbre » préserve l’ambiguïté et l’allusion possibles du grec.
