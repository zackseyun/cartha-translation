review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle. Toutefois, « en le pendant à un arbre » évoque plus spontanément en français une pendaison que la suspension liée à l’exécution par crucifixion; « suspendant à un bois » rend mieux κρεμάσαντες ἐπὶ ξύλου tout en conservant le choix lexical distinct de σταυρός.
  naturalness: « Nous sommes témoins », « de tout ce qu’il a fait » et « tant dans le pays des Juifs qu’à Jérusalem » sont naturels dans un français international moderne. « Suspendre à un bois » est une expression biblique française compréhensible et plus idiomatique ici que « pendre à un arbre ».
  terminology: « Témoins », « pays des Juifs », « mis à mort » et « bois » respectent le registre et les termes du texte. « Bois » permet de préserver l’ambiguïté de ξύλον et son possible écho à Deutéronome 21.23, sans imposer « croix ».
  issues:
  - severity: medium
    issue: « en le pendant à un arbre »
    rationale: Cette formulation est grammaticalement possible, mais « pendre quelqu’un » suggère couramment une exécution par pendaison. Le participe κρεμάσαντες décrit ici la suspension dans le cadre de la mise à mort; « en le suspendant à un bois » évite cette connotation indue tout en restant proche du grec.
  - severity: low
    issue: 'Note : « à une croix »'
    rationale: Comme expression française, l’instrument est normalement rendu « sur une croix ». La note doit également présenter « arbre » et « bois » comme possibilités lexicales du grec, plutôt que de qualifier simultanément les deux de sens littéral dans une formulation imprécise.
  revised_text: Nous sommes témoins de tout ce qu’il a fait, tant dans le pays des Juifs qu’à Jérusalem. Ils l’ont aussi mis à mort en le suspendant à un bois[a].
