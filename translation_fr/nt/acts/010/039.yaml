- from: Nous sommes témoins de tout ce qu’il a fait dans le pays des Juifs et à Jérusalem. Ils l’ont aussi fait mourir en le pendant à un arbre[a].
  to: Nous sommes témoins de tout ce qu’il a fait, tant dans le pays des Juifs qu’à Jérusalem. Ils l’ont aussi mis à mort en le suspendant à un bois[a].
  rationale: La révision remplace une tournure susceptible d’évoquer une pendaison par « suspendant à un bois », qui rend plus précisément le rapport entre κρεμάσαντες et la mise à mort. Elle conserve l’ambiguïté lexicale de ξύλον et son écho scripturaire possible. « Tant… qu’… » restitue explicitement la corrélation ἔν τε… καὶ….
