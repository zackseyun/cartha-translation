  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: fr
  text: 'Mais Pierre le releva[a] en disant : « Lève-toi[b] ! Moi aussi, je suis un homme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’aida à se relever ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Mets-toi debout ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: le releva
  rationale: Le verbe ἐγείρω désigne ici l’action de remettre Corneille debout après qu’il est tombé aux pieds de Pierre. « Le releva » conserve le sens physique sans préciser indûment la manière.
- source_word: Ἀνάστηθι
  choice: Lève-toi
  rationale: L’impératif aoriste de ἀνίστημι ordonne directement à Corneille de se remettre debout. « Lève-toi » est naturel, clair et adapté au contexte.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: Moi aussi
  rationale: 'La combinaison καί, ἐγώ et αὐτός exprime une inclusion emphatique : Pierre souligne qu’il partage lui-même la condition humaine. « Moi aussi » rend cette insistance idiomatiquement.'
- source_word: ἄνθρωπός εἰμι
  choice: je suis un homme
  rationale: Cette formulation traduit directement le singulier ἄνθρωπος appliqué à Pierre. Elle évite d’ajouter « seulement », absent du grec.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici un léger contraste entre la prosternation de Corneille au verset précédent et la réaction corrective de Pierre.
theological_decisions:
- issue: Réaction de Pierre à la prosternation respectueuse de Corneille
  choice: Le texte montre Pierre interrompant le geste et invoquant leur commune humanité.
  alternative: On pourrait comprendre la réponse plus étroitement comme une simple marque d’humilité personnelle.
  rationale: « Lève-toi ! Moi aussi, je suis un homme » préserve la portée immédiate du grec sans élaborer une doctrine générale du culte ou de la vénération.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le discours direct reste bref et ferme, et « Moi aussi » conserve l’emphase de καὶ ἐγὼ αὐτός.
