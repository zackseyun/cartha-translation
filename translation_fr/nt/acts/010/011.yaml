  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: fr
  text: et il voit le ciel ouvert[a], et quelque chose[b] qui descend, semblable à une grande toile, et qui est abaissé jusqu’à terre par ses quatre coins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le ciel qui s’est ouvert ». Le grec οὐρανός peut désigner aussi bien le ciel visible que le domaine céleste.
    reason: lexical_alternative
  - marker: b
    text: Ou « une sorte d’objet » ou « un récipient ». Le grec reste volontairement indéfini.
    reason: lexical_alternative
  - marker: c
    text: Ou « par ses quatre extrémités ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: il voit
  rationale: Le présent narratif grec est conservé et « voit » exprime naturellement la perception immédiate de la vision.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: le ciel ouvert
  rationale: En français, « ciel » peut désigner à la fois l’espace visible et la demeure céleste; dans ce contexte visionnaire, il garde naturellement la portée révélatrice de l’expression grecque.
- source_word: καταβαῖνον
  choice: descend
  rationale: Le présent rend le mouvement en cours avec clarté et conserve la vivacité du récit.
- source_word: σκεῦός τι
  choice: quelque chose
  rationale: Le terme σκεῦος a un sens large (objet, récipient, ustensile) et τι le laisse indéfini; « quelque chose » évite de préciser à tort sa nature ou sa fonction.
- source_word: ὡς ὀθόνην μεγάλην
  choice: semblable à une grande toile
  rationale: Cette formulation conserve explicitement la comparaison et rend ὀθόνη par un terme français courant sans imposer une matière particulière.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: par ses quatre coins
  rationale: ἀρχή désigne ici les extrémités; pour un objet semblable à une toile, « coins » est l’expression française la plus naturelle.
- source_word: καθιέμενον ἐπὶ τῆς γῆς
  choice: que l’on abaisse jusqu’à terre
  rationale: La tournure conserve le mouvement passif vers le bas et rend idiomatiquement la destination indiquée par ἐπί avec le génitif.
theological_decisions:
- issue: Portée de οὐρανός dans une vision
  choice: le ciel
  alternative: le ciel visible
  rationale: Le français « ciel » préserve l’ambivalence lexicale tout en convenant au contexte d’une révélation divine, sans ajouter de précision doctrinale absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation en deux phrases évite une coordination lourde tout en conservant le présent narratif et la progression de la vision.
