id: ACT.10.5
reference: Acts 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: fr
  text: Et maintenant, envoie des hommes à Joppé et fais venir un certain Simon, appelé Pierre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un homme nommé Simon, connu sous le nom de Pierre ».'
    reason: Alternative lexicale permettant un français plus explicite pour Σίμωνά τινα ὃς ἐπικαλεῖται Πέτρος.
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec les paroles précédentes et la valeur temporelle de νῦν, dans un français naturel.
- source_word: πέμψον
  choice: envoie
  rationale: L’impératif « envoie » rend directement et naturellement l’aoriste impératif actif à la deuxième personne du singulier.
- source_word: ἄνδρας
  choice: des hommes
  rationale: ἀνήρ désigne ici des hommes, vraisemblablement chargés d’accomplir la mission; « messagers » préciserait une fonction que le grec n’énonce pas explicitement.
- source_word: εἰς Ἰόππην
  choice: à Joppé
  rationale: Rend le mouvement vers la ville dans l’usage idiomatique français et emploie la forme française traditionnelle du toponyme.
- source_word: μετάπεμψαι
  choice: fais venir
  rationale: Le moyen μετάπεμψαι signifie envoyer chercher quelqu’un pour qu’il vienne. « Fais venir » est courant et évite la nuance potentiellement autoritaire de « convoque ».
- source_word: Σίμωνά τινα
  choice: un certain Simon
  rationale: Préserve la manière dont τινα introduit une personne déterminée mais non encore identifiée pour Corneille.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: appelé Pierre
  rationale: Exprime sobrement le nom sous lequel Simon est appelé, sans faire de « Pierre » un nom de famille.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la coordination et la progression des deux impératifs grecs, tout en rendant μετάπεμψαι par une expression française naturelle.
