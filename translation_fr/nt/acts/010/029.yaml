  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: fr
  text: C’est pourquoi je suis venu sans faire d’objection quand on m’a envoyé chercher[a]. Je vous demande donc[b] pour quelle raison vous m’avez envoyé chercher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans hésiter ». Le grec signifie plus littéralement « sans objection » ou « sans contester ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Je vous demande donc pourquoi vous m’avez envoyé chercher ». Littéralement : « pour quelle raison vous m’avez envoyé chercher ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: C’est pourquoi
  rationale: Marque la conséquence de l’explication précédente. La légère insistance de καί est naturellement absorbée dans la tournure française.
- source_word: ἀναντιρρήτως
  choice: sans faire d’objection
  rationale: Rend l’idée de ne pas contredire, protester ou résister, plus précisément que « sans hésiter ».
- source_word: ἦλθον
  choice: je suis venu
  rationale: Traduction directe et naturelle de l’aoriste de ἔρχομαι.
- source_word: μεταπεμφθείς
  choice: quand on m’a envoyé chercher
  rationale: Le participe passif exprime le fait d’avoir été mandé; la tournure avec « on » conserve le sens passif de façon idiomatique en français.
- source_word: πυνθάνομαι οὖν
  choice: Je vous demande donc
  rationale: Rend la demande d’information et la transition logique signalée par οὖν.
- source_word: τίνι λόγῳ
  choice: pour quelle raison
  rationale: Préserve la formulation explicite du grec plutôt que de la condenser en « pourquoi ».
- source_word: μετεπέμψασθέ με
  choice: vous m’avez envoyé chercher
  rationale: Rend idiomatiquement le verbe « envoyer chercher, faire venir » et maintient la cohérence lexicale avec le participe précédent.
