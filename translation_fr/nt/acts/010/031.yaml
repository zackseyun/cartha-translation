id: ACT.10.31
reference: Acts 10:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: fr
  text: 'Et il dit : « Corneille, ta prière a été entendue, et Dieu s’est souvenu de tes dons aux pauvres[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tes aumônes » ou « de tes actes de générosité ». Le terme grec désigne des dons ou des gestes de compassion envers les personnes dans le besoin.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: il dit
  rationale: 'Le présent historique grec est conservé : il est naturel dans la narration française et rend directement la forme du texte source.'
- source_word: Κορνήλιε
  choice: Corneille
  rationale: Forme française biblique traditionnelle et toujours intelligible du nom propre.
- source_word: εἰσηκούσθη
  choice: a été entendue
  rationale: Le passé composé passif rend naturellement l’aoriste passif et laisse entendre que la prière a reçu une réponse favorable, sans l’expliciter davantage.
- source_word: ἡ προσευχὴ
  choice: ta prière
  rationale: Rend le singulier grec par le terme français courant et précis.
- source_word: αἱ ἐλεημοσύναι
  choice: tes dons aux pauvres
  rationale: Expression moderne et concrète pour des dons de compassion destinés aux personnes dans le besoin ; elle évite le caractère vieilli d’« aumônes ».
- source_word: ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ
  choice: Dieu s’est souvenu de
  rationale: La tournure active est idiomatique en français et conserve le motif biblique du souvenir divin, tout en rendant explicitement Dieu comme agent suggéré par « devant Dieu ».
theological_decisions:
- issue: Portée des ἐλεημοσύναι de Corneille
  choice: dons aux pauvres
  alternative: aumônes ; actes de générosité
  rationale: La formulation désigne une aide concrète et miséricordieuse sans en déduire une doctrine du mérite.
- issue: Langage du souvenir divin
  choice: Dieu s’est souvenu de tes dons
  alternative: tes dons ont été rappelés devant Dieu ; Dieu a pris note de tes dons
  rationale: Cette formulation préserve l’idiome biblique du souvenir et sa force relationnelle, sans expliquer le mécanisme ni la portée sotériologique de ce souvenir.
- issue: Valeur de εἰσηκούσθη
  choice: ta prière a été entendue
  alternative: ta prière a été exaucée
  rationale: « Entendue » conserve la formulation passive et évite de préciser au-delà du grec la manière exacte dont la prière a reçu une réponse favorable.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse grecque au singulier. La ponctuation française et les guillemets français sont employés.
