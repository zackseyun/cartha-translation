  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: fr
  text: 'Alors Pierre prit la parole et dit : « En vérité, je comprends que Dieu ne fait pas de favoritisme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Dieu n’est pas quelqu’un qui fait acception de personnes » ; l’expression signifie qu’il ne favorise personne en fonction de son statut ou de son appartenance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: prit la parole
  rationale: L’expression grecque signifie littéralement « ayant ouvert la bouche », mais fonctionne ici comme une tournure solennelle introduisant la prise de parole. « Prit la parole » est naturel en français moderne et conserve cette valeur introductive.
- source_word: δὲ
  choice: Alors
  rationale: La particule marque ici la progression du récit. « Alors » relie naturellement la déclaration de Pierre à ce qui précède.
- source_word: Ἐπ’ ἀληθείας
  choice: En vérité
  rationale: Cette formulation digne et courante exprime l’authenticité et la certitude de la constatation de Pierre sans en accentuer indûment la force.
- source_word: καταλαμβάνομαι
  choice: je comprends
  rationale: Le verbe exprime le fait de saisir ou de reconnaître une réalité. « Je comprends » reste proche du grec tout en laissant le contexte suggérer qu’il s’agit d’une prise de conscience.
- source_word: προσωπολήμπτης
  choice: fait du favoritisme
  rationale: Le nom grec désigne quelqu’un qui juge ou favorise selon la personne, littéralement selon l’apparence du visage. La tournure française communique clairement l’impartialité de Dieu sans employer le calque vieilli « acception de personnes ».
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction française usuelle de θεός dans ce contexte.
theological_decisions:
- issue: Formulation de l’impartialité de Dieu sans imposer une construction doctrinale ultérieure
  choice: Dieu ne fait pas de favoritisme
  alternative: Dieu ne fait pas acception de personnes
  rationale: La formulation choisie affirme clairement que Dieu ne favorise pas les gens en fonction de leur personne ou de leur appartenance. Elle préserve la portée contextuelle du propos sans préciser à la place du texte toutes ses implications théologiques.
translation_notes:
  register: Français international moderne, digne et accessible. « Prit la parole » rend idiomatiquement la formule grecque solennelle, tandis que « en vérité » conserve une légère élévation de registre. Le marqueur [a] figure dans le texte principal.
