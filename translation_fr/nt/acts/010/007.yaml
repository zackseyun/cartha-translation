  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: fr
  text: Quand l’ange qui lui parlait fut parti, il appela deux de ses domestiques[a] et un soldat pieux parmi ceux qui étaient attachés à son service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « deux de ses esclaves domestiques ». Le grec οἰκέται désigne des personnes attachées au service d’une maisonnée et peut impliquer le statut d’esclave.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: Quand … fut parti
  rationale: La proposition temporelle situe le départ accompli de l’ange avant l’appel des trois hommes. Le passé antérieur est naturel dans ce récit au passé et marque clairement cette antériorité.
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: l’ange qui lui parlait
  rationale: Dans le contexte de la vision de Corneille, ἄγγελος désigne un être céleste. La relative rend naturellement le participe présent et son aspect en cours.
- source_word: φωνήσας
  choice: il appela
  rationale: Le participe aoriste introduit l’action qui se prolonge au verset suivant. Une forme verbale personnelle donne en français une phrase lisible sans modifier la séquence narrative.
- source_word: δύο τῶν οἰκετῶν
  choice: deux de ses serviteurs de maison
  rationale: οἰκέτης désigne une personne en condition de service au sein d’une maisonnée, avec la possibilité du statut d’esclave. « Serviteurs de maison » conserve le cadre domestique; le possessif est explicité d’après le contexte.
- source_word: στρατιώτην εὐσεβῆ
  choice: un soldat pieux
  rationale: « Soldat » rend directement στρατιώτης. « Pieux » exprime la dévotion religieuse de εὐσεβής sans lui imposer la désignation plus particulière de « craignant Dieu ».
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: parmi ceux qui étaient constamment à son service
  rationale: La formule conserve la valeur partitive du génitif et la nuance de persévérance ou d’assiduité portée par προσκαρτερέω, ici appliquée à l’entourage personnel de Corneille.
theological_decisions:
- issue: Sens de ἄγγελος dans ce contexte
  choice: ange
  alternative: messager
  rationale: Le contexte immédiat présente le personnage comme l’envoyé céleste apparu à Corneille dans une vision; « ange » est donc le sens contextuel, non une précision doctrinale ajoutée.
- issue: Portée religieuse de εὐσεβής
  choice: pieux
  alternative: craignant Dieu
  rationale: « Pieux » préserve le sens général de dévotion respectueuse. « Craignant Dieu » pourrait suggérer un statut religieux plus technique que l’adjectif seul n’exprime pas nécessairement.
translation_notes:
  register: Français moderne, international et digne. La formulation reste accessible tout en conservant le cadre domestique, l’assiduité du soldat au service de Corneille et l’ambiguïté sociale de οἰκέτης.
