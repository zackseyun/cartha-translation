id: ACT.10.42
reference: Acts 10:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: fr
  text: Il nous a ordonné de proclamer au peuple et d’attester solennellement que c’est lui que Dieu a établi juge des vivants et des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « désigné par Dieu comme juge des vivants et des morts » ; autre traduction possible : « destiné par Dieu à être juge des vivants et des morts ».'
    reason: Alternative lexicale pour ὁ ὡρισμένος, qui peut exprimer l’idée d’établir, de désigner ou de déterminer pour une fonction.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: a ordonné
  rationale: Le verbe exprime une directive donnée avec autorité; « a ordonné » en conserve la force en français moderne.
- source_word: κηρύξαι
  choice: de proclamer
  rationale: Le terme désigne une annonce publique; « proclamer » préserve cette dimension sans limiter le sens à une prédication formelle.
- source_word: τῷ λαῷ
  choice: au peuple
  rationale: Le contexte renvoie au peuple juif, mais le verset ne précise pas « Israël »; « au peuple » reste fidèle à la formulation grecque.
- source_word: διαμαρτύρασθαι
  choice: d’attester solennellement
  rationale: Le verbe évoque un témoignage insistant et solennel; cette formulation restitue à la fois l’idée d’attestation et sa gravité.
- source_word: οὗτός
  choice: c’est lui
  rationale: Le démonstratif désigne Jésus avec insistance. « C’est lui » est naturel en français et conserve cette mise en relief.
- source_word: ὁ ὡρισμένος
  choice: que Dieu a établi
  rationale: Le participe parfait passif indique une désignation divine dont la validité demeure. « A établi » exprime clairement cette nomination durable.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Dieu a établi
  rationale: La construction passive d’agent est rendue activement en français pour une phrase plus naturelle, sans modifier l’agent ni le sens.
- source_word: κριτὴς
  choice: juge
  rationale: « Juge » est l’équivalent direct et naturel du nom prédicatif grec.
- source_word: ζώντων καὶ νεκρῶν
  choice: des vivants et des morts
  rationale: Cette formulation consacrée et exacte conserve la portée universelle et solennelle de l’autorité judiciaire évoquée.
theological_decisions:
- issue: Portée de la désignation divine de Jésus comme juge
  choice: que Dieu a établi juge des vivants et des morts
  alternative: désigné par Dieu comme juge des vivants et des morts
  rationale: Le texte affirme que Dieu a conféré à Jésus la fonction de juge de tous, vivants et morts. La traduction conserve cette affirmation sans la développer selon une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination des deux infinitifs est conservée, ainsi que la solennité de la mission et du jugement. La voix active dans « que Dieu a établi » évite une tournure passive lourde tout en reproduisant exactement l’agent divin.
