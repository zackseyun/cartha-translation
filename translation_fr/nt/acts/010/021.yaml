  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: fr
  text: 'Alors Pierre descendit vers ces hommes et leur dit : « Me voici : c’est moi que vous cherchez. Pour quelle raison êtes-vous ici ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: descendit
  rationale: 'Le participe aoriste exprime ici une action antérieure immédiate : Pierre descend de la terrasse ou de l’étage vers les visiteurs. Une forme verbale coordonnée est naturelle en français.'
- source_word: δὲ
  choice: Alors
  rationale: La particule marque la progression du récit plutôt qu’une opposition nette.
- source_word: πρὸς τοὺς ἄνδρας
  choice: vers ces hommes
  rationale: πρός avec l’accusatif indique le mouvement en direction des hommes déjà mentionnés ; « ces hommes » assure une reprise naturelle en français.
- source_word: Ἰδοὺ
  choice: Me voici
  rationale: Dans cette présentation personnelle, « Me voici » rend naturellement l’appel à l’attention de ἰδού avec ἐγώ εἰμι.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: c’est moi que vous cherchez
  rationale: Cette tournure française idiomatique conserve l’insistance du pronom ἐγώ et identifie clairement Pierre comme la personne recherchée.
- source_word: τίς ἡ αἰτία
  choice: Pour quelle raison
  rationale: Cette formulation garde le nom explicite αἰτία, « raison » ou « motif », sans le réduire au simple adverbe « pourquoi ».
- source_word: δι’ ἣν πάρεστε
  choice: êtes-vous ici
  rationale: πάρεστε désigne leur présence actuelle. « Êtes-vous ici » restitue ce sens plus directement que « êtes-vous venus », qui mettrait l’accent sur le déplacement.
