  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: fr
  text: Le lendemain, il entra dans Césarée.[a] Corneille les attendait et avait réuni ses parents et ses amis intimes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le verbe au singulier (« il entra »), puis le pronom au pluriel (« les »). Le récit met probablement Pierre au premier plan tout en incluant ses compagnons parmi ceux que Corneille attendait.
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle française naturelle qui conserve clairement la progression du récit; δέ n’exige pas ici de connecteur distinct.
- source_word: εἰσῆλθεν
  choice: il entra
  rationale: Le verbe grec est à l’aoriste actif, troisième personne du singulier. Le singulier est conservé malgré le pronom pluriel qui suit.
- source_word: Καισάρειαν
  choice: Césarée
  rationale: Forme française usuelle du nom de lieu Καισάρεια.
- source_word: ὁ δὲ Κορνήλιος
  choice: Corneille
  rationale: Forme française traditionnelle et courante du nom; la transition légère exprimée par δέ est rendue naturellement par le changement de proposition sans ajouter un contraste artificiel.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: qui les attendait
  rationale: La tournure rend l’attente continue exprimée par la construction périphrastique à l’imparfait et maintient explicitement le pluriel αὐτούς, qui vise Pierre et ses compagnons.
- source_word: συγκαλεσάμενος
  choice: avait réuni
  rationale: Le plus-que-parfait indique naturellement que Corneille les avait rassemblés avant l’arrivée attendue, tout en évitant le ton administratif de « convoquer ».
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: ses proches
  rationale: συγγενεῖς désigne les membres de sa parenté. « Ses proches » est idiomatique et laisse entendre le cercle familial, tout en permettant de distinguer le groupe suivant des amis.
- source_word: τοὺς ἀναγκαίους φίλους
  choice: ses amis intimes
  rationale: Avec φίλους, ἀναγκαίους qualifie des amis très proches ou intimes, non des amis « nécessaires » au sens littéral.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe distingue sans lourdeur l’entrée de Pierre, au singulier, de l’attente de tout le groupe. « Amis intimes » restitue la proximité exprimée par ἀναγκαίους sans suggérer une relation amoureuse.
