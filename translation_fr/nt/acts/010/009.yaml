id: ACT.10.9
reference: Acts 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: fr
  text: Le lendemain, tandis que ces hommes étaient en chemin et approchaient de la ville, Pierre monta sur le toit-terrasse pour prier, vers la sixième heure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers midi, selon le décompte des heures du jour.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle naturelle en français. Le léger lien narratif porté par δέ n’exige pas ici un « or » ou un « et » explicite.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: tandis que ces hommes étaient en chemin
  rationale: Le génitif absolu exprime une action simultanée. « Ces hommes » renvoie naturellement aux envoyés de Corneille, et « étaient en chemin » rend ὁδοιπορέω dans un français courant.
- source_word: τῇ πόλει ἐγγιζόντων
  choice: et approchaient de la ville
  rationale: Le second participe appartient au même génitif absolu; « approchaient » conserve le sens de proximité progressive de ἐγγίζω.
- source_word: ἀνέβη
  choice: monta
  rationale: Aoriste narratif simple indiquant le déplacement de Pierre vers le toit.
- source_word: ἐπὶ τὸ δῶμα
  choice: sur le toit en terrasse
  rationale: δῶμα désigne ici le toit plat et accessible d’une maison. « Toit en terrasse » communique cette réalité architecturale plus clairement que le seul mot « toit ».
- source_word: προσεύξασθαι
  choice: pour prier
  rationale: L’infinitif exprime le but de la montée; la tournure française « pour prier » est directe et naturelle.
- source_word: περὶ ὥραν ἕκτην
  choice: vers la sixième heure
  rationale: « Vers » conserve l’approximation de περί, tandis que « la sixième heure » maintient dans le texte le mode antique de compter les heures.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Toit en terrasse » explicite sans lourdeur la forme accessible du toit antique. L’expression culturelle « sixième heure » est conservée dans le texte et expliquée en note.
