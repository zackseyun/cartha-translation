  to: Le lendemain, tandis que ces hommes étaient en chemin et approchaient de la ville, Pierre monta sur le toit-terrasse pour prier, vers la sixième heure[a].
  rationale: La révision se limite à employer « toit-terrasse », terme français plus idiomatique pour le toit plat accessible visé par δῶμα, et à neutraliser dans la note une attribution culturelle non explicite dans le texte grec. Le sens du verset et son degré d’approximation sont conservés.
