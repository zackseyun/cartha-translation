id: ACT.10.17
reference: Acts 10:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: fr
  text: Pendant que Pierre, intérieurement perplexe, se demandait ce que pouvait signifier la vision qu’il avait vue[a], voici que les hommes envoyés par Corneille, après avoir demandé où se trouvait la maison de Simon, se présentèrent au portail[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que pouvait être la vision qu’il avait vue ». Le grec peut se traduire plus littéralement ainsi, mais il s’agit probablement ici du sens ou de la portée de la vision.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à la porte » ou « à l’entrée ». Le terme grec peut désigner le portail ou l’espace d’entrée d’une maison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Pendant que
  rationale: Introduit naturellement en français la simultanéité et la progression discrète du récit, sans ajouter un adverbe temporel absent du grec.
- source_word: ἐν ἑαυτῷ διηπόρει
  choice: intérieurement perplexe, se demandait
  rationale: Rend à la fois la réflexion intérieure et l’incertitude persistante exprimée par l’imparfait διηπόρει, dans une tournure française fluide.
- source_word: τί ἂν εἴη
  choice: ce que pouvait signifier
  rationale: Dans ce contexte, Pierre cherche vraisemblablement à comprendre la portée de la vision. Une note conserve toutefois le sens plus littéral « ce que pouvait être ».
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: la vision qu’il avait vue
  rationale: Le plus-que-parfait respecte l’antériorité de la vision, et « vue » traduit directement εἶδεν.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la vivacité du marqueur narratif grec dans un français actuel et digne.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: les hommes envoyés par Corneille
  rationale: Rendu concis qui préserve l’identité masculine des envoyés et la valeur passive du participe.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: après s’être renseignés pour trouver la maison de Simon
  rationale: Exprime naturellement l’enquête préalable visant à localiser la maison, avant l’arrivée des hommes à son entrée.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: se présentèrent à l’entrée
  rationale: « Se présentèrent » associe l’arrivée à la prise de position devant le lieu; « entrée » rend πυλών sans imposer une architecture trop précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible tout en conservant le marqueur de mise en relief « voici que » et l’ambiguïté de τί ἂν εἴη au moyen d’une note.
