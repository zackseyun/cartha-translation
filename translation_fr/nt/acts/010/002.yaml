  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: fr
  text: Il était pieux et craignait Dieu[a] avec toute sa maisonnée ; il faisait de nombreuses aumônes au peuple[b] et priait Dieu continuellement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « craignait Dieu » peut aussi évoquer une désignation reconnue pour un non-Juif qui adorait le Dieu d’Israël.
    reason: historical_lexical_nuance
  - marker: b
    text: Le terme grec désigne souvent plus précisément des dons faits aux nécessiteux.
    reason: lexical_clarification
lexical_decisions:
- source_word: εὐσεβὴς
  choice: pieux
  rationale: Le terme décrit une personne dont la révérence se manifeste dans sa vie religieuse. « Pieux » est naturel, digne et distinct de l’expression suivante sur la crainte de Dieu.
- source_word: φοβούμενος τὸν θεὸν
  choice: craignait Dieu
  rationale: Cette formulation conserve l’expression verbale et l’idiome biblique, tout en pouvant évoquer sans l’imposer le statut reconnu d’un non-Juif attaché au Dieu d’Israël.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: avec toute sa maisonnée
  rationale: οἶκος désigne ici l’ensemble des personnes formant le foyer, et non le bâtiment. « Maisonnée » préserve clairement cette dimension sociale.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: faisait beaucoup d’aumônes
  rationale: La construction conserve le participe descriptif et rend le sens usuel d’ἐλεημοσύνη, qui désigne notamment les dons destinés aux nécessiteux.
- source_word: τῷ λαῷ
  choice: au peuple
  rationale: Le datif indique les bénéficiaires. « Au peuple » reste concis et naturel dans le contexte de l’aumône, le peuple désignant vraisemblablement ici le peuple juif.
- source_word: δεόμενος τοῦ θεοῦ
  choice: priait Dieu
  rationale: Dans ce portrait de piété, « priait Dieu » rend clairement δέομαι sans suraccentuer l’idée d’imploration.
- source_word: διὰ παντός
  choice: continuellement
  rationale: L’expression indique une pratique constante ou régulière, sans exiger l’idée d’une action littéralement ininterrompue.
theological_decisions:
- issue: Portée de l’expression décrivant celui qui craint Dieu
  choice: craignait Dieu
  alternative: était un homme craignant Dieu ; révérait Dieu
  rationale: La traduction conserve le sens ordinaire de révérence ainsi que la possibilité d’une désignation historiquement reconnaissable pour un non-Juif adorant le Dieu d’Israël, sans transformer cette possibilité en catégorie technique explicite.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la série descriptive de l’original tout en adoptant une syntaxe française fluide. « Maisonnée » évite de confondre le foyer humain avec la maison comme bâtiment.
