id: ACT.10.37
reference: Acts 10:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: fr
  text: Vous savez vous-mêmes ce qui s’est passé dans toute la Judée[a], en partant de la Galilée après le baptême proclamé par Jean[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message qui s’est répandu dans toute la Judée ». Le mot grec peut désigner une parole, un message, une affaire ou un événement.
    reason: lexical_alternative
  - marker: b
    text: Dans le grec, la construction rendue par « en partant » est syntaxiquement difficile, mais elle situe clairement le point de départ en Galilée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: Vous savez vous-mêmes
  rationale: Le pronom explicite ὑμεῖς renforce le sujet déjà indiqué par le verbe; «vous-mêmes» restitue cette insistance en français naturel.
- source_word: τὸ γενόμενον ῥῆμα
  choice: ce qui s’est passé
  rationale: Dans ce contexte, ῥῆμα peut désigner une parole, un message ou une affaire; associé à γενόμενον et à l’étendue géographique, il renvoie naturellement à l’ensemble connu des faits, sans exclure leur dimension de message.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: dans toute la Judée
  rationale: κατά avec le génitif exprime ici l’extension à travers toute une région; cette formulation est idiomatique et conserve la portée de ὅλης.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: en commençant par la Galilée
  rationale: ἀπό marque le point de départ. Le participe est syntaxiquement lâche dans le grec; la formulation française conserve ce flottement sans préciser artificiellement un sujet.
- source_word: μετὰ τὸ βάπτισμα
  choice: après le baptême
  rationale: μετά avec l’accusatif a ici une valeur temporelle.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: proclamé par Jean
  rationale: κηρύσσω exprime une proclamation publique. La tournure passive est naturelle en français et rattache clairement la relative au baptême.
theological_decisions:
- issue: Sens de ῥῆμα dans le résumé de Pierre
  choice: «ce qui s’est passé», désignant l’ensemble public des faits et du message concernant Jésus
  alternative: «la parole» ou «le message qui s’est répandu»
  rationale: Le contexte décrit une réalité connue dans toute la Judée et dont le commencement est situé en Galilée. La traduction principale privilégie la valeur événementielle, tandis que la note préserve l’autre possibilité lexicale.
- issue: Référent de ἀρξάμενος
  choice: 'Conserver une construction participiale ouverte: «en commençant par la Galilée»'
  alternative: 'Expliciter: «tout a commencé en Galilée» ou rattacher le participe à une personne sous-entendue'
  rationale: Le participe masculin est syntaxiquement difficile à rattacher au neutre ῥῆμα. La traduction évite d’imposer un référent que le grec ne formule pas nettement.
translation_notes:
  register: Français international moderne, courant et digne. «Ce qui s’est passé» évite le caractère peu naturel de «la chose qui est arrivée» et la technicité de «l’affaire», tout en laissant la note signaler la dimension possible de parole ou de message. La phrase conserve la continuité syntaxique du discours, d’où le point final non imposé par l’extrait source.
