id: ACT.10.35
reference: Acts 10:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: fr
  text: mais, en toute nation, celui qui le craint et pratique la justice[a] est agréé par lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait ce qui est juste » ; littéralement « œuvre la justice ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « lui est agréable » ; autre traduction possible : « est accueilli favorablement par lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: mais
  rationale: Marque le contraste avec l’affirmation précédente selon laquelle Dieu ne fait pas de favoritisme.
- source_word: ἐν παντὶ ἔθνει
  choice: dans toute nation
  rationale: Rend directement la portée distributive de παντί et le sens courant de ἔθνος dans ce contexte, sans projeter la notion moderne d’État-nation.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: celui qui le craint
  rationale: Le participe présent substantivé désigne de manière représentative toute personne qui éprouve envers Dieu une crainte révérencielle.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: et pratique la justice
  rationale: « Pratiquer » exprime une conduite active et habituelle; « la justice » conserve le substantif δικαιοσύνη et demeure naturel en français biblique moderne.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: est agréé par lui
  rationale: Rend le prédicat δεκτός comme l’accueil favorable de Dieu, tout en évitant d’ajouter une explication doctrinale absente du verset.
theological_decisions:
- issue: Le rapport entre la crainte de Dieu, la pratique de la justice et l’accueil favorable de Dieu
  choice: Conserver l’affirmation selon laquelle cette personne « est agréée par lui », sans préciser davantage la nature ou le fondement de cet accueil.
  alternative: « lui est agréable » ou une formulation interprétative évoquant soit un mérite qui procure le salut, soit la preuve d’une foi salvatrice.
  rationale: Le grec établit le rapport sans résoudre ici les débats théologiques plus larges. La traduction doit préserver cette tension dans le contexte de l’impartialité de Dieu envers les nations.
translation_notes:
  register: Français international moderne, digne et accessible. « Celui qui » évite une limitation de genre inutile. « Agréé par lui » est légèrement soutenu, mais précis dans ce contexte et préserve l’ambiguïté de δεκτός.
