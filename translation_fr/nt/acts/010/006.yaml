id: ACT.10.6
reference: Acts 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: fr
  text: Il loge chez un certain Simon, tanneur, dont la maison se trouve au bord de la mer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Il
  rationale: Le pronom renvoie à Pierre dans le contexte; « Il » est la reprise la plus naturelle en français.
- source_word: ξενίζεται
  choice: loge
  rationale: Le présent à valeur médio-passive indique ici que Pierre séjourne comme hôte chez quelqu’un. « Loge » exprime naturellement ce séjour sans préciser davantage les modalités de l’accueil.
- source_word: παρά τινι Σίμωνι
  choice: chez un certain Simon
  rationale: παρά avec le datif situe le séjour auprès d’une personne, tandis que τις maintient son caractère indéfini. « Chez un certain Simon » est idiomatique et fidèle.
- source_word: βυρσεῖ
  choice: tanneur de métier
  rationale: βυρσεύς désigne précisément celui qui traite les peaux pour en faire du cuir. L’ajout idiomatique « de métier » lève en français le risque de comprendre « tanneur » comme un adjectif ou un simple surnom.
- source_word: ᾧ ἐστιν οἰκία
  choice: dont la maison se trouve
  rationale: Cette formulation française rend avec naturel la relation possessive exprimée par le relatif et l’existence de la maison au lieu indiqué.
- source_word: παρὰ θάλασσαν
  choice: au bord de la mer
  rationale: παρά avec l’accusatif exprime ici la proximité immédiate; « au bord de la mer » est naturel et précis en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’indétermination de τις et la précision du métier de Simon, sans explicitation contextuelle ajoutée.
