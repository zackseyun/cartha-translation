- from: 'Jésus de Nazareth : comment Dieu lui a donné l’onction avec l’Esprit saint et avec puissance ; il est allé partout en faisant le bien et en guérissant tous ceux que le diable opprimait, car Dieu était avec lui.'
  to: 'Jésus de Nazareth : comment Dieu l’a oint de l’Esprit Saint et de puissance ; il est allé partout en faisant le bien et en guérissant tous ceux que le diable opprimait, car Dieu était avec lui.'
  rationale: La révision remplace uniquement la périphrase maladroite « lui a donné l’onction avec » par « l’a oint de », traduction directe de ἔχρισεν qui préserve l’image et la portée biblique du texte. Elle harmonise également la graphie consacrée « Esprit Saint ». La syntaxe dépendante introduite par « comment » est maintenue, puisqu’elle reflète la continuation de la phrase de Pierre dans le contexte immédiat.
  reviewer_model: gpt-5.6-terra
