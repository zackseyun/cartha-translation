id: ACT.10.38
reference: Acts 10:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: fr
  text: 'Jésus de Nazareth : comment Dieu l’a oint de l’Esprit Saint et de puissance ; il est allé partout en faisant le bien et en guérissant tous ceux que le diable opprimait, car Dieu était avec lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: Jésus de Nazareth
  rationale: Cette formulation française idiomatique indique clairement l’origine de Jésus tout en conservant l’identification traditionnelle.
- source_word: ὡς
  choice: comment
  rationale: Dans cette construction dépendant du contexte précédent, « comment » introduit naturellement le récit explicatif de ce que Dieu a fait pour Jésus.
- source_word: ἔχρισεν αὐτόν
  choice: lui a donné l’onction
  rationale: Cette expression conserve l’image biblique de l’onction et sa portée messianique sans ajouter le titre « Messie », absent du verset.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: avec l’Esprit saint et avec puissance
  rationale: La répétition de « avec » rend clairement la valeur instrumentale des deux datifs et maintient la distinction entre l’Esprit saint et la puissance.
- source_word: διῆλθεν
  choice: il est allé partout
  rationale: Le verbe décrit l’activité itinérante de Jésus ; cette tournure est naturelle en français contemporain.
- source_word: εὐεργετῶν
  choice: en faisant le bien
  rationale: Rendu direct, large et idiomatique de l’action bienfaisante exprimée par le participe.
- source_word: ἰώμενος
  choice: en guérissant
  rationale: « Guérir » exprime directement l’action restauratrice décrite dans le contexte.
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: tous ceux que le diable opprimait
  rationale: La formulation rend la domination accablante exercée par le diable sans en préciser indûment les manifestations.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: car Dieu était avec lui
  rationale: « Car » conserve la valeur causale ou explicative de ὅτι dans un registre digne et naturel.
theological_decisions:
- issue: Rapport entre l’onction de Jésus, son identité et sa mission
  choice: Conserver explicitement le langage de l’onction
  alternative: Paraphraser par « Dieu l’a établi comme Messie » ou seulement par « Dieu lui a donné de la puissance »
  rationale: Le texte affirme l’onction de Jésus par Dieu sans développer ici toute sa signification christologique. La traduction en préserve la résonance sans l’expliquer à la place du texte.
- issue: Référence de πνεύματι ἁγίῳ
  choice: l’Esprit saint
  alternative: un esprit saint ou une puissance spirituelle impersonnelle
  rationale: Dans les Actes, l’expression désigne normalement l’Esprit saint ; de plus, le texte le distingue de la puissance.
- issue: Portée de la proposition causale finale
  choice: car Dieu était avec lui
  alternative: Atténuer le lien causal ou en tirer une conclusion christologique non formulée ici
  rationale: La traduction garde l’explication donnée par le verset concernant le ministère de Jésus, sans résoudre au-delà du texte la tension théologique que cette formulation peut susciter.
translation_notes:
  register: Français international moderne, clair et digne. La structure avec deux points et point-virgule reflète la syntaxe grecque condensée tout en restant lisible. « Donner l’onction » évite l’archaïsme relatif de « oindre » sans effacer l’image biblique.
