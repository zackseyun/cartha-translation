  text: Après leur avoir tout expliqué, il les envoya à Joppé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: après leur avoir… expliqué
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure française naturelle conserve à la fois la valeur temporelle et l’idée d’un exposé détaillé.
- source_word: ἅπαντα αὐτοῖς
  choice: leur avoir tout expliqué
  rationale: Le pronom au datif désigne les destinataires de l’explication, et ἅπαντα souligne son caractère complet. « Leur avoir tout expliqué » rend l’ensemble avec clarté en français moderne.
- source_word: ἀπέστειλεν αὐτούς
  choice: il les envoya
  rationale: Le verbe signifie « envoyer » et αὐτούς en désigne l’objet. Le passé simple convient au registre narratif soutenu et actuel du récit biblique.
- source_word: εἰς τὴν Ἰόππην
  choice: à Joppé
  rationale: La préposition indique la destination. « Joppé » est la forme française traditionnelle du nom grec Ἰόππη et permet de reconnaître aisément le lieu biblique.
