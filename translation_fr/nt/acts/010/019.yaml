id: ACT.10.19
reference: Acts 10:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: fr
  text: 'Pendant que Pierre réfléchissait encore à la vision, l''Esprit lui dit : « Regarde ! Des hommes te cherchent[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont à ta recherche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διενθυμουμένου
  choice: réfléchissait encore
  rationale: Le participe exprime une réflexion intérieure soutenue et en cours. « Réfléchissait » est naturel en français moderne, et « encore » explicite l'aspect continu suggéré par le contexte sans changer le sens.
- source_word: περὶ τοῦ ὁράματος
  choice: à la vision
  rationale: Avec « réfléchir », la construction française idiomatique est « réfléchir à ». Elle conserve explicitement l'objet de la réflexion de Pierre.
- source_word: τὸ πνεῦμα
  choice: l'Esprit
  rationale: Dans le contexte d'Actes 10, il s'agit de l'Esprit divin qui dirige Pierre. La majuscule rend ce référent clair sans ajouter « Saint », absent du grec ici.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Traduction directe, concise et idiomatique de l'expression grecque.
- source_word: Ἰδοὺ
  choice: Regarde !
  rationale: Ce marqueur attire vivement l'attention. « Regarde ! » en restitue la force dans un français actuel, contrairement à l'archaïque « Voici » employé absolument ou à « Vois ».
- source_word: ἄνδρες
  choice: des hommes
  rationale: ἀνήρ désigne ici des personnes adultes de sexe masculin; « des hommes » préserve cette précision plutôt que de la neutraliser.
- source_word: ζητοῦντές σε
  choice: te cherchent
  rationale: ζητέω signifie ici chercher quelqu'un, vouloir le trouver. « Te cherchent » est la formulation française directe et naturelle; « sont à ta recherche » reste une possibilité plus soutenue.
theological_decisions:
- issue: Référent de τὸ πνεῦμα
  choice: « l'Esprit » désigne l'Esprit Saint parlant à Pierre
  alternative: un esprit ou une impulsion spirituelle non précisée
  rationale: Dans le récit d'Actes 10, le locuteur est l'Esprit divin qui dirige la mission vers les non-Juifs. « L'Esprit » maintient cette affirmation narrative sans ajouter l'adjectif « Saint », absent du texte grec.
- issue: Rendu genré de ἄνδρες
  choice: des hommes
  alternative: des gens / des visiteurs
  rationale: Le grec emploie ἀνήρ, qui désigne spécifiquement des hommes, et non un terme générique inclusif. La traduction conserve cette donnée.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement narratif du grec. « Regarde ! » rend l'interpellation de ἰδού sans archaïsme; le point d'exclamation correspond à sa fonction d'appel à l'attention.
