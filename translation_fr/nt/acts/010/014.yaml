  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: fr
  text: 'Mais Pierre dit : « Certainement pas, Seigneur ! Car je n’ai jamais rien mangé de profane et d’impur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: Certainement pas
  rationale: Exprime avec naturel et force le refus catégorique de Pierre.
- source_word: κύριε
  choice: Seigneur
  rationale: Conserve l’adresse directe et son ambiguïté contextuelle entre titre de respect et désignation du Seigneur.
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison donnée par Pierre sans alourdir la phrase.
- source_word: κοινὸν
  choice: profane
  rationale: Dans ce contexte rituel, désigne ce qui est tenu pour non consacré et donc impropre à la consommation, plutôt que simplement « commun » au sens moderne.
- source_word: καὶ ἀκάθαρτον
  choice: et d’impur
  rationale: Reproduit la coordination καί du texte SBLGNT et maintient ensemble les deux qualifications sans les transformer en alternative.
theological_decisions:
- issue: Relation entre « profane » et « impur »
  choice: Conserver la coordination « profane et impur »
  alternative: « profane ou impur »
  rationale: Le texte grec fourni porte καί (« et »). La traduction préserve cette formulation et la tension éventuelle entre les catégories sans les redistribuer.
- issue: Identité de la personne appelée κύριε
  choice: « Seigneur » sans explicitation
  alternative: Préciser « Seigneur Jésus » ou rendre par « monsieur »
  rationale: Le contexte permet de comprendre une adresse au Seigneur, mais le verset ne précise pas davantage l’identité; la traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tour « Certainement pas » rend un refus énergique sans registre archaïque; « profane » et « impur » maintiennent le vocabulaire rituel.
