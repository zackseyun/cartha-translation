id: ACT.10.43
reference: Acts 10:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: fr
  text: 'Tous les prophètes témoignent à son sujet : toute personne qui croit en lui reçoit, par son nom, le pardon des péchés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: à son sujet
  rationale: Le datif associé à μαρτυροῦσιν désigne ici la personne au sujet de laquelle le témoignage est rendu. « À son sujet » est naturel en français et renvoie clairement à Jésus.
- source_word: πάντες οἱ προφῆται
  choice: Tous les prophètes
  rationale: Rend directement la portée universelle de l'expression, qui évoque les prophètes et leur témoignage scripturaire sans transformer le terme en titre formel.
- source_word: μαρτυροῦσιν
  choice: témoignent
  rationale: « Témoigner » conserve la force probante du verbe grec tout en restant courant et digne en français moderne.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: le pardon des péchés
  rationale: Expression française établie qui communique fidèlement le sens de remise ou de pardon des fautes.
- source_word: λαβεῖν
  choice: reçoit
  rationale: L'infinitif exprime le contenu du témoignage prophétique. Une proposition française avec le présent général est naturelle et préserve cette affirmation.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: par son nom
  rationale: Conserve l'image biblique du nom comme moyen ou médiation, sans expliciter davantage par « autorité », ce qui serait interprétatif.
- source_word: πάντα τὸν πιστεύοντα
  choice: toute personne qui croit
  rationale: Le participe masculin singulier a une portée générique et distributive. Cette formulation inclut naturellement toute personne sans donner au grec un sens exclusivement masculin.
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: Avec πιστεύω, εἰς exprime la foi ou la confiance dirigée vers une personne. « Croire en lui » est l'équivalent idiomatique en français.
theological_decisions:
- issue: Portée et condition du pardon
  choice: Le pardon des péchés est reçu par le nom de Jésus par toute personne qui croit en lui.
  alternative: Développer la phrase en précisant doctrinalement le mécanisme du salut.
  rationale: La traduction maintient le lien explicitement établi entre Jésus, son nom, la foi et le pardon, sans ajouter une formulation confessionnelle étrangère au verset.
- issue: Masculin générique du participe
  choice: toute personne qui croit
  alternative: tout homme qui croit
  rationale: Le masculin singulier grec est générique et distributif, non limité aux hommes. « Toute personne » en restitue exactement la portée universelle en français actuel.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit l'ordre logique du grec tout en plaçant « par son nom » entre virgules pour rendre sans lourdeur son rattachement à la réception du pardon. Aucun marqueur de note n'est requis, puisque la variante anglaise « bear witness concerning him » correspond en français au même sens déjà exprimé par « témoignent à son sujet ».
