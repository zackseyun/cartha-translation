id: ACT.10.36
reference: Acts 10:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: fr
  text: le message qu’il a envoyé aux fils d’Israël[a], en annonçant la bonne nouvelle de la paix par Jésus le Messie[b] — c’est lui qui est le Seigneur de tous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils d’Israël »; l’expression désigne le peuple d’Israël.'
    reason: La formulation littérale est conservée dans le texte, et la note explicite sa valeur collective conventionnelle.
  - marker: b
    text: 'Grec : « Jésus Christ »; ici, Christos est compris comme le titre « Messie ».'
    reason: La note rend visible le rapport entre la forme grecque traditionnelle et la traduction du titre.
  - marker: c
    text: 'On peut aussi comprendre : « le Seigneur de tout »; le grec peut englober toutes les personnes ou toutes choses.'
    reason: La note préserve l’étendue sémantique de πάντων sans imposer une seule délimitation.
lexical_decisions:
- source_word: τὸν λόγον
  choice: le message
  rationale: Dans ce contexte, λόγος désigne le contenu communiqué par Dieu. « Message » est naturel en français moderne; la traduction plus littérale « parole » est signalée en note.
- source_word: ὃν ἀπέστειλεν
  choice: qu’il a envoyé
  rationale: Cette proposition relative conserve le lien grammatical avec « le message ». Le sujet implicite, repris du contexte, est Dieu.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: aux fils d’Israël
  rationale: Cette formulation reproduit l’expression grecque et son caractère biblique conventionnel sans la réduire explicitement à une catégorie moderne.
- source_word: εὐαγγελιζόμενος εἰρήνην
  choice: en annonçant la bonne nouvelle de la paix
  rationale: « Annonçant la bonne nouvelle » conserve la valeur propre du verbe εὐαγγελίζομαι, tandis que « de la paix » exprime naturellement son contenu en français.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: διά avec le génitif indique ici l’intermédiaire ou l’agent par lequel la paix est annoncée. Χριστός a une valeur titulaire, rendue par « le Messie ».
- source_word: οὗτός ἐστιν πάντων κύριος
  choice: c’est lui qui est le Seigneur de tous
  rationale: La tournure clivée française restitue naturellement l’insistance du démonstratif οὗτός. « Seigneur de tous » conserve la portée universelle et l’ambiguïté de πάντων quant aux personnes ou à l’ensemble de la création.
theological_decisions:
- issue: Valeur de Χριστός dans Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le contexte met en avant le titre messianique de Jésus; le traduire rend cette valeur transparente sans ajouter de précision confessionnelle.
- issue: Traduction de κύριος
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve à la fois l’autorité universelle affirmée ici et le poids christologique du terme, sans le limiter à une relation sociale de maîtrise.
- issue: Force emphatique de οὗτός
  choice: c’est lui qui est le Seigneur de tous
  alternative: il est le Seigneur de tous
  rationale: La construction « c’est lui qui » maintient l’insistance du démonstratif grec tout en restant idiomatique en français.
- issue: Portée de πάντων
  choice: de tous
  alternative: de tout
  rationale: « De tous » est la formulation française la plus naturelle dans cette affirmation et peut viser tous les êtres; la note préserve la possibilité plus englobante « de tout » sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et lisible. La structure demeure celle d’un fragment dépendant du contexte précédent. « C’est lui qui » restitue l’emphase grecque sans la raideur de « celui-ci », et « annoncer la bonne nouvelle de la paix » conserve la nuance évangélique du participe.
