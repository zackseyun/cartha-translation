  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: fr
  text: Ils appelèrent à haute voix et demandèrent si Simon, appelé Pierre, logeait ici.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était hébergé ici ». Le verbe grec évoque le fait de séjourner chez quelqu’un en tant qu’hôte.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: Ils appelèrent
  rationale: Le participe aoriste indique l’action qui précède la demande. En français narratif, deux verbes coordonnés rendent naturellement la séquence sans imposer l’idée plus forte de crier.
- source_word: ἐπυνθάνοντο
  choice: demandèrent
  rationale: Le verbe désigne ici une demande de renseignement. Le passé simple convient au récit; la nuance durative de l’imparfait grec reste légère dans ce contexte.
- source_word: εἰ
  choice: si
  rationale: Dans une interrogation indirecte en français, « si » est la tournure idiomatique normale.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: Simon, appelé Pierre
  rationale: Cette formulation conserve les deux noms et rend sobrement le participe présent passif grec, qui indique le nom sous lequel Simon est connu.
- source_word: ἐνθάδε
  choice: là
  rationale: Dans la bouche de visiteurs qui s’adressent aux occupants de la maison, « là » est naturel en français; « ici » reste possible selon le point de vue adopté par le narrateur.
- source_word: ξενίζεται
  choice: logeait
  rationale: Le verbe grec signifie être accueilli ou hébergé comme hôte. « Logeait » exprime clairement un séjour temporaire, tout en laissant la nuance d’hospitalité à la note.
