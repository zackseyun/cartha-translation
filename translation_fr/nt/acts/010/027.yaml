  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: fr
  text: Tout en parlant avec lui, il entra et trouva beaucoup de personnes réunies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici « trouve », un présent historique, là où la traduction met « trouva », pour donner plus de vivacité au récit.
    reason: Le français courant préfère maintenir le récit au passé; la note conserve l’information stylistique portée par le présent historique grec.
lexical_decisions:
- source_word: συνομιλῶν
  choice: tout en parlant
  rationale: Le participe présent exprime une action en cours, simultanée à l’entrée. « Tout en parlant » rend naturellement cette relation temporelle sans alourdir la phrase.
- source_word: αὐτῷ
  choice: avec lui
  rationale: Avec συνομιλέω, le datif désigne l’interlocuteur. « Avec lui » préserve le caractère réciproque de la conversation.
- source_word: εἰσῆλθεν
  choice: il entra
  rationale: L’aoriste fait progresser le récit par une action ponctuelle. Le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: εὑρίσκει
  choice: trouva
  rationale: Le présent historique grec donne de la vivacité au récit. Le passé simple est plus naturel dans la continuité narrative française; le changement de temps est signalé en note.
- source_word: συνεληλυθότας
  choice: réunies
  rationale: Le participe parfait décrit des personnes qui se sont déjà rassemblées et se trouvent encore ensemble. « Réunies » exprime clairement cet état résultant.
- source_word: πολλούς
  choice: beaucoup de personnes
  rationale: L’adjectif est substantivé et désigne un grand nombre de personnes. L’ajout explicite de « personnes » est naturel en français et évite une formulation elliptique.
