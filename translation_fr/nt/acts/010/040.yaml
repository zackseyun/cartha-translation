  text: τοῦτον ὁ θεὸς ἤγειρεν ⸀τῇ τρίτῃ ἡμέρᾳ καὶ ἔδωκεν αὐτὸν ἐμφανῆ γενέσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: fr
  text: C’est lui[a] que Dieu a ressuscité le troisième jour et à qui il a donné de se manifester[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet homme » ou « celui-là » ; le démonstratif grec, placé en tête, met cette personne en relief.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « l’a fait apparaître » ou « lui a donné de devenir visible ». Le grec dit littéralement : « lui a donné de devenir visible ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: Celui-là
  rationale: Le démonstratif antéposé est emphatique et désigne précisément Jésus, mentionné juste auparavant. « Celui-là » conserve cette mise en relief, là où le simple pronom « le » l’atténuerait.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Sujet explicite de la résurrection ; l’article grec ne se rend pas devant le nom propre « Dieu » en français.
- source_word: ἤγειρεν
  choice: l’a ressuscité
  rationale: Dans ce contexte, ἐγείρω désigne le relèvement d’entre les morts. « Ressusciter » est naturel et précis en français.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: le troisième jour
  rationale: Le datif temporel indique le moment. Cette formulation française naturelle n’ajoute aucune précision sur le mode de calcul des jours.
- source_word: ἔδωκεν
  choice: lui a donné
  rationale: Le choix conserve le sens premier de δίδωμι et la construction grecque avec l’infinitif, sans transformer explicitement le verbe en causatif ni en simple permission.
- source_word: αὐτὸν
  choice: lui
  rationale: Le pronom renvoie à Jésus. Dans la construction française « donner à quelqu’un de », le complément grec est naturellement rendu par « lui ».
- source_word: ἐμφανῆ
  choice: se manifester
  rationale: ἐμφανής exprime ce qui devient visible ou manifeste. Avec γενέσθαι, « se manifester » rend naturellement en français l’accès à la visibilité sans réduire l’idée à une simple existence.
- source_word: γενέσθαι
  choice: de se manifester
  rationale: La tournure garde une valeur dynamique correspondant à « devenir, venir à être », plutôt que de la remplacer par le seul état « être visible ».
theological_decisions:
- issue: Formulation de la résurrection
  choice: Celui-là, Dieu l’a ressuscité le troisième jour
  alternative: Dieu l’a ressuscité le troisième jour
  rationale: Le texte attribue explicitement la résurrection à l’action de Dieu et met Jésus en relief au moyen du démonstratif antéposé. La formulation retenue conserve ces deux traits.
- issue: Manifestation après la résurrection
  choice: lui a donné de se manifester
  alternative: l’a fait apparaître
  rationale: La formulation maintient la distinction textuelle entre la résurrection et le fait de devenir ensuite manifeste, tout en évitant de préciser au-delà du grec si δίδωμι exprime ici surtout l’octroi ou la causation.
translation_notes:
  register: Français international moderne, digne et accessible. « Celui-là » est volontairement plus marqué que le simple pronom afin de conserver l’emphase du démonstratif grec. « Lui a donné de se manifester » garde la construction inhabituelle mais significative du texte source, tout en restant intelligible en français.
