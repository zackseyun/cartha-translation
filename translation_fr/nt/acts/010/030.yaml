source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: fr
  text: 'Corneille dit : « Il y a quatre jours, à cette heure-ci, je priais chez moi, à la neuvième heure[a]. Et voici qu’un homme se tint devant moi, vêtu d’un vêtement éclatant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers trois heures de l’après-midi.
    reason: Note culturelle expliquant le système antique de décompte des heures.
lexical_decisions:
- source_word: ἔφη
  choice: répondit
  rationale: Dans ce contexte de dialogue, l’aoriste introduit la réponse de Corneille. « Répondit » est plus naturel en français que le littéral « dit », sans ajouter de contenu.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: Il y a quatre jours, à cette heure-ci
  rationale: L’expression situe l’événement quatre jours auparavant, à l’heure correspondante. Cette formulation française rend l’idiome sans suggérer à tort une prière ininterrompue pendant quatre jours.
- source_word: ἤμην ... προσευχόμενος
  choice: je priais
  rationale: La construction périphrastique à l’imparfait décrit une action en cours dans le passé ; l’imparfait français en restitue naturellement l’aspect.
- source_word: τὴν ἐνάτην
  choice: à la neuvième heure
  rationale: La désignation ancienne de l’heure est conservée dans le texte, tandis que son équivalent moderne est indiqué en note.
- source_word: ἐν τῷ οἴκῳ μου
  choice: chez moi
  rationale: « Chez moi » exprime naturellement en français le fait de se trouver dans sa propre maison.
- source_word: ἰδοὺ
  choice: Et voici que
  rationale: Cette tournure conserve la vivacité et l’effet de soudaineté du marqueur grec.
- source_word: ἀνὴρ
  choice: un homme
  rationale: Le terme désigne ici une figure d’apparence humaine masculine.
- source_word: ἔστη ἐνώπιόν μου
  choice: s’est tenu devant moi
  rationale: La formulation conserve l’idée que l’homme a pris position devant Corneille, sans réduire le verbe à une simple apparition.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: vêtu d’un habit resplendissant
  rationale: Cette expression française restitue à la fois le vêtement et son éclat visible dans un registre digne et courant.
theological_decisions:
- issue: Rendu de l’indication horaire τὴν ἐνάτην
  choice: à la neuvième heure
  alternative: vers trois heures de l’après-midi
  rationale: Le texte principal conserve le mode antique de compter les heures, tandis que la note fournit l’équivalent moderne afin d’éviter toute opacité.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde la vivacité narrative de ἰδοὺ, et la formulation temporelle évite une ambiguïté artificielle sur la durée de la prière.
