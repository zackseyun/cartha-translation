  to: 'Corneille dit : « Il y a quatre jours, à cette heure-ci, je priais chez moi, à la neuvième heure[a]. Et voici qu’un homme se tint devant moi, vêtu d’un vêtement éclatant. »'
  rationale: Révision limitée afin de ne pas ajouter l’idée que Corneille répondait, de rendre plus directement l’aoriste ἔστη, et d’employer une expression vestimentaire plus naturelle en français moderne. La formulation temporelle et l’ambiguïté relative au décompte inclusif des jours sont préservées.
