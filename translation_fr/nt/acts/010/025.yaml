id: ACT.10.25
reference: Acts 10:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: fr
  text: Lorsque Pierre entra, Corneille vint à sa rencontre, tomba à ses pieds et lui rendit hommage[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’adora ». Le verbe grec peut désigner soit l’adoration, soit un geste de prosternation ou d’hommage, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: Lorsque Pierre entra
  rationale: La tournure grecque introduit naturellement la circonstance temporelle. « Lorsque Pierre entra » en restitue le sens narratif sans reproduire lourdement l’idiome grec.
- source_word: συναντήσας αὐτῷ
  choice: vint à sa rencontre
  rationale: Cette formulation française exprime clairement l’action volontaire de Corneille allant accueillir Pierre et rend naturellement le participe grec.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: tomba à ses pieds
  rationale: L’expression conserve à la fois le geste physique et la posture d’abaissement décrits par le grec.
- source_word: προσεκύνησεν
  choice: lui rendit hommage
  rationale: Le verbe peut désigner la prosternation révérencieuse ou l’adoration selon le contexte. « Lui rendit hommage » préserve ici la gravité du geste sans décider à tort qu’il s’agit nécessairement d’un culte rendu comme à Dieu.
theological_decisions:
- issue: Sens de προσκυνέω lorsque le geste est dirigé vers Pierre
  choice: lui rendit hommage
  alternative: l’adora
  rationale: Le champ sémantique permet aussi bien un hommage exprimé par la prosternation que l’adoration. Puisque Pierre refuse aussitôt ce geste en rappelant qu’il est lui-même un homme, le texte principal évite de trancher au-delà de ce qu’impose le contexte, tandis que la note conserve l’autre traduction possible.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste fluide pour une lecture publique, tout en conservant la succession des gestes et l’ambiguïté réelle du verbe final.
