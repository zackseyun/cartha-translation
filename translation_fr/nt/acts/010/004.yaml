  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: fr
  text: 'Il fixa les yeux sur lui et, pris de peur, demanda : « Qu’y a-t-il, Seigneur ? » Il lui répondit : « Tes prières et tes dons aux pauvres[a] sont montés comme un mémorial devant Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aumônes ». Le terme grec désigne particulièrement les dons charitables faits aux personnes dans le besoin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: fixa les yeux sur lui
  rationale: Cette expression rend le regard soutenu et attentif indiqué par le participe, dans un français naturel et vivant.
- source_word: ἔμφοβος γενόμενος
  choice: pris de peur
  rationale: La tournure française exprime naturellement l’entrée dans un état de crainte, sans renforcer indûment l’émotion jusqu’à la terreur.
- source_word: Τί ἐστιν
  choice: Qu’y a-t-il ?
  rationale: Dans ce contexte, Corneille demande directement ce qui motive l’apparition ou ce qui lui est demandé.
- source_word: κύριε
  choice: Seigneur
  rationale: Ce terme conserve la forme respectueuse et solennelle de l’adresse grecque, sans faire nécessairement de cette parole une confession christologique.
- source_word: προσευχαί
  choice: prières
  rationale: Équivalent français courant et direct du terme grec.
- source_word: ἐλεημοσύναι
  choice: dons aux pauvres
  rationale: Le mot désigne particulièrement les dons charitables faits aux nécessiteux. Cette formulation est immédiatement compréhensible en français moderne.
- source_word: ἀνέβησαν
  choice: sont montés
  rationale: Le passé composé convient au résultat présent et conserve l’image ascendante pouvant évoquer la prière ou le sacrifice.
- source_word: εἰς μνημόσυνον
  choice: comme un mémorial
  rationale: Cette traduction conserve l’image cultuelle et l’idée de mémoire devant Dieu sans préciser davantage ce que le grec laisse condensé.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: devant Dieu
  rationale: Formulation concise et fidèle, qui peut exprimer aussi bien la présence que le regard de Dieu.
theological_decisions:
- issue: Portée de κύριε dans l’adresse de Corneille à la figure céleste
  choice: Seigneur, comme adresse révérencieuse
  alternative: Monsieur ; maître
  rationale: « Seigneur » préserve le terme grec et la solennité de la scène. Dans ce contexte, il n’impose pas à lui seul l’idée que Corneille identifie son interlocuteur à Jésus.
- issue: Sens de εἰς μνημόσυνον devant Dieu
  choice: comme un mémorial devant Dieu
  alternative: afin que Dieu se souvienne de toi ; comme une offrande de souvenir
  rationale: La formulation retenue maintient l’ambiguïté et la résonance cultuelle du grec, sans expliciter le bénéficiaire du souvenir ni transformer les prières et les dons en offrande rituelle au sens strict.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste direct et naturel. L’expression « comme un mémorial » est volontairement plus formelle afin de préserver l’image condensée et la possible résonance sacrificielle du grec.
