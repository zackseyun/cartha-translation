id: ACT.10.16
reference: Acts 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: fr
  text: Cela se produisit trois fois, et aussitôt l’objet[a] fut emporté au ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la toile » ou « le récipient ». Le mot grec désigne largement un objet, un ustensile ou un récipient ; le contexte décrit quelque chose qui ressemble à une grande toile.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le ciel visible ». Le même mot grec peut désigner le ciel visible ou le domaine céleste.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: Cela
  rationale: Le démonstratif neutre renvoie à l’ensemble de la scène qui vient d’être racontée. « Cela » en restitue naturellement la valeur anaphorique.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ assure une liaison narrative légère plutôt qu’une opposition marquée. « Et » convient au déroulement du récit.
- source_word: ἐγένετο
  choice: se produisit
  rationale: Emploi événementiel courant de γίνομαι. « Se produisit » est clair, digne et adapté à la narration.
- source_word: ἐπὶ τρίς
  choice: trois fois
  rationale: L’expression indique que la scène se répète à trois reprises. « Trois fois » est la formulation française courante.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Le terme exprime l’immédiateté et la transition soudaine. « Aussitôt » convient au registre narratif.
- source_word: ἀνελήμφθη
  choice: fut emporté
  rationale: L’aoriste passif de ἀναλαμβάνω décrit l’objet pris et déplacé vers le haut. « Fut emporté » conserve la voix passive et le mouvement sans préciser l’agent.
- source_word: τὸ σκεῦος
  choice: l’objet
  rationale: σκεῦος est un terme large pouvant désigner un objet, un ustensile ou un récipient. « L’objet » évite de le réduire à un récipient rigide, tandis que le contexte permet de comprendre qu’il ressemble à une grande toile.
- source_word: εἰς τὸν οὐρανόν
  choice: au ciel
  rationale: La préposition εἰς marque la destination du mouvement. Dans le cadre de cette vision, « au ciel » rend naturellement la destination céleste tout en laissant une note signaler le sens possible de « ciel visible ».
theological_decisions:
- issue: Sens de οὐρανός dans la vision de Pierre
  choice: ciel, compris comme le domaine céleste
  alternative: ciel visible
  rationale: οὐρανός peut désigner aussi bien le ciel visible que le domaine céleste. Le mouvement de descente puis de remontée dans une vision d’origine divine favorise le second sens, sans exclure entièrement le premier.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. Les notes conservent l’étendue sémantique de σκεῦος et l’ambiguïté possible de οὐρανός.
