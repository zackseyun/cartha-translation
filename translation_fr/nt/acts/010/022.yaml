  to: 'Ils répondirent : « Corneille, un centurion, est un homme juste qui craint Dieu et dont tout le peuple juif dit du bien[a]. Il a reçu d’un saint ange l’instruction[b] de te faire venir chez lui et d’entendre tes paroles[c]. »'
