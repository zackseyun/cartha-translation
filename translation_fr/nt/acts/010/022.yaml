  - severity: low
    issue: « ce que tu lui diras » interprète plus librement ῥήματα παρὰ σοῦ.
    rationale: Le grec dit littéralement qu’il doit « entendre des paroles de ta part ». « Entendre tes paroles » conserve le pluriel et l’attribution à Pierre sans changer la formulation en proposition future.
