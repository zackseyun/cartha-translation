id: ACT.10.22
reference: Acts 10:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: fr
  text: 'Ils répondirent : « Corneille, un centurion, est un homme juste qui craint Dieu et dont tout le peuple juif dit du bien[a]. Il a reçu d’un saint ange l’instruction[b] de te faire venir chez lui et d’entendre tes paroles[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui reçoit un témoignage favorable de toute la nation des Juifs ». Ici, « nation » désigne le peuple juif, et non nécessairement un État au sens moderne.'
    reason: Précision lexicale et culturelle sur μαρτυρούμενος et ἔθνος.
  - marker: b
    text: 'Ou : « a reçu un message divin » ou « a été averti ». Le verbe grec indique qu’une communication d’origine divine lui a été adressée.'
    reason: Le verbe ἐχρηματίσθη peut exprimer une instruction, un message ou un avertissement divin.
  - marker: c
    text: 'Littéralement : « d’entendre des paroles venant de toi ».'
    reason: La traduction principale conserve le pluriel et l’idée de paroles provenant de Pierre.
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: centurion
  rationale: Terme historique précis et bien établi en français pour désigner cet officier romain.
- source_word: ἀνὴρ δίκαιος
  choice: un homme juste
  rationale: « Juste » conserve la portée morale et religieuse de δίκαιος sans lui imposer une catégorie doctrinale ultérieure.
- source_word: φοβούμενος τὸν θεόν
  choice: qui craint Dieu
  rationale: Cette formulation préserve l’expression biblique et la force verbale du grec, qui décrit Corneille comme quelqu’un qui révère le Dieu d’Israël.
- source_word: μαρτυρούμενος
  choice: dont … dit du bien
  rationale: Le participe passif exprime le témoignage favorable dont Corneille fait l’objet; cette tournure est naturelle en français courant.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: par tout le peuple juif
  rationale: Ici, ἔθνος désigne le peuple juif comme groupe humain, non un État-nation au sens politique moderne.
- source_word: ἐχρηματίσθη
  choice: a reçu l’instruction divine
  rationale: Dans ce contexte, le verbe désigne une communication d’origine divine, sans nécessairement impliquer un avertissement.
- source_word: ἀγγέλου ἁγίου
  choice: un ange saint
  rationale: La traduction représente explicitement l’adjectif ἁγιος et conserve l’ordre naturel du français.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: de te faire venir chez lui
  rationale: Cette expression rend naturellement l’idée de faire appeler quelqu’un pour qu’il se rende à la maison de celui qui l’appelle.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: d’écouter ce que tu lui diras
  rationale: Formulation française naturelle qui conserve l’idée de paroles venant de Pierre sans préciser à tort qu’il s’agit nécessairement d’un discours formel.
theological_decisions:
- issue: Décrire la piété de Corneille sans déterminer son statut théologique
  choice: un homme juste qui craint Dieu
  alternative: un homme pieux et juste
  rationale: Le grec loue la conduite et la révérence de Corneille envers Dieu, mais le verset ne définit pas encore son statut dans l’alliance ni son salut. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La citation est divisée en deux phrases pour éviter une accumulation lourde, tout en conservant les relations syntaxiques et le contenu du grec.
