  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: fr
  text: 'En effet, ils les entendaient parler en langues[a] et proclamer la grandeur de Dieu. Alors Pierre prit la parole :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des langues ». Le mot grec peut désigner des langues; la formulation ne précise pas ici la nature exacte de cette parole.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: ils les entendaient
  rationale: L’imparfait grec présente l’écoute comme une action en cours; l’imparfait français la restitue naturellement. Le premier « ils » renvoie aux croyants circoncis et « les » aux personnes qui venaient de recevoir le don de l’Esprit.
- source_word: γὰρ
  choice: En effet
  rationale: La conjonction introduit l’explication de ce qui précède. « En effet » exprime clairement ce rapport en français moderne.
- source_word: λαλούντων γλώσσαις
  choice: parler en langues
  rationale: Cette expression française établie demeure proche de la tournure grecque. γλῶσσα pouvant désigner la langue comme organe ou comme langage, la formulation ne tranche pas la nature exacte du phénomène.
- source_word: μεγαλυνόντων τὸν θεόν
  choice: proclamer la grandeur de Dieu
  rationale: μεγαλύνω signifie reconnaître, célébrer ou exalter la grandeur de quelqu’un. Cette formulation est naturelle en français et conserve explicitement l’idée de grandeur portée par le verbe grec.
- source_word: τότε
  choice: Alors
  rationale: Le mot marque la suite immédiate du récit.
- source_word: ἀπεκρίθη Πέτρος
  choice: Pierre prit la parole
  rationale: Bien que le verbe signifie littéralement « répondit », il peut introduire une intervention. En l’absence de question explicite, « prit la parole » rend idiomatiquement la fonction narrative sans ajouter le contenu d’une réponse.
theological_decisions:
- issue: Sens de γλώσσαις dans le contexte des manifestations de l’Esprit
  choice: en langues
  alternative: dans des langues
  rationale: Le terme grec peut désigner des langues humaines, mais l’expression peut aussi évoquer une parole inspirée sans que ce verset en précise la nature. Le texte principal conserve l’expression biblique large, et la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Proclamer la grandeur de Dieu » évite le calque peu naturel « magnifier Dieu », tandis que « prit la parole » restitue idiomatiquement ἀπεκρίθη dans un contexte sans question explicite.
