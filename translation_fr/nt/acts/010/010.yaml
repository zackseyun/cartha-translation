  text: ἐγένετο δὲ πρόσπεινος καὶ ἤθελεν γεύσασθαι· παρασκευαζόντων δὲ ⸀αὐτῶν ⸀ἐγένετο ἐπ’ αὐτὸν ἔκστασις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: fr
  text: Il eut très faim et voulait manger[a]. Pendant qu’on lui préparait le repas, il tomba en extase[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « goûter »; ici, le verbe grec signifie prendre de la nourriture.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il entra en transe ». Le terme grec désigne ici un état inhabituel associé à une vision révélatrice, et non un simple sentiment de joie intense.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ πρόσπεινος
  choice: Il eut très faim
  rationale: Cette formulation naturelle rend le changement d’état exprimé par ἐγένετο et la forte intensité de πρόσπεινος, sans employer un terme excessif comme « affamé ».
- source_word: ἤθελεν
  choice: voulut
  rationale: Dans ce récit au passé, « voulut » exprime naturellement le désir de Pierre dans la séquence narrative.
- source_word: γεύσασθαι
  choice: manger
  rationale: Bien que le verbe signifie littéralement « goûter », il désigne ici idiomatiquement le fait de prendre de la nourriture.
- source_word: παρασκευαζόντων δὲ αὐτῶν
  choice: Pendant qu’on lui préparait le repas
  rationale: Le génitif absolu exprime une action simultanée. Le sujet indéfini « on » correspond au pluriel grec sans identifier les personnes, et « le repas » explicite sobrement l’objet sous-entendu par le contexte.
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: il tomba en extase
  rationale: Cette expression française établie rend l’apparition soudaine de l’état désigné par ἔκστασις et convient au contexte de révélation visionnaire.
theological_decisions:
- issue: Nature de l’état visionnaire de Pierre désigné par ἔκστασις
  choice: extase
  alternative: transe
  rationale: Dans ce contexte, ἔκστασις désigne un état inhabituel associé à une vision révélatrice, et non un simple étonnement. « Extase » reste proche du terme grec et s’inscrit dans un registre biblique digne; la note précise le sens afin d’éviter l’acception moderne de joie intense.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie des tournures courantes tout en conservant la force de la faim et le caractère particulier de l’expérience visionnaire. Tous les marqueurs de note figurent dans le texte.
