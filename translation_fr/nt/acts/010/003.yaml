id: ACT.10.3
reference: Acts 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: fr
  text: 'Il vit clairement[b], dans une vision, vers la neuvième heure du jour[a], un ange de Dieu venir auprès de lui et lui dire : « Corneille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers trois heures de l’après-midi selon notre manière actuelle de compter les heures.
    reason: cultural_note
  - marker: b
    text: Ou « distinctement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: Il vit
  rationale: L’aoriste indicatif de ὁράω exprime ici un événement narratif ponctuel. « Il vit » rend directement l’expérience visuelle sans en atténuer la réalité.
- source_word: ἐν ὁράματι
  choice: dans une vision
  rationale: Ὅραμα désigne une vision, ici d’origine surnaturelle. Cette formulation française est naturelle et ne précise pas indûment l’état psychologique de Corneille.
- source_word: φανερῶς
  choice: clairement
  rationale: L’adverbe souligne le caractère net et manifeste de ce que Corneille voit. « Clairement » conserve cette insistance tout en restant idiomatique.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: vers la neuvième heure du jour
  rationale: « Vers » rend naturellement l’approximation exprimée par ὡσεὶ et περὶ. Le calcul antique des heures est conservé dans le texte, avec son équivalent moderne en note.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: un ange de Dieu
  rationale: Dans ce cadre visionnaire, ἄγγελος désigne clairement un être céleste envoyé par Dieu, et non un messager humain.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: entrer chez lui
  rationale: Le participe indique que l’ange entre là où se trouve Corneille. « Entrer chez lui » restitue ce mouvement d’une manière concise et naturelle en français.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: et lui dire
  rationale: L’infinitif français coordonné à « entrer » rend naturellement les deux participes grecs dépendant du verbe de perception.
- source_word: Κορνήλιε
  choice: Corneille
  rationale: Forme française usuelle du nom propre Κορνήλιος ; le point d’exclamation fait entendre l’interpellation portée par le vocatif.
theological_decisions:
- issue: Nature de ἄγγελος dans ce contexte
  choice: un être angélique céleste
  alternative: un messager humain
  rationale: Le cadre explicite d’une vision et l’expression « de Dieu » indiquent ici un ange au sens céleste. La traduction n’ajoute aucune précision doctrinale au-delà de ce que le contexte établit.
translation_notes:
  register: Français international moderne, clair et digne. La structure avec « voir quelqu’un entrer et dire » demeure naturelle en français tout en reflétant étroitement la construction grecque. Les marqueurs de notes sont placés sur les expressions auxquelles les notes se rapportent.
