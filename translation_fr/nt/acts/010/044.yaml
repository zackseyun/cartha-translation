  verdict: revise
  source_fidelity: Le génitif absolu et la simultanéité sont bien rendus. Toutefois, « vint sur » atténue inutilement ἐπέπεσε (« tomba sur »), alors que cette image est tout à fait recevable en français. « La parole » rend directement τὸν λόγον dans son contexte de proclamation.
  naturalness: « Pierre parlait encore… quand… » est une formulation moderne, fluide et idiomatique. « L’Esprit Saint tomba sur » est naturel dans le registre biblique français sans être archaïque.
  terminology: « L’Esprit Saint » avec majuscule à « Saint » est la graphie française établie pour ce titre. « La parole » maintient la formulation biblique et le sens de message proclamé, sans imposer une interprétation doctrinale.
  issues:
