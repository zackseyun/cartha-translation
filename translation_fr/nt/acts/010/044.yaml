    rationale: Le grec emploie le verbe imagé ἐπιπίπτω, « tomber sur ». La note reconnaît cette valeur, mais une note ne compense pas nécessairement une atténuation évitable dans le texte courant.
  - severity: low
    issue: Capitalisation de « Esprit saint »
    rationale: Pour le titre divin, l’usage français biblique courant est « l’Esprit Saint ».
  - severity: low
    issue: « le message » pour τὸν λόγον
    rationale: « Le message » est défendable contextuellement, mais « la parole » offre une correspondance plus directe et idiomatique dans ce cadre de proclamation.
