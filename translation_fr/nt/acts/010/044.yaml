id: ACT.10.44
reference: Acts 10:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: fr
  text: Pierre parlait encore de ces paroles quand l’Esprit Saint tomba sur tous ceux qui écoutaient la parole.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: Pierre prononçait encore
  rationale: Le génitif absolu au participe présent exprime une action en cours, simultanée à l’arrivée de l’Esprit. Cette tournure est naturelle en français et conserve la valeur de « encore ».
- source_word: τὰ ῥήματα ταῦτα
  choice: ces paroles
  rationale: ῥήματα désigne ici les paroles que Pierre est en train de prononcer ; « ces paroles » est précis et idiomatique.
- source_word: ἐπέπεσε
  choice: vint sur
  rationale: Dans ce contexte, le verbe décrit l’Esprit qui saisit ou investit les auditeurs. « Vint sur » restitue clairement ce mouvement en français actuel, tandis qu’une note conserve l’image grecque plus vive.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit saint
  rationale: Expression française courante, claire et théologiquement neutre pour désigner le Saint-Esprit.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: sur tous ceux qui écoutaient
  rationale: Cette formulation rend la totalité exprimée par πάντας et l’action en cours du participe présent ἀκούοντας.
- source_word: τὸν λόγον
  choice: le message
  rationale: Dans le contexte de la proclamation de Pierre, λόγος désigne le contenu annoncé. « Le message » évite de le faire prendre pour un mot isolé tout en conservant son sens discursif.
theological_decisions:
- issue: Description de l’action de l’Esprit par ἐπέπεσε
  choice: l’Esprit saint vint sur tous ceux
  alternative: l’Esprit saint tomba sur tous ceux
  rationale: « Vint sur » est naturel en français et ne précise ni le mécanisme ni la nature doctrinale de l’événement. La note signale l’image littérale et vigoureuse du grec sans l’effacer.
- issue: Sens de λόγος dans la proclamation
  choice: le message
  alternative: la parole
  rationale: Le contexte montre qu’il s’agit du message proclamé par Pierre. Ce choix clarifie le référent sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, fluide et digne. La construction temporelle évite un calque lourd du génitif absolu ; le vocabulaire reste accessible sans atténuer l’action soudaine de l’Esprit.
