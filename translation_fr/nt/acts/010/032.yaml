id: ACT.10.32
reference: Acts 10:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: fr
  text: Envoie donc à Joppé chercher Simon[a], appelé Pierre. Il loge chez Simon, un tanneur, près de la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais appeler Simon auprès de toi » ; le verbe grec signifie faire appeler quelqu’un pour qu’il vienne à soi.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Il est accueilli dans la maison de Simon, tanneur, près de la mer. »'
    reason: translation_clarity
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: Envoie donc des hommes à Joppé
  rationale: L’impératif πέμψον commande un envoi, et οὖν marque la conséquence. Le complément humain est implicite en grec mais nécessaire en français courant devant « à Joppé » pour éviter de faire de Joppé le destinataire.
- source_word: μετακάλεσαι
  choice: fais venir
  rationale: Le moyen grec signifie faire appeler quelqu’un auprès de soi. « Fais venir » restitue naturellement le mouvement demandé sans la nuance autoritaire que peut avoir « convoque ».
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: Simon, appelé Pierre
  rationale: La tournure indique le nom sous lequel Simon est aussi connu. La formulation française reste proche et concise sans ajouter explicitement « aussi », absent du grec.
- source_word: ξενίζεται
  choice: loge
  rationale: Le verbe indique que Pierre est accueilli comme hôte. « Loge chez » exprime naturellement cette situation en français moderne.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: chez un tanneur nommé Simon, dont la maison
  rationale: Cette formulation identifie clairement le métier et le nom de l’hôte tout en permettant de rattacher sans ambiguïté la localisation finale à sa maison.
- source_word: παρὰ θάλασσαν
  choice: au bord de la mer
  rationale: παρά avec l’accusatif exprime ici la proximité spatiale; « au bord de la mer » est idiomatique et précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Joppé » suit la forme française biblique usuelle. La première phrase explicite les messagers sous-entendus par le contexte; la seconde évite l’ambiguïté possible de deux appositions successives autour du nom Simon.
