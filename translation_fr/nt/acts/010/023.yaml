id: ACT.10.23
reference: Acts 10:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: fr
  text: Il les invita donc à entrer et les hébergea[a]. Le lendemain, il se leva et partit avec eux. Quelques-uns des frères de Joppé l’accompagnèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les accueillit comme hôtes »; le verbe grec désigne ici l’hospitalité qui consiste à loger des visiteurs.
    reason: lexical_alternative
  - marker: b
    text: Le grec porte « frères », masculin pluriel. Dans l’usage des premières communautés chrétiennes, ce terme peut parfois désigner plus largement les croyants, hommes et femmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: fit entrer
  rationale: Le participe moyen décrit l’action de faire entrer les envoyés dans le lieu où Pierre logeait. « Il les fit entrer » est naturel et n’ajoute pas l’idée d’une invitation antérieure.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence narrative de l’échange précédent sans lui donner une force logique excessive.
- source_word: ἐξένισεν
  choice: les hébergea
  rationale: Dans ce contexte, ξενίζω désigne concrètement l’hospitalité consistant à loger des visiteurs. « Hébergea » l’exprime avec concision en français moderne.
- source_word: Τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle française naturelle qui rend exactement la progression du récit.
- source_word: ἀναστὰς
  choice: il se leva
  rationale: Conserve le sens propre du participe sans le confondre avec le départ exprimé par ἐξῆλθεν.
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Dans le contexte d’un déplacement qui commence, « partit » est plus idiomatique que le littéral « sortit », tout en gardant l’idée du départ.
- source_word: σὺν αὐτοῖς
  choice: avec eux
  rationale: Rend simplement et directement l’accompagnement.
- source_word: τινες
  choice: quelques-uns
  rationale: Rend l’indéfini pluriel tout en s’accordant clairement avec « frères ».
- source_word: ἀδελφῶν
  choice: frères
  rationale: Conserve le masculin pluriel du grec et le vocabulaire familial des premières communautés chrétiennes, sans exclure en principe l’emploi collectif plus large du terme.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: de Joppé
  rationale: Identifie naturellement leur provenance en français; « Joppé » est la forme française traditionnelle et courante du toponyme biblique.
- source_word: συνῆλθον αὐτῷ
  choice: l’accompagnèrent
  rationale: Dans ce récit de voyage, le verbe composé avec le datif indique qu’ils partirent en compagnie de Pierre. « L’accompagnèrent » évite la répétition de « avec ».
theological_decisions:
- issue: Portée de ἀδελφῶν dans un contexte communautaire potentiellement inclusif
  choice: frères
  alternative: frères et sœurs; croyants
  rationale: Le texte principal conserve la forme masculine du grec et la métaphore familiale. Comme ἀδελφοί peut parfois désigner plus largement les membres d’une communauté, cette possibilité est signalée en note sans trancher l’identité précise du groupe.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et fluide, avec « hébergea » pour préciser la nature de l’hospitalité et « l’accompagnèrent » pour éviter une répétition lourde.
