id: ACT.10.48
reference: Acts 10:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: fr
  text: Il ordonna donc qu’ils soient baptisés au nom de Jésus le Messie[a]. Ils lui demandèrent alors de rester quelques jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: Signale l’autre manière courante de rendre le titre grec Χριστός.
lexical_decisions:
- source_word: προσέταξεν
  choice: Il ordonna
  rationale: Le verbe exprime une instruction donnée avec autorité. « Ordonna » en conserve la force tout en restant naturel dans un récit.
- source_word: δὲ
  choice: donc
  rationale: Ici, δέ assure la progression du récit et relie cette décision aux événements précédents sans marquer une opposition forte.
- source_word: αὐτοὺς … βαπτισθῆναι
  choice: qu’ils soient baptisés
  rationale: Cette tournure conserve le passif de l’infinitif grec et évite de préciser qui devait administrer le baptême.
- source_word: ἐν τῷ ὀνόματι
  choice: au nom de
  rationale: La formule française traditionnelle et naturelle préserve l’éventail de sens de l’expression grecque, notamment l’autorité, l’appartenance et l’invocation, sans le réduire à une seule interprétation.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre. « Le Messie » en rend le sens en français courant, tandis que la forme traditionnelle est signalée en note.
- source_word: τότε
  choice: alors
  rationale: « Alors » marque naturellement l’étape suivante du récit.
- source_word: ἠρώτησαν
  choice: demandèrent
  rationale: Le verbe signifie ici demander ou faire une requête, sans nécessairement exprimer une forte insistance.
- source_word: ἐπιμεῖναι
  choice: de rester
  rationale: Dans ce contexte, le verbe désigne le fait de prolonger son séjour. « Rester » est clair et idiomatique.
- source_word: ἡμέρας τινάς
  choice: quelques jours
  rationale: Cette expression rend la durée indéfinie de la formule grecque sans en fixer précisément le nombre.
theological_decisions:
- issue: Traduction de Χριστοῦ dans la formule baptismale
  choice: le Messie
  alternative: Christ
  rationale: Dans « Jésus le Messie », Χριστός est compris comme un titre confessionnel plutôt que comme un simple élément de nom. La traduction principale en exprime donc le sens, tandis que la formulation traditionnelle est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le passif grec dans la première phrase, tandis que « quelques jours » offre une expression française naturelle de la durée indéfinie.
