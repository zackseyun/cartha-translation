id: ACT.10.20
reference: Acts 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: fr
  text: Mais lève-toi, descends et pars avec eux sans hésiter[a], car c’est moi qui les ai envoyés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans faire de distinction ». Le participe grec peut signifier ne pas douter ou hésiter, mais aussi ne pas établir de distinction; ce second sens peut faire écho au thème des rapports entre Juifs et non-Juifs dans ce chapitre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec la perplexité de Pierre et introduit l’ordre d’agir.
- source_word: ἀναστὰς
  choice: lève-toi
  rationale: Le participe aoriste accompagne ici les impératifs et appelle à une action immédiate; cette formulation est naturelle en français moderne.
- source_word: κατάβηθι
  choice: descends
  rationale: Rend directement le mouvement vers le bas depuis l’endroit où se trouve Pierre.
- source_word: πορεύου σὺν αὐτοῖς
  choice: pars avec eux
  rationale: Exprime naturellement le déplacement demandé et l’accompagnement des messagers.
- source_word: μηδὲν διακρινόμενος
  choice: sans hésiter
  rationale: Dans le contexte immédiat, Pierre ne doit pas tergiverser devant l’ordre de l’Esprit. Le verbe peut aussi évoquer le fait de distinguer ou d’établir une différence; cette possibilité est conservée en note.
- source_word: ὅτι
  choice: car
  rationale: Introduit avec concision la raison pour laquelle Pierre doit accompagner les hommes.
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: c’est moi qui les ai envoyés
  rationale: La tournure clivée restitue l’accent porté par le pronom explicite ἐγώ, tandis que le passé composé rend l’envoi accompli dont les effets demeurent présents.
theological_decisions:
- issue: Sens de μηδὲν διακρινόμενος dans le contexte de l’accueil des non-Juifs
  choice: sans hésiter
  alternative: sans faire de distinction
  rationale: Le contexte immédiat met en avant la perplexité de Pierre et l’ordre de suivre les messagers sans tergiverser. Toutefois, le thème plus large du chapitre permet d’entendre aussi un appel à ne pas établir de distinction entre Juifs et non-Juifs. La note préserve cette tension sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, simple et digne. Les impératifs brefs conservent le rythme direct de l’original; « c’est moi qui » rend l’emphase du pronom grec.
