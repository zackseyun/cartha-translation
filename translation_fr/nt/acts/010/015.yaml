id: ACT.10.15
reference: Acts 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: fr
  text: 'Et une voix s’adressa de nouveau à lui, pour la deuxième fois : « Ce que Dieu a rendu pur, toi, ne le déclare pas profane[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne le considère pas comme impur » ou « ne le traite pas comme souillé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: une voix
  rationale: Le nom sans article se rend naturellement par l’indéfini en français; l’accent porte sur la parole céleste répétée.
- source_word: πάλιν ἐκ δευτέρου
  choice: de nouveau… pour la deuxième fois
  rationale: Cette formulation conserve les deux éléments, quelque peu redondants et emphatiques, tout en restant naturelle en français.
- source_word: πρὸς αὐτόν
  choice: s’adressa… à lui
  rationale: Tournure française idiomatique pour une voix dont la parole est dirigée vers Pierre.
- source_word: Ἃ
  choice: Ce que
  rationale: Le relatif neutre pluriel a ici une valeur collective et générale; « ce que » l’exprime naturellement.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: En français, le nom propre divin s’emploie normalement sans article dans ce contexte.
- source_word: ἐκαθάρισεν
  choice: a rendu pur
  rationale: Le passé composé exprime naturellement l’acte décisif de Dieu, tandis que « rendu pur » conserve la portée liée aux catégories de pureté.
- source_word: σὺ
  choice: toi
  rationale: Le pronom tonique explicite préserve l’insistance du grec sur Pierre, en contraste avec l’action de Dieu.
- source_word: μὴ κοίνου
  choice: ne le déclare pas profane
  rationale: κοινόω signifie ici considérer ou déclarer comme commun, souillé ou profane. « Profane » maintient mieux que « impur » la distinction lexicale avec ἀκάθαρτος, et « déclarer » convient à l’évaluation interdite à Pierre.
theological_decisions:
- issue: Rendu du langage de pureté dans la vision de Pierre
  choice: « ne le déclare pas profane » dans le texte principal
  alternative: « ne le considère pas comme impur » ou « ne le traite pas comme souillé »
  rationale: Le grec oppose κοινόω à καθαρίζω. « Profane » préserve la catégorie du commun/non consacré sans l’identifier entièrement à « impur », tandis que la note signale les équivalents contextuels possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « de nouveau… pour la deuxième fois » conserve l’emphase du grec. Le pronom tonique « toi » rend l’opposition explicite entre l’acte souverain de Dieu et le jugement interdit à Pierre.
