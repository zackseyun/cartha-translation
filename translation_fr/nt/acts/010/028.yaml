id: ACT.10.28
reference: Acts 10:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: fr
  text: 'Et il leur dit : « Vous savez vous-mêmes qu’il est interdit à un Juif de fréquenter un étranger[a] ou d’aller le voir. Mais Dieu m’a montré que je ne devais déclarer aucune personne profane ou impure[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne d’un autre peuple », voire « un non-Juif » ; le grec désigne littéralement quelqu’un qui appartient à un autre peuple.
    reason: lexical_alternative
  - marker: b
    text: « Profane » traduit κοινός, terme distinct d’« impur » (ἀκάθαρτος). Cette paire appartient au vocabulaire juif de la pureté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: Et il leur dit
  rationale: τέ assure une liaison narrative légère; « Et » maintient le fil du récit sans préciser davantage la succession.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: Vous savez vous-mêmes
  rationale: Le pronom explicite ὑμεῖς est emphatique; « vous-mêmes » conserve cette insistance en français naturel.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: qu’il est interdit
  rationale: ἀθέμιτος désigne ce qui n’est pas permis ou va contre les règles admises. « Interdit » en restitue la force sans imposer l’idée précise d’une infraction à une loi écrite.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: à un Juif
  rationale: Le masculin singulier et sa valeur représentative sont conservés de façon idiomatique par « un Juif ».
- source_word: κολλᾶσθαι
  choice: de fréquenter
  rationale: Le verbe évoque littéralement le fait de s’attacher ou de se joindre à quelqu’un; dans ce contexte social, « fréquenter » en exprime naturellement le sens.
- source_word: ἢ προσέρχεσθαι
  choice: ou de se rendre chez lui
  rationale: Dans la situation présente, προσέρχεσθαι vise le fait d’aller auprès d’un non-Juif, notamment dans sa maison. Cette formulation reste naturelle sans réduire le verbe à une simple proximité physique.
- source_word: ἀλλοφύλῳ
  choice: un étranger
  rationale: ἀλλόφυλος désigne littéralement une personne appartenant à un autre peuple. « Étranger » préserve cette valeur lexicale; « non-Juif » ou « païen » serait plus interprétatif.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: Mais Dieu m’a montré
  rationale: Bien que κἀμοί signifie littéralement « et à moi », « mais » rend clairement le contraste contextuel entre la pratique connue et la révélation reçue par Pierre. Le passé composé exprime naturellement en français un événement passé pertinent dans la situation présente.
- source_word: μηδένα ... ἄνθρωπον
  choice: aucune personne
  rationale: ἄνθρωπος désigne ici tout être humain, sans restriction masculine; « aucune personne » conserve cette portée universelle.
- source_word: λέγειν
  choice: déclarer
  rationale: « Déclarer » restitue ici l’acte de qualifier ou de tenir quelqu’un pour tel, mieux qu’un simple « dire » potentiellement ambigu en français.
- source_word: κοινὸν
  choice: profane
  rationale: Dans le vocabulaire juif de pureté, κοινός peut désigner ce qui est commun, non consacré ou profané. « Profane » est intelligible en français et maintient la distinction avec ἀκάθαρτος.
- source_word: ἢ ἀκάθαρτον
  choice: ou impure
  rationale: ἀκάθαρτος est le terme usuel de l’impureté. « Impure » conserve la catégorie rituelle et la distingue de « profane ».
theological_decisions:
- issue: Rapport entre les règles juives de séparation et la révélation divine
  choice: Présenter la première affirmation comme une interdiction reconnue par les interlocuteurs, puis conserver la correction divine selon laquelle aucune personne ne doit être déclarée profane ou impure.
  alternative: Affaiblir ἀθέμιτον en « inconvenant », ou effacer dans la conclusion les deux catégories du langage de pureté.
  rationale: Le texte oppose une règle de séparation tenue pour connue à ce que Dieu a révélé à Pierre. La traduction ne réduit pas la première à une simple convention sociale et n’attribue pas non plus explicitement l’interdiction à la Torah, ce que le verset ne dit pas. Elle garde en outre l’application humaine explicite de la vision.
- issue: Portée de μηδένα ... ἄνθρωπον
  choice: « aucune personne »
  alternative: « aucun homme » au sens masculin, ou une formulation limitée aux seuls non-Juifs.
  rationale: La construction grecque est universelle et porte sur l’être humain en général. La traduction préserve cette portée sans élargir ni restreindre artificiellement l’énoncé.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’insistance de ὑμεῖς, le contraste introduit contextuellement par κἀμοί et la distinction entre κοινός et ἀκάθαρτος. « Se rendre chez lui » explicite sobrement la situation d’une visite sans ajouter la notion d’un repas ou d’une communion de table.
