  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: fr
  text: 'Alors une voix s’adressa à lui : « Lève-toi, Pierre, tue[a] et mange. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifie et mange ». Le verbe grec peut aussi signifier « sacrifier », mais, dans le contexte de cette vision, il désigne probablement ici la mise à mort d’un animal pour le manger.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο φωνὴ πρὸς αὐτόν
  choice: Alors une voix s’adressa à lui
  rationale: Cette tournure française naturelle restitue l’apparition événementielle de la voix et le fait qu’elle s’adresse directement à Pierre. « Alors » marque sobrement la progression du récit portée par καί.
- source_word: Ἀναστάς
  choice: Lève-toi
  rationale: Le participe aoriste a ici une valeur impérative et introduit les ordres qui suivent. « Lève-toi » est direct et naturel en français moderne.
- source_word: Πέτρε
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom propre au vocatif.
- source_word: θῦσον
  choice: tue
  rationale: Dans cette vision, le verbe désigne vraisemblablement le fait de mettre à mort un animal en vue de le manger. « Tue » conserve la force directe de l’impératif sans imposer une lecture cultuelle, tandis que le sens possible « sacrifie » est signalé en note.
- source_word: φάγε
  choice: mange
  rationale: Impératif direct et idiomatique correspondant exactement à l’action commandée.
theological_decisions:
- issue: Faut-il rendre θῦσον par un terme sacrificiel ?
  choice: « tue » dans le texte principal
  alternative: « sacrifie »
  rationale: Le contexte immédiat concerne des animaux présentés comme nourriture, et non l’accomplissement explicite d’un sacrifice cultuel. Toutefois, θύω peut effectivement signifier « sacrifier » ; cette nuance réelle est donc préservée dans une note plutôt qu’écartée.
translation_notes:
  register: Français international moderne, direct et digne. La phrase conserve la brièveté et l’enchaînement impératif du grec, sans ajouter de précision doctrinale.
