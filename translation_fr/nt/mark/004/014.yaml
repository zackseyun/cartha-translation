  edition: SBLGNT
  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: fr
  text: Le semeur sème la parole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message ». Le mot grec λόγος peut signifier « parole » ou « message » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Le semeur
  rationale: Le participe présent substantivé désigne celui qui se caractérise par l’action de semer. « Le semeur » est naturel, concis et conserve l’image de la parabole sans élargir le sens à la profession d’agriculteur.
- source_word: τὸν λόγον
  choice: la parole
  rationale: λόγος peut désigner une parole ou un message. « La parole » reste proche de la formulation grecque et du vocabulaire du contexte, sans préciser de manière interprétative qu’il s’agit de la parole de Dieu ou de l’Évangile.
- source_word: σπείρει
  choice: sème
  rationale: Le présent de l’indicatif exprime ici l’action générale expliquée par la parabole. La répétition « semeur / sème » restitue le lien lexical et rhétorique avec σπείρων / σπείρει.
theological_decisions:
- issue: Référent de « la parole » dans l’explication de la parabole
  choice: la parole
  alternative: le message ; la parole de Dieu ; l’Évangile
  rationale: Le grec porte seulement τὸν λόγον. Même si le contexte renvoie à un message divin proclamé, la traduction ne l’explicite pas davantage que le texte source et préserve ainsi son degré d’indétermination.
translation_notes:
  register: Français moderne, simple et digne. La formulation brève conserve le parallélisme et la répétition intentionnelle de l’image du semis.
source_grounding:
  english_pob_role: consult_only
