  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: fr
  text: 'Il disait : « À quoi comparerons-nous le royaume de Dieu, ou par quelle parabole le présenterons-nous[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans quelle parabole le présenterons-nous ? » Le grec peut évoquer soit le moyen employé pour présenter le royaume, soit la forme parabolique dans laquelle il est présenté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec marque un procès en cours ou répété; l’imparfait français le rend naturellement dans le récit.
- source_word: Πῶς ὁμοιώσωμεν
  choice: À quoi comparerons-nous
  rationale: Dans ce contexte, la comparaison appelle naturellement en français un objet de comparaison. Le futur délibératif exprime bien la question que le locuteur se pose avec ses auditeurs.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française établie qui conserve l’imagerie royale et la gamme de sens de βασιλεία.
- source_word: ἐν τίνι ... παραβολῇ
  choice: par quelle parabole
  rationale: ἐν avec le datif peut avoir ici une valeur instrumentale; « par quelle parabole » est naturel et exprime le moyen de présentation.
- source_word: παραβολῇ
  choice: parabole
  rationale: Terme consacré et précis dans le contexte des Évangiles synoptiques.
- source_word: αὐτὴν ... θῶμεν
  choice: le présenterons-nous
  rationale: Le pronom français reprend « le royaume » au masculin. Dans cet idiome, τίθημι signifie mettre en forme ou présenter au moyen d’une parabole plutôt que simplement placer.
theological_decisions:
- issue: Sens de βασιλεία τοῦ θεοῦ
  choice: royaume de Dieu
  alternative: règne de Dieu
  rationale: « Royaume » préserve l’expression traditionnelle et son imagerie sans réduire le terme au seul exercice dynamique de la souveraineté.
translation_notes:
  register: Français international moderne, clair et digne. La tournure interrogative reste rhétorique et délibérative; « par quelle parabole » évite une formulation artificielle tout en conservant l’ambiguïté de la construction grecque dans la note.
