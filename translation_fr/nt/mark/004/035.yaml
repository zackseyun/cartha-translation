source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: fr
  text: 'Et ce jour-là, le soir venu, il leur dit : « Passons sur l’autre rive[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Allons de l’autre côté. »'
    reason: Variante lexicale qui conserve le sens spatial de l’expression grecque sans expliciter la rive.
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: La forme française « dit » peut naturellement fonctionner comme présent de narration, ce qui préserve le présent historique caractéristique de Marc sans produire une tournure artificielle.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ce jour-là
  rationale: Équivalent temporel idiomatique et précis en français moderne.
- source_word: ὀψίας γενομένης
  choice: le soir venu
  rationale: Cette proposition participiale rend avec concision et naturel la valeur temporelle du génitif absolu grec.
- source_word: Διέλθωμεν
  choice: Passons
  rationale: Le subjonctif aoriste à valeur exhortative est rendu par un impératif inclusif français, naturel dans ce contexte de traversée.
- source_word: εἰς τὸ πέραν
  choice: sur l’autre rive
  rationale: Dans le contexte immédiat du lac, « l’autre rive » exprime clairement la destination opposée visée par le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’enchaînement narratif introduit par « Et », ainsi que le présent historique de Marc, perceptible en français dans « il leur dit ».
