source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: fr
  text: Car celui qui a, il lui sera donné davantage[a] ; et celui qui n’a pas, même ce qu’il a lui sera enlevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il lui sera donné » ; « davantage » explicite l’idée d’accroissement impliquée par le contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: celui qui
  rationale: Le relatif indéfini a une portée générale. « Celui qui » exprime naturellement en français la valeur proverbiale tout en conservant le singulier du grec.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication ou le fondement de la parole précédente ; « Car » en préserve clairement la fonction.
- source_word: ἔχει
  choice: a
  rationale: Le verbe exprime simplement la possession, dont l’objet demeure déterminé par le contexte.
- source_word: δοθήσεται αὐτῷ
  choice: recevra encore
  rationale: Le grec dit littéralement « il lui sera donné » sans objet exprimé. « Recevra encore » rend naturellement en français l’accroissement impliqué par le contraste, sans préciser la nature de ce qui est donné.
- source_word: καὶ
  choice: mais
  rationale: Bien que καί signifie ordinairement « et », il relie ici les deux membres opposés d’une sentence antithétique ; « mais » rend cette opposition de façon naturelle en français.
- source_word: οὐκ ἔχει
  choice: n’a pas
  rationale: Formulation française directe qui conserve la négation de la possession et l’objet implicite.
- source_word: ὃ ἔχει
  choice: ce qu’il a
  rationale: Le relatif neutre désigne sans la préciser la chose possédée ; « ce qu’il a » conserve cette indétermination.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: lui sera enlevé
  rationale: Le futur passif avec ἀπό exprime la privation. Cette formulation est concise, naturelle et respecte le passif grec.
theological_decisions:
- issue: Objet non exprimé de δοθήσεται
  choice: « recevra encore »
  alternative: « il lui sera donné »
  rationale: Le texte grec ne nomme pas l’objet donné. La traduction retenue explicite seulement l’idée d’accroissement suggérée par l’antithèse, tout en signalant cet ajout par une note afin de préserver l’ambiguïté formelle du grec.
- issue: Référence masculine générique au singulier
  choice: « celui qui… il »
  alternative: « ceux qui… ils » ou une reformulation épicène au pluriel
  rationale: Le grec emploie le masculin singulier avec une portée représentative et générale. Le français « celui qui » conserve ce nombre et cette forme sans limiter la maxime aux hommes.
translation_notes:
  register: Français moderne, digne et proverbial. La structure antithétique reste concise ; le point-virgule marque les deux membres parallèles. « Recevra encore » évite une tournure passive peu naturelle tout en conservant l’objet indéterminé.
