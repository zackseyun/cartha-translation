    rationale: « Encore » peut signifier « de nouveau » ; le grec n’exprime pas une répétition temporelle, mais laisse implicite ce qui sera donné, avec une idée d’augmentation inférée du parallèle.
  - severity: low
    issue: « mais » remplace le καί coordonnant.
    rationale: L’opposition proverbiale est réelle, mais le texte grec emploie « et ». « Et » conserve plus exactement la liaison tout en restant idiomatique.
