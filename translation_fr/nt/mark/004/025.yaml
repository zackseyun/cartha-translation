review_pass:
  verdict: revise
  source_fidelity: La structure générale et les deux relatifs sont bien rendus. Toutefois, « recevra encore » introduit facilement en français l’idée temporelle de recevoir de nouveau, plutôt que l’augmentation implicite. De plus, καί est coordonnant (« et ») ; l’antithèse est déjà portée par les membres de la maxime et ne requiert pas « mais ».
  naturalness: « Car celui qui a, il lui sera donné davantage ; et celui qui n’a pas, même ce qu’il a lui sera enlevé » est naturel dans un registre proverbial moderne. Le passif avec datif éthique (« il lui sera donné ») conserve aussi l’indétermination de l’objet grec.
  terminology: « Davantage » exprime clairement l’accroissement sous-entendu sans déterminer ce qui est donné. « Ce qu’il a » et « lui sera enlevé » préservent l’indétermination et la voix passive du grec.
