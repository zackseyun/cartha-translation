source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: fr
  text: 'Et il leur dit : « Vous ne comprenez pas cette parabole ? Alors comment comprendrez-vous toutes les paraboles ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent historique caractéristique de Marc est rendu par le présent français, qui conserve la vivacité du récit.
- source_word: οἴδατε
  choice: vous ne comprenez pas
  rationale: Bien que le verbe puisse signifier « savoir » ou « connaître », son objet, « cette parabole », indique ici qu’il s’agit d’en saisir le sens.
- source_word: παραβολὴν ταύτην
  choice: cette parabole
  rationale: Traduction directe et naturelle du nom et du démonstratif, qui renvoient au récit précédent.
- source_word: καὶ πῶς
  choice: Alors comment
  rationale: 'Dans cette question, καί relie les deux propositions avec une valeur logique : si les disciples ne comprennent pas celle-ci, comment comprendront-ils les autres ? « Alors » exprime naturellement cette conséquence en français.'
- source_word: πάσας τὰς παραβολὰς
  choice: toutes les paraboles
  rationale: Cette formulation conserve la portée générale du pluriel précédé de πᾶς et désigne largement l’enseignement en paraboles.
- source_word: γνώσεσθε
  choice: comprendrez-vous
  rationale: Dans ce contexte, le futur de γινώσκω porte sur la compréhension du sens des paraboles. Employer « comprendre » dans les deux questions restitue clairement le parallélisme rhétorique.
theological_decisions:
- issue: Rapport entre οἴδατε et γνώσεσθε
  choice: Les deux verbes sont rendus par « comprendre » selon leur sens contextuel.
  alternative: Rendre le premier par « connaître » et le second par « comprendre », ou rendre les deux par « connaître ».
  rationale: La question porte sur la capacité des disciples à saisir le sens des paraboles, non sur une simple connaissance factuelle. La traduction commune par « comprendre » respecte leur chevauchement sémantique ici sans effacer la différence lexicale du grec, laquelle n’exige pas nécessairement deux verbes distincts en français.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation interrogative maintient la force du reproche, tandis que « Alors comment » rend explicitement le lien logique sans surinterpréter le propos.
