  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: fr
  text: Quand le soleil se leva, elle fut brûlée et, comme elle n’avait pas de racine, elle se dessécha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dépérit »; le verbe grec peut exprimer le fait de devenir sec ou de se flétrir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Quand le soleil se leva
  rationale: Rend directement la proposition temporelle introduite par ὅτε; le premier καί assure la continuité narrative et n’a pas besoin d’être exprimé séparément en français.
- source_word: ἐκαυματίσθη
  choice: elle fut brûlée
  rationale: Le passif de καυματίζω décrit les dégâts causés par la chaleur du soleil. « Fut brûlée » reste naturel et n’ajoute ni feu explicite ni destruction totale.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: comme elle n’avait pas de racine
  rationale: διά suivi de l’infinitif articulé exprime ici la cause. Le singulier « racine » respecte le grec et convient à l’image végétale.
- source_word: ἐξηράνθη
  choice: elle se dessécha
  rationale: Le verbe ξηραίνω peut décrire le fait de devenir sec ou de dépérir. « Se dessécha » convient au contexte agricole tout en conservant l’idée d’assèchement.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le pronom féminin « elle » reprend l’élément semé évoqué dans le contexte immédiat. La coordination et la relation causale du grec sont conservées sans alourdir la phrase.
