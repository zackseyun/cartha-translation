review_pass:
  verdict: revise
  source_fidelity: La première proposition rend bien κρυπτόν et φανερωθῇ, mais « qui ne doive être révélé » transforme la construction d’exception avec ἵνα en une nécessité plus affirmée. Dans la seconde, « a été tenu secret » introduit une action et un agent absents de ἐγένετο ἀπόκρυφον (« est devenu caché / est devenu secret »).
  naturalness: La révision proposée est idiomatique en français international moderne et conserve le parallélisme concis de l’original. « Venir au grand jour » est une expression naturelle pour ἔλθῃ εἰς φανερόν.
  terminology: « Caché » rend directement κρυπτόν. La répétition de « caché » dans la seconde moitié est préférable à « tenu secret », car elle ne suggère pas qu’une personne a activement gardé l’objet secret. « Révélé » et « venir au grand jour » préservent le contraste de manifestation.
