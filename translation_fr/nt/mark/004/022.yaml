    issue: « qui ne doive être révélé » surinterprète la construction ἐὰν μὴ ἵνα.
    rationale: Cette relative négative exprime en français une obligation ou une destination plus catégorique. « Que pour être révélé » conserve plus directement l’exception assortie de la nuance de finalité/résultat de ἵνα.
  - severity: medium
    issue: « rien n’a été tenu secret » ne rend pas directement ἐγένετο ἀπόκρυφον.
    rationale: L’aoriste de γίνομαι décrit l’entrée dans un état, tandis que « a été tenu secret » est un passif qui présuppose un agent gardant quelque chose secret. « Rien n’est devenu caché » maintient l’absence d’agent et la valeur de changement d’état.
  revised_text: Car rien n’est caché que pour être révélé[a], et rien n’est devenu caché, sinon pour venir au grand jour[b].
