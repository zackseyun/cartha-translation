id: MRK.4.22
reference: Mark 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: fr
  text: Car rien n’est caché que pour être révélé[a], et rien n’est devenu caché, sinon pour venir au grand jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car rien n’est caché, sinon pour être révélé… sinon pour venir au grand jour. » Les propositions grecques introduites par ἵνα peuvent exprimer ici la finalité ou le résultat.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « venir dans ce qui est visible », c’est-à-dire « venir à découvert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: caché
  rationale: « Caché » exprime directement ce qui est soustrait à la vue ou à la connaissance, sans impliquer nécessairement une volonté de garder un secret.
- source_word: ἐὰν μὴ ἵνα
  choice: qui ne doive
  rationale: Cette tournure française naturelle rend l’exception assortie de la nuance de finalité portée par ἵνα, sans présenter cette nuance comme exclusivement causative.
- source_word: φανερωθῇ
  choice: être révélé
  rationale: Le passif « être révélé » conserve l’idée de rendre visible ou connu et convient au registre biblique moderne.
- source_word: ἀπόκρυφον
  choice: tenu secret
  rationale: Cette expression distingue légèrement ἀπόκρυφον de κρυπτόν et suggère ce qui demeure hors de la vue, sans imposer une doctrine particulière.
- source_word: ἐγένετο
  choice: a été tenu
  rationale: Dans ce contexte, le passé composé rend naturellement l’entrée ou le placement dans un état caché, tout en conservant la valeur passée de l’aoriste.
- source_word: ἔλθῃ εἰς φανερόν
  choice: paraître au grand jour
  rationale: Cette expression idiomatique conserve l’idée d’aboutir dans le domaine du visible et forme un contraste clair avec « tenu secret ».
- source_word: γάρ
  choice: Car
  rationale: « Car » garde le lien explicatif avec la parole précédente.
theological_decisions:
- issue: Nuance de finalité ou de résultat dans les deux propositions introduites par ἵνα
  choice: Employer « qui ne doive… » pour laisser entendre que ce qui est caché est destiné à être manifesté.
  alternative: « sans qu’il soit révélé… sans qu’il paraisse au grand jour », avec une nuance davantage résultative.
  rationale: En grec, ἵνα marque normalement la finalité, mais peut prendre une nuance de résultat en grec koinè. La formulation choisie préserve cette tension sans préciser qui ordonne la révélation ni comment elle advient.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme grec est conservé, avec une légère variation lexicale entre « caché » et « tenu secret ». Tous les marqueurs de notes figurent dans le texte.
