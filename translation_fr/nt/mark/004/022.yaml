revisions:
- from: Car il n’y a rien de caché qui ne doive être révélé[a], et rien n’a été tenu secret qui ne doive paraître au grand jour[b].
  to: Car rien n’est caché que pour être révélé[a], et rien n’est devenu caché, sinon pour venir au grand jour[b].
  rationale: La révision remplace une tournure de nécessité par une formulation qui reflète plus exactement l’exception introduite par ἐὰν μὴ et la nuance de finalité ou de résultat de ἵνα. Elle rend aussi ἐγένετο sans ajouter un agent implicite. Les deux notes restent correctement ancrées et correspondent au texte révisé.
