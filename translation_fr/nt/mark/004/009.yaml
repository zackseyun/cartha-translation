base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: fr
  text: 'Et il disait : « Que celui qui a[a] des oreilles pour entendre entende ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « celui qui a ».
    reason: variante_textuelle
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination narrative simple sans lui ajouter une nuance temporelle absente du grec.
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait français reflète l’aspect imperfectif de l’imparfait grec, sans accentuer indûment l’idée de répétition.
- source_word: Ὃς ἔχει
  choice: Si quelqu’un a
  rationale: Rend naturellement en français moderne la portée générale de la construction relative grecque. « Quelqu’un » est grammaticalement singulier et ne désigne pas spécifiquement un homme.
- source_word: ὦτα
  choice: des oreilles
  rationale: Traduction directe du pluriel grec, également idiomatique en français dans cette formule proverbiale.
- source_word: ἀκούειν
  choice: pour entendre
  rationale: Exprime la fonction des oreilles tout en conservant la répétition lexicale avec l’impératif qui suit.
- source_word: ἀκουέτω
  choice: qu’il entende
  rationale: Le subjonctif dans cette tournure rend l’impératif grec à la troisième personne et préserve l’écho avec « entendre ».
theological_decisions:
- issue: Expression générique au masculin grammatical dans une parole proverbiale
  choice: Si quelqu’un… qu’il…
  alternative: Celui qui a des oreilles pour entendre, qu’il entende
  rationale: Le masculin singulier grec a une portée générique. « Quelqu’un » communique clairement cette portée en français moderne, tandis que « il » reprend normalement ce pronom grammaticalement singulier sans limiter l’appel aux hommes.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure proverbiale, l’aspect imperfectif de ἔλεγεν et la répétition d’ἀκούω.
