id: MRK.4.16
reference: Mark 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: fr
  text: Et de même, ceux qui sont semés sur un sol pierreux, ce sont ceux qui, lorsqu’ils entendent la parole, la reçoivent aussitôt avec joie,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: de même
  rationale: Rend naturellement l’adverbe qui relie ce groupe, par analogie, à l’explication précédente.
- source_word: ἐπὶ τὰ πετρώδη
  choice: sur un sol pierreux
  rationale: Expression agricole naturelle en français, qui désigne un terrain caractérisé par la pierre sans expliciter davantage la nature du sous-sol.
- source_word: σπειρόμενοι
  choice: ceux qui sont semés
  rationale: Conserve l’image délibérément mêlée de la semence et des personnes dans l’explication de la parabole.
- source_word: τὸν λόγον
  choice: la parole
  rationale: Préserve le terme récurrent et sa résonance biblique, tout en laissant le contexte indiquer qu’il s’agit du message proclamé.
- source_word: εὐθύς
  choice: aussitôt
  rationale: Restitue la rapidité marquée par l’adverbe et convient au style narratif de Marc.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: Rend directement la locution prépositionnelle exprimant la manière de recevoir.
- source_word: λαμβάνουσιν αὐτόν
  choice: la reçoivent
  rationale: « Recevoir » reste proche de λαμβάνω et n’implique pas, à lui seul, une adhésion durable; le pronom féminin reprend naturellement « la parole ».
theological_decisions:
- issue: Référent de « ceux qui sont semés » dans l’explication de la parabole
  choice: Maintenir la formulation imagée « ceux qui sont semés sur un sol pierreux ».
  alternative: Expliciter par « ceux dont le cœur ressemble à un sol pierreux ».
  rationale: Le grec conserve intentionnellement l’image de l’ensemencement tout en parlant des personnes représentées; l’explicitation proposée ajouterait une interprétation absente du texte.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe conserve la reprise explicative du grec; « aussitôt » maintient la vivacité caractéristique de Marc.
