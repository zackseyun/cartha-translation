  source_fidelity: 'La séquence « entendent la parole, l’accueillent et portent du fruit » rend fidèlement ἀκούουσιν… παραδέχονται… καρποφοροῦσιν, sans ajout interprétatif. Une légère correction est souhaitable : « sur la bonne terre » reflète plus directement ἐπὶ τὴν γῆν, tandis que « trente, soixante et cent pour un » rend l’énumération de rendements sans introduire les distinctions personnelles « l’un… l’autre… ».'
  naturalness: Le français révisé demeure clair et idiomatique dans un registre biblique moderne. « Trente, soixante et cent pour un » est une formulation française établie et naturelle pour des rendements agricoles.
  terminology: « La parole », « accueillir » et « porter du fruit » préservent le lexique et la métaphore de Marc 4. La note propose des équivalents lexicaux légitimes de παραδέχονται sans imposer de lecture doctrinale.
  issues:
