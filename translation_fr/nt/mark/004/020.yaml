source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: fr
  text: 'Et ceux-là sont ceux qui ont été semés sur la bonne terre : ils entendent la parole, l’accueillent[a] et portent du fruit : trente, soixante et cent pour un.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la reçoivent » ou « l’acceptent ».
    reason: Alternative lexicale pour παραδέχονται, qui désigne ici une réception favorable.
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: ceux-là
  rationale: Le démonstratif renvoie au dernier groupe décrit et maintient son contraste avec les groupes précédents.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: ceux qui ont été semés dans la bonne terre
  rationale: Cette formulation conserve l’image agricole et le passif du grec. « Dans la bonne terre » est l’expression française naturelle dans le cadre d’une semence, sans modifier la portée de l’image.
- source_word: γῆν τὴν καλὴν
  choice: la bonne terre
  rationale: Dans cette parabole, γῆ désigne la terre cultivable; « bonne terre » est idiomatique en français et préserve le contraste entre les terrains.
- source_word: οἵτινες
  choice: ils
  rationale: Une nouvelle proposition introduite par « ils » exprime naturellement en français les caractéristiques qui définissent ce groupe.
- source_word: ἀκούουσιν τὸν λόγον
  choice: entendent la parole
  rationale: « La parole » maintient le vocabulaire répété dans Marc 4 ainsi que sa portée de message proclamé.
- source_word: παραδέχονται
  choice: l’accueillent
  rationale: Le verbe indique une réception favorable. « Accueillir » exprime cette disposition sans réduire le sens à une simple audition; le pronom reprend explicitement « la parole ».
- source_word: καρποφοροῦσιν
  choice: portent du fruit
  rationale: Expression française courante qui conserve la métaphore agricole sans en imposer une interprétation doctrinale.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: l’un trente fois plus, l’autre soixante fois plus, l’autre cent fois plus
  rationale: La tournure rend clairement les différents rendements exprimés par les numéraux distributifs et reproduit leur rythme ternaire en français naturel.
theological_decisions:
- issue: Nature de la réponse à la parole dans la bonne terre
  choice: Le texte décrit une réception véritable et favorable de la parole, suivie de fécondité, sans préciser une doctrine ultérieure sur la persévérance ou l’apostasie.
  alternative: Lire dans la bonne terre soit la garantie nécessaire de la persévérance finale, soit seulement une réaction initiale.
  rationale: Le grec affirme simplement que ces personnes entendent, accueillent et portent du fruit; la traduction n’ajoute aucune conclusion doctrinale au-delà de cette séquence.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « ceux-là sont ceux » est conservée malgré sa légère lourdeur afin de refléter la structure identificatrice du grec. Le rythme final reste ternaire.
