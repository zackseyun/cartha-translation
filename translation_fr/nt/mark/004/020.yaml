    rationale: Cette formulation peut faire des rendements des propriétés de personnes distinctes. Le grec énumère simplement les productions, avec le tour distributif ἓν… ἓν… ἓν. « Trente, soixante et cent pour un » rend l’idiome de rendement de manière plus directe.
