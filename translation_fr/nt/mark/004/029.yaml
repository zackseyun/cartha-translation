  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: fr
  text: Mais quand la récolte est prête[a], il met aussitôt la faucille, car la moisson est là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « produit », « est mûre » ou, plus littéralement, « se livre ». Le grec emploie une tournure active inhabituelle dont « la récolte » est le sujet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mais dès que
  rationale: ὅταν introduit le moment où la condition se réalise, tandis que δέ marque une légère transition. « Mais dès que » rend naturellement l’enchaînement et la promptitude du passage à l’action.
- source_word: παραδοῖ ὁ καρπός
  choice: la récolte est prête
  rationale: παραδίδωμι signifie habituellement « livrer, remettre », mais son emploi actif avec ὁ καρπός comme sujet est inhabituel. Dans ce contexte agricole, l’expression indique que la récolte se livre à la moisson, autrement dit qu’elle est prête. Le texte principal privilégie une formulation française claire, et la note conserve l’étrangeté de l’expression grecque.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » exprime nettement l’action immédiate et conserve le rythme caractéristique de Marc.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: il y met la faucille
  rationale: Le grec dit littéralement qu’il « envoie la faucille ». L’expression française « mettre la faucille » rend naturellement le commencement de la moisson, tandis que le pronom « y » renvoie à la récolte prête à être coupée.
- source_word: ὅτι παρέστηκεν ὁ θερισμός
  choice: car la moisson est là
  rationale: ὅτι donne la raison de l’action. Le parfait παρέστηκεν présente la moisson comme arrivée et désormais présente ; « est là » exprime de façon concise ces deux nuances.
theological_decisions:
- issue: Le sens métaphorique de la récolte prête dans la parabole du règne de Dieu
  choice: Conserver l’image agricole sans identifier explicitement la moisson à un événement théologique particulier.
  alternative: Préciser dans le texte qu’il s’agit du jugement final, de l’accomplissement du règne ou de la mission.
  rationale: La parabole laisse ouverte la portée exacte de la moisson. La traduction ne doit pas trancher une question que le verset lui-même ne résout pas.
translation_notes:
  register: Français international moderne, clair et digne. « La récolte est prête » privilégie l’intelligibilité, tandis que la note signale la tournure grecque inhabituelle. « La moisson est là » conserve la valeur résultative du parfait sans alourdir la phrase.
