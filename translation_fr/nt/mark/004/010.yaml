id: MRK.4.10
reference: Mark 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: fr
  text: Quand il fut à l’écart, ceux qui l’entouraient[a], avec les Douze, l’interrogeaient sur les paraboles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui étaient avec lui »; l’expression désigne le cercle des personnes qui suivaient Jésus, sans nécessairement se limiter aux Douze.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Quand
  rationale: En français, « Quand » assure naturellement l’enchaînement narratif; rendre καί par « Et » serait possible, mais plus lourd ici.
- source_word: ἐγένετο κατὰ μόνας
  choice: il fut à l’écart
  rationale: L’expression indique que Jésus se trouve désormais en privé, à l’écart de la foule. « Seul » serait trop facilement compris au sens absolu, alors que des disciples sont auprès de lui.
- source_word: ἠρώτων
  choice: l’interrogeaient
  rationale: L’imparfait français restitue l’aspect imperfectif du verbe grec, sans accentuer indûment la répétition.
- source_word: οἱ περὶ αὐτὸν
  choice: ceux qui l’entouraient
  rationale: Cette formulation garde l’image grecque tout en désignant naturellement le cercle plus large des personnes qui suivaient Jésus.
- source_word: σὺν τοῖς δώδεκα
  choice: avec les Douze
  rationale: Cette traduction concise conserve l’accompagnement et la distinction syntaxique entre le groupe plus large et les Douze.
- source_word: τὰς παραβολάς
  choice: les paraboles
  rationale: Le pluriel du texte grec est maintenu sans le réduire à la seule parabole qui précède immédiatement.
theological_decisions:
- issue: Identité des personnes qui interrogent Jésus
  choice: Un groupe plus large de disciples entourant Jésus, avec les Douze
  alternative: Les Douze seuls, ou un cercle privé strictement distinct des Douze
  rationale: La construction « οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα » distingue naturellement ceux qui entourent Jésus des Douze tout en les réunissant dans l’action. La traduction ne réduit donc pas le groupe aux seuls Douze.
translation_notes:
  register: Français moderne, sobre et narratif. « À l’écart » exprime une situation privée sans créer la contradiction apparente de Jésus « seul » en présence de plusieurs disciples; « les Douze » conserve l’appellation consacrée et la dignité du registre.
