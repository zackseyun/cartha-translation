source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: fr
  text: Il se mit de nouveau à enseigner au bord de la mer. Une foule immense se rassemble vers lui[a], si bien qu’il monta dans une barque et s’assit dans la barque, sur l’eau[b]. Toute la foule se tenait à terre, au bord de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vient se rassembler vers lui » ; Marc emploie souvent le présent historique pour donner de la vivacité au récit.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la mer » ; il est assis dans une barque, sur l’eau, tandis que la foule reste à terre.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: Exprime naturellement la répétition de l’activité d’enseignement de Jésus.
- source_word: ἤρξατο διδάσκειν
  choice: se mit à enseigner
  rationale: Rend la valeur ingressive de la construction grecque dans un français actuel et fluide.
- source_word: παρὰ τὴν θάλασσαν
  choice: au bord de la mer
  rationale: παρά avec l’accusatif marque ici la proximité le long du rivage; « mer » conserve le terme du texte sans l’expliciter comme lac de Galilée.
- source_word: συνάγεται
  choice: se rassemble
  rationale: Conserve le présent historique caractéristique et vivant du récit de Marc.
- source_word: ὄχλος πλεῖστος
  choice: une foule immense
  rationale: Restitue avec naturel la forte intensification portée par πλεῖστος.
- source_word: πρὸς αὐτόν
  choice: auprès de lui
  rationale: Indique le mouvement vers Jésus et le rassemblement à proximité de lui.
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit idiomatiquement en français le résultat produit par l’affluence.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: il monta dans une barque
  rationale: Exprime clairement l’action du participe, subordonnée au fait de s’asseoir, sans lourdeur syntaxique.
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: s’assit sur la mer
  rationale: Préserve l’image surprenante et la formulation spatiale du grec; le contexte de la barque en précise le sens.
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Conserve la totalité exprimée par πᾶς et le collectif singulier.
- source_word: ἐπὶ τῆς γῆς
  choice: à terre
  rationale: Rend naturellement le contraste spatial entre Jésus dans la barque et la foule sur la terre ferme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique « se rassemble » est conservé malgré l’alternance avec les temps du passé. « Sur la mer » maintient l’expression concrète du grec, accompagnée d’une note explicative.
