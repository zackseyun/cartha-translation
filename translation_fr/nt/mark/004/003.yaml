  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: fr
  text: Écoutez ! Voici qu’un semeur sortit pour semer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Écoutez !
  rationale: Impératif présent à la deuxième personne du pluriel servant à capter l’attention. « Écoutez ! » est naturel en français moderne et conserve pleinement la force de l’ordre.
- source_word: ἰδού
  choice: Voici que
  rationale: Particule discursive attirant l’attention sur la scène qui suit. « Voici que » garde sa fonction narrative marquée dans un français digne et naturel.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Aoriste indicatif de ἐξέρχομαι, qui exprime ici un déplacement vers l’extérieur. Le passé simple convient à la narration écrite et rend l’aspect ponctuel sans lourdeur.
- source_word: ὁ σπείρων
  choice: un semeur
  rationale: Participe présent substantivé désignant celui qui sème. « Un semeur » est idiomatique et correspond à l’introduction d’un personnage dans la parabole; l’article grec peut désigner le rôle sans imposer en français l’article défini.
- source_word: σπεῖραι
  choice: pour semer
  rationale: Infinitif aoriste exprimant le but après le verbe de mouvement. « Pour semer » rend explicitement et naturellement cette relation finale.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’impératif initial et le signal narratif sont conservés; le passé simple maintient le ton narratif de la parabole.
