  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: fr
  text: Une forte tempête se leva[a], et les vagues se déversaient dans la barque[b], si bien que celle-ci se remplissait déjà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « une grande tempête de vent se leva ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les vagues frappaient la barque et y entraient ». L’imparfait grec décrit une action répétée ou continue.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la barque était déjà en train d’être remplie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: se leva
  rationale: Le présent historique de Marc est rendu par un passé simple naturel dans le récit; « se leva » exprime bien le déclenchement soudain de la tempête.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: un violent coup de vent
  rationale: λαῖλαψ désigne une bourrasque ou tempête soudaine et violente, tandis que ἀνέμου en précise la nature. Cette formulation française est idiomatique et restitue la force de μεγάλη.
- source_word: κύματα
  choice: les vagues
  rationale: Équivalent français courant et précis de κύματα dans ce contexte lacustre.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: se jetaient dans la barque
  rationale: L’imparfait exprime l’action répétée ou continue des vagues qui frappent la barque et y pénètrent; « se jetaient dans » conserve l’image dynamique du grec.
- source_word: πλοῖον
  choice: barque
  rationale: « Barque » convient naturellement à l’embarcation employée sur le lac de Galilée et évite l’idée d’un grand navire.
- source_word: ὥστε
  choice: si bien que
  rationale: Cette locution introduit clairement la conséquence exprimée par ὥστε.
- source_word: ἤδη
  choice: déjà
  rationale: Rend directement l’idée que le remplissage était désormais en cours et avancé.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: celle-ci se remplissait
  rationale: La tournure pronominale est naturelle en français et préserve le déroulement du processus exprimé par l’infinitif présent, sans forcer la nuance passive ou moyenne.
