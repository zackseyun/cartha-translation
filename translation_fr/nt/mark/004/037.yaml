translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple marque l’apparition soudaine de la bourrasque, tandis que les imparfaits décrivent les vagues répétées et le remplissage progressif. Les pronoms évitent une répétition lourde de « la barque ».
