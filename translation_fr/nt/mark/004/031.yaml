id: MRK.4.31
reference: Mark 4:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: fr
  text: Il est comme une graine de moutarde[a] qui, lorsqu’elle est semée en terre, est plus petite[b] que toutes les graines qui sont sur la terre —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grain de moutarde » (le terme grec peut désigner une graine ou un grain).
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie le comparatif « plus petite », et non le superlatif « la plus petite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Il ressemble à
  rationale: La comparaison reprend la question du verset précédent au sujet du règne de Dieu. Le pronom « Il » explicite naturellement en français le sujet sous-entendu en grec.
- source_word: κόκκῳ σινάπεως
  choice: une graine de moutarde
  rationale: « Graine de moutarde » est l’expression française courante et naturelle; κόκκος peut aussi désigner un grain.
- source_word: ὅταν σπαρῇ
  choice: lorsqu’elle est semée
  rationale: Cette formulation rend la valeur temporelle générale de ὅταν avec le subjonctif aoriste tout en restant fluide en français.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Le contexte agricole donne à γῆ le sens de sol ou terre cultivable, tandis que « sur » suit de près ἐπί. La répétition présente dans le grec est conservée.
- source_word: μικρότερον ὂν
  choice: est plus petite
  rationale: Le comparatif μικρότερον est rendu explicitement par « plus petite », sans le transformer en superlatif. Une proposition à verbe conjugué est plus naturelle en français que le calque participial.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: que toutes les graines qui sont sur la terre
  rationale: Cette formulation rend le génitif de comparaison et conserve le qualificatif final du texte grec.
theological_decisions:
- issue: Comparatif ou superlatif pour la taille de la graine de moutarde
  choice: est plus petite que toutes les graines
  alternative: est la plus petite de toutes les graines
  rationale: Le texte grec porte le comparatif μικρότερον, non un superlatif explicite. La traduction conserve cette forme et la tension éventuelle de l’énoncé sans la lisser selon la formulation traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « sur la terre » et le tiret final sont maintenus afin de respecter la structure de la phrase grecque, qui se poursuit au verset suivant.
