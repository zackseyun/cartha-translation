  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: fr
  text: Après avoir laissé la foule, ils emmènent Jésus avec eux, tel qu’il était, dans la barque[a]. D’autres barques étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils emmènent Jésus avec eux tel qu’il était dans la barque ». Le grec peut souligner soit qu’il se trouvait déjà dans la barque, soit qu’ils l’ont emmené sans autre préparation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Après avoir laissé
  rationale: Le participe aoriste indique une action précédant le verbe principal. Cette formulation naturelle n’impose pas l’idée d’un renvoi formel de la foule.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: Rend simplement et naturellement le groupe rassemblé autour de Jésus.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: ils emmènent Jésus avec eux
  rationale: παραλαμβάνω signifie ici prendre quelqu’un avec soi. Le nom « Jésus » clarifie naturellement le référent du pronom sans modifier le sens.
- source_word: ὡς ἦν
  choice: tel qu’il était
  rationale: Préserve l’idée qu’ils l’emmènent dans l’état où il se trouvait, sans préparatifs supplémentaires, tout en laissant ouverte la relation exacte avec la mention de la barque.
- source_word: ἐν τῷ πλοίῳ
  choice: dans la barque
  rationale: Dans le contexte du lac, « barque » est le terme français courant. La position après « tel qu’il était » suit l’ordre grec et n’implique pas qu’il monte alors dans la barque.
- source_word: ἄλλα πλοῖα ἦν μετ’ αὐτοῦ
  choice: D’autres barques l’accompagnaient
  rationale: Expression française naturelle de la présence d’autres embarcations avec Jésus; aucun qualificatif comme « petites » n’est ajouté.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique grec est conservé dans la première proposition principale; l’imparfait décrit l’accompagnement des autres barques. La ponctuation et la note maintiennent l’ambiguïté syntaxique de ὡς ἦν ἐν τῷ πλοίῳ.
