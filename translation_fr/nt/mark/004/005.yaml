  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: fr
  text: Une autre partie de la semence tomba sur le sol rocheux[a], où elle avait peu de terre. Elle leva aussitôt, parce que la terre était peu profonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le terrain pierreux ». Le grec décrit un terrain rocheux recouvert seulement d’une mince couche de terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: une autre partie de la semence
  rationale: L’adjectif neutre singulier est employé substantivement et renvoie implicitement à la semence du contexte. Cette formulation explicite l’ellipse tout en suggérant une portion de la semence dispersée.
- source_word: πετρῶδες
  choice: le sol rocheux
  rationale: Le terme désigne un terrain rocheux recouvert d’une faible couche de terre, plutôt qu’un sol où se trouvent seulement quelques pierres.
- source_word: γῆν πολλήν
  choice: peu de terre
  rationale: La négation grecque signifie littéralement que la semence n’avait pas beaucoup de terre. En français courant, « peu de terre » rend naturellement l’image agricole.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme exprime l’immédiateté de la levée et « aussitôt » convient au registre narratif.
- source_word: ἐξανέτειλεν
  choice: elle leva
  rationale: Dans ce contexte agricole, le verbe décrit la germination et la sortie de terre. « Lever » est le verbe français précis et naturel pour une semence.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: parce que la terre était peu profonde
  rationale: La construction avec διά exprime la cause. Cette formulation naturelle conserve l’image d’une mince couche de terre au-dessus de la roche.
- source_word: ὅπου
  choice: où
  rationale: L’adverbe relatif locatif se rend directement et naturellement par « où ».
