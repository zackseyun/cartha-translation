reference: Mark 4:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: fr
  text: 'Une fois réveillé, il réprimanda le vent et dit à la mer[a] : « Silence ! Tais-toi ! »[b] Le vent cessa, et il y eut un grand calme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la mer de Galilée, appelée aussi lac de Galilée.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement, pour le second impératif : « Sois muselée ! » Le grec évoque le fait de mettre une muselière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: Une fois réveillé
  rationale: Cette tournure rend la valeur temporelle du participe aoriste passif sans préciser si Jésus s’est réveillé de lui-même ou a été réveillé.
- source_word: ἐπετίμησεν
  choice: réprimanda
  rationale: Le verbe exprime une parole de réprobation autoritaire. « Réprimanda » conserve cette force et reste naturel en français lorsqu’un élément de la nature est personnifié.
- source_word: τῷ ἀνέμῳ
  choice: le vent
  rationale: Le grec désigne simplement le vent, bien que le contexte soit celui d’une tempête.
- source_word: τῇ θαλάσσῃ
  choice: à la mer
  rationale: « Mer » correspond directement à θάλασσα et préserve la formulation de Marc, plutôt que de la remplacer dans le corps du texte par la précision géographique « lac ».
- source_word: Σιώπα
  choice: Silence !
  rationale: Cette injonction brève et énergique commande la cessation immédiate du bruit.
- source_word: πεφίμωσο
  choice: Tais-toi !
  rationale: Cette formulation est naturelle et vigoureuse en français. Une note conserve l’image grecque plus littérale du musellement.
- source_word: ἐκόπασεν
  choice: tomba
  rationale: En français, dire que le vent « tombe » exprime idiomatiquement qu’il cesse ou s’apaise.
- source_word: ἐγένετο γαλήνη μεγάλη
  choice: un grand calme se fit
  rationale: La tournure restitue le résultat soudain ainsi que l’adjectif μεγάλη, caractéristique de l’intensité narrative chez Marc.
theological_decisions:
- issue: Faut-il reprendre la formule traditionnelle « Paix ! Tais-toi ! » ou rendre les deux impératifs grecs ?
  choice: « Silence ! Tais-toi ! » avec une note sur l’image du musellement
  alternative: « Paix ! Reste tranquille ! » ou « Silence ! Sois muselée ! »
  rationale: 'Le grec ne contient pas ici le nom « paix », mais deux impératifs : le premier commande le silence et le second évoque littéralement le fait d’être muselé. Le texte principal reste naturel en français, tandis que la note préserve l’image forte de l’original.'
- issue: Faut-il traduire θάλασσα par « mer » ou par « lac » ?
  choice: « mer » dans le texte, avec une précision géographique en note
  alternative: « lac »
  rationale: « Mer » suit le terme grec et maintient la portée narrative de l’autorité exercée sur la mer, sans nier qu’il s’agit géographiquement du lac de Galilée.
translation_notes:
  register: Français international moderne, digne et accessible. « Une fois réveillé » préserve l’ambiguïté de l’agent ; « le vent tomba » et « un grand calme se fit » sont des formulations narratives naturelles sans atténuer le contraste marqué du verset.
