source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: fr
  text: D’autres graines tombèrent dans la bonne terre[a]. Elles donnaient du fruit, poussaient et se développaient, et rapportaient trente, soixante et cent pour un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « D’autres tombèrent dans la bonne terre », le mot « graines » étant sous-entendu d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: D’autres graines
  rationale: L’adjectif neutre pluriel est employé substantivement et renvoie à ce qui a été semé dans le contexte. « Graines » est explicité pour obtenir un français clair et naturel, sans changer le référent.
- source_word: γῆν τὴν καλήν
  choice: la bonne terre
  rationale: Dans ce contexte agricole, γῆ désigne la terre cultivable ou le sol. « La bonne terre » est l’expression française courante et digne dans une parabole de semailles.
- source_word: ἐδίδου καρπὸν
  choice: Elles donnaient du fruit
  rationale: L’imparfait français rend l’action continue de l’imparfait grec et conserve l’image concrète du fruit.
- source_word: ἀναβαίνοντα
  choice: poussaient
  rationale: Dans le cadre agricole, le participe évoque la levée et la croissance vers le haut. « Poussaient » est naturel en français.
- source_word: αὐξανόμενα
  choice: se développaient
  rationale: Ce choix distingue la croissance continue de la simple levée exprimée par ἀναβαίνοντα, tout en évitant une répétition maladroite de « croître ».
- source_word: ἔφερεν
  choice: rapportaient
  rationale: Le verbe décrit le rendement continu de la semence. « Rapporter » convient idiomatiquement à une récolte et permet d’introduire naturellement les proportions.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: trente, soixante et cent pour un
  rationale: La formule exprime des rendements agricoles. « Pour un » explicite en français le rapport sous-entendu, tandis que « et » respecte l’enchaînement grec des trois résultats.
theological_decisions: []
translation_notes:
  register: Français international moderne, accessible et soutenu. Le passé simple marque la chute ponctuelle des graines, tandis que l’imparfait présente la croissance et la production comme des processus continus. La traduction conserve l’enchaînement cumulatif des actions sans lui ajouter d’interprétation théologique.
