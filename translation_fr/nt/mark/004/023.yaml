  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: fr
  text: Si quelqu’un a des oreilles pour entendre, qu’il entende.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Si quelqu’un
  rationale: Cette formulation conserve la construction conditionnelle grecque et la portée générale du pronom indéfini, tout en restant naturelle en français moderne.
- source_word: ἔχει
  choice: a
  rationale: Le présent de possession est rendu simplement et directement.
- source_word: ὦτα
  choice: des oreilles
  rationale: Le pluriel concret du grec est conservé, ainsi que l’expression imagée.
- source_word: ἀκούειν
  choice: pour entendre
  rationale: L’infinitif exprime ici la capacité ou la finalité; « entendre » maintient l’écho lexical avec l’impératif qui suit.
- source_word: ἀκουέτω
  choice: qu’il entende
  rationale: Le subjonctif dans cette tournure rend naturellement en français l’impératif grec à la troisième personne du singulier, tout en préservant la répétition du verbe « entendre ».
theological_decisions:
- issue: Portée générique du singulier dans l’impératif
  choice: qu’il entende
  alternative: que cette personne entende
  rationale: Le grec emploie un pronom indéfini singulier suivi d’un impératif à la troisième personne du singulier. Le français peut conserver ce singulier générique avec « il » sans restreindre l’appel aux hommes.
translation_notes:
  register: 'Formulation brève, solennelle et idiomatique. La répétition « entendre… entende » conserve l’insistance rhétorique du grec et laisse ouverte la profondeur du sens: audition réelle et accueil attentif du message.'
