id: MRK.4.11
reference: Mark 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: fr
  text: 'Il leur disait : « À vous, le mystère du royaume de Dieu a été donné ; mais, pour ceux du dehors, tout se fait en paraboles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: le mystère
  rationale: Conserve le terme théologique grec, qui désigne ici une réalité divine auparavant cachée et désormais donnée à connaître, sans le réduire à une simple énigme.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: du royaume de Dieu
  rationale: Rendu français traditionnel, naturel et précis du génitif grec.
- source_word: ἐκείνοις δὲ τοῖς ἔξω
  choice: mais pour ceux du dehors
  rationale: Préserve la métaphore spatiale et la distinction établie par le texte, sans préciser davantage l'identité du groupe.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: Maintient le pluriel et le terme consacré correspondant au mode d'enseignement de Jésus.
- source_word: τὰ πάντα γίνεται
  choice: tout arrive
  rationale: Rend le sens dynamique de γίνεται (« se produit », « arrive ») plutôt qu'une simple copule, tout en conservant l'expression difficile et sa possible portée générale.
theological_decisions:
- issue: Le mystère comme don
  choice: « le mystère [...] a été donné »
  alternative: « il vous a été donné de connaître le mystère »
  rationale: Le grec dit littéralement que le mystère lui-même a été donné ; l'ajout « de connaître » expliciterait une idée présente dans certains parallèles, mais absente de cette formulation de Marc.
- issue: Fonction des paraboles pour ceux du dehors
  choice: « tout arrive en paraboles »
  alternative: « tout leur est présenté sous forme de paraboles »
  rationale: La formulation retenue préserve l'étrangeté et l'ambiguïté de γίνεται, sans réduire les paraboles à une simple technique de présentation ni résoudre d'avance leur fonction révélatrice ou voilante.
translation_notes:
  register: Français international moderne, digne et accessible. L'imparfait « disait » restitue l'aspect de ἔλεγεν. La syntaxe reste proche de l'original afin de préserver sa tension, notamment dans « tout arrive en paraboles ».
