id: MRK.4.38
reference: Mark 4:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: fr
  text: 'Mais lui-même était à l’arrière du bateau, endormi sur le coussin[a]. Ils le réveillèrent et lui dirent : « Maître, cela ne te fait rien que nous soyons en train de périr ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oreiller ». Le mot grec peut désigner un coussin servant à soutenir la tête.
    reason: Alternative lexicale authentique pour προσκεφάλαιον.
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: lui-même était
  rationale: Le pronom explicite αὐτός porte une valeur emphatique ou contrastive que « lui-même » conserve en français.
- source_word: ἐν τῇ πρύμνῃ
  choice: à l’arrière du bateau
  rationale: πρύμνα désigne la poupe. La formulation courante « à l’arrière du bateau » est immédiatement compréhensible et précise dans ce contexte.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: sur le coussin
  rationale: προσκεφάλαιον désigne un support pour la tête, coussin ou oreiller. « Coussin » convient au cadre nautique sans ajouter que sa tête reposait dessus.
- source_word: καθεύδων
  choice: endormi
  rationale: Le participe décrit l’état durable de Jésus à ce moment du récit. « Endormi » s’intègre naturellement à la construction française.
- source_word: ἐγείρουσιν
  choice: ils le réveillèrent
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel d’une narration française écrite et soutenue sans archaïsme.
- source_word: λέγουσιν αὐτῷ
  choice: lui dirent
  rationale: Le présent historique est rendu au passé simple, en coordination naturelle avec « réveillèrent ».
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe à Jésus, « Maître » est le terme français courant pour un enseignant reconnu et évite le peu naturel « Enseignant ! ».
- source_word: οὐ μέλει σοι
  choice: cela ne te fait rien
  rationale: Cette tournure idiomatique française conserve le caractère direct, urgent et accusateur de la question grecque.
- source_word: ὅτι ἀπολλύμεθα
  choice: que nous soyons en train de périr
  rationale: ἀπολλύμεθα exprime ici une ruine mortelle en cours ou imminente. La périphrase progressive rend l’urgence aspectuelle, tandis que « périr » conserve la force du verbe.
theological_decisions:
- issue: Force narrative de la question des disciples adressée à Jésus
  choice: 'Question accusatrice : « cela ne te fait rien que nous soyons en train de périr ? »'
  alternative: 'Formulation plus douce : « ne te soucies-tu pas de ce que nous allons mourir ? »'
  rationale: La formulation grecque exprime un reproche pressant plutôt qu’une simple demande d’information. La traduction maintient cette tension sans attribuer explicitement une intention à Jésus ni porter un jugement théologique sur la foi des disciples.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration biblique écrite; « à l’arrière du bateau » privilégie la clarté ordinaire par rapport au terme nautique « poupe ». Le discours direct demeure vif et oral.
