source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: fr
  text: 'La terre produit d’elle-même : d’abord la jeune pousse, puis l’épi, puis le grain plein dans l’épi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: d’elle-même
  rationale: L’adjectif qualifie « la terre » et indique qu’elle produit sans intervention humaine visible. « D’elle-même » est naturel et préserve cette idée sans la connotation mécanique d’« automatiquement ».
- source_word: ἡ γῆ
  choice: la terre
  rationale: Dans ce contexte agricole, γῆ désigne le sol cultivé. « La terre » est l’expression française la plus naturelle et convient au langage d’une parabole.
- source_word: καρποφορεῖ
  choice: produit
  rationale: Le verbe signifie porter ou produire du fruit, et ici la suite précise les étapes de formation d’une céréale. « Produit » donne une phrase française naturelle sans perdre le sens agricole.
- source_word: πρῶτον χόρτον
  choice: d’abord la jeune pousse
  rationale: Dans la progression de la céréale, χόρτος désigne sa première croissance verte visible. « Jeune pousse » est clair en français moderne et plus précis ici que « herbe ».
- source_word: εἶτα στάχυν
  choice: puis l’épi
  rationale: στάχυς désigne l’épi d’une céréale. « Épi » est le terme français courant et précis.
- source_word: πλήρης σῖτον
  choice: le grain bien formé
  rationale: La construction grecque exprime le grain plein ou arrivé à sa plénitude dans l’épi. « Bien formé » restitue πλήρης sans ajouter explicitement l’idée de maturité contenue dans « mûr ».
- source_word: ἐν τῷ στάχυϊ
  choice: dans l’épi
  rationale: La formule situe le grain dans l’épi et reprend naturellement le même terme français pour στάχυς.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La cadence ternaire « d’abord… puis… puis… » conserve la progression nette du grec. Aucun marqueur de note n’est nécessaire, car les termes agricoles retenus sont courants et ne masquent pas d’ambiguïté substantielle.
