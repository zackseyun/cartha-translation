  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: fr
  text: 'Ils furent saisis d’une grande crainte[a] et se dirent les uns aux autres : « Qui est donc celui-ci, puisque même le vent et la mer lui obéissent ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils craignirent une grande crainte ». Le grec emploie une tournure intensive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: furent saisis d’une grande crainte
  rationale: Le verbe accompagné de son accusatif apparenté forme une expression intensive. Cette formulation française naturelle conserve à la fois l’idée de crainte et sa forte intensité.
- source_word: ἔλεγον
  choice: se dirent
  rationale: L’imparfait grec peut évoquer une parole en cours ou répétée, mais le passé simple convient au récit français. Avec le complément réciproque, la forme pronominale est idiomatique.
- source_word: πρὸς ἀλλήλους
  choice: les uns aux autres
  rationale: Cette expression rend explicitement la réciprocité de leur échange.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Qui est donc celui-ci
  rationale: « Donc » conserve la nuance d’inférence mêlée d’étonnement portée par ἄρα, tandis que « celui-ci » reflète οὗτός sans effacer la question sur l’identité de Jésus.
- source_word: ὅτι
  choice: pour que
  rationale: Dans cette question portant sur la qualité ou l’identité de la personne, « pour que » exprime naturellement en français le fait étonnant qui motive la question, sans ajouter d’explication doctrinale.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: même le vent et la mer
  rationale: Le premier καί a une valeur intensive (« même »), tandis que le second coordonne les deux éléments.
- source_word: ὑπακούει αὐτῷ
  choice: lui obéissent
  rationale: ὑπακούω désigne ici l’obéissance du vent et de la mer à l’ordre de Jésus. Le pluriel est naturel en français avec le sujet composé, malgré le singulier grammatical du grec.
theological_decisions:
- issue: Autorité de Jésus sur la création
  choice: Conserver la question étonnée des disciples et l’obéissance du vent et de la mer sans expliciter davantage l’identité de Jésus.
  alternative: Développer la formulation afin d’affirmer explicitement son identité divine.
  rationale: Le verset manifeste une autorité extraordinaire et invite à s’interroger sur l’identité de Jésus, mais ne formule pas lui-même une conclusion doctrinale explicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple correspond au registre narratif biblique courant sans être archaïque; la tournure intensive grecque est expliquée en note plutôt que calquée maladroitement dans le texte.
