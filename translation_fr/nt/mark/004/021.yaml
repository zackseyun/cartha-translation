id: MRK.4.21
reference: Mark 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: fr
  text: 'Il leur disait : « Une lampe vient-elle[a] pour être mise sous un récipient de mesure[b] ou sous le lit ? N’est-ce pas pour être mise sur le porte-lampe ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le grec dit qu’une lampe « vient », personnification vive que certaines traductions rendent par « apporte-t-on une lampe ? »
    reason: lexical_alternative
  - marker: b
    text: 'Le mot grec désigne une mesure de capacité pour les matières sèches ainsi que le récipient correspondant; traduction traditionnelle : « boisseau » ou « mesure » selon les versions.'
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il leur disait
  rationale: L’imparfait grec présente cette parole dans son déroulement ou comme un enseignement répété; l’imparfait français en garde naturellement l’aspect.
- source_word: Μήτι
  choice: Une lampe vient-elle… ?
  rationale: La question rhétorique introduite par Μήτι appelle une réponse négative. L’inversion interrogative, suivie de « N’est-ce pas… ? », en restitue la force sans alourdir la phrase.
- source_word: ἔρχεται ὁ λύχνος
  choice: Une lampe vient-elle
  rationale: Cette formulation conserve la personnification vive du grec. L’article indéfini exprime naturellement en français la portée générale de cette maxime.
- source_word: λύχνος
  choice: lampe
  rationale: Le terme désigne ici une lampe à huile concrète, et non la lumière de manière abstraite.
- source_word: μόδιον
  choice: récipient de mesure
  rationale: Le μόδιος était une mesure de capacité pour matières sèches et, par extension, le récipient correspondant. Cette expression moderne communique la fonction sans importer une unité française particulière.
- source_word: κλίνην
  choice: lit
  rationale: κλίνη peut désigner un lit ou une couche; « lit » est ici le terme domestique le plus courant et le plus clair.
- source_word: λυχνίαν
  choice: porte-lampe
  rationale: Le mot désigne précisément un support sur lequel on posait une lampe. « Porte-lampe » préserve l’image concrète mieux que le terme vague « support ».
- source_word: τεθῇ
  choice: être mise
  rationale: Le passif de τίθημι est rendu par une tournure française simple et naturelle, répétée dans les deux membres pour conserver leur parallélisme.
- source_word: ἵνα ... τεθῇ
  choice: pour être mise
  rationale: La construction exprime ici la destination ou le but au sein de la question rhétorique; « pour être mise » en garde clairement la valeur.
theological_decisions:
- issue: Conserver ou atténuer la personnification de la lampe qui « vient »
  choice: 'Conserver l’image active: « Une lampe vient-elle… ? »'
  alternative: « Apporte-t-on une lampe… ? »
  rationale: Le grec attribue de façon frappante à la lampe l’action de venir. Cette image proverbiale demeure intelligible en français et ne doit pas être silencieusement transformée en passif.
- issue: Valeur générique de l’article dans ὁ λύχνος
  choice: Employer « une lampe »
  alternative: « la lampe »
  rationale: Dans une maxime française, l’indéfini exprime plus naturellement un cas général, sans changer la portée du grec.
translation_notes:
  register: Français international moderne, sobre et oralement fluide. La tournure proverbiale et son parallélisme sont conservés. « Récipient de mesure » évite l’archaïsme possible de « boisseau », tandis que la note maintient le repère culturel traditionnel.
