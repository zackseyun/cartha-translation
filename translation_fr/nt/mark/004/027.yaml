source:
  edition: SBLGNT
  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: fr
  text: Il dort et se lève, nuit et jour, et la semence germe et grandit sans qu’il sache lui-même comment.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδῃ καὶ ἐγείρηται
  choice: il dort et se lève
  rationale: Les présents au subjonctif décrivent ici, dans la suite de la parabole, les actions habituelles et répétées du semeur. Le présent français rend naturellement cette valeur.
- source_word: νύκτα καὶ ἡμέραν
  choice: nuit et jour
  rationale: Cette expression temporelle évoque la succession continue des nuits et des jours; la formulation française conserve cet ordre et cette portée.
- source_word: ὁ σπόρος
  choice: la semence
  rationale: L’article renvoie à ce qui a été semé dans la parabole. « Semence » convient au contexte agricole et au processus de germination.
- source_word: βλαστᾷ καὶ μηκύνηται
  choice: germe et grandit
  rationale: « Germe » exprime l’apparition de la pousse, tandis que « grandit » rend l’idée plus précise d’allongement ou d’augmentation de taille portée par μηκύνηται, dans un français naturel.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: sans qu’il sache lui-même comment
  rationale: La tournure française explicite naturellement que le semeur ignore la manière dont la croissance se produit. « Lui-même » conserve l’insistance de αὐτός.
theological_decisions:
- issue: L’agent de la croissance de la semence
  choice: La croissance se produit sans que le semeur en connaisse le mécanisme; aucun agent n’est explicitement nommé dans ce verset.
  alternative: Préciser que Dieu fait pousser la semence, ou présenter la croissance comme un processus exclusivement naturel.
  rationale: Le grec met l’accent sur l’ignorance du semeur et laisse inexpliquée la cause profonde de la croissance. La traduction préserve cette tension sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, simple et digne. « Tandis que » relie clairement le rythme ordinaire du semeur à la croissance simultanée et mystérieuse de la semence, sans surinterpréter le rapport logique.
