id: MRK.4.12
reference: Mark 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: fr
  text: afin que, regardant, ils regardent et ne perçoivent pas[a], et qu’entendant, ils entendent et ne comprennent pas[b], de peur qu’ils ne reviennent[c] et qu’il ne leur soit pardonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et ne discernent pas ».
    reason: lexical_alternative
  - marker: b
    text: Jésus fait écho à Ésaïe 6.9-10, en préservant la tension entre le jugement divin et l’absence de réponse du peuple.
    reason: cross_reference
  - marker: c
    text: « Reviennent » peut aussi se traduire par « se tournent » ou, dans ce contexte, « se repentent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit naturellement en français la visée ou le résultat exprimé par la conjonction grecque, sans en atténuer la force.
- source_word: βλέποντες βλέπωσι
  choice: tout en regardant, ils regardent
  rationale: Conserve les deux formes du même verbe et l’effet paradoxal de la formulation, malgré son caractère volontairement marqué en français.
- source_word: ἴδωσιν
  choice: percevoir
  rationale: Distingue ce verbe du βλέπω répété et exprime la perception réelle, au-delà du simple fait de regarder.
- source_word: ἀκούοντες ἀκούωσι
  choice: tout en entendant, ils entendent
  rationale: Maintient le redoublement emphatique qui fait écho au style sémitique d’Ésaïe.
- source_word: συνιῶσιν
  choice: comprendre
  rationale: Rend clairement l’idée de compréhension mentale ou spirituelle dans un français moderne et courant.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Préserve la force prospective négative et la solennité de la formule grecque, sans la réduire à une simple conséquence.
- source_word: ἐπιστρέψωσιν
  choice: reviennent
  rationale: Conserve l’image générale d’un retour, qui peut évoquer la conversion ou la repentance sans imposer ce sens dans le texte principal.
- source_word: ἀφεθῇ αὐτοῖς
  choice: qu’il ne leur soit pardonné
  rationale: Conserve le passif singulier impersonnel et laisse implicites aussi bien l’auteur du pardon que son objet.
theological_decisions:
- issue: Valeur de but ou de résultat de la citation et possibilité que les paraboles empêchent le retour
  choice: Conserver « afin que… de peur que »
  alternative: Employer une formulation purement descriptive telle que « si bien que… autrement »
  rationale: Le grec maintient une tension difficile entre jugement divin et absence de réponse humaine. La traduction ne la résout ni dans un sens déterministe ni dans un sens seulement descriptif.
- issue: Portée de ἐπιστρέψωσιν
  choice: Traduire par « reviennent » et signaler en note la nuance possible de conversion ou de repentance
  alternative: Traduire directement par « se repentent »
  rationale: Dans le contexte prophétique, le verbe peut avoir une portée spirituelle, mais son image lexicale demeure plus large que le terme explicite « se repentir ».
- issue: Passif de ἀφεθῇ
  choice: Conserver la formulation impersonnelle « qu’il ne leur soit pardonné »
  alternative: Expliciter « et que Dieu ne leur pardonne » ou « et que le pardon ne leur soit accordé »
  rationale: La formulation retenue respecte le passif divin implicite et n’ajoute ni sujet ni objet absents du grec.
translation_notes:
  register: Français international moderne, digne et volontairement marqué par les répétitions paradoxales de l’original. Le rythme parallèle des deux propositions est conservé, ainsi que la tournure solennelle « de peur que… ne ».
