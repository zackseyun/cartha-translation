source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν αὐτοὺς ἐν παραβολαῖς πολλά καὶ ἔλεγεν αὐτοῖς ἐν τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: fr
  text: 'Et il leur enseignait beaucoup de choses en paraboles[a]. Et, dans son enseignement, il leur disait :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il leur enseignait beaucoup en paraboles ». Le grec πολλά peut se traduire par « beaucoup de choses » ou, de façon plus concise, par « beaucoup ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: il leur enseignait
  rationale: L’imparfait grec présente l’enseignement comme une action en cours dans la scène; l’imparfait français en conserve naturellement l’aspect.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: Cette formulation naturelle rend ἐν avec le datif comme le moyen ou la manière d’enseigner et conserve l’expression grecque.
- source_word: πολλά
  choice: beaucoup de choses
  rationale: Le neutre pluriel peut désigner l’étendue du contenu enseigné; « beaucoup de choses » est clair et idiomatique en français.
- source_word: ἔλεγεν
  choice: il leur disait
  rationale: L’imparfait marque une parole en cours et introduit naturellement le discours direct qui suit au verset suivant.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Dans son enseignement
  rationale: Cette traduction conserve le substantif διδαχή et son lien avec les paroles qui suivent, sans réduire l’expression à une simple indication temporelle.
- source_word: καὶ
  choice: Et
  rationale: La conjonction initiale maintient la continuité narrative et le style paratactique caractéristique de Marc.
- source_word: αὐτοὺς / αὐτοῖς
  choice: leur / leur
  rationale: 'En français, les deux constructions se rendent idiomatiquement avec le pronom indirect « leur » : « enseigner quelque chose à quelqu’un » et « dire à quelqu’un ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les deux imparfaits préservent le déroulement de la scène. La répétition littérale de « et » avant ἔλεγεν est allégée par une nouvelle phrase afin d’éviter une tournure française pesante, tout en conservant le lien explicite avec « son enseignement ».
