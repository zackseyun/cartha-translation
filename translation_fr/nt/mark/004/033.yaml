  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: fr
  text: Il leur annonçait la parole[a] par de nombreuses paraboles de ce genre, selon ce qu’ils étaient capables d’entendre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message » ou « l’enseignement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « autant qu’ils pouvaient l’entendre » ou « selon leur capacité à l’entendre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: de ce genre
  rationale: Renvoie aux paraboles qui précèdent et conserve naturellement en français la valeur comparative du démonstratif.
- source_word: παραβολαῖς
  choice: paraboles
  rationale: Terme français usuel et précis pour ce mode d’enseignement de Jésus.
- source_word: πολλαῖς
  choice: beaucoup de
  rationale: Restitue simplement la quantité tout en s’intégrant à la tournure française « par beaucoup de paraboles ».
- source_word: ἐλάλει
  choice: annonçait
  rationale: L’imparfait exprime une action en cours ou répétée. « Annonçait » convient à la communication de la Parole, sans supposer ici une simple conversation.
- source_word: αὐτοῖς
  choice: leur
  rationale: Rend naturellement en français le complément indirect de λαλέω.
- source_word: τὸν λόγον
  choice: la Parole
  rationale: Préserve l’expression grecque et sa résonance dans Marc, tout en laissant la note signaler les sens contextuels « message » et « enseignement ».
- source_word: καθὼς
  choice: dans la mesure où
  rationale: Exprime clairement le rapport de proportion ou de capacité présent dans la proposition grecque.
- source_word: ἠδύναντο
  choice: ils étaient capables
  rationale: L’imparfait maintient l’aspect continu de leur capacité.
- source_word: ἀκούειν
  choice: de l’entendre
  rationale: Conserve le sens premier d’ἀκούω sans expliciter indûment « comprendre »; le pronom renvoie à la Parole.
theological_decisions:
- issue: Sens de τὸν λόγον dans le ministère d’enseignement de Jésus
  choice: la Parole
  alternative: le message; l’enseignement
  rationale: « La Parole » conserve la formulation grecque et l’idiome biblique sans imposer un sens doctrinal plus étroit; les autres sens contextuels restent possibles et sont indiqués en note.
- issue: Portée de ἀκούειν
  choice: l’entendre
  alternative: la comprendre; la recevoir
  rationale: Le grec parle de la capacité d’entendre. Le contexte peut inclure la compréhension ou l’accueil, mais la traduction ne résout pas cette tension à la place du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proportionnelle explicite le lien syntaxique sans transformer « entendre » en « comprendre ». La majuscule à « Parole » signale l’emploi biblique établi, sans en faire ici un titre personnel.
