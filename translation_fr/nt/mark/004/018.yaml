  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: fr
  text: 'Et d’autres sont semés parmi les épines[a] : ce sont ceux qui ont entendu la parole[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les épines ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le message ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: d’autres
  rationale: L’adjectif substantivé distingue ce groupe des précédents. « D’autres » est naturel en français et maintient ce contraste.
- source_word: εἰς τὰς ἀκάνθας
  choice: parmi les épines
  rationale: Même si εἰς peut formellement signifier « dans », le contexte agricole et la formulation française de la métaphore favorisent « parmi les épines » ; l’alternative plus littérale est signalée en note.
- source_word: ἀκάνθας
  choice: épines
  rationale: « Épines » est le terme courant et concret qui convient au contexte de la parabole.
- source_word: σπειρόμενοι
  choice: ont été semés
  rationale: Cette forme passive conserve l’identification métaphorique des personnes avec la semence tout en donnant une phrase française naturelle.
- source_word: οὗτοί εἰσιν
  choice: ce sont
  rationale: Cette tournure reprend et précise naturellement en français l’identité du groupe évoqué.
- source_word: οἱ ... ἀκούσαντες
  choice: ceux qui ont entendu
  rationale: Le participe aoriste présente l’écoute comme accomplie avant les événements décrits ensuite ; le passé composé le rend clairement en français.
- source_word: τὸν λόγον
  choice: la parole
  rationale: Dans le contexte de Marc, λόγος désigne ce qui est proclamé. « La parole » préserve l’expression biblique et ses résonances, tandis que « le message » demeure une traduction possible.
theological_decisions:
- issue: Identification métaphorique des personnes à la semence dans l’explication de la parabole
  choice: 'Conserver la métaphore : « ceux qui ont été semés parmi les épines »'
  alternative: ceux qui ont été semés dans un sol couvert d’épines
  rationale: Le grec poursuit explicitement la métaphore de la semence sans la convertir en explication non métaphorique. La conserver respecte la structure littéraire et l’ambiguïté imagée du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation maintient le lien avec la suite de la phrase au verset suivant. Le passif composé restitue la métaphore grecque sans lourdeur excessive.
