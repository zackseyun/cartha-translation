  text: καὶ εἶπεν αὐτοῖς· Τί δειλοί ἐστε; ⸀οὔπω ἔχετε πίστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: fr
  text: 'Puis il leur dit : « Pourquoi êtes-vous si craintifs ? N’avez-vous toujours pas de foi[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’avez-vous toujours pas confiance ? » Le mot grec peut désigner ici la confiance aussi bien que la foi.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Puis
  rationale: Dans le récit, καί relie cette parole à l’action précédente. « Puis » rend naturellement cette progression en français sans alourdir la phrase.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Formulation narrative française courante et transparente pour introduire le discours direct.
- source_word: Τί
  choice: Pourquoi
  rationale: 'Avec l’adjectif et le verbe « être », τί a ici une valeur interrogative causale : Jésus demande pourquoi ils sont dans cet état.'
- source_word: δειλοί
  choice: si craintifs
  rationale: δειλός exprime une peur blâmable et peut aller jusqu’à « lâche ». « Craintifs » conserve la force de la réprimande sans transformer nécessairement celle-ci en jugement global sur leur caractère; « si » rend son intensité idiomatique dans la question française.
- source_word: οὔπω
  choice: toujours pas
  rationale: οὔπω signifie littéralement « pas encore ». Dans cette question de reproche, « toujours pas » exprime naturellement en français que, malgré ce qui s’est passé, la foi fait encore défaut.
- source_word: ἔχετε πίστιν
  choice: avez-vous … de foi
  rationale: Le verbe ἔχω indique ici la possession ou l’état, et πίστις est rendu par le terme théologique et courant « foi », tout en laissant entendre la confiance dans le contexte.
theological_decisions:
- issue: Sens de πίστις dans un contexte où la confiance est particulièrement en vue
  choice: foi
  alternative: confiance
  rationale: « Foi » préserve le terme grec dans toute son amplitude et le vocabulaire biblique français courant. Dans la tempête, « confiance » explicite bien la nuance contextuelle, mais le grec ne nomme pas explicitement l’objet de cette confiance; cette nuance est donc signalée en note.
- issue: Force morale de δειλοί
  choice: craintifs
  alternative: lâches
  rationale: Le mot peut désigner une peur coupable et recevoir le sens plus fort de « lâches ». Le contexte porte directement sur la peur des disciples; « craintifs » garde la réprimande ouverte sans imposer le sens maximal.
translation_notes:
  register: Français international moderne, naturel et digne. La structure interrogative conserve la vigueur du reproche. « Toujours pas » est idiomatique en français et transmet la portée temporelle et rhétorique de οὔπω. Une seule note regroupe l’alternative contextuelle pertinente pour πίστις; son marqueur [a] figure dans le texte principal.
