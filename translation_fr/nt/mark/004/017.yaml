id: MRK.4.17
reference: Mark 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: fr
  text: et ils n’ont pas de racine en eux-mêmes, mais ils ne tiennent qu’un temps. Ensuite, quand survient la détresse ou la persécution à cause de la parole, ils se détournent aussitôt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trébuchent » ou « tombent ». Le verbe grec peut aussi évoquer le fait d’être scandalisé ou de trébucher.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: racine
  rationale: Conserve la métaphore agricole de la semence et des terrains sans ajouter les notions de profondeur ou de fermeté, absentes du grec.
- source_word: ἐν ἑαυτοῖς
  choice: en eux-mêmes
  rationale: Rend directement le pronom réfléchi tout en restant naturel en français moderne.
- source_word: πρόσκαιροί εἰσιν
  choice: ils ne tiennent qu’un temps
  rationale: Exprime naturellement l’idée d’une durée limitée appliquée à des personnes. « Ils sont temporaires » serait plus formellement proche, mais peu idiomatique en français.
- source_word: εἶτα
  choice: ensuite
  rationale: Marque clairement la succession des événements dans le développement de la parabole.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: quand survient la détresse ou la persécution
  rationale: Rend le génitif absolu par une proposition temporelle. « Détresse » conserve l’idée de pression et d’épreuve portée par θλῖψις, tandis que « persécution » correspond précisément à διωγμός.
- source_word: διὰ τὸν λόγον
  choice: à cause de la parole
  rationale: Préserve le terme récurrent de la parabole et indique que la détresse ou la persécution est provoquée par la parole reçue.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Conserve l’urgence caractéristique du récit de Marc dans une formulation française courante.
- source_word: σκανδαλίζονται
  choice: ils se détournent
  rationale: Dans ce contexte, le verbe décrit l’abandon qui suit une réception passagère de la parole. Cette formulation en exprime la gravité sans préciser davantage l’état spirituel final des personnes.
theological_decisions:
- issue: Sens de σκανδαλίζονται dans un contexte de réception passagère de la parole
  choice: ils se détournent
  alternative: ils trébuchent ; ils tombent ; ils sont amenés à chuter ; ils sont scandalisés
  rationale: 'Le contexte indique plus qu’une simple réaction de contrariété : sous la pression, ces personnes cessent de persévérer. « Se détournent » rend ce mouvement d’abandon sans trancher la question théologique de leur état final.'
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la racine et le terme « parole » sont conservés; les tournures moins idiomatiques comme « ils sont temporaires » sont évitées.
