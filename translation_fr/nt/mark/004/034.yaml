id: MRK.4.34
reference: Mark 4:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: fr
  text: Il ne leur parlait pas sans parabole, mais, en privé, il expliquait tout à ses propres disciples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il interprétait tout » ou « il éclaircissait tout ». Le verbe grec peut signifier expliquer, interpréter ou élucider.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: sans parabole
  rationale: Cette formulation naturelle conserve le singulier concret du grec et exprime le moyen habituel employé par Jésus pour parler à la foule.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: il ne leur parlait pas
  rationale: L’imparfait « parlait » rend la valeur habituelle ou répétée de l’imparfait grec dans ce résumé narratif.
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: Cette expression française courante rend l’idée d’un enseignement donné à l’écart, par contraste avec la parole publique en paraboles.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: à ses propres disciples
  rationale: « propres » préserve l’insistance possessive de ἰδίοις, au-delà du simple « à ses disciples ».
- source_word: ἐπέλυεν
  choice: il expliquait
  rationale: Le verbe peut signifier expliquer, interpréter ou élucider; « expliquait » est clair, naturel et conserve l’aspect imperfectif.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a ici une portée globale. « Tout » la conserve sans préciser au-delà du texte ce qui était expliqué.
theological_decisions:
- issue: Étendue des explications privées de Jésus
  choice: tout
  alternative: toutes les paraboles / tout ce qu’il avait dit
  rationale: Le grec dit simplement πάντα. Le contexte peut viser les paraboles ou l’enseignement donné, mais la traduction ne doit pas restreindre explicitement cette portée.
translation_notes:
  register: Français international moderne, simple et digne. La structure contrastive du grec est conservée sans lourdeur. Le marqueur de note est placé après la proposition concernée.
