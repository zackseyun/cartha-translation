  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: fr
  text: 'Voici ceux qui sont au bord du chemin, là où la parole est semée : quand ils l’entendent, Satan vient aussitôt enlever la parole semée en eux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent une formulation différente à la place de « en eux ».
    reason: 'Variante textuelle : εἰς αὐτούς est placé entre crochets dans l’édition SBLGNT.'
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδόν
  choice: Voici ceux qui sont au bord du chemin
  rationale: « Voici ceux » introduit naturellement en français l’identification des personnes représentées dans la parabole. « Au bord du chemin » rend la position exprimée par παρά avec l’accusatif et conserve l’image agricole.
- source_word: ὅπου σπείρεται ὁ λόγος
  choice: là où la parole est semée
  rationale: La tournure locative est conservée. « Parole » maintient la répétition de λόγος et sa résonance biblique, tandis que le passif « est semée » reflète le grec.
- source_word: ὅταν ἀκούσωσιν
  choice: quand ils l’entendent
  rationale: ὅταν avec le subjonctif aoriste exprime ici une situation générale. Le pronom « l’ » reprend naturellement « la parole » sans ajouter de contenu.
- source_word: εὐθὺς ἔρχεται ὁ Σατανᾶς
  choice: Satan vient aussitôt
  rationale: « Aussitôt » garde l’immédiateté caractéristique de εὐθύς, et « Satan » rend directement le nom ou titre personnel ὁ Σατανᾶς.
- source_word: αἴρει τὸν λόγον
  choice: enlever la parole
  rationale: αἴρω signifie ici retirer ou emporter. « Enlever » reste précis sans renforcer indûment l’idée en choisissant « arracher ».
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: la parole semée en eux
  rationale: Le participe parfait passif qualifie « la parole » comme ayant été semée. « En eux » exprime naturellement l’intériorité possible de εἰς αὐτούς, tout en signalant en note l’autre nuance spatiale envisageable.
theological_decisions:
- issue: L’action personnelle de Satan dans l’explication de la parabole
  choice: Présenter Satan comme celui qui vient enlever la parole
  alternative: Employer une désignation impersonnelle telle que « l’adversité » ou réduire l’action à une abstraction
  rationale: Le grec nomme ὁ Σατανᾶς comme agent personnel. La traduction conserve cette présentation sans la démythologiser ni ajouter d’explication doctrinale.
- issue: Le lieu ou la sphère où la parole est semée
  choice: « en eux » dans le texte
  alternative: « parmi eux »
  rationale: εἰς αὐτούς peut suggérer que la parole pénètre en eux, ce qui convient au portrait d’auditeurs. Cependant, la préposition permet une nuance relationnelle ou collective que la note préserve.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’image du semeur, la répétition de « parole » et l’urgence de « aussitôt », tout en évitant une syntaxe inutilement calquée sur le grec.
