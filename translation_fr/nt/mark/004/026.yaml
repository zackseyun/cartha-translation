revisions:
- from: 'Il disait encore : « Le royaume de Dieu est ainsi : c’est comme lorsqu’un homme jette la semence sur le sol[a] ;'
  to: 'Et il disait : « Il en est du royaume de Dieu comme lorsqu’un homme jette la semence sur le sol[a] ;'
  rationale: La révision retire l’ajout interprétatif « encore », allège la construction comparative tout en préservant la valeur conjointe de Οὕτως et ὡς, et corrige la note afin qu’elle ne remplace pas « sol » par « champ ». La phrase demeure volontairement inachevée, conformément à la continuité avec le verset 27.
