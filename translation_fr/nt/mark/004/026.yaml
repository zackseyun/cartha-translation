  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: fr
  text: 'Et il disait : « Il en est du royaume de Dieu comme lorsqu’un homme jette la semence sur le sol[a] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Le royaume de Dieu est comme si un homme semait de la semence sur le sol. » Le grec exprime la comparaison de façon condensée, et celle-ci se poursuit au verset suivant.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: Il disait encore
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme une parole répétée; « encore » rend naturellement la valeur de liaison de καί dans la suite du discours.
- source_word: Οὕτως ἐστὶν
  choice: est ainsi
  rationale: Cette formulation actuelle introduit la manière dont le royaume de Dieu peut être comparé à la scène qui suit.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: « Royaume de Dieu » est l’expression française reconnue et conserve la possibilité de désigner à la fois la souveraineté exercée par Dieu et le domaine où elle se manifeste.
- source_word: ὡς ἄνθρωπος
  choice: c’est comme lorsqu’un homme
  rationale: La tournure explicite la comparaison grecque comprimée sans en achever artificiellement le développement, qui se poursuit au verset suivant. « Un homme » conserve la figure masculine singulière du texte.
- source_word: βάλῃ
  choice: jette
  rationale: Le verbe βάλλω signifie littéralement « jeter »; dans ce contexte agricole, l’action correspond à semer, mais « jette » préserve l’image concrète du geste.
- source_word: τὸν σπόρον
  choice: la semence
  rationale: Le singulier avec article est rendu naturellement par « la semence », employé ici dans un sens générique.
- source_word: ἐπὶ τῆς γῆς
  choice: sur le sol
  rationale: Dans la scène agricole, γῆ désigne le terrain cultivé plutôt que la terre au sens cosmique; « sur le sol » rend aussi directement la préposition ἐπί.
theological_decisions:
- issue: Forme de la comparaison sur le royaume de Dieu, dont le développement se poursuit au verset 27
  choice: 'Conserver une comparaison ouverte : « est ainsi : c’est comme lorsqu’un homme… »'
  alternative: « Il en est du royaume de Dieu comme d’un homme qui sème… »
  rationale: Le grec associe Οὕτως et ὡς dans une construction condensée. La formulation retenue garde les deux éléments et laisse la scène se développer au verset suivant, sans réduire le royaume à l’homme lui-même ni ajouter une explication théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation finale demeure ouverte par un point-virgule, car la phrase et la comparaison se poursuivent au verset suivant.
