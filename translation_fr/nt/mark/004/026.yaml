review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement l’imparfait ἔλεγεν, « royaume de Dieu », l’image concrète de βάλλῃ (« jette »), « la semence » et le cadre agricole de γῆ. Toutefois, « encore » ajoute l’idée de répétition (« de nouveau »), que καί ne porte pas nécessairement. La double construction « est ainsi : c’est comme lorsqu’ » est plus lourde que ne l’exige le grec.'
  naturalness: « Il en est du royaume de Dieu comme lorsqu’un homme… » est une formulation française moderne, naturelle et suffisamment ouverte pour laisser la comparaison se poursuivre au verset suivant. Le point-virgule conserve correctement la continuité syntaxique avec le verset 27.
  terminology: « Royaume de Dieu », « semence » et « sol » conviennent au registre biblique moderne international. « Un homme » reproduit sans surcharge la figure représentative masculine du grec.
  issues:
  - severity: medium
    issue: Ajout de « encore »
    rationale: Καί est une conjonction de liaison (« et ») et ne signifie pas en soi « encore ». Dans ce contexte, l’ajout peut suggérer que Jésus reprend ou répète le même propos, nuance non explicitement exprimée par le texte.
  - severity: low
    issue: Comparaison française redoublée
    rationale: '« Le royaume de Dieu est ainsi : c’est comme lorsqu’… » traduit formellement les deux éléments Οὕτως…ὡς, mais produit une redondance peu idiomatique. La tournure « Il en est du royaume de Dieu comme lorsqu’… » conserve la comparaison comprimée sans en résoudre l’ouverture.'
  - severity: medium
    issue: Alternative de note imprécise
    rationale: « dans un champ » est plus spécifique que ἐπὶ τῆς γῆς (« sur le sol/la terre ») et ne devrait pas être présenté comme une simple autre traduction. La note doit aussi éviter de modifier gratuitement l’image de « jeter » sans l’indiquer comme adaptation agricole.
  revised_text: 'Et il disait : « Il en est du royaume de Dieu comme lorsqu’un homme jette la semence sur le sol[a] ;'
  revised_footnotes:
  - marker: a
    text: 'Autre traduction : « Le royaume de Dieu est comme si un homme semait de la semence sur le sol. » Le grec exprime la comparaison de façon condensée, et celle-ci se poursuit au verset suivant.'
    reason: alternative_reading
