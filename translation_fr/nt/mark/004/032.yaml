id: MRK.4.32
reference: Mark 4:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: fr
  text: et, lorsqu’elle est semée, elle pousse et devient plus grande que toutes les plantes du jardin. Elle produit de grandes branches, si bien que les oiseaux du ciel[a] peuvent s’installer[b] sous son ombre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les oiseaux de l’air ».
    reason: lexical_alternative
  - marker: b
    text: Ou « demeurer » ou « faire leur nid ». Cette formulation peut faire écho aux images de l’Ancien Testament où des oiseaux trouvent refuge dans un grand arbre, par exemple en Ézéchiel 17.23 et Daniel 4.12.
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: elle est semée
  rationale: L’aoriste passif après ὅταν exprime ici une circonstance temporelle indéfinie. « Est semée » conserve le vocabulaire de la semence employé dans la parabole.
- source_word: ἀναβαίνει
  choice: elle pousse
  rationale: Dans ce contexte agricole, le verbe décrit la plante qui sort de terre et grandit. « Pousse » est naturel en français moderne sans alourdir la phrase.
- source_word: γίνεται
  choice: devient
  rationale: Le verbe marque l’état auquel la plante parvient au cours de sa croissance.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: plus grande que toutes les plantes du jardin
  rationale: Le comparatif grec est rendu directement. λάχανα désigne ici des plantes cultivées ou herbacées du jardin, et non nécessairement des légumes au sens français moderne.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: Elle produit de grandes branches
  rationale: « Produire des branches » exprime naturellement en français le développement décrit par ποιεῖ, tout en conservant l’ampleur indiquée par μεγάλους.
- source_word: ὥστε δύνασθαι
  choice: si bien que … peuvent
  rationale: Cette formulation française rend la conséquence exprimée par ὥστε avec l’infinitif et la capacité marquée par δύνασθαι.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: sous son ombre
  rationale: « Sous son ombre » est une expression française naturelle qui conserve l’image spatiale et protectrice du grec.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: La formulation reste proche du grec, sonne naturellement dans un registre biblique actuel et préserve les possibles échos scripturaires.
- source_word: κατασκηνοῦν
  choice: s’installer
  rationale: Le verbe peut signifier demeurer, séjourner ou établir son gîte. « S’installer » convient aux oiseaux sans imposer le sens plus précis de « nicher ».
theological_decisions:
- issue: Évocation des oiseaux trouvant refuge dans les branches d’un grand arbre
  choice: Conserver simplement l’image dans le texte et signaler son possible arrière-plan dans une note.
  alternative: Employer « demeurer » de manière plus littérale afin de rendre plus perceptible l’écho aux images d’Ézéchiel 17.23 et de Daniel 4.12.
  rationale: Le grec peut évoquer les images vétérotestamentaires d’un grand arbre abritant des oiseaux, mais il n’en donne pas ici l’interprétation. La traduction préserve donc l’image et son ouverture théologique sans identifier explicitement les oiseaux à un groupe particulier.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le « et » initial du grec, puisque le verset poursuit directement la description commencée au verset précédent. Le féminin « elle » reprend naturellement la semence ou graine évoquée dans le contexte.
