  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: fr
  text: mais les préoccupations du temps présent[a], la séduction des richesses[b] et les désirs pour d’autres choses s’introduisent et étouffent la parole, qui devient stérile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les préoccupations de ce monde ». Le mot grec désigne un âge ou une époque et, par extension, l’ordre actuel du monde.
    reason: lexical_alternative
  - marker: b
    text: Ou « la tromperie de la richesse ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et elle devient stérile ». On peut aussi comprendre que l’auditeur ou la semence ne porte pas de fruit ; « la parole » est toutefois l’antécédent singulier explicite le plus proche.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: préoccupations
  rationale: Le terme peut désigner des soucis ou des inquiétudes. « Préoccupations » convient au contexte et évite de réduire le sens à un état psychologique intense.
- source_word: τοῦ αἰῶνος
  choice: du temps présent
  rationale: αἰών désigne fondamentalement un âge ou une époque et, par extension, l’ordre actuel du monde. « Du temps présent » conserve ici la nuance temporelle en français naturel.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: la séduction des richesses
  rationale: ἀπάτη exprime le caractère trompeur de la richesse. « Séduction » rend naturellement sa puissance d’illusion dans ce contexte, tandis que le pluriel « richesses » désigne les biens matériels de façon idiomatique.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: les désirs de toutes les autres choses
  rationale: La formulation garde la vaste portée de λοιπά et indique que les désirs se portent sur tout ce qui concurrence la parole.
- source_word: εἰσπορευόμεναι
  choice: s’introduisent
  rationale: Le participe évoque des influences qui entrent dans le cœur ou le terrain. Sa coordination sous forme de verbe conjugué produit une phrase française naturelle tout en pouvant porter sur les trois éléments de l’énumération.
- source_word: συμπνίγουσιν
  choice: étouffent
  rationale: Le verbe décrit une suffocation et prolonge directement l’image végétale de la parabole.
- source_word: τὸν λόγον
  choice: la parole
  rationale: « La parole » conserve l’expression biblique habituelle et désigne ici le message proclamé.
- source_word: ἄκαρπος γίνεται
  choice: devient stérile
  rationale: Cette expression suit le sens résultatif du grec et maintient l’image d’une parole-semence qui ne produit pas de fruit.
theological_decisions:
- issue: Référent du verbe et de l’adjectif finaux au singulier
  choice: La proposition relative « qui devient stérile » renvoie à « la parole ».
  alternative: Comprendre que l’auditeur ou la semence devient stérile, ou traduire de manière plus interprétative par « de sorte qu’elle ne porte aucun fruit ».
  rationale: Le plus proche antécédent singulier explicite est τὸν λόγον. Ce choix respecte donc la syntaxe tout en préservant la métaphore de la parole semée, sans introduire l’auditeur comme sujet non exprimé.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination verbale « s’introduisent et étouffent » clarifie que les trois influences énumérées peuvent être le sujet du participe grec, tandis que « qui devient stérile » évite une succession pesante de propositions coordonnées.
