  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: fr
  text: Pendant qu’il semait, une partie de la semence tomba le long du chemin, et les oiseaux vinrent la dévorer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Pendant qu’il semait
  rationale: La tournure narrative ἐγένετο ἐν suivie de l’infinitif articulé situe l’événement pendant l’action. Cette formulation française naturelle conserve la valeur temporelle sans rendre littéralement « il arriva ».
- source_word: ὃ μὲν
  choice: une partie de la semence
  rationale: Le relatif neutre avec μέν a ici un sens distributif et renvoie à ce qui est semé. Cette explicitation évite l’ambiguïté possible de « une partie tomba » tout en préparant les autres portions de la parabole.
- source_word: ἔπεσεν
  choice: tomba
  rationale: Équivalent direct et naturel de πίπτω dans ce contexte.
- source_word: παρὰ τὴν ὁδόν
  choice: le long du chemin
  rationale: παρά avec l’accusatif indique ici la proximité ou la position en bordure. « Chemin » convient mieux que « route » à la scène agricole, et « le long de » préserve la portée spatiale sans préciser indûment si la semence tombe sur le chemin ou strictement à côté.
- source_word: τὰ πετεινὰ
  choice: les oiseaux
  rationale: πετεινά désigne simplement les oiseaux; le grec de ce vers n’ajoute ni « du ciel » ni « de l’air ».
- source_word: κατέφαγεν
  choice: dévorer
  rationale: Le composé κατεσθίω exprime le fait de manger entièrement ou avec intensité; « dévorer » en garde la force en français.
- source_word: αὐτό
  choice: la
  rationale: Le pronom singulier reprend la semence envisagée collectivement; en français, le pronom féminin singulier s’accorde naturellement avec « semence ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif reste simple, tandis que « semence » maintient le référent collectif au singulier et correspond au contexte de la parabole.
