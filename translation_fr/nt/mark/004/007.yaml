source:
  edition: SBLGNT
  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: fr
  text: Une autre graine tomba parmi les ronces[a] ; les ronces poussèrent, l’étouffèrent, et elle ne produisit aucun fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les ronces ». Le grec dit littéralement « dans ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Une autre partie
  rationale: Le neutre singulier renvoie elliptiquement à une autre partie de ce qui est semé dans le contexte immédiat. « Une autre partie » rend ce lien naturellement sans répéter explicitement « semence ».
- source_word: ἔπεσεν
  choice: tomba
  rationale: Rend directement l’aoriste de πίπτω sans introduire l’idée interprétative de « fut semée ».
- source_word: εἰς τὰς ἀκάνθας
  choice: parmi les ronces
  rationale: Même si εἰς exprime littéralement un mouvement « dans », « parmi les ronces » est idiomatique en français et décrit naturellement l’endroit où tombe la semence.
- source_word: ἀνέβησαν
  choice: poussèrent
  rationale: Dans le contexte végétal, « pousser » exprime naturellement la montée et la croissance des ronces.
- source_word: συνέπνιξαν
  choice: l’étouffèrent
  rationale: Préserve l’image vive de plantes qui empêchent la semence de se développer.
- source_word: αὐτό
  choice: l’
  rationale: Le pronom singulier reprend la partie de semence évoquée au début du verset.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: elle ne produisit aucun fruit
  rationale: Formulation agricole naturelle qui reste proche du sens littéral « ne donna pas de fruit ».
