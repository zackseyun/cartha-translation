  naturalness: « Il vous sera mesuré avec la mesure dont vous vous servez » est une formulation française claire, solennelle sans archaïsme, et plus naturelle que « servira aussi à mesurer pour vous ». « Il vous sera ajouté encore » respecte l’ellipse grecque, mais l’ordre « on vous ajoutera encore » serait moins fidèle puisqu’il impose une tournure active impersonnelle et demeure moins idiomatique avec un objet implicite.
  terminology: Le vocabulaire de la mesure est maintenu. « Faites attention à ce que vous entendez » est moderne et fidèle, sans harmoniser le texte avec Luc 8.18. La note présente la compréhension accrue comme une possibilité contextuelle, non comme une interprétation exclusive.
