  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: fr
  text: 'Il leur disait : « Faites attention à ce que vous entendez. Il vous sera mesuré avec la mesure dont vous vous servez, et il vous sera ajouté encore[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, cet ajout peut désigner une compréhension accrue accordée à ceux qui accueillent l’enseignement de Jésus ; la formulation grecque ne précise toutefois pas explicitement ce qui est ajouté.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il leur disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée; l’imparfait français en conserve naturellement l’aspect.
- source_word: Βλέπετε
  choice: Faites attention
  rationale: Dans cet emploi, le verbe ne commande pas simplement de regarder, mais invite à une attention vigilante.
- source_word: τί ἀκούετε
  choice: à ce que vous entendez
  rationale: τί signifie ici « ce que », et non « comment »; cette formulation respecte donc la différence avec Luc 8.18 sans harmonisation.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: La mesure dont vous vous servez
  rationale: La formulation française rend de façon naturelle l’instrument ou le critère de mesure tout en maintenant la métaphore.
- source_word: μετρηθήσεται ὑμῖν
  choice: servira aussi à mesurer pour vous
  rationale: Cette tournure conserve le futur passif et l’idée de réciprocité sans ajouter explicitement l’idée d’un retour, absente du grec.
- source_word: καὶ προστεθήσεται ὑμῖν
  choice: et l’on ajoutera encore pour vous
  rationale: Le verbe signifie « ajouter ». « Encore » exprime l’accroissement impliqué, tandis que la tournure impersonnelle rend naturellement le passif grec sans préciser l’agent.
theological_decisions:
- issue: Portée du principe de réciprocité
  choice: Conserver la métaphore générale dans le contexte de l’écoute de l’enseignement de Jésus
  alternative: Préciser qu’il s’agit exclusivement du jugement, de la générosité ou de l’accroissement de la compréhension spirituelle
  rationale: Le contexte met en avant l’écoute et la réception de la parole, mais la phrase elle-même ne définit pas étroitement ce qui sera mesuré ou ajouté. La traduction préserve cette ouverture.
- issue: Agent des verbes passifs
  choice: Employer une tournure impersonnelle
  alternative: Nommer Dieu comme celui qui mesure et ajoute
  rationale: Dieu peut être sous-entendu, mais le texte grec ne nomme pas l’agent; il ne convient donc pas de l’expliciter dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La répétition du champ lexical de la mesure est maintenue, tandis que les passifs grecs sont rendus par des tournures impersonnelles naturelles. La formulation évite d’harmoniser Marc avec Luc 8.18 et ne tranche pas l’identité de l’agent ni la nature exacte de ce qui est ajouté.
