reference: Mark 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: fr
  text: Un frère livrera[a] son frère à la mort, et un père son enfant ; des enfants se dresseront contre leurs parents et les mettront à mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trahira » ; le verbe grec peut signifier « livrer », « remettre » ou, selon le contexte, « trahir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les tueront ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: livrera
  rationale: « Livrer » conserve le sens concret de remettre quelqu’un au pouvoir d’autrui, ici en vue de sa mort, sans imposer partout la nuance plus interprétative de « trahir ».
- source_word: ἀδελφὸς ἀδελφὸν
  choice: un frère livrera son frère
  rationale: Cette formulation garde les termes masculins précis et la répétition saisissante du grec, tout en étant naturelle en français.
- source_word: εἰς θάνατον
  choice: pour qu’il soit mis à mort
  rationale: Cette tournure française exprime naturellement l’issue visée par la remise de la personne, là où le calque « à la mort » serait peu idiomatique.
- source_word: πατὴρ τέκνον
  choice: un père livrera son enfant
  rationale: « Père » respecte le terme masculin πατήρ, tandis qu’« enfant » rend la portée non spécifiée de τέκνον. La répétition de « livrera » explicite en français le verbe sous-entendu dans la deuxième proposition grecque.
- source_word: ἐπαναστήσονται
  choice: se dresseront contre
  rationale: Cette expression préserve l’image vive d’un soulèvement hostile et le complément « contre » du grec.
- source_word: γονεῖς
  choice: parents
  rationale: « Parents » est l’équivalent direct et courant du pluriel γονεῖς.
- source_word: θανατώσουσιν αὐτούς
  choice: les mettront à mort
  rationale: Cette formulation conserve la force causative ou exécutoire du verbe θανατόω et convient au contexte de persécution.
theological_decisions:
- issue: Termes familiaux genrés dans un énoncé représentatif
  choice: Conserver « frère » et « père », tout en traduisant τέκνον et γονεῖς par « enfant » et « parents ».
  alternative: Neutraliser les premières expressions par « membre d’une fratrie » ou « parent ».
  rationale: Le grec emploie ici les formes masculines spécifiques ἀδελφός et πατήρ, mais des termes plus larges pour l’enfant et les parents. La traduction maintient cette distinction sans ajouter de précision doctrinale.
- issue: Responsabilité des enfants dans la mort de leurs parents
  choice: « les mettront à mort »
  alternative: « provoqueront leur mort » ou « les feront mettre à mort »
  rationale: Le verbe grec affirme leur rôle dans la mise à mort sans préciser s’ils exécutent eux-mêmes leurs parents ou obtiennent leur condamnation. La formulation retenue préserve cette tension.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la progression sévère des ruptures familiales. Le verbe sous-entendu après « un père » est répété afin d’éviter une ellipse raide ou ambiguë en français.
