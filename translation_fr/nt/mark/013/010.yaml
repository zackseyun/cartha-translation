id: MRK.13.10
reference: Mark 13:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: fr
  text: Et il faut d’abord que la bonne nouvelle soit proclamée à toutes les nations[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Évangile ». Le grec εὐαγγέλιον signifie littéralement « bonne nouvelle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi toutes les nations »; selon le contexte, le mot grec traduit par « nations » peut aussi désigner les non-Juifs.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction poursuit naturellement le discours sans lui imposer une nuance adversative.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: à toutes les nations
  rationale: Avec κηρυχθῆναι, εἰς peut indiquer la direction ou l’étendue de la proclamation. « À toutes les nations » conserve ici la portée universelle tout en évitant de restreindre ἔθνη aux seuls non-Juifs.
- source_word: πρῶτον
  choice: d’abord
  rationale: Le terme marque une priorité temporelle. « D’abord » est naturel en français et préserve l’idée de succession sans préciser davantage la chronologie.
- source_word: δεῖ
  choice: il faut
  rationale: Cette tournure exprime nettement la nécessité, possiblement divine ou eschatologique dans le contexte, sans en expliciter la source au-delà du texte.
- source_word: κηρυχθῆναι
  choice: soit proclamée
  rationale: L’infinitif aoriste passif de κηρύσσω désigne une annonce publique. « Proclamée » rend cette dimension avec dignité et clarté.
- source_word: τὸ εὐαγγέλιον
  choice: la bonne nouvelle
  rationale: « Bonne nouvelle » transmet directement le sens de εὐαγγέλιον dans un français moderne et accessible; « l’Évangile » demeure indiqué en note comme équivalent traditionnel.
theological_decisions:
- issue: Portée de ἔθνη
  choice: toutes les nations
  alternative: tous les non-Juifs
  rationale: Le contexte soutient une portée mondiale, mais ἔθνη peut aussi désigner les non-Juifs. Le texte principal préserve l’ampleur ethnonationale sans introduire un contraste Juifs/non-Juifs qui n’est pas explicite dans ce verset.
- issue: Force de δεῖ
  choice: il faut
  alternative: il est nécessaire
  rationale: « Il faut » conserve la nécessité exprimée par le grec sans préciser explicitement qu’elle relève d’un dessein divin, même si cette nuance peut être présente dans Marc.
translation_notes:
  register: Français international moderne, naturel et digne. La structure « il faut d’abord que… soit proclamée » restitue clairement la nécessité, la priorité temporelle et le passif du grec. Les notes conservent les principales possibilités lexicales sans surcharger le texte.
