id: MRK.13.15
reference: Mark 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: fr
  text: Que celui qui est sur le toit[a] ne descende pas et n’entre pas pour emporter quoi que ce soit de sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne le toit plat et accessible d’une maison, souvent utilisé comme espace de vie.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: celui qui est sur le toit
  rationale: La tournure grecque substantivée désigne la personne qui se trouve à cet endroit. « Celui qui est » rend naturellement en français le singulier représentatif.
- source_word: δώματος
  choice: toit
  rationale: « Toit » est le terme français courant. La note précise qu’il s’agit, dans ce contexte, d’un toit plat accessible et utilisé comme espace de vie.
- source_word: μὴ καταβάτω
  choice: ne descende pas
  rationale: Le subjonctif précédé de « que » rend naturellement l’impératif grec à la troisième personne, tandis que « descendre » conserve le mouvement depuis le toit.
- source_word: μηδὲ εἰσελθάτω
  choice: et n’entre pas
  rationale: μηδέ coordonne une seconde interdiction. Cette formulation est claire et idiomatique en français sans préciser davantage la destination.
- source_word: τι ἆραι
  choice: pour emporter quoi que ce soit
  rationale: L’infinitif exprime ici le but. « Quoi que ce soit » restitue la portée indéfinie de τι, et « emporter » convient au mouvement d’un objet pris dans la maison puis sorti de celle-ci.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: de sa maison
  rationale: Avec « emporter », « de sa maison » rend naturellement ἐκ, qui marque la provenance depuis l’intérieur. Le possessif masculin singulier conserve la forme représentative du grec.
theological_decisions:
- issue: Masculin singulier représentatif dans une instruction de portée générale
  choice: sa maison
  alternative: leur maison ; la maison
  rationale: Le grec emploie un pronom masculin singulier avec une portée générale. Le français conserve ici ce singulier représentatif sans restreindre l’instruction aux seuls hommes.
translation_notes:
  register: Français international moderne, simple et digne. La construction « Que celui qui… » maintient la force impérative, et la répétition de « pas » rend les deux interdictions immédiatement compréhensibles.
