  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: fr
  text: Car une nation se dressera contre une autre, et un royaume contre un autre. Il y aura des tremblements de terre en divers lieux, et il y aura des famines. Ce sera le commencement des douleurs de l’accouchement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « douleurs du travail » ou « douleurs de l’enfantement ». Le grec évoque les douleurs liées à l’accouchement, employées ici comme image de souffrances qui précèdent ce qui doit suivre.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: se dressera
  rationale: Dans cette construction, le futur passif de ἐγείρω exprime idiomatiquement le soulèvement hostile d’un groupe contre un autre. « Se dressera » est naturel en français et conserve cette idée sans reproduire artificiellement la forme passive grecque.
- source_word: ἔθνος ἐπ’ ἔθνος
  choice: une nation contre une autre
  rationale: ἔθνος peut désigner un peuple ou une nation. Son parallélisme avec βασιλεία favorise ici le sens géopolitique; la reprise par « une autre » donne un français fluide tout en gardant l’opposition réciproque.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: un royaume contre un autre
  rationale: βασιλεία désigne ici un domaine politique, un royaume. Cette formulation conserve le parallélisme avec les nations sans alourdir la phrase française par une répétition inutile.
- source_word: σεισμοὶ κατὰ τόπους
  choice: des tremblements de terre en divers lieux
  rationale: σεισμοί désigne clairement des séismes, et la construction distributive κατὰ τόπους indique qu’ils se produiront dans plusieurs endroits.
- source_word: λιμοί
  choice: des famines
  rationale: λιμός désigne une famine, et non simplement la faim ou une pénurie limitée.
- source_word: ἀρχὴ ὠδίνων
  choice: le commencement des douleurs de l’accouchement
  rationale: ἀρχή marque le commencement, tandis que ὠδίνων évoque concrètement les douleurs liées à l’accouchement. La traduction maintient l’image métaphorique et son orientation vers ce qui doit suivre.
- source_word: ταῦτα
  choice: Tout cela
  rationale: Le démonstratif neutre pluriel reprend collectivement les événements qui viennent d’être énumérés. « Tout cela » s’accorde naturellement avec le verbe au singulier et garde cette valeur récapitulative.
theological_decisions:
- issue: Portée de la métaphore ἀρχὴ ὠδίνων
  choice: Conserver l’image des premières souffrances liées à un accouchement, sans préciser davantage l’issue qu’elles annoncent.
  alternative: Réduire l’expression à de simples malheurs, ou lui attribuer explicitement un scénario eschatologique détaillé.
  rationale: Le texte présente ces événements comme un commencement et emploie une image de souffrance précédant ce qui vient ensuite. La traduction préserve cette tension sans aplatir la métaphore ni importer un système doctrinal absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition structurante « Il y aura » est conservée, tandis que « une autre » évite une tournure inutilement raide dans les deux premiers parallèles. La métaphore obstétricale demeure explicite.
