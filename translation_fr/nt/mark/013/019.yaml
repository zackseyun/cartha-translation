  variant: modern international French
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: fr
  text: Car ces jours-là, il y aura une détresse telle qu’il n’y en a pas eu depuis le commencement de la création que Dieu a créée jusqu’à maintenant, et qu’il n’y en aura jamais plus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’y en aura certainement pas » ; la négation grecque est particulièrement forte.'
    reason: La note signale l’emphase de οὐ μὴ γένηται et rend clairement l’ellipse, dont le référent est une détresse de cette sorte.
lexical_decisions:
- source_word: θλῖψις
  choice: un temps de détresse
  rationale: Dans ce discours, le mot désigne une affliction extrême. « Détresse » est clair et grave en français moderne ; l’ajout de « temps de » rend naturellement la prédication selon laquelle ces jours constitueront une période de détresse.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: comme il n’y en a pas eu
  rationale: Cette tournure française conserve la comparaison intensive et le caractère sans précédent de la détresse, sans reproduire la redondance grecque de manière artificielle.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: depuis le commencement de la création
  rationale: La formulation garde explicitement κτίσις comme « création » et conserve la portée du commencement évoqué par le texte.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: que Dieu a créée
  rationale: La proposition relative est maintenue malgré sa répétition étymologique, car elle est explicite dans le grec et nomme Dieu comme créateur.
- source_word: ἕως τοῦ νῦν
  choice: jusqu’à maintenant
  rationale: Traduction temporelle directe, naturelle et conforme au registre du passage.
- source_word: οὐ μὴ γένηται
  choice: comme il n’y en aura jamais plus
  rationale: « Jamais » exprime la négation grecque fortement emphatique ; « plus » indique naturellement qu’une telle détresse ne se reproduira pas, tandis que la reprise de « comme » relie clairement cette proposition à la comparaison.
theological_decisions:
- issue: Portée du langage de la création
  choice: Conserver « la création que Dieu a créée » sans en réduire la portée.
  alternative: Employer « le monde » ou interpréter le commencement dans un sens local ou exclusivement historique.
  rationale: Le grec emploie explicitement κτίσις et κτίζω, avec Dieu pour sujet. La traduction maintient ce langage sans imposer de système eschatologique particulier.
- issue: Nature et portée de la détresse annoncée
  choice: Laisser l’affirmation absolue et comparative telle que formulée, sans préciser son référent historique ou futur.
  alternative: Identifier explicitement la détresse à un événement historique déterminé ou à une période eschatologique définie.
  rationale: Le verset affirme le caractère incomparable de la détresse, mais la traduction ne doit pas trancher des questions d’interprétation que cette phrase seule ne résout pas.
translation_notes:
  register: Français international moderne, digne et accessible. « Un temps de détresse » évite le caractère plus technique ou confessionnel que peut avoir « tribulation », tout en conservant la gravité du contexte. La répétition « création que Dieu a créée » est volontairement maintenue pour refléter le texte source.
