  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: fr
  text: Restez donc vigilants[a], car vous ne savez pas quand le maître de la maison viendra, que ce soit le soir, à minuit, au chant du coq[b] ou le matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Restez éveillés ». Le commandement implique de demeurer attentifs et vigilants.
    reason: lexical_alternative
  - marker: b
    text: Le « chant du coq » désigne ici une période de la nuit traditionnellement associée au chant du coq.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Restez vigilants
  rationale: L’impératif appelle à demeurer éveillé, attentif et prêt. « Restez vigilants » exprime naturellement en français moderne cette vigilance continue, sans la réduire au seul fait physique de ne pas dormir.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence pratique de l’enseignement précédent; « donc » conserve clairement ce lien logique.
- source_word: οὐκ οἴδατε
  choice: vous ne savez pas
  rationale: Traduction directe du verbe savoir à la forme négative, sans ajout de degré de certitude absent du grec.
- source_word: πότε
  choice: quand
  rationale: Rendu temporel simple et naturel dans une interrogation indirecte.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: le maître de la maison
  rationale: Dans l’image domestique, κύριος désigne celui qui exerce l’autorité sur la maison. « Maître de la maison » préserve ce sens contextuel sans imposer ici le titre divin « Seigneur ».
- source_word: ἔρχεται
  choice: viendra
  rationale: Le présent grec porte ici sur une arrivée attendue et future. Le futur français est naturel dans la proposition introduite par « quand ».
- source_word: ὀψὲ
  choice: le soir
  rationale: Dans la série des veilles nocturnes, le mot désigne la première période, celle du soir, plutôt qu’un vague « tard ».
- source_word: μεσονύκτιον
  choice: à minuit
  rationale: Expression temporelle française usuelle correspondant à la deuxième veille mentionnée.
- source_word: ἀλεκτοροφωνίας
  choice: au chant du coq
  rationale: Expression française claire qui conserve à la fois l’image du coq et sa fonction de repère nocturne.
- source_word: πρωΐ
  choice: le matin
  rationale: Le terme désigne la dernière veille, au début du matin. « Le matin » demeure précis sans imposer exclusivement l’idée de l’aube.
theological_decisions:
- issue: Sens de κύριος dans une image domestique pouvant indirectement renvoyer à Jésus
  choice: le maître de la maison
  alternative: le Seigneur de la maison; le propriétaire de la maison
  rationale: Le contexte immédiat présente le responsable d’une maison dans une comparaison. « Maître » rend son autorité dans l’image tout en laissant intacte la possible portée christologique du récit, sans la transformer en titre explicite dans cette phrase.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression des quatre veilles de la nuit tout en évitant un vocabulaire technique ou archaïque.
