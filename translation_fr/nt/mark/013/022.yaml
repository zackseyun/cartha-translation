  verdict: revise
  source_fidelity: La phrase rend correctement le futur, le lien explicatif, les faux messies et prophètes, les « signes et prodiges », le but exprimé par πρὸς τὸ et la condition εἰ δυνατόν. Toutefois, « ceux que Dieu a choisis » explicite un agent absent du grec. τοὺς ἐκλεκτούς doit rester « les élus » (ou, en note, « ceux qui ont été choisis »), afin de ne pas ajouter à la formulation source.
  naturalness: « Car de faux messies et de faux prophètes surgiront » est naturel dans un registre biblique moderne. « Afin d’égarer, si possible, les élus » est grammatical, fluide et conserve le placement grec de la condition, sans lui attribuer une portée interprétative indue.
  terminology: « Faux messies », « faux prophètes », « signes et prodiges » et « les élus » sont des équivalents exacts, établis et compréhensibles. « Les élus » préserve le terme théologiquement marqué ἐκλεκτοί sans développer son agent ni son contenu doctrinal.
