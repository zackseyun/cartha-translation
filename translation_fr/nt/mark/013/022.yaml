id: MRK.13.22
reference: Mark 13:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: fr
  text: Car de faux messies et de faux prophètes surgiront et produiront des signes et des prodiges afin d’égarer, si possible, les élus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui ont été choisis ». L’expression « si possible » ne précise pas si les élus peuvent effectivement être égarés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: surgiront
  rationale: Dans ce contexte, le passif futur exprime idiomatiquement l’apparition ou l’émergence de personnes. « Surgiront » est naturel en français et n’implique pas indûment que Dieu les suscite.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication qui motive l’avertissement précédent.
- source_word: ψευδόχριστοι
  choice: de faux messies
  rationale: Le composé désigne des personnes qui prétendent faussement au titre de Messie. Cette formulation est claire en français moderne et conserve le cadre messianique.
- source_word: ψευδοπροφῆται
  choice: de faux prophètes
  rationale: Traduction directe, courante et transparente du nom composé grec.
- source_word: δώσουσιν
  choice: produiront
  rationale: Avec « signes et prodiges », « produiront » rend naturellement l’idée de donner ou susciter ces manifestations, sans ajouter explicitement qu’elles sont miraculeuses.
- source_word: σημεῖα καὶ τέρατα
  choice: des signes et des prodiges
  rationale: Cette paire consacrée rend fidèlement l’expression grecque et garde sa résonance biblique.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: afin d’égarer
  rationale: La construction exprime le but, et « égarer » conserve l’image de détourner quelqu’un de la vérité.
- source_word: εἰ δυνατόν
  choice: si possible
  rationale: Traduction concise qui préserve la condition sans décider explicitement si l’égarement des élus est réellement possible.
- source_word: τοὺς ἐκλεκτούς
  choice: ceux que Dieu a choisis
  rationale: Cette formulation exprime en français courant le sens substantivé de « les choisis ». L’ajout explicatif de « Dieu » rend l’agent implicite dans la notion biblique d’élection sans imposer une théorie particulière de celle-ci.
theological_decisions:
- issue: Sens titulaire de ψευδόχριστοι
  choice: de faux messies
  alternative: de faux Christs
  rationale: Le composé renvoie ici à de faux prétendants au rôle messianique. « Faux messies » communique ce sens plus clairement que « faux Christs » en français moderne.
- issue: Portée de εἰ δυνατόν concernant ceux que Dieu a choisis
  choice: si possible
  alternative: si cela était possible
  rationale: Le grec énonce une condition sans préciser à lui seul si elle peut se réaliser. La traduction retenue conserve cette tension plutôt que de suggérer fortement une impossibilité.
- issue: Référent de τοὺς ἐκλεκτούς
  choice: ceux que Dieu a choisis
  alternative: les élus
  rationale: La formulation retenue est accessible et rend la notion d’élection divine sans importer de définition confessionnelle de l’élection.
translation_notes:
  register: Français international moderne, digne et oralement fluide. L’ordre « afin d’égarer, si possible, ceux que Dieu a choisis » suit de près la structure grecque et maintient l’ambiguïté de portée de la condition.
