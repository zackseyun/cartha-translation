source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: fr
  text: 'Apprenez du figuier cette parabole[a] : quand sa branche est déjà devenue tendre et qu’elle produit des feuilles, vous savez que l’été est proche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette leçon » ou « cette comparaison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: du figuier
  rationale: ἀπό avec le génitif indique la source de l’enseignement. Le léger lien discursif exprimé par δέ n’exige pas ici l’ajout d’un adverbe en français.
- source_word: μάθετε
  choice: Apprenez
  rationale: L’impératif aoriste de μανθάνω invite les auditeurs à recevoir un enseignement; « apprenez » en donne le sens direct.
- source_word: τὴν παραβολήν
  choice: cette parabole
  rationale: « Parabole » conserve le terme courant des Évangiles et la forme d’une comparaison instructive. Le démonstratif « cette » est idiomatique en français dans cette construction.
- source_word: ὅταν
  choice: quand
  rationale: ὅταν avec le subjonctif introduit une situation temporelle générale; « quand » est naturel en français.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: sa branche devient déjà tendre
  rationale: « Déjà » garde la nuance temporelle de ἤδη, tandis que « devient tendre » rend simplement l’apparition de la souplesse propre aux nouvelles pousses.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: ses feuilles poussent
  rationale: Cette formulation française naturelle exprime l’apparition des feuilles indiquée par ἐκφύω, sans archaïsme.
- source_word: γινώσκετε
  choice: vous savez
  rationale: 'La forme est ici un indicatif présent: elle décrit ce que les observateurs savent reconnaître, plutôt que de donner un nouvel ordre.'
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: l’été est proche
  rationale: θέρος désigne normalement l’été, et ἐγγύς sa proximité temporelle.
theological_decisions:
- issue: Sens de παραβολή dans ce contexte
  choice: « parabole » dans le texte principal
  alternative: « leçon » ou « comparaison »
  rationale: Le choix principal préserve le vocabulaire caractéristique de l’enseignement de Jésus, tandis que la note signale le sens illustratif possible sans imposer une lecture allégorique.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche du grec tout en étant naturelle; le léger δέ de transition n’est pas explicité artificiellement.
