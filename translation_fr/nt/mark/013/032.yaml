source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: fr
  text: Mais quant à ce jour-là ou à cette heure-là, personne ne sait, pas même les anges dans le ciel, ni le Fils, mais seulement le Père.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains comprennent « ni le Fils » par rapport à la mission incarnée du Fils ou à sa nature humaine. La traduction conserve la formulation grecque sans ajouter cette explication au texte principal.
    reason: Précision sur une interprétation théologique possible, volontairement laissée hors du texte principal afin d’en préserver la formulation et la tension.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mais quant à
  rationale: περί avec le génitif introduit le sujet, tandis que δέ marque ici une transition légèrement contrastive. « Mais quant à » rend naturellement les deux fonctions.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ce jour-là ou cette heure-là
  rationale: La répétition française de « cette…-là » restitue clairement les deux groupes grecs articulés et la référence au moment évoqué.
- source_word: οὐδεὶς οἶδεν
  choice: personne ne sait quand ils viendront
  rationale: οἶδα a ici son sens présent courant, « savoir ». Le complément « quand ils viendront » explicite en français naturel l'objet temporel implicite de « savoir », à savoir le jour ou l'heure, sans préciser davantage l'événement.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: pas même les anges dans le ciel
  rationale: οὐδέ prolonge la négation avec une valeur emphatique, bien rendue par « pas même » ; ἐν οὐρανῷ est compris localement.
- source_word: οὐδὲ ὁ υἱός
  choice: ni le Fils
  rationale: Le second οὐδέ poursuit la série négative. « Le Fils » est conservé comme titre christologique, sans paraphrase ni atténuation.
- source_word: εἰ μὴ ὁ πατήρ
  choice: mais seulement le Père
  rationale: Après une proposition négative, εἰ μή introduit l'unique exception. Cette tournure française exprime clairement l'exclusivité.
theological_decisions:
- issue: L'affirmation christologique selon laquelle le Fils ne connaît pas ce jour ou cette heure
  choice: Conserver sans atténuation « ni le Fils » dans le texte principal.
  alternative: Ajouter une précision interprétative telle que « dans son humanité » ou « dans le cadre de sa mission incarnée ».
  rationale: Le texte grec contient explicitement οὐδὲ ὁ υἱός. La traduction préserve cette formulation et la tension théologique qu'elle porte, sans importer une harmonisation doctrinale dans le texte biblique.
- issue: Référent implicite de l'acte de savoir
  choice: Expliciter par « quand ils viendront », avec un pronom pluriel renvoyant au jour et à l'heure.
  alternative: Traduire littéralement « personne ne sait », tournure possible mais moins complète et moins naturelle isolément en français.
  rationale: Dans le grec, le groupe topicalisé « quant à ce jour-là ou à cette heure-là » fournit implicitement l'objet de οἶδεν. L'explicitation française porte seulement sur leur occurrence et ne tranche pas davantage l'identité ou la nature de l'événement eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Mais quant à » marque une transition nette sans archaïsme. La répétition « ce jour-là ou cette heure-là » favorise la clarté. Le marqueur [a] est placé immédiatement après la phrase qu'il commente.
