id: MRK.13.2
reference: Mark 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: fr
  text: 'Et Jésus lui dit : « Tu vois ces grands bâtiments[a] ? Il ne restera pas ici une seule pierre sur une autre[b] qui ne soit démolie[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ces imposants bâtiments ». Il s’agit, d’après le contexte, des bâtiments du complexe du temple, bien que le grec dise simplement « bâtiments ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « ne pas laisser une seule pierre sur une autre » évoque une destruction complète.
    reason: cultural_note
  - marker: c
    text: 'Ou : « abattue » ou « détruite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Tu vois
  rationale: Le présent de l’indicatif prend ici une valeur interrogative directe. « Tu vois » est naturel en français et n’ajoute pas la nuance impérative de « Regarde ».
- source_word: μεγάλας οἰκοδομάς
  choice: grands bâtiments
  rationale: οἰκοδομάς désigne les édifices du complexe du temple, sans que le mot « temple » figure explicitement dans l’expression. « Grands » peut évoquer à la fois leurs dimensions et leur caractère imposant.
- source_word: οὐ μὴ ἀφεθῇ
  choice: Il ne restera pas … une seule
  rationale: La tournure οὐ μή avec le subjonctif aoriste exprime une négation future catégorique. En français, « pas une seule » en restitue naturellement l’insistance.
- source_word: ὧδε
  choice: ici
  rationale: L’adverbe conserve la référence immédiate au lieu que Jésus et le disciple ont sous les yeux.
- source_word: λίθος ἐπὶ λίθον
  choice: une seule pierre sur une autre
  rationale: Cette image conventionnelle exprime une destruction complète. La formulation française reste concrète et idiomatique.
- source_word: καταλυθῇ
  choice: soit démolie
  rationale: Dans le contexte d’un édifice, καταλύω signifie abattre ou démolir. « Démolie » exprime précisément le démontage destructeur des constructions.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Et Jésus lui dit
  rationale: La formulation suit sobrement l’enchaînement narratif de καί et rend εἶπεν αὐτῷ sans ajouter l’idée explicite d’une réponse.
theological_decisions:
- issue: Portée de la prédiction concernant le complexe du temple
  choice: Conserver « bâtiments » dans le texte principal.
  alternative: « bâtiments du temple »
  rationale: Le contexte identifie clairement le complexe du temple, mais le grec emploie le terme générique « bâtiments ». La traduction évite donc d’expliciter dans le texte principal un nom absent de la formulation source.
- issue: Intensité de l’annonce de la destruction
  choice: Rendre la négation emphatique par « pas … une seule pierre » et conserver la proposition relative.
  alternative: « Toutes seront démolies » ou « tout sera détruit »
  rationale: Cette formulation communique le caractère catégorique de οὐ μή tout en préservant l’image et la structure de la déclaration, sans élargir explicitement son objet au-delà des pierres évoquées.
translation_notes:
  register: Français international actuel, clair et digne. Le tutoiement correspond à l’échange direct entre Jésus et son disciple. La formulation garde le terme générique « bâtiments », l’emphase de la négation grecque et l’image concrète de la pierre sur la pierre.
