id: MRK.13.24
reference: Mark 13:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: fr
  text: Mais en ces jours-là, après cette détresse[a], le soleil s’obscurcira et la lune ne donnera pas sa lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette tribulation » ou « cette affliction ».
    reason: Alternative lexicale pour θλῖψις, qui peut désigner une détresse intense, une tribulation ou une affliction.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste ou la transition avec ce qui précède, dans un français simple et naturel.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: en ces jours-là
  rationale: Reproduit l’expression temporelle grecque et conserve sa tonalité eschatologique.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: après cette détresse
  rationale: μετά suivi de l’accusatif exprime ici la postériorité. « Détresse » rend naturellement la gravité de θλῖψις sans imposer le sens technique que « tribulation » peut avoir dans certains systèmes eschatologiques; « cette » maintient la référence précise du démonstratif.
- source_word: σκοτισθήσεται
  choice: s’obscurcira
  rationale: Exprime clairement l’événement futur. Le passif grec peut se rendre idiomatiquement en français par le verbe pronominal sans préciser l’agent.
- source_word: οὐ δώσει τὸ φέγγος αὐτῆς
  choice: ne donnera pas sa lumière
  rationale: Conserve l’image concrète et légèrement personnifiée de δίδωμι, tout en rendant φέγγος par le terme français le plus direct.
theological_decisions:
- issue: Rendu de θλῖψις dans le discours apocalyptique
  choice: détresse
  alternative: tribulation; affliction
  rationale: « Détresse » garde la force du terme dans ce contexte tout en restant compréhensible pour le lecteur moderne. La note signale les autres nuances possibles sans faire de ce mot l’étiquette d’un scénario eschatologique particulier.
translation_notes:
  register: Français international moderne, digne et direct. La structure parallèle des deux signes cosmiques est conservée, ainsi que la virgule de transition après la proposition temporelle.
