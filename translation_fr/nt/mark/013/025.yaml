source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: fr
  text: Et les étoiles tomberont du ciel[a], et les puissances qui sont dans les cieux seront ébranlées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut désigner soit le ciel visible, soit le domaine céleste.
    reason: lexical_alternative
  - marker: b
    text: L’expression « les puissances qui sont dans les cieux » peut désigner des puissances célestes, des forces cosmiques ou les structures des cieux ; le grec ne précise pas davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: étoiles
  rationale: Sens astronomique ordinaire, approprié au cadre cosmique et apocalyptique du passage.
- source_word: ἔσονται ... πίπτοντες
  choice: tomberont
  rationale: Le français naturel rend ici la périphrase future grecque par un futur simple. Une tournure progressive comme « seront en train de tomber » serait lourde et pourrait suggérer un point d’observation particulier absent du contexte.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: « Ciel » conserve à la fois le registre cosmique et la polysémie de οὐρανός, qui peut désigner le ciel visible ou le domaine céleste.
- source_word: δυνάμεις
  choice: puissances
  rationale: Ce terme préserve l’indétermination du grec entre puissances célestes, forces cosmiques et structures des cieux.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: qui sont dans les cieux
  rationale: La proposition relative reflète la construction grecque et le pluriel « les cieux » en conservant sa portée cosmique.
- source_word: σαλευθήσονται
  choice: seront ébranlées
  rationale: Le futur passif est directement rendu; « ébranlées » exprime une secousse profonde dans un registre digne et naturel.
theological_decisions:
- issue: Sens de « les puissances qui sont dans les cieux »
  choice: Conserver la formulation générale sans identifier les puissances.
  alternative: « les puissances célestes », compris comme des êtres angéliques, ou « les forces des cieux », compris comme des réalités cosmiques.
  rationale: Le grec ne précise pas s’il s’agit d’êtres célestes, de forces cosmiques ou de l’ordre des cieux; la traduction maintient cette ambiguïté apocalyptique.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur simple évite une périphrase progressive peu idiomatique, tandis que « puissances » et « les cieux » maintiennent le registre apocalyptique et l’ambiguïté du texte source.
