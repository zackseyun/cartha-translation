source:
  edition: SBLGNT
  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: fr
  text: '« Dis-nous : quand ces choses arriveront-elles, et quel sera le signe quand toutes ces choses seront sur le point de s’accomplir[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand toutes ces choses s’accompliront ». Le grec emploie μέλλω avec un infinitif, tournure qui peut signifier plus précisément « être sur le point de » faire quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Dis-nous
  rationale: L’impératif aoriste de λέγω suivi du datif ἡμῖν appelle naturellement « Dis-nous » en français direct et courant.
- source_word: πότε ταῦτα ἔσται
  choice: quand ces choses arriveront-elles
  rationale: Dans ce contexte événementiel, « arriveront » rend idiomatiquement ἔσται tout en conservant le pluriel de ταῦτα.
- source_word: τί τὸ σημεῖον
  choice: quel sera le signe
  rationale: « Signe » est l’équivalent usuel de σημεῖον. Le futur « sera », sous-entendu dans la proposition grecque, est explicité pour produire une question naturelle en français.
- source_word: ὅταν μέλλῃ
  choice: quand … seront sur le point de
  rationale: ὅταν introduit ici une proposition temporelle, tandis que μέλλω avec l’infinitif exprime l’action imminente ou en voie de se produire.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: toutes ces choses seront … de s’accomplir
  rationale: « Toutes ces choses » conserve le pluriel et la totalité exprimée par πάντα. « S’accomplir » rend la progression vers l’achèvement sans imposer explicitement l’idée d’accomplissement prophétique.
theological_decisions:
- issue: Portée eschatologique de μέλλῃ avec l’infinitif
  choice: seront sur le point de s’accomplir
  alternative: s’accompliront
  rationale: La formulation retenue préserve la nuance prospective, voire imminente, de μέλλω sans en tirer une conclusion doctrinale sur la chronologie des événements.
translation_notes:
  register: Français moderne, digne et accessible. Les deux questions sont clairement articulées; la formulation conserve la répétition de « ces choses » présente dans le grec et maintient la nuance d’imminence de μέλλῃ.
