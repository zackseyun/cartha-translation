source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: fr
  text: 'Beaucoup viendront en mon nom et diront : « C’est moi[a] », et ils égareront beaucoup de gens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Moi, je suis. » Le grec ne précise pas l’identité revendiquée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: L’adjectif substantivé désigne un grand nombre de personnes. « Beaucoup » est concis et naturel en français.
- source_word: ἐλεύσονται
  choice: viendront
  rationale: Le futur de ἔρχομαι est rendu directement par « viendront », sans ajouter l’idée plus interprétative d’apparaître.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Cette expression idiomatique peut évoquer l’autorité ou l’identité revendiquée au moyen du nom de Jésus. « En mon nom » en conserve la formulation naturelle et la portée ouverte.
- source_word: λέγοντες
  choice: et diront
  rationale: Le participe exprime une action accompagnant leur venue. La coordination est plus naturelle en français courant que le calque « disant ».
- source_word: ὅτι Ἐγώ εἰμι
  choice: « C’est moi »
  rationale: Le grec dit littéralement « Moi, je suis », sans prédicat exprimé. Dans ce contexte d’identification revendiquée, « C’est moi » constitue une formule française naturelle tout en évitant de préciser indûment « le Messie » ou une autre fonction.
- source_word: πολλοὺς
  choice: beaucoup de gens
  rationale: L’adjectif substantivé est explicité par « de gens » afin d’éviter en français moderne l’ambiguïté ou la lourdeur de « égareront beaucoup ».
- source_word: πλανήσουσιν
  choice: égareront
  rationale: πλανάω signifie faire dévier, induire en erreur. « Égarer » conserve à la fois la métaphore du chemin et le sens de tromper.
theological_decisions:
- issue: Interprétation de Ἐγώ εἰμι dans la bouche des faux prétendants
  choice: C’est moi
  alternative: Moi, je suis ; Je le suis
  rationale: Le contexte suggère une revendication d’identité ou de rôle, mais le grec n’énonce aucun prédicat. Le texte principal emploie une identification française idiomatique, tandis que la note conserve la forme plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe coordonnée est naturelle à l’oral comme à l’écrit. « C’est moi » rend l’identification sans importer explicitement un titre messianique absent du grec.
