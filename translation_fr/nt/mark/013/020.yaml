source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: fr
  text: Et si le Seigneur n’avait pas abrégé ces jours, personne[a] n’aurait été sauvé. Mais, à cause des élus qu’il a choisis, il a abrégé ces jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucune chair » ; c’est-à-dire aucun être humain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: a abrégé
  rationale: Le verbe κολοβόω signifie raccourcir ou abréger. « Abréger ces jours » est naturel en français, garde l’idée d’interrompre plus tôt la période annoncée et convient aux deux occurrences.
- source_word: κύριος
  choice: le Seigneur
  rationale: Le grec désigne ici un référent défini ; « le Seigneur » est la formulation biblique française naturelle.
- source_word: τὰς ἡμέρας
  choice: ces jours
  rationale: Le démonstratif rend clairement le renvoi aux jours de détresse mentionnés dans le contexte, sans préciser davantage leur nature.
- source_word: οὐκ ἂν ἐσώθη
  choice: n’aurait été sauvé
  rationale: La construction avec ἄν exprime un résultat irréel. « Sauvé » traduit directement σῴζω tout en laissant le contexte indiquer qu’il s’agit immédiatement de préserver la vie.
- source_word: πᾶσα σάρξ
  choice: personne[a]
  rationale: L’expression grecque signifie idiomatiquement aucun être humain dans cette proposition négative. « Personne » est clair et naturel en français moderne ; la note conserve la formulation littérale « aucune chair ».
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: à cause de ceux qu’il a choisis
  rationale: διά avec l’accusatif exprime ici le motif ou la considération en faveur des personnes concernées. Cette formulation française est naturelle sans imposer une théorie précise de l’élection.
- source_word: οὓς ἐξελέξατο
  choice: qu’il a choisis
  rationale: La relative est rendue directement. Le même vocabulaire permet aussi de représenter le lien étymologique entre ἐκλεκτούς et ἐξελέξατο sans la lourde répétition « les élus qu’il a élus ».
theological_decisions:
- issue: Sens de « sauvé » dans le contexte
  choice: Conserver « sauvé », avec pour sens immédiat la préservation de la vie humaine pendant la détresse.
  alternative: Traduire « n’aurait survécu » ou comprendre exclusivement le salut spirituel.
  rationale: Le contexte décrit une catastrophe mortelle, mais σῴζω porte le vocabulaire du salut. La traduction retenue préserve cette amplitude sans transformer le verset en affirmation doctrinale explicite sur le salut éternel.
- issue: Référent des ἐκλεκτοί
  choice: Employer « ceux qu’il a choisis » sans définir davantage la nature de ce choix.
  alternative: Employer le terme théologique « les élus » ou préciser une élection collective ou individuelle.
  rationale: Le verset affirme que le Seigneur les a choisis, mais ne tranche pas ici les débats sur la nature de l’élection. La formulation garde l’affirmation du texte sans lui ajouter une doctrine confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. « Ces jours » assure un renvoi naturel au contexte. « Ceux qu’il a choisis » évite un jargon inutile tout en conservant explicitement l’acte divin de choisir.
