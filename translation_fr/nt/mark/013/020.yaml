  to: Et si le Seigneur n’avait pas abrégé ces jours, personne[a] n’aurait été sauvé. Mais, à cause des élus qu’il a choisis, il a abrégé ces jours.
  rationale: La révision introduit « les élus » pour rendre explicitement τοὺς ἐκλεκτούς, tout en gardant « qu’il a choisis » pour οὓς ἐξελέξατο. Elle préserve ainsi la répétition et la portée théologique du grec sans préciser la nature de l’élection. La note et son ancre demeurent inchangées.
