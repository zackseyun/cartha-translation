review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement la condition contrefactuelle, l’action d’abréger les jours et le sens collectif de πᾶσα σάρξ. En revanche, « ceux qu’il a choisis » ne traduit qu’indirectement la double expression grecque τοὺς ἐκλεκτούς οὓς ἐξελέξατο et efface le terme distinctif « les élus » / « les choisis ».
  naturalness: « Abrégé ces jours », « personne n’aurait été sauvé » et la note sont naturels en français international moderne. « Les élus qu’il a choisis » est également idiomatique dans ce registre biblique et rend la répétition intentionnelle du grec sans être inutilement lourde.
  terminology: '« Le Seigneur » et « sauvé » conviennent. Il est préférable de conserver « les élus » pour ἐκλεκτούς, puis « qu’il a choisis » pour ἐξελέξατο : cela préserve à la fois le terme théologique du texte et l’ambiguïté qu’il porte, sans interprétation confessionnelle.'
  issues:
  - severity: medium
    issue: Le syntagme τοὺς ἐκλεκτούς (« les élus ») n’est pas explicitement rendu.
    rationale: La formulation actuelle « à cause de ceux qu’il a choisis » restitue la relative οὓς ἐξελέξατο, mais fusionne et atténue le nom ἐκλεκτούς. Le grec emploie les deux termes, et la traduction devrait conserver cette emphase lexicale.
  revised_text: Et si le Seigneur n’avait pas abrégé ces jours, personne[a] n’aurait été sauvé. Mais, à cause des élus qu’il a choisis, il a abrégé ces jours.
