  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: fr
  text: de peur qu’en arrivant soudainement, il ne vous trouve endormis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: en arrivant
  rationale: Le participe aoriste circonstanciel est conservé par un gérondif naturel en français, sans le transformer en verbe principal.
- source_word: ἐξαίφνης
  choice: soudainement
  rationale: Rend directement l’idée d’une arrivée brusque et inattendue.
- source_word: εὕρῃ
  choice: il ne vous trouve
  rationale: Après « de peur que », le subjonctif français avec « ne » explétif exprime naturellement la crainte visée par μή, sans donner à « ne » une valeur négative propre.
- source_word: καθεύδοντας
  choice: endormis
  rationale: Le participe présent grec décrit l’état dans lequel les destinataires pourraient être trouvés; « endormis » est idiomatique et garde l’image du sommeil.
theological_decisions:
- issue: Valeur du sommeil
  choice: Conserver simplement l’image « endormis »
  alternative: Expliciter comme « spirituellement assoupis » ou « non vigilants »
  rationale: Le grec emploie l’image concrète sans en expliciter ici la portée; la traduction préserve donc sa tension et laisse le contexte en guider l’interprétation.
- issue: Rapport syntaxique entre l’arrivée et la découverte
  choice: « en arrivant soudainement, il ne vous trouve »
  alternative: « il ne vienne soudainement et ne vous trouve »
  rationale: Cette formulation reflète la subordination participiale de ἐλθών et évite de présenter les deux actions comme deux verbes coordonnés.
translation_notes:
  register: Français moderne, international et digne. La tournure « de peur que… ne » est soutenue mais courante dans une traduction biblique; le « ne » est explétif. Aucun ajout interprétatif ni marqueur de note n’est nécessaire.
