  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: fr
  text: Soyez sur vos gardes, restez éveillés, car vous ne savez pas quand viendra le moment[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le moment fixé » ou « le temps décisif ». Le grec καιρός désigne souvent un moment décisif ou déterminé.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Soyez sur vos gardes
  rationale: L’impératif est employé comme une mise en garde appelant à la vigilance, et non au simple fait de voir. Cette formulation naturelle le distingue de l’image de l’éveil exprimée ensuite.
- source_word: ἀγρυπνεῖτε
  choice: restez éveillés
  rationale: L’impératif évoque le fait de demeurer éveillé et, par extension, vigilant. La traduction conserve cette image concrète sans répéter la première exhortation.
- source_word: οὐκ οἴδατε
  choice: vous ne savez pas
  rationale: Rend directement la négation du verbe « savoir », sans ajouter l’idée de certitude absente du grec.
- source_word: γὰρ
  choice: car
  rationale: Introduit la raison des deux exhortations précédentes dans un registre français naturel et digne.
- source_word: πότε
  choice: quand
  rationale: Équivalent français direct et idiomatique de l’adverbe interrogatif temporel.
- source_word: ὁ καιρός
  choice: le moment
  rationale: Dans ce contexte, καιρός désigne un moment décisif ou fixé plutôt que le temps en général. « Le moment » reste sobre et laisse ouverte la question de son caractère explicitement fixé.
- source_word: ἐστιν
  choice: viendra
  rationale: Le français « quand est le moment » serait peu naturel. Dans le contexte de l’attente eschatologique, « quand viendra le moment » exprime idiomatiquement la survenue du moment sans en préciser davantage la nature.
theological_decisions:
- issue: Nuance eschatologique de καιρός
  choice: le moment
  alternative: le moment fixé ; le temps décisif
  rationale: Le terme peut désigner un moment décisif ou déterminé. Le texte principal conserve une formulation large, tandis que la note signale les nuances possibles sans imposer que l’accent porte explicitement sur la prédétermination.
translation_notes:
  register: Français international moderne, direct et digne. Le pluriel « vous » reproduit les impératifs pluriels. La ponctuation maintient l’enchaînement serré entre l’avertissement, l’appel à l’éveil et leur justification.
