  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: fr
  text: Mais priez pour que cela n’arrive pas en hiver[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite compte tenu du contexte : « pour que vous n’ayez pas à fuir en hiver ». Le grec de Marc est plus elliptique que le passage parallèle en Matthieu 24.20.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: priez
  rationale: Impératif présent moyen/déponent, deuxième personne du pluriel. Le simple impératif « priez » est naturel en français et respecte le pluriel sans surinterpréter l’aspect présent par « continuez à prier ».
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une transition légèrement adversative après l’avertissement précédent. « Mais » rend clairement ce lien discursif.
- source_word: ἵνα μὴ
  choice: pour que… n’arrive pas
  rationale: Après « priez », « pour que… ne… pas » exprime naturellement en français le contenu ou le but de la prière.
- source_word: γένηται
  choice: cela n’arrive
  rationale: Aoriste moyen subjonctif de γίνομαι. « Arriver » convient au sens contextuel de survenue. Le pronom neutre « cela » préserve l’expression elliptique de Marc sans ajouter explicitement « votre fuite ».
- source_word: χειμῶνος
  choice: en hiver
  rationale: Génitif de temps ou de saison employé adverbialement. « En hiver » est l’équivalent français courant et concis.
theological_decisions:
- issue: Référent implicite de γένηται
  choice: 'Conserver une formulation impersonnelle et elliptique : « que cela n’arrive pas »'
  alternative: « que votre fuite n’arrive pas en hiver » ou, plus naturellement, « que vous n’ayez pas à fuir en hiver »
  rationale: Le grec de Marc ne mentionne pas explicitement « votre fuite », contrairement à Matthieu 24.20. La formulation retenue préserve donc l’ellipse et l’ambiguïté du texte source plutôt que d’importer la précision du passage parallèle.
translation_notes:
  register: Français international moderne, simple et digne. « Cela » maintient l’ellipse du grec tout en restant compréhensible; la note explicite le référent contextuel possible sans l’introduire dans le texte principal.
