source:
  edition: SBLGNT
  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: fr
  text: 'Tandis qu’il était assis sur le mont des Oliviers, en face du temple[a], Pierre, Jacques, Jean et André l’interrogeaient en privé :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec ἱερόν désigne l’ensemble du temple et de ses cours, et non pas seulement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Tandis qu’il était assis
  rationale: Le génitif absolu avec participe présent décrit une circonstance en cours ; cette tournure la restitue naturellement en français.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sur le mont des Oliviers
  rationale: Avec ce verbe de position, εἰς indique ici le lieu. « Le mont des Oliviers » est la désignation géographique française usuelle.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: en face du temple
  rationale: κατέναντι exprime une position opposée ou faisant face ; « en face du temple » est clair et idiomatique.
- source_word: ἐπηρώτα
  choice: l’interrogeaient
  rationale: L’imparfait grec présente la demande dans son déroulement. « Interrogeaient » conserve cet aspect et convient à la question directe qui suit.
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: L’expression signifie à l’écart des autres, en privé.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Pierre, Jacques, Jean et André
  rationale: Les formes françaises usuelles des noms sont retenues. L’énumération française naturelle évite de reproduire mécaniquement le polysyndète grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la valeur circonstancielle du participe, l’aspect imperfectif de ἐπηρώτα et la distinction lexicale liée à ἱερόν. Le deux-points prépare naturellement la question du verset suivant.
