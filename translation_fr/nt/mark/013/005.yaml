reference: Mark 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: fr
  text: 'Alors Jésus se mit à leur dire : « Veillez à ce que personne ne vous égare.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prenez garde que personne ne vous trompe. »'
    reason: Alternative lexicale reflétant le sens de tromperie possible pour πλανήσῃ et une autre formulation naturelle de Βλέπετε.
lexical_decisions:
- source_word: δὲ
  choice: Alors
  rationale: Connecteur narratif léger, « alors » assure ici une progression naturelle sans introduire un contraste marqué.
- source_word: ἤρξατο λέγειν
  choice: se mit à leur dire
  rationale: Cette tournure française naturelle conserve l’aspect ingressif de ἤρξατο et l’idée de parole exprimée par λέγειν.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom conserve la formulation explicite du grec sans remplacer son référent contextuel par « ses disciples ».
- source_word: Βλέπετε
  choice: Veillez
  rationale: L’impératif présent appelle une vigilance continue et introduit naturellement en français la proposition avec « à ce que ».
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: à ce que personne ne vous égare
  rationale: La formulation exprime l’avertissement préventif porté par μή avec le subjonctif. « Égarer » préserve à la fois les idées de tromperie et de déviation hors du bon chemin.
theological_decisions:
- issue: Portée de l’avertissement exprimé par πλανήσῃ
  choice: Un avertissement contre une tromperie qui détourne du bon chemin
  alternative: Un avertissement limité à une erreur intellectuelle
  rationale: πλανάω peut évoquer aussi bien la tromperie que le fait d’égarer. « Vous égare » maintient cette portée large sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et direct. « Se mit à leur dire » garde la nuance narrative du grec; « veillez » évite l’archaïsme de « prenez garde » dans le texte principal tout en maintenant la force de l’avertissement.
