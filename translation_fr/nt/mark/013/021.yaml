id: MRK.13.21
reference: Mark 13:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: fr
  text: 'Et alors, si quelqu’un vous dit : « Regardez, le Messie est ici ! » ou : « Regardez, il est là ! », n’y croyez pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τότε
  choice: Et alors
  rationale: Conserve à la fois le lien avec ce qui précède (καί) et l’indication temporelle (τότε), dans un français naturel.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: si quelqu’un vous dit
  rationale: Rend simplement la condition générale et l’indéfini τις en français contemporain.
- source_word: Ἴδε
  choice: Regardez
  rationale: Interpellation vive et moderne correspondant à la fonction de ἴδε, sans l’archaïsme de « voici » employé seul comme injonction.
- source_word: ὧδε
  choice: est ici
  rationale: Exprime directement la localisation proche indiquée par ὧδε.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: 'Dans ce contexte de prétendants eschatologiques, χριστός fonctionne clairement comme un titre : l’oint attendu.'
- source_word: ἐκεῖ
  choice: il est là
  rationale: Rend le contraste spatial avec « ici » et explicite naturellement en français l’ellipse grecque.
- source_word: μὴ πιστεύετε
  choice: ne le croyez pas
  rationale: Le grec laisse l’objet implicite. En français, « le » peut renvoyer à ce qui vient d’être affirmé, sans limiter nécessairement l’avertissement à la personne qui parle.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: L’article et le contexte montrent un emploi titulaire plutôt qu’un nom propre. « Le Messie » préserve la portée de l’oint attendu, tandis que « le Christ » demeure une traduction traditionnelle possible.
- issue: Objet implicite de πιστεύετε
  choice: ne le croyez pas
  alternative: n’y croyez pas / ne croyez pas cette personne
  rationale: La formulation retenue vise l’affirmation rapportée tout en maintenant une certaine souplesse référentielle; elle évite de réduire explicitement l’objet soit au message seul, soit au locuteur seul.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif pluriel « Regardez » correspond à l’adresse collective ὑμῖν. L’ellipse de la seconde proclamation est légèrement explicitée (« il est là ») pour produire une phrase française naturelle.
