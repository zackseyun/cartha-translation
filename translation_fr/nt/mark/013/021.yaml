review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la structure conditionnelle, l’opposition spatiale « ici/là » et le titre ὁ χριστός par « le Messie ». Toutefois, « ne le croyez pas » oriente normalement le pronom français vers la personne qui parle, tandis que πιστεύετε laisse l’objet implicite et vise naturellement la proclamation rapportée. « N’y croyez pas » rend mieux l’adhésion à cette affirmation sans personnaliser indûment l’objet.
  naturalness: La formulation est moderne et fluide. « Regardez » convient comme appel d’attention adressé au groupe. Le remplacement final par « n’y croyez pas » est plus idiomatique et plus précis en français dans ce contexte.
  terminology: '« Le Messie » est approprié : dans ce contexte, χριστός est un titre revendiqué par de prétendus libérateurs, non un nom propre. Aucun changement terminologique n’est nécessaire.'
  issues:
  - severity: medium
    issue: « ne le croyez pas »
    rationale: En français courant, le pronom masculin renvoie spontanément à « quelqu’un » et signifie « ne croyez pas cette personne ». Le grec ne fournit pas cet objet personnel et l’avertissement porte sur le contenu de la déclaration. « N’y croyez pas » renvoie naturellement à l’affirmation annoncée, tout en évitant d’ajouter un objet personnel au grec.
