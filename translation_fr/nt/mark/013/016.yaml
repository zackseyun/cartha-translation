  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: fr
  text: Et que celui qui est dans le champ ne retourne pas en arrière pour prendre son manteau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtement extérieur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: celui qui est dans le champ
  rationale: La construction avec article désigne une personne caractérisée par sa présence dans le champ. Cette formulation française est naturelle et conserve le singulier générique.
- source_word: ἀγρός
  choice: champ
  rationale: Dans ce contexte de fuite, le terme désigne directement un champ ou une terre cultivée.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: ne retourne pas en arrière
  rationale: L’impératif aoriste avec μή exprime une interdiction pressante. « Retourner en arrière » rend explicitement l’idée de revenir vers ce qui se trouve derrière.
- source_word: ἆραι
  choice: pour prendre
  rationale: L’infinitif exprime ici le but du retour. « Prendre » est simple, concret et naturel en français.
- source_word: ἱμάτιον
  choice: manteau
  rationale: Le mot désigne généralement un vêtement extérieur. « Manteau » est clair et idiomatique, tandis qu’une note conserve l’alternative plus générale.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif masculin singulier correspond au référent générique singulier de la phrase grecque.
theological_decisions:
- issue: Référence générique au masculin singulier
  choice: Conserver « celui… son manteau »
  alternative: Employer un pluriel épicène ou reformuler avec « la personne… son vêtement »
  rationale: Le grec emploie une expression masculine singulière avec un pronom masculin singulier. Le français permet de conserver cette forme représentative sans limiter nécessairement l’avertissement aux hommes.
translation_notes:
  register: Français international moderne, clair et digne. La tournure impérative « que… ne retourne pas » préserve la forme d’exhortation directe du grec sans lourdeur archaïque.
