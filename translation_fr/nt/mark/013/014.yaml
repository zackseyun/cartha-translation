id: MRK.13.14
reference: Mark 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: fr
  text: Mais quand vous verrez l’abomination de la désolation se tenir là où elle ne doit pas être (que le lecteur comprenne)[a], alors, que ceux qui seront en Judée fuient vers les montagnes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le participe grec rendu par « se tenir » est masculin. Cela peut suggérer une référence personnelle derrière « l’abomination » : « se tenant là où il ne doit pas être ».'
    reason: alternative_reading
  - marker: b
    text: L’expression « l’abomination de la désolation » reprend le langage de Daniel (voir Dn 9.27 ; 11.31 ; 12.11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mais quand
  rationale: Ὅταν introduit une éventualité temporelle, tandis que δέ assure ici une transition légèrement contrastive avec l’avertissement précédent.
- source_word: ἴδητε
  choice: vous verrez
  rationale: Dans une proposition temporelle française introduite par « quand », le futur rend naturellement l’action envisagée par l’aoriste subjonctif grec.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: l’abomination de la dévastation
  rationale: Cette formulation proche du grec conserve l’écho apocalyptique de Daniel sans préciser s’il s’agit d’un objet, d’un acte ou d’une personne. « Dévastation » exprime plus naturellement en français moderne l’état ou l’effet associé à ἐρήμωσις.
- source_word: ἑστηκότα
  choice: se tenir
  rationale: Le participe parfait de ἵστημι décrit un état résultant d’une installation antérieure. « Se tenir » garde l’image vive sans ajouter explicitement « être installée ».
- source_word: ὅπου οὐ δεῖ
  choice: là où elle ne doit pas être
  rationale: δεῖ exprime ici ce qui convient ou doit être. Le féminin français reprend grammaticalement « abomination », tandis que la discordance de genre présente en grec est signalée en note.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: que celui qui lit comprenne
  rationale: Cette formulation rend directement le participe substantivé et l’impératif, tout en laissant ouverte l’identité du lecteur visé.
- source_word: τότε
  choice: alors
  rationale: Le terme marque la conséquence immédiate du signe annoncé.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ceux qui seront en Judée
  rationale: Le futur s’intègre naturellement au cadre prospectif français et conserve la précision géographique.
- source_word: φευγέτωσαν
  choice: que … fuient
  rationale: Le subjonctif d’ordre rend fidèlement l’impératif grec à la troisième personne et son urgence.
- source_word: εἰς τὰ ὄρη
  choice: dans les montagnes
  rationale: « Dans les montagnes » exprime naturellement le mouvement vers une région montagneuse servant de refuge.
theological_decisions:
- issue: Interprétation de l’expression daniélique βδέλυγμα τῆς ἐρημώσεως
  choice: Conserver « l’abomination de la dévastation » sans identifier son référent historique.
  alternative: « le sacrilège dévastateur » ou « l’abomination qui cause la dévastation »
  rationale: Le référent peut être compris comme un objet, un acte sacrilège ou une personne. Une formulation proche de la source préserve l’allusion et la tension interprétative.
- issue: Participe masculin ἑστηκότα associé au nom neutre βδέλυγμα
  choice: Employer dans le texte principal le féminin exigé en français par « abomination », tout en signalant en note la possible référence personnelle.
  alternative: « se tenir là où il ne doit pas être »
  rationale: La discordance grecque peut suggérer une personne derrière l’expression neutre ou une personnification. Le français principal doit rester lisible, mais cette donnée significative ne doit pas être effacée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton urgent de l’avertissement et les deux incises sont nettement délimitées. Les marqueurs [a] et [b] figurent dans le texte principal.
