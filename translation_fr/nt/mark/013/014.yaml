revisions:
- from: Mais quand vous verrez l’abomination de la dévastation se tenir là où elle ne doit pas être — que celui qui lit comprenne [a] —, alors, que ceux qui seront en Judée fuient dans les montagnes [b].
  to: Mais quand vous verrez l’abomination de la désolation se tenir là où elle ne doit pas être (que le lecteur comprenne)[a], alors, que ceux qui seront en Judée fuient vers les montagnes[b].
  rationale: La révision adopte « désolation », équivalent français plus exact et intertextuellement reconnaissable de ἐρήμωσις dans cette expression. Elle conserve l’ambiguïté du référent, documente la discordance masculine du participe grec sans la résoudre, et rend le mouvement vers les montagnes de façon plus explicite. Aucun changement interprétatif ou doctrinal n’est introduit.
