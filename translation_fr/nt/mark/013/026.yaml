source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: fr
  text: Alors on verra le Fils de l’homme venir dans les nuées[a], avec une grande puissance et avec gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « venir avec les nuées ». Le grec dit littéralement « dans des nuées », mais cette autre traduction fait mieux ressortir l’écho probable de Daniel 7.13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: on verra
  rationale: Le futur grec a un sens direct. En français, le pronom indéfini « on » rend naturellement le sujet pluriel non exprimé sans identifier davantage ceux qui verront.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation consacrée demeure claire en français et conserve la portée titulaire ainsi que l’écho de Daniel 7.
- source_word: ἐρχόμενον
  choice: venir
  rationale: L’infinitif après « verra » rend naturellement le participe présent grec et préserve l’idée de venue sans la réduire au seul moment de l’arrivée.
- source_word: ἐν νεφέλαις
  choice: dans les nuées
  rationale: « Dans » correspond directement à ἐν, tandis que « nuées » conserve le registre biblique et apocalyptique de l’image. La possibilité « avec les nuées », qui fait ressortir l’écho de Daniel 7.13, est signalée en note.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: avec une grande puissance
  rationale: Cette expression française idiomatique traduit l’accompagnement marqué par μετά et l’intensité de πολλῆς.
- source_word: καὶ δόξης
  choice: et avec gloire
  rationale: « Gloire » conserve la portée biblique de δόξα. La répétition de « avec » rattache clairement la puissance et la gloire à la venue, tout en respectant l’absence d’adjectif devant « gloire ».
theological_decisions:
- issue: Titre apocalyptique et image des nuées
  choice: Conserver « le Fils de l’homme » et l’image de sa venue dans les nuées sans explicitation interprétative.
  alternative: Traduire le titre par « l’Humain » ou paraphraser explicitement l’allusion à Daniel 7.
  rationale: Le texte évoque fortement Daniel 7.13, mais la traduction doit laisser agir cette allusion plutôt que l’expliquer dans le corps du verset. Le titre traditionnel préserve aussi la tension christologique et eschatologique du grec.
translation_notes:
  register: Français moderne, digne et accessible. « Nuées » est retenu plutôt que « nuages » afin de préserver le registre apocalyptique et l’écho scripturaire sans rendre l’ensemble archaïque.
