  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: fr
  text: 'Ce que je vous dis, je le dis à tous : restez éveillés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veillez » ou « soyez vigilants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: Ce que
  rationale: Le pronom relatif neutre substantivé a ici une valeur récapitulative générale ; « Ce que » est naturel et fidèle en français.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: La particule a ici une faible valeur connective. En français, l’enchaînement reste naturel sans « et » ni « mais », qui risqueraient de surcharger ou de durcir le lien.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom datif pluriel désigne d’abord les interlocuteurs immédiats ; le français « vous » en conserve naturellement le nombre.
- source_word: λέγω ... λέγω
  choice: je vous dis ... je le dis
  rationale: La répétition de λέγω est maintenue pour reproduire la structure et l’insistance grecques ; « le » reprend naturellement « ce que » en français.
- source_word: πᾶσιν
  choice: à tous
  rationale: Cette formulation concise conserve la portée inclusive et universalisante du datif pluriel sans ajouter un nom absent du grec.
- source_word: γρηγορεῖτε
  choice: restez éveillés
  rationale: L’impératif présent pluriel exprime une vigilance continue. « Restez éveillés » préserve l’image concrète, tandis que d’autres rendus possibles mettent davantage l’accent sur la vigilance figurée.
theological_decisions:
- issue: Portée de l’exhortation de Jésus
  choice: La parole adressée aux disciples est explicitement étendue à tous.
  alternative: On pourrait comprendre l’exhortation comme visant seulement les auditeurs immédiats dans la scène narrative.
  rationale: L’opposition entre ὑμῖν (« à vous ») et πᾶσιν (« à tous ») élargit explicitement la portée de l’exhortation ; la traduction conserve ce mouvement sans préciser davantage l’identité de « tous ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la répétition rhétorique du grec tout en adoptant la reprise pronominale naturelle « je le dis ». L’impératif pluriel « restez éveillés » maintient à la fois l’image et l’appel continu à la vigilance.
