    issue: Le texte principal emploie « il est proche » et la note présente également « il est proche » comme alternative.
    rationale: En français, « il » oriente normalement vers un référent masculin personnel; il ne fonctionne pas ici comme un véritable impersonnel neutre. Cela réduit l’ambiguïté syntaxique du grec et rend la note incohérente avec le texte principal.
  revised_text: De même, vous aussi, quand vous verrez ces choses arriver, sachez que c’est proche, aux portes.
