revisions:
- from: De même, vous aussi, quand vous verrez ces choses arriver, sachez qu’il[a] est proche, aux portes.
  to: De même, vous aussi, quand vous verrez ces choses arriver, sachez que c’est proche, aux portes.
  rationale: Le remplacement de « il est proche » par « c’est proche » maintient en français un référent non spécifié, conformément au grec, sans trancher entre une réalité ou un événement attendu et une lecture personnelle. La note conserve explicitement la possibilité d’un sujet personnel. Le reste de la formulation est fidèle et naturel.
