review_pass:
  verdict: revise
  source_fidelity: Le verset rend correctement la comparaison (« De même, vous aussi »), la contingence future, le pluriel de « ces choses », l’impératif et l’image plurielle « aux portes ». Toutefois, « il est proche » impose en français un sujet masculin personnel, alors que le grec laisse le sujet de ἐστιν implicite.
  naturalness: « De même, vous aussi, quand vous verrez ces choses arriver, sachez que c’est proche, aux portes » est un français moderne, clair et suffisamment concis. « Aux portes » conserve l’image et le pluriel du grec.
  terminology: Aucun terme théologique explicite ne requiert de normalisation. Le pronom neutre « c’ » évite d’identifier le référent implicite à une personne ou à un événement déterminé; la note signale l’alternative personnelle possible.
