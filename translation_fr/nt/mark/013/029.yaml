source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: fr
  text: De même, vous aussi, quand vous verrez ces choses arriver, sachez que c’est proche, aux portes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: De même, vous aussi
  rationale: « De même » relie explicitement l’exhortation à la comparaison du figuier, tandis que « vous aussi » conserve l’accent porté sur les disciples.
- source_word: ὅταν ἴδητε
  choice: quand vous verrez
  rationale: ὅταν avec le subjonctif aoriste exprime ici une éventualité future; le futur français est naturel dans cette proposition temporelle.
- source_word: ταῦτα γινόμενα
  choice: ces choses arriver
  rationale: Le pluriel de ταῦτα est conservé, et « arriver » rend clairement γινόμενα dans un français actuel.
- source_word: γινώσκετε
  choice: sachez
  rationale: L’impératif « sachez » exprime directement la conclusion que les disciples doivent tirer des événements observés.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: qu’il est proche
  rationale: Le grec ne précise pas le sujet de ἐστιν. Le pronom français grammaticalement nécessaire reste volontairement indéterminé grâce à une note signalant les deux référents possibles.
- source_word: ἐπὶ θύραις
  choice: aux portes
  rationale: Cette formulation conserve le pluriel θύραις et demeure une expression française intelligible de proximité extrême.
theological_decisions:
- issue: Sujet implicite de ἐστιν (« est proche »)
  choice: Employer « il » dans le texte, avec une note indiquant qu’il peut désigner soit une réalité ou un événement, soit une personne.
  alternative: '« cela est proche » ou une lecture personnelle explicite: « il est proche » au sens du Fils de l’homme.'
  rationale: Le grec omet le sujet et permet plusieurs rattachements contextuels. En français, « il » peut fonctionner comme pronom impersonnel ou personnel; la note préserve donc l’ambiguïté réelle sans identifier d’office le référent.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « aux portes » conserve l’image et le pluriel grecs; la note maintient l’ambiguïté du sujet implicite.
