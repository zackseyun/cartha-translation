  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: fr
  text: Le ciel et la terre passeront, mais mes paroles ne passeront jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: Le ciel et la terre
  rationale: Cette paire désigne l’ensemble de l’ordre créé. « Le ciel et la terre » est en français l’expression établie qui conserve cette portée cosmique.
- source_word: παρελεύσονται
  choice: passeront
  rationale: Le verbe παρέρχομαι signifie ici passer, disparaître ou prendre fin. « Passeront » reste sobre, naturel dans ce contexte et permet de conserver la répétition grecque.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque le contraste entre le caractère passager du ciel et de la terre et la permanence des paroles de Jésus.
- source_word: οἱ λόγοι μου
  choice: mes paroles
  rationale: λόγοι désigne ici les paroles ou déclarations de Jésus. « Mes paroles » est direct, idiomatique et digne.
- source_word: οὐ μὴ παρελεύσονται
  choice: ne passeront jamais
  rationale: La construction οὐ μή suivie du futur exprime une négation particulièrement forte. « Ne passeront jamais » la rend clairement et naturellement en français moderne.
theological_decisions:
- issue: Force de la négation emphatique concernant les paroles de Jésus
  choice: ne passeront jamais
  alternative: ne passeront absolument pas
  rationale: La traduction fait entendre l’assurance catégorique du grec sans atténuer le contraste entre la disparition de l’ordre créé et la permanence des paroles de Jésus. Elle ne précise pas davantage la manière dont le ciel et la terre passeront.
translation_notes:
  register: Français international moderne, concis et solennel. La répétition de « passeront » reproduit le parallélisme du grec, tandis que « jamais » communique naturellement la négation emphatique.
