  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: fr
  text: 'Mais vous, soyez sur vos gardes[a] : je vous ai tout dit d’avance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faites attention » ou « veillez ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous ai prévenus de tout ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom pluriel explicite est conservé afin de rendre l’accent contrastif placé sur les disciples.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste avec le danger évoqué précédemment et introduit l’exhortation.
- source_word: βλέπετε
  choice: soyez sur vos gardes
  rationale: L’impératif présent a ici une valeur d’avertissement continu. Cette expression française naturelle restitue mieux cette force que le sens littéral « regardez ».
- source_word: προείρηκα
  choice: j’ai dit d’avance
  rationale: Le parfait indique une parole antérieure qui demeure pertinente, tandis que le préverbe προ- exprime l’annonce préalable.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif désigne les destinataires de la parole et se rend naturellement par le pronom complément dans « je vous ai dit ».
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a une portée globale. « Tout » est idiomatique en français et laisse au contexte le soin d’en préciser l’étendue.
theological_decisions:
- issue: Portée de l’avertissement et de la révélation préalable de Jésus
  choice: La traduction affirme que Jésus a communiqué d’avance tout ce qui est pertinent dans ce contexte, sans préciser davantage l’étendue de πάντα.
  alternative: Comprendre que Jésus prétend avoir révélé exhaustivement chaque détail futur, ou limiter explicitement ses paroles aux seuls avertissements immédiatement précédents.
  rationale: Le grec dit simplement πάντα, « tout ». La traduction doit préserver cette ampleur et sa tension contextuelle sans la transformer soit en exhaustivité absolue, soit en restriction explicitée.
translation_notes:
  register: Français international moderne, naturel et digne. « Soyez sur vos gardes » exprime clairement l’urgence de l’impératif pluriel; les deux-points relient l’exhortation à l’annonce préalable qui la motive.
