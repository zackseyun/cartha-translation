  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: fr
  text: Mais malheur aux femmes enceintes et à celles qui allaitent en ces jours-là !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: malheur à
  rationale: Conserve la force prophétique de l’exclamation, qui exprime à la fois la lamentation et l’annonce d’une détresse.
- source_word: δὲ
  choice: mais
  rationale: Marque la transition avec l’avertissement précédent sans imposer une opposition trop forte.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: aux femmes enceintes
  rationale: Rend naturellement en français l’expression idiomatique signifiant littéralement « celles qui ont dans le ventre ».
- source_word: ταῖς θηλαζούσαις
  choice: à celles qui allaiteront
  rationale: Exprime clairement l’action d’allaiter sous-entendue sans ajouter un objet absent du grec; le futur convient au cadre temporel annoncé.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: en ces jours-là
  rationale: Formulation française naturelle qui maintient le lien temporel avec les événements évoqués dans le contexte.
