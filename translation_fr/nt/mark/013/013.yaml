id: MRK.13.13
reference: Mark 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: fr
  text: Vous serez détestés de tous à cause de mon nom[a]. Mais celui qui tiendra bon jusqu’à la fin sera sauvé[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en raison de mon nom » ou « pour mon nom ».
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui persévérera » ou « celui qui restera ferme jusqu’à la fin ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sera délivré ». Le grec peut désigner la délivrance ou le salut ; le contexte laisse ouverte toute la portée du terme.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: détestés
  rationale: Avec ἔσεσθε, le participe forme une tournure périphrastique au futur. « Vous serez détestés » est naturel en français et garde la force de l’hostilité exprimée.
- source_word: ὑπὸ πάντων
  choice: de tous
  rationale: La formule conserve sans l’atténuer la portée générale de πάντων, tout en restant idiomatique en français.
- source_word: διὰ τὸ ὄνομά μου
  choice: à cause de mon nom
  rationale: διά avec l’accusatif indique ici la cause. Cette formulation claire garde « mon nom », qui renvoie à la personne de Jésus, à son autorité et à l’attachement envers lui.
- source_word: ὁ δὲ ὑπομείνας
  choice: Mais celui qui tiendra bon
  rationale: Le participe aoriste substantivé désigne la personne qui demeure ferme sous la pression. « Tiendra bon » rend ce sens dans un français actuel sans imposer un vocabulaire théologique spécialisé.
- source_word: εἰς τέλος
  choice: jusqu’à la fin
  rationale: La formule exprime la continuité jusqu’au terme sans préciser s’il s’agit de la fin de l’épreuve, de la vie ou de la fin eschatologique.
- source_word: οὗτος
  choice: implicite dans « celui qui… sera »
  rationale: Le pronom démonstratif reprend avec emphase le participe substantivé. La syntaxe française naturelle omet cette reprise explicite, tandis que la construction « celui qui… sera » en conserve suffisamment la mise en relief.
- source_word: σωθήσεται
  choice: sera sauvé
  rationale: σῴζω peut désigner la délivrance ou le salut dans un sens plus large. « Sera sauvé » préserve ici sa portée théologique sans en fixer excessivement la nuance.
theological_decisions:
- issue: Sens de σωθήσεται dans une parole sur l’endurance
  choice: sera sauvé
  alternative: sera délivré
  rationale: La formulation garde ouverte la portée du salut ou de la délivrance et n’impose ni une simple protection temporelle ni une doctrine confessionnelle particulière de la persévérance.
- issue: Portée de πάντων
  choice: de tous
  alternative: de tout le monde
  rationale: Le texte emploie une expression générale et frappante. La traduction la conserve sans ajouter de restriction explicative.
translation_notes:
  register: Français international moderne, clair et digne. « Détestés » exprime fortement μισέω sans archaïsme ; « tiendra bon » est courant mais suffisamment soutenu dans ce contexte. La reprise littérale « celui-ci » a été évitée pour préserver une syntaxe française naturelle.
