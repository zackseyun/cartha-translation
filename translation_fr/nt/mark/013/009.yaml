source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: fr
  text: 'Mais prenez garde à vous-mêmes : on vous livrera aux tribunaux, vous serez battus dans les synagogues, et vous comparaîtrez devant des gouverneurs et des rois à cause de moi, pour leur servir de témoignage[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour être un témoignage qui leur est adressé »; l’expression peut aussi signifier « comme témoignage contre eux ».
    reason: La tournure grecque peut désigner un témoignage adressé à ces autorités ou, dans un cadre judiciaire, un témoignage à charge contre elles.
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Mais prenez garde à vous-mêmes
  rationale: L’impératif présent appelle à une vigilance continue, et la forme renforcée ὑμεῖς ἑαυτούς met l’accent sur les disciples eux-mêmes. « Prenez garde à vous-mêmes » conserve la force de l’avertissement dans un français naturel.
- source_word: παραδώσουσιν ὑμᾶς
  choice: on vous livrera
  rationale: Dans ce contexte de persécution, le verbe désigne le fait de remettre quelqu’un aux autorités. Le sujet grec n’étant pas exprimé, le pronom indéfini « on » évite d’identifier arbitrairement les agents.
- source_word: εἰς συνέδρια
  choice: aux tribunaux
  rationale: Le pluriel désigne ici des conseils locaux exerçant une fonction judiciaire, et non nécessairement le seul Sanhédrin de Jérusalem. « Tribunaux » rend clairement leur rôle dans ce contexte.
- source_word: εἰς συναγωγὰς δαρήσεσθε
  choice: vous serez battus dans les synagogues
  rationale: Le futur passif de δέρω exprime des coups physiques sans préciser nécessairement leur instrument ou leur forme; « battus » préserve cette généralité. « Dans les synagogues » indique le cadre institutionnel ou le lieu de la punition.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: vous comparaîtrez devant des gouverneurs et des rois
  rationale: Le sens est celui d’une comparution imposée devant des autorités. « Comparaître » exprime naturellement en français la portée officielle et judiciaire de l’expression, tandis que « gouverneurs et rois » maintient les deux catégories distinctes.
- source_word: ἕνεκεν ἐμοῦ
  choice: à cause de moi
  rationale: La locution indique que le lien avec Jésus est la cause de la persécution. Cette formulation moderne conserve directement le rapport causal.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: pour leur servir de témoignage
  rationale: La formulation garde l’orientation du témoignage vers les autorités sans décider qu’il s’agit nécessairement d’un témoignage à charge. Elle demeure suffisamment ouverte pour conserver la portée potentiellement judiciaire du grec.
theological_decisions:
- issue: Portée de l’expression εἰς μαρτύριον αὐτοῖς
  choice: La comparution des disciples servira de témoignage adressé aux gouverneurs et aux rois.
  alternative: La comparution constituera un témoignage contre eux, dans un sens accusateur ou condamnatoire.
  rationale: Le datif αὐτοῖς permet naturellement de comprendre que le témoignage leur est destiné, mais le contexte judiciaire peut aussi suggérer un témoignage à charge. Le texte principal retient la formulation la moins restrictive et la note signale l’autre nuance possible.
translation_notes:
  register: Français international moderne, digne et direct. « Prenez garde à vous-mêmes » conserve l’insistance du grec; « comparaîtrez » rend idiomatiquement la scène officielle sans ajouter explicitement un agent coercitif. Le marqueur de note est placé après l’expression qu’il explique.
