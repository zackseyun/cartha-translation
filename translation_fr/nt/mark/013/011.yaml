review_pass:
  verdict: revise
  source_fidelity: La construction « pour vous livrer » risque d’attribuer au participe παραδιδόντες une valeur finale (« afin de ») que le grec n’impose pas. La coordination rend plus directement les deux actions liées. « Ce que vous devrez dire » ajoute une nuance d’obligation absente de τί λαλήσητε ; « ce que vous direz » conserve la référence à la parole à venir sans cet ajout.
  naturalness: La formulation révisée reste naturelle en français international moderne. « Mais dites » exprime simplement l’opposition de ἀλλά sans la coloration comparative additionnelle de « plutôt ».
  terminology: « Livrer », « l’Esprit Saint » et le passif « vous sera donné » sont exacts et de registre approprié. Aucun terme théologique ne demande de modification.
  issues:
  - severity: medium
    issue: « pour vous livrer » donne au participe une valeur de but.
    rationale: παραδιδόντες est un participe associé à ἄγωσιν et décrit l’action concomitante ou étroitement liée de remettre aux autorités ; il ne signifie pas explicitement « afin de vous livrer ».
  - severity: low
    issue: « vous devrez dire » ajoute une notion de nécessité.
    rationale: τί λαλήσητε interroge sur le contenu de la parole à venir, sans exprimer lexicalement l’obligation ; « ce que vous direz » est plus neutre.
  - severity: low
    issue: « plutôt » renforce l’opposition au-delà de ἀλλά.
    rationale: « Mais » rend l’adversative grecque sans suggérer une préférence comparative.
  revised_text: Et quand on vous emmènera et qu’on vous livrera, ne vous inquiétez pas d’avance de ce que vous direz ; mais dites ce qui vous sera donné à cette heure-là, car ce n’est pas vous qui parlerez, mais l’Esprit Saint.
