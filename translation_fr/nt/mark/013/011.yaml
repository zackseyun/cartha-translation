revisions:
- from: Et quand on vous emmènera pour vous livrer[a], ne vous inquiétez pas d’avance de ce que vous devrez dire. Dites plutôt ce qui vous sera donné à cette heure-là, car ce n’est pas vous qui parlerez, mais l’Esprit Saint.
  to: Et quand on vous emmènera et qu’on vous livrera, ne vous inquiétez pas d’avance de ce que vous direz ; mais dites ce qui vous sera donné à cette heure-là, car ce n’est pas vous qui parlerez, mais l’Esprit Saint.
  rationale: La révision élimine une valeur finale et une nuance d’obligation non explicites dans le grec, tout en conservant la temporalité future, le passif qui ne nomme pas le donateur, le contraste d’agentivité et l’expression usuelle « l’Esprit Saint ». La variante syntaxique signalée par la note n’est pas nécessaire à la compréhension et est supprimée avec l’ancre correspondante.
