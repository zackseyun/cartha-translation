source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: fr
  text: Et quand on vous emmènera et qu’on vous livrera, ne vous inquiétez pas d’avance de ce que vous direz ; mais dites ce qui vous sera donné à cette heure-là, car ce n’est pas vous qui parlerez, mais l’Esprit Saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Et quand
  rationale: Conserve le lien avec le discours précédent et présente la situation future attendue sans alourdir la phrase.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: on vous emmènera pour vous livrer
  rationale: Le sujet indéfini « on » convient naturellement en français. « Emmener » rend le déplacement contraint, tandis que « livrer » conserve la portée judiciaire de παραδίδωμι. Le participe peut exprimer ici l’action liée ou le but, sans imposer l’idée plus étroite de trahison.
- source_word: μὴ προμεριμνᾶτε
  choice: ne vous inquiétez pas d’avance
  rationale: Rend à la fois l’inquiétude et la valeur temporelle du préfixe προ- dans un français courant.
- source_word: τί λαλήσητε
  choice: de ce que vous devrez dire
  rationale: « Dire » est plus idiomatique que « parler » avec un complément interrogatif, tandis que le futur dans le passé convient à la situation anticipée.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: ce qui vous sera donné
  rationale: Préserve le passif et laisse implicite l’auteur du don, comme le grec.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: à cette heure-là
  rationale: Conserve l’image temporelle précise et solennelle tout en restant naturelle en français moderne.
- source_word: τοῦτο λαλεῖτε
  choice: Dites plutôt ce qui vous sera donné
  rationale: La reprise de la proposition relative évite le tour peu naturel « dites cela » tout en maintenant l’ordre de prononcer précisément ce qui sera donné. « Plutôt » marque l’opposition introduite par ἀλλά.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: car ce n’est pas vous qui parlerez
  rationale: La construction clivée restitue l’insistance portée par ὑμεῖς et maintient le contraste avec l’Esprit Saint.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Forme française moderne et largement reçue du titre, sans archaïsme.
theological_decisions:
- issue: Agent de la parole inspirée dans la persécution
  choice: Le texte attribue ultimement la parole à l’Esprit Saint, tout en commandant aux disciples de dire ce qui leur sera donné.
  alternative: Comprendre les disciples comme de simples instruments passifs, ou réduire l’Esprit Saint à une influence générale.
  rationale: La traduction conserve ensemble l’action réelle des disciples et l’initiative divine indiquée par le passif « sera donné » et par l’opposition « pas vous… mais l’Esprit Saint », sans transformer cette tension en théorie de dictée mécanique.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur est employé dans la situation introduite par « quand », conformément à l’usage français. La ponctuation sépare les deux consignes pour une lecture claire, sans supprimer leur opposition.
