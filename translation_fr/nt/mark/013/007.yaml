id: MRK.13.7
reference: Mark 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: fr
  text: Quand vous entendrez parler de guerres et de nouvelles de guerres[a], ne vous affolez pas. Il faut que cela arrive, mais ce ne sera pas encore la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des rumeurs de guerres ». Le grec peut désigner des nouvelles, des informations ou des rumeurs que l’on entend au sujet de guerres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Quand
  rationale: ὅταν introduit une circonstance temporelle future (« quand »), tandis que δέ assure ici une liaison légère que le français naturel n’a pas besoin d’expliciter.
- source_word: ἀκούσητε
  choice: vous entendrez parler de
  rationale: L’aoriste subjonctif régi par ὅταν reçoit naturellement en français une valeur future. « Entendre parler de » convient aux deux compléments qui suivent.
- source_word: πολέμους
  choice: guerres
  rationale: Équivalent direct et courant du pluriel πολέμους.
- source_word: ἀκοὰς πολέμων
  choice: nouvelles de guerres
  rationale: ἀκοή peut désigner ce qui est entendu, notamment des nouvelles, des rapports ou des rumeurs. « Nouvelles » reste large et n’implique pas nécessairement une information non vérifiée.
- source_word: μὴ θροεῖσθε
  choice: ne vous affolez pas
  rationale: Le verbe exprime le fait d’être troublé ou alarmé. « Ne vous affolez pas » restitue clairement l’idée de ne pas céder à la panique dans un français actuel.
- source_word: δεῖ γενέσθαι
  choice: Il faut que cela arrive
  rationale: δεῖ marque la nécessité et γενέσθαι signifie ici « arriver, se produire ». Le pronom « cela » reprend naturellement les guerres et les nouvelles évoquées.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: mais ce ne sera pas encore la fin
  rationale: Cette formulation française idiomatique conserve la valeur temporelle de οὔπω et la référence eschatologique de τέλος sans la préciser davantage.
theological_decisions:
- issue: Nécessité eschatologique exprimée par δεῖ γενέσθαι
  choice: Il faut que cela arrive
  alternative: Cela doit arriver
  rationale: « Il faut » maintient pleinement l’idée de nécessité divine ou prophétique sans expliquer son mécanisme ni imposer un système particulier concernant la fin des temps.
translation_notes:
  register: Français international moderne, clair et digne. « Ne vous affolez pas » est courant sans être familier; « nouvelles de guerres » préserve l’étendue sémantique de ἀκοὰς πολέμων. Le marqueur [a] figure bien dans le texte principal.
