id: MRK.13.27
reference: Mark 13:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: fr
  text: Et alors il enverra les anges et rassemblera ceux qui ont été choisis, des quatre vents[a], de l’extrémité de la terre jusqu’à l’extrémité du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « des quatre vents » signifie : de toutes les directions.'
    reason: cultural_note
  - marker: b
    text: 'La dernière expression peut aussi se comprendre de manière plus explicite : « des confins de la terre jusqu’aux confins du ciel » ou, selon une formulation traditionnelle, « d’une extrémité du ciel à l’autre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: alors
  rationale: Marque naturellement la succession temporelle dans le discours eschatologique.
- source_word: ἀποστελεῖ
  choice: il enverra
  rationale: Rend simplement le futur de ἀποστέλλω; le contexte implique que les anges sont envoyés pour accomplir une mission.
- source_word: ἀγγέλους
  choice: les anges
  rationale: Dans ce contexte apocalyptique, il s’agit d’êtres célestes plutôt que de messagers humains.
- source_word: ἐπισυνάξει
  choice: rassemblera
  rationale: Exprime l’action de réunir en un seul ensemble sans redondance.
- source_word: ἐκλεκτούς
  choice: ceux qui ont été choisis
  rationale: Rend l’adjectif substantivé et son idée de choix antérieur de façon transparente, sans en faire un terme doctrinal technique.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: des quatre vents
  rationale: Conserve l’image biblique grecque, qui évoque toutes les directions.
- source_word: ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ
  choice: de l’extrémité de la terre jusqu’à l’extrémité du ciel
  rationale: Préserve le parallélisme spatial et l’expression de totalité, sans transformer le ciel en affirmation doctrinale sur la demeure de Dieu.
theological_decisions:
- issue: Sens de ἐκλεκτούς dans le contexte eschatologique
  choice: ceux qui ont été choisis
  alternative: les élus
  rationale: La formulation retenue exprime le choix divin implicite tout en évitant qu’un terme traditionnel soit entendu exclusivement au sens d’un système doctrinal postérieur.
- issue: Étendue du rassemblement
  choice: des quatre vents, de l’extrémité de la terre jusqu’à l’extrémité du ciel
  alternative: de toutes les directions, d’un bout du monde à l’autre
  rationale: La traduction conserve à la fois l’image des quatre vents et la formulation cosmique du grec, sans réduire leur tension à une paraphrase géographique.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination conserve la progression du grec, tandis que les images spatiales restent volontairement concrètes et ouvertes.
