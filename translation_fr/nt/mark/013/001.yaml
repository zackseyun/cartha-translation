id: MRK.13.1
reference: Mark 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: fr
  text: 'Comme il sortait du temple[a], un de ses disciples lui dit : « Maître, regarde : quelles pierres impressionnantes et quels bâtiments impressionnants ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne l’ensemble du domaine du temple, avec ses cours et ses bâtiments, et non seulement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Comme il sortait
  rationale: Le génitif absolu avec participe présent exprime une action en cours, contemporaine de la parole du disciple. Cette tournure est naturelle en français.
- source_word: τοῦ ἱεροῦ
  choice: du temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du temple, et non uniquement le sanctuaire intérieur ; « temple » reste la formulation courante, avec une précision en note.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique de Marc est rendu au passé simple, conformément à l’usage naturel du récit écrit en français, sans modifier la chronologie de la scène.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: un de ses disciples
  rationale: Rendu direct et idiomatique de l’expression partitive.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe, « Maître » est le titre français courant pour un enseignant reconnu ; il conserve ici la fonction de Διδάσκαλε sans suggérer une formulation archaïque.
- source_word: ἴδε
  choice: regarde
  rationale: L’impératif attire directement l’attention de Jésus ; « regarde » est naturel en français moderne.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: quelles ... impressionnantes et quels ... impressionnants
  rationale: Dans cette construction exclamative, ποταπός exprime l’étonnement admiratif devant la qualité ou la grandeur. « Impressionnants » conserve cette force sans réduire le sens à la seule taille.
- source_word: λίθοι
  choice: pierres
  rationale: Traduction directe du nom, le contexte indiquant qu’il s’agit des pierres du complexe du temple.
- source_word: οἰκοδομαί
  choice: bâtiments
  rationale: Le pluriel désigne les diverses constructions du complexe du temple ; « bâtiments » est clair et courant.
