id: MRK.13.34
reference: Mark 13:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: fr
  text: C’est comme un homme parti en voyage, qui a quitté sa maison, donné à ses esclaves[a] de l’autorité, à chacun sa tâche, et ordonné au gardien de la porte de rester éveillé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs » ; le mot grec désigne des esclaves appartenant à une maisonnée et placés sous l’autorité de leur maître.
    reason: Préciser le statut social exprimé par δοῦλοι tout en signalant la traduction traditionnelle possible.
lexical_decisions:
- source_word: ὡς
  choice: C’est comme
  rationale: Cette formulation explicite naturellement en français la comparaison sous-entendue, sans en modifier le contenu.
- source_word: ἄνθρωπος ἀπόδημος
  choice: un homme parti en voyage
  rationale: ἄνθρωπος désigne ici le personnage masculin de l’illustration, et ἀπόδημος indique qu’il est absent de chez lui, en voyage.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: qui a quitté sa maison
  rationale: La proposition relative rend naturellement le participe aoriste et conserve le sens concret de οἰκία.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: donné autorité à ses esclaves
  rationale: « Donné autorité » reste proche de δίδωμι et d’ἐξουσία, tandis que « esclaves » rend sans atténuation le statut exprimé par δοῦλοι dans cette maisonnée.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: à chacun sa tâche
  rationale: Cette tournure concise conserve la construction distributive et rend ἔργον de façon idiomatique dans le contexte d’un travail assigné.
- source_word: τῷ θυρωρῷ
  choice: au gardien de la porte
  rationale: Cette expression française claire désigne celui qui surveille l’entrée d’une maison.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: ordonné […] de rester éveillé
  rationale: « Ordonné » préserve la force d’ἐντέλλομαι, et « rester éveillé » maintient l’image concrète de γρηγορέω ainsi que son appel à la vigilance.
theological_decisions:
- issue: Traduction de δοῦλος dans le cadre domestique de l’illustration
  choice: esclaves
  alternative: serviteurs
  rationale: Le rapport de dépendance et d’autorité appartient à l’image grecque. « Esclaves » traduit directement δοῦλοι sans l’adoucir; « serviteurs » demeure une possibilité de traduction plus traditionnelle, signalée en note.
- issue: Sens de γρηγορέω dans le discours eschatologique
  choice: rester éveillé
  alternative: rester vigilant
  rationale: Le choix principal conserve l’image littérale de l’éveil, tout en laissant résonner son sens figuré de vigilance sans le substituer au texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde le rythme de l’illustration grecque tout en employant des formulations naturelles; « gardien de la porte » évite le terme vieilli « portier », et « rester éveillé » conserve le motif verbal du contexte.
