id: MRK.13.30
reference: Mark 13:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: fr
  text: Vraiment, je vous le dis, cette génération ne passera certainement pas avant que toutes ces choses n’arrivent[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce peuple » ou « cette race »; le grec γενεά peut avoir des sens plus larges, bien que « génération » soit ici la traduction la plus naturelle.
    reason: lexical_alternative
  - marker: b
    text: La formulation « ne passera certainement pas » rend une négation particulièrement forte en grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Introduit une déclaration solennelle et pleine d’autorité. « Vraiment » est naturel en français moderne tout en conservant la force discursive de l’hébreu/grec « amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule française idiomatique qui conserve l’adresse directe et la solennité de la formulation grecque.
- source_word: οὐ μὴ παρέλθῃ
  choice: ne passera certainement pas
  rationale: La tournure οὐ μή avec le subjonctif aoriste exprime une négation particulièrement forte; « certainement pas » en rend clairement l’insistance.
- source_word: ἡ γενεὰ αὕτη
  choice: cette génération
  rationale: Dans ce contexte temporel, « génération » est le sens le plus naturel. Cette formulation préserve aussi la tension interprétative du passage sans imposer un système eschatologique.
- source_word: μέχρις οὗ
  choice: avant que
  rationale: La locution marque ici la limite temporelle jusqu’à laquelle la génération ne passera pas. La construction « ne… pas avant que » est naturelle en français et équivaut contextuellement à « jusqu’à ce que ».
- source_word: ταῦτα πάντα
  choice: toutes ces choses
  rationale: Rend explicitement le démonstratif pluriel accompagné de πᾶς et maintient son renvoi aux événements évoqués dans le discours.
- source_word: γένηται
  choice: n’arrivent
  rationale: Dans ce contexte, γίνομαι désigne des événements qui se produisent; « arriver » est clair, courant et digne en français moderne.
theological_decisions:
- issue: Sens de « cette génération » (ἡ γενεὰ αὕτη) dans le discours eschatologique
  choice: Traduction directe par « cette génération », sans développement interprétatif.
  alternative: « ce peuple » ou « cette race »; ou encore la génération future qui verra commencer les signes.
  rationale: Le grec se comprend le plus naturellement comme « cette génération ». Puisque l’expression fait l’objet d’un débat exégétique important, la traduction conserve la formulation et la tension du texte source au lieu de les résoudre selon une lecture eschatologique particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La formule initiale garde une certaine solennité; la syntaxe reste accessible. Les notes signalent l’étendue lexicale et l’emphase grammaticale sans résoudre le débat théologique.
