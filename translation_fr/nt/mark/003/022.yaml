source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: fr
  text: 'Les spécialistes de la Loi qui étaient descendus de Jérusalem disaient : « Il est possédé par Béelzéboul[a] », et : « C’est par le chef des démons[b] qu’il chasse les démons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Il a Béelzéboul. » On trouve aussi la graphie « Béelzébul ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par le prince des démons »; ou encore : « avec le pouvoir du chef des démons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte évangélique, le terme désigne des experts reconnus de la Loi juive, et non de simples copistes. Cette formulation est immédiatement compréhensible en français moderne.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: qui étaient descendus de Jérusalem
  rationale: La relative rend naturellement le participe grec et le plus-que-parfait situe leur arrivée avant leurs propos. « Descendus » conserve l’indication géographique traditionnelle liée à Jérusalem.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français restitue l’aspect continu ou répété de l’imparfait grec.
- source_word: Βεελζεβοὺλ
  choice: Béelzéboul
  rationale: Cette translittération française correspond directement à la forme grecque Βεελζεβούλ; la forme traditionnelle « Béelzébul » est signalée en note.
- source_word: ἔχει
  choice: Il a
  rationale: La traduction conserve l’idiome grec et son caractère abrupt, sans expliciter dans le corps du texte l’idée de possession ou de domination démoniaque.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: C’est par le chef des démons
  rationale: ἐν a ici une valeur instrumentale. La tournure clivée est idiomatique en français et met en relief le moyen allégué; « chef » exprime clairement l’autorité de ἄρχων.
- source_word: δαιμονίων / δαιμόνια
  choice: démons
  rationale: Le grec emploie δαιμόνιον; « démons » le rend directement sans importer l’expression distincte « esprits impurs ».
- source_word: ἐκβάλλει
  choice: chasse
  rationale: « Chasser les démons » est une expression française naturelle et consacrée qui exprime clairement l’expulsion visée par ἐκβάλλω.
theological_decisions:
- issue: Sens de l’accusation Βεελζεβοὺλ ἔχει
  choice: Il a Béelzéboul
  alternative: Il est possédé par Béelzéboul
  rationale: Le texte principal préserve l’idiome grec et sa tension interprétative. La note donne le sens contextuel plus explicite sans l’imposer dans le verset.
- issue: Valeur de ἐν devant ἄρχοντι
  choice: par le chef des démons
  alternative: avec le pouvoir du chef des démons
  rationale: La valeur instrumentale convient à l’accusation selon laquelle Jésus expulse les démons grâce à l’autorité de leur chef. La traduction évite le calque obscur « dans le chef ».
- issue: Traduction de ἄρχων
  choice: chef
  alternative: prince
  rationale: « Chef » est clair et actuel, tandis que « prince » risquerait d’évoquer d’abord un titre dynastique en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue les deux accusations coordonnées. Les notes conservent l’explicitation contextuelle de l’idiome ainsi que les formulations traditionnelles ou possibles.
