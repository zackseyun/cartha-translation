reference: Mark 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: fr
  text: 'Chaque fois que les esprits impurs le voyaient, ils tombaient devant lui[a] et criaient : « Tu es le Fils de Dieu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se jetaient devant lui ». Le verbe grec peut désigner le fait de tomber devant quelqu’un en signe de soumission ou de supplication.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: les esprits impurs
  rationale: « Impurs » rend directement ἀκάθαρτα et conserve sa portée rituelle et morale sans l’interpréter simplement comme « mauvais ».
- source_word: ὅταν
  choice: chaque fois que
  rationale: Avec les imparfaits qui suivent, ὅταν exprime une action répétée; « chaque fois que » en restitue clairement la valeur itérative.
- source_word: ἐθεώρουν
  choice: voyaient
  rationale: Dans ce récit, « voyaient » est naturel et suffit; la répétition est déjà exprimée par « chaque fois que ».
- source_word: προσέπιπτον αὐτῷ
  choice: se jetaient à ses pieds
  rationale: Cette formulation française exprime le mouvement physique de prosternation ou de chute devant Jésus, sans préciser qu’il s’agit d’adoration.
- source_word: ἔκραζον
  choice: criaient
  rationale: « Criaient » conserve l’intensité de κράζω dans un français narratif naturel.
- source_word: λέγοντα
  choice: — omission explicite après « criaient »
  rationale: En français, le deux-points introduit naturellement les paroles criées; ajouter « en disant » serait lourd et redondant.
- source_word: Σὺ εἶ
  choice: Tu es
  rationale: Le pronom sujet explicite en français donne naturellement l’énoncé direct, sans surcharger l’emphase grecque.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette traduction garde la forme de titre et toute la portée christologique de l’expression grecque.
theological_decisions:
- issue: Le geste des esprits devant Jésus indique-t-il explicitement une adoration ou seulement une prosternation?
  choice: Traduire par « se jetaient à ses pieds » sans employer « adoraient ».
  alternative: « se prosternaient devant lui » ou « l’adoraient »
  rationale: προσπίπτω décrit ici le fait de tomber devant quelqu’un, geste pouvant exprimer soumission, supplication ou révérence. Le texte ne qualifie pas explicitement ce geste d’adoration; la traduction conserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Chaque fois que » fait ressortir la répétition; « se jetaient à ses pieds » est idiomatique tout en évitant d’imposer l’idée d’adoration. Le point d’exclamation restitue la force du cri.
