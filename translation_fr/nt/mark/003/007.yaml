  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: fr
  text: Jésus se retira avec ses disciples vers la mer[a], et une grande foule de Galilée le suivit, ainsi que de Judée,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la mer de Galilée. Le texte grec dit simplement « la mer ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: se retira
  rationale: Le verbe exprime un départ qui peut comporter l’idée de se retirer devant une opposition ou une pression. « Se retira » conserve cette nuance sans la renforcer.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: avec ses disciples
  rationale: « Disciples » est le terme courant dans le contexte des Évangiles et rend la relation durable d’apprentissage et d’attachement à Jésus.
- source_word: πρὸς τὴν θάλασσαν
  choice: en direction de la mer
  rationale: πρός marque ici le mouvement vers un lieu. « En direction de » préserve cette valeur sans affirmer plus précisément que Jésus atteignit le rivage; « mer » traduit θάλασσα sans remplacer le terme du texte par « lac ».
- source_word: πολὺ πλῆθος
  choice: une foule nombreuse
  rationale: Cette expression française naturelle rend l’importance numérique indiquée par πολὺ tout en évitant le registre vieilli de « multitude ».
- source_word: ἠκολούθησεν
  choice: le suivit
  rationale: Le verbe décrit ici la foule qui suit Jésus dans son déplacement. Le pronom « le », implicite dans le grec, est nécessaire à l’expression française.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: depuis la Galilée
  rationale: ἀπό indique la provenance ou le point de départ des personnes qui suivent Jésus.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: et depuis la Judée,
  rationale: La répétition de « depuis » conserve la structure de la liste géographique. La virgule finale signale que cette liste se poursuit au verset suivant.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « En direction de la mer » conserve la portée directionnelle de πρός. La formulation et la ponctuation finale maintiennent le caractère inachevé de la liste, qui se poursuit au verset suivant.
