id: MRK.3.35
reference: Mark 3:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: fr
  text: Car quiconque fait la volonté de Dieu, celui-là[a] est mon frère, ma sœur et ma mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette personne ». Le grec emploie ici un démonstratif appuyé, littéralement « celui-là ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς … ἂν ποιήσῃ
  choice: quiconque fait
  rationale: Le relatif avec ἄν et le subjonctif aoriste exprime une condition générale indéfinie. « Quiconque fait » rend naturellement en français cette portée universelle et intemporelle.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente; « car » en conserve clairement la valeur logique.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: la volonté de Dieu
  rationale: Traduction directe, naturelle et fidèle à la structure grecque.
- source_word: οὗτος
  choice: celui-là
  rationale: Le démonstratif reprend avec insistance « quiconque »; « celui-là » préserve cette mise en relief mieux qu’un simple pronom.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: mon frère, ma sœur et ma mère
  rationale: Les trois termes concrets de parenté sont maintenus séparément afin de préserver l’effet cumulatif et la redéfinition frappante de la famille.
- source_word: ἐστίν
  choice: est
  rationale: Le singulier correspond au sujet singulier οὗτος et conserve la formulation directe du grec.
theological_decisions:
- issue: Représentation du genre dans le sujet singulier suivi de termes de parenté masculins et féminins
  choice: quiconque … celui-là
  alternative: la personne qui … cette personne
  rationale: « Quiconque » exprime sans restriction de sexe la portée générale de l’énoncé. « Celui-là » conserve ensuite la force démonstrative et le singulier du grec, tandis que la mention explicite de « ma sœur » et de « ma mère » empêche de comprendre l’énoncé comme réservé aux hommes.
- issue: Nature du langage familial de Jésus
  choice: maintien de « mon frère, ma sœur et ma mère »
  alternative: un membre de ma famille
  rationale: 'Les images concrètes de parenté doivent rester visibles: Jésus redéfinit ici l’appartenance familiale autour de l’accomplissement de la volonté de Dieu, sans réduire les trois désignations à une expression générale.'
translation_notes:
  register: Français moderne, digne et accessible. La tournure « quiconque … celui-là » est volontairement soutenue afin de préserver à la fois la généralité de la proposition et l’insistance du démonstratif grec.
