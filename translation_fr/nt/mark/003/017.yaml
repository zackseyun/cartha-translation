id: MRK.3.17
reference: Mark 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: fr
  text: et Jacques, fils de Zébédée, et Jean, frère de Jacques (il leur donna le nom[a] de Boanergès, ce qui signifie « Fils du tonnerre »),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « les noms » ; ce pluriel désigne probablement de manière collective un même surnom donné aux deux frères.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Jacques
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom Ἰάκωβος pour l’apôtre, bien que ce nom corresponde aussi étymologiquement à « Jacob ».
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: fils de Zébédée
  rationale: La construction grecque avec article et génitif indique ici naturellement la filiation.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française traditionnelle du nom Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: frère de Jacques
  rationale: ἀδελφός désigne ici le frère au sens familial concret.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: il leur donna le nom
  rationale: Avec ὀνόματα, ἐπιτίθημι signifie idiomatiquement attribuer ou donner un nom. Le singulier français est naturel puisqu’un même surnom est attribué aux deux frères; le pluriel grec est signalé en note.
- source_word: Βοανηργές
  choice: Boanergès
  rationale: Le surnom sémitique est translittéré, comme dans le texte source, puis expliqué par la proposition suivante.
- source_word: ὅ ἐστιν
  choice: ce qui signifie
  rationale: Cette formule introduit l’explication du surnom; la tournure retenue est claire et naturelle en français contemporain.
- source_word: Υἱοὶ Βροντῆς
  choice: Fils du tonnerre
  rationale: Traduction directe qui conserve l’image frappante et la forme sémitique « fils de ».
theological_decisions:
- issue: Présentation du surnom donné à Jacques et Jean
  choice: Conserver « Boanergès » et donner ensuite son sens, « Fils du tonnerre »
  alternative: Ne donner que la traduction française du surnom
  rationale: Le grec conserve à la fois la forme étrangère et son explication. Reproduire les deux respecte cette particularité narrative sans imposer d’interprétation doctrinale.
translation_notes:
  register: Français moderne, courant et digne. La phrase reste un fragment coordonné parce que le verset poursuit la liste commencée au verset précédent. Les guillemets français distinguent clairement la traduction explicative du surnom.
