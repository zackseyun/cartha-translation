  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: fr
  text: Il établit les Douze[a] et donna à Simon le nom de Pierre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « Il établit les Douze et ».
    reason: variante_textuelle
  - marker: b
    text: Le grec Petros signifie « pierre » ou « rocher ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἐποίησεν
  choice: établit
  rationale: Le verbe signifie littéralement « fit », mais, dans ce contexte, il exprime la constitution des disciples en groupe reconnu. « Établit » rend cette portée sans introduire un vocabulaire ecclésiastique plus tardif.
- source_word: τοὺς δώδεκα
  choice: les Douze
  rationale: L’expression désigne ici le groupe reconnu des douze disciples. La majuscule, naturelle en français pour cette désignation collective, ne change pas le sens du grec.
- source_word: ἐπέθηκεν ὄνομα
  choice: donna … le nom de
  rationale: Cette tournure française idiomatique conserve explicitement l’acte d’attribuer un nom, exprimé littéralement en grec par « posa un nom sur ».
- source_word: Σίμωνι
  choice: Simon
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: Πέτρον
  choice: Pierre
  rationale: Puisqu’il s’agit d’un nom propre donné à Simon, la forme française traditionnelle « Pierre » convient dans le texte. La signification du nom grec est indiquée en note.
theological_decisions:
- issue: Portée de l’action de Jésus envers les Douze
  choice: établit les Douze
  alternative: fit les Douze ; désigna les Douze
  rationale: « Établit » exprime que Jésus constitue ce groupe comme tel, tout en évitant de préciser une fonction institutionnelle au-delà de ce que dit le grec.
- issue: Traitement du nom Πέτρος
  choice: Pierre
  alternative: Rocher
  rationale: Le terme fonctionne ici comme un nom propre. La traduction garde donc la forme française usuelle et réserve sa valeur sémantique à une note, sans imposer dans le texte une interprétation théologique de cette désignation.
translation_notes:
  register: Français international moderne, simple et digne. La coordination directe suit la structure grecque. La virgule finale est conservée parce que le verset se poursuit syntaxiquement au verset suivant.
