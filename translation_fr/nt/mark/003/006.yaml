  naturalness: Le français est clair et de registre narratif digne. « Se concerter » et « faire périr » sont recevables en français international moderne. La formulation « sur la manière de » est plus directe et idiomatique dans cette construction.
  terminology: « Pharisiens », « Hérodiens » et « faire périr » sont appropriés. La note préserve utilement les rendus français plus explicitement létaux de ἀπολέσωσιν sans imposer un resserrement lexical dans le texte.
