  rationale: La révision conserve la concertation hostile, l’immédiateté et le sens potentiellement létal de ἀπολέσωσιν. Elle rend plus directement la fonction de ὅπως comme expression de la manière envisagée pour éliminer Jésus, sans surinterpréter la syntaxe par une finalité distincte.
