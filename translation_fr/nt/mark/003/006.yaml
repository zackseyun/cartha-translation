source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: fr
  text: Les pharisiens sortirent et, aussitôt, se concertèrent avec les hérodiens contre Jésus, sur la manière de le faire périr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement dans ce contexte : « le tuer » ou « le mettre à mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: sortirent
  rationale: Le participe aoriste exprime ici une action liée au verbe principal; une forme verbale coordonnée est naturelle en français narratif et conserve le mouvement hors du lieu précédent.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme fréquent chez Marc imprime au récit son caractère urgent; « aussitôt » le restitue dans un français courant et digne.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: avec les hérodiens
  rationale: μετά suivi du génitif marque l’association. « Hérodiens » est la désignation française habituelle des partisans ou alliés du pouvoir hérodien.
- source_word: συμβούλιον ἐδίδουν
  choice: ils se concertèrent
  rationale: L’expression idiomatique signifie tenir conseil ou se consulter. Le contexte hostile lui donne une portée conspiratrice, sans que le français ait besoin d’ajouter explicitement « comploter ».
- source_word: κατ’ αὐτοῦ
  choice: contre Jésus
  rationale: κατά suivi du génitif a ici une valeur hostile. La reprise du nom « Jésus » évite une succession de pronoms potentiellement lourde ou ambiguë en français.
- source_word: ὅπως
  choice: afin de trouver comment
  rationale: Avec le subjonctif, ὅπως introduit le but tout en s’intégrant au contenu de leur délibération. Cette formulation française rend à la fois l’intention et la recherche du moyen.
- source_word: ἀπολέσωσιν
  choice: le faire périr
  rationale: Dans ce contexte, ἀπόλλυμι vise vraisemblablement la mort de Jésus, tout en conservant une nuance plus large d’élimination ou de destruction. « Faire périr » exprime clairement l’issue mortelle sans réduire le terme au seul verbe « tuer ».
theological_decisions:
- issue: Faut-il rendre explicitement homicidaire l’intention des chefs dans le texte principal?
  choice: Employer « le faire périr » dans le texte principal.
  alternative: « le tuer » ou « le mettre à mort »
  rationale: Le contexte rend l’intention meurtrière manifeste, mais ἀπόλλυμι possède une portée lexicale plus large que « tuer ». « Faire périr » préserve cette tension tout en indiquant naturellement une issue mortelle; la note donne les formulations plus explicites.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase évite le calque « donner conseil » et emploie « se concerter », naturel sans être familier. « Hérodiens » est conservé comme terme historique usuel.
