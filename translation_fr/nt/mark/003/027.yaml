id: MRK.3.27
reference: Mark 3:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: fr
  text: Mais personne ne peut entrer dans la maison de l’homme fort et piller ses biens[a], s’il ne ligote d’abord l’homme fort[b] ; alors il pillera sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses possessions » ; plus littéralement, « ses objets » ou « ses ustensiles ».
    reason: lexical_alternative
  - marker: b
    text: Dans cette comparaison, « l’homme fort » représente Satan, que Jésus est en train de vaincre ; l’image est conservée dans le texte principal.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque naturellement le contraste avec l’accusation précédente et introduit la réfutation de Jésus.
- source_word: οὐδεὶς δύναται
  choice: personne ne peut
  rationale: Expression française courante qui conserve clairement l’idée d’impossibilité.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν
  choice: entrer dans la maison de l’homme fort
  rationale: Rend naturellement le participe grec dans la construction régie par « peut », tout en conservant l’image concrète de la maison et la séquence de l’action.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: l’homme fort
  rationale: L’adjectif grec est substantivé. Cette formulation française claire et idiomatique préserve sa répétition et l’image de la comparaison.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ses biens
  rationale: Dans le contexte du pillage d’une maison, σκεύη désigne les objets ou possessions qui s’y trouvent. « Biens » est naturel sans réduire le terme aux seuls récipients.
- source_word: διαρπάσαι / διαρπάσει
  choice: piller / pillera
  rationale: Le verbe exprime l’action de s’emparer des biens par la force. La répétition française correspond à celle du grec.
- source_word: ἐὰν μὴ πρῶτον
  choice: s’il ne… d’abord
  rationale: Conserve la condition nécessaire et la priorité temporelle exprimées dans le grec.
- source_word: δήσῃ
  choice: ligote
  rationale: Rend de manière vive et actuelle l’action concrète d’attacher et d’immobiliser quelqu’un dans l’image d’une maison pillée.
- source_word: καὶ τότε
  choice: alors
  rationale: Indique simplement que le pillage devient possible après que la condition préalable a été remplie.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: il pillera sa maison
  rationale: Conserve le futur ainsi que l’image répétée de la maison, laquelle peut évoquer ici tout le domaine de l’homme fort.
theological_decisions:
- issue: Portée métaphorique de « l’homme fort » dans l’argument de Jésus au sujet de Satan
  choice: Conserver la métaphore dans le texte principal et signaler son référent contextuel en note.
  alternative: Remplacer directement « l’homme fort » par « Satan » ou traduire de façon abstraite par « le puissant ».
  rationale: Le contexte permet de comprendre que l’homme fort représente Satan, mais le grec formule une image. La traduction doit préserver cette image sans intégrer son interprétation au texte même.
translation_notes:
  register: Français international moderne, digne et accessible. « Ligote » maintient la vivacité de l’image sans archaïsme ; « piller » conserve la force du verbe grec. Les deux occurrences de « l’homme fort » et de « piller » sont volontairement répétées afin de refléter la structure du texte source.
