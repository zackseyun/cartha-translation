  source_fidelity: La condition est bien rendue, ainsi que l’opposition de Satan contre lui-même et l’impossibilité de durer. Toutefois, « s’est divisé » transforme plus nettement le passif ἐμερίσθη en action réflexive de Satan, tandis que « touche à sa fin » introduit l’idée progressive de proximité (« est en train d’approcher sa fin »), moins directe que ἀλλὰ τέλος ἔχει.
  naturalness: Le français est globalement naturel et de registre sobre. « Est divisé » exprime idiomatiquement l’état résultant et conserve mieux l’indétermination du passif grec. « C’en est fini de lui » est une conclusion française concise et naturelle dans ce raisonnement conditionnel.
  terminology: « Satan », « se dresser contre lui-même » et « subsister » conviennent au français international moderne et au contexte rhétorique. La révision ne charge pas la phrase d’une affirmation eschatologique au-delà de l’argument hypothétique.
