id: MRK.3.26
reference: Mark 3:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: fr
  text: 'Et si Satan s’est dressé contre lui-même et est divisé, il ne peut pas subsister : c’en est fini de lui.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mais il a une fin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satan
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: s’est dressé contre lui-même
  rationale: « Se dresser contre » exprime naturellement en français l’idée d’une opposition hostile, tout en conservant l’image du verbe grec.
- source_word: ἐμερίσθη
  choice: s’est divisé
  rationale: Le verbe désigne ici une division interne. La tournure pronominale est naturelle en français dans cette hypothèse où Satan agit contre lui-même.
- source_word: οὐ δύναται στῆναι
  choice: il ne peut pas subsister
  rationale: Dans ce contexte, στῆναι évoque la capacité de continuer à tenir ou à durer. « Subsister » rend clairement cet emploi idiomatique.
- source_word: ἀλλὰ τέλος ἔχει
  choice: il touche à sa fin
  rationale: Cette formulation française exprime la conséquence immédiate de la division sans transformer la phrase en déclaration eschatologique plus développée. Une note conserve la formulation grecque plus littérale.
theological_decisions:
- issue: Portée de l’affirmation concernant la chute de Satan
  choice: Présenter la fin de Satan comme la conséquence logique de l’hypothèse formulée par Jésus
  alternative: Formuler une déclaration absolue telle que « c’en est fini de lui »
  rationale: Le verset s’inscrit dans un raisonnement montrant qu’un pouvoir satanique divisé contre lui-même ne saurait durer. La traduction ne doit pas préciser au-delà du grec le calendrier ou la nature de la défaite finale de Satan.
translation_notes:
  register: Français international moderne, sobre et digne. « Se dresser contre » et « subsister » conservent la force rhétorique de l’argument, tandis que la note signale la formulation concise et potentiellement ambiguë du grec.
