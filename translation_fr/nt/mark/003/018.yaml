id: MRK.3.18
reference: Mark 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: fr
  text: ainsi qu’André, Philippe, Barthélemy, Matthieu, Thomas, Jacques, fils d’Alphée, Thaddée et Simon le Cananéen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « le Cananéen ». Ce qualificatif transcrit vraisemblablement un terme araméen signifiant « zélote », comme en Luc 6.15 ; il ne désigne probablement pas une origine cananéenne.
    reason: Préciser le sens probable d’un qualificatif grec susceptible d’être compris à tort comme une indication ethnique.
lexical_decisions:
- source_word: καὶ
  choice: ainsi que / et
  rationale: Le premier καὶ rattache ce verset à la liste commencée auparavant et se rend naturellement par « ainsi que » ; les autres coordinations grecques sont exprimées selon l’usage français par des virgules et un dernier « et ».
- source_word: Ἀνδρέαν, Φίλιππον, Βαρθολομαῖον, Μαθθαῖον, Θωμᾶν, Θαδδαῖον
  choice: André, Philippe, Barthélemy, Matthieu, Thomas, Thaddée
  rationale: Formes françaises courantes des noms propres bibliques.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Jacques, fils d’Alphée
  rationale: La construction avec le génitif identifie Jacques par son père ; « fils d’Alphée » l’explicite clairement en français.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Simon le Cananéen
  rationale: Cette forme reproduit directement le qualificatif grec de Marc sans en résoudre silencieusement l’arrière-plan sémitique ; une note explique son sens probable.
theological_decisions:
- issue: Sens du qualificatif Καναναῖος appliqué à Simon
  choice: Conserver « le Cananéen » dans le texte et signaler en note le sens probable « le Zélote »
  alternative: Simon le Zélote
  rationale: Le texte de Marc porte Καναναῖος, tandis que Luc 6.15 emploie ζηλωτής. La traduction retenue respecte la forme propre à Marc et préserve la tension lexicale, tout en évitant que le lecteur ne prenne nécessairement ce qualificatif pour une origine ethnique.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition grecque de καὶ est allégée conformément à la syntaxe naturelle du français, sans perdre la structure de la liste.
