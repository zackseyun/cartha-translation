  text: καὶ ἔχειν ⸀ἐξουσίαν ἐκβάλλειν τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: fr
  text: et avoir autorité pour chasser les démons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expulser les démons ».
    reason: Variante lexicale qui fait ressortir plus explicitement l’idée d’expulsion portée par ἐκβάλλειν.
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination naturelle, qui relie cet infinitif aux éléments précédents de la mission confiée aux Douze.
- source_word: ἔχειν
  choice: avoir
  rationale: Équivalent français direct et naturel de l’infinitif présent ἔχειν dans cette série.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: Le terme désigne ici l’autorité conférée ou la capacité légitime d’agir, plutôt que la seule puissance brute.
- source_word: ἐκβάλλειν
  choice: chasser
  rationale: Dans un contexte d’exorcisme, « chasser » exprime clairement l’expulsion et correspond à l’usage courant du français biblique moderne.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: Rend précisément δαιμόνια, sans lui substituer l’expression distincte « esprits impurs » employée ailleurs.
theological_decisions:
- issue: Nature de ἐξουσία dans la mission des disciples
  choice: autorité
  alternative: puissance
  rationale: « Autorité » met en valeur une capacité d’agir conférée par Jésus, sans nier la puissance surnaturelle qu’implique l’expulsion des démons.
translation_notes:
  register: Français moderne, simple et digne. La tournure « avoir autorité pour » est naturelle et conserve la structure infinitive ainsi que l’idée d’une autorité reçue.
