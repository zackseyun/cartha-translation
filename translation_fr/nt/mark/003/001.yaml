  rationale: La révision remplace « paralysée » par « atrophiée », qui rend l’état durable exprimé par le participe parfait ἐξηραμμένην sans introduire le sens médical distinct de paralysie. La phrase est légèrement restructurée pour un enchaînement français naturel tout en conservant la localisation de ἐκεῖ. Les deux ancres de notes restent correctement attachées à leurs expressions respectives.
