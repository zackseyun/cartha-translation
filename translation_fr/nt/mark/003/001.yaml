source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: fr
  text: Il entra de nouveau dans une synagogue[a], où se trouvait un homme qui avait la main atrophiée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la synagogue », si Marc désigne une synagogue précise déjà connue dans le contexte.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « desséchée » ; on peut aussi traduire « flétrie » ou « atrophiée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: il entra
  rationale: L’aoriste narratif de εἰσέρχομαι exprime simplement l’entrée dans le lieu; le passé simple convient au registre narratif biblique en français.
- source_word: πάλιν
  choice: de nouveau
  rationale: πάλιν marque la répétition. « De nouveau » est naturel et évite une position ambiguë de « encore ».
- source_word: εἰς συναγωγήν
  choice: dans une synagogue
  rationale: Avec un verbe de mouvement, « entrer dans » rend naturellement εἰς. L’absence d’article devant συναγωγήν favorise l’indéfini, sans exclure qu’il s’agisse d’une synagogue déjà connue.
- source_word: ἦν ἐκεῖ
  choice: il y avait là
  rationale: Cette tournure française introduit naturellement le personnage tout en rendant explicitement la localisation exprimée par ἐκεῖ.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans cette scène, ἄνθρωπος désigne un individu de sexe masculin; « un homme » est précis et naturel.
- source_word: ἐξηραμμένην
  choice: paralysée
  rationale: Le participe parfait décrit l’état durable d’une main desséchée ou atrophiée. « Paralysée » communique clairement le handicap en français courant, tandis qu’une note conserve l’image lexicale du grec.
- source_word: ἔχων τὴν χεῖρα
  choice: dont la main était paralysée
  rationale: La relative rend idiomatiquement la construction participiale grecque et respecte l’article possessif naturel du français pour une partie du corps.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la narration écrite; la seconde phrase évite une coordination lourde. Les notes préservent l’indétermination de συναγωγήν et l’image concrète de ἐξηραμμένην.
