  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: fr
  text: Et si un royaume est divisé contre lui-même, ce royaume ne peut pas tenir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui maintient le lien direct avec l’argument précédent.
- source_word: ἐὰν
  choice: si
  rationale: Introduit naturellement en français la condition exprimée avec le subjonctif grec.
- source_word: βασιλεία
  choice: royaume
  rationale: Désigne ici une entité collective et politique, plutôt que l’exercice abstrait d’un règne.
- source_word: ἐφ’ ἑαυτὴν
  choice: contre lui-même
  rationale: Rend l’idée d’une opposition interne et s’accorde avec le nom masculin « royaume » en français.
- source_word: μερισθῇ
  choice: est divisé
  rationale: Conserve la voix passive et exprime clairement la désunion sans en préciser la cause.
- source_word: οὐ δύναται
  choice: ne peut pas
  rationale: Formulation française courante et exacte de l’incapacité exprimée.
- source_word: σταθῆναι
  choice: tenir
  rationale: Préserve la métaphore de ce qui demeure debout tout en exprimant naturellement la capacité de subsister.
- source_word: ἡ βασιλεία ἐκείνη
  choice: ce royaume
  rationale: La reprise du nom avec le démonstratif conserve l’insistance rhétorique du grec.
theological_decisions:
- issue: Portée de l’énoncé
  choice: Le rendre comme un principe général employé dans l’argument de Jésus.
  alternative: L’expliciter comme une affirmation doctrinale plus large sur les pouvoirs politiques ou sur Satan.
  rationale: Le verset formule une analogie dans la réfutation en cours; la traduction en préserve la force proverbiale sans élargir ce qu’il affirme.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « royaume » est maintenue pour reproduire l’effet rhétorique du texte grec; « tenir » conserve la métaphore tout en restant idiomatique.
