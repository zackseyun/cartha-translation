source:
  edition: SBLGNT
  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: fr
  text: et Judas Iscariote, qui le livra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui le trahit ». Le verbe grec peut signifier « remettre » ou « livrer » ; dans ce contexte, « trahir » exprime le sens de l’acte de Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction simple reliant le dernier nom à la liste précédente.
- source_word: Ἰούδαν
  choice: Judas
  rationale: Forme française traditionnelle du nom propre.
- source_word: Ἰσκαριώθ
  choice: Iscariote
  rationale: Translittération française conventionnelle de cette désignation, dont l’étymologie demeure incertaine dans ce contexte.
- source_word: ὃς καὶ
  choice: celui qui
  rationale: Cette tournure française identifie naturellement Judas par l’acte qui suit; le second καί est compris comme ajout caractérisant, sans qu’un « aussi » explicite soit nécessaire en français.
- source_word: παρέδωκεν
  choice: livra
  rationale: Le verbe signifie fondamentalement « remettre » ou « livrer ». Ici, l’action de Judas implique la trahison, mais « livra » conserve la portée lexicale du grec et l’écho narratif de la remise de Jésus aux autorités.
- source_word: αὐτόν
  choice: le
  rationale: Pronom complément renvoyant à Jésus.
theological_decisions:
- issue: Traduction de παραδίδωμι pour l’action de Judas envers Jésus
  choice: livra
  alternative: trahit
  rationale: « Trahit » exprime justement la portée morale contextuelle, tandis que « livra » reste plus proche du sens lexical et préserve le motif narratif de Jésus remis aux autorités. La note rend explicite l’implication de trahison sans réduire le verbe à cette seule nuance.
translation_notes:
  register: Français international moderne, sobre et digne. « Celui qui » clôt naturellement la liste tout en mettant en relief l’identification de Judas. Le passé simple « livra » convient au registre narratif biblique sans être archaïque.
