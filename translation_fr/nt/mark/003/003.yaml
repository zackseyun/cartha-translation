  source_fidelity: 'La forme « qui avait » ne reflète pas le participe présent ἔχοντι et affaiblit inutilement le présent historique de λέγει. Surtout, « paralysée » impose un diagnostic que ξηράν ne précise pas : le terme décrit littéralement une main « sèche/desséchée », vraisemblablement atrophiée ou privée d''usage dans ce contexte, sans déterminer la cause médicale.'
