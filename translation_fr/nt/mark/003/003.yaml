  text: καὶ λέγει τῷ ἀνθρώπῳ τῷ ⸂τὴν χεῖρα ἔχοντι ξηράν⸃· ⸀Ἔγειρε εἰς τὸ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: fr
  text: 'Et il dit à l’homme qui a la main desséchée[a] : « Lève-toi et viens au milieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui a la main sèche ». Le grec décrit une main infirme ou desséchée, sans en préciser le diagnostic.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique conserve le style narratif vif caractéristique de Marc et se rend naturellement en français au présent.
- source_word: ἀνθρώπῳ
  choice: l’homme
  rationale: Le contexte désigne un individu de sexe masculin; « l’homme » correspond précisément au référent.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: qui avait la main paralysée
  rationale: En français courant, « la main paralysée » exprime clairement l’état invalidant désigné par l’image grecque d’une main « sèche », sans suggérer simplement une peau desséchée.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: L’impératif de ἐγείρω appelle l’homme à se mettre debout; « Lève-toi » est direct et idiomatique.
- source_word: εἰς τὸ μέσον
  choice: viens au milieu
  rationale: La tournure rend le mouvement vers l’espace central exprimé par εἰς, dans un français naturel. Le verbe « viens » est implicité dans le commandement spatial plutôt qu’explicitement présent dans le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le présent historique de Marc est conservé. « Paralysée » privilégie l’intelligibilité, tandis que la note maintient l’image littérale et l’indétermination médicale du grec.
