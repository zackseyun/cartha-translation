id: MRK.3.34
reference: Mark 3:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: fr
  text: 'Puis, promenant son regard sur ceux qui étaient assis en cercle autour de lui, il dit : « Voici ma mère et mes frères[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs ». Le grec dit littéralement « frères », mais le groupe réuni autour de Jésus pouvait aussi comprendre des femmes.
    reason: Alternative lexicale signalant la portée potentiellement inclusive du masculin pluriel grec.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: promenant son regard
  rationale: Cette tournure française naturelle exprime le regard délibérément porté tout autour par Jésus, tout en rendant le participe aoriste qui précède le verbe principal.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: ceux qui étaient assis en cercle autour de lui
  rationale: 'La formulation conserve les trois éléments de la phrase grecque : la position assise, la disposition circulaire et la proximité autour de Jésus.'
- source_word: λέγει
  choice: il dit
  rationale: En français narratif, le présent « il dit » restitue naturellement le présent historique caractéristique de Marc.
- source_word: Ἴδε
  choice: Voici
  rationale: « Voici » est un déictique actuel et digne qui attire l’attention sur les personnes désignées, sans l’archaïsme de « voici que » ou d’une formule plus solennelle.
- source_word: μήτηρ
  choice: mère
  rationale: Équivalent lexical direct, pleinement naturel dans ce contexte familial.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel explicite du grec est conservé. Une note signale que, dans le contexte du groupe entourant Jésus, le terme peut avoir une portée incluant aussi des femmes.
theological_decisions:
- issue: Portée du terme familial masculin ἀδελφοί dans un groupe de disciples susceptible de comprendre des femmes
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal garde la forme masculine du grec sans décider que seuls des hommes sont visés. La note préserve la possibilité contextuelle d’une désignation plus large.
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique « il dit » maintient la vivacité du récit de Marc ; « promenant son regard » évite une formulation pesante tout en conservant l’action visuelle délibérée.
