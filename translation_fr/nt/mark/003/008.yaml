  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: fr
  text: et de Jérusalem, et de l’Idumée, et de l’autre côté du Jourdain[a], et des environs de Tyr et de Sidon[b], des gens vinrent à lui en très grand nombre, ayant entendu tout ce qu’il faisait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’au-delà du Jourdain ». L’expression grecque désigne la région située de l’autre côté du Jourdain.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « autour de Tyr et de Sidon » : il s’agit des territoires environnants, pas nécessairement des villes elles-mêmes.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ce qu’il faisait ». Le pronom grec peut avoir ici un sens global.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: de Jérusalem
  rationale: ἀπό avec le génitif exprime ici la provenance; le nom de lieu reçoit sa forme française traditionnelle.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: de l’Idumée
  rationale: Cette formulation conserve la provenance géographique et emploie le nom français usuel de la région.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: de l’autre côté du Jourdain
  rationale: πέραν avec le génitif désigne la région située au-delà du fleuve, sans préciser davantage son étendue.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: des environs de Tyr et de Sidon
  rationale: περί à valeur spatiale renvoie aux territoires entourant ces villes, et non nécessairement aux villes seules.
- source_word: πλῆθος πολύ
  choice: des gens … en très grand nombre
  rationale: Cette tournure naturelle rend l’idée d’une foule très nombreuse tout en permettant de conserver au pluriel les personnes qui entendent et viennent, comme dans la construction grecque selon le sens.
- source_word: ἀκούοντες
  choice: ayant entendu parler
  rationale: Le participe présent est conservé sans imposer explicitement une relation seulement temporelle ou causale; «entendre parler» convient au contexte de nouvelles rapportées sur les actes de Jésus.
- source_word: ὅσα ἐποίει
  choice: tout ce qu’il faisait
  rationale: ὅσα peut avoir une portée globale, tandis que l’imparfait ἐποίει présente une activité en cours ou répétée.
- source_word: ἦλθον πρὸς αὐτόν
  choice: vinrent à lui
  rationale: La formule rend directement le mouvement vers Jésus exprimé par ἔρχομαι suivi de πρός et de l’accusatif.
- source_word: καὶ … καὶ … καὶ
  choice: et … et … et
  rationale: La répétition de «et» conserve l’effet cumulatif caractéristique de l’énumération de Marc.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve le « et » initial parce qu’il poursuit l’énumération commencée au verset précédent. La structure grecque associe un nom collectif singulier à des formes verbales au pluriel; la formulation « des gens … en très grand nombre » restitue naturellement en français à la fois la foule et l’accord selon le sens.
