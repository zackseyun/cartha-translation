  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: fr
  text: Et ils l’observaient attentivement pour voir s’il guérirait cet homme le jour du sabbat, afin de l’accuser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετήρουν
  choice: ils l’observaient attentivement
  rationale: L’imparfait exprime une action prolongée, et παρατηρέω désigne ici une observation soutenue et soupçonneuse. Cette formulation reste naturelle en français sans expliciter davantage l’hostilité que ne le fait le contexte.
- source_word: εἰ
  choice: pour voir si
  rationale: Après un verbe d’observation, cette tournure française rend naturellement la question indirecte introduite par εἰ.
- source_word: τοῖς σάββασιν
  choice: le jour du sabbat
  rationale: Le datif pluriel grec peut désigner idiomatiquement le sabbat. En français moderne, le singulier avec « le jour du sabbat » est clair et naturel, tandis qu’un calque au pluriel serait trompeur dans ce contexte.
- source_word: θεραπεύσει
  choice: guérirait
  rationale: Le futur de l’indicatif dans une question indirecte dépendant d’un verbe au passé se rend naturellement par le conditionnel présent en français.
- source_word: αὐτόν
  choice: cet homme
  rationale: Le pronom renvoie à l’homme mentionné au verset précédent. « Cet homme » évite l’enchaînement ambigu de deux pronoms masculins français qui pourraient tous deux sembler renvoyer à Jésus.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: afin de pouvoir l’accuser
  rationale: ἵνα avec le subjonctif exprime le but. « L’accuser » conserve la portée potentiellement judiciaire de κατηγορέω sans supposer une procédure formelle; « pouvoir » rend naturellement le fait qu’ils cherchent un motif d’accusation.
theological_decisions:
- issue: Intention de ceux qui observent Jésus
  choice: Une surveillance visant à trouver matière à accusation
  alternative: Une procédure judiciaire formelle visant à le poursuivre
  rationale: Le contexte et le vocabulaire indiquent une intention hostile, mais le texte ne décrit pas encore explicitement une poursuite judiciaire organisée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’aspect duratif de l’imparfait et le but hostile de l’observation. Aucun marqueur de note n’est nécessaire, car le pluriel grec « sabbats » fonctionne ici idiomatiquement et ne produit pas en français une variante de sens utile au lecteur.
