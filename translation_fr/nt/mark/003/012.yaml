id: MRK.3.12
reference: Mark 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: fr
  text: Et il leur ordonnait avec insistance de ne pas le faire connaître[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le révéler », « le rendre public » ou, plus formellement, « le rendre manifeste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: avec insistance
  rationale: Employé adverbialement avec ἐπετίμα, le neutre pluriel peut exprimer l’intensité ou la répétition. « Avec insistance » rend naturellement la force de l’action sans imposer l’idée de plusieurs commandements distincts.
- source_word: ἐπετίμα
  choice: ordonnait
  rationale: Dans ce contexte, le verbe désigne une parole autoritaire et contraignante adressée aux esprits impurs. « Ordonnait » convient à la défense qui suit, tandis que « avec insistance » en restitue la vigueur.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif pluriel renvoie aux esprits impurs mentionnés dans le contexte immédiat.
- source_word: ἵνα μὴ
  choice: de ne pas
  rationale: Cette tournure introduit ici le contenu ou le but de l’ordre; l’infinitif négatif est idiomatique en français moderne.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: le faire connaître
  rationale: L’expression signifie rendre quelqu’un manifeste, connu ou public. « Le faire connaître » est clair et naturel tout en maintenant l’objet exact de la défense sans précision ajoutée.
theological_decisions:
- issue: Nature de l’ordre donné par Jésus aux esprits impurs
  choice: La formulation interdit de faire connaître Jésus, sans préciser davantage ce qui devait être révélé à son sujet.
  alternative: Préciser qu’ils ne devaient pas révéler qu’il est le Fils de Dieu, ou comprendre seulement un ordre général de se taire.
  rationale: Le contexte immédiat concerne l’identité de Jésus, mais le verset dit seulement de ne pas « le faire connaître ». La traduction n’importe donc aucune confession christologique supplémentaire et conserve la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « ordonnait » rend l’aspect imperfectif de ἐπετίμα et peut suggérer un ordre répété ou maintenu; « avec insistance » conserve la force de πολλὰ sans alourdir la phrase.
