id: MRK.3.28
reference: Mark 3:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: fr
  text: Vraiment, je vous le dis, tous les péchés seront pardonnés aux fils des hommes[a], ainsi que tous les blasphèmes qu’ils pourront proférer ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux êtres humains » ou « aux humains ». L’expression grecque « les fils des hommes » désigne ici l’humanité en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Vraiment
  rationale: Dans la formule synoptique Ἀμὴν λέγω ὑμῖν, « Vraiment » restitue naturellement en français la solennité de l’affirmation sans translittérer « Amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule française naturelle et solennelle qui conserve l’adresse directe ; le pronom « le » est idiomatique dans cette tournure.
- source_word: πάντα
  choice: tous
  rationale: Le neutre pluriel a ici une portée globale sur les catégories précisées ensuite. En français, « tous les péchés… ainsi que tous les blasphèmes » rend clairement cette portée exhaustive.
- source_word: ἀφεθήσεται
  choice: seront pardonnés
  rationale: Dans un contexte de péchés, le passif futur de ἀφίημι signifie « être pardonné ». Le pluriel français s’accorde naturellement avec les noms explicités.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aux fils des hommes
  rationale: Cette traduction conserve la forme masculine et la couleur sémitique de l’expression grecque, tout en indiquant par une note qu’elle désigne génériquement l’humanité.
- source_word: τὰ ἁμαρτήματα
  choice: les péchés
  rationale: Le nom désigne ici des actes de péché, rendus directement par le pluriel courant « les péchés ».
- source_word: αἱ βλασφημίαι
  choice: les blasphèmes
  rationale: Le contexte immédiat concerne des paroles contre l’Esprit saint ; « blasphèmes » préserve donc mieux la portée religieuse que « insultes » ou « calomnies ».
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: tous les blasphèmes qu’ils pourront proférer
  rationale: Cette formulation conserve la portée indéfinie de ὅσα ἐάν avec le subjonctif et rend idiomatiquement l’acte de prononcer des paroles blasphématoires.
theological_decisions:
- issue: Portée de la déclaration de pardon par rapport à l’avertissement qui suit concernant le blasphème contre l’Esprit saint
  choice: Présenter ce verset comme une déclaration générale et ample du pardon, sans y introduire l’exception formulée au verset suivant.
  alternative: Insérer dès ce verset une restriction implicite au pardon.
  rationale: Le texte énonce d’abord l’étendue du pardon, puis formule l’exception au verset suivant. La traduction doit préserver cette progression et cette tension théologique.
- issue: Sens générique de τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Conserver « aux fils des hommes » dans le texte et en préciser le sens inclusif en note.
  alternative: Traduire directement par « aux êtres humains » ou « aux gens ».
  rationale: La formulation retenue reflète l’expression masculine sémitique de la source, tandis que la note évite de laisser croire qu’elle exclut les femmes.
translation_notes:
  register: Français international moderne, digne et accessible. « Proférer » garde la dimension verbale du blasphème sans lourdeur excessive. Le point-virgule maintient le lien avec l’avertissement du verset suivant.
