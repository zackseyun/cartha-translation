  text: καὶ ⸂ἀποκριθεὶς αὐτοῖς λέγει⸃· Τίς ἐστιν ἡ μήτηρ μου ⸀ἢ οἱ ἀδελφοί ⸀μου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: fr
  text: 'Il leur répond[a] : « Qui est ma mère, ou qui sont mes frères[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et, leur ayant répondu, il dit ». Le grec associe un participe à un présent historique.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie littéralement le singulier avec le premier élément : « Qui est ma mère ou mes frères ? » La formulation française explicite l’accord attendu pour « mes frères ».'
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Il leur répond
  rationale: Cette formulation française naturelle rend le participe « ayant répondu/répondant », son complément « à eux » et le présent historique « il dit », sans reproduire une tournure grecque lourde en français.
- source_word: Τίς
  choice: Qui
  rationale: Le pronom interrogatif demande l’identité des personnes concernées.
- source_word: μήτηρ
  choice: mère
  rationale: « Mère » est l’équivalent courant, précis et digne du terme grec.
- source_word: ἢ
  choice: ou
  rationale: Le choix conserve la conjonction disjonctive du texte grec, même si « et » serait plus idiomatique dans une question française englobant les deux groupes.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel grec désigne ici les frères de Jésus mentionnés dans le contexte immédiat; « frères » évite d’élargir le sens à « frères et sœurs » sans indication explicite.
theological_decisions:
- issue: Portée du terme familial ἀδελφοί
  choice: frères
  alternative: frères et sœurs ; membres de la fratrie
  rationale: La traduction maintient le masculin pluriel concret du grec sans trancher par reformulation les débats confessionnels sur la nature exacte de ce lien familial.
- issue: Coordination de la mère et des frères
  choice: ou
  alternative: et
  rationale: Le grec porte explicitement ἢ (« ou »). Malgré le caractère plus courant de « et » en français dans ce type de question, conserver « ou » préserve la forme et la tension de l’énoncé source.
translation_notes:
  register: Français international moderne, sobre et oralement naturel. Le présent « répond » conserve la vivacité narrative de Marc. La répétition implicite du verbe sous la forme « qui sont » assure une syntaxe française claire tout en maintenant le « ou » du grec.
