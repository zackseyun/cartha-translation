id: MRK.3.29
reference: Mark 3:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: fr
  text: Mais quiconque blasphème contre l’Esprit saint n’a jamais de pardon[a], mais est coupable d’un péché éternel[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « n’a pas de pardon jusqu’à l’âge » ; expression qui signifie « n’a jamais de pardon » ou « n’a pas de pardon pour toujours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « est tenu pour responsable d’un péché éternel » ou « est passible d’un péché éternel ».'
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits portent « jugement éternel » ou « condamnation éternelle » au lieu de « péché éternel ».
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Mais quiconque
  rationale: ὃς avec ἄν introduit une relative indéfinie à portée générale, rendue naturellement par « quiconque ». δέ marque ici le contraste avec l’affirmation précédente.
- source_word: βλασφημήσῃ
  choice: blasphème
  rationale: Le présent français exprime naturellement la portée générale de l’aoriste subjonctif grec après ἄν. « Blasphémer » conserve la force religieuse du terme.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: contre l’Esprit saint
  rationale: Avec βλασφημέω, εἰς désigne la cible de l’offense. « Contre » est idiomatique en français et ne réduit pas la portée théologique de l’expression.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: n’aura jamais de pardon
  rationale: La tournure temporelle εἰς τὸν αἰῶνα, littéralement « jusque dans l’âge », prend dans ce contexte négatif le sens de « jamais » ou « pour toujours ». Le futur français rend cette absence de pardon définitive plus naturellement que « n’a jamais de pardon ».
- source_word: ἀλλὰ ἔνοχός ἐστιν
  choice: il est coupable
  rationale: ἀλλά introduit un contraste fort, rendu ici par les deux-points afin d’éviter la répétition lourde de « mais ». ἔνοχος exprime la culpabilité ou le fait d’être passible de quelque chose.
- source_word: αἰωνίου ἁμαρτήματος
  choice: d’un péché éternel
  rationale: Le texte grec fourni porte ἁμαρτήματος, « péché », qualifié par αἰωνίου, « éternel ». La formulation inhabituelle est conservée plutôt qu’expliquée dans le corps du verset.
theological_decisions:
- issue: Nature de l’offense impardonnable
  choice: Conserver l’expression directe « blasphème contre l’Esprit saint » sans précision interprétative.
  alternative: Expliquer l’offense comme un rejet persistant du témoignage de l’Esprit ou comme l’attribution de son œuvre à une puissance démoniaque.
  rationale: Le contexte immédiat éclaire la parole, mais le verset lui-même ne développe pas cette interprétation. La traduction préserve donc sa tension théologique.
- issue: Variante textuelle à la fin du verset
  choice: Traduire la leçon du SBLGNT, « péché éternel ».
  alternative: « jugement éternel » ou « condamnation éternelle »
  rationale: La source fournie lit αἰωνίου ἁμαρτήματος. Les autres leçons sont signalées en note sans remplacer le texte retenu.
translation_notes:
  register: Français international moderne, sobre et digne. « Esprit saint » suit l’usage typographique courant en français. La formulation « péché éternel », volontairement saisissante, reste proche de la leçon grecque sans ajout doctrinal.
