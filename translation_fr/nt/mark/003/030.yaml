  text: ὅτι ἔλεγον· Πνεῦμα ἀκάθαρτον ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/030.yaml
  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: fr
  text: 'car ils disaient[a] : « Il a un esprit impur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « Il est possédé par un esprit impur. »'
    reason: Alternative lexicale et idiomatique pour rendre ἔχει.
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Dans ce contexte, la conjonction introduit la raison de la déclaration précédente de Jésus. « Car » exprime naturellement ce lien causal en français.
- source_word: ἔλεγον
  choice: ils disaient
  rationale: L’imparfait grec présente l’accusation comme répétée ou persistante ; l’imparfait français en conserve naturellement l’aspect.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: un esprit impur
  rationale: Cette formulation rend directement l’expression grecque et correspond à l’usage courant des Évangiles pour désigner un esprit démoniaque, sans ajouter cette interprétation au texte.
- source_word: ἔχει
  choice: il a
  rationale: Le grec emploie simplement le verbe « avoir ». La traduction littérale préserve la formulation abrupte de l’accusation, tandis que son sens idiomatique est indiqué en note.
theological_decisions:
- issue: Nature de l’accusation portée contre Jésus
  choice: 'Conserver l’accusation directe : « Il a un esprit impur. »'
  alternative: « Il est possédé par un esprit impur. »
  rationale: Le texte rapporte l’accusation des adversaires dans ses propres termes. « Il a » respecte le verbe grec sans préciser davantage la nature de l’emprise supposée ; la note fournit l’équivalent idiomatique possible.
translation_notes:
  register: Français international moderne, clair et digne. « Esprit impur » conserve la terminologie biblique usuelle ; « car » relie explicitement ce verset à l’affirmation précédente.
