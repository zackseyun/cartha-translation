id: MRK.3.5
reference: Mark 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: fr
  text: 'Après les avoir tous regardés avec colère, profondément attristé par l’endurcissement de leur cœur[a], il dit à l’homme : « Tends la main. » Il la tendit, et sa main fut rétablie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leurs cœurs ». Le grec emploie « cœur » au singulier, probablement dans un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Après les avoir tous regardés
  rationale: Le participe aoriste indique une action antérieure à « il dit ». La tournure française rend naturellement le regard circulaire porté sur le groupe; « tous » explicite sans excès la valeur de περι-.
- source_word: μετ’ ὀργῆς
  choice: avec colère
  rationale: μετά avec le génitif exprime ici la manière ou l’émotion accompagnant le regard. « Avec colère » conserve directement la force du grec sans l’atténuer en simple indignation.
- source_word: συλλυπούμενος
  choice: profondément attristé
  rationale: Le verbe exprime une vive peine. « Profondément attristé » est naturel en français et restitue la force du composé sans lui attribuer artificiellement le sens de partager la tristesse d’autrui.
- source_word: ἐπὶ τῇ πωρώσει
  choice: par l’endurcissement
  rationale: ἐπί avec le datif indique ici la cause de la tristesse. πώρωσις désigne l’insensibilité ou la dureté devenue persistante; « endurcissement » conserve la métaphore et son poids moral.
- source_word: τῆς καρδίας αὐτῶν
  choice: de leur cœur
  rationale: Le grec emploie le singulier καρδίας avec un possesseur pluriel. Le français collectif « leur cœur » préserve cette forme tout en restant intelligible; le pluriel idiomatique est signalé en note.
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique de Marc peut naturellement se rendre au présent français, ce qui conserve la vivacité narrative.
- source_word: τῷ ἀνθρώπῳ
  choice: à l’homme
  rationale: Le contexte désigne l’homme précis mentionné dans la scène; cette traduction est concrète et exacte.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Tends la main
  rationale: Cette formulation courante rend directement l’impératif aoriste et l’action demandée.
- source_word: ἐξέτεινεν
  choice: Il la tendit
  rationale: Le pronom reprend clairement « la main » et conserve l’écho verbal entre l’ordre et son exécution sans lourde répétition.
- source_word: ἀπεκατεστάθη
  choice: fut rétablie
  rationale: Le passif exprime le retour de la main à son état normal. « Fut rétablie » est plus précis que « fut guérie » et conserve l’idée de restauration.
theological_decisions:
- issue: La colère et la tristesse de Jésus
  choice: 'Conserver explicitement les deux émotions : « avec colère » et « profondément attristé ».'
  alternative: Atténuer ὀργή en « indignation » ou rendre συλλυπούμενος par le plus faible « peiné ».
  rationale: Le texte associe sans les opposer la colère de Jésus et sa douleur devant l’endurcissement humain. La traduction maintient cette tension théologique et morale sans la lisser.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique « il dit » est conservé, tandis que les actions ponctuelles qui l’encadrent sont rendues au passé simple pour maintenir la vivacité du récit. La formulation évite aussi bien l’archaïsme que la paraphrase doctrinale.
