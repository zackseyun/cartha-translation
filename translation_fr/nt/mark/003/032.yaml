source:
  edition: SBLGNT
  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: fr
  text: 'Une foule était assise autour de lui, et on lui dit : « Voici, ta mère et tes frères sont dehors et te cherchent[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi évoquer le fait de chercher à te joindre.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐκάθητο
  choice: était assise
  rationale: L’imparfait grec présente une scène en cours; l’imparfait français en conserve naturellement l’arrière-plan duratif.
- source_word: περὶ αὐτὸν ὄχλος
  choice: Une foule était assise autour de lui
  rationale: περί avec l’accusatif exprime ici la disposition spatiale de la foule qui entoure Jésus.
- source_word: λέγουσιν
  choice: on lui dit
  rationale: Le présent grec fonctionne comme un présent historique. Le passé simple convient au récit français, tandis que « on » rend le sujet pluriel non précisé sans attribuer la parole à toute la foule.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Cette particule attire l’attention sur l’information qui suit. « Voici » en restitue la force dans un français actuel et digne.
- source_word: ἡ μήτηρ σου
  choice: ta mère
  rationale: Traduction directe du terme de parenté et du possessif, adaptée au tutoiement employé envers Jésus.
- source_word: οἱ ἀδελφοί σου
  choice: tes frères
  rationale: Le masculin pluriel du grec est conservé sans préciser davantage la nature de ce lien familial.
- source_word: ἔξω
  choice: dehors
  rationale: Rend simplement et naturellement l’adverbe de lieu.
- source_word: ζητοῦσίν σε
  choice: te cherchent
  rationale: ζητέω signifie ici chercher quelqu’un, vraisemblablement afin de le trouver ou de le joindre; « te cherchent » préserve cette formulation sans surinterprétation.
theological_decisions:
- issue: Sens du mot « frères »
  choice: Traduire ἀδελφοί par « frères » sans ajout explicatif
  alternative: « frères ou proches parents »; « frères et sœurs »
  rationale: Le verset emploie le terme masculin ordinaire sans expliquer plus précisément le lien familial. La traduction directe évite d’imposer une conclusion confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. « Voici » conserve la fonction d’appel à l’attention de ἰδού sans recourir à une tournure archaïque.
