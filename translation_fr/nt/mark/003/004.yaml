reference: Mark 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: fr
  text: 'Et il leur dit : « Est-il permis, le jour du sabbat, de faire du bien ou de faire du mal, de sauver une vie ou de tuer ? » Mais eux gardaient le silence.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: Est-il permis
  rationale: Dans cette controverse sur l’observance du sabbat, le verbe demande ce que la Loi autorise. « Est-il permis » exprime naturellement cette portée juridique et éthique en français.
- source_word: τοῖς σάββασιν
  choice: le jour du sabbat
  rationale: Le grec emploie un pluriel idiomatique. Dans le contexte immédiat, le singulier français désigne naturellement le sabbat en question sans suggérer plusieurs journées distinctes.
- source_word: ἀγαθοποιῆσαι
  choice: de faire du bien
  rationale: Cette formulation concise et courante conserve le sens actif de l’infinitif grec.
- source_word: κακοποιῆσαι
  choice: de faire du mal
  rationale: Dans le contexte de la guérison et de l’opposition entre sauver et tuer, « faire du mal » rend clairement la portée concrète du verbe, tout en laissant possible sa dimension morale.
- source_word: ψυχὴν
  choice: une vie
  rationale: En contraste avec « tuer », ψυχή désigne ici la vie d’une personne, et non spécifiquement une âme immatérielle.
- source_word: σῶσαι
  choice: de sauver
  rationale: « Sauver » garde la force lexicale du verbe et convient au sens immédiat de préserver la vie.
- source_word: ἀποκτεῖναι
  choice: de tuer
  rationale: Le verbe signifie fondamentalement « tuer » ; « assassiner » ajouterait une qualification juridique ou morale absente du terme lui-même.
- source_word: ἐσιώπων
  choice: gardaient le silence
  rationale: L’imparfait français reflète l’aspect duratif de l’imparfait grec et présente leur silence comme une réponse persistante à la question.
theological_decisions:
- issue: Formulation du sabbat dans une controverse juridique
  choice: Employer l’idiome français singulier « le jour du sabbat » dans le texte
  alternative: Rendre formellement le pluriel par « les jours de sabbat »
  rationale: Le pluriel grec est une tournure courante qui ne demande pas ici une pluralité de sabbats. Le singulier français restitue le sens contextuel, tandis qu’une note conserve la transparence envers la forme grecque.
- issue: Portée morale de κακοποιῆσαι
  choice: « faire du mal »
  alternative: « faire le mal »
  rationale: « Faire du mal » correspond étroitement au contexte concret de guérison et de préservation de la vie, sans exclure la portée éthique de l’opposition formulée par Jésus.
translation_notes:
  register: Français moderne, naturel et digne. Le présent historique grec λέγει est rendu par le passé simple « dit », conformément à l’usage narratif français. L’ajout de « eux » dans la dernière proposition souligne sobrement le contraste exprimé par οἱ δέ.
