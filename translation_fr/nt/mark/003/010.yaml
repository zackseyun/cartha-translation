source:
  edition: SBLGNT
  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: fr
  text: Car il avait guéri beaucoup de gens, si bien que tous ceux qui souffraient d’afflictions se précipitaient sur lui[a] pour le toucher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se jetaient sur lui ». Le grec exprime un mouvement impétueux de personnes qui se ruent vers lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: beaucoup de gens
  rationale: Le pronom substantivé désigne de nombreuses personnes; l'ajout de « gens » est naturel et explicite en français.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l'explication de la pression exercée par la foule dans le contexte immédiat.
- source_word: ἐθεράπευσεν
  choice: avait guéri
  rationale: L'aoriste évoque ici les guérisons antérieures qui expliquent le comportement présent de la foule; le plus-que-parfait rend clairement ce rapport.
- source_word: ὥστε
  choice: si bien que
  rationale: Exprime naturellement en français le résultat des nombreuses guérisons.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: se pressaient contre lui
  rationale: Dans ce contexte de foule, l'expression décrit un mouvement physique insistant vers Jésus; cette formulation garde la force de la scène sans le littéralisme ambigu de « tomber sur lui ».
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: pour le toucher
  rationale: Rend simplement le but du mouvement de la foule et le sens physique courant de ἅπτομαι avec le génitif.
- source_word: ὅσοι εἶχον μάστιγας
  choice: tous ceux qui souffraient de graves afflictions
  rationale: ὅσοι a une portée englobante, tandis que μάστιγας, littéralement « fléaux/coups de fouet », désigne figurativement de pénibles maux; « graves afflictions » conserve cette intensité sans réduire le terme aux seules maladies.
theological_decisions:
- issue: Nature de μάστιγας dans le contexte des guérisons
  choice: graves afflictions
  alternative: maladies; fléaux; tourments
  rationale: Le mot évoque des souffrances sévères sans imposer une catégorie médicale précise. Cette traduction conserve sa portée large et son intensité, sans ajouter d'interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement explicatif et consécutif du grec. « Graves afflictions » préserve l'image vigoureuse de μάστιγας, tandis que la note signale la formulation plus littérale de ἐπιπίπτειν.
