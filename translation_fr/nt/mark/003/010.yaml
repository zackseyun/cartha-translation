  verdict: revise
  source_fidelity: La structure causale et consécutive est bien rendue, ainsi que le but (« pour le toucher »). Toutefois, « graves » ajoute une qualification explicite que μάστιγας ne formule pas ici, même si le terme porte une image de souffrance pénible. « Se pressaient contre lui » atténue aussi quelque peu le mouvement énergique de ἐπιπίπτειν; « se précipitaient sur lui » le rend plus directement dans ce contexte non hostile.
  naturalness: La formulation révisée demeure naturelle en français international moderne. « Se précipitaient sur lui » est idiomatique et la finalité « pour le toucher » écarte toute lecture hostile.
  terminology: « Afflictions » conserve utilement l’ampleur figurée de μάστιγας sans réduire le mot à des maladies ni introduire le sens littéral de coups de fouet dans le texte principal. La suppression de « graves » évite un renforcement non explicite.
