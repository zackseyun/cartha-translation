    issue: Ajout de « graves » pour μάστιγας
    rationale: μάστιγας peut évoquer des maux pénibles et sévères, mais le verset ne comporte pas d’adjectif équivalant à « graves ». Il convient de conserver l’intensité lexicale sans en faire une qualification explicite supplémentaire.
  - severity: low
    issue: « se pressaient contre lui » atténue ἐπιπίπτειν
    rationale: Dans cette scène, ἐπιπίπτειν décrit des personnes qui se ruent ou se jettent sur Jésus. « Se précipitaient sur lui » restitue plus clairement cet élan, tout en restant naturel grâce au complément final « pour le toucher ».
