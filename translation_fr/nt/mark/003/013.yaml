id: MRK.3.13
reference: Mark 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: fr
  text: Puis il monte sur la montagne et appelle auprès de lui ceux que lui-même voulait[a] ; et ils allèrent vers lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qu’il voulait » ; le grec comporte un pronom emphatique : « lui-même ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils vinrent à lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: monte
  rationale: Le présent historique grec est naturel dans le récit français et conserve la vivacité de Marc. « Monte » exprime simplement le mouvement ascendant.
- source_word: εἰς τὸ ὄρος
  choice: sur la montagne
  rationale: Avec le verbe « monter », la préposition εἰς indique ici l’accès à la montagne ou à sa hauteur ; « sur la montagne » est idiomatique sans préciser indûment s’il s’agit d’un sommet.
- source_word: προσκαλεῖται
  choice: appelle auprès de lui
  rationale: Le moyen προσκαλεῖται présente un appel orienté vers celui qui appelle. « Auprès de lui » rend cette dimension personnelle sans donner au verbe un ton autoritaire absent du contexte immédiat.
- source_word: οὓς ἤθελεν αὐτός
  choice: ceux que lui-même voulait
  rationale: « Voulait » rend naturellement θέλω, tandis que l’antéposition de « lui-même » conserve l’insistance portée par le pronom explicite αὐτός sans développer une doctrine au-delà du texte.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: ils allèrent vers lui
  rationale: « Allèrent » reflète le mouvement exprimé par ἀπέρχομαι, et « vers lui » rend πρὸς αὐτόν. Le passé simple convient au registre narratif digne, même après un présent historique.
theological_decisions:
- issue: L’initiative personnelle de Jésus dans le choix de ceux qu’il appelle
  choice: ceux que lui-même voulait
  alternative: ceux qu’il voulait
  rationale: Le pronom αὐτός souligne que le choix procède de Jésus lui-même. La formulation garde cette insistance sans la transformer en affirmation systématique sur l’élection.
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique est maintenu pour la vivacité du récit marcien ; le passé simple final marque naturellement l’action accomplie. La répétition de « lui » suit l’insistance relationnelle du grec sans alourdir excessivement la phrase.
