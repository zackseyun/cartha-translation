id: MRK.3.9
reference: Mark 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: fr
  text: Il dit à ses disciples de garder une petite barque prête pour lui, à cause de la foule, afin qu’on ne l’écrase pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’on ne fasse pas pression sur lui ». Le verbe grec peut désigner le fait de presser, de comprimer ou d’écraser sous la pression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: demanda
  rationale: Dans cette construction exprimant ce que les disciples doivent faire, « demanda » rend naturellement la valeur directive de εἶπεν sans durcir le propos en ordre formel.
- source_word: μαθηταῖς
  choice: disciples
  rationale: « Disciples » est le terme courant dans les Évangiles et conserve la relation d’apprentissage et d’attachement au maître.
- source_word: πλοιάριον
  choice: petite barque
  rationale: « Petite barque » conserve la nuance diminutive de πλοιάριον et convient au contexte du lac.
- source_word: προσκαρτερῇ αὐτῷ
  choice: tenir … à sa disposition
  rationale: Cette formulation exprime la disponibilité continue demandée par προσκαρτερέω avec le datif αὐτῷ, dans un français naturel.
- source_word: διὰ τὸν ὄχλον
  choice: à cause de la foule
  rationale: διά avec l’accusatif indique ici la cause ou le motif.
- source_word: θλίβωσιν
  choice: écrase
  rationale: Le verbe peut évoquer la pression, la compression ou l’écrasement. « Écrase » en préserve la force physique, tandis qu’une note signale la nuance moins forte possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure impersonnelle « on » rend naturellement le pluriel indéfini grec, dont le référent contextuel est la foule.
