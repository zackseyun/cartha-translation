review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les membres de la famille, la localisation à l’extérieur et l’idée d’un appel adressé à Jésus. Toutefois, « ils envoient quelqu’un » introduit explicitement un messager humain que le grec ne nomme pas. ἀπέστειλαν πρὸς αὐτόν, dans ce contexte, peut désigner l’envoi d’un message ou d’une personne, et la traduction ne doit pas trancher cette implicitation.
  naturalness: « Restant dehors » est possible, mais « se tenant dehors » rend plus directement στήκοντες et reste naturel dans un récit français. « Lui envoient un message pour l’appeler » est idiomatique, clair et n’impose pas l’identité du moyen envoyé.
  terminology: « Sa mère et ses frères » correspond à ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ sans importer d’interprétation confessionnelle. « Appeler » correspond sobrement à καλοῦντες αὐτόν.
  issues:
  - severity: medium
    issue: Explicitation de « quelqu’un »
    rationale: Le texte grec dit qu’ils « envoyèrent vers lui » tout en l’appelant, sans exprimer le nom de la personne envoyée. Ajouter « quelqu’un » réduit une ambiguïté que le texte source conserve.
  - severity: low
    issue: « Restant dehors » atténue la valeur de στήκοντες
    rationale: Le participe signifie littéralement qu’ils se tenaient/debout à l’extérieur; « se tenant dehors » conserve mieux cette image sans alourdir le français.
  revised_text: Alors sa mère et ses frères arrivent et, se tenant dehors, lui envoient un message pour l’appeler.
