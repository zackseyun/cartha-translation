  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: fr
  text: Alors sa mère et ses frères arrivent et, se tenant dehors, lui envoient un message pour l’appeler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Alors
  rationale: Le connecteur fait progresser le récit; « Alors » assure un enchaînement narratif naturel en français.
- source_word: ἔρχονται
  choice: arrivent
  rationale: Le présent historique grec peut être conservé naturellement en français et donne de la vivacité au récit.
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: sa mère et ses frères
  rationale: Traduction directe qui conserve le masculin pluriel ἀδελφοί sans préciser la nature exacte du lien familial.
- source_word: ἔξω στήκοντες
  choice: Restant dehors
  rationale: Le participe indique leur position maintenue à l’extérieur; cette formulation est naturelle et évite de suggérer qu’ils sont simplement debout.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: ils envoient quelqu’un
  rationale: Le complément implicite est vraisemblablement une personne chargée de transmettre leur demande; l’explicitation minimale produit un français idiomatique.
- source_word: καλοῦντες αὐτόν
  choice: l’appeler
  rationale: L’infinitif exprime naturellement le but de l’envoi et conserve le sens de καλέω sans préciser davantage la teneur de l’appel.
theological_decisions:
- issue: Identité des « frères » de Jésus
  choice: ses frères
  alternative: ses proches / les membres de sa parenté
  rationale: Le grec dit ἀδελφοί. La traduction garde son sens lexical direct sans trancher la question confessionnelle de leur lien familial exact avec Jésus.
translation_notes:
  register: Français moderne, courant et digne. Le présent narratif est maintenu; la formulation reste concise et accessible.
source_grounding:
  english_pob_role: consult_only
