source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: fr
  text: 'Puis il les appela auprès de lui et leur parla en paraboles : « Comment Satan peut-il chasser Satan ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: il les appela auprès de lui
  rationale: Le participe aoriste moyen indique que Jésus les fait venir à lui avant de leur parler. Cette formulation exprime naturellement le mouvement vers lui sans alourdir la phrase.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: Le pluriel désigne ici des paroles imagées ou des comparaisons. La traduction directe conserve la forme et laisse ouverte la portée exacte du terme.
- source_word: ἔλεγεν
  choice: leur parla
  rationale: L’imparfait grec présente la prise de parole dans son déroulement. En français narratif, le passé simple est plus naturel ici, tandis que la suite des paroles se poursuit dans les versets suivants.
- source_word: Πῶς δύναται
  choice: Comment … peut-il
  rationale: Cette tournure française concise restitue la question rhétorique portant sur la possibilité.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Le nom ou titre est translittéré selon l’usage français établi; les deux cas grecs ont la même forme en français.
- source_word: ἐκβάλλειν
  choice: chasser
  rationale: Dans le contexte des expulsions de démons chez Marc, « chasser » est le terme français courant et précis, sans archaïsme.
theological_decisions:
- issue: Portée de la question sur Satan agissant contre lui-même
  choice: « Comment Satan peut-il chasser Satan ? »
  alternative: « Comment est-il possible que Satan chasse Satan ? »
  rationale: Le grec formule une question rhétorique qui met en cause la cohérence de l’accusation. La traduction en conserve la force sans expliciter davantage l’impossibilité ni ajouter une conclusion doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide à l’oral comme à l’écrit; « en paraboles » conserve le vocabulaire biblique courant, et « chasser » rend naturellement le verbe d’expulsion.
