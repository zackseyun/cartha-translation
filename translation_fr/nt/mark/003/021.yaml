  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: fr
  text: 'Quand ses proches en entendirent parler[a], ils sortirent pour le saisir, car ils disaient : « Il a perdu la raison[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa famille » ou « les siens » ; l’expression grecque est idiomatique et peut désigner plus précisément les membres de la maison de Jésus ou de son entourage immédiat.
    reason: alternative_reading
  - marker: b
    text: Ou « Il est hors de lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: ses proches
  rationale: Expression idiomatique désignant les personnes liées à Jésus, probablement sa famille ou son entourage immédiat. « Ses proches » reste naturel tout en préservant l’imprécision du grec.
- source_word: ἀκούσαντες
  choice: Quand ... apprirent cela
  rationale: Le participe aoriste est rendu par une proposition temporelle. « Cela » explicite naturellement en français l’objet sous-entendu de ce qu’ils ont appris, à savoir la situation rapportée juste avant.
- source_word: ἐξῆλθον
  choice: ils partirent
  rationale: Le verbe indique qu’ils sortirent ou se mirent en route. « Ils partirent » exprime clairement le mouvement vers Jésus sans imposer un point de départ précis.
- source_word: κρατῆσαι
  choice: pour se saisir de lui
  rationale: κρατέω signifie prendre fermement ou saisir. Cette formulation conserve la force du geste sans lui donner à tort le sens technique d’une arrestation ni préciser qu’ils voulaient seulement le maîtriser.
- source_word: ἔλεγον
  choice: ils disaient
  rationale: L’imparfait français reflète naturellement l’aspect duratif ou répété de l’imparfait grec.
- source_word: ἐξέστη
  choice: Il a perdu la raison
  rationale: Dans ce contexte, le verbe exprime le jugement selon lequel Jésus n’est plus dans son état normal ou a perdu ses facultés. La formule est claire, actuelle et moins familière que « Il est devenu fou ».
theological_decisions:
- issue: Identité de οἱ παρ’ αὐτοῦ
  choice: « ses proches », sans les identifier explicitement à sa famille
  alternative: « sa famille », « les siens » ou « les gens de son entourage »
  rationale: Le contexte ultérieur favorise probablement la famille de Jésus, mais l’expression grecque n’emploie aucun terme explicite de parenté. La traduction conserve donc l’ambiguïté et signale l’interprétation familiale en note.
- issue: Portée de l’accusation ἐξέστη
  choice: « Il a perdu la raison »
  alternative: « Il est hors de lui »
  rationale: Le propos porte vraisemblablement sur l’état mental ou le comportement jugé anormal de Jésus. La traduction rend l’accusation sans l’intensifier en diagnostic précis et sans atténuer la tension narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la vigueur de l’intervention projetée et l’ambiguïté concernant l’identité des proches. Les deux marqueurs [a] et [b] figurent dans le texte principal.
