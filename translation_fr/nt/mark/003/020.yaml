source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: fr
  text: Puis il entre dans une maison[a]. La foule se rassemble de nouveau, si bien qu’ils ne peuvent même pas prendre un repas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez lui ». Le grec dit littéralement « dans une maison », mais l’expression peut aussi signifier idiomatiquement « chez lui ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « manger du pain »; c’est-à-dire prendre de la nourriture ou un repas. Le grec dit « eux » sans nommer dans ce verset les personnes concernées; il s’agit vraisemblablement de Jésus et de ceux qui sont avec lui.
    reason: lexical_alternative; referent_clarification
lexical_decisions:
- source_word: ἔρχεται
  choice: il entre
  rationale: Le présent de narration conserve la vivacité caractéristique de Marc. Avec εἰς οἶκον, « entre » exprime naturellement en français le mouvement vers l’intérieur.
- source_word: εἰς οἶκον
  choice: dans une maison
  rationale: L’absence d’article et de possessif ne permet pas d’identifier explicitement la maison; « une maison » préserve cette indétermination. L’emploi idiomatique « chez lui » reste possible et figure en note.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: La foule se rassemble de nouveau
  rationale: « Se rassemble » rend naturellement le sens intransitif de συνέρχεται, tandis que « de nouveau » marque clairement la répétition exprimée par πάλιν.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: si bien que lui et ceux qui l’accompagnent ne peuvent pas
  rationale: ὥστε avec l’infinitif exprime ici le résultat. Le présent s’accorde avec les présents de narration. Comme le pluriel αὐτούς n’a pas d’antécédent pluriel explicite dans ce seul verset, une formulation développée évite un « ils » français ambigu tout en indiquant Jésus et son entourage immédiat.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: ne peuvent même pas prendre un repas
  rationale: Dans ce contexte, « manger du pain » est une expression idiomatique signifiant prendre de la nourriture ou un repas. La traduction idiomatique est naturelle en français; le sens littéral est conservé en note.
theological_decisions:
- issue: Référent de αὐτούς (« eux »)
  choice: lui et ceux qui l’accompagnent
  alternative: ils
  rationale: Le pluriel inclut Jésus et les personnes présentes avec lui, sans que le verset les nomme explicitement. Cette explicitation minimale rend le français intelligible sans identifier plus précisément le groupe (disciples, famille ou autre entourage).
translation_notes:
  register: Français international moderne, fluide et digne. Les présents de narration rendent la vivacité du récit de Marc. La ponctuation en deux phrases évite une coordination lourde. « Prendre un repas » privilégie le sens idiomatique tout en conservant la formulation littérale en note.
