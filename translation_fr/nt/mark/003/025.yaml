  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: fr
  text: Et si une maison est divisée contre elle-même[a], cette maison ne pourra pas tenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une maisonnée est divisée contre elle-même »; le mot grec peut désigner une maison ou les personnes qui la composent, mais « tenir » favorise ici l’image concrète de la maison.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: maison
  rationale: « Maison » conserve l’image concrète, renforcée par le verbe « tenir ». Le mot grec peut aussi désigner les personnes d’une maisonnée, possibilité signalée en note.
- source_word: ἐφ’ ἑαυτὴν
  choice: contre elle-même
  rationale: Dans cette construction, l’expression décrit une opposition interne. « Contre elle-même » est naturel en français et préserve l’idée de conflit intérieur.
- source_word: μερισθῇ
  choice: est divisée
  rationale: Le passif et la condition générale sont rendus directement; « divisée » exprime clairement la fracture interne.
- source_word: δυνήσεται
  choice: pourra
  rationale: Le futur de capacité est rendu naturellement par « pourra ».
- source_word: σταθῆναι
  choice: tenir
  rationale: « Tenir » conserve en français l’image d’un bâtiment qui reste debout tout en laissant entendre l’idée de subsister.
- source_word: ἡ οἰκία ἐκείνη
  choice: cette maison
  rationale: Le démonstratif grec est conservé par « cette », formulation idiomatique en français.
- source_word: καὶ ἐὰν
  choice: Et si
  rationale: Cette formulation maintient à la fois le lien avec l’argument précédent et la valeur conditionnelle.
theological_decisions: []
