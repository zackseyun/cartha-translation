  text: καὶ ἐποίησεν ⸀δώδεκα, ἵνα ὦσιν μετ’ αὐτοῦ καὶ ἵνα ἀποστέλλῃ αὐτοὺς κηρύσσειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: fr
  text: Il en établit douze[a], afin qu’ils soient avec lui et afin de les envoyer prêcher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ajoutent : « auxquels il donna aussi le nom d’apôtres ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « proclamer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: établit
  rationale: Littéralement « fit », mais, avec « douze » comme complément, le verbe désigne ici la constitution ou la désignation d’un groupe. « Établit » est naturel et digne en français, sans ajouter un titre absent du texte retenu.
- source_word: δώδεκα
  choice: douze
  rationale: Le grec dit simplement « douze », sans nom exprimé. Le français permet de conserver cette ellipse et la portée symbolique du nombre sans ajouter « apôtres ».
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: pour qu’ils soient avec lui
  rationale: Cette formulation rend clairement la proposition de but introduite par ἵνα avec le subjonctif.
- source_word: ἀποστέλλῃ αὐτούς
  choice: pour les envoyer
  rationale: « Envoyer » garde le sens direct du verbe et sa nuance de mission, sans transformer ici le verbe en titre technique.
- source_word: κηρύσσειν
  choice: proclamer la Bonne Nouvelle
  rationale: κηρύσσω désigne une proclamation publique. Dans le contexte de Marc, « proclamer la Bonne Nouvelle » exprime naturellement le contenu implicite de cette activité; « prêcher » reste une traduction plus formelle possible.
theological_decisions:
- issue: Faut-il introduire le titre « apôtres » dans le texte principal ?
  choice: Ne pas ajouter « apôtres » au texte principal.
  alternative: « Il en établit douze, auxquels il donna aussi le nom d’apôtres… »
  rationale: Le texte du SBLGNT fourni porte seulement « il établit douze ». La leçon plus longue est significative, mais elle appartient à une variante manuscrite et doit donc être signalée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, fluide et digne. « Il en établit douze » relie naturellement le verset à ceux qui viennent d’être appelés, tandis que les deux propositions en « pour » conservent le parallélisme des buts exprimés en grec.
