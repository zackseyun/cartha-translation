  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: fr
  text: Et lui-même vous montrera une grande salle à l’étage[a], aménagée et prête ; faites-y les préparatifs pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande pièce à l’étage, disposée et prête ». Le participe grec peut désigner une pièce garnie ou mise en ordre, et pas seulement une pièce meublée.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom exprimé porte une valeur emphatique, que « lui-même » conserve naturellement.
- source_word: δείξει
  choice: montrera
  rationale: Le futur de δείκνυμι signifie naturellement « montrera »; ὑμῖν est rendu par « vous ».
- source_word: ἀνάγαιον
  choice: salle à l’étage
  rationale: Le terme désigne une pièce située dans la partie supérieure d’une maison; cette formulation est claire en français moderne.
- source_word: μέγα
  choice: grande
  rationale: Équivalent direct et naturel de l’adjectif.
- source_word: ἐστρωμένον
  choice: aménagée
  rationale: Le participe peut évoquer une pièce garnie, disposée ou préparée, notamment pour un repas; « aménagée » préserve cette latitude mieux que le seul « meublée ».
- source_word: ἕτοιμον
  choice: prête
  rationale: Rend directement l’état de disponibilité de la salle sans se confondre avec l’impératif qui suit.
- source_word: ἐκεῖ
  choice: là
  rationale: Équivalent locatif simple et naturel.
- source_word: ἑτοιμάσατε
  choice: Préparez
  rationale: L’impératif aoriste pluriel adresse aux disciples l’ordre d’effectuer les préparatifs.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom datif est conservé sans expliciter davantage son référent.
theological_decisions:
- issue: Objet implicite de ἑτοιμάσατε
  choice: Préparez-nous le repas
  alternative: Préparez là pour nous
  rationale: En français, « préparer pour nous » sans complément est peu naturel. Le contexte immédiat est la préparation du repas de la Pâque; « le repas » explicite sobrement l’objet sous-entendu sans préciser davantage.
translation_notes:
  register: Français international moderne, clair et digne. « Salle à l’étage » évite l’ambiguïté possible de « chambre haute », tandis que la note conserve la portée du participe grec.
