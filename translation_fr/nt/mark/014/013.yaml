  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: fr
  text: 'Et il envoie deux de ses disciples et leur dit : « Allez dans la ville. Un homme portant une cruche d’eau viendra à votre rencontre. Suivez-le. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: il envoie
  rationale: Le présent est conservé afin de rendre le présent historique caractéristique du récit de Marc.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: deux de ses disciples
  rationale: Cette formulation rend naturellement la construction partitive et conserve le terme usuel pour μαθηταί.
- source_word: λέγει
  choice: leur dit
  rationale: Le présent historique grec est maintenu; « dit » est la forme française naturelle du présent de dire dans cette construction.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Allez dans la ville
  rationale: La formulation exprime clairement le déplacement vers l’intérieur de la ville dans un français courant.
- source_word: ἀπαντήσει ὑμῖν
  choice: viendra à votre rencontre
  rationale: Cette tournure naturelle rend le futur et le sens de rencontre orientée exprimé dans le contexte.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans ce contexte, le substantif masculin désigne un individu de sexe masculin servant de signe aux disciples.
- source_word: κεράμιον ὕδατος
  choice: une cruche d’eau
  rationale: « Cruche » désigne naturellement en français un récipient de ce type; la précision possible concernant la terre cuite n’est pas nécessaire au sens.
- source_word: βαστάζων
  choice: portant
  rationale: Le participe présent décrit simplement l’action de l’homme et se rend avec concision par « portant ».
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Suivez-le
  rationale: L’impératif direct restitue clairement la force du commandement.
