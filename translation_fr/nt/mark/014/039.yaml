  text: καὶ πάλιν ἀπελθὼν προσηύξατο τὸν αὐτὸν λόγον εἰπών.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: fr
  text: Puis il s’éloigna de nouveau et pria en disant les mêmes paroles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la même parole »; on peut aussi comprendre : « la même chose » ou « la même formulation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: Marque la répétition de l’action et s’intègre naturellement au récit.
- source_word: ἀπελθὼν
  choice: il s’éloigna
  rationale: Le participe aoriste exprime ici une action précédant la prière; une proposition coordonnée est naturelle en français.
- source_word: προσηύξατο
  choice: pria
  rationale: Équivalent français courant et précis de προσεύχομαι; l’aoriste présente l’action globalement.
- source_word: τὸν αὐτὸν λόγον
  choice: les mêmes paroles
  rationale: Dans ce contexte, λόγος désigne le contenu formulé de la prière répétée. Le pluriel français évite de laisser croire que Jésus n’a répété qu’un seul mot, tout en gardant l’idée d’une même formulation.
- source_word: εἰπών
  choice: en disant
  rationale: Rend le participe de manière idiomatique et indique que les paroles constituent le contenu de la prière.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Puis » assure la continuité narrative; « de nouveau » évite la légère lourdeur de « encore une fois ». La formulation conserve l’idée que Jésus répète le contenu de sa prière sans imposer une répétition nécessairement mot pour mot.
