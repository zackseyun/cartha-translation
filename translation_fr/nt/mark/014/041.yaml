language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: fr
  text: 'Il vient une troisième fois et leur dit : « Vous dormez encore et vous vous reposez[a] ? Cela suffit[b] ! L’heure est venue. Voici, le Fils de l’homme est livré entre les mains des pécheurs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Dormez désormais et reposez-vous. » La formulation grecque peut être lue soit comme une permission ironique, soit comme une question rhétorique.'
    reason: alternative_reading
  - marker: b
    text: L’expression grecque traduite par « Cela suffit ! » est difficile. On propose aussi « C’en est fait » ou, moins probablement ici, un sens commercial comme « le paiement a été reçu intégralement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Il vient une troisième fois
  rationale: Le présent narratif grec est conservé pour sa vivacité; « une troisième fois » est la tournure française naturelle.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Vous dormez encore et vous vous reposez ?
  rationale: La formulation est comprise comme une question rhétorique de reproche. « Encore » rend idiomatiquement τὸ λοιπὸν dans ce contexte, tandis qu’une note conserve l’autre analyse possible.
- source_word: ἀπέχει
  choice: Cela suffit !
  rationale: Cette expression difficile marque ici le terme de l’attente et la transition vers l’arrivée de l’heure; la note signale l’incertitude lexicale.
- source_word: ἦλθεν ἡ ὥρα
  choice: L’heure est venue
  rationale: « L’heure » conserve l’image et la portée du moment fixé, sans l’aplatir en simple « moment ».
- source_word: ἰδοὺ
  choice: Voici
  rationale: « Voici » est une interjection française actuelle et digne qui maintient la force déictique et solennelle du grec.
- source_word: παραδίδοται
  choice: est livré
  rationale: « Est livré » garde la voix passive et la gamme de sens de παραδίδωμι sans réduire l’action à la seule trahison de Judas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rendu français établi qui préserve la désignation dans sa portée idiomatique et titulaire.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: aux mains des pécheurs
  rationale: Cette expression française naturelle conserve l’image concrète d’une remise au pouvoir des pécheurs.
theological_decisions:
- issue: Force de Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Question rhétorique : « Vous dormez encore et vous vous reposez ? »'
  alternative: 'Permission ou ordre ironique : « Dormez désormais et reposez-vous. »'
  rationale: La ponctuation n’étant pas déterminée par les plus anciens témoins, les formes grecques permettent les deux lectures. La question est naturelle dans la scène, mais l’autre possibilité est conservée en note.
- issue: Sens de ἀπέχει
  choice: « Cela suffit ! »
  alternative: « C’en est fait »; éventuellement un sens commercial tel que « le paiement a été reçu intégralement »
  rationale: Le sens idiomatique choisi convient à la transition narrative sans introduire une interprétation technique spéculative; la difficulté réelle est signalée en note.
- issue: Portée de παραδίδοται
  choice: « est livré »
  alternative: « est trahi »
  rationale: Ce choix ne limite pas prématurément l’action à Judas et préserve la portée narrative et théologique plus large du verbe dans le récit de la Passion.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif est maintenu. La phrase de Jésus reste vive et concise; les ambiguïtés réelles concernant la question adressée aux disciples et ἀπέχει sont conservées dans les notes.
