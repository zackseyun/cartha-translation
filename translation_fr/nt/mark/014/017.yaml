  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: fr
  text: Le soir venu, il vient avec les douze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Douze », si l’expression est comprise comme une désignation reconnue du groupe apostolique de Jésus.
    reason: 'Alternative lexicale et typographique : la majuscule fait de l’expression une désignation quasi titulaire.'
lexical_decisions:
- source_word: Καὶ
  choice: '[non traduit séparément]'
  rationale: En français, l’enchaînement narratif est déjà assuré naturellement par « Le soir venu ». Ajouter « Et » serait possible, mais plus lourd ici, sans apporter de nuance essentielle.
- source_word: ὀψίας γενομένης
  choice: Le soir venu
  rationale: Cette tournure française concise rend la construction absolue grecque et sa valeur temporelle, tout en conservant l’idée de l’arrivée du soir.
- source_word: ἔρχεται
  choice: il vient
  rationale: Le présent conserve le présent historique de Marc et son effet de narration vive, plutôt que de le lisser en un passé.
- source_word: μετὰ τῶν δώδεκα
  choice: avec les douze
  rationale: « Avec » exprime directement l’accompagnement indiqué par μετά avec le génitif. « Les douze » reste transparent et n’ajoute ni « disciples » ni « apôtres », termes absents du grec.
theological_decisions:
- issue: Référence des « douze »
  choice: La formulation désigne le groupe proche des douze disciples de Jésus, Judas compris à ce point du récit.
  alternative: Expliciter « les douze disciples » ou « les douze apôtres ».
  rationale: Le référent ressort clairement du contexte, mais le texte grec se contente de « les douze ». La traduction conserve cette concision et évite d’ajouter un titre interprétatif.
translation_notes:
  register: Français international moderne, sobre et narratif. « Le soir venu » est idiomatique et digne ; « il vient » conserve délibérément le présent historique de Marc. Le marqueur de note est placé après « les douze », expression à laquelle la variante se rapporte.
