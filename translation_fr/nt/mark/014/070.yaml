  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: fr
  text: 'Mais il nia de nouveau. Peu après, ceux qui se tenaient là disaient de nouveau à Pierre : « Tu es vraiment l’un d’eux, car tu es, toi aussi, Galiléen, et ta façon de parler[b] ressemble à la leur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « et ta façon de parler ressemble à la leur ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « ton accent ». Le mot grec peut désigner la façon de parler, le dialecte ou l’accent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: continuait à nier
  rationale: L’imparfait grec présente le déni comme prolongé ou répété. Cette tournure française en rend l’aspect sans préciser un complément que le grec laisse implicite.
- source_word: μετὰ μικρὸν
  choice: peu après
  rationale: Expression temporelle naturelle en français pour un bref intervalle.
- source_word: οἱ παρεστῶτες
  choice: ceux qui se tenaient là
  rationale: Rend le participe désignant les personnes présentes ou se tenant à proximité, tout en restant idiomatique.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français correspond à l’aspect duratif ou répété de l’imparfait grec.
- source_word: Ἀληθῶς
  choice: vraiment
  rationale: Marque l’assurance de l’affirmation dans un dialogue naturel.
- source_word: ἐξ αὐτῶν εἶ
  choice: tu es l’un d’eux
  rationale: Rend clairement l’appartenance de Pierre au groupe visé.
- source_word: καὶ γὰρ
  choice: car toi aussi
  rationale: « Car » introduit la raison avancée, tandis que « toi aussi » conserve la valeur additive de καί.
- source_word: Γαλιλαῖος
  choice: Galiléen
  rationale: Désigne naturellement en français une personne originaire de Galilée.
- source_word: ἡ λαλιά σου
  choice: ta façon de parler
  rationale: Expression assez large pour couvrir la manière de parler, le dialecte ou l’accent, sans réduire d’emblée le terme à l’accent seul.
- source_word: ὁμοιάζει
  choice: est semblable à la leur
  rationale: Rend l’idée de ressemblance. Le référent implicite est exprimé en français pour obtenir une phrase naturelle, sans adopter l’interprétation plus libre « te trahit ».
