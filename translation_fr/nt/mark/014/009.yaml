id: MRK.14.9
reference: Mark 14:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: fr
  text: Vraiment, je vous le dis, partout dans le monde où la bonne nouvelle[a] sera proclamée, ce que cette femme a fait sera aussi raconté, en souvenir d’elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme mémorial d’elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Introduit une déclaration solennelle et pleine d’autorité. « Vraiment » en transmet naturellement la force en français moderne, sans conserver le terme sémitique non traduit.
- source_word: δὲ
  choice: '[implicite dans l’enchaînement]'
  rationale: δέ est ici un connecteur léger. L’enchaînement français n’exige pas de conjonction explicite.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française idiomatique qui conserve l’adresse directe et la solennité de la déclaration.
- source_word: ὅπου ἐὰν
  choice: partout où
  rationale: 'La combinaison exprime une généralité indéfinie : en tout lieu où la condition se réalisera.'
- source_word: κηρυχθῇ
  choice: sera proclamée
  rationale: Le verbe κηρύσσω évoque une annonce publique. « Proclamer » conserve cette portée sans limiter l’action à la prédication sous forme de sermon.
- source_word: τὸ εὐαγγέλιον
  choice: la bonne nouvelle
  rationale: Cette expression rend directement le sens de εὐαγγέλιον dans un français accessible. Le terme chrétien traditionnel « l’Évangile » est indiqué en note.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: dans le monde entier
  rationale: La formulation exprime naturellement en français l’étendue universelle indiquée par εἰς et ὅλον τὸν κόσμον.
- source_word: καὶ
  choice: aussi
  rationale: '« Aussi » fait ressortir la valeur additive : avec la proclamation de la bonne nouvelle, le geste de cette femme sera lui aussi raconté.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: ce que cette femme a fait
  rationale: Le démonstratif féminin αὕτη désigne la femme présente dans le contexte. L’explicitation du référent est claire et fidèle.
- source_word: λαληθήσεται
  choice: sera raconté
  rationale: Dans ce contexte, le futur passif indique que son geste fera l’objet d’un récit oral. « Sera raconté » est naturel en français et convient à un acte dont on transmet le souvenir.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: en mémoire d’elle
  rationale: Cette expression française claire et digne rend l’idée de souvenir commémoratif portée par μνημόσυνον.
theological_decisions:
- issue: Traduction de εὐαγγέλιον dans l’annonce d’une proclamation mondiale
  choice: la bonne nouvelle
  alternative: l’Évangile
  rationale: « La bonne nouvelle » rend directement le sens lexical grec et reste immédiatement compréhensible. « L’Évangile », terme chrétien traditionnel pouvant aussi être compris comme le nom d’un livre, est conservé en note sans imposer une nuance technique au texte principal.
- issue: Identification explicite de αὕτη
  choice: cette femme
  alternative: celle-ci / elle
  rationale: Le démonstratif grec est féminin singulier et renvoie sans ambiguïté à la femme du contexte immédiat. L’explicitation française améliore la clarté sans ajouter d’interprétation doctrinale.
- issue: Portée commémorative de εἰς μνημόσυνον αὐτῆς
  choice: en mémoire d’elle
  alternative: comme mémorial pour elle
  rationale: La formulation principale conserve l’idée que le récit de son geste entretiendra son souvenir. La note préserve la construction nominale plus formelle du grec sans préciser davantage la nature de ce mémorial.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la solennité de la parole de Jésus, l’étendue mondiale de la proclamation et la valeur commémorative du geste, sans résoudre au-delà du grec la nuance de μνημόσυνον.
