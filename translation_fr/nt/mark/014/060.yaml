id: MRK.14.60
reference: Mark 14:60
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: fr
  text: 'Alors le grand prêtre se leva au milieu de l’assemblée et interrogea Jésus : « Tu ne réponds rien ? De quoi ces hommes témoignent-ils contre toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste décrit ici l’action physique de se lever et fait progresser le récit avec naturel.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: C’est le terme français usuel pour le grand prêtre juif qui préside cette scène.
- source_word: εἰς μέσον
  choice: prit place au milieu
  rationale: La préposition εἰς suggère un mouvement vers une position centrale. Cette formulation française exprime ce déplacement sans recourir à une tournure archaïque.
- source_word: ἐπηρώτησεν
  choice: interrogea
  rationale: Dans ce cadre judiciaire, « interroger » rend mieux la portée de ἐπερωτάω que le verbe plus neutre « demander », sans renforcer excessivement le ton.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Tu ne réponds rien ?
  rationale: La formulation directe conserve la question brusque et rhétorique du grec tout en restant naturelle en français moderne.
- source_word: οὗτοί
  choice: ces hommes
  rationale: Le démonstratif masculin pluriel désigne les témoins masculins présents; le nom explicite son référent en français.
- source_word: καταμαρτυροῦσιν
  choice: portent-ils contre toi
  rationale: Associé à « témoignage », ce choix rend la valeur judiciaire de καταμαρτυρέω, qui signifie témoigner à charge contre quelqu’un.
theological_decisions:
- issue: Référence masculine de οὗτοί
  choice: ces hommes
  alternative: ceux-ci / ces gens
  rationale: Le masculin pluriel renvoie aux témoins précis présents dans la scène; « ces hommes » conserve cette référence sans la généraliser.
- issue: Contenu de la seconde question
  choice: Quel témoignage ces hommes portent-ils contre toi ?
  alternative: De quoi ces hommes témoignent-ils contre toi ?
  rationale: La formulation retenue garde l’accent sur le témoignage à charge et ne transforme pas la question en simple demande de sujet ou de motif.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier grec et à la confrontation judiciaire. La répétition de « disant » n’est pas reproduite, les deux-points introduisant naturellement les paroles en français.
