  text: καὶ οὐδὲ οὕτως ἴση ἦν ἡ μαρτυρία αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: fr
  text: Et même ainsi, leurs témoignages ne concordaient pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « leur témoignage ne concordait pas » ; plus littéralement, « leur témoignage n’était pas égal ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: Mais même… ne… pas
  rationale: Dans ce contexte, καί poursuit le récit tandis que οὐδέ renforce la négation. La tournure française « Mais même ainsi… ne… pas » exprime naturellement que, malgré cette formulation de l’accusation, l’accord requis faisait encore défaut.
- source_word: οὕτως
  choice: ainsi
  rationale: Renvoie à la manière dont l’accusation vient d’être formulée; « ainsi » est concis, naturel et conserve la valeur démonstrative.
- source_word: ἴση ἦν
  choice: ne concordaient pas
  rationale: ἴση signifie littéralement « égale », mais appliqué à des témoignages dans un cadre judiciaire, le sens contextuel est qu’ils ne coïncidaient pas ou n’étaient pas en accord. Le pluriel français s’accorde naturellement avec « témoignages ».
- source_word: ἡ μαρτυρία αὐτῶν
  choice: leurs témoignages
  rationale: Le grec emploie le singulier collectif « leur témoignage ». En français, le pluriel rend clairement les dépositions de plusieurs témoins dont on compare l’accord, sans changer le sens contextuel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le cadre judiciaire et l’insistance de οὐδέ, tout en évitant le calque peu naturel « le témoignage n’était pas égal » dans le texte principal.
