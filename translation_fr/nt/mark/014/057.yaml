  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: fr
  text: 'Quelques-uns se levèrent et rendaient de faux témoignages contre lui[a], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
