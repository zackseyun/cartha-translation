lexical_decisions:
- source_word: καί
  choice: alors
  rationale: Dans la continuité narrative, « alors » rend naturellement le lien avec l’action suivante sans alourdir la phrase.
- source_word: τινες
  choice: quelques-uns
  rationale: Préserve le caractère indéfini du groupe désigné.
- source_word: ἀναστάντες
  choice: se levèrent
  rationale: Rend directement le participe aoriste et convient au cadre d’une audition judiciaire.
- source_word: ἐψευδομαρτύρουν
  choice: portèrent un faux témoignage
  rationale: Expression française claire dans un contexte judiciaire; elle conserve aussi l’écho du vocabulaire du faux témoignage. L’imparfait grec peut présenter l’action en cours, mais la séquence française appelle naturellement ici le passé simple.
- source_word: κατ’ αὐτοῦ
  choice: contre lui
  rationale: Rend la valeur hostile de κατά avec le génitif dans ce contexte d’accusation.
- source_word: λέγοντες
  choice: 'en disant :'
  rationale: Introduit naturellement le contenu du témoignage cité au verset suivant.
