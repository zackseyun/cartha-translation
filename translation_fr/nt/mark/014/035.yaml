source:
  edition: SBLGNT
  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: fr
  text: S’étant avancé un peu[a], il tomba à terre et priait pour que, si c’était possible, l’heure s’éloigne de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étant allé un peu plus loin ».'
    reason: Alternative lexicale rendant plus explicitement l’idée d’avancer au-delà des autres.
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: s’étant avancé un peu
  rationale: Cette formulation rend le déplacement de Jésus sur une courte distance au-delà des autres tout en conservant la valeur circonstancielle du participe grec.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: il tomba à terre
  rationale: Le passé simple exprime naturellement en français le début de l’action dans ce récit; « à terre » marque le mouvement vers le sol.
- source_word: προσηύχετο
  choice: priait
  rationale: L’imparfait restitue l’aspect duratif de la prière dans la scène.
- source_word: ἵνα
  choice: pour que
  rationale: Dans ce contexte, ἵνα introduit ce que vise la prière; « pour que » en rend naturellement la nuance sans dissocier artificiellement contenu et visée.
- source_word: εἰ δυνατόν ἐστιν
  choice: si c’était possible
  rationale: L’imparfait français convient au cadre narratif passé et exprime la condition envisagée sans trancher la tension qu’elle porte.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: l’heure passe loin de lui
  rationale: Cette traduction conserve l’image de l’heure qui passe en restant éloignée de Jésus, ainsi que l’expression théologiquement chargée « l’heure », sans la remplacer par une explication.
theological_decisions:
- issue: Sens de « l’heure »
  choice: Conserver littéralement « l’heure » comme désignation du temps fixé de la souffrance et de la mort imminentes de Jésus.
  alternative: « le moment », « le temps de la souffrance »
  rationale: L’expression porte une charge narrative et théologique qu’une paraphrase explicative réduirait. La conserver maintient l’ambiguïté et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement du grec, tandis que l’imparfait « priait » souligne la durée de la prière. L’expression légèrement marquée « l’heure passe loin de lui » préserve la métaphore et la tension de l’original.
