  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: fr
  text: Puis il revint et les trouva endormis, car leurs yeux s'alourdissaient[a], et ils ne savaient que lui répondre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « leurs yeux étaient lourds ». Le grec les décrit comme étant alourdis, sans préciser explicitement par quoi.'
    reason: Précise l'image et la valeur descriptive du grec sans ajouter « sommeil » au texte traduit.
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: Puis il revint
  rationale: Dans ce contexte narratif, le retour de Jésus exprime naturellement l’action répétée marquée par πάλιν et l’antériorité du participe ἐλθών.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: il les trouva endormis
  rationale: « Trouver quelqu’un endormi » est une tournure française naturelle qui rend l’état en cours désigné par le participe καθεύδοντας.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: car leurs yeux étaient accablés de sommeil
  rationale: La formulation conserve l’image des yeux alourdis ou accablés tout en explicitant en français la cause implicite dans le contexte.
- source_word: οὐκ ᾔδεισαν
  choice: ils ne savaient
  rationale: Rend directement l’idée de connaissance exprimée par οἶδα.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: que lui répondre
  rationale: Cette interrogation indirecte infinitive est idiomatique en français et conserve l’idée d’une réponse adressée à Jésus.
