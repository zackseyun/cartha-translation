  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: fr
  text: 'Mais quelques-uns s’indignaient entre eux[a] : « Pourquoi ce gaspillage de parfum[b] a-t-il eu lieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les uns aux autres » ou « en eux-mêmes ». L’expression grecque peut évoquer une plainte échangée au sein du groupe ou une réaction intérieure.
    reason: lexical_alternative
  - marker: b
    text: Ou « cette huile parfumée ». Le mot grec désigne une huile ou une préparation parfumée, parfois rendue par « parfum » ou « onguent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Mais ... s’indignaient
  rationale: δέ marque ici un léger contraste avec le geste de la femme; « Mais » le rend naturellement, tandis que l’imparfait restitue la construction périphrastique ἦσαν ... ἀγανακτοῦντες.
- source_word: τινες
  choice: quelques-uns
  rationale: Le pronom indéfini pluriel ne précise pas l’identité des personnes; « quelques-uns » conserve cette indétermination.
- source_word: ἀγανακτοῦντες
  choice: s’indignaient
  rationale: Le verbe exprime une vive désapprobation à coloration morale, plus précisément rendue par « s’indigner » que par « se fâcher ».
- source_word: πρὸς ἑαυτούς
  choice: entre eux
  rationale: Dans le contexte d’une plainte exprimée, cette formulation française naturelle indique une réaction circulant au sein du groupe, tout en laissant ouverte la nuance réflexive du grec.
- source_word: Εἰς τί
  choice: Pourquoi
  rationale: L’expression interrogative demande ici à quelle fin ou pour quelle raison; « Pourquoi » est l’équivalent français idiomatique.
- source_word: ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν
  choice: Pourquoi avoir ainsi gaspillé ce parfum ?
  rationale: Cette tournure idiomatique française présente comme un gaspillage l’action accomplie sur le parfum. « Ainsi » reprend la valeur déictique de αὕτη, et l’infinitif passé rend l’événement achevé impliqué par γέγονεν sans produire une formulation française pesante.
- source_word: μύρον
  choice: parfum
  rationale: Le terme désigne une huile ou préparation parfumée de prix; « parfum » est clair en français moderne, tandis qu’une note conserve l’autre possibilité lexicale.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La plainte est formulée de façon idiomatique sans atténuer le jugement de gaspillage porté par les interlocuteurs.
