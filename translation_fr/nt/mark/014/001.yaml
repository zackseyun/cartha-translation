  rationale: La révision corrige la nuance potentiellement hypothétique du conditionnel, conserve le repérage temporel du grec et remplace une explicitation fonctionnelle par le terme français établi « scribes ». Les deux fêtes demeurent distinctement nommées, et la ruse, l'arrestation et le projet de tuer Jésus restent explicitement rendus.
