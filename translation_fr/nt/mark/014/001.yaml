  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: fr
  text: La Pâque et la fête des Pains sans levain devaient avoir lieu deux jours plus tard[a]. Les grands prêtres et les scribes cherchaient comment arrêter Jésus par ruse[b] et le tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après deux jours ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « le saisir par tromperie ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: auraient lieu
  rationale: Dans ce cadre temporel, le singulier ἦν situe comme imminents les deux observances étroitement liées. Le conditionnel exprime naturellement en français le futur vu depuis le récit passé; δέ est rendu par la progression narrative sans connecteur appuyé.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Désignation française traditionnelle et immédiatement reconnaissable de la fête juive; le contexte vise ici la célébration plutôt que l’agneau pascal.
- source_word: τὰ ἄζυμα
  choice: la fête des Pains sans levain
  rationale: Littéralement «les [pains] sans levain»; dans ce contexte, l’expression désigne la fête. L’explicitation évite en français une formulation obscure tout en maintenant la distinction avec la Pâque.
- source_word: μετὰ δύο ἡμέρας
  choice: deux jours plus tard
  rationale: Rend clairement l’imminence indiquée par l’expression grecque, littéralement «après deux jours», sans imposer une précision chronologique étrangère au texte.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: 'L’imparfait français conserve l’aspect duratif de l’imparfait grec: les responsables poursuivaient leur recherche d’un moyen d’agir.'
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Équivalent français usuel pour les principaux responsables du personnel sacerdotal, au pluriel.
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Rend la fonction de ces experts des Écritures et de la Loi dans un français moderne plus transparent que «scribes», sans les assimiler simplement à des copistes.
- source_word: πῶς
  choice: comment
  rationale: Introduit directement la manière recherchée pour accomplir leur projet.
- source_word: ἐν δόλῳ
  choice: par ruse
  rationale: Préserve l’idée de tromperie et de procédé déloyal portée par δόλος, sans la réduire à la seule discrétion.
- source_word: κρατήσαντες
  choice: arrêter
  rationale: Dans ce contexte d’autorités hostiles, le participe désigne le fait de saisir Jésus et de le placer sous leur pouvoir; «arrêter» est idiomatique et contextuellement exact.
- source_word: ἀποκτείνωσιν
  choice: le tuer
  rationale: Traduction directe du verbe, sans ajouter une nuance judiciaire qui n’est pas explicitement exprimée.
theological_decisions:
- issue: Rapport entre la Pâque et les Pains sans levain
  choice: Nommer distinctement «la Pâque» et «la fête des Pains sans levain»
  alternative: Les fondre en un seul nom de fête
  rationale: Marc mentionne explicitement les deux observances. La formulation conserve cette distinction tout en laissant apparaître leur proximité dans le calendrier juif.
- issue: Caractérisation morale du projet des responsables
  choice: Traduire ἐν δόλῳ par «par ruse»
  alternative: «en secret» ou «furtivement»
  rationale: Le grec évoque la tromperie ou la duplicité, non simplement le secret. La traduction maintient cette portée morale sans commentaire ajouté.
- issue: Référent pronominal de αὐτόν
  choice: Expliciter «Jésus»
  alternative: Conserver «l’arrêter»
  rationale: Le pronom grec renvoie à Jésus dans le contexte immédiat. En français isolé, l’explicitation rend le verset autonome et clair sans modifier le référent.
translation_notes:
  register: Français international moderne, naturel et digne. «Spécialistes de la Loi» privilégie la compréhension immédiate; «par ruse» garde la force éthique du grec. La ponctuation française évite de reproduire mécaniquement la coordination grecque.
