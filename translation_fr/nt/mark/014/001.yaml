review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement les deux observances, l'imparfait duratif de ἐζήτουν, la ruse (ἐν δόλῳ), la saisie/arrestation et la mise à mort. Toutefois, « auraient lieu » emploie un conditionnel qui peut suggérer une éventualité; l'imparfait « devaient avoir lieu » exprime plus nettement le futur envisagé depuis le cadre narratif, sans nuance d'incertitude.
  naturalness: Le français est globalement naturel et de registre approprié. « Devaient avoir lieu deux jours plus tard » est plus idiomatique et narrativement précis que « auraient lieu deux jours plus tard ». « Spécialistes de la Loi » est compréhensible, mais « scribes » est le terme français biblique courant et correspond plus directement à γραμματεῖς.
  terminology: « La Pâque », « la fête des Pains sans levain », « grands prêtres », « scribes », « par ruse » et « arrêter Jésus » sont appropriés. Le maintien de « scribes » évite de convertir un titre de groupe en description interprétative de leur fonction.
  issues:
  - severity: medium
    issue: Conditionnel dans « auraient lieu »
    rationale: 'Le conditionnel français peut introduire une valeur d''hypothèse ou de réserve absente du grec. Le contexte narratif appelle plutôt l''imparfait de futur dans le passé : « devaient avoir lieu ».'
  - severity: low
    issue: « spécialistes de la Loi » pour γραμματεῖς
    rationale: Cette paraphrase est intelligible, mais « scribes » est plus directement lexical, plus stable dans l'usage biblique français moderne et ne réduit pas leur rôle à une spécialité juridique.
