  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: fr
  text: 'Alors le grand prêtre déchira ses vêtements et dit[a] : « Quel besoin avons-nous encore de témoins ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un présent historique : « il dit ». Le français le rend ici par le passé simple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: le grand prêtre
  rationale: Équivalent français courant et précis pour le titulaire singulier de cette fonction dans ce contexte.
- source_word: διαρρήξας
  choice: déchira
  rationale: Rend directement l’action exprimée par le participe aoriste, dans un français moderne et naturel.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: ses vêtements
  rationale: Le pluriel χιτῶνας peut désigner plus précisément des tuniques, mais « vêtements » convient naturellement à la scène sans préciser indûment qu’il s’agit d’habits cérémoniels.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit en français écrit.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: Pourquoi avons-nous encore besoin
  rationale: Formulation française idiomatique qui conserve la valeur interrogative et le sens de ἔτι, à savoir qu’aucun témoignage supplémentaire ne paraît nécessaire.
- source_word: μαρτύρων
  choice: de témoins
  rationale: Complément naturel de « avoir besoin » en français et équivalent exact du génitif grec dans cette construction.
theological_decisions:
- issue: Sens du geste par lequel le grand prêtre déchire ses vêtements
  choice: Le geste est rapporté littéralement, sans en expliciter la signification.
  alternative: Ajouter qu’il agit sous le coup de l’indignation ou en réaction à ce qu’il considère comme un blasphème.
  rationale: Le verset décrit l’action et les paroles, mais n’explique pas lui-même le sens du geste. La traduction évite donc d’imposer une interprétation théologique ou psychologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Grand prêtre » est l’expression française consacrée. La question est formulée idiomatiquement tout en conservant l’idée de continuité portée par « encore ».
