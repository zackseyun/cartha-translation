  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: fr
  text: 'La servante le vit et se remit à dire à ceux qui se trouvaient là : « Cet homme est l’un d’eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: servante
  rationale: Le nom désigne ici une jeune femme attachée au service de la maison. « Servante » est naturel en français moderne et n’impose pas un statut juridique précis que le contexte ne met pas en avant.
- source_word: ἰδοῦσα αὐτόν
  choice: le vit
  rationale: Le participe aoriste exprime la circonstance qui déclenche la prise de parole. Une proposition coordonnée rend clairement et naturellement l’enchaînement narratif en français.
- source_word: ἤρξατο πάλιν λέγειν
  choice: se remit à dire
  rationale: Cette tournure française rend à la fois l’idée de commencement exprimée par ἤρξατο et celle de répétition portée par πάλιν.
- source_word: τοῖς παρεστῶσιν
  choice: à ceux qui se trouvaient là
  rationale: Le participe désigne les personnes présentes à proximité. Cette formulation est idiomatique et conserve le cadre spatial sans rigidité.
- source_word: Οὗτος
  choice: Cet homme
  rationale: Le démonstratif désigne directement Pierre. L’ajout de « homme » est naturel en français dans cette accusation et n’ajoute pas de nuance péjorative.
- source_word: ἐξ αὐτῶν ἐστιν
  choice: est l’un d’eux
  rationale: L’expression indique l’appartenance de Pierre au groupe associé à Jésus. « L’un d’eux » en est l’équivalent français direct et naturel.
