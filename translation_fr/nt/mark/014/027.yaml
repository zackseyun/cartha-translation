  source_fidelity: 'Le texte rend fidèlement les éléments du grec : le présent historique (« Jésus leur dit »), l’universalité de πάντες, la métaphore de σκανδαλισθήσεσθε (« trébucherez »), la formule scripturaire γέγραπται, ainsi que les futurs passifs de la citation. « Je frapperai le berger » conserve correctement le sujet implicite à la première personne de Πατάξω, sans lui en attribuer indûment l’identité.'
  naturalness: Le français est moderne, clair et suffisamment sobre pour le registre narratif et scripturaire. « Vous trébucherez tous » est idiomatique tout en maintenant l’image et sans expliciter abusivement « m’abandonnerez ».
