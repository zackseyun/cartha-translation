id: MRK.14.27
reference: Mark 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: fr
  text: 'Et Jésus leur dit : « Vous trébucherez tous[a], car il est écrit : “Je frapperai le berger, et les brebis seront dispersées.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous succomberez tous » ; plus littéralement, « Vous serez tous amenés à trébucher ».'
    reason: Alternative lexicale préservant la nuance passive et l’étendue sémantique de σκανδαλισθήσεσθε.
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent français « dit » correspond au présent historique grec et conserve la vivacité narrative caractéristique de Marc.
- source_word: σκανδαλισθήσεσθε
  choice: trébucherez tous
  rationale: « Trébucher » préserve l’image et l’ambiguïté du verbe grec, qui désigne ici la défaillance des disciples sous l’épreuve sans préciser à lui seul toute la portée de leur abandon.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française usuelle pour introduire une citation de l’Écriture, correspondant au parfait passif grec et à sa valeur durable.
- source_word: Πατάξω
  choice: Je frapperai
  rationale: Traduction directe et actuelle, qui conserve la force de l’action annoncée.
- source_word: ποιμένα
  choice: le berger
  rationale: Rend directement l’image prophétique au singulier avec l’article défini.
- source_word: τὰ πρόβατα
  choice: les brebis
  rationale: Terme naturel en français dans l’image du berger et du troupeau.
- source_word: διασκορπισθήσονται
  choice: seront dispersées
  rationale: Conserve le futur passif et l’image du troupeau qui se disperse après que le berger a été frappé.
theological_decisions:
- issue: Portée de σκανδαλισθήσεσθε concernant la défaillance des disciples
  choice: Vous trébucherez tous
  alternative: Vous succomberez tous ; vous serez tous amenés à trébucher
  rationale: Le choix principal conserve la métaphore grecque et laisse ouverte la nuance du passif, tout en reliant naturellement la défaillance des disciples à la dispersion annoncée par l’Écriture. Une formulation comme « vous m’abandonnerez tous » serait claire dans le contexte, mais ajouterait un complément absent de cette forme du texte grec.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec sans devenir artificielle ; le présent historique de Marc et la forme traditionnelle de la citation scripturaire sont conservés.
