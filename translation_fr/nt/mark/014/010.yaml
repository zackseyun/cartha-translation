id: MRK.14.10
reference: Mark 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: fr
  text: Alors Judas Iscariote, l’un des Douze, alla trouver les chefs des prêtres afin de le leur livrer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trahir en le livrant entre leurs mains ». Le verbe grec peut signifier « livrer » ou « remettre » quelqu’un; dans le cas de Judas, cette livraison constitue une trahison.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Alors
  rationale: Dans ce récit, la conjonction relie l’initiative de Judas à ce qui précède. « Alors » assure un enchaînement naturel en français sans ajouter de lien causal explicite.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Judas Iscariote
  rationale: Forme française traditionnelle et largement reconnue du nom et du surnom.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: l’un des Douze
  rationale: « Les Douze » désigne ici le groupe reconnu des disciples choisis par Jésus; la majuscule marque cette désignation collective.
- source_word: ἀπῆλθεν πρὸς
  choice: alla trouver
  rationale: Cette tournure française rend naturellement le déplacement intentionnel de Judas vers les responsables religieux.
- source_word: τοὺς ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Au pluriel, le terme désigne les principaux responsables de la hiérarchie sacerdotale de Jérusalem, et non plusieurs grands prêtres en fonction.
- source_word: ἵνα
  choice: afin de
  rationale: La locution exprime clairement le but de la démarche de Judas.
- source_word: παραδοῖ
  choice: livrer
  rationale: Le verbe grec signifie remettre ou livrer quelqu’un à d’autres. Dans ce contexte, l’acte constitue une trahison, mais « livrer » préserve la portée plus large du terme dans le récit de la Passion.
- source_word: αὐτὸν … αὐτοῖς
  choice: le leur
  rationale: Les deux pronoms rendent explicitement l’objet masculin, Jésus, et les destinataires, les chefs des prêtres, tout en suivant l’ordre naturel du français.
theological_decisions:
- issue: Sens de παραδοῖ dans le contexte de la trahison de Judas
  choice: le leur livrer
  alternative: le trahir en le livrant entre leurs mains
  rationale: « Livrer » conserve le motif narratif répété de Jésus remis aux mains d’autres personnes, sans réduire d’emblée le verbe à sa dimension morale. La note indique que, dans le cas de Judas, cette livraison est bien une trahison.
translation_notes:
  register: Français international moderne, clair et digne. « Alla trouver » est plus idiomatique que le calque « alla vers », tandis que « afin de le leur livrer » conserve le but exprimé en grec ainsi que les deux pronoms.
