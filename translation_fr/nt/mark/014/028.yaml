  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: fr
  text: Mais, après que j’aurai été ressuscité[a], je vous précéderai en Galilée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après ma résurrection ». Le grec emploie l’infinitif passif du verbe « relever », expression courante pour parler de la résurrection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement le contraste avec l’annonce précédente de la dispersion des disciples.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: après que j’aurai été relevé d’entre les morts
  rationale: La tournure temporelle μετά avec l’infinitif articulé signifie « après que ». Le futur antérieur français exprime clairement l’antériorité par rapport au fait de précéder les disciples.
- source_word: ἐγερθῆναί
  choice: j’aurai été relevé d’entre les morts
  rationale: Le passif est conservé. L’ajout idiomatique « d’entre les morts » rend explicite en français le sens résurrectionnel que porte couramment ἐγείρω dans ce contexte, sans remplacer le verbe par le nom abstrait « résurrection ».
- source_word: προάξω
  choice: je vous précéderai
  rationale: Rend avec concision l’action d’aller avant les disciples vers la destination indiquée; le registre est courant et digne.
- source_word: ὑμᾶς
  choice: vous
  rationale: Pronom objet de la deuxième personne du pluriel, dont le nombre ressort du contexte.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: Expression française naturelle pour un déplacement vers cette région; « dans la Galilée » serait inutilement marqué en français moderne.
theological_decisions:
- issue: Formulation passive de la résurrection dans ἐγερθῆναί με
  choice: après que j’aurai été relevé d’entre les morts
  alternative: après que je serai ressuscité / après ma résurrection
  rationale: La formulation choisie préserve le passif grec et le sens résurrectionnel, sans transformer l’énoncé en actif ni substituer un nom abstrait à la forme verbale.
translation_notes:
  register: Français international moderne, naturel et digne. « Je vous précéderai » est plus fluide que « j’irai devant vous », tandis que « relevé d’entre les morts » conserve l’image verbale et le passif du grec.
