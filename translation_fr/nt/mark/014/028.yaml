    text: 'Ou : « après ma résurrection ». Le grec emploie l’infinitif passif du verbe « relever », expression courante pour parler de la résurrection.'
    reason: lexical_alternative
  revision_rationale: La révision retire l’explicitation non présente « d’entre les morts » et remplace « relevé » par « ressuscité », terme français plus naturel dans ce contexte. La construction « j’aurai été ressuscité » conserve la passivité du grec et l’antériorité temporelle.
