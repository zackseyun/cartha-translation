revisions:
- from: Mais après que j’aurai été relevé d’entre les morts[a], je vous précéderai en Galilée.
  to: Mais, après que j’aurai été ressuscité[a], je vous précéderai en Galilée.
  rationale: La révision retire l’explicitation non présente « d’entre les morts » et remplace « relevé » par « ressuscité », terme français plus naturel dans ce contexte. La construction « j’aurai été ressuscité » conserve la passivité du grec et l’antériorité temporelle.
