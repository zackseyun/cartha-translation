review_pass:
  verdict: revise
  source_fidelity: Le contraste (« Mais »), la séquence temporelle, le futur de προάξω et la destination sont fidèlement rendus. Cependant, « d’entre les morts » n’est pas exprimé dans le grec de ce verset; bien que le contexte soit résurrectionnel, cet ajout explicatif n’est pas nécessaire dans le texte principal.
  naturalness: « Relevé d’entre les morts » est compréhensible, mais « ressuscité » est le terme français moderne, courant et digne dans ce contexte. Le futur antérieur après « après que » rend naturellement l’antériorité par rapport à « je vous précéderai ».
  terminology: « Ressuscité » rend idiomatiquement ἐγερθῆναι tout en maintenant la valeur passive par « avoir été ressuscité ». « Je vous précéderai » et « en Galilée » conviennent au registre et au sens.
  issues:
  - severity: medium
    issue: Ajout de « d’entre les morts » dans le texte principal
    rationale: Le complément ne figure pas dans ἀλλὰ μετὰ τὸ ἐγερθῆναί με. Le sens de résurrection est clair dans le contexte, mais l’ajout réduit la concision du grec et dépasse sa formulation explicite.
  - severity: low
    issue: « relevé » est moins idiomatique que « ressuscité »
    rationale: En français moderne, « être relevé » peut évoquer le fait d’être aidé à se lever. « Avoir été ressuscité » communique plus nettement et plus naturellement le sens de résurrection sans changer la voix passive.
  revised_text: Mais, après que j’aurai été ressuscité[a], je vous précéderai en Galilée.
  revised_footnotes:
