  verdict: revise
  source_fidelity: 'Révision nécessaire : « qu’ils disaient » ajoute une attribution au pluriel qui ne correspond pas au grec de ce verset. ὅτι introduit ici les paroles des témoins, dont le contenu commence par le pronom emphatique « Nous ». La citation directe, dépendant naturellement du « disant » du verset précédent, rend fidèlement la syntaxe et le statut de témoignage rapporté.'
  naturalness: 'La citation directe est plus fluide en français et évite la redondance de « qu’ils disaient : “Nous…” ». « Fait par des mains humaines » est une formulation moderne et naturelle, tout en conservant le contraste explicite avec « qui n’est pas fait par des mains humaines ».'
  terminology: « Sanctuaire » est recevable pour ναός dans ce contexte. Le contraste χειροποίητον / ἀχειροποίητον est maintenu sans identifier interprétativement l’auteur du second sanctuaire. « En trois jours » préserve l’ambiguïté temporelle sans imposer « après trois jours ».
