  - severity: low
    issue: « ne sera pas fait de main humaine » rend l’adjectif grec comme un futur
    rationale: ἀχειροποίητον est un adjectif qui qualifie « un autre » ; il ne comporte pas de valeur future. Une formulation au présent conserve mieux la qualification sans modifier le temps.
