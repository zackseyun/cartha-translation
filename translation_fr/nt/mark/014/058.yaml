source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: fr
  text: '« Nous l’avons entendu dire : “Je détruirai ce sanctuaire-ci, fait par des mains humaines[a], et, en trois jours[b], j’en construirai un autre, qui n’est pas fait par des mains humaines.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque oppose ce qui est « fait de main » à ce qui ne l’est pas ; le contraste est repris à la fin du verset.
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque peut aussi se traduire par « dans un délai de trois jours » ; elle désigne la période dans laquelle l’action doit s’accomplir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 'qu’ils disaient :'
  rationale: Dans le contexte syntaxique de la phrase commencée au verset précédent, ὅτι introduit le contenu du témoignage. Une formule française explicite permet au fragment de rester naturel tout en signalant qu’il s’agit de paroles rapportées.
- source_word: Ἡμεῖς
  choice: Nous
  rationale: Le pronom exprimé est conservé afin de rendre l’insistance des témoins sur leur propre audition.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: nous l’avons entendu dire
  rationale: Formulation idiomatique en français qui rend la construction avec participe sans l’alourdir.
- source_word: καταλύσω
  choice: je détruirai
  rationale: Le verbe désigne ici la destruction ou le démantèlement d’un édifice; « détruirai » restitue clairement la portée de l’accusation.
- source_word: ναὸν
  choice: sanctuaire
  rationale: ναός désigne plus précisément le sanctuaire, c’est-à-dire l’édifice sacré proprement dit, plutôt que l’ensemble du domaine du Temple.
- source_word: τοῦτον
  choice: ce sanctuaire-ci
  rationale: La tournure conserve la valeur déictique appuyée du démonstratif grec.
- source_word: χειροποίητον
  choice: fait de main humaine
  rationale: Cette expression française naturelle conserve le contraste morphologique et rhétorique avec ἀχειροποίητον.
- source_word: διὰ τριῶν ἡμερῶν
  choice: en trois jours
  rationale: La formule française peut exprimer la durée au terme de laquelle ou dans laquelle la construction s’accomplit, sans imposer « après trois jours ».
- source_word: ἄλλον
  choice: un autre
  rationale: Rend directement l’idée d’un second sanctuaire distinct du premier.
- source_word: ἀχειροποίητον
  choice: qui ne sera pas fait de main humaine
  rationale: La formulation parallèle préserve le contraste grec sans l’interpréter comme une opposition explicite entre humain et divin.
- source_word: οἰκοδομήσω
  choice: j’en construirai
  rationale: Le verbe signifie « construire »; le pronom « en » reprend naturellement « sanctuaire » sans ajouter l’idée de reconstruction.
theological_decisions:
- issue: Statut de la déclaration comme témoignage hostile
  choice: Présenter simplement les paroles comme le contenu rapporté du témoignage
  alternative: Ajouter que les témoins déformaient ou prétendaient rapporter les paroles de Jésus
  rationale: Le verset rapporte leur affirmation sans fournir ici d’explication harmonisante; la structure des citations suffit à maintenir cette distance narrative.
- issue: Portée théologique du contraste χειροποίητον / ἀχειροποίητον
  choice: « fait de main humaine » / « ne sera pas fait de main humaine »
  alternative: « construit par les hommes » / « construit par Dieu »
  rationale: Le texte oppose ce qui est fait de main à ce qui ne l’est pas, mais ne nomme pas explicitement l’auteur du second sanctuaire. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Sanctuaire » rend précisément ναός; « ce sanctuaire-ci » conserve l’insistance du démonstratif. Les guillemets emboîtés distinguent le témoignage des paroles attribuées à Jésus.
