  to: '« Nous l’avons entendu dire : “Je détruirai ce sanctuaire-ci, fait par des mains humaines[a], et, en trois jours[b], j’en construirai un autre, qui n’est pas fait par des mains humaines.” »'
  rationale: La révision rétablit les témoins comme locuteurs de la citation, conformément à ὅτι Ἡμεῖς ἠκούσαμεν. Elle supprime l’attribution ajoutée « qu’ils disaient », remplace la qualification future du second sanctuaire par une qualification au présent, et conserve le parallélisme lexical ainsi que l’ambiguïté temporelle du grec.
