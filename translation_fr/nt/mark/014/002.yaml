  text: ἔλεγον ⸀γάρ· Μὴ ἐν τῇ ἑορτῇ, μήποτε ⸂ἔσται θόρυβος⸃ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: fr
  text: 'Car ils disaient : « Pas pendant la fête, de peur qu’il n’y ait des troubles parmi le peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ils disaient
  rationale: L’imparfait exprime une parole en cours ou répétée; « ils disaient » en conserve naturellement l’aspect.
- source_word: γάρ
  choice: Car
  rationale: Le terme introduit l’explication de ce qui précède; « Car » maintient explicitement ce lien logique.
- source_word: Μὴ
  choice: Pas
  rationale: La négation est elliptique dans le discours délibératif, avec l’idée sous-entendue de ne pas agir à ce moment-là. « Pas » préserve la concision de la formulation grecque.
- source_word: ἐν τῇ ἑορτῇ
  choice: pendant la fête
  rationale: La préposition ἐν a ici un sens temporel. Dans le contexte, ἑορτή désigne la période de fête mentionnée au verset précédent.
- source_word: μήποτε
  choice: de peur que
  rationale: Cette locution introduit clairement en français un résultat redouté que les responsables veulent éviter.
- source_word: ἔσται
  choice: il n’y ait
  rationale: Après « de peur que », le subjonctif français exprime naturellement l’éventualité future redoutée.
- source_word: θόρυβος
  choice: des troubles
  rationale: Le mot désigne une agitation publique bruyante ou désordonnée. « Des troubles » rend cette portée sans imposer l’idée plus forte d’une émeute organisée.
- source_word: τοῦ λαοῦ
  choice: parmi le peuple
  rationale: Le génitif peut situer les troubles au sein de la population; cette traduction idiomatique conserve cette lecture sans désigner trop précisément le peuple comme leur cause.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste elliptique comme en grec. « De peur que » est courant et précis; « parmi le peuple » préserve l’ambiguïté relative du génitif quant au rapport entre les troubles et la population.
