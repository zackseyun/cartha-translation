id: MRK.14.34
reference: Mark 14:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: fr
  text: 'Et il leur dit : « Mon âme est accablée de tristesse[a], jusqu’à la mort[b]. Restez ici et veillez[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « profondément triste » ou « submergée de tristesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au point d’en mourir ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « restez éveillés »; le commandement peut désigner à la fois l’éveil physique et une vigilance attentive.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: il dit
  rationale: Le présent de narration conserve le style vif caractéristique de Marc sans le lisser en un passé.
- source_word: Περίλυπός
  choice: accablée de tristesse
  rationale: L’expression rend l’intensité de la détresse émotionnelle en français naturel et digne, sans en atténuer la force.
- source_word: ψυχή
  choice: âme
  rationale: « Âme » préserve l’image anthropologique du grec et désigne ici la vie intérieure, voire la personne tout entière, de Jésus dans son angoisse.
- source_word: ἕως θανάτου
  choice: jusqu’à la mort
  rationale: Cette traduction concise conserve l’ambiguïté de l’expression grecque entre une tristesse extrême et une tristesse qui conduit jusqu’au seuil de la mort.
- source_word: μείνατε
  choice: Restez
  rationale: L’impératif demande aux disciples de demeurer à cet endroit; « restez » est direct, courant et solennel sans être archaïque.
- source_word: ὧδε
  choice: ici
  rationale: Équivalent locatif simple et naturel.
- source_word: γρηγορεῖτε
  choice: veillez
  rationale: « Veillez » peut exprimer à la fois le fait de rester éveillé et celui de demeurer vigilant, préservant ainsi la portée du commandement.
theological_decisions:
- issue: Sens de ψυχή dans la parole de Jésus
  choice: âme
  alternative: être; vie
  rationale: Le choix conserve la profondeur humaine et intérieure de l’angoisse de Jésus sans ajouter d’explication doctrinale au texte.
- issue: Portée de γρηγορεῖτε
  choice: veillez
  alternative: restez éveillés
  rationale: Le contexte implique l’éveil physique, mais le verbe peut aussi évoquer une vigilance plus large; « veillez » maintient cette tension.
- issue: Force de ἕως θανάτου
  choice: jusqu’à la mort
  alternative: au point d’en mourir
  rationale: La formulation retenue préserve l’image et l’ambiguïté du grec, tandis que l’alternative explicite davantage l’intensité potentiellement mortelle de la tristesse.
translation_notes:
  register: Français international moderne, clair et digne. Le présent de narration est maintenu. La ponctuation et les formulations évitent l’archaïsme tout en conservant la solennité de la scène.
