source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: fr
  text: Un jeune homme le suivait, vêtu seulement d’une toile de lin[a] sur son corps nu, et ils le saisissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un drap de lin ». Le mot grec peut désigner une toile de lin ou une pièce d’étoffe semblable à un drap.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: un jeune homme
  rationale: νεανίσκος désigne un jeune homme, et τις l’introduit comme un individu indéfini. En français courant, « un jeune homme » rend naturellement cette valeur sans la lourdeur de « un certain jeune homme ».
- source_word: συνηκολούθει
  choice: le suivait
  rationale: L’imparfait grec présente une action en cours dans le passé; l’imparfait français en conserve l’aspect.
- source_word: περιβεβλημένος
  choice: vêtu seulement de
  rationale: Le participe décrit ce dont le jeune homme était enveloppé ou revêtu. « Vêtu seulement de » est naturel et, avec la suite, indique qu’il ne portait rien d’autre.
- source_word: σινδόνα
  choice: une toile de lin
  rationale: σινδών désigne une pièce d’étoffe de lin, éventuellement comparable à un drap; « toile de lin » évite de préciser indûment sa forme ou sa fonction.
- source_word: ἐπὶ γυμνοῦ
  choice: sur son corps nu
  rationale: L’expression indique que la toile était portée directement sur le corps nu.
- source_word: κρατοῦσιν
  choice: on le saisit
  rationale: Le présent historique apporte de la vivacité au récit. Le pronom indéfini « on » rend naturellement en français le sujet pluriel non exprimé, tandis que « saisit » évite de surinterpréter le geste comme une arrestation formelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’imparfait de l’action en cours puis le présent historique vif du grec. Le marqueur [a] est placé immédiatement après le terme concerné.
