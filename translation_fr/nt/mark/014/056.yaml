  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: fr
  text: Car beaucoup portaient de faux témoignages contre lui, et leurs témoignages ne concordaient pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et les témoignages n’étaient pas égaux », c’est-à-dire qu’ils n’étaient pas en accord.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne de nombreuses personnes sans les qualifier explicitement de témoins; « beaucoup » conserve cette concision.
- source_word: γὰρ
  choice: car
  rationale: « Car » rend la valeur explicative de γάρ et relie ce constat au récit précédent.
- source_word: ἐψευδομαρτύρουν
  choice: portaient de faux témoignages
  rationale: L’imparfait grec présente une action en cours ou répétée; l’imparfait français la préserve, tandis que « porter un faux témoignage » garde la portée judiciaire du verbe.
- source_word: κατ’ αὐτοῦ
  choice: contre lui
  rationale: Dans ce contexte judiciaire, κατά suivi du génitif exprime l’orientation hostile des témoignages contre Jésus.
- source_word: ἴσαι
  choice: concordaient
  rationale: Le sens littéral est « égaux », mais appliqué à des témoignages, le terme indique qu’ils ne coïncidaient pas ou n’étaient pas en accord.
- source_word: αἱ μαρτυρίαι
  choice: leurs témoignages
  rationale: Le possessif français identifie naturellement ces témoignages comme ceux des nombreuses personnes déjà mentionnées.
- source_word: οὐκ ἦσαν
  choice: ne concordaient pas
  rationale: La négation et l’imparfait de εἰμί sont exprimés idiomatiquement avec le verbe « concorder », qui porte ici le sens contextuel de ἴσαι.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne, avec maintien du registre judiciaire. « Mais » traduit ici la portée contrastive de καί dans le contexte; la note conserve la formulation plus formelle et la valeur littérale de ἴσαι.
