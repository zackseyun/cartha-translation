source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: fr
  text: Les disciples partirent, entrèrent dans la ville et trouvèrent tout comme il le leur avait dit. Ils préparèrent alors la Pâque[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le repas de la Pâque ». Le grec peut désigner soit la Pâque en général, soit, dans ce contexte, le repas que les disciples devaient préparer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: partirent
  rationale: Dans ce contexte, le verbe indique qu’ils quittent le lieu où ils se trouvaient. « Partirent » est plus naturel en français que le calque « sortirent », sans perdre le mouvement de départ.
- source_word: οἱ μαθηταί
  choice: les disciples
  rationale: Terme consacré et toujours courant pour désigner les personnes qui suivent Jésus et reçoivent son enseignement.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: entrèrent dans la ville
  rationale: Cette formulation rend clairement le mouvement vers l’intérieur exprimé par εἰς et s’intègre naturellement après « partirent ».
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: trouvèrent tout comme il le leur avait dit
  rationale: « Tout » explicite avec naturel l’objet sous-entendu de « trouvèrent », à savoir la situation et les circonstances annoncées. Le plus-que-parfait marque l’antériorité des paroles de Jésus.
- source_word: ἡτοίμασαν
  choice: préparèrent
  rationale: Rend directement l’action de mettre en état ce qui est nécessaire pour la célébration ou le repas.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Conserve l’étendue sémantique du grec, qui peut désigner la Pâque dans son ensemble ou, ici, le repas pascal. La note signale l’interprétation contextuelle plus précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination grecque répétée est légèrement allégée pour produire un récit naturel, tandis que l’ordre des actions est conservé.
