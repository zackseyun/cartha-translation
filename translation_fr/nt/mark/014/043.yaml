id: MRK.14.43
reference: Mark 14:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: fr
  text: Aussitôt[a], tandis qu’il parlait encore, Judas arriva, l’un des Douze, et avec lui une foule armée d’épées et de bâtons[b]. Elle venait de la part des chefs des prêtres, des spécialistes de la Loi et des anciens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici un présent historique, littéralement « Judas arrive », qui donne de la vivacité au récit.
    reason: historical_present
  - marker: b
    text: Le mot traduit par « bâtons » signifie littéralement « bois » ; il désigne ici des bâtons ou des gourdins utilisés comme armes.
    reason: lexical_alternative
  - marker: c
    text: Ou « envoyée par ». Le grec dit plus directement qu’elle venait « de la part » de ces autorités et peut indiquer ainsi sa provenance ou leur autorisation.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Rend directement la soudaineté et le rythme vif caractéristiques du récit de Marc.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: tandis qu’il parlait encore
  rationale: Reproduit la simultanéité exprimée par le génitif absolu et rend explicitement ἔτι par « encore ».
- source_word: παραγίνεται
  choice: arriva
  rationale: Le présent historique grec est rendu au passé simple, temps naturel d’un récit français écrit, tout en conservant l’entrée soudaine de Judas dans la scène.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: εἷς τῶν δώδεκα
  choice: l’un des Douze
  rationale: Conserve la désignation concise du groupe sans ajouter « disciples », absent du texte grec.
- source_word: ὄχλος
  choice: une foule
  rationale: Correspond au sens lexical ordinaire sans introduire dans le nom lui-même la nuance plus interprétative de « bande » ou de « foule hostile ».
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: armée d’épées et de bâtons
  rationale: « Armée de » exprime naturellement en français que la foule porte ces objets comme armes. « Bâtons » rend le sens contextuel de ξύλα, littéralement des objets de bois.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: de la part des chefs des prêtres, des spécialistes de la Loi et des anciens
  rationale: « De la part de » préserve l’idée de provenance ou d’autorisation portée par παρά avec le génitif, sans préciser indûment les modalités de l’envoi.
- source_word: ἀρχιερέων
  choice: chefs des prêtres
  rationale: Désigne les membres de l’aristocratie sacerdotale plutôt qu’une pluralité de grands prêtres en fonction.
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Formulation claire en français moderne pour les experts et interprètes des Écritures et de la Loi; elle évite le sens moderne trompeur de « scribes » comme simples copistes.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Terme consacré qui conserve la fonction institutionnelle de ces dirigeants juifs.
theological_decisions:
- issue: Temps du présent historique παραγίνεται
  choice: Passé simple (« arriva »)
  alternative: Présent de narration (« arrive »)
  rationale: Le passé simple s’intègre naturellement au récit littéraire français; le marqueur « Aussitôt » et l’ordre de la phrase maintiennent la vivacité du grec.
- issue: Portée de παρά devant les autorités
  choice: « de la part des »
  alternative: « envoyée par » ou simplement « venant des »
  rationale: La formulation retenue indique la provenance et l’autorisation institutionnelles sans affirmer plus explicitement que le grec les modalités d’un envoi officiel.
- issue: Caractère hostile de ὄχλος
  choice: « une foule »
  alternative: « une bande » ou « une foule hostile »
  rationale: Le nom grec signifie d’abord « foule »; l’armement rend déjà manifeste l’hostilité, sans qu’il faille l’inscrire dans le substantif.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Spécialistes de la Loi » privilégie l’intelligibilité actuelle; « les Douze » et « les anciens » conservent les désignations institutionnelles concises du texte.
