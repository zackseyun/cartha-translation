id: MRK.14.48
reference: Mark 14:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: fr
  text: 'Alors Jésus leur dit : « Vous êtes venus avec des épées et des bâtons pour vous emparer de moi, comme si j’étais un bandit[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brigand », « hors-la-loi » ou « insurgé » ; le mot grec peut désigner un criminel violent ou un rebelle armé, et pas seulement un voleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Alors Jésus leur dit
  rationale: La double formule grecque introduit la prise de parole. En français moderne, « leur dit » la rend naturellement sans le calque lourd « répondit et dit »; « alors » maintient l’enchaînement narratif porté par καί.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: comme si j’étais un bandit
  rationale: Cette formulation française exprime clairement que les hommes traitent Jésus comme un criminel dangereux contre lequel on vient en armes, tout en conservant la comparaison rhétorique.
- source_word: λῃστὴν
  choice: bandit
  rationale: « Bandit » évoque mieux qu’un simple « voleur » le brigand violent que peut désigner λῃστής, sans imposer dans le texte principal le sens plus précis d’« insurgé ».
- source_word: ἐξήλθατε
  choice: vous êtes venus
  rationale: Dans la situation d’énonciation, le mouvement est orienté vers Jésus; « vous êtes venus » est idiomatique et restitue convenablement l’aoriste dans cette question de reproche.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: avec des épées et des bâtons
  rationale: « Épées » est le terme courant ici pour μάχαιραι; « bâtons » rend ξύλα comme armes de bois sans recourir au terme moins international « gourdins ».
- source_word: συλλαβεῖν με
  choice: pour vous emparer de moi
  rationale: Le contexte est celui d’une arrestation, mais « vous emparer de moi » conserve la force concrète de συλλαμβάνω et reste naturel dans la bouche de Jésus.
theological_decisions:
- issue: Portée de λῃστής dans la comparaison appliquée à Jésus
  choice: « bandit » dans le texte, avec la possibilité de « brigand » ou « insurgé » signalée en note
  alternative: « voleur », « brigand », « hors-la-loi » ou « insurgé »
  rationale: Le mot peut désigner un criminel violent, voire un insurgé, et pas seulement un auteur de vol. « Bandit » préserve cette largeur sans transformer la question en affirmation selon laquelle Jésus serait politiquement accusé d’insurrection.
translation_notes:
  register: Français moderne, international et digne. La syntaxe a été réorganisée pour que la question rhétorique soit naturelle en français, sans atténuer le reproche. La coordination grecque ἀποκριθεὶς … εἶπεν n’a pas été calquée, car « répondit et dit » serait artificiel ici.
