id: MRK.14.22
reference: Mark 14:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: fr
  text: 'Pendant qu’ils mangeaient, il prit du pain, prononça la bénédiction, le rompit et le leur donna. Il dit : « Prenez ; ceci est mon corps[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « ceci représente mon corps » ou « ceci signifie mon corps ». Le grec dit littéralement : « ceci est mon corps ».'
    reason: Signaler les compréhensions figuratives possibles tout en indiquant que le texte principal suit directement la formulation grecque.
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: pendant qu’ils mangeaient
  rationale: Le génitif absolu avec participe présent exprime une action en cours et simultanée. Cette formulation est naturelle en français et conserve cet aspect.
- source_word: λαβὼν ἄρτον
  choice: il prit du pain
  rationale: Dans ce récit, le participe aoriste se rend naturellement par un verbe conjugué. L’absence d’article devant ἄρτον favorise « du pain », sans préciser indûment qu’il s’agissait d’un pain entier.
- source_word: εὐλογήσας
  choice: prononça la bénédiction
  rationale: Dans le contexte d’un repas, le verbe désigne l’action de prononcer une bénédiction. Cette formulation naturelle évite d’ajouter un complément d’objet absent du grec.
- source_word: ἔκλασεν
  choice: le rompit
  rationale: Le pronom reprend clairement le pain. « Rompre » convient au registre biblique tout en restant compréhensible en français moderne.
- source_word: ἔδωκεν αὐτοῖς
  choice: le leur donna
  rationale: Le pain constitue l’objet sous-entendu du verbe grec. La formulation française l’explicite sobrement, sans ajouter l’idée de distribution.
- source_word: Λάβετε
  choice: Prenez
  rationale: L’impératif aoriste invite directement les disciples à prendre le pain. Aucun complément supplémentaire n’est nécessaire.
- source_word: τοῦτό ἐστιν
  choice: ceci est
  rationale: La copule grecque est rendue directement, sans imposer une interprétation figurative ou sacramentelle.
- source_word: τὸ σῶμά μου
  choice: mon corps
  rationale: σῶμα signifie ici directement « corps » ; rien dans la formulation grecque ne justifie de remplacer ce terme par une explication interprétative.
theological_decisions:
- issue: Sens de la déclaration de Jésus au sujet du pain
  choice: « ceci est mon corps »
  alternative: « ceci représente mon corps » ou « ceci signifie mon corps »
  rationale: Le grec emploie la copule ordinaire ἐστιν. La traduction principale en conserve la formulation directe et laisse subsister la tension théologique, sans trancher dans le texte les débats sur la nature du repas du Seigneur.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative est fluide ; « prononça la bénédiction » évite une ambiguïté peu naturelle en français, et « rompit » conserve la tonalité biblique sans archaïsme marqué.
