  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: fr
  text: Pendant que Pierre était en bas dans la cour, une des servantes[a] du grand prêtre arriva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une des esclaves du grand prêtre ». Le mot grec peut désigner une servante ou une esclave.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Pendant que Pierre était
  rationale: Le génitif absolu avec participe présent pose une circonstance temporelle continue; « Pendant que Pierre était » la rend naturellement en français.
- source_word: κάτω
  choice: en bas
  rationale: L’expression indique une position inférieure, vraisemblablement par rapport à l’endroit où se déroulait l’interrogatoire.
- source_word: ἐν τῇ αὐλῇ
  choice: dans la cour
  rationale: Dans ce contexte résidentiel, αὐλή désigne la cour intérieure de la demeure du grand prêtre.
- source_word: ἔρχεται
  choice: arriva
  rationale: Le présent historique grec est rendu au passé simple, temps naturel d’une action ponctuelle dans un récit français au passé.
- source_word: μία τῶν παιδισκῶν
  choice: une des servantes
  rationale: παιδίσκη peut désigner une jeune servante ou une esclave; « servante » exprime ici clairement sa fonction domestique sans trancher inutilement son statut juridique.
- source_word: τοῦ ἀρχιερέως
  choice: du grand prêtre
  rationale: Le génitif marque son appartenance ou son rattachement à la maison du grand prêtre.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. Le passé simple maintient un registre narratif écrit courant; « en bas, dans la cour » conserve l’ordre spatial marqué du grec. Le marqueur de note est placé après la proposition entière afin de ne pas interrompre l’arrivée du personnage.
