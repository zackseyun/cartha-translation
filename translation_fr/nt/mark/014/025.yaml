id: MRK.14.25
reference: Mark 14:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: fr
  text: Vraiment, je vous le dis, je ne boirai plus jamais[a] du fruit de la vigne[b] jusqu’au jour où je le boirai nouveau[c] dans le royaume de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne boirai certainement plus ». Le grec emploie une négation future particulièrement emphatique.
    reason: lexical_alternative
  - marker: b
    text: « Fruit de la vigne » traduit l’expression grecque, qui désigne ici la boisson tirée de la vigne et servie pendant le repas.
    reason: lexical_alternative
  - marker: c
    text: Ou « de nouveau ». L’adjectif grec peut signifier « nouveau » et peut évoquer une nouveauté dans le cadre futur du royaume.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Dans la formule solennelle ἀμὴν λέγω ὑμῖν, « Vraiment » transmet clairement la valeur affirmative de ἀμήν en français moderne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française naturelle et solennelle qui conserve l’adresse directe.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: je ne boirai certainement plus
  rationale: « Plus » rend οὐκέτι, tandis que « certainement » fait entendre la négation future fortement emphatique οὐ μή sans produire une tournure française maladroite.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: du fruit de la vigne
  rationale: Cette expression conserve l’image et le degré de précision du grec, qui désigne le produit de la vigne sans employer directement le mot « vin ».
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: jusqu’à ce jour-là
  rationale: Rend directement la limite temporelle et la valeur démonstrative de ἐκείνης.
- source_word: ὅταν
  choice: où
  rationale: Après « ce jour-là », la relative temporelle « où » est idiomatique en français et renvoie naturellement à l’événement futur envisagé.
- source_word: αὐτὸ πίνω
  choice: je le boirai
  rationale: Le pronom « le » renvoie au produit de la vigne déjà mentionné; le futur français explicite la portée future du présent subjonctif grec après ὅταν.
- source_word: καινὸν
  choice: nouveau
  rationale: Le choix littéral préserve l’ouverture entre une nouveauté de qualité et l’idée de boire de nouveau, sans trancher l’ambiguïté.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: Formulation traditionnelle, claire et exacte de l’expression grecque.
theological_decisions:
- issue: Sens de καινὸν dans la proposition finale
  choice: « nouveau », sans préciser la nature de cette nouveauté
  alternative: « de nouveau » ou « d’une manière nouvelle »
  rationale: Le grec peut évoquer une nouveauté qualitative, notamment dans l’horizon du royaume, mais ne l’explicite pas. La traduction conserve donc cette tension.
- issue: Référent de « fruit de la vigne »
  choice: Conserver l’expression « fruit de la vigne »
  alternative: « vin »
  rationale: Le contexte indique le contenu de la coupe, mais le grec n’emploie pas directement le terme « vin ». Conserver l’expression évite une précision interprétative supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La déclaration conserve sa solennité sans archaïsme. « Certainement plus » maintient l’emphase grecque, tandis que les notes signalent les principales possibilités lexicales et eschatologiques.
