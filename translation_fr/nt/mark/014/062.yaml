source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: fr
  text: 'Mais Jésus dit : « Je le suis[a]. Et vous verrez le Fils de l’homme assis à la droite de la Puissance[b] et venant avec les nuées du ciel[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Je suis. »'
    reason: alternative_reading
  - marker: b
    text: « La Puissance » est une manière révérencielle de désigner Dieu.
    reason: cultural_note
  - marker: c
    text: Cette déclaration fait écho au Psaume 110.1 et à Daniel 7.13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Je suis
  rationale: Cette formulation reproduit l’expression grecque emphatique sans ajouter de complément. Elle conserve à la fois la réponse affirmative immédiate et sa possible portée plus profonde, même si elle est moins habituelle en français que « Je le suis ».
- source_word: ὄψεσθε
  choice: vous verrez
  rationale: Le futur est rendu directement et naturellement, sans atténuer la force de l’annonce.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle préserve l’idiome biblique, son lien avec Daniel 7 et sa portée théologique.
- source_word: ἐκ δεξιῶν
  choice: à la droite de
  rationale: Expression française biblique et intelligible qui désigne la place d’honneur et d’autorité.
- source_word: τῆς δυνάμεως
  choice: la Puissance
  rationale: Le grec emploie une périphrase révérencielle pour désigner Dieu. La majuscule signale cet emploi sans remplacer la formulation du texte source par « Dieu ».
- source_word: καθήμενον
  choice: assis
  rationale: Le participe décrit la position d’intronisation du Fils de l’homme; « assis » garde une formulation claire et digne.
- source_word: ἐρχόμενον
  choice: venant
  rationale: Le participe présent conserve le parallélisme avec « assis » ainsi que l’écho eschatologique de Daniel 7.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: avec les nuées du ciel
  rationale: « Nuées » maintient le registre apocalyptique et l’écho de Daniel 7, tandis que « du ciel » suit précisément le grec.
- source_word: καὶ ... καὶ
  choice: Et ... et
  rationale: La coordination répétée conserve la force cumulative de l’intronisation et de la venue annoncées.
theological_decisions:
- issue: Faut-il rendre Ἐγώ εἰμι comme une simple affirmation ou expliciter l’identification ?
  choice: « Je suis » dans le texte principal
  alternative: « Je le suis »
  rationale: Le grec ne comporte aucun attribut explicite. « Je suis » préserve la formulation ouverte du texte, sa fonction de réponse affirmative et sa possible résonance théologique, sans trancher entre elles.
- issue: Faut-il identifier explicitement τῆς δυνάμεως à Dieu ?
  choice: « la Puissance »
  alternative: « Dieu » ou « le Tout-Puissant »
  rationale: Le texte grec choisit une périphrase révérencielle. La conserver respecte le ton de la scène et évite de remplacer l’expression source par son référent interprété.
- issue: Comment préserver les allusions à Psaume 110.1 et Daniel 7.13 ?
  choice: Conserver « à la droite », « Fils de l’homme » et « avec les nuées du ciel »
  alternative: Paraphraser les images en termes d’autorité divine et de venue céleste
  rationale: Les formulations imagées portent les liens intertextuels et la tension théologique du propos de Jésus; une paraphrase les affaiblirait.
translation_notes:
  register: Français moderne, digne et accessible, avec un léger relief biblique dans « Fils de l’homme », « la Puissance » et « les nuées du ciel ». La tournure inhabituelle « Je suis » est intentionnelle afin de respecter l’absence d’attribut dans le grec et de préserver son ambiguïté.
