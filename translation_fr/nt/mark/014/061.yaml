source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: fr
  text: 'Mais lui gardait le silence et ne répondit rien. Le grand prêtre l’interrogea de nouveau et lui dit : « Est-ce toi, le Messie[a], le Fils du Béni[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός (Christos) est rendu ici par « Messie » parce qu’il s’agit d’un titre dans un contexte messianique juif.
    reason: alternative_reading
  - marker: b
    text: « Le Béni » est une manière révérencielle juive de désigner Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: gardait le silence
  rationale: L’imparfait exprime un silence qui se prolonge; cette formulation le rend naturellement en français.
- source_word: ἀπεκρίνατο οὐδέν
  choice: ne répondait rien
  rationale: La négation avec οὐδέν souligne l’absence totale de réponse; l’imparfait français s’accorde naturellement avec l’action continue précédente.
- source_word: πάλιν
  choice: de nouveau
  rationale: Marque clairement la répétition de l’interrogatoire.
- source_word: ἀρχιερεὺς
  choice: grand prêtre
  rationale: Désignation française courante et précise de la fonction sacerdotale juive dans ce contexte.
- source_word: ἐπηρώτα
  choice: l’interrogea
  rationale: Le verbe convient au cadre judiciaire. Le passé simple produit une narration française naturelle sans imposer une répétition que πάλιν exprime déjà.
- source_word: λέγει
  choice: lui dit
  rationale: Le présent historique de Marc est rendu par le passé simple, plus naturel dans une narration française soutenue et actuelle.
- source_word: χριστός
  choice: Messie
  rationale: Dans la question du grand prêtre, le mot fonctionne comme un titre messianique juif plutôt que comme un nom propre.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: le Fils du Béni
  rationale: Cette traduction conserve la périphrase révérencielle juive qui désigne Dieu sans remplacer le terme grec par une explicitation.
theological_decisions:
- issue: Traduction de Χριστός comme titre messianique
  choice: Messie
  alternative: Christ
  rationale: Le contexte juif de l’interrogatoire fait entendre un titre. « Messie » restitue directement cette portée tout en laissant « Christ » comme équivalent possible en note.
- issue: Traduction de τοῦ εὐλογητοῦ
  choice: du Béni
  alternative: de Dieu
  rationale: Le grec emploie une désignation révérencielle de Dieu. La conserver évite d’expliciter dans le texte principal ce que la formulation source laisse indirect.
translation_notes:
  register: Français international moderne, digne et accessible. « Gardait le silence » rend l’aspect continu; les verbes de narration suivants sont au passé simple pour préserver une lecture française naturelle. « Le Béni » conserve l’étrangeté signifiante de la périphrase grecque, expliquée en note.
