  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: fr
  text: 'Elle a fait ce qu’elle a pu[a] : elle a parfumé d’avance mon corps en vue de mon ensevelissement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Ce qu’elle avait, elle l’a fait. »'
    reason: Alternative lexicale signalant la forme plus littérale de l’idiome grec.
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Elle a fait ce qu’elle a pu
  rationale: Cette tournure française naturelle rend la valeur idiomatique de l’expression grecque, littéralement « ce qu’elle avait, elle l’a fait », sans en modifier le sens.
- source_word: προέλαβεν
  choice: d’avance
  rationale: Le verbe indique que l’action a été accomplie par anticipation. La locution adverbiale « d’avance » restitue clairement cette antériorité.
- source_word: μυρίσαι
  choice: elle a parfumé
  rationale: Le verbe désigne ici l’application d’un parfum ou d’une huile parfumée sur le corps. « Parfumer » est précis et courant en français, tandis que « embaumer » risquerait de suggérer une procédure funéraire plus complète.
- source_word: τὸ σῶμά μου
  choice: mon corps
  rationale: Traduction directe et naturelle du groupe nominal grec.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: en vue de mon ensevelissement
  rationale: La préposition exprime ici la finalité ou l’orientation de l’acte vers l’ensevelissement. Le possessif, implicite dans le lien avec « mon corps », est nécessaire pour une formulation française fluide et claire.
theological_decisions:
- issue: Explicitation du sujet féminin, implicite dans les formes verbales grecques
  choice: Elle a fait… elle a parfumé
  alternative: Ce qu’elle avait, elle l’a fait…
  rationale: Le sujet n’est pas exprimé dans cette proposition grecque, mais le contexte immédiat identifie sans ambiguïté la femme. Le pronom « elle » est nécessaire en français et n’ajoute aucun contenu théologique.
- issue: Sens de l’application du parfum dans le contexte funéraire
  choice: elle a parfumé d’avance mon corps en vue de mon ensevelissement
  alternative: elle a oint d’avance mon corps pour l’ensevelissement
  rationale: La formulation retenue conserve le geste concret et son orientation funéraire sans introduire une connotation rituelle ou doctrinale étrangère au contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en valeur le lien explicatif entre ce qu’elle pouvait faire et le geste accompli par anticipation.
