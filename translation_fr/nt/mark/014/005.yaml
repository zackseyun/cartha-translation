id: MRK.14.5
reference: Mark 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: fr
  text: « Car on aurait pu vendre ce parfum[a] pour plus de trois cents deniers et en donner le produit aux pauvres. » Et ils la rabrouaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette huile parfumée » ou « cet onguent parfumé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils la réprimandaient sévèrement ». Le verbe grec exprime une vive désapprobation ou une réprimande énergique.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: parfum
  rationale: Le terme désigne une huile ou un onguent parfumé. « Parfum » est naturel en français moderne et convient ici à cette substance aromatique coûteuse.
- source_word: πραθῆναι
  choice: vendre
  rationale: L’infinitif passif dépend de ἠδύνατο. La tournure française impersonnelle « on aurait pu vendre » exprime naturellement cette possibilité non réalisée.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: plus de trois cents deniers
  rationale: Avec le génitif d’un montant, ἐπάνω indique que la somme dépasse le chiffre donné. « Deniers » conserve le cadre monétaire antique sans conversion anachronique.
- source_word: καὶ δοθῆναι τοῖς πτωχοῖς
  choice: et en donner le produit aux pauvres
  rationale: Après la vente, ce qui peut être donné aux pauvres est implicitement la somme obtenue. « En donner le produit » explicite sobrement cette ellipse nécessaire en français.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: ils la rabrouaient
  rationale: Le verbe exprime une vive désapprobation dirigée contre la femme, avec l’idée d’une réprimande sévère. L’imparfait grec est conservé par l’imparfait français.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit la justification de la plainte précédente ; « Car » maintient clairement ce lien explicatif.
- source_word: ἠδύνατο
  choice: on aurait pu
  rationale: Dans ce contexte, l’imparfait de δύναμαι présente une possibilité passée qui ne s’est pas réalisée. Le conditionnel passé français rend cette nuance avec naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien explicatif introduit par γάρ, le montant antique et la force de la réprimande, tout en explicitant avec « le produit » l’objet sous-entendu du don aux pauvres.
