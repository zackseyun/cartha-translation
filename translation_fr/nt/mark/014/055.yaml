  source_fidelity: 'Le sens du grec est bien rendu : les imparfaits ἐζήτουν et ηὕρισκον sont conservés par « cherchaient » et « trouvaient », κατά exprime correctement l’hostilité dans « contre Jésus », et εἰς τό + infinitif exprime le but. « Mais » rend naturellement en français le contraste contextuel, sans prétendre traduire littéralement καί par un adversatif.'
  naturalness: « Mettre à mort » est plus idiomatique et plus directement adapté au cadre judiciaire que « faire mourir ». La minuscule à « conseil » évite de transformer le nom commun grec συνέδριον en titre institutionnel français non établi dans le texte principal.
  terminology: « Chefs des prêtres », « témoignage », « conseil » et « Sanhédrin » sont appropriés. La note doit présenter « Sanhédrin » comme une autre traduction/désignation historique possible, non comme un sens lexical « plus précis » imposé par συνέδριον.
