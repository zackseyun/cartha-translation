source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: fr
  text: Les chefs des prêtres et tout le conseil[a] cherchaient un témoignage contre Jésus afin de le mettre à mort, mais ils n’en trouvaient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout le Sanhédrin ».'
    reason: Alternative lexicale et désignation historique courante de συνέδριον dans ce contexte.
lexical_decisions:
- source_word: οἱ δὲ ἀρχιερεῖς
  choice: Les chefs des prêtres
  rationale: « Chefs des prêtres » désigne naturellement les responsables de la hiérarchie sacerdotale de Jérusalem. La particule δέ marque ici une progression narrative légère, que l’enchaînement français rend sans connecteur initial artificiel.
- source_word: ὅλον τὸ συνέδριον
  choice: tout le Conseil
  rationale: « Conseil » traduit le sens institutionnel de συνέδριον, tandis que « tout » conserve ὅλον. La majuscule signale qu’il s’agit de l’instance dirigeante particulière évoquée dans ce contexte.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait français restitue l’action continue exprimée par l’imparfait grec.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: un témoignage contre Jésus
  rationale: 'Le contexte est judiciaire, et κατά avec le génitif a ici une valeur hostile : il s’agit d’un témoignage à charge contre Jésus.'
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: afin de le faire mourir
  rationale: La construction avec εἰς et l’infinitif exprime le but. « Faire mourir » conserve la portée causative et judiciaire de θανατόω sans réduire la scène à un simple acte meurtrier.
- source_word: καὶ οὐχ ηὕρισκον
  choice: mais ils n’en trouvaient pas
  rationale: L’imparfait « trouvaient » maintient l’aspect duratif. Bien que καί signifie ordinairement « et », « mais » exprime ici en français naturel le contraste entre leur recherche et son absence de résultat, sans ajouter de contenu substantiel.
theological_decisions:
- issue: Identification de συνέδριον
  choice: tout le Conseil
  alternative: tout le Sanhédrin
  rationale: Le terme grec désigne l’assemblée dirigeante. Traduire son sens dans le texte principal est plus transparent pour le lecteur moderne; la désignation historique « Sanhédrin » est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Les imparfaits rendent la durée des deux actions grecques. Le vocabulaire judiciaire reste accessible sans technicisme inutile.
