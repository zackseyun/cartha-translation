id: MRK.14.38
reference: Mark 14:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: fr
  text: Restez éveillés et priez, afin de ne pas entrer dans l’épreuve[a]. L’esprit est plein de bonne volonté, mais la chair est faible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tentation »; le mot grec peut désigner une épreuve, une mise à l’épreuve ou une tentation.
    reason: alternative lexicale
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Restez éveillés
  rationale: L’impératif pluriel signifie littéralement « restez éveillés » ou « veillez ». Dans le contexte de Gethsémané, cette formulation naturelle conserve à la fois le sens concret et l’appel à la vigilance.
- source_word: προσεύχεσθε
  choice: priez
  rationale: L’impératif présent appelle à une prière continue, exprimée de façon idiomatique en français par l’impératif simple.
- source_word: ἵνα μὴ ἔλθητε
  choice: afin de ne pas entrer
  rationale: La construction ἵνα μή avec le subjonctif exprime ici le but préventif; « afin de ne pas » en garde clairement la valeur.
- source_word: εἰς πειρασμόν
  choice: dans l’épreuve
  rationale: πειρασμός peut désigner une épreuve, une mise à l’épreuve ou une tentation. « Épreuve » préserve ici la portée plus large du terme, tandis que la note signale l’autre traduction importante.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: L’esprit est plein de bonne volonté
  rationale: πνεῦμα désigne vraisemblablement ici l’esprit humain, en contraste avec la chair. πρόθυμος exprime une disposition empressée ou volontaire; cette tournure française rend naturellement l’intention sincère des disciples sans identifier l’esprit au Saint-Esprit.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: mais la chair est faible
  rationale: « Chair » maintient le contraste anthropologique du grec et sa tension théologique, sans le réduire au seul corps ni lui imposer le sens plus doctrinal de « nature pécheresse ».
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’esprit humain, écrit sans majuscule
  alternative: le Saint-Esprit
  rationale: Le contraste immédiat avec la chair et la faiblesse des disciples endormis favorise le sens de disposition intérieure humaine. La minuscule évite d’imposer une identification au Saint-Esprit que le contexte ne requiert pas.
- issue: Sens de σάρξ
  choice: la chair
  alternative: le corps; la nature pécheresse
  rationale: Le passage souligne la fragilité humaine plutôt qu’une doctrine explicite de la nature pécheresse. « Chair » conserve le lexème et l’ambivalence du contraste.
- issue: Sens de πειρασμός
  choice: l’épreuve
  alternative: la tentation
  rationale: Le terme grec couvre à la fois l’épreuve et la tentation. Dans la scène imminente de l’arrestation, « épreuve » garde cette amplitude, et une note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel est conservé dans les impératifs. La formulation évite l’archaïsme « veillez » tout en gardant son sens contextuel; « chair » est maintenu pour préserver le contraste du texte grec.
