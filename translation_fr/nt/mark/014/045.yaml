id: MRK.14.45
reference: Mark 14:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: fr
  text: 'Dès son arrivée, il s’approcha aussitôt de Jésus et lui dit : « Rabbi ! » et l’embrassa avec insistance.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’embrassa à plusieurs reprises » ou « l’embrassa chaleureusement » ; le verbe grec est plus appuyé que le simple verbe « embrasser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Dès son arrivée
  rationale: Le participe aoriste a ici une valeur temporelle. Cette tournure française naturelle marque l’arrivée de Judas et s’articule avec εὐθύς sans lourdeur.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme fréquent chez Marc imprime au récit un mouvement rapide; « aussitôt » est courant et digne.
- source_word: προσελθὼν αὐτῷ
  choice: il s’approcha de Jésus
  rationale: Le participe exprime un mouvement vers le référent. Le nom « Jésus » clarifie naturellement l’antécédent du pronom dans ce verset isolé.
- source_word: λέγει
  choice: lui dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit français, sans changement de sens.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: La translittération conserve le titre sémitique employé dans la scène ainsi que sa couleur historique.
- source_word: κατεφίλησεν
  choice: il l’embrassa avec insistance
  rationale: Le composé καταφιλέω est plus marqué que le simple φιλέω. « Avec insistance » en exprime la force sans imposer avec certitude l’idée de répétition ou de ferveur affective.
theological_decisions:
- issue: Titre donné par Judas à Jésus (Ῥαββί)
  choice: Rabbi
  alternative: Maître
  rationale: Conserver le titre présent dans le grec maintient la texture historique et l’ironie narrative sans ajouter d’interprétation doctrinale.
- issue: Force du geste exprimé par καταφιλέω
  choice: l’embrassa avec insistance
  alternative: l’embrassa à plusieurs reprises / l’embrassa chaleureusement
  rationale: Le verbe est emphatique, mais la nature précise de cette emphase reste ambiguë. La traduction signale l’intensité tout en laissant les principales possibilités en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique courant sans archaïsme. « Avec insistance » préserve l’emphase lexicale et l’ambiguïté du grec.
