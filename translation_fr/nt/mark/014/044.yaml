id: MRK.14.44
reference: Mark 14:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: fr
  text: 'Celui qui le livrait leur avait donné un signal[a], en disant : « Celui que j’embrasserai[b], c’est lui. Saisissez-le et emmenez-le sous bonne garde[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un signe de reconnaissance » ; le mot grec désigne un signe d’identification convenu à l’avance.
    reason: lexical_alternative
  - marker: b
    text: Le baiser était une salutation courante ; Judas s’en sert ici pour identifier Jésus.
    reason: cultural_note
  - marker: c
    text: Ou « emmenez-le en toute sécurité ». Dans ce contexte, l’expression signifie probablement qu’ils doivent le garder fermement sous contrôle.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: avait donné
  rationale: 'Le plus-que-parfait rend la valeur antérieure du verbe grec : le signal avait été convenu avant l’arrestation.'
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: celui qui le livrait
  rationale: Cette formulation conserve la construction participiale et le sens de remise aux autorités, tout en laissant au contexte sa portée de trahison.
- source_word: σύσσημον
  choice: un signal
  rationale: Le terme désigne ici un signe d’identification convenu à l’avance ; « signal » exprime clairement cette fonction.
- source_word: Ὃν ἂν φιλήσω
  choice: Celui que j’embrasserai
  rationale: Le futur français rend naturellement l’action servant à identifier Jésus, sans ajouter un nom absent du grec.
- source_word: αὐτός ἐστιν
  choice: c’est lui
  rationale: Cette tournure française naturelle conserve l’insistance de l’identification grecque.
- source_word: κρατήσατε
  choice: Saisissez-le
  rationale: Le verbe exprime une prise ferme et immédiate, sans réduire le geste à une simple procédure d’arrestation.
- source_word: ἀπάγετε ἀσφαλῶς
  choice: emmenez-le sous bonne garde
  rationale: Dans ce contexte d’arrestation, l’expression indique qu’il faut l’emmener en le maintenant fermement sous contrôle, plutôt que veiller principalement à sa sécurité personnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait marque l’antériorité du signal convenu. « Celui qui le livrait » préserve la formulation narrative et la tension sémantique entre remise aux autorités et trahison ; « sous bonne garde » rend idiomatiquement la sûreté de la détention.
