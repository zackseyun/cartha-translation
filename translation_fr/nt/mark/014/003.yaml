id: MRK.14.3
reference: Mark 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: fr
  text: Pendant qu’il était à Béthanie, couché à table dans la maison de Simon le lépreux, une femme vint avec un flacon d’albâtre contenant un parfum de nard pur[a], de très grand prix. Elle brisa le flacon et versa le parfum sur sa tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nard authentique » ; le sens de l’adjectif grec traduit par « pur » (πιστικῆς) est discuté.
    reason: Alternative lexicale pour un terme grec dont le sens exact est incertain.
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Pendant qu’il était ... à table
  rationale: Le génitif absolu plante le décor et présente une action en cours. « À table » rend naturellement en français la posture antique consistant à être allongé pour prendre un repas, sans suggérer qu’il était simplement couché.
- source_word: Βηθανίᾳ
  choice: Béthanie
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: la maison de Simon le lépreux
  rationale: L’apposition grecque désigne littéralement Simon comme « le lépreux ». Le texte ne précise pas qu’il s’agit d’un ancien lépreux ; cette éventuelle déduction n’est donc pas ajoutée.
- source_word: γυνὴ
  choice: une femme
  rationale: La femme n’est pas identifiée dans ce passage de Marc.
- source_word: ἀλάβαστρον
  choice: un flacon d’albâtre / le flacon
  rationale: Le nom désigne un récipient à parfum, traditionnellement en albâtre. « Flacon » convient mieux que « vase » au contenu parfumé et reste naturel en français moderne.
- source_word: μύρου
  choice: un parfum
  rationale: μύρον désigne une huile ou préparation parfumée. « Parfum » communique clairement sa fonction sans imposer une consistance précise.
- source_word: νάρδου
  choice: nard
  rationale: Le terme précis désignant cette substance aromatique est conservé plutôt que généralisé.
- source_word: πιστικῆς
  choice: pur
  rationale: L’adjectif est difficile et discuté. « Pur » exprime de façon concise l’idée probable de qualité non altérée, tandis que l’autre possibilité principale est signalée en note.
- source_word: πολυτελοῦς
  choice: de très grand prix
  rationale: Cette formulation française naturelle exprime la valeur économique élevée du parfum et prépare la réaction racontée dans la suite.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Elle brisa le flacon
  rationale: Le participe indique une action précédant le versement. Deux verbes coordonnés rendent clairement et naturellement la succession narrative.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: versa le parfum sur sa tête
  rationale: Le complément explicite « le parfum » évite en français l’ambiguïté d’un pronom qui pourrait renvoyer au flacon, tout en conservant le sens de l’action.
theological_decisions:
- issue: Faut-il atténuer la désignation « Simon le lépreux » en supposant qu’il était guéri ?
  choice: Conserver « Simon le lépreux »
  alternative: Simon, l’ancien lépreux
  rationale: Le grec donne cette désignation sans préciser que la maladie appartenait au passé. Ajouter « ancien » résoudrait par inférence une tension que le texte laisse intacte.
translation_notes:
  register: Français international moderne, narratif et digne. « À table » privilégie la compréhension immédiate tout en reflétant la posture de repas du contexte antique. La note [a] est placée après « pur », le mot auquel elle se rapporte.
