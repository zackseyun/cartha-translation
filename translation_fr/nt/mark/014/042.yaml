id: MRK.14.42
reference: Mark 14:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: fr
  text: 'Levez-vous, allons-y ! Regardez : celui qui me livre[a] s’est approché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui me trahit ».'
    reason: Variante contextuelle explicitant la portée relationnelle et morale de παραδίδωμι.
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Levez-vous
  rationale: Impératif pluriel de ἐγείρω. Dans ce contexte, Jésus invite les disciples à se mettre debout et à partir, plutôt qu’il ne leur ordonne simplement de se réveiller.
- source_word: ἄγωμεν
  choice: allons-y
  rationale: Subjonctif présent à valeur exhortative. « Allons-y » est idiomatique en français moderne et exprime clairement l’exhortation collective.
- source_word: ἰδού
  choice: Regardez
  rationale: Interjection attirant vivement l’attention sur ce qui arrive. Le pluriel correspond aux disciples auxquels Jésus s’adresse.
- source_word: ὁ παραδιδούς με
  choice: celui qui me livre
  rationale: Le participe substantivé désigne celui qui remet Jésus aux autorités. « Me livre » conserve le sens concret de παραδίδωμι tout en laissant entendre, dans ce contexte, la trahison de Judas.
- source_word: ἤγγικεν
  choice: s’est approché
  rationale: 'Le parfait de ἐγγίζω présente une approche accomplie dont le résultat est actuel : l’homme est désormais tout proche.'
theological_decisions:
- issue: Sens de παραδίδωμι dans le récit de la Passion
  choice: celui qui me livre
  alternative: celui qui me trahit
  rationale: « Livrer » préserve le mouvement concret de remise aux autorités et la tension propre au verbe grec, sans effacer la dimension de trahison que le contexte attribue à Judas.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation après « allons-y » rend l’urgence de la scène, tandis que les deux-points après « Regardez » introduisent naturellement ce sur quoi Jésus attire l’attention.
