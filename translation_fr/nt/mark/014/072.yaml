  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: fr
  text: 'Et aussitôt, un coq chanta pour la deuxième fois. Pierre se souvint alors de ce que Jésus lui avait dit : « Avant qu’un coq chante deux fois, tu me renieras trois fois. » Et, bouleversé, il pleurait.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens exact du participe grec traduit par « bouleversé » est incertain. Il peut évoquer une réaction intérieure intense, le fait d’y avoir réfléchi, ou, selon certaines interprétations, un geste physique. On peut aussi comprendre : « après y avoir réfléchi, il pleurait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Conserve l’urgence caractéristique du récit de Marc dans un français naturel.
- source_word: ἐκ δευτέρου
  choice: pour la deuxième fois
  rationale: Rend explicitement la répétition numérotée exprimée par le grec.
- source_word: ἀλέκτωρ / ἐφώνησεν
  choice: un coq chanta
  rationale: « Chanter » est le verbe français idiomatique pour le cri du coq.
- source_word: ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα
  choice: Pierre se souvint alors de ce que… lui avait dit
  rationale: Rend naturellement l’acte de se rappeler et la valeur de ῥῆμα comme parole prononcée; « alors » marque la progression narrative sans ajouter de causalité forte.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Avant qu’un coq chante deux fois
  rationale: La proposition temporelle et le nombre de chants sont conservés; l’indéfini correspond naturellement au nom grec sans article.
- source_word: τρίς με ἀπαρνήσῃ
  choice: tu me renieras trois fois
  rationale: « Renier » exprime ici le refus de reconnaître sa relation avec Jésus et correspond à l’usage biblique français courant.
- source_word: ἐπιβαλών
  choice: bouleversé
  rationale: Cette formulation restitue avec prudence l’effondrement émotionnel suggéré par le contexte sans imposer un geste physique précis; l’incertitude lexicale est signalée en note.
- source_word: ἔκλαιεν
  choice: il se mit à pleurer
  rationale: L’imparfait grec présente une action en cours; la tournure française marque naturellement son déclenchement après la prise de conscience.
theological_decisions:
- issue: Sens du participe difficile ἐπιβαλών
  choice: « bouleversé » dans le texte, avec une note signalant l’incertitude
  alternative: « après y avoir réfléchi », « se couvrant la tête » ou une expression décrivant un geste physique
  rationale: Le contexte indique une réaction intense de Pierre, mais le grec ne permet pas d’identifier sûrement sa nature intérieure ou gestuelle. La traduction évite donc de définir trop précisément la manifestation de son repentir.
translation_notes:
  register: Français international moderne, narratif et digne. Les temps du récit sont harmonisés au passé simple, avec le plus-que-parfait pour la parole antérieure de Jésus. La note conserve l’ambiguïté réelle de ἐπιβαλών.
