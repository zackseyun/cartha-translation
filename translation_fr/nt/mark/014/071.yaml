  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: fr
  text: 'Mais il se mit à faire des imprécations et à jurer : « Je ne connais pas cet homme dont vous parlez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais il
  rationale: δέ marque ici une légère opposition et la progression du récit; « Mais il » convient à l’intensification de la scène.
- source_word: ἤρξατο
  choice: se mit à
  rationale: Avec les infinitifs complémentaires, cette tournure exprime naturellement le début de l’action en français narratif.
- source_word: ἀναθεματίζειν
  choice: appeler la malédiction
  rationale: Le verbe évoque l’invocation d’une malédiction, sans en préciser explicitement l’objet. Cette formulation évite de réduire le sens à des jurons ou d’ajouter « sur lui-même ».
- source_word: ὀμνύναι
  choice: jurer
  rationale: Le verbe désigne le fait de prêter serment; « jurer » est concis, naturel et distinct du simple emploi de grossièretés.
- source_word: ὅτι
  choice: deux-points et discours direct
  rationale: ὅτι introduit le contenu du serment et du reniement; le discours direct est naturel en français.
- source_word: Οὐκ οἶδα
  choice: Je ne connais pas
  rationale: Cette traduction conserve le sens ordinaire et la force directe du reniement, sans expliciter davantage la nature de la relation ni du désaveu.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: cet homme
  rationale: Le démonstratif τοῦτον est conservé par « cet », sans ajouter la nuance méprisante que pourrait suggérer « cet individu ».
- source_word: ὃν λέγετε
  choice: dont vous parlez
  rationale: Expression idiomatique du français moderne qui rend clairement la personne mentionnée par les interlocuteurs.
theological_decisions:
- issue: Nature de la malédiction évoquée par ἀναθεματίζειν
  choice: Présenter Pierre comme appelant la malédiction sans identifier celui sur qui elle porte.
  alternative: « se mettre à maudire » ou « appeler sur lui-même la malédiction »
  rationale: Dans ce contexte de serment, une imprécation contre soi-même est plausible, mais le grec ne précise pas l’objet de la malédiction. Le texte principal préserve donc cette indétermination.
translation_notes:
  register: Français international moderne, digne et narratif. « Se mit à » rend avec naturel l’aspect ingressif; « appeler la malédiction » est légèrement solennel mais préserve mieux le sens d’imprécation que « proférer des jurons ».
