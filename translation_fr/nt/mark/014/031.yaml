source:
  edition: SBLGNT
  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: fr
  text: 'Mais lui insistait de plus belle[a] : « S’il me faut mourir avec toi[b], je ne te renierai certainement pas[c]. » Et tous disaient la même chose.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parlait avec la plus grande insistance ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie un verbe composé qui souligne l’idée de mourir ensemble avec toi.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je ne te renierai jamais ». Le grec emploie une négation très forte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: insistait avec encore plus de force
  rationale: L’imparfait exprime une parole prolongée ou répétée, tandis que l’adverbe marque une intensification exceptionnelle. Cette formulation française rend à la fois l’insistance et l’escalade.
- source_word: Ἐὰν δέῃ με
  choice: Même s’il me faut
  rationale: δέῃ exprime la nécessité. Dans ce serment, « même si » rend naturellement la valeur concessive de la condition sans réduire cette nécessité à une simple éventualité.
- source_word: συναποθανεῖν σοι
  choice: mourir avec toi
  rationale: Le verbe composé indique que Pierre envisage de mourir en même temps que Jésus. « Mourir avec toi » est naturel en français et conserve l’idée d’une mort partagée.
- source_word: οὐ μή
  choice: certainement pas
  rationale: La double négation grecque est fortement emphatique. « Certainement pas » en préserve la force sans employer une tournure archaïque.
- source_word: ἀπαρνήσομαι
  choice: renierai
  rationale: '« Renier » est le terme français clair et traditionnel dans ce contexte personnel : Pierre affirme qu’il ne désavouera pas son lien avec Jésus.'
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: Et tous disaient la même chose
  rationale: La formulation explicite naturellement que l’ensemble des disciples tenaient le même propos; l’imparfait « disaient » conserve l’aspect duratif ou répété.
theological_decisions:
- issue: Force du serment de Pierre
  choice: « je ne te renierai certainement pas »
  alternative: « je ne te renierai jamais »
  rationale: La traduction maintient l’assurance emphatique de Pierre et la tension narrative avec son reniement ultérieur, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Insistait avec encore plus de force » restitue l’intensification sans lourdeur; « renier » assure la cohérence narrative avec les scènes suivantes.
