id: MRK.14.24
reference: Mark 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: fr
  text: 'Et il leur dit : « Ceci est mon sang, le sang de l’alliance[a], qui est versé[b] pour beaucoup[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « mon sang, le sang de la nouvelle alliance » ; des passages parallèles parlent également de la nouvelle alliance. Le texte grec retenu ici se lit simplement : « mon sang, le sang de l’alliance ».'
    reason: textual_variant
  - marker: b
    text: 'On peut aussi comprendre : « qui est en train d’être versé » ; traditionnellement : « qui est répandu ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « en faveur de beaucoup ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Ceci est
  rationale: La construction copulative directe respecte le grec sans imposer une interprétation sacramentelle telle que « ceci signifie » ou « ceci représente ».
- source_word: τὸ αἷμά μου
  choice: mon sang
  rationale: La formulation possessive est directe. « Sang » est conservé afin de préserver l’imagerie sacrificielle et liée à l’alliance.
- source_word: τῆς διαθήκης
  choice: le sang de l’alliance
  rationale: La reprise appositionnelle de « sang » donne une formulation française naturelle tout en conservant le lien explicite avec l’alliance. Le texte grec retenu ne comporte pas « nouvelle ».
- source_word: ἐκχυννόμενον
  choice: qui est versé
  rationale: Cette proposition relative rend naturellement le participe présent passif et conserve l’image du sang versé, sans préciser davantage le rapport temporel.
- source_word: ὑπὲρ πολλῶν
  choice: pour beaucoup
  rationale: Cette traduction concise et idiomatique conserve πολλῶν, « beaucoup », ainsi que la portée bénéfactive ou représentative de ὑπέρ, sans trancher un débat sur l’étendue de l’expiation.
theological_decisions:
- issue: 'Sens de διαθήκη : alliance ou testament'
  choice: alliance
  alternative: testament
  rationale: Dans le contexte du dernier repas et du sang, l’expression évoque l’établissement de l’alliance, notamment Exode 24.8. « Testament » ne convient pas à ce contexte.
- issue: Ajout éventuel de « nouvelle » devant « alliance »
  choice: le sang de l’alliance
  alternative: le sang de la nouvelle alliance
  rationale: Le texte du SBLGNT retenu pour Marc ne contient pas καινῆς, « nouvelle ». La traduction n’harmonise donc pas Marc avec les traditions parallèles, mais signale la variante en note.
- issue: Portée théologique de ὑπὲρ πολλῶν
  choice: pour beaucoup
  alternative: en faveur de beaucoup
  rationale: La traduction maintient le mot « beaucoup » et ne le remplace pas par « tous ». Elle préserve aussi l’ambiguïté légitime de ὑπέρ sans développer dans le verset une théorie particulière de l’expiation.
translation_notes:
  register: Français international moderne, sobre et digne. « Ceci est » conserve la forme directe du grec. La répétition appositionnelle « mon sang, le sang de l’alliance » évite le tour peu naturel « mon sang de l’alliance ». « Pour beaucoup » maintient la formulation du texte sans harmonisation ni explicitation doctrinale.
