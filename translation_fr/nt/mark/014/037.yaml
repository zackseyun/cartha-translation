  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: fr
  text: 'Il vient, les trouve en train de dormir et dit à Pierre : « Simon, tu dors ? N’as-tu pas pu rester éveillé[a] une heure ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veiller pendant une heure ».
    reason: Alternative lexicale pour γρηγορῆσαι, qui peut désigner à la fois le fait de rester éveillé et celui de veiller avec vigilance.
lexical_decisions:
- source_word: ἔρχεται
  choice: il vient
  rationale: Le présent historique de Marc est conservé afin de rendre la vivacité du récit.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: les trouve en train de dormir
  rationale: Cette formulation naturelle en français conserve le présent historique et la valeur durative du participe καθεύδοντας.
- source_word: λέγει τῷ Πέτρῳ
  choice: dit à Pierre
  rationale: Le présent « dit » maintient le présent historique grec; le datif est rendu idiomatiquement par « à Pierre ».
- source_word: Σίμων, καθεύδεις;
  choice: Simon, tu dors ?
  rationale: L’adresse par le nom personnel Simon est préservée, et le présent français exprime directement le reproche immédiat.
- source_word: οὐκ ἴσχυσας
  choice: N’as-tu pas pu
  rationale: Dans ce contexte, ἰσχύω exprime la capacité effective; « ne pas pouvoir » est plus naturel et plus juste que la référence explicite à la force physique.
- source_word: μίαν ὥραν
  choice: une heure
  rationale: L’accusatif grec indique une durée, que le français exprime naturellement sans préposition après « rester éveillé ».
- source_word: γρηγορῆσαι
  choice: rester éveillé
  rationale: Le contraste immédiat avec le sommeil met au premier plan le sens concret de demeurer éveillé, tout en laissant le contexte porter la nuance de vigilance.
theological_decisions:
- issue: Conservation des présents historiques de Marc
  choice: 'Les verbes narratifs principaux sont maintenus au présent : « vient », « trouve » et « dit ».'
  alternative: Employer le passé composé ou le passé simple pour lisser le récit français.
  rationale: Le présent demeure naturel en français et restitue la vivacité caractéristique du récit de Marc sans modifier le contenu théologique.
- issue: Sens de γρηγορέω dans le contexte
  choice: « rester éveillé »
  alternative: « veiller »
  rationale: Le contraste explicite avec le fait de dormir favorise le sens concret. « Veiller » reste possible et conserve plus directement la nuance de vigilance; cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient à l’adresse personnelle de Jésus à Simon. « En train de dormir » rend clairement l’action en cours sans alourdir la phrase.
