  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: fr
  text: « Vous avez entendu le blasphème. Qu’en pensez-vous[a] ? » Tous le jugèrent passible de mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel est votre avis ? » ou « Quel est votre verdict ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme méritant la mort », « comme digne de mort » ou « coupable de mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Vous avez entendu
  rationale: Le passé composé exprime naturellement en français l’appel du grand prêtre à ce que l’assemblée vient d’entendre.
- source_word: τῆς βλασφημίας
  choice: le blasphème
  rationale: Le terme formel conserve le poids religieux et judiciaire de l’accusation, sans que le narrateur en confirme la légitimité.
- source_word: τί ὑμῖν φαίνεται
  choice: Qu’en pensez-vous ?
  rationale: Cette formulation française naturelle rend la demande d’avis ou de verdict portée par l’expression grecque.
- source_word: οἱ δὲ πάντες
  choice: Tous
  rationale: Le pronom collectif explicite préserve l’insistance de πάντες sur l’unanimité.
- source_word: κατέκριναν
  choice: condamnèrent
  rationale: 'Ce verbe rend clairement la portée judiciaire de κατακρίνω : prononcer un jugement défavorable ou une condamnation.'
- source_word: ἔνοχον εἶναι θανάτου
  choice: comme passible de mort
  rationale: Cette expression restitue la responsabilité judiciaire entraînant la peine de mort, tout en conservant la tension entre culpabilité, exposition à la peine et mérite de la mort.
theological_decisions:
- issue: Portée de βλασφημία dans le procès
  choice: le blasphème
  alternative: les paroles blasphématoires
  rationale: Le texte rapporte l’accusation du conseil sans présenter cette qualification comme un jugement narratorial; le terme formel maintient la gravité juridique et théologique.
- issue: Sens judiciaire de ἔνοχον εἶναι θανάτου
  choice: passible de mort
  alternative: méritant la mort; coupable et digne de mort
  rationale: « Passible de mort » met en avant l’exposition à la peine capitale sans trancher artificiellement entre les nuances de culpabilité juridique et de mérite.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct est ponctué clairement; le vocabulaire judiciaire reste accessible. Les marqueurs [a] et [b] figurent dans le texte principal.
