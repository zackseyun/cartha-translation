  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: fr
  text: 'Quelques-uns se mirent à lui cracher dessus, à lui couvrir le visage[a], à le frapper à coups de poing et à lui dire : « Prophétise ! » Et les gardes le frappèrent de gifles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à lui bander les yeux ». Le grec dit littéralement : « couvrir son visage ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les gardes le frappèrent de coups ». L’expression grecque dit littéralement : « les gardes le reçurent avec des coups ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: quelques-uns se mirent à
  rationale: Cette tournure rend naturellement en français la valeur ingressive de ἄρχομαι avec l’indéfini τινες.
- source_word: ἐμπτύειν αὐτῷ
  choice: lui cracher dessus
  rationale: Expression française courante qui restitue l’insulte physique directe exprimée par le verbe avec le datif.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: lui couvrir le visage
  rationale: Rend littéralement l’action décrite sans imposer dans le texte l’interprétation fonctionnelle « lui bander les yeux ».
- source_word: κολαφίζειν αὐτὸν
  choice: le frapper à coups de poing
  rationale: κολαφίζω désigne couramment des coups portés avec le poing; cette formulation garde cette précision.
- source_word: Προφήτευσον
  choice: Prophétise !
  rationale: Le bref impératif conserve la forme nue et moqueuse de l’injonction grecque sans ajout explicatif.
- source_word: οἱ ὑπηρέται
  choice: les gardes
  rationale: Dans ce cadre de détention et de procédure judiciaire, le terme désigne vraisemblablement des subalternes chargés de la garde plutôt que des domestiques.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: le reçurent à coups de gifles
  rationale: Cette formulation préserve l’image inhabituelle du grec, tandis que « gifles » rend la valeur probable de ῥάπισμα sans masquer l’ambiguïté dans la note.
theological_decisions:
- issue: Portée de l’ordre moqueur Προφήτευσον
  choice: « Prophétise ! »
  alternative: « Dis-nous qui t’a frappé ! » ou « Montre que tu es prophète ! »
  rationale: Marc ne développe pas l’ordre dans ce verset. La traduction conserve donc l’injonction seule et laisse subsister l’ironie narrative liée à l’identité de Jésus.
translation_notes:
  register: Français international moderne, narratif et digne. Les violences sont nommées directement sans archaïsme. « Se mirent à » marque la progression du récit; le parallélisme des infinitifs grecs est rendu par une série fluide. Les deux notes conservent les ambiguïtés lexicales principales.
