  source_fidelity: Le déroulement des actions et l’impératif moqueur sont fidèlement rendus. « À coups de poing » restitue bien κολαφίζειν. En revanche, « le reçurent à coups de gifles » est un calque peu intelligible en français moderne de l’expression grecque ῥαπίσμασιν αὐτὸν ἔλαβον; dans ce contexte, le sens idiomatique est qu’ils le frappèrent de gifles/de coups.
  naturalness: 'La première proposition est fluide et de registre approprié. La dernière phrase doit être rendue idiomatiquement: « les gardes le frappèrent de gifles » est clair, naturel et conserve la violence concrète du texte.'
  terminology: « Gardes » convient à ὑπηρέται dans ce cadre. « Gifles » est un rendu contextualisé et naturel de ῥαπίσματα; la note signale utilement le littéral grec et l’alternative plus large « coups ».
