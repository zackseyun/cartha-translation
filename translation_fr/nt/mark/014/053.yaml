revisions:
- from: Ils emmenèrent Jésus chez le grand-prêtre, et tous les chefs des prêtres, les anciens et les spécialistes de la Loi se rassemblèrent.[a]
  to: Ils emmenèrent Jésus chez le grand-prêtre, et tous les grands prêtres, les anciens et les scribes se rassemblèrent.[a]
  rationale: La révision conserve le mouvement vers le grand-prêtre, la totalité exprimée par πάντες et le lissage français du présent historique. Elle remplace deux formulations explicatives par les termes institutionnels français usuels, plus proches du grec et moins interprétatifs.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:51:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens sont bien rendus : ἀπήγαγον exprime correctement « emmenèrent », le singulier ἀρχιερέα est distingué du pluriel qui suit, et « tous » conserve la portée non précisée de πάντες. Toutefois, « spécialistes de la Loi » interprète γραμματεῖς par une fonction plus étroite que le terme grec, tandis que « scribes » maintient le terme institutionnel sans le réduire. « Grands prêtres » est aussi le rendu français biblique usuel et suffisamment distinct de « le grand-prêtre » au singulier.'
  naturalness: Le français narratif au passé simple est naturel et le présent historique est utilement signalé. « Tous les grands prêtres, les anciens et les scribes » est une coordination plus idiomatique et plus immédiatement reconnaissable dans un contexte évangélique que « tous les chefs des prêtres ... les spécialistes de la Loi ».
  terminology: Employer « le grand-prêtre » pour ἀρχιερέα et « les grands prêtres » pour ἀρχιερεῖς respecte la distinction grammaticale sans introduire une théorie sur la composition du groupe. « Scribes » est le correspondant établi et lexicalement plus ouvert de γραμματεῖς ; « spécialistes de la Loi » est une explicitation interprétative possible, mais non nécessaire ici.
  issues:
  - severity: medium
    issue: « spécialistes de la Loi » pour γραμματεῖς
    rationale: Cette expression limite les scribes à l’expertise juridique et interprète leur rôle. « Scribes » préserve mieux le terme grec et s’aligne sur l’audit lexical anglais, qui écarte « teachers of the law » comme plus étroit.
  - severity: low
    issue: « chefs des prêtres » pour ἀρχιερεῖς
    rationale: La formulation est compréhensible, mais « grands prêtres » est le terme français biblique courant pour ce pluriel institutionnel et rend plus directement le mot grec, tout en restant clairement distinct du singulier « grand-prêtre ».
  revised_text: Ils emmenèrent Jésus chez le grand-prêtre, et tous les grands prêtres, les anciens et les scribes se rassemblèrent.[a]
  revised_footnotes:
