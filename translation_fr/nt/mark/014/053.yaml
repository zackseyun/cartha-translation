source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: fr
  text: Ils emmenèrent Jésus chez le grand-prêtre, et tous les grands prêtres, les anciens et les scribes se rassemblèrent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec passe ici au présent historique : « se rassemblent », forme vive employée au milieu d’un récit au passé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: emmenèrent
  rationale: Le verbe exprime le fait de conduire quelqu’un ailleurs, ici sous garde. « Emmenèrent » est naturel en français et conserve ce mouvement sans préciser indûment la manière.
- source_word: ἀρχιερέα
  choice: le grand-prêtre
  rationale: Au singulier, le terme désigne ici le titulaire de la fonction suprême; « grand-prêtre » est l’équivalent français courant et le distingue du groupe mentionné ensuite.
- source_word: συνέρχονται
  choice: se rassemblèrent
  rationale: Le présent historique grec rend la scène plus vive. Le passé simple convient au récit français soutenu et naturel; une note signale le changement de temps de l’original.
- source_word: πάντες
  choice: tous
  rationale: « Tous » conserve l’idée d’ensemble ou de totalité exprimée par πάντες, sans déterminer au-delà du grec la portée exacte de cette totalité.
- source_word: ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Au pluriel, le terme désigne les membres dirigeants de l’aristocratie sacerdotale, et non plusieurs titulaires simultanés de la fonction de grand-prêtre. Cette formulation évite l’ambiguïté de « grands-prêtres ».
- source_word: πρεσβύτεροι
  choice: les anciens
  rationale: Dans ce contexte institutionnel, le mot désigne des responsables reconnus plutôt que simplement des hommes âgés. « Les anciens » est précis et familier dans le registre biblique.
- source_word: γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans le contexte évangélique, ces experts des Écritures et de la Loi ne sont pas de simples copistes. Cette expression moderne communique leur fonction plus clairement que « scribes ».
theological_decisions:
- issue: Présent historique συνέρχονται au sein d’un récit au passé
  choice: Rendu au passé simple (« se rassemblèrent »), avec une note
  alternative: « se rassemblent », afin de reproduire directement le présent historique
  rationale: Le passé simple assure une narration française naturelle, tandis que la note préserve l’information aspectuelle et la vivacité formelle du grec sans lui attribuer une portée doctrinale.
- issue: Portée de πάντες devant les trois groupes dirigeants
  choice: Conserver « tous » sans explicitation supplémentaire
  alternative: Comprendre le terme comme une généralisation représentative plutôt que comme la présence de chaque membre sans exception
  rationale: Le texte affirme la totalité de façon rhétorique, mais ne précise pas s’il faut l’entendre numériquement. La traduction maintient cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration écrite. « Chez le grand-prêtre » exprime naturellement le mouvement vers la personne et, par contexte, son lieu de résidence ou de réunion, sans ajouter une localisation absente du grec. « Spécialistes de la Loi » privilégie la compréhension immédiate de la fonction de γραμματεῖς.
