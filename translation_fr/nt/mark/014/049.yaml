  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: fr
  text: Jour après jour, j’étais avec vous dans le temple[a], où j’enseignais, et vous ne m’avez pas arrêté[b]. Mais c’est afin que les Écritures s’accomplissent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le « temple » désigne l’ensemble du domaine du temple, avec ses cours, et non uniquement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: 'Ou : « vous ne vous êtes pas saisis de moi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « Mais afin que les Écritures s’accomplissent. » Le grec est elliptique : la proposition principale reste sous-entendue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Jour après jour
  rationale: Cette tournure distributive naturelle exprime la présence répétée de Jésus chaque jour.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: j’étais avec vous
  rationale: Rend simplement la présence publique de Jésus auprès de ses interlocuteurs.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Formulation française courante; ἱερόν désigne ici l’ensemble du domaine du temple, précision donnée en note.
- source_word: διδάσκων
  choice: où j’enseignais
  rationale: Exprime naturellement en français l’activité continue menée dans le temple, sans faire de l’enseignement une simple circonstance secondaire.
- source_word: οὐκ ἐκρατήσατέ με
  choice: vous ne vous êtes pas saisis de moi
  rationale: Conserve la valeur concrète de κρατέω tout en convenant au contexte d’une arrestation.
- source_word: ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί
  choice: Mais c’est afin que les Écritures s’accomplissent
  rationale: Le grec est elliptique après ἀλλ’ ἵνα; « c’est » fournit un appui syntaxique minimal en français tout en maintenant la finalité ou le résultat sans préciser davantage le sujet implicite.
- source_word: αἱ γραφαί
  choice: les Écritures
  rationale: Désigne les écrits sacrés d’Israël; la majuscule indique ce référent établi.
theological_decisions:
- issue: Ellipse de la proposition finale et accomplissement des Écritures
  choice: Mais c’est afin que les Écritures s’accomplissent
  alternative: Mais que les Écritures s’accomplissent
  rationale: La seconde formulation pourrait être comprise comme un impératif ou un souhait, alors que ἵνα avec le subjonctif marque ici la finalité ou le résultat. L’ajout minimal de « c’est » rend la phrase française intelligible sans déterminer explicitement ce que le grec laisse sous-entendu.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la répétition de la présence publique de Jésus et l’ellipse théologiquement significative de la dernière proposition, expliquée en note.
