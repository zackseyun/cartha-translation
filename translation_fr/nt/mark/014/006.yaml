reference: Mark 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: fr
  text: 'Mais Jésus dit : « Laissez-la tranquille. Pourquoi lui faites-vous de la peine ? Elle a accompli une belle œuvre pour moi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en moi » ; on peut aussi comprendre : « envers moi » ou, dans le contexte de l’onction, « sur moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: Laissez-la tranquille
  rationale: L’impératif demande de cesser immédiatement de l’importuner. Cette formulation est naturelle en français moderne et conserve la portée protectrice des paroles de Jésus.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Pourquoi lui causez-vous du tourment ?
  rationale: L’expression signifie littéralement qu’on lui procure des peines ou des difficultés. « Causer du tourment » rend clairement le tort et la pression exercés sur elle sans affaiblir le reproche.
- source_word: καλὸν ἔργον
  choice: une belle œuvre
  rationale: καλός peut exprimer ce qui est bon, beau, noble ou approprié. « Belle œuvre » garde ici la valeur élogieuse et la justesse touchante du geste.
- source_word: ἠργάσατο
  choice: a accompli
  rationale: Avec « œuvre », « accomplir » forme une expression française naturelle et digne qui rend l’action menée à bien.
- source_word: ἐν ἐμοί
  choice: pour moi
  rationale: Bien que la préposition signifie littéralement « en moi », le français « pour moi » exprime naturellement que l’acte est dirigé envers Jésus; une note conserve la forme plus littérale.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre les reproches adressés à la femme et l’intervention de Jésus.
theological_decisions:
- issue: Nuance de καλὸν ἔργον dans l’évaluation du geste de la femme
  choice: une belle œuvre
  alternative: une bonne œuvre; une noble action
  rationale: Cette traduction conserve à la fois l’approbation et la beauté appropriée du geste, sans lui attribuer une valeur doctrinale ou méritoire absente du texte.
- issue: Portée de ἐν ἐμοί
  choice: pour moi
  alternative: en moi; envers moi; sur moi
  rationale: « Pour moi » est idiomatique et laisse le geste dirigé personnellement vers Jésus sans le réduire à sa seule dimension physique. La note signale la formulation littérale et préserve l’ambiguïté prépositionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement collectif est rendu par la deuxième personne du pluriel. « Belle œuvre » conserve la nuance positive de καλός, tandis que la note rend visible la formulation grecque de ἐν ἐμοί.
