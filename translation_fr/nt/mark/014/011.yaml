id: MRK.14.11
reference: Mark 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: fr
  text: En entendant cela, ils se réjouirent et promirent de lui donner de l’argent[a]. Puis il se mit à chercher comment le livrer[b] au moment opportun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’argent métal ». Le terme grec peut désigner littéralement l’argent ou, plus généralement, de l’argent servant au paiement.
    reason: lexical_alternative
  - marker: b
    text: Ou « le trahir ». Le verbe grec signifie « livrer » ou « remettre entre les mains de quelqu’un » ; dans le contexte de l’action de Judas, il implique une trahison.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: En entendant cela
  rationale: Le participe aoriste exprime ici la circonstance temporelle de leur réaction. « Cela » reprend naturellement en français la proposition de Judas mentionnée dans le contexte.
- source_word: ἐχάρησαν
  choice: ils se réjouirent
  rationale: Cette formulation conserve la force verbale de χαίρω et souligne leur réaction positive, moralement frappante dans le récit.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: promirent de lui donner de l’argent
  rationale: ἐπαγγέλλομαι exprime une promesse ou un engagement. « Argent » rend idiomatiquement ἀργύριον sans préciser une somme ni un type de monnaie que Marc ne mentionne pas.
- source_word: ἀργύριον
  choice: argent
  rationale: Le terme peut désigner littéralement l’argent métal ou, plus généralement, de l’argent servant au paiement. Le contexte favorise le sens monétaire courant.
- source_word: ἐζήτει
  choice: il se mit à chercher
  rationale: L’imparfait grec présente une recherche qui commence alors et se poursuit; cette tournure française rend bien cette valeur inchoative et durative.
- source_word: πῶς
  choice: comment
  rationale: Le terme introduit la manière ou le moyen par lequel Judas compte accomplir son projet.
- source_word: εὐκαίρως
  choice: au moment opportun
  rationale: L’adverbe désigne une occasion favorable ou appropriée, sans préciser les circonstances de cette occasion.
- source_word: παραδοῖ
  choice: le livrer
  rationale: « Livrer » exprime directement l’idée de remettre Jésus entre les mains de ses adversaires et préserve la gamme sémantique du verbe grec, tandis que le contexte rend évidente la dimension de trahison.
theological_decisions:
- issue: Traduction de παραδίδωμι pour l’action de Judas
  choice: le livrer
  alternative: le trahir
  rationale: Le verbe grec signifie fondamentalement remettre ou livrer quelqu’un. Dans ce contexte, l’acte est bien une trahison, mais « livrer » conserve à la fois le geste concret et la portée perfide donnée par le récit, sans réduire le terme à une seule nuance.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste simple et narrative. « Puis » marque la progression du récit sans surinterpréter le rapport logique, et « au moment opportun » conserve l’idée d’une occasion stratégiquement favorable.
