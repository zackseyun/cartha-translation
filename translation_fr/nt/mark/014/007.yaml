id: MRK.14.7
reference: Mark 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: fr
  text: Car vous avez toujours les pauvres avec vous et, quand vous le voulez, vous pouvez leur faire du bien ; mais moi, vous ne m’avez pas toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: toujours
  rationale: Rend directement l’adverbe et maintient sa répétition dans le contraste final.
- source_word: γὰρ
  choice: car
  rationale: Introduit naturellement en français l’explication donnée par rapport à la déclaration précédente.
- source_word: τοὺς πτωχούς
  choice: les pauvres
  rationale: Rend l’adjectif substantivé de manière concise, courante et digne, sans le limiter à une forme particulière de besoin.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: vous avez … avec vous
  rationale: Préserve l’idée de présence et de disponibilité continues exprimée par le grec.
- source_word: ὅταν θέλητε
  choice: quand vous le voulez
  rationale: Expression française naturelle qui conserve la valeur temporelle indéfinie de ὅταν avec le subjonctif.
- source_word: δύνασθε
  choice: vous pouvez
  rationale: Rend clairement la capacité exprimée par le verbe, dans un français actuel et fluide.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: leur faire du bien
  rationale: Reproduit l’idiome grec désignant une action bénéfique envers eux, sans le réduire à l’aumône ni à un simple sentiment bienveillant.
- source_word: ἐμὲ δὲ
  choice: mais moi
  rationale: Marque nettement le contraste emphatique portant sur Jésus.
- source_word: οὐ πάντοτε ἔχετε
  choice: vous ne m’avez pas toujours
  rationale: Conserve le présent grec et le contraste verbal avec le premier πάντοτε, sans introduire le futur interprétatif « vous ne m’aurez pas toujours ».
theological_decisions:
- issue: Risque de comprendre que Jésus minimise le soin des pauvres
  choice: Le verset oppose la présence continuelle des pauvres à la présence limitée de Jésus dans la situation immédiate, tout en affirmant qu’il est toujours possible de leur faire du bien.
  alternative: Comprendre que Jésus écarte le souci des pauvres au profit de la dévotion envers lui.
  rationale: La proposition « quand vous le voulez, vous pouvez leur faire du bien » affirme explicitement la possibilité durable d’agir en leur faveur. La traduction conserve le contraste temporel sans ajouter une conclusion doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La structure contrastive du grec est conservée, notamment par la répétition de « toujours » et la mise en relief de « mais moi ». Aucune note n’est nécessaire, puisque « faire du bien » exprime clairement en français une action bénéfique concrète.
