source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: fr
  text: Pierre le suivit de loin jusque dans la cour du grand prêtre. Il était assis avec les gardes et se réchauffait près du feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers la lumière ». Il s’agit vraisemblablement de la lumière du feu allumé dans la cour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: de loin
  rationale: Expression française naturelle qui conserve la distance physique et la prudence narrative de Pierre.
- source_word: ἠκολούθησεν αὐτῷ
  choice: le suivit
  rationale: Le passé simple convient au récit et rend directement l’aoriste grec.
- source_word: ἕως ἔσω εἰς
  choice: jusque dans
  rationale: Formulation idiomatique qui exprime l’entrée de Pierre dans l’espace intérieur de la cour sans laisser entendre qu’il entre dans la maison elle-même.
- source_word: αὐλήν
  choice: cour
  rationale: Dans ce contexte, le terme désigne la cour intérieure de la résidence du grand prêtre.
- source_word: ἀρχιερέως
  choice: grand prêtre
  rationale: Équivalent français courant et précis dans le contexte du récit de la Passion.
- source_word: ἦν συγκαθήμενος
  choice: Il était assis avec
  rationale: L’imparfait restitue l’action continue d’arrière-plan; « avec » rend l’idée portée par le préfixe σύν et la construction suivante.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: avec les gardes
  rationale: Dans la scène de l’arrestation et de l’interrogatoire, il s’agit d’agents subalternes exerçant notamment une fonction de garde, plutôt que d’esclaves domestiques.
- source_word: θερμαινόμενος
  choice: se réchauffait
  rationale: L’imparfait rend naturellement l’action en cours exprimée par le participe grec.
- source_word: πρὸς τὸ φῶς
  choice: près du feu
  rationale: Bien que φῶς signifie littéralement « lumière », le contexte du réchauffement indique la lumière produite par un feu; « près du feu » rend clairement la scène, tandis qu’une note conserve l’expression grecque.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Deux phrases préservent la progression du récit et évitent une période trop lourde. La note est placée après « feu », le mot auquel elle se rapporte.
