    issue: « puis » pour le second καί
    rationale: Le grec enchaîne par καὶ sans indiquer nécessairement une succession marquée. « Et » préserve plus fidèlement la coordination et la cadence marcienne.
  - severity: medium
    issue: « saisi d’effroi » comme rendu principal de ἐκθαμβεῖσθαι
    rationale: Cette expression est possible, mais elle resserre le sens sur la peur. Le verbe peut aussi évoquer un choc, un bouleversement ou une détresse intense; une formulation principale moins spécifique préserve mieux cette nuance.
  revised_text: Et il prend avec lui Pierre, Jacques et Jean, et il commence à être profondément bouleversé et angoissé.[a]
