revisions:
- from: Et il prend avec lui Pierre, Jacques et Jean, puis il commence à être saisi d’effroi et d’angoisse.[a]
  to: Et il prend avec lui Pierre, Jacques et Jean, et il commence à être profondément bouleversé et angoissé.[a]
  rationale: La révision remplace « puis » par « et » afin de refléter la coordination grecque, et adopte pour ἐκθαμβεῖσθαι un rendu principal qui n’enferme pas le terme dans la seule notion de peur. L’alternative « saisi d’effroi » est conservée en note, où elle éclaire une nuance lexicale réelle sans l’imposer au texte courant.
