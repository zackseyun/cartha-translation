source:
  edition: SBLGNT
  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: fr
  text: Et il prend avec lui Pierre, Jacques et Jean, et il commence à être profondément bouleversé et angoissé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « saisi d’effroi et d’angoisse ». Le premier verbe peut exprimer ici un effroi intense, un choc profond ou une grande détresse.'
    reason: Alternative lexicale destinée à préserver l’étendue de sens de ἐκθαμβεῖσθαι et, dans une moindre mesure, de ἀδημονεῖν.
lexical_decisions:
- source_word: παραλαμβάνει
  choice: prend avec lui
  rationale: Le présent narratif est conservé pour rendre la vivacité du récit de Marc; l’expression indique naturellement que Jésus choisit ces trois disciples pour l’accompagner.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: Cette formulation rend simplement μετά avec le génitif et précise que les trois disciples accompagnent Jésus.
- source_word: ἤρξατο
  choice: commence à
  rationale: La valeur ingressive de ἄρχομαι suivi d’infinitifs est explicitement préservée.
- source_word: ἐκθαμβεῖσθαι
  choice: être saisi d’effroi
  rationale: Dans ce contexte, le verbe exprime une réaction émotionnelle intense pouvant mêler effroi, bouleversement et détresse, et non un simple étonnement.
- source_word: ἀδημονεῖν
  choice: d’angoisse
  rationale: Le terme désigne une détresse intérieure aiguë. « Angoisse » garde sa force et demeure naturel en français contemporain.
- source_word: καὶ ... καὶ
  choice: Pierre, Jacques et Jean … puis
  rationale: L’énumération française conserve les trois noms et leur coordination; le second καί est rendu par « puis » afin de marquer naturellement la progression narrative sans perdre le lien cumulatif.
theological_decisions:
- issue: L’état émotionnel de Jésus à Gethsémani
  choice: 'Rendre les deux verbes comme une expérience réelle et intense : « saisi d’effroi et d’angoisse »'
  alternative: Employer une formulation plus générale comme « profondément bouleversé et troublé », ou plus forte comme « horrifié et accablé »
  rationale: Le texte affirme sans atténuation la profonde détresse humaine de Jésus. La traduction n’en propose pas d’explication théologique et maintient la tension du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent narratif de Marc est conservé. « Être saisi d’effroi et d’angoisse » restitue les deux verbes distincts avec leur intensité, sans ajouter d’explication doctrinale.
