  text: And leaving him, they all fled.
translation:
  language: fr
  text: Et, le laissant, ils s’enfuirent tous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination simple avec la scène précédente, sans ajouter une nuance temporelle ou consécutive.
- source_word: ἀφέντες
  choice: le laissant
  rationale: Le participe aoriste de ἀφίημι exprime ici le fait de laisser Jésus derrière soi. « Le laissant » reste naturel et concis, tandis que « l’abandonnant » accentuerait davantage l’interprétation.
- source_word: αὐτὸν
  choice: le
  rationale: Pronom objet renvoyant clairement à Jésus dans le contexte immédiat.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Rend la fuite devant le danger avec la gravité et la concision du verbe φεύγω.
- source_word: πάντες
  choice: tous
  rationale: Placée après le verbe, cette formulation souligne que tous les compagnons concernés prirent la fuite.
theological_decisions:
- issue: Étendue de l’abandon de Jésus par ses compagnons
  choice: ils s’enfuirent tous
  alternative: tous s’enfuirent
  rationale: La formulation préserve l’insistance du grec sur la totalité, sans préciser l’identité du groupe au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, sobre et digne. La structure participiale est conservée parce qu’elle demeure naturelle en français et maintient l’enchaînement très concis du récit.
