id: MRK.14.12
reference: Mark 14:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: fr
  text: 'Le premier jour des Pains sans levain, au moment où l’on sacrifiait l’agneau de la Pâque[a], ses disciples lui dirent : « Où veux-tu que nous allions faire les préparatifs pour que tu manges la Pâque ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « où l’on sacrifiait la Pâque ». Dans ce contexte, « la Pâque » désigne vraisemblablement l’agneau offert en sacrifice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: Le premier jour des Pains sans levain
  rationale: Rend naturellement la construction grecque tout en conservant la désignation traditionnelle de la période festive, sans ajouter explicitement « fête », absent du texte.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: au moment où l’on sacrifiait l’agneau de la Pâque
  rationale: L’imparfait ἔθυον décrit l’action en cours ou habituelle. Avec le verbe « sacrifier », πάσχα désigne ici vraisemblablement la victime pascale; « l’agneau de la Pâque » explicite ce sens en français naturel, tandis qu’une note préserve la formulation plus littérale.
- source_word: λέγουσιν
  choice: lui dirent
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel d’une narration française soutenue et accessible.
- source_word: Ποῦ θέλεις
  choice: Où veux-tu
  rationale: θέλω exprime ici la volonté ou le désir; « veux-tu » est direct et idiomatique.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: que nous allions faire les préparatifs
  rationale: Le participe ἀπελθόντες est intégré à la proposition dépendante en respectant la séquence aller-préparer. « Faire les préparatifs » convient au contexte du repas pascal et évite l’ambiguïté d’un « préparer » sans complément exprimé.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: pour que tu manges la Pâque
  rationale: « Pour que » exprime clairement le but introduit par ἵνα. Dans ce contexte, « manger la Pâque » renvoie au repas pascal et conserve la formulation concise du grec.
theological_decisions:
- issue: Référence de πάσχα dans ses deux occurrences
  choice: Dans la première occurrence, expliciter « l’agneau de la Pâque » en raison du verbe « sacrifier »; dans la seconde, garder « la Pâque » pour le repas.
  alternative: Traduire les deux occurrences simplement par « la Pâque », ou les deux par « l’agneau pascal ».
  rationale: 'Le contexte verbal détermine la nuance: θύω évoque la victime sacrificielle, tandis que φάγῃς évoque le repas. Cette distinction lexicale maintient la tension du texte sans imposer une harmonisation doctrinale.'
translation_notes:
  register: Français international moderne, digne et lisible. « Pains sans levain » conserve la désignation biblique usuelle; le passé simple convient au récit écrit. Le tutoiement reflète le singulier grec et l’usage courant dans les traductions bibliques françaises.
