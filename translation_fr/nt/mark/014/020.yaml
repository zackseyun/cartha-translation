source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: fr
  text: 'Il leur dit : « C’est l’un des douze, celui qui trempe avec moi dans le plat.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bol ». Le grec τρύβλιον peut désigner un plat ou un bol utilisé à table.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Il leur répondit
  rationale: Dans ce contexte, δέ assure une transition légère. Avec εἶπεν αὐτοῖς, « il leur répondit » rend naturellement la prise de parole de Jésus après la question des disciples, sans marquer de contraste fort.
- source_word: εἶπεν αὐτοῖς
  choice: Il leur répondit
  rationale: Le grec signifie littéralement « il leur dit » ; « répondit » explicite en français naturel la relation avec la question du verset précédent, sans modifier le contenu de la parole.
- source_word: Εἷς τῶν δώδεκα
  choice: C’est l’un des douze
  rationale: La tournure présentative française produit une réponse complète et naturelle tout en conservant l’identification du traître comme membre du groupe des douze.
- source_word: ὁ ἐμβαπτόμενος
  choice: celui qui trempe
  rationale: Le participe présent substantivé désigne la personne engagée dans l’action. « Celui qui trempe » garde cette force identificatrice et l’aspect actuel de la scène.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: μετά suivi du génitif exprime l’accompagnement ; « avec moi » en est l’équivalent direct et naturel.
- source_word: εἰς τὸ τρύβλιον
  choice: dans le plat
  rationale: εἰς indique ici le mouvement vers l’intérieur du récipient. « Dans le plat » est la formulation idiomatique en français ; τρύβλιον peut désigner un plat ou un bol de table.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la réponse elliptique du grec tout en employant une présentation idiomatique. « Les douze » reste en minuscules comme désignation claire du groupe, sans imposer une valeur de titre.
