id: MRK.14.30
reference: Mark 14:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: fr
  text: 'Et Jésus lui dit : « En vérité, je te le dis : aujourd’hui, cette nuit même, avant qu’un coq chante deux fois[a], toi, tu me renieras trois fois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « avant qu’un coq fasse entendre sa voix deux fois ».'
    reason: La traduction principale emploie l’expression française idiomatique « un coq chante », tandis que φωνῆσαι signifie plus généralement « faire entendre sa voix, pousser un cri ».
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent de narration de Marc est conservé. En français, « dit » est aussi la forme du présent à la troisième personne et garde ici la vivacité du récit.
- source_word: Ἀμὴν λέγω σοι
  choice: En vérité, je te le dis
  rationale: Cette formule française naturelle et solennelle rend l’affirmation introductive Ἀμήν ainsi que l’adresse directe λέγω σοι.
- source_word: σήμερον · ταύτῃ τῇ νυκτί
  choice: aujourd’hui, cette nuit même
  rationale: Les deux indications temporelles sont maintenues; « même » restitue l’insistance du démonstratif sans fusionner les expressions.
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: qu’un coq chante deux fois
  rationale: « Chanter » est l’expression française courante pour le cri du coq; la construction infinitive grecque est rendue naturellement par le subjonctif après « avant que ».
- source_word: σὺ
  choice: toi, tu
  rationale: Le pronom grec exprimé, donc emphatique, est rendu par la dislocation française « toi, tu », qui met Pierre personnellement en relief.
- source_word: τρίς με ἀπαρνήσῃ
  choice: tu me renieras trois fois
  rationale: « Renier » est l’équivalent français précis et traditionnel de ἀπαρνέομαι dans ce contexte; « trois fois » conserve le contraste numérique avec les deux chants du coq.
theological_decisions:
- issue: Rapport entre « aujourd’hui » et « cette nuit même »
  choice: Conserver les deux expressions
  alternative: Les fondre en « cette nuit même »
  rationale: Le grec juxtapose σήμερον et ταύτῃ τῇ νυκτί pour souligner l’imminence; en supprimer une affaiblirait cette insistance.
- issue: Mise en relief personnelle de Pierre
  choice: « toi, tu me renieras »
  alternative: « tu me renieras »
  rationale: La présence inhabituelle du pronom sujet σὺ dans le grec appelle une mise en relief, sans préciser davantage la portée théologique de cette insistance.
- issue: Présent historique de Marc
  choice: « Jésus lui dit » au présent de narration
  alternative: Normaliser au passé narratif
  rationale: Le maintien du présent respecte le style vif du texte source.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation met en valeur la solennité de la déclaration et l’insistance temporelle, sans archaïsme.
