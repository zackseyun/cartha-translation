  source_fidelity: La phrase « Je ne sais pas et je ne comprends pas » exprime bien les deux verbes grecs, mais ne rend pas aussi nettement la double coordination négative οὔτε … οὔτε. « Je ne sais ni ne comprends » conserve plus fidèlement l'insistance de la dénégation. Le reste rend correctement ἠρνήσατο, ἐξῆλθεν ἔξω, προαύλιον et ἀλέκτωρ ἐφώνησεν. La clause relative au coq, retenue dans le texte SBLGNT malgré une variation textuelle, est correctement signalée.
  naturalness: Le français est naturel et d'un registre narratif biblique moderne. Le passé simple convient. « Vestibule » est un choix recevable pour l'espace d'entrée/en avant de la cour et évite de l'assimiler simplement à la cour. La coordination « ni ne » est à la fois idiomatique et plus précise ici.
  terminology: « Nia », « vestibule » et « un coq chanta » conviennent. Aucun terme théologique spécialisé ne pose problème. La note textuelle est claire et son ancrage correspond à la proposition variant selon les manuscrits.
