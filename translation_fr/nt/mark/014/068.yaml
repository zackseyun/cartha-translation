  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: fr
  text: 'Mais il nia en disant : « Je ne sais ni ne comprends ce que tu dis. » Puis il sortit dans le vestibule, et un coq chanta.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « et un coq chanta ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: il nia
  rationale: Le verbe signifie ici nier ou désavouer. En français, l’emploi absolu « il nia » est naturel dans ce contexte et évite d’ajouter un objet absent du grec, tel que « cela » ou « Jésus ».
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Je ne sais pas et je ne comprends pas
  rationale: Les deux verbes renforcent la dénégation de Pierre. Cette formulation conserve leur redoublement tout en restant naturelle en français moderne.
- source_word: σὺ τί λέγεις
  choice: ce que tu dis
  rationale: Traduction directe qui préserve le verbe « dire » et le tutoiement explicite de σὺ.
- source_word: ἐξῆλθεν ἔξω
  choice: il sortit
  rationale: Le verbe français « sortir » exprime naturellement le mouvement vers l’extérieur sans reproduire lourdement le redoublement grec.
- source_word: προαύλιον
  choice: vestibule
  rationale: Le terme désigne l’espace situé en avant de la cour intérieure, probablement le passage ou vestibule proche de l’entrée. « Vestibule » distingue cet endroit de la cour elle-même.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: un coq chanta
  rationale: « Un coq chanta » est l’expression française naturelle correspondant à l’idiome grec et respecte l’absence d’article devant le nom.
theological_decisions:
- issue: Inclusion de la proposition καὶ ἀλέκτωρ ἐφώνησεν
  choice: 'Incluse dans le texte principal : « et un coq chanta »'
  alternative: Omettre cette proposition selon certains témoins manuscrits
  rationale: Le texte SBLGNT fourni retient la proposition tout en signalant une variation textuelle. Elle est donc traduite dans le corps du verset, et l’incertitude manuscrite est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La parole directe reste claire et orale, tandis que « vestibule » rend la distinction spatiale avec la cour intérieure.
