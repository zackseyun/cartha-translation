id: MRK.14.21
reference: Mark 14:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: fr
  text: Car le Fils de l’homme s’en va, comme il est écrit à son sujet. Mais malheur à cet homme par qui le Fils de l’homme est livré[a] ! Il aurait mieux valu pour cet homme-là ne pas être né.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est trahi ».'
    reason: Alternative contextuelle pour παραδίδοται, dont le sens premier est « est livré » ou « est remis ».
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit ici l’explication donnée par Jésus et conserve la valeur causale ou explicative du grec.
- source_word: ὁ μὲν ... δὲ
  choice: … Mais …
  rationale: Le français laisse naturellement μέν implicite et marque le contraste par « mais ».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Conserve la désignation établie de Jésus ainsi que ses résonances scripturaires possibles.
- source_word: ὑπάγει
  choice: s’en va
  rationale: Expression française naturelle qui garde l’idée de départ vers l’issue annoncée sans préciser davantage la manière dont celle-ci surviendra.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: comme il est écrit à son sujet
  rationale: Rend clairement la conformité aux Écritures et la valeur persistante de γέγραπται.
- source_word: οὐαὶ
  choice: malheur à
  rationale: Formule prophétique française consacrée, qui conserve la force solennelle de l’avertissement et de la condamnation.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: à cet homme
  rationale: Le contexte vise un homme précis; le démonstratif garde cette désignation appuyée.
- source_word: δι’ οὗ
  choice: par qui
  rationale: Rend naturellement en français l’agence exprimée par διά avec le génitif.
- source_word: παραδίδοται
  choice: est livré
  rationale: Conserve le sens premier et l’ambiguïté de παραδίδωμι, importante dans les récits de la Passion; la trahison est suggérée par le contexte et signalée comme autre traduction en note.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Il aurait mieux valu pour cet homme-là ne pas être né
  rationale: Rend en français idiomatique l’évaluation contrefactuelle sans transformer la phrase en simple affirmation au présent.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: cet homme-là
  rationale: Maintient la reprise solennelle du nom et du démonstratif grecs.
theological_decisions:
- issue: Sens de παραδίδοται dans le récit de la Passion
  choice: est livré
  alternative: est trahi
  rationale: « Est livré » préserve l’étendue lexicale du verbe grec et son motif récurrent dans la Passion, tandis que la note explicite le sens de trahison fortement présent dans le contexte.
- issue: Rapport entre accomplissement des Écritures et responsabilité humaine
  choice: Maintien juxtaposé de « comme il est écrit » et « malheur à cet homme »
  alternative: Expliciter soit une nécessité déterministe, soit une atténuation de la responsabilité du traître
  rationale: Le texte affirme simultanément la conformité du chemin du Fils de l’homme aux Écritures et le malheur de celui qui le livre; la traduction conserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. « S’en va » demeure sobre et légèrement solennel; la ponctuation en trois phrases rend nettement le contraste et l’exclamation sans ajouter d’interprétation.
