  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: fr
  text: 'Ils commencèrent à s’attrister et à lui dire, l’un après l’autre : « Ce n’est tout de même pas moi[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « N’est-ce pas moi ? » La particule grecque μήτι introduit ici une question qui appelle normalement une réponse négative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: Ils commencèrent
  rationale: L’aoriste de ἄρχομαι, suivi des infinitifs λυπεῖσθαι et λέγειν, marque le début des actions. « Commencèrent » est précis, naturel et adapté au registre narratif.
- source_word: λυπεῖσθαι
  choice: à s’attrister
  rationale: Le verbe exprime l’entrée dans la tristesse ou la peine. « S’attrister » conserve cette nuance tout en restant idiomatique en français.
- source_word: καὶ λέγειν αὐτῷ
  choice: et à lui dire
  rationale: λέγειν signifie proprement « dire » plutôt que spécifiquement « demander », et αὐτῷ est rendu par le pronom « lui », comme dans le grec.
- source_word: εἷς κατὰ εἷς
  choice: l’un après l’autre
  rationale: Cette expression distributive décrit les prises de parole individuelles et successives. « L’un après l’autre » est naturel et évite l’ambiguïté possible de « un par un » avec un groupe exclusivement masculin ou mixte.
- source_word: Μήτι ἐγώ;
  choice: Ce n’est tout de même pas moi ?
  rationale: μήτι introduit une question qui appelle normalement une réponse négative. Cette formulation française conserve l’ellipse, l’inquiétude et l’attente implicite de la réponse « non ».
theological_decisions:
- issue: Valeur de la question des disciples
  choice: 'Formuler la question de manière à faire entendre qu’ils espèrent une réponse négative : « Ce n’est tout de même pas moi ? »'
  alternative: « Est-ce moi ? »
  rationale: La particule μήτι indique que le locuteur s’attend normalement à une réponse négative. « Est-ce moi ? » neutraliserait cette nuance et atténuerait la protestation inquiète exprimée par les disciples.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique écrit sans archaïsme marqué. La formulation de la question reste spontanée tout en préservant la nuance grammaticale du grec.
