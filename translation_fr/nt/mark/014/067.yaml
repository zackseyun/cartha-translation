- source_word: λέγει
  choice: elle lui dit
  rationale: Le présent historique grec est rendu par le passé simple, plus naturel dans un récit français au passé, sans modifier la valeur événementielle.
- source_word: τοῦ Ναζαρηνοῦ … τοῦ Ἰησοῦ
  choice: Jésus le Nazaréen
  rationale: Conserve l’identification de Jésus par son origine ou son appellation nazaréenne, dans un ordre naturel en français.
