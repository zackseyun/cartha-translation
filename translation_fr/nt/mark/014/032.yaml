  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: fr
  text: 'Ils arrivent à un endroit appelé Gethsémani[a], et Jésus dit à ses disciples : « Asseyez-vous ici jusqu''à ce que j''aie prié. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un endroit dont le nom était Gethsémani ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: Ils arrivent
  rationale: Le présent historique de Marc est naturel en français narratif et conserve la vivacité du récit.
- source_word: χωρίον
  choice: un endroit
  rationale: Le terme peut désigner un lieu ou une propriété; « endroit » reste naturel sans préciser indûment la nature du terrain.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: appelé Gethsémani
  rationale: Cette tournure rend naturellement l'idée du nom du lieu; la graphie française usuelle « Gethsémani » est retenue.
- source_word: λέγει
  choice: dit
  rationale: Le présent français « dit » correspond au présent historique grec et s'accorde avec « arrivent ».
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: « Disciples » est le terme courant et précis pour la relation maître-disciple exprimée ici.
- source_word: Καθίσατε ὧδε
  choice: Asseyez-vous ici
  rationale: L'impératif pronominal est la formulation française naturelle pour demander à plusieurs personnes de s'asseoir.
- source_word: ἕως προσεύξωμαι
  choice: pendant que je prierai
  rationale: Dans ce contexte, ἕως peut introduire la période durant laquelle les disciples doivent rester assis; le futur après « pendant que » situe naturellement l'action à venir sans suggérer que Jésus ne prie qu'après cette attente.
theological_decisions:
- issue: Sujet explicite de λέγει
  choice: Jésus dit
  alternative: il dit
  rationale: Le grec porte seulement un sujet verbal implicite, mais nommer Jésus évite en français toute hésitation sur l'antécédent sans modifier le sens.
translation_notes:
  register: Français international moderne, simple et digne. Les présents historiques de Marc sont conservés. La citation emploie le vouvoiement pluriel naturel.
