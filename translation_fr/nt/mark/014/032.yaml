  verdict: revise
  source_fidelity: La principale divergence concerne ἕως προσεύξωμαι, qui fixe le terme de l'attente (« jusqu'à ce que je prie / aie prié »). « Pendant que je prierai » transforme cette limite temporelle en simple simultanéité et emploie en outre un futur peu naturel après « pendant que ». Le maintien des présents historiques (« arrivent », « dit ») rend fidèlement les présents narratifs de Marc.
  naturalness: Le français est globalement clair, moderne et de registre approprié. « Asseyez-vous ici jusqu'à ce que j'aie prié » est idiomatique et exprime sans ambiguïté que les disciples doivent attendre l'achèvement de la prière.
  terminology: « Gethsémani », « disciples » et « Asseyez-vous » conviennent au français international moderne et au contexte évangélique. L'explicitation de Jésus comme sujet est naturelle et ne modifie pas le sens.
