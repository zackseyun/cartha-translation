  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: fr
  text: Puis il prit une coupe[a], rendit grâce et la leur donna. Ils en burent tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la coupe ». Le grec emploie « coupe » sans article, bien que le contexte du repas puisse désigner une coupe précise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: il prit
  rationale: Le participe aoriste marque une action antérieure au verbe principal. En français narratif, la coordination par « puis il prit » est plus naturelle qu’un participe présent, sans changer la succession des actions.
- source_word: ποτήριον
  choice: une coupe
  rationale: Le nom grec est sans article. « Une coupe » en donne le rendu le plus direct, tandis que le contexte du repas peut néanmoins faire penser à une coupe déterminée.
- source_word: εὐχαριστήσας
  choice: rendit grâce
  rationale: Le participe aoriste exprime une action accomplie avant le don de la coupe. « Rendit grâce » traduit directement l’idée de remercier Dieu sans introduire un terme liturgique ultérieur.
- source_word: ἔδωκεν αὐτοῖς
  choice: la leur donna
  rationale: Le pronom féminin « la » reprend naturellement « coupe » en français; « leur donna » exprime clairement le destinataire.
- source_word: ἔπιον ἐξ αὐτοῦ
  choice: Ils en burent
  rationale: Le pronom adverbial « en » reprend idiomatiquement la coupe comme source de ce qu’ils boivent, sans suggérer qu’ils boivent la coupe elle-même.
- source_word: πάντες
  choice: tous
  rationale: La position finale conserve sobrement l’accent sur le fait que chacun d’eux en a bu.
theological_decisions:
- issue: Portée eucharistique possible de εὐχαριστήσας
  choice: « rendit grâce »
  alternative: « bénit la coupe » ou une formulation liturgique liée à l’Eucharistie
  rationale: Le verbe grec signifie ici rendre grâce. La traduction conserve la portée que le contexte peut recevoir dans la tradition chrétienne, mais n’importe ni objet implicite de bénédiction ni terminologie ecclésiale postérieure.
translation_notes:
  register: Français international moderne, digne et fluide. La structure est divisée en deux phrases pour éviter une accumulation lourde de coordinations tout en maintenant l’ordre narratif grec.
