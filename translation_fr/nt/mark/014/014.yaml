id: MRK.14.14
reference: Mark 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: fr
  text: 'Et, où qu’il entre, dites au maître de la maison : « Le Maître dit : “Où est ma salle, où je pourrai manger la Pâque avec mes disciples ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: où qu’il entre
  rationale: La tournure française « où que » avec le subjonctif rend naturellement le relatif indéfini formé par ὅπου, ἐάν et le subjonctif aoriste.
- source_word: εἴπατε
  choice: dites
  rationale: L’impératif pluriel s’adresse aux deux disciples et introduit directement les paroles qu’ils devront prononcer.
- source_word: οἰκοδεσπότῃ
  choice: maître de la maison
  rationale: Cette expression désigne naturellement la personne qui dirige la maison ou le foyer, tout en conservant la notion d’autorité domestique.
- source_word: Ὁ διδάσκαλος
  choice: Le Maître
  rationale: En français, « le Maître » est une désignation personnelle naturelle de Jésus dans ce contexte et conserve la dimension d’enseignement du terme, sans recourir au peu idiomatique « l’Enseignant ».
- source_word: κατάλυμά μου
  choice: la salle qui m’est destinée
  rationale: κατάλυμα désigne ici un lieu où séjourner, vraisemblablement une pièce d’accueil dans une maison. La formulation rend aussi le possessif μου sans suggérer que Jésus en est propriétaire.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: Dans ce contexte, le verbe « manger » indique qu’il s’agit du repas pascal; « la Pâque » reste concise et conforme à l’usage français.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: avec mes disciples
  rationale: « Disciples » exprime le lien durable de formation et d’attachement propre à μαθηταί dans les Évangiles.
- source_word: φάγω
  choice: je pourrai manger
  rationale: Le futur français dans cette proposition relative rend naturellement l’action envisagée au subjonctif grec, tout en présentant la salle recherchée comme le lieu prévu pour le repas.
theological_decisions:
- issue: Traduction de la désignation διδάσκαλος appliquée à Jésus
  choice: Le Maître
  alternative: L’Enseignant
  rationale: « Le Maître » est le titre français courant d’une personne reconnue comme enseignant; il évite la lourdeur de « l’Enseignant » sans transformer le terme en un titre christologique plus fort que ne l’exige le grec.
translation_notes:
  register: Français international moderne, naturel et digne. Les paroles imbriquées sont distinguées par des guillemets français puis anglais doubles. La formulation « salle qui m’est destinée » convient mieux à une pièce où le groupe prendra le repas que « chambre d’hôtes », tout en préservant dans la note l’étendue lexicale de κατάλυμα.
