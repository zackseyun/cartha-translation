revisions:
- from: 'Et, où qu’il entre, dites au maître de la maison : « Le Maître dit : “Où est la salle qui m’est destinée[a], où je pourrai manger la Pâque avec mes disciples ?” »'
  to: 'Et, où qu’il entre, dites au maître de la maison : « Le Maître dit : “Où est ma salle, où je pourrai manger la Pâque avec mes disciples ?” »'
  rationale: Le remplacement de « la salle qui m’est destinée » par « ma salle » rend directement le possessif μου et évite d’ajouter l’idée d’une salle spécialement attribuée à Jésus. La note conserve les possibilités lexicales de κατάλυμα et l’explication contextuelle, sans imposer une interprétation excessive.
