  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: fr
  text: 'Pendant qu’ils étaient allongés à table et mangeaient[a], Jésus dit : « Vraiment, je vous le dis[b], l’un de vous me trahira[c], celui qui mange avec moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: À l’époque, on prenait habituellement les repas formels allongé sur des couches autour de la table.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « Amen, je vous le dis. »'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « me livrera ». Le verbe grec peut signifier remettre ou livrer quelqu’un ; ici, il s’agit de l’acte déloyal d’un compagnon de Jésus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: étaient allongés à table
  rationale: Le participe désigne la posture habituelle lors d’un repas formel dans l’Antiquité. « Allongés à table » restitue cette réalité historique tout en restant compréhensible en français moderne.
- source_word: ἐσθιόντων / ἐσθίων
  choice: mangeaient / l’un de ceux qui mangent
  rationale: Le verbe signifie simplement « manger ». La seconde occurrence est rendue par une proposition relative qui reflète le participe grec substantivé, sans prétendre que le traître serait le seul à manger avec Jésus.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  rationale: Cette formule solennelle de Jésus est rendue de manière naturelle et digne. La forme plus littérale avec « Amen » est signalée en note.
- source_word: εἷς ἐξ ὑμῶν
  choice: l’un de vous
  rationale: 'Cette tournure française naturelle exprime exactement le sens partitif : celui qui agira appartient au groupe présent.'
- source_word: παραδώσει
  choice: me trahira
  rationale: Le verbe peut signifier « livrer » ou « remettre ». Dans ce contexte de communion de table et d’action hostile d’un proche, « trahir » exprime clairement la portée relationnelle, tandis que le sens plus littéral est conservé en note.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Équivalent français direct et naturel de l’expression d’accompagnement.
theological_decisions:
- issue: Sens de παραδώσει dans le récit de la Passion
  choice: me trahira
  alternative: me livrera
  rationale: Le contexte présente un compagnon de Jésus qui va le livrer à ses adversaires, ce qui justifie « trahir ». Comme le verbe grec ne porte pas toujours en lui-même cette nuance morale, « me livrera » est conservé en note afin de préserver son étendue sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tout en conservant la posture historique du repas, la solennité de la parole de Jésus et l’ambiguïté lexicale pertinente de παραδίδωμι.
