  text: ὁ δὲ καταλιπὼν τὴν σινδόνα γυμνὸς ⸀ἔφυγεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: fr
  text: Mais lui s’enfuit nu, laissant derrière lui la toile de lin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « drap de lin » ou « vêtement de lin » pour « toile de lin » (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, « nu » (γυμνός) peut signifier « insuffisamment vêtu » ; ici, le sens immédiat est qu’il s’enfuit sans la pièce de tissu qui le couvrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec la tentative de le saisir et introduit le retournement narratif.
- source_word: καταλιπὼν
  choice: laissant derrière lui
  rationale: Le participe aoriste de καταλείπω indique qu’il abandonne sur place ce qui le couvrait; cette tournure française reste naturelle tout en conservant le lien avec le verbe principal.
- source_word: σινδόνα
  choice: toile de lin
  rationale: σινδών désigne une pièce de tissu en lin, susceptible de servir de drap ou de vêtement. « Toile de lin » évite de préciser plus que le grec sa forme exacte.
- source_word: γυμνὸς
  choice: nu
  rationale: Dans ce contexte immédiat, γυμνός indique naturellement qu’il s’enfuit sans la pièce de tissu qui le couvrait, tout en pouvant ailleurs avoir le sens plus large d’insuffisamment vêtu.
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: Le verbe φεύγω exprime une fuite précipitée; « s’enfuit » rend avec concision l’action narrative à l’aoriste.
