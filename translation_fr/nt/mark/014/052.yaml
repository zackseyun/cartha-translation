translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe participiale du grec est conservée sans lourdeur, et les notes maintiennent l’incertitude sur la forme exacte de la pièce de lin ainsi que la portée contextuelle de γυμνός.
