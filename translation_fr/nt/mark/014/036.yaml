id: MRK.14.36
reference: Mark 14:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: fr
  text: 'Et il disait[a] : « Abba[b], Père, tout t’est possible. Éloigne de moi cette coupe[c]. Toutefois, non pas ce que je veux, mais ce que tu veux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il dit ». L’imparfait grec peut évoquer une parole répétée ou prolongée : « il disait ».'
    reason: lexical_alternative
  - marker: b
    text: « Abba » est une forme araméenne employée pour s’adresser à son père; elle est conservée ici à côté du grec « Père ».
    reason: cultural_note
  - marker: c
    text: La « coupe » est une image biblique de la souffrance qui lui est destinée; voir Marc 10.38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec peut décrire une parole prolongée ou répétée. « Il disait » en conserve l’aspect sans alourdir le français.
- source_word: Αββα ὁ πατήρ
  choice: Abba, Père
  rationale: Conserve la forme araméenne transmise par le texte et rend l’apposition grecque comme une adresse directe, sans ajouter le possessif « mon », absent du grec.
- source_word: πάντα δυνατά σοι
  choice: tout t’est possible
  rationale: Formulation française naturelle et digne qui conserve la portée globale de πάντα et la construction avec le datif σοι.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Éloigne de moi cette coupe
  rationale: Rend clairement la demande exprimée par l’impératif aoriste de παραφέρω, tout en conservant l’image de la coupe et l’ordre naturel du français.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Toutefois, non pas ce que je veux, mais ce que tu veux
  rationale: Restitue le contraste appuyé entre ἐγώ et σύ et supplée naturellement en français le verbe sous-entendu dans le second membre.
theological_decisions:
- issue: Double forme, araméenne et grecque, de l’adresse de Jésus à Dieu
  choice: Abba, Père
  alternative: Abba, mon Père
  rationale: Le texte conserve lui-même l’adresse araméenne suivie de son équivalent grec. Les deux sont donc maintenues, sans introduire un possessif qui n’est pas explicite.
- issue: Valeur métaphorique de la coupe
  choice: cette coupe
  alternative: cette souffrance
  rationale: L’image biblique est conservée plutôt qu’explicitée dans le corps du texte, afin de préserver ses résonances scripturaires et sa tension théologique.
- issue: Distinction des volontés dans la prière
  choice: non pas ce que je veux, mais ce que tu veux
  alternative: non pas ma volonté, mais la tienne
  rationale: La traduction suit la formulation concrète du grec avec τί et θέλω, sans transformer les verbes en noms ni atténuer le contraste entre « je » et « tu ».
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement reflète l’adresse personnelle directe à Dieu et l’usage biblique français courant. La syntaxe reste proche du grec lorsque cela demeure idiomatique; les images et tensions théologiques du texte source sont préservées.
