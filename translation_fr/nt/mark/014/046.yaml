  text: οἱ δὲ ἐπέβαλαν ⸂τὰς χεῖρας αὐτῷ⸃ καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: fr
  text: Alors ils mirent les mains sur lui[a] et le saisirent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « posèrent les mains sur lui ». L’expression grecque désigne ici le fait de mettre les mains sur quelqu’un, souvent pour l’arrêter.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’arrêtèrent ».
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Alors ils
  rationale: Le pronom substantivé οἱ désigne ici les personnes venues arrêter Jésus, tandis que δέ marque une transition narrative légère. « Alors ils » rend naturellement la progression sans accentuer indûment un contraste.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: mirent la main sur lui
  rationale: L’expression grecque signifie littéralement poser les mains sur quelqu’un et fonctionne ici comme un idiome de saisie hostile. Le singulier idiomatique français « mettre la main sur » est naturel et convient au contexte d’arrestation.
- source_word: ἐκράτησαν αὐτόν
  choice: se saisirent de lui
  rationale: κρατέω exprime ici le fait de prendre fermement et de retenir Jésus. « Se saisirent de lui » conserve la force concrète du grec sans réduire le verbe à la seule procédure juridique d’une arrestation.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition sémantique entre le geste de mettre la main sur Jésus et le fait de se saisir de lui est conservée, car elle reflète les deux verbes grecs et souligne l’action physique.
