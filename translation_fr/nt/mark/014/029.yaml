  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: fr
  text: 'Mais Pierre lui dit : « Même si tous viennent à tomber, moi, je ne tomberai pas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trébuchent ». Le verbe grec peut évoquer le fait d’être entraîné à trébucher, de prendre offense ou de se détourner.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste entre la prédiction précédente de Jésus et la réaction opposée de Pierre.
- source_word: ἔφη αὐτῷ
  choice: lui dit
  rationale: Rend naturellement le verbe déclaratif et conserve le pronom datif grec, dont le référent est Jésus dans le contexte.
- source_word: Εἰ καὶ
  choice: Même si
  rationale: Exprime clairement et naturellement la valeur conditionnelle-concessive de l'expression grecque.
- source_word: πάντες
  choice: tous
  rationale: Désigne l'ensemble des disciples évoqués dans le contexte, sans explicitation superflue.
- source_word: σκανδαλισθήσονται
  choice: abandonnent
  rationale: Dans ce contexte, le verbe évoque le fait de céder et d'abandonner Jésus. Ce choix français exprime la défection relationnelle sans conclure à une apostasie définitive.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: moi, je ne le ferai pas
  rationale: La dislocation emphatique « moi, je » restitue l'opposition marquée par ἐγώ, tandis que « le » reprend naturellement l'action sous-entendue.
theological_decisions:
- issue: Portée de σκανδαλισθήσονται dans le contexte de l'échec des disciples
  choice: abandonnent
  alternative: trébuchent ; se détournent ; tombent
  rationale: « Abandonnent » convient à la fuite prochaine des disciples et préserve la gravité de leur défaillance sans affirmer qu'il s'agit d'une rupture spirituelle définitive.
translation_notes:
  register: Français international moderne, naturel et digne. L'emphase de Pierre est conservée par « moi, je », et l'ellipse grecque est explicitée sans lourdeur.
