review_pass:
  verdict: revise
  source_fidelity: Le contraste initial, la condition concessive (« Même si »), la portée universelle de πάντες et l’insistance de Pierre sont bien rendus. Toutefois, « abandonnent » employé sans complément est moins idiomatique et tend à préciser la défection comme un abandon direct, alors que σκανδαλισθήσονται conserve l’image plus large de la chute ou du trébuchement provoqué.
  naturalness: « Mais Pierre lui dit » est naturel. « Même si tous viennent à tomber, moi, je ne tomberai pas » est idiomatique en français moderne, garde le parallélisme elliptique du grec et rend l’opposition emphatique sans le pronom vague « le ».
  terminology: « Venir à tomber » convient ici comme rendu contextuel de σκανδαλίζω sans trancher en faveur d’une apostasie définitive. La note doit présenter « trébucher », « prendre offense » et « se détourner » comme possibilités lexicales, plutôt que de faire de « tomber » une alternative à elle-même.
  issues:
  - severity: medium
    issue: « tous abandonnent » et « je ne le ferai pas »
    rationale: En français, « abandonner » appelle normalement un complément dans ce contexte; l’absence de complément produit une formulation elliptique moins naturelle. Le pronom « le » explicite en outre une action d’« abandonner » que le grec laisse plus ouverte par σκανδαλισθήσονται.
  - severity: low
    issue: Note lexicale imprécise
    rationale: La note actuelle propose « moi, je ne tomberai pas », qui correspond essentiellement au sens du texte révisé, mais n’explicite pas clairement les autres valeurs pertinentes du verbe grec, notamment « prendre offense ».
  revised_text: 'Mais Pierre lui dit : « Même si tous viennent à tomber, moi, je ne tomberai pas[a]. »'
  revised_footnotes:
  - marker: a
    text: Ou « trébuchent ». Le verbe grec peut évoquer le fait d’être entraîné à trébucher, de prendre offense ou de se détourner.
    reason: lexical_alternative
