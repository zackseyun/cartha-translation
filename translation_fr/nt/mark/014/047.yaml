source:
  edition: SBLGNT
  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: fr
  text: Mais l’un de ceux qui se tenaient là tira son épée, frappa l’esclave[a] du grand-prêtre et lui coupa l’oreille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec δοῦλος désigne ici une personne en condition servile.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Mais l’un
  rationale: La tournure introduit de manière indéfinie un membre du groupe. « Mais » rend la légère transition ou opposition marquée par δέ, sans identifier la personne.
- source_word: τῶν παρεστηκότων
  choice: de ceux qui se tenaient là
  rationale: Le participe désigne les personnes présentes, debout sur les lieux. Cette formulation française conserve naturellement la nuance spatiale.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: tira son épée
  rationale: Avec μάχαιρα, σπάομαι signifie tirer une arme. Le possessif est idiomatique en français lorsque le sujet tire l’arme qu’il porte.
- source_word: ἔπαισεν
  choice: frappa
  rationale: « Frappa » exprime sobrement et clairement le coup violent décrit par le verbe.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: l’esclave du grand-prêtre
  rationale: « Esclave » préserve le statut de dépendance exprimé par δοῦλος, tandis que le complément du nom rend directement le génitif grec.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: lui coupa l’oreille
  rationale: Dans ce contexte violent, « coupa » exprime idiomatiquement le résultat de ἀφαιρέω. Le pronom « lui » rend αὐτοῦ sans lourdeur; le diminutif ὠτάριον n’appelle pas « petite oreille » en français.
theological_decisions:
- issue: Rendu de δοῦλος dans ce contexte de statut social
  choice: esclave
  alternative: serviteur
  rationale: Le terme grec désigne une personne en condition servile. « Esclave » conserve cette réalité sociale, tandis que « serviteur » peut l’atténuer; l’alternative est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe coordonnée garde le rythme rapide du récit. « Grand-prêtre » suit l’usage biblique courant; aucun détail des récits parallèles, tel que l’oreille droite, n’est ajouté.
