  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: fr
  text: Après avoir chanté un cantique[a], ils partirent pour le mont des Oliviers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ayant chanté ». Le participe grec indique que ce chant précède leur départ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Après avoir…
  rationale: La coordination grecque ouvre l’action suivante. En français, l’enchaînement temporel est rendu naturellement par la proposition participiale initiale, sans qu’un « et » supplémentaire soit nécessaire.
- source_word: ὑμνήσαντες
  choice: après avoir chanté un cantique
  rationale: Le participe aoriste de ὑμνέω exprime une action antérieure au départ et désigne le fait de chanter un hymne ou un chant de louange. Cette formulation est naturelle en français et conserve la portée probablement liturgique du terme.
- source_word: ἐξῆλθον
  choice: ils partirent
  rationale: Dans ce contexte de déplacement vers une destination, « partirent » rend idiomatiquement l’idée qu’ils sortirent du lieu où ils se trouvaient, sans adopter un registre soutenu.
- source_word: εἰς
  choice: pour
  rationale: Avec un lieu de destination et le verbe « partir », « pour » exprime naturellement le mouvement en direction du mont des Oliviers.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: le mont des Oliviers
  rationale: Il s’agit de la désignation géographique française consacrée de ce lieu; « mont » convient à ὄρος et « des Oliviers » rend le génitif grec.
