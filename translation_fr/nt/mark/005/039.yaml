id: MRK.5.39
reference: Mark 5:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: fr
  text: 'Après être entré, il leur dit : « Pourquoi faites-vous tout ce bruit et pleurez-vous ? L’enfant n’est pas morte, mais elle dort. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’enfant n’est pas morte, mais elle est endormie. » Le verbe grec traduit par « dort » peut être employé comme image de la mort ; le texte ne précise pas ici la portée de cette parole.'
    reason: Signaler une formulation possible et l’emploi métaphorique possible du sommeil, sans interpréter ni résoudre l’ambiguïté de la parole.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Après être entré
  rationale: Le participe aoriste marque naturellement une action accomplie avant le verbe principal ; cette formulation française est claire sans alourdir le récit.
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent français conserve le présent historique de Marc et la vivacité de la narration.
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette question, « Pourquoi » rend idiomatiquement la valeur interrogative et réprobatrice.
- source_word: θορυβεῖσθε
  choice: faites-vous tout ce bruit
  rationale: Cette expression courante rend la manifestation bruyante et agitée désignée par le verbe, dans le contexte des lamentations.
- source_word: κλαίετε
  choice: pleurez-vous
  rationale: « Pleurer » est naturel, digne et suffisamment général, sans préciser indûment des lamentations rituelles.
- source_word: παιδίον
  choice: L’enfant
  rationale: Le nom grec signifie « enfant » ; le contexte permet ensuite l’accord féminin en français, puisque l’enfant est une fille.
- source_word: οὐκ ἀπέθανεν
  choice: n’est pas morte
  rationale: Cette formulation française naturelle rend la négation de la mort tout en gardant l’opposition directe avec le sommeil ; le féminin est exigé par le référent connu.
- source_word: καθεύδει
  choice: elle dort
  rationale: Le présent simple est la manière la plus naturelle d’exprimer en français l’état de sommeil, tout en préservant le langage potentiellement métaphorique.
theological_decisions:
- issue: La parole de Jésus constitue-t-elle une négation littérale de la mort ou emploie-t-elle le sommeil comme image de la mort ?
  choice: 'Conserver sans explication dans le texte principal l’opposition : « L’enfant n’est pas morte, mais elle dort. »'
  alternative: « L’enfant n’est pas définitivement morte » ou « elle est comme endormie »
  rationale: Le grec formule l’affirmation de manière abrupte et laisse subsister une tension avec le contexte. La traduction ne précise donc pas si la parole est littérale, métaphorique ou anticipatrice de la résurrection imminente.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique de Marc est conservé. « Tout ce bruit » est plus idiomatique que « tumulte » dans la question, tandis que « l’enfant » respecte le terme général grec ; les pronoms et participes s’accordent toutefois au féminin selon le contexte.
