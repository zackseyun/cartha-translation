source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: fr
  text: 'Il ne le laissa pas, mais lui dit : « Va chez toi, auprès des tiens[a], et raconte-leur tout ce que le Seigneur[b] a fait pour toi et comment il a eu compassion de toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers les tiens ». L’expression peut désigner sa famille, ses proches et, plus largement, les gens de son milieu.'
    reason: lexical_alternative
  - marker: b
    text: Certains comprennent ici « le Seigneur » comme une désignation de Dieu. D’autres estiment que Marc maintient intentionnellement un lien entre la compassion de Dieu et l’autorité ainsi que l’action de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: ne le lui permit pas
  rationale: 'Dans ce contexte, ἀφίημι signifie « permettre » plutôt que « pardonner » ou « laisser partir ». Le double pronom français garde les deux participants implicites dans le grec : Jésus ne permit pas cela à l’homme.'
- source_word: λέγει
  choice: il lui dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit français écrit, sans changement de sens.
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Va chez toi
  rationale: Cette formulation française naturelle exprime à la fois le déplacement demandé et le retour dans le cadre domestique de l’homme.
- source_word: πρὸς τοὺς σούς
  choice: auprès des tiens
  rationale: L’expression conserve la portée ouverte du grec, qui peut englober la famille, les proches et les personnes du milieu de l’homme, sans la limiter aux seuls parents.
- source_word: ἀπάγγειλον αὐτοῖς
  choice: raconte-leur
  rationale: ἀπαγγέλλω signifie ici rapporter ou faire le récit de ce qui s’est passé. « Raconte-leur » est clair, actuel et adapté à une expérience personnelle.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: tout ce que le Seigneur a fait pour toi
  rationale: 'ὅσα désigne l’ensemble ou l’ampleur des actes accomplis. « Tout ce que » est idiomatique en français et le datif σοι est naturellement compris comme indiquant le bénéficiaire : « pour toi ».'
- source_word: ἠλέησέν σε
  choice: il a eu compassion de toi
  rationale: ἐλεάω exprime la compassion qui pousse à secourir. Cette tournure française conserve la force relationnelle du verbe sans l’affaiblir en simple sentiment de pitié.
theological_decisions:
- issue: Sens de κύριος lorsque Jésus parle de ce que « le Seigneur » a accompli
  choice: le Seigneur
  alternative: Dieu
  rationale: Le grec dit κύριος. Traduire par « le Seigneur » préserve l’ambiguïté voulue du passage entre l’action et la compassion de Dieu, d’une part, et l’autorité ainsi que l’action de Jésus dans le récit, d’autre part. Remplacer le terme par « Dieu » résoudrait cette tension au lieu de la laisser entendre.
- issue: Rendu de ἐλεάω
  choice: a eu compassion de toi
  alternative: a eu pitié de toi
  rationale: « Compassion » exprime ici une miséricorde active et digne. « Pitié » est possible, mais peut évoquer en français moderne un sentiment condescendant absent du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif écrit. « Chez toi » et « auprès des tiens » sont naturels sans être familiers. La ponctuation française et les espaces avant les deux-points sont respectées.
