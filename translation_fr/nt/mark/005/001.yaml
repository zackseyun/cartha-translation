  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: fr
  text: Ils arrivèrent sur l’autre rive de la mer, dans la région des Géraséniens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Gadaréniens » ; d’autres, « Gergéséniens ».
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: Ils arrivèrent
  rationale: La coordination grecque poursuit le récit de manière paratactique. En français moderne, elle peut rester implicite au début de cette phrase sans perdre la continuité narrative.
- source_word: ἦλθον
  choice: Ils arrivèrent
  rationale: L’aoriste pluriel de ἔρχομαι désigne Jésus et ceux qui l’accompagnent. « Arrivèrent » convient naturellement à l’achèvement de la traversée.
- source_word: εἰς τὸ πέραν
  choice: sur l’autre rive
  rationale: Dans le contexte d’une traversée maritime, cette tournure idiomatique française exprime naturellement l’arrivée du côté opposé tout en conservant l’idée spatiale du grec.
- source_word: τῆς θαλάσσης
  choice: de la mer
  rationale: Bien que la mer de Galilée soit géographiquement un lac, « mer » reproduit l’usage du grec et le vocabulaire biblique courant.
- source_word: εἰς τὴν χώραν
  choice: dans la région
  rationale: χώρα désigne ici un territoire ou un district, non un pays au sens moderne. « Région » est clair et naturel.
- source_word: Γερασηνῶν
  choice: des Géraséniens
  rationale: Le gentilé français rend le pluriel grec et suit la leçon du SBLGNT, tout en laissant les variantes manuscrites en note.
theological_decisions:
- issue: Variation textuelle et géographique du nom de lieu dans le récit
  choice: Géraséniens
  alternative: Gadaréniens ; Gergéséniens
  rationale: Le texte principal suit la leçon Γερασηνῶν du SBLGNT. Les principales variantes sont conservées en note sans tenter de résoudre la difficulté géographique.
translation_notes:
  register: Français international moderne, naturel et digne. « Sur l’autre rive » est plus idiomatique en français que le calque « de l’autre côté », tandis que « mer » préserve le terme du texte grec.
