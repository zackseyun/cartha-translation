source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: fr
  text: 'Il parlait encore quand des gens arrivèrent de chez le chef de la synagogue et dirent : « Ta fille est morte. Pourquoi continues-tu à déranger le Maître ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Il parlait encore quand
  rationale: Le génitif absolu marque une action simultanée; cette formulation naturelle conserve la valeur temporelle de ἔτι.
- source_word: ἔρχονται
  choice: arrivèrent
  rationale: Le présent historique grec est rendu par le passé simple, adapté à une narration française écrite et digne.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: de chez le chef de la synagogue
  rationale: La tournure contextuelle désigne le domicile ou l'entourage du chef, puisque celui-ci accompagne déjà Jésus; « de chez » exprime ce sens sans ajouter explicitement « maison ».
- source_word: λέγοντες ὅτι
  choice: 'et dirent :'
  rationale: Le participe introduit le discours direct; une proposition coordonnée est idiomatique en français.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: Ta fille est morte
  rationale: Le passé composé grec désigne ici un décès accompli dont la conséquence présente est évidente; « est morte » est la formulation française naturelle.
- source_word: τί ἔτι σκύλλεις
  choice: Pourquoi déranger encore
  rationale: La question porte sur la poursuite jugée désormais inutile de l'action; σκύλλω signifie ici importuner ou déranger.
- source_word: τὸν διδάσκαλον
  choice: le Maître
  rationale: Dans le récit évangélique français, « le Maître » est un titre naturel pour celui qui enseigne et conserve le titre employé par les locuteurs plutôt que de le remplacer par le nom de Jésus.
theological_decisions:
- issue: Référence et portée de τὸν διδάσκαλον
  choice: le Maître
  alternative: l'Enseignant; Jésus
  rationale: Le texte emploie un titre, non le nom de Jésus. La traduction conserve le point de vue des messagers sans expliciter davantage leur compréhension de son identité.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au fil du récit; le discours direct reste courant et immédiat. « De chez le chef de la synagogue » rend explicitement mais sobrement l'origine domestique impliquée par le contexte.
