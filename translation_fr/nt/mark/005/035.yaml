  source_fidelity: La traduction rend correctement la simultanéité (« Il parlait encore quand »), l’origine contextuellement domestique des messagers (« de chez le chef de la synagogue »), l’annonce du décès et le titre employé pour Jésus. Toutefois, « Pourquoi déranger encore le Maître ? » transforme la question adressée à Jaïrus au singulier (σκύλλεις, « tu déranges ») en tournure infinitive impersonnelle et n’exprime pas aussi nettement l’idée de continuation portée par τί ἔτι.
  naturalness: Le français est globalement naturel, sobre et adapté à un récit narratif. « Pourquoi continues-tu à déranger le Maître ? » est tout aussi idiomatique et restitue plus précisément l’interpellation directe.
  terminology: '« Chef de la synagogue » est clair et juste pour ἀρχισυνάγωγος. « Le Maître » est un titre évangélique français établi et peut rendre διδάσκαλος dans ce contexte sans introduire une interprétation doctrinale. Aucune note n’est nécessaire : les alternatives proposées dans la note actuelle portent sur deux mots différents et son ancrage unique après « Maître » est imprécis.'
