source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: fr
  text: Ceux qui les gardaient s’enfuirent et rapportèrent la nouvelle dans la ville et dans la campagne[a]. Les gens vinrent voir ce qui s’était passé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les champs ». Le grec peut se traduire plus littéralement ainsi, mais il désigne probablement ici les zones rurales autour de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: gardaient
  rationale: Dans ce contexte, le participe désigne ceux qui s’occupaient du troupeau de porcs. « Gardaient » est naturel en français et couvre l’activité de surveillance et de conduite du troupeau sans la réduire au seul fait de le nourrir.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux porcs mentionnés au verset précédent. Le pronom français conserve la formulation grecque, dont le référent demeure clair dans le contexte.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Ce verbe rend la fuite soudaine exprimée par l’aoriste et conserve la force narrative du grec.
- source_word: ἀπήγγειλαν
  choice: annoncèrent la nouvelle
  rationale: Le verbe signifie transmettre ou rapporter une information. « Annoncèrent la nouvelle » est idiomatique et permet de ne pas préciser artificiellement un complément absent du texte grec.
- source_word: εἰς τὴν πόλιν
  choice: dans la ville
  rationale: Avec un verbe de transmission d’une nouvelle, le français exprime naturellement le lieu où celle-ci est annoncée par « dans », plutôt que sa seule direction.
- source_word: εἰς τοὺς ἀγρούς
  choice: dans la campagne
  rationale: Dans l’opposition avec « la ville », le pluriel ἀγρούς désigne vraisemblablement la zone rurale environnante. « Dans la campagne » en communique naturellement le sens.
- source_word: ἦλθον
  choice: les gens vinrent
  rationale: Le grec comporte un sujet pluriel implicite, qui désigne naturellement les destinataires de la nouvelle. En français, « les gens » évite que le pronom « ils » soit compris à tort comme renvoyant aux gardiens du troupeau.
- source_word: ἰδεῖν
  choice: voir
  rationale: L’infinitif exprime ici le but de la venue ; « vinrent voir » est la tournure française naturelle.
- source_word: τί ἐστιν τὸ γεγονός
  choice: ce qui s’était passé
  rationale: Cette tournure française rend naturellement la question portant sur l’événement survenu, tandis que le plus-que-parfait restitue la valeur accomplie du participe parfait γεγονός dans le récit.
