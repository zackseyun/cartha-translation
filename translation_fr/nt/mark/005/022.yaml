source:
  edition: SBLGNT
  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: fr
  text: Alors arrive l’un des responsables de la synagogue, nommé Jaïros. Quand il voit Jésus, il tombe à ses pieds.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: arrive
  rationale: Le présent de narration grec est conservé, car il est naturel en français et maintient la vivacité caractéristique du récit de Marc.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: l’un des responsables de la synagogue
  rationale: La construction partitive est rendue explicitement. « Responsable » désigne naturellement une personne chargée de la direction et de l’administration de la synagogue, sans suggérer une fonction politique.
- source_word: ὀνόματι Ἰάϊρος
  choice: nommé Jaïros
  rationale: Cette formulation concise et idiomatique restitue l’expression grecque servant à identifier la personne.
- source_word: ἰδὼν αὐτὸν
  choice: Quand il voit Jésus
  rationale: La proposition temporelle rend clairement le participe aoriste. Le nom « Jésus » explicite le référent du pronom grec dans un français naturel, sans ajouter d’information nouvelle.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: il tombe à ses pieds
  rationale: Le présent narratif est conservé. « Tomber aux pieds de quelqu’un » est l’équivalent idiomatique français du geste physique décrit.
theological_decisions:
- issue: Sens du geste accompli devant Jésus
  choice: il tombe à ses pieds
  alternative: il se prosterne devant lui
  rationale: Le grec décrit le geste de tomber aux pieds de Jésus, qui peut exprimer le respect, la détresse ou la supplication. La traduction n’en fait pas explicitement un acte d’adoration et préserve ainsi l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique est maintenu pour restituer la vivacité de Marc. « Responsable de la synagogue » est plus immédiatement compréhensible aujourd’hui que « chef de synagogue », tout en conservant la fonction institutionnelle.
