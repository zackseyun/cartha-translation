id: MRK.5.4
reference: Mark 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: fr
  text: car on l’avait souvent attaché avec des entraves aux pieds et des chaînes, mais il avait rompu les chaînes et brisé les entraves, et personne n’était assez fort pour le maîtriser[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le dompter ». Le verbe grec peut signifier « dompter » ou, plus largement, « maîtriser, réduire à l’obéissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: car on l’avait
  rationale: διά suivi de l’infinitif substantivé exprime ici la cause de l’affirmation précédente. « Car » conserve ce lien causal, tandis que la tournure impersonnelle « on l’avait » est naturelle en français.
- source_word: πολλάκις
  choice: souvent
  rationale: Équivalent français simple et direct exprimant la répétition.
- source_word: πέδαις / τὰς πέδας
  choice: entraves aux pieds / entraves
  rationale: πέδη désigne spécifiquement un lien ou un fer placé aux pieds. La première occurrence explicite ce sens, puis la reprise abrégée évite une lourdeur tout en maintenant la distinction avec les chaînes.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: chaînes
  rationale: ἅλυσις désigne des chaînes; ce choix préserve la distinction lexicale avec πέδαι.
- source_word: δεδέσθαι
  choice: avait été attaché
  rationale: Le parfait infinitif évoque l’état résultant d’actes répétés. Le plus-que-parfait convient au contexte rétrospectif; « attacher » est courant et concret.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις
  choice: il avait rompu les chaînes
  rationale: La construction passive grecque avec complément d’agent devient une tournure active plus naturelle en français, sans changer le sens. « Rompre » exprime la séparation violente des chaînes.
- source_word: τὰς πέδας συντετρῖφθαι
  choice: brisé les entraves
  rationale: συντρίβω exprime l’action de briser ou fracasser. « Briser » est vigoureux, idiomatique et suffisamment précis.
- source_word: οὐδεὶς ἴσχυεν
  choice: personne n’était assez fort
  rationale: Cette formulation conserve la nuance de force ou de capacité physique portée par ἰσχύω, plutôt que de l’aplatir en simple possibilité.
- source_word: δαμάσαι
  choice: maîtriser
  rationale: δαμάζω peut signifier dompter ou réduire à l’obéissance. « Maîtriser » exprime ici le fait de placer quelqu’un sous contrôle sans imposer une comparaison animale.
theological_decisions:
- issue: Origine de la force extraordinaire de l’homme
  choice: Décrire seulement l’échec répété des moyens de contrainte et l’incapacité de quiconque à le maîtriser.
  alternative: Attribuer explicitement cette force à la puissance démoniaque.
  rationale: Le verset décrit une force hors du commun, mais n’en précise pas directement la cause. La traduction laisse au contexte narratif le soin d’éclairer sa condition, sans ajouter d’explication théologique.
- issue: Portée de δαμάσαι
  choice: maîtriser
  alternative: dompter
  rationale: « Maîtriser » convient au contexte d’une tentative de mise sous contrôle; une note conserve néanmoins le sens plus littéral et potentiellement évocateur de « dompter ».
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste liée causalement au verset précédent par « car ». Le contraste introduit par « mais » explicite naturellement l’opposition entre les liens imposés et leur rupture, implicite dans l’enchaînement grec. Le marqueur de note est placé sur le mot concerné, « maîtriser ».
