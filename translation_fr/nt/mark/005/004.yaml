  source_fidelity: Le texte rend correctement la construction causale introduite par διὰ τὸ, la répétition de πολλάκις, et les trois infinitifs parfaits qui décrivent les tentatives répétées de contention ainsi que la rupture des liens. La distinction entre πέδαι (« entraves aux pieds ») et ἁλύσεις (« chaînes ») est maintenue. « Personne n’était assez fort » restitue bien la nuance de force de ἴσχυεν, et « maîtriser » convient à δαμάσαι dans ce contexte sans ajouter d’explication sur la cause de sa force.
  naturalness: Le français est fluide, moderne et narratif. « Car » établit naturellement le lien avec le verset précédent. L’ajout de « mais » rend explicite, sans le surinterpréter, le contraste implicite entre les liens imposés et leur destruction. « Entraves aux pieds » est un peu plus explicatif que le grec, mais reste naturel et utile pour distinguer ce terme de « chaînes ».
  terminology: Les termes de contrainte sont cohérents et précis. « Maîtriser » est une solution idiomatique et non doctrinale pour δαμάσαι; la note fournit correctement « dompter » comme autre possibilité lexicale. Le marqueur est placé sur le terme concerné et la note est formulée dans un français clair.
