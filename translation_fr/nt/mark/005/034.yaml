  to: 'Mais il lui dit : « Ma fille, ta foi t’a sauvée[a]. Va en paix et sois rétablie de ton mal[b]. »'
  rationale: La seule modification remplace « sois guérie » par « sois rétablie », afin de mieux rendre l’état exprimé par ἴσθι ὑγιής sans aplanir la distinction avec σέσωκέν σε. Les notes sont ajustées pour que l’alternative principale demeure disponible et que l’ancrage [b] porte clairement sur cette proposition.
