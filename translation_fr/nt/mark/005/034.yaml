source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: fr
  text: 'Mais il lui dit : « Ma fille, ta foi t’a sauvée[a]. Va en paix et sois rétablie de ton mal[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’a guérie » ou « t’a rétablie ». Le verbe grec peut évoquer le salut, la délivrance ou la guérison.
    reason: alternative_reading
  - marker: b
    text: Ou « sois guérie » ou « sois bien portante ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Ma fille
  rationale: Le vocatif littéral « Fille » serait peu naturel en français. « Ma fille » restitue l’adresse tendre et familiale sans changer la relation exprimée.
- source_word: πίστις
  choice: foi
  rationale: Dans ce contexte, le mot désigne la confiance avec laquelle la femme s’est approchée de Jésus. « Foi » conserve aussi le terme biblique central et sa portée possible.
- source_word: σέσωκέν σε
  choice: t’a sauvée
  rationale: Le parfait de σῴζω peut désigner le salut, la délivrance ou la guérison. « T’a sauvée » en préserve l’étendue sémantique et évite de le confondre avec la proposition suivante, qui porte explicitement sur la santé.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Va en paix
  rationale: Cette formulation idiomatique et naturelle exprime le départ dans un état de paix.
- source_word: ἴσθι ὑγιὴς
  choice: sois guérie
  rationale: L’expression stative signifie être saine, bien portante. Dans le contexte d’une maladie dont la femme vient d’être délivrée, « sois guérie » est clair et naturel, tandis qu’une note conserve les autres nuances.
- source_word: μάστιγός
  choice: mal
  rationale: Employé métaphoriquement, μάστιξ désigne ici l’affection douloureuse qui tourmentait la femme. « Mal » est sobre, actuel et suffisamment large.
theological_decisions:
- issue: Portée de σῴζω entre salut et guérison
  choice: t’a sauvée
  alternative: t’a guérie / t’a rétablie
  rationale: Le choix principal conserve la possible portée salvatrice du verbe sans nier son sens médical dans ce récit. La note rend explicite l’ambiguïté réelle du grec.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance
  rationale: « Foi » maintient la terminologie théologique du texte, alors que le contexte montre qu’il s’agit concrètement de la confiance placée en Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond aux formes grecques au singulier. « Ma fille » est l’équivalent vocatif idiomatique de Θυγάτηρ, et la distinction entre « t’a sauvée » et « sois guérie » préserve la tension lexicale du texte source.
