review_pass:
  verdict: revise
  source_fidelity: « Ma fille » est un vocatif français naturel et affectueux pour Θυγάτηρ; l’ajout idiomatique de « ma » ne doit pas être compris comme l’affirmation d’un possessif grec. « Ta foi t’a sauvée » rend bien le parfait σέσωκέν σε et maintient l’ambiguïté entre salut, délivrance et guérison. En revanche, « sois guérie » présente plus naturellement en français l’acte d’être guérie, tandis que ἴσθι ὑγιής exprime l’état de santé rétablie. « Sois rétablie de ton mal » rend mieux cet état tout en conservant le complément ἀπὸ τῆς μάστιγός σου.
  naturalness: Le texte est globalement fluide et digne en français international moderne. « Sois rétablie de ton mal » est une formulation naturelle dans ce contexte et évite de répéter exactement la notion de guérison déjà possible dans la première proposition.
  terminology: « Foi », « sauvée » et « Va en paix » sont appropriés et cohérents. « Mal » est sobre et assez large pour la μάστιξ métaphorique; la note doit toutefois présenter « sois guérie » comme une alternative plutôt que le texte principal.
  issues:
  - severity: medium
    issue: « sois guérie » ne reflète pas au plus près la valeur stative de ἴσθι ὑγιής.
    rationale: ὑγιής signifie « sain, en bonne santé, rétabli ». Dans cette parole qui suit une guérison, le français « sois guérie » peut s’entendre comme un nouvel acte de guérison; « sois rétablie » exprime plus directement l’état de santé recouvrée.
