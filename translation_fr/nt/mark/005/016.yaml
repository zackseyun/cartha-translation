review_pass:
  verdict: revise
  source_fidelity: La structure et le sens général sont bien rendus. Toutefois, « possédé par un démon » impose un singulier que le participe grec δαιμονιζόμενος ne précise pas et qui cadre moins bien avec le contexte immédiat, où il est question de « Légion ». Une formulation au pluriel rend mieux le référent narratif sans changer le sens.
  naturalness: Le texte est globalement fluide. « Comment cela était arrivé à l’homme » est toutefois un peu moins idiomatique que « comment les choses s’étaient passées pour l’homme ». La formulation révisée conserve un français moderne et narratif.
  terminology: « Porcs » et « racontèrent » conviennent bien. « L’homme possédé par des démons » est clair pour δαιμονιζόμενος dans ce contexte; la note conserve les formulations alternatives sans enfermer le terme grec dans une nuance unique.
  issues:
  - severity: medium
    issue: Nombre imposé dans « possédé par un démon »
    rationale: Le grec δαιμονιζομένῳ ne spécifie pas à lui seul le nombre des démons. Dans le contexte de Marc 5, le personnage est associé à « Légion », ce qui rend le singulier français inutilement restrictif.
  - severity: low
    issue: Tournure « comment cela était arrivé à l’homme »
    rationale: Elle est compréhensible, mais « comment les choses s’étaient passées pour l’homme » est plus naturel en français tout en rendant πῶς ἐγένετο.
  revised_text: Ceux qui avaient vu leur racontèrent comment les choses s’étaient passées pour l’homme possédé par des démons[a], et ce qui était arrivé aux porcs.
  revised_footnotes:
