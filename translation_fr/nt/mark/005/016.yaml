    text: 'Ou « l’homme sous l’emprise de démons » ; autre traduction possible : « le démoniaque ».'
    reason: lexical_alternative
  revision_rationale: 'La révision évite de faire porter au participe grec une précision numérique non exprimée, tout en tenant compte du référent établi par le contexte. Elle améliore également l’idiomaticité de la phrase française et conserve les deux objets du récit : ce qui concernait l’homme et ce qui concernait les porcs.'
