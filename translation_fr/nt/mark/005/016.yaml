  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: fr
  text: Ceux qui avaient vu leur racontèrent comment les choses s’étaient passées pour l’homme possédé par des démons[a], et ce qui était arrivé aux porcs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’homme sous l’emprise de démons » ; autre traduction possible : « le démoniaque ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: racontèrent
  rationale: Le verbe évoque un récit ou un compte rendu des faits. « Racontèrent » est naturel en français moderne et rend mieux cette nuance que le simple « dirent ».
- source_word: οἱ ἰδόντες
  choice: Ceux qui avaient vu ce qui s’était passé
  rationale: Le participe substantivé désigne les personnes qui avaient assisté aux événements. Le complément explicité en français évite l’emploi absolu, peu naturel, de « ceux qui avaient vu ».
- source_word: πῶς ἐγένετο
  choice: comment cela était arrivé
  rationale: Cette formulation conserve la valeur de manière ou de déroulement exprimée par πῶς et situe naturellement l’événement avant le récit des témoins.
- source_word: τῷ δαιμονιζομένῳ
  choice: à l’homme possédé par un démon
  rationale: Cette expression claire et courante désigne la personne soumise à une puissance démoniaque sans recourir au substantif traditionnel mais moins accessible « démoniaque ».
- source_word: περὶ τῶν χοίρων
  choice: ainsi que ce qui était arrivé aux porcs
  rationale: Dans ce contexte, περί introduit le second sujet du récit. L’explicitation verbale produit un français naturel et évite l’ambiguïté possible de « au sujet des porcs », sans ajouter de détail sur leur sort.
theological_decisions:
- issue: Traduction de δαιμονιζομένῳ dans un récit d’activité démoniaque
  choice: l’homme possédé par un démon
  alternative: l’homme sous l’emprise d’un démon ; le démoniaque
  rationale: Le texte présente une affliction démoniaque réelle dans le cadre narratif de Marc. La formulation retenue est compréhensible, garde la référence personnelle et ne réduit pas le phénomène à une catégorie seulement psychologique. La note signale une autre traduction possible, moins catégorique quant à la nuance exacte du participe.
translation_notes:
  register: Français international moderne, narratif et digne. « Porcs » est préféré à « pourceaux », aujourd’hui vieilli. La répétition de « arrivé » rend explicites en français les deux volets du témoignage tout en conservant la structure et le sens du grec.
