source:
  edition: SBLGNT
  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: fr
  text: 'Et il lui demandait : « Quel est ton nom ? » Il lui dit : « Mon nom est Légion[a], car nous sommes nombreux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Légion » est un terme militaire latin passé en grec, qui désignait une grande unité de l’armée romaine ; ici, il est employé comme le nom que donne le locuteur et suggère une multitude.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: demandait
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et laisse entendre une action en cours ou répétée, sans l’aplatir en un simple passé ponctuel.
- source_word: Τί ὄνομά σοι
  choice: Quel est ton nom ?
  rationale: Cette formulation française naturelle rend l’expression grecque idiomatique avec ὄνομα et le datif, tout en conservant la question directe.
- source_word: λέγει αὐτῷ
  choice: Il lui dit
  rationale: Le présent grec est un présent historique. En français narratif moderne, le présent « il lui dit » aurait créé une rupture peu naturelle après l’imparfait ; le présent de narration de Marc est donc rendu ici par un passé simple, avec priorité donnée à la fluidité du récit.
- source_word: Λεγιών
  choice: Légion
  rationale: Le terme grec, emprunté au latin, fonctionne ici comme le nom ou la désignation donnée par l’esprit ; la majuscule signale cet emploi nominal.
- source_word: ὄνομά μοι
  choice: Mon nom est
  rationale: Équivalent français naturel de l’expression nominale grecque avec pronom au datif.
- source_word: ὅτι πολλοί ἐσμεν
  choice: car nous sommes nombreux
  rationale: ὅτι introduit la raison du nom. « Car » convient au registre narratif digne, et le pluriel « nous sommes » est maintenu puisqu’il est essentiel au sens.
theological_decisions:
- issue: Passage du singulier au pluriel dans l’auto-identification du locuteur
  choice: Conserver « Mon nom est Légion » au singulier puis « nous sommes nombreux » au pluriel.
  alternative: Harmoniser en « Notre nom est Légion » ou reformuler pour atténuer le changement.
  rationale: Le grec maintient cette tension entre l’identité exprimée au singulier et la pluralité expliquée ensuite. La traduction ne doit pas la résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’échange direct dans ce contexte. L’imparfait conserve l’aspect de ἐπηρώτα ; le passé simple « dit » assure une narration française fluide. Le marqueur [a] est placé immédiatement après « Légion ».
