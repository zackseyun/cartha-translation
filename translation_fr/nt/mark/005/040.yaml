source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: fr
  text: Et ils se moquaient de lui[a]. Mais lui, après les avoir tous fait sortir, prend avec lui le père et la mère de l’enfant, ainsi que ceux qui étaient avec lui[b], et entre là où se trouvait l’enfant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « riaient de lui » ; le verbe grec désigne ici un rire moqueur.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les disciples qui l’accompagnaient.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: se moquaient de
  rationale: L’imparfait grec présente une action en cours, et le verbe désigne ici un rire moqueur. « Se moquaient de lui » est naturel en français et rend clairement la valeur dérisoire du rire.
- source_word: ἐκβαλὼν πάντας
  choice: après les avoir tous fait sortir
  rationale: Le participe exprime une action antérieure aux verbes principaux. Cette formulation rend l’éloignement de toutes les personnes concernées sans employer « chasser », qui pourrait paraître excessivement dur ou évoquer les récits d’exorcisme.
- source_word: παραλαμβάνει
  choice: prend avec lui
  rationale: Le présent historique est conservé pour respecter la vivacité narrative caractéristique de Marc. « Prend avec lui » exprime que Jésus choisit certaines personnes pour l’accompagner.
- source_word: παιδίου / παιδίον
  choice: enfant
  rationale: Le nom grec est neutre et signifie « enfant ». Même si le contexte précise qu’il s’agit d’une fille, « enfant » préserve ici la formulation du verset.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: ceux qui l’accompagnent
  rationale: Cette expression transparente rend la présence des compagnons de Jésus sans préciser leur identité dans le corps du texte.
- source_word: εἰσπορεύεται
  choice: entre
  rationale: Le présent historique est conservé. « Entre » rend simplement et naturellement le mouvement vers l’endroit où se trouve l’enfant.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: là où se trouve l’enfant
  rationale: La proposition grecque indique seulement le lieu. La traduction n’ajoute donc pas que l’enfant était couchée. Le présent français s’accorde avec la narration vive au présent historique.
theological_decisions:
- issue: Temps narratif et vivacité du récit
  choice: Conserver les présents historiques (« prend », « entre »)
  alternative: Uniformiser le récit au passé (« prit », « entra »)
  rationale: Marc emploie fréquemment le présent historique pour donner de la vivacité à la narration. Son maintien est naturel en français dans ce passage et respecte la texture discursive du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la progression vive du grec et évite aussi bien l’archaïsme que la surinterprétation.
