  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: fr
  text: Aussitôt, la jeune fille se leva[a] et se mit à marcher, car elle avait douze ans. Et aussitôt, ils furent saisis d’une grande stupeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mit debout ». Le verbe grec peut aussi être rendu par « se leva » ou « se mit debout ».
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie un verbe et un nom apparentés pour exprimer une stupeur intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme, caractéristique du rythme narratif de Marc, exprime clairement l’immédiateté dans un français naturel.
- source_word: ἀνέστη
  choice: se leva
  rationale: Le verbe décrit ici le fait que la jeune fille se relève après l’ordre de Jésus. « Se leva » reste naturel et conserve la possibilité d’une nuance de relèvement à la vie sans l’expliciter davantage que le grec.
- source_word: τὸ κοράσιον
  choice: la jeune fille
  rationale: κοράσιον désigne une fille encore jeune. « La jeune fille » convient à l’âge de douze ans indiqué dans la phrase, sans accentuer artificiellement une valeur diminutive.
- source_word: περιεπάτει
  choice: se mit à marcher
  rationale: L’imparfait grec présente une action en cours après son relèvement. « Se mit à marcher » en rend naturellement le commencement et le déroulement visible.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: car elle avait douze ans
  rationale: Cette formulation idiomatique française exprime l’âge et conserve la valeur explicative de γάρ.
- source_word: ἐξέστησαν
  choice: ils furent saisis
  rationale: ἐξίστημι évoque ici une réaction qui les bouleverse et les plonge dans l’étonnement. « Furent saisis » s’associe naturellement au nom qui suit.
- source_word: ἐκστάσει μεγάλῃ
  choice: d’un immense étonnement
  rationale: La construction apparentée avec ἐξέστησαν intensifie la stupeur. Cette formulation en restitue la force sans le sens moderne trompeur d’« extase ».
theological_decisions:
- issue: Nuance possible de résurrection dans ἀνέστη
  choice: Traduire par « se leva », qui décrit le relèvement physique dans le récit du miracle.
  alternative: « se releva » ou « ressuscita »
  rationale: Le contexte implique clairement un retour à la vie, mais le verbe peut désigner simplement l’action de se lever. « Se leva » préserve la portée du récit sans imposer au verbe une formulation doctrinale plus explicite que l’original.
- issue: Expression intensive ἐξέστησαν ἐκστάσει μεγάλῃ
  choice: Rendre idiomatiquement l’intensité par « furent saisis d’un immense étonnement ».
  alternative: « furent étonnés d’un grand étonnement »
  rationale: Le grec emploie un verbe et un nom apparentés pour souligner l’intensité. La traduction principale évite une répétition peu naturelle, tandis que la note signale la forme de l’original.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme vif de Marc est conservé par la répétition d’« aussitôt ». Les tournures idiomatiques évitent une littéralité maladroite tout en signalant en note l’expression intensive du grec.
