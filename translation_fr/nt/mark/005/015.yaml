source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: fr
  text: Ils viennent auprès de Jésus et voient l’homme possédé par des démons, assis, habillé et sain d’esprit — celui qui avait été possédé par la Légion[a] —, et ils prennent peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la légion ». Le terme peut être compris comme une désignation descriptive plutôt que comme un nom, puisqu’il reprend la manière dont les démons se sont désignés plus haut.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: ils viennent
  rationale: Le présent historique grec peut être conservé naturellement en français narratif et donne de la vivacité à la scène.
- source_word: θεωροῦσιν
  choice: voient
  rationale: Le verbe exprime ici une observation directe; « voient » est naturel et s’accorde avec le présent historique de ἔρχονται.
- source_word: δαιμονιζόμενον
  choice: l’homme possédé par des démons
  rationale: Le participe substantivé désigne l’homme connu par son ancienne condition. Cette formulation rend clairement la réalité de l’emprise démoniaque sans recourir au terme vieilli « démoniaque »; le pluriel tient compte du contexte immédiat de la légion.
- source_word: καθήμενον
  choice: assis
  rationale: Le participe décrit simplement l’état visible de l’homme; « assis » est direct et idiomatique.
- source_word: ἱματισμένον
  choice: habillé
  rationale: Le participe souligne son état restauré, en contraste avec sa nudité antérieure. « Habillé » est courant et précis.
- source_word: σωφρονοῦντα
  choice: sain d’esprit
  rationale: L’expression rend le retour à la lucidité et à la maîtrise de soi sans réduire le récit à un diagnostic clinique.
- source_word: ἐσχηκότα
  choice: qui avait eu
  rationale: Le parfait identifie rétrospectivement l’homme par une condition passée dont les conséquences restent pertinentes. Le plus-que-parfait français marque clairement l’antériorité.
- source_word: λεγιῶνα
  choice: la légion
  rationale: Avec l’article, le terme renvoie à la multitude de démons désignée auparavant. La minuscule laisse ouverte la question de savoir s’il s’agit d’une désignation descriptive ou d’un nom propre.
- source_word: ἐφοβήθησαν
  choice: ils prennent peur
  rationale: Cette tournure naturelle rend la réaction initiale exprimée par l’aoriste, tout en s’intégrant à une narration française au présent historique.
theological_decisions:
- issue: Description de l’emprise démoniaque
  choice: l’homme possédé par des démons
  alternative: l’homme sous l’emprise de démons
  rationale: Le texte présente une possession démoniaque réelle. La formulation retenue ne l’atténue pas en simple trouble humain et reste compréhensible en français actuel.
- issue: λεγιών comme désignation ou nom propre
  choice: la légion
  alternative: « Légion »
  rationale: Le grec avec article renvoie à l’auto-désignation précédente des démons, mais ne tranche pas à lui seul la question typographique du nom propre. Le texte principal garde la valeur descriptive et la note préserve l’autre lecture.
translation_notes:
  register: Français international actuel, narratif et digne. Les présents historiques grecs sont conservés, car ils sont naturels dans le récit français. Le tiret met en relief l’identification rétrospective sans supprimer la tension entre l’ancienne désignation de l’homme et son état désormais restauré.
