revisions:
- from: Ils viennent auprès de Jésus et voient l’homme possédé par des démons, assis, habillé et sain d’esprit — celui qui avait eu la légion[a] —, et ils prennent peur.
  to: Ils viennent auprès de Jésus et voient l’homme possédé par des démons, assis, habillé et sain d’esprit — celui qui avait été possédé par la Légion[a] —, et ils prennent peur.
  rationale: La révision remplace une tournure française ambiguë et lourde par « qui avait été possédé par la Légion ». Cette formulation exprime clairement, à la lumière du contexte, le lien entre l’homme et la multitude démoniaque, tout en gardant le caractère rétrospectif de l’identification. La note conserve l’ambiguïté légitime entre nom et désignation descriptive.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:50:41Z'
review_pass:
  verdict: revise
  source_fidelity: Le présent historique est bien rendu par « viennent » et « voient ». Les participes décrivant l’homme (« assis, habillé et sain d’esprit ») sont fidèlement représentés. Toutefois, « la légion » dans « celui qui avait eu la légion » est à la fois idiomatiquement maladroit et trop facilement compris comme une légion militaire; le contexte grec vise la désignation des démons qui le possédaient.
  naturalness: Le français narratif au présent est naturel, de même que « ils prennent peur ». La formulation « avait eu la légion » est en revanche peu naturelle en français et ne communique pas clairement le rapport de possession subi par l’homme. Une reformulation explicite mais contextuellement justifiée améliore nettement la lisibilité.
  terminology: « L’homme possédé par des démons » rend correctement δαιμονιζόμενον dans son contexte, sans réduire l’affliction à une catégorie médicale. « Sain d’esprit » convient à σωφρονοῦντα. La majuscule à « Légion » dans le texte, avec note pour la minuscule descriptive, rend plus clairement l’auto-désignation antérieure sans trancher une question théologique.
  issues:
  - severity: medium
    issue: « celui qui avait eu la légion »
    rationale: Bien que proche de la forme d’ἔχω, cette expression n’est pas idiomatique et peut évoquer le commandement ou la possession d’une unité militaire. Le contexte immédiat autorise à expliciter qu’il s’agit de la Légion qui le possédait, tout en conservant l’identification rétrospective marquée par le parfait ἐσχηκότα.
  revised_text: Ils viennent auprès de Jésus et voient l’homme possédé par des démons, assis, habillé et sain d’esprit — celui qui avait été possédé par la Légion[a] —, et ils prennent peur.
  revised_footnotes:
  - marker: a
    text: Ou « la légion ». Le terme peut être compris comme une désignation descriptive plutôt que comme un nom, puisqu’il reprend la manière dont les démons se sont désignés plus haut.
    reason: alternative_reading
  revision_rationale: La révision remplace une tournure française ambiguë et lourde par « qui avait été possédé par la Légion ». Cette formulation exprime clairement, à la lumière du contexte, le lien entre l’homme et la multitude démoniaque, tout en gardant le caractère rétrospectif de l’identification. La note conserve l’ambiguïté légitime entre nom et désignation descriptive.
