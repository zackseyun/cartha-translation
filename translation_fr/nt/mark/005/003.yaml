source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: fr
  text: Il habitait parmi les tombeaux[a], et personne ne pouvait plus l’attacher, pas même avec une chaîne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans les tombeaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: habitait
  rationale: L’expression grecque signifie idiomatiquement qu’il avait là son lieu d’habitation. « Habitait » est naturel en français moderne et conserve la valeur durative de l’imparfait.
- source_word: ἐν τοῖς μνήμασιν
  choice: parmi les tombeaux
  rationale: μνῆμα désigne un tombeau ou lieu funéraire. « Parmi les tombeaux » convient naturellement au cadre et évite de préciser qu’il se trouvait constamment à l’intérieur de ceux-ci.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Cette tournure française rend directement l’idée de cessation exprimée par οὐκέτι.
- source_word: οὐδὲ ἁλύσει
  choice: pas même avec une chaîne
  rationale: « Pas même » restitue l’intensification de οὐδέ, et le singulier « une chaîne » correspond au singulier grec ἁλύσει.
- source_word: ἐδύνατο… δῆσαι
  choice: pouvait… l’attacher
  rationale: « Pouvait » rend naturellement l’imparfait de δύναμαι. Dans ce contexte de contrainte physique, « attacher » est plus courant en français que « lier » tout en gardant le sens concret de δέω.
