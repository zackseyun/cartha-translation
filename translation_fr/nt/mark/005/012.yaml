source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: fr
  text: 'Ils le[a] supplièrent : « Envoie-nous dans les cochons[b], afin que nous entrions en eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ajoutent « tous les démons ».
    reason: textual_variant
  - marker: b
    text: Ou « les porcs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: supplièrent
  rationale: Dans ce contexte, παρακαλέω exprime une demande pressante adressée à Jésus. « Supplièrent » rend cette intensité dans un français naturel et digne.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom objet renvoie à Jésus.
- source_word: λέγοντες
  choice: en disant
  rationale: Cette tournure conserve le participe grec qui introduit les paroles rapportées, tout en restant idiomatique en français.
- source_word: Πέμψον ἡμᾶς
  choice: Envoie-nous
  rationale: Le verbe πέμπω signifie explicitement « envoyer ». Le contexte implique une autorisation, mais la traduction maintient l’image précise du texte sans la paraphraser.
- source_word: εἰς τοὺς χοίρους
  choice: dans les cochons
  rationale: χοῖρος désigne le cochon ou le porc. « Cochons » est le terme courant et naturel ici, tandis que « porcs » serait également possible.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit le but recherché et « afin que » exprime clairement ce rapport.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: nous entrions en eux
  rationale: La formulation conserve le verbe εἰσέρχομαι et son mouvement d’entrée dans les animaux, sans expliciter davantage la nature de cette entrée.
theological_decisions:
- issue: Nature de la demande adressée à Jésus
  choice: Les interlocuteurs supplient Jésus de les envoyer dans les cochons.
  alternative: Présenter leurs paroles comme une simple demande de déplacement ou paraphraser « Envoie-nous » par « Permets-nous d’aller ».
  rationale: « Supplièrent » et « Envoie-nous » reflètent leur dépendance à l’égard de l’autorité de Jésus dans le récit, sans ajouter d’affirmation doctrinale au texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La structure « en disant » garde la forme participiale du grec; « cochons » privilégie l’usage courant. La note rend compte de la variante signalée dans la source grecque plutôt que de reprendre la note anglaise, dont le marqueur et le contenu ne correspondent pas.
