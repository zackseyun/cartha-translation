- from: Mais la femme, saisie de peur et toute tremblante, sachant ce qui lui était arrivé, vint se jeter à ses pieds[a] et lui dit toute la vérité.
  to: Mais la femme, effrayée et tremblante, sachant ce qui lui était arrivé, vint et tomba devant lui[a], puis lui dit toute la vérité.
