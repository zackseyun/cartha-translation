review_pass:
  verdict: revise
  source_fidelity: La proposition principale suit fidèlement la séquence grecque. Toutefois, « se jeter à ses pieds » explicite les « pieds », absents de προσέπεσεν αὐτῷ, et donne au geste une formulation légèrement plus interprétative. « Tomber devant lui » rend directement le verbe et le datif sans préciser la posture.
  naturalness: Le français est globalement naturel et d’un registre narratif approprié. « Effrayée et tremblante » est une formulation moderne, sobre et fidèle, sans l’intensification supplémentaire de « toute tremblante ». La coordination « vint et tomba » reproduit clairement les deux aoristes.
  terminology: Aucun enjeu terminologique théologique ne nécessite d’interprétation. « Tomber devant lui » conserve l’ambiguïté du geste, qui peut relever de la crainte, de la supplication ou de la révérence.
  issues:
  - severity: low
    issue: « se jeter à ses pieds » précise un élément corporel non explicité par le grec.
    rationale: προσέπεσεν αὐτῷ signifie littéralement qu’elle tomba devant/lui; le contexte peut suggérer les pieds, mais le texte ne les nomme pas. Une formulation moins spécifiée préserve mieux l’expression source et son ambiguïté.
  - severity: low
    issue: « toute tremblante » ajoute une intensification absente du participe τρέμουσα.
    rationale: Le grec indique qu’elle tremblait, sans marqueur lexical équivalant à « toute ». « Tremblante » conserve l’intensité narrative sans ajout.
  revised_text: Mais la femme, effrayée et tremblante, sachant ce qui lui était arrivé, vint et tomba devant lui[a], puis lui dit toute la vérité.
  revised_footnotes:
