source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: fr
  text: Mais la femme, effrayée et tremblante, sachant ce qui lui était arrivé, vint et tomba devant lui[a], puis lui dit toute la vérité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se jeta à ses pieds » ou « se prosterna devant lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste et la progression du récit après la question de Jésus.
- source_word: ἡ γυνὴ
  choice: la femme
  rationale: L’article renvoie à la femme déjà présentée dans le récit.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: saisie de peur et toute tremblante
  rationale: Rend naturellement en français moderne les deux participes et conserve l’intensité de son état émotionnel.
- source_word: εἰδυῖα ὃ γέγονεν αὐτῇ
  choice: sachant ce qui lui était arrivé
  rationale: Préserve la relation circonstancielle du participe sans la rendre explicitement causale; le plus-que-parfait situe l’événement avant sa venue.
- source_word: ἦλθεν
  choice: vint
  rationale: Correspond au mouvement simple exprimé par l’aoriste dans un récit au passé.
- source_word: προσέπεσεν αὐτῷ
  choice: se jeter à ses pieds
  rationale: Expression française naturelle pour l’action de tomber devant quelqu’un; elle indique une posture d’abaissement sans affirmer à elle seule un acte cultuel.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: lui dit toute la vérité
  rationale: Formulation idiomatique qui conserve l’accent de πᾶσαν sur le caractère complet de son aveu.
theological_decisions:
- issue: Portée de προσέπεσεν αὐτῷ devant Jésus
  choice: se jeter à ses pieds
  alternative: tomber devant lui; se prosterner devant lui
  rationale: Le verbe décrit une chute devant Jésus pouvant exprimer crainte, supplication ou révérence. La traduction conserve le geste sans décider qu’il s’agit formellement d’adoration.
translation_notes:
  register: Français international moderne, narratif et digne. « Saisie de peur et toute tremblante » évite le tour peu naturel « craignant et tremblante ». Le passé simple maintient le registre biblique soutenu sans archaïsme lexical.
