id: MRK.5.21
reference: Mark 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: fr
  text: Après que Jésus eut de nouveau traversé dans la barque jusqu’à l’autre rive, une grande foule se rassembla autour de lui. Il était au bord de la mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de la mer de Galilée, un lac que les Évangiles appellent habituellement « mer ».
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Après que Jésus eut… traversé
  rationale: Le participe aoriste au génitif absolu présente la traversée comme antérieure au rassemblement de la foule. Cette tournure française conserve clairement cette succession temporelle.
- source_word: ἐν τῷ πλοίῳ
  choice: dans la barque
  rationale: La préposition est rendue explicitement. « Barque » convient au cadre narratif et au français biblique moderne sans suggérer un grand navire.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression naturelle marque la répétition indiquée par l’adverbe grec.
- source_word: εἰς τὸ πέραν
  choice: jusqu’à l’autre rive
  rationale: Dans le contexte d’une traversée du lac, l’expression désigne la rive opposée. « Jusqu’à » rend le mouvement vers sa destination.
- source_word: συνήχθη
  choice: se rassembla
  rationale: Bien que la forme grecque soit passive, le français exprime naturellement l’événement par un verbe pronominal, sans devoir préciser un agent.
- source_word: ὄχλος πολὺς
  choice: une grande foule
  rationale: Équivalent français courant qui exprime nettement le nombre.
- source_word: ἐπ’ αὐτόν
  choice: autour de lui
  rationale: Avec le verbe « rassembler », cette formulation rend naturellement la convergence spatiale de la foule vers Jésus.
- source_word: παρὰ τὴν θάλασσαν
  choice: au bord de la mer
  rationale: Cette expression idiomatique rend la situation de Jésus près du rivage.
- source_word: θάλασσαν
  choice: mer
  rationale: Le texte principal conserve le terme grec usuel, tandis qu’une note précise qu’il s’agit géographiquement d’un lac.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour éviter une coordination lourde, tout en préservant l’ordre narratif et le lien spatial avec la mer.
