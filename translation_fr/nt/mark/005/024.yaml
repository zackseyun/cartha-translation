source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: fr
  text: Il partit avec lui. Une foule nombreuse le suivait et le serrait de toutes parts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se pressait contre lui » ou « se pressait autour de lui ». Le verbe grec évoque la pression physique de la foule qui se resserre sur Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: partit
  rationale: L’aoriste décrit le déplacement de Jésus en réponse à Jaïros. « Partit » est naturel en français narratif et n’implique pas qu’il l’abandonne.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: μετά suivi du génitif exprime ici l’accompagnement; « avec lui » en donne le sens direct et idiomatique.
- source_word: ἠκολούθει
  choice: suivait
  rationale: L’imparfait grec présente une action en cours; l’imparfait français « suivait » conserve naturellement cet aspect.
- source_word: ὄχλος πολύς
  choice: une foule nombreuse
  rationale: Cette formulation rend clairement l’importance numérique de la foule dans un registre français courant et digne.
- source_word: συνέθλιβον
  choice: le serrait de toutes parts
  rationale: Le verbe évoque une forte pression physique exercée collectivement autour de Jésus. Cette expression conserve cette force sans suggérer nécessairement qu’il est blessé.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom désigne Jésus comme celui que la foule serre; le pronom objet français maintient cette référence sans répétition lourde.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les imparfaits rendent les actions en cours de la foule, tandis que le passé simple marque le déplacement initial de Jésus. Le pronom « Il » conserve la forme du grec et suppose, comme le texte source, le contexte immédiat pour identifier Jésus.
