id: MRK.5.20
reference: Mark 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: fr
  text: Il s’en alla et se mit à proclamer dans la Décapole tout ce que Jésus avait fait pour lui[a], et tous étaient étonnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « combien Jésus avait fait pour lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: Exprime naturellement en français moderne le départ hors de la scène, sans la solennité de « partit » ou « se retira ».
- source_word: ἤρξατο κηρύσσειν
  choice: se mit à proclamer
  rationale: Rend la valeur ingressive de ἤρξατο avec l’infinitif. « Proclamer » convient à un témoignage public sans suggérer nécessairement une prédication formelle.
- source_word: ἐν τῇ Δεκαπόλει
  choice: dans la Décapole
  rationale: Rend directement ἐν et conserve le nom historique de la région des dix villes.
- source_word: ὅσα
  choice: tout ce que
  rationale: Rend l’ensemble des actes désigné par le relatif grec. La nuance quantitative possible est signalée en note afin de préserver l’ambiguïté lexicale.
- source_word: ἐποίησεν αὐτῷ
  choice: avait fait pour lui
  rationale: Le plus-que-parfait situe naturellement l’action de Jésus avant la proclamation; « pour lui » exprime ici la valeur bénéficiaire du datif.
- source_word: πάντες
  choice: tous
  rationale: Conserve de près la portée collective du grec sans ajouter explicitement « les gens ».
- source_word: ἐθαύμαζον
  choice: étaient dans l’étonnement
  rationale: L’imparfait préserve l’aspect duratif ou répété; cette formulation actuelle et digne évite le sens parfois négatif de « stupéfaits ».
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Suit la forme française conventionnelle du nom propre.
theological_decisions:
- issue: Portée de la proclamation de l’homme par rapport à l’identité de Jésus
  choice: Rapporter simplement qu’il proclame ce que Jésus a fait pour lui
  alternative: Ajouter une formulation explicitant l’autorité divine de Jésus
  rationale: Le récit manifeste la puissance extraordinaire de Jésus, mais le verset ne formule pas lui-même de conclusion doctrinale; la traduction n’en ajoute donc aucune.
translation_notes:
  register: Français international moderne, naturel et digne. « Décapole » conserve le toponyme historique; « se mit à proclamer » reste accessible tout en reflétant la construction grecque.
