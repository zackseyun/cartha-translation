    issue: La coordination de ἔδραμεν καὶ προσεκύνησεν n’est pas explicitement rendue.
    rationale: 'Dans « il courut se prosterner », l’infinitif peut exprimer un but en français. Le grec coordonne deux verbes finis : il courut, puis se prosterna. Ajouter « et » préserve plus précisément cette structure narrative.'
  revised_text: Et voyant Jésus de loin, il courut et se prosterna devant lui[a].
