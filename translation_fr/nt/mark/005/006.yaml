  verdict: revise
  source_fidelity: Le texte rend correctement la vision de Jésus à distance, la course et l’acte de προσκυνέω. Toutefois, « il courut se prosterner » peut suggérer en français une course faite dans le but de se prosterner, plutôt que les deux actions successives coordonnées par καί. « il courut et se prosterna » reproduit plus nettement la coordination narrative grecque sans surinterpréter le geste.
  naturalness: « Et voyant Jésus de loin » est naturel dans un registre biblique moderne et clair. La formulation révisée « il courut et se prosterna devant lui » est plus idiomatique pour deux actions successives et conserve la concision du verset.
  terminology: « Se prosterna devant lui » rend bien l’acte visible associé à προσκυνέω sans décider entre adoration et hommage. La note conserve utilement les possibilités « l’adorer » et « lui rendre hommage ».
