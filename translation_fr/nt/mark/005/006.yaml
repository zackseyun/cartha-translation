  to: Et voyant Jésus de loin, il courut et se prosterna devant lui[a].
  rationale: La révision explicite les deux actions coordonnées du grec (« il courut et se prosterna ») tout en maintenant l’ambiguïté légitime de προσκυνέω dans le texte principal et dans la note.
