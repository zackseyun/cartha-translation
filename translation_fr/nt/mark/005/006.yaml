source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: fr
  text: Et voyant Jésus de loin, il courut et se prosterna devant lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adorer » ou « lui rendre hommage ». Le verbe grec peut désigner l’adoration ou un geste de prosternation et d’hommage, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδὼν
  choice: Et voyant
  rationale: Le participe aoriste est conservé sous forme participiale afin de respecter l’enchaînement et le rythme narratif de Marc, sans préciser davantage si l’action signifie « quand il vit » ou « après avoir vu ».
- source_word: ἀπὸ μακρόθεν
  choice: de loin
  rationale: Expression française naturelle et actuelle qui rend clairement la distance spatiale.
- source_word: ἔδραμεν
  choice: il courut
  rationale: Rend directement l’aoriste de τρέχω sans ajouter l’intensité que comporterait « il se précipita ».
- source_word: προσεκύνησεν αὐτόν
  choice: se prosterner devant lui
  rationale: Le verbe προσκυνέω peut désigner la prosternation, l’hommage ou l’adoration. « Se prosterner devant lui » exprime l’acte visible sans trancher à lui seul sa portée religieuse.
- source_word: τὸν Ἰησοῦν
  choice: Jésus
  rationale: Le nom propre est rendu sans article, conformément à l’usage normal du français.
theological_decisions:
- issue: Faut-il rendre προσεκύνησεν comme un acte explicite d’adoration envers Jésus ?
  choice: « se prosterner devant lui » dans le texte principal
  alternative: « l’adora » ou « lui rendit hommage »
  rationale: Le grec permet aussi bien, selon le contexte, l’idée d’adoration que celle de prosternation ou d’hommage. Le texte principal préserve cette tension sans imposer une interprétation théologique plus précise que la formulation source.
translation_notes:
  register: Français international moderne, clair et digne. La tournure participiale conserve la progression serrée du grec, tandis que « se prosterner devant » reste naturelle et maintient l’ambiguïté lexicale du verbe.
