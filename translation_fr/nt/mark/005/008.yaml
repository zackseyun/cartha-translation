  source_fidelity: Le texte rend fidèlement ἔλεγεν γὰρ αὐτῷ par « Car il lui disait », en conservant à la fois la valeur imperfective et l’ambiguïté narrative du pronom. L’impératif Ἔξελθε et le complément ἐκ τοῦ ἀνθρώπου sont correctement rendus par « Sors de cet homme ». « esprit impur » restitue précisément πνεῦμα τὸ ἀκάθαρτον comme apostrophe.
  naturalness: La formulation est naturelle en français international moderne, avec un registre narratif sobre et approprié. « Car » est un peu soutenu mais demeure pleinement idiomatique dans une traduction biblique et préserve bien la liaison explicative. L’apostrophe sans article, « esprit impur », est fluide en français.
