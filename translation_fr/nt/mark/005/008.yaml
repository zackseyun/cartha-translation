  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: fr
  text: 'Car il lui disait : « Sors de cet homme, esprit impur ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec présente la parole comme une action en cours ou répétée dans le cadre narratif. L’imparfait français « disait » conserve naturellement cette valeur.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de ce qui précède. « Car » en conserve clairement la fonction sans préciser davantage le lien logique.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif masculin singulier renvoie, dans le cadre narratif, à l’homme, tandis que l’ordre vise l’esprit impur qui est en lui. « Lui » respecte cette formulation sans résoudre artificiellement cette tension.
- source_word: Ἔξελθε
  choice: Sors
  rationale: L’impératif aoriste exprime un ordre direct de sortir. « Sors » est la formulation française idiomatique dans ce contexte.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: esprit impur
  rationale: Bien que la construction grecque porte l’article et soit formellement au nominatif, elle fonctionne ici comme une apostrophe après l’impératif. Le français naturel emploie « esprit impur » sans article.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: de cet homme
  rationale: ἐκ indique le mouvement hors de l’intérieur, rendu naturellement par « sortir de ». Dans ce contexte narratif, « cet homme » désigne clairement l’individu présent et évite la tournure moins idiomatique « de l’homme ».
theological_decisions:
- issue: Traduction de πνεῦμα ἀκάθαρτον dans le contexte d’un exorcisme
  choice: esprit impur
  alternative: esprit mauvais
  rationale: Le grec dit explicitement « esprit impur », expression caractéristique des Évangiles qui conserve les connotations d’impureté. « Esprit mauvais » serait une interprétation plus générale.
- issue: Référent immédiat de αὐτῷ et destinataire de l’ordre
  choice: « il lui disait », puis apostrophe explicite à l’esprit impur
  alternative: « il disait à l’esprit impur »
  rationale: Le texte grec laisse le pronom masculin dans le cadre narratif tout en formulant l’ordre à l’adresse de l’esprit. La traduction conserve cette articulation et n’explicite pas un référent que le pronom seul ne nomme pas.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le connecteur « Car » garde la relation explicative avec le verset précédent; l’imparfait maintient l’arrière-plan narratif. L’apostrophe « esprit impur » est rendue sans article conformément à l’usage français.
