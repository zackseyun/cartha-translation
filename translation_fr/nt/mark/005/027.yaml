id: MRK.5.27
reference: Mark 5:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: fr
  text: Après avoir entendu parler de Jésus, elle s’approcha par-derrière au milieu de la foule et toucha son vêtement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son manteau » ou « ses vêtements ». Le grec ἱμάτιον désigne assez largement un vêtement, souvent un vêtement extérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα περὶ τοῦ Ἰησοῦ
  choice: Après avoir entendu parler de Jésus
  rationale: Le participe aoriste féminin marque une action antérieure à l’action principale. Cette tournure française conserve la séquence temporelle, tandis que « entendre parler de » rend naturellement περί avec le génitif.
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: elle s’approcha par-derrière au milieu de la foule
  rationale: Le second participe décrit le mouvement qui mène à l’action principale. « S’approcha » explicite naturellement le mouvement vers Jésus; « par-derrière » préserve la position indiquée par ὄπισθεν, et « au milieu de la foule » rend le cadre de l’action.
- source_word: ἥψατο
  choice: toucha
  rationale: Dans ce contexte, le moyen aoriste de ἅπτω désigne le fait de toucher; cette traduction n’ajoute ni prise ferme ni durée.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: son vêtement
  rationale: ἱμάτιον peut désigner de façon assez large un vêtement, souvent le vêtement extérieur. Le singulier « son vêtement » reste précis sans imposer un type particulier d’habit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La construction participiale grecque est rendue par une subordonnée infinitive temporelle puis un verbe conjugué, afin d’assurer une lecture naturelle sans perdre l’ordre des actions.
