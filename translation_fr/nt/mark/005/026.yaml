id: MRK.5.26
reference: Mark 5:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: fr
  text: Elle avait beaucoup souffert aux mains de nombreux médecins[a] et avait dépensé tout ce qu’elle possédait[b], sans en avoir retiré le moindre bénéfice ; au contraire, son état avait empiré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la part de nombreux médecins » ou « sous les soins de nombreux médecins ». Le grec peut mettre l’accent soit sur l’action des médecins, soit sur le fait qu’elle subissait leurs traitements.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toutes les choses venant d’elle », c’est-à-dire tout ce qui était à sa disposition, tout ce qu’elle avait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: avait beaucoup souffert
  rationale: Le plus-que-parfait français exprime naturellement cette circonstance antérieure dans la chaîne narrative, tout en conservant la force expérientielle de πάσχω.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: du fait de nombreux médecins
  rationale: La tournure maintient l’idée d’agence ou de cause portée par ὑπό avec le génitif, sans préciser au-delà du grec si la souffrance venait des médecins eux-mêmes ou de leurs traitements.
- source_word: δαπανήσασα
  choice: avait dépensé
  rationale: Le verbe rend simplement l’acte de dépenser et le plus-que-parfait marque son antériorité, sans ajouter l’idée plus forte d’épuisement.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: tout ce qu’elle possédait
  rationale: Formulation française naturelle pour désigner la totalité de ses ressources ou de ses biens disponibles.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: sans en retirer aucun bienfait
  rationale: 'Cette formulation rend la valeur passive de ὠφελέω : les soins ne lui avaient procuré aucun avantage.'
- source_word: ἀλλὰ μᾶλλον
  choice: au contraire
  rationale: 'La locution marque nettement l’opposition renforcée : non seulement aucun bienfait, mais une évolution inverse.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: son état avait empiré
  rationale: Expression idiomatique et précise du passage à une condition pire, avec explicitation minimale du sujet implicite de l’aggravation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La coordination participiale grecque est rendue par des plus-que-parfaits et une progression claire. La formulation évite de surinterpréter la responsabilité morale des médecins.
