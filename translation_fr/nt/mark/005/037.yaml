  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: fr
  text: Et il ne permit à personne de l’accompagner, sauf à Pierre, Jacques et Jean, le frère de Jacques.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: permit
  rationale: Avec l’infinitif, ἀφίημι exprime ici la permission. « Permit » est naturel et indique que Jésus n’autorisa pas les autres à venir avec lui.
- source_word: οὐδένα
  choice: à personne
  rationale: Après la négation « ne », « à personne » rend l’exclusion totale exprimée par οὐδένα et convient à la construction française de « permettre à quelqu’un de ».
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: de l’accompagner
  rationale: Le verbe composé exprime le fait de suivre ou d’aller avec quelqu’un; « l’accompagner » restitue naturellement l’ensemble de l’expression sans redondance.
- source_word: εἰ μὴ
  choice: sauf
  rationale: εἰ μή introduit ici une exception et non une condition; « sauf » est l’équivalent français le plus direct.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pierre, Jacques et Jean
  rationale: Les formes françaises usuelles des noms bibliques sont retenues. L’énumération française avec virgules est naturelle tout en conservant chacun des trois noms.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: le frère de Jacques
  rationale: Cette apposition identifie Jean de manière transparente et reste proche de la structure grecque.
