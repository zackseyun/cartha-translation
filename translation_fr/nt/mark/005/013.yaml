source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: fr
  text: Et il le leur permit. Alors les esprits impurs sortirent et entrèrent dans les porcs. Le troupeau — environ deux mille bêtes — se précipita le long de l’escarpement[a] dans la mer[b], et les porcs se noyèrent dans la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le long de la pente raide » ou « le long du précipice » ; le terme grec peut désigner une pente abrupte, un escarpement ou un précipice.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la mer ». Il s’agit de la mer de Galilée.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: il le leur permit
  rationale: ἐπιτρέπω signifie « permettre, autoriser ». Le pronom « le » reprend naturellement en français la demande formulée dans le contexte, sans l’expliciter davantage que le grec.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: les esprits impurs
  rationale: Cette formulation conserve le langage personnel et spirituel du grec. « Impurs » est naturel en français biblique moderne et garde les connotations religieuses et morales de ἀκάθαρτος.
- source_word: ἐξελθόντα ... εἰσῆλθον
  choice: sortirent alors et entrèrent
  rationale: Le participe aoriste suivi du verbe principal marque ici la succession des actions. La coordination française rend clairement cette progression narrative.
- source_word: τοὺς χοίρους
  choice: les porcs
  rationale: « Porcs » est précis, courant et digne en français moderne; il évite le registre parfois péjoratif de « cochons ».
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: le troupeau ... se précipita
  rationale: Le verbe exprime un mouvement soudain et violent. L’accord au singulier respecte le sujet collectif grec et demeure naturel en français.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: du haut de l’escarpement
  rationale: κρημνός peut désigner une pente très raide, un escarpement ou un précipice. « Escarpement » transmet le relief dangereux sans imposer l’idée d’une paroi strictement verticale.
- source_word: εἰς τὴν θάλασσαν
  choice: dans la mer
  rationale: Le grec dit littéralement « la mer ». Cette désignation est conservée, tandis qu’une note identifie le plan d’eau comme la mer de Galilée.
- source_word: ὡς δισχίλιοι
  choice: qui comptait environ deux mille bêtes
  rationale: ὡς devant un nombre exprime l’approximation. « Bêtes » précise naturellement que le nombre porte sur les porcs, sans répéter lourdement le nom.
- source_word: ἐπνίγοντο
  choice: se noyèrent
  rationale: L’imparfait grec décrit le processus ou la scène en cours, mais, dans ce récit, le français idiomatique emploie naturellement le passé simple pour exprimer l’issue fatale. La forme pronominale évite de suggérer un agent qui les aurait noyés.
theological_decisions:
- issue: Référent de αὐτοῖς (« leur »)
  choice: Le pronom renvoie aux esprits impurs qui viennent de demander une permission.
  alternative: Expliciter par « aux esprits impurs » ou « aux démons ».
  rationale: Le contexte immédiat établit le référent. Garder le pronom préserve la concision du grec et n’ajoute aucune précision doctrinale.
- issue: Nature des « esprits impurs »
  choice: Conserver le langage personnel et spirituel du texte.
  alternative: Traduire par une expression impersonnelle telle que « forces mauvaises ».
  rationale: Le récit présente ces πνεύματα comme des êtres qui demandent, sortent et entrent. « Esprits » respecte cette représentation sans développer une démonologie étrangère au verset.
- issue: Sujet implicite de ἐπνίγοντο
  choice: Rendre explicitement le pluriel par « les porcs se noyèrent ».
  alternative: Employer « il se noya » avec « le troupeau » comme sujet collectif.
  rationale: Le pluriel grec reprend naturellement les quelque deux mille porcs. L’explicitation française évite un pronom pluriel ambigu après le nom collectif singulier « troupeau ».
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit. « Porcs » a été préféré à « cochons », et « esprits impurs » conserve une formulation biblique claire sans archaïsme marqué. Les deux appels de note sont placés exactement sur les expressions qu’ils expliquent.
