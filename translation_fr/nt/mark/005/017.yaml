  text: And they began to beg him to leave their region[a].
translation:
  language: fr
  text: Et ils se mirent à le supplier de quitter leur territoire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple et explicite du grec avec ce qui précède.
- source_word: ἤρξαντο
  choice: se mirent à
  rationale: Rend naturellement en français la valeur ingressive de ἄρχομαι suivi de l’infinitif.
- source_word: παρακαλεῖν
  choice: supplier
  rationale: Dans ce contexte, le verbe exprime une demande pressante; « supplier » en restitue l’intensité sans ajouter de motif.
- source_word: αὐτὸν
  choice: le
  rationale: Pronom objet renvoyant à Jésus, clairement identifié par le contexte.
- source_word: ἀπελθεῖν
  choice: quitter
  rationale: Exprime idiomatiquement le départ demandé, en lien direct avec le lieu mentionné ensuite.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: leur territoire
  rationale: Le pluriel ὅρια désigne littéralement les limites, mais par métonymie le territoire qu’elles délimitent; « leur territoire » est précis et naturel.
