source:
  edition: SBLGNT
  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: fr
  text: 'Ses disciples lui disaient : « Tu vois la foule qui te presse, et tu demandes : “Qui m’a touché ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente la parole comme en cours ou répétée; l’imparfait français la restitue naturellement.
- source_word: μαθηταὶ
  choice: disciples
  rationale: Terme français courant et précis pour désigner ceux qui suivent Jésus et reçoivent son enseignement.
- source_word: Βλέπεις
  choice: Tu vois
  rationale: Rend directement le présent de l’indicatif et l’appel des disciples à une réalité évidente.
- source_word: ὄχλον
  choice: la foule
  rationale: Équivalent moderne, naturel et adapté à la scène narrative.
- source_word: συνθλίβοντά
  choice: qui te presse de toutes parts
  rationale: Exprime la forte compression physique exercée par la foule autour de Jésus, sans suggérer qu’elle l’écrase réellement.
- source_word: λέγεις
  choice: tu demandes
  rationale: Dans ce contexte, Jésus prononce une question; « tu demandes » est plus idiomatique en français que le calque « tu dis » tout en conservant la force incrédule de la réplique.
- source_word: Τίς μου ἥψατο
  choice: Qui m’a touché ?
  rationale: Rend simplement l’acte ponctuel visé par l’aoriste; le génitif μου avec ἅπτομαι devient naturellement le complément direct « m’ » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le tutoiement correspond aux échanges habituels entre Jésus et ses disciples. La ponctuation distingue clairement la citation de la question antérieure de Jésus.
