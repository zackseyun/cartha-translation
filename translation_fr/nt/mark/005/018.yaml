source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: fr
  text: Comme il montait dans le bateau, l’homme qui avait été possédé par des démons le suppliait avec insistance de pouvoir être avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Comme il montait
  rationale: Le participe présent au génitif absolu exprime une action en cours, contemporaine de la supplication. « Comme il montait » restitue naturellement cette nuance temporelle.
- source_word: πλοῖον
  choice: bateau
  rationale: Dans le contexte du lac de Galilée, « bateau » est le terme courant et adéquat en français moderne.
- source_word: παρεκάλει
  choice: le suppliait avec insistance
  rationale: L’imparfait marque ici une action prolongée ou répétée, tandis que « suppliait » rend l’intensité de la demande.
- source_word: ὁ δαιμονισθείς
  choice: l’homme qui avait été sous l’emprise de démons
  rationale: Le participe substantivé désigne l’homme précédemment délivré. Cette formulation indique une domination démoniaque réelle sans suggérer qu’elle persiste après sa délivrance.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: de pouvoir rester avec lui
  rationale: La proposition introduite par ἵνα donne le contenu de la demande. « Rester avec lui » conserve la dimension personnelle de μετ’ αὐτοῦ et convient au contexte où Jésus s’apprête à partir.
theological_decisions:
- issue: Rendre δαιμονισθείς sans réduire l’affliction à une catégorie clinique ou métaphorique
  choice: avait été sous l’emprise de démons
  alternative: avait été possédé par des démons
  rationale: La formulation retenue exprime clairement la domination réelle exercée par les démons, tout en évitant certaines connotations absolues que « possédé » peut prendre en français courant. Le plus-que-parfait tient compte de la délivrance déjà accomplie.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du déroulement grec tout en évitant une tournure artificielle. L’imparfait et « avec insistance » rendent l’aspect duratif de la supplication.
