  text: And he kept looking around to see the one who had done this[a].
translation:
  language: fr
  text: Et il regardait autour de lui pour voir celle qui avait fait cela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple qui maintient la continuité du récit sans lui ajouter une valeur de conséquence.
- source_word: περιεβλέπετο
  choice: il regardait autour de lui
  rationale: L’imparfait grec présente une action en cours; cette formulation française exprime naturellement le regard porté tout autour.
- source_word: ἰδεῖν
  choice: pour voir
  rationale: L’infinitif exprime ici le but du regard; «pour voir» reste direct et naturel.
- source_word: τὴν … ποιήσασαν
  choice: celle qui avait fait
  rationale: L’article et le participe sont au féminin singulier. «Celle qui» conserve cette indication grammaticale sans ajouter le nom «femme», absent du grec.
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à l’acte mentionné dans le contexte immédiat; «cela» convient au registre narratif.
