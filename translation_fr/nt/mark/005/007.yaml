id: MRK.5.7
reference: Mark 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: fr
  text: 'Il crie d’une voix forte et dit : « Qu’y a-t-il entre toi et moi[a], Jésus, Fils du Dieu Très-Haut ? Je t’adjure par Dieu[b] : ne me tourmente pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que me veux-tu ? » L’expression grecque marque ici la distance, le conflit ou le refus d’implication entre deux personnes.
    reason: lexical_alternative
  - marker: b
    text: Ou « Je t’en conjure au nom de Dieu » ou « Je te somme devant Dieu ». Le verbe grec désigne une demande ou une sommation solennelle liée à un serment.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: Il crie d’une voix forte
  rationale: Cette formulation restitue l’éclat puissant et urgent du cri, tout en restant naturelle en français. Le participe aoriste est intégré à la narration sans alourdir la phrase.
- source_word: λέγει
  choice: et dit
  rationale: Le présent de narration propre au style vivant de Marc est conservé en français.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Qu’y a-t-il entre toi et moi
  rationale: Cette tournure française conserve la forme relationnelle de l’idiome grec et exprime la prise de distance ou l’hostilité sans en fixer trop étroitement la nuance.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Fils du Dieu Très-Haut
  rationale: Cette traduction conserve explicitement le titre filial de Jésus et l’épithète divine « Très-Haut » dans un ordre naturel en français.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Je t’adjure par Dieu
  rationale: Le verbe « adjurer » préserve la force solennelle, proche du serment, du grec ὁρκίζω, ainsi que la tension créée par l’invocation de Dieu dans la bouche de l’esprit impur.
- source_word: μή με βασανίσῃς
  choice: ne me tourmente pas
  rationale: « Tourmenter » rend l’intensité de βασανίζω sans préciser indûment la nature du supplice.
theological_decisions:
- issue: La reconnaissance de l’identité de Jésus par l’esprit impur
  choice: Fils du Dieu Très-Haut
  alternative: Fils de Dieu, le Très-Haut
  rationale: Le texte maintient pleinement la déclaration christologique prononcée par l’esprit impur, sans l’atténuer ni lui ajouter une formulation doctrinale ultérieure.
- issue: La force de l’appel solennel adressé à Jésus
  choice: Je t’adjure par Dieu
  alternative: Je t’en conjure au nom de Dieu
  rationale: '« Adjure » conserve la dimension de serment ou de sommation solennelle et laisse intacte la tension du passage : l’esprit impur invoque Dieu en s’adressant à Jésus.'
translation_notes:
  register: Français moderne, digne et accessible. Le présent de narration conserve la vivacité caractéristique de Marc. « Adjure » est volontairement soutenu afin de rendre la solennité inhabituelle de la formule grecque; la note fournit des équivalents plus courants.
