  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: fr
  text: Il y avait là, près de la montagne[a], un grand troupeau de porcs[b] en train de se nourrir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à côté de la montagne ». L’expression grecque indique un emplacement proche de la montagne.
    reason: lexical_alternative
  - marker: b
    text: Ou « cochons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: Il y avait
  rationale: ἦν exprime ici l’existence; δέ est une liaison narrative légère que le français peut naturellement laisser implicite sans introduire une opposition indue.
- source_word: ἐκεῖ
  choice: là
  rationale: Adverbe locatif direct et naturel en français.
- source_word: πρὸς τῷ ὄρει
  choice: près de la montagne
  rationale: Avec le datif, πρός indique ici la proximité ou une position attenante; «près de» reste naturel sans préciser excessivement l’emplacement.
- source_word: ἀγέλη
  choice: troupeau
  rationale: Terme français courant pour un groupe d’animaux de cette sorte.
- source_word: χοίρων
  choice: de porcs
  rationale: «Porcs» est précis, actuel et digne; «cochons» est également possible, mais plus familier dans certains contextes.
- source_word: μεγάλη
  choice: grand
  rationale: Qualifie naturellement l’importance numérique ou la taille du troupeau.
- source_word: βοσκομένη
  choice: qui se nourrissaient
  rationale: Le participe présent décrit les animaux en train de paître ou de manger; cette formulation conserve le sens large sans imposer qu’ils broutaient uniquement de l’herbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La liaison δέ n’est pas rendue par un connecteur explicite, conformément à son faible poids discursif ici. Les deux marqueurs de note figurent dans le texte principal.
