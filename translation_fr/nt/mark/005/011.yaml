  source_fidelity: 'Le sens essentiel est fidèlement rendu : ἦν δὲ ἐκεῖ est bien exprimé par « Il y avait là », πρὸς τῷ ὄρει par « près de la montagne », et ἀγέλη χοίρων μεγάλη par « un grand troupeau de porcs ». La note proposant « au pied de la montagne » va toutefois au-delà de la simple proximité exprimée par πρός avec datif.'
