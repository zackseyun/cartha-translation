reference: Mark 5:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: fr
  text: 'Et, prenant la main de l’enfant, il lui dit : « Talitha koum[a] », ce qui se traduit ainsi : « Petite fille, je te le dis, lève-toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La graphie traditionnelle est souvent « Talitha cum ». Des manuscrits grecs portent « κουμι » ; le texte grec retenu ici porte κουμ, d’où la transcription « koum ».
    reason: Variante de translittération et variante textuelle.
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: prenant la main de l’enfant
  rationale: Cette formulation française naturelle exprime le geste concret de saisir ou tenir la main, sans donner à κρατέω une force excessive que le contexte n’exige pas. « L’enfant » préserve ici le sens de παιδίον, avant que κοράσιον précise qu’il s’agit d’une fille.
- source_word: λέγει αὐτῇ
  choice: il lui dit
  rationale: Le présent français conserve le présent historique de Marc et sa vivacité narrative.
- source_word: Ταλιθα κουμ
  choice: Talitha koum
  rationale: L’expression araméenne conservée dans le texte grec est translittérée, puis expliquée comme le fait Marc lui-même. La graphie « koum » correspond directement à κουμ dans le SBLGNT.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: ce qui se traduit
  rationale: Cette tournure signale clairement que Marc fournit la traduction de l’expression araméenne.
- source_word: Τὸ κοράσιον
  choice: Petite fille
  rationale: κοράσιον désigne une jeune fille et comporte une nuance diminutive que « petite fille » rend naturellement dans cette adresse directe.
- source_word: σοὶ λέγω
  choice: je te le dis
  rationale: Cette formulation conserve le pronom emphatique σοὶ et l’énoncé explicite de Jésus, sans l’omettre comme redondant.
- source_word: ἔγειρε
  choice: lève-toi
  rationale: Dans ce contexte, l’impératif demande à la jeune fille de se relever. « Lève-toi » est idiomatique, direct et digne en français moderne.
theological_decisions:
- issue: Maintien des paroles araméennes de Jésus dans le texte principal
  choice: Conserver « Talitha koum », suivi de la traduction donnée par Marc.
  alternative: Ne donner que la traduction française, ou employer la graphie traditionnelle « Talitha cum » ou la forme variante « Talitha koumi ».
  rationale: Le texte source préserve lui-même l’énoncé sémitique avant de l’expliquer. Garder les deux respecte sa texture narrative sans obscurcir le sens. « Koum » suit la leçon κουμ du SBLGNT.
- issue: Portée de ἔγειρε
  choice: Traduire par « lève-toi ».
  alternative: Employer « réveille-toi » ou un terme explicitement lié à la résurrection.
  rationale: Le verbe peut ailleurs évoquer le réveil ou le relèvement, mais le contexte immédiat permet le commandement concret « lève-toi ». La traduction ne doit pas éliminer les résonances plus larges du verbe en ajoutant ici une interprétation doctrinale explicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique de Marc est maintenu. La ponctuation française encadre clairement l’expression araméenne et sa traduction.
