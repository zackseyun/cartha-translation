source:
  edition: SBLGNT
  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: fr
  text: Ils arrivent à la maison du responsable de la synagogue, et il voit une agitation, ainsi que des gens qui pleurent et se lamentent à grands cris[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un tumulte ». Le terme grec peut désigner une agitation bruyante et désordonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: ils arrivent
  rationale: Le présent historique est conservé pour maintenir la vivacité du récit. « Arrivent » exprime naturellement l’entrée sur les lieux sans imposer en français le point de vue déictique de « viennent ».
- source_word: οἶκον
  choice: maison
  rationale: « Maison » est l’équivalent direct et naturel, sans ajouter les connotations affectives possibles de « foyer ».
- source_word: ἀρχισυναγώγου
  choice: responsable de la synagogue
  rationale: Le terme désigne le dirigeant ou responsable officiel d’une synagogue. Cette formulation moderne évite l’expression vieillie « chef de synagogue » tout en préservant la fonction.
- source_word: θεωρεῖ
  choice: il voit
  rationale: Le singulier renvoie naturellement à Jésus dans le contexte. Le pronom conserve la forme du grec sans expliciter davantage que la source.
- source_word: θόρυβον
  choice: une grande agitation
  rationale: Le mot évoque ici une scène bruyante et désordonnée, et non un simple bruit. L’adjectif « grande » rend idiomatiquement en français l’intensité de la scène.
- source_word: κλαίοντας
  choice: des gens qui pleurent
  rationale: Le participe a une valeur substantivée. « Des gens qui pleurent » rend cette valeur clairement et naturellement en français.
- source_word: ἀλαλάζοντας
  choice: poussent de grands cris
  rationale: Le verbe désigne des cris forts, ici dans un contexte de deuil. Cette expression française garde l’intensité sans imposer un terme trop spécialisé.
- source_word: πολλά
  choice: de grands
  rationale: Employé adverbialement avec ἀλαλάζοντας, πολλά intensifie les cris. « Poussent de grands cris » en transmet naturellement la force.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le présent historique est maintenu. « Ainsi que » rend le second καί tout en évitant une coordination maladroite en français. Le référent de « il » demeure déterminé par le contexte, comme dans le grec.
