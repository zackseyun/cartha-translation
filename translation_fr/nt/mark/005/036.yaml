  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: fr
  text: 'Mais Jésus, ayant entendu ce qui se disait[a], dit au chef de la synagogue : « N’aie pas peur ; crois seulement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sans tenir compte de ce qui se disait » : le verbe grec peut désigner le fait d’entendre ou celui de ne pas prêter attention à des paroles.'
    reason: alternative_reading
  - marker: b
    text: Ou « continue simplement à croire » ou « fais seulement confiance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: ayant entendu
  rationale: Le participe peut signifier que Jésus a entendu, voire surpris, les paroles prononcées, ou qu’il n’en a pas tenu compte. Dans le fil du récit, sa réponse immédiate au message favorise le sens auditif ; l’autre possibilité est conservée en note.
- source_word: τὸν λόγον λαλούμενον
  choice: les paroles qui venaient d’être prononcées
  rationale: Cette formulation française naturelle renvoie au message qui vient d’être adressé à Jaïros, tout en gardant visible l’idée de paroles prononcées. Le singulier grec λόγον peut désigner ici l’ensemble du propos.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique de Marc est rendu par le présent de narration français, ce qui conserve la vivacité du récit.
- source_word: ἀρχισυναγώγῳ
  choice: au chef de la synagogue
  rationale: Ce titre désigne le responsable ou dirigeant de la synagogue. « Chef de la synagogue » est clair, actuel et fidèle à la fonction.
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Formulation idiomatique et directe en français moderne, qui conserve la force de l’impératif.
- source_word: μόνον
  choice: seulement
  rationale: L’adverbe restreint la réaction demandée par Jésus et se place naturellement après l’impératif en français.
- source_word: πίστευε
  choice: crois
  rationale: « Croire » est l’équivalent verbal le plus direct de πιστεύω. Le présent impératif peut aussi suggérer « continue à croire », tandis que « fais confiance » explicite davantage la dimension relationnelle ; ces nuances sont signalées en note.
theological_decisions:
- issue: Sens de παρακούσας
  choice: Jésus a entendu les paroles prononcées.
  alternative: Jésus n’a pas tenu compte de ce qui avait été dit.
  rationale: Les deux sens sont lexicalement possibles. La réponse immédiate de Jésus au message favorise le sens d’entendre, mais l’ambiguïté narrative authentique est préservée en note.
- issue: Portée de πιστεύω dans l’ordre de Jésus
  choice: crois
  alternative: continue à croire ; fais seulement confiance
  rationale: « Crois » reste formellement proche du grec sans déterminer excessivement la nature de la foi demandée. Les autres formulations rendent des nuances plausibles du présent impératif et de la confiance.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec et à l’adresse directe. Le présent de narration « dit » conserve le style vif de Marc ; les ambiguïtés de παρακούσας et de πιστεύω sont maintenues dans les notes.
