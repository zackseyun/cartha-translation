id: MRK.5.23
reference: Mark 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: fr
  text: 'Il le suppliait avec insistance en disant : « Ma petite fille est sur le point de mourir. Viens lui imposer les mains, afin qu’elle soit sauvée[a] et qu’elle vive. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « guérie » ou « rétablie ». Le verbe grec peut signifier sauver, secourir ou guérir ; ici, le contexte immédiat est celui d’une guérison physique.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ … πολλὰ
  choice: le suppliait avec insistance
  rationale: Dans ce contexte de détresse, παρακαλέω exprime une supplication pressante, et πολλὰ en renforce l’intensité. Cette formulation française reste naturelle sans imposer l’idée plus précise de demandes répétées.
- source_word: θυγάτριόν
  choice: ma petite fille
  rationale: Le diminutif exprime ici la jeunesse et probablement l’affection. « Ma petite fille » conserve ces deux nuances en français courant.
- source_word: ἐσχάτως ἔχει
  choice: est sur le point de mourir
  rationale: L’expression idiomatique décrit un état extrême, proche de la mort. La traduction explicite le sens avec clarté et naturel.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: viens lui imposer les mains
  rationale: Le participe ἐλθών prend naturellement en français la valeur d’une invitation pressante liée au verbe qui suit. « Imposer les mains » rend le geste de manière claire et consacrée par l’usage, sans ajouter d’explication doctrinale.
- source_word: σωθῇ
  choice: soit sauvée
  rationale: Le verbe σῴζω peut signifier sauver, secourir ou guérir. « Sauvée » préserve son amplitude lexicale et la tension entre délivrance et guérison physique, tandis que la note indique le sens contextuel possible.
- source_word: ζήσῃ
  choice: qu’elle vive
  rationale: Le verbe signifie directement « vivre ». La répétition de « qu’elle » reflète les deux propositions finales successives du grec tout en restant naturelle en français.
theological_decisions:
- issue: Sens de σωθῇ dans un récit de guérison
  choice: qu’elle soit sauvée
  alternative: qu’elle soit guérie / rétablie
  rationale: Le contexte immédiat vise clairement une guérison physique, mais σῴζω possède une portée plus large que le seul vocabulaire médical. Le texte principal conserve « sauvée » afin de ne pas réduire cette polyvalence, et la note fournit les équivalents contextuels plausibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit est rendu à l’imparfait pour s’insérer naturellement dans la narration, tandis que le discours direct conserve l’urgence de la demande. Le marqueur de note est placé après « sauvée », le mot auquel la variante se rapporte.
