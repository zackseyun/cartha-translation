source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: fr
  text: Et aussitôt, la source de son sang se tarit[a], et elle sut dans son corps qu’elle était guérie de son mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la source de son sang se dessécha ». L’expression grecque emploie l’image vive d’une source et désigne ici l’arrêt de son saignement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de son affliction » ou « de ce fléau ». Le mot grec peut désigner un fouet, puis, au sens figuré, une souffrance grave.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Rend l’immédiateté caractéristique du récit de Marc dans un français naturel et soutenu.
- source_word: ἐξηράνθη
  choice: se tarit
  rationale: Le verbe exprime littéralement le dessèchement; « se tarit » convient naturellement à l’image d’une source tout en signalant l’arrêt du saignement.
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: la source de son sang
  rationale: Préserve l’image vive de πηγή, « source », sans la réduire d’emblée au seul écoulement; une note explicite le sens contextuel.
- source_word: ἔγνω τῷ σώματι
  choice: elle sut dans son corps
  rationale: Conserve le sens cognitif de ἔγνω ainsi que la perception corporelle exprimée par le datif τῷ σώματι.
- source_word: ἴαται
  choice: elle était guérie
  rationale: Le plus-que-parfait passif français rend l’état résultant d’une guérison accomplie, exprimé par le parfait grec, par rapport au verbe principal au passé.
- source_word: ἀπὸ τῆς μάστιγος
  choice: de son mal
  rationale: Dans ce contexte, μάστιξ désigne figurément une souffrance grave ou une affection, non un fouet littéral; « mal » est clair, naturel et suffisamment large.
theological_decisions:
- issue: Nature de la guérison
  choice: Présenter à la fois l’arrêt objectif du saignement et la conscience corporelle qu’en a la femme.
  alternative: Réduire l’énoncé à une impression subjective ou ajouter une explication sur le mécanisme de la guérison.
  rationale: Le grec affirme conjointement le changement physique et sa reconnaissance par la femme, sans expliquer davantage le mécanisme ni la source dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Se tarit » maintient l’image de la source avec une tournure idiomatique; « son mal » évite l’archaïsme possible de « fléau » dans le corps du texte.
