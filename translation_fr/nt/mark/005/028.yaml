  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: fr
  text: 'Car elle se disait[a] : « Si je touche ne serait-ce que ses vêtements, je serai guérie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je serai sauvée ». Le verbe grec peut signifier « être sauvé », « être guéri » ou « être rétabli » ; ici, le contexte indique une guérison physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: elle se disait
  rationale: L’imparfait exprime une parole ou pensée en cours ou répétée. Dans ce contexte, « elle se disait » est naturel en français et n’impose pas qu’elle ait parlé à voix haute.
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication de l’action précédente et conserve clairement le lien logique du récit.
- source_word: ὅτι
  choice: rendu par les deux-points et le discours direct
  rationale: Introduit le contenu de ce qu’elle se disait ; le discours direct est naturel en français.
- source_word: ἐὰν ἅψωμαι
  choice: Si je touche
  rationale: Rend simplement et idiomatiquement la condition avec le subjonctif grec, orientée vers une action envisagée.
- source_word: κἂν
  choice: ne serait-ce que
  rationale: 'Exprime avec naturel la valeur restrictive et intensive : même si elle ne fait que toucher.'
- source_word: τῶν ἱματίων αὐτοῦ
  choice: ses vêtements
  rationale: Le pluriel ἱμάτια désigne globalement les vêtements ; ce choix est moderne, digne et non excessivement précis.
- source_word: σωθήσομαι
  choice: je serai guérie
  rationale: Dans le contexte immédiat de la perte de sang, le verbe désigne le rétablissement physique. Une note conserve toutefois son sens plus large de salut.
theological_decisions:
- issue: Portée de σωθήσομαι dans un récit de guérison
  choice: je serai guérie
  alternative: je serai sauvée / je serai rétablie
  rationale: La guérison corporelle est le sens contextuel immédiat, mais le grec σῴζω peut aussi signifier « sauver ». La note préserve ce chevauchement sémantique et sa possible portée théologique sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, fluide et digne. « Elle se disait » préserve l’aspect imperfectif tout en convenant à une parole intérieure ; « ne serait-ce que » restitue naturellement l’idée minimale portée par κἂν.
