id: MRK.5.30
reference: Mark 5:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: fr
  text: 'Aussitôt, Jésus, ayant perçu en lui-même que de la puissance était sortie de lui, se retourna au milieu de la foule et demanda : « Qui a touché mes vêtements ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Rend l’adverbe temporel caractéristique de Marc et conserve le mouvement rapide du récit dans un français naturel.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: ayant perçu en lui-même
  rationale: Exprime une prise de conscience intérieure et nette, sans préciser au-delà du grec la manière dont Jésus l’a su.
- source_word: δύναμιν
  choice: de la puissance
  rationale: « Puissance » rend directement δύναμις. L’article partitif donne ici une formulation française naturelle sans ajouter explicitement « guérissante » ou « miraculeuse ».
- source_word: ἐξελθοῦσαν
  choice: était sortie
  rationale: Le plus-que-parfait marque que la sortie de la puissance précède la perception exprimée par le participe principal.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: se retourna au milieu de la foule
  rationale: Restitue le mouvement physique de Jésus et le situe dans la foule, avec une tournure française claire.
- source_word: ἔλεγεν
  choice: demanda
  rationale: Le contexte introduit une question directe. « Demanda » est idiomatique en français, sans imposer une répétition que l’imparfait grec n’exige pas ici.
- source_word: ἥψατο τῶν ἱματίων
  choice: a touché mes vêtements
  rationale: « Toucher » correspond à l’emploi contextuel de ἅπτομαι, et « vêtements » conserve le pluriel de ἱμάτια dans un registre moderne et digne.
theological_decisions:
- issue: La puissance sortie de Jésus
  choice: Conserver l’affirmation narrative selon laquelle de la puissance était réellement sortie de lui
  alternative: Préciser « une puissance de guérison » ou ramener l’expression à une simple impression subjective
  rationale: Le grec parle directement de δύναμις sans en expliquer le mécanisme. La traduction maintient cette affirmation et sa tension théologique sans ajout doctrinal ni réduction interprétative.
translation_notes:
  register: Français international moderne, fluide et digne. La construction participiale est conservée parce qu’elle reste lisible et maintient l’enchaînement serré du grec. La note anglaise fournie, placée après « Jesus » mais proposant « my garments », est manifestement incohérente et n’a donc pas été reproduite.
