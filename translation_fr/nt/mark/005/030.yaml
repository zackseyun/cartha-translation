  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : l’immédiateté (εὐθύς), la perception intérieure de Jésus (ἐπιγνούς ἐν ἑαυτῷ), la puissance sortie de lui, son retournement dans la foule et la question concernant ses vêtements. « Demanda » est une introduction française naturelle à la question, même si ἔλεγεν est formellement à l’imparfait.'
