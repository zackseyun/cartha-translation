  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: fr
  text: À peine fut-il sorti de la barque qu’un homme avec un esprit impur[a] vint aussitôt des tombeaux à sa rencontre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme dans un esprit impur ». Autre traduction possible : « un homme habité par un esprit impur ».'
    reason: La construction grecque ἐν πνεύματι ἀκαθάρτῳ est plus littérale et plus ambiguë que « habité par ». La note indique cette possibilité sans la présenter comme le sens imposé.
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: Dès qu’il fut sorti de la barque
  rationale: Le génitif absolu à participe aoriste exprime ici la circonstance temporelle. « Dès que » rend aussi naturellement la proximité immédiate marquée par εὐθύς, tandis que « barque » convient au cadre du lac de Galilée.
- source_word: εὐθὺς ὑπήντησεν αὐτῷ
  choice: vint … à sa rencontre
  rationale: ὑπαντάω signifie aller ou venir à la rencontre de quelqu’un. La formulation française exprime clairement le déplacement de l’homme vers Jésus; l’immédiateté est portée par « Dès que » en tête de phrase.
- source_word: ἐκ τῶν μνημείων
  choice: des tombeaux
  rationale: μνημεῖον désigne un tombeau ou un lieu funéraire. « Des tombeaux » est précis, naturel et conserve le pluriel grec.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le nom masculin singulier désigne ici un individu de sexe masculin, comme le confirme le contexte.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: habité par un esprit impur
  rationale: La préposition ἐν décrit la condition de l’homme en relation avec l’esprit. « Habité par » est idiomatique en français et moins techniquement chargé que « possédé », tout en conservant l’idée d’une présence intérieure; une note donne la formulation plus littérale.
theological_decisions:
- issue: Expression de l’affliction démoniaque
  choice: habité par un esprit impur
  alternative: avec un esprit impur; possédé par un esprit impur
  rationale: Le grec dit littéralement « dans/en un esprit impur » sans employer un terme technique équivalant directement à « possédé ». « Habité par » rend intelligiblement la condition décrite sans imposer une catégorie démonologique plus systématisée; la note préserve la forme plus littérale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase évite le calque lourd du génitif absolu. « Dès que » associe naturellement la sortie de la barque et l’immédiateté caractéristique du récit de Marc. Le marqueur de note est placé après la proposition concernée.
