  text: καὶ διεστείλατο αὐτοῖς πολλὰ ἵνα μηδεὶς γνοῖ τοῦτο, καὶ εἶπεν δοθῆναι αὐτῇ φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: fr
  text: Il leur donna des ordres très stricts pour que personne ne l’apprenne, puis il dit de lui donner quelque chose à manger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il dit qu’il lui soit donné de manger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: Il leur donna des ordres très stricts
  rationale: Le moyen διεστείλατο exprime une directive ferme, et πολλὰ en renforce ici l’intensité. Cette formulation française rend naturellement l’ensemble sans traduire πολλὰ de façon artificiellement littérale.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: pour que personne ne l’apprenne
  rationale: ἵνα avec le subjonctif exprime ici le but visé par l’ordre. γνοῖ peut désigner le fait de venir à savoir; « l’apprenne » est naturel en français, et le pronom « l’ » reprend l’événement désigné par τοῦτο.
- source_word: εἶπεν
  choice: il dit
  rationale: La traduction simple conserve le sens direct de εἶπεν sans renforcer indûment le verbe, même si le contexte donne à ces paroles une valeur directive.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: de lui donner quelque chose à manger
  rationale: La tournure grecque signifie littéralement « qu’il lui soit donné de manger ». Le français idiomatique exige normalement un objet implicite, rendu par « quelque chose », tout en conservant la destinataire et le sens passif/directif de la construction.
theological_decisions:
- issue: Secret entourant l’événement et portée de l’ordre de Jésus
  choice: Présenter simplement l’ordre ferme visant à empêcher que l’événement soit connu
  alternative: Développer explicitement le motif marcien du secret messianique ou limiter verbalement l’ordre aux seuls témoins immédiats
  rationale: Le verset ne donne pas d’explication théologique de cet ordre. La traduction conserve donc sa portée immédiate et la tension narrative sans y ajouter une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. « Des ordres très stricts » restitue l’intensification grecque sans archaïsme; « quelque chose à manger » explicite seulement ce que l’idiome français requiert.
