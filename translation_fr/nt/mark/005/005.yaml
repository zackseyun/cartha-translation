source:
  edition: SBLGNT
  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: fr
  text: Sans cesse, nuit et jour, parmi les tombeaux et sur les montagnes, il criait et se tailladait avec des pierres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Sans cesse, nuit et jour
  rationale: L’expression indique une action continue sur toute la durée de la nuit et du jour. « Sans cesse, nuit et jour » en rend naturellement la force durative en français.
- source_word: μνήμασιν
  choice: tombeaux
  rationale: μνῆμα désigne un lieu de sépulture. « Tombeaux » convient au contexte probable de sépultures taillées dans la roche.
- source_word: ὄρεσιν
  choice: montagnes
  rationale: ὄρος signifie ordinairement « montagne ». Le choix direct préserve le relief exprimé par le texte sans le réduire à des collines.
- source_word: ἦν κράζων
  choice: il criait
  rationale: La construction périphrastique à l’imparfait décrit une action continue ou répétée dans le passé. L’imparfait français « criait » exprime cette durée avec naturel.
- source_word: κατακόπτων ἑαυτὸν
  choice: se tailladait
  rationale: κατακόπτω évoque des coups ou des coupures sévères. « Se tailladait » rend plus précisément l’intensité du verbe que le simple « se coupait », sans ajouter l’idée plus large de mutilation.
- source_word: λίθοις
  choice: avec des pierres
  rationale: Le datif a ici une valeur instrumentale. « Avec des pierres » est la formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression du grec, tandis que les imparfaits rendent l’action prolongée. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
