  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: fr
  text: Or, il y avait une femme qui souffrait de pertes de sang depuis douze ans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une hémorragie » ou « de saignements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Or
  rationale: Connecteur narratif naturel en français, qui introduit une nouvelle participante sans alourdir la phrase tout en conservant l’enchaînement paratactique de Marc.
- source_word: γυνὴ
  choice: une femme
  rationale: Le nom sans article introduit une nouvelle participante; l’article indéfini convient naturellement en français.
- source_word: οὖσα
  choice: qui souffrait
  rationale: Le participe « étant » décrit ici un état durable. « Qui souffrait » rend naturellement cette durée et la pénibilité de l’affection, précisées par l’expression temporelle.
- source_word: ἐν ῥύσει αἵματος
  choice: de pertes de sang
  rationale: L’expression désigne l’état caractérisé par un écoulement sanguin. « Pertes de sang » est idiomatique, compréhensible et suffisamment digne en français contemporain.
- source_word: ῥύσει
  choice: pertes
  rationale: Le terme grec désigne un écoulement ou flux; le pluriel français lexicalisé « pertes de sang » rend naturellement cette affection.
- source_word: αἵματος
  choice: sang
  rationale: Complément direct et non ambigu du nom désignant l’écoulement.
- source_word: δώδεκα ἔτη
  choice: depuis douze ans
  rationale: L’accusatif exprime l’étendue temporelle. Avec l’imparfait « souffrait », « depuis douze ans » indique clairement que l’état durait encore au moment du récit.
