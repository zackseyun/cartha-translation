  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: fr
  text: Et il le suppliait avec insistance de ne pas les envoyer hors de la région.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il le suppliait à plusieurs reprises de ne pas les envoyer hors du territoire. »'
    reason: Alternative lexicale qui explicite la possible valeur répétitive de πολλὰ et rend χώρα par « territoire ».
lexical_decisions:
- source_word: παρεκάλει
  choice: suppliait
  rationale: Dans ce contexte d’exorcisme, le verbe exprime une demande pressante. « Suppliait » rend cette intensité dans un français naturel et digne.
- source_word: πολλὰ
  choice: avec insistance
  rationale: Employé adverbialement, πολλὰ renforce la supplication et peut suggérer sa répétition. « Avec insistance » restitue cette force sans imposer exclusivement une lecture itérative.
- source_word: ἵνα μὴ
  choice: de ne pas
  rationale: Cette tournure introduit naturellement en français le contenu de la supplication tout en conservant sa négation.
- source_word: αὐτὰ
  choice: les
  rationale: Le pronom grec est au neutre pluriel et renvoie aux esprits impurs ou démons. « Les » maintient le pluriel malgré le sujet singulier du verbe précédent.
- source_word: ἀποστείλῃ
  choice: envoyer
  rationale: « Envoyer » rend directement le sens du verbe sans ajouter l’idée plus forte de chasser ou d’expulser.
- source_word: ἔξω τῆς χώρας
  choice: hors de la région
  rationale: χώρα désigne ici le district ou territoire local, non un État moderne. « Région » est clair en français contemporain.
theological_decisions:
- issue: Alternance entre le porte-parole singulier et la pluralité des démons
  choice: Conserver « il le suppliait » au singulier et « les envoyer » au pluriel.
  alternative: Harmoniser la phrase en mettant tous les référents au pluriel ou en traitant « Légion » comme une entité collective singulière.
  rationale: Le grec maintient lui-même cette tension entre un porte-parole singulier et les nombreux démons qu’il représente. La traduction ne la résout pas artificiellement.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Avec insistance » évite le calque peu naturel « beaucoup » tout en préservant l’intensité et l’ambiguïté entre degré et répétition.
