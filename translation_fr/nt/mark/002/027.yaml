id: MRK.2.27
reference: Mark 2:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: fr
  text: 'Et il leur disait : « Le sabbat a été fait pour l’être humain[a], et non l’être humain pour le sabbat. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme ». Le grec emploie ici le singulier ἄνθρωπος dans un sens représentatif pour parler des êtres humains en général.
    reason: Préciser la portée générique du nom grec et signaler une traduction française traditionnelle possible.
lexical_decisions:
- source_word: ἔλεγεν
  choice: il leur disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme une explication poursuivie. L’imparfait français en conserve naturellement l’aspect.
- source_word: τὸ σάββατον
  choice: le sabbat
  rationale: Avec l’article au singulier, le terme désigne ici le jour ou l’institution du sabbat. « Le sabbat » est la formulation française courante et suffisante.
- source_word: διὰ τὸν ἄνθρωπον
  choice: pour l’être humain
  rationale: διά suivi de l’accusatif exprime ici la finalité ou le bénéfice. Le singulier ἄνθρωπος a une valeur représentative et désigne l’humanité en général ; « l’être humain » préserve ce singulier tout en étant naturel et non ambigu en français moderne.
- source_word: ἐγένετο
  choice: a été fait
  rationale: Le verbe signifie ici que le sabbat est venu à l’existence ou a été établi en vue de l’être humain. « A été fait » reste proche du grec, s’intègre à l’antithèse et évite le tour peu naturel « est venu à l’existence ».
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: et non l’être humain pour le sabbat
  rationale: La formulation conserve l’ellipse et le parallélisme antithétique du grec sans ajouter un verbe absent de la seconde proposition.
theological_decisions:
- issue: Portée générique du singulier ἄνθρωπος
  choice: Traduire par « l’être humain » au singulier dans les deux membres.
  alternative: « L’homme » ou « l’humanité ».
  rationale: La déclaration porte sur les êtres humains en général. « L’être humain » garde le singulier représentatif et la symétrie rhétorique, sans donner à tort au lecteur moderne l’impression que seuls les hommes sont visés.
- issue: Rapport de finalité entre le sabbat et l’être humain
  choice: Conserver deux fois la préposition « pour » et l’ellipse du second membre.
  alternative: 'Expliciter : « et l’être humain n’a pas été fait pour le sabbat ».'
  rationale: L’ellipse maintient la force concise de l’antithèse originale et n’impose pas au texte un verbe explicatif supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève et parallèle de la parole est conservée. « L’être humain » est immédiatement compréhensible et évite une ambiguïté de genre aujourd’hui possible avec « l’homme ».
