source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: fr
  text: 'Et Jésus leur dit : « Les invités de la noce[a] ne peuvent-ils pas jeûner pendant que l’époux est avec eux ? Tant qu’ils ont l’époux avec eux, ils ne peuvent pas jeûner. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la salle nuptiale » ou « les fils de la chambre nuptiale », expression qui désigne ceux qui participent aux réjouissances du mariage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: peuvent-ils jeûner ... ?
  rationale: La question rhétorique introduite par μή appelle une réponse négative. En français, la forme interrogative directe exprime naturellement cette attente, confirmée par la proposition suivante.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: les invités de la noce
  rationale: L’expression signifie littéralement « les fils de la salle nuptiale » et désigne les personnes qui prennent part aux réjouissances du mariage. « Les invités de la noce » restitue clairement cet idiome sans le limiter aux seuls assistants du marié.
- source_word: ἐν ᾧ ... ἐστιν
  choice: pendant que ... est avec eux
  rationale: La construction a ici une valeur temporelle. « Pendant que » rend cette relation clairement et naturellement.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: l’époux
  rationale: « L’époux » conserve l’image nuptiale et sa résonance biblique, tout en restant compréhensible en français moderne.
- source_word: μετ’ αὐτῶν
  choice: avec eux
  rationale: Avec le génitif, μετά exprime ici l’accompagnement ou la présence auprès d’eux.
- source_word: ὅσον χρόνον
  choice: tant que
  rationale: Cette expression marque toute la durée d’une situation ; « tant que » en donne un équivalent français naturel et précis.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: ils ont l’époux avec eux
  rationale: Cette formulation conserve le verbe explicite ἔχουσιν, « avoir », plutôt que de répéter simplement « l’époux est avec eux ».
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Et Jésus leur dit
  rationale: Formule narrative directe, naturelle et fidèle à l’ordre discursif du grec.
theological_decisions:
- issue: Identification métaphorique de Jésus à l’époux
  choice: Conserver l’image de « l’époux » sans expliciter son interprétation théologique dans le texte.
  alternative: Employer une formulation interprétative qui mettrait explicitement en avant une identité messianique.
  rationale: Jésus emploie l’image de l’époux en rapport avec lui-même, mais le verset n’en formule pas ici toutes les implications. La traduction préserve donc l’image et laisse ouverte son interprétation.
translation_notes:
  register: Français international moderne, clair et digne. « Noce » est employé dans l’expression courante « invités de la noce », tandis que « l’époux » maintient la portée imagée et biblique de νυμφίος. La répétition de « avec eux » et le passage de « est » à « ont » suivent les nuances du grec.
