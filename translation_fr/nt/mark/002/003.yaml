  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: fr
  text: Des gens arrivent et lui amènent un homme paralysé, porté par quatre personnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction narrative simple qui conserve le style paratactique de Marc; en français, elle se rattache naturellement au contexte précédent.
- source_word: ἔρχονται
  choice: des gens arrivent
  rationale: Le présent historique grec est rendu au présent narratif, naturel en français. Le sujet indéfini est explicité sans préciser leur identité.
- source_word: φέροντες πρὸς αὐτὸν
  choice: lui amènent
  rationale: Formulation française idiomatique exprimant le déplacement de l’homme vers Jésus, sans alourdir la phrase par un participe.
- source_word: παραλυτικὸν
  choice: un homme paralysé
  rationale: L’adjectif substantivé désigne une personne atteinte de paralysie; cette formulation moderne évite de réduire la personne à son état.
- source_word: αἰρόμενον
  choice: porté
  rationale: Le participe passif indique que l’homme est physiquement transporté par d’autres.
- source_word: ὑπὸ τεσσάρων
  choice: par quatre personnes
  rationale: Le grec dit seulement «par quatre». Le français exige plus naturellement un nom après le nombre; «personnes» évite d’ajouter le sexe des porteurs, non précisé dans le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif garde la vivacité propre au récit de Marc. «Des gens» reprend le sujet indéfini implicite de ἔρχονται, tandis que «quatre personnes» rend l’ellipse grecque sans introduire «hommes».
