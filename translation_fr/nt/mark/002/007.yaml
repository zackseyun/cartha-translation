  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: fr
  text: Pourquoi cet homme parle-t-il ainsi ?[a] Il blasphème ! Qui peut pardonner les péchés, sinon Dieu seul ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « Que cet homme parle-t-il ainsi ? » Cette tournure idiomatique signifie : « Pourquoi cet homme parle-t-il ainsi ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sinon le Dieu unique ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί … λαλεῖ
  choice: Pourquoi … parle-t-il
  rationale: Dans cette tournure, Τί introduit naturellement une question sur la raison ou le fondement de ces paroles. « Pourquoi » rend donc l’idiome grec plus clairement qu’un « Que » littéral.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne Jésus avec une certaine distance. « Cet homme » conserve cette nuance sans accentuer artificiellement le mépris.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » est une formulation française naturelle et digne qui renvoie à la manière et au contenu des paroles de Jésus.
- source_word: βλασφημεῖ
  choice: Il blasphème
  rationale: Le présent exprime l’accusation immédiate portée contre Jésus. La formulation française directe garde toute la force religieuse du terme.
- source_word: ἀφιέναι ἁμαρτίας
  choice: pardonner les péchés
  rationale: Dans ce contexte, ἀφίημι associé aux péchés signifie les pardonner ; une traduction littérale comme « laisser aller » obscurcirait le sens.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: sinon Dieu seul
  rationale: La tournure exprime l’exception et l’exclusivité. « Sinon Dieu seul » est idiomatique en français, tout en laissant en note la possibilité de comprendre εἷς comme « unique ».
theological_decisions:
- issue: Degré de mépris exprimé par οὗτος
  choice: cet homme
  alternative: celui-ci ; cet individu
  rationale: L’hostilité des spécialistes de la Loi ressort du contexte, mais la traduction ne doit pas ajouter un ton plus insultant que ne l’impose le grec.
- issue: Portée de l’accusation βλασφημεῖ
  choice: Il blasphème !
  alternative: C’est un blasphème !
  rationale: Le grec accuse directement Jésus de blasphémer. Cette traduction maintient le jugement des interlocuteurs sans trancher dans leur formulation la tension christologique du récit.
- issue: Valeur de εἷς dans εἰ μὴ εἷς ὁ θεός
  choice: sinon Dieu seul
  alternative: sinon le Dieu unique
  rationale: Le contexte met principalement l’accent sur l’exclusivité du pouvoir de pardonner. L’autre construction possible est conservée en note afin de ne pas effacer l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion interrogative convient au registre narratif sans être archaïque. « Blasphème » et « pardonner les péchés » conservent le vocabulaire théologique courant et accessible.
