id: MRK.2.26
reference: Mark 2:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: fr
  text: comment il entra dans la maison de Dieu au temps du grand prêtre Abiathar[a], mangea les pains de la Présence[b], qu’il n’est permis de manger qu’aux prêtres, et en donna aussi à ceux qui étaient avec lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « durant le grand sacerdoce d’Abiathar ». L’expression peut aussi désigner plus largement l’époque ou le cadre narratif associé au grand prêtre Abiathar.
    reason: alternative_reading
  - marker: b
    text: Les « pains de la Présence » étaient les pains consacrés placés devant Dieu dans le sanctuaire ; on les appelle traditionnellement les « pains de proposition ».
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: comment
  rationale: Introduit naturellement en français le récit de ce que David a fait, sans ajouter de nuance explicative.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: il entra dans la maison de Dieu
  rationale: Rend directement le verbe narratif et conserve l’expression « maison de Dieu » ainsi que son cadre sacré.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: au temps du grand prêtre Abiathar
  rationale: ἐπί avec le génitif peut avoir un sens temporel. Cette formulation française reste naturelle et ne réduit pas nécessairement l’expression à la durée exacte de son grand sacerdoce.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: les pains de la Présence
  rationale: Cette expression compréhensible conserve l’idée cultuelle des pains placés devant Dieu, contrairement à un terme traditionnel devenu moins transparent.
- source_word: ἔφαγεν
  choice: mangea
  rationale: Le passé simple convient au registre narratif digne et rend l’aoriste sans surinterprétation.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: qu’il n’est permis de manger
  rationale: Exprime clairement la permission légale et cultuelle en jeu.
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: qu’aux prêtres
  rationale: La tournure restrictive française indique avec concision que seuls les prêtres avaient le droit d’en manger.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: et en donna aussi à ceux qui étaient avec lui
  rationale: Le pronom « en » reprend naturellement les pains, tandis que « ceux qui étaient avec lui » reste proche du participe grec.
theological_decisions:
- issue: Rapport entre la formule temporelle concernant Abiathar et le récit de 1 Samuel 21
  choice: au temps du grand prêtre Abiathar
  alternative: durant le grand sacerdoce d’Abiathar ; dans le passage concernant le grand prêtre Abiathar
  rationale: La formulation principale préserve le sens temporel possible de ἐπί avec le génitif sans tenter de supprimer la tension chronologique. La note signale la portée plus large que la formule grecque peut recevoir.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le caractère narratif sans archaïsme marqué. « Pains de la Présence » est conservé dans le texte, puis expliqué par une note culturelle.
