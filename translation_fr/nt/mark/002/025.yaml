  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: fr
  text: 'Et il leur dit : « N’avez-vous jamais lu ce que fit David lorsqu’il fut dans le besoin et eut faim, lui et ceux qui étaient avec lui ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: fut dans le besoin
  rationale: Rend directement l’idée d’une situation de nécessité, sans préciser au-delà du grec la nature exacte du besoin.
- source_word: ἐπείνασεν
  choice: eut faim
  rationale: Traduit le verbe distinctement de l’expression précédente et conserve la succession des deux propositions.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Formulation française naturelle qui préserve la portée générale de l’expression grecque.
