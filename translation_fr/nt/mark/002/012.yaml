id: MRK.2.12
reference: Mark 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: fr
  text: 'Alors il se leva, prit aussitôt sa natte et sortit devant tout le monde, si bien que tous étaient stupéfaits et glorifiaient Dieu en disant : « Nous n’avons jamais rien vu de pareil[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jamais nous n’avons vu ainsi. » L’expression grecque signifie qu’ils n’avaient encore jamais rien vu de semblable.'
    reason: Traduction littérale et explication de l’idiome grec.
lexical_decisions:
- source_word: ἠγέρθη
  choice: il se leva
  rationale: Dans ce récit de guérison, le verbe décrit naturellement l’homme qui se met debout en réponse à l’ordre de Jésus. Cette formulation respecte la forme grecque sans suggérer ici une résurrection.
- source_word: εὐθύς
  choice: aussitôt
  rationale: Ce terme fréquent chez Marc exprime l’immédiateté et donne au récit son mouvement caractéristique.
- source_word: ἄρας
  choice: prit
  rationale: Le participe indique que l’homme soulève sa natte pour l’emporter. « Prit » rend naturellement l’action dans la suite narrative.
- source_word: κράβαττον
  choice: sa natte
  rationale: Le mot désigne une couche simple et transportable. « Natte » est clair en français moderne et évite l’image trompeuse d’un véritable lit.
- source_word: ἔμπροσθεν πάντων
  choice: devant tout le monde
  rationale: Cette expression conserve le caractère public et visible de la guérison dans un français courant.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: si bien que tous étaient stupéfaits
  rationale: La construction exprime le résultat, tandis que ἐξίστασθαι marque un profond étonnement.
- source_word: δοξάζειν τὸν θεόν
  choice: glorifiaient Dieu
  rationale: Cette traduction conserve le sens religieux précis de δοξάζω et le registre biblique naturel.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Nous n’avons jamais rien vu de pareil
  rationale: Cette tournure française idiomatique transmet l’idée d’un événement sans précédent tout en préservant la force de l’exclamation.
theological_decisions:
- issue: Éventuelles résonances de résurrection dans ἠγέρθη
  choice: il se leva
  alternative: il fut relevé / il ressuscita
  rationale: Le contexte immédiat présente le paralysé guéri qui obéit à l’ordre de Jésus. La traduction retient donc le sens physique direct sans importer une référence explicite à la résurrection.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la rapidité narrative propre à Marc. « Devant tout le monde » est plus naturel que « devant tous » tout en rendant l’exposition publique de l’événement.
