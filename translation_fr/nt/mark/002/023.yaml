id: MRK.2.23
reference: Mark 2:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: fr
  text: Un jour de sabbat, Jésus traversait des champs de céréales[a]. Ses disciples se mirent à avancer en arrachant des épis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à travers les cultures » ou « à travers les blés ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « se mirent à faire chemin en arrachant les épis »; l’expression signifie ici qu’ils avançaient dans les champs tout en arrachant des épis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Un jour
  rationale: La formule narrative introduit ici naturellement la scène. « Un jour » rend sa fonction discursive sans conserver un calque lourd comme « il arriva que ».
- source_word: ἐν τοῖς σάββασιν
  choice: de sabbat
  rationale: Le pluriel grec peut désigner idiomatiquement un seul jour de sabbat; le singulier français convient au contexte.
- source_word: παραπορεύεσθαι
  choice: traversait
  rationale: Le verbe décrit le déplacement de Jésus à travers les champs; l’imparfait restitue le déroulement de l’action.
- source_word: διὰ τῶν σπορίμων
  choice: des champs de céréales
  rationale: Le terme désigne des terres ensemencées ou couvertes de céréales. Cette formulation est claire en français international.
- source_word: οἱ μαθηταὶ αὐτοῦ ἤρξαντο
  choice: Ses disciples se mirent à
  rationale: Cette tournure française rend naturellement l’idée d’un commencement exprimée par ἤρξαντο.
- source_word: ὁδὸν ποιεῖν
  choice: avancer
  rationale: Dans ce contexte, l’expression signifie progresser ou se frayer un passage, non construire littéralement une route.
- source_word: τίλλοντες
  choice: en arrachant
  rationale: Le participe indique l’action simultanée par laquelle les disciples cueillent ou détachent les épis en avançant.
- source_word: τοὺς στάχυας
  choice: des épis
  rationale: « Épis » est le terme français courant et précis pour les têtes des céréales.
- source_word: αὐτὸν
  choice: Jésus
  rationale: Le pronom accusatif est le sujet logique de l’infinitif. La reprise du nom explicite le référent et produit une phrase française naturelle.
theological_decisions:
- issue: Forme du mot sabbat
  choice: Un jour de sabbat
  alternative: pendant les sabbats
  rationale: Le pluriel grec a ici une valeur idiomatique singulière. Ce choix linguistique ne modifie pas le cadre sabbatique du récit.
- issue: Sens de ὁδὸν ποιεῖν dans la controverse sur le sabbat
  choice: avancer
  alternative: se frayer un chemin
  rationale: Le rendu retenu décrit le déplacement des disciples sans suggérer qu’ils construisaient une route. Il évite aussi de préciser au-delà du grec si l’arrachage lui-même créait matériellement un passage.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative est allégée sans perdre les actions ni leur enchaînement. « Céréales » évite de déterminer une espèce que le grec ne précise pas.
