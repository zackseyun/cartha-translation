id: MRK.2.8
reference: Mark 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: fr
  text: 'Aussitôt, Jésus perçut en son esprit[a] qu’ils raisonnaient ainsi en eux-mêmes, et il leur dit : « Pourquoi avez-vous ces raisonnements dans vos cœurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sachant en son esprit » ou « reconnaissant en lui-même ». Le grec ne précise pas explicitement le mode de perception de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Ce marqueur narratif fréquent chez Marc exprime l’immédiateté et conserve le rythme vif du récit dans un français actuel.
- source_word: ἐπιγνοὺς
  choice: percevant
  rationale: Le participe exprime une prise de conscience ou une reconnaissance nette. « Percevant » convient à la connaissance de leurs réflexions intérieures sans en préciser indûment le mode.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: dans son esprit
  rationale: Cette formulation reproduit le datif grec comme domaine de perception et préserve l’ambiguïté entre perception intérieure et mode spirituel de connaissance.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » rend naturellement la manière dont ils raisonnaient.
- source_word: διαλογίζονται ἐν ἑαυτοῖς
  choice: ils raisonnaient ainsi en eux-mêmes
  rationale: Le contexte décrit une réflexion intérieure plutôt qu’un débat prononcé à voix haute. La formulation conserve cette intériorité.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Pourquoi avez-vous ces raisonnements
  rationale: Dans cette interrogation, τί a naturellement une valeur causale (« pourquoi »). « Avoir ces raisonnements » exprime idiomatiquement en français l’activité intérieure visée par le verbe et reprend explicitement ταῦτα, « ces choses ».
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans vos cœurs
  rationale: Le terme biblique « cœur » désigne ici l’être intérieur, notamment la pensée et l’intention. Le conserver évite de réduire le sens au seul intellect.
theological_decisions:
- issue: Nature de la connaissance de Jésus exprimée par « percevant dans son esprit »
  choice: Conserver « dans son esprit » sans définir le mécanisme de cette perception.
  alternative: Préciser soit une omniscience divine surnaturelle, soit une simple intuition humaine.
  rationale: Le verset affirme que Jésus connaît leur raisonnement intérieur, mais τῷ πνεύματι αὐτοῦ ne tranche pas explicitement entre les diverses explications possibles de cette connaissance. La traduction maintient donc la force et la tension théologiques du texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition autour du raisonnement intérieur est partiellement conservée, tandis que la question est formulée de manière idiomatique. Le mot « cœurs » maintient l’imagerie biblique de l’être intérieur.
