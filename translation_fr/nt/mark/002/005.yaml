  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: fr
  text: 'Voyant leur foi, Jésus dit à l’homme paralysé : « Mon enfant[a], tes péchés sont pardonnés. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Enfant »; le grec τέκνον est une apostrophe affectueuse signifiant « enfant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Voyant
  rationale: Le participe aoriste de ὁράω est conservé par un participe français naturel, étroitement lié au verbe principal.
- source_word: πίστιν αὐτῶν
  choice: leur foi
  rationale: Cette formulation garde le singulier « foi » et le génitif pluriel, qui renvoie au groupe dont Jésus constate la confiance.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec produit un récit vif; en français narratif moderne, le présent « dit » le restitue naturellement.
- source_word: παραλυτικῷ
  choice: à l’homme paralysé
  rationale: L’adjectif substantivé désigne une personne paralysée; cette expression est actuelle, claire et respectueuse.
- source_word: Τέκνον
  choice: Mon enfant
  rationale: τέκνον est ici une apostrophe affectueuse. « Mon enfant » rend naturellement en français cette tendresse sans imposer le genre masculin que le mot grec n’exprime pas à lui seul.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: tes péchés sont pardonnés
  rationale: Le présent passif est rendu directement, sans préciser l’agent implicite ni transformer l’énoncé en processus ou en antériorité accomplie.
theological_decisions:
- issue: Nature de la déclaration de pardon prononcée par Jésus
  choice: « tes péchés sont pardonnés »
  alternative: « tes péchés ont été pardonnés » ou « tes péchés sont en train d’être pardonnés »
  rationale: Le présent passif grec présente le pardon comme une réalité déclarée au paralysé. La traduction maintient la force de cette déclaration et le passif implicite, sans expliquer davantage son mécanisme, son agent ou sa temporalité.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent narratif et le participe initial préservent la vivacité et la structure concise de Marc.
