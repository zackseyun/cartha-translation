id: MRK.2.10
reference: Mark 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: fr
  text: 'Mais afin que vous sachiez que le Fils de l’homme[a] a, sur la terre, l’autorité de pardonner les péchés — il dit à l’homme paralysé[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi évoquer « l’être humain ». Le titre « Fils de l’homme » peut renvoyer à la fois à la condition humaine et à Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Ou « au paralytique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Mais afin que
  rationale: ἵνα introduit ici le but, tandis que δέ marque une légère opposition ou transition. « Mais afin que » restitue naturellement ces deux valeurs.
- source_word: εἰδῆτε
  choice: vous sachiez
  rationale: Le subjonctif aoriste après ἵνα exprime le but recherché; « sachiez » conserve le sens direct et la portée probante du miracle qui va suivre.
- source_word: ἐξουσίαν ἔχει
  choice: a […] l’autorité
  rationale: ἐξουσία désigne ici l’autorité ou le droit légitime d’agir, et non la seule capacité d’accomplir un acte.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation consacrée conserve le titre employé par Jésus ainsi que sa possible résonance avec Daniel 7, sans réduire son ambiguïté à une simple désignation de l’humanité.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: La formule désigne naturellement la sphère terrestre où cette autorité s’exerce, avec une possible mise en contraste implicite avec le ciel.
- source_word: ἀφιέναι ἁμαρτίας
  choice: de pardonner les péchés
  rationale: Dans ce contexte, ἀφίημι signifie remettre ou pardonner; cette expression est à la fois exacte et idiomatique en français.
- source_word: λέγει τῷ παραλυτικῷ
  choice: il dit à l’homme paralysé
  rationale: Le présent « il dit » conserve le présent historique grec. « L’homme paralysé » est clair et actuel, tandis que « le paralytique » reste une possibilité plus littérale.
theological_decisions:
- issue: Sens du titre ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain / celui qui est humain
  rationale: Le titre traditionnel préserve à la fois sa dimension humaine idiomatique et sa possible allusion à Daniel 7, sans trancher entre ses lectures humaine, messianique et apocalyptique.
- issue: Portée de ἐξουσία à propos du pardon des péchés
  choice: l’autorité
  alternative: le pouvoir / le droit
  rationale: Le contexte met en jeu la prérogative légitime de pardonner les péchés, et non la seule puissance nécessaire pour accomplir une guérison.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase suspendue suivie du tiret conserve la rupture syntaxique du grec: Jésus interrompt l’explication pour s’adresser directement à l’homme. Les points de suspension rendent cette interruption lisible sans la résoudre par une paraphrase.'
