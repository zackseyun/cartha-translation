    issue: « annonçait la parole » est plus interprétatif que ἐλάλει αὐτοῖς τὸν λόγον.
    rationale: Le verbe λαλέω décrit l’acte de parler. Bien que « annoncer la parole » soit une expression biblique française naturelle, elle introduit plus explicitement la notion de proclamation. « Leur adressait la parole » garde le lien avec « la parole » et le destinataire datif sans renforcer le registre.
  - severity: low
