  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: fr
  text: Beaucoup de gens se rassemblèrent, si bien qu’il n’y avait plus de place, pas même près de la porte, et il leur adressait la parole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le message ». Littéralement : « la parole ».'
    reason: Signaler le sens contextuel possible de λόγος tout en rendant transparente la formulation grecque.
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Beaucoup de gens se rassemblèrent
  rationale: Le passif aoriste décrit la formation du rassemblement. La tournure pronominale est naturelle en français et « gens » explicite sobrement l’adjectif substantivé πολλοί.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: si bien qu’il n’y avait plus de place
  rationale: « Si bien que » exprime clairement le résultat introduit par ὥστε, tandis que « il n’y avait plus de place » rend idiomatiquement l’idée de capacité de χωρεῖν et la valeur de μηκέτι.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: même aux abords de la porte
  rationale: L’expression grecque désigne l’espace situé vers la porte. « Aux abords de la porte » conserve cette portée spatiale sans réduire nécessairement le sens au seul seuil.
- source_word: ἐλάλει
  choice: annonçait
  rationale: L’imparfait français restitue l’action en cours de l’imparfait grec. Avec « la parole » comme complément, « annonçait » est plus naturel que le calque « disait la parole », tout en restant adapté à la communication d’un message.
- source_word: τὸν λόγον
  choice: la parole
  rationale: Ce choix garde l’expression grecque ouverte et évite d’ajouter « de Dieu », absent du verset. La minuscule évite d’imposer une personnification ou un statut de titre.
theological_decisions:
- issue: Sens de τὸν λόγον dans l’activité de Jésus
  choice: la parole
  alternative: le message ; la parole de Dieu
  rationale: « La parole » préserve la formulation concise et l’ouverture du grec. « Le message » en explicite le sens contextuel, tandis que « la parole de Dieu » préciserait une origine que ce verset ne formule pas explicitement.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe suit le mouvement du grec sans calque pesant. « Aux abords de la porte » évoque naturellement la zone de l’entrée, et l’imparfait « annonçait » conserve l’aspect duratif de ἐλάλει.
