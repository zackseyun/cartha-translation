id: MRK.2.16
reference: Mark 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: fr
  text: 'Les spécialistes de la Loi appartenant aux pharisiens, voyant qu’il mangeait[a] avec les pécheurs et les collecteurs d’impôts, disaient à ses disciples : « Pourquoi mange-t-il avec les collecteurs d’impôts et les pécheurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « partageait la table avec ». Le grec dit littéralement « mangeait avec », expression qui implique ici le partage d’un repas.'
    reason: Préciser la portée sociale implicite de l’expression grecque sans l’intégrer de façon interprétative au texte principal.
lexical_decisions:
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Cette expression moderne rend la fonction reconnue de ces experts des textes et de la Loi, plus clairement pour le lecteur actuel que le terme traditionnel « scribes ».
- source_word: τῶν Φαρισαίων
  choice: appartenant aux pharisiens
  rationale: Le génitif indique leur rattachement au groupe pharisien sans préciser davantage la nature exacte de cette affiliation.
- source_word: ἰδόντες
  choice: voyant
  rationale: Le participe circonstanciel est rendu directement et introduit naturellement ce qu’ils constatent.
- source_word: ὅτι ἐσθίει
  choice: qu’il mangeait
  rationale: L’imparfait grec présente l’action en cours dans la scène; l’imparfait français en conserve naturellement l’aspect.
- source_word: μετὰ
  choice: avec
  rationale: La préposition exprime ici l’association, notamment autour de la table, sans qu’il soit nécessaire d’expliciter cette portée sociale dans le corps du texte.
- source_word: ἁμαρτωλῶν
  choice: pécheurs
  rationale: Le terme direct maintient l’étiquette sociale et religieuse accusatrice du récit.
- source_word: τελωνῶν
  choice: collecteurs d’impôts
  rationale: C’est l’équivalent français courant et compréhensible pour ces agents chargés de percevoir taxes et péages.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait conserve le caractère duratif ou répété de leur objection, contrairement à un simple passé ponctuel.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: « Disciples » est le terme français établi qui préserve la relation entre maître et élèves.
- source_word: Ὅτι
  choice: Pourquoi
  rationale: Dans cette question, ὅτι introduit idiomatiquement le motif de l’objection; « pourquoi » en transmet le sens en français naturel.
- source_word: ἐσθίει
  choice: mange-t-il
  rationale: Le présent français convient à une question qui vise autant la conduite observée que la pratique caractéristique reprochée à Jésus.
theological_decisions:
- issue: Portée sociale et religieuse du repas pris ensemble
  choice: Conserver dans le texte la formulation simple « manger avec » et expliquer en note sa portée implicite.
  alternative: Traduire plus explicitement par « partager la table avec » ou « prendre ses repas avec ».
  rationale: Le grec emploie le verbe ordinaire « manger » avec la préposition « avec ». Cette formulation laisse le récit porter lui-même la tension créée par la communion de table de Jésus avec des groupes stigmatisés.
- issue: Rapport entre les spécialistes de la Loi et les pharisiens
  choice: Rendre le génitif par « appartenant aux pharisiens ».
  alternative: « qui étaient pharisiens » ou « les scribes des pharisiens ».
  rationale: Cette formulation exprime l’affiliation indiquée par le génitif sans imposer une analyse institutionnelle plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Spécialistes de la Loi » privilégie l’intelligibilité actuelle; « collecteurs d’impôts » et « pécheurs » conservent les désignations sociales fortes du passage. La répétition finale de ces deux groupes suit l’ordre grec et maintient l’insistance de l’accusation.
