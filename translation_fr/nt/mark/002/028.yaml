id: MRK.2.28
reference: Mark 2:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: fr
  text: Ainsi, le Fils de l’homme est Seigneur même du sabbat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ainsi, le Fils de l’homme est aussi Seigneur du sabbat. » Le mot grec peut signifier simplement « aussi », mais il a probablement ici le sens de « même », qui souligne l’étendue de son autorité.
    reason: alternative lexicale
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent, tout en conservant sa force logique.
- source_word: κύριος
  choice: Seigneur
  rationale: Exprime l’autorité souveraine affirmée ici et préserve la portée christologique du terme appliqué au Fils de l’homme.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Conserve le titre établi dans les Évangiles ainsi que ses résonances et son ambiguïté théologique, sans le réduire à une désignation générique de l’être humain.
- source_word: καὶ
  choice: même
  rationale: Dans ce contexte, καί a vraisemblablement une valeur intensive, soulignant que l’autorité du Fils de l’homme s’étend jusqu’au sabbat.
- source_word: σαββάτου
  choice: du sabbat
  rationale: Rendu français naturel du génitif singulier, conforme au contexte immédiat de la controverse sur l’observance du sabbat.
theological_decisions:
- issue: Portée christologique de l’autorité du Fils de l’homme sur le sabbat
  choice: Présenter directement le Fils de l’homme comme « Seigneur du sabbat ».
  alternative: Employer une formulation atténuée telle que « a autorité sur le sabbat ».
  rationale: Le prédicat κύριος affirme la seigneurie, et non une simple permission limitée; la formulation garde la force de l’énoncé sans lui ajouter d’explication doctrinale.
- issue: Référence de « Fils de l’homme »
  choice: Conserver « le Fils de l’homme » comme titre employé par Jésus.
  alternative: Traduire par « l’être humain » ou comprendre l’expression au sens collectif de « l’homme ».
  rationale: Dans Marc, cette expression fonctionne comme une autodésignation de Jésus et conserve une tension théologique ainsi que de possibles résonances daniéliques qu’une paraphrase ferait disparaître.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi » marque une conclusion sans lourdeur; « Seigneur », « Fils de l’homme » et « sabbat » maintiennent la terminologie biblique établie.
