id: MRK.2.1
reference: Mark 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: fr
  text: Quelques jours plus tard, il entra de nouveau à Capharnaüm, et on apprit qu’il était chez lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans la maison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: il entra
  rationale: Le participe aoriste exprime ici une action liée temporellement au verbe principal. Une proposition verbale coordonnée donne en français un récit naturel tout en conservant la progression des événements.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression rend clairement l’idée de retour à Capharnaüm dans un registre narratif courant.
- source_word: Καφαρναούμ
  choice: Capharnaüm
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu.
- source_word: δι’ ἡμερῶν
  choice: Quelques jours plus tard
  rationale: L’expression indique qu’un intervalle indéterminé de plusieurs jours s’est écoulé. Cette formulation est idiomatique et ne précise pas abusivement sa durée.
- source_word: ἠκούσθη
  choice: l’on apprit
  rationale: Le passif impersonnel grec signale qu’une nouvelle se répand. « L’on apprit » conserve cette indétermination sans la tournure peu naturelle « il fut entendu ».
- source_word: ἐν οἴκῳ
  choice: chez lui
  rationale: L’expression peut signifier « chez soi » ou, plus littéralement, « dans la maison ». « Chez lui » est naturel dans ce contexte, tandis que l’autre possibilité est signalée en note.
- source_word: ἐστίν
  choice: il était
  rationale: Le présent grec est intégré au discours indirect après un verbe au passé. L’imparfait est la concordance des temps la plus naturelle en français narratif.
theological_decisions:
- issue: ἐν οἴκῳ désigne-t-il le domicile de Jésus ou simplement la maison où il se trouvait ?
  choice: chez lui
  alternative: dans la maison
  rationale: Le contexte permet le sens idiomatique « chez lui », sans établir avec certitude la propriété ou l’identité de la maison. La note conserve donc la lecture locative plus littérale.
translation_notes:
  register: Français international moderne, narratif et digne. « L’on apprit » évite un sujet collectif ajouté au texte tout en rendant naturellement le passif impersonnel grec.
