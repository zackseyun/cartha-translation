  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: fr
  text: 'Mais quelques scribes étaient assis là et raisonnaient dans leur cœur[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réfléchissaient en eux-mêmes ». Le grec dit littéralement « dans leurs cœurs », expression biblique qui désigne la pensée intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Mais ... étaient
  rationale: δέ marque ici une transition avec une légère nuance de contraste, en faisant passer le récit à la réaction intérieure d’un autre groupe. « Mais » l’exprime naturellement sans exagérer l’opposition.
- source_word: τινες τῶν γραμματέων
  choice: quelques-uns des spécialistes de la Loi
  rationale: La construction partitive indique qu’une partie seulement des γραμματεῖς est concernée. Dans ce contexte évangélique, « spécialistes de la Loi » communique clairement leur fonction de lettrés experts des Écritures et de la Loi.
- source_word: ἐκεῖ
  choice: là
  rationale: Cet adverbe locatif situe simplement ces hommes dans la scène.
- source_word: καθήμενοι
  choice: assis
  rationale: Le participe décrit leur posture au cours de la scène; « étaient assis » est naturel en français narratif.
- source_word: διαλογιζόμενοι
  choice: raisonnaient
  rationale: Le verbe désigne ici une réflexion ou une délibération intérieure. « Raisonnaient » conserve cette nuance sans préciser prématurément la teneur de leur objection.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: dans leur cœur
  rationale: L’expression biblique présente le cœur comme le siège de la pensée intérieure. Le singulier distributif est idiomatique en français et préserve l’image du texte grec.
theological_decisions:
- issue: L’idiome anthropologique καρδίαις
  choice: dans leur cœur
  alternative: en eux-mêmes / intérieurement
  rationale: Conserver « cœur » respecte le monde conceptuel biblique, où le cœur comprend la réflexion et le discernement, sans imposer la distinction moderne entre pensée et émotion.
translation_notes:
  register: Français moderne, naturel et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate de la fonction des γραμματεῖς; la tournure « dans leur cœur » conserve l’idiome biblique, expliqué en note.
