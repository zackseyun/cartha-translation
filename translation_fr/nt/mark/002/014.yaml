  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: fr
  text: 'En passant, Jésus vit Lévi, fils d’Alphée, assis au poste de perception des taxes[a]. Il lui dit : « Suis-moi. » Lévi se leva et le suivit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au poste de péage » ou « au bureau des douanes ». Le terme grec désigne un lieu où l’on percevait des taxes, des péages ou des droits de douane.
    reason: alternative_lexicale
lexical_decisions:
- source_word: παράγων
  choice: En passant
  rationale: Le participe présent situe la rencontre pendant le déplacement de Jésus. Cette formulation française est naturelle et conserve la simultanéité de l’action.
- source_word: εἶδεν
  choice: vit
  rationale: L’aoriste de ὁράω exprime simplement le fait de voir, sans ajouter la nuance interprétative de « remarqua ».
- source_word: Λευὶν
  choice: Lévi
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: fils d’Alphée
  rationale: La relation de filiation, implicite dans la construction grecque au génitif, doit être explicitée en français.
- source_word: καθήμενον
  choice: assis
  rationale: Le participe décrit la position de Lévi lorsque Jésus le voit; « assis » est direct et idiomatique.
- source_word: ἐπὶ τὸ τελώνιον
  choice: au poste de perception des taxes
  rationale: τελώνιον désigne le lieu où l’on percevait taxes, péages ou droits de douane. Cette formulation reste concrète sans limiter indûment le terme à un péage routier.
- source_word: λέγει αὐτῷ
  choice: Il lui dit
  rationale: La forme française « dit » peut se lire comme présent ou passé simple à la troisième personne. Dans ce contexte narratif, elle demeure naturelle tout en ne gommant pas formellement le présent historique de Marc.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: L’impératif rend directement l’appel de Jésus sans ajouter un verbe tel que « viens », absent du grec.
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste indique que Lévi se met debout avant de suivre Jésus; le passé simple exprime clairement cette succession.
- source_word: ἠκολούθησεν αὐτῷ
  choice: le suivit
  rationale: Cette traduction conserve le lien verbal avec l’ordre « Suis-moi » et évite une paraphrase interprétative comme « devint son disciple ».
theological_decisions:
- issue: Le présent historique dans le récit de Marc
  choice: Employer « Il lui dit », forme française compatible graphiquement avec le présent et le passé simple, dans un récit au passé.
  alternative: Régulariser explicitement le récit au passé, ou employer « il lui dit alors » sans chercher à refléter le présent historique.
  rationale: Ce choix maintient autant que possible la vivacité et la tension temporelle du grec, sans produire en français une rupture artificielle ou peu naturelle.
- issue: La portée de l’appel « Suis-moi »
  choice: Conserver l’ordre bref et ouvert « Suis-moi ».
  alternative: Expliciter par « Deviens mon disciple » ou « Viens avec moi ».
  rationale: Le grec évoque le fait de suivre Jésus sans préciser ici toutes les implications de cet acte; une paraphrase résoudrait plus que le texte ne le fait.
translation_notes:
  register: Français moderne, clair et digne. Le nom « Jésus » est explicité comme sujet au début du verset afin d’éviter l’ambiguïté d’un pronom isolé hors contexte. Les phrases courtes reproduisent la rapidité du récit de Marc.
