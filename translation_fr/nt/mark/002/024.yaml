id: MRK.2.24
reference: Mark 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: fr
  text: 'Et les pharisiens lui disaient : « Regarde ! Pourquoi font-ils, le jour du sabbat, ce qui n’est pas permis[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regarde ce qu’ils font le jour du sabbat, alors que ce n’est pas permis ! » Le grec τί peut être compris au sens de « ce que », bien que, dans ce contexte, le sens « pourquoi » soit probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, qui maintient l’enchaînement du récit sans ajouter de nuance temporelle.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française conventionnelle de ce groupe, avec l’article défini.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec est rendu par l’imparfait français, ce qui laisse entendre une parole en cours ou répétée.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne naturellement le destinataire de la parole, Jésus.
- source_word: Ἴδε
  choice: Regarde !
  rationale: Impératif servant à attirer vivement l’attention ; cette formulation est actuelle et conserve l’interpellation directe.
- source_word: τί
  choice: Pourquoi
  rationale: 'Dans ce contexte de reproche, τί a vraisemblablement une valeur adverbiale interrogative : « pourquoi ? ». L’autre analyse possible est signalée en note.'
- source_word: ποιοῦσιν
  choice: font-ils
  rationale: Le présent grec est conservé dans le discours direct par un présent français naturel.
- source_word: τοῖς σάββασιν
  choice: le jour du sabbat
  rationale: Le pluriel grec est une tournure idiomatique pouvant désigner le sabbat ; « le jour du sabbat » est clair et naturel en français.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ce qui n’est pas permis
  rationale: Cette expression conserve la portée normative de ἔξεστιν sans préciser indûment la source exacte de l’interdiction.
theological_decisions:
- issue: Nature de l’objection des pharisiens
  choice: ce qui n’est pas permis
  alternative: ce qui est illégal / ce qui est contraire à la Loi
  rationale: Le grec formule une accusation portant sur ce qui est permis, sans préciser s’il s’agit directement de la Loi biblique, d’une tradition pharisienne ou d’une interprétation juridique et religieuse. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « disaient » préserve l’aspect du verbe grec ; « Regarde ! » restitue l’interpellation sans archaïsme. La ponctuation sépare naturellement l’appel à l’attention de la question.
