revisions:
- from: Comme ils ne pouvaient pas le lui amener à cause de la foule[a], ils découvrirent le toit à l’endroit où il se trouvait et, après y avoir creusé une ouverture[b], ils descendent la natte sur laquelle l’homme paralysé était couché[c].
  to: Comme ils ne pouvaient pas le lui amener à cause de la foule[a], ils enlevèrent une partie du toit au-dessus de l’endroit où il se trouvait et, après y avoir creusé une ouverture[b], ils descendent la natte sur laquelle l’homme paralysé était couché[c].
  rationale: La révision clarifie la localisation de l’ouverture par rapport à Jésus et remplace une expression française pouvant être comprise comme la simple exposition d’un toit. Elle conserve le mouvement narratif, l’ambiguïté matérielle du grec quant à la construction du toit, ainsi que le présent historique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:08:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : l’empêchement causé par la foule, les deux référents de « le lui », l’ouverture pratiquée dans le toit, le présent historique de χαλῶσι et la natte sont bien représentés. Toutefois, « découvrirent le toit à l’endroit où il se trouvait » est sémantiquement ambigu en français et peut suggérer que Jésus se trouvait sur le toit. La relation spatiale implicite du grec doit être exprimée plus clairement.'
  naturalness: Le français est globalement moderne et fluide. « Ils découvrirent le toit » est néanmoins moins naturel et moins précis ici que « ils enlevèrent une partie du toit » ; l’ajout de « au-dessus de l’endroit » rend la scène immédiatement intelligible sans modifier son sens.
  terminology: « foule », « homme paralysé », « natte » et « était couché » conviennent au registre et au sens. La note sur « le paralytique » est utile. La clarification des pronoms est également appropriée.
  issues:
  - severity: medium
    issue: Ambiguïté spatiale de « le toit à l’endroit où il se trouvait »
    rationale: Dans cette formulation, « il se trouvait » peut se rattacher au toit ou faire imaginer Jésus sur le toit. Le grec situe l’ouverture du toit par rapport à Jésus, qui se trouve au-dessous. « Au-dessus de l’endroit où il se trouvait » explicite seulement ce que le contexte rend nécessaire.
  - severity: low
    issue: « découvrirent le toit » ne décrit pas clairement l’action sur la toiture
    rationale: En français courant, « découvrir le toit » signifie plus spontanément rendre un toit visible que retirer sa couverture ou une section de celui-ci. « Enlevèrent une partie du toit » rend plus nettement ἀπεστέγασαν tout en évitant de prétendre qu’ils ont ôté la toiture entière.
