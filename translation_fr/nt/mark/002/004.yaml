  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: fr
  text: Comme ils ne pouvaient pas le lui amener à cause de la foule[a], ils enlevèrent une partie du toit au-dessus de l’endroit où il se trouvait et, après y avoir creusé une ouverture[b], ils descendent la natte sur laquelle l’homme paralysé était couché[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « l’amener à lui » : « le » désigne l’homme paralysé et « lui », Jésus.'
    reason: clarification_pronominale
  - marker: b
    text: Ou « après l’avoir percé ». Le verbe grec évoque l’action de creuser ou d’ouvrir en traversant le toit.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit littéralement « le paralytique ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: Comme ils ne pouvaient pas
  rationale: Le participe exprime ici la circonstance causale qui motive l’action suivante; cette tournure est naturelle en français tout en conservant ce lien.
- source_word: προσενέγκαι αὐτῷ
  choice: le lui amener
  rationale: 'Les deux pronoms grecs sont conservés sans la répétition peu naturelle «l’amener à lui»: «le» désigne l’homme paralysé et «lui» Jésus.'
- source_word: διὰ τὸν ὄχλον
  choice: à cause de la foule
  rationale: Rend directement la valeur causale de διά avec l’accusatif et le sens courant de ὄχλος.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: ils découvrirent le toit
  rationale: Le verbe rare indique qu’ils retirent la couverture du toit ou l’ouvrent; «découvrirent le toit» garde l’image sans préciser indûment les matériaux.
- source_word: ὅπου ἦν
  choice: à l’endroit où il se trouvait
  rationale: La proposition localise l’ouverture par rapport à Jésus; la relation verticale ressort déjà du contexte du toit.
- source_word: ἐξορύξαντες
  choice: après y avoir creusé une ouverture
  rationale: Le verbe décrit l’action de creuser ou de percer la structure du toit; l’ajout implicite d’«une ouverture» donne un français clair sans préciser sa composition.
- source_word: χαλῶσι
  choice: ils descendent
  rationale: Le présent français conserve le présent historique grec et sa vivacité narrative.
- source_word: κράβαττον
  choice: la natte
  rationale: Le terme désigne une couche simple et transportable plutôt qu’un lit élaboré; «natte» est actuel et compréhensible.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: sur laquelle l’homme paralysé était couché
  rationale: La relative se rapporte naturellement à la natte. «L’homme paralysé» rend le substantif grec dans un français moderne et respectueux.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du mouvement du grec, tandis que «le lui amener» et «l’homme paralysé» assurent une expression naturelle. Le présent historique de «ils descendent» est volontairement conservé.
