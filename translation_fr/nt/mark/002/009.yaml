id: MRK.2.9
reference: Mark 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: fr
  text: 'Qu’est-ce qui est plus facile : dire à l’homme paralysé : « Tes péchés sont pardonnés[a] », ou dire : « Lève-toi, prends ta natte et marche » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tes péchés ont été pardonnés. » Le verbe grec peut mettre l’accent sur l’état de pardon résultant d’une action accomplie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Qu’est-ce qui est le plus facile
  rationale: Cette formulation française naturelle conserve la comparaison explicite portée par εὐκοπώτερον.
- source_word: εἰπεῖν
  choice: dire
  rationale: Le verbe introduit directement les paroles dans les deux membres de la question.
- source_word: τῷ παραλυτικῷ
  choice: à l’homme paralysé
  rationale: Expression claire et actuelle qui désigne la personne sans recourir au substantif plus traditionnel « paralytique ».
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Tes péchés sont pardonnés
  rationale: Le présent passif grec permet une déclaration centrée sur l’état de pardon, sans préciser davantage le moment de l’action ni son agent.
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: Équivalent français usuel et exact dans ce contexte.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: Impératif naturel en français moderne pour ordonner à l’homme de se relever.
- source_word: ἆρον
  choice: prends
  rationale: Dans ce contexte, le verbe signifie prendre et emporter; « prends » s’intègre naturellement à la suite d’ordres.
- source_word: τὸν κράβαττόν σου
  choice: ta natte
  rationale: κράβαττος désigne une couche simple et transportable; « natte » évite l’image d’un lit moderne volumineux.
- source_word: περιπάτει
  choice: marche
  rationale: Rend directement et naturellement l’impératif présent dans cette suite de commandements.
theological_decisions:
- issue: Formulation de la déclaration de pardon
  choice: Tes péchés sont pardonnés
  alternative: Tes péchés ont été pardonnés
  rationale: Le présent français préserve la force déclarative et l’état résultant exprimé par la forme grecque, sans imposer une chronologie plus précise. Il maintient aussi la tension narrative entre l’autorité invisible de pardonner et la guérison visible.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation rend lisible la question comparative; les impératifs restent directs et concrets.
