source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: fr
  text: Personne ne coud une pièce d’étoffe non rétrécie[a] sur un vieux vêtement ; sinon, la pièce neuve arrache du vieux vêtement, et la déchirure devient pire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’étoffe non foulée ». Le grec désigne une étoffe qui n’a pas encore subi le traitement destiné notamment à la faire rétrécir et à la stabiliser.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la formulation est difficile : « le remplissage enlève de lui, le neuf de l’ancien ». Le sens est que la pièce neuve arrache une partie du vieux vêtement, aggravant ainsi la déchirure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: pièce rapportée
  rationale: Dans le contexte de la réparation d’un vêtement, le terme désigne une pièce ajoutée pour couvrir une déchirure. « Pièce rapportée » est précis et naturel en français.
- source_word: ῥάκους ἀγνάφου
  choice: pièce d’étoffe non rétrécie
  rationale: ἄγναφος qualifie une étoffe qui n’a pas encore subi le traitement qui la stabilise et qui risque donc de rétrécir. Cette formulation rend clairement l’effet pratique visé.
- source_word: ἐπιράπτει
  choice: coud … sur
  rationale: Le verbe signifie fixer en cousant. « Coudre sur » conserve l’action concrète et convient au contexte.
- source_word: ἱμάτιον παλαιόν
  choice: un vieux vêtement
  rationale: ἱμάτιον désigne ici un vêtement sans qu’il soit nécessaire de préciser davantage sa forme.
- source_word: εἰ δὲ μή
  choice: sinon
  rationale: Cette traduction idiomatique exprime directement la conséquence négative envisagée.
- source_word: αἴρει
  choice: s’en détache
  rationale: Dans cette image, le sujet est la pièce qui se sépare du vêtement et emporte avec elle une partie de l’ancien tissu. « Se détache » rend ce mouvement sans surinterpréter le mécanisme.
- source_word: τὸ πλήρωμα
  choice: la pièce rapportée
  rationale: Le mot désigne littéralement ce qui remplit ou complète, ici la pièce placée sur la déchirure.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: la neuve de l’ancien
  rationale: La formulation conserve le contraste elliptique et quelque peu abrupt du grec entre le neuf et l’ancien, tout en restant compréhensible grâce au contexte.
- source_word: χεῖρον σχίσμα γίνεται
  choice: la déchirure devient pire
  rationale: Cette formulation suit de près le grec, où le comparatif χεῖρον qualifie l’aggravation de la déchirure existante.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le vocabulaire concret de la couture est conservé, et l’ellipse « la neuve de l’ancien » maintient la tension de la formulation grecque, éclairée par une note.
