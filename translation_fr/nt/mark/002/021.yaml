revisions:
- from: Personne ne coud une pièce d’étoffe non rétrécie[a] sur un vieux vêtement ; sinon, la pièce rapportée s’en détache — la neuve de l’ancien — et la déchirure devient pire.[b]
  to: Personne ne coud une pièce d’étoffe non rétrécie[a] sur un vieux vêtement ; sinon, la pièce neuve arrache du vieux vêtement, et la déchirure devient pire.[b]
  rationale: La révision conserve l’image concrète et les termes principaux du grec, mais rend αἴρει par « arrache » plutôt que par un simple « se détache ». Elle évite une ellipse française opaque et réserve à la note l’explication de la syntaxe grecque disputée/difficile, sans prétendre la résoudre au-delà du sens contextuel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:08:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : une pièce neuve/non rétrécie cousue sur un vêtement ancien produit une déchirure aggravée. Toutefois, « la pièce rapportée s’en détache » simplifie et déplace légèrement l’ellipse grecque, où « le remplissage/la pièce neuve enlève de lui, [à savoir] le neuf de l’ancien ». Une formulation qui exprime que la pièce neuve arrache du vieux tissu est plus fidèle à l’image et au texte.'
  naturalness: Le français est globalement naturel et de registre approprié. « La neuve de l’ancien » est toutefois elliptique de manière peu idiomatique en français, sans reproduire clairement le rapport syntaxique difficile du grec. « Elle arrache du vieux vêtement la pièce neuve » est plus lisible tout en laissant apparaître la difficulté dans une note.
  terminology: '« Étoffe non rétrécie », « vieux vêtement » et « déchirure » conviennent. « Pièce d’étoffe » est naturel; « pièce rapportée » peut être évité dans le texte courant afin de ne pas varier inutilement avec « pièce ». La note sur ἄγναφος est adéquate. La note sur le membre difficile doit être corrigée : « enlève de lui » n’est pas suffisamment explicite et l’explication actuelle affirme un simple détachement plutôt que l’arrachement impliqué par l’image.'
  issues:
  - severity: medium
    issue: Rendu de αἴρει τὸ πλήρωμα ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ
    rationale: « La pièce rapportée s’en détache » ne rend pas l’idée de retrait/arrachement (αἴρει) et transforme la construction elliptique en une séparation sans complément. Le sens contextuel est que la pièce neuve, en se rétractant, enlève/arrache au vieux vêtement une portion de tissu, ce qui augmente la déchirure.
  - severity: low
    issue: Ellipse « la neuve de l’ancien »
    rationale: Cette reproduction très littérale est opaque en français moderne. Une traduction explicite dans le texte, accompagnée d’une note signalant la formulation grecque difficile, préserve mieux à la fois lisibilité et prudence interprétative.
