id: MRK.2.11
reference: Mark 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: fr
  text: 'Je te le dis : lève-toi, prends ta natte[a] et va chez toi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta couche ». Le mot grec désigne une natte ou un lit rudimentaire que l’on pouvait transporter.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « va vers ta maison » ou « va dans ta maison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Je te le dis
  rationale: Le pronom datif placé en tête porte une certaine insistance. « Je te le dis » rend naturellement en français l’adresse personnelle et l’autorité de la formule, sans forcer l’emphase avec une tournure artificielle comme « À toi, je dis ».
- source_word: ἔγειρε
  choice: lève-toi
  rationale: Cet impératif exprime l’action immédiate demandée à l’homme paralysé. « Lève-toi » est direct, actuel et naturel.
- source_word: ἆρον
  choice: prends
  rationale: Dans ce contexte, le verbe désigne le fait de soulever et d’emporter la natte. « Prends » s’intègre naturellement à la suite d’ordres tout en restant fidèle à l’action concrète.
- source_word: κράβαττόν
  choice: natte
  rationale: Le terme désigne une couche simple et transportable, plutôt qu’un lit avec cadre. « Natte » est clair en français moderne et explique pourquoi l’homme peut l’emporter.
- source_word: ὕπαγε
  choice: va
  rationale: L’impératif est rendu simplement par « va », formulation directe et naturelle, sans le registre soutenu de « pars » ou « retire-toi ».
- source_word: εἰς τὸν οἶκόν σου
  choice: chez toi
  rationale: Littéralement, l’expression signifie « vers/dans ta maison ». « Chez toi » en donne l’équivalent idiomatique en français moderne sans ajouter explicitement l’idée de retour.
theological_decisions:
- issue: Le ton et la portée de l’ordre de guérison prononcé par Jésus
  choice: 'Une adresse personnelle suivie de trois impératifs directs : « Je te le dis : lève-toi, prends ta natte et va chez toi. »'
  alternative: 'Une formulation plus traditionnelle : « Je te le dis, lève-toi, emporte ton lit et va dans ta maison. »'
  rationale: Le texte présente une parole immédiate et pleine d’autorité. La traduction conserve cette force et l’enchaînement des ordres sans ajouter d’explication théologique à la guérison.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au pronom grec singulier. Les impératifs sont courants et immédiatement compréhensibles; « chez toi » évite une traduction littérale peu naturelle tout en conservant le sens.
