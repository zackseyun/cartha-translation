id: MRK.2.15
reference: Mark 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: fr
  text: Il arriva que Jésus était à table dans sa maison[a]. Beaucoup de collecteurs d’impôts et de pécheurs étaient à table avec lui et ses disciples, car ils étaient nombreux à le suivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la maison de Lévi »; certains comprennent « dans la maison de Jésus ». Le grec dit seulement « dans sa maison ».
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: Il arriva que
  rationale: Le présent historique de Marc fait progresser vivement le récit; le passé simple convient ici à une narration française naturelle et digne.
- source_word: κατακεῖσθαι
  choice: était à table
  rationale: Le verbe désigne la posture allongée adoptée pendant le repas. La formulation française exprime naturellement la situation sans suggérer que Jésus était simplement couché.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: dans sa maison
  rationale: Cette traduction conserve le possessif grec et son antécédent ambigu.
- source_word: τελῶναι
  choice: collecteurs d’impôts
  rationale: Expression moderne et claire pour les agents chargés de percevoir les taxes et droits.
- source_word: ἁμαρτωλοὶ
  choice: pécheurs
  rationale: Équivalent direct qui conserve la désignation religieuse et sociale du texte sans l’expliciter davantage.
- source_word: συνανέκειντο
  choice: étaient à table avec lui
  rationale: Rend à la fois le contexte du repas et l’association avec Jésus. Le pronom « lui » évite en français une répétition lourde du nom de Jésus.
- source_word: μαθηταῖς
  choice: disciples
  rationale: Terme français établi, qui conserve la relation d’apprentissage et d’attachement.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: car ils étaient nombreux
  rationale: Conserve la valeur explicative de γάρ et rattache naturellement le grand nombre aux personnes évoquées.
- source_word: ἠκολούθουν αὐτῷ
  choice: à le suivre
  rationale: Dans la construction « ils étaient nombreux à », l’infinitif exprime naturellement l’action continue de l’imparfait grec.
theological_decisions:
- issue: Antécédent de « sa maison » (αὐτοῦ)
  choice: Le texte principal garde « sa maison » sans nommer le propriétaire.
  alternative: « la maison de Lévi » ou « la maison de Jésus »
  rationale: Le pronom grec ne permet pas de trancher explicitement. Lévi est souvent compris comme l’antécédent d’après le verset précédent, mais Jésus reste grammaticalement et contextuellement possible. L’ambiguïté est donc préservée et signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Était à table » privilégie l’usage courant tout en conservant clairement le cadre du repas; la note maintient l’ambiguïté réelle du possessif grec.
