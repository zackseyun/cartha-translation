source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: fr
  text: 'Quand Jésus entend cela, il leur dit : « Ce ne sont pas ceux qui sont forts[a] qui ont besoin d’un médecin, mais ceux qui sont malades. Je ne suis pas venu appeler des justes[b], mais des pécheurs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont en bonne santé » ; le grec désigne littéralement ceux qui sont forts ou vigoureux.
    reason: lexical_alternative
  - marker: b
    text: 'Dans ce contexte, « les justes » peut s’entendre de manière ironique : ceux qui sont tenus pour justes ou qui se considèrent comme tels. Le grec dit simplement « les justes ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Quand Jésus entend cela
  rationale: Le participe aoriste exprime naturellement une circonstance temporelle antérieure ou concomitante au verbe principal. « Cela » explicite en français l’objet sous-entendu par le grec et renvoie aux propos précédents.
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent français conserve le présent historique de Marc et sa vivacité narrative.
- source_word: οἱ ἰσχύοντες
  choice: ceux qui sont forts
  rationale: Cette formulation garde le sens premier de ἰσχύω, « être fort, avoir de la vigueur », sans réduire d’emblée l’expression à « bien portants ».
- source_word: χρείαν ἔχουσιν
  choice: ont besoin
  rationale: Équivalent idiomatique et naturel en français de l’expression grecque signifiant « avoir besoin ».
- source_word: ἰατροῦ
  choice: d’un médecin
  rationale: « Médecin » est le terme français courant, précis et digne pour la personne qui soigne.
- source_word: οἱ κακῶς ἔχοντες
  choice: ceux qui sont malades
  rationale: L’expression idiomatique grecque désigne ici, dans le contraste médical, ceux qui sont souffrants ou malades.
- source_word: οὐκ ἦλθον
  choice: Je ne suis pas venu
  rationale: Le passé composé est l’expression française naturelle d’une venue passée dont la finalité demeure pertinente dans la scène.
- source_word: καλέσαι
  choice: appeler
  rationale: « Appeler » préserve la portée ouverte du verbe, qui peut évoquer une convocation ou une invitation sans imposer une précision absente du texte.
- source_word: δικαίους
  choice: des justes
  rationale: L’adjectif substantivé désigne des personnes justes. L’article grec générique se rend naturellement ici par « des » après le verbe appeler.
- source_word: ἁμαρτωλούς
  choice: des pécheurs
  rationale: Rendu traditionnel, clair et exact de l’adjectif substantivé désignant ceux qui pèchent.
theological_decisions:
- issue: Portée éventuellement ironique de « justes »
  choice: Conserver simplement « des justes » dans le texte
  alternative: « ceux qui se croient justes » ou « les prétendus justes »
  rationale: Le contexte peut suggérer une nuance ironique ou viser ceux qui se considèrent comme justes, mais le grec dit seulement « justes ». La traduction maintient donc la tension sans trancher.
- issue: Sens de « appeler »
  choice: Ne pas préciser le but de l’appel
  alternative: « appeler à la repentance »
  rationale: Le texte critique ne contient pas ici de complément tel que « à la repentance ». L’ajouter résoudrait une implicitation en important une précision textuellement absente.
- issue: Métaphore médicale et qualification des premiers personnages
  choice: Traduire littéralement « ceux qui sont forts » avec une note
  alternative: « ceux qui sont en bonne santé » ou « les bien-portants »
  rationale: Le choix conserve la formulation grecque tout en permettant au lecteur, grâce à la note, d’entendre son sens médical contextuel.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique de Marc est conservé. Le parallélisme de la parole de Jésus et les catégories morales du grec restent visibles, tandis que les notes signalent les principales possibilités lexicales et contextuelles sans les imposer au texte.
