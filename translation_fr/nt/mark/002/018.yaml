source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: fr
  text: 'Les disciples de Jean et les pharisiens jeûnaient. Ils viennent lui dire[a] : « Pourquoi les disciples de Jean et les disciples des pharisiens jeûnent-ils, mais tes disciples ne jeûnent pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils viennent et lui disent ». En grec, aucun sujet nominal n’est exprimé pour « viennent » et « disent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: jeûnaient
  rationale: La construction périphrastique à l’imparfait décrit une action en cours dans le passé. L’imparfait français la rend naturellement.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: les disciples de Jean
  rationale: Cette formulation française naturelle conserve la relation exprimée par le génitif.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe juif ; la minuscule convient au nom commun désignant ses membres.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: Des gens viennent dire
  rationale: Le présent conserve la vivacité des présents historiques de Marc. Comme le sujet grec est sous-entendu et non identifié, « des gens » exprime sans fausse précision la présence d’un sujet humain indéterminé ; « viennent dire » est plus naturel en français que la coordination littérale.
- source_word: αὐτῷ
  choice: à Jésus
  rationale: Le pronom renvoie clairement à Jésus dans le contexte ; reprendre son nom évite en français une ambiguïté référentielle sans préciser l’identité des interlocuteurs.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif français direct et idiomatique.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: les disciples des pharisiens
  rationale: La formulation conserve explicitement la relation génitive sans l’assimiler aux pharisiens eux-mêmes.
- source_word: νηστεύουσιν
  choice: jeûnent
  rationale: Le présent simple convient à une pratique habituelle et maintient le contraste avec « ne jeûnent pas ».
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: tandis que tes disciples
  rationale: « Tandis que » marque clairement le contraste porté par δέ ; « tes » rend naturellement le possessif emphatique σοί.
theological_decisions:
- issue: Identité du sujet de « viennent dire »
  choice: Sujet rendu de manière indéterminée par « des gens », avec une note signalant l’implicite grec.
  alternative: Rattacher « ils » aux disciples de Jean et aux pharisiens mentionnés dans la phrase précédente.
  rationale: Le grec ne formule pas le sujet de ἔρχονται et λέγουσιν. Une désignation plus précise trancherait une ambiguïté narrative que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif préserve la vivacité propre à Marc, tandis que l’imparfait initial rend l’action en cours. La question suit une syntaxe française naturelle sans atténuer le contraste.
