id: MRK.2.22
reference: Mark 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: fr
  text: 'Personne ne met non plus du vin nouveau dans de vieilles outres. Sinon, le vin fera éclater les outres : le vin sera perdu[a], et les outres aussi. Mais le vin nouveau va dans des outres neuves.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera gâché » ou « sera détruit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: met
  rationale: Dans le contexte d’un liquide placé dans un récipient, « met » reste naturel tout en conservant la portée générale du verbe grec, sans préciser davantage le geste comme le ferait « verse ».
- source_word: οἶνον νέον
  choice: du vin nouveau / le vin nouveau
  rationale: « Vin nouveau » est l’expression française habituelle pour un vin récemment produit et préserve directement l’image du texte.
- source_word: ἀσκούς
  choice: outres
  rationale: Une outre est un récipient en peau destiné notamment au vin. Le terme français est précis, courant dans le contexte biblique et conserve l’image culturelle.
- source_word: παλαιούς
  choice: vieilles
  rationale: « Vieilles » traduit directement l’âge des outres sans expliciter par « usées » la conséquence implicite de cet âge.
- source_word: ῥήξει
  choice: fera éclater
  rationale: La construction causative exprime clairement que la pression du vin provoquera la rupture des outres.
- source_word: ἀπόλλυται
  choice: sera perdu
  rationale: Le verbe peut indiquer la perte ou la destruction. « Sera perdu » rend naturellement ici le gaspillage du vin sans imposer l’idée plus précise qu’il serait seulement gâté.
- source_word: καινούς
  choice: neuves
  rationale: « Neuves » exprime l’état intact et approprié des outres, en contraste avec « vieilles », et reflète la nuance qualitative de καινός.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Mais le vin nouveau va dans des outres neuves
  rationale: Le grec omet le verbe. « Va dans » complète naturellement la phrase en français et présente une règle générale sans introduire l’obligation explicite de « doit être mis ».
theological_decisions:
- issue: Portée de la dernière proposition elliptique
  choice: 'Une règle générale : « le vin nouveau va dans des outres neuves »'
  alternative: « Il faut mettre le vin nouveau dans des outres neuves » ou « On met le vin nouveau dans des outres neuves »
  rationale: Le grec ne comporte aucun verbe dans la dernière proposition. La formulation retenue garde la concision proverbiale et évite d’ajouter une obligation ou un commandement absent de la forme grecque.
- issue: Sens de ἀπόλλυται appliqué au vin
  choice: « sera perdu »
  alternative: « sera gâché » ou « sera détruit »
  rationale: Le contexte permet plusieurs nuances pratiques. « Perdu » conserve l’étendue sémantique du verbe sans trancher inutilement entre gaspillage, détérioration et destruction.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Personne ne met non plus » rattache naturellement ce deuxième exemple au précédent. Les deux-points rendent lisibles les conséquences parallèles, tandis que la dernière phrase conserve la force concise d’un principe général.
