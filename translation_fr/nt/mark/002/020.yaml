id: MRK.2.20
reference: Mark 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: fr
  text: Mais des jours viendront où l’époux leur sera enlevé ; alors, ce jour-là[a], ils jeûneront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en ce jour-là ». Le grec est au singulier, et non « en ces jours-là ».'
    reason: Préciser la forme singulière de l’expression grecque et signaler sa traduction plus littérale.
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Mais des jours viendront
  rationale: Cette tournure française naturelle conserve l’expression temporelle grecque et rend δέ par « Mais », qui marque le contraste avec la situation présente.
- source_word: ὅταν
  choice: où
  rationale: Après « des jours viendront », le relatif temporel « où » exprime naturellement en français l’événement futur introduit par ὅταν, sans lui donner une valeur répétitive.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: leur sera enlevé
  rationale: Le passif est conservé, sans préciser l’agent ni la manière de l’enlèvement. Le pronom « leur » exprime de façon idiomatique la séparation marquée par ἀπ’ αὐτῶν.
- source_word: ὁ νυμφίος
  choice: l’époux
  rationale: « L’époux » est le terme biblique français courant pour le marié dans cette métaphore nuptiale ; il reste digne et compréhensible sans expliciter l’identification à Jésus.
- source_word: καὶ τότε
  choice: alors
  rationale: « Alors » maintient clairement la succession entre l’enlèvement de l’époux et le jeûne.
- source_word: νηστεύσουσιν
  choice: ils jeûneront
  rationale: Le verbe « jeûner » rend directement le futur de νηστεύω et conserve la portée religieuse de la pratique.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ce jour-là
  rationale: Cette expression idiomatique française conserve le singulier et la désignation précise du jour, tout en évitant le tour moins naturel « en ce jour-là » dans le texte principal.
theological_decisions:
- issue: Identification métaphorique de Jésus comme l’époux
  choice: Conserver « l’époux » sans expliciter qu’il s’agit de Jésus.
  alternative: Remplacer la métaphore par « quand je leur serai enlevé ».
  rationale: Le contexte permet de comprendre que Jésus parle de lui-même, mais le grec maintient la métaphore nuptiale. La traduction en préserve donc la force littéraire et théologique.
- issue: Nature de l’enlèvement de l’époux
  choice: Employer le passif « leur sera enlevé » sans nommer l’agent ni préciser qu’il s’agit de la mort.
  alternative: Traduire « leur sera enlevé par la mort » ou « leur sera arraché ».
  rationale: Le passage anticipe l’éloignement de Jésus, généralement associé à sa mort, mais le verset ne précise ni l’agent ni la manière. Le passif conserve cette retenue et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule rend nettement la progression de la phrase, tandis que « ce jour-là » maintient l’insistance singulière du grec sans lourdeur.
