source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: fr
  text: Il sortit de nouveau le long de la mer[a]. Toute la foule venait à lui[b], et il les enseignait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près de la mer ».'
    reason: lexical_alternative
  - marker: b
    text: Les verbes « venait » et « enseignait » traduisent des imparfaits grecs, qui peuvent décrire des actions en cours ou répétées dans le passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: L’aoriste de ἐξέρχομαι désigne simplement le fait de sortir. Le passé simple convient au registre narratif biblique moderne sans ajouter un lieu de départ absent du grec.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend clairement l’idée de répétition exprimée par πάλιν; « encore » serait également possible, mais peut être moins net ici.
- source_word: παρὰ τὴν θάλασσαν
  choice: le long de la mer
  rationale: Avec l’accusatif, παρά peut présenter le déplacement ou la présence le long du rivage. Cette formulation française s’accorde naturellement avec le verbe de mouvement.
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Équivalent français naturel de la construction grecque πᾶς ὁ suivie d’un nom collectif singulier.
- source_word: ἤρχετο
  choice: venait
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et maintient l’action en cours sans imposer l’idée plus forte de répétition contenue dans « ne cessait de venir ».
- source_word: πρὸς αὐτόν
  choice: à lui
  rationale: Après « venait », cette expression rend idiomatiquement le mouvement en direction de Jésus.
- source_word: ἐδίδασκεν
  choice: enseignait
  rationale: L’imparfait conserve l’aspect duratif de l’imparfait grec et reste naturel en français.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom objet reprend la foule en visant les personnes qui la composent; le pluriel du grec est ainsi préservé naturellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple fait avancer le récit, tandis que les imparfaits « venait » et « enseignait » conservent le contraste aspectuel du grec. « La mer » est maintenu conformément au texte source; le contexte désigne la mer de Galilée.
