  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: fr
  text: 'Mais il leur répondit : « Que vous a commandé Moïse ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Connecteur léger marquant ici le tournant de la réplique et un léger contraste avec la question destinée à mettre Jésus à l’épreuve.
- source_word: ἀποκριθεὶς εἶπεν
  choice: il répondit
  rationale: Cette tournure grecque, littéralement « ayant répondu, il dit », exprime naturellement en français une seule idée verbale de réponse.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif désigne les destinataires de la réponse ; « leur répondit » est la formulation française idiomatique.
- source_word: Τί
  choice: Que
  rationale: Le pronom interrogatif demande le contenu du commandement ; devant « commander », « Que » est naturel et précis.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif indique les destinataires du commandement et se rend naturellement par le complément d’objet indirect de « commander ».
- source_word: ἐνετείλατο
  choice: a commandé
  rationale: Le verbe désigne une prescription faisant autorité. Le passé composé est naturel dans le dialogue français actuel tout en conservant la référence à l’ordre donné par Moïse.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française conventionnelle du nom propre biblique.
theological_decisions:
- issue: Référence à l’autorité mosaïque dans la réponse de Jésus
  choice: Conserver Moïse comme médiateur humain explicitement nommé du commandement.
  alternative: « Que vous commande la loi de Moïse ? » ou « Que Dieu vous a-t-il commandé par Moïse ? »
  rationale: Le grec nomme explicitement Moïse sans ajouter « la Loi » ni « Dieu par Moïse ». La traduction préserve cette formulation sans explicitation théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative « Que vous a commandé Moïse ? » maintient l’accent initial du grec sur le contenu demandé et reste naturelle dans un registre écrit courant.
