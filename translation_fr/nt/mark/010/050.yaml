  text: ὁ δὲ ἀποβαλὼν τὸ ἱμάτιον αὐτοῦ ⸀ἀναπηδήσας ἦλθεν πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: fr
  text: Alors, rejetant son manteau[a], il se leva d’un bond et vint vers Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rejetant son vêtement extérieur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: rejetant
  rationale: Le participe aoriste de ἀποβάλλω exprime ici un geste décidé et brusque. « Rejetant » garde cette vivacité sans suggérer simplement qu’il enlève soigneusement le vêtement.
- source_word: ἱμάτιον
  choice: manteau
  rationale: Ἱμάτιον désigne couramment le vêtement extérieur. « Manteau » est naturel, précis et adapté au contexte narratif.
- source_word: ἀναπηδήσας
  choice: se leva d’un bond
  rationale: Le verbe évoque un mouvement soudain et énergique. « Se leva d’un bond » restitue clairement cet empressement en français actuel.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: vint vers Jésus
  rationale: La construction avec πρός indique un mouvement en direction de Jésus. « Vint vers Jésus » conserve ce point de vue narratif et reste idiomatique.
- source_word: δὲ
  choice: Alors
  rationale: δέ est ici un connecteur narratif léger. « Alors » fait progresser naturellement le récit sans introduire un contraste excessif.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve la succession rapide des deux participes grecs et l’énergie du geste.
