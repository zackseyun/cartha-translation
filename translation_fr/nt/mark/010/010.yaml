reference: Mark 10:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: fr
  text: Puis, dans la maison, les disciples l’interrogeaient de nouveau à ce sujet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puis, de nouveau dans la maison, les disciples l’interrogeaient à ce sujet. »'
    reason: ambiguïté syntaxique concernant le rattachement de πάλιν
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Connecteur narratif naturel en français, reliant cette scène privée à l’échange précédent sans alourdir la phrase.
- source_word: εἰς τὴν οἰκίαν
  choice: une fois de retour dans la maison
  rationale: La préposition εἰς exprime littéralement un mouvement vers l’intérieur; dans ce contexte narratif, la formule française rend naturellement le retour dans un cadre privé.
- source_word: πάλιν
  choice: de nouveau
  rationale: La place de πάλιν permet de le rattacher soit au retour dans la maison, soit à l’interrogation. Le texte principal retient son lien naturel avec l’interrogation en français, tout en signalant l’autre lecture en note.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: L’article désigne le groupe déjà connu; il n’est pas nécessaire d’ajouter « ses ».
- source_word: περὶ τούτου
  choice: à ce sujet
  rationale: Expression française concise et naturelle renvoyant à la question du divorce abordée juste avant.
- source_word: ἐπηρώτων
  choice: l’interrogeaient
  rationale: L’imparfait grec présente l’interrogation comme en cours ou répétée; l’imparfait français en conserve l’aspect sans ajouter explicitement une valeur inchoative.
- source_word: αὐτόν
  choice: l’
  rationale: Pronom objet renvoyant à Jésus, rendu conformément à l’usage français.
theological_decisions:
- issue: Portée de πάλιν (« de nouveau »)
  choice: Rattacher « de nouveau » à l’interrogation des disciples
  alternative: 'Le rattacher au retour ou à la présence dans la maison : « de nouveau dans la maison »'
  rationale: L’ordre grec est ambigu, mais le contexte permet naturellement de comprendre que les disciples reprennent en privé la question déjà traitée publiquement. Une note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. « Une fois de retour » explicite naturellement la valeur directionnelle de εἰς sans transformer la scène; « l’interrogeaient » conserve l’imparfait grec.
