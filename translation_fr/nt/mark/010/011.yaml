source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: fr
  text: 'Il leur dit : « Celui qui divorce de sa femme et épouse une autre femme commet un adultère contre elle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent de narration conserve le présent historique caractéristique du récit de Marc tout en restant naturel en français.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif est rendu naturellement par le pronom complément indirect « leur ».
- source_word: Ὃς ἂν
  choice: Celui qui
  rationale: Cette tournure française exprime naturellement la condition générale indéfinie introduite par le relatif avec ἄν.
- source_word: ἀπολύσῃ
  choice: divorce de
  rationale: Dans ce contexte conjugal, le verbe désigne le divorce, et non un simple renvoi.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: Le contexte du mariage et du divorce impose ici le sens d’« épouse » ou de « femme mariée ».
- source_word: γαμήσῃ ἄλλην
  choice: en épouse une autre
  rationale: Le pronom « en » reprend naturellement « femme », tandis que « une autre » conserve le féminin implicite de ἄλλην. Le verbe « épouser » convient mieux que la construction moins idiomatique « se marier avec » dans cette phrase.
- source_word: μοιχᾶται
  choice: commet un adultère
  rationale: Expression française courante et précise pour désigner l’acte d’adultère.
- source_word: ἐπ’ αὐτήν
  choice: envers elle
  rationale: Cette formulation conserve l’idée que l’adultère constitue une faute commise à l’égard de la première femme, sans réduire la phrase à une simple constatation générale.
theological_decisions:
- issue: Maintien de la portée de ἐπ’ αὐτήν comme tort fait à l’épouse
  choice: « commet un adultère envers elle »
  alternative: « commet un adultère » ou « commet un adultère avec l’autre »
  rationale: Le complément grec est explicite et souligne que l’acte porte atteinte à la femme répudiée. « Envers elle » en conserve la portée relationnelle sans ajouter d’interprétation doctrinale.
- issue: Formulation générique au masculin singulier
  choice: « Celui qui »
  alternative: « Quiconque » ou « Tout homme qui »
  rationale: « Celui qui » rend la construction indéfinie générale tout en laissant le contexte préciser qu’il s’agit ici d’un mari; « tout homme » expliciterait inutilement ce que la grammaire et le contexte indiquent déjà.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif est conservé. La syntaxe reste concise, et « envers elle » préserve l’accent du grec sur le tort fait à l’épouse.
