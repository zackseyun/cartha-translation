source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: fr
  text: 'Jacques et Jean, les fils de Zébédée, s’approchent de Jésus et lui disent : « Maître, nous voulons que tu fasses pour nous tout ce que nous te demanderons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: s’approchent de Jésus
  rationale: Le verbe exprime un mouvement en direction de quelqu’un. « S’approchent de Jésus » est naturel en français et explicite le référent du pronom sans ajouter d’idée étrangère au contexte. Le présent grec, employé dans le récit, est conservé comme présent narratif.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: les fils de Zébédée
  rationale: Cette formulation restitue directement l’apposition et le génitif d’identification du grec.
- source_word: λέγοντες αὐτῷ
  choice: et lui disent
  rationale: Le participe grec est rendu par un verbe coordonné, tournure plus naturelle en français narratif, tandis que le complément « lui » est préservé.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe à Jésus, « Maître » est le terme français courant et digne pour un enseignant reconnu; il conserve ici la fonction de titre d’adresse sans introduire un titre confessionnel.
- source_word: θέλομεν ἵνα
  choice: nous voulons que
  rationale: La construction française avec « vouloir que » et le subjonctif rend naturellement la volonté exprimée et la proposition introduite par ἵνα.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: tout ce que nous te demanderons
  rationale: La relative indéfinie avec ἐάν a le sens de « tout ce que / quoi que ». Le futur français convient à la demande encore à formuler et garde son caractère ouvert.
- source_word: ποιήσῃς ἡμῖν
  choice: tu fasses pour nous
  rationale: Cette traduction conserve le sens large de ποιέω (« faire ») et le bénéficiaire exprimé par ἡμῖν, sans interpréter prématurément le verbe comme « accorder ».
