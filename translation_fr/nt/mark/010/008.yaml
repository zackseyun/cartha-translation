  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: fr
  text: Et les deux deviendront une seule chair[a]. Ainsi, ils ne sont plus deux, mais une seule chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, le grec emploie « seront » avec une expression indiquant l’aboutissement en une seule chair.
    reason: La construction grecque emploie le verbe « être » avec une préposition indiquant l’aboutissement, là où le français idiomatique dit « deviendront ».
lexical_decisions:
- source_word: ἔσονται … εἰς
  choice: deviendront
  rationale: Pris avec εἰς et l’attribut à l’accusatif, le verbe εἰμί exprime ici l’aboutissement à une nouvelle unité. « Deviendront » est l’équivalent idiomatique naturel en français.
- source_word: οἱ δύο
  choice: les deux
  rationale: Cette formulation conserve la dualité explicitement soulignée dans la citation, puis reprise dans le contraste « ils ne sont plus deux ».
- source_word: σάρκα μίαν / μία σάρξ
  choice: une seule chair
  rationale: « Chair » maintient le lien verbal et conceptuel avec la Genèse. L’ajout de « seule » rend naturellement en français la place emphatique de μία et renforce le contraste avec « deux » sans réduire l’expression à la seule union corporelle.
- source_word: ὥστε
  choice: Ainsi
  rationale: Le terme introduit ici la conséquence ou la déduction tirée de l’affirmation précédente. « Ainsi » exprime clairement ce lien dans un registre digne et courant.
- source_word: οὐκέτι
  choice: ne … plus
  rationale: C’est l’expression française concise et naturelle de la cessation indiquée par οὐκέτι.
- source_word: ἀλλά
  choice: mais
  rationale: « Mais » préserve l’opposition centrale entre « deux » et « une seule chair ».
theological_decisions:
- issue: Sens de l’expression « une seule chair » dans la citation de la Genèse
  choice: Conserver l’expression biblique « une seule chair » sans l’expliciter.
  alternative: un seul corps ; une seule personne ; unis sexuellement
  rationale: Le texte ne réduit pas lui-même cette union conjugale à une seule de ses dimensions. La formulation source en préserve toute la portée anthropologique et théologique ainsi que l’intertextualité avec la Genèse.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition de « une seule chair » est volontairement conservée, car elle structure l’argument du verset.
