id: MRK.10.47
reference: Mark 10:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: fr
  text: 'Quand il entendit que c’était Jésus le Nazaréen[a], il se mit à crier : « Jésus, Fils de David, aie compassion de moi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus de Nazareth ». Le grec porte littéralement « Jésus le Nazaréen », sous forme d’épithète plutôt que d’expression géographique explicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Quand il entendit
  rationale: Le participe aoriste antérieur au verbe principal reçoit naturellement une valeur temporelle en français et conserve la succession des actions.
- source_word: Ναζαρηνός
  choice: le Nazaréen
  rationale: L’adjectif grec fonctionne ici comme une épithète. « Le Nazaréen » en conserve la forme, tandis que « de Nazareth » expliciterait davantage le rapport géographique.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: il se mit à crier
  rationale: « Se mit à » exprime l’aspect inchoatif de ἤρξατο. En français naturel, les deux infinitifs grecs sont ici réunis dans l’introduction de la parole directe, sans atténuer la force de κράζειν.
- source_word: κράζειν
  choice: à crier
  rationale: Le verbe exprime un appel fort et pressant, sans nécessairement suggérer la colère.
- source_word: Υἱὲ Δαυὶδ
  choice: Fils de David
  rationale: La traduction littérale préserve la forme traditionnelle du titre ainsi que sa portée royale et messianique possible dans le récit.
- source_word: ἐλέησόν με
  choice: aie compassion de moi
  rationale: Cette formule rend l’impératif d’ἐλεέω comme un appel grave à la compassion. Elle est naturelle en français moderne tout en gardant une tonalité biblique digne.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Le nom propre suit sa forme française conventionnelle.
theological_decisions:
- issue: Portée messianique de « Fils de David »
  choice: Conserver « Fils de David » comme titre adressé à Jésus.
  alternative: Traduire plus généralement par « descendant de David ».
  rationale: Dans le récit de Marc, cette adresse peut porter une signification royale et messianique. La formulation littérale évite de réduire le titre à une simple indication généalogique.
- issue: Traduction de Ναζαρηνός
  choice: Employer « le Nazaréen ».
  alternative: Employer « de Nazareth ».
  rationale: Le grec présente une épithète adjectivale. La traduction retenue en préserve la forme, tandis que l’autre possibilité en donne explicitement le sens géographique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde l’urgence de l’appel et le titre traditionnel « Fils de David ». La coordination grecque « crier et dire » est rendue idiomatiquement par « crier » suivi des deux-points et de la parole directe.
