id: MRK.10.1
reference: Mark 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: fr
  text: De là, il se lève et se rend dans le territoire de la Judée et au-delà du Jourdain.[a] De nouveau, des foules se rassemblent auprès de lui et, comme il en avait l’habitude, il se remet à les enseigner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation grecque peut aussi se comprendre ainsi : « dans le territoire de la Judée situé au-delà du Jourdain ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: De là
  rationale: Rend directement l’adverbe spatial qui renvoie au lieu précédent, dans un français naturel.
- source_word: ἀναστὰς
  choice: il se lève
  rationale: Conserve l’idée de se lever avant le départ, sans connotation de résurrection. La coordination française exprime naturellement la succession portée par le participe grec.
- source_word: ἔρχεται
  choice: se rend
  rationale: Exprime idiomatiquement le déplacement vers une destination tout en maintenant le présent narratif caractéristique de Marc.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: le territoire de la Judée
  rationale: Dans ce contexte de déplacement, ὅρια désigne une région ou un territoire plutôt qu’une simple ligne frontalière.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: et au-delà du Jourdain
  rationale: Suit l’ordre et la formulation condensée du grec sans trancher silencieusement la relation géographique exacte avec la Judée.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: des foules se rassemblent auprès de lui
  rationale: Communique naturellement le mouvement collectif de foules qui convergent vers Jésus.
- source_word: πάλιν
  choice: De nouveau / se remet à
  rationale: Les deux occurrences sont représentées, la seconde par la tournure idiomatique « se remet à », afin de conserver l’insistance de Marc sans lourdeur excessive.
- source_word: ὡς εἰώθει
  choice: comme il en avait l’habitude
  rationale: Rend clairement le caractère habituel de l’action avec une tournure française courante et digne.
- source_word: ἐδίδασκεν αὐτούς
  choice: il se remet à les enseigner
  rationale: Exprime l’action répétée et durative de l’imparfait grec dans un français fluide.
theological_decisions:
- issue: Présent historique du récit
  choice: 'Maintien du présent : « il se lève et se rend »'
  alternative: 'Employer le passé simple : « il se leva et se rendit »'
  rationale: Le présent conserve la vivacité narrative de Marc et demeure naturel en français.
- issue: Rapport syntaxique de καὶ πέραν τοῦ Ἰορδάνου avec la Judée
  choice: « dans le territoire de la Judée et au-delà du Jourdain »
  alternative: « dans le territoire de la Judée situé au-delà du Jourdain »
  rationale: La formulation grecque peut évoquer deux indications géographiques coordonnées ou une seule région qualifiée. Le texte principal en conserve la tension, et la note expose l’autre compréhension.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif est conservé; les deux occurrences de πάλιν sont rendues sans répétition française maladroite. La note est placée sur la proposition géographique qu’elle explique.
