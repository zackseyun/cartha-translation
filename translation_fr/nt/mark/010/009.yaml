id: MRK.10.9
reference: Mark 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: fr
  text: Que l’être humain ne sépare donc pas ce que Dieu a uni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ
  choice: ce que
  rationale: Le pronom relatif neutre singulier renvoie globalement à l’union conjugale qui vient d’être décrite. « Ce que » est naturel en français et conserve cette référence collective.
- source_word: οὖν
  choice: donc
  rationale: La particule introduit la conclusion tirée de l’action créatrice de Dieu évoquée dans les versets précédents. « Donc » exprime clairement ce lien logique.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Sujet explicite du verbe ; en français, le nom « Dieu » s’emploie ici sans article.
- source_word: συνέζευξεν
  choice: a uni
  rationale: L’aoriste de συζεύγνυμι désigne l’action accomplie par laquelle Dieu a joint les époux. « A uni » est idiomatique, précis et garde la pertinence présente de cette action sans rendre trop littéralement l’image du joug.
- source_word: ἄνθρωπος
  choice: l’être humain
  rationale: 'Le singulier sans article a une portée générique : aucun humain ne doit défaire l’union établie par Dieu. « L’être humain » conserve le singulier représentatif et rend explicitement la portée universelle du grec.'
- source_word: μὴ χωριζέτω
  choice: ne sépare pas
  rationale: L’impératif présent avec μή exprime une interdiction. La tournure française « que… ne sépare pas » en restitue naturellement la force, tandis que « séparer » convient précisément au contexte conjugal.
theological_decisions:
- issue: Portée générique de ἄνθρωπος dans l’enseignement sur le mariage
  choice: « l’être humain » au singulier générique
  alternative: « personne » ou « l’homme »
  rationale: « L’être humain » maintient le singulier du texte grec tout en indiquant sans ambiguïté que l’interdiction vaut pour tout humain, et non seulement pour les hommes de sexe masculin. « Personne » serait très naturel mais transformerait le nom générique en pronom négatif ; « l’homme » pourrait être compris aujourd’hui comme désignant seulement le masculin.
translation_notes:
  register: Français international moderne, sobre et digne. La construction exhortative « Que… ne… pas » garde la force sentencieuse de la parole de Jésus sans archaïsme. L’ordre français place l’agent humain en tête tout en conservant nettement le contraste entre l’action divine d’unir et l’interdiction humaine de séparer.
