id: MRK.10.28
reference: Mark 10:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: fr
  text: 'Pierre se mit à lui dire : « Regarde[a], nous avons tout laissé et nous t’avons suivi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vois »; littéralement « Voici ».
    reason: Le marqueur grec ἰδού peut attirer l’attention de plusieurs manières; « voici » en reflète plus littéralement la forme, tandis que « vois » demeure possible.
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: se mit à dire
  rationale: Cette tournure rend naturellement en français l’expression grecque signifiant « commencer à dire », sans lourdeur.
- source_word: ὁ Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie à Jésus dans le contexte; le conserver évite d’expliciter ce que le grec laisse pronominal.
- source_word: Ἰδοὺ
  choice: Regarde
  rationale: Impératif employé ici comme marqueur discursif pour attirer l’attention; « Regarde » est actuel et conserve sa vivacité.
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom explicite porte une certaine insistance, naturellement perceptible en français dans « nous avons » après l’interpellation.
- source_word: ἀφήκαμεν
  choice: avons laissé
  rationale: Le passé composé exprime une action accomplie dont les conséquences demeurent pertinentes; « abandonné » risquerait d’accentuer indûment la nuance.
- source_word: πάντα
  choice: tout
  rationale: Rend de façon idiomatique et globale le pluriel neutre grec.
- source_word: ἠκολουθήκαμέν
  choice: avons suivi
  rationale: Le parfait grec présente une démarche accomplie avec une portée durable; le passé composé français convient au parallélisme avec « avons laissé ».
- source_word: σοι
  choice: t’
  rationale: Le datif complément de ἀκολουθέω est naturellement rendu par le complément direct français « te ».
theological_decisions:
- issue: Portée de l’affirmation de Pierre sur le renoncement des disciples
  choice: Présenter directement l’affirmation de Pierre, sans la cautionner ni l’atténuer
  alternative: Employer « nous avons renoncé à tout » ou reformuler en fonction de la réponse ultérieure de Jésus
  rationale: Le verset rapporte la déclaration appuyée de Pierre sans fournir ici d’évaluation narrative; la traduction en préserve donc la tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Se mit à lui dire » garde le mouvement narratif; « Regarde » rend le marqueur d’attention sans archaïsme. Le tutoiement correspond à l’adresse singulière de Pierre à Jésus.
