  source_fidelity: 'Le texte rend fidèlement Ἤρξατο λέγειν (« se mit à dire »), conserve le pronom αὐτῷ (« lui »), traduit l’appel d’attention ἰδού par un équivalent vivant (« Regarde »), et respecte l’assertion de Pierre : « nous avons tout laissé et nous t’avons suivi ». Le passé composé convient aux deux verbes grecs et ne force pas davantage la valeur du parfait d’ἠκολουθήκαμεν.'
  naturalness: Le français est moderne, clair et d’un registre narratif digne. « Pierre se mit à lui dire » est une tournure naturelle dans ce contexte, et le tutoiement correspond à l’adresse singulière directe à Jésus.
  terminology: « Pierre », « tout laissé » et « t’avons suivi » sont usuels et précis. La formulation ne transforme pas la déclaration de Pierre en commentaire théologique et n’en atténue ni n’en renforce la portée.
