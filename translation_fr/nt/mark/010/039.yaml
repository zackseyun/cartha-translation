  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: fr
  text: 'Ils lui dirent : « Nous le pouvons[a]. » Mais Jésus leur dit : « La coupe que je bois, vous la boirez, et le baptême que je reçois, vous le recevrez[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous en sommes capables. »'
    reason: lexical_alternative
  - marker: b
    text: La « coupe » et le « baptême » sont ici des images de la souffrance et de la destinée que Jésus va connaître et auxquelles ses disciples auront eux aussi part.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Nous le pouvons
  rationale: Cette formulation française naturelle conserve la valeur présente de δύναμαι et répond directement à la question précédente. « Nous en sommes capables » serait possible, mais plus explicatif.
- source_word: ποτήριον
  choice: la coupe
  rationale: Le terme concret est conservé afin de préserver l’image biblique d’une destinée impartie, ici liée à la souffrance, sans l’expliciter dans le corps du texte.
- source_word: πίνω / πίεσθε
  choice: je bois / vous la boirez
  rationale: Le présent et le futur du grec sont reproduits, de même que le parallélisme verbal. Le pronom « la » rend la reprise de « la coupe » naturelle en français.
- source_word: βάπτισμα
  choice: baptême
  rationale: « Baptême » est l’équivalent lexical usuel et maintient l’image d’une expérience qui submerge, ainsi que ses résonances bibliques, sans la réduire à une paraphrase.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: je suis baptisé / vous serez baptisés
  rationale: Les formes passives et la répétition de la même famille lexicale sont maintenues. Bien que la tournure soit solennelle, elle demeure compréhensible et préserve étroitement la métaphore grecque.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mais Jésus leur dit
  rationale: « Mais » exprime le léger contraste introduit par δέ entre l’assurance des disciples et la réponse de Jésus.
theological_decisions:
- issue: Sens métaphorique de la coupe et du baptême
  choice: Conserver les deux métaphores dans le texte principal comme désignant la souffrance et la destinée que Jésus va connaître et auxquelles ses disciples auront part.
  alternative: Remplacer directement les images par « souffrance », « mort », « épreuve » ou « martyre ».
  rationale: Le grec emploie des images bibliques chargées de sens. Les conserver respecte la formulation du texte et évite d’imposer dans la traduction principale une interprétation plus précise que le verset lui-même.
- issue: Rapport avec le baptême sacramentel
  choice: Traduire βάπτισμα par « baptême », tout en indiquant en note que le contexte lui donne ici une portée métaphorique.
  alternative: Employer « immersion » ou « épreuve » afin d’écarter toute lecture sacramentelle.
  rationale: Le mot grec est bien βάπτισμα. Le contexte évoque la souffrance, mais la traduction doit préserver le terme et l’éventuelle tension théologique plutôt que la résoudre silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct; la tournure « du baptême dont je suis baptisé » est volontairement formelle afin de conserver le substantif et le verbe apparentés du grec ainsi que leurs formes passives.
