id: MRK.10.17
reference: Mark 10:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: fr
  text: 'Comme il se mettait en route[a], un homme accourut, se mit à genoux devant lui et lui demanda : « Bon Maître, que dois-je faire pour hériter de la vie éternelle ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme il sortait sur la route. » L’expression grecque peut désigner le fait de gagner la route ou de commencer un voyage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Comme il se mettait en route
  rationale: Le génitif absolu situe l’action en arrière-plan, tandis que l’expression εἰς ὁδόν peut désigner le fait de gagner la route ou de commencer un déplacement. « Se mettait en route » est naturel en français et conserve cette nuance de départ.
- source_word: προσδραμὼν
  choice: accourut
  rationale: Le participe aoriste décrit une approche rapide et empressée. « Accourut » restitue de façon concise la vivacité de la scène.
- source_word: εἷς
  choice: un homme
  rationale: Employé substantivement, le masculin singulier introduit ici un individu de sexe masculin. « Un homme » est précis et idiomatique.
- source_word: γονυπετήσας αὐτόν
  choice: se mit à genoux devant lui
  rationale: Le verbe désigne l’action de s’agenouiller devant quelqu’un. Cette formulation française exprime clairement le geste sans en accentuer indûment l’intensité.
- source_word: ἐπηρώτα αὐτόν
  choice: lui demanda
  rationale: Bien que l’imparfait grec puisse présenter l’action dans son déroulement, le passé simple convient naturellement à la progression narrative française.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Bon Maître
  rationale: Dans l’adresse directe, διδάσκαλος désigne celui qui enseigne. « Maître » est ici une appellation française naturelle liée à l’enseignement, sans introduire le titre « Seigneur », et conserve l’adjectif « bon », essentiel pour la suite du dialogue.
- source_word: τί ποιήσω
  choice: que dois-je faire
  rationale: La question délibérative porte sur l’action requise. « Dois-je » en restitue clairement la force pratique en français courant.
- source_word: ἵνα
  choice: pour
  rationale: La préposition « pour » suivie de l’infinitif exprime naturellement en français le but introduit par ἵνα, le sujet des deux actions étant le même.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Cette expression consacrée demeure claire en français moderne et conserve la portée temporelle et théologique du grec.
- source_word: κληρονομήσω
  choice: hériter
  rationale: Le verbe grec relève du champ de l’héritage ou de la réception en qualité d’héritier. « Hériter » maintient cette image au lieu de l’aplatir en « obtenir ».
theological_decisions:
- issue: L’appellation adressée à Jésus
  choice: Bon Maître
  alternative: Bon enseignant
  rationale: Le grec emploie διδάσκαλε et non κύριε. « Maître » est une appellation traditionnelle mais encore intelligible pour celui qui enseigne; elle évite d’introduire explicitement le titre « Seigneur » tout en préservant « bon », qui motive la réponse du verset suivant.
- issue: Le genre de εἷς
  choice: un homme
  alternative: quelqu’un
  rationale: La forme masculine singulière et le contexte narratif justifient une désignation sexuée précise plutôt qu’une formulation indéterminée.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique littéraire sans archaïsme marqué; le dialogue reste direct et immédiatement compréhensible.
