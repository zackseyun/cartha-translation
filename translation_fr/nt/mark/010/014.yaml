source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: fr
  text: 'Mais quand Jésus vit cela, il s’indigna et leur dit : « Laissez les enfants venir à moi ; ne les en empêchez pas, car le royaume de Dieu appartient à ceux qui sont comme eux.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car le royaume de Dieu est à ceux qui sont tels » ; ou : « car c’est à de tels êtres qu’est le royaume de Dieu ».'
    reason: La formulation grecque est concise et peut être reproduite plus formellement, mais au prix d’un français moins naturel. La note préserve sa structure et son caractère ouvert.
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Mais quand Jésus vit cela
  rationale: Le participe aoriste exprime la circonstance qui provoque la réaction de Jésus. « Cela » reprend naturellement, en français, l’action des disciples mentionnée au verset précédent, tandis que « mais » marque le contraste.
- source_word: ἠγανάκτησεν
  choice: il s’indigna
  rationale: Le verbe exprime une vive désapprobation. « S’indigna » en conserve la force morale sans suggérer une colère incontrôlée.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Laissez les enfants venir à moi
  rationale: Formulation française naturelle et directe qui rend l’impératif de permission et le mouvement vers Jésus.
- source_word: μὴ κωλύετε αὐτά
  choice: ne les en empêchez pas
  rationale: Le pronom « en » renvoie clairement au fait de venir à Jésus. La tournure exprime l’interdiction de faire obstacle aux enfants.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: car … appartient à ceux qui sont comme eux
  rationale: Le génitif τῶν τοιούτων désigne des personnes de cette sorte, et non nécessairement les seuls enfants présents. « Appartient à » rend idiomatiquement la relation exprimée par la construction grecque.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression biblique établie, claire et fidèle, qui ne réduit pas βασιλεία au seul territoire ni ne tranche entre royaume et règne.
theological_decisions:
- issue: Portée de « τῶν τοιούτων »
  choice: La parole vise ceux qui sont comme ces enfants, de manière représentative.
  alternative: Comprendre que le royaume appartient exclusivement aux enfants présents, ou expliciter une qualité précise telle que l’innocence ou l’humilité.
  rationale: τοιούτων signifie « de cette sorte » ou « tels que ceux-ci ». Le verset ne nomme pas lui-même la qualité qui fonde la comparaison ; la traduction préserve donc cette ouverture sans ajouter une doctrine sur l’innocence, l’humilité ou le salut automatique des enfants.
- issue: Sens de « royaume de Dieu »
  choice: Conserver la formule « royaume de Dieu ».
  alternative: Traduire uniquement par « règne de Dieu ».
  rationale: La formule française traditionnelle demeure naturelle et laisse subsister l’étendue sémantique de βασιλεία, qui peut évoquer à la fois la souveraineté divine et le domaine où elle s’exerce.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours reste direct, sans archaïsme. La ponctuation française distingue clairement les deux impératifs et la justification finale.
