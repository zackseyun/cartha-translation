source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: fr
  text: 'Jésus le regarda et l’aima. Il lui dit : « Une chose te manque : va, vends tout ce que tu as[a] et donne aux pauvres ; tu auras un trésor dans le ciel. Viens, suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que tu as ». L’expression grecque peut être rendue par « ce que tu as » ou « tout ce que tu as » ; dans ce contexte, elle vise l’ensemble de ses biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: posa son regard sur lui
  rationale: Le participe décrit un regard dirigé et attentif. Cette formulation française en garde la force sans ajouter une intensité excessive.
- source_word: ἠγάπησεν αὐτόν
  choice: l’aima
  rationale: Rend directement le verbe grec et affirme un amour véritable sans en imposer une interprétation doctrinale technique.
- source_word: Ἕν σε ὑστερεῖ
  choice: Il te manque une chose
  rationale: Le neutre substantivé ἕν appelle naturellement « une chose » en français, et la tournure impersonnelle rend avec clarté l’idée de manque.
- source_word: ὅσα ἔχεις
  choice: tout ce que tu as
  rationale: L’expression peut se rendre par « ce que tu as » ou « tout ce que tu as » ; le contexte montre que l’ordre porte sur l’ensemble des biens de l’homme.
- source_word: δὸς τοῖς πτωχοῖς
  choice: donne-le aux pauvres
  rationale: Le pronom reprend naturellement en français le produit implicite de la vente, tandis que « les pauvres » rend l’adjectif grec substantivé.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: un trésor dans le ciel
  rationale: Formulation française naturelle qui conserve l’image et le lieu céleste sans explicitation théologique supplémentaire.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Puis viens et suis-moi
  rationale: « Viens » rend l’invitation à rejoindre Jésus et « suis-moi » exprime naturellement l’appel continu à devenir son disciple. « Puis » marque l’enchaînement sans faire de la conjonction grecque une simple accumulation maladroite.
theological_decisions:
- issue: La nature de l’amour de Jésus envers l’homme
  choice: Affirmer simplement que Jésus « l’aima ».
  alternative: Réduire cet amour à de la bienveillance extérieure, ou le définir comme un amour électif au sens technique.
  rationale: Le texte énonce explicitement cet amour. La traduction ne doit ni l’affaiblir ni résoudre par avance sa portée doctrinale, ce qui préserve la tension du récit.
- issue: La portée de l’ordre concernant les biens
  choice: « vends tout ce que tu as »
  alternative: Atténuer l’ordre en un simple appel général à la générosité, ou rester à « ce que tu as » sans rendre explicite sa portée globale en contexte.
  rationale: Dans ce contexte, ὅσα ἔχεις embrasse l’ensemble des possessions de l’homme. Le français choisi garde la pleine force de l’ordre sans ajouter d’application universelle absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct demeure incisif, tandis que « posa son regard sur lui » fait ressortir l’attention personnelle de Jésus. Le pronom « le » après « donne » est une explicitation grammaticale naturelle en français du produit de la vente implicite dans le grec.
