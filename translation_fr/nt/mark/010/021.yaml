revisions:
- from: 'Jésus posa son regard sur lui et l’aima. Il lui dit : « Il te manque une chose : va, vends tout ce que tu as[a] et donne-le aux pauvres ; alors tu auras un trésor dans le ciel. Puis viens et suis-moi. »'
  to: 'Jésus le regarda et l’aima. Il lui dit : « Une chose te manque : va, vends tout ce que tu as[a] et donne aux pauvres ; tu auras un trésor dans le ciel. Viens, suis-moi. »'
  rationale: La révision supprime le pronom interprétatif après « donne », allège les marqueurs temporels ajoutés et emploie une formulation plus directe pour le regard de Jésus. Elle maintient la force globale de l’ordre concernant les biens ainsi que l’ambiguïté lexicale documentée dans la note.
