  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: fr
  text: Et celui qui veut être le premier parmi vous sera l’esclave de tous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le serviteur de tous ». Le mot grec doulos est plus fort que le terme traduit par « serviteur » au verset précédent ; « esclave » préserve ici cette intensification.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: celui qui veut
  rationale: La construction avec ἄν et le subjonctif a une portée générale. « Celui qui veut » est naturel en français et conserve la nuance de volonté.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans ce contexte de rang au sein du groupe, l’expression désigne la position occupée parmi les disciples.
- source_word: πρῶτος
  choice: le premier
  rationale: Ce rendu direct conserve l’idée de primauté ou de rang.
- source_word: ἔσται
  choice: sera
  rationale: Le futur est conservé sans le transformer explicitement en obligation, même si le contexte lui donne une portée normative.
- source_word: πάντων
  choice: de tous
  rationale: Le génitif marque ici la relation de dépendance envers tous et conserve la portée universelle.
- source_word: δοῦλος
  choice: l’esclave
  rationale: δοῦλος est plus fort que διάκονος au verset précédent. « Esclave » préserve l’intensification et l’abaissement radical exprimés par la parole.
theological_decisions:
- issue: Traduction de δοῦλος dans cet enseignement sur la condition du disciple
  choice: esclave
  alternative: serviteur
  rationale: Le contexte oppose l’ambition sociale à un abaissement radical, et le passage de διάκονος au verset précédent à δοῦλος ici doit rester perceptible. Une note signale toutefois le rendu traditionnel possible.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en étant idiomatique ; « l’esclave de tous » conserve volontairement la force dérangeante de l’image.
