source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: fr
  text: On lui amenait des enfants pour qu’il les touche[a], mais les disciples réprimandèrent ceux qui les amenaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de jeunes enfants ». Le grec παιδία peut désigner des enfants en général, notamment de jeunes enfants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: amenait
  rationale: L’imparfait grec présente une action en cours ou répétée. En français, « on lui amenait » rend naturellement cet aspect et le sujet humain indéfini.
- source_word: παιδία
  choice: des enfants
  rationale: παιδία désigne ici des enfants sans imposer un âge plus précis. « Des enfants » est naturel et suffisamment large.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: pour qu’il les touche
  rationale: La construction exprime le but, et ἅπτομαι signifie directement « toucher ». Cette formulation évite d’ajouter le geste d’imposition des mains, absent du texte de Marc.
- source_word: ἐπετίμησαν
  choice: réprimandaient
  rationale: Le verbe exprime une réprobation ferme. L’imparfait français conserve l’aspect de l’imparfait grec et « réprimander » convient au registre narratif.
- source_word: αὐτοῖς
  choice: ceux qui les amenaient
  rationale: Le pronom renvoie le plus naturellement aux personnes qui amenaient les enfants. L’explicitation française évite que « les » soit compris comme désignant les enfants.
- source_word: δὲ
  choice: mais
  rationale: « Mais » rend clairement le contraste entre l’initiative des personnes et la réaction des disciples.
theological_decisions:
- issue: Référent des personnes réprimandées par les disciples
  choice: Les disciples réprimandent ceux qui amènent les enfants.
  alternative: Les disciples réprimandent les enfants.
  rationale: Le pronom αὐτοῖς renvoie le plus naturellement au sujet humain implicite de προσέφερον. Cette lecture correspond aussi au déroulement du récit, où les disciples font obstacle à la venue des enfants.
translation_notes:
  register: Français international moderne, naturel et digne. Le sujet indéfini « on » rend sans lourdeur le sujet non exprimé du grec. La seconde proposition explicite le référent du pronom afin d’éviter une ambiguïté artificielle en français.
