  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: fr
  text: Mais beaucoup de ceux qui sont les premiers seront les derniers, et les derniers seront les premiers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup de ceux qui
  rationale: L’adjectif substantivé désigne un grand nombre de personnes, sans impliquer la totalité. Cette formulation est naturelle en français et permet de rattacher clairement « les premiers » au groupe visé.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la promesse précédente et introduit le principe de renversement.
- source_word: ἔσονται
  choice: seront
  rationale: Le futur de εἰμί est rendu par le futur simple, forme directe et naturelle en français moderne.
- source_word: πρῶτοι
  choice: les premiers
  rationale: Le terme évoque ici le rang ou la position. « Les premiers » conserve l’antithèse concise avec « les derniers ».
- source_word: ἔσχατοι
  choice: les derniers
  rationale: Cette traduction préserve l’opposition directe avec « les premiers », sans préciser abusivement s’il s’agit du statut social, spirituel ou eschatologique.
- source_word: οἱ ἔσχατοι
  choice: les derniers
  rationale: L’article rend l’expression substantivale; « les derniers » est idiomatique et maintient le parallélisme.
- source_word: καὶ
  choice: et
  rationale: La coordination simple relie les deux volets symétriques de la déclaration sans ajouter d’interprétation.
theological_decisions:
- issue: Nature du renversement annoncé
  choice: Présenter la parole comme un principe général de renversement, sans définir davantage les catégories visées.
  alternative: Identifier précisément les premiers et les derniers aux riches et aux pauvres, aux disciples et aux personnes extérieures, ou en faire une règle absolue applicable à chaque individu.
  rationale: Le verset formule un paradoxe général dans un contexte eschatologique, mais ne précise pas lui-même les groupes concernés. La traduction conserve donc son ouverture et sa tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition complète de « seront les premiers » dans le second membre évite une ellipse un peu raide en français tout en préservant le parallélisme aphoristique du grec.
