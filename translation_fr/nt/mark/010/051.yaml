id: MRK.10.51
reference: Mark 10:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Que veux-tu que je fasse pour toi ? » L’aveugle lui dit : « Rabbouni[a], que je retrouve la vue. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rabbouni » est une formule araméenne qui signifie « mon maître » ou « mon enseignant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: répondit
  rationale: Le participe aoriste peut être rendu naturellement en français par un verbe conjugué. « Répondit » conserve l’idée d’une réaction de Jésus à la démarche de l’homme, sans la tournure lourde « ayant répondu, il dit ».
- source_word: Τί σοι θέλεις ποιήσω
  choice: Que veux-tu que je fasse pour toi ?
  rationale: Cette formulation idiomatique conserve la volonté exprimée par θέλεις et rend explicitement le datif σοι par « pour toi ».
- source_word: τυφλὸς
  choice: L’aveugle
  rationale: L’adjectif grec est substantivé. « L’aveugle » est une désignation naturelle en français dans ce contexte narratif et renvoie clairement à l’homme déjà identifié.
- source_word: Ραββουνι
  choice: Rabbouni
  rationale: La translittération garde la forme araméenne distinctive conservée par le texte grec. Une note en explique le sens au lecteur francophone.
- source_word: ἵνα ἀναβλέψω
  choice: que je retrouve la vue
  rationale: Dans ce contexte de guérison, ἀναβλέπω signifie retrouver la vue. La proposition introduite par « que » préserve la forme elliptique et la nuance de résultat souhaité portée par ἵνα.
theological_decisions:
- issue: Traitement du titre araméen Ραββουνι
  choice: Conserver « Rabbouni » dans le texte avec une note explicative
  alternative: Traduire directement par « mon maître » ou « mon enseignant »
  rationale: Le grec conserve lui-même cette forme sémitique au lieu de la remplacer par un titre grec courant. La translittération respecte cette particularité historique et expressive, tandis que la note en donne le sens sans imposer une seule nuance française.
translation_notes:
  register: Français international moderne, simple et digne. Le dialogue reste direct et naturel. La construction grecque participiale est transformée en verbe conjugué pour éviter une lourdeur artificielle, et la réponse elliptique de l’aveugle est maintenue.
