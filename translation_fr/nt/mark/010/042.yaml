  rationale: La révision clarifie les pronoms de la seconde proposition, conserve la distinction entre κατακυριεύουσιν (« les dominent ») et κατεξουσιάζουσιν (« exercent leur autorité sur elles »), et ajoute l’alternative liée à δοκοῦντες. Elle ne tranche pas davantage que le grec entre « nations » et « non-Juifs ».
