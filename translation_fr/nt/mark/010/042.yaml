source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: fr
  text: 'Alors Jésus les appela auprès de lui et leur dit : « Vous savez que ceux qui sont considérés comme les dirigeants des nations[a][b] les dominent, et que leurs grands exercent leur autorité sur elles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des non-Juifs » (traditionnellement : « des païens »).'
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui paraissent gouverner les nations ».
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: appela auprès de lui
  rationale: Le moyen προσκαλέομαι exprime ici l’action d’appeler des personnes à venir auprès de soi. Cette formulation française reste naturelle et conserve cette nuance relationnelle.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français.
- source_word: Οἴδατε
  choice: Vous savez
  rationale: οἶδα, bien que de forme parfaite, a un sens présent et désigne une connaissance acquise ou établie.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: ceux qui sont considérés comme les chefs
  rationale: δοκέω peut exprimer ici la réputation ou la reconnaissance publique. La traduction ne suggère donc pas que leur pouvoir serait seulement apparent.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: ἔθνη peut désigner les peuples non juifs, mais « nations » conserve la portée lexicale et convient naturellement au propos sur leurs structures politiques.
- source_word: κατακυριεύουσιν
  choice: les dominent
  rationale: Le composé κατακυριεύω évoque une domination exercée d’en haut, avec une nuance négative plus forte que le simple fait de gouverner.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: les grands parmi elles
  rationale: μέγαλοι désigne les personnages puissants ou éminents sans préciser une fonction officielle. La formulation conserve ce caractère général et le lien avec les nations.
- source_word: κατεξουσιάζουσιν
  choice: leur imposent leur autorité
  rationale: Le verbe décrit l’exercice d’un pouvoir sur autrui, avec ici une nuance dominatrice renforcée par le préverbe κατά et par le parallélisme.
theological_decisions:
- issue: Référent de τῶν ἐθνῶν
  choice: nations
  alternative: non-Juifs
  rationale: Le contexte permet le sens de peuples non juifs, mais « nations » préserve l’ambiguïté lexicale et désigne naturellement les sociétés politiques dont Jésus décrit les dirigeants.
- issue: Valeur de δοκοῦντες
  choice: sont considérés comme les chefs
  alternative: semblent gouverner
  rationale: La formule renvoie vraisemblablement à ceux qui passent publiquement pour gouverner, sans nier nécessairement la réalité de leur autorité. Elle préserve néanmoins la distance introduite par δοκέω.
translation_notes:
  register: Français international moderne, digne et accessible. « Chefs » est plus idiomatique que « gouvernants » dans cette construction; les deux verbes de pouvoir restent distincts grâce à « dominent » et « imposent leur autorité ».
