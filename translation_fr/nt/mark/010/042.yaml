review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Jésus appelle les disciples auprès de lui, puis décrit le comportement dominateur des dirigeants des nations. Toutefois, « les grands parmi elles leur imposent leur autorité » rend les référents de αὐτῶν moins nets en français. Le grec oppose les dirigeants des nations et « leurs grands », qui exercent leur autorité sur ces mêmes nations.'
  naturalness: '« Les grands parmi elles leur imposent leur autorité » est grammaticalement possible, mais lourd et ambigu : « elles » et « leur » demandent un effort de résolution. « Leurs grands exercent leur autorité sur elles » est plus idiomatique et restitue clairement le parallélisme grec.'
  terminology: « Nations » est un choix défendable pour τῶν ἐθνῶν et préserve l’ambiguïté entre « nations » et « non-Juifs ». « Dirigeants » est plus naturel en français international moderne que « chefs » dans ce contexte. Une note au premier groupe de mots doit aussi signaler l’autre nuance possible de δοκοῦντες, conformément à l’audit anglais.
  issues:
  - severity: medium
    issue: Référents ambigus dans la seconde proposition
    rationale: 'Dans « les grands parmi elles leur imposent leur autorité », la relation entre « elles », « leur » et les nations est pesante. Or les deux αὐτῶν grecs renvoient aux nations : leurs grands exercent leur autorité sur elles.'
  - severity: low
    issue: Ancrage de l’alternative pour δοκοῦντες absent
    rationale: L’audit anglais conserve une alternative pour « ceux qui sont considérés comme dirigeants ». Une note française ancrée à cette expression permet de préserver la nuance possible de « paraissent gouverner », sans l’imposer au texte.
