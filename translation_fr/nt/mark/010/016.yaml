  text: καὶ ἐναγκαλισάμενος αὐτὰ ⸂κατευλόγει τιθεὶς τὰς χεῖρας ἐπ’ αὐτά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: fr
  text: Il les prit dans ses bras et les bénissait[a] en posant les mains sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec est à l’imparfait ; il peut évoquer une action prolongée ou répétée : « continuait à les bénir » ou « les bénissait à plusieurs reprises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: les prit dans ses bras
  rationale: Le participe désigne précisément le fait de prendre quelqu’un dans ses bras. Cette formulation naturelle conserve la tendresse concrète du geste.
- source_word: κατευλόγει
  choice: les bénit[a]
  rationale: L’imparfait grec présente la bénédiction comme une action prolongée ou répétée, tandis que le préverbe peut lui donner une valeur intensive. Le passé simple convient au récit français; la nuance aspectuelle est signalée en note.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: en posant les mains sur eux
  rationale: Le participe indique le geste qui accompagne la bénédiction. « Poser les mains sur » est clair, naturel et n’ajoute aucune interprétation cérémonielle.
- source_word: αὐτὰ ... αὐτά
  choice: les ... eux
  rationale: Les pronoms renvoient aux enfants du contexte immédiat. Le français reprend naturellement ce référent sans le répéter.
- source_word: καὶ
  choice: Puis
  rationale: Dans ce récit, « Puis » rend naturellement la progression narrative portée par καί, sans lui prêter une valeur causale.
theological_decisions:
- issue: Nature du geste de Jésus envers les enfants
  choice: 'Conserver distinctement les gestes concrets: il les prend dans ses bras, les bénit et pose les mains sur eux.'
  alternative: Présenter l’action comme un rite formel ou employer une terminologie sacramentelle.
  rationale: Le grec décrit une réception affectueuse et une bénédiction sans définir le geste selon des catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. Le marqueur [a] figure immédiatement après le segment concerné.
