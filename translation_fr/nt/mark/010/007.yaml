  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: fr
  text: C’est pourquoi l’homme quittera son père et sa mère et s’attachera à sa femme[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’attachera étroitement à sa femme ». Le verbe grec peut souligner un attachement étroit.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits omettent « et s’attachera à sa femme ».
    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: C’est pourquoi
  rationale: Expression causale naturelle en français moderne, qui conserve la fonction explicative du grec.
- source_word: καταλείψει
  choice: quittera
  rationale: Le futur rend directement l’action de quitter le foyer parental, sans la connotation négative que pourrait porter « abandonnera ».
- source_word: ἄνθρωπος
  choice: l’homme
  rationale: Bien que le nom puisse être générique ailleurs, la mention de « sa femme » précise ici le membre masculin du couple dans la citation sur le mariage.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: son père et sa mère
  rationale: Formulation française idiomatique qui rend clairement les deux compléments et leur possessif.
- source_word: προσκολληθήσεται
  choice: s’attachera à
  rationale: Le verbe exprime une adhésion étroite et durable. La tournure pronominale française restitue naturellement cette idée, tout en laissant la note signaler une autre nuance possible.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: à sa femme
  rationale: Dans ce contexte matrimonial, γυνή désigne sans ambiguïté l’épouse; « femme » est le terme français naturel.
theological_decisions:
- issue: Langage représentatif sexué dans la citation sur le mariage
  choice: l’homme… sa femme
  alternative: une personne… son conjoint
  rationale: Le contexte présente explicitement le membre masculin du couple et son épouse. La traduction conserve cette précision au lieu de la neutraliser.
translation_notes:
  register: Français international moderne, naturel et digne. « C’est pourquoi » convient à une citation solennelle sans archaïsme; « s’attachera » préserve l’image relationnelle du grec.
