source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: fr
  text: 'Jésus s’arrêta et dit : « Appelez-le. » Ils appelèrent l’aveugle et lui dirent : « Courage ! Lève-toi, il t’appelle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: s’arrêta
  rationale: Le participe signifie littéralement que Jésus s’est tenu debout, mais, dans ce récit de déplacement, il indique naturellement qu’il s’est arrêté.
- source_word: Φωνήσατε αὐτόν
  choice: Appelez-le
  rationale: φωνέω signifie ici appeler quelqu’un pour le faire venir. Cette formulation directe permet aussi de conserver la répétition du verbe dans le verset.
- source_word: φωνοῦσι
  choice: ils appelèrent
  rationale: Le même verbe est rendu comme dans l’ordre de Jésus, ce qui préserve la reprise lexicale du grec.
- source_word: τὸν τυφλὸν
  choice: l’aveugle
  rationale: L’adjectif substantivé désigne ici l’homme aveugle déjà présent dans le contexte. « L’aveugle » est naturel en français narratif.
- source_word: Θάρσει
  choice: Courage !
  rationale: L’impératif exprime l’encouragement et la confiance. L’exclamation française est concise, actuelle et énergique.
- source_word: ἔγειρε
  choice: Lève-toi
  rationale: L’impératif appelle l’homme à se relever pour aller vers Jésus. « Lève-toi » est naturel et garde la force verbale.
- source_word: φωνεῖ σε
  choice: il t’appelle
  rationale: Le présent grec présente l’appel comme actuel. Le présent français exprime clairement cette immédiateté.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La coordination par « Ils appelèrent » évite une lourde répétition de « et » tout en maintenant la succession narrative. Les trois occurrences de φωνέω sont rendues par « appeler », préservant l’écho verbal du texte grec.
