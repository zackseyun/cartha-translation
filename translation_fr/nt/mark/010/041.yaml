  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: fr
  text: Quand les dix entendirent cela, ils commencèrent à s’indigner contre Jacques et Jean.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet de Jacques et Jean » ou « à cause de Jacques et Jean ». La préposition grecque peut désigner l’objet ou l’occasion de leur indignation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Quand
  rationale: Le lien narratif est intégré à la proposition temporelle en français naturel ; une traduction mécanique par « Et » alourdirait la phrase.
- source_word: ἀκούσαντες
  choice: entendirent cela
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. « Quand… entendirent » la rend naturellement, et « cela » explicite l’objet sous-entendu par le contexte.
- source_word: οἱ δέκα
  choice: les dix
  rationale: La formulation littérale est conservée sans ajouter « autres » ni « disciples », bien que le contexte permette de les comprendre.
- source_word: ἤρξαντο
  choice: commencèrent
  rationale: Rend la valeur ingressive de ἄρχομαι suivi de l’infinitif.
- source_word: ἀγανακτεῖν
  choice: à s’indigner
  rationale: Le verbe exprime une vive désapprobation ou irritation ; « s’indigner » en préserve la force sans le réduire à une simple colère.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: contre Jacques et Jean
  rationale: Avec ce verbe d’émotion, περί peut désigner ceux vers qui l’indignation est dirigée ou ceux qui en sont l’occasion. « Contre » est naturel dans le contexte, tandis qu’une note conserve l’autre nuance possible.
- source_word: Ἰακώβου
  choice: Jacques
  rationale: Forme française traditionnelle du nom Ἰάκωβος dans le Nouveau Testament.
- source_word: Ἰωάννου
  choice: Jean
  rationale: Forme française traditionnelle du nom Ἰωάννης.
