id: MRK.10.25
reference: Mark 10:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: fr
  text: Il est plus facile à un chameau de passer par le chas d’une aiguille[a][b] qu’à un riche d’entrer dans le royaume de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « par l’ouverture d’une aiguille ».'
    reason: lexical_alternative
  - marker: b
    text: Certains ont proposé « corde » au lieu de « chameau », mais le texte grec porte ici « chameau ».
    reason: alternative_reading
  - marker: c
    text: Le grec emploie ici le masculin singulier, « un riche » ; la parole a une portée représentative.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: plus facile
  rationale: Le comparatif signifie « plus facile » ou « moins difficile ». Cette formulation française naturelle conserve pleinement la comparaison hyperbolique.
- source_word: κάμηλον
  choice: un chameau
  rationale: Le texte grec porte κάμηλος, « chameau ». Cette image concrète et saisissante doit être conservée sans être atténuée.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: par le chas d’une aiguille
  rationale: L’expression désigne l’ouverture d’une aiguille à coudre. « Le chas d’une aiguille » est l’équivalent français précis, courant et idiomatique.
- source_word: διελθεῖν
  choice: passer
  rationale: L’infinitif de διέρχομαι signifie ici « passer à travers ». Avec « par le chas », le verbe « passer » donne une formulation française fluide sans perdre l’image spatiale.
- source_word: πλούσιον
  choice: un riche
  rationale: L’adjectif masculin singulier est employé comme substantif. « Un riche » respecte cette forme tout en ayant ici une portée représentative.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: dans le royaume de Dieu
  rationale: « Royaume de Dieu » rend l’expression centrale βασιλεία τοῦ θεοῦ. La préposition « dans » s’emploie naturellement avec le verbe « entrer ».
- source_word: εἰσελθεῖν
  choice: entrer
  rationale: L’infinitif de εἰσέρχομαι signifie « entrer ». Ce choix est direct, précis et idiomatique en français.
theological_decisions:
- issue: Interprétation de l’image du chameau et du chas de l’aiguille
  choice: Conserver littéralement l’image hyperbolique d’un chameau passant par le chas d’une aiguille.
  alternative: Y voir une petite porte de Jérusalem appelée « le Chas de l’aiguille », ou remplacer « chameau » par « corde » afin d’atténuer l’image.
  rationale: Le texte grec présente une image volontairement extrême. La traduction préserve cette tension et n’introduit aucune tradition explicative qui ne soit pas fondée sur la formulation du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale « le chas d’une aiguille » est immédiatement compréhensible. La construction parallèle « plus facile à… qu’à… » restitue clairement la syntaxe comparative grecque.
