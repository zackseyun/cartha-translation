  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: fr
  text: 'Beaucoup de gens le reprenaient pour qu’il se taise, mais lui criait encore bien davantage : « Fils de David[a], aie pitié de moi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de David » est un titre royal et messianique ; on pourrait en expliciter le sens par « Messie », mais la formulation grecque est conservée ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: rabrouillaient
  rationale: L’imparfait indique une action répétée ou continue. « Rabrouillaient » rend la force de ἐπιτιμάω et convient à la tentative de le faire taire.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne de nombreuses personnes sans préciser qu’il s’agit de toute la foule.
- source_word: ἵνα σιωπήσῃ
  choice: pour qu’il se taise
  rationale: Cette tournure naturelle conserve la valeur de but exprimée par ἵνα avec le subjonctif.
- source_word: πολλῷ μᾶλλον
  choice: de plus belle
  rationale: Cette expression française idiomatique indique qu’il intensifie ou poursuit davantage son action, sans ajouter explicitement la notion de volume.
- source_word: ἔκραζεν
  choice: criait
  rationale: L’imparfait exprime ici une action continue; « criait » rend directement l’urgence et la force de κράζω.
- source_word: Υἱὲ Δαυίδ
  choice: Fils de David
  rationale: La traduction littérale conserve ce titre royal et messianique ainsi que sa résonance biblique.
- source_word: ἐλέησόν με
  choice: aie pitié de moi
  rationale: Cette supplication française courante et digne rend directement l’impératif de ἐλεέω; elle conserve l’appel pressant à la compassion.
theological_decisions:
- issue: Portée messianique de « Fils de David »
  choice: Conserver le titre « Fils de David »
  alternative: « Messie »
  rationale: Le grec emploie explicitement Υἱὲ Δαυίδ. Traduire le titre au lieu de lui substituer son interprétation préserve la formulation et laisse au lecteur sa portée royale et messianique.
translation_notes:
  register: Français international moderne, naturel et digne. « Rabrouillaient » garde la vigueur du reproche; « de plus belle » restitue l’intensification idiomatique sans préciser indûment qu’il criait plus fort.
