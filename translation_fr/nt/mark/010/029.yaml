source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: fr
  text: 'Jésus dit : « Vraiment, je vous le dis, personne n’a quitté sa maison, ou ses frères, ou ses sœurs, ou sa mère, ou son père, ou ses enfants, ou ses champs à cause de moi et à cause de la bonne nouvelle, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: dit
  rationale: L’aoriste de φημί introduit simplement la parole de Jésus ; « dit » est naturel et n’ajoute pas la nuance d’une réponse absente du verbe.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  rationale: Cette formulation française naturelle conserve la solennité de la déclaration introductive et la force de ἀμήν sans employer ici la translittération liturgique « amen ».
- source_word: οὐδείς ἐστιν ὃς ἀφῆκεν
  choice: personne n’a quitté
  rationale: Le passé composé convient à cette affirmation générale et « quitté » exprime le départ ou le renoncement sans suggérer nécessairement un abandon moralement coupable.
- source_word: οἰκίαν
  choice: maison
  rationale: Équivalent concret et direct, préférable à « foyer », plus affectif, ou « maisonnée », qui déplacerait le sens vers le groupe familial.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: frères, sœurs
  rationale: Le grec nomme séparément les frères et les sœurs ; la traduction maintient cette distinction explicite.
- source_word: μητέρα ἢ πατέρα
  choice: mère, père
  rationale: Équivalents directs ; l’ordre mère-père du texte SBLGNT est conservé.
- source_word: τέκνα
  choice: enfants
  rationale: Terme collectif naturel qui rend les descendants sans préciser leur sexe.
- source_word: ἀγρούς
  choice: champs
  rationale: « Champs » rend concrètement les terres cultivées, sans élargir le sens à toute propriété foncière.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: à cause de moi et à cause de la bonne nouvelle
  rationale: La répétition de « à cause de » reflète celle de ἕνεκεν et maintient distinctement les deux motifs étroitement associés ; « bonne nouvelle » communique le sens courant de εὐαγγέλιον en français moderne.
theological_decisions:
- issue: Ne pas exagérer la rupture avec les proches ni les obligations familiales
  choice: a quitté
  alternative: a abandonné
  rationale: « Quitté » préserve le coût radical du discipulat sans imposer l’idée d’une répudiation morale ou définitive que le verbe n’exige pas.
- issue: Rapport entre Jésus et la bonne nouvelle comme motifs du renoncement
  choice: à cause de moi et à cause de la bonne nouvelle
  alternative: pour moi et pour l’Évangile
  rationale: La répétition conserve les deux compléments du grec sans les fusionner ni expliquer théologiquement leur rapport.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la déclaration solennelle grecque. La virgule finale est conservée parce que le verset se poursuit syntaxiquement au verset 30.
