revisions:
- from: 'Jésus dit : « Vraiment, je vous le dis, personne n’a quitté maison, frères, sœurs, mère, père, enfants ou champs à cause de moi et à cause de la bonne nouvelle, »'
  to: 'Jésus dit : « Vraiment, je vous le dis, personne n’a quitté sa maison, ou ses frères, ou ses sœurs, ou sa mère, ou son père, ou ses enfants, ou ses champs à cause de moi et à cause de la bonne nouvelle, »'
  rationale: La révision rend systématiquement les conjonctions ἤ et emploie les possessifs requis par l’usage français naturel. Elle maintient le passé composé généralisant, l’ordre mère-père, la répétition de « à cause de » et la virgule finale, puisque la phrase se poursuit au verset suivant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:50:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : la déclaration solennelle, le fait d’avoir quitté, les membres de la famille, les champs et le double motif (« à cause de moi » et « à cause de la bonne nouvelle ») correspondent au grec. Toutefois, les conjonctions disjonctives répétées (ἤ) doivent être rendues plus explicitement afin de préserver la portée de la liste.'
  naturalness: La liste sans déterminants possessifs (« maison, frères, sœurs… ») est possible dans un style biblique condensé, mais elle est moins naturelle et moins claire en français international moderne. Les possessifs rendent la relation personnelle implicite dans le contexte sans modifier le sens.
  terminology: « Bonne nouvelle » est un rendu lexical juste et moderne de εὐαγγέλιον. « Quitté » convient mieux que « abandonné » et ne force pas une interprétation morale de la séparation. L’ordre « mère ou père » est correctement conservé.
  issues:
  - severity: medium
    issue: Les alternatives de la liste ne sont pas toutes exprimées.
    rationale: Le grec emploie ἤ entre chaque élément. La simple juxtaposition par virgules peut faire entendre une liste cumulative, tandis que le texte vise toute personne ayant quitté l’un quelconque de ces biens ou liens. Répéter « ou » conserve cette structure.
  - severity: low
    issue: Absence de déterminants possessifs dans la liste.
    rationale: En français moderne, « quitter sa maison, ses frères… » est plus idiomatique et identifie clairement ces réalités comme celles de la personne concernée. Cette explicitation grammaticale n’ajoute pas de contenu théologique.
  revised_text: 'Jésus dit : « Vraiment, je vous le dis, personne n’a quitté sa maison, ou ses frères, ou ses sœurs, ou sa mère, ou son père, ou ses enfants, ou ses champs à cause de moi et à cause de la bonne nouvelle, »'
  revised_footnotes: []
