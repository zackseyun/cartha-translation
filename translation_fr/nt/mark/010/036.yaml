  text: ὁ δὲ εἶπεν αὐτοῖς· Τί θέλετε ⸀ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: fr
  text: 'Il leur dit : « Que voulez-vous que je fasse pour vous ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Il
  rationale: La tournure grecque poursuit le récit en reprenant le sujet déjà connu. En français, « Il » suffit naturellement; traduire δέ par « mais » donnerait ici une valeur contrastive trop forte.
- source_word: εἶπεν
  choice: dit
  rationale: Le verbe λέγω est rendu directement par « dire ». La forme interrogative des paroles indique déjà qu’il pose une question.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif pluriel est rendu simplement par « leur », sans ajouter « à tous les deux », précision fournie par le contexte mais absente du grec.
- source_word: Τί
  choice: Que
  rationale: Devant la proposition « que je fasse », « Que » est l’équivalent interrogatif naturel en français.
- source_word: θέλετε
  choice: voulez-vous
  rationale: θέλω exprime ici la volonté ou le désir. « Voulez-vous » est direct, courant et adapté au registre du dialogue.
- source_word: ποιήσω
  choice: que je fasse
  rationale: L’aoriste subjonctif dépend de θέλετε et désigne l’action souhaitée. La construction française naturelle exige « que je fasse ».
- source_word: ὑμῖν
  choice: pour vous
  rationale: 'Le datif a ici une valeur bénéficiaire : l’action demandée doit être accomplie en leur faveur.'
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la simplicité et la franchise de la question grecque, sans explicitation contextuelle superflue.
