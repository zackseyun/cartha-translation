  terminology: '« Être sauvé » est le terme approprié dans ce contexte et préserve la portée du grec sans préciser un cadre doctrinal. La note doit corriger l’équivalent littéral : πρὸς ἑαυτούς signifie littéralement « vers/à eux-mêmes », non « envers eux-mêmes » ni « en eux-mêmes ».'
