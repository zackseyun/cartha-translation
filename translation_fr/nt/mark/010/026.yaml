source:
  edition: SBLGNT
  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: fr
  text: 'Mais ils étaient extrêmement stupéfaits et se disaient entre eux[a] : « Alors, qui peut être sauvé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à eux-mêmes »; littéralement « vers eux-mêmes ».
    reason: L’expression grecque πρὸς ἑαυτούς peut être comprise dans ce contexte pluriel soit réciproquement (« entre eux »), soit réflexivement (« à eux-mêmes »).
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: L’article renvoie aux disciples ou aux auditeurs mentionnés dans le contexte, tandis que δέ marque ici naturellement le contraste avec la parole précédente de Jésus.
- source_word: περισσῶς
  choice: encore plus
  rationale: L’adverbe exprime un degré intensifié; dans le contexte, « encore plus » rend naturellement l’accroissement de leur stupéfaction.
- source_word: ἐξεπλήσσοντο
  choice: étaient stupéfaits
  rationale: L’imparfait grec décrit leur vive réaction en cours; « étaient stupéfaits » en conserve la force et l’aspect sans lourdeur.
- source_word: λέγοντες
  choice: se disaient
  rationale: Le participe exprime une parole concomitante à leur stupéfaction. La tournure française relie naturellement la réaction à la question prononcée.
- source_word: πρὸς ἑαυτούς
  choice: entre eux
  rationale: Littéralement « envers eux-mêmes », l’expression plurielle peut avoir un sens réciproque dans ce contexte conversationnel. « Entre eux » garde toutefois visible la possibilité qu’ils parlent au sein du groupe.
- source_word: Καὶ
  choice: Alors
  rationale: Dans la question, καί prend en contexte une valeur consécutive ou inférentielle; « Alors » exprime clairement cette conséquence en français.
- source_word: τίς
  choice: qui
  rationale: L’interrogatif porte sur toute personne susceptible d’être sauvée; la nuance de conséquence est déjà rendue par « Alors ».
- source_word: δύναται
  choice: peut
  rationale: Le verbe exprime la capacité ou la possibilité; « peut » est son équivalent français courant et direct.
- source_word: σωθῆναι
  choice: être sauvé
  rationale: Dans le contexte de l’entrée dans le règne de Dieu, cette formulation conserve la portée sotériologique et eschatologique du verbe grec.
theological_decisions:
- issue: Portée du vocabulaire du salut dans le contexte
  choice: « être sauvé » conserve le sens large de l’intervention salvatrice de Dieu, en lien avec l’entrée dans son règne.
  alternative: « être délivré » ou « être secouru »
  rationale: Le contexte immédiat traite de l’entrée dans le règne de Dieu; une formulation générique comme « être secouru » atténuerait cette portée, tandis que « être sauvé » la préserve sans en préciser excessivement les modalités.
translation_notes:
  register: Français international moderne, naturel et digne. « Stupéfaits » maintient la forte intensité de la réaction, et la question reste concise et orale.
