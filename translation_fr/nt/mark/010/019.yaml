source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: fr
  text: 'Tu connais les commandements : « Ne commets pas de meurtre[a], ne commets pas d’adultère, ne vole pas, ne porte pas de faux témoignage, ne prive personne de ce qui lui revient[b], honore ton père et ta mère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne tue pas ». Le verbe grec désigne ici plus précisément le meurtre ou l’homicide illégitime; c’est pourquoi « commettre un meurtre » est retenu.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « ne fraude pas », « ne dépouille personne » ou « ne retiens pas ce qui est dû ». Le verbe évoque le fait de priver quelqu’un de ce qui lui revient, souvent par exploitation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολάς
  choice: les commandements
  rationale: Cette formulation naturelle conserve l’allusion manifeste au Décalogue et son caractère d’injonctions morales.
- source_word: οἶδας
  choice: tu connais
  rationale: Le parfait οἶδα a ici un sens présent en grec koinè; le tutoiement correspond à l’adresse individuelle du contexte.
- source_word: Μὴ φονεύσῃς
  choice: Ne commets pas de meurtre
  rationale: φονεύω désigne plus précisément le meurtre ou l’homicide illégitime que le fait de tuer au sens général.
- source_word: Μὴ μοιχεύσῃς
  choice: ne commets pas d’adultère
  rationale: Formulation française idiomatique et précise dans un contexte moral et juridique.
- source_word: Μὴ κλέψῃς
  choice: ne vole pas
  rationale: Équivalent direct, courant et précis de κλέπτω.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: ne porte pas de faux témoignage
  rationale: Préserve la nuance judiciaire et testimoniale du verbe ainsi que l’écho reconnaissable du Décalogue.
- source_word: Μὴ ἀποστερήσῃς
  choice: ne prive personne de ce qui lui revient
  rationale: ἀποστερέω exprime le fait de retenir ou d’enlever à quelqu’un ce qui lui appartient ou lui est dû; cette formulation rend clairement l’objet implicite en français sans limiter le sens à une fraude technique.
- source_word: Τίμα
  choice: honore
  rationale: Dans ce contexte, τιμάω exige davantage que le simple respect et reprend le vocabulaire traditionnel du commandement.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: ton père et ta mère
  rationale: Rendu français naturel qui conserve intégralement la référence aux deux parents.
theological_decisions:
- issue: Formulation des commandements du Décalogue
  choice: Employer un style français reconnaissable comme celui des commandements tout en suivant la précision lexicale du grec
  alternative: Employer « Ne tue pas » et une paraphrase plus libre pour les autres injonctions
  rationale: Le caractère citationnel de la liste doit rester perceptible, mais la traduction ne doit pas élargir φονεύω à toute mise à mort ni réduire ἀποστερέω à un seul procédé frauduleux.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation présente les injonctions comme une citation. Le tutoiement convient à l’adresse directe à un seul interlocuteur. La formulation « ne prive personne de ce qui lui revient » privilégie la clarté tout en conservant l’étendue sémantique de ἀποστερέω.
