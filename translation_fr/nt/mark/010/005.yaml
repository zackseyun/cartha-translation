source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: fr
  text: 'Mais Jésus leur dit : « C’est à cause de votre dureté de cœur[a] qu’il[b] a écrit ce commandement à votre intention[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « endurcissement du cœur ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire Moïse, mentionné au verset précédent.
    reason: cross_reference
  - marker: c
    text: 'Ou : « cet ordre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: 'Marque ici un léger contraste dans le dialogue : Jésus répond à l’appel des pharisiens à l’autorité de Moïse.'
- source_word: Πρὸς
  choice: à cause de
  rationale: 'Avec l’accusatif, la préposition exprime ici le motif ou la circonstance déterminante : le commandement a été écrit en considération de leur état moral.'
- source_word: σκληροκαρδίαν
  choice: dureté de cœur
  rationale: Conserve l’image biblique du cœur endurci et sa portée morale, sans la réduire à la simple obstination.
- source_word: ἔγραψεν
  choice: il a écrit
  rationale: Le sujet grec est implicite et renvoie à Moïse, mentionné au verset précédent. Le pronom préserve cette continuité sans ajouter son nom dans le corps du verset.
- source_word: ἐντολὴν
  choice: commandement
  rationale: Rend le caractère prescriptif et juridique du terme dans le contexte de la législation mosaïque.
- source_word: ταύτην
  choice: ce
  rationale: Le démonstratif désigne précisément la prescription dont il vient d’être question.
theological_decisions:
- issue: Faut-il nommer explicitement Moïse comme sujet du verbe « écrire » ?
  choice: Conserver le sujet implicite sous la forme « il », avec une note identifiant Moïse.
  alternative: Écrire « Moïse vous a écrit » dans le texte principal.
  rationale: Le grec ne répète pas le nom de Moïse dans ce verset. Le pronom respecte la cohésion du discours et évite d’ajouter une insistance absente du texte source.
- issue: Comment rendre σκληροκαρδία sans atténuer sa portée biblique et morale ?
  choice: dureté de cœur
  alternative: endurcissement du cœur ; obstination
  rationale: « Dureté de cœur » conserve la métaphore anthropologique du grec ainsi que sa tension morale, sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure clivée « C’est à cause de… que » exprime clairement le rapport causal de Πρὸς tout en gardant l’accent initial du grec sur la dureté de cœur.
