review_pass:
  verdict: revise
  source_fidelity: Le sens causal de πρός, l’image de « dureté de cœur », le sujet implicite renvoyant à Moïse et le démonstratif « ce commandement » sont correctement rendus. Toutefois, « il vous a écrit ce commandement » peut se comprendre en français comme « il vous a adressé ce commandement » et ne rend pas avec assez de netteté le datif grec, « pour vous / à votre intention ».
  naturalness: La phrase est globalement naturelle et de registre biblique moderne. « Il a écrit ce commandement à votre intention » est plus clair et plus idiomatique que « il vous a écrit ce commandement », sans expliciter indûment Moïse.
  terminology: « Dureté de cœur » rend fidèlement σκληροκαρδία et conserve la métaphore biblique. « Commandement » convient à ἐντολή dans ce cadre légal. Les alternatives de notes sont recevables.
  issues:
  - severity: low
    issue: Ambiguïté de « il vous a écrit ce commandement »
    rationale: La construction française peut suggérer qu’un commandement a été écrit et adressé aux destinataires. Le grec emploie ὑμῖν après ἔγραψεν dans une formulation dont le sens ici est que cette prescription a été écrite pour eux, en considération de leur dureté de cœur. « À votre intention » clarifie ce rapport sans modifier le sens.
  revised_text: 'Mais Jésus leur dit : « C’est à cause de votre dureté de cœur[a] qu’il[b] a écrit ce commandement à votre intention[c]. »'
