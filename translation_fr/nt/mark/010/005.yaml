revisions:
- from: 'Mais Jésus leur dit : « C’est à cause de votre dureté de cœur[a] qu’il[b] vous a écrit ce commandement[c]. »'
  to: 'Mais Jésus leur dit : « C’est à cause de votre dureté de cœur[a] qu’il[b] a écrit ce commandement à votre intention[c]. »'
  rationale: 'La révision porte uniquement sur la place et la formulation du complément correspondant à ὑμῖν : « à votre intention » rend explicitement et naturellement en français le fait que Moïse a écrit cette prescription en réponse à leur dureté de cœur. Le sujet demeure le pronom implicite renvoyant à Moïse, conformément au grec et au contexte.'
  reviewer_model: gpt-5.6-terra
