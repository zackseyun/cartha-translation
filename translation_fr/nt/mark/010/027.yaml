source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: fr
  text: 'Jésus les regarda et dit : « Pour les humains, c’est impossible, mais non pour Dieu, car tout est possible pour Dieu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: les regarda
  rationale: Rend naturellement le regard direct et attentif exprimé par ἐμβλέπω, sans surinterpréter son intensité.
- source_word: Παρὰ ἀνθρώποις
  choice: Pour les humains
  rationale: Conserve la portée générique et inclusive de ἀνθρώποις ainsi que le contraste entre la capacité humaine et celle de Dieu.
- source_word: ἀδύνατον / δυνατά
  choice: impossible / possible
  rationale: Préserve en français le contraste lexical explicite du grec.
- source_word: γὰρ
  choice: car
  rationale: Marque la justification donnée par la dernière proposition, dans un registre digne et courant.
- source_word: παρὰ τῷ θεῷ
  choice: pour Dieu
  rationale: Expression française naturelle qui décrit ce qui est possible du côté de Dieu, en parallèle avec « Pour les humains ».
theological_decisions:
- issue: Portée de « tout est possible pour Dieu »
  choice: Conserver l’énoncé absolu sans restriction ajoutée
  alternative: Préciser « tout ce qui est conforme à sa volonté »
  rationale: Le texte grec ne formule aucune restriction explicite; le contexte porte sur la possibilité du salut, mais cette précision ne doit pas être insérée dans le verset.
- issue: Lien logique introduit par γὰρ
  choice: « car »
  alternative: « en effet » ou « parce que »
  rationale: « Car » maintient clairement la valeur explicative de γὰρ sans rendre le lien plus causal ou plus interprétatif que nécessaire.
translation_notes:
  register: Français international moderne, clair et digne. « Les humains » évite que « les hommes » soit compris comme exclusivement masculin. La répétition de « Dieu » suit celle du grec et renforce le contraste rhétorique.
