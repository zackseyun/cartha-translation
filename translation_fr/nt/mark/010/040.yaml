  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: fr
  text: Mais siéger à ma droite ou à ma gauche, ce n’est pas à moi de l’accorder[a], mais c’est pour ceux pour qui ces places ont été préparées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne m’appartient pas de l’accorder ».'
    reason: Variante lexicale permettant de rendre la nuance de οὐκ ἔστιν ἐμὸν δοῦναι sans en préciser davantage la portée.
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: siéger
  rationale: L’infinitif substantivé désigne ici le fait d’occuper une place d’honneur. « Siéger » est naturel et digne en français, tout en conservant la force verbale du grec.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Cette expression idiomatique indique une position au côté droit. « À ma droite » est la formulation française la plus directe, sans ajouter « main », absent du grec.
- source_word: ἢ ἐξ εὐωνύμων
  choice: ou à ma gauche
  rationale: L’expression désigne le côté gauche. Le rendu parallèle à « à ma droite » préserve l’équilibre de la formulation grecque.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: ce n’est pas à moi de l’accorder
  rationale: La tournure exprime que l’attribution de ces places ne relève pas de Jésus dans cette déclaration. « L’accorder » rend naturellement δοῦναι dans le contexte d’une faveur ou d’une place d’honneur, sans expliciter davantage la nature de la limitation.
- source_word: ἀλλ’ οἷς
  choice: cela est pour ceux à qui
  rationale: Le grec est elliptique après ἀλλά. Le français explicite sobrement le contraste sans faire de ces personnes les agents qui accordent les places.
- source_word: ἡτοίμασται
  choice: cela a été préparé
  rationale: Le parfait passif présente une préparation accomplie dont le résultat demeure. Le passif est conservé, sans nommer l’agent que le verset ne précise pas.
theological_decisions:
- issue: La déclaration nie-t-elle absolument l’autorité de Jésus, ou exprime-t-elle une limitation dans le contexte immédiat ?
  choice: 'Conserver la déclaration sans qualification explicative : « ce n’est pas à moi de l’accorder »'
  alternative: « ce n’est pas à moi de l’accorder indépendamment de la volonté du Père »
  rationale: Le grec énonce la limitation sans en fournir ici l’explication. Ajouter une référence à la volonté du Père résoudrait une tension théologique que le texte laisse ouverte.
- issue: Identifier l’agent de la préparation
  choice: Maintenir le passif « a été préparé » sans agent exprimé
  alternative: « que le Père a préparé »
  rationale: Aucun agent n’est nommé dans ce verset. Le rendre explicite importerait dans Marc une précision absente du texte transmis.
translation_notes:
  register: Français international moderne, clair et digne. « Siéger » convient au contexte de places d’honneur. La répétition de « cela » garde le référent volontairement général et préserve l’ellipse ainsi que le passif du grec.
