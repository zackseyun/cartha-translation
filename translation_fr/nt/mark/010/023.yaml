review_pass:
  verdict: revise
  source_fidelity: Le participe aoriste περιβλεψάμενος décrit un regard porté autour de lui avant la parole; « promenant son regard » le rendait comme une action simultanée. Le futur εἰσελεύσονται appelle aussi une formulation française qui conserve explicitement l’orientation future. Le reste du sens, notamment « ceux qui ont des richesses » et « royaume de Dieu », est fidèle.
  naturalness: « Après avoir regardé autour de lui » est plus idiomatique et respecte mieux la séquence narrative que « Puis, promenant son regard autour de lui ». « Comme il sera difficile à ceux qui ont des richesses d’entrer… » est une exclamation française naturelle et claire.
  terminology: « Richesses » rend bien χρήματα sans le réduire à l’argent liquide; « royaume de Dieu » est le terme établi et transparent. Aucune note textuelle ou lexicale n’est nécessaire ici.
