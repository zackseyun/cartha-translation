    issue: Le participe « promenant son regard autour de lui » présente le regard comme simultané à la parole.
    rationale: Le participe aoriste περιβλεψάμενος situe normalement cette action comme antérieure à λέγει. « Après avoir regardé autour de lui » conserve cette relation sans lourdeur.
  - severity: medium
    issue: « Qu’il est difficile … d’entrer » n’explicite pas le futur de εἰσελεύσονται.
    rationale: La construction française peut naturellement porter ce futur dans « il sera difficile … d’entrer », ce qui restitue plus exactement la portée prospective de la parole.
