id: MRK.10.23
reference: Mark 10:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: fr
  text: 'Après avoir regardé autour de lui, Jésus dit à ses disciples : « Comme il sera difficile à ceux qui ont des richesses d’entrer dans le royaume de Dieu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: promenant son regard autour de lui
  rationale: Cette tournure française naturelle rend le regard circulaire exprimé par le participe aoriste, sans surcharger le texte d’une succession temporelle rigide.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique de Marc est rendu par le passé simple, forme narrative vive et digne en français écrit; le présent « dit » serait possible, mais moins naturel dans un verset isolé introduit par « Puis ».
- source_word: Πῶς δυσκόλως
  choice: Qu’il est difficile
  rationale: La tournure exclamative restitue l’intensité de Πῶς δυσκόλως en français idiomatique, tandis que l’infinitif qui suit exprime naturellement l’action visée par le futur grec.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ceux qui ont des richesses
  rationale: Cette formulation conserve la structure descriptive du grec au lieu de la réduire à l’étiquette sociale « les riches ».
- source_word: χρήματα
  choice: richesses
  rationale: « Richesses » couvre ici les ressources matérielles et les biens, sans limiter le sens à l’argent liquide.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: royaume de Dieu
  rationale: Rendu français traditionnel, transparent et cohérent avec le vocabulaire concret de Marc.
- source_word: εἰσελεύσονται
  choice: d’entrer
  rationale: Après « il est difficile à… », l’infinitif constitue le rendu français naturel; il garde l’idée d’entrée sans alourdir la phrase par une construction future explicite.
theological_decisions:
- issue: La parole décrit-elle une impossibilité absolue ou une grande difficulté pour les personnes riches ?
  choice: une grande difficulté
  alternative: une impossibilité pratique ou absolue
  rationale: Le grec δυσκόλως exprime la difficulté, non l’impossibilité. La traduction préserve donc la tension de la parole sans en durcir la portée au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la force exclamative de la parole de Jésus et évite aussi bien le calque maladroit « combien difficilement » qu’une paraphrase doctrinale.
