    issue: La négation de λάβῃ n’est pas explicitée par « pas ».
    rationale: Dans un français international moderne, « qui ne reçoive » sans « pas » relève d’une omission littéraire peu naturelle et risque d’affaiblir la négation explicite de ἐὰν μὴ.
  - severity: low
    issue: « Dès maintenant » ajoute une nuance de commencement.
    rationale: νῦν indique « maintenant »; « dès » peut suggérer un point de départ qui n’est pas exprimé dans le grec.
  - severity: low
    issue: « Monde à venir » est moins précis que « âge à venir » pour αἰών.
    rationale: Le terme grec désigne ici l’âge ou l’ère à venir, en contraste avec « ce temps-ci ». « Monde » est possible, mais peut orienter vers un sens cosmologique.
