id: MRK.10.30
reference: Mark 10:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: fr
  text: 'qui ne reçoive pas, maintenant, en ce temps-ci, cent fois autant : des maisons, des frères, des sœurs, des mères, des enfants et des champs — avec des persécutions — et, dans l’âge à venir[a], la vie éternelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le monde à venir » ou « dans l’ère à venir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: reçoive
  rationale: Dans le contexte d’une promesse de contrepartie, « recevoir » exprime ce qui est accordé plutôt qu’une action de prise.
- source_word: ἑκατονταπλασίονα
  choice: cent fois autant
  rationale: Cette formulation française actuelle conserve clairement la valeur quantitative de « au centuple » sans registre soutenu ou vieilli.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: dès maintenant, en ce temps-ci
  rationale: « Dès maintenant » marque fortement l’actualité de la promesse, tandis que « en ce temps-ci » maintient le contraste temporel avec l’ère à venir.
- source_word: οἰκίας
  choice: maisons
  rationale: Équivalent concret et direct du pluriel grec.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: frères, des sœurs
  rationale: Les deux termes sont rendus séparément afin de préserver la distinction explicite du grec.
- source_word: μητέρας καὶ τέκνα
  choice: mères, des enfants
  rationale: Les pluriels et les catégories familiales du texte source sont conservés sans explicitation supplémentaire.
- source_word: ἀγρούς
  choice: champs
  rationale: « Champs » restitue naturellement l’image concrète de terres cultivées.
- source_word: μετὰ διωγμῶν
  choice: avec des persécutions
  rationale: La formulation reste explicite et préserve la tension entre l’abondance promise et la souffrance présente.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: dans le monde à venir
  rationale: En français biblique actuel, « le monde à venir » exprime naturellement l’ordre eschatologique futur visé par αἰών; une note signale l’équivalent plus formel « l’ère à venir ».
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Formulation française établie qui rend avec justesse le sens eschatologique de l’expression.
theological_decisions:
- issue: Nature de la contrepartie promise dans le temps présent
  choice: Conserver sans atténuation les maisons, les relations familiales et les champs comme contrepartie présente, avec les persécutions.
  alternative: Réduire la promesse à des bienfaits purement spirituels, ou en faire une garantie de prospérité matérielle sans souffrance.
  rationale: Le grec juxtapose délibérément une abondante contrepartie présente et les persécutions; la traduction ne tranche pas cette tension dans un sens doctrinal.
- issue: Rapport entre « ce temps-ci » et l’αἰών à venir
  choice: Maintenir le contraste entre le présent et « le monde à venir ».
  alternative: Comprendre αἰών comme le seul monde physique futur ou effacer la distinction eschatologique.
  rationale: Le texte oppose deux cadres temporels et eschatologiques; la traduction conserve cette structure sans en préciser davantage la chronologie.
- issue: Termes familiaux genrés
  choice: Rendre distinctement « frères » et « sœurs ».
  alternative: Employer seulement un collectif comme « frères et sœurs » au sens générique ou « membres de la fratrie ».
  rationale: Le grec nomme séparément les hommes et les femmes; la traduction garde cette distinction explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste le second membre d’une construction commencée au verset précédent. Les deux tirets mettent en relief « avec des persécutions » sans affaiblir son lien avec toute la promesse.
