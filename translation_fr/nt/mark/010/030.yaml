review_pass:
  verdict: revise
  source_fidelity: Révision mineure nécessaire. Le grec conserve la négation dans ἐὰν μὴ λάβῃ, et νῦν signifie « maintenant » sans la nuance inaugurale ajoutée par « dès maintenant ». Le contraste entre le temps présent et l’αἰών à venir est conservé plus directement par « l’âge à venir ».
  naturalness: « Qui ne reçoive pas » est la formulation moderne complète. « Maintenant, en ce temps-ci » est naturel dans ce fragment qui dépend de la construction du verset précédent. La ponctuation par tirets conserve bien l’incise « avec des persécutions ».
  terminology: « Cent fois autant », « maisons », « frères », « sœurs », « mères », « enfants », « champs », « persécutions » et « la vie éternelle » rendent les termes grecs avec précision. « L’âge à venir » rend αἰών comme cadre temporel/eschatologique plutôt que comme monde physique.
  issues:
