id: MRK.10.46
reference: Mark 10:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: fr
  text: Ils arrivent à Jéricho[a]. Puis, tandis que Jésus sortait de Jéricho avec ses disciples et une foule nombreuse[b], Bartimée, le fils de Timée, un mendiant aveugle, était assis au bord du chemin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici un présent historique : « ils arrivent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une foule considérable ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le long de la route ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: ils arrivent
  rationale: Le présent historique grec est naturel et vivant en français narratif; « arrivent » exprime aussi clairement l’entrée dans la ville.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: tandis que Jésus sortait
  rationale: Le génitif absolu marque une action simultanée. Le nom « Jésus » explicite naturellement le référent du pronom sans modifier le sens.
- source_word: ὄχλου ἱκανοῦ
  choice: une foule nombreuse
  rationale: ἱκανός indique ici une foule d’une importance notable; « nombreuse » est idiomatique et précis en français courant.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Bartimée, le fils de Timée
  rationale: Cette formulation conserve à la fois le nom sémitique et l’explication donnée par Marc, dans un ordre naturel en français.
- source_word: τυφλὸς προσαίτης
  choice: un mendiant aveugle
  rationale: La formulation rend directement les deux caractéristiques tout en respectant l’ordre français le plus naturel.
- source_word: παρὰ τὴν ὁδόν
  choice: au bord du chemin
  rationale: L’expression indique une position le long de la voie; « au bord du chemin » est claire, actuelle et idiomatique.
- source_word: Ἰεριχώ
  choice: Jéricho
  rationale: Forme française traditionnelle et courante du nom de lieu.
theological_decisions:
- issue: Identification narrative de Bartimée
  choice: Conserver à la fois « Bartimée » et « le fils de Timée » dans le texte principal.
  alternative: Ne garder que le nom « Bartimée » ou seulement sa traduction explicative.
  rationale: Le texte source fournit les deux éléments. Les maintenir préserve le détail explicatif de Marc sans réduire ni interpréter davantage l’identification.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique est conservé dans la première phrase, puis l’imparfait rend l’action en cours du génitif absolu et la situation de Bartimée. « Chemin » convient au cadre narratif, avec « route » signalé comme possibilité.
