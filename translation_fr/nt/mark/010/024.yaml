source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: fr
  text: 'Mais les disciples étaient stupéfaits de ses paroles. Jésus leur répondit de nouveau : « Enfants, qu’il est difficile d’entrer dans le royaume de Dieu ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: étaient stupéfaits
  rationale: L’imparfait exprime leur réaction persistante, et « stupéfaits » restitue la force du verbe sans l’exagérer.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: de ses paroles
  rationale: Avec le verbe français « être stupéfait », la préposition « de » indique naturellement ce qui provoque la stupéfaction.
- source_word: πάλιν ἀποκριθεὶς λέγει
  choice: reprit et leur dit
  rationale: « Reprit » rend naturellement l’idée de πάλιν et la reprise de parole portée par la tournure narrative ἀποκριθεὶς λέγει, sans calque lourd.
- source_word: Τέκνα
  choice: Mes enfants
  rationale: Cette apostrophe française naturelle conserve la chaleur familiale de τέκνα ; le possessif est idiomatique dans cette formule d’adresse et n’implique pas ici une précision doctrinale supplémentaire.
- source_word: πῶς δύσκολόν ἐστιν
  choice: qu’il est difficile
  rationale: La tournure exclamative « qu’il est difficile » restitue l’intensité de πῶς et s’accorde avec le point d’exclamation.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: d’entrer dans le royaume de Dieu
  rationale: Formulation française claire et consacrée qui rend directement le mouvement exprimé par εἰς et l’infinitif εἰσελθεῖν.
theological_decisions:
- issue: Inclusion de la leçon longue « pour ceux qui se confient dans les richesses »
  choice: 'Suivre la leçon courte du SBLGNT : « qu’il est difficile d’entrer dans le royaume de Dieu »'
  alternative: « Mes enfants, qu’il est difficile à ceux qui se confient dans les richesses d’entrer dans le royaume de Dieu ! »
  rationale: La leçon courte est celle du texte source fourni et conserve la portée ainsi que la tension de l’affirmation. La leçon longue, qui en restreint explicitement l’application, est signalée en note comme variante textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Stupéfaits » garde la vigueur du grec ; « reprit et leur dit » évite un sémitisme pesant ; l’exclamation conserve la force de πῶς.
