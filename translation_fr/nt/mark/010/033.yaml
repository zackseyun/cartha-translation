id: MRK.10.33
reference: Mark 10:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: fr
  text: « Voici, nous montons à Jérusalem. Le Fils de l’homme sera livré aux grands prêtres et aux spécialistes de la Loi. Ils le condamneront à mort et le livreront aux non-Juifs[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux nations »; il s’agit ici de personnes qui ne sont pas juives.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: non rendu séparément
  rationale: La conjonction introduit ici, dans la continuité du verset précédent, le contenu des paroles de Jésus. En français, la citation directe peut commencer naturellement sans « que ».
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Marqueur d’attention courant et digne, qui conserve la force d’appel sans archaïsme excessif.
- source_word: ἀναβαίνομεν
  choice: nous montons
  rationale: Rend le présent du déplacement et l’idée traditionnelle et géographique de monter à Jérusalem.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Traduction consacrée qui conserve la formulation grecque, l’écho à Daniel et la portée christologique du titre.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: sera livré / le livreront
  rationale: « Livrer » exprime la remise au pouvoir d’autrui sans préciser indûment une trahison; la répétition française conserve celle du même verbe grec.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: aux grands prêtres
  rationale: Désignation française habituelle des principales autorités sacerdotales juives de l’époque.
- source_word: τοῖς γραμματεῦσιν
  choice: aux spécialistes de la Loi
  rationale: Formulation compréhensible qui restitue la fonction religieuse et juridique de ces scribes sans suggérer de simples copistes.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: ils le condamneront à mort
  rationale: Rend directement la déclaration judiciaire exprimée par le verbe et son complément au datif.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans le récit de la Passion, le terme désigne les autorités appartenant aux nations autres qu’Israël; « non-Juifs » exprime clairement cette distinction en français moderne.
theological_decisions:
- issue: Titre ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’être humain / l’Humain
  rationale: La traduction traditionnelle et littérale préserve le caractère de désignation personnelle ainsi que les résonances scripturaires, sans réduire le titre à une simple affirmation d’humanité.
- issue: Portée de τοῖς ἔθνεσιν
  choice: aux non-Juifs
  alternative: aux nations
  rationale: Le contexte décrit le transfert de Jésus des responsables juifs aux autorités romaines. La traduction choisie rend cette opposition historique sans attribuer une valeur morale au groupe.
translation_notes:
  register: Français international actuel, clair et digne. « Voici » garde la solennité du signal discursif; « spécialistes de la Loi » évite l’ambiguïté moderne de « scribes ». La ponctuation en deux phrases allège la longue coordination grecque sans modifier sa progression.
