id: MRK.10.15
reference: Mark 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: fr
  text: 'Vraiment, je vous le dis : quiconque ne reçoit pas le royaume de Dieu comme un enfant[a] n’y entrera certainement pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « comme un enfant » peut évoquer notamment l’humilité, la confiance ou la dépendance, mais le grec ne précise pas quelle qualité est visée.
    reason: ambiguïté interprétative de la comparaison
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Dans cette formule introductive solennelle, ἀμήν affirme l’autorité et la certitude de la parole qui suit. « Vraiment » en rend naturellement la force en français moderne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française courante et solennelle rend directement le verbe au présent et le pronom au datif; le pronom « le » est idiomatique en français.
- source_word: ὃς ἂν
  choice: quiconque
  rationale: Le relatif accompagné de ἄν a une portée indéfinie et générale, bien exprimée par « quiconque ».
- source_word: μὴ δέξηται
  choice: n’accueille pas
  rationale: δέχομαι peut signifier recevoir, accepter ou accueillir. « Accueillir » exprime ici une réception ouverte et non une acquisition par l’effort, tout en restant naturel avec « le royaume de Dieu ».
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: C’est l’expression française consacrée et claire dans les Évangiles synoptiques; elle laisse subsister les dimensions de règne et de domaine sans en privilégier artificiellement une.
- source_word: ὡς παιδίον
  choice: comme un enfant
  rationale: ὡς introduit une comparaison et παιδίον désigne un enfant. La formulation française conserve la comparaison sans préciser la qualité enfantine visée.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: n’y entrera certainement pas
  rationale: La construction οὐ μή avec le subjonctif aoriste exprime une négation fortement emphatique. « Certainement pas » en restitue la vigueur sans archaïsme.
- source_word: εἰς αὐτήν
  choice: y
  rationale: Le pronom renvoie au royaume de Dieu. « Y entrer » est la formulation idiomatique en français.
theological_decisions:
- issue: Sens de l’accueil du royaume « comme un enfant »
  choice: Conserver la comparaison sans déterminer la qualité précise de l’enfant.
  alternative: Expliciter l’humilité, la confiance ou la dépendance de l’enfant.
  rationale: Le grec ne précise pas quelle caractéristique de l’enfant est en vue. L’expliciter dans le texte trancherait une ambiguïté réelle et introduirait une interprétation particulière.
translation_notes:
  register: Français international moderne, clair et digne. La formule introductive garde un ton solennel; la forte négation finale est explicite sans recourir à une tournure archaïque.
