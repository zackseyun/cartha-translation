id: MRK.10.43
reference: Mark 10:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: fr
  text: Mais il n’en est pas ainsi parmi vous[a]. Au contraire, celui qui veut devenir grand parmi vous sera votre serviteur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais ce n’est pas ainsi parmi vous. »'
    reason: lexical_alternative
  - marker: b
    text: 'Dans ce contexte, le futur « sera » peut aussi avoir le sens de « doit être » : celui qui veut devenir grand parmi vous doit être votre serviteur.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Mais il n’en est pas ainsi parmi vous
  rationale: Cette formulation naturelle conserve la négation de la manière d’agir évoquée dans le contexte ainsi que la valeur contrastive de δέ.
- source_word: ἀλλ’
  choice: Au contraire
  rationale: Cette expression marque nettement la forte opposition entre le modèle des dirigeants des nations et celui que Jésus donne à ses disciples.
- source_word: ὃς ἂν θέλῃ
  choice: celui qui veut
  rationale: La relative indéfinie avec ἄν et le subjonctif énonce une condition générale; cette tournure est idiomatique en français et garde la dimension volontaire de θέλω.
- source_word: μέγας γενέσθαι
  choice: devenir grand
  rationale: « Devenir » rend la valeur ingressive de γενέσθαι, tandis que « grand » préserve le langage de rang et de statut de μέγας.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: La formule convient au sens communautaire et social de l’expression et peut être employée naturellement aux deux occurrences.
- source_word: ἔσται ὑμῶν διάκονος
  choice: sera votre serviteur
  rationale: « Sera » conserve la forme future du grec, malgré sa portée normative possible dans ce contexte. « Serviteur » exprime le service humble sans faire de διάκονος un titre ecclésiastique.
theological_decisions:
- issue: Valeur du futur ἔσται dans l’enseignement de Jésus
  choice: sera votre serviteur
  alternative: doit être votre serviteur
  rationale: Le futur indicatif peut ici avoir une portée prescriptive, mais conserver le futur maintient la forme et la tension du grec sans transformer explicitement la phrase en commandement.
- issue: Sens de διάκονος
  choice: serviteur
  alternative: ministre
  rationale: Dans ce contexte, le mot désigne celui qui se met au service des autres plutôt qu’une fonction officielle dans l’Église; « serviteur » évite donc un anachronisme institutionnel.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste rhétorique, la répétition de « parmi vous », le devenir exprimé par γενέσθαι et l’ambiguïté entre futur descriptif et portée normative.
