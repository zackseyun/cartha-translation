reference: Mark 10:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: fr
  text: Mais lui, le visage assombri par cette parole[a], s’en alla attristé, car il avait beaucoup de biens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consterné par cette parole » ou « le visage défait à cause de cette parole ». Le grec suggère que son expression s’est visiblement assombrie.
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: le visage assombri
  rationale: Le participe évoque un assombrissement visible de l’expression. Cette formulation française conserve l’image sans réduire la réaction à une émotion purement intérieure.
- source_word: ἐπὶ τῷ λόγῳ
  choice: par cette parole
  rationale: La préposition indique ici la cause ou l’occasion de la réaction. « Cette parole » reprend naturellement, au singulier, ce que Jésus vient de dire.
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: Expression narrative courante et naturelle qui rend directement le déplacement exprimé par le verbe.
- source_word: λυπούμενος
  choice: profondément attristé
  rationale: Le participe présent décrit la tristesse qui accompagne son départ. « Profondément » restitue le poids affectif du verbe sans introduire de jugement moral.
- source_word: κτήματα πολλά
  choice: beaucoup de biens
  rationale: κτήματα désigne des biens ou des propriétés, et πολλά leur quantité ou leur importance. « Beaucoup de biens » est idiomatique et suffisamment large.
- source_word: ἦν γὰρ ἔχων
  choice: car il avait
  rationale: Cette formulation française naturelle rend l’état durable exprimé par la construction périphrastique grecque.
theological_decisions:
- issue: Nature de la réaction de l’homme à l’exigence de Jésus
  choice: Une expression visiblement assombrie et une profonde tristesse, sans commentaire moral ajouté
  alternative: Une réaction de colère, de révolte ou une simple déception
  rationale: Le grec décrit l’assombrissement de son expression et sa tristesse persistante, mais ne qualifie pas explicitement sa réaction de colère ou de rébellion. La traduction préserve cette tension narrative.
translation_notes:
  register: Français international moderne, naturel et digne. « Le visage assombri » conserve l’image concrète du grec; « profondément attristé » exprime la tristesse qui se prolonge pendant son départ. Le marqueur [a] figure immédiatement après l’expression concernée.
