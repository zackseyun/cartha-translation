  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: fr
  text: 'Ils répondirent : « Moïse a permis d’écrire un acte de divorce[a] et de renvoyer sa femme[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un certificat de divorce ». L’expression grecque désigne un document juridique écrit attestant le divorce.
    reason: lexical_alternative
  - marker: b
    text: Ou « et de divorcer ». Littéralement, « et de renvoyer »; dans ce contexte matrimonial, il s’agit du divorce.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Dans cet échange, δέ introduit la réplique des interlocuteurs déjà mentionnés. « Ils répondirent » rend naturellement la progression du dialogue sans accentuer indûment un contraste.
- source_word: Ἐπέτρεψεν
  choice: a permis
  rationale: Le verbe ἐπιτρέπω exprime clairement une permission, non un commandement, distinction essentielle dans le contexte immédiat.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom.
- source_word: βιβλίον ἀποστασίου
  choice: un acte de divorce
  rationale: L’expression désigne le document juridique écrit constatant le divorce. « Acte de divorce » est clair, actuel et conserve le registre légal.
- source_word: γράψαι
  choice: d’écrire
  rationale: Rend directement l’infinitif aoriste de γράφω sans préciser excessivement la manière de préparer le document.
- source_word: καὶ ἀπολῦσαι
  choice: et de renvoyer sa femme
  rationale: Dans ce contexte matrimonial, ἀπολύω désigne le renvoi qui constitue le divorce. Cette formulation conserve l’image verbale grecque; « sa femme » explicite en français l’objet sous-entendu par le contexte.
theological_decisions:
- issue: Nature de la disposition mosaïque concernant le divorce
  choice: Moïse a permis le divorce
  alternative: Moïse a ordonné d’écrire un acte de divorce
  rationale: Ἐπέτρεψεν signifie explicitement « a permis ». La traduction maintient ainsi la distinction contextuelle entre une concession et l’intention créatrice de Dieu, sans transformer la permission en commandement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la nuance juridique de l’acte écrit et la différence décisive entre permettre et commander.
