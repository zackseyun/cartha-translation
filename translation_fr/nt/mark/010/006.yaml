  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: fr
  text: Mais, dès le commencement de la création, il les fit mâle et femelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il les fit homme et femme ». Le grec emploie les termes « mâle » et « femelle »; le verbe signifie « fit », mais « créa » reflète l’arrière-plan de la Genèse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Mais dès le commencement de la création
  rationale: « Mais » rend la valeur contrastive de δέ dans le contexte. « Dès » exprime naturellement en français le point de départ temporel marqué par ἀπό, tandis que « le commencement de la création » conserve la relation génitive du grec.
- source_word: ἄρσεν καὶ θῆλυ
  choice: homme et femme
  rationale: Dans cette citation de Genèse 1.27, le couple français idiomatique « homme et femme » désigne les deux sexes humains et évite le caractère clinique ou substantivé de « mâle et femelle » appliqué à des personnes.
- source_word: ἐποίησεν
  choice: fit
  rationale: « Fit » correspond directement au sens courant de ποιέω et évite de remplacer sans indication le verbe grec par « créa », même si le contexte est celui de la création.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom objet pluriel renvoie aux êtres humains désignés comme homme et femme; « les » le rend sans ajouter « tous deux ».
theological_decisions:
- issue: Rendu des termes sexués dans la citation de la Genèse
  choice: homme et femme
  alternative: mâle et femelle
  rationale: Le français courant emploie « homme et femme » pour les personnes humaines, tout en maintenant la distinction sexuée de ἄρσεν καὶ θῆλυ. Une note conserve l'accès au rendu plus formel.
- issue: Sujet divin implicite
  choice: il les fit
  alternative: Dieu les fit
  rationale: Le grec laisse le sujet de ἐποίησεν implicite. Le pronom « il », compréhensible dans le contexte, préserve cette forme sans introduire explicitement « Dieu » dans le corps du verset.
translation_notes:
  register: Français moderne, naturel et digne. « Dès le commencement » est idiomatique; le passé simple « fit » convient au registre biblique soutenu sans être archaïque. La note signale à la fois la formulation grecque plus littérale des termes sexués et l’alternative « créa ».
