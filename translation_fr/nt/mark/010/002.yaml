id: MRK.10.2
reference: Mark 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: fr
  text: Et ils lui demandaient s’il est permis à un homme de répudier sa femme[a], afin de le mettre à l’épreuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’il est permis à un mari de répudier sa femme ».'
    reason: ἀνήρ peut signifier « homme » ou « mari »; dans ce contexte, γυνή signifie « femme » au sens d’« épouse ».
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ils lui demandaient
  rationale: L’imparfait grec présente la question comme une action en cours ou répétée. L’imparfait français rend naturellement cet aspect.
- source_word: ἔξεστιν
  choice: il est permis
  rationale: Dans ce débat sur le divorce, le verbe exprime ce qui est autorisé par la loi ou la norme, non une simple possibilité.
- source_word: ἀνδρὶ
  choice: à un homme
  rationale: ἀνήρ peut désigner soit un homme, soit un mari. « Un homme » conserve la forme générique du grec, tandis que le contexte conjugal est rendu explicite par « sa femme ».
- source_word: γυναῖκα
  choice: sa femme
  rationale: Dans ce contexte matrimonial, γυνή signifie « femme, épouse ». Le possessif, absent mais implicite en grec, est nécessaire à une formulation française naturelle.
- source_word: ἀπολῦσαι
  choice: répudier
  rationale: Dans un contexte matrimonial et juridique, ἀπολύω désigne le renvoi de l’épouse, c’est-à-dire le divorce. « Répudier » conserve l’action unilatérale exprimée ici tout en restant intelligible en français.
- source_word: πειράζοντες αὐτόν
  choice: afin de le mettre à l’épreuve
  rationale: Le participe indique ici le but hostile de leur question. Cette formulation reste proche du sens sans expliciter davantage l’idée de piège.
- source_word: Καὶ
  choice: Et
  rationale: La conjonction simple maintient l’enchaînement narratif sans ajouter une nuance temporelle absente du grec.
theological_decisions:
- issue: Ambiguïté de ἀνήρ entre « homme » et « mari » dans une question juridique sur le mariage
  choice: à un homme
  alternative: à un mari
  rationale: Le texte principal préserve la portée générique et la forme du grec. La note signale la lecture conjugale tout aussi possible, sans imposer une résolution théologique de l’ambiguïté.
- issue: Nature de la démarche exprimée par πειράζοντες
  choice: afin de le mettre à l’épreuve
  alternative: pour lui tendre un piège
  rationale: « Mettre à l’épreuve » conserve la gamme sémantique du verbe grec. « Tendre un piège » rendrait explicite une intention hostile vraisemblable, mais plus interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Répudier » est légèrement juridique, mais il exprime plus précisément que « divorcer » l’acte unilatéral évoqué par ἀπολύω. La syntaxe reste fluide pour une lecture publique.
