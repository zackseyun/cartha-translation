  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: fr
  text: 'Il lui dit : « Maître, j’ai observé tout cela depuis ma jeunesse. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: dit
  rationale: Verbe courant d’énonciation dans le récit; « dit » est naturel et fidèle sans ajouter l’idée explicite d’une réponse.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe, « Maître » est l’équivalent français usuel et digne pour un enseignant reconnu; ici, il ne sert pas à importer un titre doctrinal particulier.
- source_word: ταῦτα πάντα
  choice: tout cela
  rationale: Cette tournure française idiomatique reprend collectivement tous les commandements qui viennent d’être cités.
- source_word: ἐφυλαξάμην
  choice: j’ai observé
  rationale: Dans le contexte de commandements, φυλάσσω signifie les respecter ou les mettre en pratique. « J’ai observé » conserve cette nuance sans suggérer une simple garde matérielle.
- source_word: ἐκ νεότητός μου
  choice: depuis ma jeunesse
  rationale: « Depuis » exprime naturellement le point de départ temporel et la continuité jusqu’au moment présent, tandis que « jeunesse » évite de préciser indûment l’âge.
- source_word: ὁ δὲ
  choice: Il
  rationale: Le français n’exige pas ici de rendre δέ par une conjonction; l’enchaînement narratif reste clair et naturel sans introduire un contraste plus fort que le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation garde l’affirmation du personnage telle quelle, sans l’approuver ni la contester implicitement.
