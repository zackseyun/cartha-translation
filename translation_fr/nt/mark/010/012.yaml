  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: fr
  text: Et si elle divorce de son mari[a] et épouse un autre homme, elle commet un adultère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « renvoie son mari ». Dans ce contexte matrimonial, le sens est « divorce de son mari ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction naturelle qui relie cette déclaration au cas parallèle du verset précédent.
- source_word: ἐὰν
  choice: si
  rationale: Introduit naturellement la condition exprimée dans cette parole morale.
- source_word: αὐτὴ
  choice: elle
  rationale: Conserve le sujet féminin explicite du grec sans alourdir la phrase par « elle-même ».
- source_word: ἀπολύσασα
  choice: divorce de
  rationale: Dans ce contexte matrimonial, le verbe désigne la dissolution du mariage. « Divorce de » est clair et idiomatique en français moderne; le sens plus littéral est signalé en note.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: son mari
  rationale: Dans ce contexte, ἀνήρ désigne le mari, et non simplement un homme.
- source_word: γαμήσῃ ἄλλον
  choice: en épouse un autre
  rationale: « Un autre » est masculin en français et conserve donc la référence explicite à un autre homme; le pronom « en » reprend naturellement l’idée de mariage.
- source_word: μοιχᾶται
  choice: elle commet un adultère
  rationale: Rend directement et idiomatiquement le présent grec sans transformer l’acte en étiquette désignant la personne.
theological_decisions:
- issue: Maintien de la formulation propre à chaque sexe
  choice: « si elle divorce de son mari et en épouse un autre »
  alternative: « si une personne divorce de son conjoint et se remarie »
  rationale: Le grec nomme explicitement une femme, son mari et un autre homme. La traduction conserve cette précision ainsi que le parallèle voulu avec le verset précédent, sans neutraliser le genre.
- issue: Sens matrimonial de ἀπολύω
  choice: « divorce de »
  alternative: « renvoie » ou « répudie »
  rationale: Le contexte porte sur la dissolution du mariage. « Divorce de » en communique clairement la portée en français actuel, tandis qu’une note préserve l’image lexicale plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe concise conserve le parallélisme de la parole grecque et sa formulation explicitement féminine et masculine.
