  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: fr
  text: 'Mais Jésus leur dit : « Vous ne savez pas ce que vous demandez. Pouvez-vous boire la coupe que je bois[a], ou être baptisés du baptême dont je suis baptisé[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « coupe » est, dans la Bible, une image de la part attribuée à quelqu’un ; elle désigne ici tout particulièrement les souffrances qui attendent Jésus.
    reason: cross_reference
  - marker: b
    text: 'Ou, de manière plus interprétative : « subir le baptême que je subis ». Le grec répète les mots de la même famille que « baptême » pour produire un effet d’insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mais Jésus leur dit
  rationale: δέ marque ici le tournant correctif de la réponse de Jésus; « mais » le rend naturellement en français.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Vous ne savez pas ce que vous demandez
  rationale: Cette formulation reste proche du sens premier de οἶδα et conserve la franchise de la réprimande sans remplacer « savoir » par l'interprétation « comprendre ».
- source_word: δύνασθε
  choice: Pouvez-vous
  rationale: En français actuel, « pouvez-vous » exprime naturellement la capacité visée par δύναμαι; « êtes-vous capables de » serait plus lourd.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: boire la coupe que je bois
  rationale: La traduction conserve littéralement la métaphore biblique de la coupe et la répétition du verbe, sans l'expliciter dans le corps du texte.
- source_word: ἢ
  choice: ou
  rationale: Le disjonctif du texte SBLGNT est respecté sans harmonisation avec d'autres traditions textuelles ou passages parallèles.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: recevoir le baptême que je reçois
  rationale: Cette formulation française conserve le nom « baptême » et sa force métaphorique, tout en évitant la tournure peu naturelle « être baptisés du baptême dont je suis baptisé ». La répétition de « recevoir » reflète partiellement la répétition grecque, tandis qu'une note signale sa forme exacte.
theological_decisions:
- issue: Langage métaphorique de la coupe et du baptême
  choice: Conserver les deux métaphores dans le texte principal sans les définir comme souffrance, mort ou colère divine.
  alternative: Paraphraser par « subir les souffrances que je vais subir » ou une formulation analogue.
  rationale: Les images annoncent la destinée prochaine de Jésus, particulièrement ses souffrances, mais le verset ne les explique pas entièrement. Les maintenir préserve leur portée biblique et la tension théologique du passage.
- issue: Valeur du baptême métaphorique
  choice: Employer « recevoir le baptême » plutôt que réduire l'image à « subir une épreuve ».
  alternative: Traduire de façon interprétative par « subir ce que je vais subir ».
  rationale: Le grec emploie explicitement le groupe lexical βάπτισμα/βαπτίζω. Garder « baptême » préserve l'image d'immersion et les résonances du terme sans l'identifier exclusivement à une seule doctrine.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement collectif est rendu par « vous ». Les métaphores bibliques sont conservées, mais la construction baptismale est légèrement idiomatisée afin d'éviter un calque obscur.
