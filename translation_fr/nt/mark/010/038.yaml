review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement le grec. « Boire la coupe que je bois » conserve correctement la métaphore et la répétition. En revanche, « recevoir le baptême que je reçois » atténue le parallélisme lexical βάπτισμα/βαπτίζομαι/βαπτισθῆναι et peut évoquer en français la réception d’un rite. Le grec exprime explicitement le fait d’être baptisé du baptême dont Jésus est lui-même baptisé.
  naturalness: Le texte est globalement naturel, sobre et adapté au français international moderne. La construction « être baptisés du baptême dont je suis baptisé » est plus solennelle et moins courante que « recevoir le baptême », mais elle est intelligible, idiomatique dans un registre biblique, et justifiée ici par la répétition délibérée du grec.
  terminology: « Coupe » et « baptême » sont les termes appropriés et préservent les deux métaphores sans les réduire à une interprétation doctrinale. La correction rétablit également la cohérence entre le texte principal, la note lexicale et la décision de préserver la famille de mots grecque.
  issues:
