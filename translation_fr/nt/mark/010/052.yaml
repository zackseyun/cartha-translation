id: MRK.10.52
reference: Mark 10:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: fr
  text: 'Et Jésus lui dit : « Va ; ta foi[a] t’a sauvé[b]. » Aussitôt, il retrouva la vue et le suivit sur le chemin[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « confiance ».
    reason: alternative_reading
  - marker: b
    text: Ou « t’a guéri » ou « t’a rétabli ». Le verbe grec peut désigner aussi bien la guérison que le salut.
    reason: lexical_alternative
  - marker: c
    text: Ou « sur la route ». Le mot grec peut désigner concrètement une route ou, plus largement, un chemin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Va
  rationale: Impératif simple et direct, naturel en français, sans ajouter l’idée possessive de « poursuis ton chemin ».
- source_word: πίστις
  choice: foi
  rationale: « Foi » conserve le terme biblique central tout en exprimant ici la confiance placée en Jésus ; « confiance » reste une possibilité signalée en note.
- source_word: σέσωκέν
  choice: t’a sauvé
  rationale: Le parfait de σῴζω peut désigner le salut, la délivrance ou la guérison. « T’a sauvé » préserve cette ampleur et la tension entre la guérison physique immédiate et un salut plus large.
- source_word: εὐθύς
  choice: Aussitôt
  rationale: Rend naturellement la rapidité narrative caractéristique de Marc.
- source_word: ἀνέβλεψεν
  choice: il retrouva la vue
  rationale: Dans le contexte de la guérison d’un aveugle, le verbe désigne clairement le recouvrement de la vue plutôt que le fait de lever les yeux.
- source_word: ἠκολούθει
  choice: le suivit
  rationale: Le passé simple donne une narration française fluide. L’imparfait grec présente l’action comme suivie ou continue, mais « le suivait » serait moins naturel après « aussitôt » dans cette phrase.
- source_word: ἐν τῇ ὁδῷ
  choice: sur le chemin
  rationale: « Chemin » garde à la fois le cadre concret du déplacement et la possible résonance du chemin du disciple chez Marc, sans imposer cette dernière.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Et Jésus
  rationale: Conserve la coordination narrative de καί sans la transformer en indication temporelle plus explicite.
theological_decisions:
- issue: Portée de σῴζω dans la déclaration de Jésus
  choice: t’a sauvé
  alternative: t’a guéri ; t’a rétabli
  rationale: Le contexte manifeste une guérison physique, mais le verbe grec a aussi le sens plus large de sauver. La formulation retenue évite de réduire cette polysémie et la portée théologique possible.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance
  rationale: Dans ce récit, le mot exprime la confiance de l’homme en Jésus. « Foi » maintient toutefois la continuité du terme grec et n’exclut pas cette nuance relationnelle.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation distingue clairement l’ordre de Jésus de sa déclaration, et les notes préservent les principales ambiguïtés lexicales.
