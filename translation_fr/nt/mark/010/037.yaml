  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: fr
  text: 'Ils lui dirent : « Accorde-nous de siéger, l’un à ta droite et l’autre à ta gauche, dans ta gloire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: Accorde-nous
  rationale: Rend naturellement en français la demande formulée par l’impératif « donne-nous », avec le sens de concéder une faveur.
- source_word: καθίσωμεν
  choice: de siéger
  rationale: « Siéger » exprime ici le fait d’occuper une place d’honneur, tout en restant clair et digne.
- source_word: ἐκ δεξιῶν … ἐξ ἀριστερῶν
  choice: à ta droite … à ta gauche
  rationale: Formulation française idiomatique qui conserve exactement l’opposition spatiale et honorifique du grec.
- source_word: ἐν τῇ δόξῃ σου
  choice: dans ta gloire
  rationale: Traduction formellement proche qui préserve l’ambiguïté quant à la manifestation ou au cadre de cette gloire.
theological_decisions:
- issue: Nature de la gloire de Jésus
  choice: dans ta gloire
  alternative: quand tu seras dans ta gloire
  rationale: Le grec dit littéralement « dans ta gloire » et ne précise pas explicitement un moment futur; la traduction conserve cette tension sans l’interpréter.
- issue: Identité des deux places demandées
  choice: l’un … l’autre
  alternative: l’un de nous … l’autre
  rationale: Le contexte et la première personne plurielle rendent « de nous » implicite en français; aucune personne extérieure au groupe des deux demandeurs n’est suggérée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et conserve la demande ambitieuse sans ajout explicatif.
