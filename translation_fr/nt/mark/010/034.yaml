id: MRK.10.34
reference: Mark 10:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: fr
  text: Ils se moqueront de lui, lui cracheront dessus, le fouetteront et le tueront ; et, après trois jours[a], il ressuscitera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans trois jours ». Le grec de Marc dit « après trois jours », tandis que d’autres passages disent « le troisième jour ».'
    reason: Signale l’autre rendu possible et la formulation chronologique différente d’autres passages, sans harmoniser le texte principal.
lexical_decisions:
- source_word: ἐμπαίξουσιν αὐτῷ
  choice: ils se moqueront de lui
  rationale: « Se moquer de » exprime naturellement en français moderne la dérision hostile et méprisante du verbe grec.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: lui cracheront dessus
  rationale: Cette tournure française courante rend clairement le crachat dirigé contre Jésus comme geste d’humiliation.
- source_word: μαστιγώσουσιν αὐτόν
  choice: le fouetteront
  rationale: « Fouetter » est clair et accessible, tout en exprimant le châtiment corporel désigné par le verbe grec; « flageller » serait plus traditionnel mais moins courant.
- source_word: ἀποκτενοῦσιν
  choice: le tueront
  rationale: Le verbe signifie simplement « tuer »; cette traduction n’ajoute ni la nuance judiciaire de « mettre à mort » ni la qualification morale de « assassiner ».
- source_word: μετὰ τρεῖς ἡμέρας
  choice: après trois jours
  rationale: Avec l’accusatif, μετά signifie normalement « après ». La formulation propre à Marc est conservée sans l’harmoniser avec « le troisième jour » dans d’autres passages.
- source_word: ἀναστήσεται
  choice: il ressuscitera
  rationale: Dans ce contexte de mort suivie du retour à la vie, « ressusciter » employé intransitivement rend naturellement le futur grec sans le transformer en passif et sans ajouter « de nouveau ».
theological_decisions:
- issue: Formulation de la résurrection
  choice: il ressuscitera
  alternative: il sera ressuscité; il ressuscitera de nouveau
  rationale: Le futur moyen ἀναστήσεται se prête à une formulation intransitive. Celle-ci respecte la forme du texte sans nier les passages qui parlent de Dieu relevant Jésus; « de nouveau » n’est pas explicitement exprimé.
- issue: Indication chronologique
  choice: après trois jours
  alternative: le troisième jour; dans trois jours
  rationale: La traduction conserve l’expression grecque de Marc et la tension avec les passages parallèles formulés autrement, plutôt que de les harmoniser silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La coordination a été légèrement allégée pour rester naturelle en français, sans supprimer aucun élément du grec. « Puis » rend la dernière coordination dans sa progression narrative.
