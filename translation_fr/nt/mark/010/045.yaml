id: MRK.10.45
reference: Mark 10:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: fr
  text: Car même le Fils de l’homme n’est pas venu pour être servi, mais pour servir et donner sa vie en rançon pour beaucoup[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en rançon à la place de beaucoup ». La préposition grecque traduite par « pour » peut exprimer le remplacement ou l’échange.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car même
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « même » rend l’insistance de καί et rattache naturellement cette parole à l’enseignement précédent.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation consacrée préserve le titre employé par Jésus ainsi que ses résonances scripturaires, notamment daniélique.
- source_word: οὐκ ἦλθεν
  choice: n’est pas venu
  rationale: Rend directement l’aoriste de ἔρχομαι; les infinitifs qui suivent expriment le but de cette venue.
- source_word: διακονηθῆναι … διακονῆσαι
  choice: être servi … servir
  rationale: La répétition de la même racine française restitue clairement l’opposition rhétorique entre recevoir un service et servir.
- source_word: δοῦναι
  choice: donner
  rationale: Le sens courant de δίδωμι convient ici et n’ajoute pas une nuance plus étroite que le texte ne formule pas.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans ce contexte, ψυχή désigne la vie livrée jusqu’à la mort, et non spécifiquement l’âme immatérielle.
- source_word: λύτρον
  choice: rançon
  rationale: « Rançon » exprime avec concision le prix permettant une libération et conserve le poids métaphorique et théologique du terme.
- source_word: ἀντὶ πολλῶν
  choice: pour beaucoup
  rationale: Cette expression est naturelle en français et laisse la note préciser que ἀντί peut marquer plus explicitement le remplacement ou l’échange.
theological_decisions:
- issue: Portée de ἀντί dans l’image de la rançon
  choice: « pour beaucoup » dans le texte, avec explicitation en note
  alternative: « à la place de beaucoup » ou « en échange de beaucoup »
  rationale: ἀντί porte naturellement une idée de correspondance, d’échange ou de substitution. Le texte principal demeure fluide sans effacer cette force lexicale, qui est signalée dans la note.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique « être servi, mais servir » est conservée, ainsi que le titre traditionnel « Fils de l’homme ». Le vocabulaire reste accessible sans atténuer l’image de la rançon ni trancher au-delà de la formulation grecque.
