id: MRK.10.18
reference: Mark 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Pourquoi m’appelles-tu bon[a] ? Personne n’est bon, sinon un seul : Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Qu’est-ce qui te fait m’appeler bon ? »'
    reason: Alternative lexicale reflétant plus explicitement la valeur littérale possible de τί dans la construction με λέγεις ἀγαθόν, sans imposer cette tournure au texte principal.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque naturellement la légère transition contrastive entre l’interpellation de l’homme et la réponse de Jésus.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Rend directement le verbe λέγω et son complément indirect dans un français courant et digne.
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette construction, τί a une valeur adverbiale interrogative; « pourquoi » exprime idiomatiquement le sens en français, tandis qu’une traduction formelle par « quoi » serait peu naturelle.
- source_word: με λέγεις ἀγαθόν
  choice: m’appelles-tu bon
  rationale: Préserve la relation prédicative entre le pronom objet et l’adjectif, ainsi que la question directe de Jésus.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: bon
  rationale: Le même terme est conservé dans les deux occurrences afin de préserver la répétition et la force rhétorique du grec.
- source_word: οὐδεὶς
  choice: Personne
  rationale: Équivalent français naturel de la négation universelle portant sur une personne.
- source_word: εἰ μὴ εἷς
  choice: sinon un seul
  rationale: Rend explicitement l’exception et maintient l’accent placé sur l’unicité avant l’identification de Dieu.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Le nom propre sans article est la formulation française naturelle; l’article grec n’exige pas « le Dieu » ici.
theological_decisions:
- issue: Portée christologique de la déclaration de Jésus sur la bonté
  choice: Traduire directement la parole sans ajouter de précision interprétative.
  alternative: Formuler la phrase de manière à faire dire explicitement à Jésus soit qu’il n’est pas divin, soit qu’il affirme ici ouvertement sa divinité.
  rationale: Le grec pose une question et affirme que Dieu seul est bon, sans expliciter dans ce verset le rapport exact entre ces deux éléments. La traduction conserve donc cette tension théologique.
translation_notes:
  register: 'Français international moderne, clair et digne. Le tutoiement correspond au dialogue direct. La ponctuation « sinon un seul : Dieu » conserve l’insistance du grec sur εἷς sans alourdir la phrase.'
