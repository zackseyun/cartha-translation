id: MRK.10.32
reference: Mark 10:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: fr
  text: Ils étaient en chemin[a] et montaient à Jérusalem. Jésus marchait devant eux ; ils étaient stupéfaits, tandis que ceux qui suivaient avaient peur. Il prit de nouveau les Douze à part[b] et se mit à leur dire ce qui allait lui arriver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur la route ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « prit de nouveau les Douze avec lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: Expression française naturelle qui conserve à la fois le déplacement concret et la possible portée narrative de « la voie ».
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: montaient à Jérusalem
  rationale: Conserve le mouvement ascendant vers Jérusalem, lié à sa situation géographique et au langage traditionnel du pèlerinage.
- source_word: προάγων αὐτούς
  choice: marchait devant eux
  rationale: Décrit directement la position de Jésus en tête du groupe sans ajouter explicitement l'idée plus interprétative de direction.
- source_word: ἐθαμβοῦντο
  choice: étaient stupéfaits
  rationale: Rend la forte stupeur ou saisissement exprimé par le verbe, sans l'intensifier jusqu'à l'horreur.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: tandis que ceux qui suivaient
  rationale: Maintient la formulation participiale et ne précise pas davantage l'identité de ce groupe que ne le fait le grec.
- source_word: ἐφοβοῦντο
  choice: avaient peur
  rationale: Formulation française directe qui distingue nettement cette réaction de la stupeur exprimée par le verbe précédent.
- source_word: παραλαβὼν πάλιν τοὺς δώδεκα
  choice: prit de nouveau les Douze à part
  rationale: Formulation idiomatique correspondant à une instruction adressée spécialement aux Douze ; une note signale que le verbe signifie plus littéralement les prendre avec soi.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: se mit à leur dire
  rationale: Rend naturellement en français la valeur inchoative de ἤρξατο et conserve les Douze comme destinataires.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: ce qui allait lui arriver
  rationale: Préserve l'imminence des événements sans introduire une notion de destin plus forte que celle qu'impose le grec.
theological_decisions:
- issue: Distinction entre les réactions émotionnelles des deux groupes
  choice: « ils étaient stupéfaits » et « ceux qui suivaient avaient peur »
  alternative: Fondre les deux réactions en une même idée générale d'étonnement ou de crainte
  rationale: Le grec emploie deux verbes distincts et présente deux réactions différentes. La traduction maintient cette tension narrative sans identifier plus précisément les groupes.
- issue: Sens contextuel de παραλαμβάνω
  choice: « prit … à part » dans le texte, avec une note donnant le sens plus littéral
  alternative: « prit … avec lui »
  rationale: Le contexte suggère une instruction particulière aux Douze, mais le verbe lui-même signifie d'abord prendre quelqu'un avec soi. La note conserve cette latitude sémantique.
translation_notes:
  register: Français international moderne, sobre et narratif. Les phrases sont légèrement segmentées pour une lecture claire, tout en conservant la progression de la scène et la distinction entre stupeur et peur.
