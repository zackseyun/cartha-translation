  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: fr
  text: Ils lui donnaient du vin mêlé de myrrhe[a], mais il n’en prit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils lui offraient du vin mêlé de myrrhe. »'
    reason: L’imparfait de δίδωμι peut décrire ici une tentative, que le français rend naturellement par « offrir ».
lexical_decisions:
- source_word: ἐδίδουν
  choice: ils lui donnaient
  rationale: L’imparfait grec présente l’action en cours ou comme une tentative. L’imparfait français conserve naturellement cet aspect, tandis que « ils lui offrirent » serait plus idiomatique mais moins directement lié au sens de « donner ».
- source_word: ἐσμυρνισμένον οἶνον
  choice: du vin mêlé de myrrhe
  rationale: Le participe de σμυρνίζω désigne du vin préparé avec de la myrrhe. « Mêlé de myrrhe » est clair, actuel et digne, sans préciser un effet ou une finalité que le texte ne donne pas.
- source_word: ὃς δὲ
  choice: mais il
  rationale: Le pronom relatif grec fonctionne ici comme une reprise du sujet, Jésus, et δέ marque un léger contraste. « Mais il » rend naturellement cette construction en français.
- source_word: ἔλαβεν
  choice: il n’en prit pas
  rationale: λαμβάνω signifie couramment « prendre » ou « recevoir ». Le pronom « en » reprend naturellement le vin en français, sans ajouter d’objet étranger au contexte.
theological_decisions:
- issue: Nature du refus de Jésus
  choice: Décrire simplement qu’il ne prit pas le vin
  alternative: Expliquer qu’il refusa un narcotique destiné à atténuer la douleur, ou attribuer un autre motif à son refus
  rationale: Le verset ne précise ni l’effet recherché du mélange ni la raison du refus. La traduction ne doit donc pas intégrer une explication interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait maintient l’aspect narratif du grec; « mêlé de myrrhe » évite une formulation archaïque; aucune raison théologique ou médicale n’est ajoutée au refus.
