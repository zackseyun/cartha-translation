source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: fr
  text: Joseph d’Arimathée, membre respecté du conseil, qui lui aussi attendait le royaume de Dieu, eut le courage de se présenter devant Pilate[a] et lui demanda le corps de Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « osa se présenter devant Pilate » ; le grec souligne le courage de Joseph dans cette démarche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: intégré au mouvement exprimé par « se présenter »
  rationale: Le participe aoriste introduit l’arrivée de Joseph. En français naturel, son mouvement est déjà compris dans « se présenter devant Pilate »; le rendre séparément par « étant venu » alourdirait la phrase.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: d’Arimathée
  rationale: Expression française idiomatique et concise qui indique fidèlement l’origine de Joseph.
- source_word: εὐσχήμων
  choice: respecté
  rationale: Le mot évoque une personne honorable, estimée ou de haut rang. « Respecté » est clair, actuel et n’exagère pas son statut.
- source_word: βουλευτής
  choice: membre du Conseil
  rationale: Désigne un membre d’un conseil dirigeant. La majuscule contextuelle permet d’identifier l’institution sans introduire explicitement le nom « Sanhédrin », absent du grec.
- source_word: ὃς καὶ αὐτὸς
  choice: qui lui aussi
  rationale: Conserve l’insistance de καὶ αὐτός sur le fait que Joseph partageait personnellement cette attente.
- source_word: ἦν προσδεχόμενος
  choice: attendait
  rationale: La construction périphrastique exprime une attente continue; l’imparfait français en rend naturellement la durée.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Rendu direct et consacré de cette expression centrale des Évangiles.
- source_word: τολμήσας
  choice: eut le courage de
  rationale: Cette formulation rend explicitement l’audace requise par la démarche de Joseph, tout en restant naturelle en français.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: se présenter devant Pilate
  rationale: Rend idiomatiquement l’idée d’entrer auprès de Pilate, c’est-à-dire d’accéder à sa présence.
- source_word: ᾐτήσατο
  choice: lui demanda
  rationale: Le verbe signifie ici demander ou réclamer quelque chose auprès d’une autorité; le pronom « lui » explicite naturellement le destinataire en français.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: le corps de Jésus
  rationale: Rendu direct qui conserve le ton sobre et solennel du grec.
theological_decisions:
- issue: Identité institutionnelle de Joseph comme βουλευτής
  choice: « membre du Conseil » sans préciser « Sanhédrin »
  alternative: « membre du Sanhédrin »
  rationale: Le contexte renvoie vraisemblablement au conseil juif, mais le terme grec ne nomme pas explicitement le Sanhédrin. Le texte principal ne doit pas préciser davantage que la source.
- issue: Force de τολμήσας
  choice: « eut le courage de »
  alternative: « osa » ou « se rendit avec assurance »
  rationale: Le participe souligne le caractère courageux et potentiellement risqué de la démarche. « Eut le courage de » préserve cette force sans suggérer une simple assurance de comportement.
- issue: Attente du royaume de Dieu
  choice: « attendait le royaume de Dieu »
  alternative: « espérait la venue du royaume de Dieu »
  rationale: Le grec parle directement d’attendre ou d’accueillir avec attente le royaume. Ajouter « la venue » serait explicatif et réduirait légèrement l’ouverture de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’enchaînement narratif et l’emphase sur l’attente personnelle de Joseph, tout en évitant les participes littéraux peu naturels et toute précision institutionnelle non explicitée par le grec.
