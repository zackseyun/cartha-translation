id: MRK.15.24
reference: Mark 15:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: fr
  text: Puis ils le crucifient et se partagent ses vêtements en tirant au sort pour savoir qui prendrait quoi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en jetant le sort sur eux, pour savoir qui prendrait quoi ».'
    reason: 'La construction grecque peut être rendue plus littéralement : le sort est jeté « sur » les vêtements, afin de déterminer qui recevra quel vêtement.'
lexical_decisions:
- source_word: σταυροῦσιν
  choice: ils le crucifient
  rationale: Le présent historique conserve la vivacité caractéristique du récit de Marc et reste naturel en français narratif.
- source_word: διαμερίζονται
  choice: se partagent
  rationale: Avec des vêtements pour objet, « se partagent » exprime naturellement leur répartition entre plusieurs personnes.
- source_word: ἱμάτια
  choice: vêtements
  rationale: Terme courant, concret et digne pour désigner les pièces d’habillement.
- source_word: βάλλοντες κλῆρον
  choice: en tirant au sort
  rationale: « Tirer au sort » est l’expression idiomatique française pour une attribution décidée par le sort.
- source_word: ἐπ’ αὐτὰ
  choice: '[implicite dans « en tirant au sort »]'
  rationale: Le rattachement du tirage aux vêtements est clair dans la phrase française; l’expliciter par « à leur sujet » alourdirait le texte.
- source_word: τίς τί ἄρῃ
  choice: pour savoir ce que chacun prendrait
  rationale: Cette formulation conserve la double valeur distributive de τίς τί et présente naturellement le résultat que doit déterminer le tirage.
theological_decisions:
- issue: Présent historique dans le récit de la Passion
  choice: 'Maintenir le présent : « ils le crucifient »'
  alternative: « ils le crucifièrent » ou « ils l’ont crucifié »
  rationale: Le présent reflète la texture narrative vive de Marc sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent historique est conservé. « Se partagent » et « tirer au sort » privilégient une expression naturelle tout en maintenant précisément l’action et la répartition décrites par le grec.
