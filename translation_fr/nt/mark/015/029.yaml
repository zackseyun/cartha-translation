id: MRK.15.29
reference: Mark 15:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: fr
  text: 'Les passants l’insultaient en secouant la tête et disaient : « Ah ! Toi qui détruis le temple[a] et le bâtis en trois jours[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « le sanctuaire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le rebâtis en trois jours ». Le verbe grec signifie simplement « bâtir », mais le contexte peut impliquer une reconstruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: les passants
  rationale: Le participe désigne ceux qui passent devant la scène. « Les passants » est naturel en français moderne et garde clairement leur rôle dans le récit.
- source_word: ἐβλασφήμουν
  choice: l’insultaient
  rationale: Dans ce contexte, le verbe décrit des paroles outrageantes dirigées contre Jésus. « Insultaient » restitue ce sens sans imposer le sens religieux plus technique de « blasphémaient ». L’imparfait rend l’action en cours.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: en secouant la tête
  rationale: Cette tournure idiomatique exprime ici le mépris et la dérision. Le singulier distributif est naturel en français.
- source_word: Οὐὰ
  choice: Ah !
  rationale: L’interjection introduit une raillerie. « Ah ! » en restitue la force moqueuse sans suggérer une lamentation.
- source_word: ὁ καταλύων
  choice: Toi qui détruis
  rationale: L’article suivi du participe fonctionne comme une apostrophe. Le présent conserve la formulation grecque de l’accusation, sans la reformuler comme une déclaration certaine de Jésus.
- source_word: ναὸν
  choice: le temple
  rationale: « Temple » est le terme français courant et intelligible dans cette accusation; une note conserve le sens éventuellement plus précis de sanctuaire.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: le bâtis en trois jours
  rationale: « Bâtis » traduit directement le verbe grec, qui signifie simplement construire ou bâtir. « Rebatis » serait contextuellement possible, mais plus explicatif.
theological_decisions:
- issue: Référence de la parole sur le temple
  choice: Présenter directement les paroles des passants comme une accusation ou une allusion, sans identifier le temple au corps de Jésus dans le texte principal.
  alternative: Rendre la phrase de manière plus interprétative afin de signaler que Jésus parlait métaphoriquement de son corps.
  rationale: Marc rapporte ici la raillerie des passants. La traduction préserve le point de vue narratif et la tension théologique sans importer dans ce verset l’explication donnée ailleurs.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit l’élan narratif du grec et laisse la phrase ouverte, comme dans le verset source, puisque la raillerie se poursuit au verset suivant.
