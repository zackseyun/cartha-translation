  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: fr
  text: 'Mais Pilate leur répondit : « Voulez-vous que je vous relâche le roi des Juifs[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le roi des Judéens ». Le grec Ἰουδαίων peut signifier « Juifs » ou « Judéens »; dans ce titre récurrent du récit de la Passion, la traduction traditionnelle et adaptée au contexte est « Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition ou une transition dans le récit, alors que Pilate répond à la foule.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: leur répondit
  rationale: La formulation française naturelle réunit le verbe de réponse et le participe « disant », dont la restitution littérale serait lourde et redondante.
- source_word: Θέλετε
  choice: Voulez-vous
  rationale: Exprime simplement le désir ou la volonté et convient au registre actuel de la question.
- source_word: ἀπολύσω ὑμῖν
  choice: que je vous relâche
  rationale: Dans ce contexte judiciaire, ἀπολύω désigne la remise en liberté d’un prisonnier; le datif ὑμῖν est rendu par « vous ».
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: le roi des Juifs
  rationale: Expression politique récurrente du récit de la Passion. La minuscule à « roi » suit l’usage typographique français pour un titre employé avec un complément.
theological_decisions:
- issue: Sens et portée de τὸν βασιλέα τῶν Ἰουδαίων
  choice: le roi des Juifs
  alternative: le roi des Judéens
  rationale: Le grec Ἰουδαῖοι peut désigner les Juifs ou les Judéens. Dans cette formule fixe du récit de la Passion, « roi des Juifs » est le titre politique traditionnel et contextuellement approprié, sans transformer les paroles de Pilate en confession théologique.
translation_notes:
  register: Français international moderne, clair et digne. La construction participiale grecque est idiomatiquement condensée; la question directe et la nuance politique du titre sont conservées.
