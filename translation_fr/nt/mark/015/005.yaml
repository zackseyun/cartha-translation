  text: ὁ δὲ Ἰησοῦς οὐκέτι οὐδὲν ἀπεκρίθη, ὥστε θαυμάζειν τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: fr
  text: Mais Jésus ne répondit plus rien, si bien que Pilate était étonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste entre les accusations ou l'interrogatoire en cours et le silence de Jésus.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: 'Conserve la valeur temporelle de cessation : Jésus ne répond désormais plus.'
- source_word: οὐδὲν
  choice: rien
  rationale: Avec la négation française, « ne répondit plus rien » exprime naturellement le caractère total du silence.
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Terme courant et précis dans le contexte d'un interrogatoire judiciaire.
- source_word: ὥστε
  choice: si bien que
  rationale: Exprime clairement le résultat produit par le silence de Jésus, sans suggérer un but.
- source_word: θαυμάζειν
  choice: était étonné
  rationale: Rend naturellement la réaction de Pilate. « S'émerveillait » serait trop positif en français moderne, tandis que « était stupéfait » pourrait être trop fort.
- source_word: Πιλᾶτον
  choice: Pilate
  rationale: Forme française établie du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure « si bien que » préserve la relation de résultat portée par ὥστε, et l'imparfait « était étonné » rend naturellement l'état résultant décrit par l'infinitif présent.
