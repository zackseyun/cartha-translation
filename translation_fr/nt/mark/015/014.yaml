id: MRK.15.14
reference: Mark 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: fr
  text: 'Mais Pilate leur demandait : « Quel mal a-t-il donc fait ? » Mais eux crièrent de plus belle : « Crucifie-le ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: demandait
  rationale: L’imparfait grec présente la parole de Pilate comme en cours ou répétée. En français, l’imparfait « demandait » conserve cet aspect et convient naturellement à une question.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Quel mal a-t-il donc fait ?
  rationale: « Donc » rend ici la particule γάρ dans sa fonction argumentative, tandis que « quel mal » conserve la force morale de κακόν dans une formulation française naturelle.
- source_word: κακόν
  choice: mal
  rationale: « Mal » garde la portée morale du grec et s’intègre idiomatiquement à la tournure « faire du mal / quel mal faire », sans l’atténuer en simple faute.
- source_word: περισσῶς
  choice: de plus en plus fort
  rationale: L’expression rend l’intensification de la clameur et son escalade dans un français courant et précis.
- source_word: ἔκραξαν
  choice: criaient
  rationale: Le verbe exprime une clameur publique et forte. L’imparfait français s’accorde naturellement avec l’intensification exprimée par « de plus en plus fort ».
- source_word: Σταύρωσον αὐτόν
  choice: Crucifie-le !
  rationale: L’impératif direct conserve la violence et l’immédiateté de l’ordre adressé à Pilate.
- source_word: δὲ
  choice: Mais
  rationale: Aux deux endroits, « mais » marque clairement le contraste entre la pression de la foule, la question de Pilate et la réponse intensifiée.
- source_word: Πιλᾶτος
  choice: Pilate
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Force morale de κακόν dans la question de Pilate
  choice: « mal »
  alternative: « faute » ou « tort »
  rationale: « Mal » préserve la portée morale et potentiellement judiciaire de l’accusation sans minimiser la question de Pilate ni ajouter une affirmation doctrinale.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La répétition de « Mais » reflète les deux δέ et souligne l’affrontement. Aucune note n’est nécessaire, car « Quel mal a-t-il donc fait ? » rend à la fois clairement et naturellement l’idiome grec.
