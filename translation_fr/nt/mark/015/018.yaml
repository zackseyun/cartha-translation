  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: fr
  text: 'Et ils se mirent à le saluer[a] : « Salut, roi des Juifs[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut désigner une salutation ordinaire; ici, il évoque un salut cérémoniel employé par dérision.
    reason: lexical_alternative
  - marker: b
    text: Ou « des Judéens ». Le terme grec peut désigner les Juifs ou, plus précisément, les habitants de la Judée; « Juifs » correspond ici au titre employé dans le récit de la Passion.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction simple conserve l’enchaînement paratactique caractéristique du récit de Marc sans introduire une valeur temporelle plus précise.
- source_word: ἤρξαντο
  choice: se mirent à
  rationale: Cette tournure française naturelle exprime la valeur ingressive de ἄρχομαι suivi de l’infinitif et marque le début de l’action.
- source_word: ἀσπάζεσθαι
  choice: le saluer
  rationale: Le verbe grec désigne couramment l’action de saluer. Dans cette scène, le contexte donne au salut une forme cérémonielle et moqueuse, nuance que le français « saluer » peut porter sans surtraduction.
- source_word: Χαῖρε
  choice: Salut
  rationale: L’impératif χαῖρε fonctionne ici comme une formule de salutation. « Salut » est actuel et naturel, tout en permettant le ton d’acclamation royale parodique créé par le contexte; « Réjouis-toi » serait trop littéral pour cet emploi idiomatique.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: roi des Juifs
  rationale: Le vocatif βασιλεῦ est rendu directement par « roi ». Dans le titre de la Passion, « des Juifs » est la formulation française établie et contextuellement appropriée, tout en signalant en note l’autre portée possible de Ἰουδαῖος.
theological_decisions:
- issue: Rendre l’acclamation moqueuse adressée à Jésus sans atténuer son ironie ni sa portée royale
  choice: Conserver une adresse royale directe — « Salut, roi des Juifs ! » — dont la moquerie ressort du contexte
  alternative: « Bonjour, roi des Juifs ! »
  rationale: La scène met en scène une parodie de l’hommage rendu à un roi. « Salut » garde la forme d’une acclamation sans ajouter au texte une explication doctrinale ni rendre la formule excessivement familière.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe brève conserve le rythme narratif de Marc. Les guillemets français et l’espace avant les deux-points et le point d’exclamation suivent l’usage typographique français.
