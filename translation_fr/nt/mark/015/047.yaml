  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: fr
  text: Marie de Magdala et Marie, la mère de Josès[a], regardaient où il avait été déposé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Marie de Josès ». Le grec identifie cette Marie par sa relation avec Josès sans préciser ici la nature de cette relation.'
    reason: alternative lexicale et préservation de l’ambiguïté grammaticale
lexical_decisions:
- source_word: δὲ
  choice: et
  rationale: La particule assure ici une transition légère et poursuit naturellement le récit de l’ensevelissement, sans marquer de contraste fort.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Marie de Magdala
  rationale: Cette forme française courante rend clairement l’épithète géographique qui distingue cette Marie.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Marie, la mère de Josès
  rationale: Le génitif identifie Marie par sa relation avec Josès. Le contexte marcien favorise la relation maternelle, explicitée pour produire un français naturel, tout en signalant en note la formulation plus littérale et son ambiguïté grammaticale.
- source_word: ἐθεώρουν
  choice: regardaient
  rationale: L’imparfait grec présente une observation qui se prolonge dans le passé. « Regardaient » conserve cet aspect sans donner au verbe un ton technique.
- source_word: ποῦ
  choice: où
  rationale: L’adverbe interrogatif indirect introduit simplement le lieu observé.
- source_word: τέθειται
  choice: on l’avait déposé
  rationale: 'Le parfait passif exprime une action accomplie dont le résultat demeure : Jésus se trouve à l’endroit où il a été déposé. Le plus-que-parfait convient à la succession narrative française, tandis que « on » rend naturellement le passif et « l’ » explicite le référent sous-entendu.'
theological_decisions:
- issue: Référent sous-entendu de τέθειται
  choice: Expliciter Jésus par le pronom personnel « l’ »
  alternative: Employer « le corps » ou laisser le référent implicite
  rationale: Le grec omet le référent parce que le contexte le rend évident. Le français exige ici un complément exprimé; le pronom renvoie à Jésus sans le réduire à un corps inanimé.
- issue: Relation entre Marie et Josès
  choice: Expliciter la relation maternelle dans le texte et préserver l’expression grecque en note
  alternative: Traduire seulement « Marie de Josès »
  rationale: Le contexte de Marc identifie cette Marie comme la mère de Josès, mais le génitif de ce vers n’énonce pas à lui seul la nature de la relation. La note conserve donc l’ambiguïté formelle du grec.
translation_notes:
  register: Français international moderne, sobre et narratif. « Marie de Magdala » est immédiatement compréhensible; « Josès » distingue le nom grec Ἰωσῆτος. La phrase conserve la continuité du récit et l’aspect duratif de l’observation.
