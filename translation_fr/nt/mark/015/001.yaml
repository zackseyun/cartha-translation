id: MRK.15.1
reference: Mark 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: fr
  text: Aussitôt, de bon matin, les grands prêtres, avec les anciens, les scribes et tout le conseil, tinrent conseil. Puis ils attachèrent Jésus, l’emmenèrent et le remirent à Pilate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Conserve l’urgence narrative caractéristique de Marc dans un français actuel.
- source_word: πρωῒ
  choice: de bon matin
  rationale: Exprime de manière idiomatique qu’il s’agit du début de la matinée.
- source_word: συμβούλιον ποιήσαντες
  choice: tinrent conseil
  rationale: Rend naturellement l’expression grecque désignant une délibération organisée, sans imposer l’idée plus précise d’une nouvelle séance formellement convoquée.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Désigne les principales autorités sacerdotales; le pluriel ne signifie pas que plusieurs grands prêtres étaient simultanément en fonction.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Dans ce contexte institutionnel, le terme désigne des dirigeants reconnus et non simplement des hommes âgés.
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Rend la fonction de ces experts des Écritures et de la Loi dans un langage immédiatement compréhensible, là où « scribes » pourrait évoquer de simples copistes.
- source_word: ὅλον τὸ συνέδριον
  choice: l’ensemble du Conseil suprême
  rationale: Traduit la fonction de l’institution pour le lecteur moderne; le nom historique « sanhédrin » est conservé en note.
- source_word: δήσαντες
  choice: ligotèrent
  rationale: Indique clairement que Jésus fut attaché avant d’être emmené, avec un verbe français concret et naturel.
- source_word: ἀπήνεγκαν
  choice: l’emmenèrent
  rationale: Dans ce contexte de détention, le verbe indique qu’on conduit Jésus ailleurs, sans suggérer qu’il est physiquement porté.
- source_word: παρέδωκαν
  choice: le remirent
  rationale: Exprime clairement le transfert de Jésus à l’autorité de Pilate sans ajouter au verset une interprétation théologique particulière.
- source_word: Πιλάτῳ
  choice: à Pilate
  rationale: Forme française traditionnelle et standard du nom propre, avec le datif rendu par la préposition requise.
theological_decisions:
- issue: Référence de συνέδριον
  choice: l’ensemble du Conseil suprême
  alternative: tout le sanhédrin
  rationale: La traduction fonctionnelle rend l’institution intelligible sans perdre sa désignation historique, donnée en note. Le texte conserve en outre la mention englobante de tout le conseil après celle de ses principaux groupes.
- issue: Portée de παρέδωκαν dans le récit de la Passion
  choice: le remirent à Pilate
  alternative: le livrèrent à Pilate
  rationale: « Remirent » préserve ici le sens judiciaire et concret du transfert de garde. « Livrèrent » est également possible et peut faire écho au motif plus large de la livraison de Jésus, mais ce choix ne force pas cette résonance dans le présent verset.
translation_notes:
  register: Français international moderne, clair et digne. « De bon matin » maintient la précision temporelle sans lourdeur; « spécialistes de la Loi » privilégie la compréhension immédiate. La succession des actions reste rapide, conformément au rythme du grec.
