revisions:
- from: Aussitôt, de bon matin, les grands prêtres tinrent conseil avec les anciens, les spécialistes de la Loi et l’ensemble du Conseil suprême[a]. Puis ils ligotèrent Jésus, l’emmenèrent et le remirent à Pilate.
  to: Aussitôt, de bon matin, les grands prêtres, avec les anciens, les scribes et tout le conseil, tinrent conseil. Puis ils attachèrent Jésus, l’emmenèrent et le remirent à Pilate.
  rationale: La révision conserve le rythme, l’ordre des actions et la portée judiciaire du grec, tout en remplaçant un intitulé institutionnel trop spécifiant par « tout le conseil ». Elle privilégie également les équivalents historiques directs « scribes » et « attachèrent », sans ajouter de précision absente de la source.
