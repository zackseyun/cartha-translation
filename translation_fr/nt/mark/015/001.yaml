review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la succession narrative et les principaux verbes : εὐθύς (« aussitôt »), πρωῒ (« de bon matin »), la délibération, l’entrave de Jésus, son transfert et sa remise à Pilate. Toutefois, « Conseil suprême » dépasse la désignation grecque συνέδριον (« conseil ») en lui donnant un titre institutionnel français plus défini et plus solennel que le texte ne l’exige.'
  naturalness: Le français est globalement naturel, clair et d’un registre approprié. « Tinrent conseil », « l’emmenèrent » et « le remirent à Pilate » sont particulièrement bien choisis. « Tout le conseil » est plus direct et moins institutionnellement chargé que « l’ensemble du Conseil suprême ».
  terminology: « Grands prêtres », « anciens », « scribes », « sanhédrin » en note et « Pilate » conviennent. « Spécialistes de la Loi » est compréhensible, mais « scribes » est le terme historique usuel et correspond directement à γραμματεῖς; il ne requiert pas ici une paraphrase fonctionnelle. « Attachèrent » restitue δήσαντες sans la nuance possiblement plus concrète de « ligotèrent ».
  issues:
  - severity: medium
    issue: « Conseil suprême » pour συνέδριον
    rationale: Cette expression présente le συνέδριον comme un titre officiel français et peut suggérer une institution définie par analogie avec des conseils suprêmes modernes. « Tout le conseil », avec « sanhédrin » en note, traduit le grec plus sobrement tout en conservant l’identification historique.
  - severity: low
    issue: « Spécialistes de la Loi » pour γραμματεῖς
    rationale: La paraphrase est possible, mais « scribes » est le terme historique standard, plus concis et directement fidèle au grec. Le contexte institutionnel évite de le réduire à de simples copistes.
  - severity: low
    issue: « Ligotèrent » pour δήσαντες
    rationale: « Ligoter » peut évoquer une manière particulière, serrée ou grossière, d’attacher. « Attachèrent » rend l’idée de lier sans préciser le procédé.
  revised_text: Aussitôt, de bon matin, les grands prêtres, avec les anciens, les scribes et tout le conseil, tinrent conseil. Puis ils attachèrent Jésus, l’emmenèrent et le remirent à Pilate.
  revised_footnotes:
