id: MRK.15.32
reference: Mark 15:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: fr
  text: « Que le Messie[a], le roi d’Israël, descende maintenant de la croix, afin que nous voyions et que nous croyions ! » Ceux qui étaient crucifiés avec lui l’insultaient eux aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός désigne celui qui a reçu l’onction.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Dans cette raillerie à portée royale, Χριστός fonctionne comme un titre désignant l’oint attendu. « Le Messie » en restitue le sens, tandis que « le Christ » reste une autre traduction possible.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: le roi d’Israël
  rationale: Traduction directe et naturelle du titre, qui maintient le lien avec la prétention royale tournée ici en dérision.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: descende maintenant de la croix
  rationale: L’impératif à la troisième personne exprime un défi moqueur. « Descendre de la croix » est idiomatique en français, et « maintenant » conserve l’urgence sarcastique de νῦν.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: afin que nous voyions et que nous croyions
  rationale: La construction avec ἵνα et les subjonctifs exprime ici le but affiché du défi. La répétition de « que » donne une syntaxe française claire tout en maintenant les deux verbes coordonnés.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: ceux qui étaient crucifiés avec lui
  rationale: Cette formulation conserve le passif et désigne sans ajout les autres personnes subissant la crucifixion avec Jésus.
- source_word: ὠνείδιζον αὐτόν
  choice: l’insultaient
  rationale: L’imparfait français rend l’aspect continu de l’imparfait grec. « Insulter » est actuel et accessible, tout en couvrant l’idée de reproches outrageants ou d’injures.
- source_word: καί
  choice: eux aussi
  rationale: Le καί initial relie ces crucifiés aux moqueurs déjà évoqués. « Eux aussi » rend explicitement cette valeur additive en français naturel.
theological_decisions:
- issue: Traduction de Χριστός dans un contexte de raillerie messianique
  choice: le Messie
  alternative: le Christ
  rationale: Le mot est employé comme titre royal juif, en apposition à « le roi d’Israël ». « Messie » préserve donc ici plus directement la valeur d’oint royal sans transformer le titre en nom propre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase citée garde le ton de défi sarcastique sans l’alourdir. « Afin que » conserve une légère solennité adaptée au récit biblique, tandis que « l’insultaient » reste immédiatement compréhensible.
