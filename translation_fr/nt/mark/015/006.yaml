  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: fr
  text: À chaque fête, il leur accordait la libération d’un prisonnier, celui qu’ils demandaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: À chaque fête
  rationale: κατά avec l’accusatif a ici une valeur temporelle. Avec l’imparfait d’habitude qui suit, « À chaque fête » exprime naturellement en français la pratique régulière évoquée. δέ assure une légère continuité narrative sans exiger un connecteur marqué.
- source_word: ἀπέλυεν
  choice: il leur relâchait
  rationale: L’imparfait grec décrit une action habituelle. L’imparfait français « relâchait » en conserve directement la valeur, tandis que « leur » rend le datif d’intérêt αὐτοῖς.
- source_word: ἕνα δέσμιον
  choice: un prisonnier
  rationale: En français, l’article indéfini exprime naturellement l’unité indiquée par ἕνα dans cette construction. « Prisonnier » convient au contexte judiciaire et carcéral.
- source_word: ὃν παρῃτοῦντο
  choice: celui qu’ils réclamaient
  rationale: παραιτέομαι signifie ici demander ou réclamer quelqu’un. « Celui qu’ils réclamaient » est idiomatique, garde le prisonnier comme antécédent explicite et ne précise pas davantage que le grec la manière dont la demande était formulée.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la concision du grec et rend l’usage habituel par l’imparfait, sans ajouter le nom de Pilate, absent de ce verset grec.
