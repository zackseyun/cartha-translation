source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: fr
  text: 'Mais Pilate l’interrogeait de nouveau : « Tu ne réponds rien ? Vois combien d’accusations ils portent contre toi ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque une légère opposition entre le silence de Jésus et la nouvelle intervention de Pilate, tout en assurant la progression du récit.
- source_word: πάλιν
  choice: de nouveau
  rationale: Exprime naturellement la répétition de l’interrogatoire.
- source_word: ἐπηρώτα
  choice: l’interrogea
  rationale: Dans ce cadre judiciaire, « interroger » convient mieux que le simple « demander ». Le contexte permet au passé simple français de présenter l’intervention, même si l’imparfait grec peut suggérer une action prolongée ou répétée.
- source_word: λέγων
  choice: ':'
  rationale: Le participe introducteur de parole est rendu idiomatiquement en français par les deux-points, sans le calque lourd « en disant ».
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Tu ne réponds rien ?
  rationale: Formulation française directe qui conserve la pression exercée par la question et la double négation grecque dans sa forme française naturelle.
- source_word: ἴδε
  choice: Vois
  rationale: Impératif direct qui attire l’attention de Jésus sur les accusations; le choix reste digne sans l’archaïsme de « voici » ou « regarde donc ».
- source_word: πόσα
  choice: tout ce dont
  rationale: Le neutre pluriel signifie littéralement « combien de choses ». Avec le verbe « accuser », « tout ce dont » restitue naturellement l’ampleur des accusations sans ajouter le nom « chefs d’accusation ».
- source_word: σου κατηγοροῦσιν
  choice: ils t’accusent
  rationale: Le verbe κατηγορέω avec le génitif de la personne signifie porter une accusation contre quelqu’un. La construction française « accuser quelqu’un de » exige ici « tout ce dont ils t’accusent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue emploie le tutoiement, naturel entre Pilate et Jésus dans ce contexte. La ponctuation remplace idiomatiquement le participe grec λέγων. Aucun appel de note n’est nécessaire.
