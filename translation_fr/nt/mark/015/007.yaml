source:
  edition: SBLGNT
  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: fr
  text: L’homme appelé Barabbas était enchaîné avec les insurgés qui avaient commis un meurtre au cours de l’insurrection[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec les rebelles » / « au cours de la révolte ». Le grec emploie des termes apparentés pour désigner les participants à une révolte et la révolte elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: était
  rationale: δέ est un connecteur léger que le français n’a pas besoin d’expliciter ici; ἦν est naturellement rendu par « était ».
- source_word: ὁ λεγόμενος
  choice: L’homme appelé
  rationale: Cette formulation idiomatique identifie Barabbas sans la nuance péjorative possible de « le soi-disant ».
- source_word: Βαραββᾶς
  choice: Barabbas
  rationale: Translittération française traditionnelle du nom propre.
- source_word: μετὰ τῶν στασιαστῶν
  choice: avec les insurgés
  rationale: στασιασταί désigne les participants à une révolte; « insurgés » est précis, naturel et garde le lien lexical avec στάσις.
- source_word: δεδεμένος
  choice: détenu
  rationale: Le participe parfait passif signifie littéralement « lié »; dans ce contexte carcéral, « détenu » exprime naturellement l’état résultant sans préciser de manière incertaine le moyen matériel de contrainte.
- source_word: οἵτινες
  choice: qui
  rationale: Le pronom introduit simplement une proposition descriptive concernant les insurgés.
- source_word: ἐν τῇ στάσει
  choice: au cours de l’insurrection
  rationale: στάσις désigne ici une révolte politique; « insurrection » convient au contexte et reproduit la parenté lexicale avec « insurgés ».
- source_word: φόνον πεποιήκεισαν
  choice: avaient commis un meurtre
  rationale: Le tour verbal exprime une action accomplie antérieurement; φόνος peut désigner un meurtre ou un homicide, et le singulier français « un meurtre » respecte la forme grecque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Détenu » évite le calque peu naturel « lié » tout en conservant le cadre carcéral; « insurgés » et « insurrection » rendent le jeu étymologique du grec.
