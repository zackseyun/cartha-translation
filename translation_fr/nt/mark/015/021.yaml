revisions:
- from: Ils réquisitionnent un homme qui passait par là, Simon de Cyrène, le père d’Alexandre et de Rufus, qui revenait de la campagne[a], pour qu’il porte sa croix[b].
  to: Ils réquisitionnent[a] un homme qui passait par là, Simon de Cyrène, qui venait de la campagne[b], le père d’Alexandre et de Rufus, pour porter la croix de Jésus[c].
  rationale: La révision retire l’inférence de « revenait », replace la relative de provenance auprès de Simon et explicite le référent de la croix afin que le français ne dise pas que Simon portait sa propre croix. Elle maintient le présent historique, la contrainte de la réquisition et la portée non spécifiée de σταυρός.
