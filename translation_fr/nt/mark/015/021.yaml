id: MRK.15.21
reference: Mark 15:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: fr
  text: Ils réquisitionnent[a] un homme qui passait par là, Simon de Cyrène, qui venait de la campagne[b], le père d’Alexandre et de Rufus, pour porter la croix de Jésus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec désigne un service imposé, une réquisition.
    reason: cultural_note
  - marker: b
    text: Ou « du champ » ; le terme grec peut désigner un champ, une ferme ou la campagne.
    reason: lexical_alternative
  - marker: c
    text: Certains comprennent ici plus précisément la traverse de la croix, mais le grec dit simplement « croix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: réquisitionnent
  rationale: Le verbe désigne un service imposé par autorité, non une simple demande. « Réquisitionnent » exprime naturellement en français la contrainte et l’idée de service forcé.
- source_word: παράγοντά τινα
  choice: un homme qui passait par là
  rationale: Le participe indique une personne de passage et τινα la présente de manière indéfinie. Cette formulation est claire et idiomatique, sans donner à « un certain » une nuance artificielle en français.
- source_word: Σίμωνα Κυρηναῖον
  choice: Simon de Cyrène
  rationale: La forme française traditionnelle et naturelle conserve le nom personnel et rend l’indication géographique sans lourdeur.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: qui revenait de la campagne
  rationale: ἀγρός peut désigner un champ, une ferme ou la campagne. Dans ce contexte de déplacement vers la ville, « de la campagne » conserve l’étendue sémantique sans préciser indûment un champ particulier.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: le père d’Alexandre et de Rufus
  rationale: L’apposition identificatrice est conservée directement, sans spéculer sur la connaissance qu’avaient les premiers lecteurs de ces deux personnes.
- source_word: ἵνα ἄρῃ
  choice: pour qu’il porte
  rationale: La proposition avec ἵνα exprime ici le but de la réquisition. « Pour qu’il porte » restitue clairement cette relation tout en restant naturel.
- source_word: σταυρὸν
  choice: croix
  rationale: Le grec dit simplement σταυρός. « Croix » est le terme exact et usuel; traduire par « traverse » introduirait une précision historique absente du texte.
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif conserve le pronom grec et renvoie, dans le contexte, à Jésus, sans remplacer explicitement le pronom par son nom.
theological_decisions:
- issue: Nature de la contrainte imposée à Simon
  choice: Simon est réquisitionné, c’est-à-dire contraint par ceux qui conduisent Jésus.
  alternative: Simon est seulement sollicité ou engagé sans contrainte.
  rationale: ἀγγαρεύω désigne une corvée ou un service imposé. La traduction ne doit pas atténuer cette contrainte.
- issue: Nature précise de l’objet porté
  choice: Traduire σταυρός par « croix » sans préciser davantage.
  alternative: « traverse de la croix »
  rationale: Même si certaines reconstitutions historiques proposent que le condamné portait seulement la traverse, le texte grec emploie le terme général σταυρός. La traduction conserve donc la formulation du texte.
- issue: Référent du possessif αὐτοῦ
  choice: Conserver « sa croix », dont le référent contextuel est Jésus.
  alternative: Expliciter « la croix de Jésus ».
  rationale: Le grec emploie un pronom. Le conserver respecte la forme du texte; le contexte narratif identifie Jésus comme référent, malgré la proximité syntaxique du nom Simon en français.
translation_notes:
  register: Français international moderne, digne et narratif. Le présent « réquisitionnent » conserve le présent historique grec. « Un homme qui passait par là » évite le tour moins naturel « un certain passant ». Les deux propositions relatives sont séparées par l’apposition afin de préserver toutes les informations du grec sans alourdir excessivement la phrase.
