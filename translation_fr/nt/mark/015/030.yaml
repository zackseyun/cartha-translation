  text: σῶσον σεαυτὸν ⸀καταβὰς ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: fr
  text: Sauve-toi toi-même[a] en descendant de la croix !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre possibilité : « Sauve-toi toi-même ; descends de la croix ! » Le participe grec peut exprimer une action associée à l’ordre sans préciser davantage le rapport entre les deux actions.'
    reason: La construction grecque associe un impératif à un participe et permet plusieurs façons de comprendre le rapport entre les deux actions.
lexical_decisions:
- source_word: σῶσον
  choice: Sauve
  rationale: Impératif aoriste à la deuxième personne du singulier, employé ici comme défi moqueur. « Sauve » est direct et naturel, tout en conservant le lien verbal avec le langage du salut.
- source_word: σεαυτόν
  choice: toi-même
  rationale: Pronom réfléchi accusatif, complément direct de σῶσον. « Toi-même » rend clairement l’insistance moqueuse portée sur la capacité de Jésus à se sauver lui-même.
- source_word: καταβάς
  choice: en descendant
  rationale: Participe aoriste actif de καταβαίνω. Le gérondif français rattache naturellement la descente à l’ordre de se sauver, sans transformer explicitement le participe en second impératif. Les autres rapports possibles entre les deux actions sont signalés en note.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: de la croix
  rationale: Expression normale en français pour indiquer le mouvement par lequel on quitte la croix dans ce contexte de crucifixion.
theological_decisions:
- issue: Rapport entre le participe καταβάς et l’impératif σῶσον
  choice: Rendre le participe par « en descendant », comme action associée ou moyen implicite du salut demandé.
  alternative: « Sauve-toi toi-même après être descendu de la croix » ou « Sauve-toi toi-même ; descends de la croix ! »
  rationale: Le grec formule un défi condensé au moyen d’un impératif suivi d’un participe aoriste. Le français ne permet pas d’en reproduire parfaitement toute l’ambiguïté. « En descendant » reste fluide et proche de la construction participiale, tandis que la note conserve les principales autres lectures sans décider plus précisément de la relation logique.
translation_notes:
  register: Français international moderne, direct et digne. L’expression « Sauve-toi toi-même » conserve l’insistance du pronom réfléchi et le ton de défi. Le gérondif offre une formulation naturelle tout en maintenant, grâce à la note, l’ambiguïté syntaxique du grec.
