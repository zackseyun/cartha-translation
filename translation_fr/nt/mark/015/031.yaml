id: MRK.15.31
reference: Mark 15:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: fr
  text: 'De même, les chefs des prêtres, avec les spécialistes de la Loi, se moquaient de lui en se disant entre eux : « Il a sauvé d’autres personnes ; il ne peut pas se sauver lui-même. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: De même
  rationale: Introduit naturellement le parallèle avec les moqueries rapportées juste avant.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Désigne les principales autorités sacerdotales sans laisser entendre que plusieurs personnes occupaient simultanément la fonction unique de grand prêtre.
- source_word: ἐμπαίζοντες
  choice: se moquaient de lui
  rationale: Rend la dérision hostile. Le complément « de lui », implicite dans le contexte, est explicité pour éviter en français de faire des chefs et des spécialistes de la Loi les objets réciproques de la moquerie.
- source_word: πρὸς ἀλλήλους
  choice: en se disant entre eux
  rationale: 'Préserve l’idée d’échange réciproque : ils s’adressaient les uns aux autres, plutôt qu’ils ne se moquaient les uns des autres.'
- source_word: μετὰ τῶν γραμματέων
  choice: avec les spécialistes de la Loi
  rationale: Indique que les γραμματεῖς participaient avec les chefs des prêtres. « Spécialistes de la Loi » communique clairement leur rôle au lecteur moderne.
- source_word: ἔλεγον
  choice: se disant
  rationale: La tournure progressive et le gérondif rendent l’imparfait grec comme une parole échangée dans la durée.
- source_word: Ἄλλους ἔσωσεν
  choice: Il en a sauvé d’autres
  rationale: Conserve le verbe « sauver » et son potentiel d’ironie, tout en employant une formulation française naturelle.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: il ne peut pas se sauver lui-même
  rationale: Préserve l’expression de l’incapacité alléguée, le pronom réfléchi emphatique et la répétition de σῴζω.
theological_decisions:
- issue: Répétition de σῴζω dans les deux propositions
  choice: sauvé… sauver
  alternative: délivré… délivrer
  rationale: La répétition française reproduit le lien lexical grec et maintient l’ironie théologique sans limiter le sens au salut spirituel ni à une simple délivrance physique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure est légèrement réorganisée afin de distinguer clairement l’objet de la moquerie de l’échange réciproque entre les dirigeants. L’exclamation finale rend le caractère mordant de la raillerie sans ajouter de contenu propositionnel.
