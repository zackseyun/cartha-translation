revisions:
- from: 'De même, les chefs des prêtres, avec les spécialistes de la Loi, se moquaient de lui en se disant entre eux : « Il en a sauvé d’autres, mais il ne peut pas se sauver lui-même ! »'
  to: 'De même, les chefs des prêtres, avec les spécialistes de la Loi, se moquaient de lui en se disant entre eux : « Il a sauvé d’autres personnes ; il ne peut pas se sauver lui-même. »'
  rationale: La révision retire le pronom partitif non motivé et emploie « d’autres personnes », qui explicite sobrement le pluriel humain sous-entendu par Ἄλλους. Elle conserve l’ordre discursif français qui distingue la raillerie dirigée contre Jésus de leurs paroles échangées entre eux, et maintient la répétition « sauvé / sauver ».
