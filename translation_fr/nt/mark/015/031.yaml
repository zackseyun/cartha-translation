review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens du grec sont bien rendus : les chefs des prêtres et les scribes participent à la raillerie, tandis que πρὸς ἀλλήλους est correctement compris comme l’échange de paroles entre eux, non comme une moquerie réciproque. La répétition de « sauver » préserve celle de σῴζω. Cependant, « Il en a sauvé d’autres » introduit le pronom « en », absent du grec et susceptible de suggérer un ensemble de référence non exprimé.'
  naturalness: Le français est globalement moderne et clair. « Il a sauvé d’autres personnes » est plus idiomatique et autonome dans ce contexte que « Il en a sauvé d’autres ». La suppression du point d’exclamation évite d’ajouter une force graphique que le grec ne marque pas.
  terminology: « Chefs des prêtres » rend précisément ἀρχιερεῖς. « Spécialistes de la Loi » est une désignation fonctionnelle claire de γραμματεῖς dans un français international moderne ; « Loi » renvoie ici au cadre juif pertinent sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Pronom « en » ajouté dans « Il en a sauvé d’autres »
    rationale: Ἄλλους est simplement l’objet direct (« d’autres [personnes] »). Le pronom partitif français n’a pas de correspondant explicite dans le texte grec et peut évoquer un groupe déjà défini.
  - severity: low
    issue: Point d’exclamation ajouté
    rationale: La parole est assurément railleuse, mais le grec ne comporte pas de marque graphique équivalente. Une ponctuation sobre préserve le ton sans le renforcer éditorialement.
  revised_text: 'De même, les chefs des prêtres, avec les spécialistes de la Loi, se moquaient de lui en se disant entre eux : « Il a sauvé d’autres personnes ; il ne peut pas se sauver lui-même. »'
  revised_footnotes: []
