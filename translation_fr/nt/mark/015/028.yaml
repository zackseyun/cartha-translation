  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: fr
  text: 'Et[a] l’Écriture qui dit : « Il a été compté parmi les transgresseurs » fut accomplie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que d’anciennes traductions coptes. Il est toutefois conservé dans la tradition byzantine majoritaire et dans la tradition latine. Il a probablement été ajouté par des copistes postérieurs pour harmoniser ce passage avec Luc 22.37, qui cite Ésaïe 53.12.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω
  choice: fut accomplie
  rationale: Dans le contexte d’une parole prophétique de l’Écriture, « accomplir » exprime naturellement la réalisation de ce qui avait été annoncé tout en conservant la voix passive du grec.
- source_word: ἄνομος
  choice: ceux qui enfreignent la loi
  rationale: Cette formulation rend le sens littéral de personnes qui vivent ou agissent contrairement à la loi, sans réduire d’emblée le terme à la seule criminalité civile.
- source_word: λογίζομαι
  choice: a été compté
  rationale: Le passif « a été compté » exprime le fait d’être rangé ou classé dans un groupe et correspond au sens du verbe dans la citation d’Ésaïe 53.12.
theological_decisions:
- issue: Portée de ἄνομος dans la citation prophétique
  choice: ceux qui enfreignent la loi
  alternative: les criminels ; les hors-la-loi
  rationale: Le choix retenu préserve la dimension juridique et morale du mot grec sans préciser abusivement s’il s’agit de la loi divine, de la loi civile ou des deux.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « elle qui dit » reproduit clairement le relatif grec sans lourdeur excessive ; la citation garde une formulation scripturaire naturelle.
