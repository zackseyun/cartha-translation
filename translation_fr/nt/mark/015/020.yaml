id: MRK.15.20
reference: Mark 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: fr
  text: Après s’être moqués de lui, ils lui retirèrent le vêtement de pourpre[a] et lui remirent ses propres vêtements. Puis ils l’emmenèrent dehors pour le crucifier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la pourpre »; il s’agit, d’après le contexte, d’un vêtement de couleur pourpre.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’ils le crucifient ». Le grec emploie une proposition exprimant le but.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: s’être moqués de
  rationale: Le verbe désigne une moquerie méprisante. Cette formulation est naturelle en français et conserve le ton sobre du récit.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: ils lui retirèrent le vêtement de pourpre
  rationale: Le grec exprime l’action d’enlever à quelqu’un ce qu’il porte. « Retirèrent » rend clairement le geste, tandis que « vêtement » explicite le nom sous-entendu après « pourpre » sans préciser indûment sa forme.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: lui remirent ses propres vêtements
  rationale: « Remirent » traduit naturellement le fait de le revêtir de nouveau après lui avoir retiré le vêtement de dérision; « ses propres » préserve l’insistance de τὰ ἴδια.
- source_word: ἐξάγουσιν αὐτόν
  choice: ils l’emmenèrent dehors
  rationale: Le présent historique grec donne de la vivacité au récit. Le passé simple maintient en français une narration écrite fluide et cohérente; « dehors » conserve la valeur du préverbe ἐξ-.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: pour le crucifier
  rationale: La proposition introduite par ἵνα exprime ici le but. L’infinitif précédé de « pour » est la formulation française la plus naturelle et préserve cette valeur.
theological_decisions:
- issue: Description de l’humiliation de Jésus avant la crucifixion
  choice: Présenter sobrement la moquerie, le retrait du vêtement de pourpre, la remise de ses propres vêtements et sa conduite au-dehors en vue de la crucifixion.
  alternative: Expliciter le vêtement comme un manteau royal dérisoire ou développer la portée théologique de la scène.
  rationale: Le verset rapporte directement les actes sans en donner ici une interprétation doctrinale explicite. La traduction conserve leur force narrative sans ajouter une lecture confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Vêtement de pourpre » évite de déterminer sans nécessité s’il s’agissait précisément d’une robe ou d’un manteau.
