id: MRK.15.44
reference: Mark 15:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: fr
  text: Mais Pilate s’étonna qu’il soit déjà mort. Il fit appeler le centurion et lui demanda s’il était mort depuis quelque temps déjà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’il était déjà mort ».'
    reason: πάλαι peut ici souligner soit qu’un certain temps s’est écoulé depuis la mort, soit plus simplement que la mort a déjà eu lieu.
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: s’étonna
  rationale: Le verbe exprime ici la vive surprise de Pilate devant la rapidité apparente de la mort de Jésus. « S’étonna » est naturel et digne en français moderne.
- source_word: εἰ ἤδη τέθνηκεν
  choice: qu’il soit déjà mort
  rationale: 'Après un verbe d’étonnement, cette tournure française rend naturellement la question indirecte introduite par εἰ. Le parfait τέθνηκεν met en relief l’état résultant : Jésus est déjà mort.'
- source_word: προσκαλεσάμενος
  choice: Il fit appeler
  rationale: Cette formulation exprime clairement que Pilate convoque le centurion avant de l’interroger, sans alourdir le récit par un participe calqué sur le grec.
- source_word: κεντυρίωνα
  choice: le centurion
  rationale: « Centurion » est le titre historique précis et bien établi pour cet officier romain.
- source_word: ἐπηρώτησεν αὐτόν
  choice: lui demanda
  rationale: Cette expression simple et courante rend fidèlement l’acte d’interroger ou de demander un renseignement.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: s’il était mort depuis déjà quelque temps
  rationale: πάλαι situe la mort un certain temps auparavant, relativement au moment de la question. La formulation française met l’accent sur la durée écoulée sans suggérer nécessairement un long intervalle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La seconde phrase remplace naturellement la coordination participiale grecque par deux verbes conjugués. La répétition autour de la mort est conservée, car elle appartient au mouvement du récit et distingue l’étonnement initial de la vérification auprès du centurion.
