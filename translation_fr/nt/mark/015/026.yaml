  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: fr
  text: 'L’inscription indiquant le chef d’accusation retenu contre lui portait ces mots : « Le roi des Juifs. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le roi des Judéens. »'
    reason: Alternative lexicale possible pour Ἰουδαίων.
lexical_decisions:
- source_word: ἐπιγραφή
  choice: inscription
  rationale: Désigne l’écriteau placé sur la croix; « inscription » conserve le caractère formel de l’avis écrit.
- source_word: αἰτία
  choice: motif de sa condamnation
  rationale: Dans ce contexte judiciaire, le terme désigne le grief ou le motif officiel retenu contre Jésus. Cette formulation est naturelle en français et convient à l’écriteau d’exécution.
- source_word: ἐπιγεγραμμένη
  choice: portait ces mots
  rationale: Avec ἦν, le participe parfait indique que le texte se trouvait écrit sur l’inscription. « Portait ces mots » restitue naturellement cet état en français.
- source_word: βασιλεὺς
  choice: roi
  rationale: Le mot exprime le titre royal formulé dans l’accusation; la minuscule suit l’usage courant du français pour les titres.
- source_word: Ἰουδαίων
  choice: Juifs
  rationale: Dans le récit de la Passion, « roi des Juifs » est le titre politique conventionnel attribué à Jésus. « Judéens » reste lexicalement possible et figure en note.
theological_decisions:
- issue: Traduction de Ἰουδαίων dans le titre fixé à la croix
  choice: Juifs
  alternative: Judéens
  rationale: « Roi des Juifs » conserve la formulation reconnue du titre dans les récits de la Passion sans limiter explicitement le référent à la seule région de Judée. La possibilité lexicale « Judéens » est signalée en note afin de préserver l’ambiguïté du terme grec.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase est légèrement restructurée pour éviter la lourdeur d’un calque (« l’inscription du motif… était inscrite ») tout en conservant le lien explicite entre l’écriteau et le motif judiciaire.
