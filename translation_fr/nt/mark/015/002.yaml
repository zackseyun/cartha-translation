id: MRK.15.2
reference: Mark 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: fr
  text: 'Pilate lui demanda : « Es-tu le roi des Juifs[a] ? » Jésus lui répondit[b] : « C’est toi qui le dis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Ici, l’expression « roi des Juifs » reprend l’accusation politique habituelle présentée à Pilate.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Tu le dis. » La réponse de Jésus est brève et garde une part d’ambiguïté.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Le verbe signifie demander ou questionner. « Demanda » convient naturellement au contexte sans accentuer indûment l’idée d’un interrogatoire formel.
- source_word: Σὺ εἶ
  choice: Es-tu
  rationale: Dans cette question directe, le pronom explicite donne une certaine insistance à l’interlocuteur; la tournure interrogative française la rend naturellement.
- source_word: βασιλεὺς
  choice: roi
  rationale: « Roi » conserve pleinement la portée royale ainsi que l’enjeu politique et messianique de l’accusation.
- source_word: Ἰουδαίων
  choice: des Juifs
  rationale: Dans la comparution devant Pilate, « roi des Juifs » correspond à la formulation politique consacrée. « Des Judéens » reste lexicalement possible et est signalé en note.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Jésus lui répondit
  rationale: Cette formulation française naturelle exprime le participe suivi du présent historique sans reproduire une construction grecque lourde. Le nom « Jésus » lève avec élégance une possible ambiguïté pronominale.
- source_word: Σὺ λέγεις
  choice: C’est toi qui le dis
  rationale: Cette expression française demeure brève et fait porter la formulation sur Pilate, sans transformer la réponse en affirmation explicite ni en dénégation.
theological_decisions:
- issue: Portée de la réponse de Jésus, Σὺ λέγεις
  choice: 'Une réponse retenue et partiellement ambiguë : « C’est toi qui le dis. »'
  alternative: « Oui, je le suis » ou, plus littéralement, « Tu le dis »
  rationale: 'Le grec ne contient aucun « oui » explicite. La traduction retenue préserve la tension : Jésus ne rejette pas le titre, mais renvoie sa formulation à Pilate au lieu de donner une affirmation sans réserve.'
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste concis. « C’est toi qui le dis » est idiomatique sans effacer l’ambiguïté du grec; les notes présentent les principales possibilités lexicales et littérales.
