id: MRK.15.40
reference: Mark 15:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: fr
  text: Il y avait aussi des femmes qui regardaient de loin. Parmi elles se trouvaient Marie de Magdala, Marie, mère de Jacques le jeune[a] et de Josès[b], ainsi que Salomé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jacques le Petit » ou « Jacques le moindre ». Le grec ne précise pas si ce qualificatif concerne l’âge, la taille ou l’importance.
    reason: lexical_alternative
  - marker: b
    text: Le nom grec est ici Josès, une forme distincte de Joseph.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: Il y avait aussi
  rationale: Rend naturellement l’imparfait de εἰμί et la valeur additive de καί, sans surcharger la légère transition marquée par δέ.
- source_word: γυναῖκες
  choice: des femmes
  rationale: Équivalent français courant et direct du pluriel γυναῖκες dans ce contexte.
- source_word: ἀπὸ μακρόθεν
  choice: de loin
  rationale: Expression française idiomatique qui conserve clairement l’éloignement spatial.
- source_word: θεωροῦσαι
  choice: qui regardaient
  rationale: L’imparfait avec la relative exprime l’observation continue indiquée par le participe présent.
- source_word: ἐν αἷς
  choice: Parmi elles se trouvaient
  rationale: Identifie certaines femmes à l’intérieur du groupe tout en donnant à la phrase un enchaînement naturel en français.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Marie de Magdala
  rationale: Forme française claire de l’appellation géographique, couramment employée pour distinguer cette Marie.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Marie, mère de Jacques le jeune et de Josès
  rationale: Fait porter explicitement « mère » sur les deux noms et conserve le qualificatif de Jacques sans identifier davantage les personnes.
- source_word: τοῦ μικροῦ
  choice: le jeune
  rationale: Dans une désignation personnelle, cette formulation est naturelle en français moderne. Une note maintient l’ambiguïté de μικρός, qui peut aussi évoquer la petite taille ou une moindre importance.
- source_word: Ἰωσῆτος
  choice: Josès
  rationale: Transcrit la forme grecque Ἰωσῆς au lieu de l’harmoniser avec Joseph, préservant ainsi la distinction du texte source.
- source_word: Σαλώμη
  choice: Salomé
  rationale: Transcription française usuelle du nom propre grec.
theological_decisions:
- issue: Sens du qualificatif τοῦ μικροῦ appliqué à Jacques
  choice: « Jacques le jeune », avec une note signalant l’ambiguïté
  alternative: « Jacques le Petit » ou « Jacques le moindre »
  rationale: Le grec sert à distinguer ce Jacques sans préciser si μικρός renvoie à l’âge, à la taille ou à l’importance. Le texte principal reste naturel, tandis que la note évite de présenter l’âge comme certain.
- issue: Identification de Marie et de ses fils
  choice: Ne fournir aucune identification au-delà des liens explicitement indiqués
  alternative: Assimiler ces personnes à d’autres Marie, Jacques ou Josès du Nouveau Testament
  rationale: Le verset ne donne pas assez d’éléments pour imposer une identification, laquelle pourrait importer une conclusion interprétative ou confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La phrase est divisée en deux pour alléger l’énumération sans modifier les relations syntaxiques. « Ainsi que » clôt naturellement la liste; les notes préservent les distinctions et ambiguïtés du grec.
