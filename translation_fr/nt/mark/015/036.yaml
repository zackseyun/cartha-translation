  source_fidelity: Le texte rend fidèlement la séquence d’actions, le vin aigre (ὄξος), le roseau (κάλαμος), l’impératif Ἄφετε et l’attente de l’intervention éventuelle d’Élie. Une légère révision permet de mieux refléter l’imparfait ἐπότιζεν et d’éviter de présenter comme certaine une fixation matérielle que περιθεὶς n’explicite pas davantage.
