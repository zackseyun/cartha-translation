    rationale: Le grec indique le placement de l’éponge avec/sur un roseau; « la plaça sur un roseau » reste concret sans préciser le mode de fixation.
  - severity: low
    issue: « lui donna à boire » neutralise l’aspect imperfectif de ἐπότιζεν.
    rationale: « Lui donnait à boire » conserve l’action en cours ou tentative, tout en restant naturel dans cette narration.
