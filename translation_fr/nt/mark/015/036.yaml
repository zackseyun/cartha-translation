  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: fr
  text: 'Alors quelqu’un accourut, imbiba une éponge de vin aigre[a], la plaça sur un roseau et lui donnait à boire, en disant : « Laissez-le[b]. Voyons si Élie vient le faire descendre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « vin aigre » désigne une boisson vinicole acide et bon marché, et non nécessairement du vinaigre au sens de condiment moderne.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Attendez. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: accourut
  rationale: Le participe aoriste introduit la première action de la séquence. « Accourut » rend naturellement en français le déplacement rapide vers la scène.
- source_word: τις καὶ
  choice: quelqu’un
  rationale: Le pronom indéfini désigne une personne non identifiée. Le καί associé n’exige pas ici un « aussi » distinct en français.
- source_word: γεμίσας σπόγγον ὄξους
  choice: remplit une éponge de vin aigre
  rationale: Ὄξος désigne un vin devenu aigre ou une boisson de vin acide et bon marché. « Vin aigre » évite de suggérer uniquement le vinaigre condimentaire moderne.
- source_word: περιθεὶς καλάμῳ
  choice: la fixa à un roseau
  rationale: Le geste consiste à placer l’éponge sur le roseau afin de l’élever jusqu’à Jésus. « Roseau » conserve le sens précis de κάλαμος, tandis que « fixa » exprime clairement l’usage dans ce contexte.
- source_word: ἐπότιζεν αὐτόν
  choice: lui donna à boire
  rationale: L’imparfait grec présente l’action dans son déroulement ou comme une tentative. Le passé simple français est toutefois plus naturel dans cette succession narrative sans nier que l’homme lui faisait boire.
- source_word: Ἄφετε
  choice: Laissez-le
  rationale: L’impératif appelle les autres à ne pas intervenir, au moins momentanément. Le grec n’exprime pas explicitement le complément, mais le contexte permet « le »; l’autre valeur idiomatique, « Attendez », est conservée en note.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Voyons si Élie vient
  rationale: Cette formulation française conserve l’idée de vérifier si Élie intervient et maintient l’immédiateté du présent ἔρχεται.
- source_word: καθελεῖν αὐτόν
  choice: le faire descendre
  rationale: Καθαιρέω désigne ici le fait de faire descendre Jésus de l’endroit élevé où il se trouve, c’est-à-dire de la croix.
theological_decisions:
- issue: Portée de l’impératif Ἄφετε
  choice: '« Laissez-le » : ordre de ne pas intervenir auprès de Jésus pendant qu’on attend de voir si Élie viendra.'
  alternative: '« Attendez » : invitation idiomatique à suspendre l’action pour observer ce qui va arriver.'
  rationale: Le grec permet ces deux nuances et n’énonce aucun complément explicite. Le texte principal retient le sens lexical direct, tandis que la note préserve l’autre lecture contextuelle sans trancher davantage.
translation_notes:
  register: Français international actuel, narratif et digne. La syntaxe coordonnée reste simple et accessible. « Accourut », « roseau » et « faire descendre » conservent la couleur concrète du récit sans archaïsme marqué.
