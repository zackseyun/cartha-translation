  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: fr
  text: Mais Jésus poussa un grand cri[a] et expira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cri puissant » ou « d’une voix forte ».
    reason: lexical_alternative
  - marker: b
    text: Ou simplement « mourut »; littéralement, « expira » ou « souffla dehors ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: δέ est un connecteur léger; « Mais » marque naturellement le tournant narratif et le contraste solennel dans ce contexte.
- source_word: ἀφεὶς
  choice: poussa
  rationale: Avec φωνὴν μεγάλην, le participe de ἀφίημι signifie idiomatiquement émettre un cri; « pousser un cri » est l’expression française naturelle.
- source_word: φωνὴν μεγάλην
  choice: un grand cri
  rationale: φωνή peut désigner une voix, un son ou un cri. Ici, la construction et le contexte de la Passion favorisent « cri »; « grand » préserve à la fois l’idée d’intensité et la formulation grecque sans la réduire uniquement au volume.
- source_word: ἐξέπνευσεν
  choice: rendit le dernier souffle
  rationale: ἐκπνέω évoque littéralement l’expiration et signifie idiomatiquement mourir. Cette formulation conserve l’image corporelle et le ton solennel sans importer l’idée distincte de « remettre l’esprit ».
- source_word: ὁ δὲ Ἰησοῦς
  choice: Mais Jésus
  rationale: L’article grec devant le nom propre ne demande pas de correspondance séparée en français; le sujet et le connecteur sont rendus avec naturel.
theological_decisions:
- issue: Exprimer la mort de Jésus sans ajouter une nuance théologique venue d’un autre récit évangélique
  choice: rendit le dernier souffle
  alternative: mourut; expira; remit l’esprit
  rationale: Le verbe décrit la mort au moyen de l’image du souffle. « Rendit le dernier souffle » garde cette image, tandis que « remit l’esprit » risquerait d’harmoniser le texte avec une formulation différente attestée ailleurs.
translation_notes:
  register: Français international moderne, digne et narratif. « Poussa un grand cri » est idiomatique sans être familier; « rendit le dernier souffle » conserve la solennité et l’image du grec.
