revisions:
- from: Mais Jésus poussa un grand cri[a], puis rendit le dernier souffle[b].
  to: Mais Jésus poussa un grand cri[a] et expira[b].
  rationale: La révision remplace une collocation française incomplète par « expira », rendu sobre, idiomatique et proche du verbe grec ἐξέπνευσεν. Elle remplace aussi « puis » par « et », qui représente plus souplement le participe grec. Les notes sont conservées et la note b est corrigée afin de ne pas attribuer au grec un objet absent.
