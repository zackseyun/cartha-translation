lexical_decisions:
- source_word: Καὶ
  choice: Le
  rationale: Le français n’exige pas de rendre mécaniquement la coordination initiale; l’enchaînement narratif reste naturel et fidèle sans « Et ».
- source_word: ἤδη ὀψίας γενομένης
  choice: Le soir était déjà venu
  rationale: Cette proposition temporelle rend le génitif absolu ainsi que la valeur de ἤδη, dans un français actuel et digne.
- source_word: ἐπεὶ
  choice: Comme
  rationale: « Comme » introduit naturellement ici la circonstance explicative et causale.
- source_word: παρασκευή
  choice: le jour de la Préparation
  rationale: Dans ce contexte, le terme désigne le jour consacré aux préparatifs avant le sabbat, et non une préparation générale.
- source_word: ὅ ἐστιν
  choice: c’est-à-dire
  rationale: Cette formule française rend clairement l’explication fournie par Marc.
- source_word: προσάββατον
  choice: la veille du sabbat
  rationale: Cette expression française concise et naturelle désigne le jour précédant le sabbat sans remplacer le terme par « vendredi », formulation plus interprétative.
