  text: Le soir était déjà venu[a], et c’était le jour de la Préparation[b], c’est-à-dire la veille du sabbat[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors que le soir était déjà arrivé ».
