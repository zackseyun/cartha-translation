  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: fr
  text: 'Pilate leur répondit de nouveau : « Que voulez-vous donc que je fasse de celui que vous appelez le roi des Juifs[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui dont vous dites qu’il est le roi des Juifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe signale que Pilate reprend la parole dans l’échange. « De nouveau » est naturel en français moderne et conserve cette progression narrative.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: leur demanda
  rationale: Dans cette formule narrative influencée par l’usage sémitique, le participe et l’imparfait introduisent la réplique de Pilate. Puisque ses paroles prennent la forme d’une question, « demanda » rend naturellement la fonction de l’expression sans reproduire lourdement « répondit et disait ».
- source_word: Τί οὖν
  choice: Que… donc
  rationale: « Donc » conserve le lien logique avec la demande précédente de la foule, dans une tournure française idiomatique.
- source_word: θέλετε ποιήσω
  choice: voulez-vous… que je fasse
  rationale: Cette construction rend directement le désir exprimé par θέλετε et le subjonctif ποιήσω, tout en restant naturelle en français.
- source_word: ὃν λέγετε
  choice: celui que vous appelez
  rationale: Ce choix rattache explicitement le titre à la manière dont les interlocuteurs désignent Jésus, sans ajouter une affirmation de Pilate sur son identité.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: le roi des Juifs
  rationale: Il s’agit du titre politique récurrent dans le récit de la Passion. La minuscule à « roi » convient ici à un titre descriptif placé dans la bouche des interlocuteurs.
theological_decisions:
- issue: Les paroles de Pilate présentent-elles la royauté de Jésus comme une affirmation personnelle ou comme la désignation employée par la foule ?
  choice: « celui que vous appelez le roi des Juifs »
  alternative: « celui dont vous dites qu’il est le roi des Juifs »
  rationale: La relative ὃν λέγετε maintient une distance rhétorique en rapportant le titre aux interlocuteurs de Pilate. La traduction ne transforme donc ses paroles ni en confession ni en démenti de la royauté de Jésus.
translation_notes:
  register: Français moderne, courant et digne. « Demanda » convient au contenu interrogatif de la réplique ; « répondit de nouveau » serait plus formellement proche, mais moins fluide dans ce contexte. La formulation conserve la distance de Pilate à l’égard du titre.
