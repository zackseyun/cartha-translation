source:
  edition: SBLGNT
  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: fr
  text: Ils lui frappaient la tête avec un roseau, lui crachaient dessus et, s’agenouillant, se prosternaient devant lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adoraient ». Le verbe grec peut signifier « se prosterner devant », « rendre hommage à » ou « adorer »; ici, il décrit la manière dont les soldats imitent par dérision les honneurs rendus à un roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: frappaient
  rationale: L’imparfait grec présente une action répétée ou prolongée; l’imparfait français en conserve naturellement l’aspect sans en exagérer la violence.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: lui frappaient la tête
  rationale: Le français emploie naturellement le pronom datif avec l’article défini pour une partie du corps.
- source_word: καλάμῳ
  choice: avec un roseau
  rationale: « Roseau » est le sens courant de κάλαμος et maintient le lien avec l’objet utilisé comme sceptre dérisoire dans la scène.
- source_word: ἐνέπτυον αὐτῷ
  choice: lui crachaient dessus
  rationale: Cette tournure française courante rend le datif et conserve, par l’imparfait, le caractère répété de l’humiliation.
- source_word: τιθέντες τὰ γόνατα
  choice: se mettant à genoux
  rationale: L’expression grecque, littéralement « posant les genoux », est un idiome signifiant s’agenouiller.
- source_word: προσεκύνουν αὐτῷ
  choice: se prosternaient devant lui
  rationale: Le verbe peut désigner la prosternation, l’hommage ou l’adoration. Dans cette scène de dérision, « se prosternaient devant lui » rend directement le geste sans décider qu’il s’agissait d’une adoration sincère.
theological_decisions:
- issue: Sens de προσκυνέω dans une scène de moquerie
  choice: se prosternaient devant lui
  alternative: l’adoraient
  rationale: Le contexte décrit une imitation moqueuse des honneurs royaux. La traduction principale exprime donc le geste visible tout en préservant, en note, la possibilité lexicale d’un terme cultuel et l’ironie théologique du récit.
translation_notes:
  register: Français international moderne, clair et digne. La coordination et les imparfaits maintiennent la succession d’actes répétés; « se mettant à genoux » évite une formulation littérale peu naturelle.
