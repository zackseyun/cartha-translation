id: MRK.15.35
reference: Mark 15:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: fr
  text: 'Quelques-uns de ceux qui se tenaient là, l’ayant entendu, disaient : « Regardez, il appelle Élie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il appelle Élie à son secours ».'
    reason: La construction grecque peut désigner l’appel adressé à une personne en vue de son intervention, sans expliciter cette nuance dans le texte.
lexical_decisions:
- source_word: καί
  choice: omis comme connecteur explicite
  rationale: En français, l’enchaînement narratif reste naturel sans rendre systématiquement καί par « et »; cela n’ajoute aucune nuance temporelle.
- source_word: τινες τῶν παρεστηκότων
  choice: Quelques-uns de ceux qui se tenaient là
  rationale: Cette formulation rend le sous-ensemble indéfini et conserve le sens spatial concret du participe substantivé.
- source_word: ἀκούσαντες
  choice: l’ayant entendu
  rationale: Le participe passé marque une action antérieure à leur parole; le pronom renvoie naturellement au cri précédent de Jésus.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français préserve l’aspect imperfectif du verbe grec sans imposer l’idée d’une répétition insistante.
- source_word: Ἴδε
  choice: Écoutez
  rationale: Dans cette réplique, l’impératif sert à attirer l’attention sur ce qui vient d’être entendu; « Écoutez » est idiomatique en français et adapté au contexte auditif.
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: φωνεῖ
  choice: il appelle Élie
  rationale: Le présent français rend le présent du discours direct. « Appeler Élie » conserve la construction transitive et évite de préciser plus que le grec si l’appel s’adresse à Élie ou sollicite sa venue.
theological_decisions:
- issue: Expliciter que les personnes présentes ont mal compris le cri de Jésus
  choice: 'Conserver leur déclaration au premier degré : « il appelle Élie »'
  alternative: « ils pensaient qu’il appelait Élie »
  rationale: Le narrateur rapporte leurs paroles sans expliquer explicitement leur méprise; l’ajout d’une explication résoudrait ce que le texte laisse au contexte.
- issue: Préciser le sens de φωνεῖ avec un complément de personne
  choice: « il appelle Élie » dans le texte, avec « il appelle Élie à l’aide » en note
  alternative: « il appelle Élie à l’aide » directement dans le texte
  rationale: La formulation principale reste proche de l’expression grecque et en préserve la concision; la note signale le sens contextuellement possible sans l’imposer.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche du grec tout en restant naturelle; « Écoutez » évite l’archaïsme de « Voici » ou « Voyez » et correspond à la réaction provoquée par un cri entendu.
