  source_fidelity: 'La structure est globalement fidèle : « Quelques-uns de ceux qui se tenaient là », le participe antérieur et l’imparfait « disaient » rendent bien le grec. Toutefois, Ἴδε est un appel à regarder/à remarquer (« Regardez », « Voyez »), et non un impératif d’écoute ; « Écoutez » modifie donc l’image et l’action demandée.'
