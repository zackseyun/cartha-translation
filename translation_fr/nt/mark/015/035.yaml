    rationale: Ἴδε signifie « regarde / voyez / voici » et attire l’attention sur ce qui est observé ou constaté. Le remplacer par « Écoutez » transforme l’impératif en consigne auditive, même si la réplique suit un cri entendu.
  - severity: low
    issue: La note actuelle est inutilement expansive et propose deux reformulations interprétatives.
    rationale: « Il appelle Élie à l’aide » et « il appelle Élie pour qu’il vienne » explicitent davantage que le grec. Une seule alternative, clairement présentée comme un sens possible, suffit à préserver l’ambiguïté.
