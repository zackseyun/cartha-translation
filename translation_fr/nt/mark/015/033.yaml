source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: fr
  text: Quand la sixième heure arriva[a], l’obscurité se fit sur tout le pays[b] jusqu’à la neuvième heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire d’environ midi à trois heures de l’après-midi.
    reason: cultural_note
  - marker: b
    text: 'Ou : « sur toute la terre ». Le mot grec peut désigner aussi bien un pays que la terre.'
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: Quand la sixième heure arriva
  rationale: Le génitif absolu exprime naturellement le moment où survient l’événement. Garder « sixième heure » préserve la manière antique de compter les heures; l’équivalent moderne figure en note.
- source_word: σκότος
  choice: l’obscurité
  rationale: Équivalent français direct et naturel du nom grec, adapté à un récit digne et courant.
- source_word: ἐγένετο
  choice: se fit
  rationale: Dans l’expression « l’obscurité se fit », cette tournure française restitue naturellement la survenue indiquée par le verbe grec sans ajouter l’image plus interprétative d’une obscurité qui « tombe ».
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: sur tout le pays
  rationale: γῆ peut désigner le pays, la terre ou la Terre. « Pays » convient au contexte narratif sans imposer une portée mondiale; l’autre possibilité est signalée en note.
- source_word: ἕως ὥρας ἐνάτης
  choice: jusqu’à la neuvième heure
  rationale: Cette formulation reste cohérente avec « sixième heure » et conserve le système horaire du texte source, expliqué en note.
theological_decisions:
- issue: Étendue de γῆ dans le récit de l’obscurité lors de la crucifixion
  choice: pays
  alternative: terre ou Terre entière
  rationale: Le mot grec est réellement polysémique. Le choix de « pays » évite d’affirmer explicitement une portée planétaire que le grec n’impose pas, tandis que la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du déroulement grec tout en étant idiomatique. Les heures antiques sont conservées dans le texte et explicitées en note; l’ambiguïté de γῆ est maintenue.
