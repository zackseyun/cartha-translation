  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: fr
  text: Après avoir été informé par le centurion, il accorda le corps[a] à Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cadavre » ou « le corps sans vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: Après s’être renseigné
  rationale: Le participe aoriste exprime ici une circonstance temporelle antérieure à l’action principale. « Après s’être renseigné » rend naturellement le fait que Pilate a obtenu confirmation.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: auprès du centurion
  rationale: ἀπό avec le génitif indique la source de l’information. En français, « se renseigner auprès de » exprime idiomatiquement cette relation, tandis que « centurion » conserve le titre militaire romain précis.
- source_word: ἐδωρήσατο
  choice: accorda
  rationale: Le verbe évoque un don ou une concession faite comme faveur. « Accorda » convient à l’autorisation officielle donnée par Pilate, sans réduire le geste à une simple remise matérielle.
- source_word: πτῶμα
  choice: corps
  rationale: Le terme désigne ici un cadavre. « Corps » est naturel et digne dans le récit; la valeur explicite de « cadavre » est signalée en note.
- source_word: τῷ Ἰωσήφ
  choice: à Joseph
  rationale: Le datif marque simplement le bénéficiaire de la concession.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la succession temporelle et le caractère officiel de la décision de Pilate, tout en évitant d’ajouter un complément direct non exprimé dans le grec.
