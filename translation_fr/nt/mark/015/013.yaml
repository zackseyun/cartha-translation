  yaml_path: translation/nt/mark/015/013.yaml
  text: But they cried out again, “Crucify him!”
translation:
  language: fr
  text: 'Mais ils crièrent de nouveau : « Crucifie-le ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: eux
  rationale: L’article nominatif pluriel est employé comme pronom et renvoie au groupe déjà présent dans le contexte. « Eux » rend naturellement cette reprise tout en faisant ressortir le contraste.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une légère opposition à la question précédente de Pilate. « Mais » exprime clairement cette valeur adversative sans la renforcer à l’excès.
- source_word: πάλιν
  choice: de nouveau
  rationale: πάλιν indique la répétition. « De nouveau » est une formulation naturelle et fidèle dans ce registre narratif.
- source_word: ἔκραξαν
  choice: crièrent
  rationale: κράζω désigne un cri poussé à haute voix. « Crièrent » conserve l’intensité et convient à une narration française digne et actuelle.
- source_word: Σταύρωσον
  choice: Crucifie
  rationale: L’impératif aoriste actif à la deuxième personne du singulier s’adresse directement à Pilate. L’impératif direct « Crucifie » reproduit la forme et la force du grec, contrairement à une tournure plus interprétative comme « Fais-le crucifier ».
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie à Jésus. En français, le pronom conjoint « le » est la forme naturelle avec l’impératif affirmatif.
