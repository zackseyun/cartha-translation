id: MRK.15.39
reference: Mark 15:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: fr
  text: 'Quand le centurion, qui se tenait en face de lui, vit qu’il avait ainsi rendu son dernier souffle, il dit : « Vraiment, cet homme était Fils de Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un fils de Dieu ». En grec, l’expression peut avoir un sens qualitatif ou indéfini ; dans le contexte de Marc, elle a probablement la force du titre « Fils de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Quand ... vit
  rationale: Le participe aoriste ἰδών a ici une valeur temporelle. Le léger lien exprimé par δέ n’exige pas un connecteur distinct en français.
- source_word: κεντυρίων
  choice: centurion
  rationale: « Centurion » est le terme français courant et précis pour ce grade de l’armée romaine.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: qui se tenait en face de lui
  rationale: Cette formulation naturelle conserve la position déjà occupée exprimée par le participe parfait ainsi que le sens spatial de ἐξ ἐναντίας.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: qu’il avait ainsi rendu le dernier souffle
  rationale: « Rendre le dernier souffle » conserve l’image de l’expiration portée par ἐκπνέω, tandis que « ainsi » traduit explicitement οὕτως et rattache la réaction du centurion à la manière dont Jésus est mort.
- source_word: Ἀληθῶς
  choice: Vraiment
  rationale: « Vraiment » rend naturellement la force affirmative et solennelle de l’adverbe.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: cet homme
  rationale: Traduction directe, naturelle et contextuellement précise.
- source_word: υἱὸς θεοῦ
  choice: Fils de Dieu
  rationale: Sans article dans cette construction attributive, l’expression peut être qualitative, indéfinie ou comprise comme un titre. « Fils de Dieu » préserve en français la force qualitative et titulaire sans ajouter l’article défini.
- source_word: ἦν
  choice: était
  rationale: L’imparfait grec est rendu directement par l’imparfait français.
theological_decisions:
- issue: Valeur de υἱὸς θεοῦ dans la déclaration du centurion
  choice: Fils de Dieu
  alternative: un fils de Dieu
  rationale: Dans le récit de Marc, l’expression possède une forte portée christologique, mais sa forme grecque sans article permet aussi une lecture indéfinie ou qualitative. Le texte principal conserve le titre sans article en français, et la note signale l’autre lecture réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque tout en employant un ordre naturel. « Rendre le dernier souffle » maintient l’image concrète du verbe source ; la note préserve l’ambiguïté de l’expression christologique.
