  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: fr
  text: Ils l’habillent de pourpre[a] et, après avoir tressé une couronne d’épines, ils la lui mettent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils le revêtent de pourpre » ; le grec ne précise pas ici qu’il s’agit d’un manteau, bien que le contexte indique un vêtement.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: ils l’habillent de
  rationale: Le verbe désigne l’action de vêtir quelqu’un. Cette tournure est naturelle en français moderne et conserve le sens causatif.
- source_word: πορφύραν
  choice: pourpre
  rationale: Le nom peut désigner une étoffe ou un vêtement pourpre. Ne pas ajouter « manteau » préserve l’indétermination lexicale du grec.
- source_word: περιτιθέασιν
  choice: ils la lui posent sur la tête
  rationale: Le verbe signifie placer autour ou sur quelqu’un. Le pronom reprend clairement la couronne, et « sur la tête » explicite en français ce que l’image et le verbe impliquent dans ce contexte.
- source_word: πλέξαντες
  choice: après avoir tressé
  rationale: Le participe aoriste présente le tressage comme antérieur à l’action principale; cette formulation rend clairement la succession des gestes.
- source_word: ἀκάνθινον
  choice: d’épines
  rationale: L’adjectif indique que l’objet est fait d’épines; « couronne d’épines » est la formulation française idiomatique.
- source_word: στέφανον
  choice: couronne
  rationale: Dans cette parodie de royauté, « couronne » communique mieux que « guirlande » l’ironie narrative, sans ajouter d’interprétation étrangère au texte.
theological_decisions:
- issue: Imagerie de royauté tournée en dérision dans l’humiliation de Jésus
  choice: Traduire στέφανον par « couronne ».
  alternative: « guirlande » ou « couronne de feuillage »
  rationale: La pourpre et la couronne composent une mise en scène moqueuse de la royauté. « Couronne » conserve cette portée narrative et théologique sans la développer au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif du grec est conservé. La formulation évite d’introduire « manteau », absent du verset, tout en restant immédiatement compréhensible.
