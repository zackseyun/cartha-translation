  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: fr
  text: Avec lui, ils crucifient deux brigands[a], l’un à sa droite et l’autre à sa gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bandits »; peut-être « insurgés » si le terme comporte ici une nuance politique.
    reason: Alternative lexicale préservant l’étendue sémantique de λῃστής.
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: Avec lui
  rationale: σύν avec le datif exprime l’accompagnement. « Avec lui » est direct, naturel et conserve la mise en relief initiale.
- source_word: σταυροῦσιν
  choice: ils crucifient
  rationale: Le présent actif est un présent historique fréquent chez Marc. Le présent français en préserve ici la vivacité narrative.
- source_word: δύο λῃστάς
  choice: deux brigands
  rationale: λῃστής peut désigner un voleur armé, un brigand ou, selon le contexte, un insurgé. « Brigands » rend mieux que « voleurs » la possibilité d’une violence organisée sans imposer une interprétation politique.
- source_word: ἕνα ἐκ δεξιῶν
  choice: l’un à sa droite
  rationale: Dans ce contexte spatial, l’expression idiomatique désigne la place située à la droite de Jésus.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: l’autre à sa gauche
  rationale: εὐώνυμος est un terme euphémique désignant le côté gauche. La formulation française restitue clairement le parallélisme; αὐτοῦ est rendu par « sa » dans les deux membres.
theological_decisions:
- issue: Portée de λῃσταί dans le récit de la crucifixion
  choice: brigands
  alternative: voleurs; bandits; insurgés
  rationale: Le mot peut évoquer des malfaiteurs violents et parfois des acteurs d’une révolte. Le verset ne permet pas de trancher en faveur d’une qualification strictement politique; le texte principal garde donc une désignation large, et la note préserve les autres possibilités.
translation_notes:
  register: Français international moderne, simple et digne. Le présent historique est conservé pour respecter la narration vive de Marc. « L’un… l’autre » produit un parallélisme naturel en français.
