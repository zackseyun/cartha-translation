id: MRK.15.41
reference: Mark 15:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: fr
  text: Ces femmes, quand il était en Galilée, le suivaient et le servaient[a] ; et beaucoup d’autres femmes étaient montées avec lui à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prenaient soin de lui ». Le verbe grec peut désigner un service concret ou un soutien apporté à quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « montées avec lui à Jérusalem ». Dans la manière biblique de parler, on « monte » à Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Ces femmes
  rationale: Le pronom relatif féminin renvoie aux femmes nommées au verset précédent. « Ces femmes » rend ce lien explicite et permet une phrase française naturelle.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: quand il était en Galilée
  rationale: Cette formulation restitue directement la proposition temporelle et la localisation.
- source_word: ἠκολούθουν
  choice: le suivaient
  rationale: L’imparfait français exprime naturellement l’action habituelle ou prolongée indiquée par l’imparfait grec.
- source_word: διηκόνουν αὐτῷ
  choice: le servaient
  rationale: Le verbe διακονέω désigne ici un service concret apporté à Jésus. « Servaient » reste large, digne et naturel, sans supposer une fonction ecclésiale ultérieure.
- source_word: ἄλλαι πολλαὶ
  choice: beaucoup d’autres femmes
  rationale: Le nom « femmes » est repris pour expliciter le féminin pluriel sous-entendu en grec et éviter toute ambiguïté.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: étaient aussi montées avec lui
  rationale: Le participe aoriste évoque une montée accomplie avec Jésus avant la scène présente. « Monter » conserve l’idiome biblique associé au voyage vers Jérusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: « À Jérusalem » est la formulation française idiomatique pour exprimer la destination.
theological_decisions:
- issue: Nature du service des femmes exprimé par διηκόνουν
  choice: le servaient
  alternative: prenaient soin de lui ; subvenaient à ses besoins
  rationale: « Le servaient » préserve l’étendue du verbe grec, qui peut désigner une aide pratique ou un soutien personnel, sans réduire cette activité à des tâches domestiques ni lui attribuer un office ecclésial précis.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait rend le caractère suivi ou habituel des actions en Galilée. Le point-virgule conserve l’unité syntaxique du verset tout en assurant une lecture fluide.
