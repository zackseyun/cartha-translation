id: MRK.15.38
reference: Mark 15:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: fr
  text: Et le rideau du sanctuaire[a] se déchira en deux, du haut jusqu’en bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rideau du Temple ». Le mot grec désigne ici plus précisément le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: rideau
  rationale: Désigne une tenture intérieure du temple. « Rideau » est concret, naturel en français moderne et évite le caractère plus traditionnel ou interprétatif de « voile ».
- source_word: ναοῦ
  choice: sanctuaire
  rationale: Dans ce contexte, ναός désigne plus précisément le bâtiment sacré intérieur, et non l’ensemble du complexe du Temple. « Sanctuaire » rend cette précision naturellement en français.
- source_word: ἐσχίσθη
  choice: se déchira
  rationale: L’aoriste passif indique que le rideau subit la déchirure. Le passif pronominal français est ici idiomatique et ne précise pas l’agent, comme le grec.
- source_word: εἰς δύο
  choice: en deux
  rationale: Expression française concise et idiomatique qui conserve l’idée d’une division en deux parties.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: du haut jusqu’en bas
  rationale: Rend la direction et toute l’étendue de la déchirure, avec l’insistance de ἕως sur son point d’aboutissement.
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple qui relie cet événement au récit précédent sans ajouter une nuance temporelle absente du grec.
theological_decisions:
- issue: Signification de la déchirure du rideau du sanctuaire
  choice: Rapporter l’événement sans en expliciter le symbolisme dans le texte.
  alternative: Y voir explicitement l’ouverture de l’accès à Dieu ou le jugement porté sur le système du Temple.
  rationale: Le verset décrit le fait, mais n’en formule pas lui-même la portée théologique. La traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, sobre et narratif. « Sanctuaire » apporte la précision contextuelle de ναός; la note conserve la formulation plus familière « Temple ». Le marqueur de note est placé immédiatement après le terme concerné.
