source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: fr
  text: Alors, les soldats l’emmenèrent à l’intérieur de la cour, c’est-à-dire dans le prétoire[a], et ils convoquent toute la cohorte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « prétoire » désignait généralement le siège ou la résidence officielle du gouverneur romain.
    reason: cultural_note
  - marker: b
    text: Une « cohorte » était une unité militaire romaine ; ici, le mot désigne les soldats rassemblés sous l’autorité romaine.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ στρατιῶται
  choice: Alors les soldats
  rationale: δέ marque ici la progression du récit plutôt qu’une opposition forte. « Alors » assure un enchaînement naturel, et « soldats » rend directement στρατιῶται.
- source_word: ἀπήγαγον αὐτὸν
  choice: l’emmenèrent
  rationale: ἀπάγω signifie conduire ou emmener quelqu’un. « L’emmenèrent » exprime naturellement le déplacement imposé vers le lieu indiqué.
- source_word: ἔσω τῆς αὐλῆς
  choice: à l’intérieur de la cour
  rationale: ἔσω avec le génitif indique l’intérieur d’un espace. αὐλή peut désigner la cour d’un palais ou d’un siège officiel, mais « cour » évite de préciser plus que le texte.
- source_word: ὅ ἐστιν πραιτώριον
  choice: c’est-à-dire du prétoire
  rationale: Le terme historique πραιτώριον est conservé en français, tandis que « c’est-à-dire » rend la précision explicative du grec. La préposition « du » rattache naturellement le prétoire à l’espace dans lequel ils entrent.
- source_word: συγκαλοῦσιν
  choice: ils convoquent
  rationale: « Convoquent » rend l’idée d’appeler des personnes à se rassembler. Le présent est maintenu afin de préserver le présent historique vif de Marc.
- source_word: ὅλην τὴν σπεῖραν
  choice: toute la cohorte
  rationale: σπεῖρα est un terme militaire désignant une cohorte romaine. « Cohorte » en conserve la précision historique, tandis que la note évite de supposer nécessairement chaque membre d’un effectif théorique complet.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le vocabulaire historique « prétoire » et « cohorte » est conservé et expliqué en notes. Le passage de l’imparfait narratif grec au présent historique dans συγκαλοῦσιν est reproduit par le contraste entre « l’emmenèrent » et « ils convoquent ».
