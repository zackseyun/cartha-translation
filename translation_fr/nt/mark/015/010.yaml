id: MRK.15.10
reference: Mark 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: fr
  text: En effet, il savait que les chefs des prêtres lui avaient livré Jésus par jalousie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par envie » ou « à cause de leur jalousie ».
    reason: Alternative lexicale pour φθόνος et autre formulation française du rapport causal.
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: il savait
  rationale: L’imparfait exprime ici la connaissance établie de Pilate. « Il savait » est naturel en français et conserve cet aspect duratif ou acquis.
- source_word: γὰρ
  choice: En effet
  rationale: La particule introduit l’explication de ce qui précède. « En effet » marque clairement et naturellement ce lien logique.
- source_word: ὅτι
  choice: que
  rationale: Introduit le contenu de ce que Pilate savait.
- source_word: διὰ φθόνον
  choice: par jalousie
  rationale: διά avec l’accusatif exprime la cause ou le motif. Dans ce contexte de rivalité hostile, « jalousie » rend φθόνος en français courant; « envie » demeure une possibilité lexicale.
- source_word: παραδεδώκεισαν
  choice: avaient livré
  rationale: Le plus-que-parfait grec situe la remise de Jésus avant la connaissance évoquée. « Livrer » convient au contexte judiciaire sans imposer la nuance plus précise de « trahir ».
- source_word: αὐτὸν
  choice: Jésus
  rationale: Le pronom renvoie à Jésus. La reprise nominale évite en français l’ambiguïté de deux pronoms masculins dans « lui avaient livré ».
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Désigne les principales autorités sacerdotales, et non plusieurs titulaires simultanés de la fonction unique de grand prêtre. Cette formulation est claire pour le lecteur moderne.
theological_decisions:
- issue: Motif attribué aux chefs des prêtres
  choice: Le texte rapporte que Pilate savait qu’ils avaient livré Jésus par jalousie.
  alternative: « par envie »
  rationale: La traduction conserve l’évaluation du motif donnée dans le récit, sans l’amplifier ni lui ajouter une interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » assure une articulation fluide avec le contexte précédent; la mention explicite de Jésus lève une ambiguïté pronominale absente du grec.
