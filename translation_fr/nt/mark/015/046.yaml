id: MRK.15.46
reference: Mark 15:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: fr
  text: Après avoir acheté une toile de lin[a], il le descendit, l’enveloppa dans la toile et le déposa dans un tombeau taillé dans le roc[b]. Puis il roula une pierre contre l’entrée[c] du tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pièce de toile de lin » ou « un linceul » pour le grec σινδών.
    reason: lexical_alternative
  - marker: b
    text: Ou « creusé dans la roche ».
    reason: lexical_alternative
  - marker: c
    text: Ou « contre l’ouverture » ou « contre la porte » ; le mot grec θύρα peut désigner une porte ou une entrée.
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: une toile de lin / la toile
  rationale: Le nom σινδών désigne une pièce de toile de lin pouvant servir à envelopper un défunt. « Toile de lin » conserve à la fois la matière et la fonction sans imposer le sens plus spécialisé de « linceul ». La seconde occurrence reprend naturellement le nom avec l’article défini.
- source_word: καθελών
  choice: il le descendit
  rationale: Dans le contexte de la crucifixion, καθαιρέω désigne l’action de faire descendre Jésus de la croix. Le pronom grec est conservé sans ajouter explicitement « de la croix », absent de cette proposition mais clair dans le contexte.
- source_word: ἐνείλησεν
  choice: l’enveloppa
  rationale: Le verbe signifie envelopper ou enrouler dans une étoffe. « Enveloppa » est naturel et précis dans le contexte funéraire, sans ajouter de détails rituels.
- source_word: ἔθηκεν
  choice: le déposa
  rationale: « Déposa » rend dignement τίθημι dans un contexte d’ensevelissement et convient mieux en français que le générique « mit ».
- source_word: μνημείῳ / μνημείου
  choice: un tombeau / du tombeau
  rationale: Ici, μνημεῖον désigne un lieu d’ensevelissement aménagé dans le roc. « Tombeau » exprime précisément cette réalité.
- source_word: λελατομημένον ἐκ πέτρας
  choice: taillé dans le roc
  rationale: Le participe parfait passif décrit un tombeau déjà aménagé par taille dans la masse rocheuse. « Taillé dans le roc » est fidèle, idiomatique et plus accessible que « excavé ».
- source_word: προσεκύλισεν
  choice: roula … contre
  rationale: Le verbe exprime un déplacement par roulement vers ou contre quelque chose. En français, la direction s’exprime naturellement par « contre » avec le complément.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: contre l’entrée du tombeau
  rationale: θύρα peut désigner une porte ou l’ouverture qui donne accès à un lieu. Pour un tombeau rupestre fermé par une pierre, « entrée » communique clairement le sens sans suggérer un battant.
- source_word: ἀγοράσας
  choice: Après avoir acheté
  rationale: Le participe aoriste présente cet achat comme antérieur aux actions principales. « Après avoir acheté » en rend clairement la succession.
