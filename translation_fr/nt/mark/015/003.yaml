  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κατηγόρουν αὐτοῦ οἱ ἀρχιερεῖς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/003.yaml
  text: And the chief priests were accusing him of many things[a].
translation:
  language: fr
  text: Et les grands prêtres portaient contre lui de nombreuses accusations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’accusaient de beaucoup de choses ».'
    reason: Formulation plus proche de la construction grecque et qui conserve l’indétermination de πολλά.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination simple et le mouvement narratif paratactique caractéristique de Marc.
- source_word: κατηγόρουν
  choice: portaient… des accusations
  rationale: L’imparfait grec décrit une action en cours ou répétée; l’imparfait français « portaient » en maintient l’aspect duratif.
- source_word: αὐτοῦ
  choice: contre lui
  rationale: Le génitif régi par κατηγορέω désigne la personne visée par les accusations; « contre lui » l’exprime naturellement en français.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Désigne les principales autorités sacerdotales, et non plusieurs titulaires simultanés de la fonction unique de grand prêtre.
- source_word: πολλά
  choice: de nombreuses accusations
  rationale: Le neutre pluriel indique la multiplicité des griefs sans en préciser la nature; cette formulation convient au contexte judiciaire.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Chefs des prêtres » évite l’ambiguïté possible de « grands prêtres », tandis que la note conserve une formulation moins juridique et plus indéterminée.
