review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : la foule se déplace vers Pilate, commence à formuler une demande, et celle-ci concerne son usage habituel à leur égard. Toutefois, « monta » isolé est peu naturel en français narratif moderne et impose plus nettement une montée physique que le contexte immédiat ne permet de situer. « S''avança » conserve le mouvement d''approche sans ajouter de détail spatial.'
  naturalness: « La foule monta » est raide sans complément de lieu. « La foule s'avança » est plus idiomatique. La formulation principale révisée garde l'explicitation française nécessaire de l'ellipse grecque, sans préciser la faveur qui sera identifiée au verset suivant.
  terminology: « La foule », « se mit à demander » et « avait l'habitude de faire » conviennent au registre moderne et rendent respectivement ὁ ὄχλος, ἤρξατο αἰτεῖσθαι et l'imparfait ἐποίει. « Pour elle » rend correctement le datif bénéficiaire αὐτοῖς, dont l'antécédent collectif est « la foule ».
  issues:
  - severity: medium
    issue: « La foule monta » est une formulation peu naturelle et spatialement trop marquée.
    rationale: ἀναβὰς indique un mouvement vers Pilate (« being/came up »), mais le français moderne emploie rarement « la foule monta » sans destination. « S'avança » exprime naturellement l'approche, sans introduire une topographie non explicitée.
  - severity: low
    issue: La note dite plus littérale est syntaxiquement maladroite en français.
    rationale: « se mit à demander comme il avait l'habitude de faire » laisse l'ellipse trop abrupte en français et peut faire porter « comme » sur la demande plutôt que sur l'action sollicitée. Une note peut conserver « comme » tout en explicitant minimalement l'infinitif sous-entendu.
  revised_text: La foule s’avança et se mit à lui demander de faire pour elle ce qu’il avait l’habitude de faire.[a]
