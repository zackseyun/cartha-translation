revisions:
- from: La foule monta et se mit à lui demander de faire pour elle ce qu’il avait l’habitude de faire.[a]
  to: La foule s’avança et se mit à lui demander de faire pour elle ce qu’il avait l’habitude de faire.[a]
  rationale: La révision remplace seulement « monta » par « s’avança », plus naturel en français international moderne et moins topographiquement spécifique. Elle conserve l'explicitation sobre de la demande habituelle, sans anticiper le contenu de la coutume, et reformule la note pour qu'elle soit grammaticalement claire.
