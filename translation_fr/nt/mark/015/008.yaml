  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: fr
  text: La foule s’avança et se mit à lui demander de faire pour elle ce qu’il avait l’habitude de faire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus près de la forme grecque : « La foule, s’étant avancée, se mit à lui demander de faire comme il avait l’habitude de le faire pour elle. »'
    reason: Alternative plus formelle qui conserve plus directement le participe ἀναβὰς et « comme » (καθὼς), tout en rendant l’ellipse de manière intelligible en français.
lexical_decisions:
- source_word: ἀναβὰς
  choice: monta
  rationale: Le participe aoriste d’ἀναβαίνω exprime ici le déplacement de la foule vers le lieu où se trouve Pilate. « Monta » conserve simplement l’idée de mouvement ascendant, sans alourdir la phrase par « étant montée ».
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: ὄχλος désigne naturellement une foule dans ce cadre narratif.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: se mit à lui demander
  rationale: ἤρξατο suivi de l’infinitif marque le commencement de l’action. « Se mit à demander » est naturel en français, et « lui » explicite le destinataire implicite dans le contexte.
- source_word: καθὼς
  choice: ce que
  rationale: καθώς signifie formellement « comme », mais la construction elliptique renvoie ici à la pratique habituelle que la foule demande à Pilate d’accomplir. « Ce que » rend cette relation clairement en français, tandis que la note conserve la forme plus littérale.
- source_word: ἐποίει
  choice: avait l’habitude de faire
  rationale: L’imparfait de ποιέω a ici une valeur habituelle ou coutumière, bien rendue par « avait l’habitude de faire ».
- source_word: αὐτοῖς
  choice: pour elle
  rationale: Le datif a un sens bénéficiaire. En français, le pronom singulier « elle » reprend grammaticalement « la foule ».
