    text: 'Ou, plus près de la forme grecque : « La foule, s’étant avancée, se mit à lui demander de faire comme il avait l’habitude de le faire pour elle. »'
    reason: Alternative plus formelle qui conserve plus directement le participe ἀναβὰς et « comme » (καθὼς), tout en rendant l’ellipse de manière intelligible en français.
  revision_rationale: La révision remplace seulement « monta » par « s’avança », plus naturel en français international moderne et moins topographiquement spécifique. Elle conserve l'explicitation sobre de la demande habituelle, sans anticiper le contenu de la coutume, et reformule la note pour qu'elle soit grammaticalement claire.
