  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: fr
  text: 'Et ils l’amènent au lieu appelé Golgotha, ce qui se traduit par : « Lieu d’un crâne[a] ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lieu du crâne ». L’expression grecque Κρανίου Τόπος ne comporte pas d’article; le génitif peut donc être rendu en français avec un déterminant indéfini ou défini.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: ils l’amènent
  rationale: Le présent historique grec est conservé, ce qui donne au récit sa vivacité. « Amener » exprime le déplacement vers une destination sans imposer l’idée qu’on porte Jésus physiquement.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: au lieu de Golgotha
  rationale: La préposition avec l’accusatif indique le mouvement vers le lieu. La formulation conserve à la fois τόπον et le nom propre, sans ajouter « appelé », absent du grec.
- source_word: Γολγοθᾶν
  choice: Golgotha
  rationale: Le nom propre est translittéré sous sa forme française traditionnelle.
- source_word: μεθερμηνευόμενον
  choice: ce qui se traduit
  rationale: Le participe désigne explicitement la traduction ou l’interprétation d’une expression dans une autre langue; cette tournure française en préserve la fonction explicative.
- source_word: Κρανίου Τόπος
  choice: Lieu du Crâne
  rationale: Cette formulation naturelle et digne conserve la construction génitive. Le français exige ici un déterminant; l’article défini correspond à l’usage traditionnel, tandis qu’une note signale que le grec sans article permet aussi une lecture indéfinie.
