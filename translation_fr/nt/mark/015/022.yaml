  source_fidelity: 'Le présent historique et le sens non surspécifié de φέρουσιν sont bien rendus par « ils l’amènent ». En revanche, « au lieu de Golgotha » peut se comprendre en français comme un lieu appartenant à Golgotha plutôt que comme l’appellation du lieu. « au lieu appelé Golgotha » explicite naturellement l’apposition τόπον … Γολγοθᾶν sans modifier le sens. La traduction explicative doit conserver l’indétermination possible du génitif anarthre : « Lieu d’un crâne » est le rendu principal le plus proche.'
  naturalness: « Ils l’amènent au lieu appelé Golgotha » est idiomatique en français international moderne. « ce qui se traduit par » est une tournure française complète et claire. La casse courante de « crâne » convient dans une expression traduite, non dans un titre français.
  terminology: « Golgotha » est correctement conservé comme nom propre. « Lieu d’un crâne » rend Κρανίου Τόπος sans introduire l’article défini absent du grec. La note peut signaler « Lieu du crâne » comme possibilité de traduction, sans prétendre que l’absence d’article grec impose nécessairement une valeur indéfinie.
