id: MRK.15.15
reference: Mark 15:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: fr
  text: Pilate, voulant satisfaire la foule[a], leur relâcha Barabbas. Puis, après avoir fait fouetter Jésus, il le livra pour qu’il soit crucifié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « plaire à la foule ». Littéralement : « faire ce qui était suffisant pour la foule ».'
    reason: Alternative lexicale et indication de la formulation littérale de l’idiome grec.
lexical_decisions:
- source_word: βουλόμενος
  choice: voulant
  rationale: Le participe exprime la volonté ou l’intention de Pilate. « Voulant » est direct, naturel et n’accentue pas indûment la délibération.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: satisfaire la foule
  rationale: Cette expression idiomatique signifie littéralement faire ce qui est suffisant pour la foule; dans le contexte, elle désigne le fait de céder à son attente ou à sa demande. « Satisfaire la foule » en rend clairement la portée politique.
- source_word: ἀπέλυσεν
  choice: relâcha
  rationale: Dans ce contexte judiciaire, le verbe signifie remettre un prisonnier en liberté. « Relâcha » est précis et idiomatique.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif renvoie à la foule en faveur de laquelle Barabbas est relâché. Le pronom « leur » conserve explicitement ce rapport.
- source_word: παρέδωκεν
  choice: le livra
  rationale: Le verbe désigne la remise de Jésus au pouvoir d’autrui. « Le livra » est naturel en français et conserve la force de ce verbe important dans le récit de la Passion.
- source_word: φραγελλώσας
  choice: après avoir fait fouetter Jésus
  rationale: Le participe aoriste indique une action antérieure à la remise de Jésus. La tournure factitive « fait fouetter » indique naturellement que Pilate ordonne le châtiment plutôt qu’il ne l’exécute lui-même.
- source_word: ἵνα σταυρωθῇ
  choice: pour qu’il soit crucifié
  rationale: La proposition introduite par ἵνα exprime ici le but ou l’issue visée. Cette formulation garde la voix passive et ne précise pas qui procédera à la crucifixion.
- source_word: Βαραββᾶν
  choice: Barabbas
  rationale: Le nom propre suit sa forme française traditionnelle et courante.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Le nom propre suit sa forme française traditionnelle et courante.
theological_decisions:
- issue: Le motif de Pilate dans τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Pilate cherche à satisfaire la foule
  alternative: Pilate cherche à plaire à la foule; Pilate fait pour elle ce qui suffit
  rationale: « Satisfaire » exprime l’idée de répondre à l’exigence de la foule et préserve la tension politique et morale du récit, sans réduire le geste à une simple volonté de plaire ni surinterpréter l’idiome.
- issue: L’agent de la flagellation
  choice: Pilate fait fouetter Jésus
  alternative: Pilate fouette Jésus
  rationale: 'Le contexte permet une compréhension causative: en tant que gouverneur, Pilate ordonne la flagellation. La tournure choisie évite de suggérer qu’il l’exécute personnellement.'
- issue: La relation exprimée par ἵνα σταυρωθῇ
  choice: 'but ou issue de la remise: « pour qu’il soit crucifié »'
  alternative: 'simple infinitif de complément: « afin de le faire crucifier »'
  rationale: La formulation retenue préserve le passif grec et la relation de finalité sans nommer l’agent de la crucifixion.
translation_notes:
  register: Français international moderne, clair et digne. « Relâcha », « fit fouetter » et « livra » conviennent au contexte judiciaire et narratif. La division en deux phrases allège la longue coordination grecque sans modifier l’ordre des événements.
