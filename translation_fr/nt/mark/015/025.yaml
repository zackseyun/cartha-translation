  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: fr
  text: C’était la troisième heure[a], et ils le crucifièrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers neuf heures du matin, selon la manière juive courante de compter les heures.
    reason: Repère culturel nécessaire pour rendre l’indication horaire compréhensible aux lecteurs modernes.
lexical_decisions:
- source_word: Ἦν
  choice: C’était
  rationale: L’imparfait de εἰμί introduit ici une indication d’heure; « C’était » est la tournure impersonnelle naturelle en français.
- source_word: δὲ
  choice: et
  rationale: δέ est ici un connecteur narratif léger, sans opposition forte. La coordination avec « et » préserve simplement la progression du récit.
- source_word: ὥρα τρίτη
  choice: la troisième heure
  rationale: Cette traduction formelle conserve le mode antique de désignation de l’heure; sa correspondance approximative moderne est donnée en note.
- source_word: ἐσταύρωσαν
  choice: ils le crucifièrent
  rationale: L’aoriste actif désigne directement l’acte de crucifier; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom objet renvoie à Jésus; le pronom français « le » le restitue naturellement.
theological_decisions:
- issue: Expression de l’heure et question chronologique
  choice: Conserver « la troisième heure » dans le texte principal.
  alternative: Traduire directement par « environ neuf heures du matin ».
  rationale: Le verset emploie une désignation antique sans la convertir en heure moderne. La conserver évite d’introduire dans le texte une harmonisation ou un cadre explicatif particulier, tout en permettant une clarification en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la tenue narrative du récit; l’expression ancienne de l’heure est conservée sans résoudre les tensions chronologiques éventuelles.
