id: MRK.15.34
reference: Mark 15:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: fr
  text: 'Et à la neuvième heure, Jésus cria d’une voix forte : « Éloï, Éloï, lema sabachthani ? »[a], ce qui se traduit : « Mon Dieu, mon Dieu, pour quelle raison m’as-tu abandonné ? »[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits et de nombreuses traditions donnent une forme correspondant à « lama sabachthani » plutôt qu’à « lema sabachthani ».
    reason: textual_variant
  - marker: b
    text: Les paroles de Jésus font écho au Psaume 22,2.
    reason: cross_reference
  - marker: c
    text: 'Ou : « pourquoi m’as-tu abandonné ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: à la neuvième heure
  rationale: Cette formulation conserve la manière antique de compter les heures employée par Marc, sans la remplacer dans le texte par l’équivalent interprétatif « vers trois heures de l’après-midi ».
- source_word: ἐβόησεν … φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: La formulation française rend à la fois le cri exprimé par le verbe et son intensité, dans un registre naturel et digne.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Éloï, Éloï, lema sabachthani ?
  rationale: Marc conserve les paroles sémitiques de Jésus avant d’en donner la traduction. La translittération française maintient ce procédé et suit la forme λεμά du SBLGNT.
- source_word: μεθερμηνευόμενον
  choice: ce qui se traduit
  rationale: Cette expression indique clairement que Marc fournit la traduction grecque des paroles sémitiques.
- source_word: εἰς τί
  choice: pour quelle raison
  rationale: Cette formulation rend explicitement la demande de raison portée par l’expression grecque, tout en laissant « pourquoi » comme possibilité française plus concise.
- source_word: ἐγκατέλιπές με
  choice: m’as-tu abandonné
  rationale: « Abandonner » exprime clairement en français moderne le fait d’être laissé sans secours et conserve la gravité du cri ainsi que son écho au Psaume 22. Le passé composé convient naturellement au discours direct français.
theological_decisions:
- issue: Rapport entre le cri de Jésus et le Psaume 22.1
  choice: Conserver le cri d’abandon tel quel et signaler son écho scripturaire en note.
  alternative: Atténuer le sens d’abandon ou ajouter dans le texte une explication doctrinale de la relation entre le Père et le Fils.
  rationale: Marc présente sans l’expliquer la tension théologique du cri de Jésus. La traduction doit la préserver sans imposer une résolution doctrinale absente du verset.
- issue: Restitution des paroles sémitiques de Jésus
  choice: Conserver leur translittération, puis leur traduction, comme le fait Marc.
  alternative: Ne donner que leur sens français ou harmoniser la forme avec « Éli, Éli » de Matthieu.
  rationale: Le double énoncé appartient à la présentation propre de Marc et ne doit être ni abrégé ni harmonisé.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve l’expression temporelle antique et la double présentation, sémitique puis traduite, du texte grec. « Abandonné » est préféré à « délaissé », plus littéraire et moins courant aujourd’hui.
