  text: οἱ δὲ ἀρχιερεῖς ἀνέσεισαν τὸν ὄχλον ἵνα μᾶλλον τὸν Βαραββᾶν ἀπολύσῃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: fr
  text: Mais les chefs des prêtres poussèrent la foule pour qu’il leur relâche plutôt Barabbas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « incitèrent la foule ». Le verbe grec peut désigner le fait d’exciter ou d’inciter un groupe à agir dans un sens voulu.
    reason: lexical_alternative
  - marker: b
    text: Ou « de préférence ». Le terme exprime une préférence pour Barabbas par rapport à l’autre possibilité implicite dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais
  rationale: δέ marque ici un léger contraste avec la question et l’attente exprimées dans le contexte précédent.
- source_word: ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Cette expression désigne les responsables de la prêtrise à Jérusalem et reste claire en français moderne.
- source_word: ἀνέσεισαν
  choice: poussèrent … à demander
  rationale: Le verbe signifie provoquer ou inciter un groupe à agir. Cette formulation naturelle explicite l’action visée sans préciser indûment les paroles de la foule.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: Équivalent courant et direct de ὄχλος dans ce cadre narratif.
- source_word: ἵνα
  choice: à demander que
  rationale: La construction exprime le but recherché par les chefs des prêtres; cette tournure française relie naturellement l’incitation à son résultat voulu.
- source_word: μᾶλλον
  choice: plutôt
  rationale: Le terme marque une préférence pour Barabbas par rapport à l’autre possibilité implicite dans le contexte, sans ajouter ici le nom de Jésus.
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Le nom propre est translittéré selon l’usage français établi.
- source_word: ἀπολύσῃ
  choice: qu’il … relâche
  rationale: Le subjonctif aoriste après ἵνα exprime le résultat voulu; le sujet implicite est Pilate.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif présente la foule comme bénéficiaire ou destinataire de la libération.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Chefs des prêtres » évite l’ambiguïté possible de « grands prêtres » au pluriel. La formulation demeure naturelle tout en conservant la préférence implicite portée par μᾶλλον.
