source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: fr
  text: 'Puis il prit l’aveugle par la main et le conduisit hors du village. Après avoir craché dans ses yeux et posé les mains sur lui, il lui demanda : « Vois-tu quelque chose ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: il prit l’aveugle par la main
  rationale: Cette formulation française naturelle conserve le geste concret exprimé par ἐπιλαμβάνομαι avec le génitif de χείρ et rend l’adjectif substantivé τυφλός par « l’aveugle ».
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: le conduisit hors du village
  rationale: Dans ce contexte, où Jésus tient l’homme par la main, « conduisit » rend naturellement le déplacement exprimé par ἐκφέρω; « hors du village » conserve la direction et le sens de κώμη.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: après lui avoir craché sur les yeux
  rationale: Le participe aoriste est rendu par une relation temporelle antérieure. « Cracher sur les yeux » est idiomatique en français tout en préservant la physicalité frappante du geste; εἰς peut littéralement suggérer « dans » ou « vers », mais « sur » convient ici au contact visé.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: lui avoir posé les mains dessus
  rationale: Cette tournure décrit clairement le contact physique sans lui imposer une signification rituelle absente du contexte immédiat.
- source_word: ἐπηρώτα αὐτόν
  choice: il lui demanda
  rationale: Le passé simple s’intègre au récit français. L’imparfait grec peut présenter l’action dans son déroulement, mais le contexte introduit une question directe unique.
- source_word: Εἴ τι βλέπεις;
  choice: Vois-tu quelque chose ?
  rationale: La question française naturelle conserve l’indéfini τι sans préciser davantage la nature ou le degré de la vision.
theological_decisions:
- issue: Préservation de la matérialité des gestes de guérison
  choice: Conserver explicitement le fait que Jésus crache sur les yeux de l’homme et lui pose les mains dessus.
  alternative: Atténuer ou paraphraser ces gestes physiques.
  rationale: Le texte présente une séquence de gestes tangibles et inhabituels; les adoucir supprimerait un élément narratif réel.
- issue: Éventuelle portée rituelle de l’imposition des mains
  choice: Décrire simplement le contact physique par « lui avoir posé les mains dessus ».
  alternative: Employer une formulation suggérant un rite ecclésial formel.
  rationale: Le contexte décrit l’action de guérison de Jésus sans exiger une interprétation sacramentelle ou institutionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe reste fluide et les détails physiques du grec sont maintenus sans amplification.
