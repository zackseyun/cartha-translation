id: MRK.8.26
reference: Mark 8:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: fr
  text: 'Et il l’envoya chez lui[a], en disant : « N’entre même pas dans le village. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ajoutent : « et ne dis rien à personne dans le village ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: renvoya
  rationale: Dans ce contexte, ἀποστέλλω décrit Jésus qui fait repartir l’homme. « Renvoya » exprime naturellement ce départ, sans lui attribuer une mission.
- source_word: εἰς οἶκον αὐτοῦ
  choice: chez lui
  rationale: Cette tournure idiomatique française indique naturellement que l’homme retourne à son propre domicile.
- source_word: λέγων
  choice: en disant
  rationale: Le gérondif conserve le lien participial entre l’envoi de l’homme et la parole qui l’accompagne.
- source_word: Μηδὲ
  choice: N’entre même pas
  rationale: '« Même pas » restitue la force emphatique de μηδέ : l’homme ne doit pas entrer dans le village.'
- source_word: κώμην
  choice: le village
  rationale: κώμη désigne habituellement un village ou une petite localité ; « village » est ici le terme direct et adapté.
- source_word: εἰσέλθῃς
  choice: entre
  rationale: Le subjonctif aoriste employé dans cette défense se rend naturellement en français par l’impératif négatif.
theological_decisions:
- issue: Portée de l’interdiction de Jésus concernant le village
  choice: Présenter simplement l’ordre de ne pas entrer dans le village.
  alternative: Ajouter l’interdiction de parler à quiconque dans le village, selon certains manuscrits.
  rationale: Le texte du SBLGNT ne contient que l’interdiction d’entrer dans le village. La formulation plus longue relève d’une variante textuelle et n’est donc pas intégrée au corps du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Chez lui » évite le littéralisme maladroit de « dans sa maison », tandis que « N’entre même pas » conserve l’insistance de la négation grecque.
