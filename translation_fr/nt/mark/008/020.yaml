  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: fr
  text: 'Et quand les sept pains ont été distribués aux quatre mille, combien de grandes corbeilles pleines de morceaux avez-vous ramassées ? Ils lui répondirent : « Sept. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Et quand
  rationale: Introduit naturellement le second volet de la comparaison avec le précédent repas miraculeux; « et » conserve le lien discursif, tandis que « quand » rend la valeur temporelle.
- source_word: τοὺς ἑπτὰ
  choice: les sept pains
  rationale: Le grec dit elliptiquement « les sept », mais le contexte renvoie aux sept pains de Marc 8.5-6. En français, expliciter « pains » évite une formulation obscure sans ajouter d’idée étrangère au contexte.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: ont été distribués aux quatre mille
  rationale: La formulation française exprime clairement la destination des sept pains dans le contexte du repas. La voix passive complète naturellement l’ellipse grecque, tout en conservant « les quatre mille » sans préciser un genre absent du texte.
- source_word: πόσων σπυρίδων
  choice: combien de grandes corbeilles
  rationale: σπυρίς désigne une corbeille de grande capacité et se distingue de κόφινος au verset 19; « grandes corbeilles » maintient cette distinction lexicale.
- source_word: πληρώματα κλασμάτων
  choice: pleines de morceaux
  rationale: Rend directement l’idée de contenants remplis de morceaux de pain, dans une expression française naturelle.
- source_word: ἤρατε
  choice: avez-vous ramassées
  rationale: Dans ce contexte, αἴρω évoque le fait de recueillir les restes. L’accord au féminin pluriel renvoie aux corbeilles.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Ils lui répondirent
  rationale: Le présent historique grec est rendu au passé simple, naturel dans une narration française soutenue. « Répondirent » exprime précisément la fonction de la parole après la question.
- source_word: Ἑπτά
  choice: Sept
  rationale: Réponse numérique directe, sans élément à expliciter.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’ellipse « les sept » est explicitée par « les sept pains » pour l’intelligibilité. La différence entre σπυρίς et κόφινος est intégrée au texte par « grandes corbeilles », de sorte qu’aucune note n’est nécessaire.
