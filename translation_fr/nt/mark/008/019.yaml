id: MRK.8.19
reference: Mark 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: fr
  text: '« Quand j’ai rompu les cinq pains pour les cinq mille[a], combien de paniers pleins de morceaux[b] avez-vous ramassés[c] ? » Ils lui répondent : « Douze. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cinq mille ». Certains traduisent : « les cinq mille hommes ».'
    reason: La forme grecque est masculine, mais peut fonctionner ici comme la désignation conventionnelle de la foule.
  - marker: b
    text: 'Ou : « fragments ». Il s’agit des morceaux qui restaient des pains rompus.'
    reason: Signale une autre traduction possible de κλάσματα et explicite son lien avec les pains rompus.
  - marker: c
    text: 'Ou : « avez-vous emportés ? »'
    reason: αἴρω peut exprimer le fait de prendre, d’enlever ou d’emporter; le contexte favorise ici « ramasser ».
lexical_decisions:
- source_word: ὅτε
  choice: Quand
  rationale: Introduit naturellement en français la circonstance temporelle rappelée par Jésus.
- source_word: τοὺς πέντε ἄρτους
  choice: les cinq pains
  rationale: Ἄρτος désigne ici des pains dénombrables, comme l’exige le contexte du récit.
- source_word: ἔκλασα
  choice: j’ai rompu
  rationale: Rend directement l’action de rompre les pains; le passé composé convient au rappel oral d’un événement antérieur.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: pour les cinq mille
  rationale: « Pour » exprime naturellement les bénéficiaires; « les cinq mille » conserve la désignation grecque sans ajouter « hommes » dans le texte principal.
- source_word: κοφίνους
  choice: paniers
  rationale: Terme français courant et précis dans ce contexte, sans imposer une forme particulière de panier que le verset n’explicite pas.
- source_word: κλασμάτων πλήρεις
  choice: pleins de morceaux
  rationale: Conserve l’idée de paniers remplis des morceaux issus des pains rompus, dans une formulation française naturelle.
- source_word: ἤρατε
  choice: avez-vous ramassés
  rationale: Dans ce contexte, αἴρω décrit le fait de recueillir les restes; « ramasser » exprime clairement cette action.
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui répondent
  rationale: Le présent français préserve le présent historique grec; « répondent » est plus naturel que « disent » après une question directe.
- source_word: Δώδεκα
  choice: Douze
  rationale: Réponse numérique directe dont le référent, les paniers, est immédiatement clair.
theological_decisions:
- issue: Portée de la forme masculine πεντακισχιλίους
  choice: les cinq mille
  alternative: les cinq mille hommes
  rationale: L’expression sert ici à désigner conventionnellement la foule liée au miracle. Ajouter « hommes » préciserait un élément que la formulation immédiate du verset ne rend pas nécessaire, tout en signalant cette possibilité en note.
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue reste naturel, avec le passé composé dans la question de Jésus et le présent historique dans la réponse des disciples.
