id: MRK.8.15
reference: Mark 8:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: fr
  text: 'Et il leur adressait cet avertissement : « Soyez vigilants, gardez-vous du levain des pharisiens et du levain d’Hérode.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « levain » représente ici une influence dangereuse associée aux pharisiens et à Hérode, sans que ce verset en précise davantage la nature. Comparer Matthieu 16.6, 12 et Luc 12.1.
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: il leur adressait cet avertissement
  rationale: L’imparfait exprime une action en cours ou répétée, tandis que le verbe marque ici une mise en garde insistante. Cette formulation française conserve à la fois l’aspect duratif et la gravité du propos.
- source_word: λέγων
  choice: ':'
  rationale: En français naturel, les deux-points introduisent directement le contenu de l’avertissement sans qu’il soit nécessaire de traduire littéralement le participe par « en disant ».
- source_word: Ὁρᾶτε, βλέπετε
  choice: Soyez vigilants, gardez-vous
  rationale: Les deux impératifs presque synonymes renforcent l’avertissement. Deux expressions distinctes mais proches préservent cette insistance sans lourdeur.
- source_word: ἀπὸ
  choice: de
  rationale: Après « gardez-vous », le français idiomatique emploie « de » et conserve l’idée de se tenir à distance.
- source_word: ζύμης
  choice: levain
  rationale: « Levain » est un mot français courant qui préserve la métaphore d’une influence se diffusant dans toute la pâte, sans l’expliciter dans le texte principal.
- source_word: τῶν Φαρισαίων
  choice: des pharisiens
  rationale: Forme française usuelle du nom du groupe; le génitif indique ici une association avec le levain métaphorique.
- source_word: Ἡρῴδου
  choice: d’Hérode
  rationale: Le texte nomme directement Hérode, parallèlement aux pharisiens; il ne faut pas développer ce référent de manière interprétative dans le texte principal.
theological_decisions:
- issue: Sens métaphorique du « levain »
  choice: Conserver « levain » sans préciser sa signification dans le texte principal.
  alternative: enseignement, hypocrisie ou influence corruptrice
  rationale: Le contexte et les passages synoptiques apparentés orientent vers une influence négative, mais ce verset de Marc n’en précise pas exactement la nature. La métaphore conserve donc l’ouverture interprétative du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Soyez vigilants, gardez-vous » restitue le double impératif grec; « levain » maintient la métaphore biblique tout en restant compréhensible.
