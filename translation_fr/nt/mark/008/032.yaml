  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: fr
  text: Il parlait de cela ouvertement[a]. Et Pierre le prit à part et se mit à le réprimander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « clairement », « avec franchise » ou « hardiment ». Le terme grec évoque une parole franche, ouverte et sans détour.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: ouvertement
  rationale: Le nom au datif a ici une valeur adverbiale et exprime une parole franche, claire et sans dissimulation. « Ouvertement » rend naturellement cette idée, tandis que la note conserve les nuances possibles de clarté et d’assurance.
- source_word: τὸν λόγον
  choice: de cela
  rationale: L’expression renvoie au contenu de l’annonce précédente de Jésus. En français moderne, « il parlait de cela » est plus naturel que le calque « il parlait la parole » et maintient clairement le lien discursif sans ajouter « message » au texte.
- source_word: ἐλάλει
  choice: il parlait
  rationale: L’imparfait grec présente l’action en cours. L’imparfait français en restitue naturellement l’aspect progressif.
- source_word: προσλαβόμενος
  choice: le prit à part
  rationale: Dans ce contexte, le participe indique que Pierre emmène Jésus à l’écart pour s’adresser à lui. « Prendre à part » est l’expression française idiomatique correspondante.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: se mit à lui faire des reproches
  rationale: « Se mit à » restitue le commencement exprimé par ἤρξατο. Dans cette relation humaine, « faire des reproches » exprime une vive réprimande de manière naturelle; le même verbe grec peut recevoir d’autres équivalents selon son contexte.
theological_decisions:
- issue: Portée de παρρησίᾳ dans l’annonce de la souffrance de Jésus
  choice: « ouvertement » souligne qu’il en parlait avec franchise et sans rien dissimuler
  alternative: « clairement » ou « avec assurance »
  rationale: Le choix conserve l’accent narratif sur le caractère explicite et franc de l’enseignement, qui éclaire la réaction directe de Pierre, sans décider si l’idée dominante est uniquement la clarté, la publicité ou l’assurance.
- issue: Force de la réaction de Pierre exprimée par ἐπιτιμᾶν
  choice: « lui faire des reproches »
  alternative: « le réprimander » ou « lui adresser de vifs reproches »
  rationale: La formulation garde le caractère déplacé et appuyé de la correction que Pierre tente d’adresser à Jésus, sans durcir davantage le texte ni atténuer la tension narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La première phrase conserve l’imparfait progressif; « de cela » renvoie sans ambiguïté à l’annonce précédente. « Alors » marque naturellement la progression narrative du second καί.
