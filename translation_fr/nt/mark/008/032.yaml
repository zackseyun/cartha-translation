    rationale: Le grec coordonne simplement les propositions. « Et » conserve mieux l’enchaînement narratif sans ajouter de nuance.
  - severity: low
    issue: La note propose « avec assurance » comme alternative à παρρησίᾳ.
    rationale: Cette expression peut être comprise comme une assurance personnelle ; « avec franchise » ou « hardiment » rend plus directement les nuances de parole ouverte et sans détour.
  revised_text: Il parlait de cela ouvertement[a]. Et Pierre le prit à part et se mit à le réprimander.
