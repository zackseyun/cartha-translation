  terminology: « Ouvertement » est défendable pour παρρησίᾳ, avec une note qui préserve les nuances de clarté et de franchise. « De cela » renvoie naturellement au contenu de l’annonce précédente. « Réprimander » rend mieux ἐπιτιμᾶν que « faire des reproches », sans imposer une interprétation doctrinale.
