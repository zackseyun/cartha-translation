  source_fidelity: 'Le sens général est bien rendu : l’imparfait « parlait », l’ouverture/franchise de παρρησίᾳ, l’action de prendre Jésus à part et le début de la réprimande de Pierre sont tous présents. Toutefois, « faire des reproches » affaiblit quelque peu ἐπιτιμᾶν, qui exprime ici une réprimande directe et ferme. « Alors » donne aussi au δεύτερο καί une valeur temporelle ou consécutive plus marquée que le simple enchaînement grec.'
