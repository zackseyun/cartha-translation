id: MRK.8.35
reference: Mark 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: fr
  text: En effet, celui qui voudra sauver sa vie[a] la perdra, mais celui qui perdra sa vie à cause de moi et de l’Évangile la sauvera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « âme » dans tout le verset; le mot grec peut désigner la vie, la personne elle-même ou l’âme selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: vie
  rationale: Dans ce contexte de renoncement à soi et de mise en péril de son existence, « vie » exprime naturellement la personne dans sa vie concrète et préserve le paradoxe. « Âme » reste possible et est signalé en note afin de ne pas réduire la portée sémantique du grec.
- source_word: σῶσαι / σώσει
  choice: sauver / sauvera
  rationale: « Sauver » maintient la reprise verbale, le contraste avec « perdre » et la portée à la fois présente et eschatologique de la parole.
- source_word: ἀπολέσει
  choice: perdra
  rationale: Avec ψυχή pour complément, « perdre » est l’équivalent français le plus direct et conserve le caractère paradoxal de la déclaration sans introduire l’idée plus forte de détruire.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: à cause de moi et de l’Évangile
  rationale: ἕνεκεν indique ici le motif ou la cause. Cette formulation française est naturelle et laisse la même relation porter sur Jésus et sur l’Évangile.
- source_word: εὐαγγέλιον
  choice: Évangile
  rationale: « Évangile » est courant en français biblique moderne, concis et cohérent avec ce motif majeur chez Marc; il signifie la bonne nouvelle proclamée.
- source_word: ὃς ... ὃς
  choice: celui qui ... celui qui
  rationale: Cette tournure rend naturellement en français la portée générale et proverbiale de la construction grecque.
- source_word: θέλῃ
  choice: voudra
  rationale: Le futur français s’accorde naturellement avec la formulation proverbiale en « celui qui » et exprime la volonté visée par le grec.
theological_decisions:
- issue: Sens anthropologique de ψυχή dans la parole paradoxale de Jésus
  choice: Traduire ψυχή par « vie » dans le texte principal
  alternative: Traduire par « âme »
  rationale: Le contexte immédiat concerne le renoncement à soi et la possibilité de perdre sa vie pour Jésus et l’Évangile. « Vie » rend ce sens sans limiter ψυχή à une composante immatérielle de l’être humain; la note conserve l’autre résonance possible.
- issue: Portée de « sauver » et « perdre »
  choice: Conserver le paradoxe sans préciser s’il s’agit exclusivement de la vie présente ou du salut final
  alternative: Expliciter une opposition entre vie terrestre et vie éternelle
  rationale: Le grec laisse à la parole une tension entre l’existence présente, la personne entière et le salut ultime. L’ajout de qualificatifs résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle et les futurs conservent la forme proverbiale du grec. « À cause de » exprime sans lourdeur le motif introduit par ἕνεκεν.
