id: MRK.8.29
reference: Mark 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: fr
  text: 'Et il leur demandait : « Et vous, qui dites-vous que je suis ? » Pierre lui répondit : « Tu es le Messie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: Signale le rendu traditionnel du titre grec ὁ χριστός.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: demandait
  rationale: L’imparfait grec présente la question dans son déroulement et se rend naturellement par l’imparfait français, sans imposer une répétition certaine.
- source_word: Ὑμεῖς δὲ
  choice: Et vous
  rationale: Le pronom exprimé met les disciples en relief, tandis que δέ marque le contraste avec l’opinion des autres évoquée juste avant. « Et vous » restitue ce contraste avec naturel en français.
- source_word: τίνα με λέγετε εἶναι
  choice: qui dites-vous que je suis
  rationale: Cette formulation idiomatique rend la construction grecque à l’accusatif suivi de l’infinitif tout en conservant directement la question sur l’identité de Jésus.
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: Pierre lui répondit
  rationale: Le participe ἀποκριθείς et le présent historique λέγει forment ensemble l’introduction de la réponse. Le passé simple convient au récit français et évite une formulation redondante telle que « ayant répondu, Pierre lui dit ».
- source_word: Σὺ εἶ
  choice: Tu es
  rationale: Le pronom grec explicite porte une certaine insistance. En français, « Tu es » l’exprime naturellement dans cette déclaration, sans surtraduire par « Toi, tu es ».
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός est ici un titre, équivalent grec de « Messie », et non un nom propre. « Le Messie » en communique le sens juif dans un français actuel.
theological_decisions:
- issue: Rendu de Χριστός comme titre
  choice: le Messie
  alternative: le Christ
  rationale: Dans la confession de Pierre, Χριστός désigne l’oint attendu et fonctionne comme un titre. « Le Messie » en traduit le sens, tandis que la formulation traditionnelle « le Christ » est signalée en note sans trancher davantage la portée de cette confession.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse singulière de Pierre à Jésus. L’imparfait « demandait » conserve l’aspect du verbe grec; « Et vous » maintient l’opposition contextuelle sans lourdeur.
