language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: fr
  text: 'Mais Jésus se retourna, regarda ses disciples, puis réprimanda Pierre en disant : « Passe derrière moi, Satan ! Car tu n’as pas en vue ce qui est de Dieu, mais ce qui est humain. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: se retourna
  rationale: Le participe aoriste décrit ici le mouvement physique de Jésus. Le passé simple s’intègre naturellement au récit français.
- source_word: ἰδὼν τοὺς μαθητὰς αὐτοῦ
  choice: regarda ses disciples
  rationale: Dans ce contexte, ἰδών exprime le regard porté sur les disciples. « Regarda » est plus idiomatique que le littéral « vit » tout en préservant leur présence comme motif de la réprimande publique.
- source_word: ἐπετίμησεν Πέτρῳ
  choice: réprimanda Pierre
  rationale: ἐπιτιμάω désigne une réprimande ferme. La construction française directe rend naturellement le datif grec.
- source_word: καὶ λέγει
  choice: puis … en disant
  rationale: Le présent historique grec est transposé au temps narratif français. « Puis » rend la progression sans donner à καί une valeur théologique supplémentaire.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Passe derrière moi
  rationale: La formule commande à Pierre de reprendre une position derrière Jésus. Cette traduction conserve l’image spatiale et la force de l’impératif dans un français actuel.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Le vocatif est conservé par la translittération française usuelle, sans réduire le terme au seul sens commun d’« adversaire ».
- source_word: οὐ φρονεῖς
  choice: tu n’as pas en vue
  rationale: φρονέω concerne l’orientation de la pensée et des préoccupations, non une simple opération intellectuelle. « Avoir en vue » exprime cette disposition sans la surinterpréter.
- source_word: τὰ τοῦ θεοῦ
  choice: ce qui est de Dieu
  rationale: La formulation conserve la portée large de l’expression grecque et évite de la limiter aux « intérêts », aux « pensées » ou à la « volonté » de Dieu.
- source_word: τὰ τῶν ἀνθρώπων
  choice: ce qui est humain
  rationale: ἄνθρωποι désigne ici les êtres humains en général. « Ce qui est humain » forme en français une antithèse claire avec « ce qui est de Dieu » sans introduire une référence exclusive aux hommes de sexe masculin.
theological_decisions:
- issue: Référent de « Satan » dans l’adresse à Pierre
  choice: Jésus réprimande directement Pierre en l’appelant « Satan » dans cette parole.
  alternative: Jésus s’adresserait à Satan comme à une présence distincte derrière Pierre, ou « Satan » signifierait seulement « adversaire ».
  rationale: Le texte nomme Pierre comme destinataire de la réprimande, puis enchaîne avec un vocatif direct. La traduction garde toute la dureté et l’ambiguïté théologique de l’adresse sans affirmer que Pierre est littéralement Satan ni expliquer le mécanisme spirituel en jeu.
- issue: Portée de ἀνθρώπων
  choice: 'L’humanité en général : « ce qui est humain ».'
  alternative: « Ce qui est des hommes » ou « les préoccupations des hommes ».
  rationale: Dans l’opposition avec Dieu, le pluriel ἀνθρώπων est générique. La formulation choisie rend exactement cette portée en français moderne et ne restreint pas indûment l’expression au sexe masculin.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve le contraste ouvert entre ce qui relève de Dieu et ce qui est humain. « Passe derrière moi » privilégie une expression compréhensible tout en maintenant l’image du disciple appelé à suivre Jésus plutôt qu’à se placer devant lui.
