id: MRK.8.10
reference: Mark 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: fr
  text: Aussitôt, il monta dans le bateau avec ses disciples et se rendit dans la région de Dalmanoutha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les régions de Dalmanoutha »; on pourrait aussi traduire « le territoire de Dalmanoutha ».
    reason: Le grec emploie l’expression plurielle τὰ μέρη, qui désigne idiomatiquement une région ou un territoire.
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Rend la valeur temporelle immédiate et le rythme caractéristique du récit de Marc dans un français naturel.
- source_word: ἐμβὰς
  choice: il monta dans
  rationale: Le participe aoriste exprime une action liée au déplacement principal. Une proposition coordonnée est plus naturelle en français que « étant monté », sans altérer la succession des actions.
- source_word: τὸ πλοῖον
  choice: le bateau
  rationale: Dans le contexte du lac de Galilée, « bateau » est le terme moderne approprié; « navire » évoquerait une embarcation trop grande.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: avec ses disciples
  rationale: Rend directement et naturellement l’accompagnement exprimé par μετά avec le génitif.
- source_word: ἦλθεν
  choice: se rendit
  rationale: Dans ce récit de déplacement vers une destination, « se rendit » est idiomatique et précise le mouvement sans imposer le point de vue déictique de « vint ».
- source_word: τὰ μέρη
  choice: la région
  rationale: Le pluriel grec désigne idiomatiquement une zone géographique. Le singulier collectif « la région » est naturel en français, tandis que la note conserve la forme plurielle de l’original.
- source_word: Δαλμανουθά
  choice: Dalmanoutha
  rationale: Translittération française usuelle du nom propre grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La coordination remplace le participe grec afin d’assurer une lecture naturelle tout en conservant l’ordre immédiat des actions.
