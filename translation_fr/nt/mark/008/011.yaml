id: MRK.8.11
reference: Mark 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: fr
  text: Les pharisiens sortirent et se mirent à discuter avec lui. Ils cherchaient à obtenir de lui un signe venu du ciel[a], afin de le mettre à l’épreuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « ciel » peut aussi désigner le ciel visible. Ici, l’expression signifie plus probablement un signe d’origine céleste, c’est-à-dire divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: sortirent
  rationale: L’aoriste de ἐξέρχομαι indique qu’ils entrent dans la scène en sortant d’un lieu que le verset ne précise pas. « Sortirent » reste naturel sans ajouter de point de vue absent du grec.
- source_word: ἤρξαντο συζητεῖν
  choice: se mirent à discuter
  rationale: La tournure rend l’aspect ingressif de ἤρξαντο (« commencèrent à »). Dans ce contexte hostile, « discuter » peut exprimer la controverse sans durcir le texte jusqu’à « se disputer ».
- source_word: αὐτῷ
  choice: avec lui
  rationale: Le datif régi par συζητεῖν désigne l’interlocuteur. Le pronom est conservé, sans introduire le nom de Jésus, absent du grec.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: Ils cherchaient à obtenir de lui
  rationale: Le participe présent décrit une action simultanée à la discussion, et παρά avec le génitif marque la source. Une nouvelle proposition française évite une accumulation de participes tout en conservant le lien logique.
- source_word: σημεῖον
  choice: un signe
  rationale: « Signe » garde la dimension probante ou révélatrice du terme, contrairement à « miracle », qui mettrait surtout l’accent sur le caractère surnaturel.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: venu du ciel
  rationale: Cette formulation conserve l’idée de provenance exprimée par ἀπό et laisse subsister la portée à la fois littérale et théologique de οὐρανός.
- source_word: πειράζοντες αὐτόν
  choice: afin de le mettre à l’épreuve
  rationale: Dans cette confrontation, πειράζω désigne une mise à l’épreuve hostile plutôt qu’une incitation au péché. « Afin de » rend ici la valeur circonstancielle de dessein ou de motivation du participe.
theological_decisions:
- issue: Sens de « venu du ciel » dans la demande d’un signe
  choice: Conserver dans le texte l’expression « venu du ciel », qui suggère une origine ou une autorisation divine sans l’expliciter entièrement
  alternative: Comprendre la demande comme celle d’un signe apparaissant dans le ciel visible
  rationale: Dans le contexte évangélique, la provenance céleste renvoie très probablement à Dieu et à son autorité. La formulation retenue préserve néanmoins l’ambiguïté lexicale réelle de οὐρανός au lieu de la résoudre dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe grecque participiale est répartie en deux phrases pour une lecture naturelle, sans supprimer la simultanéité ni la finalité hostile de la demande.
