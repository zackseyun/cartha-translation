    issue: Le participe aoriste προσκαλεσάμενος est rendu par un présent coordonné (« Jésus appelle »).
    rationale: Le grec indique que Jésus a appelé ses disciples avant de leur parler. Le présent historique de λέγει doit être conservé dans « leur dit », sans transformer nécessairement l’action antérieure du participe en présent.
  - severity: low
    issue: « était de nouveau rassemblée » ajoute une nuance d’assemblage à ὄχλου ὄντος.
    rationale: Le génitif absolu dit qu’une grande foule était présente; il ne décrit pas explicitement son rassemblement. Une formulation existentielle française est plus neutre.
  revised_text: 'En ces jours-là, alors qu’il y avait de nouveau une grande foule et que les gens n’avaient rien à manger, après avoir appelé ses disciples, Jésus leur dit[a] :'
