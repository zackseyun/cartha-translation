  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: fr
  text: 'En ces jours-là, alors qu’il y avait de nouveau une grande foule et que les gens n’avaient rien à manger, après avoir appelé ses disciples, Jésus leur dit[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie le présent : « leur dit ». Marc recourt souvent au présent historique dans son récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: En ces jours-là
  rationale: Expression temporelle française naturelle et digne, qui conserve le cadre narratif sans préciser davantage la durée.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: comme une grande foule était de nouveau rassemblée
  rationale: Rend la circonstance exprimée par le génitif absolu et rattache naturellement πάλιν à la présence renouvelée d’une grande foule.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: et que les gens n’avaient rien à manger
  rationale: Le participe au pluriel renvoie aux membres de la foule. « les gens » explicite ce référent en français et évite de faire de « foule », singulier, le sujet direct d’un pluriel implicite.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: Jésus appelle ses disciples
  rationale: Le nom « Jésus » explicite le sujet implicite requis par le français. « appelle ses disciples » exprime naturellement l’action de les faire venir auprès de lui sans surcharger la nuance du moyen.
- source_word: λέγει αὐτοῖς
  choice: et leur dit
  rationale: Le présent français conserve le présent historique de Marc; « dit » est ici la troisième personne du présent de l’indicatif et non un passé simple.
theological_decisions:
- issue: Présent historique dans le récit de Marc
  choice: Conserver le présent dans « appelle ... et leur dit »
  alternative: 'Employer le passé : « appela ... et leur dit »'
  rationale: Le grec passe du participe aoriste au présent historique λέγει. Le présent narratif français permet de préserver la vivacité stylistique de Marc sans incidence doctrinale.
translation_notes:
  register: Français international moderne, courant et digne. La phrase reste ouverte par les deux-points, puisque les paroles de Jésus commencent au verset suivant. Le présent narratif est maintenu de façon idiomatique.
