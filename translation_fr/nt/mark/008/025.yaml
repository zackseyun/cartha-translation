  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: fr
  text: Puis Jésus posa de nouveau les mains sur ses yeux[a]. L’homme vit clairement, sa vue fut rétablie, et il voyait tout distinctement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits présentent une formulation différente, reflétée dans des traductions telles que : « il regarda attentivement, sa vue fut rétablie et il vit tout clairement ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « il pouvait tout voir clairement ». Le dernier membre de phrase associe un verbe à l’imparfait à un adverbe exprimant une vision nette ou distincte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Puis … de nouveau
  rationale: « Puis » marque la succession et « de nouveau » la répétition de l’action, dans un français narratif naturel.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: Jésus posa … les mains sur ses yeux
  rationale: Cette formulation conserve le geste concret et le pluriel « les mains »; le nom « Jésus » clarifie naturellement le sujet en français sans ajouter d’interprétation.
- source_word: διέβλεψεν
  choice: L’homme vit clairement
  rationale: διαβλέπω exprime ici la vision devenue claire. Ce choix convient au passage d’une perception partielle à une vision complète et évite d’introduire l’idée de regarder fixement.
- source_word: ἀπεκατέστη
  choice: sa vue fut rétablie
  rationale: Le verbe signifie le rétablissement dans un état normal. L’explicitation de « sa vue », évidente dans le contexte, produit un français plus naturel que « il fut rétabli » sans surinterpréter la guérison.
- source_word: ἐνέβλεπεν
  choice: il voyait
  rationale: L’imparfait français rend naturellement l’aspect imperfectif grec et présente la vision comme l’état durable résultant du rétablissement.
- source_word: τηλαυγῶς
  choice: distinctement
  rationale: L’adverbe évoque une vision nette, éventuellement à distance. « Distinctement » préserve cette nuance et évite de répéter « clairement ».
- source_word: ἅπαντα
  choice: tout
  rationale: Le neutre pluriel a ici le sens global de « tout »; cette formulation est concise et idiomatique en français.
theological_decisions:
- issue: Présentation narrative de la guérison en deux étapes
  choice: Conserver la progression « vit clairement / fut rétablie / voyait » et l’imparfait final.
  alternative: Fondre les trois verbes en un seul constat de guérison complète au passé composé.
  rationale: La succession verbale grecque, notamment l’imparfait ἐνέβλεπεν après les aoristes, dépeint une progression puis un état résultant. La traduction maintient cette tension narrative sans expliquer pourquoi la guérison se déroule en deux étapes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée en trois propositions pour éviter l’ambiguïté de « il » entre Jésus et l’homme guéri. Les deux marqueurs de note figurent dans le texte.
