  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: fr
  text: Il ordonna à la foule de s’installer par terre[a]. Puis il prit les sept pains, rendit grâce, les rompit et les donnait à ses disciples pour qu’ils les placent devant la foule[b]. Et ils les placèrent devant elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de s’allonger par terre ». Le verbe grec évoque plus précisément la position prise pour manger.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’ils les servent à la foule ». Le grec signifie littéralement « placer devant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: ordonna
  rationale: Le verbe exprime une directive investie d’autorité. « Ordonna » est naturel dans ce récit et conserve cette force; le présent historique grec est rendu au passé simple pour la narration française.
- source_word: ἀναπεσεῖν
  choice: de s’installer
  rationale: Le verbe désigne ici le fait de prendre place, plus précisément de s’étendre ou de s’allonger pour manger. « S’installer » reste naturel en français moderne, tandis que la note conserve la nuance propre au repas.
- source_word: ἐπὶ τῆς γῆς
  choice: par terre
  rationale: Dans ce contexte, γῆ désigne le sol sur lequel la foule prend place. « Par terre » est l’expression française la plus idiomatique.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: il prit les sept pains
  rationale: ἄρτοι désigne ici des pains dans le contexte du repas. Une proposition verbale coordonnée est plus naturelle en français qu’un participe calqué sur le grec.
- source_word: εὐχαριστήσας
  choice: rendit grâce
  rationale: Cette formulation française traditionnelle mais toujours compréhensible exprime l’action de remercier sans ajouter explicitement un destinataire absent du grec.
- source_word: ἔκλασεν
  choice: les rompit
  rationale: Le pronom reprend clairement les sept pains; « rompre le pain » est précis, digne et naturel dans le registre biblique.
- source_word: ἐδίδου
  choice: les donna progressivement
  rationale: L’imparfait grec présente une action en cours ou répétée. « Progressivement » rend cette distribution successive sans alourdir la phrase par une périphrase.
- source_word: ἵνα παρατιθῶσιν
  choice: pour qu’ils les placent devant la foule
  rationale: La traduction conserve l’image concrète de παρατίθημι, qui consiste à placer de la nourriture devant quelqu’un, tout en laissant « servir » comme solution plus idiomatique en note.
- source_word: παρέθηκαν
  choice: ils les placèrent devant elle
  rationale: Le passé simple rend l’action accomplie de l’aoriste. La reprise lexicale de « placer devant » reflète celle du grec, et « elle » évite une répétition française trop lourde.
- source_word: ὄχλος
  choice: foule
  rationale: « Foule » est le terme courant et précis pour le groupe nombreux présent dans la scène.
theological_decisions:
- issue: Séquence narrative et possible résonance eucharistique
  choice: « rendit grâce » sans vocabulaire sacramentel ajouté
  alternative: Expliciter « il remercia Dieu » ou employer une formulation expressément eucharistique
  rationale: Le grec décrit l’action de rendre grâce sur la nourriture sans nommer explicitement son destinataire ni développer une doctrine sacramentelle. La traduction préserve donc la formulation et ses éventuelles résonances sans les imposer.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; les formulations restent accessibles. Les notes préservent les nuances concrètes des verbes grecs sans rendre le corps du texte artificiel.
