id: MRK.8.3
reference: Mark 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: fr
  text: Et si je les renvoie chez eux sans avoir mangé, ils vont défaillir en chemin, et certains d’entre eux sont venus de loin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσω
  choice: je les renvoie
  rationale: Dans le contexte du renvoi de la foule, « renvoyer » exprime naturellement l’action de les laisser repartir, sans suggérer une libération de captivité.
- source_word: νήστεις
  choice: sans avoir mangé
  rationale: Le terme désigne ici l’état de personnes privées de nourriture, plutôt qu’un jeûne religieux volontaire. Cette formulation est claire et idiomatique en français.
- source_word: εἰς οἶκον αὐτῶν
  choice: chez eux
  rationale: 'Cette expression rend naturellement en français la valeur distributive : chacun retourne à son domicile.'
- source_word: ἐκλυθήσονται
  choice: ils vont défaillir
  rationale: Le verbe évoque l’affaiblissement ou l’épuisement physique en cours de route. « Défaillir » préserve cette portée sans imposer nécessairement une perte de connaissance complète.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: Formulation française courante pour désigner ce qui se produit au cours du trajet.
- source_word: καί τινες αὐτῶν
  choice: car certains d’entre eux
  rationale: Bien que καί soit normalement coordinatif, le second membre explique ici pourquoi Jésus craint qu’ils ne défaillent. « Car » explicite cette relation contextuelle naturelle.
- source_word: ἀπὸ μακρόθεν
  choice: de loin
  rationale: Expression concise et idiomatique indiquant la grande distance parcourue.
- source_word: ἥκασιν
  choice: sont venus
  rationale: Le passé composé français rend naturellement le parfait grec et la situation présente résultant de leur venue.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de la structure grecque tout en évitant le calque « à leur maison ». « Sans avoir mangé » écarte à juste titre l’idée d’un jeûne religieux volontaire.
