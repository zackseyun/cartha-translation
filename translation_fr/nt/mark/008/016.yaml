  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: fr
  text: Et ils se disaient entre eux qu’ils n’avaient pas de pain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « qu’ils n’avaient pas de pains » ou « de galettes ». Le grec emploie le pluriel.'
    reason: Le français utilise naturellement « pain » comme nom collectif dans ce contexte, tandis que la note conserve le pluriel concret du grec.
lexical_decisions:
- source_word: διελογίζοντο
  choice: discutaient
  rationale: L’imparfait exprime une discussion en cours. « Discutaient » est naturel en français moderne et convient au caractère réciproque de l’échange, sans imposer l’idée d’une dispute.
- source_word: πρὸς ἀλλήλους
  choice: entre eux
  rationale: Cette expression réciproque indique que les disciples échangeaient les uns avec les autres. « Entre eux » est idiomatique et concis.
- source_word: ὅτι
  choice: du fait que
  rationale: ὅτι introduit ici le contenu ou le sujet de leur discussion, plutôt qu’une cause. « Du fait que » évite la lecture causale que pourrait suggérer « parce que ».
- source_word: ἄρτους
  choice: pains
  rationale: Le pluriel « pains » conserve le dénombrement concret des pains dans le contexte immédiat du récit. En français biblique courant, « avoir des pains » demeure compréhensible, bien que « pain » au singulier collectif soit plus idiomatique dans certains contextes.
- source_word: οὐκ ἔχουσιν
  choice: ils n’avaient pas
  rationale: Le présent grec dans le discours indirect est rendu par l’imparfait conformément au cadre narratif passé et à l’usage naturel du français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le pluriel concret « pains », important dans le contexte des pains comptés, tout en signalant en note l’expression collective plus courante.
