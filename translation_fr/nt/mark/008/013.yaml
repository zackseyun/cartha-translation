  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: fr
  text: Puis il les quitta[a], remonta dans le bateau et partit pour l’autre rive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Puis, après les avoir quittés, il monta de nouveau dans le bateau et partit pour l’autre rive. » Le mot grec rendu par « remonta » peut aussi être traduit par « de nouveau ».'
    reason: alternative lexicale de πάλιν
lexical_decisions:
- source_word: ἀφεὶς
  choice: laissa
  rationale: Le participe aoriste exprime ici le fait de quitter les personnes présentes. La coordination française rend naturellement l’enchaînement avec le verbe principal.
- source_word: αὐτοὺς
  choice: les
  rationale: Le pronom renvoie aux pharisiens du contexte immédiat.
- source_word: πάλιν
  choice: remonta
  rationale: Dans ce contexte de déplacement, πάλιν peut marquer un retour. L’idée est intégrée idiomatiquement au verbe « remonta », tout en signalant en note l’autre rattachement possible.
- source_word: ἐμβὰς
  choice: dans le bateau
  rationale: Le participe signifie entrer ou monter à bord. Le bateau, implicite dans le grec, est clairement fourni par le contexte narratif.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: Le verbe indique le départ; « partit » est naturel et conserve cette nuance mieux qu’un simple « alla ».
- source_word: εἰς τὸ πέραν
  choice: vers l’autre rive
  rationale: L’expression désigne l’autre côté du lac. « L’autre rive » est idiomatique en français et convient au cadre géographique.
