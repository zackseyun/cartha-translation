revisions:
- from: 'Après avoir appelé la foule avec ses disciples, il leur dit : « Si quelqu’un veut venir à ma suite, qu’il renonce à lui-même, qu’il se charge de sa croix[a] et qu’il me suive. »'
  to: 'Après avoir appelé la foule ainsi que ses disciples, il leur dit : « Si quelqu’un veut venir à ma suite, qu’il renonce à lui-même, qu’il prenne sa croix[a] et qu’il me suive. »'
  rationale: La révision clarifie que Jésus appelle à lui la foule et ses disciples, conformément à la construction grecque. Elle remplace aussi une expression française plus idiomatique par « prendre sa croix », qui reflète plus directement ἀράτω tout en conservant l’image littérale de σταυρός. Les autres formulations sont maintenues, car elles sont fidèles, naturelles et de registre approprié.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:50:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle au grec : Jésus convoque la foule et ses disciples, puis formule une condition générale suivie de trois impératifs. Toutefois, « la foule avec ses disciples » peut laisser entendre que seuls les disciples accompagnent la foule, plutôt que d’indiquer clairement que les deux groupes sont convoqués. « Prendre sa croix » rend plus directement ἀράτω τὸν σταυρὸν αὐτοῦ que l’expression idiomatique « se charger de sa croix », laquelle peut plus facilement évoquer un fardeau au sens figuré.'
  naturalness: La phrase est naturelle et de registre moderne. « Après avoir appelé la foule ainsi que ses disciples » clarifie l’articulation des destinataires sans lourdeur. « Prendre sa croix » est une formulation française usuelle, précise et adaptée au registre du passage.
  terminology: « Venir à ma suite », « renoncer à lui-même », « croix » et « me suivre » sont appropriés. La révision conserve la distinction utile entre ὀπίσω μου ἐλθεῖν et ἀκολουθείτω μοι, sans imposer d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: Ambiguïté de « la foule avec ses disciples »
    rationale: Dans τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ, σύν associe la foule et les disciples comme personnes convoquées. En français, « appeler la foule avec ses disciples » peut se lire comme si les disciples étaient simplement avec la foule. « La foule ainsi que ses disciples » rend explicitement les deux groupes.
  - severity: low
    issue: « Se charger de sa croix » est moins littéral que « prendre sa croix »
    rationale: ἀράτω signifie ici « qu’il prenne / qu’il soulève ». Bien que l’expression proposée soit recevable, elle peut orienter vers l’idée figurée d’un fardeau. « Prendre sa croix » maintient plus nettement l’image verbale et historique du texte.
  revised_text: 'Après avoir appelé la foule ainsi que ses disciples, il leur dit : « Si quelqu’un veut venir à ma suite, qu’il renonce à lui-même, qu’il prenne sa croix[a] et qu’il me suive. »'
  revised_footnotes:
  - marker: a
    text: L’expression « prendre sa croix » conserve l’image concrète de la croix, instrument romain d’exécution, au lieu de la réduire au simple fait de supporter une difficulté.
    reason: cultural_note
  revision_rationale: La révision clarifie que Jésus appelle à lui la foule et ses disciples, conformément à la construction grecque. Elle remplace aussi une expression française plus idiomatique par « prendre sa croix », qui reflète plus directement ἀράτω tout en conservant l’image littérale de σταυρός. Les autres formulations sont maintenues, car elles sont fidèles, naturelles et de registre approprié.
