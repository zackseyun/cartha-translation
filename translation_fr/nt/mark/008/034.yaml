source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: fr
  text: 'Après avoir appelé la foule ainsi que ses disciples, il leur dit : « Si quelqu’un veut venir à ma suite, qu’il renonce à lui-même, qu’il prenne sa croix[a] et qu’il me suive. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « prendre sa croix » conserve l’image concrète de la croix, instrument romain d’exécution, au lieu de la réduire au simple fait de supporter une difficulté.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Après avoir appelé
  rationale: Le participe aoriste indique une action préalable au verbe principal. Cette tournure rend naturellement la succession des actions sans alourdir la phrase.
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: la foule avec ses disciples
  rationale: Cette formulation conserve l’accompagnement exprimé par σύν et indique que la foule et les disciples sont ensemble lorsque Jésus leur parle.
- source_word: Εἴ τις θέλει
  choice: Si quelqu’un veut
  rationale: La construction conditionnelle ouvre l’appel à toute personne, et « veut » est direct et naturel en français moderne.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: venir à ma suite
  rationale: Cette expression française conserve l’image de se placer derrière Jésus tout en exprimant naturellement l’entrée dans la condition de disciple. Elle permet de distinguer cette proposition du commandement final « qu’il me suive ».
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: qu’il renonce à lui-même
  rationale: Le subjonctif à valeur impérative rend le commandement grec à la troisième personne. « Renoncer à lui-même » exprime le rejet de la primauté de soi, plus justement qu’une idée limitée de privation personnelle.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: qu’il se charge de sa croix
  rationale: Cette tournure française idiomatique maintient l’image concrète de prendre sa propre croix sans la réduire à une difficulté ou à un fardeau quelconque.
- source_word: ἀκολουθείτω μοι
  choice: qu’il me suive
  rationale: Le subjonctif à valeur impérative restitue clairement le commandement. Le contexte de la vie de disciple porte naturellement la nuance continue du présent grec.
theological_decisions:
- issue: Force des exigences liées à la condition de disciple
  choice: 'Un appel général introduit par « Si quelqu’un veut », suivi de trois commandements : renoncer à soi-même, se charger de sa croix et suivre Jésus.'
  alternative: Employer une formulation répétée avec « doit » pour chacun des commandements.
  rationale: Le grec associe une condition ouverte à des impératifs à la troisième personne. La traduction préserve à la fois le caractère volontaire de la démarche initiale et la force contraignante des exigences qui suivent.
- issue: Sens de σταυρός dans ce contexte
  choice: Conserver littéralement « croix ».
  alternative: Paraphraser par « souffrance », « fardeau » ou « mise à mort ».
  rationale: L’image renvoie concrètement à la croix romaine tout en recevant ici une portée liée à la condition de disciple. Une paraphrase réduirait la tension et la richesse de l’image grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure conditionnelle et les trois injonctions du grec. « Venir à ma suite » évite de répéter immédiatement « suivre » tout en préservant la métaphore du disciple placé derrière son maître.
