  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: fr
  text: En effet, que pourrait donner une personne en échange de sa vie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme » ; le mot grec peut désigner la vie, la personne elle-même ou l’âme, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: En effet, que
  rationale: τί introduit la question, tandis que γάρ relie cette question à l’affirmation précédente avec une valeur explicative. « En effet » rend naturellement ce lien en français.
- source_word: δοῖ
  choice: pourrait donner
  rationale: L’aoriste subjonctif de δίδωμι apparaît dans une question rhétorique. Le conditionnel « pourrait donner » exprime ici la possibilité envisagée tout en conservant la force interrogative.
- source_word: ἄνθρωπος
  choice: une personne
  rationale: Bien que le nom grec soit grammaticalement masculin singulier, il a ici une portée générique. « Une personne » est naturel en français moderne et inclut clairement tout être humain sans modifier le référent.
- source_word: ἀντάλλαγμα
  choice: en échange de
  rationale: Le nom désigne ce qui est donné en retour ou comme contrepartie. La locution « en échange de » restitue idiomatiquement ce sens après « donner ».
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: de sa vie
  rationale: Dans Marc 8.35-37, ψυχή désigne la vie et, plus largement, la personne elle-même. « Sa vie » assure la cohérence avec le contexte immédiat, tandis qu’une note conserve les autres nuances possibles.
theological_decisions:
- issue: Sens de ψυχή dans une parole concernant le salut et la perte de soi
  choice: vie
  alternative: âme ; personne elle-même
  rationale: Le contexte met en contraste le gain du monde entier et la perte de la ψυχή. « Vie » convient au fil du passage, mais le mot grec peut embrasser l’être personnel dans sa totalité et recevoir la traduction « âme ». La note préserve cette profondeur sans imposer une distinction anthropologique particulière.
translation_notes:
  register: Français international moderne, digne et direct. La question rhétorique reste concise. « Une personne » rend la portée générique de ἄνθρωπος, et la note maintient l’ambiguïté sémantique de ψυχή.
