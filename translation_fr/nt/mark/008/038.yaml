id: MRK.8.38
reference: Mark 8:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: fr
  text: En effet, si quelqu’un a honte de moi et de mes paroles dans cette génération adultère et pécheresse[a], le Fils de l’homme aura lui aussi honte de lui quand il viendra dans la gloire de son Père avec les saints anges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « infidèle et pécheresse ». « Adultère » est conservé dans le texte, car le grec emploie cette métaphore concrète, fréquente chez les prophètes, pour parler de l’infidélité envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: a honte de / aura lui aussi honte de
  rationale: Cette formulation naturelle conserve le sens de honte éprouvée ou manifestée à l’égard d’une personne et maintient la réciprocité entre la réaction humaine présente et celle, future, du Fils de l’homme.
- source_word: λόγους
  choice: paroles
  rationale: Le pluriel français reflète le pluriel grec et préserve l’accent personnel et verbal, sans réduire l’expression au sens plus interprétatif de « message ».
- source_word: γενεᾷ
  choice: génération
  rationale: C’est l’équivalent direct et usuel; il désigne ici la communauté humaine présente caractérisée moralement, sans imposer l’abstraction temporelle de « époque ».
- source_word: μοιχαλίδι
  choice: adultère
  rationale: Le terme concret du grec est conservé afin de préserver la métaphore prophétique de l’infidélité spirituelle et morale.
- source_word: ἁμαρτωλῷ
  choice: pécheresse
  rationale: Équivalent adjectival direct, accordé avec « génération », qui n’ajoute pas l’intensité éventuelle de « perverse ».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: La traduction consacrée préserve le titre christologique ainsi que ses résonances bibliques et eschatologiques.
- source_word: δόξῃ
  choice: gloire
  rationale: Terme biblique courant qui conserve à la fois les notions d’honneur, de majesté et de rayonnement divins.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: avec les saints anges
  rationale: Rend naturellement la construction attributive grecque sans ajouter le possessif « ses », absent du texte source.
- source_word: ὃς γὰρ ἐὰν
  choice: En effet, si quelqu’un
  rationale: Cette tournure française exprime clairement la condition générale et rend la valeur explicative de γάρ; elle est plus idiomatique que « car quiconque » dans ce contexte.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: au milieu de cette ... génération
  rationale: La formulation indique naturellement le cadre social et moral dans lequel la honte est manifestée, tout en restant proche de la préposition grecque.
- source_word: αὐτόν
  choice: cette personne
  rationale: Le référent est le « quelqu’un » générique. Cette reprise singulière est claire en français et évite un masculin qui pourrait sembler limiter la portée universelle de l’énoncé, sans passer au pluriel.
theological_decisions:
- issue: Force métaphorique de « adultère »
  choice: Conserver « adultère » dans le texte principal comme métaphore prophétique de l’infidélité spirituelle et morale.
  alternative: Traduire par « infidèle » afin d’expliciter immédiatement la métaphore.
  rationale: Le grec emploie le terme concret μοιχαλίδι, qui fait écho au langage prophétique de l’infidélité envers Dieu. Garder l’image préserve la profondeur intertextuelle sans surinterpréter.
- issue: Référence du « Fils de l’homme »
  choice: Maintenir le titre « le Fils de l’homme ».
  alternative: Remplacer le titre par « je » ou « le Messie ».
  rationale: Le grec présente un titre christologique distinct, chargé d’une portée eschatologique. Le remplacer résoudrait ou aplatirait une tension que le texte conserve.
- issue: Reprise du singulier générique αὐτόν
  choice: Employer « cette personne » au singulier.
  alternative: Employer « lui », « cet homme » ou passer au pluriel avec « eux ».
  rationale: Cette solution maintient le singulier et la portée générique de la construction grecque, sans laisser entendre que l’avertissement ne viserait que les hommes ni modifier le nombre grammatical.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle, la réciprocité du verbe « avoir honte », le titre « Fils de l’homme » et la métaphore prophétique. « Cette personne » assure une reprise singulière naturelle et générique.
