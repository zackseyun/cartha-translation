source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: fr
  text: 'Levant les yeux, il disait : « Je vois les gens, car je les vois comme des arbres qui marchent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: Levant les yeux
  rationale: Rend naturellement le participe aoriste; le verbe peut aussi évoquer le recouvrement de la vue dans ce contexte, mais le geste de regarder vers le haut reste une lecture directe.
- source_word: ἔλεγεν
  choice: il disait
  rationale: Conserve l’imparfait grec, qui présente la parole en cours plutôt que comme un simple événement ponctuel.
- source_word: τοὺς ἀνθρώπους
  choice: les gens
  rationale: Désigne ici des personnes en général; « les gens » est idiomatique en français moderne.
- source_word: ὅτι
  choice: car
  rationale: Préserve la relation explicative introduite par ὅτι sans la rendre artificiellement causale.
- source_word: ὡς δένδρα ὁρῶ περιπατοῦντας
  choice: je les vois marcher comme des arbres
  rationale: Reproduit la perception encore confuse de l’homme tout en donnant une phrase française naturelle; le pronom « les » explicite que ce sont les gens qui marchent.
theological_decisions:
- issue: Caractère progressif de la guérison
  choice: Conserver la description concrète et confuse de la vision intermédiaire
  alternative: Reformuler pour expliquer explicitement que sa vue n’était que partiellement rétablie
  rationale: Le verset montre cet état par l’image des personnes ressemblant à des arbres; il n’appartient pas à la traduction d’ajouter une explication doctrinale ou médicale.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe légèrement répétitive de la parole est conservée afin de refléter le témoignage immédiat et hésitant de l’homme.
