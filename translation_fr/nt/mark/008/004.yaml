  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: fr
  text: 'Ses disciples lui répondirent : « D’où quelqu’un pourra-t-il obtenir assez de pain pour rassasier ces gens ici, dans un lieu désert ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: répondirent
  rationale: Verbe narratif courant de réponse, rendu directement et naturellement en français.
- source_word: ὅτι
  choice: ponctuation du discours direct
  rationale: Après le verbe de réponse, ὅτι introduit ici les paroles citées ; le français naturel emploie les deux-points et les guillemets.
- source_word: Πόθεν
  choice: D’où
  rationale: Préserve la question portant littéralement sur la provenance ou la source du pain.
- source_word: τούτους
  choice: ces gens
  rationale: Explicite naturellement le référent collectif sans le limiter aux hommes.
- source_word: δυνήσεταί τις
  choice: pourrait-on
  rationale: Exprime de façon idiomatique la possibilité envisagée dans cette question rhétorique ; la tournure française au conditionnel convient mieux ici qu’un futur littéral.
- source_word: ὧδε
  choice: ici
  rationale: Équivalent locatif simple et direct.
- source_word: χορτάσαι
  choice: rassasier
  rationale: Rend précisément l’idée de donner à manger jusqu’à satiété, plutôt que le simple fait de nourrir.
- source_word: ἄρτων
  choice: assez de pain
  rationale: « Pain » correspond au terme source ; « assez de » est exigé en français par la construction naturelle avec « rassasier » et explicite la quantité suffisante impliquée.
- source_word: ἐπ’ ἐρημίας
  choice: dans un lieu désert
  rationale: Restitue le cadre inhabité et isolé sans imposer l’image plus spécifique d’un désert aride.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la question de provenance exprimée par Πόθεν, tout en évitant une construction française maladroite comme « D’où quelqu’un pourra-t-il rassasier… avec du pain ? ».
