  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: fr
  text: 'Il leur demanda : « Combien de pains avez-vous ? » Ils répondirent : « Sept. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Il
  rationale: Le simple lien narratif est naturellement porté en français par l’enchaînement de la phrase; traduire systématiquement καί par « et » alourdirait ici le récit.
- source_word: ἠρώτα
  choice: demanda
  rationale: L’imparfait grec peut décrire une action en cours, mais le passé simple convient naturellement à cette question ponctuelle dans un récit français.
- source_word: αὐτούς
  choice: leur
  rationale: Avec le verbe français « demander », les personnes interrogées sont normalement exprimées par le pronom complément indirect « leur ».
- source_word: Πόσους
  choice: Combien de
  rationale: C’est la tournure interrogative française naturelle pour demander le nombre d’objets dénombrables.
- source_word: ἔχετε
  choice: avez-vous
  rationale: Le présent grec à la deuxième personne du pluriel est rendu directement par une interrogation française avec inversion.
- source_word: ἄρτους
  choice: pains
  rationale: Dans ce contexte de dénombrement, le pluriel désigne des pains entiers ou unités de pain, non la substance indénombrable « du pain ».
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Bien que εἶπαν signifie littéralement « dirent », « répondirent » exprime naturellement en français la réplique à une question; δέ est porté par la transition sans conjonction explicite.
- source_word: Ἑπτά
  choice: Sept
  rationale: Le nombre cardinal est rendu directement.
