source:
  edition: SBLGNT
  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: fr
  text: Ils mangèrent et furent rassasiés, puis ils ramassèrent sept corbeilles[a] de morceaux qui restaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec σπυρίδες désigne des corbeilles, probablement de grandes corbeilles. Marc emploie un autre mot pour les paniers lors du repas des cinq mille (κόφινοι, 6.43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ils mangèrent
  rationale: L’aoriste de ἐσθίω exprime simplement l’action de manger dans le récit, sans insistance supplémentaire.
- source_word: ἐχορτάσθησαν
  choice: furent rassasiés
  rationale: Le verbe indique qu’ils mangèrent suffisamment, jusqu’à satiété. « Furent rassasiés » est naturel, digne et conserve l’idée d’une pleine suffisance.
- source_word: ἦραν
  choice: ils ramassèrent
  rationale: Dans le contexte de la collecte des restes, « ramassèrent » rend naturellement l’action de prendre et de recueillir ce qui restait.
- source_word: περισσεύματα
  choice: qui restaient
  rationale: Le nom désigne ce qui subsistait en surplus après le repas. La proposition relative donne en français une formulation claire et idiomatique.
- source_word: κλασμάτων
  choice: morceaux
  rationale: κλάσματα désigne des morceaux rompus, vraisemblablement de pain ou de nourriture. « Morceaux » est courant et n’ajoute pas un référent que le grec ne précise pas ici.
- source_word: ἑπτὰ σπυρίδας
  choice: sept corbeilles
  rationale: σπυρίς désigne une corbeille ou un grand panier et se distingue du κόφινος employé en Marc 6.43. « Corbeilles » maintient discrètement cette distinction lexicale, complétée par la note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination grecque répétée est légèrement fluidifiée par « puis », sans modifier la succession des actions. Le marqueur de note est placé après « corbeilles », terme auquel la note se rapporte.
