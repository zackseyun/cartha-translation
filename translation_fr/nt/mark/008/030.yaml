source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: fr
  text: Et il leur ordonna sévèrement de ne parler de lui à personne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il les réprimanda » ou « il leur donna un ordre strict ».
    reason: 'Alternative lexicale : ἐπιτιμάω peut signifier « réprimander » ; dans ce contexte, le verbe introduit une interdiction ferme.'
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: recommanda sévèrement
  rationale: Le verbe peut signifier « réprimander », mais il exprime ici un ordre ferme adressé aux disciples. « Recommanda sévèrement » restitue cette force sans suggérer nécessairement qu’il leur reproche une faute.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif pluriel renvoie aux disciples dans le contexte immédiat.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: de ne parler … à personne
  rationale: Après un verbe exprimant une injonction, ἵνα avec le subjonctif donne le contenu de l’ordre. Cette construction infinitive est naturelle en français moderne.
- source_word: μηδενὶ
  choice: à personne
  rationale: Le datif de μηδείς désigne ici le destinataire auquel rien ne doit être dit.
- source_word: λέγωσιν
  choice: parler
  rationale: Avec περί et le génitif, λέγω signifie ici parler au sujet de quelqu’un. « Parler de lui à personne » est idiomatique dans cette phrase négative.
- source_word: περὶ αὐτοῦ
  choice: de lui
  rationale: περί avec le génitif signifie « au sujet de » ou « concernant » ; « de lui » est naturel et précis en français.
theological_decisions:
- issue: Force de l’ordre de Jésus dans le contexte du secret entourant son identité
  choice: Exprimer une injonction ferme à ne rien divulguer, sans expliquer pourquoi Jésus impose ce silence.
  alternative: « Il les réprimanda » ou « il leur ordonna strictement »
  rationale: Le texte présente clairement une interdiction énergique, mais n’en expose pas ici le motif. La traduction conserve cette tension sans y intégrer une théorie interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Recommanda sévèrement » conserve la force de l’original tout en évitant l’ambiguïté moderne de « avertit », qui pourrait surtout évoquer l’annonce d’un danger.
