source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: fr
  text: 'Poussant un profond soupir en son esprit, il dit : « Pourquoi cette génération cherche-t-elle un signe ? Amen, je vous le dis, aucun signe ne sera donné à cette génération.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « s’il est donné un signe à cette génération » ; il s’agit d’une formule de serment qui signifie qu’aucun signe ne sera donné à cette génération.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: Poussant un profond soupir
  rationale: Le verbe renforcé exprime un soupir profond, voire un gémissement. Cette tournure naturelle en français conserve son intensité sans la dramatiser à l’excès.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: en son esprit
  rationale: Le datif indique ici la sphère dans laquelle se produit le soupir. « En son esprit » préserve le vocabulaire anthropologique du grec plutôt que de le réduire à « intérieurement ».
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique grec est rendu par le présent français, ce qui conserve la vivacité narrative caractéristique de Marc.
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette construction interrogative, τί porte naturellement le sens de « pourquoi ».
- source_word: γενεὰ
  choice: génération
  rationale: Ce terme conserve à la fois la portée collective et la nuance temporelle du grec.
- source_word: ζητεῖ
  choice: cherche
  rationale: « Chercher » est l’équivalent direct et n’accentue pas indûment l’idée en parlant d’une exigence, même si le contexte est conflictuel.
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » conserve la portée théologique possible d’un acte servant d’attestation, sans ajouter explicitement « miraculeux ».
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Cette formulation préserve le mot solennel ἀμήν et reste claire dans un français biblique moderne et digne.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: aucun signe ne sera donné à cette génération
  rationale: La proposition introduite par εἰ relève d’une formule de serment sémitique elliptique et exprime ici une négation catégorique. Une traduction littérale avec « si » serait obscure en français.
theological_decisions:
- issue: Interprétation de la proposition de serment introduite par εἰ après ἀμὴν λέγω ὑμῖν
  choice: 'Rendre explicitement la négation : « aucun signe ne sera donné à cette génération »'
  alternative: « si un signe sera donné à cette génération »
  rationale: Le grec conserve une formule de serment elliptique dont l’effet pragmatique est une forte négation. La traduction explicite le sens sans atténuer la solennité ni créer une condition ambiguë en français.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif de Marc est conservé. « Amen » maintient la forme solennelle propre aux paroles de Jésus, tandis que la note rend visible la formulation grecque inhabituelle derrière la négation explicite.
