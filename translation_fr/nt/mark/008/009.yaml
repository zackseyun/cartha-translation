  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: fr
  text: Ils étaient environ quatre mille, et il les renvoya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les congédia ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: Ils étaient
  rationale: La tournure reprend naturellement en français le groupe déjà présent dans le contexte, sans ajouter un nom absent du texte grec.
- source_word: δὲ
  choice: ','
  rationale: Cette particule de liaison légère est rendue par l’enchaînement de la phrase et la ponctuation, sans introduire un marqueur temporel trop appuyé.
- source_word: ὡς
  choice: environ
  rationale: Devant un nombre, ὡς indique une approximation.
- source_word: τετρακισχίλιοι
  choice: quatre mille
  rationale: Le numéral indique l’effectif approximatif du groupe; aucun nom explicatif n’est ajouté.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement le dénombrement et le renvoi de la foule.
- source_word: ἀπέλυσεν
  choice: renvoya
  rationale: Dans ce contexte, ἀπολύω signifie faire partir ou congédier les personnes rassemblées; « renvoya » est naturel et clair.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom reprend le groupe mentionné dans le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au récit suivi. « Ils étaient » évite d’ajouter « personnes » ou « hommes », qui ne figure pas explicitement dans ce verset, tandis que la virgule rend discrètement la faible valeur connective de δέ.
