  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: fr
  text: 'Et il leur disait[a] : « Vous ne comprenez pas encore ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il leur dit ».'
    reason: L’imparfait grec peut être rendu par un imparfait qui en souligne l’aspect continu ou répétitif, ou, plus idiomatiquement dans un récit, par un passé simple.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination narrative simple du grec sans lui ajouter une valeur temporelle explicite.
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée. L’imparfait français en garde naturellement la valeur aspectuelle.
- source_word: αὐτοῖς
  choice: leur
  rationale: Traduit directement le pronom datif pluriel sans expliciter dans le verset qu’il s’agit des disciples.
- source_word: Οὔπω
  choice: pas encore
  rationale: Rend directement l’idée d’une compréhension qui n’a toujours pas été atteinte jusqu’à ce moment-là, dans une formulation française naturelle.
- source_word: συνίετε
  choice: vous ne comprenez
  rationale: Le verbe désigne ici la compréhension mentale; le présent et la deuxième personne du pluriel sont conservés.
theological_decisions:
- issue: Faut-il expliciter l’objet de la compréhension par « cela » ou « ceci » ?
  choice: 'Laisser l’objet sous-entendu : « Vous ne comprenez pas encore ? »'
  alternative: « Vous ne comprenez pas encore cela ? »
  rationale: Le grec n’exprime aucun complément d’objet. Ne pas en ajouter préserve la portée ouverte de la question et évite d’en restreindre artificiellement le sens.
translation_notes:
  register: Français international moderne, simple et digne. La question reste brève et incisive. « Pas encore » suit de près οὔπω, tandis que l’imparfait « disait » conserve l’aspect du verbe grec.
