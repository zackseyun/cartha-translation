id: MRK.8.17
reference: Mark 8:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: fr
  text: 'Jésus, sachant cela, leur dit : « Pourquoi discutez-vous du fait que vous n’avez pas de pain ? Vous ne saisissez toujours pas ? Vous ne comprenez pas ? Avez-vous le cœur endurci ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: sachant cela
  rationale: Le participe aoriste indique que Jésus a connaissance de leur discussion; « cela » reprend naturellement le contexte immédiat sans préciser davantage l’objet implicite.
- source_word: διαλογίζεσθε
  choice: discutez-vous
  rationale: Le verbe désigne ici la délibération ou discussion entre les disciples; ce choix convient au contexte et reste naturel en français.
- source_word: ἄρτους
  choice: pain
  rationale: Bien que le grec emploie le pluriel, le français utilise naturellement le nom collectif « pain » pour parler de cette denrée.
- source_word: νοεῖτε
  choice: saisissez
  rationale: « Saisir » exprime la perception mentale et permet de distinguer ce verbe de συνίετε.
- source_word: συνίετε
  choice: comprenez
  rationale: « Comprendre » rend directement le sens de συνίημι tout en conservant le parallélisme avec « saisir ».
- source_word: πεπωρωμένην
  choice: endurci
  rationale: Le participe parfait passif décrit un état durable d’insensibilité; « endurci » préserve la métaphore biblique.
- source_word: καρδίαν
  choice: cœur
  rationale: « Cœur » maintient la métaphore de l’intériorité, qui englobe ici l’intelligence et la réceptivité spirituelle.
theological_decisions:
- issue: Formulation de la dernière question sur l’état intérieur des disciples
  choice: Avez-vous le cœur endurci ?
  alternative: Votre cœur est-il endurci ?
  rationale: « Avez-vous le cœur endurci ? » conserve naturellement en français la construction grecque ἔχετε avec l’objet et le participe, ainsi que le singulier collectif « le cœur », sans résoudre la réprimande en une affirmation.
translation_notes:
  register: Français international moderne, courant et digne. Le nom « Jésus », implicite dans le participe grec mais explicite dans le contexte, évite une ouverture pronominale maladroite hors contexte. Les deux verbes νοεῖτε et συνίετε restent distincts dans deux questions brèves, conformément à la vigueur rhétorique du grec.
