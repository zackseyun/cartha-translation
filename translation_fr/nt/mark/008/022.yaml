source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: fr
  text: Ils arrivèrent à Bethsaïda. Ils lui amenèrent un aveugle et le supplièrent de toucher l’aveugle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: ils arrivèrent
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit écrit en français. « Arrivèrent à » exprime clairement le mouvement vers Bethsaïda.
- source_word: εἰς Βηθσαϊδάν
  choice: à Bethsaïda
  rationale: Devant un nom de ville, εἰς se rend naturellement par « à » en français.
- source_word: φέρουσιν
  choice: on lui amena
  rationale: Le présent historique est rendu au passé simple. « Amener » reste général et n’impose pas l’idée que l’homme aurait été porté.
- source_word: τυφλὸν
  choice: un aveugle
  rationale: L’adjectif substantivé masculin singulier désigne ici un homme aveugle. Cette formulation est concise et idiomatique en français.
- source_word: παρακαλοῦσιν
  choice: on le supplia
  rationale: Dans ce contexte, le verbe exprime une demande insistante; « supplier » en restitue l’intensité.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: de le toucher
  rationale: Après « supplier », l’infinitif précédé de « de » rend naturellement le contenu de la demande. ἅπτομαι signifie ici « toucher ».
- source_word: καὶ
  choice: Ils… On… et
  rationale: Les coordinations de Marc sont conservées là où elles restent naturelles. Le premier καί assure la continuité narrative sans devoir être traduit par « et » en tête de verset; le second ouvre une nouvelle action, tandis que le dernier relie les deux verbes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. L’alternance entre « ils » et « on » reflète le grec, dont le sujet pluriel demeure non identifié, tout en évitant une répétition lourde.
