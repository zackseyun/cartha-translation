source:
  edition: SBLGNT
  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: fr
  text: « J’ai de la compassion pour cette foule, car voilà déjà trois jours qu’ils restent auprès de moi et ils n’ont rien à manger. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: J’ai compassion
  rationale: Le verbe exprime une compassion profonde. « J’ai compassion » est digne, clair et conserve le présent, sans ajouter une description émotionnelle absente du grec.
- source_word: ἐπὶ τὸν ὄχλον
  choice: de cette foule
  rationale: Avec σπλαγχνίζομαι, ἐπί suivi de l’accusatif désigne l’objet de la compassion. En français, « avoir compassion de » est une construction naturelle dans ce registre. Le démonstratif rend l’article grec de manière idiomatique dans la situation d’énonciation.
- source_word: ὅτι
  choice: car
  rationale: ὅτι introduit ici le motif de la compassion. « Car » relie naturellement l’explication aux paroles qui précèdent.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: voilà déjà trois jours
  rationale: Cette tournure française exprime naturellement une durée commencée dans le passé et toujours en cours, tout en conservant la valeur de ἤδη.
- source_word: προσμένουσίν μοι
  choice: qu’ils restent auprès de moi
  rationale: προσμένω avec le datif indique qu’ils demeurent auprès de Jésus ou continuent avec lui. « Restent auprès de moi » préserve cette idée de présence continue sans suggérer qu’ils sont hébergés chez lui.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: ils n’ont rien à manger
  rationale: Cette formulation idiomatique rend exactement l’absence de nourriture exprimée par ἔχω avec τί et le subjonctif φάγωσιν.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le passage du singulier collectif « cette foule » au pluriel « ils », présent dans le grec (τὸν ὄχλον / προσμένουσίν / ἔχουσιν), plutôt que de l’aplanir.
