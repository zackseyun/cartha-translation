id: MRK.8.27
reference: Mark 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: fr
  text: 'Jésus partit avec ses disciples pour les villages de Césarée de Philippe. En chemin, il demandait à ses disciples : « Qui les gens disent-ils que je suis ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: partit
  rationale: Dans ce contexte de déplacement vers une région, « partit » rend naturellement l’aoriste de ἐξέρχομαι sans l’archaïsme de « s’en alla » ni le calque potentiellement ambigu « sortit ».
- source_word: κώμας
  choice: villages
  rationale: κώμη désigne normalement une localité rurale ou un village plutôt qu’une ville importante.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Césarée de Philippe
  rationale: C’est la forme française usuelle du nom de lieu; le génitif distingue cette Césarée des autres villes du même nom.
- source_word: εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου
  choice: vers les villages de la région de Césarée de Philippe
  rationale: Le génitif peut désigner les villages dépendant de Césarée de Philippe ou situés dans ses environs. L’ajout explicatif « de la région de » évite de suggérer que les villages se trouvent à l’intérieur de la ville.
- source_word: ἐν τῇ ὁδῷ
  choice: En chemin
  rationale: Expression française idiomatique qui conserve à la fois le déplacement narratif et le motif marcien du chemin.
- source_word: ἐπηρώτα
  choice: demandait
  rationale: L’imparfait français correspond naturellement à l’aspect imperfectif du grec et présente la question dans le déroulement du voyage.
- source_word: λέγων αὐτοῖς
  choice: introduit par les deux-points
  rationale: Le français naturel n’exige pas le calque « en leur disant » après « demandait »; les deux-points rendent clairement la fonction introductive du participe.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: D’après les gens, qui suis-je ?
  rationale: Cette formulation idiomatique conserve la question d’identité et attribue explicitement l’opinion aux gens. « Les gens » rend ἄνθρωποι dans son sens générique, sans le limiter aux hommes de sexe masculin.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: ses disciples
  rationale: Le possessif explicite αὐτοῦ est conservé dans les deux occurrences.
theological_decisions:
- issue: Sens générique de ἄνθρωποι dans la question de Jésus
  choice: les gens
  alternative: les hommes
  rationale: Dans ce contexte, ἄνθρωποι désigne le public en général, et non exclusivement des personnes de sexe masculin. « Les gens » préserve cette portée générique.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque répétée est allégée sans supprimer les étapes du récit. La tournure directe « D’après les gens, qui suis-je ? » privilégie une oralité claire tout en maintenant la distinction entre l’opinion publique et la question de l’identité de Jésus.
