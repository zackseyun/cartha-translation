id: MRK.8.14
reference: Mark 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: fr
  text: Ils avaient oublié de prendre du pain[a] et n’avaient avec eux dans la barque qu’un seul pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « des pains ». Le pluriel grec peut désigner plusieurs pains, mais il semble ici renvoyer au pain ou aux provisions en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: avaient oublié
  rationale: Le plus-que-parfait français exprime naturellement l’action antérieure qui explique leur manque de provisions à ce moment du récit.
- source_word: λαβεῖν
  choice: de prendre
  rationale: L’infinitif complète « avaient oublié » et désigne le fait d’emporter du pain avec eux.
- source_word: ἄρτους
  choice: du pain
  rationale: Le pluriel grec peut désigner des pains individuels, mais il renvoie ici naturellement au pain comme provision.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: à part un seul pain
  rationale: εἰ μή a ici une valeur exceptive; « un seul pain » conserve le caractère dénombrable et l’insistance sur l’unique pain présent.
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: ils n’avaient rien avec eux
  rationale: Cette formulation française naturelle conserve l’ellipse grecque après l’exception, sans répéter maladroitement « pain ».
- source_word: ἐν τῷ πλοίῳ
  choice: dans la barque
  rationale: « Dans la barque » est l’expression française courante dans ce cadre narratif; « barque » convient au πλοῖον du récit évangélique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition grecque autour du pain est allégée dans la seconde proposition par « rien », tandis que l’exception « un seul pain » demeure explicite.
