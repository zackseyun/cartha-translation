id: MRK.8.31
reference: Mark 8:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: fr
  text: Et il commença à leur enseigner que le Fils de l’homme devait beaucoup souffrir, être rejeté par les anciens, les grands prêtres et les spécialistes de la Loi, être tué et, après trois jours[a], ressusciter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après trois jours ». D’autres passages disent : « le troisième jour ».'
    reason: La note signale la formulation grecque propre à Marc et sa différence avec celle de certains passages parallèles, sans les harmoniser.
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: commença à leur enseigner
  rationale: La tournure française rend naturellement la valeur ingressive de ἤρξατο avec l’infinitif et conserve la transition narrative.
- source_word: δεῖ
  choice: devait
  rationale: Dans ce discours au passé, « devait » exprime clairement la nécessité forte portée par δεῖ sans préciser davantage sa nature théologique.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction consacrée préserve le titre, sa forme sémitique et ses résonances bibliques, sans le paraphraser.
- source_word: πολλὰ παθεῖν
  choice: beaucoup souffrir
  rationale: Le neutre pluriel πολλά associé à πάσχω peut s’exprimer idiomatiquement en français par « beaucoup souffrir », qui conserve l’ampleur indéterminée des souffrances.
- source_word: ἀποδοκιμασθῆναι
  choice: être rejeté
  rationale: Cette formulation claire rend l’idée de désapprobation et de rejet officiels sans alourdir le texte.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: par les anciens
  rationale: « Les anciens » est le terme historique usuel pour ce groupe reconnu de dirigeants juifs.
- source_word: τῶν ἀρχιερέων
  choice: les grands prêtres
  rationale: Au pluriel, le terme désigne les principaux membres du groupe sacerdotal plutôt que plusieurs titulaires simultanés de la fonction de grand prêtre.
- source_word: τῶν γραμματέων
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, γραμματεῖς désigne des experts et enseignants de la Loi; cette expression moderne communique leur fonction plus clairement que « scribes » tout en conservant leur identité historique.
- source_word: ἀποκτανθῆναι
  choice: être tué
  rationale: La formulation est directe, naturelle et respecte la voix passive de l’infinitif grec.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: après trois jours
  rationale: μετά avec l’accusatif signifie normalement « après »; la traduction conserve donc le libellé propre à Marc sans l’harmoniser avec « le troisième jour ».
- source_word: ἀναστῆναι
  choice: ressusciter
  rationale: L’infinitif aoriste intransitif est rendu par le verbe français usuel « ressusciter », qui exprime ici le retour à la vie sans transformer la forme en passif.
theological_decisions:
- issue: Nécessité de la passion exprimée par δεῖ
  choice: devait
  alternative: il fallait que
  rationale: « Devait » maintient le poids de la nécessité divine dans une syntaxe fluide, sans en définir le mécanisme ni importer une explication doctrinale.
- issue: Expression temporelle μετὰ τρεῖς ἡμέρας
  choice: après trois jours
  alternative: le troisième jour
  rationale: Le texte de Marc dit littéralement « après trois jours ». Cette formulation est préservée plutôt que remplacée par celle des passages parallèles.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée du grec est légèrement allégée en une série d’infinitifs, tout en conservant la progression souffrance–rejet–mort–résurrection. Le marqueur [a] est placé après la proposition concernée.
