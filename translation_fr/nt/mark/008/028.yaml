  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: fr
  text: 'Ils lui dirent : « Jean le Baptiste ; d’autres, Élie ; d’autres encore, l’un des prophètes. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Ils lui dirent, disant : “Jean le Baptiste ; d’autres, Élie ; d’autres encore, l’un des prophètes.” » Le grec emploie une formule de parole redoublée et laisse sous-entendu « tu es » dans les éléments de la liste.'
    reason: alternative lexicale et explicitation de l’ellipse
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ils
  rationale: L’article substantivé avec δέ reprend comme sujet les disciples mentionnés dans le contexte. En français, « Ils » suffit naturellement, sans rendre explicitement la faible valeur connective de δέ.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: lui répondirent
  rationale: La tournure grecque associe une forme finie et un participe du même verbe, littéralement « lui dirent en disant ». Une reproduction mécanique serait lourde en français ; « lui répondirent » exprime naturellement la prise de parole suscitée par la question précédente.
- source_word: ὅτι
  choice: — (rendu par les deux-points et les guillemets)
  rationale: ὅτι introduit ici le contenu rapporté. La ponctuation du discours direct le rend de façon idiomatique sans ajouter « que ».
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jean le Baptiste
  rationale: C’est la désignation française traditionnelle, claire et non confessionnelle, de Jean qui baptisait.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: pour d’autres ... et pour d’autres encore
  rationale: Cette formulation française exprime clairement la répartition entre plusieurs groupes d’opinion et marque la dernière catégorie sans introduire une opposition plus forte que le grec.
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française courante du nom biblique.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: l’un des prophètes
  rationale: 'La formulation conserve l’ellipse grecque : le prédicat implicite « tu es » n’est pas répété, tout en restant aisément compris dans cette liste.'
- source_word: προφητῶν
  choice: prophètes
  rationale: Équivalent français standard de προφῆται, désignant ici les figures prophétiques d’Israël.
theological_decisions:
- issue: Présentation des identifications populaires de Jésus
  choice: Conserver la forme brève d’une liste d’identifications rapportées, sans répéter « tu es » dans chaque proposition.
  alternative: '« Ils lui répondirent : “Certains disent que tu es Jean le Baptiste, d’autres Élie, et d’autres encore l’un des prophètes.” »'
  rationale: Le grec laisse le prédicat sous-entendu et met l’accent sur la diversité des opinions. La traduction conserve cette concision et ne précise pas davantage que le texte source la manière dont chaque réponse est formulée.
translation_notes:
  register: Français international moderne, digne et accessible. « Jean le Baptiste » et « Élie » suivent l’usage biblique français courant. Les points-virgules préservent le rythme condensé de l’énumération grecque ; la note signale la formule de parole redoublée et l’ellipse.
