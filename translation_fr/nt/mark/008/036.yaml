id: MRK.8.36
reference: Mark 8:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: fr
  text: Car à quoi sert-il à un être humain de gagner le monde entier et de perdre sa vie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme ». Selon le contexte, le mot grec ψυχή peut désigner la vie, l’âme ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Car à quoi
  rationale: « Car » conserve le lien explicatif avec l’enseignement précédent, tandis que « à quoi » introduit naturellement la question rhétorique en français.
- source_word: ὠφελεῖ
  choice: sert-il
  rationale: Dans la tournure « à quoi sert-il », ce verbe exprime naturellement l’idée d’utilité ou de profit, tout en préparant le contraste économique entre gagner et perdre.
- source_word: ἄνθρωπον
  choice: un être humain
  rationale: Le nom grec est ici singulier et générique. « Un être humain » rend cette portée universelle sans restreindre le propos aux hommes de sexe masculin.
- source_word: κερδῆσαι
  choice: de gagner
  rationale: « Gagner » correspond au sens courant de κερδαίνω et maintient clairement le contraste entre gain et perte.
- source_word: τὸν κόσμον ὅλον
  choice: le monde entier
  rationale: Cette formulation française naturelle exprime toute l’étendue indiquée par κόσμος et renforcée par ὅλον.
- source_word: ζημιωθῆναι
  choice: de perdre
  rationale: Le passif grec signifie subir une perte ou être privé de quelque chose. « Perdre » est clair, idiomatique et conserve l’opposition directe avec « gagner ».
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans le contexte immédiat de Marc 8.35-37, ψυχή désigne en premier lieu la vie que l’on cherche à sauver ou que l’on risque de perdre. Le terme grec peut aussi signifier « âme », possibilité signalée en note.
theological_decisions:
- issue: Sens de ψυχή dans une parole sur le prix de la fidélité à Jésus
  choice: sa vie
  alternative: son âme
  rationale: « Vie » assure la cohérence avec le paradoxe de sauver ou perdre sa ψυχή au verset précédent et évite d’imposer une anthropologie particulière. « Âme » demeure une lecture lexicale et traditionnelle possible, conservée en note afin de préserver l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste concise; « un être humain » explicite la valeur générique de ἄνθρωπον, et le couple « gagner/perdre » préserve l’image du gain et de la perte.
