  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: fr
  text: Ils avaient quelques petits poissons. Après les avoir bénis, il dit de les servir aussi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il dit de les présenter également ». Le verbe grec peut désigner le fait de placer de la nourriture devant quelqu’un ou de la servir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰχθύδια
  choice: petits poissons
  rationale: Le diminutif désigne vraisemblablement de petits poissons; cette nuance est conservée dans un français naturel.
- source_word: ὀλίγα
  choice: quelques
  rationale: Rend naturellement la faible quantité avec un nom comptable.
- source_word: εὐλογήσας
  choice: après les avoir bénis
  rationale: Exprime l'antériorité du participe aoriste et reste plus proche de εὐλογέω que « après avoir rendu grâce ».
- source_word: αὐτά
  choice: les
  rationale: Le pronom neutre pluriel renvoie aux petits poissons; le pronom français s'accorde avec son antécédent masculin pluriel.
- source_word: καὶ ταῦτα
  choice: eux aussi
  rationale: Conserve la valeur additive de καί et la reprise démonstrative de ταῦτα sans lourdeur.
- source_word: παρατιθέναι
  choice: servir
  rationale: Dans le contexte d'un repas, παρατίθημι signifie présenter de la nourriture ou la servir; « servir » est ici idiomatique et garde l'infinitif actif.
- source_word: εἶπεν
  choice: il dit
  rationale: Correspond directement au verbe λέγω tout en laissant l'infinitif suivant exprimer l'instruction.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Deux phrases remplacent la coordination grecque afin d'éviter une succession pesante de « et ». « Ils » reprend naturellement les disciples dans le contexte. L'ambiguïté de l'infinitif quant à ses exécutants demeure implicite, comme en grec.
