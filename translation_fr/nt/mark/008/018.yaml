  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: fr
  text: 'Vous avez des yeux : ne voyez-vous pas ? Vous avez des oreilles : n’entendez-vous pas ? Et ne vous souvenez-vous pas ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Vous avez des yeux
  rationale: Le participe peut avoir une nuance concessive, mais cette formulation directe et naturelle en français conserve l’image concrète et laisse la question rhétorique en faire ressortir le contraste.
- source_word: βλέπετε
  choice: ne voyez-vous pas
  rationale: « Voir » rend le sens ordinaire du verbe tout en permettant au contexte de suggérer la perception spirituelle.
- source_word: ὦτα ἔχοντες
  choice: Vous avez des oreilles
  rationale: Cette formulation parallèle à la première préserve la structure rhétorique du grec dans un français courant.
- source_word: ἀκούετε
  choice: n’entendez-vous pas
  rationale: « Entendre » est l’équivalent lexical direct; le contexte peut lui donner la nuance plus profonde d’écouter ou de comprendre.
- source_word: μνημονεύετε
  choice: ne vous souvenez-vous pas
  rationale: Cette tournure idiomatique rend clairement le présent du verbe et la réprimande concernant le défaut de mémoire des disciples.
- source_word: καὶ
  choice: Et
  rationale: La conjonction devant la dernière question est conservée afin de rendre la progression cumulative.
- source_word: οὐ / οὐκ
  choice: ne… pas
  rationale: La négation est rendue par la forme française normale des questions rhétoriques.
theological_decisions:
- issue: Valeur concrète ou figurée de « voir » et « entendre »
  choice: Conserver les verbes concrets « voir » et « entendre » dans le texte principal.
  alternative: Employer « percevoir » et « comprendre » pour expliciter l’insensibilité spirituelle.
  rationale: Le grec emploie les verbes sensoriels ordinaires. Leur maintien préserve l’écho prophétique et laisse le contexte communiquer la portée spirituelle sans la résoudre explicitement.
translation_notes:
  register: Français moderne, international et digne. Les deux-points rendent naturellement le lien entre le fait d’avoir des yeux ou des oreilles et les questions rhétoriques, sans ajouter de connecteur concessif absent de la forme explicite du grec.
