review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’ordre ferme (διεστείλατο), de l’interdiction de parler à quiconque, et de la réaction intensifiée de proclamation est bien rendu. Toutefois, « plus il le leur ordonnait » est moins naturel et légèrement ambigu en français : « le » peut sembler être l’objet de « ordonnait », alors que le grec reprend l’acte de donner l’ordre aux personnes présentes.'
  naturalness: Le registre est moderne et accessible. « Plus il leur donnait cet ordre » restitue naturellement la reprise imparfaite de l’ordre sans imposer une construction pronominale lourde. « Ils le proclamaient encore davantage » rend clairement l’intensification.
  terminology: « Ordonna » convient à la force de διεστείλατο; « proclamaient » conserve utilement la dimension publique de ἐκήρυσσον. La note proposée dans le brouillon introduit « avec insistance », nuance qui n’est pas exprimée avec précision par μᾶλλον περισσότερον; il vaut mieux donner une alternative directement liée à l’intensification.
  issues:
  - severity: low
    issue: Construction « plus il le leur ordonnait »
    rationale: Bien que compréhensible, cette reprise est syntaxiquement et référentiellement moins nette en français. « Plus il leur donnait cet ordre » conserve le sens et améliore la fluidité.
  - severity: low
    issue: Note lexicale « avec insistance »
    rationale: L’intensification grecque porte sur le degré de la proclamation (« encore davantage »), non spécifiquement sur son insistance. La note devrait proposer une formulation plus directement fidèle.
  revised_text: Et il leur ordonna de n’en parler à personne. Mais plus il leur donnait cet ordre, plus ils le proclamaient encore davantage.[a]
