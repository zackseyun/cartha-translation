- from: Et il leur ordonna de n’en parler à personne. Mais plus il le leur ordonnait, plus encore ils le proclamaient.[a]
  to: Et il leur ordonna de n’en parler à personne. Mais plus il leur donnait cet ordre, plus ils le proclamaient encore davantage.[a]
  rationale: La révision remplace une reprise pronominale française moins idiomatique par « plus il leur donnait cet ordre », qui garde la répétition et la valeur imperfective du grec. Elle reformule aussi la note afin qu’elle reflète l’intensification de μᾶλλον περισσότερον sans ajouter la notion d’« insistance ».
