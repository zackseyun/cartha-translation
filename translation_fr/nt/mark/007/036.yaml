  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: fr
  text: Et il leur ordonna de n’en parler à personne. Mais plus il leur donnait cet ordre, plus ils le proclamaient encore davantage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus ils le proclamaient abondamment » ou « plus ils le proclamaient de plus en plus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο
  choice: ordonna
  rationale: Le moyen διαστέλλομαι exprime ici une directive ferme. « Ordonna » est naturel en français moderne et conserve cette force sans la nuance potentiellement différente de « avertit sévèrement ».
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: de n’en parler à personne
  rationale: Cette formulation idiomatique exprime le contenu de l’ordre. Le pronom « en » renvoie naturellement à l’événement qui vient d’avoir lieu.
- source_word: ὅσον ... αὐτοῖς διεστέλλετο
  choice: plus il le leur ordonnait
  rationale: 'ὅσον avec l’imparfait présente une action répétée et une progression corrélative : à mesure qu’il renouvelait son ordre. « Plus… plus… » rend clairement cette structure.'
- source_word: μᾶλλον περισσότερον
  choice: plus encore
  rationale: Les deux adverbes produisent une forte intensification. « Plus encore » la restitue dans un français naturel, tandis que la note signale la valeur surabondante possible.
- source_word: ἐκήρυσσον
  choice: ils le proclamaient
  rationale: κηρύσσω désigne une proclamation publique. L’imparfait français conserve l’aspect continu ou répété de l’imparfait grec; « le » représente le contenu implicite de leur proclamation.
theological_decisions:
- issue: Secret messianique et force de l’ordre de Jésus
  choice: Présenter l’interdiction comme un ordre réel, sans en expliquer le motif.
  alternative: Employer « leur recommanda sévèrement » ou ajouter une explication théologique de la demande de silence.
  rationale: Le texte affirme à la fois la fermeté de l’ordre et la proclamation croissante de ceux qui l’entendent. La traduction conserve cette tension sans imposer une théorie sur le motif de Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ordonna/ordonnait » reflète celle du verbe grec, et la construction « plus… plus… » rend la progression du texte.
