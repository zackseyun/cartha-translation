  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: fr
  text: 'Il lui dit : « À cause de ce que tu viens de dire[a], va, le démon est sorti de ta fille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « à cause de cette parole ». Ou « En raison de cette réponse ».
    reason: « Ce que tu viens de dire » rend naturellement la parole précise de la femme à laquelle λόγος renvoie; la note conserve le rendu plus littéral et une alternative française possible.
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: Il lui dit
  rationale: Cette formulation française rend naturellement l’introduction narrative. Le lien assuré par καί peut rester implicite en français sans perte de sens.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: À cause de cette parole
  rationale: Avec l’accusatif, διά exprime ici la cause ou le motif. « Cette parole » renvoie à la réponse précédente de la femme, conserve le singulier de λόγος et reste intelligible en français.
- source_word: ὕπαγε
  choice: va
  rationale: L’impératif fonctionne comme une invitation à repartir. « Va » est direct, actuel et n’ajoute aucune nuance absente du grec.
- source_word: ἐξελήλυθεν
  choice: est sorti
  rationale: Le passé composé rend une action accomplie dont le résultat demeure. « Est sorti » conserve aussi l’image spatiale et le langage d’exorcisme du verbe grec.
- source_word: ἐκ τῆς θυγατρός σου
  choice: de ta fille
  rationale: La préposition ἐκ désigne la personne hors de laquelle le démon est sorti. « Sortir de ta fille » transpose directement cette relation en français.
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: « Le démon » est l’équivalent lexical direct de δαιμόνιον et évite d’importer l’expression différente « esprit impur ».
theological_decisions:
- issue: Rendu du langage d’exorcisme sans atténuer l’affirmation surnaturelle
  choice: le démon est sorti de ta fille
  alternative: l’esprit mauvais a quitté ta fille
  rationale: Le grec nomme explicitement un δαιμόνιον et affirme qu’il est sorti de la fille. La traduction conserve cette désignation personnelle et l’image de sortie, sans la réduire à une maladie ou à une influence abstraite.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond au singulier grec et au dialogue direct. Les deux-points avant la conséquence rendent clairement l’enchaînement de la parole de Jésus.
