source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: fr
  text: 'Et il leur disait : « Vous savez fort bien écarter le commandement de Dieu pour garder votre tradition ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: il leur disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée; l’imparfait français la rend naturellement.
- source_word: Καλῶς
  choice: vous savez habilement
  rationale: Dans ce contexte, l’adverbe est ironique. Cette tournure française fait entendre le reproche mordant sans donner l’impression d’une approbation réelle.
- source_word: ἀθετεῖτε
  choice: mettre de côté
  rationale: Le verbe signifie rejeter, écarter ou invalider. « Mettre de côté » exprime clairement le mépris délibéré du commandement et contraste avec le maintien de la tradition.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: le commandement de Dieu
  rationale: Traduction directe qui conserve le poids religieux du terme et l’opposition avec « votre tradition ».
- source_word: ἵνα
  choice: pour
  rationale: La préposition avec l’infinitif exprime naturellement en français le but introduit par ἵνα.
- source_word: τὴν παράδοσιν ὑμῶν
  choice: votre tradition
  rationale: « Tradition » est le terme courant et exact pour ce qui est transmis; le possessif maintient le contraste avec le commandement venant de Dieu.
- source_word: τηρήσητε
  choice: maintenir
  rationale: Le verbe peut signifier garder, observer ou préserver. « Maintenir » convient à une tradition et conserve l’idée de la faire subsister.
theological_decisions:
- issue: Ton de la déclaration de Jésus
  choice: Un reproche ironique, et non une approbation littérale
  alternative: « Vous faites bien de mettre de côté le commandement de Dieu… »
  rationale: Le contexte montre que Jésus condamne la priorité accordée à la tradition humaine. La formulation conserve l’ironie de καλῶς sans transformer le propos en éloge.
- issue: Valeur de ἵνα
  choice: 'But : « pour maintenir »'
  alternative: 'Résultat : « si bien que vous maintenez »'
  rationale: ἵνα se prête ici naturellement à une lecture finale; la traduction garde toutefois la tension rhétorique entre l’abandon du commandement et la conservation de la tradition.
translation_notes:
  register: Français international moderne, naturel et digne. « Vous savez habilement » rend l’ironie perceptible sans recourir à une tournure familière; le point d’exclamation soutient le ton de reproche.
