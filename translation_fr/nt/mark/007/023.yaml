source:
  edition: SBLGNT
  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: fr
  text: Toutes ces choses mauvaises sortent de l’intérieur et rendent l’être humain impur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Toutes ces choses mauvaises
  rationale: La formulation conserve l’insistance cumulative de πάντα ταῦτα et le pluriel concret de l’adjectif substantivé, qui renvoie aux actes et dispositions énumérés dans le contexte précédent.
- source_word: ἔσωθεν
  choice: de l’intérieur
  rationale: Cette expression indique clairement l’origine intérieure et préserve le contraste du passage entre ce qui vient du dehors et ce qui sort du cœur humain.
- source_word: ἐκπορεύεται
  choice: sortent
  rationale: Le grec emploie un verbe au singulier avec un sujet neutre pluriel, usage courant dans cette langue. Le français exige ici le pluriel; « sortent » exprime naturellement le mouvement depuis une source intérieure.
- source_word: κοινοῖ
  choice: rendent impur
  rationale: Dans le contexte des discussions sur la pureté en Marc 7, le verbe signifie souiller ou rendre impur. Cette tournure garde explicite la notion d’impureté sans employer le moins courant « souillent ».
- source_word: τὸν ἄνθρωπον
  choice: l’être humain
  rationale: ἄνθρωπος est employé ici au singulier dans un sens générique. « L’être humain » conserve ce singulier représentatif tout en exprimant naturellement en français que l’affirmation concerne toute personne.
theological_decisions:
- issue: Portée générique de τὸν ἄνθρωπον dans l’affirmation sur l’impureté humaine
  choice: l’être humain
  alternative: l’homme
  rationale: Le propos porte sur l’être humain en général et non sur un homme de sexe masculin. « L’être humain » rend cette portée générique sans transformer le singulier grec en pluriel ni réduire la déclaration à une catégorie particulière.
- issue: Sens de κοινόω dans le contexte de Marc 7
  choice: rendent impur
  alternative: souillent
  rationale: Le contexte associe la pureté rituelle et la réalité morale intérieure. « Rendent impur » maintient cette tension et n’enferme pas le verbe dans une interprétation exclusivement rituelle ou exclusivement morale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase suit de près la structure grecque tout en respectant l’accord français. « Choses mauvaises » fait écho à l’énumération précédente; « de l’intérieur » et « impur » maintiennent le vocabulaire conceptuel central du passage.
