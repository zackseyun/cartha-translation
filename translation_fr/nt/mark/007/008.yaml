id: MRK.7.8
reference: Mark 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: fr
  text: Vous laissez de côté le commandement de Dieu et vous vous attachez fermement à la tradition des hommes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des êtres humains »; le grec oppose ici ce qui est humain à ce qui vient de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: laissez de côté
  rationale: Le participe aoriste exprime ici l’action de délaisser ou de mettre de côté le commandement divin. « Laissez de côté » reste naturel et ferme sans renforcer indûment le grec comme pourrait le faire « abandonnez ».
- source_word: ἐντολὴν
  choice: commandement
  rationale: « Commandement » conserve la portée religieuse et normative de ἐντολή dans cette controverse sur l’obéissance due à Dieu.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif indique simplement que le commandement vient de Dieu ou lui appartient.
- source_word: κρατεῖτε
  choice: vous vous attachez fermement à
  rationale: κρατέω désigne ici une adhésion résolue. Cette formulation rend mieux cette force que le simple « vous gardez », tout en restant idiomatique.
- source_word: παράδοσιν
  choice: tradition
  rationale: « Tradition » est l’équivalent direct et naturel de παράδοσις, qui désigne ici une pratique transmise par des humains.
- source_word: ἀνθρώπων
  choice: des hommes
  rationale: ἀνθρώπων désigne les êtres humains en général et établit une opposition entre ce qui vient de Dieu et ce qui vient des humains. « Des hommes » préserve la formulation traditionnelle et la netteté du contraste; une note précise le sens générique.
theological_decisions:
- issue: Opposition entre le commandement divin et la tradition humaine
  choice: Conserver l’opposition explicite entre « le commandement de Dieu » et « la tradition des hommes »
  alternative: Employer « la tradition humaine » ou « la tradition des êtres humains »
  rationale: La réprimande vise le fait de délaisser l’exigence divine au profit d’une tradition d’origine humaine; elle ne condamne pas nécessairement toute tradition. La traduction maintient cette tension sans élargir la portée de l’énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe coordonnée restitue clairement le contraste. « Vous vous attachez fermement » rend l’intensité de κρατεῖτε sans archaïsme; la note évite que « hommes » soit compris comme visant seulement les personnes de sexe masculin.
