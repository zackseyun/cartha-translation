source:
  edition: SBLGNT
  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: fr
  text: 'Ils étaient au comble de l’étonnement et disaient : « Il a tout bien fait. Il fait entendre les sourds et parler les muets.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette déclaration rappelle Ésaïe 35.5-6, où les oreilles des sourds s’ouvrent et où la langue des muets chante de joie.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: au-delà de toute mesure
  rationale: Cette expression rend l’intensité exceptionnelle de l’adverbe grec sans l’affaiblir; associée à « stupéfaits », elle demeure naturelle et solennelle en français.
- source_word: ἐξεπλήσσοντο
  choice: étaient stupéfaits
  rationale: L’imparfait décrit leur réaction persistante, et « stupéfaits » exprime fortement leur saisissement.
- source_word: λέγοντες
  choice: et disaient
  rationale: La coordination est idiomatique en français et présente directement les paroles qui manifestent leur étonnement.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: Il a tout bien fait
  rationale: Cette formulation proche du grec conserve la portée globale de πάντα, la valeur résultative du parfait et l’éventuelle résonance avec le langage biblique sur les œuvres de Dieu.
- source_word: τοὺς κωφοὺς
  choice: les sourds
  rationale: Le substantif désigne ici les personnes qui ne peuvent pas entendre; la formulation est concise et parallèle à « les muets ».
- source_word: ποιεῖ ἀκούειν
  choice: fait entendre
  rationale: La construction causative ποιεῖ avec l’infinitif est rendue directement par « fait entendre ».
- source_word: ἀλάλους
  choice: les muets
  rationale: Dans le contexte de la guérison, le mot désigne ceux qui ne peuvent pas parler; « les muets » conserve le parallélisme du grec.
- source_word: λαλεῖν
  choice: parler
  rationale: « Parler » est l’équivalent français courant et précis de l’infinitif grec.
- source_word: καὶ
  choice: même
  rationale: Devant le premier groupe coordonné, « même » fait ressortir la portée remarquable de l’affirmation sans limiter l’intensification au seul verbe.
theological_decisions:
- issue: Possible évocation d’Ésaïe 35.5-6 et résonance du langage de la création dans « Il a tout bien fait »
  choice: Conserver dans le texte une formulation directe et proche du grec, tout en signalant l’écho à Ésaïe dans une note.
  alternative: Rendre l’allusion explicite dans le corps du verset ou accentuer davantage le motif de la création.
  rationale: Le grec permet ces résonances sans les formuler explicitement. La traduction les préserve donc sans imposer une identification théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Au-delà de toute mesure » conserve l’emphase inhabituelle du grec, tandis que les deux déclarations de la foule restent simples, mémorables et proches de la structure originale.
