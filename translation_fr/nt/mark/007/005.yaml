  verdict: revise
  source_fidelity: 'La structure de la question, le présent narratif (« demandent »), « la tradition des anciens » et « du pain » rendent fidèlement le grec. En revanche, « mains profanées » ne rend pas avec assez de précision κοινός dans ce contexte : le terme désigne un statut rituel de souillure/impureté, non des mains qui auraient été profanées ou désacralisées.'
  naturalness: La phrase est naturelle et adaptée au français moderne international. « Spécialistes de la Loi » est clair et acceptable pour γραμματεῖς. « Mains impures » est plus idiomatique et exact dans le registre de la pureté rituelle que « mains profanées ».
  terminology: « Pharisiens », « spécialistes de la Loi », « tradition des anciens » et « pain » sont cohérents. Le remplacement de « profanées » par « impures » préserve la distinction rituelle pertinente sans suggérer une profanation active. La note maintient utilement le littéral « communes ».
  issues:
