source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: fr
  text: 'Les pharisiens et les spécialistes de la Loi lui demandent : « Pourquoi tes disciples ne se conduisent-ils pas conformément à la tradition des anciens, mais mangent-ils du pain avec des mains impures[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des mains communes », c’est-à-dire considérées comme rituellement impures.'
    reason: La note préserve le sens littéral de κοινός et précise son emploi dans le domaine de la pureté rituelle.
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: demandent
  rationale: Le présent restitue naturellement le présent historique grec dans ce récit et exprime sans surinterprétation l’acte de questionner.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, le terme désigne des interprètes reconnus de la Loi. Cette formulation moderne communique mieux leur fonction que le calque « scribes ».
- source_word: περιπατοῦσιν
  choice: se conduisent
  rationale: Le verbe signifie littéralement « marcher », mais il décrit ici la manière d’agir. « Se conduire » conserve ce sens sans employer en français une métaphore peu naturelle dans cette question précise.
- source_word: κατὰ τὴν παράδοσιν
  choice: conformément à la tradition
  rationale: Cette expression rend l’idée de régler sa conduite sur une norme transmise.
- source_word: τῶν πρεσβυτέρων
  choice: des anciens
  rationale: Le génitif est conservé sans préciser davantage l’identité de ces autorités antérieures.
- source_word: κοιναῖς χερσίν
  choice: avec des mains profanées
  rationale: κοινός signifie ici « commun, profane » au sens rituel, et non simplement sale. « Profanées » signale la question de statut rituel sans la confondre avec la saleté physique.
- source_word: ἄρτον
  choice: du pain
  rationale: La traduction conserve le nom concret grec, même s’il peut représenter plus largement le repas.
theological_decisions:
- issue: Le statut rituel exprimé par κοινός
  choice: mains profanées
  alternative: mains impures ; mains communes
  rationale: Le débat porte sur la pureté rituelle selon une tradition, non sur l’hygiène ni nécessairement sur une faute morale. La traduction retenue maintient cette distinction, tandis que la note conserve le sens littéral inhabituel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la question est idiomatique, tout en conservant « du pain » et « la tradition des anciens ». Le marqueur de note est placé immédiatement après l’expression qu’il explique.
