    issue: « mains profanées » pour κοιναῖς χερσίν
    rationale: En français, « profané » évoque normalement une atteinte à la sainteté d’un lieu ou d’un objet, ou une désacralisation. Dans Marc 7, κοινός qualifie plutôt des mains tenues pour rituellement impures selon la tradition en question. « Impures » rend ce statut plus exactement et sans connotation indue.
