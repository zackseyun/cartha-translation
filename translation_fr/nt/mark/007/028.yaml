  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: fr
  text: 'Mais elle lui répondit : « Seigneur[a], même les petits chiens[b] sous la table mangent des miettes des enfants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec peut être soit une formule de respect, soit le titre « Seigneur ».
    reason: alternative_reading
  - marker: b
    text: Le terme grec est un diminutif et peut désigner de petits chiens ou des chiens de maison.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: elle lui répondit
  rationale: Le français naturel réunit la formule grecque « répondit et lui dit » en un seul verbe de parole, sans perte de sens; l’imparfait historique-présent λέγει est ainsi rendu dans un récit au passé.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve le titre usuel, tout en laissant une note signaler que le mot grec peut aussi être une formule de respect.
- source_word: καὶ
  choice: même
  rationale: 'Dans la réplique de la femme, καί a une valeur additive et argumentative : les petits chiens, eux aussi, reçoivent quelque chose.'
- source_word: κυνάρια
  choice: les petits chiens
  rationale: Le diminutif grec désigne de petits chiens, vraisemblablement domestiques; cette formulation en conserve la nuance sans imposer « chiots ».
- source_word: ὑποκάτω τῆς τραπέζης
  choice: sous la table
  rationale: Rendu spatial direct, idiomatique et précis.
- source_word: ἐσθίουσιν
  choice: mangent
  rationale: Le présent exprime ici une réalité habituelle ou générale.
- source_word: ἀπὸ τῶν ψιχίων
  choice: les miettes
  rationale: En français, « manger les miettes » rend naturellement l’idée de se nourrir à partir des miettes, sans traduction lourde de ἀπό.
- source_word: τῶν παιδίων
  choice: des enfants
  rationale: Le génitif relie directement les miettes aux enfants, sans ajouter le mot « nourriture », absent du grec.
theological_decisions:
- issue: Sens de κύριε dans l’adresse de la femme à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: « Seigneur » préserve le titre traditionnel et sa possible portée christologique, tandis que le contexte autorise aussi une simple adresse respectueuse; la note maintient cette ambiguïté.
translation_notes:
  register: Français international actuel, naturel et digne. La coordination grecque redondante est allégée en « répondit ». Les notes préservent l’ambiguïté de κύριε et la nuance diminutive de κυνάρια.
