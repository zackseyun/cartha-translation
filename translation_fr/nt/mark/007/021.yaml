id: MRK.7.21
reference: Mark 7:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: fr
  text: 'Car c’est du dedans, du cœur des êtres humains, que sortent les mauvaises pensées : inconduites sexuelles, vols, meurtres,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσωθεν
  choice: du dedans
  rationale: Conserve l’image d’une origine intérieure et le contraste contextuel avec ce qui vient de l’extérieur.
- source_word: γὰρ
  choice: Car
  rationale: Introduit naturellement en français l’explication qui fonde l’affirmation précédente.
- source_word: καρδίας
  choice: cœur
  rationale: Maintient le terme anthropologique biblique désignant le centre intérieur de la pensée, de la volonté et de la vie morale.
- source_word: ἀνθρώπων
  choice: êtres humains
  rationale: Le pluriel grec est générique et vise l’humanité en général; cette formulation moderne et inclusive en rend clairement la portée.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: les mauvaises pensées
  rationale: Rend clairement les réflexions ou raisonnements intérieurement mauvais, sans les limiter à des projets prémédités.
- source_word: ἐκπορεύονται
  choice: sortent
  rationale: Préserve l’image concrète de réalités qui procèdent de l’intérieur du cœur.
- source_word: πορνεῖαι
  choice: inconduites sexuelles
  rationale: Rend le pluriel et la large gamme d’actes sexuels illicites sans réduire le terme à une seule catégorie.
- source_word: κλοπαί
  choice: vols
  rationale: Équivalent français naturel du pluriel concret dans cette liste de vices.
- source_word: φόνοι
  choice: meurtres
  rationale: Exprime les homicides moralement illicites plutôt que toute mise à mort sans distinction.
theological_decisions:
- issue: Portée anthropologique de ἀνθρώπων
  choice: êtres humains
  alternative: hommes; gens
  rationale: Le masculin pluriel grec est employé génériquement. « Êtres humains » indique sans ambiguïté que Jésus parle de tous les humains, sans ajouter de particularité doctrinale.
- issue: Étendue sémantique de πορνεῖαι
  choice: inconduites sexuelles
  alternative: immoralités sexuelles; débauches
  rationale: La formulation garde le pluriel du texte et sa portée générale, sans imposer une définition confessionnelle plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure emphatique « c’est du dedans… que » reproduit l’insistance sur l’origine intérieure. Le verset conserve sa ponctuation ouverte, puisqu’il introduit une liste poursuivie au verset suivant.
