  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: fr
  text: Et ses oreilles s’ouvrirent[a], le lien de sa langue fut délié[b], et il parlait correctement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ouïe fut rétablie ». Le grec peut désigner aussi bien les oreilles que la faculté d’entendre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « le lien de sa langue fut délié » : ce qui entravait sa parole fut supprimé.'
    reason: metaphor_clarification
  - marker: c
    text: Ou « distinctement » ou « comme il faut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: s’ouvrirent
  rationale: L’aoriste passif exprime l’ouverture soudaine produite lors de la guérison. En français, la tournure pronominale est plus naturelle que « furent ouvertes » tout en gardant le patient comme bénéficiaire de l’action.
- source_word: αἱ ἀκοαί
  choice: ses oreilles
  rationale: Le pluriel peut désigner les oreilles ou la faculté auditive. « Ses oreilles » conserve l’image concrète et s’accorde naturellement avec le verbe « s’ouvrir ».
- source_word: ἐλύθη
  choice: fut délié
  rationale: L’aoriste passif de λύω signifie ici que ce qui entravait la langue a été défait. « Fut délié » préserve à la fois la voix passive et l’image du lien.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: le lien de sa langue
  rationale: δεσμός désigne littéralement un lien ou une entrave. Cette traduction maintient la métaphore concrète du grec sans la remplacer par le terme clinique « trouble de la parole ».
- source_word: ἐλάλει
  choice: il parlait
  rationale: L’imparfait grec présente la parole désormais effective ou continue. L’imparfait français reflète naturellement cet aspect sans ajouter explicitement l’idée de commencement.
- source_word: ὀρθῶς
  choice: distinctement
  rationale: Dans le contexte de la guérison de la parole, l’adverbe indique une élocution normale, juste et intelligible. « Distinctement » évite de suggérer principalement une correction morale ou grammaticale.
theological_decisions:
- issue: Traduction de l’image décrivant la guérison de la parole
  choice: Conserver « le lien de sa langue fut délié » dans le texte principal
  alternative: « son trouble de la parole disparut » ou « sa langue fut libérée »
  rationale: Le grec décrit le miracle au moyen d’une métaphore concrète plutôt que d’un diagnostic clinique. La conserver respecte la forme du texte sans imposer une explication médicale.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe suit la progression ternaire du grec. « Alors » rend naturellement le καί narratif initial; la métaphore du lien est conservée, tandis que « distinctement » exprime clairement le résultat de la guérison.
