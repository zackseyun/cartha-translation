  variant: modern international French
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: fr
  text: Mais c’est en vain qu’ils m’adorent, enseignant comme doctrines des commandements humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « enseignant des commandements humains comme doctrines ».'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: μάτην
  choice: en vain
  rationale: Cette locution naturelle rend l’idée d’un culte sans effet ni valeur, tout en conservant la force de la citation prophétique.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec l’honneur rendu des lèvres alors que le cœur demeure éloigné.
- source_word: σέβονταί
  choice: ils m’adorent
  rationale: Le verbe désigne la vénération ou le culte adressé à Dieu; « adorer » est le terme français le plus clair dans ce contexte.
- source_word: διδάσκοντες
  choice: enseignant
  rationale: Le participe exprime la manière dont ce culte vain se manifeste et conserve la structure resserrée du grec.
- source_word: διδασκαλίας
  choice: comme doctrines
  rationale: 'Cette formulation explicite naturellement en français la relation appositionnelle: des commandements humains sont enseignés avec le statut de doctrines.'
- source_word: ἐντάλματα ἀνθρώπων
  choice: des commandements humains
  rationale: « Commandements » maintient le registre religieux et l’idée d’autorité; « humains » indique clairement leur origine par contraste avec Dieu, sans introduire une distinction de sexe.
theological_decisions:
- issue: Rapport entre les doctrines enseignées et les commandements d’origine humaine
  choice: enseignant comme doctrines des commandements humains
  alternative: enseignant des doctrines qui ne sont que des commandements humains
  rationale: 'Le choix retenu préserve la formulation condensée du grec et la critique théologique: des prescriptions d’origine humaine reçoivent le statut d’enseignement faisant autorité, ce qui rend le culte vain.'
translation_notes:
  register: Français international moderne, naturel et digne. « C’est en vain que » évite une tournure raide; « commandements humains » exprime l’origine humaine sans archaïsme ni ambiguïté liée au genre.
