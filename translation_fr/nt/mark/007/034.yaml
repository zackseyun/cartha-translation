  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: fr
  text: 'Puis il leva les yeux vers le ciel, soupira[a] et lui dit : « Effata[b] », c’est-à-dire : « Ouvre-toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « gémit »; le verbe grec peut exprimer un profond soupir ou un gémissement.'
    reason: lexical_alternative
  - marker: b
    text: « Effata » est un mot araméen qui signifie « Ouvre-toi ».
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: il leva les yeux
  rationale: Le participe aoriste exprime une action précédant les verbes principaux. « Lever les yeux » rend naturellement le regard dirigé vers le haut.
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: Dans ce geste orienté vers Dieu, « le ciel » garde en français la portée à la fois spatiale et religieuse de οὐρανός sans la préciser excessivement.
- source_word: ἐστέναξεν
  choice: soupira
  rationale: στενάζω peut désigner un soupir ou un gémissement. « Soupira » convient au contexte sans imposer une intensité que le grec laisse ouverte; l’autre nuance est signalée en note.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Le présent historique grec est rendu par le passé simple, naturel dans ce récit français. Le pronom conserve l’adresse personnelle au malade.
- source_word: Εφφαθα
  choice: Effata
  rationale: La parole araméenne conservée par Marc est translittérée selon une forme lisible et traditionnelle en français, puis expliquée par le narrateur.
- source_word: Διανοίχθητι
  choice: Ouvre-toi
  rationale: Cet impératif aoriste passif singulier signifie littéralement « sois ouvert ». En français, « Ouvre-toi » est la formulation idiomatique d’un ordre adressé à une personne tout en conservant l’idée d’ouverture.
theological_decisions:
- issue: Référent de αὐτῷ
  choice: « lui » renvoie à l’homme sourd
  alternative: Comprendre indirectement que Jésus s’adresse aux oreilles ou aux facultés de l’homme
  rationale: Le datif grec renvoie le plus naturellement à l’homme lui-même. La traduction conserve cette adresse personnelle sans expliciter l’objet corporel visé.
- issue: Portée de Διανοίχθητι
  choice: « Ouvre-toi » adressé à l’homme
  alternative: « Sois ouvert » ou une adresse explicite aux oreilles
  rationale: Le singulier correspond à l’homme auquel Jésus parle, tandis que le contexte indique que ses facultés doivent être libérées. La formulation évite d’ajouter un référent absent du grec.
translation_notes:
  register: Français international moderne, digne et fluide. Le passé simple convient au registre narratif biblique sans être archaïque. La translittération « Effata » reste accessible au lectorat francophone. Les marqueurs de note suivent les éléments précis qu’ils expliquent.
