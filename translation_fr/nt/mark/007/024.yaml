id: MRK.7.24
reference: Mark 7:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: fr
  text: De là, il se leva et partit dans la région de Tyr[a]. Il entra dans une maison et ne voulait pas qu’on sache qu’il était là[b], mais il ne put passer inaperçu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le territoire de Tyr »; le grec peut désigner la région ou le territoire associé à Tyr, et non seulement sa ligne frontière.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « il ne voulait pas que quelqu’un sache »; le grec laisse implicite ce qui ne devait pas être su, probablement sa présence ou l’endroit où il se trouvait.
    reason: lexical_alternative
  - marker: c
    text: Ou « il ne put rester caché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: De là
  rationale: Ἐκεῖθεν marque le point de départ; δέ est une liaison narrative légère qu’il n’est pas nécessaire d’expliciter en français.
- source_word: ἀναστὰς
  choice: il se leva
  rationale: Le participe aoriste introduit l’action suivante et conserve ici son sens concret dans une formulation narrative naturelle.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: ἀπέρχομαι exprime le départ; « partit » rend cette nuance avec naturel et dignité.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: dans la région de Tyr
  rationale: ὅρια peut désigner les limites, le territoire ou la région associée à une ville; le contexte vise vraisemblablement la zone de Tyr plutôt que sa seule frontière.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Il entra dans une maison
  rationale: Le participe est séquentiel; οἰκίαν sans article est naturellement rendu par « une maison ».
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: ne voulait pas qu’on sache qu’il était là
  rationale: Le grec laisse implicite l’objet de « savoir »; le français l’explicite sobrement comme la présence de Jésus, sans préciser davantage ses intentions ou son adresse.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: mais il ne put passer inaperçu
  rationale: λανθάνω signifie échapper à l’attention ou ne pas être remarqué; « passer inaperçu » rend directement cette idée, tandis que « mais » fait ressortir le contraste avec son désir.
theological_decisions: []
