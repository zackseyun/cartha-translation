source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: fr
  text: Ils virent que certains de ses disciples mangeaient du pain avec des mains impures[a], c’est-à-dire non lavées[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souillées ». Le grec dit littéralement « communes » ; dans ce contexte, il s’agit d’impureté rituelle, et non simplement de saleté physique.
    reason: Alternative lexicale et clarification de la nuance rituelle de κοινός.
  - marker: b
    text: Le texte grec de cette partie du verset est textuellement discuté.
    reason: L’édition SBLGNT encadre le segment ὅτι … ἐσθίουσιν, signalant une incertitude textuelle.
lexical_decisions:
- source_word: ἰδόντες
  choice: ils virent
  rationale: Le participe aoriste se rattache au sujet du contexte, les pharisiens et quelques spécialistes de la Loi; une forme verbale conjuguée est naturelle en français et conserve l’idée d’observation.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: certains de ses disciples
  rationale: τινάς avec le génitif partitif signifie qu’il s’agit d’une partie des disciples.
- source_word: ὅτι
  choice: que
  rationale: ὅτι introduit ici le contenu de ce qu’ils ont vu, et non la cause.
- source_word: κοιναῖς χερσίν
  choice: avec des mains profanes
  rationale: κοινός signifie littéralement «commun» et, dans ce contexte de pureté, désigne ce qui est profané ou rituellement impur. «Mains profanes» conserve la catégorie cultuelle sans suggérer seulement de la saleté physique; la note donne les autres formulations possibles.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: c’est-à-dire non lavées
  rationale: La glose explicative de Marc précise le sens concret pour ses lecteurs. L’accord avec «mains» rend inutile sa répétition en français.
- source_word: ἐσθίουσιν
  choice: mangeaient
  rationale: L’imparfait français exprime naturellement l’action en cours au moment où elle est observée.
- source_word: τοὺς ἄρτους
  choice: le pain
  rationale: Bien que le grec emploie le pluriel, «le pain» est l’expression idiomatique française pour cet aliment dans ce contexte.
theological_decisions:
- issue: Nuance de pureté rituelle dans κοινός
  choice: «profanes» dans le texte, avec une note signalant «souillées» et «impures»
  alternative: «souillées» ou «impures»
  rationale: Le passage vise le statut rituel des mains, pas simplement leur propreté physique. «Profanes» rend la distinction entre le commun et le consacré, tandis que la glose inspirée «non lavées» demeure intacte et que la note explicite la nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le tiret final est conservé parce que la phrase se poursuit au verset suivant; «spécialistes de la Loi» n’apparaît pas dans le verset mais seulement dans la justification contextuelle.
