  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: fr
  text: Cette femme était grecque[a], syro-phénicienne d’origine[b], et elle lui demandait avec insistance de chasser le démon de sa fille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « non-juive » : le grec dit « grecque », terme qui, dans ce contexte, indique probablement aussi qu’elle n’était pas juive.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « syro-phénicienne quant à son origine », c’est-à-dire d’ascendance syro-phénicienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: grecque
  rationale: Rend directement le terme grec, qui désigne ici une femme grecque et, dans ce contexte, non juive. Le sens plus général « non-juive » est signalé en note sans remplacer la formulation précise du texte.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: syro-phénicienne d’origine
  rationale: Expression française naturelle qui conserve l’indication d’origine ethnique et géographique portée par τῷ γένει, sans employer le terme moderne potentiellement trompeur « race ».
- source_word: ἠρώτα
  choice: elle lui demandait avec insistance
  rationale: L’imparfait grec présente une demande prolongée ou répétée. Cette formulation en restitue l’aspect sans donner à ἐρωτάω le sens plus fort de « supplier ».
- source_word: ἵνα ... ἐκβάλῃ
  choice: de chasser ... hors de
  rationale: La construction indique le contenu de la demande; « chasser ... hors de » restitue clairement le mouvement exprimé par ἐκβάλλω et ἐκ dans ce contexte d’exorcisme.
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: Équivalent direct de δαιμόνιον, sans l’assimiler à l’expression différente « esprit impur ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque ici une légère transition narrative. Le français n’exige pas de connecteur explicite, et en ajouter un comme « or » ou « mais » risquerait de renforcer indûment sa valeur.
theological_decisions:
- issue: Identification de la femme
  choice: « grecque, syro-phénicienne d’origine »
  alternative: « non-juive, d’origine syro-phénicienne »
  rationale: 'Les deux indications du grec sont conservées: la première la présente comme grecque et implique probablement qu’elle n’était pas juive; la seconde précise son origine. Les fusionner ferait perdre une partie de la caractérisation narrative.'
- issue: Nature de l’affliction de la fille
  choice: « le démon »
  alternative: « l’esprit mauvais »
  rationale: La traduction maintient l’affirmation explicite de δαιμόνιον sans l’atténuer ni substituer un autre terme du vocabulaire néotestamentaire.
translation_notes:
  register: Français international moderne, naturel et digne. « Avec insistance » rend la valeur durative ou répétée de l’imparfait sans surcharger l’émotion. L’orthographe « syro-phénicienne » est transparente pour le lectorat francophone; les marqueurs [a] et [b] figurent dans le texte.
