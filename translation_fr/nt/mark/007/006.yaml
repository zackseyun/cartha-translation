id: MRK.7.6
reference: Mark 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: fr
  text: 'Mais il leur dit : « Ésaïe a bien prophétisé à votre sujet, hypocrites, comme il est écrit : “Ce peuple m’honore des lèvres, mais son cœur est loin de moi.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste et la reprise de la réponse de Jésus dans l’échange précédent.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Rend directement la formule narrative grecque, dans un français simple et naturel.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: a bien prophétisé
  rationale: Conserve la valeur évaluative de καλῶς sans préciser indûment s’il s’agit surtout de justesse ou d’exactitude.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: à votre sujet, hypocrites
  rationale: Rend περί avec le génitif et maintient l’apostrophe directe par laquelle Jésus qualifie ses interlocuteurs.
- source_word: ὡς γέγραπται ὅτι
  choice: 'comme il est écrit :'
  rationale: Formule française habituelle pour introduire une citation scripturaire; les deux-points rendent inutile un équivalent explicite de ὅτι.
- source_word: Οὗτος ὁ λαὸς
  choice: Ce peuple
  rationale: Préserve le singulier collectif et le ton de la citation prophétique.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: m’honore des lèvres
  rationale: Rend littéralement l’instrument exprimé par le datif, sans ajouter l’idée plus explicite et idiomatique d’un hommage seulement verbal.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: mais son cœur
  rationale: Le possessif singulier reprend naturellement « ce peuple » en français et préserve le cœur collectif au singulier du grec.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: est loin de moi
  rationale: Expression française naturelle qui conserve l’image d’une distance relationnelle sans la développer.
theological_decisions:
- issue: Application de la prophétie d’Ésaïe aux interlocuteurs de Jésus
  choice: Maintenir l’accusation directe par « à votre sujet, hypocrites » et « Ce peuple »
  alternative: Généraliser ou atténuer la parole en parlant seulement de personnes hypocrites
  rationale: Le grec présente Jésus comme appliquant explicitement la parole prophétique à ses interlocuteurs; cette force doit être conservée sans ajout doctrinal.
- issue: Unité collective du peuple dans la citation
  choice: « Ce peuple… son cœur » au singulier
  alternative: « Ces gens… leurs cœurs » au pluriel
  rationale: Les noms grecs λαός et καρδία sont au singulier. Le français permet de conserver naturellement ce lien collectif et la tension entre l’honneur extérieur du peuple et son cœur éloigné.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la solennité de la citation prophétique sans archaïsmes. « Des lèvres » est volontairement préféré à « du bout des lèvres », qui expliciterait davantage l’insincérité que ne le fait l’expression grecque elle-même.
