id: MRK.7.30
reference: Mark 7:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: fr
  text: Lorsqu’elle rentra chez elle, elle trouva l’enfant étendu sur le lit, et le démon était sorti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le démon étant sorti ».'
    reason: La note signale la construction participiale grecque et son accent sur le résultat accompli.
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: lorsqu’elle fut rentrée
  rationale: Le participe aoriste exprime une action antérieure à εὗρεν. Cette tournure française rend naturellement la succession des actions; «rentrée» convient au déplacement vers son propre domicile sans ajouter de détail narratif.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: chez elle
  rationale: Expression française naturelle pour le mouvement vers sa propre maison; elle rend l’idée du domicile sans lourdeur.
- source_word: εὗρεν
  choice: elle trouva
  rationale: Équivalent narratif direct et courant de εὑρίσκω.
- source_word: παιδίον
  choice: l’enfant
  rationale: Le terme grec désigne ici l’enfant sans préciser lexicalement son sexe dans ce verset, même si le contexte indique qu’il s’agit de sa fille.
- source_word: βεβλημένον
  choice: étendu
  rationale: Le parfait passif de βάλλω décrit ici l’état résultant de l’enfant sur le lit. «Étendu» est naturel en français et n’introduit pas l’idée injustifiée d’un geste violent.
- source_word: ἐπὶ τὴν κλίνην
  choice: sur le lit
  rationale: Rendu direct de la relation spatiale exprimée par ἐπί dans cette description.
- source_word: δαιμόνιον
  choice: le démon
  rationale: Équivalent précis de δαιμόνιον; il respecte le choix lexical propre à ce verset plutôt que de reprendre «esprit impur» du contexte.
- source_word: ἐξεληλυθός
  choice: était sorti
  rationale: 'Le participe parfait exprime une sortie accomplie dont le résultat demeure: le démon n’est plus présent. Le plus-que-parfait français rend clairement cet état résultant.'
theological_decisions:
- issue: Résultat de l’expulsion du démon
  choice: le démon était sorti
  alternative: le démon était parti
  rationale: La traduction affirme sobrement la sortie accomplie du démon et son absence présente, sans préciser davantage la manière dont elle s’est produite.
translation_notes:
  register: Français moderne, digne et accessible. La construction conserve la progression narrative et le parallélisme des deux états constatés, tout en employant une syntaxe française naturelle.
