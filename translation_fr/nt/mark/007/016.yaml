  yaml_path: translation/nt/mark/007/016.yaml
  text: If anyone has ears to hear, let him hear.
translation:
  language: fr
  text: Si quelqu’un a des oreilles pour entendre, qu’il entende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que des anciennes versions coptes. Il figure toutefois dans la majorité des manuscrits byzantins, dans la tradition latine et dans la plupart des témoins syriaques. Il s’agit probablement d’un ajout scribal ultérieur reprenant la même formule que Marc 4.9 et 4.23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: oreilles
  rationale: Le nom désigne littéralement les organes de l’ouïe, employés ici comme image de la réceptivité et de la compréhension.
- source_word: ἀκουέτω
  choice: qu’il entende
  rationale: L’impératif présent actif à la troisième personne du singulier conserve la force d’exhortation du grec et reprend naturellement le verbe « entendre ».
theological_decisions: []
translation_notes:
  register: Formulation française actuelle, concise et solennelle. La répétition « oreilles pour entendre… entende » est conservée, car elle reproduit l’insistance rhétorique du grec sans expliciter davantage l’image.
