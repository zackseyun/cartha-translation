id: MRK.7.10
reference: Mark 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: fr
  text: 'Car Moïse a dit : « Honore ton père et ta mère », et : « Celui qui dit du mal de son père ou de sa mère[a] doit mourir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maudit » ou « injurie » son père ou sa mère. Le verbe grec peut désigner le fait de dire du mal de quelqu’un, de l’outrager ou de le maudire.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « doit être mis à mort ». Le grec emploie une formule juridique qui signifie littéralement : « qu’il meure de mort ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς γὰρ εἶπεν
  choice: Car Moïse a dit
  rationale: « Car » conserve la fonction explicative de γὰρ dans l’argumentation, tandis que « a dit » rend naturellement l’aoriste εἶπεν dans une formule de citation.
- source_word: Τίμα
  choice: Honore
  rationale: L’impératif « Honore » garde la force éthique et la forme traditionnelle du commandement sans se limiter au simple respect intérieur.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: ton père et ta mère
  rationale: Cette formulation explicite les deux liens familiaux comme le grec et demeure naturelle en français.
- source_word: Ὁ κακολογῶν
  choice: Celui qui dit du mal de
  rationale: κακολογέω peut désigner le fait de dire du mal, d’injurier ou de maudire. La formulation retenue conserve cette amplitude sans réduire d’emblée le verbe à une malédiction formelle.
- source_word: πατέρα ἢ μητέρα
  choice: son père ou sa mère
  rationale: Même si le grec n’exprime pas ici le possessif, le français l’exige naturellement dans cette maxime générale.
- source_word: θανάτῳ τελευτάτω
  choice: doit mourir
  rationale: La tournure grecque est une formule juridique solennelle. « Doit mourir » en exprime l’obligation et la peine capitale sans reproduire littéralement l’expression peu naturelle « mourir de mort ».
theological_decisions:
- issue: Sens de κακολογῶν dans l’interdiction concernant les parents
  choice: dit du mal de
  alternative: maudit / injurie
  rationale: Le verbe couvre un champ allant des paroles mauvaises ou outrageantes jusqu’à la malédiction. Le texte principal garde une portée assez large, et la note signale les rendus plus précis possibles.
- issue: Rendu de la formule pénale θανάτῳ τελευτάτω
  choice: doit mourir
  alternative: doit être mis à mort
  rationale: Le choix principal suit directement la formulation grecque tout en gardant sa force juridique. L’alternative passive explicite l’exécution judiciaire, implication plausible du contexte légal mais non grammaticalement exprimée de façon aussi directe.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le lien explicatif avec le contexte et la forme solennelle des deux citations, tout en évitant les calques peu naturels.
