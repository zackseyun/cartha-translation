id: MRK.7.13
reference: Mark 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: fr
  text: Vous rendez ainsi sans effet[a] la parole de Dieu par votre tradition, que vous avez transmise[b]. Et vous faites beaucoup d’autres choses semblables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous annulez » ou « vous invalidez ».
    reason: lexical_alternative
  - marker: b
    text: Ou « que vous avez fait passer à d’autres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: Vous rendez ainsi sans effet
  rationale: Le participe poursuit l’accusation de la phrase précédente et exprime l’idée de priver la parole de Dieu de son autorité ou de son effet. La tournure française est claire et conserve la force du verbe grec; « ainsi » explicite le lien logique avec ce qui précède.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette traduction directe et consacrée convient au contexte, où il est question du commandement divin, et maintient le contraste avec « votre tradition ».
- source_word: τῇ παραδόσει ὑμῶν
  choice: par votre tradition
  rationale: '« Par » rend la valeur instrumentale du datif: leur tradition est le moyen par lequel ils rendent la parole de Dieu sans effet. Le possessif conserve exactement l’opposition exprimée par le grec.'
- source_word: ᾗ παρεδώκατε
  choice: que vous avez transmise
  rationale: Le passé composé rend naturellement l’aoriste dans ce contexte et conserve le lien étymologique et conceptuel entre la tradition et ce qui est transmis.
- source_word: παρόμοια τοιαῦτα πολλὰ ποιεῖτε
  choice: vous faites beaucoup d’autres choses semblables
  rationale: La formulation française restitue la pluralité, la similitude et le caractère habituel de ces actes sans reproduire de manière maladroite le chevauchement emphatique des termes grecs.
theological_decisions:
- issue: Nature de la tradition mise en cause
  choice: votre tradition
  alternative: la tradition humaine
  rationale: Le texte grec dit littéralement « votre tradition » et n’emploie pas ici l’adjectif « humaine ». La traduction laisse le contexte montrer que cette tradition particulière s’oppose à la parole de Dieu, sans condamner par ajout toute tradition en général.
- issue: Effet de la tradition sur la parole de Dieu
  choice: rendez ainsi sans effet
  alternative: annulez
  rationale: Cette formulation exprime le fait de priver la parole de sa force effective sans trancher au-delà du texte la question théologique de savoir si la parole de Dieu elle-même pourrait être abolie.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le lien avec le verset précédent, le contraste entre la parole de Dieu et « votre tradition », ainsi que l’accusation d’une pratique répétée.
