  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: fr
  text: Il le prit à part[a], à l’écart de la foule. Puis il mit ses doigts dans les oreilles de l’homme et, après avoir craché[b], lui toucha la langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en privé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit : « après avoir craché, il lui toucha la langue » ; il ne précise pas que Jésus mit de la salive sur la langue de l’homme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: Il le prit à part, loin de la foule
  rationale: Le participe exprime la mise à l’écart de l’homme par rapport à la foule. « Prendre à part » est naturel en français, tandis que « loin de la foule » rend explicitement ἀπὸ τοῦ ὄχλου.
- source_word: κατ’ ἰδίαν
  choice: à part
  rationale: La locution signifie « à l’écart » ou « en privé ». « À part » s’intègre naturellement à l’action décrite sans lui ajouter de motif.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: il mit ses doigts dans les oreilles de l’homme
  rationale: « Mit » rend ici le sens contextuel de βάλλω sans suggérer un geste violent. « De l’homme » lève l’ambiguïté que produirait en français la succession de pronoms possessifs.
- source_word: πτύσας
  choice: après avoir craché
  rationale: Le participe aoriste présente l’action comme antérieure au verbe principal. Cette formulation indique la succession sans préciser où va la salive.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: lui toucha la langue
  rationale: ἅπτομαι avec le génitif signifie ici « toucher ». La construction française avec un pronom indirect et l’article défini est naturelle et identifie clairement la langue comme celle de l’homme.
theological_decisions:
- issue: Description du geste de guérison de Jésus
  choice: Rapporter sobrement que Jésus crache puis touche la langue de l’homme
  alternative: Préciser que Jésus met de sa salive sur la langue de l’homme, ou expliquer la portée symbolique ou médicinale du geste
  rationale: Le grec ne dit ni où Jésus crache ni que la salive est appliquée à la langue. La traduction conserve donc la retenue et l’ambiguïté du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Les gestes concrets sont rendus clairement, avec une légère explicitation du référent de « oreilles » pour éviter une ambiguïté pronominale en français.
