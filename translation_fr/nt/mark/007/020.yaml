  text: ἔλεγεν δὲ ὅτι Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον ἐκεῖνο κοινοῖ τὸν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: fr
  text: 'Il disait : « Ce qui sort de l’être humain, voilà ce qui le rend impur.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souille ». Le verbe grec appartient au vocabulaire de la pureté et signifie rendre quelqu’un souillé ou impur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il disait encore
  rationale: L’imparfait grec présente la parole dans son déroulement ou sa continuité. « Il disait encore » est naturel en français narratif et δέ marque ici une légère progression du discours.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Ce qui sort de l’être humain
  rationale: La construction participiale substantivée se rend naturellement par « ce qui sort ». « L’être humain » exprime ici la portée générique de ἄνθρωπος sans limiter le propos au sexe masculin.
- source_word: ἐκεῖνο
  choice: voilà ce qui
  rationale: Cette tournure restitue l’insistance du démonstratif grec tout en produisant une phrase française naturelle.
- source_word: κοινοῖ
  choice: rend impur
  rationale: Dans ce contexte, κοινόω appartient au vocabulaire de la pureté et signifie rendre profane, souillé ou impur. « Rend impur » conserve explicitement cette catégorie.
theological_decisions:
- issue: Langage de pureté exprimé par κοινόω
  choice: rend impur
  alternative: souille
  rationale: « Rend impur » garde visible l’arrière-plan des catégories de pureté, tandis que « souille » en est une formulation française plus concise et idiomatique. Le texte principal retient la première sans décider à tort que la notion serait uniquement rituelle ou uniquement morale.
translation_notes:
  register: Français moderne, international et digne. La répétition grecque de ἄνθρωπος est allégée par le pronom « le », conformément à l’usage naturel du français, tandis que « voilà ce qui » préserve l’emphase de ἐκεῖνο.
