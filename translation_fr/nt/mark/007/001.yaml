- from: Les pharisiens et quelques-uns des spécialistes de la Loi[a], venus de Jérusalem, se rassemblent autour de lui[b].
  to: Et les pharisiens et quelques-uns des scribes[a], venus de Jérusalem, se rassemblent auprès de lui.
  rationale: La révision rétablit la conjonction narrative, emploie le terme français direct « scribes » et rend la relation exprimée par πρὸς avec « auprès de lui ». Elle maintient le présent narratif, le partitif « quelques-uns des », ainsi que l’ambiguïté grammaticale selon laquelle « venus de Jérusalem » peut qualifier le groupe ainsi présenté.
