  verdict: revise
  source_fidelity: 'La conjonction narrative Καί devrait être rendue : son omission n’est pas nécessaire en français et affaiblit légèrement l’enchaînement de Marc. « Scribes » est le correspondant français direct et usuel de γραμματεῖς; « spécialistes de la Loi » interprète davantage leur rôle. « Auprès de lui » rend plus prudemment συνάγονται πρὸς αὐτόν que « autour de lui », qui peut ajouter une disposition spatiale circulaire non exprimée.'
  naturalness: « Et les pharisiens et quelques-uns des scribes, venus de Jérusalem, se rassemblent auprès de lui » est une phrase naturelle, concise et adaptée au présent narratif. Le terme « scribes » demeure bien établi dans le français biblique et courant, avec une note explicative pour les lecteurs qui le souhaitent.
  terminology: « Pharisiens », « scribes », « Loi » et « Jérusalem » sont les appellations françaises standard. La note conserve l’explication fonctionnelle sans substituer une paraphrase au terme source dans le texte.
  issues:
  - severity: medium
    issue: Καί n’est pas rendu explicitement.
    rationale: En tête de phrase, « Et » est pleinement idiomatique dans une narration biblique sobre et préserve la progression narrative marquée par Καί.
  - severity: medium
    issue: « spécialistes de la Loi » remplace « scribes » dans le texte.
    rationale: Cette expression explicite une fonction souvent associée aux γραμματεῖς, mais elle est moins lexiquement directe et peut suggérer une définition institutionnelle plus étroite. « Scribes », assorti d’une note, préserve mieux le terme source.
  - severity: low
    issue: « autour de lui » précise possiblement la configuration spatiale.
    rationale: πρὸς αὐτόν indique l’orientation ou le mouvement vers Jésus; « auprès de lui » conserve cette relation sans imposer l’image d’un cercle autour de lui.
