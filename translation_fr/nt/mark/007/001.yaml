  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: fr
  text: Et les pharisiens et quelques-uns des scribes[a], venus de Jérusalem, se rassemblent auprès de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les scribes étaient des spécialistes des Écritures et de la Loi.
    reason: Précision culturelle concise sur le terme traditionnel « scribes » (γραμματεῖς), sans remplacer dans le texte son équivalent lexical direct.
lexical_decisions:
- source_word: Καὶ
  choice: '[non rendu explicitement]'
  rationale: En début de nouvel épisode, le français moderne n’exige pas de conjonction. L’enchaînement narratif porté par καί demeure perceptible sans un « Et » lourd ou artificiel.
- source_word: συνάγονται πρὸς αὐτόν
  choice: se rassemblent autour de lui
  rationale: Le présent historique conserve la vivacité du récit de Marc. « Autour de lui » exprime naturellement en français le rassemblement orienté vers Jésus, tout en signalant en note le sens plus littéral de πρός.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe juif.
- source_word: τινες τῶν γραμματέων
  choice: quelques-uns des spécialistes de la Loi
  rationale: « Quelques-uns des » respecte le génitif partitif. « Spécialistes de la Loi » rend de manière compréhensible la fonction de γραμματεῖς dans ce contexte, tandis que le terme traditionnel « scribes » est indiqué en note.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: venus de Jérusalem
  rationale: La tournure participiale concise indique une venue antérieure au rassemblement sans alourdir la phrase. Sa position permet naturellement de la rattacher à l’ensemble du groupe mentionné, comme le fait le masculin pluriel grec.
