lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: il appela ... la foule
  rationale: Le participe aoriste exprime ici une action préalable à la parole; une proposition coordonnée est naturelle en français.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend directement l’idée de répétition.
- source_word: ἔλεγεν
  choice: lui disait
  rationale: L’imparfait conserve l’aspect imperfectif du grec, sans le réduire au simple passé « dit ».
- source_word: Ἀκούσατέ μου πάντες
  choice: Écoutez-moi tous
  rationale: Formulation directe qui garde l’impératif et l’adresse explicite à l’ensemble des auditeurs.
- source_word: σύνετε
  choice: comprenez
  rationale: L’impératif invite les auditeurs à saisir le sens de l’enseignement, sans explicitation supplémentaire.
