id: MRK.7.15
reference: Mark 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: fr
  text: Il n’y a rien d’extérieur à l’être humain qui, en entrant en lui, puisse le rendre impur[a] ; ce sont plutôt les choses qui sortent de l’être humain qui le rendent impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souiller ». Le verbe grec peut désigner le fait de rendre quelqu’un impur, notamment au regard des règles de pureté, tout en prenant dans ce contexte une portée morale.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: rien
  rationale: Le pronom neutre singulier employé absolument se rend naturellement par « rien ».
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: d’extérieur à l’être humain
  rationale: Cette formulation indique la provenance extérieure et prépare le contraste avec ce qui sort de l’être humain.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: l’être humain
  rationale: ἄνθρωπος désigne ici l’être humain de façon générique. Cette expression est naturelle en français moderne et maintient le singulier représentatif.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: en entrant en lui
  rationale: Le gérondif restitue clairement la valeur circonstancielle du participe et son lien avec ce qui vient de l’extérieur.
- source_word: δύναται
  choice: puisse
  rationale: Le subjonctif après la relative portant sur « rien » exprime idiomatiquement en français la capacité envisagée.
- source_word: κοινῶσαι / κοινοῦντα
  choice: rendre impur
  rationale: Dans cette controverse sur la pureté, κοινόω signifie rendre impur ou profaner. « Rendre impur » conserve directement la dimension de pureté sans exclure la portée morale développée ensuite.
- source_word: ἀλλὰ
  choice: plutôt
  rationale: « Plutôt » exprime la correction contrastive forte introduite par ἀλλά.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: les choses qui sortent de l’être humain
  rationale: La traduction garde le pluriel substantivé et le contraste spatial délibéré entre l’extérieur et ce qui sort.
theological_decisions:
- issue: Sens de κοινόω dans une discussion sur la pureté
  choice: rendre impur
  alternative: souiller
  rationale: « Rendre impur » met en évidence le sens lié aux catégories de pureté dans le contexte, tandis que la formulation reste assez large pour permettre la portée morale des versets suivants.
- issue: Valeur générique de ἄνθρωπος
  choice: l’être humain
  alternative: la personne
  rationale: « L’être humain » préserve le singulier générique et le parallélisme des trois occurrences sans donner au masculin grammatical grec une portée exclusivement masculine.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme entre ce qui entre de l’extérieur et ce qui sort de l’être humain, ainsi que la tension entre impureté rituelle et souillure morale.
