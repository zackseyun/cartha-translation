id: MRK.7.31
reference: Mark 7:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: fr
  text: Il quitta de nouveau le territoire de Tyr et, passant par Sidon[a], se rendit à la mer de Galilée en traversant le territoire de la Décapole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en passant par la région de Sidon ». La tournure grecque peut décrire un trajet à travers Sidon ou par cette voie.
    reason: lexical_alternative
  - marker: b
    text: Plus littéralement, « au milieu du territoire de la Décapole »; on peut aussi comprendre « entre les territoires de la Décapole ». L’expression grecque est inhabituelle, et l’itinéraire décrit présente une difficulté géographique.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: Marque la reprise d’un déplacement dans le récit; cette expression est naturelle et concise en français.
- source_word: ἐξελθὼν
  choice: quitta
  rationale: Le participe aoriste exprime une action antérieure au verbe principal; son sens est intégré au verbe français pour obtenir une phrase fluide.
- source_word: ἐκ τῶν ὁρίων Τύρου
  choice: le territoire de Tyr
  rationale: ὅρια désigne ici une étendue territoriale plutôt qu’une ligne frontalière précise.
- source_word: ἦλθεν
  choice: se rendit
  rationale: Dans cette description d’itinéraire, « se rendit » exprime naturellement le déplacement vers la destination sans imposer le point de vue français de « venir ».
- source_word: διὰ Σιδῶνος
  choice: passant par Sidon
  rationale: διά avec le génitif indique un trajet à travers une localité ou par cette voie; la formulation conserve cette valeur spatiale.
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: à la mer de Galilée
  rationale: « Mer de Galilée » est le nom géographique traditionnel et rend directement θάλασσα.
- source_word: ἀνὰ μέσον
  choice: en traversant
  rationale: Cette formulation française rend naturellement l’idée d’un déplacement au milieu ou à travers une zone, tandis qu’une note conserve l’expression plus littérale et son ambiguïté.
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: le territoire de la Décapole
  rationale: Comme plus haut, ὅρια renvoie à une région territoriale; « Décapole » est la forme française établie du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’unité du mouvement narratif tout en évitant une traduction artificiellement littérale des participes grecs. Les notes signalent les deux principales ambiguïtés spatiales sans résoudre silencieusement la difficulté géographique.
