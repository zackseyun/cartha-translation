source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: fr
  text: « En effet, cela ne pénètre pas dans son cœur, mais dans son estomac, puis s’en va dans les latrines », purifiant ainsi tous les aliments.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « … puis s’en va dans les latrines, purifiant ainsi tous les aliments ». Dans cette lecture, le participe final décrit le processus digestif plutôt qu’une remarque explicative de Marc.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: cœur
  rationale: Le terme concret « cœur » préserve le contraste anthropologique du texte entre l’être intérieur et l’appareil digestif, sans le réduire à la pensée ou aux émotions.
- source_word: κοιλίαν
  choice: estomac
  rationale: Dans ce contexte digestif, « estomac » exprime clairement et naturellement le sens de κοιλία en français moderne.
- source_word: ἀφεδρῶνα
  choice: latrines
  rationale: « Latrines » désigne avec précision et dignité le lieu d’évacuation, sans supposer des installations sanitaires modernes.
- source_word: καθαρίζων
  choice: Il purifiait ainsi
  rationale: Cette formulation reste proche du participe grec et évite d’ajouter explicitement « déclarait purs ». Le pronom renvoie, dans la lecture principale, à Jésus, tandis que la note conserve l’autre analyse possible.
- source_word: πάντα τὰ βρώματα
  choice: tous les aliments
  rationale: Le pluriel français reflète le pluriel grec et convient au débat sur les différentes catégories d’aliments.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif singulier reprend naturellement la personne dont Jésus décrit le cœur et l’appareil digestif.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: pénètre / s’en va
  rationale: Ces verbes rendent simplement le mouvement d’entrée puis de sortie présent dans le grec.
theological_decisions:
- issue: Interprétation de καθαρίζων πάντα τὰ βρώματα
  choice: 'Incise narrative : Jésus purifiait ainsi tous les aliments'
  alternative: 'Description du processus digestif : ce qui est évacué purge ainsi tous les aliments'
  rationale: Le participe masculin singulier peut être compris comme une remarque explicative de Marc portant sur l’effet de l’enseignement de Jésus. Cependant, son rattachement au processus digestif demeure une lecture ancienne et grammaticalement discutée ; la note la conserve sans effacer la portée théologique de l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Latrines » garde le caractère concret de l’image sans vulgarité. La formulation principale demeure proche du grec tout en marquant l’incise narrative par un tiret.
