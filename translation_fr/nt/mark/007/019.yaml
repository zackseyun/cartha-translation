- from: « En effet, cela ne pénètre pas dans son cœur, mais dans son estomac, puis s’en va dans les latrines. » — Il purifiait ainsi tous les aliments.[a]
  to: « En effet, cela ne pénètre pas dans son cœur, mais dans son estomac, puis s’en va dans les latrines », purifiant ainsi tous les aliments.[a]
  rationale: 'La révision remplace le verbe fini interprétatif par « purifiant », qui correspond formellement et sémantiquement au participe grec καθαρίζων. Elle conserve l’ambiguïté réelle quant au rattachement de ce participe : la formulation peut fonctionner comme une brève remarque éditoriale, tandis que la note indique l’analyse physiologique alternative. La note ne substitue plus « évacuant » au sens de καθαρίζων.'
