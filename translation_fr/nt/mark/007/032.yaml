source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: fr
  text: On lui amène un homme sourd qui a du mal à parler[a], et on le supplie de poser la main sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « un homme sourd et parlant avec difficulté ».'
    reason: Alternative lexicale reflétant plus directement la coordination grecque.
lexical_decisions:
- source_word: φέρουσιν
  choice: on lui amène
  rationale: Le présent historique, fréquent chez Marc, est conservé, car il est naturel dans le récit français et rend la scène vivante.
- source_word: κωφόν
  choice: un homme sourd
  rationale: κωφός désigne ici la surdité; le terme suivant décrit séparément la difficulté d’élocution.
- source_word: μογιλάλον
  choice: qui a du mal à parler
  rationale: Ce terme rare désigne une parole difficile ou entravée, sans impliquer nécessairement une incapacité totale à parler.
- source_word: παρακαλοῦσιν
  choice: on le supplie
  rationale: Dans ce contexte de guérison, le verbe exprime une demande insistante et pressante, plus forte qu’une simple requête.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: de poser la main sur lui
  rationale: La formulation exprime naturellement en français le contenu de la demande et conserve le singulier de χεῖρα.
theological_decisions:
- issue: Nature du handicap de l’homme
  choice: Il est sourd et a du mal à parler.
  alternative: Il est sourd-muet.
  rationale: La juxtaposition de κωφός et μογιλάλος distingue la surdité d’une difficulté d’élocution; traduire « muet » exagérerait la portée du second terme.
translation_notes:
  register: Français moderne, clair et digne. Le pronom indéfini « on » rend naturellement les verbes grecs à la troisième personne du pluriel sans référent exprimé; le présent historique de Marc est maintenu.
