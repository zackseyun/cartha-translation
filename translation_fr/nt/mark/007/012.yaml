  text: ⸀οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι τῷ ⸀πατρὶ ἢ τῇ ⸀μητρί,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: fr
  text: vous ne le laissez plus rien faire pour son père ou sa mère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous ne le laissez plus rien faire pour aider son père ou sa mère ». Dans ce contexte, la formulation grecque générale peut inclure une aide concrète ou financière.'
    reason: Alternative lexicale précisant une nuance contextuelle sans l’introduire dans le texte principal.
lexical_decisions:
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Rend naturellement en français la cessation exprimée par l’adverbe grec.
- source_word: ἀφίετε
  choice: laissez
  rationale: Dans ce contexte, le verbe signifie permettre ou autoriser, et non pardonner ou abandonner.
- source_word: αὐτὸν
  choice: le
  rationale: Conserve le complément masculin singulier désignant celui qui pourrait agir en faveur de ses parents.
- source_word: οὐδὲν
  choice: rien
  rationale: Avec « laisser » et l’infinitif, « ne le laissez plus rien faire » exprime l’interdiction de toute action.
- source_word: ποιῆσαι
  choice: faire
  rationale: Reproduit le caractère général du verbe grec sans préciser indûment le type d’aide.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: pour son père ou sa mère
  rationale: « Pour » exprime ici le bénéficiaire; le possessif est naturel en français et le contexte montre qu’il s’agit de ses propres parents.
theological_decisions:
- issue: Faut-il expliciter l’idée d’une aide matérielle ou financière suggérée par le contexte du corban ?
  choice: Garder la formulation générale « rien faire pour son père ou sa mère »
  alternative: « ne plus rien faire pour aider son père ou sa mère » ou « ne plus subvenir aux besoins de son père ou de sa mère »
  rationale: Le contexte implique une aide concrète, possiblement matérielle, mais le grec du verset reste général. La traduction conserve donc cette latitude sans réduire le sens.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe « ne le laissez plus rien faire » reste naturelle tout en suivant de près la structure et la portée générale du grec.
