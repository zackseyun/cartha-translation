id: MRK.7.22
reference: Mark 7:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: fr
  text: les adultères, la cupidité, la méchanceté, la tromperie, la débauche, un regard mauvais[a], les paroles injurieuses[b], l’orgueil, la folie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « un œil mauvais »; expression pouvant désigner un regard envieux, mesquin ou malveillant.
    reason: lexical_alternative
  - marker: b
    text: Ou « la calomnie » ou « le blasphème ». Le terme grec peut désigner des paroles outrageantes contre des personnes ou contre Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: les adultères
  rationale: Le pluriel grec désigne des actes d’adultère. Le pluriel français conserve la structure de l’énumération sans alourdir le texte par « actes d’adultère ».
- source_word: πλεονεξίαι
  choice: la cupidité
  rationale: Le terme exprime le désir avide d’avoir davantage, souvent aux dépens d’autrui. Le singulier collectif est plus naturel en français dans une liste de vices.
- source_word: πονηρίαι
  choice: la méchanceté
  rationale: Le pluriel grec peut englober diverses manifestations du mal moral. Le nom collectif français en rend naturellement l’étendue.
- source_word: δόλος
  choice: la tromperie
  rationale: Ce choix rend clairement l’idée d’une volonté de duper, dans un français actuel.
- source_word: ἀσέλγεια
  choice: la débauche
  rationale: Le mot grec évoque une conduite éhontée et sans retenue, souvent sexuelle. « Débauche » en conserve la forte portée morale mieux que « sensualité » en français moderne.
- source_word: ὀφθαλμὸς πονηρός
  choice: un regard mauvais
  rationale: Cette formulation conserve l’image grecque tout en restant compréhensible en français; la note explicite sa valeur idiomatique d’envie ou de malveillance.
- source_word: βλασφημία
  choice: les paroles injurieuses
  rationale: Le grec peut désigner des propos outrageants dirigés contre des êtres humains ou contre Dieu. Cette formulation large évite de trancher silencieusement entre calomnie et blasphème.
- source_word: ὑπερηφανία
  choice: l’orgueil
  rationale: Le nom désigne l’arrogance et l’élévation de soi; « orgueil » est concis, naturel et adapté au registre.
- source_word: ἀφροσύνη
  choice: la folie
  rationale: Il s’agit d’un manque de discernement moral et pratique, et non d’une déficience intellectuelle. Dans ce contexte sapientiel, « folie » exprime bien cette nuance.
theological_decisions:
- issue: Portée de βλασφημία dans la liste de vices
  choice: les paroles injurieuses
  alternative: la calomnie; le blasphème
  rationale: Le contexte permet une offense verbale envers autrui, mais le terme peut aussi viser une parole outrageante contre Dieu. Le texte principal garde cette amplitude, et la note préserve les deux lectures.
translation_notes:
  register: Français international moderne, digne et accessible. Les premiers pluriels grecs sont rendus par des noms collectifs singuliers lorsque le pluriel serait peu naturel en français. Les marqueurs de note ont été placés auprès des expressions qu’ils expliquent.
