id: MRK.7.3
reference: Mark 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: fr
  text: En effet, les pharisiens et tous les Juifs ne mangent pas sans s’être lavé les mains avec le poing[a], conformément à la tradition des anciens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « avec le poing »; peut-être « jusqu’au poignet » ou « soigneusement ». Le terme grec est difficile et désigne probablement une manière particulière de pratiquer le lavage rituel des mains.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit naturellement en français l’explication parenthétique donnée par Marc.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Désignation française courante de ce groupe juif.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: tous les Juifs
  rationale: Reproduit la généralisation explicite du grec sans la restreindre aux habitants de la Judée ni la remplacer par « beaucoup ».
- source_word: ἐὰν μὴ
  choice: sans
  rationale: Avec l’infinitif passé, rend naturellement la condition négative dans cette phrase française.
- source_word: πυγμῇ
  choice: avec le poing
  rationale: Conserve dans le texte la formulation concrète mais difficile du grec, sans trancher entre ses diverses interprétations; celles-ci sont signalées en note.
- source_word: νίψωνται τὰς χεῖρας
  choice: s’être lavé les mains
  rationale: Exprime clairement le lavage d’une partie du corps et l’antériorité de l’action par rapport au repas.
- source_word: οὐκ ἐσθίουσιν
  choice: ne mangent pas
  rationale: Rend simplement le présent d’habitude, sans ajouter d’objet absent du grec.
- source_word: κρατοῦντες
  choice: conformément à
  rationale: Exprime ici de manière naturelle l’observance et l’attachement pratique à la tradition, sans alourdir la phrase.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: la tradition des anciens
  rationale: Formulation française établie qui conserve le lien génitif entre la tradition transmise et les anciens.
theological_decisions:
- issue: Portée de « tous les Juifs »
  choice: Maintien de la formulation générale « tous les Juifs ».
  alternative: « tous les Judéens » ou « beaucoup de Juifs »
  rationale: Le grec porte explicitement πάντες, et le contexte présente une généralisation explicative. La traduction n’en réduit donc pas la portée, sans pour autant imposer une lecture statistique absolue.
- issue: Sens de πυγμῇ
  choice: « avec le poing » dans le texte, accompagné d’une note.
  alternative: « jusqu’au poignet », « soigneusement » ou « à fond »
  rationale: Le terme est notoirement difficile et peut désigner une manière ou une étendue particulière du lavage rituel. La formulation littérale préserve la difficulté plutôt que de résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » convient à une remarque explicative; « conformément à » évite un calque pesant tout en gardant l’idée d’observance. La note préserve l’incertitude lexicale de πυγμῇ.
