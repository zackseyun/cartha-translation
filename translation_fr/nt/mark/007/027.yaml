reference: Mark 7:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: fr
  text: 'Et il lui disait : « Laisse d’abord les enfants manger à leur faim, car il n’est pas bon de prendre le pain des enfants et de le jeter aux petits chiens[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chiens domestiques », ou simplement « chiens ». Le grec emploie un diminutif qui peut évoquer de petits chiens vivant dans la maison plutôt que des chiens errants.
    reason: Préciser la nuance lexicale de κυναρίοις sans imposer dans le texte principal une interprétation trop étroite du diminutif.
lexical_decisions:
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et en conserve l’aspect duratif, sans la lourdeur de « il était en train de dire ».
- source_word: Ἄφες
  choice: Laisse
  rationale: 'L’impératif est ici idiomatique : il invite à permettre que l’action suivante ait lieu.'
- source_word: πρῶτον
  choice: d’abord
  rationale: « D’abord » exprime clairement la priorité temporelle tout en laissant ouverte la possibilité d’une étape ultérieure.
- source_word: χορτασθῆναι
  choice: manger à leur faim
  rationale: Le verbe désigne le fait d’être rassasié. Cette formulation naturelle conserve à la fois l’action de manger et l’idée de satiété dans l’image du repas.
- source_word: τὰ τέκνα
  choice: les enfants
  rationale: Équivalent courant qui maintient la métaphore familiale sans préciser davantage l’âge, le sexe ou les référents.
- source_word: καλόν ἐστιν
  choice: il n’est pas bon
  rationale: Cette traduction rend directement καλόν et laisse subsister la nuance entre ce qui est bon et ce qui convient, sans imposer une reformulation morale plus étroite.
- source_word: λαβεῖν
  choice: prendre
  rationale: Équivalent direct et naturel ; le contexte indique suffisamment que le pain est détourné des enfants.
- source_word: ἄρτον
  choice: pain
  rationale: Le terme concret préserve l’image domestique et scripturaire, contrairement au terme plus général « nourriture ».
- source_word: κυναρίοις
  choice: petits chiens
  rationale: Le diminutif grec évoque de petits chiens, vraisemblablement domestiques, plutôt que les chiens errants souvent désignés par le terme non diminutif.
- source_word: βαλεῖν
  choice: le jeter aux
  rationale: « Jeter » conserve la vivacité de βάλλω ; le pronom « le » reprend naturellement « le pain » en français.
theological_decisions:
- issue: Portée métaphorique des « enfants » et des « petits chiens »
  choice: Conserver la métaphore domestique sans identifier explicitement ses référents dans le texte.
  alternative: Remplacer ou expliciter les images par « Israël/les Juifs » et « les non-Juifs ».
  rationale: Le grec formule une image plutôt qu’une explication. La conserver respecte le récit et évite d’introduire dans la traduction une interprétation absente de la phrase.
- issue: Nuance de πρῶτον
  choice: Conserver la priorité séquentielle avec « d’abord ».
  alternative: Omettre cette nuance pour ne garder que la priorité accordée aux enfants.
  rationale: 'Le mot maintient une tension importante : les enfants ont la priorité, mais cette priorité ne signifie pas nécessairement l’exclusion définitive des autres.'
translation_notes:
  register: Français international moderne, naturel et digne. « Il lui disait » conserve l’imparfait grec ; « manger à leur faim » rend idiomatiquement la notion de rassasiement. La métaphore familiale et sa tension restent intactes.
