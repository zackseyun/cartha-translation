    rationale: La formulation actuelle juxtapose « Corban » et « ce dont tu aurais pu bénéficier » sans verbe, avec un tiret et des points de suspension. Le grec peut employer cette formulation nominale, mais le français exige ici « est » pour expliciter que le bénéfice potentiel est déclaré Corban.
