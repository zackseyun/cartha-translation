  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: fr
  text: 'Mais vous, vous dites : « Si quelqu’un dit à son père ou à sa mère : “Corban” — c’est-à-dire un don[a] — est tout ce dont tu pourrais bénéficier de ma part. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « corban » désigne ici quelque chose consacré comme don à Dieu et, de ce fait, soustrait à l’usage familial ordinaire. On peut aussi traduire « un don » par « une offrande ».
    reason: Note culturelle et variante lexicale.
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Mais vous, vous dites
  rationale: δὲ marque ici le contraste avec le commandement divin cité auparavant. La reprise du pronom « vous » rend l’insistance de ὑμεῖς tout en restant naturelle en français.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Si quelqu’un dit
  rationale: ἐὰν avec le subjonctif aoriste présente un cas éventuel. « Si quelqu’un dit » est idiomatique et conserve la portée représentative de ἄνθρωπος sans suggérer que le principe ne concernerait que les hommes.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: à son père ou à sa mère
  rationale: Le datif désigne les personnes auxquelles on s’adresse; la répétition de « à sa » préserve le parallélisme grec.
- source_word: Κορβᾶν
  choice: Corban
  rationale: Le texte grec conserve ce terme sémitique; sa translittération maintient la couleur historique et religieuse du propos, tandis que la glose de Marc et la note en explicitent le sens.
- source_word: ὅ ἐστιν Δῶρον
  choice: c’est-à-dire un don
  rationale: δῶρον signifie directement « don » et peut, dans ce contexte, désigner une offrande. La formulation reproduit la glose explicative donnée par Marc.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ce dont tu aurais pu bénéficier de ma part
  rationale: La construction relative avec ἐὰν a une valeur indéfinie. Le conditionnel passé rend naturellement en français l’aide que le parent aurait autrement pu recevoir; « bénéficier » laisse ouverte la nature exacte, matérielle ou autre, de cette aide.
theological_decisions:
- issue: Formule de consécration Κορβᾶν dans le contexte d’un don réservé à Dieu
  choice: Conserver « Corban » dans le texte et reprendre la glose de Marc, « c’est-à-dire un don », avec une note culturelle.
  alternative: Traduire directement par « offrande » ou « don consacré à Dieu ».
  rationale: Le grec préserve lui-même le mot sémitique avant de l’expliquer. Cette solution garde la spécificité historique sans préciser au-delà du texte les mécanismes ou les effets juridiques du vœu.
- issue: Portée de ἄνθρωπος
  choice: Traduire par « quelqu’un ».
  alternative: Traduire par « un homme ».
  rationale: Dans cette phrase conditionnelle, ἄνθρωπος a une portée représentative et non un contraste de sexe. « Quelqu’un » exprime cette généralité sans modifier l’exemple familial.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure suspendue, comme en grec, puisque la conséquence syntaxique se poursuit au verset 12; les points de suspension le signalent. Le tutoiement appartient à la citation adressée au père ou à la mère.
