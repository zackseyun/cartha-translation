  source_fidelity: 'La translittération « Corban » et la glose « c’est-à-dire un don » correspondent bien à Κορβᾶν, ὅ ἐστιν Δῶρον. En revanche, « ce dont tu aurais pu bénéficier » emploie un conditionnel passé qui oriente indûment l’énoncé vers un bénéfice révolu ou contrefactuel. La construction grecque ὃ ἐὰν ... ὠφεληθῇς est indéfinie et prospective : « tout ce dont tu pourrais bénéficier ». L’ajout de « est » est requis pour former une phrase française complète tout en rendant la prédication implicite du grec.'
  naturalness: '« Corban — c’est-à-dire un don — est tout ce dont tu pourrais bénéficier de ma part » est clair, naturel dans un registre biblique moderne et conserve l’adresse au singulier au parent. Le maintien de la phrase ouverte par des points de suspension n’est pas nécessaire ici : le verset forme déjà l’exemple cité, même si Jésus en tire ensuite la conséquence au verset suivant.'
  terminology: « Corban » doit être conservé comme emprunt sémitique, avec la glose de Marc. « Don » est le correspondant direct de δῶρον; « offrande » peut figurer comme alternative en note. « Quelqu’un » rend adéquatement la portée générique de ἄνθρωπος en français contemporain.
