id: MRK.7.18
reference: Mark 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: fr
  text: 'Il leur dit : « Êtes-vous donc, vous aussi, si dépourvus de discernement ? Ne comprenez-vous pas que tout ce qui entre dans l’être humain de l’extérieur ne peut le rendre impur[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le souiller ». Le verbe grec évoque ici particulièrement l’impureté rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit en français, sans modifier la fonction narrative.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: Vous aussi, êtes-vous donc
  rationale: Cette formulation idiomatique conserve l’insistance sur les disciples et la force de la réprimande étonnée.
- source_word: ἀσύνετοί
  choice: sans intelligence
  rationale: L’expression désigne ici le manque de compréhension ou de discernement et maintient le lien lexical avec la question suivante.
- source_word: οὐ νοεῖτε
  choice: Ne comprenez-vous pas
  rationale: « Comprendre » exprime clairement le sens cognitif du verbe dans ce contexte.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: rien de ce qui entre … depuis l’extérieur
  rationale: Avec la négation qui porte sur la capacité de souiller, cette tournure française rend naturellement la portée générale de πᾶν et le mouvement depuis l’extérieur.
- source_word: εἰς τὸν ἄνθρωπον
  choice: dans l’être humain
  rationale: « L’être humain » conserve le singulier générique de ἄνθρωπος sans limiter l’énoncé aux hommes de sexe masculin.
- source_word: κοινῶσαι
  choice: rendre impur
  rationale: Dans la controverse sur la pureté, cette expression rend directement l’idée de faire passer quelqu’un à l’état d’impureté, notamment rituelle.
theological_decisions:
- issue: Portée de la terminologie de pureté κοινόω
  choice: rendre impur
  alternative: souiller
  rationale: « Rendre impur » garde au premier plan le cadre rituel de la discussion sans exclure les résonances plus larges du terme; « souiller » pourrait être compris principalement comme une corruption morale.
translation_notes:
  register: Français moderne, courant et digne. La syntaxe interrogative garde la vigueur de la réprimande, tandis que « l’être humain » exprime naturellement la valeur générique de ἄνθρωπος. La virgule finale signale que la phrase se poursuit au verset suivant.
