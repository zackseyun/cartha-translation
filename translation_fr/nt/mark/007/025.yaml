id: MRK.7.25
reference: Mark 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: fr
  text: Mais dès qu’elle entendit parler de lui, une femme dont la petite fille[a] avait un esprit impur[b] vint se jeter à ses pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec est un diminutif de « fille » ; on pourrait aussi traduire par « fillette ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « esprit impur » ; traditionnellement compris aussi comme un démon.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Conserve la légère opposition ou transition avec le contexte précédent.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: dès qu’elle entendit parler de lui
  rationale: Rend naturellement en français l’immédiateté liée au fait d’entendre parler de Jésus, tout en exprimant la valeur circonstancielle du participe.
- source_word: γυνὴ
  choice: une femme
  rationale: Le nom sans article introduit une nouvelle personne dans le récit.
- source_word: θυγάτριον
  choice: petite fille
  rationale: Reproduit la nuance diminutive et affective du grec ainsi que le lien filial, malgré l’ambiguïté possible de l’expression française hors contexte.
- source_word: πνεῦμα ἀκάθαρτον
  choice: esprit impur
  rationale: Conserve la terminologie caractéristique de Marc et ses connotations de souillure, sans la remplacer par l’interprétation plus explicite « démon ».
- source_word: ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: vint se jeter à ses pieds
  rationale: Expression française naturelle qui maintient le déplacement, le geste physique et l’attitude de supplication.
theological_decisions:
- issue: Sens de πνεῦμα ἀκάθαρτον
  choice: esprit impur
  alternative: démon
  rationale: La traduction retenue suit directement les mots grecs et préserve le vocabulaire propre à Marc. « Démon » correspond à l’interprétation traditionnelle du référent, mais est moins transparent lexicalement.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « dès qu’elle entendit » évite un participe présent lourd et préserve le lien entre l’audition et la réaction immédiate. « Se jeter à ses pieds » exprime l’urgence et l’humilité sans préciser davantage la posture.
