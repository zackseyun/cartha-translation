id: MRK.7.17
reference: Mark 7:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: fr
  text: Quand il entra dans une maison, à l’écart de la foule, ses disciples l’interrogèrent sur la parabole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole figurée » ou « la comparaison ». Le mot grec est παραβολή.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Quand
  rationale: Le français narratif rend naturellement la transition et la circonstance temporelle par « Quand » ; ne pas traduire Καί séparément évite une coordination lourde sans perdre la continuité du récit.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: il fut entré dans une maison
  rationale: « Une maison » respecte l’absence d’article devant οἶκον. Le plus-que-parfait antérieur « fut entré » situe clairement l’entrée avant la question des disciples tout en conservant la valeur du verbe de mouvement.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: loin de la foule
  rationale: Cette formulation française naturelle exprime la séparation d’avec la foule indiquée par ἀπό, sans préciser davantage le lieu.
- source_word: ἐπηρώτων
  choice: l’interrogèrent
  rationale: Le passé simple convient au récit. « Interrogèrent » peut suggérer une demande soutenue, compatible avec l’imparfait grec, sans imposer une répétition explicite.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Rendu français idiomatique et fidèle de la construction possessive.
- source_word: τὴν παραβολήν
  choice: la parabole
  rationale: « Parabole » correspond directement à παραβολή et conserve la manière dont Marc qualifie cet enseignement figuré, sans le réduire à une simple parole.
theological_decisions:
- issue: Sens de παραβολή dans un contexte où l’enseignement précédent peut aussi être compris comme une parole figurée
  choice: la parabole
  alternative: la parole figurée ; la comparaison
  rationale: Le terme direct « parabole » préserve la catégorie employée par Marc ainsi que l’éventuelle tension entre la forme brève de l’enseignement et sa désignation comme παραβολή.
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase conserve la séparation d’avec la foule et l’ambiguïté lexicale de παραβολή au moyen d’une note.
