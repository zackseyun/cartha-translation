source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: fr
  text: 'Et, quand ils reviennent de la place du marché, ils ne mangent pas sans s’être lavés[a]. Et il y a beaucoup d’autres choses qu’ils ont reçues à observer : les lavages de coupes, de cruches, de récipients en cuivre et de lits[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans s’être immergés ». Le grec emploie une forme du verbe souvent traduit par « baptiser », mais il désigne ici un lavage rituel dans le cadre des coutumes de pureté.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits omettent « et de lits ».
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: place du marché
  rationale: Le terme désigne l’espace public où se tient le marché. « Place du marché » exprime clairement ce lieu en français moderne.
- source_word: βαπτίσωνται
  choice: s’être lavés
  rationale: Dans ce contexte de pureté rituelle avant le repas, le verbe désigne un lavage de la personne. Cette formulation rend aussi la valeur réfléchie de la forme grecque sans introduire une connotation sacramentelle.
- source_word: παρέλαβον κρατεῖν
  choice: pratiques qu’ils ont reçues … [et qu’]ils observent
  rationale: La construction évoque des usages reçus puis maintenus. « Reçues » conserve l’idée de transmission reçue, tandis qu’« observent » rend le fait de les garder effectivement.
- source_word: βαπτισμοὺς
  choice: lavages
  rationale: Le nom désigne ici les lavages rituels d’objets. « Lavages » est concret et n’impose ni le vocabulaire du baptême ni une méthode unique de purification.
- source_word: ξεστῶν
  choice: cruches
  rationale: Le mot désigne un récipient tel qu’une cruche ou un pichet. « Cruches » est courant, concret et suffisamment large.
- source_word: χαλκίων
  choice: récipients en cuivre
  rationale: Le terme désigne des objets ou récipients faits de cuivre ou d’un alliage cuivreux. Cette traduction reste claire sans préciser indûment l’alliage.
- source_word: κλινῶν
  choice: banquettes de repas
  rationale: κλίνη peut désigner un lit ou une couche. Dans le cadre des repas antiques pris en position allongée, « banquettes de repas » communique naturellement la fonction probable de ces meubles.
- source_word: ἄλλα πολλά
  choice: beaucoup d’autres pratiques
  rationale: Littéralement, le grec dit « beaucoup d’autres choses ». « Pratiques » explicite légèrement la référence contextuelle aux usages observés, sans les qualifier théologiquement.
theological_decisions:
- issue: Sens de βαπτίσωνται et βαπτισμοὺς dans un contexte de pureté rituelle
  choice: Traduire par « s’être lavés » et « lavages ».
  alternative: « s’être immergés » et « immersions », ou employer le vocabulaire du baptême.
  rationale: Le passage traite de coutumes de pureté liées au repas, non du baptême chrétien. Le choix retenu évite une association sacramentelle anachronique tout en signalant en note la possibilité lexicale de l’immersion.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’enchaînement explicatif du grec et son tiret final. « Quand ils reviennent » rend idiomatiquement l’idée de provenance exprimée par « depuis la place du marché ».
