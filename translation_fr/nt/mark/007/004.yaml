review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement ἀπ’ ἀγορᾶς et βαπτίσωνται dans le contexte de pureté. En revanche, « beaucoup d’autres pratiques » restreint ἄλλα πολλά (« beaucoup d’autres choses »), et « banquettes de repas » interprète κλινῶν de façon trop spécifique. Le texte source désigne plus largement des lits ou couches, sans préciser nécessairement leur usage au repas.
  naturalness: Le français est globalement fluide. « Beaucoup d’autres choses qu’ils ont reçues à observer » est à la fois naturel et plus proche de la construction grecque. « Lits » est une désignation moderne et non ambiguë ici, là où « banquettes de repas » est moins naturel et culturellement trop explicatif.
  terminology: « S’être lavés » et « lavages » conviennent au contexte rituel sans introduire le vocabulaire sacramentel. « Récipients en cuivre » est acceptable, tout en laissant ouverte la possibilité d’un alliage cuivreux. La note lexicale conserve utilement l’alternative « immergés ».
  issues:
