    issue: « pratiques » au lieu de « choses »
    rationale: Ἄλλα πολλά est volontairement large. Le contexte concerne des usages, mais le grec ne les nomme pas explicitement « pratiques »; cette précision peut être évitée.
  - severity: medium
    issue: « banquettes de repas » pour κλινῶν
    rationale: Κλίνη peut désigner un lit ou une couche. L’ajout de « de repas » fixe une interprétation culturelle plausible mais non explicitement exprimée et réduit l’ambiguïté du terme.
