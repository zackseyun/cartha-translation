id: MRK.11.31
reference: Mark 11:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: fr
  text: 'Ils discutaient entre eux : « Que devons-nous répondre ? Si nous disons : “Du ciel”[a], il dira : “Pourquoi donc ne l’avez-vous pas cru ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Du ciel » est une manière juive respectueuse de dire « de Dieu » ou « d’origine divine ».
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: discutaient
  rationale: L’imparfait exprime une délibération en cours. En français actuel, « discutaient » rend naturellement l’échange raisonné au sein du groupe.
- source_word: πρὸς ἑαυτοὺς
  choice: entre eux
  rationale: L’expression indique une concertation réciproque entre les membres du groupe, plutôt qu’une réflexion purement intérieure.
- source_word: λέγοντες
  choice: introduit par les deux-points
  rationale: Le participe introduit le contenu de leur discussion. En français, les deux-points évitent le lourd « en disant » tout en conservant clairement ce lien.
- source_word: Τί εἴπωμεν;
  choice: Que devons-nous répondre ?
  rationale: Le subjonctif délibératif porte sur la réponse à donner à Jésus. « Devons-nous » restitue la délibération, et « répondre » explicite naturellement le sens contextuel de « dire ».
- source_word: ἐὰν εἴπωμεν
  choice: Si nous disons
  rationale: Cette formulation simple et idiomatique reproduit directement la proposition conditionnelle grecque.
- source_word: Ἐξ οὐρανοῦ
  choice: Du ciel
  rationale: La traduction conserve l’expression grecque et son idiome juif révérenciel, au lieu de remplacer dans le texte « ciel » par l’interprétation explicite « Dieu ».
- source_word: ἐρεῖ
  choice: il dira
  rationale: Le futur de λέγω annonce directement la réaction attendue de Jésus; la citation qui suit en manifeste la forme interrogative.
- source_word: Διὰ τί οὖν
  choice: Pourquoi donc
  rationale: « Donc » maintient la conséquence logique que Jésus tirerait de leur réponse hypothétique.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: ne l’avez-vous pas cru
  rationale: Avec le datif, πιστεύω signifie ici croire une personne, c’est-à-dire accepter son témoignage. « Croire en lui » introduirait une nuance plus forte qui n’est pas imposée par la construction.
theological_decisions:
- issue: Sens de « du ciel » à propos du baptême ou de l’autorité de Jean
  choice: Conserver « Du ciel » dans le texte principal
  alternative: « De Dieu »
  rationale: L’expression désigne une origine ou une autorisation divine par un idiome juif révérenciel. La conserver respecte la formulation source et sa portée rhétorique sans transformer l’interprétation en texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue demeure direct; « répondre » clarifie la situation conversationnelle, tandis que « Du ciel » préserve l’idiome et l’ambiguïté culturelle du grec.
