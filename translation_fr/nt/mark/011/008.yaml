  text: ⸂καὶ πολλοὶ⸃ τὰ ἱμάτια αὐτῶν ἔστρωσαν εἰς τὴν ὁδόν, ἄλλοι δὲ στιβάδας ⸂κόψαντες ἐκ τῶν ἀγρῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: fr
  text: Beaucoup étendirent leurs manteaux sur le chemin, et d’autres y répandirent des branchages[a] qu’ils avaient coupés dans les champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des rameaux » ; le mot grec désigne plus largement des végétaux coupés, du feuillage ou des branchages, et non précisément des branches de palmier.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend directement l’adjectif quantitatif sans ajouter d’intensité absente du grec; le contexte permet naturellement l’emploi substantivé.
- source_word: ἱμάτια
  choice: manteaux
  rationale: Dans cette scène, il s’agit de vêtements extérieurs déposés sur le chemin; « manteaux » est courant et plus précis que « vêtements ».
- source_word: ἔστρωσαν
  choice: étendirent
  rationale: Le verbe désigne l’action d’étaler ou de disposer sur une surface; « étendirent » convient naturellement aux manteaux.
- source_word: εἰς τὴν ὁδόν
  choice: sur le chemin
  rationale: Avec στρώννυμι, εἰς exprime ici la mise sur la surface du chemin plutôt qu’un mouvement à traduire littéralement par « dans ».
- source_word: ἄλλοι δὲ
  choice: et d’autres
  rationale: δέ marque ici une légère transition ou addition; « et d’autres » évite de renforcer indûment le contraste.
- source_word: στιβάδας
  choice: branchages
  rationale: Le terme peut désigner des jonchées, des masses de feuillage ou des rameaux coupés. « Branchages » restitue cette réalité végétale collective sans préciser à tort qu’il s’agit de palmes.
- source_word: κόψαντες
  choice: coupés
  rationale: Le participe aoriste indique que les végétaux avaient été coupés avant d’être répandus; le participe passé français l’exprime avec fluidité.
- source_word: ἐκ τῶν ἀγρῶν
  choice: dans les champs
  rationale: La préposition ἐκ indique l’origine, mais avec l’action de couper, le français idiomatique dit que les branchages ont été « coupés dans les champs ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Y répandirent » reprend clairement « sur le chemin » sans répétition lourde. Le choix « branchages » conserve l’étendue sémantique du grec et évite d’importer les palmes mentionnées dans l’Évangile selon Jean.
