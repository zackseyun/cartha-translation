  rationale: La révision remplace le simple participe « coupés dans les champs » par une relative au plus-que-parfait. Elle exprime clairement l’antériorité du participe aoriste κόψαντες et préserve le rapport des branchages avec les champs exprimé par ἐκ τῶν ἀγρῶν. Le reste du texte et la note sont maintenus, avec une ponctuation française normalisée dans la note.
