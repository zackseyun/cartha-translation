  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: fr
  text: Quand ils approchent de Jérusalem, du côté de Bethphagé et de Béthanie, près du mont des Oliviers[a], il envoie[b] deux de ses disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire les indications spatiales plus littéralement : « vers Bethphagé et Béthanie, en direction du mont des Oliviers ».'
    reason: lexical_alternative
  - marker: b
    text: 'Marc emploie souvent le présent historique dans son récit ; on pourrait donc aussi traduire : « il envoya ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν εἰς Ἱεροσόλυμα
  choice: ils approchent de Jérusalem
  rationale: Le présent grec est conservé afin de respecter le présent historique caractéristique du récit de Marc. En français, « approcher de Jérusalem » exprime naturellement le mouvement vers la ville.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: du côté de Bethphagé et de Béthanie
  rationale: La reprise de εἰς situe leur approche dans la zone de ces deux localités. « Du côté de » rend cette localisation de manière naturelle sans imposer l’idée qu’ils entrent successivement dans les deux villages.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: près du mont des Oliviers
  rationale: Dans ce contexte spatial, πρός peut indiquer la proximité ou l’orientation. « Près de » convient à la localisation générale, tandis que l’autre possibilité est signalée en note.
- source_word: ἀποστέλλει
  choice: il envoie
  rationale: Le présent historique grec est maintenu pour préserver la vivacité narrative de Marc; « il envoya » reste possible dans un récit français au passé.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: deux de ses disciples
  rationale: Cette formulation rend directement et naturellement la construction partitive grecque.
- source_word: Βηθφαγὴ
  choice: Bethphagé
  rationale: Forme française traditionnelle et aisément reconnaissable du nom de lieu.
- source_word: Βηθανίαν
  choice: Béthanie
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: mont des Oliviers
  rationale: Désignation française consacrée de ce lieu, qui conserve le rapport génitif du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le présent historique est conservé, tandis que « du côté de » évite une succession géographique artificielle et laisse en note l’autre lecture possible des prépositions spatiales.
