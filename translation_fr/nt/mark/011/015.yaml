source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: fr
  text: Ils arrivent à Jérusalem. Entré dans le Temple[a], il se mit à chasser ceux qui vendaient et ceux qui achetaient dans le Temple, et renversa les tables des changeurs de monnaie et les sièges de ceux qui vendaient des colombes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les parvis du Temple » ou « dans l’enceinte du Temple » ; le terme grec désigne l’ensemble du domaine du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: Alternative lexicale précisant la portée spatiale de ἱερόν.
lexical_decisions:
- source_word: ἔρχονται
  choice: Ils arrivent
  rationale: Le présent historique grec est naturel en français narratif et donne de la vivacité au récit.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: εἰσελθὼν
  choice: Entré
  rationale: Le participe passé détaché exprime naturellement l'entrée préalable sans alourdir la phrase par « après être entré ».
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: le Temple / dans le Temple
  rationale: « Temple » est la désignation française habituelle; ici, ἱερόν vise l'ensemble du domaine du Temple plutôt que le sanctuaire intérieur, précision conservée en note.
- source_word: ἤρξατο ἐκβάλλειν
  choice: il se mit à chasser
  rationale: Cette tournure rend explicitement le commencement de l'action et la force de ἐκβάλλω dans un français courant et digne.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: ceux qui vendaient et ceux qui achetaient
  rationale: La formulation garde le parallélisme des participes substantivés et leur valeur d'action en cours.
- source_word: κολλυβιστῶν
  choice: changeurs de monnaie
  rationale: Expression française claire et traditionnelle pour les personnes qui échangeaient des monnaies.
- source_word: καθέδρας
  choice: sièges
  rationale: Terme général fidèle, sans préciser indûment s'il s'agissait de chaises ou de bancs.
- source_word: περιστερὰς
  choice: colombes
  rationale: Choix usuel dans le contexte sacrificiel du Temple.
- source_word: κατέστρεψεν
  choice: Il renversa
  rationale: Verbe concret et énergique convenant à la fois aux tables et aux sièges.
theological_decisions:
- issue: Portée spatiale de ἱερόν dans le récit
  choice: « Temple » dans le texte, au sens de l'ensemble du domaine du Temple
  alternative: « parvis du Temple » ou « enceinte du Temple »
  rationale: Le grec ne désigne pas spécifiquement le sanctuaire intérieur. La traduction principale reste familière et fluide, tandis que la note empêche une lecture spatialement trop étroite.
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique est conservé, comme il est naturel en français. La majuscule à « Temple » distingue ici le complexe du Temple de Jérusalem.
