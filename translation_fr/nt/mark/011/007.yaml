  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: fr
  text: Ils amenèrent l’ânon à Jésus, jetèrent leurs manteaux sur lui, et Jésus s’assit dessus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: l’ânon
  rationale: Dans ce contexte, le jeune animal est un ânon; ce terme français est naturel et précis.
- source_word: ἐπιβάλλουσιν
  choice: jetèrent … sur
  rationale: Rend le geste consistant à placer les manteaux sur l’animal, tout en conservant la vigueur du verbe grec.
- source_word: ἱμάτια
  choice: manteaux
  rationale: Désigne ici les vêtements de dessus, utilisés comme selle improvisée.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: Jésus s’assit dessus
  rationale: Le nom Jésus explicite naturellement en français le sujet implicite grec et « dessus » renvoie sans ambiguïté à l’ânon.
