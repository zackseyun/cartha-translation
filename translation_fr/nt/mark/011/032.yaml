  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: fr
  text: 'Mais si nous disons : « D’origine humaine[a] ? » — ils avaient peur de la foule, car tous considéraient que Jean était réellement un prophète[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Des êtres humains. »'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « tous tenaient Jean pour un prophète, vraiment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Mais si nous disons
  rationale: Le tour conditionnel restitue naturellement cette seconde branche de leur délibération, tandis que « mais » conserve l’opposition marquée par ἀλλά.
- source_word: Ἐξ ἀνθρώπων
  choice: Des êtres humains
  rationale: Cette formulation conserve l’idée de provenance exprimée par ἐξ et le sens collectif de ἀνθρώπων, sans employer le masculin générique « des hommes ». Le contexte oppose une origine humaine à une origine céleste.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: Ils avaient peur de la foule
  rationale: L’imparfait français rend l’état de crainte dans cette situation; « la foule » est le sens narratif naturel de ὄχλος dans ce passage.
- source_word: ἅπαντες γὰρ εἶχον
  choice: car tous considéraient
  rationale: γάρ introduit la raison de leur peur. Dans cette construction, ἔχω exprime l’opinion que l’on se fait de quelqu’un; « considéraient » est idiomatique en français.
- source_word: τὸν Ἰωάννην ὄντως ὅτι προφήτης ἦν
  choice: que Jean était réellement un prophète
  rationale: La proposition complétive rend ὅτι, tandis que « réellement » conserve la force emphatique de ὄντως. L’article indéfini est requis par l’usage français avec le nom attribut « prophète ».
theological_decisions:
- issue: Origine exprimée par ἐξ ἀνθρώπων
  choice: Des êtres humains
  alternative: D’origine humaine
  rationale: Le texte vise l’origine humaine du baptême ou de l’autorité de Jean, par opposition au ciel. La traduction principale reste proche de la forme grecque; l’alternative explicite davantage le sens contextuel sans être introduite dans le corps du verset.
- issue: Portée de ὄντως dans l’évaluation de Jean
  choice: tous considéraient que Jean était réellement un prophète
  alternative: tous tenaient Jean pour un véritable prophète
  rationale: La formulation principale place l’affirmation dans l’opinion de la foule et préserve l’insistance de ὄντως, sans en faire une nouvelle affirmation indépendante du narrateur.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve la forme abrupte de la délibération grecque. « Des êtres humains » évite l’ambiguïté contemporaine du masculin « hommes », et les notes préservent les principales possibilités de formulation sans surinterpréter le texte.
