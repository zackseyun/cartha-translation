source:
  edition: SBLGNT
  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: fr
  text: Alors qu’ils passaient, tôt le matin, ils virent le figuier desséché jusqu’aux racines[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « desséché à partir des racines ».'
    reason: La préposition ἐκ peut évoquer le point de départ du dessèchement; « jusqu’aux racines » rend idiomatiquement l’idée que le figuier était entièrement desséché.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: en passant par là
  rationale: Le participe présent exprime une action concomitante qui sert d’arrière-plan au verbe principal. « En passant par là » est naturel en français et conserve cette relation temporelle.
- source_word: πρωῒ
  choice: tôt le matin
  rationale: L’adverbe désigne le début de la matinée. Cette formulation concise rend à la fois le moment et son caractère matinal.
- source_word: εἶδον
  choice: ils virent
  rationale: Traduction directe de l’aoriste de perception, sans ajouter l’idée plus interprétative de « remarquer ».
- source_word: συκῆν
  choice: le figuier
  rationale: Terme français courant et précis pour désigner l’arbre dans ce contexte narratif.
- source_word: ἐξηραμμένην
  choice: desséché
  rationale: Le participe parfait passif décrit l’état résultant de l’arbre. « Desséché » est idiomatique pour un arbre et rend cet état accompli.
- source_word: ἐκ ῥιζῶν
  choice: depuis les racines
  rationale: Cette formulation conserve au mieux l’idée exprimée par ἐκ, selon laquelle le dessèchement part des racines, sans préciser davantage la direction du phénomène.
