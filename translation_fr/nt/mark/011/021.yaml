source:
  edition: SBLGNT
  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: fr
  text: 'Et Pierre, se souvenant, lui dit : « Rabbi, regarde : le figuier que tu as maudit s’est desséché[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a séché ». Le verbe grec peut désigner le fait de sécher ou de se dessécher ; le parfait souligne l’état qui en résulte maintenant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: se souvenant
  rationale: Le participe « se souvenant » rend naturellement le participe aoriste grec, qui peut signifier que Pierre se rappelle ou que le souvenir lui revient, tout en conservant son lien avec la parole qui suit.
- source_word: λέγει
  choice: dit
  rationale: Le grec emploie un présent historique, fréquent chez Marc. En français, « dit » convient au récit et conserve une formulation vive sans lourdeur.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom renvoie à Jésus dans le contexte, mais le texte grec garde un pronom ; « lui » évite une explicitation inutile.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Le maintien du titre translittéré préserve le cadre juif et la forme directe de l’adresse.
- source_word: ἴδε
  choice: regarde
  rationale: « Regarde » est l’impératif déictique courant et naturel en français moderne.
- source_word: συκῆ
  choice: figuier
  rationale: Dans ce contexte, le nom désigne clairement l’arbre et non son fruit.
- source_word: κατηράσω
  choice: tu as maudit
  rationale: Cette formulation directe rend l’aoriste grec et l’adresse de Pierre à Jésus sans ajouter d’interprétation.
- source_word: ἐξήρανται
  choice: s’est desséché
  rationale: Le parfait grec présente un processus accompli dont le résultat demeure visible. « S’est desséché » convient naturellement à un arbre et exprime ce résultat présent.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement du grec, tandis que les deux-points rendent clairement l’exclamation de Pierre. Le marqueur de note est placé après le terme auquel la variante lexicale se rapporte.
