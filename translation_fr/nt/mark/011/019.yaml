  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: fr
  text: Chaque fois que le soir venait, ils sortaient de la ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Chaque fois que
  rationale: Avec l’imparfait ἐξεπορεύοντο, la conjonction exprime naturellement une action répétée ou habituelle. « Chaque fois que » conserve explicitement cette valeur itérative.
- source_word: ὀψὲ ἐγένετο
  choice: le soir venait
  rationale: Cette formulation française naturelle rend l’idée temporelle de l’expression grecque, littéralement « il se faisait tard », tout en s’accordant avec la répétition évoquée dans le verset.
- source_word: ἐξεπορεύοντο
  choice: ils sortaient
  rationale: L’imparfait décrit ici vraisemblablement une action habituelle. En français, associé à « chaque fois que », « ils sortaient » exprime clairement cette répétition sans lourdeur.
- source_word: ἔξω τῆς πόλεως
  choice: de la ville
  rationale: Avec le verbe « sortir », « de la ville » rend naturellement le mouvement vers l’extérieur indiqué par le grec.
- source_word: πόλεως
  choice: la ville
  rationale: Le texte grec ne nomme pas Jérusalem dans ce verset. La traduction préserve donc la formulation explicite de la source.
