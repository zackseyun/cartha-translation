  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: fr
  text: 'Et, prenant la parole[a], il lui dit : « Que plus jamais personne ne mange de fruit venant de toi[b] ! » Et ses disciples écoutaient[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant répondu ». En grec, ce verbe peut servir d’introduction narrative même lorsqu’aucune parole précédente n’est rapportée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « Que personne ne mange désormais de fruit venant de toi, pour toujours. » Le grec dit littéralement : « jusque dans l’âge »; il s’agit d’une expression idiomatique pour une durée indéfinie.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « Et ses disciples entendirent. » L’imparfait grec peut présenter l’audition comme une action en cours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: prenant la parole
  rationale: Le participe signifie littéralement « ayant répondu », mais il relève ici d’un idiome narratif grec employé sans parole préalable explicite. « Prenant la parole » restitue naturellement l’introduction solennelle du propos sans inventer une réponse à une question.
- source_word: αὐτῇ
  choice: il lui dit
  rationale: Le pronom renvoie au figuier, nom féminin en grec mais masculin en français. « Lui » convient à la syntaxe française tout en conservant l’adresse faite à l’arbre.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: plus jamais
  rationale: La combinaison de « ne plus » et de l’expression idiomatique « pour toujours/à jamais » marque une cessation définitive. « Plus jamais » en rend la force avec naturel.
- source_word: ἐκ σοῦ
  choice: venant de toi
  rationale: Cette formulation conserve la deuxième personne de l’adresse directe et explicite la valeur de provenance de ἐκ.
- source_word: μηδεὶς
  choice: personne
  rationale: Dans la construction négative française « que… personne ne », ce choix rend clairement le pronom négatif grec.
- source_word: καρπὸν
  choice: de fruit
  rationale: Le singulier grec a ici une valeur générique ; le nom massif français « fruit » exprime naturellement ce sens.
- source_word: φάγοι
  choice: Que … ne mange
  rationale: L’optatif aoriste exprime un souhait imprécatoire, non une simple prédiction. La tournure française au subjonctif préserve cette valeur de sentence ou de malédiction.
- source_word: ἤκουον
  choice: écoutaient
  rationale: L’imparfait grec présente l’action en cours. « Écoutaient » garde cet aspect duratif et n’ajoute aucun complément absent du texte grec.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: C’est la formulation possessive idiomatique et exacte en français.
theological_decisions:
- issue: Nature de la parole adressée par Jésus au figuier
  choice: 'La rendre comme une sentence imprécatoire : « Que plus jamais personne ne mange… »'
  alternative: 'La rendre comme une simple prédiction : « Plus personne ne mangera jamais… »'
  rationale: L’optatif φάγοι exprime ici un souhait ou une imprécation. La traduction conserve donc la portée de jugement de la parole sans la réduire à l’annonce d’un fait futur.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve l’adresse directe au figuier ainsi que la force imprécatoire de l’optatif. « Prenant la parole » traduit naturellement un idiome narratif grec, tandis que la note en donne la forme plus littérale.
