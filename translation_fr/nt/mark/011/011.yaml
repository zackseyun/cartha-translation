id: MRK.11.11
reference: Mark 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: fr
  text: Il entra à Jérusalem, dans l’enceinte du Temple[a]. Après avoir tout regardé autour de lui, comme il était déjà tard[b], il partit pour Béthanie avec les douze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Temple ». Le terme grec désigne l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « parce qu’il était déjà tard » ou « l’heure étant déjà avancée ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire ses douze disciples.
    reason: cross_reference
lexical_decisions:
- source_word: εἰσῆλθεν εἰς Ἱεροσόλυμα εἰς τὸ ἱερόν
  choice: Il entra dans Jérusalem et se rendit dans l’enceinte du Temple
  rationale: Le grec enchaîne deux compléments introduits par εἰς. Une coordination naturelle en français rend clairement le mouvement vers Jérusalem puis vers le complexe du Temple, sans suggérer une entrée dans le sanctuaire intérieur.
- source_word: τὸ ἱερόν
  choice: l’enceinte du Temple
  rationale: Ἱερόν désigne ici l’ensemble du complexe du Temple, par opposition au sanctuaire intérieur, souvent désigné par ναός. « L’enceinte du Temple » est précis et compréhensible en français moderne.
- source_word: περιβλεψάμενος πάντα
  choice: Après avoir tout regardé autour de lui
  rationale: Le participe aoriste exprime une observation circulaire et antérieure au départ. Cette formulation conserve à la fois la séquence et l’étendue de l’observation.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: comme il était déjà tard
  rationale: Le génitif absolu donne la circonstance temporelle pouvant aussi motiver le départ. « Comme » préserve cette nuance temporelle et causale sans la trancher excessivement.
- source_word: ἐξῆλθεν εἰς Βηθανίαν
  choice: il partit pour Béthanie
  rationale: La formulation française exprime naturellement la sortie et la destination. Le contexte permet de comprendre qu’il quitte les lieux pour se rendre à Béthanie.
- source_word: μετὰ τῶν δώδεκα
  choice: avec les douze
  rationale: Le grec emploie simplement le nombre substantivé. La minuscule évite de transformer arbitrairement l’expression en titre officiel, tout en conservant son référent reconnu.
theological_decisions:
- issue: Portée spatiale de τὸ ἱερόν
  choice: l’enceinte du Temple
  alternative: le Temple
  rationale: Cette traduction distingue le complexe accessible du sanctuaire intérieur sans ajouter de précision doctrinale étrangère au texte.
- issue: Nuance de ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: comme il était déjà tard
  alternative: parce qu’il était déjà tard
  rationale: Le génitif absolu peut être entendu comme une circonstance temporelle ayant une valeur causale. « Comme » maintient cette souplesse plutôt que d’imposer une causalité exclusive.
- issue: Capitalisation de « les douze »
  choice: les douze
  alternative: les Douze
  rationale: Le grec ancien ne marque pas cette distinction typographique. La minuscule traduit sobrement le nombre substantivé sans nier qu’il désigne le groupe des douze disciples.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit; les formulations restent accessibles, sans archaïsmes. La majuscule à « Temple » signale le Temple de Jérusalem, tandis que « les douze » reste en minuscule conformément à la forme grecque.
