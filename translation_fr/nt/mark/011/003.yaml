id: MRK.11.3
reference: Mark 11:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: fr
  text: 'Et si quelqu’un vous dit : « Pourquoi faites-vous cela ? », dites : « Le Seigneur[a] en a besoin, et il le renverra aussitôt ici[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le maître ». Le grec κύριος peut signifier « Seigneur » ou « maître » ; ici, « Seigneur » convient au contexte de l’Évangile.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « il le renvoie aussitôt ici ». Le présent grec ἀποστέλλει peut avoir ici une valeur prospective, rendue par le futur en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: si quelqu’un vous dit
  rationale: ἐάν avec le subjonctif aoriste introduit une condition éventuelle orientée vers l’avenir. « Si quelqu’un vous dit » est naturel en français et conserve le caractère ouvert de la condition.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Pourquoi faites-vous cela ?
  rationale: Dans ce contexte, τί introduit une contestation de l’action. « Pourquoi faites-vous cela ? » restitue l’expression idiomatique sans lourdeur.
- source_word: εἴπατε
  choice: dites
  rationale: L’impératif aoriste pluriel appelle une réponse verbale directe ; « dites » en conserve simplement la force.
- source_word: Ὁ κύριος
  choice: Le Seigneur
  rationale: κύριος peut signifier « seigneur » ou « maître ». Dans le contexte narratif de Marc, le titre « le Seigneur » convient au renvoi à Jésus, tout en laissant l’autre sens indiqué en note.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: en a besoin
  rationale: Le pronom renvoie à l’ânon du verset précédent. La tournure française idiomatique « en a besoin » exprime fidèlement « a besoin de lui/de cela ».
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » rend l’immédiateté caractéristique de εὐθύς chez Marc dans un français naturel et soutenu.
- source_word: αὐτὸν ἀποστέλλει πάλιν ὧδε
  choice: il le renverra aussitôt ici
  rationale: Le futur français rend naturellement le présent grec à valeur prospective. « le » reprend l’ânon, tandis que « il » maintient sans l’expliciter davantage l’identité grammaticale du sujet ; πάλιν prend ici le sens contextuel de retour.
theological_decisions:
- issue: Sens et référent de κύριος
  choice: « Le Seigneur » comme titre renvoyant à Jésus
  alternative: « le maître » dans un sens plus ordinaire
  rationale: Le contexte présente Jésus donnant cette instruction, et « Seigneur » conserve la portée possible du titre. La note signale néanmoins le sens lexical plus ordinaire sans imposer une lecture doctrinale supplémentaire.
- issue: Sujet de ἀποστέλλει
  choice: Conserver le pronom « il » sans identifier explicitement son référent
  alternative: Expliciter soit « le Seigneur », soit la personne qui interpelle les disciples
  rationale: Le grec n’énonce pas de sujet nominal. Le pronom français préserve cette relative ambiguïté au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct et naturel. « Aussitôt » conserve l’urgence du récit de Marc, et les pronoms évitent d’ajouter des précisions absentes du grec.
