  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: fr
  text: 'C’est pourquoi je vous dis : tout ce que vous demandez quand vous priez, croyez que vous l’avez reçu[a], et vous l’aurez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ont une forme au présent : « croyez que vous le recevez » ; le texte grec suivi ici porte une forme exprimant une action accomplie.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Expression naturelle qui conserve le lien logique avec l’enseignement précédent sur la foi.
- source_word: λέγω ὑμῖν
  choice: je vous dis
  rationale: Formule directe et digne, naturelle en français moderne.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Rend la portée générale et englobante de l’expression grecque sans lourdeur.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: vous demandez quand vous priez
  rationale: Exprime distinctement la demande et son cadre de prière dans une tournure française fluide.
- source_word: πιστεύετε
  choice: croyez
  rationale: Rend directement l’impératif et introduit naturellement la proposition qui en précise le contenu.
- source_word: ὅτι ἐλάβετε
  choice: que vous l’avez reçu
  rationale: Le passé composé conserve le sens d’une action présentée comme accomplie et ayant une portée actuelle.
- source_word: καὶ ἔσται ὑμῖν
  choice: et vous l’aurez
  rationale: Formulation concise qui garde le futur et le contraste temporel avec « vous l’avez reçu ».
theological_decisions:
- issue: Rapport temporel entre la foi, la réception et l’exaucement
  choice: croyez que vous l’avez reçu, et vous l’aurez
  alternative: croyez que vous le recevez, et vous l’aurez
  rationale: Le texte grec retenu porte l’aoriste ἐλάβετε. La traduction maintient donc la séquence paradoxale entre réception présentée comme accomplie et possession future, sans l’expliquer selon un système doctrinal particulier.
translation_notes:
  register: Français international moderne, naturel et digne. La subordination « quand vous priez » évite une coordination maladroite tout en représentant les deux verbes grecs. Le pronom singulier « l’ » reprend idiomatiquement « tout ce que ».
