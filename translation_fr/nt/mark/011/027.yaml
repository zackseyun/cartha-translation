source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: fr
  text: Ils revinrent à Jérusalem. Pendant que Jésus marchait dans l’enceinte du Temple[a], les grands prêtres, les scribes et les anciens vinrent à lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Temple » ou « dans les cours du Temple » ; le grec désigne l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: revinrent / vinrent
  rationale: Les deux présents grecs sont des présents historiques. Le passé simple convient au récit en français écrit et maintient la succession des événements; avec πάλιν, « revinrent » exprime naturellement le retour à Jérusalem.
- source_word: πάλιν
  choice: revinrent
  rationale: Le sens de « de nouveau » est intégré au verbe préfixé, formulation plus naturelle ici que « vinrent de nouveau ».
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: ἐν τῷ ἱερῷ
  choice: dans l’enceinte du Temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur; « enceinte » situe la scène sans la limiter à une cour particulière.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Pendant que Jésus marchait
  rationale: Le génitif absolu fournit l’arrière-plan circonstanciel et présente une action en cours. Le nom « Jésus » lève naturellement en français une possible hésitation référentielle sans ajouter de contenu.
- source_word: ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Au pluriel, le terme désigne les principales autorités sacerdotales; « grands prêtres » est l’équivalent français traditionnel et précis.
- source_word: γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, il s’agit de spécialistes et interprètes des Écritures et de la Loi. Cette expression actuelle évite que « scribes » soit compris comme de simples copistes.
- source_word: πρεσβύτεροι
  choice: les anciens
  rationale: Le mot désigne ici des dirigeants reconnus de la communauté, et non simplement des hommes âgés.
- source_word: πρὸς αὐτόν
  choice: à lui
  rationale: La préposition exprime le mouvement vers Jésus; « vinrent à lui » est idiomatique et fidèle.
theological_decisions:
- issue: Étendue spatiale de ἱερόν
  choice: l’enceinte du Temple
  alternative: le Temple / les cours du Temple
  rationale: Cette traduction évite de faire penser au sanctuaire intérieur (ναός) tout en préservant la référence générale au complexe du Temple. Le choix est spatial et lexical, sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple conserve un style biblique lisible sans calquer les présents historiques grecs. La majuscule à « Temple » signale l’édifice de Jérusalem. « Spécialistes de la Loi » privilégie la compréhension immédiate tout en gardant la fonction institutionnelle du groupe.
