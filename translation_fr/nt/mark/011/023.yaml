source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: fr
  text: 'Amen, je vous le dis : si quelqu’un dit à cette montagne : « Sois soulevée et jetée dans la mer », sans douter[a] dans son cœur, mais en croyant que ce qu’il dit se réalise[b], il en sera ainsi pour lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans hésiter » ou « sans être partagé intérieurement » ; le verbe grec peut exprimer aussi bien le doute que la division intérieure.
    reason: lexical_alternative
  - marker: b
    text: Ou « que ce qu’il dit est en train de se réaliser » ou « arrive ». Le grec emploie ici un présent avant la proposition de résultat au futur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: « Amen » est une formule solennelle bien établie en français biblique et conserve directement l’hébraïsme employé par Jésus ; « je vous le dis » rend naturellement λέγω ὑμῖν.
- source_word: ὃς ἂν εἴπῃ
  choice: si quelqu’un dit
  rationale: La construction relative indéfinie avec ἄν et le subjonctif exprime une condition générale ; cette formulation est naturelle en français et garde sa portée ouverte.
- source_word: τῷ ὄρει τούτῳ
  choice: à cette montagne
  rationale: Le démonstratif est conservé, ainsi que le sens ordinaire de ὄρος, pour maintenir la vivacité de l’image.
- source_word: Ἄρθητι καὶ βλήθητι
  choice: Soulève-toi et jette-toi
  rationale: Les impératifs français pronominaux rendent idiomatiquement les deux passifs grecs tout en préservant les images concrètes d’élévation et de projection.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: sans douter dans son cœur
  rationale: Dans ce contexte, διακρίνω évoque le doute ou l’hésitation intérieure ; « dans son cœur » conserve l’anthropologie biblique de καρδία.
- source_word: ἀλλὰ πιστεύῃ
  choice: mais en croyant
  rationale: La tournure participiale française s’articule naturellement avec « sans douter » et conserve l’opposition nette marquée par ἀλλά.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: que ce qu’il dit est en train de se réaliser
  rationale: Cette formulation conserve le présent de γίνεται et sa valeur de processus possible, sans le transformer silencieusement en futur ; « se réaliser » convient à une parole qui devient réalité.
- source_word: ἔσται αὐτῷ
  choice: cela lui arrivera
  rationale: Le futur est clairement exprimé et la formulation française reste suffisamment ouverte pour ne pas préciser indûment le mécanisme du résultat.
theological_decisions:
- issue: Portée de la déclaration sur la foi
  choice: Conserver la promesse conditionnelle dans toute sa force, sans ajouter de restriction doctrinale.
  alternative: Réduire l’énoncé à une simple hyperbole ou en faire explicitement une promesse absolue et sans condition extérieure.
  rationale: Le verset lie directement l’énoncé au fait de croire sans douter, mais n’explicite pas ici les qualifications théologiques présentes ailleurs ; la traduction ne doit ni les importer ni atténuer l’image.
- issue: Valeur temporelle de γίνεται
  choice: Préserver le présent par « est en train de se réaliser ».
  alternative: Traduire par le futur « se réalisera » ou par le présent général « se réalise ».
  rationale: Le grec emploie un présent avant la proposition de résultat au futur. La formulation retenue rend visible cette tension temporelle sans la résoudre.
- issue: Masculin singulier générique de αὐτοῦ et αὐτῷ
  choice: Employer « son », « il » et « lui » avec une valeur représentative générique.
  alternative: Employer une reformulation plurielle ou explicitement inclusive.
  rationale: Le grec est au masculin singulier et présente une personne représentative ; le français peut conserver cette structure sans modifier le nombre grammatical.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Amen, je vous le dis » maintient la solennité propre aux paroles de Jésus. Les guillemets français et l’impératif pronominal rendent la parole adressée à la montagne naturelle sans affaiblir son caractère saisissant.
