reference: Mark 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: fr
  text: 'Ceux qui allaient devant et ceux qui suivaient criaient : « Hosanna[a] ! Béni soit celui qui vient au nom du Seigneur ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Hosanna » est une acclamation liturgique d’origine hébraïque ou araméenne qui signifie à l’origine quelque chose comme « sauve, nous t’en prions » ou « sauve maintenant » ; ici, elle sert aussi de cri de louange.
    reason: lexical_alternative
  - marker: b
    text: Cette acclamation reprend le Psaume 118,26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ceux qui marchaient devant
  rationale: Le participe présent substantivé désigne les personnes placées en tête du cortège. Cette formulation française naturelle rend l’action en cours.
- source_word: οἱ ἀκολουθοῦντες
  choice: ceux qui suivaient
  rationale: Le participe présent substantivé, parallèle à προάγοντες, désigne les personnes qui venaient derrière Jésus.
- source_word: ἔκραζον
  choice: criaient
  rationale: L’imparfait grec présente l’acclamation comme prolongée ou répétée ; l’imparfait français en conserve l’aspect.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: La translittération maintient la portée liturgique et scripturaire de cette exclamation d’origine hébraïque ou araméenne ; son sens premier est expliqué en note.
- source_word: Εὐλογημένος
  choice: Béni soit
  rationale: Cette tournure française rend naturellement la formule d’acclamation et préserve l’écho du Psaume 118. Elle exprime la bénédiction sans la réduire à la faveur ou à la louange.
- source_word: ὁ ἐρχόμενος
  choice: celui qui vient
  rationale: Cette formulation rend directement le participe présent substantivé sans ajouter au texte un titre messianique explicite.
- source_word: ἐν ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: L’expression biblique française consacrée conserve l’idée d’autorité et de représentation ainsi que l’allusion au psaume.
- source_word: κυρίου
  choice: Seigneur
  rationale: Rendu habituel de κύριος dans cette formule scripturaire.
theological_decisions:
- issue: Faut-il expliciter l’identification messianique dans l’acclamation ?
  choice: Conserver « celui qui vient au nom du Seigneur » sans ajouter « Messie » ni « roi ».
  alternative: « Béni soit le Messie qui vient au nom du Seigneur. »
  rationale: Dans son contexte, l’acclamation a une portée messianique, mais le grec de ce verset n’emploie aucun titre explicite. La formulation citationnelle préserve cette portée et sa tension interprétative sans amplification.
translation_notes:
  register: 'Français international moderne, digne et accessible. La structure parallèle des deux groupes est conservée, tandis que l’imparfait restitue la durée de leurs cris. Les marqueurs sont placés après « criaient » selon l’ordre [a][b] : d’abord l’écho scripturaire de l’ensemble de l’acclamation, puis l’explication lexicale de « Hosanna ».'
