  text: οἱ δὲ εἶπαν αὐτοῖς καθὼς ⸀εἶπεν ὁ Ἰησοῦς· καὶ ἀφῆκαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: fr
  text: Ils leur répondirent exactement comme Jésus l’avait dit, et on les laissa faire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ils
  rationale: L’article substantivé renvoie aux disciples. Le français n’a pas besoin d’exprimer δέ ici pour assurer naturellement la continuité du récit.
- source_word: εἶπαν αὐτοῖς
  choice: leur répondirent
  rationale: Même si λέγω signifie littéralement « dire », le contexte immédiat montre que les disciples répondent à une question; « répondirent » rend cette fonction discursive avec naturel.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: exactement comme Jésus l’avait dit
  rationale: « Exactement comme » exprime la conformité indiquée par καθώς, et le plus-que-parfait situe les paroles de Jésus avant la réponse des disciples.
- source_word: ἀφῆκαν αὐτούς
  choice: on les laissa faire
  rationale: Dans ce contexte, ἀφίημι indique que les personnes présentes cessent de s’opposer aux disciples et leur permettent d’emporter l’ânon. La tournure française évite l’ambiguïté de « les laissèrent partir », qui pourrait suggérer que les disciples s’en vont sans accomplir leur tâche.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation est concise et naturelle; « on » représente les personnes qui avaient interpellé les disciples au verset précédent.
