id: MRK.11.16
reference: Mark 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: fr
  text: Et il ne laissait personne transporter un objet à travers l’enceinte du Temple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à travers les cours du Temple ». Le terme grec désigne l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « un récipient » ou « un ustensile ». Le terme grec est général et ne précise pas la nature de ce qui était transporté.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: ne laissait
  rationale: 'L’imparfait exprime ici une action continue ou répétée : Jésus empêchait les gens d’agir ainsi. « Ne laissait » rend naturellement cette valeur durative en français.'
- source_word: ἵνα τις διενέγκῃ
  choice: personne transporter
  rationale: Après le verbe de permission nié, la tournure grecque avec ἵνα et le subjonctif désigne ce que Jésus ne permettait à personne de faire. La construction française « ne laissait personne transporter » est idiomatique.
- source_word: διενέγκῃ
  choice: transporter
  rationale: Dans ce contexte, le verbe désigne le fait de porter quelque chose d’un lieu à un autre. La direction est exprimée par « à travers ».
- source_word: σκεῦος
  choice: un objet
  rationale: Le terme grec est large et peut désigner un objet, un récipient, un ustensile ou un équipement. « Objet » évite de préciser sans fondement sa nature ou sa fonction.
- source_word: διὰ τοῦ ἱεροῦ
  choice: à travers l’enceinte du Temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur. « L’enceinte du Temple » conserve cette distinction tout en restant naturel en français.
theological_decisions:
- issue: Portée du terme ἱερόν dans le cadre du Temple de Jérusalem
  choice: l’ensemble du complexe, rendu par « l’enceinte du Temple »
  alternative: « le Temple » ou « les cours du Temple »
  rationale: Le grec renvoie au domaine du Temple au sens large plutôt qu’au sanctuaire intérieur (ναός). Cette formulation situe l’action de Jésus sans laisser entendre que les personnes traversaient le sanctuaire proprement dit.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « ne laissait » restitue l’aspect continu de l’action. La majuscule à « Temple » identifie le Temple de Jérusalem, tandis que « enceinte » évite de confondre le complexe avec le sanctuaire intérieur.
