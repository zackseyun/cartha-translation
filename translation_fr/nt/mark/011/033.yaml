  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: fr
  text: 'Ils répondent à Jésus : « Nous ne savons pas. » Et Jésus leur dit : « Moi non plus, je ne vous dis pas par quelle autorité je fais ces choses. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Ils répondent
  rationale: Le participe aoriste introduit leur réponse. Une proposition coordonnée au présent historique est plus naturelle en français tout en conservant le lien narratif.
- source_word: λέγουσιν / λέγει / λέγω
  choice: répondent / dit / dis
  rationale: Le présent historique grec est conservé. Dans la première occurrence, « répondent » exprime naturellement avec ἀποκριθέντες l'acte de prendre la parole, sans reproduire la redondance grecque peu idiomatique en français.
- source_word: Οὐκ οἴδαμεν
  choice: Nous ne savons pas
  rationale: Traduction directe de la négation et du parfait à valeur présente, dans un registre courant et digne.
- source_word: Οὐδὲ ἐγὼ
  choice: Moi non plus
  rationale: Cette tournure française naturelle maintient le parallélisme rhétorique entre leur refus de répondre et la réplique de Jésus.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: par quelle autorité
  rationale: « Par quelle autorité » exprime idiomatiquement le fondement ou le mandat en vertu duquel Jésus agit.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le pluriel est conservé et renvoie aux actions récentes de Jésus dans le Temple.
- source_word: ποιῶ
  choice: je fais
  rationale: Le présent simple correspond au présent grec et convient naturellement au contexte.
