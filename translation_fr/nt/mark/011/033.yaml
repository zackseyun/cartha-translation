translation_notes:
  register: 'Français international moderne, clair et digne. Le présent historique est maintenu. « Alors » rend naturellement la progression portée par le second καί sans alourdir la phrase. Aucune note n''est nécessaire : la variante « avec quelle autorité » est possible, mais n''apporte pas ici de différence substantielle exigeant une note.'
