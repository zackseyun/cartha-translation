  text: Εὐλογημένη ἡ ἐρχομένη ⸀βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: fr
  text: Béni soit le règne qui vient, celui de notre père David ! Hosanna dans les hauteurs ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme « Hosanna » peut refléter la supplication « Sauve, nous t’en prions » ou « Sauve maintenant », bien qu’il fonctionne ici comme une acclamation liturgique de louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Béni soit
  rationale: L’adjectif au féminin s’accorde avec βασιλεία et forme une acclamation. « Béni soit » restitue naturellement en français la valeur liturgique et exclamative de la tournure.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: le règne qui vient
  rationale: La relative rend clairement le participe présent ἐρχομένη et conserve l’idée d’une venue en cours ou imminente, sans la figer en « règne à venir ».
- source_word: βασιλεία
  choice: règne
  rationale: Dans cette acclamation davidique, « règne » exprime naturellement l’exercice du pouvoir royal et évite que « royaume » soit compris uniquement comme un territoire. Le contexte dynastique demeure perceptible grâce à la mention de David.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: celui de David notre père
  rationale: La reprise « celui de » rattache sans ambiguïté le génitif à « règne ». « David notre père » conserve l’appellation ancestrale honorifique dans un ordre naturel en français.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: Dans le grec du Nouveau Testament, le terme fonctionne comme une acclamation liturgique établie. La translittération conserve cette fonction, tandis qu’une note en rappelle le sens étymologique de supplication.
- source_word: ἐν τοῖς ὑψίστοις
  choice: dans les lieux très hauts
  rationale: Cette formulation rend le pluriel substantivé et sa référence probable aux régions célestes sans ajouter explicitement « cieux », absent du texte grec.
theological_decisions:
- issue: Nature de l’acclamation concernant le règne davidique
  choice: Traduire directement « le règne qui vient, celui de David notre père »
  alternative: « le règne messianique qui vient, celui de David notre père »
  rationale: Le contexte évoque fortement l’attente messianique, mais le grec ne comporte pas le mot « messianique ». La traduction laisse donc subsister l’allusion et la tension théologique sans les expliciter dans le texte.
- issue: Sens de Ὡσαννά dans l’acclamation
  choice: Conserver « Hosanna » dans le texte et expliquer en note sa valeur originelle de supplication
  alternative: « Sauve, nous t’en prions » ou « Sauve maintenant »
  rationale: Le terme dérive d’une demande de salut, mais il fonctionne ici comme une acclamation liturgique. Le texte principal préserve cet usage sans effacer le sens sous-jacent, signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exclamative conserve le caractère public et liturgique de l’acclamation. « David notre père » garde la tonalité ancestrale sans archaïsme marqué.
