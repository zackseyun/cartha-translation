id: MRK.11.17
reference: Mark 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: fr
  text: 'Il enseignait et leur disait : « N’est-il pas écrit : “Ma maison sera appelée maison de prière pour toutes les nations”[a] ? Mais vous, vous en avez fait un repaire de brigands[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « pour tous les peuples ». Le grec dit littéralement « pour toutes les nations », en écho à Ésaïe 56.7, et souligne que la maison de Dieu est destinée à accueillir des personnes au-delà d’Israël.'
    reason: lexical_alternative
  - marker: b
    text: « Repaire de brigands » fait écho à Jérémie 7.11. Selon le contexte, le mot grec peut aussi désigner des voleurs ou des bandits.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: Il enseignait et leur disait
  rationale: Les deux imparfaits présentent une action en cours ou répétée. En français, l’imparfait restitue naturellement cet aspect sans alourdir la phrase.
- source_word: Οὐ γέγραπται
  choice: N’est-il pas écrit
  rationale: Cette formule française courante rend le parfait passif grec et son appel à l’autorité durable du texte biblique.
- source_word: Ὁ οἶκός μου
  choice: Ma maison
  rationale: « Maison » correspond directement à οἶκος et conserve la formulation ainsi que la portée sacrée de la citation d’Ésaïe 56.7.
- source_word: οἶκος προσευχῆς
  choice: maison de prière
  rationale: Cette expression naturelle et reconnue conserve fidèlement la construction grecque.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: pour toutes les nations
  rationale: « Nations » rend directement ἔθνη et maintient la portée universelle de la citation sans la réduire à une formulation moins précise.
- source_word: ὑμεῖς δὲ
  choice: Mais vous, vous
  rationale: La reprise du pronom en français souligne le contraste marqué par le pronom grec explicite entre la vocation de la maison de Dieu et l’action des destinataires.
- source_word: πεποιήκατε
  choice: vous en avez fait
  rationale: Le passé composé rend naturellement le parfait grec et suggère l’état présent résultant de leur action.
- source_word: σπήλαιον λῃστῶν
  choice: un repaire de brigands
  rationale: « Repaire » exprime ici une cache ou un refuge plutôt qu’une simple grotte. « Brigands » garde la gamme de sens de λῃστής et convient à l’écho de Jérémie 7.11 sans imposer une interprétation politique précise.
theological_decisions:
- issue: Portée universelle de la citation prophétique
  choice: pour toutes les nations
  alternative: pour tous les peuples ; par toutes les nations
  rationale: Cette traduction conserve le sens direct de ἔθνη et l’ouverture de la maison de Dieu au-delà d’Israël, sans développer cette portée en système théologique.
- issue: Sens de λῃστῶν dans l’accusation de Jésus
  choice: brigands
  alternative: voleurs ; bandits ; insurgés
  rationale: Le terme peut désigner des voleurs armés ou des bandits. « Brigands » préserve cette amplitude et l’écho prophétique de Jérémie 7.11, tandis qu’« insurgés » préciserait indûment une nuance politique.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait maintient le déroulement narratif ; la reprise « vous, vous » porte l’emphase du grec. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
