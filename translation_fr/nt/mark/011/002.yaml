  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: fr
  text: 'Et il leur dit : « Allez au village qui est en face de vous. Dès que vous y entrerez, vous trouverez un poulain[a] attaché, sur lequel aucun être humain ne s’est encore assis[b]. Détachez-le et amenez-le. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec πῶλον désigne un jeune animal, notamment un jeune équidé. Il peut désigner un jeune âne, mais l’espèce n’est pas précisée par ce mot seul.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur lequel personne parmi les êtres humains ne s’est encore assis ». Le texte précise qu’aucun humain ne l’a encore monté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Allez
  rationale: L’impératif exprime ici un déplacement commandé; « Allez » est direct, naturel et fidèle.
- source_word: κώμην
  choice: village
  rationale: κώμη désigne ordinairement une localité distincte d’une ville; « village » est l’équivalent français courant.
- source_word: τὴν κατέναντι ὑμῶν
  choice: qui est en face de vous
  rationale: Cette formulation situe naturellement le village par rapport aux disciples tout en conservant la valeur spatiale de κατέναντι.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: Dès que vous y entrerez
  rationale: La proposition temporelle française rend avec fluidité l’immédiateté de εὐθύς associée à l’entrée dans le village.
- source_word: εὑρήσετε
  choice: vous trouverez
  rationale: Le futur français correspond à la valeur prédictive du futur grec.
- source_word: πῶλον
  choice: ânon
  rationale: πῶλος désigne un jeune animal; dans le contexte de l’entrée de Jésus, il s’agit d’un jeune âne. « Ânon » est précis et naturel en français.
- source_word: δεδεμένον
  choice: attaché
  rationale: Le participe parfait passif décrit l’animal dans l’état d’être attaché; le terme français est idiomatique.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: sur lequel aucun être humain ne s’est encore assis
  rationale: Cette traduction conserve explicitement la référence humaine de ἀνθρώπων ainsi que la nuance temporelle de οὔπω, sans transformer celle-ci en « jamais ».
- source_word: λύσατε
  choice: Détachez-le
  rationale: Dans le contexte d’un animal attaché, « détacher » rend clairement et naturellement λύω.
- source_word: φέρετε
  choice: amenez-le
  rationale: Pour un animal vivant, « amener » exprime naturellement le mouvement vers le locuteur sans préciser indûment qu’il serait porté ou conduit d’une manière particulière.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste simple et oral, tandis que « aucun être humain » préserve une précision explicite du grec. « Ânon » fournit en français la précision contextuelle que le nom grec, plus général, ne porte pas à lui seul.
