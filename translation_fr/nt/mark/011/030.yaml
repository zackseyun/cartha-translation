id: MRK.11.30
reference: Mark 11:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: fr
  text: Le baptême de Jean venait-il du ciel[a] ou des êtres humains[b] ? Répondez-moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Dieu ». Le grec dit « du ciel », expression juive qui évoque une origine ou une autorité divine.
    reason: lexical_alternative
  - marker: b
    text: L'expression signifie ici « d'origine ou d'autorité purement humaine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: le baptême de Jean
  rationale: Cette tournure française naturelle désigne le baptême pratiqué par Jean tout en restant proche de la construction grecque.
- source_word: ἐξ οὐρανοῦ
  choice: du ciel
  rationale: Le texte grec dit littéralement « du ciel », expression juive évoquant une origine ou une autorité divine. La conserver évite d'expliciter dans le texte principal ce qui demeure implicite.
- source_word: ἐξ ἀνθρώπων
  choice: des êtres humains
  rationale: Le pluriel générique ἀνθρώπων désigne ici une origine ou une autorité purement humaine. « Des êtres humains » rend ce sens clairement en français moderne et maintient le contraste avec « du ciel ».
- source_word: ἀποκρίθητέ μοι
  choice: Répondez-moi
  rationale: L'impératif aoriste demande une réponse directe. « Répondez-moi » en restitue naturellement la force.
- source_word: ἦν ἢ
  choice: venait-il… ou… ?
  rationale: Bien que le grec emploie le verbe « être », le français exprime plus naturellement l'origine par « venir de ». Cette formulation rend explicite la relation de provenance sans trancher entre origine et autorité.
theological_decisions:
- issue: Sens de « du ciel » dans la question de Jésus
  choice: Conserver l'expression « du ciel » dans le texte principal.
  alternative: « de Dieu »
  rationale: L'expression renvoie à une origine ou une autorité divine, mais sa formulation indirecte participe à la force rhétorique de la question. La traduction préserve donc l'idiome et en explique la portée en note.
- issue: Portée de « des êtres humains »
  choice: Rendre le pluriel générique par « des êtres humains » sans limiter la référence aux hommes de sexe masculin.
  alternative: « des hommes » ou « d'origine humaine »
  rationale: ἀνθρώπων est générique ici et s'oppose à l'origine céleste. La formulation choisie préserve cette opposition sans introduire une restriction de sexe ni réduire le sens à la seule origine au détriment de l'autorité.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement convient à l'adresse de Jésus aux responsables religieux au pluriel. L'ordre de la question et l'impératif final conservent son caractère direct et pressant.
