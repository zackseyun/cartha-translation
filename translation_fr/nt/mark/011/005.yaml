  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: fr
  text: 'Quelques-uns de ceux qui se tenaient là leur disaient : « Que faites-vous à détacher l’ânon[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jeune animal ». Le grec πῶλος désigne un jeune animal ; dans ce contexte, « ânon » est une compréhension possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: quelques-uns
  rationale: Rend le pluriel indéfini et désigne naturellement une partie non précisée des personnes présentes.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: de ceux qui se tenaient là
  rationale: Reproduit la construction substantive du participe parfait et l’adverbe ἐκεῖ, sans introduire l’idée plus interprétative de simples passants.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français conserve l’aspect imperfectif du grec sans imposer une répétition marquée.
- source_word: αὐτοῖς
  choice: leur
  rationale: Pronom objet indirect pluriel naturel en français, renvoyant aux disciples.
- source_word: Τί ποιεῖτε
  choice: Que faites-vous
  rationale: Question directe qui conserve le présent et n’ajoute ni « pourquoi » ni « ici ».
- source_word: λύοντες
  choice: en détachant
  rationale: Dans le contexte d’un animal attaché, « détacher » exprime clairement et naturellement l’action de λύω; la construction avec « en » maintient le lien participial avec la question.
- source_word: τὸν πῶλον
  choice: l’ânon
  rationale: πῶλος désigne un jeune animal; dans ce contexte narratif, il s’agit d’un jeune âne. « Ânon » est précis, courant dans le registre biblique français et plus naturel ici que le terme général « poulain ».
