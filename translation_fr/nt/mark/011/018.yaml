  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: fr
  text: Les chefs des prêtres et les spécialistes de la Loi l’apprirent et cherchaient comment le faire périr[a]. En effet, ils avaient peur de lui, car toute la foule était frappée d’étonnement par son enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le supprimer »; dans ce contexte, le verbe grec implique qu’ils voulaient le tuer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: l’apprirent
  rationale: Dans ce contexte, le verbe signifie qu’ils entendirent parler de ce que Jésus venait de faire et de dire. « L’apprirent » est naturel en français et évite un « entendirent cela » plus lourd.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Désigne les membres dirigeants de l’aristocratie sacerdotale de Jérusalem, et non plusieurs titulaires simultanés de la charge unique de grand-prêtre.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Rend clairement la fonction de ces experts des Écritures et de la Loi auprès d’un lectorat moderne; « scribes » risquerait d’évoquer de simples copistes.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait grec exprime une démarche en cours; l’imparfait français la restitue naturellement.
- source_word: πῶς
  choice: comment
  rationale: Conserve la délibération sur le moyen de parvenir à leur objectif.
- source_word: ἀπολέσωσιν
  choice: le faire périr
  rationale: Le contexte indique une intention mortelle. « Faire périr » reste légèrement moins explicite que « tuer » et conserve une part de l’étendue sémantique de ἀπόλλυμι.
- source_word: ἐφοβοῦντο
  choice: ils avaient peur de lui
  rationale: Expression française courante qui restitue l’état durable exprimé par l’imparfait grec.
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Préserve l’accent collectif et emphatique de la construction grecque.
- source_word: ἐξεπλήσσετο
  choice: était frappée d’étonnement
  rationale: Rend la force du verbe et son aspect duratif sans exagération.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: par son enseignement
  rationale: Exprime naturellement en français la cause ou l’occasion de l’étonnement.
theological_decisions:
- issue: Portée de l’intention exprimée par ἀπολέσωσιν
  choice: le faire périr
  alternative: le supprimer; le tuer; le mettre à mort
  rationale: Le contexte rend l’intention mortelle manifeste, mais le verbe grec possède une portée plus large que le seul verbe « tuer ». « Faire périr » transmet ici le sens contextuel sans préciser indûment le mode d’exécution.
translation_notes:
  register: Français international moderne, naturel et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate; « faire périr » maintient la gravité et une légère amplitude lexicale. Le double γάρ est rendu par « En effet » puis « car », ce qui préserve l’enchaînement explicatif sans lourdeur.
