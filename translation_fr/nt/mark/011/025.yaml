revisions:
- from: Et chaque fois que vous vous tenez debout pour prier, pardonnez, si vous avez quelque chose contre quelqu’un, afin que votre Père qui est dans les cieux[a] vous pardonne, lui aussi, vos fautes[b].
  to: Et quand vous priez debout, pardonnez, si vous avez quelque chose contre quelqu’un, afin que votre Père qui est dans les cieux[a] vous pardonne lui aussi vos fautes[b].
  rationale: La révision est limitée à la relation entre la posture et la prière, afin d’éviter que « pour prier » ne soit lu comme un complément de but. Elle améliore aussi légèrement l’ordre des mots, sans modifier le sens, l’ambiguïté ou la portée théologique du verset. Les ancres et les notes restent correctement associées à « les cieux » et à « fautes ».
