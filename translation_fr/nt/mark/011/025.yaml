source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: fr
  text: Et quand vous priez debout, pardonnez, si vous avez quelque chose contre quelqu’un, afin que votre Père qui est dans les cieux[a] vous pardonne lui aussi vos fautes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « votre Père qui est au ciel ». Le grec emploie ici le pluriel : « dans les cieux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vos transgressions » ou « vos offenses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: vous vous tenez debout pour prier
  rationale: Cette formulation conserve l’image concrète de la posture debout et exprime naturellement en français la simultanéité du participe προσευχόμενοι.
- source_word: ἀφίετε
  choice: pardonnez
  rationale: Dans ce contexte relationnel, ἀφίημι désigne le fait de remettre une offense. « Pardonnez » est clair, idiomatique et maintient le lien lexical avec l’action du Père.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: si vous avez quelque chose contre quelqu’un
  rationale: La tournure préserve la portée indéfinie de τι et τινος ainsi que l’idée d’un grief à l’encontre d’une personne.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: votre Père qui est dans les cieux
  rationale: Le pluriel « les cieux » correspond explicitement au grec οὐρανοῖς, sans remplacer la formulation par l’expression interprétative « Père céleste ».
- source_word: ἀφῇ
  choice: vous pardonne, lui aussi
  rationale: Le subjonctif après ἵνα est rendu par la construction française « afin que » avec le subjonctif. « Lui aussi » restitue καί et souligne le parallèle avec le pardon accordé par les disciples.
- source_word: παραπτώματα
  choice: fautes
  rationale: « Fautes » rend de manière naturelle et accessible l’idée de faux pas ou d’offenses, tout en évitant d’assimiler sans nuance παράπτωμα au terme plus général pour « péché ».
theological_decisions:
- issue: Lien entre le pardon accordé aux autres et le pardon du Père
  choice: 'Conserver directement la proposition de but : « afin que votre Père… vous pardonne »'
  alternative: Atténuer ce lien en présentant le pardon humain comme un simple signe extérieur d’un pardon divin déjà acquis
  rationale: Le grec ἵνα… ἀφῇ établit textuellement un lien réel entre les deux actes de pardon. La traduction maintient cette tension sans l’expliquer à partir d’un système doctrinal extérieur au verset.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image de la prière en position debout, les indéfinis très larges (« quelque chose », « quelqu’un »), le pluriel grec « les cieux » et le lien explicite entre pardon humain et pardon divin.
