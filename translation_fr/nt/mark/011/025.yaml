review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : le commandement de pardonner, les indéfinis larges (« quelque chose », « quelqu’un »), le pluriel « les cieux », le lien exprimé par ἵνα et le parallélisme du pardon sont tous conservés. Toutefois, « vous vous tenez debout pour prier » peut présenter la prière comme le but de se mettre debout, tandis que le participe προσευχόμενοι décrit l’action concomitante : ils sont debout en priant. Une légère reformulation rend mieux cette relation.'
  naturalness: Le français est clair et d’un registre approprié. « Quand vous priez debout » est plus idiomatique et plus direct que « chaque fois que vous vous tenez debout pour prier », tout en gardant l’image de la posture. Le déplacement de « lui aussi » après le verbe rend également la phrase plus fluide.
  terminology: « Pardonnez » rend correctement ἀφίετε et conserve le lien avec « pardonne ». « Fautes » est un rendu moderne recevable de παραπτώματα; la note offre utilement « transgressions » et « offenses ». « Père ... dans les cieux » respecte le pluriel grec sans recourir à une paraphrase théologique.
  issues:
  - severity: low
    issue: Nuance du participe προσευχόμενοι
    rationale: La construction « se tenir debout pour prier » peut suggérer une finalité (« afin de prier »). Le grec exprime plutôt la prière simultanée à la posture. « Quand vous priez debout » restitue naturellement cette simultanéité en français.
  - severity: low
    issue: Position de « lui aussi »
    rationale: La formulation initiale est grammaticalement possible, mais « vous pardonne lui aussi vos fautes » est plus fluide et maintient clairement la correspondance du καί grec avec l’acte de pardon du Père.
