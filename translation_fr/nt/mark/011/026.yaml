id: MRK.11.26
reference: Mark 11:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: fr
  text: Mais[a] si vous ne pardonnez pas, votre Père qui est dans les cieux ne pardonnera pas non plus vos fautes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que des anciennes versions coptes. Il figure toutefois dans la tradition byzantine majoritaire, la tradition latine et la plupart des témoins syriaques. Il a probablement été ajouté plus tard par des copistes pour harmoniser ce passage avec les paroles de Jésus en Matthieu 6.15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: pardonner
  rationale: Dans ce contexte de torts entre personnes et de pardon accordé par Dieu, « pardonner » est le terme français courant et précis; il exprime la remise de la faute sans introduire une nuance étrangère au grec.
- source_word: παράπτωμα
  choice: fautes
  rationale: « Fautes » rend naturellement l’idée d’écarts ou de manquements portée par παράπτωμα, tout en évitant de l’identifier sans nuance au terme grec plus général souvent traduit par « péché ».
- source_word: οὐδέ
  choice: ne… pas non plus
  rationale: Cette tournure française restitue clairement la correspondance négative entre le refus humain de pardonner et le non-pardon du Père.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: qui est dans les cieux
  rationale: La relative conserve explicitement la construction grecque et le pluriel « les cieux », dans une formulation française naturelle et digne.
theological_decisions:
- issue: Lien entre le pardon accordé aux autres et le pardon du Père
  choice: Conserver l’énoncé conditionnel direct sans en préciser le mécanisme théologique
  alternative: L’expliciter comme une condition méritoire, ou comme le simple signe d’un pardon déjà reçu
  rationale: Le verset affirme une correspondance forte sans expliquer ici comment elle s’articule avec la grâce, la foi ou la repentance; la traduction doit préserver cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Mais » maintient la liaison adversative; « dans les cieux » préserve le pluriel grec. Le marqueur [a] est placé immédiatement après « Mais » comme dans la couche de consultation anglaise.
