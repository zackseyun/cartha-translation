  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: fr
  text: Et le lendemain, après qu'ils eurent quitté Béthanie, il eut faim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: Le connecteur poursuit le récit et conserve la parataxe caractéristique de Marc sans l'alourdir.
- source_word: τῇ ἐπαύριον
  choice: le lendemain
  rationale: Cette expression temporelle adverbiale indique le jour suivant; « le lendemain » est idiomatique en français moderne.
- source_word: ἐξελθόντων αὐτῶν
  choice: comme ils quittaient
  rationale: Le génitif absolu exprime une circonstance temporelle liée à leur départ. Cette formulation naturelle maintient le pluriel de αὐτῶν sans imposer une séparation temporelle nette que le contexte grec ne requiert pas nécessairement.
- source_word: ἀπὸ Βηθανίας
  choice: Béthanie
  rationale: Avec « quittaient », la provenance exprimée par ἀπό est naturellement intégrée au verbe français; « quittaient Béthanie » rend clairement le mouvement au départ du lieu.
- source_word: ἐπείνασεν
  choice: il eut faim
  rationale: Le passé simple convient au récit et peut exprimer naturellement la survenue de la faim, tout en évitant la lourdeur de « il devint affamé ».
theological_decisions:
- issue: Sujet implicite de ἐπείνασεν
  choice: Conserver le pronom « il », qui renvoie contextuellement à Jésus.
  alternative: Expliciter « Jésus eut faim ».
  rationale: Le grec n'exprime pas le nom du sujet. Le pronom préserve cette économie et laisse intacte l'affirmation directe de sa faim humaine sans ajout interprétatif.
- issue: Valeur aspectuelle de l'aoriste ἐπείνασεν
  choice: « il eut faim », formulation compatible avec l'apparition de la faim sans en faire une précision doctrinale.
  alternative: « il avait faim » ou « il commença à avoir faim ».
  rationale: L'aoriste présente globalement l'événement; le français « eut faim » restitue bien la progression narrative tout en évitant de surdéterminer explicitement une valeur ingressive.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. Aucun appel de note n'est nécessaire.
