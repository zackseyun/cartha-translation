  naturalness: « Et le lendemain, après qu'ils eurent quitté Béthanie, il eut faim » est naturel dans une narration biblique française moderne et conserve un registre sobre. Le passé simple et le plus-que-parfait du subjonctif après « après que » sont ici idiomatiques dans un style narratif soutenu mais non archaïsant.
  terminology: « Béthanie » est la forme française usuelle du toponyme. Le pronom « il » conserve à juste titre le sujet implicite du grec, contextuellement identifiable sans ajout interprétatif.
