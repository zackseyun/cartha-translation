id: MRK.11.13
reference: Mark 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: fr
  text: Voyant de loin un figuier avec des feuilles, il alla voir s’il y trouverait peut-être quelque chose. Mais, lorsqu’il s’en approcha, il ne trouva que des feuilles, car ce n’était pas la saison des figues.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: Voyant
  rationale: Le participe présent rend naturellement la circonstance temporelle sans préciser davantage l’ordre des actions.
- source_word: συκῆν ἀπὸ μακρόθεν
  choice: de loin un figuier
  rationale: Cette formulation conserve la portée spatiale de ἀπὸ μακρόθεν tout en restant naturelle en français.
- source_word: ἔχουσαν φύλλα
  choice: couvert de feuilles
  rationale: Expression française claire et idiomatique pour un arbre portant visiblement des feuilles, sans suggérer la présence de fruits.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: il alla voir s’il y trouverait peut-être quelque chose
  rationale: « Alla voir » exprime le but, tandis que « peut-être » préserve l’incertitude marquée par εἰ ἄρα.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: arrivé près de lui
  rationale: Rend naturellement l’approche de l’arbre; le pronom masculin reprend « figuier » en français.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: il ne trouva que des feuilles
  rationale: Équivalent français idiomatique et précis de « il ne trouva rien, sinon des feuilles ».
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: car ce n’était pas la saison des figues
  rationale: « Saison » exprime ici le temps approprié pour les figues et conserve directement l’explication du narrateur.
theological_decisions:
- issue: Portée de la remarque expliquant que ce n’était pas la saison des figues
  choice: 'Conserver directement la remarque narrative : « car ce n’était pas la saison des figues »'
  alternative: Développer la phrase afin d’expliquer les attentes agricoles liées aux feuilles et aux fruits
  rationale: Le texte crée une tension entre la recherche de fruits et l’absence de la saison des figues. La traduction la préserve sans l’atténuer ni proposer une explication étrangère au verset.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Aucune note n’est nécessaire, car « la saison des figues » restitue clairement καιρός dans ce contexte.
