source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: fr
  text: 'Mais Jésus leur dit : « Je vais vous poser une question. Répondez-moi, et je vous dirai par quelle autorité je fais tout cela. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition ou la reprise de parole de Jésus en réponse aux responsables; « Mais » convient naturellement au contexte.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Rendu narratif naturel et fidèle du verbe λέγω avec son complément indirect.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Je vais vous poser
  rationale: Le futur introduit la contre-question imminente; en français moderne, « je vais vous poser » est plus naturel que « je vous interrogerai » dans cette réplique.
- source_word: ἕνα λόγον
  choice: une question
  rationale: Dans ce contexte, λόγος désigne le propos précis auquel les interlocuteurs doivent répondre; « une question » explicite naturellement sa fonction sans modifier le sens.
- source_word: ἀποκρίθητέ μοι
  choice: Répondez-moi
  rationale: Conserve avec concision la force de l'impératif aoriste et l'adresse directe.
- source_word: ἐρῶ ὑμῖν
  choice: je vous dirai
  rationale: Rendu idiomatique du futur de λέγω lorsqu'il s'agit de communiquer une réponse.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: par quelle autorité
  rationale: Exprime le fondement ou le mandat en vertu duquel Jésus agit, tout en gardant le terme central « autorité ».
- source_word: ταῦτα ποιῶ
  choice: je fais cela
  rationale: Le singulier collectif « cela » renvoie naturellement en français à l'ensemble des actes contestés, sans suggérer un seul acte isolé.
theological_decisions:
- issue: Sens de ἐξουσία dans le contexte
  choice: autorité
  alternative: droit; pouvoir
  rationale: Le débat porte principalement sur la légitimité ou le mandat de Jésus pour agir, plutôt que sur sa seule capacité; « autorité » préserve cette portée institutionnelle et théologique.
translation_notes:
  register: Français international moderne, clair et digne. La juxtaposition grecque est rendue par deux phrases afin d'éviter une coordination maladroite entre une déclaration et un impératif, tout en conservant l'enchaînement direct de la réplique.
