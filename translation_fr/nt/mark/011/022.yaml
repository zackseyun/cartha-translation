  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: fr
  text: 'Et Jésus leur répondit : « Ayez foi en Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ayez la foi de Dieu. » Cette expression peut aussi être comprise comme « Ayez la fidélité de Dieu » ou « Ayez une foi qui vient de Dieu ».'
    reason: 'Le génitif θεοῦ est réellement ambigu : il peut indiquer l’objet de la foi, son possesseur ou sa source.'
lexical_decisions:
- source_word: ἀποκριθεὶς … λέγει
  choice: leur répondit
  rationale: Le participe ἀποκριθείς et le présent historique λέγει forment ici une introduction à la parole. « Leur répondit » restitue naturellement leur fonction narrative en français, sans reproduire lourdement « répondant, il leur dit ».
- source_word: Ἔχετε
  choice: Ayez
  rationale: L’impératif présent appelle les disciples à posséder et à maintenir cette disposition. « Ayez » est la formulation française la plus directe et la moins interprétative.
- source_word: πίστιν
  choice: foi
  rationale: « Foi » conserve le terme religieux courant et convient à l’enseignement qui suit sur le fait de croire et de prier. « Confiance » serait possible, mais réduirait légèrement l’éventail sémantique de πίστις.
- source_word: θεοῦ
  choice: en Dieu
  rationale: Après πίστιν, le génitif peut désigner l’objet de la foi. Dans le contexte immédiat, où Jésus exhorte ses disciples avant de parler de croire et de prier, « foi en Dieu » est le sens le plus naturel en français. L’ambiguïté grammaticale est néanmoins signalée en note.
theological_decisions:
- issue: Valeur du génitif dans πίστιν θεοῦ
  choice: 'Génitif objectif : « foi en Dieu »'
  alternative: « foi de Dieu », pouvant évoquer la foi ou la fidélité de Dieu, ou encore une foi qui vient de Dieu
  rationale: Le contexte de Marc 11.23-24 favorise une exhortation à placer sa foi en Dieu. Toutefois, le grec n’explicite pas la relation précise entre « foi » et « Dieu » ; la note préserve donc les autres compréhensions possibles sans les introduire dans le texte principal.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique tout en restant clair ; l’expression idiomatique « avoir foi en Dieu » rend naturellement l’exhortation.
