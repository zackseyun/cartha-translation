source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: fr
  text: 'Ils lui demandaient : « Par quelle autorité fais-tu ces choses ? Ou qui t’a donné cette autorité pour les faire ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Ils lui demandaient
  rationale: L’imparfait grec présente la parole en cours; en français, « demandaient » rend naturellement l’acte de parole interrogatif sans lourdeur.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Par quelle autorité
  rationale: Cette formulation française exprime naturellement le fondement ou le mandat en vertu duquel Jésus agit.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: autorité
  rationale: Le terme désigne ici le droit ou le pouvoir légitime d’agir, au cœur de la contestation des responsables.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: fais-tu cela / agir ainsi
  rationale: Le démonstratif pluriel grec renvoie globalement aux actes récents de Jésus; le français idiomatique emploie volontiers le singulier collectif « cela », puis « agir ainsi » pour éviter une répétition pesante.
- source_word: ἢ
  choice: Ou
  rationale: La conjonction introduit une seconde question qui reformule étroitement la première.
- source_word: τίς σοι ἔδωκεν
  choice: qui t’a donné
  rationale: Le passé composé convient naturellement en français à cet acte antérieur dont l’autorité présente serait le résultat.
- source_word: ἵνα ταῦτα ποιῇς
  choice: pour agir ainsi
  rationale: Après « donner cette autorité », l’infinitif avec « pour » rend clairement et naturellement la valeur de finalité ou d’habilitation.
theological_decisions:
- issue: Nature de l’autorisation revendiquée par Jésus
  choice: Formuler la question comme une contestation neutre de l’autorité de Jésus
  alternative: Préciser dans le texte qu’il s’agit d’une autorité divine
  rationale: Le verset rapporte la question des responsables sans en donner encore la réponse; la traduction ne doit donc pas déterminer explicitement la source de cette autorité.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond au discours direct adressé à une seule personne. La formulation reste fluide tout en conservant les deux questions parallèles du grec.
