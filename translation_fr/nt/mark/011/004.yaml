  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: fr
  text: Ils partirent et trouvèrent un ânon attaché près d’une porte, dehors, dans la rue[a], et ils le détachèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « attaché à une porte, dehors, dans la rue ». La formulation grecque permet de comprendre légèrement différemment les rapports spatiaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: partirent
  rationale: L’aoriste de ἀπέρχομαι exprime le départ du lieu où Jésus avait donné ses instructions. « Partirent » est naturel et conserve cette nuance.
- source_word: εὗρον
  choice: trouvèrent
  rationale: Équivalent direct et idiomatique de εὑρίσκω dans ce récit.
- source_word: πῶλον
  choice: ânon
  rationale: πῶλος désigne un jeune animal. Le contexte immédiat plus large permet de comprendre qu’il s’agit d’un jeune âne; « ânon » est précis et naturel en français biblique moderne.
- source_word: δεδεμένον
  choice: attaché
  rationale: Le participe parfait passif décrit l’état dans lequel se trouvait l’ânon. « Attaché » convient mieux à cette situation concrète que « lié ».
- source_word: πρὸς θύραν
  choice: près d’une porte
  rationale: πρός avec l’accusatif exprime ici la proximité. « Près d’une porte » rend ce rapport spatial sans rigidité excessive.
- source_word: ἔξω
  choice: dehors
  rationale: ἔξω situe l’animal à l’extérieur; « dehors » est simple et naturel dans la phrase.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: donnant sur la rue
  rationale: ἄμφοδον désigne une rue, une ruelle ou un passage, et ἐπί avec le génitif situe vraisemblablement la porte le long de cet espace. Cette formulation française rend naturellement la scène tout en signalant en note l’autre rattachement possible.
- source_word: λύουσιν αὐτόν
  choice: ils le détachèrent
  rationale: Le présent historique λύουσιν est rendu par un passé simple cohérent avec la narration française. « Détachèrent » décrit naturellement l’action inverse d’attacher.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif écrit. La note préserve l’ambiguïté syntaxique de la description du lieu.
