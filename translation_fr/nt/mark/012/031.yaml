id: MRK.12.31
reference: Mark 12:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: fr
  text: 'Le deuxième est celui-ci : « Tu aimeras ton prochain comme toi-même. » Il n’y a pas d’autre commandement plus grand que ceux-là.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aucun autre commandement n’est plus grand que ceux-là. » « Ceux-là » renvoie, dans le contexte, aux deux commandements pris ensemble.'
    reason: Variante de formulation et clarification du référent pluriel.
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Le deuxième est celui-ci
  rationale: 'Le grec est elliptique : « le deuxième [commandement] est celui-ci ». La formulation française restitue naturellement le verbe sous-entendu, maintient l’accent sur le rang et renvoie clairement au premier commandement mentionné dans le contexte.'
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur de l’indicatif, dans cette citation scripturaire, a une valeur impérative. « Tu aimeras » conserve la forme traditionnelle et la force solennelle du commandement sans la paraphraser.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: « Ton prochain » est l’équivalent biblique établi et précis de πλησίον dans ce contexte éthique; il préserve aussi le lien avec Lévitique 19.18.
- source_word: ὡς σεαυτόν
  choice: comme toi-même
  rationale: Cette formulation concise reproduit la comparaison grecque sans ajouter « comme tu t’aimes », qui expliciterait ce que le texte laisse sous-entendu.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Il n’y a pas d’autre commandement plus grand que ceux-là
  rationale: La traduction conserve le comparatif μείζων et surtout le pluriel τούτων. « Ceux-là » renvoie naturellement aux deux commandements évoqués dans le contexte.
- source_word: ἐντολή
  choice: commandement
  rationale: « Commandement » convient au registre biblique et à la discussion des prescriptions de la Torah mieux que le terme plus général « ordre ».
theological_decisions:
- issue: Référent de τούτων (« ceux-là ») dans la dernière proposition
  choice: Renvoi pluriel aux deux commandements pris ensemble
  alternative: Renvoi généralisé au seul deuxième commandement, pourtant immédiatement mentionné
  rationale: Le démonstratif pluriel renvoie le plus naturellement aux deux commandements du contexte. La traduction maintient explicitement ce pluriel sans réduire la comparaison à un seul commandement.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est conservé dans la citation scripturaire, conformément à l’adresse singulière du grec et à l’usage biblique français. La tournure « ton prochain » maintient l’intertextualité avec Lévitique 19.18.
