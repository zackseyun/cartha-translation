  text: καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/039.yaml
  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: fr
  text: et les sièges d’honneur dans les synagogues et les places d’honneur lors des banquets,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: les sièges d’honneur
  rationale: Le nom désigne les sièges de premier rang en dignité dans une assemblée. « Sièges d’honneur » exprime naturellement le statut recherché sans suggérer nécessairement une position matérielle à l’avant.
- source_word: συναγωγαῖς
  choice: les synagogues
  rationale: Dans ce contexte, le terme désigne les lieux de réunion juifs; « synagogues » est la traduction française usuelle et précise.
- source_word: πρωτοκλισίας
  choice: les places d’honneur
  rationale: Le terme désigne les emplacements les plus honorifiques lors des repas, historiquement sur des couches. « Places d’honneur » restitue clairement la portée sociale sans imposer au lecteur moderne le mobilier antique.
- source_word: δείπνοις
  choice: les banquets
  rationale: Le pluriel désigne ici des repas où s’affichent rang et prestige. « Banquets » convient au cadre social et reste naturel en français moderne.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: La coordination répétée est conservée afin de respecter l’accumulation du texte grec.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: dans les synagogues ... dans les banquets
  rationale: « Dans » convient idiomatiquement aux lieux et demeure naturel pour désigner la place occupée au cours d’un banquet.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre « sièges d’honneur » et « places d’honneur » conserve la répétition sémantique du grec tout en distinguant l’assemblée du repas. La ponctuation finale maintient le caractère fragmentaire du verset, qui prolonge la phrase précédente.
