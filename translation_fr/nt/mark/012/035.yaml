reference: Mark 12:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: fr
  text: 'Alors qu’il enseignait dans le temple, Jésus prit la parole et dit : « Comment les scribes peuvent-ils dire que le Messie[a] est le fils de David ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec Christos est employé ici dans son sens messianique.'
    reason: Traduction alternative d’un titre théologiquement important.
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔλεγεν
  choice: Jésus prit la parole et dit
  rationale: Le participe ἀποκριθείς peut signaler une réaction à la situation sans répondre à une question explicitement formulée. « Prit la parole et dit » restitue naturellement cette fonction discursive, sans donner l’impression qu’une question précédente est omise.
- source_word: διδάσκων
  choice: alors qu’il enseignait
  rationale: Cette tournure exprime clairement que l’enseignement et la prise de parole sont simultanés.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Ἱερόν désigne ici l’ensemble du domaine du temple, et non seulement le sanctuaire intérieur. « Temple » reste la formulation française usuelle et accessible.
- source_word: Πῶς λέγουσιν
  choice: Comment … peuvent-ils dire
  rationale: 'La question ne porte pas seulement sur la manière de parler : elle met en cause la cohérence de l’affirmation des spécialistes de la Loi. La formulation française choisie rend cette portée rhétorique sans expliciter la réponse.'
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, les γραμματεῖς sont les experts et interprètes reconnus des Écritures et de la Loi. Cette expression est plus immédiatement compréhensible en français moderne que « scribes », tout en conservant leur fonction historique.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός est employé ici comme titre messianique dans un débat juif concernant le descendant de David. « Messie » rend directement ce sens ; « Christ » est signalé en note.
- source_word: υἱὸς Δαυίδ
  choice: le fils de David
  rationale: L’expression renvoie à la désignation messianique reconnue et à l’ascendance davidique, non simplement à un descendant quelconque.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte porte explicitement sur l’attente messianique liée à David. « Messie » préserve ce cadre, tandis que la note maintient l’autre traduction traditionnelle sans imposer une lecture confessionnelle.
- issue: Portée de la question sur le fils de David
  choice: Conserver la question sans expliquer comment le Messie peut être à la fois fils de David et Seigneur
  alternative: Ajouter une précision interprétative sur la filiation ou la supériorité du Messie
  rationale: Le verset ouvre une tension que les versets suivants développent. La traduction ne doit ni la résoudre d’avance ni nier l’ascendance davidique.
translation_notes:
  register: Français international moderne, clair et digne. « Spécialistes de la Loi » privilégie l’intelligibilité contemporaine ; « prit la parole » évite le calque peu naturel « répondant, il disait » tout en conservant la valeur réactive de l’expression grecque.
