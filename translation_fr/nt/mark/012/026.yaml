source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: fr
  text: 'Quant aux morts et au fait qu’ils ressuscitent, n’avez-vous pas lu dans le livre de Moïse, dans le passage qui parle du buisson[a], comment Dieu lui a parlé : « Je suis le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au buisson » ; l’expression grecque peut aussi désigner le passage de l’Écriture par l’épisode du buisson.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Quant aux morts
  rationale: περί avec le génitif introduit le sujet traité. « Quant aux » rend naturellement cette transition en français sans accentuer excessivement la valeur légèrement connective de δέ.
- source_word: ὅτι ἐγείρονται
  choice: et au fait qu’ils ressuscitent
  rationale: La tournure rattache clairement la proposition au thème introduit par περί. « Ressuscitent » est le verbe français naturel dans ce débat sur la résurrection; il garde ouverte la question de la voix, puisque la forme grecque peut être comprise comme passive ou médio-passive selon l’analyse.
- source_word: οὐκ ἀνέγνωτε
  choice: n’avez-vous pas lu
  rationale: Le passé composé convient à la formule interrogative et rhétorique française par laquelle Jésus fait appel à une lecture connue des Écritures.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: dans le livre de Moïse
  rationale: « Livre » rend βίβλος de manière claire et actuelle; le complément « de Moïse » conserve la formulation grecque sans préciser davantage l’étendue du corpus.
- source_word: ἐπὶ τοῦ βάτου
  choice: dans le passage du buisson
  rationale: L’expression peut désigner une section scripturaire par l’épisode qui l’identifie. « Le passage du buisson » rend cette fonction de repère tout en restant concis.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: comment Dieu lui a parlé en disant
  rationale: « Comment » reprend πῶς et introduit la teneur de la parole citée. « Lui a parlé en disant » conserve le verbe principal et le participe quotatif, avec une formulation française digne et intelligible.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Je suis le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  rationale: Le présent « Je suis » est explicité conformément au sens de la proposition nominale grecque. La répétition de « le Dieu de » reproduit l’insistance de la citation, avec une ponctuation française naturelle.
theological_decisions:
- issue: Valeur de ἐγείρονται dans l’affirmation sur les morts
  choice: qu’ils ressuscitent
  alternative: qu’ils sont relevés
  rationale: « Ressuscitent » exprime sans ambiguïté le sujet du débat et correspond à l’usage français courant. La traduction n’ajoute pas explicitement un agent, tout en ne niant pas l’action divine impliquée par le contexte et possible dans la forme grecque.
- issue: Présent et structure répétée de l’identification divine
  choice: Je suis le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  alternative: Je suis le Dieu d’Abraham, d’Isaac et de Jacob
  rationale: Le présent et la triple répétition sont maintenus, car la formulation exacte de la citation porte l’argument de Jésus. La traduction évite de paraphraser ou de développer cet argument dans le verset lui-même.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement rhétorique de la question, la référence au livre de Moïse et la répétition solennelle de la citation. Le marqueur [a] figure immédiatement après l’expression concernée.
