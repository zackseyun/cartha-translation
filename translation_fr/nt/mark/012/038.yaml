id: MRK.12.38
reference: Mark 12:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: fr
  text: 'Dans son enseignement, il disait : « Méfiez-vous des spécialistes de la Loi qui aiment circuler en longues robes[b] et recevoir des salutations sur les places publiques[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les marchés ». Ces lieux servaient aussi de places publiques et de points de rassemblement.
    reason: lexical_alternative
  - marker: b
    text: Les « longues robes » étaient des vêtements extérieurs voyants pouvant signaler le rang et appeler les honneurs publics.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: Dans son enseignement
  rationale: Conserve le cadre exprimé par la préposition grecque tout en restant naturel en français.
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait français rend naturellement l’aspect duratif ou répétitif de l’imparfait grec.
- source_word: Βλέπετε ἀπὸ
  choice: Méfiez-vous de
  rationale: Exprime clairement l’avertissement et l’idée de se tenir sur ses gardes face aux personnes visées.
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Dans ce contexte évangélique, le terme désigne des spécialistes et interprètes des Écritures et de la Loi; cette formulation moderne évite le sens courant trompeur de « scribes » comme simples copistes.
- source_word: τῶν θελόντων
  choice: qui aiment
  rationale: Dans cette description d’une conduite habituelle, θέλω peut exprimer le goût ou la prédilection; « aiment » est idiomatique sans effacer la disposition volontaire.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: circuler en longues robes
  rationale: « Circuler » rend l’idée de se montrer en public, tandis que « longues robes » représente les vêtements extérieurs imposants désignés par στολαί.
- source_word: ἀσπασμοὺς
  choice: salutations
  rationale: Rend directement le nom grec; le contexte suggère des marques publiques de considération.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sur les places publiques
  rationale: Les ἀγοραί étaient à la fois des marchés et des lieux publics de rassemblement; « places publiques » met en évidence la visibilité sociale pertinente ici.
theological_decisions:
- issue: Portée de l’avertissement de Jésus concernant les spécialistes de la Loi
  choice: L’absence de virgule avant « qui aiment » laisse la proposition caractériser ceux dont la recherche ostentatoire d’honneur est dénoncée.
  alternative: Comprendre l’expression comme une condamnation indistincte de tous les spécialistes de la Loi.
  rationale: Le grec nomme les γραμματεῖς puis les décrit par le participe τῶν θελόντων. La traduction conserve cette articulation sans trancher plus que le texte.
translation_notes:
  register: Français international moderne, courant et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate; « Méfiez-vous » garde la force solennelle de l’avertissement. Les marqueurs sont placés immédiatement après les expressions qu’ils expliquent.
