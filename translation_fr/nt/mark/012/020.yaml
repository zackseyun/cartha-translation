  source_fidelity: 'Le sens est globalement fidèle : les sept frères, le premier mariage et l’absence de descendance sont tous conservés. Toutefois, « en mourant » est moins idiomatique en français dans cette narration et peut évoquer le processus de l’agonie plutôt que le fait qu’à son décès il n’a laissé aucune descendance. « Mourut sans laisser » rend naturellement la relation participiale sans modifier le sens.'
