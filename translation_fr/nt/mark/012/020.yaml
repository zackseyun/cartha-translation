lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Il y avait sept frères
  rationale: Rend naturellement la proposition existentielle et conserve « frères », puisque le contexte concerne précisément des hommes.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: Marque l’ordre dans le groupe sans ajouter l’idée qu’il serait l’aîné.
- source_word: ἔλαβεν γυναῖκα
  choice: prit une femme
  rationale: Conserve l’idiome grec, compréhensible dans ce récit matrimonial, sans introduire une précision absente du texte.
- source_word: ἀποθνῄσκων
  choice: en mourant
  rationale: Rend le participe présent et son rapport circonstanciel avec le fait de ne laisser aucune descendance.
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: ne laissa pas de descendance
  rationale: Dans ce contexte familial et juridique, σπέρμα désigne la postérité; « descendance » est naturel et garde une portée plus large que « enfant ».
