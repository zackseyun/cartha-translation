  verdict: revise
  source_fidelity: 'La suppression de « alors » est requise : Καί relie simplement le récit et ne porte pas ici la valeur temporelle ajoutée par « alors ». « Par ses propres paroles » explicite de manière excessive λόγῳ : le grec emploie le singulier indéfini (« par une parole ») sans le possessif « propres ». « Prendre au piège » rend bien la métaphore cynégétique de ἀγρεύσωσιν.'
  naturalness: La phrase révisée reste naturelle dans un français biblique moderne et international. « Par une parole » est légèrement formel, mais il reproduit utilement le singulier et l’indétermination du grec; la note en clarifie le sens idiomatique.
  terminology: « Pharisiens » et « hérodiens » sont les désignations françaises usuelles. Le présent narratif « ils lui envoient » est recevable et fidèle au présent historique grec. Aucun enjeu théologique ou doctrinal ne nécessite d’être résolu.
  issues:
