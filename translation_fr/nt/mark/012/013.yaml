    issue: Ajout de « alors »
    rationale: Le texte grec commence par Καί (« et »), sans adverbe temporel correspondant à « alors ». Cet ajout oriente inutilement la progression narrative.
  - severity: medium
    issue: « par ses propres paroles » élargit λόγῳ
    rationale: λόγῳ est au singulier et ne contient ni possessif ni qualificatif équivalant à « propres ». Même si le contexte suggère que la parole visée sera celle de Jésus, le texte principal doit conserver l’expression plus sobre et ambiguë.
