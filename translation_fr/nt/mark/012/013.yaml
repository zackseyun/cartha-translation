id: MRK.12.13
reference: Mark 12:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: fr
  text: Ils lui envoient quelques pharisiens et quelques hérodiens, afin de le prendre au piège par une parole.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par une parole ». Le verbe grec évoque la capture à la chasse; il s’agit de le prendre au piège au moyen de ce qu’il dira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: ils lui envoient alors
  rationale: Le présent narratif grec est conservé en français, où il reste naturel dans ce récit; « alors » marque sobrement la progression narrative portée par Καί.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: quelques pharisiens et quelques hérodiens
  rationale: « Quelques » rend la valeur partitive de τινας avec les deux groupes sans alourdir la phrase par la répétition de « quelques-uns des ».
- source_word: Φαρισαίων
  choice: pharisiens
  rationale: Désignation française courante de ce groupe juif; la minuscule suit l’usage typographique moderne pour les membres d’un courant.
- source_word: Ἡρῳδιανῶν
  choice: hérodiens
  rationale: Désignation française traditionnelle et transparente des partisans associés à Hérode.
- source_word: ἵνα
  choice: afin de
  rationale: Exprime clairement le but de leur envoi dans un français naturel et digne.
- source_word: ἀγρεύσωσιν
  choice: le prendre au piège
  rationale: Conserve l’image de la chasse contenue dans le verbe grec tout en employant une expression française idiomatique.
- source_word: λόγῳ
  choice: par ses propres paroles
  rationale: Rend le datif instrumental et explicite de façon naturelle que le piège doit fonctionner au moyen de ce que Jésus dira, sans préciser la nature exacte de la faute recherchée.
theological_decisions:
- issue: Sujet pluriel implicite du verbe grec
  choice: ils
  alternative: les chefs des prêtres, les spécialistes de la Loi et les anciens
  rationale: Le verset ne répète pas l’identité des agents; le pronom préserve cette indétermination grammaticale plutôt que d’introduire dans le texte principal l’identification tirée du contexte.
- issue: Moyen par lequel Jésus doit être pris au piège
  choice: par ses propres paroles
  alternative: par une parole
  rationale: La formulation française communique le sens instrumental de λόγῳ et le piège verbal sans décider quelle accusation précise les adversaires espèrent pouvoir porter.
translation_notes:
  register: Français international moderne, fluide et digne. Le présent narratif maintient la vivacité du grec. Les noms de groupes sont rendus selon l’usage biblique français courant, et l’image cynégétique demeure perceptible dans « prendre au piège ».
