id: MRK.12.33
reference: Mark 12:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: fr
  text: et l’aimer de tout son cœur, de toute son intelligence et de toute sa force, et aimer son prochain comme soi-même, vaut plus que tous les holocaustes[a] et les sacrifices.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un holocauste était une offrande entièrement consumée sur l’autel.
    reason: Précision lexicale sur le sens cultuel de ὁλοκαύτωμα.
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: aimer
  rationale: L’infinitif garde la force verbale et le parallélisme des deux propositions grecques, tout en étant naturel en français.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom renvoie à Dieu dans le contexte précédent. Le conserver évite de remplacer explicitement par « Dieu » ce que le grec exprime par un pronom.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: de tout son cœur
  rationale: Formulation française courante exprimant une consécration totale, avec une valeur générale plutôt qu’une adresse directe au lecteur.
- source_word: συνέσεως
  choice: intelligence
  rationale: σύνεσις désigne ici la faculté de comprendre et de discerner. « Intelligence » la distingue de la simple pensée tout en restant clair en français moderne.
- source_word: ἰσχύος
  choice: force
  rationale: « Force » rend simplement la capacité ou la vigueur tout entière de la personne.
- source_word: πλησίον
  choice: son prochain
  rationale: Le singulier grec a une portée générale. « Son prochain » est l’expression française naturelle qui conserve cette généralité.
- source_word: ὡς ἑαυτόν
  choice: comme soi-même
  rationale: La forme réfléchie générique est préservée sans transformer la parole rapportée en adresse directe.
- source_word: περισσότερόν ἐστιν
  choice: vaut plus que
  rationale: Cette tournure française exprime clairement la supériorité affirmée par le comparatif, sans préciser au-delà du texte la nature de cette supériorité.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: tous les holocaustes et les sacrifices
  rationale: « Holocaustes » est le terme cultuel français pour les offrandes entièrement consumées sur l’autel; « tous les » rend la totalité exprimée par πάντων.
theological_decisions:
- issue: Rapport entre les commandements d’amour et le culte sacrificiel
  choice: Le fait d’aimer Dieu entièrement et son prochain vaut plus que l’ensemble des holocaustes et des sacrifices.
  alternative: Comprendre que ce verset abolit explicitement tout sacrifice, ou qu’il place simplement l’amour et les sacrifices au même niveau.
  rationale: Le comparatif affirme nettement une supériorité, mais le verset ne déclare pas explicitement l’abolition du système sacrificiel. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination des infinitifs est traitée comme un ensemble conceptuel, d’où le singulier « vaut ». Le verset conserve son caractère de continuation par l’ouverture « et ».
