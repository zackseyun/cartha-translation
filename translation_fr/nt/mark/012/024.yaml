id: MRK.12.24
reference: Mark 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: fr
  text: 'Jésus leur dit[a] : « N’est-ce pas pour cette raison que vous êtes dans l’erreur : vous ne connaissez ni les Écritures ni la puissance de Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus leur dit : “N’est-ce pas parce que vous ne connaissez ni les Écritures ni la puissance de Dieu que vous vous égarez ?” »'
    reason: 'Alternative lexicale et syntaxique : πλανᾶσθε peut se rendre par « vous vous égarez », et la relation causale peut être formulée directement en français.'
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur dit
  rationale: φημί introduit ici directement les paroles de Jésus. « Leur dit » est naturel en français et n’ajoute pas la nuance d’une réponse formelle.
- source_word: Οὐ διὰ τοῦτο
  choice: N’est-ce pas pour cette raison que
  rationale: La négation οὐ dans cette question appelle une réponse affirmative, tandis que διὰ τοῦτο exprime la cause. Cette formulation conserve clairement la force de la question rhétorique.
- source_word: πλανᾶσθε
  choice: vous êtes dans l’erreur
  rationale: Le verbe peut désigner le fait de se tromper ou d’être égaré. « Être dans l’erreur » convient à la méprise des sadducéens sans préciser indûment si sa cause est seulement intellectuelle ou aussi spirituelle.
- source_word: μὴ εἰδότες
  choice: vous ne connaissez
  rationale: Le participe négatif indique la cause de leur erreur. Une proposition française explicite après les deux-points rend naturellement cette relation, tandis que « ni… ni » porte la négation sur les deux compléments.
- source_word: τὰς γραφὰς
  choice: les Écritures
  rationale: Au pluriel, γραφαί désigne ici les écrits sacrés reconnus. « Les Écritures » est l’expression française consacrée, claire et exacte.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ni la puissance de Dieu
  rationale: Cette formulation rend directement δύναμις et le génitif τοῦ θεοῦ, tout en maintenant le parallélisme avec « les Écritures ».
theological_decisions:
- issue: Nature de l’erreur exprimée par πλανᾶσθε
  choice: vous êtes dans l’erreur
  alternative: vous vous égarez / vous êtes égarés
  rationale: Le grec peut évoquer aussi bien l’erreur que l’égarement. Le contexte porte sur une mauvaise compréhension de la résurrection, des Écritures et de la puissance divine. Le choix retenu conserve la réprimande sans déterminer davantage la nature intellectuelle, morale ou spirituelle de l’erreur.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et la relation causale du grec sont conservées; la note signale l’autre nuance possible de πλανᾶσθε.
