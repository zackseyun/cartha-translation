source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: fr
  text: 'Il appela ses disciples auprès de lui et leur dit : « Amen, je vous le dis, cette veuve pauvre a mis dans le trésor[a] plus que tous ceux qui y mettent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le tronc des offrandes ». Le terme grec peut désigner les réceptacles destinés aux offrandes ou l’espace du trésor du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Il appela ... auprès de lui
  rationale: Le participe aoriste moyen indique que Jésus fait venir ses disciples à lui avant de leur parler. Cette formulation rend naturellement en français le mouvement vers lui sans alourdir la phrase.
- source_word: μαθητὰς
  choice: disciples
  rationale: Terme français courant et consacré qui conserve la relation d’apprentissage et de fidélité exprimée par μαθητής.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Cette formule conserve le mot sémitique Ἀμήν et la solennité caractéristique de la déclaration de Jésus, tout en restant familière aux lecteurs francophones.
- source_word: χήρα
  choice: veuve
  rationale: Équivalent direct et naturel de χήρα.
- source_word: πτωχὴ
  choice: pauvre
  rationale: Rend le sens simple de πτωχός sans renforcer indûment le texte par « indigente » ou « misérable ».
- source_word: πλεῖον πάντων
  choice: plus que tous
  rationale: Conserve la comparaison ouverte du grec sans préciser dans le texte principal si le « plus » porte sur la valeur monétaire, la proportion ou la qualité du don.
- source_word: ἔβαλεν / τῶν βαλλόντων
  choice: a mis / ceux qui y mettent
  rationale: « Mettre » convient idiomatiquement au dépôt d’argent. Le passé composé rend l’acte accompli de la veuve, tandis que le présent conserve l’aspect en cours du participe βαλλόντων.
- source_word: γαζοφυλάκιον
  choice: trésor
  rationale: « Trésor » est concis et traditionnel. Comme le terme grec peut désigner les réceptacles des offrandes ou l’espace du trésor du Temple, une note signale cette étendue de sens.
theological_decisions:
- issue: Évaluation de l’offrande de la veuve
  choice: Conserver littéralement « plus que tous » sans expliquer dans le texte principal en quel sens son don est supérieur.
  alternative: Paraphraser « elle a donné proportionnellement plus » ou « son offrande avait plus de valeur ».
  rationale: Le verset suivant éclaire la comparaison par l’opposition entre pauvreté et abondance, mais le présent verset ne formule pas lui-même cette explication. La traduction préserve donc la tension et l’ambiguïté du comparatif.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant un participe initial lourd. « Amen, je vous le dis » maintient la formule solennelle propre aux paroles de Jésus. Le pronom « y » évite la répétition de « dans le trésor » sans effacer le cadre du Temple.
