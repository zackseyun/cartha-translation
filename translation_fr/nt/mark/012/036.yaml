id: MRK.12.36
reference: Mark 12:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: fr
  text: 'David lui-même a dit dans l’Esprit Saint[a] : « Le Seigneur a dit à mon Seigneur[b] : “Assieds-toi à ma droite jusqu’à ce que je mette tes ennemis sous tes pieds.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’Esprit Saint ».'
    reason: alternative_reading
  - marker: b
    text: La citation vient du Psaume 110.1. Dans le texte hébreu, le premier « Seigneur » représente le nom divin (YHWH, traditionnellement rendu par « le SEIGNEUR »), tandis que le second désigne le seigneur de David.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: David lui-même
  rationale: L’emploi intensif de αὐτός met David en relief comme auteur de la parole citée. « David lui-même » restitue cette insistance naturellement en français.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: dans l’Esprit Saint
  rationale: La traduction garde la valeur directe de ἐν avec le datif et laisse ouverte la nuance précise du rapport entre David et l’Esprit dans l’inspiration.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français naturel de κύριος. La répétition du même terme conserve la formulation grecque de la citation.
- source_word: τῷ κυρίῳ μου
  choice: à mon Seigneur
  rationale: Cette formulation maintient la répétition de κύριος et la portée de l’argument de Jésus, sans remplacer le second titre par une interprétation plus étroite comme « maître ».
- source_word: Κάθου
  choice: Assieds-toi
  rationale: Cet impératif rend naturellement en français l’ordre de prendre place, dans le contexte d’intronisation.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Il s’agit de l’équivalent idiomatique français de l’expression grecque désignant la place d’honneur à la droite de quelqu’un.
- source_word: ἕως ἂν θῶ
  choice: jusqu’à ce que je mette
  rationale: La tournure exprime la limite future envisagée à partir de l’ordre donné. Le subjonctif français après « jusqu’à ce que » est idiomatique.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sous tes pieds
  rationale: Cette traduction suit précisément le texte de Marc, qui dit « sous tes pieds » sans reprendre explicitement l’image plus développée du marchepied.
theological_decisions:
- issue: Formule décrivant la parole prophétique de David
  choice: David lui-même a dit dans l’Esprit Saint
  alternative: David lui-même a dit par l’Esprit Saint
  rationale: « Dans l’Esprit Saint » suit la préposition grecque sans définir plus étroitement le mode d’inspiration. L’autre compréhension possible est signalée en note.
- issue: Portée christologique de la citation du Psaume 110.1
  choice: Le Seigneur a dit à mon Seigneur
  alternative: Le SEIGNEUR a dit à mon Seigneur
  rationale: Le texte grec emploie κύριος dans les deux cas; le texte principal conserve donc le même mot français. La distinction présente dans l’hébreu du psaume, où le premier terme représente le nom divin, est expliquée en note plutôt qu’introduite silencieusement dans le texte de Marc.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue la parole de Jésus, la citation du psaume et la parole prononcée par le Seigneur. « Assieds-toi » est courant sans être familier; « à ma droite » conserve le langage biblique d’intronisation tout en restant immédiatement compréhensible.
