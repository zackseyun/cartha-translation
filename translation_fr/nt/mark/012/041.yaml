id: MRK.12.41
reference: Mark 12:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: fr
  text: Puis il s’assit en face du trésor[a] et regardait comment la foule y déposait de la monnaie. Beaucoup de riches y déposaient de grosses sommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coffre des offrandes » ; le terme grec peut désigner le trésor du Temple ou les réceptacles qui lui étaient associés.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: il s’assit
  rationale: Le participe aoriste marque l’action qui précède l’observation; une proposition coordonnée est naturelle en français narratif.
- source_word: κατέναντι
  choice: en face de
  rationale: Exprime directement la position opposée sans lourdeur.
- source_word: γαζοφυλάκιον
  choice: trésor
  rationale: Rendu concis qui conserve l’ambiguïté entre le trésor du Temple comme lieu et les réceptacles qui lui sont associés; la note signale les sens plus concrets.
- source_word: ἐθεώρει
  choice: regardait
  rationale: L’imparfait rend l’observation prolongée exprimée par l’imparfait grec.
- source_word: πῶς
  choice: comment
  rationale: Conserve l’attention portée à la manière dont la foule donne, plutôt que de réduire le terme au simple fait du don.
- source_word: ὄχλος
  choice: la foule
  rationale: Équivalent moderne et naturel du collectif grec.
- source_word: βάλλει / ἔβαλλον
  choice: déposait / déposaient
  rationale: Dans le contexte d’argent placé dans un réceptacle, « déposer » rend idiomatiquement βάλλω; les imparfaits français préservent l’aspect duratif ou répété.
- source_word: χαλκόν
  choice: de la monnaie
  rationale: Le mot désigne littéralement du cuivre ou du bronze et, ici, la monnaie faite de ce métal; « monnaie » exprime naturellement sa valeur contextuelle sans suggérer une seule pièce.
- source_word: πολλοὶ πλούσιοι
  choice: beaucoup de riches
  rationale: Formulation française naturelle et inclusive pour désigner de nombreuses personnes riches.
- source_word: πολλά
  choice: de grosses sommes
  rationale: Dans ce contexte monétaire, le neutre pluriel signifie qu’ils mettaient beaucoup; « de grosses sommes » transmet clairement la quantité sans la raideur de « beaucoup » employé seul.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition grecque de γαζοφυλάκιον est allégée par « y » après sa première occurrence, sans perte de référent. L’imparfait maintient la durée de l’observation et le caractère répété des dépôts.
