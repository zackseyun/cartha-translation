  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: fr
  text: 'Ils en apportèrent un[a]. Et il leur dit : « De qui sont cette effigie et cette inscription ? » Ils lui dirent : « De César. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils l’apportèrent », le complément sous-entendu d’après le contexte précédent étant la monnaie, un denier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: Ils en apportèrent un
  rationale: Le verbe signifie « apporter ». Son complément, sous-entendu d’après le contexte précédent, est le denier. Le pronom « en » accompagné de « un » exprime naturellement en français qu’ils apportent un exemplaire de cette monnaie sans ajouter un nom absent du verset.
- source_word: λέγει
  choice: il leur dit
  rationale: λέγει est un présent historique fréquent chez Marc. La forme française « dit » coïncide au présent et au passé simple ; dans ce récit, elle reste naturelle tout en permettant de conserver la vivacité de l’expression grecque.
- source_word: Τίνος
  choice: De qui sont
  rationale: Le génitif interrogatif porte sur l’effigie et l’inscription. « De qui sont… ? » rend cette relation de manière idiomatique sans la préciser davantage comme une stricte propriété.
- source_word: εἰκών
  choice: effigie
  rationale: Dans le contexte d’une monnaie, « effigie » désigne précisément l’image ou le portrait figurant sur la pièce, tout en restant compréhensible dans un registre courant et digne.
- source_word: ἐπιγραφή
  choice: inscription
  rationale: Le terme désigne les mots inscrits sur la monnaie. « Inscription » est exact, transparent et plus accessible que le terme numismatique « légende ».
- source_word: Καίσαρος
  choice: De César
  rationale: Le génitif répond directement à la question « De qui… ? ». « De César » conserve la réponse brève du grec et sa relation d’association ou d’appartenance.
