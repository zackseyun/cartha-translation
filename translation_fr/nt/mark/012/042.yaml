  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: fr
  text: Une veuve pauvre vint et y mit deux leptes[a], c’est-à-dire un quadrans[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le lepte était une monnaie de très faible valeur ; deux leptes équivalaient à un quadrans romain. On peut aussi traduire : « deux petites pièces de cuivre ».'
