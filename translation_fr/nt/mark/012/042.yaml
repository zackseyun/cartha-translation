  - marker: b
    text: Le quadrans est la monnaie romaine nommée dans le texte grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: vint aussi
  rationale: Le participe aoriste est rendu par un verbe conjugué pour un récit naturel en français. « aussi » exprime ici la valeur additive de καί dans la continuité de la scène.
- source_word: μία
  choice: une
  rationale: Dans ce contexte, μία introduit un personnage individuel sans insister sur le nombre; l’article indéfini français convient naturellement.
- source_word: χήρα πτωχὴ
  choice: une veuve pauvre
  rationale: Traduction directe et courante, sans renforcer πτωχή en « indigente » ou « démunie » au-delà de ce que dit ce verset.
- source_word: ἔβαλεν
  choice: y mettre
  rationale: Dans le contexte du tronc à offrandes, « mettre » décrit clairement le geste sans la nuance potentiellement trop énergique de « jeter »; « y » rend explicite la reprise naturelle du lieu mentionné dans le contexte.
- source_word: λεπτὰ δύο
  choice: deux leptes
  rationale: La translittération conserve le nom précis de la monnaie antique; une note en explique la nature et l’équivalence.
- source_word: ὅ ἐστιν
  choice: c’est-à-dire
  rationale: La proposition explicite l’équivalence monétaire des deux leptes; cette tournure est idiomatique et précise en français.
- source_word: κοδράντης
  choice: un quadrans
  rationale: Le terme historique romain préserve la monnaie nommée dans le grec et évite une équivalence moderne trompeuse.
