  source_fidelity: La proposition temporelle et explicative est bien rendue par « En effet, quand ». Toutefois, « les morts ressuscitent » ne rend pas explicitement ἐκ νεκρῶν (« d’entre les morts »), expression de résurrection qui qualifie la provenance/sphère dont ils se relèvent. La comparaison avec les anges et le pluriel locatif « dans les cieux » sont fidèles.
  naturalness: Le français est globalement clair et de registre biblique moderne. La corrélation grecque οὔτε ... οὔτε gagne à être rendue explicitement par « ni ... ni » plutôt que par deux négations coordonnées avec « et ».
  terminology: « Ressuscitent d’entre les morts », « se marient », « sont donnés en mariage », « comme les anges » et « dans les cieux » préservent les distinctions et la comparaison du grec sans en tirer de conclusion doctrinale supplémentaire.
