id: MRK.12.25
reference: Mark 12:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: fr
  text: En effet, quand ils ressuscitent d’entre les morts, ils ne se marient ni ne sont donnés en mariage, mais ils sont comme les anges dans les cieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: En effet, quand
  rationale: « En effet » restitue la valeur explicative de γάρ, tandis que « quand » exprime naturellement la proposition temporelle introduite par ὅταν.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: les morts ressuscitent
  rationale: Cette formulation française naturelle rend la résurrection d'entre les morts sans introduire le passif absent du grec. Le sujet implicite désigne ceux qui étaient morts.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: ils ne se marient pas et ne sont pas donnés en mariage
  rationale: La formulation conserve la distinction entre γαμέω, se marier, et le passif de γαμίζω, être donné en mariage, tout en restant claire en français moderne.
- source_word: ἀλλ’ εἰσὶν
  choice: mais ils sont
  rationale: « Mais » marque directement le contraste entre les usages matrimoniaux de la vie présente et la condition après la résurrection.
- source_word: ὡς ἄγγελοι
  choice: comme les anges
  rationale: 'ὡς exprime ici une comparaison, non une identité : les ressuscités sont semblables aux anges sous le rapport évoqué.'
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel « les cieux » correspond directement au pluriel grec et demeure naturel dans le registre biblique français.
theological_decisions:
- issue: Nature de la comparaison avec les anges
  choice: Les ressuscités sont comme les anges quant à l'absence de mariage.
  alternative: Les ressuscités deviennent des anges.
  rationale: La particule comparative ὡς indique une ressemblance et non une transformation ontologique. La traduction ne précise pas davantage que le texte l'étendue de cette ressemblance.
translation_notes:
  register: Français international moderne, clair et digne. « Donnés en mariage » conserve une expression biblique encore compréhensible et la distinction lexicale du grec. Le pluriel « dans les cieux » a été maintenu dans le texte plutôt que déplacé en note.
