  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: fr
  text: 'Mais ces vignerons se dirent entre eux[a] : « C’est lui l’héritier. Venez, tuons-le, et l’héritage sera à nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dirent entre eux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’héritage nous appartiendra ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Mais ces vignerons
  rationale: δέ marque ici une légère opposition narrative, rendue par « Mais ». Dans le cadre explicite de la vigne, « vignerons » désigne naturellement ceux qui la cultivent pour le propriétaire; le contexte établit leur statut sans qu’il soit nécessaire d’ajouter « locataires ».
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: se dirent entre eux
  rationale: La tournure exprime une délibération au sein du groupe. « Se dirent entre eux » conserve à la fois la réciprocité et le caractère collectif de leurs propos.
- source_word: ὅτι
  choice: ponctuation de discours direct
  rationale: ὅτι introduit ici les paroles rapportées directement; les deux-points et les guillemets constituent la formulation française naturelle.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: C’est lui l’héritier
  rationale: Cette formulation française idiomatique préserve la valeur désignative et insistante de Οὗτός ainsi que le sens juridique et familial de κληρονόμος.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Venez, tuons-le
  rationale: δεῦτε est une invitation exhortative et le subjonctif aoriste ἀποκτείνωμεν formule une proposition collective. « Tuons-le » reste direct, sans ajouter la qualification juridique de meurtre.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: et l’héritage sera à nous
  rationale: La tournure rend naturellement la possession future et maintient l’accent porté par ἡμῶν, sans ajouter « son », absent du grec.
theological_decisions:
- issue: Rendu de γεωργοί propre à la parabole
  choice: vignerons
  alternative: fermiers; métayers; cultivateurs
  rationale: Le contexte immédiat est celui d’une vigne confiée à des exploitants redevables au propriétaire. « Vignerons » est le terme français courant et traditionnel pour leur activité, sans imposer une identification allégorique supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste vif et direct. « C’est lui l’héritier » évite le tour moins idiomatique « Celui-ci est l’héritier », tandis que « Venez, tuons-le » conserve la force de l’exhortation collective.
