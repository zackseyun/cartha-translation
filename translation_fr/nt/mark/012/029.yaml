  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: fr
  text: 'Jésus répondit : « Le premier commandement est : “Écoute, Israël : le Seigneur[b] notre Dieu, le Seigneur est un[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « le Seigneur notre Dieu est un seul Seigneur » ou « le Seigneur est notre Dieu, le Seigneur seul ». Le grec fait écho à Deutéronome 6.4 et peut souligner l’unicité de Dieu, son exclusivité, ou les deux.'
    reason: alternative_reading
  - marker: b
    text: Cette phrase cite le Shema (Deutéronome 6.4). Ici, « Seigneur » traduit le grec κύριος, employé dans la Septante pour rendre le nom divin YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Rend naturellement le verbe narratif ἀποκρίνομαι dans un dialogue et conserve sa valeur de réponse.
- source_word: Πρώτη ἐστίν
  choice: Le premier, c’est
  rationale: L’adjectif grec, féminin parce qu’il renvoie implicitement à ἐντολή, désigne le premier commandement. En français, « premier » s’accorde avec « commandement », sous-entendu; la tournure présentative est naturelle sans expliciter inutilement le nom.
- source_word: Ἄκουε
  choice: Écoute
  rationale: Impératif direct qui conserve l’écho reconnaissable de l’ouverture du Shema en Deutéronome 6.4.
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Maintient l’interpellation directe du peuple; le point d’exclamation rend clairement le vocatif sans ajouter un « ô » aujourd’hui soutenu ou archaïsant.
- source_word: κύριος
  choice: le Seigneur
  rationale: Choix usuel pour κύριος. Dans cette citation du Shema, le terme grec reprend aussi l’emploi de κύριος dans la Septante à la place du nom divin YHWH; cette nuance est signalée en note.
- source_word: ὁ θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Traduction directe et idiomatique du groupe nominal possessif.
- source_word: εἷς
  choice: un
  rationale: Conserve la formulation dense du grec sans décider à la place du lecteur si l’accent porte principalement sur l’unicité de Dieu, son exclusivité, ou les deux.
theological_decisions:
- issue: Formulation de la dernière proposition du Shema et maintien de sa tension théologique
  choice: Le Seigneur notre Dieu, le Seigneur est un
  alternative: « Le Seigneur notre Dieu est un seul Seigneur » ou « Le Seigneur est notre Dieu, le Seigneur seul »
  rationale: L’ordre grec reflète la Septante de Deutéronome 6.4 et se prête à plusieurs analyses idiomatiques. La formulation retenue suit de près sa structure et préserve à la fois la confession de l’unicité divine et la possible nuance d’exclusivité, sans trancher silencieusement entre elles.
translation_notes:
  register: Français international moderne, clair et digne. « Écoute, Israël ! » conserve la solennité familière du Shema sans recourir au vocatif archaïsant « ô Israël ». Les guillemets intérieurs distinguent la citation scripturaire au sein des paroles de Jésus.
