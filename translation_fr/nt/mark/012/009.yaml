source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: fr
  text: Que fera le propriétaire[a] de la vigne ? Il viendra, fera périr les vignerons[b] et donnera la vigne à d’autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le maître de la vigne » ; grec : « le kyrios de la vigne ». Ici, ce terme désigne le propriétaire de la vigne dans la parabole.'
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire les cultivateurs auxquels le propriétaire avait confié sa vigne ; on peut aussi traduire : « les cultivateurs » ou « les fermiers » au sens de tenanciers.'
    reason: lexical_clarification
lexical_decisions:
- source_word: τί ποιήσει
  choice: Que fera
  rationale: Rend directement la question rhétorique au futur, sans ajouter de liaison absente du grec.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: le propriétaire de la vigne
  rationale: Dans le cadre immédiat de la parabole, κύριος désigne celui à qui appartient la vigne. « Propriétaire » exprime clairement ce sens sans introduire artificiellement un titre divin.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: vigne
  rationale: En français courant, « vigne » désigne naturellement ici le terrain planté de ceps et convient au cadre de la parabole.
- source_word: ἐλεύσεται
  choice: Il viendra
  rationale: Équivalent direct et naturel du futur de ἔρχομαι, qui conserve le caractère saisissant de l’intervention annoncée.
- source_word: ἀπολέσει
  choice: fera périr
  rationale: Cette expression conserve la gravité de ἀπόλλυμι et son caractère décisif sans réduire explicitement le verbe au seul acte de tuer.
- source_word: τοὺς γεωργούς
  choice: les vignerons
  rationale: Dans le contexte d’une vigne, « vignerons » désigne naturellement ceux qui la cultivent. Leur statut de tenanciers ressort de la parabole et est précisé en note.
- source_word: δώσει
  choice: donnera
  rationale: Rend directement le futur de δίδωμι sans préciser indûment s’il s’agit de céder, louer ou confier.
- source_word: ἄλλοις
  choice: à d’autres
  rationale: Préserve l’expression ouverte du grec, qui ne répète pas le nom des nouveaux bénéficiaires.
theological_decisions:
- issue: Sens de κύριος dans une parabole où le référent immédiat n’est pas explicitement divin
  choice: propriétaire
  alternative: maître / seigneur
  rationale: Le mot désigne ici, dans le récit, le propriétaire de la vigne. Ce choix laisse les implications théologiques de la parabole se dégager du contexte sans transformer le terme en titre divin dans la formulation immédiate.
- issue: Portée de ἀπολέσει dans l’annonce du jugement
  choice: fera périr
  alternative: détruira / tuera
  rationale: « Fera périr » maintient la sévérité du jugement et la portée relativement large du verbe grec, sans imposer une modalité plus précise que le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la brièveté et la force rhétorique du grec. « Vignerons » est plus naturel dans ce contexte que « cultivateurs », tandis que la note explicite leur statut de tenanciers.
