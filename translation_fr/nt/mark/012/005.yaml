id: MRK.12.5
reference: Mark 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: fr
  text: 'Puis il en envoya un autre ; celui-là aussi, ils le tuèrent. Il en envoya encore beaucoup d’autres[a] : ils battirent les uns et tuèrent les autres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et beaucoup d’autres », le verbe « envoya » étant sous-entendu.'
    reason: clarification_syntaxique
lexical_decisions:
- source_word: ἄλλον
  choice: un autre
  rationale: Dans la suite du récit, ἄλλον désigne un autre serviteur envoyé par le propriétaire. « Un autre » est direct et naturel en français.
- source_word: ἀπέστειλεν
  choice: il en envoya
  rationale: Le pronom « en » reprend naturellement les serviteurs déjà mentionnés dans le contexte, tandis que le passé simple conserve le rythme narratif de l’aoriste.
- source_word: κἀκεῖνον
  choice: celui-là aussi
  rationale: La contraction καί + ἐκεῖνον associe une valeur démonstrative et additive. « Celui-là aussi » rend explicitement les deux nuances.
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: ils le tuèrent / tuèrent
  rationale: ἀποκτείνω signifie directement « tuer » ou « mettre à mort ». « Tuer » convient au récit et ne lui ajoute aucune nuance judiciaire.
- source_word: πολλοὺς ἄλλους
  choice: beaucoup d’autres
  rationale: L’expression désigne de nombreux serviteurs supplémentaires. Le verbe « envoya », sous-entendu en grec, est répété en français pour assurer la clarté.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: les uns ... les autres
  rationale: Cette tournure française rend naturellement la répartition exprimée par la construction corrélative grecque.
- source_word: δέροντες
  choice: ils battirent
  rationale: δέρω désigne ici le fait de battre ou de frapper violemment, sans imposer l’idée plus précise d’une flagellation judiciaire.
theological_decisions:
- issue: Rendu de la proposition participiale récapitulative
  choice: 'Transformer les participes en verbes conjugués : « ils battirent les uns et tuèrent les autres »'
  alternative: « battant les uns et tuant les autres »
  rationale: La construction grecque répartit les traitements subis par les nombreux serviteurs. Des verbes conjugués donnent en français moderne une formulation plus naturelle sans modifier la progression ni la violence du récit.
- issue: Explicitation du verbe sous-entendu avec πολλοὺς ἄλλους
  choice: Répéter « il en envoya »
  alternative: 'Conserver l’ellipse : « et beaucoup d’autres »'
  rationale: Le grec laisse le verbe précédent sous-entendu. Sa répétition évite en français une phrase fragmentaire, sans trancher une question doctrinale ni ajouter une nouvelle action.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit, tandis que « celui-là aussi » préserve l’insistance démonstrative et additive du grec. La ponctuation met en évidence le résumé des violences infligées aux nombreux serviteurs.
