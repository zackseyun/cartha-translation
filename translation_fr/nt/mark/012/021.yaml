source:
  edition: SBLGNT
  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: fr
  text: Le deuxième l’épousa[a] et mourut sans laisser de descendance[b]. Le troisième fit de même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « la prit » ; ici, au sens de « la prit pour femme ».
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits omettent « sans laisser de descendance ».
    reason: textual_variant
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: le deuxième
  rationale: L’adjectif ordinal substantivé désigne le deuxième homme de la série. « Frère » est implicite dans le contexte, mais n’est pas ajouté ici.
- source_word: ἔλαβεν αὐτήν
  choice: l’épousa
  rationale: Littéralement « la prit » ; dans ce contexte de lévirat, l’expression signifie qu’il la prit pour femme. « L’épousa » transmet naturellement ce sens en français moderne, tandis que la note conserve la forme plus littérale.
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Rendu direct du verbe, conforme au style narratif simple du passage.
- source_word: μὴ καταλιπὼν
  choice: sans laisser
  rationale: 'Cette tournure française naturelle exprime la circonstance liée à sa mort : il ne laissa aucune descendance.'
- source_word: σπέρμα
  choice: descendance
  rationale: Dans le contexte du lévirat, le terme désigne une postérité ou des descendants, non une semence au sens matériel. « Descendance » évite aussi de restreindre indûment le sens à un seul enfant.
- source_word: ὁ τρίτος ὡσαύτως
  choice: Le troisième fit de même
  rationale: 'Cette formulation restitue clairement l’ellipse grecque : les mêmes actions et le même résultat sont sous-entendus.'
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « L’épousa » évite l’ambiguïté peu naturelle de « la prit » en français tout en signalant en note la formulation grecque. La brièveté de la dernière proposition conserve le caractère elliptique du texte source.
