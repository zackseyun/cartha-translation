id: MRK.12.34
reference: Mark 12:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: fr
  text: 'Jésus, voyant qu’il avait répondu avec discernement, lui dit : « Tu n’es pas loin du royaume de Dieu[a]. » Et personne n’osait plus l’interroger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es proche du royaume de Dieu. » Le grec exprime la proximité, sans affirmer explicitement l’entrée dans le royaume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: voyant
  rationale: Le participe présent conserve de façon naturelle l’observation qui motive la parole de Jésus.
- source_word: νουνεχῶς
  choice: avec discernement
  rationale: Cette expression rend l’idée d’une réponse réfléchie, sensée et intelligente, tout en gardant un registre digne et courant.
- source_word: ἀπεκρίθη
  choice: avait répondu
  rationale: Le plus-que-parfait marque clairement que la réponse du spécialiste de la Loi précède l’appréciation et la parole de Jésus.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Tu n’es pas loin de
  rationale: Cette formulation idiomatique préserve la métaphore spatiale et affirme la proximité sans déclarer une entrée effective.
- source_word: βασιλείας τοῦ θεοῦ
  choice: royaume de Dieu
  rationale: Expression française consacrée dans les Évangiles, elle peut évoquer à la fois le règne de Dieu et le domaine où il s’exerce.
- source_word: οὐκέτι
  choice: plus
  rationale: Avec l’imparfait négatif « n’osait plus », ce terme exprime naturellement qu’à partir de ce moment personne ne continua à l’interroger.
- source_word: ἐτόλμα
  choice: osait
  rationale: L’imparfait français correspond bien à l’imparfait grec et exprime l’absence persistante d’audace.
- source_word: ἐπερωτῆσαι
  choice: l’interroger
  rationale: Dans ce contexte de questions potentiellement éprouvantes, « interroger » est plus précis que le neutre « demander », sans suggérer un interrogatoire formel.
theological_decisions:
- issue: Situation du spécialiste de la Loi par rapport au royaume de Dieu
  choice: « Tu n’es pas loin du royaume de Dieu »
  alternative: « Tu es proche du royaume de Dieu »
  rationale: Le grec affirme une proximité, mais non une possession du royaume ni une entrée explicite dans celui-ci. La formulation conserve ainsi la tension entre l’éloge du discernement de l’homme et l’absence de déclaration selon laquelle il serait déjà dans le royaume.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. La syntaxe reste proche du grec sans raideur, et la portée théologique de la métaphore spatiale demeure ouverte.
