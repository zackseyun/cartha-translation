  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: fr
  text: Et tu aimeras le Seigneur ton Dieu de tout ton cœur, et de toute ton âme[a], et de toute ton intelligence[b], et de toute ta force[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toute ta vie » pour « de toute ton âme » (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: Ou « de toute ta pensée » pour « de toute ton intelligence » (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: Ou « de toute ta puissance » pour « de toute ta force » (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: tu aimeras
  rationale: Le futur de l’indicatif reprend ici la forme du commandement cité et possède une valeur impérative. « Tu aimeras » conserve cette forme scripturaire tout en restant naturel en français.
- source_word: κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: Cette formulation rend directement la désignation grecque et préserve l’écho de la formule d’alliance.
- source_word: ἐξ ὅλης
  choice: de tout / de toute
  rationale: Dans cette tournure, la préposition ἐξ associée à ὅλης exprime l’engagement total de chaque faculté. La construction française consacrée et idiomatique est « de tout ton… / de toute ton… ».
- source_word: καρδίας
  choice: cœur
  rationale: « Cœur » rend le centre intérieur de la volonté et des affections sans en réduire le sens à la seule émotion.
- source_word: ψυχῆς
  choice: âme
  rationale: ψυχή peut désigner l’âme, la vie ou la personne. « Âme » maintient ici la distinction entre les quatre termes de l’énumération; « vie » est signalé en note.
- source_word: διανοίας
  choice: pensée
  rationale: διάνοια désigne la faculté de penser et de comprendre. « Pensée » est clair et naturel dans cette énumération, tandis que « intelligence » demeure une possibilité signalée en note.
- source_word: ἰσχύος
  choice: force
  rationale: ἰσχύς désigne la force ou la puissance dont une personne dispose. « Force » est direct, courant et adapté à la formule.
- source_word: καὶ … καὶ … καὶ … καὶ
  choice: et … et … et … et
  rationale: La répétition de « et » conserve le rythme cumulatif et l’insistance du grec plutôt que de transformer les éléments en une simple liste française.
theological_decisions:
- issue: Rendu de κύριος dans la citation du commandement
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte grec porte κύριος. « Le Seigneur » respecte donc directement le texte néotestamentaire et son écho à la formule d’alliance, sans introduire une convention typographique qui n’apparaît pas dans le grec.
- issue: Distinction entre les quatre dimensions de la personne
  choice: cœur / âme / pensée / force
  alternative: cœur / vie / intelligence / puissance
  rationale: Les quatre termes sont maintenus distincts afin de préserver la description plurielle et rhétorique d’un amour total pour Dieu, sans la réduire à une paraphrase générale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à la deuxième personne du singulier du commandement. La répétition des coordinations, légèrement plus marquée qu’en prose française ordinaire, est conservée pour rendre l’accumulation emphatique du grec.
