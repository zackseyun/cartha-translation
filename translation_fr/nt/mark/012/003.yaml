  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: fr
  text: Ils le prirent, le battirent et le renvoyèrent les mains vides.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vide », c’est-à-dire sans avoir rien reçu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: ils le prirent
  rationale: Le participe aoriste exprime ici la première action d’une suite. « Ils le prirent » reste proche du sens de λαμβάνω sans renforcer inutilement le geste par « saisirent » ou « s’emparèrent ».
- source_word: ἔδειραν
  choice: le battirent
  rationale: Le verbe δέρω désigne le fait de battre ou de rouer de coups. « Battirent » est clair et ne suppose pas une flagellation officielle.
- source_word: ἀπέστειλαν
  choice: le renvoyèrent
  rationale: Dans ce contexte, ἀποστέλλω indique que les vignerons font repartir le serviteur. « Renvoyèrent » exprime naturellement ce mouvement en français.
- source_word: κενόν
  choice: les mains vides
  rationale: L’adjectif signifie littéralement « vide », mais il indique ici que le serviteur repart sans rien recevoir. L’expression française « les mains vides » transmet ce sens avec naturel.
- source_word: καὶ ... καὶ
  choice: virgule ... et
  rationale: Le français coordonne naturellement cette courte série d’actions par une virgule puis « et », tout en conservant leur succession narrative simple.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe brève conserve le rythme direct du récit grec.
