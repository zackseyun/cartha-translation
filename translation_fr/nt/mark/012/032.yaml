source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: fr
  text: 'Le spécialiste de la Loi lui dit : « Bien dit, Maître. Tu as dit en vérité qu’il est un et qu’il n’y en a pas d’autre que lui.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite d’après le contexte : « Dieu est un, et il n’y en a pas d’autre que lui. » Le grec dit simplement « il est un » ; le sujet est fourni par le contexte précédent.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: spécialiste de la Loi
  rationale: Dans ce contexte évangélique, le terme désigne un spécialiste reconnu des Écritures et de la Loi. Cette formulation est plus immédiatement compréhensible en français moderne que « scribe », qui peut évoquer surtout un copiste.
- source_word: Καλῶς
  choice: Bien dit
  rationale: L’adverbe exprime l’approbation de la réponse précédente de Jésus. « Bien dit » est naturel et concis.
- source_word: διδάσκαλε
  choice: Maître
  rationale: Comme terme d’adresse à Jésus, « Maître » est l’équivalent français usuel de διδάσκαλος et conserve l’idée d’enseignant respecté.
- source_word: ἐπ’ ἀληθείας
  choice: avec vérité
  rationale: Cette tournure dignifiée reste naturelle et reflète plus distinctement la locution grecque qu’un simple adverbe comme « vraiment ».
- source_word: εἶπες
  choice: tu as dit
  rationale: Le passé composé convient à une parole qui vient d’être prononcée et garde le dialogue naturel.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Jésus a dit, et non la cause de l’approbation.
- source_word: εἷς ἐστιν
  choice: il est un
  rationale: Le grec laisse le sujet implicite, fourni par le contexte précédent. La formulation française préserve cette ellipse sans ajouter explicitement « Dieu ».
- source_word: οὐκ ἔστιν ἄλλος
  choice: il n’y en a pas d’autre
  rationale: Cette tournure idiomatique exprime clairement l’absence de tout autre sans alourdir la phrase.
- source_word: πλὴν αὐτοῦ
  choice: que lui
  rationale: Après la construction négative « il n’y en a pas d’autre », « que lui » rend naturellement l’exception exclusive exprimée par πλήν avec le génitif.
theological_decisions:
- issue: Sujet implicite de εἷς ἐστιν
  choice: Conserver « il est un » dans le texte principal.
  alternative: « Dieu est un » ou « il n’y a qu’un seul Dieu »
  rationale: Le contexte identifie clairement Dieu comme référent, mais le grec de ce verset ne répète pas θεός. La traduction conserve donc la formulation elliptique et son ambiguïté grammaticale limitée, tandis que la note explicite le référent contextuel.
translation_notes:
  register: Français international moderne, clair et digne. « Spécialiste de la Loi » explicite la fonction de γραμματεύς pour le lectorat courant. La phrase conserve l’ellipse grecque concernant Dieu, avec une note pour en garantir la clarté.
