id: MRK.12.37
reference: Mark 12:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: fr
  text: David lui-même l’appelle Seigneur[a] ; comment donc est-il son fils[b] ? Et la foule nombreuse l’écoutait avec plaisir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le reconnaît comme Seigneur ».'
    reason: lexical_alternative
  - marker: b
    text: '« Fils » fait ici écho au titre messianique « fils de David » et peut aussi avoir le sens plus large de « descendant ». Littéralement, la question commence par « d’où » : « d’où vient qu’il est son fils ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: David lui-même
  rationale: L’emploi intensif de αὐτός souligne que David en personne donne ce titre au Messie.
- source_word: λέγει αὐτὸν κύριον
  choice: l’appelle Seigneur
  rationale: Dans cette construction prédicative, « appelle » est plus naturel que « dit » en français et conserve la force du titre κύριος.
- source_word: πόθεν
  choice: comment donc
  rationale: Bien que πόθεν signifie littéralement « d’où », il porte ici sur la logique ou le fondement de la relation affirmée. « Comment donc » rend naturellement la question argumentative.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: est-il son fils
  rationale: « Fils » préserve à la fois le terme grec et l’écho du titre messianique « fils de David », sans expliciter en « descendant » dans le corps du texte.
- source_word: ὁ πολὺς ὄχλος
  choice: la foule nombreuse
  rationale: L’expression désigne une foule importante par le nombre ; cette formulation reste claire et évite d’y voir une catégorie sociale.
- source_word: ἤκουεν αὐτοῦ
  choice: l’écoutait
  rationale: L’imparfait français reflète l’aspect duratif de l’imparfait grec et le contexte d’une écoute attentive.
- source_word: ἡδέως
  choice: avec plaisir
  rationale: Cette locution française courante exprime le plaisir pris à écouter, sans tonalité archaïque.
theological_decisions:
- issue: Portée christologique du titre « Seigneur » donné par David
  choice: Conserver le titre direct « Seigneur » et la question rhétorique sans explication ajoutée.
  alternative: « David lui-même appelle le Messie “Seigneur” ; en quel sens est-il donc son fils ? »
  rationale: Le texte suggère que l’identité du Messie ne se réduit pas à sa filiation davidique, mais la traduction doit maintenir cette tension sans introduire une conclusion doctrinale absente du verset.
- issue: Sens de υἱός dans le contexte messianique
  choice: fils
  alternative: descendant
  rationale: « Descendant » expliciterait le sens dynastique, mais « fils » conserve le vocabulaire du texte et son lien avec le titre messianique « fils de David ».
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’insistance sur David, le titre « Seigneur », la tension de la question et l’écoute favorable de la foule.
