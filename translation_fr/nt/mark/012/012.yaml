id: MRK.12.12
reference: Mark 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: fr
  text: Ils cherchaient à se saisir de lui, mais ils eurent peur de la foule, car ils avaient compris que c’était contre eux qu’il avait raconté cette parabole.[a] Alors ils le laissèrent et s’en allèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il avait raconté cette parabole à leur sujet » ou « en s’adressant à eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait exprime une démarche en cours ou une tentative, sans ajouter une nuance absente du grec.
- source_word: κρατῆσαι
  choice: à se saisir de lui
  rationale: Cette expression conserve le sens concret de prendre ou de saisir, sans préciser qu’il s’agissait d’une arrestation juridiquement formelle.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: ils eurent peur de la foule
  rationale: Formulation naturelle en français qui rend directement le verbe et son objet.
- source_word: ἔγνωσαν
  choice: ils avaient compris
  rationale: « Compris » convient à la prise de conscience du sens de la parabole; le plus-que-parfait marque naturellement l’antériorité par rapport à leur crainte et à leur tentative.
- source_word: πρὸς αὐτοὺς
  choice: contre eux
  rationale: Dans ce contexte hostile, la tournure exprime naturellement que la parabole les visait de manière défavorable, tout en signalant en note les lectures plus neutres possibles.
- source_word: τὴν παραβολὴν
  choice: cette parabole
  rationale: Le démonstratif renvoie naturellement en français à la parabole qui vient d’être racontée.
- source_word: εἶπεν
  choice: avait raconté
  rationale: Avec « parabole », « raconter » est idiomatique; le plus-que-parfait situe l’énoncé avant leur compréhension.
- source_word: ἀφέντες αὐτὸν
  choice: ils le laissèrent
  rationale: Rend simplement le fait qu’ils renoncent à agir contre Jésus et le laissent là, sans expliciter davantage.
- source_word: ἀπῆλθον
  choice: s’en allèrent
  rationale: Expression narrative naturelle, actuelle et digne pour leur départ.
theological_decisions:
- issue: Portée de πρὸς αὐτοὺς
  choice: contre eux
  alternative: à leur sujet / en s’adressant à eux
  rationale: Le contexte soutient une orientation hostile, mais la préposition reste susceptible d’une lecture plus neutre; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Se saisir de lui » reste proche du grec sans imposer l’idée d’une procédure officielle; la note préserve l’amplitude sémantique de πρὸς αὐτούς.
