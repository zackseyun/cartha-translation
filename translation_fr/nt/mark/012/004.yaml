  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: fr
  text: Il leur envoya encore un autre serviteur[a] ; ils le frappèrent à la tête[b] et le traitèrent avec mépris[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un autre esclave ». Le mot grec peut désigner un serviteur ou un esclave selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Le verbe grec, rare, désigne ici une violence exercée contre la tête ; on pourrait aussi traduire « le blessèrent à la tête ». Il ne signifie probablement pas « le décapitèrent ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le déshonorèrent » ou « le traitèrent honteusement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: encore
  rationale: Marque la répétition dans la suite du récit, avec une formulation française naturelle et concise.
- source_word: ἀπέστειλεν
  choice: il envoya
  rationale: L’aoriste rapporte simplement l’action passée ; « envoya » convient au style narratif de la parabole.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Avec le verbe « envoyer », le pronom indirect rend naturellement en français le mouvement vers les destinataires.
- source_word: ἄλλον δοῦλον
  choice: un autre serviteur
  rationale: « Serviteur » exprime naturellement ici la relation au maître sans effacer l’autre sens possible de δοῦλος, « esclave », signalé en note.
- source_word: κἀκεῖνον
  choice: ils le
  rationale: Le français intègre naturellement le sens de « et celui-là » dans l’enchaînement par le pronom objet, tandis que le point-virgule maintient la continuité narrative.
- source_word: ἐκεφαλίωσαν
  choice: le frappèrent à la tête
  rationale: Ce verbe rare désigne une violence exercée contre la tête. Cette traduction claire évite de lui donner à tort le sens de « décapiter ».
- source_word: ἠτίμασαν
  choice: le traitèrent avec mépris
  rationale: Le verbe évoque le déshonneur et le traitement honteux. Cette expression actuelle conserve la dimension d’humiliation sans être artificielle.
