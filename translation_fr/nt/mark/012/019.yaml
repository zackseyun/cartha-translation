- from: « Maître, Moïse nous a écrit[c] que, si le frère de quelqu’un meurt en laissant une femme, mais sans laisser d’enfant[a], son frère doit prendre cette femme pour épouse et susciter une descendance pour son frère[b]. »
  to: « Maître, Moïse nous a écrit[c] que, si le frère de quelqu’un meurt en laissant une épouse et sans laisser d’enfant[a], son frère doit prendre cette femme pour épouse et susciter une descendance pour son frère[b]. »
  rationale: La révision élimine l’opposition non exprimée par le grec et précise que la γυναῖκα laissée est l’épouse du défunt. Elle maintient l’ambiguïté pronominale et la formulation juridique du texte, sans ajouter d’interprétation confessionnelle.
