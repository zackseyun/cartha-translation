source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: fr
  text: « Maître, Moïse nous a écrit[c] que, si le frère de quelqu’un meurt en laissant une épouse et sans laisser d’enfant[a], son frère doit prendre cette femme pour épouse et susciter une descendance pour son frère[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ne laisse pas d’enfant » ; le singulier a ici une valeur générale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « susciter une semence pour son frère », expression désignant le fait de lui assurer une descendance conformément au mariage léviratique.
    reason: lexical_alternative
  - marker: c
    text: Voir Deutéronome 25.5, loi de Moïse à laquelle il est fait référence.
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Forme d’adresse naturelle et respectueuse en français pour un enseignant reconnu. « Enseignant » serait peu idiomatique comme apostrophe, tandis que le contexte indique ici la fonction d’enseignement plutôt qu’un rapport de possession ou de domination.
- source_word: ἔγραψεν ἡμῖν
  choice: nous a écrit
  rationale: Reproduit simplement le verbe « écrire » et le datif ἡμῖν, qui présente la prescription mosaïque comme donnée au peuple d’Israël.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: si le frère de quelqu’un meurt
  rationale: Rend l’indéfini τινος sans transformer inutilement l’expression générale en « le frère d’un homme ».
- source_word: καταλίπῃ γυναῖκα
  choice: en laissant une femme
  rationale: Le verbe désigne ce que le défunt laisse derrière lui. « Femme » conserve la double valeur conjugale et féminine de γυνή dans ce contexte légal.
- source_word: μὴ ἀφῇ τέκνον
  choice: sans laisser d’enfant
  rationale: Le singulier τέκνον est conservé sous sa valeur générique. La formulation française exprime naturellement l’absence de tout enfant.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: son frère doit prendre cette femme pour épouse
  rationale: « Prendre pour épouse » explicite en français la valeur matrimoniale de λάβῃ sans remplacer entièrement l’expression grecque par une paraphrase comme « épouser la veuve ».
- source_word: ἐξαναστήσῃ σπέρμα
  choice: susciter une descendance
  rationale: « Susciter » préserve l’image d’établir ou de faire naître une lignée, tandis que « descendance » communique clairement le sens contextuel de σπέρμα.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: pour son frère
  rationale: Le datif exprime ici le bénéficiaire ou la personne au nom de laquelle la descendance doit être suscitée. La mort du frère ressort déjà de la proposition conditionnelle.
theological_decisions:
- issue: Expression juridique du mariage léviratique
  choice: « prendre cette femme pour épouse et susciter une descendance pour son frère »
  alternative: « épouser la veuve et avoir des descendants au nom de son frère défunt »
  rationale: Le choix retenu rend le sens juridique intelligible tout en préservant les expressions grecques « prendre la femme » et « susciter une descendance », sans ajouter explicitement « au nom de » ni répéter « défunt ».
- issue: Termes sexués dans la loi citée
  choice: Conserver « frère » et « femme »
  alternative: Employer des termes neutres tels que « membre de la fratrie » et « conjoint »
  rationale: Le grec décrit explicitement un frère et une femme dans le cadre précis du mariage léviratique. Neutraliser ces termes modifierait la situation juridique évoquée.
translation_notes:
  register: Français international moderne, clair et digne. La tournure juridique reste proche du grec, mais « pour épouse » et « descendance » évitent l’opacité que produiraient les calques nus « prendre la femme » et « susciter une semence ».
