    issue: Conjonction adversative « mais »
    rationale: Le grec coordonne « laisse une épouse » et « ne laisse pas d’enfant » par καί … καί, sans opposition explicitement marquée. « Et sans laisser d’enfant » conserve mieux cette relation.
  - severity: low
    issue: « une femme » dans la condition
    rationale: Dans ce contexte de décès et d’obligation léviratique, γυνή désigne l’épouse. « Une épouse » évite l’ambiguïté moderne de « une femme » tout en restant fidèle.
