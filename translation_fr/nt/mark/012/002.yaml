id: MRK.12.2
reference: Mark 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: fr
  text: Au moment voulu, il envoya un esclave[a] auprès des vignerons[b] afin de recevoir d’eux une part des fruits de la vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur » pour δοῦλος.
    reason: alternative_reading
  - marker: b
    text: Ou « cultivateurs » ou « fermiers ». Le terme grec désigne ceux qui travaillent la terre; le contexte de la vigne justifie ici « vignerons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Équivalent narratif courant de ἀποστέλλω, naturel en français moderne et fidèle à l’action exprimée par l’aoriste.
- source_word: γεωργοὺς / γεωργῶν
  choice: vignerons
  rationale: γεωργός désigne ceux qui travaillent la terre. Dans le cadre précis d’une vigne, « vignerons » restitue naturellement cette activité sans imposer dans le texte principal le statut juridique de locataires.
- source_word: τῷ καιρῷ
  choice: au moment voulu
  rationale: καιρός désigne ici le moment approprié, vraisemblablement celui où le fruit est disponible. Cette formulation conserve cette nuance sans préciser davantage que le grec.
- source_word: δοῦλον
  choice: esclave
  rationale: δοῦλος désigne une personne asservie appartenant à un maître. « Esclave » garde cette réalité sociale, tandis que « serviteur » demeure une traduction traditionnelle possible signalée en note.
- source_word: ἵνα ... λάβῃ
  choice: afin de recevoir
  rationale: La proposition introduite par ἵνα exprime le but. « Afin de recevoir » le rend clairement et dans un registre digne.
- source_word: παρὰ τῶν γεωργῶν
  choice: d’eux
  rationale: παρά avec le génitif marque la provenance. Le pronom évite en français une répétition pesante tout en renvoyant sans ambiguïté aux vignerons.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: une part des fruits de la vigne
  rationale: 'ἀπό avec le génitif a ici une valeur partitive : il s’agit de recevoir une portion de la récolte. « Une part » explicite naturellement ce sens sans ajouter l’idée juridiquement plus précise de « sa part ».'
- source_word: ἀμπελῶνος
  choice: vigne
  rationale: Dans ce contexte, « la vigne » désigne naturellement le domaine planté de ceps déjà introduit au verset précédent; « vignoble » serait également possible mais plus lourd ici.
theological_decisions: []
