    issue: « une pièce d’un denier »
    rationale: Cette expression est maladroite en français moderne et peut suggérer une pièce ayant la valeur d’un denier. δηνάριον désigne ici directement un denier, une monnaie romaine.
  - severity: low
    issue: Accord du pronom dans « que je la voie »
    rationale: 'Une fois la monnaie désignée naturellement par « un denier », le pronom de reprise doit être masculin : « que/pour que je le voie ».'
