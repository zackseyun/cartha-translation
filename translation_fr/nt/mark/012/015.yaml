review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu : Jésus connaît leur hypocrisie, dénonce leur mise à l’épreuve et demande qu’on lui apporte un denier afin de le voir. « Une pièce d’un denier » n’est toutefois pas une désignation française naturelle du δηνάριον et risque de faire du denier une valeur plutôt que le nom de la monnaie.'
  naturalness: « Un denier » est la formulation française usuelle, claire et historiquement précise. Le pronom doit donc être masculin (« le voie »). « Pour que je le voie » exprime naturellement le but de ἵνα ἴδω.
  terminology: « Hypocrisie », « me mettez-vous à l’épreuve » et « denier » conviennent au registre et préservent les nuances du texte. La note alternative « me tentez-vous » est recevable comme possibilité lexicale, sans être imposée dans le texte.
  issues:
