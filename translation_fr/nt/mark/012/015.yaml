id: MRK.12.15
reference: Mark 12:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: fr
  text: 'Mais lui, connaissant leur hypocrisie, leur dit : « Pourquoi me mettez-vous à l’épreuve[b] ? Apportez-moi un denier[a], pour que je le voie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était une monnaie romaine en argent, correspondant couramment au salaire d’une journée de travail.
    reason: cultural_note
  - marker: b
    text: Ou « Pourquoi me tentez-vous ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: connaissant
  rationale: Le participe exprime ici la pleine conscience que Jésus a de leur attitude. « Connaissant » conserve la valeur cognitive du grec sans préciser par quel moyen il l’a discernée.
- source_word: ὑπόκρισιν
  choice: hypocrisie
  rationale: 'Ce terme garde la force morale du grec et convient au contexte : leur apparente sincérité dissimule un piège.'
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette tournure interrogative, le littéral « quoi ? » a une valeur adverbiale et demande la raison de leur action.
- source_word: πειράζετε
  choice: me mettez-vous à l’épreuve
  rationale: Cette expression rend l’action hostile consistant à éprouver Jésus ou à chercher à le prendre au piège, sans la limiter à une incitation au péché.
- source_word: φέρετέ
  choice: Apportez-moi
  rationale: L’impératif demande aux interlocuteurs de lui présenter concrètement la pièce.
- source_word: δηνάριον
  choice: une pièce d’un denier
  rationale: Le nom historique de la monnaie est conservé, tandis que « pièce » indique immédiatement au lecteur moderne la nature de l’objet.
- source_word: ἵνα ἴδω
  choice: que je la voie
  rationale: Cette formulation française naturelle conserve la proposition de but; le pronom féminin reprend explicitement « pièce », référent sous-entendu en grec.
theological_decisions:
- issue: Portée de πειράζετε dans l’accusation de Jésus
  choice: me mettez-vous à l’épreuve
  alternative: me tentez-vous
  rationale: Le contexte indique une mise à l’épreuve malveillante destinée à piéger Jésus. La formulation retenue préserve cette hostilité sans imposer le sens plus étroit d’une incitation au péché.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle. Les marqueurs de notes ont été placés sur les expressions qu’ils expliquent : [b] après « à l’épreuve » et [a] après « denier ».'
