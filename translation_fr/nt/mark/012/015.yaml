  rationale: La révision remplace la formulation non idiomatique « une pièce d’un denier » par « un denier », nom français établi de la monnaie mentionnée. Elle ajuste en conséquence le pronom et maintient les deux ancres de note sur les expressions qu’elles expliquent. Aucun changement de sens ni d’interprétation doctrinale n’est introduit.
