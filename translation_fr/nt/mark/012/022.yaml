  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: fr
  text: Et aucun des sept ne laissa de descendance. Enfin, après eux tous, la femme mourut elle aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: aucun des sept
  rationale: Le groupe nominal désigne les sept frères déjà mentionnés. Avec la négation portée par le verbe grec, « aucun des sept » exprime naturellement en français que pas un seul ne laissa de descendance.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: ne laissa de descendance
  rationale: Littéralement, ils « ne laissèrent pas de semence ». Dans ce contexte, σπέρμα désigne une descendance; la formulation retenue transmet clairement l’idée sans employer une image devenue opaque ou ambiguë en français courant.
- source_word: ἔσχατον πάντων
  choice: Enfin, après eux tous
  rationale: La locution marque le dernier événement de la série. « Après eux tous » conserve explicitement πάντων et évite que « en dernier de tous » paraisse inclure la femme dans un groupe masculin.
- source_word: καὶ ἡ γυνὴ
  choice: la femme mourut elle aussi
  rationale: 'Le καί a ici une valeur additive : après les sept hommes, la femme meurt à son tour. « Elle aussi » rend cette nuance avec naturel.'
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Le verbe signifie directement « mourir ». Le passé simple convient au registre narratif digne et concis du passage.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure demeure concise, garde la progression narrative et explicite naturellement le référent collectif sans ajouter « frères » au texte grec de ce verset.
