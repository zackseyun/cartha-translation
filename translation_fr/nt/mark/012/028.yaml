reference: Mark 12:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: fr
  text: 'L’un des spécialistes de la Loi s’approcha, les entendit débattre et, voyant que Jésus leur avait bien répondu, lui demanda : « Quel est le premier[a] de tous les commandements ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel est le plus important de tous les commandements ? » ou « Quel est le principal de tous les commandements ? »'
    reason: Alternative lexicale reflétant le sens possible de πρώτη comme primauté de rang.
lexical_decisions:
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Dans ce contexte évangélique, le terme désigne des spécialistes juifs reconnus des Écritures et de la Loi. « Spécialistes de la Loi » communique leur fonction plus clairement en français moderne que « scribes », sans les réduire à de simples copistes.
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe exprime un mouvement vers Jésus. « S’approcha » est naturel, précis et ne surcharge pas la scène.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: Il les avait entendus débattre
  rationale: συζητέω peut évoquer une discussion ou un débat. « Débattre » convient à cet échange public de questions controversées sans nécessairement suggérer une querelle hostile.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: voyant que Jésus leur avait bien répondu
  rationale: « Bien répondu » rend directement καλῶς. Le nom « Jésus », implicite dans le pronom grec, clarifie naturellement en français l’identité de celui qui avait répondu, alors que plusieurs référents masculins sont présents.
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Le verbe signifie ici poser une question. « Demanda » est la formulation française la plus simple et naturelle.
- source_word: Ποία
  choice: Quel
  rationale: Le mot interrogatif demande d’identifier un commandement parmi l’ensemble des commandements.
- source_word: ἐντολή
  choice: commandement
  rationale: « Commandement » est le terme français établi dans un contexte où la Loi biblique est en vue.
- source_word: πρώτη πάντων
  choice: le premier de tous
  rationale: Cette formulation reste proche du grec et conserve l’ambiguïté entre priorité de rang et ordre, tandis que le contexte suivant précise le sens.
theological_decisions:
- issue: Sens de πρώτη dans la question sur le commandement
  choice: le premier de tous
  alternative: le plus important de tous / le principal de tous
  rationale: πρώτη signifie littéralement « premier » mais peut marquer la primauté ou le rang. Le texte principal garde « premier » afin de préserver cette amplitude sémantique sans imposer une paraphrase interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque longue est divisée pour une lecture naturelle. « Spécialistes de la Loi » explicite la fonction historique de γραμματεῖς; la majuscule à « Loi » indique ici la Loi biblique. Le maintien de « premier » préserve l’ambiguïté authentique du grec.
