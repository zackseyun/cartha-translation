base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: fr
  text: 'Il lui restait encore un fils, un fils bien-aimé. Il l’envoya vers eux en dernier, en disant : « Ils respecteront[a] mon fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi évoquer le fait d’éprouver de la honte devant quelqu’un ou de lui témoigner de la déférence ; ici, le contexte favorise « respecter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Il lui restait encore une seule personne
  rationale: Rend l’idée d’une dernière personne encore disponible à envoyer. « Une seule personne » prépare naturellement l’apposition « un fils bien-aimé » sans introduire le mot « autre », absent du grec.
- source_word: υἱὸν ἀγαπητόν
  choice: un fils bien-aimé
  rationale: « Bien-aimé » conserve la force affective de ἀγαπητός et sa résonance dans l’Évangile selon Marc, sans explicitation théologique.
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: Il l’envoya vers eux en dernier
  rationale: « En dernier » garde la valeur séquentielle et culminante de ἔσχατον; « vers eux » correspond directement à πρὸς αὐτούς dans ce contexte d’envoi.
- source_word: λέγων ὅτι
  choice: en se disant
  rationale: Le participe introduit ici la pensée ou l’attente du propriétaire; « en se disant » fournit en français un enchaînement naturel vers le discours direct.
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: Ils respecteront mon fils
  rationale: Dans ce contexte, ἐντρέπομαι exprime le respect ou la déférence que la présence du fils devrait susciter. « Respecteront » est clair, actuel et idiomatique.
theological_decisions:
- issue: Résonance christologique de « fils bien-aimé »
  choice: Conserver « un fils bien-aimé » sans développer l’allusion
  alternative: un fils qu’il aimait tendrement
  rationale: La formulation préserve l’écho avec la présentation de Jésus comme Fils bien-aimé ailleurs dans Marc, tout en laissant au lecteur le soin d’en percevoir la portée.
- issue: Nuance de l’attente exprimée par Ἐντραπήσονται
  choice: Ils respecteront mon fils
  alternative: Ils auront honte devant mon fils
  rationale: La seconde possibilité demeure lexicalement réelle, mais le contexte de la parabole favorise l’idée de déférence envers le fils. Une note conserve l’autre nuance sans la substituer au sens contextuellement le plus probable.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « Il lui restait encore une seule personne » explicite seulement le référent humain sous-entendu par le grec et évite le calque peu naturel « il en avait encore un ». Le discours direct conserve la vivacité de la parabole.
