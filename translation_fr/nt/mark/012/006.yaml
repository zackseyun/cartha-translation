    rationale: Le grec dit littéralement qu’il lui restait encore « un » et précise ensuite « un fils bien-aimé ». En français, « un fils, un fils bien-aimé » conserve mieux cette progression sans suggérer que le fils serait nécessairement son unique enfant.
  - severity: low
    issue: « en se disant » interprète légèrement λέγων comme pensée intérieure.
    rationale: Le texte emploie « disant » et introduit une parole rapportée ; « en disant » est à la fois plus direct et plus proche de la source.
  - severity: medium
    issue: L’ancre de la note lexicale est placée après « fils » plutôt qu’après « respecteront ».
    rationale: La note explique ἐντραπήσονται, rendu par « respecteront » ; l’ancre doit donc suivre ce verbe.
