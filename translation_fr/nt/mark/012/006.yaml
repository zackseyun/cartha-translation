  source_fidelity: 'Le sens principal est bien rendu : le propriétaire dispose encore d’un fils bien-aimé, l’envoie en dernier vers les vignerons et s’attend à ce qu’ils lui témoignent du respect. Toutefois, « une seule personne » est une explicitation lourde et moins fidèle à la formulation concise et appositionnelle du grec. Le participe λέγων est rendu plus directement par « en disant » ვიდრე « en se disant ».'
  naturalness: « Il lui restait encore un fils, un fils bien-aimé » est plus fluide dans un récit français tout en conservant l’apposition emphatique du grec. « Il l’envoya vers eux en dernier » est naturel et garde la valeur séquentielle de ἔσχατον.
  terminology: « Fils bien-aimé » préserve correctement ἀγαπητός et sa résonance marcienne sans l’interpréter. « Respecteront » convient à ἐντραπήσονται dans ce contexte. L’appel de note doit être ancré au verbe qu’il explique, non à « fils ».
