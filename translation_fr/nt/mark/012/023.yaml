id: MRK.12.23
reference: Mark 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: fr
  text: À la résurrection, quand ils ressusciteront, la femme duquel d’entre eux sera-t-elle ? Car les sept l’ont eue pour femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασις
  choice: la résurrection
  rationale: Dans la controverse avec les sadducéens, le nom désigne la résurrection eschatologique. « La résurrection » est l’équivalent français naturel et consacré, sans explicitation supplémentaire.
- source_word: ὅταν ἀναστῶσιν
  choice: quand ils ressusciteront
  rationale: ὅταν avec le subjonctif aoriste introduit ici un événement futur. Le futur français est idiomatique après « quand » et le verbe « ressusciter » exprime le sens contextuel sans ajouter l’idée non explicite de « de nouveau ».
- source_word: τίνος αὐτῶν
  choice: duquel d’entre eux
  rationale: Cette formulation rend explicitement le génitif interrogatif et sa valeur partitive, tout en restant naturelle dans la question française.
- source_word: ἔσται γυνή
  choice: sera-t-elle la femme
  rationale: Le nom prédicatif exprime la relation conjugale. La tournure interrogative française demande naturellement l’article défini.
- source_word: γυνή
  choice: femme
  rationale: Dans les deux occurrences, le contexte matrimonial impose le sens d’« épouse ». En français courant, « être la femme de » et « avoir pour femme » expriment naturellement cette relation.
- source_word: οἱ γὰρ ἑπτὰ
  choice: car tous les sept
  rationale: γάρ introduit la justification de la question. « Tous les sept » précise naturellement que chacun des sept frères a eu cette femme, sans ajouter le nom « hommes ».
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: l’ont eue pour femme
  rationale: Cette tournure conserve l’idée d’avoir quelqu’un comme épouse plutôt que de transformer l’expression en simple événement matrimonial (« l’ont épousée »).
theological_decisions:
- issue: Le langage de la résurrection dans la controverse avec les sadducéens
  choice: À la résurrection, quand ils ressusciteront
  alternative: À la résurrection des morts, quand ils reviendront à la vie
  rationale: Le texte suppose une résurrection future, mais n’ajoute ici ni « des morts » ni une paraphrase explicative. La traduction conserve donc l’affirmation eschatologique et la répétition du nom et du verbe grecs sans résoudre davantage la question.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « résurrection / ressusciteront » reproduit celle du grec et convient au caractère argumentatif de la question. Aucun marqueur de note n’est nécessaire, puisque le sens contextuel peut être rendu directement sans introduire d’alternative textuelle ou lexicale indispensable.
