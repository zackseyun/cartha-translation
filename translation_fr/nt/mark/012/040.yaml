  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: fr
  text: 'qui dévorent les maisons des veuves et qui, pour l’apparence[a], font de longues prières : ceux-là recevront une condamnation plus sévère[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous prétexte » ou « pour se donner en spectacle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un jugement plus sévère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: dévorent
  rationale: Conserve l’image forte d’une consommation rapace des biens d’autrui, sans la réduire au terme explicatif « exploitent ».
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: les maisons des veuves
  rationale: Rend concrètement l’expression grecque, qui peut englober les foyers ou les biens des veuves sans imposer cette interprétation dans le texte.
- source_word: προφάσει
  choice: pour sauver les apparences
  rationale: Expression française naturelle qui communique l’idée d’une pratique religieuse destinée à donner une façade respectable; d’autres nuances possibles sont signalées en note.
- source_word: μακρὰ προσευχόμενοι
  choice: prient longuement
  rationale: Rend clairement la valeur adverbiale de μακρά et la durée prolongée des prières.
- source_word: λήμψονται
  choice: recevront
  rationale: Correspond au futur grec et convient au registre solennel d’un avertissement de jugement.
- source_word: περισσότερον κρίμα
  choice: une condamnation plus sévère
  rationale: Exprime naturellement en français le degré comparatif et la portée punitive probable de κρίμα dans ce contexte.
theological_decisions:
- issue: Portée de κρίμα dans l’avertissement contre l’hypocrisie religieuse
  choice: condamnation
  alternative: jugement
  rationale: Le contexte indique un jugement à portée punitive. « Condamnation » fait ressortir cette gravité, tandis que « jugement », lexicalement possible et plus large, est conservé en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve la forme d’une proposition relative qui se rattache au contexte précédent. L’image concrète de « dévorer les maisons » et la tension entre condamnation et jugement sont préservées.
