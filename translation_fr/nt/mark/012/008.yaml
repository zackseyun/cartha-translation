id: MRK.12.8
reference: Mark 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: fr
  text: Ils le prirent[a], le tuèrent et le jetèrent hors de la vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains lecteurs pourraient s’attendre, d’après un récit parallèle de la parabole, à l’ordre « ils le jetèrent hors de la vigne et le tuèrent ». Cependant, le texte grec de Marc dit ici : « ils le tuèrent et le jetèrent hors de la vigne ».'
    reason: Renvoi à un récit parallèle et explication de l’ordre propre au texte grec de Marc.
lexical_decisions:
- source_word: λαβόντες
  choice: Ils le prirent
  rationale: Le participe aoriste de λαμβάνω introduit la première action de la séquence. « Ils le prirent » reste proche du grec et naturel en français, sans ajouter nécessairement la nuance violente de « ils se saisirent de lui ».
- source_word: ἀπέκτειναν
  choice: le tuèrent
  rationale: ἀποκτείνω signifie directement « tuer » ou « mettre à mort ». « Le tuèrent » est clair, actuel et conserve la brutalité concise du récit.
- source_word: ἐξέβαλον
  choice: le jetèrent hors
  rationale: ἐκβάλλω exprime ici une expulsion énergique. « Le jetèrent hors » rend cette force dans un français naturel et digne.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: hors de la vigne
  rationale: Avec le verbe de mouvement ἐξέβαλον, cette expression indique que l'homme est jeté à l'extérieur de la vigne. « Hors de la vigne » reproduit clairement ce mouvement.
- source_word: ἀμπελῶνος
  choice: vigne
  rationale: Dans ce contexte agricole et parabolique, ἀμπελών désigne une vigne, c'est-à-dire un terrain planté de ceps.
theological_decisions:
- issue: Ordre de la mise à mort et de l'expulsion dans la parabole
  choice: 'Le texte suit l''ordre grec : ils le tuent, puis le jettent hors de la vigne.'
  alternative: Inverser les actions — le jeter d'abord hors de la vigne, puis le tuer — conformément à l'ordre auquel certains lecteurs peuvent s'attendre d'après les récits parallèles.
  rationale: Le texte grec de Marc 12.8 présente explicitement les actions dans cet ordre. La traduction préserve cette séquence sans harmonisation avec les parallèles ni résolution de sa possible portée théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase brève conserve le rythme rapide et la dureté de la séquence grecque. Le choix « vigne » est plus idiomatique que « vignoble » dans une parabole biblique tout en restant immédiatement compréhensible.
