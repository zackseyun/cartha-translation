id: MRK.12.17
reference: Mark 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: fr
  text: 'Mais Jésus leur dit : « Rendez à César ce qui est à César, et à Dieu ce qui est à Dieu. » Et ils étaient profondément étonnés de lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Rendez
  rationale: L’impératif exprime l’idée de remettre ou de restituer à chacun ce qui lui revient. « Rendez » est naturel en français, conserve la notion de dû et évite de limiter le propos au seul paiement de l’impôt.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: à César ce qui est à César
  rationale: Cette formulation idiomatique rend le neutre pluriel substantivé et son rapport de possession, tout en préservant la répétition emphatique de « César ».
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: à Dieu ce qui est à Dieu
  rationale: Le parallélisme avec la première proposition est maintenu sans préciser au-delà du texte ce qui relève respectivement de César et de Dieu.
- source_word: ἐξεθαύμαζον
  choice: étaient profondément étonnés
  rationale: Le verbe intensif indique un vif étonnement, et l’imparfait grec présente leur réaction en cours. Cette expression est actuelle et digne.
- source_word: ἐπ’ αὐτῷ
  choice: de lui
  rationale: Avec le verbe d’étonnement, la préposition peut désigner l’objet ou le motif de la réaction. « De lui » reste proche du grec et ne réduit pas explicitement l’étonnement à ses seules paroles.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition légèrement contrastive dans l’échange conflictuel.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Rendu français direct et naturel de l’introduction au discours.
theological_decisions:
- issue: Rapport entre l’obligation civique et l’obligation envers Dieu
  choice: Conserver les deux propositions parallèles sans définir leur portée politique ou doctrinale.
  alternative: Présenter la parole soit comme une forte légitimation de l’autorité civile, soit comme une réduction implicite des prétentions de César.
  rationale: Le texte distingue ce qui revient à César de ce qui revient à Dieu, mais n’élabore pas une théorie complète de leurs rapports. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure connue « Rendez à César ce qui est à César » demeure précise et accessible, sans archaïsme marqué. Aucun appel de note n’est requis puisqu’aucune note n’est retenue.
