id: MRK.12.44
reference: Mark 12:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: fr
  text: Car tous ont donné de leur superflu ; mais elle, de son indigence, a mis tout ce qu’elle possédait, tout ce qu’elle avait pour vivre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες γὰρ
  choice: Car tous
  rationale: « Car » conserve le lien explicatif avec l’affirmation précédente, et « tous » maintient la portée collective et emphatique de πάντες.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: de leur superflu
  rationale: Le grec désigne ce qui leur reste au-delà de leurs besoins. « Leur superflu » est naturel en français et fait nettement ressortir le contraste avec la pauvreté de la veuve.
- source_word: ἔβαλον
  choice: ont donné
  rationale: Dans le contexte d’une offrande, « donner » exprime naturellement la contribution sans imposer le sens matériel de « jeter ».
- source_word: αὕτη δὲ
  choice: mais elle
  rationale: Cette formulation brève conserve l’opposition marquée par δέ sans répéter inutilement l’identité de la veuve, déjà établie par le contexte.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: dans sa pauvreté
  rationale: ὑστέρησις évoque ici le manque et le dénuement économique. « Dans sa pauvreté » est idiomatique et conserve la force du contraste.
- source_word: πάντα ὅσα εἶχεν
  choice: tout ce qu’elle possédait
  rationale: Cette expression restitue la totalité emphatique du grec dans un français courant et digne.
- source_word: ἔβαλεν
  choice: a mis
  rationale: « A mis » garde ici l’image concrète du dépôt des pièces dans le tronc et permet de distinguer cet acte précis du fait général de donner.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: tout ce qu’elle avait pour vivre
  rationale: Dans ce contexte monétaire, βίος désigne les ressources nécessaires à la vie. Cette formulation française claire transmet mieux ce sens que le littéral ambigu « toute sa vie ».
theological_decisions:
- issue: Sens de βίος dans la description de l’offrande de la veuve
  choice: 'Ses moyens matériels de subsistance : « tout ce qu’elle avait pour vivre »'
  alternative: « Toute sa vie », qui pourrait évoquer sa vie biologique ou l’ensemble de son existence
  rationale: Le contexte porte sur une contribution financière, et βίος peut désigner les moyens de vivre. La traduction choisie préserve la radicalité de son don sans laisser entendre qu’elle a littéralement donné sa vie biologique à cet instant.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule souligne le contraste entre le superflu des autres et le dénuement de la veuve. La reprise de « tout » conserve l’insistance du grec.
