id: MRK.12.11
reference: Mark 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: fr
  text: C’est du Seigneur que cela est venu[a][b], et c’est merveilleux à nos yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le Seigneur ». L’expression grecque peut indiquer la provenance ou l’agent.'
    reason: lexical_alternative
  - marker: b
    text: Cette phrase cite le Psaume 118.23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: du Seigneur
  rationale: Avec le génitif, παρά indique ici principalement la provenance ou l’origine. « Du Seigneur » conserve cette nuance tout en restant naturel en français; « par le Seigneur » demeure possible si l’on comprend une idée d’agent.
- source_word: ἐγένετο
  choice: est venu
  rationale: L’aoriste de γίνομαι exprime ici que la réalité évoquée est advenue ou tire son origine du Seigneur. La tournure « c’est du Seigneur que cela est venu » est idiomatique et évite la nuance accidentelle que pourrait suggérer « est arrivé ».
- source_word: αὕτη
  choice: cela
  rationale: Le démonstratif féminin renvoie à ce qui vient d’être affirmé dans la citation, notamment au fait que la pierre rejetée est devenue la pierre principale. « Cela » préserve ce renvoi sans ajouter explicitement « cette pierre ».
- source_word: θαυμαστὴ
  choice: merveilleux
  rationale: θαυμαστός qualifie ce qui provoque l’émerveillement et l’admiration. « Merveilleux » garde le registre élevé de la citation tout en étant clair en français moderne.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: à nos yeux
  rationale: Cette expression idiomatique signifie « à notre vue » ou « pour nous ». « À nos yeux » conserve l’image biblique et reste parfaitement naturel.
theological_decisions:
- issue: Traduction de κυρίου dans une citation d’un psaume où le référent est Dieu
  choice: du Seigneur
  alternative: de l’Éternel
  rationale: Le texte grec de Marc porte κυρίου. « Seigneur » traduit directement ce terme et maintient l’usage néotestamentaire, sans substituer dans le corps du texte la forme française souvent employée pour le nom divin dans l’hébreu du psaume.
- issue: Rapport exprimé par παρὰ κυρίου
  choice: 'provenance : « du Seigneur »'
  alternative: 'agent : « par le Seigneur »'
  rationale: La construction avec παρά et le génitif favorise la provenance, mais elle peut aussi être comprise comme désignant l’agent. Le texte retient la provenance et la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. La construction détachée « C’est du Seigneur que… » reflète la mise en avant de la provenance dans le grec et convient au registre poétique de la citation. L’expression « à nos yeux » conserve l’image sémitique sans paraître archaïque.
