  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: fr
  text: 'Des sadducéens, qui disent qu’il n’y a pas de résurrection, vinrent auprès de Jésus et se mirent à l’interroger :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: des sadducéens
  rationale: Nom traditionnel et immédiatement reconnaissable de ce groupe juif.
- source_word: ἀνάστασιν
  choice: résurrection
  rationale: Équivalent français établi, qui conserve ici la portée théologique du terme sans l’expliciter davantage.
- source_word: ἐπηρώτων
  choice: se mirent à l’interroger
  rationale: L’imparfait grec présente une interrogation en cours; cette tournure française naturelle concorde avec la valeur progressive retenue dans la couche de consultation anglaise.
- source_word: πρὸς αὐτόν
  choice: auprès de Jésus
  rationale: Le pronom est explicité par le nom de Jésus pour assurer une référence claire en français dans un verset isolé.
theological_decisions:
- issue: Négation de la résurrection
  choice: qui disent qu’il n’y a pas de résurrection
  alternative: qui affirment que la résurrection n’existe pas
  rationale: La formulation retenue reproduit sobrement la position attribuée aux sadducéens, sans préciser indûment la nature ou l’étendue de leur négation.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par les deux-points, puisque la question elle-même commence au verset suivant.
