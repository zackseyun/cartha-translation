id: MRK.12.1
reference: Mark 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: fr
  text: 'Alors il se mit à leur parler en paraboles : « Un homme planta une vigne, l’entoura d’une clôture[a], creusa une cuve inférieure de pressoir[b] et construisit une tour. Puis il la loua à des cultivateurs[c] et partit en voyage. »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une haie ». Le grec φραγμός peut désigner une clôture, une haie ou toute autre barrière entourant un terrain.
    reason: lexical_alternative
  - marker: b
    text: Ou « creusa une fosse pour le pressoir ». Le grec ὑπολήνιον désigne la cuve inférieure du pressoir, dans laquelle le jus s’écoulait.
    reason: lexical_alternative
  - marker: c
    text: Ou « la loua à des vignerons ». Le grec désigne des cultivateurs; dans ce contexte, il s’agit des exploitants de la vigne louée.
    reason: lexical_alternative
  - marker: d
    text: Cette description évoque Ésaïe 5.1–2, où une vigne est plantée, entourée et équipée.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: il se mit à leur parler en paraboles
  rationale: Cette tournure française naturelle rend la construction inchoative ἤρξατο + infinitif, tout en conservant le destinataire et la forme du discours.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: Un homme planta une vigne
  rationale: Rendu direct qui conserve le propriétaire masculin introduit dans le récit et l’objet agricole précis.
- source_word: περιέθηκεν φραγμόν
  choice: l’entoura d’une clôture
  rationale: φραγμός désigne une barrière d’enceinte, qui peut être une clôture ou une haie. « Clôture » reste clair sans préciser indûment le matériau.
- source_word: ὤρυξεν ὑπολήνιον
  choice: creusa une cuve pour le pressoir
  rationale: ὑπολήνιον désigne la cuve inférieure qui recueille le jus du pressoir; cette formulation exprime sa fonction sans la confondre avec l’ensemble du pressoir.
- source_word: ᾠκοδόμησεν πύργον
  choice: construisit une tour
  rationale: Traduction directe qui préserve la succession des aménagements de la vigne.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: il la donna en fermage à des vignerons
  rationale: « Donner en fermage » exprime la location d’une terre agricole, tandis que « vignerons » convient précisément aux cultivateurs d’une vigne. Le pronom féminin suit le genre français de « vigne ».
- source_word: ἀπεδήμησεν
  choice: partit en voyage
  rationale: Le verbe indique un départ hors de chez soi, souvent pour un certain temps. « Partit en voyage » rend cette nuance plus précisément que le simple « partit ».
theological_decisions:
- issue: Identité et genre de ἄνθρωπος
  choice: Un homme
  alternative: Quelqu’un; une personne
  rationale: Dans le cadre narratif, le mot présente un propriétaire masculin et non l’humanité en général; « un homme » conserve cette donnée sans portée doctrinale ajoutée.
- issue: Statut des γεωργοί
  choice: des vignerons auxquels la vigne est donnée en fermage
  alternative: des cultivateurs; des fermiers
  rationale: Le contexte établit clairement une relation entre propriétaire et exploitants. Le choix conserve cette relation économique sans imposer une identification allégorique aux personnages.
- issue: Écho à Ésaïe 5.1–2
  choice: le signaler en note sans l’intégrer au texte
  alternative: ne pas signaler l’écho
  rationale: Les éléments de la vigne plantée, entourée et équipée évoquent fortement Ésaïe, mais le texte de Marc ne formule pas explicitement la citation; une note préserve cette distinction.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit et maintient un rythme net. Le vocabulaire agricole reste accessible; les termes moins immédiatement transparents sont explicités en notes.
