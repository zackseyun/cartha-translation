  to: 'Alors il se mit à leur parler en paraboles : « Un homme planta une vigne, l’entoura d’une clôture[a], creusa une cuve inférieure de pressoir[b] et construisit une tour. Puis il la loua à des cultivateurs[c] et partit en voyage. »[d]'
