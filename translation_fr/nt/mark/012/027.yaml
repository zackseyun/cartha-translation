id: MRK.12.27
reference: Mark 12:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: fr
  text: Il n’est pas le Dieu des morts, mais celui des vivants[a]. Vous vous trompez lourdement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Dieu n’est pas Dieu des morts, mais des vivants. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Vous êtes profondément dans l’erreur » ; ou : « Vous vous égarez gravement. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν θεὸς νεκρῶν ἀλλὰ ζώντων
  choice: Il n’est pas le Dieu des morts, mais celui des vivants
  rationale: Le pronom « Il » reprend naturellement en français le Dieu d’Abraham, d’Isaac et de Jacob mentionné dans le contexte. L’article défini devant « Dieu » et la reprise par « celui » donnent une formulation française idiomatique tout en conservant l’opposition concise entre les morts et les vivants.
- source_word: νεκρῶν
  choice: des morts
  rationale: Le génitif pluriel substantivé désigne les personnes mortes. « Des morts » préserve directement le contraste avec « des vivants ».
- source_word: ζώντων
  choice: des vivants
  rationale: Le participe présent substantivé désigne ceux qui vivent. « Des vivants » est naturel, concis et parallèle à « des morts ».
- source_word: πολὺ
  choice: lourdement
  rationale: Employé adverbialement, πολὺ intensifie πλανᾶσθε. Avec « se tromper », « lourdement » exprime en français actuel une erreur grave sans ajouter d’explication doctrinale.
- source_word: πλανᾶσθε
  choice: vous vous trompez
  rationale: La forme peut évoquer le fait d’être dans l’erreur ou de s’égarer. Dans cette réprimande, « vous vous trompez » est clair et naturel, sans trancher explicitement entre égarement personnel et tromperie extérieure.
theological_decisions:
- issue: Portée de l’opposition entre les morts et les vivants
  choice: Conserver l’affirmation sous sa forme brève, sans expliciter une doctrine de l’état intermédiaire ou de la résurrection.
  alternative: Dieu n’est pas le Dieu de personnes qui demeurent mortes, mais de personnes destinées à ressusciter.
  rationale: Le contexte inscrit cette parole dans l’argument de Jésus sur la résurrection, mais le verset lui-même se limite à l’opposition entre « les morts » et « les vivants ». Une paraphrase doctrinale résoudrait une tension que le texte conserve.
- issue: Sujet sous-entendu de οὐκ ἔστιν
  choice: Employer « Il », en le faisant reprendre le Dieu nommé dans le contexte.
  alternative: Dieu n’est pas Dieu des morts, mais des vivants.
  rationale: Le grec permet une formulation plus elliptique, tandis que le français naturel appelle ici un sujet explicite. « Il » ne change pas le référent et évite une répétition pesante.
translation_notes:
  register: Français international moderne, clair et digne. « Celui des vivants » évite une répétition peu naturelle tout en maintenant le parallélisme. « Vous vous trompez lourdement » garde la vigueur de la réprimande sans registre familier.
