reference: Mark 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: fr
  text: '« N’avez-vous même pas lu ce passage de l’Écriture : “La pierre que les bâtisseurs ont rejetée, c’est elle qui est devenue la pierre angulaire[a]” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tête de l’angle » ; traditionnellement : « la pierre principale de l’angle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφὴν
  choice: texte de l’Écriture
  rationale: Dans le Nouveau Testament, γραφή désigne couramment l’Écriture sainte. « Ce texte de l’Écriture » rend naturellement le démonstratif ταύτην tout en présentant la citation précise qui suit.
- source_word: ἀνέγνωτε
  choice: avez-vous … lu
  rationale: Dans cette question rhétorique, le passé composé est idiomatique en français et conserve l’appel de Jésus à un texte déjà accessible à ses interlocuteurs.
- source_word: οὐδὲ
  choice: même pas
  rationale: οὐδέ renforce la négation ; « même pas » préserve la pointe de reproche de la question.
- source_word: Λίθον
  choice: La pierre
  rationale: Bien que le nom soit sans article en grec, la citation renvoie à une pierre déterminée dans la métaphore ; l’article défini est naturel en français.
- source_word: ἀπεδοκίμασαν
  choice: ont rejetée
  rationale: Le verbe exprime le rejet à la suite d’une appréciation. « Rejeter » en donne clairement le sens principal sans alourdir la phrase.
- source_word: οἱ οἰκοδομοῦντες
  choice: les bâtisseurs
  rationale: Le participe substantivé désigne ceux qui bâtissent. « Les bâtisseurs » est concis, courant et conserve l’image de la construction.
- source_word: οὗτος
  choice: c’est elle qui
  rationale: Cette tournure française reprend avec insistance « la pierre » et restitue la valeur démonstrative emphatique de οὗτος.
- source_word: ἐγενήθη
  choice: est devenue
  rationale: Le passé composé exprime l’événement accompli et son résultat durable, sans imposer le sens passif « a été faite ».
- source_word: εἰς κεφαλὴν γωνίας
  choice: la pierre angulaire
  rationale: Cette expression française établie rend de façon claire et naturelle la fonction de la pierre principale à l’angle, tout en conservant la métaphore architecturale.
theological_decisions:
- issue: Emploi messianique de l’image de Psaume 118.22
  choice: Conserver sans l’expliciter l’image de la pierre rejetée devenue pierre angulaire.
  alternative: Identifier directement la pierre au Messie ou à Jésus dans le corps du texte.
  rationale: Le contexte applique l’image à Jésus, mais le grec maintient la formulation métaphorique de l’Écriture citée. L’expliciter dans la traduction résoudrait ce que le texte laisse au lecteur d’interpréter.
- issue: Agent implicite du changement de statut de la pierre
  choice: Traduire ἐγενήθη par « est devenue », sans nommer l’agent.
  alternative: Traduire « Dieu en a fait la pierre angulaire ».
  rationale: L’intervention divine peut être comprise dans le contexte scripturaire, mais elle n’est pas exprimée dans cette proposition grecque. La formulation retenue préserve cette réserve.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue la question de Jésus de la citation scripturaire. « Bâtisseurs » garde l’image tout en étant plus naturel ici que « ceux qui construisent ». Le marqueur [a] est placé après l’expression qu’il explique.
