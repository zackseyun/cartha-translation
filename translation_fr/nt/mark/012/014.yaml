  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: fr
  text: 'Ils vinrent lui dire : « Maître, nous savons que tu dis la vérité et que tu ne te laisses influencer par personne, car tu ne regardes pas à l’apparence des personnes[a], mais tu enseignes en toute vérité la voie de Dieu. Est-il permis de payer l’impôt de capitation à César[b], ou non ? Devons-nous le payer, ou ne pas le payer ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu ne regardes pas au visage des êtres humains » ; cette expression signifie que Jésus ne se laisse pas influencer par l’apparence ou le statut des personnes.'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne l’impôt romain lié au recensement, un impôt personnel aussi appelé capitation.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans les Évangiles, cette forme d’adresse désigne celui qui enseigne. « Maître » est la formulation française consacrée et naturelle dans ce contexte, sans connotation archaïque excessive.
- source_word: ἀληθὴς εἶ
  choice: tu dis la vérité
  rationale: Appliqué à une personne, ἀληθής signifie qu’elle est véridique et digne de foi. Cette tournure est plus naturelle en français courant que « tu es vrai » et convient au contexte de son enseignement.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: tu ne te laisses influencer par personne
  rationale: La proposition suivante montre qu’il ne s’agit pas d’indifférence envers les personnes, mais d’indépendance à l’égard de leur statut, de leur opinion ou de leur pression.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: car tu ne considères pas le rang des gens
  rationale: L’expression littérale évoque le fait de regarder le visage des personnes; idiomatiquement, elle signifie ne pas se laisser déterminer par leur apparence ou leur position sociale. « Le rang » convient particulièrement au piège politique tendu ici.
- source_word: ἐπ’ ἀληθείας
  choice: en toute vérité
  rationale: Cette locution adverbiale souligne que Jésus enseigne avec vérité et sincérité, tout en faisant écho à ἀληθής plus tôt dans la phrase.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: la voie de Dieu
  rationale: Conserve l’image biblique du chemin qui correspond à la volonté et à l’enseignement de Dieu.
- source_word: ἔξεστιν
  choice: Est-il permis
  rationale: Exprime ici ce qui est autorisé en droit ou en principe, sans préciser à tort s’il s’agit exclusivement de la Loi juive ou du droit romain.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: payer l’impôt à César
  rationale: En contexte fiscal, δοῦναι se rend naturellement par « payer ». Le terme κῆνσος désigne précisément l’impôt romain de recensement ou de capitation; cette précision historique est donnée en note pour garder un texte fluide.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Devons-nous le payer, ou ne pas le payer ?
  rationale: La répétition du verbe est maintenue afin de préserver l’insistance et le caractère piégé de la question.
theological_decisions:
- issue: Sens de l’indépendance de Jésus à l’égard des personnes
  choice: tu ne te laisses influencer par personne
  alternative: tu ne te soucies de personne
  rationale: Une traduction littérale pourrait suggérer que Jésus ne se préoccupe pas du bien des personnes. La proposition causale qui suit indique plutôt qu’il n’est influencé ni par leur statut ni par leur apparence.
- issue: Expression idiomatique concernant le visage des personnes
  choice: tu ne considères pas le rang des gens
  alternative: tu ne regardes pas au visage des hommes
  rationale: La traduction retenue communique le sens idiomatique sans effacer l’image originale, qui est signalée en note. Elle évite aussi de limiter le propos à l’apparence physique.
- issue: Portée de la question sur ce qui est permis
  choice: Est-il permis
  alternative: La Loi permet-elle
  rationale: Le grec ne nomme pas explicitement la Torah ni le droit romain. La formulation conserve donc l’ambiguïté juridique, morale et religieuse du piège.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe ordinaire du grec et à l’usage biblique français. La formulation conserve la tension du piège sans préciser indûment quelle autorité juridique est visée.
