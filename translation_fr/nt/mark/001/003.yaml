id: MRK.1.3
reference: Mark 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: fr
  text: 'Une voix crie dans le désert : « Préparez le chemin du Seigneur[b] ; rendez droits ses sentiers[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre ponctuation de la citation d’Ésaïe : « Une voix crie : “Dans le désert, préparez le chemin du Seigneur…” »'
    reason: alternative_reading
  - marker: b
    text: « Seigneur » traduit le grec kyriou. La citation fait écho à Ésaïe 40.3, où le texte hébreu désigne le SEIGNEUR (YHWH).
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ βοῶντος
  choice: Une voix crie
  rationale: Cette formulation française naturelle rend l’expression grecque littéralement construite comme « voix de quelqu’un qui crie », tout en conservant la force de la proclamation.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est le terme courant et contextuellement approprié pour le lieu inhabité où Jean exerce son ministère ; il garde aussi l’écho d’Ésaïe 40.3.
- source_word: Ἑτοιμάσατε
  choice: Préparez
  rationale: L’impératif exprime un appel direct et décisif adressé à plusieurs personnes.
- source_word: τὴν ὁδὸν
  choice: le chemin
  rationale: « Chemin » préserve à la fois l’image concrète d’une voie à aménager et sa portée prophétique.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le génitif grec est rendu directement, et « Seigneur » correspond au titre κύριος sans introduire dans le texte grec la graphie conventionnelle du nom divin hébreu.
- source_word: εὐθείας ποιεῖτε
  choice: rendez droits
  rationale: La tournure idiomatique française exprime clairement l’action de rendre les sentiers rectilignes.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ses sentiers
  rationale: « Sentiers » conserve le pluriel et l’image de voies frayées ; le possessif renvoie au Seigneur.
theological_decisions:
- issue: Traduction de κύριος dans une citation d’Ésaïe où l’hébreu porte YHWH
  choice: Seigneur
  alternative: l’ÉTERNEL / le SEIGNEUR
  rationale: Le texte principal traduit le mot grec κύριος tel qu’il se présente dans Marc. Une note signale que la citation renvoie à Ésaïe 40.3, où le texte hébreu emploie le nom divin YHWH, sans imposer cette graphie au texte grec.
- issue: Rattachement de « dans le désert »
  choice: à la voix qui crie
  alternative: à l’ordre de préparer le chemin
  rationale: L’ordre des mots et la lecture habituelle de Marc favorisent « une voix crie dans le désert ». L’autre ponctuation possible de la citation d’Ésaïe est conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « Une voix crie » évite le calque pesant « la voix de celui qui crie ». Les deux marqueurs figurent dans le texte principal ; [b] suit « Seigneur » et [a] est placé à la fin de la citation pour signaler l’autre ponctuation de l’ensemble.
