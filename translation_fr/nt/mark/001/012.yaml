id: MRK.1.12
reference: Mark 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: fr
  text: Et aussitôt, l’Esprit le pousse dans le désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chasse » ou « l’envoie ». Le verbe grec est énergique; Marc emploie souvent le même verbe pour parler de l’expulsion des démons.
    reason: alternative lexicale
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: Conjonction simple qui conserve l’enchaînement narratif caractéristique de Marc sans expliciter davantage la relation temporelle.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Terme naturel en français moderne qui rend le mouvement rapide et pressant du récit marcien.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Le référent est l’Esprit mentionné lors du baptême de Jésus en Marc 1.10. La formulation reste proche du grec sans ajouter « Saint ».
- source_word: αὐτὸν
  choice: le
  rationale: Pronom objet renvoyant à Jésus.
- source_word: ἐκβάλλει
  choice: pousse
  rationale: Le verbe grec est énergique. « Pousse » préserve cette force et l’initiative de l’Esprit sans suggérer nécessairement une expulsion hostile; la note signale des rendus encore plus forts.
- source_word: εἰς τὴν ἔρημον
  choice: dans le désert
  rationale: En français biblique et courant, « désert » désigne naturellement un lieu inhabité et désolé; il n’impose pas nécessairement l’image d’une étendue sablonneuse.
theological_decisions:
- issue: Force de l’action de l’Esprit envers Jésus
  choice: « l’Esprit le pousse »
  alternative: « l’Esprit le conduit » ou « l’Esprit l’envoie »
  rationale: Le choix conserve la vigueur inhabituelle de ἐκβάλλει et la tension selon laquelle l’épreuve au désert survient à l’initiative de l’Esprit, sans harmoniser silencieusement Marc avec les formulations plus douces des autres Évangiles.
translation_notes:
  register: Français international moderne, sobre et digne. « Aussitôt » maintient le rythme de Marc; « pousse » est idiomatique tout en conservant la force du verbe grec. Le marqueur [a] figure bien dans le texte.
