source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: fr
  text: 'Comme il est écrit dans Ésaïe, le prophète[a] : « Voici, j’envoie mon messager devant toi, qui préparera ton chemin. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « dans les prophètes » au lieu de « dans Ésaïe, le prophète ».
    reason: textual_variant
  - marker: b
    text: Cette citation associe des formulations de Malachie 3.1 et d’Ésaïe 40.3.
    reason: cross_reference
lexical_decisions:
- source_word: Καθὼς
  choice: Comme
  rationale: Introduit naturellement en français la conformité entre le commencement de l’Évangile et le texte prophétique cité.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Rend la formule scripturaire au parfait passif et son résultat durable dans un français consacré mais toujours courant.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: dans le livre du prophète Ésaïe
  rationale: Explicite le support écrit sous-entendu par l’expression grecque et évite le tour peu naturel « dans Ésaïe le prophète », sans modifier l’attribution à Ésaïe.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Conserve la fonction solennelle d’appel à l’attention tout en restant naturel en français moderne.
- source_word: ἀποστέλλω
  choice: j’envoie
  rationale: Reproduit directement le présent grec et la vivacité de l’annonce prophétique.
- source_word: ἄγγελόν
  choice: messager
  rationale: Le mot désigne ici celui qui est envoyé comme précurseur ; « messager » préserve ce sens sans imposer l’idée d’un être céleste.
- source_word: πρὸ προσώπου σου
  choice: devant toi
  rationale: Rend idiomatiquement l’expression grecque, littéralement liée à la face, tout en conservant son sens spatial et relationnel.
- source_word: κατασκευάσει
  choice: préparera
  rationale: Exprime avec concision l’action de rendre prêt annoncée au futur.
- source_word: τὴν ὁδόν σου
  choice: ton chemin
  rationale: Conserve l’image concrète du chemin ainsi que sa portée figurée dans le contexte prophétique.
theological_decisions:
- issue: L’attribution nomme Ésaïe alors que la citation associe des formulations de Malachie 3.1 et d’Ésaïe 40.3.
  choice: Maintenir « dans le livre du prophète Ésaïe » dans le texte principal.
  alternative: « dans les prophètes »
  rationale: Le texte du SBLGNT attribue explicitement la citation à Ésaïe. La traduction conserve cette tension au lieu d’harmoniser l’attribution avec la composition de la citation ; la variante manuscrite et les deux arrière-plans prophétiques sont signalés en notes.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « il est écrit » et « Voici » maintient le registre scripturaire, tandis que « devant toi » évite un calque obscur. Le point-virgule distingue clairement l’envoi du messager et la mission qui lui est confiée.
