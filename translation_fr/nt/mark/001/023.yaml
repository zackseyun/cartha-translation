  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: fr
  text: 'Et aussitôt, il y avait dans leur synagogue un homme avec un esprit impur[a], et il s’écria[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « dans un esprit impur ». Certaines traductions portent « possédé par un esprit impur », formulation interprétative.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec désigne un cri poussé d’une voix forte.
    reason: lexical_clarification
lexical_decisions:
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme naturel et soutenu conserve le mouvement narratif rapide caractéristique de Marc.
- source_word: ἦν
  choice: il y eut
  rationale: Cette tournure existentielle rend naturellement en français la présence soudaine d’un homme dans ce cadre narratif.
- source_word: συναγωγῇ αὐτῶν
  choice: leur synagogue
  rationale: « Synagogue » désigne clairement le lieu de rassemblement juif, et « leur » conserve αὐτῶν.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans ce récit, le nom masculin singulier désigne un individu de sexe masculin.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: sous l’emprise d’un esprit impur
  rationale: Cette formulation française claire exprime l’association contraignante indiquée par le contexte, tout en signalant en note que le grec dit littéralement « dans un esprit impur ».
- source_word: ἀκαθάρτῳ
  choice: impur
  rationale: « Impur » est idiomatique en français moderne et conserve les connotations morales et cultuelles du terme.
- source_word: ἀνέκραξεν
  choice: il s’écria
  rationale: Le verbe exprime un cri puissant; « s’écria » convient au registre narratif sans préciser indûment l’émotion.
theological_decisions:
- issue: Rendu du langage relatif à l’affliction démoniaque dans ἐν πνεύματι ἀκαθάρτῳ
  choice: sous l’emprise d’un esprit impur
  alternative: dans un esprit impur; ayant un esprit impur; possédé par un esprit impur
  rationale: Le grec établit un lien étroit entre l’homme et l’esprit impur, mais sa construction littérale est inhabituelle en français. Le texte principal communique cette contrainte sans recourir directement au terme théologiquement plus chargé « possédé »; la note préserve la forme grecque.
translation_notes:
  register: Français international moderne, naturel et digne. « Aussitôt » maintient le rythme marcien. La seconde phrase évite une longue coordination et introduit naturellement les paroles qui suivent au verset suivant.
