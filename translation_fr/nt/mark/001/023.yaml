  source_fidelity: La tournure principale « sous l’emprise d’un esprit impur » explicite une domination que la construction grecque ἐν πνεύματι ἀκαθάρτῳ ne formule pas directement. De plus, l’imparfait ἦν est mieux rendu ici par « il y avait » que par le passé simple événementiel « il y eut ».
  naturalness: « Il y avait dans leur synagogue un homme avec un esprit impur » est naturel en français moderne tout en restant proche de l’expression grecque. « Il s’écria » rend bien l’idée d’une exclamation ou d’un cri sans surinterpréter son ton.
  terminology: « Esprit impur » est un équivalent exact et usuel de πνεῦμα ἀκάθαρτον. Le terme « sous l’emprise de » est évité dans le texte, car il constitue une expansion interprétative; cette possibilité peut être signalée en note comme telle.
