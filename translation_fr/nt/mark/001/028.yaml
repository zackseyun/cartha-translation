id: MRK.1.28
reference: Mark 1:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: fr
  text: Et la nouvelle à son sujet[a] se répandit aussitôt partout dans toute la région environnante de la Galilée.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qu’on racontait à son sujet » ou « sa renommée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sortit aussitôt partout dans toute la région environnante de la Galilée ».'
    reason: formal_rendering
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se répandit
  rationale: Avec ἀκοή pour sujet, le verbe décrit la diffusion d’une nouvelle. « Se répandit » exprime naturellement en français le mouvement suggéré par « sortit », sans modifier le sens.
- source_word: ἀκοὴ
  choice: la nouvelle
  rationale: Le nom désigne ici ce qui est entendu, donc une nouvelle ou un récit qui circule. « La nouvelle » reste plus neutre que « la renommée », qui insisterait davantage sur la réputation.
- source_word: αὐτοῦ
  choice: à son sujet
  rationale: Le génitif indique ici le contenu de la nouvelle, c’est-à-dire ce qui se disait au sujet de Jésus, plutôt qu’une possession.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » restitue de façon concise l’immédiateté caractéristique du récit de Marc.
- source_word: πανταχοῦ
  choice: partout
  rationale: Équivalent direct de l’adverbe grec, il souligne l’étendue de la diffusion.
- source_word: περίχωρον
  choice: région environnante
  rationale: Cette expression conserve le sens géographique d’une région ou d’un territoire situé alentour, sans introduire la connotation rurale de « campagne ».
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: dans toute la région environnante de la Galilée
  rationale: « Dans » convient idiomatiquement en français à la propagation d’une nouvelle, tandis que « toute » conserve l’idée d’étendue complète. Le génitif est rendu sans décider plus précisément que le grec si l’accent porte sur la région galiléenne environnante ou sur les alentours de la Galilée.
theological_decisions:
- issue: Sens de ἀκοὴ αὐτοῦ
  choice: la nouvelle à son sujet
  alternative: sa renommée ; ce qu’on racontait à son sujet
  rationale: Le contexte évoque la circulation de ce que les gens apprenaient concernant Jésus. « Sa renommée » est possible, mais ajoute une idée plus marquée de réputation ou de célébrité.
- issue: Rapport géographique exprimé par τῆς Γαλιλαίας
  choice: la région environnante de la Galilée
  alternative: la région alentour, en Galilée ; les alentours de la Galilée
  rationale: La formulation française garde la relation géographique relativement ouverte et évite d’affirmer sans nécessité qu’il s’agit exclusivement d’un territoire extérieur à la Galilée.
translation_notes:
  register: Français international moderne, clair et digne. « Se répandit » est plus naturel que le calque « sortit » pour une nouvelle. La proximité de « partout » et « toute » est conservée parce qu’elle reflète les deux expressions grecques distinctes qui insistent sur l’ampleur de la diffusion.
