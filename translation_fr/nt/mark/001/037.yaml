  text: καὶ ⸂εὗρον αὐτὸν καὶ⸃ λέγουσιν αὐτῷ ὅτι Πάντες ⸂ζητοῦσίν σε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: fr
  text: 'Ils le trouvèrent et lui dirent : « Tout le monde te cherche[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tous sont à ta recherche. » Le verbe grec peut aussi se traduire par « recherchent », mais, dans ce contexte, il désigne probablement des personnes qui essaient de trouver Jésus.'
    reason: alternative lexicale
lexical_decisions:
- source_word: εὗρον
  choice: trouvèrent
  rationale: L’aoriste de εὑρίσκω exprime ici l’aboutissement de la recherche. « Trouvèrent » est le terme narratif le plus direct et naturel.
- source_word: λέγουσιν
  choice: dirent
  rationale: Le présent grec est un présent historique. Le passé simple convient au récit français et préserve la progression narrative.
- source_word: ὅτι
  choice: ponctuation du discours direct
  rationale: ὅτι introduit ici les paroles rapportées ; les deux-points et les guillemets les rendent naturellement en français.
- source_word: Πάντες
  choice: Tout le monde
  rationale: Dans ce contexte, le pluriel collectif désigne l’ensemble des personnes concernées, sans nécessairement exprimer une universalité absolue.
- source_word: ζητοῦσίν σε
  choice: te cherche
  rationale: ζητέω peut signifier chercher ou être à la recherche de. Ici, les personnes essaient vraisemblablement de trouver Jésus ; « te cherche » est idiomatique et direct.
- source_word: καὶ
  choice: et
  rationale: La coordination simple conserve le mouvement rapide caractéristique du récit de Marc.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: le / lui / te
  rationale: Les pronoms sont rendus conformément à leurs fonctions grammaticales respectives en français.
