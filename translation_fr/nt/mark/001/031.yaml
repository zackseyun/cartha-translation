source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: fr
  text: Il s’approcha, la prit par la main et la releva. La fièvre la quitta, et elle les servait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: Il s’approcha
  rationale: Le participe aoriste indique que Jésus s’avance vers elle avant de la faire lever; cette formulation est naturelle et n’ajoute aucun complément absent du grec.
- source_word: ἤγειρεν αὐτὴν
  choice: la fit lever
  rationale: ἐγείρω désigne ici l’action de la relever de son lit. «La fit lever» conserve l’idée de mise debout sans réduire le geste à une simple aide.
- source_word: κρατήσας τῆς χειρός
  choice: la prit par la main
  rationale: κρατέω signifie prendre ou tenir fermement; avec le génitif de χείρ, l’expression française idiomatique est «prendre par la main».
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: La fièvre la quitta
  rationale: La construction présente la fièvre comme le sujet qui s’éloigne d’elle; «quitter» restitue naturellement cette personnification légère.
- source_word: διηκόνει αὐτοῖς
  choice: elle se mit à les servir
  rationale: L’imparfait peut, dans la progression du récit, présenter le service comme commençant à la suite immédiate de la guérison. La note conserve toutefois la lecture non ingressive.
- source_word: αὐτοῖς
  choice: les
  rationale: Le pronom est pluriel et renvoie aux personnes présentes, non à Jésus seul.
theological_decisions:
- issue: Résonance possible de ἐγείρω avec le vocabulaire du relèvement et de la résurrection
  choice: la fit lever
  alternative: l’aida à se lever
  rationale: La traduction garde l’action causative de Jésus et le motif du relèvement, sans faire de ce récit de guérison une résurrection explicite.
- issue: Valeur aspectuelle de l’imparfait διηκόνει
  choice: elle se mit à les servir
  alternative: elle les servait / elle les servit
  rationale: Le contexte permet une lecture ingressive comme résultat immédiat de la guérison, mais la forme grecque peut aussi simplement décrire son service; cette ambiguïté est signalée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est fluide et narrative; «servir» convient au contexte domestique et évite la coloration ecclésiastique de «exercer un ministère».
