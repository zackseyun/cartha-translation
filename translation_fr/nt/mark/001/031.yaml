review_pass:
  verdict: revise
  source_fidelity: La lecture ingressive « elle se mit à les servir » est possible dans le contexte, mais elle explicite une nuance que l’imparfait διηκόνει ne marque pas à lui seul. « Elle les servait » rend plus directement l’aspect imperfectif tout en laissant au contexte la relation avec la guérison. « La releva » rend naturellement ἤγειρεν et conserve, sans la surinterpréter, la résonance verbale de ἐγείρω.
  naturalness: Le texte révisé est fluide en français moderne et garde un rythme narratif sobre. La coordination des actions rend suffisamment le participe « s’étant approché / s’approchant » sans alourdir la phrase.
  terminology: « Releva », « fièvre » et « servir » sont justes dans ce contexte de guérison et de service domestique. Le pluriel « les » respecte αὐτοῖς, qui ne vise pas Jésus seul.
  issues:
  - severity: medium
    issue: « Elle se mit à les servir » impose une valeur ingressive.
    rationale: L’imparfait grec peut décrire un service en cours ou habituel dans la scène; le contexte peut favoriser un commencement, mais ne l’exige pas. La traduction principale ne devrait pas trancher cette nuance contestable.
  - severity: low
    issue: La note présente une alternative aspectuelle devenue nécessaire à cause d’une explicitation de la traduction principale.
    rationale: En traduisant directement l’imparfait par « elle les servait », la note n’est plus requise et l’ambiguïté aspectuelle demeure sans surcharge.
  - severity: low
    issue: « La fit lever » est moins idiomatique et moins proche de la diction de ἐγείρω que « la releva ».
    rationale: « La releva » exprime naturellement l’action de la tirer de sa position couchée et maintient la formulation marquée du verbe grec sans introduire de sens doctrinal.
  revised_text: Il s’approcha, la prit par la main et la releva. La fièvre la quitta, et elle les servait.
