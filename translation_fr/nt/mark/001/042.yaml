  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: fr
  text: Et aussitôt, la lèpre le quitta et il fut purifié.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il fut rendu pur ». Le verbe grec évoque aussi la purification rituelle, et non seulement la guérison physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme exprime la promptitude caractéristique du récit de Marc. « Aussitôt » est naturel, actuel et plus fluide ici qu’« immédiatement ».
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: le quitta
  rationale: Littéralement, la lèpre « partit loin de lui ». En français idiomatique, « le quitta » conserve clairement ce mouvement d’éloignement.
- source_word: ἡ λέπρα
  choice: la lèpre
  rationale: « Lèpre » reste le terme biblique français usuel, bien que le mot grec puisse désigner un éventail d’affections cutanées plus large que la maladie de Hansen moderne.
- source_word: ἐκαθαρίσθη
  choice: il fut purifié
  rationale: Le passif de καθαρίζω évoque à la fois la disparition de l’affection et le passage de l’impureté à la pureté. « Fut purifié » préserve mieux cette résonance rituelle que « fut guéri ».
theological_decisions:
- issue: Rapport entre guérison physique et pureté rituelle dans ἐκαθαρίσθη
  choice: il fut purifié
  alternative: il fut guéri ; il devint pur
  rationale: 'Le contexte biblique de la lèpre ne se limite pas au rétablissement physique : il comprend aussi la sortie d’un état d’impureté. La formulation retenue garde ces deux dimensions sans ajouter de conclusion doctrinale.'
translation_notes:
  register: Français international moderne, simple et digne. La coordination répétée du grec est conservée, tandis que « aussitôt » restitue l’urgence narrative propre à Marc.
