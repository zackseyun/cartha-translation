  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: fr
  text: Après l’avoir jeté dans des convulsions et poussé un grand cri[a], l’esprit impur sortit de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après avoir crié d’une voix forte ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: σπαράξαν
  choice: après l’avoir jeté dans des convulsions
  rationale: Le participe aoriste présente cette action comme précédant la sortie de l’esprit. Cette formulation française exprime naturellement la crise physique sans retenir le sens trop littéral et potentiellement trompeur de « déchirer ».
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: l’esprit impur
  rationale: « Esprit impur » est une expression française naturelle et consacrée dans le contexte des Évangiles; elle conserve la notion d’impureté portée par ἀκάθαρτος et l’action personnelle attribuée à l’esprit dans le récit.
- source_word: φωνῆσαν φωνῇ μεγάλῃ
  choice: avoir poussé un grand cri
  rationale: Cette tournure idiomatique rend l’intensité de la vocalisation. Une note conserve la formulation plus proche de la structure grecque, « avoir crié d’une voix forte ».
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: sortit de lui
  rationale: Rendu direct de la formule d’expulsion, qui conserve le sens personnel et spatial de l’esprit quittant l’homme.
- source_word: καὶ ... καὶ
  choice: Après… et…
  rationale: La subordination française met clairement en relief les deux participes qui précèdent le verbe principal, tout en gardant leur coordination.
theological_decisions:
- issue: Nature de l’entité qui possède l’homme
  choice: La traduction présente « l’esprit impur » comme un agent personnel.
  alternative: Comprendre l’expression comme une force mauvaise impersonnelle.
  rationale: Dans le récit, l’esprit agit, crie et sort de l’homme. La traduction préserve cette présentation narrative sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression des actions grecques tout en évitant une construction participiale lourde; « poussé un grand cri » est idiomatique, avec le tour plus formel signalé en note.
