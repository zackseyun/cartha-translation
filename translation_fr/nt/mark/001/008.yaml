source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: fr
  text: Moi, je vous ai baptisés avec de l’eau, mais lui, il vous baptisera dans l’Esprit Saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec l’Esprit Saint » ou « au moyen de l’Esprit Saint ». La préposition grecque peut indiquer aussi bien la sphère que le moyen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi, je
  rationale: Le pronom grec explicite marque un contraste appuyé avec αὐτός. La dislocation « Moi, je » restitue naturellement cette insistance en français.
- source_word: ἐβάπτισα
  choice: ai baptisés
  rationale: « Baptiser » conserve la portée rituelle et intertextuelle du verbe sans réduire son sens à un mode précis. Le passé composé convient au récit oral en français moderne.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom rend directement l’objet pluriel grec; l’accord « baptisés » en signale aussi le nombre.
- source_word: ὕδατι
  choice: dans l’eau
  rationale: Cette tournure française naturelle décrit l’élément dans lequel le baptême est accompli, sans imposer une description plus précise du rite.
- source_word: αὐτὸς
  choice: lui, il
  rationale: La reprise disloquée met en relief le contraste emphatique entre Jean et celui qui vient, tout en restant idiomatique en français.
- source_word: δὲ
  choice: mais
  rationale: La conjonction introduit ici le contraste entre le baptême de Jean et celui du personnage à venir.
- source_word: βαπτίσει
  choice: baptisera
  rationale: Le futur et la continuité lexicale avec ἐβάπτισα sont conservés.
- source_word: ἐν
  choice: dans
  rationale: « Dans » rend naturellement la valeur possible de sphère de ἐν avec le datif. La valeur instrumentale demeure signalée en note.
- source_word: πνεύματι ἁγίῳ
  choice: l’Esprit Saint
  rationale: Dans ce contexte prophétique, l’expression désigne le plus naturellement l’Esprit divin. La formulation française usuelle est retenue sans développer davantage l’identité ou l’action de l’Esprit.
theological_decisions:
- issue: Référence personnelle ou force impersonnelle de πνεύματι ἁγίῳ
  choice: l’Esprit Saint
  alternative: un esprit saint / une puissance sainte
  rationale: Le contexte marcien oppose le baptême d’eau de Jean au baptême accompli par celui qui vient; l’expression renvoie le plus naturellement à l’Esprit divin, sans que la traduction ajoute une définition doctrinale absente du verset.
- issue: Valeur de ἐν devant πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  alternative: avec l’Esprit Saint / au moyen de l’Esprit Saint
  rationale: Le grec permet de comprendre la préposition comme indiquant la sphère ou le moyen. Le texte principal retient la formulation française naturelle « dans », tandis que la note préserve explicitement l’autre possibilité.
translation_notes:
  register: Français moderne, courant et digne. Les constructions emphatiques « Moi, je » et « lui, il » reproduisent le contraste explicite du grec sans recourir au plus soutenu « lui-même ». Le marqueur de note est placé après la proposition directement concernée.
