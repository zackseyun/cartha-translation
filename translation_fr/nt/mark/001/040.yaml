source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: fr
  text: 'Un homme atteint de lèpre[a] vient à lui, le supplie et se met à genoux en lui disant : « Si tu le veux, tu peux me rendre pur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner diverses affections de la peau, et pas seulement la maladie appelée aujourd’hui lèpre.
    reason: lexical_alternative
  - marker: b
    text: Ou « me purifier ». Le verbe grec peut évoquer à la fois la disparition de l’affection et la purification de l’impureté qui lui était associée.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: un homme atteint de lèpre
  rationale: L’adjectif substantivé désigne une personne souffrant de « lèpre » au sens biblique. La formulation centrée sur la personne est naturelle en français actuel et évite de réduire l’homme à son affection.
- source_word: παρακαλῶν
  choice: le supplie
  rationale: Dans ce contexte de demande pressante, « supplier » exprime clairement l’appel insistant porté par παρακαλέω sans alourdir la phrase.
- source_word: γονυπετῶν
  choice: se met à genoux
  rationale: Cette expression française naturelle rend le geste indiqué par le participe et s’intègre à la succession des actions.
- source_word: Ἐὰν θέλῃς
  choice: Si tu le veux
  rationale: La formule exprime la volonté ou la disposition de Jésus, non une simple action future. « Si tu le veux » est direct et idiomatique.
- source_word: δύνασαί
  choice: tu peux
  rationale: Le verbe δύναμαι exprime ici la capacité ou le pouvoir. « Tu peux » le rend naturellement en français sans diminuer cette affirmation de capacité.
- source_word: καθαρίσαι
  choice: me rendre pur
  rationale: Cette formulation conserve le champ de la purification et de la restauration associé à καθαρίζω, plutôt que de réduire le propos à la seule guérison physique.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent conserve le présent historique caractéristique du récit vif de Marc.
theological_decisions:
- issue: Nature de la purification dans le contexte de la lèpre
  choice: me rendre pur
  alternative: me guérir
  rationale: Le grec emploie le vocabulaire de la purification plutôt qu’un verbe ordinaire de guérison. La traduction retenue préserve ensemble les dimensions corporelle et cultuelle sans trancher artificiellement entre elles.
translation_notes:
  register: Français international moderne, courant et digne. Le présent narratif de Marc est conservé. La phrase demeure concise, et le discours direct garde le tutoiement naturel du grec singulier.
