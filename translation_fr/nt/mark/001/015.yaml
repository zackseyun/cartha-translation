id: MRK.1.15
reference: Mark 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: fr
  text: 'et il disait : « Le temps est accompli, et le royaume de Dieu[a] s’est approché. Repentez-vous et croyez à la bonne nouvelle[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le règne de Dieu s’est approché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « croyez à l’Évangile ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: est accompli
  rationale: Le parfait grec présente l’accomplissement comme réalisé et toujours décisif au présent. « Est accompli » est naturel, concis et conserve le lien avec l’idée d’accomplissement.
- source_word: ὁ καιρὸς
  choice: le temps
  rationale: Dans ce contexte, καιρός désigne le moment décisif ou fixé. « Le temps » reste sobre et laisse le contexte porter cette nuance sans l’expliciter abusivement.
- source_word: ἤγγικεν
  choice: s’est approché
  rationale: 'Le parfait exprime une approche dont le résultat demeure : le royaume est désormais proche. Cette formulation conserve à la fois le mouvement d’approche et la proximité présente.'
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: « Royaume de Dieu » est l’expression française établie et garde l’amplitude de βασιλεία, qui peut évoquer à la fois le règne exercé et la réalité qui en relève.
- source_word: μετανοεῖτε
  choice: Repentez-vous
  rationale: L’impératif appelle à une réorientation profonde de la pensée et de la vie. « Repentez-vous » est concis, reconnu et plus complet que le seul fait de changer d’avis.
- source_word: πιστεύετε
  choice: croyez
  rationale: « Croyez » correspond directement à l’impératif grec sans réduire celui-ci à une simple opinion ni développer explicitement la notion de confiance.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: à la bonne nouvelle
  rationale: « Bonne nouvelle » rend de façon transparente εὐαγγέλιον. Après « croire », la tournure « croire à » est idiomatique en français.
- source_word: λέγων
  choice: et il disait
  rationale: Le participe dépend du récit précédent. Une proposition coordonnée avec un verbe conjugué produit un français naturel tout en maintenant la continuité narrative.
theological_decisions:
- issue: Sens de βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  alternative: le règne de Dieu
  rationale: Le texte principal conserve la formule biblique large et familière. La note signale « règne », qui met davantage en relief l’exercice dynamique de l’autorité divine, sans imposer un seul aspect du terme grec.
- issue: Sens de εὐαγγέλιον
  choice: la bonne nouvelle
  alternative: l’Évangile
  rationale: « Bonne nouvelle » communique directement le sens du mot grec dans un français courant. La formulation traditionnelle « l’Évangile » est conservée en note.
- issue: Portée de μετανοεῖτε καὶ πιστεύετε
  choice: Repentez-vous et croyez
  alternative: Continuez à vous repentir et à croire
  rationale: Les impératifs présents peuvent suggérer une action continue, mais l’impératif simple en français préserve l’urgence de l’appel sans surinterpréter l’aspect verbal.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la proclamation tout en évitant les développements interprétatifs. Les notes sont placées immédiatement après les expressions auxquelles elles se rapportent.
