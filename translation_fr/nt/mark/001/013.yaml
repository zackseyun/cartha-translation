source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: fr
  text: Et il était dans le désert pendant quarante jours, tenté par Satan[a] ; il était avec les animaux sauvages, et les anges le servaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mis à l’épreuve par Satan ». Le verbe grec peut signifier « tenter » ou « mettre à l’épreuve » ; ici, la mention de Satan comme agent favorise le sens « tenter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: désert
  rationale: « Désert » est le terme français naturel pour un lieu inhabité et aride; il conserve aussi les résonances bibliques sans préciser qu’il s’agirait nécessairement d’un désert de sable.
- source_word: τεσσεράκοντα ἡμέρας
  choice: pendant quarante jours
  rationale: L’ajout de « pendant » exprime naturellement en français l’accusatif grec de durée, sans développer la portée symbolique éventuelle du nombre.
- source_word: πειραζόμενος
  choice: tenté
  rationale: Le participe grec peut signifier « tenté » ou « mis à l’épreuve ». Puisque Satan est explicitement l’agent, « tenté » rend le mieux l’hostilité de l’action, tandis qu’une note conserve l’autre possibilité.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: par Satan
  rationale: « Satan » est la forme conventionnelle en français pour ce nom ou titre désignant l’adversaire surnaturel.
- source_word: μετὰ τῶν θηρίων
  choice: avec les animaux sauvages
  rationale: Cette formulation moderne rend clairement θηρία sans l’effet archaïque ou excessivement littéraire de « bêtes sauvages ».
- source_word: ἄγγελοι
  choice: les anges
  rationale: Dans ce contexte surnaturel, le mot grec désigne des êtres célestes plutôt que de simples messagers humains.
- source_word: διηκόνουν αὐτῷ
  choice: le servaient
  rationale: « Servaient » rend directement διακονέω et l’imparfait « servaient » maintient l’aspect duratif, dans un français plus courant que « exerçaient un ministère auprès de lui ».
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Et il resta... Il était... et...
  rationale: La répétition de « et » est partiellement conservée pour refléter la parataxe de Marc, mais la division en deux phrases assure une lecture française naturelle. « Resta » exprime ici la présence prolongée indiquée par ἦν et la durée de quarante jours.
theological_decisions:
- issue: Valeur sémantique de πειραζόμενος lorsque Satan est l’agent
  choice: tenté
  alternative: mis à l’épreuve
  rationale: Le grec autorise les deux sens. La présence explicite de Satan favorise « tenté », mais la note préserve la possibilité d’une mise à l’épreuve sans trancher au-delà des données lexicales.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du rythme narratif de Marc sans calquer mécaniquement toutes les coordinations grecques. Le marqueur [a] figure immédiatement après l’expression concernée.
