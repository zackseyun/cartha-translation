revisions:
- from: Ils étaient frappés par son enseignement, car il les enseignait comme quelqu’un qui a autorité[a], et non comme les spécialistes de la Loi.
  to: Ils étaient stupéfaits de son enseignement, car il leur enseignait comme quelqu’un qui a de l’autorité[a], et non comme les scribes.
  rationale: La révision corrige le régime français de « enseigner », rend plus précisément la réaction exprimée par ἐξεπλήσσοντο et remplace une paraphrase interprétative par le terme historique direct « scribes ». Elle maintient l’aspect duratif des imparfaits et ne précise pas théologiquement la source de l’autorité de Jésus.
