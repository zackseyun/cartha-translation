review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu, y compris l’imparfait de la réaction et de l’enseignement, ainsi que le contraste entre Jésus et les scribes. Toutefois, « il les enseignait » n’est pas l’usage français naturel pour des personnes : on enseigne quelque chose à quelqu’un, ou l’on enseigne à quelqu’un. « Il leur enseignait » est requis. « Spécialistes de la Loi » explicite de manière interprétative γραμματεῖς; « scribes » est le terme historique direct et établi.'
  naturalness: « Ils étaient frappés par son enseignement » est compréhensible, mais « Ils étaient stupéfaits de son enseignement » exprime plus nettement ἐξεπλήσσοντο dans un français international courant. La correction de régime « il leur enseignait » est nécessaire.
  terminology: « Scribes » préserve le terme historique γραμματεῖς sans le réduire à une fonction moderne de copiste ni le développer en paraphrase. « Autorité » convient pour ἐξουσία, sans déterminer indûment son origine.
  issues:
  - severity: medium
    issue: Régime verbal incorrect ou très peu naturel dans « il les enseignait ».
    rationale: 'En français moderne, lorsqu’il s’agit des destinataires humains, enseigner se construit normalement avec « à » : « il leur enseignait ». Le complément direct désigne plutôt la matière enseignée.'
  - severity: low
    issue: « Les spécialistes de la Loi » est une explicitation interprétative de γραμματεῖς.
    rationale: La désignation historique directe « les scribes » est plus fidèle au terme grec et demeure standard en français biblique et historique.
  - severity: low
    issue: « Étaient frappés » rend moins explicitement la forte stupeur de ἐξεπλήσσοντο.
    rationale: « Étaient stupéfaits » est plus précis et naturel ici, tout en conservant l’imparfait.
  revised_text: Ils étaient stupéfaits de son enseignement, car il leur enseignait comme quelqu’un qui a de l’autorité[a], et non comme les scribes.
  revised_footnotes:
  - marker: a
    text: 'Ou : « avec autorité ».'
    reason: Cette formulation est plus idiomatique, mais rend moins explicitement la comparaison introduite par ὡς (« comme quelqu’un qui a de l’autorité »).
  revision_rationale: La révision corrige le régime français de « enseigner », rend plus précisément la réaction exprimée par ἐξεπλήσσοντο et remplace une paraphrase interprétative par le terme historique direct « scribes ». Elle maintient l’aspect duratif des imparfaits et ne précise pas théologiquement la source de l’autorité de Jésus.
