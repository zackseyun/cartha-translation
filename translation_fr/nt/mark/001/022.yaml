reference: Mark 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: fr
  text: Ils étaient stupéfaits de son enseignement, car il leur enseignait comme quelqu’un qui a de l’autorité[a], et non comme les scribes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec autorité ».'
    reason: Cette formulation est plus idiomatique, mais rend moins explicitement la comparaison introduite par ὡς (« comme quelqu’un qui a de l’autorité »).
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: étaient frappés
  rationale: L’imparfait exprime leur réaction prolongée, et « frappés » rend naturellement en français la forte surprise provoquée par l’enseignement de Jésus.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: par son enseignement
  rationale: Le nom διδαχή peut désigner ici le contenu ou la manière d’enseigner; « enseignement » reste clair et non interprétatif.
- source_word: ἦν γὰρ διδάσκων αὐτοὺς
  choice: car il les enseignait
  rationale: La construction périphrastique ἦν avec le participe présente l’action en cours; l’imparfait français en conserve l’aspect.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: comme quelqu’un qui a autorité
  rationale: Cette formulation conserve la comparaison introduite par ὡς et rend ἐξουσία par « autorité », sans préciser une origine que le verset n’explicite pas.
- source_word: γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte juif, γραμματεῖς désigne les experts et enseignants des Écritures et de la Loi; cette formulation est immédiatement compréhensible en français moderne et évite le sens courant trompeur de « scribes » comme simples copistes.
theological_decisions:
- issue: Nature de l’autorité de Jésus par contraste avec celle des spécialistes de la Loi
  choice: Décrire Jésus comme quelqu’un qui a autorité, sans en préciser ici la source ou la nature.
  alternative: Expliciter « avec une autorité divine ».
  rationale: Le verset souligne nettement le contraste, mais ne qualifie pas explicitement cette autorité de divine dans cette phrase; l’explication doctrinale ne doit donc pas être ajoutée au texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate du rôle historique; la phrase conserve le déroulement narratif et le contraste du grec.
