  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: fr
  text: Jean était vêtu d’un vêtement en poil de chameau et portait une ceinture de cuir autour de la taille[a]. Il se nourrissait de sauterelles et de miel sauvage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tenue de Jean rappelle la description d’Élie en 2 Rois 1.8 et contribue à la présentation de Jean, chez Marc, comme le précurseur prophétique.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: était vêtu de poil de chameau
  rationale: Le participe parfait décrit l’état vestimentaire de Jean. « Était vêtu de » restitue cette valeur stative, et « poil de chameau » désigne naturellement la matière du vêtement plutôt qu’une peau de chameau.
- source_word: ζώνην δερματίνην
  choice: une ceinture de cuir
  rationale: « Ceinture » est l’équivalent moderne naturel de ζώνη, tandis que δερματίνην en précise la matière.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: autour de la taille
  rationale: Cette formulation claire et courante rend la région des reins ou de la taille sans l’archaïsme de « reins » dans ce contexte vestimentaire.
- source_word: ἔσθων
  choice: Il se nourrissait
  rationale: Le participe présent contribue au portrait habituel de Jean. L’imparfait exprime cette pratique caractéristique avec plus de naturel en français que « il était en train de manger ».
- source_word: ἀκρίδας
  choice: sauterelles
  rationale: Le mot grec désigne les insectes communément appelés « sauterelles » en français biblique et courant dans ce contexte alimentaire.
- source_word: μέλι ἄγριον
  choice: miel sauvage
  rationale: Rendu direct et idiomatique de l’expression désignant du miel trouvé à l’état sauvage.
- source_word: καὶ ἦν
  choice: Jean était
  rationale: Le καί assure la continuité narrative, mais il n’est pas nécessaire de le rendre par un connecteur initial en français; aucun adverbe temporel comme « alors » ou « or » n’est ajouté.
theological_decisions:
- issue: Rapport entre la tenue de Jean et l’image prophétique d’Élie
  choice: Conserver dans le texte principal une description sobre de la tenue et du régime alimentaire de Jean.
  alternative: Expliciter dans le texte principal que Jean apparaît comme un nouvel Élie.
  rationale: La formulation rappelle 2 Rois 1.8, mais Marc 1.6 n’identifie pas explicitement Jean à Élie. Le rapprochement intertextuel est donc signalé en note plutôt qu’introduit dans la traduction.
translation_notes:
  register: Français international moderne, naturel et digne. « Était vêtu » maintient la valeur descriptive du parfait grec; « portait » évite une coordination pesante. Deux phrases rendent le portrait plus fluide sans modifier ses rapports logiques.
