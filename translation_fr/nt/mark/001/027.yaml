source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: fr
  text: 'Ils furent tous stupéfaits, au point de discuter entre eux en disant : « Qu’est-ce que cela ? Un enseignement nouveau, avec autorité[a] ! Il commande même aux esprits impurs, et ils lui obéissent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’est-ce que cela ? Quel est cet enseignement nouveau, avec autorité ? » Le grec peut être ponctué de manière à rattacher plus directement « enseignement nouveau » à la question.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: furent stupéfaits
  rationale: Le verbe exprime une vive stupéfaction. « Furent stupéfaits » est naturel et soutenu sans surcharger l’intensité.
- source_word: ἅπαντες
  choice: tous
  rationale: Le terme souligne que la réaction concerne l’ensemble des personnes présentes.
- source_word: ὥστε συζητεῖν
  choice: au point de discuter
  rationale: ὥστε avec l’infinitif marque ici le résultat; cette tournure française le rend clairement sans ajouter l’idée explicite d’un commencement.
- source_word: πρὸς ἑαυτούς
  choice: entre eux
  rationale: La formule indique un échange réciproque au sein du groupe.
- source_word: Τί ἐστιν τοῦτο;
  choice: Qu’est-ce que cela ?
  rationale: Cette question directe conserve la surprise et reste proche du grec.
- source_word: διδαχὴ καινή
  choice: Un enseignement nouveau
  rationale: « Enseignement » convient mieux que « doctrine » à la scène et « nouveau » garde la valeur de καινή.
- source_word: κατ’ ἐξουσίαν
  choice: donné avec autorité
  rationale: L’ajout minimal de « donné » produit une phrase française naturelle tout en rattachant principalement l’autorité à l’enseignement, sans exclure son expression dans le commandement qui suit.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: aux esprits impurs
  rationale: « Esprits impurs » est l’expression française courante qui conserve les dimensions religieuse et morale de ἀκάθαρτος.
- source_word: ἐπιτάσσει
  choice: Il commande
  rationale: Le verbe désigne un ordre donné avec autorité; « commande » maintient le lien lexical et thématique avec l’autorité.
- source_word: ὑπακούουσιν αὐτῷ
  choice: ils lui obéissent
  rationale: La formule rend directement la réponse d’obéissance des esprits à son ordre.
theological_decisions:
- issue: Rapport syntaxique de « avec autorité »
  choice: « Un enseignement nouveau, donné avec autorité ! »
  alternative: « Qu’est-ce que cela ? Qu’est-ce que cet enseignement nouveau, donné avec autorité ? » ou rattacher plus étroitement l’autorité au commandement des esprits.
  rationale: La syntaxe et la ponctuation possibles du grec laissent une certaine ambiguïté. Le texte principal présente la formule comme une appréciation exclamative, tandis que la note signale la lecture interrogative, sans enfermer l’autorité dans une seule action de Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque; « esprits impurs » et « avec autorité » conservent les termes théologiquement importants.
