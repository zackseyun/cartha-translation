  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: fr
  text: 'Et il leur dit : « Allons ailleurs, vers les localités voisines[a], afin que j’y prêche aussi, car c’est pour cela que je suis sorti[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne de petites agglomérations, intermédiaires entre des villages et des villes.
    reason: lexical_alternative
  - marker: b
    text: Ou « c’est dans ce but que je suis sorti ». Cette expression peut désigner simplement le départ de Jésus hors du lieu où il se trouvait, ou, plus largement, le but de sa démarche de prédication.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Allons
  rationale: Le subjonctif exhortatif à la première personne du pluriel invite les disciples à partir avec Jésus; « Allons » en restitue naturellement la force.
- source_word: ἀλλαχοῦ
  choice: ailleurs
  rationale: Cet adverbe indique un déplacement vers un autre lieu; « ailleurs » est direct et idiomatique.
- source_word: εἰς τὰς ἐχομένας κωμοπόλεις
  choice: dans les localités voisines
  rationale: ἐχομένας désigne ici les lieux proches ou suivants, tandis que κωμοπόλεις évoque de petites agglomérations intermédiaires entre villages et villes. « Localités voisines » reste naturel sans exagérer leur taille.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: afin que j’y prêche aussi
  rationale: ἵνα exprime le but, κηρύσσω l’action de prêcher ou proclamer publiquement, et καὶ ἐκεῖ souligne que Jésus veut le faire également en ces lieux.
- source_word: εἰς τοῦτο
  choice: car c’est pour cela
  rationale: La tournure exprime le motif ou le but et introduit naturellement l’explication donnée par Jésus.
- source_word: ἐξῆλθον
  choice: je suis sorti
  rationale: Traduction sobre du verbe ἐξέρχομαι, qui préserve la possibilité d’une sortie du lieu présent comme celle d’une allusion plus large à sa démarche de prédication.
- source_word: λέγει αὐτοῖς
  choice: il leur dit
  rationale: Le présent historique grec est conservé par le présent français, naturel dans un récit biblique et fidèle à la vivacité de la narration.
theological_decisions:
- issue: Portée de ἐξῆλθον
  choice: je suis sorti
  alternative: je suis parti; je suis venu pour cela
  rationale: Le grec peut renvoyer simplement au départ de Jésus hors du lieu où il se trouvait, tout en pouvant suggérer plus largement sa mission. La formulation retenue ne tranche pas cette ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. « Localités » évite de donner à κωμοπόλεις une taille trop précise; « prêche » conserve le vocabulaire biblique courant. Les marqueurs de note sont placés immédiatement après les expressions qu’ils éclairent.
