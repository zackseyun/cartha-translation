  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: fr
  text: 'Et une voix se fit entendre des cieux[a] : « Tu es mon Fils bien-aimé ; en toi, j’ai trouvé ma joie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « du ciel ». Le grec emploie le pluriel : « des cieux ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « en toi j’ai pris plaisir » ou « tu as toute mon approbation ».
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: une voix vint
  rationale: Cette tournure exprime naturellement l’apparition de la voix comme événement narratif, sans rendre littéralement ἐγένετο par « arriva » ou « se produisit », qui serait maladroit en français.
- source_word: ἐκ τῶν οὐρανῶν
  choice: des cieux
  rationale: Le pluriel du grec est conservé. « Des cieux » est à la fois naturel en français et plus proche de la forme du texte source que le singulier traditionnel « du ciel ».
- source_word: Σὺ εἶ
  choice: Tu es
  rationale: Le pronom explicite du grec donne à l’adresse sa force directe. Le français « Tu es » la rend sans ajouter d’adverbe emphatique.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mon Fils bien-aimé
  rationale: Cette formulation française unit naturellement l’identité filiale et l’affection exprimée par ἀγαπητός. La majuscule à « Fils » signale l’emploi christologique dans cette adresse à Jésus sans ajouter de terminologie doctrinale absente du verset.
- source_word: ἐν σοὶ
  choice: en toi
  rationale: La traduction conserve directement la préposition ἐν et la formulation personnelle du grec, plutôt que de la lisser en « de toi » ou « tu as ».
- source_word: εὐδόκησα
  choice: j’ai pris plaisir
  rationale: Le passé composé rend l’aoriste et conserve l’idée de plaisir, de faveur ou d’approbation. La formulation garde la tension temporelle du grec au lieu de la transformer silencieusement en présent.
theological_decisions:
- issue: Préserver la force christologique de la déclaration divine sans explicitation doctrinale ajoutée
  choice: mon Fils bien-aimé
  alternative: mon Fils, le Bien-Aimé
  rationale: Le choix retenu exprime à la fois la filiation et l’amour divin dans un français courant et digne, sans introduire de formulation théologique postérieure au texte.
- issue: Conserver ou lisser le pluriel οὐρανῶν
  choice: des cieux
  alternative: du ciel
  rationale: Le pluriel grec est clair et idiomatique en français. Le singulier traditionnel reste indiqué en note comme autre traduction possible.
- issue: Valeur temporelle et sémantique de εὐδόκησα
  choice: j’ai pris plaisir
  alternative: je trouve ma joie ; tu as toute mon approbation
  rationale: Le choix principal respecte l’aoriste et la construction avec « en toi ». Les variantes montrent la portée présente ou stative que la déclaration peut prendre en français, sans imposer une seule résolution.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Une voix vint » garde la sobriété narrative du grec ; « des cieux » conserve son pluriel ; « j’ai pris plaisir » maintient sa forme passée et sa construction sans les expliquer dans le corps du texte.
