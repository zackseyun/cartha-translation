id: MRK.1.44
reference: Mark 1:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: fr
  text: 'Il lui dit : « Attention, ne dis rien à personne. Mais va te montrer au prêtre et présente, pour ta purification, ce que Moïse a prescrit, afin que cela leur serve de témoignage[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme témoignage pour eux ». Il peut s’agir d’une preuve présentée aux prêtres ou à d’autres personnes; certains comprennent aussi « comme témoignage contre eux ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Attention
  rationale: L’impératif introduit une mise en garde pressante. « Attention » est naturel en français moderne et conserve cette force sans traduire littéralement le verbe de vision.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: ne dis rien à personne
  rationale: La formulation garde les deux négations indéfinies du grec — le contenu et le destinataire — dans un ordre idiomatique en français.
- source_word: ἀλλὰ ὕπαγε
  choice: Mais va
  rationale: ἀλλά oppose directement l’interdiction à l’action exigée; « Mais va » rend simplement ce mouvement correctif.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: te montrer au prêtre
  rationale: Cette traduction respecte le réfléchi et désigne le prêtre compétent pour constater la purification conformément à la Loi.
- source_word: προσένεγκε
  choice: présente
  rationale: Dans ce contexte cultuel, le verbe désigne l’action d’apporter ou de présenter l’offrande prescrite. « Présente » reste fidèle sans ajouter explicitement un nom absent du grec.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: pour ta purification
  rationale: La formule exprime le rapport de la présentation aux rites de purification. « Purification » convient au cadre rituel lévitique tout en restant compréhensible.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: ce que Moïse a prescrit
  rationale: Le relatif neutre pluriel est naturellement collectif en français. « Prescrit » convient particulièrement aux dispositions rituelles de la Loi.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: afin que cela leur serve de témoignage
  rationale: Cette formulation exprime la finalité ou le résultat de εἰς tout en conservant le sens de témoignage et le pronom indéterminé « leur ».
theological_decisions:
- issue: Référent et portée de εἰς μαρτύριον αὐτοῖς
  choice: « afin que cela leur serve de témoignage », sans préciser le référent ni une valeur hostile
  alternative: « comme preuve pour les prêtres » ou « comme témoignage contre eux »
  rationale: Le grec ne nomme pas explicitement les destinataires et n’emploie aucun terme signifiant « contre ». La traduction préserve donc l’ambiguïté entre attestation destinée aux prêtres, témoignage public plus large et éventuelle nuance accusatrice.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif garde son caractère pressant; le vocabulaire rituel reste accessible. La ponctuation sépare nettement l’interdiction de l’ordre positif.
