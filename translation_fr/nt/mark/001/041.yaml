source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: fr
  text: 'Et, en colère[a], il étendit la main, le toucha et lui dit : « Je le veux, sois purifié. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ont « ému de compassion » au lieu de « en colère ».
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: en colère
  rationale: Le participe aoriste de ὀργίζομαι, tel qu’imprimé dans la SBLGNT, exprime ici la colère. « En colère » rend directement cette émotion sans préciser son objet ni sa cause, que le texte laisse implicites.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: il tendit la main
  rationale: Cette formulation naturelle conserve le geste concret. Le participe grec est rendu par un verbe conjugué dans la suite narrative.
- source_word: αὐτοῦ ἥψατο
  choice: le toucha
  rationale: Dans ce contexte, ἅπτομαι désigne clairement le fait de toucher la personne. Le pronom objet évite une répétition lourde en français.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel d’une narration française soutenue et accessible.
- source_word: Θέλω
  choice: Je le veux
  rationale: Cette expression idiomatique répond directement à la condition formulée par l’homme au verset précédent et communique la volonté favorable de Jésus, sans réduire θέλω à un simple futur.
- source_word: καθαρίσθητι
  choice: sois purifié
  rationale: L’impératif passif conserve la dimension de purification associée à la lèpre, qui dépasse la seule idée de guérison physique.
theological_decisions:
- issue: Variante textuelle concernant l’émotion de Jésus
  choice: Traduire ὀργισθείς, le texte imprimé de la SBLGNT, par « en colère » dans le texte principal.
  alternative: « ému de compassion »
  rationale: Le texte principal suit la source grecque fournie et maintient la tension créée par la mention de la colère, sans en préciser arbitrairement la cause. La variante largement attestée dans la tradition manuscrite est signalée en note afin d’assurer la transparence textuelle.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans être archaïque. « Je le veux » est naturel dans cet échange et fait écho à la demande précédente. La note conserve la variante importante sans résoudre la difficulté théologique du texte principal.
