source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: fr
  text: 'Jésus leur dit : « Venez à ma suite, et je ferai de vous des pêcheurs d’êtres humains. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Venez à ma suite
  rationale: Expression française naturelle qui conserve l’appel à suivre Jésus, exprimé littéralement par « venez derrière moi ».
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: je ferai de vous
  rationale: Rend de façon idiomatique la tournure grecque « je vous ferai devenir », sans alourdir la phrase française.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: pêcheurs d’êtres humains
  rationale: Conserve la métaphore de la pêche tout en rendant ἀνθρώπων dans son sens générique, qui vise les humains et non exclusivement les hommes de sexe masculin.
theological_decisions:
- issue: Portée de ἀνθρώπων
  choice: êtres humains
  alternative: hommes
  rationale: Dans ce contexte, le pluriel ἀνθρώπων désigne l’humanité de manière générale. « Êtres humains » préserve cette portée sans ajouter d’interprétation confessionnelle.
- issue: Processus exprimé par γενέσθαι
  choice: je ferai de vous
  alternative: je vous ferai devenir
  rationale: La formulation choisie implique bien la transformation annoncée par Jésus, tandis que l’alternative suit plus explicitement la structure grecque mais paraît moins naturelle en français.
translation_notes:
  register: Français international moderne, simple et digne. « À ma suite » convient à un appel de disciple sans archaïsme; « pêcheurs d’êtres humains » maintient l’image frappante du texte source.
