  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: fr
  text: 'Jésus le réprimanda en disant : « Tais-toi[a] et sors de cet homme ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Sois muselé. »'
    reason: Le verbe grec emploie l’image forte d’une muselière pour imposer le silence.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: réprimanda
  rationale: Le verbe exprime une parole de vive réprobation prononcée avec autorité. « Réprimanda » conserve cette force sans réduire l’action à un simple ordre.
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom masculin singulier renvoie à l’esprit impur, auquel Jésus s’adresse directement. « Le » maintient la distinction narrative entre l’esprit interpellé et l’homme dont il doit sortir.
- source_word: λέγων
  choice: en disant
  rationale: Cette tournure française naturelle conserve le lien participial et introduit explicitement le contenu de la réprimande.
- source_word: Φιμώθητι
  choice: Tais-toi
  rationale: Le verbe évoque littéralement le fait de museler, mais, employé comme ordre adressé à un être parlant, il commande énergiquement le silence. « Tais-toi » rend clairement cette force en français moderne; l’image littérale est conservée en note.
- source_word: ἔξελθε
  choice: sors
  rationale: Dans ce contexte d’expulsion d’un esprit impur, le verbe désigne le mouvement hors de la personne qu’il habite. L’impératif « sors » est direct, naturel et énergique.
- source_word: ἐξ αὐτοῦ
  choice: de cet homme
  rationale: La préposition marque la sortie depuis l’intérieur. Le grec emploie littéralement « de lui », mais le français risquerait de faire prendre ce pronom pour l’esprit qui vient d’être interpellé. « De cet homme » explicite le référent fourni par le contexte immédiat sans ajouter de contenu doctrinal.
theological_decisions:
- issue: Référent de la réprimande de Jésus
  choice: Jésus s’adresse directement à l’esprit impur, distinct de l’homme dont il lui ordonne de sortir.
  alternative: Comprendre que Jésus réprimande l’homme comme référent immédiat.
  rationale: Le commandement « sors de cet homme » montre que le destinataire est l’esprit impur. Cette formulation respecte la distinction narrative entre l’homme affligé et l’esprit sans développer de doctrine au-delà du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le passé simple convient au registre narratif biblique tout en restant compréhensible. Les impératifs brefs rendent l’autorité abrupte de la parole de Jésus.
