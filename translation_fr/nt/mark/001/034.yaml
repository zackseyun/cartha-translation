source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: fr
  text: Il guérit beaucoup de gens atteints de diverses maladies et chassa beaucoup de démons. Il ne laissait pas les démons parler, parce qu’ils le connaissaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils savaient qui il était ». Le grec dit simplement : « ils le connaissaient ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: Il guérit
  rationale: « Guérir » rend naturellement l’aoriste de θεραπεύω dans ce récit et exprime l’action de rendre la santé sans ajouter de nuance étrangère.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: beaucoup de gens atteints
  rationale: L’expression idiomatique κακῶς ἔχω signifie être malade. « Gens atteints » s’articule naturellement avec le complément « de diverses maladies » et évite le calque maladroit « qui allaient mal ».
- source_word: ποικίλαις νόσοις
  choice: de diverses maladies
  rationale: ποικίλος marque la variété et νόσος la maladie ; cette formulation française est claire, actuelle et proche du sens grec.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: chassa beaucoup de démons
  rationale: Dans un contexte d’exorcisme, ἐκβάλλω désigne l’expulsion. « Chasser » est idiomatique en français biblique moderne et conserve la force du verbe.
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: Il ne laissait pas … parler
  rationale: L’imparfait français correspond bien à l’aspect imperfectif de ἤφιεν et présente cette interdiction comme maintenue au cours de la scène.
- source_word: ὅτι
  choice: parce que
  rationale: ὅτι introduit ici le plus naturellement la raison pour laquelle Jésus imposait le silence aux démons.
- source_word: ᾔδεισαν αὐτόν
  choice: ils le connaissaient
  rationale: Le grec a pour simple objet αὐτόν, « lui ». La traduction conserve cette concision et n’explicite pas davantage l’identité reconnue.
theological_decisions:
- issue: Faut-il expliciter la connaissance qu’avaient les démons de l’identité de Jésus ?
  choice: ils le connaissaient
  alternative: ils savaient qui il était
  rationale: Le texte grec dit littéralement qu’ils « le connaissaient », sans proposition précisant son identité. Garder cette formulation préserve l’ambiguïté et la tension christologique du verset au lieu d’importer une confession plus explicite tirée du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase est divisée en deux pour améliorer la lisibilité sans modifier les rapports logiques du grec. Le marqueur [a] est placé après l’expression qu’il éclaire.
