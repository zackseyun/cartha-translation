source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: fr
  text: Comme il longeait la mer de Galilée, il vit Simon et André, le frère de Simon, en train de jeter un filet dans la mer, car ils étaient pêcheurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: Comme il longeait la mer
  rationale: Le participe présent exprime une action en cours, contemporaine du verbe principal, et παρά avec l’accusatif indique ici un déplacement le long de la rive. « Comme il longeait » restitue naturellement les deux éléments.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: la mer de Galilée
  rationale: Cette appellation géographique traditionnelle respecte θάλασσα, même si l’étendue d’eau est techniquement un lac.
- source_word: εἶδεν
  choice: il vit
  rationale: Traduction directe de l’aoriste de ὁράω, sans ajouter la nuance interprétative de « remarquer ».
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Simon et André
  rationale: Les noms suivent leur forme française usuelle.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: le frère de Simon
  rationale: L’apposition grecque identifie André par son lien familial avec Simon; cette formulation est claire et naturelle en français.
- source_word: ἀμφιβάλλοντας
  choice: qui jetaient un filet
  rationale: Le verbe désigne spécifiquement l’action de lancer un filet. L’imparfait rend l’action en cours observée par Jésus.
- source_word: ἐν τῇ θαλάσσῃ
  choice: dans la mer
  rationale: Avec « jeter », le français peut employer « dans » pour indiquer la destination, tout en restant proche de ἐν.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: car ils étaient pêcheurs
  rationale: « Car » conserve la fonction explicative de γάρ et convient au registre narratif digne du passage.
