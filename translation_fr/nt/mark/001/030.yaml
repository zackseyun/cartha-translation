  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: fr
  text: La belle-mère de Simon était couchée avec de la fièvre et, aussitôt, ils lui parlèrent d’elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, au présent historique : « ils lui parlent d’elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: belle-mère
  rationale: Terme français courant et précis pour désigner ici la mère de l’épouse de Simon.
- source_word: κατέκειτο
  choice: était couchée
  rationale: L’imparfait rend l’état continu exprimé par l’imparfait grec, sans renforcer indûment le sens en « était alitée ».
- source_word: πυρέσσουσα
  choice: avec de la fièvre
  rationale: Expression naturelle en français moderne pour le participe indiquant qu’elle souffrait de fièvre.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Conserve la promptitude caractéristique du récit de Marc dans un registre naturel et digne.
- source_word: λέγουσιν
  choice: ils lui parlèrent
  rationale: Le passé simple assure un récit français fluide; le présent historique grec est signalé en note.
- source_word: περὶ αὐτῆς
  choice: d’elle
  rationale: Avec « parler », « parler d’elle » rend naturellement le sens de περί avec le génitif.
- source_word: δὲ
  choice: non rendu séparément
  rationale: Particule de liaison légère dont la fonction narrative est suffisamment portée par l’enchaînement de la phrase; ajouter « or » ou « mais » risquerait de marquer une transition ou une opposition trop forte.
