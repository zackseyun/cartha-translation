  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: fr
  text: Et aussitôt, ils laissèrent les filets et le suivirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui préserve l’enchaînement narratif caractéristique de Marc sans ajouter de nuance interprétative.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Terme courant et naturel qui exprime nettement la promptitude et l’urgence portées par l’adverbe grec.
- source_word: ἀφέντες
  choice: ils laissèrent
  rationale: Le participe aoriste indique une action antérieure à celle du verbe principal. Une proposition coordonnée est plus naturelle en français que « ayant laissé »; « abandonnèrent » renforcerait indûment la portée affective.
- source_word: τὰ δίκτυα
  choice: les filets
  rationale: L’article défini du grec est conservé. Le contexte implique qu’il s’agit de leurs filets, mais le possessif n’est pas explicite.
- source_word: ἠκολούθησαν
  choice: suivirent
  rationale: Ce verbe conserve à la fois le mouvement concret et la portée naissante du discipulat, sans explicitation théologique ajoutée.
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom renvoie à Jésus dans le contexte immédiat; le français emploie naturellement ici le pronom objet direct avec « suivre ».
theological_decisions:
- issue: Portée du discipulat dans ἠκολούθησαν
  choice: « le suivirent »
  alternative: « devinrent ses disciples » ou « partirent avec lui »
  rationale: La formulation retenue garde la simplicité du grec ainsi que sa double portée, concrète et théologique, sans résoudre ni développer ce que le récit laisse émerger du contexte.
translation_notes:
  register: Français moderne, international et digne. La phrase reste brève et vive, conformément au rythme narratif de Marc. Le passé simple convient au registre narratif biblique sans être archaïque; « aussitôt » est plus idiomatique que « immédiatement » dans cette construction.
