lexical_decisions:
- source_word: κατεδίωξεν
  choice: se mirent à sa recherche avec insistance
  rationale: Le verbe καταδιώκω évoque une poursuite énergique. Dans ce contexte, la formulation française exprime une recherche pressante sans suggérer à tort une hostilité.
- source_word: αὐτὸν
  choice: sa
  rationale: Le pronom renvoie à Jésus; dans la locution « se mettre à la recherche de », le français le reprend naturellement par le possessif « sa ».
- source_word: Σίμων
  choice: Simon
  rationale: Forme française conventionnelle du nom propre.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ceux qui étaient avec lui
  rationale: Rend directement l’expression grecque sans préciser davantage l’identité ou le statut de ces personnes.
- source_word: καὶ
  choice: omis comme connecteur explicite
  rationale: En français narratif moderne, la succession demeure claire sans « et » initial; l’enchaînement avec le contexte est conservé par l’ordre du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Avec insistance » conserve la force du verbe grec tout en évitant la connotation potentiellement hostile de « pourchasser ».
