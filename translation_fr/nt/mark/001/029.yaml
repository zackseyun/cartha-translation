  source_fidelity: La séquence « après être sortis ... ils » rend bien l’antériorité du participe ἐξελθόντες, et « aussitôt » restitue εὐθύς. Toutefois, « se rendirent à la maison » exprime surtout l’arrivée à destination, tandis que εἰς τὴν οἰκίαν marque le mouvement dans la maison. « Entrèrent dans la maison » rend cette direction de façon claire et idiomatique.
  naturalness: Le français est moderne, fluide et d’un registre narratif approprié. La légère ponctuation après « Aussitôt » rend plus nettement le rythme de l’original et évite de faire de « aussitôt après » un seul bloc temporel.
