id: MRK.1.29
reference: Mark 1:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: fr
  text: Aussitôt, après être sortis de la synagogue, ils entrèrent dans la maison de Simon et d’André, avec Jacques et Jean.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Cet adverbe caractéristique de Marc imprime au récit un mouvement rapide. « Aussitôt » est naturel en français moderne et conserve cette vivacité.
- source_word: ἐκ τῆς συναγωγῆς
  choice: de la synagogue
  rationale: Avec ἐξελθόντες, l’expression indique le lieu dont ils sortent. La construction « après être sortis de la synagogue » évite une répétition lourde tout en gardant la séquence.
- source_word: ἐξελθόντες ἦλθον
  choice: après être sortis… ils se rendirent
  rationale: Le participe aoriste présente la sortie comme antérieure au déplacement exprimé par le verbe principal. Cette formulation française rend clairement les deux actions successives.
- source_word: ἦλθον
  choice: ils se rendirent
  rationale: ἔρχομαι peut signifier « venir » ou « aller » selon le point de vue. Sans point de repère déictique explicite en français, « se rendirent » exprime naturellement le déplacement vers la destination indiquée.
- source_word: εἰς τὴν οἰκίαν
  choice: à la maison
  rationale: εἰς marque le mouvement vers l’intérieur ou vers une destination. En français, « se rendre à la maison » est idiomatique; le contexte immédiat implique l’entrée dans la demeure.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: de Simon et d’André
  rationale: Les génitifs rattachent la maison à Simon et André, vraisemblablement comme leur demeure commune. La formulation française reste directe sans préciser davantage la nature de ce lien.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: avec Jacques et Jean
  rationale: μετά suivi du génitif exprime l’accompagnement; « avec » en est l’équivalent français le plus simple et direct.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Simon / André / Jacques / Jean
  rationale: Les noms suivent leurs formes françaises bibliques usuelles, immédiatement reconnaissables par le lectorat francophone.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La phrase conserve la rapidité propre au récit de Marc et ne résout pas davantage l’identité du sujet pluriel que ne le fait le grec.
