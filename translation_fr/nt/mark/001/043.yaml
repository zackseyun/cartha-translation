  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐμβριμησάμενος αὐτῷ ⸀εὐθὺς ἐξέβαλεν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/043.yaml
  text: And after sternly warning him[a], he immediately sent him away[b],
translation:
  language: fr
  text: Puis, après l’avoir averti avec sévérité[a], il le renvoya aussitôt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après lui avoir donné un ordre strict » ; le verbe grec peut aussi exprimer une vive indignation ou une sévère réprimande.
    reason: lexical_alternative
  - marker: b
    text: Ou « le chassa » / « le fit sortir » ; le verbe grec est plus fort qu’un simple « renvoya ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Puis
  rationale: Le connecteur poursuit le récit. « Puis » est naturel en français narratif tout en conservant l’enchaînement marqué par καί.
- source_word: ἐμβριμησάμενος
  choice: après l’avoir averti avec sévérité
  rationale: Le participe exprime une parole ou une attitude d’une grande fermeté, pouvant comporter indignation ou réprimande. Cette formulation rend à la fois la force émotionnelle et la portée directive sans affirmer que Jésus condamne personnellement l’homme.
- source_word: αὐτῷ
  choice: l’
  rationale: Le pronom datif renvoie à l’homme guéri et s’intègre naturellement comme complément direct du verbe français « avertir ».
- source_word: εὐθύς
  choice: aussitôt
  rationale: Ce terme fréquent chez Marc souligne l’immédiateté et le rythme rapide du récit. « Aussitôt » est idiomatique et digne en français contemporain.
- source_word: ἐξέβαλεν
  choice: le renvoya
  rationale: Le verbe grec est plus énergique qu’un simple départ autorisé et peut signifier « chasser » ou « faire sortir ». « Renvoya » convient au contexte humain, tandis qu’une note conserve la force inhabituelle du grec.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom accusatif désigne le même homme et devient naturellement le complément direct de « renvoya ».
theological_decisions:
- issue: Le ton de Jésus envers l’homme guéri
  choice: Jésus l’avertit et le fait partir avec une fermeté marquée.
  alternative: Jésus éprouve de l’indignation contre lui ou le réprimande personnellement.
  rationale: Les deux verbes grecs sont vigoureux, mais le texte ne précise ni la cause exacte de cette intensité ni qu’elle équivaut à une condamnation personnelle. La traduction maintient cette tension sans attribuer à Jésus une hostilité que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le rythme rapide de Marc. « Averti avec sévérité » et « renvoya » restent naturels dans le corps du texte, tandis que les notes signalent toute la vigueur et l’ambiguïté des verbes grecs.
