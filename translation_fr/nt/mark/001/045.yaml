id: MRK.1.45
reference: Mark 1:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: fr
  text: Mais une fois parti, l’homme se mit à proclamer beaucoup de choses et à répandre la nouvelle, si bien que Jésus ne pouvait plus entrer ouvertement dans une ville. Il restait dehors, dans des lieux déserts, et l’on venait à lui de partout.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἐξελθών
  choice: Mais une fois parti, l’homme
  rationale: Le participe renvoie à l’homme guéri au verset précédent. « Une fois parti » exprime naturellement l’antériorité, et « l’homme » clarifie le changement de sujet sans surinterpréter.
- source_word: κηρύσσειν πολλὰ
  choice: proclamer beaucoup de choses
  rationale: Conserve l’objet neutre pluriel πολλὰ et sa portée potentiellement large, plutôt que de le transformer implicitement en adverbe comme « largement ».
- source_word: διαφημίζειν τὸν λόγον
  choice: répandre la nouvelle
  rationale: Dans ce contexte, λόγος désigne la nouvelle ou le récit de ce qui s’est passé. Cette formulation française est naturelle sans préciser davantage le contenu.
- source_word: φανερῶς
  choice: ouvertement
  rationale: Rend directement l’idée d’une entrée publique et manifeste, devenue impossible en raison de l’affluence.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: dans des lieux déserts
  rationale: Restitue le sens de lieux inhabités ou isolés, sans suggérer nécessairement un désert aride.
- source_word: ἤρχοντο πρὸς αὐτὸν πάντοθεν
  choice: l’on venait à lui de partout
  rationale: L’imparfait exprime un mouvement continu ou répété. Le sujet indéfini français rend naturellement le pluriel grec sans antécédent explicite.
theological_decisions:
- issue: Référent de αὐτόν dans « μηκέτι αὐτὸν δύνασθαι »
  choice: Jésus
  alternative: le pronom « il »
  rationale: Le sujet grammatical pourrait devenir momentanément ambigu en français après la mention de l’homme. Nommer Jésus rend le référent contextuel clair sans ajouter de contenu doctrinal.
- issue: Contenu de la proclamation de l’homme
  choice: « beaucoup de choses » puis « la nouvelle »
  alternative: « proclamer largement » ou « proclamer la parole »
  rationale: Le grec distingue πολλὰ, objet de « proclamer », et τὸν λόγον, objet de « répandre ». La traduction maintient cette distinction et évite de donner à λόγος un sens théologique technique non imposé par le contexte.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la progression narrative grecque, tout en clarifiant sobrement les sujets afin d’éviter une ambiguïté artificielle en français.
