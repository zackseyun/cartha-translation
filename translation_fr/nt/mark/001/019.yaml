  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: fr
  text: Un peu plus loin, il vit Jacques, fils de Zébédée, et Jean, son frère, qui étaient dans la barque et remettaient les filets en état.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réparaient » ou « préparaient les filets » ; le verbe grec peut signifier mettre quelque chose en ordre ou le remettre en bon état.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: Un peu plus loin
  rationale: Cette formulation française naturelle exprime le bref déplacement vers l’avant indiqué par le participe aoriste et ὀλίγον, sans alourdir le récit.
- source_word: εἶδεν
  choice: il vit
  rationale: Le passé simple convient au récit et rend directement l’aoriste narratif de ὁράω, sans ajouter l’idée plus marquée de remarquer.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jacques, fils de Zébédée
  rationale: La construction avec génitif identifie Jacques par sa filiation; cette tournure est claire et idiomatique en français.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Jean, son frère
  rationale: Le pronom renvoie naturellement à Jacques; la formulation conserve cette relation de manière concise.
- source_word: καὶ αὐτούς
  choice: Eux aussi étaient
  rationale: Le καί associé au pronom accentué peut naturellement signaler que ces deux hommes, eux aussi, se trouvaient dans une barque. La phrase française explicite la construction de perception sans modifier la scène.
- source_word: ἐν τῷ πλοίῳ
  choice: dans la barque
  rationale: L’article défini correspond à la barque particulière liée aux deux hommes dans la scène; « barque » est naturel pour ce type d’embarcation de pêche.
- source_word: καταρτίζοντας
  choice: remettaient les filets en état
  rationale: καταρτίζω signifie mettre en ordre ou rétablir dans un état approprié. La traduction garde volontairement une portée assez large, qui peut inclure réparer ou préparer les filets.
- source_word: τὰ δίκτυα
  choice: les filets
  rationale: Le nom désigne des filets de pêche et porte l’article, sans possessif explicite; « les filets » reste donc proche du grec et naturel.
