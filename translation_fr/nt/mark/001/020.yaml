source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: fr
  text: Aussitôt, il les appela. Laissant leur père Zébédée dans le bateau avec les ouvriers salariés, ils partirent à sa suite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « derrière lui » ou « ils le suivirent ». Le grec peut évoquer à la fois un déplacement physique et le commencement d’une démarche de disciple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Conserve la marque d’urgence caractéristique du récit de Marc dans un français actuel et naturel.
- source_word: ἐκάλεσεν
  choice: il les appela
  rationale: « Appeler » rend directement καλέω sans accentuer excessivement ni l’autorité d’une convocation ni la douceur d’une invitation.
- source_word: ἀφέντες
  choice: Laissant
  rationale: Rend le participe aoriste comme une action liée et antérieure au départ, sans lui donner la nuance plus dure d’un abandon.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: leur père Zébédée
  rationale: Reproduit simplement le lien familial et le nom propre, sans ajouter d’emphase absente du grec.
- source_word: πλοίῳ
  choice: bateau
  rationale: Convient au cadre de la pêche en Galilée et évite le terme « navire », qui suggérerait une embarcation plus importante.
- source_word: μισθωτῶν
  choice: ouvriers salariés
  rationale: Exprime qu’il s’agit de personnes travaillant contre rémunération, sans importer le vocabulaire moderne de l’entreprise.
- source_word: ἀπῆλθον
  choice: ils partirent
  rationale: Conserve l’idée de quitter le lieu où ils se trouvaient tout en restant idiomatique en français.
- source_word: ὀπίσω αὐτοῦ
  choice: à sa suite
  rationale: Cette expression peut évoquer à la fois le déplacement derrière Jésus et le commencement d’une démarche de disciple, sans imposer un seul de ces sens.
theological_decisions:
- issue: La portée du discipulat dans ὀπίσω αὐτοῦ
  choice: ils partirent à sa suite
  alternative: ils partirent derrière lui ; ils le suivirent
  rationale: Le grec associe potentiellement un mouvement spatial à l’idée de devenir disciple. « À sa suite » maintient cette double résonance sans expliciter davantage que le texte source.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation demeure digne et accessible, avec une syntaxe fluide qui respecte la succession rapide des actions.
