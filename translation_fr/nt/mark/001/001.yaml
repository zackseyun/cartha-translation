  text: Ἀρχὴ τοῦ εὐαγγελίου Ἰησοῦ ⸀χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: fr
  text: Commencement de la bonne nouvelle[a] de Jésus, le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’Évangile ». Le mot grec εὐαγγέλιον peut désigner une « bonne nouvelle » ou, selon le terme traditionnel, l’« Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Jésus-Christ ». Le grec Χριστός signifie « Messie » lorsqu’il est employé comme titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Commencement
  rationale: Le nom sans article conserve la forme concise d’un titre ou d’un incipit et n’impose pas d’en faire une phrase complète. « Commencement » rend ici plus naturellement l’ouverture solennelle que « début ».
- source_word: εὐαγγελίου
  choice: bonne nouvelle
  rationale: Cette traduction exprime directement le sens courant du terme grec pour les lecteurs modernes, tandis que le terme traditionnel « Évangile » est signalé en note.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française consacrée.
- source_word: χριστοῦ
  choice: le Messie
  rationale: Χριστός désigne ici le titre messianique de Jésus. « Le Messie » en restitue le sens plutôt que de traiter « Christ » comme un simple second nom; l’article et la virgule rendent l’apposition naturelle en français.
theological_decisions:
- issue: Faut-il traduire Χριστός comme un titre ou conserver la forme traditionnelle « Christ »?
  choice: le Messie
  alternative: Christ
  rationale: Dans cette formule d’ouverture, le mot identifie Jésus par sa fonction messianique. Traduire le titre préserve sa portée issue du contexte juif, tandis qu’une note maintient l’autre formulation traditionnelle.
- issue: Quel rapport le génitif Ἰησοῦ entretient-il avec « bonne nouvelle »?
  choice: de Jésus
  alternative: au sujet de Jésus / annoncée par Jésus
  rationale: La formulation française « de Jésus » conserve la concision et l’ambiguïté du génitif grec, qui peut présenter Jésus comme le contenu central de la bonne nouvelle sans exclure son rôle de proclamateur.
translation_notes:
  register: Formulation brève, solennelle et actuelle, adaptée à un incipit. L’absence d’article devant « Commencement » reflète la construction grecque et son caractère possible de titre. « Bonne nouvelle » privilégie la transparence lexicale, et « le Messie » rend explicitement le titre sans ajouter d’interprétation confessionnelle.
