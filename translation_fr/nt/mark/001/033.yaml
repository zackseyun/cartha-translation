  text: καὶ ⸂ἦν ὅλη ἡ πόλις ἐπισυνηγμένη⸃ πρὸς τὴν θύραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/033.yaml
  text: And the whole city was gathered at the door[a].
translation:
  language: fr
  text: Et toute la ville était rassemblée devant la porte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la porte ». La préposition grecque peut aussi se traduire ainsi ; dans ce contexte, elle désigne la foule rassemblée à l’entrée de la maison.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: était
  rationale: L’imparfait de εἰμί, associé au participe parfait passif, décrit l’état de la scène en cours. « Était » le rend naturellement en français.
- source_word: ὅλη ἡ πόλις
  choice: toute la ville
  rationale: Cette formulation directe préserve l’expression grecque dans sa force rhétorique, sans l’affaiblir ni exiger qu’elle soit comprise comme une exhaustivité mathématique.
- source_word: ἐπισυνηγμένη
  choice: rassemblée
  rationale: Le participe parfait passif de ἐπισυνάγω exprime le résultat d’un rassemblement. « Rassemblée » est naturel, précis et s’accorde avec le nom collectif féminin « ville ».
- source_word: πρὸς τὴν θύραν
  choice: devant la porte
  rationale: Avec cette description statique, πρός suivi de l’accusatif situe la foule par rapport à l’entrée. « Devant la porte » exprime clairement et naturellement en français la position résultante, tout en conservant l’image de la porte.
- source_word: θύραν
  choice: porte
  rationale: θύρα désigne littéralement une porte et, dans ce contexte, l’entrée de la maison. « Porte » reste le choix le plus direct.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe conserve la description sobre de la scène et l’expression emphatique « toute la ville ». « Devant la porte » est plus idiomatique ici que le calque « vers la porte ».
