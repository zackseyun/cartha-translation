  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: fr
  text: Jean le Baptiste[a] parut dans le désert, proclamant un baptême de repentance pour le pardon des péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jean le Baptiseur ». Le participe grec peut être rendu plus explicitement comme une désignation de son activité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: parut
  rationale: Dans ce récit, le verbe introduit Jean sur la scène. « Parut » rend naturellement cette fonction narrative sans employer le calque maladroit « devint ».
- source_word: Ἰωάννης
  choice: Jean
  rationale: Le nom est rendu selon sa forme française traditionnelle et courante.
- source_word: ὁ βαπτίζων
  choice: le Baptiste
  rationale: Le participe substantivé désigne Jean par son activité de baptiseur. « Le Baptiste » est le titre français établi; une note conserve la formulation plus explicite.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est la formulation française naturelle pour une région inhabitée ou sauvage et conserve les résonances bibliques du terme sans imposer l’image d’une étendue uniquement sablonneuse.
- source_word: κηρύσσων
  choice: proclamant
  rationale: « Proclamant » restitue la dimension publique et annonciatrice du verbe, avec moins de connotations institutionnelles que « prêchant ».
- source_word: βάπτισμα
  choice: baptême
  rationale: « Baptême » est le terme français précis et reconnu correspondant au nom grec.
- source_word: μετανοίας
  choice: de repentance
  rationale: « Repentance » exprime le retournement moral et spirituel visé par le grec, sans le réduire à un simple regret ni expliciter davantage que le texte.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: pour le pardon des péchés
  rationale: Cette formulation française naturelle maintient le rapport de visée ou de résultat exprimé par εἰς sans trancher la manière dont le baptême, la repentance et le pardon sont liés.
theological_decisions:
- issue: Rapport entre le baptême, la repentance et le pardon
  choice: « un baptême de repentance pour le pardon des péchés »
  alternative: « un baptême qui manifeste la repentance en vue du pardon » ou « un baptême qui procure le pardon par la repentance »
  rationale: La construction grecque affirme un rapport entre ces réalités sans préciser à elle seule si le baptême est instrumental, symbolique ou déclaratif. La traduction conserve cette tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Le Baptiste » respecte l’usage français établi, tandis que « proclamant » conserve la force publique de l’annonce. La syntaxe participiale reflète la structure grecque tout en restant naturelle.
