  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: fr
  text: 'Il proclamait : « Celui qui est plus puissant que moi vient après moi. Je ne suis pas digne de me baisser pour délier la lanière de ses sandales.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « après moi » peut aussi signifier « derrière moi ». Le mot rendu par « digne » peut également signifier « qualifié » ou « à la hauteur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν λέγων
  choice: Il proclamait
  rationale: 'L’imparfait exprime une proclamation continue ou répétée. En français, les deux verbes grecs n’ont pas besoin d’être reproduits par le lourd « proclamait en disant » : les deux-points introduisent naturellement les paroles.'
- source_word: Ἔρχεται
  choice: vient
  rationale: Le présent conserve l’immédiateté de l’annonce et sonne plus naturel ici que « est en train de venir ».
- source_word: ὁ ἰσχυρότερός μου
  choice: Celui qui est plus puissant que moi
  rationale: L’adjectif comparatif substantivé désigne une personne supérieure en puissance. « Plus puissant » garde l’ampleur de ἰσχυρός sans employer le « plus fort » potentiellement trop physique.
- source_word: ὀπίσω μου
  choice: après moi
  rationale: Dans ce contexte, l’expression porte une nuance temporelle et de succession, tout en pouvant évoquer la venue à la suite de Jean.
- source_word: ἱκανὸς
  choice: digne
  rationale: Bien que le terme puisse signifier « capable », « suffisant » ou « qualifié », l’idiome exprime surtout ici l’indignité profonde de Jean devant celui qui vient.
- source_word: κύψας λῦσαι
  choice: me baisser pour délier
  rationale: Le participe aoriste indique le geste préalable ou accompagnant l’action de délier. Cette formulation française naturelle conserve l’abaissement physique sans lourdeur syntaxique.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: la lanière de ses sandales
  rationale: « Lanière » désigne précisément la pièce de cuir qui attache la sandale, et « sandales » correspond au type de chaussure du contexte ancien.
theological_decisions:
- issue: Portée de l’humilité de Jean
  choice: Je ne suis pas digne
  alternative: Je ne suis pas capable / qualifié
  rationale: Le contexte de la tâche servile consistant à délier les sandales met l’accent sur l’indignité et l’infériorité de statut, plutôt que sur une simple incapacité pratique.
- issue: Sens de ὀπίσω μου
  choice: après moi
  alternative: derrière moi
  rationale: « Après moi » préserve la dimension temporelle de la venue annoncée. La nuance spatiale de « derrière moi » reste possible et est signalée en note afin de ne pas résoudre indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le tour artificiel « proclamait en disant » ainsi que le vocabulaire trop ecclésiastique. La note conserve les principales nuances lexicales réelles sans surcharger le verset.
