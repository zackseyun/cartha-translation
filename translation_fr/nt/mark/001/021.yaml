  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: fr
  text: Ils entrent à Capharnaüm. Aussitôt, le jour du sabbat, Jésus enseignait dans la synagogue.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les sabbats » ; cette tournure grecque peut désigner le jour du sabbat.
    reason: lexical_alternative
  - marker: b
    text: Ou, selon le contexte, « se mit à enseigner » ; l’imparfait grec présente l’action en cours et peut parfois avoir une nuance de commencement.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: Ils entrent
  rationale: Le présent historique, fréquent chez Marc, peut être conservé naturellement en français et donne de la vivacité au récit.
- source_word: Καφαρναούμ
  choice: Capharnaüm
  rationale: Forme française traditionnelle et largement reconnue du nom de lieu.
- source_word: εὐθύς
  choice: Dès
  rationale: Avec l’indication temporelle du sabbat, « dès » exprime de façon naturelle la promptitude portée par εὐθύς sans alourdir la phrase.
- source_word: τοῖς σάββασιν
  choice: le jour du sabbat
  rationale: Le pluriel grec est une tournure temporelle idiomatique qui désigne ici le sabbat; « le jour du sabbat » est clair et naturel en français.
- source_word: ἐδίδασκεν
  choice: enseignait
  rationale: L’imparfait français correspond bien à l’aspect imperfectif du grec, sans imposer la nuance inchoative possible mais non certaine de « se mit à enseigner ».
- source_word: συναγωγήν
  choice: la synagogue
  rationale: Dans ce contexte juif, le terme désigne la synagogue locale, et non simplement une assemblée.
theological_decisions:
- issue: Sujet implicite de ἐδίδασκεν
  choice: Jésus enseignait
  alternative: il enseignait
  rationale: Le grec porte seulement un sujet verbal implicite masculin singulier. Nommer Jésus en français clarifie le changement de sujet après « ils » sans introduire d’interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique de Marc est conservé. La ponctuation en deux phrases respecte la rupture après Capharnaüm et rend le récit fluide.
