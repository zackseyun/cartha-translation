id: MRK.1.10
reference: Mark 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: fr
  text: Aussitôt, tandis qu’il remontait hors de l’eau, il vit les cieux se déchirer[a] et l’Esprit descendre comme une colombe sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cieux s’ouvrir en se déchirant ». Le verbe grec est plus fort que le simple verbe « ouvrir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en lui ». Le grec peut avoir ce sens, mais « sur lui » convient mieux ici à la descente de l’Esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Ce terme restitue l’immédiateté et le rythme narratif caractéristique de Marc dans un français actuel et naturel.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: tandis qu’il remontait hors de l’eau
  rationale: Le participe présent exprime une action simultanée à celle du verbe principal. « Hors de l’eau » rend explicitement ἐκ sans déterminer davantage la manière du baptême.
- source_word: εἶδεν
  choice: il vit
  rationale: Rendu direct de l’aoriste de perception, sans ajout interprétatif.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: les cieux se déchirer
  rationale: « Se déchirer » conserve la force de σχίζω, plus vive qu’une simple ouverture, tandis que « les cieux » respecte le pluriel grec et le registre biblique.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Le contexte désigne l’Esprit divin, mais le texte grec ne comporte pas ici l’adjectif « Saint » ; la formulation source est donc préservée.
- source_word: ὡς περιστερὰν
  choice: comme une colombe
  rationale: 'La comparaison reste ouverte : le grec ne précise pas si elle concerne l’apparence, le mouvement ou un autre aspect.'
- source_word: καταβαῖνον
  choice: descendre
  rationale: L’infinitif français dépend naturellement de « il vit » et rend clairement le mouvement exprimé par καταβαίνω.
- source_word: εἰς αὐτόν
  choice: sur lui
  rationale: Avec le mouvement de descente de l’Esprit, « sur lui » est idiomatique en français et correspond vraisemblablement au sens contextuel, tout en signalant en note la possibilité lexicale « en lui ».
theological_decisions:
- issue: Identification de « l’Esprit »
  choice: l’Esprit divin, rendu par « l’Esprit »
  alternative: « le Saint-Esprit »
  rationale: Le contexte baptismal identifie l’Esprit de Dieu, mais la traduction n’ajoute pas « Saint », absent de l’expression grecque τὸ πνεῦμα.
- issue: Portée de la comparaison avec la colombe
  choice: 'comparaison non précisée : « comme une colombe »'
  alternative: « sous la forme d’une colombe » ou « à la manière d’une colombe »
  rationale: ὡς marque une comparaison sans en définir précisément le point ; la traduction conserve cette ambiguïté.
- issue: Sens de εἰς αὐτόν
  choice: « sur lui »
  alternative: « en lui »
  rationale: « Sur lui » convient le mieux à l’image de l’Esprit qui descend et à l’usage contextuel, mais εἰς peut littéralement exprimer un mouvement vers l’intérieur ; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le rythme vif de Marc, le pluriel biblique « les cieux », la force de l’image de la déchirure et les ambiguïtés réelles de la comparaison avec la colombe et de la préposition εἰς.
