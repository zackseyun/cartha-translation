id: MRK.1.24
reference: Mark 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: fr
  text: 'disant : « Que nous veux-tu[a], Jésus le Nazaréen[b] ? Es-tu venu pour nous détruire ? Je sais qui tu es : le Saint de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’avons-nous à faire l’un avec l’autre ? » L’expression grecque, littéralement « quoi à nous et à toi », marque la séparation ou l’hostilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Jésus de Nazareth ». Le grec porte : « Jésus le Nazaréen ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: disant
  rationale: Le participe présent est rendu directement et conserve le lien syntaxique avec le verset précédent.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Que nous veux-tu
  rationale: Cette tournure française naturelle exprime la prise de distance et l’hostilité de l’idiome grec, littéralement « quoi à nous et à toi », sans lui imposer une explication théologique.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jésus le Nazaréen
  rationale: Le vocatif adjectival Ναζαρηνέ est conservé comme désignation, plutôt que remplacé dans le texte par la formulation géographique « Jésus de Nazareth ».
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: Es-tu venu pour nous détruire ?
  rationale: La question française exprime naturellement l’arrivée avec sa portée présente; « détruire » rend directement ἀπολέσαι et le pluriel « nous » est maintenu.
- source_word: οἶδά σε τίς εἶ
  choice: Je sais qui tu es
  rationale: Formulation française directe qui restitue la déclaration de reconnaissance.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: le Saint de Dieu
  rationale: Cette formulation conserve la valeur de titre de l’expression articulée et la relation exprimée par le génitif, sans développer le contenu doctrinal.
theological_decisions:
- issue: Titre christologique prononcé par l’esprit impur
  choice: le Saint de Dieu
  alternative: le Saint qui vient de Dieu
  rationale: La traduction garde la force du titre grec tout en évitant de préciser au-delà du texte la nature exacte du génitif.
translation_notes:
  register: Français international moderne, naturel et digne. « Que nous veux-tu ? » rend l’idiome de confrontation sans lourdeur; la note en préserve la forme et l’ambiguïté. La ponctuation française distingue clairement l’interpellation du titre final.
