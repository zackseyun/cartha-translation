id: MRK.1.35
reference: Mark 1:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: fr
  text: Très tôt le matin, alors qu’il faisait encore nuit, il se leva, sortit et partit pour un endroit désert[a]. Là, il priait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un endroit inhabité » ou « un lieu isolé ». Le grec peut désigner un lieu désert, inhabité ou retiré.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: Très tôt le matin, alors qu’il faisait encore nuit
  rationale: 'Cette formulation française naturelle réunit les trois indications temporelles : πρωῒ situe l’action le matin, λίαν en souligne l’heure très précoce, et ἔννυχα précise qu’il faisait encore nuit.'
- source_word: ἀναστὰς
  choice: il se leva
  rationale: Le participe aoriste exprime une action préalable liée aux verbes principaux. Une proposition coordonnée rend naturellement la succession en français.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe indique qu’il sort du lieu où il se trouvait et reste distinct du mouvement d’éloignement exprimé ensuite par ἀπῆλθεν.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: « Partit » exprime le déplacement au loin après la sortie, tout en préservant les deux étapes de la narration de Marc.
- source_word: εἰς ἔρημον τόπον
  choice: pour un endroit désert
  rationale: ἔρημος décrit ici un lieu inhabité ou isolé. « Endroit désert » conserve ce caractère sans imposer l’idée d’une région désertique au sens géographique.
- source_word: κἀκεῖ
  choice: Là
  rationale: La contraction καὶ ἐκεῖ rattache la prière au lieu atteint. Une nouvelle phrase avec « Là » garde clairement ce lien en français.
- source_word: προσηύχετο
  choice: il priait
  rationale: L’imparfait grec présente la prière comme une action en cours; l’imparfait français en restitue naturellement l’aspect duratif.
theological_decisions:
- issue: Portée narrative de la prière de Jésus
  choice: Décrire simplement Jésus se retirant dans un lieu désert pour prier.
  alternative: Faire ressortir explicitement un modèle de vie spirituelle ou une conclusion christologique.
  rationale: Le grec rapporte l’action sans en formuler l’interprétation doctrinale. La traduction préserve cette sobriété et laisse au contexte le soin d’en éclairer la portée.
translation_notes:
  register: Français international moderne, clair et digne. La succession « se leva, sortit et partit » conserve le rythme narratif ainsi que la distinction entre sortir et s’éloigner. « Alors qu’il faisait encore nuit » est plus idiomatique que le calque « dans la nuit ».
