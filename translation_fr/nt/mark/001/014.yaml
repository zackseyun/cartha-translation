id: MRK.1.14
reference: Mark 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: fr
  text: Après que Jean eut été livré[a], Jésus vint en Galilée, proclamant la bonne nouvelle[b] de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après l’arrestation de Jean ». Le grec dit plus littéralement « après que Jean eut été livré », expression qui fait aussi écho au vocabulaire employé plus loin par Marc dans le récit de la passion.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’Évangile ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « de Dieu » peut désigner la bonne nouvelle qui vient de Dieu, qui lui appartient ou qui a Dieu pour centre.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: Après que … eut été livré
  rationale: La construction avec μετά exprime l’antériorité. « Livré » conserve le sens assez large de παραδίδωμι et son écho avec le vocabulaire employé plus loin dans Marc pour la passion de Jésus, sans préciser explicitement une arrestation.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom Ἰωάννης.
- source_word: ἦλθεν
  choice: vint
  rationale: Rend simplement le mouvement exprimé par ἔρχομαι, sans le préciser comme une arrivée achevée.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: En français, « venir en Galilée » exprime naturellement le déplacement vers cette région tout en évitant le tour moins idiomatique « dans la Galilée ».
- source_word: κηρύσσων
  choice: proclamant
  rationale: κηρύσσω désigne une annonce publique faite à la manière d’un héraut. « Proclamant » garde cette portée sans réduire l’action à une prédication formelle.
- source_word: εὐαγγέλιον
  choice: bonne nouvelle
  rationale: « Bonne nouvelle » rend directement le sens lexical de εὐαγγέλιον dans un français accessible; « Évangile » demeure signalé comme traduction traditionnelle possible.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: 'Le complément du nom reste volontairement ouvert: la bonne nouvelle peut venir de Dieu, lui appartenir ou avoir Dieu pour centre. Une formulation plus précise trancherait une ambiguïté réelle du grec.'
theological_decisions:
- issue: Portée de παραδοθῆναι et lien avec le vocabulaire de la passion dans Marc
  choice: eut été livré
  alternative: eut été arrêté
  rationale: « Livré » maintient le motif narratif de la remise aux mains d’autrui, qui réapparaît dans le récit de la passion, tout en n’ajoutant pas une précision absente du terme grec.
- issue: Valeur du génitif dans τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: la bonne nouvelle de Dieu
  alternative: la bonne nouvelle venant de Dieu / au sujet de Dieu
  rationale: « De Dieu » préserve les diverses relations possibles exprimées par le génitif au lieu de choisir entre l’origine, l’appartenance et le contenu central de la bonne nouvelle.
translation_notes:
  register: Français international actuel, digne et lisible. Le passé simple « vint » et le plus-que-parfait du subjonctif « eut été livré » donnent au récit une tenue littéraire adaptée à une traduction biblique, sans vocabulaire ecclésiastique inutile. Les notes conservent les ambiguïtés lexicales et théologiques du grec.
