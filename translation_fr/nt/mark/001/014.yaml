  source_fidelity: 'Le texte rend fidèlement la structure et les principaux termes du grec : μετά avec l’infinitif aoriste passif est correctement exprimé par « Après que Jean eut été livré »; « vint en Galilée » rend naturellement ἦλθεν εἰς τὴν Γαλιλαίαν; et « proclamant la bonne nouvelle de Dieu » correspond à κηρύσσων τὸ εὐαγγέλιον τοῦ θεοῦ. Le choix de « livré » conserve opportunément la résonance marcienne de παραδίδωμι sans imposer « arrêté ».'
