  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: fr
  text: Le soir venu, une fois le soleil couché, on lui amenait tous les malades et les personnes sous l’emprise de démons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui étaient possédés par des démons ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Le soir venu
  rationale: Le génitif absolu marque une transition temporelle. Cette tournure française est concise, naturelle et conserve la valeur circonstancielle du grec.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: quand le soleil se fut couché
  rationale: « Quand » rend directement ὅτε, tandis que le passé antérieur situe l’achèvement du coucher du soleil par rapport à l’action qui suit, sans expliciter une causalité absente du texte.
- source_word: ἔφερον
  choice: on lui amenait
  rationale: L’imparfait français rend naturellement l’action continue ou répétée exprimée par l’imparfait grec. Le pronom indéfini « on » convient au sujet non exprimé et évite un « ils » sans antécédent clair.
- source_word: πρὸς αὐτὸν
  choice: lui
  rationale: Le pronom conserve la référence implicite à Jésus sans répéter son nom, absent de ce verset grec.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tous les malades
  rationale: L’expression idiomatique désigne ceux qui vont mal physiquement. « Tous les malades » est clair, actuel et conserve la portée globale de πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: les personnes sous l’emprise de démons
  rationale: Cette formulation maintient explicitement la réalité de l’activité démoniaque évoquée par le texte, tout en évitant de préciser davantage que le participe grec la nature exacte de cette emprise.
theological_decisions:
- issue: Rendre δαιμονιζομένους sans supprimer la référence démoniaque ni imposer une théorie détaillée de la possession
  choice: les personnes sous l’emprise de démons
  alternative: ceux qui étaient possédés par des démons
  rationale: Le texte distingue ces personnes des malades et attribue explicitement leur état à des démons. « Sous l’emprise de démons » préserve cette affirmation tout en laissant ouverte l’étendue précise de cette emprise; la formulation traditionnelle est signalée en note.
- issue: Valeur aspectuelle de ἔφερον
  choice: on lui amenait
  alternative: on lui amena
  rationale: L’imparfait grec présente l’arrivée des personnes comme une action en cours ou répétée. L’imparfait français garde ce relief narratif sans lourdeur.
translation_notes:
  register: Français international moderne, digne et accessible. « Le soir venu » donne un rythme narratif naturel; « on lui amenait » évite un sujet pronominal ambigu; « personnes » maintient une désignation respectueuse tout en conservant le parallélisme des deux groupes.
