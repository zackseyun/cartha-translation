reference: Mark 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: fr
  text: En ces jours-là, Jésus vint de Nazareth, en Galilée, et il fut baptisé dans le Jourdain par Jean.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition grecque peut aussi souligner l’entrée dans le Jourdain.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις
  choice: En ces jours-là
  rationale: L’idiome narratif hébraïsant introduit ici un nouvel épisode. En français moderne, « En ces jours-là » en conserve la valeur temporelle et le ton narratif sans reproduire lourdement « et il arriva ».
- source_word: ἦλθεν Ἰησοῦς
  choice: Jésus vint
  rationale: Rend directement le verbe de mouvement et maintient un registre narratif digne et naturel.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: de Nazareth, en Galilée
  rationale: La virgule et « en Galilée » identifient naturellement la situation géographique de Nazareth en français, sans donner l’impression que la ville appartient administrativement à la Galilée au sens moderne.
- source_word: ἐβαπτίσθη
  choice: il fut baptisé
  rationale: Le passif est conservé. « Baptisé » est le terme français courant et fidèle, tandis que « immergé » imposerait une précision confessionnellement sensible que le contexte immédiat n’exige pas.
- source_word: εἰς τὸν Ἰορδάνην
  choice: dans le Jourdain
  rationale: « Dans » exprime naturellement en français le lieu du baptême. La valeur directionnelle possible de εἰς est signalée en note afin de préserver l’ambiguïté lexicale.
- source_word: ὑπὸ Ἰωάννου
  choice: par Jean
  rationale: Ὑπό avec le génitif indique l’agent du passif; « par Jean » en est l’équivalent direct.
theological_decisions:
- issue: Traduction de βαπτίζω dans un contexte de sensibilité confessionnelle
  choice: il fut baptisé
  alternative: il fut immergé
  rationale: « Baptisé » rapporte l’événement sans trancher davantage que le texte sur le mode rituel; « immergé » pourrait importer une précision confessionnelle.
- issue: Valeur de εἰς avec le Jourdain
  choice: dans le Jourdain
  alternative: dans les eaux du Jourdain / jusque dans le Jourdain
  rationale: La traduction principale privilégie l’expression française naturelle du lieu de l’acte, tandis que la note conserve la possibilité d’une nuance directionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit sans être archaïque. La formule grecque Καὶ ἐγένετο n’est pas calquée, car « Et il arriva » serait plus marqué et moins naturel; sa fonction narrative est portée par « En ces jours-là ».
