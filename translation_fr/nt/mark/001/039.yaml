source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: fr
  text: Et il parcourut toute la Galilée[a], prêchant dans leurs synagogues et chassant les démons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il vint, prêchant dans leurs synagogues par toute la Galilée et chassant les démons. » Le verbe grec peut être traduit par « vint », mais, dans ce contexte, il décrit probablement un déplacement itinérant à travers la région.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: ἦλθεν
  choice: il parcourut
  rationale: Bien que l’aoriste de ἔρχομαι puisse se traduire par « il vint » ou « il alla », le contexte et l’indication régionale décrivent ici un déplacement itinérant. « Il parcourut » exprime naturellement ce mouvement sans en préciser indûment les étapes.
- source_word: κηρύσσων
  choice: prêchant
  rationale: Le participe désigne une proclamation publique. « Prêchant » convient naturellement à l’activité exercée dans les synagogues et garde la portée religieuse du contexte.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: dans leurs synagogues
  rationale: Même si εἰς exprime souvent l’entrée ou la direction, il indique ici naturellement le lieu où se déroule la proclamation. Le possessif αὐτῶν est conservé par « leurs ».
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: toute la Galilée
  rationale: Avec le verbe « parcourut », l’expression rend l’étendue régionale du déplacement et conserve la force de ὅλην.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: « Démons » est l’équivalent direct du terme grec. L’article défini est conservé de manière naturelle en français dans l’expression « chasser les démons ».
- source_word: ἐκβάλλων
  choice: chassant
  rationale: Dans un contexte d’exorcisme, ἐκβάλλω signifie expulser ou chasser. « Chasser les démons » est une expression française claire, courante et digne.
theological_decisions:
- issue: Nature de τὰ δαιμόνια
  choice: « les démons », compris dans le sens ordinaire d’êtres spirituels personnels
  alternative: « les esprits mauvais »
  rationale: Le terme grec désigne directement des démons et le récit présente Jésus comme exerçant son autorité sur eux. Cette traduction n’ajoute aucune précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Il parcourut » rend idiomatiquement le mouvement à travers la Galilée; la note préserve l’autre lecture possible de ἦλθεν et l’ambiguïté de la construction grecque.
