id: MRK.1.5
reference: Mark 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: fr
  text: Toute la région de Judée et tous les habitants de Jérusalem venaient à lui, et ils étaient baptisés par lui dans le Jourdain, en confessant leurs péchés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: venaient à lui
  rationale: L’imparfait exprime un mouvement continu ou répété. En français, « venaient à lui » rend naturellement l’idée de sortir de chez soi ou de sa région pour se rendre auprès de Jean, sans alourdir la phrase avec « sortaient pour aller ».
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: Toute la région de Judée
  rationale: χώρα désigne ici une région ou un territoire. « Région de Judée » est naturel en français moderne et conserve la portée rhétorique de πᾶσα.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: tous les habitants de Jérusalem
  rationale: Ἱεροσολυμῖται désigne les habitants de Jérusalem. Cette formulation est plus courante et transparente que « les Hiérosolymites » et maintient πάντες.
- source_word: ἐβαπτίζοντο
  choice: se faisaient baptiser
  rationale: Cette tournure française rend le sens passif et l’aspect répété de l’imparfait tout en indiquant clairement que les personnes recevaient le baptême.
- source_word: ὑπ’ αὐτοῦ
  choice: par lui
  rationale: Le pronom grec est conservé plutôt que remplacé explicitement par « Jean », dont l’identité ressort du contexte.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: dans le Jourdain
  rationale: En français, le nom propre « le Jourdain » désigne normalement le fleuve; ajouter « fleuve » serait possible mais moins fluide ici. La préposition « dans » conserve ἐν sans préciser davantage le mode du baptême.
- source_word: ἐξομολογούμενοι
  choice: en confessant
  rationale: Le participe présent exprime une action accompagnant le baptême. « En confessant » rend clairement ce lien circonstanciel sans déterminer plus précisément sa chronologie.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: leurs péchés
  rationale: Traduction directe et idiomatique de l’objet accusatif accompagné du possessif.
theological_decisions:
- issue: Portée de « tout » dans les descriptions de la Judée et de Jérusalem
  choice: Conserver « toute » et « tous » comme généralisations collectives
  alternative: Atténuer en traduisant « beaucoup de gens de Judée et de Jérusalem »
  rationale: Le grec emploie πᾶσα et πάντες; leur force rhétorique doit être maintenue sans imposer une universalité mathématique étrangère à l’usage narratif.
- issue: Nature et mode du baptême
  choice: Employer « baptiser » sans préciser le mode ni la portée théologique
  alternative: Traduire par « immerger » ou « laver »
  rationale: Le verset rapporte le baptême sans en expliciter ici le mode ni toute la signification théologique. Le terme traditionnel et transparent évite une interprétation confessionnelle ajoutée.
- issue: Rapport entre confession des péchés et baptême
  choice: Rendre le participe par « en confessant », sans préciser davantage l’ordre ou la causalité
  alternative: Interpréter « après avoir confessé » ou « parce qu’ils confessaient »
  rationale: Le participe présent décrit une action concomitante, mais ne tranche pas explicitement entre stricte simultanéité, antériorité immédiate ou relation causale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque longue est divisée en deux phrases pour une lecture naturelle. Les imparfaits français conservent la scène progressive et répétée; aucune note n’est nécessaire.
