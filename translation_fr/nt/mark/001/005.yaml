  terminology: « Région de Judée », « habitants de Jérusalem », « baptisés », « le Jourdain », et « confesser leurs péchés » sont exacts, naturels et théologiquement non interprétatifs. Aucun ajout concernant le mode ou la signification du baptême n’est introduit.
