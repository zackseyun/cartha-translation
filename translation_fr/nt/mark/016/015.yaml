source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: fr
  text: 'Et il leur dit : « Allez dans le monde entier et proclamez la Bonne Nouvelle[b] à toute la création[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à chaque créature ». L’expression grecque peut se comprendre collectivement ou distributivement.
    reason: alternative_reading
  - marker: b
    text: Ou « l’Évangile ». Le mot grec εὐαγγέλιον signifie littéralement « bonne nouvelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Allez
  rationale: Le participe aoriste précédant l’impératif principal a ici une valeur de circonstance accompagnante. En français naturel, l’impératif « Allez » rend mieux la force de l’envoi que le littéral « Étant partis ».
- source_word: κόσμον ἅπαντα
  choice: le monde entier
  rationale: κόσμος désigne ici le monde comme champ de la mission, et ἅπαντα en souligne la totalité. « Le monde entier » est idiomatique et conserve cette portée universelle.
- source_word: κηρύξατε
  choice: proclamez
  rationale: κηρύσσω exprime l’annonce publique faite avec autorité. « Proclamez » garde cette nuance tout en restant clair en français moderne.
- source_word: τὸ εὐαγγέλιον
  choice: la Bonne Nouvelle
  rationale: εὐαγγέλιον signifie littéralement « bonne nouvelle ». Cette formulation communique directement le sens en français courant, tandis que « l’Évangile » reste une traduction traditionnelle possible.
- source_word: πάσῃ τῇ κτίσει
  choice: à toute la création
  rationale: κτίσις peut désigner la création ou une créature. « À toute la création » préserve l’ampleur et la possible portée collective ou cosmique de l’expression grecque sans la réduire d’emblée aux seuls individus humains.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Traduction directe et naturelle de l’introduction narrative, sans ajouter la nuance plus forte que pourrait suggérer « il leur ordonna ».
theological_decisions:
- issue: Portée de πάσῃ τῇ κτίσει dans l’ordre de mission
  choice: à toute la création
  alternative: à chaque créature
  rationale: Le grec permet une compréhension collective ou cosmique (« toute la création ») ainsi qu’une compréhension distributive (« chaque créature »). Le texte principal conserve l’horizon le plus large sans trancher silencieusement l’ambiguïté; l’autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Bonne Nouvelle » est employé comme désignation reconnue du message annoncé. L’ordre des appels de note suit les expressions auxquelles ils se rapportent dans le texte français.
