  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: fr
  text: Quand ils entendirent qu’il était vivant[a] et qu’elle l’avait vu[b], ils ne crurent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il est vivant » ou « il vit ». Le grec emploie un verbe au présent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il fut vu par elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: ils
  rationale: Le pronom renvoie au groupe mentionné juste auparavant. En français, la continuité portée par καί est naturellement intégrée à l’enchaînement narratif sans ajouter un « et » initial lourd.
- source_word: ἀκούσαντες
  choice: Quand ils entendirent
  rationale: Le participe aoriste a ici une valeur temporelle; cette tournure claire préserve la succession des événements.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit simplement le contenu de ce qu’ils ont entendu.
- source_word: ζῇ
  choice: il était vivant
  rationale: L’imparfait français s’accorde naturellement avec le verbe principal au passé dans le discours rapporté, tandis que « vivant » exprime l’état de vie attesté par le présent grec.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne les deux éléments du témoignage entendu.
- source_word: ἐθεάθη ὑπ’ αὐτῆς
  choice: elle l’avait vu
  rationale: Le plus-que-parfait actif est une transformation française naturelle du passif grec « avait été vu par elle »; il maintient l’antériorité de la rencontre sans imposer le sens plus interprétatif « lui était apparu ».
- source_word: ἠπίστησαν
  choice: ils ne crurent pas
  rationale: Cette formulation directe rend le refus ou l’absence de foi envers le témoignage sans renforcer indûment l’idée de refus volontaire.
theological_decisions:
- issue: Expression de la vie de Jésus ressuscité dans le discours rapporté
  choice: il était vivant
  alternative: il est vivant / il vit
  rationale: Le présent grec ζῇ présente Jésus comme vivant. La concordance française des temps rend « il était vivant » naturelle après « entendirent », sans suggérer que cette vie aurait ensuite cessé; la note conserve explicitement les rendus au présent.
- issue: Description de la rencontre avec Marie
  choice: elle l’avait vu
  alternative: il avait été vu par elle / il lui était apparu
  rationale: 'La formulation choisie rend idiomatiquement le passif de θεάομαι tout en conservant le point essentiel: elle l’a vu. « Apparu » est possible dans le contexte, mais ajouterait une nuance de manifestation que la forme grecque n’impose pas à elle seule.'
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique soutenu sans être archaïque; la voix active dans « elle l’avait vu » évite un passif peu naturel en français.
