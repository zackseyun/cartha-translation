  naturalness: Le français est moderne, fluide et adapté à une lecture publique. « Être à table » transmet naturellement le cadre du repas; la note a conserve utilement la posture de repas exprimée par ἀνακειμένοις. La formulation littérale actuelle de la note b (« l’avaient vu ayant été ressuscité ») est maladroite et peut sembler rattacher le participe au sujet plutôt qu’à Jésus.
