id: MRK.16.14
reference: Mark 16:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: fr
  text: Plus tard, il se manifesta aux onze eux-mêmes pendant qu’ils étaient à table[a]. Il leur reprocha leur incrédulité et leur dureté de cœur, parce qu’ils n’avaient pas cru ceux qui l’avaient vu ressuscité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement qu’ils étaient allongés, posture habituelle pour prendre un repas.
    reason: cultural_note
  - marker: b
    text: 'Ou « ceux qui l’avaient vu après qu’il avait été ressuscité ». Le grec emploie ici un participe parfait passif : littéralement, « ceux qui l’avaient vu, lui ayant été ressuscité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Plus tard
  rationale: Rend simplement l’adverbe temporel qui situe cette manifestation après les précédentes, dans un français moderne et naturel.
- source_word: ἀνακειμένοις
  choice: pendant qu’ils étaient à table
  rationale: Le verbe évoque la posture allongée adoptée lors des repas. La formulation française exprime naturellement la situation, tandis qu’une note conserve le détail culturel.
- source_word: αὐτοῖς τοῖς ἕνδεκα
  choice: aux onze eux-mêmes
  rationale: « Aux onze » désigne le groupe apostolique après la perte de Judas; « eux-mêmes » garde la légère insistance apportée par αὐτοῖς.
- source_word: ἐφανερώθη
  choice: il se manifesta
  rationale: Le passif grec indique qu’il devint visible ou se fit voir. « Se manifesta » convient au contexte des apparitions après la résurrection tout en restant proche de la forme grecque.
- source_word: ὠνείδισεν
  choice: il leur reprocha
  rationale: Exprime une réprimande verbale nette dans un français courant et digne.
- source_word: ἀπιστίαν
  choice: incrédulité
  rationale: Désigne ici le refus ou l’échec de croire le témoignage reçu; le terme français garde cette force directe.
- source_word: σκληροκαρδίαν
  choice: dureté de cœur
  rationale: Conserve la métaphore biblique d’une disposition intérieure résistante, plutôt que de la réduire à la seule obstination.
- source_word: θεασαμένοις
  choice: ceux qui l’avaient vu
  rationale: Rend clairement le témoignage oculaire exprimé par le participe grec.
- source_word: ἐγηγερμένον
  choice: ressuscité
  rationale: Le participe parfait passif décrit Jésus dans son état de ressuscité. La formulation française est naturelle; la note précise la forme passive du grec.
- source_word: οὐκ ἐπίστευσαν
  choice: ils n’avaient pas cru
  rationale: Le plus-que-parfait situe naturellement leur refus de croire avant cette manifestation et s’accorde avec la proposition causale.
theological_decisions:
- issue: Valeur passive de ἐγηγερμένον dans l’énoncé de la résurrection
  choice: ceux qui l’avaient vu ressuscité
  alternative: ceux qui l’avaient vu après qu’il avait été ressuscité
  rationale: La formulation principale est idiomatique et garde l’état résultant exprimé par le parfait. La note signale que le grec emploie littéralement un participe passif, sans préciser dans le texte principal l’agent de la résurrection.
- issue: Portée de σκληροκαρδία
  choice: dureté de cœur
  alternative: obstination
  rationale: La métaphore est maintenue afin de préserver sa résonance biblique et la dimension intérieure de la résistance, sans l’aplatir en simple entêtement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide pour la lecture publique. Les métaphores bibliques significatives sont conservées, tandis que les précisions culturelles ou grammaticales moins naturelles en français sont données en notes.
