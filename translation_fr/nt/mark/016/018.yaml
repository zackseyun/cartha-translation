  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: fr
  text: Ils prendront des serpents[a] ; et s’ils boivent quelque chose de mortel, cela ne leur fera absolument aucun mal. Ils poseront les mains sur les malades, et ceux-ci se porteront bien.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits anciens ne contiennent pas Marc 16.9-20 ; ce verset appartient à la finale longue de Marc.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « ils iront bien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: serpents
  rationale: « Serpents » est le terme français courant et précis pour les animaux désignés ici ; il reste naturel en français moderne.
- source_word: ἀροῦσιν
  choice: prendront
  rationale: Le verbe αἴρω peut signifier prendre, soulever ou ramasser. « Prendront » conserve cette amplitude sans préciser inutilement la manière de les manipuler.
- source_word: κἂν
  choice: même s’ils
  rationale: La contraction καὶ ἐάν introduit ici une éventualité à valeur concessive. « Même si » rend naturellement cette nuance en français.
- source_word: θανάσιμόν τι
  choice: quelque chose de mortel
  rationale: 'Cette formulation garde le sens large de l’expression grecque : toute substance susceptible de causer la mort, sans la limiter explicitement à un poison.'
- source_word: οὐ μὴ αὐτοὺς βλάψῃ
  choice: cela ne leur fera absolument aucun mal
  rationale: La double négation οὐ μή est fortement emphatique. « Absolument aucun mal » en restitue la force tout en restant idiomatique.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: ils poseront les mains sur les malades
  rationale: Cette formulation rend directement le geste décrit et conserve l’expression biblique intelligible en français contemporain.
- source_word: καλῶς ἕξουσιν
  choice: ceux-ci se porteront bien
  rationale: L’expression signifie littéralement « ils seront dans un bon état » ou « ils se porteront bien ». La reprise « ceux-ci » identifie naturellement les malades comme bénéficiaires sans imposer le terme plus spécifique de guérison.
theological_decisions:
- issue: Nature des protections et des rétablissements promis
  choice: Présenter simplement les actes et leurs résultats comme des signes annoncés, sans préciser s’ils sont universels, normatifs, symboliques ou limités à une époque.
  alternative: Les comprendre soit comme normatifs pour tous les croyants de toute époque, soit comme limités à l’époque apostolique, soit comme purement symboliques.
  rationale: Le grec énonce directement des actions futures et leurs résultats. La traduction ne doit pas trancher un débat théologique que le verset lui-même ne formule pas.
- issue: Statut textuel de Marc 16.9-20
  choice: Traduire le verset fourni et signaler en note qu’il appartient à la finale longue absente de certains manuscrits anciens.
  alternative: Omettre le verset ou le mettre entre crochets dans le texte principal.
  rationale: Le texte grec fourni contient ce verset, mais son statut dans la tradition manuscrite est suffisamment important pour exiger une note transparente.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite à la fois l’archaïsme et l’explication doctrinale ajoutée. La ponctuation distingue nettement les deux signes décrits.
