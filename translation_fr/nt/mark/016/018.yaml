    text: Certains manuscrits anciens ne contiennent pas Marc 16.9-20 ; ce verset appartient à la finale longue de Marc.
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « ils iront bien ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace la concession explicite « même s’ils » par la condition coordonnée « et s’ils », plus proche de καὶ ἐάν et moins interprétative. Elle simplifie la note lexicale sur καλῶς ἕξουσιν, tout en conservant dans le texte l’équivalent français naturel « se porteront bien ».
