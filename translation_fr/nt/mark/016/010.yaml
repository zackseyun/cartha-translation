  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: fr
  text: Elle alla l’annoncer à ceux qui avaient été avec lui, qui étaient dans le deuil et pleuraient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: Elle
  rationale: Le démonstratif renvoie à Marie de Magdala au verset précédent. En français courant, le pronom « elle » exprime naturellement cette reprise sans la lourdeur de « celle-ci ».
- source_word: πορευθεῖσα
  choice: alla
  rationale: Le participe aoriste marque une action préalable ou étroitement liée au verbe principal. La tournure « alla l’annoncer » rend avec naturel le déplacement suivi de l’annonce.
- source_word: ἀπήγγειλεν
  choice: l’annoncer
  rationale: Le verbe signifie transmettre ou annoncer une nouvelle. Le pronom « l’ » reprend implicitement, comme en grec, l’apparition et la nouvelle qui ressortent du contexte.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: à ceux qui avaient été avec lui
  rationale: Cette formulation conserve l’expression relationnelle du grec sans la réduire au terme plus interprétatif « disciples » ou « compagnons ».
- source_word: πενθοῦσι
  choice: qui étaient dans le deuil
  rationale: πενθέω désigne le deuil et l’affliction liés à une perte, ici à la mort de Jésus.
- source_word: καὶ κλαίουσιν
  choice: et pleuraient
  rationale: κλαίω désigne l’action de pleurer. L’imparfait rend l’état en cours décrit par le participe présent.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la répétition expressive entre le deuil et les pleurs, ainsi que la relative qui rattache ces deux états aux personnes ayant été avec Jésus.
