source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: fr
  text: Lorsqu’elles entrèrent dans le tombeau, elles virent un jeune homme[a] assis à droite, vêtu d’une robe blanche, et elles furent saisies de stupeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un ange ». Marc le décrit ici comme « un jeune homme » ; le contexte plus large et les récits parallèles indiquent toutefois qu’il s’agit d’un messager angélique.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: En entrant
  rationale: Le participe aoriste féminin pluriel se rapporte aux femmes mentionnées dans le contexte. La tournure française exprime naturellement l’action antérieure ou concomitante sans alourdir la phrase.
- source_word: μνημεῖον
  choice: tombeau
  rationale: Dans ce contexte funéraire et résurrectionnel, « tombeau » désigne clairement le lieu où Jésus avait été déposé.
- source_word: νεανίσκον
  choice: un jeune homme
  rationale: Le terme grec désigne explicitement un jeune homme; la traduction conserve la description propre à Marc sans l’identifier directement comme un ange.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: assis à droite
  rationale: Cette formulation française concise restitue la posture et la position du jeune homme dans le tombeau.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: vêtu d’une robe blanche
  rationale: Le participe parfait décrit son état vestimentaire, et στολή désigne ici un vêtement ample ou une robe.
- source_word: ἐξεθαμβήθησαν
  choice: elles furent saisies de stupeur
  rationale: Le verbe exprime un bouleversement intense mêlant saisissement et effroi; « saisies de stupeur » garde cette force mieux qu’un simple « étonnées » sans aller jusqu’à imposer la terreur.
theological_decisions:
- issue: Identité du νεανίσκος
  choice: Le décrire comme « un jeune homme » dans le texte principal.
  alternative: L’identifier comme « un ange ».
  rationale: Même si le vêtement blanc, la fonction de messager et les récits parallèles indiquent une figure angélique, Marc emploie ici le terme descriptif νεανίσκος. La traduction préserve donc sa formulation et laisse l’identification au contexte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit; « saisies de stupeur » conserve l’intensité du grec sans surinterpréter l’émotion.
