  text: καὶ λίαν πρωῒ ⸂τῇ μιᾷ τῶν⸃ σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: fr
  text: Et, de très bon matin, le premier jour de la semaine[a], elles arrivent au tombeau, une fois le soleil levé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le premier des sabbats » ; expression idiomatique signifiant « le premier jour de la semaine ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « après le lever du soleil » ; le grec indique la circonstance temporelle de leur arrivée, le lever étant présenté comme accompli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: de très bon matin
  rationale: Cette expression française naturelle rend l’intensification de πρωῒ par λίαν et situe clairement la scène tôt le matin.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: le premier jour de la semaine
  rationale: La formulation grecque est un idiome sémitique et koinè qui désigne le jour suivant le sabbat, c’est-à-dire le premier jour de la semaine.
- source_word: ἔρχονται
  choice: elles arrivent
  rationale: Le présent historique de Marc est conservé pour maintenir la vivacité du récit. Le sujet féminin ressort du contexte immédiat (les femmes de 16.1). « Arrivent » convient naturellement au mouvement vers une destination.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: au tombeau
  rationale: Dans ce contexte funéraire, μνημεῖον désigne naturellement un tombeau; ἐπί avec l’accusatif exprime ici le mouvement vers ce lieu.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: alors que le soleil vient de se lever
  rationale: Le génitif absolu indique la circonstance temporelle de leur arrivée. Cette formulation préserve le lien temporel et l’antériorité immédiate du lever du soleil sans imposer un « après » trop appuyé.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique propre au récit de Marc est maintenu. « De très bon matin » évite la lourdeur de « très tôt le matin », tandis que « alors que le soleil vient de se lever » rend clairement le génitif absolu.
