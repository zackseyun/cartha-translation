source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: fr
  text: Elles sortirent et s’enfuirent du tombeau[a], car le tremblement et la stupéfaction les avaient saisies. Elles ne dirent rien à personne, car elles avaient peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ajoutent ce qu’on appelle la finale courte : « Elles rapportèrent brièvement à ceux qui entouraient Pierre tout ce qui leur avait été ordonné. Après cela, Jésus lui-même envoya aussi par leur intermédiaire, de l’orient jusqu’à l’occident, la proclamation sacrée et impérissable du salut éternel. Amen. »'
    reason: 'Variante textuelle : cette finale supplémentaire est placée entre doubles crochets dans le SBLGNT et n’appartient pas au texte principal retenu.'
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: Elles sortirent
  rationale: Le participe aoriste féminin pluriel renvoie aux femmes et marque une action antérieure ou étroitement liée à leur fuite. La coordination française rend naturellement cette succession sans l’alourdir.
- source_word: ἔφυγον ἀπὸ τοῦ μνημείου
  choice: s’enfuirent du tombeau
  rationale: « S’enfuirent » conserve la force de φεύγω, tandis que « du tombeau » exprime idiomatiquement l’éloignement indiqué par ἀπό.
- source_word: τρόμος
  choice: le tremblement
  rationale: Le terme évoque concrètement le fait de trembler et reste distinct de la peur explicitement mentionnée à la fin.
- source_word: ἔκστασις
  choice: la stupéfaction
  rationale: Dans ce contexte, le mot décrit un état de saisissement où l’on est comme hors de soi. « Stupéfaction » évite le sens moderne trompeur d’« extase ».
- source_word: εἶχεν αὐτὰς
  choice: les avaient saisies
  rationale: Cette tournure restitue naturellement l’expression grecque selon laquelle le tremblement et la stupéfaction avaient pris possession d’elles.
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: Elles ne dirent rien à personne
  rationale: La formulation française conserve clairement la négation universelle emphatique du grec.
- source_word: ἐφοβοῦντο γάρ
  choice: car elles avaient peur
  rationale: L’imparfait exprime leur état persistant. Le maintien de « car » respecte la conclusion explicative et abrupte du texte grec.
theological_decisions:
- issue: Traitement de la finale courte placée entre doubles crochets après Marc 16.8
  choice: Ne pas intégrer la finale courte au corps du verset, mais la reproduire intégralement en note comme variante textuelle.
  alternative: Intégrer la finale courte dans le texte principal ou imprimer plusieurs finales dans le corps du texte.
  rationale: Les doubles crochets du SBLGNT signalent que ce passage est considéré comme une addition secondaire. La note préserve néanmoins cette donnée manuscrite importante sans la présenter comme le texte principal du verset.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « car » et la brusque conclusion sur la peur sont conservées afin de ne pas lisser la tension narrative propre au grec.
