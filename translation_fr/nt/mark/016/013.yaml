  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: fr
  text: Ils partirent et rapportèrent cela aux autres, mais les autres non plus ne les crurent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Ils… donc
  rationale: Le composé καί + ἐκεῖνοι reprend les deux disciples du contexte avec une valeur de continuation ou d’ajout. En français, le pronom « ils » évite d’ajouter « hommes », absent du grec, tandis que « donc » marque naturellement l’enchaînement du récit.
- source_word: ἀπελθόντες
  choice: partirent
  rationale: Le participe aoriste exprime une action antérieure ou étroitement liée au verbe principal. La coordination française « partirent… rapporter » restitue naturellement le déplacement et son but dans ce contexte.
- source_word: ἀπήγγειλαν
  choice: rapporter
  rationale: Le verbe signifie annoncer ou transmettre une nouvelle. « Rapporter cela » convient à la transmission de ce qu’ils venaient de vivre, l’objet « cela » étant explicité d’après le contexte.
- source_word: τοῖς λοιποῖς
  choice: aux autres
  rationale: Le substantif adjectival désigne les autres membres du groupe, ceux qui restent. « Aux autres » est clair et naturel; « au reste du groupe » constitue une autre explicitation possible.
- source_word: οὐδὲ
  choice: mais… non plus
  rationale: Dans la continuité du récit, οὐδέ indique que les autres disciples ne crurent pas davantage ce nouveau témoignage. « Mais… non plus » rend à la fois le contraste et la valeur additive.
- source_word: ἐκείνοις
  choice: les
  rationale: Le datif renvoie aux deux disciples qui viennent de faire leur rapport. Avec « croire quelqu’un » en français, le pronom objet direct « les » est idiomatique.
- source_word: ἐπίστευσαν
  choice: ne… crurent pas
  rationale: Ici, πιστεύω concerne l’acceptation d’un témoignage. « Ne les crurent pas » exprime précisément qu’ils n’ajoutèrent pas foi à leur récit, sans introduire la nuance différente de confiance personnelle.
theological_decisions:
- issue: Sens de πιστεύω dans un contexte de témoignage narratif
  choice: ne les crurent pas
  alternative: ne leur firent pas confiance
  rationale: Le contexte porte sur le refus d’accepter le témoignage des deux disciples. « Croire quelqu’un » conserve ce sens immédiat, tandis que « faire confiance » déplacerait l’accent vers une relation personnelle.
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la concision du grec et l’enchaînement narratif, sans préciser explicitement « les hommes » ni « les disciples », éléments seulement déductibles du contexte.
