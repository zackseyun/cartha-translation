review_pass:
  verdict: revise
  source_fidelity: Le « donc » n’est pas soutenu par κἀκεῖνοι (« et ceux-là / eux aussi »), qui exprime une continuation ou addition, non une conséquence. Le grec présente le départ, puis le rapport; « partirent donc rapporter » transforme facilement le départ en déplacement finalisé en vue du rapport.
  naturalness: « Ils partirent et rapportèrent cela aux autres » est naturel en français moderne. La reprise explicite « les autres » dans la seconde proposition clarifie le changement de référent et évite l’ambiguïté possible de « eux ».
  terminology: « Rapportèrent », « aux autres » et « ne les crurent pas » rendent justement le témoignage rapporté, τοῖς λοιποῖς et πιστεύω avec un complément de personne. Aucun terme théologique spécialisé n’est en jeu.
  issues:
  - severity: medium
    issue: « donc » ajoute une relation de conséquence absente du grec.
    rationale: κἀκεῖνοι est la contraction de καὶ ἐκεῖνοι et signifie « et ceux-là / eux aussi »; il ne justifie pas un inférentiel « donc ».
  - severity: medium
    issue: « partirent donc rapporter » peut présenter le rapport comme le but du départ.
    rationale: 'ἀπελθόντες est un participe aoriste suivi de ἀπήγγειλαν : les deux actions sont à conserver sans introduire une construction finale.'
  - severity: low
    issue: La note a est inutile et son alternative ajoute « du groupe ».
    rationale: Le texte principal rend déjà τοῖς λοιποῖς par « aux autres ». « Du groupe » est une explicitation contextuelle qui n’est pas nécessaire dans une alternative lexicale.
  revised_text: Ils partirent et rapportèrent cela aux autres, mais les autres non plus ne les crurent pas.
  revised_footnotes: []
  revision_rationale: La révision retire l’inférence « donc », restitue les deux actions coordonnées sans nuance de finalité, et rend explicite dans la seconde proposition le référent de « les autres ». La note redondante est supprimée avec son ancre.
