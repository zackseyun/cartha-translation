id: MRK.16.19
reference: Mark 16:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: fr
  text: Ainsi donc, le Seigneur Jésus, après leur avoir parlé, fut enlevé au ciel et s’assit à la droite de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Ainsi donc
  rationale: Cette combinaison de particules marque à la fois une transition et une conclusion. « Ainsi donc » en restitue naturellement la valeur récapitulative et consécutive.
- source_word: κύριος Ἰησοῦς
  choice: le Seigneur Jésus
  rationale: « Seigneur » conserve le poids du titre κύριος dans son emploi christologique, tandis que l’article grec est rendu naturellement en français.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: après leur avoir parlé
  rationale: La construction μετά suivie de l’infinitif substantivé exprime l’antériorité. Cette formulation française est concise, naturelle et conserve le complément αὐτοῖς.
- source_word: ἀνελήμφθη
  choice: fut enlevé
  rationale: Le passif aoriste est maintenu, sans préciser l’agent que le texte laisse implicite. Le français « fut enlevé » exprime clairement le mouvement ascendant avec la destination qui suit.
- source_word: εἰς τὸν οὐρανόν
  choice: au ciel
  rationale: « Au ciel » est l’expression idiomatique française pour la destination indiquée par εἰς avec l’accusatif; « dans le ciel » risquerait ici d’évoquer seulement l’espace visible.
- source_word: ἐκάθισεν
  choice: s’assit
  rationale: Le passé simple exprime naturellement, dans un registre narratif digne, l’action ponctuelle de prendre place en position assise.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: à la droite de Dieu
  rationale: L’expression grecque est idiomatique et désigne une position auprès de la droite de Dieu. La locution biblique française consacrée en conserve le sens sans traduire littéralement ἐκ.
theological_decisions:
- issue: Langage de l’ascension et de l’exaltation
  choice: fut enlevé au ciel et s’assit à la droite de Dieu
  alternative: fut reçu au ciel et prit place à la droite de Dieu
  rationale: La formulation retenue affirme directement ce que dit le grec tout en conservant le passif de l’ascension et l’image biblique de la droite de Dieu, sans ajouter d’explication doctrinale.
- issue: κύριος comme titre christologique
  choice: le Seigneur Jésus
  alternative: le maître Jésus
  rationale: « Seigneur » préserve la portée théologique et l’usage néotestamentaire normal de κύριος; « maître » réduirait ici la force possible du titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit sans archaïsme marqué. Aucun marqueur de note n’est requis.
