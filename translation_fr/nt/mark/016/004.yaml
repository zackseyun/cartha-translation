review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement le geste de lever les yeux, la perception visuelle, la taille exceptionnelle de la pierre et la valeur explicative de γάρ. Toutefois, avec le présent narratif « elles voient », le plus-que-parfait français rend plus nettement le fait accompli antérieur que marque le parfait passif ἀποκεκύλισται.
  naturalness: « Roulée de côté » est compréhensible, mais « avait été roulée » est plus idiomatique dans ce contexte funéraire et évite une formulation directionnelle un peu lourde. Le point-virgule convient pour introduire l’explication.
  terminology: « Pierre », « extrêmement grande » et « en effet » sont appropriés. La note doit correspondre au plus-que-parfait retenu et expliquer le parfait grec sans imposer une nuance supplémentaire.
  issues:
  - severity: low
    issue: Temps français de ἀποκεκύλισται
    rationale: « A été roulée » est possible, mais « avait été roulée » situe plus clairement l’action comme déjà accomplie au moment où les femmes la voient, en harmonie avec le parfait grec et le présent narratif « elles voient ».
  - severity: low
    issue: Formulation « roulée de côté »
    rationale: Cette expression n’est pas fautive, mais elle est moins naturelle que « avait été roulée » dans le contexte où la pierre qui fermait le tombeau est déjà identifiée. Le déplacement hors de sa position de fermeture est suffisamment porté par le contexte.
  revised_text: Et, levant les yeux, elles voient que la pierre avait été roulée ; elle était en effet extrêmement grande.
  revised_footnotes:
  - marker: a
    text: 'Ou : « elles constatent que la pierre se trouvait déjà roulée ». Le parfait grec souligne que la pierre était déjà dans cet état lorsqu’elles l’ont vue.'
    reason: alternative lexicale et aspect verbal
  revision_rationale: Le plus-que-parfait « avait été roulée » exprime naturellement, en français, l’antériorité et l’état résultant du parfait passif grec au point où les femmes regardent. La suppression de « de côté » améliore l’idiomaticité sans perdre le sens contextuel de la pierre déplacée. La note est ajustée pour correspondre au temps retenu.
