- from: Et, levant les yeux, elles voient que la pierre a été roulée de côté[a] ; elle était en effet extrêmement grande.
  to: Et, levant les yeux, elles voient que la pierre avait été roulée ; elle était en effet extrêmement grande.
  rationale: Le plus-que-parfait « avait été roulée » exprime naturellement, en français, l’antériorité et l’état résultant du parfait passif grec au point où les femmes regardent. La suppression de « de côté » améliore l’idiomaticité sans perdre le sens contextuel de la pierre déplacée. La note est ajustée pour correspondre au temps retenu.
