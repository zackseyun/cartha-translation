  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: fr
  text: Et, levant les yeux, elles voient que la pierre avait été roulée ; elle était en effet extrêmement grande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: levant les yeux
  rationale: Le participe aoriste décrit naturellement le geste des femmes qui dirigent leur regard vers le tombeau. « Levant les yeux » conserve la valeur participiale dans un français courant et digne.
- source_word: θεωροῦσιν
  choice: elles voient
  rationale: Le présent narratif grec est conservé afin de rendre la vivacité du récit. Dans ce contexte, « voient » exprime clairement la constatation visuelle sans la raideur de « observent ».
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’elles voient et se rend naturellement par « que ».
- source_word: ἀποκεκύλισται
  choice: a été roulée de côté
  rationale: 'Le parfait passif indique une action accomplie dont le résultat demeure visible : au moment où les femmes regardent, la pierre se trouve déjà déplacée. Le passé composé passif rend ce résultat présent depuis le point de vue du récit.'
- source_word: ὁ λίθος
  choice: la pierre
  rationale: Le contexte identifie suffisamment la pierre qui fermait le tombeau ; il n’est pas nécessaire d’ajouter une précision absente du grec.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: elle était en effet extrêmement grande
  rationale: « En effet » restitue la valeur explicative de γάρ, tandis que « extrêmement grande » préserve la forte intensification de σφόδρα.
- source_word: καὶ
  choice: Et
  rationale: La conjonction simple maintient l’enchaînement narratif du grec sans ajouter une nuance temporelle non exprimée.
