id: MRK.16.17
reference: Mark 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: fr
  text: 'Et voici les signes qui accompagneront ceux qui auront cru : en mon nom, ils chasseront des démons ; ils parleront en langues nouvelles[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans de nouvelles langues ». Le grec peut désigner des langues au sens général, sans préciser ici la nature exacte de ces paroles.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » conserve la portée de manifestations porteuses de sens ou d’attestation, sans les réduire au terme plus général « miracles ».
- source_word: τοῖς πιστεύσασιν
  choice: ceux qui auront cru
  rationale: Le futur antérieur français reflète naturellement l’antériorité du participe aoriste par rapport au verbe futur, tout en gardant une portée générale.
- source_word: ταῦτα παρακολουθήσει
  choice: voici les signes qui accompagneront
  rationale: La tournure présentative française rend la référence prospective de ταῦτα, tandis qu’« accompagneront » exprime l’association durable mieux que la simple succession suggérée par « suivront ».
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Expression française naturelle indiquant une action accomplie sous l’autorité de Jésus.
- source_word: δαιμόνια ἐκβαλοῦσιν
  choice: ils chasseront des démons
  rationale: « Chasser » rend clairement l’expulsion dans un contexte d’exorcisme ; « démons » traduit directement δαιμόνια.
- source_word: γλώσσαις λαλήσουσιν καιναῖς
  choice: ils parleront en langues nouvelles
  rationale: « Langues » est idiomatique en français et garde ouverte la nature précise du phénomène ; « nouvelles » traduit directement καιναῖς sans préciser en quel sens elles le sont.
theological_decisions:
- issue: Nature des « langues nouvelles »
  choice: Conserver « langues » sans définir le phénomène
  alternative: Préciser « langues humaines inconnues » ou « paroles extatiques »
  rationale: Le grec γλώσσαις ne tranche pas ici entre ces interprétations. La traduction préserve donc l’ambiguïté et évite d’imposer une lecture confessionnelle.
- issue: Portée des signes à l’égard de ceux qui croient
  choice: Traduire directement la relation grammaticale sans ajouter de restriction ni d’universalisation
  alternative: Ajouter « tous » ou limiter explicitement la promesse à certains croyants
  rationale: Le texte dit que ces signes accompagneront ceux qui auront cru, mais ce verset seul ne précise ni que chaque signe se manifestera chez chaque croyant ni une répartition particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’élan d’une annonce solennelle, avec une formulation naturelle et sans archaïsmes inutiles.
