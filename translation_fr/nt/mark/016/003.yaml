  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: fr
  text: 'Elles se disaient entre elles : « Qui fera rouler la pierre pour nous afin de dégager l’entrée du tombeau ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: se disaient
  rationale: L’imparfait grec présente une parole en cours ou répétée. L’imparfait français « se disaient » en conserve naturellement l’aspect.
- source_word: πρὸς ἑαυτάς
  choice: entre elles
  rationale: 'L’expression est littéralement réflexive, mais elle prend ici un sens réciproque : les femmes parlaient les unes avec les autres. « Entre elles » est idiomatique en français.'
- source_word: Τίς
  choice: Qui
  rationale: Le pronom interrogatif demande quelle personne accomplira l’action ; « Qui » est l’équivalent direct et naturel.
- source_word: ἀποκυλίσει
  choice: roulera … loin de
  rationale: Le verbe désigne concrètement l’action de faire rouler un objet pour l’écarter. Cette formulation conserve l’image et s’articule avec ἐκ, qui marque l’éloignement depuis l’ouverture.
- source_word: ἡμῖν
  choice: pour nous
  rationale: 'Le datif exprime ici l’intérêt ou l’avantage : quelqu’un doit accomplir l’action pour elles.'
- source_word: τὸν λίθον
  choice: la pierre
  rationale: Le grec dit simplement « la pierre ». Sa grande taille ressort du contexte, mais n’est pas explicitée dans ce verset.
- source_word: ἐκ τῆς θύρας
  choice: loin de l’entrée
  rationale: θύρα peut désigner une porte ou une entrée. Pour un tombeau creusé, « entrée » est clair et naturel ; « loin de » rend la valeur d’éloignement de ἐκ sans suggérer que la pierre se trouvait à l’intérieur.
- source_word: τοῦ μνημείου
  choice: du tombeau
  rationale: Dans ce contexte funéraire, μνημεῖον désigne le lieu où le corps a été déposé. « Tombeau » est le terme français courant dans ce récit.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La tournure « se disaient entre elles » conserve à la fois l’imparfait du discours et le sens réciproque. Aucun ajout explicatif ni terme confessionnel.
