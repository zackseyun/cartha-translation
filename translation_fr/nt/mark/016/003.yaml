- from: 'Elles se disaient entre elles : « Qui roulera pour nous la pierre loin de l’entrée du tombeau ? »'
  to: 'Elles se disaient entre elles : « Qui fera rouler la pierre pour nous afin de dégager l’entrée du tombeau ? »'
  rationale: La correction remplace une expression française moins naturelle et potentiellement trop forte (« loin de ») par une formulation idiomatique. « Fera rouler » préserve la composante concrète de ἀποκυλίσει, et « afin de dégager l’entrée » explicite seulement le résultat inhérent au retrait de la pierre depuis l’entrée.
