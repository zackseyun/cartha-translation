  source_fidelity: 'Le sens général est fidèle : l’imparfait de ἔλεγον, le sens réciproque de πρὸς ἑαυτάς, l’interrogation, le datif d’avantage (« pour nous ») et « tombeau » sont bien rendus. Toutefois, « loin de l’entrée » tend à exprimer une distance importante, alors que ἐκ indique avant tout le retrait depuis/devant l’entrée. La révision conserve l’image concrète du roulement tout en exprimant plus naturellement le dégagement de l’entrée.'
  naturalness: « Roulera pour nous la pierre loin de l’entrée » est compréhensible, mais l’enchaînement est raide en français moderne et « loin de » est peu idiomatique ici. « Fera rouler la pierre pour nous afin de dégager l’entrée » est naturel et clair.
