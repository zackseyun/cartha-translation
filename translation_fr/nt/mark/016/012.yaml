id: MRK.16.12
reference: Mark 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: fr
  text: Après cela, il apparut sous une forme différente[a] à deux d’entre eux qui marchaient, se rendant à la campagne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sous une autre forme »; autre traduction possible : « avec une apparence différente ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « vers un champ »; ici, « à la campagne » rend le sens probablement visé par ἀγρός dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Cette formulation française naturelle conserve la succession temporelle marquée par μετά avec l’accusatif; le δέ de reprise n’exige pas ici un « mais » explicite.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: à deux d’entre eux
  rationale: Le datif désigne les destinataires et ἐξ αὐτῶν les présente comme deux membres du groupe; cette tournure est exacte et idiomatique.
- source_word: περιπατοῦσιν
  choice: qui marchaient
  rationale: L’imparfait rend l’action en cours exprimée par le participe présent, contemporaine de l’apparition.
- source_word: ἐφανερώθη
  choice: il apparut
  rationale: Dans ce récit d’apparition après la résurrection, le passif de φανερόω s’exprime naturellement en français par « apparaître », sans imposer la tournure littérale « fut manifesté ».
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: sous une forme différente
  rationale: ἑτέρᾳ exprime l’altérité ou la différence, et μορφή la forme ou l’aspect; la formulation reste descriptive sans expliquer la nature de cette différence.
- source_word: πορευομένοις
  choice: se rendant
  rationale: Cette expression rend le déplacement orienté vers une destination et évite la répétition lourde « marchaient… allaient ».
- source_word: εἰς ἀγρόν
  choice: à la campagne
  rationale: Dans ce contexte, ἀγρός peut désigner la campagne plutôt qu’un champ particulier; « se rendre à la campagne » est naturel en français, tandis que l’autre sens est signalé en note.
theological_decisions:
- issue: Nature de l’apparition décrite par ἐν ἑτέρᾳ μορφῇ
  choice: Traduire descriptivement par « sous une forme différente » sans expliquer le mécanisme de la différence.
  alternative: « sous une autre forme » ou « avec une apparence différente »
  rationale: Le verset affirme une différence de forme, mais ne précise pas si elle concernait l’apparence de Jésus, la perception des disciples ou les conditions de sa reconnaissance. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les deux participes grecs sans répétition artificielle et les notes maintiennent les principales possibilités lexicales.
