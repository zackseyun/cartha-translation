source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: fr
  text: Quant à eux, ils partirent et proclamèrent partout, tandis que le Seigneur agissait avec eux et confirmait le message[a] par les signes qui suivaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole ». Ici, le mot grec peut désigner le message proclamé.
    reason: lexical_alternative
  - marker: b
    text: Ou « par les signes qui accompagnaient ». Le grec ne précise pas explicitement ce que les signes suivaient ou accompagnaient.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Quant à eux
  rationale: Le démonstratif reprend le groupe des disciples, tandis que δέ assure la transition. Cette tournure française marque la reprise du sujet sans introduire un contraste excessif.
- source_word: ἐξελθόντες ἐκήρυξαν
  choice: ils partirent proclamer
  rationale: Le participe aoriste exprime ici une action liée au verbe principal. « Partirent proclamer » restitue naturellement le mouvement suivi de la proclamation publique.
- source_word: πανταχοῦ
  choice: partout
  rationale: Équivalent français direct, idiomatique et complet de l’adverbe grec.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: Le Seigneur œuvrait avec eux
  rationale: Le génitif absolu décrit l’action concomitante du Seigneur. « Œuvrait avec eux » conserve l’idée de coopération exprimée par συνεργέω, dans un registre digne et courant.
- source_word: τὸν λόγον
  choice: le message
  rationale: Dans ce contexte, λόγος désigne le contenu proclamé. « Le message » est transparent en français moderne, tandis que « la parole » demeure une traduction possible et traditionnelle.
- source_word: βεβαιοῦντος
  choice: confirmait
  rationale: Le verbe signifie ici rendre ferme, attester ou confirmer. « Confirmait » exprime clairement la validation divine de la proclamation.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: par les signes qui l’accompagnaient
  rationale: διά indique le moyen. ἐπακολουθέω peut évoquer ce qui suit ou ce qui accompagne; la formulation retenue exprime naturellement que les signes se produisaient en relation avec le message, sans préciser davantage leur chronologie.
theological_decisions:
- issue: Référent du titre « le Seigneur »
  choice: Conserver « le Seigneur », dont le contexte immédiat renvoie à Jésus ressuscité.
  alternative: Comprendre « le Seigneur » comme une désignation plus générale de Dieu.
  rationale: Marc 16.19 vient de désigner Jésus comme « le Seigneur ». La traduction maintient néanmoins le titre grec sans ajouter le nom « Jésus » dans le texte.
- issue: Fonction des signes
  choice: Les signes servent de moyen par lequel le Seigneur confirme le message proclamé.
  alternative: Les signes suivent simplement les proclamateurs, sans fonction explicite d’attestation.
  rationale: La syntaxe rattache directement les signes à l’action de confirmer le message. La traduction n’en déduit rien quant à leur durée ou à leur caractère normatif.
- issue: Rapport des signes à ce qu’ils accompagnent
  choice: Faire grammaticalement reprendre « le message » par « l’ », tout en signalant l’ambiguïté en note.
  alternative: Comprendre que les signes suivaient les disciples ou survenaient à la suite de leur proclamation.
  rationale: Le grec n’exprime pas explicitement le complément de ἐπακολουθούντων. La formulation française retenue est naturelle, mais la note préserve les autres rapports syntaxiques possibles.
translation_notes:
  register: Français international moderne, sobre et digne. « Proclamer » évite de réduire κηρύσσω au seul cadre d’une prédication ecclésiale. L’imparfait pour les actions du Seigneur présente son œuvre comme concomitante à la mission des disciples.
