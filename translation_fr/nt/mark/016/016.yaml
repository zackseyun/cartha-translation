id: MRK.16.16
reference: Mark 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: fr
  text: Celui qui aura cru et aura été baptisé sera sauvé, mais celui qui n’aura pas cru sera condamné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: celui qui aura cru
  rationale: L’article suivi du participe aoriste substantivé désigne une personne caractérisée par l’action. Le futur antérieur français exprime naturellement l’antériorité par rapport au futur « sera sauvé » tout en conservant le singulier représentatif.
- source_word: βαπτισθεὶς
  choice: aura été baptisé
  rationale: Le participe aoriste passif est coordonné à πιστεύσας et présente le baptême comme antérieur au résultat futur. Cette formulation garde explicitement la voix passive.
- source_word: σωθήσεται
  choice: sera sauvé
  rationale: Dans ce contexte, le futur passif de σῴζω porte le sens sotériologique habituel. « Sera sauvé » est direct, naturel et n’ajoute aucune explication doctrinale.
- source_word: ὁ δὲ ἀπιστήσας
  choice: mais celui qui n’aura pas cru
  rationale: δέ marque ici le contraste. En français, « ne pas croire » rend idiomatiquement ἀπιστέω et maintient l’opposition avec « aura cru », sans la nuance potentiellement volontaire de « refuser de croire ».
- source_word: κατακριθήσεται
  choice: sera condamné
  rationale: Le futur passif de κατακρίνω désigne un jugement défavorable aboutissant à la condamnation. « Sera condamné » en est l’équivalent français le plus direct.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux participes décrivant la personne qui sera sauvée.
- source_word: δὲ
  choice: mais
  rationale: La conjonction introduit le contraste entre les deux personnes et leurs issues respectives.
theological_decisions:
- issue: Rapport entre la foi, le baptême et le salut
  choice: Traduire directement les deux participes coordonnés comme description de celui qui sera sauvé, sans préciser davantage leur rapport causal.
  alternative: Présenter le baptême soit comme cause instrumentale explicitement nécessaire, soit comme un élément purement accessoire.
  rationale: Le grec associe le fait d’avoir cru et d’avoir été baptisé à la personne qui sera sauvée, tandis que la seconde proposition mentionne comme motif de condamnation le fait de ne pas avoir cru, sans mentionner explicitement l’absence de baptême. La traduction conserve cette tension sans imposer une synthèse confessionnelle.
- issue: Singulier masculin à valeur générique
  choice: Employer « celui qui », selon la forme grammaticale du grec et l’usage générique traditionnel du français.
  alternative: Employer le pluriel « ceux qui » ou la tournure plus inclusive « quiconque » dans les deux propositions.
  rationale: Les participes substantivés grecs sont au masculin singulier avec une portée représentative générale. « Celui qui » préserve ce nombre grammatical sans limiter nécessairement la référence aux hommes.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur antérieur (« aura cru », « aura été baptisé », « n’aura pas cru ») conserve l’antériorité des participes aoristes par rapport aux futurs principaux, au prix d’une légère solennité qui convient au registre biblique.
