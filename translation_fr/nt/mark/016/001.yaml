id: MRK.16.1
reference: Mark 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: fr
  text: Une fois le sabbat passé, Marie de Magdala, Marie, la mère de Jacques[a], et Salomé achetèrent des aromates afin d’aller l’oindre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Marie, celle de Jacques ». Le grec l’identifie par son lien avec Jacques sans préciser ici la nature de ce lien ; elle est généralement comprise comme sa mère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Lorsque le sabbat fut passé
  rationale: Le génitif absolu situe l’action principale après la fin du sabbat. Cette formulation est naturelle, précise et conserve la relation temporelle du grec.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Marie de Magdala
  rationale: Forme française courante qui rend l’épithète géographique sans introduire le sens moderne parfois associé à « magdaléenne ».
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Marie, la mère de Jacques[a]
  rationale: Le grec dit elliptiquement « Marie, celle de Jacques » sans préciser le lien. Dans le contexte de Marc, l’identification comme mère est la lecture la plus naturelle en français, mais l’ambiguïté formelle est signalée en note.
- source_word: Σαλώμη
  choice: Salomé
  rationale: Transcription française conventionnelle du nom propre.
- source_word: ἠγόρασαν
  choice: achetèrent
  rationale: Équivalent direct et naturel de l’aoriste narratif.
- source_word: ἀρώματα
  choice: des aromates
  rationale: Le terme désigne ici des substances parfumées destinées aux soins funéraires. « Aromates » conserve cette portée concrète et traditionnelle sans réduire le sens à de simples parfums.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: afin d’aller l’oindre
  rationale: « Afin de » exprime le but, tandis que « aller » rend naturellement l’action préalable indiquée par le participe. « Oindre » reste proche du geste concret d’appliquer une substance sur le corps sans le paraphraser comme un embaumement complet.
theological_decisions:
- issue: Lien entre Marie et Jacques dans l’expression elliptique Μαρία ἡ τοῦ Ἰακώβου
  choice: Marie, la mère de Jacques
  alternative: Marie, celle de Jacques
  rationale: Le texte grec ne nomme pas explicitement le lien familial. L’identification comme mère correspond au contexte marcien et permet un français intelligible, mais la note conserve la véritable ambiguïté de l’expression source.
translation_notes:
  register: Français international moderne, clair et digne. « Marie de Magdala » est préféré à « Marie-Madeleine » pour rendre explicitement l’épithète géographique. « Oindre » conserve la précision du geste funéraire, malgré son registre légèrement soutenu.
