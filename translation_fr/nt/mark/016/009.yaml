  variant: modern international French
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: fr
  text: Après être ressuscité[a], tôt le premier jour de la semaine, il apparut d’abord à Marie de Magdala, dont il avait chassé sept démons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les versets 9 à 20 sont absents de certains manuscrits anciens de Marc ; d’autres manuscrits les contiennent, parfois avec des variantes.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Après être ressuscité
  rationale: Le participe aoriste est compris comme temporel par rapport au verbe principal ἐφάνη. Cette formulation française exprime naturellement l’antériorité sans ajouter un sujet nominal absent du grec.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Particule de liaison légère; dans cette phrase, l’enchaînement est naturel en français sans « alors », « or » ou « mais », qui risqueraient de surinterpréter sa valeur.
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: tôt le premier jour de la semaine
  rationale: πρωῒ indique le début de la matinée, et πρώτῃ σαββάτου est l’expression idiomatique pour le premier jour de la semaine.
- source_word: ἐφάνη πρῶτον
  choice: il apparut d’abord
  rationale: ἐφάνη désigne ici une manifestation ou apparition, et πρῶτον marque l’ordre des apparitions. « D’abord » est idiomatique en français.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: à Marie de Magdala
  rationale: Forme française courante et transparente du nom et du gentilé, le datif indiquant la personne à qui Jésus apparut.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: dont il avait chassé
  rationale: Le plus-que-parfait rend l’action antérieure exprimée par ἐκβεβλήκει. La construction avec « dont » est naturelle en français pour désigner la personne de laquelle les démons avaient été expulsés.
- source_word: ἑπτὰ δαιμόνια
  choice: sept démons
  rationale: Traduction directe qui conserve le vocabulaire propre aux récits d’exorcisme des Évangiles.
theological_decisions:
- issue: Statut textuel de Marc 16.9 dans la finale longue
  choice: Traduire le verset fourni tout en signalant par une note que Marc 16.9-20 manque dans certains témoins anciens.
  alternative: Ne pas inclure Marc 16.9-20 dans le corps du texte, ou le présenter séparément comme une finale variante.
  rationale: Le texte grec fourni contient le verset mais l’encadre de doubles crochets, indiquant une importante incertitude textuelle. La note préserve cette donnée sans trancher silencieusement la question.
translation_notes:
  register: Français international moderne, digne et accessible. « Marie de Magdala » est préféré à « Marie-Madeleine » pour rendre explicitement le gentilé grec, sans perdre l’identification traditionnelle. La syntaxe reste proche du grec tout en étant naturelle en français.
