id: MRK.16.7
reference: Mark 16:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: fr
  text: 'Mais allez dire à ses disciples et à Pierre : « Il vous précède en Galilée. C’est là que vous le verrez, comme il vous l’a dit. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pierre est nommé séparément des disciples. Cela peut souligner son rétablissement après son reniement, mais le grec ne dit pas explicitement « surtout Pierre ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste et la transition vers l’action commandée, dans un français naturel et concis.
- source_word: ὑπάγετε εἴπατε
  choice: allez dire
  rationale: Les deux impératifs pluriels successifs sont rendus par la tournure française idiomatique « allez dire », qui conserve l’ordre d’aller transmettre le message.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: à ses disciples et à Pierre
  rationale: Préserve la coordination simple du grec et la mention distincte de Pierre sans ajouter « surtout » ni « y compris ».
- source_word: Προάγει ὑμᾶς
  choice: Il vous précède
  rationale: Exprime de façon concise le mouvement de Jésus en avant des disciples; « précède » est digne, clair et naturel dans ce contexte.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: En français, « précéder quelqu’un en Galilée » indique naturellement la destination; la préposition εἰς peut ici exprimer le mouvement vers ou dans la région.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: C’est là que vous le verrez
  rationale: Rend explicitement l’adverbe locatif ἐκεῖ tout en conservant la promesse au futur.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: comme il vous l’a dit
  rationale: Tournure française naturelle qui exprime la conformité avec l’annonce antérieure de Jésus.
theological_decisions:
- issue: Mention distincte de Pierre après les disciples
  choice: Conserver « à ses disciples et à Pierre »
  alternative: « à ses disciples, surtout à Pierre » ou « à ses disciples, y compris Pierre »
  rationale: Le grec nomme Pierre séparément, ce qui peut avoir une portée narrative et pastorale après son reniement, mais il n’explicite ni « surtout » ni « y compris ». La traduction maintient cette tension sans l’interpréter dans le corps du texte.
translation_notes:
  register: Français international moderne, simple et digne. La formulation « allez dire » est idiomatique; « Il vous précède en Galilée » reste proche du mouvement exprimé par le grec sans lourdeur.
