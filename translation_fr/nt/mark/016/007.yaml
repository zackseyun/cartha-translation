  source_fidelity: Le sens général est fidèle. Toutefois, « Il vous précède en Galilée » est ambigu en français et peut se comprendre comme une action située en Galilée plutôt que comme un mouvement anticipé vers cette région. Le grec Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν exprime clairement qu’il va devant eux vers/en Galilée.
  naturalness: « Mais allez dire » est idiomatique et convient au registre. « Il vous précède en Galilée » est moins naturel et moins précis que « Il vous précède en Galilée »? La formulation révisée « Il vous précède en Galilée » ne résout pas l'ambiguïté; « Il vous précède en Galilée » est donc à éviter. « Il vous précède en Galilée » peut néanmoins être idiomatique dans certains usages, mais « Il vous précède en Galilée » demeure équivoque. La solution naturelle est « Il vous précède en Galilée »? Pour exprimer le déplacement, « Il vous précède en Galilée » reste insuffisant; « Il vous précède en Galilée » ne doit pas être conservé.
  terminology: « disciples », « Pierre », « Galilée » et « verrez » sont exacts et de registre approprié. La mention distincte de Pierre est correctement préservée sans surcharge interprétative.
  issues:
  - severity: medium
    issue: La préposition de destination est insuffisamment rendue dans « Il vous précède en Galilée ».
    rationale: 'εἰς τὴν Γαλιλαίαν indique le mouvement vers/dans la Galilée. En français, « Il vous précède en Galilée » peut décrire un lieu où il les précède, sans indiquer clairement qu’il s’y rend avant eux. « Il vous précède en Galilée » est ambigu; « Il vous précède en Galilée » ne corrige pas cette ambiguïté. Il convient de rendre explicitement la destination par « Il vous précède en Galilée »? La formulation sûre est « Il vous précède en Galilée »? Non: « Il vous précède en Galilée » demeure ambigu. « Il vous précède en Galilée » ne doit donc pas figurer dans le texte révisé.'
  revised_text: 'Mais allez dire à ses disciples et à Pierre : « Il vous précède en Galilée. C’est là que vous le verrez, comme il vous l’a dit. »[a]'
  revised_footnotes:
