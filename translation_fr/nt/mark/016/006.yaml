id: MRK.16.6
reference: Mark 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: fr
  text: 'Mais il leur dit : « Ne soyez pas effrayées. Vous cherchez Jésus le Nazaréen[a], celui qui a été crucifié. Il a été ressuscité[b] ; il n’est pas ici. Regardez l’endroit où ils l’ont déposé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Nazoréen » ou « de Nazareth ». Le grec emploie une désignation dérivée du nom Nazareth.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Il est ressuscité » ou « Il s’est relevé ». Le verbe grec est au passif : « Il a été ressuscité ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Ne soyez pas effrayées
  rationale: Le verbe exprime une vive émotion mêlée d’effroi, et non une simple surprise. Le féminin explicite naturellement en français que l’homme s’adresse aux femmes.
- source_word: Ναζαρηνὸν
  choice: le Nazaréen
  rationale: Cette désignation adjectivale dérivée de Nazareth conserve la forme d’épithète du grec sans la réduire à une simple indication d’origine.
- source_word: ἐσταυρωμένον
  choice: celui qui a été crucifié
  rationale: Cette formulation passive rend le participe parfait et présente la crucifixion comme un événement accompli dont le résultat demeure pertinent.
- source_word: ἠγέρθη
  choice: Il a été ressuscité
  rationale: Le passif français préserve la voix du grec et laisse implicite l’auteur de l’action, tout en exprimant clairement la résurrection dans un français naturel.
- source_word: ζητεῖτε
  choice: Vous cherchez
  rationale: Le présent français est idiomatique et rend directement l’action en cours exprimée par le présent grec.
- source_word: ἴδε
  choice: Regardez
  rationale: L’impératif attire directement l’attention sur l’endroit, dans une langue moderne et naturelle.
- source_word: τόπος
  choice: l’endroit
  rationale: « L’endroit » est concret et idiomatique dans ce contexte spatial.
- source_word: ἔθηκαν
  choice: ils l’ont déposé
  rationale: Le verbe « déposer » convient au placement respectueux d’un corps dans un tombeau et garde le sujet pluriel indéfini du grec.
- source_word: λέγει αὐταῖς
  choice: il leur dit
  rationale: Le présent français conserve le présent historique de Marc et sa vivacité narrative.
theological_decisions:
- issue: Formulation et voix de la résurrection
  choice: Il a été ressuscité
  alternative: Il est ressuscité / Il s’est relevé
  rationale: ἠγέρθη est formellement passif. La traduction retenue conserve cette voix et l’action divine implicite sans nommer explicitement son auteur. Les autres formulations sont possibles en français, mais peuvent être entendues comme actives ou comme décrivant seulement un état.
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique de Marc est maintenu. Les paroles restent directes, sans tournure archaïque, et le passif de la résurrection est conservé.
