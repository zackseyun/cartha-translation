source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: fr
  text: 'Quand le sabbat arriva, il se mit à enseigner dans la synagogue. Beaucoup de ceux qui l’entendaient étaient frappés d’étonnement et disaient : « D’où cet homme tient-il tout cela ? Quelle est cette sagesse qui lui a été donnée ? Et d’où viennent ces actes de puissance[a] qui s’accomplissent par ses mains ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracles » ou « œuvres puissantes ». Le pluriel grec δυνάμεις peut désigner des actes miraculeux ou des manifestations de puissance.
    reason: alternative lexicale
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Quand le sabbat arriva
  rationale: Le génitif absolu exprime une circonstance temporelle. Cette formulation conserve l’idée de la venue du sabbat tout en restant naturelle en français narratif.
- source_word: ἤρξατο διδάσκειν
  choice: il se mit à enseigner
  rationale: Cette tournure française rend naturellement la valeur inchoative de ἄρχομαι suivi de l’infinitif.
- source_word: ἐν τῇ συναγωγῇ
  choice: dans la synagogue
  rationale: Dans ce contexte juif, συναγωγή désigne clairement la synagogue comme lieu de réunion et d’enseignement.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Beaucoup de ceux qui l’entendaient
  rationale: La formulation rend οἱ πολλοί de manière idiomatique et explicite l’objet de l’écoute fourni par le contexte.
- source_word: ἐξεπλήσσοντο
  choice: étaient frappés d’étonnement
  rationale: L’expression conserve la force du verbe et l’aspect duratif de l’imparfait grec, sans suggérer à elle seule une réaction favorable.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: D’où viennent à cet homme toutes ces choses ?
  rationale: La question porte sur l’origine. « Cet homme » restitue le démonstratif τούτῳ et sa possible nuance de distance, tandis que « toutes ces choses » préserve le caractère général de ταῦτα.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Quelle est cette sagesse qui lui a été donnée
  rationale: Le passif et l’interrogation sont maintenus sans identifier celui qui donne la sagesse, puisque le texte ne le précise pas.
- source_word: αἱ δυνάμεις τοιαῦται
  choice: ces actes de puissance
  rationale: Au pluriel, δυνάμεις désigne ici des manifestations ou actes puissants. Cette traduction conserve le lien lexical avec la puissance sans réduire d’emblée le terme au seul mot « miracles ».
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: qui s’accomplissent par ses mains
  rationale: La formulation garde l’image instrumentale des mains, le sens de διά avec le génitif et la valeur du participe γινόμεναι.
theological_decisions:
- issue: Nature des δυνάμεις
  choice: actes de puissance
  alternative: miracles ; œuvres puissantes ; puissances
  rationale: Dans Marc, le pluriel peut désigner des actes miraculeux, mais « actes de puissance » conserve à la fois le caractère concret des œuvres et la portée lexicale de δύναμις sans imposer une catégorie théologique plus étroite.
- issue: Agent de la sagesse donnée
  choice: maintien du passif « qui lui a été donnée »
  alternative: « que Dieu lui a donnée »
  rationale: Le texte emploie un passif sans nommer explicitement l’agent. La traduction préserve cette indétermination au lieu de l’expliciter doctrinalement.
- issue: Nuance du démonstratif τούτῳ
  choice: « cet homme » dans la première question, puis « lui »
  alternative: « lui » dans les deux occurrences ; « celui-ci »
  rationale: « Cet homme » peut rendre la distance perceptible dans les questions de l’auditoire sans transformer cette nuance contextuelle en mépris explicite.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure interrogative a été légèrement régularisée pour être naturelle en français, tout en conservant l’étonnement de l’auditoire, le passif concernant la sagesse et l’image des œuvres s’accomplissant « par ses mains ».
