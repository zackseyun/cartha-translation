revisions:
- from: 'Quand le sabbat arriva, il se mit à enseigner dans la synagogue. Beaucoup de ceux qui l’entendaient étaient frappés d’étonnement et disaient : « D’où viennent à cet homme toutes ces choses ? Quelle est cette sagesse qui lui a été donnée, et que sont ces actes de puissance[a] qui s’accomplissent par ses mains ? »'
  to: 'Quand le sabbat arriva, il se mit à enseigner dans la synagogue. Beaucoup de ceux qui l’entendaient étaient frappés d’étonnement et disaient : « D’où cet homme tient-il tout cela ? Quelle est cette sagesse qui lui a été donnée ? Et d’où viennent ces actes de puissance[a] qui s’accomplissent par ses mains ? »'
  rationale: La révision rétablit, dans un français fluide, le lien de la troisième interrogation avec la question de l’origine des actes de puissance. Elle améliore aussi l’idiome de la première question, sans préciser l’agent de la sagesse donnée ni réduire δυνάμεις à une seule interprétation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T10:50:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la circonstance temporelle, l’inchoatif, le cadre synagogal, l’étonnement continu, le passif de « sagesse donnée » et l’instrumentalité des mains. Toutefois, « que sont ces actes de puissance » transforme la dernière expression coordonnée en une question d’identification. Dans le grec, elle prolonge plus naturellement l’interrogation sur la provenance : « et [d’où viennent] de tels actes de puissance… ? »'
  naturalness: Le français est globalement clair et de registre moderne soutenu. « D’où viennent à cet homme toutes ces choses ? » est néanmoins moins idiomatique que « D’où cet homme tient-il tout cela ? ». La révision proposée rend les interrogations plus naturelles tout en gardant la nuance de distance de « cet homme ».
  terminology: « Sabbat », « synagogue », « sagesse » et « actes de puissance » sont appropriés. « Actes de puissance » conserve utilement l’amplitude de δυνάμεις; la note offre à juste titre « miracles » et « œuvres puissantes » comme possibilités contextuelles.
  issues:
  - severity: medium
    issue: La dernière question est rendue comme une interrogation sur la nature des actes.
    rationale: « Que sont ces actes de puissance ? » ne reproduit pas bien la coordination elliptique du grec, qui rattache « de tels actes de puissance s’accomplissant par ses mains » à la question sur leur origine. Une reprise explicite de « D’où viennent » est naturelle en français et préserve cette relation.
  - severity: low
    issue: Tournure française un peu lourde dans la première question.
    rationale: « D’où viennent à cet homme toutes ces choses ? » est compréhensible, mais « D’où cet homme tient-il tout cela ? » est plus idiomatique sans modifier le sens de Πόθεν τούτῳ ταῦτα.
  revised_text: 'Quand le sabbat arriva, il se mit à enseigner dans la synagogue. Beaucoup de ceux qui l’entendaient étaient frappés d’étonnement et disaient : « D’où cet homme tient-il tout cela ? Quelle est cette sagesse qui lui a été donnée ? Et d’où viennent ces actes de puissance[a] qui s’accomplissent par ses mains ? »'
  revised_footnotes:
