  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: fr
  text: Après leur avoir dit au revoir[a], il partit vers la montagne pour prier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après avoir pris congé d’eux ».'
    reason: Alternative lexicale pour ἀποταξάμενος.
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: Après leur avoir dit au revoir
  rationale: Le participe moyen signifie ici prendre congé de quelqu’un. « Dire au revoir » est naturel en français moderne et s’accorde avec le datif αὐτοῖς, rendu par « leur ».
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif pluriel renvoie aux personnes mentionnées dans le contexte et s’intègre naturellement à l’expression « leur dire au revoir ».
- source_word: ἀπῆλθεν
  choice: il s’en alla
  rationale: Le verbe exprime le départ. « S’en alla » conserve cette idée tout en restant fluide et digne dans un récit.
- source_word: εἰς τὸ ὄρος
  choice: sur la montagne
  rationale: ὄρος désigne une montagne ou une hauteur. Avec l’article grec, « la montagne » préserve le caractère défini de l’expression; en français, « aller sur la montagne » convient naturellement au déplacement vers ce relief.
- source_word: προσεύξασθαι
  choice: pour prier
  rationale: L’infinitif exprime le but du départ; « pour prier » le rend directement.
- source_word: καὶ
  choice: Après
  rationale: La relation narrative et circonstancielle portée par καὶ avec le participe est rendue naturellement par la proposition initiale « Après… », sans qu’un « et » supplémentaire soit nécessaire en français.
theological_decisions:
- issue: Référence de « la montagne »
  choice: Conserver « la montagne » sans lui attribuer de portée symbolique ou théologique explicite.
  alternative: Employer « une montagne » ou interpréter ce lieu comme un espace de révélation particulière.
  rationale: Le grec emploie l’article défini, mais le verset n’explicite aucun symbolisme. La traduction conserve donc le détail narratif sans ajouter d’interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation demeure proche de la structure et du sens du grec tout en évitant un calque lourd.
