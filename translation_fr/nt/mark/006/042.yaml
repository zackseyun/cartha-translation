  text: And they all ate and were satisfied.
translation:
  language: fr
  text: Ils mangèrent tous et furent rassasiés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: mangèrent
  rationale: L’aoriste actif de ἐσθίω désigne simplement l’action de manger. « Mangèrent » est l’équivalent français direct et naturel, sans ajouter un complément absent du grec.
- source_word: πάντες
  choice: tous
  rationale: L’adjectif substantivé au nominatif pluriel renvoie à l’ensemble des personnes présentes. Placé après le verbe avec le pronom « ils », « tous » conserve clairement cette portée universelle.
- source_word: ἐχορτάσθησαν
  choice: furent rassasiés
  rationale: Le passif de χορτάζω exprime le fait d’avoir mangé suffisamment, jusqu’à satiété. « Furent rassasiés » rend ce résultat avec précision dans un registre courant et digne.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: Les deux occurrences de καί coordonnent simplement les actions. La première est rendue implicitement par l’enchaînement français, tandis que la seconde devient « et » ; commencer par « Et » serait possible, mais moins naturel dans un verset français présenté isolément.
