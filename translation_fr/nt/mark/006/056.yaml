id: MRK.6.56
reference: Mark 6:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: fr
  text: Partout où il entrait, dans les villages, les villes ou les campagnes, on déposait les malades sur les places publiques et on le suppliait de pouvoir toucher ne serait-ce que la frange de son vêtement[a]. Et tous ceux qui le touchaient étaient guéris[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bord » ou « l’ourlet de son vêtement ». Le mot grec peut aussi évoquer les franges portées sur les vêtements juifs.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « étaient sauvés » ; ici, le verbe grec désigne leur guérison ou leur rétablissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: Partout où il entrait
  rationale: ὅπου avec ἄν donne une portée indéfinie et générale, tandis que l’imparfait décrit une action répétée. « Partout où il entrait » rend naturellement les deux.
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: dans les villages, les villes ou les campagnes
  rationale: ἀγρούς désigne ici les zones rurales plutôt que des champs individuels; « les campagnes » convient à cette série de lieux.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sur les places publiques
  rationale: ἀγορά peut désigner le marché ou la place publique. Le contexte met l’accent sur le lieu public où l’on déposait les malades.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: on déposait les malades
  rationale: L’imparfait exprime une pratique répétée. Le pronom « on » rend naturellement le sujet pluriel indéterminé.
- source_word: παρεκάλουν αὐτόν
  choice: on le suppliait
  rationale: Dans ce contexte, παρακαλέω exprime une demande insistante et pressante.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: de les laisser toucher ne serait-ce que
  rationale: κἄν marque ici le minimum espéré, bien rendu en français par « ne serait-ce que ». La tournure avec « laisser » exprime idiomatiquement la demande adressée à Jésus sans ajouter l’idée d’une permission formelle.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: la frange de son vêtement
  rationale: κράσπεδον peut désigner le bord, l’ourlet ou la frange, et éventuellement évoquer les franges rituelles juives. « Frange » conserve cette ouverture.
- source_word: ἥψαντο αὐτοῦ
  choice: le touchaient
  rationale: Le pronom grec αὐτοῦ renvoie grammaticalement à Jésus. Le contexte précise que le contact recherché pouvait se faire avec la frange de son vêtement; la traduction conserve le référent explicite du grec.
- source_word: ἐσῴζοντο
  choice: étaient guéris
  rationale: Dans le contexte immédiat des malades, σῴζω signifie être guéri ou rétabli. Une note conserve toutefois le sens littéral plus large du verbe.
theological_decisions:
- issue: Portée de σῴζω dans ἐσῴζοντο
  choice: étaient guéris
  alternative: étaient sauvés
  rationale: Le contexte immédiat concerne la guérison physique des malades. « Guéris » communique ce sens sans effacer la valeur plus large de σῴζω, signalée en note.
- issue: Référent de ἥψαντο αὐτοῦ
  choice: le touchaient
  alternative: touchaient la frange de son vêtement
  rationale: Le grec dit littéralement qu’ils « le » touchaient, après avoir précisé qu’ils demandaient à toucher la frange de son vêtement. Garder « le » préserve cette formulation et son articulation avec la phrase précédente.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits rendent le caractère habituel et répété de la scène. « Places publiques » évite de réduire ἀγοραί à de simples marchés, et « campagnes » désigne les zones rurales.
