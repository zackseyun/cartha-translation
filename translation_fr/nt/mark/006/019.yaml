  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: fr
  text: Mais Hérodiade lui gardait rancune et voulait le tuer[a], mais elle ne le pouvait pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nourrissait du ressentiment contre lui » ou « lui en voulait ». L’expression grecque indique une hostilité persistante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici le contraste avec ce qui précède; « Mais » rend naturellement cette valeur adversative.
- source_word: Ἡρῳδιὰς
  choice: Hérodiade
  rationale: Forme française traditionnelle et courante du nom propre grec.
- source_word: ἐνεῖχεν αὐτῷ
  choice: lui gardait rancune
  rationale: L’expression idiomatique désigne une hostilité rancunière persistante; l’imparfait français restitue l’aspect duratif de l’imparfait grec.
- source_word: ἤθελεν
  choice: voulait
  rationale: Rend directement la volonté ou l’intention exprimée par θέλω à l’imparfait.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: le tuer
  rationale: Traduction directe et naturelle, sans ajouter la qualification juridique ou morale qu’impliquerait « l’assassiner ».
- source_word: καὶ οὐκ ἠδύνατο
  choice: mais elle ne le pouvait pas
  rationale: Le second καί prend en contexte une valeur adversative. Le pronom « le » reprend l’action de tuer et l’imparfait maintient l’incapacité persistante.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Garder rancune » conserve l’image d’une hostilité entretenue, tandis que la répétition de « mais » reflète les deux articulations adversatives du grec sans résoudre davantage leur tension narrative.
