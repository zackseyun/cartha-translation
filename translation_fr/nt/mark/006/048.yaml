reference: Mark 6:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: fr
  text: Les voyant peiner à ramer[a], car le vent leur était contraire, il vient vers eux, vers la quatrième veille de la nuit[b], en marchant sur la mer[c] ; et il voulait les dépasser[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut se traduire plus littéralement par « tourmentés tandis qu’ils ramaient » ; elle souligne la dureté de leur lutte.
    reason: lexical_alternative
  - marker: b
    text: Dans le système romain, la « quatrième veille de la nuit » correspond approximativement à la période comprise entre 3 heures et 6 heures du matin.
    reason: cultural_note
  - marker: c
    text: 'Ou : « en marchant sur l’eau ». Le grec dit littéralement « sur la mer ».'
    reason: lexical_alternative
  - marker: d
    text: Cette expression peut signifier simplement qu’il voulait aller plus loin qu’eux. Elle peut aussi faire écho à des passages de l’Ancien Testament où Dieu « passe » lors d’une manifestation de sa présence, par exemple Exode 33.19, 22 ; 34.6 et 1 Rois 19.11.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Les voyant
  rationale: Le participe aoriste est conservé sous une forme participiale française naturelle, qui maintient le lien temporel sans préciser davantage la succession des actions.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: peiner à ramer
  rationale: Dans ce contexte, l’expression décrit la lutte pénible des disciples contre le vent. « Peiner à ramer » est idiomatique et restitue leur détresse et leur effort soutenu, sans introduire l’idée moderne de torture que pourrait suggérer une traduction française trop littérale de βασανίζω.
- source_word: ἐναντίος αὐτοῖς
  choice: leur était contraire
  rationale: Cette tournure française naturelle conserve la force adversative de l’expression appliquée au vent.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: vers la quatrième veille de la nuit
  rationale: L’expression antique de mesure du temps est conservée dans le texte, tandis qu’une note en explique approximativement l’équivalent horaire.
- source_word: ἔρχεται
  choice: il vient
  rationale: Le présent historique de Marc est conservé afin de rendre la vivacité du récit.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: en marchant sur la mer
  rationale: « Mer » traduit directement θάλασσα et évite de remplacer sans nécessité le terme grec par « eau ».
- source_word: ἤθελεν
  choice: il voulait
  rationale: L’imparfait exprime ici une volonté ou une intention en cours. « Voulait » reste naturel et ne précise pas plus que le grec la nuance exacte entre désir et intention.
- source_word: παρελθεῖν αὐτούς
  choice: passer à côté d’eux
  rationale: La formulation exprime naturellement le fait de passer auprès d’eux ou au-delà d’eux, tout en maintenant l’ouverture à un éventuel écho aux scènes bibliques où Dieu « passe » lors d’une manifestation.
theological_decisions:
- issue: Sens de « il voulait passer à côté d’eux »
  choice: Conserver une formulation concrète et non explicitée dans le texte principal.
  alternative: « Il avait l’intention de les dépasser » ou expliciter une manifestation divine.
  rationale: Le grec peut décrire simplement un mouvement au-delà des disciples, mais il peut aussi évoquer des récits de l’Ancien Testament où Dieu « passe » en se révélant. La traduction ne tranche pas cette tension ; la note signale les deux possibilités.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe conserve le présent historique caractéristique de Marc. « Peiner à ramer » évite une littéralité maladroite, tandis que les notes préservent la force lexicale de βασανιζομένους et l’ambiguïté théologique de παρελθεῖν αὐτούς.
