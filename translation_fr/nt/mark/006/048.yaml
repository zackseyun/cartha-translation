- from: Les voyant peiner à ramer[a], car le vent leur était contraire, il vient vers eux, vers la quatrième veille de la nuit[b], en marchant sur la mer[c] ; et il voulait passer à côté d’eux[d].
  to: Les voyant peiner à ramer[a], car le vent leur était contraire, il vient vers eux, vers la quatrième veille de la nuit[b], en marchant sur la mer[c] ; et il voulait les dépasser[d].
  rationale: La seule correction nécessaire remplace « passer à côté d’eux » par « les dépasser », qui correspond mieux à παρελθεῖν αὐτούς. Le reste du texte et les notes sont conservés, car ils sont fidèles au grec, naturels en français international moderne et maintiennent les ambiguïtés interprétatives pertinentes.
