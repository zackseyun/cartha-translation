  verdict: revise
  source_fidelity: 'La formulation « l’avait fait enchaîner » précise indûment le moyen de lier Jean : δέω signifie « lier/attacher » et le grec ne mentionne pas de chaînes. Le reste rend correctement la responsabilité d’Hérode, l’arrestation, l’emprisonnement, le lien avec Hérodiade et le mariage antérieur.'
  naturalness: Le français est globalement naturel et de registre narratif approprié. Remplacer « enchaîner » par « attacher » conserve une formulation fluide. La reprise explicite « parce qu’il l’avait épousée » évite que la relative « qu’il avait épousée » soit momentanément rattachée à « Philippe, son frère ».
  terminology: Les noms (« Hérode », « Hérodiade », « Philippe », « Jean ») et « femme » pour γυνή sont appropriés. « Attacher » rend δέω sans introduire les « chaînes ».
  issues:
