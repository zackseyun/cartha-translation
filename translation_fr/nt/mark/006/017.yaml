source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: fr
  text: Car Hérode lui-même avait envoyé arrêter Jean[a] et l’avait fait attacher en prison à cause d’Hérodiade, la femme de Philippe, son frère, parce qu’il l’avait épousée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant envoyé, il arrêta Jean » ; c’est-à-dire qu’Hérode envoya des hommes pour l’arrêter.'
    reason: La note conserve la construction participiale grecque et explique que l’action est attribuée à Hérode comme donneur d’ordre.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Car Hérode lui-même
  rationale: « Car » marque le lien explicatif avec ce qui précède, et « lui-même » conserve l’emphase qui fait ressortir la responsabilité d’Hérode.
- source_word: ἀποστείλας ἐκράτησεν
  choice: avait envoyé arrêter
  rationale: Le participe aoriste suivi du verbe principal présente Hérode comme l’instigateur de l’arrestation par l’envoi d’agents. Cette tournure française naturelle évite de suggérer qu’il a personnellement saisi Jean.
- source_word: τὸν Ἰωάννην
  choice: Jean
  rationale: Forme française usuelle du nom, sans article devant un nom propre.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: l’avait fait enchaîner en prison
  rationale: La construction factitive rend naturellement la responsabilité d’Hérode et le sens concret de δέω, sans affirmer qu’il a lui-même posé les liens. « Enchaîner » exprime ici la mise sous liens, bien que le grec ne précise pas leur nature.
- source_word: διὰ Ἡρῳδιάδα
  choice: à cause d’Hérodiade
  rationale: διά avec l’accusatif indique ici la cause ou le motif.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: la femme de Philippe, son frère
  rationale: γυνή désigne ici l’épouse. La ponctuation française rattache clairement « son frère » à Philippe.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: qu’il avait épousée
  rationale: Cette relative causale condensée évite la répétition lourde de « parce que » tout en conservant le fait antérieur qui motive l’action d’Hérode.
theological_decisions:
- issue: Qualification morale du mariage d’Hérode
  choice: Décrire le mariage et son lien causal avec l’emprisonnement sans ajouter ici de jugement explicite.
  alternative: Qualifier dès ce verset le mariage d’illégitime ou d’interdit.
  rationale: Le verset rapporte les faits; leur appréciation morale et légale apparaît dans le contexte immédiat. La traduction ne doit pas anticiper ni amplifier cette appréciation.
- issue: Agent concret de l’arrestation et de la mise sous liens
  choice: Présenter Hérode comme l’instigateur, sans prétendre qu’il a agi de ses propres mains.
  alternative: Traduire littéralement de façon à laisser entendre qu’Hérode a personnellement saisi et lié Jean.
  rationale: Le participe ἀποστείλας indique qu’Hérode a envoyé des agents; les verbes principaux peuvent attribuer au dirigeant les actes qu’il fait exécuter.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, évite une syntaxe calquée sur le grec et conserve l’emphase sur la responsabilité d’Hérode.
