    rationale: ἔδησεν indique qu’il fit lier Jean, mais ne précise ni chaînes ni autre instrument de contrainte.
  - severity: low
    issue: La relative finale « qu’il avait épousée » peut être brièvement ambiguë.
    rationale: Après « Philippe, son frère », elle peut grammaticalement sembler se rapporter à Philippe. Une proposition causale avec pronom objet identifie sans ambiguïté Hérodiade comme celle qu’Hérode avait épousée.
