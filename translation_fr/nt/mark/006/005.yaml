id: MRK.6.5
reference: Mark 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: fr
  text: Et il ne pouvait faire là aucun acte de puissance[a], si ce n’est qu’il posa les mains sur quelques malades et les guérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun miracle » ou « aucune œuvre de puissance » ; le grec dit littéralement « aucune puissance », expression employée par Marc pour des actes miraculeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: il ne pouvait
  rationale: Rend directement l’imparfait de δύναμαι et maintient l’affirmation d’une incapacité réelle, sans l’atténuer en simple refus d’agir.
- source_word: ποιῆσαι
  choice: faire
  rationale: Équivalent courant et suffisamment proche de ποιέω; il conserve ici l’expression avec δύναμις sans la surinterpréter.
- source_word: οὐδεμίαν δύναμιν
  choice: aucun acte de puissance
  rationale: Dans Marc, δύναμις peut désigner une manifestation miraculeuse de puissance. « Acte de puissance » garde le lien lexical avec la puissance tout en désignant naturellement une action accomplie.
- source_word: εἰ μὴ
  choice: si ce n’est que
  rationale: Introduit clairement l’exception à la proposition négative précédente et s’enchaîne naturellement avec le geste puis la guérison.
- source_word: ὀλίγοις ἀρρώστοις
  choice: quelques malades
  rationale: Expression française concise et naturelle qui conserve la faible quantité indiquée par ὀλίγοις.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: il posa les mains sur
  rationale: Rend le participe aoriste par un verbe coordonné en français, tout en préservant le geste physique de l’imposition des mains.
- source_word: ἐθεράπευσεν
  choice: les guérit
  rationale: « Guérir » est l’équivalent naturel de θεραπεύω dans ce contexte et le pronom explicite clairement que les quelques malades sont concernés.
theological_decisions:
- issue: Faut-il atténuer οὐκ ἐδύνατο afin d’éviter de suggérer une limitation de Jésus ?
  choice: 'Conserver le sens direct : « il ne pouvait faire là aucun acte de puissance »'
  alternative: « il ne voulut faire là aucun acte de puissance » ou « il ne fit là aucun acte de puissance »
  rationale: Le grec emploie explicitement δύναμαι sous la négation. La traduction préserve donc la tension théologique du récit au lieu de la résoudre en transformant l’incapacité exprimée en absence de volonté.
translation_notes:
  register: Français international moderne, clair et digne. « Acte de puissance » est moins courant que « miracle », mais il préserve le vocabulaire de δύναμις; la note fournit les formulations plus idiomatique et plus littérale. La construction « si ce n’est que » maintient nettement le rapport d’exception.
