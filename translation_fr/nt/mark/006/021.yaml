id: MRK.6.21
reference: Mark 6:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: fr
  text: 'Et un jour propice se présenta[a] : Hérode donna, pour son anniversaire, un banquet à ses hauts dignitaires, aux chefs militaires et aux notables de Galilée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jour favorable se présenta ». Le grec évoque une occasion appropriée, voire stratégique.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux principaux personnages de Galilée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: Conserve le lien narratif et le style paratactique caractéristique de Marc.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: un jour propice se présenta
  rationale: Rend le génitif absolu et la valeur de εὔκαιρος comme occasion favorable ou stratégique dans le récit, tout en restant naturel en français.
- source_word: ὅτε
  choice: ':'
  rationale: Les deux-points introduisent naturellement l'événement qui fait de ce jour l'occasion propice, sans répéter lourdement « quand ».
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: pour son anniversaire
  rationale: Expression française courante désignant l'occasion de la célébration de l'anniversaire.
- source_word: δεῖπνον ἐποίησεν
  choice: donna un banquet
  rationale: Rend idiomatiquement l'expression grecque littérale « fit un repas » et convient au caractère officiel de la réception.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: à ses hauts dignitaires
  rationale: Désigne clairement les personnages de haut rang liés à Hérode, sans supposer précisément une noblesse héréditaire.
- source_word: τοῖς χιλιάρχοις
  choice: aux chefs militaires
  rationale: Communique la fonction de ces officiers supérieurs sans imposer le titre romain technique de tribun.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: aux notables de Galilée
  rationale: Rend les personnes de premier rang de la région dans un français actuel et concis.
- source_word: Ἡρῴδης
  choice: Hérode
  rationale: Forme française consacrée du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. La ponctuation évite le redoublement peu naturel de deux propositions temporelles tout en montrant que le banquet précise en quoi ce jour constituait l'occasion propice.
