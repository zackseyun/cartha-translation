source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: fr
  text: 'Il leur ordonna de ne rien emporter pour la route, sauf un bâton : ni pain, ni sac, ni monnaie de cuivre dans leur ceinture.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρήγγειλεν
  choice: ordonna
  rationale: Le verbe exprime ici une directive revêtue d’autorité. « Ordonna » restitue cette force dans un français naturel, sans ajouter de dureté particulière.
- source_word: μηδὲν αἴρωσιν
  choice: de ne rien prendre
  rationale: Dans le contexte des préparatifs de voyage, cette tournure française rend naturellement l’idée de ne rien emporter.
- source_word: εἰς ὁδὸν
  choice: pour la route
  rationale: Expression idiomatique et concise désignant ce qui serait emporté en vue du déplacement.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: sauf un bâton seulement
  rationale: « Bâton » convient au bâton du voyageur, et « seulement » conserve l’insistance de μόνον ainsi que la légère redondance emphatique du grec.
- source_word: ἄρτον
  choice: pain
  rationale: Le terme concret du grec est conservé plutôt que généralisé en « nourriture ».
- source_word: πήραν
  choice: sac
  rationale: Le mot désigne un sac de voyage ou à provisions. « Sac » est clair et naturel dans le texte principal.
- source_word: ζώνην
  choice: ceinture
  rationale: Le terme désigne la ceinture dans laquelle on pouvait porter de l’argent.
- source_word: χαλκόν
  choice: monnaie de cuivre
  rationale: Le grec désigne littéralement le cuivre, employé par métonymie pour des pièces de cuivre. « Monnaie de cuivre » rend directement le sens contextuel tout en gardant la matière nommée.
