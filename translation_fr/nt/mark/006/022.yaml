id: MRK.6.22
reference: Mark 6:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: fr
  text: 'Lorsque la fille d’Hérodiade[a] entra et dansa, elle plut à Hérode et aux convives allongés à table avec lui[b]. Le roi dit alors à la jeune fille : « Demande-moi ce que tu voudras, et je te le donnerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ou certaines traditions comprennent ici : « sa fille Hérodiade », plutôt que : « la fille d’Hérodiade ». Le texte grec suivi ici porte « la fille d’Hérodiade ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « ceux qui mangeaient avec lui ». Le grec évoque les autres invités du banquet, allongés à table selon l’usage de l’époque.'
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: Lorsque ... entra
  rationale: Le participe aoriste dans le génitif absolu a ici une valeur temporelle. « Lorsque ... entra » restitue naturellement son rapport avec les actions suivantes.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: la fille d’Hérodiade
  rationale: Cette construction au génitif désigne le plus naturellement la jeune fille comme étant la fille d’Hérodiade. La variante ou compréhension concurrente est signalée en note.
- source_word: ὀρχησαμένης
  choice: dansa
  rationale: Le passé simple rend clairement l’action ponctuelle du participe aoriste dans la séquence narrative, sans ajouter de nuance absente du grec.
- source_word: ἀρεσάσης
  choice: elle plut
  rationale: ἀρέσκω signifie directement « plaire ». Cette formulation évite d’intensifier indûment le texte par « ravit » ou « enchanta ».
- source_word: τοῖς συνανακειμένοις
  choice: aux convives allongés à table avec lui
  rationale: Le terme désigne ceux qui partageaient le repas en étant allongés à table, selon l’usage des banquets de l’époque. La traduction conserve cette image concrète.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: Le roi dit alors
  rationale: βασιλεύς est rendu littéralement par « roi », conformément au vocabulaire narratif de Marc. « Alors » assure en français l’enchaînement porté par καί.
- source_word: τῷ κορασίῳ
  choice: à la jeune fille
  rationale: κοράσιον désigne une fille ou une jeune fille. « Jeune fille » est naturel, actuel et convient au contexte sans employer le terme archaïque « jeune fille » au sens de « demoiselle ».
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: Demande-moi ce que tu voudras
  rationale: La tournure conserve l’ampleur ouverte de la demande. Le futur « voudras » est idiomatique dans cette proposition indéfinie et garde la solennité de la promesse.
- source_word: δώσω σοι
  choice: je te le donnerai
  rationale: Le pronom « le » reprend naturellement « ce que tu voudras » et le futur rend directement la promesse grecque.
theological_decisions:
- issue: Titre βασιλεύς appliqué à Hérode Antipas
  choice: le roi
  alternative: le tétrarque Hérode / le souverain
  rationale: La traduction conserve le titre employé par Marc au lieu de lui substituer le titre historique plus technique de « tétrarque ». Elle privilégie ainsi le texte source sans correction harmonisante.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans être archaïque. La formulation demeure proche de la structure grecque tout en évitant un calque lourd du génitif absolu.
