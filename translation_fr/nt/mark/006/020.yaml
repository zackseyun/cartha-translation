id: MRK.6.20
reference: Mark 6:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: fr
  text: En effet, Hérode craignait Jean, car il savait que c’était un homme juste et saint, et il le protégeait. Quand il l’entendait, il restait très perplexe[a], et pourtant il l’écoutait avec plaisir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « il faisait beaucoup de choses », au lieu de : « il restait très perplexe ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: craignait
  rationale: L’imparfait exprime une attitude durable. « Craignait » conserve la force directe du verbe sans la réduire au simple respect.
- source_word: εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον
  choice: car il savait que c’était un homme juste et saint
  rationale: La tournure causale rend naturellement en français la valeur circonstancielle du participe, tandis que « juste et saint » préserve les deux qualifications distinctes.
- source_word: συνετήρει αὐτόν
  choice: il le protégeait
  rationale: Dans le contexte, le verbe indique que Hérode gardait Jean à l’abri du danger; « protégeait » exprime clairement cette nuance.
- source_word: ἀκούσας αὐτοῦ
  choice: Quand il l’entendait
  rationale: Le participe aoriste est rendu par une proposition temporelle idiomatique. L’imparfait français s’accorde avec les verbes principaux à l’imparfait et présente la situation répétée.
- source_word: πολλὰ ἠπόρει
  choice: il restait très perplexe
  rationale: ἠπόρει signifie être dans l’embarras ou ne pas savoir que faire; πολλὰ l’intensifie. « Restait très perplexe » est naturel et garde le trouble intérieur d’Hérode.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: et pourtant il l’écoutait avec plaisir
  rationale: « Avec plaisir » rend ἡδέως, et « pourtant » explicite sobrement le contraste contextuel entre la perplexité d’Hérode et son plaisir à écouter Jean.
theological_decisions:
- issue: Variante textuelle après la mention de l’écoute de Jean par Hérode
  choice: 'Suivre le texte critique SBLGNT : « il restait très perplexe » (ἠπόρει).'
  alternative: « il faisait beaucoup de choses » (ἐποίει).
  rationale: La leçon retenue par le texte critique décrit le trouble d’Hérode et maintient la tension avec le plaisir qu’il prenait à écouter Jean. La variante, qui change sensiblement le sens, est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits rendent les attitudes et actions durables ou répétées; la tension psychologique du texte est conservée sans l’expliquer davantage.
