  - severity: low
    issue: La note présente « Jean-Baptiste » comme l’appellation traditionnelle.
    rationale: Dans cette construction, l’appellation traditionnelle est « Jean le Baptiste ». « Jean-Baptiste » peut être compris comme un prénom composé; la note est donc imprécise et inutile après la correction.
