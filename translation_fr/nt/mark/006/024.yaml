  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: fr
  text: 'Elle sortit et dit à sa mère : « Que dois-je demander ? » Sa mère dit : « La tête de Jean le Baptiste. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Elle sortit et dit
  rationale: Le participe aoriste marque une sortie antérieure à la parole. La coordination française exprime naturellement cette succession immédiate sans alourdir la phrase.
- source_word: Τί αἰτήσωμαι
  choice: Que dois-je demander ?
  rationale: Le subjonctif aoriste délibératif exprime la question de ce qu’elle doit demander; cette formulation est idiomatique et conserve la nuance délibérative.
- source_word: μητρὶ αὐτῆς
  choice: à sa mère
  rationale: Rend directement le datif et le possessif grecs.
- source_word: Τὴν κεφαλήν
  choice: La tête
  rationale: Conserve sans euphémisme l’objet explicite et brutal de la demande.
- source_word: Ἰωάννου τοῦ βαπτίζοντος
  choice: de Jean le Baptiseur
  rationale: Le participe substantivé désigne Jean par son activité caractéristique. « Baptiseur » en transmet le sens tout en évitant que le titre soit compris comme une appartenance confessionnelle moderne.
theological_decisions:
- issue: Traduction de l’épithète βαπτίζων appliquée à Jean
  choice: Jean le Baptiseur
  alternative: Jean-Baptiste
  rationale: « Baptiseur » traduit la valeur active du participe grec. La forme traditionnelle « Jean-Baptiste », très familière en français, est signalée en note afin de préserver l’usage reçu sans masquer le sens lexical.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition grecque de εἶπεν est allégée par « répondit », qui explicite naturellement le tour de parole sans ajouter de contenu. Le discours direct et la violence de la demande sont préservés.
