  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: fr
  text: Quand le soir arriva, le bateau était au milieu de la mer, et lui seul était à terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Quand le soir fut venu
  rationale: Le génitif absolu exprime une circonstance temporelle. Cette formulation naturelle et digne marque l’arrivée du soir sans surinterprétation.
- source_word: πλοῖον
  choice: le bateau
  rationale: Dans le contexte du lac de Galilée, « bateau » est le terme moderne le plus naturel ; « navire » suggérerait une embarcation trop importante.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: au milieu de la mer
  rationale: La formulation conserve directement l’indication de lieu et reste idiomatique en français.
- source_word: θάλασσα
  choice: la mer
  rationale: Bien que la mer de Galilée soit géographiquement un lac, le grec emploie θάλασσα ; « mer » respecte donc le vocabulaire de la source.
- source_word: αὐτὸς μόνος
  choice: lui était seul
  rationale: Le pronom explicite αὐτός, joint à μόνος, met Jésus en contraste avec les disciples dans le bateau. « Lui était seul » préserve cette insistance avec naturel.
- source_word: ἐπὶ τῆς γῆς
  choice: à terre
  rationale: Dans ce contraste avec le bateau en mer, « à terre » rend naturellement la position de Jésus sans imposer le sens plus étroit de « sur la rive ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La structure contrastive du grec est conservée : le bateau est en mer, tandis que Jésus, lui, est seul à terre.'
