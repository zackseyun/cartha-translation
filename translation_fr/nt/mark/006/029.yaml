id: MRK.6.29
reference: Mark 6:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: fr
  text: Quand ses disciples l’apprirent, ils vinrent prendre son corps[a] et le déposèrent dans un tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son cadavre ». Le terme grec désigne précisément un corps mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Quand … l’apprirent
  rationale: Le participe aoriste a ici une valeur temporelle. « Quand … l’apprirent » rend naturellement la succession des faits; le complément implicite est la mort de Jean.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: « Disciples » conserve le sens relationnel habituel de μαθηταί. Dans le contexte immédiat, le possessif renvoie à Jean le Baptiste.
- source_word: ἦλθον
  choice: ils vinrent
  rationale: Rend directement le mouvement d’arrivée exprimé par ἔρχομαι dans ce récit.
- source_word: ἦραν
  choice: prendre
  rationale: Dans ce contexte, αἴρω désigne le fait de prendre et d’emporter le corps. La formulation française reste concise sans exclure l’idée de le soulever.
- source_word: πτῶμα
  choice: corps
  rationale: Le terme grec désigne précisément un corps mort. « Corps » convient au registre funéraire naturel et digne; « cadavre » est signalé en note pour expliciter la force lexicale.
- source_word: ἔθηκαν
  choice: le déposèrent
  rationale: « Déposer » est naturel et digne dans un contexte de mise au tombeau, tout en rendant l’action de placer exprimée par τίθημι.
- source_word: ἐν μνημείῳ
  choice: dans un tombeau
  rationale: μνημεῖον désigne ici un lieu de sépulture; « tombeau » correspond à l’usage néotestamentaire et au contexte.
theological_decisions:
- issue: Référent de « ses disciples »
  choice: Les disciples de Jean le Baptiste
  alternative: Les disciples de Jésus
  rationale: Dans le contexte immédiat, le possessif renvoie à Jean le Baptiste, dont l’exécution vient d’être racontée. Ce sont ses disciples qui récupèrent son corps et l’ensevelissent.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. Le pronom « l’ » dans « l’apprirent » explicite en français l’objet sous-entendu de l’action d’entendre: la nouvelle de la mort de Jean.'
