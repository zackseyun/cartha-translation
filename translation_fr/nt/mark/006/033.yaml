id: MRK.6.33
reference: Mark 6:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: fr
  text: Beaucoup de gens les virent partir et les reconnurent. De toutes les villes[b], ils accoururent à pied[a] vers cet endroit et y arrivèrent avant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par voie de terre », par contraste avec le trajet en barque.
    reason: lexical_alternative
  - marker: b
    text: Ou « de toutes les localités »; le mot grec peut désigner des villes ou des bourgs selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: virent
  rationale: Le passé simple convient au récit et exprime simplement la perception visuelle.
- source_word: ὑπάγοντας
  choice: partir
  rationale: Dans le contexte immédiat du départ en barque, « partir » est naturel sans préciser davantage le mode de déplacement.
- source_word: ἐπέγνωσαν
  choice: les reconnurent
  rationale: Le verbe désigne ici le fait de reconnaître leur identité, et non d’acquérir une connaissance générale.
- source_word: πολλοί
  choice: beaucoup de gens
  rationale: L’adjectif grec est substantivé; l’ajout de « gens » produit un français courant et clarifie qu’il s’agit de personnes.
- source_word: πεζῇ
  choice: à pied
  rationale: Cette expression conserve le contraste implicite avec le trajet en barque; une note signale l’alternative plus large « par voie de terre ».
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: de toutes les villes
  rationale: La formulation garde le sens distributif de πασῶν et le terme usuel « villes », tout en signalant en note que πόλις peut aussi désigner des localités moins importantes.
- source_word: συνέδραμον
  choice: ils accoururent
  rationale: « Accourir » rend à la fois la course rapide vers un même lieu et l’idée de convergence portée par le verbe composé.
- source_word: ἐκεῖ
  choice: vers cet endroit
  rationale: Cette formulation déictique naturelle indique la destination dans le récit; le pronom « y » de la proposition suivante reprend le même lieu.
- source_word: προῆλθον αὐτούς
  choice: y arrivèrent avant eux
  rationale: Dans ce contexte, l’expression signifie qu’ils devancèrent Jésus et les disciples en atteignant le lieu avant eux.
theological_decisions: []
