source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: fr
  text: Il apporta la tête de Jean sur un plat[a] et la donna à la jeune fille ; la jeune fille la donna à sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un plateau ». Le grec πίναξ désigne un plat ou un plateau de service.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: apporta
  rationale: L’aoriste de φέρω décrit ici le fait d’apporter concrètement la tête tranchée dans le cadre du banquet. « Apporta » est naturel et ne précise pas indûment la manière de la transporter.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: la tête de Jean
  rationale: Le pronom renvoie à Jean-Baptiste dans le contexte précédent. Répéter son nom lève en français une possible ambiguïté du possessif tout en conservant le référent contextuel.
- source_word: ἐπὶ πίνακι
  choice: sur un plat
  rationale: πίναξ désigne un plat ou plateau de service. « Sur un plat » convient au contexte du banquet et reste courant en français moderne.
- source_word: ἔδωκεν
  choice: donna
  rationale: Le verbe δίδωμι signifie directement « donner ». La répétition de « donna » dans les deux propositions reproduit la répétition narrative grecque.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: à la jeune fille / la jeune fille
  rationale: κοράσιον désigne une fille, généralement jeune. « Jeune fille » est naturel, digne et évite les termes archaïques.
- source_word: τῇ μητρὶ αὐτῆς
  choice: à sa mère
  rationale: 'Cette formulation française idiomatique conserve clairement la chaîne de transmission : la jeune fille remet la tête à sa propre mère.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et sobre. Le point-virgule distingue les deux remises successives sans alourdir la phrase. Le nom « Jean » explicite le référent du pronom grec, qui pourrait autrement être moins clair en français.
