id: MRK.6.12
reference: Mark 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξελθόντες ⸀ἐκήρυξαν ἵνα ⸀μετανοῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: fr
  text: Ils partirent et proclamèrent que les gens devaient se repentir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « qu’ils se repentent » ; le sujet sous-entendu désigne ceux qui entendaient leur proclamation.'
    reason: alternative lexicale et clarification du sujet implicite
lexical_decisions:
- source_word: Καὶ
  choice: et
  rationale: La conjonction coordonne simplement ce verset au récit précédent, sans imposer une nuance temporelle ou logique supplémentaire.
- source_word: ἐξελθόντες
  choice: ils partirent
  rationale: Le participe aoriste désigne le départ des disciples. Une forme verbale conjuguée donne en français un récit naturel tout en conservant l’action préalable à la proclamation.
- source_word: ἐκήρυξαν
  choice: proclamèrent
  rationale: Le verbe κηρύσσω évoque une annonce publique. « Proclamer » en garde la force sans introduire les associations ecclésiastiques que peut porter « prêcher ».
- source_word: ἵνα
  choice: que
  rationale: Dans cette construction, ἵνα introduit la réponse visée par la proclamation. « Proclamèrent que… » rend naturellement cette relation en français.
- source_word: μετανοῶσιν
  choice: devaient se repentir
  rationale: Μετανοέω désigne ici la repentance, c’est-à-dire une réorientation intérieure et concrète. « Se repentir » demeure la formulation française la plus concise et théologiquement adéquate, sans réduire le sens à un simple changement d’opinion.
theological_decisions:
- issue: Explicitation du sujet sous-entendu de μετανοῶσιν
  choice: que les gens devaient se repentir
  alternative: qu’ils se repentent
  rationale: Le sujet pluriel sous-entendu renvoie aux personnes qui entendent la proclamation, et non aux disciples. « Les gens » lève en français une ambiguïté possible sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Se repentir » conserve la portée du terme grec, tandis que la note signale la formulation plus littérale et son ambiguïté grammaticale.
