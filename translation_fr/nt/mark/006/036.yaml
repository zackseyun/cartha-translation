source:
  edition: SBLGNT
  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: fr
  text: Renvoie-les[a], pour qu’ils aillent dans les campagnes et les villages des environs s’acheter de quoi manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Congédie-les, afin qu’ils se rendent dans les champs et les villages des environs pour y acheter de quoi manger. »'
    reason: Alternative lexicale et syntaxique plus formelle pour ἀπόλυσον et ἀπελθόντες, avec « champs » comme rendu plus concret possible de ἀγρούς.
lexical_decisions:
- source_word: ἀπόλυσον
  choice: Renvoie-les
  rationale: Dans ce contexte, l’impératif signifie congédier ou faire partir la foule. « Renvoie-les » exprime naturellement en français moderne la directive adressée à Jésus.
- source_word: ἵνα
  choice: pour que
  rationale: Introduit ici le but recherché, rendu clairement et naturellement par « pour que ».
- source_word: ἀπελθόντες
  choice: ils aillent
  rationale: Le participe aoriste marque le départ préalable à l’achat. Son intégration à la proposition finale évite une tournure pesante tout en conservant la séquence logique.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: les campagnes et les villages des environs
  rationale: ἀγροί peut désigner les champs, les fermes ou les zones rurales; « campagnes » convient aux lieux ruraux environnants, tandis que κῶμαι désigne les villages. « Des environs » rend κύκλῳ.
- source_word: ἀγοράσωσιν ἑαυτοῖς
  choice: s’acheter
  rationale: Le verbe exprime l’achat et le pronom réfléchi au datif indique que la nourriture est destinée à eux-mêmes; « s’acheter » restitue les deux éléments avec naturel.
- source_word: τί φάγωσιν
  choice: de quoi manger
  rationale: Cette expression française idiomatique conserve la valeur indéfinie de τί et désigne ce qu’ils pourront manger.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la force impérative et la relation de but sans reproduire mécaniquement la construction participiale grecque.
