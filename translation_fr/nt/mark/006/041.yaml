  terminology: « Pains », « poissons », « ciel », « disciples », « bénédiction » et « foule » conviennent au français international moderne et au contexte évangélique. La note conserve correctement « rendit grâce » comme possibilité contextuelle, sans la substituer au verbe grec εὐλογέω.
