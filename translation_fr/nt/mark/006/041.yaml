id: MRK.6.41
reference: Mark 6:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: fr
  text: Puis il prit les cinq pains et les deux poissons. Levant les yeux vers le ciel, il prononça la bénédiction[a], rompit les pains et les donna au fur et à mesure à ses disciples pour qu’ils les servent à la foule. Il partagea aussi les deux poissons entre tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il rendit grâce ». Le verbe grec signifie littéralement « bénir » ; dans le contexte d’un repas, son sens peut recouper celui de l’action de grâce.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: Puis il prit
  rationale: Le participe aoriste introduit une nouvelle étape de la séquence. Une proposition coordonnée est plus naturelle en français moderne qu’un participe présent ambigu.
- source_word: τοὺς πέντε ἄρτους
  choice: les cinq pains
  rationale: Ἄρτος désigne ici des pains comptés individuellement; «pains» est la formulation française naturelle.
- source_word: τοὺς δύο ἰχθύας
  choice: les deux poissons
  rationale: Rendu direct du groupe nominal grec.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: Levant les yeux vers le ciel
  rationale: Expression idiomatique qui conserve le mouvement du regard et la portée du terme οὐρανός.
- source_word: εὐλόγησεν
  choice: il prononça la bénédiction
  rationale: Le grec emploie εὐλογέω sans objet exprimé. Cette formulation conserve l’idée de bénédiction dans un contexte de repas sans affirmer explicitement que les aliments en sont l’objet.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: rompit les pains
  rationale: Rendu concret et direct du verbe et de son objet explicite.
- source_word: ἐδίδου
  choice: les donna au fur et à mesure
  rationale: L’imparfait grec peut exprimer une action continue ou répétée pendant la distribution; «au fur et à mesure» en restitue naturellement l’aspect.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: Le possessif αὐτοῦ est explicitement rendu.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: pour qu’ils les servent aux gens
  rationale: La proposition exprime le but. Dans ce contexte de repas, παρατίθημι signifie présenter ou servir; «aux gens» clarifie le référent de αὐτοῖς, c’est-à-dire la foule, sans changer le sens.
- source_word: ἐμέρισεν πᾶσιν
  choice: partagea aussi … entre tous
  rationale: Μερίζω indique la répartition; πᾶσιν inclut toutes les personnes présentes. «Aussi» rend le καί initial de la dernière proposition.
theological_decisions:
- issue: Sens de εὐλόγησεν dans le contexte du repas
  choice: il prononça la bénédiction
  alternative: il rendit grâce
  rationale: Le verbe grec est εὐλογέω («bénir»), dont le sens peut rejoindre celui de l’action de grâce dans un contexte de repas. Le choix principal reste lexicalement transparent tout en évitant d’ajouter un objet direct absent du grec.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe grecque longue est divisée en phrases plus naturelles. «Les gens» désigne clairement la foule mentionnée dans le contexte, tandis que «entre tous» conserve l’ampleur inclusive de πᾶσιν.
