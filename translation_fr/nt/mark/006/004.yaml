  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: fr
  text: 'Jésus leur disait : « Un prophète n’est pas honoré, sauf dans sa patrie[a], parmi sa parenté[b] et dans sa maison[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lieu d’origine » ou « pays natal ». Le grec désigne le lieu auquel une personne appartient par son origine ; ici, le contexte renvoie à Nazareth.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi ses proches » ou « parmi les membres de sa famille ». Le terme grec désigne les personnes appartenant au même groupe de parenté.
    reason: lexical_alternative
  - marker: c
    text: Ou « maisonnée ». Le grec peut désigner la maison elle-même ou les personnes qui en font partie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait français rend naturellement l’aspect imperfectif du verbe grec dans le récit, sans imposer l’idée plus forte d’une répétition continuelle.
- source_word: προφήτης
  choice: prophète
  rationale: Équivalent français usuel et direct du terme grec.
- source_word: ἄτιμος
  choice: méprisé
  rationale: Dans la tournure proverbiale « n’est… que », ce choix exprime naturellement le manque d’honneur ou de considération, sans exiger la formulation moins idiomatique « sans honneur ».
- source_word: εἰ μὴ
  choice: ne… que
  rationale: Après la négation, cette tournure française exprime clairement l’exception portée par εἰ μή.
- source_word: πατρίδι
  choice: patrie
  rationale: Le mot conserve la portée de πατρίς comme lieu d’origine, tout en laissant le contexte de Nazareth préciser qu’il s’agit ici du pays ou de la localité d’origine.
- source_word: συγγενεῦσιν
  choice: gens de sa parenté
  rationale: Cette expression moderne désigne le cercle de parenté et le distingue de la maison ou maisonnée mentionnée ensuite.
- source_word: οἰκίᾳ
  choice: maison
  rationale: Le terme grec peut désigner soit la demeure, soit ceux qui la composent. « Sa propre maison » préserve cette ambiguïté en français.
- source_word: καὶ ... καὶ ... καὶ
  choice: dans… parmi… et dans
  rationale: La coordination conserve l’accumulation des trois cercles de proximité, avec les prépositions naturelles requises en français.
theological_decisions:
- issue: Portée du proverbe de Jésus sur l’honneur accordé au prophète
  choice: Présenter la parole comme un proverbe général que le contexte applique à Jésus, sans expliciter davantage son identité messianique ni la cause du rejet.
  alternative: Paraphraser en indiquant explicitement que Jésus se désigne comme le Messie rejeté, ou transformer la parole en affirmation générale sur l’incrédulité.
  rationale: Le grec énonce une maxime au sujet d’un prophète. La traduction doit en préserver l’application implicite à Jésus sans ajouter une interprétation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure proverbiale « n’est méprisé que » est naturelle et garde le contraste honneur-déshonneur. Les trois cercles — patrie, parenté, maison — sont maintenus, ainsi que l’ambiguïté de οἰκία.
