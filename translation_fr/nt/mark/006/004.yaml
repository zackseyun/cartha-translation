    rationale: « Méprisé » évoque le dédain ou le rejet actif, alors que ἄτιμος signifie d’abord dépourvu d’honneur ou de considération. Il faut éviter de renforcer la portée du proverbe.
  - severity: low
    issue: « les gens de sa parenté »
    rationale: L’expression est compréhensible, mais « sa parenté » est plus naturelle et rend directement συγγενεῦσιν sans alourdir la phrase.
  - severity: low
    issue: « sa propre maison »
    rationale: « Propre » ajoute une insistance absente du grec. Le possessif « sa » rend déjà αὐτοῦ; « maison » laisse l’ambiguïté lexicale intacte.
