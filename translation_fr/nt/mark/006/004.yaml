  source_fidelity: 'La structure et les trois cercles de proximité sont bien rendus, de même que l’imparfait « disait ». Toutefois, « méprisé » est plus fort et plus spécifique que ἄτιμος (« sans honneur », « non honoré ») : le grec n’affirme pas nécessairement le mépris actif. « N’est pas honoré, sauf… » restitue plus exactement la maxime négative avec exception.'
  naturalness: La formulation révisée demeure idiomatique en français international moderne et conserve le ton proverbial. « Parmi sa parenté » est plus fluide et plus direct que « parmi les gens de sa parenté ».
  terminology: « Prophète », « patrie », « parenté » et « maison » sont appropriés. « Maison » préserve utilement l’ambiguïté de οἰκία entre bâtiment et unité domestique, explicitée en note.
