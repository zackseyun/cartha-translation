  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: fr
  text: 'Et il lui jura : « Quoi que tu me demandes, je te le donnerai, jusqu’à la moitié de mon royaume[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cette offre royale est une formule emphatique : elle exprime une très grande générosité, sans signifier nécessairement qu’Hérode pouvait ou comptait céder littéralement la moitié de son royaume.'
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν αὐτῇ
  choice: il lui jura
  rationale: L’aoriste de ὀμνύω exprime ici un serment solennel adressé à la jeune fille. « Il lui jura » est naturel, concis et conserve la force de l’engagement.
- source_word: Ὅ τι ἐάν
  choice: Quoi que
  rationale: Cette construction relative avec ἐάν introduit un objet indéfini et sans restriction. « Quoi que » en restitue naturellement l’ouverture en français.
- source_word: με αἰτήσῃς
  choice: tu me demandes
  rationale: αἰτέω signifie demander ou solliciter. La formulation française convient au discours direct et garde la personne sollicitée comme complément.
- source_word: δώσω σοι
  choice: je te le donnerai
  rationale: Le futur de δίδωμι exprime une promesse. Le pronom « le » reprend naturellement en français ce qui sera demandé, implicite comme objet du verbe grec.
- source_word: ἕως ἡμίσους
  choice: jusqu’à la moitié
  rationale: ἕως indique ici une limite quantitative et non temporelle. « Jusqu’à la moitié » en rend exactement la portée.
- source_word: τῆς βασιλείας μου
  choice: de mon royaume
  rationale: Dans cette offre royale, βασιλεία désigne le plus naturellement le domaine sur lequel le souverain exerce son pouvoir. « Royaume » préserve aussi la formulation traditionnelle sans lui imposer un sens théologique technique.
theological_decisions:
- issue: Sens de βασιλεία dans les paroles d’Hérode
  choice: royaume
  alternative: règne ; autorité royale
  rationale: Le mot peut désigner l’exercice du pouvoir ou le territoire gouverné. Dans la formule d’offre rapportée ici, « royaume » rend le mieux l’image concrète et l’exagération royale, sans transformer le terme en concept théologique.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque tout en employant une reprise pronominale naturelle (« je te le donnerai »). Le serment et l’ampleur hyperbolique de l’offre sont conservés.
