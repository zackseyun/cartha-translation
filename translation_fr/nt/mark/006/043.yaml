  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: fr
  text: Ils ramassèrent douze paniers pleins de morceaux[a], ainsi que du poisson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « des morceaux, de quoi remplir douze paniers ». L’expression grecque associe littéralement les « morceaux », les « douze paniers » et ce qui les remplit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: ils ramassèrent
  rationale: Dans le contexte de la collecte après le repas, αἴρω désigne l’action de recueillir ce qui reste. « Ramassèrent » est naturel et concret en français.
- source_word: κλάσματα
  choice: morceaux
  rationale: κλάσματα désigne des morceaux détachés ou rompus, ici principalement du pain. « Morceaux » est clair et courant; « fragments » serait plus soutenu.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: douze paniers pleins
  rationale: Cette formulation française rend naturellement à la fois les douze contenants et leur remplissage, tout en restant proche de la construction grecque.
- source_word: κόφινος
  choice: panier
  rationale: « Panier » est le terme générique approprié. Préciser sa forme ou sa taille irait au-delà de ce qu’exige le verset.
- source_word: πληρώματα
  choice: pleins
  rationale: Dans ce contexte, πλήρωμα évoque la quantité qui remplit chaque panier. L’adjectif « pleins » exprime cette idée avec naturel.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: ainsi que des morceaux de poisson
  rationale: 'ἀπό indique ici la provenance ou une valeur partitive: une partie de ce qui fut recueilli provenait aussi des poissons. La reprise de « morceaux » évite de suggérer que des poissons entiers ont été ramassés.'
