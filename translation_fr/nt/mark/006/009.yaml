id: MRK.6.9
reference: Mark 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: fr
  text: mais chaussez-vous de sandales et ne mettez pas deux tuniques.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque le contraste avec les consignes de voyage précédentes; « mais » est ici l’adversatif français le plus naturel et concis.
- source_word: ὑποδεδεμένους
  choice: chaussez-vous de
  rationale: Le participe parfait de ὑποδέομαι, employé avec une valeur impérative, décrit le fait d’avoir les pieds chaussés. « Chaussez-vous de sandales » rend naturellement cette consigne en français.
- source_word: σανδάλια
  choice: sandales
  rationale: Équivalent direct, précis et courant du nom grec au pluriel.
- source_word: μὴ ἐνδύσησθε
  choice: ne mettez pas
  rationale: L’aoriste moyen au subjonctif avec μή exprime une défense. « Ne mettez pas » conserve l’idée de l’action de se vêtir plutôt que celle, statique, de porter.
- source_word: δύο
  choice: deux
  rationale: Le numéral est rendu directement.
- source_word: χιτῶνας
  choice: tuniques
  rationale: Le χιτών est un vêtement de base porté près du corps. « Tuniques » reste précis sans recourir à l’anachronique « chemises » ni au trop général « vêtements ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure impérative « chaussez-vous de » restitue naturellement la valeur directive du participe grec; « tuniques » conserve la précision historique du vêtement.
