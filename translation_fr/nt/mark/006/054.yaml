  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: fr
  text: Quand ils furent sortis de la barque[a], les gens le reconnurent aussitôt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec enchaîne littéralement : « eux étant sortis de la barque, l’ayant aussitôt reconnu… » La première expression est un génitif absolu ; le sujet du participe « ayant reconnu » n’est pas exprimé. D’après le contexte, il s’agit des gens de l’endroit.'
    reason: La note signale la construction grecque inhabituelle et l’identité contextuelle du sujet sans laisser entendre que le participe reprend nécessairement le sujet du génitif absolu.
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: quand ils furent sortis
  rationale: Le génitif absolu exprime ici une circonstance temporelle. Cette formulation française naturelle conserve l’idée que leur sortie de la barque précède la reconnaissance.
- source_word: πλοίου
  choice: barque
  rationale: Dans le contexte du lac de Galilée, πλοῖον désigne une embarcation relativement petite ; « barque » est le terme courant et traditionnellement intelligible en français.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » restitue avec concision la force de l’adverbe fréquent chez Marc et porte naturellement sur la reconnaissance.
- source_word: ἐπιγνόντες
  choice: reconnurent
  rationale: Le verbe indique que les habitants identifient Jésus en le voyant, et non qu’ils acquièrent simplement une connaissance à son sujet.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie à Jésus dans le contexte immédiat ; le pronom français évite de répéter son nom sans nécessité.
- source_word: sujet implicite de ἐπιγνόντες
  choice: les gens
  rationale: Le participe nominatif pluriel ne peut pas reprendre directement le αὐτῶν au génitif du génitif absolu. Le contexte du verset suivant indique que les habitants du lieu reconnaissent Jésus ; le français exige ici un sujet explicite.
theological_decisions:
- issue: Identification du sujet qui reconnaît Jésus
  choice: les gens le reconnurent
  alternative: ils le reconnurent, en laissant l’identité du sujet moins explicite
  rationale: Il s’agit d’une décision syntaxique et contextuelle, non doctrinale. Le grec laisse le sujet du participe nominatif pluriel inexprimé, tandis que la suite du récit désigne les habitants de la région. « Les gens » rend ce référent clair sans le définir plus précisément que le contexte.
translation_notes:
  register: Français international moderne, narratif et digne. « Barque » convient au cadre galiléen ; « les gens » explicite sobrement le sujet imposé par le contexte, tandis que la note signale qu’il n’est pas formulé dans le grec.
