  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: fr
  text: Aussitôt, le roi envoya un garde chargé des exécutions[a] et lui ordonna d’apporter la tête de Jean. Le garde partit, décapita Jean dans la prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un garde » ou « un garde du corps » ; le grec emploie un mot emprunté au latin (spekoulatōr) pour désigner un membre de la garde du souverain, qui remplit ici la fonction d’exécuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Exprime avec naturel la promptitude caractéristique du récit de Marc.
- source_word: βασιλεὺς
  choice: le roi
  rationale: Préserve la désignation narrative de Marc, sans la corriger selon le titre historique de tétrarque porté par Hérode Antipas.
- source_word: σπεκουλάτορα
  choice: un garde chargé des exécutions
  rationale: Le terme grec, emprunté au latin, désigne un membre de la garde du souverain qui remplit ici la fonction d’exécuteur. Cette formulation conserve à la fois son statut de garde et son rôle dans la scène.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: lui ordonna d’apporter
  rationale: Rend naturellement en français la construction infinitive et la force explicite du commandement.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: la tête de Jean
  rationale: L’explicitation du référent est naturelle en français et évite que le possessif soit momentanément rattaché au garde.
- source_word: ἀπεκεφάλισεν
  choice: décapita
  rationale: Équivalent français direct et courant du verbe grec, adapté au registre narratif.
- source_word: ἐν τῇ φυλακῇ
  choice: dans la prison
  rationale: Conserve le lieu concret et défini indiqué par l’article grec.
