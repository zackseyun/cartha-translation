  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: fr
  text: 'Car ils le virent tous et furent troublés. Aussitôt, il leur adressa la parole et leur dit : « Prenez courage ! C’est moi[a]. N’ayez pas peur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « moi, je suis ». L’expression grecque sert à s’identifier (« c’est moi ») et peut aussi, selon le contexte, évoquer plus fortement « je suis ».'
    reason: Signaler la formulation explicite ἐγώ εἰμι et son interprétation discutée, tout en conservant dans le texte une identification française idiomatique et sans imposer de lecture théologique.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: furent bouleversés
  rationale: Le verbe exprime un profond trouble ou bouleversement; cette formulation moderne conserve l’intensité sans préciser abusivement la nature de la réaction.
- source_word: Θαρσεῖτε
  choice: Courage !
  rationale: Impératif idiomatique et direct qui appelle les disciples à reprendre courage.
- source_word: ἐγώ εἰμι
  choice: Moi, je suis
  rationale: Rend distinctement les deux éléments grecs et préserve la possibilité d’une simple identification comme celle d’une résonance théologique, sans trancher silencieusement en faveur de « c’est moi ».
- source_word: μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Expression française naturelle correspondant à l’interdiction au présent et adaptée à une parole rassurante.
theological_decisions:
- issue: Portée de ἐγώ εἰμι
  choice: Moi, je suis
  alternative: C’est moi
  rationale: « C’est moi » serait plus idiomatique comme identification, mais atténuerait une possible résonance absolue de « je suis ». Le texte principal conserve donc l’ambiguïté et la note explique l’usage possible.
translation_notes:
  register: Français international moderne, direct et digne. Le présent historique de λέγει est rendu au passé (« dit ») pour la fluidité narrative; εὐθύς est conservé par « aussitôt ». Le pronom renforcé « Moi » rend l’emphase explicite de ἐγώ.
