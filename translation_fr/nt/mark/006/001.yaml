id: MRK.6.1
reference: Mark 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: fr
  text: Il partit de là et se rendit dans sa ville natale[a]. Ses disciples le suivirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Il se rend dans sa ville natale, et ses disciples le suivent » ; le grec emploie ici des présents historiques qui donnent plus de vivacité au récit.'
    reason: Alternative stylistique reflétant les présents historiques grecs.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: partit
  rationale: L’aoriste exprime le départ du lieu précédent. « Partit » est naturel en français narratif et restitue clairement le mouvement sans alourdir la phrase.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Cette expression rend directement et naturellement l’adverbe de lieu qui indique le point de départ.
- source_word: ἔρχεται
  choice: se rendit
  rationale: Le présent historique grec est transposé au passé simple, temps naturel du récit écrit en français. « Se rendit » exprime clairement le déplacement vers la destination.
- source_word: πατρίδα
  choice: lieu d’origine
  rationale: πατρίς désigne ici l’endroit dont Jésus est originaire. « Lieu d’origine » reste naturel tout en évitant de préciser indûment s’il s’agit strictement de la ville ou de la région natale.
- source_word: ἀκολουθοῦσιν
  choice: suivirent
  rationale: Le présent historique est rendu au passé simple. « Suivre » conserve à la fois le déplacement concret et le vocabulaire caractéristique de la relation des disciples avec Jésus.
- source_word: μαθηταὶ
  choice: disciples
  rationale: « Disciples » est le terme français courant qui préserve les dimensions d’apprentissage, d’attachement et de relation au maître.
theological_decisions:
- issue: Traduction des présents historiques ἔρχεται et ἀκολουθοῦσιν
  choice: 'Passé simple : « se rendit » et « suivirent »'
  alternative: 'Présent historique : « se rend » et « suivent »'
  rationale: Il s’agit d’un choix narratif, non doctrinal. Le passé simple donne un récit français fluide, tandis qu’une note signale la vivacité des présents grecs sans effacer cette caractéristique du texte source.
- issue: Étendue géographique de πατρίς
  choice: « lieu d’origine »
  alternative: « ville d’origine » ou « région natale »
  rationale: Le contexte renvoie à Nazareth et à ses environs, mais le nom grec n’impose pas à lui seul une délimitation exacte. La traduction conserve donc cette latitude.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La répétition simple des propositions respecte le rythme de Marc, et « lieu d’origine » préserve l’étendue possible de πατρίς.
