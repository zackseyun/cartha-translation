id: MRK.6.7
reference: Mark 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: fr
  text: Il appela les Douze et se mit à les envoyer deux par deux[a] ; il leur donnait autorité[b] sur les esprits impurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par groupes de deux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pouvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεῖται
  choice: appela
  rationale: Le présent historique de Marc est rendu au passé simple, temps naturel du récit écrit en français, afin d’éviter une rupture maladroite avec l’aoriste ἤρξατο. Le verbe exprime ici l’appel des Douze auprès de Jésus.
- source_word: τοὺς δώδεκα
  choice: les Douze
  rationale: La majuscule fait ressortir qu’il s’agit de la désignation reconnue du groupe choisi par Jésus, sans ajouter « disciples » au texte.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: se mit à les envoyer
  rationale: Cette tournure française naturelle exprime le commencement de l’action et conserve le sens missionnaire d’ἀποστέλλω sans introduire le titre « apôtres ».
- source_word: δύο δύο
  choice: deux par deux
  rationale: L’expression idiomatique conserve la répétition distributive et le rythme du grec.
- source_word: ἐδίδου
  choice: leur donnait
  rationale: L’imparfait restitue l’aspect imperfectif du verbe grec et présente le don d’autorité comme accompagnant l’envoi.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: « Autorité » exprime mieux qu’une simple puissance la capacité légitime et conférée d’agir sur les esprits.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: les esprits impurs
  rationale: Cette formulation conserve la terminologie de Marc. En français moderne, « impurs » est plus naturel ici que « souillés », tout en maintenant la catégorie religieuse et spirituelle du grec.
theological_decisions:
- issue: Nature du don fait aux Douze dans ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: une autorité sur les esprits impurs
  alternative: un pouvoir sur les esprits impurs
  rationale: « Autorité » préserve l’idée d’une capacité légitime conférée par Jésus, tandis que « pouvoir » pourrait être compris comme une puissance intrinsèque. La variante est toutefois signalée, car ἐξουσία peut aussi mettre l’accent sur la capacité effective.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit ; l’imparfait de « donnait » préserve l’aspect du grec. Le point-virgule allège la succession des coordinations sans modifier le rapport entre les actions.
