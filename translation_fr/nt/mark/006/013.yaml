id: MRK.6.13
reference: Mark 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: fr
  text: Ils chassaient beaucoup de démons et appliquaient de l’huile[a] à beaucoup de malades, et les guérissaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’huile d’olive ».'
    reason: Le grec peut désigner plus explicitement l’huile d’olive, courante dans le monde méditerranéen ancien, bien que « huile » suffise dans le texte principal.
lexical_decisions:
- source_word: δαιμόνια
  choice: démons
  rationale: Le nom désigne ici des êtres spirituels mauvais. « Démons » est l’équivalent français direct et n’importe pas la formulation différente « esprits impurs ».
- source_word: πολλὰ
  choice: beaucoup de
  rationale: L’expression rend simplement la valeur quantitative de l’adjectif neutre pluriel qui qualifie les démons.
- source_word: ἐξέβαλλον
  choice: chassaient
  rationale: L’imparfait français exprime naturellement l’action répétée ou continue de l’imparfait grec dans ce résumé narratif.
- source_word: ἤλειφον
  choice: oignaient
  rationale: Le verbe signifie appliquer une substance en l’étendant, ici de l’huile. « Oignaient » conserve le geste décrit et l’imparfait itératif.
- source_word: ἐλαίῳ
  choice: d’huile
  rationale: Le terme désigne de l’huile, ordinairement de l’huile d’olive dans ce contexte méditerranéen. Le texte principal garde le terme non spécifié du grec.
- source_word: ἀρρώστους
  choice: malades
  rationale: L’adjectif substantivé désigne des personnes malades. « Beaucoup de malades » est naturel et fidèle en français moderne.
- source_word: ἐθεράπευον
  choice: qu’ils guérissaient
  rationale: Le verbe signifie guérir. La proposition relative rattache clairement l’action aux malades et l’imparfait en préserve le caractère répété.
- source_word: καὶ
  choice: et
  rationale: La coordination simple respecte l’enchaînement paratactique du grec.
theological_decisions:
- issue: Rôle de l’onction d’huile dans la guérison
  choice: Décrire l’onction et la guérison comme des actions associées sans préciser leur mécanisme théologique.
  alternative: Présenter soit l’huile comme cause efficace de la guérison, soit l’onction comme un geste purement symbolique.
  rationale: Le verset rapporte que les disciples oignaient les malades d’huile et les guérissaient, mais il n’explique ni le rôle exact de l’huile ni un éventuel mécanisme sacramentel. La formulation conserve cette réserve.
translation_notes:
  register: Français international moderne, simple et digne. Les imparfaits rendent la série d’actions habituelles ou répétées du résumé grec. Le marqueur de note est placé après « huile », le mot auquel porte réellement la variante lexicale.
