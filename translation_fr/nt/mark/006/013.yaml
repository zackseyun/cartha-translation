  source_fidelity: Le projet rend correctement la coordination des trois actions, les deux imparfaits grecs à valeur descriptive ou répétée, « beaucoup », « démons », l’huile non spécifiée et les malades guéris. La reprise pronominale explicite (« les guérissaient ») correspond bien à πολλοὺς ἀρρώστους.
