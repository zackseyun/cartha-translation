id: MRK.6.34
reference: Mark 6:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: fr
  text: Quand Jésus débarqua, il vit une grande foule et fut saisi de compassion pour eux, parce qu’ils étaient comme des brebis sans berger[a]. Alors il se mit à leur enseigner beaucoup de choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image des « brebis sans berger » reprend un langage biblique décrivant un peuple privé d’une direction fidèle; voir Nombres 27.17; 1 Rois 22.17; Ézéchiel 34.5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Quand Jésus débarqua
  rationale: Le participe signifie littéralement « étant sorti ». Dans le contexte immédiat d’une traversée en barque (Mc 6.32-33), « débarqua » exprime naturellement la sortie de la barque. Le nom « Jésus » explicite en français le sujet implicite sans ajouter de contenu.
- source_word: εἶδεν πολὺν ὄχλον
  choice: il vit une grande foule
  rationale: Rendu direct et idiomatique de l’aoriste εἶδεν et de πολὺν ὄχλον, qui souligne l’importance numérique de la foule.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτούς
  choice: fut saisi de compassion pour eux
  rationale: Le verbe exprime une compassion profonde et viscérale. Cette tournure française conserve son intensité tout en employant la préposition idiomatique « pour ».
- source_word: ὅτι
  choice: parce que
  rationale: Introduit clairement la raison de la compassion de Jésus.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: comme des brebis sans berger
  rationale: Conserve sans l’expliciter la métaphore pastorale et son arrière-plan scripturaire.
- source_word: ἤρξατο διδάσκειν
  choice: il se mit à enseigner
  rationale: Rend naturellement en français la construction ingressive « il commença à enseigner ».
- source_word: αὐτοὺς πολλά
  choice: leur enseigner beaucoup de choses
  rationale: πολλά désigne ici naturellement le contenu abondant de l’enseignement; « beaucoup de choses » en maintient la portée sans le réduire à la seule durée.
theological_decisions:
- issue: Image pastorale des brebis privées de berger
  choice: Conserver « comme des brebis sans berger » dans le texte principal.
  alternative: Développer en « comme un peuple privé de responsables spirituels fidèles ».
  rationale: La formulation fait écho au langage biblique concernant un peuple dépourvu de direction fidèle, mais la traduction doit préserver l’image ainsi que sa richesse théologique sans en imposer une interprétation explicative.
translation_notes:
  register: Français international moderne, naturel et digne. « Débarqua » s’appuie sur le contexte narratif de la barque; « fut saisi de compassion » restitue l’intensité du grec; la métaphore pastorale est maintenue sans développement doctrinal.
