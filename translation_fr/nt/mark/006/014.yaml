review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens sont bien rendus : Hérode apprend la nouvelle, la renommée de Jésus explique cette information, et l’opinion rapportée attribue ses actes à Jean revenu d’entre les morts. Toutefois, « a été relevé » est moins naturel et moins précis en français de résurrection que « a été ressuscité », tout en conservant le passif parfait grec. « Les puissances » rend aussi plus directement l’article défini grec que « ces puissances ».'
  naturalness: Le français est globalement fluide et de registre approprié. « Jean, celui qui baptisait » est intelligible mais un peu lourd dans une désignation devenue titulaire ; « Jean le Baptiseur » conserve la valeur participiale tout en étant plus resserré. La note maintient la forme traditionnelle.
  terminology: « Le roi Hérode », « en entendit parler », « le nom de Jésus », « en lui » et « sont à l’œuvre » conviennent. « Ressuscité » est le terme français usuel et théologiquement non surinterprétatif pour ἐγήγερται, à condition de garder la tournure passive « a été ressuscité ».
  issues:
  - severity: medium
    issue: « a été relevé d’entre les morts »
    rationale: Bien que « relevé » puisse reproduire l’image de ἐγείρω, il est peu idiomatique dans le français moderne pour une résurrection et peut évoquer un simple relèvement. « A été ressuscité d’entre les morts » est naturel, maintient explicitement le passif grec et ne nomme pas l’agent.
  - severity: low
    issue: « ces puissances »
    rationale: Le grec porte l’article défini αἱ, non un démonstratif. « Les puissances » est plus direct et reste suffisamment naturel dans cette formulation.
  - severity: low
    issue: « Jean, celui qui baptisait »
    rationale: La périphrase est possible, mais elle est plus lourde que nécessaire et son imparfait peut faire entendre une simple activité passée. « Jean le Baptiseur » exprime de manière plus compacte la désignation participiale ; la note peut conserver « Jean-Baptiste ».
