revisions:
- from: 'Le roi Hérode en entendit parler, car le nom de Jésus[a] était devenu bien connu. On disait : « Jean, celui qui baptisait[b], a été relevé d’entre les morts[c] ; c’est pour cela que ces puissances[d] sont à l’œuvre en lui. »'
  to: 'Le roi Hérode en entendit parler, car le nom de Jésus[a] était devenu bien connu. On disait : « Jean le Baptiseur[b] a été ressuscité d’entre les morts[c] ; c’est pour cela que les puissances[d] sont à l’œuvre en lui. »'
  rationale: La révision améliore l’idiomaticité française sans modifier le sens ni résoudre les ambiguïtés du grec. Elle conserve notamment le passif de ἐγήγερται, la causalité de διὰ τοῦτο et l’image de puissances actives en lui. Tous les appels de note demeurent présents et correctement associés.
