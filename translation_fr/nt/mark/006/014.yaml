source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: fr
  text: 'Le roi Hérode en entendit parler, car le nom de Jésus[a] était devenu bien connu. On disait : « Jean le Baptiseur[b] a été ressuscité d’entre les morts[c] ; c’est pour cela que les puissances[d] sont à l’œuvre en lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son nom ». Le pronom renvoie à Jésus.'
    reason: clarification du référent
  - marker: b
    text: 'Ou, selon le titre traditionnel : « Jean-Baptiste ».'
    reason: alternative lexicale
  - marker: c
    text: 'Ou : « est ressuscité d’entre les morts ». Le verbe grec est au passif : « a été ressuscité ».'
    reason: alternative de traduction
  - marker: d
    text: 'Ou : « des puissances miraculeuses » ou « des actes puissants ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: le roi Hérode
  rationale: Rend directement le titre et le nom dans l’ordre naturel du français.
- source_word: ἤκουσεν
  choice: en entendit parler
  rationale: Le complément est implicite et renvoie à l’activité et à la renommée de Jésus dans le contexte précédent ; le pronom « en » l’exprime naturellement sans préciser davantage.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: car le nom de Jésus était devenu bien connu
  rationale: « Était devenu bien connu » communique naturellement φανερὸν ἐγένετο. Le nom « Jésus » explicite le référent du pronom pour éviter en français une attribution momentanément ambiguë à Hérode, tout en conservant l’expression grecque « le nom ».
- source_word: ἔλεγον
  choice: On disait
  rationale: Le sujet pluriel indéfini se rend idiomatiquement par « on » en français.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Jean, celui qui baptisait
  rationale: Cette formulation conserve la valeur verbale du participe substantivé et reste compréhensible en français moderne ; le titre traditionnel figure en note.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: a été relevé d’entre les morts
  rationale: Le parfait passif est maintenu par « a été relevé ». « D’entre les morts » rend précisément ἐκ νεκρῶν dans son sens collectif.
- source_word: διὰ τοῦτο
  choice: c’est pour cela que
  rationale: Exprime clairement le rapport causal supposé par les locuteurs.
- source_word: ἐνεργοῦσιν
  choice: sont à l’œuvre
  rationale: Formulation française naturelle qui conserve l’activité continue exprimée par le présent.
- source_word: αἱ δυνάμεις
  choice: ces puissances
  rationale: Préserve le pluriel et la relative indétermination de δύναμεις, qui peut évoquer des puissances opérantes ou des actes puissants et miraculeux.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Rend directement ἐν αὐτῷ sans substituer l’interprétation instrumentale « par lui ».
theological_decisions:
- issue: Valeur passive de ἐγήγερται dans un contexte de résurrection
  choice: a été relevé d’entre les morts
  alternative: s’est relevé d’entre les morts ; est ressuscité
  rationale: Le grec emploie explicitement un parfait passif. La traduction conserve cette voix sans déterminer dans le texte principal l’agent de l’action.
- issue: Désignation de Jean par ὁ βαπτίζων
  choice: Jean, celui qui baptisait
  alternative: Jean-Baptiste ; Jean le Baptiseur
  rationale: Le choix principal conserve la force verbale du participe grec plutôt que de la réduire à un titre traditionnel, lequel reste signalé en note.
- issue: Sens de αἱ δυνάμεις
  choice: ces puissances
  alternative: ces actes puissants ; des miracles
  rationale: Le substantif pluriel permet plusieurs nuances. Le texte principal conserve l’image de puissances à l’œuvre et la note indique les principales possibilités contextuelles.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours rapporté reste direct. « Relevé d’entre les morts » maintient la voix passive du grec, tandis que les notes rendent visibles les formulations traditionnelles et les ambiguïtés lexicales.
