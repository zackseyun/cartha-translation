    rationale: Une relative introduite par « dans tout lieu où » exprime plus naturellement en français la portée indéfinie de ὃς ἂν τόπος.
  - severity: low
    issue: Les appels de note sont tous deux placés après « eux », alors que la note culturelle concerne le geste de secouer la poussière.
    rationale: L’appel b doit suivre le syntagme décrivant le geste; l’appel a doit suivre « témoignage pour eux ».
