source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: fr
  text: Et, dans tout lieu où l’on ne vous accueillera pas et où l’on ne vous écoutera pas, en partant de là, secouez la poussière sous vos pieds[b], comme témoignage pour eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme témoignage contre eux ». Le grec dit littéralement « pour eux »; dans le contexte, le geste peut toutefois être compris comme un témoignage à charge contre ceux qui refusent le message.'
    reason: alternative_reading
  - marker: b
    text: Secouer la poussière de ses pieds était un geste symbolique marquant la séparation et adressant un avertissement à ceux qui avaient refusé le message.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: si, dans un lieu
  rationale: La construction indéfinie et généralisante désigne tout lieu susceptible de refuser les envoyés. Cette formulation est naturelle en français tout en maintenant le nom explicite « lieu ».
- source_word: μὴ δέξηται ὑμᾶς
  choice: on ne vous accueille pas
  rationale: Dans ce contexte missionnaire, δέχομαι évoque l’accueil réservé aux messagers, notamment l’hospitalité. « Accueillir » rend ce sens plus naturellement que le calque « recevoir ».
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: qu’on ne vous écoute pas
  rationale: Avec le génitif, ἀκούω exprime ici l’écoute accordée aux personnes et à leur message, plutôt que la simple perception auditive.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: en partant de là
  rationale: Le participe a une valeur circonstancielle temporelle. Cette formulation conserve la succession des actions dans un français courant.
- source_word: ἐκτινάξατε
  choice: secouez
  rationale: Le verbe désigne l’action de faire tomber la poussière en la secouant. Avec son complément, « secouez la poussière » est idiomatique et fidèle.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: la poussière qui est sous vos pieds
  rationale: Traduction proche de la structure grecque, claire en français et sans ajout interprétatif.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ce sera un témoignage contre eux
  rationale: Le contexte de refus donne probablement au geste une portée défavorable. Une note conserve toutefois la formulation plus littérale « pour eux/à leur intention », puisque le grec n’exprime pas formellement « contre ».
theological_decisions:
- issue: Portée du geste consistant à secouer la poussière
  choice: Un témoignage à charge contre ceux qui refusent les messagers et leur parole
  alternative: Un témoignage qui leur est adressé, sans que sa portée défavorable soit explicitée
  rationale: Le contexte de rejet soutient la valeur adverse, mais εἰς μαρτύριον αὐτοῖς signifie formellement « pour servir de témoignage pour/à eux ». La note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe impersonnelle « on » évite une lourde répétition de « lieu » tout en gardant la portée générale. Les deux appels de note figurent dans le texte principal.
