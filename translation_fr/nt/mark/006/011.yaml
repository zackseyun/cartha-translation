  source_fidelity: La formulation « contre eux » explicite une portée défavorable plausible dans le contexte, mais αὐτοῖς n’exprime pas formellement « contre ». Le texte principal doit conserver « pour eux » et laisser l’interprétation adverse en note. « La poussière sous vos pieds » rend fidèlement τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν.
  naturalness: « Et si, dans un lieu, on ne vous accueille pas » est compréhensible, mais la tournure est lourde et « dans un lieu » ne s’articule pas naturellement avec l’impersonnel. « Dans tout lieu où l’on ne vous accueillera pas et où l’on ne vous écoutera pas » est plus idiomatique en français international moderne et maintient la généralité de la construction grecque.
  terminology: « Accueillir » convient à δέξηται dans ce contexte, et « écouter » convient à ἀκούσωσιν ὑμῶν. « Comme témoignage pour eux » rend εἰς μαρτύριον αὐτοῖς sans résoudre indûment son orientation juridique ou adverse.
