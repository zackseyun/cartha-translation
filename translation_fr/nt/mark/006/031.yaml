reference: Mark 6:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: fr
  text: 'Il leur dit : « Venez à l’écart, vous seuls, dans un endroit isolé[a], et reposez-vous un peu. » En effet, beaucoup de gens allaient et venaient, et eux-mêmes n’avaient même pas le temps de manger[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un endroit désert » ou « dans un lieu retiré ». Le grec désigne un lieu isolé ou inhabité, pas nécessairement un désert au sens moderne.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils n’avaient même pas l’occasion de manger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Il leur dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit écrit en français, sans modifier la fonction narrative.
- source_word: Δεῦτε
  choice: Venez à l’écart
  rationale: L’impératif exprime une invitation à rejoindre Jésus en se retirant de la foule; « venez à l’écart » rend naturellement ce mouvement.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: à l’écart, vous seuls
  rationale: Cette formulation conserve l’insistance des pronoms emphatiques ainsi que l’idée de séparation portée par κατ’ ἰδίαν, sans les fondre entièrement.
- source_word: ἔρημον τόπον
  choice: un endroit isolé
  rationale: Ἔρημος désigne ici un lieu retiré ou inhabité, pas nécessairement un désert au sens moderne.
- source_word: ἀναπαύσασθε
  choice: reposez-vous
  rationale: Le moyen impératif invite les disciples à interrompre leur activité pour reprendre des forces; le verbe pronominal est idiomatique en français.
- source_word: ὀλίγον
  choice: un peu
  rationale: L’expression concise garde l’indétermination grecque quant à une courte durée ou une faible mesure de repos.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: beaucoup de gens allaient et venaient
  rationale: La tournure rend le flux continu de nombreuses personnes dans un français naturel.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: ils n’avaient même pas le temps de manger
  rationale: Εὐκαιρέω indique ici la disponibilité ou l’occasion; « avoir le temps » est l’expression française la plus naturelle dans ce contexte, tandis que l’autre nuance est signalée en note.
