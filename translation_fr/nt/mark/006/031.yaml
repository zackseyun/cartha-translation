    issue: Ambiguïté de l’antécédent de « ils »
    rationale: Après « beaucoup de gens allaient et venaient », « ils n’avaient même pas le temps de manger » peut grammaticalement être compris comme désignant ces gens. Le grec vise plutôt Jésus et ses disciples ; « eux-mêmes » lève cette ambiguïté contextuelle sans explicitation doctrinale.
