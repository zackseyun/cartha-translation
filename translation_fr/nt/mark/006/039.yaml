  source_fidelity: Le texte distingue correctement « leur » (αὐτοῖς, les destinataires de l’ordre) de « tout le monde » (πάντας, les personnes à faire installer). « Ordonna » rend bien ἐπέταξεν. « Faire prendre place » exprime de manière naturelle l’infinitif ἀνακλῖναι dans son contexte de repas, sans attribuer à tort l’ordre directement à la foule. « Par groupes » rend la valeur distributive de συμπόσια συμπόσια, et « sur l’herbe verte » correspond directement à ἐπὶ τῷ χλωρῷ χόρτῳ.
  naturalness: La phrase est fluide, claire et de registre moderne international. La construction « leur ordonna de faire prendre place à tout le monde » évite efficacement l’ambiguïté narrative présente dans certains rendus plus littéraux.
