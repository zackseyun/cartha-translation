  text: καὶ ἐπέταξεν αὐτοῖς ⸀ἀνακλῖναι πάντας συμπόσια συμπόσια ἐπὶ τῷ χλωρῷ χόρτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: fr
  text: Il leur ordonna de faire prendre place à tout le monde, par groupes[a], sur l’herbe verte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque répétée peut aussi se traduire par « groupe après groupe »; elle souligne que les gens sont répartis en groupes pour le repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordonna
  rationale: Le verbe exprime un ordre donné avec autorité; « ordonna » en conserve clairement la force.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom désigne les disciples auxquels Jésus donne l’ordre, sans expliciter dans le texte français un antécédent que le grec laisse pronominal.
- source_word: ἀνακλῖναι πάντας
  choice: de faire prendre place à tout le monde
  rationale: La construction distingue les destinataires de l’ordre (« leur ») de l’ensemble de la foule qui doit être installé. « Prendre place » rend naturellement en français l’action de s’installer pour le repas sans suggérer que Jésus s’adresse directement à toute la foule.
- source_word: συμπόσια συμπόσια
  choice: par groupes
  rationale: La répétition grecque a une valeur distributive et décrit la répartition de la foule en groupes distincts pour le repas.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: sur l’herbe verte
  rationale: Traduction directe et naturelle de l’expression, qui conserve la précision descriptive de χλωρός.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation évite de confondre les disciples, qui reçoivent l’ordre, avec la foule, que ceux-ci doivent installer. « Faire prendre place » est plus idiomatique que « faire s’allonger » et conserve le contexte d’un repas.
