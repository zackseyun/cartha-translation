  text: οὐ γὰρ συνῆκαν ἐπὶ τοῖς ἄρτοις, ⸂ἀλλ’ ἦν⸃ αὐτῶν ἡ καρδία πεπωρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: fr
  text: car ils n’avaient pas compris ce qui concernait les pains[a], mais leur cœur était endurci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils n’avaient pas saisi la portée des pains ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « devenu insensible » ou « endurci comme par une callosité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν ἐπὶ τοῖς ἄρτοις
  choice: n’avaient pas compris ce que signifiaient les pains
  rationale: Le verbe συνίημι exprime ici le fait de comprendre ou de saisir, tandis que ἐπὶ τοῖς ἄρτοις renvoie aux pains et à la portée de leur multiplication. Cette formulation naturelle en français explicite l’idiome sans définir au-delà du contexte ce que les disciples auraient dû en conclure.
- source_word: ἄρτοις
  choice: les pains
  rationale: Le pluriel désigne les pains précis du récit de la multiplication, et non le pain en général.
- source_word: αὐτῶν ἡ καρδία
  choice: leur cœur
  rationale: Le singulier collectif du grec est conservé. En français, « leur cœur » peut naturellement désigner la disposition intérieure commune des disciples.
- source_word: πεπωρωμένη
  choice: endurci
  rationale: Le participe parfait passif de πωρόω évoque un état d’endurcissement ou d’insensibilité. « Endurci » conserve la métaphore biblique et la valeur résultative sans préciser la cause.
- source_word: ἀλλ’ ἦν
  choice: mais … était
  rationale: Cette tournure maintient le contraste exprimé par ἀλλά et l’état décrit à l’imparfait.
theological_decisions:
- issue: Nature et cause de l’endurcissement des disciples
  choice: leur cœur était endurci
  alternative: leur cœur était devenu insensible
  rationale: La formulation décrit leur insensibilité spirituelle sans attribuer explicitement cet état à Dieu, à eux-mêmes ou à une autre cause, préservant ainsi la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait relie naturellement l’incompréhension antérieure des disciples à la scène présente. Le singulier collectif « leur cœur » suit le grec tout en restant idiomatique.
