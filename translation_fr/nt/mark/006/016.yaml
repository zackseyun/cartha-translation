id: MRK.6.16
reference: Mark 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: fr
  text: 'Mais quand Hérode en entendit parler, il disait[a] : « Jean, que j’ai fait décapiter, c’est lui qui a été ressuscité[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il répétait » ; l’imparfait grec peut exprimer une parole répétée ou prolongée.
    reason: lexical_alternative
  - marker: b
    text: Ou « a été relevé ». Le verbe grec est au passif et peut aussi se traduire, moins littéralement, par « est ressuscité » ou « s’est relevé ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: quand Hérode en entendit parler
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français. « En entendit parler » explicite idiomatiquement qu’Hérode apprend les faits rapportés dans le contexte, sans ajouter un objet précis absent du grec.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici une légère transition avec contraste, en ramenant le récit à la réaction d’Hérode.
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et permet de conserver sa possible valeur durative ou répétitive, sans l’imposer.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Jean, que j’ai fait décapiter
  rationale: Cette formulation française replace naturellement « Jean » avant la relative tout en conservant l’insistance du pronom ἐγώ. « Faire décapiter » exprime l’action attribuée à Hérode en tant que souverain ayant ordonné l’exécution, sans suggérer nécessairement qu’il l’a accomplie de sa propre main.
- source_word: οὗτος
  choice: c’est lui qui
  rationale: La construction disloquée « c’est lui qui » restitue avec naturel en français la valeur démonstrative et emphatique de οὗτος.
- source_word: ἠγέρθη
  choice: a été ressuscité
  rationale: Le passif est conservé. Dans ce contexte de retour d’entre les morts, « ressusciter » transmet plus clairement le sens que le littéral mais ambigu « relever », tout en laissant l’agent inexprimé comme dans le grec.
theological_decisions:
- issue: Voix et portée de ἠγέρθη dans le langage de résurrection
  choice: a été ressuscité
  alternative: est ressuscité / s’est relevé
  rationale: Le grec est passif. La traduction passive évite de transformer silencieusement l’énoncé en formule active et préserve l’absence d’agent exprimé, sans préciser davantage la conclusion craintive d’Hérode.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve l’emphase de οὗτος par « c’est lui qui », ainsi que le passif de ἠγέρθη. L’imparfait « disait » maintient la nuance aspectuelle du grec sans alourdir le récit.
