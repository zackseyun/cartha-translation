  source_fidelity: 'Le texte rend fidèlement la progression du grec : participe aoriste temporel (« quand ... en entendit parler »), δέ contrastif (« Mais »), imparfait à valeur potentiellement itérative (« il disait »), responsabilité d’Hérode dans la décapitation (« j’ai fait décapiter »), démonstratif emphatique (« c’est lui qui ») et passif de ἠγέρθη (« a été ressuscité »). « En entendit parler » est une explicitation idiomatique minimale du contexte et ne détermine pas indûment ce qu’Hérode a entendu.'
  naturalness: Le français est moderne, clair et soutenu sans être solennel. L’enchaînement au passé simple et à l’imparfait est naturel en narration. La dislocation « c’est lui qui » rend l’emphase de οὗτος de manière idiomatique.
  terminology: « Faire décapiter » décrit exactement la responsabilité royale attribuée à Hérode sans prétendre qu’il a exécuté Jean lui-même. « A été ressuscité » conserve utilement le passif grec et son agent non exprimé. Les notes signalent de façon adéquate la nuance de l’imparfait et les possibilités de rendu du passif.
