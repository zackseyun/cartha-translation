id: MRK.6.18
reference: Mark 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: fr
  text: 'Car Jean disait à Hérode : « Il ne t’est pas permis d’avoir la femme de ton frère. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait grec présente une parole passée dans son déroulement ou sa répétition. L’imparfait français « disait » en conserve naturellement la valeur sans imposer artificiellement « ne cessait de dire ».
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de ce qui précède. « Car » en garde explicitement la fonction explicative dans un registre digne et courant.
- source_word: Ἡρῴδῃ
  choice: à Hérode
  rationale: Forme française traditionnelle et courante du nom propre, avec le datif rendu par « à » selon le verbe de parole.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Il ne t’est pas permis
  rationale: ἔξεστιν désigne ce qui est permis ou autorisé. Cette formulation conserve la force normative et morale du grec sans ajouter une mention explicite de la Loi absente du verset.
- source_word: ἔχειν
  choice: d’avoir
  rationale: Rend directement l’infinitif « avoir » et reste naturel dans ce contexte conjugal.
- source_word: γυναῖκα
  choice: la femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Ici, « la femme de ton frère » exprime naturellement en français la relation conjugale tout en restant proche du grec.
- source_word: τοῦ ἀδελφοῦ σου
  choice: de ton frère
  rationale: Rendu idiomatique et exact du groupe génitif, en conservant la relation familiale au cœur du reproche.
theological_decisions:
- issue: Nature de la réprimande de Jean
  choice: « Il ne t’est pas permis »
  alternative: « Il ne t’est pas légal » / « Tu n’as pas le droit » / « Ce n’est pas bien »
  rationale: La formulation retenue préserve la portée normative de ἔξεστιν, probablement sur fond d’interdits de la Torah, sans expliciter ce cadre au-delà du texte ni affaiblir la réprimande en simple jugement de convenance.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier σοι et convient à l’adresse directe. La tournure « disait » garde ouverte la nuance durative ou répétée de l’imparfait grec.
