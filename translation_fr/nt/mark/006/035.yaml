source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: fr
  text: 'Comme il se faisait déjà très tard, ses disciples s’approchèrent de lui et lui disaient : « L’endroit est désert, et il est déjà très tard. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: déjà
  rationale: Marque dans les deux occurrences que le temps est bien avancé; « déjà » est direct et naturel en français.
- source_word: ὥρας πολλῆς γενομένης
  choice: Comme il se faisait déjà très tard
  rationale: Le génitif absolu indique qu’une heure avancée était arrivée. Cette tournure idiomatique conserve la progression temporelle et la force de πολλῆς.
- source_word: προσελθόντες αὐτῷ
  choice: s’approchèrent de lui
  rationale: Rend clairement le mouvement vers Jésus exprimé par προσέρχομαι et s’intègre naturellement au récit.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Expression possessive française naturelle et fidèle.
- source_word: ἔλεγον
  choice: lui disaient
  rationale: L’imparfait préserve l’aspect imperfectif de ἔλεγον sans imposer l’idée d’une répétition insistante.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: L’endroit est désert
  rationale: ἔρημος décrit ici un lieu isolé ou inhabité. « Désert » préserve cette portée sans suggérer nécessairement un désert géographique.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: et il est déjà très tard
  rationale: Formulation française idiomatique qui restitue la reprise de l’heure avancée et l’intensité contextuelle de πολλή.
