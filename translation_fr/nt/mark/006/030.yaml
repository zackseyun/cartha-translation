id: MRK.6.30
reference: Mark 6:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: fr
  text: Les apôtres se rassemblèrent auprès de Jésus et lui rapportèrent tout[a] ce qu’ils avaient fait et tout ce qu’ils avaient enseigné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « tout ».
    reason: Variante textuelle signalée dans la tradition manuscrite pour πάντα.
lexical_decisions:
- source_word: συνάγονται
  choice: se rassemblèrent
  rationale: Le présent grec est un présent historique dans le récit. Le passé simple convient au registre narratif français et conserve l’idée de rassemblement.
- source_word: οἱ ἀπόστολοι
  choice: les apôtres
  rationale: Dans ce contexte, le terme désigne les disciples revenus de la mission pour laquelle Jésus les avait envoyés; « apôtres » conserve cette désignation reconnue.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: auprès de Jésus
  rationale: Avec l’accusatif, πρός exprime ici le mouvement vers Jésus. « Auprès de Jésus » rend naturellement en français leur retour et leur réunion autour de lui.
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe décrit le compte rendu fait par les apôtres à leur retour; « rapportèrent » exprime mieux cette nuance que le simple « dirent ».
- source_word: πάντα ὅσα ἐποίησαν
  choice: tout ce qu’ils avaient fait
  rationale: Cette formulation française naturelle conserve la portée globale de πάντα et présente leurs actions comme antérieures au compte rendu.
- source_word: ὅσα ἐδίδαξαν
  choice: tout ce qu’ils avaient enseigné
  rationale: La répétition de « tout ce que » reflète les deux propositions relatives parallèles du grec et évite de laisser entendre que « fait et enseigné » formerait un seul complément indistinct.
theological_decisions:
- issue: Désignation des disciples par ἀπόστολοι
  choice: les apôtres
  alternative: les envoyés
  rationale: Le contexte souligne bien leur mission, mais le terme fonctionne ici comme la désignation du groupe envoyé par Jésus. Le rendre par « apôtres » préserve à la fois l’usage de Marc et le vocabulaire biblique courant sans ajouter de conception institutionnelle étrangère au verset.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient un registre écrit naturel pour le récit. La répétition de « tout ce que » privilégie la clarté et le parallélisme de la source.
