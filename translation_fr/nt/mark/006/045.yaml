source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: fr
  text: Aussitôt, il obligea ses disciples à monter dans la barque et à le précéder sur l’autre rive, vers Bethsaïda[a], jusqu’à ce que lui-même renvoie la foule[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Bethsaïda ». La préposition grecque peut indiquer plus généralement une direction (« vers ») ou plus précisément une destination (« à »).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à ce que lui-même renvoie la foule ». Le grec emploie un verbe au présent dans une proposition temporelle. En français, « jusqu’à ce que » appelle normalement le subjonctif présent (« renvoie »), même dans un récit au passé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Ce terme restitue clairement le rythme vif et pressant caractéristique du récit de Marc.
- source_word: ἠνάγκασεν
  choice: il obligea
  rationale: Le verbe exprime une forte contrainte ou nécessité. « Obligea » en conserve la force sans suggérer nécessairement une violence physique.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ses disciples
  rationale: « Disciples » est le terme courant et précis pour la relation entre un maître et ceux qui reçoivent son enseignement.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: à monter dans la barque
  rationale: Formulation naturelle en français moderne dans ce contexte de navigation; « barque » convient à l’embarcation du récit évangélique.
- source_word: προάγειν
  choice: à le précéder
  rationale: Le verbe indique que les disciples doivent partir avant Jésus. L’ajout du pronom « le », implicite dans le contexte grec, rend cette relation naturelle et explicite en français.
- source_word: εἰς τὸ πέραν
  choice: sur l’autre rive
  rationale: L’expression désigne ici le côté opposé du lac. « Sur l’autre rive » est idiomatique et précis.
- source_word: πρὸς Βηθσαϊδάν
  choice: vers Bethsaïda
  rationale: πρός avec l’accusatif marque naturellement la direction. « Vers » préserve cette nuance sans affirmer que l’arrivée à Bethsaïda constitue explicitement le terme final.
- source_word: ἕως
  choice: pendant que
  rationale: Dans ce contexte, la proposition décrit l’action accomplie simultanément par Jésus pendant le départ des disciples. Une note conserve la formulation plus littérale « jusqu’à ce que ».
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom explicite est emphatique et souligne que Jésus reste personnellement pour renvoyer la foule.
- source_word: ἀπολύει
  choice: renvoyait
  rationale: Le présent grec dans la proposition temporelle est rendu par l’imparfait, temps naturel en français pour l’action simultanée d’arrière-plan dans un récit au passé.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: Rendu courant, clair et naturel de ὄχλος dans les récits évangéliques.
