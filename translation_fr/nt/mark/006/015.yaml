  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: fr
  text: 'Mais d’autres disaient : « C’est Élie », et d’autres disaient : « C’est un prophète[a], comme l’un des prophètes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement, « le Prophète », si l’on y voit une figure eschatologique particulière ; le grec se comprend plus naturellement comme « un prophète », puisqu’il poursuit : « comme l’un des prophètes ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Mais d’autres
  rationale: ἄλλοι distingue un autre groupe, tandis que δέ marque un léger contraste dans la suite des opinions rapportées.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente ces propos comme répétés ou en cours de circulation; l’imparfait français restitue naturellement cet aspect.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: « C’est Élie »
  rationale: Le discours direct est naturel après « disaient ». « C’est Élie » rend idiomatiquement l’identification exprimée par le grec.
- source_word: προφήτης
  choice: un prophète
  rationale: Le nom est sans article et la comparaison qui suit, « comme l’un des prophètes », favorise nettement un sens indéfini plutôt qu’un titre eschatologique précis.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: comme l’un des prophètes
  rationale: ὡς exprime ici la comparaison; cette formulation conserve la référence générale aux prophètes sans ajouter « d’autrefois », absent du texte.
theological_decisions:
- issue: Faut-il comprendre προφήτης au sens générique ou comme le titre eschatologique « le Prophète »?
  choice: un prophète
  alternative: le Prophète
  rationale: L’absence d’article et surtout la précision « comme l’un des prophètes » orientent vers une identification prophétique générique. La traduction ne transforme donc pas le terme en titre défini.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « d’autres » reflète la structure grecque; « encore » clarifie sans lourdeur qu’il s’agit d’un groupe supplémentaire. Aucune note n’est nécessaire, car l’alternative « le Prophète » est nettement moins probable dans ce contexte.
