  text: ⸂περιέδραμον ὅλην τὴν χώραν ἐκείνην καὶ⸃ ἤρξαντο ἐπὶ τοῖς κραβάττοις τοὺς κακῶς ἔχοντας περιφέρειν ὅπου ἤκουον ⸀ὅτι ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: fr
  text: Ils parcoururent en courant toute cette région et se mirent à transporter les malades sur des nattes[a] partout où ils entendaient dire qu’il se trouvait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des grabats » ou « des couchettes » ; le mot grec désigne une literie simple que l’on pouvait transporter.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: parcoururent en courant
  rationale: Le verbe composé exprime un déplacement rapide à travers une zone. Cette formulation conserve à la fois l’urgence et l’étendue du mouvement.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: toute cette région
  rationale: χώρα désigne ici le territoire environnant plutôt qu’un pays au sens moderne; « région » est naturel et précis.
- source_word: ἤρξαντο ... περιφέρειν
  choice: se mirent à transporter
  rationale: La tournure rend la valeur ingressive de ἤρξαντο avec l’infinitif et le déplacement physique des malades.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: sur des nattes
  rationale: κράβαττος désigne une literie simple et transportable. « Nattes » est clair en français moderne, tandis qu’une note conserve les autres possibilités.
- source_word: τοὺς κακῶς ἔχοντας
  choice: les malades
  rationale: L’expression idiomatique désigne ceux qui sont souffrants ou malades; la traduction française est concise et naturelle.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: partout où ils entendaient dire qu’il se trouvait
  rationale: La formulation rend la destination impliquée par ὅπου et le discours indirect introduit par ὅτι, sans préciser davantage le lieu.
