id: MRK.6.49
reference: Mark 6:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: fr
  text: Mais eux, quand ils le virent marcher sur la mer, pensèrent que c’était un fantôme[a] et poussèrent des cris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une apparition » ou « un spectre ». Le grec φάντασμα désigne une apparition à l’aspect surnaturel ou fantomatique.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: Le pronom « eux » reprend les disciples déjà présents dans le récit, tandis que δέ marque une légère transition contrastive vers leur réaction.
- source_word: ἰδόντες αὐτὸν
  choice: quand ils le virent
  rationale: Le participe aoriste reçoit ici une valeur temporelle; cette formulation rend naturellement en français l’action qui déclenche leur réaction.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: marcher sur la mer
  rationale: Dans ce contexte, ἐπί avec le génitif décrit Jésus se déplaçant sur la surface de l’eau. « Mer » conserve le terme grec θάλασσα et l’usage traditionnel pour la mer de Galilée.
- source_word: ἔδοξαν
  choice: pensèrent
  rationale: Le verbe δοκέω exprime ici une supposition erronée fondée sur ce que les disciples voient.
- source_word: ὅτι φάντασμά ἐστιν
  choice: que c’était un fantôme
  rationale: Le présent grec dans le discours indirect est naturellement transposé à l’imparfait après un verbe principal au passé. « Fantôme » est clair en français courant, tout en laissant « apparition » comme autre rendu possible.
- source_word: καὶ ἀνέκραξαν
  choice: et poussèrent des cris
  rationale: ἀνακράζω désigne un cri poussé avec force. La tournure française exprime l’intensité sans préciser davantage la nature des cris.
theological_decisions:
- issue: Nature du déplacement de Jésus sur l’eau
  choice: marcher sur la mer
  alternative: marcher au bord de la mer
  rationale: Dans le contexte immédiat du récit, ἐπὶ τῆς θαλάσσης désigne un déplacement sur la surface de l’eau, non le long du rivage.
- issue: Nature du φάντασμα perçu par les disciples
  choice: un fantôme
  alternative: une apparition
  rationale: Le texte rapporte leur interprétation effrayée sans définir ontologiquement ce qu’est un φάντασμα. « Fantôme » rend le sens courant, tandis que la note préserve l’alternative plus générale.
translation_notes:
  register: Français moderne, naturel et digne. La phrase conserve le contraste narratif, l’ordre des perceptions et des réactions, ainsi que le vocabulaire concret du récit.
