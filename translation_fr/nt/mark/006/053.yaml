  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: fr
  text: Après avoir fait la traversée, ils arrivèrent à terre[a], à Génésareth, et y accostèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au rivage » ; le grec dit littéralement « sur la terre » et évoque ici l’arrivée depuis le bateau.
    reason: lexical_alternative
  - marker: b
    text: Ou « y mouillèrent », « y jetèrent l’ancre » ou « y abordèrent » ; le verbe grec a un sens nautique et désigne l’arrivée du bateau à un lieu de mouillage ou d’accostage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Après
  rationale: Le lien narratif est rendu naturellement avec la construction temporelle « Après avoir fait la traversée », qui exprime aussi l’antériorité du participe aoriste.
- source_word: διαπεράσαντες
  choice: après avoir fait la traversée
  rationale: Le participe aoriste indique une traversée achevée avant les actions principales. Cette formulation française reste naturelle sans préciser explicitement ce qui a été traversé.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: ils arrivèrent à terre, à Génésareth
  rationale: « À terre » rend γῆ dans ce contexte nautique, tandis que « à Génésareth » conserve la destination exprimée par εἰς. La formulation évite de déterminer si Génésareth désigne ici précisément une localité ou la région riveraine.
- source_word: Γεννησαρὲτ
  choice: Génésareth
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: προσωρμίσθησαν
  choice: y accostèrent
  rationale: Le verbe a un sens nautique et décrit l’arrivée ou la mise à quai ou au rivage. « Accostèrent » est idiomatique en français et conserve ce sens spécialisé; « y » reprend naturellement le lieu atteint.
