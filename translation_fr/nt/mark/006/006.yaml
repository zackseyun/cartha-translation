  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: fr
  text: Et il s’étonnait de leur incrédulité[a]. Et il parcourait les villages alentour[b], en enseignant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il était étonné à cause de leur manque de foi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il allait de village en village, tout autour, en enseignant » ; le grec peut évoquer les villages environnants ou un parcours en circuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: il s’étonnait
  rationale: L’imparfait grec présente une réaction durative ou constatée dans le récit. « Il s’étonnait » est naturel en français moderne et conserve la force de θαυμάζω sans expliquer ni atténuer la réaction de Jésus.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: de leur incrédulité
  rationale: διά avec l’accusatif exprime ici la cause. Avec « s’étonner », la construction française idiomatique est « s’étonner de ». « Incrédulité » rend le refus ou l’absence de foi plus précisément que la formulation plus douce « manque de foi ».
- source_word: περιῆγεν
  choice: il parcourait
  rationale: L’imparfait décrit le déplacement continu de Jésus d’un lieu à l’autre. « Parcourait » exprime naturellement cette activité itinérante.
- source_word: τὰς κώμας
  choice: les villages
  rationale: κώμη désigne un village ou une agglomération rurale ; « villages » est le terme français courant et précis.
- source_word: κύκλῳ
  choice: des alentours
  rationale: L’adverbe indique les localités situées autour ou un parcours circulaire. « Les villages des alentours » restitue clairement le sens spatial en français naturel, tout en laissant en note la possibilité du parcours en circuit.
- source_word: διδάσκων
  choice: en enseignant
  rationale: Le participe présent indique une action contemporaine au déplacement. « En enseignant » conserve ce rapport sans alourdir la phrase.
theological_decisions:
- issue: Réaction de Jésus devant l’incrédulité
  choice: il s’étonnait de leur incrédulité
  alternative: il était étonné à cause de leur incrédulité
  rationale: Le texte attribue directement à Jésus l’étonnement suscité par leur incrédulité. La traduction maintient cette tension narrative et théologique sans l’expliquer, la réduire ni introduire une affirmation étrangère au texte.
translation_notes:
  register: Français international moderne, simple et digne. La première phrase conserve l’imparfait du récit grec. « Puis » distingue naturellement la nouvelle étape narrative introduite par le second καί. Les deux notes signalent les principales possibilités lexicales sans surcharger le verset.
