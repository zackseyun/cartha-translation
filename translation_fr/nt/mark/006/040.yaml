  text: καὶ ἀνέπεσαν πρασιαὶ πρασιαὶ ⸀κατὰ ἑκατὸν καὶ ⸁κατὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/040.yaml
  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: fr
  text: Ils s’installèrent par groupes[a], les uns de cent, les autres de cinquante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « plates-bandes par plates-bandes », image qui évoque une disposition ordonnée en rangées ou en sections.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: s’installèrent
  rationale: Le verbe désigne ici le fait de prendre place, probablement en position allongée comme pour un repas. « S’installèrent » reste naturel en français moderne et conserve le contexte du repas sans imposer une posture précise.
- source_word: πρασιαὶ πρασιαὶ
  choice: par groupes
  rationale: Le nom répété évoque littéralement des plates-bandes ou carrés de jardin et décrit ici une disposition ordonnée en groupes. La formulation idiomatique est retenue dans le texte, tandis que l’image est signalée en note.
- source_word: κατὰ ἑκατὸν καὶ κατὰ πεντήκοντα
  choice: les uns de cent, les autres de cinquante
  rationale: κατά suivi d’un nombre a ici un sens distributif. Cette tournure française exprime clairement que les groupes comptaient respectivement cent ou cinquante personnes, tout en maintenant le parallélisme.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « S’installèrent » convient mieux que le littéral « s’allongèrent » dans l’usage courant, tout en laissant percevoir qu’ils prenaient place pour le repas. L’organisation en groupes de cent et de cinquante est formulée sans ambiguïté.
