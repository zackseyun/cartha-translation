  text: καὶ ἀπῆλθον ⸂ἐν τῷ πλοίῳ εἰς ἔρημον τόπον⸃ κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: fr
  text: Et ils partirent en barque vers un endroit isolé, à l’écart[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seuls » ou « en privé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: donc
  rationale: Dans la continuité narrative, καί relie ce départ à la décision exprimée au verset précédent. « Donc » rend naturellement ce lien en français sans l’alourdir.
- source_word: ἀπῆλθον
  choice: partirent
  rationale: L’aoriste de ἀπέρχομαι indique qu’ils quittèrent le lieu où ils se trouvaient. « Partirent » est direct, courant et fidèle au mouvement de départ.
- source_word: ἐν τῷ πλοίῳ
  choice: en barque
  rationale: Même si l’expression grecque signifie littéralement « dans la barque », « en barque » est la tournure française naturelle pour exprimer ici le moyen de déplacement, tout en convenant au cadre du récit.
- source_word: εἰς ἔρημον τόπον
  choice: vers un endroit isolé
  rationale: ἔρημος qualifie ici un lieu inhabité, retiré ou désert. « Endroit isolé » exprime clairement l’éloignement recherché sans imposer l’image géographique d’un désert aride.
- source_word: κατ’ ἰδίαν
  choice: à l’écart
  rationale: L’expression idiomatique indique qu’ils se retirent séparément de la foule, dans l’intimité. « À l’écart » conserve cette nuance sans affirmer nécessairement qu’aucune autre personne n’était présente.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et narrative. « Endroit isolé » évite l’ambiguïté moderne de « endroit désert », qui pourrait évoquer soit un lieu vide, soit un désert géographique; la note préserve les autres nuances possibles de κατ’ ἰδίαν.
