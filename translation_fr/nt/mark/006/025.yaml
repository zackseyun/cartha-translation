source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: fr
  text: 'Elle entra aussitôt en toute hâte auprès du roi et lui demanda : « Je veux que tu me donnes sur-le-champ, sur un plat, la tête de Jean le Baptiste[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Jean le Baptiseur ».'
    reason: Alternative lexicale reflétant le sens descriptif du titre grec βαπτιστής.
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: elle entra
  rationale: Le participe aoriste décrit son entrée auprès du roi avant sa demande. Le passé simple convient à la progression narrative et reste naturel dans un récit biblique français.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: Ce terme fréquent chez Marc marque l’immédiateté de son entrée et maintient le rythme pressant du récit.
- source_word: μετὰ σπουδῆς
  choice: en toute hâte
  rationale: L’expression indique une action empressée et urgente sans lui attribuer nécessairement un enthousiasme positif.
- source_word: βασιλέα
  choice: le roi
  rationale: Même si Hérode Antipas portait historiquement le titre de tétrarque, le texte grec emploie βασιλεύς ; la traduction conserve donc la désignation narrative.
- source_word: ᾐτήσατο
  choice: lui demanda
  rationale: Le verbe exprime ici une demande. Le pronom « lui » rend clairement le destinataire, tandis que les paroles rapportées en précisent le contenu.
- source_word: Θέλω
  choice: Je veux
  rationale: Cette formulation directe restitue la volonté ferme et la brusquerie de la requête.
- source_word: ἵνα ... δῷς μοι
  choice: que tu me donnes
  rationale: La proposition introduite par ἵνα donne le contenu de ce qu’elle veut ; cette construction est naturelle et précise en français.
- source_word: ἐξαυτῆς
  choice: sur-le-champ
  rationale: L’expression exige une exécution immédiate. Un rendu distinct d’« aussitôt », qui qualifie son entrée, préserve les deux marques d’urgence du grec.
- source_word: ἐπὶ πίνακι
  choice: sur un plat
  rationale: πίναξ désigne un plat ou plateau de service ; « sur un plat » est clair, idiomatique et adapté au cadre du banquet.
- source_word: κεφαλὴν
  choice: la tête
  rationale: Le rendu littéral conserve sans l’atténuer la précision macabre du récit.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jean le Baptiseur
  rationale: βαπτιστής est un titre descriptif désignant celui qui baptise. « Baptiseur » en traduit le sens, tandis que la forme traditionnelle est signalée en note.
theological_decisions:
- issue: Traduction du titre Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jean le Baptiseur
  alternative: Jean-Baptiste
  rationale: Le choix principal traduit la valeur descriptive du titre grec plutôt que de reprendre seulement sa forme française traditionnelle. Il ne vise aucune distinction doctrinale ; la désignation habituelle est conservée en note.
translation_notes:
  register: Français international moderne, direct et digne. La répétition des deux indications d’urgence (« aussitôt » et « en toute hâte »), puis « sur-le-champ » dans la demande, reflète l’insistance du grec sans en gommer le rythme. Le discours direct emploie le tutoiement attendu dans cette scène.
