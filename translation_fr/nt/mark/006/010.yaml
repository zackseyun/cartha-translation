source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: fr
  text: 'Il leur disait : « Dans toute maison où vous entrerez, restez-y jusqu’à ce que vous quittiez cet endroit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce que vous sortiez de là ». Le grec dit plus littéralement « jusqu’à ce que vous sortiez de là » ; dans ce contexte, il s’agit probablement de quitter l’endroit où ils séjournent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il leur disait
  rationale: L’imparfait grec est rendu par l’imparfait français, qui conserve naturellement l’aspect duratif ou répété du discours dans le récit.
- source_word: Ὅπου ἐὰν
  choice: Partout où
  rationale: 'Cette tournure rend de façon naturelle la valeur relative indéfinie du grec : quel que soit l’endroit.'
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: vous entrerez dans une maison
  rationale: Le futur français convient à cette instruction portant sur les différents lieux où les disciples pourront être accueillis; « entrer dans » restitue clairement le mouvement vers l’intérieur.
- source_word: οἰκίαν
  choice: une maison
  rationale: Dans ce contexte, οἰκία désigne d’abord le lieu concret où les disciples logeront; « maison » évite de privilégier le sens plus affectif de « foyer ».
- source_word: ἐκεῖ μένετε
  choice: restez-y
  rationale: Cette formulation française concise et naturelle exprime l’ordre de demeurer dans la maison où ils ont été accueillis.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: jusqu’à ce que vous quittiez l’endroit
  rationale: La formulation exprime idiomatiquement le départ du lieu où s’exerce la mission, tout en signalant en note la formulation grecque plus littérale et son ambiguïté possible.
theological_decisions:
- issue: Portée de ἐκεῖθεν dans la proposition de départ
  choice: Les disciples doivent rester dans la même maison jusqu’à ce qu’ils quittent l’endroit où ils séjournent.
  alternative: Ils doivent y rester jusqu’à ce qu’ils sortent de la maison.
  rationale: Dans le contexte des consignes de mission et d’hébergement, la phrase paraît interdire de changer de logement avant de quitter la localité. Puisque le grec peut se rendre plus littéralement par « sortir de là », cette possibilité n’est pas effacée mais indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait narratif « disait » préserve l’aspect du verbe grec; « restez-y » évite une lourdeur tout en gardant la force de l’instruction.
