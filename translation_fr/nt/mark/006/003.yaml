source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: fr
  text: « N’est-ce pas le charpentier[b], le fils de Marie et le frère[a] de Jacques, de Josès, de Jude et de Simon ? Ses sœurs[a] ne sont-elles pas ici parmi nous ? » Et ils étaient choqués à son sujet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les mots grecs traduits par « frère » et « sœurs » désignent ordinairement des frères et sœurs, mais ils peuvent aussi être compris ici comme des termes de parenté plus larges ou comme désignant des demi-frères et demi-sœurs issus d’une autre union.
    reason: alternative_reading
  - marker: b
    text: Ou « artisan » ou « bâtisseur » ; le terme grec ne se limite pas nécessairement au travail du bois.
    reason: lexical_alternative
  - marker: c
    text: Ou « ils trébuchaient à cause de lui » ou « il était pour eux une cause de chute » ; l’expression évoque l’offense et le rejet suscités par Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: charpentier
  rationale: « Charpentier » est le rendu traditionnel et probable dans ce contexte villageois, tout en signalant en note que le grec peut désigner plus largement un artisan ou un bâtisseur.
- source_word: υἱὸς τῆς Μαρίας
  choice: le fils de Marie
  rationale: Le rendu direct conserve cette désignation maternelle marquée sans préciser si elle est neutre ou méprisante.
- source_word: ἀδελφὸς / ἀδελφαί
  choice: frère / sœurs
  rationale: Ce sont les sens ordinaires des termes grecs. Une note préserve la possibilité d’un emploi familial plus large sans imposer une conclusion sur le lien exact.
- source_word: Ἰωσῆτος
  choice: Josès
  rationale: La translittération « Josès » maintient la forme grecque attestée ici au lieu de la normaliser en « Joseph ».
- source_word: ὧδε πρὸς ἡμᾶς
  choice: ici parmi nous
  rationale: Cette formulation française naturelle exprime la présence locale et la proximité sociale avec les habitants qui parlent.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: ils se scandalisaient à cause de lui
  rationale: Le rendu conserve l’image et la réaction hostile du verbe grec, ainsi que la valeur durative de l’imparfait, sans la réduire explicitement à une simple émotion ou à l’incrédulité.
theological_decisions:
- issue: Nature du lien entre Jésus et ses « frères » et « sœurs »
  choice: Conserver « frère » et « sœurs » dans le texte principal sans définir plus précisément la parenté.
  alternative: Comprendre ces termes comme désignant des proches parents ou des demi-frères et demi-sœurs issus d’une autre union.
  rationale: Les termes grecs désignent ordinairement un frère et des sœurs, mais le verset ne tranche pas les interprétations historiques concernant leur lien familial exact avec Jésus.
- issue: Portée sociale de « fils de Marie »
  choice: Traduire directement l’expression sans commentaire interprétatif dans le texte.
  alternative: Expliciter une nuance méprisante ou, au contraire, traiter la formule comme une simple identification.
  rationale: Le contexte permet de percevoir une possible pointe dépréciative, mais le grec ne l’explicite pas.
- issue: Sens figuré de σκανδαλίζω
  choice: 'Conserver en français le langage du scandale : « ils se scandalisaient à cause de lui ».'
  alternative: « Il était pour eux une cause de chute » ou « ils refusaient de croire en lui ».
  rationale: La première solution maintient la tension entre offense, rejet et obstacle à la foi; les autres formulations explicitent chacune un aspect possible du verbe.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions gardent le ton familier et incrédule des habitants. « Parmi nous » rend la proximité locale sans régionalisme, tandis que « se scandalisaient » conserve le relief de l’expression grecque, éclairée par une note.
