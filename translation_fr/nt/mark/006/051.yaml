  source_fidelity: 'Le sens narratif est bien rendu : Jésus entre dans la barque, le vent cesse, et les disciples éprouvent un étonnement très intense. Toutefois, « absolument » atténue et généralise quelque peu l’accumulation emphatique λίαν ἐκ περισσοῦ ; « extrêmement » la rend plus directement. « En eux-mêmes » est préférable à « au fond d’eux-mêmes », qui peut suggérer une réflexion intime absente du grec.'
  naturalness: La formulation révisée reste naturelle en français international moderne. « Le vent tomba » est idiomatique dans ce contexte, et l’antéposition de « En eux-mêmes » conserve le relief du grec sans alourdir la phrase.
  terminology: « Barque », « le vent tomba » et « stupéfaits » conviennent au registre narratif et au contexte. La note sur ἐξίσταντο conserve prudemment l’alternative idiomatique « hors d’eux-mêmes » sans en faire le sens imposé du texte.
