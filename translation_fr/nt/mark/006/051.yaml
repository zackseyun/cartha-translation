    issue: L’intensité de λίαν ἐκ περισσοῦ est rendue par « absolument ».
    rationale: « Absolument stupéfaits » est possible, mais « absolument » n’exprime pas aussi clairement l’intensification exceptionnelle du grec. « Extrêmement » est plus précis tout en restant idiomatique.
  - severity: low
    issue: « Au fond d’eux-mêmes » interprète légèrement ἐν ἑαυτοῖς.
    rationale: L’expression française peut évoquer une intériorité réflexive ou cachée. « En eux-mêmes » préserve plus sobrement l’ambiguïté et la portée interne du grec.
  - severity: low
    issue: La formulation de la note a (« très fortement ») est peu exacte pour l’intensif λίαν.
    rationale: « Très fortement » décrit plutôt une manière ou une force. « Extrêmement » et « au-delà de toute mesure » correspondent mieux aux deux intensificateurs grecs.
