source:
  edition: SBLGNT
  text: καὶ ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον, καὶ ἐκόπασεν ὁ ἄνεμος. καὶ λίαν ⸂ἐκ περισσοῦ⸃ ἐν ἑαυτοῖς ⸀ἐξίσταντο,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: fr
  text: Puis il monta dans la barque avec eux, et le vent tomba. En eux-mêmes, ils étaient extrêmement[a] stupéfaits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le grec accumule les termes d’intensité : « extrêmement, au-delà de toute mesure ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils étaient hors d’eux-mêmes », expression qui souligne la force bouleversante de leur stupéfaction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη … εἰς τὸ πλοῖον
  choice: monta dans la barque
  rationale: Le verbe signifie littéralement « monter » et, avec « dans la barque », décrit naturellement le fait d’y entrer. Cette formulation reste courante en français tout en conservant l’image du grec.
- source_word: πρὸς αὐτούς
  choice: avec eux
  rationale: Après le mouvement d’entrée dans la barque, l’expression indique qu’il les rejoint et se trouve avec eux. « Auprès d’eux » serait plus formellement proche, mais moins naturel ici.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: le vent tomba
  rationale: κοπάζω décrit un vent qui s’apaise ou cesse. « Le vent tomba » est une tournure française naturelle, concise et adaptée au récit.
- source_word: λίαν ἐκ περισσοῦ
  choice: absolument
  rationale: L’accumulation grecque renforce fortement la réaction. « Absolument » rend cette intensité sans produire une formulation française pesante; le caractère exceptionnellement appuyé du grec est signalé en note.
- source_word: ἐν ἑαυτοῖς
  choice: au fond d’eux-mêmes
  rationale: Cette expression idiomatique conserve la dimension intérieure indiquée par le réfléchi grec.
- source_word: ἐξίσταντο
  choice: étaient stupéfaits
  rationale: Le verbe exprime ici un étonnement qui bouleverse profondément. « Stupéfaits » est fort, clair et digne, sans imposer le sens potentiellement ambigu de « hors d’eux-mêmes ».
theological_decisions:
- issue: Intensité de la réaction des disciples devant l’autorité de Jésus sur le vent
  choice: « ils étaient absolument stupéfaits »
  alternative: « ils étaient stupéfaits au-delà de toute mesure » ou « ils étaient hors d’eux-mêmes »
  rationale: La formulation retient la force inhabituelle de l’expression grecque tout en restant naturelle. Elle ne précise pas davantage la compréhension théologique des disciples que ne le fait le récit.
translation_notes:
  register: Français international moderne, narratif et digne. « Le vent tomba » et « au fond d’eux-mêmes » sont idiomatiques sans être familiers. Les deux notes sont placées après la proposition à laquelle elles se rapportent, contrairement au positionnement manifestement décalé des marqueurs dans la couche anglaise fournie.
