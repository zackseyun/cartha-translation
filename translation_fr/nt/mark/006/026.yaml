id: MRK.6.26
reference: Mark 6:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: fr
  text: Le roi en fut profondément attristé, mais à cause de ses serments et des convives[a], il ne voulut pas lui opposer un refus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui étaient allongés à table », selon la posture habituelle lors d’un repas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la repousser » ou « revenir sur son engagement envers elle ». Il s’agit ici de ne pas écarter sa demande après lui avoir fait une promesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: profondément attristé
  rationale: Exprime naturellement l’intensité de la tristesse indiquée par le grec, dans un registre actuel et digne.
- source_word: γενόμενος
  choice: en fut
  rationale: Rend le changement d’état exprimé par le participe, tandis que « en » rattache naturellement la réaction du roi à la demande qui vient d’être formulée.
- source_word: βασιλεὺς
  choice: le roi
  rationale: Correspondance usuelle du terme grec et titre employé par Marc dans ce récit.
- source_word: διὰ τοὺς ὅρκους
  choice: à cause de ses serments
  rationale: διά avec l’accusatif exprime ici la cause; « ses » explicite sans ambiguïté que les serments sont ceux du roi.
- source_word: ἀνακειμένους
  choice: les convives à table
  rationale: Formulation française naturelle qui conserve le cadre du repas; la posture antique, littéralement évoquée par le grec, est signalée en note.
- source_word: οὐκ ἠθέλησεν
  choice: il ne voulut pas
  rationale: Préserve la notion de volonté, et non d’incapacité.
- source_word: ἀθετῆσαι αὐτήν
  choice: lui opposer un refus
  rationale: Dans ce contexte, le verbe signifie ne pas donner suite à sa demande ou ne pas tenir l’engagement pris envers elle. Cette formulation évite de suggérer simplement le rejet de sa personne.
theological_decisions:
- issue: Valeur circonstancielle de γενόμενος et contraste avec la décision du roi
  choice: Coordination concessive naturelle avec « mais »
  alternative: « Le roi, devenu profondément attristé, à cause de ses serments et des convives à table, ne voulut pas… »
  rationale: Le grec juxtapose la profonde tristesse du roi et son refus de revenir sur sa parole. « Mais » explicite le contraste impliqué sans attribuer sa tristesse aux serments et aux convives; il ne tranche aucune question doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est restructurée pour éviter une longue incise peu naturelle et pour faire ressortir le contraste narratif entre la tristesse du roi et sa décision. « Convives à table » privilégie l’intelligibilité tout en conservant en note le détail culturel de la posture allongée.
