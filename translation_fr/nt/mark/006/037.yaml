    issue: Construction française peu idiomatique dans la question des disciples.
    rationale: « acheter pour deux cents deniers de pain » est moins naturel que « acheter du pain pour deux cents deniers » et peut créer une ambiguïté de lecture sans refléter une ambiguïté du grec.
  - severity: medium
    issue: Formulation inexacte de l’alternative dans la note a.
    rationale: « acheter deux cents deniers de pains » ne constitue pas une alternative syntaxiquement claire à « acheter du pain pour deux cents deniers ». La note doit opposer « du pain » à « des pains » tout en conservant le complément de prix.
