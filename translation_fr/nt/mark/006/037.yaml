id: MRK.6.37
reference: Mark 6:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: fr
  text: 'Mais il leur répondit : « Donnez-leur vous-mêmes à manger. » Ils lui dirent : « Irions-nous acheter du pain[a] pour deux cents deniers et leur en donner à manger ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acheter des pains pour deux cents deniers ». Le mot grec peut désigner le pain en général ou des pains individuels.
    reason: lexical_alternative
  - marker: b
    text: Un denier correspondait généralement au salaire d’une journée de travail d’un ouvrier ou d’un soldat.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: il leur répondit
  rationale: Le français naturel exprime pleinement la formule narrative grecque par « répondit », sans le pléonasme peu idiomatique « répondit et dit ».
- source_word: Δότε ... ὑμεῖς
  choice: Donnez-leur vous-mêmes
  rationale: L’impératif direct est conservé, et « vous-mêmes » rend l’insistance portée par le pronom explicite ὑμεῖς.
- source_word: φαγεῖν
  choice: à manger
  rationale: Après « donner », cette tournure française est directe, idiomatique et fidèle à l’infinitif grec.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Faudrait-il que nous allions acheter
  rationale: Cette formulation rend le participe de déplacement et la valeur délibérative, ici probablement incrédule, du subjonctif interrogatif sans transformer la question en affirmation.
- source_word: δηναρίων διακοσίων
  choice: pour deux cents deniers
  rationale: Le génitif indique le prix; « pour » le rend simplement, tandis que « deniers » est le terme français biblique usuel, expliqué en note.
- source_word: ἄρτους
  choice: de pain
  rationale: Ἄρτος peut désigner le pain ou des pains; le collectif « pain » est naturel dans ce contexte d’achat, et la note conserve l’autre possibilité.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: que nous leur donnions à manger
  rationale: La reprise de « donner ... à manger » maintient le parallèle verbal avec l’ordre de Jésus et évite la paraphrase « les nourrir ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formulation garde l’insistance de « vous-mêmes » et la question délibérative des disciples. Les marqueurs sont placés après « pain » pour l’alternative lexicale et après l’ensemble de la question pour la note culturelle.
