  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: fr
  text: Ceux qui avaient mangé les pains étaient au nombre de cinq mille hommes[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain », au sens collectif. Le mot grec peut désigner le pain ou un pain ; ici, le pluriel renvoie aux pains précis distribués dans le récit.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « hommes », terme qui désigne spécifiquement des hommes adultes, et non les personnes en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: étaient
  rationale: L’imparfait de εἰμί sert ici de copule pour indiquer l’effectif du groupe. « Étaient » reste direct et n’ajoute pas l’idée explicite d’un dénombrement.
- source_word: οἱ φαγόντες
  choice: ceux qui avaient mangé
  rationale: Le participe aoriste substantivé désigne le groupe par l’action accomplie de manger. En français, le plus-que-parfait situe naturellement cette action avant l’indication du total.
- source_word: τοὺς ἄρτους
  choice: les pains
  rationale: Le pluriel ἄρτους renvoie aux pains précis du récit de la multiplication. « Les pains » conserve ce détail concret et le nombre grammatical.
- source_word: πεντακισχίλιοι
  choice: cinq mille
  rationale: Rendu direct du nombre cardinal grec.
- source_word: ἄνδρες
  choice: hommes
  rationale: Ἀνήρ désigne ici spécifiquement des hommes, et non les personnes en général. « Hommes » préserve cette précision.
theological_decisions:
- issue: Terme masculin employé pour le dénombrement
  choice: Traduire ἄνδρες par « hommes » dans le texte principal.
  alternative: personnes
  rationale: Le grec emploie un terme spécifiquement masculin plutôt qu’un terme générique. La traduction conserve cette donnée sans décider si d’autres personnes, non comprises dans ce chiffre, étaient présentes.
translation_notes:
  register: Français international moderne, simple et digne. La formulation suit de près la structure grecque tout en employant le plus-que-parfait, naturel en français pour l’action antérieure. Les deux marqueurs de note figurent dans le texte principal.
