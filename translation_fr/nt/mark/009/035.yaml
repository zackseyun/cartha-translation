source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: fr
  text: 'Alors il s’assit, appela les Douze et leur dit : « Si quelqu’un veut être le premier, il sera le dernier de tous et le serviteur de tous. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: il s’assit
  rationale: Le participe aoriste indique ici une action préalable qui introduit l’enseignement; cette formulation est naturelle en français tout en conservant le geste narratif.
- source_word: τοὺς δώδεκα
  choice: les Douze
  rationale: L’expression désigne le groupe reconnu des douze disciples; la majuscule signale ce titre collectif usuel.
- source_word: λέγει
  choice: leur dit
  rationale: Le présent historique grec anime le récit. Le passé simple français s’intègre naturellement à la narration au passé sans modifier la portée de la parole.
- source_word: πρῶτος
  choice: le premier
  rationale: Conserve directement le vocabulaire du rang et la tension avec « le dernier ».
- source_word: ἔσχατος
  choice: le dernier
  rationale: Rend l’antithèse explicite avec « le premier » sans l’interpréter davantage.
- source_word: διάκονος
  choice: le serviteur
  rationale: Dans ce contexte, le mot désigne celui qui se met au service des autres; « serviteur » reste large et évite le sens ecclésiastique plus spécialisé de « diacre ».
theological_decisions:
- issue: Portée de la déclaration conditionnelle sur la primauté
  choice: « Si quelqu’un veut être le premier, il sera le dernier de tous et le serviteur de tous. »
  alternative: « Si quelqu’un veut être le premier, qu’il soit le dernier de tous et le serviteur de tous. »
  rationale: Le grec porte formellement le futur ἔσται (« il sera »), non un impératif. La traduction conserve donc la formulation déclarative et sa tension possible entre conséquence et exigence, sans la résoudre silencieusement en commandement.
translation_notes:
  register: Français moderne, international et digne. Syntaxe fluide pour un récit destiné à la lecture publique; parallélisme « premier / dernier » et répétition de « tous » préservés.
