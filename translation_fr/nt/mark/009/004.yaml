  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: fr
  text: Élie leur apparut avec Moïse, et ils s’entretenaient avec Jésus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη αὐτοῖς
  choice: leur apparut
  rationale: L’aoriste passif de ὁράω a ici le sens naturel d’« apparaître »; le datif αὐτοῖς désigne ceux à qui l’apparition se manifeste.
- source_word: Ἠλίας σὺν Μωϋσεῖ
  choice: Élie avec Moïse
  rationale: Les formes françaises usuelles des noms bibliques sont retenues, et σὺν exprime simplement l’accompagnement.
- source_word: ἦσαν συλλαλοῦντες
  choice: ils s’entretenaient
  rationale: La construction périphrastique indique une action en cours, tandis que συλλαλέω exprime un échange réciproque. « S’entretenaient » est naturel, digne et précis.
- source_word: τῷ Ἰησοῦ
  choice: avec Jésus
  rationale: Avec le verbe συλλαλέω, le datif désigne l’interlocuteur; « avec Jésus » rend clairement le caractère réciproque de la conversation.
theological_decisions:
- issue: Nature de l’apparition d’Élie et de Moïse lors de la transfiguration
  choice: Présenter directement Élie et Moïse comme apparaissant et s’entretenant avec Jésus.
  alternative: Qualifier l’événement de vision subjective ou de représentation symbolique.
  rationale: Le récit grec décrit sans réserve leur apparition et leur conversation. La traduction conserve cette présentation sans lui ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, fluide et digne. « S’entretenaient » préserve l’idée d’une conversation mutuelle sans lourdeur. La conjonction initiale n’est pas reproduite, conformément à l’usage narratif naturel du français lorsque le verset est lu dans son contexte.
