  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: fr
  text: 'Après avoir poussé un cri et avoir violemment fait convulser le garçon[a], l’esprit sortit. Le garçon devint comme mort[b], si bien que beaucoup disaient : « Il est mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après lui avoir causé de violentes convulsions ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devint comme mort » ; le texte décrit son apparence sans affirmer ici qu’il était réellement mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: après avoir poussé un cri
  rationale: Le participe aoriste exprime une action liée à la sortie de l’esprit. « Pousser un cri » garde le sens verbal sans préciser indûment qu’il s’agissait d’un hurlement ou d’un cri aigu.
- source_word: πολλὰ σπαράξας
  choice: violemment secoué le garçon de convulsions
  rationale: Dans ce récit d’exorcisme, σπαράσσω désigne des secousses convulsives plutôt qu’une déchirure littérale. πολλὰ a une valeur intensive, rendue naturellement par « violemment ». Le garçon, objet implicite, est explicité pour la clarté en français.
- source_word: ἐξῆλθεν
  choice: l’esprit sortit
  rationale: Le sujet implicite est l’esprit mentionné dans le contexte. Le nommer évite qu’un pronom français soit pris à tort pour le garçon.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Le garçon devint comme mort
  rationale: La comparaison ὡσεὶ décrit son état apparent sans affirmer que la mort a réellement eu lieu.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: si bien que beaucoup disaient
  rationale: « Beaucoup » rend τοὺς πολλούς sans imposer le sens de « la plupart ». L’imparfait « disaient » traduit naturellement la réaction en cours exprimée par l’infinitif présent.
- source_word: ὅτι ἀπέθανεν
  choice: « Il est mort. »
  rationale: 'Le discours direct est naturel en français. Dans cette réaction immédiate des témoins, le passé grec exprime idiomatiquement leur conclusion présente : « Il est mort. »'
theological_decisions:
- issue: Mort réelle ou apparence de mort
  choice: Le garçon est décrit comme paraissant mort, tandis que les témoins concluent qu’il est mort.
  alternative: Affirmer que le garçon est réellement mort, éventuellement de façon temporaire.
  rationale: La comparaison ὡσεὶ (« comme ») et l’attribution de la déclaration aux témoins distinguent la description du narrateur de leur conclusion. La traduction conserve cette tension sans introduire dans le verset une affirmation de résurrection.
translation_notes:
  register: Français international moderne, narratif et digne. « Le garçon » et « l’esprit » explicitent des référents implicites afin d’éviter toute ambiguïté grammaticale en français, sans ajouter de détail doctrinal.
