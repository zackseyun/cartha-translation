  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: fr
  text: Et soudain, regardant autour d’eux, ils ne virent plus personne, sinon Jésus seul avec eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: soudain
  rationale: Rend naturellement l’idée d’un changement brusque exprimée par l’adverbe grec.
- source_word: περιβλεψάμενοι
  choice: regardant autour d’eux
  rationale: 'Conserve le sens du participe aoriste : les disciples portent leur regard tout autour avant de constater que les autres ont disparu.'
- source_word: οὐκέτι οὐδένα ... ἀλλὰ
  choice: ne ... plus personne, sinon
  rationale: 'Reproduit clairement la construction d’exclusion : personne d’autre ne reste visible.'
- source_word: τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: Jésus seul avec eux
  rationale: Préserve l’insistance de μόνον sur Jésus et le complément μεθ’ ἑαυτῶν.
theological_decisions:
- issue: Portée de « seul »
  choice: « Jésus seul avec eux »
  alternative: « seulement Jésus avec eux »
  rationale: La formulation retenue garde l’accent grec sur Jésus comme l’unique personne encore présente avec les disciples, sans ajouter d’interprétation théologique.
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre biblique littéraire tout en restant immédiatement compréhensible.
