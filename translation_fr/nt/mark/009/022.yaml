  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: fr
  text: Souvent, il l’a jeté dans le feu et dans l’eau[a] pour le faire périr. Mais si tu peux faire quelque chose, viens à notre aide et aie compassion de nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «dans des eaux» ; le grec emploie le pluriel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : «viens à notre aide, dans ta compassion pour nous». Le grec emploie un participe : «ayant compassion de nous».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: souvent
  rationale: Rend naturellement l’adverbe de répétition en français moderne; le contexte exprime des épisodes récurrents.
- source_word: ἔβαλεν
  choice: il l’a jeté
  rationale: Le passé composé résume des actes répétés dont les conséquences demeurent présentes dans le récit du père.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: dans le feu et dans l’eau
  rationale: La répétition de «dans» reflète celle de la préposition grecque. Le singulier collectif «l’eau» est idiomatique en français; une note signale le pluriel grec.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: pour le faire périr
  rationale: Exprime clairement le but destructeur sans limiter nécessairement ἀπόλλυμι au seul verbe «tuer».
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Mais si tu peux faire quelque chose
  rationale: Conserve τι («quelque chose») et l’hésitation explicite du père au sujet de la capacité de Jésus.
- source_word: βοήθησον ἡμῖν
  choice: viens à notre aide
  rationale: Impératif direct et naturel qui conserve le pluriel «notre», le père s’associant à son fils.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: pris de compassion pour nous
  rationale: Préserve la construction participiale et la force affective de σπλαγχνίζομαι dans un registre digne et courant.
theological_decisions:
- issue: L’hésitation du père quant à la capacité de Jésus
  choice: «si tu peux faire quelque chose»
  alternative: «si tu en es capable» ou une formulation qui atténue le doute
  rationale: Le grec exprime réellement l’incertitude du père. La traduction maintient cette tension, qui prépare directement la réponse de Jésus, sans transformer la demande en confession plus assurée.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient au dialogue biblique direct. «Faire périr» conserve une portée plus large que «tuer», tandis que «pris de compassion» maintient le participe grec sans lourdeur excessive.
