id: MRK.9.34
reference: Mark 9:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: fr
  text: Mais eux gardaient le silence, car, en chemin, ils avaient discuté entre eux pour savoir qui était le plus grand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui était plus grand » ; le grec emploie le comparatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: gardaient le silence
  rationale: L’imparfait exprime un silence qui se prolonge en réponse à la question de Jésus ; « gardaient le silence » en rend naturellement l’aspect duratif.
- source_word: διελέχθησαν
  choice: avaient discuté
  rationale: Le verbe désigne ici un échange entre les disciples. « Avaient discuté » préserve sa gamme sémantique sans imposer un degré de conflit que le contexte suggère, mais que le mot seul n’exige pas. Le plus-que-parfait situe cet échange avant leur silence.
- source_word: πρὸς ἀλλήλους
  choice: entre eux
  rationale: Cette expression réciproque indique que les disciples échangeaient les uns avec les autres ; « entre eux » est idiomatique en français.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: « En chemin » rend naturellement l’expression grecque dans ce contexte de déplacement et maintient le motif marcien du chemin.
- source_word: τίς μείζων
  choice: qui était le plus grand
  rationale: Bien que μείζων soit morphologiquement comparatif, le français emploie naturellement le superlatif relatif lorsqu’il s’agit d’identifier, au sein d’un groupe, celui qui occupe le rang supérieur. Une note signale la formulation grecque plus littérale.
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: δέ marque le contraste avec la question précédente de Jésus, tandis que « eux » met naturellement en relief l’absence de réponse des disciples.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit l’explication de leur silence ; « car » exprime clairement ce lien causal dans un registre narratif digne et courant.
theological_decisions:
- issue: Comparatif μείζων ou superlatif idiomatique en français
  choice: qui était le plus grand
  alternative: qui était plus grand
  rationale: Le grec conserve un comparatif susceptible d’être compris comme un comparatif à valeur superlative dans ce contexte de rivalité au sein du groupe. Le texte français adopte l’idiome naturel « le plus grand », tout en conservant la forme plus littérale dans une note afin de ne pas masquer l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le contraste initial, l’aspect duratif du silence et l’antériorité de la discussion. La note rend visible le comparatif grec sans alourdir le corps du texte.
