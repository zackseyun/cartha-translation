id: MRK.9.30
reference: Mark 9:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: fr
  text: Partis de là, ils traversaient la Galilée, et Jésus ne voulait pas que quelqu’un le sache.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ne précise pas ce que Jésus ne voulait pas que l’on sache; dans le contexte, il peut s’agir de sa présence ou de son passage en Galilée.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Partis de là
  rationale: Cette formulation rend à la fois la continuité narrative de καί, l’éloignement exprimé par ἐκεῖθεν et le départ marqué par le participe ἐξελθόντες, dans un français naturel.
- source_word: παρεπορεύοντο
  choice: ils traversaient
  rationale: L’imparfait français reflète l’aspect duratif de l’imparfait grec et le verbe exprime le déplacement à travers une région.
- source_word: διὰ τῆς Γαλιλαίας
  choice: la Galilée
  rationale: Avec « traverser », le complément direct rend naturellement le mouvement à travers la région exprimé par διά suivi du génitif.
- source_word: οὐκ ἤθελεν
  choice: Jésus ne voulait pas
  rationale: θέλω exprime ici la volonté. Le nom « Jésus » explicite en français le sujet singulier que le contexte grec permet d’identifier.
- source_word: ἵνα τις γνοῖ
  choice: que quelqu’un le sache
  rationale: La proposition rend le contenu volitif de ἵνα avec le subjonctif. Le pronom « le » reprend sans la préciser l’information laissée implicite en grec.
theological_decisions:
- issue: Sujet implicite de ἤθελεν
  choice: « Jésus » est nommé comme sujet.
  alternative: Employer seulement « il ».
  rationale: Le verbe singulier renvoie naturellement à Jésus dans le contexte. Le nom évite en français une ambiguïté référentielle sans ajouter de contenu théologique.
- issue: Objet implicite de γνοῖ
  choice: L’objet demeure indéterminé, repris par « le ».
  alternative: Préciser que personne ne devait savoir qu’il se trouvait en Galilée ou connaître son itinéraire.
  rationale: Le grec ne dit pas explicitement ce qui ne devait pas être su; la traduction préserve cette indétermination plutôt que de trancher selon le contexte.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « traversaient » conserve la progression en cours, tandis que « Partis de là » rend explicitement le départ préalable. La phrase évite une formulation lourde tout en maintenant l’implicite du texte grec.
