  yaml_path: translation/nt/mark/009/044.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: fr
  text: là où leur ver ne meurt pas et le feu ne s’éteint pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que d’anciennes traductions coptes. Il figure toutefois dans l’Alexandrinus du Ve siècle, dans la tradition latine et dans la majorité des manuscrits byzantins plus tardifs. Il s’agit probablement d’un ajout scribal reprenant mot pour mot la phrase du verset 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ver
  rationale: Équivalent français direct et traditionnel, il désigne ici le ver qui se nourrit de matière en décomposition et conserve l’écho d’Ésaïe 66.24.
- source_word: τελευτᾷ
  choice: meurt
  rationale: Le verbe peut signifier « arriver à sa fin » ou « mourir » ; appliqué à un être vivant, « meurt » est la formulation française la plus naturelle.
- source_word: σβέννυται
  choice: s’éteint
  rationale: Le passif grec signifie « être éteint ». En français courant, un feu « s’éteint » ; la négation exprime clairement son caractère inextinguible.
- source_word: ὅπου
  choice: là où
  rationale: Cette expression rend naturellement le relatif de lieu grec et rattache le verset à la description du lieu évoqué dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme de la phrase grecque et son imagerie traditionnelle, sans expliciter davantage la nature du châtiment.
