  - severity: low
    issue: Alternative plurielle « ces propos » dans la note
    rationale: Bien que l’expression puisse renvoyer globalement à une déclaration, le grec τὸ ῥῆμα est au singulier. Des alternatives au singulier préservent plus directement la forme et la portée lexicale du source.
