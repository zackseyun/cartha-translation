  source_fidelity: Le texte rend fidèlement les deux imparfaits (ἠγνόουν, ἐφοβοῦντο), le référent de αὐτόν (Jésus) et l’infinitif ἐπερωτῆσαι. « Cette parole » est une traduction recevable de τὸ ῥῆμα dans son contexte immédiat.
