  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: fr
  text: Mais ils ne comprenaient pas cette parole[a], et ils avaient peur de l’interroger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration » ou « ce qu’il avait dit ». Le grec ῥῆμα peut désigner une parole prononcée, une déclaration ou ce qui a été dit.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais eux
  rationale: δέ marque ici le contraste avec l’annonce précédente de Jésus; οἱ désigne implicitement les disciples. La tournure « Mais eux » exprime naturellement ce contraste en français.
- source_word: ἠγνόουν
  choice: ne comprenaient pas
  rationale: Dans ce contexte, ἀγνοέω désigne l’absence de compréhension. L’imparfait français rend l’état continu exprimé par l’imparfait grec.
- source_word: τὸ ῥῆμα
  choice: cette parole
  rationale: ῥῆμα renvoie aux propos que Jésus vient de prononcer. « Cette parole » est une formulation biblique encore naturelle et permet de viser l’ensemble de son annonce plutôt qu’un mot isolé.
- source_word: ἐφοβοῦντο
  choice: ils avaient peur
  rationale: Cette expression courante rend clairement l’état durable de crainte indiqué par l’imparfait grec.
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom objet renvoie à Jésus; il est naturellement élidé devant « interroger ».
- source_word: ἐπερωτῆσαι
  choice: interroger
  rationale: ἐπερωτάω signifie demander ou questionner. Après « avoir peur de », « l’interroger » indique naturellement qu’ils n’osaient pas lui demander une explication.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait est conservé dans les deux propositions pour rendre les états continus du grec. « Cette parole » maintient une légère amplitude sémantique, explicitée en note.
