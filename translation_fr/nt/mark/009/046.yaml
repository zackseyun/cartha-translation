  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ, καὶ τὸ πῦρ οὐ σβέννυται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/046.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: fr
  text: où leur ver ne meurt pas et le feu ne s’éteint pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que d’anciennes traductions coptes. Il figure toutefois dans la majorité des manuscrits byzantins et dans la tradition latine. Il s’agit probablement d’un ajout tardif de copiste reprenant mot pour mot le verset 48 (ainsi que le verset 44 dans les manuscrits qui le contiennent).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ver
  rationale: Désigne un ver, éventuellement un asticot, qui se nourrit de matière en décomposition. « Ver » conserve le lien verbal et traditionnel avec Ésaïe 66.24.
- source_word: τελευτᾷ
  choice: meurt
  rationale: Dans ce contexte, le ver est présenté comme ne mourant pas. Le présent grec exprime ici une situation continue.
- source_word: σβέννυται
  choice: s’éteint
  rationale: Rend naturellement en français l’idée d’un feu qui n’est pas éteint et ne cesse pas de brûler, tout en conservant la forme passive ou moyenne du grec sous une tournure idiomatique.
theological_decisions:
- issue: Portée de l’image du ver et du feu
  choice: Conserver littéralement les deux images sans en préciser le mécanisme théologique.
  alternative: Interpréter explicitement ces images comme décrivant un type déterminé de châtiment.
  rationale: Le texte reprend le langage d’Ésaïe 66.24 et ne tranche pas à lui seul les débats sur la nature exacte du jugement.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « où » clarifie la coordination en français. « Ne s’éteint pas » est plus naturel aujourd’hui que « n’est pas éteint », sans affaiblir l’image traditionnelle.
