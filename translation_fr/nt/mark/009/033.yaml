  source_fidelity: 'La traduction rend correctement l’arrivée à Capharnaüm, le cadre concret de « la maison », l’identification contextuelle de Jésus comme sujet singulier, et la question portant sur leur conversation pendant le trajet. Toutefois, « Une fois dans la maison » peut suggérer plus nettement qu’ils y sont tous entrés, alors que le participe singulier se rapporte à Jésus : « Lorsqu’il fut dans la maison » est plus proche de la construction et conserve le sujet singulier. L’imparfait ἐπηρώτα est mieux représenté par « leur demandait » que par le passé simple « demanda », sans que cela impose une répétition précise.'
  naturalness: « Lorsqu’il fut dans la maison, Jésus leur demandait » est naturel dans un récit biblique français au passé simple et restitue l’arrière-plan imperfectif de la demande. « De quoi discutiez-vous en chemin ? » est idiomatique et garde le ton non spécifié du grec.
  terminology: '« Capharnaüm », « la maison » et « en chemin » sont appropriés. La note conserve à juste titre l’alternative plus conflictuelle de διελογίζεσθε. La précision finale doit éviter « ils parlaient », qui est moins exacte que le grec et que le contexte : le verset suivant indique qu’ils avaient discuté de qui était le plus grand.'
