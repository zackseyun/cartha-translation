source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: fr
  text: 'Ils arrivèrent à Capharnaüm. Lorsqu’il fut dans la maison, Jésus leur demandait : « De quoi discutiez-vous en chemin[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de quoi vous disputiez-vous en chemin ? » Le verbe peut désigner une discussion, un débat ou une dispute ; le verset suivant indique qu’ils avaient discuté de qui était le plus grand.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: Ils arrivèrent
  rationale: Avec εἰς et un nom de lieu, le verbe décrit ici l’arrivée à Capharnaüm. « Arrivèrent » est naturel en français narratif.
- source_word: Καφαρναούμ
  choice: Capharnaüm
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: ἐν τῇ οἰκίᾳ γενόμενος
  choice: Une fois dans la maison
  rationale: Rend naturellement la valeur temporelle du participe et conserve la maison comme cadre concret, sans supposer qu’il s’agit du domicile de Jésus.
- source_word: ἐπηρώτα
  choice: demanda
  rationale: L’imparfait grec peut présenter une action en cours ou répétée, mais dans ce contexte de question directe, le passé simple français exprime plus naturellement l’acte narratif sans perte contextuelle significative.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: Équivalent idiomatique français dans un contexte de déplacement.
- source_word: διελογίζεσθε
  choice: discutiez-vous
  rationale: Le verbe peut évoquer une discussion, un débat ou une dispute. « Discutiez-vous » conserve cette amplitude, tandis que le verset suivant précise le caractère conflictuel de l’échange.
theological_decisions:
- issue: Sujet pluriel de ἦλθον puis sujet singulier de γενόμενος et ἐπηρώτα
  choice: Rendre l’arrivée au pluriel, puis nommer Jésus comme sujet de la question.
  alternative: 'Conserver un pronom implicite ou explicite : « une fois dans la maison, il leur demanda ».'
  rationale: Le contexte identifie Jésus comme sujet singulier. Le nommer en français évite une ambiguïté référentielle sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit. La formulation préserve l’indétermination du ton de διελογίζεσθε dans ce verset, avec l’alternative plus vive en note.
