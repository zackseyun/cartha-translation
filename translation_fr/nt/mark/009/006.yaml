  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: fr
  text: En effet, il ne savait que répondre[a], car ils furent saisis de terreur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qu’il devait répondre » ou « quoi répondre ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le grec indique qu’ils entrèrent dans un état de grande peur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: il ne savait
  rationale: Le verbe οἶδα exprime ici la connaissance ou le fait de savoir ; à l’imparfait, « il ne savait » rend naturellement la forme grecque.
- source_word: τί ἀποκριθῇ
  choice: que répondre
  rationale: Cette tournure française concise conserve le sens délibératif (« ce qu’il devait répondre ») et la valeur de réponse propre à ἀποκρίνομαι.
- source_word: ἔκφοβοι
  choice: saisis de terreur
  rationale: ἔκφοβος désigne une peur intense ; cette expression rend cette force dans un français naturel et digne.
- source_word: ἐγένοντο
  choice: avaient été saisis
  rationale: Cette formulation exprime l’entrée dans un état portée par γίνομαι, tout en situant naturellement leur terreur comme raison de la réaction de Pierre.
- source_word: γὰρ … γὰρ
  choice: En effet … car
  rationale: Les deux articulations explicatives sont conservées sans imposer au français une répétition lourde du même connecteur.
theological_decisions:
- issue: Sujet de la proposition au pluriel
  choice: ils avaient été saisis de terreur
  alternative: il avait été saisi de terreur
  rationale: L’adjectif ἔκφοβοι et le verbe ἐγένοντο sont au pluriel ; dans le contexte, ils renvoient naturellement à Pierre et à ses compagnons, et non à Pierre seul.
translation_notes:
  register: Français international moderne, naturel et digne. « Que répondre » est idiomatique, tandis que « avaient été saisis de terreur » préserve la forte intensité de ἔκφοβοι et la nuance d’entrée dans un état de ἐγένοντο.
