id: MRK.9.19
reference: Mark 9:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: fr
  text: 'Il leur répond : « Ô génération incrédule[a], jusqu’à quand serai-je avec vous ? Jusqu’à quand vous supporterai-je[b] ? Amenez-le-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « génération sans foi » ou « infidèle ». Le grec peut désigner un manque de foi ou un manque de fidélité.
    reason: lexical_alternative
  - marker: b
    text: Ou « Jusqu’à quand vous endurerai-je ? » ou « Jusqu’à quand vous supporterai-je ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Il leur répond
  rationale: Cette formulation française naturelle rend le participe de réponse, son complément au datif et le présent historique de Marc, sans reproduire lourdement la syntaxe grecque.
- source_word: γενεὰ ἄπιστος
  choice: génération sans foi
  rationale: « Sans foi » exprime naturellement le défaut de foi ou de confiance dans ce contexte, tout en laissant ouverte la nuance possible de manque de fidélité, signalée en note.
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: jusqu’à quand serai-je avec vous ?
  rationale: Rend directement la question temporelle et la présence relationnelle exprimée par πρός avec εἰμί.
- source_word: ἀνέξομαι ὑμῶν
  choice: devrai-je vous supporter
  rationale: « Supporter » conserve la force d’endurer ou de tolérer. L’ajout idiomatique de « devrai-je » exprime en français la durée péniblement subie sans modifier le sens fondamental.
- source_word: φέρετε αὐτὸν πρός με
  choice: Amenez-le-moi
  rationale: Impératif français direct et naturel indiquant que le garçon doit être conduit jusqu’à Jésus.
theological_decisions:
- issue: Portée de ἄπιστος dans l’interpellation de Jésus
  choice: sans foi
  alternative: incrédule ; infidèle
  rationale: Le contexte met en avant l’absence de foi ou de confiance, mais le grec peut aussi évoquer un manque de fidélité. La traduction principale n’impose donc pas une conclusion doctrinale plus étroite, et la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le présent narratif de Marc est conservé dans « Il leur répond ». « Génération sans foi » reste intelligible sans coloration confessionnelle particulière, et « supporter » maintient l’exaspération perceptible dans la parole de Jésus.
