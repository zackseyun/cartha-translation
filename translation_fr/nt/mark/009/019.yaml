  naturalness: Le français est globalement fluide et de registre biblique moderne. « Jusqu’à quand vous supporterai-je ? » est à la fois naturel et plus directement conforme au grec que « devrai-je vous supporter ». « Ô génération incrédule » convient à une apostrophe solennelle et conserve la force de l’original.
