  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: fr
  text: Car celui qui n’est pas contre nous est pour nous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est de notre côté ». L’expression grecque peut aussi avoir le sens de « en notre faveur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: celui qui
  rationale: Le pronom relatif est employé de manière générique et substantivée. « Celui qui » est naturel en français moderne et conserve la portée générale de l’énoncé.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit ici l’explication de la parole précédente. « Car » exprime ce lien avec concision dans un registre digne et courant.
- source_word: οὐκ ἔστιν
  choice: n’est pas
  rationale: La copule niée se rend directement au présent, sans ajout interprétatif.
- source_word: καθ’ ἡμῶν
  choice: contre nous
  rationale: κατά avec le génitif marque ici l’opposition. « Contre nous » est clair et idiomatique.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: ὑπέρ avec le génitif peut signifier « pour », « en faveur de » ou « du côté de ». « Pour nous » maintient le parallélisme bref avec « contre nous » tout en préservant l’éventail sémantique par une note.
- source_word: ἐστιν
  choice: est
  rationale: La copule simple qui achève l’antithèse est rendue directement.
theological_decisions:
- issue: Portée de l’adhésion exprimée par « contre nous » et « pour nous »
  choice: Conserver les formulations relationnelles « contre nous » et « pour nous » sans les expliciter davantage.
  alternative: « Celui qui ne s’oppose pas à notre mission est de notre côté » ou « celui qui n’est pas contre Dieu est pour Dieu ».
  rationale: Le grec emploie explicitement la première personne du pluriel. Cette traduction garde la formulation de Jésus et laisse le contexte déterminer sa portée, sans introduire une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique brève du grec est conservée, ainsi que le lien explicatif introduit par « Car ».
