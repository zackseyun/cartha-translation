  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: fr
  text: 'Mais Jésus, voyant que la foule accourait rapidement[a], menaça l’esprit impur et lui dit : « Esprit muet et sourd, je te l’ordonne, sors de cet enfant et n’entre plus jamais en lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une foule accourait en se rassemblant ». Le verbe grec évoque des gens qui convergent rapidement.'
    reason: Alternative lexicale préservant plus littéralement l’idée de courir ensemble.
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Mais Jésus, voyant
  rationale: Le participe aoriste exprime la circonstance qui précède l’action principale, tandis que δέ marque une transition légère; cette formulation est naturelle en français narratif.
- source_word: ἐπισυντρέχει ὄχλος
  choice: la foule accourait de toutes parts
  rationale: Le verbe évoque une foule convergeant rapidement; « accourait de toutes parts » restitue le mouvement et l’urgence sans lourdeur.
- source_word: ἐπετίμησεν
  choice: menaça
  rationale: Dans le langage évangélique d’exorcisme, ἐπιτιμάω désigne une réprimande autoritaire. « Menaça » est l’équivalent français traditionnel et idiomatique dans ce contexte, sans suggérer une simple remontrance.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: l’esprit impur
  rationale: « Esprit impur » restitue l’expression grecque consacrée dans un français actuel et conserve ses connotations religieuses et morales.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Esprit muet et sourd
  rationale: Le nominatif articulé fonctionne ici comme une apostrophe. Les deux incapacités sont maintenues distinctes, sans les réduire à une maladie impersonnelle.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: je te l’ordonne
  rationale: La tournure exprime nettement l’autorité du commandement et donne un relief naturel au pronom explicite ἐγώ.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: sors de cet enfant
  rationale: « Sors de » est l’impératif français naturel. Le référent masculin est explicité comme « cet enfant » d’après le contexte immédiat, afin d’éviter l’ambiguïté peu naturelle de « sors de lui ».
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: n’entre plus jamais en lui
  rationale: Cette formulation rend l’interdiction décisive de toute nouvelle entrée et conserve le pronom du texte grec.
theological_decisions:
- issue: Terminologie démoniaque et autorité de Jésus
  choice: Conserver « esprit impur », l’adresse personnelle et des verbes d’autorité (« menaça », « je te l’ordonne »).
  alternative: « mauvais esprit »; « esprit maléfique »; « parla sévèrement à l’esprit »
  rationale: Le récit présente une entité personnelle directement interpellée et soumise à l’ordre de Jésus. La traduction ne la réduit pas à une pathologie et n’ajoute aucune explication doctrinale.
- issue: Référent de αὐτοῦ dans l’ordre de sortie
  choice: « cet enfant »
  alternative: « lui »
  rationale: Le contexte identifie clairement le garçon possédé. L’explicitation améliore la clarté française sans modifier l’interprétation du passage.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide à l’oral comme à l’écrit; le vocabulaire religieux demeure intelligible sans paraphrase doctrinale.
