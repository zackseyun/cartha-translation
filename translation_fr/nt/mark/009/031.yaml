id: MRK.9.31
reference: Mark 9:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: fr
  text: 'Car il enseignait à ses disciples et leur disait : « Le Fils de l’homme est livré aux mains des hommes[a] ; ils le tueront et, une fois tué, il ressuscitera après trois jours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « entre des mains humaines ». Le grec dit littéralement : « aux mains des hommes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans trois jours ». Le grec dit : « après trois jours », expression employée ailleurs parallèlement à « le troisième jour ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: il enseignait
  rationale: L’imparfait grec présente une action en cours ou répétée à l’arrière-plan du récit ; l’imparfait français en rend naturellement l’aspect.
- source_word: γὰρ
  choice: Car
  rationale: Le connecteur introduit l’explication de ce qui précède ; « car » en conserve la force sans la surinterpréter.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ses disciples
  rationale: « Disciples » est le terme évangélique courant et garde l’idée d’apprentissage ainsi que de relation au maître.
- source_word: ἔλεγεν αὐτοῖς
  choice: leur disait
  rationale: L’imparfait indique ici encore une parole prolongée ou répétée ; la formulation est naturelle en français.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Le Fils de l’homme
  rationale: Traduction consacrée de cette auto-désignation, qui en préserve les résonances possibles sans les expliciter.
- source_word: παραδίδοται
  choice: est livré
  rationale: Le présent passif évoque une remise imminente ou déjà en cours sans nommer l’agent. « Est livré » reste assez large pour ne pas réduire le sens à la seule trahison.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: aux mains des hommes
  rationale: Cette formulation conserve l’image concrète des « mains », qui exprime le pouvoir exercé, ainsi que le contraste verbal entre le Fils de l’homme et les hommes.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: ils le tueront
  rationale: Le futur actif pluriel désigne des agents humains non précisés ; « tueront » exprime le sens directement et clairement.
- source_word: ἀποκτανθεὶς
  choice: une fois tué
  rationale: Le participe aoriste passif marque une action antérieure à la résurrection. « Une fois tué » maintient cette séquence et le passif dans un français fluide.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: après trois jours
  rationale: μετά avec l’accusatif signifie normalement « après ». La traduction conserve ici la formulation propre à Marc sans l’harmoniser avec « le troisième jour ».
- source_word: ἀναστήσεται
  choice: il ressuscitera
  rationale: Le futur moyen a ici un sens intransitif. « Ressuscitera » est naturel en français et n’impose pas le passif « sera ressuscité », absent de cette forme grecque.
theological_decisions:
- issue: Contraste entre Ὁ υἱὸς τοῦ ἀνθρώπου et ἀνθρώπων
  choice: Le Fils de l’homme … aux mains des hommes
  alternative: Le Fils de l’homme … entre des mains humaines
  rationale: La répétition de « homme/hommes » rend perceptible le contraste rhétorique du grec. La note signale l’autre formulation française possible.
- issue: Voix et portée de παραδίδοται
  choice: est livré
  alternative: est trahi
  rationale: Le passif grec ne précise pas l’agent et peut englober trahison, arrestation, remise aux autorités et permission divine. « Est livré » préserve cette tension.
- issue: Forme de l’annonce de la résurrection
  choice: il ressuscitera
  alternative: il sera ressuscité
  rationale: La forme grecque autorise une expression intransitive ; le français « ressuscitera » suit cette formulation sans importer un passif théologique depuis d’autres passages.
- issue: Repère temporel de la résurrection
  choice: après trois jours
  alternative: le troisième jour
  rationale: Le texte grec dit explicitement « après trois jours ». Cette formulation est conservée plutôt que silencieusement harmonisée avec les annonces parallèles.
translation_notes:
  register: Français international moderne, clair et digne. Les imparfaits installent l’enseignement continu à l’arrière-plan. La tournure « une fois tué » évite la lourdeur de « après avoir été tué » tout en conservant l’antériorité et la voix passive. Les deux marqueurs de note figurent dans le texte principal.
