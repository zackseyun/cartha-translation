id: MRK.9.39
reference: Mark 9:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: fr
  text: 'Mais Jésus dit : « Ne l’en empêchez pas, car personne qui accomplira un acte de puissance[a] en mon nom ne pourra, peu après, dire du mal de moi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un miracle » ou « un acte puissant » ; littéralement « une puissance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « m’insulter » ou « me calomnier » ; littéralement « dire du mal de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: empêchez
  rationale: 'Dans ce contexte, l’impératif présent avec μή interdit aux disciples de continuer à faire obstacle à cet homme. « Ne l’en empêchez pas » est idiomatique et reprend le complément implicite : agir au nom de Jésus.'
- source_word: δύναμιν
  choice: un acte de puissance
  rationale: Le nom désigne ici une manifestation de puissance, un acte puissant. Cette formulation conserve le lien lexical avec la puissance sans réduire d’emblée le terme au seul mot « miracle ».
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Expression française naturelle qui indique que l’acte est accompli en invoquant le nom de Jésus ou sous son autorité, sans trancher davantage entre ces nuances.
- source_word: ταχὺ
  choice: peu après
  rationale: L’adverbe exprime ici la proximité temporelle. « Peu après » rend ce sens plus clairement que « rapidement », qui pourrait décrire la manière de parler.
- source_word: κακολογῆσαί
  choice: dire du mal de moi
  rationale: Cette expression rend directement l’idée de parler en mal de quelqu’un sans imposer le sens juridique plus étroit de « calomnier » ni la nuance spécifique de « maudire ».
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: car personne qui
  rationale: La tournure française resserre naturellement la construction existentielle grecque tout en maintenant sa portée générale et négative.
- source_word: δυνήσεται
  choice: ne pourra
  rationale: Le futur de δύναμαι exprime la capacité à venir; « ne pourra » en conserve explicitement la valeur modale et temporelle.
theological_decisions:
- issue: Nature de l’acte accompli au nom de Jésus
  choice: « un acte de puissance »
  alternative: « un miracle » ou « un acte puissant »
  rationale: Le grec δύναμις peut désigner une manifestation extraordinaire de puissance. Le choix retenu préserve son étendue sémantique et son lien avec la notion de puissance, tandis que la note fournit des équivalents plus courants.
- issue: Portée de l’association avec Jésus
  choice: Formulation descriptive limitée à l’affirmation du verset
  alternative: Expliciter que l’homme est un véritable disciple, ou au contraire qu’il agit par opportunisme
  rationale: Jésus affirme seulement que celui qui accomplit un acte de puissance en son nom ne pourra pas, peu après, parler en mal de lui. Le texte ne permet pas de conclure davantage sur le statut spirituel ou les motivations de cet homme.
translation_notes:
  register: Français international moderne, clair et digne. « Ne l’en empêchez pas » est naturel dans le contexte immédiat; « acte de puissance » demeure légèrement soutenu afin de préserver le vocabulaire grec, avec des formulations plus usuelles données en note.
