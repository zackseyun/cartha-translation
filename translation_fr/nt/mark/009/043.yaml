id: MRK.9.43
reference: Mark 9:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: fr
  text: Et si ta main te fait tomber[a], coupe-la. Mieux vaut pour toi entrer dans la vie avec une main en moins que de t’en aller avec tes deux mains dans la géhenne[b], dans le feu qui ne s’éteint pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te pousse à pécher ». Le verbe grec peut évoquer le fait de faire trébucher ou tomber quelqu’un, ou de le pousser au péché.'
    reason: lexical_alternative
  - marker: b
    text: La géhenne est la forme grecque d’un nom de lieu associé au jugement divin; le terme est traditionnellement traduit par « enfer ».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: te fait tomber
  rationale: Conserve en français l’image de la chute, tout en laissant ouverte sa portée morale et spirituelle dans ce contexte d’avertissement.
- source_word: ἀπόκοψον
  choice: coupe-la
  rationale: Rend directement l’impératif énergique et l’image corporelle saisissante du grec.
- source_word: καλόν
  choice: mieux vaut
  rationale: Dans la construction comparative avec ἤ, cette tournure idiomatique exprime naturellement en français qu’une situation est préférable à l’autre.
- source_word: κυλλόν
  choice: avec une main en moins
  rationale: Le contexte précise la mutilation envisagée. Cette formulation courante et respectueuse exprime clairement le fait d’être privé d’une main, sans employer un qualificatif potentiellement stigmatisant.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: entrer dans la vie
  rationale: Préserve l’expression eschatologique ainsi que le mouvement d’entrée exprimé par le grec.
- source_word: ἀπελθεῖν
  choice: t’en aller
  rationale: Conserve la nuance directionnelle du verbe et son contraste avec « entrer dans la vie ».
- source_word: γέενναν
  choice: géhenne
  rationale: Maintient le nom spécifique employé dans le texte grec et son arrière-plan juif, au lieu de le remplacer d’emblée par un terme théologique plus large.
- source_word: ἄσβεστον
  choice: qui ne s’éteint pas
  rationale: Rend précisément et naturellement en français l’idée d’un feu non éteint ou impossible à éteindre.
- source_word: χεὶρ σου
  choice: ta main
  rationale: Traduction directe nécessaire à la force de l’image corporelle.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: avec tes deux mains
  rationale: Formulation française naturelle qui conserve explicitement le contraste avec l’entrée dans la vie privé d’une main.
theological_decisions:
- issue: Traduction de γέεννα dans une parole de jugement
  choice: géhenne
  alternative: enfer
  rationale: Le maintien du terme propre préserve l’imagerie particulière du texte et évite de la fondre sans explication dans une catégorie théologique plus générale. L’équivalent traditionnel est signalé en note.
- issue: Portée de l’image de la main coupée
  choice: Conserver le langage corporel concret sans l’atténuer
  alternative: Le remplacer par une paraphrase générale sur l’abandon du péché
  rationale: La parole emploie volontairement une image radicale pour souligner la gravité de la chute et du jugement; la traduction ne doit pas en résoudre ou en adoucir la tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier du grec. La syntaxe demeure concise et frappante, tandis que les notes préservent les principales nuances lexicales et culturelles.
