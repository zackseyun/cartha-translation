source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: fr
  text: Et si ton œil te fait trébucher, jette-le. Mieux vaut pour toi entrer dans le royaume de Dieu avec un seul œil que d’avoir deux yeux et d’être jeté dans la géhenne[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enfer ». Le grec porte « géhenne », terme issu du nom de la vallée de Hinnom et employé pour évoquer le jugement à venir.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: te fait tomber dans le péché
  rationale: Le verbe conserve l’image de la chute tout en rendant explicite, dans ce contexte d’avertissement moral, la nature de cette chute. Cette formulation est naturelle en français et évite l’ambiguïté de « te fait trébucher », qui pourrait sembler seulement physique.
- source_word: ἔκβαλε
  choice: jette-le
  rationale: Le verbe ἐκβάλλω signifie ici « jeter dehors » ou « rejeter ». « Jette-le » garde la force de l’impératif sans ajouter l’idée plus précise d’arracher, absente du verbe grec.
- source_word: καλόν ... ἢ
  choice: Mieux vaut ... que
  rationale: Même si καλόν signifie littéralement « bon », la construction opposant deux possibilités appelle naturellement en français la tournure comparative « mieux vaut ... que ».
- source_word: μονόφθαλμον
  choice: avec un seul œil
  rationale: Cette expression rend exactement l’idée d’être borgne tout en étant plus transparente et naturelle pour un lectorat international.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française usuelle et transparente, qui préserve le poids théologique et la structure de l’expression grecque.
- source_word: βληθῆναι
  choice: d’être jeté
  rationale: Le passif de βάλλω est rendu directement et avec vigueur. La formulation maintient aussi l’écho verbal avec « jette-le ».
- source_word: γέενναν
  choice: la géhenne
  rationale: La translittération préserve le terme particulier employé par le grec, enraciné dans le nom de la vallée de Hinnom et associé au jugement eschatologique, plutôt que de le fondre dans le terme français plus général « enfer ».
theological_decisions:
- issue: Traduction de γέεννα dans un contexte de jugement
  choice: la géhenne
  alternative: l’enfer
  rationale: Le texte emploie γέεννα, et non un terme générique désignant le séjour des morts ou le châtiment. « Géhenne » conserve cette spécificité historique et théologique; l’équivalent traditionnel « enfer » est signalé en note.
- issue: Portée morale de σκανδαλίζω
  choice: te fait tomber dans le péché
  alternative: te fait trébucher
  rationale: Le contexte porte sur ce qui conduit une personne à sa perte devant Dieu. La traduction conserve la métaphore de la chute tout en indiquant son sens moral, sans réduire le verbe à une simple gêne ou offense.
translation_notes:
  register: Français moderne, international et digne. Tutoiement au singulier conforme au pronom grec σου et au discours direct. Syntaxe concise et frappante, adaptée à la forme sentencieuse de l’enseignement. La virgule finale reflète le fait que la phrase se poursuit au verset suivant.
