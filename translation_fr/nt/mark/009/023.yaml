  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « “Si tu peux” ? Tout est possible pour celui qui croit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui a la foi » ou « celui qui fait confiance ».
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: « Si tu peux » ?
  rationale: L’article neutre Τὸ substantivise la citation des paroles du père au verset précédent. La reprise sous forme de question exprime naturellement en français la réaction incisive de Jésus, sans effacer l’ambiguïté syntaxique du grec.
- source_word: δύνῃ
  choice: tu peux
  rationale: Le verbe δύναμαι signifie couramment « pouvoir, être capable ». « Tu peux » convient naturellement au discours direct et reprend les mots du père.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel πάντα a ici une portée générale. « Tout » est l’équivalent français idiomatique et conserve la force absolue de la formule.
- source_word: δυνατὰ
  choice: est possible
  rationale: Dans cette construction prédicative, δυνατά signifie « possible ». Avec le sujet collectif « tout », le français exige le singulier « est possible ».
- source_word: τῷ πιστεύοντι
  choice: pour celui qui croit
  rationale: Le participe présent substantivé désigne de façon générale la personne qui croit. « Pour celui qui croit » rend à la fois le datif et la valeur participiale sans en faire une étiquette figée.
- source_word: πιστεύοντι
  choice: croit
  rationale: πιστεύω signifie ici « croire », avec la nuance possible de faire confiance. Le verbe « croire » est direct et garde ouverte la nature précise de la foi dans ce contexte.
theological_decisions:
- issue: Portée de « tout est possible »
  choice: Conserver l’énoncé absolu sans lui ajouter de précision.
  alternative: « Avec Dieu, tout est possible pour celui qui croit » ou « Tout ce qui relève de la puissance de Dieu est possible pour celui qui croit »
  rationale: Le grec ne contient pas ici les mots « avec Dieu » et formule l’affirmation de manière concise. Ajouter une restriction résoudrait une tension que le texte laisse ouverte et atténuerait sa force rhétorique.
- issue: Sens de πιστεύοντι
  choice: « celui qui croit »
  alternative: « celui qui a la foi » ou « celui qui fait confiance »
  rationale: Le texte emploie un verbe au participe, non le nom « foi ». « Croit » préserve cette forme et n’impose pas une définition doctrinale plus précise de la croyance.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au dialogue singulier. Les guillemets imbriqués signalent que Jésus reprend les propres mots du père. La formulation concise conserve le caractère frappant et la tension théologique de l’original.
