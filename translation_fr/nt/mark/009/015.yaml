id: MRK.9.15
reference: Mark 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: fr
  text: Aussitôt, en le voyant, toute la foule fut saisie d’un grand étonnement[a] ; tous accoururent vers lui et le saluèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut frappée de stupeur » ou « fut saisie d’effroi ». Le verbe grec peut exprimer, selon le contexte, un étonnement intense, la stupeur ou l’effroi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Aussitôt
  rationale: Ce terme conserve l’immédiateté et le rythme narratif caractéristique de Marc, dans un français naturel.
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Cette formulation rend le collectif singulier et souligne que la réaction concerne l’ensemble de la foule.
- source_word: ἰδόντες αὐτόν
  choice: en le voyant
  rationale: Le participe aoriste exprime ici naturellement la circonstance temporelle qui déclenche la réaction.
- source_word: ἐξεθαμβήθησαν
  choice: fut saisie d’un profond étonnement
  rationale: Le verbe exprime une réaction intense pouvant aller de l’étonnement à la stupeur ou à l’effroi. Ce choix garde l’intensité sans en préciser abusivement la cause.
- source_word: προστρέχοντες
  choice: les gens accoururent vers lui
  rationale: « Accourir » restitue le mouvement rapide et empressé vers Jésus. La reprise par « les gens » évite une coordination maladroite avec le singulier collectif « foule ».
- source_word: ἠσπάζοντο αὐτόν
  choice: le saluèrent
  rationale: Dans ce contexte, ἀσπάζομαι désigne sobrement l’action de saluer ou d’accueillir quelqu’un.
theological_decisions:
- issue: Nature et cause de la réaction exprimée par ἐξεθαμβήθησαν
  choice: Un profond étonnement, sans explication de sa cause
  alternative: L’effroi, ou une stupeur provoquée par une apparence surnaturelle de Jésus
  rationale: Le verset décrit une réaction très vive à la vue de Jésus, puis la course de la foule pour le saluer, mais il n’en donne pas la cause. La traduction conserve donc l’intensité et l’ambiguïté du grec sans introduire l’idée non exprimée d’un rayonnement comparable à celui de Moïse.
translation_notes:
  register: Français international moderne, narratif et digne. « Aussitôt » maintient la vivacité marcienne ; « profond étonnement » reste accessible tout en portant l’intensité du verbe grec. Le point-virgule clarifie la succession des réactions sans alourdir la phrase.
