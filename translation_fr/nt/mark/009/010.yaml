id: MRK.9.10
reference: Mark 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: fr
  text: Et ils gardèrent cette parole pour eux[a], tout en discutant entre eux de ce que signifiait « ressusciter d’entre les morts »[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette déclaration » ou « ce propos ».'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « se relever d’entre les morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: cette parole
  rationale: Le singulier λόγον désigne ici la parole ou la déclaration que Jésus vient de prononcer. « Cette parole » reste proche du grec tout en renvoyant naturellement au propos précédent.
- source_word: ἐκράτησαν
  choice: gardèrent
  rationale: Dans cette construction avec πρὸς ἑαυτούς, le verbe indique qu’ils ont conservé la parole dans leur cercle et ne l’ont pas divulguée.
- source_word: πρὸς ἑαυτούς
  choice: pour eux
  rationale: Cette formulation française idiomatique exprime le fait qu’ils n’ont pas communiqué la parole à d’autres. La suite précise qu’ils en parlaient néanmoins entre eux.
- source_word: συζητοῦντες
  choice: tout en discutant entre eux
  rationale: Le participe décrit une délibération commune. « Discutant » conserve l’idée d’un échange soutenu sans suggérer nécessairement une dispute.
- source_word: τί ἐστιν
  choice: ce que signifiait
  rationale: Littéralement « ce que c’est », l’expression porte ici sur le sens de la formule de Jésus. La traduction choisie est naturelle en français et maintient l’incompréhension des disciples.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: « ressusciter d’entre les morts »
  rationale: Cette formulation rend l’infinitif substantivé et conserve la nuance de ἐκ νεκρῶν, « hors du milieu des morts », dans une expression française claire et consacrée par l’usage général.
theological_decisions:
- issue: Portée de la formule de résurrection dans la discussion des disciples
  choice: ressusciter d’entre les morts
  alternative: se relever d’entre les morts
  rationale: Le texte rapporte leur interrogation sans préciser s’ils comprennent une résurrection particulière ou la résurrection en général. La traduction conserve cette tension et n’ajoute aucune explication doctrinale ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. « Cette parole » garde la continuité avec la déclaration précédente; « tout en discutant entre eux » évite de transformer leur échange en querelle. Les guillemets isolent clairement la formule dont ils cherchaient le sens.
