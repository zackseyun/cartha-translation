id: MRK.9.12
reference: Mark 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: fr
  text: 'Il leur dit : « Élie vient d’abord et rétablit toutes choses. Et comment est-il écrit au sujet du Fils de l’homme qu’il doit beaucoup souffrir et être tenu pour rien[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être méprisé » ou « être considéré comme n’étant rien ». Le verbe grec désigne le fait d’être tenu pour sans valeur ou sans importance.
    reason: Alternative lexicale précisant la nuance de ἐξουδενηθῇ.
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Il leur dit
  rationale: Formulation narrative française naturelle qui conserve le verbe de parole et son complément.
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: Élie vient d’abord
  rationale: Cette formulation rend naturellement en français l’antériorité exprimée par le participe aoriste avec πρῶτον, sans donner à tort l’impression qu’Élie était déjà venu au moment de l’énoncé.
- source_word: ἀποκαθιστάνει πάντα
  choice: rétablit toutes choses
  rationale: Le présent est conservé comme énoncé général; « rétablit » exprime la remise en état, tandis que « toutes choses » maintient l’ampleur du pluriel neutre.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: comment est-il écrit au sujet du Fils de l’homme
  rationale: « Est-il écrit » conserve la formule scripturaire au parfait, et « au sujet de » rend ici la portée référentielle de ἐπί.
- source_word: ἵνα πολλὰ πάθῃ
  choice: qu’il doit beaucoup souffrir
  rationale: Dans cette proposition exprimant le contenu de ce qui est écrit, « doit » communique l’attente scripturaire; « beaucoup souffrir » est plus idiomatique en français que le calque « souffrir beaucoup de choses ».
- source_word: ἐξουδενηθῇ
  choice: être tenu pour rien
  rationale: 'Cette expression conserve la voix passive et la nuance forte du verbe: être considéré comme sans valeur ou sans importance.'
theological_decisions:
- issue: Rapport entre le rétablissement accompli par Élie et les souffrances du Fils de l’homme
  choice: Maintenir la juxtaposition sous la forme d’une véritable question rhétorique introduite par « Et comment ».
  alternative: Ajouter une opposition explicative comme « Pourtant, comment donc… » ou transformer la question en explication doctrinale.
  rationale: Le grec juxtapose les deux affirmations sans résoudre explicitement leur tension; la traduction ne doit ni harmoniser ni expliciter davantage le raisonnement.
- issue: Référence du titre υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain ou le Messie
  rationale: Le titre évangélique établi est conservé sans y incorporer une identification interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche du mouvement du grec tout en évitant les participes lourds et les calques peu naturels.
