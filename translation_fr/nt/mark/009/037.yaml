source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: fr
  text: « Si quelqu’un accueille en mon nom un enfant comme ceux-là[a], il m’accueille, moi ; et si quelqu’un m’accueille, ce n’est pas moi qu’il accueille, mais celui qui m’a envoyé.[b] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un des enfants de cette sorte ». Le grec souligne qu’il s’agit d’un enfant comme ceux-là, plutôt que de désigner simplement « ces enfants ».'
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire le verbe répété dans tout le verset par « reçoit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Si quelqu’un
  rationale: Le relatif accompagné de ἄν exprime une condition générale indéfinie. « Si quelqu’un » est naturel en français et conserve cette valeur.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: un enfant comme ceux-là
  rationale: Cette formulation rend le singulier ἓν, la construction partitive sous-jacente et surtout la valeur qualitative de τοιούτων (« de cette sorte »), sans transformer le terme en simple démonstratif.
- source_word: δέξηται / δέχεται / δέχηται
  choice: accueille
  rationale: δέχομαι peut signifier recevoir, accueillir ou accepter. Pour des personnes, « accueillir » est le choix français le plus naturel et permet de conserver la répétition du même verbe dans toutes les propositions.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: en mon nom
  rationale: L’expression indique que l’accueil se fait en considération du nom, de la personne ou de l’autorité de Jésus. « En mon nom » en conserve la concision et la portée théologique.
- source_word: ἐμὲ
  choice: moi / me
  rationale: Le pronom grec est emphatique. La dislocation « il m’accueille, moi » rend cette insistance dans la première occurrence, tandis que la construction clivée la porte naturellement dans la dernière.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: ce n’est pas moi qu’il accueille, mais
  rationale: La construction française conserve explicitement le contraste οὐκ… ἀλλά sans l’atténuer en « non seulement… mais aussi ».
- source_word: τὸν ἀποστείλαντά με
  choice: celui qui m’a envoyé
  rationale: Cette proposition relative substantive rend naturellement le participe aoriste substantivé et préserve le langage de l’envoi.
theological_decisions:
- issue: Portée du contraste final « non pas moi, mais celui qui m’a envoyé »
  choice: 'Conserver le contraste littéral : « ce n’est pas moi qu’il accueille, mais celui qui m’a envoyé »'
  alternative: 'Expliciter : « ce n’est pas seulement moi qu’il accueille, mais aussi celui qui m’a envoyé »'
  rationale: Le grec formule un contraste vigoureux sans les mots « seulement » ni « aussi ». La traduction maintient cette tension rhétorique et théologique au lieu de l’expliquer ou de la résoudre dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. « Accueille » convient mieux que « reçoit » lorsqu’il s’agit de personnes, tout en conservant la répétition structurante du grec. La formulation finale demeure volontairement abrupte afin de préserver le contraste du texte source.
