source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: fr
  text: 'Et il leur dit : « Cette sorte-là ne peut sortir par aucun moyen, sauf par la prière[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits plus tardifs portent : « par la prière et le jeûne ».'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Cette sorte-là
  rationale: γένος désigne ici une sorte ou une catégorie. Le contexte indique qu’il s’agit d’un esprit impur, mais le grec ne répète pas explicitement ce nom ; « cette sorte-là » conserve cette concision.
- source_word: ἐν οὐδενὶ
  choice: par aucun moyen
  rationale: Avec ἐν, οὐδενί exprime ici le moyen ou l’instrument. « Par aucun moyen » est naturel en français et prépare clairement l’exception qui suit.
- source_word: δύναται ἐξελθεῖν
  choice: ne peut sortir
  rationale: La construction exprime l’incapacité. « Sortir » convient au contexte de l’expulsion d’un esprit impur sans ajouter un complément absent du grec.
- source_word: εἰ μὴ
  choice: sauf
  rationale: εἰ μή introduit l’unique exception à l’énoncé négatif ; « sauf » rend cette relation avec concision.
- source_word: ἐν προσευχῇ
  choice: par la prière
  rationale: La préposition exprime le moyen. « Par la prière » restitue explicitement cette valeur instrumentale dans un français naturel.
theological_decisions:
- issue: Inclure ou non « et le jeûne »
  choice: La prière seule dans le texte principal
  alternative: « la prière et le jeûne »
  rationale: Le texte du SBLGNT porte seulement προσευχῇ (« prière »). La leçon plus longue est attestée dans des manuscrits ultérieurs ; elle est donc signalée en note plutôt qu’intégrée au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Cette sorte-là » garde le référent implicite du grec, tandis que « par aucun moyen, sauf par la prière » en préserve la structure et la valeur instrumentale.
