id: MRK.9.11
reference: Mark 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: fr
  text: 'Et ils lui demandaient : « Pourquoi[a] les scribes disent-ils qu’Élie doit venir d’abord ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comment se fait-il que les scribes disent qu’Élie doit venir d’abord ? »'
    reason: Alternative lexicale et syntaxique pour la valeur interrogative de ὅτι.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: ils lui demandaient
  rationale: L’imparfait grec présente la question comme une action en cours dans le récit; l’imparfait français en garde naturellement la valeur.
- source_word: λέγοντες
  choice: omis comme verbe distinct après les deux-points
  rationale: En français, le contenu de la parole est introduit naturellement par les deux-points; traduire aussi λέγοντες par « en disant » alourdirait inutilement la phrase.
- source_word: Ὅτι
  choice: Pourquoi
  rationale: Dans cette question, ὅτι introduit idiomatiquement une demande d’explication. « Pourquoi » en exprime clairement le sens, tandis qu’une autre nuance possible est signalée en note.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, le terme désigne des experts religieux chargés de l’étude et de l’interprétation des Écritures et de la Loi; cette formulation est plus immédiatement intelligible en français moderne que « scribes ».
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: δεῖ
  choice: doit
  rationale: Le verbe exprime une nécessité, possiblement liée à l’attente scripturaire, sans que la traduction ait à en préciser davantage la nature.
- source_word: ἐλθεῖν
  choice: venir
  rationale: Traduction directe et idiomatique de l’infinitif dans ce contexte prophétique.
- source_word: πρῶτον
  choice: d’abord
  rationale: Ce terme marque une priorité temporelle; « d’abord » est naturel en français et n’ajoute aucun événement de référence.
theological_decisions:
- issue: Valeur de Ὅτι dans la question des disciples
  choice: « Pourquoi les spécialistes de la Loi disent-ils… ? »
  alternative: « Comment se fait-il que les spécialistes de la Loi disent… ? »
  rationale: Le grec permet une question portant soit directement sur la raison de cet enseignement, soit plus largement sur la manière de comprendre le fait qu’il soit enseigné. Le texte principal privilégie la formulation française la plus simple, et la note conserve l’autre nuance.
- issue: Nature et ordre de la venue d’Élie
  choice: « Élie doit venir d’abord »
  alternative: « Élie doit revenir avant le Messie »
  rationale: Le texte grec ne dit explicitement ni « revenir » ni « avant le Messie ». Ne pas ajouter ces éléments préserve la formulation et la tension contextuelle du verset.
translation_notes:
  register: Français international moderne, clair et digne. La question directe évite le tour lourd « en lui disant ». « Spécialistes de la Loi » rend la fonction historique de γραμματεῖς de façon compréhensible sans développer leur rôle au-delà du contexte.
