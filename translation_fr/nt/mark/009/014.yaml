  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: fr
  text: Quand ils arrivèrent auprès des disciples, ils virent une grande foule autour d’eux et des scribes qui discutaient avec eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui se disputaient avec eux ». Le verbe grec peut désigner une discussion, un débat ou une dispute ; dans ce contexte, il suggère probablement une controverse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: quand ils arrivèrent auprès des disciples
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français. « Auprès des disciples » exprime le mouvement vers les personnes sans ajouter qu’il s’agissait des « autres » disciples.
- source_word: εἶδον
  choice: ils virent
  rationale: L’aoriste narratif de ὁράω désigne simplement le fait de voir.
- source_word: ὄχλον πολύν
  choice: une grande foule
  rationale: Cette expression rend directement l’idée d’une foule nombreuse dans un français courant.
- source_word: περὶ αὐτούς
  choice: autour d’eux
  rationale: περί avec l’accusatif a ici un sens spatial; le pronom renvoie naturellement aux disciples.
- source_word: γραμματεῖς
  choice: des spécialistes de la Loi
  rationale: Dans ce contexte évangélique, le terme désigne des experts juifs des Écritures et de la Loi. Cette formulation moderne communique leur fonction plus clairement que « scribes ».
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: qui discutaient vivement avec eux
  rationale: Le verbe peut désigner une discussion ou un débat. L’adverbe « vivement » fait entendre la tension probable du contexte sans transformer le verbe en une hostilité explicitement affirmée; « avec eux » conserve la relation exprimée par πρός.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit écrit. « Spécialistes de la Loi » privilégie l’intelligibilité immédiate tout en conservant la fonction historique du groupe; la note maintient l’ambiguïté de συζητέω.
