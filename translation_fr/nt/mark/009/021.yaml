  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: fr
  text: 'Il demanda au père de l’enfant : « Depuis combien de temps cela lui arrive-t-il ? » Celui-ci répondit : « Depuis l’enfance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: L’aoriste de ἐπερωτάω introduit ici une question directe ordinaire ; « demanda » est naturel et n’ajoute ni solennité ni insistance.
- source_word: τὸν πατέρα αὐτοῦ
  choice: à son père
  rationale: Dans le contexte, αὐτοῦ renvoie le plus naturellement au garçon atteint. Le français permet de conserver cette formulation concise sans explicitation supplémentaire.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Depuis combien de temps
  rationale: Cette tournure idiomatique interroge la durée écoulée depuis le début de la situation jusqu’au moment présent. La formulation française en rend clairement la valeur temporelle.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: cela lui arrive-t-il
  rationale: Le parfait γέγονεν présente une situation commencée auparavant et toujours pertinente. Dans ce contexte de manifestations répétées, « cela lui arrive » exprime naturellement cette continuité sans réduire le sens à un événement ponctuel.
- source_word: ὁ δὲ εἶπεν
  choice: Celui-ci répondit
  rationale: δέ assure ici la progression du dialogue. « Celui-ci répondit » identifie naturellement le père comme locuteur et convient mieux en français qu’une répétition de « il dit ».
- source_word: Ἐκ παιδιόθεν
  choice: Depuis son enfance
  rationale: ἐκ avec παιδιόθεν indique le point de départ dans l’enfance. « Depuis son enfance » répond directement à « Depuis combien de temps » et exprime la durée qui se prolonge jusqu’au présent.
