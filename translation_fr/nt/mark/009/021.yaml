  source_fidelity: Le sens temporel de Πόσος χρόνος ἐστὶν ὡς ... γέγονεν αὐτῷ est bien rendu par « Depuis combien de temps cela lui arrive-t-il ? », qui exprime une situation commencée dans le passé et toujours en cours. La réponse « Depuis l’enfance » rend fidèlement Ἐκ παιδιόθεν.
  naturalness: Le français est naturel et le registre convient. Toutefois, « Il demanda à son père » fait grammaticalement de « son père » le père du sujet « Il » (Jésus), alors que le grec désigne le père de l’enfant. Cette ambiguïté doit être levée.
  terminology: Aucun terme théologique spécialisé n’est en jeu. « Le père de l’enfant » est une clarification contextuelle nécessaire en français, non un ajout interprétatif. « Depuis l’enfance » évite en outre une possible hésitation référentielle de « son enfance ».
