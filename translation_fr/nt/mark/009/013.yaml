id: MRK.9.13
reference: Mark 9:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: fr
  text: 'Mais je vous le dis : Élie aussi est venu[a], et ils lui ont fait tout ce qu’ils voulaient, comme il est écrit à son sujet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire qu’Élie est déjà venu dans la personne et le ministère de Jean-Baptiste. Voir Marc 9.11-12 ; comparer Matthieu 11.14 ; 17.12-13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement le contraste avec l’attente des disciples au sujet d’Élie.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule française courante et directe qui conserve l’adresse personnelle; le pronom « le » anticipe naturellement la proposition qui suit.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: Élie aussi est venu
  rationale: « aussi » rend καί sans lui donner une valeur emphatique indue; le passé composé exprime en français l’arrivée accomplie dont les effets restent pertinents.
- source_word: ἐποίησαν αὐτῷ
  choice: ils lui ont fait
  rationale: Conserve la formulation ouverte et dure du grec avant que « tout ce qu’ils ont voulu » n’en précise l’étendue.
- source_word: ὅσα ἤθελον
  choice: tout ce qu’ils ont voulu
  rationale: Expression française naturelle qui rend l’étendue indéfinie de ὅσα et la volonté exprimée par ἤθελον.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Rend fidèlement la formule scripturaire habituelle sans ajouter une emphase absente du texte.
- source_word: ἐπ’ αὐτόν
  choice: à son sujet
  rationale: Dans cette construction avec γράφω, le sens « au sujet de » est le plus probable; la formulation reste naturelle et digne en français.
theological_decisions:
- issue: Identité d’Élie dans cette parole
  choice: Conserver « Élie » dans le texte principal sans expliciter son identité.
  alternative: Identifier directement Élie à Jean le Baptiseur dans le texte.
  rationale: Le grec nomme explicitement Élie. Le contexte conduit à comprendre une référence typologique à Jean le Baptiseur, mais cette identification interprétative doit rester en note afin de préserver la formulation et la tension du verset.
- issue: Sens de ἐπ’ αὐτόν
  choice: « à son sujet »
  alternative: « contre lui »
  rationale: Bien que ἐπί avec l’accusatif puisse parfois avoir une nuance hostile, avec la formule γέγραπται le sens référentiel « à son sujet » convient mieux et évite de trancher artificiellement en faveur d’une lecture moins probable.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure proche du grec tout en évitant une tournure artificielle. « Jean le Baptiseur » reflète plus directement le titre grec tout en restant compréhensible.
