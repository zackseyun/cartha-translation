  source_fidelity: Le texte rend correctement le contraste de ἀλλά, l’adresse personnelle, la venue accomplie d’Élie, l’action hostile non précisée (« ils lui ont fait »), l’étendue de ὅσα, et la référence scripturaire « à son sujet ». « Élie aussi » reflète sobrement καί sans développer l’identification à Jean dans le texte principal.
  naturalness: La phrase est globalement naturelle et de registre approprié. Toutefois, « tout ce qu’ils ont voulu » tend à présenter leur volonté comme ponctuelle et achevée. L’imparfait grec ἤθελον est mieux rendu ici par l’imparfait français « voulaient », qui est également plus idiomatique dans cette construction.
  terminology: « Élie » et « à son sujet » sont justes. Dans la note, « Jean-Baptiste » est la désignation française internationale usuelle et plus naturelle que « Jean le Baptiseur », tout en conservant le sens du titre grec.
