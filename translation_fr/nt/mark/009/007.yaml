id: MRK.9.7
reference: Mark 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: fr
  text: 'Alors une nuée survint et les couvrit de son ombre. Une voix sortit de la nuée : « Celui-ci est mon Fils bien-aimé ; écoutez-le.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prêtez-lui attention ». Le commandement désigne une écoute attentive, et non le simple fait d’entendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: une nuée survint
  rationale: Avec « nuée » pour sujet, ἐγένετο marque ici la survenue de celle-ci. « Survint » restitue naturellement en français le caractère événementiel et soudain de l’expression.
- source_word: νεφέλη
  choice: nuée
  rationale: « Nuée » est un équivalent français traditionnel mais encore intelligible de νεφέλη dans un récit de manifestation divine ; il conserve ces résonances sans les expliciter.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: les couvrit de son ombre
  rationale: Cette tournure naturelle conserve l’image de l’ombre portée exprimée par ἐπισκιάζω et rend clairement le datif αὐτοῖς.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: une voix sortit de la nuée
  rationale: « Une voix » désigne ici une parole articulée, et « sortit de » rend la valeur spatiale de ἐκ sans ajouter un verbe de parole absent du grec.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mon Fils bien-aimé
  rationale: Rendu direct et idiomatique qui maintient à la fois la relation filiale et la valeur affective de ἀγαπητός, sans développement doctrinal.
- source_word: ἀκούετε αὐτοῦ
  choice: écoutez-le
  rationale: L’impératif présent appelle à une écoute attentive et suivie. « Écoutez-le » conserve cette portée sans réduire le sens à l’audition ni l’expliciter uniquement comme obéissance.
theological_decisions:
- issue: Déclaration divine sur l’identité de Jésus
  choice: « Celui-ci est mon Fils bien-aimé »
  alternative: « Celui-ci est mon Fils, le Bien-Aimé »
  rationale: Le grec affirme directement que Jésus est le Fils de Dieu. La formulation retenue préserve la force christologique tout en restant naturelle en français et sans ajouter d’explication doctrinale.
- issue: Portée de ἀκούετε αὐτοῦ
  choice: « écoutez-le »
  alternative: « entendez-le » ou « obéissez-lui »
  rationale: Le commandement implique une écoute qui prête attention et donne suite, mais n’emploie pas explicitement un verbe signifiant « obéir ». « Écoutez-le » maintient cette amplitude.
translation_notes:
  register: Français moderne, digne et accessible. « Nuée » est retenu plutôt que « nuage » pour préserver les résonances bibliques de la scène sans paraphrase. La ponctuation sépare les deux événements tout en gardant leur enchaînement narratif.
