source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: fr
  text: Partout où il le saisit, il le jette à terre ; l’enfant écume, grince des dents et se raidit[a]. J’ai dit à tes disciples de le chasser, mais ils n’en ont pas été capables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dessèche » ou « dépérit ». Le verbe signifie littéralement « se dessécher » ou « se flétrir » ; ici, il peut décrire le raidissement du corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: Partout où
  rationale: Cette tournure exprime une circonstance indéfinie et répétée. « Partout où » en restitue naturellement la portée.
- source_word: καταλάβῃ
  choice: il le saisit
  rationale: Le verbe décrit ici la prise hostile de l’esprit sur l’enfant ; « saisir » conserve la force et la vivacité de l’image.
- source_word: ῥήσσει
  choice: il le jette à terre
  rationale: Dans ce contexte, le verbe évoque l’action violente par laquelle l’esprit précipite l’enfant au sol. Cette formulation évite de suggérer à tort qu’il lui déchire le corps.
- source_word: ἀφρίζει
  choice: l’enfant écume
  rationale: Le verbe signifie « écumer ». La reprise explicite de « l’enfant » rend la succession des sujets claire en français sans ajouter de détail médical absent du grec.
- source_word: τρίζει τοὺς ὀδόντας
  choice: grince des dents
  rationale: Expression française naturelle qui correspond directement au symptôme physique décrit.
- source_word: ξηραίνεται
  choice: se raidit
  rationale: Dans la série de manifestations corporelles, « se raidit » exprime une interprétation contextuelle probable. Le sens plus littéral « se dessèche » et l’autre possibilité « dépérit » sont signalés en note afin de préserver l’incertitude lexicale.
- source_word: εἶπα ... ἵνα
  choice: J’ai demandé ... de
  rationale: La construction rapporte une requête adressée aux disciples. « J’ai demandé à ... de » est idiomatique en français moderne et convient au contexte.
- source_word: ἐκβάλωσιν
  choice: le chasser
  rationale: Dans un récit d’exorcisme, le verbe signifie expulser ou chasser l’esprit. Le pronom masculin français s’accorde avec le référent implicite « esprit ».
- source_word: οὐκ ἴσχυσαν
  choice: ils n’en ont pas été capables
  rationale: Cette formulation conserve l’idée d’incapacité ou de manque de puissance sans préciser la cause de l’échec.
theological_decisions:
- issue: Référent de αὐτό dans la demande de l’expulser
  choice: Le pronom renvoie à l’esprit hostile qui tourmente l’enfant.
  alternative: Le pronom pourrait désigner plus généralement l’affliction.
  rationale: Le contexte narratif immédiat présente un esprit qui saisit l’enfant et que les disciples doivent expulser. « Le chasser » conserve ce référent sans développer davantage la nature de l’affliction.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde le caractère vif de l’énumération grecque tout en explicitant « l’enfant » pour éviter une ambiguïté de sujet en français.
