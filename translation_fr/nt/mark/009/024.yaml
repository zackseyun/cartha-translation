  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: fr
  text: 'Aussitôt, le père de l’enfant s’écria : « Je crois ! Viens au secours de mon incrédulité[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de mon manque de foi » : le grec peut désigner l’incrédulité ou une foi insuffisante.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Aussitôt
  rationale: Rend la promptitude de la réponse et l’urgence caractéristique du récit de Marc dans un français naturel.
- source_word: κράξας
  choice: s’écria
  rationale: Exprime une parole forte et chargée d’émotion sans préciser excessivement le volume.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: le père de l’enfant
  rationale: Rend directement le groupe génitif. « Enfant » conserve la portée de παιδίον sans la restreindre inutilement, même si le contexte indique qu’il s’agit d’un fils.
- source_word: ἔλεγεν
  choice: 's’écria :'
  rationale: En français idiomatique, le verbe introducteur est intégré à « s’écria »; traduire séparément par « et dit » alourdirait la phrase sans ajouter de nuance nécessaire.
- source_word: Πιστεύω
  choice: Je crois
  rationale: Rend directement le verbe et maintient son lien lexical et conceptuel avec ἀπιστία.
- source_word: βοήθει
  choice: Viens au secours de
  rationale: Cette tournure naturelle rend la demande pressante d’assistance et s’accorde idiomatiquement avec « incrédulité ».
- source_word: μου τῇ ἀπιστίᾳ
  choice: mon incrédulité
  rationale: Rend directement l’idée d’absence ou d’insuffisance de foi et préserve le paradoxe avec « Je crois ».
theological_decisions:
- issue: Tension entre Πιστεύω et ἀπιστίᾳ
  choice: « Je crois ! Viens au secours de mon incrédulité ! »
  alternative: « Je crois ! Viens au secours de mon manque de foi ! »
  rationale: Le texte juxtapose une foi réelle et une incrédulité encore présente. La traduction conserve cette tension sans la résoudre ni l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. « Aussitôt » garde l’urgence du récit; « s’écria » évite le lourd « cria et dit ». La ponctuation fait entendre l’intensité de la confession et de la supplication.
