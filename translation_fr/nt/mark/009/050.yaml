  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: fr
  text: Le sel est bon ; mais si le sel devient fade[a], avec quoi l’assaisonnerez-vous ? Ayez du sel en vous-mêmes[b] et soyez en paix les uns avec les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « perd sa saveur » ou « n’est plus salé ».
    reason: lexical_alternative
  - marker: b
    text: L’ordre « Ayez du sel en vous-mêmes » conserve la métaphore grecque. Elle peut notamment évoquer la pureté, la sagesse, la fidélité à l’alliance ou une influence qui préserve, mais le texte n’en précise pas explicitement le sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: une bonne chose
  rationale: Cette tournure rend l’évaluation positive générale de καλός dans un français naturel et conserve la portée proverbiale de l’énoncé.
- source_word: ἅλας / ἅλα
  choice: sel
  rationale: Le même nom est rendu de façon constante dans tout le verset. Dans l’impératif final, la métaphore est maintenue sans être réduite à une interprétation particulière.
- source_word: ἄναλον
  choice: fade
  rationale: Ἄναλος désigne ce qui est sans sel ou insipide. « Fade » est idiomatique en français et exprime la perte de la propriété gustative du sel, tout en laissant la note signaler une formulation plus littérale.
- source_word: γένηται
  choice: devient
  rationale: Le verbe marque ici un changement d’état ; « devient » le rend directement.
- source_word: ἐν τίνι
  choice: avec quoi
  rationale: La formule grecque interroge le moyen employé ; « avec quoi » est l’équivalent français idiomatique.
- source_word: ἀρτύσετε
  choice: l’assaisonnerez-vous
  rationale: Ἀρτύω signifie assaisonner. Ce choix conserve l’image culinaire et le pronom reprend explicitement « le sel ».
- source_word: ἔχετε
  choice: ayez
  rationale: L’impératif « ayez » est direct et conserve l’appel à posséder durablement ce « sel ».
- source_word: ἐν ἑαυτοῖς
  choice: en vous-mêmes
  rationale: Cette formulation reproduit la valeur réflexive et préserve l’idée d’une réalité présente chez les disciples, sans la remplacer par « parmi vous ».
- source_word: εἰρηνεύετε
  choice: soyez en paix
  rationale: Cette expression rend directement l’impératif du verbe « être en paix » dans un français actuel et digne.
- source_word: ἐν ἀλλήλοις
  choice: les uns avec les autres
  rationale: Cette formule française exprime clairement la réciprocité indiquée par ἀλλήλοις.
theological_decisions:
- issue: Sens métaphorique du « sel » dans l’impératif
  choice: 'Conserver littéralement : « Ayez du sel en vous-mêmes »'
  alternative: Expliciter dans le texte « ayez en vous la pureté », « la sagesse » ou « la fidélité à l’alliance »
  rationale: Le texte ne définit pas explicitement la métaphore. La conserver permet de maintenir son ambiguïté et ses liens possibles avec le contexte sans imposer une lecture doctrinale unique.
- issue: Portée de l’exhortation finale à la paix
  choice: « soyez en paix les uns avec les autres »
  alternative: « vivez en paix les uns avec les autres »
  rationale: Les deux formulations peuvent exprimer une conduite continue, mais « soyez en paix » correspond plus directement à εἰρηνεύετε tout en restant naturel en français.
translation_notes:
  register: Français international moderne, clair et digne. La structure proverbiale, l’image culinaire et l’ambiguïté de l’impératif métaphorique sont conservées. La ponctuation française emploie une espace avant le point-virgule et le point d’interrogation.
