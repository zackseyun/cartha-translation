review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : la descente, l''ordre de ne rien raconter, le contenu de la vision, le titre « le Fils de l’homme » et la résurrection « d’entre les morts ». Toutefois, « sauf lorsque ... serait ressuscité » emploie un conditionnel passé qui ne rend pas correctement l''événement futur envisagé par ὅταν avec l''aoriste subjonctif.'
  naturalness: Le français principal est globalement naturel, mais « sauf lorsque le Fils de l’homme serait ressuscité » est lourd et peu idiomatique. « Jusqu’à ce que ... soit ressuscité » exprime naturellement la restriction temporelle que la construction εἰ μὴ ὅταν a dans ce contexte.
  terminology: « Montagne », « ordonna », « raconter à personne », « le Fils de l’homme » et « d’entre les morts » conviennent au registre moderne et respectent les termes importants du grec. La note doit présenter la formulation plus proche de la forme grecque sans imposer le conditionnel passé français.
  issues:
  - severity: medium
    issue: Temps et tournure de « sauf lorsque ... serait ressuscité »
    rationale: Le grec ὅταν suivi de l'aoriste subjonctif désigne un fait futur; le conditionnel passé français suggère plutôt un fait hypothétique ou dépendant d'une condition. Dans cette instruction négative, « jusqu’à ce que ... soit ressuscité » est la formulation française usuelle et fidèle au sens. Une note peut conserver l'alternative plus littérale.
  revised_text: Comme ils descendaient de la montagne, il leur ordonna de ne raconter à personne ce qu’ils avaient vu, jusqu’à ce que le Fils de l’homme soit ressuscité d’entre les morts.[a]
