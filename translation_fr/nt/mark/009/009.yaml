source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: fr
  text: Comme ils descendaient de la montagne, il leur ordonna de ne raconter à personne ce qu’ils avaient vu, jusqu’à ce que le Fils de l’homme soit ressuscité d’entre les morts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus près de la forme grecque : « sauf lorsque le Fils de l’homme sera ressuscité d’entre les morts ».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταβαινόντων
  choice: Comme ils descendaient
  rationale: Le participe présent dans le génitif absolu exprime une action en cours et simultanée; cette tournure est naturelle en français moderne.
- source_word: ὄρους
  choice: montagne
  rationale: Ὄρος désigne normalement une montagne et correspond au cadre narratif de la transfiguration.
- source_word: διεστείλατο
  choice: il leur ordonna
  rationale: Le verbe exprime une directive ferme; « ordonna » en conserve la force sans archaïsme.
- source_word: ἵνα μηδενὶ … διηγήσωνται
  choice: de ne raconter à personne
  rationale: Cette formulation rend naturellement le contenu de l’ordre, tandis que « raconter » conserve la nuance de relater ce qui a été vu.
- source_word: ἃ εἶδον
  choice: ce qu’ils avaient vu
  rationale: Le relatif neutre pluriel se rend naturellement par « ce que »; le plus-que-parfait situe la vision avant l’ordre.
- source_word: εἰ μὴ ὅταν
  choice: sauf lorsque
  rationale: Cette traduction reste proche de la construction grecque, littéralement « sinon lorsque », sans la réduire silencieusement à « jusqu’à ce que ».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: La traduction traditionnelle préserve le titre et ses résonances scripturaires sans le paraphraser.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression indique précisément une résurrection hors du groupe des morts et demeure idiomatique en français.
- source_word: ἀναστῇ
  choice: serait ressuscité
  rationale: L’aoriste subjonctif après ὅταν vise un événement futur considéré comme accompli; le conditionnel passé exprime cette postériorité par rapport à l’ordre.
theological_decisions:
- issue: Rendu de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: Le titre consacré demeure compréhensible et conserve sa force titulaire ainsi que sa probable résonance daniélique.
- issue: Valeur temporelle de εἰ μὴ ὅταν
  choice: sauf lorsque le Fils de l’homme serait ressuscité d’entre les morts
  alternative: jusqu’à ce que le Fils de l’homme soit ressuscité d’entre les morts
  rationale: « Sauf lorsque » reproduit plus directement la forme grecque; « jusqu’à ce que » en exprime plus naturellement la portée pratique. La note conserve cette possibilité sans résoudre abusivement la tension.
translation_notes:
  register: Français international moderne, clair et digne. « Raconter » convient à διηγήσωνται et évite la faiblesse de « dire ». La formulation principale privilégie la structure grecque inhabituelle, tandis que la note donne son équivalent temporel idiomatique.
