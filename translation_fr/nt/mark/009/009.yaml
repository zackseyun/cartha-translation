- from: Comme ils descendaient de la montagne, il leur ordonna de ne raconter à personne ce qu’ils avaient vu, sauf lorsque le Fils de l’homme serait ressuscité d’entre les morts.[a]
  to: Comme ils descendaient de la montagne, il leur ordonna de ne raconter à personne ce qu’ils avaient vu, jusqu’à ce que le Fils de l’homme soit ressuscité d’entre les morts.[a]
  rationale: La révision remplace une tournure française temporalement inadéquate par « jusqu’à ce que ... soit ressuscité », qui rend clairement l'interdiction valable jusqu'à la résurrection. La note conserve la structure exceptionnelle « sauf lorsque » reflétant εἰ μὴ ὅταν, avec un futur antérieur français plutôt qu'un conditionnel passé.
