revisions:
- from: En effet, quiconque vous donnera à boire un verre d’eau en raison du nom que vous portez, parce que vous appartenez au Messie[a], amen, je vous le dis, il ne perdra certainement pas sa récompense.
  to: En effet, quiconque vous donnera à boire un verre d’eau au nom de votre appartenance au Messie[a], amen, je vous le dis, il ne perdra certainement pas sa récompense.
  rationale: La révision conserve l’ellipse et la relation exprimée par ἐν ὀνόματι sans ajouter l’idée précise que les disciples « portent » un nom. Elle maintient « le Messie » pour Χριστός et corrige la note afin qu’elle soit à la fois intelligible en français et honnête quant à l’ambiguïté syntaxique.
