    reason: La syntaxe de ἐν ὀνόματι ὅτι χριστοῦ ἐστε est condensée et son lien exact entre « nom » et l’appartenance au Messie demeure discuté.
  revision_rationale: La révision conserve l’ellipse et la relation exprimée par ἐν ὀνόματι sans ajouter l’idée précise que les disciples « portent » un nom. Elle maintient « le Messie » pour Χριστός et corrige la note afin qu’elle soit à la fois intelligible en français et honnête quant à l’ambiguïté syntaxique.
