id: MRK.9.41
reference: Mark 9:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: fr
  text: En effet, quiconque vous donnera à boire un verre d’eau au nom de votre appartenance au Messie[a], amen, je vous le dis, il ne perdra certainement pas sa récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, de façon elliptique : « en nom, parce que vous êtes du Messie ». La construction grecque est inhabituelle; elle peut aussi être comprise comme indiquant que l’on agit parce que vous êtes au Messie ou parce que vous portez son nom.'
    reason: La syntaxe de ἐν ὀνόματι ὅτι χριστοῦ ἐστε est condensée et son lien exact entre « nom » et l’appartenance au Messie demeure discuté.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: En effet, quiconque
  rationale: « Quiconque » rend naturellement la construction relative indéfinie, tandis que « en effet » conserve le lien explicatif marqué par γάρ.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: vous donnera à boire un verre d’eau
  rationale: Cette formulation française courante garde le sens concret de ποτίζω, « donner à boire », et de ποτήριον ὕδατος.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: en raison du nom que vous portez, parce que vous appartenez au Messie
  rationale: La syntaxe grecque est condensée et inhabituelle. Cette formulation comprend ἐν ὀνόματι comme une référence au nom ou au statut porté par les disciples, puis rend ὅτι selon sa valeur causale probable. Une note conserve la formulation plus littérale et son ambiguïté.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: amen, je vous le dis
  rationale: « Amen » conserve la formule solennelle propre à Jésus; le pronom « le » donne à la phrase une tournure française naturelle sans modifier le contenu.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: il ne perdra certainement pas
  rationale: « Certainement pas » exprime la négation grecque fortement emphatique οὐ μή avec le subjonctif aoriste.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: sa récompense
  rationale: Dans ce contexte moral et eschatologique, « récompense » est plus juste et plus naturel que le sens matériel « salaire ».
theological_decisions:
- issue: Valeur de Χριστός dans χριστοῦ ἐστε
  choice: vous appartenez au Messie
  alternative: vous êtes au Christ / vous appartenez au Christ
  rationale: Le génitif exprime l’appartenance et Χριστός fonctionne ici comme un titre. « Le Messie » en restitue le contenu messianique sans transformer le titre en simple nom propre.
- issue: Rapport entre ἐν ὀνόματι et ὅτι χριστοῦ ἐστε
  choice: le nom porté par les disciples est expliqué par leur appartenance au Messie
  alternative: en mon nom, parce que vous appartenez au Messie
  rationale: Le grec transmis ne contient aucun possessif équivalant à « mon ». La traduction évite donc de l’ajouter, tout en reconnaissant que la construction peut évoquer l’identification au Messie.
translation_notes:
  register: Français international moderne, digne et accessible. « Verre d’eau » est idiomatique en français pour ποτήριον ὕδατος. « Amen, je vous le dis » garde la solennité évangélique sans archaïsme. La phrase principale privilégie l’intelligibilité, tandis que la note signale honnêtement la syntaxe grecque difficile.
