  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ καὶ τὸ πῦρ οὐ σβέννυται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: fr
  text: où leur ver ne meurt pas[b][a] et où le feu ne s’éteint pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur asticot ne prend pas fin et le feu n’est pas éteint ».'
    reason: lexical_alternative
  - marker: b
    text: Cette phrase fait écho à Ésaïe 66.24.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: où
  rationale: L’adverbe relatif introduit le lieu décrit. « Où » est direct, naturel et fidèle.
- source_word: ὁ σκώληξ αὐτῶν
  choice: leur ver
  rationale: « Ver » conserve l’image large et traditionnelle ainsi que l’écho d’Ésaïe 66.24, sans préciser indûment « asticot ». Le possessif rend naturellement le génitif αὐτῶν.
- source_word: οὐ τελευτᾷ
  choice: ne meurt pas
  rationale: Avec le ver pour sujet, « ne meurt pas » est idiomatique et restitue la force concrète de l’image; « ne prend pas fin » reste une possibilité lexicale.
- source_word: τὸ πῦρ
  choice: le feu
  rationale: Équivalent direct et naturel du nom grec.
- source_word: οὐ σβέννυται
  choice: ne s’éteint pas
  rationale: Cette formulation française naturelle exprime l’état continu d’un feu qui n’est pas éteint, tout en préservant le présent passif grec par une tournure pronominale idiomatique.
theological_decisions:
- issue: Nature des images du jugement
  choice: Conserver les images concrètes du ver et du feu sans les interpréter davantage.
  alternative: Les expliciter comme désignant soit un tourment conscient continu, soit une destruction irréversible, soit uniquement la honte et la souillure métaphoriques.
  rationale: Le verset reprend les images d’Ésaïe 66.24, mais ne tranche pas à lui seul les débats doctrinaux plus larges. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Ne s’éteint pas » est plus courant que « n’est pas éteint » tout en conservant l’image et l’aspect continu. Les marqueurs suivent l’ordre fourni dans le texte anglais audité.
