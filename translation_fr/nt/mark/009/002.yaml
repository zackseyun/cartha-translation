  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: fr
  text: Six jours après[a], Jésus prend avec lui Pierre, Jacques et Jean et les emmène, eux seuls, à l’écart sur une haute montagne[b]. Il fut transfiguré devant eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après six jours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie deux expressions de séparation : « à l’écart » et « eux seuls » ; il souligne ainsi que Jésus n’emmena que ces trois disciples.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Il fut transformé devant eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Six jours après
  rationale: Rend naturellement la succession temporelle exprimée par μετά avec l’accusatif, tout en conservant la précision des six jours.
- source_word: παραλαμβάνει
  choice: prend avec lui
  rationale: Le présent de narration garde la vivacité caractéristique de Marc; «avec lui» explicite sans lourdeur l’idée d’emmener les trois disciples.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: les conduit ... sur une haute montagne
  rationale: «Conduit ... sur» exprime le déplacement et l’ascension vers la montagne sans préciser indûment le mode de déplacement.
- source_word: κατ’ ἰδίαν μόνους
  choice: seuls à l’écart
  rationale: 'Les deux éléments grecs sont conservés: μόνους par «seuls» et κατ’ ἰδίαν par «à l’écart», ce qui souligne que Jésus n’emmène que ces trois disciples.'
- source_word: μετεμορφώθη
  choice: fut transfiguré
  rationale: «Transfiguré» est le terme français établi pour cet événement et exprime une transformation visible sans en expliquer la nature au-delà du texte.
- source_word: ἔμπροσθεν αὐτῶν
  choice: devant eux
  rationale: Formulation française directe qui indique que le changement se produit sous leurs yeux.
theological_decisions:
- issue: Sens christologique de μετεμορφώθη
  choice: fut transfiguré
  alternative: fut transformé
  rationale: «Fut transfiguré» nomme avec précision la manifestation visible racontée ici, tandis que «fut transformé» demeure lexicalement possible mais moins spécifique. La formulation n’ajoute aucune explication sur le mécanisme ou la nature exacte du changement.
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique est conservé pour «prend» et «conduit»; le passé simple passif «fut transfiguré» marque naturellement l’événement soudain. «Là» clarifie la transition vers la scène au sommet sans ajouter de contenu théologique.
