  source_fidelity: 'Le sens est globalement fidèle : la chronologie, les trois disciples, l’ascension sur une haute montagne, la séparation d’avec les autres et la transfiguration devant eux sont tous rendus. Une légère reformulation améliore toutefois la clarté syntaxique de l’expression emphatique κατ’ ἰδίαν μόνους.'
