  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: fr
  text: Ses vêtements devinrent étincelants, très blancs, tels qu’aucun blanchisseur[a] sur terre ne peut les blanchir ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne celui qui nettoie et blanchit les étoffes; traditionnellement, un « foulon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: vêtements
  rationale: Terme français courant et général, naturel dans le récit, sans introduire l’idée plus précise de robes.
- source_word: ἐγένετο
  choice: devinrent
  rationale: Exprime clairement le changement d’état survenu pendant la transfiguration.
- source_word: στίλβοντα
  choice: étincelants
  rationale: Rend l’éclat vif et lumineux du participe sans ajouter d’explication théologique.
- source_word: λευκὰ λίαν
  choice: d’une blancheur telle
  rationale: Exprime la blancheur fortement intensifiée et prépare naturellement en français la comparaison qui suit.
- source_word: γναφεύς
  choice: artisan travaillant les étoffes
  rationale: Désigne fonctionnellement celui qui nettoie, traite et blanchit les étoffes, en évitant un terme technique aujourd’hui obscur.
- source_word: ἐπὶ τῆς γῆς
  choice: sur terre
  rationale: Conserve l’opposition implicite entre cette blancheur extraordinaire et les capacités humaines terrestres.
- source_word: οὐ δύναται ... οὕτως λευκᾶναι
  choice: ne pourrait les blanchir ainsi
  rationale: Formulation française idiomatique exprimant l’incapacité de produire une blancheur comparable; « les » reprend explicitement les vêtements.
theological_decisions:
- issue: Description de l’effet visible de la transfiguration
  choice: Décrire uniquement l’éclat et la blancheur extraordinaires des vêtements
  alternative: Ajouter une interprétation comme « rayonnants de gloire »
  rationale: Le verset décrit un phénomène visible sans en donner ici l’explication doctrinale; la traduction n’ajoute donc pas la notion explicite de gloire.
translation_notes:
  register: Français international moderne, narratif et digne. « Étincelants » maintient la vivacité de l’image; la périphrase pour γναφεύς privilégie la compréhension immédiate, tandis que la note conserve le terme traditionnel.
