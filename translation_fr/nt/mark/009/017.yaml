  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: fr
  text: 'Quelqu’un de la foule lui répondit : « Maître, je t’ai amené mon fils, qui a un esprit muet. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant qui conserve l’idée d’une réponse dans l’échange.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: un homme dans la foule
  rationale: Le masculin singulier substantivé désigne une personne de sexe masculin parmi la foule. Cette formulation est plus naturelle en français que « un de la foule ».
- source_word: Διδάσκαλε
  choice: Maître
  rationale: En adresse directe, « Maître » est le titre français traditionnel et naturel donné à un enseignant; le contexte conserve clairement la dimension d’enseignement.
- source_word: ἤνεγκα
  choice: je t’ai amené
  rationale: Le passé composé convient naturellement au français parlé pour une action passée dont le résultat est pertinent dans la situation présente. « Amener » s’emploie normalement pour une personne.
- source_word: υἱόν
  choice: mon fils
  rationale: Rend directement la relation familiale exprimée par υἱός sans remplacer celle-ci par une indication d’âge.
- source_word: πρὸς σέ
  choice: je t’ai amené
  rationale: Le complément « à toi » est naturellement intégré en français par le pronom « t’ » avec le verbe « amener ».
- source_word: ἔχοντα
  choice: qui a
  rationale: La proposition relative rattache clairement le participe à « mon fils » tout en restant naturelle et sans imposer une valeur causale plus forte que le grec.
- source_word: πνεῦμα ἄλαλον
  choice: un esprit muet
  rationale: Traduction directe qui conserve l’adjectif « muet » appliqué à l’esprit et n’ajoute pas explicitement « mauvais » ou « démoniaque ».
theological_decisions:
- issue: Sens de πνεῦμα dans le contexte d’exorcisme
  choice: esprit
  alternative: esprit mauvais ou démon
  rationale: Le contexte indique un esprit hostile qui afflige le fils, mais le verset dit seulement « esprit ». La traduction n’ajoute donc pas une qualification absente du texte grec.
- issue: Rapport entre l’esprit et l’incapacité à parler
  choice: un esprit muet
  alternative: un esprit qui l’empêche de parler
  rationale: Le grec qualifie directement l’esprit de « muet ». La formulation alternative expliciterait l’effet sur le garçon, vraisemblable dans le contexte, mais moins directement exprimé ici.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’adresse singulière du grec. La syntaxe reste simple et orale, adaptée aux paroles du père.
