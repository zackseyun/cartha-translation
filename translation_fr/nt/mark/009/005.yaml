id: MRK.9.5
reference: Mark 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: fr
  text: 'Pierre prit la parole et dit à Jésus : « Rabbi, il est bon que nous soyons ici. Faisons trois abris[a] : un pour toi, un pour Moïse et un pour Élie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tentes », « huttes » ou « tabernacles ». Le mot grec désigne des abris temporaires et peut évoquer des tentes ou des cabanes, mais le verset ne rend pas explicites d’éventuelles associations avec la fête des Tentes ou avec le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: prit la parole
  rationale: Dans ce récit, aucun propos antérieur n’appelle une réponse directe. « Prendre la parole » rend naturellement l’idiome narratif grec sans supposer une question explicite.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec devient un passé simple, temps naturel d’un récit français soutenu, sans changement de sens.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: La translittération conserve le titre d’adresse respectueux et la couleur sémitique du passage; « Maître » serait une traduction possible, mais moins transparente lexicalement.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: il est bon que nous soyons ici
  rationale: Cette formulation garde l’évaluation positive de Pierre et la référence explicite au groupe, sans amplifier καλόν par « merveilleux » ou « formidable ».
- source_word: ποιήσωμεν
  choice: Faisons
  rationale: Le subjonctif exhortatif à la première personne du pluriel est rendu directement par l’impératif français. « Construisons » préciserait davantage le mode de réalisation que ne le fait ποιέω.
- source_word: σκηνάς
  choice: abris
  rationale: Le terme grec peut désigner des tentes, huttes ou abris temporaires. « Abris » exprime le sens général dans un français moderne sans imposer une association cultuelle ou festive.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: un pour toi, un pour Moïse et un pour Élie
  rationale: La traduction conserve la répétition distributive et le parallélisme du grec.
theological_decisions:
- issue: Connotations cultuelles ou festives possibles de σκηνάς
  choice: Employer le terme neutre « abris » dans le texte principal
  alternative: « tentes », « huttes » ou « tabernacles »
  rationale: Le verset ne rattache pas explicitement ces structures à la fête des Tentes ni au tabernacle-sanctuaire. Le texte principal reste donc neutre, tandis que la note préserve les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La structure directe du discours et la triple répartition sont conservées.
