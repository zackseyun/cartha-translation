review_pass:
  verdict: revise
  source_fidelity: 'Le sens de Πᾶς γὰρ πυρὶ ἁλισθήσεται est bien rendu dans son ensemble : « chacun », « car » et le futur passif « sera salé » correspondent au grec et conservent l’image énigmatique sans l’interpréter. Toutefois, « par le feu » tend en français à présenter le feu comme l’agent ou le procédé, alors que le datif πυρί laisse plus largement ouverte l’association instrumentale ou qualitative. « De feu » reproduit mieux, en français biblique moderne et intelligible, la juxtaposition métaphorique et son ambiguïté.'
  naturalness: « Car chacun sera salé de feu » est une formulation sobre, naturelle dans un registre scripturaire contemporain, tout en assumant l’étrangeté voulue de l’image. Elle évite la nuance causative un peu plus marquée de « salé par le feu ».
  terminology: « Salé » maintient le lien lexical avec ἁλίζω et avec la variante textuelle sur le sacrifice et le sel. La note peut employer « assaisonné » comme alternative explicative sans remplacer le terme principal. « De sel » dans la variante reflète plus directement ἁλί que « avec du sel ».
