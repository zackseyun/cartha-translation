  text: Πᾶς γὰρ πυρὶ ⸀ἁλισθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: fr
  text: Car chacun sera salé de feu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assaisonné de feu ». L’image peut évoquer le jugement, la purification ou le langage des sacrifices ; voir Lévitique 2.13.
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits ajoutent : « et tout sacrifice sera salé de sel ».'
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: chacun
  rationale: L’adjectif masculin singulier employé comme substantif désigne ici naturellement chaque personne. « Chacun » convient mieux que « tout » et conserve la portée distributive du singulier.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’avertissement précédent. « Car » en maintient clairement le lien logique dans un registre digne et courant.
- source_word: πυρὶ
  choice: par le feu
  rationale: Le datif peut exprimer le moyen ou l’élément associé. « Par le feu » est naturel en français tout en laissant ouverte la portée exacte du feu dans la métaphore.
- source_word: ἁλισθήσεται
  choice: sera salé
  rationale: Le futur passif de ἁλίζω signifie littéralement « saler ». Malgré son caractère insolite, « sera salé » préserve l’image frappante et auditable du grec au lieu de l’expliquer dans le texte.
theological_decisions:
- issue: Interprétation de la métaphore « salé par le feu »
  choice: Conserver la formulation métaphorique sans décider si elle évoque principalement le jugement, la purification, le sacrifice ou l’épreuve liée à la condition de disciple.
  alternative: Expliciter dans le texte que chacun sera jugé, purifié ou consacré par le feu.
  rationale: Le grec est bref et allusif, et le contexte permet plusieurs lectures potentiellement liées. La traduction maintient donc cette tension théologique plutôt que d’imposer une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. « Car » conserve l’articulation argumentative ; l’expression volontairement paradoxale « salé par le feu » reproduit la force de l’original.
