source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: fr
  text: 'Jean lui dit : « Maître, nous avons vu quelqu’un chasser des démons en ton nom, et nous avons essayé de l’en empêcher[a], parce qu’il ne nous suivait pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et nous cherchions à l’en empêcher ». L’imparfait grec peut décrire une action en cours, répétée ou tentée.'
    reason: Nuance aspectuelle de l’imparfait ἐκωλύομεν.
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Jean lui dit
  rationale: Le verbe narratif ἔφη se rend naturellement au passé simple en français. Le sujet explicite Jean et le complément « lui » sont conservés.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans une adresse directe à Jésus, « Maître » est la traduction française courante et digne de διδάσκαλε au sens d’enseignant, sans introduire le titre plus spécifique « Rabbi ».
- source_word: εἴδομέν τινα
  choice: nous avons vu quelqu’un
  rationale: Le pronom indéfini τινα ne précise pas l’identité de la personne; « quelqu’un » le restitue sans ajout.
- source_word: ἐν τῷ ὀνόματί σου
  choice: en ton nom
  rationale: Cette tournure conserve l’expression biblique et indique une action accomplie en se réclamant du nom et de l’autorité de Jésus.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: chasser des démons
  rationale: « Chasser des démons » est une formulation française naturelle et précise pour l’activité exprimée par ἐκβάλλω.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: et nous avons essayé de l’en empêcher
  rationale: L’imparfait grec peut présenter une action en cours, répétée ou tentée. Dans ce contexte, cette formulation française exprime naturellement la tentative sans affirmer qu’elle a pleinement réussi.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: parce qu’il ne nous suivait pas
  rationale: Le datif ἡμῖν signifie explicitement « nous ». La traduction conserve la focalisation de Jean sur le groupe des disciples au lieu de la remplacer par une référence à Jésus.
theological_decisions:
- issue: Référent de l’allégeance dans la dernière proposition
  choice: « il ne nous suivait pas »
  alternative: « il ne te suivait pas » ou « il ne faisait pas partie de notre groupe »
  rationale: Le grec porte explicitement ἡμῖν, « nous ». Garder ce pronom préserve la tension narrative que la réponse de Jésus abordera, sans corriger ni expliquer à la place du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement est employé dans l’adresse à Jésus, conformément à l’usage biblique français courant. La phrase conserve l’ambiguïté aspectuelle de l’imparfait au moyen d’une note.
