id: MRK.9.20
reference: Mark 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: fr
  text: Ils le lui amenèrent. Dès que l’esprit vit Jésus, il jeta aussitôt le garçon dans de violentes convulsions. Celui-ci tomba par terre et se roulait en écumant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: Ils le lui amenèrent
  rationale: Cette formulation française rend naturellement le mouvement du garçon vers Jésus tout en conservant les deux référents pronominaux du grec.
- source_word: ἰδὼν αὐτόν
  choice: Dès que l’esprit vit Jésus
  rationale: La proposition temporelle restitue le participe aoriste; le nom « Jésus » explicite sans ambiguïté le référent du pronom grec dans un passage chargé en pronoms.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: Le verset dit simplement « l’esprit »; il ne convient pas d’ajouter ici « impur » ou de remplacer le terme par « démon ».
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » conserve la soudaineté caractéristique de l’adverbe chez Marc et convient au récit français actuel.
- source_word: συνεσπάραξεν αὐτόν
  choice: il secoua violemment le garçon de convulsions
  rationale: Le verbe décrit des spasmes violents provoqués par l’esprit. La tournure explicite aussi que le pronom objet désigne le garçon.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: Celui-ci tomba par terre
  rationale: Une proposition française distincte rend clairement la séquence participiale et évite de faire de l’esprit le sujet de la chute.
- source_word: ἐκυλίετο
  choice: se roulait
  rationale: L’imparfait restitue l’aspect continu de l’imparfait grec.
- source_word: ἀφρίζων
  choice: en écumant
  rationale: Cette expression rend le participe sans ajouter « de la bouche », détail implicite mais non formulé dans le grec.
theological_decisions:
- issue: Identification de πνεῦμα
  choice: l’esprit
  alternative: l’esprit impur / le démon
  rationale: Le contexte identifie l’entité comme un esprit impur, mais ce verset emploie seulement τὸ πνεῦμα. Le texte principal préserve cette formulation sans expansion interprétative.
translation_notes:
  register: Français international moderne, narratif et digne. Les référents « Jésus » et « le garçon » sont explicités pour lever une ambiguïté pronominale qui serait artificielle en français, sans ajouter d’information étrangère au contexte immédiat.
