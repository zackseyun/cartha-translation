id: MRK.9.28
reference: Mark 9:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: fr
  text: 'Quand il fut entré dans la maison, ses disciples lui demandaient en privé : « Pourquoi n’avons-nous pas pu l’expulser[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom grec est neutre et renvoie plus naturellement à l’esprit impur ; il peut aussi être compris comme désignant le garçon.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: quand il fut entré
  rationale: Le participe aoriste dans une construction au génitif absolu fournit l’arrière-plan temporel et présente l’entrée comme antérieure à la demande des disciples.
- source_word: εἰς οἶκον
  choice: dans la maison
  rationale: Même sans article en grec, le contexte narratif désigne naturellement un lieu déterminé ; « dans la maison » est idiomatique en français.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: « Disciples » est le terme courant et précis dans le contexte des Évangiles, et le possessif rend αὐτοῦ naturellement.
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: L’expression indique que la conversation a lieu à l’écart des autres ; « en privé » est clair et naturel.
- source_word: ἐπηρώτων
  choice: demandaient
  rationale: L’imparfait grec présente l’action en cours ou répétée ; l’imparfait français en conserve ici l’aspect sans le surcharger.
- source_word: Ὅτι
  choice: Pourquoi
  rationale: Dans cette question, ὅτι a la valeur idiomatique de « pourquoi ».
- source_word: οὐκ ἠδυνήθημεν
  choice: n’avons-nous pas pu
  rationale: Le verbe exprime la capacité. Le passé composé convient au français actuel pour l’échec ponctuel auquel les disciples font référence.
- source_word: ἐκβαλεῖν
  choice: expulser
  rationale: Dans un contexte d’exorcisme, « expulser » exprime avec précision l’idée de faire sortir de force, dans un registre digne et courant.
- source_word: αὐτό
  choice: l’
  rationale: Le pronom objet français maintient la concision du grec et, contrairement à une explicitation comme « cet esprit », ne supprime pas entièrement l’ambiguïté du référent.
theological_decisions:
- issue: Référent du pronom final αὐτό
  choice: Le référent le plus naturel est l’esprit impur, sans l’expliciter dans le corps du texte.
  alternative: Le pronom peut être compris comme renvoyant au garçon affligé.
  rationale: Le pronom grec est neutre, ce qui favorise un référent neutre tel que πνεῦμα, « esprit », plutôt que le garçon de sexe masculin. Toutefois, le français élidé « l’ » permet de ne pas trancher silencieusement une ambiguïté possible ; la note expose les deux lectures.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement narratif grec, tandis que « n’avons-nous pas pu » et « en privé » assurent une formulation courante. Le marqueur de note est placé après le pronom verbal concerné, et non après « maison ».
