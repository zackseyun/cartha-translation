- from: Et si quelqu’un fait trébucher un seul de ces petits qui croient en moi, mieux vaudrait pour lui qu’on lui mette autour du cou une meule actionnée par un âne[a] et qu’on le jette dans la mer.
  to: Et quiconque fait trébucher l’un de ces petits qui croient en moi, il vaudrait mieux pour lui qu’on lui mette autour du cou une meule actionnée par un âne[a] et qu’on le jette dans la mer.
  rationale: La révision supprime l’emphase non requise de « un seul » et emploie une tournure française plus fluide pour la comparaison sévère, sans modifier le sens ni résoudre l’ambiguïté concernant « ces petits ».
