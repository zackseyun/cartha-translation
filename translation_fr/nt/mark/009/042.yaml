review_pass:
  verdict: revise
  source_fidelity: La formulation « un seul de ces petits » donne à ἕνα une nuance restrictive ou emphatique (« un seul ») qui n’est pas explicitement portée par le grec. « L’un de ces petits » rend simplement le singulier distributif. Le reste reproduit fidèlement la métaphore de σκανδαλίζω, l’identification des petits comme croyants en Jésus, et l’image de la grande meule mue par un âne.
  naturalness: Le français est globalement naturel et de registre digne. « Il vaudrait mieux pour lui » est légèrement plus complet et fluide que l’inversion elliptique « mieux vaudrait pour lui », tout en gardant la force de l’avertissement.
  terminology: « Ces petits », « qui croient en moi », « fait trébucher » et « meule actionnée par un âne » sont des choix justes. La note explicite utilement la valeur historique et lexicale de μύλος ὀνικός sans imposer une interprétation du référent de « petits ».
  issues:
  - severity: low
    issue: « un seul de ces petits »
    rationale: « Un seul » peut suggérer « seulement un » ou mettre l’accent sur l’unicité. Le grec ἕνα signifie ici « l’un de »; cette formulation française est plus exacte et n’ajoute pas de nuance.
