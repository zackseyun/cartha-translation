id: MRK.9.42
reference: Mark 9:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: fr
  text: Et quiconque fait trébucher l’un de ces petits qui croient en moi, il vaudrait mieux pour lui qu’on lui mette autour du cou une meule actionnée par un âne[a] et qu’on le jette dans la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire une grande meule de moulin, mise en mouvement par un âne.
    reason: Précision historique et lexicale sur μύλος ὀνικός.
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: fait trébucher
  rationale: Cette expression conserve la métaphore grecque et peut évoquer le fait d’entraîner quelqu’un dans le péché ou de provoquer sa chute spirituelle, sans réduire d’emblée le sens à une seule de ces possibilités.
- source_word: μικρῶν τούτων
  choice: ces petits
  rationale: « Ces petits » préserve la portée de l’expression, qui peut désigner des personnes vulnérables ou considérées comme insignifiantes, sans la limiter aux enfants.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: qui croient en moi
  rationale: Traduction directe et idiomatique de la construction πιστεύω εἰς avec une personne comme objet.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: mieux vaudrait pour lui
  rationale: Cette formulation française naturelle exprime clairement l’avantage comparatif dans le cadre de cet avertissement sévère.
- source_word: μύλος ὀνικός
  choice: une meule actionnée par un âne
  rationale: La formule désigne une grande meule de moulin mise en mouvement par un âne, par opposition à une petite meule manuelle.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: qu’on lui mette autour du cou
  rationale: Cette tournure rend naturellement l’idée d’un objet placé autour du cou.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: qu’on le jette dans la mer
  rationale: Le subjonctif coordonné à la construction comparative donne en français une expression vive et naturelle du résultat envisagé.
theological_decisions:
- issue: Référent de « ces petits »
  choice: Formulation assez large pour inclure les croyants vulnérables ou tenus pour insignifiants
  alternative: Les enfants au sens strict, ou plus généralement les disciples humbles
  rationale: La précision « qui croient en moi » invite à ne pas restreindre l’expression à l’âge physique. La traduction conserve toutefois l’image et laisse ouverte la possibilité que des enfants soient inclus.
translation_notes:
  register: Français international moderne, naturel et digne. « Fait trébucher » conserve la métaphore et l’ambiguïté théologique du grec; « meule actionnée par un âne » reste compréhensible tout en reflétant précisément la réalité ancienne.
