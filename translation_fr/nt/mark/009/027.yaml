  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: fr
  text: Mais Jésus lui saisit la main, le releva[a], et il se leva[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fit se lever »; le verbe grec peut aussi désigner le fait de réveiller quelqu’un ou de le relever d’entre les morts.
    reason: lexical_alternative
  - marker: b
    text: Ou « il se mit debout ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste entre l’impression de la foule, qui croit le garçon mort, et l’intervention de Jésus.
- source_word: κρατήσας
  choice: lui saisit
  rationale: Exprime le geste concret de saisir fermement, dans une tournure française naturelle avec « la main ».
- source_word: τῆς χειρὸς αὐτοῦ
  choice: la main
  rationale: Conserve précisément χείρ, « main », sans l’élargir à « bras »; le pronom indirect « lui » rend naturellement le possessif en français.
- source_word: ἤγειρεν αὐτόν
  choice: le releva
  rationale: Rend l’action causative de Jésus et convient au garçon étendu à terre, tout en maintenant un écho possible au vocabulaire du relèvement et de la résurrection.
- source_word: ἀνέστη
  choice: il se leva
  rationale: Décrit naturellement en français le mouvement qui en résulte et préserve la proximité verbale avec « le releva ».
theological_decisions:
- issue: Résonance possible du vocabulaire de la résurrection dans ἤγειρεν et ἀνέστη
  choice: « le releva, et il se leva »
  alternative: « l’aida à se mettre debout, et il se tint debout »
  rationale: Le contexte décrit d’abord le relèvement physique du garçon après l’expulsion de l’esprit, non une résurrection explicitement affirmée. La formulation retenue reste naturelle tout en laissant perceptible, sans l’imposer, l’écho possible au vocabulaire de la résurrection.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination conserve le rythme narratif bref du grec; « lui saisit la main » reste idiomatique tout en gardant la force concrète de κρατέω.
