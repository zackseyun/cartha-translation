id: MRK.9.45
reference: Mark 9:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: fr
  text: Et si ton pied te fait trébucher[a], coupe-le. Mieux vaut pour toi entrer dans la vie boiteux que d’avoir les deux pieds et d’être jeté dans la géhenne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te pousse à pécher » ; le verbe grec évoque le fait de faire trébucher, notamment au sens moral ou spirituel.'
    reason: ambiguïté lexicale
  - marker: b
    text: 'Ou : « l’enfer ». Le terme grec est « géhenne » ; il évoque la vallée de Hinnom et ses associations avec le jugement divin.'
    reason: équivalent traditionnel et arrière-plan historique
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: te fait tomber
  rationale: Conserve l’image concrète de la chute tout en laissant entendre, dans le contexte, l’entraînement au péché; « te fait pécher » expliciterait et réduirait la métaphore.
- source_word: ἀπόκοψον
  choice: coupe-le
  rationale: Rend directement l’impératif aoriste, vif et concret, sans atténuer l’hyperbole.
- source_word: καλόν ἐστίν ... ἢ
  choice: Mieux vaut pour toi
  rationale: Dans cette construction comparative, cette tournure exprime naturellement en français la préférence indiquée par καλόν et ἢ.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: entrer dans la vie
  rationale: Préserve l’expression eschatologique sans ajouter « éternelle », absent du texte grec.
- source_word: χωλὸν
  choice: boiteux
  rationale: Désigne précisément une personne dont la marche est affectée et convient au contraste portant sur le pied.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: avoir les deux pieds
  rationale: Formulation française naturelle qui maintient le contraste avec l’entrée dans la vie en étant boiteux.
- source_word: βληθῆναι
  choice: être jeté
  rationale: Rend simplement et vigoureusement l’infinitif passif de βάλλω.
- source_word: γέενναν
  choice: géhenne
  rationale: Conserve la spécificité du terme grec et ses associations historiques et eschatologiques, plutôt que de le remplacer dans le texte par l’équivalent interprétatif traditionnel « enfer ».
theological_decisions:
- issue: Traduction de γέεννα dans un contexte de jugement
  choice: géhenne
  alternative: enfer
  rationale: Le grec emploie le terme précis γέεννα. « Géhenne » en conserve l’ancrage dans la vallée de Hinnom et les associations de jugement divin, tandis que « enfer » est signalé en note comme équivalent traditionnel.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement suit l’adresse individuelle au singulier. La syntaxe reste fluide tout en conservant la vigueur et l’image corporelle du grec.
