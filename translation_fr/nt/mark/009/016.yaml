  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: fr
  text: 'Et il leur demanda : « De quoi discutez-vous entre vous[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De quoi débattez-vous entre vous ? » Le verbe peut désigner une discussion, un débat ou une dispute, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Le connecteur relie simplement cette action au récit précédent, sans ajouter une nuance temporelle absente du grec.
- source_word: ἐπηρώτησεν
  choice: il leur demanda
  rationale: Dans ce cadre narratif, le verbe introduit naturellement une question directe; « demanda » est courant, précis et sans emphase excessive.
- source_word: αὐτούς
  choice: leur
  rationale: Le pronom grec est pluriel et son référent n’est pas précisé dans le verset; le pronom français conserve cette indétermination.
- source_word: Τί
  choice: De quoi
  rationale: Dans cette construction, τί porte sur le sujet de l’échange. « De quoi » est la formulation française naturelle avec « discuter ».
- source_word: συζητεῖτε
  choice: discutez-vous
  rationale: συζητέω peut désigner une discussion, un débat ou une contestation. « Discutez-vous » garde le sens large sans imposer ici un ton ouvertement conflictuel.
- source_word: πρὸς αὑτούς
  choice: entre vous
  rationale: L’expression a un sens réciproque. « Entre vous » est idiomatique et rend clairement l’interaction au sein du groupe.
theological_decisions: []
