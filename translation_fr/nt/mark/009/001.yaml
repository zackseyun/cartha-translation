id: MRK.9.1
reference: Mark 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: fr
  text: 'Et il leur disait : « En vérité, je vous le dis, quelques-uns de ceux qui sont ici ne goûteront certainement pas la mort[a] avant d’avoir vu le royaume de Dieu venu avec puissance[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « goûter la mort » signifie « faire l’expérience de la mort », c’est-à-dire mourir.
    reason: lexical_alternative
  - marker: b
    text: Le texte ne précise pas à quel événement correspond la venue en puissance du royaume de Dieu. Elle a notamment été mise en rapport avec la transfiguration, la résurrection et l’exaltation de Jésus, la Pentecôte, le jugement de Jérusalem ou l’accomplissement final du royaume.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: il leur disait
  rationale: L’imparfait grec exprime ici une parole en cours dans le récit; l’imparfait français en conserve naturellement l’aspect.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: En vérité, je vous le dis
  rationale: Cette formule solennelle est idiomatique, digne et courante en français biblique moderne sans réduire Ἀμὴν à une simple affirmation.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: quelques-uns de ceux qui sont ici
  rationale: La formulation conserve clairement le sens partitif et rend naturellement l’état exprimé par le participe parfait « se tenir ici ».
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: ne goûteront certainement pas la mort
  rationale: « Certainement pas » rend la forte négation οὐ μή, tandis que « goûter la mort » préserve la métaphore grecque, intelligible en français.
- source_word: ἕως ἂν ἴδωσιν
  choice: avant d’avoir vu
  rationale: Dans une phrase principale négative, « avant d’avoir vu » exprime naturellement la limite temporelle future de ἕως ἄν tout en reliant la vision à l’accomplissement préalable annoncé.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression française consacrée qui conserve les dimensions de règne, de domaine et d’accomplissement eschatologique de βασιλεία.
- source_word: ἐληλυθυῖαν
  choice: venu
  rationale: Le participe passé associé à « avoir vu » rend le royaume comme déjà advenu au moment où il est vu, conservant ainsi la valeur résultative du parfait grec sans lourdeur excessive.
- source_word: ἐν δυνάμει
  choice: avec puissance
  rationale: « Avec puissance » est naturel en français et exprime la manifestation puissante du royaume sans préciser indûment sa modalité.
theological_decisions:
- issue: Référent et moment de la venue en puissance du royaume de Dieu
  choice: Conserver la formulation ouverte « le royaume de Dieu venu avec puissance » sans identifier l’événement.
  alternative: Préciser la transfiguration, la résurrection et l’exaltation, la Pentecôte, le jugement de Jérusalem ou l’accomplissement final du royaume.
  rationale: Le grec ne désigne explicitement aucun de ces événements. La traduction préserve donc l’ambiguïté et la tension eschatologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant un calque pesant. La métaphore « goûter la mort » est maintenue et expliquée en note; aucune interprétation particulière de la venue du royaume n’est imposée.
