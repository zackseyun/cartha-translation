source:
  edition: SBLGNT
  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: fr
  text: sans dominer ceux qui vous sont confiés[a], mais en devenant des exemples pour le troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans agir en maîtres sur les parts qui vous sont attribuées ». Le grec emploie littéralement les termes « lots » ou « parts » ; il s’agit probablement des portions du troupeau de Dieu confiées aux soins de chaque ancien.'
    reason: Alternative lexicale préservant l’image concrète de κλῆροι et son ambiguïté.
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: sans
  rationale: Dans la continuité de la coordination négative du verset précédent, « sans » introduit naturellement en français la manière d’agir interdite.
- source_word: κατακυριεύοντες
  choice: dominer sur
  rationale: Le verbe désigne l’exercice autoritaire et abusif d’une position de supériorité, non toute forme de direction. « Dominer sur » est clair, actuel et conserve cette nuance péjorative.
- source_word: τῶν κλήρων
  choice: ceux qui vous sont confiés
  rationale: Le pluriel signifie littéralement « les lots » ou « les parts attribuées ». Dans ce contexte pastoral, il désigne les portions du troupeau confiées aux responsables ; la formulation choisie exprime la responsabilité sans suggérer qu’ils en sont propriétaires.
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque nettement le contraste entre une conduite interdite et la conduite attendue.
- source_word: τύποι
  choice: des exemples
  rationale: Le terme désigne ici des modèles visibles proposés à l’imitation ; « exemples » est naturel et immédiatement compréhensible.
- source_word: γινόμενοι
  choice: en devenant
  rationale: 'Préserve l’idée dynamique du participe : les responsables doivent incarner progressivement et concrètement le modèle attendu.'
- source_word: τοῦ ποιμνίου
  choice: le troupeau
  rationale: Conserve la métaphore pastorale courante désignant la communauté des croyants.
theological_decisions:
- issue: Sens de κλήρων dans le cadre de la responsabilité ecclésiale
  choice: Les personnes ou portions du troupeau confiées aux responsables, sans idée de propriété
  alternative: « les lots », « les parts qui vous sont attribuées » ou « vos domaines »
  rationale: Le contexte porte sur les anciens qui prennent soin du troupeau de Dieu. La traduction explicite la relation de responsabilité tout en signalant en note l’image littérale des parts attribuées.
- issue: Portée de κατακυριεύοντες
  choice: Interdiction d’exercer une autorité dominatrice ou abusive
  alternative: Interdiction de toute autorité ou de toute fonction de direction
  rationale: Le verbe vise l’abus autoritaire. Le contraste avec le fait d’être des exemples concerne la manière de diriger, et non l’abolition de toute responsabilité pastorale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la construction participiale et la métaphore pastorale. « Ceux qui vous sont confiés » privilégie la clarté dans le texte, tandis que la note maintient le sens littéral et l’image des parts attribuées.
