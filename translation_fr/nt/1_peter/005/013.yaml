source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: fr
  text: Celle qui est à Babylone[b], choisie avec vous[a], vous salue ; Marc, mon fils[c], vous salue aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « L’Église qui est à Babylone, choisie avec vous. » Le grec présente une expression féminine singulière avec un nom sous-entendu.'
    reason: alternative_reading
  - marker: b
    text: Dans l’usage des premiers chrétiens, « Babylone » peut désigner symboliquement Rome ; le texte lui-même dit « Babylone ».
    reason: cultural_note
  - marker: c
    text: « Mon fils » exprime probablement une relation spirituelle plutôt qu’un lien biologique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: vous salue
  rationale: Le verbe désigne couramment l’action de saluer ou d’adresser ses salutations. « Vous salue » est naturel dans un contexte épistolaire et reste concis.
- source_word: ἡ ... συνεκλεκτὴ
  choice: Celle qui est ... choisie avec vous
  rationale: Le grec emploie un article et un adjectif féminins singuliers sans nom exprimé. Cette formulation française conserve le référent féminin implicite et l’ambiguïté du texte, sans ajouter « Église » dans le corps du verset.
- source_word: ἐν Βαβυλῶνι
  choice: à Babylone
  rationale: Le texte nomme directement Babylone. La traduction garde ce nom plutôt que de lui substituer l’interprétation possible « Rome ».
- source_word: συνεκλεκτὴ
  choice: choisie avec vous
  rationale: L’adjectif exprime le fait d’avoir été choisi conjointement avec d’autres. Cette tournure rend clairement ce rapport en français moderne.
- source_word: Μᾶρκος
  choice: Marc
  rationale: Forme française traditionnelle et courante du nom grec Μᾶρκος.
- source_word: ὁ υἱός μου
  choice: mon fils
  rationale: Le grec dit littéralement « mon fils ». Même si le lien est probablement spirituel, la traduction conserve la formulation familiale sans explicitation interprétative dans le texte.
theological_decisions:
- issue: Identité de ἡ ... συνεκλεκτὴ
  choice: 'Le référent féminin demeure implicite : « Celle qui est… choisie avec vous ».'
  alternative: « L’Église qui est à Babylone, choisie avec vous » ; ou une femme chrétienne, éventuellement l’épouse de Pierre.
  rationale: Le grec présente une expression féminine singulière sans nom explicite. Fournir « Église » dans le texte trancherait une ambiguïté réelle ; cette interprétation courante est donc signalée en note.
- issue: Sens de « Babylone »
  choice: Conserver « Babylone » dans le texte principal.
  alternative: Comprendre Babylone comme une désignation symbolique de Rome, ou comme la ville mésopotamienne.
  rationale: Le texte grec dit « Babylone » et ne précise pas lui-même s’il s’agit d’un emploi symbolique. La traduction ne résout donc pas la question historique dans le corps du verset.
- issue: Nature du lien exprimé par « mon fils »
  choice: Garder la formulation littérale « mon fils ».
  alternative: « Mon fils spirituel » ou « mon enfant dans la foi ».
  rationale: Le contexte rend probable une relation spirituelle, mais le grec ne l’explicite pas. Une note informe le lecteur sans développer le texte traduit.
translation_notes:
  register: Français international moderne, naturel et digne. La structure féminine singulière « Celle qui… » préserve l’ellipse grecque tout en restant intelligible ; les interprétations probables mais non explicites sont réservées aux notes.
