  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: fr
  text: Et lorsque le Chef des bergers sera révélé[a], vous recevrez la couronne[b] de gloire qui ne se flétrit pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apparaîtra ».
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « couronne » peut désigner une guirlande ou une couronne de vainqueur remise comme prix d’honneur, et non nécessairement une couronne royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: lorsque … se manifestera
  rationale: Le participe aoriste passif au génitif absolu exprime ici une circonstance temporelle. « Se manifestera » rend naturellement en français l’idée d’une manifestation jusque-là voilée, tout en conservant la nuance théologique du passif grec; « apparaîtra » reste possible.
- source_word: ἀρχιποίμενος
  choice: le Chef des bergers
  rationale: Le composé désigne le berger principal ou suprême. « Chef des bergers » est clair, digne et idiomatique, et sa majuscule signale qu’il s’agit ici d’un titre christologique.
- source_word: κομιεῖσθε
  choice: vous recevrez
  rationale: Le futur moyen indique ici la réception d’une récompense. « Vous recevrez » est la formulation française la plus directe et naturelle.
- source_word: ἀμαράντινον
  choice: qui ne se flétrit pas
  rationale: L’adjectif qualifie ce qui ne perd ni sa fraîcheur ni son éclat. La proposition relative est plus naturelle et immédiatement compréhensible que « infrangible » ou un terme savant, sans renforcer indûment le sens jusqu’à « impérissable ».
- source_word: τῆς δόξης
  choice: de gloire
  rationale: Le génitif est conservé afin de préserver la force concise et l’ouverture métaphorique de l’expression grecque, plutôt que de la réduire à « glorieuse ».
- source_word: στέφανον
  choice: couronne
  rationale: « Couronne » est le terme français traditionnel et lisible, mais στέφανος peut désigner plus précisément la couronne ou guirlande remise au vainqueur en signe d’honneur; cette nuance est indiquée en note.
theological_decisions:
- issue: Identité du « Chef des bergers »
  choice: Titre christologique renvoyant à Jésus
  alternative: Rendre l’expression comme une simple désignation non titulaire
  rationale: Dans le contexte pastoral et eschatologique, le titre renvoie à Jésus. La majuscule en marque la valeur titulaire sans ajouter d’explication doctrinale au texte.
- issue: Langage de la manifestation eschatologique
  choice: se manifestera
  alternative: apparaîtra
  rationale: « Se manifestera » préserve l’idée grecque d’une révélation ou manifestation et évite de préciser davantage la nature de l’événement. « Apparaîtra » est une traduction légitime, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la métaphore pastorale, le génitif « de gloire » et l’image de la couronne honorifique. Les deux marqueurs de note figurent dans le texte principal.
