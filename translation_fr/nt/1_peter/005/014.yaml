  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: fr
  text: Saluez-vous les uns les autres par un baiser d’amour. Paix à vous tous qui êtes dans le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « dans le Christ ».'
    reason: Signale la traduction traditionnelle de Χριστῷ tout en conservant « Messie » dans le texte principal.
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: Saluez-vous les uns les autres
  rationale: L’impératif aoriste moyen à la deuxième personne du pluriel appelle à une salutation mutuelle. La tournure pronominale française exprime naturellement cette réciprocité.
- source_word: ἐν φιλήματι ἀγάπης
  choice: par un baiser d’amour
  rationale: La préposition ἐν indique ici la manière ou le moyen de la salutation. « Baiser d’amour » conserve explicitement le lien lexical avec ἀγάπη sans réduire l’expression à une simple marque d’affection.
- source_word: εἰρήνη
  choice: Paix
  rationale: La formule nominale grecque a valeur de bénédiction. La formulation concise « Paix à vous » en préserve la force sans ajouter de verbe absent du texte.
- source_word: ὑμῖν πᾶσιν
  choice: à vous tous
  rationale: Cette formulation française naturelle conserve la portée inclusive du datif accompagné de πᾶσιν.
- source_word: τοῖς ἐν Χριστῷ
  choice: qui êtes dans le Messie
  rationale: L’article et le groupe prépositionnel désignent substantivement ceux qui se trouvent « en » Χριστός. Le relatif explicite est nécessaire en français, et « le Messie » traduit le titre grec tout en maintenant le sens d’union ou d’appartenance exprimé par ἐν.
theological_decisions:
- issue: Traduction de Χριστῷ dans l’expression ἐν Χριστῷ
  choice: dans le Messie
  alternative: dans le Christ
  rationale: Χριστός porte le sens du titre « Messie » ou « Oint ». Le texte principal en rend donc le contenu sémantique, tandis que la formulation française traditionnelle « dans le Christ » est signalée en note afin de ne pas masquer l’usage ecclésial familier.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise comme la clôture épistolaire grecque. « Baiser d’amour » conserve l’image concrète et la valeur communautaire de l’original.
