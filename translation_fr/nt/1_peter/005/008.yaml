source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: fr
  text: Gardez l’esprit clair[a] ; restez vigilants. Votre adversaire, le diable, va et vient comme un lion rugissant[b], cherchant quelqu’un à dévorer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Soyez sobres » ou « Gardez la tête froide ». Le verbe grec signifie littéralement « être sobre », mais il est employé ici au sens figuré : garder sa lucidité et sa maîtrise de soi face au danger spirituel.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « rôde comme un lion rugissant ». Le verbe grec signifie plus littéralement « marche çà et là » ou « va et vient », tandis que l’image du lion suggère naturellement qu’il rôde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε (νήφω)
  choice: Gardez l’esprit clair
  rationale: Le verbe signifie littéralement « être sobre », mais ses emplois néotestamentaires sont figurés. Ici, associé à γρηγορήσατε et à l’avertissement concernant le diable, il exprime la lucidité et la maîtrise de soi face au danger spirituel, sans faire double emploi avec « restez vigilants ».
- source_word: γρηγορήσατε (γρηγορέω)
  choice: restez vigilants
  rationale: L’impératif appelle à une vigilance éveillée et soutenue. Cette formulation française est naturelle et complète l’idée de lucidité exprimée par le premier impératif.
- source_word: ἀντίδικος
  choice: adversaire
  rationale: Le mot peut désigner une partie adverse dans un cadre judiciaire, mais il nomme ici plus largement celui qui s’oppose aux croyants. « Adversaire » conserve cette portée sans imposer exclusivement la nuance juridique.
- source_word: διάβολος
  choice: le diable
  rationale: Bien que le sens lexical soit « calomniateur », le terme fonctionne ici comme la désignation personnelle reconnue de l’être mauvais qui s’oppose aux croyants.
- source_word: ὡς λέων ὠρυόμενος
  choice: comme un lion rugissant
  rationale: La formulation conserve explicitement et naturellement la comparaison ainsi que l’image menaçante du rugissement.
- source_word: περιπατεῖ
  choice: va et vient
  rationale: Le verbe signifie fondamentalement « marcher » ou « aller çà et là ». « Va et vient » rend naturellement le mouvement continu sans incorporer directement l’idée interprétative de traque portée en français par « rôde ».
- source_word: ζητῶν
  choice: cherchant
  rationale: Le participe exprime l’action concomitante orientée vers un but et garde la construction concise du grec.
- source_word: τινα
  choice: quelqu’un
  rationale: Le pronom indéfini singulier désigne une cible non précisée.
- source_word: καταπιεῖν
  choice: à dévorer
  rationale: Le verbe signifie littéralement « engloutir » ou « avaler ». Dans l’image du lion, « dévorer » est l’équivalent français le plus naturel et conserve la violence prédatrice.
theological_decisions:
- issue: Faut-il rendre διάβολος comme un nom commun (« calomniateur ») ou comme la désignation personnelle de Satan ?
  choice: le diable
  alternative: le calomniateur
  rationale: Dans ce contexte, le terme désigne l’être mauvais personnel présenté comme l’adversaire des croyants, et non un calomniateur quelconque. « Le diable » reflète cet usage néotestamentaire sans ajouter d’enseignement étranger au texte.
- issue: Quel degré de menace faut-il incorporer dans la traduction de περιπατεῖ ?
  choice: va et vient
  alternative: rôde
  rationale: Le choix principal conserve le sens ordinaire du verbe grec et laisse à la comparaison avec le lion rugissant le soin d’exprimer la menace. « Rôde » reste une traduction contextuelle plausible, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs pluriels s’adressent directement à l’ensemble des lecteurs. La formulation distingue la lucidité intérieure de la vigilance active et conserve la force de l’image sans rendre le premier verbe par un terme pouvant être compris seulement comme une consigne d’abstinence.
