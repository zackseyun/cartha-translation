  source_fidelity: Le datif initial et la doxologie nominale sont bien rendus. Toutefois, « puissance souveraine » explicite l’idée de souveraineté au-delà de κράτος, qui désigne ici la puissance/la force exercée. « Pour toujours » communique l’idée fondamentale, mais atténue l’intensification de εἰς τοὺς αἰῶνας τῶν αἰώνων.
