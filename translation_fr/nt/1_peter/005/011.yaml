source:
  edition: SBLGNT
  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: fr
  text: À lui la puissance, pour toujours et à jamais[a] ! Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour les siècles des siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: À lui
  rationale: Le datif renvoie à Dieu dans le contexte précédent. « À lui » conserve la forme brève et doxologique du grec.
- source_word: κράτος
  choice: la puissance souveraine
  rationale: Dans cette doxologie, κράτος désigne une puissance qui s’exerce et gouverne. « Puissance souveraine » exprime à la fois la force et l’autorité, sans réduire le terme à une simple domination.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours
  rationale: Cette formule doxologique exprime une durée sans fin. « Pour toujours » est naturel en français moderne; la note conserve l’image sémitisante et emphatique des « siècles des siècles ».
- source_word: ἀμήν
  choice: Amen
  rationale: La translittération traditionnelle française préserve la fonction liturgique de l’affirmation finale.
theological_decisions:
- issue: Prédicat verbal sous-entendu dans la doxologie
  choice: À lui la puissance souveraine
  alternative: Que la puissance souveraine soit à lui / La puissance souveraine lui appartient
  rationale: Le grec ne comporte aucun verbe. La formulation nominale française garde cette concision et évite de choisir inutilement entre un souhait doxologique et une déclaration de possession.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase nominale conserve la solennité et l’ambiguïté grammaticale de la doxologie grecque.
