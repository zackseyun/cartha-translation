id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: fr
  text: Faites paître le troupeau de Dieu qui est parmi vous, en veillant sur lui, non par contrainte, mais de bon gré, selon Dieu[a] ; non pour un gain honteux, mais avec empressement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à la volonté de Dieu » ; ou : « comme Dieu le veut ».'
    reason: L’expression grecque κατὰ θεόν est concise et admet plusieurs explicitations proches.
lexical_decisions:
- source_word: ποιμάνατε
  choice: Faites paître
  rationale: L’impératif conserve l’image pastorale du berger sans transformer le verbe en titre ecclésiastique technique.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: le troupeau de Dieu qui est parmi vous
  rationale: « Troupeau » garde la métaphore, « parmi vous » respecte la valeur locale ou relationnelle de ἐν ὑμῖν, et « de Dieu » souligne explicitement que le troupeau appartient à Dieu.
- source_word: ἐπισκοποῦντες
  choice: en veillant sur lui
  rationale: Cette formulation décrit l’action de supervision et de vigilance sans introduire un titre ecclésiastique ultérieur comme « évêque ».
- source_word: μὴ ἀναγκαστῶς
  choice: non par contrainte
  rationale: La formule française est naturelle et exprime une action imposée par nécessité ou pression.
- source_word: ἀλλὰ ἑκουσίως
  choice: mais de bon gré
  rationale: « De bon gré » marque clairement le contraste avec la contrainte et exprime une disposition volontaire.
- source_word: κατὰ θεόν
  choice: selon Dieu
  rationale: La formulation volontairement concise maintient l’ambiguïté de l’expression grecque, qui peut renvoyer à la volonté, à la norme ou à la manière de Dieu.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: non pour un gain honteux
  rationale: Cette traduction conserve à la fois l’idée de profit recherché et le jugement moral porté sur ce mobile.
- source_word: ἀλλὰ προθύμως
  choice: mais avec empressement
  rationale: « Avec empressement » exprime la disponibilité ardente de προθύμως et reste distinct de « de bon gré », employé pour ἑκουσίως.
theological_decisions:
- issue: Faut-il rendre ἐπισκοποῦντες par un titre ecclésiastique technique ?
  choice: Rendre l’activité de manière descriptive par « en veillant sur lui ».
  alternative: « en exerçant la surveillance » ou « en servant comme responsables »
  rationale: Le participe décrit ici ce que doivent faire les anciens dans le contexte immédiat, sans imposer une conception confessionnelle particulière des ministères.
- issue: Jusqu’où expliciter κατὰ θεόν ?
  choice: Conserver « selon Dieu » dans le texte principal et donner une explicitation possible en note.
  alternative: « conformément à la volonté de Dieu » ou « comme Dieu le veut »
  rationale: L’expression grecque est dense et peut évoquer la volonté, la norme ou la manière de Dieu. La traduction principale évite de trancher silencieusement entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du troupeau est conservée ; les termes susceptibles de devenir des titres confessionnels sont rendus de façon descriptive. Le point-virgule met en évidence les deux contrastes parallèles portant sur la manière et le mobile du service.
