review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’auteur exhorte les anciens, se présente comme leur compagnon dans la fonction d’ancien, comme témoin des souffrances du Messie et comme participant à la gloire future révélée. « Sur le point d’être révélée » rend possible la nuance prospective de μέλλω, mais « qui va être révélée » est plus naturel en français sans imposer une imminence chronologique plus étroite.'
  naturalness: La phrase est globalement claire et conserve convenablement les appositions grecques. Toutefois, « ancien comme eux » peut se comprendre, hors contexte, au sens d’« âgé comme eux », alors que συμπρεσβύτερος renvoie ici à une qualité/fonction partagée. « Moi-même ancien » est idiomatique et lève cette ambiguïté.
  terminology: « Les anciens », « Messie », « témoin » et « avoir part à » sont des choix appropriés dans un français international moderne. « Messie » préserve la valeur titulaire de Χριστός; l’alternative traditionnelle « Christ » est utile en note.
  issues:
  - severity: medium
    issue: Ambiguïté de « ancien comme eux »
    rationale: Cette formulation peut évoquer l’âge plutôt que le statut partagé exprimé par συμπρεσβύτερος. « Moi-même ancien » conserve le parallélisme de statut et reste naturel.
  - severity: low
    issue: Note b trop restrictive et alternative modale
    rationale: « Qui doit être révélée » ne correspond pas directement à l’alternative anglaise, qui porte sur la participation à la gloire future, et « doit » peut suggérer une nécessité absente du texte. La note devrait présenter l’alternative complète et conserver la valeur prospective.
  revised_text: 'J’exhorte donc les anciens parmi vous, moi-même ancien et témoin des souffrances du Messie[a], ayant aussi part à la gloire qui va être révélée[b] :'
  revised_footnotes:
