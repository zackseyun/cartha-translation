- from: 'J’exhorte donc les anciens qui sont parmi vous, moi qui suis ancien comme eux et témoin des souffrances du Messie[a], et qui ai aussi part à la gloire qui est sur le point d’être révélée[b] :'
  to: 'J’exhorte donc les anciens parmi vous, moi-même ancien et témoin des souffrances du Messie[a], ayant aussi part à la gloire qui va être révélée[b] :'
  rationale: La révision remplace une expression susceptible de confondre la fonction d’ancien avec l’âge par une formulation française directe. Elle rend également la construction participiale de κοινωνός de manière fluide et ajuste la note b afin qu’elle porte sur l’alternative lexicale relative à la participation, tout en évitant d’ajouter une idée de nécessité.
