id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: fr
  text: 'J’exhorte donc les anciens parmi vous, moi-même ancien et témoin des souffrances du Messie[a], ayant aussi part à la gloire qui va être révélée[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou, selon l’usage traditionnel, par « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « qui participe à la gloire qui va être révélée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: les anciens
  rationale: Dans ce contexte ecclésial, le terme désigne des responsables de la communauté plutôt que simplement des hommes âgés. « Anciens » est l’équivalent français courant qui évite d’importer une terminologie confessionnelle ultérieure.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français le lien logique avec ce qui précède.
- source_word: ἐν ὑμῖν
  choice: qui sont parmi vous
  rationale: Cette formulation explicite avec naturel la présence des anciens au sein des destinataires.
- source_word: παρακαλῶ
  choice: J’exhorte
  rationale: Le verbe exprime ici une invitation pastorale pressante et solennelle, plus forte qu’une simple demande.
- source_word: συμπρεσβύτερος
  choice: moi qui suis ancien comme eux
  rationale: Cette tournure française naturelle conserve l’idée que l’auteur partage avec les destinataires la même qualité d’ancien, sans suggérer une hiérarchie distincte.
- source_word: μάρτυς
  choice: témoin
  rationale: Le sens immédiat est celui d’une personne qui témoigne des souffrances du Messie, non nécessairement celui d’un martyr mis à mort.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: des souffrances du Messie
  rationale: Le génitif désigne le plus naturellement les souffrances subies par le Messie; la formulation française reste concise et fidèle.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre, « l’Oint »; « Messie » la rend plus explicitement que l’appellation traditionnelle « Christ ».
- source_word: κοινωνός
  choice: qui ai aussi part à
  rationale: Cette locution idiomatique exprime une participation réelle sans les connotations commerciales que pourrait avoir « partenaire ».
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: à la gloire qui est sur le point d’être révélée
  rationale: La formulation garde la voix passive de ἀποκαλύπτεσθαι ainsi que la nuance d’attente prochaine portée par μέλλω, sans préciser davantage le calendrier eschatologique.
theological_decisions:
- issue: Traduction du titre christologique Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: « Messie » rend le sens titulaire de Χριστός dans ce passage. La forme traditionnelle « Christ » demeure possible et est signalée en note.
- issue: Portée de μελλούσης ἀποκαλύπτεσθαι
  choice: qui est sur le point d’être révélée
  alternative: qui doit être révélée
  rationale: Le choix retenu fait entendre la nuance d’attente imminente de μέλλω, tout en laissant intacte la tension eschatologique du texte et sans fixer une date.
- issue: Nature du témoignage exprimé par μάρτυς
  choice: témoin des souffrances du Messie
  alternative: celui qui témoigne des souffrances du Messie
  rationale: « Témoin » préserve l’ambiguïté possible entre témoin direct et personne qui rend témoignage; le texte ne justifie pas de trancher explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure d’exhortation et les appositions du grec, tout en évitant une formulation trop lourde. Le deux-points final maintient le lien avec l’exhortation qui se poursuit au verset suivant.
