source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: fr
  text: Résistez-lui, fermes dans la foi, sachant que les mêmes souffrances sont en train de s’accomplir au sein de votre communauté de frères et sœurs dans le monde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sachant que les mêmes souffrances sont vécues par votre communauté de frères et sœurs dans le monde ». Le verbe grec peut aussi évoquer des souffrances qui s’accomplissent ou sont menées à leur terme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: lui
  rationale: Le pronom relatif au datif renvoie au diable mentionné au verset précédent; « lui » est l’objet naturel de « résistez » en français.
- source_word: ἀντίστητε
  choice: Résistez
  rationale: L’impératif appelle à une opposition résolue; « résistez » est direct, naturel et précis.
- source_word: στερεοὶ τῇ πίστει
  choice: fermes dans la foi
  rationale: « Fermes » exprime la stabilité demandée. « Dans la foi » conserve l’article grec et peut désigner à la fois l’attachement à la foi chrétienne et la confiance croyante, sans trancher excessivement.
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe est conservé par une tournure française naturelle qui présente ce savoir comme circonstance ou fondement de la résistance.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: les mêmes souffrances
  rationale: Cette formulation proche du grec indique des souffrances comparables, sans suggérer nécessairement des événements identiques.
- source_word: ἀδελφότητι
  choice: communauté de frères et sœurs
  rationale: Le nom collectif désigne l’ensemble des croyants. Cette expression française restitue clairement le lien familial et l’inclusion des hommes et des femmes.
- source_word: ἐν τῷ κόσμῳ
  choice: dans le monde
  rationale: Traduction directe de la localisation de la communauté croyante.
- source_word: ἐπιτελεῖσθαι
  choice: sont imposées à
  rationale: Le passif de ἐπιτελέω peut exprimer ce qui est infligé ou mené à son terme. Dans ce contexte, « sont imposées à » rend naturellement le fait que la communauté subit ces souffrances, tout en évitant de réduire le verbe à la seule expérience subjective.
theological_decisions:
- issue: Portée de τῇ πίστει
  choice: dans la foi
  alternative: par la foi; fermes dans votre foi
  rationale: L’article et le contexte peuvent viser la foi chrétienne à laquelle les lecteurs demeurent attachés, mais aussi leur confiance croyante. La formulation retenue préserve cette tension.
- issue: Sens de ἐπιτελεῖσθαι appliqué aux souffrances
  choice: sont imposées à
  alternative: sont vécues par; sont menées à leur terme chez
  rationale: Le verbe peut évoquer l’accomplissement ou l’achèvement, tandis que le contexte implique que les croyants subissent ces souffrances. Le texte principal privilégie un français intelligible sans affirmer explicitement un quota divinement fixé; la note conserve l’autre nuance.
- issue: Désignation de l’ἀδελφότης
  choice: communauté de frères et sœurs
  alternative: fraternité; communauté des croyants
  rationale: Le terme collectif englobe toute la communauté croyante. La formulation choisie garde l’image familiale du grec tout en étant immédiatement inclusive en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif reste énergique; la syntaxe participiale du grec est conservée sans lourdeur excessive. L’image familiale de la communauté croyante est explicitée de manière naturelle.
