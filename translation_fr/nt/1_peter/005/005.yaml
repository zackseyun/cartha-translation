id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: fr
  text: De même, vous, les plus jeunes[a], soumettez-vous aux anciens. Et vous tous, revêtez-vous d’humilité les uns envers les autres[b], car Dieu s’oppose aux orgueilleux, mais il accorde sa grâce aux humbles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec est au masculin pluriel et peut se traduire par « jeunes hommes »; certains comprennent plus largement « ceux qui sont plus jeunes » dans la communauté.
    reason: lexical_alternative
  - marker: b
    text: Ou « attachez-vous l’humilité ». Le verbe grec évoque le fait de mettre ou de nouer un vêtement, ce qui souligne une démarche délibérée.
    reason: lexical_alternative
  - marker: c
    text: Citation ou allusion à Proverbes 3.34 dans la Septante.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: De même
  rationale: Marque naturellement le lien entre cette exhortation et les instructions adressées aux anciens dans les versets précédents.
- source_word: νεώτεροι
  choice: vous, les plus jeunes
  rationale: Rend le comparatif substantivé et son contraste avec les anciens, tout en conservant en français la possibilité qu’il désigne les hommes plus jeunes ou, plus largement, les membres plus jeunes de la communauté.
- source_word: ὑποτάγητε
  choice: soumettez-vous
  rationale: Exprime clairement l’impératif et la participation volontaire impliquée par cet emploi de ὑποτάσσω.
- source_word: πρεσβυτέροις
  choice: aux anciens
  rationale: Le contexte immédiat de 5.1-4 favorise le sens de responsables reconnus de la communauté plutôt que celui de simples hommes âgés.
- source_word: πάντες δὲ
  choice: Et vous tous
  rationale: Élargit explicitement l’exhortation à l’ensemble de la communauté.
- source_word: ἀλλήλοις
  choice: les uns envers les autres
  rationale: Rend l’orientation relationnelle et réciproque de l’humilité demandée.
- source_word: ταπεινοφροσύνην
  choice: d’humilité
  rationale: Équivalent français courant et digne pour l’attitude de modestie et d’abaissement de soi.
- source_word: ἐγκομβώσασθε
  choice: revêtez-vous
  rationale: Conserve l’image d’un vêtement que l’on met ou attache, sans introduire un objet précis que le texte ne nomme pas.
- source_word: ὅτι
  choice: car
  rationale: Introduit avec naturel en français le fondement scripturaire de l’exhortation.
- source_word: ὑπερηφάνοις
  choice: aux orgueilleux
  rationale: Rend l’adjectif substantivé par une formulation française concise et usuelle.
- source_word: ἀντιτάσσεται
  choice: s’oppose
  rationale: Conserve la force du verbe, qui décrit Dieu se plaçant contre les orgueilleux.
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: mais il accorde sa grâce aux humbles
  rationale: « Accorde sa grâce » exprime naturellement le don divin de χάρις et maintient le contraste avec les orgueilleux.
theological_decisions:
- issue: Référent de πρεσβυτέροις
  choice: les anciens, au sens de responsables de la communauté
  alternative: les hommes plus âgés en général
  rationale: Pierre vient de s’adresser explicitement aux anciens en 5.1-4; la continuité du passage rend le sens ecclésial plus probable, sans ajouter un titre institutionnel plus précis.
- issue: Portée de νεώτεροι
  choice: les plus jeunes
  alternative: les jeunes hommes
  rationale: Le grec est au masculin pluriel, mais le masculin français peut désigner un groupe masculin ou avoir une portée plus générale. Cette formulation préserve mieux l’ambiguïté réelle, explicitée en note, que « jeunes hommes », qui la trancherait.
- issue: Nature de la dernière proposition
  choice: parole scripturaire donnée comme fondement de l’exhortation
  alternative: simple maxime indépendante
  rationale: La formulation reprend Proverbes 3.34 dans la Septante; le texte l’emploie pour motiver l’appel à l’humilité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement grec, tandis que « revêtez-vous d’humilité » conserve l’image sans produire une tournure artificielle. Les notes signalent les deux ambiguïtés lexicales principales et la source scripturaire.
