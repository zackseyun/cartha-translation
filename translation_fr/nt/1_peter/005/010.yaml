id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: fr
  text: Et le Dieu de toute grâce, qui vous a appelés à sa gloire éternelle dans le Messie[a], après avoir souffert pendant un court moment, vous rétablira lui-même[b], vous affermira, vous fortifiera et vous établira sur de solides fondations[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou, selon l’usage traditionnel, par « Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « vous rendra accomplis » ou « vous remettra en bon état ». Le verbe grec désigne le fait d’amener à l’état voulu ou de restaurer ce qui doit l’être.
    reason: lexical_alternative
  - marker: c
    text: Ou « vous fondera » ou « vous établira sur un fondement solide ». Le grec emploie l’image des fondations.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: de toute grâce
  rationale: Cette tournure naturelle conserve la portée globale de l’expression grecque sans la réduire à des formes particulières de grâce.
- source_word: καλέσας
  choice: qui vous a appelés
  rationale: Le participe aoriste se rend naturellement par une proposition relative au passé composé en français moderne.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: à sa gloire éternelle
  rationale: Avec le verbe « appeler », « appeler à » exprime naturellement en français l’orientation vers la gloire, sans nier l’idée de participation portée par εἰς.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: « Messie » traduit le titre Χριστός, tandis que « dans » préserve la formule relationnelle et christologique ἐν Χριστῷ.
- source_word: ὀλίγον παθόντας
  choice: après que vous aurez souffert un peu de temps
  rationale: Le futur antérieur après « après que » marque clairement que la souffrance limitée précède les actions divines annoncées, tout en conservant la valeur temporelle probable de ὀλίγον.
- source_word: αὐτὸς
  choice: lui-même
  rationale: 'La position conserve l’emphase du pronom grec : Dieu agira personnellement.'
- source_word: καταρτίσει
  choice: vous rétablira
  rationale: Le verbe évoque la remise en bon état ou l’équipement adéquat ; « rétablira » convient au contexte de souffrance sans exclure la nuance d’accomplissement.
- source_word: στηρίξει
  choice: vous affermira
  rationale: « Affermir » exprime directement l’idée de rendre stable ou ferme et reste distinct du verbe suivant.
- source_word: σθενώσει
  choice: vous fortifiera
  rationale: Équivalent français direct et naturel de l’idée de rendre fort.
- source_word: θεμελιώσει
  choice: vous donnera de solides fondations
  rationale: Cette formulation rend explicite et intelligible l’image des fondations contenue dans le grec, sans la confondre avec « affermir ».
theological_decisions:
- issue: Traduction de Χριστῷ
  choice: dans le Messie
  alternative: en Christ
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en traduit le sens, tandis qu’une note signale la forme traditionnelle « Christ ».
- issue: Rapport temporel entre la souffrance et l’action divine
  choice: après que vous aurez souffert un peu de temps
  alternative: quand vous aurez souffert un peu de temps
  rationale: Le participe permet une certaine souplesse, mais le contexte présente une souffrance limitée suivie de l’action restauratrice de Dieu. La formulation retenue préserve cette succession sans élaborer un système théologique.
- issue: Portée de καταρτίσει
  choice: vous rétablira
  alternative: vous rendra accomplis
  rationale: Le contexte après la souffrance favorise l’idée de remise en état, mais la note conserve la nuance possible d’achèvement ou d’accomplissement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’ampleur rhétorique de l’original et la série de quatre verbes, tout en variant naturellement leur formulation pour maintenir leurs nuances respectives.
