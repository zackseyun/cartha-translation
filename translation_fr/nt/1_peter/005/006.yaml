  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: fr
  text: Humiliez-vous donc sous la main puissante de Dieu, afin qu’il vous élève au moment voulu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soyez donc humiliés sous la main puissante de Dieu, afin qu’il vous élève au moment voulu. » L’impératif grec est de forme passive, bien qu’il soit souvent compris ici avec une valeur réfléchie : « Humiliez-vous. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: Humiliez-vous
  rationale: Bien que l’impératif grec soit de forme passive, il est couramment compris ici avec une valeur réfléchie ou moyenne. « Humiliez-vous » est naturel en français et conserve la force de l’exhortation.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence logique de l’affirmation précédente selon laquelle Dieu s’oppose aux orgueilleux mais accorde sa grâce aux humbles.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: sous la main puissante de Dieu
  rationale: Conserve la métaphore biblique de la main de Dieu comme expression de sa puissance souveraine, dans une formulation française claire et reconnue.
- source_word: ἵνα
  choice: afin que
  rationale: Exprime naturellement en français la visée de l’humiliation demandée, sans exclure la nuance de résultat.
- source_word: ὑμᾶς ὑψώσῃ
  choice: qu’il vous élève
  rationale: Le sujet implicite est Dieu. « Élever » rend ici l’action par laquelle Dieu honore ou relève les humbles, sans la réduire à un mouvement physique.
- source_word: ἐν καιρῷ
  choice: au moment voulu
  rationale: καιρός désigne le moment approprié ou déterminé, plutôt que le simple passage du temps. Cette formulation moderne laisse entendre que ce moment relève de Dieu sans expliciter davantage que le grec.
theological_decisions:
- issue: Voix et agent dans Ταπεινώθητε
  choice: « Humiliez-vous » avec une note signalant la forme passive grecque
  alternative: « Laissez-vous humilier » ou « Soyez humiliés »
  rationale: Le rendu réfléchi exprime naturellement la responsabilité des destinataires de se placer humblement sous la puissance de Dieu. La note préserve toutefois l’ambiguïté réelle de la forme passive et évite d’effacer la possibilité d’une insistance sur l’action subie.
- issue: Sens de l’élévation promise
  choice: « qu’il vous élève »
  alternative: « qu’il vous relève »
  rationale: « Élève » maintient la portée ouverte de ὑψόω, qui peut évoquer l’honneur, la restauration ou la justification accordés par Dieu, sans imposer une réalisation exclusivement présente ou future.
translation_notes:
  register: Français international moderne, digne et accessible. « Main puissante » conserve l’image biblique traditionnelle; « au moment voulu » est plus courant aujourd’hui que « au temps convenable ». La virgule avant l’appel de note suit la ponctuation de la phrase fournie, tout en rattachant la note à l’ensemble du verset.
