source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: fr
  text: Par Silvain, ce frère que je tiens pour fidèle, je vous ai écrit en quelques mots, pour vous exhorter et attester que c’est là la véritable grâce de Dieu. Tenez ferme dans cette grâce.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « dans laquelle vous vous tenez fermes », au lieu de : « Tenez ferme dans cette grâce. »'
    reason: 'Variante textuelle : certains témoins donnent une lecture indicative plutôt que l’impératif du texte SBLGNT.'
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: C’est par Silvain … que je vous ai écrit
  rationale: διά avec le génitif exprime ici vraisemblablement l’intermédiaire ou l’agent. La tournure française met ce rôle en relief sans préciser indûment si Silvain fut porteur, secrétaire ou les deux.
- source_word: Σιλουανοῦ
  choice: Silvain
  rationale: « Silvain » est la forme française usuelle correspondant au grec Σιλουανός; elle préserve la forme du nom employée dans ce verset plutôt que de la remplacer par « Silas ».
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: ce frère fidèle
  rationale: πιστός peut signifier fidèle ou digne de confiance. « Frère fidèle » convient au langage de recommandation et désigne correctement ce collaborateur masculin précis; l’article grec est rendu naturellement par le démonstratif dans cette apposition française.
- source_word: ὡς λογίζομαι
  choice: tel que je le considère
  rationale: La formule conserve l’appréciation personnelle et parenthétique de l’auteur, sans transformer πιστός en simple opinion incertaine.
- source_word: δι’ ὀλίγων
  choice: en peu de mots
  rationale: L’expression idiomatique indique la brièveté de l’écrit. Cette formulation reste proche du grec et naturelle en français.
- source_word: ἔγραψα
  choice: je vous ai écrit
  rationale: Le passé composé rend naturellement l’aoriste épistolaire dans une conclusion de lettre française.
- source_word: παρακαλῶν
  choice: pour vous exhorter
  rationale: Le participe exprime le but ou la fonction de l’écrit. « Exhorter » conserve la portée d’encouragement pressant et moral du verbe.
- source_word: ἐπιμαρτυρῶν
  choice: attester
  rationale: Le verbe exprime une confirmation solennelle ou un témoignage appuyé; « attester » en maintient la force probante.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: que telle est la véritable grâce de Dieu
  rationale: « Telle » renvoie sans le délimiter au contenu ou à la réalité évoquée dans la lettre. « Véritable grâce de Dieu » préserve l’affirmation de son authenticité.
- source_word: εἰς ἣν στῆτε
  choice: Tenez ferme en elle
  rationale: L’impératif στῆτε appelle à la fermeté. Le pronom féminin reprend explicitement « grâce », tandis que « en elle » conserve la relation exprimée par εἰς dans ce contexte.
theological_decisions:
- issue: Référent de ταύτην (« telle »)
  choice: La formulation laisse « telle » renvoyer largement à ce que Pierre vient d’écrire, exhorte et atteste comme étant la véritable grâce de Dieu.
  alternative: Le démonstratif pourrait viser plus étroitement l’expérience présente de la grâce chez les lecteurs ou le message transmis par Silvain.
  rationale: Le contexte immédiat favorise le contenu de la lettre sans permettre d’en fixer plus précisément l’étendue; la traduction maintient donc cette ambiguïté.
- issue: Valeur de στῆτε
  choice: 'Impératif : « Tenez ferme en elle. »'
  alternative: 'Variante indicative : « dans laquelle vous tenez ferme » ou « dans laquelle vous vous tenez ».'
  rationale: Le texte SBLGNT fourni porte l’impératif στῆτε. La variante manuscrite est signalée en note plutôt que substituée au texte critique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton de conclusion épistolaire et l’incise personnelle, tout en évitant de préciser le rôle exact de Silvain ou le référent exact de « telle ».
