revisions:
- from: C’est par Silvain[a], ce frère fidèle — tel que je le considère —, que je vous ai écrit en peu de mots, pour vous exhorter et attester que telle est la véritable grâce de Dieu. Tenez ferme en elle.[b]
  to: Par Silvain, ce frère que je tiens pour fidèle, je vous ai écrit en quelques mots, pour vous exhorter et attester que c’est là la véritable grâce de Dieu. Tenez ferme dans cette grâce.[a]
  rationale: 'La révision améliore la syntaxe et l’idiomaticité françaises, tout en préservant les ambiguïtés du grec : Silvain demeure un intermédiaire dont la fonction n’est pas définie ; « c’est là » ne restreint pas le référent du démonstratif ; et l’impératif στῆτε reste dans le texte principal. La note est ajustée afin de correspondre à la formulation française révisée et de signaler clairement l’alternative indicative.'
