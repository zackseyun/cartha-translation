  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: fr
  text: Déchargez-vous[b] de toutes vos inquiétudes[a] sur lui[c], car il prend soin de vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « préoccupations » ou « soucis » ; le mot grec désigne ici des préoccupations anxieuses.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ayant jeté sur lui » ; cette proposition se rattache à l’exhortation du verset 6.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire Dieu, d’après le contexte immédiat (verset 6).
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: toutes vos inquiétudes
  rationale: Le singulier collectif grec désigne l’ensemble des préoccupations anxieuses des destinataires. Le pluriel est plus naturel en français et conserve la portée globale de πᾶσαν.
- source_word: ἐπιρίψαντες
  choice: déchargez-vous
  rationale: Le participe aoriste dépend de l’exhortation du verset précédent et exprime la manière de s’humilier sous la main de Dieu. L’impératif français rend naturellement cette force exhortative tout en conservant l’image du fardeau transféré.
- source_word: ἐπ’ αὐτόν
  choice: sur lui
  rationale: La préposition avec l’accusatif marque le mouvement vers celui sur qui le fardeau est placé; « sur lui » préserve cette image.
- source_word: ὅτι
  choice: car
  rationale: Introduit le motif de l’exhortation. « Car » convient au registre biblique moderne sans être archaïque.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: il prend soin de vous
  rationale: Cette tournure française idiomatique exprime la sollicitude active indiquée par μέλει περὶ, plutôt qu’un simple intérêt intellectuel.
theological_decisions:
- issue: Référent de αὐτόν et αὐτῷ
  choice: « lui / il » renvoie à Dieu
  alternative: Le Seigneur, désigné plus généralement par le contexte
  rationale: Le référent immédiat est Dieu, nommé au verset 6. Le pronom est toutefois conservé dans le texte afin de ne pas expliciter davantage que le grec.
- issue: Rapport du participe ἐπιρίψαντες avec l’exhortation précédente
  choice: Le rendre comme une exhortation coordonnée dans ce verset
  alternative: « en vous déchargeant » ou « après vous être déchargés », pour marquer formellement la dépendance syntaxique envers le verset 6
  rationale: Le participe précise comment les destinataires doivent s’humilier sous la main puissante de Dieu. L’impératif est plus naturel isolément en français, tandis qu’une note signale la forme grecque et son lien syntaxique.
translation_notes:
  register: Français international moderne, simple et digne. « Déchargez-vous » conserve l’image d’un poids confié à quelqu’un, tandis que « prend soin de vous » exprime avec naturel la sollicitude divine. Les marqueurs suivent chaque élément qu’ils éclairent.
