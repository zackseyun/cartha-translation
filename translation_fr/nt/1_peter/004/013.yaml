id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: fr
  text: Mais dans la mesure où vous prenez part aux souffrances du Messie[a], réjouissez-vous, afin que, lors de la révélation de sa gloire[b], vous vous réjouissiez aussi, transportés d’allégresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ». Le titre grec Χριστός signifie « Messie ».
    reason: alternative_reading
  - marker: b
    text: Ou « lors du dévoilement de sa gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: dans la mesure où
  rationale: Cette expression française rend la valeur proportionnelle de καθό sans la réduire à un simple « lorsque » ou « comme ».
- source_word: κοινωνεῖτε
  choice: vous prenez part à
  rationale: « Prendre part à » exprime clairement la participation indiquée par κοινωνέω, sans suggérer une simple compassion extérieure.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: aux souffrances du Messie
  rationale: La construction au génitif est rendue naturellement en français tout en laissant ouverte la nature exacte de cette participation aux souffrances associées au Messie.
- source_word: Χριστοῦ
  choice: Messie
  rationale: Χριστός conserve ici sa portée de titre messianique; « Messie » en rend le sens plutôt que de le traiter uniquement comme un nom propre traditionnel.
- source_word: χαίρετε
  choice: réjouissez-vous
  rationale: L’impératif appelle à une joie active et maintient le lien lexical avec χαρῆτε dans la proposition finale.
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » conserve clairement la relation de but ou de résultat exprimée par ἵνα.
- source_word: ἀποκαλύψει
  choice: révélation
  rationale: Le nom français correspond à la forme nominale grecque et désigne ici la manifestation future de la gloire du Messie.
- source_word: δόξης αὐτοῦ
  choice: sa gloire
  rationale: Cette formulation possessive est naturelle et fidèle à la construction grecque.
- source_word: χαρῆτε
  choice: vous vous réjouissiez aussi
  rationale: Le subjonctif dépend d’« afin que » et reprend en français le même champ lexical que l’impératif précédent; « aussi » rend καί.
- source_word: ἀγαλλιώμενοι
  choice: transportés d’allégresse
  rationale: Cette tournure participiale exprime la joie intense et exultante du terme grec tout en restant naturelle dans un registre biblique moderne.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le choix retient la valeur titulaire et le contexte messianique du terme grec. Une note signale la traduction traditionnelle sans imposer une interprétation confessionnelle.
- issue: Nature de la participation aux souffrances du Messie
  choice: prendre part aux souffrances du Messie
  alternative: partager les souffrances du Messie
  rationale: La formulation préserve la notion de participation sans préciser indûment s’il s’agit d’union au Messie, de souffrances subies pour lui ou d’une autre relation théologique avec ses souffrances.
- issue: Rapport entre la joie présente et la joie future
  choice: réjouissez-vous… afin que… vous vous réjouissiez aussi
  alternative: soyez dans la joie… pour être aussi dans la joie
  rationale: La répétition lexicale conserve le parallèle grec entre χαίρετε et χαρῆτε et maintient la tension entre l’exhortation présente et la joie liée à la révélation future.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement de la phrase grecque, tandis que « transportés d’allégresse » évite une combinaison peu naturelle telle que « vous réjouir avec exultation ».
