  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: fr
  text: Mais la fin de toutes choses est proche.[a] Soyez donc lucides et vigilants en vue des prières.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’est approchée ». Le parfait grec exprime une approche dont le résultat demeure présent ; « est proche » en rend naturellement le sens en français.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « en vue des prières ». Le pluriel peut évoquer des prières répétées ou une vie consacrée à la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: de toutes choses
  rationale: Le génitif pluriel neutre, associé à τὸ τέλος, désigne naturellement l’ensemble des réalités créées ou présentes, sans qu’il soit nécessaire de préciser davantage.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition avec une légère nuance de contraste par rapport au contexte précédent.
- source_word: τὸ τέλος
  choice: la fin
  rationale: Dans ce contexte eschatologique, « la fin » est le rendu le plus direct, tout en évitant d’imposer un scénario chronologique particulier.
- source_word: ἤγγικεν
  choice: s’est approchée
  rationale: Le parfait grec exprime une proximité désormais établie, résultant d’un mouvement d’approche. Ce rendu conserve cet aspect, même si « est proche » serait plus idiomatique.
- source_word: σωφρονήσατε
  choice: soyez lucides
  rationale: Le verbe appelle à un jugement sain, posé et maîtrisé. « Soyez lucides » rend clairement cette dimension mentale en français actuel.
- source_word: οὖν
  choice: donc
  rationale: Le terme introduit la conséquence pratique tirée de la proximité de la fin.
- source_word: νήψατε
  choice: vigilants
  rationale: Employé figurativement, le verbe évoque la sobriété d’esprit et l’attention spirituelle. « Vigilants » évite de réduire le sens à l’abstinence tout en le distinguant de la lucidité exprimée par σωφρονήσατε.
- source_word: εἰς προσευχάς
  choice: en vue de la prière
  rationale: εἰς exprime ici le but. Le singulier collectif « la prière » est naturel en français et peut désigner la pratique répétée de la prière, malgré le pluriel grec.
theological_decisions:
- issue: Portée eschatologique de « la fin de toutes choses »
  choice: Conserver l’affirmation eschatologique directe sans en préciser le calendrier ni le système.
  alternative: Comprendre τέλος comme le but ou l’accomplissement de toutes choses, ou atténuer sa dimension future.
  rationale: Le contexte associe la proximité de la fin à une exhortation présente. La formulation garde cette urgence et la tension temporelle du texte sans importer de schéma confessionnel.
- issue: Rapport entre maîtrise mentale, vigilance et prière
  choice: Présenter les deux impératifs comme des dispositions orientées vers la prière.
  alternative: Faire de la prière le simple cadre occasionnel de ces dispositions.
  rationale: La construction εἰς προσευχάς exprime vraisemblablement le but ou le résultat recherché, sans définir plus précisément la nature ou le nombre des prières.
translation_notes:
  register: Français international moderne, digne et accessible. « Lucides et vigilants » distingue les deux impératifs grecs sans introduire une référence moderne particulière à l’abstinence. La tournure plus formelle « s’est approchée » est éclairée par une note.
