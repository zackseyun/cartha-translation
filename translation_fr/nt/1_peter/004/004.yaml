id: 1PE.4.4
reference: 1 Peter 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: fr
  text: À ce sujet, ils trouvent étrange que vous ne vous précipitiez pas avec eux dans le même flot de débauche[a], vous insultant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le même déversement de débauche »; ou « débordement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils vous calomnient » ou « vous couvrent d’injures ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: À ce sujet
  rationale: La locution renvoie au changement de conduite décrit auparavant. « À ce sujet » conserve ce lien sans imposer le rapport causal plus fort de « à cause de cela ».
- source_word: ξενίζονται
  choice: ils trouvent étrange
  rationale: Le verbe exprime le fait de considérer une conduite comme étrange ou surprenante. Cette tournure naturelle garde la nuance liée à ξένος.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: que vous ne couriez pas avec eux
  rationale: La proposition explicite naturellement le génitif absolu, tandis que « courir avec eux » préserve l'image et l'idée de participation collective.
- source_word: εἰς τὴν αὐτὴν
  choice: vers le même
  rationale: « Vers » rend le mouvement exprimé par εἰς et s'accorde naturellement avec l'image de courir, sans effacer la participation visée.
- source_word: τῆς ἀσωτίας
  choice: de débauche
  rationale: ἀσωτία désigne une vie moralement effrénée et dissolue. « Débauche » est actuel, intelligible et suffisamment large dans ce contexte.
- source_word: ἀνάχυσιν
  choice: débordement
  rationale: Le nom évoque littéralement un déversement ou un débordement. « Débordement » conserve cette image d'excès et forme une expression française naturelle.
- source_word: βλασφημοῦντες
  choice: et ils vous insultent
  rationale: Dans ce contexte humain, le participe évoque des paroles injurieuses ou diffamatoires plutôt que le blasphème au sens français courant. Une proposition coordonnée exprime clairement la réaction simultanée.
theological_decisions:
- issue: Cible et nature des paroles exprimées par βλασφημοῦντες
  choice: ils vous insultent
  alternative: ils vous calomnient / ils blasphèment
  rationale: Le contexte immédiat porte sur la réaction des non-croyants envers les croyants. « Blasphèment » suggérerait normalement en français une offense dirigée contre Dieu, tandis que « insultent » préserve ici le caractère abusif des paroles sans imposer qu'il s'agisse nécessairement d'accusations mensongères.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la course est conservée, ainsi que l'image du débordement; la syntaxe reste fluide pour une lecture publique.
