reference: 1 Peter 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: fr
  text: afin de vivre le temps qui lui reste dans la chair[a], non plus selon les désirs humains, mais selon la volonté de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le corps ». Ici, l’expression grecque « dans la chair » désigne la vie terrestre et corporelle, sans désigner nécessairement la « nature pécheresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: afin de
  rationale: La préposition suivie de l’infinitif articulé exprime ici le but ou le résultat en lien avec le verset précédent. « Afin de » restitue naturellement cette valeur.
- source_word: μηκέτι
  choice: non plus
  rationale: Cette tournure indique la cessation d’une manière de vivre antérieure et s’intègre naturellement à la construction française.
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: selon les désirs humains
  rationale: « Humains » rend le génitif générique sans restriction masculine. « Désirs » conserve l’étendue sémantique de ἐπιθυμίαις, tandis que « selon » exprime idiomatiquement la norme qui gouverne la conduite.
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: mais selon la volonté de Dieu
  rationale: 'La formulation maintient le contraste parallèle entre deux orientations de vie : les désirs humains et la volonté de Dieu.'
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: le temps qui lui reste
  rationale: Cette formulation française naturelle conserve la portée individualisée suggérée par le contexte précédent.
- source_word: ἐν σαρκὶ
  choice: dans la chair
  rationale: La traduction littérale préserve le terme grec et son ambiguïté potentielle, tandis qu’une note précise qu’il désigne ici vraisemblablement l’existence terrestre et corporelle.
- source_word: βιῶσαι
  choice: vivre
  rationale: L’infinitif désigne le fait de mener ou de passer sa vie; « vivre » est direct et convient avec le complément de temps.
theological_decisions:
- issue: Sens de σάρξ dans ἐν σαρκὶ
  choice: existence terrestre et corporelle (« dans la chair »)
  alternative: nature pécheresse
  rationale: Dans ce contexte, l’expression vise le temps qui reste à vivre dans la condition humaine corporelle. Elle ne désigne pas nécessairement un principe intérieur pécheur; la traduction littérale accompagnée d’une note évite de trancher abusivement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « selon les désirs humains… selon la volonté de Dieu » rend explicite la relation syntaxique des datifs tout en conservant le contraste du grec.
