source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: fr
  text: Avant tout, ayez les uns pour les autres un amour ardent, car l’amour couvre une multitude de péchés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette formulation fait écho à Proverbes 10.12. Ici, « couvre » peut évoquer le fait de ne pas exposer ni raviver les fautes, mais la métaphore ne précise pas à elle seule de quelle manière l’amour les couvre.
    reason: cross_reference_and_ambiguity
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Avant tout
  rationale: Cette expression marque ici la priorité ou l’importance suprême, plutôt qu’une simple antériorité temporelle.
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: un amour les uns pour les autres
  rationale: Dans ce contexte communautaire, le réfléchi a une valeur réciproque. Cette formulation exprime clairement l’amour mutuel.
- source_word: ἐκτενῆ
  choice: ardent
  rationale: L’adjectif évoque un amour intense, soutenu et pleinement engagé. « Ardent » conserve cette force dans un français naturel et digne.
- source_word: ἔχοντες
  choice: ayez
  rationale: Le participe présent prolonge les exhortations du contexte. Le rendre par un impératif permet d’en exprimer naturellement la force exhortative en français.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation. « Car » garde ce rapport causal dans un registre fluide et digne.
- source_word: καλύπτει
  choice: couvre
  rationale: Ce choix conserve la métaphore grecque et son écho proverbial sans imposer une interprétation unique comme « pardonne », « dissimule » ou « passe sur ».
- source_word: πλῆθος ἁμαρτιῶν
  choice: une multitude de péchés
  rationale: La formulation préserve le sens collectif et la force rhétorique du grec.
theological_decisions:
- issue: Sens de « l’amour couvre une multitude de péchés »
  choice: Conserver la métaphore « couvre » sans préciser à qui appartiennent les péchés ni le mécanisme de cette couverture.
  alternative: « L’amour passe sur beaucoup d’offenses » ou « l’amour procure le pardon de nombreux péchés ».
  rationale: La formule, qui fait écho à un proverbe, demeure ouverte dans le grec. La traduction retenue évite d’introduire une lecture méritoire, sacramentelle ou purement psychologique que le texte n’explicite pas.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « ayez » rend la valeur exhortative du participe grec, tandis que « amour ardent » conserve son intensité sans alourdir la phrase.
