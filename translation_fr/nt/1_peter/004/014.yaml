  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : le présent passif (« êtes insultés »), la relation au nom/titre du Messie, la déclaration de béatitude, et l’affirmation que l’Esprit « repose sur vous ». « À cause du nom du Messie » exprime de manière juste, dans ce contexte, l’association qui motive l’outrage, sans transformer « au nom de » en mandat d’autorité.'
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Vous êtes heureux » correspond à l’usage français établi pour μακάριοι dans les béatitudes et ne se réduit pas nécessairement à une émotion passagère dans ce cadre. La formulation un peu dense « l’Esprit de gloire et de Dieu » est volontaire et demeure intelligible.
  terminology: « Messie » rend adéquatement Χριστός comme titre. « Esprit », « gloire » et « repose sur vous » sont cohérents avec le vocabulaire biblique français. Les notes conservent les possibilités de lecture sans imposer une interprétation doctrinale.
