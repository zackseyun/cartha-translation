id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: fr
  text: Si vous êtes insultés à cause du nom du Messie[a], vous êtes heureux, car l’Esprit de gloire et de Dieu[b] repose sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « Christ », titre qui signifie « Messie » ou « Oint ».
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « l’Esprit glorieux de Dieu » ou « l’Esprit de gloire, c’est-à-dire l’Esprit de Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: êtes insultés
  rationale: Le présent passif désigne le fait de subir des insultes ou des outrages. « Êtes insultés » est naturel en français moderne et conserve la dimension de déshonneur public.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: à cause du nom du Messie
  rationale: Dans ce contexte de persécution, l’expression indique que les croyants sont insultés en raison de leur association avec le Messie. « À cause du nom » évite que « au nom de » soit compris comme l’exercice d’une autorité, tout en conservant la mention explicite du nom.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός garde ici sa valeur de titre. « Messie » rend ce titre de manière intelligible et évite de le traiter comme un simple nom propre.
- source_word: μακάριοι
  choice: heureux
  rationale: « Heureux » est la formulation française consacrée des déclarations de type béatitude et exprime une condition favorable accordée par Dieu, non un simple sentiment passager.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: l’Esprit de gloire et de Dieu
  rationale: Cette formulation volontairement serrée conserve les deux génitifs grecs sans décider s’ils sont coordonnés ou si « de Dieu » explique « de gloire ».
- source_word: ἀναπαύεται
  choice: repose sur
  rationale: Le verbe évoque le fait de se poser et de demeurer sur quelqu’un, avec un écho au langage biblique concernant l’Esprit qui repose sur une personne.
theological_decisions:
- issue: Interprétation de τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: l’Esprit de gloire et de Dieu
  alternative: 'l’Esprit glorieux de Dieu ; ou : l’Esprit de gloire, c’est-à-dire l’Esprit de Dieu'
  rationale: La syntaxe grecque permet de comprendre les deux génitifs comme des qualifications coordonnées ou le second comme une explicitation du premier. Le texte principal conserve cette tension, tandis que la note présente les principales lectures.
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme grec est un titre signifiant « oint ». Dans ce contexte, « Messie » fait entendre sa valeur titulaire sans ajouter une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste proche de la structure grecque, mais « à cause du nom » explicite naturellement le rapport causal propre au contexte. La formulation inhabituelle « l’Esprit de gloire et de Dieu » est maintenue afin de ne pas effacer l’ambiguïté syntaxique de l’original.
