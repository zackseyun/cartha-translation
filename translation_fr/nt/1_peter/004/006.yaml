id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: fr
  text: 'C’est en effet pour cela que la bonne nouvelle a aussi été annoncée aux morts : afin que, bien que jugés selon les humains dans la chair, ils vivent selon Dieu dans l’esprit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit ». L’expression peut désigner la sphère de la vie spirituelle, par contraste avec « dans la chair »; certains la comprennent plus précisément comme une vie par l’Esprit de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: C’est en effet pour cela
  rationale: Expression française naturelle qui conserve la valeur explicative de εἰς τοῦτο avec γάρ et son lien au contexte précédent.
- source_word: νεκροῖς
  choice: aux morts
  rationale: Adjectif substantivé au datif pluriel, rendu directement sans préciser l’identité ni la condition des morts.
- source_word: εὐηγγελίσθη
  choice: la bonne nouvelle a aussi été annoncée
  rationale: Le passif de εὐαγγελίζω est conservé; « bonne nouvelle » exprime clairement le contenu évangélique sans recourir au registre plus ecclésiastique de « prêcher ».
- source_word: ἵνα
  choice: afin que
  rationale: Rend explicitement la valeur finale de la conjonction.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: bien que jugés ... ils vivent
  rationale: La tournure concessive rend naturellement en français l’opposition μὲν...δὲ dans la proposition finale, tout en conservant le passif de κριθῶσι.
- source_word: κατὰ ἀνθρώπους
  choice: selon les humains
  rationale: κατά avec l’accusatif indique ici une norme ou une perspective. « Les humains » garde l’opposition anthropologique avec Dieu tout en ayant une portée représentative inclusive.
- source_word: σαρκὶ
  choice: dans la chair
  rationale: Conserve le terme concret et son parallélisme avec πνεύματι, sans introduire l’idée de « nature pécheresse ».
- source_word: κατὰ θεὸν
  choice: selon Dieu
  rationale: Rendu parallèle à « selon les humains », afin de préserver l’antithèse volontaire du grec sans en préciser abusivement le sens.
- source_word: πνεύματι
  choice: dans l’esprit
  rationale: Le datif est compris comme indiquant la sphère de vie, en parallèle avec « dans la chair ». La minuscule évite d’identifier explicitement le référent au Saint-Esprit là où le grec reste ambigu.
theological_decisions:
- issue: Identité des « morts »
  choice: Maintenir simplement « aux morts » sans préciser quand ni dans quel sens ils sont morts.
  alternative: Ceux qui sont maintenant morts mais ont entendu l’Évangile de leur vivant; les morts spirituels; ou les morts associés à la proclamation de 1 Pierre 3.19.
  rationale: Le grec ne tranche pas explicitement entre ces lectures. La formulation française préserve donc l’ambiguïté et n’impose aucune reconstruction doctrinale.
- issue: Sens de l’opposition « jugés selon les humains dans la chair / vivent selon Dieu dans l’esprit »
  choice: Conserver l’antithèse et sa formulation relativement littérale.
  alternative: Comprendre un jugement humain pendant la vie corporelle, la mort physique commune aux humains, ou un jugement divin subi dans la sphère charnelle.
  rationale: Le texte permet plusieurs interprétations apparentées. La traduction ne précise ni l’agent du jugement ni la nature exacte de la vie selon Dieu.
- issue: Référent de πνεύματι
  choice: « dans l’esprit », avec une minuscule.
  alternative: « par l’Esprit », en référence explicite au Saint-Esprit.
  rationale: La construction parallèle à σαρκί favorise une lecture de sphère ou de mode d’existence, mais l’identification au Saint-Esprit reste possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste serré du grec. « Les humains » évite que le masculin « les hommes » soit compris comme désignant uniquement les personnes de sexe masculin; aucune note n’est requise puisque cette formulation exprime directement la valeur représentative de ἀνθρώπους.
