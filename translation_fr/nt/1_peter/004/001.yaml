  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: fr
  text: Ainsi donc, puisque le Messie[a] a souffert dans la chair[b], armez-vous, vous aussi, de la même disposition d’esprit, car celui qui a souffert dans la chair en a fini avec le péché[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le Christ » (grec Christos). Ici, le mot est rendu comme un titre : « le Messie ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « dans la chair » traduit littéralement le grec sarx et renvoie ici à l’existence humaine corporelle, non nécessairement à une « nature pécheresse ».
    reason: lexical_alternative
  - marker: c
    text: La proposition « celui qui a souffert dans la chair en a fini avec le péché » est discutée. Elle peut viser particulièrement le Messie, les croyants qui suivent son modèle, ou énoncer un principe général de rupture décisive avec le péché.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Le titre « Messie » rend le sens actif de Χριστός; le génitif avec le participe est exprimé naturellement par « puisque le Messie a souffert ».
- source_word: οὖν
  choice: Ainsi donc
  rationale: Cette expression marque l’inférence tirée du contexte précédent dans un français actuel et soutenu.
- source_word: παθόντος
  choice: a souffert
  rationale: L’aoriste participial est rendu par une proposition causale fluide, sans perdre sa valeur temporelle et logique.
- source_word: σαρκὶ
  choice: dans la chair
  rationale: La formulation littérale préserve la répétition grecque et désigne ici l’existence humaine corporelle, sans introduire l’idée de « nature pécheresse ».
- source_word: ἔννοιαν
  choice: disposition d’esprit
  rationale: Ce choix exprime une attitude mentale, une manière de penser ou une résolution, tout en s’accordant naturellement avec la métaphore « armez-vous ».
- source_word: ὁπλίσασθε
  choice: armez-vous
  rationale: L’impératif moyen conserve la force réflexive et la vive métaphore militaire.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit avec dignité le motif de l’exhortation sans surdéterminer la relation logique.
- source_word: ὁ παθὼν
  choice: celui qui a souffert
  rationale: Le participe substantivé demeure général et ne fixe pas explicitement son référent.
- source_word: πέπαυται ἁμαρτίας
  choice: en a fini avec le péché
  rationale: Cette expression française traduit l’état résultant exprimé par le parfait et la séparation d’avec le péché, avec davantage de naturel que « a cessé du péché ».
theological_decisions:
- issue: Référent et portée de « celui qui a souffert dans la chair en a fini avec le péché »
  choice: La formulation demeure générale et ne précise pas si elle vise exclusivement le Messie, les croyants qui suivent son modèle, ou un principe général de rupture décisive avec le péché.
  alternative: Comprendre la proposition soit du Messie et de son rapport achevé au péché, soit des croyants dont la souffrance accompagne la rupture avec sa domination, soit comme une maxime générale.
  rationale: Le grec est dense et son interprétation disputée. La traduction préserve cette tension sans ajouter une précision absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore militaire et la répétition de « dans la chair » sont conservées; le tour participial grec est restructuré pour la fluidité.
