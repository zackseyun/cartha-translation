source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: fr
  text: Et si le juste est sauvé à grand-peine[a], où paraîtront l’impie et le pécheur[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est sauvé avec difficulté » ou « n’est sauvé qu’à grand-peine ». Dans le contexte, l’expression souligne les dures épreuves que traverse le juste, sans affirmer que son salut serait en lui-même incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « où seront trouvés l’impie et le pécheur ? »
    reason: translation_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: le juste
  rationale: Adjectif substantivé au singulier, employé de manière représentative. « Le juste » conserve la forme proverbiale concise et reste naturel en français biblique moderne.
- source_word: μόλις
  choice: à grand-peine
  rationale: Le terme exprime la difficulté ou le fait de ne passer qu’avec peine. « À grand-peine » préserve cette tension sans suggérer explicitement que l’issue du salut serait incertaine.
- source_word: σῴζεται
  choice: est sauvé
  rationale: Le présent passif est rendu naturellement dans cette maxime par « est sauvé ». La formulation laisse au contexte le soin d’éclairer le rapport entre salut, épreuve et jugement.
- source_word: ἀσεβής
  choice: l’impie
  rationale: « L’impie » rend la dimension morale et religieuse de celui qui vit sans respect pour Dieu, tout en conservant la distinction avec « le pécheur ».
- source_word: ἁμαρτωλός
  choice: le pécheur
  rationale: Équivalent courant et précis, maintenu séparément de ἀσεβής puisque le grec coordonne deux désignations.
- source_word: ποῦ
  choice: où
  rationale: Rend directement l’adverbe interrogatif et conserve la force de la question rhétorique.
- source_word: φανεῖται
  choice: paraîtront
  rationale: Le verbe peut signifier « apparaître » ou « se montrer ». Le pluriel français est exigé par le sujet coordonné « l’impie et le pécheur », bien que la forme grecque soit au singulier.
theological_decisions:
- issue: Portée de μόλις σῴζεται
  choice: La formulation évoque la difficulté et la sévérité qui accompagnent le salut du juste dans le contexte de l’épreuve et du jugement.
  alternative: Comprendre que le salut final du juste serait à peine obtenu et resterait incertain.
  rationale: Le contexte immédiat traite de la souffrance, du jugement commençant par la maison de Dieu et de la persévérance. La traduction conserve la tension du grec sans trancher en faveur d’une doctrine d’incertitude du salut.
- issue: Singulier représentatif de ὁ δίκαιος
  choice: le juste
  alternative: la personne juste ; les justes
  rationale: Le grec emploie un singulier masculin représentatif. « Le juste » en maintient la forme proverbiale sans développer le texte.
- issue: Accord de φανεῖται avec deux désignations coordonnées
  choice: où paraîtront l’impie et le pécheur
  alternative: où paraîtra l’impie et pécheur
  rationale: La forme verbale grecque est singulière, mais un calque serait fautif ou obscur en français. Le pluriel respecte la syntaxe française tout en gardant distinctes les deux désignations.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « à grand-peine » garde la concision proverbiale et la tension du grec. Les articles répétés dans « l’impie et le pécheur » reflètent les deux désignations distinctes du texte source.
