id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: fr
  text: Que chacun mette le don qu’il a reçu au service des autres[a], comme un bon intendant de la grâce multiple de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi vous », « les uns pour les autres » ou « les uns envers les autres ».
    reason: La construction grecque εἰς ἑαυτούς peut présenter la communauté comme la sphère ou comme la bénéficiaire du service, sans en préciser davantage la direction.
lexical_decisions:
- source_word: ἕκαστος
  choice: chacun
  rationale: Rend naturellement en français la valeur distributive du singulier et souligne la responsabilité individuelle de chaque membre.
- source_word: καθὼς ἔλαβεν χάρισμα
  choice: le don qu’il a reçu
  rationale: La relative est idiomatique en français. « Don » conserve l’étendue de χάρισμα sans imposer le sens technique plus étroit de « don spirituel ».
- source_word: εἰς ἑαυτοὺς αὐτὸ διακονοῦντες
  choice: mette le don… au service des autres
  rationale: Cette formulation naturelle restitue la force exhortative du participe et la communauté comme bénéficiaire du service. « Les autres » exprime ici les autres membres de la communauté.
- source_word: ὡς καλοὶ οἰκονόμοι
  choice: comme un bon intendant
  rationale: L’accord au singulier avec « chacun » est naturel en français. « Intendant » conserve les idées de gestion d’un bien confié et de responsabilité envers son propriétaire.
- source_word: ποικίλης χάριτος θεοῦ
  choice: des diverses manifestations de la grâce de Dieu
  rationale: ποικίλης qualifie la grâce comme multiple ou variée dans ses expressions. L’explicitation « manifestations » évite l’expression peu naturelle « grâce diverse » tout en reliant cette diversité aux dons reçus.
theological_decisions:
- issue: Portée de χάρισμα
  choice: don
  alternative: don spirituel / don de grâce
  rationale: Le contexte concerne un don accordé par la grâce en vue du service communautaire, mais le nom grec n’exige pas la formule technique « don spirituel ».
- issue: Force communautaire de εἰς ἑαυτούς
  choice: au service des autres
  alternative: entre vous / les uns pour les autres / les uns envers les autres
  rationale: Le réflexif pluriel désigne les membres de la communauté comme sphère ou bénéficiaires du service. La note conserve les autres nuances possibles sans réduire la construction à une seule relation précise.
- issue: Sens de ποικίλης appliqué à la grâce de Dieu
  choice: diverses manifestations de la grâce de Dieu
  alternative: grâce multiple de Dieu / grâce variée de Dieu
  rationale: La traduction choisie fait porter la diversité sur les formes concrètes sous lesquelles la grâce se déploie, notamment les dons, sans suggérer plusieurs grâces indépendantes.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’exhortation adressée à chacun, évite le jargon ecclésiastique de « ministère » et garde l’image de l’intendant responsable d’un bien confié.
