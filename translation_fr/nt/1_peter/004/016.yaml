source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: fr
  text: Mais si quelqu’un souffre comme chrétien, qu’il n’en ait pas honte ; mais qu’il glorifie Dieu à cause de ce nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ce nom ». Ou : « sous ce nom », « en portant ce nom » ou « dans cette situation ». L’expression renvoie probablement au nom « chrétien ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: Mais si quelqu’un souffre comme chrétien
  rationale: Le verbe « souffrir » est sous-entendu à partir du verset 15 et doit être rétabli en français pour former une proposition naturelle. « Chrétien » est la désignation lexicalisée correspondant à Χριστιανός.
- source_word: μὴ αἰσχυνέσθω
  choice: qu’il n’en ait pas honte
  rationale: Cette formulation conserve la force exhortative de l’impératif grec à la troisième personne ; « en » renvoie naturellement au fait de souffrir comme chrétien.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: qu’il glorifie plutôt Dieu
  rationale: « Glorifier Dieu » rend directement δοξάζω dans ce contexte. « Plutôt » exprime clairement l’opposition marquée par δέ entre avoir honte et glorifier Dieu.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: pour ce nom
  rationale: La préposition « pour » donne en français naturel une valeur causale possible de ἐν tout en maintenant explicitement le lien avec le « nom » de chrétien. L’ambiguïté de la locution est signalée en note.
theological_decisions:
- issue: Référence et valeur de ἐν τῷ ὀνόματι τούτῳ
  choice: « pour ce nom », compris comme le nom ou la désignation « chrétien »
  alternative: « sous ce nom », « en portant ce nom » ou « dans cette situation »
  rationale: Χριστιανός est l’antécédent immédiat, et ὄνομα désigne naturellement un nom. La traduction conserve cette référence sans trancher entièrement entre les nuances de sphère, de condition et de cause, présentées dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le sujet indéfini « quelqu’un » explicite la construction française, tandis que « souffre » reprend le contexte immédiat. La formulation évite le calque peu naturel « dans ce nom » tout en en conservant l’ambiguïté dans la note.
