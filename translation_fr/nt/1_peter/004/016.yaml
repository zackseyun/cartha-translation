review_pass:
  verdict: revise
  source_fidelity: Le rétablissement de « souffre » est justifié par l’ellipse évidente et immédiate du v. 15. « Chrétien » rend exactement la désignation lexicalisée Χριστιανός. En revanche, « plutôt » renforce δέ comme s’il imposait une substitution, et « pour ce nom » est moins idiomatique et moins précis que la formulation causale usuelle pour ἐν τῷ ὀνόματι τούτῳ dans ce contexte.
  naturalness: La phrase est globalement claire et de registre moderne. « À cause de ce nom » est plus naturel que « pour ce nom » et maintient explicitement le lien avec le nom « chrétien ». « Mais » rend sobrement le second δέ.
  terminology: « Chrétien », « honte » et « glorifie Dieu » sont exacts, naturels et adaptés au registre biblique moderne. La note doit conserver le sens littéral « dans ce nom » ainsi que les possibilités contextuelles, sans présenter une interprétation comme certaine.
  issues:
  - severity: low
    issue: « plutôt » pour δέ
    rationale: Le grec oppose les deux impératifs avec δέ, mais « plutôt » peut suggérer plus fortement qu’il faudrait glorifier Dieu à la place de ne pas avoir honte. « Mais » reproduit la coordination contrastive sans ajouter cette nuance.
  - severity: medium
    issue: « pour ce nom »
    rationale: Cette tournure est moins naturelle ici en français et exprime de manière imprécise le rapport au nom. « À cause de ce nom » rend naturellement la lecture causale tout en gardant « nom » dans le texte; la note préserve la littéralité et les autres nuances.
  revised_text: Mais si quelqu’un souffre comme chrétien, qu’il n’en ait pas honte ; mais qu’il glorifie Dieu à cause de ce nom[a].
