id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: fr
  text: Si quelqu’un parle, qu’il le fasse comme s’il transmettait les paroles de Dieu[a] ; si quelqu’un sert, qu’il le fasse grâce à la force que Dieu fournit[b], afin qu’en toutes choses Dieu soit glorifié par Jésus le Messie, à qui appartiennent la gloire et la puissance pour toujours et à jamais[c][d]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des déclarations divines » ou « comme les oracles de Dieu ». Le grec λόγια désigne des paroles ou déclarations venant de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « comme à partir de la force que Dieu fournit ».'
    reason: lexical_alternative
  - marker: c
    text: Le pronom « à qui » renvoie le plus naturellement à Jésus le Messie, son antécédent le plus proche ; certains comprennent toutefois que cette doxologie se rapporte à Dieu le Père, mentionné juste avant.
    reason: alternative_reading
  - marker: d
    text: 'Littéralement : « pour les siècles des siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: parle
  rationale: Le verbe garde ici son sens général et ne doit pas être limité à la prédication ou à une fonction officielle.
- source_word: λόγια θεοῦ
  choice: les paroles de Dieu
  rationale: « Paroles » est clair en français moderne, tandis que la note signale le sens plus technique de déclarations ou oracles divins. Le génitif « de Dieu » est conservé sans affirmer que toute prise de parole serait directement inspirée.
- source_word: διακονεῖ
  choice: sert
  rationale: Le terme désigne largement le fait de rendre service ou d’exercer un ministère, sans nécessairement viser une charge ecclésiale.
- source_word: ἐξ ἰσχύος
  choice: en puisant dans la force
  rationale: 'Cette formulation française naturelle maintient l’idée de source exprimée par ἐξ : la force vient de Dieu, plutôt que d’accompagner seulement le service.'
- source_word: ἧς χορηγεῖ ὁ θεός
  choice: que Dieu fournit
  rationale: « Fournit » rend simplement l’action de pourvoir aux ressources nécessaires, sans expliciter excessivement la nuance possible d’abondance.
- source_word: ἐν πᾶσιν
  choice: en toutes choses
  rationale: Cette tournure française digne et courante conserve la portée générale de l’expression.
- source_word: δοξάζηται
  choice: soit glorifié
  rationale: Le subjonctif passif après ἵνα est conservé dans une proposition finale introduite par « afin que ».
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: « Par » exprime ici la médiation ; Χριστός est rendu comme le titre « le Messie » conformément à sa valeur dans ce contexte.
- source_word: κράτος
  choice: puissance souveraine
  rationale: Dans cette doxologie, le mot évoque une puissance effective et dominatrice. « Puissance souveraine » exprime cette nuance plus naturellement que le rare « domination » appliqué à une personne.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette expression idiomatique rend la durée sans fin tout en conservant la solennité de la formule grecque.
theological_decisions:
- issue: Référent de ᾧ dans la doxologie finale
  choice: « à qui » renvoie dans le texte à Jésus le Messie, son antécédent grammatical le plus proche
  alternative: La doxologie peut être comprise comme se rapportant à Dieu le Père, sujet de la proposition précédente, ou comme une formulation condensée associant la gloire de Dieu à sa médiation par Jésus.
  rationale: La proximité syntaxique favorise Jésus le Messie, mais le mouvement de la proposition précédente permet l’autre compréhension ; la note préserve donc cette ambiguïté réelle sans la trancher doctrinalement.
- issue: Valeur de ὡς dans les deux propositions
  choice: Rendre l’ellipse par « qu’il le fasse comme en transmettant » puis « qu’il le fasse en puisant »
  alternative: 'Traduction plus formelle et elliptique : « Si quelqu’un parle, comme les paroles de Dieu ; si quelqu’un sert, comme par la force… »'
  rationale: Le grec sous-entend une exhortation. Le français exige de compléter légèrement la construction ; la formulation retenue évite de faire des paroles du locuteur les paroles mêmes de Dieu et conserve, dans la seconde proposition, l’idée de source.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux propositions parallèles sont explicitées sans les réduire à la prédication et au ministère officiel. « Jésus le Messie » conserve Χριστός comme titre. La ponctuation maintient le mouvement exhortation–finalité–doxologie du grec.
