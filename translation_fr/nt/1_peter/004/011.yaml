  to: Si quelqu’un parle, qu’il le fasse comme s’il transmettait les paroles de Dieu[a] ; si quelqu’un sert, qu’il le fasse grâce à la force que Dieu fournit[b], afin qu’en toutes choses Dieu soit glorifié par Jésus le Messie, à qui appartiennent la gloire et la puissance pour toujours et à jamais[c][d]. Amen.
  rationale: La révision remplace une tournure française maladroite par une formulation idiomatique qui rend l’ellipse exhortative de ὡς sans affirmer que toute parole humaine est directement parole divine. Elle emploie aussi « puissance », équivalent sobre et suffisamment large de κράτος. Les notes lexicales et l’ambiguïté du référent de la doxologie sont conservées.
