  text: Be hospitable to one another without grumbling[a].
translation:
  language: fr
  text: Soyez hospitaliers les uns envers les autres, sans vous plaindre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Faites preuve d’hospitalité les uns envers les autres, sans murmurer. »'
    reason: 'Variante lexicale : « Faites preuve d’hospitalité » explicite la valeur exhortative de l’adjectif grec; « murmurer » souligne la nuance de plainte mécontente.'
lexical_decisions:
- source_word: φιλόξενοι
  choice: Soyez accueillants
  rationale: L’adjectif a ici une valeur exhortative; l’ajout de « Soyez » restitue naturellement cette force en français. « Accueillants » exprime l’hospitalité de manière actuelle et accessible.
- source_word: εἰς ἀλλήλους
  choice: les uns envers les autres
  rationale: Cette expression rend clairement la réciprocité et l’orientation mutuelle au sein de la communauté.
- source_word: ἄνευ
  choice: sans
  rationale: Équivalent prépositionnel direct indiquant l’absence.
- source_word: γογγυσμοῦ
  choice: vous plaindre
  rationale: Dans la tournure « sans vous plaindre », le verbe pronominal rend naturellement en français l’idée de plainte mécontente portée par le nom grec. « Murmurer » serait plus traditionnel, mais peut évoquer à tort une parole à voix basse.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’impératif fourni par le contexte est explicité par « Soyez ». Le pluriel masculin « accueillants » fonctionne comme forme générique pour l’ensemble de la communauté.
