source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: fr
  text: Car le moment est venu pour que le jugement commence par la maison de Dieu[a]. Et s’il commence d’abord par nous, quelle sera la fin[b] de ceux qui n’obéissent pas[c] à l’Évangile de Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la famille de Dieu » ou « la maisonnée de Dieu ». Le mot grec peut désigner soit une maison, soit les personnes qui la composent; ici, il renvoie vraisemblablement au peuple de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « quelle sera l’issue ». Le mot grec peut désigner la fin, l’issue ou le résultat.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui refusent de croire ». Le verbe grec peut exprimer à la fois la désobéissance et le refus de croire en réponse à l’Évangile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici la raison de l’exhortation précédente. « Car » exprime clairement ce lien causal dans un registre digne et naturel.
- source_word: ὁ καιρός
  choice: le moment est venu
  rationale: καιρός désigne un moment opportun ou fixé, et non simplement le temps chronologique. La tournure française exprime naturellement que ce moment est désormais arrivé.
- source_word: τοῦ ἄρξασθαι
  choice: où … doit commencer
  rationale: L’infinitif articulé complète καιρός. Cette formulation idiomatique restitue l’idée que le moment est venu pour que le jugement commence, sans rendre la phrase pesante.
- source_word: τὸ κρίμα
  choice: le jugement
  rationale: « Jugement » conserve la portée judiciaire du terme sans préciser indûment s’il s’agit de condamnation ou de discipline.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: par la famille de Dieu
  rationale: οἶκος peut désigner une maison ou les personnes qui la composent. Ici, « par nous » montre que la communauté croyante est visée; « famille de Dieu » l’exprime clairement, tandis que la note conserve l’image plus littérale de la maison.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: Et s’il commence d’abord par nous
  rationale: Le verbe « commence » est repris implicitement de la proposition précédente et explicité en français. « Par nous » conserve la répétition de ἀπό et rattache les croyants à la famille de Dieu.
- source_word: τέλος
  choice: fin
  rationale: « Fin » garde la formulation ouverte du grec, qui peut évoquer à la fois l’issue, le résultat et la destinée finale.
- source_word: ἀπειθούντων
  choice: ceux qui n’obéissent pas
  rationale: Le participe exprime la désobéissance, tout en pouvant inclure le refus de croire lorsqu’il a pour objet l’Évangile. La traduction principale préserve sa force verbale et la note signale l’autre nuance.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: à l’Évangile de Dieu
  rationale: Le datif dépend de ἀπειθέω. « L’Évangile de Dieu » est une formulation française établie qui conserve le lien avec Dieu comme source ou possesseur de la bonne nouvelle.
theological_decisions:
- issue: Nature du jugement à l’égard du peuple de Dieu
  choice: « jugement », sans le définir comme condamnation ou discipline
  alternative: « condamnation » ou « discipline »
  rationale: Le texte affirme que le jugement commence par le peuple de Dieu, puis oppose à cela la fin de ceux qui n’obéissent pas à l’Évangile. « Jugement » maintient cette tension, là où « condamnation » serait trop étroit et « discipline » atténuerait la gravité judiciaire.
- issue: Référent de « la maison de Dieu »
  choice: La communauté du peuple de Dieu, rendue par « la famille de Dieu »
  alternative: Un édifice ou le temple de Dieu
  rationale: La reprise « par nous » identifie le référent à des personnes. Le contexte de 1 Pierre présente aussi les croyants comme une maison spirituelle; la traduction communautaire est donc privilégiée sans supprimer l’image littérale, conservée en note.
- issue: Rapport entre désobéissance et incrédulité
  choice: « ceux qui n’obéissent pas », avec l’autre nuance en note
  alternative: « ceux qui refusent de croire »
  rationale: Le verbe grec peut associer refus de croire et désobéissance face à l’Évangile. Le texte principal conserve son sens direct sans réduire la réponse en cause à sa seule dimension intellectuelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement argumentatif grec tout en évitant un calque lourd. « Famille de Dieu » rend immédiatement le sens communautaire; la métaphore littérale est préservée en note. Les termes théologiquement chargés « jugement » et « Évangile » sont maintenus sans explicitation doctrinale.
