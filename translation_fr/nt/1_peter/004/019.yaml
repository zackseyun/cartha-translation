id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: fr
  text: Ainsi donc, que ceux qui souffrent conformément à la volonté de Dieu confient eux aussi leur vie[a] à un Créateur fidèle, tout en faisant le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur âme » ou « eux-mêmes » ; le mot grec peut désigner l’âme, la vie ou la personne elle-même.
    reason: Alternative lexicale
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit la conclusion qui découle de l’argument précédent et en conserve la force logique dans un français naturel.
- source_word: οἱ πάσχοντες
  choice: ceux qui souffrent
  rationale: Rend naturellement le participe présent substantivé, qui désigne de manière générale les personnes en situation de souffrance.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: conformément à la volonté de Dieu
  rationale: Exprime l’accord avec la volonté divine sans préciser si la souffrance est permise, décrétée ou approuvée par Dieu.
- source_word: πιστῷ κτίστῃ
  choice: à un Créateur fidèle
  rationale: « Fidèle » conserve l’idée de fiabilité portée par πιστός, et l’article indéfini reflète naturellement l’expression grecque sans article tout en renvoyant clairement à Dieu.
- source_word: παρατιθέσθωσαν
  choice: confient
  rationale: Le moyen impératif évoque le fait de remettre quelque chose à la garde sûre d’un autre; « confier » est courant et précis.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: leur vie
  rationale: Dans ce contexte de souffrance et de remise confiante à Dieu, ψυχή peut désigner la vie ou la personne elle-même. Le singulier distributif français est idiomatique; les autres valeurs sont signalées en note.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: tout en faisant le bien
  rationale: Rend la manière ou la circonstance concomitante de cette remise à Dieu, avec l’idée d’une conduite active et continue.
theological_decisions:
- issue: Rapport entre la souffrance et la volonté de Dieu
  choice: conformément à la volonté de Dieu
  alternative: par la volonté de Dieu
  rationale: Le grec affirme une conformité à la volonté divine sans exposer les mécanismes de la permission ou de la détermination de Dieu; la formulation choisie préserve cette tension.
- issue: Sens de ψυχή dans le contexte
  choice: leur vie
  alternative: leur âme; eux-mêmes
  rationale: Le mot grec peut désigner l’âme, la vie ou la personne. « Leur vie » convient au contexte sans imposer une anthropologie dualiste; une note conserve l’étendue sémantique du terme.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi donc » marque clairement l’inférence; « tout en faisant le bien » évite une tournure nominale lourde et conserve le lien entre la confiance en Dieu et la conduite.
