  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: fr
  text: Ils rendront compte à celui qui est prêt à juger les vivants et les morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ
  choice: Ils
  rationale: Le pronom relatif renvoie aux personnes mentionnées au verset précédent. En français, « Ils » forme une phrase autonome naturelle tout en gardant ce référent.
- source_word: ἀποδώσουσιν λόγον
  choice: rendront compte
  rationale: Cette expression idiomatique signifie devoir répondre de ses actes. « Rendre compte » conserve clairement la nuance judiciaire en français courant.
- source_word: τῷ
  choice: à celui qui
  rationale: L’article associé au participe a une fonction substantivale. « À celui qui » reproduit cette désignation sans identifier explicitement le juge au-delà du grec.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: est prêt à juger
  rationale: La tournure grecque exprime la disponibilité ou la préparation immédiate à juger. « Est prêt à juger » est naturel et fidèle, sans introduire l’image supplémentaire suggérée par « se tient prêt ».
- source_word: ζῶντας καὶ νεκρούς
  choice: les vivants et les morts
  rationale: Cette formulation concise et traditionnelle rend exactement les objets de « juger » et conserve la portée universelle de l’expression.
theological_decisions:
- issue: Identité de celui qui est prêt à juger les vivants et les morts
  choice: La traduction garde « celui qui » sans nommer explicitement Dieu ou le Christ.
  alternative: Dieu ; le Christ
  rationale: Le grec ne nomme pas le juge dans ce verset. Le désigner davantage résoudrait une question que le texte laisse ici implicite.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation est concise, idiomatique et conserve la nuance judiciaire ainsi que l’implicite théologique du grec.
