id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: fr
  text: Bien-aimés[a], ne vous étonnez pas de l’épreuve ardente qui a lieu parmi vous pour vous mettre à l’épreuve, comme s’il vous arrivait quelque chose d’étrange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la fournaise parmi vous … pour une mise à l’épreuve ». Le grec πύρωσις évoque littéralement le feu ou la combustion, et πειρασμός peut signifier « mise à l’épreuve », « épreuve » ou, dans d’autres contextes, « tentation ».'
    reason: Conserve l’image littérale du feu et signale la gamme sémantique de πειρασμός, tout en justifiant le sens contextuel de mise à l’épreuve.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une affection pastorale et conserve le lien lexical avec l’amour. « Bien-aimés » est digne, compréhensible et traditionnel sans être propre à une confession.
- source_word: μὴ ξενίζεσθε
  choice: ne soyez pas surpris
  rationale: Le verbe peut signifier être surpris ou trouver étrange. Cette formulation est naturelle en français moderne, tandis que la reprise de l’idée d’étrangeté à la fin préserve le jeu sémantique avec ξένου.
- source_word: τῇ ... πυρώσει
  choice: de la fournaise
  rationale: πύρωσις évoque littéralement une combustion ou un feu intense, puis métaphoriquement une épreuve sévère. « Fournaise » maintient fortement l’image du feu sans ajouter explicitement l’idée de purification.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans cette adresse communautaire, l’expression désigne naturellement ce qui se produit au milieu des destinataires, sans exclure leur expérience individuelle.
- source_word: πρὸς πειρασμὸν ὑμῖν
  choice: pour vous mettre à l’épreuve
  rationale: Dans le contexte de souffrance, πειρασμός désigne ici la mise à l’épreuve plutôt que l’incitation au mal. La tournure verbale explicite naturellement en français la relation de but ou de fonction portée par πρός.
- source_word: γινομένῃ
  choice: qui sévit
  rationale: Le participe présent qualifie la fournaise comme une réalité en cours. « Sévit » convient idiomatiquement à une épreuve collective intense et évite la lourdeur de « qui est en train de se produire ».
- source_word: ὡς ξένου
  choice: comme ... quelque chose d’étrange
  rationale: La formulation garde l’idée de ce qui est étranger, insolite ou inattendu, ainsi que son écho avec ξενίζεσθε.
- source_word: συμβαίνοντος
  choice: s’il vous arrivait
  rationale: Le participe décrit ce qui survient aux destinataires. « Arriver à quelqu’un » est l’équivalent français courant et convient à la comparaison irréelle introduite par ὡς.
theological_decisions:
- issue: Sens de πειρασμός dans le contexte
  choice: mise à l’épreuve
  alternative: tentation
  rationale: Le contexte immédiat concerne des souffrances subies qui éprouvent les croyants, non une incitation intérieure à pécher. « Mettre à l’épreuve » rend donc le sens contextuel dominant sans préciser qui en est l’agent.
- issue: Portée de la métaphore du feu
  choice: conserver l’image de la fournaise sans expliciter une purification
  alternative: épreuve purificatrice / feu qui vous purifie
  rationale: Le texte évoque le feu et la mise à l’épreuve, mais ne formule pas ici explicitement le résultat comme une purification. La traduction préserve cette tension sans ajouter une interprétation théologique.
translation_notes:
  register: Français international moderne, pastoral et digne. La phrase reste directe et accessible. « Fournaise » conserve l’image vive du grec; « qui sévit parmi vous » communique une épreuve collective en cours. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
