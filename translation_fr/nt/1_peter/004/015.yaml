source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: fr
  text: Car qu’aucun de vous ne souffre comme meurtrier, voleur, malfaiteur ou comme quelqu’un qui se mêle des affaires d’autrui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui s’ingère dans ce qui ne le regarde pas ». Le mot grec, rare, signifie plus littéralement « quelqu’un qui surveille les affaires d’autrui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν πασχέτω
  choice: En effet, qu’aucun de vous n’ait à souffrir
  rationale: La tournure prohibitive est rendue naturellement en français tout en conservant γάρ comme lien explicatif. « Souffrir » demeure général, sans ajouter l’idée explicite de punition.
- source_word: ὡς φονεὺς
  choice: comme meurtrier
  rationale: Le terme désigne précisément une personne qui commet un meurtre; « meurtrier » conserve cette portée morale et juridique.
- source_word: κλέπτης
  choice: voleur
  rationale: Équivalent français courant et précis du terme grec, sans la nuance de violence que pourrait suggérer « brigand ».
- source_word: κακοποιός
  choice: malfaiteur
  rationale: « Malfaiteur » désigne une personne qui fait le mal et convient à cette liste de conduites répréhensibles, sans limiter le sens à une infraction particulière.
- source_word: ἀλλοτριεπίσκοπος
  choice: quelqu’un qui se mêle des affaires d’autrui
  rationale: Ce composé rare évoque littéralement celui qui surveille ce qui appartient à autrui; la formulation retenue exprime clairement l’ingérence blâmable en français moderne.
theological_decisions:
- issue: Sens de ἀλλοτριεπίσκοπος
  choice: quelqu’un qui se mêle des affaires d’autrui
  alternative: indiscret; celui qui s’ingère dans ce qui ne le regarde pas; surveillant des affaires d’autrui
  rationale: Le contexte énumère des comportements fautifs susceptibles d’entraîner une souffrance méritée. La traduction exprime donc l’ingérence dans les affaires d’autrui, sans introduire une fonction ecclésiale à partir de l’élément -ἐπίσκοπος. Une note signale la rareté du mot et sa formulation plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. La structure de la liste grecque est conservée; la dernière expression est explicitée juste assez pour rester intelligible, avec une note qui préserve l’incertitude lexicale du composé rare.
