id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: fr
  text: Car le temps déjà écoulé suffit pour avoir accompli la volonté des païens[a], en vivant dans les débauches, les convoitises, les excès de vin[b], les fêtes débridées, les beuveries et les idolâtries interdites[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des non-Juifs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les ivrogneries »; le pluriel grec peut évoquer des épisodes répétés d’excès alcoolique.
    reason: lexical_alternative
  - marker: c
    text: Ou « les idolâtries contraires à la loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: En effet, le temps écoulé suffit
  rationale: Cette formulation rend la valeur explicative de γάρ, le sens de suffisance de ἀρκετός et le caractère déjà passé du temps désigné par le participe.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: la volonté des non-Juifs
  rationale: βούλημα désigne ici ce que l’on veut ou se propose de faire. Dans ce contexte, ἔθνη vise les peuples non juifs, avec leur mode de vie religieux et moral antérieur.
- source_word: κατειργάσθαι
  choice: pour avoir accompli
  rationale: Le parfait infinitif présente cette conduite comme déjà réalisée; «accompli» conserve l’idée d’avoir effectivement mis en œuvre cette volonté.
- source_word: πεπορευμένους
  choice: quand vous viviez
  rationale: Le sens moral idiomatique de πορεύομαι est celui de vivre ou de se conduire. Le français naturel exige ici une proposition qui rattache clairement la conduite passée aux destinataires.
- source_word: ἐν ἀσελγείαις
  choice: dans la débauche
  rationale: ἀσέλγεια exprime une conduite sans retenue, souvent sexuelle. Le collectif français «débauche» rend naturellement le pluriel grec, qui peut évoquer des manifestations répétées.
- source_word: ἐπιθυμίαις
  choice: les convoitises
  rationale: Dans cette liste de vices, ἐπιθυμίαις désigne des désirs déréglés; «convoitises» garde leur portée générale et négative.
- source_word: οἰνοφλυγίαις
  choice: les excès de vin
  rationale: Ce nom rare évoque l’ivrognerie ou les épisodes d’excès alcoolique. Cette expression reste claire en français et garde la référence explicite au vin.
- source_word: κώμοις
  choice: les orgies
  rationale: κῶμος désigne des réjouissances tapageuses et dissolues, souvent liées à l’alcool. «Orgies» rend cette démesure sans se limiter nécessairement au sens sexuel moderne.
- source_word: πότοις
  choice: les beuveries
  rationale: πότος désigne des réunions ou épisodes consacrés à boire; «beuveries» les distingue nettement des excès de vin eux-mêmes.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: les idolâtries interdites
  rationale: ἀθέμιτος signifie contraire à ce qui est permis ou établi. «Interdites» conserve cette force normative, tandis que le pluriel rend la diversité des pratiques idolâtres.
theological_decisions:
- issue: Sens de ἐθνῶν
  choice: non-Juifs
  alternative: païens; nations
  rationale: «Non-Juifs» exprime précisément le contraste ethno-religieux du contexte sans faire de «païens» une qualification directement péjorative ni employer le trop général «nations».
- issue: Force morale de ἀθεμίτοις εἰδωλολατρίαις
  choice: idolâtries interdites
  alternative: idolâtries abominables; idolâtries contraires à la loi
  rationale: Le grec condamne ces pratiques comme illicites ou contraires à ce qui est permis. «Interdites» préserve cette portée objective sans ajouter une réaction affective absente du terme.
- issue: Lien syntaxique de πεπορευμένους
  choice: quand vous viviez
  alternative: vous étant conduits; après avoir marché
  rationale: Le participe accusatif se rapporte aux destinataires implicites de l’infinitif et décrit leur ancienne manière de vivre. La proposition temporelle française clarifie ce lien sans résoudre davantage la tension syntaxique de la phrase.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la logique serrée de l’original, mais remplace le calque peu naturel «ayant marché» par «quand vous viviez». Les termes de la liste sont différenciés afin de préserver les nuances entre débauche, désirs déréglés, excès alcooliques, réjouissances dissolues et réunions consacrées à boire.
