  naturalness: La construction « le temps écoulé suffit pour avoir accompli » est possible mais raide. « Le temps déjà écoulé suffit pour avoir accompli » demeure proche de la syntaxe grecque tout en étant plus idiomatique dans ce registre. « Païens » est plus naturel en français courant que « non-Juifs » dans cette opposition contextuelle; une note conserve l’autre possibilité.
  terminology: « Convoitises », « excès de vin », « beuveries » et « idolâtries interdites » sont appropriés. « Païens » désigne ici les ἔθνη dans leur cadre religieux et moral, sans prétendre traduire le mot par une catégorie ethnique moderne.
