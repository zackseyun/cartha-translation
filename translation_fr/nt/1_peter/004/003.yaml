  rationale: La révision remplace le faux ami sémantique moderne « orgies » par « fêtes débridées », conserve les distinctions de la liste et rend le pluriel de ἀσελγείαις. Elle privilégie « païens », usage français naturel et contextuellement adéquat pour ἔθνη, tout en indiquant « non-Juifs » en note. Les ancres de notes sont toutes présentes et correspondent aux termes concernés.
