  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: fr
  text: Donc, après vous être débarrassés de toute méchanceté, de toute tromperie, des hypocrisies, des envies et de toutes les médisances[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de toutes les paroles malveillantes contre autrui ». Le grec désigne largement des propos tenus contre d’autres personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: Rejetez
  rationale: Le participe aoriste, lié à l’impératif de 2.2, exprime une action préparatoire. En français, l’impératif coordonné rend naturellement l’exhortation sans produire la tournure lourde « ayant rejeté ».
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée du contexte précédent, notamment 1.22-25.
- source_word: πᾶσαν κακίαν
  choice: toute méchanceté
  rationale: Dans cette liste de comportements relationnels, « méchanceté » exprime le mal moral et la malveillance sans réduire le terme à la seule intention hostile.
- source_word: πάντα δόλον
  choice: toute tromperie
  rationale: Traduction actuelle et claire de δόλος, qui désigne la fraude, la ruse ou la duplicité.
- source_word: ὑποκρίσεις
  choice: les diverses formes d’hypocrisie
  rationale: Cette formulation française naturelle rend le pluriel grec, qui peut évoquer des manifestations répétées ou variées de l’hypocrisie.
- source_word: φθόνους
  choice: les diverses formes d’envie
  rationale: La reprise implicite de « diverses formes de » rend le pluriel grec sans employer le pluriel français peu naturel « envies », susceptible d’évoquer des désirs ordinaires.
- source_word: πάσας καταλαλιάς
  choice: toute parole malveillante contre autrui
  rationale: καταλαλιά désigne largement le fait de parler contre quelqu’un. Cette traduction évite de limiter le sens à la calomnie juridiquement fausse.
theological_decisions:
- issue: Rapport du participe Ἀποθέμενοι avec l’impératif de 2.2
  choice: 'Le rendre par un impératif français coordonné : « Rejetez donc »'
  alternative: « Ayant donc rejeté » ou « Après avoir rejeté »
  rationale: Le participe conserve une valeur préparatoire par rapport à 2.2, mais le verset isolé serait incomplet et peu naturel avec « ayant ». L’impératif français transmet l’exhortation sans trancher une question doctrinale.
- issue: Portée morale de la liste des vices
  choice: Traduire concrètement chaque vice sans amplification doctrinale
  alternative: Élargir κακία en « tout mal » ou réduire καταλαλιάς à « toute calomnie »
  rationale: Le contexte est une exhortation éthique. Les choix retenus préservent la portée relationnelle des termes et leur tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe privilégie une exhortation naturelle. « Les diverses formes de » permet de respecter les pluriels grecs ὑποκρίσεις et φθόνους sans employer des pluriels français artificiels. La virgule finale signale que la phrase se poursuit au verset 2.
