id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: fr
  text: Mais vous, vous êtes un peuple choisi[a], un sacerdoce royal, une nation sainte, un peuple qui lui appartient en propre, afin que vous proclamiez les grandeurs[b] de celui qui vous a appelés à sortir des ténèbres pour entrer dans sa merveilleuse lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lignée choisie ». Le mot grec peut désigner une lignée, une souche ou un peuple; « peuple » évite ici les connotations ethniques modernes que pourrait avoir le mot « race », tout en conservant le sens collectif.
    reason: lexical_alternative
  - marker: b
    text: Ou « les perfections », « les qualités dignes de louange » ou « les hauts faits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Mais vous, vous êtes
  rationale: δὲ marque le contraste avec les personnes évoquées auparavant, et le pronom explicite Ὑμεῖς met les destinataires en relief. La dislocation française « Mais vous, vous… » restitue naturellement ces deux valeurs.
- source_word: γένος ἐκλεκτόν
  choice: un peuple choisi
  rationale: γένος peut désigner une lignée, une souche ou un peuple. « Peuple choisi » conserve ici l’identité collective et l’élection sans suggérer les catégories raciales modernes que pourrait évoquer « race choisie ».
- source_word: βασίλειον ἱεράτευμα
  choice: un sacerdoce royal
  rationale: Cette expression nominale compacte, qui fait écho à Exode 19.6 dans la Septante, maintient à la fois les dimensions royale et sacerdotale sans la transformer en « royaume de prêtres ».
- source_word: ἔθνος ἅγιον
  choice: une nation sainte
  rationale: Traduction directe qui conserve le vocabulaire collectif et l’idée de consécration portée par ἅγιον.
- source_word: λαὸς εἰς περιποίησιν
  choice: un peuple qui lui appartient en propre
  rationale: περιποίησις exprime ici l’acquisition ou la possession particulière. La tournure française rend clairement l’appartenance tout en laissant le possesseur implicite être identifié par le contexte.
- source_word: ὅπως
  choice: afin que
  rationale: La conjonction introduit le but. « Afin que » en conserve nettement la valeur dans un registre digne et courant.
- source_word: τὰς ἀρετὰς
  choice: les grandeurs
  rationale: Dans ce contexte, ἀρεταί désigne ce qui, dans le caractère et les actes de Dieu, est excellent et digne d’être proclamé. « Grandeurs » garde une portée assez large pour ne pas limiter le terme aux seules qualités ou aux seuls actes.
- source_word: ἐξαγγείλητε
  choice: vous proclamiez
  rationale: Le verbe exprime une annonce publique et appuyée; « proclamer » restitue mieux cette force que le plus neutre « déclarer ».
- source_word: τοῦ ... καλέσαντος
  choice: de celui qui vous a appelés
  rationale: La construction participiale au génitif identifie Dieu par son action sans que la traduction ait besoin d’ajouter explicitement son nom.
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: à sortir des ténèbres pour entrer dans sa merveilleuse lumière
  rationale: Cette formulation française naturelle conserve le mouvement exprimé par ἐκ et εἰς, depuis le domaine des ténèbres jusque dans celui de la lumière.
theological_decisions:
- issue: Titres collectifs issus du langage d’alliance appliqué à la communauté destinataire
  choice: Conserver directement « peuple choisi », « sacerdoce royal » et « nation sainte ».
  alternative: Atténuer ces titres en les reformulant comme de simples comparaisons ou qualités spirituelles.
  rationale: Le texte applique intentionnellement à ses destinataires des désignations collectives tirées des Écritures d’Israël. La traduction doit préserver cette tension intertextuelle sans trancher à elle seule les débats théologiques plus larges qu’elle suscite.
- issue: Identité du possesseur dans λαὸς εἰς περιποίησιν
  choice: Employer « qui lui appartient en propre », avec un pronom dont le référent divin ressort du contexte.
  alternative: Écrire « que Dieu s’est acquis » ou, plus littéralement, « destiné à la possession ».
  rationale: La formulation choisie rend intelligible la relation d’appartenance sans introduire le nom « Dieu », absent de la proposition grecque, ni laisser en français une expression obscure.
- issue: Portée de τὰς ἀρετὰς
  choice: Retenir le terme englobant « grandeurs ».
  alternative: Limiter le sens aux « hauts faits », aux « perfections » ou aux « louanges ».
  rationale: Le grec peut évoquer les qualités excellentes et dignes de louange de Dieu, manifestées notamment dans ses actes. Le texte principal conserve cette amplitude et la note signale les principales nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « Mais vous, vous êtes » rend l’emphase du pronom grec; « sacerdoce » est retenu comme terme biblique établi et précis. Les marqueurs [a] et [b] sont placés exactement sur les expressions auxquelles se rapportent les notes.
