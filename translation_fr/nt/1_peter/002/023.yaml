  naturalness: Le français est moderne, fluide et de registre digne. « S’en remettre à celui qui juge avec justice » est idiomatique et conserve utilement l’objet implicite du verbe grec. La suppression de « sans cesse » donne une formulation plus sobre tout en laissant l’imparfait exprimer le caractère duratif ou habituel.
  terminology: « Insulter », « répondre par l’insulte », « souffrir », « menacer » et « juge avec justice » sont exacts et naturels. Le relatif initial « Lui qui » convient comme continuation du verset précédent.
