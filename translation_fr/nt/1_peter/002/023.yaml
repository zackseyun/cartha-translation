  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: fr
  text: Lui qui, quand on l’insultait, ne répondait pas par l’insulte[a] ; quand il souffrait, il ne menaçait pas, mais il s’en remettait à celui qui juge avec justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « injurié, il ne rendait pas l’injure ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec ne précise pas explicitement ce qu’il remettait à celui qui juge : lui-même, sa cause ou le jugement.'
    reason: source_ambiguity
lexical_decisions:
- source_word: λοιδορούμενος
  choice: quand on l’insultait
  rationale: Le participe passif désigne des injures ou des violences verbales. Cette formulation est naturelle en français moderne et, avec l’imparfait, convient au portrait d’une conduite répétée.
- source_word: οὐκ ἀντελοιδόρει
  choice: ne répondait pas par l’insulte
  rationale: Le verbe exprime une riposte verbale de même nature. La tournure française conserve la réciprocité du préfixe ἀντι- sans lourdeur.
- source_word: πάσχων
  choice: quand il souffrait
  rationale: Le participe présent est rendu comme une circonstance temporelle, en parallèle avec la proposition précédente.
- source_word: οὐκ ἠπείλει
  choice: il ne menaçait pas
  rationale: L’imparfait français reflète la valeur imperfective du grec et décrit l’absence constante de menaces.
- source_word: παρεδίδου
  choice: il s’en remettait sans cesse
  rationale: Le verbe à l’imparfait décrit ici une attitude continue de remise confiante. La construction pronominale française reste naturelle tout en évitant de préciser arbitrairement l’objet non exprimé en grec.
- source_word: τῷ κρίνοντι δικαίως
  choice: à celui qui juge avec justice
  rationale: Cette traduction conserve la forme descriptive du participe substantivé et rend δικαίως comme un adverbe, sans transformer l’expression en titre divin explicite.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque le contraste entre l’absence de représailles et la remise confiante à celui qui juge.
- source_word: ὃς
  choice: Lui qui
  rationale: Le relatif reprend le Christ mentionné dans le contexte précédent. « Lui qui » permet une continuation française digne et intelligible lorsque le verset est lu isolément.
theological_decisions:
- issue: Référent de « celui qui juge avec justice »
  choice: Conserver la désignation descriptive sans ajouter « Dieu » ni « le Père ».
  alternative: 'Expliciter : « à Dieu, qui juge avec justice » ou « au Père, qui juge avec justice ».'
  rationale: Le contexte implique Dieu comme référent, mais le grec ne le nomme pas dans ce verset. La traduction préserve donc l’implicite et n’impose pas une précision théologique absente de la formulation source.
- issue: Objet implicite de παρεδίδου
  choice: Employer « s’en remettait », sans préciser s’il remettait sa personne, sa cause ou son jugement.
  alternative: « se confiait lui-même » ; « remettait sa cause » ; « les livrait » à celui qui juge.
  rationale: Le grec n’exprime aucun complément d’objet. La solution retenue communique l’abandon confiant tout en préservant l’ouverture syntaxique et interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits présentent une conduite constante pendant la souffrance. « Avec justice » est plus idiomatique ici que « justement », qui pourrait être compris au sens de « précisément ».
