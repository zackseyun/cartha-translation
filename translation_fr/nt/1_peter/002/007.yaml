  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: fr
  text: 'Ainsi donc, l’honneur est pour vous qui croyez[a] ; mais, pour ceux qui ne croient pas[b] : « La pierre que les bâtisseurs ont rejetée, c’est elle qui est devenue la tête de l’angle[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour vous qui croyez, il y a ce qui est précieux », c’est-à-dire que la pierre est précieuse aux yeux des croyants.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ceux qui désobéissent » ; le verbe peut évoquer le refus de croire qui se manifeste par la désobéissance.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « la pierre angulaire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: honneur
  rationale: Le nom peut désigner l’honneur, la valeur ou le caractère précieux. « L’honneur » conserve la concision du grec et, dans ce contexte, exprime ce qui revient aux croyants, sans exclure la résonance de la pierre dite précieuse au verset précédent.
- source_word: τοῖς πιστεύουσιν
  choice: pour vous qui croyez
  rationale: Cette formulation naturelle maintient l’adresse directe exprimée par ὑμῖν et le contraste avec ceux qui ne croient pas.
- source_word: ἀπιστοῦσιν
  choice: ceux qui ne croient pas
  rationale: Le contraste immédiat avec πιστεύουσιν favorise le sens de refus de croire. La nuance possible de désobéissance est signalée en note.
- source_word: λίθος
  choice: pierre
  rationale: « Pierre » est le terme français usuel dans l’image de la construction et dans cette citation scripturaire.
- source_word: ἀπεδοκίμασαν
  choice: ont rejetée
  rationale: Le verbe évoque un rejet à la suite d’une évaluation ; « rejeter » rend naturellement ce sens en français.
- source_word: οἰκοδομοῦντες
  choice: bâtisseurs
  rationale: Le participe substantivé désigne ceux qui bâtissent ; « bâtisseurs » est idiomatique et préserve l’image.
- source_word: κεφαλὴν γωνίας
  choice: tête de l’angle
  rationale: Cette traduction transparente conserve la métaphore littérale du grec sans la réduire d’emblée à une fonction architecturale précise.
theological_decisions:
- issue: Sens de ἡ τιμή en relation avec les croyants et avec le Christ figuré par la pierre
  choice: L’honneur est pour ceux qui croient.
  alternative: Pour vous qui croyez, la pierre est précieuse.
  rationale: La construction ὑμῖν ... ἡ τιμή indique le plus directement que l’honneur revient aux croyants et correspond au thème contextuel de ne pas être couvert de honte. Le lien possible avec la valeur précieuse de la pierre reste explicité en note.
- issue: Interprétation de κεφαλὴ γωνίας
  choice: Conserver l’image sous la forme « tête de l’angle ».
  alternative: « pierre angulaire » ou « pierre principale de l’angle »
  rationale: Le grec ne précise pas entièrement la fonction architecturale de la pierre. Une traduction transparente préserve cette ouverture, tandis que l’équivalent français traditionnel est donné en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle de la citation est conservée. « Ainsi donc » marque naturellement l’inférence de οὖν ; le point-virgule clarifie le contraste, et les deux-points introduisent la citation qui s’applique à ceux qui ne croient pas.
