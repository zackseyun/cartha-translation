id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: fr
  text: Lui-même a porté nos péchés dans son corps sur le bois[a], afin que, morts aux péchés, nous vivions pour la justice. Par sa blessure[b], vous avez été guéris[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur l’arbre »; on peut aussi traduire selon le sens « sur la croix ». Le grec dit littéralement « sur le bois » et fait probablement écho à Deutéronome 21.23.
    reason: alternative_reading
  - marker: b
    text: Ou « meurtrissure », « marque laissée par les coups »; le nom grec est au singulier et fait écho à Ésaïe 53.5.
    reason: lexical_alternative
  - marker: c
    text: La guérison est exprimée ici sans restriction. Dans le contexte, elle est liée aux péchés et à la justice, sans être explicitement limitée à la seule guérison physique ou à la seule guérison spirituelle.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: a porté
  rationale: Le verbe ἀναφέρω peut signifier « faire monter », « offrir » ou « porter ». Ici, « a porté » conserve à la fois l’écho d’Ésaïe 53 et l’idée de la prise en charge des péchés, sans imposer un sens sacrificiel plus technique que ne l’exige le texte.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: dans son corps
  rationale: Cette formulation directe garde le caractère concret et corporel de la souffrance. L’accent porté par αὐτός est déjà rendu au début par « Lui-même ».
- source_word: ἐπὶ τὸ ξύλον
  choice: sur le bois
  rationale: ξύλον désigne le bois ou un arbre. « Sur le bois » est une expression française naturelle pour l’instrument de la crucifixion et conserve mieux que « sur la croix » le terme grec ainsi que son probable écho à Deutéronome 21.23.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: morts aux péchés
  rationale: ἀπογίνομαι exprime ici une rupture décisive ou une séparation. « Morts aux péchés » rend cette force de manière concise et idiomatique, tout en conservant le pluriel grec.
- source_word: τῇ δικαιοσύνῃ
  choice: pour la justice
  rationale: Le datif lié à ζήσωμεν décrit une vie orientée vers la justice ou la conduite juste. « Pour la justice » est naturel en français et laisse au mot sa portée morale et relationnelle.
- source_word: μώλωπι
  choice: blessure
  rationale: μώλωψ désigne la marque ou la blessure produite par des coups. « Blessure » est clair en français moderne et conserve le singulier qui fait écho à Ésaïe 53.5.
- source_word: ἰάθητε
  choice: vous avez été guéris
  rationale: L’aoriste passif est rendu directement. « Guéris » préserve l’ampleur de l’image sans la limiter expressément à une guérison physique ou spirituelle.
- source_word: αὐτὸς
  choice: Lui-même
  rationale: Le pronom intensif grec met le sujet en relief. Placé en tête, « Lui-même » reproduit naturellement cette insistance en français.
theological_decisions:
- issue: Portée de la guérison dans la dernière proposition
  choice: Conserver « vous avez été guéris » sans préciser la nature de la guérison.
  alternative: Limiter le sens à une guérison physique, à une guérison spirituelle du péché, ou l’expliciter comme une restauration globale à dominante sotériologique.
  rationale: Le contexte immédiat relie la guérison aux péchés, à la justice et aux souffrances du Christ, mais le texte ne réduit pas explicitement le terme à une seule catégorie. La formulation large respecte l’écho d’Ésaïe 53 et la tension du passage.
- issue: Traduction de ξύλον
  choice: Employer « bois » dans le texte principal.
  alternative: Employer « croix » ou « arbre ».
  rationale: Le référent est bien la crucifixion de Jésus, mais le grec emploie ξύλον et non σταυρός. « Bois » reste intelligible en français, garde le choix lexical du texte et son probable arrière-plan scripturaire, sans substituer dans le texte principal un terme plus interprétatif.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise afin de conserver le mouvement de la phrase grecque. « Sur le bois » et « morts aux péchés » gardent les échos scripturaires tout en restant compréhensibles; les notes signalent les principales possibilités lexicales sans alourdir le texte.
