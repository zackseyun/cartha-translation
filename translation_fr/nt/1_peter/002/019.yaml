reference: 1 Peter 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: fr
  text: Car c’est une grâce si quelqu’un, par conscience envers Dieu[a][b], supporte des peines en souffrant injustement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par égard pour Dieu », « conscient de Dieu » ou « par conscience de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « grâce » peut désigner une chose digne d’approbation ou une faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: une grâce
  rationale: 'Conserve le terme théologique et le lien lexical avec l’usage néotestamentaire, tout en laissant le contexte lui donner ici une valeur appréciative : chose digne d’approbation ou de faveur.'
- source_word: διὰ συνείδησιν θεοῦ
  choice: par conscience de Dieu
  rationale: Reproduit la formule grecque compacte sans réduire συνείδησις à la seule conscience morale ni exclure l’idée d’une attention consciente portée à Dieu. La note fournit une formulation française plus idiomatique.
- source_word: ὑποφέρει
  choice: supporte
  rationale: Exprime naturellement l’endurance patiente sous l’épreuve dans ce contexte.
- source_word: λύπας
  choice: des peines
  rationale: Rend la détresse et les afflictions éprouvées, avec une étendue sémantique naturelle en français moderne.
- source_word: πάσχων ἀδίκως
  choice: en souffrant injustement
  rationale: Respecte la valeur circonstancielle du participe et de l’adverbe sans préciser indûment la nature du tort subi.
- source_word: τις
  choice: quelqu’un
  rationale: Rend fidèlement l’indéfini singulier sans introduire un référent exclusivement masculin.
- source_word: τοῦτο γὰρ
  choice: Car c’est
  rationale: Marque le rapport explicatif de γάρ et présente naturellement en français l’évaluation introduite par τοῦτο.
theological_decisions:
- issue: Sens de χάρις dans ce contexte
  choice: une grâce
  alternative: une chose digne d’approbation ; une chose qui attire la faveur
  rationale: Le maintien de « grâce » préserve la résonance théologique et l’ambiguïté évaluative du grec, sans ajouter explicitement « auprès de Dieu », que ce membre de phrase ne formule pas.
- issue: Sens de συνείδησις θεοῦ
  choice: conscience de Dieu
  alternative: par égard pour Dieu ; conscient de Dieu ; par conscience envers Dieu
  rationale: La formulation retenue maintient la tension entre conscience morale orientée vers Dieu et conscience attentive de sa présence, au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « par conscience de Dieu » est volontairement compacte afin de préserver l’ambiguïté du grec; les lectures idiomatiques sont données en note. L’ordre des constituants rattache clairement le motif lié à Dieu au fait de supporter les peines.
