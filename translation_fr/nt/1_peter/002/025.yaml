id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: fr
  text: Car vous étiez comme des brebis qui s’égaraient[a], mais maintenant vous êtes revenus[b] vers le Berger et le Gardien[c] de vos âmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui erraient »; le grec peut aussi signifier « qui étaient égarées ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « vous vous êtes tournés de nouveau »; la forme grecque peut aussi se comprendre avec une nuance passive : « vous avez été ramenés ».'
    reason: alternative_reading
  - marker: c
    text: Ou « celui qui veille sur vous »; traditionnellement, « l’Évêque ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Car vous étiez
  rationale: γάρ rattache le verset à ce qui précède en donnant la raison de l’affirmation précédente; l’imparfait ἦτε décrit l’état passé des destinataires.
- source_word: ὡς πρόβατα
  choice: comme des brebis
  rationale: ὡς introduit une comparaison. « Brebis » conserve naturellement l’image pastorale en français.
- source_word: πλανώμενοι
  choice: qui s’égaraient
  rationale: Le participe peut exprimer l’idée de s’égarer, d’errer ou d’être égaré. « Qui s’égaraient » convient à l’image des brebis et préserve le mouvement sans préciser indûment une cause extérieure.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: mais maintenant vous êtes revenus
  rationale: ἀλλά marque un contraste net. Bien que la forme verbale soit passive, ἐπιστρέφω peut avoir ici un sens intransitif ou moyen; « vous êtes revenus » rend en français un changement accompli ayant une portée présente sans trancher la question de l’agent.
- source_word: ἐπὶ τὸν ποιμένα
  choice: vers le Berger
  rationale: ποιμήν désigne un berger. La majuscule signale son emploi contextuel comme titre du Christ, tandis que « vers » exprime naturellement l’orientation indiquée par ἐπί avec l’accusatif.
- source_word: καὶ ἐπίσκοπον
  choice: et le Gardien
  rationale: ἐπίσκοπος désigne celui qui veille sur quelqu’un et en prend soin. « Gardien » est intelligible en français courant et évite d’importer ici le sens institutionnel plus tardif d’« évêque ».
- source_word: τῶν ψυχῶν ὑμῶν
  choice: de vos âmes
  rationale: ψυχή peut désigner l’âme, la vie ou la personne. « Vos âmes » conserve l’expression du texte et sa portée spirituelle sans exclure le soin de la personne entière.
theological_decisions:
- issue: Valeur christologique de ποιμήν et ἐπίσκοπος
  choice: le Berger et le Gardien
  alternative: le berger et le surveillant; le Pasteur et l’Évêque
  rationale: Les deux substantifs s’appliquent ici au Christ. Les majuscules indiquent cette fonction titulaire. « Gardien » communique l’idée de vigilance et de soin sans introduire une conception particulière de l’organisation ecclésiale.
- issue: Nuance de voix de ἐπεστράφητε
  choice: vous êtes revenus
  alternative: vous avez été ramenés; vous vous êtes tournés de nouveau
  rationale: La morphologie passive peut suggérer qu’ils ont été ramenés, mais l’usage autorise aussi une lecture moyenne ou intransitive. Le texte principal reste naturel et la note conserve l’ambiguïté concernant l’action divine et la réponse humaine.
translation_notes:
  register: Français international moderne, courant et digne. La phrase garde l’image pastorale et le parallélisme des deux titres. « Gardien » est plus naturel que « surveillant » dans ce contexte personnel, tandis que la note documente le rendu ecclésiastique traditionnel.
