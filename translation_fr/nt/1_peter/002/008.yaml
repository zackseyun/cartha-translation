source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: fr
  text: 'et : « une pierre qui fait trébucher et un rocher qui fait tomber ». Ils trébuchent parce qu’ils désobéissent à la parole ; c’est aussi à cela qu’ils ont été destinés.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut renvoyer au fait de trébucher, à la désobéissance, ou plus largement à l’ensemble de ce qui précède.
    reason: Signaler l’ambiguïté syntaxique réelle de εἰς ὃ καὶ ἐτέθησαν sans imposer une interprétation théologique ou un antécédent unique.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: une pierre qui fait trébucher
  rationale: Expression naturelle qui conserve l’image concrète de la pierre causant un faux pas.
- source_word: πέτρα σκανδάλου
  choice: un rocher qui fait tomber
  rationale: Maintient le parallélisme tout en distinguant πέτρα de λίθος et en exprimant ici la cause de chute portée par σκάνδαλον.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: parce qu’ils désobéissent à la parole
  rationale: Le participe exprime leur refus d’obéir à la parole ; « parce que » rend clairement son rapport explicatif avec « ils trébuchent ».
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: c’est aussi à cela qu’ils ont été destinés
  rationale: « À cela » préserve l’ambiguïté du relatif grec quant à la portée exacte de la destination, tandis que le passif de τίθημι est rendu sans préciser explicitement l’agent.
theological_decisions:
- issue: Portée de εἰς ὃ (« à cela »)
  choice: 'Conserver un antécédent globalement ambigu : « c’est aussi à cela qu’ils ont été destinés »'
  alternative: Préciser qu’ils ont été destinés soit à trébucher, soit à désobéir
  rationale: Le grec ne tranche pas explicitement entre ces lectures. La traduction évite donc de résoudre une tension liée à la prédestination et à la responsabilité humaine.
translation_notes:
  register: Français international moderne, courant et digne. La citation conserve le parallélisme poétique ; « parole » reste sans majuscule, conformément au nom commun grec λόγος dans ce contexte.
