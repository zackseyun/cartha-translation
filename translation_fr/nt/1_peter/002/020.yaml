id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: fr
  text: Quel mérite y a-t-il, en effet, à tenir bon quand vous péchez et que vous êtes battus ? Mais si vous tenez bon tout en faisant le bien et en souffrant, cela trouve grâce auprès de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cela est digne d’éloge devant Dieu » ; littéralement, « cela est une grâce auprès de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: mérite
  rationale: Dans cette question rhétorique, le mot désigne le mérite ou l'éloge que l'on pourrait retirer d'une conduite, plutôt que la renommée au sens large.
- source_word: ἁμαρτάνοντες
  choice: quand vous péchez
  rationale: Cette formulation conserve la portée morale et théologique explicite du participe tout en restant naturelle en français.
- source_word: κολαφιζόμενοι
  choice: que vous êtes battus
  rationale: Le verbe évoque des coups physiques, notamment portés du poing ; « battus » transmet clairement cette violence sans archaïsme.
- source_word: ὑπομενεῖτε
  choice: tenir bon
  rationale: Cette expression courante rend l'idée de demeurer ferme sous l'épreuve et permet de conserver la répétition du verbe dans les deux propositions.
- source_word: ἀγαθοποιοῦντες
  choice: tout en faisant le bien
  rationale: Le participe désigne une conduite bonne ou bienfaisante ; « faire le bien » en est le rendu direct et idiomatique.
- source_word: πάσχοντες
  choice: en souffrant
  rationale: Le terme a un sens large et ne précise pas à lui seul la forme de la souffrance ; le rendu évite donc de la réduire à la seule maltraitance.
- source_word: χάρις
  choice: trouve grâce
  rationale: Dans cette expression, χάρις peut désigner la faveur ou l'approbation divine. « Trouve grâce » conserve le lien lexical avec la grâce tout en exprimant naturellement le sens contextuel.
- source_word: παρὰ θεῷ
  choice: auprès de Dieu
  rationale: παρά avec le datif indique ici la relation à Dieu ou son appréciation ; « auprès de Dieu » préserve cette nuance sans la réduire à une simple localisation.
theological_decisions:
- issue: Sens de χάρις dans la proposition finale
  choice: « cela trouve grâce auprès de Dieu »
  alternative: « cela est digne d'éloge devant Dieu » ou « cela est une grâce auprès de Dieu »
  rationale: Le contexte favorise l'idée de faveur ou d'approbation divine, tandis que χάρις garde une résonance théologique plus large. Le rendu choisi exprime le sens contextuel sans effacer le terme « grâce ».
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, ainsi que le parallélisme entre subir des coups pour avoir péché et souffrir en faisant le bien. « Tenir bon » est plus naturel que « endurer » dans cette construction et traduit la persévérance sous l'épreuve.
