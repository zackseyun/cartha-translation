source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: fr
  text: Domestiques[a], soumettez-vous à vos maîtres avec une entière déférence[b], non seulement à ceux qui sont bons et bienveillants, mais aussi à ceux qui sont injustes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves de maison ». Le grec désigne des personnes dépendantes au sein d’une maisonnée et peut notamment désigner des esclaves domestiques.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « en toute crainte »; dans ce contexte, l’expression évoque une attitude de respect et de déférence.
    reason: lexical_alternative
  - marker: c
    text: Ou « durs » ou « tortueux ». Le mot grec signifie littéralement « tordu » ou « tortueux » et peut qualifier une conduite dévoyée ou inéquitable.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: domestiques
  rationale: Le terme désigne spécifiquement les serviteurs ou esclaves attachés à une maison. « Domestiques » conserve ce cadre sans élargir le sens à tous les serviteurs; une note signale explicitement la réalité possible de l’esclavage.
- source_word: ὑποτασσόμενοι
  choice: soumettez-vous
  rationale: Le participe a ici une valeur impérative dans la suite de l’exhortation. L’impératif est naturel en français moderne.
- source_word: ἐν παντὶ φόβῳ
  choice: avec le plus grand respect
  rationale: φόβος peut désigner la crainte, mais aussi le respect révérencieux. Dans cette relation d’autorité, cette formulation exprime pleinement la déférence demandée sans réduire le mot à la terreur.
- source_word: δεσπόταις
  choice: maîtres
  rationale: Le mot désigne ceux qui exercent leur autorité sur des serviteurs ou esclaves de maison. « Maîtres » rend précisément cette relation sociale.
- source_word: ἀγαθοῖς
  choice: bons
  rationale: Traduction directe de l’évaluation morale portée par ἀγαθός.
- source_word: ἐπιεικέσιν
  choice: bienveillants
  rationale: Le terme évoque une attitude douce, raisonnable et conciliante. « Bienveillants » forme en français une opposition naturelle avec les maîtres injustes.
- source_word: σκολιοῖς
  choice: injustes
  rationale: Au sens propre, σκολιός signifie « courbé, tortueux »; appliqué à des personnes, il évoque celles dont la conduite est dévoyée, dure ou inéquitable. « Injustes » communique clairement ce sens contextuel, tandis que la métaphore est conservée en note.
theological_decisions:
- issue: Rendre le statut social exprimé par οἰκέται sans atténuer ni préciser indûment la condition juridique
  choice: « domestiques », avec une note indiquant « esclaves de maison »
  alternative: « esclaves de maison » dans le texte principal
  rationale: οἰκέται identifie des dépendants domestiques et peut désigner des esclaves. Le texte principal conserve la portée domestique du terme, tandis que la note empêche d’effacer la réalité historique de l’esclavage.
- issue: Déterminer si φόβος doit être rendu par « crainte » ou par un équivalent contextuel
  choice: « avec le plus grand respect »
  alternative: « en toute crainte »
  rationale: La formule exprime une déférence complète. « Respect » est ici intelligible en français actuel et ne tranche pas le texte comme s’il ordonnait nécessairement la terreur envers les maîtres.
- issue: Rendre la métaphore morale de σκολιός
  choice: « injustes » dans le texte, avec le sens littéral en note
  alternative: « tortueux »
  rationale: « Tortueux » préserve plus directement l’image, mais paraît ambigu ou artificiel appliqué ici aux maîtres. « Injustes » transmet le sens moral contextuel sans réduire σκολιός à la seule dureté.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La tournure d’adresse « Vous qui êtes domestiques » explicite naturellement le vocatif fonctionnel du grec. Les notes préservent les ambiguïtés historiques et lexicales sans alourdir le verset.
