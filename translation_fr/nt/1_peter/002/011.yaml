id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: fr
  text: Bien-aimés, je vous exhorte, en tant qu’étrangers et gens de passage[a], à vous abstenir des désirs de la chair[b], qui font la guerre à l’âme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « résidents étrangers et étrangers de passage ». Les deux termes soulignent qu’ils ne sont pas pleinement chez eux là où ils vivent.
    reason: lexical_alternative
  - marker: b
    text: Ou « désirs charnels ». L’expression « désirs de la chair » ne désigne pas nécessairement les seuls désirs sexuels.
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « âme » peut aussi désigner la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Bien-aimés
  rationale: Le vocatif pluriel exprime une affection profonde et garde le lien lexical avec le langage de l’amour, sans ajouter l’idée d’amitié.
- source_word: παρακαλῶ
  choice: je vous exhorte
  rationale: Dans ce contexte, le verbe introduit un appel moral pressant. « Je vous exhorte » en conserve la force tout en restant digne et clair.
- source_word: ὡς
  choice: en tant que
  rationale: Cette formulation présente la qualité sous laquelle Pierre s’adresse à ses lecteurs, sans ajouter une nuance causale absente du grec.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: étrangers et gens de passage
  rationale: Les deux termes associés décrivent des personnes qui vivent hors de leur patrie ou ne sont pas établies durablement. La formulation française conserve leur proximité tout en les distinguant.
- source_word: ἀπέχεσθαι
  choice: à vous abstenir
  rationale: L’infinitif appelle les lecteurs à se tenir continuellement à l’écart de ces désirs; « s’abstenir » exprime naturellement cette maîtrise volontaire.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: des désirs de la chair
  rationale: Cette traduction conserve la métaphore de la chair et évite de réduire ces désirs au seul domaine sexuel ou de les paraphraser d’emblée comme « pécheurs ».
- source_word: στρατεύονται
  choice: font la guerre
  rationale: Le verbe emploie une image militaire forte, rendue de manière directe et naturelle en français.
- source_word: κατὰ τῆς ψυχῆς
  choice: à l’âme
  rationale: « L’âme » conserve la portée anthropologique de ψυχή et l’ambiguïté entre vie intérieure, personne et vie, sans introduire le possessif « votre », absent du texte grec.
theological_decisions:
- issue: Portée morale de σαρκικῶν
  choice: désirs de la chair
  alternative: désirs charnels; mauvais désirs; désirs pécheurs
  rationale: « De la chair » préserve l’image source et la tension théologique sans identifier explicitement la chair à une « nature pécheresse ». « Charnels » risquerait en français courant d’être compris comme exclusivement sexuel.
- issue: Sens de ψυχή
  choice: l’âme
  alternative: la vie; la personne elle-même
  rationale: Le contexte présente ces désirs comme des ennemis de la personne dans sa vie profonde. « Âme » garde le poids traditionnel du terme sans imposer pour autant une doctrine technique de la séparation entre corps et âme.
- issue: Statut des destinataires exprimé par πάροικοι et παρεπίδημοι
  choice: étrangers et gens de passage
  alternative: résidents étrangers et étrangers de passage; exilés
  rationale: Le binôme souligne leur non-appartenance et leur statut provisoire. La traduction ne précise pas si ce statut est uniquement social, politique ou spirituel, puisque le verset lui-même laisse ces dimensions se rejoindre.
translation_notes:
  register: Français international moderne, digne et accessible. « Bien-aimés » et « je vous exhorte » maintiennent la chaleur et la gravité de l’adresse apostolique. La syntaxe reste proche du mouvement de la phrase grecque, tandis que « gens de passage » et « font la guerre » donnent une expression naturelle et immédiatement compréhensible.
