reference: 1 Peter 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: fr
  text: si du moins vous avez goûté que le Seigneur est bon[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puisque vous avez goûté ». La tournure conditionnelle grecque peut présenter comme réelle une condition supposée remplie.'
    reason: alternative_reading
  - marker: b
    text: « Bon » peut aussi se traduire par « bienveillant » ou « plein de bonté ». Cette formulation fait écho au Psaume 34.8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: si du moins
  rationale: Conserve la forme conditionnelle grecque tout en indiquant, par « du moins », que la condition est vraisemblablement tenue pour réalisée dans cette exhortation.
- source_word: ἐγεύσασθε
  choice: vous avez goûté
  rationale: Préserve l’image concrète du goût, cohérente avec celle de la nourriture en 2.2-3 et avec l’écho du Psaume 34.8, tout en exprimant une expérience passée pertinente dans le présent.
- source_word: ὅτι
  choice: que
  rationale: 'Introduit directement le contenu de l’expérience : ce qui a été goûté, c’est que le Seigneur est bon.'
- source_word: χρηστὸς
  choice: bon
  rationale: Rend le sens large du terme et conserve l’écho naturel du Psaume 34.8 ; « bienveillant » ou « plein de bonté » sont également possibles, mais plus précis.
- source_word: κύριος
  choice: le Seigneur
  rationale: Conserve le titre théologique et permet à la fois le lien contextuel avec le Christ et l’écho au langage du Psaume, sans expliciter le référent dans le texte.
theological_decisions:
- issue: Valeur de la proposition conditionnelle introduite par εἰ
  choice: 'Maintien d’une condition réelle : « si du moins vous avez goûté »'
  alternative: « puisque vous avez goûté »
  rationale: Le contexte laisse entendre que l’auteur suppose l’expérience réelle de ses lecteurs, mais le grec emploie néanmoins une forme conditionnelle. La traduction conserve cette tension rhétorique.
- issue: Référent du « Seigneur »
  choice: Traduire simplement « le Seigneur »
  alternative: « le Seigneur, c’est-à-dire le Christ »
  rationale: Dans le contexte de 1 Pierre 2, le titre est étroitement lié à Jésus, tout en reprenant le Psaume 34.8. Ne pas ajouter « Christ » préserve cette résonance et évite une explicitation absente du grec.
translation_notes:
  register: Français international moderne, naturel et digne. L’expression « si du moins » garde la condition grecque sans paraître artificielle ; l’image de « goûter » est maintenue en raison du contexte et de l’allusion scripturaire.
