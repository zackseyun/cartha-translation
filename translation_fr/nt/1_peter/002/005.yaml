  source_fidelity: Le projet conserve adéquatement les images de la construction, des pierres vivantes et des sacrifices, ainsi que la voix passive. Toutefois, « et devenir un saint corps de prêtres » coordonne de façon trop autonome le second complément de but/résultat et introduit une formulation française peu idiomatique pour ἱεράτευμα.
  naturalness: « Saint corps de prêtres » est compréhensible, mais n’est pas une désignation naturelle en français biblique international. « Saint sacerdoce » est l’équivalent établi, peut désigner le corps sacerdotal collectif dans ce contexte, et permet une syntaxe plus fluide.
  terminology: « Maison spirituelle », « sacrifices spirituels », « agréables à Dieu » et « Jésus le Messie » sont fidèles et de registre approprié. « Saint sacerdoce » rend ἱεράτευμα sans réduire le terme à une simple fonction individuelle.
  issues:
  - severity: medium
    issue: « et devenir un saint corps de prêtres »
    rationale: Cette coordination donne à « devenir » une indépendance syntaxique que le grec n’explicite pas et « corps de prêtres » est une expression inhabituelle. « En vue d’un saint sacerdoce » rend plus naturellement εἰς avec sa valeur possible de but ou de résultat, sans trancher excessivement.
  revised_text: Vous aussi, comme des pierres vivantes, vous êtes édifiés pour former une maison spirituelle, en vue d’un saint sacerdoce, afin d’offrir des sacrifices spirituels agréables à Dieu par Jésus le Messie.
