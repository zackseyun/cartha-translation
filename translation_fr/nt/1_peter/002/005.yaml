    reason: alternative_reading
  revision_rationale: La révision remplace l’expression peu naturelle « saint corps de prêtres » et évite de présenter « devenir » comme une action coordonnée indépendante. La formulation retenue garde l’orientation exprimée par εἰς et le caractère collectif de ἱεράτευμα, tout en conservant la voix passive et la finalité de l’offrande. La note est conservée comme note d’alternative syntaxique et précise la portée collective du terme.
