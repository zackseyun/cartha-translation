reference: 1 Peter 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: fr
  text: Vous aussi, comme des pierres vivantes, vous êtes édifiés pour former une maison spirituelle, en vue d’un saint sacerdoce, afin d’offrir des sacrifices spirituels agréables à Dieu par Jésus le Messie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: vous aussi
  rationale: Exprime naturellement en français la valeur additive de καί et l’adresse emphatique portée par αὐτοί, sans la lourdeur de « vous-mêmes aussi ».
- source_word: ὡς λίθοι ζῶντες
  choice: comme des pierres vivantes
  rationale: Conserve la comparaison et fait écho à la pierre vivante mentionnée dans le contexte précédent.
- source_word: οἰκοδομεῖσθε
  choice: vous êtes édifiés
  rationale: Maintient le présent passif et ne précise pas l’agent que le verset laisse implicite.
- source_word: οἶκος πνευματικός
  choice: pour former une maison spirituelle
  rationale: Rend le complément résultatif de l’image de construction dans un français naturel.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: et devenir un saint corps de prêtres
  rationale: εἰς indique ici le but ou le résultat. « Corps de prêtres » exprime le sens collectif de ἱεράτευμα plus clairement que le français courant « sacerdoce », qui peut aussi désigner la fonction sacerdotale.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: afin d’offrir des sacrifices spirituels
  rationale: Conserve l’imagerie cultuelle et la visée exprimée par l’infinitif, sans définir la nature précise des sacrifices.
- source_word: εὐπροσδέκτους θεῷ
  choice: agréables à Dieu
  rationale: Formulation française idiomatique qui exprime l’acceptation favorable des sacrifices par Dieu.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: διά avec le génitif marque la médiation. « Le Messie » traduit Χριστός comme titre dans un français idiomatique.
theological_decisions:
- issue: Valeur de la voix dans οἰκοδομεῖσθε
  choice: 'Passif : « vous êtes édifiés »'
  alternative: 'Sens moyen ou réflexif : « édifiez-vous »'
  rationale: La forme et l’image contextuelle présentent les croyants comme les éléments d’une construction; le passif est conservé sans nommer explicitement l’agent.
- issue: Rapport syntaxique de εἰς ἱεράτευμα ἅγιον
  choice: 'But ou résultat : « et devenir un saint corps de prêtres »'
  alternative: « en vue d’un saint corps de prêtres » ou rattachement direct « comme maison spirituelle, en un saint corps de prêtres »
  rationale: La préposition εἰς permet une nuance de but ou de résultat. La traduction reste lisible tout en signalant cette latitude en note.
- issue: Traduction de Χριστοῦ
  choice: « le Messie »
  alternative: « Christ »
  rationale: Dans l’expression Ἰησοῦ Χριστοῦ, Χριστός peut être entendu comme le titre messianique; le traduire en explicite le sens sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore architecturale et l’imagerie sacerdotale sont conservées. « Corps de prêtres » évite l’ambiguïté courante de « sacerdoce » tout en gardant le caractère collectif du grec.
