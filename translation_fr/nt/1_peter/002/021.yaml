id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: fr
  text: C’est à cela, en effet, que vous avez été appelés, puisque le Messie aussi a souffert pour vous, vous laissant un modèle[a], afin que vous suiviez ses traces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un exemple à reproduire » : le mot grec peut désigner un modèle d’écriture placé devant des élèves pour qu’ils le recopient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: C’est à cela… que
  rationale: Cette tournure française naturelle renvoie au contexte précédent, où il est question d’endurer une souffrance injuste, tout en conservant la force directionnelle de εἰς.
- source_word: ἐκλήθητε
  choice: vous avez été appelés
  rationale: Le passif conserve l’idée d’un appel reçu, vraisemblablement divin dans ce contexte, sans préciser davantage sa portée théologique.
- source_word: ὅτι
  choice: puisque
  rationale: Introduit ici le fondement explicatif de l’appel; « puisque » exprime naturellement ce lien causal en français.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre; « le Messie » rend explicitement l’idée de l’Oint dans un français clair et actuel.
- source_word: ἔπαθεν
  choice: a souffert
  rationale: Rend simplement le verbe sans ajouter la mort ni préciser une forme de souffrance que ce verset n’explicite pas.
- source_word: ὑπὲρ ὑμῶν
  choice: pour vous
  rationale: Formulation concise qui conserve la portée bénéficiaire ou représentative de ὑπέρ, ainsi qu’une éventuelle résonance substitutive, sans la rendre exclusive.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: vous laissant
  rationale: Le participe se rapporte au Messie et ὑμῖν désigne les destinataires; cette formulation est idiomatique et fidèle.
- source_word: ὑπογραμμὸν
  choice: un modèle
  rationale: Le terme désigne concrètement un modèle proposé à l’imitation, notamment un exemple d’écriture donné à reproduire; « modèle » conserve mieux cette dimension que le seul mot « exemple ».
- source_word: ἵνα
  choice: afin que
  rationale: Exprime clairement la visée ou le but introduit par ἵνα dans un registre français digne et naturel.
- source_word: ἐπακολουθήσητε
  choice: vous suiviez
  rationale: Le subjonctif français après « afin que » rend naturellement la construction de but sans ajouter une obligation plus forte que le grec.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: ses traces
  rationale: Conserve l’image des empreintes laissées sur un chemin et se dit naturellement en français pour évoquer l’imitation d’une conduite.
theological_decisions:
- issue: Portée de ὑπὲρ ὑμῶν dans la souffrance du Messie
  choice: « pour vous », avec une portée bénéficiaire et représentative laissée ouverte
  alternative: « à votre place » ou « en votre faveur »
  rationale: Le contexte met en avant la souffrance exemplaire du Messie, mais la préposition peut porter une profondeur théologique plus large. « Pour vous » préserve cette tension sans imposer ici une formulation exclusivement substitutive.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien logique avec le contexte précédent, le titre « le Messie », l’image pédagogique du modèle et celle des traces à suivre.
