id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: fr
  text: 'En effet, il est écrit dans l’Écriture : « Voici, je pose en Sion une pierre angulaire, choisie et honorée[a], et celui qui croit en lui[b] ne sera certainement pas couvert de honte[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « précieuse » ou « de grande valeur ». Le terme grec peut exprimer aussi bien l’honneur que la grande valeur.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le pronom grec peut se rapporter à « la pierre »; « en lui » reflète l’application de cette image au Christ dans le contexte.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « ne sera jamais couvert de honte ». La négation grecque est fortement emphatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: En effet
  rationale: Introduit l’appui scripturaire de l’affirmation précédente avec une valeur explicative naturelle en français.
- source_word: περιέχει ἐν γραφῇ
  choice: il est écrit dans l’Écriture
  rationale: Rend naturellement l’expression grecque impersonnelle, qui signifie que ce qui suit se trouve dans l’Écriture, sans conserver un calque obscur.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Conserve l’appel solennel à l’attention propre à la citation prophétique, dans un français actuel.
- source_word: τίθημι
  choice: je pose
  rationale: Convient au geste de placer une pierre dans l’image de construction.
- source_word: ἐν Σιὼν
  choice: en Sion
  rationale: Préserve le sens locatif de ἐν et la tournure biblique française habituelle.
- source_word: λίθον ἀκρογωνιαῖον
  choice: une pierre angulaire
  rationale: Expression française claire et usuelle pour la pierre située à l’angle et déterminante pour l’édifice.
- source_word: ἐκλεκτὸν
  choice: choisie
  rationale: Exprime directement la sélection de cette pierre sans recourir au terme théologique plus spécialisé « élue ».
- source_word: ἔντιμον
  choice: honorée
  rationale: Met au premier plan la notion d’honneur, importante dans le contexte immédiat, tout en signalant en note le sens possible de grande valeur.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: celui qui croit en lui
  rationale: Reproduit le participe substantivé et rend personnellement le pronom conformément à l’application christologique explicite du contexte.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ne sera certainement pas couvert de honte
  rationale: « Certainement pas » restitue la négation grecque fortement emphatique; « couvert de honte » exprime naturellement le passif de καταισχύνω.
theological_decisions:
- issue: Référent de αὐτῷ dans la citation d’Ésaïe reprise par Pierre
  choice: en lui
  alternative: en elle, en référence grammaticale à la pierre
  rationale: Bien que l’image immédiate soit celle d’une pierre, le contexte de 1 Pierre 2.4-8 identifie personnellement cette pierre au Christ. « En lui » conserve cette application sans supprimer la métaphore.
- issue: Nuance de ἔντιμον
  choice: honorée
  alternative: précieuse / de grande valeur
  rationale: Le mot peut exprimer l’honneur aussi bien que la valeur. « Honorée » maintient le thème de l’honneur développé au verset suivant, tandis qu’une note préserve l’autre nuance réelle.
- issue: Force de οὐ μὴ
  choice: ne sera certainement pas
  alternative: ne sera jamais
  rationale: La formulation choisie marque clairement la négation emphatique sans transformer nécessairement cette construction en indication temporelle absolue.
translation_notes:
  register: Français international moderne, digne et accessible. La citation conserve une légère élévation prophétique avec « Voici », tout en évitant les calques peu naturels. Les notes maintiennent les ambiguïtés lexicales et référentielles significatives.
