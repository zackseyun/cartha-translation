id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: fr
  text: comme des personnes libres, sans vous servir de la liberté comme d’un voile pour couvrir le mal, mais comme des esclaves de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: des personnes libres
  rationale: L’adjectif désigne collectivement les destinataires. « Des personnes libres » conserve le sens social et rhétorique sans employer une forme inutilement masculine.
- source_word: ἐπικάλυμμα
  choice: un moyen de couvrir
  rationale: Le nom évoque ce qui recouvre ou dissimule. Cette formulation française naturelle préserve l’image concrète, là où « prétexte » l’effacerait.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: faire de la liberté
  rationale: La tournure rend idiomatiquement l’idée littérale d’« avoir la liberté comme couverture » et fait ressortir l’usage instrumental de la liberté.
- source_word: κακίας
  choice: le mal
  rationale: Dans ce contexte, κακία désigne largement la conduite mauvaise, plutôt que la seule malveillance.
- source_word: θεοῦ δοῦλοι
  choice: des esclaves de Dieu
  rationale: « Esclaves » conserve la force de δοῦλοι et le paradoxe voulu entre liberté et appartenance totale à Dieu; le génitif est rendu naturellement par « de Dieu ».
theological_decisions:
- issue: Traduction de δοῦλοι appliqué à l’identité chrétienne
  choice: esclaves de Dieu
  alternative: serviteurs de Dieu
  rationale: Le verset oppose délibérément la liberté des croyants à leur entière appartenance à Dieu. « Serviteurs » atténuerait cette tension, tandis qu’« esclaves » préserve la force du terme grec sans la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe participiale est intégrée à la phrase sans alourdissement; le contraste entre « personnes libres » et « esclaves de Dieu » est volontairement maintenu.
