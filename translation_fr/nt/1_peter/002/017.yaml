id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: fr
  text: Honorez tout le monde, aimez la communauté des frères et sœurs[a], craignez Dieu, honorez le roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne ici l’ensemble des autres croyants, considérés comme une famille.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’empereur » ; le mot grec signifie « roi », mais, dans le contexte romain de Pierre, il désigne probablement l’empereur.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: tout le monde
  rationale: Employé substantivement, l’accusatif pluriel de πᾶς exprime ici une portée universelle. « Tout le monde » est naturel en français moderne.
- source_word: τιμήσατε / τιμᾶτε
  choice: honorez
  rationale: La même traduction aux deux extrémités du verset préserve la répétition de τιμάω. « Honorer » est plus fort et plus fidèle que le simple fait de respecter.
- source_word: ἀδελφότητα
  choice: la communauté des frères et sœurs
  rationale: Le terme désigne collectivement les croyants unis par un lien familial. Cette formulation naturelle explicite que la communauté comprend les hommes et les femmes sans perdre l’image fraternelle.
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: Équivalent direct et usuel de l’impératif présent de ἀγαπάω ; la continuité éventuelle de l’action reste implicite, comme il est naturel en français.
- source_word: θεὸν
  choice: Dieu
  rationale: Équivalent direct du complément de φοβεῖσθε.
- source_word: φοβεῖσθε
  choice: craignez
  rationale: « Craindre » conserve la force du grec et maintient la distinction voulue entre ce qui revient à Dieu et l’honneur accordé au souverain.
- source_word: βασιλέα
  choice: le roi
  rationale: « Roi » traduit directement βασιλεύς. Dans le contexte romain de Pierre, le référent probable est l’empereur, précision conservée en note.
theological_decisions:
- issue: Distinction entre l’attitude due à Dieu et celle due au souverain civil
  choice: « craignez Dieu » et « honorez le roi »
  alternative: « révérez Dieu » et « respectez le roi »
  rationale: 'Le choix conserve la différence lexicale et la hiérarchie du texte : Dieu doit être craint, tandis que le souverain doit être honoré, sans développer une théologie politique étrangère au verset.'
translation_notes:
  register: Français international moderne, concis et digne. Les quatre impératifs parallèles sont conservés, de même que la répétition de « honorez ». Les marqueurs de note sont placés immédiatement après les expressions qu’ils expliquent.
