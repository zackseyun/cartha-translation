id: 1PE.2.15
reference: 1 Peter 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: fr
  text: 'Car telle est la volonté de Dieu : qu’en faisant le bien, vous réduisiez au silence l’ignorance des gens insensés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous museliez l’ignorance des gens insensés ». Le verbe signifie littéralement « museler »; il est employé ici au sens figuré pour faire cesser des propos hostiles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’exhortation précédente; « Car » rend naturellement cette valeur causale.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: telle est la volonté de Dieu
  rationale: 'Cette tournure française idiomatique conserve l’idée de manière portée par οὕτως : c’est ainsi que s’accomplit la volonté de Dieu.'
- source_word: ἀγαθοποιοῦντας
  choice: en faisant le bien
  rationale: Le participe présent indique le moyen ou la manière par lesquels l’ignorance doit être réduite au silence.
- source_word: φιμοῦν
  choice: réduisiez au silence
  rationale: Le verbe signifie littéralement « museler », mais s’emploie ici métaphoriquement pour faire cesser des propos hostiles; « réduire au silence » préserve la force de l’image dans un français naturel.
- source_word: ἀγνωσίαν
  choice: l’ignorance
  rationale: Rendu direct du nom grec, qui désigne ici un manque de connaissance associé à la conduite insensée des opposants.
- source_word: ἀφρόνων ἀνθρώπων
  choice: des gens insensés
  rationale: ἄφρων exprime l’absence de bon sens ou de discernement, tandis que ἄνθρωποι a ici une portée humaine générique, non exclusivement masculine.
theological_decisions:
- issue: Portée de ἀνθρώπων quant au genre
  choice: gens
  alternative: hommes
  rationale: Le masculin grammatical grec désigne ici des opposants humains en général et non spécifiquement des personnes de sexe masculin.
- issue: Rapport entre la volonté de Dieu et l’action demandée
  choice: qu’en faisant le bien, vous réduisiez au silence
  alternative: faire le bien afin de réduire au silence
  rationale: Le subjonctif français explicite naturellement le contenu de la volonté divine sans transformer l’énoncé en simple description ni effacer la valeur de moyen du participe.
translation_notes:
  register: Français international moderne, digne et accessible. « Telle est » convient au registre biblique sans archaïsme marqué; « gens » exprime naturellement la portée générique de ἀνθρώπων.
