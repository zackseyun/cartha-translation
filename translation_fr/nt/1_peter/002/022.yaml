id: 1PE.2.22
reference: 1 Peter 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: fr
  text: lui qui n’a commis aucun péché[b], et dans la bouche de qui aucune tromperie[a] n’a été trouvée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ruse », « fraude » ou « duplicité »; le terme grec désigne une tromperie délibérée.
    reason: lexical_alternative
  - marker: b
    text: Cette formulation fait écho à Ésaïe 53.9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: lui qui
  rationale: Le pronom relatif renvoie au Christ mentionné au verset précédent. « Lui qui » conserve ce lien tout en formant en français un début de citation naturel.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: n’a commis aucun péché
  rationale: Avec ἁμαρτίαν, ποιέω exprime idiomatiquement le fait de commettre un péché. « Aucun péché » restitue la négation catégorique sans transformer la proposition en paraphrase.
- source_word: οὐδὲ
  choice: et… aucune
  rationale: Cette construction coordonne naturellement en français les deux propositions négatives et conserve leur parallélisme.
- source_word: εὑρέθη
  choice: n’a été trouvée
  rationale: Le passif est maintenu afin de rester proche du grec et de préserver la résonance scripturaire, sans préciser un agent absent du texte.
- source_word: δόλος
  choice: tromperie
  rationale: « Tromperie » est un terme français actuel couvrant l’idée de fraude, de ruse mensongère ou de duplicité; une note signale cette étendue de sens.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: dans la bouche de qui
  rationale: Cette formulation conserve l’image corporelle du grec et l’écho d’Ésaïe 53.9, plutôt que de l’expliciter par « dans ses paroles ».
theological_decisions:
- issue: Écho intertextuel à Ésaïe 53.9 concernant l’absence de péché et de tromperie chez le Christ
  choice: Conserver « n’a commis aucun péché » et « dans la bouche de qui aucune tromperie n’a été trouvée »
  alternative: « Il n’a jamais péché et n’a jamais prononcé de paroles trompeuses »
  rationale: La formulation retenue préserve la force théologique de l’affirmation et sa proximité avec le texte prophétique, sans expliciter davantage que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure assez formelle pour préserver le parallélisme et l’allusion à Ésaïe, sans employer de vocabulaire archaïque.
