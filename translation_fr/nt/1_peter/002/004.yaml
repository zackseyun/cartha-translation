id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: fr
  text: En vous approchant de lui[a], pierre vivante rejetée par les humains, mais choisie et précieuse auprès de Dieu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous qui vous approchez de lui »; le grec emploie un participe présent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aux yeux de Dieu »; littéralement : « auprès de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς ὃν προσερχόμενοι
  choice: En vous approchant de lui
  rationale: Cette formulation naturelle rend la direction exprimée par πρός et la valeur continue ou circonstancielle du participe présent προσερχόμενοι, sans transformer celui-ci en impératif.
- source_word: λίθον ζῶντα
  choice: pierre vivante
  rationale: « Pierre » conserve l’image de construction développée dans le contexte, tandis que « vivante » maintient le paradoxe voulu.
- source_word: ὑπὸ ἀνθρώπων
  choice: par les humains
  rationale: ἄνθρωποι désigne ici les êtres humains en contraste avec Dieu. « Les humains » est exact, inclusif et naturel en français moderne.
- source_word: ἀποδεδοκιμασμένον
  choice: rejetée
  rationale: Le participe parfait passif indique une pierre qui a été évaluée puis écartée; « rejetée » en donne clairement le résultat durable.
- source_word: παρὰ δὲ θεῷ
  choice: mais ... auprès de Dieu
  rationale: παρά avec le datif exprime ici le statut ou l'estimation de la pierre auprès de Dieu. La note explicite la nuance évaluative sans la surinterpréter dans le texte.
- source_word: ἐκλεκτὸν
  choice: choisie
  rationale: « Choisie » rend directement le sens sans recourir au terme théologique plus spécialisé « élue ».
- source_word: ἔντιμον
  choice: précieuse
  rationale: Le mot peut exprimer l'honneur ou la grande valeur. « Précieuse » convient à l'image de la pierre tout en conservant l'idée de haute estime.
theological_decisions:
- issue: Référent de « lui » et image de la pierre
  choice: Conserver le pronom « lui »; dans le contexte, il renvoie au Seigneur, le Messie présenté comme pierre vivante.
  alternative: Insérer explicitement « Jésus-Christ » ou « le Seigneur ».
  rationale: Le contexte immédiat et les citations de 2.6-8 identifient le référent, mais le grec emploie ici un pronom. Le conserver évite une explicitation inutile.
- issue: Rapport entre le rejet humain et l'évaluation divine
  choice: Maintenir le contraste entre « rejetée par les humains » et « choisie et précieuse auprès de Dieu ».
  alternative: Rendre « précieuse aux yeux de Dieu » ou « honorée par Dieu ».
  rationale: La formulation retenue préserve les deux qualificatifs grecs et le contraste introduit par μέν...δέ, sans réduire ἔντιμος à la seule idée d'honneur.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, conformément à sa continuation syntaxique au verset suivant. L'accord au féminin de « rejetée », « choisie » et « précieuse » suit « pierre ».
