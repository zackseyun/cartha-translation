  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: fr
  text: vous qui, autrefois, n’étiez pas un peuple[a], mais qui êtes maintenant le peuple de Dieu ; vous à qui miséricorde n’avait pas été accordée[b], mais à qui elle a maintenant été accordée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pierre fait écho à Osée 1.9-10 et 2.23, et applique à ses lecteurs le langage du rétablissement d’Israël pour décrire leur identité présente au sein du peuple de Dieu.
    reason: cross_reference
  - marker: b
    text: 'Ou : « vous qui n’aviez pas reçu de miséricorde, mais qui en avez maintenant reçu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: vous qui
  rationale: Le pronom relatif pluriel renvoie aux destinataires mentionnés dans le contexte précédent. « Vous qui » explicite naturellement ce lien en français sans ajouter de contenu.
- source_word: ποτε
  choice: autrefois
  rationale: Le terme désigne leur condition passée, en contraste direct avec νῦν, « maintenant ».
- source_word: λαὸς
  choice: un peuple / le peuple de Dieu
  rationale: λαός a ici un sens collectif et évoque l’identité d’un peuple dans le cadre de l’alliance. L’article défini devant « peuple de Dieu » est idiomatique en français, tandis que « un peuple » préserve la formulation distincte de la première proposition.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif exprime l’appartenance. « Le peuple de Dieu » est la formulation française naturelle qui conserve la portée relationnelle et collective du grec.
- source_word: οὐκ ἠλεημένοι
  choice: n’aviez pas reçu miséricorde
  rationale: Le participe parfait passif décrit un état antérieur résultant de l’absence de miséricorde accordée. Cette formulation garde l’idée de réception et la force du contraste, sans désigner explicitement l’agent sous-entendu.
- source_word: ἐλεηθέντες
  choice: avez reçu miséricorde
  rationale: Le participe aoriste passif présente les destinataires comme bénéficiaires d’un acte de miséricorde. Le passé composé rend naturellement en français leur nouvelle situation présente et maintient le parallélisme lexical.
- source_word: δὲ
  choice: mais
  rationale: Dans les deux propositions, δέ marque le contraste entre l’ancienne condition et la condition actuelle.
- source_word: νῦν
  choice: maintenant
  rationale: Le mot souligne le statut présent des croyants par opposition à leur situation passée.
theological_decisions:
- issue: Allusion à Osée et langage d’identité liée à l’alliance
  choice: Conserver la progression exacte de « pas un peuple » à « le peuple de Dieu »
  alternative: Rendre les deux membres par « pas le peuple de Dieu » puis « le peuple de Dieu »
  rationale: Le grec ne dit pas explicitement « pas le peuple de Dieu » dans le premier membre. La traduction retenue préserve cette différence et le renversement collectif évoqué par Osée, sans imposer une interprétation ethnique, ecclésiologique ou confessionnelle plus étroite.
- issue: Voix passive des expressions relatives à la miséricorde
  choice: Employer « recevoir miséricorde » sans nommer l’agent
  alternative: Dire « Dieu ne vous avait pas fait miséricorde, mais maintenant il vous a fait miséricorde »
  rationale: La voix passive grecque laisse l’agent inexprimé, même si le contexte permet de comprendre qu’il s’agit de Dieu. Ne pas l’ajouter dans le corps du texte respecte la forme et la retenue de la source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et la répétition de « miséricorde » reproduisent la structure rhétorique du grec et son vocabulaire théologique, tandis que « autrefois » et « maintenant » rendent nettement le contraste temporel.
