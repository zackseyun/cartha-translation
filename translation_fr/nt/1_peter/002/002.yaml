  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: fr
  text: Comme des nouveau-nés, aspirez ardemment au lait pur et spirituel[a], afin que, par lui, vous grandissiez vers le salut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rationnel » ou « raisonnable ». L’adjectif grec peut désigner ce qui relève de la raison ou de la vie intérieure et, dans ce contexte, peut évoquer une nourriture spirituelle plutôt qu’un lait littéral.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits n’ont pas « vers le salut ».
    reason: textual_variant
lexical_decisions:
- source_word: ὡς
  choice: Comme
  rationale: Introduit naturellement en français la comparaison avec les nouveau-nés.
- source_word: ἀρτιγέννητα βρέφη
  choice: des nouveau-nés
  rationale: Expression française courante qui conserve l’idée d’enfants venant tout juste de naître.
- source_word: τὸ λογικὸν
  choice: spirituel
  rationale: Dans cette métaphore, le terme qualifie une nourriture non littérale relevant de la vie intérieure. Les sens plus formels « rationnel » et « raisonnable » sont signalés en note afin de préserver l’ambiguïté lexicale.
- source_word: ἄδολον
  choice: pur
  rationale: Rend l’idée d’un lait sans mélange ni falsification, dans une formulation concise et naturelle.
- source_word: γάλα
  choice: lait
  rationale: Conserve l’image centrale de la nourriture nécessaire à la croissance.
- source_word: ἐπιποθήσατε
  choice: aspirez ardemment à
  rationale: Exprime le désir intense porté par l’impératif grec, dans un registre digne et actuel.
- source_word: ἵνα
  choice: afin que
  rationale: Marque clairement le but de cette aspiration.
- source_word: ἐν αὐτῷ
  choice: par lui
  rationale: Renvoie au lait et exprime naturellement en français le moyen de la croissance.
- source_word: αὐξηθῆτε
  choice: vous grandissiez
  rationale: Préserve l’image de la croissance sans alourdir le français par un passif explicite.
- source_word: εἰς σωτηρίαν
  choice: vers le salut
  rationale: Conserve la valeur directionnelle de εἰς et la tension entre croissance présente et accomplissement du salut.
theological_decisions:
- issue: Sens de λογικός appliqué au lait
  choice: spirituel dans le texte principal
  alternative: rationnel ou raisonnable
  rationale: « Spirituel » fait comprendre qu’il s’agit d’une nourriture métaphorique de la vie intérieure, tandis que la note maintient les équivalents plus formels possibles sans imposer une interprétation unique.
- issue: Portée de εἰς σωτηρίαν
  choice: vers le salut
  alternative: pour le salut ; jusqu’au salut
  rationale: La formulation directionnelle respecte le mouvement exprimé par le grec sans réduire le salut à une réalité exclusivement présente ou exclusivement future, ni préciser un schéma doctrinal absent du texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif garde sa force avec « aspirez ardemment », tandis que « vers le salut » conserve volontairement la tension théologique et la direction du grec.
