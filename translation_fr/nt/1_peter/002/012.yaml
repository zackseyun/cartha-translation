source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: fr
  text: Ayez une conduite honorable parmi les non-Juifs, afin que, là même où ils vous accusent de faire le mal, ils voient vos bonnes œuvres et rendent gloire à Dieu au jour où il interviendra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au jour de la visitation ». L’expression peut évoquer le moment où Dieu vient visiter, examiner ou intervenir, pour faire grâce ou pour juger.'
    reason: Le sens de ἐν ἡμέρᾳ ἐπισκοπῆς est théologiquement chargé et demeure ouvert dans le grec; la note préserve ses principales nuances.
lexical_decisions:
- source_word: ἀναστροφή
  choice: conduite
  rationale: Désigne la manière de vivre ou le comportement; « conduite » est naturel, digne et précis dans ce contexte.
- source_word: ἔθνη
  choice: non-Juifs
  rationale: Dans ce contexte où Pierre s'adresse au peuple de Dieu vivant au milieu des nations, le terme désigne les populations extérieures à la communauté juive; « non-Juifs » communique ce sens plus clairement que « nations ».
- source_word: καλήν / καλῶν
  choice: honorable / belles
  rationale: Le premier terme qualifie la conduite comme moralement bonne et digne d'estime; le second est rendu par « belles œuvres » afin de conserver l'écho lexical grec et leur qualité visible et admirable.
- source_word: καταλαλοῦσιν
  choice: accusent
  rationale: Le verbe signifie parler contre quelqu'un, le calomnier ou le dénigrer. « Accusent » convient naturellement avec la proposition introduite par ἐν ᾧ sans imposer que toutes les accusations soient juridiquement formelles.
- source_word: ἐποπτεύοντες
  choice: voient
  rationale: Exprime une observation directe et attentive. « voient » reste idiomatique en français, tandis que le contexte indique qu'il s'agit des œuvres effectivement constatées.
- source_word: δοξάσωσι
  choice: rendent gloire
  rationale: Formule française courante qui exprime l'action d'honorer Dieu et de reconnaître sa grandeur.
- source_word: ἐπισκοπή
  choice: interviendra
  rationale: Le nom évoque une visite, une inspection ou une intervention divine. La formulation verbale est naturelle en français et maintient l'idée d'une venue décisive de Dieu.
theological_decisions:
- issue: Sens du « jour de visitation »
  choice: au jour où il interviendra
  alternative: au jour de sa visite / au jour du jugement
  rationale: ἐπισκοπή peut désigner une visitation divine de grâce, d'inspection ou de jugement. « interviendra » préserve cette amplitude sans trancher explicitement entre conversion, délivrance et jugement.
- issue: Rapport logique de ἐν ᾧ
  choice: là même où
  alternative: bien qu'ils / au sujet même duquel
  rationale: La tournure conserve le lien entre le domaine précis de l'accusation et celui où l'observation des bonnes œuvres conduit à glorifier Dieu, plutôt que de transformer sans nécessité la relation en simple concession.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression du grec tout en évitant un calque maladroit. « Non-Juifs » est préféré à « païens », souvent péjoratif aujourd'hui. Le marqueur [a] figure dans le texte principal.
