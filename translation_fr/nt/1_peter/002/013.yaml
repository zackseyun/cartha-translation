source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: fr
  text: Soumettez-vous, à cause du Seigneur, à toute institution humaine[a], soit au roi en tant qu’autorité supérieure[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à toute création humaine » ; traduction traditionnelle : « à toute ordonnance humaine ». Dans ce contexte, l’expression désigne les institutions ou autorités civiles humaines, comme le montrent les mentions du roi et des gouverneurs.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme à celui qui est au-dessus » ; autre traduction possible : « comme au souverain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Soumettez-vous
  rationale: L’impératif aoriste passif de ὑποτάσσω a ici une valeur réfléchie ou moyenne. « Soumettez-vous » exprime naturellement en français moderne l’exhortation à reconnaître une autorité et à s’y placer volontairement.
- source_word: πάσῃ
  choice: toute
  rationale: 'Avec le nom singulier κτίσει, πᾶς a un sens distributif : « toute » ou « chaque ». « Toute » convient au registre et à la construction française.'
- source_word: ἀνθρωπίνῃ
  choice: humaine
  rationale: L’adjectif qualifie ce qui relève de la société humaine. « Humaine » est concis et n’ajoute pas l’idée péjorative d’une institution simplement inventée par les humains.
- source_word: κτίσει
  choice: institution
  rationale: Le sens premier peut être « création » ou « créature », mais les exemples immédiats du roi et des gouverneurs indiquent ici une structure ou autorité civique. « Institution » rend ce sens contextuel tout en signalant l’alternative dans une note.
- source_word: διὰ τὸν κύριον
  choice: à cause du Seigneur
  rationale: διά avec l’accusatif exprime ici le motif. « À cause du Seigneur » conserve cette valeur causale sans la transformer en finalité et reste idiomatique en français.
- source_word: κύριον
  choice: Seigneur
  rationale: Le texte ne précise pas davantage le référent. Le titre « Seigneur » préserve cette formulation et sa portée confessionnelle.
- source_word: εἴτε
  choice: soit
  rationale: « Soit » introduit naturellement en français le premier élément d’une corrélation qui se poursuit au verset suivant.
- source_word: βασιλεῖ
  choice: au roi
  rationale: βασιλεύς signifie directement « roi ». Bien que le contexte romain puisse évoquer l’empereur, « roi » respecte la portée lexicale générale du terme grec.
- source_word: ὡς ὑπερέχοντι
  choice: en tant qu’autorité supérieure
  rationale: Le participe désigne celui qui occupe une position plus élevée ou qui détient une autorité prééminente. Cette formulation française exprime la fonction sans lui attribuer une suprématie absolue.
theological_decisions:
- issue: Nature de l’autorité civile désignée par ἀνθρωπίνῃ κτίσει
  choice: « toute institution humaine »
  alternative: « toute création humaine », « toute créature humaine » ou « toute ordonnance humaine »
  rationale: Le roi et les gouverneurs mentionnés ensuite montrent que Pierre parle des structures ou autorités civiques. « Institution » évite de faire porter le commandement sur chaque individu, tandis que « humaine » conserve la qualification explicite du grec. Le motif de la soumission demeure « à cause du Seigneur ».
- issue: Référent de κύριον
  choice: Conserver simplement « Seigneur »
  alternative: Préciser « Jésus » ou « Dieu »
  rationale: Le grec porte seulement κύριον. Ne pas expliciter le référent préserve l’ambiguïté authentique du texte et évite d’introduire une précision doctrinale absente du verset.
- issue: Portée de ὑπερέχοντι
  choice: « autorité supérieure »
  alternative: « souverain », « suprême » ou « celui qui est au-dessus »
  rationale: Le participe exprime une position supérieure dans l’ordre civique. « Autorité supérieure » indique cette prééminence relative sans suggérer que le roi possède une autorité absolue ou divine.
translation_notes:
  register: Français international moderne, digne et accessible. L’ordre des compléments place le motif « à cause du Seigneur » près de l’exhortation tout en gardant clairement « à toute institution humaine » comme complément de « soumettez-vous ». La virgule finale signale que la phrase et la corrélation introduite par « soit » se poursuivent au verset suivant.
