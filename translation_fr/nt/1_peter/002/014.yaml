source:
  edition: SBLGNT
  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: fr
  text: ou aux gouverneurs, en tant qu’envoyés par lui[a] pour punir les malfaiteurs et louer ceux qui font le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Par lui » renvoie probablement au roi ou à l’empereur mentionné au verset précédent; d’autres comprennent « lui » comme renvoyant à Dieu, qui établit l’autorité.
    reason: Référent potentiellement ambigu du pronom αὐτοῦ.
lexical_decisions:
- source_word: εἴτε
  choice: ou
  rationale: Poursuit l’alternative commencée au verset précédent entre le roi et les gouverneurs.
- source_word: ἡγεμόσιν
  choice: aux gouverneurs
  rationale: Dans ce contexte civique, le terme désigne naturellement des responsables exerçant une autorité gouvernementale, sans préciser excessivement leur statut administratif romain.
- source_word: ὡς
  choice: comme à des hommes
  rationale: Introduit la qualité sous laquelle les gouverneurs sont envisagés; l’ajout de « à des hommes » rend en français l’accord du participe tout en restant implicite dans le grec.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: Avec le participe « envoyés », διά suivi du génitif exprime naturellement l’agent intermédiaire; « par lui » est idiomatique en français. Le pronom renvoie probablement au roi du verset précédent, mais une autre compréhension est signalée en note.
- source_word: πεμπομένοις
  choice: envoyés
  rationale: Conserve simplement l’idée de délégation, sans renforcer le sens par « mandatés » ou « chargés de mission ».
- source_word: εἰς ἐκδίκησιν
  choice: pour punir
  rationale: Dans le cadre de l’autorité civile, ἐκδίκησις désigne ici l’exercice d’une sanction ou d’une justice punitive. La tournure verbale est naturelle et maintient le parallélisme avec « féliciter ».
- source_word: κακοποιῶν
  choice: ceux qui font le mal
  rationale: Rend clairement le caractère verbal du terme et évite le registre plus marqué de « malfaiteurs ».
- source_word: ἔπαινον
  choice: féliciter
  rationale: ἔπαινος exprime une louange ou une approbation publique. La formulation verbale française s’accorde naturellement avec « pour punir » et conserve les deux fonctions parallèles de l’autorité.
- source_word: ἀγαθοποιῶν
  choice: ceux qui font le bien
  rationale: Rend directement et naturellement l’idée de personnes dont la conduite est bonne.
theological_decisions:
- issue: Référent de αὐτοῦ dans δι’ αὐτοῦ
  choice: Le pronom renvoie principalement au roi ou à l’empereur mentionné au verset précédent.
  alternative: Le pronom peut être compris comme renvoyant à Dieu, dans le sens d’une autorité ordonnée par lui.
  rationale: L’antécédent le plus proche et le plus naturel est le roi du verset 13, ce qui présente les gouverneurs comme ses délégués. La note préserve toutefois l’autre compréhension possible sans l’imposer au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Gouverneurs » conserve la précision civique sans imposer un titre administratif trop étroit. Les infinitifs « punir » et « féliciter » donnent une construction fluide et parallèle.
