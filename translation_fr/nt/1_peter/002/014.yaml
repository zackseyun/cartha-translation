  naturalness: La formulation proposée est claire, mais « comme à des hommes envoyés » est peu idiomatique dans ce contexte. « En tant qu’envoyés par lui » est plus naturel en français moderne. Le parallélisme « pour punir … et pour louer … » est fluide et conserve la structure de finalité.
  terminology: « Gouverneurs » convient à ἡγεμόσιν sans imposer une catégorie administrative romaine précise. « Malfaiteurs » est un rendu naturel et concis de κακοποιοί dans ce cadre judiciaire. La note maintient avec justesse l’ambiguïté discutée du référent de αὐτοῦ, sans la trancher doctrinalement.
