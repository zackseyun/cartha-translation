  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: fr
  text: pour un héritage impérissable, sans souillure et qui ne se flétrit pas, gardé dans les cieux pour vous,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: pour un héritage
  rationale: Dans la continuité syntaxique du verset 3, εἰς exprime ici le but ou la destination de l'espérance vivante. « Pour un héritage » est naturel en français tout en conservant ce lien.
- source_word: ἄφθαρτον
  choice: impérissable
  rationale: Rend l'idée de ce qui n'est pas sujet à la corruption ou à la destruction.
- source_word: ἀμίαντον
  choice: sans souillure
  rationale: Conserve la portée cultuelle et morale possible du terme, sans la réduire au seul sens de « pur ».
- source_word: ἀμάραντον
  choice: qui ne se flétrit pas
  rationale: Préserve l'image de quelque chose qui ne se fane ni ne perd son éclat, dans une formulation française claire.
- source_word: τετηρημένην
  choice: gardé
  rationale: Le parfait passif indique que l'héritage a été préservé et demeure réservé; « gardé » maintient cette idée sans préciser l'agent implicite.
- source_word: ἐν οὐρανοῖς
  choice: dans les cieux
  rationale: Reproduit le pluriel grec et la localisation céleste sans harmonisation théologique.
- source_word: εἰς ὑμᾶς
  choice: pour vous
  rationale: Exprime la destination ou la mise en réserve en faveur des destinataires, conformément à l'usage idiomatique français.
theological_decisions:
- issue: Nature et conservation de l'héritage
  choice: Conserver les trois qualificatifs distincts et le passif « gardé »
  alternative: Fusionner les qualificatifs ou expliciter « gardé par Dieu »
  rationale: Le grec accumule trois adjectifs aux nuances complémentaires et laisse l'agent de τετηρημένην inexprimé. La traduction préserve cette structure et n'ajoute pas d'explicitation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La virgule finale signale que le fragment poursuit la phrase commencée au verset précédent.
