id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: fr
  text: Il leur fut révélé que ce n’était pas pour eux-mêmes, mais pour vous, qu’ils étaient au service de ces réalités[a]. Celles-ci vous ont maintenant été annoncées par ceux qui vous ont apporté la bonne nouvelle[b], par l’Esprit Saint envoyé du ciel. Ce sont des réalités que les anges désirent ardemment contempler[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « qu’ils vous servaient, non pas eux-mêmes ». Le grec indique que les prophètes n’étaient pas les bénéficiaires de leur service, mais les destinataires auxquels l’auteur s’adresse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par ceux qui vous ont proclamé l’Évangile ». Le grec emploie le verbe qui signifie « annoncer une bonne nouvelle ».'
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe grec peut évoquer le fait de se pencher pour regarder attentivement : « scruter » ou « se pencher pour voir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: Il leur fut révélé
  rationale: Le pronom relatif renvoie aux prophètes du verset précédent. Le passif et le registre de révélation sont conservés sans préciser l’agent.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: ce n’était pas pour eux-mêmes, mais pour vous
  rationale: Les datifs indiquent naturellement les bénéficiaires du service; « pour » rend clairement ce rapport en français.
- source_word: διηκόνουν αὐτά
  choice: qu’ils étaient au service de ces réalités
  rationale: L’imparfait exprime un service passé envisagé dans sa durée. « Ces réalités » reprend les éléments prophétiques évoqués dans le contexte sans employer un pronom ambigu.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Celles-ci vous ont maintenant été annoncées
  rationale: Le passif est maintenu, et le passé composé relie l’annonce accomplie à la situation présente des destinataires.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: par ceux qui vous ont apporté la bonne nouvelle
  rationale: Cette formulation rend le sens verbal de εὐαγγελίζω dans un français courant, sans transformer nécessairement le verbe en terme technique.
- source_word: πνεύματι ἁγίῳ
  choice: sous l’action de l’Esprit Saint
  rationale: Le datif exprime ici vraisemblablement le moyen ou l’action par laquelle l’annonce a été faite, tout en pouvant comporter une nuance de sphère; cette formulation française évite une expression maladroite.
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: envoyé du ciel
  rationale: Le participe passif modifie l’Esprit Saint; la formulation conserve l’idée de mission et l’origine céleste.
- source_word: ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: les anges désirent ardemment contempler
  rationale: Le présent marque un désir continu. « Contempler » est naturel et digne; la note conserve l’image plus concrète de παρακύπτω.
theological_decisions:
- issue: Référent de πνεύματι ἁγίῳ
  choice: l’Esprit Saint comme agent divin de l’annonce
  alternative: un esprit saint entendu comme puissance ou disposition spirituelle
  rationale: Dans ce contexte du salut annoncé et de l’Esprit envoyé du ciel, la référence personnelle à l’Esprit Saint est la lecture la plus naturelle; la majuscule la signale sans ajouter de contenu.
- issue: Rapport entre le service des prophètes et les destinataires
  choice: les prophètes servaient les intérêts des croyants ultérieurs en annonçant ces réalités
  alternative: les prophètes servaient principalement leurs contemporains
  rationale: Le contraste explicite entre « eux-mêmes » et « vous » impose de faire ressortir les bénéficiaires ultérieurs, sans nier d’autres effets historiques de leur ministère.
- issue: Nuance du datif πνεύματι ἁγίῳ
  choice: moyen ou action de l’Esprit, rendu par « sous l’action de »
  alternative: sphère, rendu par « dans l’Esprit Saint »
  rationale: La syntaxe permet une certaine ambiguïté. Le contexte favorise la valeur instrumentale, mais la formulation retenue reste moins mécanique que « au moyen de ».
translation_notes:
  register: Français international moderne, accessible et digne. La phrase grecque longue est divisée pour améliorer la lisibilité tout en maintenant les liens entre prophétie, annonce présente, action de l’Esprit et désir des anges. Les termes ecclésiastiques peu transparents sont évités dans le corps du texte, avec les équivalents traditionnels signalés en note.
