  to: Il leur fut révélé que ce n’était pas pour eux-mêmes, mais pour vous, qu’ils étaient au service de ces réalités[a]. Celles-ci vous ont maintenant été annoncées par ceux qui vous ont apporté la bonne nouvelle[b], par l’Esprit Saint envoyé du ciel. Ce sont des réalités que les anges désirent ardemment contempler[c].
