reference: 1 Peter 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: fr
  text: Vous l’aimez sans l’avoir vu. Sans le voir maintenant, vous croyez pourtant en lui et exultez d’une joie inexprimable et remplie de gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une joie inexprimable et glorieuse »; littéralement, « d’une joie inexprimable et glorifiée ».
    reason: La forme grecque est un participe parfait passif et peut être rendue par une expression indiquant que la joie est investie de gloire, ou plus simplement par un adjectif.
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: sans l’avoir vu
  rationale: Le participe aoriste exprime l’absence d’une expérience antérieure de la vue, avec une portée actuelle; cette tournure est naturelle en français.
- source_word: ἀγαπᾶτε
  choice: vous l’aimez
  rationale: Le présent simple rend directement l’action actuelle et place naturellement le pronom objet devant le verbe.
- source_word: εἰς ὃν … πιστεύοντες
  choice: en croyant en lui
  rationale: Avec πιστεύω, εἰς désigne ici la personne en qui la foi est placée; « croire en lui » est précis et idiomatique.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: sans le voir maintenant
  rationale: Cette formulation conserve le contraste temporel entre l’absence passée de vision et la situation présente.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici le contraste entre ne pas voir et néanmoins croire et exulter.
- source_word: ἀγαλλιᾶσθε
  choice: vous exultez
  rationale: « Exulter » restitue mieux que le simple « se réjouir » l’intensité de ce verbe, tout en restant compréhensible et digne.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: d’une joie inexprimable
  rationale: Le datif indique la manière ou l’accompagnement; « d’une joie » s’emploie naturellement avec « exulter », et « inexprimable » indique ce qui ne peut être mis en paroles.
- source_word: δεδοξασμένῃ
  choice: remplie de gloire
  rationale: Le participe parfait passif attribue à la joie un état marqué par la gloire. « Remplie de gloire » garde cette valeur sans produire l’étrange « joie glorifiée ».
theological_decisions:
- issue: Sens de πιστεύοντες avec εἰς ὃν
  choice: en croyant en lui
  alternative: en mettant votre confiance en lui
  rationale: Le texte exprime la foi dirigée vers le Christ. « Croire en lui » demeure lexicalement transparent sans réduire la foi à une seule nuance psychologique.
- issue: Relation de δεδοξασμένῃ à la joie
  choice: une joie … remplie de gloire
  alternative: une joie … glorieuse
  rationale: La traduction retenue préserve davantage la force verbale et l’état résultant du participe parfait passif, tandis que l’adjectif « glorieuse » est une formulation plus fluide mais plus aplatie.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La structure participiale grecque est conservée par deux tournures en « sans » et « en ». « Exulter » rend l’intensité de ἀγαλλιᾶσθε; la note maintient l’ambiguïté de δεδοξασμένῃ.
