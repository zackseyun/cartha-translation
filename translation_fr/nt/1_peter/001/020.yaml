  terminology: « Connu d’avance » maintient la prudence lexicale nécessaire sans imposer « choisi » ou « prédestiné ». « Fondation du monde », « manifesté » et « fin des temps » sont des formulations françaises établies, compréhensibles et adaptées au registre. Les notes présentent les alternatives sans surinterprétation doctrinale.
