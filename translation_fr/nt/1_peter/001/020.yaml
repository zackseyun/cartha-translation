  source_fidelity: 'Le texte rend fidèlement les deux participes passifs grecs se rapportant au Christ du v. 19 : προεγνωσμένου (« avait été connu d’avance ») et φανερωθέντος (« a été manifesté »). « Avant la fondation du monde », « à la fin des temps » et « pour vous » correspondent respectivement à πρὸ καταβολῆς κόσμου, ἐπ’ ἐσχάτου τῶν χρόνων et δι’ ὑμᾶς. La distinction temporelle entre la connaissance préalable et la manifestation est bien conservée.'
