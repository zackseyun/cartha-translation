id: 1PE.1.20
reference: 1 Peter 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: fr
  text: Il avait été connu d’avance avant la fondation du monde[a], mais il a été manifesté à la fin des temps pour vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « choisi d’avance ». Le grec dit littéralement « connu d’avance » ; cette expression peut impliquer le dessein de Dieu, sans imposer cette interprétation plus précise dans le texte principal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans ces derniers temps ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: προεγνωσμένου
  choice: avait été connu d’avance
  rationale: Le participe aoriste passif, qui renvoie au Christ mentionné au verset 19, exprime le fait d’être connu par avance. Le plus-que-parfait français marque naturellement l’antériorité par rapport à sa manifestation sans transformer explicitement cette connaissance préalable en choix ou en prédestination.
- source_word: πρὸ καταβολῆς κόσμου
  choice: avant la fondation du monde
  rationale: Cette formulation conserve l’expression biblique consacrée et son idée d’une réalité antérieure à la création du monde.
- source_word: φανερωθέντος
  choice: il a été manifesté
  rationale: Le passif grec indique qu’il a été rendu visible ou ouvertement révélé. « Manifesté » conserve cette nuance tout en restant une formulation biblique compréhensible en français moderne.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: à la fin des temps
  rationale: Cette traduction garde la portée temporelle et eschatologique de l’expression grecque sans ajouter le démonstratif « ces », absent du texte.
- source_word: δι’ ὑμᾶς
  choice: pour vous
  rationale: Avec l’accusatif, διά exprime ici le bénéfice ou le motif. « Pour vous » est naturel et indique que cette manifestation a eu lieu en faveur des destinataires.
theological_decisions:
- issue: Sens de προεγνωσμένου à propos du Christ avant la création
  choice: Conserver l’idée d’être « connu d’avance » dans le texte principal.
  alternative: « choisi d’avance » ou « destiné d’avance »
  rationale: Le verbe peut, dans son contexte biblique, évoquer le dessein divin, mais il ne contraint pas la traduction à assimiler la connaissance préalable au choix ou à la prédestination. La formulation retenue préserve la tension théologique du grec.
- issue: Portée temporelle de ἐπ’ ἐσχάτου τῶν χρόνων
  choice: « à la fin des temps »
  alternative: « dans ces derniers temps »
  rationale: Le grec situe la manifestation dans la phase finale des temps, mais ne contient pas explicitement « ces ». Le texte principal suit donc de près la formulation source, tandis que la note donne l’expression française alternative.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de la structure grecque tout en employant des temps verbaux naturels en français. Les termes « fondation du monde » et « fin des temps » conservent la résonance biblique sans imposer une lecture confessionnelle particulière.
