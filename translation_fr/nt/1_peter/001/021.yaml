  to: vous qui, par lui, croyez en Dieu[a], Dieu qui l’a ressuscité d’entre les morts et lui a donné la gloire, de sorte que[b] votre foi et votre espérance sont placées en Dieu.
  rationale: La révision modernise la relative, affine l’expression française de l’objet de la foi et de l’espérance, et corrige la note lexicale. Elle maintient la médiation du Christ, la résurrection, le don de gloire et l’ambiguïté limitée de ὥστε.
