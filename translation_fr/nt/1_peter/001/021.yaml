review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : les destinataires croient en Dieu par le Christ, Dieu a ressuscité et glorifié le Christ, et foi et espérance ont Dieu pour objet. « D’entre les morts » rend correctement ἐκ νεκρῶν. « Sont tournées vers Dieu » exprime la direction de εἰς θεόν, mais est moins précis et moins idiomatique pour la foi que « sont placées en Dieu ».'
  naturalness: « Lequel », bien que grammatical, est soutenu et peu naturel en français international moderne dans cette phrase. La relative directe « Dieu, qui… » est claire et fluide. « Votre foi et votre espérance sont placées en Dieu » est une formulation française naturelle qui conserve Dieu comme objet de la foi et de l’espérance.
  terminology: « Foi », « espérance », « ressuscité » et « gloire » sont appropriés. La note a doit présenter l’alternative lexicale sans la transformer en une paraphrase relationnelle (« fidèles à Dieu »), qui rend moins directement πιστούς.
  issues:
  - severity: low
    issue: Relative « lequel »
    rationale: Le pronom identifie correctement Dieu, mais son registre est inutilement formel. Une relative avec « qui » après « Dieu » ne crée pas d’ambiguïté et convient mieux au français moderne.
  - severity: low
    issue: « sont tournées vers Dieu »
    rationale: Cette image est compréhensible, mais elle affaiblit légèrement la relation de confiance exprimée par πίστις/ἐλπίς εἰς θεόν. « Sont placées en Dieu » est plus idiomatique dans ce contexte et conserve l’objet divin.
  - severity: low
    issue: Formulation de la note a
    rationale: « Êtes fidèles à Dieu » ne correspond pas de manière suffisamment directe à l’alternative lexicale « faithful ones ». « Des fidèles » signale l’alternative sans surinterpréter la préposition.
