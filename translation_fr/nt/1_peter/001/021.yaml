id: 1PE.1.21
reference: 1 Peter 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: fr
  text: vous qui, par lui, croyez en Dieu[a], Dieu qui l’a ressuscité d’entre les morts et lui a donné la gloire, de sorte que[b] votre foi et votre espérance sont placées en Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « êtes des fidèles » ; dans ce contexte, l’expression signifie très probablement que vous croyez en Dieu par le Christ.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec pour résultat que » ; la tournure grecque peut exprimer le résultat, avec une possible nuance de visée.
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: 'Avec le génitif, διά exprime ici la médiation : c’est par le Christ que les destinataires croient en Dieu.'
- source_word: πιστοὺς εἰς θεόν
  choice: croyez en Dieu
  rationale: Dans cette construction avec εἰς θεόν, πιστούς désigne très probablement ceux qui mettent leur foi en Dieu. La tournure verbale est plus naturelle en français que « êtes croyants en Dieu ».
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: lequel l’a ressuscité d’entre les morts
  rationale: Cette formulation rend l’expression grecque usuelle de la résurrection tout en indiquant clairement que l’antécédent est Dieu.
- source_word: δόξαν αὐτῷ δόντα
  choice: lui a donné la gloire
  rationale: La traduction reste proche du grec et conserve l’idée que Dieu accorde la gloire au Christ.
- source_word: ὥστε
  choice: de sorte que
  rationale: Cette locution exprime naturellement la conséquence, sans exclure entièrement une nuance de visée.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν
  choice: votre foi et votre espérance sont tournées vers Dieu
  rationale: La formulation française exprime la direction et l’objet de la foi et de l’espérance indiqués par εἰς, sans suggérer ici une union mystique que pourrait évoquer « sont en Dieu ».
theological_decisions:
- issue: Sens de πιστούς
  choice: ceux qui croient en Dieu par le Christ
  alternative: les fidèles envers Dieu
  rationale: La construction πιστούς εἰς θεόν favorise nettement le sens de croire ou de mettre sa confiance en Dieu, tout en laissant l’autre valeur lexicale en note.
- issue: Rôle du Christ dans δι’ αὐτοῦ
  choice: le Christ est le médiateur par qui les destinataires croient en Dieu
  alternative: les destinataires croient à cause du Christ
  rationale: « par lui » respecte la valeur médiatrice de διά avec le génitif sans développer une formulation doctrinale au-delà du texte.
- issue: Valeur de ὥστε
  choice: conséquence exprimée par « de sorte que »
  alternative: visée exprimée par « afin que »
  rationale: La syntaxe présente surtout l’état qui résulte de la résurrection et de la glorification du Christ, mais la frontière entre conséquence et visée ne doit pas être rendue artificiellement absolue.
translation_notes:
  register: Français international moderne, digne et accessible. « Lequel » évite l’ambiguïté possible de « qui » après la mention de Dieu, tandis que « sont tournées vers Dieu » rend la direction de εἰς de façon idiomatique.
