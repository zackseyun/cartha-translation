id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: fr
  text: sachant que vous avez été rachetés[a] du mode de vie futile que vous avaient transmis vos pères[b], non par des choses périssables comme l’argent ou l’or,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « libérés contre rançon ». Le verbe grec évoque une libération obtenue au moyen d’un paiement.
    reason: lexical_alternative
  - marker: b
    text: Ou « vos ancêtres ». Littéralement, « transmis par les pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sachant que
  rationale: Le participe conserve le lien syntaxique avec l’exhortation environnante et exprime une connaissance acquise, sans transformer explicitement ce lien en rapport causal.
- source_word: ἐλυτρώθητε
  choice: vous avez été rachetés
  rationale: Le verbe évoque une libération obtenue au moyen d’une rançon. « Rachetés » est naturel en français biblique moderne et laisse l’image du prix se préciser par le contraste avec l’argent et l’or.
- source_word: φθαρτοῖς
  choice: par des choses périssables
  rationale: L’adjectif est employé substantivement et désigne des biens sujets à la corruption ou à la disparition, en contraste avec ce qui est impérissable au verset suivant.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: comme l’argent ou l’or
  rationale: L’argent et l’or illustrent les « choses périssables » ; « comme » rend clairement cette valeur explicative en français courant.
- source_word: ἐκ
  choice: du
  rationale: 'La préposition marque ici la séparation : les destinataires ont été délivrés hors de leur ancien mode de vie.'
- source_word: ματαίας
  choice: futile
  rationale: Le terme qualifie ce qui est vain, sans résultat ou sans véritable valeur. « Futile » préserve cette portée morale et existentielle.
- source_word: ἀναστροφῆς
  choice: mode de vie
  rationale: Dans ce contexte, le nom désigne l’ensemble de la conduite et de la manière de vivre, plutôt que des actes isolés.
- source_word: πατροπαραδότου
  choice: que vous avaient transmis vos pères
  rationale: Cette formulation rend le caractère reçu par tradition et conserve la référence explicite aux pères présente dans le grec.
theological_decisions:
- issue: Terminologie de la rédemption
  choice: rachetés
  alternative: libérés contre rançon
  rationale: « Rachetés » maintient la résonance biblique de la rédemption sans définir ici un mécanisme doctrinal plus précis que ne le fait le verset ; l’idée de prix demeure perceptible grâce à l’argent et à l’or.
- issue: Langage de la tradition héritée
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le grec nomme explicitement les pères, tandis que le contexte peut viser plus largement les ancêtres. Le texte conserve l’expression formelle et la note en signale la portée possible.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la forme participiale de l’original ainsi que sa virgule finale implicite, puisque le verset se poursuit. « Mode de vie » est courant et suffisamment large pour inclure la conduite façonnée par une tradition héritée.
