review_pass:
  verdict: approve
  source_fidelity: 'Le texte rend fidèlement les éléments grecs : le participe εἰδότες (« sachant que »), la rédemption/libération (ἐλυτρώθητε), la séparation d’avec l’ancienne conduite (ἐκ), le caractère vain de cette conduite (ματαίας ἀναστροφῆς), son caractère transmis par les pères (πατροπαραδότου), et le moyen explicitement exclu, les biens périssables tels que l’argent ou l’or. L’ordre français, qui place « non par des choses périssables » après le complément introduit par « du », reste clair et ne modifie pas la portée de la négation.'
  naturalness: Le français est moderne, fluide et d’un registre biblique sobre. « Sachant que vous avez été rachetés » conserve naturellement la valeur participiale sans imposer une relation causale plus forte. « Mode de vie futile » est idiomatique et suffisamment large pour ἀναστροφή.
  terminology: « Rachetés » rend bien λυτρόομαι tout en laissant percevoir l’imagerie de la rançon; la note fournit une alternative explicative appropriée sans surinterprétation doctrinale. « Vos pères » maintient la formulation paternalement marquée de πατροπαράδοτος; la note indique avec justesse la possibilité contextuelle de « vos ancêtres ». « Choses périssables » rend convenablement le substantif φθαρτοῖς.
