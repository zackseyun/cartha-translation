id: 1PE.1.16
reference: 1 Peter 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: fr
  text: 'car il est écrit[a] : « Vous serez saints, parce que moi, je suis saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus directement comme un impératif : « Soyez saints. » Le grec reprend la formulation de la citation biblique au futur : « Vous serez saints. »'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: car
  rationale: Introduit le fondement scripturaire de l’exhortation précédente; « car » exprime naturellement le lien causal dans ce contexte.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture; elle convient au parfait passif grec et à la valeur durable de l’écrit cité.
- source_word: ὅτι (premier)
  choice: marqué par les deux-points et les guillemets
  rationale: Le premier ὅτι introduit la citation directe; en français moderne, la ponctuation en remplit naturellement la fonction.
- source_word: Ἅγιοι
  choice: saints
  rationale: « Saints » rend le sens éthique et relationnel de ἅγιοι dans cette citation, sans le réduire à la seule idée de mise à part.
- source_word: ἔσεσθε
  choice: vous serez
  rationale: Conserve la forme future de la citation grecque et sa force d’injonction dans le langage scripturaire, sans la transformer silencieusement en impératif.
- source_word: ὅτι (second)
  choice: parce que
  rationale: Exprime clairement que la sainteté de Dieu fonde l’appel adressé aux destinataires.
- source_word: ἐγὼ
  choice: moi, je
  rationale: La tournure disloquée française rend l’insistance du pronom grec explicite tout en restant naturelle.
- source_word: ἅγιος
  choice: saint
  rationale: Maintient la correspondance lexicale avec « saints » et relie directement la sainteté des destinataires à celle de Dieu.
theological_decisions:
- issue: Valeur du futur ἔσεσθε dans la citation sur la sainteté
  choice: « Vous serez saints »
  alternative: « Soyez saints » ou « Vous deviendrez saints »
  rationale: Le futur grec reprend la formulation scripturaire et peut avoir une force injonctive. Le conserver préserve à la fois la forme intertextuelle et la tension entre affirmation et commandement; « deviendrez » introduirait une nuance de progression absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Il est écrit » conserve la formule biblique usuelle; la citation reste immédiatement compréhensible. Le pronom emphatique grec est rendu par « moi, je ».
