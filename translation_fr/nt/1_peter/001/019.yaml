id: 1PE.1.19
reference: 1 Peter 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: fr
  text: mais par le sang précieux du Messie[a], comme celui d’un agneau sans défaut et sans tache,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ ». Le titre grec Χριστός signifie « Messie »; « Christ » est sa traduction traditionnelle en français.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque le contraste fort avec la négation du verset précédent (« non par des choses périssables… mais… »).
- source_word: τιμίῳ
  choice: précieux
  rationale: Exprime la grande valeur et l’honneur, tout en conservant le registre élevé du grec.
- source_word: αἵματι
  choice: sang
  rationale: Traduction concrète et directe; l’idée de mort sacrificielle reste implicite plutôt que de remplacer le terme grec.
- source_word: ὡς
  choice: comme celui d’un
  rationale: Rend clairement la comparaison entre le sang du Messie et celui d’un agneau, dans un français naturel.
- source_word: ἀμνοῦ
  choice: agneau
  rationale: Équivalent direct qui conserve les résonances sacrificielles du contexte.
- source_word: ἀμώμου
  choice: sans défaut
  rationale: Correspond au vocabulaire des victimes sacrificielles acceptables et évite de réduire le terme à une qualité morale.
- source_word: καὶ
  choice: et
  rationale: Coordonne simplement les deux qualificatifs.
- source_word: ἀσπίλου
  choice: sans tache
  rationale: Préserve la distinction et le parallélisme entre les deux adjectifs grecs.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Rend le sens du titre Χριστός de manière transparente; en français, l’article défini est naturel devant « Messie ».
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le mot fonctionne ici comme un titre messianique. « Messie » en rend le sens directement, tandis que « Christ » demeure la formulation traditionnelle et figure en note.
- issue: Portée de la comparaison introduite par ὡς
  choice: « comme celui d’un agneau » rapporte explicitement la comparaison au sang
  alternative: « comme d’un agneau »
  rationale: Cette formulation française évite de donner l’impression que le Messie est seulement comparé de façon indéterminée à un agneau, tout en conservant l’imagerie sacrificielle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure syntaxiquement liée au verset précédent, comme dans le grec. Le parallélisme « sans défaut et sans tache » conserve le registre sacrificiel sans explicitation doctrinale ajoutée.
