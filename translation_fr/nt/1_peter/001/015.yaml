id: 1PE.1.15
reference: 1 Peter 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: fr
  text: mais, de même que celui qui vous a appelés est saint, soyez saints[a], vous aussi, dans toute votre conduite[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devenez saints ». Le verbe grec peut souligner l’entrée dans cet état ou sa manifestation.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans toute votre manière de vivre ». Le terme grec désigne l’ensemble de la conduite d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque le contraste avec les désirs d’autrefois évoqués au verset précédent.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: de même que celui qui vous a appelés est saint
  rationale: κατά exprime ici la conformité au modèle donné par Dieu. La proposition française rend explicitement et naturellement la sainteté de celui qui appelle, sans transformer ἅγιον en titre divin absent du grec.
- source_word: καὶ αὐτοὶ
  choice: vous aussi
  rationale: Rend καί et l’insistance portée par αὐτοί, avec une tournure française naturelle.
- source_word: ἅγιοι
  choice: saints
  rationale: Conserve la répétition lexicale de ἅγιος et le lien direct entre la sainteté de Dieu et celle demandée aux destinataires.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: dans toute votre conduite
  rationale: ἀναστροφή désigne l’ensemble de la manière de vivre ou de se conduire; « conduite » est concis, actuel et moralement pertinent.
- source_word: γενήθητε
  choice: soyez
  rationale: L’impératif français « soyez » exprime naturellement l’exhortation. La nuance possible d’entrée dans un état portée par γίνομαι est signalée en note.
theological_decisions:
- issue: Rapport entre la sainteté de Dieu et l’appel adressé aux croyants
  choice: de même que celui qui vous a appelés est saint, soyez saints
  alternative: à l’image de celui qui vous a appelés, le Saint, devenez saints
  rationale: La formulation retenue préserve la correspondance voulue par κατά et la répétition de ἅγιος, sans faire de l’adjectif « saint » un titre propre ni ajouter une explication causale.
- issue: Valeur de l’impératif γενήθητε
  choice: soyez saints
  alternative: devenez saints
  rationale: « Soyez saints » est l’exhortation la plus naturelle en français et ne tranche pas en faveur d’un modèle particulier de sanctification; « devenez » reste une possibilité lexicale réelle, indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe comparative explicite naturellement la sainteté de celui qui appelle. La virgule autour de « vous aussi » conserve l’insistance sans lourdeur.
