id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: fr
  text: mais la parole du Seigneur demeure pour toujours. » Or, cette parole, c’est la bonne nouvelle qui vous a été annoncée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la parole qui vous a été annoncée comme bonne nouvelle ».'
    reason: Variante plus formelle qui maintient explicitement ῥῆμα comme antécédent du participe εὐαγγελισθέν.
lexical_decisions:
- source_word: ῥῆμα
  choice: parole
  rationale: « Parole » convient à une parole dite ou à un message et préserve l’écho direct d’Ésaïe 40.8 ainsi que la reprise du même terme dans les deux propositions.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le génitif indique l’appartenance ou l’origine. « Du Seigneur » est la formulation française naturelle et respecte le titre κύριος sans surinterpréter son référent.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » exprime la permanence continue indiquée par μένω, dans un registre digne mais encore courant.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette locution idiomatique exprime une durée sans fin; « pour toujours » est clair et naturel en français moderne.
- source_word: τοῦτο δέ ἐστιν
  choice: Or, cette parole, c’est
  rationale: δέ introduit ici une transition légère vers l’application de la citation. La reprise explicite de « parole » rend le lien naturel en français.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: la bonne nouvelle qui a été annoncée
  rationale: Cette formulation conserve la valeur verbale d’εὐαγγελίζω, « annoncer une bonne nouvelle », tout en produisant une phrase française naturelle et accessible.
- source_word: εἰς ὑμᾶς
  choice: qui vous a été annoncée
  rationale: Avec εὐαγγελίζω, εἰς ὑμᾶς désigne les destinataires de l’annonce. Le pronom indirect « vous » est l’équivalent idiomatique en français.
theological_decisions:
- issue: Rapport entre « la parole du Seigneur » dans la citation d’Ésaïe 40.8 et son application à la proclamation chrétienne
  choice: Conserver « la parole du Seigneur » dans la citation, puis l’identifier à « la bonne nouvelle » annoncée aux destinataires.
  alternative: Employer partout « le message venant du Seigneur ».
  rationale: La formulation retenue maintient à la fois l’écho scripturaire et l’application explicite faite par Pierre, sans réduire d’avance la portée de « parole » à une paraphrase interprétative.
- issue: Traduction d’εὐαγγελισθέν
  choice: Employer explicitement « la bonne nouvelle qui vous a été annoncée ».
  alternative: « la parole qui vous a été prêchée comme Évangile »
  rationale: Le choix retenu rend clairement le sens verbal de l’annonce d’une bonne nouvelle, sans jargon ecclésiastique ni ajout doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. La minuscule initiale et le guillemet fermant signalent que le verset commence au milieu de la citation amorcée au verset précédent. « Demeure » conserve une légère solennité biblique sans archaïsme marqué.
