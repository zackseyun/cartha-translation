id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: fr
  text: Pierre, apôtre de Jésus le Messie, à ceux qui ont été choisis et qui vivent comme des étrangers[a] dans la dispersion[b], dans le Pont, la Galatie, la Cappadoce, l’Asie[c] et la Bithynie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui séjournent comme étrangers » ou « résidents étrangers ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « dans la dispersion » peut évoquer à la fois la Diaspora juive et, plus largement, le peuple de Dieu vivant loin de sa véritable patrie.
    reason: cultural_note
  - marker: c
    text: Ici, « l’Asie » désigne la province romaine d’Asie, dans l’ouest de l’actuelle Turquie, et non le continent asiatique.
    reason: cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom grec Πέτρος.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Le terme désigne ici la fonction reconnue de l’auteur et son autorité d’envoyé de Jésus, plutôt qu’un simple messager.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve sa valeur de titre messianique; l’article français rend cette construction naturelle sans transformer « Messie » en nom de famille.
- source_word: ἐκλεκτοῖς
  choice: ceux qui ont été choisis
  rationale: Cette formulation moderne exprime l’action de choisir sans imposer les connotations doctrinales que peut porter le substantif « élus ».
- source_word: παρεπιδήμοις
  choice: qui vivent en étrangers
  rationale: La formulation exprime la condition de personnes établies provisoirement hors de leur patrie ou n’appartenant pas pleinement au monde où elles résident, tout en restant naturelle en français.
- source_word: διασπορᾶς
  choice: dans la dispersion
  rationale: Le mot « dispersion » préserve l’écho possible de la Diaspora juive ainsi que le sens plus large d’un peuple disséminé, sans trancher entre ces dimensions.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: dans le Pont, la Galatie, la Cappadoce, l’Asie et la Bithynie
  rationale: Les formes géographiques françaises usuelles sont retenues; « dans » explicite naturellement la valeur géographique de la série de génitifs.
theological_decisions:
- issue: Portée de ἐκλεκτοῖς
  choice: ceux qui ont été choisis
  alternative: les élus
  rationale: Le texte affirme clairement que les destinataires sont choisis, mais ne précise pas ici un système doctrinal particulier; la périphrase conserve l’affirmation sans la surcharger.
- issue: Sens de παρεπιδήμοις διασπορᾶς
  choice: des personnes vivant réellement en étrangers, avec une possible portée théologique
  alternative: soit uniquement des membres de la Diaspora juive, soit uniquement des exilés spirituels
  rationale: La traduction maintient ensemble le cadre social et géographique et sa résonance théologique, sans réduire l’expression à une seule lecture.
- issue: Valeur de Χριστοῦ
  choice: Messie
  alternative: Christ
  rationale: Dans cette désignation de Jésus, Χριστός garde une valeur titulaire; « Messie » rend explicitement cette portée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe épistolaire reste ouverte, conformément à la phrase grecque qui se poursuit au verset suivant. « Vivent en étrangers » évite le ton administratif de « résidents étrangers » et le caractère vieilli de certaines formulations traditionnelles.
