revisions:
- from: Au sujet de ce salut, les prophètes qui ont annoncé d’avance la grâce qui vous était destinée[a] ont fait des recherches et mené une enquête approfondie.
  to: Au sujet de ce salut, les prophètes qui ont prophétisé au sujet de la grâce pour vous se sont livrés à des recherches et à des investigations approfondies.
  rationale: La révision rend εἰς ὑμᾶς par « pour vous », qui conserve la direction ou le bénéfice sans imposer une destination temporelle ou théologique. Elle remplace aussi « annoncé d’avance » par « prophétisé » et maintient l’intensification des deux verbes de recherche dans une expression française idiomatique. La note devient inutile, puisque le texte adopte la formulation qui correspond directement au grec.
