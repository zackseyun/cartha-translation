review_pass:
  verdict: revise
  source_fidelity: La traduction de « salut », de la double recherche des prophètes et de « grâce » est globalement fidèle. Toutefois, « qui vous était destinée » dépasse εἰς ὑμᾶς (« pour vous / envers vous ») en introduisant une destination formulée de manière plus déterminée, ainsi qu’un imparfait absent du grec. La note reconnaît à juste titre que l’orientation future n’est pas explicitement exprimée; le texte doit donc éviter de l’expliciter.
  naturalness: La phrase révisée reste fluide dans un français international moderne. « Se sont livrés à des recherches et à des investigations approfondies » est soutenu mais naturel et rend distinctement les deux verbes grecs sans le ton administratif un peu marqué de « mené une enquête ».
  terminology: « Salut », « prophètes » et « grâce » sont les termes appropriés. « Ont prophétisé au sujet de » restitue directement προφητεύσαντες περὶ sans ajouter la nuance temporelle de « annoncé d’avance ».
  issues:
  - severity: medium
    issue: « la grâce qui vous était destinée » ajoute une formulation de destination et un repère temporel non exprimés par εἰς ὑμᾶς.
    rationale: Le grec indique la grâce orientée vers les destinataires, littéralement « la grâce pour vous / envers vous ». Le contexte peut suggérer une orientation future, mais le verset ne l’énonce pas; la formulation actuelle réduit donc une ambiguïté que le texte source conserve.
  - severity: low
    issue: « ont annoncé d’avance » interprète προφητεύσαντες plutôt que de le rendre directement.
    rationale: Le verbe signifie « prophétiser »; l’idée d’annonce préalable est contextuellement possible, mais n’est pas nécessaire dans la traduction et peut suggérer plus explicitement une temporalité que le grec ne formule pas ici.
  revised_text: Au sujet de ce salut, les prophètes qui ont prophétisé au sujet de la grâce pour vous se sont livrés à des recherches et à des investigations approfondies.
  revised_footnotes: []
