source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: fr
  text: Au sujet de ce salut, les prophètes qui ont prophétisé au sujet de la grâce pour vous se sont livrés à des recherches et à des investigations approfondies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Au sujet de ce salut
  rationale: περί avec le génitif introduit le sujet, et le relatif ἧς renvoie au salut mentionné dans le contexte précédent. « Ce salut » restitue naturellement cette reprise en français.
- source_word: σωτηρίας
  choice: salut
  rationale: Dans ce contexte, σωτηρία porte le sens théologique de salut tout en gardant son arrière-plan de délivrance.
- source_word: ἐξεζήτησαν
  choice: ont fait des recherches
  rationale: Le verbe exprime une recherche soutenue; cette formulation française reste naturelle et se distingue du verbe suivant.
- source_word: ἐξηραύνησαν
  choice: mené une enquête approfondie
  rationale: Le verbe évoque un examen poussé. « Approfondie » rend l'intensification produite par la coordination des deux verbes.
- source_word: προφῆται
  choice: les prophètes
  rationale: Le groupe est déterminé par le participe attributif qui suit; l'article défini est naturel en français.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: qui ont annoncé d’avance la grâce qui vous était destinée
  rationale: Le participe qualifie les prophètes et περί en indique le contenu. « Annoncé d’avance » exprime ici naturellement l'activité prophétique sans alourdir la phrase.
- source_word: χάριτος
  choice: grâce
  rationale: « Grâce » conserve le vocabulaire théologique courant et désigne ici la faveur salvatrice de Dieu.
- source_word: εἰς ὑμᾶς
  choice: qui vous était destinée
  rationale: εἰς ὑμᾶς marque l'orientation de la grâce vers les destinataires. Cette tournure est idiomatique, mais sa nuance temporelle implicite est signalée en note.
theological_decisions:
- issue: Faut-il expliciter une orientation future dans « la grâce envers vous » ?
  choice: Employer « la grâce qui vous était destinée » dans le texte, en signalant l'expression plus littérale en note
  alternative: la grâce pour vous / la grâce qui devait venir jusqu’à vous
  rationale: Le grec n'exprime pas explicitement le futur, mais le contexte prophétique implique une grâce orientée vers les lecteurs. « Était destinée » rend cette orientation sans affirmer aussi directement une venue future; la note préserve la formulation plus proche de la structure grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l'antéposition du thème (« Au sujet de ce salut »), les deux verbes de recherche et le vocabulaire théologique de « salut » et de « grâce ».
