    rationale: Cette tournure présente les souffrances comme réservées au Messie et devant nécessairement être endurées par lui. Bien que cette lecture soit contextuellement plausible, la préposition εἰς est disputée et appelle une formulation principale plus ouverte, avec l’alternative possessive en note.
  - severity: low
    issue: « lorsqu’il attestait d’avance » donne au participe προμαρτυρόμενον une nuance temporelle appuyée.
    rationale: Le participe explique plutôt le mode ou le contenu de l’indication de l’Esprit. « En attestant d’avance » conserve le témoignage anticipé sans ajouter de séquence temporelle.
