source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: fr
  text: Ils cherchaient à découvrir quelle personne ou quelle époque l’Esprit du Messie qui était en eux indiquait, en attestant d’avance les souffrances concernant le Messie[a] et les gloires qui les suivraient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les souffrances du Messie ».'
    reason: La construction grecque τὰ εἰς Χριστὸν παθήματα est discutée. Cette lecture traditionnelle et contextuellement forte demeure possible.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: Ils cherchaient à découvrir
  rationale: Le participe prolonge l’activité des prophètes décrite au verset précédent. Cette formulation naturelle conserve l’idée d’une recherche attentive.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: quelle personne ou quelle époque
  rationale: La formulation grecque est difficile. τίνα est compris comme visant une personne, tandis que ποῖον καιρόν vise une époque ou un temps déterminé; la traduction maintient les deux objets possibles de leur recherche.
- source_word: ἐδήλου
  choice: indiquait
  rationale: L’imparfait exprime une indication en cours. « Indiquait » reste direct et ne donne pas au verbe un degré de clarté supérieur à celui du grec.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: l’Esprit du Messie qui était en eux
  rationale: La traduction conserve explicitement l’association de l’Esprit avec le Messie ainsi que sa présence dans les prophètes. Χριστός est rendu comme un titre par « Messie ».
- source_word: προμαρτυρόμενον
  choice: lorsqu’il attestait d’avance
  rationale: Cette expression préserve à la fois la notion de témoignage et la valeur temporelle du préfixe προ-.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: les souffrances qui attendaient le Messie
  rationale: Cette formulation rend naturellement le rapport exprimé par εἰς sans le réduire silencieusement à un simple possessif. L’autre compréhension importante est signalée en note.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: les gloires qui les suivraient
  rationale: Le pluriel « gloires » est conservé, et la relation temporelle avec les souffrances est exprimée clairement en français.
theological_decisions:
- issue: Rapport entre l’Esprit du Messie et les prophètes
  choice: Conserver « l’Esprit du Messie qui était en eux »
  alternative: L’Esprit prophétique qui parlait du Messie
  rationale: Le grec présente directement l’Esprit associé au Messie comme présent et actif dans les prophètes. Une paraphrase réduirait cette portée théologique.
- issue: Valeur de εἰς dans τὰ εἰς Χριστὸν παθήματα
  choice: « les souffrances qui attendaient le Messie » dans le texte principal
  alternative: « les souffrances du Messie »
  rationale: La construction peut désigner les souffrances dirigées vers le Messie, réservées pour lui ou lui appartenant. Le texte principal garde la nuance prépositionnelle, tandis que la note préserve la lecture possessive traditionnelle et contextuellement forte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase grecque tout en évitant une tournure artificielle. Le pluriel « gloires » et l’ambiguïté réelle concernant les souffrances sont conservés.
