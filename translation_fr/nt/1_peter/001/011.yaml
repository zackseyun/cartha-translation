revisions:
- from: Ils cherchaient à découvrir quelle personne ou quelle époque l’Esprit du Messie qui était en eux indiquait, lorsqu’il attestait d’avance les souffrances qui attendaient le Messie[a] et les gloires qui les suivraient.
  to: Ils cherchaient à découvrir quelle personne ou quelle époque l’Esprit du Messie qui était en eux indiquait, en attestant d’avance les souffrances concernant le Messie[a] et les gloires qui les suivraient.
  rationale: La révision retire une interprétation trop étroite des souffrances tout en conservant, dans la note, la lecture selon laquelle elles sont celles du Messie. Elle rend également le participe préfixé προμαρτυρόμενον de manière plus directement explicative et garde la terminologie messianique, le pluriel « gloires » et la relation de succession.
