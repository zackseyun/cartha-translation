source:
  edition: SBLGNT
  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: fr
  text: vous qui êtes nés de nouveau[a], non d’une semence périssable, mais d’une semence impérissable, par la parole vivante et permanente de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la parole du Dieu vivant et permanent ». En grec, les participes traduits par « vivante » et « permanente » peuvent se rapporter soit à « parole », soit à « Dieu »; le contexte favorise leur rattachement à « parole ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: vous qui êtes nés de nouveau
  rationale: Le participe parfait passif désigne une action accomplie dont l’effet demeure. Cette tournure conserve la valeur participiale et le passif tout en s’intégrant naturellement au contexte français.
- source_word: σπορᾶς
  choice: semence
  rationale: « Semence » convient à la métaphore de la naissance et permet de maintenir clairement l’opposition entre ce qui est périssable et impérissable.
- source_word: φθαρτῆς
  choice: périssable
  rationale: Équivalent moderne et direct, qui forme une opposition lexicale nette avec « impérissable ».
- source_word: ἀφθάρτου
  choice: impérissable
  rationale: Préserve exactement le contraste avec φθαρτῆς dans un français naturel.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif, διά marque ici le moyen. « Par » est la formulation française la plus concise et idiomatique.
- source_word: λόγου
  choice: parole
  rationale: « Parole » conserve le sens lexical et biblique de λόγος; « message » serait possible, mais plus interprétatif.
- source_word: ζῶντος
  choice: vivante
  rationale: Le participe présent employé adjectivement est rendu directement; l’accord avec « parole » reflète la lecture contextuellement privilégiée.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu naturellement comme un complément de « parole », sans préciser davantage s’il exprime possession ou origine.
- source_word: μένοντος
  choice: permanente
  rationale: Exprime la continuité et la durée de μένω en français actuel. « Demeurant » serait plus formel mais moins idiomatique ici.
theological_decisions:
- issue: Rattachement de ζῶντος et μένοντος à λόγου ou à θεοῦ
  choice: « la parole vivante et permanente de Dieu »
  alternative: « la parole du Dieu vivant et permanent »
  rationale: Les deux participes au génitif masculin singulier peuvent grammaticalement se rattacher à « parole » ou à « Dieu ». Le contexte immédiat, surtout le verset 25 et son insistance sur la permanence de la parole, favorise leur rattachement à λόγου. L’autre lecture demeure possible et est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise de « semence » dans les deux membres rend l’opposition plus claire en français. « Permanente » évite l’archaïsme possible de « demeurante » tout en préservant l’idée de durée.
