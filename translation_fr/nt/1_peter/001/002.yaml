id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: fr
  text: 'selon la prescience de Dieu le Père[a], dans la sanctification de l’Esprit[b], pour l’obéissance et l’aspersion du sang[c] de Jésus le Messie[d] : que la grâce et la paix vous soient multipliées !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Prescience » traduit πρόγνωσις. Le terme peut mettre l’accent sur la connaissance préalable de Dieu, sur son choix préalable, ou sur les deux à la fois.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « par l’action sanctifiante de l’Esprit ».'
    reason: translation_alternative
  - marker: c
    text: L’expression « aspersion du sang » évoque probablement les images d’alliance et de purification de l’Ancien Testament, notamment Exode 24.8.
    reason: cross_reference
  - marker: d
    text: Ou « Jésus Christ ». Le titre grec Χριστός peut fonctionner presque comme un nom propre ; « Messie » en préserve ici le sens titulaire.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: selon la prescience
  rationale: κατά avec l’accusatif exprime ici la conformité ou la norme. « Prescience » conserve l’idée de connaissance préalable sans trancher entre connaissance anticipée, choix préalable ou l’articulation des deux.
- source_word: θεοῦ πατρός
  choice: de Dieu le Père
  rationale: Cette formulation française naturelle conserve la relation appositionnelle des deux génitifs grecs.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: dans la sanctification de l’Esprit
  rationale: La traduction reste proche de la construction grecque et conserve le terme théologique ἁγιασμός, tout en laissant ouverte la nuance exacte du génitif πνεύματος.
- source_word: εἰς ὑπακοὴν
  choice: pour l’obéissance
  rationale: εἰς indique ici le but ou le résultat visé ; « pour » rend cette orientation sans l’expliciter davantage.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: et l’aspersion du sang
  rationale: « Aspersion » rend précisément ῥαντισμός et préserve l’écho cultuel et allianciel de l’expression grecque.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jésus le Messie
  rationale: Χριστός garde ici sa portée de titre. « Jésus le Messie » est idiomatique en français et rend explicite cette valeur titulaire sans ajouter de contenu doctrinal.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Que la grâce et la paix vous soient accordées en abondance !
  rationale: L’optatif exprime un souhait ou une bénédiction. Cette tournure française actuelle et digne transmet l’idée d’une grâce et d’une paix multipliées sans calque maladroit.
theological_decisions:
- issue: Sens de πρόγνωσις dans son rapport à l’élection
  choice: « prescience », sans développement interprétatif
  alternative: « choix préalable », « dessein arrêté d’avance » ou « amour qui choisit d’avance »
  rationale: Le substantif grec désigne littéralement une connaissance préalable, mais sa portée théologique est discutée. La traduction conserve cette tension plutôt que d’imposer une doctrine particulière.
- issue: Référent de πνεύματος
  choice: « l’Esprit », compris comme l’Esprit saint
  alternative: « l’esprit », au sens de l’esprit humain ou d’un principe impersonnel
  rationale: La structure associant Dieu le Père, l’Esprit et Jésus le Messie favorise nettement la référence à l’Esprit saint. La majuscule le signale sans ajouter le mot « Saint », absent du grec.
- issue: Valeur de Χριστοῦ
  choice: le titre « le Messie »
  alternative: « Christ », forme devenue proche d’un nom propre
  rationale: Le rendu titulaire préserve le sens de Χριστός, l’Oint, tout en restant naturel en français.
- issue: Relation exprimée par πνεύματος dans ἁγιασμῷ πνεύματος
  choice: conserver la formulation « sanctification de l’Esprit »
  alternative: « sanctification opérée par l’Esprit »
  rationale: Le génitif peut être compris comme indiquant l’agent de la sanctification. La formulation retenue demeure transparente et évite d’expliciter dans le corps du texte une relation grammaticale seulement implicite.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste assez proche du grec dans la première proposition afin de préserver les relations théologiques et leur ambiguïté, tandis que la bénédiction finale est formulée idiomatiquement plutôt que calquée mot à mot.
