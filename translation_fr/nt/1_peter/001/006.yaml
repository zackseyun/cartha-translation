  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: fr
  text: Vous vous en réjouissez, même si, maintenant, pour peu de temps, s’il le faut, vous êtes attristés par diverses épreuves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mises à l’épreuve » ; selon le contexte, le terme grec peut aussi désigner des « tentations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: C’est là
  rationale: Renvoie naturellement en français à l’ensemble de l’espérance, de l’héritage et du salut évoqué précédemment, tout en conservant une certaine ouverture quant à l’antécédent exact.
- source_word: ἀγαλλιᾶσθε
  choice: votre joie
  rationale: La tournure nominale « C’est là votre joie » exprime une joie vive dans un français naturel et digne; elle évite le moins idiomatique « en quoi vous vous réjouissez ».
- source_word: ὀλίγον ἄρτι
  choice: maintenant, pour un peu de temps
  rationale: Conserve à la fois le caractère présent et la durée limitée de l’affliction.
- source_word: εἰ δέον
  choice: puisqu’il le faut peut-être
  rationale: Préserve ensemble l’idée de nécessité portée par δέον et la nuance conditionnelle de εἰ, sans préciser qui détermine cette nécessité.
- source_word: λυπηθέντες
  choice: vous êtes attristés
  rationale: Rend la valeur passive et la réalité émotionnelle du participe, dans une formulation française courante.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: par diverses épreuves
  rationale: Dans ce contexte de souffrance et de mise à l’épreuve de la foi, « épreuves » convient mieux que « tentations »; « par » rend naturellement la circonstance causant la tristesse.
theological_decisions:
- issue: Sens de πειρασμοῖς dans un contexte de souffrance
  choice: épreuves
  alternative: tentations; mises à l’épreuve
  rationale: Le contexte immédiat concerne l’affliction et la foi éprouvée. « Épreuves » désigne les difficultés subies sans réduire le terme à l’incitation au péché.
- issue: Nature de la nécessité exprimée par εἰ δέον
  choice: puisqu’il le faut peut-être
  alternative: si cela est nécessaire
  rationale: La formulation conserve la tension entre nécessité et condition sans attribuer explicitement les souffrances à une causalité divine particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste entre la joie et la tristesse présente, ainsi que l’ambiguïté de la nécessité conditionnelle.
