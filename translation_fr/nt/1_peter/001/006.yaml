revisions:
- from: C’est là votre joie[a], même si maintenant, pour un peu de temps, puisqu’il le faut peut-être, vous êtes attristés par diverses épreuves.
  to: Vous vous en réjouissez, même si, maintenant, pour peu de temps, s’il le faut, vous êtes attristés par diverses épreuves[a].
  rationale: La révision restitue ἀγαλλιᾶσθε par un verbe au présent et ἐν ᾧ par le pronom français « en », qui renvoie sans le préciser davantage au salut et à l’espérance évoqués auparavant. Elle remplace la causalité et l’incertitude ajoutées par « puisqu’il le faut peut-être » par la condition impersonnelle fidèle « s’il le faut ». Elle maintient la brièveté présente des afflictions et le sens contextuel d’« épreuves » pour πειρασμοῖς.
  reviewer_model: gpt-5.6-terra
