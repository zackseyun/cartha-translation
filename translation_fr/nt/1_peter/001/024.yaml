source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: fr
  text: car toute chair[a] est comme l’herbe, et toute sa gloire comme la fleur de l’herbe ; l’herbe s’est desséchée, et la fleur est tombée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’humanité ». Le grec dit littéralement « toute chair », expression qui souligne ici la fragilité et la mortalité humaines et fait écho à Ésaïe 40.6.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: car
  rationale: Introduit la raison scripturaire de l’affirmation précédente et conserve naturellement la valeur causale du grec.
- source_word: πᾶσα σὰρξ
  choice: toute chair
  rationale: Conserve l’image biblique de la chair mortelle et l’écho d’Ésaïe 40.6, sans donner ici à σάρξ le sens moral de « nature pécheresse ».
- source_word: ὡς χόρτος
  choice: est comme l’herbe
  rationale: Rend clairement la comparaison et le caractère passager de la vie humaine.
- source_word: πᾶσα δόξα αὐτῆς
  choice: toute sa gloire
  rationale: Le possessif renvoie à la « chair » prise collectivement ; « gloire » préserve la portée assez large de δόξα, qui peut évoquer l’éclat, la splendeur ou l’honneur.
- source_word: ὡς ἄνθος χόρτου
  choice: comme la fleur de l’herbe
  rationale: Reproduit l’image précise du grec plutôt que de la remplacer par la formule traditionnelle « fleur des champs ».
- source_word: ἐξηράνθη
  choice: s’est desséchée
  rationale: Respecte l’aoriste grec et décrit naturellement le dessèchement de l’herbe.
- source_word: ἐξέπεσεν
  choice: est tombée
  rationale: Rend sobrement la chute de la fleur sans ajouter explicitement une tige absente du texte.
theological_decisions:
- issue: Sens de σάρξ dans la citation sur la condition humaine
  choice: toute chair
  alternative: toute l’humanité
  rationale: Le passage traite de la fragilité et de la mortalité humaines, non d’une inclination morale au péché. La formulation littérale maintient aussi le lien avec Ésaïe 40.6.
translation_notes:
  register: Français international moderne, sobre et poétique. Le point-virgule maintient la citation en une seule phrase et suit son mouvement. « Toute chair » est volontairement conservé comme tournure biblique intelligible, avec une note explicative.
