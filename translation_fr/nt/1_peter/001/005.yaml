id: 1PE.1.5
reference: 1 Peter 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: fr
  text: vous qui êtes gardés par la puissance de Dieu, au moyen de la foi[a], en vue d’un salut prêt à être révélé au temps de la fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de la confiance » ; moins probablement ici, « au moyen de la fidélité ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « au dernier temps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: vous qui
  rationale: L’article reprend les destinataires mentionnés au verset précédent. « Vous qui » explicite naturellement ce lien en français sans modifier le référent.
- source_word: φρουρουμένους
  choice: êtes gardés
  rationale: Le participe présent passif exprime une action continue exercée sur les destinataires. « Êtes gardés » conserve la nuance de protection vigilante, voire militaire, de φρουρέω.
- source_word: ἐν δυνάμει θεοῦ
  choice: par la puissance de Dieu
  rationale: Dans cette construction passive, ἐν indique le moyen par lequel les destinataires sont gardés. Cette formulation est claire et idiomatique en français.
- source_word: διὰ πίστεως
  choice: au moyen de la foi
  rationale: διά avec le génitif marque ici le moyen. « Foi » demeure le rendu principal de πίστις, tandis que « confiance » et, moins probablement, « fidélité » sont signalées en note.
- source_word: εἰς σωτηρίαν
  choice: pour un salut
  rationale: εἰς indique le but ou l’aboutissement. L’article indéfini convient en français puisque « salut » est qualifié par la proposition qui suit et garde ici une orientation future.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: prêt à être révélé
  rationale: Cette formulation rend directement l’adjectif ἑτοίμην et l’infinitif passif ἀποκαλυφθῆναι, sans remplacer la révélation par un simple accomplissement.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: au temps de la fin
  rationale: καιρός désigne un temps décisif ou fixé. « Au temps de la fin » est naturel en français et maintient la portée eschatologique sans imposer un scénario doctrinal détaillé.
theological_decisions:
- issue: Rapport entre la préservation divine et la réponse humaine dans διὰ πίστεως
  choice: Dieu garde par sa puissance, et la foi est présentée comme le moyen par lequel cette garde s’exerce.
  alternative: Comprendre la foi comme un simple élément descriptif indépendant de la garde divine, ou rendre πίστις principalement par « fidélité ».
  rationale: La syntaxe attribue la garde à la puissance de Dieu tout en donnant à la foi un rôle médiateur. La traduction conserve ensemble ces deux affirmations sans trancher les débats confessionnels sur la persévérance ou l’apostasie.
- issue: Temporalité eschatologique du salut
  choice: Le salut envisagé ici doit encore être révélé dans sa plénitude au temps de la fin.
  alternative: Limiter ce salut à la conversion présente, ou affirmer qu’il ne possède aucune dimension présente ailleurs dans le Nouveau Testament.
  rationale: « Prêt à être révélé » oriente nettement le propos vers l’avenir, mais le verset ne définit pas à lui seul tous les aspects temporels du salut.
translation_notes:
  register: Français international moderne, clair et digne. La structure passive et la progression du grec sont conservées, avec des formulations idiomatiques. Les notes maintiennent les principales possibilités lexicales sans surcharger le texte.
