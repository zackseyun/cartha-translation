id: 1PE.1.22
reference: 1 Peter 1:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: fr
  text: Ayant purifié vos âmes par l’obéissance à la vérité, en vue d’un amour fraternel sincère[a], aimez-vous les uns les autres ardemment, du fond du cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un amour pour les autres croyants ». L’expression grecque traduite par « amour fraternel » désigne l’affection familiale entre croyants, femmes et hommes.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « d’un cœur pur ».
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: Ayant purifié
  rationale: Le participe parfait actif exprime une action accomplie dont l’effet demeure et qui précède l’impératif principal. La tournure participiale française conserve cette relation sans imposer une valeur causale.
- source_word: ψυχὰς
  choice: vos âmes
  rationale: « Âmes » est l’équivalent lexical direct et peut désigner ici les personnes dans leur vie intérieure, sans réduire ψυχή à une conception désincarnée.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: par l’obéissance à la vérité
  rationale: La préposition ἐν avec le datif peut indiquer le moyen ou la sphère. « Par » exprime naturellement en français le moyen de la purification, tout en maintenant le lien avec la réponse obéissante à la vérité.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: en vue d’un amour fraternel sincère
  rationale: εἰς marque ici le but ou le résultat. « En vue de » préserve cette nuance, tandis que « sincère » rend idiomatiquement l’idée d’absence d’hypocrisie.
- source_word: φιλαδελφίαν
  choice: amour fraternel
  rationale: Cette expression conserve la métaphore familiale du grec ainsi que sa distinction lexicale avec ἀγαπήσατε. Une note précise qu’elle englobe tous les croyants, femmes et hommes.
- source_word: ἀγαπήσατε ἀλλήλους
  choice: aimez-vous les uns les autres
  rationale: L’impératif aoriste appelle à aimer de manière résolue. La formulation réciproque est naturelle et digne en français.
- source_word: ἐκτενῶς
  choice: ardemment
  rationale: L’adverbe évoque un amour intense et soutenu. « Ardemment » transmet clairement cette force dans un registre actuel et digne.
- source_word: ἐκ καρδίας
  choice: du fond du cœur
  rationale: Cette expression française naturelle rend l’origine intérieure et la sincérité impliquées par le grec, sans ajouter l’adjectif « pur », absent du texte SBLGNT.
theological_decisions:
- issue: Distinction entre φιλαδελφία et ἀγαπάω dans le même verset
  choice: Rendre φιλαδελφία par « amour fraternel » et ἀγαπήσατε par « aimez »
  alternative: Employer simplement « amour » pour les deux termes
  rationale: La traduction conserve la texture rhétorique des deux expressions grecques sans leur attribuer une opposition théologique plus forte que celle qu’énonce le texte.
- issue: Portée genrée de φιλαδελφία
  choice: Conserver « amour fraternel » dans le texte et expliciter sa portée inclusive en note
  alternative: « amour pour les autres croyants » ou « amour entre frères et sœurs »
  rationale: « Amour fraternel » préserve la métaphore familiale et la distinction lexicale du grec. La note empêche de comprendre le terme comme limité aux hommes.
- issue: Variante textuelle après ἐκ καρδίας
  choice: Traduire le texte SBLGNT par « du fond du cœur », sans ajouter « pur »
  alternative: « d’un cœur pur »
  rationale: Le texte source fourni porte ἐκ καρδίας sans adjectif. La variante avec « pur » est signalée en note plutôt qu’introduite dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le participe initial et l’élan vers l’impératif principal. « Du fond du cœur » est idiomatique sans être familier; « ardemment » maintient l’intensité de l’exhortation.
