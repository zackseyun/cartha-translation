reference: 1 Peter 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: fr
  text: afin que l’authenticité éprouvée de votre foi — plus précieuse que l’or périssable, bien qu’éprouvé par le feu — se révèle être un sujet de louange, de gloire et d’honneur lors de la révélation de Jésus le Messie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mise à l’épreuve de votre foi » ; le terme grec peut mettre l’accent soit sur l’épreuve elle-même, soit sur l’authenticité qu’elle établit.
    reason: lexical_alternative
  - marker: b
    text: Ou « Jésus-Christ ». Ici, « le Messie » traduit le titre grec Christos selon son sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: authenticité éprouvée
  rationale: Le nom peut désigner la qualité reconnue comme authentique à l’issue d’une épreuve. Cette formulation française conserve à la fois l’idée d’épreuve et son résultat, tout en permettant de signaler en note le sens processuel possible.
- source_word: πίστεως
  choice: foi
  rationale: Dans ce contexte, le terme désigne naturellement la foi des croyants soumise aux épreuves.
- source_word: πολυτιμότερον χρυσίου
  choice: bien plus précieuse que l’or
  rationale: Le comparatif exprime une valeur supérieure; « bien plus précieuse » est naturel en français et maintient la comparaison explicite avec l’or.
- source_word: τοῦ ἀπολλυμένου
  choice: l’or périssable
  rationale: L’adjectif français rend avec naturel le caractère voué à disparaître exprimé par le participe, en contraste avec la valeur durable de la foi éprouvée.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: pourtant éprouvé par le feu
  rationale: « Éprouvé » préserve le lien lexical avec l’authenticité éprouvée de la foi; « pourtant » rend la valeur concessive de δέ dans cette construction.
- source_word: εὑρεθῇ εἰς
  choice: soit trouvée digne de
  rationale: Cette tournure conserve le passif de εὑρεθῇ et exprime idiomatiquement l’orientation vers la louange, la gloire et l’honneur, sans préciser qui les reçoit ou les accorde.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: louange, gloire et honneur
  rationale: Les équivalents français usuels préservent la triade et son ambiguïté quant au bénéficiaire ou à la source.
- source_word: ἐν ἀποκαλύψει
  choice: lors de la révélation
  rationale: 'La préposition a ici un sens temporel naturel: le résultat sera manifesté au moment de la révélation.'
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu selon le sens de son titre, « le Messie », dans une formulation française idiomatique.
theological_decisions:
- issue: Sens de τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: « l’authenticité éprouvée de votre foi », comprise comme la qualité authentique manifestée par l’épreuve
  alternative: « la mise à l’épreuve de votre foi », mettant l’accent sur le processus
  rationale: Le contexte de l’or éprouvé favorise le résultat attesté par l’épreuve, mais le nom grec peut aussi mettre l’accent sur le processus; cette possibilité est conservée en note.
- issue: Référent de « louange, gloire et honneur »
  choice: Ne pas préciser qui reçoit ou accorde la louange, la gloire et l’honneur
  alternative: L’honneur accordé aux croyants; la louange adressée à Dieu ou au Christ; une reconnaissance eschatologique englobant ces idées
  rationale: Le grec ne précise pas explicitement le référent. La traduction préserve cette tension au lieu d’imposer une interprétation doctrinale.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le rendu principal explicite le sens titulaire du grec; la forme française traditionnelle est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Les tirets isolent la comparaison avec l’or sans alourdir la phrase. « Authenticité éprouvée » maintient la densité théologique du grec tout en restant compréhensible; « soit trouvée digne de » conserve le passif et évite de trancher l’ambiguïté eschatologique de la triade.
