    issue: « soit trouvée digne de louange, de gloire et d’honneur »
    rationale: Cette formulation interprète εὑρεθῇ εἰς comme un jugement de mérite (« digne de »). Le grec ne dit pas que la foi est jugée digne de ces réalités, mais que son authenticité se trouvera/reconnaîtra comme étant en vue de la louange, de la gloire et de l’honneur. Elle risque aussi de réduire l’ambiguïté voulue sur le rapport exact à la triade.
  - severity: low
    issue: « bien plus précieuse »
    rationale: Le comparatif πολυτιμότερον signifie « plus précieuse »; « bien » renforce la comparaison sans appui explicite dans le texte source.
