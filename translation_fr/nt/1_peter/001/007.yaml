revisions:
- from: afin que l’authenticité éprouvée de votre foi — bien plus précieuse que l’or périssable, pourtant éprouvé par le feu — soit trouvée digne de louange, de gloire et d’honneur lors de la révélation de Jésus le Messie[a][b].
  to: afin que l’authenticité éprouvée de votre foi — plus précieuse que l’or périssable, bien qu’éprouvé par le feu — se révèle être un sujet de louange, de gloire et d’honneur lors de la révélation de Jésus le Messie[a][b].
  rationale: La révision remplace « soit trouvée digne de », qui ajoute une notion de mérite absente du grec, par « se révèle être un sujet de ». Cette expression rend naturellement εὑρεθῇ εἰς dans son orientation eschatologique, tout en laissant ouverte la question de savoir à qui se rapportent louange, gloire et honneur. « Bien » est également retiré afin de ne pas intensifier sans nécessité le comparatif grec.
  reviewer_model: gpt-5.6-terra
