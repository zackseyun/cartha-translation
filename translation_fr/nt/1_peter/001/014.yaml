id: 1PE.1.14
reference: 1 Peter 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: fr
  text: Comme des enfants d’obéissance[a], ne vous conformez pas aux désirs que vous aviez autrefois, dans votre ignorance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des enfants obéissants ». Le grec dit littéralement « enfants d’obéissance ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: ὡς
  choice: Comme
  rationale: Introduit la qualité ou la manière selon laquelle les destinataires doivent agir; « comme » rend naturellement cette valeur exhortative.
- source_word: τέκνα ὑπακοῆς
  choice: enfants d’obéissance
  rationale: 'Conserve la construction génitive marquée du grec et sa force identitaire: ces enfants sont caractérisés par l’obéissance. Une note donne la formulation française plus idiomatique.'
- source_word: μὴ συσχηματιζόμενοι
  choice: ne vous conformez pas
  rationale: Rend le participe présent moyen ou passif par une exhortation directe et naturelle en français, tout en exprimant la responsabilité morale des destinataires.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: aux désirs
  rationale: « Désirs » est moderne et suffisamment large; il évite de réduire le terme à sa seule dimension sexuelle, même si le contexte lui donne une valeur moralement négative.
- source_word: πρότερον
  choice: que vous aviez autrefois
  rationale: La reformulation adverbiale explicite en français le rapport avec les désirs qui caractérisaient leur vie passée.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: dans votre ignorance
  rationale: Suit de près la préposition et le possessif grecs sans préciser au-delà du texte l’objet exact de cette ignorance.
theological_decisions:
- issue: Faut-il lisser l’expression éthique τέκνα ὑπακοῆς en un simple adjectif?
  choice: enfants d’obéissance
  alternative: enfants obéissants
  rationale: La formulation retenue maintient la force identitaire du génitif et le parallélisme possible avec d’autres expressions bibliques du type « enfants de… », sans transformer cette caractérisation en affirmation doctrinale plus précise que le texte.
- issue: Valeur du participe μὴ συσχηματιζόμενοι
  choice: 'exhortation directe: « ne vous conformez pas »'
  alternative: 'construction participiale: « ne vous conformant pas »'
  rationale: L’impératif français restitue la portée parénétique du participe dans son contexte et évite une tournure isolée peu naturelle, sans trancher inutilement la question morphologique du moyen ou du passif.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure volontairement marquée « enfants d’obéissance » préserve l’image grecque; la suite emploie une exhortation directe, plus naturelle en français que le participe grec pris isolément.
