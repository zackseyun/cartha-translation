  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: fr
  text: 'en recevant l’aboutissement de votre foi[a] : le salut de vos âmes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fin », « le but » ou « le résultat de votre foi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le salut de vos vies » ou « le salut de vos personnes ». Le mot grec peut désigner les « âmes », les « vies » ou les « personnes », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: puisque vous recevez
  rationale: Le participe présent, rattaché aux destinataires dans le contexte précédent, exprime leur entrée en possession de ce vers quoi mène la foi. « Puisque vous recevez » rend naturellement en français la relation circonstancielle sans surinterpréter la voix grammaticale.
- source_word: τέλος
  choice: aboutissement
  rationale: « Aboutissement » exprime ici le résultat auquel conduit la foi et qui est reçu. Ce choix évite le sens seulement chronologique que pourrait suggérer « fin », tout en conservant l’idée de terme ou de résultat.
- source_word: πίστεως
  choice: foi
  rationale: Dans l’expression « votre foi », πίστις désigne le plus naturellement la foi des croyants. « Foi » est la traduction française directe et usuelle, sans exclure la dimension de confiance.
- source_word: ὑμῶν
  choice: votre
  rationale: Le pronom pluriel se rapporte textuellement à « foi » et se rend directement par le possessif français « votre », qui peut s’adresser à plusieurs personnes.
- source_word: σωτηρίαν
  choice: salut
  rationale: « Salut » est la traduction standard et contextuellement appropriée, qui préserve la portée théologique du terme sans la réduire à une délivrance particulière.
- source_word: ψυχῶν
  choice: âmes
  rationale: « Âmes » conserve la formulation grecque traditionnelle et directe. La note signale que ψυχή peut aussi désigner la vie ou la personne, afin de ne pas imposer une anthropologie dualiste au texte.
theological_decisions:
- issue: Sens de πίστις dans « votre foi »
  choice: foi
  alternative: confiance ; fidélité
  rationale: Le contexte désigne le plus naturellement la réponse croyante des destinataires. « Foi » préserve le terme théologique usuel sans préciser abusivement s’il faut mettre l’accent sur la confiance ou la fidélité.
- issue: Portée de ψυχαί dans « salut de vos âmes »
  choice: âmes
  alternative: vies ; personnes
  rationale: Le texte principal suit de près le grec, tandis que la note maintient l’étendue sémantique de ψυχή. Cette formulation ne doit pas être comprise comme excluant le corps du salut ni comme imposant un dualisme strict.
translation_notes:
  register: Français international moderne, naturel et digne. « Aboutissement » est accessible tout en conservant la densité du grec. Les deux marqueurs sont placés immédiatement après les expressions concernées.
