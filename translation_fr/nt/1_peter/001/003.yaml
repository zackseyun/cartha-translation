id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: fr
  text: Béni soit Dieu, le Père de notre Seigneur Jésus le Messie[a], qui, selon sa grande miséricorde, nous a fait naître de nouveau[b] pour une espérance vivante, par la résurrection de Jésus le Messie d’entre les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ». Le titre grec Χριστός est rendu ici par « le Messie » afin d’en préserver le sens.
    reason: alternative_reading
  - marker: b
    text: Ou « nous a donné une nouvelle naissance ». Le verbe grec conserve l’image du fait d’être engendré ou de naître de nouveau.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Béni soit
  rationale: La formule doxologique française « Béni soit » rend naturellement l’adjectif prédicatif et conserve la force de louange.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: le Dieu et Père
  rationale: L’article grec unique porte sur les deux noms. Cette formulation maintient leur unité relationnelle et la structure solennelle de la bénédiction.
- source_word: κυρίου
  choice: Seigneur
  rationale: Il s’agit ici du titre κύριος, rendu de manière directe et traditionnelle sans le réduire à une simple formule de politesse.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde sa valeur de titre. En français courant, l’article rend idiomatique l’expression « Jésus le Messie ».
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: selon sa grande miséricorde
  rationale: κατά avec l’accusatif exprime ici la mesure ou la norme de l’action divine. « Miséricorde » rend ἔλεος avec dignité et précision.
- source_word: ἀναγεννήσας
  choice: nous a fait naître de nouveau
  rationale: Cette formulation conserve l’image de la naissance renouvelée ainsi que Dieu comme agent explicite de l’action.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: pour une espérance vivante
  rationale: « Pour » exprime naturellement en français le but ou le résultat marqué par εἰς, tandis que « vivante » préserve l’image frappante de ζῶσαν.
- source_word: δι’ ἀναστάσεως
  choice: par la résurrection
  rationale: διά avec le génitif indique le moyen; « par » est ici la formulation française la plus fluide et précise.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française établie conserve la nuance de sortie hors du domaine ou du groupe des morts.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: « Messie » fait entendre le sens titulaire de Χριστός au lieu de le traiter uniquement comme un élément de nom. La variante traditionnelle « Christ » est signalée en note.
- issue: Agent de la nouvelle naissance dans ἀναγεννήσας
  choice: nous a fait naître de nouveau
  alternative: nous a donné une nouvelle naissance
  rationale: Le grec présente Dieu comme celui qui accomplit l’action. La traduction maintient cette initiative divine sans développer de système doctrinal au-delà du texte.
- issue: Rapport exprimé par εἰς ἐλπίδα ζῶσαν
  choice: pour une espérance vivante
  alternative: en vue d’une espérance vivante
  rationale: « Pour » laisse ouverte la nuance de but ou de résultat portée par εἰς, sans la préciser davantage que le grec.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la forme doxologique et le lien relatif du grec, tout en évitant les tournures inutilement archaïques. « Miséricorde » est maintenu comme terme biblique courant et intelligible; « d’entre les morts » préserve la nuance de ἐκ.
