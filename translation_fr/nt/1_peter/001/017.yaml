id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: fr
  text: Et si vous appelez Père[a] celui qui juge sans favoritisme selon l’œuvre de chacun, conduisez-vous avec crainte[b] pendant le temps où vous séjournez en étrangers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « invoquez comme Père ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec respect » ou « avec une profonde révérence ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pendant le temps de votre exil ». Le terme grec désigne la condition ou le séjour d’une personne étrangère ou résidente temporaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: appelez
  rationale: Dans cette construction avec πατέρα, le verbe désigne le fait de s’adresser à Dieu en l’appelant Père. « Appelez Père » est naturel en français et conserve la possibilité d’un appel adressé à Dieu, signalée en note.
- source_word: πατέρα
  choice: Père
  rationale: 'L’accusatif sans article a ici une fonction prédicative : les croyants s’adressent à Dieu comme Père. La majuscule indique qu’il s’agit de Dieu.'
- source_word: ἀπροσωπολήμπτως
  choice: sans favoritisme
  rationale: L’adverbe exprime un jugement qui ne tient pas compte du rang ni de l’apparence des personnes. « Sans favoritisme » est clair et idiomatique en français moderne.
- source_word: κρίνοντα
  choice: celui qui juge
  rationale: Le participe présent décrit Dieu de manière substantivée. La proposition relative française rend naturellement cette valeur et maintient l’aspect présent.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: selon l’œuvre de chacun
  rationale: κατά avec l’accusatif indique le critère du jugement. Le singulier ἔργον est conservé sans préciser davantage la nature ni le cadre doctrinal de cette évaluation.
- source_word: ἐν φόβῳ
  choice: avec crainte
  rationale: φόβος peut exprimer la crainte, le respect ou une profonde révérence. « Avec crainte » préserve la force du terme et la tension entre la paternité de Dieu et son jugement impartial.
- source_word: παροικίας
  choice: séjour comme étrangers
  rationale: Le nom désigne la condition de personnes qui résident provisoirement hors de leur patrie. Cette formulation française rend à la fois l’idée de séjour et celle de statut étranger, sans imposer celle d’un exil politique.
- source_word: ἀναστράφητε
  choice: conduisez-vous
  rationale: L’impératif porte sur la manière de mener sa vie. « Conduisez-vous » conserve sa force éthique tout en restant compréhensible en français actuel.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: pendant le temps de votre séjour comme étrangers
  rationale: L’accusatif χρόνον exprime la durée. La traduction garde explicitement la dimension temporelle ainsi que le motif du séjour à l’étranger.
theological_decisions:
- issue: Sens de φόβος à l’égard de Dieu, présenté à la fois comme Père et comme juge
  choice: Conserver « crainte » dans le texte principal
  alternative: « respect » ou « profonde révérence »
  rationale: Le lien avec le jugement impartial donne au terme une gravité qui ne doit pas être atténuée, tandis que la note reconnaît sa possible nuance de révérence. La traduction préserve ainsi la tension du texte.
- issue: Portée du jugement selon l’œuvre de chacun
  choice: Traduire directement « selon l’œuvre de chacun »
  alternative: Expliciter qu’il s’agit du jugement final, de la récompense des croyants ou d’un principe général d’évaluation divine
  rationale: Le grec affirme le caractère impartial du jugement et son rapport à l’œuvre de chacun, sans exposer ici un système doctrinal concernant le mérite, l’assurance ou les récompenses. Aucune précision confessionnelle n’est donc ajoutée.
translation_notes:
  register: Français international moderne, clair et digne. « Sans favoritisme » évite une tournure abstraite, tandis que « conduisez-vous avec crainte » conserve la solennité et la force morale de l’exhortation. La formulation « séjour comme étrangers » rend accessible le motif de la résidence temporaire sans employer l’archaïsme « séjour terrestre » ni surinterpréter la situation comme un exil politique.
