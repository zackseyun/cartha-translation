id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: fr
  text: C’est pourquoi, après avoir préparé votre intelligence à agir[a], gardez parfaitement l’esprit clair et mettez votre espérance dans la grâce qui vous est apportée lors de la révélation de Jésus le Messie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « ayant ceint les reins de votre intelligence » : image d’une personne qui relève son vêtement pour se préparer à agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de ce qui précède.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: après avoir retroussé les pans de votre intelligence
  rationale: Conserve l’image concrète d’un vêtement relevé en vue de l’action, tout en évitant l’expression peu intelligible « les reins de votre intelligence ».
- source_word: νήφοντες
  choice: gardez ... l’esprit clair
  rationale: Dans ce contexte explicitement mental, le participe appelle à la lucidité et à la maîtrise de soi plutôt qu’à l’abstinence littérale d’alcool.
- source_word: τελείως
  choice: parfaitement / toute
  rationale: L’adverbe exprime la plénitude. Sa portée syntaxique pouvant concerner la lucidité ou l’espérance, le texte français fait entendre les deux possibilités et la note les explicite.
- source_word: ἐλπίσατε ἐπὶ
  choice: mettez toute votre espérance dans
  rationale: Rend la force volontaire de l’impératif aoriste dans un français naturel.
- source_word: τὴν φερομένην ὑμῖν χάριν
  choice: la grâce qui vous est apportée
  rationale: Préserve le participe présent passif et sa perspective eschatologique sans le réduire à un simple futur.
- source_word: ἐν ἀποκαλύψει
  choice: lors de la révélation
  rationale: Exprime clairement le rapport temporel associé au dévoilement de Jésus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre; « le Messie » est idiomatique en français.
theological_decisions:
- issue: Conservation de la métaphore des reins ceints
  choice: Conserver l’image sous la forme « retroussé les pans de votre intelligence »
  alternative: « préparez votre intelligence à l’action »
  rationale: La formulation garde l’image de la tenue relevée pour agir, tandis que la note en donne le sens idiomatique.
- issue: Portée de τελείως
  choice: Faire entendre dans le texte la plénitude de la lucidité et de l’espérance
  alternative: Rattacher exclusivement l’adverbe soit à νήφοντες, soit à ἐλπίσατε
  rationale: La syntaxe grecque permet les deux rattachements; la traduction ne doit pas trancher silencieusement.
- issue: Rendu de Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Dans ce contexte eschatologique, le titre reste perceptible et ne fonctionne pas seulement comme un nom propre figé.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore originale est conservée sous une forme imagée plus intelligible; le vocabulaire théologique traditionnel « grâce », « révélation » et « Messie » est maintenu.
