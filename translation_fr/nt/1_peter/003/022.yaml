source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: fr
  text: lui qui est à la droite de Dieu, après être allé au ciel[a], les anges, les autorités et les puissances lui ayant été soumis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers le ciel ». Le grec dit plus littéralement : « dans le ciel », avec une idée de mouvement vers l’intérieur.'
    reason: La préposition grecque εἰς marque un mouvement vers ou dans; « au ciel » est plus idiomatique en français.
lexical_decisions:
- source_word: ὅς
  choice: lui qui
  rationale: Le pronom relatif renvoie à Jésus-Christ au verset précédent. « Lui qui » maintient ce lien tout en donnant en français une ouverture naturelle à ce fragment de phrase.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: à la droite de Dieu
  rationale: Cette expression française courante conserve l’image biblique d’une position d’honneur et d’autorité sans la réduire à une simple paraphrase.
- source_word: πορευθεὶς
  choice: après être allé
  rationale: Cette tournure exprime naturellement en français l’antériorité du participe aoriste par rapport au verbe principal.
- source_word: εἰς οὐρανόν
  choice: au ciel
  rationale: « Au ciel » est la formulation française naturelle pour ce mouvement, tandis qu’une note signale la valeur plus littérale de εἰς, « dans le ciel ».
- source_word: ὑποταγέντων
  choice: ayant été soumis
  rationale: Le participe passé passif conserve à la fois la voix passive, la subordination accomplie et la structure participiale du grec.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom indirect désigne celui à qui les êtres et puissances ont été soumis, sans ajouter l’image interprétative de les placer « sous » lui.
- source_word: ἀγγέλων
  choice: les anges
  rationale: Dans cette énumération de réalités célestes ou cosmiques, le terme désigne des êtres angéliques plutôt que des messagers humains.
- source_word: ἐξουσιῶν
  choice: les autorités
  rationale: « Autorités » conserve le sens habituel du terme dans les listes de puissances spirituelles et le distingue du terme suivant.
- source_word: δυνάμεων
  choice: les puissances
  rationale: « Puissances » rend le terme de façon concise et préserve la série de trois catégories sans préciser indûment leur nature.
theological_decisions:
- issue: Nature de l’exaltation du Christ à la droite de Dieu
  choice: Conserver l’expression biblique « à la droite de Dieu ».
  alternative: « dans la position d’honneur suprême auprès de Dieu »
  rationale: L’expression possède une portée spatiale, relationnelle et royale que la traduction ne doit pas réduire à une explication métaphorique.
- issue: Identité et caractère moral des anges, autorités et puissances
  choice: Conserver l’énumération générale sans préciser si ces réalités sont bonnes, mauvaises ou mixtes.
  alternative: Les interpréter explicitement comme des puissances angéliques hostiles.
  rationale: Le grec affirme leur soumission au Christ, mais ne les classe pas explicitement selon leur caractère moral.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve le lien relatif avec le verset précédent, l’image traditionnelle de la droite de Dieu et la construction participiale finale, sans ajouter de classification doctrinale aux puissances mentionnées.
