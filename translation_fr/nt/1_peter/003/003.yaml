review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : l’impératif négatif porte sur la parure extérieure, et les trois éléments de la liste correspondent au grec. Toutefois, la construction actuelle (« ne soit pas extérieure — cheveux tressés... ») juxtapose une épithète et des groupes nominaux sans exprimer clairement leur rapport syntaxique.'
  naturalness: « Cheveux tressés » après le tiret est elliptique et la phrase sonne inachevée autrement que par l’ouverture délibérée vers le verset 4. « Vêtements dont on se couvre » est aussi redondant en français. Une formulation avec « consiste » et des substantifs d’action est plus idiomatique tout en conservant le parallélisme grec.
  terminology: « Parure » rend justement κόσμος dans ce contexte. « Tressage », « port de bijoux en or » et « habillement » rendent avec précision les trois génitifs désignant des pratiques externes, sans qualifier indûment les vêtements de luxueux ni introduire « seulement ».
  issues:
