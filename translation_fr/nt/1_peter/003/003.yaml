    issue: Rapport syntaxique insuffisamment explicite entre « parure extérieure » et la liste.
    rationale: Le grec identifie la parure extérieure par les trois expressions génitives. En français, « Que votre parure ne soit pas extérieure — cheveux tressés... » ne relie pas naturellement ces exemples à l’assertion principale.
  - severity: low
    issue: « Vêtements dont on se couvre » est pléonastique.
    rationale: Tout vêtement est normalement ce dont on se couvre. « L’habillement » conserve la valeur d’action de ἐνδύσεως et se coordonne naturellement avec « tressage » et « port ».
  revised_text: Que votre parure ne consiste pas dans ce qui est extérieur — le tressage des cheveux[a], le port de bijoux en or ou l’habillement —
