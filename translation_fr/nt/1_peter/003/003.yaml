  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: fr
  text: Que votre parure ne consiste pas dans ce qui est extérieur — le tressage des cheveux[a], le port de bijoux en or ou l’habillement —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Que votre parure ne soit pas une parure extérieure faite de cheveux tressés, de bijoux en or ou de vêtements. » Le contraste avec le verset suivant met l’accent sur la parure intérieure, sans que le grec comporte ici le mot « seulement ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: votre
  rationale: Le pronom relatif au génitif pluriel renvoie aux femmes ou épouses interpellées au verset précédent. En français naturel, la valeur possessive se rend clairement par « votre ».
- source_word: ἔστω οὐχ
  choice: Que ... ne soit pas
  rationale: Cette tournure restitue naturellement l’impératif présent à la troisième personne et sa négation, tout en gardant sa force exhortative.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: votre parure ... extérieure
  rationale: Ici, κόσμος désigne la parure ou l’ornement, non le monde. ἔξωθεν la caractérise comme extérieure, en préparation du contraste avec l’être intérieur au verset suivant.
- source_word: ἐμπλοκῆς τριχῶν
  choice: cheveux tressés
  rationale: Formulation française concise et courante qui exprime l’action ou le résultat de tresser les cheveux.
- source_word: περιθέσεως χρυσίων
  choice: bijoux en or
  rationale: περίθεσις évoque le fait de mettre autour de soi, et χρυσίων des objets d’or servant d’ornements. « Bijoux en or » transmet naturellement l’idée en français moderne.
- source_word: ἢ
  choice: ou
  rationale: Conserve la simple disjonction qui articule le dernier élément de la liste.
- source_word: ἐνδύσεως ἱματίων
  choice: vêtements dont on se couvre
  rationale: La formulation conserve l’idée verbale de l’habillement exprimée par ἐνδύσεως, tout en évitant de réduire ἱμάτια à des vêtements nécessairement luxueux, nuance absente du texte grec.
theological_decisions:
- issue: Pierre interdit-il absolument la coiffure, les bijoux et les vêtements, ou subordonne-t-il la parure extérieure au caractère intérieur ?
  choice: Conserver la négation directe du grec tout en laissant le verset suivant établir le contraste et la priorité de l’être intérieur.
  alternative: Introduire « seulement » ou « uniquement » dans le texte afin d’expliciter d’emblée une lecture comparative.
  rationale: Le grec ne contient pas d’équivalent explicite de « seulement ». Cependant, le contraste immédiat avec le verset 4 indique que l’enjeu porte sur la nature véritable de la parure. La traduction préserve donc la tension du texte sans transformer la liste en interdiction doctrinale explicitée ni ajouter un comparatif absent.
translation_notes:
  register: Français international moderne, digne et accessible. « Parure » maintient le champ lexical de l’ornement et prépare le contraste du verset 4. La phrase reste ouverte par un tiret final parce que la construction se poursuit au verset suivant.
