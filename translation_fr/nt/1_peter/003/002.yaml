  text: ἐποπτεύσαντες τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/002.yaml
  text: when they observe your pure conduct in fear.
translation:
  language: fr
  text: en observant votre conduite pure dans la crainte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: lorsqu’ils auront observé
  rationale: Le participe aoriste exprime ici l’observation directe qui motive la réaction évoquée dans le contexte; la tournure temporelle s’intègre naturellement à la phrase française.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: la pureté de votre conduite
  rationale: ἁγνός évoque la pureté morale et ἀναστροφή la manière de vivre ou la conduite. Cette formulation est naturelle en français tout en conservant le sens du groupe grec.
- source_word: ἐν φόβῳ
  choice: dans la crainte
  rationale: La traduction conserve la préposition ἐν et l’ambiguïté de φόβος, sans préciser explicitement l’objet de cette crainte ni la réduire à un simple respect.
theological_decisions:
- issue: Objet et nuance de la crainte
  choice: dans la crainte
  alternative: dans le respect
  rationale: Le grec ne nomme pas explicitement l’objet de φόβος. « Dans la crainte » préserve la tension théologique et le lien possible avec la crainte de Dieu dans l’épître, sans l’imposer dans le texte.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe suppose la continuité avec 1 Pierre 3.1, puisque le grec transmis est un fragment participial et non une phrase autonome.
