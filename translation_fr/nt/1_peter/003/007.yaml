  naturalness: « Comme à un vase plus faible, le vase féminin » est compréhensible mais pesant. Une ponctuation appositive rend la métaphore et son qualificatif plus lisibles. La reprise de « vos femmes » et du pronom pluriel permet aussi une phrase française naturelle tout en suivant le pluriel attesté plus loin.
  terminology: « Maris », « honneur », « vase plus faible », « cohéritières », « grâce de la vie » et « prières entravées » sont défendables. « Avec discernement » est une solution française plus fluide pour κατὰ γνῶσιν; la note maintient les autres nuances possibles.
