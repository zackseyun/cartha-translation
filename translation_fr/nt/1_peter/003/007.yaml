id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: fr
  text: De même, maris, vivez avec vos femmes avec discernement[a], en leur accordant de l’honneur comme à un vase plus faible — le vase féminin[b] — et aussi comme à des cohéritières[c] de la grâce de la vie[d], afin que vos prières ne soient pas entravées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en connaissance de cause », « avec compréhension » ou « avec discernement ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « vase plus faible » décrit une faiblesse ou une vulnérabilité relative sans préciser sa nature. Elle n’implique pas une moindre valeur : la suite présente les femmes comme cohéritières de la grâce de la vie.'
    reason: cultural_note
  - marker: c
    text: 'Le grec emploie ici un pluriel : « comme à des cohéritières ».'
    reason: grammar_note
  - marker: d
    text: L’expression peut désigner la grâce qui consiste dans la vie ou la grâce qui donne la vie.
    reason: ambiguity_note
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: vous les maris
  rationale: Dans le contexte des recommandations adressées aux épouses en 3.1, le terme désigne les maris, non les hommes en général. La tournure française marque clairement l’adresse directe.
- source_word: ὁμοίως
  choice: De même
  rationale: Conserve le lien comparatif avec les exhortations précédentes sans préciser davantage la nature de cette correspondance.
- source_word: συνοικοῦντες
  choice: vivez avec votre femme
  rationale: Exprime naturellement la vie conjugale partagée. Le singulier générique français correspond à l’adresse collective faite aux maris.
- source_word: κατὰ γνῶσιν
  choice: en connaissance de cause
  rationale: Cette expression française naturelle évoque une conduite éclairée par la connaissance sans réduire celle-ci à la seule empathie ou à un savoir particulier.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: comme à un vase plus faible, le vase féminin
  rationale: Maintient à la fois le comparatif et la métaphore explicite de σκεῦος, sans transformer dans le texte principal cette faiblesse relative en une infériorité morale ou spirituelle.
- source_word: ἀπονέμοντες τιμήν
  choice: Accordez-lui de l’honneur
  rationale: Rend l’idée de donner ou d’attribuer l’honneur qui convient, dans un français actuel et digne.
- source_word: συγκληρονόμοις
  choice: comme à une cohéritière
  rationale: Exprime la participation de l’épouse au même héritage. Le singulier s’accorde avec le cadre générique de « votre femme » tout en conservant le rapport syntaxique introduit par ὡς.
- source_word: χάριτος ζωῆς
  choice: de la grâce de la vie
  rationale: 'Conserve la construction génitive et son amplitude : il peut s’agir de la grâce qui consiste dans la vie ou de celle qui la donne.'
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι
  choice: afin que … ne soient pas entravées
  rationale: Reproduit la valeur finale et la voix passive de l’expression grecque.
- source_word: τὰς προσευχὰς ὑμῶν
  choice: vos prières
  rationale: Rend directement le pluriel grec et le possessif de deuxième personne du pluriel.
theological_decisions:
- issue: Sens du « vase plus faible »
  choice: La métaphore comparative est conservée sans définir dans le texte principal la nature exacte de cette faiblesse.
  alternative: Expliciter une faiblesse physique, une vulnérabilité sociale ou une fragilité émotionnelle.
  rationale: Le grec ne précise pas le domaine de la faiblesse. Le commandement d’honorer l’épouse et l’affirmation de son statut de cohéritière excluent d’en déduire silencieusement une moindre dignité ou un statut spirituel inférieur.
- issue: Statut partagé dans l’héritage
  choice: L’épouse est présentée comme cohéritière de la grâce de la vie.
  alternative: Paraphraser « héritière avec son mari de la vie éternelle » ou « bénéficiaire du don de la vie ».
  rationale: La formulation retenue affirme clairement l’héritage partagé tout en évitant de déterminer plus précisément que le grec la portée de « la grâce de la vie ».
- issue: Rapport logique de ὡς καί devant συγκληρονόμοις
  choice: comme à une cohéritière
  alternative: « puisqu’elle est aussi cohéritière »
  rationale: La traduction conserve la comparaison et n’ajoute pas explicitement une valeur causale, même si le statut de cohéritière fonde manifestement l’honneur demandé.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset est réparti en deux phrases pour éviter une accumulation participiale peu naturelle en français, tout en conservant les rapports du grec. « Vase » maintient volontairement une métaphore ancienne, expliquée en note; « en connaissance de cause » fournit une formulation actuelle sans surinterpréter κατὰ γνῶσιν.
