- from: mais la personne cachée du cœur[a], dans la beauté impérissable[b] d’un esprit doux et paisible[c] — voilà ce qui est d’un grand prix devant Dieu.
  to: mais l’être intérieur[a], dans la beauté impérissable[b] d’un esprit doux et paisible[c], qui a une grande valeur aux yeux de Dieu.
  rationale: La révision remplace un calque français maladroit par « l’être intérieur », rendu naturel de la personne cachée du cœur. Elle conserve l’explicitation signalée de « beauté » et les termes théologiquement et lexicalement sobres « esprit doux et paisible ». La relative « qui a une grande valeur » reprend naturellement l’ensemble de la réalité intérieure décrite, sans trancher de manière excessive le référent précis du neutre grec ὅ.
