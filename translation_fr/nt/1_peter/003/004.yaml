id: 1PE.3.4
reference: 1 Peter 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: fr
  text: mais l’être intérieur[a], dans la beauté impérissable[b] d’un esprit doux et paisible[c], qui a une grande valeur aux yeux de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’être caché du cœur ». Le grec ἄνθρωπος peut désigner un homme ou, plus généralement, une personne ; ici, il renvoie à l’être intérieur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « dans l’impérissable d’un esprit doux et paisible ». Le mot « beauté » est explicité d’après le contraste avec la parure extérieure au verset précédent.
    reason: lexical_alternative
  - marker: c
    text: « Paisible » décrit ici une disposition calme et non querelleuse ; le terme grec n’impose pas l’idée de silence.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: la personne cachée du cœur
  rationale: Cette formulation conserve l’image grecque de la personne intérieure, invisible, sans donner à ἄνθρωπος un sens masculin que le contexte n’exige pas.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: dans la beauté impérissable
  rationale: Le grec substantivise l’adjectif et reste elliptique. « Beauté » est explicité d’après le contraste avec la parure extérieure au verset précédent, tandis qu’« impérissable » rend directement ἀφθάρτῳ.
- source_word: πραέως
  choice: doux
  rationale: « Doux » exprime naturellement la qualité de πραΰς en français moderne, sans suggérer faiblesse ou passivité.
- source_word: ἡσυχίου
  choice: paisible
  rationale: Dans ce contexte, ἡσύχιος désigne un caractère calme et non querelleur, pas nécessairement le fait de garder le silence. « Paisible » évite cette fausse implication.
- source_word: πνεύματος
  choice: esprit
  rationale: « Esprit » conserve le langage anthropologique du texte; « disposition » serait plus explicatif.
- source_word: ὅ ἐστιν
  choice: voilà ce qui est
  rationale: La tournure reprend en français l’ensemble de la qualité qui précède, conformément au pronom relatif neutre grec, sans le rattacher exclusivement au seul mot « esprit ».
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Traduction concise et directe de l’expression indiquant l’évaluation divine.
- source_word: πολυτελές
  choice: d’un grand prix
  rationale: Cette expression rend la très grande valeur indiquée par πολυτελές et convient au contraste implicite avec les parures coûteuses.
theological_decisions:
- issue: Expression anthropologique dans un contexte adressé aux femmes
  choice: Employer « la personne cachée du cœur » plutôt que « l’homme caché du cœur ».
  alternative: l’homme caché du cœur
  rationale: ἄνθρωπος désigne ici l’être intérieur et non une personne de sexe masculin. La traduction choisie maintient la portée humaine générale du terme.
- issue: Nom sous-entendu avec ἀφθάρτῳ
  choice: 'Expliciter « beauté » : « dans la beauté impérissable ».'
  alternative: dans ce qui est impérissable; dans la qualité impérissable
  rationale: Le grec est elliptique. Le contraste immédiat avec la parure extérieure permet d’expliciter « beauté », tout en signalant cette explicitation dans une note afin de préserver la tension du texte source.
- issue: Référent du relatif neutre ὅ
  choice: Rendre par « voilà ce qui est », en reprenant la qualité décrite dans son ensemble.
  alternative: lequel est, avec un rattachement grammatical au seul « esprit »
  rationale: Le neutre grec peut reprendre l’ensemble de l’élément impérissable ou de la qualité évoquée. La formulation française évite de réduire silencieusement son référent au seul nom « esprit ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve le « mais » qui relie le verset au contraste commencé en 1 Pierre 3.3. Le tiret rend lisible la reprise par ὅ sans effacer le caractère compact de la syntaxe grecque.
