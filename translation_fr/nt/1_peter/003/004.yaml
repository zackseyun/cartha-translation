  naturalness: Le registre est globalement digne et accessible. « L’être intérieur » est nettement plus idiomatique et immédiatement intelligible que « la personne cachée du cœur ». « Qui a une grande valeur aux yeux de Dieu » est plus naturel en français contemporain que « est d’un grand prix devant Dieu », tout en conservant l’idée de valeur élevée de πολυτελές.
