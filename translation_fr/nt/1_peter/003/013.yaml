  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: fr
  text: Et qui vous fera du mal si vous devenez zélés pour le bien[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleins d’ardeur pour le bien ».",
    reason: Alternative lexicale pour ζηλωταί, qui peut désigner des personnes animées d’un vif zèle pour le bien.
lexical_decisions:
- source_word: Καὶ
  choice: Et
  rationale: Connecteur neutre qui maintient le lien avec l’exhortation précédente sans introduire une opposition absente du texte.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: qui vous fera du mal
  rationale: Rend naturellement en français l’article suivi du participe futur substantivé, tout en conservant la forme rhétorique et la valeur future.
- source_word: ἐὰν
  choice: si
  rationale: Équivalent direct et naturel de la condition introduite avec le subjonctif.
- source_word: τοῦ ἀγαθοῦ
  choice: ce qui est bien
  rationale: Rend l’adjectif neutre substantivé de façon claire et courante, comme objet du zèle.
- source_word: ζηλωταὶ γένησθε
  choice: vous devenez zélés pour
  rationale: Préserve la force du nom ζηλωτής ainsi que la nuance de devenir portée par γένησθε, sans réduire l’expression à un simple état.
theological_decisions:
- issue: Portée de la question rhétorique face à la souffrance pour la justice
  choice: Conserver la question comme une assurance générale, sans en faire une promesse absolue d’absence de souffrance.
  alternative: Formuler une affirmation plus absolue selon laquelle personne ne pourrait réellement faire de mal aux croyants.
  rationale: Le contexte immédiat admet que les croyants puissent souffrir pour avoir fait le bien. La traduction garde donc la tension du texte sans l’expliquer ni la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire du mal » garde la portée large de κακόω; « zélés » conserve l’intensité lexicale, tandis que la note fournit des formulations françaises plus idiomatiques.
