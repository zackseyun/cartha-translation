id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: fr
  text: Mais même si vous deviez souffrir à cause de la justice, vous êtes heureux. Et ne craignez pas leur crainte[a], ne soyez pas non plus troublés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la crainte qu’ils inspirent » ou « ce qu’ils craignent ». L’expression grecque, qui fait écho à Ésaïe 8.12, peut recevoir l’un ou l’autre sens.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ
  choice: Mais, même si
  rationale: Cette formulation rend à la fois le contraste introduit par ἀλλά et la valeur concessive de εἰ καί.
- source_word: πάσχοιτε
  choice: vous deviez souffrir
  rationale: L’optatif dans cette condition présente la souffrance comme une possibilité réelle sans affirmer qu’elle se produira; « deviez souffrir » l’exprime naturellement en français.
- source_word: διὰ δικαιοσύνην
  choice: à cause de la justice
  rationale: διά avec l’accusatif exprime ici la cause. « Justice » conserve le terme moral et théologique δικαιοσύνη sans le réduire explicitement aux seules bonnes actions.
- source_word: μακάριοι
  choice: vous êtes heureux
  rationale: « Heureux » est la formulation française consacrée pour μακάριος et évoque une condition favorable devant Dieu plutôt qu’une simple émotion passagère.
- source_word: τὸν ... φόβον αὐτῶν
  choice: leur crainte
  rationale: 'Cette expression volontairement proche du grec maintient l’écho d’Ésaïe 8.12 et son ambiguïté: il peut s’agir de la crainte qu’ils inspirent ou de ce qu’ils craignent eux-mêmes.'
- source_word: μὴ φοβηθῆτε
  choice: ne craignez pas
  rationale: Cette interdiction rend le verbe φοβέομαι et conserve en français la répétition lexicale avec φόβον (« crainte »).
- source_word: μηδὲ ταραχθῆτε
  choice: ne soyez pas non plus troublés
  rationale: La tournure coordonne naturellement la seconde interdiction et exprime l’agitation intérieure portée par ταράσσω.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: ce qui est juste; conduite juste
  rationale: « Justice » préserve l’ampleur morale et théologique de δικαιοσύνη. Les autres formulations rendraient le sens plus explicite, mais le limiteraient à la conduite humaine.
- issue: Ambiguïté de τὸν φόβον αὐτῶν
  choice: leur crainte
  alternative: la crainte qu’ils inspirent; ce qu’ils craignent
  rationale: Le génitif αὐτῶν permet plusieurs relations sémantiques. Le texte principal ne tranche donc pas, tandis que la note expose les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure accessible tout en conservant la répétition « crainte/craignez » et l’ambiguïté intentionnelle de l’allusion scripturaire.
