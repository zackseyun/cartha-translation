id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: fr
  text: 'Le baptême, qui correspond à cela, vous sauve maintenant, vous aussi : non pas l’élimination des impuretés de la chair, mais un appel adressé à Dieu pour une bonne conscience[a], par la résurrection de Jésus le Messie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais l’engagement d’une bonne conscience envers Dieu ». Le terme grec traduit par « appel » (ἐπερώτημα) peut aussi être compris au sens d’« engagement » ou de « réponse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: ce qui correspond à cela
  rationale: Cette formulation renvoie à l’eau et à l’événement précédemment évoqués, tout en exprimant la correspondance typologique sans employer le terme technique et peu accessible « antitype ».
- source_word: σῴζει
  choice: vous sauve
  rationale: Le présent grec énonce directement l’action salvatrice. La traduction ne l’atténue pas; les précisions qui suivent en délimitent elles-mêmes le sens.
- source_word: βάπτισμα
  choice: le baptême
  rationale: C’est l’équivalent français courant et précis; le contexte distingue expressément le baptême d’un simple nettoyage physique.
- source_word: σαρκὸς
  choice: de la chair
  rationale: « Chair » conserve le terme concret du grec et le contraste avec la bonne conscience, sans transformer celui-ci en formulation doctrinale.
- source_word: ἀπόθεσις ῥύπου
  choice: l’élimination des impuretés
  rationale: La formule désigne l’enlèvement d’une saleté physique. « Impuretés » est naturel en français et convient au registre digne du passage.
- source_word: συνειδήσεως ἀγαθῆς
  choice: pour une bonne conscience
  rationale: Cette formulation rattache la bonne conscience à l’appel adressé à Dieu, tout en évitant de préciser davantage que le grec condensé la manière dont elle est obtenue ou manifestée.
- source_word: ἐπερώτημα
  choice: un appel
  rationale: Le nom peut désigner une demande ou un appel, mais aussi, selon l’analyse retenue, un engagement ou une réponse. « Appel » s’accorde bien avec la direction vers Dieu; l’autre lecture est signalée en note.
- source_word: εἰς θεόν
  choice: adressé à Dieu
  rationale: La formulation exprime naturellement en français la direction de l’appel vers Dieu.
- source_word: δι’ ἀναστάσεως
  choice: par la résurrection
  rationale: La préposition διά avec le génitif exprime ici le moyen; « par » restitue cette relation de façon concise.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: « Messie » conserve ici la valeur de titre de Χριστός, avec l’article requis par le français idiomatique.
theological_decisions:
- issue: Rapport entre le baptême et le salut
  choice: Conserver l’affirmation directe « le baptême vous sauve maintenant » et laisser la suite du verset la qualifier.
  alternative: Paraphraser par « le baptême symbolise le salut », ou développer une doctrine sacramentelle particulière.
  rationale: Le texte attribue explicitement au baptême un rôle salvateur, puis précise qu’il ne s’agit pas d’un simple nettoyage extérieur et relie ce salut à Dieu, à la conscience et à la résurrection de Jésus. La traduction maintient cette tension sans la résoudre selon une tradition confessionnelle.
- issue: Sens de ἐπερώτημα dans le contexte baptismal
  choice: Employer « appel » dans le texte principal.
  alternative: « engagement » ou « réponse » d’une bonne conscience envers Dieu.
  rationale: Le terme grec est réellement discuté. « Appel » convient à εἰς θεόν, tandis que la lecture « engagement » demeure suffisamment plausible pour être conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la mise en apposition de « le baptême » et le contraste appuyé entre purification extérieure et relation de la conscience à Dieu. Le vocabulaire évite à la fois le jargon technique (« antitype ») et les développements confessionnels.
