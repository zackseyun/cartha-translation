id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: fr
  text: Car le Messie aussi a souffert une fois pour les péchés[a], le juste pour les injustes, afin de vous conduire à Dieu. Il a été mis à mort dans la chair, mais rendu vivant dans l’esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « est mort » au lieu de « a souffert ».
    reason: textual_variant
  - marker: b
    text: Ou « rendu vivant par l’Esprit ». Le grec peut désigner soit la sphère ou l’aspect de l’esprit, soit l’action de l’Esprit saint.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Rend le sens du titre grec plutôt que de le traiter comme un simple nom propre, conformément à l’usage du projet.
- source_word: ἅπαξ
  choice: une fois
  rationale: Traduit directement l’adverbe sans ajouter explicitement « une fois pour toutes », nuance possible mais non formulée dans le mot seul.
- source_word: περὶ ἁμαρτιῶν
  choice: pour les péchés
  rationale: Dans ce contexte rédempteur, περί avec le génitif désigne naturellement ce en vue de quoi le Messie a souffert.
- source_word: ἔπαθεν
  choice: a souffert
  rationale: Suit le texte du SBLGNT; la variante « est mort » est signalée en note.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: le juste pour les injustes
  rationale: Préserve le contraste concis et la portée représentative de ὑπέρ sans développer une théorie particulière de l’expiation.
- source_word: προσαγάγῃ
  choice: vous conduire à Dieu
  rationale: Exprime naturellement l’idée d’amener quelqu’un auprès de Dieu ou de lui donner accès à sa présence.
- source_word: θανατωθεὶς
  choice: Il a été mis à mort
  rationale: Conserve la voix passive; une nouvelle phrase rend la construction participiale grecque clairement en français courant.
- source_word: σαρκὶ
  choice: dans la chair
  rationale: Maintient le terme « chair » et son parallélisme avec πνεύματι sans l’interpréter comme « nature pécheresse ».
- source_word: ζῳοποιηθεὶς
  choice: rendu vivant
  rationale: Reproduit le sens et la voix passive du participe grec dans une formulation française claire.
- source_word: πνεύματι
  choice: dans l’esprit
  rationale: Préserve dans le texte principal la lecture de sphère ou d’aspect, tandis que la possible valeur instrumentale renvoyant à l’Esprit saint est donnée en note.
theological_decisions:
- issue: Sens de l’opposition entre la chair et l’esprit
  choice: « dans la chair… dans l’esprit »
  alternative: « dans son corps… par l’Esprit »
  rationale: Les deux datifs grecs sont parallèles et leur portée est débattue. La formulation retenue évite d’identifier explicitement πνεύματι à l’Esprit saint, tout en signalant cette lecture possible en note.
- issue: Portée de « le juste pour les injustes »
  choice: Conserver la formule représentative concise
  alternative: « l’innocent à la place des coupables »
  rationale: Le grec affirme que la souffrance du Messie est en faveur des injustes, mais ne justifie pas ici une paraphrase développant un modèle doctrinal plus précis.
translation_notes:
  register: Français international moderne, digne et accessible. « Messie » conserve la valeur titulaire de Χριστός. La ponctuation en deux phrases allège la longue structure grecque sans modifier les rapports logiques; les formulations « chair » et « esprit » maintiennent volontairement l’ambiguïté théologique du texte source.
