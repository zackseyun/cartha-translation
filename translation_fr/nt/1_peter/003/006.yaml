  verdict: revise
  source_fidelity: La traduction rend correctement l’obéissance de Sara, l’appellation humaine « seigneur », l’identité de filles de Sara et la portée conditionnelle des participes féminins. Toutefois, l’imparfait « obéissait » ne rend pas adéquatement l’aoriste ὑπήκουσεν, qui évoque l’exemple ponctuel/traditionnel de Sara (notamment son appellation dans Gn 18.12). Un passé composé convient mieux en français moderne.
  naturalness: Le texte est globalement naturel et d’un registre approprié. « De même que » exprime plus explicitement et plus idiomatiquement la comparaison introduite par ὡς que « Ainsi » dans cette construction. La coordination « si vous faites le bien et ne craignez aucune intimidation » conserve clairement les deux participes sous la même condition.
  terminology: « Seigneur » en minuscule et entre guillemets convient pour κύριον comme titre respectueux non divin. « Filles » est justifié par les participes féminins pluriels, bien que τέκνα soit lexicalement « enfants ». « Intimidation » est possible pour πτόησις, à condition de préserver en note les sens de terreur, effroi ou alarme.
