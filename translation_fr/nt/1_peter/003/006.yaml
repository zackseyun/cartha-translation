source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: fr
  text: De même que Sara a obéi à Abraham en l’appelant « seigneur », vous êtes devenues ses filles si vous faites le bien et ne craignez aucune intimidation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucune terreur », « aucun effroi » ou « rien d’effrayant ».'
    reason: πτόησις peut désigner la terreur, l’effroi, l’alarme ou ce qui provoque la peur. « Intimidation » convient au contexte sans épuiser l’ambiguïté lexicale.
lexical_decisions:
- source_word: ὡς
  choice: Ainsi
  rationale: Introduit naturellement Sara comme exemple correspondant au contexte précédent, sans alourdir la phrase française.
- source_word: ὑπήκουσεν
  choice: obéissait
  rationale: Rend directement le sens ordinaire de ὑπακούω. L’imparfait convient en français pour présenter la conduite exemplaire de Sara évoquée par son appellation d’Abraham.
- source_word: κύριον αὐτὸν καλοῦσα
  choice: en l’appelant « seigneur »
  rationale: Préserve le participe de manière et le titre respectueux employé par Sara, sans en faire un titre divin; la minuscule est donc maintenue.
- source_word: ἧς ἐγενήθητε τέκνα
  choice: Vous êtes devenues ses filles
  rationale: Le féminin pluriel des participes montre que l’auteur s’adresse ici aux femmes. « Filles » rend cette application explicite et naturelle, tandis que le passé composé de γίνομαι exprime l’entrée dans une identité qui demeure.
- source_word: ἀγαθοποιοῦσαι
  choice: si vous faites le bien
  rationale: Explicite en français la nuance conditionnelle ou probatoire des participes, tout en conservant l’exhortation pratique.
- source_word: μὴ φοβούμεναι
  choice: sans vous laisser effrayer
  rationale: Formulation française naturelle décrivant une disposition ferme plutôt qu’un simple sentiment ponctuel.
- source_word: μηδεμίαν πτόησιν
  choice: par aucune menace
  rationale: Dans ce contexte exhortatif, « menace » exprime bien ce qui cherche à provoquer la peur, tout en laissant en note les autres valeurs possibles de πτόησις.
theological_decisions:
- issue: Portée de l’obéissance exemplaire de Sara
  choice: Conserver explicitement « obéissait » sans développer une doctrine générale du mariage.
  alternative: Atténuer par « se soumettait » ou « écoutait ».
  rationale: Le sens direct de ὑπακούω doit être préservé, mais le verset ne doit pas être élargi au-delà de son affirmation propre.
- issue: Relation des participes à l’identité de filles de Sara
  choice: Rendre leur nuance conditionnelle par « si vous faites le bien » et coordonner l’absence de peur par « sans ».
  alternative: 'Lecture descriptive : « vous qui faites le bien et ne craignez… ».'
  rationale: La construction grecque reste susceptible d’une nuance descriptive, mais le contexte exhortatif soutient une valeur conditionnelle ou probatoire. La formulation retenue n’en fait pas une théorie du mérite.
- issue: Genre de τέκνα dans l’application
  choice: Employer « filles » plutôt que « enfants ».
  alternative: « Vous êtes devenues ses enfants ».
  rationale: Bien que τέκνα soit grammaticalement neutre et signifie « enfants », les participes féminins pluriels indiquent que l’application vise précisément les femmes auxquelles Pierre s’adresse.
translation_notes:
  register: Français international moderne, digne et accessible. « Seigneur » reste en minuscule et entre guillemets pour marquer une appellation respectueuse humaine. La phrase conserve la tension exhortative du grec sans importer une formulation confessionnelle.
