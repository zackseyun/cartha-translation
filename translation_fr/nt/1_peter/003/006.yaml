revisions:
- from: Ainsi, Sara obéissait à Abraham en l’appelant « seigneur ». Vous êtes devenues ses filles si vous faites le bien sans vous laisser effrayer par aucune menace.[a]
  to: De même que Sara a obéi à Abraham en l’appelant « seigneur », vous êtes devenues ses filles si vous faites le bien et ne craignez aucune intimidation.[a]
  rationale: La révision remplace l’imparfait par un passé composé correspondant mieux à l’aoriste grec, explicite la comparaison par « De même que », et maintient la condition portée par les deux participes féminins. Elle ne modifie ni la portée exhortative ni l’ambiguïté lexicale de πτόησις, celle-ci étant préservée en note.
