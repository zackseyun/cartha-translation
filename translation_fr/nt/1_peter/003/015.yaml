  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: fr
  text: Mais dans vos cœurs, reconnaissez comme saint le Messie, le Seigneur[a], toujours prêts à présenter une défense à quiconque vous demande raison de l’espérance qui est en vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « sanctifiez le Messie comme Seigneur dans vos cœurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον δὲ τὸν Χριστὸν ἁγιάσατε
  choice: Mais reconnaissez dans vos cœurs le Messie comme le Seigneur saint
  rationale: La formulation exprime l’impératif de tenir le Messie pour saint en qualité de Seigneur, sans laisser entendre que les croyants le rendent saint. Elle conserve le titre « Messie » pour Χριστός et l’écho probable d’Ésaïe 8.13.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: dans vos cœurs
  rationale: Rendu direct et naturel du lieu intérieur où s’opère cette reconnaissance.
- source_word: ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν
  choice: toujours prêts à présenter une défense
  rationale: « Présenter une défense » restitue la réponse raisonnée ou justification exprimée par ἀπολογία, dans une construction française idiomatique.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: devant quiconque vous demande de rendre compte
  rationale: « Rendre compte » traduit ici λόγον dans son sens d’explication raisonnée demandée; « quiconque » préserve la portée distributive de παντί.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: de l’espérance qui est en vous
  rationale: Rendu proche du grec qui conserve l’idée d’une espérance intérieurement présente parmi les destinataires.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός fonctionne ici comme un titre associé à κύριος; « Messie » en explicite la valeur titulaire.
- issue: Sens de ἁγιάσατε lorsque le Messie est l’objet
  choice: reconnaissez ... comme le Seigneur saint
  alternative: sanctifiez le Messie comme Seigneur
  rationale: Le choix évite de suggérer que les croyants confèrent la sainteté au Messie, tout en maintenant l’ordre de le reconnaître et de l’honorer intérieurement comme saint Seigneur.
- issue: Rapport syntaxique entre κύριον et τὸν Χριστόν
  choice: le Messie comme le Seigneur saint
  alternative: le Seigneur Messie
  rationale: Cette lecture comprend κύριον comme la qualité sous laquelle le Messie doit être sanctifié ou reconnu saint, tout en signalant en note la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la densité théologique du grec, tout en employant « présenter une défense » et « rendre compte » pour une lecture naturelle.
