  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: fr
  text: Qu’il se détourne du mal et fasse le bien[a] ; qu’il recherche la paix et la poursuive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que l’on se détourne du mal et fasse le bien ; que l’on recherche la paix et la poursuive ». Le grec emploie ici des impératifs à la troisième personne du singulier ; dans le contexte de la citation, « qu’il » a une portée générale.
    reason: alternative_lexicale_et_précision_grammaticale
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: qu’il se détourne
  rationale: L’impératif aoriste actif à la troisième personne appelle une action résolue. « Se détourner » conserve l’idée directionnelle du verbe grec.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Dans cette citation poétique, δέ assure surtout la progression avec une légère nuance de contraste. En français, un « mais » initial alourdirait le vers et pourrait suggérer une opposition plus forte que celle du grec.
- source_word: ἀπὸ κακοῦ
  choice: du mal
  rationale: Le contexte oppose le mal au bien sur le plan moral ; « du mal » est concis, naturel et fidèle.
- source_word: ποιησάτω ἀγαθόν
  choice: fasse le bien
  rationale: Cette tournure française courante conserve le caractère actif de l’exhortation morale.
- source_word: ζητησάτω
  choice: qu’il recherche
  rationale: « Rechercher » exprime une démarche intentionnelle tout en maintenant la progression rhétorique vers le verbe plus énergique « poursuivre ».
- source_word: εἰρήνην
  choice: la paix
  rationale: « La paix » garde l’ampleur du terme biblique sans le réduire à la seule réconciliation ni l’expliciter excessivement.
- source_word: διωξάτω αὐτήν
  choice: et la poursuive
  rationale: Le verbe διώκω indique ici une poursuite énergique et positive ; le pronom féminin renvoie clairement à « la paix ».
- source_word: impératifs à la troisième personne du singulier
  choice: qu’il…
  rationale: Cette construction préserve le nombre, la forme exhortative et la cadence de la citation grecque. En contexte, le masculin singulier a une portée représentative.
theological_decisions:
- issue: Portée générique du masculin singulier dans la citation
  choice: Employer « qu’il » dans le texte principal
  alternative: « que l’on », « qu’ils » ou une formulation à la deuxième personne
  rationale: Le grec emploie des impératifs au masculin singulier avec une portée représentative. « Qu’il » respecte cette forme et l’écho de la citation du Psaume, tandis qu’une note précise que l’exhortation est générale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme exhortatif et la progression « rechercher… poursuivre » sont conservés. La ponctuation au point-virgule rend la structure poétique sans ajouter de connecteur français inutile.
