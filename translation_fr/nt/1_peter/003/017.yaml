  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: fr
  text: Car il vaut mieux souffrir en faisant le bien[a], si telle devait être la volonté de Dieu[b], qu’en faisant le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «souffrir à cause du bien que l’on fait […] plutôt qu’à cause du mal que l’on fait». Les participes grecs peuvent indiquer la cause («à cause de») ou, plus généralement, les circonstances («en faisant»).'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, le grec dit : «si la volonté de Dieu le voulait», tournure emphatique rendue ici dans un français plus naturel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: il vaut mieux
  rationale: Cette tournure impersonnelle rend naturellement en français l’adjectif comparatif employé comme prédicat.
- source_word: γὰρ
  choice: Car
  rationale: Le connecteur introduit la raison ou l’explication de l’exhortation précédente.
- source_word: ἀγαθοποιοῦντας
  choice: en faisant le bien
  rationale: Le participe présent décrit les personnes au moment où elles font le bien, sans imposer un rapport strictement causal; «pour avoir fait le bien» demeure possible selon le contexte.
- source_word: εἰ θέλοι
  choice: si telle devait être
  rationale: L’optatif après εἰ exprime une éventualité ou une condition présentée avec réserve; «devait» en conserve la nuance potentielle dans un français naturel.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: la volonté de Dieu
  rationale: Équivalent direct et digne de la construction grecque; associé à «telle devait être», il restitue le jeu entre θέλημα et θέλοι sans répétition française maladroite.
- source_word: πάσχειν
  choice: souffrir
  rationale: L’infinitif complète la construction impersonnelle «il vaut mieux» de façon directe.
- source_word: ἢ
  choice: que
  rationale: Conjonction comparative française normale après «mieux».
- source_word: κακοποιοῦντας
  choice: en faisant le mal
  rationale: Le choix reproduit le parallélisme antithétique avec «en faisant le bien» sans trancher explicitement entre valeur circonstancielle et causale.
theological_decisions:
- issue: Rapport entre la souffrance et la volonté divine
  choice: Le verset affirme conditionnellement que souffrir en faisant le bien peut relever de la volonté de Dieu, sans préciser le mode de cette relation.
  alternative: Comprendre soit que Dieu décrète positivement chaque souffrance, soit qu’il ne fait que la permettre sans autre implication.
  rationale: La formule εἰ θέλοι τὸ θέλημα τοῦ θεοῦ renvoie bien à la volonté divine, mais ne tranche pas les débats plus larges sur décret, permission ou causalité. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. «Il vaut mieux» est idiomatique; «si telle devait être la volonté de Dieu» conserve la réserve de l’optatif et l’écho lexical grec sans produire une répétition artificielle. Les deux participes sont rendus symétriquement.
