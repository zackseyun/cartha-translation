  terminology: « Trompeuses » rend adéquatement δόλος, terme qui peut désigner la tromperie, la ruse ou la duplicité. La note conserve une alternative proche de la construction grecque. « Jours heureux » convient pour ἡμέρας ἀγαθὰς sans réduire le sens à la prospérité matérielle.
