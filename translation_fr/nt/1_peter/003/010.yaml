reference: 1 Peter 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: fr
  text: Car celui qui veut aimer la vie et voir des jours heureux doit préserver sa langue du mal et ses lèvres de prononcer des paroles trompeuses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de parler avec tromperie ». Le nom grec peut évoquer la tromperie, la ruse ou la fourberie.
    reason: Alternative lexicale pour δόλος et formulation plus proche de la structure grecque.
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: celui qui veut
  rationale: L’article suivi du participe désigne de manière générique toute personne concernée. « Celui qui veut » conserve le singulier représentatif sans rendre le propos exclusivement masculin.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’appui scripturaire ou l’explication de l’exhortation précédente.
- source_word: ζωὴν ἀγαπᾶν
  choice: aimer la vie
  rationale: Cette formulation directe respecte l’expression grecque sans ajouter de possessif absent du texte.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: voir des jours heureux
  rationale: « Voir » préserve l’image concrète du grec, tandis que « jours heureux » exprime naturellement des jours favorables sans limiter le sens à la prospérité matérielle.
- source_word: παυσάτω
  choice: doit empêcher
  rationale: L’impératif aoriste appelle la personne à faire cesser ou à prévenir l’action. Avec les compléments corporels, « doit empêcher… de » en restitue clairement la force exhortative en français courant.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: sa langue de faire le mal
  rationale: Le possessif est requis par l’usage français avec une partie du corps. « Le mal » garde la portée générale de κακόν, dans le contexte concret de la parole.
- source_word: χείλη
  choice: ses lèvres
  rationale: Le pluriel et l’image concrète sont conservés, avec le possessif naturel en français.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: ses lèvres de prononcer des paroles trompeuses
  rationale: Cette formulation rend naturellement l’idée d’empêcher les lèvres de parler avec tromperie. Elle explicite en français l’acte verbal exprimé par λαλῆσαι sans atténuer la notion de δόλος.
theological_decisions:
- issue: Singulier générique et représentation du genre
  choice: Employer « celui qui » avec les possessifs singuliers « sa langue » et « ses lèvres ».
  alternative: Employer une tournure plurielle ou épicène telle que « quiconque… leur langue… leurs lèvres ».
  rationale: Le grec présente une personne générique au singulier. La formulation choisie conserve ce singulier représentatif et la cohérence grammaticale française, sans affirmer que l’exhortation ne viserait que les hommes.
- issue: Portée de κακόν dans l’expression sur la langue
  choice: Conserver la formulation générale « faire le mal ».
  alternative: Préciser « dire du mal » ou « tenir de mauvais propos ».
  rationale: Le contexte associe clairement le mal à l’usage de la langue, mais le grec garde κακόν général. La traduction évite de réduire silencieusement sa portée à une catégorie précise de paroles.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le mouvement proverbial de la citation tout en évitant les tournures archaïques. « Jours heureux » est idiomatique sans suggérer exclusivement la réussite matérielle.
