id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: fr
  text: Ne rendez pas le mal pour le mal ni l’insulte pour l’insulte[a] ; au contraire, bénissez, car c’est à cela que vous avez été appelés[b], afin d’hériter d’une bénédiction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’injure pour l’injure ». Le terme grec désigne des paroles injurieuses ou outrageantes.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut renvoyer immédiatement au fait de bénir plutôt que de riposter, ou plus largement à la conduite décrite dans le contexte.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: rendez
  rationale: Le participe présent sous la portée de μή a ici une valeur exhortative dans la suite du contexte. « Rendre » exprime naturellement en français l’idée de répondre à un traitement par son équivalent.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: le mal pour le mal
  rationale: Cette formulation française établie conserve à la fois la portée morale de κακόν et la réciprocité exprimée par ἀντί.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: l’insulte pour l’insulte
  rationale: λοιδορία désigne des paroles injurieuses ou outrageantes. « Insulte » est clair, actuel et maintient le parallélisme de la riposte.
- source_word: τοὐναντίον δὲ
  choice: au contraire
  rationale: L’expression marque un renversement appuyé du comportement attendu ; « au contraire » en restitue clairement la force adversative.
- source_word: εὐλογοῦντες
  choice: bénissez
  rationale: Dans cette exhortation, le participe est rendu par un impératif coordonné. « Bénissez » garde la concision du grec et peut évoquer tant une parole favorable que l’invocation de la faveur divine, sans ajouter de complément absent du texte.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit le fondement de l’exhortation. « Car » exprime ici naturellement ce rapport causal dans un registre digne.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: c’est à cela que vous avez été appelés
  rationale: La tournure française conserve le passif divin implicite et laisse « cela » renvoyer au comportement qui précède sans en préciser excessivement l’étendue.
- source_word: ἵνα
  choice: afin de
  rationale: La construction infinitive française exprime de façon fluide la visée ou le résultat voulu introduit par ἵνα.
- source_word: εὐλογίαν
  choice: une bénédiction
  rationale: L’article indéfini est idiomatique en français et le nom reprend volontairement la racine de « bénissez », comme le grec reprend celle de εὐλογοῦντες.
- source_word: κληρονομήσητε
  choice: hériter
  rationale: « Hériter » préserve la nuance familiale et eschatologique de recevoir une part accordée à un héritier, plutôt que de réduire le verbe à « recevoir ».
theological_decisions:
- issue: Référent de εἰς τοῦτο dans l’appel des croyants
  choice: La traduction laisse « cela » renvoyer immédiatement au fait de bénir au lieu de rendre le mal ou l’insulte.
  alternative: L’expression peut viser plus largement toute la conduite chrétienne décrite dans le contexte, notamment la non-riposte face aux mauvais traitements.
  rationale: Le contexte immédiat favorise le lien avec l’exhortation précédente, mais le démonstratif grec ne délimite pas explicitement son référent. La formulation française conserve cette latitude.
- issue: Rapport exprimé par ἵνα entre l’appel et la bénédiction héritée
  choice: « Afin de » conserve une orientation vers le but ou le résultat voulu sans expliquer davantage le lien théologique.
  alternative: 'On pourrait comprendre la proposition surtout comme indiquant le résultat attendu : « de sorte que vous héritiez d’une bénédiction ».'
  rationale: ἵνα avec le subjonctif peut exprimer la finalité ou un résultat envisagé. La traduction retient la valeur finale la plus directe tout en évitant d’énoncer un mécanisme de mérite que le verset ne formule pas.
translation_notes:
  register: 'Français international moderne, clair et digne. Le parallélisme « le mal pour le mal / l’insulte pour l’insulte » et la reprise « bénissez / bénédiction » reproduisent les principaux effets rhétoriques du grec. Le tutoiement ou vouvoiement n’est pas en jeu : le pluriel « vous » demeure non marqué.'
