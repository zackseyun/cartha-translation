id: 1PE.3.5
reference: 1 Peter 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: fr
  text: C’est ainsi, en effet, qu’autrefois aussi les saintes femmes qui espéraient en Dieu se paraient, en se soumettant à leurs propres maris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: C’est ainsi
  rationale: Renvoie à la manière de se parer décrite dans le contexte précédent et conserve la force démonstrative de l’adverbe.
- source_word: γάρ
  choice: en effet
  rationale: Introduit l’explication qui fonde l’exhortation précédente; cette tournure est naturelle en français dans cette position.
- source_word: ποτε
  choice: autrefois
  rationale: Situe ces femmes dans les générations passées sans suggérer un événement ponctuel.
- source_word: ἅγιαι γυναῖκες
  choice: les saintes femmes
  rationale: Conserve l’adjectif attributif et le sens religieux usuel de ἅγιος sans l’affaiblir en « pieuses ».
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: qui espéraient en Dieu
  rationale: Rend simplement le participe attributif et maintient Dieu comme objet de leur espérance.
- source_word: ἐκόσμουν ἑαυτάς
  choice: se paraient
  rationale: Restitue l’idée d’ornement et le lien lexical avec le contexte immédiat, dans un français naturel et digne.
- source_word: ὑποτασσόμεναι
  choice: en se soumettant
  rationale: 'Préserve la valeur participiale de manière: cette soumission précise comment elles se paraient.'
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: à leur propre mari
  rationale: Dans ce contexte conjugal, ἀνήρ désigne le mari; « propre » conserve ἰδίοις et limite explicitement la relation au conjoint de chacune.
theological_decisions:
- issue: Portée de la soumission conjugale
  choice: en se soumettant à leur propre mari
  alternative: en étant soumises à leur mari
  rationale: La formulation conserve la relation participiale et la restriction explicite à leurs propres maris, sans étendre le propos à une doctrine générale concernant tous les hommes et toutes les femmes.
translation_notes:
  register: Français international moderne, courant et digne. La phrase garde le lien explicatif avec le contexte, ainsi que l’image de la parure. Le singulier distributif « leur propre mari » évite l’ambiguïté possible de « leurs propres maris » tout en rendant le pluriel grec.
