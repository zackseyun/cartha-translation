id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: fr
  text: Car[a] les yeux du Seigneur sont tournés vers les justes, et ses oreilles sont attentives à leur prière[b] ; mais la face du Seigneur est contre ceux qui font le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Parce que ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ses oreilles vers leur prière » ; « sont attentives » explicite le sens de la tournure grecque elliptique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit la raison qui fonde l’exhortation précédente. « Car » conserve cette valeur causale et s’intègre naturellement à la citation.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: les yeux du Seigneur sont tournés vers les justes
  rationale: Cette formulation conserve l’image anthropomorphique et rend la direction ou l’attention exprimée par ἐπί avec l’accusatif.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: ses oreilles sont attentives à leur prière
  rationale: Le grec dit elliptiquement « ses oreilles vers leur prière ». Le verbe ajouté explicite l’attention impliquée sans remplacer l’image des oreilles ; « prière » exprime ici naturellement la demande adressée à Dieu.
- source_word: πρόσωπον δὲ κυρίου
  choice: mais la face du Seigneur
  rationale: « Face » préserve l’image biblique de la présence personnelle de Dieu, tandis que « mais » rend la valeur adversative de δέ.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: est contre ceux qui font le mal
  rationale: Dans ce membre négatif, ἐπί indique l’orientation hostile, rendue idiomatiquement par « contre ». La tournure verbale conserve la valeur de ποιοῦντας.
theological_decisions:
- issue: Langage anthropomorphique concernant les yeux, les oreilles et la face de Dieu
  choice: Conserver directement les trois images
  alternative: Paraphraser par « le Seigneur veille sur les justes, écoute leur prière et s’oppose à ceux qui font le mal »
  rationale: Ces images, héritées du psaume cité, expriment avec force l’attention favorable et l’opposition personnelles du Seigneur. Les maintenir respecte la forme littéraire sans trancher la question de leur portée au moyen d’une paraphrase.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant le parallélisme et les images corporelles de la citation scripturaire.
