  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: fr
  text: De même, vous, femmes, soyez soumises à vos propres maris, afin que, même si certains n’obéissent pas à la parole[a], ils soient gagnés, sans un mot, par votre conduite,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’obéissent pas au message » ; il s’agit vraisemblablement de leur refus du message de l’Évangile.
    reason: Alternative lexicale et clarification contextuelle de λόγος.
lexical_decisions:
- source_word: Ὁμοίως
  choice: De même
  rationale: Marque naturellement le lien avec les instructions précédentes tout en conservant la fonction connective du grec.
- source_word: γυναῖκες
  choice: femmes
  rationale: En français, l’adresse « vous, femmes » suivie de « vos propres maris » désigne clairement les épouses sans employer le terme moins naturel « épouses » comme vocatif.
- source_word: ὑποτασσόμεναι
  choice: soyez soumises à
  rationale: Le participe grec dépend d’une exhortation implicite. Cette formulation restitue l’ordre relationnel exprimé sans ajouter l’idée d’obéissance absolue.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: à vos propres maris
  rationale: Le contexte conjugal impose le sens « maris »; « propres » préserve l’insistance de ἰδίοις.
- source_word: ἵνα καὶ εἴ τινες
  choice: afin que, même si certains
  rationale: « Afin que » conserve la valeur de but ou de résultat, et « même si » la nuance concessive de καὶ εἴ.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: n’obéissent pas à la Parole
  rationale: Préserve la nuance de désobéissance ou de refus portée par ἀπειθέω ainsi que l’expression biblique « la Parole », tout en signalant en note le sens contextuel de message de l’Évangile.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: par votre conduite
  rationale: ἀναστροφή désigne la manière de vivre. Le passage à la deuxième personne est idiomatique en français et renvoie sans ambiguïté aux femmes interpellées.
- source_word: ἄνευ λόγου
  choice: sans parole
  rationale: Conserve le singulier et le jeu rhétorique avec « la Parole » plus tôt dans le verset, sans préciser indûment s’il s’agit d’argumentation ou de toute prise de parole.
- source_word: κερδηθήσονται
  choice: ils soient gagnés
  rationale: Préserve la métaphore évangélisatrice de κερδαίνω et la forme passive, sans expliciter au-delà du texte à qui ou à quoi ils sont gagnés.
theological_decisions:
- issue: Portée de ὑποτασσόμεναι dans l’instruction domestique
  choice: « soyez soumises à » sans ajouter l’obéissance absolue ni une infériorité essentielle
  alternative: « obéissez à » ou « placez-vous sous l’autorité de »
  rationale: Le texte emploie ὑποτάσσω, non le verbe plus direct signifiant obéir. La traduction maintient la tension de l’exhortation sans importer une construction doctrinale.
- issue: Sens de ἀπειθοῦσιν τῷ λόγῳ
  choice: « n’obéissent pas à la Parole »
  alternative: « ne croient pas au message » ou « refusent l’Évangile »
  rationale: Le verbe peut associer incrédulité et désobéissance. La traduction conserve cette amplitude, tandis que la note éclaire le référent probable de λόγος.
- issue: Sens de κερδηθήσονται
  choice: Conserver « soient gagnés » sans complément explicatif
  alternative: « soient gagnés à la foi » ou « soient amenés au salut »
  rationale: Le contexte suggère une conversion, mais le grec laisse le complément implicite; l’ajouter résoudrait une part de l’implicite théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « De même » et « conduite » gardent un registre biblique naturel. La répétition « Parole / parole » reproduit volontairement l’écho du grec. La phrase reste ouverte par une virgule, conformément au segment fourni, qui se poursuit au verset suivant.
