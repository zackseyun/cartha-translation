lexical_decisions:
- source_word: ἐν ᾧ
  choice: dans cet esprit
  rationale: Le relatif grec renvoie le plus naturellement à πνεύματι dans la proposition précédente. Cette formulation française rend ce lien intelligible tout en laissant en note les autres analyses possibles.
- source_word: καὶ
  choice: aussi
  rationale: Ici, καί ajoute cette action à ce qui précède; « aussi » en exprime naturellement la valeur additive.
- source_word: τοῖς ... πνεύμασιν
  choice: aux esprits
  rationale: « Esprits » est l’équivalent direct de πνεύμασιν et ne tranche pas leur identité, contrairement à « âmes » ou « êtres spirituels ».
- source_word: ἐν φυλακῇ
  choice: en prison
  rationale: φυλακή désigne ici un lieu de garde ou de détention. « En prison » conserve simplement et naturellement cette image.
- source_word: πορευθεὶς
  choice: il est allé
  rationale: Le participe aoriste exprime un déplacement associé au verbe principal. Une forme verbale coordonnée est plus naturelle en français sans imposer davantage de précision chronologique.
- source_word: ἐκήρυξεν
  choice: proclamer
  rationale: κηρύσσω désigne l’action de faire une proclamation. « Proclamer » ne précise pas indûment si le message était une annonce de salut, de jugement ou de victoire.
theological_decisions:
- issue: Référent et valeur de ἐν ᾧ
  choice: « dans cet esprit », en lien avec l’« esprit » de la proposition précédente
  alternative: « en qui » ou « par lequel »
  rationale: La construction est discutée. Le texte principal suit le lien grammatical le plus immédiat, tandis que la note préserve les lectures personnelle et instrumentale sans imposer une doctrine sur le mode de la proclamation.
- issue: Identité des « esprits en prison »
  choice: L’identité demeure indéterminée dans le texte principal.
  alternative: Des humains décédés, des êtres angéliques déchus ou une catégorie plus large d’esprits détenus.
  rationale: Le grec ne précise pas suffisamment leur identité pour que la traduction tranche entre les interprétations historiques.
- issue: Nature du message exprimé par ἐκήρυξεν
  choice: « proclamer »
  alternative: « prêcher »
  rationale: Le verbe indique une proclamation, mais n’en précise pas ici le contenu. La traduction évite donc de décider s’il s’agit de l’Évangile, d’un jugement ou d’une victoire.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure met explicitement en relation le verset avec l’« esprit » mentionné juste avant, tout en conservant en notes les ambiguïtés syntaxiques, lexicales et théologiques réelles.
