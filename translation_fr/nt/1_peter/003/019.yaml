  text: C’est aussi en cela[a] qu’il est allé proclamer[b] aux esprits en prison[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en qui »; autre possibilité : « par lequel ». Le grec permet plusieurs compréhensions du lien avec la proposition précédente.'
