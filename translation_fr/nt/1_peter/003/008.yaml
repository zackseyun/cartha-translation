source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: fr
  text: Enfin, vous tous, ayez une même manière de penser ; soyez sensibles à ce que les autres éprouvent, pleins d’affection fraternelle[a], compatissants et humbles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleins d’amour fraternel » ; le grec emploie ici le langage de la fratrie dans un sens qui englobe toute la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « bienveillants » ou « amicaux » au lieu de « humbles ».
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Enfin
  rationale: Cette formule introduit ici la récapitulation des exhortations. « Enfin » est un marqueur de transition naturel en français et n’impose pas le sens chronologique de « à la fin ».
- source_word: πάντες
  choice: tous
  rationale: Le nominatif s’adresse directement à l’ensemble des destinataires ; « tous » conserve cette portée collective dans une formulation française naturelle.
- source_word: ὁμόφρονες
  choice: ayez tous une même pensée
  rationale: La formule exprime l’unité de disposition ou de manière de penser. Elle conserve la composante cognitive du grec sans réduire l’idée à une simple bonne entente.
- source_word: συμπαθεῖς
  choice: sensibles à ce que les autres éprouvent
  rationale: Le terme désigne la capacité de partager ou de ressentir les émotions d’autrui. Cette formulation évite de le confondre avec εὔσπλαγχνοι, rendu plus loin par « compatissants ».
- source_word: φιλάδελφοι
  choice: pleins d’affection fraternelle
  rationale: Le mot évoque l’affection entre membres d’une même fratrie, appliquée ici à la communauté croyante. « Affection fraternelle » garde l’image familiale tout en étant idiomatique et collectivement inclusive en français.
- source_word: εὔσπλαγχνοι
  choice: compatissants
  rationale: Le terme décrit une compassion profonde et chaleureuse. « Compatissants » en rend clairement la disposition intérieure sans expression archaïque.
- source_word: ταπεινόφρονες
  choice: humbles
  rationale: La leçon du SBLGNT désigne l’humilité de pensée ou d’attitude. En français, « humbles » exprime naturellement cette disposition ; une traduction comme « d’esprit humble » serait plus explicite mais plus lourde.
theological_decisions:
- issue: Langage familial de φιλάδελφοι
  choice: pleins d’affection fraternelle
  alternative: aimez-vous comme des frères et sœurs
  rationale: La traduction principale conserve l’image familiale du grec sans laisser entendre que l’exhortation viserait seulement les hommes. La note explicite la portée inclusive de ce langage dans la communauté.
- issue: Leçon textuelle du dernier adjectif
  choice: 'ταπεινόφρονες : humbles'
  alternative: 'φιλόφρονες : bienveillants ou amicaux'
  rationale: Le texte principal suit le SBLGNT et sa leçon ταπεινόφρονες. La variante φιλόφρονες est assez significative pour être signalée, mais elle ne doit pas remplacer le texte source retenu.
translation_notes:
  register: 'Français international moderne, digne et accessible. La série d’adjectifs grecs est transformée avec mesure en une exhortation verbale naturelle. Les deux termes voisins συμπαθεῖς et εὔσπλαγχνοι restent distincts : le premier souligne la sensibilité à l’expérience d’autrui, le second la compassion profonde.'
