source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: fr
  text: eux qui avaient autrefois désobéi, lorsque Dieu, dans sa patience, attendait aux jours de Noé, pendant la préparation de l’arche, dans laquelle un petit nombre — c’est-à-dire huit personnes[a] — furent préservées à travers l’eau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « huit âmes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « furent sauvées à travers l’eau ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: avaient autrefois désobéi
  rationale: Le verbe exprime ici le refus d’obéir plutôt qu’une simple absence de croyance. Le plus-que-parfait situe naturellement cette désobéissance dans le passé par rapport au fil du discours.
- source_word: ποτε
  choice: autrefois
  rationale: Le terme renvoie à une époque passée et se rend naturellement ainsi en français moderne.
- source_word: ἀπεξεδέχετο
  choice: attendait
  rationale: L’imparfait grec présente une attente qui se prolonge. La patience étant déjà exprimée par μακροθυμία, il n’est pas nécessaire de la répéter dans le verbe.
- source_word: ἡ τοῦ θεοῦ μακροθυμία
  choice: Dieu attendait avec patience
  rationale: Cette restructuration idiomatique évite la personnification peu naturelle « la patience de Dieu attendait », tout en conservant Dieu comme celui dont la patience retarde le jugement.
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: pendant que l’arche était en construction
  rationale: La tournure rend le processus en cours et le sens de préparation ou de construction de l’arche sans préciser davantage les travaux.
- source_word: εἰς ἣν
  choice: dans cette arche
  rationale: Le grec indique l’entrée dans l’arche. La reprise démonstrative est naturelle en français et conserve le lien avec l’arche qui vient d’être mentionnée.
- source_word: ὀλίγοι
  choice: quelques-uns seulement
  rationale: Cette formulation met clairement en relief le petit nombre, précisé aussitôt comme étant huit personnes.
- source_word: ψυχαί
  choice: personnes
  rationale: ψυχή désigne ici des êtres humains comptés, sans énoncer une distinction anthropologique entre le corps et l’âme.
- source_word: διεσώθησαν
  choice: furent amenés sains et saufs
  rationale: Le verbe composé souligne la préservation au milieu d’un danger et l’arrivée en sécurité. Cette traduction garde le sens concret du récit sans imposer d’emblée une lecture sotériologique.
- source_word: δι’ ὕδατος
  choice: à travers l’eau
  rationale: 'Cette traduction préserve l’ambiguïté contextuelle de διά : l’eau constitue à la fois le milieu dangereux traversé et, dans l’enchaînement typologique du passage, un élément lié à la délivrance.'
theological_decisions:
- issue: Portée sotériologique possible de διεσώθησαν
  choice: furent amenés sains et saufs à travers l’eau
  alternative: furent sauvés à travers l’eau
  rationale: Dans le récit du déluge, le verbe décrit concrètement la préservation des huit personnes. La formulation retenue laisse toutefois ouverte la relation typologique avec le salut et le baptême au verset suivant ; l’autre traduction est signalée en note.
- issue: Sens de ψυχαί
  choice: personnes
  alternative: âmes
  rationale: Le verset compte les êtres humains présents dans l’arche. « Personnes » transmet ce sens sans suggérer que seules des âmes, par opposition aux corps, auraient été préservées.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste liée au verset précédent par « eux qui », conformément au caractère participial du début grec. Les marqueurs de notes ont été placés auprès des expressions auxquelles les variantes se rapportent.
