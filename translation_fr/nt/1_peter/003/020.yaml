review_pass:
  verdict: revise
  source_fidelity: La révision conserve le participe initial (« eux qui avaient autrefois désobéi »), l’imparfait duratif de l’attente divine et la nuance de préservation de διεσώθησαν. Elle remplace « Dans cette arche » par « dans laquelle », qui maintient le lien syntaxique avec εἰς ἣν sans ajouter une nouvelle proposition indépendante. « Préservées » rend mieux le résultat de διασῴζω que « amenés sains et saufs », qui suggère inutilement un agent implicite.
  naturalness: Le texte révisé est naturel en français international moderne. « Un petit nombre » est plus idiomatique et plus neutre que « quelques-uns seulement » devant l’explication inclusive « huit personnes ». « Dieu, dans sa patience, attendait » évite la personnification lourde tout en exprimant précisément la patience divine.
  terminology: « Arche », « Noé », « personnes » et « à travers l’eau » sont appropriés. La note « âmes » conserve l’alternative littérale de ψυχαί, et la note sur « sauvées » conserve la possibilité lexicale et théologiquement significative de διεσώθησαν sans imposer cette interprétation au texte principal.
  issues:
  - severity: medium
    issue: « Dans cette arche » ne reflète pas suffisamment εἰς ἣν.
    rationale: La préposition grecque relie les personnes à l’arche comme au lieu dans lequel elles ont trouvé refuge; l’ouverture d’une nouvelle phrase avec « Dans cette arche » affaiblit ce lien et la dynamique d’entrée.
  - severity: low
    issue: « Quelques-uns seulement » est moins naturel avec « huit personnes ».
    rationale: « Quelques-uns » est masculin et peut paraître restrictif ou discordant lorsque l’explication désigne huit personnes. « Un petit nombre » exprime directement ὀλίγοι et convient à un groupe mixte.
  - severity: medium
    issue: « Furent amenés sains et saufs » ajoute une idée d’agent qui n’est pas exprimée.
    rationale: Le passif français « amenés » appelle facilement un agent implicite; « furent préservées » exprime plus directement la délivrance au travers du danger indiquée par διασῴζω.
  revised_text: eux qui avaient autrefois désobéi, lorsque Dieu, dans sa patience, attendait aux jours de Noé, pendant la préparation de l’arche, dans laquelle un petit nombre — c’est-à-dire huit personnes[a] — furent préservées à travers l’eau[b].
