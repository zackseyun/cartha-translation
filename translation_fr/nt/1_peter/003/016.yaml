id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: fr
  text: mais avec douceur et crainte[a], tout en ayant une bonne conscience, afin que, là où l’on dit du mal de vous[b], ceux qui dénigrent votre bonne conduite dans le Messie[c] soient couverts de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec douceur et révérence » ou « avec douceur et respect ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans l’affaire même où l’on parle contre vous ».
    reason: lexical_alternative
  - marker: c
    text: Traditionnellement « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: douceur
  rationale: « Douceur » exprime une attitude humble et non agressive dans un français moderne et naturel.
- source_word: φόβου
  choice: crainte
  rationale: « Crainte » conserve l’ampleur du grec, qui peut évoquer la peur, la révérence ou le respect, sans préciser un objet que le texte ne nomme pas.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: en gardant une bonne conscience
  rationale: Cette formulation française rend naturellement la circonstance continue exprimée par le participe tout en conservant l’idée d’une bonne conscience.
- source_word: ἐν ᾧ
  choice: là même où
  rationale: Cette expression garde la référence ouverte et comprimée du grec à la situation ou au domaine dans lequel les destinataires sont attaqués verbalement.
- source_word: καταλαλεῖσθε
  choice: l’on parle contre vous
  rationale: La formulation rend directement l’idée de paroles hostiles sans imposer la qualification juridique ou factuelle plus étroite de « calomnier ».
- source_word: καταισχυνθῶσιν
  choice: soient couverts de honte
  rationale: Cette tournure conserve la voix passive et la nuance de but ou de résultat introduite par ἵνα.
- source_word: ἐπηρεάζοντες
  choice: ceux qui calomnient
  rationale: Dans ce contexte de paroles dirigées contre la conduite des croyants, « calomnient » rend l’hostilité active du terme et s’accorde naturellement avec son complément.
- source_word: ἀναστροφήν
  choice: conduite
  rationale: « Conduite » rend avec concision la manière de vivre envisagée sous son aspect moral.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Χριστός garde ici sa valeur de titre; « le Messie » en traduit le sens plutôt que de le translittérer.
- source_word: ἀγαθὴν
  choice: bonne
  rationale: « Bonne » conserve le vocabulaire moral simple du grec ainsi que la répétition avec « bonne conscience ».
theological_decisions:
- issue: Sens de φόβου dans « avec douceur et crainte »
  choice: Conserver « crainte » sans en préciser l’objet.
  alternative: « révérence », « respect » ou « crainte de Dieu »
  rationale: Le contexte immédiat ne nomme pas explicitement l’objet de la crainte. Le texte principal préserve donc cette tension interprétative.
- issue: Traduction de Χριστῷ
  choice: Messie
  alternative: Christ
  rationale: Dans l’expression ἐν Χριστῷ, le sens titulaire demeure perceptible; « Messie » communique ce sens, tandis que la forme traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement l’enchaînement grec sans devenir artificielle. « Crainte » et la référence ouverte de ἐν ᾧ sont maintenues afin de ne pas résoudre silencieusement les ambiguïtés du texte source.
