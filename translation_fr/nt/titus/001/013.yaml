id: TIT.1.13
reference: Titus 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: fr
  text: Ce témoignage est vrai. C’est pourquoi reprends-les sévèrement, afin qu’ils soient sains dans la foi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sains dans leur foi ». L’expression grecque peut évoquer soit la santé de leur foi personnelle, soit leur solidité dans la foi chrétienne comprise comme un ensemble de croyances.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: témoignage
  rationale: « Témoignage » conserve la portée probante de l’affirmation citée au verset précédent et convient mieux que le terme plus général « déclaration ».
- source_word: ἀληθής
  choice: vrai
  rationale: L’adjectif attribut affirme que ce témoignage correspond à la réalité ; « vrai » est direct et naturel.
- source_word: δι’ ἣν αἰτίαν
  choice: C’est pourquoi
  rationale: Cette tournure française actuelle rend clairement le lien causal avec l’affirmation précédente.
- source_word: ἔλεγχε
  choice: reprends-les
  rationale: L’impératif présent demande à Tite de confronter et de corriger directement les personnes concernées. « Reprendre » exprime cette correction vigoureuse sans ajouter l’idée d’une sanction.
- source_word: ἀποτόμως
  choice: sévèrement
  rationale: L’adverbe indique une manière tranchante ou rigoureuse. « Sévèrement » en garde la force dans un français naturel.
- source_word: ὑγιαίνωσιν
  choice: soient sains
  rationale: Ce choix préserve la métaphore de la santé, employée ici au sens spirituel ou doctrinal, plutôt que de la remplacer par une interprétation comme « soient fermes ».
- source_word: ἐν τῇ πίστει
  choice: dans la foi
  rationale: Avec l’article, l’expression peut désigner la foi chrétienne comme domaine ou contenu de croyance. La traduction conserve toutefois une ambiguïté réelle, explicitée en note.
theological_decisions:
- issue: Sens de ἐν τῇ πίστει
  choice: dans la foi
  alternative: dans leur foi
  rationale: Dans les épîtres pastorales, πίστις avec l’article peut désigner la foi chrétienne comme ensemble reconnu de croyances, ce qui convient au contexte des faux enseignants. Le grec peut aussi viser la qualité de leur foi personnelle ; cette possibilité est donc conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Reprends-les sévèrement » garde la vigueur de l’ordre, tandis que « soient sains » préserve l’image grecque de la santé. La virgule finale est maintenue puisque le verset se poursuit syntaxiquement au verset 14.
