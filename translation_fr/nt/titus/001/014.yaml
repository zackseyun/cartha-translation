id: TIT.1.14
reference: Titus 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: fr
  text: sans prêter attention à des mythes juifs ni à des commandements de personnes qui se détournent de la vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans s’attacher à des mythes juifs ni à des commandements de personnes qui se détournent de la vérité ».'
    reason: Alternative lexicale pour μὴ προσέχοντες.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: sans prêter attention à
  rationale: Le participe présent poursuit l’exhortation du contexte et exprime le fait de ne pas tourner son attention vers ces enseignements. Cette formulation est naturelle en français moderne.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: à des mythes juifs
  rationale: « Mythes » rend clairement μῦθοι comme récits inventés ou légendaires, tandis que « juifs » conserve la caractérisation adjectivale sans la préciser davantage.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: à des commandements humains
  rationale: Cette expression conserve le contraste entre des prescriptions d’origine humaine et la vérité, tout en évitant une formulation inutilement genrée.
- source_word: ἀποστρεφομένων
  choice: venant de gens qui se détournent de
  rationale: Le participe au génitif pluriel se rattache le plus naturellement à ἀνθρώπων. « Se détournent de » préserve l’image verbale du grec plutôt que de la réduire à « rejettent ».
- source_word: τὴν ἀλήθειαν
  choice: la vérité
  rationale: Rendu direct et courant qui n’explicite pas davantage le référent théologique que ne le fait le texte grec.
theological_decisions:
- issue: Référent du participe au génitif ἀποστρεφομένων
  choice: 'Le participe qualifie les personnes à l’origine des commandements : « des commandements humains venant de gens qui se détournent de la vérité »'
  alternative: Comprendre plus largement les mythes et les commandements comme associés à ceux qui se détournent de la vérité.
  rationale: L’accord au génitif pluriel et la proximité de ἀνθρώπων favorisent le rattachement aux personnes. L’ajout de « venant de » rend cette relation intelligible en français sans introduire de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Prêter attention » convient au registre courant soutenu; « gens » évite la lecture exclusivement masculine, tandis que « commandements humains » reste proche du grec. Le marqueur [a] figure dans le texte principal.
