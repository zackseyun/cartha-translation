id: TIT.1.3
reference: Titus 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: fr
  text: mais, aux temps qu’il avait fixés[a], il a manifesté sa parole par la proclamation[b] qui m’a été confiée[c], conformément au commandement de Dieu notre Sauveur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ses propres temps ». L’expression grecque peut aussi se comprendre comme « aux temps fixés »; elle désigne vraisemblablement les temps déterminés par Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « par la prédication ». Le terme grec peut désigner soit l’acte de proclamer, soit le message proclamé.
    reason: lexical_alternative
  - marker: c
    text: 'La proposition relative peut aussi être rattachée à « sa parole » : « sa parole… qui m’a été confiée ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: il a manifesté
  rationale: L’aoriste actif présente Dieu, sujet implicite repris du contexte, comme celui qui rend sa parole publique. « A manifesté » conserve l’idée de faire paraître ouvertement ce qui était auparavant caché.
- source_word: καιροῖς ἰδίοις
  choice: en ses temps à lui
  rationale: Cette formulation préserve avec insistance la valeur possessive de ἰδίοις et évoque les temps déterminés par Dieu, sans réduire le pluriel grec à un singulier.
- source_word: τὸν λόγον αὐτοῦ
  choice: sa parole
  rationale: « Parole » garde le lien lexical avec λόγος tout en désignant naturellement ici le message communiqué par Dieu.
- source_word: ἐν κηρύγματι
  choice: par la proclamation
  rationale: La préposition reçoit ici une valeur instrumentale. « Proclamation » peut désigner aussi bien l’acte de proclamer que le message proclamé, ce qui maintient l’étendue sémantique de κήρυγμα.
- source_word: ὃ
  choice: qui
  rationale: Le relatif neutre singulier a pour antécédent syntaxique le plus proche κήρυγμα. La formulation française rattache naturellement la proposition à « la proclamation » sans empêcher de signaler l’autre analyse en note.
- source_word: ἐπιστεύθην
  choice: m’a été confiée
  rationale: Dans cette construction, le passif de πιστεύω exprime le fait de confier une responsabilité ou un dépôt à quelqu’un, et non l’acte de croire.
- source_word: κατ’ ἐπιταγὴν
  choice: conformément au commandement
  rationale: κατά avec l’accusatif indique ici la conformité à une directive faisant autorité. Cette traduction est exacte et naturelle en français.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: de Dieu notre Sauveur
  rationale: Cette formulation rend l’apposition grecque avec naturel et conserve à Dieu le titre de « notre Sauveur ».
theological_decisions:
- issue: Sujet implicite de ἐφανέρωσεν et valeur possessive de καιροῖς ἰδίοις
  choice: 'Dieu est le sujet : « en ses temps à lui, il a manifesté »'
  alternative: 'Une tournure impersonnelle : « aux temps fixés, elle a été manifestée »'
  rationale: Le contexte précédent présente Dieu comme celui qui a promis avant les temps éternels, puis a manifesté sa parole. Le sujet personnel et le possessif maintiennent ce fil discursif.
- issue: Antécédent du pronom relatif ὃ
  choice: Le relatif renvoie principalement à « la proclamation »
  alternative: 'Le relatif peut être rattaché à « sa parole » : « sa parole… qui m’a été confiée »'
  rationale: κήρυγμα est l’antécédent le plus proche, et ἐπιστεύθην se prête naturellement à l’idée d’une proclamation confiée à Paul. L’autre rattachement reste grammaticalement possible et est conservé en note.
translation_notes:
  register: Français moderne, digne et accessible. « En ses temps à lui » assume une légère insistance afin de préserver le possessif grec; « aux temps qu’il avait fixés » serait plus idiomatique, mais plus interprétatif. La ponctuation finale conserve la continuité syntaxique avec le verset suivant ou avec l’ensemble de la salutation.
