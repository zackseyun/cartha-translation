id: TIT.1.16
reference: Titus 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: fr
  text: 'Ils déclarent connaître Dieu[a], mais ils le renient par leurs actes[b] : ils sont détestables, désobéissants et inaptes à toute œuvre bonne[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils prétendent connaître Dieu. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mais par les œuvres ils le renient » ; le grec peut aussi se comprendre : « mais dans leurs œuvres ils le renient ».'
    reason: source_ambiguity
  - marker: c
    text: 'Ou : « disqualifiés pour toute œuvre bonne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Dieu
  rationale: Complément de εἰδέναι et référent repris implicitement avec ἀρνοῦνται ; « Dieu » est la traduction directe.
- source_word: ὁμολογοῦσιν
  choice: ils déclarent
  rationale: Dans le contraste avec les actes, le verbe désigne une affirmation ouverte. « Déclarent » reste naturel et n'impose pas à lui seul un jugement sur leur sincérité.
- source_word: εἰδέναι
  choice: connaître
  rationale: L'infinitif exprime la connaissance de Dieu qu'ils disent posséder.
- source_word: τοῖς δὲ ἔργοις
  choice: mais ... par leurs actes
  rationale: Le datif peut exprimer le moyen ou la sphère. « Par leurs actes » rend clairement le contraste entre leur affirmation verbale et leur conduite.
- source_word: ἀρνοῦνται
  choice: ils le renient
  rationale: « Renier » exprime fortement le rejet d'une personne et reprend naturellement Dieu comme objet implicite.
- source_word: βδελυκτοὶ
  choice: détestables
  rationale: Le terme exprime une profonde répulsion morale ; « détestables » en conserve la force dans un français actuel et digne.
- source_word: ὄντες
  choice: ils sont
  rationale: La proposition participiale est rendue par une proposition indépendante après les deux-points, formulation plus naturelle en français.
- source_word: ἀπειθεῖς
  choice: désobéissants
  rationale: Dans ce contexte éthique, le mot désigne ceux qui refusent de se soumettre ou d'obéir.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: à toute œuvre bonne
  rationale: πρός marque ici l'aptitude ou la relation ; « à toute œuvre bonne » s'accorde idiomatiquement avec « inaptes ».
- source_word: ἀδόκιμοι
  choice: inaptes
  rationale: Le mot indique qu'ils ne satisfont pas au critère requis et ne conviennent donc pas à l'accomplissement d'une œuvre bonne.
theological_decisions:
- issue: Rapport entre la déclaration verbale et le reniement pratique
  choice: Ils affirment connaître Dieu, tandis que leurs actes reviennent à le renier.
  alternative: Comprendre qu'ils rejettent plus largement la vérité de Dieu plutôt que Dieu lui-même.
  rationale: Dieu est l'objet explicite de la première proposition et demeure le référent naturel du pronom objet implicite dans la seconde. La traduction maintient la tension entre profession et conduite sans développer une conclusion doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. « Déclarent » préserve l'idée d'une profession explicite sans rendre nécessairement l'insincérité, proposée en note par « prétendent ». Les deux-points rendent naturellement le participe ὄντες sans affaiblir la série de trois qualificatifs.
