  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: fr
  text: 'L’un d’entre eux, leur propre prophète, a dit : « Les Crétois sont toujours menteurs, bêtes féroces, ventres paresseux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque signifie littéralement « ventres paresseux »; elle évoque des gens qui vivent pour manger sans vouloir travailler.
    reason: Éclaircissement d’une image idiomatique conservée dans le texte.
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: L’un d’entre eux ... a dit
  rationale: Cette formulation naturelle conserve à la fois la valeur indéfinie de τις et le sens partitif de ἐξ αὐτῶν.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: leur propre prophète
  rationale: ἴδιος souligne que le prophète appartient au groupe des Crétois eux-mêmes.
- source_word: Κρῆτες ἀεὶ ψεῦσται
  choice: Les Crétois sont toujours menteurs
  rationale: Rendu direct de la proposition nominale grecque; « toujours » préserve la force absolue de ἀεί dans cette citation proverbiale.
- source_word: κακὰ θηρία
  choice: bêtes féroces
  rationale: « Bêtes » conserve l’image animale de θηρία, tandis que « féroces » exprime ici avec naturel la valeur hostile et nuisible de κακά.
- source_word: γαστέρες ἀργαί
  choice: ventres paresseux
  rationale: Le calque intelligible garde l’image corporelle et insultante du grec, sans la réduire à la seule idée de gloutonnerie.
theological_decisions:
- issue: Citation d’un stéréotype ethnique particulièrement sévère
  choice: Traduire directement les paroles citées et conserver leur dureté
  alternative: Atténuer l’énoncé par une paraphrase moins généralisante
  rationale: Le texte présente explicitement cette formule comme la parole d’un prophète crétois. La traduction doit préserver la force et la tension rhétoriques de la citation sans transformer celle-ci en commentaire explicatif.
translation_notes:
  register: Français international moderne, direct et digne. La structure brève en trois accusations conserve le rythme proverbial. « Leur propre prophète » maintient l’insistance du grec; le vocabulaire rude n’est pas adouci.
