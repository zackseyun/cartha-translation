id: TIT.1.11
reference: Titus 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: fr
  text: Il faut leur fermer la bouche[a], car ils bouleversent des familles entières[b] en enseignant ce qu’il ne faut pas, pour un gain honteux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les réduire au silence » ; littéralement : « leur fermer la bouche ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme grec peut désigner des maisonnées entières, c’est-à-dire les membres d’une famille et les personnes qui en dépendent, et non simplement des bâtiments.
    reason: cultural_note
  - marker: c
    text: 'Ou : « pour un profit sordide ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: Il faut leur fermer la bouche
  rationale: La tournure française conserve à la fois l’idée de nécessité exprimée par δεῖ et l’image concrète de ἐπιστομίζειν, qui signifie littéralement empêcher quelqu’un de parler. Dans le contexte, il s’agit de mettre fin à leur enseignement nuisible, sans préciser la méthode.
- source_word: οἵτινες
  choice: car ils
  rationale: 'Le relatif a ici une valeur explicative ou causale : la perturbation des familles justifie la nécessité de les faire taire.'
- source_word: ὅλους οἴκους
  choice: des familles entières
  rationale: οἶκος désigne ici vraisemblablement la maisonnée comme unité familiale et sociale, plutôt qu’un bâtiment. « Familles entières » est naturel et immédiatement compréhensible en français moderne.
- source_word: ἀνατρέπουσιν
  choice: bouleversent
  rationale: Le verbe évoque le renversement, la désorganisation ou la ruine. « Bouleversent » exprime une grave déstabilisation sans imposer l’idée d’une destruction totale.
- source_word: διδάσκοντες
  choice: en enseignant
  rationale: Le participe indique le moyen par lequel ces personnes bouleversent les familles.
- source_word: ἃ μὴ δεῖ
  choice: ce qu’il ne faut pas
  rationale: Cette formulation française conserve l’expression impersonnelle et l’idée que le contenu enseigné est inadmissible, sans ajouter ce que le grec ne précise pas.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: pour un gain honteux
  rationale: La formule rend le motif intéressé et moralement répréhensible. « Gain honteux » est clair, actuel et proche de la force de αἰσχρός.
theological_decisions:
- issue: Nature de l’action exigée contre les faux enseignants
  choice: Il faut leur fermer la bouche
  alternative: Il faut les réduire au silence
  rationale: L’image grecque est conservée, mais le texte ne précise ni sanction civile ni violence physique. Dans le contexte, l’exigence porte sur l’arrêt de leur enseignement nuisible.
- issue: Portée de οἶκος
  choice: des familles entières
  alternative: des maisons entières / des maisonnées entières
  rationale: Le terme peut désigner la maison ou la maisonnée. Le contexte des effets sociaux de l’enseignement favorise l’unité familiale, tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, direct et digne. La phrase conserve la vigueur de l’image grecque « fermer la bouche », tout en évitant de préciser un moyen coercitif absent du texte. « Familles entières » privilégie la compréhension immédiate, avec la nuance socioculturelle donnée en note.
