id: TIT.1.9
reference: Titus 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: fr
  text: fermement attaché à la parole digne de confiance, conforme à l’enseignement, afin d’être capable à la fois d’exhorter par l’enseignement sain et de reprendre[a] ceux qui s’y opposent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réfuter ceux qui s’y opposent ». Le verbe grec peut aussi désigner le fait de démontrer une erreur ou de convaincre quelqu’un de son erreur, en plus de le reprendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: fermement attaché à
  rationale: Le participe exprime une adhésion tenace et durable. Cette formulation est naturelle en français et conserve la force active du grec.
- source_word: πιστοῦ λόγου
  choice: la parole digne de confiance
  rationale: Dans ce contexte, πιστός qualifie vraisemblablement la parole de fiable. « Parole » conserve le terme λόγος sans réduire son sens à un simple discours.
- source_word: κατὰ τὴν διδαχήν
  choice: conforme à l’enseignement
  rationale: κατά avec l’accusatif marque ici la conformité. L’article défini renvoie à un enseignement reconnu plutôt qu’à une instruction quelconque.
- source_word: δυνατὸς ᾖ
  choice: être capable
  rationale: Cette expression rend clairement la capacité visée par la proposition de but introduite par ἵνα.
- source_word: παρακαλεῖν
  choice: exhorter
  rationale: Dans ce cadre pastoral, le verbe désigne une exhortation positive et pressante, et non seulement une consolation ou un encouragement.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: par l’enseignement sain
  rationale: « Sain » conserve la métaphore de la santé portée par ὑγιαίνω. « Par » exprime naturellement le moyen par lequel l’exhortation s’exerce.
- source_word: ἀντιλέγοντας
  choice: ceux qui s’y opposent
  rationale: Le participe désigne ceux qui parlent contre la parole ou l’enseignement. Le pronom « y » laisse au contexte le soin d’en préciser le référent sans l’alourdir.
- source_word: ἐλέγχειν
  choice: reprendre
  rationale: Le verbe peut désigner le fait de mettre l’erreur en évidence, de réfuter et de corriger. « Reprendre » conserve ici sa portée pastorale et corrective, tandis qu’une note signale la nuance argumentative.
theological_decisions:
- issue: Référence de « la parole digne de confiance » et de « l’enseignement »
  choice: Les expressions renvoient à l’enseignement chrétien reconnu auquel le responsable doit rester attaché.
  alternative: Une référence générale à une instruction morale saine.
  rationale: L’article de διδαχή et l’emploi de πιστὸς λόγος dans les épîtres pastorales suggèrent un contenu transmis et reconnu. La traduction le laisse entendre sans introduire de catégories dogmatiques ultérieures.
- issue: Portée de ἐλέγχειν à l’égard des opposants
  choice: « reprendre », avec la nuance de correction pastorale
  alternative: « réfuter », qui met davantage l’accent sur la démonstration de l’erreur
  rationale: Le contexte associe l’enseignement positif à la confrontation de la contradiction. Le texte principal retient la dimension corrective, et la note préserve la possibilité d’une nuance argumentative.
translation_notes:
  register: Français moderne, digne et accessible. « Exhorter » et « enseignement sain » conservent le registre pastoral du passage sans recourir à un jargon confessionnel. Le participe grec s’inscrit dans la série des qualités requises du responsable, d’où l’ouverture sans sujet exprimé.
