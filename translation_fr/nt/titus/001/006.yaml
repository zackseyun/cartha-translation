source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: fr
  text: si quelqu’un est irréprochable, mari d’une seule femme[a], ayant des enfants fidèles[b] qui ne soient ni accusés de débauche ni insoumis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme fidèle à sa femme » ; littéralement « homme d’une seule femme ».
    reason: lexical_alternative
  - marker: b
    text: Ou « croyants ». Le grec πιστά peut signifier « fidèles » ou « croyants ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: irréprochable
  rationale: Exprime l’idée qu’aucune accusation légitime ne peut être retenue contre lui, sans suggérer une perfection absolue.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: mari d’une seule femme
  rationale: Rendu formellement transparent qui conserve la formulation masculine et évite de trancher les questions débattues sur la portée exacte de l’expression.
- source_word: τέκνα
  choice: enfants
  rationale: Équivalent courant et naturel dans ce contexte familial.
- source_word: πιστά
  choice: fidèles
  rationale: Conserve le sens de fiabilité ou de fidélité, tout en signalant en note le sens également possible de « croyants ».
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: accusés de débauche
  rationale: Formulation française naturelle qui maintient à la fois la notion d’accusation et celle d’une conduite moralement dissolue.
- source_word: ἀνυπότακτα
  choice: insoumis
  rationale: Rend l’idée d’un refus de se soumettre à l’autorité ou à l’ordre établi.
theological_decisions:
- issue: Sens de πιστά dans τέκνα ἔχων πιστά
  choice: des enfants fidèles
  alternative: des enfants croyants
  rationale: Le grec peut qualifier la fidélité ou la fiabilité des enfants, ou indiquer qu’ils sont croyants. Le texte principal retient le sens plus large et la note préserve l’autre lecture.
- issue: Portée de μιᾶς γυναικὸς ἀνήρ
  choice: mari d’une seule femme
  alternative: un homme fidèle à sa femme
  rationale: La traduction transparente préserve l’ambiguïté de l’expression quant au statut matrimonial, à la fidélité sexuelle et au remariage, sans imposer une conclusion confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la forme conditionnelle amorcée au verset précédent. « Irréprochable » appartient au registre courant soutenu des qualifications morales; « débauche » et « insoumis » préservent la gravité du grec sans archaïsme.
