id: TIT.1.1
reference: Titus 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: fr
  text: Paul, esclave de Dieu et apôtre de Jésus le Messie, en vue de la foi de ceux que Dieu a choisis[a] et de la connaissance[b] de la vérité qui s’accorde avec la piété[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les élus de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la pleine connaissance ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de la vérité qui conduit à la piété ».'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le terme exprime ici l’appartenance entière de Paul à Dieu et son statut de personne placée sous son autorité; « serviteur » en atténuerait la force.
- source_word: ἀπόστολος
  choice: apôtre
  rationale: Terme français établi qui désigne précisément la mission reçue et l’autorité déléguée de Paul.
- source_word: δὲ
  choice: et
  rationale: Dans cette série de titres, δέ assure une liaison légère plutôt qu’une opposition.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre; la tournure avec article est idiomatique en français.
- source_word: κατὰ
  choice: en vue de
  rationale: Cette expression rend l’orientation de l’apostolat de Paul vers la foi et la connaissance, tout en évitant une formulation française rigide avec « selon ».
- source_word: πίστιν
  choice: foi
  rationale: Dans ce contexte, le mot désigne naturellement la confiance croyante de ceux que Dieu a choisis.
- source_word: ἐκλεκτῶν θεοῦ
  choice: ceux que Dieu a choisis
  rationale: Formulation accessible qui conserve clairement l’idée du choix divin sans lui imposer un système théologique particulier.
- source_word: ἐπίγνωσιν
  choice: connaissance
  rationale: « Connaissance » est naturel et suffisant; la nuance intensive possible est signalée en note.
- source_word: ἀληθείας
  choice: la vérité
  rationale: L’article grec désigne ici la vérité reconnue et enseignée, plutôt que la vérité prise seulement comme notion abstraite.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: qui s’accorde avec la piété
  rationale: La formulation conserve le rapport de conformité exprimé par κατά sans transformer explicitement ce rapport en causalité.
- source_word: εὐσέβειαν
  choice: piété
  rationale: Dans les épîtres pastorales, « piété » désigne de manière concise une vie de respect et de dévouement envers Dieu.
theological_decisions:
- issue: Sens de ἐκλεκτῶν θεοῦ
  choice: ceux que Dieu a choisis
  alternative: les élus de Dieu
  rationale: Le texte affirme sans ambiguïté le choix de Dieu, mais la formulation retenue est plus immédiatement compréhensible et ne précise pas davantage la nature de ce choix.
- issue: Rapport exprimé par κατὰ πίστιν … καὶ ἐπίγνωσιν
  choice: l’apostolat est orienté vers la foi et la connaissance
  alternative: l’apostolat est conforme à la foi et à la connaissance
  rationale: La syntaxe grecque est condensée et permet plusieurs nuances. « En vue de » exprime vraisemblablement l’orientation missionnelle sans développer un mécanisme théologique absent du verset.
- issue: Rapport entre la vérité et la piété
  choice: la vérité s’accorde avec la piété
  alternative: la vérité conduit à la piété
  rationale: Le rapport de conformité rend directement κατά et préserve la possibilité d’un rapport dynamique, indiquée en note, sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, digne et lisible. « Esclave » conserve la force de δοῦλος; « piété » est employé dans son sens biblique de vie respectueuse et dévouée envers Dieu. La phrase reste ouverte par une virgule, conformément à la syntaxe qui se poursuit au verset suivant.
