  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: fr
  text: dans l’espérance de la vie éternelle, que Dieu, qui ne ment pas, a promise avant le commencement des âges[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avant que le temps ne commence ». Le grec dit littéralement : « avant des temps éternels »; l’expression peut aussi évoquer les âges.'
    reason: La formule πρὸ χρόνων αἰωνίων est inhabituelle et peut être rendue de diverses manières. La note conserve l’alternative « temps » sans faire de cette lecture interprétative le sens exclusif du texte.
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: dans l’espérance
  rationale: Avec le datif, ἐπί peut indiquer la sphère, la base ou la circonstance. « Dans l’espérance » est naturel en français et maintient le lien avec la mission évoquée dans le contexte sans préciser excessivement la relation logique.
- source_word: ζωῆς αἰωνίου
  choice: de la vie éternelle
  rationale: Le génitif indique naturellement le contenu ou l’objet de l’espérance. « Vie éternelle » est l’expression française courante et conserve la portée temporelle et théologique de la formule grecque.
- source_word: ἣν
  choice: que
  rationale: Le pronom relatif féminin singulier renvoie le plus naturellement à « la vie éternelle », elle aussi au féminin singulier en français.
- source_word: ἐπηγγείλατο
  choice: a promise
  rationale: Le passé composé rend ici naturellement l’aoriste de ἐπαγγέλλομαι. Le français n’exprime pas normalement la nuance de voix moyenne dans cet emploi.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Dieu, qui ne ment pas
  rationale: ἀψευδής qualifie celui qui ne ment pas, qui est véridique. La proposition relative est claire et naturelle, sans renforcer le texte en « qui ne peut pas mentir ».
- source_word: πρὸ χρόνων αἰωνίων
  choice: avant le commencement des temps
  rationale: Cette formulation française naturelle exprime l’antériorité aux temps ou aux âges tout en évitant l’étrangeté de « avant les temps éternels ». Une note conserve la forme plus littérale et l’ambiguïté de αἰώνιος.
theological_decisions:
- issue: La promesse divine située πρὸ χρόνων αἰωνίων
  choice: avant le commencement des temps
  alternative: avant les temps éternels ; avant que le temps commence ; de toute éternité
  rationale: Le grec place la promesse avant les temps ou les âges, mais ne précise ni son destinataire ni le mécanisme théologique de cette promesse. La traduction conserve l’affirmation prétemporelle sans la transformer explicitement en décret ou en promesse intratrinitaire.
- issue: La description de Dieu par ἀψευδής
  choice: Dieu, qui ne ment pas
  alternative: le Dieu véridique ; Dieu, qui ne peut pas mentir
  rationale: La formulation retenue rend directement l’adjectif grec sans intensification doctrinale. « Qui ne peut pas mentir » exprimerait une conclusion théologique plus forte que la forme lexicale elle-même.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste un fragment syntaxiquement lié au verset précédent. La ponctuation autour de « qui ne ment pas » privilégie une lecture naturelle sans faire de l’expression une paraphrase doctrinale.
