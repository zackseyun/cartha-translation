source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: fr
  text: Car il y a beaucoup de gens, insoumis, qui tiennent des propos vides et sont des trompeurs, surtout ceux de la circoncision[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux du parti de la circoncision » ou « ceux issus de la circoncision ». L’expression désigne probablement des adversaires juifs ou judaïsants, mais le grec est moins explicite.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit la raison explicative de l’instruction qui précède et conserve clairement le lien logique.
- source_word: πολλοὶ καὶ ἀνυπότακτοι
  choice: beaucoup de gens insoumis
  rationale: L’adjectif substantivé désigne des personnes qui refusent de se soumettre à l’autorité légitime. En français courant, « gens insoumis » est naturel; le καί transmis avant ἀνυπότακτοι ne demande pas nécessairement un « et » autonome dans cette construction, dont la formulation française regroupe les qualificatifs.
- source_word: ματαιολόγοι
  choice: qui tiennent des discours vides de sens
  rationale: Exprime l’idée de paroles futiles, creuses ou sans valeur. Cette formulation est plus naturelle et immédiatement compréhensible que « vains discoureurs ».
- source_word: φρεναπάται
  choice: trompent les autres
  rationale: Le terme désigne des personnes qui égarent ou abusent les esprits. La tournure verbale française conserve l’accusation tout en s’accordant naturellement avec la proposition précédente.
- source_word: μάλιστα
  choice: surtout
  rationale: Met particulièrement en relief un sous-groupe au sein de l’ensemble évoqué.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: ceux qui sont de la circoncision
  rationale: Rendu volontairement transparent de l’expression grecque compacte, sans ajouter explicitement « parti », « Juifs » ou « judaïsants ».
theological_decisions:
- issue: Référent de « ceux qui sont de la circoncision »
  choice: Conserver dans le texte l’expression « ceux qui sont de la circoncision ».
  alternative: « ceux du parti de la circoncision » ou « ceux issus du judaïsme »
  rationale: Le contexte peut viser des adversaires juifs ou judaïsants, mais le grec ne nomme ni un parti organisé ni les Juifs de façon explicite. La traduction maintient donc cette relative indétermination.
translation_notes:
  register: Français international moderne, clair et digne. Les substantifs grecs sont rendus par des propositions relatives idiomatiques; l’expression historique et théologiquement chargée sur la circoncision reste volontairement proche du grec et reçoit une note explicative.
