  to: Car il y a beaucoup de gens, insoumis, qui tiennent des propos vides et sont des trompeurs, surtout ceux de la circoncision[a].
  rationale: La révision rétablit explicitement la coordination du grec entre « nombreux » et « insoumis », rend les deux substantifs suivants par des qualifications parallèles sans ajouter d'objet à « trompeurs », et conserve une expression sobre et non interprétative pour le groupe « de la circoncision ».
