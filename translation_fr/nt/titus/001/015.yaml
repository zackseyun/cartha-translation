id: TIT.1.15
reference: Titus 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: fr
  text: Tout est pur pour ceux qui sont purs ; mais pour ceux qui sont souillés et incroyants, rien n’est pur. Au contraire, leur intelligence comme leur conscience sont souillées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: Tout
  rationale: Le neutre pluriel a ici une portée globale. « Tout » est naturel en français et conserve la forme concise et sentencieuse de l’énoncé.
- source_word: καθαρὰ / καθαρόν / καθαροῖς
  choice: pur / purs
  rationale: « Pur » peut porter en français des résonances rituelles et morales, comme le grec καθαρός, sans limiter le propos à la propreté matérielle.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: pour ceux qui sont souillés
  rationale: 'Le participe parfait décrit un état résultant : ces personnes se trouvent dans un état de souillure. « Sont souillés » préserve ce sens tout en restant idiomatique.'
- source_word: ἀπίστοις
  choice: incroyants
  rationale: Dans ce contexte, le terme désigne ceux qui ne croient pas plutôt que, plus spécifiquement, des personnes infidèles ou déloyales.
- source_word: οὐδὲν καθαρόν
  choice: rien n’est pur
  rationale: Cette formulation reproduit le parallélisme avec la première proposition et maintient le même champ lexical.
- source_word: ἀλλὰ
  choice: Au contraire
  rationale: L’expression marque nettement le contraste et introduit la véritable source de la souillure, située dans les facultés intérieures.
- source_word: μεμίανται
  choice: sont souillées
  rationale: Le parfait exprime l’état présent issu d’une souillure. La reprise de « souillés » rend visible le lien lexical avec le participe précédent.
- source_word: νοῦς
  choice: intelligence
  rationale: « Intelligence » désigne ici la faculté de comprendre et de juger, avec un registre naturel et digne. « Esprit » risquerait une ambiguïté plus large en français.
- source_word: συνείδησις
  choice: conscience
  rationale: C’est l’équivalent français usuel pour la faculté intérieure de discernement et de jugement moral.
- source_word: καὶ ... καὶ
  choice: comme
  rationale: La construction « leur intelligence comme leur conscience » souligne naturellement en français que les deux facultés sont concernées.
theological_decisions:
- issue: Portée du vocabulaire de la pureté
  choice: Employer « pur » dans tout le verset afin de conserver ensemble les dimensions rituelle et morale.
  alternative: Employer « propre » ou « rituellement pur », ce qui accentuerait ou préciserait la dimension cérémonielle.
  rationale: Le contexte évoque des préoccupations liées aux prescriptions juives, mais l’affirmation s’étend à l’état intérieur de la personne. « Pur » maintient cette ampleur et la tension du texte sans la résoudre.
- issue: Rapport entre souillure et incrédulité
  choice: 'Conserver deux qualificatifs coordonnés : « souillés et incroyants ».'
  alternative: Les fondre en une seule caractérisation, par exemple « souillés par leur incrédulité ».
  rationale: Le grec coordonne les deux termes sans préciser explicitement leur rapport causal ; la traduction évite donc d’en imposer un.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique et aphoristique du grec est conservée. Aucun marqueur de note n’est nécessaire, puisque « pur » restitue directement l’ambivalence rituelle et morale du terme grec.
