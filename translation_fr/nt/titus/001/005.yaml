id: TIT.1.5
reference: Titus 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: fr
  text: 'Voici pourquoi je t’ai laissé en Crète : pour que tu mettes en ordre ce qui restait à faire[a] et que tu établisses des anciens dans chaque ville[b], comme je te l’avais prescrit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui manquait ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ville par ville ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « comme je te l’avais ordonné ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Voici pourquoi
  rationale: Expression causale idiomatique qui relie naturellement ce verset à ce qui précède.
- source_word: ἀπέλιπόν
  choice: je t’ai laissé
  rationale: Rend simplement l’aoriste et la présence maintenue de Tite en Crète, sans accentuer inutilement l’idée d’abandon.
- source_word: ἐν Κρήτῃ
  choice: en Crète
  rationale: Forme locative française usuelle du nom de l’île.
- source_word: ἵνα
  choice: pour que
  rationale: Marque clairement le but dans un français moderne et naturel.
- source_word: τὰ λείποντα
  choice: ce qui restait à faire
  rationale: Exprime les affaires encore inachevées tout en conservant en note l’autre nuance possible, celle de ce qui manquait.
- source_word: ἐπιδιορθώσῃ
  choice: mettes en ordre
  rationale: Communique l’idée de corriger, d’organiser ou d’achever ce qui demeurait imparfait.
- source_word: καταστήσῃς
  choice: établisses
  rationale: Dans ce contexte, le verbe désigne la désignation ou l’installation de responsables; « établir » reste naturel et ne précise pas un mécanisme institutionnel absent du texte.
- source_word: κατὰ πόλιν
  choice: dans chaque ville
  rationale: Reproduit clairement la valeur distributive de κατά avec le singulier.
- source_word: πρεσβυτέρους
  choice: des anciens
  rationale: Désigne ici des responsables reconnus des communautés plutôt que de simples hommes âgés, sans imposer une structure confessionnelle ultérieure.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: comme je te l’avais prescrit
  rationale: Conserve la force d’une directive faisant autorité; le plus-que-parfait français situe naturellement cette prescription avant le moment évoqué.
theological_decisions:
- issue: Terminologie de la fonction ecclésiale pour πρεσβυτέρους
  choice: des anciens
  alternative: des presbytres; des hommes âgés
  rationale: Le contexte concerne des responsables reconnus, mais « anciens » évite de projeter sur le texte les structures propres à une tradition ecclésiale postérieure.
- issue: Force de διεταξάμην
  choice: je te l’avais prescrit
  alternative: je te l’avais ordonné; je te l’avais demandé
  rationale: « Prescrit » rend l’autorité de la directive sans durcir inutilement le ton ni l’affaiblir.
translation_notes:
  register: Français international moderne, clair et digne. La phrase rend explicitement le but par « pour que », emploie le terme ecclésial largement intelligible « anciens » et conserve en notes les principales nuances lexicales du grec.
