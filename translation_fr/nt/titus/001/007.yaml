id: TIT.1.7
reference: Titus 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: fr
  text: 'En effet, il faut que le responsable[a] soit irréprochable en sa qualité d’intendant de Dieu : il ne doit être ni arrogant, ni colérique, ni adonné au vin, ni violent, ni avide de gains honteux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « surveillant »; le terme est aussi traditionnellement traduit par « évêque ». Il désigne ici celui qui veille sur la communauté, sans préciser les structures ecclésiastiques développées ultérieurement.
    reason: alternative_reading
  - marker: b
    text: Ou « avide de gains malhonnêtes ». Le grec vise un profit recherché d’une manière moralement honteuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: il faut que
  rationale: Exprime clairement la nécessité et l’obligation en français courant.
- source_word: γὰρ
  choice: En effet
  rationale: Conserve le lien explicatif avec le verset précédent de manière naturelle en français.
- source_word: ἐπίσκοπον
  choice: le responsable
  rationale: Désigne ici celui qui exerce une fonction de surveillance et de direction dans la communauté, sans imposer les connotations institutionnelles plus tardives du titre « évêque ».
- source_word: ἀνέγκλητον
  choice: irréprochable
  rationale: Rend l’idée d’une personne contre laquelle aucune accusation fondée ne peut être retenue, sans suggérer une perfection absolue.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: en sa qualité d’intendant de Dieu
  rationale: Préserve l’idée de gestion confiée et de responsabilité envers Dieu; « en sa qualité de » rend la valeur de ὡς sans réduire la formule à une simple comparaison.
- source_word: αὐθάδη
  choice: arrogant
  rationale: Exprime l’attitude présomptueuse et centrée sur sa propre volonté impliquée par le terme grec, dans un langage accessible.
- source_word: ὀργίλον
  choice: colérique
  rationale: Décrit une disposition habituelle à la colère plutôt qu’un accès isolé.
- source_word: πάροινον
  choice: adonné au vin
  rationale: Conserve la référence explicite au vin et à un comportement caractérisé par son excès, sans surtraduire par « ivrogne ».
- source_word: πλήκτην
  choice: violent
  rationale: Rend naturellement le comportement agressif ou porté aux coups.
- source_word: αἰσχροκερδῆ
  choice: avide de gains honteux
  rationale: Préserve à la fois l’avidité et le caractère moralement déshonorant du profit recherché, qui ne se limite pas nécessairement à un gain illégal.
theological_decisions:
- issue: Traduction de ἐπίσκοπος dans un contexte de fonction ecclésiale
  choice: responsable
  alternative: évêque; surveillant
  rationale: « Responsable » communique la fonction exercée dans la communauté sans projeter sur le texte les structures hiérarchiques associées plus tard au titre « évêque ». La note conserve les autres possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la relation explicative avec le contexte et la série grecque de qualités négatives, tout en évitant un vocabulaire ecclésiastique susceptible d’imposer une structure confessionnelle particulière.
