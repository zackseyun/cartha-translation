  source_fidelity: 'Le texte rend fidèlement les éléments grecs essentiels : γνησίῳ τέκνῳ (« mon véritable enfant ») conserve la métaphore de filiation spirituelle ; « dans la foi que nous partageons » exprime de façon idiomatique la foi commune de κατὰ κοινὴν πίστιν ; et la bénédiction, ses deux sources et l’apposition « notre Sauveur » sont préservées. « Dieu le Père » respecte l’absence de ἡμῶν après πατρός. « Jésus le Messie » rend explicitement la valeur titulaire de Χριστός sans ajouter de contenu doctrinal.'
