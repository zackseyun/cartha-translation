reference: Titus 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: fr
  text: 'À Tite, mon véritable enfant dans la foi que nous partageons[a] : grâce et paix de la part de Dieu le Père et de Jésus le Messie, notre Sauveur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon une foi commune » ; autre traduction possible : « selon notre foi commune ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: mon véritable enfant
  rationale: L’expression désigne l’authenticité du lien spirituel qui unit Paul à Tite, non une filiation biologique. « Véritable enfant » conserve la métaphore familiale sans préciser davantage le genre grammatical du terme grec τέκνον.
- source_word: κατὰ κοινὴν πίστιν
  choice: dans la foi que nous partageons
  rationale: κατά exprime ici la relation ou le cadre dans lequel Tite est reconnu comme enfant spirituel, et κοινήν désigne ce qui est commun aux deux. Cette formulation est naturelle en français et évite le tour peu idiomatique « selon notre foi commune ».
- source_word: πίστιν
  choice: foi
  rationale: Dans ce contexte, πίστις renvoie à la foi chrétienne partagée plutôt qu’à la fidélité comme qualité.
- source_word: χάρις καὶ εἰρήνη
  choice: grâce et paix
  rationale: Formule de bénédiction épistolaire paulinienne, rendue par les équivalents français établis et exacts.
- source_word: θεοῦ πατρὸς
  choice: Dieu le Père
  rationale: Le grec ne porte pas ici ἡμῶν après πατρός ; « Dieu le Père » respecte donc précisément le texte.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu selon son contenu titulaire, « Messie ». L’ordre français « Jésus le Messie » est plus naturel que « Messie Jésus » tout en correspondant à l’expression grecque Χριστοῦ Ἰησοῦ.
- source_word: σωτῆρος ἡμῶν
  choice: notre Sauveur
  rationale: Le groupe en apposition identifie directement Jésus le Messie comme le Sauveur des croyants.
theological_decisions:
- issue: Valeur de Χριστός dans Χριστοῦ Ἰησοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ / Christ Jésus
  rationale: La traduction « Messie » fait entendre le sens du titre grec plutôt que de recourir à sa forme traditionnelle devenue proche d’un nom propre. L’ordre est adapté à l’usage naturel du français.
- issue: Référent de σωτῆρος ἡμῶν
  choice: « notre Sauveur » est en apposition à « Jésus le Messie »
  alternative: Comprendre le titre plus largement en relation avec l’ensemble de la proposition coordonnée
  rationale: La séquence Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν rattache le plus naturellement le groupe articulé τοῦ σωτῆρος à Jésus, qu’il identifie comme notre Sauveur.
translation_notes:
  register: Français international moderne, digne et accessible. La formule d’adresse reste concise ; « de la part de » explicite naturellement en français la provenance exprimée par ἀπό. Le titre « Messie » est conservé comme titre intelligible, et la ponctuation reproduit la progression de la salutation grecque.
