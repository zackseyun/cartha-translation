source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: fr
  text: elle nous forme[a] afin que, ayant renoncé à l’impiété et aux désirs de ce monde[b], nous vivions à l’époque actuelle avec maîtrise de soi, justice et piété[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle nous instruit » ou « elle nous discipline » ; le grec évoque une formation qui façonne la conduite.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux passions de ce monde ».
    reason: lexical_alternative
  - marker: c
    text: 'Le grec emploie trois adverbes : « avec maîtrise de soi », « justement » et « pieusement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: elle nous forme
  rationale: Le verbe reprend la grâce mentionnée au verset précédent. « Former » exprime à la fois l’instruction et la transformation morale, sans la dureté possible de « discipliner ».
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution naturelle conserve la valeur de but portée par ἵνα.
- source_word: ἀρνησάμενοι
  choice: renonçant
  rationale: Le participe exprime le rejet résolu de l’impiété et des désirs mondains. En français, le participe présent s’intègre naturellement à la construction finale sans imposer une chronologie plus rigide que le grec.
- source_word: ἀσέβειαν
  choice: l’impiété
  rationale: « Impiété » conserve la dimension religieuse et morale d’une conduite opposée au respect dû à Dieu.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: aux désirs de ce monde
  rationale: Cette formulation claire désigne les désirs propres à l’ordre présent sans suggérer que tout désir est mauvais.
- source_word: σωφρόνως
  choice: avec maîtrise de soi
  rationale: La locution adverbiale rend l’idée d’une conduite réfléchie, mesurée et disciplinée, thème récurrent de l’épître.
- source_word: δικαίως
  choice: avec justice
  rationale: La locution adverbiale garde l’idée d’une conduite conforme à ce qui est juste, sans transformer explicitement les adverbes grecs en adjectifs.
- source_word: εὐσεβῶς
  choice: avec piété
  rationale: « Piété » exprime une vie orientée vers Dieu et vécue dans le respect de celui-ci.
- source_word: ζήσωμεν
  choice: nous vivions
  rationale: Le subjonctif français après « afin que » restitue naturellement le subjonctif grec et sa valeur finale.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: dans le temps présent
  rationale: « Temps présent » garde la nuance eschatologique de αἰών, en contraste implicite avec l’âge à venir, tout en restant idiomatique.
theological_decisions:
- issue: Rapport temporel du participe ἀρνησάμενοι avec ζήσωμεν
  choice: « renonçant … nous vivions »
  alternative: « après avoir renoncé … nous vivions »
  rationale: Le participe aoriste peut présenter le renoncement comme logiquement préalable, mais la tournure française retenue préserve aussi son lien constitutif avec la manière de vivre demandée, sans surdéterminer la chronologie.
- issue: Triade éthique σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: « avec maîtrise de soi, justice et piété »
  alternative: « d’une manière réfléchie, juste et pieuse »
  rationale: Le grec emploie trois adverbes. La série de compléments introduite par « avec » reste naturelle en français, conserve les trois dimensions distinctes et évite de les réduire à une formule confessionnelle.
- issue: Sens eschatologique de αἰών
  choice: « dans le temps présent »
  alternative: « dans le monde présent »
  rationale: « Temps présent » maintient l’opposition entre l’époque actuelle et celle qui vient, tandis que « monde » pourrait être compris principalement comme l’univers créé ou la société.
translation_notes:
  register: Français international moderne, digne et accessible. Le pronom « elle » explicite le sujet féminin implicite du participe grec, à savoir la grâce du verset 11. La ponctuation finale maintient le lien syntaxique avec le verset suivant.
