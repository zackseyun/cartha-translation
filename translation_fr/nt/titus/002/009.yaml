  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: fr
  text: Que les esclaves[a] se soumettent en tout à leurs propres maîtres, qu’ils leur soient agréables et qu’ils ne les contredisent pas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne ici des personnes en situation d’esclavage.
    reason: historical_context
  - marker: b
    text: 'Ou : « ne leur répondent pas avec insolence » ; le verbe grec peut signifier contredire, répliquer ou parler contre quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: les esclaves
  rationale: Dans ce contexte domestique, δοῦλος désigne des personnes juridiquement et socialement soumises à des maîtres; « esclaves » préserve cette réalité sans l’atténuer.
- source_word: ἰδίοις δεσπόταις
  choice: à leurs propres maîtres
  rationale: δεσπότης désigne ici celui qui détient l’autorité sur l’esclave; ἰδίοις est explicitement rendu par « leurs propres ».
- source_word: ὑποτάσσεσθαι
  choice: se soumettent
  rationale: Le présent infinitif exprime l’attitude durable demandée; le subjonctif français s’intègre naturellement à la série d’instructions du passage.
- source_word: ἐν πᾶσιν
  choice: en tout
  rationale: Formulation concise et idiomatique qui conserve la portée générale de l’expression grecque.
- source_word: εὐαρέστους εἶναι
  choice: cherchent à leur être agréables
  rationale: εὐάρεστος signifie « agréable, qui plaît ». « Cherchent à » rend naturellement en français la conduite attendue sans transformer l’expression en garantie de résultat.
- source_word: μὴ ἀντιλέγοντας
  choice: ne les contredisent pas
  rationale: ἀντιλέγω évoque le fait de parler contre, de contredire ou de répliquer; « contredire » conserve le caractère verbal du comportement.
theological_decisions:
- issue: Traduction de δοῦλος dans le cadre domestique antique
  choice: esclaves
  alternative: serviteurs
  rationale: La présence de δεσπόταις et la relation décrite indiquent un statut servile réel. « Esclaves » rend cette situation historique sans cautionner l’institution.
- issue: Portée de ἐν πᾶσιν
  choice: en tout
  alternative: à tous égards
  rationale: Le grec formule une exigence générale sans préciser ici ses limites. La traduction en conserve la tension au lieu d’ajouter une restriction absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la structure exhortative liée au contexte précédent. « Esclaves » évite d’adoucir la réalité sociale du texte; « maîtres » demeure le terme français naturel dans ce contexte historique.
