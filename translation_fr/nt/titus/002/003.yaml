  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: fr
  text: De même, les femmes âgées doivent avoir une conduite digne de ce qui est saint, ne pas être médisantes[a] ni asservies à beaucoup de vin[b], et enseigner ce qui est bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « calomniatrices » ou « colporteuses de propos malveillants ». Le mot grec est apparenté au terme souvent traduit par « diable », mais il désigne ici des personnes qui disent du mal des autres.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « dépendantes de beaucoup de vin ». Le grec dit plus littéralement : « ayant été asservies à beaucoup de vin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: les femmes âgées
  rationale: Désigne spécifiquement les femmes avancées en âge, en parallèle avec les hommes âgés du verset précédent. Cette formulation est naturelle et précise en français moderne.
- source_word: ὡσαύτως
  choice: De même
  rationale: Préserve le lien logique avec l’exhortation précédente dans une formulation française courante.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: avoir une conduite digne de ce qui est saint
  rationale: κατάστημα évoque la conduite ou le maintien observable, tandis que ἱεροπρεπής désigne ce qui convient au domaine sacré. La formulation conserve cette nuance sans réduire le sens à la seule piété intérieure.
- source_word: μὴ διαβόλους
  choice: ne pas être médisantes
  rationale: Dans cette liste éthique, διάβολος qualifie des personnes qui calomnient ou tiennent des propos nuisibles, et non le diable. « Médisantes » est idiomatique et évite un terme juridique trop étroit.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: ni asservies à beaucoup de vin
  rationale: Le participe parfait passif de δουλόω conserve une image forte d’asservissement et de domination. « À beaucoup de vin » reflète aussi l’expression grecque sans la paraphraser simplement par « dépendantes ».
- source_word: καλοδιδασκάλους
  choice: enseigner ce qui est bon
  rationale: Cet adjectif composé rare décrit celles qui enseignent le bien. La tournure verbale s’intègre naturellement à la série d’exhortations et précise que « bon » qualifie le contenu enseigné.
theological_decisions:
- issue: Image d’asservissement employée à propos du vin
  choice: Conserver l’image avec « asservies à beaucoup de vin »
  alternative: « dépendantes de beaucoup de vin » ou « adonnées au vin »
  rationale: Le grec présente le vin comme une puissance qui tient la personne en esclavage. Garder cette métaphore préserve la force théologique et morale du texte sans la convertir en diagnostic moderne de dépendance.
translation_notes:
  register: Français international moderne, digne et accessible. « Femmes âgées » maintient le parallèle contextuel; « conduite digne de ce qui est saint » conserve la coloration sacrée de ἱεροπρεπεῖς; « asservies » préserve l’image grecque forte sans archaïsme excessif.
