  variant: modern international French
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: fr
  text: Mais toi, dis ce qui est conforme à la saine doctrine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : à un enseignement sain.'
    reason: alternative de traduction pour τῇ ὑγιαινούσῃ διδασκαλίᾳ; « enseignement » peut rendre διδασκαλία sans employer le terme plus technique « doctrine ».
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Mais toi
  rationale: Le pronom explicite Σὺ, associé à δὲ, marque un contraste avec les personnes évoquées auparavant. « Mais toi » rend cette mise en relief avec naturel et concision.
- source_word: λάλει
  choice: dis
  rationale: L’impératif de λαλέω demande à Tite de parler. « Dis » est naturel en français et ne restreint pas indûment le commandement à un enseignement formel.
- source_word: ἃ
  choice: ce qui
  rationale: Le relatif neutre pluriel désigne les choses que Tite doit dire. Le collectif français « ce qui » en restitue naturellement la portée.
- source_word: πρέπει
  choice: convient à
  rationale: πρέπω exprime ce qui est approprié ou conforme à quelque chose. « Convient à » conserve cette idée de convenance sans l’alourdir.
- source_word: ὑγιαινούσῃ
  choice: sain
  rationale: Le terme, littéralement lié à la bonne santé, qualifie ici métaphoriquement un enseignement juste et salutaire. « Sain » préserve cette métaphore en français courant.
- source_word: διδασκαλίᾳ
  choice: enseignement
  rationale: διδασκαλία peut désigner l’activité d’enseigner ou son contenu. « Enseignement » préserve cette amplitude et reste plus accessible que « doctrine ».
theological_decisions:
- issue: Rendu de τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: un enseignement sain
  alternative: la saine doctrine
  rationale: « Un enseignement sain » conserve la métaphore de la santé ainsi que la possible référence à l’acte d’enseigner et à son contenu, sans imposer le sens plus technique que peut avoir « doctrine ».
translation_notes:
  register: Français international moderne, simple et digne. La formulation brève conserve l’opposition emphatique de Σὺ δὲ et la métaphore médicale de ὑγιαινούσῃ.
