id: TIT.2.2
reference: Titus 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: fr
  text: Les hommes âgés doivent être sobres, dignes, maîtres d’eux-mêmes, solides dans la foi[a], dans l’amour et dans la persévérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la fidélité ». Le grec πίστις peut signifier « foi » ou « fidélité » selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: les hommes âgés
  rationale: Dans ces instructions adressées aux différents groupes d’âge, le terme désigne des hommes avancés en âge, non les responsables appelés anciens.
- source_word: νηφαλίους
  choice: sobres
  rationale: Le mot évoque d’abord la sobriété et, plus largement, la modération et la lucidité. « Sobres » conserve cette gamme de sens dans une formulation française naturelle.
- source_word: σεμνούς
  choice: dignes
  rationale: Le terme exprime une conduite noble et respectable. « Dignes » est concis et approprié à cette liste de qualités.
- source_word: σώφρονας
  choice: maîtres d’eux-mêmes
  rationale: Le mot désigne un jugement équilibré accompagné de maîtrise de soi. Cette tournure distingue clairement cette qualité de la sobriété déjà exprimée.
- source_word: ὑγιαίνοντας
  choice: solides
  rationale: Le participe signifie littéralement « être en bonne santé » et prend ici un sens figuré. « Solides dans » restitue naturellement en français l’idée de santé et de fermeté dans les vertus citées.
- source_word: τῇ πίστει
  choice: dans la foi
  rationale: Πίστις peut désigner la foi ou la fidélité. « La foi » convient à la triade avec l’amour et la persévérance, tandis que l’autre possibilité est signalée en note.
- source_word: τῇ ἀγάπῃ
  choice: dans l’amour
  rationale: Rend directement ἀγάπη et maintient le parallélisme des trois datifs régis par ὑγιαίνοντας.
- source_word: τῇ ὑπομονῇ
  choice: dans la persévérance
  rationale: Ὑπομονή évoque l’endurance patiente dans l’épreuve. « Persévérance » est naturel, courant et exprime cette constance durable.
- source_word: εἶναι
  choice: doivent être
  rationale: L’infinitif dépend de l’instruction du verset précédent. « Doivent être » en explicite la portée exhortative en français.
theological_decisions:
- issue: Sens de πίστις dans la liste de qualités
  choice: foi
  alternative: fidélité
  rationale: Dans la triade « foi, amour, persévérance », πίστις peut renvoyer soit à la confiance croyante, soit à la fidélité. Le texte principal retient « foi » sans effacer l’autre lecture, conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La série reste concise comme en grec. « Hommes âgés » évite toute confusion avec la fonction ecclésiale d’ancien; « maîtres d’eux-mêmes » est idiomatique et inclus ici au masculin conformément au référent explicite.
