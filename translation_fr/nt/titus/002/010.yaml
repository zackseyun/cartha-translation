source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: fr
  text: sans rien détourner à leur profit, mais en faisant preuve d’une entière fidélité[a], afin qu’en tout ils fassent honneur à l’enseignement de Dieu notre Sauveur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une totale loyauté » ou « d’une parfaite fiabilité ». Le grec emploie pistis, souvent traduit par « foi », mais qui désigne probablement ici la fidélité manifestée dans la conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: sans rien détourner à leur profit
  rationale: Le verbe désigne le fait de soustraire ou de s’approprier ce qui appartient à autrui. Dans le contexte du service domestique, « détourner à leur profit » est précis et naturel, sans restreindre indûment le sens au détournement de fonds.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: en faisant preuve d’une entière fidélité
  rationale: Dans ce contexte de conduite envers un maître, πίστις exprime principalement la fidélité, la loyauté ou la fiabilité. « Entière » rend la portée intensive de πᾶσαν, tandis que l’idée qualitative de ἀγαθήν est portée naturellement par l’expression française.
- source_word: κοσμῶσιν
  choice: fassent honneur à
  rationale: Le verbe signifie littéralement « orner » ou « embellir ». L’expression « faire honneur à » transmet naturellement en français l’idée que leur conduite rehausse la valeur et la réputation de l’enseignement.
- source_word: διδασκαλίαν
  choice: l’enseignement
  rationale: « Enseignement » est clair en français moderne et correspond au sens de διδασκαλία sans la coloration plus technique que peut avoir « doctrine ».
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: de Dieu notre Sauveur
  rationale: Cette formulation conserve directement le titre grec et n’ajoute aucune identification qui ne soit pas explicitée dans la proposition.
- source_word: ἐν πᾶσιν
  choice: en tout
  rationale: Expression française concise et naturelle qui conserve la portée générale du grec.
theological_decisions:
- issue: Sens de πίστις dans un contexte éthique
  choice: fidélité
  alternative: foi, bonne foi, loyauté ou fiabilité
  rationale: Le contexte immédiat concerne la conduite digne de confiance de serviteurs envers leurs maîtres. « Fidélité » rend donc mieux ici le sens éthique probable, tout en signalant en note la polysémie du terme grec.
- issue: Référent de « Dieu notre Sauveur »
  choice: conserver « Dieu notre Sauveur » sans explicitation supplémentaire
  alternative: interpréter ce titre à la lumière des passages des épîtres pastorales où « Sauveur » qualifie aussi le Christ
  rationale: La proposition nomme explicitement Dieu comme Sauveur. La traduction préserve cette formulation sans importer dans ce verset une identification christologique qui n’y est pas formulée.
- issue: Métaphore de κοσμέω
  choice: fassent honneur à
  alternative: ornent, embellissent ou rendent attrayant
  rationale: « Faire honneur à » communique en français actuel l’effet de la métaphore sans suggérer que l’enseignement aurait besoin d’être corrigé ou enjolivé.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste liée aux exhortations adressées aux esclaves dans le contexte précédent. « Détourner à leur profit » évite un terme rare comme « chaparder », et « faire honneur à » rend idiomatiquement la métaphore grecque de l’ornement.
