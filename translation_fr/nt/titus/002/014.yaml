  terminology: « Racheter », « purifier », « pour lui-même » et « bonnes œuvres » préservent les termes théologiques sans ajout doctrinal. La formulation retenue pour περιούσιον conserve adéquatement l'idée d'un peuple possédé de façon particulière. La note offre des possibilités lexicales et signale sobrement l'écho d'alliance.
