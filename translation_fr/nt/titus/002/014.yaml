id: TIT.2.14
reference: Titus 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: fr
  text: lui qui s’est donné lui-même pour nous, afin de nous racheter de toute transgression de la loi et de purifier pour lui-même un peuple lui appartenant en propre[a], plein d’ardeur pour les bonnes œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un peuple précieux à ses yeux » ou « un peuple particulier ». Le grec souligne qu’il s’agit d’un peuple qui lui appartient spécialement et fait écho au langage de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: s’est donné lui-même
  rationale: Cette formulation exprime le don volontaire de sa propre personne et conserve la valeur réfléchie du grec.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: « Pour nous » préserve la portée bénéfactive, et potentiellement substitutive, de ὑπέρ sans imposer une théorie particulière de l’expiation.
- source_word: ἵνα λυτρώσηται
  choice: afin de nous racheter
  rationale: « Racheter » garde l’idée de délivrance associée au paiement d’un prix ainsi que la résonance rédemptrice du verbe.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: de toute révolte contre la loi
  rationale: ἀνομία désigne le mépris ou la transgression de la loi, plutôt que la méchanceté au sens large. Cette expression est plus immédiatement compréhensible en français moderne que le substantif rare « illégalité » dans ce contexte moral.
- source_word: καθαρίσῃ
  choice: purifier
  rationale: Le verbe convient à la dimension à la fois morale et cultuelle de la formation d’un peuple saint.
- source_word: ἑαυτῷ
  choice: pour lui-même
  rationale: Le datif indique que le peuple est purifié pour lui et lui appartient.
- source_word: λαὸν περιούσιον
  choice: un peuple qui lui appartienne en propre
  rationale: Cette formulation naturelle conserve l’idée forte d’appartenance particulière et l’écho de l’alliance présent dans περιούσιος.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: plein d’ardeur pour les œuvres bonnes
  rationale: La tournure exprime l’engagement empressé de ζηλωτής tout en conservant le vocabulaire biblique des œuvres, dans un ordre naturel en français.
theological_decisions:
- issue: Portée de ὑπὲρ ἡμῶν dans le don de soi du Christ
  choice: pour nous
  alternative: en notre faveur ; à notre place
  rationale: La traduction laisse ouvertes les nuances de bénéfice et de substitution possibles dans le contexte, sans réduire le verset à un modèle précis de l’expiation.
- issue: Nuance d’alliance de λαὸν περιούσιον
  choice: un peuple qui lui appartienne en propre
  alternative: un peuple précieux ; un peuple particulier
  rationale: Le choix maintient l’affirmation d’une appartenance spéciale, en écho au langage vétérotestamentaire de l’alliance, sans ajouter explicitement la notion de valeur affective.
- issue: Référent de ἑαυτῷ
  choice: pour lui-même, en référence au Christ
  alternative: pour Dieu
  rationale: Le pronom réfléchi renvoie grammaticalement au sujet du verset, celui qui s’est donné, sans qu’il soit nécessaire de remplacer ce pronom par une désignation théologique explicative.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le mouvement de la phrase grecque. « Œuvres bonnes » conserve l’association lexicale avec ἔργα tout en restant idiomatique ; « plein d’ardeur » évite que « zélé » soit entendu négativement dans l’usage courant.
