  source_fidelity: 'Le mouvement syntaxique et les principaux termes sont bien rendus : don de soi « pour nous », finalité introduite par « afin de », rachat, purification, appartenance particulière et empressement pour les bonnes œuvres. Toutefois, « révolte contre la loi » interprète ἀνομία de manière trop étroite en y introduisant explicitement l''idée de rébellion. « Transgression de la loi » rend plus directement le champ sémantique de l''absence de loi / de sa violation sans surdéterminer l''attitude intérieure.'
