  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: fr
  text: une parole saine, irréprochable[a], afin que l’adversaire[b] ait honte[c], n’ayant rien de mal à dire à notre sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un discours sain »; ou « une parole saine, qui ne puisse être condamnée ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « celui qui est du côté opposé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « soit couvert de honte » ou « soit confondu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: une parole
  rationale: Dans ce contexte, λόγος désigne la parole ou le discours de Tite dans son enseignement, plutôt qu’un mot isolé. « Parole » reste naturel en français et préserve l’étendue possible du terme.
- source_word: ὑγιῆ
  choice: saine
  rationale: Le mot conserve la métaphore de la santé, fréquente dans les épîtres pastorales pour ce qui est juste et solide sur les plans doctrinal et moral.
- source_word: ἀκατάγνωστον
  choice: irréprochable
  rationale: L’adjectif qualifie une parole qui ne donne aucun motif valable de condamnation ou de blâme. « Irréprochable » est concis, idiomatique et convient au registre moral et public du passage.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution exprime clairement le but visé, sans exclure une nuance de résultat.
- source_word: ὁ ἐξ ἐναντίας
  choice: l’adversaire
  rationale: L’expression signifie littéralement « celui qui est du côté opposé ». « L’adversaire » en rend naturellement le sens sans préciser indûment son identité.
- source_word: ἐντραπῇ
  choice: soit couvert de honte
  rationale: Cette formulation exprime la honte provoquée lorsque l’opposant ne trouve aucun grief fondé. La note signale la traduction plus intérieure « éprouve de la honte ».
- source_word: μηδὲν ἔχων λέγειν
  choice: n’ayant rien … à dire
  rationale: Le participe grec est rendu par une construction française naturelle qui conserve l’idée d’absence totale de grief à formuler.
- source_word: περὶ ἡμῶν
  choice: à notre sujet
  rationale: Le pronom de première personne du pluriel est conservé sans en restreindre ni en élargir explicitement le référent.
- source_word: φαῦλον
  choice: de mal
  rationale: Dans ce contexte, φαῦλον désigne quelque chose de mauvais ou moralement répréhensible que l’adversaire pourrait alléguer. « Rien de mal » est naturel tout en gardant la portée morale.
theological_decisions:
- issue: Référent de la première personne du pluriel dans περὶ ἡμῶν
  choice: à notre sujet
  alternative: à ton sujet ; au sujet des chrétiens ; au sujet de notre enseignement
  rationale: Le grec emploie simplement « nous ». Garder ce pronom évite de limiter le référent à Tite ou de l’étendre explicitement à toute la communauté chrétienne.
- issue: Nature de la honte exprimée par ἐντραπῇ
  choice: soit couvert de honte
  alternative: éprouve de la honte ; ait honte
  rationale: La forme peut mettre l’accent sur la honte subie devant l’absence de reproche fondé ou sur le sentiment de honte de l’adversaire. Le texte principal retient la première nuance et la note préserve l’autre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure exhortative liée au verset précédent, la métaphore de la parole « saine » et le pronom « nous » du texte grec.
