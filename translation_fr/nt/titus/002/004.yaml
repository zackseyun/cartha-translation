translation:
  language: fr
  text: afin qu’elles apprennent aux jeunes femmes à aimer leur mari et leurs enfants[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à être attachées à leur mari et à leurs enfants ». Les deux adjectifs grecs décrivent l’affection envers le mari et les enfants.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux plus jeunes », c’est-à-dire aux femmes plus jeunes, par contraste avec les femmes âgées mentionnées dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but de l’enseignement donné aux femmes âgées et conserve naturellement la valeur finale de la conjonction.
- source_word: σωφρονίζωσι
  choice: elles apprennent à
  rationale: Le verbe peut évoquer le fait d’amener à la sagesse, de conseiller ou de former à une conduite réfléchie. Dans ce contexte, « apprendre à » exprime de façon naturelle l’accompagnement formateur, sans le réduire à une transmission purement intellectuelle.
- source_word: τὰς νέας
  choice: aux jeunes femmes
  rationale: L’adjectif féminin substantivé désigne les femmes plus jeunes, par contraste avec les femmes âgées du verset précédent. En français, « les jeunes femmes » est plus idiomatique que « les femmes plus jeunes » dans cette construction.
- source_word: φιλάνδρους
  choice: à aimer leur mari
  rationale: L’adjectif décrit l’affection portée à son mari. La tournure verbale est naturelle en français et s’intègre au complément de « apprennent ».
- source_word: εἶναι
  choice: à
  rationale: L’infinitif grec relie les qualités attendues au verbe principal. En français, sa valeur est naturellement intégrée à la construction « apprendre à aimer » plutôt que rendue séparément par « être ».
- source_word: φιλοτέκνους
  choice: et leurs enfants
  rationale: L’adjectif décrit l’affection portée à ses enfants. La coordination avec « aimer » préserve le parallélisme sémantique des deux adjectifs grecs sans lourdeur.
theological_decisions:
- issue: Portée de l’instruction adressée aux jeunes femmes dans le cadre domestique
  choice: Traduire « jeunes femmes » sans restreindre explicitement le groupe aux seules épouses, tout en conservant les références concrètes au mari et aux enfants.
  alternative: Traduire « jeunes épouses » ou reformuler le verset comme une définition générale et intemporelle du rôle féminin.
  rationale: Le grec désigne littéralement les femmes plus jeunes, tandis que les adjectifs suivants supposent la situation de femmes mariées ayant des enfants. La traduction garde cette tension contextuelle sans élargir ni restreindre indûment le référent.
translation_notes:
  register: Français international moderne, simple et digne. « Leur mari » au singulier distributif et « leurs enfants » rendent naturellement les relations propres à chacune. La formulation verbale évite le tour lourd « être aimantes envers » tout en conservant le parallélisme des deux qualités grecques.
