id: TIT.2.6
reference: Titus 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: fr
  text: De même, exhorte les jeunes hommes à faire preuve de maîtrise de soi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à être sensés » ou « à être raisonnables ». Le grec évoque à la fois un jugement sain et une conduite maîtrisée.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: les jeunes hommes
  rationale: Le masculin pluriel désigne ici les hommes plus jeunes, dans une série d’exhortations adressées à des groupes distingués selon l’âge et le sexe. « Les jeunes hommes » est naturel en français et préserve cette référence précise.
- source_word: ὡσαύτως
  choice: De même
  rationale: Cette expression relie l’exhortation à celles qui précèdent et restitue naturellement la continuité rhétorique.
- source_word: παρακάλει
  choice: exhorte
  rationale: L’impératif présent demande à Tite une exhortation suivie. « Exhorte » conserve la force de l’ordre sans réduire le sens à un simple encouragement.
- source_word: σωφρονεῖν
  choice: à faire preuve de maîtrise de soi
  rationale: Le verbe associe jugement sain, modération et discipline personnelle. Cette formulation française exprime clairement la conduite maîtrisée visée dans le contexte.
theological_decisions:
- issue: Référence de genre dans νεωτέρους
  choice: référence précise aux jeunes hommes
  alternative: référence générique aux jeunes gens
  rationale: Le contexte immédiat distingue plusieurs groupes selon l’âge et le sexe. La traduction conserve donc le masculin spécifique du texte grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Exhorte » maintient la force pastorale de παρακάλει; « faire preuve de maîtrise de soi » rend le champ sémantique de σωφρονεῖν sans formulation archaïque.
