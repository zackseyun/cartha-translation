id: TIT.2.5
reference: Titus 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: fr
  text: sensées, pures, occupées aux travaux de la maison[a], bonnes, soumises à leur propre mari[b], afin que la parole de Dieu ne soit pas calomniée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’occupant de leur maison » ou « travaillant à la maison ». Le terme grec est rare et désigne l’activité consacrée aux travaux du foyer.
    reason: lexical_alternative
  - marker: b
    text: Ou « se soumettant à leur propre mari ».
    reason: lexical_alternative
  - marker: c
    text: Ou « décriée », ou, plus littéralement, « blasphémée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: sensées
  rationale: Le terme évoque un jugement sain qui se manifeste par une conduite maîtrisée et prudente. « Sensées » convient naturellement à cette liste de qualités, sans réduire le sens à la seule tempérance.
- source_word: ἁγνάς
  choice: pures
  rationale: Le mot désigne la pureté, notamment morale. « Pures » en conserve la portée générale et actuelle, tandis que « chastes » serait plus étroit.
- source_word: οἰκουργούς
  choice: occupées aux travaux de la maison
  rationale: Cet adjectif rare associe la maison au travail et décrit l'engagement dans les tâches domestiques. Cette formulation garde l'idée d'un travail effectif sans suggérer un confinement au domicile.
- source_word: ἀγαθάς
  choice: bonnes
  rationale: « Bonnes » rend directement l'adjectif large ἀγαθάς et laisse au contexte le soin d'en préciser la dimension morale et relationnelle; « bienveillantes » serait possible mais plus interprétatif.
- source_word: ὑποτασσομένας
  choice: soumises à
  rationale: Le participe exprime une relation d'ordre ou de subordination. « Soumises à » reste proche du grec et s'intègre à la série adjectivale sans développer un système doctrinal plus large.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: à leur propre mari
  rationale: Dans ce contexte conjugal, ἀνήρ signifie « mari ». Le singulier distributif français est naturel, et « propre » conserve la limitation explicite aux maris respectifs.
- source_word: ἵνα μὴ
  choice: afin que ... ne ... pas
  rationale: Cette tournure française conserve clairement la valeur finale de la proposition grecque.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Expression française consacrée et directe pour le message venant de Dieu, dont la réputation publique est ici en jeu.
- source_word: βλασφημῆται
  choice: ne soit pas calomniée
  rationale: Le verbe désigne ici une parole injurieuse ou diffamatoire dirigée contre la parole de Dieu. « Calomniée » communique ce sens en français moderne, tandis que « blasphémée » est plus littéral mais peut paraître plus spécialisé.
theological_decisions:
- issue: Rendre οἰκουργούς sans transformer le travail domestique en obligation explicite de confinement
  choice: occupées aux travaux de la maison
  alternative: s'occupant de leur maison ; travaillant à la maison ; gardiennes du foyer
  rationale: Le composé rare met l'accent sur l'activité liée à la maison. La formulation choisie affirme la responsabilité domestique présente dans le texte sans lui ajouter une interdiction de travailler ailleurs.
- issue: Rendre ὑποτασσομένας sans ajouter un système confessionnel sur les rapports conjugaux
  choice: soumises à leur propre mari
  alternative: se soumettant à leur propre mari
  rationale: Le français préserve l'affirmation d'une relation ordonnée dans le mariage, tandis que « leur propre mari » en limite explicitement la portée à la relation conjugale de chacune.
- issue: Préserver la finalité apologétique de la conduite demandée
  choice: afin que la parole de Dieu ne soit pas calomniée
  alternative: pour que la parole de Dieu ne soit pas blasphémée ; ne soit pas décriée
  rationale: La proposition finale relie la conduite décrite à la réputation publique du message de Dieu. « Calomniée » exprime l'attaque verbale sans restreindre artificiellement le verbe au blasphème directement adressé à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La série demeure concise, comme dans le grec. « Travaux de la maison » évite l'ambiguïté moderne de « travailler à la maison », qui peut évoquer le télétravail; « propre mari » conserve l'élément restrictif du grec.
