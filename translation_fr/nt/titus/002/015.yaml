id: TIT.2.15
reference: Titus 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: fr
  text: Parle de ces choses, exhorte et reprends avec pleine autorité. Que personne ne te méprise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que personne ne te dédaigne » ou « Que personne ne te regarde de haut ».
    reason: Alternative lexicale pour περιφρονείτω, qui peut exprimer le mépris, le dédain ou le fait de regarder quelqu’un de haut.
lexical_decisions:
- source_word: Ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie largement aux instructions précédentes sans les réduire à un seul type d’enseignement.
- source_word: λάλει
  choice: dis
  rationale: L’impératif présent appelle une communication suivie. « Dis » rend directement l’action de parler sans la préciser excessivement comme « enseigne ».
- source_word: παρακάλει
  choice: encourage
  rationale: Dans ce contexte pastoral, παρακαλέω peut exprimer l’encouragement aussi bien que l’exhortation pressante. « Encourage » est naturel en français actuel et conserve une distinction claire avec la réprimande qui suit.
- source_word: ἔλεγχε
  choice: reprends
  rationale: Le verbe désigne ici l’action de mettre en évidence ce qui ne va pas afin de le corriger. « Reprends » convient au cadre pastoral et garde la force corrective de l’impératif.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: avec une pleine autorité
  rationale: ἐπιταγή peut désigner un ordre ou l’autorité qui habilite à en donner. Ici, la tournure qualifie l’ensemble des actions et πάσης en souligne la plénitude.
- source_word: μηδείς
  choice: personne
  rationale: Dans la défense à la troisième personne, « Que personne… » est l’équivalent français naturel.
- source_word: σου
  choice: te
  rationale: Le pronom au génitif dépend de περιφρονείτω et désigne Titus comme personne visée; le français l’exprime naturellement par le pronom objet « te ».
- source_word: περιφρονείτω
  choice: méprise
  rationale: περιφρονέω signifie considérer quelqu’un comme négligeable, le mépriser ou le regarder de haut. « Mépriser » conserve nettement la force du terme grec; la note présente des nuances françaises également possibles.
theological_decisions:
- issue: Portée de l’autorité dans « μετὰ πάσης ἐπιταγῆς »
  choice: Titus doit parler, encourager et reprendre avec une pleine autorité.
  alternative: La formule pourrait mettre l’accent soit sur une manière impérative de parler, soit principalement sur l’autorité du message.
  rationale: La locution modifie naturellement les impératifs coordonnés et exprime le poids avec lequel Titus doit accomplir ces tâches. La traduction n’ajoute pas que cette autorité serait autonome; le contexte la rattache aux instructions qu’il transmet.
- issue: Force de « περιφρονείτω »
  choice: Que personne ne te méprise.
  alternative: Que personne ne te traite comme quantité négligeable ou ne te regarde de haut.
  rationale: « Méprise » préserve la force personnelle et sociale du verbe sans décider si le rejet porte principalement sur Titus lui-même, son âge éventuel ou son ministère.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs sont brefs et directs. « Une pleine autorité » évite le tour moins idiomatique « toute autorité » tout en conservant l’intensité de πάσης. Le marqueur [a] figure dans le texte principal.
