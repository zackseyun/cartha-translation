  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: fr
  text: Car la grâce de Dieu est apparue, porteuse de salut pour tous les êtres humains[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est apparue, apportant le salut à tous les êtres humains », « est apparue, sauvant tous les êtres humains » ou « est apparue à tous les êtres humains ». L’adjectif grec traduit par « porteuse de salut » et le groupe au datif « tous les êtres humains » peuvent être rattachés de plusieurs manières.'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque désigne ici l’ensemble des humains, et non les hommes de sexe masculin seulement.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: est apparue
  rationale: 'L’aoriste d’ἐπιφαίνω a ici un sens intransitif : « apparaître, se manifester ». « Est apparue » est naturel et conserve l’idée d’une manifestation devenue visible.'
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit la raison qui fonde les exhortations précédentes ; « car » marque clairement ce lien explicatif.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: Cette formulation traditionnelle et intelligible rend directement le génitif et conserve à la fois l’idée de faveur divine et son efficacité bienfaisante.
- source_word: σωτήριος
  choice: porteuse de salut
  rationale: L’adjectif qualifie naturellement « la grâce » et signifie « qui sauve, qui apporte le salut ». « Porteuse de salut » reste adjectival, idiomatique et évite le terme technique « salvatrice ».
- source_word: πᾶσιν ἀνθρώποις
  choice: pour tous les êtres humains
  rationale: ἄνθρωποι désigne ici les humains sans distinction de sexe. Avec σωτήριος, le datif peut indiquer les bénéficiaires ou la destination ; « pour » s’accorde naturellement avec « porteuse de salut » sans trancher davantage.
theological_decisions:
- issue: Portée de πᾶσιν ἀνθρώποις par rapport au salut
  choice: pour tous les êtres humains
  alternative: à tous les êtres humains ; qui sauve tous les êtres humains
  rationale: La traduction maintient la portée universelle de la formule grecque sans préciser si elle vise chaque individu sans exception ou toutes les catégories humaines, et sans transformer l’affirmation en conclusion doctrinale sur l’issue finale du salut.
- issue: Rapport syntaxique entre σωτήριος et πᾶσιν ἀνθρώποις
  choice: « porteuse de salut pour tous les êtres humains », où σωτήριος qualifie la grâce et le datif désigne ceux auxquels ce salut se rapporte
  alternative: « est apparue à tous les êtres humains » ou « est apparue, sauvant tous les êtres humains »
  rationale: La construction grecque permet plusieurs nuances. Le texte principal retient l’analyse la plus naturelle tout en signalant les autres dans une note, afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Porteuse de salut » préserve la structure adjectivale du grec tout en restant naturelle. « Tous les êtres humains » explicite la valeur générique de ἀνθρώποις ; les notes conservent l’ambiguïté syntaxique et théologique.
