source:
  edition: SBLGNT
  text: περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ⸀ἀφθορίαν, ⸀σεμνότητα,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: fr
  text: En toute chose[a], montre-toi comme un modèle[b] de bonnes œuvres ; dans ton enseignement[c], fais preuve d’incorruptibilité[d] et de dignité[e],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tous égards ». La tournure grecque peut aussi se rendre plus formellement par « en toutes choses » ou « au sujet de tout » ; elle exprime probablement ici l’étendue de la conduite de Tite.
    reason: lexical_alternative
  - marker: b
    text: Ou « un exemple » ou « un modèle à suivre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans l’enseignement » ou « dans la doctrine ».
    reason: lexical_alternative
  - marker: d
    text: Littéralement « absence de corruption » ; ou « pureté » ou « intégrité ». Le terme peut se rapporter à l’enseignant, au caractère non altéré de son enseignement, ou aux deux.
    reason: lexical_alternative
  - marker: e
    text: Ou « sérieux » ou « gravité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: à tous égards
  rationale: La locution a ici une valeur adverbiale et exprime l’étendue complète de la conduite de Tite. « À tous égards » est naturel en français et évite de la comprendre comme un thème de discours.
- source_word: σεαυτὸν παρεχόμενος
  choice: en te montrant toi-même
  rationale: Cette formulation conserve la valeur réfléchie et l’idée que Tite doit se donner à voir comme exemple. Le participe maintient aussi le lien syntaxique avec l’exhortation du contexte.
- source_word: τύπον
  choice: un modèle
  rationale: Dans ce contexte moral, le mot désigne un exemple proposé à l’imitation. « Modèle » rend clairement cette fonction en français courant.
- source_word: καλῶν ἔργων
  choice: de bonnes œuvres
  rationale: Traduction directe qui conserve le vocabulaire éthique de la lettre, sans ajouter de précision doctrinale étrangère au texte.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: dans ton enseignement
  rationale: Le contexte vise l’activité d’enseignement de Tite. Le possessif, implicite en grec dans la situation d’énonciation, produit un français clair sans réduire le terme à la doctrine abstraite.
- source_word: ἀφθορίαν
  choice: intégrité
  rationale: Le terme exprime l’absence de corruption. Dans le cadre de l’enseignement, « intégrité » transmet naturellement l’idée d’un enseignement non altéré et d’une conduite irréprochable, tout en laissant ouverte la relation précise entre contenu et enseignant.
- source_word: σεμνότητα
  choice: dignité
  rationale: Le mot désigne une gravité respectable. « Dignité » exprime en français moderne une attitude sérieuse qui inspire le respect, sans suggérer la morosité.
theological_decisions:
- issue: Portée de ἀφθορίαν dans l’enseignement
  choice: « intégrité », sans préciser si elle qualifie surtout le contenu enseigné ou la manière d’enseigner
  alternative: « absence de corruption », « pureté » ou « incorruptibilité »
  rationale: Le grec permet une portée éthique et pédagogique assez large. La traduction ne tranche donc pas entre l’intégrité personnelle de l’enseignant et le caractère non corrompu de son enseignement.
- issue: Sens de διδασκαλία
  choice: « enseignement »
  alternative: « doctrine »
  rationale: « Enseignement » peut désigner à la fois l’activité et son contenu, comme le grec dans ce contexte, tandis que « doctrine » risquerait de limiter le sens à un système dogmatique.
translation_notes:
  register: Français international moderne, digne et accessible. La construction participiale est conservée parce que le verset prolonge l’exhortation précédente. « Fais preuve de » est ajouté pour rendre idiomatiquement en français la série accusative grecque sans transformer les qualités en simple description abstraite de l’enseignement.
