source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: fr
  text: tandis que nous attendons l’espérance bienheureuse et la manifestation de la gloire de notre grand Dieu et Sauveur[a], Jésus le Messie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « la gloire du grand Dieu et de notre Sauveur, Jésus le Messie », si « Dieu » et « Sauveur » désignent deux personnes distinctes plutôt qu’un seul et même titre de Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: tandis que nous attendons
  rationale: Le participe présent prolonge la phrase précédente et exprime une attente durable, avec une nuance d’espérance confiante. Cette tournure est naturelle en français et conserve le lien syntaxique.
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: l’espérance bienheureuse
  rationale: « Espérance » exprime ici l’attente assurée d’une réalité future, non un simple souhait. « Bienheureuse » garde la portée eschatologique et solennelle de μακαρίαν sans la banaliser.
- source_word: ἐπιφάνειαν
  choice: manifestation
  rationale: Le terme désigne l’apparition visible et éclatante attendue. « Manifestation » est clair, digne et moins chargé comme terme technique que « épiphanie ».
- source_word: δόξης
  choice: gloire
  rationale: Traduction directe qui conserve le génitif grec dans « la manifestation de la gloire » et évite de confondre explicitement la gloire avec la manifestation elle-même.
- source_word: τοῦ μεγάλου θεοῦ
  choice: de notre grand Dieu
  rationale: « Grand » rend directement μεγάλου. Le possessif français est placé devant l’ensemble coordonné « Dieu et Sauveur », conformément au référent unique retenu.
- source_word: σωτῆρος ἡμῶν
  choice: et Sauveur
  rationale: « Sauveur » est l’équivalent français usuel et contextuellement approprié. L’unique possessif « notre » porte naturellement sur les deux noms coordonnés.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός fonctionne ici comme titre. « Le Messie » en communique le sens en français courant plutôt que de conserver la translittération traditionnelle « Christ ».
theological_decisions:
- issue: La construction « τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν … Ἰησοῦ Χριστοῦ » désigne-t-elle une seule personne ou deux ?
  choice: 'Une seule personne : Jésus le Messie est identifié comme « notre grand Dieu et Sauveur ».'
  alternative: 'Deux personnes : « le grand Dieu » et « notre Sauveur, Jésus le Messie ».'
  rationale: En grec, un seul article régit deux noms personnels singuliers coordonnés, puis « Jésus le Messie » les précise. La lecture à référent unique est donc la plus naturelle et convient à la manifestation attendue dans le contexte. L’autre analyse grammaticalement défendue est toutefois conservée en note afin de ne pas masquer l’ambiguïté interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « Espérance bienheureuse » conserve la solennité théologique sans devenir opaque ; « manifestation » évite le jargon d’« épiphanie ». La ponctuation met « Jésus le Messie » en apposition au titre unifié, tandis que la note préserve l’autre analyse possible.
