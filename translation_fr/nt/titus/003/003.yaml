id: TIT.3.3
reference: Titus 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: fr
  text: Car nous aussi, autrefois, nous étions insensés, désobéissants, égarés[a], esclaves de toutes sortes de désirs et de plaisirs. Nous passions notre vie dans la méchanceté et l’envie, détestables[b], nous détestant les uns les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trompés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « détestés ». L’adjectif grec peut signifier soit « détestables, odieux », soit « détestés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Car nous aussi, autrefois, nous étions
  rationale: « Car » maintient le lien explicatif avec ce qui précède; « nous aussi » rend l’inclusion soulignée par καὶ ἡμεῖς, et « autrefois » exprime ποτε dans un ordre naturel en français.
- source_word: ἀνόητοι
  choice: insensés
  rationale: « Insensés » exprime le manque de discernement intellectuel et moral sans réduire le terme à une simple ignorance.
- source_word: ἀπειθεῖς
  choice: désobéissants
  rationale: Le terme grec peut évoquer le refus de se laisser persuader et, par conséquent, la désobéissance; « désobéissants » convient naturellement à cette liste de vices.
- source_word: πλανώμενοι
  choice: égarés
  rationale: « Égarés » préserve la nuance passive ou moyenne du participe et reste plus large que la seule tromperie intellectuelle.
- source_word: δουλεύοντες
  choice: esclaves de
  rationale: Cette formulation conserve la forte image d’asservissement exprimée par δουλεύω, particulièrement saillante lorsque les maîtres sont les désirs et les plaisirs.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: de toutes sortes de désirs et de plaisirs
  rationale: « Désirs » garde la portée large de ἐπιθυμίαις, qui ne se limite pas au domaine sexuel. « De toutes sortes » rend naturellement ποικίλαις et porte, dans le contexte, sur les deux noms.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: Nous passions notre vie dans la méchanceté et l’envie
  rationale: « Passions notre vie » restitue la durée impliquée par διάγοντες. « Méchanceté » convient au contexte relationnel de κακία sans élargir indûment le sens à tout mal moral.
- source_word: στυγητοί
  choice: détestables
  rationale: « Détestables » rend naturellement le sens actif d’« odieux, qui suscite la haine » et s’enchaîne bien avec « nous détestant ». Le sens passif « détestés » demeure possible et est signalé en note.
- source_word: μισοῦντες ἀλλήλους
  choice: nous détestant les uns les autres
  rationale: Cette formulation rend directement le participe et le pronom réciproque, tout en évitant une répétition française moins naturelle de « haine ».
theological_decisions:
- issue: Force de l’image de servitude dans δουλεύοντες appliquée aux désirs et aux plaisirs
  choice: esclaves de toutes sortes de désirs et de plaisirs
  alternative: au service de toutes sortes de désirs et de plaisirs
  rationale: Le grec décrit une condition d’asservissement, et non un simple service volontaire. « Esclaves de » conserve cette force sans ajouter de système doctrinal au texte.
- issue: Valeur active ou passive de στυγητοί
  choice: détestables
  alternative: détestés
  rationale: Dans cette liste décrivant l’ancienne conduite, la valeur active (« odieux, détestables ») s’intègre bien et prépare « nous détestant les uns les autres ». Comme l’adjectif peut aussi être compris passivement, l’autre lecture est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque est répartie en deux phrases pour alléger la longue énumération sans en modifier la progression. Le vocabulaire conserve la vigueur morale du texte et l’ambiguïté réelle de στυγητοί.
