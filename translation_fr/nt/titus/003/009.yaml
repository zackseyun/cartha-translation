id: TIT.3.9
reference: Titus 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: fr
  text: Mais évite les discussions insensées[a], les généalogies, les querelles et les disputes au sujet de la loi[b], car elles sont inutiles et vaines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « controverses » ou « spéculations » insensées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « disputes relatives à la loi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: discussions insensées
  rationale: L’expression désigne des recherches ou débats marqués par la sottise plutôt que des questions neutres. « Discussions insensées » est naturel en français et conserve la portée morale et pratique du grec.
- source_word: γενεαλογίας
  choice: généalogies
  rationale: Rendu direct qui préserve la généralité du terme sans imposer une reconstruction historique particulière.
- source_word: ἔρεις
  choice: querelles
  rationale: Le terme évoque la discorde et les conflits. « Querelles » le distingue suffisamment des disputes plus précisément qualifiées qui suivent.
- source_word: μάχας νομικὰς
  choice: disputes au sujet de la Loi
  rationale: Le substantif désigne ici des affrontements verbaux, et l’adjectif précise leur rapport à la loi. La majuscule à « Loi » signale le sens probable de loi religieuse, sans préciser davantage le cadre historique.
- source_word: περιΐστασο
  choice: évite
  rationale: L’impératif moyen demande de se tenir à l’écart de ces choses. « Évite » est concis, courant et impératif.
- source_word: ἀνωφελεῖς
  choice: inutiles
  rationale: Le mot signifie dépourvues de bénéfice ou d’utilité. « Inutiles » est clair et idiomatique.
- source_word: μάταιοι
  choice: vaines
  rationale: Le terme exprime le caractère vide, stérile ou sans résultat. « Vaines » conserve cette nuance et forme une paire naturelle avec « inutiles ».
theological_decisions:
- issue: Nature des « généalogies » et des « disputes au sujet de la Loi »
  choice: Conserver des termes généraux sans identifier un système juif, gnostique ou hérétique précis.
  alternative: Interpréter les généalogies comme des débats sur l’ascendance juive, ou comme des spéculations mythiques proto-gnostiques.
  rationale: Le verset nomme ces pratiques sans les définir assez précisément pour permettre une identification historique certaine. La formulation générale préserve l’ambiguïté du texte.
- issue: Sens de νομικὰς
  choice: Comprendre l’adjectif comme « au sujet de la Loi » et non comme une référence à des procès civils.
  alternative: Traduire par « disputes juridiques » ou « querelles légales ».
  rationale: Dans ce contexte pastoral et religieux, le rapport à la loi religieuse est plus probable; la traduction évite néanmoins de préciser s’il s’agit exclusivement de la loi mosaïque ou de questions normatives plus larges.
translation_notes:
  register: Français international moderne, sobre et digne. La coordination accumulative du grec est conservée de façon lisible. « Loi » reste assez général pour ne pas imposer une reconstruction historique, tandis que les notes signalent les principales possibilités lexicales.
