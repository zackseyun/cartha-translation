id: TIT.3.1
reference: Titus 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: fr
  text: Rappelle-leur de se soumettre aux dirigeants et aux autorités[a], d’obéir et d’être prêts à toute œuvre bonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de se soumettre aux dirigeants et aux autorités et de leur obéir ».'
    reason: La ponctuation et le rattachement de « obéir » peuvent conduire à l’associer explicitement aux dirigeants et aux autorités.
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Rappelle
  rationale: L’impératif présent adressé à Tite peut suggérer une action suivie ou répétée. « Rappelle-leur » est naturel en français et laisse cette valeur aspectuelle implicite.
- source_word: αὐτοὺς
  choice: leur
  rationale: Le pronom renvoie aux croyants crétois auxquels Tite doit transmettre ce rappel.
- source_word: ἀρχαῖς
  choice: dirigeants
  rationale: Dans ce contexte civique, le terme désigne ceux qui exercent le pouvoir. « Dirigeants » en exprime la dimension personnelle sans évoquer ici des puissances spirituelles.
- source_word: ἐξουσίαις
  choice: autorités
  rationale: Associé à ἀρχαῖς, le mot désigne les autorités ou pouvoirs constitués. La traduction conserve les deux termes grecs distincts.
- source_word: ὑποτάσσεσθαι
  choice: se soumettre à
  rationale: L’infinitif exprime le fait de reconnaître un ordre d’autorité. « Se soumettre à » est actuel et direct, sans ajouter l’idée d’une obéissance absolue.
- source_word: πειθαρχεῖν
  choice: obéir
  rationale: Le verbe signifie obéir à ceux qui exercent l’autorité. L’infinitif « obéir » est concis et s’intègre naturellement à la série d’exhortations.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: à toute œuvre bonne
  rationale: πρός marque ici l’orientation ou la disponibilité en vue de toute action bonne. « Toute œuvre bonne » garde le vocabulaire éthique du grec dans un registre biblique compréhensible.
- source_word: ἑτοίμους εἶναι
  choice: être prêts
  rationale: La tournure indique un état de disponibilité. « Être prêts » est simple, idiomatique et fidèle.
theological_decisions:
- issue: Portée de la soumission aux structures civiles
  choice: Formuler une exhortation générale à la soumission aux dirigeants et aux autorités, puis à l’obéissance, sans préciser qu’elle serait inconditionnelle.
  alternative: Comprendre la formulation comme imposant une obéissance absolue aux autorités civiles en toute circonstance.
  rationale: Le texte exhorte clairement à la soumission civique, mais ne traite pas ici des éventuelles limites de cette obéissance. La traduction conserve cette tension sans ajouter de qualification ni absolutiser l’ordre.
- issue: Rattachement syntaxique de πειθαρχεῖν
  choice: Comprendre « obéir » comme une exhortation coordonnée après « se soumettre aux dirigeants et aux autorités ».
  alternative: 'Rattacher explicitement « obéir » aux dirigeants et aux autorités : « se soumettre aux dirigeants et aux autorités et leur obéir ».'
  rationale: Le grec permet de lire πειθαρχεῖν comme un infinitif coordonné dont l’objet reste implicite. Le texte principal garde cette structure, tandis que la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, clair et digne. « Dirigeants et autorités » préserve le binôme grec; « œuvre bonne » maintient une légère coloration biblique tout en restant compréhensible. L’élision « d’obéir et d’être » assure une lecture fluide.
