id: TIT.3.7
reference: Titus 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: fr
  text: afin que, justifiés par sa grâce[a], nous devenions héritiers selon l’espérance de la vie éternelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Justifiés » peut aussi se traduire par « déclarés justes ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans l’espérance de la vie éternelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat de l’action salvatrice décrite dans le contexte précédent, tout en restant naturel en français.
- source_word: δικαιωθέντες
  choice: justifiés
  rationale: Rend le participe aoriste passif de δικαιόω, conserve le vocabulaire théologique du texte et présente cette action comme antérieure, sur le plan logique, au fait de devenir héritiers.
- source_word: τῇ ἐκείνου χάριτι
  choice: par sa grâce
  rationale: Le datif a une valeur instrumentale. « Sa » rend naturellement ἐκείνου sans expliciter davantage son référent que ne le fait le grec.
- source_word: κληρονόμοι
  choice: héritiers
  rationale: Conserve l’image biblique et juridique de l’héritage.
- source_word: γενηθῶμεν
  choice: nous devenions
  rationale: Rend le subjonctif aoriste de γίνομαι après ἵνα et exprime l’entrée dans un nouveau statut.
- source_word: κατ’ ἐλπίδα
  choice: selon l’espérance
  rationale: Reproduit de près κατά avec l’accusatif et maintient le lien syntaxique quelque peu ouvert entre le statut d’héritiers et l’espérance eschatologique.
- source_word: ζωῆς αἰωνίου
  choice: de la vie éternelle
  rationale: Exprime naturellement le contenu ou l’objet de l’espérance et conserve la formulation biblique reconnue « vie éternelle ».
theological_decisions:
- issue: Sens de δικαιωθέντες dans ce contexte de salut
  choice: justifiés
  alternative: déclarés justes
  rationale: « Justifiés » préserve le lien lexical avec δικαιόω et la tension théologique du terme sans préciser si l’accent porte uniquement sur une déclaration judiciaire ou sur un sens plus large.
- issue: Référent de ἐκείνου dans τῇ ἐκείνου χάριτι
  choice: sa grâce
  alternative: la grâce de Dieu / la grâce de Jésus-Christ
  rationale: Le possessif français garde une certaine ouverture quant au référent, comme le grec, sans imposer une identification explicite absente de ce verset.
- issue: Relation exprimée par κατ’ ἐλπίδα ζωῆς αἰωνίου
  choice: selon l’espérance de la vie éternelle
  alternative: dans l’espérance de la vie éternelle
  rationale: La formulation principale suit de près la préposition grecque, tandis que la note signale une autre expression idiomatique possible sans trancher excessivement la relation syntaxique.
translation_notes:
  register: Français international moderne, digne et concis. La phrase conserve la structure de finalité du grec, le passif théologique « justifiés » et l’image des héritiers. « Selon l’espérance » est légèrement soutenu, mais reste compréhensible et permet de préserver la formulation et l’ambiguïté de l’original.
