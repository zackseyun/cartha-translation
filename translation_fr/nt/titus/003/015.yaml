id: TIT.3.15
reference: Titus 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: fr
  text: Tous ceux qui sont avec moi te saluent. Salue ceux qui nous aiment dans la foi[a]. Que la grâce soit avec vous tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la fidélité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: saluent
  rationale: Dans une conclusion épistolaire, « saluer » rend directement et naturellement le sens de ἀσπάζομαι.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Tous ceux qui sont avec moi
  rationale: Cette formulation conserve à la fois πάντες (« tous ») et l’idée des personnes qui accompagnent Paul.
- source_word: ἄσπασαι
  choice: Salue
  rationale: L’impératif singulier est rendu par le tutoiement, cohérent avec le destinataire individuel de la lettre.
- source_word: φιλοῦντας
  choice: aiment
  rationale: « Aiment » exprime simplement l’affection personnelle indiquée par φιλέω, sans l’affaiblir ni la préciser excessivement.
- source_word: ἐν πίστει
  choice: dans la foi
  rationale: Cette expression rend la foi comme la sphère ou le fondement commun de leur amour. Le grec reste assez ouvert pour permettre aussi « dans la fidélité », possibilité signalée en note.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: « La grâce » correspond à la bénédiction paulinienne habituelle et conserve l’article grec de manière naturelle en français.
- source_word: μετὰ πάντων ὑμῶν
  choice: soit avec vous tous
  rationale: Le verbe sous-entendu est explicité pour former une bénédiction française naturelle, tandis que « vous tous » préserve πάντων et le pluriel ὑμῶν.
theological_decisions:
- issue: Sens de πίστις dans ἐν πίστει
  choice: dans la foi
  alternative: dans la fidélité
  rationale: Dans cette salutation, « dans la foi » exprime le plus naturellement le lien commun des croyants sans imposer une interprétation plus étroite. Le sens possible de fidélité demeure indiqué en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement marque que les deux premiers verbes s’adressent à Tite personnellement ; le pluriel « vous tous » dans la bénédiction finale suit explicitement le grec.
