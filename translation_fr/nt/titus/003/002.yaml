  naturalness: La phrase est naturelle en français international moderne. « Être pacifiques, conciliants » et « faire preuve d’une entière douceur » forment une exhortation fluide et de registre approprié.
  terminology: « Pacifiques » rend bien ἀμάχους; « conciliants » exprime de façon idiomatique la souplesse raisonnable de ἐπιεικεῖς; « douceur » convient à πραΰτης tout en évitant une répétition. « Envers tous » conserve le sens générique et universel de πάντας ἀνθρώπους.
