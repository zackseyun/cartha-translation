id: TIT.3.2
reference: Titus 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: fr
  text: ne dire du mal de personne[a], être pacifiques, conciliants, et faire preuve d’une entière douceur envers tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne calomnier personne ». Le verbe grec peut désigner des paroles injurieuses ou offensantes plus largement que la calomnie au sens strict.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: personne
  rationale: Complément de βλασφημεῖν; « personne » exprime naturellement la portée universelle de l’interdiction.
- source_word: βλασφημεῖν
  choice: calomnier
  rationale: Dans ce contexte de relations humaines, le verbe désigne des paroles qui portent atteinte à autrui. « Calomnier » est concis, tandis qu’une note conserve la possibilité d’un sens plus large.
- source_word: ἀμάχους εἶναι
  choice: être pacifiques
  rationale: L’adjectif décrit ceux qui ne cherchent ni dispute ni affrontement; « pacifiques » est naturel et accessible en français moderne.
- source_word: ἐπιεικεῖς
  choice: conciliants
  rationale: Le terme évoque une attitude raisonnable, indulgente et non rigide. « Conciliants » le distingue de πραΰτητα sans durcir son sens.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: faire preuve d’une entière douceur
  rationale: La tournure rend le participe « manifestant » et conserve l’intensification de πᾶσαν. « Douceur » exprime ici une force maîtrisée et humble, non de la faiblesse.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: envers tous
  rationale: La formulation idiomatique conserve l’orientation relationnelle de πρός et la portée universelle de πάντας ἀνθρώπους, sans suggérer un référent exclusivement masculin.
theological_decisions:
- issue: Portée générique de πάντας ἀνθρώπους
  choice: envers tous
  alternative: envers tous les êtres humains
  rationale: Le groupe grec vise toute personne, sans restriction de sexe. « Envers tous » est inclusif, naturel et conserve cette universalité.
- issue: Rapport entre ἐπιεικεῖς et πραΰτητα
  choice: « conciliants » puis « douceur »
  alternative: « doux » puis « douceur »
  rationale: Le choix évite une répétition française qui effacerait la distinction entre deux termes grecs voisins, tout en préservant leur complémentarité éthique.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La phrase demeure un fragment infinitif afin de respecter sa dépendance syntaxique envers l’exhortation du verset précédent.
