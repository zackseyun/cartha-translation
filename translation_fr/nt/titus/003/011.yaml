  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: fr
  text: sachant qu’un tel homme s’est dévoyé et pèche, étant condamné par lui-même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auto-condamné ». Le grec peut indiquer qu’il est condamné par sa propre conduite ou par son propre témoignage contre lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe circonstanciel se rattache à l’instruction du verset précédent. « Sachant » conserve ce lien sans préciser indûment une valeur causale.
- source_word: ἐξέστραπται
  choice: s’est dévoyé
  rationale: Le parfait exprime un état présent résultant d’une déviation antérieure. « S’est dévoyé » rend à la fois le mouvement hors de la bonne voie et son résultat durable.
- source_word: ὁ τοιοῦτος
  choice: un tel homme
  rationale: L’expression grecque est au masculin singulier et désigne l’individu qui provoque des divisions au verset précédent.
- source_word: ἁμαρτάνει
  choice: pèche
  rationale: Le présent décrit son activité actuelle. Le français idiomatique « pèche » évite de surcharger l’aspect verbal tout en maintenant l’affirmation.
- source_word: ὢν
  choice: se condamnant
  rationale: La tournure participiale française relie naturellement le dernier prédicat à la conduite précédente, sans imposer une relation causale plus explicite que le grec.
- source_word: αὐτοκατάκριτος
  choice: se condamnant lui-même
  rationale: 'Cette formulation garde la force réflexive de l’adjectif : sa propre conduite ou son propre témoignage prononce sa condamnation, sans nécessairement évoquer un jugement judiciaire formel.'
theological_decisions:
- issue: Référence masculine dans ὁ τοιοῦτος
  choice: un tel homme
  alternative: une telle personne
  rationale: Le grec emploie ici une forme masculine singulière renvoyant à l’individu factieux du contexte immédiat. La traduction conserve ce marquage sans en tirer une règle plus générale.
- issue: Portée de αὐτοκατάκριτος
  choice: se condamnant lui-même
  alternative: condamné par lui-même
  rationale: Le texte présente cet homme comme condamné par sa propre conduite ou son propre témoignage. Cette formulation maintient la tension du grec sans transformer l’expression en déclaration explicite sur le jugement final.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste liée au verset précédent par « sachant ». « S’est dévoyé » est courant et rend le parfait grec sans la connotation sexuelle possible de « perverti ». Le seul appel de note [a] est placé immédiatement après l’expression concernée.
