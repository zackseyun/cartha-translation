id: TIT.3.13
reference: Titus 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ζηνᾶν τὸν νομικὸν καὶ ⸀Ἀπολλῶν σπουδαίως πρόπεμψον, ἵνα μηδὲν αὐτοῖς λείπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: fr
  text: Aide avec empressement Zénas, le juriste, et Apollos à poursuivre leur voyage[a], afin qu’ils ne manquent de rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Fais partir avec empressement Zénas, le juriste, et Apollos. » Le verbe grec peut inclure l’idée de fournir une aide concrète pour le voyage, et pas seulement celle de faire partir quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: Zénas
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: τὸν νομικὸν
  choice: le juriste
  rationale: νομικός désigne une personne versée dans le droit ou la Loi. Dans cette apposition à Zénas, « le juriste » constitue une désignation concise et naturelle, sans préciser indûment s’il s’agit du droit civil ou de la loi religieuse.
- source_word: Ἀπολλῶν
  choice: Apollos
  rationale: Forme traditionnelle et courante du nom propre en français biblique.
- source_word: σπουδαίως
  choice: avec empressement
  rationale: L’adverbe exprime le zèle, le soin et la promptitude sérieuse. « Avec empressement » rend naturellement cette idée sans la réduire à la seule vitesse.
- source_word: πρόπεμψον
  choice: aide … à poursuivre leur voyage
  rationale: Dans un contexte de voyage, προπέμπω implique souvent d’aider des voyageurs à repartir et de pourvoir concrètement à leurs besoins, et non simplement de les congédier.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: afin qu’ils ne manquent de rien
  rationale: Cette formulation naturelle conserve la valeur finale de ἵνα et la portée générale de μηδέν.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Juriste » évite l’association moderne trop étroite de « avocat » avec la représentation devant un tribunal. La tournure « aide … à poursuivre leur voyage » explicite sobrement la dimension pratique probable de προπέμπω.
