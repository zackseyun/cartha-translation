lexical_decisions:
- source_word: αἱρετικὸν
  choice: qui provoque des divisions
  rationale: Dans ce contexte, le terme désigne vraisemblablement une personne qui suscite des factions ou des divisions. Cette formulation restitue ce sens sans importer la notion ecclésiastique plus tardive d’« hérétique ».
- source_word: ἄνθρωπον
  choice: celui
  rationale: Le participe nominal français « celui qui » désigne naturellement l’individu visé et s’accorde avec la forme masculine singulière du grec, sans alourdir la phrase par « un homme ».
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: après un premier et un second avertissement
  rationale: La formulation conserve la succession explicite de deux interventions correctives. « Avertissement » exprime en français courant la force de νουθεσία, qui vise à reprendre et à corriger.
- source_word: παραιτοῦ
  choice: Écarte
  rationale: L’impératif demande de refuser ou de cesser l’association avec cette personne. « Écarte » exprime une mesure ferme de discipline communautaire sans suggérer nécessairement une condamnation définitive.
theological_decisions:
- issue: Faut-il rendre αἱρετικὸν par le vocabulaire doctrinal tardif de l’hérésie ou par son sens probable de division sectaire ?
  choice: qui provoque des divisions
  alternative: hérétique ; factieux
  rationale: Le contexte porte sur la conduite d’une personne qui persiste malgré des avertissements répétés. La traduction choisie préserve le sens communautaire probable du terme grec et évite de lui imposer une catégorie doctrinale technique développée ultérieurement.
translation_notes:
  register: Français international moderne, clair et digne. « Écarte » garde la brièveté impérative du grec ; « celui qui provoque des divisions » privilégie la clarté immédiate tout en préservant en note les principales possibilités lexicales.
