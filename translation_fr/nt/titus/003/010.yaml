translation:
  language: fr
  text: Évite une personne qui provoque des divisions après l’avoir avertie une première et une deuxième fois,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une personne factieuse » ; traduction traditionnelle : « un hérétique ». Le terme grec désigne probablement ici quelqu’un qui crée des factions ou des divisions.'
