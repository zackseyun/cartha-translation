source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: fr
  text: Il nous a sauvés, non pas à cause des œuvres accomplies dans la justice[a] que nous avons faites nous-mêmes, mais selon sa miséricorde, par le bain de la régénération[b] et le renouvellement par l’Esprit Saint[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la droiture ». Le mot grec peut désigner la justice ou la droiture.
    reason: alternative_reading
  - marker: b
    text: Le « bain » peut évoquer le baptême, une purification imagée, ou les deux ; le grec ne tranche pas explicitement.
    reason: lexical_alternative
  - marker: c
    text: Ou « le renouvellement de l’Esprit Saint ». La construction grecque permet différentes manières de relier l’Esprit Saint au renouvellement.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ
  choice: ce n’est pas à cause d’œuvres accomplies dans la justice
  rationale: La tournure « à cause de » exprime naturellement en français le fondement nié par ἐκ, en contraste avec « selon sa miséricorde ». « Dans la justice » conserve le terme paulinien sans transformer les œuvres en moyen de justification.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: que nous aurions faites nous-mêmes
  rationale: Le conditionnel passé s’intègre à la construction française « ce n’est pas… que » et évite de nier que de telles œuvres aient réellement été accomplies. « Nous-mêmes » restitue l’emphase du pronom ἡμεῖς.
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος
  choice: mais selon sa miséricorde
  rationale: « Selon » reflète sobrement κατά et maintient le contraste entre les œuvres humaines et la miséricorde divine.
- source_word: ἔσωσεν ἡμᾶς
  choice: qu’il nous a sauvés
  rationale: « Sauver » est le terme français naturel et établi dans ce contexte sotériologique.
- source_word: διὰ λουτροῦ
  choice: par le bain
  rationale: « Bain » rend directement λουτρόν et laisse ouverte l’allusion possible au baptême comme la portée imagée de purification, sans expliciter l’une au détriment de l’autre.
- source_word: παλιγγενεσίας
  choice: de la régénération
  rationale: « Régénération » conserve la densité et la précision du terme grec παλιγγενεσία; l’idée de nouvelle naissance reste présente sans paraphrase.
- source_word: καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: et le renouvellement par l’Esprit Saint
  rationale: « Renouvellement » rend le nom ἀνακαίνωσις. « Par l’Esprit Saint » exprime la source ou l’agent probable tout en signalant en note l’autre analyse possible du génitif.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: En français moderne, « justice » est le correspondant formel et théologique habituel de δικαιοσύνη. Une note conserve « droiture », qui peut mieux exprimer ici la qualité morale des œuvres.
- issue: Portée de λουτροῦ παλιγγενεσίας
  choice: le bain de la régénération
  alternative: le lavage de la nouvelle naissance
  rationale: Le texte principal garde l’image concrète du bain et le terme théologique de régénération, sans décider si λουτρόν désigne explicitement le baptême, une purification imagée ou les deux.
- issue: Relation de πνεύματος ἁγίου avec ἀνακαινώσεως
  choice: le renouvellement par l’Esprit Saint
  alternative: le renouvellement de l’Esprit Saint
  rationale: Le génitif grec peut indiquer la source ou l’agent du renouvellement, et la proximité syntaxique le rattache surtout à ἀνακαινώσεως. La traduction principale explicite l’agence la plus probable; la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure contrastive est conservée. « Bain » est préféré à « lavage », moins naturel ici, afin de préserver l’image grecque et son ambiguïté baptismale. Les trois marqueurs de note figurent dans le texte principal.
