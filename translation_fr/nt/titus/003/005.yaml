  source_fidelity: Le conditionnel passé (« aurions faites ») n’est pas justifié par l’aoriste indicatif ἐποιήσαμεν et introduit une nuance hypothétique absente du grec. La révision emploie l’indicatif passé composé et conserve l’emphase de ἡμεῖς par « nous-mêmes ». Elle maintient le contraste entre les œuvres comme fondement exclu et la miséricorde comme fondement de l’action salvatrice.
  naturalness: La construction initiale « ce n’est pas …, que …, mais selon … qu’il … » est lourde et grammaticalement mal articulée. La formulation révisée est idiomatique en français moderne, tout en gardant clairement les liens syntaxiques du grec.
  terminology: « Justice », « miséricorde », « sauvés », « bain », « régénération » et « renouvellement » sont conservés. « Bain » garde sans décision interprétative l’imagerie de λουτρόν. « Par l’Esprit Saint » rend de manière plausible l’agent du renouvellement, tandis que la note conserve l’autre analyse possible.
