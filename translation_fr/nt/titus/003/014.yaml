revisions:
- from: Que les nôtres aussi apprennent à se consacrer aux bonnes œuvres pour répondre aux besoins indispensables[a][b][c], afin de ne pas rester sans fruit.
  to: Que les nôtres[a] apprennent aussi à s’appliquer aux bonnes œuvres[b] pour satisfaire aux besoins nécessaires[c], afin qu’ils ne soient pas sans fruit.
  rationale: 'Révision limitée pour une formulation française plus idiomatique et une correspondance plus directe avec le grec : « s’appliquer à » rend l’engagement continu de προΐστασθαι sans trancher en faveur de la direction; « satisfaire aux besoins nécessaires » évite le pléonasme tout en préservant ἀναγκαίας χρείας; la clause finale est rendue sans nuance aspectuelle ajoutée. Les notes sont conservées et rattachées à leurs expressions respectives.'
  reviewer_model: gpt-5.6-terra
