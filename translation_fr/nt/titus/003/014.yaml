review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’exhortation (μανθανέτωσαν), le groupe communautaire (οἱ ἡμέτεροι), les « bonnes œuvres » et la finalité négative. Toutefois, « besoins indispensables » est redondant et affaiblit la formulation grecque, qui vise des besoins nécessaires/concrets. « satisfaire aux besoins nécessaires » exprime plus directement εἰς τὰς ἀναγκαίας χρείας. L’infinitif présent προΐστασθαι garde une nuance d’application soutenue, bien rendue par « s’appliquer à »; la possibilité « prendre l’initiative » reste en note.
  naturalness: « Que les nôtres aussi apprennent » est une tournure française correcte, mais « Que les nôtres apprennent aussi » est légèrement plus fluide. « Rester sans fruit » est compréhensible, mais « ne pas être sans fruit » est plus direct et conserve sans ajout aspectuel l’état exprimé par ὦσιν. Les appels de notes doivent être placés auprès des expressions qu’ils documentent, plutôt que tous à la fin du même groupe.
  terminology: « Les nôtres » est un bon équivalent collectif, naturel dans ce registre, sans restriction de genre. « Bonnes œuvres » maintient le lexique de l’épître. « S’appliquer aux bonnes œuvres » convient ici sans imposer un sens de direction ecclésiale; la note conserve légitimement la nuance possible de prise d’initiative. « Besoins nécessaires » évite la redondance de « indispensables ».
  issues:
  - severity: medium
    issue: « besoins indispensables » est stylistiquement redondant.
    rationale: ἀναγκαίας qualifie χρείας comme nécessaires ou pressantes; « indispensables » avec « besoins » crée un pléonasme peu naturel en français. « Besoins nécessaires » reste proche du grec et du choix lexical attesté.
  - severity: low
    issue: Regroupement des trois appels de notes après « indispensables ».
    rationale: Les notes a et b concernent respectivement « les nôtres » et « s’appliquer aux bonnes œuvres »; les ancrer à ces expressions améliore la lisibilité et respecte leur portée.
  - severity: low
    issue: « rester sans fruit » ajoute une légère nuance durative.
    rationale: Le grec exprime simplement l’état négatif visé. « ne pas être sans fruit » est plus sobre et plus directement fidèle.
  revised_text: Que les nôtres[a] apprennent aussi à s’appliquer aux bonnes œuvres[b] pour satisfaire aux besoins nécessaires[c], afin qu’ils ne soient pas sans fruit.
  revised_footnotes:
